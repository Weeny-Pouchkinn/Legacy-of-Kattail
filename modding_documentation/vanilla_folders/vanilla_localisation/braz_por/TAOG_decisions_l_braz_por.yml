l_braz_por:
 HOL_recall_conrad_helfrich: "Reconvocar Conrad Helfrich das Índias"
 HOL_recall_conrad_helfrich_desc: "Nestes tempos de urgência, devemos priorizar nossa terra natal acima de tudo. Conrad Helfrich, o melhor almirante da Marinha Real Neerlandesa, deve voltar para os Países Baixos."
 INS_is_taking_volksraad: "Está atualmente aprovando uma lei no Volksraad"
 INS_volksraad_cat: "O Volksraad"
 INS_volksraad_cat_desc: "O Conselho Popular, conhecido em neerlandês como Volksraad, foi estabelecido em 1918 como uma tentativa de introduzir a democracia nas Índias Orientais, como parte da implementação das chamadas \"políticas éticas\". Seus assentos são ocupados tanto por oficiais neerlandeses quanto indonésios, selecionados por diferentes meios. Embora os Países Baixos mantenham um direito de veto incondicional, o Volksraad pode propor e aprovar moções e projetos de lei para o governo."
 INS_volksraad_allow_language_in_schools: "Permitir o uso do idioma indonésio nas escolas"
 INS_volksraad_allow_language_in_schools_desc: "O acesso ao ensino superior nas Índias é amplamente restrito aos neerlandeses e às classes abastadas de indonésios que falam neerlandês, já que este é o único idioma no qual o ensino superior é ministrado. Uma moção em andamento no Volksraad para abrir escolas de língua indonésia aguarda uma decisão do governador-geral."
 INS_volksraad_allow_language_in_government: "Permitir o uso do idioma indonésio no governo"
 INS_volksraad_allow_language_in_government_desc: "Os cargos governamentais nas Índias, incluindo os do Volksraad, exigem fluência no idioma neerlandês, o que levou muitos membros do conselho, especialmente representantes das comunidades nativas, a questionar o caráter democrático da instituição. Eles apresentaram uma moção defendendo que posições governamentais possam ser preenchidas por falantes do indonésio sempre que possível."
 INS_volksraad_remove_education_quotas: "Abolir o sistema de cotas na educação"
 INS_volksraad_remove_education_quotas_desc: "O sistema educacional nas Índias Orientais atualmente opera por meio de cotas, nas quais um número específico de estudantes indonésios e neerlandeses devem ser admitidos. Essa política tem sido alvo de controvérsia no Volksraad devido à percepção de que favorece injustamente os neerlandeses. Embora possamos permitir que o Volksraad continue debatendo por anos sobre como reformar o sistema, pode ser mais adequado abolir completamente o sistema de cotas."
 INS_volksraad_reduce_rubber_export_tax: "Reduzir o imposto sobre a exportação privada de borracha"
 INS_volksraad_reduce_rubber_export_tax_desc: "Atualmente há um imposto extremamente elevado sobre empresas privadas que exportam borracha, o que nos permite manter o monopólio do mercado. No entanto, isso resultou em estagnação econômica em algumas regiões, já que plantações privadas não conseguem manter sua operação. Na época, essa medida foi considerada válida, mas o protecionismo internacional decorrente da Grande Depressão tornou nossa economia de exportação de borracha muito menos lucrativa. Talvez seja vantajoso reduzir o imposto para estimular a economia."
 INS_volksraad_knil_rank_limit: "Aprovar leis contra a discriminação para patentes militares"
 INS_volksraad_knil_rank_limit_desc: "Embora não exista uma regra formal que impeça os nativos indonésios de ascenderem nas fileiras do KNIL, há uma norma não oficial que os impede de progredir além do posto de coronel, mesmo entre os oficiais de melhor desempenho. Diversos grupos no Volksraad vêm pressionando o governo a reconhecer o mérito desses oficiais indonésios."
 INS_volksraad_legalize_displaying_flag: "Legalizar a exibição da bandeira vermelha e branca"
 INS_volksraad_legalize_displaying_flag_desc: "A bandeira vermelha e branca da Indonésia está atualmente proibida de ser exibida em público devido às suas ligações com organizações nacionalistas e anticoloniais. Sua legalização seria uma forma de demonstrar nossa disposição em cooperar e poderia conter a crescente radicalização dos nacionalistas em todo o arquipélago."
 INS_volksraad_education_subsidies_for_indonesians: "Ampliar subsídios educacionais para residentes não neerlandeses"
 INS_volksraad_education_subsidies_for_indonesians_desc: "Há um debate contínuo no Volksraad acerca dos subsídios e bolsas concedidos a estudantes neerlandeses nas Índias Orientais. Diversos representantes das comunidades nativas têm defendido a expansão desse sistema para que inclua qualquer estudante, independentemente de sua origem. Isso poderia melhorar nossa imagem junto à população, mas teria um custo expressivo."
 INS_volksraad_indonesian_national_language: "Tornar o indonésio um idioma nacional oficial"
 INS_volksraad_indonesian_national_language_desc: "O indonésio tornou-se um idioma comum em muitas partes do arquipélago, servindo como ponte linguística para diversas culturas. Com o indonésio já permitido na educação e em cargos governamentais, muitos representantes do Volksraad têm solicitado seu reconhecimento legal como língua oficial da colônia, compartilhando do mesmo status que o neerlandês."
 INS_volksraad_official_flag: "Oficializar a bandeira indonésia"
 indonesia_volksraad_official_flag_effect_tt: "Nossa bandeira mudará para a bandeira vermelha e branca."
 INS_volksraad_official_flag_desc: "As moções no Volksraad em favor da autonomia foram bem-sucedidas e o que há poucos anos era conhecido como Índias Orientais Holandesas agora tornou-se o Domínio da Indonésia. Nossa bandeira deve ser ajustada para refletir essas mudanças."
 indonesia_volksraad_passed_6: "Aprovou leis contra a discriminação no Exército"
 INS_autonomy_indonesian_in_schools: "Idioma indonésio permitido nas escolas"
 INS_autonomy_indonesian_in_govenment: "Idioma indonésio permitido no governo"
 INS_autonomy_no_education_quotas: "Cotas na educação abolidas"
 INS_autonomy_reduced_rubber_tax: "Imposto sobre exportação de borracha reduzido"
 INS_autonomy_knil_rank_limit: "Leis contra a discriminação aprovadas no Exército"
 INS_autonomy_flag_legalized: "Exibição da bandeira vermelha e branca legalizada"
 INS_autonomy_education_subsidies: "Subsídios para a educação disponíveis para indonésios"
 INS_autonomy_national_language: "Idioma indonésio reconhecido"
 INS_autonomy_official_flag: "Bandeira indonésia em uso"
 INS_move_capital_to_amsterdam: "Mover a capital para Amsterdã"
 INS_move_capital_to_batavia: "Mover a capital para a Batávia"
 INS_sukarno_is_dead: "Sukarno está morto"
 INS_atjeh_management: "Ação policial em Atjeh"
 INS_atjeh_management_2: "Integrar Atjeh"
 INS_soetardjo_petition: "Petição de Soetardjo aguardando aprovação"
 INS_soetardjo_petition_desc: "A conferência convocada por Soetardjo foi realizada, concluindo que o Estado [INS.GetAdjective] deve cumprir uma série de requisitos econômicos para garantir autossuficiência. Precisamos demonstrar progresso claro em direção a esses objetivos, caso contrário, o governo [HOL.GetAdjective] poderá revogar a decisão e manter o status quo."
 INS_soetardjo_petition_refresh_tt: "Reativa a missão: §YPetição de Soetardjo aguardando aprovação§!, com duração de §Y120 dias§!."
 INS_soetardjo_pending: "O Volksraad debate a petição de autonomia de Soetardjo"
 INS_soetardjo_pending_desc: "Soetardjo, um membro do Volksraad conhecido por liderar o movimento nacionalista pacífico, está organizando uma petição solicitando maior autonomia para [INS.GetNameDef] e a realização de uma conferência entre representantes neerlandeses e indonésios, com o objetivo de discutir o desejo dos indonésios de se tornarem autônomos dentro da comunidade neerlandesa. Essa petição está sendo debatida no Volksraad e, quando as discussões forem concluídas, caberá a nós decidir como responder, já que suas consequências são de grande importância."
 INS_flag_legalized: "É permitido exibir a bandeira vermelha e branca"
 INS_owned_states_at_game_start_tt: "Todos os estados indonésios"
 INS_win_condition_base_republic_warning: "Destruir as Índias Orientais"
 INS_win_condition_base_republic_warning_desc: "Devemos continuar a lutar, recrutar civis e garantir que a chama dentro de cada alma indonésia permaneça acesa. Quando derrubarmos a administração das Índias, o Estado [HOL.GetAdjective] será forçado a capitular."
 INS_win_condition_base_republic_real: "Destruir as Índias Orientais"
 INS_win_condition_base_republic_real_desc: "Devemos continuar a lutar, recrutar civis e garantir que a chama dentro de cada alma indonésia permaneça acesa. Quando derrubarmos a administração das Índias, o Estado [HOL.GetAdjective] será forçado a capitular."
 will_complete_when_conditions_met_tt: "Isto será selecionado automaticamente assim que os pré-requisitos forem atendidos."
 INS_militias_cat: "Laskar Rakyat"
 INS_militias_basic_summon: "Mobilizar civis"
 INS_militias_basic_summon_desc: "Recrutaremos jovens adultos e estudantes motivados pela independência da Indonésia para integrar o TKR como parte de milícias armadas."
 INS_militias_kris_repayment: "Milícias KRIS exigem investimentos em Sulawesi"
 INS_militias_di_mission: "O Darul Islam exige representação"
 INS_militias_jakarta_pemuda_mission: "Pemudas de Jacarta exigem melhorias na educação"
 INS_militias_railway_pemuda_mission: "Força da Juventude Ferroviária exige combate"
 INS_revolution_planning_cat: "Revolução clandestina"
 INS_revolution_planning_hq: "Estabelecer um quartel-general revolucionário em [FROM.GetName]"
 INS_revolution_planning_hq_desc: "Estabeleceremos nosso quartel-general de milícias em [FROM.GetName], que funcionará como comando central para as bases de milícia em todo o arquipélago. Nosso quartel-general e o território ao seu redor terão prioridade nas missões de infiltração e permanecerão sob nosso controle direto."
 INS_revolution_planning_hq_tt: "Construiu no máximo §Y3§! quartéis-generais revolucionários"
 INS_revolution_planning_hq_DONE: "Quartel-general revolucionário"
 INS_revolution_planning_hq_DONE_desc: "Este é o nosso quartel-general revolucionário, onde nossas milícias se apresentam. Este estado ficará sob nosso controle assim que declararmos independência."
 INS_revolution_planning_hq_DONE_trigger_tt: "Só é possível estabelecer um QG"
 INS_revolution_planning_envoy_DONE_trigger_tt: "Não é possível estabelecer várias bases no mesmo estado"
 INS_revolution_planning_envoy_DONE: "Base de milícia em [FROM.GetName]"
 INS_has_revolutionary_hq: "Estabeleceu um quartel-general revolucionário"
 INS_revolution_planning_influence_state: "Estabelecer base de milícia em [FROM.GetName]"
 INS_revolution_planning_influence_state_desc: "Enviaremos milícias para estabelecer uma base de milícia em [FROM.GetName], garantindo que os revolucionários locais possam se comunicar com o QG e executar operações com mais eficiência quando declararmos independência."
 INS_revolution_planning_cat_map_name: "Selecione onde gerenciar a atividade da milícia"
 INS_state_revolution_hq_tt: "O estado será controlado por nós após a declaração de independência"
 INS_hq_warning: "§W§RConstruir nosso quartel-general aqui será difícil e consumirá a maior parte de nossos recursos.§!§!"
 INS_revolution_points_remaining_tt: "Pode construir pelo menos mais §Y1§! base de milícia (atualmente restam §Y[?INS_revolution_points_remaining]§!)"
 INS_revolution_planning_influence_state_points_notif_tt: "Poderemos estabelecer uma base de milícia em mais §Y[?INS_starting_revolution_points_count]§! estados §Rque não são Java§!."
 INS_revolution_planning_influence_state_points_notif_tt_1: "Só poderemos estabelecer uma base de milícia em mais §Y1§! estado §Rque não é Java§!."
