 SIA_war_fervor_cat: "Fervor de guerra"
 SIA_war_fervor_cat_desc: "A sede do povo por conflito deve ser administrada com cuidado. Se não for controlada, o fervor bélico se voltará para dentro: um governo que incita o espírito marcial sem direcioná-lo arrisca se tornar o próximo alvo."
 SIA_war_fervor_coup_dummy: "Fervor de guerra em ascensão"
 SIA_war_fervor_coup_dummy_desc: "Se o ímpeto popular pela guerra não encontrar uma válvula de escape, inevitavelmente será direcionado contra nós."
 SIA_urge_restraint: "Incentivar a moderação"
 SIA_war_fervor_coup: "Golpe iminente"
 SIA_modify_cultural_mandates: "Modifica $idea_SIA_thai_cultural_mandates$ em:"
 SIA_mandate_1: "Mandato Um"
 SIA_mandate_1_desc: "O país, o povo e a nacionalidade devem ser chamados de tailandeses."
 SIA_mandate_1_tt: "O Estado §Y[THIS.GetAdjective]§! passará a se chamar §Y$SIA_thailand$§!"
 SIA_mandate_2: "Mandato Dois"
 SIA_mandate_2_desc: "O povo tailandês não deve exercer qualquer atividade comercial sem considerar o benefício e a segurança da nação.\n\nO povo tailandês não deve revelar a estrangeiros qualquer informação que possa prejudicar o país. Tais atos constituem traição à nação.\n\nO povo tailandês não deve agir como agente ou porta-voz de estrangeiros sem considerar os interesses da nação tailandesa, nem expressar opiniões ou apoiar estrangeiros em disputas internacionais. Tais atos constituem traição à nação.\n\nO povo tailandês não deve adquirir terras secretamente em nome de estrangeiros de forma que coloque a nação em perigo. Tais atos constituem traição à nação.\n\nQuando alguém trai a nação, é dever do povo tailandês tomar medidas rápidas e decisivas para impedir o ato."
 SIA_mandate_3: "Mandato Três"
 SIA_mandate_3_desc: "Cessar a referência ao povo tailandês de forma inconsistente com o nome da nacionalidade, ou conforme a preferência de qualquer grupo.\n\nUtilizar o nome \"tailandês\" para se referir a todos, sem subdivisões."
 SIA_mandate_4: "Mandato Quatro"
 SIA_mandate_4_desc: "Quando vir a bandeira nacional sendo hasteada ou arriada conforme o costume governamental, ou ouvir o toque da corneta ou apito de saudação, ou for dado o sinal para hastear ou arriar a bandeira, honre a bandeira conforme o regulamento ou o costume.\n\nQuando o hino nacional for ouvido, seja em função oficial ou em qualquer cerimônia, os participantes ou presentes deverão prestar honras conforme o regulamento ou o costume.\n\nAo observar qualquer pessoa que não esteja demonstrando o devido respeito, repreenda-a para que compreenda a importância de honrar a bandeira nacional, o hino nacional e o hino real."
 SIA_mandate_5: "Mandato Cinco"
 SIA_mandate_5_desc: "O povo tailandês deve esforçar-se para consumir apenas alimentos produzidos com produtos tailandeses.\n\nO povo tailandês deve procurar usar apenas roupas confeccionadas com produtos tailandeses.\n\nO povo tailandês deve apoiar os esforços agrícolas, comerciais, industriais e outras atividades profissionais de seus compatriotas.\n\nO povo tailandês deve utilizar e apoiar quaisquer serviços públicos estabelecidos pelo governo ou por cidadãos tailandeses.\n\nOs tailandeses que exerçam atividades agrícolas, comerciais, industriais ou outras profissões apoiadas por este mandato devem empenhar-se em manter padrões elevados, melhorar a qualidade e conduzir seus negócios com honestidade."
 SIA_mandate_6: "Mandato Seis"
 SIA_mandate_6_desc: "A melodia do hino nacional será a composta por Phra Chenduriyang, arquivada nos registros do Departamento de Belas Artes.\n\nA letra do hino nacional será comunicada pelo Exército."
 SIA_mandate_7: "Mandato Sete"
 SIA_mandate_7_desc: "Todo tailandês deve contribuir para a construção da nação. Todo cidadão apto deve trabalhar em uma carreira estável. Qualquer pessoa sem uma carreira é inútil para a nação e não merece o respeito do povo tailandês."
 SIA_mandate_8: "Mandato Oito"
 SIA_mandate_8_desc: "Quanto ao hino real, encurtaremos a letra e substituiremos a palavra \"Sião\" por \"Tailândia\"."
 SIA_mandate_9: "Mandato Nove"
 SIA_mandate_9_desc: "O povo tailandês deve exaltar, honrar e respeitar a língua tailandesa, e deve sentir orgulho em falá-la.\n\nO povo tailandês deve considerar um dever do bom cidadão estudar a língua nacional e, ao menos, ser capaz de lê-la e escrevê-la. Deve também considerar importante ajudar e apoiar aqueles cidadãos que não falam ou não sabem ler o tailandês para que possam aprendê-lo.\n\nO povo tailandês não deve considerar o local de nascimento, residência ou sotaque regional como motivo de divisão. Todos devem reconhecer que todos os nascidos como tailandeses compartilham o mesmo sangue e falam a mesma língua tailandesa. O local de nascimento ou sotaque é irrelevante.\n\nO povo tailandês deve considerar seu dever comportar-se como bons cidadãos tailandeses e incentivar e instruir aqueles que ainda não conhecem ou compreendem seus deveres quanto às responsabilidades de um bom cidadão da nação tailandesa."
 SIA_mandate_10: "Mandato Dez"
 SIA_mandate_10_desc: "O povo tailandês não deve comparecer a reuniões públicas, locais públicos ou dentro dos limites das cidades sem estar devidamente vestido. Vestimenta inadequada inclui usar apenas roupas íntimas, não usar camisa ou usar um tecido enrolado ao redor do corpo.\n\nA vestimenta apropriada para o povo tailandês consiste em: uniformes, conforme o cargo ou as circunstâncias; trajes internacionais formais; trajes tradicionais formais."
 SIA_mandate_11: "Mandato Onze"
 SIA_mandate_11_desc: "O povo tailandês deve dividir seu tempo em três partes. Uma para o trabalho, uma para atividades pessoais e uma para descanso e sono. Isso deve ser feito de forma ordenada e seguindo um cronograma até que se torne hábito.\n\nO povo tailandês deve realizar suas atividades pessoais normais da seguinte forma: fazer refeições em horários fixos, não mais que quatro por dia; dormir aproximadamente de 6 a 8 horas.\n\nO povo tailandês deve cumprir fielmente seus deveres no trabalho, sem desânimo ou negligência. O descanso e o almoço do meio-dia não devem ultrapassar uma hora. Ao final da jornada de trabalho, deve-se praticar esportes por pelo menos uma hora, ou realizar outras atividades como jardinagem, cuidar de animais ou plantar árvores. Depois, tomar banho e jantar.\n\nÀ noite, o tempo livre deve ser usado para concluir tarefas necessárias, conversar com familiares e amigos, buscar conhecimento ouvindo notícias no rádio ou lendo, ou dedicar-se a atividades de entretenimento e artes, conforme possível."
 SIA_mandate_12: "Mandato Doze"
 SIA_mandate_12_desc: "Em locais ou vias públicas, as pessoas devem auxiliar e proteger crianças, idosos ou pessoas com deficiência.\n\nQuem cumprir o item 1 será considerado um indivíduo culto, digno do respeito do povo tailandês."
 SIA_movie_theater_cat: "$SIA_sala_chaloem_thai_movie_theater$"
 SIA_movie_theater_cat_desc: "O cinema está entre as ferramentas mais poderosas do Estado moderno. Por meio de campanhas propagandísticas e filmes cuidadosamente selecionados, o governo pode moldar a opinião pública, incentivar o patriotismo e sufocar vozes dissidentes."
