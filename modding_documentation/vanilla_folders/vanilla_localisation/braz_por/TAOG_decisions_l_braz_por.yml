 INS_no_raids_allowed_tt: "§W§RIncursões ficarão indisponíveis enquanto esta decisão estiver ativa.§!§!"
 INS_is_deescalating_tt: "Não está realizando uma missão de desescalada"
 INS_escalate_the_conflict: "Escalar o conflito"
 INS_escalate_the_conflict_desc: "Organizaremos protestos e confrontos contra as forças inimigas para aumentar a tensão e a escalada, criando condições para que operações mais agressivas no futuro enfrentem menos pressão internacional."
 INS_escalate_the_conflict_HOL: "$INS_escalate_the_conflict$"
 INS_escalate_the_conflict_HOL_desc: "$INS_escalate_the_conflict_desc$"
 INS_deescalate_the_conflict: "Solicitar mediação internacional"
 INS_deescalate_the_conflict_2: "Ordenar um cessar-fogo"
 INS_deescalate_the_conflict_desc: "Os neerlandeses não negociarão conosco de boa-fé. Para eles, continuamos sendo rebeldes, um incômodo a ser suprimido, e não uma nação a ser respeitada. Mas com as grandes potências do mundo é diferente, e Haia não pode ignorá-las tão facilmente. Buscaremos a mediação internacional e deixaremos que a pressão externa imponha aquilo que nossa própria voz não consegue."
 INS_deescalate_the_conflict_2_desc: "Nossas incursões cumpriram seu objetivo. A guarnição colonial conhece nossa influência e Haia sabe que não estamos intimidados. Contudo, cada ataque dá aos Países Baixos um novo motivo para enviar mais homens e navios, e não estamos prontos para uma guerra aberta. Diremos aos nossos comandantes para segurar o gatilho. O próximo golpe acontecerá quando nós decidirmos, e não quando os neerlandeses nos provocarem."
 INS_renville_tt_HOL: "O Estado §W§Y[USA.GetFlag][USA.GetAdjective]§! nos dará um ultimato. Se não nos rendermos e sairmos da Indonésia, eles §Rdeclararão guerra§! contra nós.§!"
 INS_renville_wont_happen_neutral_tt: "O conflito será encerrado antes que as negociações americanas sejam concluídas, impossibilitando qualquer intervenção."
 INS_renville_explain_USA_tt: "Se o conflito não for resolvido em até §Y365 dias§!:\n\n"
 INS_renville_timer_mission_republic: "Negociações de Renville em andamento"
 INS_renville_timer_mission_HOL: "$INS_renville_timer_mission_republic$"
 INS_national_revolution_peace_negotiation: "Negociar a retirada de [FROM.GetName]"
 indonesia_reduce_escalation_1_effect_tooltip_for_min_4: "Reduz a escalada em §G1§!, até um mínimo de §Y4§!."
 INS_ongoing_influence_process: "Não está estabelecendo uma base de milícia"
 INS_current_revolution_strength_3_tt: "Este estado apresenta §Galta§! atividade de milícia."
 INS_current_revolution_strength_0_tt: "Este estado não apresenta qualquer atividade de milícia."
 INS_has_spent_points_trigger_tt: "Não é possível estabelecer bases de milícia adicionais"
 INS_national_revolution_cat: "Revolução nacional indonésia"
 INS_national_revolution_cat_desc: "Após 350 anos de domínio neerlandês, tomamos as rédeas de nosso destino e declaramos independência. Os Países Baixos não reconhecem nossa autoridade e continuam a governar as Índias como sua colônia, tratando-nos como criminosos.\n\nDevemos expandir nosso controle sobre mais regiões e cidades estratégicas, derrubando o governo neerlandês por dentro. No entanto, é preciso cautela para não agirmos de forma excessivamente agressiva sem o devido planejamento, pois uma escalada precipitada pode provocar uma resposta militar neerlandesa."
 INS_national_revolution_cat_map: "Lançar falsas revoltas"
 INS_national_revolution_dutch_cat: "Milícias revolucionárias nas Índias"
 INS_national_revolution_dutch_cat_desc: "Revolucionários nas Índias Orientais declararam ilegalmente independência e tomaram o controle de regiões das Índias com milícias. Apesar de nossos esforços, não conseguimos restabelecer o controle nessas áreas devido ao grande número de milícias presentes.\n\nPrecisamos detê-los antes que controlem mais cidades e desestabilizem ainda mais a administração das Índias. Se persistirem, medidas militares extremas poderão ser inevitáveis."
 INS_HOL_revolution_not_going_well_tt: "§RSem a Batávia, não podemos governar as Índias, e não teremos escolha senão negociar um acordo de paz com os revolucionários.§!"
 INS_gradual_escalation_republic: "Escalada gradual"
 INS_gradual_escalation_HOL: "Escalada gradual"
 INS_gradual_escalation_republic_desc: "As represálias neerlandesas tornaram-se mais severas após nossas incursões, e suas patrulhas avançam sobre distritos que haviam abandonado meses atrás. Nossos comandantes relatam combates mais intensos em regiões consideradas pacificadas há muito tempo, e nossas baixas aumentam mais rápido do que os recrutadores conseguem substituí-las. O conflito se espalhou para províncias que estavam tranquilas no ano passado."
 INS_gradual_escalation_HOL_desc: "Os relatórios de nossas residências pioram a cada semana. Os rebeldes atacam em distritos onde não se acreditava que operassem e o comando militar na Batávia exige medidas mais duras do que todas as adotadas até então. Em Haia, aqueles que ainda defendem a moderação diminuem a cada reunião de gabinete."
 INS_national_revolution_republic_win_ins_tt: "As milícias republicanas d[INS.GetNameDef] assumirão o §Gcontrole efetivo§! da região e o conflito terminará com uma §Gvitória republicana§!."
 INS_national_revolution_republic_win_hol_tt: "As milícias republicanas d[INS.GetNameDef] assumirão o §Rcontrole efetivo§! da região e o conflito terminará com uma §Rvitória republicana§!."
 INS_national_revolution_dutch_cat_map: "Ver estados ocupados por milícias"
 INS_take_batavia: "Tomar o controle de Java"
 INS_take_batavia_desc: "A concentração gananciosa de investimentos neerlandeses em Java, em detrimento das ilhas orientais, transformou a ilha no calcanhar de Aquiles de toda a colônia. Esta será sua ruína! Devemos avançar sobre Java e destruir as redes de comunicação e suprimento neerlandesas, paralisando a administração das Índias."
 INS_hold_batavia_HOL: "Defender Java"
 INS_hold_batavia_HOL_desc: "As forças republicanas iniciaram uma operação para realocar a maior parte de suas forças para Java, tentando assumir o controle de toda a ilha. Devemos continuar resistindo. A operação é arriscada e nos oferece uma oportunidade de derrubar o governo deles caso fracassem."
 INS_militias_moestopo_mission: "Moestopo exige promoção por seus esforços"
 INS_militias_pki_uprising_mission: "Revolta comunista inevitável"
 INS_pacific_revolution_cat: "Revolução no Pacífico"
 INS_instigate_in_country: "Instigar revolução n[FROM.GetNameDef]"
 INS_instigate_in_country_desc: "Nossa revolução não terminou quando o último soldado colonial foi expulso de solo [ROOT.GetAdjective]. Os trabalhadores e camponeses d[FROM.GetNameDef] sofrem sob o mesmo domínio que já derrubamos e agora enxergam em nós a prova de que o opressor pode ser derrotado. Enviaremos nossos agitadores até eles, distribuiremos panfletos, financiaremos seus sindicatos e alimentaremos as chamas do descontentamento até que as condições para a revolução sejam atingidas."
 INS_launch_revolution: "Chamado para a revolução"
 INS_launch_revolution_desc: "As condições n[FROM.GetNameDef] foram atingidas. Nossos agentes relatam um crescente descontentamento nas fábricas e nos campos, e as células locais do partido estão prontas para agir. Chegou o momento de convocar os trabalhadores e camponeses d[FROM.GetNameDef] a agir e tomar o que lhes é de direito."
 INS_anti_colonialist_bonus: "Espalhar sentimentos anticolonialistas n[FROM.GetNameDef]"
 INS_anti_colonialist_bonus_desc: "O povo d[FROM.GetNameDef] sofre para o benefício de um mestre estrangeiro, servindo a interesses que não são seus. Devemos lembrá-los de que a submissão é uma escolha, e que seus soberanos não são tão fortes quanto aparentam."
 INS_revolutionary_sentiment: "Cooperar com os revolucionários d[FROM.GetNameDef]"
 INS_revolutionary_sentiment_desc: "Há aqueles n[FROM.GetNameDef] que já abraçaram a causa por conta própria. Eles carecem de organização e recursos, mas têm determinação. Ao cooperar com esses grupos, podemos apressar a queda do regime atual, mesmo que isso traga instabilidade e dificulte o controle do país a curto prazo."
 INS_arm_militias: "Armar as milícias locais d[FROM.GetNameDef]"
 INS_arm_militias_desc: "Panfletos e discursos levarão a revolução até certo ponto. Quando chegar o momento, nossos camaradas n[FROM.GetNameDef] precisam estar preparados para lutar. Armas e suprimentos excedentes serão contrabandeados para milícias solidárias à nossa causa, garantindo que as forças de reação enfrentem um povo armado, e não indefeso."
 INS_arm_militias_tt: "Se uma guerra civil eclodir, os comunistas iniciarão com divisões adicionais."
 INS_propoganda_mission: "Espalhar o comunismo pel[FROM.GetNameDef]"
 INS_propoganda_mission_desc: "Organizadores do partido serão enviados ao redor d[FROM.GetNameDef] para estabelecer círculos de leitura, recrutar dentre os sindicatos e levar a mensagem da revolução aos vilarejos. As sementes que plantamos hoje não tardarão para dar frutos."
 INS_abandon_mission: "Abandonar a missão"
 INS_abandon_mission_desc: "Nossos recursos não são infinitos e a luta n[FROM.GetNameDef] exige mais do que podemos oferecer neste momento. Vamos retirar nossos agentes e redirecionar nossos esforços para assuntos mais urgentes."
 INS_aslia_cat: "Unificação do Pacífico"
 INS_integrate_subject: "Integrar [FROM.GetName]"
 INS_integrate_subject_in_progress: "Já está integrando um súdito"
 INS_can_raid_here_HOL: "Estado vulnerável a incursões"
 INS_can_raid_here_HOL_tt: "Este estado é um alvo potencial de uma incursão terrestre de milícia pela República. Se bem-sucedida, o estado será tomado de nós. Para defendê-lo contra incursões, podemos:\n$success_modifier_INS_has_influence_mod_counterplay$\n$success_modifier_INS_defense_modifier_counterplay$\n$success_modifier_INS_naval_dominance_modifier_counterplay$\n- Aumentar a §Ysuperioridade aérea§!\n- Reduzir a inteligência disponível aos inimigos\n- Reduzir a resistência dentro do estado"
 INS_war_escalation_text: "£generic_war_escalation_text_icon Nível de Escalada: §Y[?INS.INS_war_escalation_level]§!"
 INS_war_escalation_level_tt: "§YEscalada atual§!\n\nO nível de escalada aumenta com o tempo, com a §Yocupação de novos estados§! pelas milícias e com as ações tomadas pel[HOL.GetNameDef] para combater a atividade das milícias. Se a situação escalar o suficiente, poderá se transformar em uma §Rguerra total§!."
 INS_war_escalation_1_tt: "§Y[INS.GetName]§!: desbloqueia incursões terrestres"
 INS_war_escalation_2_tt: "§Y[INS.GetName]§!: desbloqueia decisão para ordenar um cessar-fogo"
 INS_war_escalation_3_tt: "§Y[HOL.GetName]§!: desbloqueia focos para solicitar o envolvimento britânico ou francês"
 INS_war_escalation_4_tt: "§Y[HOL.GetName]§!: desbloqueia a decisão para declarar guerra (com penalidades pesadas devido à pressão internacional)\n§Y[INS.GetName]§!: desbloqueia a decisão de solicitar mediação internacional para desescalar"
