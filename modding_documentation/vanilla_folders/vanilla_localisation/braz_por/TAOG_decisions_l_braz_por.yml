 ast_support_for_comrades_idea_improved: "$ast_support_for_comrades_idea$"
 ast_support_for_comrades_idea_improved_desc: "$ast_support_for_comrades_idea$"
 idea_AST_civil_war_on_their_own: "Por conta própria"
 idea_AST_civil_war_on_their_own_desc: "Devemos travar esta guerra sozinhos."
 ast_foreign_communist_influence_idea: "Influência comunista estrangeira"
 ast_foreign_communist_influence_idea_desc: "Comunistas da Austrália estão nos influenciando!"
 open_mae_moh_lignite_mine: "Abrir a mina de lignito de Mae Moh"
 SIA_release_contigency_funds: "Liberar fundos de contingência"
 SIA_release_contigency_funds_tt: "Modifica §Y$idea_SIA_contingency_funds$§! em\n"
 SIA_release_contigency_funds_tt2: "por §Y[?var:SIA_contingency_funds]§! meses. Ao final, os fundos desaparecerão. Quanto mais tempo reunirmos fundos em tempos de paz, mais eles vão durar no período de guerra."
 has_released_contingency_funds: "Liberou fundos de contingência"
 AST_election_approaching_cat: "Eleições se aproximando"
 AST_election_approaching_cat_desc: "Um governo mal se estabeleceu e as novas eleições já estão se aproximando. Os partidos democráticos estão se esforçando para encontrar qualquer coisa que possa aumentar seu apoio, na esperança de que isso seja suficiente para garantir a vitória assim que a votação for iniciada e as urnas começarem a se encher de votos."
 AST_final_reforms_mission: "Reformas finais"
 AST_final_reforms_mission_desc: "Graças a uma liderança estável, inclinações conservadoras e lealdade à Grã-Bretanha, o PUA fortaleceu seu apoio e torna outro mandato cada vez mais provável. Para preservar o apoio popular, seus líderes precisam acelerar reformas.\n\n§YEfeitos enquanto ativo:§!\n§W(Focos §Ydemocráticos§!):\nRedução de §Y7§! dias no tempo para conclusão§!"
 AST_final_reforms_effect_tt: "\nEfeitos enquanto §Y$AST_final_reforms_mission$§! estiver ativo (§Y180§! dias):"
 AST_labor_campaign_tour_mission: "Campanha operária"
 AST_labor_campaign_tour_mission_desc: "Em sua missão de representar todos os cidadãos, o PTA adotou uma perspectiva diferente sobre o imperialismo e a lealdade da Austrália ao império. As necessidades internas devem vir em primeiro lugar e os interesses estrangeiros não devem mais ter prioridade.\n\nBuscando disseminar a mensagem tanto para o partido governante atual como para os eleitores, o PTA deve fazer uma campanha nacional.\n\n§YEfeitos enquanto ativo:§!\n§WAumento diário de votos para o §YP.T.A.§!: §G+0,05§!§!"
 AST_labor_campaign_tour_effect_tt: "\nEfeitos enquanto §Y$AST_labor_campaign_tour_mission$§! estiver ativo (§Y180§! dias):\nAumento diário de votos para o §YP.T.A.§!: §G+0,05§!\n\nEfeitos em §Y180§! dias:"
 AST_election_season_cat: "Período eleitoral"
 AST_election_season_cat_desc: "Um governo mal se estabeleceu e o próximo já está se preparando para assumir. A essa altura, não há muito mais que os partidos possam fazer para conquistar o apoio do povo, mas isso não os impedirá de tentar. O jogo só terminará quando os resultados nas urnas forem divulgados."
 AST_election_countdown: "Contagem regressiva para as eleições"
 AST_election_countdown_desc: "Faltam apenas alguns dias para a abertura das urnas.\n\n§W$AST_expected_election_winner_tt$§!"
 AST_government_formation_period: "Período de formação do governo"
 AST_government_formation_period_desc: "Todo partido quer o poder de decidir suas próprias políticas, mas em certas circunstâncias, um governo de união nacional pode ser a opção mais sensata.\n\n§W§YEfeitos enquanto ativo:§!\n£GFX_trigger_yes $AST_election_recently_concluded$\n\nO $AST_ruling_party$ pode formar um §YGoverno de União Nacional§!.\n\nForme um §YGoverno de União Nacional§! na janela de eleições democráticas, localizada na árvore de foco australiana.§!"
 AST_war_is_coming_cat: "A guerra se aproxima"
 AST_war_is_coming_cat_desc: "As tensões estão se elevando, e tanto os oficiais quanto os cidadãos australianos estão começando a perceber que a guerra pode ser inevitável, independentemente do quanto suas políticas ou interesses desejem o contrário.\n\nDevemos convocar uma reunião do gabinete para decidir os procedimentos em caso de invasão. Mas antes de fazer isso, talvez valha a pena tomar medidas com as quais o gabinete completo pode não concordar."
 AST_seize_civilian_industry: "Apropriar-se da indústria civil"
 AST_seize_civilian_industry_desc: "Apesar de os bens de consumo serem necessários para os nossos cidadãos e para a economia, não há como ignorar que tempos de guerra geram necessidades maiores. A guerra se aproxima e devemos estar preparados para quando ela chegar."
 AST_scorch_the_north: "Devastar o norte"
 AST_scorch_the_north_desc: "Se suspeitarmos de uma invasão pelo norte, existem maneiras de impedir tal avanço, embora elas tenham um preço. Apesar do desenvolvimento de nossos estados nortistas sofrerem um atraso com a política de terra devastada, pode ser exatamente o necessário para impedir os agressores."
 AST_scorch_the_north_tt: "§YEfeitos de uma invasão naval em um estado do Norte:§!"
 AST_the_brisbane_line: "A Linha de Brisbane"
 AST_the_brisbane_line_desc: "As capacidades de defesa australianas podem não ser fortes o bastante para impedir o ataque por completo. Ao adotar uma política que prioriza uma defesa robusta de territórios essenciais, em vez de uma defesa total fraca, poderemos garantir que as partes mais desenvolvidas e habitadas d[AST.GetNameDef] permaneçam sob nosso controle.\n\nEmbora tal política certamente não será aceita por aqueles que rejeitam qualquer nível de rendição, o governo tem a responsabilidade de guiar [AST.GetNameDef] em uma direção razoável."
 AST_summon_the_cabinet_mission: "Convocar o gabinete"
 AST_summon_the_cabinet_mission_desc: "Convoque diplomatas, autoridades e teóricos a Camberra para discutir a possibilidade de uma invasão."
 AST_summon_the_cabinet_tt1: "\nEste evento desestabilizará o governo em exercício, podendo levá-lo ao §Ycolapso§!."
 AST_australian_accusations_modifier: "Acusações australianas"
 AST_cabinet_trust_cat: "Confiança no gabinete"
 AST_cabinet_trust_increase_tt: "\n§GAumenta§! a §Yconfiança no gabinete§!\n"
 AST_cabinet_trust_decrease_tt: "\n§RReduz§! a §Yconfiança no gabinete§!\n"
 AST_cabinet_trust_remove_tt: "§GRemove§! §Yespíritos de confiança no gabinete§!"
 AST_australian_comforts_fund: "£BoP_right_texticon Fundo de Conforto Australiano"
 AST_australian_comforts_fund_desc: "O governo prestará homenagem a uma das vítimas do desastre aéreo de Camberra investindo no Fundo de Conforto Australiano, no qual a viúva sobrevivente trabalha com grande dedicação.\n\nO fundo tem como objetivo amenizar as condições dos soldados australianos no campo de batalha, enviando itens que complementam suas rações e itens de uso pessoal, fortalecendo também o esforço de guerra."
 AST_eminent_successors: "£BoP_right_texticon Sucessores eminentes"
 AST_eminent_successors_desc: "Algumas das vítimas do desastre aéreo de Camberra eram respeitados oficiais do governo. Embora não haja como compensar seus trágicos destinos, talvez a nomeação de alguns sucessores eminentes estabilize o governo e restaure a confiança tanto do público quanto dos ministros."
 AST_critics_to_shame: "£BoP_right_texticon Expor os críticos"
 AST_critics_to_shame_desc: "O desastre aéreo de Camberra abalou toda a nação, deixando o país inteiro de luto. Em momentos como este, sempre surgem aqueles que buscam tirar proveito da situação. Devemos expor os críticos mais enfáticos e mostrar que seu criticismo não passa de uma tentativa de perturbar a ordem."
 AST_approach_the_independents: "£BoP_left_texticon Aproximar-se dos independentes"
 AST_approach_the_independents_desc: "O governo encontra-se instável, à medida que a confiança em sua capacidade de conduzir a Austrália em momentos de turbulência diminui a cada dia. Ao nos aproximarmos dos políticos independentes, poderemos persuadi-los de que uma mudança de governo seria o melhor caminho."
 AST_a_sound_voice: "£BoP_left_texticon Uma voz firme"
 AST_a_sound_voice_desc: "Neste período de turbulência política, uma voz segura parece inspirar confiança entre o povo australiano. Talvez seja essa a voz do próximo líder d[AST.GetNameDef]?"
 AST_challenge_government_narrative: "£BoP_left_texticon Desafiar a narrativa do governo"
 AST_challenge_government_narrative_desc: "Os detalhes divulgados pelo governo sobre o desastre aéreo de Camberra parecem incomuns, levando inevitavelmente à especulação de que algumas informações possam estar sendo ocultadas. Como um oficial experiente da RAAF poderia sofrer um acidente em condições ideais de voo? O governo precisa dar respostas."
 AST_make_a_common_enemy: "Criar um inimigo comum"
 AST_make_a_common_enemy_desc: "As vozes da desconfiança se multiplicaram após a morte de oficiais no desastre aéreo de Camberra. As circunstâncias incomuns do acidente não são o único fator que alimenta as suspeitas de envolvimento estrangeiro, afinal nada une mais o povo do que um inimigo em comum."
 AST_make_a_common_enemy_tt: "§RPossíveis efeitos do evento:§!"
 AST_ensure_cabinet_loyalty: "Garantir a lealdade do gabinete"
 AST_ensure_cabinet_loyalty_desc: "A ameaça de uma moção de censura não representará perigo enquanto a maioria do gabinete votar a favor do governo em exercício. Devemos garantir essa lealdade."
 AST_castle_crumbling_mission: "Castelo ruindo"
 AST_castle_crumbling_mission_desc: "A Austrália volta sua atenção para seus líderes após o trágico desastre aéreo de Camberra. O governo atual continuará digno da confiança pública mesmo diante da perda de membros do gabinete, ou será que uma mudança de liderança seria o melhor caminho?"
 AST_castle_crumbling_mission_event_tt: "§YEfeitos do evento:§!"
 AST_castle_crumbling_mission_complete_tt: "Conclua a missão §YCastelo ruindo§!"
 AST_cabinet_trust_complete_1_flag: "Tomou a decisão: §YCriar um inimigo comum§!"
 AST_cabinet_trust_complete_2_flag: "Tomou a decisão: §YGarantir a lealdade do gabinete§!"
 AST_cabinet_trust_complete_not_tt: "Não obteve o foco §YAustrália Primeiro§!"
 AST_canberra_air_disaster_flag: "$AST_canberra_air_disaster_events.1.t$"
 AST_war_angst_cat: "Angústia de guerra"
 AST_deteriorating_prime_minister_nerves_mission: "Nervos do primeiro-ministro à beira do colapso"
 AST_deteriorating_prime_minister_nerves_desc: "[AST.GetLeader] está sob intensa pressão diante da guerra iminente. Se não encontrar alívio em breve, ele poderá não resistir."
 AST_australian_demands_cat: "Exigências australianas"
 AST_aid_australian_military_construction: "Auxiliar na construção militar australiana"
 AST_aid_australian_military_construction_desc: "A Grã-Bretanha não está preparada para a guerra. Ao auxiliar a Austrália em sua construção militar, poderemos aliviar sua impaciência."
 AST_japanese_war_mission: "Guerra japonesa"
 AST_japanese_war_mission_desc: "A Austrália não deseja enfrentar sozinha [JAP.GetNameDef], seu inimigo mais preocupante. Eles estão nos pressionando a tomar a iniciativa e resolver o conflito que se aproxima o quanto antes."
 AST_resource_acquisition_cat: "Aquisição de recursos"
 AST_request_resource_rights_in_indonesia: "Solicitar direitos de recurso n[INS.GetNameDef]"
 AST_request_resource_rights_in_malaya: "Solicitar direitos de recurso n[MAL.GetNameDef]"
 AST_request_resource_rights_in_burma: "Solicitar direitos de recurso n[BRM.GetNameDef]"
 AST_request_resource_rights_in_indochina: "Solicitar direitos de recurso na Indochina Francesa"
 AST_resource_request_ongoing_flag: "Solicitação de recursos §Yem andamento§!"
 AST_australia_first_movement_cat: "Movimento Austrália Primeiro"
 AST_summons_to_australian_hall: "Convocação para o Australian Hall"
 AST_summons_to_australian_hall_desc: "Em nosso esforço para expandir o grupo político [AST.GetFascistParty], devemos unir e mobilizar nossos apoiadores. O edifício Australian Hall é o local perfeito."
 AST_summons_to_australian_hall_upgrade: "$AST_summons_to_australian_hall$"
 AST_summons_to_australian_hall_upgrade_desc: "$AST_summons_to_australian_hall_desc$"
 AST_print_the_publicist: "Publicar o Publicist"
 AST_print_the_publicist_desc: "O Publicist, boletim do Austrália Primeiro, desempenha um papel importante na adesão de novos apoiadores. Ao publicar uma nova edição, poderemos difundir ainda mais nossa mensagem."
 AST_print_the_publicist_upgrade: "$AST_print_the_publicist$"
 AST_print_the_publicist_upgrade_desc: "$AST_print_the_publicist_desc$"
 AST_call_on_fascists: "[GET_AST_CALL_ON_FASCISTS]"
 AST_call_on_fascists_desc: "Sendo um movimento pequeno e com poucos apoiadores, o Austrália Primeiro por vezes enfrenta dificuldades financeiras. No entanto, um grupo estrangeiro com ideias semelhantes está disposto a financiar nossas ações, oferecendo uma solução para garantir nossa continuidade."
 AST_call_on_japanese_fascists: "Recorrer aos fascistas japoneses"
 AST_call_on_foreign_fascists: "Recorrer aos fascistas estrangeiros"
 AST_a_convenient_disaster: "Um desastre conveniente"
 AST_a_convenient_disaster_desc: "Independentemente da popularidade do Austrália Primeiro, os conservadores sempre resistirão à sua ideologia. Para que o movimento consiga conquistar o poder, pode ser necessário algo mais dramático do que eleições regulares. Talvez algo capaz de mergulhar o governo em uma crise.\n\nNosso movimento não tem a capacidade de provocar tal evento por conta própria, mas nosso apoiador fascista estrangeiro tem. Ao ajudar em nossa ascensão ao poder, fascistas estrangeiros terão a amizade d[AST.GetNameDef]."
 AST_a_convenient_disaster_tt: "\nEste evento desestabilizará o governo em exercício, permitindo que o grupo político §Y[AST.GetFascistParty]§! se torne o partido governante."
 AST_a_convenient_disaster_flag: "§YDesastre aéreo em Camberra§! foi acionado pela decisão §YUm desastre conveniente§!."
 AST_insufficient_funds_mission: "$AST_insufficient_funds$"
 AST_sufficient_funds_tt: "Fundos suficientes (alcançados em §Y[?AST_insufficient_funds:days_left]§! dias)"
 AST_sufficient_funds_tt_2: "§GObtenha§! fundos suficientes"
 AST_lose_sufficient_funds_tt_100: "§RPerde§! fundos suficientes (por §Y100§! dias)\n"
 AST_lose_sufficient_funds_tt_50: "§RPerde§! fundos suficientes (por §Y50§! dias)\n"
 AST_insufficient_funds: "Fundos insuficientes"
 AST_afm_decisions_fascism_upgrade_tt: "\nMelhora o ganho de apoio diário ao fascismo das §Ydecisões do Movimento Austrália Primeiro§!.\n\n"
 AST_afm_decisions_autonomy_upgrade_tt: "\nMelhora o ganho de autonomia das §Ydecisões do Movimento Austrália Primeiro§!.\n\n"
 AST_vichy_out_of_africa_cat: "Expulsar Vichy da África"
 AST_demand_madagascar: "Exigir Madagascar"
 AST_demand_central_africa: "Exigir a África Central"
 AST_demand_southwestern_territories: "Exigir territórios do sudoeste"
 AST_vichy_req_ongoing_flag: "Solicitação de território §Yem andamento§!"
 AST_remove_vichy_out_of_africa_decisions: "\nRemove decisões de §YExpulsar Vichy da África§!.\n"
 AST_big_business_pact_cat: "Pacto das grandes empresas"
 AST_big_business_request_ongoing_flag: "Solicitação das grandes empresas §Yem andamento§!"
 AST_naval_expansion: "$NOR_alt_dem_naval_expansion$"
 AST_naval_expansion_desc: "Importantes figuras empresariais concordaram em investir em reformas industriais alinhadas aos objetivos do grupo político [ROOT.GetFascistParty], contanto que este adote políticas que as beneficiem.\n\nA frota precisará ser ampliada se o Estado [AST.GetAdjective] quiser ter alguma chance contra inimigos com poder naval superior. Por tempo limitado, todos os homens estarão mobilizados nos estaleiros, garantindo o aumento da produção de navios."
 AST_factory_conversions: "Conversões de fábricas"
 AST_factory_conversions_desc: "Importantes figuras empresariais concordaram em investir em reformas industriais alinhadas aos objetivos do grupo político [ROOT.GetFascistParty], contanto que este adote políticas que as beneficiem.\n\nA indústria de defesa deve ser priorizada e as fábricas australianas precisam se adaptar para apoiá-la."
 AST_land_development: "Desenvolvimento de terras"
 AST_land_development_desc: "Importantes figuras empresariais concordaram em investir em reformas industriais alinhadas aos objetivos do grupo político [ROOT.GetFascistParty], contanto que este adote políticas que as beneficiem.\n\nGrande parte do território d[ROOT.GetNameDef] é subdesenvolvido e não industrializado. Ao investir nessas áreas, vamos torná-las adequadas para construção."
 AST_electrical_grid_expansions: "Expansão da rede elétrica"
 AST_electrical_grid_expansions_desc: "Importantes figuras empresariais concordaram em investir em reformas industriais alinhadas aos objetivos do grupo político [ROOT.GetFascistParty], contanto que este adote políticas que as beneficiem.\n\nAo expandir nossa rede elétrica, poderemos promover a produção interna de energia, reduzindo a dependência de importações."
 AST_factory_investments: "Investimentos em fábricas"
 AST_factory_investments_desc: "Importantes figuras empresariais concordaram em investir em reformas industriais alinhadas aos objetivos do grupo político [ROOT.GetFascistParty], contanto que este adote políticas que as beneficiem.\n\nSe quisermos garantir o abastecimento de suprimentos militares e civis em tempos de guerra, é essencial ampliar nossa capacidade industrial."
 AST_develop_port_kemla_steel_medium_decision: "Construir o segundo alto-forno de Port Kembla"
 AST_develop_port_kemla_steel_medium_decision_desc: "Port Kembla tem operado bem com apenas um alto-forno, mas a demanda cresceu a ponto de tornar necessária a construção de um segundo. Isso quase dobrará a produção de aço na região."
 AST_prospect_pilbara_iron_decision: "Abrir a região de Pilbara para a mineração"
 AST_prospect_pilbara_iron_decision_desc: "A região de Pilbara está entre as maiores reservas de minério de ferro do planeta. Porém, por ser uma região extremamente isolada, o investimento necessário para explorar esse recurso é gigantesco... mas os lucros prometem ser equivalentes."
 AST_scale_up_pilbara_mines_steel_decision: "Expandir as minas de Pilbara"
 AST_scale_up_pilbara_mines_steel_decision_desc: "Agora que a região de Pilbara foi aberta à mineração em larga escala, é hora de intensificar os investimentos!"
 AST_pilbara_mining_tt: "Abrir o §Y$STATE_870$§! para novas prospecções liberará uma decisão repetível de aumentar a produção de aço sem limites."
 AST_scale_up_middleback_mines_steel_decision_1: "Expandir a mina de Iron Knob"
 AST_scale_up_middleback_mines_steel_decision_1_desc: "Embora a mina de Iron Knob esteja ativa há algum tempo, a crescente demanda por minério de ferro criou o momento ideal para expandirmos nossos esforços aqui."
 AST_scale_up_middleback_mines_steel_decision_2: "Abrir a mina Iron Monarch"
 AST_scale_up_middleback_mines_steel_decision_2_desc: "A mina de Iron Knob não é suficiente para atender às nossas demandas. Felizmente, a Cordilheira Middleback é rica em ferro. Está na hora de construir nossa maior mina!"
 AST_scale_up_middleback_mines_steel_decision_3: "Abrir a mina Iron Prince"
 AST_scale_up_middleback_mines_steel_decision_3_desc: "A demanda por metais em tempos de guerra atingiu níveis recordes, mas a Cordilheira Middleback continua suprindo nossas necessidades."
 AST_expand_iron_mining_tt: "Ter tanto §Y$AST_exports_for_economic_recovery$§! quanto §Y$AST_within_reach$§! permitirá a exploração da região de Pilbara, no §Y$STATE_870$§!, liberando uma fonte praticamente inesgotável de §Yaço§!. Podemos usar isso para impulsionar nossa economia."
 AST_develop_port_kemla_steel_tt: "Isto permitirá que tomemos a decisão §YConstruir o segundo alto-forno de Port Kembla§!, aumentando significativamente nossa produção de §Yaço§!."
 AST_develop_middleback_tt: "Isto desbloqueará três decisões para desenvolver a produção de §Yaço§! na §Y$STATE_519$§!"
 AST_expand_planned_extraction_pilbara_tt: "§Y$AST_planned_extraction$§! permitirá a exploração da região de Pilbara, no §Y$STATE_870$§!, liberando uma fonte praticamente inesgotável de §Yaço§!. Podemos usar isso para impulsionar nossa economia."
 AST_ireland_weapon_smuggling_cat: "Armando os irlandeses"
 AST_smuggle_arms_to_ireland: "Contrabandear armas para a Irlanda"
 AST_smuggle_arms_to_ireland_desc: "Devemos suprir os irlandeses com as armas necessárias para combater os britânicos."
 AST_smuggle_arms_to_ireland_ongoing_flag: "Contrabando de armas §Yem andamento§!"
 AST_smuggle_arms_to_northern_ireland: "Contrabandear armas para a Irlanda do Norte"
 AST_smuggle_arms_to_northern_ireland_desc: "Se pudermos suprir armas suficientes para a Irlanda do Norte e melhorar sua conexão com a Irlanda, então poderemos unificá-las antes que os britânicos tenham a chance de interferir."
 AST_northern_ireland_rises_up: "Revolta da Irlanda do Norte"
 AST_specialize_on_jungle_combat: "Especializar em combate na selva"
 AST_specialize_on_desert_combat: "Especializar em combate no deserto"
 AST_switch_combat_specialization: "Alternar especialização de combate"
 AST_special_forces_cat: "Treinamento das forças especiais"
 AST_you_can_switch_sf: "Você poderá alternar entre especializações."
 AST_training_camps_specialization: "Nossos campos de treinamento estão prontos para oferecer treinamento especializado para nossas tropas, tornando-as mais eficientes em vários teatros de operações diferentes."
 # Formables
 AST_australasia_flag: "A §YAustralásia§! foi formada"
 AST_australia_formables_category: "Australásia"
 AST_australia_formables_category_desc: "Embora as raízes d[AST.GetNameDef] sempre nos aproximem do distante sul, nosso alcance cresceu muito além de nossas origens e já não é possível ignorar nossa voz nos assuntos do mundo. Expandimos nossas fronteiras, e podemos nos expandir ainda mais. Um novo nome para nossa nação deixará isso claro. Do casulo d[AST.GetNameDef] emergimos, abrindo nossas asas para que o mundo as admire e reconheça. Damos um nome às nossas cores, ao nosso padrão e à nova nação do sul: Australásia."
 AST_form_australasia: "Formar a Australásia"
 AST_form_australasia_malenesia_required_states_tt: "Controla todos os estados da §YMelanésia§!."
 AST_form_australasia_new_zealand_required_states_tt: "Controla todos os estados da §Y[NZL.GetNonIdeologyName]§!."
