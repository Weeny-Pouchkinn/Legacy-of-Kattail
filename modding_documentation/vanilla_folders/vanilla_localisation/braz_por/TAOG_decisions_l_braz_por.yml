 AST_cw_operation_in_progress: "Atualmente instigando uma revolução"
 AST_seize_local_control_tt: "Os comunistas assumem o controle do estado, garantindo seu apoio caso haja uma guerra civil.\n"
 AST_peace_out_all_wars_tt: "O governo [THIS.GetAdjective] sairá de todas as guerras atuais."
