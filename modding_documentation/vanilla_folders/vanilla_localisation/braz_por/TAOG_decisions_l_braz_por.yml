 #LIMITED WAR
 SIA_limited_war_cat: "Guerra limitada"
 SIA_limited_war_cat_desc: "É inútil esperar que possamos superar as grandes potências da região em uma guerra declarada; ao menos por enquanto. Se fizermos nossas reivindicações, de pouco em pouco, com campanhas cuidadosamente planejadas, seremos capazes de desestruturá-las enquanto aumentamos nossa própria força."
 SIA_start_limited_war_indochina: "Iniciar uma guerra limitada na Indochina contra [FROM.GetNameDef]"
 SIA_start_limited_war_indochina_tt_main: "Inicia uma §Yguerra limitada§! contra §Y[FROM.GetNameDef]§!.\nAo controlar todos os estados destacados pertencentes ao governo §Y[FROM.GetAdjective]§!, poderemos anexar esses territórios sem escalar para uma guerra em larga escala.\n§RPerder mais de [?var:global.limited_war_surrender_threshold|%.0] de progresso de rendição nos fará perder a guerra limitada.§!\n\n§RUma derrota na guerra limitada pode nos obrigar a devolver territórios anteriormente conquistados§!"
 SIA_start_limited_war_rejoin_faction: "Deixaremos temporariamente nossa facção atual, retornando somente após o fim das §Yguerras limitadas§!."
 SIA_start_limited_war_can_join_faction: "Poderemos ingressar novamente em facções após o fim da §Yguerra limitada§!."
 is_not_engaged_in_a_limited_war: "Não está envolvido em uma §Yguerra limitada§!"
 SIA_limited_war_indochina: "[SIA_GetLimitedWarTarget]"
 SIA_limited_war_indochina_desc: "Assuma o controle de todos os estados destacados para vencer a §Yguerra limitada§! e reivindicá-los sem escalar para uma guerra em larga escala.\n§RPerder mais de [?var:global.limited_war_surrender_threshold|%.0] de progresso de rendição resultará em derrota na guerra limitada.§!"
 SIA_limited_war_indochina_target: "§YGuerra limitada§! contra §Y[?var:limited_war_target.GetName]§!"
 SIA_limited_war_indochina_no_target: "A guerra limitada falhou"
 SIA_start_limited_war_malaysia_burma: "Iniciar uma guerra limitada contra [FROM.GetNameDef]"
 SIA_new_territories_administration_cat: "Administração dos novos territórios"
 SIA_new_territories_administration_cat_desc: "A conquista é apenas o começo. Os territórios que dominamos deverão ser administrados, desenvolvidos e defendidos se quisermos que sejam uma parte permanente da nação, e não meras entidades passivas esperando ser reconquistadas."
 SIA_finish_the_triangular_defense_network: "Concluir a rede de defesa triangular"
 SIA_finish_the_triangular_defense_network_desc: "Com as duas fortalezas no Norte e no Sul concluídas, podemos combiná-las com Bangkok para criar uma rede de defesa triangular. Caso uma delas caia, as outras ainda permanecerão operacionais."
 has_built_fortress_saigon: "Construiu a fortaleza de Saigon"
 has_built_fortress_hanoi: "Construiu a fortaleza de Hanói"
 SIA_develop_phibunsongkhram: "Desenvolver [1067.GetName]"
 SIA_develop_southern_indochina: "Desenvolver o Sul da Indochina"
 SIA_develop_northern_indochina: "Desenvolver o Norte da Indochina"
 SIA_develop_northern_malaya: "Desenvolver Si Rat Malai"
 SIA_develop_eastern_burma: "Desenvolver Saharat Thai Doem"
 SIA_use_abandoned_french_tools: "Usar ferramentas francesas abandonadas"
 SIA_use_abandoned_french_tools_desc: "Os franceses deixaram para trás algumas de suas ferramentas pesadas em nossos territórios ocupados. Podemos utilizá-las para nosso próprio benefício."
 SIA_fortress_saigon: "Fortaleza de Saigon"
 SIA_fortress_saigon_desc: "A porção norte de nosso novo império será protegida por Hanói. Com montanhas ao norte e o Rio Vermelho à frente, sua posição é perfeita para deter qualquer invasão."
 SIA_fortress_hanoi: "Fortaleza de Hanói"
 SIA_fortress_hanoi_desc: "A porção sul do império será protegida por Saigon. Esta cidade fortificada será a guardiã de Bangkok, protegendo o golfo d[ROOT.GetNameDef] contra qualquer invasor."
 SIA_propaganda_poster_slot_available_tt: "Tem um espaço vazio para cartaz de filme."
