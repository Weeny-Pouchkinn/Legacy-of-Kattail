 SIA_public_credit_repayment: "Pagamento do crédito público"
 SIA_public_credit_repayment_tt: "Quitaremos toda a dívida pública de uma vez, eliminando-a completamente, ao custo de uma grande penalidade temporária de §Ybens de consumo§!."
 idea_SIA_deficit_spending: "Déficit orçamentário"
 idea_SIA_deficit_spending_desc: "O governo está gastando até o que não tem, concentrando empréstimos em um programa de construção acelerado. Os ganhos industriais são reais, porém a conta chegará algum dia."
 SIA_print_additional_money: "Imprimir dinheiro extra"
 SIA_print_additional_money_tt: "Imprimiremos ainda mais dinheiro para o Japão."
 SIA_appeal_to_industrialists: "Apelar aos industrialistas"
 SIA_implement_industrialists_reforms_countdown: "Implementar reformas industrialistas"
 SIA_implement_industrialists_reforms_countdown_trigger: "Construir §Y2 fábricas civis§! (não inclui fábricas obtidas por focos ou comércio)"
 SIA_appeal_to_industrialists_tt: "Ganharemos o apoio dos industrialistas.\n\nEles nos auxiliarão na guerra civil, fornecendo equipamento adicional. No entanto, esperarão que ampliemos nossa base industrial, construindo §Y2§! §Yfábricas civis§! adicionais além das fábricas que possuirmos ao final da guerra civil, no prazo de §Y720 dia(s)§! após assumirmos o poder (não inclui fábricas obtidas por focos ou comércio).\n\nO não cumprimento resultará em penalidades de §Yestabilidade§! e §Yapoio à guerra§!.\n\nAo início da guerra civil, receberemos: "
 SIA_seek_support_from_constitutional_monarchists: "Buscar apoio dos monarquistas constitucionalistas"
 SIA_implement_constitutionalist_reforms_countdown: "Implementar reformas constitucionalistas"
 SIA_seek_support_from_constitutional_monarchists_tt: "Ganharemos o apoio dos monarquistas constitucionalistas.\n\nEles nos auxiliarão na guerra civil, gerando divisões adicionais. No entanto, esperarão que permaneçamos como uma monarquia constitucional, concluindo o foco §Y$SIA_a_constitutional_monarchy$§! dentro de §Y720 dia(s)§! após assumirmos o poder.\n\nO não cumprimento resultará em penalidades de §Yestabilidade§! e §Yapoio à guerra§!."
 SIA_appeal_to_rural_people: "Recorrer à população rural"
 SIA_appeal_to_rural_people_tt: "Ganharemos o apoio da população rural.\n\nEles nos auxiliarão na guerra civil, fornecendo milícias. Em contrapartida, esperarão que adotemos políticas agrícolas benéficas, concluindo o foco §Y$SIA_mechanization_of_agriculture$§! ou §Y$SIA_reduction_of_agricultural_yield_taxes$§! dentro de §Y720 dia(s)§! após assumirmos o poder.\n\nO não cumprimento resultará em penalidades de §Yestabilidade§! e §Yapoio à guerra§!.\n\nAo início da guerra civil, receberemos: "
 SIA_implement_rural_reforms_countdown: "Implementar reformas rurais"
 SIA_implement_absolutist_reforms_countdown: "Implementar reformas absolutistas"
 SIA_seek_support_from_absolutists_monarchists: "Buscar apoio dos monarquistas absolutistas"
 SIA_seek_support_from_absolutists_monarchists_tt: "Ganharemos o apoio dos monarquistas absolutistas.\n\nEles nos auxiliarão na guerra civil, gerando divisões adicionais. No entanto, esperarão que retornemos ao modelo de governo de monarquia absoluta, concluindo o foco §Y$SIA_an_absolute_monarchy$§! dentro de §Y720 dia(s)§! após assumirmos o poder.\n\nO não cumprimento resultará em penalidades de §Yestabilidade§! e §Yapoio à guerra§!."
 SIA_appeal_to_navy_clique: "Recorrer à Camarilha da Marinha"
 SIA_appeal_to_navy_clique_countdown: "Implementar reformas da Marinha"
 SIA_appeal_to_navy_clique_tt: "Ganharemos o apoio da Camarilha da Marinha.\n\nEles nos auxiliarão na guerra civil, concedendo toda a força de nossa Marinha e uma divisão de fuzileiros. Em contrapartida, esperarão que adotemos políticas navais benéficas, concluindo o foco §Y$SIA_thonburi_class_coastal_defense_ship$§! dentro de §Y720 dia(s)§! após assumirmos o poder.\n\nO não cumprimento resultará em penalidades de §Yestabilidade§! e §Yapoio à guerra§!.\n\nAo início da guerra civil, receberemos:\n§YToda a nossa Marinha§!\nA divisão do §YCorpo de Fuzileiros Reais da Tailândia§!\nA tecnologia de §Yfuzileiros navais§!"
 SIA_appeal_for_support_cat: "Solicitar apoio"
 SIA_appeal_for_support_cat_desc: "Nenhum movimento político prospera sozinho. Monarquistas, constitucionalistas, soldados e civis, todos têm algum controle sobre uma parte do país. O apoio deles deverá ser cultivado com prudência se quisermos ter forças para agir no momento oportuno."
 SIA_demand_independence: "Exigir a independência §Yd[FROM.GetNameDef]§! §Ypara [FROM.OVERLORD.GetNameDef]§!"
 SIA_demand_independence_VIN: "Exigir a libertação §Yd[VIN.GetNameDef]§!"
 SIA_demand_independence_VIN_tt: "Exigiremos a libertação d[VIN.GetNameDef] de seus controladores"
 SIA_demand_independence_LAO: "Exigir a libertação §Yd[LAO.GetNameDef]§!"
 SIA_demand_independence_LAO_tt: "Exigiremos a libertação d[LAO.GetNameDef] de seus controladores"
 SIA_demand_independence_CAM: "Exigir a libertação §Yd[CAM.GetNameDef]§!"
 SIA_demand_independence_CAM_tt: "Exigiremos a libertação d[CAM.GetNameDef] de seus controladores"
 SIA_invite_to_adc: "Convidar §Y[FROM.GetNameDef]§! para nossa facção"
 SIA_asian_democratic_compact_cat: "Acordo Democrático Asiático"
 SIA_asian_democratic_compact_cat_desc: "Os povos da Ásia têm o direito de se autogovernar. Como o porta-estandarte da autodeterminação asiática, podemos pressionar as potências colonialistas a libertarem as nações que dominam."
 SIA_khana_ratsadon_cat: "O Khana Ratsadon"
 SIA_khana_ratsadon_cat_desc: "O Khana Ratsadon, Partido Popular que derrubou a monarquia absolutista, não é um monólito. As alas civil e militar do partido têm seus próprios planos para o futuro do país e a tensão entre elas corre por debaixo dos panos a cada decisão tomada. Ou ambas as facções ficam satisfeitas, ou a coalizão corre o risco de se autodestruir."
 SIA_army_navy_reform_cat: "Exército e Marinha"
 SIA_army_navy_reform_cat_desc: "O Exército e a Marinha competem pelos mesmos recursos limitados. A transferência de fundos entre os dois exige um constante equilíbrio e cada realocação acarreta consequências para a prontidão do outro."
 SIA_divert_army_funds_to_navy_toggle: "[SIA_GetDivertingArmyFundsToNavyTitle]"
 SIA_divert_army_funds_to_navy_toggle_tt: "[SIA_GetDivertingArmyFundsToNavyTT]"
 SIA_divert_army_funds_to_navy_toggle_do: "Redirecionar recursos do Exército para a Marinha"
 SIA_divert_army_funds_to_navy_toggle_do_tt: "Redirecionaremos parte dos recursos do Exército para a Marinha a fim de acelerar seu desenvolvimento."
 SIA_divert_army_funds_to_navy_toggle_undo: "Interromper o redirecionamento de recursos do Exército para a Marinha"
 SIA_divert_army_funds_to_navy_toggle_undo_tt: "Não vamos mais redirecionar recursos do Exército para a Marinha."
 SIA_standing_our_ground_mission: "Mantendo nossa posição"
 SIA_standing_our_ground_mission_tt: "Devemos lutar por nossa liberdade."
 SIA_sway_generals_to_seri_thai_tt: "Os generais que conseguirmos trazer para o Seri Thai ficarão do nosso lado quando a guerra civil começar, em vez de se juntar à revolta lealista."
 SIA_sway_general_cw_scale_tt: "Aumenta nosso apoio na guerra civil em §Y5%§!\nSe o apoio ultrapassar §Y80%§!, a guerra civil será evitada e tomaremos o poder sem oposição"
 SIA_sway_luang_chawengsaksongkhram_to_seri_thai: "Convencer Luang Chawengsaksongkhram"
 SIA_sway_luang_chawengsaksongkhram_to_seri_thai_desc: "Convence Luang Chawengsaksongkhram a apoiar a causa do Seri Thai. Se for convencido, ele ficará do nosso lado quando a guerra civil começar."
 SIA_sway_aditya_dibabha_to_seri_thai: "Convencer Aditya Dibabha"
 SIA_sway_aditya_dibabha_to_seri_thai_desc: "Convence Aditya Dibabha a apoiar a causa do Seri Thai. Se for convencido, ele ficará do nosso lado quando a guerra civil começar."
 SIA_sway_mangkorn_phromyothi_to_seri_thai: "Convencer Mangkorn Phromyothi"
 SIA_sway_mangkorn_phromyothi_to_seri_thai_desc: "Convence Mangkorn Phromyothi a apoiar a causa do Seri Thai. Se for convencido, ele ficará do nosso lado quando a guerra civil começar."
 SIA_sway_luang_haansongkhram_to_seri_thai: "Convencer Luang Haansongkhram"
 SIA_sway_luang_haansongkhram_to_seri_thai_desc: "Convence Luang Haansongkhram a apoiar a causa do Seri Thai. Se for convencido, ele ficará do nosso lado quando a guerra civil começar."
 SIA_sway_charun_rattanakun_seriroengrit_to_seri_thai: "Convencer Charun Rattanakun Seriroengrit"
 SIA_sway_charun_rattanakun_seriroengrit_to_seri_thai_desc: "Convence Charun Rattanakun Seriroengrit a apoiar a causa do Seri Thai. Se for convencido, ele ficará do nosso lado quando a guerra civil começar."
 SIA_sway_phichit_kriangsakphichit_to_seri_thai: "Convencer Phichit Kriangsakphichit"
 SIA_sway_phichit_kriangsakphichit_to_seri_thai_desc: "Convence Phichit Kriangsakphichit a apoiar a causa do Seri Thai. Se for convencido, ele ficará do nosso lado quando a guerra civil começar."
 SIA_sway_jira_wichitsongkhram_to_seri_thai: "Convencer Jira Wichitsongkhram"
 SIA_sway_jira_wichitsongkhram_to_seri_thai_desc: "Convence Jira Wichitsongkhram a apoiar a causa do Seri Thai. Se for convencido, ele ficará do nosso lado quando a guerra civil começar."
 SIA_sway_phin_choonhavan_to_seri_thai: "Convencer Phin Choonhavan"
 SIA_sway_phin_choonhavan_to_seri_thai_desc: "Convence Phin Choonhavan a apoiar a causa do Seri Thai. Se for convencido, ele ficará do nosso lado quando a guerra civil começar."
 SIA_sway_tiang_sirikhan_to_seri_thai: "Convencer Tiang Sirikhan"
 SIA_sway_tiang_sirikhan_to_seri_thai_desc: "Convence Tiang Sirikhan a apoiar a causa do Seri Thai. Se for convencido, ele ficará do nosso lado quando a guerra civil começar."
 SIA_khana_ratsadon_dummy_military: "Risco de golpe militar"
 SIA_khana_ratsadon_dummy_military_tt: "Os militares realizarão um golpe de Estado se os antagonizarmos demais. Para evitar uma guerra civil, é melhor não ter §Y$idea_SIA_military_rebellious$§! por muito tempo."
 SIA_khana_ratsadon_dummy_military_desc: "Os militares são uma camarilha poderosa do partido Khana Ratsadon. Eles não aprovarão políticas que considerem contrárias aos seus interesses, mas aprovarão medidas que enxerguem como sendo a favor da militarização do país."
 SIA_khana_ratsadon_military_coup_mission: "Os militares estão planejando derrubar o governo!"
 SIA_khana_ratsadon_military_coup_mission_desc: "Os militares enxergam as políticas atuais do governo como uma ameaça a seus interesses. Eles estão planejando ativamente a derrubada do governo caso seu posicionamento não melhore."
 SIA_khana_ratsadon_dummy_civilian: "Risco de golpe da ala civil"
 SIA_khana_ratsadon_dummy_civilian_tt: "A ala civil realizará um golpe de Estado se a antagonizarmos demais. Para evitar uma guerra civil, é melhor não ter §Y$idea_SIA_civilian_rebellious$§! por muito tempo."
 SIA_khana_ratsadon_dummy_civilian_desc: "A ala civil é uma camarilha poderosa do partido Khana Ratsadon. Ela não aprovará políticas que considera contrárias a seus interesses, mas aprovará medidas que acredita serem favoráveis à democracia e aos civis."
 SIA_khana_ratsadon_civilian_coup_mission: "A ala civil está planejando derrubar o governo!"
 SIA_khana_ratsadon_civilian_coup_mission_desc: "A ala civil enxerga as políticas atuais do governo como uma ameaça a seus interesses. Ela está planejando ativamente a derrubada do governo caso seu posicionamento não melhore."
 SIA_promote_civilian_wing: "Cortejar a ala civil"
 SIA_promote_civilian_wing_desc: "Se usarmos a influência do governo para apoiar a agenda da ala civil para a reforma agrária, o judiciário e a constituição, poderemos conquistar a gratidão da facção de Pridi. Contudo, tal favorecimento não passará despercebido: o corpo de oficiais ficará ressentido e os transtornos causados à administração ordinária nos custarão caro até que a situação se estabilize."
 SIA_promote_military_wing: "Cortejar a ala militar"
 SIA_promote_military_wing_desc: "Ao atender às exigências dos oficiais e exibir o poder das Forças Armadas, poderemos conquistar o apoio da facção de Phibun. Contudo, tal favorecimento não passará despercebido: o realinhamento mergulhará a rotina do Exército no caos e os transtornos causados à administração ordinária nos custarão caro até que a situação se estabilize. Uma medida dura, útil apenas para impedir que a ala se revolte."
 SIA_cultivate_civilian_wing: "Aproximar-se da ala civil"
 SIA_cultivate_civilian_wing_desc: "O prestígio que a Diretiva do Gabinete do Palácio Real nos rendeu junto ao establishment abre caminho para uma aproximação gradual com a ala civil. Não há favoritismo abrupto que possa provocar uma reação adversa, apenas o trabalho lento e constante de conquistar a facção de Pridi, uma concessão de cada vez. O processo será demorado, mas poderemos levá-lo tão longe quanto quisermos."
 SIA_cultivate_military_wing: "Aproximar-se da ala militar"
 SIA_cultivate_military_wing_desc: "O prestígio que a Diretiva do Gabinete do Palácio Real nos rendeu junto ao establishment abre caminho para uma aproximação gradual com a ala militar. Não há favoritismo abrupto que possa provocar uma reação adversa, apenas o trabalho lento e constante de conquistar o corpo de oficiais, uma concessão de cada vez. O processo será demorado, mas poderemos levá-lo tão longe quanto quisermos."
 SIA_end_factionalism_mission: "Manter a coalizão unida"
 SIA_end_factionalism_mission_desc: "Ambas as alas do Khana Ratsadon apoiam plenamente o governo. Se conseguirmos mantê-las com §Gapoio total§! por §Y270§! dias, a rivalidade entre elas poderá ser encerrada de uma vez por todas. Caso o entusiasmo de qualquer uma das alas diminua, será necessário recomeçar o esforço do zero."
