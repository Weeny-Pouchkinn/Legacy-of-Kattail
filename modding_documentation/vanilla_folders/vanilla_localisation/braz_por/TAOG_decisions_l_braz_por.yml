 ###################
 AST_communism_support_text: "[?party_popularity_100@communism|Y]% de apoio comunista"
 AST_union_control_1_cat: "Controle sindical"
 AST_union_control_1_cat_desc: "Nossos sindicalistas começaram a mobilizar apoio popular na Austrália. Podemos nos infiltrar na legislatura de cada estado individual, construindo o apoio para um governo comunista de dentro. Isso custará um poder político significativo e ameaçará desestabilizar a nação. \n\nOs veteranos da Nova Guarda estão de olho em nossos movimentos e, se o governo falhar em agir na hora certa, ou se a nação se tornar instável demais, este conflito poderá destruir completamente o país.\n\nApoio ao comunismo: [?party_popularity_100@communism|Y]§Y%§!\n\n§RUma guerra civil terá início se a estabilidade ficar abaixo de 40%, ou se o tempo da Revolta dos Veteranos expirar.§!"
 AST_union_control_1_cat_name: "Selecione onde mobilizar sindicatos em seu apoio"
 AST_union_control_1_map_area_name: "Estados que ainda podem ser influenciados"
 AST_nationalizing_cat: "Nacionalização"
 AST_union_control_2_cat: "Controle sindical"
 AST_union_control_2_cat_desc: "Os trabalhadores d[ROOT.GetNameDef] não derrubaram seus opressores apenas para assistir aos poderes imperiais dominando nossos camaradas em outros países. A disseminação do comunismo para além de nossas fronteiras não é apenas um objetivo ideológico, mas sim uma necessidade estratégica. Devemos agitar as chamas da revolução, impelindo-as a atravessar os oceanos, levando esperança e recursos àqueles que precisam se livrar do cabresto do imperialismo, até que a velha ordem não tenha mais suporte para se manter."
 AST_union_control_2_foreign_cat: "Suprimir o comunismo"
 AST_union_control_tt: "Os sindicatos devem se estabelecer nos estados da Austrália, mas os veteranos da Nova Guarda atuam para conter a expansão do comunismo."
 AST_seize_local_leadership_in_state_major: "Assumir a liderança local em [FROM.GetName]"
 AST_seize_local_leadership_in_state_mid: "Assumir a liderança local em [FROM.GetName]"
 AST_seize_local_leadership_in_state_low: "Assumir a liderança local em [FROM.GetName]"
 AST_seize_local_leadership_in_queensland: "Assumir a liderança local em Queensland"
 AST_union_strike: "Organizar uma greve"
 AST_union_strike_desc: "Nossos trabalhadores estão abandonando seus locais de trabalho, exigindo melhores condições e direitos. Isso certamente colocará pressão no governo para instaurar novas reformas."
 AST_veterans_revolt: "A revolta dos veteranos"
 AST_veterans_revolt_desc: "O Exército possui um grande número de membros anticomunistas, muitos dos quais faziam parte de grupos fascistas. Eles nutrem profundo desprezo pelo comunismo e não hesitarão em pegar em armas para impedir sua ascensão.\nSe demorarmos demais para iniciar nossa revolução, ou se deixarmos a estabilidade diminuir muito, eles tomarão a iniciativa para impedir que ela aconteça."
 AST_organize_in_nation: "Infiltrar-se nos sindicatos §Yd[FROM.GetNameDef]§!"
 AST_organize_in_nation_desc: "O movimento operário não tem limites. Ao canalizar recursos para as redes de nossos camaradas, poderemos infiltrar comunistas nos sindicatos d[FROM.GetNameDef], criando um apoio popular originado de dentro da classe trabalhadora para a revolução."
 AST_civil_war_in_nation: "Instigar revolução §Yn[FROM.GetNameDef]§!"
 AST_civil_war_in_nation_desc: "As sementes que plantamos já estão dando frutos. O apoio ao comunismo n[FROM.GetNameDef] cresceu a ponto de tornar possível uma revolução aberta. Com financiamento, agitadores e um empurrãozinho cuidadosamente planejado, podemos transformar o descontentamento público em uma revolta armada, trazendo [FROM.GetNameDef] para mais perto do regime proletário que merece."
 AST_take_it_to_foreign_streets: "Organizar uma marcha solidária internacional dos trabalhadores"
 AST_take_it_to_foreign_streets_desc: "Os trabalhadores não têm limites. Lançaremos uma campanha internacional coordenada, enviando organizadores comunistas australianos para as ruas de cada nação em que nossa influência já esteja garantida, revigorando movimentos locais e mantendo as chamas da revolução acesas."
 AST_take_it_to_foreign_streets_tt: "Estende a duração da influência comunista estrangeira em 60 dias em todas as nações atualmente infiltradas."
 AST_raj_locked_tt: "O Raj não poderá ser um alvo até que Nova Zelândia, Malaia, Birmânia, Filipinas e Indonésia tenham um governo comunista."
 AST_supply_arms_to_nation: "Fornecer armas para §Y[FROM.GetNameDef]§!"
 AST_supply_arms_to_nation_desc: "Forneceremos armas aos nossos camaradas."
 AST_strikes_tt: "Você só poderá concluir §Y$AST_workers_educational_association$§!, §Y$AST_off_leash$§!, §Y$AST_a_national_housing_commission$§!, §Y$AST_guaranteed_employment$§! e §Y$AST_equal_pay$§! enquanto uma greve estiver acontecendo."
 AST_nationalization: "Iniciar a nacionalização"
 AST_nationalizing_process_tt: "Habilita a decisão §YIniciar a nacionalização§!, aplicando o efeito §YNacionalização em andamento§!. Isso é necessário para os focos abaixo e será removido ao concluir §YA Austrália do povo§!. §RFocos não selecionados serão então bloqueados!§!"
 AST_nationalization_underway_tt: "§YNacionalização em andamento§! \nProdução das fábricas: §R-30%§! \nProdução dos estaleiros: §R-30%§!"
 AST_nationalizing_process_ends_tt: "§RAssumir este foco bloqueará todos os focos acima!§!"
