 emperor_fascism: "Fascismo imperial"
 emperor_fascism_desc: "O fascismo imperial é uma forma de ultranacionalismo na qual as massas não possuem voz. Frequentemente chamado de \"fascismo de cima\", esse regime é conduzido pelo Exército e por burocratas aristocráticos, com uma profunda reverência ao imperador da nação, um monarca considerado uma figura divina e infalível."
 japan_militarism_ideology: "Militarismo"
 japan_militarism_ideology_desc: "O militarismo é uma ideologia na qual o líder da nação possui apenas um controle nominal, atuando mais como um fantoche do Exército do que como um político independente, impulsionando constantemente a agenda militar com o objetivo final de uma política expansionista acelerada."
 buddhist_socialism: "Socialismo budista"
 buddhist_socialism_desc: "O socialismo budista, também chamado de socialismo dármico ou natural, é uma ideologia política que defende o socialismo de acordo com os princípios do budismo. Tanto o budismo quanto o socialismo buscam oferecer um fim ao sofrimento a partir da análise das condições deste e remover suas principais causas por meio da práxis. As duas ideologias também procuram fornecer uma transformação da consciência pessoal para acabar com alienação humana e com o egoísmo."
