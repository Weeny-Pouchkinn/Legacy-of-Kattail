 CZE_embezzle_quatermaster_funds_desc: "Já cuidamos dos nossos soldados. Com certeza ninguém perceberia, ou se importaria, se parte dos fundos destinados aos quartéis fossem para outro lugar."
 CZE_prioritize_export_contracts: "£BoP_left_texticon Priorizar contratos de exportação"
 CZE_prioritize_export_contracts_desc: "A nossa indústria de exportação foi responsável por nos ajudar a sair da Grande Depressão. Por que deveríamos mudar a estratégia agora? Qualquer ameaça à nossa nação é exagerada de toda forma. A Armada pode esperar."
 CZE_focus_on_export_designs: "£BoP_left_texticon Foco na exportação de designs"
 CZE_focus_on_export_designs_desc: "A Armada está muito exigente em relação ao que esperam dos nossos designs. O mercado de exportações é mais compreensivo e nos ajuda a financiar designs nacionais para a Armada. Então, na verdade, ela deveria nos agradecer pelo tanto de dinheiro que a ajudamos a economizar em Pesquisa e Desenvolvimento. De nada, Armada."
