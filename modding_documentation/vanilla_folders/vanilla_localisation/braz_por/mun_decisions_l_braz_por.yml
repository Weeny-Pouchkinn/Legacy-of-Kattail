 ###FORT DECISIONS###
 CZE_the_second_fortification_program_category: "Programas de fortificação"
 CZE_the_second_fortification_program_category_desc: "A fronteira pouquíssimo vantajosa dos nossos países é uma preocupação de segurança nacional. Os países que nos circundam já deixaram claro que têm projetos para reformular as nossas fronteiras a favor deles. Se continuarmos fortificando-as, qualquer possível inimigo pensará melhor antes de nos atacar."
 CZE_fate_of_the_ro: "Destino do Conselho de Fortificação"
 CZE_fate_of_the_ro_desc: "O Conselho de Fortificação está encarregado de juntar as finanças relacionadas aos nossos projetos de fortificação. Se esses fundos não forem usados em breve, as pessoas começarão a questionar o motivo de eles terem sido acumulados."
 CZE_bop_army_bunker_maintenance: "Esforço de manutenção de fortificação"
 CZE_bop_army_bunker_maintenance_desc: "Manter nossas fortificações em condições operacionais e prontas para uso garantirá que o exército tenha confiança para usá-las se necessário."
 CZE_fortification_research: "Pesquisa de fortificação"
 CZE_fortification_research_desc: "A necessidade de fortificar a nossa fronteira é evidente, mas a pergunta é: como? A pesquisa nos ajudará a encontrar uma resposta."
 CZE_fortification_research_tt: "Tem espírito nacional §Y$CZE_directorate_of_fortification_works_no_gd_idea$§!"
 CZE_fortification_research_subtract_variable_tt: "Todas as decisões futuras de §YProgramas de Fortificação§! levarão §Y30§! dias a menos até a §Yconclusão§!"
 CZE_fortification_decision_inprogress: "Já está trabalhando em outro programa de fortificação"
 CZE_second_sudetenland_fortification_program: "Segundo Programa de Fortificação da Região dos Sudetas"
 CZE_second_sudetenland_fortification_program_desc: "A Região dos Sudetas, nossa fronteira montanhosa com a Alemanha, é o lugar perfeito para fortificações de fronteiras. Tendo estudado a Linha Maginot francesa, podemos construir uma linha semelhante."
 CZE_third_sudetenland_fortification_program: "Terceiro Programa de Fortificação da Região dos Sudetas"
 CZE_third_sudetenland_fortification_program_desc: "Agora a Região dos Sudetas tem uma linha defensiva decente, mas decente não é bom o suficiente quando nossa sobrevivência nacional está em jogo."
 CZE_fourth_sudetenland_fortification_program: "Quarto Programa de Fortificação da Região dos Sudetas"
 CZE_fourth_sudetenland_fortification_program_desc: "A Região dos Sudetas tem um sistema amplo de fortificações, mas ainda assim elas precisam ser mais fortes."
 CZE_fortify_the_crossroads_with_slo: "Fortificar as encruzilhadas"
 CZE_fortify_the_crossroads_with_slo_desc: "Qualquer sistema de fortificação pode ser quebrado. Para nos proteger contra isso, podemos construir pontos fortes ao redor de nossas cidades mais importantes a fim de que elas não possam ser tomadas por um inimigo que consiga romper nossas linhas."
 CZE_fortify_the_hungarian_border_with_73: "Fortificar a fronteira húngara"
 CZE_fortify_the_hungarian_border_with_73_desc: "O irredentismo dos húngaros é uma ameaça constante a nossa nação. Um sistema de fortificações ao longo de nossa fronteira compartilhada ajudará a garantir nossa segurança."
 CZE_fortify_the_polish_border_with_72: "Fortificar a fronteira polonesa"
 CZE_fortify_the_polish_border_with_72_desc: "As agressões polonesas não têm limites, mas esperamos que uma fronteira bem fortificada faça com que eles busquem um alvo mais fácil."
