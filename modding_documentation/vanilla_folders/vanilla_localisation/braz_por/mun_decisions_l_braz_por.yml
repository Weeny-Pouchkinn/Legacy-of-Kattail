 CZE_send_observers_to_the_italo_ethiopian_war_bonus: "Enviou observadores para a Guerra Ítalo-Etíope"
 CZE_send_observers_to_the_italo_ethiopian_war_desc: "Enviar indivíduos para observar e fazer contatos paralelos com pessoas envolvidas em combates terrestres proporcionaria informações valiosas sobre a doutrina do exército atual. Isso também pode gerar outras oportunidades."
 CZE_send_observers_to_the_italo_ethiopian_war_tt: "§Y$CZE_zbrojovka_brno_organization$§! questionará o contrabando de armas para §Y[ETH.GetNameDef]§!"
 CZE_recruit_red_cross_veterans: "£BoP_right_texticon Recrutar veteranos da Cruz Vermelha"
 CZE_warehouse_inspections: "£BoP_right_texticon Inspeções de depósitos"
 CZE_warehouse_inspections_desc: "Você não saberá que algo está faltando se não verificar."
 CZE_construction_telephone_stations: "£BoP_right_texticon Construir estações telefônicas"
 CZE_construction_telephone_stations_desc: "Construir estações telefônicas entre as nossas bases de comando aumentará bastante a coordenação do nosso alto-comando."
 CZE_state_defense_loans: "£BoP_right_texticon Empréstimo de defesa do Estado"
 CZE_live_fire_exercise: "£BoP_right_texticon Treinamento com munição real"
 CZE_live_fire_exercise_desc: "Nada se compara a um dia no campo de tiro."
