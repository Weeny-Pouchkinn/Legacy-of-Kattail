l_braz_por:
 LOADING_TIP_0: "É humilhante permanecer de braços cruzados enquanto outros escrevem a história. Pouco importa quem vencerá.\n- Benito Mussolini"
 LOADING_TIP_1: "Para fazer um povo melhor, é necessário enviá-lo para a guerra mesmo que à força. E é isso que vou fazer.\n- Benito Mussolini"
 LOADING_TIP_2: "Todo soldado deve saber antes de entrar em batalha o quão importante é sua pequena batalha para o todo.\n- Bernard L. Montgomery"
 LOADING_TIP_3: "Se perdermos a guerra nos céus, perderemos a guerra e bem rápido.\n- Bernard L. Montgomery"
 LOADING_TIP_4: "É bom confiar nos outros, mas é muito melhor não ter de fazê-lo.\n- Benito Mussolini"
 LOADING_TIP_5: "De um ponto de vista filosófico e doutrinal, eu não acredito em paz perpétua.\n- Benito Mussolini"
 LOADING_TIP_6: "Girafas são criaturas sem coração"
 LOADING_TIP_7: "Enquanto houverem nações soberanas detentoras de tamanho poder, a guerra será inevitável.\n- Albert Einstein"
 LOADING_TIP_8: "Aqueles que votam não decidem nada. Aqueles que contam o voto decidem tudo.\n- Joseph Stalin"
 LOADING_TIP_9: "A história mostrou que não existem exércitos invencíveis e nunca existirão.\n- Joseph Stalin"
 LOADING_TIP_10: "O Papa! Quantas divisões ele tem?\n- Joseph Stalin"
 LOADING_TIP_11: "Gaiety é o atributo mais impressionante da União Soviética.\n- Joseph Stalin"
 LOADING_TIP_12: "O verdadeiro poder sai de um longo rifle.\n- Joseph Stalin"
 LOADING_TIP_13: "Qualquer aliança cujo propósito não seja a guerra é sem sentido e inútil.\n- Adolf Hitler"
 LOADING_TIP_14: "Grande mentirosos são também grande mágicos.\n- Adolf Hitler"
 LOADING_TIP_15: "Se hoje eu estou aqui como um revolucionário, será um revolucionário contra a Revolução.\n- Adolf Hitler"
 LOADING_TIP_16: "Se contar uma mentira grande o suficiente e frequente o suficiente, ela será acreditada.\n-Adolf Hitler"
 LOADING_TIP_17: "A Alemanha ou será uma potência mundial ou não será nada.\n- Adolf Hitler"
 LOADING_TIP_18: "O sucesso consiste em passar de um fracasso a outro sem perder o entusiasmo.\n- Winston Churchill"
 LOADING_TIP_19: "Se você estiver passando por um inferno, continue.\n- Winston Churchill"
 LOADING_TIP_20: "O melhor argumento contra a democracia é uma conversa de cinco minutos com um eleitor.\n- Winston Churchill"
 LOADING_TIP_21: "Seja onde for que as guerras futuras forem travadas, as tropas blindadas terão um papel decisivo.\n- Heinz Guderian"
 LOADING_TIP_22: "Os novos tanques alemães Panther e Tiger podem ser usados até quebrarem sem tentar repará-los. Eles têm motores, transmissões e suspensões terríveis.\nDepartamento de Armas do Exército Vermelho."
 LOADING_TIP_23: "Nenhum imbecil jamais ganhou uma guerra morrendo por seu país. Ele ganhou fazendo outros pobres imbecis morrerem pelo país dele.\n- George S. Patton"
 LOADING_TIP_24: "Um bom plano executado violentamente agora é melhor do que um plano perfeito executado semana que vem.\n- George S. Patton"
 LOADING_TIP_25: "Lidere-me, siga-me ou saia do meu caminho.\n- George S. Patton"
 LOADING_TIP_26: "Ninguém nunca defendeu algo de forma bem sucedida, só existe atacar, atacar e atacar um pouco mais.\n- George S. Patton"
 LOADING_TIP_27: "Guerras podem ser travadas com armas, mas são vencidas por homens. É o espírito do homem que segue e do homem que lidera que ganham a vitória.\n- George S. Patton"
 LOADING_TIP_28: "A primeira vez que eu vi um jato, eu o abati.\n- Chuck Yeager, USAF"
 LOADING_TIP_29: "Theo, aqui é Heinrich. Acabei de abater dois bombardeiros. Estou sem munição Vou bater o avião. Auf Wiedersehen, vejo você em Valhalla!\n- Heinrich Ehrler, Luftwaffe"
 LOADING_TIP_30: "Liderança consiste em escolher bons homens e ajudá-los a dar o seu melhor.\n- Chester W. Nimitz"
 LOADING_TIP_31: "A operação proposta tem chances de êxito? Está dentro da esfera da praticidade em termos de materiais e suprimentos?\n- Chester W. Nimitz"
 LOADING_TIP_32: "Ao preparar para batalhas, sempre percebi que planos são inúteis, mas planejar é indispensável.\n- Dwight D. Eisenhower"
 LOADING_TIP_33: "O que conta não é necessariamente o tamanho do cão na luta - é o tamanho da luta no cão.\n- Dwight D. Eisenhower"
 LOADING_TIP_34: "Não é preciso dizer que quando a sobrevivência é ameaçada, as brigas surgem entre as pessoas e o resultado são guerras infelizes entre as nações.\n Hideki Tojo"
 LOADING_TIP_35: "Em uma batalha de homem contra homem, o vencedor é aquele que tem mais uma bala em seu carregador.\n- Erwin Rommel"
 LOADING_TIP_36: "Prefiro ser o martelo do que a bigorna.\n- Erwin Rommel"
 LOADING_TIP_37: "Suor salva sangue, sangue salva vidas, mas o cérebro salva os dois.\n- Erwin Rommel"
 LOADING_TIP_38: "O coitado do Neville Chamberlain acreditava que podia confiar em Hitler. Ele estava errado. Mas não acho que estou errado sobre o Stalin.\n- Winston Churchill, após a Conferência de Ialta"
 LOADING_TIP_39: "Acredito que haverá paz para o nosso tempo.\n- Neville Chamberlain, 1938 após o Acordo de Munique."
 LOADING_TIP_40: "Nenhum bombardeiro inimigo vai alcançar o Ruhr. Se um deles alcançar o Ruhr, meu nome não é mais Göring. Pode me chamar de Meyer.\n- Hermann Meyer"
 LOADING_TIP_41: "Só precisamos derrubar a porta e toda a estrutura podre irá desabar.\n- Adolf Hitler (sobre a União Soviética)"
 LOADING_TIP_42: "Posso lutar selvagemente nos primeiros seis a dozes meses em uma guerra contra os Estados Unidos e o Reino Unido. Depois disso, não tenho nenhuma expectativa de êxito.\n- Isoroku Yamamoto"
 LOADING_TIP_43: "Se chegarmos a um campo minado, nossa infantaria atacará exatamente como se não estivesse lá.\n- Georgy Zhukov"
 LOADING_TIP_44: "Nós subestimamos o colosso russo... toda vez que uma dúzia de divisões é destruída, os russos a substituem com outra dúzia.\n- Franz Halder"
 LOADING_TIP_45: "LOUCURA!\n- Anthony C. McAuliffe, em resposta à exigência das forças alemãs por sua rendição"
 LOADING_TIP_46: "Somos nós hoje. E serão vocês amanhã.\n- Haile Selassie I, 1936"
 LOADING_TIP_47: "Nem um passo para trás!\n- Ordem soviética nº 227"
 LOADING_TIP_48: "Tora! Tora! Tora!\n- Mitsuo Fuchida, 7 de dezembro de 1941"
 LOADING_TIP_49: "Seu nome é desconhecido. Seu feito é imortal.\n- Tumba do soldado desconhecido (Moscou)"
 LOADING_TIP_50: "Onde está, repito, onde está a Força-Tarefa 34? O mundo quer saber.\n- CINCPAC, Batalha do Golfo de Leyte"
 LOADING_TIP_51: "A situação da guerra se desenvolveu não necessariamente para o lado do Japão.\n- Imperador Hirohito, 1945"
 LOADING_TIP_52: "Já devíamos ter imaginado depois da primeira guerra.\n- Gerd von Rundstedt"
 LOADING_TIP_53: "A vastidão da Rússia está nos devorando.\n- Gerd von Rundstedt"
 LOADING_TIP_54: "Eu te pergunto, você quer guerra total? Se necessário, você quer uma guerra mais radical e total do que qualquer coisa que já tenha imaginado?\n- Joseph Goebbels"
 LOADING_TIP_55: "Um golpe do exército alemão e outro do exército soviético colocarão um fim neste errôneo produto de Versalhes.\n- Vyacheslav Molotov (depois da queda da Polônia)"
 LOADING_TIP_56: "Risquem um porta-aviões! Dixon para porta-aviões: risquem um porta-aviões!\n- Robert E. Dixon, Batalha do Mar de Coral"
 LOADING_TIP_57: "Não é terrível? Aqui estamos, dois oficiais do Estado-maior geral alemão discutindo como melhor assassinar nosso comandante supremo.\n- Henning von Tresckow"
 LOADING_TIP_58: "Hitler é um dervixe girador. Ele precisa ser eliminado.\n- Henning von Tresckow"
 LOADING_TIP_59: "Os Nazistas entraram nesta guerra sob a desilusão infantil de que iriam bombardear todo mundo sem ninguém bombardeá-los de volta.\n- Arthur 'Bomber' Harris"
 LOADING_TIP_60: "Se Hitler invadisse o inferno, eu faria pelo menos um elogio ao diabo na Câmara dos Comuns.\n- Winston Churchill, 21 de junho de 1941"
 LOADING_TIP_61: "Então o desgraçado está morto? É uma pena que não o tenhamos capturado vivo!\n- Joseph Stalin (ao ouvir sobre o suicídio de Hitler)"
 LOADING_TIP_62: "Fomos derrotados. Fomos massacrados, perdemos a batalha.\n- Paul Reynaud, 15 de maio de 1940"
 LOADING_TIP_63: "Eu só preciso de mais algumas milhares de mortes para poder sentar na conferência da paz como um dos homens que lutou.\n- Benito Mussolini"
 LOADING_TIP_64: "Os franceses mentiram para os poloneses quando disseram que iam atacar. Não há nem sequer uma ideia disso.\n- Edmund Ironside"
 LOADING_TIP_65: "Por que morrer por Danzig?\n- Slogan anti-guerra francês, 1939"
 LOADING_TIP_66: "Há algo pretensioso sobre esta guerra.\n- William Borah, Senador dos EUA, 1939"
 LOADING_TIP_67: "A Suíça possui o povo e sistema político mais miseráveis e nojentos de todos. Os suíços são os inimigos mortais da nova Alemanha.\n- Adolf Hitler"
 LOADING_TIP_68: "O frutos da vitória estão caindo em nossas bocas rápido demais.\n- Imperador Hirohito"
 LOADING_TIP_69: "Todos vocês terminaram engraxando os sapatos dos alemães!\n- Italo Balbo"
 LOADING_TIP_70: "Afundem, queimem, capturem, destruam. Não deixem nada passar.\n- Andrew Cunningham, Batalha da Tunísia"
 LOADING_TIP_71: "Acho que talvez estejamos indo uma ponte longe demais.\n- Frederick Browning (antes da Operação Market Garden)"
 LOADING_TIP_72: "Graças a Deus pelo exército francês.\n- Winston Churchill, 1933"
 LOADING_TIP_73: "Quando você vê uma cascavel pronta para atacar, você não espera até ela dar o bote para esmagá-la.\n- Franklin D. Roosevelt"
 LOADING_TIP_74: "Regras não são necessariamente sagradas, os princípios, sim.\n- Franklin D. Roosevelt"
 LOADING_TIP_75: "Pessoas famintas e desempregadas são o tipo de coisa de que ditadores são feitos.\n- Franklin D. Roosevelt"
 LOADING_TIP_76: "Um homem precisa estar alerta a todo momento se quiser continuar respirando. Senão algum alemão filho da puta irá pegá-lo por trás e espancá-lo até a morte com uma meia cheia de merda.\n- George S. Patton"
 LOADING_TIP_77: "Fortificações, artilharia, apoio estrangeiro, nada disso valerá em nada a menos que o soldado comum saiba que é ELE que está protegendo seu país.\n- Carl Gustaf Emil Mannerheim"
 LOADING_TIP_78: "Através da lama e do sangue, rumo aos campos verdes além.\n- Lema não oficial do Corpo Blindado Canadense"
 LOADING_TIP_79: "Há uma curiosidade geral na frota britânica de se descobrir se os italianos estão no mesmo nível que eles estavam na última guerra ou se eles decaíram.\n- Winston Churchill (sobre a declaração italiana sobre a guerra)"
 LOADING_TIP_80: "E nós lutaremos contra eles com garrafas quebradas se for tudo o que tivermos\n - Winston Churchill (logo após prometer lutar nos campos e nas estradas)"
 LOADING_TIP_81: "A experiência mostrou que ataques contra tanques com armas de combate de curto alcance feitos por um homem determinado quase sempre terão êxito.\n- Manual Antitanque do Grupo de Exército Centro Alemão"
 LOADING_TIP_82: "Me dê cinquenta DC-3s e os japoneses podem ficar com a Estrada da Birmânia.\n - Chiang Kai-Shek"
 LOADING_TIP_83: "Política é guerra sem derramamento de sangue, e guerra é política com derramamento de sangue.\n - Mao Zedong"
 LOADING_TIP_84: "Mantenha os homens, esqueça o território: território pode ser conquistado novamente. Mantenha a terra e esqueça os homens: terra e homens, ambos serão perdidos.\n - Mao Zedong"
 LOADING_TIP_85: "Eu prefiro morrer em um pântano da Grande Romênia do que em um paraíso da pequena Romênia.\n - Ion Antonescu"
 LOADING_TIP_86: "O povo não importa, apenas o que eles representam importa.\n - Ion Antonescu"
 LOADING_TIP_87: "Durante a guerra, a verdade é tão preciosa que ela deveria ser sempre acompanhada de mentiras como guarda-costas.\n - Winston Churchill"
 LOADING_TIP_88: "Derrotados hoje por uma força mecânica, no futuro seremos capazes de superar graças a uma força mecânica superior. O destino do mundo depende disso.\n - Charles de Gaulle"
 LOADING_TIP_89: "Os longos lamentos dos violinos do outono enchem meu coração de langor monótono.\n - Mensagem codificada da EOE para a resistência francesa"
 LOADING_TIP_90: "Um Estado como a Suíça, que não passa de uma espinha no rosto da Europa, não pode continuar a existir.\n- Adolf Hitler"
 LOADING_TIP_91: "Aqueles capazes de vencer bem uma guerra raramente estabelecem uma boa paz, e aqueles que estabelecem uma boa paz nunca teriam vencido a guerra.\n- Winston Churchill"
 LOADING_TIP_92: "Um apaziguador é aquele que alimenta o crocodilo na esperança de ser o último a ser devorado.\n- Winston Churchill"
 LOADING_TIP_93: "Quem disse que a caneta é mais poderosa do que a espada obviamente nunca enfrentou armas automáticas.\n- Douglas MacArthur"
 LOADING_TIP_94: "Ou serei condecorado ou irei para a corte marcial. Disparar!\n- Birger Eriksen"
 LOADING_TIP_95: "Para acordar um tigre, use uma vara longa.\n- Mao Zedong"
 LOADING_TIP_96: "Se todos estão pensando da mesma forma, então alguém não está pensando.\n- George S. Patton"
 LOADING_TIP_97: "Poderíamos usar algumas dessas lâminas de barbear, Herr Reichsmarschall.\n- Erwin Rommel, após Göring afirmar que os americanos só sabem fazer lâminas de barbear"
 LOADING_TIP_98: "Não posso prever para vocês a ação da Rússia. Ela é uma charada embrulhada em um mistério dentro de um enigma.\n- Winston Churchill"
 LOADING_TIP_99: "Por mais brilhante que seja a estratégia, de vez em quando é necessário observar os resultados.\n- Winston Churchill"
 LOADING_TIP_100: "Desde a guerra greco-italiana, não se diz \"os gregos estão lutando como heróis\", mas \"os heróis estão lutando como gregos\".\n- The Montreal Daily Star, 1942"
 LOADING_TIP_101: "Patriotismo é quando o amor pelo seu povo vem em primeiro lugar. Nacionalismo é quando o ódio por outros povos fica em primeiro lugar.\n- Charles de Gaulle"
 LOADING_TIP_102: "Deve ser uma paz sem vitória. A vitória significaria uma paz forçada sobre o perdedor, com as condições do vencedor impostas ao derrotado. Ela seria aceita com humilhação e deixaria ressentimentos.\n- Woodrow Wilson, 1917"
 LOADING_TIP_103: "Se você quer segurança total, vá para a prisão. Lá você recebe comida, roupas, cuidados médicos e assim por diante. A única coisa que lhe falta é a liberdade.\n- Dwight D. Eisenhower"
 LOADING_TIP_104: "Um exército é uma equipe. Ele vive, come, dorme e luta como uma equipe. Essa história de heroísmo individual é besteira.\n- George S. Patton"
 LOADING_TIP_105: "Nunca diga às pessoas como fazer as coisas. Diga a elas o que fazer, e elas surpreenderão você com sua engenhosidade.\n- George S. Patton"
 LOADING_TIP_106: "Todos os homens têm medo. Quanto mais inteligentes eles são, mais assustados ficam.\n- George S. Patton"
 LOADING_TIP_107: "A bondade humana nunca enfraqueceu a resistência ou amoleceu a fibra de um povo livre. Uma nação não precisa ser cruel para ser forte.\n- Franklin D. Roosevelt"
 LOADING_TIP_108: "Um diplomata sincero é como água seca ou ferro de madeira.\n- Joseph Stalin"
 LOADING_TIP_109: "No decorrer da história, tem sido a inação dos que poderiam ter agido e a indiferença dos que deveriam saber melhor que possibilitaram o triunfo do mal.\n- Haile Selassie I"
 LOADING_TIP_110: "Varsóvia não está esperando por louvores vazios, por expressões de reconhecimento, nem por garantias de simpatia. Varsóvia está esperando armas e munição.\n- Józef Piłsudski"
 LOADING_TIP_111: "A ignorância e o obscurantismo nunca produziram nada além de rebanhos de escravos para a tirania.\n- Emiliano Zapata"
 LOADING_TIP_112: "É melhor morrer de pé do que viver de joelhos.\n- Emiliano Zapata"
 LOADING_TIP_113: "Senhores, vocês lutaram como leões e foram liderados por burros.\n- Erwin Rommel, para oficiais britânicos capturados durante o cerco de Tobruque"
 LOADING_TIP_114: "O problema das eleições livres é que nunca é possível prever o resultado.\n- Vyacheslav Molotov"
 LOADING_TIP_115: "O que importa para o cadáver quem estava certo e quem estava errado?\n- Manuel Azaña"
 LOADING_TIP_116: "Sua tarefa não será fácil. Seu inimigo é bem treinado, equipado e endurecido pela batalha. Ele lutará com brutalidade.\n- Dwight D. Eisenhower, junho de 1944"
 LOADING_TIP_117: "A maneira mais rápida de acabar com uma guerra é perdê-la.\n- George Orwell"
 LOADING_TIP_118: "Não queremos mais fraudes eleitorais, nem mais mentiras. Não queremos que os que não trabalham vivam dos que trabalham.\n- Juan Perón"
 LOADING_TIP_119: "Lá está o maldito Scheer! Atirem nele!\n- Frederick Secker Bell"
 LOADING_TIP_120: "Não devemos ser derrotados pelo medo do perigo que estamos nos preparando para resistir. A única coisa que devemos temer é o próprio medo.\n- Franklin D. Roosevelt"
 LOADING_TIP_121: "Nossa liberdade demonstrou sua capacidade de sobreviver à guerra, mas ela jamais sobreviveria à rendição.\n- Franklin D. Roosevelt"
 LOADING_TIP_122: "Apenas a maior loucura poderia levar alguém a contemplar uma invasão. Ninguém jamais desembarcará aqui, nem mesmo um único soldado.\n- Benito Mussolini, Sicília, 1937"
 LOADING_TIP_123: "Peguei em armas para enfrentar a ditadura sob a forma do nazismo e do fascismo. Se eu tiver que morrer lutando contra uma nova forma de ditadura, que assim seja.\n- Draža Mihailović"
 LOADING_TIP_124: "Não sei com quais armas a Terceira Guerra Mundial será travada, mas posso dizer como será a Quarta: com paus e pedras.\n- Albert Einstein"
 LOADING_TIP_125: "Sou o líder de um país com dois alfabetos, três idiomas, quatro religiões, cinco nacionalidades, seis repúblicas e rodeado por sete vizinhos, uma nação onde vivem oito minorias étnicas.\n- Josip Broz Tito"
 LOADING_TIP_126: "Como a história julgará o povo alemão, se nem mesmo um punhado de homens teve a coragem de acabar com aquele criminoso?\n- Henning von Tresckow"
 LOADING_TIP_127: "O mundo inteiro nos transformará em vilões, mas ainda estou convencido de que fizemos a coisa certa. Hitler é o arqui-inimigo não só da Alemanha, mas do mundo.\n- Henning von Tresckow"
 LOADING_TIP_128: "O inimigo começou a empregar uma bomba nova e cruel, cujo poder destrutivo é incalculável, tirando a vida de muitos inocentes.\n- Imperador Hirohito, 1945"
 LOADING_TIP_129: "A regra número 1, na primeira página do livro da guerra é: \"Não marche para Moscou\". Muitas pessoas tentaram, e não deu certo.\n- Bernard L. Montgomery"
 LOADING_TIP_130: "As mentiras de que a Alemanha atacará a Áustria amanhã ou depois estão sendo espalhadas novamente.\n- Adolf Hitler, 1936"
 LOADING_TIP_131: "O soldado alemão surpreendeu o mundo; o Bersagliere italiano surpreendeu o soldado alemão.\n- Erwin Rommel"
 LOADING_TIP_132: "Esta é a última exigência territorial que faço na Europa.\n- Adolf Hitler, a respeito da Região dos Sudetas em 1938"
 LOADING_TIP_133: "Não estamos em condições de suportar uma guerra estática prolongada. Onde quer que os Aliados concentrem suas forças, eles vão conseguir vencer.\n- Gerd von Rundstedt"
 LOADING_TIP_134: "Se entrarmos em guerra contra os Estados Unidos, não teremos chance de ganhar a menos que a frota americana nas águas do Havaí seja destruída.\n- Isoroku Yamamoto, 1941"
 LOADING_TIP_135: "Você tem inimigos? Ótimo. Isso significa que você defendeu algo em algum momento da sua vida.\n- Winston Churchill"
 LOADING_TIP_136: "Isso não é paz. É um armistício de vinte anos.\n- Ferdinand Foch, 1919"
 LOADING_TIP_137: "Você pode pagar um preço muito alto, até mesmo pela paz.\n- Michael Joseph Savage sobre a política de apaziguamento de Chamberlain"
 LOADING_TIP_138: "A força é a única linguagem que eles entendem, como os valentões.\n- Franklin D. Roosevelt sobre Adolf Hitler e Benito Mussolini"
 LOADING_TIP_139: "Diz-se que a democracia é a pior forma de governo, exceto por todas as outras que têm sido experimentadas de tempos em tempos.\n- Winston Churchill"
 LOADING_TIP_140: "O mundo não será destruído por aqueles que praticam o mal, mas por aqueles que ficam de braços cruzados diante disso.\n- Albert Einstein"
 LOADING_TIP_141: "O extremo perigo para a humanidade inerente à proposta supera qualquer vantagem militar.\n- Robert Oppenheimer sobre as armas termonucleares, 1949"
 LOADING_TIP_142: "Sabíamos que o mundo não seria o mesmo. Algumas pessoas riram, outras choraram. A maioria permaneceu em silêncio.\n- Robert Oppenheimer, após o Teste Trinity"
 LOADING_TIP_143: "Agora eu me tornei a Morte, a destruidora de mundos.\n- Robert Oppenheimer, após o Teste Trinity"
 LOADING_TIP_144: "Todo homem sente medo em sua primeira batalha. Se ele diz o contrário, está mentindo.\n- George S. Patton"
 LOADING_TIP_145: "O verdadeiro herói é o homem que luta mesmo quando está com medo.\n- George S. Patton"
 LOADING_TIP_146: "Assuma riscos calculados. Isso é bem diferente de ser imprudente.\n- George S. Patton"
 LOADING_TIP_147: "Há quatrocentas sepulturas bem marcadas na Sicília, tudo porque um homem dormiu no trabalho. Mas são sepulturas alemãs, porque pegamos o desgraçado dormindo antes que seu oficial o pegasse.\n- George S. Patton"
 LOADING_TIP_148: "Eu vi a guerra. Vi o sangue escorrer dos feridos. Vi os mortos na lama. Vi cidades destruídas. Eu odeio a guerra.\n- Franklin D. Roosevelt"
 LOADING_TIP_149: "Vida longa ao Cristo Rei! Vida longa à Áustria!\n- Últimas palavras de Heinrich Maier, 1945"
 LOADING_TIP_150: "Eu rejeito totalmente o nazifascismo para a Áustria... Esse movimento não austríaco promete tudo a todos, mas na realidade busca a mais brutal submissão do povo austríaco!\n- Otto von Habsburg"
 LOADING_TIP_151: "Não há dúvidas de que nunca aceitaremos representantes nazistas no gabinete austríaco.\n- Kurt Schuschnigg, 1938"
 LOADING_TIP_152: "O rei é uma autoridade tão fictícia quanto Deus. Esse fato fez do ateísmo e do republicanismo duas faces da mesma moeda.\n- Noe Zhordania"
 LOADING_TIP_153: "Há décadas em que nada acontece e há semanas em que décadas acontecem.\n- Vladimir Lenin"
 LOADING_TIP_154: "O hasteamento daquela bandeira em Suribachi garantiu um Corpo de Fuzileiros Navais pelos próximos quinhentos anos.\n- Secretário da Marinha James Forrestal, Iwo Jima, 1945"
 LOADING_TIP_155: "Que nos firmemos em nossos deveres, e que nossa conduta seja tal que, mesmo que o Império Britânico e sua Comunidade perdurem por mil anos, ainda se diga: \"Este foi o seu momento de maior glória.\"\n- Winston Churchill"
 LOADING_TIP_156: "Estou passando pelo momento mais triste da minha vida, pois estou cumprindo um dever muito doloroso; um dever que, para mim, é pior do que a morte.\n- Jan Syrový, 1938, após aceitar o acordo de Munique."
 LOADING_TIP_157: "A República é minha criança. Ela está correndo o risco de se afogar. Estou tentando mantê-la boiando e estamos sendo levados pela correnteza do rio. Peço ajuda à Inglaterra e à América. Elas ficam na margem zombando de mim.\n- Sun Yat-Sen"
 LOADING_TIP_158: "A letra V é a primeira letra das palavras \"Victoire\" em francês e \"Vrijheid\" em flamengo... Vitória de nossos bons amigos, os ingleses. \"Victory\" também começa com V. \n- Victor de Laveleye, para a campanha V de Vitória"
 LOADING_TIP_159: "Povo das Filipinas: eu voltei. \n- Douglas MacArthur"
 LOADING_TIP_160: "A luta pela liberdade não é a luta de um único homem, nem de uma única nação. É o esforço coletivo de todos aqueles que rejeitam as correntes de um senhor. \n- Sergio Osmeña"
 LOADING_TIP_161: "Os Vigilantes da Costa salvaram Guadalcanal, e Guadalcanal salvou o Pacífico Sul. \n- William Halsey"
 LOADING_TIP_162: "Se eu precisasse conquistar o inferno, eu enviaria os australianos para tomá-lo e os neozelandeses para defendê-lo. \n- Erwin Rommel"
