 losing_soverignty_threatened_tt: "§RAmeaça à soberania finlandesa§!: perder o controle de um estado central finlandês diminuirá a £GFX_power_balance_texticon §Yconfiança pública§!."
 FIN_personal_agenda_svinhufvud_tt: "§GErradicar o socialismo§!: ter menos que §Y1%§! de apoio para as ideologias $democratic$ e $communism$ aumentará a £GFX_power_balance_texticon §Yconfiança pública§!. \n  - §RApoio preocupante a socialistas§!: ter mais que §Y9%§! de apoio para as ideologias $democratic$ ou $communism$ diminuirá a £GFX_power_balance_texticon §Yconfiança pública§!. \n  - $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_kallio_tt: "§GErradicar o extremismo§!: ter menos que §Y1%§! de apoio para as ideologias $fascism$ e $communism$ aumentará a £GFX_power_balance_texticon §Yconfiança pública§!. \n  - §RApoio preocupante a extremistas§!: ter mais que §Y9%§! de apoio para as ideologias $fascism$ ou $communism$ diminuirá a £GFX_power_balance_texticon §Yconfiança pública§!. \n  - $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_ryti_tt: "§GSonho da Grande Finlândia§!: ocupar estados centrais finlandeses controlados por um inimigo aumentará a £GFX_power_balance_texticon §Yconfiança pública§!. \n  - §RApoio preocupante a socialistas§!: ter mais que §Y9%§! de apoio para as ideologias $democratic$ ou $communism$ diminuirá a £GFX_power_balance_texticon §Yconfiança pública§!. \n  - $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_mannerheim_tt: "§GLíder confiável§!: estar em guerra aumentará a £GFX_power_balance_texticon §Yconfiança pública§!. \n  - §RRegente nomeado§!: estar em paz diminuirá a £GFX_power_balance_texticon §Yconfiança pública§!."
 FIN_personal_agenda_paasikivi_tt: "§GConservador pragmático§!: possuir mais de §Y95%§! de £GFX_stability_texticon $stability$ aumentará a £GFX_power_balance_texticon §Yconfiança pública§!. \n  - §RZeloso§!: possuir menos de §Y60%§! de £GFX_stability_texticon $stability$ diminuirá a £GFX_power_balance_texticon §Yconfiança pública§!. \n  - $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_annala_tt: "§GNação forte§!: Ter mais de §Y300.000§! de £GFX_manpower_texticon $MANPOWER$ em campo e menos de §Y5%§! de Progresso de Rendição enquanto estiver em guerra aumentará a £GFX_power_balance_texticon §Yconfiança pública§!. \n  - §RApoio preocupante a socialistas§!: ter mais que §Y9%§! de apoio para as ideologias $democratic$ ou $communism$ diminuirá a £GFX_power_balance_texticon §Yconfiança pública§!. \n  - $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_tanner_tt: "§GNação unida§!: Controlar §YKarjala§! e todos os estados controlados enquanto tem mais de §Y95%§! de apoio à ideologia $democratic$ aumentará a £GFX_power_balance_texticon §Yconfiança pública§!. \n  - §RApoio preocupante a extremistas§!: ter mais que §Y9%§! de apoio para as ideologias $fascism$ ou $communism$ diminuirá a £GFX_power_balance_texticon §Yconfiança pública§!. \n  - $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_aaltonen_tt: "§GCruzada antifascista§!: Ter uma contribuição superior a §Y10%§! na Participação na Guerra em todas as guerras ativas e inferior a §Y5%§! no Progresso de Rendição enquanto estiver em guerra contra um país fascista aumentará a £GFX_power_balance_texticon §Yconfiança pública§!. \n  - §RProletariado dividido§!: Ter menos de §Y80%§! de apoio à ideologia $communism$ diminuirá a £GFX_power_balance_texticon §YConfiança Pública§!. \n  - $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_leino_tt: "§GFascismo europeu destruído§!: Ter menos de §Y1%§! de apoio à ideologia $fascism$ enquanto mantém a Europa livre de governos fascistas aumentará a £GFX_power_balance_texticon §Yconfiança pública§!. \n  - §RProletariado dividido§!: Ter menos de §Y80%§! de apoio à ideologia $communism$ diminuirá a £GFX_power_balance_texticon §Yconfiança pública§!. \n  - $losing_soverignty_threatened_tt$"
