 idea_SIA_military_humiliation: "Humilhação militar"
 idea_SIA_death_defiant: "Desafiando a morte"
 idea_SIA_death_defiant_desc: "Já estamos mortos. Venha tomar o que lhe é devido, se puder."
 idea_SIA_songsuradet_ascendant_0: "Ascensão de Songsuradet"
 idea_SIA_songsuradet_ascendant_0_desc: "Após conseguir resistir à ira do governo, Phraya Songsuradet consolidou sua base de poder e saiu ainda mais fortalecido. Agora ele é o que muitos chamariam de intocável, uma figura pública importante e proeminente demais para ser removida.\nÉ provável que passe a interferir nas políticas governamentais, atrasando decisões para que não volte a ser alvo de um expurgo."
