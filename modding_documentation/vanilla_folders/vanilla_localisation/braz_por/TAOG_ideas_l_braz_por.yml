 ############
 idea_SIA_civilian_full_support: "Ala civil: §Gapoio total§!"
 idea_SIA_civilian_full_support_desc: "A ala civil apoia firmemente o governo. Administradores e tecnocratas emprestam seu conhecimento, fazendo o desenvolvimento avançar."
 idea_SIA_civilian_slight_support: "Ala civil: apoio moderado"
 idea_SIA_civilian_slight_support_desc: "A ala civil apoia as decisões do governo de modo geral. A cooperação traz benefícios modestos, porém tangíveis."
 idea_SIA_civilian_neutral: "Ala civil: neutra"
 idea_SIA_civilian_neutral_desc: "A ala civil não ajuda, mas também não atrapalha o governo. A administração funciona, mas sem o incentivo de um alinhamento político genuíno."
 idea_SIA_civilian_opposition: "Ala civil: em oposição"
 idea_SIA_civilian_opposition_desc: "A ala civil se voltou contra o governo. Oficiais fazem corpo mole e orçamentos são desviados, extenuando as operações do Estado."
 idea_SIA_civilian_rebellious: "Ala civil: §Rrebelde§!"
 idea_SIA_civilian_rebellious_desc: "A ala civil está irredutível em sua afronta. A instabilidade está se espalhando e a ameaça de uma ruptura política aumenta a cada dia."
 idea_SIA_military_full_support: "Ala militar: §Gapoio total§!"
 idea_SIA_military_full_support_desc: "A ala militar apoia firmemente o governo. Oficiais estão oferecendo suporte a campanhas de recrutamento e à produção de armas, canalizando os recursos do Exército para metas nacionais."
 idea_SIA_military_slight_support: "Ala militar: apoio moderado"
 idea_SIA_military_slight_support_desc: "A ala militar tem cooperado de modo geral. Seu apoio traz melhorias modestas ao recrutamento e à produção, embora sem compromisso total."
 idea_SIA_military_neutral: "Ala militar: neutra"
 idea_SIA_military_neutral_desc: "A ala militar está em cima do muro. O Exército está realizando seu dever sem entusiasmo nem resistência, esperando os fatos se desenrolarem."
 idea_SIA_military_opposition: "Ala militar: em oposição"
 idea_SIA_military_opposition_desc: "A ala militar está sabotando o governo. Oficiais comprometem os esforços de produção, e o entusiasmo pela causa do governo está sumindo das tropas."
 idea_SIA_military_rebellious: "Ala militar: §Rrebelde§!"
 idea_SIA_military_rebellious_desc: "A ala militar está à beira da afronta declarada. O processo de recrutamento está sendo sabotado, a produção bélica está sofrendo e a sombra de um golpe se aproxima."
 idea_SIA_defenders_of_constitutional_liberty: "Defensores da liberdade constitucional"
 idea_SIA_civil_service_heroism_1: "Heroísmo do serviço civil"
 idea_SIA_civil_service_heroism_1_desc: "O serviço civil atendeu ao chamado. Sua dedicação e seu conhecimento aceleram silenciosamente o ritmo da pesquisa e do desenvolvimento estatais."
 idea_SIA_civil_service_heroism_2: "$idea_civil_service_heroism_1$"
 idea_SIA_civil_service_heroism_2_desc: "$idea_SIA_civil_service_heroism_1_desc$"
 idea_SIA_redirected_military_funds: "Fundos militares redirecionados"
