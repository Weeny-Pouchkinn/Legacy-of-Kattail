 AST_singapore_strategy_idea_desc: "A pedido da Austrália, faremos um esforço para melhorar as estruturas defensivas em Singapura. Afinal, a Estratégia de Singapura é um componente central da política de defesa do Pacífico.\n\n§W§YAo remover§! (§YSingapura§!):\n Adiciona §G2§! §Ybases aéreas§!.\n Adiciona §G2§! §Ybases navais§!.\n Adiciona §G1§! §Yforte costeiro§!.§!\n"
