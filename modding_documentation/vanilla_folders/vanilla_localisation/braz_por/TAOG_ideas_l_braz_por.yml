 AST_anti_fascist_measures: "Medidas antifascistas"
 AST_anti_fascist_measures_desc: "O fascismo ainda não se estabeleceu na Austrália, e as forças democráticas querem que continue assim. A Agência de Investigação da Comunidade vai monitorar e deter todos os elementos suspeitos para impedir que grupos fascistas ganhem influência."
 ABDA_corps_expeditionnaire_spirit: "Corps Expéditionnaire"
 ABDA_corps_expeditionnaire_spirit_desc: "As forças francesas enviadas ao teatro de operações do Pacífico foram moldadas pelo serviço colonial e estão acostumadas a operar longe da pátria em condições adversas. Sua experiência de combate no sudeste asiático lhes concede uma compreensão particular das táticas e do terreno japoneses, tornando-as uma força resiliente diante do avanço inimigo."
 ABDA_maintain_strategic_flexibility_spirit: "Flexibilidade estratégica"
 ABDA_maintain_strategic_flexibility_spirit_desc: "A produção industrial americana está sendo direcionada ao teatro de operações do Pacífico, com a produção nos estaleiros acelerada para sustentar uma frota capaz de projetar poder por todo o oceano. Ao evitar comprometer-se excessivamente em uma única frente, os Estados Unidos garantem que sua força naval seja empregada onde for mais necessário."
 AST_toe_the_line_spirit: "Obedecer às regras"
 AST_toe_the_line_spirit_desc: "O Estado convocou ao sacrifício e a população respondeu. Racionamento, jornadas de trabalho mais longas e o redirecionamento da produção civil para o esforço nacional liberaram recursos que o governo não teria como obter de outra forma. É uma medida severa, e nem todos a aceitam de bom grado."
