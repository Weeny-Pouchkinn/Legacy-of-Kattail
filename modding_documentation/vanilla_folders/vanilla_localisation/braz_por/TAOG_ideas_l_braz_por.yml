 AST_war_plan_japan: "Plano de guerra: Japão"
 AST_australian_culture_investments_idea: "Investimentos na cultura australiana"
 AST_australian_culture_investments_idea_desc: "§W§YAo remover§!:\nAdiciona §YSentimento de pertencimento§!, que concede\nEstabilidade: §G+10%§!\nApoio à guerra: §G+10%§!§!\n"
 AST_a_sense_of_place: "Sentimento de pertencimento"
 AST_a_sense_of_place_desc: "A identidade nacional é o vínculo que mantém um povo unido. Sob uma cultura próspera, os australianos se uniram, comprometidos em resistir a qualquer um que ameace suas fronteiras."
 AST_a_sense_of_place_upgraded: "Sentimento de pertencimento"
 AST_a_sense_of_place_upgraded_desc: "A identidade nacional que antes florescia silenciosamente adquiriu um caráter mais firme. Já não se trata apenas do orgulho por uma terra e um modo de vida, mas da convicção de que aquilo que a Austrália construiu merece ser defendido, e de que os homens e mulheres que vivem sob o Cruzeiro do Sul estão prontos para lutar por isso."
 AST_the_promise_of_nauru: "A promessa de Nauru"
 AST_the_promise_of_nauru_tt: "Efeitos quando o governo §Yd[AST.GetNameDef]§! finalizar o acordo:\n§YNauru§! fica sob posse e controle §Yd[GER.GetNameDef]§!\nO Estado §Y[AST.GetAdjective]§! torna-se livre\n[GET_AST_NAURU_PACT_FACTION_EFFECT]"
