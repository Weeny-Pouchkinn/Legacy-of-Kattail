 NZL_railways_board: "O Conselho das Ferrovias Governamentais"
 NZL_railways_board_desc: "O Conselho das Ferrovias Governamentais foi criado em 1931 como uma reestruturação do Departamento de Ferrovias, em uma tentativa de afastar a tomada de decisões dos departamentos governamentais. No entanto, houve poucos sinais de melhora na malha ferroviária desde sua criação. A pressão aumenta para que o governo desfaça o conselho e retome o controle direto."
 NZL_great_depression: "A Grande Depressão"
 NZL_great_depression_desc: "O colapso da economia global em 1929 atingiu com muita força a economia amplamente agrícola da Nova Zelândia. Com países comprando menos produtos neozelandeses, muitos ficaram desempregados, reduzindo o poder de compra dos consumidores e, por sua vez, causando o colapso de outras indústrias. Anos de austeridade deixaram a nação ansiosa por uma mudança de rumo."
 NZL_commonwealth_loyalty: "Lealdade à Comunidade Britânica"
 NZL_commonwealth_loyalty_desc: "A Nova Zelândia continua sendo um membro comprometido da Comunidade Britânica e mantém o rei como legítimo chefe de Estado. A economia neozelandesa também é altamente integrada ao sistema econômico imperial mais amplo."
 NZL_national_coal_board_idea: "Conselho Nacional do Carvão"
 NZL_ministry_of_public_works_dynamic_modifier: "Ministério de Obras Públicas"
 modify_NZL_ministry_of_public_works_dynamic_modifier_tt: "Modifica §Y$NZL_ministry_of_public_works_dynamic_modifier$§! em:"
 # ABDACOM Supreme Command dynamic modifier
 ABDA_supreme_command: "Comando Supremo ABDACOM"
 ABDA_supreme_command_desc: "O Comando Americano-Britânico-Neerlandês-Australiano (ou ABDACOM) estabeleceu uma doutrina naval unificada entre todas as Marinhas dos Estados membros. Conforme a aliança se fortalece, a inteligência compartilhada, patrulhas coordenadas e apoio logístico mútuo aumentam gradualmente a eficácia de combate de cada frota que navega sob a bandeira do ABDACOM."
 modify_ABDA_supreme_command_tt: "Modifica §Y$ABDA_supreme_command$§! em:"
