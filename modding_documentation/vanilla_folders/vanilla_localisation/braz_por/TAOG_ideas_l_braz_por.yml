 idea_INS_volksraad: "O Volksraad"
 idea_INS_volksraad_desc: "O Volksraad é um órgão estabelecido pelos Países Baixos em 1918 como parte do sistema de \"Políticas Éticas\", com o objetivo de criar um sistema de semidemocracia no qual diferentes minorias étnicas e culturas do arquipélago possam ser representadas. Embora seja, em teoria, um sistema democrático, o governador-geral e a Coroa neerlandesa possuem poder de veto absoluto."
 INS_volksraad_custom_tt: "Permite contratar §Yconselheiros do Volksraad§!\nPermite utilizar as §Ydecisões do Volksraad§!"
 INS_great_depression: "A Grande Depressão"
 INS_great_depression_desc: "Embora o impacto direto causado pela Grande Depressão nas Índias tenha sido pequeno, as políticas protecionistas adotadas em diversos países ao redor do mundo tiveram efeitos devastadores sobre a economia local, que depende da exportação contínua de matérias-primas como borracha e petróleo."
 INS_great_depression_tt: "Modifica §Y$INS_great_depression$§! em:"
 INS_dutch_east_indies: "Administração ineficiente"
 INS_dutch_east_indies_desc: "As Índias Orientais constituem um vasto arquipélago com centenas de culturas e línguas distintas, o que as torna uma colônia notoriamente difícil de administrar. Os diversos movimentos de independência, as barreiras culturais e os efeitos econômicos da Grande Depressão agravaram ainda mais essa situação, resultando em uma administração altamente ineficiente. As \"Políticas Éticas\", estabelecidas em 1918, buscaram melhorar o cenário ao instituir regulamentações trabalhistas mais justas e garantir representação democrática a grupos minoritários. No entanto, a Grande Depressão fez com que essas medidas fossem, em grande parte, negligenciadas."
 INS_dutch_east_indies_tt: "Modifica §Y$INS_dutch_east_indies$§! em:"
 INS_volksraad_tt: "Modifica §Y$INS_dutch_east_indies$§! em:"
 INS_royal_netherlands_east_indies_army_desc: "O Koninklijk Nederlands Indisch Leger (KNIL) é o exército tradicional das Índias Orientais, que opera de forma independente dos Países Baixos. O KNIL é composto tanto por soldados europeus quanto indonésios, embora as barreiras culturais e linguísticas entre as diversas culturas do arquipélago e os Países Baixos tornem o recrutamento um processo difícil e lento."
 idea_INS_netherlands_most_precious_jewel: "A joia mais preciosa dos Países Baixos"
 idea_INS_netherlands_most_precious_jewel_desc: "As Índias Orientais Holandesas foram colônia dos Países Baixos por cerca de 350 anos, e a administração da colônia está intimamente integrada ao governo neerlandês. As Índias Orientais são frequentemente chamadas de \"a joia da coroa neerlandesa\" e os Países Baixos não demonstraram qualquer intenção de reduzir seu controle sobre essa joia preciosa."
 INS_netherlands_most_precious_jewel_tt: "£GFX_trigger_no Pode elevar a autonomia para Livre"
