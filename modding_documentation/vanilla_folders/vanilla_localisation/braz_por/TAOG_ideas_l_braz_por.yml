 AST_poor_population_growth: "Baixo crescimento populacional"
 AST_poor_population_growth_desc: "Quando a Grande Depressão chegou em 1929, as taxas de natalidade australianas caíram drasticamente. Combinado a um declínio da imigração, o crescimento populacional tem tido dificuldade para se recuperar desde então."
