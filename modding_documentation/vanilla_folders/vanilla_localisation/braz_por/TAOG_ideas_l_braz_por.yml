 idea_SIA_constitutional_virtue: "Virtude constitucional"
 idea_SIA_an_absolute_monarchy: "Uma monarquia absolutista"
 idea_SIA_an_absolute_monarchy_desc: "Toda autoridade política pertence à Coroa. A palavra do rei é lei, dissidências são suprimidas e o peso do prestígio real é o que sustenta a mobilização nacional. O trono exige lealdade e o Exército é seu instrumento."
 idea_SIA_a_constituional_monarchy: "Uma monarquia constitucional"
 idea_SIA_a_constituional_monarchy_desc: "Uma estrutura constitucional define os limites do poder real e consagra os direitos do povo. Com a Coroa como um símbolo unificador, e não uma autoridade absolutista, a nação se torna mais estável, mais aberta a novas ideias e mais alinhada ao mundo democrático."
 idea_SIA_restoring_order: "Restaurando a ordem"
 idea_SIA_military_expansion_costs: "Custos da expansão militar"
 idea_SIA_a_modern_economy: "Uma economia moderna"
 idea_SIA_death_to_communists: "Morte aos comunistas"
 idea_SIA_death_to_communists_desc: "O fervor anticomunista permeia as tropas, dando às nossas forças a supremacia sobre o exército comunista da China."
 idea_SIA_death_to_nationalists: "Morte aos nacionalistas"
 idea_SIA_death_to_nationalists_desc: "O sentimento antinacionalista permeia as tropas, dando às nossas forças a supremacia sobre o exército nacionalista da China."
 idea_SIA_breaking_the_burmese_line: "Romper a linha birmanesa"
 idea_SIA_the_yellow_dossier: "O Dossiê Amarelo"
 idea_SIA_the_yellow_dossier_desc: "Um relatório confidencial sobre o estado da indústria nacional forçou o reconhecimento de ineficiências profundamente enraizadas. As reformas necessárias estão começando a dar frutos em nossas fábricas, embora a perturbação provocada por elas tenha um custo."
 idea_SIA_the_yellow_dossier_2: "$idea_SIA_the_yellow_dossier$"
 idea_SIA_the_yellow_dossier_2_desc: "$idea_SIA_the_yellow_dossier_desc$"
 idea_SIA_pacific_war_preparations: "Preparativos para a Guerra do Pacífico"
 idea_SIA_a_race_against_time: "Uma corrida contra o tempo"
 idea_SIA_overheated_economy: "Economia superaquecida"
 idea_SIA_overheated_economy_desc: "A economia foi forçada além de seus limites naturais. A demanda ultrapassou a capacidade de produção e o crescimento do setor imobiliário estagnou-se enquanto as coisas esfriam."
 idea_SIA_ending_military_grift: "Fim da corrupção do Exército"
 idea_SIA_the_military_oversight_bureau: "$SIA_military_oversight_bureau$"
 idea_SIA_the_military_oversight_bureau_desc: "O Departamento de Supervisão Militar estabelece padrões mais elevados para novos comandantes e acelera o desenvolvimento de especialistas nas divisões de oficiais."
 idea_SIA_public_credit_debt: "Dívida de crédito público"
 idea_SIA_public_credit_debt_desc: "As obrigações de crédito do Estado drenam constantemente nossa economia, gastando recursos que, do contrário, poderiam ser direcionados para os bens de produção e consumo."
 idea_SIA_public_credit_debt_2: "Quitação da $idea_SIA_public_credit_debt$"
 idea_SIA_public_credit_debt_2_desc: "$idea_SIA_public_credit_debt_desc$"
 idea_SIA_revision_of_unequal_treaties: "Revisão dos tratados desiguais"
 idea_SIA_purged_military: "Exército expurgado"
 idea_SIA_purged_military_desc: "A remoção de oficiais considerados ameaças políticas deixou o Exército sem uma liderança experiente, dificultando a organização e o desenvolvimento das tropas restantes."
 SIA_khana_ratsadon_inlay_title: "Khana Ratsadon"
 SIA_civilian_wing_label: "Ala civil"
 SIA_military_wing_label: "Ala militar"
 SIA_wing_state_full_support: "§GApoio total§!"
 SIA_wing_state_slight_support: "§GApoio moderado§!"
 SIA_wing_state_neutral: "§YNeutra§!"
 SIA_wing_state_opposition: "§REm oposição§!"
 SIA_wing_state_rebellious: "§RRebelde§!"
 SIA_civilian_wing_history_tt: "A facção civil do Khana Ratsadon é liderada por administradores e tecnocratas progressistas, sendo §YPridi Phanomyong§! o mais importante deles. Ele estudou Direito na França e voltou com ambições sobre reforma agrária, planejamento econômico estatal e uma democracia constitucional que genuinamente empoderasse o povo.\n\nA ala civil é amplamente §Gpró-desenvolvimento§!, priorizando investimentos na educação, infraestrutura e indústria. Eles são céticos em relação a grandes gastos militares e temem qualquer sinal de liderança pela força. O apoio deles pode ser facilmente conquistado com políticas de modernização do Estado e proteção ao governo constitucional."
 SIA_military_wing_history_tt: "A facção militar do Khana Ratsadon é dominada por oficiais do Exército que se enxergam como os verdadeiros guardiões da revolução. Sua figura mais ambiciosa é §YPlaek Phibunsongkhram§!, um coronel cuja admiração pelos movimentos nacionalistas da Europa cresce a cada ano.\n\nA ala militar é §Gpró-rearmamento§! e inclinada a um Estado forte e centralizado. Eles não confiam nos ideais econômicos de Pridi, que consideram perigosamente radicais, e têm pouca tolerância para a interferência civil em assuntos de defesa nacional. A lealdade deles pode ser facilmente conquistada com investimento militar e políticas de projeção da força nacional."
 idea_SIA_wing_promotion_disruption: "Realinhamento de facção"
 idea_SIA_wing_promotion_disruption_desc: "O favorecimento escancarado de uma das alas do Khana Ratsadon abalou a estabilidade do governo. A facção negligenciada reluta em agir, a rotina do Exército está em desordem e a administração ordinária sofrerá até que o novo arranjo se consolide."
 idea_SIA_military_wing_unrest: "Revolta da ala militar"
 idea_SIA_military_wing_unrest_desc: "A paciência dos oficiais chegou novamente ao fim. Incapaz de tomar o poder pela força, a ala militar passou a descarregar sua fúria por meio de sabotagens, deserções e insubordinação. A força de combate do Exército despencará até que os descontentes sejam subjugados."
 idea_SIA_civilian_wing_unrest: "Revolta da ala civil"
 idea_SIA_civilian_wing_unrest_desc: "A facção de Pridi voltou a perder a confiança no governo. Privada de uma nova oportunidade de assumir o poder, a ala civil agora recorre a greves, obstrução burocrática e agitação urbana. A economia está estagnada e a governabilidade do país ficará comprometida até que os ânimos se acalmem."
 idea_SIA_unwavering_civilian_support: "Apoio civil inabalável"
 idea_SIA_unwavering_civilian_support_desc: "Com a ala militar dissolvida e a questão da legitimidade resolvida, a administração civil governa sem oposição. Livre da interferência dos militares, os tecnocratas de Pridi dedicam-se ao governo com um entusiasmo que a antiga coalizão jamais poderia alcançar."
 idea_SIA_unified_khana_ratsadon: "Partido Popular Unido"
 idea_SIA_unified_khana_ratsadon_desc: "A antiga disputa entre militares e civis chegou ao fim. Com ambas as alas do Khana Ratsadon finalmente alinhadas, o governo pode agir com uma coesão nunca vista. Soldados, administradores e industrialistas trabalham agora com os mesmos objetivos em mente."
