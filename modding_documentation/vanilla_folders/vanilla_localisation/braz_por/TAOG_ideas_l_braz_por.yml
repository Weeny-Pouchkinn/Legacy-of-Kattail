 idea_SIA_specialist_marine_forces: "Forças de fuzileiros especializadas"
 idea_SIA_specialist_marine_forces_desc: "Um quadro de unidades anfíbias especializadas foi treinado e equipado para operações de ataque costeiro."
 idea_SIA_rehabilitated_military: "Reabilitação militar"
 idea_SIA_desperate_gambit: "Gambito desesperado"
 idea_SIA_desperate_gambit_desc: "Talvez haja uma saída para o buraco em que você se meteu. Suba!"
 idea_SIA_purged_senior_military: "Militares do alto escalão expurgados"
 idea_SIA_purged_senior_military_desc: "Oficiais veteranos que representavam uma ameaça ao governo foram removidos de suas posições. A perda de comandantes experientes deixou uma cicatriz na coesão do Exército e no desenvolvimento profissional."
 idea_SIA_cemented_control: "Controle consolidado"
 idea_SIA_cemented_control_desc: "O governo consolidou seu controle sobre as instituições estatais. A oposição política foi marginalizada e as engrenagens do poder agora giram seguramente a favor do governo."
 idea_SIA_cemented_control_2: "Controle fortalecido"
 idea_SIA_cemented_control_2_desc: "$idea_SIA_cemented_control_desc$"
 idea_SIA_cemented_control_3: "Lei do Dever Tailandês durante a Guerra"
 idea_SIA_cemented_control_3_desc: "No caso de uma guerra que ameace a soberania da Coroa e de sua nação, é dever de todo cidadão tailandês respeitável resistir à ocupação por qualquer meio possível, seja pegando em armas ou de outra forma."
 idea_SIA_suspend_ordinary_legal_procedures: "Procedimentos jurídicos ordinários suspensos"
