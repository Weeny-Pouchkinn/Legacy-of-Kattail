 idea_SIA_oss_special_forces_training: "Treinamento das forças especiais da OSS"
 idea_SIA_seized_japanese_funds: "Fundos japoneses apreendidos"
 idea_SIA_seized_japanese_funds_desc: "Com o acordo japonês desfeito, os fundos e estoques abandonados passam a ser nossos, impulsionando a expansão da construção e da produção industrial."
 idea_SIA_oss_special_forces_training_desc: "Nossos agentes treinaram ao lado da OSS em sabotagem, infiltração e operações aerotransportadas. As lições aprendidas transformaram nossas forças especiais em um instrumento de combate formidável."
 idea_SIA_sold_privy_purse_lands: "Vendeu terras da Coroa"
 idea_SIA_sold_privy_purse_lands_desc: "A venda de propriedades da Casa Real injetou capital no Estado, aliviando pressões econômicas e reservando recursos para construções."
 idea_SIA_war_fervor: "Fervor de guerra"
 idea_SIA_bloodlusted_irredentism: "Irredentismo sanguinário"
 idea_SIA_bloodlusted_irredentism_desc: "A ambição territorial se transformou em algo mais feroz. O Exército está lutando com a convicção de alguém que acredita estar reivindicando o que é seu por direito."
 idea_SIA_the_royal_police_counterweight: "Lealdade da Polícia Real"
 idea_SIA_civilian_technocrats_in_institutions: "Tecnocratas civis"
 idea_SIA_civilian_technocrats_in_institutions_desc: "Especialistas civis em instituições estatais importantes melhoraram tanto a extração de recursos como a eficiência de nomeações políticas."
 idea_SIA_yuvachon: "Yuvachon"
 idea_SIA_yuvachon_desc: "O movimento Yuvachon treina a juventude do país com disciplina militar, criando uma reserva de mão de obra preparada e com sentimentos nacionalistas."
