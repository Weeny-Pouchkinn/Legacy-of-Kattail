l_braz_por:
 ##CZECHOSLOVAKIA##
 MUN_czech_skoda_priority.t: "A Škoda Works"
 MUN_czech_skoda_priority.d: "A empresa Škoda Works produz uma ampla variedade de produtos, como artilharia, tanques, trens e armas navais. Isso proporciona muita versatilidade para transportar os recursos para onde há mais demanda, o que já podemos direcionar parcialmente."
 MUN_czech_skoda_priority.1.a: "Interessante."
 MUN_czech.2.t.1: "Os paramilitares da Região dos Sudetas pedem ajuda"
 MUN_czech.2.t.2: "O Corpo de Voluntários da Região dos Sudetas pede ajuda"
 MUN_czech.2.t.3: "As Milícias de Trabalhadores Sudetas pedem ajuda"
 MUN_czech.2.d.1: "Diante das recentes notícias sobre os nossos projetos n[CZE.GetNameDef], muitos partidos políticos da Região dos Sudetas reuniram rapidamente paramilitares em toda a região para tentar minar o governo [CZE.GetAdjective]. Agora, eles pedem a nossa ajuda para realizar incursões entre fronteiras e atos de sabotagem para auxiliar os nossos esforços contra [CZE.GetNameDef]."
 MUN_czech.2.d.2: "Diante das recentes notícias sobre os nossos projetos n[CZE.GetNameDef], os partidos políticos da Região dos Sudetas mobilizaram rapidamente seus paramilitares, o Corpo de Voluntários dos Sudetas. O Corpo de Voluntários na Região dos Sudetas formou unidades e começou a atacar propriedades do governo [CZE.GetAdjective] na região. Agora, eles pedem toda a nossa ajuda para realizar incursões entre fronteiras e atos de sabotagem contra [CZE.GetNameDef]."
 MUN_czech.2.d.3: "Diante das recentes notícias sobre os nossos projetos n[CZE.GetNameDef], os partidos comunistas locais mobilizaram rapidamente as Milícias de Trabalhadores. Essas Milícias de Trabalhadores formaram unidades e começaram a atacar propriedades do governo [CZE.GetAdjective] na Região dos Sudetas. Agora, eles pedem toda a nossa ajuda para realizar incursões entre fronteiras e atos de sabotagem contra [CZE.GetNameDef] e outros contrarrevolucionários."
 MUN_czech.2.a: "É claro que vamos ajudar."
 MUN_czech.2.b: "É melhor não dar tanto poder para eles."
 MUN_czech.3.t: "Atividade de Partisans na Região dos Sudetas"
 MUN_czech.3.d: "Desde que o governo [FROM.GetAdjective] demonstrou interesse em anexar a Região dos Sudetas, os paramilitares da região iniciaram uma guerra partisan contra nós. Eles passaram a atacar edifícios do governo e a reduzir as nossas defesas em algumas áreas. Se quisermos melhorar a nossa situação militar, seremos obrigados a lidar com esses grupos paramilitares."
 MUN_czech.3.a: "Será que a situação pode ficar pior?"
 MUN_czech.4.t: "Crise de Confiança"
 MUN_czech.4.d: "As notícias recentes de agressões militares contra nós abalaram todo o governo. [CZE.GetLeader] perdeu a fé em sua capacidade de liderar o país durante a crise. Ele pediu para $CZE_jan_syrovy$ assumir o comando da situação e do país. $CZE_jan_syrovy$ disse que está relutante, mas diante disso, [CZE.GetLeader] respondeu que não há outra opção."
 MUN_czech.4.a: "Precisamos de você mais do que nunca."
 MUN_czech.4.b: "Não vamos entrar em pânico."
 MUN_czech.5.t: "Tomáš Masaryk faleceu"
 MUN_czech.5.d: "Masaryk foi um pilar na política tchecoslovaca por mais de duas décadas. Mesmo quando parecia ser impossível estruturar coalizões e superar impasses políticos, Masaryk conseguiu, repetidas vezes, realizar milagres para ajudar no fortalecimento e no crescimento da Tchecoslováquia e transformá-la no que é hoje. Ele fará muita falta, e essa perda será sentida por toda a nação."
 MUN_czech.5.a: "Um gigante político insubstituível."
 MUN_czech.7.t: "Reavaliando compromissos com [CZE.GetNameDef]"
 MUN_czech.7.d: "Recebemos notícias de que o governo d[GER.GetNameDef] quer anexar a Região dos Sudetas e que está disposto a declarar guerra contra [CZE.GetNameDef] para conquistar esse objetivo. No momento, temos um acordo de defesa com [CZE.GetNameDef]. Isso significa que, se entrarem em guerra com [GER.GetNameDef], seríamos obrigados a ajudar. Se quisermos evitar isso, precisamos sair dos acordos de defesa com [CZE.GetNameDef] imediatamente."
 MUN_czech.7.a: "Vamos apoiar nossos amigos."
 MUN_czech.7.b: "Jamais teríamos chance contra [GER.GetNameDef]"
 MUN_czech.1001.t: "[FROM.GetNameDefCap] exige um corredor para [SOV.GetNameDef]"
 MUN_czech.1001.d: "Na esperança de coordenar ações militares com [SOV.GetNameDef], [FROM.GetNameDef] exigiu que cedamos as regiões fronteiriças de [89.GetName] e [91.GetName] para eles."
 MUN_czech.1002.t: "Governo d[FROM.GetNameDef] exige influência sobre a Liga Iugoslava"
 MUN_czech.1002.d: "Após se expandir para o sul, o governo d[FROM.GetNameDef] apresentou uma demanda incomum. Eles não estão exigindo a tomada da terra, mas sim o controle da Liga de Defesa Iugoslava, tornando-se protetores e soberanos dos países balcânicos do norte que atualmente são nossos súditos. Eles acreditam que seriam melhores protetores que nós, mas com certeza isso pode ser só uma desculpa."
 MUN_czech.1002.a: "Talvez eles tenham razão."
 MUN_czech.1002.b: "Não, eles estão sob a nossa proteção!"
 MUN_czech.1003.t: "Governo [FROM.GetAdjective] recusa as exigências"
 MUN_czech.1003.d: "Apesar dos argumentos convincentes dos nossos diplomatas, o governo d[FROM.GetNameDef] se recusou a atender às nossas exigências."
 MUN_czech.1003.a: "Eles não nos deixam escolha."
 MUN_czech.1004.t: "Governo d[FROM.GetNameDef] age contra a Hungria"
 MUN_czech.1004.d: "A capital, [ROOT.Capital.GetCapitalVictoryPointName], recebeu notícias de que tropas d[FROM.GetNameDef] estão avançando rumo à fronteira d[HUN.GetNameDef]. O governo [HUN.GetAdjective] certamente falará conosco em breve, mas já precisamos descobrir se vamos ajudar o país e ganhar um potencial aliado ou se vamos deixar o lado [FROM.GetAdjective] continuar com seus planos atuais."
 MUN_czech.1004.a: "Temos que proteger os nossos interesses."
 MUN_czech.1004.b: "Vamos ficar fora disso."
 MUN_czech.1005.t: "Governo d[FROM.GetNameDef] exige território costeiro"
 MUN_czech.1005.d: "O governo [FROM.GetAdjective] está ampliando seu reino de forma consistente, e seus representantes estão exigindo de nós uma cessão de terras que os nobres d[FROM.GetNameDef] lhes deviam. Eles dizem que isso lhes daria um potencial acesso ao Adriático, e parecem não ligar muito para a nossa opinião."
 MUN_czech.1006.t: "Governo [FROM.GetAdjective] propõe uma parceria"
 MUN_czech.1006.d: "O governo d[FROM.GetNameDef] nos ofereceu um tratado de defesa mútuo com o objetivo de dissuadir possíveis agressores com a combinação de forças dos nossos exércitos. No entanto, há uma parte secreta no tratado que é interessante. Ela descreve uma potencial expansão da influência d[Root.GetNameDef] e como o Estado [FROM.GetAdjective] poderia ajudar."
 MUN_czech.1007.t: "Governo [FROM.GetAdjective] exige um alinhamento"
 MUN_czech.1007.d: "Desde a consolidação d[FROM.GetNameDef], a desconfiança entre nossas nações fez com que exigissem nosso alinhamento sob a ameaça de uma invasão. No entanto, é curioso que o governo [FROM.GetAdjective] também esteja recorrendo às nossas ambições territoriais, prometendo que em troca da cessão de nossas reivindicações sobre suas terras, eles nos ajudarão a obter outras terras que reivindicarmos."
 MUN_czech.1007.b: "Devemos manter a nossa soberania!"
 MUN_czech.1008.t: "Governo d[FROM.GetNameDef] sugere aliança com [CZE_invited_country.GetName]"
 MUN_czech.1008.d: "O governo [FROM.GetAdjective], nossa conexão com a Europa central, usou seus representantes para propor uma expansão da nossa aliança ao convidar [CZE_invited_country.GetName]."
 MUN_czech.1008.a: "Mais um fator de dissuasão para nos proteger de ataques."
 MUN_czech.1008.b: "Não podemos defender toda a Europa."
 MUN_czech.1009.t: "[FROM.GetName] nos convida para ingressar na facção [CZE.GetFactionName]"
 MUN_czech.1009.d: "Diplomatas d[FROM.GetNameDef] disseram que seríamos bem-vindos à aliança deles. No entanto, no passado, as nossas reivindicações territoriais foram um ponto de contenção nas relações com [FROM.GetNameDef]. Agora precisamos decidir se ainda vamos insistir nessas reivindicações ou se vamos focar em estabelecer relações mais amigáveis."
 MUN_czech.1009.a: "Ao nosso novo aliado!"
 MUN_czech.1009.b: "Vamos nos unir após o reconhecimento das nossas reivindicações."
 MUN_czech.1009.c: "Não temos interesse."
 MUN_czech.1010.t: "[FROM.GetName] nos convida para liderar a facção [CZE.GetFactionName]"
 MUN_czech.1010.d: "Após tentar transformar os acordos da Pequena Entente em uma verdadeira aliança, o governo d[FROM.GetNameDef] fez uma proposta: eles querem que a liderança dessa nova facção fique sob nossa responsabilidade. Eles concederiam a liderança e em troca ganhariam um protetor poderoso. É um acordo que expandiria a nossa esfera de influência, mas potencialmente apenas com nações que estão sob ameaça."
 MUN_czech.1010.a: "Eles podem ser aliados valiosos."
 MUN_czech.1010.b: "Proteger [ROOT.GetNameDef] é suficiente."
 MUN_czech.1011.t: "Governo d[FROM.GetNameDef] propõe um acordo de proteção"
 MUN_czech.1011.d: "Como parte de uma tentativa para desencorajar qualquer agressão contra [FROM.GetNameDef], seus diplomatas nos apresentaram a proposta de um tratado de defesa mútuo. Em troca do nosso apoio, eles nos ofereceriam a mesma proteção, forçando qualquer agressor a uma guerra em duas frentes."
 MUN_czech.1011.a: "Vale a pena arriscar."
 MUN_czech.1011.b: "A neutralidade é mais segura."
 MUN_czech.1012.t: "Governo [FROM.GetAdjective] exige a nossa subjugação"
 MUN_czech.1012.d: "Encorajado por sua aliança recém-formada, o governo d[FROM.GetNameDef] chegou com várias demandas que significariam a perda da nossa soberania. Com o apoio d[SOV.GetNameDef], devido ao seu interesse na região, temos que decidir se podemos nos dar ao luxo de recusar."
 MUN_czech.1012.a: "A resistência desperdiçaria vidas d[ROOT.GetNameDef]."
 MUN_czech.1012.b: "Antes morte que desonra!"
 MUN_czech.1013.t: "Governo d[FROM.GetNameDef] oferece uma aliança condicional"
 MUN_czech.1013.d: "Após uma deliberação cautelosa, o governo d[FROM.GetNameDef] anunciou que acredita que uma aliança poderia ser vantajosa, porém, ele também disse que não poderia supervisionar suas reivindicações territoriais. Portanto, ele fez uma proposta: entrar para a nossa facção, mas apenas se cedermos o território que o país deseja."
 MUN_czech.1013.a: "Esse sacrifício vale a pena."
 MUN_czech.1013.b: "Estamos tentando proteger o nosso território!"
 MUN_czech.1014.t: "Governo d[FROM.GetNameDef] exige proteção"
 MUN_czech.1014.d: "Diplomatas influentes d[FROM.GetNameDef] procuraram o Ministro do Exterior e exigiram que consolidemos as vagas promessas de proteção estipuladas no tratado tchecoslovaco-soviético de 1935."
 MUN_czech.1014.a: "Talvez devêssemos tentar proteger o nosso aliado."
 MUN_czech.1014.b: "Vamos manter as promessas vagas."
 MUN_czech.1015.t: "Governo [FROM.GetAdjective] propõe unir as nossas facções"
 MUN_czech.1015.d: "Agora que temos os mesmos inimigos, o governo d[FROM.GetNameDef] quer aprofundar a nossa cooperação com uma proposta que integraria as nossas facções às deles."
 MUN_czech.1015.a: "Um esforço coordenado pode salvar vidas."
 MUN_czech.1015.b: "Temos que estar no controle."
 MUN_czech.1016.t: "Governo [FROM.GetAdjective] propõe um pacto de não agressão"
 MUN_czech.1016.d: "Prosseguindo com tópicos de conversas anteriores que foram cancelados após uma mudança nos planos de política externa, o governo [FROM.GetAdjective] propôs a discussão sobre um pacto de não agressão."
 MUN_czech.1016.a: "Uma fronteira a menos para proteger."
 MUN_czech.1016.b: "Isso atrapalhará as nossas ambições."
 MUN_czech.1017.t: "Uma invasão conjunta d[GER.GetNameDef]?"
 MUN_czech.1017.d: "O governo d[FROM.GetNameDef] procurou o alto escalão d[ROOT.GetNameDef] com planos secretos para invadir [GER.GetNameDef]. Após demonstrar seu comprometimento em eliminar a ameaça d[GER.GetNameDef], eles pediram a nossa ajuda para que, juntos, possamos derrotar o poderoso exército [GER.GetAdjective]."
 MUN_czech.1017.a: "Vamos atacar [GER.GetNameDef] com eles."
 MUN_czech.1017.b: "Isso é perigoso demais."
 MUN_czech.1018.t: "Lutar contra [GER.GetNameDef] sem ajuda?"
 MUN_czech.1018.t.2: "Uma invasão conjunta d[GER.GetNameDef]"
 MUN_czech.1018.d: "Apesar das nossas melhores ações diplomáticas, não conseguimos reunir apoio estrangeiro para a invasão preventiva d[GER.GetNameDef]. Agora precisamos decidir se vamos prosseguir com o nosso plano de ataque."
 MUN_czech.1018.d.FRA_POL: "Ótimas notícias chegam d[FRA.GetNameDef] e d[POL.GetNameDef]. Nossos diplomatas informam que ambas as nações se comprometeram a nos ajudar no caso de uma invasão pelas forças d[GER.GetNameDef]."
 MUN_czech.1018.d.FRA: "Nossos diplomatas retornaram d[FRA.GetNameDef] com ótimas notícias. O governo [FRA.GetAdjective] está disposto a participar de uma invasão conjunta d[GER.GetNameDef]. Agora, precisamos avaliar se nossas forças combinadas serão suficientes."
 MUN_czech.1018.d.POL: "Nossos diplomatas retornaram d[POL.GetNameDef] com ótimas notícias, o governo [POL.GetAdjective] está disposto a participar de uma invasão conjunta d[GER.GetNameDef]. Agora, precisamos avaliar se nossas forças combinadas serão suficientes."
 MUN_czech.1018.a: "Eles não saberão o que os atingiu."
 MUN_czech.1018.b: "Pensando bem, isso é muito arriscado."
 MUN_czech.1019.t: "Governo d[FROM.GetNameDef] exige [762.GetName]"
 MUN_czech.1019.d: "Citando um desejo de restaurar as antigas fronteiras boêmias e legitimar seu controle sobre [72.GetName], representantes d[FROM.GetNameDef] entregaram um ultimato que nos exige a cessão de [762.GetName]."
 MUN_czech.1019.a: "Talvez isso nos mantenha seguros."
 MUN_czech.1020.t: "Governo d[FROM.GetNameDef] oferece investimento condicional"
 MUN_czech.1020.a: "Um ótimo acordo!"
 MUN_czech.1020.b: "Esses termos são inaceitáveis."
 MUN_czech.1020.d: "Chegaram alguns diplomatas d[FROM.GetNameDef]. Eles apresentaram uma proposta em que sua nação investiria em nossas indústria e infraestrutura em troca de um acordo de recursos. Essa ação, vinda após investimentos fracassados nos últimos anos, é uma tentativa renovada de melhorar as nossas relações."
 CZE_investment_effects_tt: "Em §Y100 dias§!, ganharemos:\n§YInfraestrutura§! em §Y3§! estados aleatórios.\n§YFábrica Civil§! em §Y1§! estado aleatório.\n"
 MUN_czech.1021.t: "Retorno da União Aduaneira Austro-Húngara?"
 MUN_czech.1021.d: "O governo d[CZE.GetNameDef] veio até nós com uma proposta de acordo comercial entre as antigas nações austro-húngaras. Embora tenha ficado contente com a independência, o novo governo [CZE.GetAdjective] parece estar bastante disposto a restaurar os elementos benéficos da nação austro-húngara."
 MUN_czech.1021.a: "Mais comércio parece interessante."
 MUN_czech.1021.b: "Precisamos proteger nossos produtores nacionais."
 MUN_czech.1022.t: "Governo d[CZE.GetNameDef] toma a Silésia"
 MUN_czech.1022.d: "Após um combate violento nas montanhas de [69.GetName], as tropas d[CZE.GetNameDef] acabaram invadindo e estabelecendo o controle sobre toda a Silésia antes que os inimigos se recuperassem o bastante para serem uma resistência forte."
 MUN_czech.1022.a: "Devemos intervir."
 MUN_czech.1022.b: "Não podemos ter mais um inimigo."
 MUN_czech.1022.c: "Uma grande vitória!"
 MUN_czech.1023.t: "Governo d[CZE.GetNameDef] começa a luta pela Silésia"
 MUN_czech.1023.d: "Citando uma argumentação estranha com reinos e impérios medievais, a liderança d[FROM.GetNameDef] transformou as lutas nas fronteiras em uma guerra limitada para tentar assumir o controle da Silésia [ROOT.GetAdjective]."
 MUN_czech.1023.a: "Preparem as tropas."
 MUN_czech.1024.t: "Governo [CZE.GetAdjective] propõe um acordo de paz"
 MUN_czech.1024.d: "Após os combates fronteiriços na Silésia terem se transformado em uma guerra total, o governo d[FROM.GetNameDef] demonstrou estar disposto a encerrar o conflito se a terra que eles reivindicaram for cedida."
 MUN_czech.1024.a: "Talvez devêssemos focar em outras áreas."
 MUN_czech.1024.b: "A situação ainda está a nosso favor."
 MUN_czech.1024.c: "Não haverá negociação!"
 MUN_czech.1025.t: "Fim da missão voluntária na Espanha"
 MUN_czech.1025.d.1: "As tropas d[ROOT.GetNameDef] enviadas para lutar ao lado de [CZE_supported_spanish_faction.GetName] estão voltando para casa após ajudarem a conquistar a vitória. A luta resultou em novas ideias para as nossas tropas, principalmente os destacamentos médicos."
 MUN_czech.1025.d.2: "Mesmo com a contribuição corajosa das tropas d[ROOT.GetNameDef] na Guerra Civil Espanhola, o lado que apoiávamos foi totalmente derrotado. Apesar disso, as nossas tropas e suas equipes médicas aprenderam lições valiosas."
 MUN_czech.1025.a: "Vamos torcer para não precisarmos aplicar essas lições em casa."
 MUN_czech.1026.t: "Governo d[FROM.GetNameDef] recusa a proposta"
 MUN_czech.1026.a: "Azar o deles."
 MUN_czech.1026.b: "Uma situação preocupante."
 MUN_czech.1026.france_refuses_to_lead: "Apesar de uma liderança d[FROM.GetNameDef] ter sido oferecida em troca de se juntar à nossa aliança, eles decidiram não cumprir o combinado. Aparentemente, o governo d[FROM.GetNameDef] está tentando parecer neutro ou está esperando o momento certo para agir."
 MUN_czech.1026.sphere_of_influence: "Embora os membros do governo d[FROM.GetNameDef] tenham afirmado que a nossa participação na facção [ROOT.GetFactionName] é positiva, eles acreditam que a expansão da nossa influência para os Balcãs seria ir longe demais e poderia assustar potenciais aliados."
 MUN_czech.1026.guarantee: "Nossos diplomatas relatam que, apesar dos seus esforços, o governo d[FROM.GetNameDef] não concordou com a nossa proposta de um acordo de defesa mútuo. Parece que o corpo diplomático [FROM.GetAdjective] acredita que corremos mais risco que eles. Vamos torcer para estarem errados."
 MUN_czech.1026.faction_merge: "Apesar das nossas melhores tentativas, tanto os nossos diplomatas quanto o lado [FROM.GetAdjective] não conseguiram chegar a um acordo para unificar as facções [ROOT.GetFactionName] e [FROM.GetFactionName]."
 MUN_czech.1026.non_aggression: "Apesar de garantirem suas intenções de paz, os diplomatas do governo [FROM.GetAdjective] se recusaram a assinar um pacto de não agressão com a nossa nação. Ainda não sabemos o motivo."
 MUN_czech.1026.trade_deal: "Citando o desejo de manter a independência econômica, o governo d[FROM.GetNameDef] recusou a nossa proposta de acordo comercial."
 MUN_czech.1026.faction_invite: "Os nossos diplomatas apresentaram os argumentos pelos quais o governo d[FROM.GetNameDef] se beneficiaria com uma aliança conosco, mas não conseguiram se alinhar a eles."
 MUN_czech.1026.weapons_sale: "Apesar da nossa oferta generosa, o governo d[FROM.GetNameDef] decidiu não comprar armas de nós nesse momento."
 MUN_czech.1026.unification: "Apesar de conhecer os benefícios de uma federação, o estado [FROM.GetAdjective] decidiu manter seu governo no exílio como o único legítimo para suas terras."
 MUN_czech.1026.white_peace: "Nossos representantes retornaram hoje com a triste notícia que, apesar de ocuparmos a [66.GetName], a liderança do governo [FROM.GetAdjective] não está disposta a assinar um tratado de paz. Ao que tudo indica, teremos que prosseguir com a ofensiva ou torcer pelo desgaste do inimigo."
 MUN_czech.1027.t: "Estabelecer um acordo comercial entre [FROM.GetName] e [ROOT.GetName]?"
 MUN_czech.1027.d: "Apesar das diferenças ideológicas iniciais, o governo d[FROM.GetNameDef] recorreu ao nosso pragmatismo e nos propôs um acordo comercial. Em troca de permitir que extraiam recursos em [202.GetName], eles ajudariam a fornecer as máquinas-ferramentas de que tanto precisamos para expandir a nossa capacidade industrial."
 MUN_czech.1027.a: "Um ótimo negócio."
 MUN_czech.1027.b: "Deveríamos negar os recursos a eles."
 MUN_czech.1028.t: "Esforços para fortificação atrasados"
 MUN_czech.1028.d: "Muitas pessoas do país estão questionando os motivos de o governo ter parado os projetos de fortificação que havia começado no ano anterior. O governo destinou fundos para mais projetos de construção de fortes por meio do Conselho de Fortificação. Sem previsões de progresso, o povo está exigindo que o projeto continue ou que os fundos sejam devolvidos. Se quisermos continuar com os nossos programas de fortificação, temos que reativá-los logo para que possam ser concluídos a tempo."
 MUN_czech.1028.a: "Não temos tempo a perder!"
 CZE_no_time_to_lose_tt: "A nossa janela de tempo para concluir nossos Projetos de Fortificação antes que surja uma ameaça está muito curta."
 MUN_czech.1029.t: "Projeto de fortificação concluído"
 MUN_czech.1029.d: "Nosso projeto de fortificação mais recente foi concluído e os recursos estão disponíveis para começar outro projeto. Nossos engenheiros estão prontos para ir para outro local a qualquer momento e estruturar a base para uma nova linha de fortificação."
 MUN_czech.1029.a: "Ótimo trabalho, cavalheiros."
 MUN_czech.1030.t: "Governo [FROM.GetAdjective] exige integração"
 MUN_czech.1030.d: "O governo d[FROM.GetNameDef] exigiu que nos tornemos parte de sua união, uma vez que desejam expandi-la. Eles recorrem a vários países da região por diferentes motivos como pan-eslavismo, pan-balcanismo e a história compartilhada no Império Austro-Húngaro para outros, mas está claro que há uma ameaça implícita se recusarmos."
 MUN_czech.1030.a: "Talvez não seja tão ruim."
 MUN_czech.1030.b: "Não é muito convincente."
 MUN_czech.1031.t: "Governo [FROM.GetAdjective] propõe união"
 MUN_czech.1031.d: "O governo d[ROOT.GetNameDef] capitulou, mas os líderes d[FROM.GetNameDef] apresentaram uma proposta drástica que nos permitiria continuar lutando: fundir a nação deles com o que resta da nossa."
 MUN_czech.1031.a: "Juntos podemos proteger melhor as nossas terras natais."
 MUN_czech.1031.b: "Nossas diferenças são grandes demais."
 MUN_czech.1032.t: "Reduzindo a divisão"
 CZE_divide_nation_title_dynamic_sudentenland: "$MUN_czech.1032.t$ na Região dos Sudetas"
 CZE_divide_nation_title_dynamic_czech_states: "$MUN_czech.1032.t$ com trabalhadores tchecos"
 CZE_divide_nation_title_dynamic_tesinko_poles: "$MUN_czech.1032.t$ em [72.GetName]"
 CZE_divide_nation_title_dynamic_slovakia_states: "$MUN_czech.1032.t$ na [SLO.GetNonIdeologyName]"
 CZE_divide_nation_title_dynamic_hungarian_states: "$MUN_czech.1032.t$ em [664.GetName]"
 CZE_divide_nation_title_dynamic_ukrainian_states: "$MUN_czech.1032.t$ em [73.GetName]"
 MUN_czech.1032.d: "As tentativas de resolver problemas n[FROM.GetNameDef] conseguiram mitigar a fúria contra o governo central, pelo menos por enquanto. Os recursos do nosso governo agora estão livres para serem usados em outros programas sociais ou econômicos que continuarão combatendo os problemas que dividem o nosso país."
 MUN_czech.1032.a: "Mãos à obra de novo."
 MUN_czech.1033.t: "O governo em exílio [FROM.GetAdjective] solicita reconhecimento"
 MUN_czech.1033.d: "O governo em exílio [FROM.GetAdjective] sob $CZE_edvard_benesh$ está pedindo para abrigarmos sua delegação enquanto tentam reconquistar a soberania da [CZE.GetNonIdeologyName]."
 MUN_czech.1033.a: "Mais um aliado contra as forças d[GER.GetNameDef]."
 MUN_czech.1033.b: "Eles são ilegítimos."
 MUN_czech.1034.t: "Agitação na Eslováquia"
 MUN_czech.1034.d: "Como demonstramos sentimentos nacionalistas por outros grupos, membros do Partido Popular Eslovaco formaram sua própria força paramilitar, que agora busca independência ou, pelo menos, autonomia para a Eslováquia. A questão agora é se devemos nos concentrar em manter uma aparência de união nos posicionando contra a separação, ou se permitimos que essa situação continue, nos concentrando então nas regiões que são leais ao governo."
 MUN_czech.1034.a: "Envie o exército para a Eslováquia!"
 MUN_czech.1034.b: "Prendam os envolvidos, mas vamos conceder alguma autonomia."
 MUN_czech.1034.c: "Assuma o controle direto."
 MUN_czech.1034.c_tt: "§REstaremos à mercê da decisão d[GER.GetNameDef] quanto ao destino da Tchecoslováquia.§!"
 MUN_czech.1035.t: "Governo [FROM.GetAdjective] se dispõe a fabricar armas para nós"
 MUN_czech.1035.d: "Devido à nossa parceria integral, o governo [CZE.GetAdjective] nos fez uma proposta única: eles fabricarão para nós as armas que atualmente produzimos domesticamente por um preço, é claro. Isso permitiria nos concentrar em outros setores da nossa indústria."
 MUN_czech.1035.a: "Isto reduziria o retrabalho."
 MUN_czech.1035.b: "Não podemos tornar nosso Exército dependente de equipamento estrangeiro."
 #MUN_czech.1036.t: "" #Event uses MUN_czech.1032.t
 MUN_czech.1036.d: "A Grande Depressão prejudicou fortemente nossa política e economia. Somos assolados por vários problemas regionais nesses setores, que parecem piorar mesmo diante da nossa recuperação milagrosa da Grande Depressão. Precisamos lidar com esses problemas antes que eles dividam ainda mais o país."
 MUN_czech.1036.a: "Precisamos curar a nossa nação."
 CZE_divided_nation_event_onbroad_tt: "§YDecisões§! desbloqueadas que nos permitem §YRemover§! os §YModificadores de Estado§! negativos em nossos Estados Centrais.\n\nConcluir essas §YDecisões§! também reduzirá os Modificadores Negativos no Espírito Nacional §Y$CZE_a_divided_nation_dynamic_modifier$§! até ele ser §YRemovido§!."
 MUN_czech.1037.t: "Governo [GER.GetAdjective] protege [HUN.GetNameDef]"
 MUN_czech.1037.d: "Após perceber a guerra óbvia que acontece em nosso país rumando para [HUN.GetNameDef], representantes d[GER.GetNameDef] deixaram claro que uma guerra contra [HUN.GetNameDef] seria uma guerra contra [GER.GetNameDef] também. Cabe a nós decidir se vamos seguir em frente."
 MUN_czech.1037.a: "Temos que cancelar os nossos planos."
 MUN_czech.1037.b: "Isso não muda nada."
 MUN_czech.1038.t.1: "Governo [FROM.GetAdjective] se oferece para licenciar seus projetos de tanques"
 MUN_czech.1038.t.2: "Governo [FROM.GetAdjective] propõe venda de armas de fogo"
 MUN_czech.1038.t.3: "Governo [FROM.GetAdjective] propõe venda de artilharia"
 MUN_czech.1038.t.4: "Governo [FROM.GetAdjective] propõe venda de tanques leves"
 MUN_czech.1038.t.5: "Governo [FROM.GetAdjective] propõe venda de caças"
 MUN_czech.1038.d: "Representantes do governo d[FROM.GetNameDef] e suas empresas bélicas nos fizeram uma proposta de venda de armas. Eles estão oferecendo armamentos muito modernos e o preço parece bastante justo."
 MUN_czech.1038.a: "Parece ser um bom negócio."
 MUN_czech.1039.t: "Governo [RUT.GetAdjective] quer um acordo de autonomia"
 MUN_czech.1039.d: "Com o acordo de autonomia que fizemos com [SLO.GetNameDef], $RUT_augustin_voloshyn$ questionou o fato de sua região ter o mesmo tipo de acordo de federalização conosco. Isso parece absurdo, mas nessas circunstâncias, temos que aceitar essas exigências sem questionar."
 MUN_czech.1039.a: "Veremos."
 MUN_czech.1040.t: "Governo d[CZE.GetNameDef] propõe um tratado de união aduaneira"
 MUN_czech.1040.d: "Recentemente, o governo d[CZE.GetNameDef] revisitou as conversas diplomáticas a respeito de uma união aduaneira entre as nossas nações. O acordo que estão tentando fazer parece ser justo, mas pode incluir outras exigências posteriores para as quais podemos não estar preparados. Esse tratado e o que está sendo negociado parecem triviais e simbólicos, então não haverá prejuízo se assinarmos."
 MUN_czech.1040.a: "Parece inofensivo."
 MUN_czech.1040.b: "Não podemos confiar nisso."
 MUN_czech.1041.t: "Governo [FROM.GetAdjective] recusa o tratado de união aduaneira"
 MUN_czech.1041.d: "Citando alguns motivos sobre como isso poderia prejudicar sua economia, o governo [FROM.GetAdjective] se recusou a assinar o tratado de união aduaneira entre as nossas nações. Esses motivos parecem ser desculpas esfarrapadas e sem fundamentos."
 MUN_czech.1041.a: "Decepcionante."
 MUN_czech.1042.t: "Governo [FROM.GetAdjective] aceita o tratado de união aduaneira."
 MUN_czech.1042.d: "Percebendo que o tratado é satisfatório, o governo [FROM.GetAdjective] concordou com as condições. Esperamos que esse seja o primeiro passo para termos vínculos mais fortes entre as duas nações."
 MUN_czech.1042.a: "Excelente."
 MUN_czech.1043.t: "Governo [FROM.GetAdjective] solicita que entremos para a sua federação"
 MUN_czech.1043.d: "Citando os vínculos mais fortes entre as nossas nações e os acontecimentos globais recentes, o governo [FROM.GetAdjective] garante que ficaríamos mais seguros sob a proteção deles do que sozinhos. Isso parece um estratagema para que eles ocupem o nosso território. O que faremos?"
 MUN_czech.1043.a: "Aceitamos."
 MUN_czech.1043.b: "Uma péssima ideia."
 MUN_czech.1044.t: "O governo d[FROM.GetNameDef] se recusa a entrar para a federação"
 MUN_czech.1044.d: "Por acreditar que o país ficaria melhor sozinho do que sob o nossa tutela, o governo d[FROM.GetNameDef] rejeitou a possibilidade de entrar para a nossa federação. Isso atrapalha o nosso objetivo de fortalecer a nossa posição na Europa. O que faremos agora que o estado [FROM.GetAdjective] não quer ter bom senso?"
 MUN_czech.1044.a: "Que pena."
 MUN_czech.1044.b: "Teremos que tentar de outro jeito."
 MUN_czech.1045.t: "O governo [FROM.GetAdjective] aceita se juntar à nossa federação"
 MUN_czech.1045.d: "Após perceberem que teriam mais proteção sob o nosso comando do que sozinhos, o governo d[FROM.GetNameDef] tomou a sábia decisão de se juntar à nossa federação. Isso fortalecerá bastante a nossa posição na Europa."
 MUN_czech.1045.a: "Excelente."
 MUN_czech.1046.t: "Curando a divisão"
 MUN_czech.1046.d: "Após o enfrentamento de vários problemas no nosso país, as tensões da nossa nação parecem estar diminuindo. Com a conclusão de vários programas econômicos e sociais, parece que o nosso país está começando a se curar."
 MUN_czech.1046.a: "Ótimas notícias."
 #MUN_czech.1047 is hidden
 MUN_czech.1048.t: "Governo d[FROM.GetNameDef] aceita as demandas"
 MUN_czech.1048.t2: "Governo [FROM.GetAdjective] aceita a proposta"
 MUN_czech.1048.d: "Com relutância, oficiais d[FROM.GetNameDef] nos informaram que pretendem atender às nossas demandas territoriais. As tropas deles já estão deixando o território."
 MUN_czech.1048.d2: "Após longas discussões, nossos oficiais e os d[FROM.GetNameDef] chegaram a um acordo sobre um novo papel para a economia do Estado [FROM.GetAdjective] como parte de nossa união. Esse arranjo promete prosperidade a ambos os povos."
 MUN_czech.1048.d3: "Nossa proposta de um pacto de não agressão foi recebida com entusiasmo imediato pelos representantes do Estado [FROM.GetAdjective]. Por ora, tudo indica que suas ambições estão voltadas para outros interesses."
 MUN_czech.1048.d4: "Diante de uma grave ameaça, o governo d[FROM.GetNameDef] cedeu às nossas exigências de alinhamento."
 MUN_czech.1048.d5: "Após longas discussões, nossos oficiais e os d[FROM.GetNameDef] chegaram a um acordo pelo qual parte de nossa indústria militar será dedicada à produção de equipamentos para eles. Em troca, receberemos bens comerciais para abastecer nossos mercados e produção."
 #MUN_czech.1049 is a faction joining event so largely reuses generic loc
 MUN_czech.1049.d: "O novo governo d[FROM.GetNameDef] nos propôs uma aliança. Apesar do primeiro posicionamento do seu novo governo militar contra a Alemanha, parece que eles foram pragmáticos e reconheceram que seus antigos parceiros internacionais não são confiáveis."
 MUN_czech.1050.d: "Nossos diplomatas voltaram d[FROM.GetNameDef] com notícias decepcionantes: o nosso pedido para nos juntarmos à aliança deles foi negado. Os motivos são incertos, mas agora estamos em uma situação difícil, na qual expusemos as nossas preocupações acerca dos nossos aliados tradicionais, sem ganharmos um novo."
 MUN_czech.1050.a: "Talvez devêssemos oferecer condições mais favoráveis."
 MUN_czech.1050.b: "Vamos procurar aliados melhores."
 MUN_czech.1051.t: "Governo [FROM.GetAdjective] solicita esfera de influência"
 MUN_czech.1051.d: "O governo d[FROM.GetNameDef], que recentemente se aliou a nós, demonstrou interesse em expandir sua influência além das suas fronteiras. Consequentemente, representantes do país pediram permissão e apoio para essa expansão, na qual será estabelecida uma fronteira clara entre as áreas sob influência d[ROOT.GetNameDef] e d[FROM.GetNameDef]."
 MUN_czech.1051.a: "Deveríamos fortalecer [FROM.GetNameDef], com quem temos uma aliança essencial."
 MUN_czech.1052.t: "Governo [FROM.GetAdjective] solicita permissão para a passagem de tropas d[SOV.GetNameDef]"
 MUN_czech.1052.d: "Após um novo acordo diplomático entre [FROM.GetName] e [SOV.GetName], o governo [FROM.GetAdjective] está confiante de que será protegido pelo Estado [SOV.GetAdjective] em caso de conflito. O único obstáculo é a falta de uma ligação terrestre entre os dois países. Diante disso, diplomatas d[FROM.GetNameDef] entraram em contato conosco, solicitando permissão para que as tropas do Estado [SOV.GetAdjective] possam atravessar nosso território, caso um conflito venha a acontecer."
 MUN_czech.1052.a: "A luta deles também nos protegerá."
 MUN_czech.1053.t: "Governo [FROM.GetAdjective] nos pressiona com reivindicações d[HUN.GetNameDef]"
 MUN_czech.1053.d: "Após transformar [HUN.GetNameDef] em um Estado cliente, o governo d[FROM.GetNameDef] passou a exigir que aceitemos o mesmo destino. Afirmam ainda que, em caso de recusa, apoiarão as reivindicações do Estado [HUN.GetAdjective] sobre o território [ROM.GetAdjective]. Resta-nos escolher entre abrir mão de nossa soberania ou comprometer nossa integridade territorial."
 CZE_cancel_anti_hungary_focus_tt: "Cancelar o foco §Y$CZE_neutralize_the_hungarian_threat$§!"
 MUN_czech.1054.t: "Uma invasão conjunta d[LIT.GetNameDef]?"
 MUN_czech.1054.d: "Conforme combinado anteriormente, o governo d[FROM.GetNameDef] apresentou uma proposta que ajudaria a fortalecer nossa nação. Trata-se da unificação forçada com [LIT.GetNameDef], o que nos garantiria acesso a recursos adicionais e negaria ao inimigo a possibilidade de nos atacar atravessando o território [LIT.GetAdjective]."
 MUN_czech.1054.a: "Devemos nos expandir para conter o avanço dos outros."
 MUN_czech.1055.t: "Chegada de voluntários do Estado [SOV.GetAdjective]"
 MUN_czech.1055.d: "Em um feito sem precedentes de logística aérea, o Estado [SOV.GetAdjective] mobilizou sua Força Aérea para transportar diversas divisões de voluntários até nosso aeroporto na [73.GetName] para apoiar nosso esforço de guerra atual."
 MUN_czech.1056.t: "[FROM.GetName] exige a [975.GetName]"
 MUN_czech.1056.d: "Assim como já foi proposto na Conferência de Paz de Paris após a Grande Guerra, [CZE.GetNameDef] afirmou que um corredor ligando seu território ao de um país aliado, no caso [YUG.GetNameDef], é necessário para garantir a segurança da aliança entre as duas nações. Para alcançar esse objetivo, os representantes do governo [FROM.GetAdjective] enviaram um ultimato que exige que cedamos a [975.GetName]."
 #THE FALL OF THE REPUBLIC EVENTS#
 MUN_the_fall_of_the_republic.1.t: "Uma onda de protestos se espalha"
 MUN_the_fall_of_the_republic.1.d: "A recente decisão de [ROOT.GetLeader] de entregar a Região dos Sudetas provocou um surto de protestos na nação. As lideranças políticas e militares queriam evitar o derramamento de sangue na situação que consideravam uma resistência inútil contra chances impossíveis, mas grande parte da nação sentiu que isso foi uma decisão errada. Alguns movimentos políticos estão tentando se aproveitar do tumulto para alcançar os próprios objetivos."
 MUN_the_fall_of_the_republic.1.a: "Não tivemos escolha!"
 MUN_the_fall_of_the_republic.2.t.1: "A queda da Primeira República"
 MUN_the_fall_of_the_republic.2.t.2: "Caos no governo"
 MUN_the_fall_of_the_republic.2.d: "Após o governo ter decidido entregar a Região dos Sudetas, o país foi assolado por uma grande onda de demissões de lideranças menores no exército e no governo. Algumas dessas pessoas podem ter fugido do país durante a noite. Precisamos de grandes mudanças no governo para conter o abandono de oficiais e restaurar um pouco da fé em nossa capacidade de liderança."
 MUN_the_fall_of_the_republic.2.a: "Precisamos de mudanças radicais."
 MUN_the_fall_of_the_republic.2.b: "Devemos permanecer no mesmo caminho!"
 MUN_the_fall_of_the_republic.3.t: "Governo d[RUT.GetNameDef] pede autonomia"
 MUN_the_fall_of_the_republic.3.d: "Com o caos político que recentemente tomou conta da nossa nação, a pequena região da Cárpato-Ucrânia quer ficar mais independente de [9.GetCapitalVictoryPointName], alegando enormes diferenças entre a região e o resto d[ROOT.GetNameDef]. No entanto, esse pedido parece vir de líderes locais se aproveitando da oportunidade para ganhar poder. Negar esse pedido pode custar muito capital político em um momento que não temos nada para gastar."
 MUN_the_fall_of_the_republic.3.a: "Claro, por que não?"
 MUN_the_fall_of_the_republic.3.b: "Nem pensar!"
 MUN_the_fall_of_the_republic.3.c: "Rompa as relações com eles."
 MUN_the_fall_of_the_republic.4.t: "O destino d[RUT.GetNameDef]"
 MUN_the_fall_of_the_republic.4.d: "Após o caos recente que tomou conta d[CZE.GetNameDef], [RUT.GetNameDef] ficou fora das fronteiras dos outros países. A pequena região alega ser um país independente e está firmando relações diplomáticas com os vizinhos. Muitas pessoas do nosso governo estão preocupadas que uma região com tanta importância estratégica em nossa fronteira caia em outras mãos. O exército sugeriu o envio de um ultimato à região dissidente exigindo sua anexação imediata."
 MUN_the_fall_of_the_republic.4.a: "Enviem o ultimato imediatamente!"
 MUN_the_fall_of_the_republic.4.b: "Pode ser arriscado, vamos aguardar."
 MUN_the_fall_of_the_republic.5.t: "Governo [FROM.GetAdjective] exige a nossa anexação!"
 MUN_the_fall_of_the_republic.5.d: "Após a nossa independência, era apenas uma questão de tempo até um de nossos vizinhos tentar nos incorporar ao seu território. [FROM.GetNameDef] parece ser o primeiro país a fazer isso e está exigindo a nossa rendição. O que devemos fazer?"
 MUN_the_fall_of_the_republic.5.a: "Lutaremos até o último homem!"
 MUN_the_fall_of_the_republic.5.b: "Não temos escolha senão concordar."
 MUN_the_fall_of_the_republic.6.t: "Governo [FROM.GetAdjective] recusa o nosso ultimato!"
 MUN_the_fall_of_the_republic.6.d: "Surpreendentemente, o governo d[FROM.GetNameDef] rejeitou o nosso ultimato e está formando uma resistência armada contra nós. Eles não nos dão escolha senão invadir. Já elaboramos os planos de batalha e as rotas de ataque, agora só falta darmos a ordem para a ação."
 MUN_the_fall_of_the_republic.6.a: "Nós os avisamos."
 MUN_the_fall_of_the_republic.6.a_tt: "Esta operação não afetará §Y$HUN_pal_teleki$§!, a menos que o Estado [RUT.GetAdjective] tenha aliados"
 MUN_the_fall_of_the_republic.6.b: "O tiro pode sair pela culatra. É melhor esperar."
 MUN_the_fall_of_the_republic.7.t: "Governo [FROM.GetAdjective] cede às nossas exigências"
 MUN_the_fall_of_the_republic.7.d: "Como já esperávamos, o governo [FROM.GetAdjective] cedeu às nossas exigências e quer ser anexado ao nosso país em troca de algumas condições triviais. A pequena região não teve chances de resistir a uma nação tão poderosa quanto a nossa. A nossa fronteira norte agora está mais protegida do que antes e o governo está muito contente com a vitória fácil que tivemos."
 MUN_the_fall_of_the_republic.7.a: "Excelente notícia."
 #BOP EVENTS#
 MUN_czech_bop.1.t: "A prontidão da armada"
 MUN_czech_bop.1.d: "As reformas da primeira metade da década estão começando a dar bons resultados. Atualmente, nosso exército é um dos mais modernos da Europa. Mas um sentimento de complacência tem se espalhado entre alguns políticos e chefes de muitos conglomerados industriais. Se o nosso exército pretende continuar no auge da prontidão, temos que enfrentar as possíveis dúvidas sobre sua capacidade de luta e aqueles que buscam diminuí-la para ganhos pessoais."
 MUN_czech_bop.1.a: "Estaremos prontos."
 MUN_czech_bop.2.t.1: "A ameaça do rearmamento alemão"
 MUN_czech_bop.2.t.2: "Expansão militar dos países vizinhos"
 MUN_czech_bop.2.d.1: "A recente remilitarização da Renânia por parte do governo [GER.GetAdjective] assustou alguns dos nossos líderes militares e políticos. Embora muitas pessoas confiem nas alianças firmadas pelo país e nas mobilizações e preparativos que o exército tem feito para enfrentar a uma possível ameaça militar, ainda há quem não confie em nossa capacidade de responder a uma agressão d[GER.GetNameDef]."
 MUN_czech_bop.2.d.2: "As notícias recentes de que alguns dos nossos vizinhos iniciaram programas de expansão dos seus exércitos assustou alguns dos nossos líderes militares e políticos. Muitas pessoas confiam nas alianças que o país firmou com outras nações e também no exército, que tem se mobilizado e se preparado para enfrentar uma possível ameaça militar. No entanto, há quem não confie em nossa capacidade de responder a um ataque estrangeiro."
 MUN_czech_bop.2.a: "Estaremos preparados."
 MUN_czech_bop.2.a_tt: "Os esforços de rearmamento de nossos vizinhos levantaram dúvidas entre nossas fileiras quanto à nossa capacidade de resistir a uma possível agressão. Devemos tranquilizar o Exército por meio de ações concretas."
 MUN_czech_bop.3.t: "O governo [CZE.GetAdjective] enviou observadores ao nosso país"
 MUN_czech_bop.3.d: "Recentemente, o governo [CZE.GetAdjective] enviou uma delegação ao nosso país para observar o conflito atual. Ao mesmo tempo, um dos seus fabricantes de armas leves procurou alguns dos nossos diplomatas por meio de canais secundários para saber se temos interesse em comprá-las. Isso criaria um contrabando de armas para o nosso país devido às restrições impostas a nós."
 MUN_czech_bop.3.a: "Vamos ver aonde isso vai dar."
 MUN_czech_bop.3.b: "Não podemos deixá-los fazer mais do que só observar."
 MUN_czech_bop_3_tt: "A §Y$CZE_zbrojovka_brno_organization$§!, fabricante de armas do §YEstado [CZE.GetAdjective]§!, pode tentar contrabandear armas para nós."
 MUN_czech_bop.4.t: "O esquema da $CZE_zbrojovka_brno_organization$"
 MUN_czech_bop.4.d: "O governo d[ETH.GetNameDef] fez contato com representantes do fabricante de armas $CZE_zbrojovka_brno_organization$ e se interessou em contrabandeá-las para o país. Apesar das sanções da Liga das Nações contra [ETH.GetNameDef], o fabricante $CZE_zbrojovka_brno_organization$ pretende avançar com esse plano. Violar o decreto da Liga das Nações terá uma reação internacional impopular se formos pegos."
 MUN_czech_bop.4.a: "Vamos fazer isso."
 MUN_czech_bop.4.b: "Isso não vale o possível repúdio."
 CZE_gun_smuggling_tt: "Contrabandeando armas para o país"
 CZE_we_got_caught_tt: "§Y$CZE_zbrojovka_brno_organization$§! é pega."
 CZE_we_dont_get_caught_tt: "§Y$CZE_zbrojovka_brno_organization$§! não é pega."
 MUN_czech_bop.5.t: "$CZE_zbrojovka_brno_organization$ concorda com o esquema de contrabando"
 MUN_czech_bop.5.d: "Após conversar com representantes do governo tcheco, a $CZE_zbrojovka_brno_organization$ recebeu, em segredo, um aval para começar a contrabandear uma pequena quantidade de armas leves para o país. A experiência deles também ficará disponível para nós em nossos canais secretos."
 MUN_czech_bop.5.a: "Faremos um bom uso disso."
 MUN_czech_bop_5_tt: "Esse §YFabricante§! será §RRemovido§! quando a guerra acabar."
 ##SLOVAKIA##
 MUN_slovakia_little_war.1.t: "Vitória em [71.getname]"
 MUN_slovakia_little_war.1.d: "O nosso exército teve um bom desempenho em [71.getname], derrotando as forças inimigas na região. Os nossos comandantes obtiveram informações valiosas e aprenderam lições que podem aplicar em outros confrontos."
 MUN_slovakia_little_war.1.a: "Excelente trabalho."
 MUN_slovakia_little_war.2.t: "Derrota em [71.getname]"
 MUN_slovakia_little_war.2.d: "Apesar de todo o nosso empenho, nossas forças foram derrotadas em [71.getname]. A incapacidade de reunir munições e equipamentos motorizados suficientes a tempo para o conflito foi um fator decisivo para a nossa derrota. Apesar desse contratempo, os comandantes envolvidos na batalha aprenderam lições muito importantes."
 MUN_slovakia_little_war.2.a: "Desempenho decepcionante."
 MUN_slovakia_little_war.3.t: "Conflito na fronteira da [71.GetName]"
 MUN_slovakia_little_war.3.d: "Mesmo após ter ganhado o nosso território na $GER_first_vienna_award$, o governo d[HUN.GetNameDef] ainda pretende fazer ajustes de fronteira conosco em [71.getname]. Precisamos enfrentar esse desafio com força para mostrar a eles que não vamos ceder nossas terras sem lutar."
 MUN_slovakia_little_war.3.a: "Como ousam?"
 MUN_slovakia_little_war.4.t: "Impasse em [71.getname]"
 MUN_slovakia_little_war.4.d: "Apesar de todo o nosso empenho, nossas forças não conseguiram vencer o confronto em [71.getname]. A incapacidade de reunir munições e equipamentos motorizados suficientes a tempo para o conflito foi um fator decisivo para a nossa derrota. Apesar desse contratempo, os comandantes envolvidos na batalha aprenderam lições muito importantes."
 MUN_slovakia_little_war.4.a: "Decepcionante."
 ##Exile##
 MUN_czech_exile.1.t: "Estado [ROOT.GetAdjective] recebe exilados d[CZE.GetNameDef]"
 MUN_czech_exile.1.d: "Como consequência da dissolução de sua nação pel[GER.GetNameDef] após a Conferência de Munique, exilados d[CZE.GetNameDef] acabaram indo parar em diversos países, incluindo o nosso. Eles estão dispostos a pegar em armas para nos ajudar, na esperança de um dia libertar sua pátria com a nossa ajuda."
 MUN_czech_exile.1.a: "Sejam bem-vindos."
 ##NEWS EVENTS##
 MUN_czech.news.1.t: "A crise da Região dos Sudetas"
 MUN_czech.news.1.desc: "O povo da Região dos Sudetas começou uma revolta armada contra [CZE.GetNameDef]. Os relatos mostram que os paramilitares da Região dos Sudetas começaram a atacar estações policiais e edifícios do governo. O estopim da situação foram as recentes notícias de que o governo [FROM.GetAdjective] pretende anexar a região.\n\nEssas revoltas parecem ser o primeiro passo para um conflito maior entre [FROM.GetName] e [CZE.GetNameDef]. Um conflito que agora parece inevitável."
 MUN_czech.news.1.a: "Isso não pega bem para a Europa."
 MUN_czech.news.1.b: "O caos é uma escada."
 MUN_czech.news.1.c: "Nós triunfaremos!"
 MUN_czech.news.1.d: "Com sorte, a diplomacia triunfará."
 MUN_czech.news.2.t: "Exército [FROM.GetAdjective] invade [RUT.GetNameDef]"
 MUN_czech.news.2.desc: "\nEm algum lugar dos acontecimentos recentes que sucederam o caos político n[CZE.GetNameDef], a pequena região d[RUT.GetNameDef] ficou fora das fronteiras dos outros países. O pequeno Estado dissidente se declarou uma nação independente e começou a formar milícias para tentar proteger sua nova soberania.\n\nO governo d[FROM.GetNameDef] tem projetos para a região há bastante tempo e, ao ver a oportunidade, invadiu o pequeno Estado rapidamente. A vitória deles sobre [RUT.GetNameDef] parece uma conclusão óbvia para muitos observadores."
 MUN_czech.news.2.a: "Carpátia o quê?"
 MUN_czech.news.2.b: "Isso será fácil."
 MUN_czech.news.2.c: "Venham, se tiverem coragem!"
 MUN_slovakia.news.1.t: "Conflitos fronteiriços em [71.getname]"
 MUN_slovakia.news.1.desc: "Apesar de reconquistar [664.Getname] após a $GER_first_vienna_award$, o governo d[HUN.GetNameDef] ainda pretende fazer mais ajustes de fronteiras com [SLO.getnamedef] em [71.Getname].\n\nEsse conflito parece ser uma desculpa para o Estado [HUN.GetAdjective] testar a força do seu exército contra uma oposição muito mais fraca. O jovem exército d[SLO.getnamedef] talvez não esteja pronto para enfrentar esse desafio."
 MUN_slovakia.news.1.a: "Crianças briguentas."
 MUN_slovakia.news.1.b: "Estamos preparados."
