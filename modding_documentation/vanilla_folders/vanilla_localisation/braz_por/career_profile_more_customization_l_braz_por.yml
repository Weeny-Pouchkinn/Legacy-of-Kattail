 CAREER_PROFILE_OVERACHIEVER_MEDAL: "Liderança Além das Expectativas"
 CAREER_PROFILE_OVERACHIEVER_MEDAL_DESCRIPTION: "Conclua um certo número de objetivos de facção de longo prazo."
 CAREER_PROFILE_BOATS_UP_MEDAL: "De vento em popa"
 CAREER_PROFILE_BOATS_UP_MEDAL_DESCRIPTION: "Promova um capitão de navio a almirante e alcance o seguinte nível de habilidade."
