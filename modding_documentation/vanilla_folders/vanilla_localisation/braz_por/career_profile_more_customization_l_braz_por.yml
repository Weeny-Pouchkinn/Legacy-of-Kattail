 #Ribbons
 CAREER_PROFILE_SYNTHETIC_SECURITY: "Segurança Sintética"
 CAREER_PROFILE_SYNTHETIC_SECURITY_DESCRIPTION: "Ganhe mais de 30 unidades de borracha a partir de fontes artificiais (refinarias sintéticas)."
 CAREER_PROFILE_SYNTHETIC_SECURITY_QUOTE: "\"Se as mulheres nas fábricas tivessem parado de trabalhar por 20 minutos, os Aliados teriam perdido a guerra.\"\n\nMarechal de Campo e Comandante Chefe da França, Joseph Joffre, Primeira Guerra Mundial."
 CAREER_PROFILE_RUBBER_BARON: "Barão da Borracha"
 CAREER_PROFILE_RUBBER_BARON_DESCRIPTION: "Controle pelo menos 1.000 unidades de borracha e tenha uma economia fechada."
 CAREER_PROFILE_RUBBER_BARON_QUOTE: "\"…a captura das principais áreas de produção de borracha do Extremo Oriente, em 1942, eliminou 90% das fontes de produção natural de borracha do mundo.\"\n\n- The Southern Economic Journal, janeiro de 1947"
 CAREER_PROFILE_THE_TRUCK_WILL_ALWAYS_GET_THROUGH: "O caminhão sempre passará"
 CAREER_PROFILE_THE_TRUCK_WILL_ALWAYS_GET_THROUGH_DESCRIPTION: "Use mais de 5.000 caminhões para entregar suprimentos para os exércitos."
 CAREER_PROFILE_THE_TRUCK_WILL_ALWAYS_GET_THROUGH_QUOTE: "\"Disseram que o bombardeiro sempre passaria. Mas os caminhões já estavam lá.\"\n\n- Desconhecido"
 CAREER_PROFILE_MARE_NOSTRUM: "Mare Nostrum"
 CAREER_PROFILE_MARE_NOSTRUM_DESCRIPTION: "Conquiste a dominância naval nas seis regiões marítimas principais do Mar Mediterrâneo, das quais ao menos uma seja contestada."
 CAREER_PROFILE_MARE_NOSTRUM_QUOTE: "\"Quando perdi meu fuzil, o Exército me cobrou 85 dólares. É por isso que na Marinha o capitão afunda com o navio.\"\n\n- Dick Gregory"
 CAREER_PROFILE_BLITZ_THIS: "Hora da Blitz"
 CAREER_PROFILE_BLITZ_THIS_DESCRIPTION: "Escolha defesa elástica como a estratégia preferida de um general, marechal de campo ou país."
 CAREER_PROFILE_BLITZ_THIS_QUOTE: "\"Recue as linhas como um arqueiro preparando seu arco, depois solte-as.\"\n\n- Desconhecido"
 CAREER_PROFILE_SCORCHED_EARTH: "Terra Arrasada"
 CAREER_PROFILE_SCORCHED_EARTH_DESCRIPTION: "Exploda ferrovias usando o recurso \"Terra Arrasada\" para desacelerar os avanços do inimigo."
 CAREER_PROFILE_SCORCHED_EARTH_QUOTE: "\"...não podemos deixar uma única locomotiva, um único vagão, nem um grama de cereal ou galão de combustível para o inimigo.\"\n\n- Joseph Stalin, discurso em rádio, 3 de julho de 1941"
 CAREER_PROFILE_RULED_BY_FURNITURE: "Governado pela Mobília!"
 CAREER_PROFILE_RULED_BY_FURNITURE_DESCRIPTION: "Não tenha nenhum indivíduo ou grupo de pessoas retratados para estar no comando da sua nação."
 CAREER_PROFILE_RULED_BY_FURNITURE_QUOTE: "\"Preocupar-se é como uma cadeira de balanço: ocupa sua cabeça, mas não leva você a lugar algum.\"\n\n- Provérbio inglês antigo"
 CAREER_PROFILE_THE_THOUSAND_YEAR_BOND: "O Vínculo Milenar"
 CAREER_PROFILE_THE_THOUSAND_YEAR_BOND_DESCRIPTION: "Implante cem batalhões de cavalaria ou cavalaria de camelos."
 CAREER_PROFILE_THE_THOUSAND_YEAR_BOND_QUOTE: "\"Um cavalo precisa ser um pouco louco para ser uma boa montaria, já seu cavaleiro, completamente.\"\n\n- Steven Pressfield"
 CAREER_PROFILE_ROCKETS_REIGN: "Reinado dos Foguetes"
 CAREER_PROFILE_ROCKETS_REIGN_DESCRIPTION: "Construa mais de 10 bases de lançamento de foguetes."
 CAREER_PROFILE_ROCKETS_REIGN_QUOTE: "\"O foguete funcionou perfeitamente, exceto por ter aterrissado no planeta errado.\"\n\n- Wernher Von Braun"
 CAREER_PROFILE_STEEL_AT_HIGH_SPEED: "Aço em Alta Velocidade"
 CAREER_PROFILE_STEEL_AT_HIGH_SPEED_DESCRIPTION: "Implante mais de 4.000 tanques com velocidade máxima acima de 12 km/h."
 CAREER_PROFILE_STEEL_AT_HIGH_SPEED_QUOTE: "\"Se tudo parece estar sob controle, você não está indo rápido o suficiente.\"\n\n- Mario Andretti"
 CAREER_PROFILE_ORCHESTRA_OF_BOOM: "Explosão Orquestrada"
 CAREER_PROFILE_ORCHESTRA_OF_BOOM_DESCRIPTION: "Implante uma divisão contendo pelo menos um batalhão \"antiaéreo\", \"de artilharia\", \"de artilharia de foguetes\" e \"antitanque\", apoiados por uma companhia de comunicação."
 CAREER_PROFILE_ORCHESTRA_OF_BOOM_QUOTE: "\n\"Uma autêntica crescente de sons, tão contínua a ponto de combinar e se misturar num rugido aniquilador único, o rugido de um trem num túnel multiplicado por milhões.\"\n\n- Arnold D. Harvey"
 CAREER_PROFILE_TASK_FAILED_SUCCESSFULLY: "Missão fracassada com sucesso"
 CAREER_PROFILE_TASK_FAILED_SUCCESSFULLY_DESCRIPTION: "Fracasse em uma incursão tendo 80% ou mais de chance de sucesso."
 CAREER_PROFILE_TASK_FAILED_SUCCESSFULLY_QUOTE: "\"A incursão deve ser vista como um reconhecimento em força... Era essencial obter todas as informações necessárias antes de partirmos para operações em escala maior...\"\n\n- Winston Churchill, sobre a Batalha de Dieppe, 8 de setembro de 1942"
 CAREER_PROFILE_PUNCH_IT: "Soco nuclear"
 CAREER_PROFILE_PUNCH_IT_DESCRIPTION: "Realize uma incursão bem-sucedida contra uma instalação nuclear, enquanto controla pelo menos um estado vizinho à instalação."
 CAREER_PROFILE_PUNCH_IT_QUOTE: "\"Pelo bem da nação, foi necessário restaurar a disposição do exército em se sacrificar\"\n\n - Alexander Kerensky sobre a Ofensiva de Junho"
 CAREER_PROFILE_PLAN_L: "Plano L"
 CAREER_PROFILE_PLAN_L_DESCRIPTION: "Começando como um país sem litoral, conclua 2 projetos especiais navais, construa 10 contratorpedeiros, 5 cruzadores, 2 encouraçados e 1 porta-aviões."
 CAREER_PROFILE_PLAN_L_QUOTE: "\"A Marinha leva três anos para construir um navio. Levará 300 anos para construir uma nova tradição. A evacuação continuará.\"\n\n - Andrew Cunningham, sobre a evacuação de Creta"
 CAREER_PROFILE_SWEETENER_HEXADECAGON: "Incentivo Hexadecagonal"
 CAREER_PROFILE_SWEETENER_HEXADECAGON_DESCRIPTION: "Pesquise 16 tecnologias desbloqueadas por projetos especiais."
 CAREER_PROFILE_SWEETENER_HEXADECAGON_QUOTE: "\"Quando lhe mostrei aqueles cálculos, pensamos que poderíamos iniciar uma reação em cadeia que talvez destruísse o mundo inteiro\".\n\n - Robert Oppenheimer, Oppenheimer"
 CAREER_PROFILE_ISLAND_HOPPER: "Especialista em Ilhas"
 CAREER_PROFILE_ISLAND_HOPPER_DESCRIPTION: "Assuma o controle de 10 locais estratégicos."
 CAREER_PROFILE_ISLAND_HOPPER_QUOTE: "\"Você quer viver?! Saia da praia!\"\n\n- John Basilone, The Pacific"
 CAREER_PROFILE_IM_THE_CAPTAIN_NOW: "Eu Sou o Capitão Agora"
 CAREER_PROFILE_IM_THE_CAPTAIN_NOW_DESCRIPTION: "Jogando como uma nação menor, assuma a liderança de uma facção."
 CAREER_PROFILE_IM_THE_CAPTAIN_NOW_QUOTE: "\"Olhe para mim. Eu sou o capitão agora.\"\n\n- Muse, Capitão Phillips"
 CAREER_PROFILE_THREE_MUSKETEERS: "Os Três Mosqueteiros"
 CAREER_PROFILE_THREE_MUSKETEERS_DESCRIPTION: "Estabeleça três teatros de operações da facção comandados por seus oficiais."
 CAREER_PROFILE_THREE_MUSKETEERS_QUOTE: "\"Um por todos e todos por um. Unidos venceremos, divididos cairemos.\"\n\n- Alexandre Dumas"
 CAREER_PROFILE_THE_MORE_THE_MERRIER: "Quanto Mais, Melhor"
 CAREER_PROFILE_THE_MORE_THE_MERRIER_DESCRIPTION: "Alcance um bônus de compartilhamento de pesquisa da facção de 30%."
 CAREER_PROFILE_THE_MORE_THE_MERRIER_QUOTE: "\"Nenhum homem é uma ilha, inteiro por si só; cada homem é uma parte do continente, uma parte do todo.\"\n\n- John Donne"
 CAREER_PROFILE_IM_HERE_TO_RESCUE_YOU: "Estou aqui para resgatar você!"
 CAREER_PROFILE_IM_HERE_TO_RESCUE_YOU_DESCRIPTION: "Use uma incursão com sucesso para resgatar seu comandante capturado."
 CAREER_PROFILE_IM_HERE_TO_RESCUE_YOU_QUOTE: "\"Sinto muito, nos atrasamos em alguns minutos.\" \n\n - Lorde Lovat"
 CAREER_PROFILE_DEJA_VU: "Déjà vu"
 CAREER_PROFILE_DEJA_VU_DESCRIPTION: "Use uma operação de espionagem com sucesso para resgatar seu comandante capturado."
 CAREER_PROFILE_DEJA_VU_QUOTE: "\"Levantei a questão [de um resgate] novamente. Desta vez, motivou uma ação.\" \n\n - Major Lapham"
 CAREER_PROFILE_THE_MORE_THINGS_CHANGES: "Quanto mais as coisas mudam, mais ficam iguais"
 CAREER_PROFILE_THE_MORE_THINGS_CHANGES_DESCRIPTION: "Domine completamente 2 subdoutrinas das forças especiais."
 CAREER_PROFILE_THE_MORE_THINGS_CHANGES_QUOTE: "\"Éramos descartáveis. Um bônus, nada mais que isso.\" \n\n - Major-General Colin Gubbins"
 CAREER_PROFILE_FULLY_DECKED_OUT: "Totalmente equipado"
 CAREER_PROFILE_FULLY_DECKED_OUT_DESCRIPTION: "Projete e mobilize uma divisão que tenha 5 unidades de apoio divisional e 5 unidades de apoio regimental."
 CAREER_PROFILE_FULLY_DECKED_OUT_QUOTE: "\"Na dúvida, ataque.\" \n\n - George Patton"
