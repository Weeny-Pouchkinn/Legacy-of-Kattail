 DLC_DESCRIPTION_dlc018: "Novas árvores de foco nacional e eventos para Canadá, Austrália, Nova Zelândia, Raj (Índia) e África do Sul. Um comando de plano de batalha que permite mais controle sobre grandes círculos e o rompimento de linhas inimigas."
 DLC_DESCRIPTION_dlc020: "Quatro novas árvores de foco: Viva a guerra sobre as difíceis perspectivas da Hungria, Romênia, Tchecoslováquia e Iugoslávia."
 DLC_DESCRIPTION_dlc022: "Árvores de foco modificadas para Alemanha e Japão: Agora as duas grandes potências do Eixo seguem caminhos históricos alternativos, incluindo a chance de depor Hitler ou implantar o comunismo ou a democracia no Japão."
 DLC_DESCRIPTION_dlc023: "Obtenha novos projetos de navio, características e habilidades para almirantes e veículos anfíbios. Use minas navais para proteger seus mares e rotas marítimas para escapar de perigos. Inclui novas árvores de foco para a Holanda, Reino Unido, México e EUA."
 DLC_DESCRIPTION_dlc028: "La Résistance adiciona agentes secretos, missões de espionagem e novas opções de movimentos de resistência. Mande agentes para o território perigoso para decifrar os segredos do inimigo ou preparar o terreno para sua invasão, encontrando colaboradores que ficarão felizes com qualquer gostinho de poder."
 DLC_DESCRIPTION_dlc031: "Adiciona árvores de foco nacional dedicadas a potências menores em volta do Mar Negro e do Egeu. Bulgária, Grécia e Turquia podem criar seus caminhos históricos únicos e alternativos conforme resistem aos esforços das grandes potências de dominar as rotas marítimas estratégicas do Bósforo e do Dardanelles."
 DLC_DESCRIPTION_dlc034: "No Step Back adiciona mais detalhes para diversas nações da Europa Oriental, sistemas de jogo únicos para refletir a política soviética e várias melhorias ao aspecto militar do jogo."
 DLC_DESCRIPTION_dlc036: "Crie um novo império, resista às agressões externas ou explore os limites da neutralidade. O DLC By Blood Alone adiciona novas opções de história alternativa e variedade de jogo para Itália, Etiópia e Suíça, além de outras mudanças significativas."
 DLC_DESCRIPTION_dlc038: "Escreva novas histórias emocionantes para os países nórdicos conforme as maiores potências da Europa lutam pelo futuro do mundo. Novas árvores de foco nacional para Finlândia, Suécia, Dinamarca e Noruega assumirem posições de protagonismo. Especialize sua indústria bélica para enfatizar a eficiência e depois venda essas armas no novo mercado internacional."
 DLC_DESCRIPTION_dlc040: "Trial of Allegiance adiciona Árvores de Foco abrangentes para Brasil, Argentina, Chile, Uruguai e Paraguai. A estabilidade de todo um continente balança por um fio. Abra uma nova frente na guerra enquanto corteja benfeitores europeus com o seu bem mais precioso: a lealdade."
 DLC_DESCRIPTION_dlc043: "Desenvolva protótipos de tecnologias e armas para serem utilizadas contra seus inimigos. Realize incursões para destruir as instalações de pesquisa, represas e marcos de seus adversários. Novas e atualizadas árvores de foco permitem que você use o círculo interno da Alemanha para alcançar seus objetivos, recriar o Império Habsburgo como Áustria ou Hungria e explorar a dinâmica da Bélgica e de sua colônia, o Congo Belga."
 DLC_DESCRIPTION_dlc046: "Graveyard of Empires introduz árvores de foco exclusivas para o Irã, o Raj, o Iraque e o Afeganistão. Reduza a influência das potências estrangeiras intrometidas e restaure o orgulho perdido de sua nação enquanto luta para dominar o Oriente Médio e o Sul da Ásia."
 DLC_DESCRIPTION_dlc049: "Estabeleça novos caminhos na história para Japão, China e Filipinas em No Compromise, No Surrender, uma expansão de Hearts of Iron IV. Alcance um nível de controle maior sobre as facções, forje novas doutrinas militares e decida o destino do Pacífico e além."
 DLC_DESCRIPTION_dlc051: "Recrie o Reino da Boêmia, forme uma união com os Estados da Europa Central, proteja-se com fortificações ou forme uma rede de aliados usando a nova árvore de foco \"Paz para o nosso tempo\" da Tchecoslováquia."
 DLC_DESCRIPTION_dlc052: "Esteja no centro do comando alocando seus generais nas linhas de frente e distribua medalhas para os seus capitães de navio mais bem-sucedidos. Como Austrália, detenha a invasão japonesa no sudeste da Ásia; como Sião, estabeleça um novo império; como Indonésia, decida o futuro dela com ou sem domínio neerlandês."
