 ### INS - Political Events
 INS_political_events.1.t: "O novo governador-geral d[INS.GetNameDef]"
 INS_political_events.1.desc: "O mandato de cinco anos de [INS.GetLeader] está chegando ao fim e precisamos escolher um sucessor à altura. A Rainha Guilhermina recomendou Alidius Tjarda van Starkenborgh Stachouwer, que demonstrou grande potencial como Embaixador Extraordinário e Ministro Plenipotenciário."
 INS_political_events.1.a: "Como a rainha desejar."
 INS_political_events.1.b: "[INS.GetLeader] fez um bom trabalho. Ele deve cumprir mais um mandato."
 INS_political_events.2.t: "Governo [FROM.GetAdjective] reivindica o [721.GetName]"
 INS_political_events.2.desc: "O novo governo republicano nas antigas Índias declarou que todo o arquipélago faz parte de seu território. [FROM.GetLeader] nos enviou uma exigência formal para entregarmos o [721.GetName], ameaçando intervenção militar em caso de recusa."
 INS_political_events.2.a: "Tudo bem, não vale a pena provocar um incidente."
 INS_political_events.2.b: "Nem pensar!"
 INS_political_events.3.t: "Governo [FROM.GetAdjective] concorda em ceder o [721.GetName]"
 INS_political_events.3.desc: "Como esperado, [FROM.GetLeader] concordou com nossas exigências e iniciou a retirada das tropas do [721.GetName]. Forças do TKR entraram na região acompanhadas por vários representantes do governo. O próprio [INS.GetLeader] proferiu um discurso em Díli, declarando a libertação da influência colonial."
 INS_political_events.3.a: "Incrível!"
 INS_political_events.4.t: "Governo [FROM.GetAdjective] se recusa a ceder o [721.GetName]"
 INS_political_events.4.desc: "As negociações com [FROM.GetNameDef] fracassaram. [FROM.GetLeader] recusou-se a ceder o [721.GetName] sob qualquer circunstância, encerrando a reunião prematuramente."
 INS_political_events.4.a: "Então é guerra."
 INS_political_events.5.t: "A eleição geral da Indonésia"
 INS_political_events.5.desc: "Hoje é um dia histórico para a Indonésia. Com a revolução oficialmente encerrada, o primeiro-ministro [INS.GetLeader] declarou que a Indonésia realizará sua primeira eleição livre e democrática. O resultado terá um impacto duradouro sobre o país."
 INS_political_events.5.a: "Sutan Sjahrir conduziu nosso país até este ponto e continuará a nos guiar adiante!"
 INS_political_events.5.b: "Amir Sjarifuddin representa um bom meio-termo entre os socialistas e os nacionalistas."
 INS_political_events.5.c: "Mohammad Hatta iniciou a revolução, e ele a concluirá."
 INS_political_events.6.t: "Nossos preparativos dão resultado"
 INS_political_events.6.desc: "Com a revolução em andamento, nossos guerrilheiros infiltrados na administração das Índias já não precisam mais operar em segredo e começarão a executar suas missões de sabotagem antes que os Países Baixos consigam reagir."
 INS_political_events.6.a: "Precisamos continuar agindo com rapidez."
 INS_political_events.7.t: "A petição de Soetardjo"
 INS_political_events.7.desc: "A petição do Volksraad organizada por Soetardjo, que solicita a realização de uma conferência entre representantes neerlandeses e indonésios para discutir a autonomia da Indonésia, concluiu seu debate interno e foi encaminhada ao governador-geral para aprovação. Embora muitos conselheiros insistam que o status quo deve ser mantido e, portanto, que a petição deve ser vetada, não se pode negar que os movimentos nacionalistas estão se tornando cada vez mais fortes e radicalizados. Se continuarmos a recusar todos os pedidos pacíficos por autonomia, os nacionalistas poderão recorrer a meios mais violentos."
 INS_political_events.7.a: "Devemos iniciar as negociações imediatamente, ou uma guerra civil será inevitável."
 INS_political_events.7.b: "O status quo deve ser mantido."
 INS_political_events.7.c: "Talvez os nacionalistas tenham razão?"
 INS_political_events.8.t: "Ocupação iminente pelo exército [?event_target:INS_invasion_event_invader.GetAdjective]"
 INS_political_events.8.desc: "Tropas d[?event_target:INS_invasion_event_invader.GetNameDef] chegaram em [?event_target:INS_invasion_event_invaded_state.GetName] e nossos soldados na região, em grande desvantagem numérica, receberam ordens para realizar uma evacuação militar completa. O exército [?event_target:INS_invasion_event_invader.GetAdjective] continua avançando pelas Índias e nossas chances de resistir à ocupação tornam-se cada vez menores."
 INS_political_events.8.a: "Prenderemos os nacionalistas e defenderemos nossa pátria até a morte!"
 INS_political_events.9.t: "Indonésios declaram independência"
 INS_political_events.9.desc: "Com o início da retirada das forças do Exército [JAP.GetAdjective] das Índias Orientais, enviamos tropas para a Batávia a fim de restaurar o governo colonial. No entanto, nossos soldados constataram que o cenário político na região havia mudado significativamente desde a ocupação. Antes mesmo de nossas tropas chegarem à Batávia, [INS.GetLeader] já havia assinado uma declaração de independência, proclamando a República da Indonésia como uma nação soberana, com surpreendente apoio popular."
 INS_political_events.9.a: "Enviem os tanques!"
 INS_political_events.9.b: "Isso é inútil. Não precisamos de mais guerras, devemos concentrar nossos esforços na reconstrução da pátria."
 INS_political_events.11.t: "Governo [HOL.GetAdjective] reconhece a soberania da Indonésia"
 INS_political_events.11.desc: "Após declararmos independência, nossas milícias se mobilizaram imediatamente para defender nosso território contra a invasão neerlandesa que esperávamos. Contudo, para surpresa geral, [HOL.GetLeader] anunciou que não pretende lançar uma invasão, preferindo priorizar a reconstrução da pátria neerlandesa e evitar mais conflitos."
 INS_political_events.11.a: "Uma surpresa bem-vinda."
 INS_political_events.12.t: "Encontro com nacionalistas indonésios"
 INS_political_events.12.desc: "Nossas tropas desembarcaram em [?event_target:INS_invasion_event_invaded_state.GetName] e a vitória na frente indonésia é iminente. Precisamos decidir como proceder com a ocupação do país. Embora uma ocupação direta nos forneça os recursos de que precisamos, será custosa e difícil. Negociamos com Sukarno, um dos principais revolucionários, e elaboramos um plano no qual estabeleceremos um Estado fantoche indonésio, oficialmente liderado em parte por Sukarno, mas sob nosso comando. Isso manterá os civis indonésios tranquilos e custará muito menos do que uma ocupação total."
 INS_political_events.12.a: "Devemos continuar as negociações com Sukarno."
 INS_political_events.12.b: "Não temos interesse em cooperar com revolucionários."
 INS_political_events.13.t: "Ocupação iminente pelo exército [?event_target:INS_invasion_event_invader.GetAdjective]"
 INS_political_events.13.desc: "Tropas d[?event_target:INS_invasion_event_invader.GetNameDef] chegaram em [?event_target:INS_invasion_event_invaded_state.GetName] e nossos soldados na região, em grande desvantagem numérica, receberam ordens para realizar uma evacuação militar completa. O exército [?event_target:INS_invasion_event_invader.GetAdjective] continua avançando pelas Índias e nossas chances de resistir à ocupação tornam-se cada vez menores. Além disso, nossos espiões relatam que [?event_target:INS_invasion_event_invader.GetLeader] foi visto negociando com Sukarno e outros líderes nacionalistas, buscando estabelecer um Estado fantoche indonésio liderado por Sukarno sob a esfera de coprosperidade."
 INS_political_events.13.a: "Prenderemos os nacionalistas e defenderemos nossa pátria até a morte!"
 INS_political_events.13.b: "É perigoso, mas talvez esta seja uma verdadeira chance de conquistar a independência."
 INS_peta_explain_tt: "Poderemos tirar proveito do caos da ocupação para declarar independência total caso o Estado [JAP.GetAdjective] seja forçado a recuar."
 INS_peta_explain_tt_jap: "§RO governo [INS.GetAdjective] pode permanecer leal a nós, mas, se começarmos a perder o controle do território, poderão perceber nosso blefe e declarar independência§!."
 INS_political_events.14.t: "Líderes nacionalistas presos"
 INS_political_events.14.desc: "Sukarno, assim como vários outros revolucionários importantes da Indonésia, foram presos pela polícia militar neerlandesa antes que pudéssemos estabelecer o regime fantoche."
 INS_political_events.14.a: "Uma pena. Ele teria sido um aliado valioso."
 INS_political_events.15.t: "Defensores da pátria"
 INS_political_events.15.desc: "As negociações com Sukarno foram concluídas e o regime fantoche da Indonésia foi iniciado. Sukarno utilizou suas conexões, juntamente com nossa presença militar, para desestabilizar o governo neerlandês e assumir o controle do arquipélago."
 INS_political_events.15.a: "Não apenas asseguramos recursos a um baixo custo, como também conquistamos um aliado valioso."
 INS_political_events.16.t: "Ocupação do Estado [?event_target:INS_invasion_event_invader.GetAdjective] sobre as Índias"
 INS_political_events.16.desc: "As forças do Exército [?event_target:INS_invasion_event_invader.GetAdjective] nas Índias cooperaram com os nacionalistas indonésios para desestabilizar nossa administração colonial e ocuparam completamente a região. Bandeiras neerlandesas foram arriadas e substituídas por bandeiras indonésias, e a população nativa das Índias parece estar acolhendo os ocupantes d[?event_target:INS_invasion_event_invader.GetNameDef]. O futuro do nosso império colonial não parece promissor."
 INS_political_events.16.a: "Eles venceram a batalha, mas não a guerra."
 INS_political_events.17.t: "Governo [INS.GetAdjective] declara independência"
 INS_political_events.17.desc: "Notícias vindas da Batávia chegaram ao Quartel-General Imperial. Sukarno e sua camarilha, colocados no poder por nós para governar as ilhas em nome do imperador, proclamaram a República do Estado [FROM.GetAdjective] em resposta às nossas repetidas perdas territoriais, convencidos de que estamos sobrecarregados demais para reagir."
 INS_political_events.17.a: "Infelizmente, eles podem ter razão."
 INS_political_events.18.t: "Tan Malaka retorna à Indonésia"
 INS_political_events.18.desc: "Tan Malaka, o comunista indonésio que nos últimos anos atuou como conselheiro de confiança de nosso governo, anunciou sua partida imediata. Com o Estado [INS.GetAdjective] agora estabelecido como uma república livre, ele pretende enfim retornar ao país no qual ingressou como foragido há mais de duas décadas. Ele nos agradece pelo refúgio concedido e pela liberdade de continuar sua obra, afirmando apenas que seu lugar agora é em casa."
 INS_political_events.18.a: "Desejaremos boa sorte a ele."
 INS_political_events.19.t: "Governo [HOL.GetAdjective] chama o almirante Helfrich de volta"
 INS_political_events.19.desc: "Chegaram notícias da [1058.GetName] de que o almirante Conrad Helfrich, comandante de nossas forças navais e o oficial mais competente que possuímos nestas águas, foi convocado de volta à pátria. Haia alega necessidades urgentes na metrópole, sem oferecer explicações adicionais. Sua partida deixa o arquipélago vulnerável em um momento no qual nossa posição está longe de ser segura, e comenta-se que o ambiente entre os oficiais em Surabaya é de profundo desânimo."
 INS_political_events.19.a: "Um dia sombrio para a frota."
 ### INS - Industrial Events
 INS_industrial_events.4.t: "Realocação de orçamento em [FROM.FROM.GetName]"
 INS_industrial_events.4.desc: "Ao encerrar as atividades das plantações de borracha em [FROM.FROM.GetName], liberamos recursos no orçamento para investir em novos projetos industriais na região."
 INS_industrial_events.4.a: "Construiremos poços de petróleo em [FROM.FROM.GetName]."
 INS_industrial_events.4.b: "Devemos inaugurar uma fundição de alumínio em [FROM.FROM.GetName]."
 INS_industrial_events.4.c: "Devemos prospectar recursos que não conseguimos produzir."
 INS_industrial_events.4.d: "Podemos abrir minas de carvão em [FROM.FROM.GetName]."
 INS_industrial_events.5.t: "[INS_industrial_events_5_t_scripted]"
 INS_industrial_events_5_t_colonial: "Destino do Banco De Javasche"
 INS_industrial_events_5_t_independent: "Destino do Bank Indonesia"
 INS_industrial_events.5.desc: "[INS_industrial_events_5_desc_scripted]"
 INS_industrial_events_5_desc_colonial: "As reservas do Banco De Javasche caíram a seu nível mais baixo em uma década. O florim perde valor mês após mês e os proprietários de plantações exigem pagamento em moeda estrangeira. Nossos conselheiros financeiros concordam que o banco, por si só, não tem condições de reverter o declínio, mas discordam sobre o que deve ser feito."
 INS_industrial_events_5_desc_independent: "O Bank Indonesia relatou que a rupia perdeu quase um quinto de seu valor apenas no último trimestre. Comerciantes de arroz em Surabaya começaram a recusá-la completamente, aceitando apenas dinheiro estrangeiro. Nosso Ministro das Finanças insiste que a moeda pode ser salva, mas apenas se medidas firmes forem tomadas imediatamente."
 INS_industrial_events.5.a: "Devemos tentar fortalecer o florim, não o substituir."
 INS_industrial_events.5.b: "Atrelaremos o florim das Índias ao florim neerlandês."
 INS_industrial_events.5.c: "Atrelaremos o florim das Índias ao dólar americano."
 INS_industrial_events.6.t: "Um acordo mais lucrativo"
 INS_industrial_events.6.desc: "O Gabinete de Cinchona aceitou nossos termos. Com a malária assolando metade dos trópicos e sem uma alternativa à quinina, restavam poucas opções para eles. O novo acordo nos garante uma parcela significativamente maior dos lucros de cada grama de quinina exportada. Resta decidir como utilizar esse ganho inesperado."
 INS_industrial_events.6.a: "Invista em nossas cidades."
 INS_industrial_events.6.b: "Desenvolva as ilhas exteriores."
 INS_industrial_events.6.c: "Fortaleça nossa indústria militar."
 # Rubber shipment dispatched
 INS_industrial_events.28.t: "Carregamento de borracha enviado"
 INS_industrial_events.28.desc: "Os comboios carregaram o último lote de borracha e partiram para o mar. Nossos compradores receberão aquilo pelo que pagaram, e nossos livros-caixa refletirão a compensação acordada no devido tempo. Pelos próximos dois anos, o custo desta transação permanecerá em nossos balanços, uma lembrança do que a Depressão exige de nós."
 INS_industrial_events.28.a: "Entendido."
 INS_industrial_events.28.b: "Providencie outro carregamento."
 # Oil shipment dispatched
 INS_industrial_events.36.t: "Carregamento de petróleo enviado"
 INS_industrial_events.36.desc: "Os petroleiros partiram de nossas refinarias, com as cargas em seus porões destinadas aos portos do comprador. A compensação foi acordada e será recebida integralmente, embora o peso da venda recaia sobre nossa economia pelos próximos dois anos. Esses são os termos que o mundo nos impõe nestes tempos de escassez."
 INS_industrial_events.36.a: "Entendido."
 INS_industrial_events.36.b: "Providencie outro carregamento."
 ### INS - Volksraad
 INS_volksraad_events.2.t: "[HOL.GetLeader] vetou a petição do Volksraad"
 INS_volksraad_events.2.desc: "Embora a petição tenha sido aprovada por [INS.GetLeader], ela foi vetada após análise de [HOL.GetLeader], o que impede sua implementação neste momento."
 INS_volksraad_events.2.a: "Talvez possamos reapresentá-la no futuro, com a devida ratificação."
 # Generic/Reused
 INS_volksraad_events.10.t: "Moção do Volksraad para permitir o idioma indonésio nas escolas"
 INS_volksraad_events.10.desc: "[INS.GetLeader] aprovou uma petição do Volksraad para incentivar a criação de escolas e universidades de idioma indonésio no país, encaminhando-a para aprovação final de [HOL.GetLeader]."
 INS_volksraad_events.10.a: "O Volksraad está cumprindo seu propósito."
 INS_volksraad_events.10.b: "Nem pensar. Devemos vetar isso!"
 INS_volksraad_events.11.t: "A educação no idioma indonésio será estabelecida"
 INS_volksraad_events.11.desc: "A petição foi assinada por [HOL.GetLeader] e agora está oficialmente corroborada. A implementação começará em breve, assim que os detalhes finais forem decididos."
 INS_volksraad_events.11.a: "O Volksraad está cumprindo seu propósito."
 # Individual laws
 INS_volksraad_events.20.t: "Moção do Volksraad para permitir o idioma indonésio no governo"
 INS_volksraad_events.20.desc: "Os cargos governamentais nas Índias, incluindo os do Volksraad, exigem fluência no idioma neerlandês, o que levou muitos membros do conselho, especialmente representantes das comunidades nativas, a questionar o caráter democrático da instituição. Eles apresentaram uma moção defendendo que posições governamentais possam ser preenchidas por falantes do indonésio sempre que possível."
 INS_volksraad_events.21.t: "Idioma indonésio passa a ser permitido no governo!"
 INS_volksraad_events.21.desc: "A petição foi assinada por [HOL.GetLeader] e agora está oficialmente corroborada. A implementação começará em breve, assim que os detalhes finais forem decididos."
 INS_volksraad_events.30.t: "Moção do Volksraad para abolir o sistema de cotas na educação"
 INS_volksraad_events.30.desc: "[INS.GetLeader] aprovou uma petição do Volksraad para abolir o sistema de cotas na educação d[INS.GetNameDef], com o objetivo de encerrar as prolongadas disputas dentro do conselho sobre sua implementação e equidade. A petição foi encaminhada a [HOL.GetLeader] para aprovação final."
 INS_volksraad_events.31.t: "Sistema de cotas na educação é abolido"
 INS_volksraad_events.31.desc: "A petição foi assinada por [HOL.GetLeader] e agora está oficialmente corroborada. A implementação começará em breve, assim que os detalhes finais forem decididos."
 INS_volksraad_events.40.t: "Moção do Volksraad para reduzir o imposto de exportação sobre a borracha"
 INS_volksraad_events.40.desc: "[INS.GetLeader] assinou e aprovou uma petição do Volksraad para reduzir os altos impostos aplicados às plantações privadas de borracha. Durante anos, esses impostos garantiram ao governo um monopólio altamente lucrativo, mas o avanço do protecionismo internacional tornou esse sistema muito menos rentável. [INS.GetLeader] declarou que já não acredita que os impostos compensem as consequências econômicas resultantes."
 INS_volksraad_events.40.a: "[INS.GetLeader] tem razão."
 INS_volksraad_events.40.b: "Os impostos serão mantidos."
 INS_volksraad_events.41.t: "Redução do imposto privado sobre a exportação de borracha"
 INS_volksraad_events.41.desc: "A petição foi assinada por [HOL.GetLeader] e agora está oficialmente corroborada. A implementação começará em breve, assim que os detalhes finais forem decididos."
 INS_volksraad_events.60.t: "Moção do Volksraad para abolir o limite informal de patentes para oficiais indonésios"
 INS_volksraad_events.60.desc: "[INS.GetLeader] aprovou uma petição do Volksraad para revogar a regra informal que limita a patente que oficiais não neerlandeses do KNIL podem alcançar, bem como para a promoção de oficiais indonésios que ocupam patentes abaixo de sua competência. A petição foi encaminhada a [HOL.GetLeader] para aprovação final."
 INS_volksraad_events.61.t: "Suspensão do teto invisível de patentes para generais nascidos n[INS.GetNameDef]"
 INS_volksraad_events.61.desc: "A petição foi assinada por [HOL.GetLeader] e agora está oficialmente corroborada. A implementação começará em breve, assim que os detalhes finais forem decididos."
 INS_volksraad_events.70.t: "Moção do Volksraad para legalizar a exibição pública de bandeiras e símbolos nacionalistas"
 INS_volksraad_events.70.desc: "[INS.GetLeader] aprovou uma petição do Volksraad para suspender as restrições à exibição de bandeiras e símbolos nacionalistas em espaços públicos n[INS.GetNameDef], em grande parte com o objetivo de reduzir a radicalização de muitos jovens nacionalistas. [INS.GetLeader] insiste que devemos adotar uma postura defensiva em relação à questão, cooperando com líderes nacionalistas pacíficos enquanto erradicamos movimentos revolucionários. No entanto, a decisão final cabe a nós."
 INS_volksraad_events.71.t: "A bandeira vermelha e branca não é mais proibida!"
 INS_volksraad_events.71.desc: "A petição foi assinada por [HOL.GetLeader] e agora está oficialmente corroborada. A implementação começará em breve, assim que os detalhes finais forem decididos."
 INS_volksraad_events.100.t: "Moção do Volksraad para permitir subsídios educacionais a residentes não neerlandeses"
 INS_volksraad_events.100.desc: "[INS.GetLeader] aprovou uma petição do Volksraad para permitir que residentes não neerlandeses d[INS.GetNameDef] solicitem subsídios para educação. A petição foi encaminhada a [HOL.GetLeader] para aprovação final."
 INS_volksraad_events.101.t: "Povo [INS.GetAdjective] agora pode solicitar subsídios educacionais"
 INS_volksraad_events.101.desc: "A petição foi assinada por [HOL.GetLeader] e agora está oficialmente corroborada. A implementação começará em breve, assim que os detalhes finais forem decididos."
 ### INS - Dutch Interaction Events
 INS_dutch_events.1.t: "Governo [INS.GetAdjective] solicita o comando de nossa Marinha"
 INS_dutch_events.1.desc: "Após a queda de nossa pátria, o governo [INS.GetAdjective] nos pediu a transferência do comando de nossas forças navais. Eles argumentam que a unificação do comando garantirá maior eficiência neste período sem precedentes."
 INS_dutch_events.1.a: "Se isso fortalecer nossa causa, devemos ceder."
 INS_dutch_events.1.b: "Nossos navios responderão apenas a Haia."
 INS_dutch_events.2.t: "Governo [HOL.GetAdjective] aceita nossa proposta de comando naval"
 INS_dutch_events.2.desc: "O governo [HOL.GetAdjective] aceitou nossa proposta de assumirmos o comando das forças navais conjuntas. A transição está ocorrendo de forma tranquila, com oficiais d[HOL.GetNameDef] e d[INS.GetNameDef] cooperando para fortalecer nossa posição no Pacífico."
 INS_dutch_events.2.a: "Juntos, manteremos o domínio do Pacífico."
 INS_dutch_events.3.t: "Governo [HOL.GetAdjective] rejeita nossa proposta de comando naval"
 INS_dutch_events.3.desc: "O governo [HOL.GetAdjective] rejeitou nossa oferta de estabelecer um comando naval unificado, alegando preocupações logísticas e administrativas. Apesar da frustração, seguimos colaborando por outros canais do esforço de guerra."
 INS_dutch_events.3.a: "Encontraremos outra forma de fortalecer nossa influência naval."
 INS_dutch_events.4.t: "Governo [HOL.GetAdjective] estabelece um programa naval conjunto com [INS.GetNameDef]"
 INS_dutch_events.4.desc: "O governo [HOL.GetAdjective] anunciou a criação do Programa Naval [HOL.GetName]-[INS.GetName], uma iniciativa conjunta para reorganizar e expandir nossas forças marítimas. O conhecimento naval [HOL.GetAdjective], aliado ao contingente [INS.GetAdjective], estabelecerá as bases de uma nova rede de defesa no Pacífico."
 INS_dutch_events.4.a: "Um passo firme rumo à sobrevivência mútua."
 ### INS - Netherlands–Indonesia Union Events
 INS_union_events.1.t: "Governo [HOL.GetAdjective] solicita a transferência do governo para [1058.GetName]"
 INS_union_events.1.desc: "Com a queda da metrópole, os líderes d[HOL.GetNameDef] nos informaram que pretendem transferir seu governo e a família real para [1058.GetName], alegando questões de necessidade e continuidade, além da importância de manter o reino vivo onde quer que sua bandeira ainda esteja hasteada."
 INS_union_events.1.a: "A guerra continuará a partir de [1058.GetName]."
 INS_union_events.1.b: "Quem eles pensam que são? Isso não passa de uma tentativa de restabelecer o domínio colonial!"
 INS_union_events.2.t: "Governo [INS.GetAdjective] aceita a proposta de realocação"
 INS_union_events.2.desc: "O Estado [INS.GetAdjective] aceitou abrigar nosso governo em exílio em [1058.GetName]. Os preparativos para a realocação estão em andamento e ambas as administrações já coordenam a integração de escritórios e funcionários. Juntos, manteremos viva a chama do reino a partir do Oriente."
 INS_union_events.2.a: "Uma frente unida contra nossos inimigos comuns."
 INS_union_events.3.t: "Governo [INS.GetAdjective] recusa a proposta de realocação"
 INS_union_events.3.desc: "O governo [INS.GetAdjective] recusou categoricamente nosso pedido de realocação para [1058.GetName]. [INS.GetLeader] declarou que não temos o direito de exigir tal nível de auxílio, especialmente quando eles já se encontram sobrecarregados."
 INS_union_events.3.a: "Parece que se esqueceram de qual bandeira nos mantém unidos."
 INS_union_events.4.t: "Governo [HOL.GetAdjective] transfere suas forças armadas para [1058.GetName]"
 INS_union_events.4.desc: "Os primeiros transportes chegaram da metrópole: navios com oficiais, soldados e o que restou de nossos arsenais. Como esperado, alguns comboios não alcançaram o porto. O que restou servirá como base para nossas forças em [1058.GetName]."
 INS_union_events.4.a: "O suficiente para manter a bandeira hasteada."
 # INS proposed union
 INS_union_events.5.t: "Governo [INS.GetAdjective] propõe a união Países Baixos-Indonésia"
 INS_union_events.5.desc: "O mundo já notou que a guerra não está a nosso favor. Nosso país caiu e nossa base de operações foi transferida para o Oriente. Ministros d[INS.GetNameDef] apresentaram uma proposta de criação de um Estado conjunto sob a liderança da Rainha Guilhermina, a fim de garantir o máximo de cooperação possível. Embora ninguém pareça particularmente satisfeito com a proposta, ela pode ser a solução para a nossa sobrevivência."
 INS_union_events.5.a: "É um risco que devemos assumir. Vida longa à rainha!"
 INS_union_events.5.b: "Não podemos concordar com isso."
 INS_union_events.6.t: "Governo [HOL.GetAdjective] aceita proposta de união"
 INS_union_events.6.desc: "Após um debate urgente no gabinete, [HOL.GetLeader] aprovou a proposta d[INS.GetNameDef]. O decreto é breve e desprovido de formalidades. Nossos governos passarão a atuar como um só sob a Coroa até o fim da guerra."
 INS_union_events.6.a: "Um acordo histórico para ambas as nações."
 INS_union_events.7.t: "Governo [HOL.GetAdjective] rejeita proposta de união"
 INS_union_events.7.desc: "O conselho d[HOL.GetNameDef] rejeitou a proposta de união. A mensagem foi clara: a cooperação continuará, mas a soberania não será compartilhada."
 INS_union_events.7.a: "De qualquer forma, era improvável que funcionasse."
 # HOL proposed union
 INS_union_events.8.t: "Governo [HOL.GetAdjective] propõe a união Países Baixos-Indonésia"
 INS_union_events.8.desc: "O mundo já notou que a guerra não está a nosso favor. O Estado [HOL.GetAdjective] caiu e sua base de operações foi transferida para o Oriente. Líderes d[HOL.GetNameDef] apresentaram uma proposta de criação de um Estado conjunto sob a liderança da Rainha Guilhermina, a fim de garantir o máximo de cooperação possível. Embora ninguém pareça particularmente satisfeito com a proposta, ela pode ser a solução para a nossa sobrevivência."
 INS_union_events.8.a: "É um esforço necessário."
 INS_union_events.8.b: "Isso não passa de uma tentativa de restabelecer o domínio colonial."
 INS_union_events.9.t: "Governo [INS.GetAdjective] aceita proposta de união"
 INS_union_events.9.desc: "O governo [INS.GetAdjective] aceitou nossa proposta. O futuro permanece incerto, mas devemos manter o foco no esforço de guerra."
 INS_union_events.9.a: "Se precisamos resistir, resistiremos juntos."
 INS_union_events.10.t: "Governo [INS.GetAdjective] rejeita proposta de união"
 INS_union_events.10.desc: "O governo [INS.GetAdjective] rejeitou a proposta de união. O povo e os líderes d[INS.GetNameDef] não acreditam que isso possa funcionar a longo prazo e rejeitam qualquer iniciativa que envolva ceder autoridade."
 INS_union_events.10.a: "De qualquer forma, era improvável que funcionasse."
 # Flags
 INS_exile_accepted_flag: "Está abrigando [HOL.GetNameDef] em exílio"
 INS_hey_btw_you_are_gonna_die_just_know_that_yeah_tt: "§RIsto resultará no fim do jogo para você.§!"
 # Revolution events
 INS_revolution_events.1.t: "Governo [HOL.GetAdjective] avança para destruir a República"
 INS_revolution_events.1.desc: "Como esperado, o governo neerlandês reagiu à nossa exigência de independência enviando soldados para [1058.GetName] e disseminando propaganda antirrepublicana por meio da mídia."
 INS_revolution_events.1.a: "Precisamos agir rapidamente."
 INS_revolution_events.2.t: "Governo [HOL.GetAdjective] solicita ajuda adicional"
 INS_revolution_events.2.desc: "[HOL.GetLeader] convocou uma reunião de emergência com nossos líderes, solicitando apoio extra para reconquistar as Índias e chegando inclusive a propor nossa entrada direta no conflito. [HOL.GetLeader] afirmou que a situação é crítica e que as forças neerlandesas não conseguem conter as milícias revolucionárias. Foi prometido que, em caso de ajuda, receberíamos o controle de Bornéu como recompensa."
 INS_revolution_events.2.a: "Faremos isso por Bornéu."
 INS_revolution_events.2.b: "Não temos interesse."
 INS_revolution_events.3.t: "Governo [ENG.GetAdjective] concorda com o Acordo Londres-Batávia"
 INS_revolution_events.3.desc: "O governo [ENG.GetAdjective] concordou em entrar diretamente no conflito, enviando várias divisões para lutar na Batávia. Embora tenhamos que ceder Bornéu, isso nos dá uma grande vantagem."
 INS_revolution_events.3.a: "Bornéu será um sacrifício necessário."
 INS_revolution_events.4.t: "Governo [ENG.GetAdjective] rejeita o Acordo Londres-Batávia"
 INS_revolution_events.4.desc: "O governo [ENG.GetAdjective] negou-se a prestar mais auxílio no conflito, mesmo diante da urgência e das recompensas oferecidas. [ENG.GetLeader] declarou que, embora seja de seu interesse que preservemos nosso império colonial, o risco de uma escalada global é grande demais, e que cabe a nós enfrentar esse problema sozinhos."
 INS_revolution_events.4.a: "A situação não parece nada boa."
 INS_revolution_events.5.t: "Governo [HOL.GetAdjective] solicita nossa ajuda"
 INS_revolution_events.5.desc: "Os revolucionários nas Índias Orientais Holandesas proclamaram independência d[HOL.GetNameDef] e ocuparam as principais cidades. [HOL.GetLeader] entrou em contato conosco, solicitando apoio militar urgente enquanto uma invasão é preparada."
 INS_revolution_events.5.a: "Se os revolucionários tiverem êxito, cidadãos em nossas colônias poderão tentar o mesmo."
 INS_revolution_events.5.b: "Não temos interesse."
 INS_revolution_events.6.t: "Governo [ENG.GetAdjective] aceita nos ajudar"
 INS_revolution_events.6.desc: "O governo [ENG.GetAdjective] concordou em enviar tropas voluntárias e equipamentos para [1058.GetName], a fim de nos ajudar a retomar o controle das Índias."
 INS_revolution_events.6.a: "Isso será fácil."
 INS_revolution_events.7.t: "Governo [ENG.GetAdjective] recusa-se a ajudar"
 INS_revolution_events.7.desc: "O governo [ENG.GetAdjective] rejeitou nosso pedido de ajuda para retomar o controle das Índias, alegando que o conflito não lhes diz respeito apesar de sua proximidade com a região. Teremos que rearmar o KNIL sozinhos."
 INS_revolution_events.7.a: "Isso é inaceitável!"
 INS_revolution_events.8.t: "Conspiração de milícias revolucionárias nas Índias"
 INS_revolution_events.8.desc: "Nossa polícia colonial nas Índias Orientais prendeu e interrogou diversos membros de um movimento revolucionário emergente na Indonésia. Parece que estão tentando estabelecer uma presença militar para iniciar uma campanha de independência nacional. Não sabemos ao certo, mas podem estar planejando uma revolução armada."
 INS_revolution_events.8.a: "Devemos vigiá-los atentamente."
 INS_revolution_events.9.t: "Declaração de independência da Indonésia"
 INS_revolution_events.9.desc: "[INS.GetLeader] proferiu um discurso hoje em Java, declarando a independência da recém-formada República da Indonésia. Embora não reconheçamos essa nova república, suas milícias ocuparam diversos territórios e nossa polícia não consegue mais controlar essas áreas. Se não tratarmos esta situação com seriedade, podemos estar diante de uma guerra total."
 INS_revolution_events.9.a: "Inaceitável!"
 INS_revolution_events.9.b: "Não vale o esforço. Se desejam tanto a independência, que assim seja."
 #INS_revolution_events.10.t: ""
 #INS_revolution_events.10.desc: ""
 #INS_revolution_events.10.a: ""
 INS_revolution_events.11.t: "Forças militares das Índias impedem a campanha das milícias"
 INS_revolution_events.11.desc: "Um grupo de milícias republicanas lançou uma operação militar para ocupar [?event_target:INS_temp_occupied_state.GetName], mas nossos valentes soldados nas Índias conseguiram repelir as forças milicianas, mantendo o controle total sobre a região."
 INS_revolution_events.11.a: "Mais uma vitória para [HOL.GetNameDef]."
 INS_revolution_events.12.t: "Milícias tentam ocupar [?event_target:INS_temp_occupied_state.GetName]"
 INS_revolution_events.12.desc: "Um grupo de milícias republicanas lançou uma operação militar para ocupar [?event_target:INS_temp_occupied_state.GetName]. Embora nossas forças policiais e militares tenham conseguido controlar a situação, o episódio causou discórdia entre a população local, com muitos civis apoiando as milícias e manifestando-se publicamente contra o governo [HOL.GetAdjective]."
 INS_revolution_events.12.a: "Não podemos permitir que isso se agrave."
 INS_revolution_events.14.t: "Milícias ocupam [?event_target:INS_temp_occupied_state.GetName]"
 INS_revolution_events.14.desc: "Apesar dos esforços de nossa polícia colonial e de nossos soldados, milícias republicanas conseguiram lançar uma operação militar bem-sucedida para ocupar [?event_target:INS_temp_occupied_state.GetName]. Nossas forças foram obrigadas a evacuar e reconheceram a impossibilidade de governar a região diante da resistência das milícias. Se permitirmos que continuem a nos pressionar assim, poderemos perder nossa grande colônia para sempre."
 INS_revolution_events.14.a: "Isso é absurdo!"
 INS_revolution_no_effect_tt: "Nenhum efeito"
 INS_revolution_events.19.t: "Negociações de paz nas Índias"
 INS_revolution_events.19.desc: "[HOL.GetLeader] e [INS.GetLeader] reuniram-se para discutir um possível acordo de paz. [INS.GetLeader] declarou que vidas demais já foram perdidas e propôs uma solução de dois Estados que preservaria as fronteiras atuais, mas com leves ajustes, e encerraria permanentemente os conflitos."
 INS_revolution_events.19.a: "Devemos aceitar. Vidas demais já foram perdidas."
 INS_revolution_events.19.b: "Se deseja tanto a paz, então renda-se!"
 INS_revolution_events.20.t: "Governo [HOL.GetAdjective] concorda com a solução de dois Estados!"
 INS_revolution_events.20.desc: "[INS.GetLeader] retornou de seu encontro com [HOL.GetLeader] com boas notícias. Um acordo de dois Estados foi firmado entre as partes, e iniciaremos imediatamente a movimentação de nossas tropas de acordo com as novas fronteiras. Embora ninguém esteja satisfeito por termos deixado nossos compatriotas indonésios para trás, a decisão de pôr um fim aos conflitos é a melhor possível."
 INS_revolution_events.20.a: "O derramamento de sangue finalmente chegará ao fim."
 INS_revolution_events.21.t: "Governo [HOL.GetAdjective] recusa-se a encerrar o conflito"
 INS_revolution_events.21.desc: "A reunião entre [INS.GetLeader] e [HOL.GetLeader] não saiu como planejado, com ambas as partes visivelmente irritadas e sem disposição para concessões, o que levou ao encerramento antecipado do encontro."
 INS_revolution_events.21.a: "Quantas vidas mais precisarão ser sacrificadas?"
 INS_revolution_events.22.t: "Governo [HOL.GetAdjective] solicita nossa ajuda"
 INS_revolution_events.22.desc: "[HOL.GetLeader] convocou uma reunião com [FRA.GetLeader] em Amsterdã para discutir a situação nas Índias. Durante o encontro, [HOL.GetLeader] explicou que os revolucionários começaram a armar milícias em um ritmo que o Exército neerlandês não consegue acompanhar, colocando em risco a hegemonia colonial d[HOL.GetNameDef]. [HOL.GetLeader.GetHeSheCap] solicitou nossa entrada formal no conflito ao lado dos neerlandeses, com o envio de divisões à Batávia a fim de auxiliar na reconquista das Índias. Em troca, teremos direito à região nordeste de Sumatra assim que a ordem for restabelecida."
 INS_revolution_events.22.a: "Apesar do alto preço, Sumatra pode fazer valer o esforço."
 INS_revolution_events.22.b: "Estão querendo demais de nós."
 INS_revolution_events.23.t: "Governo [FRA.GetAdjective] aceita nos ajudar!"
 INS_revolution_events.23.desc: "O governo [FRA.GetAdjective] respondeu ao nosso apelo e despachou várias divisões francesas para a Batávia com intuito de nos apoiar imediatamente."
 INS_revolution_events.23.a: "Agora a situação está a nosso favor."
 INS_revolution_events.24.t: "Governo [FRA.GetAdjective] recusa-se a ajudar"
 INS_revolution_events.24.desc: "O governo [FRA.GetAdjective] recusou-se a nos auxiliar na revolução, apesar da urgência da situação. Devemos iniciar imediatamente nosso rearmamento, ou logo estaremos em menor número."
 INS_revolution_events.24.a: "A situação não parece nada boa."
 INS_revolution_events.25.t: "O fim da guerra na Indonésia"
 INS_revolution_events.25.desc: "As forças do Estado [HOL.GetAdjective] destruíram as principais bases das milícias e derrubaram o governo republicano. A elite e os comandantes a favor da república foram presos e o governo das Índias está restabelecendo suas operações nos territórios anteriormente controlados pelos republicanos. Como prometido, recebemos o território previamente acordado por nossa participação."
 INS_revolution_events.25.a: "Incrível!"
 INS_revolution_events.26.t: "O fim da guerra na Indonésia"
 INS_revolution_events.26.desc: "As forças do Estado [HOL.GetAdjective] e as milícias republicanas lutaram por muito mais tempo do que ambas as partes antecipavam e [HOL.GetLeader] concordou em assinar um acordo de paz que impõe uma solução de dois Estados. No entanto, como continuamos cumprindo nossa parte do acordo, [HOL.GetLeader] também confirmou que receberemos o território que nos foi prometido."
 INS_revolution_events.26.a: "Bom para a Espanha."
 INS_revolution_events.27.t: "O fim da guerra na Indonésia"
 INS_revolution_events.27.desc: "As forças do Estado [HOL.GetAdjective] e as milícias republicanas lutaram por muito mais tempo do que ambas as partes antecipavam e, apesar dos esforços d[HOL.GetNameDef] e de nosso próprio envolvimento militar, o grande número de milícias e a natureza guerrilheira de suas forças levaram o conflito a um impasse amplamente favorável aos republicanos. Diante disso, [HOL.GetLeader] anunciou hoje a assinatura de um acordo de paz com a República, impondo uma solução de dois Estados em termos favoráveis aos republicanos. O que resta das Índias não passa de uma sombra de sua antiga glória. [HOL.GetLeader] declarou que, como o conflito terminou em derrota, não será capaz de nos conceder o território prometido por nossa contribuição militar."
 INS_revolution_events.27.a: "Isso é loucura!"
 INS_revolution_events.28.t: "A queda das Índias"
 INS_revolution_events.28.desc: "Apesar dos elevados gastos militares d[HOL.GetNameDef] e de nossa contribuição direta no conflito, o grande número de milícias nas Índias conseguiu sobrepujar nossas forças, ocupar todas as principais cidades, derrubar a administração neerlandesa e forçar uma rendição."
 INS_revolution_events.28.a: "Mas nos prometeram um território!"
 INS_revolution_events.29.t: "A queda das Índias"
 INS_revolution_events.29.desc: "Apesar de nossos esforços, os revolucionários nas Índias tomaram o controle de nossas principais cidades e destruíram os alicerces do governo colonial. Nossos generais foram capturados e nossas linhas de comunicação foram cortadas. Não temos escolha senão reconhecer nossa derrota."
 INS_revolution_events.29.a: "Isso é uma tragédia."
 INS_revolution_events.30.t: "[INS.GetLeader] propõe acordo de cessar-fogo local"
 INS_revolution_events.30.desc: "[INS.GetLeader] propôs um cessar-fogo local em [FROM.GetName], prometendo retirar suas tropas do território caso concordemos, permitindo que nossas forças retomem o controle sobre a região. Em contrapartida, teríamos que suspender temporariamente nossas principais operações militares, dando aos revolucionários tempo para se preparar."
 INS_revolution_events.30.a: "Vamos aceitar o acordo."
 INS_revolution_events.30.b: "Recusamos. Retomaremos [FROM.GetName] à força!"
 INS_revolution_events.31.t: "Governo [HOL.GetAdjective] concorda com cessar-fogo em [FROM.GetName]"
 INS_revolution_events.31.desc: "As negociações do cessar-fogo foram bem-sucedidas e [HOL.GetLeader] concordou com nossos termos. Enviamos ordens para que os comandantes das milícias em [FROM.GetName] retirem suas forças imediatamente."
 INS_revolution_events.31.a: "Resta torcer para que mantenham sua palavra."
 INS_revolution_events.32.t: "Governo [HOL.GetAdjective] recusa cessar-fogo"
 INS_revolution_events.32.desc: "As negociações do cessar-fogo não saíram como o planejado e [HOL.GetLeader] se recusou a assinar o acordo, interrompendo as conversas antes que qualquer solução fosse encontrada."
 INS_revolution_events.32.a: "Isso é inaceitável!"
 INS_revolution_events.33.t: "Governo [INS.GetAdjective] solicita mediação"
 INS_revolution_events.33.desc: "Os republicanos indonésios solicitaram formalmente nossa assistência para intermediar um acordo com os neerlandeses. Nossos conselheiros na região relatam que a situação está se agravando rapidamente e que a continuidade das operações militares neerlandesas pode acabar empurrando os nacionalistas para o lado soviético. Os Países Baixos são um aliado valioso na Europa, mas não podemos ignorar as realidades políticas no sudeste asiático. Se a Indonésia se tornar comunista graças à nossa indolência, a responsabilidade recairá sobre nós."
 INS_revolution_events.33.a: "Despache os mediadores."
 INS_revolution_events.33.b: "Não podemos arriscar nossa relação com os neerlandeses."
 INS_revolution_events.34.t: "Governo [FROM.GetAdjective] aceita atuar como mediador"
 INS_revolution_events.34.desc: "Washington aceitou mediar uma conversa entre nosso governo e os neerlandeses. Representantes americanos já estão a caminho e uma proposta formal de cessar-fogo será apresentada. Esta é uma tremenda oportunidade. Com a principal potência mundial conduzindo as negociações, os neerlandeses terão muito mais dificuldade em protelar ou recorrer à força. Cabe a nós manter uma posição firme e permitir que os americanos façam o que sabem fazer de melhor."
 INS_revolution_events.34.a: "Esperamos que os neerlandeses tenham bom senso."
 INS_revolution_events.35.t: "Governo [USA.GetAdjective] anuncia mediação"
 INS_revolution_events.35.desc: "Os americanos entraram na questão da Indonésia. Washington afirma estar atuando como mediador neutro, mas a mensagem é clara. Se não conseguirmos resolver o conflito de maneira satisfatória para eles, utilizarão sua influência contra nós. Nossos negociadores devem agir com cautela. Não podemos nos dar ao luxo de perder a boa vontade americana."
 INS_revolution_events.35.a: "Resolveremos isso em nossos próprios termos."
 INS_revolution_events.36.t: "Governo [USA.GetAdjective] recusa-se a intervir"
 INS_revolution_events.36.desc: "Os americanos rejeitaram nosso pedido de mediação. Washington decidiu apoiar seus aliados europeus e nos deixar sozinhos na luta pela independência. Estamos por conta própria. Sofremos um grande baque, mas a revolução não nasceu da esperança de que potências estrangeiras nos entregassem a liberdade."
 INS_revolution_events.36.a: "Venceremos esta guerra sem eles."
 INS_revolution_events.37.t: "Governo [USA.GetAdjective] emite ultimato"
 INS_revolution_events.37.desc: "Os americanos perderam a paciência. Washington apresentou um ultimato exigindo o fim imediato de todas as operações militares na Indonésia e o reconhecimento da soberania desta. A ameaça é praticamente explícita. Nossa posição na comunidade internacional não sobreviverá a uma ruptura pública com os americanos, e nossa economia não suportará as consequências. Nossos generais dizem que ainda podemos vencer, mas a que custo?"
 INS_revolution_events.37.a: "Não temos escolha senão consentir."
 INS_revolution_events.37.b: "A Indonésia é nossa. Não vamos recuar."
 INS_revolution_events.38.t: "Os neerlandeses cedem"
 INS_revolution_events.38.desc: "Acabou. O governo neerlandês acatou o ultimato americano e reconheceu nossa soberania. Trezentos e cinquenta anos de domínio colonial encerrados não apenas no campo de batalha, mas também na mesa de negociações, com o peso do apoio da maior potência mundial. Finalmente, a república é nossa, completa e incontestavelmente."
 INS_revolution_events.38.a: "Merdeka! Liberdade!"
 INS_revolution_events.39.t: "Os neerlandeses recusam"
 INS_revolution_events.39.desc: "Contra todas as expectativas, os neerlandeses rejeitaram o ultimato americano. Seus generais parecem achar que podem vencer a guerra antes que Washington aja. Eles estão errados. Agora que os americanos se comprometeram abertamente com a nossa causa, a balança de poder mudou drasticamente. Que venham. Não estamos mais sozinhos."
 INS_revolution_events.39.a: "O mundo está do nosso lado."
 INS_revolution_events.40.t: "Os neerlandeses aceitam nossos termos"
 INS_revolution_events.40.desc: "Haia acatou nosso ultimato. As forças neerlandesas na Indonésia recuarão e a soberania será transferida para a república indonésia. É uma conclusão satisfatória para um episódio lamentável. Nossos interesses na região estão muito mais assegurados com uma Indonésia estável e independente do que apoiando uma colônia que os neerlandeses não tinham mais condições de sustentar."
 INS_revolution_events.40.a: "Um resultado racional."
 INS_revolution_events.41.t: "Os neerlandeses nos desafiam"
 INS_revolution_events.41.desc: "Haia rejeitou completamente nosso ultimato. As forças neerlandesas na Indonésia continuam suas operações em uma clara afronta às exigências americanas. É um erro de cálculo grave. Os Países Baixos não podem travar uma guerra colonial na Ásia e, ao mesmo tempo, depender do apoio americano na Europa. Eles nos forçaram a agir."
 INS_revolution_events.41.a: "Que assim seja."
 INS_revolution_events.42.t: "A última aposta"
 INS_revolution_events.42.desc: "Relatórios de nossos serviços de inteligência na Batávia descrevem uma preparação inimiga sem precedentes por parte dos republicanos. Tudo indica que estão organizando uma operação de desestabilização para tomar Java e destruir toda a nossa infraestrutura de comunicações, garantindo assim sua vitória. Contudo, essa operação é extremamente arriscada e exige o comprometimento de quase todos os seus recursos. Nossos generais estimam que eles só conseguirão sustentar essa posição por cerca de dois anos, sem possibilidade de recuo fácil. Se conseguirmos contê-los por tempo suficiente, poderemos esmagar seu governo e sua revolução como se não fossem nada."
 INS_revolution_events.42.a: "Assim começa a batalha final."
 INS_revolution_events.43.t: "Base de milícia em [FROM.GetName] estabelecida"
 INS_revolution_events.43.desc: "Nossos esforços em [FROM.GetName] trouxeram resultados, e a liderança da milícia local confirmou que estão prontos para agir quando chegar o momento."
 INS_revolution_events.43.a: "Devemos continuar nossos esforços."
 # Chaos Events
 INS_chaos_events.1.t: "Batalha em Surabaya"
 INS_chaos_events.1.desc: "Após a declaração de independência, a situação em Surabaya tornou-se instável. Hoje, um grupo de lealistas neerlandeses hasteou a velha bandeira colonial sobre o antigo Hotel Yamato. Jovens pemudas locais invadiram o edifício e removeram as bandeiras, içando em seu lugar a bandeira vermelha e branca da Indonésia. O incidente logo escalou para combates violentos e desorganizados."
 INS_chaos_events.1.a: "Como deveria ser!"
 INS_chaos_events.1.b: "Ordene um cessar-fogo. Não podemos arriscar uma escalada maior."
 INS_chaos_events.2.t: "Partidos socialistas se unem"
 INS_chaos_events.2.desc: "Os dois maiores partidos socialistas da Indonésia, liderados por Amir Sjarifuddin e Sutan Sjahrir, anunciaram hoje sua fusão, formando um Partido Socialista da Indonésia unificado. Isso aumenta significativamente a influência política do partido, potencialmente colocando nossa administração em risco."
 INS_chaos_events.2.a: "Permita a fusão."
 INS_chaos_events.2.b: "Não há tempo para política. Declare lei marcial!"
 INS_chaos_events.3.t: "Atentando frustrado contra Sukarno"
 INS_chaos_events.3.desc: "Uma tentativa de assassinato contra Sukarno foi realizada hoje por um soldado neerlandês, que disparou contra o carro do líder. Felizmente Sukarno não estava no veículo, mas seu motorista ficou gravemente ferido. Embora a tentativa tenha fracassado, está claro que não será a última, seja por parte de soldados neerlandeses ou de opositores indonésios."
 INS_chaos_events.3.a: "Devemos restaurar a ordem!"
 INS_chaos_events.4.t: "Assassinato de Sukarno"
 INS_chaos_events.4.desc: "Hoje a Indonésia foi atingida por uma tragédia. Sukarno sofreu mais uma tentativa de assassinato, desta vez bem-sucedida. Não podemos permitir que isso desencadeie uma crise pela sucessão. A ordem deve ser restaurada rapidamente ou a república entrará em colapso."
 INS_chaos_events.4.a: "O vice-presidente Hatta assumirá o poder."
 INS_chaos_events.4.b: "O Partido Socialista assumirá o poder."
 INS_chaos_events.4.c: "A República será abolida. Tan Malaka nos conduzirá à vitória!"
 # Loyalist Events
 INS_loyalist_events.1.t: "[INS.GetLeader] solicita a transferência de Henri Winkelman"
 INS_loyalist_events.1.desc: "[INS.GetLeader] entrou em contato conosco a respeito dos atuais conflitos ao redor do mundo e da posição delicada em que o Estado [INS.GetAdjective] se encontra. [INS.GetLeader.GetHeSheCap] propôs que Henri Winkelman, ex-comandante do Exército Real das Índias Orientais Neerlandesas, seja formalmente transferido de volta ao país, a fim de garantir a segurança da colônia."
 INS_loyalist_events.1.a: "Providenciaremos sua transferência imediata."
 INS_loyalist_events.1.b: "Henri Winkelman é necessário na metrópole."
 INS_loyalist_events.2.t: "[HOL.GetLeader] aceita a transferência de Henri Winkelman"
 INS_loyalist_events.2.desc: "[INS.GetLeader] retornou d[HOL.GetNameDef], onde se encontrou com [HOL.GetLeader]. O encontro correu bem, e [HOL.GetLeader] entendeu a situação e aceitou a transferência imediata de Winkelman. Ele já está a caminho de [1058.GetName], onde aguardará nossas ordens."
 INS_loyalist_events.2.a: "Será de grande ajuda."
 INS_loyalist_events.3.t: "[HOL.GetLeader] rejeita a transferência de Henri Winkelman"
 INS_loyalist_events.3.desc: "[INS.GetLeader] retornou d[HOL.GetNameDef], onde se encontrou com [HOL.GetLeader]. Infelizmente, Henri Winkelman não será enviado às Índias e teremos que nos defender sem ele."
 INS_loyalist_events.3.a: "Precisamos traçar um novo plano com urgência."
 INS_henri_winkelman_tt: "Transferência de Henri Winkelman recusada"
 # MALAYA CHAIN - Independent Malaya
 INS_loyalist_events.4.t: "Governo [FROM.GetAdjective] propõe a unificação"
 INS_loyalist_events.4.desc: "Uma delegação do governo [FROM.GetAdjective] chegou em [ROOT.Capital.GetCapitalVictoryPointName] com uma proposta de unificação. Eles ressaltam a herança malaia compartilhada de nossos povos e lembram que as fronteiras atuais entre nossas nações foram estabelecidas por administradores coloniais europeus, e não pelos habitantes da região. A proposta prevê a dissolução de ambos os governos e sua reorganização em um único Estado."
 INS_loyalist_events.4.a: "Aceitamos a proposta."
 INS_loyalist_events.4.b: "Devemos recusar."
 INS_loyalist_events.5.t: "Governo [From.GetAdjective] aceita a unificação"
 INS_loyalist_events.5.desc: "Nossos diplomatas retornaram de [FROM.Capital.GetCapitalVictoryPointName] com excelentes notícias: o governo [FROM.GetAdjective] aceitou nossa proposta e seus representantes já estão providenciando os preparativos para a integração de seus territórios à nossa administração."
 INS_loyalist_events.5.a: "Juntos somos mais fortes!"
 INS_loyalist_events.6.t: "Governo [FROM.GetAdjective] rejeita a unificação"
 INS_loyalist_events.6.desc: "Nossos diplomatas retornaram de [FROM.Capital.GetCapitalVictoryPointName] de mãos vazias. O governo [FROM.GetAdjective] não se mostrou disposto a considerar a proposta, oferecendo justificativas vagas e enviando nossa delegação de volta com pouco mais do que meras cortesias."
 INS_loyalist_events.6.a: "Azar o deles."
 # MALAYA CHAIN - Subject Malaya (Overlord receives)
 INS_loyalist_events.7.t: "Governo [FROM.GetAdjective] exige um referendo n[MAL.GetNameDef]"
 INS_loyalist_events.7.desc: "O governo [FROM.GetAdjective] solicitou formalmente que autorizemos um referendo n[MAL.GetNameDef] sobre a unificação com seu Estado. O embaixador foi direto quanto ao provável resultado, afirmando que o povo malaio de ambos os lados da fronteira se considera uma só nação. É quase certo que permitir tal votação significará o fim d[MAL.GetNameDef]."
 INS_loyalist_events.7.a: "Deixe o povo decidir."
 INS_loyalist_events.7.b: "Não permitiremos isso."
 # MALAYA CHAIN - Subject Malaya (MAL receives after overlord agrees)
 INS_loyalist_events.8.t: "Governo [FROM.GetAdjective] aprova referendo de unificação"
 INS_loyalist_events.8.desc: "Nosso soberano concedeu ao governo [FROM.FROM.GetAdjective] permissão para realizar um referendo em nosso país. Ativistas d[FROM.FROM.GetNameDef] chegaram em peso e a votação acontecerá dentro de um mês. A questão apresentada ao nosso povo é simples: queremos nos unir ao Estado [FROM.FROM.GetAdjective] ou manter nossa condição atual?"
 INS_loyalist_events.8.a: "Vamos nos unir a eles."
 INS_loyalist_events.8.b: "É melhor ficar como estamos."
 # MALAYA CHAIN - Overlord informed of MAL's choice
 INS_loyalist_events.9.t: "Estado [FROM.GetAdjective] vota contra a unificação"
 INS_loyalist_events.9.desc: "O referendo n[FROM.GetNameDef] foi concluído e o povo [FROM.GetAdjective] decidiu continuar sob nossa administração. Os ativistas d[FROM.FROM.GetNameDef] deixaram o país."
 INS_loyalist_events.9.a: "Como esperado."
 INS_loyalist_events.10.t: "Estado [FROM.GetAdjective] vota a favor da unificação"
 INS_loyalist_events.10.desc: "O referendo n[FROM.GetNameDef] foi concluído com uma votação decisiva em favor da unificação com [FROM.FROM.GetNameDef]. Nossos administradores na região relatam que o resultado já era esperado. Somos obrigados a respeitá-lo."
 INS_loyalist_events.10.a: "Nós demos nossa palavra."
 # MALAYA CHAIN - INS receives result
 INS_loyalist_events.11.t: "Sucesso no referendo malaio"
 INS_loyalist_events.11.desc: "O povo [MAL.GetAdjective] votou pela união com nossa nação. Oficiais d[MAL.GetNameDef] estão cooperando com a nossa administração para iniciar o processo de transferência de autoridade. Haverá uma fronteira a menos no mapa do mundo malaio."
 INS_loyalist_events.11.a: "Boas-vindas ao lar."
 INS_loyalist_events.12.t: "Unificação malaia rejeitada"
 INS_loyalist_events.12.desc: "Nossa proposta de unificação com [MAL.GetNameDef] foi rejeitada. O governo [MAL.GetAdjective], ou seus superiores, decidiu contra. Teremos de retomar o assunto em um momento mais oportuno."
 INS_loyalist_events.12.a: "Não nos esqueceremos disso."
 INS_loyalist_events.13.t: "Governo [FROM.GetAdjective] propõe um acordo sobre Singapura"
 INS_loyalist_events.13.desc: "O governo [FROM.GetAdjective] nos apresentou uma proposta referente a Singapura. Eles solicitam a soberania sobre a ilha, citando sua posição dentro do mundo malaio. Em contrapartida, estão dispostos a garantir nosso acesso contínuo ao porto, às instalações militares e a todos os direitos de extração de recursos atualmente em vigor."
 INS_loyalist_events.13.a: "Um acordo justo."
 INS_loyalist_events.13.b: "Singapura não está à venda."
 INS_loyalist_events.14.t: "Acordo sobre Singapura aceito"
 INS_loyalist_events.14.desc: "O acordo foi aceito. Passaremos a controlar Singapura, enquanto os antigos administradores mantêm o acesso militar e comercial ao porto. Nossa bandeira agora tremula sobre um dos portos mais importantes da Ásia."
 INS_loyalist_events.14.a: "Os estreitos são nossos."
 INS_loyalist_events.15.t: "Acordo sobre Singapura é rejeitado"
 INS_loyalist_events.15.desc: "Nossa proposta foi rejeitada. Os administradores de Singapura não estão dispostos a abrir mão da ilha sob quaisquer circunstâncias. Oferecemos tudo exceto a manutenção da soberania, e ainda assim não foi suficiente."
 INS_loyalist_events.15.a: "Que assim seja."
 INS_loyalist_events.16.t: "Governo [FROM.GetAdjective] solicita a transferência do Ceilão"
 INS_loyalist_events.16.desc: "O governo [FROM.GetAdjective] apresentou um pedido formal para a transferência do Ceilão. Seus diplomatas citam laços comerciais e étnicos de longa data entre a ilha e o mundo malaio. Sinceramente, é uma reivindicação mal fundamentada, mas o Estado [FROM.GetAdjective] tornou-se poderoso o suficiente para que tais solicitações sejam levadas a sério."
 INS_loyalist_events.16.a: "Pois bem, que fiquem com o território."
 INS_loyalist_events.16.b: "O Ceilão permanecerá sob nosso controle."
 INS_loyalist_events.17.t: "O Ceilão é transferido"
 INS_loyalist_events.17.desc: "A transferência do Ceilão está concluída. Nossa administração começou a deslocar oficiais para a ilha e o processo ocorreu sem incidentes. Agora controlamos posições em ambos os lados do estreito."
 INS_loyalist_events.17.a: "Excelente."
 INS_loyalist_events.18.t: "Transferência do Ceilão negada"
 INS_loyalist_events.18.desc: "Nosso pedido pela transferência do Ceilão foi negado. Os atuais controladores não têm intenção de abrir mão da ilha e nossos diplomatas afirmam que insistir na questão não alteraria o resultado."
 INS_loyalist_events.18.a: "Quem sabe em uma próxima oportunidade."
 INS_loyalist_events.19.t: "Governo [FROM.GetAdjective] exige um referendo em Papua"
 INS_loyalist_events.19.desc: "O governo [FROM.GetAdjective] exigiu que seja realizado um referendo em Papua Oriental. Do lado [FROM.GetAdjective] da fronteira, há novas estradas atravessando a selva, clínicas com médicos do governo e escolas ensinando nas línguas locais. Do nosso lado, o último governador visitou Porto Moresby apenas duas vezes em três anos. O embaixador [FROM.GetAdjective] não precisou acrescentar muito mais do que isso."
 INS_loyalist_events.19.a: "Que realizem sua votação."
 INS_loyalist_events.19.b: "Não permitiremos isso."
 INS_loyalist_events.20.t: "Referendo em Papua é aprovado"
 INS_loyalist_events.20.desc: "Os australianos concordaram em realizar o referendo. Todos os distritos de Papua Oriental apresentaram o mesmo resultado. Nosso investimento na metade ocidental da ilha falou mais alto do que qualquer campanha poderia."
 INS_loyalist_events.20.a: "A ilha finalmente é uma só."
 INS_loyalist_events.21.t: "Referendo em Papua é negado"
 INS_loyalist_events.21.desc: "Os australianos recusaram. Seu governador em Porto Moresby emitiu uma declaração classificando o pedido como uma afronta à soberania australiana. O povo papuásio sequer foi ouvido."
 INS_loyalist_events.21.a: "Nós nos lembraremos disso."
 INS_loyalist_events.22.t: "Governo [FROM.GetAdjective] exige o Timor-Leste"
 INS_loyalist_events.22.desc: "O governo [FROM.GetAdjective] apresentou uma exigência formal pela rendição do Timor-Leste. Seu embaixador destacou que nossa guarnição no território conta com menos de 200 homens e que Lisboa praticamente não destina recursos à região há anos. Em seguida questionou o que exatamente acreditamos estar defendendo."
 INS_loyalist_events.22.a: "Não vale a pena lutar por isso."
 INS_loyalist_events.22.b: "O Timor é nosso e continuará sendo."
 INS_loyalist_events.23.t: "Timor-Leste se rende"
 INS_loyalist_events.23.desc: "Os administradores do Timor-Leste começaram a se retirar de sua guarnição e a desmantelar a administração colonial. Em breve toda a ilha estará sob autoridade do Estado [INS.GetAdjective]."
 INS_loyalist_events.23.a: "Como deveria ser."
 INS_loyalist_events.24.t: "Exigência pelo Timor-Leste rejeitada"
 INS_loyalist_events.24.desc: "O governador colonial em Díli nos escreveu pessoalmente para rejeitar nossa exigência, insistindo que o Timor-Leste continuará sendo um território soberano de sua administração. Nosso Estado-Maior elaborou planos de contingência caso o gabinete decida prosseguir com o assunto."
 INS_loyalist_events.24.a: "Inicie os preparativos."
 INS_loyalist_events.25.t: "Governo [FROM.GetAdjective] propõe a unificação"
 INS_loyalist_events.25.desc: "Uma delegação do governo [FROM.GetAdjective] apresentou uma proposta para unificar nossas duas repúblicas. Eles alegam que nossos povos compartilham raízes austronésias comuns muito anteriores às fronteiras coloniais que hoje nos separam, e que um único Estado abrangendo o arquipélago seria a principal potência do sudeste asiático. Aceitá-la significaria dissolver nosso governo e nos integrarmos ao deles."
 INS_loyalist_events.25.a: "Aceitamos."
 INS_loyalist_events.25.b: "Lutamos muito por esta república."
 INS_loyalist_events.26.t: "Governo [From.GetAdjective] aceita a unificação"
 INS_loyalist_events.26.desc: "O governo [FROM.GetAdjective] aceitou nossa proposta. Seus oficiais já estão coordenando ações com os nossos para iniciar o processo de integração. De Achém a Lução, de Bornéu a Mindanau, nossa nação agora se estende por todo o arquipélago malaio."
 INS_loyalist_events.26.a: "Uma nova era se inicia."
 INS_loyalist_events.27.t: "Governo [FROM.GetAdjective] rejeita a unificação"
 INS_loyalist_events.27.desc: "O governo [FROM.GetAdjective] recusou nossa proposta. A luta e as dificuldades enfrentadas para conquistar a independência deles ainda são muito recentes, impedindo a renúncia de sua soberania para outro Estado. A proposta foi arquivada."
 INS_loyalist_events.27.a: "Uma pena."
 INS_loyalist_events.28.t: "Governo [FROM.GetAdjective] solicita um referendo n[PHI.GetNameDef]"
 INS_loyalist_events.28.desc: "O governo [FROM.GetAdjective] apresentou um pedido formal para a realização de um referendo n[PHI.GetNameDef] acerca da unificação. Seus diplomatas destacam a ancestralidade austronésia compartilhada entre os povos e a natureza artificial das fronteiras coloniais que os separam. Se o referendo acontecer, é provável que o resultado favoreça [FROM.GetNameDef]."
 INS_loyalist_events.28.a: "A voz do povo deve ser ouvida."
 INS_loyalist_events.28.b: "Fora de questão."
 INS_loyalist_events.29.t: "Referendo de unificação aprovado"
 INS_loyalist_events.29.desc: "O governo [FROM.FROM.GetAdjective] propôs a unificação de nossas duas nações com base na herança austronésia compartilhada. Nosso soberano concedeu permissão para a realização do referendo e os ativistas d[FROM.FROM.GetNameDef] já começaram a chegar. O resultado determinará se nossa república manterá sua estrutura atual ou se unirá ao Estado [FROM.FROM.GetAdjective]."
 INS_loyalist_events.29.a: "Esta é uma proposta interessante."
 INS_loyalist_events.29.b: "De forma alguma."
 INS_loyalist_events.30.t: "Estado [FROM.GetAdjective] vota contra a unificação"
 INS_loyalist_events.30.desc: "As urnas foram apuradas e os ativistas do Estado [FROM.FROM.GetAdjective] retornaram para casa. O povo [FROM.GetAdjective] decidiu ficar. Ao que parece a independência ainda tem valor em [FROM.Capital.GetCapitalVictoryPointName]."
 INS_loyalist_events.30.a: "O assunto está encerrado."
 INS_loyalist_events.31.t: "Estado [FROM.GetAdjective] vota a favor da unificação"
 INS_loyalist_events.31.desc: "As urnas foram apuradas. O povo [FROM.GetAdjective] escolheu [FROM.FROM.GetNameDef] em vez de nós, e a margem não foi apertada. Nossos administradores já estão recebendo instruções para iniciar a transferência de poder."
 INS_loyalist_events.31.a: "O povo se pronunciou."
 INS_loyalist_events.32.t: "Estado [PHI.GetAdjective] vota pela unificação"
 INS_loyalist_events.32.desc: "O referendo [PHI.GetAdjective] foi concluído em nosso favor. Seu governo aceitou o resultado e iniciou contato com nosso Ministério das Relações Exteriores para organizar a transferência de autoridade."
 INS_loyalist_events.32.a: "Enfim, juntos."
 INS_loyalist_events.33.t: "Estado [PHI.GetAdjective] rejeita a unificação"
 INS_loyalist_events.33.desc: "O governo [PHI.GetAdjective] rejeitou nossa proposta de unificação. Seu parlamento votou contra sem sequer conceder uma segunda leitura. Oferecemos a eles um lugar na maior nação do sudeste asiático, e eles o desprezaram."
 INS_loyalist_events.33.a: "Nada mais do que um revés."
 INS_communist_events.6.t: "Agentes do Estado [FROM.GetAdjective] incitam agitação n[ROOT.GetNameDef]"
 INS_communist_events.6.desc: "Nossos serviços de inteligência confirmaram o que há muito suspeitávamos: o Estado [FROM.GetAdjective] vem conduzindo uma campanha contínua de subversão dentro de nossas fronteiras, financiando células radicais, distribuindo panfletos revolucionários e organizando greves entre os trabalhadores. Seus agentes infiltraram-se em sindicatos e cooperativas rurais e agora passam a clamar abertamente pela derrubada de nosso governo. A situação atingiu um ponto crítico e devemos agir com firmeza antes que saia do controle."
 INS_communist_events.6.a: "Não podemos tolerar isso!"
 INS_communist_events.7.t: "Subversão comunista n[FROM.GetNameDef]"
 INS_communist_events.7.desc: "Relatórios preocupantes chegaram até nós vindos d[FROM.FROM.GetNameDef]. Agentes atuando em nome d[FROM.GetNameDef] têm fomentado sentimentos revolucionários entre a população local, explorando insatisfações com nossa administração para ampliar o apoio a uma tomada de poder comunista. Se nada for feito, o Estado [FROM.FROM.GetAdjective] pode cair nas mãos dos radicais e o problema pode se espalhar para outros de nossos territórios."
 INS_communist_events.7.a: "Devemos erradicar isso antes que se alastre!"
 INS_communist_events.8.t: "Propaganda do governo [FROM.GetAdjective] circulando n[ROOT.GetNameDef]"
 INS_communist_events.8.desc: "Panfletos e folhetos vindos d[FROM.GetNameDef] têm surgido com maior frequência em nossas fábricas, mercados e universidades. Pregam o evangelho da luta de classes e prometem libertação por meio da revolução e, segundo relatos da polícia, estão encontrando uma audiência receptiva entre os insatisfeitos. O material é simples, eficaz e sua disseminação não demonstra sinais de desaceleração."
 INS_communist_events.8.a: "Identifique os responsáveis por essa imundície!"
 ## Call for Revolution - Main Event (sent to target) ##
 INS_communist_events.1.t: "Revolução n[ROOT.GetNameDef]"
 INS_communist_events.1.desc: "A situação saiu do controle. Meses de agitação promovida pel[FROM.GetNameDef] surtiram efeito e o movimento comunista n[ROOT.GetNameDef] já não pode ser contido por meios convencionais. Greves gerais paralisaram as cidades, partisans armados controlam províncias inteiras e o governo [FROM.GetAdjective] apoia abertamente os revolucionários. Nossas forças de segurança estão sobrecarregadas e sua lealdade tornou-se incerta. Devemos decidir agora se lutaremos pela sobrevivência do Estado ou se aceitaremos o inevitável antes que mais sangue seja derramado."
 INS_communist_events.1.a: "Mobilizem o Exército. Não cairemos sem lutar."
 INS_communist_events.1.b: "Resistir só trará mais ruína ao nosso povo."
 INS_communist_events.1.c: "Se lhes dermos voz no governo, talvez ainda possamos controlar a situação."
 ## Civil War Chosen - sent to Indonesia ##
 INS_communist_events.2.t: "Governo [FROM.GetAdjective] decide lutar"
 INS_communist_events.2.desc: "O governo d[FROM.GetNameDef] recusou-se a ceder e ordenou que suas forças armadas reprimam o movimento revolucionário pelo uso da força. Nossos camaradas já estão se posicionando e ocupando pontos estratégicos. A batalha será longa, mas o povo [FROM.GetAdjective] fez sua escolha e nós estaremos ao seu lado."
 INS_communist_events.2.a: "A revolução avança."
 ## Surrender - sent to Indonesia ##
 INS_communist_events.3.t: "A queda d[FROM.GetNameDef]"
 INS_communist_events.3.desc: "O antigo governo d[FROM.GetNameDef] capitulou. Diante da magnitude do movimento revolucionário e da certeza de que o Estado [ROOT.GetAdjective] o apoiava, não encontraram outro caminho senão a rendição. O poder foi transferido para o partido comunista local e o novo governo já está buscando nossa orientação. Mais uma nação foi libertada do domínio da velha ordem."
 INS_communist_events.3.a: "Uma grande vitória para os trabalhadores do mundo."
 ## Civil War in Subject - sent to overlord ##
 INS_communist_events.4.t: "Guerra civil eclode n[FROM.GetNameDef]"
 INS_communist_events.4.desc: "Revolucionários comunistas, armados e organizados com o apoio d[FROM.FROM.GetNameDef], lançaram uma insurreição aberta n[FROM.GetNameDef]. A administração colonial perdeu o controle de vastas porções do território e o governador relata que a guarnição local é incapaz de restaurar a ordem sem reforços."
 INS_communist_events.4.a: "Enviem as tropas. O território [FROM.GetAdjective] é nosso!"
 ## Subject Surrendered - sent to overlord ##
 INS_communist_events.5.t: "Estado [FROM.GetAdjective] na mão dos comunistas"
 INS_communist_events.5.desc: "A administração n[FROM.GetNameDef] rendeu-se aos insurgentes comunistas sem oferecer resistência. O governador e sua equipe foram colocados sob custódia, nossa bandeira foi arriada e um governo revolucionário foi proclamado em seu lugar. Tudo isso foi orquestrado pel[FROM.FROM.GetNameDef] e seus agentes, que há meses vinham trabalhando para minar nossa autoridade na região. Isso é um verdadeiro roubo e não ficará impune."
 INS_communist_events.5.a: "Isso é um ultraje!"
 # Cooperate with Revolutionaries (sent to target)
 INS_communist_events.9.t: "Oficiais do Estado [FROM.GetAdjective] vistos com dissidentes"
 INS_communist_events.9.desc: "Agentes do Estado [FROM.GetAdjective] foram vistos na companhia de agitadores conhecidos e líderes militantes em várias partes do país. Estudantes que antes distribuíam panfletos nas esquinas agora realizam reuniões a portas fechadas com homens portando documentos diplomáticos d[FROM.GetNameDef]. Publicações proibidas estão sendo impressas mais rápido do que a polícia consegue apreendê-las e protestos que antes se dissipavam em poucas horas agora paralisam distritos inteiros por dias. Os comunistas estão aprendendo a se organizar em grupos maiores a cada dia e, se não agirmos rapidamente, poderemos perder o controle."
 INS_communist_events.9.a: "Eliminem esses agentes estrangeiros de uma vez!"
 # Spread Anti-Colonialist Sentiment (sent to subject target)
 INS_communist_events.10.t: "Retórica do Estado [FROM.GetAdjective] ganha força"
 INS_communist_events.10.desc: "Panfletos d[FROM.GetNameDef] têm circulado nos quartéis e na administração civil, e os esforços de apreensão surtiram pouco efeito. O material fala de nações livres, de povos que se desvencilharam de seus governadores coloniais e construíram algo próprio. Seria mais fácil suprimir tais ideias se não soassem tão verdadeiras. Até mesmo funcionários leais começaram a questionar, discretamente, se o sistema atual serve ao nosso povo ou apenas aos nossos soberanos."
 INS_communist_events.10.a: "Devemos agir com cautela."
