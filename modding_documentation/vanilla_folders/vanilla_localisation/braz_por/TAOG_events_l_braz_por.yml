 ### INS News
 taog_news.1.t: "O despertar da União Neerlando-Indonésia"
 taog_news.1.desc: "A Rainha Guilhermina fez ontem um anúncio em [1058.GetName], proclamando a inesperada criação de um Estado da União Neerlando-Indonésia. Com a pátria sob ocupação, o governo [HOL.GetAdjective] no exílio e a administração do Estado [INS.GetAdjective] concordaram em governar como um só órgão sob a Coroa. Oficiais de ambos os países afirmaram que a decisão não foi uma escolha, mas sim necessidade, parte de um esforço desesperado para preservar a união e a autoridade do Reino em dois continentes."
 taog_news.1.a: "Um desenvolvimento interessante."
 taog_news.2.t: "A declaração de independência da Indonésia"
 taog_news.2.desc: "[INS.GetLeader], líder d[INS.GetNameDef], realizou hoje um discurso em Java, proclamando a independência da recém-formada República da Indonésia. Embora o governo [HOL.GetAdjective] rejeite a legitimidade dessa soberania, milícias republicanas já exercem controle sobre determinados territórios."
 taog_news.2.a: "Isso pode desencadear uma grande mudança global."
 ############
 ### SIAM ###
 ############
 siam.1.t: "[SIA_phraya_phahon.GetName] envolvido em escândalo"
 siam.1.desc: "[SIA_phraya_phahon.GetName] é acusado de vender propriedades da Coroa a oficiais por valores abaixo do mercado, um escândalo que reduziu significativamente sua legitimidade na Assembleia Popular. Tudo indica que sua influência está chegando ao fim."
 siam.1.a: "Talvez isso abra caminho para outra pessoa."
 #Spmgsiradet rebellion historical
 siam.2.t: "Terceiro atentado contra a vida de [SIA_plaek_phibunsongkhram.GetName]"
 siam.2.desc: "Uma mensagem do correspondente da Reuters em Bangkok revela que houve uma terceira tentativa, em quatro anos, de envenenar o primeiro-ministro do Sião, Sr. Phibul Songgram.\nSegundo relatos, veneno foi misturado à comida na semana anterior, afetando o Sr. Songgram, sua esposa e sua filha.\nO secretário de Relações Exteriores britânico, Lorde Halifax, manifestou choque diante da tentativa covarde e alívio pelo primeiro-ministro ter sobrevivido." #https://trove.nla.gov.au/newspaper/article/47990695
 siam.2.a: "Quem poderia ter feito isto?"
 siam.3.t: "Phraya Songsuradet exilado"
 siam.3.desc: "Phraya Songsuradet é acusado de ter sido o mandante por trás de uma ou mais tentativas de assassinato contra [SIA_plaek_phibunsongkhram.GetName], além de conspirar para organizar um golpe contra seu governo. Por determinação oficial, Phraya Songsuradet será destituído de seu comando, terá suas patentes e títulos revogados, será forçado a se aposentar das forças armadas sem pensão e expulso do país.\nCríticos afirmam que se trata de um expurgo velado, promovido por [SIA_plaek_phibunsongkhram.GetName] para eliminar seu principal rival, mas tais alegações são claramente caluniosas."
 siam.3.a: "Um triste fim."
 siam.4.t: "Prisão de simpatizantes de Songsuradet"
 siam.4.desc: "Nas primeiras horas da manhã, com o apoio da Polícia Real Tailandesa, o governo prendeu mais 51 suspeitos e simpatizantes, incluindo o Príncipe Rangsit, Phraya Thepahatsadin e Phraya Udom Pongphensawad. Eles são acusados de conspirar com Phraya Songsuradet contra o Estado. Destaque especial para Rangsit, que é membro da família real e enfrentará julgamento. Alguns analistas sugerem que o príncipe foi especificamente visado como forma de enviar um recado aos membros da realeza que permanecem n[THIS.GetNameDef]: obedeçam ou sofram as consequências."
 siam.4.a: "A trama se complica."
 siam.5.t: "A rebelião dos 18 cadáveres"
 siam.5.desc: "Um tribunal especial foi criado por Phibul para julgar os 51 envolvidos na rebelião. Desses, 25 foram condenados à prisão perpétua e 21 à execução por fuzilamento. Entre os 21 condenados, três receberão perdão em virtude de seus serviços honrosos, entre eles o Príncipe Rangsit e Phraya Thepahatsadin."
 siam.5.a: "Esse assunto está resolvido."
 #Songsuradet rebellion alternative
 siam.6.t: "O impasse de Songsuradet"
 siam.6.desc: "Phraya Songsuradet é acusado de ter sido o mandante por trás de uma ou mais tentativas de assassinato contra [SIA_plaek_phibunsongkhram.GetName], além de conspirar para organizar um golpe contra seu governo. Por determinação oficial, Songsuradet será destituído do comando e exilado.\nNo entanto, sua prisão foi impedida por militares leais a ele, que alegaram que o ato não passava de uma manobra política. O governo e a camarilha militar de Songsuradet encontram-se agora em um impasse, no qual ambos se recusam a ceder."
 siam.6.a: "Jamais recuaremos."
 siam.6.b: "O plano falhou. Vamos recuar."
 siam.7.t: "Songsuradet busca apoio da Marinha"
 siam.7.desc: "À medida que o tenso impasse entre as forças do governo e a camarilha militar de Songsuradet continua, investigadores governamentais começaram a ouvir rumores de que uma aliança entre a Marinha Real e Songsuradet foi formada com o objetivo explícito de conter o crescente autoritarismo de Phibun.\nAlém disso, assessores da Casa Real relataram que representantes de Songsuradet se reuniram com príncipes de alta patente, aumentando os temores de que a realeza também possa se alinhar à oposição."
 siam.7.a: "Somos o governo, não cederemos à chantagem!"
 siam.7.b: "Isso está saindo de controle. É melhor recuar."
 #alt-hist actual rebellion
 siam.8.t: "A rebelião de Songsuradet"
 siam.8.desc: "Com respaldo político e militar consolidado, a camarilha militar de Songsuradet, aliada à Marinha, expandiu seu domínio sobre vastas regiões d[THIS.GetNameDef]. Nas primeiras horas da manhã, tiros ecoaram nos subúrbios de Bangkok e todo o país parece à beira de uma guerra civil em larga escala entre o governo e os seguidores de Songsuradet."
 siam.8.a: "O governo deve sobreviver."
 #alt-hist actual rebellion
 siam.9.t: "O fim da rebelião de Songsuradet"
 siam.9.desc: "A rebelião foi esmagada e, após a captura de Songsuradet, resta apenas seu julgamento – que, a essa altura, não passa de uma mera formalidade. A conspiração foi descoberta não apenas no Exército e na Marinha, mas também entre a realeza, com o Príncipe Rangsit demonstrando apoio aberto aos rebeldes. Um amplo expurgo contra os dissidentes tornou-se inevitável."
 siam.9.a: "É hora de reconstruir."
 #Attack Indochina
 siam.10.t: "Vitória!"
 siam.10.desc: "O inimigo está em retirada e a vitória parece garantida. Com o território sob nosso controle, as velhas forças imperialistas devem estar tremendo de medo. Como podem ter perdido? É um sinal de nossa providência divina."
 siam.10.a: "Pel[ROOT.GetNameDef]!"
 siam.10.b: "Na verdade, as coisas estão indo muito bem."
 siam.11.t: "Avanço estratégico [FROM.GetAdjective]"
 siam.11.desc: "De maneira inesperada, o exército [FROM.GetAdjective] conseguiu superar nossas forças e tomou o controle da região contestada. Tal ocupação enfraqueceu nossa autoridade e colocou em xeque nossa legitimidade sobre o território. Prosseguir com o conflito arriscaria minar ainda mais a disciplina e a confiança, mas ceder a região seria uma admissão pública de fracasso."
 siam.11.a: "Precisamos minimizar os prejuízos e recuar."
 siam.11.b: "Não abandonaremos o que é nosso por direito!"
 siam.12.t: "Governo [FROM.GetAdjective] aceita a derrota"
 siam.12.desc: "Nossa campanha foi um sucesso. A resistência inimiga ruiu e o governo [FROM.GetAdjective] renunciou formalmente ao controle das terras disputadas para evitar mais devastação. Por ora, essa vitória eleva nossa posição e assegura nossas fronteiras."
 siam.12.a: "Nossa força é inegável."
 siam.13.t: "Governo [FROM.GetAdjective] recusa qualquer tipo de acordo"
 siam.13.desc: "O governo [FROM.GetAdjective] rejeitou todas as propostas que envolviam concessões territoriais, classificando-as como inaceitáveis. Sua liderança declarou que apenas a destruição de nosso Estado encerrará o conflito."
 siam.13.a: "Que assim seja."
 siam.14.t: "Governo [FROM.GetAdjective] adota a guerra total"
 siam.14.desc: "O governo [FROM.GetAdjective] abandonou qualquer pretensão de negociação. Sua intenção é clara: conquistar e absorver totalmente nossa nação. Esta guerra não será decidida por tratados, mas pela vitória total ou colapso absoluto."
 siam.14.a: "Sem concessões, sem rendição."
 siam.15.t: "Ataque [SIA.GetAdjective] estagna"
 siam.15.desc: "A rápida investida das forças do exército [SIA.GetAdjective] nos pegou desprevenidos, mas seu avanço já se desfaz sob pressão, tornando evidente suas fraquezas. O que deveria ser uma campanha rápida transformou-se em um fardo extenuante para suas tropas. Podemos escolher a clemência e oferecer-lhes uma saída por meio de concessões, mas cabe a nós decidir se a misericórdia é melhor para os nossos interesses do que a vitória total e absoluta."
 siam.15.a: "Ofereça concessões."
 siam.15.b: "Apenas a vitória total é aceitável."
 siam.16.t: "Ofensiva estagnada"
 siam.16.desc: "Nossa ofensiva estagnou, e pior ainda é o fato de que o inimigo está ciente disso. Eles nos enviaram um ultimato: rendição imediata com perdas mínimas, ou continuar na guerra com ainda mais derramamento de sangue. A única diferença será o número de mortos a enterrar."
 siam.16.a: "Escolhemos a paz."
 siam.16.b: "Nunca nos renderemos!"
 siam.17.t: "Governo [FROM.GetAdjective] recusa rendição"
 siam.17.desc: "O governo [FROM.GetAdjective] declarou, sem deixar margem para dúvidas, que preferiria ver todo o seu país em chamas a ceder um centímetro sequer de território para nós. A guerra continua."
 siam.17.a: "Eles terão o que desejam."
 siam.18.t: "Governo [FROM.GetAdjective] busca nossa capitulação!"
 siam.18.desc: "Comunicações interceptadas do alto-comando inimigo confirmaram nossos piores temores. Não há acordo ou concessão que possa encerrar esta guerra de forma ponderada. Exigem nada menos que a capitulação total de nossa nação, condenando-nos a viver mais uma vez sob o domínio imperialista. Se é isso que desejam, então só há uma resposta. Não vamos nos render."
 siam.18.a: "Governo [ROOT.GetAdjective] se mantém firme!"
 siam.19.t: "Governo [SIA.GetAdjective] exige a devolução de territórios"
 siam.19.desc: "O governo [SIA.GetAdjective], encorajado pelo crescente nacionalismo e pela percepção de nossa fragilidade regional, exigiu a devolução de territórios que considera parte essencial de seu Estado. É evidente que tentam agir além de suas capacidades, mas os territórios que reivindicam talvez não justifiquem uma guerra, especialmente com a situação global caminhando para o caos."
 siam.19.a: "Não vale a pena lutar por isso."
 siam.19.b: "Estão loucos!"
 siam.20.t: "Governo [FROM.GetAdjective] entrega territórios"
 siam.20.desc: "O governo [FROM.GetAdjective] decidiu devolver nossos territórios. Seja pelo reconhecimento de nossa soberania ou por pressões externas, isso é irrelevante. Nossa causa permanece justa."
 siam.20.a: "Um grande dia!"
 siam.21.t: "Governo [FROM.GetAdjective] se recusa a entregar territórios"
 siam.21.desc: "O governo [FROM.GetAdjective] recusou nosso pedido. Esses imperialistas se agarram com unhas e dentes ao século passado, incapazes de admitir que o tempo dessas supostas \"grandes nações\" já passou."
 siam.21.a: "Então mostraremos a eles."
 SIA_sent_bureaucrats_to_us: "Treinando funcionários públicos conosco"
 SIA_tied_their_currency_to_ours: "Atrelou sua moeda à nossa"
 SIA_sent_started_cooperative_with_us: "Iniciou uma cooperativa de desenvolvimento conosco"
 siam.22.t: "Enviar os burocratas d[SIA.GetNameDef] ao exterior"
 siam.22.desc: "Nossos burocratas não estão preparados para uma economia moderna, pois lhes falta o treinamento necessário para impulsionar o crescimento. Felizmente há muitos países com uma burocracia moderna e consolidada, aonde podemos enviá-los para que ganhem experiência sem importar também o governo estrangeiro."
 siam.22.a: "Vamos enviá-los para [ENG.GetNameDef]."
 siam.22.b: "Vamos enviá-los para [JAP.GetNameDef]."
 siam.23.t: "A lei de estabilização do baht"
 siam.23.desc: "O baht não pode permanecer desamparado enquanto o Estado [ROOT.GetAdjective] busca estabilidade no comércio e nas finanças. Nossos oficiais agora argumentam que a estabilidade monetária exige um amparo externo sólido, vinculado a uma moeda com peso suficiente para transmitir confiança a comerciantes, credores e parceiros estrangeiros. A escolha diante de nós não é meramente técnica, pois definirá o rumo de nosso comércio, o caráter de nosso desenvolvimento e a influência estrangeira que recairá sobre a economia d[SIA.GetNameDef]."
 siam.23.a: "Atrele à libra esterlina."
 siam.23.b: "Atrele ao iene."
 siam.24.t: "A Cooperativa de Desenvolvimento d[SIA.GetNameDef]"
 siam.24.desc: "A Cooperativa de Desenvolvimento d[SIA.GetNameDef] forneceu ao Estado um novo instrumento para o progresso nacional, mas a ambição ainda supera o capital doméstico. Ferrovias, oficinas e instalações elétricas exigem financiamento externo para que possam crescer com rapidez. Agora, dois caminhos se abrem diante de nós: o investimento [ENG.GetAdjective] oferece acesso a mercados consolidados, empresas experientes e o prestígio financeiro de Londres, e o investimento [JAP.GetAdjective] promete uma parceria industrial mais próxima com uma potência asiática emergente, ansiosa por expandir sua influência. Qualquer escolha pode acelerar o desenvolvimento, mas ambas trarão obrigações."
 siam.24.a: "Busque o investimento [ENG.GetAdjective]."
 siam.24.b: "Busque o investimento [JAP.GetAdjective]."
 siam.25.t: "A morte de Prajadhipok"
 siam.25.desc: "O Rei Prajadhipok está morto. O antigo monarca, cujo nome carregou a memória da velha ordem ao longo de anos de exílio e turbulência, agora deixa os assuntos dos homens para ingressar na História. Para alguns sua morte encerra o capítulo final da luta iniciada com o fim do regime absoluto. No entanto a causa que ele simbolizava não se extingue com sua partida. O trono permanece, a dinastia resiste e a tarefa de restaurar a dignidade e a estabilidade d[ROOT.GetNameDef] deve prosseguir em nome do jovem Rei Ananda."
 siam.25.a: "Que Sua Majestade ascenda aos céus."
 siam.27.t: "Forjar um rei"
 siam.27.desc: "O Rei Ananda continua n[SWI.GetNameDef], distante do reino que um dia governará. A distância, contudo, não o coloca fora de nossa influência. Professores podem ser escolhidos, disciplinas enfatizadas e hábitos incentivados, de modo que sua mente seja moldada para o futuro que desejamos para [ROOT.GetNameDef]. Seu retorno como soldado, erudito ou algo maior dependerá em grande parte do que lhe for ensinado agora.\n\nAfinal um rei nada mais é do que a extensão de seu país."
 siam.27.a: "Oriente-o para os estudos acadêmicos."
 siam.27.b: "Instrua-o em assuntos militares."
 siam.27.c: "Direcione-o para administração e logística."
 siam.27.d: "Eduque-o em indústria e desenvolvimento."
 siam.28.t: "A coroação do Rei Ananda"
 siam.28.desc: "Os longos anos de regência chegaram ao fim. Em Bangkok, diante de príncipes, monges, ministros e oficiais do Estado, Ananda ascende ao trono por direito próprio e recebe as honrarias devidas a um rei da dinastia Chakri. As cerimônias simbolizam continuidade em meio à turbulência e ordem sagrada após tempos de conflito. Para o reino, esta coroação não é apenas um espetáculo, mas uma afirmação de que a Coroa perdura, de que o Estado sobreviveu ao exílio e à guerra civil e de que um novo reinado se inicia n[ROOT.GetNameDef]."
 siam.28.a: "Vida longa ao rei."
 siam.29.t: "Estudos de tanques convencionais"
 siam.29.desc: "Os tanques convencionais ainda dominam o campo de batalha, então devemos aprender com os melhores a criar uma divisão de tanques poderosa."
 siam.29.a: "Aprenderemos com os alemães."
 siam.29.b: "Aprenderemos com os americanos."
 siam.29.c: "Aprenderemos com os britânicos."
 siam.31.t: "Aquisição de submarinos"
 siam.31.desc: "A expansão da Marinha exige a criação de uma força submarina e devemos definir onde buscaremos nossas embarcações. Tanto [ENG.GetNameDef] quanto [JAP.GetNameDef] apresentaram propostas, mas essa escolha traz consequências que vão além do estaleiro."
 siam.31.a: "As embarcações do Estado [ENG.GetAdjective] nos servirão bem."
 siam.31.b: "Construiremos nossa força submarina com base em projetos do Estado [JAP.GetAdjective]."
 siam.32.t: "Aquisição de navios de defesa costeira"
 siam.32.desc: "Nossas águas costeiras exigem embarcações de defesa capazes e devemos escolher nosso fornecedor. Tanto [ENG.GetNameDef] quanto [JAP.GetNameDef] estão prontos para fornecer os navios, mas essa decisão definirá o futuro de nossa frota e de nossas relações exteriores."
 siam.32.a: "Confiaremos nas embarcações do Estado [ENG.GetAdjective] para nossa defesa costeira."
 siam.32.b: "Confiaremos nos navios do Estado [JAP.GetAdjective] para nossa frota costeira."
 siam.33.t: "A venda da Bangkok Dock Co."
 siam.33.desc: "A venda da Bangkok Dock Co. foi concluída e os recursos agora estão no tesouro. O governo deve decidir para onde direcionar esses fundos, seja para aliviar o peso financeiro sobre os cidadãos comuns, acelerar as ambições técnicas da nação ou reforçar a confiança no futuro do país."
 siam.33.a: "Reduza a carga tributária do povo."
 siam.33.b: "Direcione os recursos para a pesquisa naval."
 siam.33.c: "Utilize o ganho inesperado para tranquilizar a nação."
 siam.34.t: "Exigências do governo [FROM.GetAdjective] em nossos litorais"
 siam.34.desc: "As forças do governo [FROM.GetAdjective] estão fazendo pressão contra [ROOT.GetNameDef] e os diplomatas deles falam com a confiança de homens que acreditam que a questão está resolvida. Eles fazem uso do discurso padrão de ordem e estabilidade, mas o que realmente buscam é obediência. Podemos nos submeter e preservar o Estado de maneira reduzida, nos anexar à facção deles na esperança de manter certa liberdade de ação, ou responder a essa pressão desafiando-os abertamente e expulsar os invasores de nossos litorais."
 siam.34.a: "Vamos nos juntar à facção deles e preservar nosso governo."
 siam.34.b: "Mande-os embora de nossos litorais."
 siam.35.t: "Governo [JAP.GetAdjective] exige maior impressão de dinheiro"
 siam.35.desc: "O governo [JAP.GetAdjective] deixou suas expectativas claras: devemos aumentar a emissão monetária para atender às suas demandas econômicas. O peso dessa medida recairá sobre nosso povo devido à alta dos preços, enquanto a indústria d[JAP.GetNameDef] colherá os benefícios. Temos pouca margem para recusar."
 siam.35.a: "Atenderemos às exigências d[JAP.GetNameDef]."
 siam.36.t: "Governo [SIA.GetAdjective] exige o pagamento das dívidas"
 siam.36.desc: "O governo [SIA.GetAdjective] exigiu formalmente que paguemos os custos gerados pelo acordo de emissão monetária que o forçamos a adotar. O acordo nos beneficiou bastante, mas chegou a hora de pagar a conta."
 siam.36.a: "Honre a dívida e inicie os pagamentos."
 siam.37.t: "Governo [JAP.GetAdjective] concorda em pagar nossa dívida"
 siam.37.desc: "Após nossas exigências, o governo [JAP.GetAdjective] concordou em iniciar o pagamento dos custos econômicos do acordo de emissão monetária. A compensação não eliminará totalmente o fardo imposto ao nosso povo, mas trará algum alívio ao tesouro."
 siam.37.a: "Um acordo justo. Nossa economia se recuperará."
 siam.38.t: "Governo [SIA.GetAdjective] busca acordo de rendição"
 siam.38.desc: "O governo [SIA.GetAdjective] veio até nós com um apelo por termos de rendição. Seus ministros agora concordam com aquilo que nossas armas já demonstraram: que o Estado [ROOT.GetAdjective] detém a iniciativa deste conflito. Podemos aceitar a rendição deles e reduzi-los à obediência, vinculá-los à nossa facção para que seu governo sirva a uma causa maior, ou rejeitar qualquer acordo e continuar nossa campanha até que o Sião esteja completamente subjugado."
 siam.38.a: "Aceite a rendição deles."
 siam.38.b: "Não. Daremos fim a isso por meio da força."
 siam.39.t: "Governo [FROM.GetAdjective] aceita nossa rendição"
 siam.39.desc: "[FROM.GetLeader] decidiu aceitar nossa submissão. Por ora, o povo d[ROOT.GetNameDef] foi poupado de mais devastação, mas não de uma grande humilhação. O exército recebeu ordens de recuar e o governo só permanece pela tolerância de uma potência mais forte. Preservamos o Estado, mas à custa de nosso orgulho e liberdade de ação."
 siam.39.a: "Toleramos o que é preciso."
 siam.40.t: "Governo [FROM.GetAdjective] rejeita nossa oferta"
 siam.40.desc: "[FROM.GetLeader] recusou qualquer proposta enviada de Bangkok. Nenhuma submissão é suficiente e nenhum acordo é aceitável. O inimigo pretende resolver a questão apenas por meio da conquista total. Não resta opção para [ROOT.GetNameDef] além da resistência. Se não quiserem deixar nossos litorais por meio de negociação, serão expulsos pela força."
 siam.40.a: "Então vamos à luta."
 siam.41.t: "Governo [FROM.GetAdjective] envia oficiais para estudar nossos métodos"
 siam.41.desc: "Uma delegação de oficiais d[FROM.GetNameDef] chegou para observar e estudar nossas práticas administrativas e de pesquisa. O governo [FROM.GetAdjective] demonstra intenção de modernizar sua burocracia recorrendo a conhecimento estrangeiro e escolheu [ROOT.GetNameDef] como modelo. A visita representa um reconhecimento implícito de nossos métodos e uma oportunidade de estreitar os laços de cooperação com outro governo."
 siam.41.a: "A delegação deles é bem-vinda."
 siam.42.t: "Governo [FROM.GetAdjective] atrela sua moeda à nossa"
 siam.42.desc: "O governo [FROM.GetAdjective] decidiu formalmente atrelar sua moeda à nossa. A decisão aproxima [FROM.GetNameDef] de nossa órbita econômica e demonstra certo grau de confiança na estabilidade de nossas instituições financeiras. O comércio entre nossas nações deverá se tornar mais previsível e as negociações entre comerciantes de ambos os países serão mais simples."
 siam.42.a: "Uma excelente notícia para nossas relações comerciais."
 siam.43.t: "Governo [FROM.GetAdjective] solicita investimento em desenvolvimento"
 siam.43.desc: "O governo [FROM.GetAdjective] estendeu um convite aos nossos engenheiros e especialistas para auxiliarem no desenvolvimento de sua nação. A cooperação oferece às nossas indústrias uma posição estratégica na região e fortalece os laços econômicos entre nossos governos. É uma proposta modesta, mas que pode gerar retornos significativos com o tempo."
 siam.43.a: "Teremos prazer em ajudar."
 siam.44.t: "Governo [FROM.GetAdjective] encomenda submarinos"
 siam.44.desc: "O governo [FROM.GetAdjective] realizou uma encomenda de submarinos construídos com base em nossos projetos. Esta venda representa um importante voto de confiança em nossa indústria naval e amplia a influência d[FROM.GetNameDef] nas águas do sudeste asiático."
 siam.44.a: "Uma encomenda bem-vinda para nossos estaleiros."
 SIA_purchased_submarines_from_us: "Comprou submarinos de nós"
 siam.45.t: "Governo [FROM.GetAdjective] propõe uma fusão de alianças"
 siam.45.desc: "Uma delegação d[FROM.GetNameDef] chegou com uma proposta enviada por [FROM.GetLeader]. Eles argumentam que nossas alianças estão lutando pelos mesmos interesses, enquanto dividem homens, suprimentos e influência diplomática em estruturas de comando distintas.\n\nA fusão de nossas forças criaria um bloco mais forte, capaz de coordenar estratégias em uma frente mais ampla. Tal acordo fortaleceria a causa comum, embora também significasse aceitar maior influência do governo [FROM.GetAdjective] sobre o futuro da aliança."
 siam.45.a: "É necessário manter uma frente unida."
 siam.45.b: "Nossa aliança continuará sendo apenas nossa."
 siam.46.t: "Governo [FROM.GetAdjective] aceita a fusão"
 siam.46.desc: "[FROM.GetLeader] aceitou nossa proposta de fundir alianças em uma única coalizão. O que antes eram comandos e canais diplomáticos separados agora se integram em uma só estrutura, permitindo que nossos governos coordenem planos de guerra, logística e política externa com muito mais clareza.\n\nO acordo não está livre de complicações, mas a necessidade de união prevaleceu."
 siam.46.a: "Juntos, somos mais fortes."
 siam.47.t: "Governo [FROM.GetAdjective] recusa a fusão"
 siam.47.desc: "[FROM.GetLeader] rejeitou nossa proposta de fundir alianças. Seu governo afirma que a cooperação poderá continuar onde houver interesses em comum, mas que não colocará sua aliança dentro de uma coalizão mais ampla liderada a partir de [ROOT.Capital.GetCapitalVictoryPointName].\n\nPor enquanto, a divisão entre nossos blocos permanece. Seguiremos em frente sem contar com o comprometimento pleno deles."
 siam.47.a: "Então seguiremos sozinhos."
 siam.48.t: "Governo [SIA.GetAdjective] solicita ajuda d[JAP.GetNameDef]"
 siam.48.desc: "O Estado [SIA.GetAdjective] solicitou formalmente auxílio militar contra as forças invasoras em seu país. Em troca, o governo d[SIA.GetNameDef] está disposto a conceder às empresas d[JAP.GetNameDef] acesso privilegiado a recursos estratégicos, infraestrutura e direitos comerciais.\n\nApoiar [SIA.GetNameDef] ampliaria nossa influência no sudeste asiático e garantiria materiais valiosos para o império, embora isso também possa nos envolver ainda mais nos conflitos regionais."
 siam.48.a: "Aceitaremos a proposta deles."
 siam.48.b: "O Estado [JAP.GetAdjective] não dispõe de recursos para isso."
 siam.49.t: "Governo [JAP.GetAdjective] aceita nosso pedido"
 siam.49.desc: "O governo [JAP.GetAdjective] concordou em apoiar [ROOT.GetNameDef] em sua luta. Conselheiros, equipamentos e suprimentos d[JAP.GetNameDef] em breve começarão a chegar, enquanto concessões econômicas foram oferecidas às empresas do Estado [JAP.GetAdjective], conforme combinado.\n\nEmbora o gabinete celebre a sobrevivência da nação, muitos se perguntam quanto de nossa independência trocamos por esse auxílio."
 siam.49.a: "Conquistamos um aliado."
 SIA_japan_aid_request.4.t: "Governo [JAP.GetAdjective] rejeita nosso pedido"
 SIA_japan_aid_request.4.desc: "O governo [JAP.GetAdjective] recusou nosso pedido de auxílio militar. Tóquio afirma que o império não dispõe de homens nem suprimentos suficientes para se envolver em nosso conflito no momento.\n\nSem ajuda externa, o Estado [ROOT.GetAdjective] terá de depender exclusivamente de suas próprias forças para sobreviver à invasão."
 SIA_japan_aid_request.4.a: "Então lutaremos sozinhos."
 siam_adc.1.t: "Governo [FROM.GetAdjective] exige a libertação d[?var:SIA_adc_demand_country_to_be_released.GetNameDef]"
 siam_adc.1.desc: "Uma missiva formal chegou d[FROM.GetNameDef], na qual [FROM.GetLeader] define nossa ocupação contínua de países asiáticos como uma afronta intolerável aos direitos destes à autodeterminação. A mensagem alega que a Ásia não é um prêmio a ser dividido ou administrado de acordo com os caprichos estrangeiros, e exige que retiremos nossas forças imediatamente e restauremos um governo independente n[?var:SIA_adc_demand_country_to_be_released.GetNameDef].\n\nA exigência não deixa espaço para erros de interpretação. O Estado [FROM.GetAdjective] espera conformidade e qualquer recusa de nossa parte será lembrada como um insulto intencional à sua nação."
 siam_adc.1.a: "Vamos libertá-los."
 siam_adc.1.b: "Eles permanecerão sob nossa ocupação."
 siam_adc.2.t: "Governo [FROM.GetAdjective] oferece restaurar nossa independência"
 siam_adc.2.desc: "Após o governo [FROM.GetAdjective] ter aceitado as exigências d[SIA.GetNameDef] a respeito do futuro d[ROOT.GetNameDef], [FROM.GetLeader] agora coloca uma questão final diante de nós. As autoridades da ocupação estão preparadas para recuar e reconhecer um governo [ROOT.GetAdjective] soberano caso decidamos nos tornar independentes novamente.\n\nA independência oferece dignidade e liberdade de ação, mas também nos deixa com a responsabilidade de reconstruir o Estado sem nenhuma garantia d[FROM.GetNameDef]. Permanecer sob a proteção deles é uma opção mais humilde, mas que pode gerar mais desordem no país nestes tempos incertos."
 siam_adc.2.a: "Permaneceremos como uma nação livre."
 siam_adc.2.b: "Permaneceremos sob a proteção do governo [FROM.GetAdjective]."
 siam_adc.3.t: "Governo [?var:SIA_tag_that_was_released_due_to_sia_pressure.GetAdjective] aceita a independência"
 siam_adc.3.desc: "O governo d[?var:SIA_tag_that_was_released_due_to_sia_pressure.GetNameDef] escolheu a independência. Com a administração da ocupação prestes a se dissolver, o Estado [?var:SIA_tag_that_was_released_due_to_sia_pressure.GetAdjective] se prepara para retomar seu lugar como uma das nações soberanas do mundo."
 siam_adc.3.a: "O que o futuro reserva para eles?"
 siam_adc.4.t: "Governo [FROM.GetAdjective] rejeita a independência"
 siam_adc.4.desc: "Apesar da oportunidade de obter sua liberdade, o governo d[FROM.GetNameDef] rejeitou a independência imediata. Seus ministros alegam que o Estado ainda não está preparado para suportar as responsabilidades da soberania total e que preferem manter o status quo por enquanto."
 siam_adc.4.a: "Então o acordo continua."
 siam_adc.5.t: "Governo [FROM.GetAdjective] rejeita nossas exigências"
 siam_adc.5.desc: "O governo [FROM.GetAdjective] deixou claro que considera nossas exigências uma piada. Eles afirmam que nossas forças militares escassas são prova de que não estamos em posição de desafiar o status quo."
 siam_adc.5.a: "Então mostraremos a eles."
 siam_dem_event_count: "Os militares estão planejando uma campanha difamatória quanto mais esperamos"
 siam_dem.2.t: "O Exército se opõe"
 siam_dem.2.desc: "Em uma reunião particular com ministros e oficiais do alto escalão, um representante militar fez uma dura crítica à proposta do Dossiê Amarelo. Ele alega que os autores falam de maneira muito leviana sobre a direção, a redistribuição e a obrigação social do Estado sem se preocupar com disciplina, propriedade e os fardos que recairão sobre as divisões de oficiais e as zonas rurais do país. Na visão dele, o governo [ROOT.GetAdjective] não pode passar por uma reforma que se baseia em teorias esboçadas em papel quando o mundo fica mais perigoso a cada mês."
 siam_dem.2.a: "O Exército apresentou seus argumentos."
 siam_dem.3.t: "Uma repreensão pública"
 siam_dem.3.desc: "A disputa foi além da sala do comitê. Um jornal amplamente visto como um veículo dos militares publicou uma denúncia completa do Dossiê Amarelo, apresentando-o como um programa estrangeiro disfarçado com linguagem patriota. Os editores alertam que a proposta coloca reivindicações de classe acima da união nacional, enfraquece a confiança em instituições estabelecidas e encoraja expectativas perigosas entre trabalhadores e camponeses. Pela tarde, o artigo estava sendo repetido nos quartéis, escritórios e casas de chá, e aquilo que antes era uma discussão interna passou a ser uma controvérsia pública."
 siam_dem.3.a: "As críticas se espalham."
 siam_dem.4.t: "Phibun denuncia o dossiê"
 siam_dem.4.desc: "Phibun entrou na disputa abertamente e com força evidente. Falando diante de apoiadores e oficiais, ele condena o Dossiê Amarelo como comunista, independentemente da linguagem que seus defensores preferem. Ele declara que qualquer programa que eleva o Estado além da pobreza, promete transformação social abrangente e gera agitação nas classes baixas carrega o veneno vermelho para dentro d[ROOT.GetNameDef] com um nome diferente."
 siam_dem.4.a: "Ele não deixa dúvidas."
 siam_dem.5.t: "Um governo deve ser formado"
 siam_dem.5.desc: "O antigo regime está em ruínas e o Seri Thai triunfou. Mas triunfo não é sinônimo de governança, e a coalizão que se uniu contra Phibun está longe de concordar sobre o futuro. Três nomes circulam nos salões do poder: Pridi Banomyong, a consciência da resistência; Khuang Aphaiwong, um homem brando o bastante para não ofender ninguém; e o General Phin Choonhavan, apoiado por oficiais que exigem sua parte. Quem escolhermos para liderar agora definirá o rumo da paz."
 siam_dem.5.a: "Pridi Banomyong deve liderar. A resistência conquistou esse direito."
 siam_dem.5.b: "Khuang Aphaiwong, um nome aceitável para todas as facções."
 siam_dem.5.c: "General Phin Choonhavan. O Exército terá seu lugar."
 ###################
 #### AUSTRALIA ####
 ###################
 AST_election_events.1.t.a: "Vitória do PUA!"
 AST_election_events.1.t.b: "Vitória do PTA!"
 AST_election_events.1.desc.a: "Os votos foram contabilizados e o Partido Unido da Austrália venceu a eleição.\n\nO PUA passará por um breve período de formação de governo, e então terá três anos para demonstrar que merece a confiança que os cidadãos depositaram em seus representantes."
 AST_election_events.1.desc.b: "Os votos foram contabilizados e o Partido Trabalhista Australiano venceu a eleição.\n\nO PTA passará por um breve período de formação de governo, e então terá três anos para demonstrar que merece a confiança que os cidadãos depositaram em seus representantes."
 AST_election_events.1.a: "O povo se pronunciou."
 AST_election_events.2.t: "A meio caminho da eleição federal"
 AST_election_events.2.desc: "O $AST_democratic_party_long$ tem liderado [AST.GetNameDef] desde 1931, conduzindo a nação durante a Grande Depressão e afastando-a do sentimento antidemocrático. Por meio de uma liderança estável, inclinações conservadoras e lealdade à Grã-Bretanha, o PUA fortaleceu seu apoio e tornou mais um mandato cada vez mais provável. No entanto, outro partido ainda tem influência no cenário.\n\nAinda se recuperando da moção de censura que o retirou do poder em 1931, o $AST_labor_party_long$ começa a retomar sua força. Com as vozes comunistas silenciadas, a classe trabalhadora busca agora uma nova orientação. Em sua missão de representar todos os cidadãos, o PTA adotou uma perspectiva diferente sobre o imperialismo e a lealdade da Austrália ao império. As necessidades internas devem vir em primeiro lugar e os interesses estrangeiros não devem mais ter prioridade.\n\nResta um ano e meio até a próxima eleição federal. Se o PUA deseja garantir outra vitória, seus líderes precisam acelerar reformas para preservar o apoio popular. Caso contrário, a campanha do PTA pode restaurar sua posição mais uma vez."
 AST_election_events.2.a: "O PUA deverá implementar suas últimas reformas."
 AST_election_events.2.b: "Uma campanha por toda a Austrália aumentará o apoio ao PTA."
 AST_election_events.3.t: "$AST_election_season_cat$"
 AST_election_events.3.desc: "$AST_election_season_cat_desc$"
 AST_election_events.3.a: "Está começando."
 AST_diplomatic_events.1.t: "Pacto de não agressão australiano"
 AST_diplomatic_events.1.desc: "Como parte de seus recentes esforços diplomáticos, o governo australiano busca firmar acordos de não agressão com algumas nações asiáticas, e nós estamos entre elas. Resta saber se essa tentativa de evitar a guerra demonstra alienação ou inocência por parte dos oficiais australianos.\n\nDevemos assinar um pacto de não agressão com [AST.GetNameDef]?"
 AST_diplomatic_events.1.a: "Absolutamente não."
 AST_diplomatic_events.1.b: "Sim, assinaremos."
 AST_diplomatic_events.2.t: "Resistência ao Pacto do Pacífico"
 AST_diplomatic_events.2.desc: "A delegação enviada ao Estado [FROM.GetAdjective] informou via telégrafo a resposta da nação à nossa proposta de pacto de não agressão. Sabíamos que a iniciativa era ambiciosa, e por isso a recusa de [FROM.GetLeader] não causa grande surpresa."
 AST_diplomatic_events.2.a: "Pelo menos foi uma tentativa honrosa."
 AST_diplomatic_events.3.t: "Vida longa ao Pacto do Pacífico"
 AST_diplomatic_events.3.desc: "A delegação enviada ao Estado [FROM.GetAdjective] informou via telégrafo a resposta da nação à nossa proposta de pacto de não agressão. Para nossa satisfação, [FROM.GetLeader] se interessou pela iniciativa e decidiu firmar o acordo."
 AST_diplomatic_events.3.a: "Esplêndido!"
 AST_diplomatic_events.4.t: "Austrália solicita controle de Singapura"
 AST_diplomatic_events.4.desc: "O governo [AST.GetAdjective] há muito questiona a confiabilidade da Estratégia de Singapura. Segundo autoridades do país, nossa capacidade de socorrê-los em caso de uma guerra no Pacífico é incerta. Transferir as responsabilidades navais do Pacífico para [AST.GetNameDef] reduziria o fardo sobre os britânicos, mas o transferiria para os australianos.\n\nPodemos confiar que um maior controle australiano colocaria nossos territórios e súditos no Pacífico em uma posição mais segura do que se Singapura permanecesse sob nosso domínio?"
 AST_diplomatic_events.4.a: "Sim, podemos."
 AST_diplomatic_events.4.b: "Singapura continuará sendo nossa."
 AST_diplomatic_events.5.t: "Grã-Bretanha concorda com nosso pedido"
 AST_diplomatic_events.5.desc: "A Grã-Bretanha aceitou transferir Singapura para a autoridade australiana. Isso finalmente colocará um fim à ultrapassada Estratégia de Singapura, nos colocando no comando de nossas próprias defesas."
 AST_diplomatic_events.5.a: "A estratégia foi reescrita!"
 AST_diplomatic_events.5.a.tt: "§YSingapura§!:\n  É controlada pela §YAustrália§!.\n  É propriedade da §YAustrália§!.\n§YIlha Christmas§!:\n  É controlada pela §YAustrália§!.\n  É propriedade da §YAustrália§!.\n§YIlhas Cocos§!:\n  São controladas pela §YAustrália§!.\n  São propriedade da §YAustrália§!."
 AST_diplomatic_events.6.t: "Grã-Bretanha rejeita nosso pedido"
 AST_diplomatic_events.6.desc: "A Grã-Bretanha se recusa a transferir Singapura para a autoridade australiana. O status quo será mantido."
 AST_diplomatic_events.6.a: "A Estratégia de Singapura deve ser preservada."
 AST_diplomatic_events.7.t: "Governo [AST.GetAdjective] solicita nossa ajuda"
 AST_diplomatic_events.7.desc: "O governo [AST.GetAdjective] deseja receber equipamentos de aliados para manter seu esforço de guerra e solicita nossa ajuda na gestão dos carregamentos necessários. Podemos disponibilizar comboios para uso d[AST.GetNameDef]?"
 AST_diplomatic_events.7.a: "Podemos."
 AST_diplomatic_events.7.b: "Não podemos."
 AST_diplomatic_events.8.t: "Governo [USA.GetAdjective] aceita nosso pedido"
 AST_diplomatic_events.8.desc: "O governo [USA.GetAdjective] concordou em disponibilizar alguns comboios para auxiliar os esforços logísticos d[AST.GetNameDef]."
 AST_diplomatic_events.8.a: "Faremos ótimo uso deles!"
 AST_diplomatic_events.9.t: "Governo [USA.GetAdjective] rejeita nosso pedido"
 AST_diplomatic_events.9.desc: "O governo [USA.GetAdjective] não tem comboios disponíveis para ajudar nos esforços logísticos d[AST.GetNameDef]."
 AST_diplomatic_events.9.a: "Precisaremos gerenciar os carregamentos por conta própria."
 AST_diplomatic_events.10.t: "Uma aliança em tempos de guerra"
 AST_diplomatic_events.10.desc: "O governo [AST.GetAdjective] tem em grande estima a aliança com [USA.GetNameDef] e agora solicita que ela seja formalizada em uma coalizão internacional de guerra. Ao unirmos forças, nossas nações poderão auxiliar uma à outra nos conflitos atuais e futuros."
 AST_diplomatic_events.10.a: "Devemos aceitar."
 AST_diplomatic_events.10.b: "O Estado [USA.GetAdjective] será mais forte sem eles."
 AST_diplomatic_events.11.t: "Uma aliança em tempos de guerra"
 AST_diplomatic_events.11.desc: "O Estado [USA.GetAdjective] aceitou unir forças. Como membros da facção [AST.GetFactionName], [AST.GetName] e [USA.GetName] se apoiarão mutuamente nos conflitos atuais e futuros."
 AST_diplomatic_events.11.a: "Nossos inimigos tremerão de medo."
 AST_diplomatic_events.12.t: "Aliança em tempos de guerra recusada"
 AST_diplomatic_events.12.desc: "O Estado [USA.GetAdjective] recusou nossa proposta de unir forças. [AST.GetName] e [USA.GetName] seguirão caminhos separados em seus respectivos esforços de guerra."
 AST_diplomatic_events.12.a: "Devemos resistir sem eles."
 AST_diplomatic_events.13.t: "Cláusula 6"
 AST_diplomatic_events.13.desc: "Durante o processo que uniu as colônias australianas em uma federação, a Nova Zelândia optou por não participar. Desde então, porém, a constituição australiana continua a nos definir como um dos potenciais Estados de sua Comunidade, permitindo inclusive nossa admissão.\n\nO Estado [AST.GetAdjective] agora afirma que a situação mundial atual exige união e solicita a ingressão d[NZL.GetNameDef] à autoridade australiana. Devemos realizar um referendo sobre a questão?"
 AST_diplomatic_events.13.a: "Sim, devemos."
 AST_diplomatic_events.13.a.tt: "Um referendo será realizado, podendo resultar na §Ranexação§! §Yd[NZL.GetNameDef]§!"
 AST_diplomatic_events.13.b: "Nem pensar!"
 AST_diplomatic_events.14.t: "Território [NZL.GetAdjective] torna-se um Estado australiano"
 AST_diplomatic_events.14.desc: "Após a realização do referendo, o governo d[NZL.GetNameDef] decidiu invocar a Cláusula 6 da constituição australiana. Os neozelandeses concordaram que suas terras estarão mais seguras sob administração australiana e, assim, aceitaram se unir ao Estado [AST.GetAdjective]."
 AST_diplomatic_events.14.a: "A Austrália cresce."
 AST_diplomatic_events.15.t: "População da Nova Zelândia resiste"
 AST_diplomatic_events.15.desc: "Após a realização do referendo, o governo [NZL.GetAdjective] decidiu não invocar a Cláusula 6 da constituição australiana. O território d[NZL.GetNameDef] continuará sendo uma nação independente."
 AST_diplomatic_events.15.a: "Nada muda para a Austrália."
 AST_diplomatic_events.16.t: "Oficiais d[NZL.GetNameDef] resistem"
 AST_diplomatic_events.16.desc: "Apesar da pressão australiana, o governo [NZL.GetAdjective] decidiu não realizar um referendo para invocar a Cláusula 6 da constituição australiana. O território d[NZL.GetNameDef] continuará sendo uma nação independente."
 AST_diplomatic_events.16.a: "Nada muda para a Austrália."
 AST_diplomatic_events.17.t: "Parceria australiana"
 AST_diplomatic_events.17.desc: "O inimigo avança pelo norte e é apenas uma questão de tempo até que chegue às nossas fronteiras – pelo menos, é o que afirmam os oficiais australianos. O governo d[AST.GetNameDef] propõe uma união de forças para a criação de uma barreira conjunta, de preferência colocando [INS.GetNameDef] sob autoridade australiana, ou ao menos concedendo-lhes acesso militar."
 AST_diplomatic_events.17.a: "Concordamos em ficar sob autoridade australiana."
 AST_diplomatic_events.17.a.tt: "O governo §Yd[INS.GetNameDef]§! se tornará um §Yfantoche§! §Yd[AST.GetNameDef]§!."
 AST_diplomatic_events.17.b: "Conceda acesso militar."
 AST_diplomatic_events.17.b.tt: "O governo §Yd[INS.GetNameDef]§! concederá §Yacesso militar§! ao Estado §Y[AST.GetAdjective]§!."
 AST_diplomatic_events.17.c: "Não concordamos com nada disso."
 AST_diplomatic_events.18.t: "Governo [INS.GetAdjective] aceita a solicitação australiana"
 AST_diplomatic_events.18.desc: "O governo [INS.GetAdjective] concordou com a nossa solicitação. Nossa cooperação terá um grande impacto nas capacidades de defesa de ambas as nações."
 AST_diplomatic_events.18.a: "Fantástico!"
 AST_diplomatic_events.19.t: "Governo [INS.GetAdjective] recusa"
 AST_diplomatic_events.19.desc: "O governo [INS.GetAdjective] recusou nossa solicitação. Nossas nações terão que cuidar de suas próprias defesas."
 AST_diplomatic_events.19.a: "O Estado [AST.GetAdjective] enfrentará os conflitos sozinho."
 AST_diplomatic_events.20.t: "Convocação ao Gabinete de Guerra da Grã-Bretanha"
 AST_diplomatic_events.20.desc: "[GET_AST_BWC_COUNT]O governo d[ENG.GetNameDef] convocou o primeiro-ministro australiano ao Gabinete de Guerra da Grã-Bretanha. Diante da situação mundial crítica, os britânicos buscam estratégias comuns e cooperação militar com seus aliados.\n\nContudo, a Austrália tem suas próprias preocupações. Podemos ceder parte do tempo do primeiro-ministro para agradar os britânicos?"
 AST_diplomatic_events.20.a: "[AST.GetLeader] partirá para a Grã-Bretanha."
 AST_diplomatic_events.20.b: "Ele é necessário aqui."
 AST_bwc_count_2: "Pela segunda vez, [ENG.GetLeader] solicita a presença de [AST.GetLeader], afirmando que apenas a estreita cooperação determinará o desfecho de nosso problema em comum.\n\n"
 AST_bwc_count_3: "Mais uma vez, a presença de [AST.GetLeader] é requisitada em outro continente para manter a cooperação com a Comunidade. Contudo, outros pedidos semelhantes serão improváveis, desde que deixemos claro se nossos interesses residem no esforço coletivo ou em cuidar de nossos próprios assuntos.\n\n"
 AST_bwc_accept_effect_tt: "§YEfeitos ao aceitar a convocação 3 vezes:§!"
 AST_bwc_accept_tt: "Aceitar a convocação §Y[?var:AST_bwc_accept]§!/§Y3§! vezes"
 AST_diplomatic_events.22.t: "Contribuições bem-sucedidas ao Gabinete de Guerra da Grã-Bretanha"
 AST_diplomatic_events.22.desc: "Durante o último ano, o primeiro-ministro australiano participou ativamente do Gabinete de Guerra da Grã-Bretanha. Apesar dos custos significativos para [AST.GetNameDef], nossa nação saiu fortalecida graças à cooperação militar com os britânicos."
 AST_diplomatic_events.22.a: "No fim, o custo valeu a pena."
 AST_diplomatic_events.23.t: "[ENG.GetLeader] não busca mais influência na guerra australiana"
 AST_diplomatic_events.23.desc: "O governo [ENG.GetAdjective] convocou o primeiro-ministro australiano ao Gabinete de Guerra da Grã-Bretanha diversas vezes, mas, após repetidas recusas, [ENG.GetLeader] já não vê motivo para continuar insistindo."
 AST_diplomatic_events.23.a: "É compreensível."
 AST_diplomatic_events.24.t: "Mudança de liderança"
 AST_diplomatic_events.24.desc: "O primeiro-ministro da Austrália exerceu grande influência no esforço de guerra da Comunidade Britânica. Durante suas visitas regulares a Londres, Robert Menzies conquistou a confiança dos ministros locais, enquanto a confiança deles em seu próprio primeiro-ministro diminuía. Agora, os ministros britânicos pressionam a liderança d[ENG.GetNameDef] a renunciar e ceder o cargo a Menzies.\n\nMesmo perdendo seu primeiro-ministro, o Estado [AST.GetAdjective] conquistará a lealdade duradoura de seu soberano, agora conduzido por um compatriota no comando da Grã-Bretanha. A nação do sul busca maior autoridade e Robert Menzies foi o primeiro a trabalhar por isso."
 AST_diplomatic_events.24.a: "Os tempos estão mudando."
 AST_diplomatic_events.25.t: "Sob a autoridade de Camberra"
 AST_diplomatic_events.25.desc: "A crescente tensão entre as nações do Pacífico é preocupante e, com a Grã-Bretanha ocupada com suas próprias batalhas, é improvável que consigamos acudir nossos súditos, ao menos segundo [AST.GetNameDef].\n\nEles buscam reconstruir a Comunidade Britânica de forma que as nações dos oceanos Pacífico e Índico sejam administradas diretamente de Camberra. Devemos concordar?"
 AST_diplomatic_events.25.a: "Certamente. A região do Pacífico ganhará força sob um controle centralizado."
 AST_diplomatic_events.25.b: "De forma alguma!"
 AST_diplomatic_events.26.t: "A Comunidade do Pacífico"
 AST_diplomatic_events.26.desc: "O governo [ENG.GetAdjective] concorda: a região do Pacífico ganhará força sob um controle centralizado. Os territórios britânicos do Pacífico foram colocados sob nossa autoridade."
 AST_diplomatic_events.26.a: "As nações do Pacífico unem forças."
 AST_diplomatic_events.27.t: "Grã-Bretanha recusa nosso pedido"
 AST_diplomatic_events.27.desc: "O governo [ENG.GetAdjective] discorda: a região do Pacífico não ganhará força sob um controle centralizado. Os territórios do Pacífico permanecerão sob autoridade britânica."
 AST_diplomatic_events.27.a: "Ainda assim, a Austrália resistirá."
 AST_diplomatic_events.28.t: "[ENG.GetLeader] põe fim às conversas"
 AST_diplomatic_events.28.desc: "As negociações do primeiro-ministro com [ENG.GetLeader] resultaram em pouco apoio à Austrália, além de aumentar o ressentimento britânico contra [AST.GetLeader] por insistir nos interesses australianos."
 AST_diplomatic_events.28.a: "A Austrália deve cuidar de suas próprias defesas."
 AST_diplomatic_events.29.t: "Grã-Bretanha nos apoia"
 AST_diplomatic_events.29.desc: "Após a pressão australiana sobre [ENG.GetNameDef] para instigar um conflito com [JAP.GetNameDef], o governo [ENG.GetAdjective] concordou em apoiar nossos esforços de defesa."
 AST_diplomatic_events.29.a: "A ajuda é bem-vinda, mas não evitará uma guerra contra o Japão."
 AST_diplomatic_events.30.t: "Austrália solicita direitos de recurso"
 AST_diplomatic_events.30.desc: "Agressores expansionistas cobiçam a Indochina não apenas por seu território, mas também pelos recursos que ela possui. Se essas riquezas caírem nas mãos do inimigo, a guerra apenas se prolongará, mas em mãos australianas poderiam ajudar a encerrá-la. Pelo menos é o que alega o governo australiano.\n\nDevemos conceder a eles direitos de recurso em nosso território?"
 AST_diplomatic_events.30.a: "Sim, devemos."
 AST_diplomatic_events.30.b: "Esses recursos também não pertencem ao governo [AST.GetAdjective]."
 AST_diplomatic_events.31.t: "Governo [FROM.GetAdjective] concede direitos de recurso ao Estado [AST.GetAdjective]"
 AST_diplomatic_events.31.desc: "Agressores expansionistas cobiçam a Indochina não apenas por seu território, mas também pelos recursos que ela possui. Se essas riquezas caírem nas mãos do inimigo, a guerra apenas se prolongará, mas em mãos australianas poderiam ajudar a encerrá-la. Pelo menos é o que alega o governo australiano.\n\nO governo d[ROOT.OVERLORD.GetNameDef] concordou com o pedido."
 AST_diplomatic_events.31.a: "Isso está além de nosso controle."
 AST_diplomatic_events.32.t: "Governo [FROM.GetAdjective] concede direitos de recurso"
 AST_diplomatic_events.32.desc: "O governo [FROM.GetAdjective] concorda que os recursos da Indochina seriam mais bem aproveitados em mãos australianas e nos concedeu seus direitos."
 AST_diplomatic_events.32.a: "Faremos um ótimo uso deles."
 AST_diplomatic_events.33.t: "Governo [FROM.GetAdjective] recusa-se a conceder direitos de recurso"
 AST_diplomatic_events.33.desc: "O governo [FROM.GetAdjective] discorda que os recursos da Indochina seriam mais bem aproveitados em mãos australianas e recusou-se a nos conceder seus direitos."
 AST_diplomatic_events.33.a: "Resta torcer para que não acabem em mãos inimigas."
 AST_diplomatic_events.34.t: "Governo [AST.GetAdjective] solicita a divisão dos territórios do Pacífico"
 AST_diplomatic_events.34.desc: "O governo [AST.GetAdjective] propôs um pacto para evitar futuros conflitos entre nossas nações. Ao dividir os territórios do Pacífico entre nós, poderemos planejar nossas futuras expansões sem receio de interferência mútua."
 AST_diplomatic_events.34.a: "O pacto parece razoável."
 AST_diplomatic_events.34.b: "O Estado [JAP.GetAdjective] se expandirá como bem entender."
 AST_diplomatic_events.35.t: "O Pacífico foi dividido"
 AST_diplomatic_events.35.desc: "[AST.GetName] e [JAP.GetName] firmaram um acordo quanto aos territórios do Pacífico para os quais cada país poderá se expandir. Espera-se que isso evite conflitos futuros entre nossas potências."
 AST_diplomatic_events.35.a: "Está decidido!"
 AST_diplomatic_events.36.t: "O Pacífico se dividirá naturalmente"
 AST_diplomatic_events.36.desc: "O Estado [JAP.GetAdjective] recusou-se a dividir os territórios do Pacífico entre nossas nações e afirmou que se expandirá como bem entender."
 AST_diplomatic_events.36.a: "Então a Austrália fará o mesmo."
 AST_diplomatic_events.37.t: "Transferência de soberania"
 AST_diplomatic_events.37.desc: "Por razões desconhecidas, o governo [AST.GetAdjective] decidiu transferir o controle de nossas terras para [JAP.GetNameDef]. Algo preocupante está se desenrolando nos bastidores, e é apenas uma questão de tempo até que o mundo descubra o que é."
 AST_diplomatic_events.37.a: "Evidentemente, não temos voz nessa decisão."
 AST_diplomatic_events.38.t: "O Pacto de Nauru"
 AST_diplomatic_events.38.desc: "Como resultado da Primeira Guerra Mundial, vários territórios alemães no Pacífico foram colocados sob controle australiano, mas agora pode haver um meio de reaver um deles: a ilha de Nauru.\n\nO grupo político [AST.GetFascistParty] defende valores que se alinham aos nossos interesses, incluindo a separação total entre [AST.GetName] e [ENG.GetName]. Devido à atual influência limitada do movimento, seus representantes buscam o nosso apoio para acelerar seu crescimento. Quando estiverem consolidados no poder, eles insistem que devolverão o controle da ilha de Nauru, desde que ofereçamos garantia quando buscarem a independência."
 AST_diplomatic_events.38.a: "Nosso território retornará!"
 AST_diplomatic_events.38.b: "Não podemos nos comprometer com promessas vazias."
 AST_diplomatic_events.39.t: "Governo [GER.GetAdjective] aceita o Pacto de Nauru"
 AST_diplomatic_events.39.desc: "[GER.GetNameDefCap] e o grupo político [AST.GetFascistParty] alinharam seus objetivos: a independência d[AST.GetNameDef]. Devido à influência política atualmente limitada do partido, o governo [GER.GetAdjective] contribuirá com fundos para acelerar seu crescimento e, assim que essa limitação deixar de existir, o acordo será executado por completo."
 AST_diplomatic_events.39.a: "Esplêndido!"
 AST_diplomatic_events.40.t: "O Pacto de Nauru se desfaz"
 AST_diplomatic_events.40.desc: "Incapaz de assumir compromissos que ainda não pode cumprir, o governo d[GER.GetNameDef] rejeitou apoiar nossa ascensão ao poder. O Pacto de Nauru termina antes mesmo de começar, e as ambições do grupo político [AST.GetFascistParty] permanecerão sobre nossos ombros."
 AST_diplomatic_events.40.a: "O partido seguirá sem o apoio alemão."
 AST_diplomatic_events.41.t: "Nauru retorna ao controle alemão"
 AST_diplomatic_events.41.desc: "Agora plenamente no poder, o grupo político [AST.GetFascistParty] cumpre sua promessa e honra sua parte do acordo. Nauru é devolvida ao governo d[GER.GetNameDef] e nós garantiremos a independência australiana."
 AST_diplomatic_events.41.a: "Assim faremos."
 AST_diplomatic_events.42.t: "[AST.GetFascistParty] quebra sua promessa"
 AST_diplomatic_events.42.desc: "Promessas têm uma falha fatal: elas podem ser quebradas. Agora que assumiram as rédeas do poder, os líderes do grupo político [AST.GetFascistParty] decidiram que não apenas Nauru pertence a eles, mas que também tomarão as outras ilhas do Pacífico\n\nNossos antigos territórios do Pacífico permanecerão tão longe de serem nossos quanto antes do Pacto de Nauru ser assinado e apenas uma guerra mudaria isso."
 AST_diplomatic_events.42.a: "O futuro decidirá as consequências."
 AST_diplomatic_events.43.t: "Governo [AST.GetAdjective] solicita o sudeste asiático"
 AST_diplomatic_events.43.desc: "O governo d[AST.GetNameDef] alega que, com sua expansão para o norte, poderemos aumentar nossa influência conjunta sobre a diplomacia e conflitos do sudeste asiático. Apesar de não ser uma exigência direta, [AST.GetLeader] sugere que não aceitará recusa."
 AST_diplomatic_events.43.a: "Com a nossa atenção em outro lugar, será melhor assim."
 AST_diplomatic_events.43.b: "Mas uma recusa é o que receberão."
 AST_diplomatic_events.44.t: "Transferência do sudeste asiático"
 AST_diplomatic_events.44.desc: "O governo d[ENG.GetNameDef] concordou sabiamente em transferir seus territórios do sudeste asiático para nós. Conforme as fronteiras australianas se expandem, nossa influência segue logo atrás, tornando-se apenas uma questão de tempo até que o mundo seja nosso."
 AST_diplomatic_events.44.a: "O futuro parece promissor."
 AST_diplomatic_events.45.t: "O sudeste asiático permanece como está"
 AST_diplomatic_events.45.desc: "O governo d[ENG.GetNameDef] rejeitou a transferência de seus territórios do sudeste asiático para nós. Mesmo assim, o apelo de controlar a região permanece evidente para nós e, ainda que isso não tenha ocorrido por meio de uma solicitação, poderá vir a acontecer por outros motivos."
 AST_diplomatic_events.45.a: "Sim, poderá."
 #AST_diplomatic_events.46.t was removed
 AST_diplomatic_events.47.t: "Compartilhando os encargos"
 AST_diplomatic_events.47.desc: "Apesar de sua separação recente da Comunidade Britânica, o Estado [AST.GetAdjective] oferece cooperação militar. Eles alegam que compartilhar os encargos beneficiaria o governo d[ENG.GetNameDef], considerando o quanto seus recursos estão dispersos pelo mundo."
 AST_diplomatic_events.47.a: "Nós concordamos."
 AST_diplomatic_events.47.b: "Vamos nos virar por conta própria."
 AST_diplomatic_events.48.t: "O Pacto Britânico-Australiano"
 AST_diplomatic_events.48.desc: "O governo d[ENG.GetNameDef] concordou em assinar um pacto de não agressão, estabelecendo as bases para a cooperação militar."
 AST_diplomatic_events.48.a: "Isso marca um novo capítulo em nossas relações."
 AST_diplomatic_events.49.t: "Pacto não assinado"
 AST_diplomatic_events.49.desc: "O governo d[ENG.GetNameDef] recusou-se a assinar um pacto de não agressão. Nossa tentativa de estabelecer cooperação militar entre nossas duas nações falhou e devemos prosseguir por conta própria com nossos avanços."
 AST_diplomatic_events.49.a: "Realmente devemos."
 AST_diplomatic_events.50.t: "A guarnição australiana do Pacífico"
 AST_diplomatic_events.50.desc: "Apesar de a proteção do sudeste asiático e do Pacífico ser de interesse da Grã-Bretanha, a região fica longe das Ilhas Britânicas, conforme entendido pel[FROM.GetNameDef]. Em troca de nosso apoio com suprimentos, seu governo ofereceu assumir o comando da defesa do território, permitindo que direcionemos nossa atenção para outro lugar."
 AST_diplomatic_events.50.a: "A assistência d[FROM.GetNameDef] será bem-vinda."
 AST_diplomatic_events.50.b: "A região fica perto o suficiente."
 AST_diplomatic_events.51.t: "A guarnição do Pacífico d[ENG.GetNameDef]"
 AST_diplomatic_events.51.desc: "O governo [FROM.GetAdjective] concorda que as águas do sudeste asiático devem ser protegidas por nós. Em troca das contribuições britânicas de combustível, as forças d[ROOT.GetNameDef] se dedicarão a aumentar a dominância naval em nossas regiões marítimas vizinhas."
 AST_diplomatic_events.51.a: "As águas serão nossas."
 AST_diplomatic_events.52.t: "A guarnição do Pacífico da Austrália"
 AST_diplomatic_events.52.desc: "O governo [FROM.GetAdjective] discorda. Eles não precisam de ajuda para defender as águas do sudeste asiático. Porém, com ou sem o apoio britânico, as forças d[ROOT.GetNameDef] se dedicarão a aumentar a dominância naval nas regiões marítimas vizinhas."
 AST_diplomatic_events.52.a: "As águas serão nossas."
 AST_diplomatic_events.53.t: "Expulsar Vichy da África"
 AST_diplomatic_events.53.desc: "O governo [AST.GetAdjective] suspeita que a queda ou cooperação da França de Vichy é um dos principais objetivos d[ENG.GetNameDef] e, portanto, ofereceu unir-se à perseguição das colônias africanas francesas até que Vichy seja subjugada. Apesar de haver a possibilidade de segundas intenções por trás dessa proposta, não há dúvidas de que uma maior presença de aliados na região nos beneficiaria.\n\nSe permitirmos, o governo d[AST.GetNameDef] iniciará a negociação com a França de Vichy, buscando uma transferência pacífica de suas colônias e o estabelecimento de uma guarnição australiana."
 AST_diplomatic_events.53.a: "Aceitaremos o apoio deles."
 AST_diplomatic_events.53.b: "O risco do governo [AST.GetAdjective] usar isso contra nós é grande demais."
 AST_diplomatic_events.54.t: "Ao auxílio deles"
 AST_diplomatic_events.54.desc: "O governo d[ENG.GetNameDef] concorda que uma maior presença de aliados na África beneficiaria a Comunidade.\n\nIniciaremos a negociação com a França de Vichy, buscando uma transferência pacífica de suas colônias e o estabelecimento de uma guarnição australiana."
 AST_diplomatic_events.54.a: "Faremos isso."
 AST_diplomatic_events.55.t: "Com ou sem permissão"
 AST_diplomatic_events.55.desc: "O governo d[ENG.GetNameDef] rejeita a ajuda da Austrália na África e decide lidar com a França de Vichy por conta própria. Porém, nossas ambições não são tão facilmente afastadas.\n\nO controle australiano dos territórios africanos da França de Vichy nos deixaria em pé de igualdade com a Comunidade Britânica, em vez de subordinados a ela. Devemos buscá-los independentemente dos desejos d[ENG.GetNameDef], mesmo que seja pela força."
 AST_diplomatic_events.55.a: "Expandiremos nossas fronteiras."
 AST_diplomatic_events.56.t: "Governo d[AST.GetNameDef] exige territórios africanos"
 AST_diplomatic_events.56.desc: "Em nome d[ENG.GetNameDef], o governo [AST.GetAdjective] bate à nossa porta, exigindo a transferência de territórios africanos.\n\nO governo [ENG.GetAdjective] está determinado a expandir seu controle na África e, se não nos submetermos à ocupação australiana, eles voltarão até nós armados."
 AST_diplomatic_events.56.a: "Para evitar um conflito, os territórios serão transferidos."
 AST_diplomatic_events.56.b: "Então que voltem armados."
 AST_diplomatic_events.57.t: "Vichy transfere território africano"
 AST_diplomatic_events.57.desc: "A França de Vichy concordou em transferir os territórios africanos exigidos e permitiu que uma guarnição australiana assuma o controle da região."
 AST_diplomatic_events.57.a: "A expansão na África continuará!"
 AST_diplomatic_events.58.t: "Vichy recusa território para [AST.GetNameDef]"
 AST_diplomatic_events.58.desc: "A França de Vichy se recusa a transferir os territórios africanos para nós. Porém, isso não era um pedido, mas sim uma exigência.\n\nBuscaremos a região que eles nos negaram, mesmo que seja pela força."
 AST_diplomatic_events.58.a: "Seja de forma pacífica ou não, o Estado [AST.GetAdjective] se expandirá."
 #AST_diplomatic_events.59 was removed
 #AST_diplomatic_events.60 was removed
 #AST_diplomatic_events.61 was removed
 AST_diplomatic_events.62.t: "Um pacto contra a Grã-Bretanha?"
 AST_diplomatic_events.62.desc: "Diplomatas d[AST.GetNameDef] vieram até nós com uma oferta de estabelecer um pacto contra a Grã-Bretanha. Isso envolveria a colaboração deles para recuperar a Irlanda do Norte dos anglo-saxões sem que tivéssemos que interferir diretamente.\nEm troca, caso tenham sucesso, teríamos que nos juntar à facção deles e ajudar em uma futura guerra contra a Grã-Bretanha, caso ela ocorra.\nApesar de uma unificação com o norte ser convidativa, temos que considerar com cuidado se estamos em posição de antagonizar um vizinho tão forte dessa maneira e, ainda mais importante, se é possível sairmos vitoriosos em caso do conflito, ou toda a Irlanda passará a ser uma colônia britânica novamente."
 AST_diplomatic_events.62.a: "A unificação não pode esperar! Vamos assinar o pacto!"
 AST_diplomatic_events.62.b: "É muito perigoso."
 AST_diplomatic_events.63.t: "A Irlanda rejeita!"
 AST_diplomatic_events.63.desc: "A Irlanda se recusou a assinar o pacto contra a Grã-Bretanha."
 AST_diplomatic_events.63.a: "Então a Irlanda permanecerá dividida."
 AST_diplomatic_events.64.t: "A Irlanda aceita!"
 AST_diplomatic_events.64.desc: "A Irlanda aceitou assinar o pacto contra a Grã-Bretanha."
 AST_diplomatic_events.64.a: "Rumo a Belfast!"
 AST_diplomatic_events.65.t: "Governo [FROM.GetAdjective] oferece apoio" ### Support for the Chinese Communists - Sends event from AST to PRC offering support
 AST_diplomatic_events.65.desc: "A crescente influência do grupo político [FROM.GetCommunistParty] n[FROM.GetNameDef] começa a mostrar resultados. Seus representantes cruzaram a China para nos informar sobre um grupo [FROM.GetAdjective] de voluntários que está se mobilizando para apoiar nossas tropas. Além disso, essa força está trazendo equipamentos extras para ajudar a equipar nossos próprios soldados."
 AST_diplomatic_events.65.a: "Um bom começo para a cooperação com nossos camaradas do Estado [FROM.GetAdjective]."
 #AST_diplomatic_events.65.b: "They should focus on their own revolution"
 AST_diplomatic_events.66.t: "Governo [FROM.GetAdjective] agradece o nosso apoio" ### Support for the Chinese Communists - They accept
 AST_diplomatic_events.66.desc: "Representantes de [FROM.GetLeader] expressaram gratidão pelo envio de voluntários e pelo material bélico fornecido. A vasta experiência d[FROM.GetNameDef] em guerras civis garantirá o uso eficaz desses recursos."
 AST_diplomatic_events.66.a: "Um ótimo começo."
 AST_diplomatic_events.67.t: "Governo [FROM.GetAdjective] agradece o nosso apoio" ### Support for the Chinese Communists - They accept
 AST_diplomatic_events.67.desc: "Representantes de [FROM.GetLeader] expressaram gratidão pelo envio de voluntários e pelo material bélico fornecido. A vasta experiência d[FROM.GetNameDef] em guerras civis garantirá o uso eficaz desses recursos."
 AST_diplomatic_events.67.a: "Um ótimo começo."
 AST_diplomatic_events.68.t: "Exigências australianas"
 AST_diplomatic_events.68.desc: "A Austrália não deseja enfrentar sozinha [JAP.GetNameDef], seu inimigo mais preocupante. Eles estão nos pressionando a tomar a iniciativa e resolver o conflito que se aproxima o quanto antes."
 AST_diplomatic_events.68.a: "Parece que o jogo virou."
 AST_diplomatic_events.69.t: "Unidos novamente"
 AST_diplomatic_events.69.desc: "A relação entre [ENG.GetNameDef] e [AST.GetNameDef] enfrenta desafios, mas o governo [AST.GetAdjective] está determinado a superá-los. Com conexões e aliados dentro do governo britânico, seus líderes não têm como rejeitar essa relação. As nações voltarão a integrar a mesma facção e as Ilhas Britânicas e a nação do sul trabalhão lado a lado novamente."
 AST_diplomatic_events.69.a: "Que assim seja."
 AST_diplomatic_events.71.t: "Austrália reivindica ilhas no Pacífico"
 AST_diplomatic_events.71.desc: "O governo [AST.GetAdjective] exigiu o controle de nossas ilhas no Pacífico, alegando que a porção ocidental do oceano não deve estar sob comando d[USA.GetNameDef]. As ilhas podem ser um preço pequeno a se pagar para acalmar a hostilidade australiana, mas ainda acarretam custos. Arriscaremos provocar uma potência fascista em ascensão, mesmo estando tão sobrecarregados?"
 AST_diplomatic_events.71.a: "Não, não arriscaremos."
 AST_diplomatic_events.71.b: "As ilhas do Pacífico continuarão sendo nossas."
 AST_diplomatic_events.72.t: "A transferência das ilhas do Pacífico d[USA.GetNameDef]"
 AST_diplomatic_events.72.desc: "Já sobrecarregado de problemas, o governo [USA.GetAdjective] decidiu que as ilhas do Pacífico são um pequeno preço a se pagar a fim de apaziguar a hostilidade australiana. Suas ilhas agora são nossas."
 AST_diplomatic_events.72.a: "Excelente."
 AST_diplomatic_events.73.t: "Governo [USA.GetAdjective] recusa"
 AST_diplomatic_events.73.desc: "O governo [USA.GetAdjective] se recusou a nos entregar suas ilhas do Pacífico. Apesar de nossas exigências e da crescente influência que exercemos sobre o Pacífico, Washington continua relutante em abrir mão de seu controle sobre as ilhas."
 AST_diplomatic_events.73.a: "As ilhas não serão nossas, por enquanto."
 AST_diplomatic_events.74.t: "Austrália exige transferência das Filipinas"
 AST_diplomatic_events.74.desc: "Buscando expandir seus territórios, o governo [AST.GetAdjective] exigiu o controle d[PHI.GetNameDef]. Caso recusemos, ameaçam declarar guerra, considerando simplesmente inaceitável que o Estado [USA.GetAdjective] mantenha territórios dentro da esfera de influência d[AST.GetNameDef]."
 AST_diplomatic_events.74.a: "Não podemos arriscar uma guerra. Vamos ceder às exigências."
 AST_diplomatic_events.74.b: "As Filipinas continuarão sendo nossas!"
 AST_diplomatic_events.75.t: "A transferência d[PHI.GetNameDef]"
 AST_diplomatic_events.75.desc: "É evidente que a ascensão d[AST.GetNameDef] como potência fascista começa a trazer certos benefícios, fazendo as nações tremerem diante de nossa ira. O governo [USA.GetAdjective] concordou e o território [PHI.GetAdjective] agora é nosso."
 AST_diplomatic_events.75.a: "Uma nova ordem emerge."
 AST_diplomatic_events.76.t: "Governo [USA.GetAdjective] recusa"
 AST_diplomatic_events.76.desc: "O governo [USA.GetAdjective] se recusou a nos entregar [PHI.GetNameDef]. Apesar de nossas exigências e da crescente influência que exercemos sobre o Pacífico, Washington continua relutante em abrir mão de seu controle sobre o território."
 AST_diplomatic_events.76.a: "Então é guerra."
 AST_diplomatic_events.78.t: "Governo [AST.GetAdjective] solicita garantias contra o gigante"
 AST_diplomatic_events.78.desc: "O governo [AST.GetAdjective] compartilha conosco seus ousados objetivos:\n\n\"A sombra d[USA.GetNameDef] paira sobre nós, ameaçando intervir sempre que nossas ações não se alinham aos seus interesses. Com uma potência global de tal magnitude se intrometendo nos assuntos australianos e japoneses, a Ásia Oriental jamais será verdadeiramente nossa. Chegou a hora da [AST.GetNameDef] entrar em guerra.\"\n\nO primeiro-ministro [AST.GetLeader] deixa claro suas intenções de que pretende enfrentar [USA.GetNameDef] e solicita nossa assistência caso os americanos se mostrem poderosos demais para que sejam enfrentados sozinhos."
 AST_diplomatic_events.78.a: "Concederemos essa garantia."
 AST_diplomatic_events.78.b: "O governo [JAP.GetAdjective] tem seus próprios problemas a resolver."
 AST_diplomatic_events.79.t: "Governo [JAP.GetAdjective] garante [AST.GetNameDef]"
 AST_diplomatic_events.79.desc: "Está claro, não apenas para nós, que a interferência d[USA.GetNameDef] na diplomacia da Ásia e da Oceania é tanto indesejável quanto inaceitável. O governo [JAP.GetAdjective] nos concedeu garantias e assim podemos enfrentar nossos adversários de cabeça erguida, sabendo que um aliado virá em nosso auxílio caso os americanos se mostrem poderosos demais para que os derrotemos sozinhos."
 AST_diplomatic_events.79.a: "Marchamos para a guerra."
 AST_diplomatic_events.80.t: "Governo [JAP.GetAdjective] se recusa a fornecer garantias"
 AST_diplomatic_events.80.desc: "A interferência d[USA.GetNameDef] na diplomacia da Ásia e da Oceania é tanto indesejável quanto inaceitável, mas parece que apenas nós enxergamos isso. O governo [JAP.GetAdjective] se recusa a nos fornecer garantias, nos deixando sozinhos diante de nossos inimigos."
 AST_diplomatic_events.80.a: "Então sozinhos lutaremos."
 AST_diplomatic_events.81.t: "Um encantador símbolo de união"
 AST_diplomatic_events.81.desc: "O interesse do primeiro-ministro britânico por animais sempre foi evidente, afinal sua coleção é bastante impressionante. Qualquer nova adição ao seu diversificado zoológico particular certamente seria apreciada, ainda mais se tratando de um exemplar exótico.\n\nO próprio [ENG.GetLeader] manifestou interesse no ornitorrinco australiano e, embora sua exportação esteja atualmente proibida devido aos riscos que o transporte representa para o pequeno animal, talvez valha a pena abrir uma exceção.\n\nDevemos atender ao desejo do primeiro-ministro como um símbolo de união?"
 AST_diplomatic_events.81.a: "[ENG.GetLeader] terá seu ornitorrinco."
 AST_diplomatic_events.81.b: "A proibição de exportação não será suspensa, nem mesmo para o primeiro-ministro."
 AST_diplomatic_events.82.t: "Um relato doloroso de [ENG.GetLeader]"
 AST_diplomatic_events.82.desc: "O transporte que partiu do porto de Melbourne há seis semanas, levando um ornitorrinco a bordo, chegou ao seu destino n[ENG.GetNameDef]. A chegada do navio, porém, não foi motivo de alegria, pois o animal estava morto. [ENG.GetLeader] lamenta a perda de sua mascote, a quem havia dado seu próprio nome enquanto aguardava sua chegada, mas afirma que os inimigos são culpados pelo ocorrido. Ao que parece, explosões de um ataque submarino assustaram o ornitorrinco a ponto de levá-lo à morte.\n\nContudo, o diário do tratador aponta outra causa provável: a temperatura do tanque do animal estava muito acima dos níveis aceitáveis.\n\nSeja como for, [ENG.GetLeader], o ornitorrinco, está morto, e o primeiro-ministro britânico continuará sem seu animal exótico."
 AST_diplomatic_events.82.a: "Uma notícia triste, de fato."
 AST_political_events.1.t: "Convocar um referendo"
 AST_political_events.1.desc: "Existem duas áreas nas quais nós, como governo, buscamos ampliar o controle federal: aviação e comercialização.\n\nNo que diz respeito à aviação, o objetivo é alterar a Constituição para conferir ao Parlamento da Comunidade o poder de legislação sobre navegação aérea e aeronaves.\n\nJá a reforma da comercialização visa permitir a cooperação entre a Comunidade e os Estados nesse setor, algo que não é permitido constitucionalmente hoje em dia.\n\nQual dessas opções devemos escolher para um referendo?"
 AST_political_events.1.a: "Aviação, para regular a navegação aérea em todo o território d[AST.GetNameDef]."
 AST_political_events.1.a.tt: "Assim que a reforma for aprovada:\n Adiciona §YReforma da aviação aprovada§!, que concede:\n Velocidade de pesquisa aérea: §G+15%§!\n Velocidade de construção de §Ybase aérea§!: §G+5%§!"
 AST_political_events.1.b: "Comercialização, para coordenar planos nacionais de comercialização agrícola."
 AST_political_events.1.b.tt: "Assim que a reforma for aprovada:\n Adiciona §YReforma de comercialização aprovada§!, que concede:\n Fator de fábricas de bens de consumo: §Y-10%§!"
 AST_political_events.2.t: "Referendo bem-sucedido"
 AST_political_events.2.desc.a: "A população aprovou a implementação de nossa reforma da aviação. Como a aviação não existia quando a Constituição Australiana foi redigida, é justo que o governo finalmente assuma autoridade sobre a navegação aérea e sua regulamentação. Em nome da segurança e da eficiência, leis unificadas para a aviação serão implementadas em todo o país."
 AST_political_events.2.desc.b: "A população aprovou a implementação de nossa reforma comercial. Com o poder de regulamentar os produtos agrícolas e sua comercialização, o governo agora poderá estabilizar os mercados e melhorar a cooperação entre os estados. A renda dos fazendeiros se tornará mais estável, assim como a economia nacional."
 AST_political_events.2.a: "O controle federal será ampliado!"
 AST_political_events.4.t: "O primeiro-ministro sucumbe"
 AST_political_events.4.desc: "Os líderes d[AST.GetNameDef] há muito trabalham sob a pressão dos preparativos para a guerra e, por fim, a tensão cobrou sua vítima mais ilustre: o primeiro-ministro faleceu de um ataque cardíaco.\n\nConsiderando o estado atual do mundo, sua liderança fará grande falta. Ainda assim, a Austrália deve seguir em frente com um novo líder no comando: [AST.GetLeader]."
 AST_political_events.4.a: "Uma tragédia nacional."
 AST_political_events.5.t: "Governo australiano endurece postura"
 AST_political_events.5.desc: "Um grupo de vozes desafiadoras e controversas surgiu: o Movimento Austrália Primeiro. O governo teme que suas intenções não sejam inteiramente democráticas e decidiu colocar o grupo, assim como seus membros, sob vigilância. A interferência dos democratas reduzirá nossa capacidade de organização e dificultará o recrutamento de novos membros."
 AST_political_events.5.a: "Só o tempo dirá qual é a real natureza desse movimento."
 AST_political_events.6.t: "O sesquicentenário de 1938"
 AST_political_events.6.desc: "Hoje mais cedo, enquanto a comemoração do sesquicentenário de 1938 acontecia e o desfile da \"Marcha da Austrália Rumo à Soberania\" passava pelas ruas principais de Sydney, um protesto ocorria no Australian Hall.\n\nAtivistas e grupos defensores dos direitos aborígenes se reuniram para chamar a atenção para o fato de o 150º aniversário não só ter marcado o início da colonização britânica, como também a discriminação constitucional dos povos aborígenes. Os ativistas exigiram novas leis para a educação e o cuidado dos povos aborígenes, assim como uma nova política que permita a elevação deles ao status de cidadãos."
 AST_political_events.6.a: "Ações devem ser tomadas."
 AST_political_events.7.t: "Pressão imperial"
 AST_political_events.7.desc: "Após eventos recentes, não há como negar que as políticas da Austrália estão mudando. O governo [ENG.GetAdjective] se movimentou para garantir que o governo d[AST.GetNameDef] permaneça seguindo um caminho adequado para uma nação sob a influência da Comunidade, na esperança de que um empurrãozinho pacífico na direção certa seja o bastante para manter a lealdade do domínio."
 AST_political_events.7.a: "Apesar das tentativas da Grã-Bretanha, o governo d[AST.GetNameDef] decidirá o próprio caminho."
 AST_political_events.8.t: "A guerra se aproxima"
 AST_political_events.8.desc: "$AST_war_is_coming_cat_desc$"
 AST_political_events.8.a: "Precisamos nos preparar."
 AST_political_events.9.t: "A disputa de Dalfram"
 AST_political_events.9.desc: "O que começou como uma disputa sobre o carregamento de ferro-gusa desencadeou algo muito maior. Trabalhadores em toda a Austrália estão abandonando seus postos em solidariedade, desafiando tanto o governo quanto a indústria. À medida que as greves se espalham e as tensões aumentam, a crise se intensifica e exige a renúncia daqueles que estão no poder. Assim, tendo falhado completamente em controlar a situação, o governo renuncia e deixa o posto de partido governante aberto para ser reivindicado pelo grupo político [AST.GetCommunistParty]."
 AST_political_events.9.a: "E nós o reivindicaremos."
 AST_canberra_air_disaster_events.1.t: "Desastre aéreo em Camberra"
 AST_canberra_air_disaster_events.1.desc: "Recebemos hoje a notícia de que uma aeronave Lockheed Hudson caiu nas proximidades de Camberra. Entre os dez ocupantes estavam o Chefe do Exército e integrantes do Estado-maior, que atendiam a uma convocação para uma reunião de gabinete. Todos eles, assim como a tripulação, perderam a vida na tragédia.\n\nAs causas do acidente permanecem um mistério, pois as condições climáticas eram ideais para o voo e a aeronave era pilotada por um experiente oficial da RAAF, o tenente de voo Robert Hitchcock.\n\nIndependentemente da causa, este é um dia sombrio para toda a nação – especialmente para as famílias e amigos das vítimas – e a Austrália agora aguarda a reação de seus líderes. Qual será a resposta?"
 AST_canberra_air_disaster_events.1.a: "Uma tragédia terrível."
 AST_canberra_air_disaster_events.1.a.tt: "Desbloqueia §Ydecisões de \"confiança no gabinete\"§! e a §Ymissão§! de salvar ou destituir o governo atual."
 AST_canberra_air_disaster_events.2.t: "Vitória do grupo político [AST.GetRulingParty]"
 AST_canberra_air_disaster_events.2.desc: "O governo atual conduziu com sucesso a Austrália diante da crise nacional após o desastre aéreo de Camberra. Como uma luz guia, o grupo político [AST.GetRulingParty] demonstrou sua confiabilidade e força em tempos difíceis, aumentando o apoio popular em todo o país."
 AST_canberra_air_disaster_events.2.a: "O futuro nos aguarda."
 AST_canberra_air_disaster_events.3.t: "Moção de censura"
 AST_canberra_air_disaster_events.3.desc: "Após a aprovação de uma moção de censura, o governo atual foi finalmente substituído e passou o poder, ainda que a contragosto, para seus sucessores. Depois de um período de instabilidade política e desconfiança pública, a Austrália está pronta para uma nova era."
 AST_canberra_air_disaster_events.3.a: "Uma nova liderança para ajudar a Austrália."
 AST_canberra_air_disaster_events.4.t: "Mudança de liderança"
 AST_canberra_air_disaster_events.4.desc: "Após um período de instabilidade política e desconfiança pública, o grupo político [AST.GetRulingParty] substitui sua liderança. Um voto majoritário forçou o primeiro-ministro a deixar o cargo, permitindo que seu sucessor assuma a posição."
 AST_canberra_air_disaster_events.4.a: "Esperamos que isso abra um novo caminho para a Austrália."
 AST_canberra_air_disaster_events.5.t: "Acusações australianas"
 AST_canberra_air_disaster_events.5.desc: "Em uma coletiva de imprensa, o governo [AST.GetAdjective] nos acusou de estar por trás de um recente acidente aéreo em seu território, que resultou na morte de diversos oficiais políticos.\n\nAs acusações são completamente infundadas, é claro, tornando a falta de respeito ainda mais maliciosa."
 AST_canberra_air_disaster_events.5.a: "As acusações são falsas, não precisamos agir."
 AST_canberra_air_disaster_events.5.b: "Isso não ficará impune."
 AST_canberra_air_disaster_events.6.t: "Retaliação do governo [JAP.GetAdjective]"
 AST_canberra_air_disaster_events.6.desc: "O governo [JAP.GetAdjective] não encarou nossas acusações com leveza, considerando-as um primeiro ato de agressão. [JAP.GetLeader] escalou o conflito, alegando que agora sua nação tem o pleno direito de invadir nossas terras."
 AST_canberra_air_disaster_events.6.a: "Não aumentaremos ainda mais as tensões."
 AST_canberra_air_disaster_events.6.b: "Isso não pode ficar sem resposta."
 INS_limited_war_events.1.t: "Esmagar a Malaia!"
 INS_limited_war_events.1.desc: "As linhas inimigas se romperam e nossos homens avançam sem oposição. Do outro lado do estreito, o Estado cliente britânico desmorona sob o peso da fúria popular. Os fantoches de Londres acreditaram que suas baionetas os protegeriam da História. Estavam enganados."
 INS_limited_war_events.1.a: "Merdeka! Liberdade!"
 INS_limited_war_events.1.b: "Um grande dia para a República."
 INS_limited_war_events.2.t: "Contraofensiva do Estado [FROM.GetAdjective]"
 INS_limited_war_events.2.desc: "Aquilo que deveria ser um ataque rápido contra o regime fantoche transformou-se em um fracasso amargo. As forças do Estado [FROM.GetAdjective], fortalecidas por seus mestres imperiais, expulsaram nossos homens do território disputado e agora o ocupam como donos da região. Todos os dias o rádio transmite notícias de suas glórias. Prosseguir significaria arriscar uma humilhação ainda maior, mas recuar seria admitir derrota diante de todo o arquipélago."
 INS_limited_war_events.2.a: "Retirem as tropas. Salvem o que ainda resta."
 INS_limited_war_events.2.b: "Não nos submeteremos a fantoches!"
 INS_limited_war_events.3.t: "Governo [FROM.GetAdjective] curva-se diante da República"
 INS_limited_war_events.3.desc: "Chegaram notícias de Kuala Lumpur. O governo fantoche, abandonado na hora decisiva por seus mestres de Londres, aceitou nossos termos em vez de ver suas cidades em chamas. As terras disputadas agora nos pertencem. Que esta lição sirva aos outros Estados clientes da região."
 INS_limited_war_events.3.a: "A Indonésia se ergue."
 INS_limited_war_events.4.t: "Governo [FROM.GetAdjective] rejeita nossos termos"
 INS_limited_war_events.4.desc: "O governo [FROM.GetAdjective] recusou nossa oferta com desdém. Os ministros fantoches, obedecendo às ordens vindas de Whitehall, declararam que nem um centímetro de terra será cedido e que a própria República deverá ser subjugada antes que as armas se calem."
 INS_limited_war_events.4.a: "Então deixemos que as armas falem."
 INS_limited_war_events.5.t: "Governo [FROM.GetAdjective] clama por nossa destruição"
 INS_limited_war_events.5.desc: "O governo [FROM.GetAdjective] abandonou o último pretexto de uma guerra comedida. Suas transmissões agora falam abertamente em desmantelar a República e repartir suas ilhas entre os antigos senhores coloniais. Não haverá um desfecho pacífico para este conflito. Ou a Indonésia resiste até o fim, ou deixará de existir."
 INS_limited_war_events.5.a: "Resistiremos ou cairemos juntos."
 INS_limited_war_events.6.t: "Avanço [FROM.GetAdjective] perde força"
 INS_limited_war_events.6.desc: "O avanço [FROM.GetAdjective] nos pegou desprevenidos e, por algum tempo, tememos o pior. Contudo, sua ofensiva perdeu ímpeto. Seus homens estão exaustos, suas linhas se estenderam demais e a bravata de Londres enfraquece a cada comunicado. A República ainda pode demonstrar magnanimidade e oferecer aos fantoches uma forma honrosa de abandonar este conflito, embora muitos afirmem que uma vitória total serviria melhor à causa do que uma solução moderada."
 INS_limited_war_events.6.a: "Apresente nossos termos."
 INS_limited_war_events.6.b: "Sem misericórdia para os fantoches."
 INS_limited_war_events.7.t: "Nossa ofensiva perdeu o ímpeto"
 INS_limited_war_events.7.desc: "Nosso avanço estagnou e, pior ainda, o inimigo percebeu isso. Uma exigência chegou do outro lado do estreito: devemos nos render agora e aceitar seus termos, ou veremos as listas de baixas crescerem enquanto nos encaminhamos para o mesmo desfecho. A escolha que nos oferecem é apenas o tamanho do funeral."
 INS_limited_war_events.7.a: "Melhor uma paz amarga do que uma guerra ainda pior."
 INS_limited_war_events.7.b: "A República não se rende."
 INS_limited_war_events.8.t: "Governo [FROM.GetAdjective] rejeita a capitulação"
 INS_limited_war_events.8.desc: "O governo [FROM.GetAdjective] respondeu à nossa proposta com desdém. Seus ministros proclamam que preferem ver em chamas cada kampong, de Penang a Johor, antes de conceder qualquer coisa à República. Assim, a guerra continua."
 INS_limited_war_events.8.a: "Que assim seja."
 INS_limited_war_events.9.t: "Governo [FROM.GetAdjective] pretende destruir a República!"
 INS_limited_war_events.9.desc: "Interceptações de rádio do comando inimigo confirmaram o pior. Não haverá acordo, nem paz moderada, nem retorno às linhas anteriores. Os fantoches e seus mestres de Londres exigem a rendição total da República, e que a Indonésia seja esmagada e suas ilhas devolvidas ao comando imperialista do qual as arrancamos. Para isso há apenas uma resposta."
 INS_limited_war_events.9.a: "A Indonésia resistirá!"
 ### AST - Union Control Events ###
 AST_union_control_events.1.t: "Agentes estrangeiros em nossos sindicatos"
 AST_union_control_events.1.desc: "Os serviços de inteligência apresentaram ao governo um relatório preocupante. Agentes comunistas australianos vêm se aproximando de lideranças sindicais locais, distribuindo material radical e incentivando os trabalhadores a se organizarem em linhas revolucionárias. O movimento ainda é pequeno, mas autoridades de segurança alertam que é exatamente assim que tais coisas começam. Devemos agir antes que a ameaça se consolide."
 AST_union_control_events.1.a: "Mantenha-os sob vigilância. Vamos observar e aguardar."
 AST_union_control_events.4.t: "Comunistas infiltrados tomam território [MAL.GetAdjective]"
 AST_union_control_events.4.desc: "Um relatório alarmante chegou ao governo. Uma operação coordenada tomou um de nossos estados e o declarou parte do governo revolucionário. A velocidade e a organização do ataque levantaram questões preocupantes. Nossos serviços de inteligência suspeitam que os insurgentes não agiram sozinhos e que forças estrangeiras podem tê-los guiado até nossos litorais. Aqueles que escaparam da tomada do território não se renderam; eles se reagruparam e agora empunham armas, determinados a reconquistar o que lhes foi tirado."
 AST_union_control_events.4.a: "Descubra quem está por trás disso. Esses insurgentes não manterão aquele território por muito tempo."
 AST_union_control_events.4.a.tt: "Forças de milícia anticomunistas se reuniram para resistir à ocupação comunista."
 AST_union_control_events.5.t: "O desastre [MAL.GetAdjective]"
 AST_union_control_events.5.desc: "A operação terminou em catástrofe. Nossas tropas nem conseguiram desembarcar; foram repelidas por patrulhas lealistas, perderam-se nos estreitos ou foram capturadas antes de estabelecer uma posição. Os detalhes permanecem obscuros, mas o resultado é claro. Para piorar, a imprensa tomou conhecimento do episódio. Perguntas já são feitas no parlamento sobre o motivo de nossas forças estarem naquelas águas. A reação pública foi de choque e constrangimento. Quaisquer ganhos que esperávamos para a revolução terão de ser alcançados por outros meios."
 AST_union_control_events.5.a: "Um terrível revés. Devemos recorrer a outras vias para apoiar nossos camaradas."
 AST_union_control_events.3.t: "A revolução eclode na [MAL.GetNonIdeologyName]"
 AST_union_control_events.3.desc: "Os trabalhadores da [MAL.GetNonIdeologyName] se ergueram. Células comunistas, organizadas ao longo de nossa longa campanha, pegaram em armas por todo o país; mas os relatos vindos do campo de batalha são preocupantes. As forças revolucionárias acabaram concentradas nas áreas erradas, separadas do coração da península por mares e selvas. Sem uma posição firme no território continental, o governo simplesmente aguardará enquanto a revolução é sufocada antes que consiga se expandir. A Austrália precisa agir nas sombras e com urgência para desembarcar combatentes na península e assegurar que a revolução tenha o território necessário para sobreviver."
 AST_union_control_events.3.a: "Não podemos permitir que a revolução morra na praia. Devemos garantir um ponto de apoio."
 AST_union_control_events.2.t: "Agitadores apoiados pelo governo [AST.GetAdjective] estão em nossas ruas"
 AST_union_control_events.2.desc: "Agentes do governo comunista australiano chegaram às nossas cidades. Eles não tentam se esconder: panfletos são distribuídos nos portões das fábricas, discursos são feitos em praças públicas e redes de solidariedade são estabelecidas entre agentes australianos e grupos radicais locais. As redes de influência estrangeiras parecem ter sido revitalizadas da noite para o dia. Esta é uma campanha coordenada e o governo deve decidir como responder antes que o descontentamento popular se transforme em algo mais difícil de controlar."
 AST_union_control_events.2.b: "Um desenvolvimento alarmante."
 ###########################
 ##### ABDACOM EVENTS ######
 ###########################
 ABDA_events.1.t: "Um convite para um novo comando supremo"
 ABDA_events.1.desc: "O governo [FROM.GetAdjective] estabeleceu um comando supremo conjunto para o teatro de operações do Pacífico e nos convidou a participar. A iniciativa, conhecida como ABDACOM, busca reunir as forças navais, aéreas e terrestres das nações aliadas que operam na região sob uma estrutura de comando unificada. Aderir significaria cooperar mais de perto com [FROM.GetNameDef] e os demais parceiros já comprometidos com o esforço. Devemos decidir se aceitaremos."
 ABDA_events.1.a: "Ficaremos unidos."
 ABDA_events.1.b: "Não podemos nos comprometer neste momento."
 ABDA_events.2.t: "Governo [FROM.GetAdjective] se junta ao ABDACOM"
 ABDA_events.2.desc: "O governo [FROM.GetAdjective] aceitou nosso convite para integrar o comando supremo ABDACOM. Suas forças agora operarão sob a estrutura de comando conjunto, fortalecendo nossa posição no teatro de operações do Pacífico."
 ABDA_events.2.a: "Um desdobramento bem-vindo."
 ABDA_events.3.t: "Governo [FROM.GetAdjective] recusa-se a ingressar"
 ABDA_events.3.desc: "O governo [FROM.GetAdjective] recusou nosso convite para integrar o comando supremo ABDACOM. Por ora, suas forças não participarão do esforço conjunto, ainda que exista a possibilidade de futura adesão."
 ABDA_events.3.a: "Lamentável, mas compreendemos."
 ABDA_events.5.t: "Um convite para ingressar no ABDACOM"
 ABDA_events.5.desc: "O governo [FROM.GetAdjective] nos convidou a ingressar no Comando Americano-Britânico-Neerlandês-Australiano, ou ABDACOM. A iniciativa já se estabeleceu como a autoridade suprema de coordenação das forças dos Aliados no teatro de operações do Pacífico, reunindo as marinhas e os exércitos das principais potências aliadas sob um único comando. A adesão colocaria nossas forças dentro dessa estrutura unificada, garantindo acesso à inteligência compartilhada, à doutrina coordenada e ao pleno apoio dos Aliados. Precisamos decidir."
 ABDA_events.5.a: "Ficaremos unidos."
 ABDA_events.5.b: "Não podemos nos comprometer neste momento."
 ABDA_events.4.t: "As defesas de Singapura"
 ABDA_events.4.desc: "Com Singapura designada como alicerce do perímetro defensivo do ABDACOM, nossos comandantes devem decidir como investir em suas fortificações. Podemos priorizar os acessos navais e as defesas portuárias, reforçar as vias terrestres contra um ataque vindo do continente, ou distribuir nossos recursos entre ambas as frentes. Cada decisão moldará a maneira como Singapura poderá ser defendida quando o inimigo atacar."
 ABDA_events.4.a: "Reforce os acessos navais. A força de Singapura reside em seu porto."
 ABDA_events.4.b: "Fortifique o perímetro terrestre. A verdadeira ameaça virá por terra."
 ABDA_events.4.c: "Adote uma abordagem equilibrada. Nenhuma rota de ataque deve permanecer desprotegida."
 ABDA_fortress_singapore_choice_tt: "Ao concluir este foco, será apresentada uma decisão sobre como fortificar Singapura."
 ABDA_faction_membership_requirement_tt: "Os membros elegíveis da facção receberão convites para se juntar."
