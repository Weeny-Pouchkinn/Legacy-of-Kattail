 NZL_women_in_the_workforce: "Mulheres na força de trabalho"
 NZL_women_in_the_workforce_desc: "À medida que a escassez de mão de obra se intensifica, as mulheres avançam para ocupar papéis vitais em fábricas, fazendas e serviços públicos, garantindo que a produção não vacile sob a pressão da guerra. A expansão das oportunidades de treinamento e emprego nos permitirá sustentar a produção industrial enquanto mantemos a defesa nacional."
 NZL_restart_the_onekaka_ironworks: "Reiniciar as siderúrgicas de Onekaka"
 NZL_restart_the_onekaka_ironworks_desc: "As siderúrgicas de Onekaka já representaram nossa ambição de produzir ferro e aço internamente, reduzindo a dependência de suprimentos vindos do exterior. Para dar um impulso inicial à economia e aumentar a segurança nacional, há interesse em acender os fornos de Onekaka mais uma vez."
 NZL_new_zealand_steel_taog: "$NZL_new_zealand_steel$"
 NZL_new_zealand_steel_taog_desc: "$NZL_new_zealand_steel_desc$"
 NZL_scrap_metal_recycling: "Campanha de reciclagem"
 NZL_scrap_metal_recycling_desc: "Uma economia fortemente dependente de importações como a nossa não pode se dar ao luxo de desperdiçar recursos estratégicos. Para fortalecer nossa resiliência econômica, estabeleceremos instalações de reciclagem de sucata para processar e reutilizar metais e borracha."
 NZL_domestic_car_industry: "Investir em fábricas de montagem de veículos"
 NZL_domestic_car_industry_desc: "A produção de veículos n[ROOT.GetNameDef] tem se limitado à montagem de peças enviadas por fabricantes estrangeiros para a construção final aqui. Com nosso investimento recente na produção nacional de aço, talvez possamos começar a fabricar componentes por conta própria."
 NZL_department_of_scientific_and_industrial_research_taog: "$NZL_department_of_scientific_and_industrial_research$"
 NZL_department_of_scientific_and_industrial_research_taog_desc: "$NZL_department_of_scientific_and_industrial_research_desc$"
 NZL_project_seal_taog: "$NZL_project_seal$"
 NZL_project_seal_taog_desc: "$NZL_project_seal_desc$"
 NZL_industrial_conscription_taog: "$NZL_industrial_conscription$"
 NZL_think_big_taog: "$NZL_think_big$"
 NZL_industrial_conscription_taog_desc: "$NZL_industrial_conscription_desc$"
 NZL_think_big_taog_desc: "$NZL_think_big_desc$"
 NZL_expand_the_university_of_auckland_taog: "$NZL_expand_the_university_of_auckland$"
 NZL_expand_the_university_of_auckland_taog_desc: "$NZL_expand_the_university_of_auckland_desc$"
 NZL_national_broadcasting_service: "Serviço nacional de radiodifusão"
 NZL_national_broadcasting_service_desc: "Após a interferência dos Correios na eleição de 1935 e sua supervisão dos serviços estatais de radiodifusão, parece evidente que precisamos reformar a gestão da organização. Também devemos investir na atualização dos equipamentos de transmissão usados por ela."
 NZL_support_allies_with_meat: "Utilizar a indústria da carne"
 NZL_support_allies_with_meat_desc: "Nossos aliados no Pacífico muitas vezes estendem suas linhas de abastecimento até o limite. Para reduzir a pressão e manter suas tropas alimentadas, começaremos a fornecer carne a eles."
 NZL_support_allies_with_meat_tt: "Cada aliado receberá §G1§! §Yfábrica civil fora do mapa§!"
 AST_COMINWEALTH_FACTION: "Comunidade"
 AST_cominwealth_tech_sharing_tt: "Entraremos em um §Yacordo para compartilhar tecnologia§! com todos os membros de nossa facção."
 AST_modify_offshore_advancements_spirit_tt: "Modifica §Y$AST_offshore_advancements_spirit$§! em:"
 AST_gain_claims_on_japan_tt: "Ganharemos reivindicações sobre o §Yarquipélago japonês§!"
 AST_ireland_anti_british_pact_offer_accept_tt: "Se eles aceitarem:"
 AST_through_the_barricades_tt: "Se o governo §Y[ENG.GetAdjective]§! tiver pelo menos §Y10%§! de apoio comunista, os estivadores de §Y[132.GetCapitalVictoryPointName]§! se levantarão em nosso apoio no início da guerra!"
 AST_end_the_kingdom_ireland_join_tt: "Como [IRE.GetNameDef] assinou o pacto contra a Grã-Bretanha, eles entrarão na luta armada ao nosso lado assim que declararmos guerra contra [ENG.GetNameDef]."
 ###########################
 ##### FABDA BRANCH ########
 ###########################
 # Root
 ABDA_abdacom: "Estabelecer o ABDACOM"
 ABDA_abdacom_desc: "Com as potências inimigas avançando rapidamente pelo sudeste asiático e pelo Pacífico, forças aliadas na região devem agir em conjunto para impedi-las. Ao estabelecer um comando supremo conjunto, poderemos unir nossos recursos, coordenar ativos navais e apresentar uma frente unificada contra o inimigo."
 # Tier 1 - country-locked
 ABDA_fortress_singapore: "Fortificar Singapura"
 ABDA_fortress_singapore_desc: "Singapura é o alicerce da nossa estratégia defensiva na região. Reforçar as fortificações no país e fortalecer sua guarnição nos fará ganhar um tempo precioso em relação aos esforços mais amplos do ABDACOM e tirará do inimigo uma vitória estratégica rápida."
 ABDA_corps_expeditionnaire: "CEFEO"
 ABDA_corps_expeditionnaire_desc: "A Indochina Francesa está no flanco norte do perímetro defensivo do ABDACOM. Ao empregar o Corps Expéditionnaire Français en Extrême-Orient em operações ativas, o governo [FRA.GetAdjective] trará tropas e experiência vitais de suas forças coloniais ao comando conjunto."
 ABDA_maintain_strategic_flexibility: "Manter a flexibilidade estratégica"
 ABDA_maintain_strategic_flexibility_desc: "Os Estados Unidos não devem aplicar excessivamente suas forças a um único teatro de operações. Administrando a reserva estratégica cuidadosamente, garantiremos a mobilização do poder industrial e militar americano onde for necessário no Pacífico."
 # Tier 2
 ABDA_the_malay_barrier: "A barreira malaia"
 ABDA_the_malay_barrier_desc: "O arquipélago que se estende da Malaia até [INS.GetNameDef] forma uma barreira defensiva natural. As forças do ABDA devem tirar proveito dessa geografia, estabelecendo uma defesa terrestre e naval coordenada para conter o avanço inimigo."
 ABDA_develop_naval_infrastructure: "Desenvolver infraestrutura naval"
 ABDA_develop_naval_infrastructure_desc: "Operações navais contínuas no Pacífico requerem bases, depósitos de combustível e oficinas de reparo. Investir na infraestrutura de nossos portos e ancoragens estenderá o alcance e a resistência das forças navais do ABDA."
 # Tier 3
 ABDA_unified_naval_command: "Comando naval unificado"
 ABDA_unified_naval_command_desc: "Com as defesas terrestres estabelecidas e a infraestrutura instalada, o ABDA agora pode trazer todas as suas forças navais sob um comando unificado. Sinais padronizados, inteligência compartilhada e rotas de patrulha coordenadas multiplicarão a efetividade de cada embarcação no teatro de operações."
 # Tier 4
 ABDA_ship_a_day_sinking_quotas: "Cotas de navios afundados por dia"
 ABDA_ship_a_day_sinking_quotas_desc: "Linhas de abastecimento inimigas que se estendem pelo Pacífico são uma vulnerabilidade estratégica. Ao estabelecer cotas de navios afundados coordenadas e agressivas para nossas forças submarinas e terrestres, o ABDACOM poderá desmantelar a rede logística do inimigo e forçá-lo a uma postura defensiva."
 ABDA_naval_procurement: "Aquisição naval"
 ABDA_naval_procurement_desc: "As perdas já sofridas requerem substituições urgentes. Um programa de aquisição coordenado do ABDACOM priorizará contratorpedeiros, submarinos e navios de patrulha mais adequados para o teatro de operações no Pacífico, garantindo que nossa frota combinada faça frente à expansão inimiga."
 ABDA_keep_trade_open: "Manter o comércio aberto"
 ABDA_keep_trade_open_desc: "A borracha e o petróleo da [INS.GetNonIdeologyName] são essenciais para o esforço de guerra dos Aliados. O ABDACOM deve defender as vias marítimas que transportam esses recursos vitais, protegendo comboios contra a interdição inimiga e mantendo o fluxo comercial para nossas indústrias."
 # Tier 5 - capstone
 ABDA_expand_the_command: "Expandir o comando"
 ABDA_expand_the_command_desc: "O ABDACOM provou seu valor. Agora devemos ampliar essa base, estendendo a parceria para outras nações aliadas na região e aprofundando nosso compartilhamento de pesquisa e inteligência para continuarmos à frente do inimigo."
