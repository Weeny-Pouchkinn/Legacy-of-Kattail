 SIA_a_land_war_in_asia: "Uma guerra terrestre na Ásia"
 idea_SIA_land_war_in_asia: "Guerra terrestre na Ásia"
 # Alternative Communist Focus
 SIA_the_peoples_war_in_asia: "A guerra popular na Ásia"
 SIA_the_peoples_war_in_asia_desc: "O combate ao imperialismo [JAP.GetAdjective] não é uma simples competição entre Estados. É uma guerra de trabalhadores, camponeses e soldados contra as forças de dominação externas. Ao apoiar as forças comunistas na China, o governo [ROOT.GetAdjective] se comprometerá com uma guerra popular mais ampla na Ásia."
 SIA_peoples_war_in_asia_idea: "Guerra popular na Ásia"
 SIA_peoples_war_in_asia_idea_desc: "Uma guerra é sustentada por mais do que apenas formações comuns. Comitês locais, guias partisans e colunas de abastecimento de camponeses agora servem ao exército em campo. Cada vilarejo se torna um depósito, cada estrada pode virar uma emboscada e cada retirada é uma chance de atrair o inimigo para o interior do território."
 # Alternative Nationalist Focus
 SIA_national_defense_in_asia: "Defesa nacional na Ásia"
 SIA_national_defense_in_asia_desc: "A defesa da Ásia requer disciplina, hierarquia e um propósito estratégico comum. Ao apoiar o governo nacionalista da China, o estado [ROOT.GetAdjective] se junta a uma coalizão determinada a resistir à expansão d[JAP.GetNameDef] por meio de exércitos organizados e um comando coordenado."
 SIA_national_defense_in_asia_tt: "O Estado §Y[ROOT.GetFlag][ROOT.GetAdjective]§! se alinha às forças nacionalistas na Frente Unida.\nAdiciona §Y$SIA_national_defense_in_asia_idea$§!, que concede:\n $MODIFIER_ARMY_ORG_FACTOR$: §G+5%§!\n $MODIFIER_PLANNING_SPEED$: §G+10%§!\n $MODIFIER_MAX_PLANNING$: §G+10%§!\n $MODIFIERS_ARMY_DEFENCE_FACTOR$: §G+5%§!"
 SIA_stronger_together: "Mais fortes juntos"
 SIA_stronger_together_desc: "A guerra reduziu promessas distantes e alianças paralelas a pouco mais do que alguns obstáculos. Se o governo [ROOT.GetAdjective] tiver que definir o curso da Ásia, deveremos pedir aos nossos parceiros para vincular sua facção à nossa e aceitar um único comando no combate que se avizinha."
 idea_SIA_national_defense_in_asia: "Defesa nacional na Ásia"
 SIA_directorate_of_aeronautical_engineering_desc: "O futuro das forças aéreas d[ROOT.GetNameDef] não será garantido apenas por pilotos. Ele requer engenheiros, inspetores, oficinas e uma autoridade central capazes de transformar aquisições estrangeiras em aeronaves operacionais. A Junta de Engenharia Aeronáutica será a base desses esforços."
 idea_SIA_aeronautical_engineering_directorate: "Junta de Engenharia Aeronáutica"
 SIA_standardize_aircraft_maintenance: "Manutenção padronizada de aeronaves"
 SIA_standardize_aircraft_maintenance_desc: "Nossas aeronaves vêm de diferentes fontes, cada uma com suas próprias peças, ferramentas e diretrizes de reparo. Ao padronizar os procedimentos de manutenção sob a Junta, o governo [ROOT.GetAdjective] poderá manter mais aeronaves no ar e reduzir desperdícios causados pela confusão em terra."
 SIA_expand_aircraft_workshops: "Expandir oficinas de aeronaves"
 SIA_expand_aircraft_workshops_desc: "A Junta requer mais do que escritórios e relatórios de inspeção. Novas oficinas, máquinas-ferramentas e mecânicos treinados permitirão que aeronaves danificadas sejam reparadas em território nacional, e que os componentes simples possam ser produzidos sem depender de importações."
 SIA_license_modern_airframes: "Licenciar fuselagens modernas"
 SIA_license_modern_airframes_desc: "O governo [ROOT.GetAdjective] ainda não pode projetar todas as aeronaves de que precisa. Um caminho mais prático seria licenciar modelos estrangeiros, estudar a construção deles e adaptá-los, sob a supervisão da Junta, às nossas características, como clima, aeródromos e condições de abastecimento."
 SIA_tropical_air_operations: "Operações aéreas tropicais"
 SIA_tropical_air_operations_desc: "Calor, umidade, chuvas de monções e terrenos irregulares trazem seus próprios desafios para aeronaves e tripulações. Ao adaptar os motores, a frequência de manutenção e a doutrina para pilotos nessas condições, a Junta poderá tornar nossa Força Aérea mais confiável nos céus do sudeste asiático."
 ##########
 #### AUSTRALIA ####
 ###################
 effects_of_event_tt: "\n§YEfeitos do evento§!:"
 AST_war_is_coming: "A guerra se aproxima"
 AST_war_is_coming_desc: "Nas últimas três décadas enfrentamos um desafio após o outro, e ainda assim um teste final parece despontar no horizonte para provar, de uma vez por todas, a força da democracia australiana. O ex-primeiro-ministro Billy Hughes tem sido bastante claro sobre a questão, e seria irresponsável ignorar suas advertências de que, queiramos ou não, a guerra se aproxima."
 AST_war_is_coming_tt: "\nDesbloqueia §Yeleições democráticas§!"
 AST_war_is_coming_uap_advisors_tt: "(§Y$AST_billy_hughes$§!):"
 AST_war_is_coming_alp_advisors_tt: "(§Y$AST_james_scullin$§!):"
 AST_war_is_coming_decrease_advisors_tt: "(§Y$AST_maurice_blackburn$§!):"
 AST_war_is_coming_advisors_tt: "\nModifica o conselheiro político em:"
 AST_advance_pacific_initiatives: "Ampliar as Iniciativas do Pacífico"
 AST_advance_pacific_initiatives_desc: "Graças aos pactos de não agressão que conseguimos estabelecer, nossas relações com nossos vizinhos asiáticos melhoraram. Continuaremos a tirar proveito máximo dessas relações e pediremos para que nossos novos aliados nos ajudem em nosso desenvolvimento industrial."
 AST_advance_pacific_initiatives_tt: "\nPromulga um pacto de não agressão com:"
 AST_advance_pacific_initiatives_jap_tt: " §Y[JAP.GetName]§! para adicionar aos efeitos §G2§! §Yestaleiros§! fora do mapa."
 AST_advance_pacific_initiatives_ins_tt: " §Y[INS.GetName]§! para adicionar aos efeitos §G1§! §Yrefinaria sintética§! fora do mapa."
 AST_advance_pacific_initiatives_chi_tt: " §Y[CHI.GetName]§! para adicionar aos efeitos §G2§! §Yfábricas civis§! fora do mapa."
 AST_advance_pacific_initiatives_jap_2_tt: "§Y[JAP.GetName]§! oferece(m):"
 AST_advance_pacific_initiatives_ins_2_tt: "§Y[INS.GetName]§! oferece(m):"
 AST_advance_pacific_initiatives_chi_2_tt: "§Y[CHI.GetName]§! oferece(m):"
 AST_advance_pacific_initiatives_2_tt: "\nAs construções serão removidas se estiver em guerra com a nação relacionada."
 AST_pacific_initiatives_modifier: "Iniciativas diplomáticas"
 AST_domestic_industry: "Indústria doméstica"
 AST_domestic_industry_desc: "Não podemos depender das indústrias de defesa aliadas para nos abastecer em tempos de guerra. Precisaremos expandir nossas próprias indústrias se quisermos estar preparados para qualquer desafio."
 AST_a_democratic_bulwark: "Um baluarte democrático"
 AST_a_democratic_bulwark_desc: "Para resistir às ameaças fascistas e comunistas, a democracia deve pavimentar o caminho. O governo adotará uma política de medidas proativas para garantir que os cidadãos sejam representados dentro do aparato governamental e que o descontentamento político possa ser apaziguado pela aliança com diferentes partidos democráticos em vez de ideologias nocivas."
 AST_the_pacific_pact: "O Pacto do Pacífico"
 AST_the_pacific_pact_desc: "As Iniciativas do Pacífico de Lyons, em 1934, estabeleceram contato entre a Austrália e importantes nações asiáticas, permitindo que deixássemos de depender de autoridades britânicas para representar nossos interesses. Se pudermos utilizar essas relações para assegurar a não agressão das potências asiáticas contra a Austrália, esse será o objetivo máximo de nossos esforços diplomáticos. Pode ser uma tarefa desafiadora, mas certamente valerá a pena."
 AST_a_collapsing_league_of_nations: "Uma Liga das Nações em colapso"
 AST_a_collapsing_league_of_nations_desc: "A Liga das Nações está ruindo. Uma iniciativa nobre, mas construída sobre expectativas pouco realistas. Uma política de sanções facilmente se transforma em gestos vazios, ainda mais quando não há forças armadas capazes de conter nações rebeldes. Devemos iniciar nosso programa de rearmamento."
 AST_department_of_munitions: "Departamento de Munições"
 AST_department_of_munitions_desc: "Para abastecer adequadamente nossos homens na linha de frente, precisamos ampliar a fabricação de munições. A criação de um Departamento de Munições permitirá maior controle sobre a produção de materiais de defesa."
 AST_call_for_a_referendum: "Convocar um referendo"
 AST_call_for_a_referendum_desc: "Queremos aumentar o controle do governo federal, mas para isso precisamos primeiro da aprovação dos eleitores. Um referendo nos permitirá obter o consentimento do povo."
 AST_rural_concessions: "Concessões rurais"
 AST_rural_concessions_desc: "Os representantes rurais do Partido Agrário não têm votos suficientes para governar isoladamente, mas se acolhermos sua influência na política australiana, poderemos obter apoio adicional para nosso partido que está no poder atualmente."
 AST_rural_concessions_tt: "\nA §Y$AST_country_party_influence_uap$§! aumentará os votos para o partido que estiver no poder quando o foco for concluído."
 AST_solidarity_by_the_empire: "Solidariedade do império"
 AST_solidarity_by_the_empire_desc: "Até agora, o Império Britânico nos guiou tanto em tempos de guerra quanto de paz. Continuaremos a valorizar seus conselhos e a colaborar na preparação para potenciais conflitos."
 AST_solidarity_by_the_empire_modifier: "Solidariedade do império"
 AST_wool_agreement: "Acordo de Lã"
 AST_wool_agreement_desc: "Sendo a lã um dos maiores produtos comerciais da Austrália, sua exportação não apenas contribui para os lucros, como também melhora as relações com as nações importadoras. A Grã-Bretanha, no entanto, exige toda a produção, pretendendo usá-la em parte para os uniformes de seus soldados, mas também em negociações com potências que necessitam de lã. Cederemos às exigências britânicas."
 AST_australian_war_cabinet: "Gabinete de Guerra da Austrália"
 AST_australian_war_cabinet_desc: "A pedido do Reino Unido, instituiremos nosso próprio gabinete de guerra. Isso permitirá decisões mais rápidas e estratégicas, com um órgão dedicado exclusivamente às questões de segurança nacional."
 AST_singapore_strategy: "Estratégia de Singapura"
 AST_singapore_strategy_desc: "A Estratégia de Singapura é um componente central da política de defesa australiana e, como base para os navios da Marinha Real estacionados no Pacífico, o território de Singapura é de extrema importância. Convenceremos os britânicos a investirem em mais estruturas de defesa, ao mesmo tempo que reforçamos as capacidades navais australianas."
 AST_singapore_strategy_tt: "Depois de §Y180§! dias (§YSingapura§!):\n Adiciona §G2§! §Ybases aéreas§!.\n Adiciona §G2§! §Ybases navais§!.\n Adiciona §G1§! §Yforte costeiro§!."
 AST_british_war_cabinet: "Gabinete de Guerra da Grã-Bretanha"
 AST_british_war_cabinet_desc: "A guerra eclodiu, e o Reino Unido formou um gabinete de guerra para garantir a condução eficiente do esforço de guerra aliado. Também fomos convocados a apresentar nossa posição sobre o assunto, e assim o primeiro-ministro partirá para representar os interesses australianos."
 potential_consequence_tt: "§YPossível consequência§!:\n"
 AST_british_pacific_fleet: "Frota britânica do Pacífico"
 AST_british_pacific_fleet_desc: "A presença britânica no Pacífico será crucial tanto para nossa defesa quanto para a dissuasão de embarcações inimigas que buscam expandir sua dominância naval ao sul. Como parte do órgão [Root.GetFactionName], tomaremos medidas para estabelecer uma estrutura de comando conjunto que proteja nossas águas costeiras."
 AST_all_dressed_up: "Equipados para a guerra"
 AST_all_dressed_up_desc: "Se os soldados australianos lutam nas guerras da Grã-Bretanha, então as fábricas britânicas devem equipá-los."
 AST_overseas_loyalties: "Lealdades ultramarinas"
 AST_overseas_loyalties_desc: "Continuaremos contribuindo com as guerras ultramarinas, provando mais uma vez que nenhum território está fora do alcance das tropas australianas. As guerras não vêm até nós, nós é que vamos até elas."
 AST_the_ultimate_overseas_duty: "Dever ultramarino supremo"
 AST_the_ultimate_overseas_duty_desc: "O primeiro-ministro britânico negligenciou suas responsabilidades a tal ponto que a desconfiança se espalhou entre os próprios ministros. Menzies causou uma ótima impressão durante suas visitas para participar do Gabinete de Guerra da Grã-Bretanha, e algumas vozes já começam a insinuar que ele poderia ser uma alternativa melhor para os britânicos. Com ele no comando da Comunidade, poderemos utilizar a lealdade de Menzies ao governo [AST.GetAdjective] e aumentar nossa autoridade."
 AST_the_ultimate_overseas_duty_tt: "\nCom §Y$AST_robert_menzies$§! como líder §Yd[ENG.GetNameDef]§!, poderemos, no foco §Y$AST_a_change_of_authority$§!, nos tornar um §Y$autonomy_associated_dominion$§!."
 AST_pleading_britain: "Apelo à Grã-Bretanha"
 AST_pleading_britain_desc: "A guerra é inevitável, e nossas forças já sentem o peso da ameaça. Com todo o respeito ao espírito do ANZAC e à reputação dos \"Diggers\", a capacidade bélica da Austrália é incapaz de se sustentar sem o apoio [ENG.GetAdjective]. O primeiro-ministro enviará uma mensagem a [ENG.GetLeader] assim que possível."
 AST_bound_once_more: "Unidos novamente"
 AST_bound_once_more_desc: "Nossos caminhos se separaram, mas um dia se unirão novamente. [ENG.GetNameDefCap] e [AST.GetNameDef] estão passando por mudanças internas, mas o distanciamento que isso criou entre nós é meramente um efeito acidental e adverso; pelo menos da nossa parte. No futuro talvez voltemos a nos aliar mais uma vez, e então superaremos juntos os obstáculos de nossas nações em transformação."
 AST_eng_to_ast_faction_tt: "§Y[ENG.GetName]§! e seus súditos se juntam à facção §Y[AST.GetFactionName]§!."
 AST_faction_leader_tt: "Define como líder da facção §Y[AST.GetFactionName]§!"
 AST_eng_as_faction_leader_tt: "\n([ENG.GetFlag]§Y[ENG.GetName]§!) $AST_faction_leader_tt$."
 AST_australian_command: "Comando australiano"
 AST_australian_command_desc: "Com a importância da defesa e da segurança australiana, agora reconhecida até mesmo pelo governo [ENG.GetAdjective], precisamos reorganizar nossas forças conjuntas. Ao colocar mais tropas britânicas sob comando australiano, poderemos conduzir o esforço de guerra com maior eficiência."
 AST_taking_the_helm: "Tomando o leme"
 AST_taking_the_helm_desc: "Com a expansão de nossa influência no sudeste asiático, nossa capacidade naval deve aumentar para defender a região. Devemos priorizar um investimento contínuo na Marinha Real Australiana e garantir nosso controle sobre os mares orientais."
 AST_eastern_focus: "Foco oriental"
 AST_eastern_focus_desc: "Se as guerras britânicas são guerras australianas, então as guerras australianas também são guerras britânicas. A ameaça de uma invasão japonesa paira há muito tempo, e não aceitaremos mais ficar esperando que o conflito nos alcance. Mostraremos ao Japão a verdadeira determinação australiana, enquanto a Grã-Bretanha provará sua lealdade da forma mais ousada possível: com uma declaração de guerra."
 AST_eastern_focus_tt: "\nA missão permitirá que o governo §Yd[ENG.GetNameDef]§! declare guerra contra §Y[JAP.GetNameDef]§! imediatamente ou os forçará a fazer isso, caso não o façam dentro de 180 dias. O governo §Y[ENG.GetAdjective]§! poderá atrasar a data de conclusão da missão ao financiar a construção da infraestrutura de defesa na Austrália."
 AST_holding_the_battlefield: "Resistindo no campo de batalha"
 AST_holding_the_battlefield_desc: "Muitos soldados australianos deram suas vidas em combate no exterior, mas seus feitos têm sido atribuídos aos britânicos. A Austrália exige maior voz nas conferências de paz ao lado d[ENG.GetNameDef]; do contrário, nossas contribuições podem cessar."
 AST_holding_the_battlefield_tt: "§YCusto reduzido§! para ações de transformar em §Yfantoche§! ou §Ytomar estados§! em Conferências de Paz com §Y[ENG.GetNameDef]§!."
 AST_a_change_of_authority: "Uma mudança de autoridade"
 AST_a_change_of_authority_desc: "A Austrália passou de um súdito passivo a uma nação respeitável e assertiva. Está na hora de dar o último passo para o país se tornar uma potência mundial. Como liderança da facção [AST.GetFactionName], nossos aliados nos respeitarão e nossos inimigos nos temerão. Com uma posição firme e determinada, a Austrália não cederá."
 AST_a_change_of_authority_tt: " O governo §Y[ROOT.GetAdjective]§! agora pode declarar guerras.\n O governo §Y[ROOT.GetAdjective]§! agora pode recusar chamados para a guerra.\n O governo §Y[ROOT.GetAdjective]§! não transfere mais Pontuação de Paz para seu soberano."
 AST_reinforcements: "Reforços"
 AST_reinforcements_desc: "Prepararemos as regiões do norte, em grande parte subdesenvolvidas, com instalações defensivas e bases aéreas."
 AST_weekly_stability_tt: " Estabilidade Semanal: §G+1%§!"
 AST_ending_overseas_conscription: "Fim do alistamento no exterior"
 AST_ending_overseas_conscription_desc: "Nossos soldados devem abandonar imediatamente os litorais estrangeiros, pois são necessários aqui."
 AST_unlocking_conscription_1903_tt: "Necessário para desbloquear §Yleis de alistamento§!."
 AST_unlocking_further_conscription_tt: "Para §Yalistamento estendido§! ou §Yserviço militar obrigatório§!, também será necessário ter um dos seguintes focos: §Y$AST_british_pact$§! (Fascista), §Y$AST_refuse_british_wars$§! (Fascista), §Y$AST_toe_the_line$§! (Fascista), §Y$AST_from_picket_line_to_front_line$§! (Comunista) ou §Y$AST_part_with_colonizer$§! (Comunista)."
 AST_unlocking_conscription_tt: "Se você também tiver §Y$AST_invoke_the_1903_defence_act$§!, desbloqueará todas as §Yleis de alistamento§! restantes."
 AST_an_uncle_for_father_figure: "Um tio como figura paterna"
 AST_an_uncle_for_father_figure_desc: "Necessitamos de armamentos modernos e, por isso, recorreremos ao governo [USA.GetAdjective] com um pedido de fornecimento."
 AST_seven_million_britishers: "Sete milhões de britânicos"
 AST_seven_million_britishers_desc: "Embora [ENG.GetLeader] tenha hesitado em nos fornecer qualquer garantia, confiaremos em sua palavra e no comprometimento d[AST.GetNameDef] quando a hora chegar. Afinal, somos apenas sete milhões de britânicos."
 AST_seven_million_britishers_reinforcements_tt: "\n§YSe $AST_reinforcements$ não tiver sido concluído§!:"
 AST_seven_million_britishers_conscription_tt: "\n§YSe $AST_ending_overseas_conscription$ não tiver sido concluído§!:"
 AST_seven_million_britishers_uncle_tt: "\n§YSe $AST_an_uncle_for_father_figure$ não tiver sido concluído§!:"
 AST_we_endured: "Resistimos"
 AST_we_endured_desc: "A perspectiva de um conflito iminente pode ter sido assustadora no início, mas ela nos levou a acelerar a expansão de nossas capacidades defensivas. Resistimos e continuaremos firmes, agora totalmente comprometidos com nossa tarefa final: vencer a guerra."
 AST_under_the_rule_of_canberra: "Sob a autoridade de Camberra"
 AST_under_the_rule_of_canberra_desc: "A crescente tensão entre as nações do Pacífico é preocupante, e com a Grã-Bretanha ocupada em suas próprias batalhas, não podemos contar com sua ajuda. Se reconstruirmos a Comunidade Britânica de forma que as nações dos oceanos Pacífico e Índico sejam administradas diretamente de Camberra, poderemos nos unir sob uma única frente, mesmo sem [ENG.GetNameDef]."
 AST_its_fight_work_or_perish: "Lutar, trabalhar ou perecer"
 AST_its_fight_work_or_perish_desc: "A guerra começou, e apenas uma coisa resta: provar que estamos prontos para ela."
 AST_no_foreign_battlefields: "Sem campos de batalha estrangeiros"
 AST_no_foreign_battlefields_desc: "Após muito tempo, finalmente o governo declarará que nenhum cidadão será forçado a servir em campos de batalha estrangeiros."
 AST_no_foreign_battlefields_modifier: "Sem campos de batalha estrangeiros"
 AST_platypus_modifier: "Ornitorrinco de presente"
 AST_aerial_defense: "Defesa aérea"
 AST_aerial_defense_desc: "Se não temos condições de manter uma Marinha comparável à das grandes potências, ainda assim podemos sustentar uma força aérea capaz de rivalizar com qualquer inimigo que se oponha a nós."
 AST_ratify_westminster_adoption_act: "Ratificar a Lei de Adoção de Westminster"
 AST_ratify_westminster_adoption_act_desc: "Apesar da controvérsia que uma alteração em políticas há muito estabelecidas possa suscitar, já passou da hora de ratificarmos a Lei de Adoção de Westminster. A partir de agora, decidiremos por conta própria as guerras que travaremos."
 AST_ratify_westminster_adoption_act_tt: "£GFX_trigger_no Pode recusar o chamado à guerra"
 AST_administer_the_mandate: "Administrar o mandato"
 AST_administer_the_mandate_desc: "O Estado [AST.GetAdjective] governa Nova Guiné sob um mandato da Liga das Nações desde 1920, e Papua tem sido um território externo praticamente desde a Federação. Assim, a porção oriental de Papua-Nova Guiné seria uma adição natural aos territórios centrais d[AST.GetNameDef]. Agora que a Liga das Nações foi dissolvida, temos a oportunidade de realizar tal reorganização federal."
 AST_a_rational_request: "Uma solicitação racional"
 AST_a_rational_request_desc: "A Estratégia de Singapura se sustenta apenas na teoria. Henry Wynter e outras vozes firmes sempre estiveram certos: a Grã-Bretanha terá distrações em seu próprio continente caso ecloda uma guerra no Pacífico, e uma estratégia baseada no auxílio britânico não se sustentará. Solicitaremos o controle de Singapura para que nós mesmos sejamos responsáveis pela defesa de nossos oceanos."
 add_trait_to_theorist_tt: "Adiciona característica a §Yteórico§!:"
 AST_volunteers: "Voluntários"
 AST_volunteers_desc: "O poder de escolha é o que importa. A possibilidade de recusar o chamado às armas não significa que a Austrália deixará de lutar. Os australianos terão o direito de combater pelo que é justo, tanto em solo próprio quanto estrangeiro."
 AST_until_the_tide_of_battle_swings: "Até que a maré da batalha mude"
 AST_until_the_tide_of_battle_swings_desc: "Em uma declaração pública, deixaremos claro que não podemos mais ignorar a ameaça que surge em nossas fronteiras. Rejeitamos a ideia de que o conflito no Pacífico deva ser tratado como secundário; a Austrália deve se preparar para uma invasão imediatamente."
 AST_walls_and_whispers: "Muralhas e sussurros"
 AST_walls_and_whispers_desc: "Muralhas impenetráveis, aliadas a uma vigilância constante, criam um grande potencial para a segurança nacional. Tomaremos medidas para reforçar as defesas terrestres e costeiras em todo o nosso território e para estabelecer um quartel-general do serviço de inteligência."
 AST_united_states_as_our_keystone: "Os Estados Unidos como nosso pilar central"
 AST_united_states_as_our_keystone_desc: "Sabemos dos problemas que o Reino Unido enfrenta. Conhecemos os perigos de dispersar nossas forças, mas também sabemos que a Austrália pode cair enquanto a Grã-Bretanha ainda resiste. Portanto, estamos determinados a garantir que a Austrália não vá por esse caminho e direcionaremos nossos esforços para a elaboração de um plano cujo pilar central será os Estados Unidos."
 AST_liberty_loans: "Empréstimos de liberdade"
 AST_liberty_loans_desc: "Graças à sua experiência como tesoureiro, cargo no qual alguns o consideram o melhor que o país já teve, Ben Chifley demonstrou grande capacidade em administrar uma economia de guerra. Por sua recomendação, incentivaremos nossos cidadãos a transferir sua renda pessoal excedente para a poupança e a investir em empréstimos de guerra."
 AST_inevitably_independent: "Inevitavelmente independentes"
 AST_inevitably_independent_desc: "Embora o Partido Unido da Austrália sempre tenha valorizado a cidadania britânica, a indiferença d[ENG.GetNameDef] em relação aos interesses australianos nos forçou a declarar independência e priorizar nossas próprias defesas. Agora que o serviço ultramarino nas guerras britânicas deixou de ser uma questão, até mesmo os antilealistas estão mais inclinados a colaborar. Um alistamento mais amplo, portanto, encontrará menos resistência."
 AST_bring_on_the_giant: "Que venha o gigante"
 AST_bring_on_the_giant_desc: "Como uma nação finalmente unida e autônoma, nossa coragem será testada. Parece haver interesses comuns do outro lado do Pacífico e, com sua indústria militar bem desenvolvida, o governo [USA.GetAdjective] pode beneficiar tanto a si quanto à Austrália ao fornecer parte de seus abundantes suprimentos às nossas tropas."
 AST_bring_on_the_giant_tt: "  Se o Estado §Y[USA.GetAdjective]§! concordar:\n §Y+50§! unidades de §Ycomboio§! serão adicionadas ao estoque nacional."
 AST_allied_after_all: "Enfim, aliados"
 AST_allied_after_all_desc: "Embora a independência australiana tenha sido uma necessidade, continuaremos a colaborar com nosso antigo soberano. Como sempre, permaneceremos leais à facção [ENG.GetFactionName], mas buscaremos exercer maior influência."
 AST_the_pacific_resistance: "A resistência do Pacífico"
 AST_the_pacific_resistance_desc: "A independência australiana finalmente chegou, e é justo que nos afastemos do esforço de guerra britânico. Ao buscar uma união com [USA.GetNameDef], poderemos moldar estratégias de comando conjunto que valorizem os interesses australianos, enquanto assumimos de forma independente o controle total de nossa própria indústria de defesa e de sua expansão."
 AST_the_pacific_resistance_tt1: "A §YAustrália§! entra para §Y[USA.GetFactionName]§!."
 AST_the_pacific_resistance_tt2: "§Y[USA.GetName]§! entra para a §YResistência do Pacífico§!."
 AST_conscription_at_last: "Enfim, o alistamento"
 AST_conscription_at_last_desc: "A independência é gratificante, pois agora podemos priorizar nossa própria defesa; porém, isso também traz responsabilidades. O alistamento obrigatório não deve ser ampliado precipitadamente, mas tornou-se necessário diante da guerra iminente."
 AST_equal_training: "Treinamento igualitário"
 AST_equal_training_desc: "A cooperação com aliados não deve ser uma aposta hipotética, mas sim uma relação desenvolvida. A Austrália tomará a iniciativa de organizar campos de treinamento conjuntos para as nações da facção [ROOT.GetFactionName], garantindo que todos os soldados recebam um treinamento igualmente rigoroso."
 AST_a_northern_barrier: "Uma barreira no norte"
 AST_a_northern_barrier_desc: "O inimigo avança pelo norte, e no caminho encontram-se nações menores e despreparadas que estão à sua mercê antes que ele alcance nossas fronteiras. Se nos unirmos ao Estado [INS.GetAdjective] para formar uma única barreira defensiva, talvez ainda tenhamos uma chance de detê-los."
 AST_demand_resources: "Exigir recursos"
 AST_demand_resources_desc: "Agressores expansionistas cobiçam a Indochina não apenas por seu território, mas também pelos recursos que ela possui. Se essas riquezas caírem nas mãos do inimigo, a guerra apenas se prolongará, mas em nossas mãos poderão ajudar a encerrá-la. Exigiremos o controle desses recursos e, se seus detentores se recusarem a cooperar, não serão diferentes do inimigo."
 AST_demand_resources_tt: "Desbloqueia decisões de §Y$AST_resource_acquisition_cat$§! para solicitar uma parte dos recursos das nações do sudeste asiático."
 AST_reclaim_the_lost_territory: "Recuperar o território perdido"
 AST_reclaim_the_lost_territory_desc: "Durante o processo que uniu as colônias australianas em uma federação, a Nova Zelândia optou por não participar. Desde então, porém, a Constituição continua a definir a Nova Zelândia como um dos potenciais Estados da Comunidade Australiana, permitindo sua admissão. Lembraremos nossos vizinhos orientais disso e argumentaremos que a situação mundial atual exige união."
 AST_reclaim_the_lost_territory_tt: "([NZL.GetFlag]§Y[NZL.GetName]§!) Transfere todas as forças terrestres, navais e aéreas para §Y[AST.GetNameDef]§!"
 AST_australia_first: "Austrália em primeiro lugar"
 AST_australia_first_desc: "O vigor de extrema-direita do Partido do Centro foi breve, encerrando-se com a dissolução do partido em 1935. Contudo, algo novo começa a surgir, derivado das ideias do empresário e ativista político William John Miles. No entanto, se não forem tomadas medidas para mobilizar esses sentimentos, eles poderão desaparecer tão rapidamente quanto surgiram. Por isso, é necessário agir."
 AST_pankhurst_walsh: "Adela Pankhurst Walsh"
 AST_pankhurst_walsh_desc: "Com a constituição formal do Movimento Austrália Primeiro, nomearemos Adela Pankhurst Walsh como presidente. Fundadora da Guilda das Mulheres Australianas do Império, e mantendo fortes conexões com a Guilda das Mulheres sediada em Londres, Pankhurst Walsh sempre defendeu o valor da cidadania britânica. Esse valor constituirá o princípio fundamental do nosso movimento: a manutenção dos laços com a Grã-Bretanha."
 AST_stephensen: "P.R. Stephensen"
 AST_stephensen_desc: "Com a constituição formal do Movimento Austrália Primeiro, nomearemos P.R. Stephensen como presidente. Como conselheiro literário de William John Miles, Stephensen compartilha das visões isolacionistas e nacionalistas de seu mentor. Essas ideias formarão os dois princípios centrais da constituição do nosso movimento: a independência em relação à Grã-Bretanha e a unificação da cultura australiana."
 AST_stephensen_tt: "\nA escolha do presidente do §YMovimento Austrália Primeiro§! determinará possíveis ações no futuro."
 AST_a_growing_womens_guild: "Uma guilda de mulheres em crescimento"
 AST_a_growing_womens_guild_desc: "Desde a sua fundação em 1928, a Guilda das Mulheres Australianas do Império tem defendido a cooperação industrial para combater os problemas económicos nacionais. Para o bem da nação, os cidadãos devem apoiar o seu governo, e não agir contra ele. Com Pankhurst Walsh como presidente do Austrália Primeiro, podemos divulgar ainda mais essa mensagem através do seu movimento político."
 AST_realize_the_value_of_british_citizenship: "Perceber o valor da cidadania britânica"
 AST_realize_the_value_of_british_citizenship_desc: "A soberania d[ENG.GetNameDef] sobre [AST.GetNameDef] tem servido à nossa nação como escudo e luz-guia há muito tempo. Da Grã-Bretanha viemos e com a Grã-Bretanha permaneceremos — enquanto ela continuar a nos servir."
 AST_the_bolsheviks_counterforce: "A contraforça bolchevique"
 AST_the_bolsheviks_counterforce_desc: "A Agência de Investigação tem conduzido investigações sobre as atividades de grupos subversivos há décadas. Seu trabalho na repressão às ameaças de esquerda é de grande valor e não deve ser negligenciado pelo fato de os opositores do Austrália Primeiro se empenharem em resistir ao nosso crescimento. Procuraremos ocupar cargos no serviço de inteligência australiano e asseguraremos que a verdadeira ameaça à segurança nacional seja tratada com prioridade."
 AST_public_meetings_tt: "Desbloqueia decisões do §YMovimento Austrália Primeiro§! para mobilizar membros e angariar apoio ao fascismo."
 AST_rile_up_veterans: "Inflamar os veteranos"
 AST_rile_up_veterans_desc: "No início da Grande Depressão, os veteranos da Primeira Guerra Mundial uniram-se em grupos paramilitares de extrema-direita para conter a ascensão do comunismo. Embora esses grupos tenham se dissolvido, seus antigos membros não desapareceram, e o Austrália Primeiro os acolherá. A tocha do anticomunismo continuará a arder."
 AST_eureka_stockade_monument_rally: "Manifestação no monumento da Rebelião de Eureka"
 AST_eureka_stockade_monument_rally_desc: "Em 1854, na Batalha da Rebelião de Eureka, garimpeiros australianos lutaram intensamente contra as forças coloniais, em protesto contra o custo abusivo das licenças de mineração e à taxação das minas de ouro. O descontentamento com a soberania britânica era evidente naquela época e continua a sê-lo hoje. Vamos nos reunir junto ao monumento da batalha e nos manifestar a favor da separação da Grã-Bretanha."
 AST_australian_pivot_modifier: "Pivô australiano"
 AST_well-being_of_the_community: "Bem-estar da comunidade"
 AST_well-being_of_the_community_desc: "Os ideais cristãos de vida e família devem ser altamente valorizados pela população australiana. No entanto, tendo em conta as baixas taxas de natalidade dos últimos anos, é inegável que esses ideais não têm sido suficientemente respeitados. Para o bem-estar da comunidade, lançaremos uma campanha que promova a vida familiar."
 AST_covert_networks: "Redes secretas"
 AST_covert_networks_desc: "Com o Austrália Primeiro na Agência de Investigação, procuraremos estabelecer uma cooperação transfronteiriça com movimentos que partilhem dos mesmos ideais n[ENG.GetNameDef]. A aliança com o nosso soberano poderá ser útil de outra maneira, permitindo contatar secretamente aliados ideologicamente alinhados e expandir as nossas capacidades de inteligência."
 AST_refuse_british_wars: "Recusar as guerras britânicas"
 AST_refuse_british_wars_desc: "A campanha de Galípoli da Grande Guerra demonstrou a negligência com que o governo [ENG.GetAdjective] trata nossas forças expedicionárias, tornando a ideia de outra campanha estrangeira em seu nome completamente impensável. Os australianos afirmam que não derramarão mais sangue sob comando britânico, forçando o governo a agir. A Lei de Westminster será ratificada."
 AST_walls_like_uluru: "Muros como Uluru"
 AST_walls_like_uluru_desc: "A Austrália é um continente por si mesma. Se tivermos que resistir sem o escudo do império, então devemos construir o nosso. A defesa costeira será intensificada e os portos, fortificados. Qualquer inimigo que considera nossa nação um alvo fácil descobrirá que não seremos abordados facilmente."
 AST_at_the_gates: "Nos portões"
 AST_at_the_gates_desc: "O mundo está se encaminhando para a guerra e a Austrália não pode ser pega desprevenida. As fábricas e estaleiros da nação devem estar a todo vapor. Isso não é uma preparação para o conflito de terceiros, mas para nossa própria sobrevivência."
 AST_the_guild_for_the_war_effort: "A guilda pelo esforço de guerra"
 AST_the_guild_for_the_war_effort_desc: "A Guilda das Mulheres Australianas do Império foi criada para servir à Coroa. Seu propósito está sendo totalmente redirecionado. A vasta rede organizacional que ela construiu agora direcionará sua energia para as indústrias bélicas, hospitais e cadeias de abastecimento de uma Austrália autossustentável."
 AST_for_the_southern_cross: "Pelo Cruzeiro do Sul"
 AST_for_the_southern_cross_desc: "A imagem do Cruzeiro do Sul não paira sobre a Grã-Bretanha, mas sobre nós. A identidade australiana é real, uma conquista que deve ser defendida. Um novo orgulho nacional está sendo forjado, não emprestado de Londres ou definido por instituições distantes, mas cultivado aqui, neste solo sob estas estrelas."
 AST_through_the_gates: "Através dos portões"
 AST_through_the_gates_desc: "A preparação deu lugar à urgência. O Programa de Defesa Nacional está sendo expandido com todo o peso da indústria australiana por trás dele. Novas instalações estão se erguendo ao lado das já existentes, metas de produção foram elevadas e a linha que separa a produção civil da necessidade militar foi silenciosamente apagada."
 AST_toe_the_line: "Obedecer às regras"
 AST_toe_the_line_desc: "O conforto ao qual os australianos se acostumaram durante os anos de prosperidade deve agora ser deixado de lado. Racionamento, mais horas de trabalho e o chamado ao dever são o preço da independência. Aqueles que atenderem ao chamado encontrarão uma nação preparada para apoiá-los. Mas o Estado não deve ser condescendente com aqueles que acreditam que o sacrifício não se aplica a eles."
 AST_crush_the_gates: "Esmagar os portões"
 AST_crush_the_gates_desc: "A preparação da Austrália está completa. A indústria agora opera com plena capacidade bélica, sendo sua produção totalmente direcionada para a defesa e a projeção do poderio nacional. Seja lá qual for a tormenta, a Austrália passará por ela, e não será como um domínio relutante de mobilização displicente."
 AST_national_defense: "Defesa nacional"
 AST_national_defense_desc: "Por meio de investimento deliberado e direção nacional, a Austrália construiu uma base industrial capaz de sustentar a própria defesa. Fábricas e estaleiros operam sob a supervisão do Estado, sua produção medida não pelo lucro, mas pelas necessidades da nação."
 modify_AST_national_defense_tt: "Modifica §Y$AST_national_defense$§! em:"
 AST_nauru_pact: "Pacto de Nauru"
 AST_nauru_pact_desc: "Com o obstáculo inicial de tomar o poder ainda diante de nós, a questão da independência parece distante, porém a autonomia australiana não é apenas do nosso interesse. Em troca da garantia d[GER.GetNameDef] à nossa soberania – em caso de resistência britânica ao Austrália Primeiro ou de uma possível saída da Comunidade – nós, assim que chegarmos ao poder, devolveremos uma de suas ilhas perdidas no Pacífico: Nauru."
 AST_australian_culture_investments: "Investimentos na cultura australiana"
 AST_australian_culture_investments_desc: "Com seu ensaio \"Os Fundamentos da Cultura na Austrália\", Stephensen influenciou a formação do movimento poético Jindyworobak e deixou claro um ponto essencial: a cultura australiana deve ser priorizada. O governo parece negligenciar completamente o valor de artistas e escritores, mas nós faremos diferente. Estimularemos o desenvolvimento cultural mobilizando os apoiadores tanto do Jindyworobak quanto do Austrália Primeiro."
 AST_australian_culture_investments_tt: "\nDepois de §Y365§! dias:"
 AST_australia_first_party_focus: "Partido Austrália Primeiro"
 AST_australia_first_party_focus_desc: "A quantidade de membros do Austrália Primeiro cresceu tanto que o avanço do movimento já não pode mais ser contido. Chegou a hora de o povo australiano acolher a mais nova e incisiva voz nacionalista: o Partido Austrália Primeiro."
 AST_australia_first_party_req_tt: "O §YPartido Austrália Primeiro§! foi fundado."
 AST_in_from_the_cold: "De volta à segurança"
 AST_in_from_the_cold_desc: "O Austrália Primeiro e seus apoiadores não precisam mais se esconder. Os maus-tratos que nossa nação sofreu sob a longa sucessão de governos anteriores finalmente foram revelados, e chegou a hora de novas vozes serem ouvidas."
 AST_absorb_the_uap: "Absorver o PUA"
 AST_absorb_the_uap_desc: "Embora o Partido Unido da Austrália sempre tenha sido liberal, sua inclinação à direita é evidente. No entanto, com um novo partido político no comando, os membros do PUA podem não ter muita escolha a não ser apoiar a causa do governo atual. Entraremos em contato com os membros mais proeminentes e os recrutaremos para o Partido Austrália Primeiro."
 AST_big_business_pact: "Pacto das grandes empresas"
 AST_big_business_pact_desc: "Ao defender as indústrias nacionais, o Partido Austrália Primeiro conquistou o apoio de importantes líderes empresariais. Em troca da adoção de políticas que ampliem seus lucros, eles apoiarão os nossos objetivos políticos e militares."
 AST_big_business_pact_tt: "\nDesbloqueia decisões de §YPacto com grandes empresas§! para influenciar as metas dos setores da indústria e construção."
 AST_autarky: "Autarquia"
 AST_autarky_desc: "Depender do comércio exterior é um grande risco, especialmente em tempos de conflito. As indústrias australianas devem ser priorizadas, e não sufocadas por importações. Somente ao restringir nossas leis comerciais poderemos proteger a economia interna e garantir que a Austrália seja autossuficiente."
 AST_energy_independence: "Independência de energia"
 AST_energy_independence_desc: "Depender do comércio exterior é um grande risco, especialmente em tempos de conflito. A independência do setor de energia é vital para garantir que a Austrália possa continuar funcionando até nos momentos mais difíceis. Investir em refinarias permitirá fortalecer a produção interna de energia."
 remove_2_offsite_dockyard: "Remove §R2§! §Yestaleiros navais§! fora do mapa."
 AST_british_pact: "Pacto britânico"
 AST_british_pact_desc: "Apesar de nossa recente separação da Comunidade Britânica, é do interesse d[AST.GetNameDef] continuar cooperando com sua antiga metrópole. Considerando como o Estado [ENG.GetAdjective] está sobrecarregado ao redor do mundo, nossa disposição em compartilhar esse fardo por meio da cooperação militar deve ser valorizada."
 AST_naurus_return_to_german_hands: "Nauru retorna ao controle alemão"
 AST_naurus_return_to_german_hands_desc: "Agora que o Austrália Primeiro está no comando da nação, chegou o momento de cumprirmos a promessa de Nauru, e de nossos aliados alemães cumprirem sua parte do acordo. O Estado [AST.GetAdjective] finalmente se libertará das correntes da Comunidade e deixará os britânicos sem qualquer voz no assunto."
 AST_naurus_return_to_german_hands_tt: "O \"§YPacto de Nauru§!\" torna-se ativo."
 AST_naurus_return_to_german_hands_tt_2: "O \"§YPacto de Nauru§!\" está ativo."
 AST_the_winner_takes_it_all: "O vencedor leva tudo"
 AST_the_winner_takes_it_all_desc: "Embora sacrificar a ilha de Nauru pela cooperação alemã tenha parecido razoável antes, já não faz mais sentido. Com nossas capacidades comprovadas, buscaremos expansão nas Ilhas Salomão e na Nova Zelândia, mesmo que isso aprofunde nossa traição ao Pacto de Nauru. Afinal, as Ilhas Salomão se tornarão mais um território alemão perdido para a Austrália."
 AST_resist_western_intruders: "Resistir aos invasores ocidentais"
 AST_resist_western_intruders_desc: "As nações ocidentais insistem em se intrometer nos assuntos do Pacífico, mas isso acaba agora. Alcançaremos seus litorais antes que cheguem aos nossos, mostrando que o Estado [AST.GetAdjective] não se submete a exigências."
 AST_invasion_preparation_tt: "Tempo de preparação de invasão: §G-20%§!"
 AST_naval_invasion_penalty_tt: "Penalidade de invasão: §G-20%§!"
 AST_expand_the_fort: "Expandir o forte"
 AST_expand_the_fort_desc: "A porção ocidental do Pacífico não pertence ao Estado [USA.GetAdjective]. As ilhas reivindicadas por eles pertencem às nações do leste asiático e, à medida que a influência australiana cresce, seremos nós a reivindicá-las. "
 AST_integrate_the_fort: "Integrar o forte"
 AST_integrate_the_fort_desc: "O Estado [AST.GetAdjective] governa Nova Guiné sob um mandato da Liga das Nações desde 1920, e Papua tem sido um território externo praticamente desde a Federação. Assim, a porção oriental de Papua-Nova Guiné seria uma adição natural aos territórios centrais d[AST.GetNameDef]. Como parte de nossos esforços para unificar a cultura australiana, esse será o próximo passo."
 AST_defying_american_interference: "Desafiando a interferência americana"
 AST_defying_american_interference_desc: "A sombra d[USA.GetNameDef] paira sobre nós, ameaçando intervir sempre que nossas ações não se alinham aos seus interesses. Com uma potência global de tal magnitude fechando seu punho de ferro em torno d[PHI.GetNameDef], as nações do leste asiático nunca serão plenamente donas de si. O Estado [AST.GetAdjective] não se submeterá à autoridade de invasores estrangeiros. As Filipinas serão nossas."
 AST_the_pacific_garrison: "A guarnição do Pacífico"
 AST_the_pacific_garrison_desc: "Apesar de a proteção do sudeste asiático e do Pacífico ser de interesse da Grã-Bretanha, a região fica longe das Ilhas Britânicas. Em troca de seu apoio em suprimentos, ofereceremos assumir o comando da defesa do território, permitindo que o governo [ENG.GetAdjective] direcione sua atenção para outros lugares."
 AST_vichy_out_of_africa: "Expulsar Vichy da África"
 AST_vichy_out_of_africa_desc: "A queda ou cooperação da França de Vichy é um dos principais objetivos d[ENG.GetNameDef]. Como gesto de boa-fé, o governo [AST.GetAdjective] também participará e avançará sobre as colônias africanas francesas até que sejam subjugadas."
 AST_vichy_out_of_africa_tt1: "Adiciona reivindicações sobre territórios da §YFrança de Vichy§! na §YÁfrica§! por meio do foco §YExpulsar Vichy da África§!.\n"
 AST_vichy_out_of_africa_tt2: "Adiciona reivindicações sobre territórios da §YFrança de Vichy§! na §YÁfrica§! por meio de decisões de §YExpulsar Vichy da África§!.\n"
 AST_vichy_africa_claim_flag: "Reivindicações §Yd[AST.GetNameDef]§![AST.GetFlag] sobre todos os territórios da §YFrança de Vichy§! na §YÁfrica§! são adicionadas a §YO fim da interferência§!."
 AST_vichy_claim_tt: "Reivindicações §Yd[AST.GetNameDef]§![AST.GetFlag] são adicionadas a §YO fim da interferência§!."
 vichy_in_africa_trigger: "§YFrança de Vichy§!: Qualquer estado controlado:\n    Está na §YÁfrica§!"
 vichy_wargoal: "Ganha o objetivo de guerra §YAnexar§! contra a §YFrança de Vichy§!."
 AST_britain_supplying_ships: "Navios de suprimento britânicos"
 AST_britain_supplying_ships_desc: "Ao carregar o peso de proteger as praias dos aliados britânicos, ficou claro que a frota d[ROOT.GetNameDef] precisa ser expandida. É justo que o governo [ENG.GetAdjective] nos forneça navios."
 AST_hand_in_glove: "Uma mão lava a outra"
 AST_hand_in_glove_desc: "Ao expandir para o norte, poderemos aumentar a influência australiana sobre a diplomacia e os conflitos do sudeste asiático. Já nos provamos capazes de garantir os interesses britânicos, bem como os nossos, portanto [ENG.GetNameDef] precisa entender por que seria melhor deixar seus territórios remotos sob nossos cuidados."
 AST_claim_french_indochina: "Reivindicar a Indochina Francesa"
 AST_claim_french_indochina_desc: "Com o destino da França indefinido, o futuro de suas colônias também é incerto. Outras nações podem tentar colocar suas mãos gananciosas sobre a Indochina Francesa, mas não prevalecerão sobre as nossas."
 AST_undeniably_ours: "Indiscutivelmente nosso"
 AST_undeniably_ours_desc: "Independentemente do que a diplomacia possa nos conceder, ela nunca nos dará tudo. Em seu estado frágil, as fronteiras da França de Vichy são meras sugestões, e abrir mão da oportunidade de ocupar totalmente suas terras seria extremamente imprudente. Chegou o momento inevitável da guerra."
 AST_done_meddling: "O fim da interferência"
 AST_done_meddling_desc: "Sempre leal à velha pátria, [AST.GetNameDef] continua lutando as batalhas dos britânicos com orgulho. O povo australiano é confiável, mas isso não significa que deva ser usado como massa de manobra. Enquanto [AST.GetNameDef] lutar pel[ENG.GetNameDef], [ENG.GetNameDef] também lutará pel[AST.GetNameDef]."
 AST_northern_advancement: "Avanço ao norte"
 AST_northern_advancement_desc: "Embora a Austrália prefira concentrar-se em seus próprios assuntos políticos, não seremos deixados em paz a menos que nos tornemos uma ameaça. O Estado [INS.GetAdjective] é uma nação como a nossa, vítima de invasores europeus que se recusam a partir. Ao reivindicar esse território, enviaremos uma mensagem clara: as nações do Pacífico devem ser deixadas em paz."
 AST_soothing_australian_fears: "Acalmando os temores australianos"
 AST_soothing_australian_fears_desc: "Embora alguns membros do governo acreditem na possibilidade de cooperação entre a Austrália e o Japão, o povo australiano não compartilha dessa visão. Após tanto tempo temendo uma invasão japonesa, a ideia de se aliar a esse mesmo agressor em potencial é difícil de aceitar. Assim, acalmaremos esses temores nos preparando para a guerra."
 AST_soothing_australian_fears_tt: "\nDepois de §Y180§! dias:"
 AST_dividing_the_pacific: "Dividindo o Pacífico"
 AST_dividing_the_pacific_desc: "O Movimento Austrália Primeiro defende a paz com [JAP.GetNameDef] e, ao contrário da maior parte dos cidadãos australianos, define essa nação como um potencial aliado do Pacífico em vez de uma ameaça constante. À medida que o poder d[AST.GetNameDef] aumenta, é razoável que o Estado [JAP.GetAdjective] pense de modo semelhante, e que os possíveis conflitos entre nossas nações sejam resolvidos antes mesmo de surgirem."
 AST_dividing_the_pacific_ast_gain_tt: "[GET_AST_DIVIDING_THE_PACIFIC_AST_GAIN]"
 AST_dividing_the_pacific_jap_gain_tt: "[GET_AST_DIVIDING_THE_PACIFIC_JAP_GAIN]"
 AST_dividing_the_pacific_tt1: "§GNós ganhamos§!:"
 AST_dividing_the_pacific_tt2: "§REles ganham§!:"
 AST_dividing_the_pacific_tt3: "O Estado §Y[AST.GetAdjective]§! transfere os seguintes territórios controlados:"
 AST_against_war_and_fascism: "Contra a guerra e o fascismo"
 AST_against_war_and_fascism_desc: "O Movimento Contra a Guerra e o Fascismo é o ramo australiano de um esforço internacional patrocinado pela Comintern para mobilizar trabalhadores contra forças reacionárias. Embora tenha perdido força nos últimos anos, cabe a nós levar sua bandeira adiante mais uma vez."
 AST_world_peace: "Paz mundial"
 AST_world_peace_desc: "O Movimento Contra a Guerra e o Fascismo vem se dedicando à produção de uma revista intitulada \"World Peace\", que expõe os males do movimento fascista na Alemanha, na Itália e especialmente durante a Guerra Civil Espanhola. Impulsionados pelos artigos, voluntários estão ansiosos para se juntar à luta contra o fascismo."
 AST_red_fred: "\"Fred Vermelho\""
 AST_red_fred_desc: "\"Fred Vermelho\" Paterson ganhou destaque no movimento comunista como candidato a prefeito de Brisbane em 1934, quando sofreu uma derrota esmagadora. Porém suas ambições permanecem intactas, e agora ele concorre a vereador em Townsville. Com nosso apoio, ele pode se tornar o primeiro comunista eleito para um cargo público."
 AST_workers_defence_corps_sparks_anew: "O renascimento do Corpo de Defesa dos Trabalhadores"
 AST_workers_defence_corps_sparks_anew_desc: "O Corpo de Defesa dos Trabalhadores foi originalmente formado para proteger piquetes e greves. Com o aumento da agressividade de grupos como a Nova Guarda, foi reorganizado para novamente atuar como um escudo para aqueles que protestam por melhores direitos e oportunidades."
 AST_a_controversial_recruitment: "Um recrutamento controverso"
 AST_a_controversial_recruitment_desc: "Maurice Blackburn é um conhecido advogado socialista, renomado por defender os direitos dos trabalhadores em batalhas judiciais contra empregadores opressores. Membro do Partido Trabalhista, sua lealdade foi questionada devido a seus vínculos com o mais radical Movimento Contra a Guerra e o Fascismo."
 AST_from_picket_line_to_front_line: "Da linha de piquete à linha de frente"
 AST_from_picket_line_to_front_line_desc: "À medida que as táticas de intimidação daqueles que se opõem à libertação da classe trabalhadora se tornam mais agressivas, nossas próprias defesas devem evoluir em resposta. A cada incidente, os trabalhadores se tornam mais determinados, e um número crescente está se apresentando para se juntar ao Corpo de Defesa."
 AST_pig_iron_protests: "Protestos pelo ferro-gusa"
 AST_pig_iron_protests_desc: "Nossos estivadores discordam do governo em muitos casos, especialmente no que tange à venda de ferro-gusa para países em guerra. Os australianos não têm interesse em participar da agressão ou do transporte de equipamentos usados contra civis inocentes, e o Estado [AST.GetAdjective] deve aderir à causa. Convoque uma greve."
 AST_part_with_colonizer: "Romper com os colonizadores"
 AST_part_with_colonizer_desc: "A raiz de nossas dificuldades jaz no Império Britânico e no sistema capitalista que ele impôs a distância. Basta. Com a Grã-Bretanha distraída por crises mais próximas de casa, agora é o momento de assumir nosso destino e traçar nosso próprio caminho como uma nação livre e independente."
 AST_take_it_to_the_streets: "Mobilizar as ruas"
 AST_take_it_to_the_streets_desc: "A ação industrial é uma das ferramentas mais poderosas que possuímos para forçar mudanças na sociedade e devemos usá-la contra um sistema projetado apenas para explorar. Chegou a hora de retomar os meios de produção. Trabalhadores da Austrália, uni-vos!"
 AST_workers_educational_association: "Associação Educacional dos Trabalhadores"
 AST_workers_educational_association_desc: "A Associação Educacional dos Trabalhadores é uma organização internacional dedicada a tornar a educação acessível à classe trabalhadora. Devemos estabelecer nossa própria vertente, pois a verdadeira igualdade de oportunidades começa na sala de aula."
 AST_off_leash: "Fora da coleira"
 AST_off_leash_desc: "Os estivadores são a espinha dorsal da ação sindical na Austrália. Sendo uma ilha de dimensões continentais, não surpreende que o trabalho marítimo desempenhe um papel tão vital em nossa economia. Chegou a hora de tirar as coleiras e soltar os lobos do mar da indústria."
 AST_a_national_housing_commission: "Uma comissão nacional de habitação"
 AST_a_national_housing_commission_desc: "A moradia há muito tempo é uma questão controversa. Todos merecem um teto, mas essa necessidade básica é usada com frequência contra os trabalhadores, com seu custo servindo como uma forma de opressão econômica. Isso acaba agora. Exigiremos acesso justo à moradia para todos."
 AST_guaranteed_employment: "Emprego garantido"
 AST_guaranteed_employment_desc: "O socialismo é muitas vezes descartado com acusações de preguiça ou dependência contra os necessitados. Isso deve acabar. Tudo o que buscamos é uma chance justa de trabalhar e um salário justo com o qual sustentar nossas famílias."
 AST_equal_pay: "Paridade salarial"
 AST_equal_pay_desc: "É uma falácia persistente afirmar que aqueles que possuem os meios de produção merecem mais do que aqueles que trabalham com eles. Proprietários e gerentes não se esforçam mais, nem são inerentemente mais habilidosos. Com salários equivalentes, os frutos do trabalho poderão ser compartilhados de maneira mais justa por toda a sociedade."
 AST_all_for_one_one_for_all: "Um por todos, todos por um"
 AST_all_for_one_one_for_all_desc: "\"Todos por um, e mais para mim\" há muito é o grito de guerra da burguesia, cuja ganância exige cada vez mais enquanto devolve cada vez menos. A promessa de que a riqueza flui para todos é uma mentira. Ela deve ser compartilhada igualmente, por todos e para todos."
 AST_abolition_of_private_property: "Abolição da propriedade privada"
 AST_abolition_of_private_property_desc: "As engrenagens da indústria são lubrificadas com o sangue dos trabalhadores. Devemos acabar com a brutalidade da acumulação e abolir por completo a propriedade privada. Tudo será compartilhado: de cada um conforme sua capacidade, para cada um conforme sua necessidade."
 AST_centralized_production: "Produção centralizada"
 AST_centralized_production_desc: "As forças do mercado são caóticas e desiguais. Se quisermos construir uma sociedade verdadeiramente justa, o Estado deverá assumir o papel central de determinar o que será produzido, por quem e onde. Nossa burocracia mantém registros meticulosos e está em melhor posição para definir cotas de produção."
 AST_public_institutions: "Instituições públicas"
 AST_public_institutions_desc: "A sociedade exige muitos serviços essenciais para funcionar, de saúde e moradia a cuidado infantil e transporte. O Estado deve oferecê-los de forma universal, garantindo acesso irrestrito a todos. Livres da obrigação de gerar lucro privado, esses sistemas poderão operar com eficiência para atender às necessidades de toda a população."
 AST_planned_extraction: "Extração planejada"
 AST_planned_extraction_desc: "Temos a sorte de possuir uma terra tão rica em recursos. Devemos garantir que sua riqueza seja extraída de modo sistemático e direcionada às indústrias que mais precisam dela."
 AST_maritime_commission: "$USA_maritime_commission$"
 AST_maritime_commission_desc: "$USA_maritime_commission_desc$"
 AST_state_research_funding: "Financiamento estatal de pesquisa"
 AST_state_research_funding_desc: "Para maximizar a eficácia de nossas instituições de pesquisa, o Estado deve servir como sua principal fonte de financiamento, direcionando esforços para onde forem mais necessários e garantindo que as informações permaneçam sob rígido controle. Afinal, não podemos correr o risco de nossos cidadãos serem perturbados pelas ideias erradas."
 AST_graziers_to_industry: "Do campo à indústria"
 AST_graziers_to_industry_desc: "Durante a Grande Depressão, nossas cidades se esvaziaram conforme os trabalhadores buscavam estabilidade no campo. Agora, com o controle dos meios de produção, podemos trazê-los de volta à indústria. Devemos incutir neles a necessidade da nação: as fornalhas da indústria devem ser alimentadas pelo suor dos homens."
 AST_free_school_policy: "Política de escolas gratuitas"
 AST_free_school_policy_desc: "Para moldar o cidadão exemplar, devemos moldar suas ideias. Do berço à universidade, o Estado guiará o que nossas crianças aprendem. Assim, poderemos garantir que as futuras gerações compreendam a importância do ideal socialista e os perigos dos livres mercados... e do livre pensamento."
 AST_free_healthcare_policy: "Política de saúde gratuita"
 AST_free_healthcare_policy_desc: "Nosso povo merece viver livre de doenças e lesões e, se o pior acontecer, não deve ser levado à miséria pelo infortúnio, como ocorre em outras sociedades. Ofereceremos acesso universal à saúde, a hospitais e a médicos, pois um povo saudável é um povo produtivo."
 AST_the_publics_australia: "A Austrália do povo"
 AST_the_publics_australia_desc: "Deixamos a velha ordem para trás e construímos uma nação que existe para muitos, não para poucos. Indústria, trabalho e recursos agora servem ao povo como um todo. Esta é a Austrália do povo: igualitária, unida e inquebrável."
 # 'Cominwealth' over 'Commonwealth' is intentional
 AST_the_australian_commonwealth: "A Comunidade Australiana"
 AST_the_australian_commonwealth_desc: "A Grã-Bretanha já reivindicou o manto de liderança sobre a Comunidade, mas sua visão foi corrompida por interesses capitalistas. Tomaremos esse papel para nós e conduziremos as nações rumo a uma utopia socialista compartilhada."
 AST_union_control_commonwealth: "Desbloqueia decisões de §Ycontrole sindical§!. \nPermite a infiltração comunista na Nova Zelândia, na Malásia, na Birmânia e, por fim, na Índia."
 AST_a_comrade_emancipated: "Um camarada emancipado"
 AST_a_comrade_emancipated_desc: "Ao redor do mundo, muitas nações continuam presas às correntes do capitalismo, com seus povos privados da verdadeira liberdade. Como um Estado socialista livre, é nosso dever auxiliar sua emancipação. Trabalhadores do mundo, uni-vos, e juntos romperemos essas correntes."
 AST_union_control_local: "Desbloqueia decisões de §Ycontrole sindical§!. \nPermite a infiltração comunista na Indonésia e nas Filipinas."
 AST_comintern: "Juntar-se à Comintern"
 AST_comintern_desc: "Embora por vezes tenham se afastado dos verdadeiros princípios marxistas, a União Soviética continua sendo a porta-estandarte da internacional dos trabalhadores. Ao entrar na Comintern, poderemos unir nossos esforços para carregar a tocha do socialismo pelo mundo."
 AST_comintern_tt: "Se o Estado §Y[AST.GetAdjective]§! liderar uma facção, ela será incorporada à Comintern. Do contrário, o Estado §Y[AST.GetAdjective]§! ingressará na Comintern sozinho."
 AST_for_greater_good: "Pelo bem maior"
 AST_for_greater_good_desc: "Nossa visão da revolução mundial exige sangue e sacrifício. Em muitos lugares, a tocha do socialismo tremula; devemos atender ao chamado e enviar nosso apoio para garantir que ela não se apague. Afinal, isso é pelo bem maior (o bem maior)."
 AST_make_common_cause: "Formar uma causa comum"
 AST_make_common_cause_desc: "Sob nossa liderança, a Comunidade começou a prosperar, guiada pela luz do socialismo para fora das trevas da opressão capitalista. Neste momento crítico, devemos garantir que nossa vontade não seja quebrada e que marchemos juntos rumo a um amanhã melhor."
 AST_the_red_pacific: "O Pacífico vermelho"
 AST_the_red_pacific_desc: "O Pacífico deve ser refeito à imagem da revolução. Pelas ilhas e costas da nossa região, apoiaremos a ascensão de governos socialistas e garantiremos que a bandeira vermelha tremule de litoral a litoral."
 AST_the_irish_anti-britain_pact: "O pacto irlandês contra a Grã-Bretanha"
 AST_the_irish_anti-britain_pact_desc: "A Grã-Bretanha permanece há tempo demais como um bastião do capitalismo, protegida por sua posição insular e por sua força naval. Ao incitar agitação entre os estivadores da Irlanda e da Irlanda do Norte, poderemos romper suas defesas e abrir um caminho pelo mar da Irlanda para nossas forças."
 AST_stretch_the_fleet: "Expandir a frota"
 AST_stretch_the_fleet_desc: "A Grã-Bretanha ainda se mantém como o bastião do capitalismo, protegida por sua poderosa frota. Chegou a hora de expandir nossas próprias capacidades navais, levar a luta até eles e mostrar ao mundo qual ilha é maior."
 AST_chinese_relations: "Relações chinesas"
 AST_chinese_relations_desc: "Nossos camaradas na China lutam pela própria sobrevivência. Temos meios para ajudá-los, mas devemos agir depressa, antes que sejam esmagados pelas forças imperialistas dispostas contra eles."
 AST_westward_battles: "Batalhas no oeste"
 AST_westward_battles_desc: "Forças fascistas dominam o Ocidente, ameaçando a própria estrutura da nossa sobrevivência. Agora alinhados à Comintern, devemos levar a luta até eles e resistir àqueles que destruiriam a utopia dos trabalhadores que estamos construindo."
 AST_strongholds: "Fortalezas"
 AST_strongholds_desc: "Para assegurar nossa posição neste novo teatro de operações, devemos apoiar nossos camaradas irlandeses contra o coração imperial do capitalismo. Sua luta anterior por independência oferece lições valiosas enquanto nos preparamos juntos para a próxima etapa do conflito global."
 AST_out_of_the_den: "Saindo do covil"
 AST_out_of_the_den_desc: "Muitos na Irlanda ainda guardam profundo ressentimento contra o domínio britânico. Chegou a hora de mostrar nossa força e tirá-los das sombras, reunindo-os à nossa causa contra um inimigo comum."
 AST_end_the_kingdom: "Fim do reino"
 AST_end_the_kingdom_desc: "Chegou a hora. A raiz do capitalismo imperialista será apunhalada em seu coração podre. A libertação dos trabalhadores por todo o Império Britânico está próxima. Acabem com a monarquia. Acabem com o reino. Acabem com a opressão. Trabalhadores da Comunidade, unam-se!"
 AST_red_solidarity: "Solidariedade vermelha"
 AST_red_solidarity_desc: "A luta na China continua feroz, enquanto milhões sofrem e morrem. A luta deles é a nossa luta, e não podemos ficar parados. Podemos intervir, compartilhar seu fardo e garantir que a chama da revolução não vacile."
 AST_red_solidarity_tt: "O Estado §Y[AST.GetAdjective]§! junta-se à guerra §Yd[PRC.GetNameDef]§! contra §Y[CHI.GetNameDef]§!. A facção menor absorverá a outra, ou o Estado §Y[AST.GetAdjective]§! entrará diretamente no conflito caso ambas já sejam aliadas."
 AST_free_the_colonies: "Libertar as colônias"
 AST_free_the_colonies_desc: "Os fogos da revolução ardem pelo decadente Império Britânico. As colônias não serão mais colônias, mas nações livres. Ergam-se, camaradas! Lancem fora seus grilhões e juntem-se à revolução!"
 AST_free_the_colonies_tt: "O Estado §Y[AST.GetAdjective]§! rebaixa todas as antigas colônias britânicas sob seu controle a fantoches integrados."
 AST_battle_of_the_ocean: "Batalha do oceano"
 AST_battle_of_the_ocean_desc: "Os oceanos há muito servem como as artérias do comércio global. Agora, chegou a hora de levar a luta ao Pacífico e cortar o sistema que ele sustenta. As águas ficarão vermelhas com o sangue de capitalistas corruptos e heróis da revolução."
 AST_borderless_solidarity: "Solidariedade sem fronteiras"
 AST_borderless_solidarity_desc: "Solidariedade. A palavra que une os trabalhadores do mundo. Nenhuma fronteira pode nos dividir, nenhuma nação pode permanecer sozinha. Onde quer que o conflito irrompa, atenderemos ao chamado e permaneceremos juntos na luta global pela libertação."
 AST_an_equal_union: "Uma união igualitária"
 AST_an_equal_union_desc: "Embora carreguemos a bandeira da revolução, todos que se juntarem a nós estarão em pé de igualdade. Nesta união, recursos, trabalho e ideias são compartilhados livremente, forjando um futuro no qual a prosperidade seja coletiva e nenhuma nação esteja acima de outra."
 AST_expanding_influence: "Expandindo a influência"
 AST_expanding_influence_desc: "Do lado certo da História, nossas ideias falam por si. A promessa de um paraíso dos trabalhadores não é um sonho, mas uma realidade em construção. Podemos estender essa visão para fora, convidando outros a se juntarem a nós na criação de um futuro compartilhado."
 AST_public_works: "Obras públicas"
 AST_public_works_desc: "A Grande Depressão deixou a economia australiana em uma situação crítica. Iniciaremos uma série de programas de obras públicas para recolocar a população no mercado de trabalho e restaurar o consumo."
 AST_lang_plan: "O plano Lang"
 AST_lang_plan_desc: "Jack Lang ganhou destaque na política econômica ao recusar abertamente o pagamento das dívidas externas, redirecionando esses recursos para iniciativas públicas voltadas ao crescimento interno. Afinal, não é possível tirar água de pedra."
 AST_exports_for_economic_recovery: "Exportações para a recuperação econômica"
 AST_exports_for_economic_recovery_desc: "Os opositores das ideias de Lang propõem utilizar mercados estrangeiros e o endividamento para incentivar investimentos e vendas no exterior, comprometendo-se com uma economia voltada à exportação para fortalecer a produção, o emprego e o consumo domésticos."
 AST_the_phosphate_commision: "A comissão do fosfato"
 AST_the_phosphate_commision_desc: "Após a Grande Guerra, Nauru foi colocada sob a tutela conjunta da Austrália, da Nova Zelândia e do Reino Unido. Em 1919, os direitos sobre todas as vendas de fosfato na ilha foram transferidos a esses administradores, liderados pela Austrália. Utilizando nossa posição de liderança, podemos influenciar os preços e garantir taxas altamente competitivas para o mercado interno."
 AST_goods_standard: "Padrão de mercadorias"
 AST_goods_standard_desc: "Um princípio central da teoria econômica de Jack Lang é a abolição do padrão-ouro na Austrália, substituído por um padrão de mercadorias, que vincula a base monetária à quantidade real de bens produzidos. Isso assegura que o fluxo de capital esteja diretamente ligado à produtividade doméstica em lugar de fatores externos."
 AST_standard_gauge_line_to_darwin: "Linha de bitola padrão até Darwin"
 AST_standard_gauge_line_to_darwin_desc: "Não temos conexões adequadas com nossos territórios do norte há muito tempo. Como parte de um programa mais amplo de obras públicas que busca direcionar recursos de volta para a economia, podemos construir uma ferrovia ligando nossas cidades do sul ao norte."
 AST_lang_is_right: "Lang tem razão"
 AST_lang_is_right_desc: "No fim das contas, Lang tinha razão! Ao rejeitar a prioridade aos credores externos e explorar nosso sistema bancário de maneira mais agressiva, liberamos uma quantidade expressiva de fundos. Esses recursos agora podem ser direcionados para a economia doméstica, garantindo investimentos essenciais e estimulando o crescimento."
 AST_within_reach: "Ao alcance"
 AST_within_reach_desc: "Tão perto e, ainda assim, tão distante. A Austrália é uma nação extremamente rica em recursos e, se cavarmos um pouco mais fundo, descobriremos riquezas inimagináveis sob nossos pés. Com a expansão de nossa infraestrutura, até mesmo minas remotas tornaram-se acessíveis, colocando a nação à beira de uma era de prosperidade impulsionada pela riqueza mineral."
 AST_a_domestic_supply_chain: "Uma cadeia de abastecimento doméstica"
 AST_a_domestic_supply_chain_desc: "Um efeito colateral de nosso foco na economia doméstica é o desenvolvimento de um sistema produtivo excepcionalmente resiliente. Com toda a cadeia produtiva concentrada no território nacional, estamos amplamente protegidos contra crises externas."
 AST_broken_hill_propietary_company: "Broken Hill Proprietary Company"
 AST_broken_hill_propietary_company_desc: "A Broken Hill Proprietary Company é uma das principais mineradoras e produtoras de aço da Austrália. Conhecida como \"A Grande Australiana\" pelos habitantes locais, ela domina o setor. Com o aumento expressivo da demanda por matérias-primas, a empresa encontra-se em posição ideal para ter um crescimento ainda mais acelerado."
 AST_radium_hill: "Radium Hill"
 AST_radium_hill_desc: "O urânio foi descoberto no sul da Austrália e a mina de Radium Hill possui grande potencial de expansão. Embora ainda estejamos desvendando todas as possibilidades dessas tecnologias emergentes, é evidente que estamos diante do limiar da Era Atômica, e esta pode ser nossa porta de entrada."
 AST_industrial_expansion: "Expansão industrial"
 AST_industrial_expansion_desc: "A Grande Depressão paralisou a produção econômica de nossa nação durante boa parte da última década. Agora que temos a vontade política para uma ação mais direta, devemos investir em uma ousada expansão de nossa base industrial, gerando empregos, aumentando a demanda por recursos e produzindo mais bens para o mercado."
 AST_income_tax_assessment_act: "Lei de Avaliação do Imposto de Renda"
 AST_income_tax_assessment_act_desc: "Nosso sistema tributário encontra-se em más condições e é muito complicado, exigindo uma supervisão governamental pesada que não podemos sustentar. Ao reformular e simplificar suas regras, poderemos tornar a arrecadação de impostos significativamente mais eficiente."
 AST_council_for_scientific_and_industrial_research: "Conselho de Pesquisa Científica e Industrial"
 AST_council_for_scientific_and_industrial_research_desc: "O Conselho de Pesquisa Científica e Industrial foi fortalecido após a Conferência Imperial de 1923 com o objetivo de ampliar a base econômica das colônias e domínios. Embora suas contribuições tenham sido significativas, chegou o momento de dar ao órgão um novo foco: o desenvolvimento da manufatura e das indústrias secundárias."
 AST_bring_home_the_farmers: "Tragam os agricultores de volta"
 AST_bring_home_the_farmers_desc: "Durante a Grande Depressão, nossas principais cidades perderam grande parte da população, já que os trabalhadores migraram para o campo em busca de trabalho agrícola. Agora que as condições começaram a melhorar, devemos incentivar o retorno de nossa força de trabalho para reativar as fábricas e retomar a produção."
 AST_reverse_wage_cuts: "Reverter os cortes salariais"
 AST_reverse_wage_cuts_desc: "Para dar às empresas uma chance de sobrevivência, implementamos uma série de cortes salariais em toda a economia. Agora que vemos sinais de recuperação, devemos reverter essa política. O aumento dos salários gera maior poder de compra, impulsionando o consumo e o crescimento econômico."
 AST_the_manpower_directorate: "Junta de mão de obra"
 AST_the_manpower_directorate_desc: "Com o aumento da complexidade de nossa economia, enfrentamos crescentes desafios relacionados à mão de obra. Esta junta garantirá que as pessoas certas ocupem as funções adequadas, com as habilidades necessárias, no momento certo."
 AST_recovery: "Recuperação"
 AST_recovery_desc: "Pela primeira vez, nosso produto interno bruto superou os níveis anteriores à Grande Depressão. Este é um momento de celebração, pois nossa economia agora segue uma trajetória de crescimento. Estamos entrando em um período de forte expansão e chegou a hora de colher os frutos de nossa prosperidade renovada."
 AST_devalued_currency: "Moeda desvalorizada"
 AST_devalued_currency_desc: "Uma das formas mais eficazes de aumentar as exportações é por meio de uma moeda mais fraca. Se compradores estrangeiros puderem adquirir mais de nossos produtos porque sua moeda tem maior poder de compra, poderemos nos tornar mais competitivos no cenário global. Por outro lado, essa é uma via de mão dupla, pois encarece as importações."
 AST_reverse_industry_tariffs: "Reverter tarifas industriais"
 AST_reverse_industry_tariffs_desc: "No passado, utilizamos tarifas para proteger nossas indústrias domésticas da concorrência estrangeira. Contudo, isso resultou em guerras comerciais e tarifas retaliatórias contra nossas exportações, elevando os preços. Devemos mitigar essas barreiras e incentivar reduções recíprocas para ajudar a expandir o comércio."
 AST_foreign_competition: "Competição estrangeira"
 AST_foreign_competition_desc: "A concorrência é benéfica para os negócios, pois estimula a inovação e a eficiência, ao mesmo tempo que elimina a complacência. O mundo é uma disputa feroz constante e precisamos garantir que nossas indústrias estejam completamente livres para competir."
 AST_expanding_into_new_markets: "Expandir para novos mercados"
 AST_expanding_into_new_markets_desc: "A vantagem de depender de mercados estrangeiros em vez do mercado doméstico é simples: o mercado global é vasto. Sempre haverá novos mercados a serem explorados – basta encontrarmos nosso diferencial e demonstrar a superioridade dos produtos e das práticas comerciais australianas."
 AST_populate_or_perish: "Povoar ou perecer"
 AST_populate_or_perish_desc: "Quando a Grande Depressão chegou, as taxas de natalidade caíram rapidamente e desde então temos encontrado dificuldades para fazer com que se recuperem. Com o propósito de manter o desenvolvimento interno, estabeleceremos um Departamento Federal de Imigração para conduzir e supervisionar um novo programa imigratório."
 AST_recruitment_drive: "Campanha de recrutamento"
 AST_recruitment_drive_desc: "A vontade fraca dos governos anteriores, assim como sua dependência excessiva da Grã-Bretanha, resultou em um longo período de negligência das forças armadas australianas. Isso não será mais tolerado, pois lançaremos uma campanha para impulsionar o recrutamento na Força de Defesa Australiana."
 AST_new_deal: "Novo acordo"
 AST_new_deal_desc: "O protesto realizado durante a celebração do sesquicentenário d[AST.GetNameDef] deixou evidente que nossas leis relativas a cidadãos indígenas devem ser reconsideradas. A pedido de ativistas pelos direitos aborígenes, nos reuniremos com eles para determinar juntos um caminho rumo à cidadania plena para os povos indígenas."
 AST_the_1938_sesquicentenary_flag: "O evento §YO sesquicentenário de 1938§! ocorreu."
 AST_the_1938_sesquicentenary_tt: "O foco \"§YNovo acordo§!\" no ramo §YPovoar ou perecer§! fica disponível."
 AST_repeal_immigration_restrictions: "Revogar as restrições à imigração"
 AST_repeal_immigration_restrictions_desc: "O Departamento de Imigração é limitado por leis ultrapassadas que determinam quem tem permissão para imigrar para [AST.GetNameDef]. Apesar do risco de provocar controvérsia, revogaremos essas leis e em seu lugar estabeleceremos um sistema de cotas para controlar o fluxo de imigrantes."
 AST_womens_armed_services: "Forças armadas femininas"
 AST_womens_armed_services_desc: "Apesar da forte oposição, a formação dos serviços armados femininos seguirá em frente. Toda mão amiga será bem-vinda para defender o território d[AST.GetNameDef] contra seus agressores, independentemente do gênero. Para estimular o recrutamento e o treinamento, a escolha das diretoras das forças é de máxima importância."
 AST_northern_territory_reconnaissance_unit: "Unidade de reconhecimento do território do norte"
 AST_northern_territory_reconnaissance_unit_desc: "O tenente de voo e antropólogo Donald Thomson defendeu a inclusão da população aborígene nas forças armadas d[AST.GetNameDef] e por fim será ouvido. Incumbiremos Thomson de formar pessoalmente uma unidade de reconhecimento composta por homens com conhecimento local e habilidades de sobrevivência na mata para vigiar até mesmo nossas terras mais remotas e inóspitas."
 AST_northern_territory_reconnaissance_unit_tt: "Desbloqueia a companhia de suporte §YUnidade de reconhecimento do território do norte§!."
 AST_torres_strait_battalion: "Batalhão do Estreito de Torres"
 AST_torres_strait_battalion_desc: "Os esforços da Companhia do Estreito de Torres como guarnição foram bem administrados, mas seus homens têm potencial para outras realizações. Com seus membros originários das ilhas ao largo da costa norte d[AST.GetNameDef], a unidade possui amplo conhecimento do Estreito de Torres. Treinaremos seus homens como fuzileiros navais e faremos um apelo por mais voluntários para formar um batalhão."
 AST_department_of_aboriginal_affairs: "Departamento de Assuntos Aborígenes"
 AST_department_of_aboriginal_affairs_desc: "Implementaremos a sugestão dos grupos ativistas pelos direitos aborígenes de estabelecer um novo Departamento de Assuntos Aborígenes. O departamento será aconselhado por um comitê de ascendência aborígene e terá como objetivo garantir o acesso da população indígena à alimentação adequada e assistência médica."
 AST_immediate_rights: "Direitos imediatos"
 AST_immediate_rights_desc: "Nenhum grupo populacional dentro d[AST.GetNameDef] será regulado pela federação, e nenhuma origem restringirá a concessão de direitos civis. Ao estabelecer nossa própria lei de cidadania e nos afastar da noção de que nossa população consiste apenas de súditos britânicos, os direitos australianos deixarão de ser condicionais."
 AST_diverse_army: "Exército diversificado"
 AST_diverse_army_desc: "O ato de defender o próprio país não é apenas um privilégio, mas um direito. Todo australiano disposto poderá se alistar, e todo soldado ambicioso deve ter a possibilidade de subir na hierarquia."
