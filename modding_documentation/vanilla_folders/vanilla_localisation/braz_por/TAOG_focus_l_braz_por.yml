 idea_SIA_weather_broadcasts: "Previsão do tempo"
 idea_SIA_weather_broadcasts_desc: "Previsões do tempo regulares dão às nossas forças aéreas e navais uma noção mais clara das condições climáticas, melhorando a efetividade delas e reduzindo os riscos de operar em tempo ruim."
 idea_SIA_seri_thai_contacts: "Contatos do Seri Thai"
 idea_SIA_seri_thai_contacts_desc: "Os contatos com a rede de resistência do Seri Thai estão provando seu valor, trazendo guerreiros experientes para nós e fortalecendo nossos laços com os Aliados."
 idea_SIA_secure_rubber_islands: "Assegurar as ilhas de borracha"
 idea_SIA_joint_military_command: "Comando militar conjunto"
 idea_SIA_joint_military_command_desc: "Uma estrutura de comando unificada tem melhor coordenação entre seus ramos, acelerando o desenvolvimento de oficiais experientes e uma doutrina de campo de batalha."
