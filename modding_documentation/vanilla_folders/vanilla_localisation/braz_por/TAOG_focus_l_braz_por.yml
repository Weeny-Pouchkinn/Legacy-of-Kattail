 HOL_taog_guarantee_colonial_loyalty: "Garantir lealdade colonial"
 HOL_taog_guarantee_colonial_loyalty_desc: "O nacionalismo está ganhando força nas Índias e está claro que outra revolução está se formando. Embora aquela que enfrentamos em 1927 tenha sido esmagada com facilidade, nossas fontes informam que podemos estar lidando com um grupo muito mais preparado de revolucionários. Talvez possamos desviar a atenção dos civis quanto à revolução e direcioná-la para Soetardjo oferecendo algumas concessões ao movimento nacionalista pacífico dele."
 HOL_taog_guarantee_colonial_loyalty_tt: "§WGarante que não haverá uma revolução n[INS.GetNameDef].§!\nO governo [INS.GetAdjective] tentará declarar independência de forma pacífica. Isso pode ser impedido concluindo o foco §Y$INSHOL_industrialized_colony$§!, que exigirá um investimento pesado na colônia."
 ################
 ###   SIAM   ###
 ################
 SIA_the_khana_ratsadon: "O Khana Ratsadon"
 SIA_the_khana_ratsadon_desc: "O Partido Popular acabou com o absolutismo e abriu o caminho para o governo constitucional. Seu legado tem sido contestado, traído e manchado de sangue, mas ele permanece como o alicerce sobre o qual um Estado [SIA.GetAdjective] moderno pode ser construído."
 SIA_the_khana_ratsadon_tt: "\nO §YKhana Ratsadon§! torna-se ativo.\n\nO §YKhana Ratsadon§! é o partido líder n[ROOT.GetNameDef], dividido entre a §Yala militar§! e a §Yala civil§!.\n\nA §Yala civil§! geralmente favorece políticas pró-democracia com foco em indústrias civis, enquanto a §Yala militar§! tende a apoiar políticas pró-fascistas e a militarização da indústria.\n\nNossas escolhas influenciarão o quanto eles nos apoiam, concedendo diferentes bônus ou penalidades.\nCaso se tornem rebeldes, eles podem tentar lançar um golpe de Estado.\n\nOs diferentes estados de aprovação são §Yrebelde§!, §Yem oposição§!, §Yneutro§!, §Yapoio moderado§! e §Yapoio total§!."
 SIA_shuffle_pridi_to_the_minister_of_interior: "Fortalecendo a posição da ala civil"
 SIA_shuffle_pridi_to_the_minister_of_interior_desc: "Ao transferir Pridi para o cargo de Ministro do Interior, em vez de Ministro das Relações Exteriores, ele poderá controlar de forma mais eficaz a alocação de recursos governamentais e conter o avanço da influência militar."
 SIA_shuffle_pridi_to_the_minister_of_interior_tt: "§Y$anti_fascist_raids$§! passarão a aumentar a aprovação das §Yalas civis§! e diminuir a aprovação das §Yalas militares§!"
 SIA_civil_nationalism: "Nacionalismo civil"
 SIA_civil_nationalism_desc: "Todo tailandês, independentemente de sua condição, deve compreender que sua lealdade não deve ser dedicada a um governo ou pessoa, mas sim à defesa dos valores de liberdade, independência e igualdade, não importando quem ocupe o trono."
 SIA_the_true_heirs_of_1932: "Os verdadeiros herdeiros de 1932"
 SIA_the_true_heirs_of_1932_desc: "O Exército gosta de apresentar a revolução de 1932 como uma conquista exclusiva, ignorando que se tratou de uma vitória do povo. As pessoas precisam ser lembradas disso, e é delas que virá nossa força."
 SIA_thammasat_university: "Universidade Thammasat"
 SIA_thammasat_university_desc: "A recém-estabelecida Universidade Thammasat pode e deve ser ampliada para abrir caminho para uma nova era de inovação tailandesa."
 SIA_defenders_of_constitutional_liberty: "Defensores da liberdade constitucional"
 SIA_defenders_of_constitutional_liberty_desc: "Professores, banqueiros e enfermeiras. A classe média instruída pode ser mobilizada para defender a liberdade caso a ala militar ultrapasse seus limites."
 SIA_dominate_public_symbols: "Dominar os símbolos públicos"
 SIA_dominate_public_symbols_desc: "A ala militar domina há anos os símbolos públicos, erguendo estátuas e declarando feriados que celebram a si mesma. Precisamos contrapor isso estabelecendo nossos próprios símbolos, celebrando o direito do povo à autodeterminação e a vitória sobre a antiga autocracia."
 SIA_civil_service_heroism: "Heroísmo do serviço civil"
 SIA_civil_service_heroism_desc: "Todo tailandês deve carregar em si o dever de proteger o Estado de direito contra qualquer força, estrangeira ou doméstica, que tente usurpar esse princípio. Mais do que o apoio popular diante da ameaça às nossas liberdades, precisamos que o povo aja como guardião dessa causa."
 SIA_spread_democratic_sentiment_in_universities: "Disseminar o sentimento democrático nas universidades"
 SIA_spread_democratic_sentiment_in_universities_desc: "Os acadêmicos moldarão o futuro d[SIA.GetNameDef]. O que aprendem hoje ecoará no amanhã, e ao cultivarmos neles um forte senso de dever democrático, poderemos espalhá-lo para além dos limites do ambiente universitário."
 SIA_sideline_disloyal_officers: "Afastar oficiais desleais"
 SIA_sideline_disloyal_officers_desc: "As divisões de oficiais do Exército não são um monólito. Em suas fileiras há homens cuja lealdade pertence aos antigos patronos, facções rivais ou suas próprias ambições, e não ao governo. Com reatribuições cuidadosas e pressão administrativa, essas figuras podem ser transferidas para posições em que não representem ameaça, enquanto aqueles que demonstraram confiabilidade ficarão com as responsabilidades que merecem."
 SIA_sideline_disloyal_officers_tt: "Dois generais aleatórios receberão a característica §YTransferido§! por 4 anos, fazendo com que não concedam bônus.\nOutros dois generais aleatórios que não possuam a característica §YTransferido§! receberão atributos extras e uma característica positiva adicional."
 SIA_direct_funds_from_the_military_towards_development: "Direcionar fundos do Exército para o desenvolvimento"
 SIA_direct_funds_from_the_military_towards_development_desc: "Embora o redirecionamento de recursos da ala militar para o desenvolvimento possa causar descontentamento, caberá a eles, e não a nós, explicar ao público por que essa falta de investimento será benéfica para todos."
 SIA_as_the_eyes_turn_towards_southeast_asia: "Conforme os olhares se voltam para a Ásia"
 SIA_as_the_eyes_turn_towards_southeast_asia_desc: "O sudeste asiático não é mais um teatro de operações distante. É a encruzilhada de impérios, é a revolução e a guerra. O governo [SIA.GetAdjective] precisa decidir se será um peão nesse conflito ou uma potência com seus próprios planos."
 SIA_support_songsuradets_military_clique: "Apoiar a camarilha militar de Songsuradet"
 SIA_support_songsuradets_military_clique_desc: "Nem todo oficial é um inimigo da nação. Songsuradet e seus lealistas oferecem uma alternativa militar disciplinada aos generais corruptos que levaram o Sião ao limite. Com o apoio deles, a ordem pode ser restaurada sem render o Estado ao caos."
 SIA_support_songsuradets_military_clique_tt: "Caso uma §Yguerra civil§! ecloda, Songsuradet nos apoiará, concedendo §Y3§! divisões adicionais.\n§RSe fortalecermos Songsuradet e depois tentarmos prendê-lo por meio da situação \"$SIA_the_songsuradet_rebellion$\", ele poderá resistir.§!"
 SIA_the_royal_police_counterweight: "A Polícia Real"
 SIA_the_royal_police_counterweight_desc: "A Polícia Real atua como uma força independente e pode ser utilizada contra nossos opositores, caso tentem tomar o poder para si."
 SIA_the_royal_police_counterweight_tt: "Caso uma §Yguerra civil§! ecloda, a Polícia Real nos apoiará, concedendo §Y2§! divisão adicional"
 SIA_for_the_preservation_of_siamese_independence: "Consolidar o controle da ala militar"
 SIA_for_the_preservation_of_siamese_independence_desc: "No século passado, as potências mundiais avançaram sobre a integridade territorial d[SIA.GetNameDef], e tudo indica que neste século a história se repetirá. Deveremos agir com determinação se quisermos preservar nosso modo de vida, ou acabaremos reduzidos a um Estado fragmentado, enfraquecido e à beira do colapso."
 SIA_for_the_preservation_of_siamese_independence_tt: "§Y$anti_democratic_raids$§! passarão a aumentar a aprovação das §Yalas militares§! e diminuir a aprovação das §Yalas civis§!"
 SIA_the_peoples_day: "Dia do povo"
 SIA_the_peoples_day_desc: "Em vez de dar maior ênfase ao papel do Exército na derrubada da antiga monarquia, devemos exaltar a força do povo. A criação de um Dia do Povo mobilizará a nação e ensinará aos nossos cidadãos a não esperar menos do que merecem."
 SIA_hold_military_parades: "Sediar desfiles militares"
 SIA_hold_military_parades_desc: "Para elevar o moral do Exército, recompensar nossos generais leais e lembrar aos nossos cidadãos do poder das forças armadas d[SIA.GetNameDef], realizaremos um grande desfile em Bangkok. Que os jornais tenham algo digno de estampar em suas manchetes!"
 SIA_embed_technocrats_in_civilian_institutions: "Incluir tecnocratas nas instituições civis"
 SIA_embed_technocrats_in_civilian_institutions_desc: "Podemos formar alianças com tecnocratas do governo, utilizando-os como uma extensão da ala civil para ampliar nossa influência em contrapartida ao poder militar."
 SIA_military_academies_indoctrination: "Doutrinação nas academias militares"
 SIA_military_academies_indoctrination_desc: "Nossas academias militares são alvos ideais para o treinamento ideológico. Estão bem armadas, e os jovens cadetes são facilmente influenciados por seus instrutores. Conquiste os instrutores e conquistará a juventude militar. Um Exército forte e leal à classe governante é o alicerce de qualquer Estado poderoso, e é isso que pretendemos ser."
 SIA_the_king_of_the_white_elephant: "O Rei do Elefante Branco"
 SIA_the_king_of_the_white_elephant_desc: "A histeria em torno da recuperação de territórios perdidos ameaça varrer a nação sob o olhar atento do mundo. Para conter esse ímpeto, produziremos um filme antiguerra, sendo o primeiro filme tailandês rodado em inglês, para mostrar ao mundo a verdadeira natureza d[SIA.GetNameDef]."
 SIA_the_king_of_the_white_elephant_tt: "Desbloqueia a campanha de propaganda §Y$SIA_the_king_of_the_white_elephant$§! ao concluir o foco §Y$SIA_sala_chaloem_thai_movie_theater$§!, concedendo:\nEstabilidade semanal: §G+0,45%§! por 180 dia(s)"
 SIA_drum_up_irredentism: "Estimular o irredentismo"
 SIA_drum_up_irredentism_desc: "Não basta garantir o apoio dos militares a uma futura guerra, também precisamos conquistar o apoio da população em geral. Por meio de poemas, filmes e discursos, prepararemos [SIA.GetNameDef] para um acerto de contas com as potências imperialistas que roubaram nossas terras históricas."
 SIA_sell_privy_purse_lands: "Vender terras da Coroa"
 SIA_sell_privy_purse_lands_desc: "A família real possui vastas extensões de terra que agora estão sob nosso controle. Essas propriedades podem reforçar significativamente nossos cofres, e parcelas podem ser vendidas a preços favoráveis para certos oficiais, garantindo sua lealdade."
 SIA_sell_privy_purse_lands_tt: "Quando o espírito expirar, §Y[SIA_phraya_phahon.GetName]§! estará envolvido em um escândalo, permitindo que você ignore o requisito de fascismo para §Y$SIA_phibuns_premiership$§!."
 SIA_war_fervor: "Fervor de guerra"
 SIA_war_fervor_desc: "Os tambores do conflito já ressoam. O povo está preparado, o estopim já foi aceso e o fervor de guerra logo atingirá seu ápice. Devemos ter cuidado para direcionar essa energia para uma causa digna."
 SIA_war_fervor_tt: "O apoio à guerra aumentará permanentemente até que declaremos guerra contra qualquer outro país, momento em que este espírito será removido.\n\nCaso o §Yapoio à guerra§! permaneça acima de §Y95%§! por muito tempo sem que haja uma declaração de guerra, uma guerra civil terá início.\nAo declarar guerra: "
 SIA_the_midnight_meeting: "A reunião da meia-noite"
 SIA_the_midnight_meeting_tt: "[SIA_plaek_phibunsongkhram.GetName] tomará o poder n[SIA.GetNameDef] e assumirá o governo. Precisaremos removê-lo para restaurar a monarquia de forma adequada."
 SIA_the_midnight_meeting_desc: "O marechal de campo Songsuradet observa Phibun acumular cada vez mais poder e vê nisso o prenúncio de um acerto de contas. Para que a monarquia e Songsuradet sobrevivam, os monarquistas, oficiais do alto escalão e civis notáveis deverão se reunir em segredo e concordar com a remoção de Phibun antes que ele aja primeiro."
 SIA_meet_with_king_prajadhipok: "Reunião com o Rei Prajadhipok"
 SIA_meet_with_king_prajadhipok_desc: "Uma conspiração sem um rei não passa de mais uma intriga militar. Se nos encontrarmos com o Rei Prajadhipok no exílio, poderemos dar legitimidade real à causa e garantir a bênção do único homem cujo retorno pode mobilizar os hesitantes e dividir o regime."
 SIA_prajadhipok_audience_with_churchill: "Audiência de Prajadhipok com [ENG.GetLeader]"
 SIA_prajadhipok_audience_with_churchill_desc: "A presença de Prajadhipok n[ENG.GetNameDef] oferece mais do que prestígio. Se ele conseguir convencer [ENG.GetLeader] de que uma revolta lealista serve aos interesses britânicos na Ásia, então as armas da Malaia poderão ser entregues aos homens que ainda juram fidelidade ao trono."
 SIA_prajadhipok_audience_with_churchill_tt: "O Estado [ENG.GetAdjective] nos fornecerá "
 SIA_prajadhipok_audience_with_churchill_tt2: "No início da guerra civil."
 SIA_facilitate_prajadhipoks_move_to_japan: "Facilitar a transferência de Prajadhipok para o Japão"
 SIA_facilitate_prajadhipoks_move_to_japan_desc: "A Grã-Bretanha não é a única potência que pode lucrar com a instabilidade n[ROOT.GetNameDef]. Se organizarmos a ida de Prajadhipok ao Japão, poderemos conquistar o apoio de Tóquio e até garantir o envio de divisões caso um levante monarquista evolua para guerra civil."
 SIA_facilitate_prajadhipoks_move_to_japan_tt: "3 divisões de rangers d[JAP.GetNameDef] nos apoiarão durante a guerra civil."
 SIA_the_kings_gambit: "O gambito do rei"
 SIA_the_kings_gambit_desc: "Prajadhipok deverá retornar a Bangkok plenamente ciente de que será preso pelo regime. Esse ato fornecerá aos monarquistas a indignação, a legitimidade e a autoridade necessárias para abandonar qualquer hesitação e se levantar em seu nome. Quando o rei exilado for detido, o sinal será dado e a luta pel[ROOT.GetNameDef] terá início."
 SIA_the_kings_gambit_tt: "Nosso apoio dependerá de quantas camarilhas estiverem ao nosso lado."
 SIA_restore_order: "Restaurar a ordem"
 SIA_restore_order_desc: "A guerra civil foi vencida, mas a vitória por si só não cura o reino. É preciso reconstruir os escombros, acalmar a velha guarda e reorganizar a administração, para que o Estado [ROOT.GetAdjective] possa emergir da desordem com a Coroa segura e a vida pública retomada."
 SIA_ananda_age_trigger_12: "O Rei Ananda deve ter pelo menos §Y12§! anos de idade. (Atualmente §Y[?var:SIA_anandas_age]§!). Seu aniversário é em 20 de setembro"
 SIA_ananda_age_trigger_15: "O Rei Ananda deve ter pelo menos §Y15§! anos de idade. (Atualmente §Y[?var:SIA_anandas_age]§!). Seu aniversário é em 20 de setembro"
 SIA_ananda_trait_tt: "Quando Ananda ascender ao trono, ele receberá: "
 SIA_to_forge_a_king: "Forjar um rei"
 SIA_to_forge_a_king_desc: "O Rei Ananda permanece longe, na Suíça, jovem o bastante para que sua mente e caráter ainda estejam em formação. Se orientarmos seus estudos com cuidado, poderemos forjar não apenas um monarca simbólico, mas um governante à altura do destino que pretendemos para [ROOT.GetNameDef]."
 SIA_to_forge_a_king_tt: "O futuro rei, Ananda Mahidol, ainda é jovem e está estudando n[SWI.GetNameDef]. Temos a chance de moldar seu futuro, orientando seus estudos e interesses para que se torne um grande rei.\n\nPoderemos escolher anualmente um tema para ele estudar em seu aniversário até que complete 15 anos, o que concederá diferentes bônus quando ele assumir o trono.\n\nSua data de nascimento é 20 de setembro e sua idade atual é §Y[?var:SIA_anandas_age]§!."
 SIA_ascend_the_throne: "Ascender ao trono"
 SIA_ascend_the_throne_desc: "Os anos de regência não podem continuar para sempre. Ananda já está em idade de assumir por si mesmo o fardo da realeza, e sua ascensão formal ao trono permitirá que a monarquia restaurada passe da tutela e das intrigas para um novo e legítimo reinado."
 SIA_the_provincial_council_of_state: "O Conselho Provincial do Estado"
 SIA_the_provincial_council_of_state_desc: "Os combates deixaram a máquina do governo em ruínas e a autoridade incerta. Até que o jovem Rei Ananda possa governar por conta própria, um Conselho Provincial do Estado deverá atuar como governo provisório e declarar que os lealistas não lutam por si mesmos, mas pela restauração da monarquia legítima."
 SIA_the_regency_of_boworadet: "A regência de Boworadej"
 SIA_the_regency_of_boworadet_desc: "O príncipe Boworadej carrega o prestígio da antiga ordem e sua lealdade é inquestionável. Ao nomeá-lo regente em nome de Ananda, colocaremos o Estado em mãos conservadoras e deixaremos claro que a restauração vai além de uma simples troca de ministros."
 SIA_the_sacred_hierarchy: "A hierarquia sagrada"
 SIA_the_sacred_hierarchy_desc: "Boworadej sustenta que o reino é mais forte quando cada classe social conhece o seu lugar e a Coroa se mantém acima de toda e qualquer ambição. A monarquia, a fé e a hierarquia natural d[ROOT.GetNameDef] devem voltar a ser pilares sagrados, e não meras relíquias negociadas em barganhas."
 SIA_the_regency_of_songsuradet: "A regência de Songsuradet"
 SIA_the_regency_of_songsuradet_desc: "Songsuradet não é um liberal, mas tampouco está alheio às necessidades de um Estado moderno. Como regente, ele pode preservar a autoridade real enquanto confia o futuro d[ROOT.GetNameDef] à disciplina, ao planejamento e a um programa de desenvolvimento nacional orientado pelos militares."
 SIA_order_discipline_and_unity: "Ordem, disciplina e união"
 SIA_order_discipline_and_unity_desc: "O caos da política de facções e da guerra civil quase destruiu o reino. A resposta de Songsuradet é clara: ordem no governo, disciplina na sociedade e união de propósito, para que o reino seja reconstruído como um Estado mais forte e moderno."
 SIA_the_regency_of_rangsit: "A regência de Rangsit"
 SIA_the_regency_of_rangsit_desc: "O Príncipe Rangsit compreende que a monarquia só sobreviverá se aceitar o governo representativo. Sua regência oferece uma restauração real conservadora em dignidade, mas com métodos democráticos, preparada para dar ao Estado [ROOT.GetAdjective] um futuro parlamentar estável."
 SIA_constitutional_virtue: "Virtude constitucional"
 SIA_constitutional_virtue_desc: "Uma monarquia que respeita a lei é mais difícil de ser derrubada e mais fácil de proteger. Sob a orientação de Rangsit, reviveremos o governo constitucional, conteremos o poder arbitrário e ensinaremos à nação que a Coroa está mais segura quando se coloca como guardiã da liberdade legal."
 SIA_an_absolute_monarchy: "Uma monarquia absolutista"
 SIA_an_absolute_monarchy_desc: "A experiência da monarquia limitada trouxe apenas humilhação, golpes e a tomada da autoridade real por oficiais ambiciosos. Para que o trono volte a inspirar lealdade, a Coroa deve recuperar plenamente suas prerrogativas e governar sem subordinação a partidos ou ao parlamento."
 SIA_a_constitutional_monarchy: "Uma monarquia constitucional"
 SIA_a_constitutional_monarchy_desc: "O trono não precisa dominar o Estado para preservar o reino. Ao restaurarmos a monarquia dentro de um arranjo constitucional duradouro, poderemos unir a Coroa e o povo e garantir que a dignidade real coexista com um governo responsável."
 SIA_to_lay_the_bait: "Lançar a isca"
 SIA_to_lay_the_bait_tt: "Vazaremos um plano econômico falso para antagonizar o Exército.\nQuanto mais atrasarmos \"§Y$SIA_and_spring_the_trap$§!\", maior será a reação negativa contra o Exército e mais forte o nosso apoio ficará.\n\n$SIA_dem_event_count_cw_scale_tt$\n\nToda vez que o Exército criticar a proposta falsa, nosso apoio na guerra civil aumentará, até um máximo de §Y75%§! de apoio à guerra civil. É possível obter mais §Y25%§! de apoio à guerra civil do nosso apoio democrático total (dimensionado de §Y0%-100%§!)"
 SIA_dem_event_count_cw_scale_tt: "§YApoio previsto atual§!: §G[?var:SIA_dem_event_count_cw_scale|%]§!"
 SIA_to_lay_the_bait_desc: "O Dossiê Amarelo pede uma reforma econômica, mas o Exército o considera comunista. Ao vazar uma proposta radical falsa primeiro, poderemos provocar a indignação deles, depois desacreditá-los quando a versão real e mais moderada for publicada."
 SIA_and_spring_the_trap: "E preparar a armadilha"
 SIA_and_spring_the_trap_desc: "Os generais morderam a isca. A indignação deles se tornou uma rebelião, esta expôs suas ambições, e o governo civil estava pronto. Agora a armadilha se fecha e o futuro d[ROOT.GetNameDef] será decidido por aqueles leais à constituição."
 SIA_and_spring_the_trap_tt: "Se nosso apoio total for superior a §Y80%§!, evitaremos uma guerra civil e derrubaremos o Exército instantaneamente."
 SIA_rebuild_the_war_torn_economy: "Reconstruir a economia devastada pela guerra"
 SIA_rebuild_the_war_torn_economy_desc: "A guerra civil devastou estradas, fábricas, arrozais e rotas de comércio. A reconstrução deve começar imediatamente. Salários, grãos, ferrovias e crédito serão mais importantes para estabilizar [ROOT.GetNameDef] do que qualquer discurso de Bangkok."
 SIA_end_military_grift: "Acabar com a corrupção do Exército"
 SIA_end_military_grift_desc: "Por muito tempo, os orçamentos militares alimentaram riquezas pessoais, redes de patrocínio e projetos de prestígio inúteis. A guerra expôs a podridão. Cada contrato corrupto, unidade fantasma e carregamento roubado deve ser investigado e removido da velha camarilha."
 SIA_the_purge: "O expurgo"
 SIA_the_purge_desc: "A camarilha militar cobriu a nação com sangue em vez de se submeter ao governo civil. Não pode haver acordos com traidores. Os oficiais, colaboradores e simpatizantes devem ser removidos de todos os comandos antes que ameacem o Estado novamente."
 SIA_achieve_foreign_legitimacy: "Alcançar a legitimidade estrangeira"
 SIA_achieve_foreign_legitimacy_desc: "Potências estrangeiras observaram nossa crise com suspeita, esperando para ver se o Sião entraria em colapso sob o domínio de uma junta militar ou revolução. Devemos provar que o governo civil é estável, legítimo e capaz de defender o país."
 SIA_achieve_foreign_legitimacy_trigger: "Qualquer grande potência tem mais de §Y75§! de opinião favorável sobre nós"
 SIA_countries_that_like_me_doctrine_tt: "§Y[?var:SIA_countries_that_like_me]x§! §G50%§! de redução de custo para: §YDoutrina terrestre§!"
 SIA_achieve_foreign_legitimacy_tt: "Ganha §G[?var:SIA_achieve_foreign_legitimacy_base_stab_gain|%.0]§! de estabilidade para cada país principal que tiver mais de §Y75§! de opinião favorável sobre nós.\n\nSe mais do que §Y3§! países principais se qualificarem, também ganharemos §Y1x§! §G50%§! de redução de custo para: §YDoutrina terrestre§! para cada país principal qualificado além desse limite.\n\nSe §Y6§! ou mais países principais se qualificarem, ganharemos §G+2§! §Yfábricas civis§!."
 SIA_secure_the_state: "Proteger o Estado"
 SIA_secure_the_state_desc: "A vitória na guerra civil não significa estabilidade. Ferrovias, portos, arsenais e centros de comunicação devem ser protegidos antes que os oficiais reacionários se reagrupem. Bangkok deve permanecer calma, conectada e sob controle civil firme."
 SIA_expand_upon_the_dossier: "Expandir o dossiê"
 SIA_expand_upon_the_dossier_desc: "O Dossiê Amarelo foi escrito para um momento de fragilidade, mas esse momento já passou. Com a camarilha militar derrotada, podemos ir mais longe: maior reforma agrária, proteções trabalhistas melhores e um Estado capaz de reformular o Sião a partir da base."
 SIA_military_oversight_bureau: "Departamento de Supervisão Militar"
 SIA_military_oversight_bureau_desc: "Não podemos permitir que o Exército se torne um Estado dentro do Estado novamente. Um departamento de supervisão sob liderança civil monitorará os agendamentos, os orçamentos e a atividade política dentro das forças armadas, garantindo que os quartéis respondam a Bangkok, e não o contrário."
 SIA_military_oversight_bureau_tt: "O §YDSM§! investiga os generais a cada 5-9 meses. Durante esses períodos, os generais afetados operam com eficiência reduzida devido ao medo do escrutínio."
 SIA_the_yellow_dossier: "O Dossiê Amarelo"
 SIA_the_yellow_dossier_desc: "A proposta radical falsa cumpriu seu papel. Agora, o verdadeiro Dossiê Amarelo pode ser implementado: reforma gradual, modernização econômica e proteções políticas projetadas para acabar com o domínio militar sem entregar a nação ao caos."
 SIA_achieve_domestic_legitimacy: "Alcançar a legitimidade doméstica"
 SIA_achieve_domestic_legitimacy_desc: "O governo sobreviveu pela força das armas, mas agora deve vencer por meio de lei, pão e ordem. A confiança pública deve ser restaurada, medidas de emergência devem ser justificadas e o povo deve enxergar que o governo civil oferece mais do que apenas sobrevivência."
 SIA_achieve_domestic_legitimacy_tt: "O §Ysistema Khana Ratsadon§! será desativado.\nA §Yala militar§! será permanentemente dissolvida e seu espírito será completamente removido.\n\nA §Yala civil§! será permanentemente reorganizada como §Y$idea_SIA_unwavering_civilian_support$§!."
 SIA_allies_integration: "Integração aos Aliados"
 SIA_allies_integration_desc: "Nossas forças devem lutar ao lado dos Aliados. Estruturas de comando, comunicações, procedimentos de abastecimento e padrões de equipamentos devem estar alinhados antes de o Sião poder se tornar mais do que um parceiro simbólico."
 SIA_prepare_for_a_pacific_war: "Preparar-se para uma guerra no Pacífico"
 SIA_prepare_for_a_pacific_war_desc: "O olhar de impérios está se voltando para o Pacífico. As ambições do Japão, as colônias europeias e as estratégias dos Aliados todas apontam para uma tempestade vindoura. O Sião deve se preparar antes que os primeiros tiros sejam disparados contra nossos litorais."
 SIA_the_end_of_gunboat_diplomacy: "O fim da diplomacia das canhoneiras"
 SIA_the_end_of_gunboat_diplomacy_desc: "Nunca mais os navios de guerra estrangeiros ditarão os termos da boca de Chao Phraya. O Sião deve possuir as armas, docas, minas e defesas costeiras necessárias para fazer com que qualquer ameaça contra Bangkok seja um ato de loucura."
 SIA_preemtive_strike: "Ataque preventivo"
 SIA_preemtive_strike_desc: "Esperar o Japão escolher o momento da guerra seria tolice. Se o império tiver a intenção de devastar a Ásia, então os exércitos e frotas d[SIA.GetNameDef] deverão atacar antes que estejam completamente comprometidos em outro lugar."
 SIA_the_siamese_armada: "A armada d[SIA.GetNameDef]"
 SIA_the_siamese_armada_desc: "Um Estado [SIA.GetAdjective] moderno requer uma frota moderna. Com novos navios, tripulações treinadas e infraestrutura naval expandida, a armada d[SIA.GetNameDef] se tornará uma força capaz de defender nossos litorais e projetar nosso poder além deles."
 SIA_asian_democratic_compact: "Acordo Democrático Asiático"
 SIA_a_more_moderate_option: "Uma opção mais moderada"
 SIA_a_more_moderate_option_desc: "A reforma deve prevalecer, não se consumir dentro de uma tempestade de oposição. Ao manter o Dossiê Amarelo dentro de limites moderados, poderemos isolar os extremistas, acalmar as classes médias e construir uma ordem civil que sobreviverá à sua primeira vitória."
 SIA_asian_democratic_compact_desc: "A Ásia não pode contar para sempre com impérios distantes ou promessas de grandes potências. As nações democráticas da região devem permanecer juntas, defender umas às outras e provar que a independência e a liberdade podem sobreviver na Ásia."
 SIA_asian_democratic_compact_tt: "Desbloqueia a habilidade de exigir independência para Estados súditos asiáticos e permite convidá-los para a nossa facção."
 SIA_asian_democratic_compact_modify: "Modifica §Y$SIA_asian_democratic_compact$§! em:"
 SIA_southeast_asia_joint_command: "Comando Conjunto do Sudeste da Ásia"
 SIA_southeast_asia_joint_command_desc: "Nosso acordo deve se tornar mais do que uma promessa diplomática. Um comando conjunto coordenará o planejamento de estratégia, abastecimento, inteligência e defesa pelo sudeste asiático, transformando exércitos separados em um escudo comum."
 SIA_pan_asian_weapon_standardization: "Padronização pan-asiática de armamentos"
 SIA_pan_asian_weapon_standardization_desc: "Cada aliado que utiliza fuzis, calibres, rádios e veículos diferentes é um convite para a falha logística. Armas padronizadas e planos de produção compartilhados tornarão nossa coalizão mais forte, barata e mais rápida de armar."
 SIA_united_against_aggression: "União contra a agressão"
 SIA_united_against_aggression_desc: "Nenhum membro de nosso acordo ficará sozinho. Venha de onde vier a ameaça – do império, do fascismo, do militarismo ou de vizinhos oportunistas – as nações da Ásia responderão juntas."
 SIA_the_hammers_that_strike: "Os martelos que golpeiam"
 SIA_the_hammers_that_strike_desc: "Nossa aliança não é mais um conjunto de pequenos Estados torcendo para sobreviver. É uma arma. Cada nação é um martelo e juntos atacaremos qualquer potência que tentar dominar a Ásia."
 SIA_mobilize_the_defenders_of_siam: "Mobilizar os defensores do Sião"
 SIA_mobilize_the_defenders_of_siam_desc: "O antigo Exército falhou com a nação, mas o Sião ainda precisa de defensores. Voluntários, oficiais leais, guardas provinciais e cidadãos patriotas devem ser organizados em uma força que protege a constituição dos inimigos domésticos e estrangeiros."
 SIA_join_the_allies: "Juntar-se aos Aliados"
 SIA_join_the_allies_desc: "O Estado [ROOT.GetAdjective] não pode ficar sozinho enquanto o mundo é consumido pela guerra. Os Aliados oferecem armas, reconhecimento e um lugar em meio às nações que resistem à agressão. Ao nos unirmos a eles, vincularemos a sobrevivência do Sião ao conflito maior por um mundo livre."
 SIA_the_malay_peninsular_defense_plan: "O plano de defesa da Península Malaia"
 SIA_the_malay_peninsular_defense_plan_desc: "Se a guerra chegar ao sudeste asiático, a Malaia será um dos primeiros campos de batalha. Fortificações, depósitos de suprimentos e planejamento conjunto com os britânicos transformarão a península em um escudo contra invasões."
 SIA_the_malay_peninsular_defense_plan_tt: "Constrói uma ferrovia entre Bangkok e Singapura.\n\nCada ponto de vitória n[MAL.GetNameDef], Singapura, [724.GetName], [289.GetName] e [1076.GetName]:\nAdiciona §G2§! §Yfortes costeiros§!\nAdiciona §G2§! §Yfortes terrestres§!\nCada um desses estados:\nAdiciona §G1§! para §Yantiaéreo estático§!"
 SIA_join_the_united_front: "Juntar-se à Frente Unida"
 SIA_join_the_united_front_desc: "A China sangra diante da agressão d[JAP.GetNameDef], mas continua lutando. Ao unir-se à Frente Unida, o governo d[SIA.GetNameDef] pode ajudar a transformar a guerra terrestre em um cemitério para a ambição imperial."
 SIA_a_land_war_in_asia_desc: "A guerra não será vencida apenas por declarações. Soldados siameses devem marchar, lutar e resistir pelo terreno desafiador da Ásia. Nosso comprometimento com a Frente Unida deve ser demonstrado por meio da ação."
 SIA_death_to_the_communists: "Morte aos comunistas"
 SIA_death_to_the_communists_desc: "A derrota da camarilha militar não deve abrir as portas para outra tirania. Incitadores do comunismo acreditam que a crise enfraqueceu o Estado. Logo eles perceberão que a democracia civil não é indefesa."
 SIA_death_to_the_nationalists: "Morte aos nacionalistas"
 SIA_death_to_the_nationalists_desc: "O Japão foi repelido, mas a questão do futuro da Ásia permanece. A antiga ordem nacionalista só substituirá uma hierarquia por outra. Para que a Ásia passe por uma reforma, os comunistas devem vencer."
 SIA_a_new_dawn_over_asia: "Um novo amanhecer na Ásia"
 SIA_a_new_dawn_over_asia_desc: "O império japonês caiu e as forças corruptas que buscavam herdar suas ruínas foram abandonadas. Um novo amanhecer chega em toda a Ásia para as nações determinadas a construir seu futuro livres do domínio imperial."
 SIA_phibuns_premiership: "O mandato de Phibun"
 SIA_phibuns_premiership_desc: "Com o fim do mandato de [SIA_phraya_phahon.GetName], o sucessor escolhido pelo partido, Plaek Phibunsongkhram, está pronto para assumir o poder. Isso fortalecerá nossa posição junto aos militares, mas provocará inquietação na ala civil.\nPara nós, há apenas um caminho a seguir nesta nova era: convicção absoluta!"
 SIA_siamese_youth_movement: "Movimento jovem do Estado [THIS.GetAdjective]"
 SIA_siamese_youth_movement_desc: "Os jovens adultos d[THIS.GetNameDef] precisam ser moldados, como aço sobre uma chama ardente. Eles aprenderão a respeitar o Estado, a defender a pátria e a se tornar membros valiosos da sociedade tailandesa."
 SIA_territorial_defense_student: "Estudante de defesa territorial"
 SIA_territorial_defense_student_desc: "A partir do movimento jovem, os candidatos mais promissores poderão ser encaminhados para campos de treinamento de soldados juniores, onde ajudarão na defesa d[SIA.GetNameDef]. Eles receberão treinamento militar adequado e atuarão como um recurso adicional à disposição do Exército."
 SIA_expand_domestic_arms_workshops: "Expandir oficinas de armas domésticas"
 SIA_expand_domestic_arms_workshops_desc: "Nossa capacidade interna de produzir material bélico encontra-se muito aquém dos países desenvolvidos. Precisamos focar na expansão da produção militar em solo nacional para garantir que nossas forças recebam constantemente novos equipamentos."
 SIA_look_to_european_fascism: "Inspirar-se no fascismo europeu"
 SIA_look_to_european_fascism_desc: "Temos a oportunidade de reformar este país. Livres das amarras do passado, devemos nos concentrar em um novo futuro, inspirados pelo que está acontecendo no Ocidente. Claramente, a antiga ordem mundial está sendo desmantelada, e aqueles que ficarem para trás sofrerão as consequências de sua falta de visão."
 SIA_the_songsuradet_rebellion: "A rebelião de Songsuradet"
 SIA_the_songsuradet_rebellion_desc: "O oficial sênior Phraya Songsuradet representa uma ameaça ao regime atual, caso decida agir. Não podemos tolerar esse perigo e, como o principal opositor de Phibun, ele deve partir.\nSem dúvida, há um vasto material comprometedor que pode ser usado contra Songsuradet e seus apoiadores, o que ajudará a consolidar nosso poder e eliminar nossos adversários internos."
 SIA_the_songsuradet_rebellion_historical_tt: "O general Phraya Songsuradet será acusado de conspirar contra o Estado. Ele e o conselheiro §Y[SIA_rangsit_prayurasakdi.GetName]§! serão expurgados.\n\nNós ganharemos:\n"
 SIA_the_songsuradet_rebellion_historical_tt2: "Ao expirar, ganhe: "
 SIA_the_songsuradet_rebellion_historical_tt3: "por §Y[?var:SIA_purged_military_timer]§! dia(s)"
 SIA_the_songsuradet_rebellion_alt_tt: "O general Phraya Songsuradet será acusado de conspirar contra o Estado.\n\nNo entanto, como fortalecemos sua camarilha militar, ele pode sentir-se encorajado a recusar a convocação, o que poderá levar a um impasse ou até mesmo a uma guerra civil."
 SIA_sue_the_king_in_exile: "Processar o rei no exílio"
 SIA_sue_the_king_in_exile_desc: "Dizem que o rei exilado levou uma grande quantidade de riquezas para [ENG.GetNameDef]. Devemos recuperá-las, mesmo que isso signifique processar ele e sua esposa."
 SIA_suspend_ordinary_legal_procedures: "Suspender os procedimentos jurídicos ordinários"
 SIA_suspend_ordinary_legal_procedures_desc: "A rebelião de Songsuradet abre caminho para a promulgação de reformas abrangentes em nome da segurança nacional. Os mecanismos de controle mantidos pelos tribunais e outros órgãos políticos serão neutralizados, dando-nos o tempo necessário para centralizar o poder."
 SIA_the_duty_of_the_thai_people_during_the_war_act: "Lei do Dever do Povo Tailandês em Tempos de Guerra"
 SIA_the_duty_of_the_thai_people_during_the_war_act_desc: "$idea_SIA_cemented_control_3_desc$"
 SIA_recognize_manchukuo: "Reconhecer Manchukuo"
 SIA_recognize_manchukuo_desc: "TODO_CM"
 SIA_press_censorship: "Censura à imprensa"
 SIA_press_censorship_desc: "Uma imprensa totalmente livre pode ameaçar a estabilidade do Estado. Embora algum grau de liberdade deva existir, precisamos garantir que a voz e a vontade do governo tenham prioridade nos meios de comunicação."
 SIA_department_of_publicity: "Departamento de Publicidade"
 SIA_department_of_publicity_desc: "Uma máquina de propaganda é imprescindível para qualquer Estado, especialmente um como o nosso, com ambições territoriais. Financiar um Departamento de Publicidade nos permitirá alcançar esse objetivo."
 SIA_thai_cultural_mandates: "Mandatos culturais tailandeses"
 SIA_thai_cultural_mandates_desc: "Podemos inspirar o povo tailandês e construir uma forte cultura nacional por meio da emissão de mandatos, fortalecendo a união popular e forjando uma identidade unificada."
 SIA_thai_cultural_mandates_tt: "Desbloqueia decisões para promulgar mandatos culturais, concedendo diversos bônus ao custo de §Ypoder político§!. O Mandato Um e o primeiro mandato adicional são gratuitos."
 SIA_relocate_the_capital_to_phetchabun: "Realocar a capital para Phetchabun"
 SIA_relocate_the_capital_to_phetchabun_desc: "O governo está ameaçado! Como a história já demonstrou, Bangkok é vulnerável a ataques navais e, embora certamente seja uma decisão impopular, transferir a capital para uma região mais ao interior é uma medida necessária."
 SIA_relocate_the_capital_to_phetchabun_tt: "Realoca até §G3§! §Yfábricas militares§! do §Y[1076.GetName]§! para o §Y[1077.GetName]§!\nRealoca §G3§! §Yfábricas civis§! do §Y[1076.GetName]§! para o §Y[1077.GetName]§!\nConstrói fortes de nível §G3§! ao redor de Phetchabun."
 SIA_relocate_the_capital_to_phetchabun_tt2: "Quando o espírito expirar - Ganho de estabilidade base: §R-25%§!"
 SIA_radio_propaganda: "Propaganda via rádio"
 SIA_radio_propaganda_desc: "Com o desenvolvimento da rede elétrica, o rádio está se tornando um elemento essencial n[SIA.GetNameDef]. Assim como devemos controlar a imprensa, precisamos também controlar o que é transmitido via rádio."
 SIA_sala_chaloem_thai_movie_theater: "Cinema Sala Chaloem Thai"
 SIA_sala_chaloem_thai_movie_theater_tt: "Desbloqueia decisões para produzir filmes de propaganda, concedendo diversos bônus. Por exemplo:\n"
 SIA_sala_chaloem_thai_movie_theater_desc: "O cinema é um meio relativamente novo em nosso país, mas seu potencial é evidente. Assim como poemas, livros e o rádio, os filmes podem influenciar o coração e a mente tanto do povo comum quanto da elite. Ao utilizar esse meio, poderemos fortalecer a determinação dos cidadãos em ver a ascensão do grande Estado [SIA.GetAdjective]."
 SIA_pan_thaiism: "Pan-taiismo"
 SIA_pan_thaiism_desc: "Para [ROOT.GetNameDef], não basta sobreviver, é necessário prosperar. O futuro do povo [ROOT.GetAdjective] não é aceitar ser um Estado de terceira categoria, mas sim tornar-se um protagonista nos assuntos mundiais. Primeiro, é necessário despertar o coração e a mente do povo contra os imperialistas que tomaram o que nos era de direito, e lembrar a todos do que nos foi tirado."
 vichy_exist_trigger: "A §YFrança de Vichy§! existe"
 vichy_exist_not_trigger: "A §YFrança de Vichy§! não existe"
 SIA_retake_lost_british_states: "Retomar os estados britânicos perdidos"
 SIA_retake_lost_british_states_tt: "Desbloqueia a habilidade de iniciar guerras limitadas contra territórios britânicos na §YBirmânia§! e na §YMalásia§!"
 INS_retake_lost_british_states_tt: "Desbloqueia a habilidade de iniciar guerras limitadas contra territórios britânicos na §YMalásia§!"
 SIA_retake_lost_british_states_desc: "Não foi apenas o governo [FRA.GetAdjective] que dividiu nosso grande reino, mas também o Estado [ENG.GetAdjective] que, movidos pela ambição, tomaram tudo o que puderam. Agora que estão preocupados com inimigos maiores, chegou a hora de agir."
 SIA_recover_indochina: "Recuperar a Indochina"
 SIA_recover_indochina_desc: "O século passado viu a fragmentação de nossa pátria pelas mãos do Estado [FRA.GetAdjective], um governo distante que não tem qualquer direito de nos dizer o que fazer ou como viver. Ainda assim, com canhoneiras e armas, eles tomaram o que era nosso. Mas este é o nosso século, pois o poder d[FRA.GetNameDef] está em declínio."
 SIA_recover_indochina_tt: "Desbloqueia a habilidade de iniciar guerras limitadas contra territórios na §YIndochina§!"
 SIA_demand_the_return_of_lost_territory: "Exigir a devolução dos territórios perdidos"
 SIA_demand_the_return_of_lost_territory_desc: "O governo [FRA.GetAdjective] demonstrou sua fraqueza, um tigre de papel que se agarra desesperadamente a uma influência em declínio. Com o colapso de suas forças armadas, o país já não é mais capaz de projetar a força que outrora possuía e não está em posição de se opor às nossas exigências."
 SIA_demand_the_return_of_lost_territory_tt: "Solicitaremos aos controladores da §YIndochina§! e partes §Yd[MAL.GetNameDef]§! que devolvam §Y[1069.Getname]§!, §Y[1067.Getname]§!, o §Y[741.Getname]§!, §Y[1068.Getname]§!, §Y[1061.Getname]§!, §Y[1064.Getname]§!, §Y[1065.Getname]§! e §Y[670.Getname]§! para nós.\n\nFatores que influenciam:\n- Ter pelo menos 30% de força de combate em comparação com o controlador\n- O controlador estar em guerra com uma grande potência\n- O controlador não pertencer a uma facção\n- O controlador ser a §YFrança de Vichy§!\n- Estarmos em uma facção\n- O controlador não gostar de nós"
 SIA_the_greater_thai_empire: "O Grande Império Tailandês"
 SIA_the_greater_thai_empire_available_trigger: "O Estado §Y[ROOT.GetAdjective]§! controla todos os estados da Indochina.\nA conformidade de cada estado da Indochina é superior a §Y[?var:SIA_greater_thai_empire_compliance_requirement]%§!\n\nRequisitos adicionais: "
 SIA_the_greater_thai_empire_desc: "Chegou a hora de nossa ascensão. Aquilo que nos fora tomado foi restaurado e, com o povo nos reconhecendo como a verdadeira autoridade, consolidamos nossa legitimidade como os líderes deste renovado Grande Império Tailandês."
 SIA_crack_down_of_foreign_merchants: "Reprimir comerciantes estrangeiros"
 SIA_crack_down_of_foreign_merchants_desc: "O comércio tem sido moldado por interesses externos há muito tempo, criando vulnerabilidades que podem afetar nossa resiliência nacional. Para proteger nossa segurança econômica, devemos ser capazes de controlar nosso próprio comércio, garantindo que a prosperidade e a estabilidade se apoiem em bases que nós mesmos controlamos."
 SIA_royal_palace_bureau_directive_no_1523: "Diretiva n° 1.523 do Gabinete do Palácio Real"
 SIA_royal_palace_bureau_directive_no_1523_desc: "Com o crescimento do nacionalismo no país, até mesmo a Coroa declarou seu apoio ao governo, solicitando que todos os membros do Palácio Real doem 10% de sua renda para a compra de armamentos modernos."
 SIA_end_factionalism: "Acabar com o faccionalismo"
 SIA_end_factionalism_desc: "A divisão entre as alas militar e civil do Khana Ratsadon tem influenciado todas as decisões desde a revolução. Se conseguirmos preservar a lealdade de ambas as facções ao governo por tempo suficiente, poderemos unificá-las em um só Partido Popular Unido e afastar de vez o fantasma dos golpes de Estado."
 SIA_end_factionalism_available_tt: "Tanto a §Yala civil§! quanto a §Yala militar§! mantiveram §Gapoio total§! por §Y270§! dias consecutivos."
 SIA_end_factionalism_tt: "A rivalidade entre as facções dentro do Khana Ratsadon chega ao fim:\n   As alas §Ycivil§! e §Ymilitar§! se fundem para formar o §GPartido Popular Unido§!\n   Ganha o espírito §Y$idea_SIA_unified_khana_ratsadon$§!"
 SIA_turn_off_the_khana_ratsadon: "O Khana Ratsadon foi desativado"
 SIA_factionalism_overcome: "O faccionalismo foi superado"
 SIA_new_territories_administration: "Administração dos novos territórios"
 SIA_new_territories_administration_tt: "Desbloqueia decisões para administrar os territórios da §YIndochina§!, concedendo aumento de conformidade, indústria e fortificações."
 SIA_new_territories_administration_desc: "Recuperar nossos territórios perdidos é apenas o começo. Devemos demonstrar àqueles que vivem nessas terras que somos uma alternativa melhor. Um programa abrangente será implementado para elevar o padrão de vida de todos, garantindo que cada cidadão se sinta igual nesta nova era d[ROOT.GetNameDef]."
 SIA_new_territories_administration_available_trigger: "Qualquer estado na §YIndochina§!\n   É controlado §Ypel[ROOT.GetNameDef]§!"
 SIA_industrialization_drive: "Campanha de industrialização"
 SIA_industrialization_drive_desc: "Por gerações, a riqueza d[ROOT.GetNameDef] repousou nos campos de arroz e nas aldeias rurais. Contudo, o mundo moderno é moldado não pelo arado, mas pelas fábricas e máquinas. Se quisermos preservar nossa independência entre as grandes potências, teremos que transformar nosso reino agrário em uma nação industrial."
 SIA_industrialization_drive_trigger: "O §YKhana Ratsadon§! está ativo"
 SIA_asian_financial_compact: "Acordo Financeiro Asiático"
 SIA_asian_financial_compact_desc: "O capital europeu ainda domina grande parte do comércio asiático, deixando nossa economia exposta à pressão estrangeira. Ao buscarmos acordos financeiros mais próximos com nossos vizinhos, poderemos ampliar nosso acesso a crédito, mercados e investimentos sem abrir mão de nossa independência."
 SIA_revision_of_unequal_treaties: "Revisão dos tratados desiguais"
 SIA_revision_of_unequal_treaties_desc: "Antigos acordos firmados em momentos de fraqueza ainda concedem privilégios a interesses estrangeiros que nenhum Estado moderno deveria tolerar. Devemos revisar esses tratados desiguais e restaurar a plena autoridade d[ROOT.GetNameDef] sobre seu comércio, tribunais e concessões."
 SIA_renegotiate_teak_control: "Renegociar o controle da madeira de teca"
 SIA_renegotiate_teak_control_desc: "Nossas florestas ao norte enriquecem concessionárias enquanto pouco é devolvido ao Estado. Ao renegociar o controle da madeira de teca, poderemos recuperar receita, regular a extração e garantir que a madeira siamesa sirva ao desenvolvimento do Sião."
 SIA_a_fledgling_tobacco_industry: "Uma indústria de tabaco em formação"
 SIA_a_fledgling_tobacco_industry_desc: "O tabaco permanece um mercado secundário, disperso e mal organizado. Com alguma proteção e investimento, essa pequena cultura pode se tornar uma fonte confiável de receita tributária, renda rural e trabalho nas fábricas."
 SIA_a_fledgling_tobacco_industry_tt: "Estar com §Y$limited_exports$§! ou §Y$closed_economy$§! nos renderá uma §Yfábrica civil§! extra"
 SIA_all_weather_roads: "Estradas para todos os climas"
 SIA_all_weather_roads_desc: "Muitas estradas desaparecem durante as chuvas, deixando províncias isoladas da capital e dos mercados. Uma rede de estradas para todos os climas unirá o reino e permitirá a circulação de mercadorias e soldados em qualquer estação."
 SIA_the_bank_of_siam: "O Banco de Sião"
 SIA_the_bank_of_siam_desc: "O crescimento industrial não pode depender apenas de clientes e favores privados. Um banco nacional mais forte dará ao Estado maior controle sobre o crédito, a moeda e a circulação de capital."
 SIA_thai_rice_company: "Companhia de Arroz Tailandesa"
 SIA_thai_rice_company_desc: "O arroz continua sendo a base d[ROOT.GetNameDef], mas grande parte de seu comércio permanece fragmentada, especulativa e vulnerável à pressão estrangeira. Uma companhia nacional de arroz permitirá ao Estado orientar as exportações, estabilizar preços e transformar a produção dos nossos arrozais em um alicerce para a força nacional."
 SIA_uk_japan_focus_tt: "Que permite escolher entre [ENG.GetNameDef] e [JAP.GetNameDef] com os seguintes efeitos:\n\n§Y[ENG.GetFlag][ENG.GetNameDefCap]§!:"
 SIA_japan_option_tt: "§Y[JAP.GetFlag][JAP.GetNameDefCap]§!"
 SIA_send_bureaucrats_abroad: "Enviar burocratas ao exterior"
 SIA_send_bureaucrats_abroad_desc: "Outras nações já construíram os ministérios, escolas e serviços técnicos de que agora necessitamos. Ao enviar oficiais promissores para o exterior, poderemos obter experiência administrativa sem importar junto o domínio estrangeiro."
 SIA_baht_stabilization_act: "Lei de estabilização do baht"
 SIA_baht_stabilization_act_desc: "Uma economia moderna exige uma moeda que os comerciantes confiem e os investidores aceitem. Estabilizar o baht reduzirá a incerteza no comércio e dará ao Estado [ROOT.GetAdjective] uma posição mais firme no mercado internacional."
 SIA_siamese_development_cooperative: "Cooperativa de Desenvolvimento Siamesa"
 SIA_siamese_development_cooperative_desc: "O capital privado é cauteloso e o Estado não pode construir tudo sozinho. Uma cooperativa nacional de desenvolvimento permitirá que oficiais, comerciantes e proprietários de terras unam recursos para projetos que sirvam à economia."
 SIA_boon_rawd_brewery: "Cervejaria Boon Rawd"
 SIA_boon_rawd_brewery_desc: "Desenvolver uma indústria cervejeira nacional vai além do consumo. Empresas como a Boon Rawd mostram que capital, maquinário e gestão siameses são capazes de criar uma indústria moderna dentro do próprio país."
 SIA_national_savings_bond: "Título de poupança nacional"
 SIA_national_savings_bond_desc: "A riqueza da nação não deve permanecer ociosa em cofres e ornamentos em detrimento de estradas e fábricas. Um título nacional de poupança transformará a economia privada em investimento público."
 SIA_national_savings_bond_tt: "Recebe o espírito $SIA_national_savings_bond$, cujo efeito varia conforme a §Ylei de alistamento§!. Quanto menor for a lei de alistamento, mais fortes serão os efeitos positivos, enquanto níveis mais altos reduzem esses efeitos.\n\nCom §Y$disarmed_nation$§!, ganhe: "
 SIA_national_savings_bond_scraping_the_barrel: "Com §Y$scraping_the_barrel$§!, ganhe:"
 SIA_national_savings_bond_volunteer_only: "Com §Y$volunteer_only$§!, ganhe:"
 SIA_national_savings_bond_limited_conscription: "Com §Y$limited_conscription$§!, ganhe:"
 SIA_national_savings_bond_extensive_conscription: "Com §Y$extensive_conscription$§!, ganhe:"
 SIA_national_savings_bond_service_by_requirement: "Com §Y$service_by_requirement$§!, ganhe:"
 SIA_national_savings_bond_all_adult_serve: "Com §Y$all_adults_serve$§!, ganhe:"
 SIA_national_savings_bond_current: "Nossa lei de mobilização atual nos concederia: "
 SIA_deficit_spending: "Gastos com déficit"
 SIA_deficit_spending_desc: "A contabilidade ortodoxa não construirá uma economia moderna a tempo de enfrentar um mundo perigoso. O Estado deve estar disposto a gastar além das receitas atuais, utilizando obras públicas e aquisições para impulsionar o crescimento industrial."
 SIA_deficit_spending_tt: "Após o espírito expirar, ganhe: "
 SIA_acquire_light_tools: "Adquirir ferramentas leves"
 SIA_acquire_light_tools_desc: "Antes de produzirmos grandes máquinas, devemos primeiro dominar os instrumentos mais humildes da indústria. As importações de ferramentas leves e equipamentos permitirão que pequenas fábricas e oficinas de reparo se espalhem pel[ROOT.GetNameDef]."
 SIA_railway_and_port_extensions: "Extensões ferroviárias e portuárias"
 SIA_railway_and_port_extensions_desc: "Arroz, madeira e estanho só têm valor se chegarem ao mercado. A expansão das ferrovias e dos portos atrairá as províncias para o comércio nacional e conectará [ROOT.GetNameDef] ao mundo."
 SIA_mechanization_of_agriculture: "Mecanização da agricultura"
 SIA_mechanization_of_agriculture_desc: "Grande parte da mão de obra ainda permanece ligada à agricultura tradicional, gerando pouco excedente para a indústria. Ao introduzirmos ferramentas e máquinas modernas no campo, poderemos aumentar a produção e liberar trabalhadores para as fábricas."
 SIA_irrigation: "Irrigação"
 SIA_irrigation_desc: "A prosperidade do camponês ainda depende das cheias e das secas. Um sistema de irrigação mais amplo estabilizará as colheitas, ampliará as áreas cultivadas e tornará o campo uma base mais sólida para o desenvolvimento nacional."
 SIA_siam_cement_group: "Grupo Cimenteiro d[ROOT.GetNameDef]"
 SIA_siam_cement_group_desc: "Fundado sob patronagem real, o Grupo Cimenteiro d[ROOT.GetNameDef] continua sendo um dos empreendimentos industriais mais relevantes do governo [ROOT.GetAdjective]. Com investimento direcionado e apoio governamental, a empresa pode se transformar, passando de um fornecedor nacional a uma pedra angular de nossa capacidade industrial mais ampla, estabelecendo as bases, quase que literalmente, para o futuro da nação."
 SIA_chemical_imports: "Importação de produtos químicos"
 SIA_chemical_imports_desc: "A agricultura e a indústria moderna dependem de compostos que ainda não produzimos em quantidade suficiente. A importação de produtos químicos fornecerá fertilizantes, medicamentos, corantes e explosivos até que a indústria nacional possa assumir essa função."
 SIA_chemical_imports_tt: "Adicionará §G+1§! §Yfábrica civil§! fora do mapa se a opinião estiver acima de §Y[?var:ROOT.SIA_chemical_imports_opinion_threshold]§! quando este foco for concluído."
 INS_chemical_imports_stolen_tt: "Adicionará §G[?var:ROOT.INS_guns_from_seek_help_focus]§! unidades de equipamento para infantaria se a opinião estiver acima de §Y75§! quando este foco for concluído."
 SIA_foreign_currency_exchange: "Câmbio de moeda estrangeira"
 SIA_foreign_currency_exchange_desc: "A industrialização exige maquinário, medicamentos e combustível estrangeiros, mas só é possível comprá-los com as poucas divisas disponíveis. Um sistema controlado de câmbio direcionará recursos estrangeiros para as indústrias mais vitais ao Estado."
 SIA_farmers_into_the_city: "Agricultores na cidade"
 SIA_farmers_into_the_city_desc: "Uma economia moderna não se sustenta apenas com o trabalho rural. À medida que a indústria se expande, o Estado deve incentivar a migração ordenada dos arrozais para as cidades, nas quais uma nova força de trabalho urbana poderá ser formada."
 SIA_textile_mills: "Fábricas têxteis"
 SIA_textile_mills_desc: "O tecido é uma necessidade diária, mas grande parte ainda é feita no exterior e revendida a nós. As fábricas têxteis substituirão os produtos importados, empregarão mão de obra urbana e darão ao Estado [ROOT.GetAdjective] uma das indústrias básicas da vida moderna."
 SIA_public_credit: "Crédito público"
 SIA_public_credit_desc: "Comerciantes, produtores e fabricantes estão limitados pelo acesso restrito ao capital. Ao expandir o crédito público, o governo poderá emprestar quando o financiamento privado não arrisca se envolver e impulsionar o desenvolvimento em setores negligenciados."
 SIA_public_credit_trigger: "$idea_SIA_public_credit_debt$ esteve ativo por pelo menos §Y180 dia(s)§!"
 SIA_a_modern_economy: "Uma economia moderna"
 SIA_a_modern_economy_desc: "A antiga ordem agrária não desaparece em um dia, mas já não define mais o futuro d[ROOT.GetNameDef]. Com bancos, escolas, fábricas e infraestrutura tomando forma, começamos a construir uma economia digna de uma nação moderna e independente."
 SIA_reduction_of_agricultural_yield_taxes: "Redução dos impostos sobre a produção agrícola"
 SIA_reduction_of_agricultural_yield_taxes_tt: "Reduz os §Ybens de consumo§! provenientes da $idea_SIA_agricultural_tax_reduction$ em §Y[?var:SIA_agricultural_tax_reduction_cg_decrease_rate|%]§! ao mês e aumenta a §Yestabilidade§! em §Y[?var:SIA_agricultural_tax_reduction_stability_gain|%]§! ao mês, até que a penalidade de §Ybens de consumo§! atinja §Y0%§!\n\nQuando o espírito nacional é removido, ganha:\n"
 SIA_reduction_of_agricultural_yield_taxes_desc: "Os camponeses não podem ser obrigados a sustentar o reino, financiar o Estado e suportar todas as dificuldades sem nenhum amparo. Ao reduzir os impostos sobre a produção agrícola, deixaremos mais recursos no campo, fortaleceremos a lealdade dos agricultores e incentivaremos um aumento da produção."
 SIA_fuel_oil_act: "Lei do petróleo combustível"
 SIA_fuel_oil_act_desc: "O transporte, a indústria e a defesa moderna dependem de combustível, mas o acesso a ele pode ser restrito em tempos de guerra. Uma legislação para o combustível de petróleo colocará a distribuição de consumo, armazenamento e emergências sob o controle mais rigoroso do Estado, evitando o desperdício de suprimentos escassos."
 SIA_siam_electricity_company: "Companhia Elétrica do Sião"
 SIA_siam_electricity_company_desc: "Nenhuma economia suporta as exigências modernas sem um fornecimento confiável de energia. Ao fortalecer a Companhia Elétrica do Sião, poderemos expandir a geração, melhorar a coordenação e garantir que oficinas, depósitos e cidades permaneçam abastecidos mesmo em tempos difíceis."
 SIA_revise_the_taxation_system: "Revisar o sistema tributário"
 SIA_revise_the_taxation_system_desc: "A atual estrutura tributária não serve adequadamente a um Estado que se prepara para resistir e ser autossuficiente. Um sistema revisado coletará receitas de forma mais equilibrada, reduzirá desperdícios e distribuirá o ônus da defesa nacional e do desenvolvimento com maior disciplina."
 SIA_census_the_hill_tribes: "Censo das tribos das colinas"
 SIA_census_the_hill_tribes_desc: "As terras altas permanecem além do alcance da administração, da tributação e do abastecimento. Um censo completo dará ao governo as informações necessárias para governar melhor essas áreas e trazer seu povo e recursos para a vida nacional."
 SIA_increase_rice_exports: "Aumentar as exportações de arroz"
 SIA_increase_rice_exports_desc: "O arroz é a fonte mais segura de renda estrangeira disponível para [ROOT.GetNameDef]. Ao expandir as exportações enquanto os mercados permanecem abertos, poderemos acumular reservas, financiar importações estratégicas e preparar o tesouro para possíveis crises futuras."
 SIA_pad_thai: "Pad thai"
 SIA_pad_thai_desc: "Uma nação moderna não é sustentada apenas por ministérios e fábricas, mas também por hábitos comuns que unem o povo. Ao promover um prato nacional de arroz inspirado em ingredientes siameses, incentivaremos o consumo interno, apoiaremos nossos agricultores e reduziremos a dependência de alimentos estrangeiros em tempos incertos."
 SIA_rice_husk_steam_turbines: "Turbinas a vapor de casca de arroz"
 SIA_rice_husk_steam_turbines_desc: "A necessidade nos ensina a valorizar aquilo que os estrangeiros enxergam como lixo. Ao queimar cascas de arroz para a geração de vapor, poderemos extrair energia de nossas próprias colheitas e diminuir a dependência de carvão e petróleo importados."
 SIA_domestic_tin_smelters: "Fundições domésticas de estranho"
 SIA_domestic_tin_smelters_desc: "Já não basta extrair minério do solo e exportá-lo. Construir fundições de estanho no país nos permitirá manter uma parcela maior de nossos recursos e garantir um metal industrial importante tanto para o comércio quanto para a guerra."
 SIA_use_ships_as_generators: "Usar navios como geradores"
 SIA_use_ships_as_generators_tt: "Posicionar §Ynavios capitânias§! sob nosso controle em §Yportos de estados centrais§! concederá um bônus de §G-2%§! no consumo de energia das fábricas por §Ynavio capitânia§!, até um máximo de §G-15%§!.\n\nA saída desses navios dos portos reduzirá o bônus na mesma proporção, que poderá ser recuperado ao retornarem."
 SIA_use_ships_as_generators_desc: "Mesmo embarcações antigas ainda podem servir à nação quando já não são adequadas para combate ou comércio. Ao utilizá-las como usinas flutuantes, poderemos fornecer eletricidade emergencial a portos e indústrias costeiras, preservando combustível e infraestrutura."
 SIA_diversity_foreign_reserves: "Diversificar reservas estrangeiras"
 SIA_diversity_foreign_reserves_desc: "É perigoso para o Estado [ROOT.GetAdjective] colocar sua segurança financeira na moeda ou no crédito de uma única potência estrangeira. Ao diversificar nossas reservas, reduziremos o risco de choques externos e garantiremos maior autonomia no campo comercial e diplomático."
 SIA_diversity_foreign_reserves_tt: "Adiciona mais §G2§! §Yfábricas militares§! fora do mapa ao entrar em guerra.\nAdiciona a produção de §G8§! unidades de aço em um estado central aleatório ao entrar em guerra."
 SIA_exclusivity_resource_contract: "Contrato de exclusividade de recursos"
 SIA_exclusivity_resource_contract_desc: "Um único parceiro estrangeiro oferece capital e compras garantidas em troca de acesso privilegiado aos nossos recursos. Tal contrato exclusivo pode acelerar o desenvolvimento, mas atrela parte do futuro d[ROOT.GetNameDef] às vontades de outra nação."
 SIA_maintain_resource_independence: "Manter independência de recursos"
 SIA_maintain_resource_independence_desc: "Contratos estrangeiros podem trazer lucros rápidos, mas também criam dependência. Ao manter o controle sobre nossos recursos, preservaremos a liberdade de direcioná-los de acordo com as necessidades dos siameses, em vez de atender a exigências externas."
 SIA_kasetsart_university: "Universidade Kasetsart"
 SIA_kasetsart_university_desc: "Para aumentar a produtividade da agricultura, é necessário orientá-la pelo viés da ciência, e não apenas pela tradição. A Universidade Kasetsart formará agrônomos, veterinários e especialistas técnicos para a modernização do campo."
 SIA_mahidol_university: "Universidade Mahidol"
 SIA_mahidol_university_desc: "Um Estado moderno precisa de médicos, pesquisadores e administradores tanto quanto de soldados e engenheiros. A Universidade Mahidol fortalecerá o ensino superior e fornecerá as mentes necessárias para conduzir a reforma nacional."
 SIA_silpakorn_university: "Universidade Silpakorn"
 SIA_silpakorn_university_desc: "TODO_CM"
 SIA_contingency_funds: "Fundos de contingência"
 SIA_contingency_funds_desc: "A prosperidade em tempos de paz pouco valerá se o Estado não estiver pronto para a crise. Ao reservar fundos de contingência agora, garantiremos que bloqueios, colheitas fracassadas ou guerras repentinas não paralisarão imediatamente a máquina governamental."
 SIA_contingency_funds_tt: "Durante tempos de paz, acumularemos um fundo de contingência. Esse processo trará um ganho moderado no §Yfator de bens de consumo§!.\n\nEm tempos de guerra, poderemos liberar esse fundo, obtendo um grande bônus de produção.\nA duração do fundo dependerá de quanto tempo foi acumulado antes de sua liberação."
 SIA_prepare_for_the_next_blockade: "Preparar para o próximo bloqueio"
 SIA_prepare_for_the_next_blockade_desc: "Se os mares se tornarem hostis, o Estado [ROOT.GetAdjective] poderá ficar sem acesso a mercados, máquinas e combustível. Precisamos nos preparar antecipadamente para o próximo bloqueio, reforçando nossos estoques e elaborando planos de emergência e suplentes antes que a necessidade nos obrigue."
 SIA_domestic_arms_industry: "Indústria bélica doméstica"
 SIA_domestic_arms_industry_desc: "Um reino que depende totalmente da importação de fuzis e projéteis não pode se considerar seguro. Mesmo começando de forma modesta, uma indústria bélica nacional permitirá que o Estado [ROOT.GetAdjective] equipe seus soldados com produção própria e resista quando não houver suprimentos estrangeiros."
 SIA_war_material_substitutions: "Substituições de material bélico"
 SIA_war_material_substitutions_desc: "Em tempos de bloqueio, o material disponível é mais valioso do que o ideal. Devemos estudar substitutos para metais, produtos químicos e componentes importados, para que a produção continue mesmo quando os bens estrangeiros deixarem de chegar aos nossos portos."
 SIA_royal_thai_ordnance_factory: "Fábrica Real de Armamentos Tailandesa"
 SIA_royal_thai_ordnance_factory_desc: "Um Estado seguro exige mais do que armas importadas e oficinas dispersas. A Fábrica Real de Armamentos Tailandesa concentrará habilidade, maquinário e supervisão sob a Coroa, dando ao Estado [ROOT.GetAdjective] um centro permanente para a produção de armas e munições."
 SIA_built_to_withstand_every_flame: "Construído para resistir a qualquer chama"
 SIA_built_to_withstand_every_flame_desc: "A fábrica consumida pelo fogo à noite não pode servir à nação no dia seguinte. Nossos armazéns, usinas e oficinas devem ser construídos com dispersão, proteção contra incêndios e medidas de emergência em mente, para que sabotagem, bombardeios ou acidentes não paralisem tão facilmente a produção."
 SIA_the_army_of_siam: "O Exército do Sião"
 SIA_the_army_of_siam_desc: "A velha estrutura de nossas forças armadas já não responde às exigências da era. Para que o Estado [ROOT.GetAdjective] defenda sua soberania e afirme seus interesses no exterior, devemos formar um novo e moderno Exército, equipado, treinado e organizado para as guerras que estão se formando pelo mundo."
 SIA_plan_for_a_short_war: "Plano para uma guerra curta"
 SIA_plan_for_a_short_war_desc: "Nossos recursos são limitados e nossos inimigos podem ser muitos. O Estado [ROOT.GetAdjective] não consegue suportar um conflito de desgaste prolongado. Se a guerra chegar, ela será rápida, decisiva e terminará antes que o inimigo possa reunir suas forças."
 SIA_intermediate_war_preparation: "Intermediar preparação de guerra"
 SIA_intermediate_war_preparation_desc: "É perigoso preparar-se para uma campanha-relâmpago, mas organizar-se inteiramente para um conflito sem fim é um desperdício. Uma doutrina equilibrada permitirá que o Estado [ROOT.GetAdjective] ataque com vigor enquanto mantém a resistência necessária para encarar um inimigo mais obstinado."
 SIA_prepare_for_a_long_war: "Preparar-se para uma guerra longa"
 SIA_prepare_for_a_long_war_desc: "As grandes potências podem decidir guerras em meses, mas nações menores costumam ser forçadas a suportá-las por muitos anos. Dessa forma, devemos preparar a indústria, a logística e as armas d[ROOT.GetNameDef] para um conflito longo no qual paciência e resiliência importam tanto quanto coragem."
 SIA_specialized_warfare: "Guerra especializada"
 SIA_specialized_warfare_desc: "O terreno da nossa região não favorece um exército uniforme. Montanhas, selvas e rios exigem habilidades diferentes. Ao desenvolver tropas especializadas, poderemos garantir que o Estado [ROOT.GetAdjective] enfrentará o inimigo com a força adequada em qualquer campo."
 SIA_artillery_reigns_supreme: "A artilharia é soberana"
 SIA_artillery_reigns_supreme_desc: "O conflito moderno não é vencido apenas pelo moral. A arma de fogo continua reinando no campo de batalha, neutralizando posições fortificadas, acabando com ofensivas e abrindo caminho para a nossa infantaria. Para que triunfemos, o poder de fogo d[ROOT.GetNameDef] deve se tornar vasto e preciso."
 SIA_yield_the_air_war: "Abandonar a guerra aérea"
 SIA_yield_the_air_war_desc: "Não podemos esperar desafiar as grandes potências no céu em pé de igualdade. Em vez de desperdiçar recursos preciosos em um conflito com poucas chances de vitória, devemos fortalecer nossas defesas antiaéreas e impedir que as aeronaves inimigas tenham a liberdade de atacar nossos homens e cidades sem custo."
 SIA_the_thunder_at_the_gates: "O trovão nos portões"
 SIA_the_thunder_at_the_gates_desc: "Existem fortalezas que armas comuns não podem derrubar e ataques que devem ser anunciados com força devastadora. Artilharia pesada, armas de cerco e canhões ferroviários darão ao governo d[ROOT.GetNameDef] o poder de derrubar os portões de qualquer inimigo que confundir nossa moderação com fraqueza."
 SIA_night_time_training: "Treinamento noturno"
 SIA_night_time_training_desc: "Ataques temerários em plena luz do dia anunciam o desastre contra um inimigo preparado. Ao treinar nossos homens para infiltração, movimentação e ataque sob a cobertura da escuridão, poderemos tomar a iniciativa quando nosso inimigo estiver cego, confuso e despreparado para lidar conosco."
 SIA_steel_arteries: "Artérias de aço"
 SIA_steel_arteries_desc: "Nenhum exército marcha até muito longe sem ferrovias e estradas para sustentá-lo. As artérias de aço da nação devem ser fortalecidas para que as tropas, suprimentos e armas possam ser carregados de forma rápida até cada fronteira ameaçada. Nesse quesito, a segurança militar e o desenvolvimento nacional caminham de mãos dadas."
 SIA_prepare_northern_infrastructure_for_war: "Preparar a infraestrutura do norte para a guerra"
 SIA_prepare_northern_infrastructure_for_war_desc: "As abordagens pelo norte se tornarão essenciais em qualquer disputa com a Birmânia e aqueles que a apoiam. Estradas, ferrovias e depósitos na região devem ser expandidos imediatamente para que as forças d[ROOT.GetNameDef] possam avançar ou resistir por lá sem atrasos."
 SIA_unconventional_tank_construction: "Construção não convencional de tanques"
 SIA_unconventional_tank_construction_desc: "Não podemos imitar os programas de blindados das grandes potências com exatidão. Para que o governo d[ROOT.GetNameDef] possa colocar tanques no campo de batalha, devemos buscar métodos mais baratos e adaptáveis de construção, sacrificando a grandeza em favor de quantidade e utilidade."
 SIA_conventional_tank_construction: "Construção convencional de tanques"
 SIA_conventional_tank_construction_desc: "Os blindados se tornaram um armamento adotado nas guerras modernas, e as soluções improvisadas não nos levarão longe. Portanto, devemos estabelecer uma indústria de tanques adequada com base em princípios razoáveis, designs padrão e métodos de produção confiáveis, dignos de um Exército moderno."
 SIA_reverse_engineer_allied_tanks: "Engenharia reversa dos tanques aliados"
 SIA_reverse_engineer_allied_tanks_desc: "Outros já arcaram com o custo da experimentação. Tanques capturados e máquinas importadas podem ser desmantelados, estudados e copiados. Ao aprender sobre os designs estrangeiros, o governo [ROOT.GetAdjective] poderá encurtar o caminho para sua própria força blindada."
 SIA_tankettes: "Tankettes"
 SIA_tankettes_desc: "Os tankettes podem não decidir grandes batalhas sozinhos, mas são leves, baratos, fáceis de produzir e ainda podem servir para reconhecimento, guerra colonial e suporte à infantaria. Para uma nação com recursos modestos, tais veículos blindados pequenos oferecem uma entrada prática à guerra mecanizada."
 SIA_jungle_armor: "Blindados para a selva"
 SIA_jungle_armor_desc: "As selvas da nossa região não são lugar para máquinas pesadas projetadas para as planícies da Europa. Se o governo d[ROOT.GetNameDef] deseja usar blindados, eles devem ser adaptados para passagens estreitas, terreno acidentado e clima opressivo, trocando peso por mobilidade onde a selva exigir."
 SIA_mountain_tanks: "Tanques de montanha"
 SIA_mountain_tanks_desc: "Colinas acidentadas e passos montanhosos não podem simplesmente ser deixados apenas para a infantaria. Ao buscar veículos blindados compactos adequados para terrenos irregulares, poderemos dar aos nossos exércitos um meio de levar poder de fogo protegido a regiões inadequadas para tanques comuns."
 SIA_reluctant_submission: "Submissão relutante"
 SIA_reluctant_submission_desc: "Se o território d[ROOT.GetNameDef] enfrentar uma invasão por uma força maior, poderá chegar o momento em que a resistência aberta trará apenas ruína. Curvar-se é doloroso, mas em certos momentos um governo deve ceder para preservar a nação da destruição e aguardar um momento mais favorável."
 SIA_reluctant_submission_trigger: "Este foco será concluído automaticamente se formos atacados e escolhermos a opção §YSubmissão§! no evento."
 SIA_reluctant_submission_tt: "Seremos capazes de negociar a paz com um país principal agressor. Contudo, eles exigirão a impressão de dinheiro em troca.\nNosso §Yfator de fábricas de bens de consumo§! aumentará em §Y[?idea_SIA_printing_money_monthly_change|%]§! ao mês, até o máximo de §Y[?idea_SIA_printing_money_monthly_change_max|%]§!.\n\nAdotar o foco §Y$SIA_thai_rice_company$§! reduzirá essa taxa de aumento em §G50%§!.\n\nAdotar o foco §Y$SIA_demand_repatriation$§! eliminará a necessidade de imprimir dinheiro."
 SIA_seri_thai: "Seri Thai"
 SIA_seri_thai_desc: "A submissão não precisa significar rendição do espírito nacional. Debaixo da superfície da ocupação e da conformidade, uma célula clandestina leal pode ser organizada para preservar a causa da independência, reunir inteligência e preparar tudo para o momento que o Estado [ROOT.GetAdjective] se reerguer."
 SIA_contact_the_south_east_asia_command: "Contatar o Comando do Sudeste Asiático"
 SIA_contact_the_south_east_asia_command_desc: "Para que a resistência vá além de apenas atos de valentia, ela deve estar vinculada a uma estratégia mais ampla. Ao estabelecer contato com o comando dos Aliados no sudeste asiático, os patriotas d[ROOT.GetNameDef] devem garantir orientação, suprimentos e um lugar no grande conflito."
 SIA_broadcast_weather_reports_to_the_allies: "Transmitir boletins meteorológicos aos Aliados"
 SIA_broadcast_weather_reports_to_the_allies_desc: "Os céus e mares da região são governados tanto pelo clima quanto por frotas e exércitos. Relatórios confiáveis d[ROOT.GetNameDef] podem ajudar no planejamento dos Aliados, proteger suas operações de surpresas e fazer da nossa terra natal uma parceira silenciosa, porém valiosa na guerra."
 SIA_american_investment_aid: "Auxílio de investimento americano"
 SIA_american_investment_aid_desc: "Os Estados Unidos detêm uma riqueza maior do que qualquer coisa disponível em nossa própria região. Se pudermos garantir o auxílio e o investimento americanos para nossos esforços nacionais e clandestinos, o Estado [ROOT.GetAdjective] ganhará os meios materiais para resistir às adversidades e se preparar para a libertação."
 SIA_thai_students_in_the_oss: "Estudantes tailandeses na OSS"
 SIA_thai_students_in_the_oss_desc: "Uma nova geração de jovens patriotas pode ser treinada além-mar nas artes de espionagem, sabotagem e guerra irregular. Ao enviar estudantes tailandeses de confiança para a margem da inteligência dos Aliados, prepararemos servos capacitados para a guerra oculta que está por vir."
 SIA_prepare_to_drop: "Preparar para saltar"
 SIA_prepare_to_drop_desc: "Quando o momento da libertação chegar, os Aliados podem entrar em nosso país pelo céu. Dessa forma, devemos identificar os locais de pouso, preparar contatos e organizar redes de apoio para que as forças aerotransportadas possam ser recebidas e direcionadas para onde são mais necessárias."
 SIA_unseat_the_government: "Derrubar o governo"
 SIA_unseat_the_government_desc: "Não podemos permitir que um regime que prendeu [ROOT.GetNameDef] ao domínio estrangeiro dure para sempre. Por meio de resistência, intriga e ação assertiva, poderemos remover aqueles que lesaram a nação e restaurar um governo mais digno do Sião."
 SIA_unseat_the_government_tt: "O governo [ROOT.GetAdjective] deixará sua facção atual e mudará de lado na guerra, juntando-se aos §YAliados§!.\n\nOs lealistas se levantarão contra a mudança, desencadeando uma guerra civil.\n\nSe o nosso apoio combinado for §Ysuperior a 80%§!, derrubaremos o governo e evitaremos a guerra civil. Nosso apoio total corresponde a §Y5%§! para cada general previamente persuadido, somado ao nosso apoio democrático.\n\nNosso apoio dos generais persuadidos é de §Y[?var:SIA_seri_thai_cw_scale|%]§! e nosso apoio democrático é de §Y[?var:party_popularity@democratic|%]§!"
 SIA_choose_new_leader_tt: "Com o fim do antigo regime, os vencedores devem escolher quem comandará o novo governo."
 SIA_the_phayap_army: "O Exército Phayap"
 SIA_the_phayap_army_desc: "Se ficarmos do lado do invasor, então nossos exércitos deverão receber um lugar na nova ordem da guerra. Um comando de campo dedicado às operações ao oeste e ao norte permitirá o avanço d[ROOT.GetNameDef] junto ao seu poderoso parceiro e a oportunidade de obter seus próprios ganhos."
 SIA_securing_the_rubber_islands: "Assegurar as ilhas de borracha"
 SIA_securing_the_rubber_islands_desc: "A borracha é a essência da guerra moderna, alimentando pneus, vedantes e outros inúmeros instrumentos do conflito mecanizado. Os territórios ao sul são ricos em recursos e representam tanto uma oportunidade quanto uma necessidade. Devemos nos apressar para garanti-los, antes que outros o façam."
 SIA_breaking_the_burmese_line: "Romper a linha birmanesa"
 SIA_breaking_the_burmese_line_desc: "A Birmânia representa uma barreira entre nossas ambições e as terras além. Se as forças d[ROOT.GetNameDef] quiserem provar seu valor, a linha inimiga deverá ser rompida por meio da determinação, do planejamento e do uso concentrado de força."
 SIA_pacific_war: "Guerra do Pacífico"
 SIA_pacific_war_desc: "O conflito na Ásia Oriental não pode mais ser tratado como algo distante. A guerra no Pacífico está definindo o destino de todas as nações da nossa região e o Estado [ROOT.GetAdjective] precisa decidir seu lugar no tal conflito, seja como seguidor, parceiro ou vítima."
 SIA_joint_asian_military_command: "Comando Militar Conjunto da Ásia"
 SIA_joint_asian_military_command_desc: "Nossos esforços serão mais fortes se coordenados com nossos parceiros regionais. Uma estrutura de comando conjunto promete maior eficiência, planejamento mais claro e uma direção comum para as campanhas que, do contrário, seriam arruinadas pela rivalidade e pela confusão."
 SIA_demand_repatriation: "Exigir repatriação"
 SIA_demand_repatriation_desc: "Aqueles que entraram em nossa terra sob o pretexto da necessidade geraram uma dívida com [ROOT.GetNameDef]. Quando nossa situação melhorar, devemos exigir a devolução do que foi tomado e pressionar a força ocupante a pagar o custo de sua intrusão."
 SIA_standing_our_ground: "Manter nossa posição"
 SIA_standing_our_ground_desc: "Chega um momento em que a retirada e a negociação oferecem apenas mais humilhação. O governo d[ROOT.GetNameDef] deve mostrar que ainda tem a força de vontade para permanecer de pé, lutar e expulsar aqueles que acreditam que podem ditar nosso destino sob a mira de uma arma."
 SIA_standing_our_ground_trigger: "Este foco será concluído automaticamente se formos atacados e escolhermos a opção §YResistência§! no evento."
 SIA_ask_for_the_release_of_american_commodities: "Solicitar a liberação de mercadorias americanas"
 SIA_ask_for_the_release_of_american_commodities_desc: "Os depósitos, máquinas e mercadorias americanos podem fornecer o descanso do qual nossa nação necessita. Por meio da diplomacia cuidadosa, podemos solicitar a liberação desses produtos, amenizando a escassez e fortalecendo a base material de nosso esforço de guerra."
 SIA_japanese_fighters: "Caças japoneses"
 SIA_japanese_fighters_desc: "Embora nossa indústria de aviação continue deficiente, aeronaves estrangeiras podem ajudar a cobrir essa lacuna. Nas mãos d[ROOT.GetNameDef], os caças japoneses nos trariam pelo menos o mínimo de poder de fogo aéreo moderno, mesmo que apenas dentro dos limites definidos por nossa deficiência industrial."
 SIA_get_off_our_shores: "Saiam de nossos litorais"
 SIA_get_off_our_shores_desc: "A presença de forças estrangeiras em solo siamês é uma afronta que não pode ser amenizada com desculpas. Seja pela força bélica ou pela pressão dos eventos no exterior, precisamos insistir que o invasor deixe nossos litorais e restaurar a dignidade d[ROOT.GetNameDef].\n\nEles são covardes, assim como todos os homens cruéis. Agora, saiam de nossos litorais."
 SIA_singaporean_reinforcements: "Reforços singapurenses"
 SIA_singaporean_reinforcements_desc: "O conflito na Malaia e além é inseparável de nossa própria segurança. Reforços provenientes das forças que se reúnem ao redor de Singapura poderiam fortalecer nossa linha de frente, ampliar nossa cooperação com os Aliados e unir o teatro de operações sob um propósito comum."
 modify_SIA_directorate_of_aeronautical_engineering: "Modifica §YJunta de Engenharia Aeronáutica§! em:"
 SIA_aid_for_resources: "Ajuda em troca de recursos"
 SIA_aid_for_resources_desc: "Nossa nação tem os recursos que as potências estrangeiras desejam e a escassez de certas ferramentas que elas podem providenciar. Uma prudente troca de materiais por auxílio ajudará a abastecer [ROOT.GetNameDef] e garantirá que nossa riqueza contribua para nossa própria preservação."
 SIA_aid_for_resources_tt: "Buscaremos o apoio d[JAP.GetNameDef] em nossa guerra, oferecendo em troca os direitos de recurso sobre a borracha no §Y[724.GetName]§!"
 SIA_how_quickly_the_tables_turn: "O mundo dá voltas"
 SIA_how_quickly_the_tables_turn_desc: "Aqueles que antes enxergavam fraqueza e conformidade n[ROOT.GetNameDef] ainda podem perceber que o equilíbrio se inverteu. A sorte muda rápido na guerra e precisamos nos preparar para aproveitar o momento em que nossos opressores vacilarem e o jogo se voltar contra eles."
 SIA_how_quickly_the_tables_turn_trigger: "Fomos atacados por uma grande potência e ela capitulou."
 SIA_royal_thai_navy: "Marinha Real Tailandesa"
 SIA_royal_thai_navy_desc: "A defesa d[ROOT.GetNameDef] não termina no litoral. Nossas costas, rios e comércio marítimo exigem uma frota digna de um reino. Ao fortalecer a Marinha Real Tailandesa, garantiremos que o Sião mantenha o domínio de suas próprias águas."
 modify_royal_thai_navy: "Modifica §Y$idea_SIA_thai_royal_navy$§! em:"
 SIA_direct_army_fundings_towards_the_navy: "Direcionar fundos do Exército para a Marinha"
 SIA_direct_army_fundings_towards_the_navy_desc: "O exército sempre consumiu uma grande porção das despesas militares, mas as necessidades estratégicas d[ROOT.GetNameDef] não são apenas continentais. Ao redirecionar nossos fundos para a frota, poderemos começar a corrigir esse desequilíbrio e proteger os mares que garantem nosso comércio e banham nosso litoral."
 SIA_thonburi_class_coastal_defense_ship: "Navio de defesa costeira classe Thonburi"
 SIA_thonburi_class_coastal_defense_ship_desc: "Uma frota modesta ainda pode ser uma ameaça se adequada às condições locais. A classe Thonburi oferece um meio prático de defesa costeira para [ROOT.GetNameDef], combinando um poder de fogo respeitável com uma função própria para as águas que mais precisamos proteger."
 SIA_acquire_submarines: "Adquirir submarinos"
 SIA_acquire_submarines_desc: "Submarinos oferecem a uma marinha pequena como a nossa a chance de atacar embarcações maiores. Ocultos sob as ondas, eles podem ameaçar carregamentos, inibir frotas mais fortes e complicar qualquer plano hostil contra nosso litoral. O Estado [ROOT.GetAdjective] não pode negligenciar uma arma assim."
 SIA_submarine_day: "Dia do submarino"
 SIA_submarine_day_desc: "A introdução da guerra subaquática em nossa frota merece reconhecimento público e entusiasmo nacional. Ao celebrar as forças submarinas, poderemos encorajar o recrutamento, aumentar o prestígio e plantar na mente do público a ideia de que o Sião está entrando em uma nova era naval."
 SIA_the_thonburi_dockyard_project: "O projeto do estaleiro de Thonburi"
 SIA_the_thonburi_dockyard_project_desc: "Uma marinha não pode ser sustentada apenas por cascos importados. Se o governo d[ROOT.GetNameDef] quiser manter e expandir suas forças marítimas, deverá investir em estaleiros, oficinas e mão de obra que formam a verdadeira base do poder naval."
 SIA_expand_the_slipways: "Expandir as rampas"
 SIA_expand_the_slipways_desc: "Nossas instalações atuais são muito apertadas para as ambições que estão se formando. Ao expandir as rampas, aumentaremos nossa capacidade de construir e consertar embarcações, permitindo que a frota cresça e esteja mais preparada."
 SIA_a_new_drydock: "Uma nova doca seca"
 SIA_a_new_drydock_desc: "A manutenção naval séria exige uma doca seca moderna. Sem ela, a manutenção de navios maiores permanecerá lenta, ineficiente e dependente de assistência estrangeira. Uma nova doca seca dará ao governo d[ROOT.GetNameDef] um controle mais firme sobre futuro de sua própria Marinha."
 SIA_install_heavy_cranes_and_power_plant: "Instalar guindastes pesados e usina de energia"
 SIA_install_heavy_cranes_and_power_plant_desc: "A construção de navios não é uma mera questão de madeira e aço, mas de maquinário e energia. Gruas pesadas e suprimentos elétricos confiáveis transformarão nossos pátios de instalações rudimentares em verdadeiros instrumentos da indústria moderna."
 SIA_establish_the_foundry_and_machine_shop: "Estabelecer a fundição e a oficina de máquinas"
 SIA_establish_the_foundry_and_machine_shop_desc: "Uma marinha soberana necessita de mais do que cascos fabricados com partes importadas. Ao estabelecer nossa própria fundição e oficina de máquinas, fortaleceremos os pilares da indústria e permitiremos que [ROOT.GetNameDef] fabrique, molde e conserte os componentes vitais dos navios de guerra em casa."
 SIA_the_thonburi_arsenal: "O arsenal de Thonburi"
 SIA_the_thonburi_arsenal_desc: "Um estaleiro sem armamentos está incompleto. Estabelecer um arsenal em Thonburi permitirá a manufatura e o armazenamento de armas e munições navais e outros equipamentos relacionados, deixando nossa frota mais próxima da indústria nacional."
 SIA_focus_on_commercial_civilian_ships: "Foco em navios de cruzeiro comerciais"
 SIA_focus_on_commercial_civilian_ships_desc: "Nem toda quilha é feita para a batalha. Navios de transporte, mercantis e outras embarcações civis formam o sistema circulatório da economia nacional. Ao incentivar a construção comercial de navios, o governo d[ROOT.GetNameDef] fortalecerá tanto sua prosperidade quanto sua resiliência em tempos de guerra."
 SIA_empower_the_coastguard: "Fortalecer a Guarda Costeira"
 SIA_empower_the_coastguard_desc: "A frota não pode estar em todos os lugares o tempo todo e muitas funções de segurança litorânea são mais bem administradas por serviços mais leves. Uma guarda costeira fortalecida protegerá nossa indústria pesqueira, policiará nosso litoral e deixará a Marinha livre para lidar com ameaças mais sérias."
 SIA_river_patrols: "Patrulhas fluviais"
 SIA_river_patrols_desc: "Os rios d[ROOT.GetNameDef] são estradas, fronteiras e linhas vitais ao mesmo tempo. Embarcações de patrulha nessas águas ajudarão a manter a ordem, apoiar guarnições locais e aumentar o alcance do Estado até regiões nas quais uma capital distante demoraria para agir."
 SIA_sell_bangkok_dock_co: "Vender a Bangkok Dock Co."
 SIA_sell_bangkok_dock_co_desc: "O capital privado pode realizar aquilo que a administração do Estado demora muito para fazer. Ao vender a Bangkok Dock Company para mãos capazes, poderemos atrair investimento, estimular a eficiência e redirecionar os fundos públicos para necessidades militares mais urgentes."
 SIA_a_race_against_time: "Uma corrida contra o tempo"
 SIA_a_race_against_time_desc: "Nossa Marinha está obsoleta, mal financiada e despreparada para a guerra moderna. Fundos devem ser redirecionados imediatamente para a construção e reforma de navios, defesa litorânea e treinamento naval. O tempo está passando mais rápido do que nossos estaleiros conseguem acompanhar."
 SIA_a_race_against_time_tt: "Após o espírito expirar, ganharemos:"
 SIA_a_race_against_time_tt2: "por §Y280§! dia(s)"
 #Tech
 the_thunder_at_our_gates_artillery: "O trovão em nossos portões"
 SIA_siamese_tankettes: "Tankettes siameses"
 SIA_siamese_tankettes_desc: "Nosso Exército está mais familiarizado com sua frota de tankettes leves, o que melhora sua confiabilidade e reduz o custo de mantê-los em campo."
 #Ideas
 idea_SIA_the_army_of_siam: "O Exército do Sião"
 idea_SIA_the_army_of_siam_tt: "Modifica §Y$idea_SIA_the_army_of_siam$§!:"
 idea_SIA_the_thunder_at_our_gates: "O trovão em nossos portões"
 idea_SIA_yielded_the_air_war: "Abandonou a guerra aérea"
 idea_SIA_yielded_the_air_war_desc: "Após perder o controle dos céus, os recursos foram redirecionados para as defesas antiaéreas em vez de concorrermos diretamente pela superioridade aérea."
 idea_SIA_steel_arteries: "Artérias de aço"
 idea_SIA_unconventional_tank_construction: "Construção não convencional de tanques"
 idea_SIA_short_war: "Planejamento para guerra curta"
 idea_SIA_short_war_temp_buff: "Fervor de guerra curta"
 idea_SIA_short_war_temp_debuff: "Exaustão de guerra curta"
 SIA_no_supply_grace_tt: " $MODIFIER_NO_SUPPLY_GRACE$ $RIGHT|+=1$ Hora(s)"
 idea_SIA_standing_our_ground_mission_temp_buff: "Mantendo nossa posição"
 idea_SIA_german_tank_studies: "Estudos de tanques alemães"
 idea_SIA_german_tank_studies_desc: "Nossos oficiais se dedicaram a estudar a doutrina e o design dos blindados estrangeiros e voltaram com conhecimentos técnicos que beneficiarão diretamente o desenvolvimento de nossas próprias forças blindadas."
 idea_SIA_american_tank_studies: "Estudos de tanques americanos"
 idea_SIA_american_tank_studies_desc: "$idea_SIA_german_tank_studies_desc$"
 idea_SIA_british_tank_studies: "Estudos de tanques britânicos"
 idea_SIA_british_tank_studies_desc: "$idea_SIA_german_tank_studies_desc$"
