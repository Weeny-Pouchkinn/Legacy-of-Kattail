 AST_uap_election_campaign_tt: "§YCampanha eleitoral do P.U.A.§!\n§LReúna a classe média, empresários e lealistas imperiais; o Partido Unido da Austrália lançará uma campanha política.§!\n\n§YEfeito:§!\nCusto diário de poder político: §R1§!\nAumento diário de votos para o §YP.U.A.§!: §G+0,05%§!"
 AST_alp_election_campaign_tt: "§YCampanha eleitoral do P.T.A.§!\n§LReúna a classe trabalhadora, sindicalistas e reformistas patriotas; o Partido Trabalhista Australiano lançará uma campanha política.§!\n\n§YEfeito:§!\nCusto diário de poder político: §R1§!\nAumento diário de votos para o §YP.T.A.§!: §G+0,05%§!"
