 AST_natunity_desc: "§YGoverno de União Nacional§!\n§LEm momentos de crise, pequenas dificuldades dão lugar às grandes. As nações vizinhas enfrentam conflito após conflito e, apesar de os problemas nacionais terem sua própria urgência, esta desaparece quando a ameaça de um derramamento de sangue fica mais iminente. Os partidos democráticos d[AST.GetNameDef] devem deixar de lado suas desavenças e enfrentar o resto do mundo unidos.§!"
