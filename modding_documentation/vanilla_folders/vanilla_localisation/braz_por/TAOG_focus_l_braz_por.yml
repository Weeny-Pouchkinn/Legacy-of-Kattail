l_braz_por:
 INS_nationalize_companies_tt: "Todas as organizações industriais militares e firmas industriais serão nacionalizadas e receberão novos nomes."
 available_focus_tt: "Foco(s) §Gdisponível(is)§!:\n"
 INS_is_union_tt: "Formou a União Neerlando-Indonésia"
 INS_is_union_tt_NOT: "Não formou a União Neerlando-Indonésia"
 INS_denounce_soetardjo: "Denunciar Soetardjo"
 INS_denounce_soetardjo_tt: "Iniciaremos o planejamento de uma revolução clandestina, nos infiltrando no governo e estabelecendo células de guerrilha por todo o arquipélago. Quando estivermos prontos, iniciaremos uma guerra de guerrilha pela independência contra os neerlandeses."
 INS_soetardjo_petition_debate_done_tt: "O debate no Volksraad sobre a petição de Soetardjo por autonomia foi concluído"
 INS_tkr_tt: "Modifica §YO Exército de Segurança Popular§! em:"
 INS_commander_sudirman_tt: "§YSudirman§!([INS.GetFlag]) é promovido a §Ymarechal de campo§!"
 INS_the_declaration_of_independence: "A declaração de independência"
 INS_the_declaration_of_independence_desc: "Não podemos esperar mais, temos que aproveitar o momento! Nossas milícias devem avançar para tomar rapidamente o controle de portos, cidades e centros industriais, de modo que as autoridades neerlandesas não tenham tempo de reagir. Em seguida, declararemos a independência, proclamando a República da Indonésia."
 INS_the_declaration_of_independence_tt: "Declararemos a §Yindependência§!. Todos os estados em que estabelecemos uma §Ybase de milícia§! ou §Yquartel-general§! ficarão sob nosso controle, enquanto o restante permanecerá com [HOL.GetNameDef].\n\nO Estado [HOL.GetAdjective] não reconhecerá nossa soberania e um conflito de baixa intensidade terá início. Isso poderá escalar para uma §Rguerra§!.\n\nDesbloqueia incursões terrestres para conquistar estados."
 INSHOL_the_declaration_of_independence: "A revolução nacional"
 INS_laskar_rakjat: "Laskar Rakyat"
 INS_laskar_rakjat_desc: "A revolução é composta por diversas milícias espalhadas pela Indonésia, algumas grandes e outras pequenas. Organizar essas milícias é um passo necessário para alcançar a vitória. Contudo, não devemos ser precipitados, pois fortalecer milícias ligadas a nossos rivais políticos poderia resultar em catástrofe."
 INS_militia_tt: "Cria um novo modelo de divisão de milícia de §Yguerreiros da liberdade§! e desbloqueia decisões para gerenciá-los."
 INS_militia_warning_tt: "Milícias são grupos §Ysemiautônomos§! de guerreiros da liberdade. Eles lutarão por nós, mas sua ajuda não será gratuita, pois exigem uma compensação por seus esforços. §RA estabilidade será drasticamente afetada caso suas exigências não sejam atendidas!§!"
 INS_usa_tanks_opinion_mod: "Comprou nossos tanques"
 INS_republic_add_generals_tt: "(§Y$INS_sudirman$§!([INS.GetFlag]), §Y$INS_soengkono$§!([INS.GetFlag]), §Y$INS_supriyadi$§!([INS.GetFlag]), §Y$INS_djatikoesoemo$§!([INS.GetFlag]) e §Y$INS_maludin_simbolan$§!([INS.GetFlag])) se tornam generais."
 INS_big_militia_presence_tt: "Será controlado por nossas milícias ao declararmos independência."
 INS_prepare_raiding_bases: "Preparar bases de incursão"
 INS_prepare_raiding_bases_desc: "Utilizaremos nossa rede de espiões para estabelecer bunkers em segredo por todo o arquipélago, garantindo que estejamos prontos para atacar assim que a revolução começar."
 # <Joint Tree - Central Milestones>
 INSHOL_dutch_east_indies: "Índias Orientais Holandesas"
 INSHOL_dutch_east_indies_desc: "A colônia foi fundada há quase 500 anos e assumiu diversas formas desde então. O mundo está mudando rapidamente, e nossas ações agora determinarão o futuro das relações entre neerlandeses e indonésios."
 INSHOL_the_war_in_europe: "A guerra na Europa"
 INSHOL_the_war_in_europe_desc: "O conflito na Europa está escalando rapidamente e os Países Baixos já se encontram em guerra. Não podemos mais contar com a proteção deles, precisamos manter nossa posição ou corremos o risco de ser dominados por potências estrangeiras."
 # <Joint Tree - Military Equipment Contracts>
 INSHOL_military_equipment_contracts: "Contratos de equipamento militar"
 INSHOL_military_equipment_contracts_desc: "As Índias são um vasto arquipélago com dezenas de milhões de cidadãos. Estamos longe de possuir a capacidade industrial necessária para nos defender, mas temos recursos suficientes para garantir o comércio em todo o mundo. Ao assegurar contratos com democracias ao redor do globo, poderemos resolver nosso problema."
 INSHOL_hawk_75a7: "O Hawk 75A-7"
 INSHOL_hawk_75a7_desc: "O caça americano Hawk 75A-7 é a aeronave ideal para as Índias, sendo acessível e poderosa. Podemos realizar as melhorias tão necessárias em nossa Força Aérea firmando um acordo com o fabricante."
 INSHOL_purchase_american_tanks: "Comprar tanques americanos"
 INSHOL_purchase_american_tanks_desc: "Embora as Índias não possuam a indústria necessária para a fabricação de tanques, podemos adquiri-los diretamente dos Estados Unidos, financiando a compra com nossa indústria de borracha."
 INSHOL_purchase_british_artillery: "Comprar artilharia britânica"
 INSHOL_purchase_british_artillery_desc: "Podemos terceirizar a fabricação de artilharia para o Reino Unido, permitindo que priorizemos outros equipamentos."
 INSHOL_produce_own_goods: "Produzir nossos próprios bens"
 INSHOL_produce_own_goods_desc: "Embora possamos garantir diversos acordos comerciais lucrativos, não devemos esquecer nossas próprias linhas de produção e empresas da indústria militar. Devemos subsidiar essas companhias para reduzir nossa dependência de importações estrangeiras."
 # <Joint Tree - East Indies Investments>
 INSHOL_east_indies_investments: "Investimentos nas Índias Orientais"
 INSHOL_east_indies_investments_desc: "Um bom soberano é aquele que investe no desenvolvimento de suas colônias. Investir no crescimento econômico das Índias é de nosso interesse e beneficia os cidadãos da colônia."
 INSHOL_east_indies_student_exchange: "Programa de intercâmbio estudantil das Índias Orientais"
 INSHOL_east_indies_student_exchange_desc: "A criação de um sistema no qual indonésios possam ir aos Países Baixos para estudar em nossas universidades pode trazer grandes benefícios tanto para a economia dos Países Baixos quanto para a das Índias."
 INSHOL_east_indies_fokker_division: "Formar uma divisão das Índias Orientais da Fokker"
 INSHOL_east_indies_fokker_division_desc: "A Fokker está sendo licenciada pela Força Aérea das Índias em um nível que justifica a criação de uma subsidiária dedicada, priorizando a Força Aérea das Índias."
 INSHOL_expand_shell: "Expandir a infraestrutura da Shell"
 INSHOL_expand_shell_desc: "A Shell vem assumindo um papel de destaque em nossa economia. Está claro que devemos expandir a infraestrutura de petróleo nas Índias para acompanhar a capacidade de exportação da Shell."
 INSHOL_increase_funding_for_tix: "Aumentar o financiamento do projeto de avião T.IX"
 INSHOL_increase_funding_for_tix_desc: "Engenheiros da Fokker estão desenvolvendo um novo bombardeiro bimotor para substituir os modelos obsoletos utilizados pela Força Aérea das Índias. Este projeto possui um orçamento muito limitado e deve demorar para ser concluído. Se aumentarmos o financiamento, poderemos acelerar seu desenvolvimento."
 INSHOL_reduce_land_ownership_taxes: "Reduzir os impostos sobre a propriedade de terras"
 INSHOL_reduce_land_ownership_taxes_desc: "Devemos reduzir o imposto aplicado aos cidadãos indonésios que possuem terras, incentivando o desenvolvimento de fazendas e negócios."
 INSHOL_coffee_plantations: "Plantações de café"
 INSHOL_coffee_plantations_desc: "Devemos nos concentrar em obter mais terras estatais nas ilhas orientais. Podemos utilizar essas terras para estabelecer plantações de café."
 INSHOL_overallwagen: "Overvalwagen"
 INSHOL_overallwagen_desc: "Tanques não são necessariamente a melhor solução para o Exército das Índias Orientais. Não temos a capacidade industrial necessária para produzi-los e o terreno árduo limita sua utilidade. Para suprir essa lacuna, podemos investir na produção de carros blindados para a Indonésia."
 INSHOL_indonesian_cheap_labor: "Mão de obra barata da Indonésia"
 INSHOL_indonesian_cheap_labor_desc: "$CONGO_cheap_labor_desc$" #LL: stealing this to save time, hope you don't mind!
 INSHOL_eastern_development_fund: "Fundo de desenvolvimento para as ilhas orientais"
 INSHOL_eastern_development_fund_desc: "Investimos demais em Java e Sumatra, negligenciando grande parte do território colonial. Devemos nos comprometer com o desenvolvimento da infraestrutura no leste para viabilizar a industrialização no futuro."
 INSHOL_increase_rubber_taxes: "Aumentar os impostos sobre a borracha"
 INSHOL_increase_rubber_taxes_desc: "Diversas empresas de borracha nas Índias estão obtendo lucros elevados com os recursos da colônia. Nada mais justo do que cobrar impostos mais elevados dessas operações."
 INSHOL_reform_knil: "Reformar o KNIL"
 INSHOL_reform_knil_desc: "Desde que as Índias Orientais conquistaram todo o arquipélago, o Exército Real das Índias Orientais Neerlandesas manteve-se inativo e enfrenta severa falta de financiamento. Com as tensões mundiais em ascensão, devemos iniciar o rearmamento das Índias o quanto antes."
 INSHOL_fund_ml_knil: "Financiar a ML-KNIL"
 INSHOL_fund_ml_knil_desc: "Para manter-nos à altura dos exércitos internacionais, precisamos desenvolver nossa própria força aérea; caso contrário, estaremos em grande desvantagem."
 INSHOL_bandung_aircraft_facility_tt: "§YJava Ocidental:§!\n    Adiciona §G1§! espaço para construção e §G1§! §Yfábrica militar§! por foco de pré-requisito concluído."
 INSHOL_rangers: "Rangers"
 INSHOL_rangers_desc: "As Índias são um vasto arquipélago com grande diversidade ambiental. Devemos treinar rangers adaptados ao combate nesses ambientes adversos, garantindo que estejamos preparados para defendê-los."
 INSHOL_mountaineers: "Montanhistas"
 INSHOL_mountaineers_desc: "Devemos treinar montanhistas preparados para combater no terreno hostil de nosso arquipélago."
 INSHOL_elevate_elite_infantry: "Depot Speciale Troepen"
 INSHOL_elevate_elite_infantry_desc: "Não podemos depender para sempre das estratégias da Grande Guerra, devemos nos adaptar às novas tecnologias para não ficar para trás. Vamos estabelecer diversas divisões de infantaria de elite capazes de defender qualquer ambiente."
 INSHOL_modernize_knil: "Modernizar o KNIL"
 INSHOL_modernize_knil_desc: "Estudaremos novas estratégias e doutrinas para o Exército das Índias Orientais, garantindo nossa vantagem sobre o inimigo."
 INSHOL_transfer_of_henri_winkelman: "Transferência de Henri Winkelman"
 INSHOL_transfer_of_henri_winkelman_desc: "Henri Winkelman serviu por muitos anos no KNIL e é evidente que sua presença se faz necessária nas Índias. Devemos providenciar sua transferência formal para as Índias Orientais imediatamente."
 INSHOL_eastern_conscription: "Reunir a divisão auxiliar"
 INSHOL_eastern_conscription_desc: "Existem diversas divisões auxiliares indígenas em Java e Madura sob o controle de governantes locais. Nestes tempos difíceis, podemos negociar um acordo com esses líderes para colocar essas divisões sob nossa autoridade."
 INSHOL_establish_vk_knil: "Estabelecer o VK-KNIL"
 INSHOL_establish_vk_knil_desc: "Estabeleceremos uma Divisão Voluntária Feminina para o KNIL. Sua contribuição desempenhará um papel fundamental para melhorar nossa logística e comunicações."
 INSHOL_emergency_dockyard_construction: "Construção de estaleiro emergencial"
 INSHOL_emergency_dockyard_construction_desc: "A ameaça de uma invasão naval não pode ser subestimada. A defesa naval deve ser nossa maior prioridade."
 INSHOL_emergency_powers_gov_general: "Poderes emergenciais para o governador-geral"
 INSHOL_emergency_powers_gov_general_desc: "A guerra atual exige escolhas difíceis que não podem ser adiadas, algo impossível quando todas as decisões nas Índias precisam passar antes pelos Países Baixos. É essencial conceder poderes emergenciais a [INS.GetLeader], para que ele possa agir sem demora."
 INSHOL_emergency_naval_purchases: "Compras navais emergenciais"
 INSHOL_emergency_naval_purchases_desc: "Nossos litorais estão vulneráveis e mal protegidos. Precisamos construir uma Marinha mais forte o quanto antes ou pereceremos. Vamos comprar navios de empresas privadas por meio de dívidas e convertê-los em contratorpedeiros."
 INSHOL_east_indies_navy: "Marinha das Índias Orientais"
 INSHOL_east_indies_navy_desc: "O Estado [INS.GetAdjective] não dispõe de uma Marinha oficial, deixando os Países Baixos encarregados da defesa da colônia. Com o aumento das tensões na Europa e na Ásia, essa situação se torna insustentável. Devemos dar o primeiro passo para estabelecer uma Marinha dedicada para [INS.GetNameDef]."
 INSHOL_marines: "Fuzileiros navais"
 INSHOL_marines_desc: "Devemos estabelecer um Corpo de Fuzileiros Navais das Índias subordinado à nova Marinha e enviar recrutas em treinamento para aprender a bordo de navios neerlandeses."
 INSHOL_domestic_ship_production: "Produção doméstica de navios"
 INSHOL_domestic_ship_production_desc: "Se desejamos uma Marinha capaz de enfrentar as nações vizinhas, devemos expandir a produção doméstica de navios."
 INSHOL_destroyers: "Contratorpedeiros"
 INSHOL_destroyers_desc: "Nossos navios de guerra mais pesados não podem operar nos estreitos mares do arquipélago sem escoltas que os protejam. Ao iniciar a construção de modernos contratorpedeiros, a Marinha d[ROOT.GetNameDef] poderá proteger suas rotas comerciais e repelir embarcações torpedeiras nos estreitos."
 INSHOL_cruisers: "Cruzadores"
 INSHOL_cruisers_desc: "Uma frota sem encouraçados deve se apoiar totalmente nos cruzadores. Construir uma esquadra de cruzadores robusta dará à Marinha d[ROOT.GetNameDef] uma base sólida, capaz de patrulhar as longas distâncias entre as ilhas e enfrentar qualquer invasor que entre em nossas águas."
 INSHOL_submarines: "Submarinos"
 INSHOL_submarines_desc: "Os estreitos das Índias Orientais são ideais para emboscadas, e um submarino custa muito menos do que o navio de guerra que ele afunda. Uma força submarina sólida permitirá à Marinha d[ROOT.GetNameDef] controlar as rotas marítimas e atacar embarcações inimigas sem jamais se revelar."
 INSHOL_outsourced_navy: "Terceirizar a produção para corporações"
 INSHOL_outsourced_navy_desc: "Já temos despesas suficientes e não podemos continuar redirecionando uma parcela cada vez maior do orçamento colonial para a Marinha. Podemos pagar às corporações para que assumam a produção por nós."
 INSHOL_divert_civilian_to_navy: "Redirecionar gastos civis e militares para a Marinha"
 INSHOL_divert_civilian_to_navy_desc: "Diante da atual situação mundial, o risco de uma invasão naval é maior do que nunca e não podemos nos dar ao luxo de economizar. Devemos redirecionar recursos de todos os setores do governo para a Marinha."
 INS_netherlands_can_remove_autonomy_tt_50: "\nSe o Estado §Y[HOL.GetAdjective]§![HOL.GetFlag] concluir este foco primeiro:\n    (§Y[INS.GetName]§![INS.GetFlag]): Adiciona §Y£autonomy_texticon -50§!"
 INS_netherlands_can_remove_autonomy_tt_75: "\nSe o Estado §Y[HOL.GetAdjective]§![HOL.GetFlag] concluir este foco primeiro:\n    (§Y[INS.GetName]§![INS.GetFlag]): Adiciona §Y£autonomy_texticon -75§!"
 INS_netherlands_can_remove_autonomy_tt_100: "\nSe o Estado §Y[HOL.GetAdjective]§![HOL.GetFlag] concluir este foco primeiro:\n    (§Y[INS.GetName]§![INS.GetFlag]): Adiciona §Y£autonomy_texticon -100§!"
 INS_netherlands_can_remove_autonomy_tt_150: "\nSe o Estado §Y[HOL.GetAdjective]§![HOL.GetFlag] concluir este foco primeiro:\n    (§Y[INS.GetName]§![INS.GetFlag]): Adiciona §Y£autonomy_texticon -150§!"
 INS_netherlands_can_remove_autonomy_tt_200: "\nSe o Estado §Y[HOL.GetAdjective]§![HOL.GetFlag] concluir este foco primeiro:\n    (§Y[INS.GetName]§![INS.GetFlag]): Adiciona §Y£autonomy_texticon -200§!"
 INS_netherlands_can_remove_autonomy_tt_250: "\nSe o Estado §Y[HOL.GetAdjective]§![HOL.GetFlag] concluir este foco primeiro:\n    (§Y[INS.GetName]§![INS.GetFlag]): Adiciona §Y£autonomy_texticon -250§!"
 INSHOL_begin_negotiations_soetardjo: "Iniciar negociações com Soetardjo"
 INSHOL_begin_negotiations_soetardjo_desc: "A petição de autonomia de Soetardjo é promissora, oferecendo uma oportunidade de conciliar nacionalistas e lealistas. Devemos iniciar as negociações oficiais com seu partido."
 INSHOL_urge_gov_veto: "Incentivar o veto do governador"
 INSHOL_urge_gov_veto_desc: "A petição de Soetardjo é um ardil nacionalista no qual o governo das Índias está caindo. Devemos incentivar o governador-geral a vetar imediatamente a petição, ou corremos o risco de perder nossa colônia."
 INSHOL_eventual_autonomy: "Concordar com uma possível autonomia"
 INSHOL_eventual_autonomy_desc: "O desejo indonésio por independência é forte e não dá sinais de enfraquecimento. Concordaremos com uma possível autonomia das Índias, mas somente quando a colônia provar que pode se sustentar e continuar a defender os ideais democráticos."
 INSHOL_autonomous_dominion: "A lei de Soetardjo de [GetYear]"
 INSHOL_autonomous_dominion_desc: "Apesar da definição injusta de \"autossuficiência\" criada pelos Países Baixos, que devemos respeitar para que os termos da petição de Soetardjo sejam válidos, o desejo indonésio de independência é tão forte que conseguimos cumprir tais exigências. Conforme o acordo, declaramos independência total e incondicional da Coroa neerlandesa."
 INS_cannot_become_independent_tt: "§WSerá impossível para §Y[INS.GetNameDef][INS.GetFlag]§! §Rse tornar independente§! sem intervenção estrangeira.§!"
 INSHOL_sideline_the_volksraad: "Marginalizar o Volksraad"
 INSHOL_sideline_the_volksraad_desc: "A petição apresentada por Soetardjo está em clara violação do Artigo 1 da Constituição Neerlandesa e apenas causará dificuldades para a administração das Índias. Ela deve ser vetada."
 INSHOL_prioritize_dutch_profits: "Priorizar os lucros neerlandeses"
 INSHOL_prioritize_dutch_profits_desc: "Direcionaremos nossos esforços para aumentar os lucros da metrópole. A estabilidade econômica deles é benéfica para todo o reino."
 INSHOL_development_loans_netherlands: "Empréstimos de desenvolvimento dos Países Baixos"
 INSHOL_development_loans_netherlands_desc: "Podemos contrair empréstimos de empresas neerlandesas para acelerar nosso esforço de industrialização. Embora nossa posição de colônia em desenvolvimento nos possibilite taxas mais baixas de juros, ainda assim teremos de arcar com os encargos."
 INSHOL_request_economic_dev_subsidy: "Solicitar subsídios para o desenvolvimento econômico"
 INSHOL_request_economic_dev_subsidy_desc: "Já demonstramos ao nosso soberano que somos uma colônia lucrativa. Agora, podemos usar isso como argumento para obter subsídios para o desenvolvimento industrial."
 INSHOL_loyalty_to_crown: "Lealdade à Coroa"
 INSHOL_loyalty_to_crown_desc: "As Índias Orientais podem ser muitas coisas, mas acima de tudo somos uma colônia neerlandesa leal. A Rainha Guilhermina nos guiará à vitória. Não podemos permitir que o nacionalismo destrua quase 500 anos de história; devemos reafirmar nossa lealdade absoluta à Coroa."
 INS_loans_timer: "\nEm §Y365§! dias:"
 INS_expand_batavia_med_school_tt: "§Y$INS_dutch_east_indies$§!: o modificador de velocidade de pesquisa é de pelo menos §G1%§!."
 INS_subsidize_local_business: "Subsidiar empresas locais"
 INS_subsidize_local_business_desc: "Devemos conceder subsídios às empresas locais para estimular o crescimento econômico, fortalecendo nossa economia a longo prazo."
 INSHOL_education_reforms: "Reformas na educação"
 INSHOL_education_reforms_desc: "Muitos cidadãos das Índias Orientais não têm acesso à educação e poucos concluíram o ensino secundário. Se quisermos que as Índias Orientais se tornem um Estado industrializado e próspero, deveremos garantir que a educação seja amplamente acessível à população."
 INS_expand_batavia_med_school: "Expandir a Escola de Medicina da Batávia"
 INS_expand_batavia_med_school_desc: "Ao expandir a Escola de Medicina da Batávia com novas instalações no campus e mais docentes, tornaremos o ensino superior muito mais acessível, o que é vital para o crescimento econômico de longo prazo."
 INS_prepare_for_policy_shift: "Preparar-se para uma mudança política"
 INS_prepare_for_policy_shift_desc: "O cenário político nas Índias foi impactado pelo despertar nacional das últimas décadas e nossas políticas atuais estão claramente ultrapassadas. É hora de avaliar algumas mudanças em nossa forma de governar."
 INS_reallocate_rubber_industry_funding: "Realocar o financiamento da indústria de borracha"
 INS_reallocate_rubber_industry_funding_desc: "A dependência da exportação de borracha teve um efeito desastroso em nossa economia. Devemos diversificar nossas atividades econômicas por meio da prospecção de recursos e da abertura de minas e fábricas em todo o arquipélago. Este não será um empreendimento barato, portanto teremos de reduzir o orçamento destinado à manutenção das plantações de borracha."
 INS_reallocate_rubber_industry_funding_tt: "Desbloqueia uma decisão para §Yremover a borracha de um estado§! e substituí-la por quantidades menores de §Youtros recursos§!."
 INSHOL_nationalist_coallition: "Uma coalizão nacionalista"
 INSHOL_nationalist_coallition_desc: "O Volksraad tem se pronunciado com apenas uma voz há tempo demais e de forma inexpressiva. A era das petições e deferimentos pacientes chegou ao fim. Uma coalizão dos membros nacionalistas da câmara deixará de lado as diferenças e exigirá independência incondicional. As vozes mais antigas fora da câmara, dos homens que os neerlandeses julgavam definitivamente marginalizados, serão bem-vindas de volta."
 INSHOL_volksraad_compromises: "Concessões do Volksraad"
 INSHOL_volksraad_compromises_desc: "Reformas na câmara nos trouxeram até aqui e não há motivo para abandonar esse caminho agora. O Volksraad continuará seu trabalho minucioso, negociando concessão por concessão com Haia em busca do autogoverno por meio da paciência em vez de rupturas. Um futuro dentro da comunidade neerlandesa oferece mais do que um futuro lutando para ficar fora dela."
 INSHOL_establish_the_princely_council: "Estabelecer o conselho principesco"
 INSHOL_establish_the_princely_council_desc: "Os sultões e rajas do arquipélago contam com uma lealdade que nenhuma câmara na Batávia já viu. Suas cortes são mais antigas do que a Companhia e mais ainda do que a república que a sucedeu. Um conselho formal das casas principescas dará a esses governantes um lugar à mesa na nova nação, agregando sua autoridade à nossa."
 INSHOL_nationalize_dutch_companies: "Nacionalizar empresas neerlandesas"
 INSHOL_nationalize_dutch_companies_desc: "As grandes casas comerciais, rotas marítimas, empreendimentos agrícolas e bancos há muito tempo levam nomes neerlandeses. A partir de agora, seus nomes serão indonésios. As diretorias ganharão novos ocupantes, placas serão retiradas e o capital que foi extirpado destas ilhas durante três séculos finalmente pertencerá a elas."
 INSHOL_democracy: "Uma Indonésia democrática"
 INSHOL_democracy_desc: "O Volksraad surgiu como uma meia medida, um corpo de conselheiros intencionalmente limitado cujo objetivo era manter a aparência de representatividade enquanto retinha o conteúdo; mas ele acabou superando seus criadores. A câmara será reconstituída como um poder legislativo verdadeiro, com membros escolhidos pelo povo que ela alega representar e decisões vinculantes ao governo que antes a mantinha sob rédeas curtas."
 INSHOL_princely_authority: "Autoridade principesca"
 INSHOL_princely_authority_desc: "Um conselho é algo bom por si só, mas os sultões que marcaram a fundação desta nação ainda podem oferecer mais do que isso. O parlamento não ficará no caminho daqueles que aceitam que um dos seus esteja acima dos demais. As antigas cortes esperaram muito tempo para que isso fosse exigido novamente."
 INSHOL_encourage_further_investment: "Incentivar mais investimento"
 INSHOL_encourage_further_investment_desc: "Os termos acordados no Volksraad definiram a questão política por ora e a capital neerlandesa não deixou isso passar despercebido. Teremos tarifas menores, garantias estendidas e as câmaras de comércio em Amsterdã e Roterdã asseguraram que o arquipélago continuará aberto para negócios. O que outrora foi lucrativo sob o antigo acordo será lucrativo sob o novo também."
 # <Joint Tree - ABDACOM>
 INSHOL_east_indies_artillery: "Fabricação de artilharia nas Índias Orientais"
 INSHOL_east_indies_artillery_desc: "A abertura de instalações de fabricação de artilharia em Java reduzirá nossa dependência do comércio exterior para manter nosso esforço militar."
 INSHOL_recall_gerardus_johannes_berenschot: "Reconvocar o general Berenschot"
 INSHOL_recall_gerardus_johannes_berenschot_desc: "Gerardus Johannes Berenschot é um dos generais mais talentosos da Comunidade. A maior parte de sua carreira se deu nas Índias, mas ele também serviu vários anos nos Países Baixos. Nestes tempos difíceis, devemos reconvocá-lo às Índias para auxiliar no esforço de guerra."
 INSHOL_east_indies_cruiser_manufacturing: "Fabricação de cruzadores nas Índias Orientais"
 INSHOL_east_indies_cruiser_manufacturing_desc: "Produzir nossos próprios cruzadores, em vez de importá-los dos neerlandeses, é o primeiro passo para a criação de uma Marinha de verdade. Um esforço que se faz necessário diante da ameaça japonesa."
 INSHOL_transfer_of_conrad_helfrich: "Transferir Conrad Helfrich para as Índias"
 INSHOL_transfer_of_conrad_helfrich_desc: "A transferência do almirante Conrad Helfrich para as Índias melhorará significativamente o esforço naval da região."
 # <Joint Tree - Naval Program>
 INSHOL_naval_program: "Programa naval neerlando-indonésio"
 INSHOL_naval_program_desc: "A Marinha das Índias Orientais encontra-se muito atrás de outras forças navais, inclusive das coloniais. É do interesse de todos apoiar o desenvolvimento dessa nova Marinha, a fim de assegurar um progresso acelerado."
 INSHOL_naval_program_transfer_25_tt: "Transferir §Y25%§! de nossas forças navais para [INS.GetNameDef]."
 INSHOL_naval_program_transfer_25_2_tt: "§YO Estado [HOL.GetAdjective][HOL.GetFlag]§! transferirá §Y25%§! de sua força naval para §Y[INS.GetNameDef]§!."
 INSHOL_naval_program_transfer_100_tt: "Transferir §Rnossa Marinha inteira§! para [INS.GetNameDef]."
 INSHOL_naval_program_transfer_100_2_tt: "§YO Estado [HOL.GetAdjective][HOL.GetFlag]§! transferirá sua Marinha inteira para §Y[INS.GetNameDef]§!."
 INSHOL_naval_program_rejected_tt: "Desbloqueia o foco nacional §Y$INSHOL_naval_secondchance$§!."
 INSHOL_hybrid_navy: "Uma Marinha híbrida"
 INSHOL_hybrid_navy_desc: "Nossa Marinha não pode depender apenas da incorporação da frota do Pacífico d[HOL.GetNameDef]. Devemos iniciar a construção de nossos próprios navios, ou um único erro poderá comprometer todo o nosso abastecimento naval."
 INSHOL_request_naval_control: "Esquadrão das Índias Orientais"
 INSHOL_request_naval_control_desc: "O Estado [HOL.GetAdjective] caiu e já não está em condições de operar toda a sua Marinha. Devemos assumir o controle dela pelo restante da guerra."
 INSHOL_naval_secondchance: "Esquema naval das Índias Orientais"
 INSHOL_naval_secondchance_desc: "Embora o Estado [HOL.GetAdjective] tenha se recusado a transferir o controle da Marinha, ainda precisamos defender o Pacífico para não sermos dominados. Talvez não seja tão eficiente quanto nossa proposta original, mas encontraremos uma alternativa viável."
 # <Joint Tree - Netherlands in Exile>
 INSHOL_netherlands_in_exile: "Países Baixos no exílio"
 INSHOL_netherlands_in_exile_desc: "A trágica queda de nosso reino agora é uma realidade, mas não podemos nos afundar em derrotismo. É hora de aceitar a realidade e focar naquilo que ainda pode ser salvo."
 # INSHOL_relocate_prime_minister: "Relocate the Prime Minister to Java"
 INSHOL_relocate_our_generals: "Realocar nosso Exército para Java"
 INSHOL_relocate_our_generals_desc: "Os generais, comandantes e soldados exilados devem ser realocados para a [1058.GetName] com urgência máxima, antes que seja tarde demais."
 #INSHOL_relocate_our_soldiers: "Transfer Holdout Soldiers to Java"
 INSHOL_netherlands_indonesia_union: "União Neerlando-Indonésia"
 INSHOL_netherlands_indonesia_union_desc: "A ideia de um Estado unido e igualitário entre [HOL.GetName] e [INS.GetName] soa absurda para muitos, mas diante da crise atual pode ser a única maneira de garantir nossa soberania."
 # <Sukarno Shared Branch - Resistance Buildup>
 INS_underground_revolution: "Revolução clandestina"
 INS_underground_revolution_desc: "Começaremos a planejar uma revolução nas sombras, aumentando gradualmente a adesão e a atividade das milícias até estarmos prontos para agir."
 INS_infiltrate_the_media: "Infiltrar-se na mídia"
 INS_infiltrate_the_media_desc: "Nosso movimento conquistou a adesão de vários membros do alto escalão das organizações midiáticas nas Índias. Podemos usar isso a nosso favor, inserindo de maneira sutil mensagens com teor pró-revolucionário nas mentes dos cidadãos."
 INS_infiltrate_the_army: "Infiltrar-se no Exército"
 INS_infiltrate_the_army_desc: "Muitos de nossos membros estão alistados no KNIL, de soldados rasos a majores. Devemos extrair o máximo possível de segredos e posicionar nossos aliados em cargos estratégicos. No momento certo, semearemos o caos dentro do KNIL."
 INS_privately_owned_military_industry: "Indústria militar privada"
 INS_privately_owned_military_industry_desc: "Estabeleceremos diversas corporações de fachada no setor industrial militar, assegurando o controle sobre a indústria bélica quando a revolução começar."
 INS_privately_owned_military_industry_tt: "Adiciona §G2§! §Yfábricas militares§! em seu QG"
 INS_instigate_chaos_sulawesi: "Instigar o caos em Sulawesi"
 INS_instigate_chaos_sulawesi_desc: "Cooperaremos com os nacionalistas locais em Sulawesi, organizando greves, protestos e radicalizando a população."
 INS_instigate_chaos_sulawesi_tt: "Após declararmos independência, obteremos um §Gestado central§! em §Y[673.GetName]§! e §Y[1056.GetName]§!. Isso não se aplica às Índias Orientais Holandesas."
 INS_instigate_chaos_medan: "Instigar o caos em Medan"
 INS_instigate_chaos_medan_desc: "Cooperaremos com os nacionalistas locais em Medan e Riau, organizando greves, protestos e radicalizando a população."
 INS_instigate_chaos_medan_tt: "Após declararmos independência, obteremos um §Gestado central§! em §Y[1049.GetName]§!. Isso não se aplica às Índias Orientais Holandesas."
 INS_embezzlement_scheme_in_batavia: "Esquema de desvio de recursos na Batávia"
 INS_embezzlement_scheme_in_batavia_desc: "Estabeleceremos um plano para transferir nossa produção da Batávia para território republicano no momento da declaração de independência."
 INS_embezzlement_scheme_in_batavia_tt: "Após declarar independência, metade das fábricas na §Y[1058.GetName]§! serão realocadas para nosso §Yquartel-general revolucionário§!."
 INS_volksraad_rumors: "Rumores no Volksraad"
 INS_volksraad_rumors_desc: "Começaremos a discutir discretamente a revolução no Volksraad. Se tivermos sucesso, poderemos convencer os membros indonésios do conselho a se juntarem à nossa causa."
 INS_volksraad_rumors_tt: "Todos os conselheiros §Yindonésios§! do Volksraad serão §Gmantidos§! após a declaração de independência."
 INS_railway_youth_force: "Cooperar com a Força da Juventude Ferroviária"
 INS_railway_youth_force_desc: "A Força da Juventude Ferroviária é uma milícia juvenil islâmica, atuante principalmente em Java Central, conhecida por sua estratégia de tomar o controle das ferrovias. Pode ser uma aliada valiosa, embora sua energia e entusiasmo pelo combate sejam grandes. Ficarão descontentes com o governo caso permaneçamos em cessar-fogo por muito tempo."
 INS_sleeper_informant_network: "[GetInformantNetworkName]"
 INS_Sleeper_Informant_Network_name: "Rede de informantes infiltrados"
 INS_KNIL_Informant_Network_name: "Rede de informantes do KNIL"
 INS_sleeper_informant_network_desc: "Criaremos uma rede de informantes que seja incorporada pelo aparato administrativo do KNIL para sabermos antecipadamente dos planos do inimigo."
 INS_sleeper_informant_network_tt: "§RQuando a independência for declarada:§!\n"
 # <Sukarno Shared Branch - Peoples Security Army>
 INS_the_peoples_security_army: "O Exército de Segurança Popular"
 INS_the_peoples_security_army_desc: "A juventude indonésia que compõe nosso movimento clama por ação, desejando contribuir e lutar pela independência. Devemos estabelecer forças armadas revolucionárias e iniciar o treinamento de nossos futuros soldados."
 INS_commander_sudirman: "Exército de Sudirman"
 INS_commander_sudirman_desc: "Mesmo jovem, Sudirman já mostrou grande potencial e conquistou muito prestígio entre a juventude da resistência. Cabe a ele conduzir o Exército de Segurança Popular e nos levar à vitória."
 INS_commander_oerip: "O Exército de Oerip"
 INS_commander_oerip_desc: "Oerip serviu por décadas no Exército e foi o único indonésio a alcançar a patente de major no KNIL. Seu conhecimento e experiência superam amplamente os de qualquer outro membro. Cabe a ele conduzir o Exército de Segurança Popular e nos levar à vitória."
 INS_sudirmans_promotion: "Promover Sudirman"
 INS_sudirmans_promotion_desc: "Sudirman demonstrou grandes habilidades de liderança e orquestrou vários ataques bem-sucedidos. Está na hora de reconhecermos os esforços do nosso comandante conferindo-lhe o merecido título de general."
 INS_tkr_steal_general: "Aliciar generais do KNIL"
 INS_tkr_steal_general_desc: "Se conseguirmos convencer membros de alta patente do Exército das Índias Orientais a se juntar à nossa causa, poderemos fortalecer nosso Exército e ao mesmo tempo enfraquecer as fileiras deles."
 INS_tkr_supply: "Todo revolucionário deve lutar"
 INS_tkr_supply_desc: "Garantiremos que cada membro de nosso movimento receba treinamento militar formal, sem exceções."
 INS_tkr_professional_army: "Um Exército profissional"
 INS_tkr_professional_army_desc: "Não é possível depender apenas de milícias. Precisamos desenvolver um Exército republicano profissional para manter a ordem."
 INS_arm_the_revolutionaries: "Armar os revolucionários"
 INS_arm_the_revolutionaries_desc: "Devemos começar pelos revolucionários e nacionalistas, cheios de determinação e dispostos a sacrificar tudo pela Indonésia. Forneceremos o treinamento e o equipamento necessários para que lutem por seu país."
 INS_arm_the_youth: "Armar a juventude"
 INS_arm_the_youth_desc: "Além dos revolucionários, devemos armar a juventude. Ainda cheios de energia e esperança, eles carregarão a chama da revolução. Devemos garantir que o maior número possível de jovens indonésios esteja treinado e equipado para o combate. Se a guerra chegar a seus lares, estarão prontos para agir."
 INS_arm_the_students: "Armar os estudantes"
 INS_arm_the_students_desc: "Os estudantes construíram a base da revolução décadas atrás e continuarão a liderá-la rumo ao futuro."
 INS_guerilla_industry: "Indústria de guerrilha"
 INS_guerilla_industry_desc: "Utilizaremos nossas forças de guerrilha em todo o arquipélago para tomar o controle de fábricas, garantindo a produção de novas armas para nossas milícias."
 INS_indonesian_assault_doctrine: "A doutrina indonésia de ataque"
 INS_indonesian_assault_doctrine_desc: "Soldados não são tudo em uma guerra. Um exército imenso é inútil sem armas para lutar. Devemos priorizar a obtenção de artilharia de alta qualidade para avançar em território inimigo."
 INS_tighter_tkr_integration: "Aprimorar a integração entre o TKR e a Laskar"
 INS_tighter_tkr_integration_desc: "O Exército de Segurança Popular e as diversas forças de milícia não operam de forma unificada, e a coordenação é limitada. Isso só gerará mais problemas com o avanço da guerra. Precisamos integrar as forças armadas e as milícias em uma única organização coesa, apesar dos inevitáveis protestos dos oficiais das milícias."
 INS_quality_over_quantity: "Qualidade supera quantidade"
 INS_quality_over_quantity_desc: "Um soldado bem treinado, com estratégia definida e equipamento moderno, supera cinco estudantes armados com pistolas. Devemos priorizar tropas bem preparadas e equipadas, incluindo forças especiais, em vez de mobilizar o maior número possível de soldados."
 INS_add_militia_cap_1_tt: "O limite de divisões de §Yguerreiros da liberdade§! aumenta em §Y1§!.\n"
 INS_add_militia_cap_2_tt: "O limite de divisões de §Yguerreiros da liberdade§! aumenta em §Y2§!.\n"
 INS_add_militia_cap_3_tt: "O limite de divisões de §Yguerreiros da liberdade§! aumenta em §Y3§!.\n"
 INS_add_3_militia_unit_tt: "Cria três unidades de §Yguerreiros da liberdade§!, que podem ser usadas em §Yincursões§! para aumentar a §Gpresença miliciana§! nos estados neerlandeses."
 INS_add_fully_trained_militia_unit_tt: "Cria uma unidade de §Yguerreiros da liberdade§! treinada.\n"
 # <Sukarno Shared Branch - Expand Resistance Membership>
 INS_expand_resistance_membership: "Expandir a adesão à resistência"
 INS_expand_resistance_membership_desc: "Concentrar todo o nosso movimento em uma única base é garantia de fracasso. Devemos recrutar membros em grupos de milícia e enviá-los como representantes para aumentar nossa popularidade e controle em diferentes regiões."
 # <Central Independence Branch - Militias>
 INS_deploy_the_kris: "Serviço Popular Indonésio de Sulawesi"
 INS_deploy_the_kris_desc: "O Serviço Popular Indonésio de Sulawesi, conhecido em indonésio como KRIS, é um grupo ativo de milícias e constitui a maior presença miliciana em Sulawesi e Manado. Devemos recrutá-los para lutar formalmente ao lado do TKR."
 INS_assist_the_pemuda: "Auxiliar os pemudas"
 INS_assist_the_pemuda_desc: "Java está repleta de milícias estudantis de pemudas. Unir forças com elas e fornecer apoio militar em suas missões contra os neerlandeses pode nos garantir um aliado valioso."
 INS_mobilize_the_pemuda: "Mobilizar os pemudas"
 INS_mobilize_the_pemuda_desc: "Agora que conquistamos a confiança dos maiores grupos de pemudas, devemos planejar como mobilizá-los juntos ao TKR."
 INS_organize_jakarta_pemuda: "Organizar os pemudas de Jacarta"
 INS_organize_jakarta_pemuda_desc: "Java possui muitos grupos de pemudas de diferentes tamanhos. Nós já mobilizamos e recrutamos a maioria deles, mas ainda existem dezenas de grupos menores em Jacarta atuando de forma independente. Precisamos contatá-los para estabelecer uma colaboração."
 INS_recognize_moestopos_batallion: "Reconhecimento do batalhão de Moestopo"
 INS_recognize_moestopos_batallion_desc: "Um revolucionário chamado Moestopo declarou-se \"Ministro da Defesa interino\" em Surabaya, mantendo o controle das forças de milícia na região. Seus esforços merecem reconhecimento formal, portanto devemos promovê-lo oficialmente a major-general do TKR."
 INS_darul_islam_focus: "Darul Islam"
 INS_darul_islam_focus_desc: "Os membros do hezbollah de Kartosoewirjo provaram seu valor nas colinas de Java Ocidental, e não podemos nos dar ao luxo de deixar tais combatentes fora de nossas fileiras. Que seus irregulares se juntem aos nossos, e que o próprio Kartosoewirjo receba a patente que conquistou. Os fiéis em breve levarão sua causa à República."
 # <Central Independence Branch - Navy>
 INS_just_a_fisherman: "Apenas um pescador"
 INS_just_a_fisherman_desc: "Combater em um arquipélago sem uma Marinha é uma tarefa difícil e insustentável a longo prazo. Tentaremos uma estratégia possivelmente ingênua de enviar milícias em barcos de pesca, disfarçadas de pescadores, para portos controlados pelos neerlandeses."
 INS_a_cheap_navy: "Uma Marinha de baixo custo"
 INS_a_cheap_navy_desc: "Não temos tempo nem recursos para construir uma Marinha moderna e de grande porte. Devemos nos contentar com o que temos e reunir o que for possível encontrar."
 INS_divert_army_funds_to_navy: "Redirecionar recursos do Exército para a Marinha"
 INS_divert_army_funds_to_navy_desc: "A Indonésia é um arquipélago e nossa infantaria é inútil sem navios para transportá-la. O redirecionamento de recursos do TKR para nossa nova Marinha é um sacrifício que precisa ser feito."
 INS_indonesian_naval_doctrine: "Doutrina naval indonésia"
 INS_indonesian_naval_doctrine_desc: "Agora que estamos construindo nossa própria Marinha, é importante definir a doutrina pela qual lutaremos e treinaremos. Devemos priorizar a criação e a adoção de uma doutrina naval o quanto antes."
 INS_domestic_shipbuilding: "Construção naval doméstica"
 INS_domestic_shipbuilding_desc: "Não podemos depender indefinidamente de navios capturados ou adquiridos, pois em breve não restarão embarcações neerlandesas para capturar. Devemos iniciar imediatamente a construção de nossos próprios navios."
 INS_acquire_modern_blueprints: "Adquirir projetos modernos"
 INS_acquire_modern_blueprints_desc: "Compraremos projetos de outros países e de empresas privadas, que serão utilizados na construção de nossa nova Marinha."
 INS_reclaiming_the_dutch_navy: "Reivindicar a Marinha das Índias Neerlandesas"
 INS_reclaiming_the_dutch_navy_desc: "Os neerlandeses deixaram diversas embarcações ancoradas em portos que agora ocupamos. Devemos aproveitar a oportunidade e reivindicar esses navios para nossa frota."
 INS_admiral_mas_pardi: "Almirante Mas Pardi"
 INS_admiral_mas_pardi_desc: "Toda Marinha que se preze precisa de um almirante para guiá-la. Mas Pardi é a escolha óbvia."
 INS_akademi_angkatan_laut: "Construir a Akademi Angkatan Laut"
 INS_akademi_angkatan_laut_desc: "Construiremos uma academia naval com instalações para pesquisa marítima, e formaremos cidadãos que se tornarão nossos próximos engenheiros e almirantes."
 # <Central Independence Branch - Militia Logistics>
 INS_pki_militia_tt: "Tan Malaka possui uma milícia poderosa que luta não apenas pela vontade da Indonésia, mas também pelo §Rcomunismo§! e pelos soviéticos. §RMais cedo ou mais tarde, eles irão se opor violentamente a qualquer governo não comunista.§!"
 INS_increase_laskar_funding_tt: "§WGanha§! 1 §Yfábrica militar§! para cada exigência de milícia atendida com sucesso (máximo de §G6§!)"
 INS_subsidize_laskar_armament: "Subsidiar o armamento das Laskar"
 INS_subsidize_laskar_armament_desc: "Milícias que lutam com lanças de bambu não sobreviverão por muito tempo contra unidades fortemente armadas. Precisamos priorizar a produção de armas e munições para esses grupos."
 INS_loot_knil_weapons_caches: "Saquear estoques de armas do KNIL"
 INS_loot_knil_weapons_caches_desc: "O KNIL escondeu diversos estoques de armas antes da revolução. Muitos de nossos membros são ex-integrantes do KNIL, então poderemos localizar e saquear esses depósitos."
 INS_utilize_tan_malakas_militia: "Utilizar a milícia de Tan Malaka"
 INS_utilize_tan_malakas_militia_desc: "A Milícia Vermelha de Tan Malaka é possivelmente a força miliciana mais forte de toda a Indonésia e sua mobilização no TKR seria uma enorme vantagem. Contudo, isso apresentaria alguns riscos. Conceder tanta influência a uma milícia com fortes motivações políticas pode facilitar uma tomada de poder pelos milicianos."
 INS_increase_laskar_funding: "Aumentar os investimentos nas Laskar"
 INS_increase_laskar_funding_desc: "Nossas milícias compõem a maior parte de nossas forças. Precisamos reconhecer isso e financiá-las de maneira adequada, mesmo que não sejam completamente leais a [INS.GetLeader]."
 INS_develop_a_functioning_airforce: "Desenvolver uma Força Aérea"
 INS_develop_a_functioning_airforce_desc: "Uma Força Aérea tem grande impacto sobre o Exército. Devemos priorizar a criação da nossa."
 # <Vice Presidential Edict - Intro>
 INS_political_stabilization: "Restaurar a ordem"
 INS_political_stabilization_desc: "Nossa nação torna-se mais instável a cada dia. Se não reagirmos logo, uma guerra civil será inevitável. Precisamos iniciar negociações entre o Comitê Nacional, o presidente e as lideranças da milícia para encontrar uma solução."
 INS_vice_presidential_edict: "Assinar o decreto vice-presidencial X"
 INS_vice_presidential_edict_desc: "O Comitê Nacional é quase unânime em sua demanda por poder legislativo real. Uma petição foi entregue ao presidente propondo um sistema híbrido, no qual o Comitê Nacional se tornará um parlamento independente, compartilhando poderes legislativos com o presidente. A proposta é interessante, mas pode reduzir drasticamente o poder presidencial."
 INS_local_cooperatives: "Estabelecer cooperativas locais"
 INS_local_cooperatives_desc: "Não devemos criar um sistema capitalista nos moldes do Ocidente, mas também não podemos ignorar os benefícios econômicos da privatização. Permitiremos a criação de cooperativas locais, cujo sucesso trará prosperidade aos proprietários. No entanto, elas serão supervisionadas pelo governo e proibidas de se expandir além de sua região."
 INS_local_unity: "Autonomia principesca parcial"
 INS_local_unity_desc: "Concederemos autonomia parcial aos Estados Principescos como medida temporária para reduzir os conflitos internos durante este período conturbado."
 INS_education_subsidies: "Subsídios para a educação"
 INS_education_subsidies_desc: "Investir no futuro da juventude da nação é absolutamente necessário para um Estado economicamente bem-sucedido. Construiremos escolas acessíveis em toda a república."
 INS_land_reform: "Reforma agrária"
 INS_land_reform_desc: "Os Países Baixos controlavam diretamente grandes extensões de terra antes de declararmos independência. Devemos repassá-las a preços acessíveis para os indonésios dispostos a utilizá-las, estimulando assim o crescimento econômico."
 INS_dominion_of_atjeh: "O Domínio de Atjeh"
 INS_dominion_of_atjeh_desc: "O movimento separatista em Atjeh é grande e está crescendo ainda mais. Em vez de agravar a situação, devemos negociar um acordo no qual permaneçam parte da Indonésia, mas com ampla autonomia."
 # <Vice Presidential Edict - Presidential Balance>
 INS_dissolve_national_party: "Dissolver o Partido Nacional"
 INS_dissolve_national_party_desc: "O sistema híbrido foi criado como uma concessão necessária para evitar o caos. Não devemos permitir que o presidente concentre tanto poder de forma antidemocrática. Ele deve ser deposto pelo parlamento, caso contrário nunca alcançaremos a democracia."
 INS_womens_sufferage: "Sufrágio feminino"
 INS_womens_sufferage_desc: "Estender o direito de voto às mulheres trará instabilidade no curto prazo, mas é essencial para a estabilidade e a democracia a longo prazo."
 INS_women_in_military: "Mulheres no Exército"
 INS_women_in_military_desc: "Permitir que mulheres sirvam nas forças armadas é necessário para garantir que nosso Exército seja o mais poderoso possível."
 INS_fair_election: "Uma eleição justa"
 INS_fair_election_desc: "Com o presidente deposto e a revolução encerrada, finalmente podemos realizar a primeira eleição verdadeiramente justa, sem influência autoritária."
 # < Hybrid Politics >
 INS_continue_hybrid_politics: "Manter a política híbrida"
 INS_continue_hybrid_politics_desc: "A política híbrida é um mal necessário. Embora o objetivo final seja a verdadeira democracia, a Indonésia ainda é jovem e instável demais para que todo o poder seja entregue ao povo. O presidente e o parlamento manterão um equilíbrio de poder, garantindo que nenhuma das partes se sobreponha à outra."
 INS_guided_economy: "Economia direcionada"
 INS_guided_economy_desc: "Supervisionaremos diretamente a economia da Indonésia para garantir o controle estatal. Nacionalizaremos todos os bancos, bem como os setores petrolífero e agrícola."
 INS_reform_education_system: "Educação ideológica obrigatória"
 INS_reform_education_system_desc: "A revolução mostrou que estudantes e jovens insatisfeitos com a ordem social sempre liderarão rebeliões. Para a segurança do governo e da nação, garantiremos que as escolas ensinem de acordo com a ideologia do governo."
 INS_reform_education_system_2: "Reforma na educação"
 INS_reform_education_system_2_desc: "Se quisermos que a Indonésia se torne uma nação próspera no futuro, todos os indonésios, independentemente do local de nascimento, deverão ter direito à educação."
 INS_three_year_plan: "O plano de três anos"
 INS_three_year_plan_desc: "Podemos estabelecer um plano de três anos para construir a infraestrutura em todo o arquipélago e conectar as ilhas."
 INS_destroy_pacific_colonialism: "Destruir o colonialismo no Pacífico"
 INS_destroy_pacific_colonialism_desc: "A revolução pode ter terminado, mas ainda há batalhas a serem travadas. Muitos além de nossas fronteiras ainda vivem sob a tirania colonial. Não podemos permanecer inertes, devemos agir para libertá-los de seus soberanos!"
 INS_rapid_mobilization: "Mobilização rápida"
 INS_rapid_mobilization_desc: "Qualquer nação forte se apoia em um Exército poderoso. Para nos tornarmos uma potência regional capaz de se impor, devemos começar fortalecendo significativamente nossas forças armadas."
 INS_greater_indonesia: "Proclamar a Grande Indonésia"
 INS_greater_indonesia_desc: "O antigo império de Nusantara já uniu o mundo malaio em uma única entidade e um só povo. Agora que libertamos a Malaia da tirania colonial, devemos seguir o exemplo de nossos antepassados e declarar todo o mundo malaio como uma única nação unida."
 # < State Religion >
 INS_secularism: "Secularismo"
 INS_secularism_desc: "A Indonésia abriga povos de diversas religiões. Uma vez que misturar religião e política apenas gerará conflitos internos, devemos proibir partidos políticos religiosos."
 INS_integrate_sarekat_islam: "Integrar o Sarekat Islam"
 INS_integrate_sarekat_islam_desc: "Os grandes partidos políticos islâmicos possuem amplo apoio popular. É de nosso interesse integrá-los ao governo."
 # <Vice Presidential Edict - Sjahrir>
 INS_sjahrirs_continued_tenure: "Continuidade do mandato de Sjahrir"
 INS_sjahrirs_continued_tenure_desc: "O primeiro-ministro Sjahrir demonstrou ser um grande líder, guiando-nos pela revolução, fortalecendo nossa economia e estabelecendo a democracia. Devemos reelegê-lo como primeiro-ministro."
 INS_unity_in_diversity: "União na diversidade"
 INS_unity_in_diversity_desc: "Por séculos, as palavras \"união na diversidade\" expressaram o espírito de nosso arquipélago. Durante a revolução, tornaram-se um grito de mobilização, lembrando aos indonésios que, apesar de línguas e tradições distintas, somos um só povo. Devemos consagrar essa frase em nossa constituição, para que nossa união seja preservada por gerações."
 INS_the_timor_issue: "[INS_timor_issue_scripted_name]"
 INS_timor_issue_scripted_name_issue: "A questão do Timor"
 INS_timor_issue_scripted_name_attack: "Atacar o Timor-Leste"
 INS_the_timor_issue_desc: "[INS_timor_issue_scripted_desc]"
 INS_timor_issue_scripted_desc_issue: "O Timor-Leste é claramente um território legítimo da Indonésia e, embora a revolução tenha terminado, ainda permanece sob domínio colonial. Enviaremos um ultimato para [721.OWNER.GetNameDef] exigindo a transferência imediata do Timor-Leste."
 INS_timor_issue_scripted_desc_attack: "O Timor-Leste pertence indiscutivelmente à Indonésia. Os rebeldes na ilha podem reivindicar independência, mas não representam toda a população. Os resquícios do colonialismo português devem ser integrados à República."
 INS_pledge_to_allies: "Compromisso com os Aliados"
 INS_pledge_to_allies_desc: "Corremos o risco de sermos invadidos em meio ao crescente conflito global. Embora nossas relações com os Aliados tenham sido instáveis, já nos firmamos como uma potência democrática no Pacífico e devemos nos alinhar às grandes potências democráticas globais."
 INS_mixed_economy_system: "Sistema de economia mista"
 INS_mixed_economy_system_desc: "A Indonésia é um país único e não prosperará sob o capitalismo ou o comunismo tradicionais. Devemos estabelecer um sistema de economia mista, combinando elementos de ambos."
 INS_social_democracy: "Social-democracia"
 INS_social_democracy_desc: "A economia do Estado [INS.GetAdjective] cresceu muito desde a implementação das políticas de Sjahrir. Devemos declarar a Indonésia como um Estado plenamente social-democrata e desenvolver futuras políticas econômicas baseadas nos princípios da social-democracia."
 # <Vice Presidential Edict - Sjarifuddin>
 INS_prime_minister_sjarifuddin: "Primeiro-ministro Sjarifuddin"
 INS_prime_minister_sjarifuddin_desc: "Sjarifuddin é o melhor candidato para a Indonésia, pois suas políticas moderadas permitem a conciliação entre comunistas e socialistas."
 INS_concessions_to_communists: "Concessões aos comunistas"
 INS_concessions_to_communists_desc: "O PKI possui um número expressivo de assentos no parlamento. Deveríamos conceder alguns ministérios a seus líderes para garantir estabilidade."
 INS_sjarifuddin_focus_2: "Economia de exportação autogerida"
 INS_sjarifuddin_focus_2_desc: "Com nossa independência recém-adquirida, deveríamos rever nosso sistema econômico de exportação e reorganizá-lo para que não dependa do lucro neerlandês. Embora uma economia baseada em exportação continue sendo perigosa, podemos torná-la muito mais confiável desta vez."
 # <Vice Presidential Edict - Hatta>
 INS_prime_minister_hatta: "Primeiro-ministro Hatta"
 INS_prime_minister_hatta_desc: "Mohammad Hatta, conhecido como o proclamador da revolução, foi o vice-presidente de Sukarno e se mostrou o mais democrático entre os dois. Ele será um primeiro-ministro adequado, com quem a maioria dos partidos políticos poderá dialogar."
 INS_hatta_focus_2: "Os próximos passos"
 INS_hatta_focus_2_desc: "A revolução terminou e, embora certas figuras políticas insistam que ela deve continuar, essas vozes devem ser ignoradas. Deveríamos olhar para a frente e construir uma Indonésia em que as futuras gerações possam viver com prosperidade."
 INS_hatta_princely_advisors: "Integrar os Estados Principescos"
 INS_hatta_princely_advisors_desc: "Em nossa diversidade compartilhada encontramos a união. Baseamos nossa nação nesse princípio, mas o fim da revolução comprometeu essa ideia por não termos uma dificuldade compartilhada. Para evitar descontentamento e revoltas de grupos minoritários, deveríamos estabelecer um conselho adicional no qual governantes locais de Estados Principescos tenham voz ativa na política nacional."
 INS_prime_minister_tt: "As primeiras eleições gerais na Indonésia foram realizadas"
 # < Guided Democracy >
 INS_guided_democracy: "Democracia controlada"
 INS_guided_democracy_desc: "A democracia pode ser o sistema ideal, mas entregar o poder ao povo agora resultaria em caos. Promoveremos Sukarno à posição de presidente vitalício, com autoridade para supervisionar o parlamento democrático e intervir se necessário."
 INS_enact_militarism: "Implementar o militarismo"
 INS_enact_militarism_desc: "Devemos aprender algumas lições com [JAP.GetNameDef] e suas políticas militaristas. A adoção de princípios semelhantes trará benefícios ao nosso novo governo."
 INS_sukarnos_industrialization: "Fortalecer a indústria javanesa"
 INS_sukarnos_industrialization_desc: "As indústrias de Java são a base de nossa economia e de nossas forças armadas. Todos os caminhos levam a Roma."
 INS_sukarnos_industrialization2: "Cada homem deve cumprir seu papel"
 INS_sukarnos_industrialization2_desc: "O esforço de guerra é a principal prioridade desta nação e, portanto, deve ser a principal prioridade para todos os indonésios. O luxo é o inimigo, e o complexo industrial militar deve crescer."
 INS_japanese_military_lessons: "Lições militares japonesas"
 INS_japanese_military_lessons_desc: "Devemos estudar as doutrinas militares do Japão e adaptar nosso Exército de acordo com elas."
 # < Support Tan Malaka's Coup>
 INS_support_tan_malakas_coup: "Apoiar o golpe de Estado de Tan Malaka"
 INS_support_tan_malakas_coup_desc: "Sukarno proclamou nossa independência, mas mostrou-se um homem hesitante e que realiza muitas concessões diplomáticas. Tan Malaka e sua Persatuan Perjuangan exigem o mesmo que o povo: independência total, sem negociações, sem concessões. Se Sukarno não lutar pela revolução em sua totalidade, então outro líder deverá assumir."
 INS_minimum_program: "O programa mínimo"
 INS_minimum_program_desc: "A Persatuan Perjuangan apresentou suas exigências: um governo popular, um Exército popular e a nacionalização de todas as plantações e indústrias de propriedade estrangeira. Precisamos de homens capazes para levar esse programa adiante. Njono fala pelos trabalhadores e Setyadjit, pelos intelectuais do partido. Juntos, garantirão que a revolução seja organizada em todos os setores, desde as fábricas até os corredores do governo."
 INS_agrarian_reform: "Reforma agrária"
 INS_agrarian_reform_desc: "Por três séculos, as terras da Indonésia alimentaram as plantações de estrangeiros. Os camponeses que nelas trabalharam pouco ganharam com isso. Uma revolução que não altera essa realidade não é uma verdadeira revolução. A terra deve pertencer a quem a cultiva."
 INS_soviet_aid: "Auxílio soviético"
 INS_soviet_aid_desc: "A União Soviética reconheceu nossa revolução e está pronta para apoiá-la. Quaisquer que sejam as diferenças entre nosso programa e o de Moscou, não podemos nos dar ao luxo de recusar essa oferta. Devemos aceitar as armas e seguir em frente."
 INS_pacific_revolution: "A revolução do Pacífico"
 INS_pacific_revolution_desc: "As potências coloniais não se retiraram da Ásia, apenas da Indonésia. A velha ordem ainda prevalece em alguns lugares – como a Malaia e as Filipinas – e em cada um deles há homens e mulheres dispostos a derrubá-la. Nossa revolução nos dá tanto a legitimidade quanto a obrigação de ajudá-los. E nós o faremos."
 INS_purge_oppurtunists_tt: "Desbloqueia §Y$INS_launch_revolution$§! em países com §Y60%§! ou mais de apoio comunista. Os países em que instigarmos revoluções se tornarão nossos §Yfantoches§!."
 INS_purge_oppurtunists: "Expurgar os oportunistas"
 INS_purge_oppurtunists_desc: "Musso passou vinte anos em Moscou aprendendo a acatar ordens, retornando em seguida com instruções soviéticas e um plano para transformar nossa república em um fantoche da Comintern. Não derrubamos os neerlandeses para nos curvarmos diante de outro mestre estrangeiro. Os oportunistas que venderiam nossa revolução a Moscou devem ser eliminados e os povos que libertarmos devem ouvir Jacarta, e não o Kremlin."
 INS_federation_of_aslia: "Federação de Aslia"
 INS_federation_of_aslia_desc: "As nações que libertamos não precisam permanecer isoladas. Tan Malaka vislumbrava algo maior que uma república: uma federação do continente ao Pacífico, unida contra qualquer poder colonial que ousasse retornar. Ofereceremos a elas plena adesão ao nosso Estado."
 INS_aslia_tt: "Permite transformar em estados centrais e anexar §Ysúditos§! do Pacífico"
 INS_musso_ascends: "Ascensão de Musso"
 INS_musso_ascends_tt: "Desbloqueia §Y$INS_launch_revolution$§! em países com §Y30%§! ou mais de apoio comunista. Os países em que instigarmos revoluções continuarão independentes."
 INS_musso_ascends_desc: "Tan Malaka é um sonhador. Musso traz o que os sonhadores não podem: o pleno apoio da União Soviética e a solidariedade do movimento comunista internacional. Nossa revolução não precisa permanecer isolada."
 INS_soviet_economic_integration: "Integração econômica soviética"
 INS_soviet_economic_integration_desc: "A revolução nos deu liberdade, mas liberdade por si só não constrói fábricas nem alimenta as massas. A União Soviética oferece o que nenhuma potência capitalista nos dará: conhecimento industrial, créditos de desenvolvimento e comércio sem amarras coloniais. Recusar isso seria um erro."
 # <National Revolution - Reasserting Control>
 INSHOL_revolution_ongoing_tt: "A revolução indonésia continua"
 INSHOL_reasserting_control: "Reafirmar o controle sobre as Índias"
 INSHOL_reasserting_control_desc: "Não podemos permanecer inertes enquanto oportunistas tentam destruir o que levamos séculos para construir, arruinando nossa infraestrutura e radicalizando a juventude. Precisamos agir!"
 INSHOL_request_british_support: "Pedir apoio britânico"
 INSHOL_request_british_support_desc: "O governo d[ENG.GetNameDef], assim como nós uma potência colonial, deve entender a nossa situação, principalmente porque se os revolucionários tiverem sucesso, isso poderá acarretar um efeito dominó em toda a Ásia Oriental. Devemos solicitar seu apoio econômico e militar."
 INS_eng_treaty_holside_tt: "O Estado §Y[ENG.GetAdjective]§! declarará oficialmente apoio ao nosso lado no conflito e fornecerá assistência substancial. Caso a guerra termine em vitória, o governo §Y[ENG.GetAdjective]§! terá direito a Bornéu."
 INS_eng_treaty_engside_tt: "Vamos nos alinhar oficialmente com §Y[HOL.GetNameDef]§! no conflito das Índias Orientais. Se o Estado §Y[HOL.GetAdjective]§! vencer, teremos direito à posse de Bornéu."
 INS_fra_treaty_holside_tt: "O Estado §Y[FRA.GetAdjective]§! declarará oficialmente apoio ao nosso lado no conflito e fornecerá assistência substancial. Caso a guerra termine em vitória, o governo §Y[FRA.GetAdjective]§! terá direito à região nordeste de Sumatra."
 INS_fra_treaty_fraside_tt: "Vamos nos alinhar oficialmente com §Y[HOL.GetNameDef]§! no conflito das Índias Orientais. Se o Estado §Y[HOL.GetAdjective]§! vencer, teremos direito à posse da região nordeste de Sumatra."
 INSHOL_franco_dutch_accord: "Acordo franco-neerlandês"
 INSHOL_franco_dutch_accord_desc: "Apesar de nossas tropas estarem melhor equipadas e organizadas do que as milícias republicanas, a superioridade numérica destas virou o conflito contra nós. Para garantir a vitória, precisamos de mais apoio externo do que a maioria estaria disposta a oferecer. A França talvez aceite, desde que ofereçamos parte do território nas Índias para expandir sua presença no Pacífico."
 INSHOL_london_batavia_accord: "Acordo Londres-Batávia"
 INSHOL_london_batavia_accord_desc: "Apesar de nossas tropas estarem melhor equipadas e organizadas do que as milícias republicanas, a superioridade numérica destas virou o conflito contra nós. Para garantir a vitória, precisamos de mais apoio externo do que a maioria estaria disposta a oferecer. O Estado [ENG.GetAdjective] pode ter interesse devido à sua presença na Malaia. Talvez possamos convencê-los em troca de uma compensação?"
 INSHOL_australian_divisions: "Enviar infantaria australiana para Java"
 INSHOL_australian_divisions_desc: "Conforme o Acordo Londres-Batávia, a Grã-Bretanha deverá enviar divisões adicionais para as Índias por meio da Austrália quando solicitarmos. A proximidade com a Austrália a torna ideal para abrigar uma base militar fora das próprias Índias."
 INSHOL_indian_divisions: "Divisões do Exército indiano britânico"
 INSHOL_indian_divisions_desc: "Embora seja pouco provável que a Grã-Bretanha envie suas próprias tropas para as Índias, será mais fácil convencê-la a enviar divisões indianas, especialmente devido à sua proximidade com a Batávia."
 INSHOL_undermine_the_militias: "Menosprezar as milícias"
 INSHOL_undermine_the_militias_desc: "A mídia está exagerando a gravidade da situação. As milícias são apenas grupos de jovens desordeiros tentando alcançar o impossível. Não precisamos desviar todos os nossos recursos para combatê-las, basta manter nossas posições e aguardar que se desgastem."
 INSHOL_flag_will_fly_again: "A bandeira voltará a tremular"
 INSHOL_flag_will_fly_again_desc: "A bandeira neerlandesa tremulou nas Índias por séculos e não há força no mundo que nos faça arriá-la. Se for preciso enviar tanques e bombardeiros para proteger nossa colônia mais valiosa, nós enviaremos!"
 INSHOL_flag_will_fly_again_tt: "§YApós o fim da revolução, o espírito será removido e as mudanças de governo serão revertidas.§!"
 # <National Revolution - Escalation>
 INSHOL_mass_mobilization: "Mobilização em massa"
 INSHOL_mass_mobilization_desc: "Não podemos vencer este conflito e esmagar a República sem um exército bem equipado. Devemos rearmar as Índias e redirecionar recursos dos setores civis para o KNIL."
 INSHOL_batavia_storm_operation: "Invadir a Batávia"
 INSHOL_instigate_infighting: "Instigar conflitos internos na República"
 INSHOL_ultimatum_to_republic: "Um ultimato à República"
 INSHOL_comite_rijkseenheid: "Comité Rijkseenheid"
 INSHOL_comite_rijkseenheid_desc: "A bandeira está sendo arriada nas Índias enquanto a população assiste, indolente. Não podemos permitir isso. Devemos convencer a administração das Índias de que o povo neerlandês quer o fim da revolução!"
 INSHOL_increase_esclation_placeholder: "Escalada rápida"
 INSHOL_increase_esclation_placeholder_desc: "Nossas milícias tomaram o controle de portos, cidades e centros industriais vitais. Não podemos continuar esperando os Países Baixos agirem. Nós mesmos organizaremos uma grande ofensiva militar!"
 INS_take_batavia_explination_tt: "Se conseguirmos ocupar toda Java, destruiremos o governo colonial por dentro e §Gvenceremos a guerra§!. No entanto, caso não consigamos dentro de §Y730 dias§!, seremos §Rderrotados§!."
 INSHOL_linggadjati_agreement: "Negociação de acordos de cessar-fogo"
 INSHOL_linggadjati_agreement_desc: "A invasão de Java mostrou-se difícil e nossa administração está se tornando instável. Precisamos recuar e adotar uma postura defensiva para evitar o colapso da República. Deveríamos firmar acordos locais de cessar-fogo com os Países Baixos, reorganizar nossas forças e depois retomar o foco em Java."
 INSHOL_increase_esclation_placeholder_tt: "Desbloqueia uma §Ydecisão§! para negociar cessar-fogo local e §Yaumentar o tempo§! para ocupar Java."
 # <National Revolution - Peace Negotiation>
 INSHOL_seek_foreign_help: "Buscar ajuda estrangeira"
 INSHOL_seek_foreign_help_desc: "Todos sabem que tentar vencer uma guerra contra uma potência colonial altamente industrializada é uma tarefa quase impossível para uma nação recém-formada e sem economia estabelecida. Deveríamos contatar outros países simpáticos à nossa causa e verificar se estariam dispostos a nos ajudar."
 INSHOL_renville_agreement: "O acordo de Renville"
 INSHOL_renville_agreement_desc: "A agressão sem precedentes dos Países Baixos trouxe atenção internacional à revolução, mas ainda assim eles continuam a violar acordos de cessar-fogo e tentam provocar uma reação de nossa parte. Precisamos entrar em contato com [USA.GetNameDef] para obter sua ajuda na defesa da Indonésia. Se tivermos sucesso, os Países Baixos não terão escolha senão recuar."
 INSHOL_no_compromise: "Sem concessões, sem rendição"
 INSHOL_no_compromise_desc: "A concentração gananciosa de investimentos neerlandeses em Java e o total descaso com as ilhas orientais transformaram a ilha no calcanhar de Aquiles de toda a colônia. Esta será sua ruína!"
 INSHOL_end_to_bloodshed: "Solução de dois Estados"
 INSHOL_end_to_bloodshed_desc: "Este conflito já se prolonga por tempo demais, com pouco progresso de ambos os lados e apenas mais vidas sendo perdidas a cada dia. Ninguém quer que isso continue. É hora de nos sentarmos com os líderes neerlandeses e dialogar."
 INSHOL_reorganize_colonies: "Reorganizar a colônia"
 INS_we_will_need_another_tt: "Como já controlamos toda Java, precisaremos controlar um estado adicional além de Java."
 # Industry Branch - New
 INS_centralize_the_state: "Centralizar o Estado"
 INS_centralize_the_state_desc: "De Sumatra a Sulawesi, de Bornéu a Bangka, nossos programas de desenvolvimento levaram estradas, fábricas e instituições a territórios que a [1058.GetName] administrava apenas no papel. Essas regiões não são mais províncias distantes. Elas são [INS.GetNameDef]."
 INS_centralize_the_state_1_tt: "Estados pré-requisitos que são §Yestados centrais§!:"
 INS_centralize_the_state_2_tt: "Estados pré-requisitos que não são §Yestados centrais§!:"
 INS_fate_of_de_javasche_bank: "[INS_fate_of_de_javasche_bank_scripted_name]"
 INS_fate_of_de_javasche_bank_scripted_name_colony: "Destino do Banco De Javasche"
 INS_fate_of_de_javasche_bank_scripted_name_independent: "Destino do Bank Indonesia"
 INS_fate_of_de_javasche_bank_desc: "[INS_fate_of_de_javasche_bank_scripted_desc]"
 INS_fate_of_de_javasche_bank_scripted_desc_colony: "O florim das Índias Orientais entrou em queda livre desde a crise e o Banco De Javasche não possui os instrumentos necessários para conter o declínio. Precisamos decidir como estabilizar nossa moeda antes que a confiança dos investidores desapareça por completo."
 INS_fate_of_de_javasche_bank_scripted_desc_independent: "Herdamos uma moeda em crise. O antigo florim colonial já estava em declínio e a transição para a rupia não conseguiu estabilizar os mercados. O Bank Indonesia precisa de uma direção clara do governo ou nossa jovem economia sofrerá as consequências."
 INS_finish_the_bauxite_project: "Concluir o Projeto Bangka"
 INS_finish_the_bauxite_project_desc: "Com novas estradas, portos e ferrovias operando em Bangka-Belitung, equipes de prospecção relatam depósitos de tungstênio e crômio além das expectativas iniciais. Essas ilhas ainda demonstrarão todo o seu valor para a República."
 INS_australian_contracts: "Contratos australianos"
 INS_australian_contracts_desc: "Nossas reservas de borracha cresceram muito além das necessidades internas. A Austrália, sempre ávida por matérias-primas para suas indústrias, surge como parceira natural. Garantir contratos de longo prazo com empresas australianas gerará uma receita estável e fortalecerá nossa posição na economia regional."
 INS_coopereate_with_chinese_businessmen: "Cooperar com os empresários chineses"
 INS_coopereate_with_chinese_businessmen_desc: "Uma classe mercantil rica e bem relacionada tem sustentado o comércio pelo arquipélago há muito tempo. Em vez de marginalizar essas redes estabelecidas, devemos trabalhar com elas. Seu capital e experiência comercial podem ser inestimáveis para tirar nossa economia da atual estagnação."
 INS_oil_decisions_unlock_tt: "Desbloqueia novas decisões de §Y$INS_realign_supply_chains_cat$§! para vender §Ypetróleo§!."
 INS_negotiate_new_contracts_unlock_tt: "Desbloqueia novas decisões de §Y$INS_realign_supply_chains_cat$§!."
 INS_realign_supply_chains_explain_tt: "Desbloqueia decisões de §Y$INS_realign_supply_chains_cat$§! para vender recursos a empresas privadas com contratos de 2 anos."
 INS_negotiate_new_contracts: "Negociar novos contratos"
 INS_negotiate_new_contracts_desc: "Nossa reputação como fornecedor confiável está crescendo e abrindo novas oportunidades. Novos compradores estão surgindo e devemos agir rapidamente para firmar acordos de longo prazo, antes que nossos concorrentes ofereçam condições melhores."
 INS_all_in_on_rubber: "Apostar tudo na borracha"
 INS_all_in_on_rubber_desc: "A borracha é nosso maior trunfo e devemos explorá-lo ao máximo. Toda terra disponível para plantio será destinada ao cultivo de borracha e nosso sistema de exportação será reorganizado para entregá-la com mais rapidez e a um menor custo. Ninguém na região conseguirá superar nossa oferta."
 INS_more_market_resources: "Superar a Grande Depressão"
 INS_more_market_resources_desc: "O mundo pode estar imerso em uma crise econômica, mas a crise cria oportunidades para aqueles que ousam aproveitá-las. Ao inundar o mercado com nossos produtos a preços imbatíveis, garantiremos que os produtos indonésios já estejam presentes em todas as prateleiras e armazéns quando o mundo se recuperar."
 # <Industry Branch - Trade Policy>
 INS_recovering_from_the_great_depression: "Recuperando-se da Grande Depressão"
 INS_recovering_from_the_great_depression_desc: "A Grande Depressão teve um efeito devastador sobre [INS.GetNameDef]. Com nossa economia baseada principalmente em exportações, o protecionismo mundial nos sufocou. Agora que o comércio global parece prestes a reabrir, devemos buscar novos mercados e trabalhar para restabelecer nossas antigas rotas comerciais."
 INS_first_come_first_serve: "Quem chega primeiro, leva"
 INS_first_come_first_serve_desc: "Embora o protecionismo da Grande Depressão esteja diminuindo, o aumento da produção e a supervalorização do florim deixaram o mercado de exportação neerlandês em ruínas, já que nossos antigos parceiros comerciais no Ocidente recorreram à América do Sul para suprir sua demanda. Em vez de correr atrás deles, podemos aproveitar a oportunidade para expandir para novos mercados na Ásia."
 INS_oil_export: "Aumento da exportação de petróleo"
 INS_oil_export_desc: "Ampliaremos a infraestrutura de petróleo em Sumatra e Calimatã para garantir acordos comerciais com nossos novos parceiros."
 INS_increased_trade_with_japan: "Aumento do comércio com o Japão"
 INS_increased_trade_with_japan_desc: "O Estado [JAP.GetAdjective] tem se tornado um parceiro comercial cada vez mais valioso e ainda não nos decepcionou. Devemos negociar novos acordos comerciais para ampliar a cooperação econômica entre nossas nações e ajudar a superar os efeitos da Grande Depressão. Isso pode desagradar nossos aliados ocidentais, especialmente os Países Baixos, mas se quisermos controlar nosso destino, precisaremos garantir nossas próprias conexões comerciais."
 INS_asian_trade_investments: "Investimentos comerciais na Ásia"
 INS_asian_trade_investments_desc: "A devastação causada pela Grande Depressão demonstrou o quanto dependíamos de nossos parceiros comerciais tradicionais no Ocidente. Como nossa economia é baseada em exportações, é essencial desenvolvermos e expandirmos novos mercados no sudeste asiático para evitar a dependência de um único país."
 INS_asian_trade_investments_tt: "A cada §Y420§! dias, a penalidade de recursos para o mercado causada pela §YGrande Depressão§! será §Gmitigada§! em §Y5%§! até que os modificadores negativos sejam removidos."
 INS_declare_free_trade: "Declarar o livre comércio"
 INS_declare_free_trade_desc: "Não devemos nos alinhar exclusivamente a um único país, mas sim permitir que o mercado decida naturalmente o que é melhor para [INS.GetNameDef]."
 INS_japanese_export_contracts: "Um contrato comercial para a todos governar"
 INS_japanese_export_contracts_desc: "Negociaremos um grande acordo comercial com [JAP.GetNameDef], vendendo toda a borracha em [1049.GetName] e [672.GetName]. Embora o preço seja baixo, teremos certeza de que todo o estoque será vendido."
 INS_realign_supply_chains: "Reorganizar as cadeias de suprimentos"
 INS_realign_supply_chains_desc: "Embora o protecionismo da Grande Depressão esteja diminuindo, o aumento da produção e a supervalorização do florim deixaram o mercado de exportação neerlandês em ruínas, já que nossos antigos parceiros comerciais no Ocidente recorreram à América do Sul para suprir sua demanda. Precisamos tomar medidas para convencer nossos aliados a retomar o comércio conosco."
 INS_invite_foreign_companies: "Apoiar empreendimentos petrolíferos americanos"
 INS_invite_foreign_companies_desc: "Desde 1930, a Standard Oil California opera em nosso país por meio de sua subsidiária neerlandesa, a Nederlandsche Pacific Petroleum Maatschappij. Suas prospecções em Riau mostram grande potencial. Devemos apoiar suas operações de exploração sempre que possível, pois uma grande descoberta aumentará nossa receita e incentivará outras empresas internacionais a investirem em nosso país."
 INS_expand_sea_routes: "Expandir rotas marítimas"
 INS_expand_sea_routes_desc: "Nosso país é rico em recursos naturais, mas nossa indústria de extração é muito especializada e não temos a infraestrutura necessária para extrair certos minerais raros, como crômio e tungstênio. Se quisermos ampliar nossa capacidade de produção militar, será necessário importá-los. Para aproveitar plenamente nossa rede comercial em expansão, devemos aumentar a capacidade de nossa frota mercante."
 INS_ship_contracts: "Assegurar contratos navais"
 INS_ship_contracts_desc: "Será necessário desenvolver uma Marinha para manter nossas rotas comerciais em caso de guerra. Podemos utilizar nossas novas relações comerciais para obter contratos navais."
 # <Industry Branch - Sumatra>
 INS_developing_sumatra: "Desenvolver Sumatra"
 INS_developing_sumatra_desc: "Sumatra é a ilha mais rica em recursos do arquipélago, mas sua infraestrutura é tão precária que grande parte dos recursos extraídos sequer chega à Batávia. O transporte depende de estradas de terra desconectadas e ferrovias fragmentadas, totalmente inadequadas para nossos planos. Isso não pode continuar assim."
 INS_sumatra_railway: "A ferrovia de Sumatra"
 INS_sumatra_railway_desc: "Como parte de nossos esforços contínuos para desenvolver a infraestrutura de Sumatra, devemos construir uma grande ferrovia que se estenda do norte de Atjeh até o porto mais ao sul da ilha, que tem uma conexão rápida com a Batávia por navio. Assim, os recursos precisarão apenas ser levados até a estação ferroviária mais próxima, de onde poderão ser transportados para a Batávia em poucos dias."
 INS_develop_borneo: "Desenvolver Calimatã"
 INS_develop_borneo_desc: "Calimatã possui grande potencial de riqueza, mas a ilha ainda é pouco desenvolvida e sua população sofre com a pobreza. O transporte de cargas depende muito dos rios e vias fluviais, enquanto as comunicações de longa distância são prejudicadas pela falta de eletricidade. Ao construir linhas de energia e estradas, poderemos preparar o caminho para futuras prospecções e extração de recursos."
 INS_kalimantan_mic: "Indústria militar de Calimatã"
 INS_kalimantan_mic_desc: "Nossos esforços para desenvolver a infraestrutura em Calimatã começaram a dar resultados. A expansão da rede elétrica e das comunicações nos aproximou de comunidades antes fora do alcance do governo. Podemos aproveitar essa oportunidade para ampliar nossa produção militar, construindo novas fábricas na região e empregando essa nova força de trabalho."
 INS_pontianak_to_balikpapan: "De Pontianak a Tanjung Selor"
 INS_pontianak_to_balikpapan_desc: "A ideia de uma ferrovia em Calimatã existe há anos, mas o terreno difícil e pouco explorado no interior da ilha torna o projeto desafiador. A única solução viável é uma ferrovia em formato de U, ligando uma costa à outra. O custo será elevado, mas o investimento trará retorno a longo prazo."
 INS_develop_sulawesi: "Desenvolver Sulawesi"
 INS_develop_sulawesi_desc: "Sulawesi é o centro do arquipélago e, portanto, uma localização estratégica importante. Devemos construir estradas, linhas de energia e sistemas de comunicação para garantir que a região possa ser utilizada como um centro militar em caso de guerra."
 # <Industry Branch - Bangka Project>
 INS_the_bangka_project: "O Projeto Bangka"
 INS_the_bangka_project_desc: "As ilhas Bangka-Belitung, embora pequenas, são um pilar da economia indonésia graças aos seus depósitos de bauxita. Precisamos construir estradas, portos e ferrovias em Bangka-Belitung para garantir que possamos explorar todas as riquezas minerais das ilhas."
 INS_aluminium_factory: "Fábrica de alumínio de Pangkalpinang"
 INS_aluminium_factory_desc: "Nossa extração de bauxita bruta está crescendo, mas a falta de produção doméstica de alumínio limita nossos lucros. Como capital provincial das ilhas Bangka-Belitung, Pangkalpinang é o local ideal para estabelecermos nossas próprias fábricas. Isso nos permitirá eliminar intermediários e maximizar nossos ganhos."
 INS_bauxite_export: "Intensificar a exportação de Bauxita"
 INS_bauxite_export_desc: "A conclusão do Projeto Bangka nos proporcionou mais bauxita bruta do que conseguimos utilizar. Vender toda essa produção pode ser difícil, mas podemos oferecer preços significativamente mais baixos do que os concorrentes, garantindo a venda de cada grama. Graças ao grande volume de bauxita disponível, isso ainda resultará no aumento proporcional dos lucros em relação às exportações atuais."
 INS_tin_mining: "Investimentos na mineração de estanho"
 INS_tin_mining_desc: "A mineração de estanho nas ilhas Bangka-Belitung existe desde antes da chegada dos europeus, por isso não é surpresa que o setor esteja necessitando de modernização. A reestruturação das capacidades produtivas será custosa e a indústria de estanho atual ficará inoperante por algum tempo durante esse processo. Ainda assim, o potencial de lucro a longo prazo é significativo."
 in_240_days_tt: "§YEm 240 dias:§!\n"
 INS_tin_to_usa: "Vender estanho para [USA.GetNameDef]"
 INS_tin_to_usa_desc: "O Estado [USA.GetAdjective] possui inúmeras empresas e instituições governamentais que precisam de estanho. Agora que contamos com uma operação de mineração estruturada, temos a oportunidade de obter grandes lucros."
 INS_tin_to_japan: "Vender estanho para [JAP.GetNameDef]"
 INS_tin_to_japan_desc: "O Estado [JAP.GetAdjective] possui diversas embarcações consideradas obsoletas, mas ainda adequadas para a Marinha d[INS.GetNameDef]. Devemos utilizar nossa receita da produção de estanho para adquiri-las."
 INS_tin_to_japan_tt: "O Estado [JAP.GetAdjective] enviará §Y9§! contratorpedeiros antigos para nós."
 INS_new_bauxite_routes: "Novas rotas de bauxita"
 INS_new_bauxite_routes_desc: "Nossa estratégia de reduzir preços para aumentar o volume de exportação de bauxita foi bem-sucedida, elevando significativamente nossa renda total. Contudo, não devemos parar aqui. Precisamos expandir nossas redes comerciais, otimizar nossas cadeias de abastecimento e buscar novas oportunidades para maximizar os retornos."
 INS_bangka_bauxite_export_flag: "Concluiu o foco §Y$INS_bauxite_export$§!:"
 INS_not_industry: "Plano para o futuro"
 INS_not_industry_desc: "Java é o coração da nação, lar da maior parte da população e sede do governo. Antes de industrializar a ilha, devemos preparar o terreno. Levantamentos de terras, alocações de zonas e liberações de áreas garantirão que a construção das fábricas aconteça nos locais de maior impacto."
 INS_construction_focus: "Crescimento industrial"
 INS_construction_focus_desc: "O capital estrangeiro está chegando, as receitas de exportação estão crescendo e, pela primeira vez em anos, há recursos reais para investir na indústria nacional. Devemos aproveitar o momento e construir enquanto as condições nos favorecem."
 # <Industry Branch - Java>
 INS_developing_java: "Expandir a infraestrutura javanesa"
 INS_developing_java_desc: "Java é, de longe, a ilha mais industrializada do arquipélago e a principal fonte de nossa riqueza. No entanto, cidades como a Batávia estão ficando cada vez mais superlotadas devido ao crescimento populacional. Devemos expandir essas cidades com novas moradias, zonas comerciais, bondes, ferrovias e fábricas para acompanhar esse crescimento."
 INS_prioritize_sugar_economy: "Priorizar a economia do açúcar"
 INS_prioritize_sugar_economy_desc: "Devemos reduzir o orçamento governamental destinado ao desenvolvimento industrial da Batávia, uma vez que a cidade já é muito mais industrializada do que qualquer outra do arquipélago. Em vez disso, devemos investir na criação de diversas plantações de palma pelo país. Essas plantações produzirão açúcar de palmeira, um produto com alta demanda internacional."
 INS_all_cards_into_industry: "Apostar tudo na indústria"
 INS_all_cards_into_industry_desc: "A industrialização teve um impacto profundo na economia da [1058.GetName]. Se industrializarmos toda a ilha, com suas dezenas de milhões de habitantes, poderemos nos tornar uma potência de influência global."
 INS_expand_batavia_technical_institute: "Expandir o Instituto de Tecnologia da Batávia"
 INS_expand_batavia_technical_institute_desc: "Com a expansão do Instituto de Tecnologia da Batávia, mais estudantes terão acesso à educação e nosso desenvolvimento tecnológico será impulsionado."
 INS_quinine_export: "Um acordo mais lucrativo de quinina"
 INS_quinine_export_desc: "O Gabinete de Cinchona, em Amsterdã, praticamente detém o monopólio das exportações de quinina, lucrando muito com a enorme demanda mundial pelo tratamento contra a malária. A maior parte da quinina é obtida nas Índias Orientais, mas recebemos apenas uma pequena fração dos lucros. Devemos usar nossa produção como moeda para negociar um acordo mais justo."
 INS_spend_profits_on_rural: "Investir lucros no desenvolvimento rural"
 INS_spend_profits_on_rural_desc: "Com o novo acordo de quinina firmado, temos a oportunidade de usar a renda adicional para desenvolver a infraestrutura de transporte e comunicação nas áreas rurais, preparando o caminho para a futura industrialização local."
 INS_spend_profits_on_urban: "Investir lucros no desenvolvimento urbano"
 INS_spend_profits_on_urban_desc: "Com o novo acordo de quinina firmado, temos a oportunidade de usar a renda adicional para expandir a indústria manufatureira da Batávia. Isso permitirá diversificar nossa economia e reduzir a dependência da exportação de matérias-primas."
 INS_spend_profits_on_military: "Investir lucros no desenvolvimento militar"
 INS_spend_profits_on_military_desc: "Com o novo acordo de quinina firmado, temos a oportunidade de fortalecer significativamente nosso Exército ao direcionar a renda adicional para a construção e manutenção de novas fábricas de armas em Yogyakarta e Semarang."
 INS_end_to_bloodshed_tt: "A guerra chegará ao fim e novas fronteiras serão definidas com base na ocupação atual. Java, Sumatra e Bornéu serão §Yanexados§! pelo lado que tiver maior controle sobre a região."
 HOL_british_light_support: "O governo [ENG.GetAdjective] concordou em ajudar na revolução"
