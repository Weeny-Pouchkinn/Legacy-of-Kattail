 AST_uap_popularity_decrease_5: "§Y$AST_ruling_party$§! (§Y$AST_uap$§!) Votos: §R-5%§!\n\n"
 AST_alp_popularity_decrease_5: "§Y$AST_ruling_party$§! (§Y$AST_alp$§!) Votos: §R-5%§!\n\n"
 AST_australian_military_forces: "Forças militares australianas"
 AST_australian_military_forces_desc: "Forjadas pelo fogo da Grande Guerra, as forças armadas australianas demonstraram seu valor em terras distantes, mantendo-se firmes em algumas das campanhas mais brutais do conflito. Nos anos seguintes, o Exército teve seu tamanho reduzido e foi reorganizado como uma força defensiva, encarregada principalmente de proteger as ilhas da pátria. As lições arduamente aprendidas no passado permanecem, prontas para serem aplicadas novamente."
 AST_permanant_military_forces: "Forças militares permanentes"
 AST_permanant_military_forces_desc: "A principal força militar da Austrália é a milícia, encarregada de defender o território continental. Contudo, neste período de tensões globais crescentes, é prudente estabelecer um quadro de oficiais e soldados profissionais, muitos dos quais ganharam experiência durante a Grande Guerra. Mesmo servindo inicialmente em capacidade de reserva, essa força proporcionaria permanência e um nível padronizado de treinamento."
 AST_invoke_the_1903_defence_act: "Invocar a Lei de Defesa de 1903"
 AST_invoke_the_1903_defence_act_desc: "Tradicionalmente, a Austrália dependeu de sua milícia para a defesa nacional. Contudo, em tempos de ameaça significativa, podemos invocar a Lei de Defesa de 1903. Ela nos permite convocar mão de obra adicional para fins defensivos."
 AST_lithgow_small_arms_factory: "Fábrica de armas leves de Lithgow"
 AST_lithgow_small_arms_factory_desc: "Fundada em 1912, a Fábrica de Armas Leves de Lithgow foi criada para reduzir a dependência de armas e equipamentos britânicos em tempos de guerra. Com as tensões globais novamente em ascensão, devemos expandir a produção para atender às necessidades crescentes de nossas forças armadas."
 AST_dingo_scout_car: "Carro de Observação Dingo"
 AST_dingo_scout_car_desc: "A Austrália não tem uma tradição forte de desenvolvimento de veículos blindados, mas nossas forças armadas pedem cada vez mais reforços nessa área. Assim, devemos adotar com mais rigor projetos nacionais, como o Carro de Observação Dingo."
 AST_volunteer_defence_corps_taog: "Corpo de defesa voluntário"
 AST_volunteer_defence_corps_taog_desc: "Criado como uma força semelhante à Guarda Nacional britânica, o Corpo de Defesa Voluntário é uma milícia cidadã não remunerada composta por aqueles inelegíveis para o serviço regular. Apesar dessas limitações, seu conhecimento do terreno local os torna bem adequados ao combate de guerrilha caso o pior aconteça."
 AST_war_carriers: "Carregadores nativos"
 AST_war_carriers_desc: "A logística vence guerras e grande parte do terreno em que a Austrália opera é pouco adequado ao transporte convencional, como caminhões ou trens. Em vez disso, devemos recorrer à mão de obra local, bem adaptada às condições e familiarizada com caminhos escondidos e atalhos."
 AST_anzac_spirit: "Espírito do ANZAC"
 AST_anzac_spirit_desc: "O Corpo do Exército da Austrália e Nova Zelândia conquistou uma reputação formidável durante a Grande Guerra, empregando grande esforço e muito sangue em busca da vitória para o império. Suas qualidades eram evidentes para todos: resistência, coragem, engenhosidade e bom humor, combinados a uma rebeldia casual diante do perigo e da adversidade."
 AST_lee_enfield_no1_mark3: "Lee-Enfield No.1 Mk III*"
 AST_lee_enfield_no1_mark3_desc: "Aquele pequeno asterisco importa: o Lee-Enfield No. 1 Mk III* indica modificações de guerra para uma produção mais rápida e barata. Como a demanda supera até esses ganhos, devemos adotar um \"esquema distribuído\", com componentes produzidos por empresas menores e montados em Lithgow para aumentar a produção."
 AST_new_south_wales_government_railways: "New South Wales Government Railways"
 AST_new_south_wales_government_railways_desc: "As oficinas da New South Wales Government Railways oferecem uma capacidade exclusiva: grandes componentes de aço fundidos em uma única peça. Como uma das poucas nações da Comunidade capazes de produzir cascos e torretas de tanques totalmente fundidos, devemos dar bom uso a essa capacidade."
 AST_second_australian_imperial_force: "Segunda Força Imperial Australiana"
 AST_second_australian_imperial_force_desc: "A Austrália mobilizou a Primeira Força Imperial Australiana durante a Grande Guerra, enviando tropas ao exterior para lutar. Com a guerra novamente ameaçando engolir o mundo, devemos formar uma Segunda Força Imperial para demonstrar o poderio australiano no exterior."
 AST_expeditionary_leader: "O §Ygeneral§! terá a característica §YLíder expedicionário§!, que melhora suas capacidades no exterior, mas limita o número de divisões que ele pode comandar."
 AST_expeditionary_leader_plural: "Ambos os §Ygenerais§! terão a característica de §YLíder expedicionário§!, que melhora suas capacidades no exterior, mas limita o número de divisões que podem comandar."
 AST_larrikinism: "Larrikinismo"
 AST_larrikinism_desc: "Definido como \"uma pessoa inculta, arruaceira, mas de bom coração\", o larrikinismo passou a representar a cultura australiana: resistência rústica, irreverência diante da autoridade e desafio bem-humorado frente ao perigo. Os soldados australianos ganharam reputação na Grande Guerra por enfrentar a adversidade com resiliência e levar tudo na esportiva."
 AST_diggers: "Diggers"
 AST_diggers_desc: "\"Cavem, cavem, cavem, até estarem seguros\", veio a ordem ao general William Birdwood quando os ANZACs desembarcaram em Galípoli, palavras que se tornaram um sinônimo do jeito australiano de guerrear. Ainda assim, o espírito dos Diggers é mais profundo, unindo soldados australianos e neozelandeses pela \"camaradagem\": o laço duradouro de lutar ao lado de seus camaradas e por eles."
 AST_owen_gun: "Submetralhadora Owen"
 AST_owen_gun_desc: "A inovadora submetralhadora Owen, desenvolvida em nosso país, conquistou uma reputação de confiabilidade robusta, assim como nossos soldados. Conforme nossas forças lutam pelo mundo, devemos adotar essa arma não apenas como símbolo da engenhosidade e do design australianos, mas do nosso próprio espírito na guerra."
 AST_department_of_supply_and_development_taog: "Departamento de Abastecimento e Desenvolvimento"
 AST_department_of_supply_and_development_taog_desc: "À medida que as exigências da guerra levam nossos sistemas de produção e logística ao limite, devemos centralizar nossos esforços sob um órgão dedicado a coordená-los e sustentá-los."
 AST_sentinel_tank_development: "Desenvolvimento de tanque Sentinel"
 AST_sentinel_tank_development_desc: "Historicamente, dependemos de modelos de tanques importados, mesmo quando os produzimos internamente. Devemos aproveitar as lições aprendidas com essas máquinas e, com uma dose de inovação australiana, desenvolver nosso próprio tanque, adaptado às nossas capacidades e recursos."
 AST_establish_training_camps: "Estabelecer campos de treinamento"
 AST_establish_training_camps_desc: "Como na Grande Guerra, a Segunda Força Imperial poderá ser chamada a lutar em qualquer lugar do mundo. Portanto, devemos desenvolver programas abrangentes de treinamento para preparar nossos soldados para qualquer ambiente, dos desertos da África do Norte às selvas do Pacífico Sul."
 AST_jungle_tanks_if_sentinel_tank_development: "Se tivermos concluído \"Desenvolvimento de tanque Sentinel\":"
 jungle_heavy_tanks: "Tanques pesados de selva"
 AST_anti_malaria_campaign: "Campanha antimalária"
 AST_anti_malaria_campaign_desc: "Nossas forças podem ser chamadas a lutar nas selvas do Pacífico, onde uma ameaça mais mortal do que as balas inimigas as espera: a malária. Devemos agir de forma decisiva para proteger nossas tropas desse inimigo invisível."
 AST_defence_citizen_military_forces_act: "Lei de Defesa das Forças Militares Civis"
 AST_defence_citizen_military_forces_act_desc: "Até agora, apenas soldados profissionais voluntários podiam ser enviados ao exterior. À medida que o conflito continua a se agravar, devemos estabelecer a estrutura legal que permita às unidades de milícia servir fora do país, se necessário."
 AST_call_that_a_knife: "Sem Problemas!"
 AST_call_that_a_knife_desc: "\"Isso não é uma faca... ISSO é uma faca!\" Um pouco de fanfarronice e humor faz muita diferença. Nossos soldados enfrentam o perigo com confiança, garra e uma boa dose de atitude."
 AST_army_inventions_directorate_taog: "Diretoria de Invenções do Exército"
 AST_army_inventions_directorate_taog_desc: "Uma das poucas vantagens da guerra, se é que se pode chamar assim, é o ritmo acelerado da inovação tecnológica impulsionada pela necessidade. Devemos estabelecer uma organização centralizada para desenvolver, refinar e aproveitar esses avanços."
 AST_yeramba: "Yeramba"
 AST_yeramba_desc: "Com base no sucesso de veículos desenvolvidos na Austrália, como o Sentinel, demos o próximo passo com o Yeramba, uma poderosa adição nova ao nosso arsenal. Com um canhão de 25 libras montado sobre um chassi de tanque, ele oferece poder de fogo móvel e devastador contra nossos inimigos."
 AST_alice_springs: "Alice Springs"
 AST_alice_springs_desc: "O sertão australiano é grande... grande de verdade. Em seu coração fica a pequena cidade de Alice Springs, que pode servir como um centro logístico para operações por toda a Austrália. Devemos desenvolvê-la e estabelecer uma base do Exército para treinar tropas prontas para qualquer ambiente."
 AST_australian_regular_army: "Exército regular australiano"
 AST_australian_regular_army_desc: "Aprendemos muitas lições, das praias de Galípoli aos desertos da África do Norte, das montanhas da Grécia às selvas do sudeste asiático. Essa experiência conquistada a duras penas forjou uma força militar mais flexível e adaptável do que qualquer outra."
 AST_no1_flying_training_school: "Escola de Treinamento de Voo N° 1"
 AST_no1_flying_training_school_desc: "Fundada em 1921 com a formação da Força Aérea Real Australiana, a Escola de Treinamento de Voo foi aberta e fechada conforme a demanda por pessoal aéreo oscilava. Com as tensões globais em ascensão, devemos reabri-la para treinar uma nova geração de pilotos e tripulações aéreas."
 AST_empire_air_training_scheme_taog: "Programa imperial de treinamento aéreo"
 AST_empire_air_training_scheme_taog_desc: "O Plano de Treinamento Aéreo da Comunidade Britânica oferece financiamento e conhecimento significativos a uma nação da Comunidade para treinar um grande número de pilotos e tripulações aéreas. A disputa para sediá-lo é acirrada, com Austrália e Canadá como principais concorrentes. Apresentamos nossa própria candidatura sob o Programa Imperial de Treinamento Aéreo."
 AST_volunteer_air_corps: "Corpo Voluntário de Observadores Aéreos"
 AST_volunteer_air_corps_desc: "O espaço aéreo australiano é vasto, muito além do alcance das unidades oficiais sozinhas. Em vez disso, devemos contar com voluntários locais, guarnecendo milhares de postos de observação espalhados pelo país para vigiar nossos céus."
 AST_improved_ground_crews: "Equipes de solo melhoradas"
 AST_improved_ground_crews_desc: "Para cada piloto, há toda uma equipe de solo necessária para garantir a manutenção adequada das aeronaves, a coordenação de voo e as operações de base. Sem falar nos navegadores, artilheiros e bombardeadores que os acompanham no ar. Devemos estabelecer instalações de treinamento adequadas para garantir que nossa Força Aérea opere com máxima eficiência."
 AST_advanced_pilot_training: "Treinamento avançado de pilotos"
 AST_advanced_pilot_training_desc: "À medida que as aeronaves se tornam mais complexas, velozes e avançadas, a habilidade de nossos pilotos deve melhorar proporcionalmente para aproveitar ao máximo essas tecnologias."
 AST_advanced_pilot_training_tt: "§G+10%§! de velocidade de ganho de maestria para §Ydoutrinas aéreas§!."
 AST_commonwealth_aircraft_corporation_taog: "Corporação de Aeronaves da Comunidade"
 AST_commonwealth_aircraft_corporation_taog_desc: "Com o interesse crescente na guerra aérea, não podemos ficar para trás. Entusiastas e inovadores civis já começaram a perceber o potencial da indústria aeronáutica; ao lhes oferecer financiamento inicial, poderemos fomentar e expandir esse setor emergente."
 AST_reestablish_central_flying_school: "Restabelecer a Escola de Aviação Central"
 AST_reestablish_central_flying_school_desc: "Outra das escolas de aviação da Austrália, operando ao lado da Escola de Treinamento de Voo N° 1, a Escola de Aviação Central ajudará a atender às crescentes exigências de uma Força Aérea moderna. Com as tensões em ascensão, devemos garantir que nosso pessoal tenha as instalações de que precisa."
 AST_aerodrome_of_democracy_democracy: "Aeródromo da democracia"
 AST_aerodrome_of_democracy_fascism: "Aeródromo da dominação"
 AST_aerodrome_of_democracy_communism: "Aeródromo da emancipação"
 AST_aerodrome_of_democracy_neutrality: "Aeródromo da força"
 AST_aerodrome_of_democracy: "[GET_AERODOME_NAME]"
 AST_aerodrome_of_democracy_desc: "Tendo alcançado a vanguarda da capacidade aeronáutica, a Força Aérea Australiana conquistou o título \"[GET_AERODOME_NAME]\". Nossos aviadores travam combate aéreo pelo mundo, enquanto nossos bombardeiros lançam uma sombra mortal sobre as indústrias de nossos inimigos."
 AST_government_aircraft_factories: "Fábricas governamentais de aeronaves"
 AST_government_aircraft_factories_desc: "Dada a nossa distância da Europa, não podemos depender das fontes tradicionais de fornecimento de aeronaves em tempos de guerra. Portanto, é essencial desenvolvermos nossa própria capacidade de fabricação nacional, permitindo a produção de fuselagens e motores de aeronaves de acordo com nossas próprias especificações."
 AST_death_from_down_under_taog: "Morte vinda do sul"
 AST_death_from_down_under_taog_desc: "Dos confins do Hemisfério Sul, forjamos uma Força Aérea sem igual. Nossas aeronaves cruzam o globo, atacando com precisão e força devastadora – onde quer que nossos inimigos se escondam, a morte virá do sul."
 AST_ride_the_lightning: "Domar o relâmpago"
 AST_ride_the_lightning_desc: "Nossos pilotos de caça são a vanguarda do nosso poder aéreo: rápidos, agressivos e implacáveis. Cavalgando o relâmpago para a batalha, eles tomam o controle dos céus, interceptam aeronaves inimigas e garantem que onde quer que nossas forças avancem, a superioridade aérea siga logo atrás."
 AST_the_gathering_storm: "A tempestade iminente"
 AST_the_gathering_storm_desc: "Uma tempestade se forma no horizonte. Nossa crescente força aérea traz pressão cada vez maior vinda de cima, atingindo o inimigo onde ele é mais fraco e apoiando nosso avanço. O que começa como um estrondo distante logo se transformará em uma tempestade implacável de destruição."
 AST_hear_the_thunder: "O som do trovão"
 AST_hear_the_thunder_desc: "Você consegue ouvir o som do trovão? Vindos das terras do sul, nossos bombardeiros estratégicos levam o poder da Austrália pelo mundo. Quando os céus rugirem e o chão tremer, nossos inimigos saberão: a tempestade chegou, e ela traz destruição."
 AST_department_of_aircraft_production: "Departamento de Produção de Aeronaves"
 AST_department_of_aircraft_production_desc: "A rápida expansão da Força Aérea Real Australiana impôs uma pressão significativa sobre nossa capacidade de produção. Devemos pensar com mais ambição, expandindo e coordenando nossa base industrial para atender à demanda e garantir que possamos escurecer os céus com nossas aeronaves."
 AST_royal_australian_navy: "Marinha Real Australiana"
 AST_royal_australian_navy_desc: "Formada após a federação pela união das frotas coloniais, a Marinha Real Australiana serviu em quase todos os teatros de operações da Grande Guerra. Desde então, foi reduzida devido ao financiamento limitado; mas, com as tensões globais em ascensão, chegou a hora de a frota retornar aos mares."
 AST_coast_watchers: "Vigilantes da costa"
 AST_coast_watchers_desc: "Enquanto a maioria de nossas forças permanece concentrada no interior, nossos acessos ao norte oferecem uma rede vital de alerta antecipado. Ao posicionar agentes de inteligência locais nessas ilhas afastadas, poderemos detectar movimentos aéreos e navais inimigos muito antes que ameacem as costas australianas."
 AST_marines: "Fuzileiros navais"
 AST_marines_desc: "Como a maior ilha em um oceano de ilhas, devemos garantir as capacidades anfíbias necessárias para projetar poder além de nossas praias. Caso precisemos passar da defesa ao ataque, essas forças permitirão operações eficazes de salto entre ilhas."
 AST_naval_auxiliary_patrol_taog: "Patrulha auxiliar naval"
 AST_naval_auxiliary_patrol_taog_desc: "Com nossas forças profissionais ocupadas em outras frentes, podemos recorrer a voluntários locais entusiasmados para proteger nossos portos e instalações costeiras. Seu conhecimento íntimo das vias marítimas locais os torna inestimáveis, e ninguém suspeitaria que um pescador local estivesse a nosso serviço."
 AST_cockatoo_island_shipyards_taog: "Estaleiros da Ilha Cockatoo"
 AST_cockatoo_island_shipyards_taog_desc: "Os estaleiros da Ilha Cockatoo há muito servem como centro imperial de reparo e manutenção, apoiando operações da Marinha Real no exterior. Agora, como pedra angular da Marinha Real Australiana, devemos expandir sua capacidade para atender às exigências crescentes de nossa frota e sustentar nossa força naval."
 AST_kangaroo_point_dry_dock_taog: "Doca seca de Kangaroo Point"
 AST_kangaroo_point_dry_dock_taog_desc: "Embora a Evans Deakin & Company seja principalmente uma firma de engenharia, ela identificou corretamente a necessidade de ampliar a capacidade de construção naval à medida que as tensões globais aumentam, voltando seus olhos para Kangaroo Point. Devemos facilitar sua tomada dessas terras para apoiar o crescimento contínuo de nossa frota."
 AST_scrap_iron_flotilla_taog: "Flotilha de sucata"
 AST_scrap_iron_flotilla_taog_desc: "Dispensados pelos críticos como ultrapassados e gastos, vários de nossos contratorpedeiros mais antigos ainda assim foram reunidos em uma única formação. Embora careçam do prestígio de embarcações modernas, esses navios representam um uso engenhoso daquilo que já possuímos."
 AST_cruising_for_a_bruising: "Navegando rumo ao conflito"
 AST_cruising_for_a_bruising_desc: "Nossa Marinha há muito faz uso habilidoso de cruzadores, e essa é uma tradição que vale a pena expandir. Rápidos, versáteis e com grande poder de ataque, esses navios logo ganharão reputação mundial: qualquer inimigo que cruzar seu caminho sairá seriamente machucado."
 AST_strike_from_down_under: "Ataque vindo do sul"
 AST_strike_from_down_under_desc: "Sob as ondas eles deslizam, sem estrondo de trovão; e, se o encontrarem, seus navios saquearão. Você ouviu, ouviu falar dos submarinos do sul? É melhor correr, ou sua frota vai parar no fundo azul... Ééééé!"
 AST_hmas_sydney: "HMAS Sydney"
 AST_hmas_sydney_desc: "A era dos encouraçados chegou ao fim. O futuro do poder naval pertence aos céus acima da frota, e a Austrália não ficará para trás. Após anos reconstruindo e modernizando nossa Marinha, estamos prontos para dar o passo final: um porta-aviões que definirá o poder marítimo australiano por toda uma geração."
 AST_conscription_level_allowed_tt: "Vontade política para mais alistamento (procure o ícone de mão de obra nos focos)"
 AST_conscription_level_allowed_limited_conscription_tt: "Desbloqueia um nível adicional da §Ylei de alistamento§!, permitindo §YAlistamento limitado§!"
 AST_conscription_level_allowed_extensive_conscription_tt: "Desbloqueia um nível adicional da §Ylei de alistamento§!, permitindo §YAlistamento estendido§!"
 AST_conscription_level_allowed_service_by_requirement_tt: "Desbloqueia um nível adicional da §Ylei de alistamento§!, permitindo §YServiço militar obrigatório§!"
 AST_conscription_level_allowed_all_adults_serve_tt: "Desbloqueia um nível adicional da §Ylei de alistamento§!, permitindo §YTodos os adultos devem servir§!"
 AST_conscription_level_allowed_scraping_the_barrel_tt: "Desbloqueia um nível adicional da §Ylei de alistamento§!, permitindo §YAté o último recurso§!"
 AST_conscription_law_so_far: "[CONSCRIPTION_LAW_SO_FAR]"
 ############
 ### MISC ###
 ############
 add_random_stat_to_general_tt: "Adiciona um atributo de habilidade aleatório extra a este general"
 generic_unlock_industrial_concern_tt: "Disponível como firma industrial: \n"
 NZL_rail_standardization_tt: "§Y[?NZL_train_var]§! unidades da §Y$NZL_train_equipment_1$§! são adicionadas ao estoque nacional."
 NZL_ministry_of_public_works: "Ministério de Obras Públicas"
 NZL_ministry_of_public_works_desc: "Por meio de planejamento coordenado e investimento disciplinado, estradas, ferrovias e projetos de energia avançarão de acordo com uma estratégia nacional coerente, em vez de esforços fragmentados."
 NZL_abolish_the_railways_board: "Abolir o Conselho das Ferrovias"
 NZL_abolish_the_railways_board_desc: "O Conselho das Ferrovias Governamentais tem sido ineficaz na modernização da malha ferroviária. Chegou a hora de abolir essa aberração e devolver as ferrovias ao controle ministerial."
 NZL_rail_standardization: "Padronização de locomotivas"
 NZL_rail_standardization_desc: "O Estado [ROOT.GetAdjective] conta com várias oficinas pelo país que fabricaram locomotivas de qualidade variável. Para tornar o sistema ferroviário mais eficiente, estabeleceremos uma série de locomotivas padronizadas, cada uma com um propósito específico."
 NZL_full_employment: "Pleno emprego"
 NZL_full_employment_desc: "Por meio de obras públicas contínuas, planejamento cuidadoso e expansão industrial constante, o desemprego enfim deu lugar à oportunidade. As oficinas ociosas dos anos da Depressão estão novamente ativas e a mão de obra da nação está plenamente engajada em atividades produtivas. Após termos restaurado a confiança e a estabilidade, não estamos apenas recuperados, mas fortalecidos para os desafios à frente."
 NZL_direct_the_coal_industry: "Direcionar a indústria do carvão"
 NZL_direct_the_coal_industry_desc: "Conforme o carvão se torna cada vez mais vital para nossas ferrovias, indústrias e usinas de energia, o governo deve intervir para coordenar a produção e a distribuição no interesse nacional."
 NZL_establish_the_ncb: "Estabelecer o Conselho Nacional do Carvão"
 NZL_establish_the_ncb_desc: "Ao estabelecer um Conselho Nacional do Carvão, poderemos colocar as minas dispersas do país sob direção coordenada e garantir um abastecimento estável de combustível para ferrovias, indústrias e geração de energia. A supervisão central nos permitirá racionalizar a produção, melhorar a eficiência e assegurar que as necessidades estratégicas tenham precedência sobre interesses privados."
 NZL_electrification: "Expandir a geração de energia"
 NZL_electrification_desc: "Ao aproveitar nossos rios e expandir a geração hidrelétrica, poderemos lançar as bases de uma força industrial duradoura. Novas barragens e obras de transmissão aumentarão a capacidade por todo o país, garantindo que fábricas, ferrovias e portos tenham a energia de que precisam."
 NZL_bureau_of_industry_taog: "$NZL_bureau_of_industry$"
 NZL_bureau_of_industry_taog_desc: "$NZL_bureau_of_industry_desc$"
 NZL_wairarapa_sheep_farms_taog: "$NZL_wairarapa_sheep_farms$"
 NZL_wairarapa_sheep_farms_taog_desc: "$NZL_wairarapa_sheep_farms_desc$"
 NZL_national_roads_board_taog: "$NZL_national_roads_board$"
 NZL_national_roads_board_taog_desc: "$NZL_national_roads_board_desc$"
