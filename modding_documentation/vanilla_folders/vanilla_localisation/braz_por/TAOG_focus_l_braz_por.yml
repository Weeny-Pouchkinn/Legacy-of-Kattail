 # <Empower the Volksraad>
 INS_the_jewel_in_the_crown: "A joia da coroa"
 INS_the_jewel_in_the_crown_desc: "As Índias Orientais são a mais brilhante joia da coroa colonial neerlandesa e pretendemos manter esse status. Por meio do Volksraad, nossa voz alcança Haia."
 INSHOL_java: "$HOL_java$"
 INSHOL_java_desc: "$HOL_java_desc$"
 INSHOL_sumatra: "$HOL_sumatra$"
 INSHOL_sumatra_desc: "$HOL_sumatra_desc$"
 INSHOL_borneo_and_the_grote_oost: "$HOL_borneo_and_the_grote_oost$"
 INSHOL_borneo_and_the_grote_oost_desc: "$HOL_borneo_and_the_grote_oost_desc$"
 INSHOL_foundations_of_defense: "$HOL_the_foundations_of_defense$"
 INSHOL_foundations_of_defense_desc: "$HOL_the_foundations_of_defense_desc$"
 INSHOL_investments_in_civ_railways_tt: "Se o Estado §Y[HOL.GetAdjective]§![HOL.GetFlag] concluir o foco:\n         (§Y[INS.GetName]§![INS.GetFlag]: adiciona §Y£autonomy_texticon -250§!)\n   Se o Estado §Y[INS.GetAdjective]§![INS.GetFlag] concluir o foco:\n         adiciona §Y£autonomy_texticon 250§!"
 INSHOL_investments_in_civ_railways: "Investimentos em ferrovias civis"
 INSHOL_investments_in_civ_railways_desc: "Conquistar o apoio da população das Índias exige investimentos em infraestrutura civil. Atualmente, nossas ferrovias são utilizadas principalmente para o transporte de cargas. Devemos adquirir trens de passageiros para operar nas ferrovias já existentes em Java e Sumatra."
 INSHOL_continue_exclusive_rights: "Direitos exclusivos para o Banco De Javasche"
 INSHOL_continue_exclusive_rights_desc: "Nosso crescimento econômico estagnou após o florim das Índias Orientais perder a maior parte de seu valor durante a Grande Depressão. Podemos tentar estabilizar a moeda concedendo ao Banco de Java o direito exclusivo de emissão, como ocorria até 1922."
 INSHOL_peg_indies_guilder_to_dutch_guilder: "Atrelar o florim das Índias ao florim neerlandês"
 INSHOL_peg_indies_guilder_to_dutch_guilder_desc: "Nosso crescimento econômico estagnou após o florim das Índias Orientais perder a maior parte de seu valor durante a Grande Depressão. A solução mais simples é atrelá-lo ao florim neerlandês, uma moeda muito mais estável. Isso também nos aproximará ainda mais de nosso soberano."
 INSHOL_peg_indies_guilder_to_us_dollar: "Atrelar o florim das Índias ao dólar americano"
 INSHOL_peg_indies_guilder_to_us_dollar_desc: "Nosso crescimento econômico estagnou após o florim das Índias Orientais perder a maior parte de seu valor durante a Grande Depressão. Embora possamos atrelá-lo ao florim neerlandês, o dólar americano é uma moeda muito mais estável. Atrelar o florim ao dólar também nos concederá maior independência econômica, nos aproximando do sonho de um governo autônomo."
 indonesia_currency_pegged_to_dollar_modifier: "Florim das Índias atrelado ao dólar americano"
 INS_direct_rule_tt: "Desbloqueia a lei de ocupação §Y$INS_direct_rule_occupation_law$§! nos Estados Principescos indonésios.\nEfeitos:\n     §GAumenta§! fábricas e recursos do estado\n     §RReduz§! o crescimento de conformidade\n     §RAumenta§! o crescimento de resistência"
 INS_local_autonomy_tt: "Desbloqueia a lei de ocupação §Y$INS_local_autonomy_occupation_law$§! nos Estados Principescos indonésios.\nEfeitos:\n     Concede §Ypequenos§! bônus gerais\n     §GAumenta§! o crescimento de conformidade"
 INS_invest_in_batavian_education_req_tt: "Concluiu pelo menos §Y3§! missões do Volksraad com sucesso"
 INS_invest_in_batavian_education_req_2_tt: "Concluiu pelo menos §Y6§! missões do Volksraad com sucesso"
 INSHOL_eventual_autonomy_req_tt: "Concluiu pelo menos §Y4§! missões do Volksraad com sucesso"
 indonesia_volksraad_passed_12: "A bandeira nacional da Indonésia foi oficialmente reconhecida "
 INS_stronghold_java_tt: "Qualquer estado indonésio: não está ocupado pel[ROOT.GetNameDef][ROOT.GetFlag]"
 INSHOL_request_east_timor: "Exigir a devolução do Timor-Leste"
 INSHOL_request_east_timor_desc: "O Timor não deve permanecer sob ocupação portuguesa, pois é um resquício do passado colonial que não podemos mais tolerar. Agora trata-se de um território legítimo da Indonésia e emitiremos uma exigência formal para que Portugal devolva-o imediatamente."
 INS_resist_occupation: "Resistir à ocupação"
 INS_resist_occupation_desc: "O ressentimento de muitos indonésios em relação aos Países Baixos não pode nos levar ao fascismo. Devemos fazer de tudo ao nosso alcance para resistir à invasão japonesa e defender a pátria."
 INS_local_resistance: "Resistência local"
 INS_local_resistance_desc: "Estabeleceremos células de resistência em territórios ainda não ocupados. Assim, caso sejam invadidos, estaremos preparados para retomá-los no momento certo."
 INS_stronghold_java: "Fortaleza em Java"
 INS_stronghold_java_desc: "As Índias constituem um vasto arquipélago, lar de muitos povos e de terrenos extremamente árduos. Tentar defender cada ilha, selva e montanha contra um exército muito maior que o nosso é impossível. Embora não seja fácil abandonar nossos compatriotas, a evacuação de todas as ilhas exceto Java, concentrando ali todo o nosso exército, pode ser a melhor decisão para a nação como um todo."
 INS_silence_nationalists: "Reprimir os simpatizantes nacionalistas"
 INS_silence_nationalists_desc: "A invasão japonesa fez com que os movimentos revolucionários nacionalistas passassem a apoiar os invasores devido a um inimigo comum, os Países Baixos. A instabilidade resultante da invasão fez esses movimentos crescerem em um ritmo sem precedentes. Se não agirmos agora, a situação poderá sair completamente de nosso controle."
 INS_east_indies_exile_government: "Governo no exílio das Índias Orientais"
 INS_east_indies_exile_government_desc: "Infelizmente, apesar de nossos esforços, as Índias caíram. Ainda assim, não podemos perder a esperança. Devemos continuar fazendo de tudo ao nosso alcance com os poucos recursos que restam. Podemos ter perdido a batalha, mas ainda não perdemos a guerra."
 INS_establish_nefis: "Estabelecer o NEFIS"
 INS_establish_nefis_desc: "Criaremos o Serviço de Inteligência das Forças das Índias Orientais Neerlandesas (NEFIS) em conjunto com os Aliados, com sede na Austrália. Por meio dessa agência, conduziremos operações clandestinas para sabotar as forças de ocupação japonesas. Cada pequena vitória nos aproxima do retorno à nossa pátria."
 INS_evacuate_soldiers_to_australia: "Evacuar soldados para a Austrália"
 INS_evacuate_soldiers_to_australia_desc: "Criaremos uma base militar próxima à base do NEFIS no norte da Austrália. Lá, estacionaremos os soldados do KNIL que evitaram a captura durante a ocupação, permitindo que a luta continue."
 INS_australian_weapons: "Armas australianas"
 INS_australian_weapons_desc: "Operações clandestinas não são fáceis de conduzir e precisaremos de equipamento adequado para ter sucesso. Podemos licenciar fábricas australianas e adaptá-las para produzir armas para o NEFIS."
 INS_defenders_of_homeland: "Defensores da pátria"
 INS_defenders_of_homeland_tt: "Este foco será concluído automaticamente se os Defensores da Pátria estiverem estabelecidos."
 INS_resist_occupation_tt: "Este foco será concluído automaticamente se formos invadidos e não nos rendermos."
 INS_defenders_of_homeland_desc: "O governo das Índias caiu e um novo regime tomou seu lugar. Liderados pelos nacionalistas e pelo governo japonês, criaremos um novo Exército superior ao KNIL e venceremos a guerra. Contudo, não há como negar que essa aliança entre nacionalistas e imperialistas é frágil. Será que resistirá ou acabará em derramamento de sangue?"
 INS_embrace_co_prosp_sphere: "Aderir à esfera de coprosperidade"
 INS_embrace_co_prosp_sphere_desc: "O domínio neerlandês finalmente chegou ao fim e, embora tenhamos apenas substituído um soberano por outro, as promessas de prosperidade econômica e pan-asiatismo são bastante atraentes. Continuaremos a ajudar os esforços de guerra japoneses para garantir que os Países Baixos nunca mais tentem voltar à Indonésia."
 INS_seize_oppurtunity: "Aproveitar a oportunidade"
 INS_seize_oppurtunity_desc: "O Estado [JAP.GetAdjective] está enfraquecido e o governo de ocupação mostra sinais de fragilidade. Pela primeira vez em séculos, temos uma chance real de romper definitivamente as amarras que prendem a Indonésia e criar uma nação independente. Se não agirmos agora, não há como prever quando surgirá outra oportunidade."
 INS_japanese_resource_infrastructure: "Financiar o esforço de guerra maior"
 INS_japanese_resource_infrastructure_desc: "Transferir o controle de nossa infraestrutura central de extração de recursos para [JAP.GetNameDef] é uma medida necessária para vencer a guerra, pois é essencial garantir o abastecimento contínuo de suas unidades. Em contrapartida, o Estado [JAP.GetAdjective] também investirá no desenvolvimento de nossa infraestrutura local para aumentar a eficiência das exportações."
 INS_japanese_army_training: "Reformar o Exército"
 INS_japanese_army_training_desc: "Temos muito a aprender com nossos soberanos d[JAP.GetNameDef] e, agora que o KNIL foi dissolvido, devemos criar uma nova força militar instruída pelo Exército Imperial, pronta para defender a Indonésia contra ameaças externas."
 INS_governor_general_de_jonge: "Governador-geral de Jonge"
 INS_governor_general_de_jonge_desc: "Bonifacius Cornelis de Jonge é conhecido por governar com mão de ferro, opondo-se a qualquer forma de nacionalismo e frequentemente ignorando os desejos do Volksraad. Seu domínio sobre as Índias já dura muito tempo e sua experiência remonta à Grande Guerra, quando atuou como Ministro da Guerra das Índias."
 INS_governor_general_tjarda: "Governador-geral Tjarda"
 INS_tjarda_explain_tt: "O mandato de §YBonifacius Cornelis de Jonge§! terminou e §YAlidius Tjarda van Starkenborgh Stachouwer§! foi escolhido como governador substituto em setembro de 1936."
 INS_governor_general_tjarda_desc: "Alidius Tjarda van Starkenborgh Stachouwer tem uma visão para as Índias ligeiramente diferente de seu predecessor. Ele ainda se opõe ao nacionalismo, mas é mais liberal em suas políticas e demonstra maior disposição para ouvir as demandas do Volksraad."
 INS_electrical_investments: "Investimentos no setor de energia"
 INS_electrical_investments_desc: "Toda nação europeia industrializada possui uma rede elétrica robusta para sustentar sua indústria. Se quisermos deixar de depender da exportação de materiais e desenvolver nossa própria indústria manufatureira, teremos que construir uma rede elétrica de alta capacidade que se estenda por toda a ilha de Java."
 INS_reduce_land_taxes: "Reduzir os impostos sobre a terra"
 INS_reduce_land_taxes_desc: "Os altos impostos sobre a propriedade de terra tornaram difícil para os indonésios nativos serem donos de plantações e empresas. Embora isso tenha facilitado nosso monopólio sobre a indústria da borracha, também causou problemas econômicos em todo o país. Deveríamos considerar reduzir esses impostos para os valores anteriores, permitindo que pequenas plantações privadas de borracha possam operar."
 INS_invest_in_batavian_education: "Investimentos em educação na Batávia"
 INS_invest_in_batavian_education_desc: "O Volksraad deixou claro que a vontade do povo indonésio é tornar a educação mais acessível, já que atualmente apenas os indonésios neerlandeses e uma pequena elite indonésia nativa podem arcar com os custos. Para atender à moção do Volksraad, devemos construir várias escolas primárias e secundárias na Batávia e arredores."
 INS_javanese_education_investments: "Investimentos na educação javanesa"
 INS_javanese_education_investments_desc: "Além do projeto de construção de escolas primárias e secundárias em andamento, poderíamos erguer uma faculdade comunitária e escolas técnicas especializadas, tornando o ensino superior muito mais acessível às famílias de classe média."
 INS_allow_local_autonomy: "Permitir a autonomia local"
 INS_allow_local_autonomy_desc: "O sistema de Vorstenlanden, que concede autogovernança aos Estados Principescos, tem facilitado o controle dos movimentos nacionalistas e aumentado a estabilidade da nação como um todo. Deveríamos ampliar ainda mais o nível de autonomia concedido, permitindo que o governo se concentre em questões mais relevantes."
 INS_direct_rule: "Governo direto"
 INS_direct_rule_desc: "O sistema de Vorstenlanden tornou a administração mais complicada ao conceder autogovernança aos Estados Principescos, demandando mais burocracia e desperdiçando tempo. É hora de abolir esse sistema e impor o governo direto sobre todo o arquipélago."
 INS_seize_oppurtunity_tt: "O governo §Y[JAP.GetFlag][JAP.GetAdjective]§! foi forçado a recuar e controla menos de §Y[?var:temp_states_plus_more]§! estados. (Atualmente: §Y[?var:JAP.num_controlled_states]§!)"
 INS_seize_oppurtunity_refuse_warn_tt: "§RA revolução nacional começará, podendo levar a uma guerra com [HOL.GetNameDef]§!"
 INS_economic_stabilization: "Estabilização econômica"
 INS_economic_stabilization_desc: "A Grande Depressão e o protecionismo global deixaram nossa economia debilitada, e muitos indonésios que trabalhavam no setor de matérias-primas ficaram desempregados. Precisamos adotar medidas drásticas e criar um programa de trabalho no qual cidadãos ociosos consigam um emprego."
 INS_restore_order_in_indies: "Restaurar a ordem nas Índias"
 INS_restore_order_in_indies_desc: "O crescente movimento nacionalista nas Índias desestabilizou várias regiões e poderá sair do controle se não o detivermos. Restaurar a ordem e a estabilidade deve ser nossa prioridade máxima."
 INS_detangle_supply_chains: "Desatar as cadeias de abastecimento"
 INS_detangle_supply_chains_desc: "Nossa economia de exportação exige que os bens passem por dezenas de intermediários até chegarem ao destino, sendo que em cada etapa há uma taxa, um imposto ou outra cobrança que diminui o lucro. Devemos trabalhar para desfazer essa confusão e controlar diretamente a maior parte da cadeia de abastecimento."
 INS_prioritize_industrial_growth: "Priorizar o crescimento industrial"
 INS_prioritize_industrial_growth_desc: "Nossa economia de exportação é volátil demais e nos mantém dependentes da colaboração neerlandesa. Devemos estabelecer uma indústria manufatureira construindo fábricas na Batávia. Assim, poderemos nos tornar o país mais industrializado do Pacífico."
 INS_closer_economic_ties_to_netherlands: "Fortalecer os laços econômicos com os Países Baixos"
 INS_closer_economic_ties_to_netherlands_desc: "Temos muito a aprender com nosso soberano, especialmente no campo econômico. Ao integrar ainda mais nossa economia de exportação com a dos Países Baixos, poderemos aproveitar sua infraestrutura e suas conexões para garantir acordos comerciais mais lucrativos."
 INS_prioritize_dutch_companies: "Priorizar empresas neerlandesas"
 INS_prioritize_dutch_companies_desc: "Empresas neerlandesas como a Shell e a Fokker têm sido a base de nossa economia por séculos, com nossas exportações de matérias-primas fortemente integradas às operações da Shell. Isso gerou riqueza para as Índias, e devemos priorizá-las em relação às empresas locais menores para manter uma cooperação sólida."
 INSHOL_java_factories: "Abrir fábricas de armas em Java"
 INSHOL_java_factories_desc: "Embora seja uma solução simples, é inegável que a construção de mais fábricas de armamentos é um passo importante para fortalecer o Exército. Como o principal polo industrial da colônia, Java é o local ideal para isso."
 INSHOL_license_dutch_weapon_blueprints: "Licenciar projetos de armas neerlandeses"
 INSHOL_license_dutch_weapon_blueprints_desc: "Em vez de investir na criação de um processo de fabricação doméstico e desenvolver nossos próprios projetos tecnológicos, deveríamos cooperar com empresas neerlandesas para adquirir seus projetos de armas."
 INSHOL_bangka_production_lines: "Linhas de produção em Bangka"
 INSHOL_bangka_production_lines_desc: "O desenvolvimento exponencial da infraestrutura de Bangka, resultado do Projeto Bangka, transformou esta ilha antes pequena e pouco relevante no local ideal para novos empreendimentos industriais. Temos a oportunidade de fortalecer o KNIL construindo uma nova fábrica de armas em Bangka, que funcionará com mais eficiência do que em qualquer outro lugar graças à grande concentração de estradas, ferrovias e portos na ilha."
 INSHOL_artillerie_inrichtingen: "Artillerie Inrichtingen"
 INSHOL_artillerie_inrichtingen_desc: "A Artillerie Inrichtingen fabrica artilharia e outras armas nos Países Baixos há mais de 250 anos e atua nas Índias há várias décadas. Expandir suas capacidades de produção com novas instalações nas Índias melhoraria significativamente as capacidades do KNIL, além de fortalecer a economia de áreas carentes ao criar novos empregos."
 INSHOL_ai_pyrotechnische: "Artillerie Inrichtingen Pyrotechnische"
 INSHOL_ai_pyrotechnische_desc: "Dando continuidade à expansão das instalações de produção da Artillerie Inrichtingen nas Índias Orientais, devemos financiar a criação de uma divisão local de sua subsidiária pirotécnica."
 INSHOL_bio_pharma: "Biofarmacêutica"
 INSHOL_bio_pharma_desc: "A expansão da indústria farmacêutica das Índias é o próximo passo lógico na reforma do KNIL, garantindo que soldados feridos recebam tratamento adequado e possam se recuperar com segurança. A abundância de quinina nas Índias reduz significativamente os custos deste projeto."
 INSHOL_develop_fighters: "Desenvolver novos caças"
 INSHOL_develop_fighters_desc: "Enviaremos engenheiros da Batávia para Amsterdã a fim de observar pessoalmente a produção de caças da Fokker, obtendo acesso a seus segredos industriais mais bem guardados. Eles retornarão com o conhecimento e a experiência técnica necessários para estabelecer uma moderna indústria de caças doméstica nas Índias."
 INSHOL_develop_bombers: "Desenvolver novos bombardeiros"
 INSHOL_develop_bombers_desc: "Enviaremos engenheiros da Batávia para Amsterdã a fim de observar pessoalmente a produção de bombardeiros da Fokker, obtendo acesso a seus segredos industriais mais bem guardados. Eles retornarão com o conhecimento e a experiência técnica necessários para estabelecer uma moderna indústria de bombardeiros doméstica nas Índias."
 INSHOL_bandung_aircraft_facility: "Fábrica de aeronaves de Bandung"
 INSHOL_bandung_aircraft_facility_desc: "Projetos e segredos de fabricação são úteis, mas não terão valor se não conseguirmos produzir aeronaves. Devemos estabelecer novas instalações aeronáuticas em Bandung para atender às necessidades atuais da ML-KNIL"
 INSHOL_netherlands_indies_air_doctrine: "Doutrina aérea neerlando-indiana"
 INSHOL_netherlands_indies_air_doctrine_desc: "Estudaremos a Força Aérea de nações que enfrentam desafios semelhantes aos nossos – aproveitando a experiência adquirida por elas com muito esforço – para desenvolver uma doutrina adaptada à realidade das Índias Orientais, evitando repetir os mesmos erros."
 INSHOL_manado_military_academy: "Academia Militar de Macáçar"
 INSHOL_manado_military_academy_desc: "Estabelecer uma academia militar fora de Java ajudará a mitigar significativamente nossa escassez de mão de obra, tornando o alistamento viável nas ilhas orientais. Macáçar, localizada aproximadamente no centro das Índias Orientais, é o local perfeito para isso."
 INSHOL_infantry_training_in_borneo: "Treinamento de infantaria em Bornéu"
 INSHOL_infantry_training_in_borneo_desc: "As Índias Orientais são caracterizadas por selvas densas, montanhas íngremes e terrenos implacáveis. Nossos soldados estão despreparados para lutar nessas condições, principalmente aqueles estacionados em Java. Devemos expandir o treinamento militar para além de Java e realizar exercícios em ambientes mais hostis. Poucos lugares no mundo rivalizam com as selvas e montanhas de Bornéu, tornando-o o local ideal para treinar rangers de elite."
 INSHOL_knil_engineers: "Divisão de Gênios"
 INSHOL_knil_engineers_desc: "Não devemos concentrar todos os nossos esforços na infantaria e na produção de fuzis. Logística e comunicações desempenham um papel decisivo nas batalhas. Devemos treinar engenheiros e financiar escolas técnicas na Batávia para garantir que nosso Exército não seja limitado por deficiências logísticas."
 INSHOL_work_with_oil_barons: "Cooperar com os barões do petróleo"
 INSHOL_work_with_oil_barons_desc: "A Grande Depressão deixou nossa economia baseada em exportações em uma situação crítica. Talvez seja hora de transferir parte das negociações comerciais para os barões do petróleo de Sumatra a fim de garantir as vendas. Isso terá um custo, pois será necessário vender o petróleo a preços muito abaixo do mercado para assegurar o acordo."
 INSHOL_rubber_taxation: "Tributação da borracha"
 INSHOL_rubber_taxation_desc: "O investimento e o conhecimento neerlandês transformaram as plantações de borracha das Índias Orientais em um dos ativos mais valiosos do império, portanto é justo que a Coroa reivindique sua parte legítima da riqueza criada. Embora certos políticos locais protestem, os interesses do império não podem ser ditados por agitações provinciais."
 INSHOL_padang_port: "Porto internacional em Padang"
 INSHOL_padang_port_desc: "Os recursos produzidos em Padang precisam ser enviados primeiro para Java antes de alcançarem os mercados internacionais, já que a região não tem instalações capazes de lidar com grandes comboios. Essa rota sobrecarrega nossa cadeia de abastecimento e limita o potencial econômico de Sumatra. Ao construir um grande porto de carga em Padang, eliminaremos esse desvio improdutivo, aumentando a lucratividade das plantações da região."
 INSHOL_subsidize_bauxite: "Subsidiar projetos de bauxita"
 INSHOL_subsidize_bauxite_desc: "O projeto em curso nas Índias para modernizar as ilhas ricas em bauxita de Bangka-Belitung é bastante promissor, com grande potencial de lucro a longo prazo. Devemos apoiar o governo das Índias com subsídios econômicos para acelerar o projeto."
 INSHOL_agricultural_subsidies: "Privatizar o setor agrícola"
 INSHOL_agricultural_subsidies_desc: "Ao permitir o estabelecimento de fazendas privadas de diferentes tamanhos, poderemos acelerar o desenvolvimento da infraestrutura em regiões rurais carentes e, ao mesmo tempo, aumentar a receita governamental. Para isso, será criado um modelo tributário estruturado, no qual toda a arrecadação proveniente dessas fazendas será remetida diretamente aos Países Baixos, sem passar primeiro pelas Índias."
 INSHOL_import_sugar: "Importar açúcar"
 INSHOL_import_sugar_desc: "Implementaremos o congelamento de preços no crescente setor agrícola das Índias para garantir que todo o açúcar do país seja importado das plantações de lá, a preços que nenhum outro governo pode igualar. Com isso, também estabeleceremos um monopólio estatal sobre o açúcar."
 INSHOL_import_lumber: "Importar madeira"
 INSHOL_import_lumber_desc: "Implementaremos o congelamento de preços no crescente setor agrícola das Índias para garantir que toda a madeira do país seja importada das plantações de lá, a preços que nenhum outro governo pode igualar. Com isso, também estabeleceremos um monopólio estatal sobre a madeira."
 INSHOL_industrialized_colony: "A colônia industrializada"
 INS_no_peta_tt: "A Indonésia ficará impossibilitada de cooperar com invasores estrangeiros."
 INSHOL_industrialized_colony_desc: "As Índias Orientais deixaram de ser uma colônia modesta e se tornaram uma das regiões mais industrializadas e ricas de toda a Ásia. Este é um momento marcante na história dos Países Baixos e da humanidade. Nossos esforços deram resultado e continuaremos a investir no desenvolvimento da colônia, restabelecendo os Países Baixos como uma potência global."
 INSHOL_economic_integration: "Integração econômica"
 INSHOL_economic_integration_desc: "As Índias Orientais Holandesas são a joia de nosso império, tendo sua prosperidade assegurada pela liderança firme da rainha, do primeiro-ministro e do governador-geral. Essa estabilidade não deve ser colocada em risco por clamores imprudentes de independência, que trariam apenas desordem e declínio. Uniremos ainda mais as economias dos Países Baixos e das Índias, garantindo estabilidade e grandeza contínuas."
 INSHOL_republic_of_indonesia: "A República da Indonésia"
 INSHOL_republic_of_indonesia_desc: "Quando os Países Baixos aceitaram com relutância a petição de Soetardjo, a legislação resultante condicionou a independência indonésia a uma longa lista de requisitos de autossuficiência econômica. Apesar disso, tais condições foram agora plenamente cumpridas graças à determinação do povo indonésio, e os Países Baixos não têm alternativa senão aceitar nossa declaração formal de independência."
 INSHOL_propose_malay_unification: "Propor a unificação malaia"
 INSHOL_propose_malay_unification_desc: "A Indonésia é um arquipélago que abriga centenas de culturas, línguas e etnias. Algumas são semelhantes, enquanto outras são bastante distintas. Ainda assim, por meio da experiência comum sob o domínio colonial, encontramos união sob uma única nação indonésia. Talvez devamos nos perguntar por que essa união deve parar por aqui, quando, do outro lado do estreito, o povo da Malaia compartilha histórias e aspirações semelhantes às nossas."
 INSHOL_singapore_compromise: "O acordo de Singapura"
 INSHOL_singapore_compromise_desc: "Singapura é historicamente e culturalmente terra indonésia, e é natural que faça parte de uma Indonésia unificada. No entanto, a Grã-Bretanha não está disposta a abrir mão de Singapura devido à sua importância estratégica e militar. Devemos propor um acordo para que Singapura se junte à união, sob a condição de que a Grã-Bretanha mantenha o direito de estacionar forças na ilha."
 INSHOL_request_ceylon: "Solicitar transferência do Ceilão"
 INSHOL_request_ceylon_desc: "A colônia britânica do Ceilão compartilha profundos laços culturais e linguísticos com o mundo malaio. À medida que a federação pan-malaia da Maphilindo cresce, é natural que esta ilha também encontre seu lugar dentro da confederação."
 INSHOL_papua_referendum: "O referendo de Papua"
 INSHOL_papua_referendum_desc: "Hoje, a ilha de Papua está dividida entre Indonésia e Austrália. Enquanto nossos investimentos e desenvolvimento transformaram nossa metade em uma região próspera e emergente, o território administrado pela Austrália permanece negligenciado e subdesenvolvido. O futuro da ilha deve estar nas mãos de seu povo e, portanto, devemos exigir um referendo oficial sobre a unificação de Papua."
 INSHOL_invite_phillipines: "Propor a Maphilindo"
 INSHOL_invite_phillipines_desc: "Os muitos povos de nossa união falam diferentes línguas e preservam tradições distintas, mas quase todos têm suas origens no mundo malaio. Devemos reformar nosso Estado em uma confederação pan-malaia, convidando as Filipinas a ingressarem como Estado-membro. Se antes éramos várias colônias insignificantes, agora nos tornaremos uma potência regional no sudeste asiático."
 INS_focus_time_reduce_usa_tt: "§Y$INS_realign_supply_chains$§! reduzirá o tempo necessário para este foco em 70 dias."
 INS_focus_time_reduce_jap_tt: "§Y$INS_first_come_first_serve$§! reduzirá o tempo necessário para este foco em 70 dias."
 INS_focus_time_reduce_fokker_tt: "§Y$INSHOL_east_indies_fokker_division$§! reduzirá o tempo necessário para este foco em 35 dias."
