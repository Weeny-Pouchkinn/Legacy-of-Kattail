l_braz_por:
 operation_rescue_general: "Resgatar comandante capturado"
 operation_rescue_general_desc: "§LUm de nossos comandantes foi capturado pelo inimigo e está sendo mantido prisioneiro. Devemos montar uma operação para resgatá-lo.§!"
 free_general_free_in_transit: "Libertar durante o transporte"
 free_general_free_in_transit_desc: "Nossos agentes descobriram que o inimigo planeja transferir o prisioneiro em breve e elaborarão um plano para interceptar e emboscar o transporte durante o trajeto."
 free_general_assault_holding_area: "Atacar área de detenção"
 free_general_assault_holding_area_desc: "O inimigo está mantendo nosso comandante prisioneiro em um local seguro. Nossos agentes descobriram a localização e prepararão um ataque ousado para libertá-lo."
 free_general_disguise_and_extract: "Disfarçar e extrair"
 free_general_disguise_and_extract_desc: "Usando perícia e astúcia, nossos agentes ajudarão o comandante capturado a criar um disfarce, permitindo que engane seus captores e escape para território aliado."
