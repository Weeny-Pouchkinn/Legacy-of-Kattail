 #Dynamic Modifiers National Spritits
 CZE_ceskoslovenska_armada_dynamic_modifier: "Československá Armáda"
 CZE_ceskoslovenska_armada_dynamic_modifier_desc: "A Armada surgiu das cinzas da Unidades Tchecas Austro-Húngaras e dos Veteranos da Legião Tchecoslovaca. O legado de ambos ainda influencia o funcionamento da Armada."
 CZE_ceskoslovenske_letectvo_dynamic_modifier: "Československé Letectvo"
 CZE_ceskoslovenske_letectvo_dynamic_modifier_desc: "Os aviões podem não estar sempre prontos, mas os nossos pilotos estão. Com possíveis ameaças aéreas de todos os lados, temos que transformar o ar em nosso mar. Todo piloto deve valer por três."
 CZE_a_divided_nation_dynamic_modifier: "Nação dividida"
 CZE_a_divided_nation_dynamic_modifier_desc: "O Estado d[CZE.GetNameDef] tem atuado sozinho na Europa Central como um pluralista que protege todos em seu território. No entanto, a Grande Depressão mudou esse cenário. As dificuldades econômicas deram origem ao ressentimento de vários movimentos nacionais contra o governo. Esse sentimento agora está dividindo a nação profundamente."
 CZE_skoda_works_dynamic_modifier: "Škoda Works"
 CZE_skoda_works_dynamic_modifier_desc: "A empresa Škoda tem produção, construção e investimentos em todos os setores da nossa indústria pesada. Seu alcance é ilimitado em nosso território."
 CZE_ceskoslovenske_alecne_lodstvo_dynamic_modifier: "Československé válečné loďstvo"
 #Dynamic State Modifiers
 CZE_sudetenland_german_state_modifier: "Separatismo da Região dos Sudetas"
 CZE_sudetenland_german_state_modifier_desc: "As dificuldades econômicas recentes atingiram a indústria na Região dos Sudetas. Isso fez com que a população local culpasse o governo d[ROOT.GetNameDef] pelas adversidades."
 CZE_tesinko_polish_state_modifier: "Separatismo polonês"
 CZE_czech_state_modifier: "Escassez de trabalhadores tchecos capacitados"
 CZE_czech_state_modifier_desc: "O rápido desenvolvimento econômico do século XX tem cobrado um preço alto de enorme parte da população agrária tcheca. A capacidade de ocupar cargos com trabalhadores tchecos capacitados e qualificados está defasada. Precisamos nos esforçar para preparar jovens cidadãos tchecos para as demandas instáveis de uma economia moderna."
