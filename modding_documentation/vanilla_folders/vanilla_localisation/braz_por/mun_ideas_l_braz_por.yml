 CZE_sudetenland_paramilitaries_modifier: "Atividade paramilitar da Região dos Sudetas"
 CZE_sudetenland_paramilitaries_modifier_desc: "Os partisans e paramilitares da Região dos Sudetas estão enfraquecendo as nossas forças nesta região. Eles estão atacando ativamente as nossas tropas e colaborando com os nossos inimigos."
