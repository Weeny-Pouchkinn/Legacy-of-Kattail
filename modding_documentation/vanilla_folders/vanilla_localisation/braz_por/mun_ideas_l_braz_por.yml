 CZE_improve_cross_border_rail_connections_modifier: "Melhorando as conexões ferroviárias nas fronteiras"
 #National Spirits
 CZE_taticek_of_czechoslovakia: "Tatíček Masaryk"
 CZE_taticek_of_czechoslovakia_desc: "Tomáš Masaryk, frequentemente chamado de \"Tatíček\" — que significa \"papai\" ou \"pai\" (da nação) — tem sido um pilar da pátria tchecoslovaca desde a sua fundação. Quando parecia ser impossível estruturar coalizões e superar impasses políticos, Masaryk conseguiu, repetidas vezes, realizar milagres para ajudar no fortalecimento e no crescimento da Tchecoslováquia. Mesmo após se aposentar, suas opiniões e sugestões oferecidas à liderança política são vistas mais como ordens do que como conselhos."
 CZE_industrialists_veto: "Veto dos industrialistas"
 CZE_industrialists_veto_desc: "Os industrialistas exercem influência considerável sobre a política do país, pois lideram muitos dos maiores conglomerados d[CZE.GetNameDef]. Suas preocupações não podem ser ignoradas quando se trata de políticas econômicas, e a mobilização da economia está entre as medidas a que eles mais resistiriam."
 CZE_agrarian_politics_1: "Políticas agrárias"
 CZE_agrarian_politics_1_desc: "Apesar da natureza industrial do nosso país, os fazendeiros e os camponeses têm uma influência considerável em vários partidos políticos. Suas opiniões costumam moldar as decisões econômicas e são obstáculos frequentes para o progresso industrial."
 CZE_directorate_of_fortification_works_no_gd_idea: "Junta de Trabalhos de Fortificação"
 CZE_directorate_of_fortification_works_no_gd_idea_desc: "A $CZE_directorate_of_fortification_works_no_gd_idea$, mais conhecida como ROP, é a entidade responsável por supervisionar os trabalhos de fortificação no país."
 CZE_czech_corporatism: "Corporativismo tcheco"
 CZE_broken_shield: "Escudo quebrado"
 CZE_redirected_fortification_council_funds: "Fundos do Conselho de Fortificação redirecionados"
 CZE_army_readiness_1: "Exército Despreparado"
 CZE_army_readiness_1_desc: "A prontidão de um exército não se resume a homens e equipamentos no campo. A confiança nas preparações e o apoio dos líderes políticos e industriais do país são fatores importantes no combate a ameaças. Ter a capacidade de lutar é uma coisa, mas fazer isso com eficiência é outra."
 CZE_army_readiness_3: "Exército Preparado"
 CZE_army_readiness_3_desc: "A prontidão de um exército não se resume a homens e equipamentos no campo. A confiança nas preparações e o apoio dos líderes políticos e industriais do país são fatores importantes no combate a ameaças. Ter a capacidade de lutar é uma coisa, mas fazer isso com eficiência é outra."
 CZE_ready_for_anything_idea: "Pronto para tudo"
 CZE_sudeten_german_quandary: "O dilema da Região dos Sudetas"
 CZE_sudeten_german_quandary_desc: "Embora a maioria das pessoas que vivem na Região dos Sudetas apenas deseje maior autonomia sob o governo atual, muitos partidos políticos locais e seus apoiadores poderiam rapidamente tornar-se uma quinta-coluna caso um Estado alemão buscasse anexar qualquer parte da região."
 CZE_sudeten_german_quandary_modifier_tt: "§YEfeito Passivo§!:\nSe §Y[AUS.GetFlag][AUS.GetNonIdeologyName]§!, §Y[GER.GetFlag][GER.GetNonIdeologyName]§!, ou qualquer outro [BAY.GetFlag]§YPaís Alemão§! que faz fronteira conosco justificar ou ganhar um §RObjetivo de Guerra§! contra nós enquanto §Y[69.GetName]§!, §Y[972.GetName]§! ou §Y[74.GetName]§! estiver sob o nosso controle:\n - (§YTodos os Estados da Região dos Sudetas Controlados§!):\n    Adicionam §Y$CZE_sudetenland_paramilitaries_modifier$§!, que concede:\n       $MODIFIER_LOCAL_INTEL_TO_ENEMIES$: §R+10%§!\n       $MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$: §R-10%§!\n       $modifier_state_repair_speed_bunker_factor$: §R-10%§!\n\n - Esse §YEfeito§! só pode acontecer uma vez."
 CZE_sudeten_challenge: "O Desafio dos Sudetas"
 CZE_sudeten_challenge_desc: "Atividades recentes dos paramilitares na Região dos Sudetas fizeram muitas pessoas da comunidade internacional acreditar que as atuais ações agressivas contra nós são justificáveis! Vai demorar para convencer o mundo do contrário."
 CZE_sudeten_facde: "A falsidade sudeta"
 CZE_sudeten_facde_desc: "Sem nosso apoio aos paramilitares locais, as justificativas das nossas ações contra [CZE.GetNameDef] agora estão sendo questionadas pelo mundo."
