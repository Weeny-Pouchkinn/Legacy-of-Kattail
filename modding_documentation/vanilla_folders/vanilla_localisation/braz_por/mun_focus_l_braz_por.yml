 #Germany
 GER_integrate_czech_manufacturers: "Integrar fabricantes tchecos"
 GER_integrate_czech_manufacturers_desc: "A indústria que a Boêmia contém é uma mina de ouro de experiência em fabricações e recursos industriais para a nossa economia. O poder industrial adicional proporcionado pelos fabricantes da Boêmia impulsionaria bastante a nossa indústria armamentista. Seria muito sensato integrá-los às nossas linhas de produção."
 GER_integrate_czech_manufacturers_no_aat_tt: "§GDisponível§! como §Ycompanhias de projetos§!:\n§Y$CZE_skoda_works_german_organization$§!, §Y$CZE_bohmische_mahrische_maschinenfabrik_ag_german_organization$§!, §Y$CZE_zlin_aircraft_organization$§! e §Y$CZE_ceska_zbrojovka_uhersky_brod_organization$§!"
 CZE_unlocks_sokolov_raid_pfot_tt: "Desbloqueia §Yincursões de paraquedistas§! em §YFalknov§!"
