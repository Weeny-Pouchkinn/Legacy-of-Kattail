l_braz_por:
 #Shortcuts
 CZE_military_path_shortcut: "Forças Armadas"
 CZE_economic_path_shortcut: "Economia"
 CZE_diplomacy_path_shortcut: "Diplomacia"
 CZE_fort_path_shortcut: "Esforços para fortificação"
 CZE_skoda_priority_shortcut_name: "Prioridade da Škoda"
 CZE_political_path_shortcut: "Política"
 # Č does show when scrolling through focuses, but not in the detailed focus view title (does work in the description though)
 CZE_coalition_building: "Construção de coalizão"
 CZE_coalition_building_desc: "A coalizão que surgiu após as eleições deve fortalecer a união entre seus membros para funcionar de forma eficaz. A recente aposentadoria de Jan Malypetr como Primeiro-Ministro colocou ainda mais pressão sobre a Coalizão Ampla para consolidar seu apoio."
 CZE_merge_the_paramilitaries: "Fundir os grupos paramilitares"
 CZE_merge_the_paramilitaries_desc: "Os nossos paramilitares estão espalhados e divididos em vários grupos diferentes. Se quisermos usá-los militarmente, teremos que obrigá-los a se fundirem."
 CZE_integrated_paramilitaries: "Integrar paramilitares"
 CZE_integrated_paramilitaries_desc: "O exército pode não gostar muito da ideia, mas a integração dos grupos paramilitares aumentará o nosso rol de reservas quando mais precisarmos."
 CZE_wielding_the_hammer: "Portando o martelo"
 CZE_wielding_the_hammer_desc: "Podemos usar nossa maioria na Assembleia Nacional para tornar o processo de promulgação de leis mais rápido. É de suma importância estabelecer a ordem em nossa casa legislativa."
 CZE_emergency_measures: "Medidas de emergência"
 CZE_emergency_measures_desc: "Ao adotar medidas emergenciais que nos ajudarão a lidar com as diversas crises que afetam a nação, e ao mesmo tempo usá-las para aumentar a vigilância sobre aqueles que podem ser ideologicamente suspeitos para o nosso governo, estaremos melhor preparados para encarar os desafios que nos aguardam."
 CZE_king_of_the_castle: "Rei do castelo"
 CZE_king_of_the_castle_desc: "Todo mundo sabe quem manda no governo. Em tempos de grandes incertezas, é hora de pararmos de fingir e deixar $CZE_edvard_benesh$ liderar mais diretamente. A segurança do nosso país depende disso."
 CZE_closer_ties_with_the_moderate_germany_parties: "Reunir partidos moderados da Região dos Sudetas"
 CZE_closer_ties_with_the_moderate_germany_parties_desc: "Alguns partidos da Região dos Sudetas querem trabalhar com a nossa coalizão e promover o progresso no governo. Vamos intensificar esses laços."
 CZE_complete_reconciliation: "Reconciliação completa"
 CZE_complete_reconciliation_desc: "Começamos a construir laços de confiança. É hora de nos reconciliarmos com os nossos compatriotas."
 CZE_complete_reconciliation_cooldown_flag: "Concluiu o foco §Y$CZE_closer_ties_with_the_moderate_germany_parties$§!"
 CZE_complete_reconciliation_cooldown_flag_tt: "Os dias atuais são: [?CZE_complete_reconciliation_cooldown_flag:days|Y0]"
 CZE_bastion_of_liberty: "Bastião da liberdade"
 CZE_bastion_of_liberty_desc: "Nós somos um dos poucos países realmente pluralistas a leste do Reno nesta década na Europa. Vamos garantir que as pessoas não se esqueçam disso."
 CZE_standing_against_the_storm: "Enfrentando a tempestade"
 CZE_standing_against_the_storm_desc: "Apesar das nossas falhas e possível falta de preparação, vamos enfrentar os desafios e nos manter firmes diante de qualquer tempestade."
 CZE_truth_prevails: "A Verdade prevalece"
 CZE_truth_prevails_desc: "Mesmo diante de grandes acasos e tarefas impossíveis, o nosso país sabe que o lema nacional \"A Verdade Prevalece\" se mostrará verdadeiro no fim das contas. Busque a verdade, ouça a verdade, e ela prevalecerá."
 CZE_negotiations_with_the_autonomous_bloc: "Negociações com o Bloco Autônomo"
 CZE_negotiations_with_the_autonomous_bloc_desc: "Se quisermos formar uma coalizão que não conceda poder à legião de lacaios de Benes na Assembleia Nacional, teremos que trabalhar com o Bloco Autônomo. No entanto, conquistar o apoio total deles terá um custo alto."
 CZE_slovakia_autonomy_agreement: "Acordo de autonomia da Eslováquia"
 CZE_slovakia_autonomy_agreement_desc: "O preço para o Bloco Autônomo trabalhar com a nossa coalizão é um acordo de autonomia com o nosso governo. É um grande preço a se pagar, mas as consequências de não atender à nossa parte do acordo podem ser piores."
 CZE_slovakia_autonomy_agreement_tt: "§Y[RUT.getname]§! desejará o mesmo acordo que fizermos com §Y[SLO.GetNameDef]§!!"
 CZE_slovakia_autonomy_agreement_2_tt: "$CZE_the_autonomous_bloc_demands$ serão adiadas em §Y35 dias§! quando esse foco for selecionado."
 CZE_topple_the_king: "Derrubar o rei"
 CZE_topple_the_king_desc: "A influência de $CZE_edvard_benesh$ em nosso governo é sufocante. Seu poder é maior que sua função como presidente devido à legião de lealistas que ele tem no parlamento. Agora nas condições certas, podemos derrubar a influência dele na Horní Komora."
 CZE_comprise_with_the_carpathians: "Entrar em acordo com os Cárpatos"
 CZE_comprise_with_the_carpathians_desc: "A região da Rutênia está pressionando por um acordo de federalização similar ao que demos para [SLO.GetNameDef]. Se o concedermos, isso enfraquecerá a nossa posição na região e em [9.GetName]. Fechar um acordo com eles pode ser melhor do que atender às exigências totalmente."
 CZE_the_rut_demands_add_35_CZE_comprise_with_the_carpathians_tt: "$CZE_the_rut_demands$ serão adiadas em §Y35 dias§! quando esse foco for selecionado."
 CZE_cut_carpathia_loose: "Liberar a Carpátia"
 CZE_cut_carpathia_loose_desc: "Agora que a Eslováquia é um Estado Federal, a região da Rutênia espera alcançar um acordo semelhante. Embora isso seja absurdo, seria difícil tentar impedi-los sem a Eslováquia sob o nosso controle direto. Talvez devêssemos atender à exigência deles."
 CZE_compromise_with_the_veteran_agrarian: "Entrar em acordo com os fazendeiros veteranos"
 CZE_compromise_with_the_veteran_agrarian_desc: "A velha guarda agrária é um obstáculo para o progresso junto ao crescente eleitorado urbano. Precisamos fechar um acordo com esses fazendeiros para conseguir o que queremos."
 CZE_reorient_the_broad_coalition: "Reorientar a Coalizão Ampla"
 CZE_reorient_the_broad_coalition_desc: "A coalizão ampla tem sido a principal do nosso governo há muitos anos e os diversos partidos políticos que ela engloba têm dificultado sua liderança. Já passou da hora de uma reorientação política e do regime dos ministros."
 CZE_leverage_sokol: "O Movimento Sokol"
 CZE_leverage_sokol_desc: "O Movimento Sokol é uma organização importante do nosso país há várias décadas. Em um momento de crise, podemos potencializar o movimento para nos ajudar no treinamento paramilitar e no recrutamento para o nosso exército quando for mais necessário."
 CZE_urbanist_policies: "Políticas urbanistas"
 CZE_deepend_ties_with_the_trademans: "Intensificar laços com os comerciantes"
 CZE_deepend_ties_with_the_trademans_desc: "O partido dos comerciantes é popular entre os eleitores urbanos da classe média. Se os empoderarmos e trabalharmos com eles, poderemos progredir no eleitorado urbano sem alienar a nossa base de eleitores rurais."
 CZE_apart_but_togather: "Distantes, porém unidos"
 CZE_apart_but_togather_desc: "Nossas regiões agora possuem mais autonomia do que nunca, mas também estamos mais fortes do que antes. Estamos prontos para tudo."
 CZE_contact_henlein: "Contatar Henlein"
 CZE_contact_henlein_desc: "$CZE_konrad_henlein$ tem sido um estorvo constante para o nosso governo há vários anos. No entanto, diante dos recentes acontecimentos internacionais, pode ser a hora de conversar com ele."
 CZE_contact_henlein_cooldown_flag: "Concluiu o foco §Y$CZE_no_compromise_with_the_sdp$§!"
 CZE_contact_henlein_cooldown_flag_tt: "Os dias atuais são: [?CZE_contact_henlein_cooldown_flag:days|Y0]"
 CZE_contact_henlein_focus_warning_tt: "Se concluirmos §Y$CZE_no_compromise_with_the_sdp$§!, teremos que esperar §Y350§! dias antes de poder selecionar esse §YFoco Nacional§!."
 CZE_contact_henlein_focus_order_warning_tt: "Se concluirmos §Y$CZE_no_compromise_with_the_sdp$§! após a conclusão desse §YFoco Nacional§!, §Y$CZE_konrad_henlein$§! se aposentará."
 CZE_no_compromise_with_the_sdp: "Continuar bloqueando o SdP"
 CZE_no_compromise_with_the_sdp_desc: "O SdP não tem nada a oferecer à nossa coalizão. Eles querem apenas causar tensões políticas e tentar manchar as ações do nosso governo. Em nome da boa governança, eles devem continuar bloqueados de qualquer coalizão."
 CZE_no_compromise_with_the_sdp_cooldown_flag: "Concluiu o foco §Y$CZE_contact_henlein$§!"
 CZE_no_compromise_with_the_sdp_cooldown_flag_tt: "Os dias atuais são: [?CZE_no_compromise_with_the_sdp_cooldown_flag:days|Y0]"
 CZE_no_compromise_with_the_sdp_focus_warning_tt: "Se concluirmos §Y$CZE_contact_henlein$§!, teremos que esperar §Y350§! dias antes de poder selecionar esse §YFoco Nacional§!."
 # CZE_economic_integration: "Economic Integration"
 # CZE_economic_integration_desc: "Why stop at a customs union? Economic integration will further grow our economies and ensure our future is an affluent one for all members."
 CZE_form_a_federation: "Formando uma federação"
 CZE_form_a_federation_desc: "O sonho de uma federação europeia central já não está tão distante. Podemos formar uma, nos tornar um gigante da democracia e ter o poder para resistir às grandes potências por conta própria."
 CZE_bend_the_bars: "$ITA_bend_the_bars$"
 CZE_bend_the_bars_desc: "$GER_european_confederation_desc$"
 CZE_reassure_the_army: "Tranquilizar o Exército"
 CZE_reassure_the_army_desc: "O exército está apreensivo com algumas de nossas recentes decisões e políticas governamentais. É hora de tranquilizar os generais, mostrando que estamos do lado deles diante de qualquer ação do governo."
 CZE_outreach_to_the_western_powers: "Ampliar o alcance para as potências ocidentais"
 CZE_outreach_to_the_western_powers_desc: "As democracias ocidentais dizem que nos apoiam, mas precisamos nos envolver ainda mais com elas para garantir que essas palavras também se reflitam em ações quando a situação complicar."
 CZE_demand_guarantees: "Exigir garantias mais fortes"
 CZE_demand_guarantees_desc: "Apesar dos nossos tratados e alianças existentes, precisamos assegurar que os nossos parceiros não nos abandonem em um momento de desespero só por ser a opção mais fácil para eles. Precisamos de algo mais forte do que uma garantia."
 CZE_guardian_of_central_europe: "Guardiões da Europa Central"
 CZE_guardian_of_central_europe_desc: "Agora estamos em posição de supervisionar a democracia no centro da Europa. Podemos ser uma entidade guardiã para as nações que não podem se proteger sozinhas e garantir que a democracia seja suprema."
 CZE_central_european_faction: "Soberania da Europa Central"
 CZE_central_european_faction_desc: "Apesar do nosso foco em nos fortalecer em vez de depender demais da diplomacia, é primordial não desprezarmos nossa influência. Talvez seja o momento de olhar para fora."
 CZE_strike_at_the_heart_of_bolshevism: "[THIS.GetAntiSovietFocusName]"
 CZE_strike_at_the_heart_of_bolshevism_1: "Ataque no núcleo do bolchevismo"
 CZE_strike_at_the_heart_of_bolshevism_2: "Proteger o flanco oriental"
 CZE_strike_at_the_heart_of_bolshevism_desc: "A expansão d[SOV.GetNameDef] é uma verdadeira ameaça à Europa e à nossa nação. Temos que ser um bastião contra eles."
 CZE_destroy_the_fascist_threats: "Destruir as ameaças fascistas"
 CZE_destroy_the_fascist_threats_desc: "[CZE_get_fascist_threats_desc]"
 CZE_destroy_the_fascist_threats_desc_enemy_ger: "Todo mundo sabe quem é a maior ameaça à paz na Europa. Alguém precisa parar [GER.GetNameDef] o quanto antes. Se ninguém assumir esta responsabilidade, caberá a nós fazê-lo."
 CZE_destroy_the_fascist_threats_desc_backup: "Para nossa segurança, é de suma importância que os países vizinhos não adotem uma retórica expansionista que, mais cedo ou mais tarde, possa ser direcionada contra nós."
 CZE_peace_on_our_time: "Paz para o nosso tempo"
 CZE_peace_on_our_time_desc: "Faz muito tempo que estamos em segundo plano nas relações internacionais europeias. Isso não continuará assim! Podemos ser independentes e impor as nossas condições. Seja com guerra ou paz."
 CZE_reach_out_for_military_assistance: "Busca ajuda militar"
 CZE_free_tuka: "Libertar $CZE_vojtech_tuka$"
 CZE_free_tuka_desc: "A pena de $CZE_vojtech_tuka$ está próxima de acabar e, em vez de acharmos uma desculpa para estendê-la, poderíamos libertá-lo e colocá-lo para trabalhar em nosso governo. É melhor que ele trabalhe conosco do que contra nós."
 CZE_grow_the_anglo_czechoslovak_prague_credit_bank: "O Banco Anglo-Tchecoslovaco"
 CZE_grow_the_anglo_czechoslovak_prague_credit_bank_desc: "O Banco de Crédito Anglo-Tchecoslovaco tem sido uma das principais forças motrizes da nossa indústria. Sem o seu financiamento, nós não conseguiríamos manter o grande negócio de exportação que temos. O estabelecimento de novas agências em Nova York e o fortalecimento dos laços com [ENG.GetNameDef] fariam o banco crescer ainda mais. Com isso, o governo d[ENG.GetNameDef] também teria uma participação em nossa sobrevivência contínua."
 CZE_feeding_the_alligator: "Tapando o sol com a peneira"
 CZE_feeding_the_alligator_desc: "Os projetos d[GER.GetNameDef] na Região dos Sudetas são uma ameaça à existência da nossa nação. Se fizermos o que eles querem, é provável que nos deixem em paz. Certo?"
 CZE_complete_capitulation: "Capitulação completa"
 CZE_complete_capitulation_desc: "Que escolha nós temos senão nos render? Não podemos resistir à tempestade iminente. Talvez se fizermos um acordo com o governo d[GER.GetNameDef] enquanto ainda temos algum poder, ele nos deixe com um pouco de autonomia sob seu domínio."
 CZE_stabilize_the_protectorate: "Estabilizar o Protetorado"
 CZE_stabilize_the_protectorate_desc: "O Protetorado está totalmente instável. Precisamos convencer a nossa população de que somos um governo legítimo e que podemos atender às necessidades do povo."
 CZE_stabilize_the_protectorate_unretire_henlein_tt: "Tira §Y$CZE_konrad_henlein$§! da aposentadoria de §Y[ROOT.GetName].§!"
 CZE_full_faith_in_hacha: "Fé total em Hácha"
 CZE_full_faith_in_hacha_desc: "$CZE_emil_hacha$ é muito mais popular e respeitado pela nossa população do que $CZE_emanuel_moravec$. O trabalho que ele está fazendo pode ser suspeito, mas não conseguiremos achar alguém mais popular."
 CZE_moravecs_bohemia: "Boêmia de Moravec"
 CZE_moravecs_bohemia_desc: "Dizem que $CZE_emil_hacha$ está tentando enfraquecer o nosso governo. Se quisermos ter sucesso e crescer nas condições atuais, precisamos de uma liderança mais alinhada com a ideologia dos nossos soberanos."
 CZE_form_the_government_army: "Formar o exército do governo"
 CZE_form_the_government_army_desc: "Se quisermos o sucesso do nosso país, precisamos formar um novo exército que não tenha as falhas do antigo. A liderança precisa ter um alinhamento político com seu governo."
 CZE_forced_administration_of_companies: "Administração forçada de empresas"
 CZE_forced_administration_of_companies_desc: "Apesar da imensa supervisão, algumas empresas ainda operam fora do nosso controle. É hora de submetê-las à nossa administração."
 CZE_revisit_custom_union_talks: "Revisitar conversas sobre união aduaneira"
 CZE_revisit_custom_union_talks_desc: "As conversas sobre uma união aduaneira podem ter sido piores com alguns vizinhos em relação a outros. Precisamos revisitá-las e exercer uma nova pressão para criar uma união aduaneira entre os nossos países."
 CZE_revisit_custom_union_talks_tt: "Ainda seremos capazes de convencê-los a se juntar a nós, mas por outros §Ymeios§!."
 CZE_revisit_custom_union_talks_2_tt: "Eles ficarão muito mais suscetíveis a aceitar nossas exigências para se juntar à nossa federação"
 CZE_reintegrate_cross_border_rail_connections: "Melhorar as conexões ferroviárias nas fronteiras"
 CZE_reintegrate_cross_border_rail_connections_desc: "Melhorar as conexões ferroviárias entre nós e os nossos vizinhos é uma boa maneira de bajulá-los. Ainda mais se quisermos ampliar as conexões econômicas entre as partes."
 CZE_reintegrate_cross_border_rail_connections_flag: "As conexões ferroviárias nas fronteiras foram melhoradas"
 CZE_vonapo_20: "VONAPO 20"
 CZE_vonapo_20_desc: "Não estamos observando sozinhos a ameaça iminente d[GER.GetNameDef]. Portanto, surgiu um plano para cooperarmos com [SOV.GetNameDef] para coletar informações e sermos mais capazes de frustrar as ambições d[GER.GetNameDef]."
 CZE_increase_funding_from_moscow: "Aumentar o financiamento de [SOV.capital.GetCapitalVictoryPointName]"
 CZE_increase_funding_from_moscow_desc: "O [Root.GetCommunistParty] está tão carente de recursos que tem pagado sua construção com os salários dos seus representantes. Para crescer, precisamos que o governo [SOV.GetAdjective] conceda mais fundos para distribuir o nosso jornal e recrutar mais membros."
 CZE_zdenek_fierlinger_tt: "Nomear o conselheiro §Y$CZE_zdenek_fierlinger$§!"
 CZE_expand_the_communist_press: "Expandir a imprensa comunista"
 CZE_expand_the_communist_press_desc: "O nosso jornal \"Justiça Vermelha\" poderia servir para informar as pessoas que atualmente não leem nenhum jornal. Só precisamos de mais financiamento."
 CZE_anti_rearmament_propaganda: "Propaganda antirrearmamento"
 CZE_anti_rearmament_propaganda_desc: "A queda do governo fascista de nosso principal adversário, [GER.GetNonIdeologyName], significa que podemos afirmar que estivemos certos o tempo todo com a nossa posição contra o crescimento militar."
 CZE_anti_democratic_propaganda: "Propaganda antidemocrata"
 CZE_anti_democratic_propaganda_desc: "Para gerarmos apoio para o nosso partido, temos que destacar as falhas dos governos anteriores da República e mostrar como poderíamos ter lidado melhor com a situação."
 CZE_form_workers_brigades: "Formar milícia de trabalhadores"
 CZE_form_workers_brigades_desc: "Os trabalhadores que estamos libertando devem estar preparados para a luta. Eles podem não ser soldados treinados, mas podem atuar como especialistas conforme seus empregos."
 CZE_kohler_faction: "A facção de Köhler"
 CZE_kohler_faction_desc: "A facção de Bruno Köhler acredita ser preciso usar de violência para derrubar a burguesia e, assim, formar um Estado tchecoslovaco comunista bem-sucedido."
 CZE_gottwald_faction: "A facção de Gottwald"
 CZE_gottwald_faction_desc: "Fortemente leal a Moscou, a facção stalinista de Klement Gottwald prevê um Estado tchecoslovaco equiparado à URSS."
 CZE_zapotocky_faction: "A facção de Zápotocký"
 CZE_zapotocky_faction_desc: "Bohumir Šmeral e Antonin Zápotocký, os criadores do partido comunista, idealizavam uma política mais moderada do que aquela imposta ao partido por Klement Gottwald. Temos que voltar a essas raízes para realmente atrair todos os povos d[CZE.GetNameDef]."
 CZE_ally_with_moderate_socialists: "Cooperar com socialistas moderados"
 CZE_ally_with_moderate_socialists_desc: "Nem todos os países podem ter o sucesso eleitoral do comunismo ou o amor por [SOV.GetLeader]. Portanto, cooperar com movimentos mais moderados é algo que não podemos ignorar."
 CZE_democracies_willing_to_join_faction_tt: "§YAs nações democráticas estarão mais dispostas a se juntar à nossa facção comunista.§!"
 CZE_limited_cooperation: "Cooperação limitada com [SOV.GetLeader]"
 CZE_limited_cooperation_desc: "Embora exista uma diferença ideológica, até o governo d[SOV.GetNameDef] pode reconhecer o nosso valor como parceiros e entrar em alguns acordos pragmáticos, mesmo que eles nos denunciem em seus jornais."
 CZE_denounce_stalinism: "Denunciar o stalinismo"
 CZE_denounce_stalinism_desc: "A reputação do comunismo foi eternamente manchada pelas injustiças de Stalin. É hora de tomarmos medidas militares para libertar o povo de regimes como esse."
 CZE_country_leader_has_ideology_stalinism_tt: "O líder do país tem a ideologia §Y$stalinism$§!"
 CZE_cooperate_with_tito: "Cooperar com Tito"
 CZE_cooperate_with_tito_desc: "O governo d[YUG.GetNameDef] está tentando uma versão pragmática do comunismo, assim como nós. Eles também buscam unir vários povos diferentes sob a bandeira vermelha. Para enfrentar esses desafios, devíamos cooperar nas relações militares e políticas."
 CZE_reduce_divided_nation_cost_tt: "Reduz o custo e a duração da maioria das decisões de §YUma nação dividida§!."
 CZE_balkan_union: "Expandir a união"
 CZE_balkan_union_desc: "Ainda que mais nações da região tenham adotado o comunismo, não podemos nos proteger contra as potências maiores sem uma cooperação forte. A melhor maneira de conseguir isso seria com uma união."
 CZE_cooperation_with_the_ussr: "Cooperação com [SOV.GetLeader]"
 CZE_cooperation_with_the_ussr_desc: "Até os apoiadores mais fervorosos d[SOV.GetNameDef] entre a liderança do partido estão cientes dos defeitos da sua coletivização após visitarem o país. Mesmo assim, cooperar com eles na coletivização significa que podemos analisar cuidadosamente o que deu errado, o que funcionou e como implementar da melhor maneira para [ROOT.GetNameDef]."
 CZE_exchange_military_expertise: "Troca de conhecimento militar"
 CZE_exchange_military_expertise_desc: "O governo [SOV.GetAdjective], assim como a maioria das potências com um exército forte, tem experimentado táticas militares. Devemos pedir para que compartilhem suas ideias e, em troca, poderemos compartilhar as nossas."
 CZE_pressure_romania: "Pressionar a Romênia"
 CZE_pressure_romania_desc: "O governo [ROM.GetAdjective] pode ser uma grande ameaça caso se alie aos nossos inimigos. Isso poderia romper a nossa conexão com [SOV.GetNameDef] ou fazer o petróleo valioso cair em mãos erradas. Com o apoio [SOV.GetAdjective], somos grandes o bastante para nos aliarmos a eles sem uma guerra."
 CZE_facility_in_state_tt: "Se não houver outras §Yinstalações experimentais§! em $STATE|Y$, ganharemos §G1§! $FACILITY_TYPE|Y$ em $STATE|Y$."
 CZE_spread_the_revolution: "Espalhar a revolução"
 CZE_spread_the_revolution_desc: "Com o sucesso da revolução n[ROOT.GetNameDef], temos que incentivar o proletariado no exterior a lutar por sua liberdade. Essa é uma luta que podemos apoiar."
 CZE_agrarian_reform: "Restaurar o Departamento de Terras"
 CZE_agrarian_reform_desc: "O Departamento de Terras, recentemente desfeito, foi responsável pela redistribuição de terras, principalmente as agrícolas. É hora de reformar essa instituição para que ela possa tomar medidas ainda mais drásticas."
 CZE_realign_the_church: "Ateísmo estatal"
 CZE_realign_the_church_desc: "A religião é um elemento que divide os povos d[CZE.GetNameDef] há bastante tempo. Temos que diminuir sua influência nas questões do Estado, como a educação e a imprensa, e criar uma sociedade mais unida."
 CZE_create_a_secret_police_branch: "Criar uma agência de polícia secreta"
 CZE_create_a_secret_police_branch_desc: "Para garantir a estabilidade, temos que nos defender contra inimigos internos e externos, pois levará um tempo para a população se acostumar com o novo sistema, principalmente porque ele ainda não está perfeito."
 CZE_promote_urbanization: "$ARG_promote_urbanization$"
 CZE_promote_urbanization_desc: "Agora que estabelecemos fazendas comunais eficientes, podemos iniciar programas para atrair parte da população rural para as cidades e aumentar a produtividade urbana."
 CZE_confiscate_church_lands: "Confiscar terras da Igreja"
 CZE_confiscate_church_lands_desc: "A Igreja controla muito mais terras e riquezas do que é necessário para seus propósitos. Temos que realocar parte dessas terras, como fizemos com os fazendeiros."
 CZE_change_the_narrative: "Mudar a narrativa"
 CZE_change_the_narrative_desc: "Embora a Igreja não tenha apoiado a nossa revolução até agora, alinhar os valores dela com os nossos pode ser essencial para conseguir apoio para o novo regime."
 CZE_the_second_fortification_program: "Iniciar o Segundo Programa de Fortificação"
 CZE_the_second_fortification_program_desc: "O primeiro programa de fortificação estabeleceu a base para as defesas que precisamos ampliar imediatamente. Pelo bem do futuro da nossa nação, precisamos começar o segundo programa o mais rápido possível, além de aumentar e desenvolver as nossas linhas de fortificação."
 CZE_redirect_the_fortification_councils_funds: "Redirecionar fundos do Conselho de Fortificação"
 CZE_redirect_the_fortification_councils_funds_desc: "Os programas de fortificação são uma torneira aberta em nossa economia. Esses fundos seriam melhor aplicados no financiamento de outros programas. O exército não precisa de mais defesas, ele já está bem servido nesse sentido."
 CZE_jachymov_uranium_mine: "Mina de urânio de Jáchymov"
 CZE_jachymov_uranium_mine_desc: "As minas de Jáchymov foram fontes de urânio e outros minérios há bastante tempo, mas tem havido pouca utilidade para o urânio até os desenvolvimentos recentes na física."
 CZE_skoda_internal_competition: "Incentivar a concorrência interna"
 CZE_skoda_internal_competition_desc: "Em uma empresa tão grande quanto a Škoda é difícil manter todo mundo no auge da produtividade. Incentivar a concorrência interna pode melhorar bastante o desempenho dos funcionários em nossas instalações."
 CZE_skoda_max_optimization_tt: "O Nível de Otimização máximo de §YFoco da Škoda§! aumentará para 7."
 CZE_skoda_increase_cooperation: "Aumentar a cooperação na Škoda"
 CZE_skoda_increase_cooperation_desc: "Para continuar em nossa busca por melhoria, podemos aprimorar o nosso desempenho aumentando a cooperação entre instalações. Isso também proporcionaria um maior intercâmbio de conhecimento entre as fábricas."
 CZE_skoda_fast_optimization_tt: "O £GFX_prod_eff_cap Nível de Otimização da taxa do §YFoco da Škoda§! aumenta ao longo do tempo rumo ao Nível Máximo: §G+100%§!"
 CZE_master_of_armaments: "Mestre dos Armamentos"
 CZE_master_of_armaments_desc: "A Škoda Works é a maior fabricante de armas do país desde os tempos do Império Áustro-Húngaro. Seu conhecimento e experiência não têm igual entre os conglomerados industriais do nosso país. É hora de reconhecer essa excelência com o título de Mestre dos Armamentos."
 CZE_only_the_best_is_good_enough: "Apenas o melhor é bom o bastante"
 CZE_only_the_best_is_good_enough_desc: "A Škoda Works sempre foi movida por uma ética de trabalho duro e um espírito inovador. Nossos fundadores sempre seguiram o lema: \"Apenas o melhor é bom o bastante para os nossos clientes!\" Esse lema soa ainda mais verdadeiro nos tempos atuais."
 CZE_an_industrial_legacy: "Um legado industrial"
 CZE_an_industrial_legacy_desc: "Agora que elevamos a indústria do nosso país a patamares que antes pareciam impossíveis, podemos finalmente aceitar e reivindicar o nosso legado industrial. Nós somos uma potência incomparável da indústria."
 CZE_powerhouse_of_europe: "Potência da Europa"
 CZE_powerhouse_of_europe_desc: "Nossa indústria tornou-se motivo de admiração mundial. Devemos garantir que nosso setor energético possa abastecê-la adequadamente."
 CZE_supply_fighters_for_allies: "Fornecer combatentes para aliados"
 CZE_supply_fighters_for_allies_desc: "Os governos d[FRA.GetNameDef] e d[ENG.GetNameDef] estão com muito medo de que os aviões d[GER.GetNameDef] possam derrotar rapidamente suas defesas e atacar suas cidades se houver um conflito. Portanto, fortalecer a força aérea desses países pode deixá-los um pouco mais confiantes quanto à capacidade de deter a expansão d[GER.GetNameDef] sem perder muitas vidas."
 CZE_allies_more_likely_to_defend_us_tt: "§YOs Aliados ficarão mais suscetíveis a nos apoiar contra o expansionismo alemão na Região dos Sudetas.§!"
 CZE_allies_more_likely_to_defend_us_2_tt: "§YOs Aliados ficarão muito mais suscetíveis a nos apoiar contra o expansionismo alemão na Região dos Sudetas.§!"
 CZE_allies_more_likely_to_defend_us_3_tt: "§YOs Aliados ficarão um pouco mais suscetíveis a nos apoiar contra o expansionismo alemão na Região dos Sudetas.§!"
 CZE_establish_the_state_defense_guard: "Estabelecer a Guarda de Defesa do Estado"
 CZE_german_nonagressionpact: "Pacto Haushofer-Krofta"
 CZE_german_nonagressionpact_desc: "As negociações para um pacto de não agressão com [GER.GetNameDef] estavam em andamento há algum tempo, porém, após alguns sinais de instabilidade n[SOV.GetNameDef] e novos planos expansionistas, o processo foi interrompido. Enquanto o governo [GER.GetAdjective] se ocupa dos outros inimigos, temos que tentar retomar o diálogo."
 CZE_revive_the_czechoslovak_legion_dynamic: "[CZE_revive_the_czechoslovak_legion]"
 CZE_revive_the_czechoslovak_legion_default: "Reviver a Legião Tchecoslovaca"
 CZE_revive_the_czechoslovak_legion_communist: "Estabelecer uma organização voluntária"
 CZE_revive_the_czechoslovak_legion_dynamic_desc: "Uma nova agitação está surgindo no mundo, e os soldados corajosos d[ROOT.GetNameDef] estão prontos para defender a terra natal. Mas como o passado já provou, defender a terra natal pode exigir que as nossas tropas lutem no exterior e temos que reencontrar pessoas dispostas a deixar suas casas, justamente para defendê-las."
 CZE_revive_the_czechoslovak_legion_nsb_tt: "§Y$CZE_legacy_of_the_czechoslovak_legion_army_spirit$§! será convertido de um §YEspírito do Exército§! a um §YEspírito Nacional§!."
 CZE_state_sponsored_recruitment_for_spain: "Recrutamento com patrocínio estatal para a Espanha"
 CZE_state_sponsored_recruitment_for_spain_desc: "A intervenção de combatentes voluntários e experientes d[ROOT.GetNameDef] pode ser crucial para o novo conflito, portanto, devemos incentivá-los a apoiar o lado que mais se alinha às nossas políticas. Podemos até adquirir algum conhecimento sobre os avanços de guerra da última década."
 CZE_support_spain_reward_tt: "§YEfeitos se uma facção espanhola vencer ou perder um conflito tendo voluntários nossos em suas fileiras:§!"
 CZE_profit_off_the_spanish_civil_war: "Lucro da Guerra Civil Espanhola"
 CZE_profit_off_the_spanish_civil_war_desc: "A Guerra Civil Espanhola está se tornando uma guerra por procuração das maiores potências. Não devemos arriscar a vida das nossas tropas corajosas nesse conflito. Por outro lado, é a oportunidade perfeita para lucrarmos com a indústria bélica, vendendo armas para ambos os lados."
 CZE_skoda_sell_weapons_to_SPR_tt: "Desbloqueia as decisões: §YVender armas secretamente para a Facção Espanhola§!"
 CZE_placate_benes_faction: "Ceder à Facção de Beneš"
 CZE_placate_benes_faction_desc: "$CZE_milan_hodza$ precisa aceitar que seu mandato como Ministro das Relações Exteriores tem sido um fracasso. $CZE_edvard_benesh$ está pronto para intervir com seus apoiadores agrários e reforçar o cargo de $CZE_milan_hodza$ como primeiro-ministro, desde que ele desista do cargo de Relações Exteriores."
 CZE_claim_lands_of_the_bohemian_crown: "Reivindicar terras da Coroa Boêmia"
 CZE_claim_lands_of_the_bohemian_crown_desc: "Como a nossa nação fazia parte das terras fronteiriças de vários impérios nos séculos passados, as nossas fronteiras mudaram devido aos conflitos e não por vontade da população. Chegou a hora de corrigir essas mudanças."
 CZE_demand_katowice: "Exigir [762.GetName]"
 CZE_demand_katowice_desc: "Além de restaurar as nossas antigas fronteiras, obter o controle sobre [762.GetName] também enfraqueceria as reivindicações d[POL.GetNameDef] sobre [72.GetName]."
 CZE_fight_over_silesia: "Luta pela Silésia"
 CZE_fight_over_silesia_desc: "A Silésia pode até ser um território legítimo d[ROOT.GetNameDef], mas é melhor evitar uma guerra total contra [66.owner.GetNameDef]. Se demonstrarmos a nossa força em um intenso conflito fronteiriço, talvez seja possível dissuadir o exército d[66.owner.GetNameDef] a lutar para defender a Silésia e assim conquistar a região sem uma grande guerra."
 CZE_dismantle_poland: "Dissolver a [POL.GetNonIdeologyName]"
 CZE_dismantle_poland_desc: "A incapacidade d[POL.GetNameDef] de se defender está evidente e ela certamente não consegue formar um Estado-tampão confiável contra os nossos inimigos. Em vez disso, devemos agir para fortalecer o nosso próprio Estado."
 CZE_proclaim_the_restoration_of_bohemia: "Proclamar a restauração do Reino Boêmio"
 CZE_proclaim_the_restoration_of_bohemia_desc: "Com as nossas antigas fronteiras restauradas, podemos reivindicar o nosso legado e nos concentrar na integração das novas terras."
 CZE_integrate_lost_territories: "Integrar os territórios perdidos"
 CZE_integrate_lost_territories_desc: "As terras históricas do Reino Boêmio vão desde o Mar Báltico até o Adriático. É hora de recorrer a essa história enquanto integramos as novas posses."
 CZE_deepen_ties_with_puppet_kingdoms: "Intensificar laços com reinos fantoches"
 CZE_deepen_ties_with_puppet_kingdoms_desc: "Mesmo tendo uma ótima esfera de influência, precisamos intensificar ainda mais a nossa presença para tirar o máximo de proveito das nações aliadas."
 CZE_poland_alliance_monarchist: "Acordo com a [POL.GetNonIdeologyName]"
 CZE_poland_alliance_monarchist_desc: "$CZE_ally_poland_desc$"
 CZE_a_strong_poland: "Uma [POL.GetNonIdeologyName] forte"
 CZE_a_strong_poland_desc: "Com um dos exércitos mais fortes do leste europeu, o Estado [POL.GetAdjective] pode se tornar um aliado poderoso."
 CZE_mend_balkan_relations: "Restaurar as relações com os Balcãs"
 CZE_facilitate_a_strong_hungary: "Facilitar uma Hungria forte"
 CZE_facilitate_a_strong_hungary_desc: "Desde a sua independência, o Estado [HUN.GetAdjective] tem tido relações instáveis conosco. Com um conflito iminente, talvez possamos nos tornar aliados."
 CZE_subjegate_romania: "Pressionar a Romênia com reivindicações d[HUN.GetNameDef]"
 CZE_subjegate_romania_desc: "As reivindicações do nosso fantoche [HUN.GetAdjective] são úteis contra [ROM.GetNameDef]. Se ameaçarmos deixar o governo [HUN.GetAdjective] pressionar suas reivindicações sobre o território [ROM.GetAdjective] e ajudar em sua conquista, talvez possamos exigir a aliança d[ROM.GetNameDef]."
 CZE_demanded_overlordship_HUN: "Hungria subjugada"
 CZE_demanded_overlordship_ROM: "Romênia subjugada"
 CZE_integrate_hungary: "Integrar antigos territórios austríacos"
 CZE_integrate_hungary_desc: "Agora que estabelecemos uma grande esfera de influência, a integração d[HUN.GetNameDef] recém-ampliada e de outros territórios pode levar a uma restauração das fronteiras austro-húngaras, mas sob a liderança d[ROOT.GetNameDef]."
 CZE_subjegate_serbia: "Subjugação d[YUG.GetNameDef]"
 CZE_subjegate_serbia_desc: "O governo [YUG.GetAdjective], agora enfraquecido, não é mais um Estado-tampão eficiente para defender as nossas regiões ao Sul. Após a integração da Eslovênia, deveríamos nos concentrar em expandir ainda mais."
 CZE_strike_the_eastern_threat: "Atacar a ameaça oriental"
 CZE_strike_the_eastern_threat_desc: "Os líderes hipócritas d[SOV.GetNameDef] são uma verdadeira ameaça para [CZE.GetNameDef] e devem ser eliminados. Eles justificam suas ambições imperiais criticando o nosso governo."
 CZE_assist_austria: "Proteger [AUS.GetNameDef]"
 CZE_assist_austria_desc: "Deixar [AUS.GetNameDef] fora de conflitos é essencial para nossa segurança nacional. A fronteira com [AUS.GetNameDef] é um dos pontos mais vulneráveis das nossas defesas, e a economia do país seria um recurso valioso para os nossos inimigos, algo que não podemos permitir."
 CZE_return_to_democracy: "Retornar à democracia"
 CZE_return_to_democracy_desc: "Com o nosso lar protegido, a população está cada vez mais ciente de que uma ditadura militar não é mais eficiente. Portanto, é hora de organizar eleições e devolver o poder para uma administração civil democrática."
 CZE_cooperate_with_the_allies: "Cooperar com os aliados"
 CZE_cooperate_with_the_allies_desc: "Agora que há uma maior estabilidade na região, deveríamos tentar restaurar os laços com os nossos aliados tradicionais."
 CZE_eliminate_austrian_defeatists: "Acabar com os derrotistas d[AUS.GetNameDef]"
 CZE_eliminate_austrian_defeatists_desc: "O governo d[AUS.GetNameDef] desistiu de defender seu Estado. Temos que intervir agora, antes que os inimigos cheguem até nós."
 CZE_the_legacy_of_ottokar: "O legado de Ottokar"
 CZE_the_legacy_of_ottokar_desc: "O lendário Rei Ottokar II expandiu o reino boêmio até a Áustria e o Adriático com a aprovação dos nobres austríacos. Mais uma vez, devemos recorrer aos austríacos, tantos aos nobres quanto ao povo comum."
 CZE_demand_the_istrian_peninsula: "Exigir a península da Ístria"
 CZE_demand_the_istrian_peninsula_desc: "O fato de o território d[ROOT.GetNameDef] não ter saída para o mar tem sido um obstáculo para o nosso comércio e nossa influência há bastante tempo. Não podemos mais deixar nossa economia à mercê de países vizinhos. Temos que exigir acesso ao Adriático."
 CZE_demand_slovenia: "Exigir a Eslovênia"
 CZE_demand_slovenia_desc: "No passado, a Eslovênia foi uma parte notável do Império Austríaco. Agora que assumimos o controle do estado central desse império, devemos tentar reivindicar seu território mais uma vez."
 CZE_demand_overlordship_of_yugoslav_league: "Exigir soberania sobre a Liga d[YUG.GetNameDef]"
 CZE_demand_overlordship_of_yugoslav_league_desc: "Às vezes, uma nação multiétnica precisa de autonomia local para suas diferentes regiões, algo que sabemos tão bem quanto o governo [YUG.GetAdjective]. No entanto, a aliança d[YUG.GetNameDef] está fraca demais para se defender no momento. Nós temos que fazer com que eles reconheçam isso e nos permitam intervir."
 CZE_expand_the_rome_protocols: "Expandir os Protocolos de Roma"
 CZE_expand_the_rome_protocols_desc: "O nosso novo governo se alinha muito mais com o de [ITA.capital.GetCapitalVictoryPointName] do que com o de [GER.capital.GetCapitalVictoryPointName]. Com desavenças entre os dois sobre a Áustria, aderir aos Protocolos de Roma pode fazer com que o governo [ITA.GetAdjective] obtenha a confiança necessária para se manter no caminho atual, em vez de se alinhar com [GER.GetNameDef]."
 CZE_prague_protocols: "Protocolos de Praga"
 CZE_soviet_alliance: "Expandir o Tratado de Aliança de 1935"
 CZE_soviet_alliance_desc: "O atual tratado de aliança com [SOV.GetNameDef] é ambíguo demais para garantir a intervenção deles se estivermos sob ataque. Portanto, devemos propor um novo acordo se quisermos garantir a nossa segurança."
 CZE_airlift_soviet_support: "Apoio aéreo soviético"
 CZE_airlift_soviet_support_desc: "A falta de fronteiras com o nosso aliado [SOV.GetAdjective] originou a ideia de transportar tropas d[SOV.GetNameDef] pelo ar. Uma operação de transporte dessa escala nunca aconteceu, mas, com isso, as tropas d[SOV.GetNameDef] não teriam que entrar nos territórios vizinhos, pelos menos não por terra."
 CZE_unlocks_volunteer_transport_raid_tt: "Desbloqueia a §Yincursão§!:\nPonte aérea para voluntários soviéticos na §Y[73.GetName]§!"
 CZE_intervene_in_the_ussr: "Intervir na Guerra Civil d[SOV.GetNameDef]"
 CZE_intervene_in_the_ussr_desc: "Uma agitação tomou conta d[SOV.GetNameDef] outra vez. Embora a antiga família real que apoiávamos não vá retornar, a possibilidade de um governo mais amistoso não pode ser ignorada."
 CZE_forgive_trading_debts: "Perdoar dívidas de comércio"
 CZE_forgive_trading_debts_desc: "A instabilidade econômica e a Grande Depressão deixaram alguns dos nossos potenciais aliados em dívida conosco. Eles estão com dificuldades para pagá-la e isso está prejudicando as relações. O governo poderia perdoar essa dívida e compensar as empresas locais impactadas por essa ação."
 CZE_improve_balkan_trade_relations: "Melhorar a relações comerciais com os Balcãs"
 CZE_improve_balkan_trade_relations_desc: "O maior benefício de conquistar aliados nos Balcãs é a nossa economia. Deveríamos mostrar o nosso desejo de gastar recursos para melhorar a situação econômica dos nossos potenciais aliados."
 CZE_ally_austria: "Formar aliança com [AUS.GetNameDef]"
 CZE_ally_austria_desc: "Seu governo quase foi derrubado pelos nazistas há poucos anos. Portanto, o Estado [AUS.GetAdjective] deveria perceber os possíveis benefícios de cooperar com [ROOT.GetNameDef]."
 CZE_demand_the_czech_corridor: "Exigir o Corredor Tcheco"
 CZE_demand_the_czech_corridor_desc: "Enquanto transformamos a Pequena Entente em uma aliança de verdade, fica cada vez mais óbvio que mobilizar nossas tropas novamente até nossos aliados, ou receber as forças deles em nosso país, poderia ser uma empreitada muito difícil no caso de um conflito. Ter uma faixa de território conectando nossa nação e [YUG.GetNameDef], como já foi proposto após a Grande Guerra, poderia aumentar nossa segurança e proteger nosso comércio."
 CZE_ally_hungary: "Formar aliança com [HUN.GetNameDef]"
 CZE_ally_hungary_desc: "Apesar dos conflitos que abalaram as nossas relações com a [HUN.GetNonIdeologyName] desde o surgimento da [CZE.GetNonIdeologyName], eles têm demonstrado potencial para se tornarem aliados valiosos."
 CZE_ally_yugoslavia: "Formar aliança com [YUG.GetNameDef]"
 CZE_ally_yugoslavia_desc: "O Estado d[YUG.GetNameDef] pode ter passado por dificuldades econômicas recentemente, mas não podemos ignorar seus recursos estratégicos e sua localização."
 CZE_protect_neutrality: "Proteger a neutralidade"
 CZE_protect_neutrality_desc: "A Primeira Guerra Mundial deixou claro que tentar ser neutro é inútil se estivermos na mira do inimigo. Proteger essas nações significa forçar os inimigos a uma guerra em duas frentes durante a expansão, em vez de deixar que eles se dividam e conquistem."
 CZE_if_cooperate_with_moderate_socialists_completed_tt: "Efeitos da conclusão de §YCooperar com socialistas moderados§!:"
 CZE_mutual_protection_agreement_with_switzerland: "Acordo de Proteção com a [SWI.GetNonIdeologyName]"
 CZE_mutual_protection_agreement_with_switzerland_desc: "Estamos trabalhando com o governo d[SWI.GetNameDef] para garantir que uma invasão aos nossos territórios seja impossível sem perdas significativas pelas forças agressoras. Se cooperarmos, poderemos formar um exército não só capaz de defender nossas fronteiras, mas também de contra-atacar decisivamente."
 CZE_exchange_technology: "Cooperar na pesquisa"
 CZE_exchange_technology_desc: "Apesar da abundância de recursos naturais, os Balcãs não têm colônias lucrativas ou indústrias avançadas como as grandes potências. Portanto, é essencial cooperarmos na pesquisa para possibilitar um foco em nossas respectivas especialidades."
 CZE_demand_corridor_to_ussr: "Exigir um corredor para [SOV.GetNameDef]"
 CZE_demand_corridor_to_ussr_desc: "Se o governo d[POL.GetNameDef] não cooperar conosco, tomaremos medidas mais drásticas para garantir o acesso dos nossos aliados d[SOV.GetNameDef]."
 CZE_ally_poland: "Formar aliança com [POL.GetNameDef]"
 CZE_ally_poland_desc: "Com a guerra polaco-soviética ainda na memória e uma ameaça iminente no seu lado oeste, o governo d[POL.GetNameDef] está em busca de segurança, assim como nós. Devemos convencer o governo [POL.GetAdjective] de que a neutralidade não salvará o país e, portanto, o melhor seria formar uma aliança conosco."
 CZE_realize_the_polish_czechoslovak_confederation: "Criar uma confederação"
 CZE_realize_the_polish_czechoslovak_confederation_desc: "Apesar da sua resistência corajosa, o Estado [POL.GetAdjective] foi derrotado. Agora que seu governo foi exilado, surgiram ideias de formar uma aliança conosco. Se eles se unirem a nós, poderemos juntar o povo d[POL.GetNameDef] nesse novo Estado e coordenar esforços para liberar a nossa terra natal coletiva."
 CZE_integrate_western_ukrainians: "Integrar os ucranianos ocidentais"
 CZE_integrate_western_ukrainians_desc: "Os ucranianos d[CZE.GetNameDef] receberam uma ótima proposta de ajuda e autonomia. Agora podemos tentar integrar as terras recém-adquiridas à nossa província ucraniana."
 CZE_ally_russia: "Aliar-se à [SOV.GetNonIdeologyName]"
 CZE_ally_russia_desc: "Agora que o governo d[SOV.GetNameDef] está mais alinhado com o nosso, poderíamos tentar expandir o acordo vago assinado com seu governo anterior."
 CZE_claim_ukraine: "Estabelecer um governo ucraniano amigável"
 CZE_claim_ukraine_desc: "A Ucrânia é uma parte importante d[SOV.GetNameDef]. Se a dominarmos, poderemos formar um Estado-tampão poderoso."
 CZE_strengthen_the_little_entente: "Formalizar a Pequena Entente"
 CZE_strengthen_the_little_entente_desc: "Com o objetivo principal de conter a [HUN.GetNonIdeologyName], a Pequena Entente tem o potencial de se tornar uma aliança importante com um exército considerável."
 CZE_seek_french_leadership: "Buscar liderança d[FRA.GetNameDef]"
 CZE_seek_french_leadership_desc: "Apesar da nossa iniciativa para formar essa união, está claro que o exército da [FRA.GetNonIdeologyName] poderia ser uma ótima adição a qualquer aliança. Ainda que isso signifique ceder a liderança."
 CZE_increase_food_and_resource_imports: "Aumentar as importações de alimentos e recursos"
 CZE_increase_food_and_resource_imports_desc: "Os nossos novos aliados têm um setor agrícola forte, portanto, agora não precisamos subsidiar tanto nosso próprio setor. Se importarmos recursos baratos, poderemos economizar dinheiro e fomentar a economia dos nossos aliados."
 CZE_double_down_on_heavy_industry: "Reforçar a indústria pesada"
 CZE_double_down_on_heavy_industry_desc: "Os novos acordos com os nossos aliados nos permitirão direcionar nossa atenção às indústrias mais competitivas, como a nossa indústria bélica. Qualquer excedente pode ser vendido."
 CZE_neutralize_the_hungarian_threat: "Neutralizar a ameaça d[HUN.GetNameDef]"
 CZE_neutralize_the_hungarian_threat_desc: "O governo d[HUN.GetNameDef] é um obstáculo para o comércio com potenciais aliados do sul. Se ele se aliar aos nossos inimigos, isso deixará uma parte vital do nosso exército ocupado, apesar do impacto do Tratado de Trianon."
 CZE_cancel_anti_hungary_focus: "Recuou após a intervenção d[GER.GetNameDef]"
 CZE_ally_romania: "Formar aliança com [ROM.GetNameDef]"
 CZE_ally_romania_desc: "A nação d[ROM.GetNameDef] é certamente uma das mais autossuficientes da região, produzindo alimentos e petróleo valioso. Além de obter acesso aos recursos um do outro, uma aliança com o governo deles também negaria aos nossos inimigos as matérias-primas de que eles precisam para guerrear contra nós."
 CZE_divide_germany: "Dividir a Alemanha"
 CZE_divide_germany_desc: "É difícil conter a ameaça d[GER.GetNameDef] por conta própria. Portanto, precisamos buscar aliados que também estão preocupados com a expansão d[GER.GetNameDef] e que têm a força de vontade para se prevenir."
 CZE_if_FRA_ally_tt: "Efeitos se a §YFrança for monarquista§! e não estiver aliada a mais ninguém:"
 CZE_if_POL_ally_tt: "Efeitos da conclusão de §YUma Polônia forte§!, resultando em uma garantia por parte da [POL.GetNonIdeologyName]:"
 CZE_revolutionary_brigades: "Brigadas revolucionárias encontradas"
 CZE_revolutionary_brigades_desc: "Nossos revolucionários adquiriram experiência lutando pel[ROOT.GetNameDef]. Eles devem ser integrados ao exército regular."
 CZE_recruit_communist_exiles: "Recrutar exilados comunistas"
 CZE_recruit_communist_exiles_desc: "[ROOT.Capital.GetCapitalVictoryPointName] tem sido um abrigo para revolucionários exilados. O nosso governo poderia se aproveitar disso."
 CZE_destabilize_potential_adversaries: "Desestabilizar potenciais adversários"
 CZE_destabilize_potential_adversaries_desc: "Os comunistas exilados com quem trabalhamos têm um conhecimento sobre seu país de origem que nem os nossos espiões conseguem adquirir. Devemos usar esse conhecimento quando elaborarmos uma estratégia para libertar a terra natal deles."
 CZE_nationalize_key_industries: "Nacionalizar os bancos e minas"
 CZE_nationalize_key_industries_desc: "As minas fornecem a matéria-prima que a nossa indústria transforma em armas de guerra. Em tempos de crise, é preciso garantir que esses materiais sejam controlados pelo governo, e não por financiadores e industrialistas."
 CZE_rehabilitate_the_army: "Reabilitar o exército"
 CZE_rehabilitate_the_army_desc: "A maioria dos generais do exército [CZE.GetAdjective] é de veteranos da Legião Tchecoslovaca, notável por ter lutado contra os soviéticos em sua guerra civil. Será necessário garantir a lealdade deles ao novo governo [CZE.GetAdjective]."
 CZE_unlock_civil_war_army_generals_tt: "Recuperar comandantes perdidos na guerra civil"
 CZE_recruit_ideologically_aligned_generals: "Recrutar generais ideologicamente confiáveis"
 CZE_recruit_ideologically_aligned_generals_desc: "É hora de ajustar os nossos programas de treinamento e fortalecer o exército com novos candidatos que compreendam seus novos valores."
 CZE_recruit_communist_generic_general_tt: "Ganha um general comunista."
 CZE_purge_two_random_commanders_tt: "Dois comandantes aleatórios serão expurgados."
 CZE_czechoslovak_union: "União Tchecoslovaca"
 CZE_czechoslovak_union_desc: "A autonomia local deve aumentar n[CZE.GetNameDef]. Isso permitirá que o sistema comunista seja ajustado conforme as circunstâncias locais."
 CZE_continue_industrial_relocation_schemes: "Continuar com planos de realocação de arsenal"
 CZE_continue_industrial_relocation_schemes_desc: "Pelo bem da nossa segurança nacional, devemos continuar realocando as nossas fábricas mais vulneráveis para áreas em que estarão mais protegidas de ataques aéreos e terrestres. Não podemos arriscar que uma indústria tão importante fique em perigo."
 CZE_continue_industrial_relocation_schemes_tt: "Remove §Y1 Fábrica Militar§!."
 CZE_continue_industrial_relocation_schemes_2_tt: "§RAs fábricas precisarão ser reconstruídas.§!"
 CZE_establish_a_armament_factory_in_uhersky_brod: "Fundar a fábrica de armamentos de Uherský Brod"
 CZE_establish_a_armament_factory_in_uhersky_brod_desc: "A Uherský Brod Factory é uma fábrica de armamentos especializada em projetar armas automáticas para infantaria e aeronaves. O nosso plano é torná-la a fábrica mais avançada desse tipo no mundo."
 CZE_appeal_to_the_castle: "Recorrer ao castelo"
 CZE_appeal_to_the_castle_desc: "O \"castelo\" da Tchecoslováquia se refere à extensa rede de pessoas e organizações influentes que apoiam os presidentes do país. Em troca, esse poder permite aos presidentes exercer mais influência do que seus deveres constitucionais limitados sugerem. Recorrer ao apoio desse grupo impulsionaria bastante a nossa disputa pela liderança."
 CZE_petition_the_nobles: "Petição aos nobres"
 CZE_petition_the_nobles_desc: "A nobreza d[ROOT.GetNameDef] pode não ter mais títulos reconhecidos, mas ainda é influente na sociedade. Sua ajuda nos daria legitimidade e os recursos necessários para conquistar mais apoio."
 CZE_unify_the_fascist_parties: "Unificar os partidos fascistas"
 CZE_unify_the_fascist_parties_desc: "O cenário dos partidos fascistas está desestabilizado, com alguns tão extremos que talvez nunca recebam um apoio significativo. Em defesa da nação, é necessário que esses partidos se unam e criem um panorama da Tchecoslováquia que não atraia apenas os extremistas."
 CZE_pro_rearmament_propaganda: "Propaganda pró-rearmamento"
 CZE_pro_rearmament_propaganda_desc: "Para aumentar o apoio a um governo mais centralizado, precisamos destacar a atual situação frágil do mundo ao nosso redor. Isso também ajudará a motivar as pessoas para que apoiem os planos de fortalecimento do exército quando for necessário."
 CZE_align_nationalist_parties: "Alinhar-se aos partidos nacionalistas tchecos"
 CZE_align_nationalist_parties_desc: "Embora devêssemos tentar recorrer a todo mundo d[ROOT.GetNameDef], não podemos negar que os partidos nacionalistas tchecos tradicionais são os mais influentes do cenário político, e é com eles que podemos conseguir apoio mais facilmente."
 CZE_align_slovak_catholics: "Alinhar-se aos católicos eslovacos"
 CZE_align_slovak_catholics_desc: "Atualmente, os partidos católicos e nacionalistas têm muito apoio na Eslováquia. Seria difícil recorrer aos nacionalistas sem fazer grandes concessões, mas talvez consigamos atrair os católicos para a nossa causa."
 CZE_jozef_tiso_tt: "Nomear o conselheiro §Y$CZE_jozef_tiso$§!"
 CZE_align_catholic_parties: "Alinhar-se ao CSL"
 CZE_align_catholic_parties_desc: "O CSL e outros partidos católicos foram a base de apoio tradicional para o sistema monárquico do Império Austro-Húngaro. É hora de tentar convencê-los a assumir essa função novamente."
 CZE_restore_the_monarchy: "Restaurar a monarquia"
 CZE_restore_the_monarchy_desc: "Agora que conseguimos apoio para um novo sistema, é hora de apresentar a ideia refinada para a população. Com $CZE_karel_schwarzenberg$ escolhido como monarca, recorremos aos antigos e novos apoiadores da monarquia, já que o monarca proposto é [ROOT.GetAdjective], em vez de ser [AUS.GetAdjective] como nos foi imposto antes."
 CZE_semi_constitutional_monarchy: "Um sistema semiconstitucional"
 CZE_semi_constitutional_monarchy_desc: "Agora que um monarca foi eleito, precisamos ajustar a constituição. Embora algumas pessoas defendam a centralização de poder para evitar lutas internas nesses tempos difíceis, está claro que o monarca não consegue fazer tudo sozinho. Portanto, pode ser melhor manter o sistema atual de forma parcial para ajudar na administração do país e ter o monarca para guiá-lo."
 CZE_restore_noble_titles: "Restaurar os títulos de nobreza"
 CZE_restore_noble_titles_desc: "Os títulos de nobreza foram anulados após a criação da república. É hora de restaurá-los para recompensar a cooperação dos nobres. Isso também nos permitirá conceder títulos honorários para heróis, como oficiais veteranos que lutaram inúmeras vezes pelo Estado [Root.GetAdjective]."
 CZE_restore_the_austro_hungarian_customs_union: "Restaurar a união aduaneira do império"
 CZE_restore_the_austro_hungarian_customs_union_desc: "Uma das inegáveis vantagens do Império Austro-Húngaro eram as poucas barreiras comerciais impostas à nossa indústria. Restaurar essa união seria o primeiro passo para atrair os antigos países que a constituíam para a nossa esfera."
 CZE_customs_union: "União aduaneira"
 CZE_catholic_focus: "Foco católico"
 CZE_catholic_focus_desc: "Apesar de os hussitas serem famosos na história d[ROOT.GetNameDef], muitos ainda têm crenças católicas. Podemos nos aproveitar disso se aumentarmos o papel deles na sociedade."
 CZE_hussite_legacy: "Legado hussita"
 CZE_hussite_legacy_desc: "Além de promover um cristianismo mais protestante, os hussitas também defenderam a tolerância de outras opiniões nesse assunto, diferente dos tiranos que guerrearam contra eles."
 CZE_align_with_germany: "Alinhar-se à [GER.GetNonIdeologyName]"
 CZE_align_with_germany_desc: "O novo governo d[GER.GetNameDef] pode não ser necessariamente menos expansionista, mas talvez seja mais pragmático para escolher com quem formará alianças e a quem denunciará. Temos que nos esforçar para estar no primeiro grupo."
 CZE_rally_against_germany: "Comício contra a [GER.GetNonIdeologyName]"
 CZE_rally_against_germany_desc: "Os tchecoslovacos lutaram bravamente por sua independência. Agora, devemos recorrer a todo o nosso povo para proteger essa conquista."
 CZE_integrate_sudeten_germans: "Integrar a Região dos Sudetas"
 CZE_integrate_sudeten_germans_desc: "A divisão entre a população da Região dos Sudetas não ajuda ninguém. Temos que nos atentar às preocupações do povo e tentar resolvê-las. Isso pode acabar com qualquer figura de independência, já que seria difícil acreditar em alegações de opressão."
 CZE_cooperate_with_the_sdp: "Cooperar com o SdP"
 CZE_cooperate_with_the_sdp_desc: "Embora seja uma força desestabilizadora, o SdP pode entrar na linha se for devidamente incentivado, por exemplo, com sua inclusão na coalizão de governo."
 CZE_revive_the_december_bloc: "Restaurar o Bloco de Dezembro"
 CZE_revive_the_december_bloc_desc: "O Bloco de Dezembro, composto por partidos minoritários, fascistas ou de direita e que se opunham à eleição de Edvard Benes como presidente, deveria ser restaurado para proporcionar uma alternativa ao governo atual."
 CZE_revert_1926_anti_military_laws: "Reverter as leis antimilitares de 1927"
 CZE_revert_1926_anti_military_laws_desc: "Após uma tentativa de golpe de $CZE_radola_gajda$, o exército e a guarda nacional perderam o direito ao voto, além de outros privilégios. Como a participação do exército é essencial nesses tempos difíceis, seria justo removermos essas restrições e desfazer a divisão entre o exército e a política."
 CZE_bop_to_fascism_support_tt: "Adicionar um terço do valor de §Y$CZE_bop_army_readiness$§! para apoio ao fascismo:"
 CZE_power_to_the_military: "Poder para o exército"
 CZE_power_to_the_military_desc: "Está claro que nenhum recurso deve ser poupado na defesa da nação. Assim, é essencial que as pessoas no poder entendam as necessidades do exército. A melhor forma de isso acontecer é com um governo militar."
 CZE_militarize_the_associations: "Militarizar as associações"
 CZE_militarize_the_associations_desc: "As diversas associações d[CZE.GetNameDef] poderiam contribuir para a defesa das nações ensinando habilidades essenciais para os soldados, mesmo antes de a população ser mobilizada."
 CZE_aggressive_foreign_policy: "Política estrangeira agressiva"
 CZE_aggressive_foreign_policy_desc: "A era de frágeis pactos de confiança acabou. Temos que agir decisivamente para garantir a nossa segurança, mesmo que isso exija grandes sacrifícios."
 CZE_work_with_germany: "Trabalhar com [GER.GetNameDef]"
 CZE_work_with_germany_desc: "Agora que a questão dos sudetas foi resolvida, talvez o governo d[GER.GetNameDef] possa reconhecer o valor que uma aliança com [ROOT.GetNameDef] teria."
 CZE_control_the_associations: "Controlar as associações"
 CZE_control_the_associations_desc: "A [CZE.GetNonIdeologyName] tem muitas organizações, desde pessoas que compartilham o mesmo emprego até interesses de lazer e associações esportivas. Quem controlar isso, controlará grande parte da sociedade."
 CZE_diversify_bata: "Diversificar a Bat'a"
 CZE_diversify_bata_desc: "A Bat'a é uma grande empresa de bens de consumo que poderíamos usar para nosso benefício em nossa cadeia de suprimentos de recursos. Ela pode nos ajudar a obter os materiais essenciais que são difíceis de conseguir por outros meios."
 CZE_devaluate_the_koruna: "Desvalorizar a Koruna"
 CZE_devaluate_the_koruna_desc: "Para um país com uma economia tão dependente de exportações, ter uma moeda forte é uma situação perigosa. O enfraquecimento da nossa moeda pode gerar prejuízos a curto prazo, mas no longo prazo pode acabar sendo melhor."
 CZE_continue_the_central_bohemia_plan: "O plano da Boêmia Central"
 CZE_continue_the_central_bohemia_plan_desc: "Continuar com o nosso plano de expandir as áreas industriais no centro do país nos permitiria obter vantagens de economias de escala. Expandir a nossa indústria em um lugar distante das nossas fronteiras também seria inteligente, partindo de uma perspectiva de segurança nacional."
 CZE_balance_industrial_invevestments: "Equilibrar os esforços de desenvolvimento industrial"
 CZE_balance_industrial_invevestments_desc: "Deixar áreas fora de [9.GetName] e [75.GetName] subdesenvolvidas é um dos motivos de o nosso país ter começado a se dividir no início da década. As áreas em crescimento no exterior do nosso país poderiam ajudar a preencher as lacunas do desenvolvimento industrial entre as duas regiões."
 CZE_expand_prf_science_facilities: "Expandir as instalações científicas da PrF"
 CZE_expand_prf_science_facilities_desc: "As instalações científicas da PrF estão repletas de pessoas geniais que aguardam pela oportunidade de fazer algo maior do que fazem agora. Expandir o departamento e colocá-las para trabalhar no governo é um bom começo para aprimorar a nossa pesquisa."
 CZE_raise_more_industrial_funds: "Arrecadar mais fundos industriais"
 CZE_raise_more_industrial_funds_desc: "Desde a época da Áustria-Hungria até os dias de hoje, a indústria tem sido o coração da nossa nação. Se providenciarmos orçamentos e financiamentos essenciais, ela continuará prosperando nessa Europa conturbada."
 CZE_skoda_priority_focus_info_tt: "Alguns §YFocos Nacionais§! exigirão um Foco de £GFX_CZE_skoda_text_icon §YPrioridade da Škoda§! específico para serem concluídos. Esses focos são indicados por um pequeno ícone relacionado à £GFX_CZE_skoda_text_icon §YPrioridade da Škoda§! necessária."
 CZE_joint_stock_schemes: "Planos de capital aberto"
 CZE_joint_stock_schemes_desc: "Planos de capital aberto têm sido uma fonte de crescimento econômico quando temos poucas fontes de financiamento tradicionais. Se continuarmos usando essas táticas, nossa economia pode crescer ainda mais."
 CZE_the_slovak_arrow: "A flecha eslovaca"
 CZE_the_slovak_arrow_desc: "Desenvolver uma automotriz rápida entre as nossas duas maiores cidades pode ser um grande motivo de orgulho nacional. Isso também seria uma boa desculpa para melhorar a infraestrutura ferroviária."
 CZE_finish_double_tracking_efforts: "Esforços de duplicação"
 CZE_finish_double_tracking_efforts_desc: "Concluir os esforços para duplicar algumas das nossas linhas ferroviárias secundárias importantes possibilitará um melhor rendimento delas. Além disso, teremos uma melhor conectividade entre algumas das nossas cidades secundárias."
 CZE_realize_motorway_proposals: "Concretizar propostas de rodovias"
 CZE_realize_motorway_proposals_desc: "Nosso governo recebeu algumas propostas de rodovias que melhorariam muito a conectividade entre as fronteiras. Temos que validar essas propostas e concretizar esses projetos."
 CZE_build_additional_rail_stations: "Construir estações ferroviárias adicionais"
 CZE_build_additional_rail_stations_desc: "Com a nossa infraestrutura ferroviária recém-desenvolvida, algumas das nossas estações existentes não suportam o aumento no rendimento. O aprimoramento delas aumentaria bastante a nossa capacidade de transportar pessoas e mercadorias para os destinos necessários."
 CZE_build_additional_rail_stations_focus_cost_tt: "Escolher §Y$CZE_devaluate_the_koruna$§! reduzirá para §G35§! dias o tempo necessário para concluir este foco."
 CZE_grow_ckd_secondary_facilities: "Instalações secundárias da CKD"
 CZE_grow_ckd_secondary_facilities_desc: "A CKD tem várias instalações secundárias que produzem alguns importantes produtos industriais, como geradores elétricos. A expansão dessas instalações ajudaria no crescimento da nossa indústria pesada."
 CZE_bolster_domestic_construction: "Fomentar a construção nacional"
 CZE_bolster_domestic_construction_desc: "O nosso setor nacional de construção tem tido um crescimento constante desde a nossa independência após a Grande Guerra. Se concedermos fundos para algumas empreiteiras de médio porte, o setor pode crescer ainda mais."
 CZE_invest_in_vhht: "Investir na VHHT"
 CZE_invest_in_vhht_desc: "A VHHT é uma empresa com várias instalações de metalurgia em nosso país. Investir na expansão delas nos ajudaria a aprimorar diversas áreas da nossa produção de metal no futuro."
 CZE_expand_vitkovice_ironworks: "Expandir a Siderúrgica de Vítkovické"
 CZE_expand_vitkovice_ironworks_desc: "A Siderúrgica de Vítkovické é uma importante fornecedora de ferro em [74.GetName]. Sua expansão aumentaria significativamente o rendimento da instalação."
 CZE_expand_central_bohemian_mines: "Expandir as minas da Boêmia Central"
 CZE_expand_central_bohemian_mines_desc: "As minas localizadas no centro de nosso país são as mais importantes para nossa segurança energética. Devemos expandi-las o quanto antes."
 CZE_increase_bauxite_imports: "Aumentar importações de bauxita"
 CZE_increase_bauxite_imports_desc: "Nosso país pode ser não ser rico em alumínio, mas se usarmos alguns processos de refinamento e aumentarmos as importações de bauxita, poderemos produzir uma pequena quantidade desse recurso aqui mesmo. Isso ajudaria a abrandar a escassez de recursos."
 CZE_merge_the_oil_companies: "Fundir as petrolíferas"
 CZE_merge_the_oil_companies_desc: "As nossas petrolíferas mal podem ser chamadas assim. Elas são pequenas corporações construídas ao redor de alguns poços. Se fundirmos todas as empresas e as estatizarmos, poderemos fazer mais com menos em nossa indústria petrolífera."
 CZE_expand_trinec_ironworks: "Siderúrgica de Trinec"
 CZE_expand_trinec_ironworks_desc: "A Siderúrgica de Trinec tem sido uma gigante da indústria de [72.getname] desde a sua fundação. Se ela tivesse mais investimentos, receberíamos mais dividendos da sua produção de recursos."
 CZE_consolidate_mining_operations: "Consolidar operações de mineração"
 CZE_consolidate_mining_operations_desc: "As nossas operações de mineração poderiam ser mais otimizadas se as administrações dessas empresas fossem combinadas para aumentar sua eficiência. Assim, suas pesquisas e trabalhos possibilitariam a expansão das minas existentes, deixando-as mais produtivas."
 CZE_expand_praga: "Contratos de Praga"
 CZE_expand_praga_desc: "Praga tem sido fonte de vários componentes para a nossa indústria militar há vários anos. Seria sensato recompensá-la com mais contratos para que cresça ainda mais."
 CZE_shrink_educational_disparities: "Reduzir as desigualdades educacionais"
 CZE_shrink_educational_disparities_desc: "A educação oferecida em nossas áreas rurais tem sido menos adequada em relação a da área urbana. Precisamos combater essas desigualdades com grandes programas educacionais regionais."
 CZE_kickstart_rapid_rearmanent: "Impulsionar um rearmamento rápido"
 CZE_kickstart_rapid_rearmanent_desc: "Muitos políticos e empresários podem considerar isso uma péssima decisão, mas precisamos começar o rearmamento agora. Os países ao nosso redor não estão se desarmando, na verdade estão fazendo o oposto e isso é um segredo conhecido. Precisamos preparar o nosso exército enquanto ainda temos tempo."
 CZE_keep_focus_on_weapon_exports: "Manter o foco na exportação de armas"
 CZE_keep_focus_on_weapon_exports_desc: "As nossas grandes indústrias de exportação de armas nos tiraram da crise econômica. Se ignorarmos isso, correremos riscos políticos e econômicos. O melhor a se fazer é seguir nesse caminho. Qualquer ameaça contra nós é exagerada, de qualquer forma."
 CZE_force_the_industrialists_hand: "Passar por cima dos industrialistas"
 CZE_force_the_industrialists_hand_desc: "Os industrialistas e os conglomerados têm refreado a nossa capacidade de rearmamento há bastante tempo. É hora de nós decidirmos por eles, pelo bem da nação."
 CZE_embrace_corporatism: "Adotar o corporativismo"
 CZE_embrace_corporatism_desc: "Poderíamos negociar com os industrialistas para que nos ajudem a recomeçar o rearmamento se concordarmos com algumas condições deles. Seria mais do que sensato fazer algumas alterações nas políticas, além de ser do nosso interesse."
 CZE_expand_existing_armory_plants: "Expandir instalações de arsenal existentes"
 CZE_expand_existing_armory_plants_desc: "Mudar alguns locais dos nossos arsenais atuais seria um investimento oneroso com poucos ganhos a longo prazo. Expandir as nossas instalações existentes traria benefícios e oportunidades para aumentar a produção, a pesquisa e o desenvolvimento nesses locais, mesmo que essas áreas sejam mais vulneráveis a ataques de possíveis inimigos."
 CZE_expand_skoda_offices: "Expandir as filiais da Škoda"
 CZE_expand_skoda_offices_desc: "As nossas filiais internacionais movem as vendas das nossas armas. Expandi-las para novos locais é uma decisão sensata."
 CZE_skoda_office_unlock_tt: "Desbloqueia a decisão: §YConstruir filial de vendas de armas§!"
 CZE_complete_the_power_grid: "Concluir a rede elétrica"
 CZE_complete_the_power_grid_desc: "A rede elétrica das nossas áreas rurais precisa de melhorias. Ela não se equipara ao resto do país e é um obstáculo ao progresso econômico."
 CZE_build_the_slapy_reservoir: "Construir o Reservatório de Slapy"
 CZE_build_the_slapy_reservoir_desc: "Construir uma barragem perto de Slapy proporcionaria uma grande geração de energia e oportunidades econômicas na área. O aumento de geração de energia ajudaria bastante no crescimento da nossa indústria na região."
 CZE_diversify_refinery_processes: "Diversificar os processos de refino"
 CZE_diversify_refinery_processes_desc: "Os nossos poços poderiam produzir uma grande diversidade de produtos derivados do petróleo. O único problema é que não temos conhecimento suficiente para isso acontecer. Se investirmos em pesquisas para descobrirmos os processos, poderemos realizar esse sonho."
 CZE_enlarge_smaller_wells: "Ampliar os poços menores"
 CZE_enlarge_smaller_wells_desc: "Apesar do tamanho, nossos poços menores podem produzir muito mais do que a quantidade irrisória de petróleo que produzem atualmente. Só precisamos investir tempo para tornar isso realidade."
 CZE_develop_sudetenland_resources: "Desenvolver recursos da Região dos Sudetas"
 CZE_develop_sudetenland_resources_desc: "A Região dos Sudetas tem vários depósitos de recursos que não estamos aproveitando. Seria um erro não investir na construção de mais minas na área."
 CZE_grow_tatras_capabilities: "Aumentar as capacidades da Tatra"
 CZE_grow_tatras_capabilities_desc: "O pequeno departamento de tanques da Tatra tem alguns projetos de produção engenhosos. Se concedermos mais recursos, eles poderão continuar inovando nos projetos de blindados."
 CZE_bailout_moser: "Resgate financeiro da Moser"
 CZE_bailout_moser_desc: "A Moser tem passado por dificuldades com a Grande Depressão. Suas indústrias precisam de resgate financeiro, as instalações precisam reabrir e pessoas que foram demitidas têm que voltar a trabalhar."
 CZE_merge_skodas_consumer_good_plants: "Fundir as instalações de bens de consumo da Škoda"
 CZE_merge_skodas_consumer_good_plants_desc: "A Škoda tem várias instalações pequenas de bens de consumo que não estão centralizadas, algo que ajudaria a otimizar a produção em várias áreas. Isso também poderia gerar outros efeitos positivos para a Škoda."
 CZE_giant_of_central_europe_industry: "Gigante da indústria"
 CZE_giant_of_central_europe_industry_desc: "Alcançando patamares que pareciam impossíveis, agora somos uma gigante da indústria na Europa!"
 CZE_continue_armed_force_reform: "Continuar a reforma das Forças Armadas"
 CZE_continue_armed_force_reform_desc: "Se continuarmos modernizando as nossas forças armadas conforme os planos e reatribuindo regiões militares para os nossos quartéis provinciais, teremos uma melhor coordenação em qualquer conflito possível."
 CZE_air_force_officer_recruitment: "Recrutamento de oficiais para a Força Aérea"
 CZE_air_force_officer_recruitment_desc: "Com cursos de voo e exercícios de tiro com munição real, os clubes de aviação nos estados, em colaboração com a Escola de Oficiais da Reserva da Força Aérea, atendem à demanda crítica por oficiais da reserva."
 CZE_national_defense_act: "Ato de Defesa Nacional"
 CZE_national_defense_act_desc: "Este ato de defesa engloba todas as medidas, militares ou não, para combater qualquer ameaça ou ataque à soberania, integridade, união e segurança da nossa nação, sob supervisão do Conselho Supremo de Defesa Nacional (NROS)."
 CZE_car_and_oil_rationing: "Racionamento de carros e petróleo"
 CZE_car_and_oil_rationing_desc: "Racionar os veículos motorizados particulares e os solicitar conforme necessário nos permitiria concentrar a produção automotiva e os recursos de petróleo para as demandas militares."
 CZE_expand_airfield_capacity: "Expandir a capacidade do aeródromo"
 CZE_expand_airfield_capacity_desc: "O 3º Departamento de Aviação planejou novos aeródromos e hangares para operar, armazenar e consertar nossas aeronaves adequadamente, além de terem dormitórios para os esquadrões e equipes terrestres recém-formadas."
 CZE_trust_in_old_guard: "Confiança na Velha Guarda"
 CZE_trust_in_old_guard_desc: "A experiência e as habilidades aéreas da Grande Guerra serão transmitidas para a nova geração pelos veteranos, em quem confiamos plenamente."
 CZE_expand_the_aero_clubs: "Expandir os clubes de aviação"
 CZE_expand_the_aero_clubs_desc: "Os clubes de aviação se provaram úteis ao fornecer um fluxo constante de pilotos talentosos para o nosso país. Deveríamos expandi-los ainda mais."
 CZE_invest_in_the_smaller_air_plants: "Investir em fabricantes menores de aeronaves"
 CZE_invest_in_the_smaller_air_plants_desc: "Investir em novos fabricantes menores de aeronaves cria a concorrência necessária para as empresas existentes. Eles poderiam ajudar a atender às nossas demandas de produção maiores."
 CZE_continue_avia_expansion: "Continuar a expansão da Avia"
 CZE_continue_avia_expansion_desc: "Investir na Avia proporciona as ferramentas necessárias para fortalecer ainda mais sua capacidade de produção. Isso pode ampliar a eficiência da fabricação de fuselagens, que são muito requisitadas."
 CZE_increase_military_aeronautical_institute_funding: "Aumentar o financiamento da aeronáutica militar"
 CZE_increase_military_aeronautical_institute_funding_desc: "A construção de mais instalações para o Instituto de Pesquisa e Testes Aeroespaciais (VZLÚ) proporcionaria mais ideias para a aerodinâmica, desenvolvendo e aperfeiçoando nossos projetos de aeronaves."
 CZE_air_training_abroad: "Treinamento aéreo no exterior"
 CZE_air_training_abroad_desc: "Se enviarmos estagiários para as agências aéreas das nações com quem temos boas relações, ganharemos conhecimentos valiosos de diversas perspectivas e experiências em primeira mão quando eles retornarem para servir."
 CZE_establish_air_defense_zones: "Estabelecer Zonas de Defesa Aérea"
 CZE_establish_air_defense_zones_desc: "Poderíamos alocar as nossas novas baterias antiaéreas em fábricas e pontos estratégicos e estabelecer Zonas de Defesa Aérea com postos de comunicação em nível territorial para otimizar a precisão antiaérea."
 CZE_establish_air_defense_zones_enable_tt: "Habilita §YZonas de Defesa Aérea§!"
 CZE_establish_air_defense_zones_tt: "Fator de chance de acerto antiaéreo estático: §G+10%§!"
 CZE_the_air_is_our_sea: "O ar é nosso mar"
 CZE_the_air_is_our_sea_desc: "Os pilotos são capacitados para voar com coragem e confiança por meio de um treinamento sistemático. \"Não temos portos marítimos nem navios. O ar é nosso mar.\""
 CZE_bring_kramer_and_lobel_under_state_control: "Estatizar a Kramer & Löbl"
 CZE_bring_kramer_and_lobel_under_state_control_desc: "Se estatizarmos a Kramer & Löbl, poderemos garantir pesquisas contínuas e entregas oportunas de suprimentos elétricos e acessórios de rádio essenciais."
 CZE_second_to_none: "Inferior a ninguém"
 CZE_second_to_none_desc: "Os projetos de aeronaves das nossas indústrias estão cada vez melhores. Com mais pesquisa, nossos projetos não serão inferiores a nenhum outro no mundo."
 CZE_diversify_airframe_production: "Diversificar a produção de fuselagem"
 CZE_diversify_airframe_production_desc: "Não podemos apenas depender dos nossos combatentes para resolver as coisas no ar. Outras aeronaves e fuselagens maiores são necessárias para cumprir outros tipos de missão."
 CZE_projekt_l_52: "Projeto L 52"
 CZE_projekt_l_52_desc: "A tecnologia de motor a jato é o futuro da força aérea, mas ainda é um pouco rudimentar. No entanto, podemos investir um tempo para desenvolver um projeto dedicado e criar uma fuselagem feita para a nova tecnologia, assim estaremos em vantagem."
 CZE_fund_vladimir_mandl_research: "Financiar a pesquisa de Vladimir Mandl"
 CZE_fund_vladimir_mandl_research_desc: "Um advogado chamado $CZE_vladimir_mandl$ está fascinado pela ideia de tecnologia de foguetes. Se trabalharmos juntos e providenciarmos os recursos de que ele precisa para transformar sua pesquisa em tecnologia usável, poderemos ter grandes benefícios com essa parceria."
 CZE_mobilize_the_reserves: "Mobilizar as reservas"
 CZE_mobilize_the_reserves_desc: "A tensão em nossa fronteira é preocupante. Precisamos convocar reservistas e especialistas militares pré-selecionados conforme nossos planos de mobilização."
 CZE_three_kings: "Três reis"
 CZE_three_kings_desc: "Se declarássemos nossa ajuda aos grupos de resistência em caráter oficial, a habilidade deles de causar danos ao exército inimigo aumentaria bastante. Isso também poderia ajudar o nosso exército no campo."
 CZE_form_the_state_defense_guard: "Formar a Guarda de Defesa do Estado"
 CZE_form_the_state_defense_guard_desc: "Com o estabelecimento da SOS, temos uma organização especializada em proteger as nossas grandes fronteiras. Desde que os membros da guarda estejam organizados e treinados militarmente, eles servirão como primeira linha de defesa contra qualquer incursão na fronteira."
 CZE_expand_the_horska_divisions: "Expandir a Horská Divize"
 CZE_expand_the_horska_divisions_desc: "Como o relevo de nosso país consiste principalmente de colinas baixas e planaltos, os nossos soldados especialmente treinados para guerras em montanhas serão essenciais nesses terrenos difíceis."
 CZE_develop_horska_artillery: "Desenvolver a artilharia Horské Dělostřelectvo"
 CZE_develop_horska_artillery_desc: "Se modificarmos a nossa artilharia atual para que seja leve e desmontável, vamos garantir que as nossas tropas tenham poder de fogo suficiente em colinas e terrenos montanhosos."
 CZE_develop_horska_artillery_tech_tt: "Habilita a §YArtilharia Horská§!\n§YArtilharia (Montanhas)§!\n  Ataque: §G+10%§!\n  Movimento: §G+10%§!\n§YArtilharia (Colinas)§!\n  Ataque: §G+10%§!\n  Movimento: §G+10%§!"
 CZE_bribery_investigations: "Investigações de propinas"
 CZE_bribery_investigations_desc: "Recebemos uma carta anônima referente às refeições e ao tratamento de soldados. Algumas provas indicam uma conduta inadequada de certos oficiais do quartel-general. Precisamos acabar com isso antes que haja grandes prejuízos para o exército."
 CZE_bribery_investigations_remove_effect_tt: "Esse espírito nacional será removido quando o foco \"§Y$CZE_bribery_investigations$§!\" for concluído"
 CZE_opl_exercises: "Exercícios de OPL"
 CZE_opl_exercises_desc: "Ao conduzirmos treinamentos de defesa antiaérea (OPL), o nosso exército poderá praticar manobras com melhor coordenação e preservação. Isso aprimoraria a movimentação e a segurança geral da tropa."
 CZE_rapid_response_divisions: "Divisão Rápida"
 CZE_rapid_response_divisions_desc: "Exércitos estrangeiros têm demonstrado o impacto de uma unidade móvel capaz de se reposicionar mais rápido que o inimigo, destacando seu potencial. Poderíamos estabelecer unidades similares para uma avaliação."
 CZE_redouble_tank_development_efforts: "Redobrar os esforços de desenvolvimento de tanques"
 CZE_redouble_tank_development_efforts_desc: "O nosso projeto de tanques leves atual pode ser melhorado se comparado aos de outros usuários de blindagem na Europa. Temos que redobrar nossos esforços para garantir que estejamos no mesmo nível deles."
 CZE_rearmed_and_retooled: "Rearmados, readaptados"
 CZE_rearmed_and_retooled_desc: "Os nossos atuais chassis de tanques pesados podem ser modernizados. Precisamos continuar explorando essa direção para alcançar a expansão da divisão de blindados."
 CZE_establish_the_fall_backlines: "Estabelecer as linhas de retirada"
 CZE_establish_the_fall_backlines_desc: "Precisamos ser realistas quanto ao fato de que a nossa defesa falhará em alguns lugares. Se isso acontecer, a existência de linhas de retirada preparadas fará a diferença entre a vitória e a derrota."
 CZE_establish_the_fall_backlines_masterful_delay_tactic_tt: "\nHabilita a tática: §Y$tactic_masterful_delay$§!"
 CZE_anti_tank_development: "Desenvolvimento de arma antitanque"
 CZE_anti_tank_development_desc: "Com mais exércitos usando forças blindadas cada vez maiores, é essencial melhorarmos as nossas armas antitanques. Poder enfrentar tanques com peças de campo é a diferença entre reprimir o inimigo e deixá-lo avançar."
 CZE_anti_tank_development_tech_tt: "Habilita §YMelhorias Antitanque§!\nPerfuração da §YArtilharia§!: §G+5%§!\nPerfuração da §YArtilharia de Apoio§!: §G+5%§!\nPerfuração de §YAntitanque§!: §G+5%§!\nPerfuração de §YAntitanque de Apoio§!: §G+5%§!"
 CZE_recon_in_force: "Reconhecimento em força"
 CZE_recon_in_force_tech_tt: "Habilita §YReconhecimento em Força§! \n§YReconhecimento§!: Vida: §G+5§!\nReconhecimento: §G+10%§!."
 CZE_recon_in_force_desc: "Uma forma inestimável de obter informações é fazer com que o nosso grupo de reconhecimento faça contato com o inimigo enquanto sonda suas defesas."
 CZE_integrate_fortification_engineers: "Integrar engenheiros de fortificação"
 CZE_integrate_fortification_engineers_desc: "Quando os nossos engenheiros de fortificações do exército não estiverem construindo fortificações estáticas, poderemos posicioná-los rapidamente nas ações de linha de frente para melhorar as nossas defesas. Isso ajudaria as forças na linha de frente a criar melhores estruturas de defesa temporárias para as nossas tropas."
 CZE_integrate_fortification_engineers_tech_tt: "Habilita §YEngenheiros de Fortificação Integrados§!\n§YCompanhia de Engenharia§!:\nEntrincheiramento §G+10%§!.\n§Y(Forte)§!\n Defesa §G+10%§!"
 CZE_concealment_efforts: "Esforços de camuflagem"
 CZE_concealment_efforts_desc: "O amplo uso de ataques terrestres e aviões de reconhecimento transformaram as táticas de camuflagem em uma necessidade. Precisamos fortalecer os esforços para garantir que as nossas tropas fiquem bem camufladas no campo."
 CZE_concealment_efforts_tech_tt: "Habilita §YCamuflagem Melhorada§! \n§YInfantaria a Pé (Floresta)§!\n Defesa: §G+10%§!"
 CZE_elevate_the_vsv: "Impulsionar o Colegiado de Guerra"
 CZE_elevate_the_vsv_desc: "Ser o cérebro do exército é uma imensa responsabilidade nacional e do Estado. Assim, o serviço de Estado-Maior exige oficiais da melhor qualidade em termos de treinamento profissional, além de confiabilidade, autocontrole, boa conduta e caráter."
 CZE_continue_with_snejdareks_plan_dynamic: "[CZE_continue_with_snejdareks_plan]"
 CZE_continue_with_snejdareks_plan_default: "Continuar com o Plano de Šnejdárek"
 CZE_continue_with_snejdareks_plan_no_snejdareks: "Continuar com o Plano de Defesa Estática"
 CZE_continue_with_snejdareks_plan_dynamic_desc: "Uma rede de defesa eficaz previne a invasão inesperada das tropas inimigas. Ela fornece proteção e cria uma base forte para transitar entre defesa estratégica e ataque."
 CZE_go_with_vojcechovskys_plan_dynamic: "[CZE_go_with_vojcechovskys_plan]"
 CZE_go_with_vojcechovskys_plan_default: "Seguir com o Plano de Luža"
 CZE_go_with_vojcechovskys_plan_no_luza: "Doutrina de defesa ativa"
 CZE_go_with_vojcechovskys_plan_dynamic_desc: "A desvantagem de defesas estáticas é que elas não podem ser movimentadas. Quando são invadidas, elas não podem mais ser usadas para ataques, somente como restos do local inicial."
 CZE_improve_the_current_officer_pool: "Melhorar a reserva de oficiais atual"
 CZE_improve_the_current_officer_pool_desc: "Vamos promover pessoas que demonstraram a capacidade de ser um suporte para o nosso exército, pois elas são essenciais para a função de supervisão e coordenação entre os comandos superiores e as unidades locais."
 CZE_elevate_slovak_officers: "Promover os oficiais eslovacos"
 CZE_elevate_slovak_officers_desc: "Vamos nos focar em promover eslovacos para garantir uma melhor representação nas unidades. Se reduzirmos alguns requisitos para candidatos dos distritos eslovacos, vamos antecipar a melhora de coesão no exército futuramente."
 CZE_promote_moravec_writings: "Promover as obras de Moravec"
 CZE_promote_moravec_writings_desc: "Apesar de as obras \"Soldados e o Tempo\" e \"Defesa do Estado\" de Moravec provocarem reações muito contraditórias, sua recente publicação de \"A Importância Militar do nosso Estado na Europa Central\" foi discutida na imprensa diária europeia. Vamos incentivá-lo a continuar com seu trabalho como especialista inequívoco nas questões de política de defesa e histórico militar."
 CZE_lessons_of_war: "Lições da guerra"
 CZE_lessons_of_war_desc: "Com experiência de combate de um companheiro em nossa unidade, podemos aprender essas lições e usá-las para melhorar o nosso alto-comando. Nada substitui lições aprendidas em ações reais com o exército."
 CZE_lessons_of_war_i_had_war_with_major_flag: "Estava em guerra com um país principal"
 CZE_for_the_homeland: "Pela pátria"
 CZE_for_the_homeland_desc: "Agora que o nosso exército está totalmente preparado para o desafio iminente, podemos afirmar que estamos prontos para defender a pátria. Estamos prontos para qualquer missão que possa surgir."
 CZE_the_lions_roar: "O rugido do leão"
 CZE_the_lions_roar_desc: "O símbolo do leão tchecoslovaco representa as melhores qualidades do nosso exército: coragem, poder e heroísmo do mais alto nível. Todos conhecerão o espírito inigualável das nossas forças armadas."
 CZE_diversify_our_specialists: "Diversificar nossos especialistas"
 CZE_diversify_our_specialists_desc: "Precisamos diversificar os nossos especialistas além das tropas de Horska. A guerra não acontece só em montanhas e colinas."
 CZE_merge_the_financial_and_state_guard: "Fundir a guarda fiscal e a do Estado"
 CZE_merge_the_financial_and_state_guard_desc: "Com a formação da guarda do Estado, as guardas fiscais não são mais necessárias. Incorporá-las na guarda da defesa do Estado ajudaria a aumentar os números da SOS rapidamente."
 CZE_merge_the_financial_and_state_guard_tt: "Habilita §YGuarda Fiscal Integrada§! \n§YPolícia Militar§!: Vida: §G+5§!"
 CZE_logistics_beyond_the_sudetes: "Logística além dos Sudetas"
 CZE_logistics_beyond_the_sudetes_desc: "Se quisermos realizar operações de combate fora das montanhas sudetas, precisamos aprender como funciona a logística de longa distância. É muito diferente da nossa região nacional."
 CZE_logistics_beyond_the_sudetes_tt: "Habilita §YDepósitos de Suprimentos Melhorados§!\n§YCompanhia de Logística§!: Uso de Suprimentos: §G-10%§!"
 CZE_expand_the_river_monitor_fleet: "Expandir a frota de monitoramento fluvial"
 CZE_expand_the_river_monitor_fleet_desc: "A nossa frota de monitoramento fluvial é uma das maiores da Europa e ajuda o nosso exército com a defesa das áreas internas. Se a expandirmos, sua capacidade de realizar essa tarefa aumentará bastante."
 CZE_the_tvp_project: "O Projeto TVP"
 CZE_the_tvp_project_desc: "O nosso exército propôs um programa de Tanque de Uso Geral (TVP) para desenvolver um tanque nacional. Alguns dos nossos fabricantes, que têm uma vasta experiência na produção de tanques, demonstraram interesse no projeto."
 CZE_expand_the_land_department_of_vtu: "Expandir o departamento terrestre do VTÚ"
 CZE_expand_the_land_department_of_vtu_desc: "Se expandirmos o departamento terrestre do Instituto Técnico Militar (VTÚ), ele ganhará ferramentas e campos de testes adicionais para impulsionar as pesquisas de futuros equipamentos."
 CZE_department_two_expansion: "Departamento Dois"
 CZE_department_two_expansion_desc: "A nossa ala de inteligência, o Departamento 2, precisa de mais recursos para melhorar sua capacidade de nos proteger de espiões inimigos. Isso também proporcionaria a expansão de alas específicas na agência."
 CZE_military_intelligence: "Ala de inteligência militar"
 CZE_military_intelligence_desc: "A inteligência militar é uma das partes mais importantes de uma agência de inteligência. Investir mais recursos nessa área renderia bons dividendos."
 CZE_air_intelligence: "Ala de inteligência aeronáutica"
 CZE_air_intelligence_desc: "Saber quantos aviões existem na força aérea inimiga é um fator essencial para a vitória no ar. Obter informações sobre as forças aéreas do inimigo é primordial para o combatermos na região."
 CZE_within_the_eagles_nest: "No ninho da águia"
 CZE_within_the_eagles_nest_desc: "Ter um exército de informantes e sabotadores bem próximos de nós seria uma grande vantagem para o nosso exército. Com a ajuda do Departamento Dois, as nossas redes de espiões nesses locais poderiam crescer bastante."
 CZE_restart_naval_gun_production: "Reiniciar a produção de armas navais"
 CZE_restart_naval_gun_production_desc: "A Škoda Works era a maior produtora de armas navais do império da Áustria-Hungria. Reiniciar a produção criaria oportunidades para retomar as fabricações navais nacionais."
 CZE_restart_naval_gun_production_tt: "O Foco Naval §YPrioridade da Škoda§! fica §YAtivo§!"
 CZE_reform_the_naval_detachment: "Reformar o Destacamento Naval"
 CZE_reform_the_naval_detachment_desc: "Recentemente, o Destacamento Naval foi dissolvido por ser mais adequado para o exército. Os acontecimentos atuais mostraram que agora precisamos reformá-lo."
 CZE_build_2_dockyards_when_we_have_coast_tt: "Construirá instantaneamente §G2§! §YEstaleiros Navais§! em um §YEstado§! costeiro aleatório quando um for controlado."
 CZE_skoda_naval_yards: "Estaleiros navais da Škoda"
 CZE_skoda_naval_yards_desc: "Agora que retomamos o acesso ao mar, podemos reabrir as antigas indústrias navais do Império Austro-Húngaro com a experiência que ainda temos em nossa região. Devemos priorizar ao máximo o funcionamento de estaleiros nacionais."
 CZE_build_3_dockyards_when_we_have_coast_tt: "Construirá instantaneamente §G3§! §YEstaleiros Navais§! em um §YEstado§! costeiro aleatório quando um for controlado."
 CZE_legacy_of_the_kriegsmarine: "Legado da Kriegsmarine"
 CZE_legacy_of_the_kriegsmarine_desc: "Tendo ajudado na construção de grandes encouraçados há não muito tempo, a capacidade de fazer isso ainda hoje é bastante possível. Está no legado das mesmas fábricas que ajudaram a construir a Kriegsmarine Austro-Húngara."
 CZE_build_off_old_ganz_danubius_designs: "Construir antigos projetos da Ganz Danubius"
 CZE_build_off_old_ganz_danubius_designs_desc: "Projetos ressurgentes da Ganz Danubius poderiam ser úteis para construir novos navios cruzadores. As pessoas com experiência nesses projetos ainda vivem em nosso território."
 CZE_modernize_trieste_designs: "Modernizar projetos de Trieste"
 CZE_modernize_trieste_designs_desc: "Se usarmos antigos projetos da Marinha Austro-Húngara para encouraçados menores, teremos mais conhecimento de como construir esse tipo de navio."
 CZE_leverage_gunboat_experience: "Aproveitar a experiência de canhoneiros"
 CZE_leverage_gunboat_experience_desc: "Podemos aproveitar a nossa experiência com projetos de canhoneiros para construir contratorpedeiros. A nossa perícia atual ajudaria a acelerar o processo de criação."
 CZE_revive_kraljevica_designs: "Retomar os projetos de Kraljevica"
 CZE_revive_kraljevica_designs_desc: "Se usarmos nosso conhecimento sobre canhoneiros e estudarmos os antigos projetos de Kraljevica, poderemos reviver essa classe de navios para a nossa nação."
 CZE_wolfs_of_bohemia: "Lobos da Boêmia"
 CZE_wolfs_of_bohemia_desc: "Com a experiência em submarinos que ainda existe em nosso território, não seria muito difícil criar alcateias próprias."
 CZE_raider_lineage: "Linhagem de incursores"
 CZE_raider_lineage_desc: "Temos uma linhagem de incursores vindo dos oficiais que estavam na Marinha Austro-Húngara. Temos que aproveitar essa experiência."
 CZE_a_modern_navy: "Marinha moderna"
 CZE_a_modern_navy_desc: "Agora que aprimoramos as nossas tecnologias navais, finalmente podemos dizer que temos uma Marinha moderna e capacitada."
 CZE_build_1_dockyards_when_we_have_coast_tt: "Construirá instantaneamente §G1§! §YEstaleiro Naval§! em um §YEstado§! costeiro aleatório quando um for controlado."
 CZE_naval_aviation: "Aviação naval"
 CZE_naval_aviation_desc: "Os porta-aviões parecem ser o futuro da guerra naval. Precisamos investir tempo nessas novas áreas de combate."
 CZE_across_the_atlantic: "Além do Atlântico"
 CZE_across_the_atlantic_desc: "Uma marinha precisa atravessar o oceano para ser eficaz. Precisamos fazer com que a nossa Marinha percorra longas distâncias."
 CZE_joint_equipment_designs: "Projetos conjuntos de equipamento"
 CZE_joint_equipment_designs_desc: "As nações d[ROOT.GetNameDef] e d[GER.GetNameDef] são a vanguarda na criação de tanques e aviões, cada uma com suas especialidades. Deveríamos compartilhar informações para continuar nos concentrando no que fazemos melhor."
 CZE_negotiate_sphere_of_influence: "Negociar esfera de influência"
 CZE_negotiate_sphere_of_influence_desc: "Não se pode negar que os recursos militares d[ROOT.GetNameDef] são muito valiosos para a aliança d[GER.GetNameDef]. Nada mais justo do que pedirmos alguns ganhos territoriais em troca."
 CZE_set_up_polish_puppet_state: "Definir o Estado fantoche do sul d[POL.GetNameDef]"
 CZE_set_up_polish_puppet_state_desc: "Já que o governo d[GER.GetNameDef] está interessado em estabelecer um estado fantoche na Polônia, é óbvio que deveríamos fazer o mesmo."
 CZE_usurp_the_mantle: "Assumindo o manto"
 CZE_usurp_the_mantle_desc: "Com nosso reino se estendendo do Mar Báltico às margens do Adriático e controlando as terras da Áustria, a potência histórica da região, agora podemos nos proclamar como o sucessor legítimo do Sacro Império Romano."
 CZE_austro_hungary_puppets: "Todos os §Ysúditos§! afetados pelo requisito do foco"
 CZE_decrease_autonomy_tier: "Todos os súditos na condição de §Y$autonomy_dominion$§! ou §Y$autonomy_puppet$§! perderão um nível de autonomia."
 #Exile Focus
 CZE_prepare_for_exile: "Preparar-se para o exílio"
 CZE_prepare_for_exile_desc: "O Estado deveria ajudar secretamente os esforços dos nossos líderes políticos para escaparem para o exterior e organizarem um governo no exílio."
 CZE_joins_government_in_exile_tt: "Entra para §Yo Governo no Exílio§!"
 CZE_infiltrate_collaborationist_organizations: "Infiltrar-se nos Colaboracionistas"
 CZE_administrative_chaos_tt: "Efeito §Ypara o Reichskommissariat§! quando §Y$CZE_enter_exile$§! for concluído:"
 CZE_infiltrate_collaborationist_organizations_desc: "Pode ser estranho ter pessoas d[ROOT.GetNameDef] leais ao governo no exílio sendo colocadas para liderar organizações colaboracionistas, mas é a maneira perfeita de obter informações e enfraquecer as atividades deles."
 CZE_enter_exile: "Ir para o Exílio"
 CZE_enter_exile_desc: "Com potenciais aliados agora finalmente enfrentando [GER.GetNameDef], o nosso governo pode se preparar e lutar pelo retorno da soberania."
 CZE_refused_exile: "Recusou-se a acolher o governo [ROOT.GetAdjective]"
 CZE_contact_the_czech_and_slovak_legion: "Contatar a Legião Tcheca e Eslovaca"
 CZE_contact_the_czech_and_slovak_legion_desc: "Corajosos membros das forças armadas d[ROOT.GetNameDef] escaparam para [POL.GetNameDef] e [FRA.GetNameDef] com a intenção de continuar lutando pela liberdade d[CZE.GetNameDef]. Precisamos contatar essas forças e coordená-las."
 CZE_skoda_priority_shortcut_finder: "Prioridade da Škoda"
 CZE_skoda_priority_shortcut_finder_desc: "Esta é a prioridade da Škoda atual"
 #Decision unlock TT
 CZE_decision_unlock: "Desbloqueia a decisão:"
 CZE_demand_regime_change_tt: "$CZE_decision_unlock$§YExigir mudança de regime no país§!"
 CZE_propose_unification_tt: "$CZE_decision_unlock$§YConvidar país para a União Tchecoslovaca§!"
 CZE_integrate_nation_tt: "$CZE_decision_unlock$§YIntegrar país§!"
