l_japanese:
 #Shortcuts
 CZE_military_path_shortcut: "軍隊"
 CZE_economic_path_shortcut: "経済"
 CZE_diplomacy_path_shortcut: "外交"
 CZE_fort_path_shortcut: "要塞化への注力"
 CZE_skoda_priority_shortcut_name: "シュコダの優先度"
 CZE_political_path_shortcut: "政治"
 # Č does show when scrolling through focuses, but not in the detailed focus view title (does work in the description though)
 CZE_coalition_building: "連合の構築"
 CZE_coalition_building_desc: "選挙後に生まれた連合が効果的に機能するには、加盟勢力の結束をさらに強化する必要がある。ヤン・マリペトルが首相から退任し、広範な連合の支持基盤を強化する必要性が高まっている。"
 CZE_merge_the_paramilitaries: "準軍事組織の統合"
 CZE_merge_the_paramilitaries_desc: "我が国の準軍事組織は、多くの異なる組織に分散し、分裂している。もしこれらを軍事的に活用するつもりなら、強制的に統合させなければならない。"
 CZE_integrated_paramilitaries: "準軍事組織を統合"
 CZE_integrated_paramilitaries_desc: "軍はこれに賛成しないかもしれないが、準軍事組織を軍に統合すれば、最も必要とされる際に予備兵の供給源を拡大することができる。"
 CZE_wielding_the_hammer: "ハンマーを振るう"
 CZE_wielding_the_hammer_desc: "我々は国民議会における圧倒的多数という立場を生かし、立法のプロセスを現在よりも大幅に早めることができる。立法府の体制を整えることは何よりも重要だ。"
 CZE_emergency_measures: "緊急策"
 CZE_emergency_measures_desc: "我が国が直面する数多くの危機に対処するための緊急策を導入し、その一部を利用して政府にとって思想的に信頼できない者への監視を強化する。これにより、我々はこれらの課題により適切に対処できるようになるだろう。"
 CZE_king_of_the_castle: "「城」の王"
 CZE_king_of_the_castle_desc: "政府で実際に決定権を握っている人物が誰なのかは、誰でも知っている。この先の見通しが不透明な時代において、$CZE_edvard_benesh$に直接的な指導権を託すべき時が来た。我が国の安全は、それにかかっている。"
 CZE_closer_ties_with_the_moderate_germany_parties: "ズデーテンラントの穏健派政党の集結"
 CZE_closer_ties_with_the_moderate_germany_parties_desc: "ズデーテンラントの政党の一部は、我が連合と協力し、政府との連携を強化する意欲を示している。その関係をさらに深めるべきだ。"
 CZE_complete_reconciliation: "完全なる和解"
 CZE_complete_reconciliation_desc: "我々は信頼の橋を築くために努力を重ねてきた。今こそ、同胞と和解する時だ。"
 CZE_complete_reconciliation_cooldown_flag: "国家方針§Y$CZE_closer_ties_with_the_moderate_germany_parties$§!を達成している"
 CZE_complete_reconciliation_cooldown_flag_tt: "現在の日数: [?CZE_complete_reconciliation_cooldown_flag:days|Y0]"
 CZE_bastion_of_liberty: "自由の砦"
 CZE_bastion_of_liberty_desc: "この10年間、我々はライン川以東のヨーロッパで数少ない真の多元主義国家の一つだった。そのことを人々が忘れないようにしよう。"
 CZE_standing_against_the_storm: "嵐に立ち向かえ"
 CZE_standing_against_the_storm_desc: "欠点や準備不足にもかかわらず、我々はあらゆる困難に正面から取り組み、あらゆる嵐に立ち向かう。"
 CZE_truth_prevails: "真実は勝つ"
 CZE_truth_prevails_desc: "困難な状況や不可能に思える課題に直面しても、「真実は勝つ」という我が国のモットーが、最終的に真実となることをわかっている。真実を求め、真実に耳を傾ければ、真実は勝利するのだ。"
 CZE_negotiations_with_the_autonomous_bloc: "自治派連合との交渉"
 CZE_negotiations_with_the_autonomous_bloc_desc: "ベネシュの手下たちで構成される国民議会内の勢力に権力を譲らない連合を築きたいのであれば、自治派連合と協力しないといけない。しかし、彼らの完全な支持を得るためには、大きな代償を払わなければならないだろう。"
 CZE_slovakia_autonomy_agreement: "スロヴァキア自治権協定"
 CZE_slovakia_autonomy_agreement_desc: "自治派連合が我が連合と協力するための代償は大きいが、約束を守らない場合の代償はさらに深刻なものとなるだろう。"
 CZE_slovakia_autonomy_agreement_tt: "§Y[RUT.getname]§!は我々が§Y[SLO.getname]§!に認めるものと同じ条件を要求するだろう！"
 CZE_slovakia_autonomy_agreement_2_tt: "この国家方針が選択されると、$CZE_the_autonomous_bloc_demands$が§Y35日§!遅れる。"
 CZE_topple_the_king: "王を倒せ"
 CZE_topple_the_king_desc: "$CZE_edvard_benesh$ の我が政府への影響力は息が詰まるものだ。彼の権力は、議会内に忠実な支持者が多くいるため、大統領としての権限を超えている。しかし今、条件が整ったため、我々は上院における彼の影響力を排除することができる。"
 CZE_comprise_with_the_carpathians: "カルパティアへの譲歩"
 CZE_comprise_with_the_carpathians_desc: "ルテニア地域は、[SLO.getnamedef]に与えたのと同じような連邦化協定を求めている。これを行うことは、その地域と[9.getname]における我々の立場を大幅に弱体化させてしまう。彼らと何らかの合意を結ぶ方が、要求に完全に屈服するよりも良いだろう。"
 CZE_the_rut_demands_add_35_CZE_comprise_with_the_carpathians_tt: "この国家方針が選択されると、$CZE_the_rut_demands$が§Y35日§!遅れる。"
 CZE_cut_carpathia_loose: "カルパティアの解放"
 CZE_cut_carpathia_loose_desc: "スロヴァキアが連邦国家となった今、ルテニア地域は同様の合意を結ぶことを希望している。これには無理があるように思えるが、スロヴァキアが我々の支配下ではなくなった現状では、彼らを支配するのは困難だろう。要求に屈するしかないかもしれない。"
 CZE_compromise_with_the_veteran_agrarian: "ベテラン農家との妥協"
 CZE_compromise_with_the_veteran_agrarian_desc: "農業界の守旧派は、拡大する都市部有権者層への浸透を妨げる障害となっている。目的を達成するためには、彼らと妥協する必要があるだろう。"
 CZE_reorient_the_broad_coalition: "広範な連合の方向転換"
 CZE_reorient_the_broad_coalition_desc: "広範な連合は長年我が国の政府を率いてきた主要な連合だ。この連合を構成する多くの政治党派は、最近になって連合の指導を困難にする要因となっている。政治の方向転換と閣僚の政策の見直しは、もはや必須となっている。"
 CZE_leverage_sokol: "ソコル運動"
 CZE_leverage_sokol_desc: "ソコル運動は、我が国において数十年にわたり重要な組織として機能してきた。危機に陥った場合、ソコルを活用することで、軍が最も必要とする際に準軍事訓練や兵士の募集を支援することができる。"
 CZE_urbanist_policies: "都市政策"
 CZE_deepend_ties_with_the_trademans: "職人たちとの関係強化"
 CZE_deepend_ties_with_the_trademans_desc: "職人層の政党は、都市部の中間層有権者から支持されている。彼らを支持し、共に協力することで、都市部の有権者層への浸透を図りつつ、農村部の支持を離反させないことができる。"
 CZE_apart_but_togather: "離れていても一丸となって"
 CZE_apart_but_togather_desc: "各地域はかつてないほどの自治権を手にしているが、我々もかつてないほど強くなっており、何が起こっても立ち向かう準備はできている。"
 CZE_contact_henlein: "ヘンラインとの接触"
 CZE_contact_henlein_desc: "$CZE_konrad_henlein$は、長年我が政府の悩みの種だった。しかし、最近の国際情勢を踏まえると、彼と対話するべき時期が来たのかもしれない。"
 CZE_contact_henlein_cooldown_flag: "国家方針§Y$CZE_no_compromise_with_the_sdp$§!を達成している"
 CZE_contact_henlein_cooldown_flag_tt: "現在の日数: [?CZE_contact_henlein_cooldown_flag:days|Y0]"
 CZE_contact_henlein_focus_warning_tt: "§Y$CZE_no_compromise_with_the_sdp$§!を達成したら、この§Y国家方針§!が選択できるまで§Y350§!日待たないといけない。"
 CZE_contact_henlein_focus_order_warning_tt: "この§Y国家方針§!を達成してから§Y$CZE_no_compromise_with_the_sdp$§!を達成すると、§Y$CZE_konrad_henlein$§!は引退する。"
 CZE_no_compromise_with_the_sdp: "引き続きSdPを排除する"
 CZE_no_compromise_with_the_sdp_desc: "SdPは我々の連合に何の貢献もできない。彼らは政治的緊張を引き起こすことのみを目的とし、我が政府の行動を誹謗中傷しようとしている。良き統治の名の下に、彼らは今後もいかなる連合からも排除されるべきだ。 "
 CZE_no_compromise_with_the_sdp_cooldown_flag: "国家方針§Y$CZE_contact_henlein$§!を達成している"
 CZE_no_compromise_with_the_sdp_cooldown_flag_tt: "現在の日数: [?CZE_no_compromise_with_the_sdp_cooldown_flag:days|Y0]"
 CZE_no_compromise_with_the_sdp_focus_warning_tt: "§Y$CZE_contact_henlein$§!を達成したら、この§Y国家方針§!が選択できるまで§Y350§!日待たないといけない。"
 # CZE_economic_integration: "Economic Integration"
 # CZE_economic_integration_desc: "Why stop at a customs union? Economic integration will further grow our economies and ensure our future is an affluent one for all members."
 CZE_form_a_federation: "連邦の結成"
 CZE_form_a_federation_desc: "中央ヨーロッパ連邦の夢はもはや手の届く場所まで来ている。我々はそれを実現し、民主主義の巨人となり、大国の圧力に抵抗するだけの力を手に入れられる！"
 CZE_bend_the_bars: "$ITA_bend_the_bars$"
 CZE_bend_the_bars_desc: "$GER_european_confederation_desc$"
 CZE_reassure_the_army: "軍を安心させる"
 CZE_reassure_the_army_desc: "軍は我々の最近のいくつかの決定と政府の政策について不安を感じている。政府が何を言おうと、何をやろうと、我々は軍の味方であることを明確に伝えるべきだ。"
 CZE_outreach_to_the_western_powers: "西側諸国に対するさらなる連携強化"
 CZE_outreach_to_the_western_powers_desc: "西側の民主主義諸国は、我々を支援していると主張しているが、最も重要な局面で彼らの言葉が行動に裏付けられるよう、さらに関係を深める必要がある。"
 CZE_demand_guarantees: "より強固な保障を要求"
 CZE_demand_guarantees_desc: "既存の条約や同盟関係があるものの、絶望的な状況下にいる我々を見捨てる方が簡単だからといって、協力国に見捨てられないようにしなければならない。我々には保障以上に強固なものが必要だ。"
 CZE_guardian_of_central_europe: "中欧の守護者"
 CZE_guardian_of_central_europe_desc: "我々はヨーロッパの中心で民主主義の監視役となる立場にある。自力で立ち向かうことができない国々の守護者となり、民主主義が確固たるものとなるよう、力を発揮できるのだ。"
 CZE_central_european_faction: "中欧の宗主国"
 CZE_central_european_faction_desc: "外交に過度に依存するのではなく、自国の強化に焦点を当てているものの、影響力を過剰に拡大しないことは極めて重要だ。また、外へ目を向ける時期が来ているのかもしれない。"
 CZE_strike_at_the_heart_of_bolshevism: "[THIS.GetAntiSovietFocusName]"
 CZE_strike_at_the_heart_of_bolshevism_1: "ボリシェヴィズムの核心を攻撃せよ"
 CZE_strike_at_the_heart_of_bolshevism_2: "東側の側面を確保"
 CZE_strike_at_the_heart_of_bolshevism_desc: "[SOV.GetNameDef]の拡大は、ヨーロッパおよび我が国の存続にかかわる脅威である。我々はその拡大に対する砦とならなければならない。"
 CZE_destroy_the_fascist_threats: "ファシストの脅威を砕け"
 CZE_destroy_the_fascist_threats_desc: "[CZE_get_fascist_threats_desc]"
 CZE_destroy_the_fascist_threats_desc_enemy_ger: "ヨーロッパの平和にとって最大の脅威が誰であるのかは周知の事実だ。[GER.getnamedefCAP]はすぐにでも止めなければならない。他に止める意思のある者がいないのなら、我々がやるしかないだろう。"
 CZE_destroy_the_fascist_threats_desc_backup: "我が国の安全保障のためには、近隣諸国が拡張主義的な言説に耳を貸さないことが極めて重要だ。このような思想は遅かれ早かれ我々に向けられる可能性がある。"
 CZE_peace_on_our_time: "我らの時代の平和"
 CZE_peace_on_our_time_desc: "我々はヨーロッパの国際社会において、長きにわたって軽んじられてきた。しかし、そのような時代はもう終わりだ！戦時であれ平時であれ、我々は自立し、自分たちのことは自分たちで決めることができるのだ。"
 CZE_reach_out_for_military_assistance: "軍事支援の要請"
 CZE_free_tuka: "$CZE_vojtech_tuka$の釈放"
 CZE_free_tuka_desc: "$CZE_vojtech_tuka$の刑期が満了した。刑期を延長する口実を探す代わりに、彼を期日通りに釈放し、政府内で活用することもできる。彼を我々の下で働かせる方が、我々に敵対させるよりも良いだろう。"
 CZE_grow_the_anglo_czechoslovak_prague_credit_bank: "アングロ・チェコスロヴァキア銀行"
 CZE_grow_the_anglo_czechoslovak_prague_credit_bank_desc: "アングロ・チェコ信用銀行は、我が業界の主要な牽引役の一つだ。同銀行の資金支援がなければ、現在のような大規模な輸出事業を支えることはできなかっただろう。ニューヨークに新支店を設立し、[ENG.GetNameDef]との連携を強化することで、同銀行はさらに大きくなることができる。また、[ENG.getname]が我が国の存続による利益を享受することにもなるだろう。"
 CZE_feeding_the_alligator: "ワニに餌を与える"
 CZE_feeding_the_alligator_desc: "[GER.getname]のズデーテンラントに関する計画は、我が国の存続そのものを脅かすものだ。彼らが求めるものを与えれば、我々を放っておくはずだ……"
 CZE_complete_capitulation: "降伏完了"
 CZE_complete_capitulation_desc: "他にどのような選択肢があったというのか。迫り来る嵐を避けることなどできない。まだ交渉が可能なうちに[GER.getnamedef]と取引をすれば、彼らの支配のもとで、ある程度の独立性を保てるかもしれないのだ。"
 CZE_stabilize_the_protectorate: "保護国の安定化"
 CZE_stabilize_the_protectorate_desc: "保護国の状況は安定しているとは言い難い。我々は彼らの正当な政府であり、人々の要求に対処できる存在であると、どうにかして納得させる必要がある。"
 CZE_stabilize_the_protectorate_unretire_henlein_tt: "§Y[ROOT.getname]§!から§Y$CZE_konrad_henlein$§!が現役復帰する。"
 CZE_full_faith_in_hacha: "ハーハへの完全な信頼"
 CZE_full_faith_in_hacha_desc: "$CZE_emanuel_moravec$よりも、$CZE_emil_hacha$のほうが国民からの支持と敬意を集めている。その仕事ぶりに疑問があったとしても、大衆に担がれた神輿をすげ替えるような真似はできない。"
 CZE_moravecs_bohemia: "モラヴェッツのボヘミア"
 CZE_moravecs_bohemia_desc: "$CZE_emil_hacha$が新政府の転覆を謀っているという噂が飛び交っている。現在の状況下で安定と成長を望むのであれば、宗主国のイデオロギーにより近しい指導者が必要だ。"
 CZE_form_the_government_army: "政府軍の編制"
 CZE_form_the_government_army_desc: "この国を発展に導くためには、旧軍の失敗に学んだ新たな軍隊の編成が不可欠だ。その指導者の政治的信条は、政府のそれに寄り添っていなければならない。"
 CZE_forced_administration_of_companies: "企業の強制管理"
 CZE_forced_administration_of_companies_desc: "綿密な監視の目をかいくぐり、我々の統制から逃れている企業が今もまだ存在する。もはや強制的な管理を実行するほかないだろう。"
 CZE_revisit_custom_union_talks: "関税同盟の再交渉"
 CZE_revisit_custom_union_talks_desc: "その他の関税同盟国と比べると、一部の近隣国との関税交渉は大きく疑問の残る結果に終わっている。それらの交渉をやり直し、この関税同盟を確かなものとするよう強く働きかけるべきだ。"
 CZE_revisit_custom_union_talks_tt: "まだ他の§Y手段§!を使って、彼らを加盟させることはできる。"
 CZE_revisit_custom_union_talks_2_tt: "彼らが我々の連邦への参加要求を受け入れる可能性が大幅に上昇する"
 CZE_reintegrate_cross_border_rail_connections: "国境横断鉄道の接続改善"
 CZE_reintegrate_cross_border_rail_connections_desc: "我が国と近隣国とを繋ぐ鉄道網を充実させれば、相手は喜ぶだろう。両国間の経済的な結びつきを強めようとしているならばなおさらだ。"
 CZE_reintegrate_cross_border_rail_connections_flag: "国境横断鉄道の接続が改善された"
 CZE_vonapo_20: "VONAPO 20"
 CZE_vonapo_20_desc: "近ごろ勢いを増す[GER.GetNameDef]を脅威とみなしているのは我々だけではない。この状況に対応すべく、[GER.GetAdjective]の野望を確実に阻止できるよう、[SOV.GetNameDef]と共同で情報を収集する計画が策定された。"
 CZE_increase_funding_from_moscow: "[SOV.capital.GetCapitalVictoryPointName]からの資金提供増額"
 CZE_increase_funding_from_moscow_desc: "[ROOT.GetCommunistParty]は資金不足にあえいでおり、現在は代表者の給料を建物の維持に充てている状況だ。組織の成長のためには、[SOV.GetNameDef]に資金援助の増額を要請し、機関紙を広く頒布してメンバーを増やさなければならない。"
 CZE_zdenek_fierlinger_tt: "§Y$CZE_zdenek_fierlinger$§!を顧問に任命する"
 CZE_expand_the_communist_press: "共産主義機関紙の拡大"
 CZE_expand_the_communist_press_desc: "我々の新聞「ルデー・プラーヴォ」は、新聞を一切読んでいない層に情報を伝える手段となりうる。必要なのは予算の増額だけだ。"
 CZE_anti_rearmament_propaganda: "反再軍備のプロパガンダ"
 CZE_anti_rearmament_propaganda_desc: "主要な敵国である[GER.GetNonIdeologyName]のファシスト政権が崩壊したことで、軍備増強に終始反対してきた我々の立場が正しかったと主張できる。"
 CZE_anti_democratic_propaganda: "反民主主義のプロパガンダ"
 CZE_anti_democratic_propaganda_desc: "我らが党への支持を得るために、かつての共和国政府の犯した失敗を広く知らしめ、我々であればうまく問題に対処できたことを示さなければならない。"
 CZE_form_workers_brigades: "労働者民兵の編制"
 CZE_form_workers_brigades_desc: "我々が解放する労働者たちは、この闘争に参加する覚悟を持たなければならない。彼らは訓練された兵士ではないかもしれないが、専門技術を持つ者はそれを生かしてもらえばいい。"
 CZE_kohler_faction: "ケーラー派"
 CZE_kohler_faction_desc: "ブルーノ・ケーラーの派閥は、共産主義国家としてのチェコスロヴァキアを確立するために、暴力的な手段によるブルジョワの排除が必要だと信じている。"
 CZE_gottwald_faction: "ゴットヴァルト派"
 CZE_gottwald_faction_desc: "忠実なスターリン主義者であるクレメント・ゴットヴァルトの派閥は、チェコスロヴァキア国家の将来像としてソ連を思い描いている。"
 CZE_zapotocky_faction: "ザポトツキー派"
 CZE_zapotocky_faction_desc: "チェコスロヴァキア共産党の創設者であるアントニン・ザポトツキーとボフミール・シュメラルは、クレメント・ゴットヴァルトが押し通した党の方針よりも穏健な共産主義体制を目指していた。すべての[CZE.GetAdjective]国民の心に訴えるには、この原点に立ち返るべきだ。"
 CZE_ally_with_moderate_socialists: "穏健派社会主義者たちとの協力"
 CZE_ally_with_moderate_socialists_desc: "すべての国で共産主義運動が政治的に成功するわけでも、[SOV.GetLeader]が熱烈に支持されるわけでもない。したがって、より穏健な社会主義運動と足並みをそろえることを拒否する理由はないだろう。"
 CZE_democracies_willing_to_join_faction_tt: "§Y民主主義国家が我々の共産主義陣営に参加しやすくなる。§!"
 CZE_limited_cooperation: "[SOV.GetLeader]との制限的な協力"
 CZE_limited_cooperation_desc: "互いのイデオロギーは違えど、あの[SOV.GetNameDef]も協力相手としての我々の価値を認識し、実利的な取引の締結に意欲を示すかもしれない。たとえ新聞で我々をなじっていたとしてもだ。"
 CZE_denounce_stalinism: "スターリン主義を非難"
 CZE_denounce_stalinism_desc: "スターリンによる数々の非道は、共産主義の名にぬぐいきれぬ泥を塗った。そのような抑圧に苦しむ人々を解放するため、軍事的手段に訴えるべきだ。"
 CZE_country_leader_has_ideology_stalinism_tt: "国の指導者が§Y$stalinism$§!のイデオロギーを持つ"
 CZE_cooperate_with_tito: "チトーとの協力"
 CZE_cooperate_with_tito_desc: "[YUG.GetNameDefCap]は、我々と同じように、実践的な共産主義を試みている。彼らはその赤旗の下に同じように多民族を統合しようとしているのだ。同様の課題に直面する我々は、軍事および政治の両面において手を取り合うべきだ。"
 CZE_reduce_divided_nation_cost_tt: "§Y分断された国家§!に関連するほとんどのディシジョンのコストと所要時間を削減する。"
 CZE_balkan_union: "連合の拡大"
 CZE_balkan_union_desc: "この地域ではますます多くの国々が共産主義を受け入れているが、列強からの圧力に対抗するため、我々は強固な協力関係を築かなければならない。それには連合が最も効果的な手段だ。"
 CZE_cooperation_with_the_ussr: "[SOV.GetLeader]との協力"
 CZE_cooperation_with_the_ussr_desc: "党上層部の中でも最も熱心な[SOV.GetNameDef]信奉者であっても、かの国を訪れれば、否が応でもその集団化政策の欠点に気づく。だとしても、彼らと協力して集団化を推し進めることで、成功点と失敗点を分析し、[ROOT.GetNameDef]にどのように組み入れるべきかを判断できる。"
 CZE_exchange_military_expertise: "軍事専門知識の交換"
 CZE_exchange_military_expertise_desc: "巨大な軍隊を持つ大国の例に漏れず、[SOV.GetNameDefCap]もまた戦術や戦略の研究を進めている。我々の知識と引き換えに、彼らの知見を共有するよう要請するべきだ。"
 CZE_pressure_romania: "ルーマニアへの圧力"
 CZE_pressure_romania_desc: "[ROM.GetNameDefCap]が敵陣営に与した場合、深刻な脅威をもたらす可能性がある。[SOV.GetNameDef]との連絡を妨害されたり、貴重な石油を敵に供給されたりしたら大きな問題だ。[SOV.GetAdjective]という後ろ盾を得ている今の我々ならば、実力行使に訴えることなく、敵に回らないよう圧力をかけられるだろう。"
 CZE_facility_in_state_tt: "$STATE|Y$に他の§Y実験施設§!がない場合、$STATE|Y$に$FACILITY_TYPE|Y$を§G1§!つ獲得する。"
 CZE_spread_the_revolution: "革命の広がり"
 CZE_spread_the_revolution_desc: "[ROOT.GetNameDef]における革命が成功した今、国外のプロレタリアートにも自由への闘争を促すべきだ。彼らの蜂起を支援しよう。"
 CZE_agrarian_reform: "土地管理局の再建"
 CZE_agrarian_reform_desc: "最近解体された土地監置局は、主に農地の再分配を担っていた。より大胆な措置がとれるように、この機関を再建すべきだ。"
 CZE_realign_the_church: "国家無神論"
 CZE_realign_the_church_desc: "長い間、宗教は[CZE.GetAdjective]の人々を分断させる要因となっていた。教育や報道など、国家の諸問題に対する宗教の影響力を弱め、社会を1つにまとめなければならない。"
 CZE_create_a_secret_police_branch: "秘密警察の創設"
 CZE_create_a_secret_police_branch_desc: "国内の安定を保つため、内外の敵に対処しなければならない。人々が新しい体制に慣れるまでは時間がかかるものであり、それが未だ完成を見ないものならなおさらだ。"
 CZE_promote_urbanization: "$ARG_promote_urbanization$"
 CZE_promote_urbanization_desc: "効率的な共同農場を確立した今、農村人口の一部を都市に誘致し、そこでの生産性を高める計画を開始することができる。"
 CZE_confiscate_church_lands: "教会の土地接収"
 CZE_confiscate_church_lands_desc: "教会の保有する土地と財産は本来必要な水準をはるかに超えている。以前農地に対して行ったように、それらの土地の一部を再配分する必要がある。"
 CZE_change_the_narrative: "説話改変"
 CZE_change_the_narrative_desc: "これまで教会は我々の革命を支持してこなかったが、その価値観を我々のものと一致させれば、新体制への支持を得る上で大きく役立つかもしれない。"
 CZE_the_second_fortification_program: "第2次要塞化計画の開始"
 CZE_the_second_fortification_program_desc: "第1次要塞化計画により防衛の基礎は築かれた。我々は直ちにこれを発展させる必要がある。我が国の未来のため、可及的速やかに第2次要塞化計画を開始し、要塞線の強化と拡充を図る必要がある。"
 CZE_redirect_the_fortification_councils_funds: "要塞評議会の資金転用"
 CZE_redirect_the_fortification_councils_funds_desc: "要塞化計画は我が国の財政の大きな重しとなっている。この資金を別の計画の資金として活用する方が有益だ。これ以上陸軍の防備を固める必要はない。"
 CZE_jachymov_uranium_mine: "ヤーヒモフ・ウラン鉱山"
 CZE_jachymov_uranium_mine_desc: "長い間、ヤーヒモフの鉱山はウランとその他の鉱石を産出してきたが、ウランは最近の物理学の発展があるまで用途に乏しかった。"
 CZE_skoda_internal_competition: "内部コンペの奨励"
 CZE_skoda_internal_competition_desc: "シュコダのような大企業では、すべての従業員を常に最高効率で働かせるのは難しい。内部コンペを奨励すれば、我々の工場における労働者の生産性向上に大いに役立つだろう。"
 CZE_skoda_max_optimization_tt: "§Yシュコダ重視§!の最大最適化レベルが7に上昇。"
 CZE_skoda_increase_cooperation: "シュコダ内協力体制の拡大"
 CZE_skoda_increase_cooperation_desc: "工場間の協力体制を強化することで生産性を高められる。各工場間の技術交換も進むだろう。"
 CZE_skoda_fast_optimization_tt: " §Yシュコダの優先事項§!の£GFX_prod_eff_cap 最適化レベル上昇率は時間の経過とともに最大値に向かって上昇する。最大値: §G+100.0%§!"
 CZE_master_of_armaments: "兵器の匠"
 CZE_master_of_armaments_desc: "シュコダ財閥はオーストリア＝ハンガリー帝国時代から我が国最大の兵器メーカーの地位を維持してきた。彼らの技術と経験は、我が国では並ぶ者がいないほど卓越している。今こそ彼らに「兵器の匠」の称号を与えよう。"
 CZE_only_the_best_is_good_enough: "最高のものだけがふさわしい"
 CZE_only_the_best_is_good_enough_desc: "シュコダ財閥の原動力は常に勤勉な労働倫理と革新の精神である。創業者らは「顧客には最高のものだけがふさわしい」というモットーを貫いてきた。近年、このモットーはこれまで以上に真実味を増している。"
 CZE_an_industrial_legacy: "工業遺産"
 CZE_an_industrial_legacy_desc: "我が国の工業は、これまで不可能だと思われていたレベルまで発展し、ついに工業遺産を誇れるまでに達した。我が国は比類なき工業大国といえる。"
 CZE_powerhouse_of_europe: "ヨーロッパの発電所"
 CZE_powerhouse_of_europe_desc: "我が国の産業は今や世界の羨望の的だ。エネルギー部門による適切な供給を確実なものとしなければならない。"
 CZE_supply_fighters_for_allies: "同盟国への戦力供給"
 CZE_supply_fighters_for_allies_desc: "[FRA.GetAdjective]と[ENG.GetAdjective]は、[GER.GetAdjective]との戦争状態に突入した場合、航空戦力により防衛拠点をまたたく間に突破され、市街地を爆撃されることを非常に怖れている。彼らの空軍戦力を強化してやれば、甚大な人的被害なしに[GER.GetAdjective]の勢力拡大を止められる自信を深めるかもしれない。"
 CZE_allies_more_likely_to_defend_us_tt: "§Y連合国がズデーテンラントにおけるドイツの拡張主義に対抗し、我々を支援する可能性が高まる。§!"
 CZE_allies_more_likely_to_defend_us_2_tt: "§Y連合国がズデーテンラントにおけるドイツの拡張主義に対抗し、我々を支援する可能性が大きく高まる。§!"
 CZE_allies_more_likely_to_defend_us_3_tt: "§Y連合国がズデーテンラントにおけるドイツの拡張主義に対抗し、我々を支援する可能性がわずかに高まる。§!"
 CZE_establish_the_state_defense_guard: "国家防衛軍の創設"
 CZE_german_nonagressionpact: "ハウスホーファー・クロフタ協定"
 CZE_german_nonagressionpact_desc: "[GER.GetNameDef]との不可侵協定の交渉が一時行われていたが、[SOV.GetNameDef]の状況が不穏なものとなり、新たな領土拡張計画が策定されたことで、交渉は中止された。[GER.GetNameDef]の目が別の敵に向いている現在、この交渉を再開させるべきだ。"
 CZE_revive_the_czechoslovak_legion_dynamic: "[CZE_revive_the_czechoslovak_legion]"
 CZE_revive_the_czechoslovak_legion_default: "チェコスロヴァキア軍団の復活"
 CZE_revive_the_czechoslovak_legion_communist: "志願兵編制"
 CZE_revive_the_czechoslovak_legion_dynamic_desc: "再び混迷の深まる現在、[ROOT.GetNameDef]の有志たちは祖国を守るために喜んで銃を取る心構えだ。しかし、過去が証明するように、我が国を守るためには国外で戦うことが時に求められる。守るためにこそ、故郷を離れる覚悟を持つ者たちが必要だ。"
 CZE_revive_the_czechoslovak_legion_nsb_tt: "§Y$CZE_legacy_of_the_czechoslovak_legion_army_spirit$§!は§Y陸軍精神§!から§Y国民精神§!に変換される。"
 CZE_state_sponsored_recruitment_for_spain: "スペインのための国家主導の徴募"
 CZE_state_sponsored_recruitment_for_spain_desc: "新たな紛争において、彼らが重要な役割を果たすであろう今、[ROOT.GetNameDef]の経験豊富な兵士たちから義勇兵を募り、我々の政策と最も近い陣営を支援するべきだ。その中で、過去10年の軍事的進展についても知見を得られるだろう。"
 CZE_support_spain_reward_tt: "§Y我々の義勇兵を受けたスペインの派閥が勝利または敗北した際の影響:§!"
 CZE_profit_off_the_spanish_civil_war: "スペイン内戦の経済的利用"
 CZE_profit_off_the_spanish_civil_war_desc: "スペイン内戦は列強による代理戦争となり始めているが、我々はこの国の勇敢な兵士たちの命をそのような紛争で失うべきではない。しかし、これは国内産業にとって武器を売る絶好の機会だ。可能なら両国に売りつければよい。"
 CZE_skoda_sell_weapons_to_SPR_tt: "ディシジョンをアンロック: §Yスペインの派閥に密かに武器を売る§!"
 CZE_placate_benes_faction: "ベネシュ派への帰順"
 CZE_placate_benes_faction_desc: "$CZE_milan_hodza$は、外務大臣としての任期が惨憺たる結果に終わったという事実を受け入れなければならない。$CZE_edvard_benesh$には、農業者党内の支持者とともに、$CZE_milan_hodza$の首相としての立場を支える用意がある。ただしそれは、$CZE_milan_hodza$が外相の地位を手放すことが条件だ。"
 CZE_claim_lands_of_the_bohemian_crown: "ボヘミア王冠領"
 CZE_claim_lands_of_the_bohemian_crown_desc: "過去数世紀にわたって、我が国はさまざまな帝国の国境帯に位置していたため、この地の住民の意思ではなく、紛争によって国境線が決められてきた。今こそ、この歪みを正す時だ。"
 CZE_demand_katowice: "[762.GetName]を要求"
 CZE_demand_katowice_desc: "[762.GetName]の支配権を手に入れることは、かつての領土を取り戻すというだけでなく、[72.GetName]の領有権を主張している[POL.GetAdjective]を弱体化させることにもなる。"
 CZE_fight_over_silesia: "シレジアをめぐる戦い"
 CZE_fight_over_silesia_desc: "シレジアは本来[ROOT.GetAdjective]の領土といえるが、[66.owner.GetNameDef]との全面戦争は望ましくない。したがって、国境付近での大規模な小競り合いによって我が国の力を示すべきだ。そうすれば、[66.owner.GetNameDef]はシレジアをめぐる戦争を避けようと考え、本格的な武力衝突に至ることなく領土を獲得できるかもしれない。"
 CZE_dismantle_poland: "[POL.GetNonIdeologyName]の解体"
 CZE_dismantle_poland_desc: "その自衛能力の欠如が明らかとなった今、[POL.GetNameDef]はもはや緩衝国として信頼に値しない。我々は自国の強化に努めるべきだ。"
 CZE_proclaim_the_restoration_of_bohemia: "ボヘミア王国の復活を宣言"
 CZE_proclaim_the_restoration_of_bohemia_desc: "かつての国境線が回復された今、我々は自らの遺産を取り戻し、新たに得た領土の統合に注力できる。"
 CZE_integrate_lost_territories: "失われた領土の統合"
 CZE_integrate_lost_territories_desc: "ボヘミア王国の領土は、かつてはバルト海からアドリア海にまで及んでいた。今こそ我らが歴史に立ち返り、新たに獲得した領土の統合を進めるべきだ。"
 CZE_deepen_ties_with_puppet_kingdoms: "傀儡王国との関係強化"
 CZE_deepen_ties_with_puppet_kingdoms_desc: "我々は明確な勢力圏を手にしているが、我が国に同調するこれらの国々からの利益を最大化するためには、影響力をさらに高める必要がある。"
 CZE_poland_alliance_monarchist: "[POL.GetNonIdeologyName]との合意"
 CZE_poland_alliance_monarchist_desc: "$CZE_ally_poland_desc$"
 CZE_a_strong_poland: "強力な[POL.GetNonIdeologyName]"
 CZE_a_strong_poland_desc: "東欧有数の軍隊を持つ[POL.GetNameDef]は、我々の頼もしい味方となりうる。"
 CZE_mend_balkan_relations: "バルカン諸国との関係改善"
 CZE_facilitate_a_strong_hungary: "強いハンガリーの促進"
 CZE_facilitate_a_strong_hungary_desc: "独立以来、我々と[HUN.GetNameDef]との関係は冷え込んでいる。しかし、現状の対立の高まりから、我々の大義に引き込めるかもしれない。"
 CZE_subjegate_romania: "[HUN.GetAdjective]の要求によるルーマニアへの圧力"
 CZE_subjegate_romania_desc: "我々の傀儡である[HUN.GetAdjective]の主張は、我が国の対[ROM.GetNameDef]政策において有用だ。[HUN.GetNameDef]による[ROM.GetAdjective]の領土請求を後押しし、その実現に協力することで[ROM.GetNameDef]に圧力をかければ、彼らを味方に引き込めるかもしれない。"
 CZE_demanded_overlordship_HUN: "ハンガリーの従属"
 CZE_demanded_overlordship_ROM: "ルーマニアの従属"
 CZE_integrate_hungary: "旧オーストリア領土の統合"
 CZE_integrate_hungary_desc: "我々は広大な勢力圏を築いた。ここに勢力を拡大した[HUN.GetName]およびその他の領土を取り込めば、かつてのオーストリア＝ハンガリー帝国の版図を復活させられるかもしれない。ただし、その主導権は[ROOT.GetAdjective]にある。"
 CZE_subjegate_serbia: "[YUG.GetName]の従属"
 CZE_subjegate_serbia_desc: "[YUG.GetName]は弱体化し、もはや南方の緩衝国としての役割を期待できない。スロベニアを統合した今、さらなる勢力圏の拡大を図るべきだ。"
 CZE_strike_the_eastern_threat: "東の脅威の打破"
 CZE_strike_the_eastern_threat_desc: "[SOV.GetName]は、しらじらしくも我々の政府を批判することで帝国主義的野心を正当化している。これは[CZE.GetName]の存続にかかわる脅威に他ならず、これを排除しなければならない。"
 CZE_assist_austria: "[AUS.GetName]の保護"
 CZE_assist_austria_desc: "[AUS.GetNameDef]を紛争から遠ざけておくことは、我が国の安全保障上、必要不可欠だ。[AUS.GetAdjective]との国境は防備が薄く、また彼らの経済力は我々の敵国にとって格好の餌であり、これを奪われるわけにはいかない。"
 CZE_return_to_democracy: "民主主義への回帰"
 CZE_return_to_democracy_desc: "我が国の安全が確保される中で、軍事独裁体制の有効性が薄れていることに国民は気づき始めている。そのため、選挙を実施し、統治権を民主主義者が率いる政府に返還すべきだろう。"
 CZE_cooperate_with_the_allies: "同盟国との協力"
 CZE_cooperate_with_the_allies_desc: "地域内の緊張が和らいだ今、伝統的な同盟国との結びつきの回復に努めるべきだ。"
 CZE_eliminate_austrian_defeatists: "[AUS.GetAdjective]の敗北主義者の打破"
 CZE_eliminate_austrian_defeatists_desc: "[AUS.GetNameDefCap]は自らの身を守る意思を放棄した。敵が我々の玄関口に迫る前に、これに介入しなければならない。"
 CZE_the_legacy_of_ottokar: "オタカルの遺産"
 CZE_the_legacy_of_ottokar_desc: "伝説的な王であるオタカル2世は、オーストリアの貴族たちの支持を得て、ボヘミアの版図をオーストリアからアドリア海まで広げた。今回は身分の貴賤を問わず、我々は再びオーストリア人の心をつかまなければならない。"
 CZE_demand_the_istrian_peninsula: "イストラ半島要求"
 CZE_demand_the_istrian_peninsula_desc: "[ROOT.GetNameDefCap]が内陸国であるという事実は、長きにわたって貿易の障害となり、その影響力を抑え込んできた。隣国に経済の主導権を握られる状況はもはや容認できず、我々はアドリア海へのアクセスを要求すべきである。"
 CZE_demand_slovenia: "スロベニアの要求"
 CZE_demand_slovenia_desc: "スロベニアはかつてオーストリア帝国の要地だった。旧帝国の心臓部を支配下に収めた今、我々は彼らの領土を再び手に入れなければならない。"
 CZE_demand_overlordship_of_yugoslav_league: "[YUG.GetAdjective]連合の支配権の要求"
 CZE_demand_overlordship_of_yugoslav_league_desc: "多民族国家においては、[YUG.GetName]のような地方自治の仕組みが求められることもある。しかし、今の彼らに自らを守れるほどの力はなく、我々は[YUG.GetNameDef]にその事実を伝え、我々の介入を認めさせなければならない。"
 CZE_expand_the_rome_protocols: "ローマ議定書の拡大"
 CZE_expand_the_rome_protocols_desc: "我々の新政府は、[GER.capital.GetCapitalVictoryPointName]よりも[ITA.capital.GetCapitalVictoryPointName]の政府とはるかに近い理念を共有している。オーストリアをめぐる両者の対立を鑑みれば、我々がローマ議定書に参加することで、[ITA.GetNameDef]が[GER.GetNameDef]に歩調を合わせることなく現在の路線を継続しやすくなるだろう。"
 CZE_prague_protocols: "プラハ議定書"
 CZE_soviet_alliance: "1935年の同盟条約の拡大"
 CZE_soviet_alliance_desc: "現在の[SOV.GetNameDef]との同盟条約はあまりに曖昧で、我々が攻撃を受けた場合の彼らの参戦が確信できない。我が国の安全を保障したいのであれば、新たな協定を結ぶよう働きかける必要がある。"
 CZE_airlift_soviet_support: "ソ連の空輸支援"
 CZE_airlift_soviet_support_desc: "我が国と同盟国[SOV.GetAdjective]は国境を接していないため、[SOV.GetAdjective]軍の部隊を空輸するという斬新なアイデアが生まれた。これほどの規模の輸送作戦は前例がないが、少なくともこれは[SOV.GetAdjective]軍が陸路で隣国の領土に踏み入らずにすむ方法ではある。"
 CZE_unlocks_volunteer_transport_raid_tt: "§Y襲撃§!をアンロック:\n§Y[73.GetName]§!へのソビエト義勇軍航空輸送"
 CZE_intervene_in_the_ussr: "[SOV.GetAdjective]内戦への介入"
 CZE_intervene_in_the_ussr_desc: "再び[SOV.GetNameDef]が政情不安に陥っている。我々がかつて支援した旧王室の再興は望めなくとも、今よりも友好的な政府が誕生する可能性は無視できない。"
 CZE_forgive_trading_debts: "貿易債務の免除"
 CZE_forgive_trading_debts_desc: "経済不安と大恐慌により、我々の潜在的な味方国のいくつかが債務の支払いに苦慮しており、これが両国間の関係に影を落としている。政府が彼らの債務を免除し、その影響を受けた国内企業に金銭的補償をすることでこれを解決できるかもしれない。"
 CZE_improve_balkan_trade_relations: "バルカン諸国の貿易関係改善"
 CZE_improve_balkan_trade_relations_desc: "バルカン諸国を味方に引き入れるための我が国最大の武器は経済である。潜在的な同盟国に対し、彼らが経済的苦境を脱するための支援は惜しまないと示してやるべきだ。"
 CZE_ally_austria: "[AUS.GetName]との同盟"
 CZE_ally_austria_desc: "ほんの数年前、[AUS.GetNameDef]はナチスの無法者どもに滅ぼされる瀬戸際までいった。[ROOT.GetNameDef]を味方につけることで得られる利益を彼らは正しく認識すべきだ。"
 CZE_demand_the_czech_corridor: "チェコ回廊の要求"
 CZE_demand_the_czech_corridor_desc: "小協商を本格的な同盟に発展させていくにつれ、紛争発生時の同盟国への部隊展開や、同盟国からの部隊の受け入れが非常に困難になるであろうことが、ますます明らかになっている。先の大戦後に提案されたように、我が国と[YUG.GetNameDef]を結ぶ帯状の領土を確保できれば、我が国の安全保障の向上と交易の保護につながるはずだ。"
 CZE_ally_hungary: "[HUN.GetName]との同盟"
 CZE_ally_hungary_desc: "[CZE.GetNonIdeologyName]建国以来、数々の紛争が原因で[HUN.GetNonIdeologyName]との関係は冷え込んでいたが、近年彼らは貴重な同盟国となりうる資質を示している。"
 CZE_ally_yugoslavia: "[YUG.GetName]との同盟"
 CZE_ally_yugoslavia_desc: "[YUG.GetNameDefCap]は、近年経済的に困難な状況にあるが、同国の戦略資源と立地条件は無視できるものではない。"
 CZE_protect_neutrality: "中立国の保護"
 CZE_protect_neutrality_desc: "第1次大戦により、敵に狙われている状況下で中立を維持することは無益だと明らかになった。これらの国々を守ることは、敵に二正面作戦を強いた上で各個撃破による侵略を防ぐことを意味する。"
 CZE_if_cooperate_with_moderate_socialists_completed_tt: "§Y穏健派社会主義者たちとの協力§!が完了した場合の影響:"
 CZE_mutual_protection_agreement_with_switzerland: "[SWI.GetNonIdeologyName]との防衛協定"
 CZE_mutual_protection_agreement_with_switzerland_desc: "我々と[SWI.GetNameDef]は、甚大な被害なしでは侵略が不可能な水準を目指して領土の守りを固めている。両国が協力して戦力を配備することで、防衛だけでなく、果断なる反撃も可能になるだろう。"
 CZE_exchange_technology: "研究の協力"
 CZE_exchange_technology_desc: "その豊富な資源にもかかわらず、バルカン諸国は高い利益を生む植民地も大国の高度産業も持ち合わせていない。したがって、互いがそれぞれの得意分野に集中できるよう、協力して研究することが重要だ。"
 CZE_demand_corridor_to_ussr: "[SOV.GetAdjective]への回廊の要求"
 CZE_demand_corridor_to_ussr_desc: "[POL.GetNameDef]が我々に協力しない場合、[SOV.GetName]の同盟国との連絡路を確保するため、より厳しい手段を採る必要がある。"
 CZE_ally_poland: "[POL.GetName]との同盟"
 CZE_ally_poland_desc: "ポーランド・ソビエト戦争は今も記憶に新しく、西方の脅威が増すなかで、[POL.GetNameDef]もまた我々と同じく安全保障の確保を模索している。中立は何の保証にもならない、我らと運命を共にすべきだと[POL.GetAdjective]を説得する必要がある。"
 CZE_realize_the_polish_czechoslovak_confederation: "連合の実現"
 CZE_realize_the_polish_czechoslovak_confederation_desc: "勇敢に戦ったにもかかわらず、[POL.GetNameDef]は敗れた。そこで、彼らの亡命政府との連合構想が浮上している。連合を実現することで、[POL.GetAdjective]の人々をこの新たな国家に結集し、我々全員の故郷を解放するために協力して事にあたれるかもしれない。"
 CZE_integrate_western_ukrainians: "西ウクライナ人の統合"
 CZE_integrate_western_ukrainians_desc: "[CZE.GetNameDef]のウクライナ人には、政府からの寛大な支援と自治権が認められてきた。我々は今、新たに獲得した領土を、このウクライナ人勢力圏に統合できる。"
 CZE_ally_russia: "[SOV.GetNonIdeologyName]との同盟"
 CZE_ally_russia_desc: "今の[SOV.GetNameDef]政府は、より我々と近しい理念を持っている。前政府と結んだ協定の曖昧な内容を見直し、連携を強化するべきかもしれない。"
 CZE_claim_ukraine: "友好的なウクライナ政権の樹立"
 CZE_claim_ukraine_desc: "ウクライナは[SOV.GetNameDef]の重要な構成国である。これを掌握することで、強力な緩衝国を生み出せる。"
 CZE_strengthen_the_little_entente: "小協商の結成"
 CZE_strengthen_the_little_entente_desc: "主に[HUN.GetNonIdeologyName]の封じ込めを目的としている小協商だが、大規模な戦力を擁する本格的な同盟へと発展する可能性を秘めている。"
 CZE_seek_french_leadership: "[FRA.GetAdjective]の主導を要請"
 CZE_seek_french_leadership_desc: "この同盟の結成を主導したのは我々だが、[FRA.GetNonIdeologyName]の軍事力はいかなる同盟にとっても大きな戦力となるのは明らかだ。たとえ主導権を渡すことになろうとも、引き入れる価値はある。"
 CZE_increase_food_and_resource_imports: "食糧と資源の輸入の増加"
 CZE_increase_food_and_resource_imports_desc: "農業生産力に優れた同盟国を得た今、国内の農業を奨励する必要性は薄い。資源を安く輸入すれば、予算を節約できるだけでなく、味方の経済発展にもつながる。"
 CZE_double_down_on_heavy_industry: "重工業の集中強化"
 CZE_double_down_on_heavy_industry_desc: "同盟国との新たな条約の締結により、我々は武器産業のような最も競争力の高い産業にリソースを集中できる。余剰が出れば売ればよい。"
 CZE_neutralize_the_hungarian_threat: "[HUN.GetAdjective]の脅威の排除"
 CZE_neutralize_the_hungarian_threat_desc: "南方の国家との貿易において、[HUN.GetNameDefCap]は邪魔な存在だ。もし敵と手を組めば、トリアノン条約の影響があるとはいえ、我が軍の主要戦力が釘付けにされる可能性がある。"
 CZE_cancel_anti_hungary_focus: "[GER.GetAdjective]の介入後に退却"
 CZE_ally_romania: "[ROM.GetName]との同盟"
 CZE_ally_romania_desc: "[ROM.GetNameDefCap]は、周辺地域では珍しく自給自足率の高い国家であり、豊かな食料生産力と石油産出量を誇る。彼らと同盟すれば、互いの資源を利用しやすくなると同時に、敵に戦争に必要な原材料を利用されにくくなる。"
 CZE_divide_germany: "ドイツの分割"
 CZE_divide_germany_desc: "[GER.GetNameDef]の脅威に独力で対抗するのは難しい。[GER.GetAdjective]の勢力拡大に対して我々と同じように懸念を抱き、先手を打つ果断なる意思を持つ味方を求めるべきだ。"
 CZE_if_FRA_ally_tt: "§Yフランスが君主制主義§!かつ同盟国を持たない場合の影響:"
 CZE_if_POL_ally_tt: "§Y強いポーランド§!を達成し、[POL.GetNonIdeologyName]からの保証という結果に終わった場合の影響:"
 CZE_revolutionary_brigades: "革命師団の創設"
 CZE_revolutionary_brigades_desc: "[ROOT.GetNameDef]のために戦った経験を持つ革命家たちの正規軍への統合をさらに進めるべきだ。"
 CZE_recruit_communist_exiles: "共産主義亡命者の採用"
 CZE_recruit_communist_exiles_desc: "[ROOT.capital.GetCapitalVictoryPointName]は、祖国を追われた革命家たちの安息の地とみなされてきた。彼らを新政府の人材として取り立ててもいいかもしれない。"
 CZE_destabilize_potential_adversaries: "潜在的な敵への揺さぶり"
 CZE_destabilize_potential_adversaries_desc: "我々と行動を共にしている共産主義亡命者たちは、それぞれの母国の事情に詳しく、我が国の諜報員すらしのぐほどの情報を持っている。彼らの祖国解放のため、その知識を十分に活用するべきだ。"
 CZE_nationalize_key_industries: "銀行と鉱山の国有化"
 CZE_nationalize_key_industries_desc: "鉱山から産出される原材料は、我が国で戦争に使う武器を製造する際に使用される。重大な時期における材料供給の確保は、投資家や実業家などではなく、政府に委ねるのが一番良い。"
 CZE_rehabilitate_the_army: "陸軍の復帰"
 CZE_rehabilitate_the_army_desc: "[CZE.GetAdjective]軍の将軍の大部分は、ロシア内戦で赤軍相手に果敢に戦ったチェコスロヴァキア軍団の猛者たちだ。[CZE.GetAdjective]新政府に対する彼らの忠誠を改めて確認すべきだろう。"
 CZE_unlock_civil_war_army_generals_tt: "内戦で失われた指揮官たちを再獲得"
 CZE_recruit_ideologically_aligned_generals: "思想的に信頼できる将軍の任命"
 CZE_recruit_ideologically_aligned_generals_desc: "訓練計画を見直し、我が軍の新たな価値観を理解している者たちを新たな幹部候補として軍の洗練を図るべきだ。"
 CZE_recruit_communist_generic_general_tt: "共産主義者の将軍を1人獲得。"
 CZE_purge_two_random_commanders_tt: "ランダムな指揮官2人を追放。"
 CZE_czechoslovak_union: "チェコスロヴァキア連邦"
 CZE_czechoslovak_union_desc: "[CZE.GetNameDef]領内における地方自治権を拡大し、我々の共産主義体制を地方の状況に最適化させなければならない。"
 CZE_continue_industrial_relocation_schemes: "軍需工場の移転計画継続"
 CZE_continue_industrial_relocation_schemes_desc: "我が国の安全保障の観点から、脆弱な工場を陸空両面で守りやすい場所へと移転する計画を継続しなければならない。武器製造は我が国の根幹産業であり、危険にさらすべきではない。"
 CZE_continue_industrial_relocation_schemes_tt: "§Y軍需工場を1つ§!撤去。"
 CZE_continue_industrial_relocation_schemes_2_tt: "§R工場を再建する必要がある。§!"
 CZE_establish_a_armament_factory_in_uhersky_brod: "ウヘルスキー・ブロッド武器工場の創設"
 CZE_establish_a_armament_factory_in_uhersky_brod_desc: "ウヘルスキー・ブロッド・ファクトリーは、歩兵と航空機用の自動武器の製造および設計を専門としている。我々は同社を世界で最も技術力の高い製造業者とする計画を練っている。"
 CZE_appeal_to_the_castle: "「城」への訴え"
 CZE_appeal_to_the_castle_desc: "チェコスロヴァキアにおける「城」とは、大統領を支持する影響力を持つ人々や組織の広範なネットワークを指す。これにより、大統領は憲法が制限する職務を超えた影響力を行使できる。「城」からの支持を得られれば、我々が主導権を獲得する上で大きな後押しとなるだろう。"
 CZE_petition_the_nobles: "貴族への請願"
 CZE_petition_the_nobles_desc: "[ROOT.GetNameDef]の貴族階級は公式には爵位を失ったが、[ROOT.GetAdjective]社会の一部に対する影響力は依然として有している。彼らの支援は我々に正当性と資源を与えることを意味し、それによりさらなる支持を集められるだろう。"
 CZE_unify_the_fascist_parties: "ファシズム政党の統一"
 CZE_unify_the_fascist_parties_desc: "現在のファシズム政党は分裂し、広く大衆の支持を得られそうもない極端に過激な党も存在する。これらの政党を1つにまとめ、過激派以外にも訴求できるチェコスロヴァキアの展望を提示することが重要だ。"
 CZE_pro_rearmament_propaganda: "再軍備賛成のプロパガンダ"
 CZE_pro_rearmament_propaganda_desc: "より中央集権化された政府への支持を拡大するため、我々を取り巻く世界情勢の危うさを強調する必要がある。これはまた、必要に応じた軍備の増強に対する大衆の支持を促すだろう。"
 CZE_align_nationalist_parties: "チェコ民族主義政党との連携"
 CZE_align_nationalist_parties_desc: "我々はすべての[ROOT.GetAdjective]人からの支持獲得を目指すべきとはいえ、伝統的なチェコ民族主義政党が随一の政治的影響力を有している現実から目を背けることはできない。それはつまり、彼らと手を組むことが国民の支持を得る最短の道だということでもある。"
 CZE_align_slovak_catholics: "スロヴァキアカトリック協会との連携"
 CZE_align_slovak_catholics_desc: "現在のスロヴァキアでは、カトリック系政党と民族主義政党が大きな支持基盤を築いている。後者との協力は大きな譲歩なしには為しえないが、カトリック協会勢力を味方に引き入れることはできるかもしれない。"
 CZE_jozef_tiso_tt: "§Y$CZE_jozef_tiso$§!を顧問に任命"
 CZE_align_catholic_parties: "CSLとの連携"
 CZE_align_catholic_parties_desc: "チェコスロヴァキア人民党（ČSL）とその他のカトリック系政党は、かつてオーストリア＝ハンガリー帝国の君主制の支持基盤を形成していた。我々の政権下でもこれを再び実現するべきだ。"
 CZE_restore_the_monarchy: "君主制の復活"
 CZE_restore_the_monarchy_desc: "新体制への支持が確立された今こそ、その洗練された構想を国民に示す時だ。新たな君主に選ばれた$CZE_karel_schwarzenberg$は[ROOT.GetAdjective]人であり、かつて外国に押しつけられた[AUS.GetAdjective]人君主ではない。このことは、伝統的君主制主義者だけでなく、新しい世代にも訴求できる要因となるはずだ。"
 CZE_semi_constitutional_monarchy: "半立憲制"
 CZE_semi_constitutional_monarchy_desc: "君主が選ばれた今こそ憲法を改正するべきである。混迷を極めるこの時代、国内での争いを避けるために権力の集中を主張する者たちもいるが、1人の君主がすべてを担うことは不可能だ。したがって、統治の補助のために現在の体制の一部を維持したまま、君主がこの国を導いていく形が最善だろう。"
 CZE_restore_noble_titles: "爵位の復活"
 CZE_restore_noble_titles_desc: "共和国が建国された際に爵位は廃止されたが、これを復活させ、貴族層の協力に報いるべきだ。また、これによって、激しい戦いを何度もくぐりぬけてきた歴戦の精兵に対し、[ROOT.GetAdjective]国の英雄として爵位を叙することが可能になる。"
 CZE_restore_the_austro_hungarian_customs_union: "帝国の関税同盟の復活"
 CZE_restore_the_austro_hungarian_customs_union_desc: "オーストリア＝ハンガリー帝国のまぎれもない利点として、我々の産業にとって関税障壁が低かったことが挙げられる。この関税同盟を復活させることは、帝国の旧構成国を我々の勢力圏に取り込む第一歩となるだろう。"
 CZE_customs_union: "関税同盟"
 CZE_catholic_focus: "カトリック重視"
 CZE_catholic_focus_desc: "[ROOT.GetAdjective]の歴史におけるフス派は非常に有名だが、今でも多くの国民はカトリック教徒であり、彼らの社会的役割を強化して支持を呼びかけるべきだ。"
 CZE_hussite_legacy: "フス派の遺産"
 CZE_hussite_legacy_desc: "フス派はプロテスタントに近い主張を持っていただけでなく、異なる意見に対する寛容さが際立っていた。彼らとの戦争に踏み切った圧制者たちとは真逆である。"
 CZE_align_with_germany: "[GER.GetNonIdeologyName]との連携"
 CZE_align_with_germany_desc: "[GER.GetNameDef]の新政府は拡張主義を捨てたわけではないかもしれないが、協力関係を築いた相手や敵とみなした相手に対して、以前よりも実利的な態度を取る可能性がある。我々は前者となるよう努力をすべきだろう。"
 CZE_rally_against_germany: "反[GER.GetNonIdeologyName]集会"
 CZE_rally_against_germany_desc: "チェコスロヴァキアは独立のために勇敢に戦った。この独立を守るため、今こそ全国民に呼びかけなければならない。"
 CZE_integrate_sudeten_germans: "ズデーテンラントの統合"
 CZE_integrate_sudeten_germans_desc: "ズデーテンラントに住む人々の分裂は誰の利益にもならない。我々は彼らがなにを懸念しているのかを調べ、対処するべきだ。それだけで、独立を唱える者たちの「不当に扱われている」という主張は説得力を失い、彼らを黙らせることができるだろう。"
 CZE_cooperate_with_the_sdp: "SdPとの協力"
 CZE_cooperate_with_the_sdp_desc: "現在のズデーテン・ドイツ人党（SdP）は政情不安の原因となっているが、連立政権への参加など適切に働きかければ協調できる可能性がある。"
 CZE_revive_the_december_bloc: "12月連合の復活"
 CZE_revive_the_december_bloc_desc: "以前、ファシスト政党、少数派民族政党、右翼政党が連合を組み、エドヴァルド・ベネシュの大統領就任に反対した。現政府の対抗勢力として、この12月連合を復活させるべきだ。"
 CZE_revert_1926_anti_military_laws: "1927年の反軍法の撤回"
 CZE_revert_1926_anti_military_laws_desc: "$CZE_radola_gajda$主導によるクーデター未遂を受けて、軍人と憲兵隊は選挙権やその他いくつかの特権を失った。しかし、現在の困難な情勢において軍が果たしている重要な役割を考えると、これらの制限を撤廃し、軍が再び政治に関与できるようにするのは当然のことだ。"
 CZE_bop_to_fascism_support_tt: "§Y$CZE_bop_army_readiness$§!の3分の1をファシズムの支持に追加:"
 CZE_power_to_the_military: "軍に権力を"
 CZE_power_to_the_military_desc: "こと国家の防衛においては、あらゆる資源を惜しみなく投入するべきであり、それゆえに国政を担う者たちは軍の必要性を正しく理解しなければならない。それを実現する最善の方法は、軍による政権運営である。"
 CZE_militarize_the_associations: "協会の武装化"
 CZE_militarize_the_associations_desc: "[CZE.GetNameDef]における多くの協会に軍事訓練を施すことで、国民の動員を待たずして彼らを国防に寄与させることが可能になる。"
 CZE_aggressive_foreign_policy: "攻撃的な外交政策"
 CZE_aggressive_foreign_policy_desc: "吹けば飛ぶような協定に頼る時代はもう終わった。我が国の安全保障を確保するためには、たとえ大きな犠牲を伴おうとも、断固たる態度をもって臨むべきである。"
 CZE_work_with_germany: "[GER.GetNameDef]との協力"
 CZE_work_with_germany_desc: "ズデーテンにかかわる問題が解決した今、[GER.GetNameDef]は同盟国としての[ROOT.GetNameDef]の価値をようやく理解できるようになったはずだ。"
 CZE_control_the_associations: "協会の統制"
 CZE_control_the_associations_desc: "[CZE.GetNonIdeologyName]には、同業者組合、余暇の趣味の集まりやスポーツ団体に至るまで、数多くの組織が存在する。これらを統制することは社会の大部分を統制するに等しい。"
 CZE_diversify_bata: "バチャの多角化"
 CZE_diversify_bata_desc: "大手消費財メーカーのバチャは、我々の資源サプライチェーンにメリットをもたらす可能性がある企業だ。彼らは入手困難な材料の提供を通じて我々を支援してくれるだろう。"
 CZE_devaluate_the_koruna: "コルナの平価切下げ"
 CZE_devaluate_the_koruna_desc: "強い通貨は、経済の大部分を輸出産業に頼っている国家にとって望ましいものではない。コルナ安を誘導すれば短期的な悪影響はあるかもしれないが、長期的には良い経済効果をもたらすはずだ。"
 CZE_continue_the_central_bohemia_plan: "中央ボヘミア計画"
 CZE_continue_the_central_bohemia_plan_desc: "我が国中央部の工業地帯の拡大計画を継続することは、規模効果の面で有利に働く。また、それが国境から離れた地域であれば、安全保障の観点から見ても賢明である。"
 CZE_balance_industrial_invevestments: "産業開発の平均化"
 CZE_balance_industrial_invevestments_desc: "[9.getname]と[75.getname]以外の地域の発展に着手しなかったことは、この10年で我が国の分断が進んだ理由の1つである。領土の外縁部が発展していけば、中央部との経済発展の差を縮める一助となるはずだ。"
 CZE_expand_prf_science_facilities: "PrFの科学施設の拡大"
 CZE_expand_prf_science_facilities_desc: "Prfの科学施設には、今よりも大きな仕事を成し遂げられる機会を待つ優秀な人材が大勢いる。この部門を拡大し、政府と連携させることは、我が国の研究を強化するための第一歩となるだろう。"
 CZE_raise_more_industrial_funds: "工業への予算増額"
 CZE_raise_more_industrial_funds_desc: "オーストリア＝ハンガリー帝国の時代から今日に至るまで、工業は我が国の根幹である。基本予算や投入資金を増やせば、この混乱するヨーロッパにおいて成長を続けられるかもしれない。"
 CZE_skoda_priority_focus_info_tt: "一部の§Y国家方針§!は、 £GFX_CZE_skoda_text_icon §Yシュコダの優先事項§!を特定のものに設定することが完了の条件になっている。これらの国家方針は、必要な £GFX_CZE_skoda_text_icon §Yシュコダの優先事項§!に関連した小さなアイコンで示される。"
 CZE_joint_stock_schemes: "ジョイントストック・カンパニー"
 CZE_joint_stock_schemes_desc: "ジョイントストック・カンパニーは、従来の資金調達方法では不十分な場合における我が国の経済成長の原動力となってきた。この仕組みを今後も存分に活用することで、さらなる経済成長が見込めるだろう。"
 CZE_the_slovak_arrow: "スロヴァキアの矢"
 CZE_the_slovak_arrow_desc: "我が国の主要都市を結ぶ高速鉄道を実現すれば、国家の威信が大いに高まるだろう。また、鉄道インフラへ投資するうってつけの理由にもなる。"
 CZE_finish_double_tracking_efforts: "複線化への注力"
 CZE_finish_double_tracking_efforts_desc: "いくつかの重要な鉄道路線の複線化を完了させることで、これらの路線の輸送能力が向上し、一部の地方都市間の接続も改善される。"
 CZE_realize_motorway_proposals: "高速道路計画の実伝"
 CZE_realize_motorway_proposals_desc: "国内の道路の連結性を大いに高める、高速道路の建設計画がいくつか我々の政府に提案されている。これらの計画の実現に着手すべきだろう。"
 CZE_build_additional_rail_stations: "路線駅の追加建設"
 CZE_build_additional_rail_stations_desc: "鉄道インフラが新たに敷設された今、既存の駅の中には輸送量の増加に対応しきれていないものがある。鉄道の処理能力を改善することで、人と物を必要な場所へより多く輸送できるようになるはずだ。"
 CZE_build_additional_rail_stations_focus_cost_tt: "§Y$CZE_devaluate_the_koruna$§!を選択すると、この国家方針の所要日数が§G35§!日に短縮される。"
 CZE_grow_ckd_secondary_facilities: "ČKDの補助的施設"
 CZE_grow_ckd_secondary_facilities_desc: "ČKDは、発電機などの重要な工業製品を生産する小規模な補助的工場を多数有している。これらの工場を拡大すれれば、我が国の重工業の発展に寄与するだろう。"
 CZE_bolster_domestic_construction: "国内建設の支援"
 CZE_bolster_domestic_construction_desc: "我が国の国内建設業は、第1次大戦後の独立以来、安定した成長を遂げている。中規模の建設請負業者に追加で資金を投じることで、さらなる成長が見込めるだろう。"
 CZE_invest_in_vhht: "VHHTへの投資"
 CZE_invest_in_vhht_desc: "ヴィートコヴィツェ鉱山・金属製鉄会社（VHHT）は、国内中にさまざまな金属加工工場を持つ企業である。彼らに投資し、事業を拡大させることで、我が国における将来の金属生産量の増加に寄与するだろう。"
 CZE_expand_vitkovice_ironworks: "ヴィートコヴィツェ製鉄所の拡大"
 CZE_expand_vitkovice_ironworks_desc: "ヴィートコヴィツェ製鉄所は、[74.getname]内の重要な鉄の供給元である。この製鉄所を拡大すれば、生産量は目に見えて増加するだろう。"
 CZE_expand_central_bohemian_mines: "中央ボヘミアの鉱山の拡張"
 CZE_expand_central_bohemian_mines_desc: "我が国の中央部に位置する鉱山は、我々のエネルギー安全保障にとって極めて重要だ。これらの鉱山をできるだけ早く拡張しなければならない。"
 CZE_increase_bauxite_imports: "ボーキサイトの輸入増加"
 CZE_increase_bauxite_imports_desc: "我が国はアルミニウムが豊富とは言えないが、ボーキサイトの輸入量を増やし、適切な製錬方法を用いれば、国内でも少量のアルミニウム生産が可能だ。これによって資源不足を多少なりとも軽減できるだろう。"
 CZE_merge_the_oil_companies: "石油会社の統合"
 CZE_merge_the_oil_companies_desc: "我が国の石油会社はどれも規模が小さく、いくつかの油井の周りに点在している。これらすべてを国の管理下に置けば、我々の石油産業は少ない資源でより多くのことが為せるようになるはずだ。"
 CZE_expand_trinec_ironworks: "トジネツケー製鉄所"
 CZE_expand_trinec_ironworks_desc: "トシネツキ製鉄所は創業以来、[72.getname]の産業における巨人として君臨してきた。さらなる投資によって、資源生産における莫大な利益が得られるだろう。"
 CZE_consolidate_mining_operations: "鉱山事業の統合"
 CZE_consolidate_mining_operations_desc: "我々の鉱山事業は、複数ある企業の経営を1つに合併整理することで、経営の効率化と最適化が期待できる。また、各企業の技術と取り組みを活用し、既存の鉱山の生産効率も改善できるだろう。"
 CZE_expand_praga: "プラガとの契約"
 CZE_expand_praga_desc: "ここ数年、プラガは我々の軍需産業における様々な機械部品の供給源となっている。さらなる成長を助ける追加の契約を結び、彼らの貢献に報いるべきだろう。"
 CZE_shrink_educational_disparities: "教育格差の縮小"
 CZE_shrink_educational_disparities_desc: "我が国の地方部は、都市部と比べて教育環境が十分ではない。地方を対象とした大規模な教育プログラムを実施し、教育格差の解消に取り組む必要がある。"
 CZE_kickstart_rapid_rearmanent: "高速再軍備の始動"
 CZE_kickstart_rapid_rearmanent_desc: "多くの政治家と実業家はひどい決断だと見なすかもしれないが、我々は今こそ再軍備を開始する必要がある。周辺国が軍備縮小どころか増強を進めているのは公然の秘密となっている。備える時間があるうちに我々も軍備を整えるべきだ。"
 CZE_keep_focus_on_weapon_exports: "武器輸出重視の継続"
 CZE_keep_focus_on_weapon_exports_desc: "我々は、武器の輸出産業のおかげで経済不況の影響を免れている。この方針を変更することは政治的にも経済的にも悪手でしかなく、現状では方針の継続が最善だ。迫り来る脅威など大げさに誇張されているだけだ。"
 CZE_force_the_industrialists_hand: "産業界への決断の強制"
 CZE_force_the_industrialists_hand_desc: "実業家や巨大企業は、我々が再軍備を進めるのを長い間妨げてきた。国家のため、彼らに代わって我々が決断を下す時だ。"
 CZE_embrace_corporatism: "協調主義の受け入れ"
 CZE_embrace_corporatism_desc: "実業家たちと交渉し、相手の要求の一部を聞き入れるのと引き換えに、再軍備への協力を求めてもいいかもしれない。彼らの利益を目的とした政策変更を行うことは妥当であり、我らの利益にもかなうだろう。"
 CZE_expand_existing_armory_plants: "既存の軍需工場の拡張"
 CZE_expand_existing_armory_plants_desc: "既存の軍需工場の一部を移転させることは、高いコストに比べて得られる長期的リターンが見合っていない。対して、既存の工場を拡張することで、現在の立地のまま生産と研究の両面で有益な発展が見込める。敵の攻撃を受けやすい地理的リスクを考慮しても、こちらの選択が望ましいだろう。"
 CZE_expand_skoda_offices: "シュコダの事務所拡大"
 CZE_expand_skoda_offices_desc: "我々の海外事務所は武器の輸出を大いに後押ししている。これを拡大して新たな販売網を開拓することは賢明な選択と言えるだろう。"
 CZE_skoda_office_unlock_tt: "ディシジョンのアンロック: §Y武器販売事務所の建設§!"
 CZE_complete_the_power_grid: "送電網の完成"
 CZE_complete_the_power_grid_desc: "我が国の地方における送電網を完成させるためには、さらなる努力を必要とするが、他の地域と比べて経済発展を進める上での妨げとなっている。"
 CZE_build_the_slapy_reservoir: "スラピ貯水湖の建設"
 CZE_build_the_slapy_reservoir_desc: "スラピ近郊にダムを建設すれば、大きな電力がまかなえるだけでなく、地域の経済発展にも寄与する。電力供給の増加は、地域の産業の成長を大きく後押しするはずだ。"
 CZE_diversify_refinery_processes: "精製工程の多角化"
 CZE_diversify_refinery_processes_desc: "我が国で算出する石油からはさまざまな石油製品が作れるはずだ。問題は、我々がその方法を知らないことにある。そのための技術研究に力を注げば、この夢を現実にできるかもしれない。"
 CZE_enlarge_smaller_wells: "小規模油井の拡大"
 CZE_enlarge_smaller_wells_desc: "我が国の油井は小さく、現在はわずかな石油を産出しているにすぎないが、その量を大幅に増やせるはずだ。時間をかけてそのための方法を生み出せばいい。"
 CZE_develop_sudetenland_resources: "ズデーテンラントの資源開発"
 CZE_develop_sudetenland_resources_desc: "ズデーテンラントには多くの資源が手つかずで眠っている。資金を投じ、この地に鉱山を増やさない手はないだろう。"
 CZE_grow_tatras_capabilities: "タトラの生産能力の強化"
 CZE_grow_tatras_capabilities_desc: "現在のタトラ社の小型戦車部門は、新規性のある戦車の開発を進めている。彼らに追加の資金を投じることで、先進的な装甲の開発を継続できるはずだ。"
 CZE_bailout_moser: "モーゼルへの財政支援"
 CZE_bailout_moser_desc: "大恐慌の後、モーゼル社の経営は苦しい状況が続いている。彼らに金銭的支援を行い、工場を再開させ、解雇された労働者たちを呼び戻すよう働きかけるべきだ。"
 CZE_merge_skodas_consumer_good_plants: "シュコダの消費財工場の統合"
 CZE_merge_skodas_consumer_good_plants_desc: "シュコダは小規模な消費財工場を数多く有しており、それらは分散したままだ。これらの運営を集約することで、生産効率の最適化に役立つだろう。また、シュコダ全体に幅広いメリットをもたらす可能性もある。"
 CZE_giant_of_central_europe_industry: "産業の巨人"
 CZE_giant_of_central_europe_industry_desc: "かつては不可能だと考えられていた高み。今や我々は、ヨーロッパの産業における最大の国家だ！"
 CZE_continue_armed_force_reform: "軍改革の継続"
 CZE_continue_armed_force_reform_desc: "策定された計画に従って我々の軍の近代化を継続し、軍管区を各地方司令部に再編することで、将来の紛争においてより優れた連携を発揮できるだろう。"
 CZE_air_force_officer_recruitment: "空軍士官の採用"
 CZE_air_force_officer_recruitment_desc: "空軍予備仕官学校と連携しつつ、各地の航空クラブに飛行訓練と実弾演習を実施させることで、重要な人材である予備役将校の採用を進めるべきだ。"
 CZE_national_defense_act: "国防法"
 CZE_national_defense_act_desc: "この防衛法は、国家防衛最高評議会（NROS）の監督下において、国家の主権、尊厳、統一、安全に対する脅威または攻撃に対抗するための、軍事的手段に留まらないあらゆる手段を内包する。"
 CZE_car_and_oil_rationing: "自動車と燃料の配給"
 CZE_car_and_oil_rationing_desc: "自家用車を配給し、必要に応じて徴発することで、自動車の生産に集中するとともに資源を軍事需要に利用できる。"
 CZE_expand_airfield_capacity: "飛行場の受け入れ能力の拡大"
 CZE_expand_airfield_capacity_desc: "第3航空部門では、飛行機の適切な運用、格納、修理を実現するため、新たな飛行場と格納庫の建設を計画している。さらに、最近設立された飛行隊と地上要員の寝泊まりする宿舎も建設予定だ。"
 CZE_trust_in_old_guard: "守旧派の信用"
 CZE_trust_in_old_guard_desc: "我々が揺るがぬ信頼を寄せる古参兵が持つ航空技術と、先の大戦における彼らの経験は、新しい世代へと受け継がれていくだろう。"
 CZE_expand_the_aero_clubs: "航空クラブの拡大"
 CZE_expand_the_aero_clubs_desc: "優秀なパイロットを継続して輩出する航空クラブは、我が国にとって実に有用な組織だ。彼らの存在をさらに大きくするべきだろう。"
 CZE_invest_in_the_smaller_air_plants: "小型航空機工場への投資"
 CZE_invest_in_the_smaller_air_plants_desc: "新興の小型航空機メーカーへの投資は、既存の企業に必要な競争をもたらすだろう。また、我が国の広範な生産需要に対応する一助ともなるはずだ。"
 CZE_continue_avia_expansion: "アヴィアの拡大継続"
 CZE_continue_avia_expansion_desc: "アヴィアへの投資は、彼らの生産能力を高めるための設備投資を可能にする。これによって、高い需要を抱える航空機体の生産効率が大幅に上がるだろう。"
 CZE_increase_military_aeronautical_institute_funding: "軍事航空研究所予算の増加"
 CZE_increase_military_aeronautical_institute_funding_desc: "航空試験研究所（VZLÚ）の施設を追加で建設することで、航空力学に関する知見が深まり、我々の航空機がさらに洗練されるはずだ。"
 CZE_air_training_abroad: "海外での航空訓練"
 CZE_air_training_abroad_desc: "訓練生を友好国の空軍に派遣すれば、彼らが帰還した際、多角的な視点による広い知見と直接的な経験を我が国にもたらしてくれるだろう。"
 CZE_establish_air_defense_zones: "防空圏の確立"
 CZE_establish_air_defense_zones_desc: "我々の新たな対空砲を要地と工場に配備し、領域レベルの通信拠点を通じて防空圏を確立することで、我々の防空能力の精度を最適化できるだろう。"
 CZE_establish_air_defense_zones_enable_tt: "§Y防空圏§!の有効化"
 CZE_establish_air_defense_zones_tt: "固定対空砲の命中率補正: §G+10%§!"
 CZE_the_air_is_our_sea: "天は我らの海なり"
 CZE_the_air_is_our_sea_desc: "体系的なパイロット訓練のもと、我々のパイロットたちは勇敢かつ大胆に空を舞う。「我らが土地に港も船もなく、天こそが我らの海なり」"
 CZE_bring_kramer_and_lobel_under_state_control: "クラマー・ウント・ローブルの国営化"
 CZE_bring_kramer_and_lobel_under_state_control_desc: "クラマー・ウント・ローブル（Kramer & Löbl）を国営化することで、継続的研究のほか、必要不可欠な電気機器と通信用部品の適時調達が可能になる。"
 CZE_second_to_none: "右に出るものはなし"
 CZE_second_to_none_desc: "我々の航空産業が誇る飛行機の設計は、日夜改良が加えられている。さらなる研究を進めれば、もはや世界のどこを探しても、この分野で我々の右に出るものはいなくなるだろう！"
 CZE_diversify_airframe_production: "航空機生産の多角化"
 CZE_diversify_airframe_production_desc: "空での作戦行動を戦闘機だけに頼るわけにはいかない。さまざまな作戦を実行するためには、大型の機体などその他の航空機が必要だ。"
 CZE_projekt_l_52: "L-52計画"
 CZE_projekt_l_52_desc: "現在はまだ技術が未熟とはいえ、ジェットエンジンは将来の軍用航空機にとって必要不可欠になるだろう。そのための計画にしっかりと時間をかけ、専用の機体を設計すれば、時代を先取りできる。"
 CZE_fund_vladimir_mandl_research: "ウラジミール・マンドルの研究への出資"
 CZE_fund_vladimir_mandl_research_desc: "$CZE_vladimir_mandl$という名の、ロケット技術の構想に夢中になっている弁護士がいる。彼と協力し、研究の実用化に必要なリソースを与えてやれば、大きな利益が得られるかもしれない。"
 CZE_mobilize_the_reserves: "予備役の動員"
 CZE_mobilize_the_reserves_desc: "我が国の国境付近における緊張は悪化の一途をたどっている。兵役登録情報に従い、予備役と事前に選抜された軍事専門家を招集しなければならない。"
 CZE_three_kings: "3人の王"
 CZE_three_kings_desc: "我々のレジスタンスを公的に支援すれば、軍に対する彼らの攻撃能力は大きく高まる。また、戦場で我々の軍に協力するかもしれない。"
 CZE_form_the_state_defense_guard: "国家防衛隊の結成"
 CZE_form_the_state_defense_guard_desc: "我が国の長大な国境の防衛に特化した部隊、国家防衛隊（Stráž obrany státu）を編制するべきだ。訓練を受け、組織化された部隊であるため、もし国境が侵された場合は第一防衛線として機能するだろう。"
 CZE_expand_the_horska_divisions: "チェコ山岳師団の拡大"
 CZE_expand_the_horska_divisions_desc: "我々の国土はほとんどが低い丘陵と台地から成っているため、高地での戦闘に特化した部隊が重要な役割を果たすだろう。"
 CZE_develop_horska_artillery: "チェコ山岳砲兵の開発"
 CZE_develop_horska_artillery_desc: "現在我々が使用している火砲を軽量化、分解可能なものに改良すれば、山岳や丘陵地帯においても我が軍は十分な火力を確保できる。"
 CZE_develop_horska_artillery_tech_tt: "§Yチェコ山岳砲兵§!を有効化\n§Y砲兵（山岳）§!\n  攻撃: §G+10%§!\n  移動: §G+10%§!\n§Y砲兵（丘陵）§!\n  攻撃: §G+10%§!\n  移動: §G+10%§!"
 CZE_bribery_investigations: "贈賄の調査"
 CZE_bribery_investigations_desc: "兵士の食事と治療に関する匿名の手紙を受け取った。複数の補給将校による不正行為を、証拠とともに告発するものだ。これ以上軍に悪影響が出る前に、このような不正は正さなければならない。"
 CZE_bribery_investigations_remove_effect_tt: "この国民精神は国家方針「§Y$CZE_bribery_investigations$§!」を完了すると削除される"
 CZE_opl_exercises: "対空防衛演習"
 CZE_opl_exercises_desc: "我が軍の連携の強化と被害抑制を目的にした機動訓練として対空防衛（OPL）演習を実施することで、部隊全体の機動力と安全性を高められる。"
 CZE_rapid_response_divisions: "高速師団"
 CZE_rapid_response_divisions_desc: "敵よりも迅速に再配置できる機動部隊の効果を外国の軍が実証し、その潜在能力が明らかとなった。我々も同様の部隊を創設し、評価を行うべきだ。"
 CZE_redouble_tank_development_efforts: "戦車開発の集中強化"
 CZE_redouble_tank_development_efforts_desc: "現在の我々が持つ軽戦車の設計は、他のヨーロッパ諸国が持つそれと比べると改善の余地が大きい。彼らと肩を並べるべく、戦車の開発により一層の力を入れるべきだ。"
 CZE_rearmed_and_retooled: "再軍備、再利用"
 CZE_rearmed_and_retooled_desc: "現在の我々が持つ重戦車の車体には近代化の余地が見られる。将来の装甲部隊の拡充に対応するためにも、この方向性を引き続き追求すべきだ。"
 CZE_establish_the_fall_backlines: "撤退線の設定"
 CZE_establish_the_fall_backlines_desc: "我々の防衛線がどこかで破られる可能性があるという事実を直視しなければならない。あらかじめ撤退線を設定しておけば、防衛線を抜かれた場合に勝敗を大きく左右する可能性がある。"
 CZE_establish_the_fall_backlines_masterful_delay_tactic_tt: "\n戦術を有効化: §Y$tactic_masterful_delay$§!"
 CZE_anti_tank_development: "対戦車砲の開発"
 CZE_anti_tank_development_desc: "多くの国で装甲部隊の規模が拡大の一途をたどっている今、対戦車砲の改良は必須事項だ。敵を止められるか、それとも突破されるかは、野戦砲で戦車に対処できるかどうかにかかっている。"
 CZE_anti_tank_development_tech_tt: "§Y対戦車砲改良§!有効化\n§Y砲兵§! 貫徹: §G+5%§!\n§Y支援砲兵§! 貫徹: §G+5%§!\n§Y対戦車砲兵§! 貫徹: §G+5%§!\n§Y支援対戦車砲兵§! 貫徹: §G+5%§!"
 CZE_recon_in_force: "威力偵察"
 CZE_recon_in_force_tech_tt: "§Y威力偵察§!を有効化\n§Y偵察中隊§!: HP: §G+5§!\n偵察: §G+10.0%§!"
 CZE_recon_in_force_desc: "偵察部隊を敵と接触させ、防衛網を調べさせることは、情報を集めるのに極めて有効である。"
 CZE_integrate_fortification_engineers: "要塞技術者の統合"
 CZE_integrate_fortification_engineers_desc: "我々の軍事要塞技術者が要塞建設に従事していない間、彼らを素早く前線の任務に割り当てて防備を固めればよい。これにより、前線部隊がより優れた仮設防衛施設を構築するのを助け、我が軍の防衛能力を高められる。"
 CZE_integrate_fortification_engineers_tech_tt: "§Y要塞技術者の統合§!の有効化\n§Y工兵中隊§!:\n塹壕陣地 §G+10.00%§!\n§Y（要塞）§!\n防御 §G+10.0%§!"
 CZE_concealment_efforts: "隠蔽への注力"
 CZE_concealment_efforts_desc: "対地攻撃機と偵察機が広く使用されるようになった今、偽装ネットやその他の隠蔽手段は必要不可欠だ。戦場で部隊をしっかりと隠蔽できるように力を尽くさなければならない。"
 CZE_concealment_efforts_tech_tt: "§Y改良型偽装ネット§!の有効化\n§Y歩兵（森林）§!\n 防御: §G+10%§!"
 CZE_elevate_the_vsv: "陸軍大学校の強化"
 CZE_elevate_the_vsv_desc: "軍の中枢に籍を置くということは、国家の趨勢にかかわる重責を担うということである。したがって、参謀本部の将校たるもの、専門的な訓練過程で優秀な成績を修め、信頼でき、自制心に長け、如才なく振る舞える人物でなくてはならない。"
 CZE_continue_with_snejdareks_plan_dynamic: "[CZE_continue_with_snejdareks_plan]"
 CZE_continue_with_snejdareks_plan_default: "シュネイダーレクの計画続行"
 CZE_continue_with_snejdareks_plan_no_snejdareks: "静的防衛計画を続行"
 CZE_continue_with_snejdareks_plan_dynamic_desc: "効果的な防衛網を敷くことで、敵部隊による予想外の突破を防止できる。さらに、防衛力の強化につながるほか、戦略的防衛から攻撃へと移行する際の大きな下支えにもなる。"
 CZE_go_with_vojcechovskys_plan_dynamic: "[CZE_go_with_vojcechovskys_plan]"
 CZE_go_with_vojcechovskys_plan_default: "ルージャの計画の採用"
 CZE_go_with_vojcechovskys_plan_no_luza: "積極防衛ドクトリン"
 CZE_go_with_vojcechovskys_plan_dynamic_desc: "静的な防御には、機動ができないという欠点がある。ひとたび突破されてしまえば、その防衛隊は攻勢に転用もできず、むなしくその場に留まるのみだ。"
 CZE_improve_the_current_officer_pool: "現在の将校層の改善"
 CZE_improve_the_current_officer_pool_desc: "我が軍の中核を担うに足る資質を示した個人を昇進させるべきだ。彼らは、上級司令部と現地部隊間の監督役や調整役としても重要である。"
 CZE_elevate_slovak_officers: "スロヴァキア人士官の強化"
 CZE_elevate_slovak_officers_desc: "軍におけるスロヴァキア人の地位向上に努め、彼らの影響力を高めるべきだ。スロヴァキア地方出身者に対する要件を一部緩和することで、将来的な軍の結束力向上が期待できる。"
 CZE_promote_moravec_writings: "モラヴェッツの著作の宣伝"
 CZE_promote_moravec_writings_desc: "モラヴェッツの著作『兵士と時代』『国家防衛論』は賛否両論を巻き起こしたが、最近出版された『中欧における我が国の軍事的重要性』はヨーロッパ中の日刊紙で取り上げられた。我が国が誇る防衛政策と軍事史の諸問題における専門家として、彼が執筆活動を続けられるように支援するべきだ。"
 CZE_lessons_of_war: "戦争の教訓"
 CZE_lessons_of_war_desc: "同等の敵との戦争経験を積んだ我々は、これを教訓として活かし、最高司令部の改善に努めるべきだ。敵軍との実戦経験に勝る訓練は存在しない。"
 CZE_lessons_of_war_i_had_war_with_major_flag: "主要国と戦争状態であった"
 CZE_for_the_homeland: "祖国のために"
 CZE_for_the_homeland_desc: "我が軍は目前に迫った試練に立ち向かう準備が完全に整っており、祖国防衛の準備は万端といえる。我々はいかなる任務にも立ち向かう覚悟ができている。"
 CZE_the_lions_roar: "獅子の咆哮"
 CZE_the_lions_roar_desc: "チェコスロヴァキアの獅子の国章は、我が軍に備わっている勇気、力、最高レベルの英雄精神という最高の資質を象徴している。我が国の比類なき精神をすべての者が知ることになるだろう。"
 CZE_diversify_our_specialists: "専門家の多角化"
 CZE_diversify_our_specialists_desc: "山岳部隊だけでなく、我々は多様なスペシャリストを揃えるべきだ。戦闘は山や丘陵地帯だけで起こるとは限らないのだから。"
 CZE_merge_the_financial_and_state_guard: "財務警察と国防隊の統合"
 CZE_merge_the_financial_and_state_guard_desc: "国家防衛隊が結成された今、もはや財務警察の役目は終わった。財務警察を国防隊に統合すれば、手早く増員できる。"
 CZE_merge_the_financial_and_state_guard_tt: "§Y財務警察の統合§!の有効化\n§Y憲兵§!: HP: §G+5§!"
 CZE_logistics_beyond_the_sudetes: "ズデーテン山地を越えた兵站"
 CZE_logistics_beyond_the_sudetes_desc: "ズデーテン山地の向こう側で戦闘作戦を実施するなら、兵站線をどのくらいの長さまで伸ばせるかを把握する必要がある。領土内におけるそれとは大きく変わってくるからだ。"
 CZE_logistics_beyond_the_sudetes_tt: "§Y補給物資投下の改善§!の有効化\n§Y補給中隊§!: 物資使用量: §G-10%§!"
 CZE_expand_the_river_monitor_fleet: "河川モニター艦隊の拡充"
 CZE_expand_the_river_monitor_fleet_desc: "我々の河川モニター艦隊はヨーロッパ最大規模であり、内陸部の防衛に役立っている。これをさらに拡充することで、防衛能力が大きく上がるだろう。"
 CZE_the_tvp_project: "TVP計画"
 CZE_the_tvp_project_desc: "国内設計の戦車開発計画として、汎用型戦車（TVP）の開発を軍部が提案してきた。戦車製造の経験が豊富な一部の国内メーカーもこの計画に興味を示している。"
 CZE_expand_the_land_department_of_vtu: "VTÚの土地局の拡大"
 CZE_expand_the_land_department_of_vtu_desc: "軍事技術研究所（VTÚ）の土地局を強化することで、さらなる設備や土地の獲得を助け、今後の我が軍の兵装開発研究を後押しできる。"
 CZE_department_two_expansion: "参謀本部第2部"
 CZE_department_two_expansion_desc: "我が国における敵の諜報活動を妨害するため、我々の諜報機関である参謀本部第2部にさらなるリソースを投じる必要がある。それはまた、同機関内の特定の部門の拡大にもつながるだろう。"
 CZE_military_intelligence: "軍事情報部"
 CZE_military_intelligence_desc: "諜報活動において、軍事情報は極めて重要だ。これを集中的に強化すれば相応の結果が見込めるだろう。"
 CZE_air_intelligence: "航空情報部"
 CZE_air_intelligence_desc: "敵の空軍がどれだけの航空機を有しているのかを把握することは、空をめぐる戦いにおいて極めて重要な意味を持つ。敵の航空戦力に関する正確な情報があれば、航空戦を有利に運べるだろう。"
 CZE_within_the_eagles_nest: "鷲の巣の中で"
 CZE_within_the_eagles_nest_desc: "我が国の玄関先となる土地にスパイと工作員を展開することは、軍事面で大きな意味を持つ。参謀本部第2部の協力により、同地における我々の諜報網は大きく成長するだろう。"
 CZE_restart_naval_gun_production: "艦載砲の生産再開"
 CZE_restart_naval_gun_production_desc: "シュコダ財閥は、オーストリア＝ハンガリー帝国最大の艦載砲設計、製造事業者だった。彼らの事業を再開させ、艦載砲の国内生産を再び始めるべきだ。"
 CZE_restart_naval_gun_production_tt: "§Yシュコダの優先度§!「海軍重視」§Y有効§!"
 CZE_reform_the_naval_detachment: "海軍支隊の再結成"
 CZE_reform_the_naval_detachment_desc: "海軍支隊は、陸軍に合流すべきとして近年解散された。しかし、最近の情勢を鑑みれば、その復活は必要不可欠である。"
 CZE_build_2_dockyards_when_we_have_coast_tt: "沿岸§Y州§!を支配している場合、1つのランダムな沿岸州に§Y海軍造船所§!が§G2§!つ即座に建設される"
 CZE_skoda_naval_yards: "シュコダ海軍工廠"
 CZE_skoda_naval_yards_desc: "かつてオーストリア＝ハンガリー帝国は海軍工廠を持っていた。海へのアクセスを手に入れた我々は、今も我が国に残っている知識を活かし、これを復活させるべきだ。まずは国内に造船所を築くことが最優先となる。"
 CZE_build_3_dockyards_when_we_have_coast_tt: "沿岸§Y州§!を支配している場合、1つのランダムな沿岸州に§Y海軍造船所§!が§G3§!つ即座に建設される"
 CZE_legacy_of_the_kriegsmarine: "帝国海軍の遺産"
 CZE_legacy_of_the_kriegsmarine_desc: "さほど遠くない過去、大型戦艦建造の支援をした我々には、今もその技術が残っている可能性は高い。オーストリア＝ハンガリー帝国の艦船を建造する手助けをした、まさにその工場の中に受け継がれているはずだ。"
 CZE_build_off_old_ganz_danubius_designs: "ガンツ・ダヌビウスの旧設計の利用"
 CZE_build_off_old_ganz_danubius_designs_desc: "新しく巡洋艦を建造するにあたり、ガンツ・ダヌビウス社の設計が役に立つだろう。関連する知識を持つ人々は今も領内に残っているはずだ。"
 CZE_modernize_trieste_designs: "トリエステの設計の近代化"
 CZE_modernize_trieste_designs_desc: "オーストリア＝ハンガリー帝国海軍でかつて運用されていた小型戦艦の設計図を参考にすれば、戦艦の建造方法についてより良い知見が得られるはずだ。"
 CZE_leverage_gunboat_experience: "砲艦の設計経験の活用"
 CZE_leverage_gunboat_experience_desc: "砲艦を設計した経験は、現在の我々が持つ知識の土台となっており、これを新たな駆逐艦設計の迅速化に役立てられるかもしれない。"
 CZE_revive_kraljevica_designs: "クラリェヴィツァの設計の再利用"
 CZE_revive_kraljevica_designs_desc: "我々が持つ砲艦建造の知識を使い、かつてのクラリェヴィツァの設計を研究することで、これらを駆逐艦建造に再利用できるかもしれない。"
 CZE_wolfs_of_bohemia: "ボヘミアの狼"
 CZE_wolfs_of_bohemia_desc: "我々の中には今も潜水艦の建造経験が残っている。我々自身による群狼戦術を実行するのも難しくはないかもしれない。"
 CZE_raider_lineage: "襲撃者の血統"
 CZE_raider_lineage_desc: "オーストリア＝ハンガリー帝国海軍に所属していた将校たちは、果敢に敵を襲撃していた。彼らの系譜に連なる我々は、その性質を活用するべきだ。"
 CZE_a_modern_navy: "近代的な海軍"
 CZE_a_modern_navy_desc: "我々の海軍技術は進歩を遂げた。我が国の海軍はついに近代化を果たしたと言えるだろう。"
 CZE_build_1_dockyards_when_we_have_coast_tt: "沿岸§Y州§!を支配している場合、1つのランダムな沿岸州に§Y海軍造船所§!が§G1§!つ即座に建設される"
 CZE_naval_aviation: "海軍航空隊"
 CZE_naval_aviation_desc: "空母と艦載機が今後の海戦におけるカギとなりそうだ。この新たな海上戦闘分野の研究に投資する必要がある。"
 CZE_across_the_atlantic: "大西洋を越えて"
 CZE_across_the_atlantic_desc: "海軍が効果的に活動するためには、大洋を越えて行動する必要がある。我々の海軍が長距離航行できるようにするべきだ。"
 CZE_joint_equipment_designs: "共同装備設計"
