 ### INS News
 taog_news.1.t: "オランダ・インドネシア連合の夜明け"
 taog_news.1.desc: "ウィルヘルミナ女王は昨日、[1058.GetName]で声明を発し、予想外にもオランダ＝インドネシア連合国家の樹立を発表した。本国が占領されるなか、亡命中の[HOL.GetAdjective]政府と[INS.GetAdjective]政庁は、王権の下で一体となって統治を行うことで合意した。両国の当局者は、この動きは選択というより必要に迫られた措置であり、二大陸にまたがる王国の統一と権威を維持するための必死の試みだと説明している。"
 taog_news.1.a: "興味深い展開だ。"
 taog_news.2.t: "インドネシア独立宣言"
 taog_news.2.desc: "本日、[INS.GetAdjective]の革命家[INS.GetLeader]はジャワで演説し、新たに成立したインドネシア共和国の独立を宣言した。[HOL.GetNameDef]はこの新共和国の主権を認めていないが、共和派民兵はすでに一部地域で事実上の支配権を握っている。"
 taog_news.2.a: "これは世界規模の大きな変化を引き起こすかもしれない。"
 ############
 ### SIAM ###
 ############
 siam.1.t: "[SIA_phraya_phahon.GetName]の醜聞"
 siam.1.desc: "[SIA_phraya_phahon.GetName]は、王室所有の不動産を市場価格を下回る値で官僚に売却した疑いで告発された。この醜聞により、人民議会における彼の正当性は著しく損なわれている。[SIA_phraya_phahon.GetName]の影響力も終わりを迎えつつあるようだ。"
 siam.1.a: "これで、別の誰かに道が開けるかもしれない。"
 #Spmgsiradet rebellion historical
 siam.2.t: "[SIA_plaek_phibunsongkhram.GetName]への3度目の暗殺未遂"
 siam.2.desc: "ロイター通信のバンコク特派員からの報告によると、シャム首相（ピブーンソンクラーム氏）に対する過去4年間で3度目の毒殺未遂が明らかになった\n先週、食事に毒が混入され、ピブーン氏とその妻、娘が一時的に体調を崩したという。\nイギリス外相（ハリファックス卿）はピブーン氏へのメッセージの中で、首相の命を狙ったこの卑劣な企てに驚きを示すとともに、彼が難を逃れたことへの喜びを表した。" #https://trove.nla.gov.au/newspaper/article/47990695
 siam.2.a: "一体だれがこんなことを？"
 siam.3.t: "プラヤー・ソンスラデートの追放"
 siam.3.desc: "プラヤー・ソンスラデートは、[SIA_plaek_phibunsongkhram.GetName]に対する一件以上の暗殺未遂事件の黒幕であり、その政権に対するクーデターも計画していたとして告発されている。政府の意向により、プラヤー・ソンスラデートは指揮権を解かれ、階級と称号を剥奪され、年金なしで軍を退役させられたうえ、国外へ追放された。\n批評家たちは、これは[SIA_plaek_phibunsongkhram.GetName]が最大の政敵を排除するために仕組んだ見え透いた粛清だと主張しているが、それは明らかな中傷である。"
 siam.3.a: "悲しい結末だ……"
 siam.4.t: "ソンスラデート支持者らの逮捕"
 siam.4.desc: "早朝、政府はタイ王立警察の協力を得て、さらに51人の容疑者と支持者を逮捕した。そのなかにはランシット王子、プラヤー・テープハッサディン、プラヤー・ウドム・ポンペンサワットも含まれている。彼らはプラヤー・ソンスラデートと結託して国家転覆を企てた疑いで告発されているが、とりわけ王族の一員であるランシット王子も裁判にかけられることは特筆に値する。一部の論評家は、この王子があえて標的にされたのは、[THIS.GetName]に残る王族に「従え、さもなくば没落だ」という警告を送るためではないかとみている。"
 siam.4.a: "事態はさらに複雑になってきた。"
 siam.5.t: "18の屍の反乱"
 siam.5.desc: "ピブーンは、反乱に関与した51人を裁くため、特別法廷を設置した。そのうち25人には終身刑、21人には銃殺刑が言い渡された。処刑対象の21人のうち、ランシット王子やプラヤー・テープハッサディンら3人は、これまでの功績を考慮して恩赦を受けることになっている。"
 siam.5.a: "これで一件落着だ。"
 #Songsuradet rebellion alternative
 siam.6.t: "ソンスラデートとの膠着"
 siam.6.desc: "プラヤー・ソンスラデートは、[SIA_plaek_phibunsongkhram.GetName]に対する一度ならず暗殺未遂の黒幕であり、その政権に対するクーデターも計画していたとして告発されている。政府は、ソンスラデートの指揮権を剥奪し、国外へ追放する意向だ。\nしかし、ソンスラデートに忠誠を誓う軍人たちは、これを政治的動機によるものだと非難し、逮捕を阻止した。現在、政府とソンスラデート派軍部は互いに一歩も譲らず、膠着状態に陥っている。"
 siam.6.a: "我々は引き下がらない。"
 siam.6.b: "裏目に出たな。ここは手を引こう。"
 siam.7.t: "ソンスラデートの海軍支援要請"
 siam.7.desc: "政府軍とソンスラデート派軍部との緊迫したにらみ合いが続くなか、政府の調査官たちは、強まりつつあるピブーンの権威主義に対抗する明確な意図のもと、王室海軍とソンスラデートが同盟を結んだという噂を耳にするようになった。\nそれだけではない。王室の一部補佐官からは、ソンスラデートの代理人が高位の王子たちと会談しているとの報告も上がっており、王族までもが反対派に加わるのではないかとの懸念が高まっている。"
 siam.7.a: "我々こそ政府だ。脅しには屈しない！"
 siam.7.b: "手に負えなくなってきた。ここは引き下がろう。"
 #alt-hist actual rebellion
 siam.8.t: "ソンスラデートの反乱"
 siam.8.desc: "十分な政治的・軍事的支持を確保したソンスラデート派軍部は、海軍と連携して[THIS.GetName]の広い地域を事実上掌握した。早朝、バンコク郊外では銃声が響き、国全体が政府とソンスラデートの全面内戦へと傾きつつある。"
 siam.8.a: "政府は生き残らねばならない。"
 #alt-hist actual rebellion
 siam.9.t: "ソンスラデート反乱の終結"
 siam.9.desc: "反乱は崩壊し、ソンスラデートも捕らえられた今、残るのは裁判だけだ。もっとも、この段階ではそれも単なる形式にすぎない。陰謀は陸海軍だけでなく王室にも及んでおり、ランシット王子が公然と反乱軍を支持していたことも明らかになった。反対派に対する徹底的な粛清は、もはや選択肢ではなく必然である。"
 siam.9.a: "今こそ再建のときだ。"
 #Attack Indochina
 siam.10.t: "勝利"
 siam.10.desc: "敵は敗走し、我々の勝利はほぼ確実となった。領土を確実に掌握した今、旧来の帝国主義者どもは震え上がっているに違いない。彼らが敗れるなど、あり得るだろうか？これは我々に与えられた神の加護の証しにほかならない。"
 siam.10.a: "[ROOT.GetName]のために！"
 siam.10.b: "案外順調だ。"
 siam.11.t: "[FROM.GetAdjective]の戦略的突破"
 siam.11.desc: "予想に反し、[FROM.GetAdjective]軍は我々の部隊を出し抜き、係争地域を掌握した。彼らの占領は我々の威信を損ない、この地域に対する領有権主張にも疑念を投げかけている。紛争を続ければ規律と士気がさらに損なわれる恐れがあるが、領土を明け渡せば失敗を公然と認めることになる。"
 siam.11.a: "損害を抑えて撤退するしかない。"
 siam.11.b: "我々は領有権主張を放棄しない！"
 siam.12.t: "[FROM.GetName]の敗北受諾"
 siam.12.desc: "我々の作戦は成功した。敵の抵抗は崩壊し、[FROM.GetName]はさらなる破滅を避けるため、係争地の支配権を正式に放棄した。この勝利によって我が国の地位は高まり、国境の安全も確保された——少なくとも今は。"
 siam.12.a: "我々の力は疑いようがない。"
 siam.13.t: "[FROM.GetName]による和解案全面拒否"
 siam.13.desc: "[FROM.GetName]は、領土譲歩を伴うあらゆる提案を受け入れがたいものとして退けた。彼らの指導部は、我が国が滅びないかぎり、この紛争は終わらないと宣言している。"
 siam.13.a: "ならばそうしよう。"
 siam.14.t: "[FROM.GetNameDefCap]が総力戦に突入"
 siam.14.desc: "[FROM.GetNameDefCap]は、もはや交渉するふりすら捨て去った。その意図は明白だ。我が国を完全に征服し、併合することだ。この戦争はもはや条約では決着しない。完全勝利か全面崩壊か、そのいずれかでのみ決まる。"
 siam.14.a: "妥協もしない。降伏もしない。"
 siam.15.t: "[SIA.GetAdjective]攻勢の停滞"
 siam.15.desc: "[SIA.GetAdjective]軍による迅速な攻勢は確かに我々の不意を突いた。だが、負担の増大によって彼らの進撃が鈍り始めた今、その弱点は明らかだ。電撃戦となるはずだった作戦は、[SIA.GetAdjective]軍にとって消耗の激しい試練へと変わりつつある。我々は寛大さを示し、譲歩と引き換えに彼らに退路を与えることもできる。しかし、慈悲が完全な勝利より我々の利益にかなうかどうかを決めるのは、我々自身だ。"
 siam.15.a: "譲歩案を提示する。"
 siam.15.b: "完全勝利以外は認められない。"
 siam.16.t: "攻勢の行き詰まり"
 siam.16.desc: "我々の攻勢は行き詰まっている。問題なのは、それ自体ではない。敵もそれを知っていることだ。敵は我々に最後通牒を突きつけてきた。いま降伏して損害を最小限に抑えるか、それとも戦争を続けてさらなる流血を招くか。違いは、埋葬する死者の数だけだ。"
 siam.16.a: "和平を結ぼう。"
 siam.16.b: "我々は決して降伏しない！"
 siam.17.t: "[FROM.GetName]の屈服拒否"
 siam.17.desc: "[FROM.GetName]は、我々に一片たりとも領土を割譲するくらいなら、国全体が炎に包まれるほうがましだと明言した。戦争は続く。"
 siam.17.a: "望みどおりにしてやろう。"
 siam.18.t: "[FROM.GetName]による全面降伏要求"
 siam.18.desc: "敵最高司令部から傍受した通信により、我々の最悪の懸念が裏付けられた。交渉による解決はなく、この戦争を穏便に終わらせるための譲歩も存在しない。彼らが要求しているのは我が国の完全降伏にほかならず、それは我々を再び帝国主義者の軍靴の下に置くことを意味する。もしそれが彼らの狙いなら、我々の答えは一つしかない。我々は屈しない。"
 siam.18.a: "[ROOT.GetNameDefCap]は屈しない！"
 siam.19.t: "[SIA.GetName]による領土返還要求"
 siam.19.desc: "[SIA.GetName]は、高まりつつあるナショナリズムと、この地域で我々が弱体化しているとの認識を背景に勢いづき、自国の中核領土とみなす地域の返還を要求してきた。明らかに身の丈に合わない要求だが、世界情勢が破局へと転がり落ちつつある今、彼らの主張する領土が戦ってまで守る価値のあるものとはかぎらない。"
 siam.19.a: "戦ってまで守る価値はない。"
 siam.19.b: "断る！"
 siam.20.t: "[FROM.GetName]の領土返還"
 siam.20.desc: "[FROM.GetName]は我々の領土を返還する決定を下した。これらの地域に対する我々の主権を認めたのか、それとも単に他勢力からの圧力に屈しただけなのかは問題ではない。我々の大義が正しいことに変わりはない。"
 siam.20.a: "素晴らしい日だ！"
 siam.21.t: "[FROM.GetName]の領土返還拒否"
 siam.21.desc: "[FROM.GetName]は我々の要求を拒否した。帝国主義者どもは前世紀に必死にしがみつき、いわゆる「列強」の時代がすでに終わったことを認められずにいる。"
 siam.21.a: "思い知らせてやろう。"
 SIA_sent_bureaucrats_to_us: "我々のもとで官僚を育成"
 SIA_tied_their_currency_to_ours: "自国通貨を我々の通貨に固定した"
 SIA_sent_started_cooperative_with_us: "我々との開発協力を開始した"
 siam.22.t: "[SIA.GetName]官僚の海外派遣"
 siam.22.desc: "我が国の官僚は現代経済に適応できておらず、経済発展を推進するための能力や経験が不足している。幸い、近代的な官僚制度が確立された国は数多く存在している。こうした国に官僚たちを派遣すれば、統治体制を取り入れることなく、経験だけを積ませることができる。"
 siam.22.a: "[ENG.GetName]に派遣せよ"
 siam.22.b: "[JAP.GetName]に派遣せよ"
 siam.23.t: "バーツ安定法"
 siam.23.desc: "[ROOT.GetName]が貿易や金融の安定を模索するなか、バーツを放置しておくわけにはいかない。我が国の役人たちは、通貨の安定には強固な「錨」が必要だと主張している。商人や債権者、外国の取引相手が安心できる強い外国通貨とバーツを紐づける必要があるというのだ。この選択は単なる数字の問題ではない。選択によって、我が国の貿易の方向性、我が国の発展の仕方、そして[SIA.GetAdjective]の経済がどの国の影響を受けるのかが決まることになる。"
 siam.23.a: "スターリング・ポンドを基準通貨とせよ"
 siam.23.b: "円を基準通貨とせよ"
 siam.24.t: "[SIA.GetAdjective]開発協同組合"
 siam.24.desc: "[SIA.GetAdjective]開発協同組合は、国家発展のための新たな手段を国にもたらしたが、それでも野心の実現に必要な資金は国内資本を上回っている。鉄道、工場、電気事業を速やかに実施するには、国外からの資金調達が欠かせない。今、我々の前には2つの道がある。[ENG.GetAdjective]から投資を受ければ、確立された市場、実績ある企業、そして金融界におけるロンドンの圧倒的な信用力を利用できるようになる。[JAP.GetAdjective]から投資を受ければ、影響力の拡大をめざす新興アジア勢力と緊密な産業パートナーシップを築くことができる。いずれを選んでも発展につながる可能性はあるが、どちらにも相応の義務が伴う。"
 siam.24.a: "[ENG.GetName]に投資を求める"
 siam.24.b: "[JAP.GetName]に投資を求める"
 siam.25.t: "プラチャーティポックの死"
 siam.25.desc: "プラチャーティポック国王が逝去した。長きにわたる亡命や激動の時代を経て、その名に古き秩序の記憶を刻み込んできた先王は、今や人の世を去り、歴史のなかの存在となった。人々の中には、彼の死を絶対王政の終焉とともに始まった闘いの時代の終わりととらえる者もいる。しかし、彼が体現した大義は、彼とともに消えるわけではない。玉座は受け継がれ、王朝は存続していくのだ。そして、[ROOT.GetName]に威厳と安定を取り戻す事業は、若きアーナンタ王の名の下に継続されねばならない。"
 siam.25.a: "陛下が天に昇られんことを。"
 siam.27.t: "王の育成"
 siam.27.desc: "アーナンタ王は、将来治めることになる王国を離れ、[SWI.GetName]に滞在している。しかし、離れているからといって、彼に影響を与えられないわけではない。教師を選定し、重点科目を指定し、習慣を教え込むことで、王の思考を、我々の目指す[ROOT.GetNameDef]の将来像に合わせて形作ることができる。将来、彼が兵士として帰国するのか、学者として帰国するのか、あるいは、それ以上の存在として帰国するのかは、今何を学ばせるかに大きく左右される。\n\n王とは本質的に、国家の延長にほかならないのだ。"
 siam.27.a: "学問の道へ導け。"
 siam.27.b: "軍事の指導を行え。"
 siam.27.c: "行政と兵站の道へ導け。"
 siam.27.d: "産業と開発について教育せよ。"
 siam.28.t: "アーナンタ王の戴冠式"
 siam.28.desc: "長きにわたった摂政時代が、定めに従い終わりを迎えようとしている。バンコクにて、王族や僧侶、大臣や政府の高官を前に、アーナンタは自らの権利に則って王位に就き、チャクリー王として受けるべき栄誉を受ける。この儀式は、激動の中にあっても王統は途切れず、争いの中にあっても神聖な秩序は揺るがなかったことを世に示すものである。王国にとって、この戴冠式は単なる祭典ではない。王権が存続しており、国家が亡命や内乱で損なわれていないこと、そして、今、[ROOT.GetNameDef]で新たな治世が始まることを宣言するものである。"
 siam.28.a: "国王陛下万歳！"
 siam.29.t: "正統派戦車の研究"
 siam.29.desc: "正統派戦車は依然として戦場の王者である。したがって、強力な戦車部隊を編成するため、我々は最高の手本から学ばなければならない。"
 siam.29.a: "ドイツから学ぶ"
 siam.29.b: "アメリカから学ぶ"
 siam.29.c: "イギリスから学ぶ"
 siam.31.t: "潜水艦の調達"
 siam.31.desc: "海軍の拡大には潜水艦部隊が必要であり、艦艇をどこから調達するのか決断しなければならない。[ENG.GetNameDef]と[JAP.GetNameDef]の双方から提案を受けているが、この選択は単なる造船所選びにとどまらない意味を持つ。"
 siam.31.a: "[ENG.GetAdjective]の潜水艦は大いに役立つだろう。"
 siam.31.b: "[JAP.GetAdjective]の設計を軸に潜水艦部隊を構築しよう。"
 siam.32.t: "沿岸防衛艦の調達"
 siam.32.desc: "我が国の沿岸海域には十分な性能を備えた防衛艦が必要であり、どこから供給を受けるか決めなければならない。[ENG.GetNameDefCap]と[JAP.GetNameDef]はいずれも提供する用意がある。今回の決定は、我々の艦隊だけでなく外交関係をも形作るだろう。"
 siam.32.a: "沿岸防衛には[ENG.GetAdjective]製の艦船を頼りにする。"
 siam.32.b: "沿岸艦隊には[JAP.GetAdjective]製の艦船を頼りにする。"
 siam.33.t: "バンコク・ドック社の売却"
 siam.33.desc: "バンコク・ドック社の売却が完了し、売却代金は国庫に収められた。政府は、この資金をどこに振り向けるのが最善か決定しなければならない。一般市民の財政的負担を軽減するのか、国家の技術的構想を加速させるのか、それとも国の将来に対する信頼を下支えするのか。"
 siam.33.a: "国民の税負担を軽減する。"
 siam.33.b: "資金を海軍研究に振り向ける。"
 siam.33.c: "この臨時収入で国民を安心させる。"
 siam.34.t: "我が国の沿岸での[FROM.GetAdjective]の要求"
 siam.34.desc: "[FROM.GetAdjective]軍は現在、[ROOT.GetNameDef]に圧力をかけている。彼らの外交官は自信に満ちた語り口で、あたかも問題は解決済みだと言わんばかりだ。彼らは秩序と安定という決まり文句を並べるが、真の要求は我々の服従である。我々が取り得る選択肢は、屈服して縮小した形で国家を存続させるか、彼らの陣営に加盟し、ある程度の行動の自由を保持できることを期待するか、この圧力に公然と反抗して侵略者に我が国の沿岸から去るよう命じるかである。"
 siam.34.a: "彼らの陣営に加盟し、我々の統治を維持しよう。"
 siam.34.b: "我が国の沿岸からの退去を命じよう。"
 siam.35.t: "[JAP.GetNameDefCap]が我々に紙幣の増刷を要求"
 siam.35.desc: "[JAP.GetNameDefCap]は要求を明確にした。彼らの経済的要求に応えるため、我々は通貨供給量を増やさなければならない。負担は物価上昇という形で我が国民にのしかかる一方、[JAP.GetAdjective]の産業は利益を得ることになる。我々に拒否する余地はほとんどない。"
 siam.35.a: "[JAP.GetNameDef]の要求に従う。"
 siam.36.t: "[SIA.GetNameDefCap]が債務の返済を要求"
 siam.36.desc: "[SIA.GetNameDefCap]は、我々が強制した貨幣増刷措置によって生じた費用を返済するよう正式に要求してきた。この措置は我々にとって有益だったが、今やその代償を支払う時が来た。"
 siam.36.a: "債務を認め、返済を開始する。"
 siam.37.t: "[JAP.GetNameDefCap]が我々への債務返済に同意"
 siam.37.desc: "我々の要求を受け、[JAP.GetNameDef]は貨幣増刷措置によって生じた経済的費用の返済を開始することに同意した。この補償は我が国民に課された負担を完全に取り消すものではないが、国庫にはいくらかの余裕をもたらすだろう。"
 siam.37.a: "妥当な条件だ。我が国の経済は回復するだろう。"
 siam.38.t: "[SIA.GetName]が条件提示を要求"
 siam.38.desc: "[SIA.GetAdjective]政府が我々の前に現れ、降伏条件の提示を嘆願してきた。彼らの閣僚は我々の火器がすでに示したこと、すなわちこの闘争において[ROOT.GetNameDef]が主導権を掌握していることを認めている。我々は彼らの降伏を受け入れて服従させることも、彼らを我々の陣営に組み込み、彼らの政府を我々のより広範な目的に奉仕させることも、あらゆる妥協を拒否し、シャムの完全な制圧まで作戦を継続することもできる。"
 siam.38.a: "降伏を受け入れる。"
 siam.38.b: "断る。武力でこれを終わらせる。"
 siam.39.t: "[FROM.GetAdjective]政府が我々の降伏を受諾"
 siam.39.desc: "[FROM.GetLeader]は我々の降伏を受け入れることを選択した。[ROOT.GetNameDef]は差し当たってさらなる破壊を免れたが、屈辱は免れていない。軍は待機を命じられ、政府はより強大な勢力の容認によってのみ存続する。我々は国家を守ったが、その代償として誇りと行動の自由を失った。"
 siam.39.a: "耐えるしかない。"
 siam.40.t: "[FROM.GetAdjective]政府が我々の申し出を拒否"
 siam.40.desc: "[FROM.GetLeader]はバンコクからのあらゆる申し入れを拒否した。いかなる提案も十分とは見なされず、いかなる妥協も受け入れられない。敵はこの問題を完全な征服でのみ解決しようとしている。[ROOT.GetNameDef]に残された道は抵抗しかない。彼らが合意によって我々の海岸から立ち去らないのであれば、武力によって追い払わなければならない。"
 siam.40.a: "もはや戦うしかない。"
 siam.41.t: "[FROM.GetNameDefCap]が我々の手法を学ぶために官僚を派遣"
 siam.41.desc: "[FROM.GetAdjective]の官僚の代表団が、我々の行政および研究の実務を視察・研究するために到着した。[FROM.GetNameDefCap]は外国の専門知識を取り込むことで官僚組織の近代化を図ろうとしているらしく、その模範として[ROOT.GetNameDef]を選択したのだ。この訪問は、我々の手法を暗に認めるものであり、他国政府との友好関係を築く好機でもある。"
 siam.41.a: "代表団を歓迎する。"
 siam.42.t: "[FROM.GetNameDefCap]が自国通貨を我が国の通貨に固定"
 siam.42.desc: "[FROM.GetNameDefCap]は、自国通貨を我が国通貨に固定することを正式に決定した。この決定により、[FROM.GetNameDef]は我々の経済圏へと一段と引き寄せられ、我が国の金融機関の安定性に一定の信頼を寄せていることが示された。両国間の貿易はより予測しやすくなり、[FROM.GetAdjective]の商人たちも我々と取引しやすくなるだろう。"
 siam.42.a: "両国の貿易関係にとって歓迎すべき進展だ。"
 siam.43.t: "[FROM.GetNameDefCap]が開発投資を要請"
 siam.43.desc: "[FROM.GetNameDefCap]は、自国の開発を支援してもらうべく、我が国の技術者や専門家を招請してきた。この協力は、我々の産業に地域への足掛かりを与え、両国政府の経済的な結び付きを強める。控えめな提案ではあるが、長期的には大きな見返りをもたらすかもしれない。"
 siam.43.a: "喜んで支援しよう。"
 siam.44.t: "[FROM.GetNameDefCap]が潜水艦を発注"
 siam.44.desc: "[FROM.GetNameDefCap]は、我々の設計に基づいて建造される潜水艦を発注した。この取引は我が国の海軍産業に対する意義ある信頼の証しであり、東南アジアの海域に[FROM.GetAdjective]の影響力を広げることになる。"
 siam.44.a: "我が造船所にとってありがたい注文だ。"
 SIA_purchased_submarines_from_us: "我々から潜水艦を購入した"
 siam.45.t: "[FROM.GetNameDefCap]が同盟統合を提案"
 siam.45.desc: "[FROM.GetLeader]からの提案を携え、[FROM.GetName]の代表団が到着した。彼らは、我々の別個の同盟が今や同じ大きな目標を掲げているにもかかわらず、人員、装備、外交的影響力を競合する指揮系統の間で分散させていると主張している。\n\n我々の勢力を彼らと統合すれば、より広い戦線にわたって戦略を調整できる強力な陣営が生まれるだろう。この合意は共通の大義を強めるが、同盟の今後の方向性に対する[FROM.GetAdjective]の影響力を受け入れることも意味する。"
 siam.45.a: "統一戦線は不可欠だ。"
 siam.45.b: "我々の同盟は我々自身のものだ。"
 siam.46.t: "[FROM.GetNameDefCap]が統合を承諾"
 siam.46.desc: "[FROM.GetLeader]は、双方の同盟を一つの連合へ統合するという我々の提案を受け入れた。かつて別々だった指揮系統と外交ルートは今や一つの枠組みにまとめられつつあり、両国政府は戦争計画、補給体制、外交政策をはるかに明確に調整できるようになる。\n\nこの取り決めに問題がないわけではないが、結束の必要性が勝ったのだ。"
 siam.46.a: "共にあれば、我々はより強い。"
 siam.47.t: "[FROM.GetNameDefCap]が合併を拒否"
 siam.47.desc: "[FROM.GetLeader]は、同盟統合に関する我々の提案を拒否した。彼らの政府は、利害が一致する分野での協力は続けられるが、[ROOT.Capital.GetCapitalVictoryPointName]を中心とするより広範な連合の中に自らの同盟を組み込むことはないと主張している。\n\n当面、我々の陣営間の分断は残る。彼らの全面的な関与をあてにすることなく、我々は自らの目的を追求しなければならない。"
 siam.47.a: "ならば、我々だけで進むとしよう。"
 siam.48.t: "[SIA.GetName]が[JAP.GetAdjective]の支援を要請"
 siam.48.desc: "[SIA.GetNameDefCap]は自国に侵攻中の勢力に対抗するため、正式に軍事支援を要請した。その見返りとして、[SIA.GetAdjective]政府は[JAP.GetAdjective]企業に対し、戦略資源、インフラ、商業権への優先的なアクセスを認める用意がある。\n\n帝国にとって、[SIA.GetName]への支援は東南アジアにおける影響力の拡大と貴重な物資の確保につながる一方、この地域の紛争へより深く関与するはめになる可能性がある。"
 siam.48.a: "提案を受け入れよう。"
 siam.48.b: "[JAP.GetName]は人員も物資も、そちらに割けるだけの余裕がない。"
 siam.49.t: "[JAP.GetName]が我々の要請を承諾"
 siam.49.desc: "[JAP.GetNameDefCap]は[ROOT.GetNameDef]の闘争を支援することに同意した。[JAP.GetAdjective]の顧問団、および装備と物資が間もなく到着する。一方、協定に従い、[JAP.GetAdjective]の企業には経済的特権が与えられた。\n\n閣僚たちは国家の存続を喜ぶ一方で、その多くは、この支援と引き換えにどれだけ独立性を手放してしまったのだろうかと案じている。"
 siam.49.a: "我々は同盟国を確保した。"
 SIA_japan_aid_request.4.t: "[JAP.GetName]が我々の要請を拒否"
 SIA_japan_aid_request.4.desc: "[JAP.GetNameDef]政府は我々の軍事支援要請を拒否した。東京の連中が言うには、帝国には現時点で我々の闘争に投入する兵士も物資もないとのことである。\n\n外国からの支援を得られなかったため、[ROOT.GetNameDef]は自らの力で侵攻を乗り切るらなければならない。"
 SIA_japan_aid_request.4.a: "ならば、我々だけで立ち向かおう。"
 siam_adc.1.t: "[FROM.GetNameDefCap]が[?var:SIA_adc_demand_country_to_be_released.GetNameDef]の解放を要求"
 siam_adc.1.desc: "[FROM.GetNameDef]から正式な書簡が届き、[FROM.GetLeader]はアジア諸国を占領し続ける我々に対し、各国の自決権に対する耐え難い侮辱であると非難している。当文書では、アジアは外国が好き勝手に分割したり統治したりできる戦利品ではないと述べられており、直ちに軍を撤退させ、[?var:SIA_adc_demand_country_to_be_released.GetNameDef]に独立した政府を復活させるよう要求している。\n\nこの要求には誤解の余地がなく、[FROM.GetNameDefCap]はこれに従うことを期待しており、我々がこれを拒否すれば、かの国家に対する意図的な侮辱として記憶されることになる。"
 siam_adc.1.a: "彼らを解放しよう。"
 siam_adc.1.b: "彼らを引き続き占領下に置く。"
 siam_adc.2.t: "[FROM.GetNameDefCap]が我々の独立回復を提案"
 siam_adc.2.desc: "[ROOT.GetNameDef]の将来に関する[SIA.GetNameDef]の要求を[FROM.GetAdjective]は承諾した。これを受け[FROM.GetLeader]は今、我々に最終的な問いを投げかけている。我々が再び独立を選択すれば、占領軍は撤退して[ROOT.GetAdjective]政府の主権を認める準備ができている。\n\n独立は尊厳と行動の自由をもたらすが、同時に我々は[FROM.GetNameDef]の保証なしに国家を再建しなければならなくなる。彼らの保護下に留まることはより慎重な道だが、この不確実な時代においてさらなる混乱を避けられるかもしれない。"
 siam_adc.2.a: "我々は独立国家として存立する。"
 siam_adc.2.b: "我々は[FROM.GetAdjective]の保護下に留まる。"
 siam_adc.3.t: "[?var:SIA_tag_that_was_released_due_to_sia_pressure.GetName]が独立を承認"
 siam_adc.3.desc: "[?var:SIA_tag_that_was_released_due_to_sia_pressure.GetNameDef]政府は独立を選択した。占領統治は解体されることになり、[var:SIA_tag_that_was_released_due_to_sia_pressure.GetNameDef]は世界における主権国家の一員としての地位を取り戻す準備を整えている。"
 siam_adc.3.a: "彼らの未来には何が待っているのだろうか？"
 siam_adc.4.t: "[FROM.GetNameDefCap]が独立を辞退"
 siam_adc.4.desc: "[FROM.GetNameDef]政府は自由を手にする好機にもかかわらず、即時の独立は辞退した。閣僚たちは、この国はまだ完全な独立国家としての重責を担う準備ができておらず、当面は現状を維持したいと述べている。"
 siam_adc.4.a: "それなら、現体制は継続だ。"
 siam_adc.5.t: "[FROM.GetNameDefCap]が我々の要求を拒否"
 siam_adc.5.desc: "[FROM.GetName]は我々の要求が馬鹿げていると一笑に付した。我々の貧弱な軍事力では、現状に異議を唱える資格がないと指摘している。"
 siam_adc.5.a: "それなら、目にもの見せてやろう。"
 siam_dem_event_count: "軍部は待ち時間が長くなるほど評判を下げる中傷工作を計画している "
 siam_dem.2.t: "軍の反対"
 siam_dem.2.desc: "閣僚および上級将校による秘密会談において、軍部の代表は「黄色い文書」の提案を厳しく批判した。彼はその起草者たちが国家の運営、再分配、社会的義務についてあまりにも奔放に語る一方、規律、資産、将校団や農村への負担についてほとんど考慮していないと主張している。彼の見解によれば、世界が月を追うごとに危険度を増すなか、机上の理論で[ROOT.GetNameDef]を改革するのは不可能である。"
 siam_dem.2.a: "軍は自らの主張を表明した"
 siam_dem.3.t: "公然の非難"
 siam_dem.3.desc: "論争は会議室の外に出た。軍部の代弁者として広く認知されている新聞は「黄色い文書」を全面的に非難する記事を掲載し、これを愛国的な言葉で飾り立てられた異質な計画だと断じている。編集者たちはこの提案が国家の統一よりも階級間の不満を優先させたもので、既存の制度への信頼を弱め、労働者や農民たちに危険な期待を抱かせるものだと警告している。午後までにはこの記事が兵舎、官庁、茶店で等しく繰り返し語られるようになり、内部の議論であったものが今や国民的な論争に発展している。"
 siam_dem.3.a: "批判が拡散する"
 siam_dem.4.t: "ピブーンが文書を非難"
 siam_dem.4.desc: "ピブーンはこの論争に公然と、明白な強い論調で参加した。彼は支持者や将校団を前にして、「黄色い文書」はその擁護者がいかなる言葉を用いようと共産主義的であると非難している。国家を資産より上位に置き、大規模な社会改革を約束し、下層階級を扇動するようなあらゆる計画は、名前を変えて[ROOT.GetNameDef]に赤い毒を持ち込むようなものだと彼は断言している。"
 siam_dem.4.a: "彼の主張は明確だ"
 siam_dem.5.t: "政府樹立が必要"
 siam_dem.5.desc: "旧政権は崩壊し、セリタイが勝利を収めた。しかし、勝利と統治は別物であり、ピブーン打倒のため結束した連合は、その後の体制についてまったく合意できていない。権力の回廊では3人の名がささやかれている。レジスタンスの良心たるプリディ・パノムヨン、誰の反感も買わない穏健な人物、クアン・アパイウォン、そして将校たちが見返りを期待するピン・チュンハワン将軍である。今誰を擁立するかが、来たる平和の形を決めることになる。"
 siam_dem.5.a: "プリディ・パノムヨンに率いさせよう。レジスタンスにはその資格がある。"
 siam_dem.5.b: "クアン・アパイウォンなら、あらゆる派閥が受け入れられる人物だ。"
 siam_dem.5.c: "ピン・チュンハワン将軍。軍にも居場所を与えなければならない。"
 ###################
 #### AUSTRALIA ####
 ###################
 AST_election_events.1.t.a: "UAPが勝利！"
 AST_election_events.1.t.b: "労働党が勝利！"
 AST_election_events.1.desc.a: "開票の結果、統一オーストラリア党（UAP）が選挙に勝利した。\n\nUAPは短期間の内閣組成手続きを経た後、3年間をかけて、有権者の信任に正当に応えられることを証明する。"
 AST_election_events.1.desc.b: "開票の結果、オーストラリア労働党が選挙に勝利した。\n\n労働党は短期間の内閣組成手続きを経た後、3年間をかけて、有権者の信任に正当に応えられることを証明する。"
 AST_election_events.1.a: "国民が声を上げた"
 AST_election_events.2.t: "連邦選挙までの折り返し"
 AST_election_events.2.desc: "1931年以来、$AST_democratic_party_long$は[AST.GetName]を率い、大恐慌からの脱却と反民主主義的感情からの距離を取らせることに尽力してきた。安定した指導、保守的な姿勢、そしてイギリスへの忠誠により、UAPは支持を固め、続投の可能性を高めている。しかし、この問題にはなお別の政党にも発言権がある。\n\n1931年に不信任動議で政権を追われた痛手から立ち直りつつある$AST_labor_party_long$は、再び勢いを取り戻し始めている。共産主義者の声が封じられた今、労働者階級は別の導き手を求めている。すべての市民を代表するという使命のもと、ALPは帝国主義とオーストラリアの帝国への忠誠について異なる見解を打ち出した。国内の必要が第一であり、外国の利益をもはや優先すべきではない。\n\n次の連邦選挙まで残り1年半。UAPが再度の勝利を確かなものにしたいなら、指導部は国民の支持を保つため改革を加速させなければならない。そうでなければ、ALPの選挙運動によって同党の勢いが再び回復するかもしれない。"
 AST_election_events.2.a: "UAPは最後の改革を実施する。"
 AST_election_events.2.b: "オーストラリア全土での選挙遊説により、ALPの支持を高める。"
 AST_election_events.3.t: "$AST_election_season_cat$"
 AST_election_events.3.desc: "$AST_election_season_cat_desc$"
 AST_election_events.3.a: "始まった。"
 AST_diplomatic_events.1.t: "オーストラリア不可侵条約"
 AST_diplomatic_events.1.desc: "オーストラリア政府が、最近の外交活動の一環として、特定のアジア諸国との不可侵条約の締結を模索している。我が国もその候補である。この戦争回避の動きによって、オーストラリア当局が世間知らずとみなされるか、高潔な存在とみなされるかは、我々がどう返答するかによるところもある。\n\n我が国は、[AST.GetName]と不可侵条約を締結すべきだろうか？"
 AST_diplomatic_events.1.a: "問答無用で「NO」だ。"
 AST_diplomatic_events.1.b: "もちろん締結しよう。"
 AST_diplomatic_events.2.t: "太平洋協定を拒否"
 AST_diplomatic_events.2.desc: "[FROM.GetNameDef]に派遣した代表団が、我々の不可侵条約の提案に対する相手国の返答を電報で知らせてきた。極めて大胆な提案であることは承知していたため、[FROM.GetLeader]が拒否したことに驚きはない。"
 AST_diplomatic_events.2.a: "少なくとも、立派な志ではあった。"
 AST_diplomatic_events.3.t: "太平洋協定万歳"
 AST_diplomatic_events.3.desc: "[FROM.GetNameDef]に派遣した代表団が、我々の不可侵条約の提案に対する相手国の返答を電報で知らせてきた。喜ばしいことに、[FROM.GetLeader]は我々の提案を評価し、これに正式に署名することに同意した。"
 AST_diplomatic_events.3.a: "素晴らしい！"
 AST_diplomatic_events.4.t: "オーストラリアがシンガポールを要求"
 AST_diplomatic_events.4.desc: "[AST.GetNameDefCap]はシンガポール戦略の信頼性に長らく疑問を呈してきた。オーストラリア当局によれば、太平洋戦争が勃発した場合、我が国が本当に彼らを支援できるのか確信が持てないという。太平洋における海軍の責務を[AST.GetName]に移譲すれば、イギリスの負担は軽減されるが、その負担はそのままオーストラリアが負うことになる。\n\nシンガポールをオーストラリアに委ねてしまえば、同国の支配力が強まり、太平洋に存在する我が国の臣民や領土もより安全な立場に置かれる——このような話を、はたして信じてよいものだろうか？"
 AST_diplomatic_events.4.a: "信じてもよいだろう。"
 AST_diplomatic_events.4.b: "シンガポールは我々のものだ。"
 AST_diplomatic_events.5.t: "イギリスが我々の要求に同意"
 AST_diplomatic_events.5.desc: "イギリスが、シンガポールをオーストラリアの管轄下へ移すことに同意した。これでようやく、時代遅れのシンガポール戦略に終止符が打たれ、我々が自ら自国防衛の舵を取ることができる。"
 AST_diplomatic_events.5.a: "戦略が刷新された！"
 AST_diplomatic_events.5.a.tt: "§Yシンガポール§!:\n  §Yオーストラリア§!が支配。\n  §Yオーストラリア§!が領有。\n§Yクリスマス島§!:\n  §Yオーストラリア§!が支配。\n  §Yオーストラリア§!が領有。\n§Yココス諸島§!:\n  §Yオーストラリア§!が支配。\n  §Yオーストラリア§!が領有。"
 AST_diplomatic_events.6.t: "イギリスが我々の要求を拒否"
 AST_diplomatic_events.6.desc: "イギリスがシンガポールをオーストラリアの管轄下に移すことを拒んだ。今後も現状が維持される。"
 AST_diplomatic_events.6.a: "シンガポール戦略を堅持しなければならない。"
 AST_diplomatic_events.7.t: "[AST.GetName]が支援を要請"
 AST_diplomatic_events.7.desc: "[AST.GetNameDefCap]が、戦争努力のため同盟国から装備の提供を受けようとしており、我が国にその輸送管理の支援を要請してきた。我が国は、[AST.GetName]に輸送船団を回す余力があるだろうか？"
 AST_diplomatic_events.7.a: "ある。"
 AST_diplomatic_events.7.b: "それはできない。"
 AST_diplomatic_events.8.t: "[USA.GetName]が我々の要請に同意"
 AST_diplomatic_events.8.desc: "[USA.GetNameDefCap]が、輸送船団の提供を通じ、[AST.GetName]の補給活動を支援することに同意した。"
 AST_diplomatic_events.8.a: "非常に助かる！"
 AST_diplomatic_events.9.t: "[USA.GetName]が我々の要請を拒否"
 AST_diplomatic_events.9.desc: "[USA.GetNameDefCap]には、[AST.GetName]の補給活動のために提供できる輸送船団がない。"
 AST_diplomatic_events.9.a: "我々だけで輸送を行うしかない。"
 AST_diplomatic_events.10.t: "戦時同盟"
 AST_diplomatic_events.10.desc: "[AST.GetNameDefCap]は[USA.GetNameDef]との同盟関係を高く評価しており、国際的な戦時連合として正式に確立することを求めている。力を合わせることで、両国は、現在や将来の紛争において相互支援を行うことができるだろう。"
 AST_diplomatic_events.10.a: "同意しなければならない。"
 AST_diplomatic_events.10.b: "同盟関係がないほうが、強く立ち回れる。"
 AST_diplomatic_events.11.t: "戦時同盟"
 AST_diplomatic_events.11.desc: "[USA.GetNameDefCap]が同盟の締結に同意した。[AST.GetFactionName]の加盟国として、[AST.GetName]と[USA.GetName]は現在および将来の紛争で互いを支援しあうことになる。"
 AST_diplomatic_events.11.a: "我々は敵国から恐れられる存在になるだろう。"
 AST_diplomatic_events.12.t: "戦時同盟を拒否"
 AST_diplomatic_events.12.desc: "[USA.GetNameDefCap]が同盟締結の提案を拒否した。[AST.GetNameDefCap]と[USA.GetName]は今後も、自国だけで戦争努力を遂行することになる。"
 AST_diplomatic_events.12.a: "独力でやっていくしかない。"
 AST_diplomatic_events.13.t: "第6条"
 AST_diplomatic_events.13.desc: "オーストラリアの植民地を連邦へ統合する過程で、ニュージーランドは最終的に参加しない道を選んだ。しかし、それ以降もオーストラリア憲法は我々をオーストラリア連邦の潜在的な州の一つとして定めており、その加入も認めている。\n\n現在[AST.GetName]は、世界情勢を理由に団結の必要性を訴え、[NZL.GetName]がオーストラリアの管轄下に入ることを求めている。この件について、国民投票を実施すべきだろうか？"
 AST_diplomatic_events.13.a: "実施しよう。"
 AST_diplomatic_events.13.a.tt: "国民投票が実施され、結果によっては§Y[NZL.GetName]§!が§R併合§!される"
 AST_diplomatic_events.13.b: "絶対にダメだ！"
 AST_diplomatic_events.14.t: "[NZL.GetNameDefCap]、オーストラリアの州に"
 AST_diplomatic_events.14.desc: "先ごろ実施された国民投票を受け、[NZL.GetName]がオーストラリア憲法第6条の発動を決定した。ニュージーランド国民は、オーストラリアの統治下にあるほうが領土の安全が確保されると判断し、[AST.GetNameDef]への加入に同意した。"
 AST_diplomatic_events.14.a: "オーストラリアが拡大した。"
 AST_diplomatic_events.15.t: "ニュージーランド国民が反発"
 AST_diplomatic_events.15.desc: "先ごろ実施された国民投票を受け、[NZL.GetName]がオーストラリア憲法第6条を発動しないことを決定した。[NZL.GetNameDefCap]は今後も独立国家として存続する。"
 AST_diplomatic_events.15.a: "オーストラリアは現状に留まる。"
 AST_diplomatic_events.16.t: "[NZL.GetNameDefCap]当局が抵抗"
 AST_diplomatic_events.16.desc: "オーストラリアからの圧力にもかかわらず、[NZL.GetName]がオーストラリア憲法第6条発動の可否を問う国民投票を実施しないことを決定した。[NZL.GetNameDefCap]は今後も独立国家として存続する。"
 AST_diplomatic_events.16.a: "オーストラリアは現状に留まる。"
 AST_diplomatic_events.17.t: "オーストラリアとの協力関係"
 AST_diplomatic_events.17.desc: "敵は北から迫っており、我々の地に達するのは時間の問題だ——少なくとも、オーストラリア当局はそう主張している。[AST.GetNameDefCap]は、我々両国が団結して、ひとつの防衛線を築くことを提案している。そして、そのために[INS.GetName]をオーストラリアの支配下に置きたいとし、それが叶わないなら、せめて軍事通行権を認めるよう求めている。"
 AST_diplomatic_events.17.a: "オーストラリアの支配下に入ることに同意する。"
 AST_diplomatic_events.17.a.tt: "§Y[INS.GetNameDefCap]§!が§Y[AST.GetNameDefCap]§!の§Y傀儡§!となる。"
 AST_diplomatic_events.17.b: "軍事通行権を付与する。"
 AST_diplomatic_events.17.b.tt: "§Y[INS.GetNameDefCap]§!が§Y[AST.GetNameDefCap]§!に§Y軍事通行権§!を付与する。"
 AST_diplomatic_events.17.c: "どちらも拒否する。"
 AST_diplomatic_events.18.t: "[INS.GetNameDefCap]がオーストラリアの要請を承諾"
 AST_diplomatic_events.18.desc: "[INS.GetName]が我が国の要請を受け入れた。この協力関係は、両国の防衛能力に大きな影響をもたらすだろう。"
 AST_diplomatic_events.18.a: "素晴らしい！"
 AST_diplomatic_events.19.t: "[INS.GetNameDefCap]が拒否"
 AST_diplomatic_events.19.desc: "[INS.GetName]が我々の要請を拒否した。両国はそれぞれ独自に防衛を行わなければならない。"
 AST_diplomatic_events.19.a: "[AST.GetNameDefCap]は彼らなしに、紛争を切り抜けねばならない。"
 AST_diplomatic_events.20.t: "イギリス戦時内閣への招集"
 AST_diplomatic_events.20.desc: "[GET_AST_BWC_COUNT][ENG.GetNameDefCap]がオーストラリア首相をイギリス戦時内閣に招集した。世界情勢が切迫するなか、イギリスは同盟国との共通戦略と軍事協力を模索している。\n\nしかし、オーストラリアにも独自の懸念事項がある。イギリスの期待に応えるために、首相の時間を割く余裕はあるだろうか？"
 AST_diplomatic_events.20.a: "[AST.GetLeader]はイギリスへ赴くべきだ。"
 AST_diplomatic_events.20.b: "彼は国内で必要とされている。"
 AST_bwc_count_2: "[ENG.GetLeader]は[AST.GetLeader]に2回目の出席を要請し、両国の緊密な協力こそが共通の闘争の行方を決定づけると主張している。\n\n"
 AST_bwc_count_3: "[AST.GetLeader]は英連邦の協力体制を維持するため、再び海を渡るよう求められている。しかし、我々の利益が共通の取り組みにあるのか、自国の問題への対応にあるのかを明確にしておけば、これ以上同様の要請が重なることはないだろう。\n\n"
 AST_bwc_accept_effect_tt: "§Y招集に3回応じた場合の効果: §!"
 AST_bwc_accept_tt: "招集に§Y[?var:AST_bwc_accept]§!/§Y3§!回応じる"
 AST_diplomatic_events.22.t: "イギリス戦時内閣に貢献"
 AST_diplomatic_events.22.desc: "この1年、オーストラリアの首相は定期的にイギリス戦時内閣に参加してきた。時には[AST.GetNameDef]が犠牲を払わねばならないこともあったが、イギリスとの軍事協力を通じ、我が国の軍事力は高まった。"
 AST_diplomatic_events.22.a: "犠牲を払った甲斐があった。"
 AST_diplomatic_events.23.t: "[ENG.GetLeader]、オーストラリアの戦時内閣参加を断念"
 AST_diplomatic_events.23.desc: "[ENG.GetNameDefCap]は、オーストラリア首相にイギリス戦時内閣への参加を何度も求めたが、繰り返し拒否された。[ENG.GetLeader]は、これ以上要請しても意味がないと判断した。"
 AST_diplomatic_events.23.a: "致し方ないことだ。"
 AST_diplomatic_events.24.t: "指導者の交代"
 AST_diplomatic_events.24.desc: "オーストラリア首相は、イギリス連邦の戦争遂行に大きな影響を及ぼしてきた。ロンドンを定期的に訪れる中で、ロバート・メンジーズはイギリス閣僚の信頼を勝ち取った一方、閣僚たちの自国首相への信頼は薄れていった。今や閣僚たちは[ENG.GetNameDef]の指導者に辞任を迫り、メンジーズにその後任を務めるよう求めている。\n\n[AST.GetName]が自国の首相を失うことになっても、イギリスの手綱を握るオーストラリア人同胞に守られた宗主国から、揺るぎない忠誠を得ることになる。南の大地はさらなる権限を求めており、ロバート・メンジーズは真っ先にその名を掲げた人物である。"
 AST_diplomatic_events.24.a: "風向きが変わりつつある。"
 AST_diplomatic_events.25.t: "キャンベラの統治下で"
 AST_diplomatic_events.25.desc: "太平洋諸国間の緊張の高まりは憂慮すべき事態である。イギリスは自国の戦いで手一杯であり、もはや臣民の救援に駆けつける余力などない——[AST.GetName]はそう主張している。\n\n彼らは、太平洋諸国やインド洋諸国をキャンベラから直接管理できるよう、イギリス連邦を再編することを求めている。我々は同意すべきだろうか？"
 AST_diplomatic_events.25.a: "同意すべきだ。中央集権により太平洋地域を強化できる。"
 AST_diplomatic_events.25.b: "とんでもない！"
 AST_diplomatic_events.26.t: "太平洋連邦"
 AST_diplomatic_events.26.desc: "[ENG.GetNameDefCap]が同意し、中央集権下で太平洋地域を強化することになった。イギリスの太平洋領が、我が国の権限下に置かれた。"
 AST_diplomatic_events.26.a: "太平洋諸国が団結する。"
 AST_diplomatic_events.27.t: "イギリスが我々の要請を拒否"
 AST_diplomatic_events.27.desc: "[ENG.GetNameDefCap]が要請を拒否した。中央集権下で太平洋地域を強化することはできない。太平洋領は引き続きイギリスの権限下に置かれる。"
 AST_diplomatic_events.27.a: "それでもオーストラリアは生き残る。"
 AST_diplomatic_events.28.t: "[ENG.GetLeader]が交渉を打ち切り"
 AST_diplomatic_events.28.desc: "我が国の首相と[ENG.GetLeader]の電信による応酬からは、オーストラリアへの増援をほとんど引き出せなかった。代わりに、自国の利益ばかり主張する[AST.GetLeader]に対し、イギリスの不満が増大する結果となった。"
 AST_diplomatic_events.28.a: "オーストラリアは自力で自国を防衛しなければならない。"
 AST_diplomatic_events.29.t: "イギリスが我が国を支援"
 AST_diplomatic_events.29.desc: "オーストラリアは[ENG.GetNameDef]に対し、[JAP.GetName]との紛争を引き起こすよう圧力をかけた。その結果、イギリスは我が国の防衛体制構築を支援することに同意した。"
 AST_diplomatic_events.29.a: "支援は歓迎するが、日本との戦争を回避することはできないだろう。"
 AST_diplomatic_events.30.t: "オーストラリアが資源の利権を要求"
 AST_diplomatic_events.30.desc: "拡張主義の侵略者がインドシナに目を向けるのは、領土そのものだけでなく、そこに眠る資源のためでもある。この富が敵の手に渡れば戦争を長引かせるだけだが、オーストラリアの手中にあれば戦争終結の助けとなる——少なくとも、オーストラリア政府はそう主張している。\n\n我々は、自国領内の資源の利権を同国に与えることに同意すべきだろうか？"
 AST_diplomatic_events.30.a: "同意すべきだ。"
 AST_diplomatic_events.30.b: "資源は[AST.GetName]にも渡すつもりはない。"
 AST_diplomatic_events.31.t: "[FROM.GetNameDefCap]が[AST.GetName]に資源の利権を付与"
 AST_diplomatic_events.31.desc: "拡張主義の侵略者がインドシナに目を向けるのは、領土そのものだけでなく、そこに眠る資源のためでもある。この富が敵の手に渡れば戦争を長引かせるだけだが、オーストラリアの手中にあれば戦争終結の助けとなる——少なくとも、オーストラリア政府はそう主張している。\n\n[ROOT.OVERLORD.GetNameDefCap]は要求を受け入れた。"
 AST_diplomatic_events.31.a: "我々にはどうすることもできない。"
 AST_diplomatic_events.32.t: "[FROM.GetNameDefCap]が資源の利権を付与"
 AST_diplomatic_events.32.desc: "[FROM.GetNameDefCap]が、インドシナの資源はオーストラリアの手中にあるほうが有効活用できることを認め、我が国に資源の利権を付与した。"
 AST_diplomatic_events.32.a: "大いに役立つだろう。"
 AST_diplomatic_events.33.t: "[FROM.GetNameDefCap]が資源の利権の付与を拒否"
 AST_diplomatic_events.33.desc: "[FROM.GetNameDefCap]が、インドシナの資源はオーストラリアの手中にあるほうが有効活用できることに同意せず、我が国に資源の利権を付与することを拒否した。"
 AST_diplomatic_events.33.a: "資源が敵の手に渡らなければいいのだが。"
 AST_diplomatic_events.34.t: "[AST.GetNameDefCap]が太平洋領土の分割を要請"
 AST_diplomatic_events.34.desc: "[AST.GetNameDefCap]が協定の締結を提案している。両国間で紛争が勃発する前に、問題を解決するための協定だ。太平洋領土を両国間で分割すれば、お互いからの干渉を恐れることなく、今後の領土拡大を計画できるようになるというのだ。"
 AST_diplomatic_events.34.a: "合理的な提案だ。"
 AST_diplomatic_events.34.b: "[JAP.GetNameDefCap]は自由に領土を拡大する。"
 AST_diplomatic_events.35.t: "太平洋を分割"
 AST_diplomatic_events.35.desc: "[AST.GetNameDefCap]と[JAP.GetNameDefCap]は、それぞれが太平洋において拡張できる領土を定め、これに同意した。この協定により、両国間で将来起こりうる紛争を回避できることを願う。"
 AST_diplomatic_events.35.a: "問題が解決した！"
 AST_diplomatic_events.36.t: "太平洋は自ずと分割される"
 AST_diplomatic_events.36.desc: "[JAP.GetNameDefCap]は二国間での太平洋領土の分割に同意するつもりはない。日本政府は、独自の判断により拡大を進めていく。"
 AST_diplomatic_events.36.a: "オーストラリアも、同じく独自に拡大するだろう。"
 AST_diplomatic_events.37.t: "支配権の移譲"
 AST_diplomatic_events.37.desc: "どういうわけか、[AST.GetName]が我々の領土の支配権を[JAP.GetNameDef]に移譲することを決めた。裏で何か不穏な動きが起こっている。その真相が世界に知れわたるのは、時間の問題だ。"
 AST_diplomatic_events.37.a: "我々には発言権がないようだ。"
 AST_diplomatic_events.38.t: "ナウル協定"
 AST_diplomatic_events.38.desc: "第一次世界大戦の結果、太平洋のドイツ領土の一部はオーストラリアの支配下に置かれたが、そのうちの1つであるナウル島を取り戻す道が開かれるかもしれない。\n\n[AST.GetFascistParty]は我々の利益と一致する価値観を持っており、その1つが、[AST.GetName]を[ENG.GetNameDef]から完全に分離することである。この運動は現時点では限定的な影響力しか持っていないため、その代表者たちは勢力拡大を加速するために我々の支援を求めている。そして、彼らが独立を求める際に我々が独立保障をすることを条件として、彼らが完全に権力を掌握した際にナウル島の統治権を返還すると主張している。"
 AST_diplomatic_events.38.a: "我々の領土を取り戻すのだ！"
 AST_diplomatic_events.38.b: "空約束を結ぶことはできない。"
 AST_diplomatic_events.39.t: "[GER.GetNameDefCap]がナウル協定に同意"
 AST_diplomatic_events.39.desc: "[GER.GetNameDefCap]と[AST.GetFascistParty]が、共通の目標である[AST.GetName]の独立達成について合意した。[AST.GetFascistParty]の影響力は現時点では限定的であるため、[GER.GetNameDef]はその勢力拡大を加速するための資金支援を実施する。今後、我々の影響力が十分な水準に達した時に、この合意が完全に履行される予定だ。"
 AST_diplomatic_events.39.a: "素晴らしい！"
 AST_diplomatic_events.40.t: "ナウル協定の崩壊"
 AST_diplomatic_events.40.desc: "[GER.GetNameDef]は実現の見込みがまだない約束に拘束されたくないとして、我々の権力獲得への支援を拒否した。ナウル協定は発効すらせず終了し、[AST.GetFascistParty]の野望はすべて我々の肩に載ったままである。"
 AST_diplomatic_events.40.a: "[AST.GetFascistParty]はドイツの支援なしに拡張を目指す。"
 AST_diplomatic_events.41.t: "ナウル、ドイツへと返還"
 AST_diplomatic_events.41.desc: "今や完全に権力を握った[AST.GetFascistParty]が、約束を守り、その義務を果たした。ナウルは[GER.GetNameDef]に返還され、我々はオーストラリアの独立保障をすることになる。"
 AST_diplomatic_events.41.a: "我々も義務を果たそう。"
 AST_diplomatic_events.42.t: "[AST.GetFascistParty]が約束を不履行"
 AST_diplomatic_events.42.desc: "約束には致命的な欠点がある。それは、破られる可能性があるということだ。[AST.GetFascistParty]の指導者はナウルを我が物として保持することに加え、その他の太平洋の島々も我が物として奪取することを決断した。\n\n我々のかつての太平洋領は、ナウル協定締結以前と同様、我々の手の届かないままだろう。それを変えたければ、戦争しか方法はない。"
 AST_diplomatic_events.42.a: "どんな報いを招くかは、時が経てばわかる。"
 AST_diplomatic_events.43.t: "[AST.GetNameDefCap]が東南アジアを要求"
 AST_diplomatic_events.43.desc: "[AST.GetName]は自らの北方への拡大を通じ、我々が共同で東南アジアの外交および紛争への影響力を拡大できると主張している。あからさまな要求ではないものの、[AST.GetLeader]の口ぶりは拒否など受け入れられないと言わんばかりだ。"
 AST_diplomatic_events.43.a: "我々の関心が別な場所にある以上、それが最善だろう。"
 AST_diplomatic_events.43.b: "それでも、我々の回答は拒否だ。"
 AST_diplomatic_events.44.t: "東南アジアの移譲"
 AST_diplomatic_events.44.desc: "[ENG.GetNameDefCap]は賢明にも、我々に東南アジア領を移譲することに同意した。オーストラリアの国境が拡大するにつれ、我々の影響力も同様に拡大し、世界が我々の思うままになるのは時間の問題だ。"
 AST_diplomatic_events.44.a: "未来は明るい。"
 AST_diplomatic_events.45.t: "東南アジアは現状維持"
 AST_diplomatic_events.45.desc: "[ENG.GetNameDefCap]は我々に対する東南アジア領の譲渡を拒否した。それでもなお、この地域を支配することの魅力は我々にとって明白であり、要求によって手に入れることができないとしても、いずれ我々のものになる可能性がある。"
 AST_diplomatic_events.45.a: "その通り、可能性はある。"
 #AST_diplomatic_events.46.t was removed
 AST_diplomatic_events.47.t: "負担の分担"
 AST_diplomatic_events.47.desc: "[AST.GetName]は最近イギリス連邦から距離を置いているにもかかわらず、軍事協力を申し出てきた。世界中に手を広げている[ENG.GetNameDefCap]にとって、負担の分担はメリットがあると[AST.GetName]は主張している。"
 AST_diplomatic_events.47.a: "同意しよう。"
 AST_diplomatic_events.47.b: "自分たちだけで何とかする。"
 AST_diplomatic_events.48.t: "英豪協定"
 AST_diplomatic_events.48.desc: "[ENG.GetNameDefCap]は軍事協力の礎となる不可侵条約への署名に同意した。"
 AST_diplomatic_events.48.a: "これは我々の関係の新たな章の始まりである。"
 AST_diplomatic_events.49.t: "協定が破談"
 AST_diplomatic_events.49.desc: "[ENG.GetNameDefCap]は不可侵条約への署名を拒否した。これにより、両国間に軍事協力関係を構築しようという我々の試みは失敗に終わり、外部への進出を単独で進めなければならなくなった。"
 AST_diplomatic_events.49.a: "そうするしかない。"
 AST_diplomatic_events.50.t: "オーストラリア太平洋駐屯軍"
 AST_diplomatic_events.50.desc: "東南アジアおよび太平洋の保護はイギリスの利益になるが、ブリテン諸島からは距離があり、[FROM.GetName]はそれを理解している。彼らは我々が兵站面で支援することと引き換えに、この地域の防衛指揮権を引き受けると申し出ており、これにより我々は他の地域に注意を向けられるようになる。"
 AST_diplomatic_events.50.a: "[FROM.GetName]の支援はありがたい。"
 AST_diplomatic_events.50.b: "この地域は十分に対応できる距離にある。"
 AST_diplomatic_events.51.t: "[ENG.GetNameDefCap]太平洋駐屯軍"
 AST_diplomatic_events.51.desc: "[FROM.GetNameDefCap]が同意し、東南アジアの海域を我々が防衛することになる。イギリスによる燃料の提供と引き換えに、[ROOT.GetName]は我々の近隣海域における海上支配の強化に注力する。"
 AST_diplomatic_events.51.a: "この海域は我々のものになる。"
 AST_diplomatic_events.52.t: "オーストラリア独自の太平洋駐屯軍"
 AST_diplomatic_events.52.desc: "[FROM.GetNameDefCap]の同意は得られなかった。彼らは東南アジアの海域の防衛に支援を必要としていなかったのだ。しかし、イギリスの支援の有無にかかわらず、[ROOT.GetName]は近隣海域における海上支配の強化に注力する。 "
 AST_diplomatic_events.52.a: "この海域は我々のものになる。"
 AST_diplomatic_events.53.t: "ヴィシーをアフリカから追放"
 AST_diplomatic_events.53.desc: "[AST.GetName]はヴィシー・フランスの崩壊または協力関係の構築が[ENG.GetNameDef]の主目的の1つだと考えている。そこで彼らは、ヴィシー・フランスが制圧されるまでフランス領アフリカの植民地獲得に協力すると申し出てきた。提案の裏には何やら意図が隠れているかもしれないが、この地域で連合国が存在感を増すことは間違いなく我々の利益になる。\n\n我々が許可を与えれば、[AST.GetName]はヴィシー・フランスとの協議を開始し、この植民地の平和的譲渡とオーストラリア駐屯軍の設立を要求する。"
 AST_diplomatic_events.53.a: "彼らの支援を歓迎する。"
 AST_diplomatic_events.53.b: "[AST.GetName]が我々を裏切るリスクはあまりに大きい。"
 AST_diplomatic_events.54.t: "支援の提供"
 AST_diplomatic_events.54.desc: "[ENG.GetNameDefCap]は同意し、アフリカにおける連合国の存在感増大が連邦に利益をもたらす。\n\n我々はヴィシー・フランスとの協議を開始し、彼らの植民地の平和的譲渡とオーストラリア駐屯軍の設立を要求する。"
 AST_diplomatic_events.54.a: "それが我々の責務だ。"
 AST_diplomatic_events.55.t: "許可があろうとなかろうと"
 AST_diplomatic_events.55.desc: "[ENG.GetNameDefCap]はアフリカにおけるオーストラリアの支援を辞退し、ヴィシー・フランスの問題を自ら対処する。それでもなお、我々の野心は簡単に断念できるものではない。\n\nヴィシー・フランスのアフリカ領土をオーストラリアが支配できれば、我々はイギリス連邦の従属国ではなく対等の存在になるだろう。我々は[ENG.GetNameDef]の意向にかかわらず、アフリカ領土の獲得を追求しなければならず、そのためなら武力行使も辞さないつもりだ。"
 AST_diplomatic_events.55.a: "我々は拡大の道を歩む。"
 AST_diplomatic_events.56.t: "[AST.GetName]がアフリカの領土を要求"
 AST_diplomatic_events.56.desc: "[ENG.GetNameDef]の代理として[AST.GetName]が現れ、アフリカの領土を譲渡するよう要求してきた。\n\n[ENG.GetNameDefCap]は自らの支配権をアフリカに拡大しようと決意しており、もし我々がオーストラリアによる占領を受け入れなければ、彼らは武装して再来するだろう。"
 AST_diplomatic_events.56.a: "紛争回避のため、当該領土は譲渡する。"
 AST_diplomatic_events.56.b: "ならば、武器を持ってまた来てもらおうではないか。"
 AST_diplomatic_events.57.t: "ヴィシーがアフリカの領土を譲渡"
 AST_diplomatic_events.57.desc: "ヴィシー・フランスは要求されたアフリカの領土を譲渡することに同意し、この地域の支配権をオーストラリア駐屯軍が掌握することを許可した。"
 AST_diplomatic_events.57.a: "アフリカへのさらなる拡大は続く！"
 AST_diplomatic_events.58.t: "ヴィシーが[AST.GetName]への領土譲渡を拒否"
 AST_diplomatic_events.58.desc: "ヴィシー・フランスは我々に対するアフリカの領土譲渡を拒否した。しかし、これは依頼ではなく要求なのだ。\n\n拒否された領土は手に入れてみせる。武力を用いてでも。"
 AST_diplomatic_events.58.a: "平和的であろうとなかろうと、[AST.GetName]は拡大する。"
 #AST_diplomatic_events.59 was removed
 #AST_diplomatic_events.60 was removed
 #AST_diplomatic_events.61 was removed
 AST_diplomatic_events.62.t: "反英協定？"
 AST_diplomatic_events.62.desc: "[AST.GetName]の外交官が来訪し、反英協定の締結を提案してきた。これを受け入れれば、我々が直接介入することなく、彼らの協力を得て北アイルランドをイギリス人から奪還することができる。\n成功した場合、見返りとして我々は彼らの陣営に加わり、将来的にイギリスとの戦争が起これば彼らを支援することになる。\n北部との統一は魅力的だが、我々がこのような形でより強大な隣国を敵に回すべきなのか慎重に考慮しなければならない。そして、さらに重要なのは、アイルランド全体が再びイギリスの単なる植民地と化することがないよう、紛争勃発時に我々が勝利できるかである。"
 AST_diplomatic_events.62.a: "統一を先延ばしにはできない！協定に署名しよう！"
 AST_diplomatic_events.62.b: "これは危険すぎる。"
 AST_diplomatic_events.63.t: "アイルランドが拒否！"
 AST_diplomatic_events.63.desc: "アイルランドが反英協定への署名を拒否した。"
 AST_diplomatic_events.63.a: "ならば、アイルランドは分断されたままとなる。"
 AST_diplomatic_events.64.t: "アイルランドが承諾！"
 AST_diplomatic_events.64.desc: "アイルランドが反英協定への署名を承諾した。"
 AST_diplomatic_events.64.a: "進め、ベルファストへ！"
 AST_diplomatic_events.65.t: "[FROM.GetName]が支援を提供" ### Support for the Chinese Communists - Sends event from AST to PRC offering support
 AST_diplomatic_events.65.desc: "[FROM.GetNameDef]で高まる[FROM.GetCommunistParty]の影響力がついに実を結んだ。彼らの代表団が中国を横断して来訪し、[FROM.GetAdjective]の義勇軍が我が軍を支援するべく動員されると伝えてくれた。加えて、彼らは我が軍のために予備の装備を持ってきてくれるそうだ。"
 AST_diplomatic_events.65.a: "[FROM.GetAdjective]の同志たちと協力する良いスタートになる"
 #AST_diplomatic_events.65.b: "They should focus on their own revolution"
 AST_diplomatic_events.66.t: "[FROM.GetName]が我々の支援に感謝" ### Support for the Chinese Communists - They accept
 AST_diplomatic_events.66.desc: "我々の義勇軍による支援と、我々が提供した軍需物資に対して、[FROM.GetLeader]の代表団が彼の感謝の意を伝えてきた。[FROM.GetAdjective]には内戦の経験が豊富にあるため、これらの資源は確実に有効活用されるだろう。"
 AST_diplomatic_events.66.a: "偉大なる第一歩だ"
 AST_diplomatic_events.67.t: "[FROM.GetName]が我々の支援に感謝" ### Support for the Chinese Communists - They accept
 AST_diplomatic_events.67.desc: "我々の義勇軍による支援と、我々が提供した軍需物資に対して、[FROM.GetLeader]の代表団が彼の感謝の意を伝えてきた。[FROM.GetAdjective]には内戦の経験が豊富にあるため、これらの資源は確実に有効活用されるだろう。"
 AST_diplomatic_events.67.a: "偉大なる第一歩だ"
 AST_diplomatic_events.68.t: "オーストラリアの要求"
 AST_diplomatic_events.68.desc: "オーストラリアは圧倒的な強敵である[JAP.GetNameDef]と単独で対峙することを望んでいない。彼らが我々に強く求めているのは、先手を打って差し迫る紛争をできるかぎり早く解決することだ。"
 AST_diplomatic_events.68.a: "立場が逆転したようだな。"
 AST_diplomatic_events.69.t: "再び結ばれる"
 AST_diplomatic_events.69.desc: "[ENG.GetNameDef]と[AST.GetName]の絆は試されているが、後者はそれを完全な強さにまで回復させるべく尽力している。[AST.GetName]はイギリス政府内部に多くの人脈と味方を持っており、かの国の指導者たちもその要求を拒みきれない。両国は再び同じ陣営に加わり、ブリテン諸島と南の大地は再び手を取り合うことになる。"
 AST_diplomatic_events.69.a: "そうなるのだ。"
 AST_diplomatic_events.71.t: "オーストラリアが太平洋の島々を要求"
 AST_diplomatic_events.71.desc: "[AST.GetName]は我々が領有する太平洋の島々の支配権を要求してきた。西太平洋は[USA.GetNameDef]が支配すべき場所ではないと主張している。オーストラリアの敵意を和らげるためなら、島々を差し出すのは小さな代償かもしれないが、代償であることに変わりはない。我々はすでに手一杯の状況だが、台頭しつつあるファシスト国家を刺激する危険を冒すべきだろうか？"
 AST_diplomatic_events.71.a: "それはやめておこう。"
 AST_diplomatic_events.71.b: "太平洋の島々は我々が領有し続ける。"
 AST_diplomatic_events.72.t: "[USA.GetNameDef]が太平洋の島々を譲渡"
 AST_diplomatic_events.72.desc: "[USA.GetNameDef]はすでに手一杯な状況にあり、オーストラリアの敵意を和らげるためであれば、太平洋の島々を差し出すことは大した代償ではなかった。彼らが領有していた太平洋の島々は、今や我々のものである。"
 AST_diplomatic_events.72.a: "素晴らしい。"
 AST_diplomatic_events.73.t: "[USA.GetNameDefCap]が拒否"
 AST_diplomatic_events.73.desc: "[USA.GetNameDefCap]は我々に太平洋の島々を明け渡すことを拒否した。我々の要求と太平洋における影響力の拡大にもかかわらず、ワシントンは依然としてこれらの島々を手放そうとは考えていない。"
 AST_diplomatic_events.73.a: "島々を手に入れるにはまだ早いのかもしれない。"
 AST_diplomatic_events.74.t: "オーストラリアがフィリピンの譲渡を要求"
 AST_diplomatic_events.74.desc: "[AST.GetName]は領土拡大の野心の下、[PHI.GetNameDef]の支配権を要求してきた。我々がこれを拒否すれば、[AST.GetName]は戦争も辞さない構えであり、[USA.GetNameDef]が[AST.GetName]の勢力圏内で領土を保持することは到底考えられないことだとみなしている。"
 AST_diplomatic_events.74.a: "戦争の危険を冒すわけにはいかない。要求を受け入れよう。"
 AST_diplomatic_events.74.b: "フィリピンは引き続き我々のものだ！"
 AST_diplomatic_events.75.t: "[PHI.GetNameDef]の譲渡"
 AST_diplomatic_events.75.desc: "各国が我々の怒りをこれほどまでに恐れるようになった今、[AST.GetName]がファシスト国家として台頭しつつあることが、いくらかの利益をもたらしているのは明らかだ。[USA.GetNameDefCap]が同意し、[PHI.GetNameDef]は我々のものとなった。"
 AST_diplomatic_events.75.a: "新たな秩序が生まれた。"
 AST_diplomatic_events.76.t: "[USA.GetNameDefCap]が拒否"
 AST_diplomatic_events.76.desc: "[USA.GetNameDefCap]は我々に[PHI.GetNameDef]を明け渡すことを拒否した。我々の要求と太平洋における影響力の拡大にもかかわらず、ワシントンは依然としてこの領土を手放そうとは考えていない。"
 AST_diplomatic_events.76.a: "ならば戦争だ。"
 AST_diplomatic_events.78.t: "[AST.GetName]が大国に対する保障を要請"
 AST_diplomatic_events.78.desc: "[AST.GetNameDefCap]は我々に大胆な目標を明かした。\n\n「[USA.GetNameDefCap]の影は我々にのしかかり、我々の行動がその利益に合わなければいつでも干渉すると脅してくる。これほどの世界的大国がオーストラリアと日本の問題に干渉してくる限り、東アジアが真に我々のものになることはない。ゆえに[AST.GetName]は戦争に踏み切る。」\n\n[AST.GetLeader]首相の意図は明白だ。[AST.GetName]は[USA.GetNameDef]に立ち向かうつもりであり、アメリカが単独で打ち破れないほど強大だった場合に備え、我々の支援を求めている。"
 AST_diplomatic_events.78.a: "同国を保障しよう。"
 AST_diplomatic_events.78.b: "[JAP.GetNameDefCap]には対処すべき独自の問題がある。"
 AST_diplomatic_events.79.t: "[JAP.GetNameDefCap]が[AST.GetName]を保障"
 AST_diplomatic_events.79.desc: "[USA.GetNameDef]によるアジア・オセアニア外交への干渉が望ましくなく、容認できないことは、我々だけでなく誰の目にも明らかだ。[JAP.GetNameDefCap]は我が国の保障に同意し、アメリカが単独で打ち破れないほど強大だったとしても同盟国が助けに来ると信じ、我々は敵に対して堂々と旗を掲げられるようになった。"
 AST_diplomatic_events.79.a: "いざ、戦場へ。"
 AST_diplomatic_events.80.t: "[JAP.GetNameDefCap]が我が国の保障を拒否"
 AST_diplomatic_events.80.desc: "[USA.GetNameDefCap]によるアジア・オセアニア外交への干渉は望ましくなく、容認できない。しかし、それが明らかなのは我々だけのようだ。[JAP.GetNameDefCap]は我が国の保障を拒否し、我々は彼らの助けなしに敵と戦わざるを得なくなった。"
 AST_diplomatic_events.80.a: "ならば、そうしよう。"
 AST_diplomatic_events.81.t: "かわいらしい団結の象徴"
 AST_diplomatic_events.81.desc: "イギリス首相の動物好きは誰の目にも明らかであり、そのコレクションは実に見事だ。多様な生き物からなる彼の家族に新たな仲間が加われば、きっと喜ばれるだろう。まして珍しい生き物ならなおさらである。\n\n[ENG.GetLeader]自身はオーストラリアのカモノハシに興味を示しているが、この小さな生き物には輸送による健康リスクがあるため、現在は輸出が禁止されている。それでも例外を設ける価値はあるかもしれない。\n\n団結の象徴として、首相の願いを叶えるべきだろうか？"
 AST_diplomatic_events.81.a: "[ENG.GetLeader]にカモノハシを贈ろう"
 AST_diplomatic_events.81.b: "輸出禁止は解除しない。たとえ首相のためであってもだ。"
 AST_diplomatic_events.82.t: "[ENG.GetLeader]からの悲痛な報せ"
 AST_diplomatic_events.82.desc: "6週間前、カモノハシと飼育施設一式を載せてメルボルン港を出港した輸送船が、[ENG.GetNameDef]に到着した。しかし、その到着は喜ばしいものではなかった。カモノハシが死んでいることが判明したのだ。到着を待つ間、自らにちなんだ名まで付けていた[ENG.GetLeader]は、ペットの死を嘆く一方、その死は敵国のせいだと主張している。潜水艦攻撃の爆発音に驚いたカモノハシが、ショック死したというのだ。\n\nしかし、付き添いの飼育員の記録は別の死因を示している。飼育施設内の水温と気温が許容範囲を大きく超えていたのである。\n\nいずれにせよ、カモノハシの[ENG.GetLeader]は死に、イギリス首相はカモノハシなしのままとなる。"
 AST_diplomatic_events.82.a: "実に悲しい報せだ。"
 AST_political_events.1.t: "国民投票の実施"
 AST_political_events.1.desc: "我々政府が連邦の統制強化を目指している分野は2つある。航空と市場管理だ。\n\n航空分野については、憲法を改正し、連邦議会に航空や航空機に関する立法権を付与することが目標だ。\n\n市場管理の法改正は、現在は憲法上認められていない、市場流通における連邦と州の協力を可能にするものである。\n\nどちらについて国民投票を実施すべきだろうか？"
 AST_political_events.1.a: "航空分野を改正し、[AST.GetName]全域の航空航行を規制する。"
 AST_political_events.1.a.tt: "改革案が可決された場合:\n §Y航空改革可決§!が追加され、以下の効果が付与される:\n 航空技術研究速度: §G+15%§!\n §Y航空基地§!の建設速度: §G+5.00%§!"
 AST_political_events.1.b: "市場管理を改正し、全国の農産物の流通販売計画を統制する。"
 AST_political_events.1.b.tt: "改革案が可決された場合:\n §Y市場管理改革可決§!が追加され、以下の効果が付与される:\n 消費財工場補正: §Y-10.0%§!"
 AST_political_events.2.t: "国民投票で可決"
 AST_political_events.2.desc.a: "国民は、我が国における航空改革の実施を認めた。オーストラリア憲法が制定された当時は航空という概念が存在していなかった以上、政府が航空交通と規制に関する権限をついに掌握するのは当然のことである。安全性と効率性のため、今後は全国統一の航空法制が整備されることになる。"
 AST_political_events.2.desc.b: "国民は、我が国における市場改革の実施を認めた。政府は農産物とその販売を規制する権限を得たことで、市場を安定させ、州同士の協力を改善できるようになる。農民の収入はより安定し、国家経済もまた安定するだろう。"
 AST_political_events.2.a: "連邦の支配を拡大するのだ！"
 AST_political_events.4.t: "首相が逝去"
 AST_political_events.4.desc: "[AST.GetName]の指導者たちは長きにわたり戦争準備の重圧に耐えてきたが、ついにその緊張が最大の犠牲をもたらした。首相が心臓発作で死亡したのである。\n\n現在の世界情勢を考えれば、彼の指導力を失うことは大きな痛手となる。それでもオーストラリアは、新たな指導者[AST.GetLeader]の舵取りのもとで前進しなければならない。"
 AST_political_events.4.a: "国にとっての悲劇だ。"
 AST_political_events.5.t: "オーストラリア政府が強硬姿勢へ"
 AST_political_events.5.desc: "反抗的で物議を醸す声が集まり、オーストラリア・ファースト運動が結成された。政府は、その意図が必ずしも民主的とは言えないことを懸念し、この組織と構成員を監視下に置くことを選んだ。民主主義勢力の干渉は、我々の組織化能力を低下させ、新たな構成員の募集を妨げることになる。"
 AST_political_events.5.a: "彼らの真意は時が来ればわかる。"
 AST_political_events.6.t: "1938年の150周年記念式典"
 AST_political_events.6.desc: "本日、1938年の150周年記念式典が催され、「オーストラリアの国家への行進」と題された行進がシドニーの主要な街路を通過する際、オーストラリア・ホールにて抗議活動が行われた。\n\n先住民の権利を支持する活動家と団体が集結し、150周年とはイギリスによる植民地化の始まりだけを示すものではなく、先住民に対する憲法上の差別が始まった日でもあるという事実への注目を呼びかけた。活動家たちは先住民の教育および保護に関する新たな法律の策定と、先住民を完全な市民として認めることを可能にする新政策を要求した。"
 AST_political_events.6.a: "行動を起こさなければならない。"
 AST_political_events.7.t: "帝国の圧力"
 AST_political_events.7.desc: "最近の出来事を踏まえると、オーストラリアの政治が変化していることはもはや否定できない。[ENG.GetNameDefCap]は[AST.GetName]が自らの連邦傘下にある国家としてふさわしい道を確実に歩み続けるよう、外交的な手段を講じ、この平和的な誘導が、彼らの自治領としての忠誠を維持するのに十分であることを期待している。"
 AST_political_events.7.a: "イギリスの思惑には反するが、[AST.GetName]の歩む道は自らが決める。"
 AST_political_events.8.t: "戦争は迫っている"
 AST_political_events.8.desc: "$AST_war_is_coming_cat_desc$"
 AST_political_events.8.a: "準備しなければならない。"
 AST_political_events.9.t: "ダルフラム争議"
 AST_political_events.9.desc: "銑鉄の積み込みをめぐる争議として始まった事態は、はるかに大きな火種となった。オーストラリア全土の労働者が連帯して職場を離れ、政府と産業界の双方に反抗している。ストライキが広がり緊張が高まるにつれ、危機は深刻化し、権力の座にある者たちの辞任を求めるまでになった。そして、事態をまったく収拾できなかった政府はその要求どおり退陣し、[AST.GetCommunistParty]が与党の座を手にする道が開かれた。"
 AST_political_events.9.a: "ならば、我々がそれを手にしよう。"
 AST_canberra_air_disaster_events.1.t: "キャンベラ航空事故"
 AST_canberra_air_disaster_events.1.desc: "本日、ロッキード・ハドソン機がキャンベラ郊外で墜落した。搭乗していた10名の中には、閣議への召集に応じていた陸軍長官とその幕僚も含まれており、彼らと乗員は全員、痛ましくも命を落とした。\n\n墜落原因は謎に包まれている。当時の天候は飛行に理想的で、操縦していたのはオーストラリア空軍の熟練将校、ロバート・ヒッチコック大尉だった。\n\n原因が何であれ、この国にとって——とりわけ犠牲者の家族や友人にとって——痛ましい日である。国民の目は今、指導者たちの対応に向けられている。"
 AST_canberra_air_disaster_events.1.a: "あまりにも痛ましい出来事だ。"
 AST_canberra_air_disaster_events.1.a.tt: "§Y「内閣信任」のディシジョン§!と、現政権を維持または排除する§Y任務§!がアンロックされる。"
 AST_canberra_air_disaster_events.2.t: "[AST.GetRulingParty]が信任獲得"
 AST_canberra_air_disaster_events.2.desc: "現政権は、キャンベラ航空事故後の国内の混乱を見事に乗り切った。[AST.GetRulingParty]は、難局にあっても揺らぐことなく、それを乗り越える実行力があることを示し、最終的に全国で民衆の支持が高まった。"
 AST_canberra_air_disaster_events.2.a: "未来が目の前に広がっている。"
 AST_canberra_air_disaster_events.3.t: "内閣不信任決議"
 AST_canberra_air_disaster_events.3.desc: "不信任案の可決を受け、現政権がついに交代し、不本意ながらも後継者に政権を引き渡した。不安定な政局や国民の政治不信の増大を経て、オーストラリアは新たな始まりを迎える準備が整った。"
 AST_canberra_air_disaster_events.3.a: "新たな政権がオーストラリアを救ってくれる。"
 AST_canberra_air_disaster_events.4.t: "指導者の交代"
 AST_canberra_air_disaster_events.4.desc: "不安定な政局や国民の政治不信を経て、[AST.GetRulingParty]は指導部を刷新した。多数決により首相は退陣を余儀なくされ、後継者がその座に就いた。"
 AST_canberra_air_disaster_events.4.a: "これでオーストラリアが前進できることを願おう。"
 AST_canberra_air_disaster_events.5.t: "オーストラリアからの非難"
 AST_canberra_air_disaster_events.5.desc: "記者会見で、[AST.GetName]が、先日同国内で起きた航空機墜落事故の責任は我々にあるとして、我が国を非難した。この事故では数名の政府高官が死亡している。\n\n当然、これはまったくの事実無根であり、それゆえに同国の侮辱には極めて強い悪意が感じられる。"
 AST_canberra_air_disaster_events.5.a: "事実無根であり、相手にする必要はない。"
 AST_canberra_air_disaster_events.5.b: "このままでは済まさない。"
 AST_canberra_air_disaster_events.6.t: "[JAP.GetNameDefCap]の報復"
 AST_canberra_air_disaster_events.6.desc: "[JAP.GetNameDefCap]は我が国の非難を受け流さず、最初の攻撃行為とみなした。[JAP.GetLeader]は対立を強め、これで同国は我が国へ侵攻する正当な権利を得たと述べた。"
 AST_canberra_air_disaster_events.6.a: "これ以上緊張を高めるべきでない。"
 AST_canberra_air_disaster_events.6.b: "これを見過ごすわけにはいかない。"
 INS_limited_war_events.1.t: "マラヤを粉砕せよ！"
 INS_limited_war_events.1.desc: "敵の戦線は崩壊し、我が軍は抵抗を受けることなく前進している。海峡の向こうでは、イギリスの従属国が人民の怒りの重さに耐えきれず崩壊しつつある。ロンドンの傀儡どもは、自らの銃剣が歴史から身を守ってくれると思っていた。だが、それは間違いだった。"
 INS_limited_war_events.1.a: "独立万歳！"
 INS_limited_war_events.1.b: "共和国にとって良き日だ。"
 INS_limited_war_events.2.t: "[FROM.GetAdjective]の反撃"
 INS_limited_war_events.2.desc: "傀儡政権に対して迅速な打撃を与えるはずが、事態は悪化した。帝国の出資によって強化された[FROM.GetAdjective]軍は我が軍を係争地から追い出し、占領者としてそこに鎮座している。無線からは毎日のように彼らの誇示する声が聞こえる。これ以上進めばさらなる屈辱を招き、撤退すれば群島全体での敗北を認めることになる。"
 INS_limited_war_events.2.a: "部隊を撤退させ、救えるものを救え。"
 INS_limited_war_events.2.b: "傀儡どもには屈しない！"
 INS_limited_war_events.3.t: "[FROM.GetName]が共和国に屈する"
 INS_limited_war_events.3.desc: "クアラルンプールから報せが届いた。決定的な時にロンドンの主人に見捨てられた傀儡政府は、町々が焼かれるのを見るよりも、我々の条件を受け入れることを選んだ。係争地は我々のものだ。この教訓を、地域の他の従属国も見過ごすことはあるまい。"
 INS_limited_war_events.3.a: "インドネシアは立ち上がる。"
 INS_limited_war_events.4.t: "[FROM.GetName]が我々の条件を拒絶"
 INS_limited_war_events.4.desc: "[FROM.GetName]は我々の申し出を面と向かって突き返した。ホワイトホールの書いた台本を読み上げる傀儡閣僚たちは、一寸の土地も譲らず、銃声が静まる前に共和国そのものを屈服させねばならないと宣言している。"
 INS_limited_war_events.4.a: "ならば、砲火で語るまでだ。"
 INS_limited_war_events.5.t: "[FROM.GetNameDef]が我々の壊滅を呼びかける"
 INS_limited_war_events.5.desc: "[FROM.GetNameDefCap]は慎重な戦争という最後の口実を捨て去った。彼らの放送では、共和国を分断し、旧植民地の宗主間で群島を分割することが公然と語られている。この事態が静かな終わりを迎えることはない。インドネシアが最後に立っているか、一人も立っていないかのどちらかだ。"
 INS_limited_war_events.5.a: "我々は共に立ち、共に倒れる。"
 INS_limited_war_events.6.t: "[FROM.GetAdjective]の進撃が失速"
 INS_limited_war_events.6.desc: "[FROM.GetAdjective]の攻勢に不意を突かれ、一時は最悪の事態を覚悟した。しかし、その進撃も泥沼にはまり込んだ。兵士は疲弊し、戦線は伸び切り、ロンドンからの虚勢も声明を重ねるたびに弱まっている。共和国は今なら寛大さを示し、傀儡どもにこの争いから身を引く道を与えることもできる。もっとも、多くの者は慎重な勝利よりも完全な勝利のほうが大義に資すると言うだろう。"
 INS_limited_war_events.6.a: "条件を提示せよ。"
 INS_limited_war_events.6.b: "傀儡どもに容赦は要らない。"
 INS_limited_war_events.7.t: "我々の攻勢が頓挫"
 INS_limited_war_events.7.desc: "我々の進軍は停滞し、さらに悪いことに、敵にもそれを悟られている。海峡の向こうから要求が届いた。今すぐ武器を置いて条件を受け入れるか、同じ結末に至るまで死傷者名簿がさらに長くなるのを見届けるか。彼らが提示している選択肢は、葬儀の規模を選ぶことだけだ。"
 INS_limited_war_events.7.a: "さらに悪い戦争より、不利な和平のほうがましだ。"
 INS_limited_war_events.7.b: "共和国は降伏しない。"
 INS_limited_war_events.8.t: "[FROM.GetName]が降伏を拒む"
 INS_limited_war_events.8.desc: "[FROM.GetName]は我々の提案に反抗で応えた。彼らの閣僚は、共和国にわずかでも譲歩するくらいなら、ペナンからジョホールに至るすべてのカンポンが焼き払われるのを見るほうがましだと宣言している。かくして戦争は続く。"
 INS_limited_war_events.8.a: "それなら、それでいい。"
 INS_limited_war_events.9.t: "[FROM.GetName]は共和国を打ち砕くつもりだ！"
 INS_limited_war_events.9.desc: "敵司令部の無線を傍受したことで、最悪の事態が確認された。もはや和解も、節度ある和平も、かつて保持していた戦線への復帰もない。傀儡どもとロンドンの宗主は共和国の完全降伏を要求し、インドネシアを車裂きにして、我々がもぎ取った島々を再び帝国主義者の軍靴の下へ引き渡せと迫っている。これに対する答えはただ一つである。"
 INS_limited_war_events.9.a: "インドネシアは倒れない！"
 ### AST - Union Control Events ###
 AST_union_control_events.1.t: "我々の労働組合に潜む外国工作員"
 AST_union_control_events.1.desc: "諜報機関が政府に憂慮すべき報告をもたらした。オーストラリアの共産主義工作員が地元の労働組合指導者と接触し、急進的な文書を配布し、労働者に革命路線での組織化を促しているという。この運動は今のところ小規模にとどまっているが、治安当局は、まさにこうして事は始まるのだと警告している。根付く前に決断を下さなければならない。"
 AST_union_control_events.1.a: "監視下に置け。様子を見よう。"
 AST_union_control_events.4.t: "共産主義工作員が[MAL.GetAdjective]の領土を掌握"
 AST_union_control_events.4.desc: "衝撃的な報告が政府に届いた。組織的な作戦により我々の州の一つが制圧され、革命政府の一部であると宣言された。この攻撃の速さと組織性は厄介な疑念を生んでいる。諜報機関は、反乱勢力が単独で行動したのではなく、外国勢力が彼らを我が国の沿岸へ導いたのではないかと見ている。制圧を逃れた者たちはまだ降伏していない。彼らは再集結して武器を取り、奪われたものを取り戻す決意を固めている。"
 AST_union_control_events.4.a: "誰が黒幕か突き止めよ。この反乱勢力がその土地を長く保持することはない。"
 AST_union_control_events.4.a.tt: "反共産主義の民兵部隊が結集し、共産主義者による占領に抵抗するため編制された。"
 AST_union_control_events.5.t: "[MAL.GetAdjective]の惨事"
 AST_union_control_events.5.desc: "作戦は大惨事に終わった。我々の部隊は上陸すら果たせなかった。政府側の哨戒部隊に撃退された者もいれば、海峡で行方不明になった者もおり、陣地を確保する前に捕縛された者もいた。詳細は不明瞭だが、結果は明白である。さらに悪いことに、報道機関がこの件を嗅ぎつけた。議会では、我が軍がその海域でいったい何をしていたのかという疑問が呈されている。世論の反応は衝撃と当惑が入り混じったものだ。革命のためにどのような成果を確保しようとしていたにせよ、我々は別の道を探さなければならない。"
 AST_union_control_events.5.a: "手痛い後退だ。同志を支援するため、別の手段に目を向けなければならない。"
 AST_union_control_events.3.t: "[MAL.GetNonIdeologyName]で革命が勃発"
 AST_union_control_events.3.desc: "[MAL.GetNonIdeologyName]の労働者が蜂起した。我々が長い運動の中で育ててきた共産主義細胞が全国で武器を取ったが、現場からの報告は芳しくない。革命勢力は望まぬ地域に集中してしまい、水と密林によって半島の中枢から分断されている。本土に足掛かりがなければ、政府はただ彼らを待ち構え、革命が広がる前に兵糧攻めにするだけだ。オーストラリアは秘密裏かつ迅速に行動し、戦闘員を半島に上陸させ、革命が生き残るために必要な拠点を与えなければならない。"
 AST_union_control_events.3.a: "浜辺で革命を死なせるわけにはいかない。彼らに足掛かりを確保せよ。"
 AST_union_control_events.2.t: "街頭に現れた[AST.GetAdjective]支援の扇動者"
 AST_union_control_events.2.desc: "オーストラリアの共産主義政権の工作員が我々の都市に到着した。彼らは隠れる気もない。工場の門前ではパンフレットが配られ、公共広場では演説が行われ、オーストラリアの工作員と地元の急進派団体の間には連帯ネットワークが構築されている。既存の外国影響力のネットワークは一夜にして再活性化したようだ。これは組織的な運動であり、民衆の不満が手に負えないものになる前に、政府は対応を決めなければならない。"
 AST_union_control_events.2.b: "困った事態になった。"
 ###########################
 ##### ABDACOM EVENTS ######
 ###########################
 ABDA_events.1.t: "新たな総司令部への招待"
 ABDA_events.1.desc: "[FROM.GetNameDef]は太平洋戦域における合同総司令部を設立し、我々に参加を要請した。ABDA総司令部と呼ばれれるこの構想は、この地域で活動する連合国の海・空・陸軍を単一の指揮系統下に統合することを目的としている。加盟すれば、[FROM.GetNameDef]およびその他の加盟国とより緊密に連携することになる。これを承諾するのか決断しなければならない。"
 ABDA_events.1.a: "我々は団結する。"
 ABDA_events.1.b: "現時点でこれに参加することはできない。"
 ABDA_events.2.t: "[FROM.GetName]がABDA総司令部に参加"
 ABDA_events.2.desc: "[FROM.GetNameDef]は我々からの要請を受け、ABDA総司令部への参加に承諾した。今後、彼らの軍は統合指揮系統の下で作戦行動を行う。これにより、太平洋戦域における我々の立場は強化されることになる。"
 ABDA_events.2.a: "歓迎すべき出来事だ。"
 ABDA_events.3.t: "[FROM.GetName]が参加を辞退"
 ABDA_events.3.desc: "[FROM.GetNameDef]はABDA総司令部への参加要請を辞退した。現時点で彼らの軍はこの提携に参加しないが、その可能性はまだ残っている。"
 ABDA_events.3.a: "残念だが、承知した。"
 ABDA_events.5.t: "ABDA総司令部への招待状"
 ABDA_events.5.desc: "[FROM.GetNameDef]は我々を米英蘭豪総司令部（ABDA総司令部）に招待した。ABDA総司令部はすでに太平洋戦域における連合国軍の最高統合指揮機関として確立されており、主要な連合国の海軍および陸軍を単一の指揮系統下に統合している。参加すれば、我が軍はこの統合指揮系統に組み込まれ、情報の共有と、ドクトリンの面での連携が可能になり、連合国の全面的な支援を受けられるようになる。我々は決断しなければならない。"
 ABDA_events.5.a: "我々は団結する。"
 ABDA_events.5.b: "現時点でこれに参加することはできない。"
 ABDA_events.4.t: "シンガポールの防衛"
 ABDA_events.4.desc: "シンガポールがABDA総司令部の防衛線の要所に指定されたことを受け、司令官たちはその防衛強化へどのように投資するかを決定しなければならない。海上進入路と港湾の防衛を優先するか、陸上攻撃に備えて陸上進入路に力を入れるか、両方に資源を分散するかのいずれかである。どの方針を選ぶかによって、敵襲の際にシンガポールをどのように防衛できるかが左右される。"
 ABDA_events.4.a: "海上進入路を強化する。シンガポールの強みは港湾である。"
 ABDA_events.4.b: "陸上防衛線を要塞化する。真の脅威は陸からやってくる。"
 ABDA_events.4.c: "バランスよく対策する。いかなる攻撃経路も防衛するのだ。"
 ABDA_fortress_singapore_choice_tt: "この国家方針を完了すると、シンガポールの防衛強化の方法についての選択肢が示される。"
 ABDA_faction_membership_requirement_tt: "加盟資格のある国が招待される。"
