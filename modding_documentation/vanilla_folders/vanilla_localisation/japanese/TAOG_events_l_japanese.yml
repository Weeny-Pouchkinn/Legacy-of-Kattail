 ### INS - Political Events
 INS_political_events.1.t: "[INS.GetNameDef]の新総督"
 INS_political_events.1.desc: "[INS.GetLeader]の5年の任期が終わりに近づいているため、後任としてふさわしい指導者を選ぶ必要がある。ウィルヘルミナ女王は、有望な特命全権大使であるアリディウス・チャルダ・ファン・スタルケンボルフ・スタハウェルを推薦している。"
 INS_political_events.1.a: "女王のご意向のままに。"
 INS_political_events.1.b: "[INS.GetLeader]はよくやっている。再任すべきだ。"
 INS_political_events.2.t: "[FROM.GetName]が[721.GetName]の所有権を要求"
 INS_political_events.2.desc: "旧インド諸島で誕生した新たな共和政府が、列島全域を自国領土として宣言した。[FROM.GetLeader]は、我が国に対し[721.GetName]の放棄を正式に要求しており、拒否すれば軍事行動に出ると脅しをかけている。"
 INS_political_events.2.a: "よかろう、事を荒立てるほどのことではない。"
 INS_political_events.2.b: "絶対にダメだ！"
 INS_political_events.3.t: "[FROM.GetName]が[721.GetName]の放棄に同意"
 INS_political_events.3.desc: "予想どおり、[FROM.GetLeader]が我々の要求を受け入れ、[721.GetName]から部隊を撤退しはじめた。人民治安軍は、複数名の政府使節とともに同地域に進駐している。[INS.GetLeader]自らがディリで演説を行い、植民地支配からの解放を宣言した。"
 INS_political_events.3.a: "素晴らしいな！"
 INS_political_events.4.t: "[FROM.GetName]が[721.GetName]の放棄を拒否"
 INS_political_events.4.desc: "[FROM.GetName]との交渉は不調に終わった。[FROM.GetLeader]は[721.GetName]の放棄を頑なに拒み、会談は早々に打ち切られた。"
 INS_political_events.4.a: "ならば戦争だ。"
 INS_political_events.5.t: "インドネシア総選挙"
 INS_political_events.5.desc: "今日はインドネシアにとって歴史的な節目である。革命が正式に終結し、[INS.GetLeader]首相が、自由意思に基づく我が国初の民主的な選挙を実施すると宣言したのだ。この選挙の結果は、長きにわたりインドネシアに影響を及ぼすことになるだろう。"
 INS_political_events.5.a: "スタン・シャフリールはこの国をここまで導いてきた。この先も彼が導くべきだ！"
 INS_political_events.5.b: "アミル・シャリフディンなら社会主義派も民族主義派も納得するだろう。"
 INS_political_events.5.c: "モハマッド・ハッタが革命を始めた。そして彼はやり遂げるだろう。"
 INS_political_events.6.t: "報われた裏工作"
 INS_political_events.6.desc: "革命が進行する今、東インド当局に潜入していた我々のゲリラ組織はもはや内密に行動する必要がなくなった。オランダが手を打つ前に、一斉に破壊工作を開始する。"
 INS_political_events.6.a: "今後も先手を取る必要がある。"
 INS_political_events.7.t: "スタルジョ請願"
 INS_political_events.7.desc: "スタルジョが中心となって提出したフォルクスラートの請願は、オランダ・インドネシア両代表による円卓会議を開催し、インドネシアの自治権獲得の要望について協議することを求めている。この請願は現在、内部審議を終え、総督の承認を待つ段階にある。多くの顧問官は現状維持を主張し、請願を拒否すべきだとしているが、民族主義運動が勢いを増し、過激化していることは否定のしようがない。自治権を求める平和的な要求を拒み続ければ、民族主義者たちが暴力的な手段に訴えはじめるおそれがある。"
 INS_political_events.7.a: "内戦を避けるため、交渉に乗り出す必要がある。"
 INS_political_events.7.b: "現状を維持すべきだ。"
 INS_political_events.7.c: "民族主義者の言い分にも一理あるのでは？"
 INS_political_events.8.t: "[?event_target:INS_invasion_event_invader.GetAdjective]による占領危機"
 INS_political_events.8.desc: "[?event_target:INS_invasion_event_invader.GetName]の部隊が[?event_target:INS_invasion_event_invaded_state.GetName]に到着した。この地域では、我々のほうが兵数が圧倒的に劣勢であり、[?event_target:INS_invasion_event_invaded_state.GetName]からの全面的な撤退を命じられている。[?event_target:INS_invasion_event_invader.GetAdjective]軍は東インド諸島へ進軍を続けており、占領を回避できる見込みは極めて薄い。"
 INS_political_events.8.a: "民族主義者を拘束し、命尽きるまで祖国を守り抜く！"
 INS_political_events.9.t: "インドネシアが独立を宣言"
 INS_political_events.9.desc: "[JAP.GetNameDef]が東インドからの部隊撤退を開始したことを受け、我々は植民地政府を再建すべくバタビアに部隊を派遣した。しかし、我が部隊は、東インド諸島の政局が占領以降、大きく変わっていることを知ることになった。部隊がバタビアに到達する前に、民衆からの圧倒的な支持を得て、[INS.GetLeader]が独立宣言に署名し、インドネシア共和国の独立を宣言していたのだ。"
 INS_political_events.9.a: "戦車を送り込め！"
 INS_political_events.9.b: "状況は絶望的だ。これ以上戦うよりも、本国の再建に専念すべきだ。"
 INS_political_events.11.t: "[HOL.GetNameDefCap]がインドネシアの主権を承認"
 INS_political_events.11.desc: "独立宣言を受け、我が国の市民軍は来たるべきオランダの侵攻に備え、直ちに領土の防衛に動いた。しかし多くの者の予想に反し、[HOL.GetLeader]は侵攻を命じないと発表した。これ以上の紛争は避け、オランダ本国の再建に専念するとのことだ。"
 INS_political_events.11.a: "意外ではあるが、喜ばしいことだ。"
 INS_political_events.12.t: "インドネシア民族主義者との協議"
 INS_political_events.12.desc: "我が軍が[?event_target:INS_invasion_event_invaded_state.GetName]に上陸し、インドネシア戦線での勝利が目前に迫っている。インドネシアの占領体制について決定する必要がある。直接統治を行えば必要な資源を確保できるが、それには多大な犠牲と困難が伴うだろう。そこで我々は、有力な革命指導者であるスカルノと交渉し、インドネシア傀儡政権を樹立する計画を立てた。表向きはスカルノが指導者となり、実際には我々が裏から指揮を執るのだ。そうすれば、インドネシアの民衆の動揺を抑え、全面的な占領よりもはるかに安上りに済ませることができる。"
 INS_political_events.12.a: "スカルノとの交渉を継続すべきだ。"
 INS_political_events.12.b: "革命家と手を組むつもりはない。"
 INS_political_events.13.t: "[?event_target:INS_invasion_event_invader.GetAdjective]による占領危機"
 INS_political_events.13.desc: "[?event_target:INS_invasion_event_invader.GetName]の部隊が[?event_target:INS_invasion_event_invaded_state.GetName]に到着した。同地域では、我々のほうが兵数が圧倒的に劣勢であり、[?event_target:INS_invasion_event_invaded_state.GetName]からの全面的な撤退を命じられている。[?event_target:INS_invasion_event_invader.GetAdjective]軍は東インド諸島へ進軍を続けており、占領を回避できる見込みは極めて薄い。さらに、諜報員の報告によれば、[?event_target:INS_invasion_event_invader.GetLeader]がスカルノら民族主義指導者と交渉を行っており、共栄圏の下でスカルノを指導者とするインドネシア傀儡国家の樹立を目論んでいるようだ。"
 INS_political_events.13.a: "民族主義者を拘束し、命尽きるまで祖国を守り抜く！"
 INS_political_events.13.b: "危険だが、独立の好機なのでは？"
 INS_peta_explain_tt: "[JAP.GetName]が押し返されれば、我々は占領下の混乱に乗じて完全な独立を宣言できるようになる。"
 INS_peta_explain_tt_jap: "§R[INS.GetName]は我々への忠誠を保つかもしれない。しかし、我々が領土の支配を失い始めれば、彼らは我々の虚勢を見抜き、独立を宣言するかもしれない§!。"
 INS_political_events.14.t: "民族主義指導者が逮捕"
 INS_political_events.14.desc: "スカルノをはじめ、インドネシアの有力な革命指導者たちが、我々が傀儡政権を樹立するより先に、オランダの憲兵隊によって逮捕されてしまった。"
 INS_political_events.14.a: "有用な味方となっただろうに、残念だ。"
 INS_political_events.15.t: "郷土防衛義勇軍"
 INS_political_events.15.desc: "スカルノとの交渉がまとまり、インドネシアの傀儡政権の樹立が進んでいる。スカルノは自らの人脈と我々の駐留軍の圧力を利用してオランダ政府を揺さぶり、インドネシア全域における実効支配を確立した。"
 INS_political_events.15.a: "安価な資源だけでなく、有用な味方も得た。"
 INS_political_events.16.t: "[?event_target:INS_invasion_event_invader.GetAdjective]による東インド諸島占領"
 INS_political_events.16.desc: "東インド諸島の[?event_target:INS_invasion_event_invader.GetAdjective]軍がインドネシアの民族主義者と手を組んで我々の植民地当局を揺さぶり、東インド諸島を完全に占領した。オランダ国旗は降ろされ、インドネシアの旗が掲げられている。現地の住民は[?event_target:INS_invasion_event_invader.GetAdjective]の占領軍を好意的に受け入れているようだ。我が植民地帝国の前途は多難だ。"
 INS_political_events.16.a: "彼らは戦闘に勝利しただけで、戦争に勝ったわけではない。"
 INS_political_events.17.t: "[INS.GetName]が独立を宣言"
 INS_political_events.17.desc: "バタヴィアから大本営に報せが届いた。陛下の名の下に群島を統治するため、我々自身が担ぎ上げたスカルノとその一派は、我々の度重なる領土喪失への対応として、[FROM.GetAdjective]共和国の樹立を宣言した。我々がこれに対処できないほど弱っていると考えているようだ。"
 INS_political_events.17.a: "残念ながら、彼らの見立ては正しいかもしれない。"
 INS_political_events.18.t: "タン・マラカがインドネシアに帰還"
 INS_political_events.18.desc: "インドネシアの共産主義者タン・マラカは、この数年、我が政府の信頼厚い顧問を務めてきたが、ただちに離任すると発表した。今や[INS.GetNameDef]が自由な共和国として立つなか、彼は20年以上前、逃亡者として最後に足を踏み入れた祖国へ、ついに戻るつもりだ。彼は亡命先を提供し、活動を続ける自由を認めてくれた我が国に感謝を示し、今は祖国こそが自分のいるべき場所だとだけ語っている。"
 INS_political_events.18.a: "彼の幸運を祈ろう。"
 INS_political_events.19.t: "[HOL.GetName]がヘルフリフ提督を本国へ召還"
 INS_political_events.19.desc: "[1058.GetName]に届いた報せによれば、コンラート・ヘルフリフ提督が本国への帰還を命じられたという。彼は我が海軍の司令官であり、この海域における我が軍の最も有能な将校である。ハーグは本国における差し迫った必要性を理由に挙げているが、詳しい説明はしていない。この地域における我々の立場が安泰とは程遠い中での彼の離任は群島の防衛を手薄にし、スラバヤにある士官室には不満が広がっているらしい。"
 INS_political_events.19.a: "艦隊にとって陰鬱な日だ"
 ### INS - Industrial Events
 INS_industrial_events.4.t: "[FROM.FROM.GetName]の予算再編"
 INS_industrial_events.4.desc: "我々は[FROM.FROM.GetName]のゴム農園を閉鎖し、同地域における新たな工業計画の予算を確保した。"
 INS_industrial_events.4.a: "[FROM.FROM.GetName]に油田を建設しよう"
 INS_industrial_events.4.b: "[FROM.FROM.GetName]にアルミニウム精錬所を建設すべきだ"
 INS_industrial_events.4.c: "生産不足の資源の探査を行うべきだ"
 INS_industrial_events.4.d: "[FROM.FROM.GetName]に石炭鉱山を開こう"
 INS_industrial_events.5.t: "[INS_industrial_events_5_t_scripted]"
 INS_industrial_events_5_t_colonial: "ジャワ銀行の運命"
 INS_industrial_events_5_t_independent: "インドネシア銀行の運命"
 INS_industrial_events.5.desc: "[INS_industrial_events_5_desc_scripted]"
 INS_industrial_events_5_desc_colonial: "ジャワ銀行の準備金が、この10年で最低水準にまで落ち込んでいる。ギルダー通貨の価値は月を追うごとに下落し、プランテーションの所有者たちが外国通貨による支払いを求めている。財政顧問らは、銀行の力だけではこの下落を食い止められないと口を揃えるが、その対策については激しく意見が対立している。"
 INS_industrial_events_5_desc_independent: "インドネシア銀行から、ルピア通貨の価値が直近四半期だけで5分の1近くも下落したと報告があった。スラバヤの米商人たちは、ルピアでの支払いをあからさまに拒み、外貨での支払いを求めるようになっている。財務大臣は、断固たる処置を直ちに講じれば、通貨の崩壊はまだ食い止められると主張している。"
 INS_industrial_events.5.a: "ギルダーの廃止ではなく、立て直しを図るべきだ。"
 INS_industrial_events.5.b: "オランダギルダーに対する東インドギルダーの相場を固定しよう。"
 INS_industrial_events.5.c: "米ドルに対する東インドギルダーの相場を固定しよう。"
 INS_industrial_events.6.t: "より実利的な協定"
 INS_industrial_events.6.desc: "キナ局が我々の提示した条件を受け入れた。熱帯地域の半分でマラリアが猛威をふるい、キニーネの代用品もない状況では、彼らに選択の余地はほとんどなかったのだ。新たに結んだ協定では、我が国から輸出されるキニーネ1グラムあたりに対する我が国の利益が、これまでよりも大幅に引き上げられた。さて、この棚ぼたの利益を、どこに投資すべきだろうか。"
 INS_industrial_events.6.a: "都市部に投資しよう。"
 INS_industrial_events.6.b: "外島を開発しよう。"
 INS_industrial_events.6.c: "軍需産業を強化しよう。"
 # Rubber shipment dispatched
 INS_industrial_events.28.t: "ゴム貨物を発送"
 INS_industrial_events.28.desc: "最後のゴムを積載した輸送船団が出港した。買い手は支払った対価に見合うものを手に入れ、我々の帳簿にはやがて合意された代金が記帳されることになる。今後2年間、この取引の代償は貸借対照表に居座ることになり、大恐慌が我々に何を求めるのか思い起こさせることになる。"
 INS_industrial_events.28.a: "了解した。"
 INS_industrial_events.28.b: "次の積み荷を手配しよう。"
 # Oil shipment dispatched
 INS_industrial_events.36.t: "石油貨物を発送"
 INS_industrial_events.36.desc: "製油所からタンカーが出港し、積み荷は買い手の港へ向かっている。代金は合意済みであり、全額支払われる予定だが、今回の取引は今後2年間、我々の経済に重くのしかかるだろう。これが、不況の時代に世界が我々へ提示する条件なのだ。"
 INS_industrial_events.36.a: "了解した。"
 INS_industrial_events.36.b: "次の積み荷を手配しよう。"
 ### INS - Volksraad
 INS_volksraad_events.2.t: "[HOL.GetLeader]がフォルクスラートの請願を拒否した。"
 INS_volksraad_events.2.desc: "請願は[INS.GetLeader]の承認は得たものの、[HOL.GetLeader]による審査の結果、拒否された。そのため、当面は実施を継続することができなくなった。"
 INS_volksraad_events.2.a: "将来的に、請願が正式に承認されれば、改めて挑戦できるかもしれない。"
 # Generic/Reused
 INS_volksraad_events.10.t: "学校でのインドネシア語使用を求めるフォルクスラート動議"
 INS_volksraad_events.10.desc: "[INS.GetLeader]は、[INS.GetNameDef]にインドネシア語を用いる学校・大学の創設推進を求めたフォルクスラートの請願を承認し、最終承認を仰ぐため[HOL.GetLeader]に送付した。"
 INS_volksraad_events.10.a: "フォルクスラートはしっかり役割を果たしている。"
 INS_volksraad_events.10.b: "とんでもない。拒否せよ！"
 INS_volksraad_events.11.t: "インドネシア語による教育制度が確立される。"
 INS_volksraad_events.11.desc: "請願は[HOL.GetLeader]によって署名され、正式な実施命令が下された。最終的な内容が決定されしだい、請願は実施に移される。"
 INS_volksraad_events.11.a: "フォルクスラートはしっかり役割を果たしている。"
 # Individual laws
 INS_volksraad_events.20.t: "政府機関でのインドネシア語使用を求めるフォルクスラート動議"
 INS_volksraad_events.20.desc: "フォルクスラートを含め、東インドで政府職に就くには、流暢なオランダ語能力が求められる。そのため、フォルクスラートの多くの議員——とりわけ現地人の地域社会代表者から、これが民主主義と呼べるのか疑問が呈されている。彼らは、可能なかぎりインドネシア語話者も政府職に就けるようにすべきだとする動議を提出した。"
 INS_volksraad_events.21.t: "政府機関におけるインドネシア語の使用を認める！"
 INS_volksraad_events.21.desc: "請願は[HOL.GetLeader]によって署名され、正式な実施命令が下された。最終的な内容が決定されしだい、請願は実施に移される。"
 INS_volksraad_events.30.t: "入学枠割当制度の廃止を求めるフォルクスラート動議"
 INS_volksraad_events.30.desc: "[INS.GetLeader]が、[INS.GetNameDef]の入学枠割当制度の廃止を求めるフォルクスラートの請願を承認した。フォルクスラートで長らく続いてきた、この制度の実施や公平性をめぐる議論に終止符を打つためである。請願は、最終承認を仰ぐため[HOL.GetLeader]に送付された。"
 INS_volksraad_events.31.t: "入学枠割当制度が廃止された。"
 INS_volksraad_events.31.desc: "請願は[HOL.GetLeader]によって署名され、正式な実施命令が下された。最終的な内容が決定されしだい、請願は実施に移される。"
 INS_volksraad_events.40.t: "ゴムの輸出税減額を求めるフォルクスラート動議"
 INS_volksraad_events.40.desc: "[INS.GetLeader]が、民間ゴム農園に課せられてきた高い税金の減額を求める請願に署名し、承認した。この税制のもと、政府は長きにわたりゴム取引を独占し、多額の利益を得てきたが、保護貿易政策が国際的に広まり、さほど利益が上がらなくなっている。[INS.GetLeader]は、この税制がもたらす経済的な悪影響は、その税収による利益ではもはや埋め合わせられないとの考えを示した。"
 INS_volksraad_events.40.a: "[INS.GetLeader]の言うことには一理ある。"
 INS_volksraad_events.40.b: "税制は継続する。"
 INS_volksraad_events.41.t: "民間のゴム輸出にかかる税金が引き下げられた。"
 INS_volksraad_events.41.desc: "請願は[HOL.GetLeader]によって署名され、正式な実施命令が下された。最終的な内容が決定されしだい、請願は実施に移される。"
 INS_volksraad_events.60.t: "インドネシア人将校に対する暗黙の階級制限撤廃を求めるフォルクスラート動議"
 INS_volksraad_events.60.desc: "[INS.GetLeader]が、オランダ領東インド陸軍のオランダ人でない将校の階級を制限する不文律を撤廃し、功績に見合う階級を与えられていないインドネシア人将校を昇進させるよう求めたフォルクスラートの請願を承認した。請願は、最終承認を仰ぐため[HOL.GetLeader]に送付された。"
 INS_volksraad_events.61.t: "[INS.GetAdjective]人将校に対する暗黙の階級制限が撤廃"
 INS_volksraad_events.61.desc: "請願は[HOL.GetLeader]によって署名され、正式な実施命令が下された。最終的な内容が決定されしだい、請願は実施に移される。"
 INS_volksraad_events.70.t: "民族主義の旗・象徴の公共掲示の合法化を求めるフォルクスラート動議"
 INS_volksraad_events.70.desc: "[INS.GetLeader]が、[INS.GetNameDef]の公共の場における民族主義の旗や象徴の掲示制限の撤廃を求めるフォルクスラートの請願を承認した。その主な目的は、若手の民族主義者の過激化を抑えることである。[INS.GetLeader]は、この件に関しては防衛的な姿勢をとるべきであり、平和的な民族主義指導者と協力しつつ、革命運動を根絶すべきだと主張している。ただし、最終的な決定権は我々にある。"
 INS_volksraad_events.71.t: "紅白旗の掲示は、今後は違法としない！"
 INS_volksraad_events.71.desc: "請願は[HOL.GetLeader]によって署名され、正式な実施命令が下された。最終的な内容が決定されしだい、請願は実施に移される。"
 INS_volksraad_events.100.t: "非オランダ人住民への教育助成金の支給を求めるフォルクスラート動議"
 INS_volksraad_events.100.desc: "[INS.GetLeader]が、[INS.GetNameDef]のオランダ人以外の住民による教育助成金の申請を認めるよう求めるフォルクスラートの請願を承認した。請願は、最終承認を仰ぐため[HOL.GetLeader]に送付された。"
 INS_volksraad_events.101.t: "[INS.GetAdjective]人が教育助成金を申請できるようになった"
 INS_volksraad_events.101.desc: "請願は[HOL.GetLeader]によって署名され、正式な実施命令が下された。最終的な内容が決定されしだい、請願は実施に移される。"
 ### INS - Dutch Interaction Events
 INS_dutch_events.1.t: "[INS.GetNameDefCap]が我が国の海軍指揮権を要請"
 INS_dutch_events.1.desc: "我々の母国の陥落を受け、[INS.GetNameDef]が我が国に対し、我が国の海軍部隊の指揮権を[INS.GetNameDef]に移譲するよう請願している。彼らは、指揮系統を統一することで、この未曽有の状況下においても効果的に連携が取れると主張している。"
 INS_dutch_events.1.a: "それで大義が強まるなら、譲歩するしかない。"
 INS_dutch_events.1.b: "我が国の艦隊は、ハーグの指揮にのみ従う。"
 INS_dutch_events.2.t: "[HOL.GetNameDefCap]が我々の海軍指揮権移譲の提案を承認"
 INS_dutch_events.2.desc: "[HOL.GetNameDefCap]が、我が国に連合海軍の指揮権を移譲する提案を受け入れた。移譲は順調に進んでおり、[HOL.GetAdjective]と[INS.GetAdjective]双方の将校たちが協力して、太平洋における我々の地位の強化にあたっている。"
 INS_dutch_events.2.a: "我々は共に太平洋を守り抜く。"
 INS_dutch_events.3.t: "[HOL.GetNameDefCap]が我々の海軍指揮権移譲の提案を拒否"
 INS_dutch_events.3.desc: "[HOL.GetNameDefCap]が、物流や管理上の問題を理由に、我々の海軍指揮権統合の提案を拒否した。残念な結果だが、両国の協力体制は、戦争遂行のための他の経路を通じて継続している。"
 INS_dutch_events.3.a: "海軍の影響力を高める別の方法を考えよう。"
 INS_dutch_events.4.t: "[HOL.GetNameDefCap]が[HOL.GetName]・[INS.GetName]合同海軍計画を創設"
 INS_dutch_events.4.desc: "[HOL.GetNameDefCap]が、我々の海上戦力を再編・拡大する共同の取り組みとして、[HOL.GetName]・[INS.GetName]合同海軍計画の創設を発表した。[HOL.GetAdjective]の専門知識と[INS.GetAdjective]の人的資源を結集し、太平洋の新たな防衛網の基盤が築かれるだろう。"
 INS_dutch_events.4.a: "共に生き残るための力強い一歩だ。"
 ### INS - Netherlands–Indonesia Union Events
 INS_union_events.1.t: "[HOL.GetNameDefCap]が[1058.GetName]への政府移転を要請"
 INS_union_events.1.desc: "母国の陥落を受け、[HOL.GetNameDef]が政府と王室を[1058.GetName]に移転することを通知してきた。彼らはその必要性や国家の継続性について述べ、国旗を掲げる地で王国を存続させる必要があると綴っている。"
 INS_union_events.1.a: "この戦争は[1058.GetName]を拠点に継続される。"
 INS_union_events.1.b: "何様のつもりだ！植民地支配を強めようとしているだけではないか！"
 INS_union_events.2.t: "[INS.GetNameDefCap]が移転提案を承諾"
 INS_union_events.2.desc: "[INS.GetNameDefCap]が、我が国の亡命政府を[1058.GetName]に受け入れることに同意した。移転の準備が進められるなか、両政府が各部局や職員の統合を図っている。我々は手を取り合い、東方の地から王国の灯をつないでいくのだ。"
 INS_union_events.2.a: "共通の敵に団結して立ち向かうのだ。"
 INS_union_events.3.t: "[INS.GetNameDefCap]が移転提案を拒否"
 INS_union_events.3.desc: "[INS.GetNameDefCap]が、我々の[1058.GetName]への移転要請を真っ向から拒否した。[INS.GetLeader]は、すでに手一杯である同国に対し、これほどの援助を要求する権利は我々にはないと述べた。"
 INS_union_events.3.a: "どの旗の下に我々が結束しているのか、忘れているようだな。"
 INS_union_events.4.t: "[HOL.GetNameDefCap]が軍を[1058.GetName]に移転"
 INS_union_events.4.desc: "本国から最初の輸送船団が到着した。艦船は将校や兵士で溢れ、かき集めた兵器がぎっしり積まれている。予想どおり、一部の船団は港にたどりつくことができなかった。生き残った者たちや難を逃れた物資が、[1058.GetName]における我々の軍の根幹となるだろう。"
 INS_union_events.4.a: "これだけあれば、旗を掲げるには十分だ。"
 # INS proposed union
 INS_union_events.5.t: "[INS.GetNameDefCap]がオランダ・インドネシア連合を提案"
 INS_union_events.5.desc: "この戦争における我々の劣勢は、世界の誰の目にも明らかだ。何しろ、母国が陥落し、作戦拠点が東方の地へと移されたのだ。[INS.GetName]の閣僚たちが、両国の連携をできるかぎり強化するため、ウィルヘルミナ女王を元首とする連合国家の樹立を提案してきた。この提案を特に歓迎する者はいないと思われるが、我々が生き残るための鍵となるかもしれない。"
 INS_union_events.5.a: "もはや、これに賭けるしかない。女王陛下万歳！"
 INS_union_events.5.b: "これは同意できない。"
 INS_union_events.6.t: "[HOL.GetNameDefCap]が連合案を承諾"
 INS_union_events.6.desc: "閣内での緊急会議の末、[HOL.GetLeader]が[INS.GetAdjective]の提案を受け入れた。布告は簡潔に済まされ、式典も行われなかった。今後、戦争が終結するまで、両国の政府は王権の下で一体となって歩んでいくのだ。"
 INS_union_events.6.a: "両国にとって歴史的な合意だ。"
 INS_union_events.7.t: "[HOL.GetNameDefCap]が連合案を拒否"
 INS_union_events.7.desc: "[HOL.GetNameDef]の議会が連合案を却下した。彼らの意思は固く、今後も協力するが、主権を共有するつもりはないと述べた。"
 INS_union_events.7.a: "連合が成立したとしても、どのみちうまく行かなかっただろう。"
 # HOL proposed union
 INS_union_events.8.t: "[HOL.GetNameDefCap]がオランダ・インドネシア連合を提案"
 INS_union_events.8.desc: "この戦争における我々の劣勢は、世界の誰の目にも明らかだ。何しろ、[HOL.GetNameDef]が陥落し、その作戦拠点が東方の地へと移されたのだ。[HOL.GetAdjective]の指導者たちが、両国の連携をできるかぎり強化するため、ウィルヘルミナ女王を元首とする連合国家の樹立を提案してきた。この提案を特に歓迎する者はいないと思われるが、我々が生き残るための鍵となるかもしれない。"
 INS_union_events.8.a: "やり遂げねばならない。"
 INS_union_events.8.b: "植民地支配を強めようとしているだけだ。"
 INS_union_events.9.t: "[INS.GetNameDefCap]が連合案を承諾"
 INS_union_events.9.desc: "[INS.GetNameDefCap]が我々の提案に合意した。どんな結果がもたらされるかわからないが、戦争遂行に全力を注がねばならない。"
 INS_union_events.9.a: "存続のためには、共に耐え抜かねばならない。"
 INS_union_events.10.t: "[INS.GetNameDefCap]が連合案を拒否"
 INS_union_events.10.desc: "[INS.GetNameDefCap]が連合案を拒否した。[INS.GetAdjective]の国民や指導者たちは、この計画が長い目で見てうまく行くとは考えておらず、権力を手放すことになる提案は一切拒んでいる。"
 INS_union_events.10.a: "連合が成立したとしても、どのみちうまく行かなかっただろう。"
 # Flags
 INS_exile_accepted_flag: "[HOL.GetNameDef]の亡命政府を受け入れている"
 INS_hey_btw_you_are_gonna_die_just_know_that_yeah_tt: "§Rゲームが終了する。§!"
 # Revolution events
 INS_revolution_events.1.t: "[HOL.GetNameDefCap]が共和国の制圧を開始"
 INS_revolution_events.1.desc: "予想どおり、オランダ政府が我々の独立要求を受けて[1058.GetName]に兵を送り込み、報道機関を通じて反共和国のプロパガンダを流している。"
 INS_revolution_events.1.a: "早急に手を打たねば。"
 INS_revolution_events.2.t: "[HOL.GetNameDefCap]が追加の支援を要請"
 INS_revolution_events.2.desc: "[HOL.GetLeader]が我が国の指導者たちとの緊急会議を召集し、東インド諸島の再征服にさらなる支援を求めてきた。紛争に直接参戦することまで求めている。[HOL.GetLeader]は、事態は差し迫っており、オランダ軍だけでは革命軍を押し返せないと述べた。[HOL.GetLeader]は、支援すれば、見返りにボルネオを譲渡すると約束した。"
 INS_revolution_events.2.a: "ボルネオのために協力しよう。"
 INS_revolution_events.2.b: "興味ないな。"
 INS_revolution_events.3.t: "[ENG.GetNameDefCap]がロンドン・バタビア協定に同意"
 INS_revolution_events.3.desc: "[ENG.GetNameDefCap]が紛争への直接参戦に同意し、数個師団をバタビアでの戦闘に派遣した。 ボルネオを手放さねばならないものの、これで戦況は大きく好転する。"
 INS_revolution_events.3.a: "ボルネオはやむを得ない犠牲だ。"
 INS_revolution_events.4.t: "[ENG.GetNameDefCap]がロンドン・バタビア協定を拒否"
 INS_revolution_events.4.desc: "[ENG.GetNameDefCap]が紛争の追加支援を拒否した。これほど事態が緊迫し、見返りまで約束したにもかかわらずだ。[ENG.GetLeader]は、我が国の植民地帝国が存続するほうが彼らにとっても好都合ではあるものの、介入すれば他国にまで紛争が拡大する可能性が高いため、この件は我々自身で対処しなければならないと述べた。"
 INS_revolution_events.4.a: "これはまずいことになった。"
 INS_revolution_events.5.t: "[HOL.GetNameDefCap]が支援を要請"
 INS_revolution_events.5.desc: "オランダ領東インドの革命勢力が[HOL.GetNameDef]からの独立を宣言し、主要都市を占拠した。[HOL.GetLeader]が切迫した様子で我々に接触し、侵攻の態勢が整うまで、軍事支援をしてほしいと要請してきた。"
 INS_revolution_events.5.a: "革命軍が勝てば、我が国の植民地の住民も独立運動を起こすかもしれない。"
 INS_revolution_events.5.b: "興味ないな。"
 INS_revolution_events.6.t: "[ENG.GetNameDefCap]が支援に同意"
 INS_revolution_events.6.desc: "[ENG.GetNameDefCap]が義勇軍と装備を[1058.GetName]に送り、我が国による東インドの支配権奪還を支援することに同意した。"
 INS_revolution_events.6.a: "楽な勝利となりそうだ。"
 INS_revolution_events.7.t: "[ENG.GetNameDefCap]が支援を拒否"
 INS_revolution_events.7.desc: "[ENG.GetNameDefCap]が我が国による東インドの支配権奪還を支援することを拒んだ。紛争地に近接しているにもかかわらず、東インドは自国の関心事ではないと主張している。我々は独力でオランダ領東インド陸軍の軍備を整えるほかないだろう。"
 INS_revolution_events.7.a: "これは容認できない！"
 INS_revolution_events.8.t: "革命派民兵が東インドで蜂起を画策"
 INS_revolution_events.8.desc: "東インドの植民地警察が、インドネシアで拡大しつつある革命運動のメンバーを数名逮捕し、取り調べを行った。どうやら彼らは、国家独立運動の開始に備え、軍事的な基盤を築こうとしていたようだ。確証はないものの、武力革命を画策していた可能性がある。"
 INS_revolution_events.8.a: "厳重に監視しなければ。"
 INS_revolution_events.9.t: "インドネシアの独立宣言"
 INS_revolution_events.9.desc: "今日、ジャワにおいて[INS.GetLeader]が演説を行い、新たに樹立したインドネシア共和国の独立を宣言した。我が国はこの新国家を承認していないが、民兵が各地を占領しており、我々の警察はこれらの地を統制できずにいる。事態を軽視すれば、全面戦争に発展するおそれがある。"
 INS_revolution_events.9.a: "受け入れられない！"
 INS_revolution_events.9.b: "このことに力を割く価値はない。そこまで独立したいなら、好きにさせればよい。"
 #INS_revolution_events.10.t: ""
 #INS_revolution_events.10.desc: ""
 #INS_revolution_events.10.a: ""
 INS_revolution_events.11.t: "オランダ領東インド軍が民兵の作戦を阻止"
 INS_revolution_events.11.desc: "共和国側の民兵が、[?event_target:INS_temp_occupied_state.GetName]を占領すべく軍事行動を開始した。しかし、東インドに駐留する我々の勇敢な兵士たちが民兵部隊を撃退し、我が国の同地域に対する支配は完全に維持されている。"
 INS_revolution_events.11.a: "今回も[HOL.GetNameDef]の勝利だ。"
 INS_revolution_events.12.t: "民兵が[?event_target:INS_temp_occupied_state.GetName]占領を画策"
 INS_revolution_events.12.desc: "共和国側の民兵が、[?event_target:INS_temp_occupied_state.GetName]を占領すべく軍事行動を開始した。最終的には、我が国の警察や兵士によって事態は収拾されたものの、この出来事に対し[?event_target:INS_temp_occupied_state.GetName]では反発が起こっている。多くの住民が民兵を支持し、[HOL.GetAdjective]政府に対して公然と反対の声を上げているのだ。"
 INS_revolution_events.12.a: "これ以上激化させるわけにはいかない。"
 INS_revolution_events.14.t: "民兵が[?event_target:INS_temp_occupied_state.GetName]を占領"
 INS_revolution_events.14.desc: "我が国の植民地警察や兵士の必死の努力にもかかわらず、共和国側の民兵が軍事行動により[?event_target:INS_temp_occupied_state.GetName]を占領した。植民地警察と兵士は撤退を余儀なくされ、民兵の抵抗により同地域の統治が不可能な状態にあると宣言した。民兵をこのまま好きにさせていては、この素晴らしい植民地を永遠に失いかねない。"
 INS_revolution_events.14.a: "とんでもないことだ！"
 INS_revolution_no_effect_tt: "効果なし"
 INS_revolution_events.19.t: "東インドの和平交渉"
 INS_revolution_events.19.desc: "[HOL.GetLeader]が、和平合意の可能性を協議するため、[INS.GetLeader]との会談に呼び出された。[INS.GetLeader]は、あまりにも多くの命が失われたと述べ、わずかな変更を除き国境を現状のまま維持し、恒久的に停戦する二国家解決を提案した。"
 INS_revolution_events.19.a: "合意するしかない。これ以上の犠牲は出せない。"
 INS_revolution_events.19.b: "そこまで平和を望むなら、降伏したらどうだ！"
 INS_revolution_events.20.t: "[HOL.GetNameDefCap]が二国家解決に同意！"
 INS_revolution_events.20.desc: "[INS.GetLeader]が[HOL.GetLeader]との会談を終え、朗報を持ち帰った。両国が二国家解決に同意し、我が国は、新たな国境に従い直ちに部隊の移動を開始することになったのだ。同胞のインドネシア人を残していかねばならないことは悔やまれるが、戦争終結の決断は、最終的には最善の選択である。"
 INS_revolution_events.20.a: "ようやく惨事に終止符が打たれた。"
 INS_revolution_events.21.t: "[HOL.GetNameDefCap]が停戦を拒否"
 INS_revolution_events.21.desc: "[INS.GetLeader]と[HOL.GetLeader]の会談は思い通りには進まなかった。双方が怒りをあらわにし、歩み寄ることを拒んだため、途中で打ち切りとなった。"
 INS_revolution_events.21.a: "あとどれほどの命を失わねばならないのか。"
 INS_revolution_events.22.t: "[HOL.GetNameDefCap]が支援を要請"
 INS_revolution_events.22.desc: "[HOL.GetLeader]が東インドの情勢について協議するため、アムステルダムで[FRA.GetLeader]との会談を開くよう求めた。会談の中で[HOL.GetLeader]は、革命勢力がオランダ軍を圧倒する速度で民兵を武装化しており、[HOL.GetNameDef]が植民地の覇権を失いかねない事態に陥っていると述べた。[HOL.GetLeader.GetHeShe]は我々に、オランダ側として紛争に正式に参戦し、師団をバタビアに派遣して東インドの再征服を支援するよう要請した。その見返りとして、秩序が回復した暁には、我が国はスマトラ島北東部の領有権を得ることになる。"
 INS_revolution_events.22.a: "支援は高くつくが、スマトラが手に入るなら損はしないだろう。"
 INS_revolution_events.22.b: "過大な要求だ。"
 INS_revolution_events.23.t: "[FRA.GetNameDefCap]が支援に合意！"
 INS_revolution_events.23.desc: "[FRA.GetNameDefCap]が我々の支援要請に応じ、直ちに援軍として多数のフランス師団をバタビアに派遣した。"
 INS_revolution_events.23.a: "これで勝算は我々に傾いた。"
 INS_revolution_events.24.t: "[FRA.GetNameDefCap]が支援を拒否"
 INS_revolution_events.24.desc: "[FRA.GetNameDefCap]が、緊迫した事態にもかかわらず、革命鎮圧の支援を拒んだ。早急に再軍備を進めなければ、近いうちに数で圧倒されてしまう。"
 INS_revolution_events.24.a: "まずいことになった。"
 INS_revolution_events.25.t: "インドネシアの戦争終結"
 INS_revolution_events.25.desc: "[HOL.GetAdjective]軍が民兵の主要拠点を壊滅させ、共和国政府を転覆させた。共和国側の上層部や指揮官は逮捕され、東インド政府は旧共和国領で統治体制の立て直しを進めている。支援の見返りとして、約束されていた領土が我が国に譲渡された。"
 INS_revolution_events.25.a: "素晴らしいな！"
 INS_revolution_events.26.t: "インドネシアの戦争終結"
 INS_revolution_events.26.desc: "[HOL.GetAdjective]軍と共和国の民兵の戦闘は双方がまったく想定しなかったほど長期化し、[HOL.GetLeader]は二国家解決による和平合意への署名に合意した。しかし、我が国が協定の責務を果たしたことには変わりないため、[HOL.GetLeader]は我が国に約束どおり領土を譲渡することを認めた。"
 INS_revolution_events.26.a: "興味深い展開だ。"
 INS_revolution_events.27.t: "インドネシアの戦争終結"
 INS_revolution_events.27.desc: "[HOL.GetAdjective]軍と共和国の民兵の戦闘は、双方がまったく想定しなかったほど長期化した。[HOL.GetNameDef]の努力や我が国の軍事介入にもかかわらず、圧倒的な数の民兵やゲリラ戦術により、紛争は戦況が共和国側に大きく傾いたまま膠着状態に陥っている。これを受けて[HOL.GetLeader]は今日、和平合意に署名し、共和国側に有利な二国家解決を受け入れたと発表した。東インドのかつての栄光はもはや見る影もない。[HOL.GetLeader]は、紛争で敗北したため、軍事支援と引き換えに約束した領土を我が国に引き渡すことができないと述べた。"
 INS_revolution_events.27.a: "こんなバカげたことがあるか！"
 INS_revolution_events.28.t: "東インドの陥落"
 INS_revolution_events.28.desc: "[HOL.GetNameDef]による莫大な軍事支出や、我が国の直接参戦にもかかわらず、我々の軍は東インドの圧倒的な民兵の数に圧倒され、すべての主要都市を占領された。オランダ政府は転覆し、降伏を余儀なくされた。"
 INS_revolution_events.28.a: "領土の約束はどうなるのだ！"
 INS_revolution_events.29.t: "東インドの陥落"
 INS_revolution_events.29.desc: "我々が死力を尽くしたにもかかわらず、東インドの革命勢力は主要都市を掌握し、植民地政府を内側から崩壊させた。我が国の将軍は捕らえられ、通信網も遮断された。もはや、敗北を受け入れるほか道はない。"
 INS_revolution_events.29.a: "悲劇だ。"
 INS_revolution_events.30.t: "[INS.GetLeader]が局地的停戦を提案"
 INS_revolution_events.30.desc: "[INS.GetLeader]が[FROM.GetName]での局地的停戦を提案した。合意すれば[FROM.GetName]から部隊を撤収し、我が国の部隊がこの地域を再び掌握することを認めると約束した。ただし、その条件として、我が国は大規模な軍事作戦を一時的に延期しなければならず、革命勢力に作戦を練る時間を与えてしまうことになる。"
 INS_revolution_events.30.a: "提案に応じよう。"
 INS_revolution_events.30.b: "断る。[FROM.GetName]は力ずくで奪還する。"
 INS_revolution_events.31.t: "[HOL.GetNameDefCap]が[FROM.GetName]での停戦に合意"
 INS_revolution_events.31.desc: "停戦交渉はうまくまとまり、[HOL.GetLeader]が我々の提示した条件を受け入れた。我々は[FROM.GetName]の民兵指揮官に対し、直ちに部隊を撤退させるよう命じた。"
 INS_revolution_events.31.a: "約束を守ってくれるといいが。"
 INS_revolution_events.32.t: "[HOL.GetNameDefCap]が停戦を拒否"
 INS_revolution_events.32.desc: "停戦交渉は思いどおりには進まなかった。[HOL.GetLeader]は合意への署名を拒み、妥協点が見出される前に交渉を打ち切った。"
 INS_revolution_events.32.a: "これは容認できない！"
 INS_revolution_events.33.t: "[INS.GetNameDefCap]が仲裁を要請"
 INS_revolution_events.33.desc: "インドネシアの共和主義派がオランダとの紛争解決の仲裁を正式に要請してきた。現地の顧問団によれば、事態は急速に悪化しており、オランダの軍事行動が続けば、民族主義者がソビエトに接近するおそれがあるという。オランダはヨーロッパにおける重要な同盟国だが、東南アジアの政治情勢を見過ごすわけにはいかない。我が国が傍観したためにインドネシアが共産主義に傾くようなことになれば、それは我々の失態である。"
 INS_revolution_events.33.a: "仲裁団を派遣しろ。"
 INS_revolution_events.33.b: "オランダとの関係を損なうわけにはいかない。"
 INS_revolution_events.34.t: "[FROM.GetNameDefCap]が仲裁を承諾"
 INS_revolution_events.34.desc: "ワシントンが、我々の政府とオランダの仲裁役を引き受けた。アメリカの特使がすでに現地へ向かっており、正式な停戦が提案される見通しだ。これは絶好の機会である。世界屈指の強国が交渉を後押しするとなっては、オランダも決断を先送りしたり、武力に訴えたりすることは容易にはできまい。交渉の場では我々は断固たる姿勢を貫き、交渉を得意とするアメリカの手腕に任せるべきだ。"
 INS_revolution_events.34.a: "オランダが賢明な判断をすることを願おう。"
 INS_revolution_events.35.t: "[USA.GetNameDefCap]が仲裁を表明"
 INS_revolution_events.35.desc: "アメリカがインドネシア問題に介入してきた。ワシントンは中立的な仲裁役を果たすと述べているが、その意図は明白だ。我々が彼らの納得する形で紛争を解決できなければ、彼らはその強大な影響力を我々に対して行使するだろう。我が国の交渉役は慎重に立ち回らねばならない。アメリカの機嫌を損ねる余裕は、我々にはない。"
 INS_revolution_events.35.a: "我々は我々のやり方で解決する。"
 INS_revolution_events.36.t: "[FROM.GetNameDefCap]が介入を拒否"
 INS_revolution_events.36.desc: "アメリカが我々の仲裁要請を拒否した。ワシントンは我々の民族自決の戦いを支援するよりも、ヨーロッパの同盟国に味方することを選んだのだ。我々は孤立無援だ。これは手痛い打撃だが、そもそも我々の革命運動は、外国の列強から自由を授かろうという目論みで始まったわけではない。"
 INS_revolution_events.36.a: "アメリカなしでこの戦争に勝ってみせる。"
 INS_revolution_events.37.t: "[USA.GetNameDefCap]からの最後通牒"
 INS_revolution_events.37.desc: "アメリカがついに痺れを切らせた。ワシントンが最後通牒を突きつけ、インドネシアにおける軍事作戦をすべて即時停止し、インドネシアの主権を認めるよう要求してきた。その脅しは極めて露骨だ。アメリカと公然と対立すれば、国際社会における我が国の立場は弱まり、その経済的影響に耐えることはできないだろう。将軍たちは、作戦にはまだ勝ち目があると主張しているが、そのためにどれほどの代償を払うことになるだろうか？"
 INS_revolution_events.37.a: "従うほかない。"
 INS_revolution_events.37.b: "インドネシアは我々のものだ。手放すものか。"
 INS_revolution_events.38.t: "オランダが譲歩"
 INS_revolution_events.38.desc: "戦いは終わった。オランダ政府がアメリカの最後通牒を受け入れ、我が国の主権を承認したのだ。350年にわたる植民地支配がついに終わり、戦場だけでなく、世界最強の大国の後ろ盾を得た交渉の場においても終止符が打たれたのだ。この共和国はついに、真に完全に我々のものとなった。"
 INS_revolution_events.38.a: "独立万歳！"
 INS_revolution_events.39.t: "オランダが拒否"
 INS_revolution_events.39.desc: "予想に反して、オランダがアメリカの最後通牒を拒否した。オランダの将軍たちは、ワシントンが実力行使に出る前に、戦争に勝利できると考えているに違いない。だがそれは間違いだ。アメリカが我々の大義を公に支持した今、力の均衡は決定的に変わった。かかってくるがいい。我々はもはや単独で戦っているわけではない。"
 INS_revolution_events.39.a: "世界中が我々の味方だ。"
 INS_revolution_events.40.t: "オランダが我々の条件を承諾"
 INS_revolution_events.40.desc: "ハーグが我々の最後通牒を受け入れた。これでインドネシアに駐留するオランダ軍は撤退し、主権がインドネシア共和国に移譲されることになる。紛争が起きたことは残念だが、満足のいく結末だ。この地域における我が国の利益も、もはや維持不可能な植民地体制を支えるよりも、インドネシアが安定した独立国家となるほうが、はるかに安泰というものだ。"
 INS_revolution_events.40.a: "妥当な落としどころだ。"
 INS_revolution_events.41.t: "オランダが我々の通告を無視"
 INS_revolution_events.41.desc: "ハーグが我々の最後通牒を真っ向から拒否した。インドネシアに駐留するオランダ軍は、アメリカの要求を公然と無視して作戦を継続している。これは致命的な判断ミスだ。アジアで植民地戦争をしておきながら、ヨーロッパで我が国の支援をあてにするなど、虫が良すぎる。我々は実力行使に踏み切らざるを得ない。"
 INS_revolution_events.41.a: "ならばそうしよう。"
 INS_revolution_events.42.t: "最後の賭け"
 INS_revolution_events.42.desc: "バタビアの情報機関からの報告によれば、共和国はこれまでとは比較にならないほど大規模な作戦の準備を進めている。ジャワ島に突入し、我々の通信インフラをすべて破壊する不安定化工作の準備をしているとみられ、成功すれば彼らの勝利が事実上確定する。しかし、この作戦は極めて危険であり、彼らはほぼすべての資源をこれに投入しなければならない。我が国の将軍たちの試算によれば、彼らがこの態勢を維持できるのは2年程度であり、容易に取りやめることもできないようだ。十分な期間食い止めることができれば、彼らの政府と革命を熟れたトマトのように握りつぶせるだろう。"
 INS_revolution_events.42.a: "こうして、最後の戦いが始まる。"
 INS_revolution_events.43.t: "[FROM.GetName]に民兵基地を設立"
 INS_revolution_events.43.desc: "[FROM.GetName]での我々の取り組みは成功を収め、現地の民兵指導者たちは、時が来れば行動を起こす準備ができていると確認した。"
 INS_revolution_events.43.a: "この取り組みを継続しなければならない。"
 # Chaos Events
 INS_chaos_events.1.t: "スラバヤの戦闘"
 INS_chaos_events.1.desc: "独立宣言後、スラバヤの情勢は揺らいでいる。今日、親オランダ派の一団が旧ヤマトホテルの屋上に旧植民地の旗を掲げた。これに対し、地元の青年活動家たちが建物に突入して旗を引きずり下ろし、代わりにインドネシアの紅白旗を掲げた。この一件は、無秩序で激しい戦闘へと発展している。"
 INS_chaos_events.1.a: "当然の行動だ！"
 INS_chaos_events.1.b: "戦闘の中止を命じろ。事態の悪化は避けねばならない。"
 INS_chaos_events.2.t: "社会主義政党が合併"
 INS_chaos_events.2.desc: "インドネシアの2大社会主義政党——アミル・シャリフディン率いる党と、スタン・シャフリール率いる党が今日、合併を発表し、ひとつのインドネシア社会党を結成した。合併により政党の政治的影響力が大幅に高まり、我々の政権を脅かすおそれがある。"
 INS_chaos_events.2.a: "好きにやらせておけ。"
 INS_chaos_events.2.b: "権力争いをする暇などない。戒厳令を出せ！"
 INS_chaos_events.3.t: "スカルノの暗殺に失敗"
 INS_chaos_events.3.desc: "今日、オランダ兵がスカルノの命を狙って、彼の車に発砲した。幸い彼は車に乗っていなかったものの、運転手が重傷を負った。暗殺は失敗に終わったが、今後も、オランダ兵やインドネシアの反対勢力から命を狙われることは明白だ。"
 INS_chaos_events.3.a: "秩序を取り戻さねば！"
 INS_chaos_events.4.t: "スカルノの暗殺"
 INS_chaos_events.4.desc: "今日、インドネシアにとって悲劇的な事件が起こった。スカルノの暗殺が再び企てられ、スカルノが命を落としたのだ。後継者をめぐって混乱が起こるようなことがあってはならない。秩序をすみやかに回復しなければ、共和国が崩壊してしまう。"
 INS_chaos_events.4.a: "ハッタ副大統領に引き継がせよう。"
 INS_chaos_events.4.b: "社会党に引き継がせよう。"
 INS_chaos_events.4.c: "共和国を廃止せよ。タン・マラカが我々を勝利へ導いてくれる！"
 # Loyalist Events
 INS_loyalist_events.1.t: "[INS.GetLeader]がヘンリー・ヴィンケルマンの派遣を要請"
 INS_loyalist_events.1.desc: "[INS.GetLeader]が、世界各地で起きている紛争や、[INS.GetNameDef]が置かれている危うい立場について、我々に連絡してきた。[INS.GetLeader]は植民地の安全を確保するため、王立オランダ領東インド陸軍の元司令官ヘンリー・ヴィンケルマンを[INS.GetNameDef]に正式に再派遣することを提案している。"
 INS_loyalist_events.1.a: "ただちに彼を派遣しよう。"
 INS_loyalist_events.1.b: "ヘンリー・ヴィンケルマンは本国に必要な人物だ。"
 INS_loyalist_events.2.t: "[HOL.GetLeader]がヘンリー・ヴィンケルマンの派遣に同意"
 INS_loyalist_events.2.desc: "[INS.GetLeader]が[HOL.GetLeader]との会談を終え、[HOL.GetNameDef]から戻った。会談はうまくいき、[HOL.GetLeader]が状況を理解し、ヘンリー・ヴィンケルマンを直ちに派遣することに同意した。ヴィンケルマンは現在[1058.GetName]へ向かっており、そこで我々の指示を待つことになる。"
 INS_loyalist_events.2.a: "非常に心強い。"
 INS_loyalist_events.3.t: "[HOL.GetLeader]がヘンリー・ヴィンケルマンの派遣を拒否"
 INS_loyalist_events.3.desc: "[INS.GetLeader]が[HOL.GetLeader]との会談を終え、[HOL.GetNameDef]から戻った。残念ながら、ヘンリー・ヴィンケルマンは東インドに派遣されないことになった。我々は自力で防衛しなければならない。"
 INS_loyalist_events.3.a: "早急に別の作戦を考えねば。"
 INS_henri_winkelman_tt: "ヘンリー・ヴィンケルマンの派遣が拒否された"
 # MALAYA CHAIN - Independent Malaya
 INS_loyalist_events.4.t: "[FROM.GetNameDefCap]が統一を提案"
 INS_loyalist_events.4.desc: "[FROM.GetAdjective]の代表団が[ROOT.Capital.GetCapitalVictoryPointName]に到着し、両国の統一を提案した。彼らは両国民ともにマレーをルーツとしていると述べ、両国の国境はそこに住む人々ではなく、ヨーロッパの植民地行政官によって定められたものだと指摘した。この提案では、両政府を解体し、ひとつの国家として再編することが計画されている。"
 INS_loyalist_events.4.a: "提案を受け入れよう。"
 INS_loyalist_events.4.b: "断る。"
 INS_loyalist_events.5.t: "[FROM.GetNameDefCap]が統一を受諾"
 INS_loyalist_events.5.desc: "我が国の外交官が朗報を携え[FROM.Capital.GetCapitalVictoryPointName]から戻った。[FROM.GetAdjective]政府が我が国の提案を受け入れたのだ。すでに当局の者が、我々の政権下に領土を統合する準備を進めているという。"
 INS_loyalist_events.5.a: "力を合わせて、我々は強くなる！"
 INS_loyalist_events.6.t: "[FROM.GetNameDefCap]が統一を拒絶"
 INS_loyalist_events.6.desc: "我が国の外交官が何の成果もなく[FROM.Capital.GetCapitalVictoryPointName]から戻った。[FROM.GetAdjective]政府は提案に耳を傾けようとせず、その根拠もほとんど示さなかった。我が国の代表団は挨拶もそこそこに、体よく送り返された。"
 INS_loyalist_events.6.a: "損をするのは向こうだ"
 # MALAYA CHAIN - Subject Malaya (Overlord receives)
 INS_loyalist_events.7.t: "[FROM.GetNameDefCap]が[MAL.GetName]の国民投票を要求"
 INS_loyalist_events.7.desc: "[FROM.GetNameDefCap]が、国家統合について[MAL.GetName]で国民投票を実施することを認めるよう正式に要請してきた。同国の大使は、投票結果の見通しを率直に示し、両国のマレー人は自分たちをひとつの国民とみなしていると述べた。投票の実施を認めれば、[MAL.GetName]を失うことが決まったようなものだ。"
 INS_loyalist_events.7.a: "国民に決めさせよう。"
 INS_loyalist_events.7.b: "投票は認めない。"
 # MALAYA CHAIN - Subject Malaya (MAL receives after overlord agrees)
 INS_loyalist_events.8.t: "[FROM.GetNameDefCap]が統合に関する国民投票を承認"
 INS_loyalist_events.8.desc: "我々の宗主国が、[FROM.FROM.GetNameDef]が我が国で国民投票を実施することを許可した。[FROM.FROM.GetAdjective]の運動員が多数到着し、投票は今月中に行われる予定だ。国民に対する問いは極めて単純だ——[FROM.FROM.GetNameDef]と統合したいか、それとも、今のままがよいかだ。"
 INS_loyalist_events.8.a: "統合しよう。"
 INS_loyalist_events.8.b: "今のままのほうがよい。"
 # MALAYA CHAIN - Overlord informed of MAL's choice
 INS_loyalist_events.9.t: "[FROM.GetNameDefCap]が統合に反対"
 INS_loyalist_events.9.desc: "[FROM.GetName]の国民投票が終了し、[FROM.GetAdjective]国民は我々の政権下に留まることを選んだ。[FROM.FROM.GetAdjective]の運動員たちは去っていった。"
 INS_loyalist_events.9.a: "予想通りだ"
 INS_loyalist_events.10.t: "[FROM.GetNameDefCap]が統合に賛成"
 INS_loyalist_events.10.desc: "[FROM.GetName]の国民投票が終了し、[FROM.FROM.GetNameDef]との統合を支持する圧倒的民意が示された。同地の行政官によれば、これは予想どおりの結果だという。我々には、この結果を尊重する義務がある。"
 INS_loyalist_events.10.a: "約束しよう"
 # MALAYA CHAIN - INS receives result
 INS_loyalist_events.11.t: "マラヤの国民投票で勝利"
 INS_loyalist_events.11.desc: "国民投票の結果、[MAL.GetName]の人々が我が国との統合に賛成した。[MAL.GetAdjective]の政府関係者が権限の委譲に向け、我が国と協力している。これで、マレー圏の国境がひとつ減ることになる。"
 INS_loyalist_events.11.a: "よくぞ祖国へ戻ってきてくれた。"
 INS_loyalist_events.12.t: "マラヤが統合を拒否"
 INS_loyalist_events.12.desc: "[MAL.GetName]と統合するという我々の提案は拒否された。[MAL.GetAdjective]政府や宗主国が反対したのだ。もっと機が熟してから、改めて提案することにしよう。"
 INS_loyalist_events.12.a: "諦めるつもりはない。"
 INS_loyalist_events.13.t: "[FROM.GetNameDefCap]がシンガポールをめぐり妥協案を提示"
 INS_loyalist_events.13.desc: "[FROM.GetAdjective]政府がシンガポールに関して提案を持ち掛けてきた。同島がマレー圏の一部であることを理由に、その主権を要求してきたのだ。その見返りとして、港湾とその軍事施設の継続的な使用や、現在認められている資源採掘権を保証するという。"
 INS_loyalist_events.13.a: "公正な提案だ。"
 INS_loyalist_events.13.b: "シンガポールは売り物ではない。"
 INS_loyalist_events.14.t: "シンガポールに関する妥協案を受け入れ"
 INS_loyalist_events.14.desc: "妥協案は受け入れられた。今後、シンガポールは我が国の支配下に入り、旧来の支配者は港湾の商業・軍事利用を継続することになる。アジア屈指の要港で、今や我が国の旗が翻っている。"
 INS_loyalist_events.14.a: "海峡は我々のものだ。"
 INS_loyalist_events.15.t: "シンガポールに関する妥協案を拒否"
 INS_loyalist_events.15.desc: "我々の妥協案は拒否された。シンガポールの支配者たちは、いかなる条件でも同島を手放すつもりはないようだ。主権の維持以外のあらゆる見返りを提示したが、彼らはそれでも頷かなかった。"
 INS_loyalist_events.15.a: "ならばそうしよう。"
 INS_loyalist_events.16.t: "[FROM.GetNameDefCap]がセイロンの譲渡を要請"
 INS_loyalist_events.16.desc: "[FROM.GetAdjective]政府が、セイロンの譲渡を正式に要請してきた。同国の外交官は、同島とマレー圏の長年の交易関係や民族的なつながりを根拠として挙げている。率直に言って説得力に欠ける主張だが、[FROM.GetNameDef]はいまや強国だ。要請を真剣に検討せざるを得ない。"
 INS_loyalist_events.16.a: "よかろう、譲渡しよう。"
 INS_loyalist_events.16.b: "セイロンはこの先も我々のものだ。"
 INS_loyalist_events.17.t: "セイロンの譲渡"
 INS_loyalist_events.17.desc: "セイロンの移譲が完了した。我が国の行政当局はすでに同島への職員の派遣を開始しており、引き渡しは支障なく進んでいる。これで我が国は、海峡の両岸に拠点を持つことになる。"
 INS_loyalist_events.17.a: "素晴らしい"
 INS_loyalist_events.18.t: "セイロンの譲渡要請、拒否される"
 INS_loyalist_events.18.desc: "我が国のセイロン譲渡要請が拒否された。現在の支配者は同島を手放すつもりはなく、我が国の外交官からも、これ以上協議しても意味がないと報告があった。"
 INS_loyalist_events.18.a: "またの機会にするか。"
 INS_loyalist_events.19.t: "[FROM.GetNameDefCap]がパプアの国民投票を要求"
 INS_loyalist_events.19.desc: "[FROM.GetNameDefCap]が、東パプアでの国民投票の実施を認めるよう要求してきた。国境の[FROM.GetAdjective]側では、ジャングルを新たな道路が貫き、政府派遣の医師が常駐する診療所や、現地の言語で教える学校が整備されている。一方、我が国の側では、前任の総督がポートモレスビーを訪れたのは、3年間でたった2回に過ぎない。[FROM.GetAdjective]大使は、それ以上多くを語る必要はなかった。"
 INS_loyalist_events.19.a: "投票を認めよう。"
 INS_loyalist_events.19.b: "投票は認めない。"
 INS_loyalist_events.20.t: "パプアの国民投票を承認"
 INS_loyalist_events.20.desc: "オーストラリアが国民投票の実施に同意した。東パプアのすべての地区で、同様の投票結果となった。島の西半分に対する我が国の投資実績は、どんな宣伝ポスターよりも説得力があった。"
 INS_loyalist_events.20.a: "ついに島がひとつとなった。"
 INS_loyalist_events.21.t: "パプアの国民投票を拒否"
 INS_loyalist_events.21.desc: "オーストラリアが国民投票を拒否した。ポートモレスビーの総督は、我々の要求をオーストラリアの主権に対する侮辱だとする声明を発表した。パプアの人々は意思を問われることすらなかった。"
 INS_loyalist_events.21.a: "覚えておけよ。"
 INS_loyalist_events.22.t: "[FROM.GetNameDefCap]が東ティモールを要求"
 INS_loyalist_events.22.desc: "[FROM.GetAdjective]政府が東ティモールの放棄を正式に要求してきた。同国の大使は、我が国が同地に置く駐屯部隊が200人にも満たないことや、リスボンが長年にわたりこの地域にほとんど投資していないことを指摘し、我々は一体何を保有しているつもりなのかと問いかけた。"
 INS_loyalist_events.22.a: "争ってまで領有する価値はない。"
 INS_loyalist_events.22.b: "ティモールは今もこの先も我々のものだ。"
 INS_loyalist_events.23.t: "東ティモールを放棄"
 INS_loyalist_events.23.desc: "東ティモールの支配者たちが駐屯部隊の撤退と植民地政府の撤収を開始した。まもなく島全域が[INS.GetAdjective]の支配下に入ることになる。"
 INS_loyalist_events.23.a: "そうあるべきだ"
 INS_loyalist_events.24.t: "東ティモールの放棄要求を拒否"
 INS_loyalist_events.24.desc: "ディリの植民地総督が自ら書簡を送り、我々の要求を拒否した。東ティモールは今後も自国政府の主権領土だと主張している。内閣がこの問題をさらに進める意向であれば、参謀本部のほうですでに計画は練ってある。"
 INS_loyalist_events.24.a: "準備を開始しろ。"
 INS_loyalist_events.25.t: "[FROM.GetNameDefCap]が統一を提案"
 INS_loyalist_events.25.desc: "[FROM.GetAdjective]の代表団が我々両共和国の統合案を携えて到着した。彼らは、両国民のオーストロネシアのルーツは、我々を分かつ植民地の境界線よりもはるかに歴史が長いとし、群島全域にまたがる単一国家が誕生すれば、東南アジア一の強国になるだろうと主張している。提案を受け入れた場合、我が国の政府は解体され、彼らの政府に組み込まれることになる。"
 INS_loyalist_events.25.a: "受け入れよう"
 INS_loyalist_events.25.b: "苦労の末に築いた国を手放すつもりはない。"
 INS_loyalist_events.26.t: "[FROM.GetNameDefCap]が統一を受諾"
 INS_loyalist_events.26.desc: "[FROM.GetAdjective]政府が我々の提案を受け入れた。統合の手続きに入るべく、両国の当局関係者がすでに調整を進めている。アチェからルソン、ボルネオからミンダナオに至るまで、我々は今やマレー群島全域にまたがる大国家となった。"
 INS_loyalist_events.26.a: "新たな時代の幕開けだ。"
 INS_loyalist_events.27.t: "[FROM.GetNameDefCap]が統一を拒絶"
 INS_loyalist_events.27.desc: "[FROM.GetAdjective]政府が我々の提案を拒否した。彼らは多大な犠牲を払い、戦いの末にようやく独立したばかりであり、他国に主権を譲り渡すなど到底できなかったのだ。提案は棚上げとなった。"
 INS_loyalist_events.27.a: "残念だ。"
 INS_loyalist_events.28.t: "[FROM.GetNameDefCap]が[PHI.GetName]の国民投票を要請"
 INS_loyalist_events.28.desc: "[FROM.GetNameDefCap]が、統合の是非について[PHI.GetName]で国民投票を実施することを認めるよう正式に要請してきた。同国の外交官は、両国民がオーストロネシアのルーツを持つことや、両国民を分断する植民地の境界線が人為的なものであることを強く主張している。投票が実施されれば、おそらく[FROM.GetNameDef]の望みどおりの結果になるだろう。"
 INS_loyalist_events.28.a: "国民に判断を委ねるべきだ。"
 INS_loyalist_events.28.b: "問題外だ"
 INS_loyalist_events.29.t: "統合の是非を問う国民投票を承認"
 INS_loyalist_events.29.desc: "[FROM.FROM.GetNameDefCap]が、同じオーストロネシアに起源を持つことを根拠に、我々両国の統合を提案した。我々の宗主国が統合の是非を問う国民投票の実施を同国に許可し、[FROM.FROM.GetAdjective]の運動員が我が国に続々と到着している。投票の結果しだいで、我が共和国が[FROM.FROM.GetNameDef]に統合されるか、現在の体制が維持されるのかが決まることになる。"
 INS_loyalist_events.29.a: "興味深い提案だ。"
 INS_loyalist_events.29.b: "絶対にダメだ。"
 INS_loyalist_events.30.t: "[FROM.GetNameDefCap]が統合に反対"
 INS_loyalist_events.30.desc: "投票の集計が終わり、[FROM.FROM.GetAdjective]の運動員が追い返された。[FROM.GetAdjective]国民は、現状維持を選んだ。[FROM.Capital.GetCapitalVictoryPointName]では、「独立」という言葉は今なお重い意味を持っているようだ。"
 INS_loyalist_events.30.a: "この件はこれで終わりだ。"
 INS_loyalist_events.31.t: "[FROM.GetNameDefCap]が統合に賛成"
 INS_loyalist_events.31.desc: "投票の集計が終わった。[FROM.GetAdjective]国民は、圧倒的な大差で我々ではなく[FROM.FROM.GetNameDef]を選んだ。我々の行政官には、早くも引き継ぎ開始の通達が下っている。"
 INS_loyalist_events.31.a: "国民が声を上げた"
 INS_loyalist_events.32.t: "[PHI.GetNameDefCap]が統合に賛成"
 INS_loyalist_events.32.desc: "[PHI.GetAdjective]における国民投票は、我が国の望んだ結果となった。同国政府は結果を受け入れ、権限の移譲を進めるべく我が国の外務省とのやり取りを開始した。"
 INS_loyalist_events.32.a: "ついにひとつになった。"
 INS_loyalist_events.33.t: "[PHI.GetNameDefCap]が統合を拒否"
 INS_loyalist_events.33.desc: "[PHI.GetAdjective]政府が統合の提案を拒否した。同国議会はろくに審議にもかけず提案を否決した。東南アジアで最も偉大な国家の一員となる機会を与えてやったというのに、彼らはそれを無下にした。"
 INS_loyalist_events.33.a: "計画に遅れが出ただけだ。"
 INS_communist_events.6.t: "[FROM.GetAdjective]の工作員が[ROOT.GetName]で扇動"
 INS_communist_events.6.desc: "我が国の諜報機関が、かねてよりの疑念が事実であることを確認した。[FROM.GetNameDefCap]が我が国で継続的な転覆工作を展開し、過激派組織へ資金を提供したり、煽動的なパンフレットを配布したり、労働者のストライキを組織したりしていたのだ。工作員は労働組合や農村協同組合に潜り込み、今や公然と政府打倒を呼び掛けている。もはや一刻の猶予も許されない。手遅れになるまえに、断固たる措置を講じる必要がある。"
 INS_communist_events.6.a: "断じて許せない行為だ！"
 INS_communist_events.7.t: "[FROM.GetName]における共産主義者の転覆工作"
 INS_communist_events.7.desc: "[FROM.FROM.GetName]から憂慮すべき報告が入った。[FROM.GetNameDef]の工作員が、現地住民の革命的気運を煽り、我が政権への不満をうまく利用して、共産主義者による政権奪取の支持を広げているという。このまま放置すれば[FROM.FROM.GetNameDef]全域が過激派の手に落ち、この病巣が他の領地にまで広がるおそれがある。"
 INS_communist_events.7.a: "広がる前に叩き潰さねばならない！"
 INS_communist_events.8.t: "[ROOT.GetName]に広がる[FROM.GetAdjective]の宣伝活動"
 INS_communist_events.8.desc: "[FROM.GetAdjective]で作られたパンフレットやチラシが、我が国の工場や市場、大学などに次々と出回っている。階級闘争の思想を説き、革命による解放を約束しており、我が国の警察によれば、不満を抱く者のあいだで支持を広げているという。内容は稚拙だが宣伝効果は高く、拡散が収まる気配はない。"
 INS_communist_events.8.a: "誰がこのゴミ屑を配っているのか突き止めろ！"
 ## Call for Revolution - Main Event (sent to target) ##
 INS_communist_events.1.t: "[ROOT.GetName]の革命"
 INS_communist_events.1.desc: "事態はもはや修復不能なまでに悪化している。何ヶ月にもわたる[FROM.GetAdjective]の扇動工作は確実に効果を上げ、[ROOT.GetName]の共産主義運動はもはや平時の対応では抑えられなくなっている。ゼネストによって都市は麻痺し、武装集団が各地を掌握し、その上、[FROM.GetAdjective]政府が革命勢力を全面的に支援している。我が国の治安部隊は疲弊し、忠誠心すら揺らいでいる。これ以上血が流れる前に、国家の存続をかけて戦うのか、あるいは避けがたい結末を受け入れるのか決断しなければならない。"
 INS_communist_events.1.a: "軍を招集せよ。黙って引き下がるつもりはない。"
 INS_communist_events.1.b: "これ以上抵抗しても、民衆が犠牲になるだけだ。"
 INS_communist_events.1.c: "議席を与えてやれば、まだ収拾可能だ。"
 ## Civil War Chosen - sent to Indonesia ##
 INS_communist_events.2.t: "[FROM.GetNameDefCap]が抗戦を選択"
 INS_communist_events.2.desc: "[FROM.GetName]の政府は降伏を拒み、革命運動を武力で鎮圧するよう軍に命じた。現地の同志はすでに戦闘配置につき、重要拠点を占拠しつつある。長期戦は免れられないだろうが、[FROM.GetName]の民衆はすでに覚悟を決めている。彼らが孤立しないよう、我々も支え抜くつもりだ。"
 INS_communist_events.2.a: "革命を止めることはできない。"
 ## Surrender - sent to Indonesia ##
 INS_communist_events.3.t: "[FROM.GetNameDefCap]の陥落"
 INS_communist_events.3.desc: "[FROM.GetName]の旧政府が降伏した。革命運動の圧倒的な規模、そして[ROOT.GetNameDef]が裏から支援しているという事実を前に、もはや降伏以外に道がないことを悟ったのだ。権限は現地の共産党に引き渡され、新政府が早速助言を求め我々に接触してきている。国家がまたひとつ、旧体制の支配から解放された。"
 INS_communist_events.3.a: "世界中の労働者にとって大きな勝利だ。"
 ## Civil War in Subject - sent to overlord ##
 INS_communist_events.4.t: "[FROM.GetName]で内戦勃発"
 INS_communist_events.4.desc: "[FROM.FROM.GetNameDef]の支援を受け、武装し組織化された共産主義革命勢力が、[FROM.GetName]で公然と反乱を起こした。植民地政府は領内の広範な地域で統制を失っており、総督からは、現地駐屯部隊だけではもはや秩序を回復できないと報告が入った。"
 INS_communist_events.4.a: "部隊を派遣しろ。[FROM.GetName]は渡さない！"
 ## Subject Surrendered - sent to overlord ##
 INS_communist_events.5.t: "共産主義者が[FROM.GetName]を制圧"
 INS_communist_events.5.desc: "[FROM.GetName]の政権は、一戦も交えることなく共産主義の反乱軍に降伏した。総督とその職員は拘束され、我が国の旗は引き下ろされ、代わりに革命政府の樹立が宣言された。これはすべて、現地における我々の支配を切り崩そうと、何ヶ月も裏工作を重ねてきた[FROM.FROM.GetNameDef]とその工作員の仕業だ。泥棒同然の行為であり、このまま見過ごすわけにはいかない。"
 INS_communist_events.5.a: "不法行為だ！"
 # Cooperate with Revolutionaries (sent to target)
 INS_communist_events.9.t: "[FROM.GetAdjective]政府職員が反体制派と密会"
 INS_communist_events.9.desc: "[FROM.GetAdjective]の工作員が国内各地で有力な扇動家や武装派指導者と行動を共にしているのを目撃されている。かつて街角でビラを配っていた学生運動家たちが、いまや[FROM.GetAdjective]の外交文書を携えた者たちと密会している。禁止された出版物が、警察が押収する間もなく、次々と刷られていく。かつては1日で収束していた抗議活動も、今では何日にもわたり地区を封鎖に追い込んでいる。共産主義者たちは日増しに大規模な集団を組織する術を身につけていっている。今すぐ手を打たなければ、手に負えなくなるかもしれない。"
 INS_communist_events.9.a: "外国の工作員を即刻一掃せよ！"
 # Spread Anti-Colonialist Sentiment (sent to subject target)
 INS_communist_events.10.t: "[FROM.GetAdjective]の思想が浸透"
 INS_communist_events.10.desc: "[FROM.GetAdjective]のパンフレットが兵舎や官庁で出回っており、いくら取り締まってもきりがない。これらのパンフレットには、民衆が植民地総督を倒し、独立を勝ち取った国々のことが書かれている。内容が出まかせなら弾圧もしやすいが、真実味があるだけに難しい。忠実だった役人たちですら、今の体制が果たして国民のためなのか、それとも支配者のためでしかないのか、内心疑問を抱きはじめている。"
 INS_communist_events.10.a: "慎重に対処しなければ。"
