l_japanese:
 ##CZECHOSLOVAKIA##
 MUN_czech_skoda_priority.t: "シュコダ財閥"
 MUN_czech_skoda_priority.d: "シュコダ財閥は砲兵兵器から戦車、鉄道車両、海軍砲まで、幅広い製品を製造している。これにより、需要に応じて資源を配分することが可能となり、その分配の一部を我々が直接的に調整できるようになった。"
 MUN_czech_skoda_priority.1.a: "面白い"
 MUN_czech.2.t.1: "ズデーテンラントの準軍事組織が助けを要請"
 MUN_czech.2.t.2: "ズデーテンラントの義勇軍が助けを要請"
 MUN_czech.2.t.3: "ズデーテンラントの労働者民兵が助けを要請"
 MUN_czech.2.d.1: "我々の[CZE.getname]の計画に関する最近の報道を受けて、ズデーテンラントの多くの政治党派は、[CZE.GetAdjective]政府を弱体化させるためにズデーテンラント各地に準軍事組織を結成している。彼らは[CZE.getname]に対する我々の取り組みを支援するため、国境を越えた襲撃と破壊活動を行うための支援を我々に要請している。"
 MUN_czech.2.d.2: "我々の[CZE.getname]の計画に関する最近の報道を受けて、ズデーテンラントの政治党派は、ズデーテンラント義勇軍と呼ばれる準軍事組織を結成した。ズデーテンラント各地にいる義勇軍は部隊を結成し、ズデーテンラントにおける[CZE.GetAdjective]政府の土地を攻撃し始めている。彼らは[CZE.getname]に対する国境を越えた襲撃と破壊活動を行うための完全なる支援を我々に要請している。"
 MUN_czech.2.d.3: "我々の[CZE.getname]の計画に関する最近の報道を受けて、地元の共産党は、労働者民兵を結成した。労働者民兵は部隊を結成し、ズデーテンラントにおける[CZE.GetAdjective]政府の土地を攻撃し始めている。彼らは[CZE.getname]や反革命主義者に対する国境を越えた襲撃と破壊活動を行うための完全なる支援を我々に要請している。"
 MUN_czech.2.a: "もちろん支援する"
 MUN_czech.2.b: "これ以上力を与えない方が良いかもしれない"
 MUN_czech.3.t: "ズデーテンラントのパルチザン活動"
 MUN_czech.3.d: "[FROM.getname]がズデーテンラントの併合に意欲を示したとの最近の報道を受け、ズデーテンラントの準軍事組織が我々に対してパルチザン戦を開始した。彼らは政府施設への攻撃を開始し、いくつかの地域で我々の防衛線を弱体化させ始めている。この地域の軍事状況を改善するためには、これらの準軍事組織と対峙せざるを得ないだろう。"
 MUN_czech.3.a: "最悪の状況だ"
 MUN_czech.4.t: "信頼の危機"
 MUN_czech.4.d: "我が国に対する最近の軍事的行動の知らせは、政府に衝撃を与えた。[CZE.GetLeader]は、政府がこの危機を乗り越える力を持っていないと感じている。彼は$CZE_jan_syrovy$に指揮を執り、国を率いるよう要求した。$CZE_jan_syrovy$は指揮を執ることに抵抗を感じていると述べたが、[CZE.GetLeader]は彼が指揮を執り、この危機を乗り越える以外に選択肢はないと命じた。"
 MUN_czech.4.a: "今こそお前の力が必要だ。"
 MUN_czech.4.b: "ここで焦ってはいけない。"
 MUN_czech.5.t: "トマーシュ・マサリクが死去"
 MUN_czech.5.d: "マサリクは20年以上、チェコスロヴァキアの政治において礎となってきた存在である。不可能と思われた合意の形成や、解決困難な難局の数々を、マサリクは奇跡的に何度も乗り越え、チェコスロヴァキアの成長を助けてきた。彼の存在は惜しまれ、全国にその影響が及ぶことだろう。"
 MUN_czech.5.a: "彼の代わりになれるような政治の巨人はいない。"
 MUN_czech.7.t: "[CZE.getnamedef]との約束の見直し"
 MUN_czech.7.d: "最近入った情報によれば、[GER.getnamedef]はズデーテンラントの併合を望んでおり、目的達成のためなら[CZE.getnamedef]との戦争も辞さないようだ。我が国は現在、[CZE.getnamedef]との間で防衛協定を結んでおり、彼らが[GER.getnamedef]と開戦すれば、援軍を出す義務を負うことになる。これを避けるためには、ただちに[CZE.getnamedef]との防衛協定から離脱する必要がある。"
 MUN_czech.7.a: "友好国を支援しようではないか"
 MUN_czech.7.b: "[GER.getnamedef]が相手では勝ち目がないぞ"
 MUN_czech.1001.t: "[FROM.GetNameDefCap]が[SOV.GetNameDef]への回廊を要求"
 MUN_czech.1001.d: "[SOV.GetNameDef]との軍事行動の調整を目的として、[FROM.GetNameDef]は[89.GetName]と[91.GetName]の境界地域を彼らに譲渡するよう要求している。"
 MUN_czech.1002.t: "[FROM.GetNameDefCap]がユーゴスラヴィア同盟における影響力を要求"
 MUN_czech.1002.d: "[FROM.GetName]は南方に拡大した後、異例の要求を突きつけてきた。彼らが求めているのは領土の奪取ではなく、ユーゴスラビア防衛同盟の支配権である。つまり、我々の属国である北バルカン諸国の保護者および宗主国になろうというのだ。我々よりも有能な庇護者になれると主張しているが、当然ながら、それはただの口実かもしれない。"
 MUN_czech.1002.a: "彼らの言う通りかもしれんな"
 MUN_czech.1002.b: "いや、バルカン諸国を守るのは我々だ！"
 MUN_czech.1003.t: "[FROM.GetName]が要求を拒否"
 MUN_czech.1003.d: "我々の外交官の説得力ある主張にもかかわらず、[FROM.GetNameDef]は要求に応じようとしなかった。"
 MUN_czech.1003.a: "もはや選択の余地はない"
 MUN_czech.1004.t: "[FROM.GetName]がハンガリーに進軍"
 MUN_czech.1004.d: "[HUN.GetAdjective]の国境に向けて進軍する[FROM.GetAdjective]軍の知らせが[ROOT.capital.GetCapitalVictoryPointName]に届いた。間違いなく、[HUN.GetAdjective]からすぐに我々に連絡が来るだろう。[HUN.GetNameDef]を支援し、将来的な同盟国を得るべきか、あるいは[FROM.GetNameDef]にこのまま計画を続けさせるべきかを我々は速やかに決断しなければならない。"
 MUN_czech.1004.a: "我々自身の利益を守るべきだ"
 MUN_czech.1004.b: "この件には関わらないでおこう"
 MUN_czech.1005.t: "[FROM.GetName]が沿岸領土を要求"
 MUN_czech.1005.d: "[FROM.GetNameDef]が着実に国土を広げていくなか、同国の代表者たちが、かつて[FROM.GetAdjective]の貴族が所有していた領土を譲るよう我々に要求してきた。そうすればアドリア海にまで影響力が及ぶと主張しているが、どうやら我々側の意見には興味がないようだ。"
 MUN_czech.1006.t: "[FROM.GetName]が協力を提案"
 MUN_czech.1006.d: "[FROM.GetNameDef]から、相互の防衛条約を結び、両軍の戦力を合わせることで侵略国の勢いを削ごうという話を持ちかけられた。しかし興味深いことに、この条約には明言されていない部分がある。[ROOT.GetAdjective]の影響力の拡大が予想されること、そして、それを[FROM.GetNameDef]がいかに支援するかということだ。"
 MUN_czech.1007.t: "[FROM.GetName]が同盟を要求"
 MUN_czech.1007.d: "[FROM.GetNameDef]はその建国以来、我が国との間に不信感を抱えており、我々に同盟を要求するようになった。応じなければ侵略に踏み切ることも辞さないという。しかし興味深いことに[FROM.GetNameDef]はまた、我々の領土拡大の野心にも訴えかけてきており、我々が彼らの領土を諦める代わりに、我々が要求する別の領土の獲得を支援すると約束している。"
 MUN_czech.1007.b: "我々の主権を守らなければならない！"
 MUN_czech.1008.t: "[FROM.GetName]が[CZE_invited_country.GetName]を同盟国とすることを提案"
 MUN_czech.1008.d: "我々と中央ヨーロッパの繋がりとなる[FROM.GetNameDef]の代表者が、[CZE_invited_country.GetName]を招待することで、同盟を拡大することを提案した。"
 MUN_czech.1008.a: "我々を攻撃する際のさらなる抑止力となるだろう"
 MUN_czech.1008.b: "我々がヨーロッパ全土を守るわけにはいかない"
 MUN_czech.1009.t: "[FROM.GetName]が我々を[CZE.GetFactionName]に招待"
 MUN_czech.1009.d: "我々を同盟に歓迎すると、[FROM.GetNameDef]の外交官たちから連絡があった。しかし、[FROM.GetNameDef]は過去に領土の請求権を争った相手だ。その権利を主張し続けるか、あるいはより友好的な関係を築くか、我々は決断しなければならない。"
 MUN_czech.1009.a: "新たな同盟国へ！"
 MUN_czech.1009.b: "我々の請求が承認されれば、加盟しよう"
 MUN_czech.1009.c: "興味ないな"
 MUN_czech.1010.t: "[FROM.GetName]は我々が[CZE.GetFactionName]を導くよう提案"
 MUN_czech.1010.d: "少し前に小協商協定を本格的な同盟へと発展させようとした後、[FROM.GetNameDef]が我々にこの新しい陣営を率いるよう提案してきた。指導権を譲る代わりに、我々の庇護下に入ろうというわけだ。この取引により我々の勢力圏は拡大するが、脅威にさらされた国家を抱える可能性がある。"
 MUN_czech.1010.a: "貴重な同盟国となるだろう"
 MUN_czech.1010.b: "[ROOT.GetNameDef]を守るので手一杯だ"
 MUN_czech.1011.t: "[FROM.GetName]が防衛協定を提案"
 MUN_czech.1011.d: "[FROM.GetNameDef]への侵略を防ぐ活動の一環として、同国の外交官たちが相互の防衛条約の草案を我々に持ちかけてきた。我々による支援の見返りに、彼らも同様に我が国を保護し、いかなる侵略国も二面戦争を避けられないようにするという。"
 MUN_czech.1011.a: "リスクに見合っている"
 MUN_czech.1011.b: "中立でいる方が安全だ"
 MUN_czech.1012.t: "[FROM.GetName]が我々の従属を要求"
 MUN_czech.1012.d: "新たに同盟を築いたことで気を大きくした[FROM.GetNameDef]が、我々が実質的に主権を手放すことになる数々の要求を持って現れた。この地域に影響力を持つ[SOV.GetName]の支援があるなか、我々はこの要求を断るかどうかを決めなければならない。"
 MUN_czech.1012.a: "抵抗すれば、[ROOT.GetAdjective]の多くの命が失われることになる"
 MUN_czech.1012.b: "屈辱よりも死を選ぶ！"
 MUN_czech.1013.t: "[FROM.GetName]が条件付き同盟を提案"
 MUN_czech.1013.d: "慎重な検討の結果、[FROM.GetNameDef]政府は、同盟を結ぶことが有利であるとの見解を共有すると発表した。ただし、彼らは自国の領土主張を無視することはできないとも表明した。そのため、彼らは我々の派閥に参加するものの、彼らが主張する領土を譲渡することを参加条件として提案している。"
 MUN_czech.1013.a: "条件を飲む価値はある"
 MUN_czech.1013.b: "我々は領土を守ろうとしているのだ！"
 MUN_czech.1014.t: "[FROM.GetName]が保護を要請"
 MUN_czech.1014.d: "[FROM.GetNameDef]の有力な外交官が外務大臣と接触し、1935年のチェコ・ソ連相互援助条約で定められた防衛援助の取り決めの内容を具体的にするよう要求した。"
 MUN_czech.1014.a: "同盟国を守るべきかもしれん"
 MUN_czech.1014.b: "この取り決めは曖昧なままにしておこう"
 MUN_czech.1015.t: "[FROM.GetName]が派閥の統合を提案"
 MUN_czech.1015.d: "我々と共通の敵を持つ[FROM.GetName]が、我々の派閥を彼らの派閥に統合することで協力関係を深める提案を持ちかけてきた。"
 MUN_czech.1015.a: "連携しあうことで救われる命がある"
 MUN_czech.1015.b: "主導権を握るのは我々でなければならない"
 MUN_czech.1016.t: "[FROM.GetName]が不可侵条約を提案"
 MUN_czech.1016.d: "外交政策の計画変更後に取り止めになったこれまでの会談の内容をもとに、[FROM.GetNameDef]は不可侵協定の交渉を続ける提案をしてきた。"
 MUN_czech.1016.a: "これで防衛すべき国境が1つ減る"
 MUN_czech.1016.b: "これでは我々の野望が妨げられてしまう"
 MUN_czech.1017.t: "[GER.GetNameDef]へ共同で侵攻するか？"
 MUN_czech.1017.d: "[FROM.GetNameDef]が[ROOT.GetAdjective]の上層部に、[GER.GetNameDef]を侵略する秘密の計画を提案した。彼らは[GER.GetAdjective]の脅威をどうしても排除したいという熱意を伝えた後、力を合わせて強大な[GER.GetAdjective]軍を打ち破るために、我々の支援を要求した。"
 MUN_czech.1017.a: "彼らとともに[GER.GetNameDef]を討とう"
 MUN_czech.1017.b: "これはあまりに危険すぎる"
 MUN_czech.1018.t: "[GER.GetNameDef]と単独で戦うか？"
 MUN_czech.1018.t.2: "[GER.GetNameDef]への共同侵攻"
 MUN_czech.1018.d: "我々の外交努力にもかかわらず、[GER.GetName]に対する先制侵攻に関する外国の支援を得ることはできなかった。攻撃を実際に実行するかどうかが現在の問題となっている。"
 MUN_czech.1018.d.FRA_POL: "[FRA.GetNameDef]と[POL.GetNameDef]の両国から素晴らしい報せが届いた。外交官からの報告によれば、両国は我々の[GER.GetNameDef]侵攻を支援することを約束するそうだ。"
 MUN_czech.1018.d.FRA: "[FRA.GetNameDef]から帰国した外交官が素晴らしい報せを持ち帰った。彼らは、我々の[GER.GetNameDef]共同侵攻に参加意思があるとのことだ。これを受けて、我々の合同戦力に勝ち目があるのか評価しなければならない。"
 MUN_czech.1018.d.POL: "[POL.GetNameDef]から帰国した外交官が素晴らしい報せを持ち帰った。彼らは、我々の[GER.GetNameDef]共同侵攻に参加意思があるとのことだ。これを受けて、我々の合同戦力に勝ち目があるのか評価しなければならない。"
 MUN_czech.1018.a: "彼らにとっては予想外の展開になるだろう"
 MUN_czech.1018.b: "よく考えてみると、これは危険過ぎる"
 MUN_czech.1019.t: "[FROM.GetName]が[762.GetName]を要求"
 MUN_czech.1019.d: "かつてのボヘミアの国境を復活させ、[72.GetName]の正式な支配権を得たいと話す[FROM.GetAdjective]の代表者たちから、[762.GetName]を譲るよう要求する最後通告があった。"
 MUN_czech.1019.a: "従えば、我が国は安全でいられるかもしれない"
 MUN_czech.1020.t: "[FROM.GetName]が条件付き投資を提案"
 MUN_czech.1020.a: "素晴らしい提案だ！"
 MUN_czech.1020.b: "この条件は容認できない"
 MUN_czech.1020.d: "外交官が[FROM.GetNameDef]から到着し、自国が我が国の産業とインフラに投資する見返りに資源協定を結ぶという合意の内容を説明した。これは過去数年間の投資失敗に続くもので、関係改善に向けた新たな取り組みを示唆している。"
 CZE_investment_effects_tt: "§Y100日間§!で以下を獲得:\n§Y3§!つのランダムな州に§Yインフラ§!。\n§Y1§!つのランダムな州に§Y民需工場§!。\n"
 MUN_czech.1021.t: "オーストリア＝ハンガリー帝国関税同盟の復活？"
 MUN_czech.1021.d: "[CZE.GetNameDefCap]は旧オーストリア＝ハンガリー帝国構成国間の貿易協定案を提示してきた。独立を歓迎しつつも、新たな[CZE.GetAdjective]政府は、オーストリア＝ハンガリー帝国の有益な要素を回復することに特に意欲を示している。"
 MUN_czech.1021.a: "貿易が増えることは良いことだ"
 MUN_czech.1021.b: "国内の生産者を守らなければならない"
 MUN_czech.1022.t: "[CZE.GetName]によるシレジアの乗っ取り"
 MUN_czech.1022.d: "[69.GetName]の山岳地帯での激戦の後、[CZE.GetAdjective]軍は敵を打ち破り、シレジア全土を占拠したが、彼らと衝突した軍はそれから力を回復し、強い抵抗を見せた。"
 MUN_czech.1022.a: "介入しなければ"
 MUN_czech.1022.b: "新たな敵を作るわけにはいかない"
 MUN_czech.1022.c: "大勝利だ！"
 MUN_czech.1023.t: "[CZE.GetName]がシレジアをめぐる戦いを始める"
 MUN_czech.1023.d: "中世の王国や帝国に関する奇妙な理由を根拠に、[FROM.GetNameDef]は[ROOT.GetAdjective]シレジアの支配を確立するため、国境紛争を限定戦争にエスカレートさせた。"
 MUN_czech.1023.a: "軍を準備しろ"
 MUN_czech.1024.t: "[CZE.GetName]が和平協定を提案"
 MUN_czech.1024.d: "シレジアでの国境紛争が全面戦争へと発展した後、[FROM.GetNameDef]は、彼らが要求した領土が譲渡されるのであれば、戦いを終わらせる意思があることを示している。"
 MUN_czech.1024.a: "我々は別の地域に注力すべきかもしれん"
 MUN_czech.1024.b: "いまだ我々に有利な状況である"
 MUN_czech.1024.c: "この件に交渉の余地はない！"
 MUN_czech.1025.t: "スペイン義勇軍の任務終了"
 MUN_czech.1025.d.1: "[CZE_supported_spanish_faction.GetName]の派遣された[ROOT.GetAdjective]部隊は勝利を収める手助けとなり、今帰還している。この戦闘は、特に医療部隊を含む我が軍部隊に新たな知見をもたらした。"
 MUN_czech.1025.d.2: "スペイン内戦における[ROOT.GetAdjective]軍の勇敢な働きにもかかわらず、我々が支援した側は最終的に敗北した。しかし、この結果にもかかわらず、我が軍部隊、特に医療班は貴重な教訓を学んだ。"
 MUN_czech.1025.a: "国内でこの教訓を活用する必要がないことを祈る"
 MUN_czech.1026.t: "[FROM.GetName]が提案を拒否"
 MUN_czech.1026.a: "損をするのは向こうだ"
 MUN_czech.1026.b: "厄介な成り行きだ"
 MUN_czech.1026.france_refuses_to_lead: "[FROM.GetAdjective]は我が国との同盟関係において指導的な役割を期待されているにもかかわらず、それを実践するつもりはないようだ。[FROM.GetAdjective]は中立を保とうとしているように見える。もしくは、時機をうかがっているのだろう。"
 MUN_czech.1026.sphere_of_influence: "[FROM.GetAdjective]政府の職員は、我々の[ROOT.GetFactionName]加盟には感謝するが、我々の影響力がバルカン半島諸国にまで拡大するのは行き過ぎであり、同盟候補の国々が脅威に感じるかもしれないと述べた。"
 MUN_czech.1026.guarantee: "外交官の報告によると、[FROM.GetNameDef]は我々の相互防衛協定の提案に同意しなかった。彼らは、我々の方が危険な立場にいると考えているようだ。彼らが間違っていることを願おう。"
 MUN_czech.1026.faction_merge: "最善の努力を尽くしたにもかかわらず、我が国と[FROM.GetAdjective]の外交官は、[ROOT.GetFactionName]と[FROM.GetFactionName]を統一する合意に達することができなかった。"
 MUN_czech.1026.non_aggression: "平和的な意図を表明したにもかかわらず、[FROM.GetAdjective]の外交官たちは我が国との不可侵条約に合意することを拒否した。その理由は依然として不明だ。"
 MUN_czech.1026.trade_deal: "経済的独立を維持したいとの理由を挙げ、[FROM.GetNameDef]は我々の貿易協定案を拒否した。"
 MUN_czech.1026.faction_invite: "我が外交官は[FROM.GetNameDef]が我々の同盟に参加すべき理由を説明したが、最終的に味方につけることはできなかった。"
 MUN_czech.1026.weapons_sale: "寛大な提案であったにもかかわらず、[FROM.GetNameDef]は現段階では我々から武器を購入しない決断をした。"
 MUN_czech.1026.unification: "連邦を築くことの利点を認めながらも、[FROM.GetNameDef]は亡命政府を同国唯一の正当な政府のままにしておくことを選んだ。"
 MUN_czech.1026.white_peace: "我々の代表者らが今日、悲しい報せを持ち帰った。我々が[66.GetName]を占領したにもかかわらず、[FROM.GetAdjective]の指導者は講和条約に署名する気がないということだ。我々はさらに征服を進めるか、彼らの疲弊を待つしかないようだ。"
 MUN_czech.1027.t: "[FROM.GetAdjective]と[ROOT.GetAdjective]の貿易協定を締結か？"
 MUN_czech.1027.d: "当初は思想の食い違いがあったものの、[FROM.GetNameDef]は貿易協定を持ちかけることでこちらの実用主義に訴えかけてきた。我々が[FROM.GetAdjective]の[202.GetName]における資源採取を許可する代わりに、彼らは我々の産業能力拡大に絶対に必要である工作機械の提供を支援する。"
 MUN_czech.1027.a: "実に素晴らしい取引だ。"
 MUN_czech.1027.b: "彼らにあの資源を渡すべきではない。"
 MUN_czech.1028.t: "要塞化への注力の遅れ"
 MUN_czech.1028.d: "国内では現在、政府が昨年末に開始した要塞化計画を継続していない理由について、多くの人が疑問を呈している。政府は要塞評議会を通じて、追加の要塞建設計画のための資金を予算に計上していた。計画の進展が見られないため、人々は計画を続行するか、資金を返還するかを要求している。もしも要塞化計画を継続する意向があるのであれば、ただちに計画プロジェクトを再開し、期日までに完了させないといけない。"
 MUN_czech.1028.a: "もたもたしている時間などない！"
 CZE_no_time_to_lose_tt: "脅威が迫るまでに要塞化計画を完了するための猶予はほとんどない。"
 MUN_czech.1029.t: "要塞化計画の完了"
 MUN_czech.1029.d: "要塞化計画が完了し、新たな計画を開始するための資源もある。工兵は新たな要塞線の工事を開始するため、いつでも別の現場へ向かうことができる。"
 MUN_czech.1029.a: "素晴らしい成果だ。"
 MUN_czech.1030.t: "[FROM.GetName]が統合を要求"
 MUN_czech.1030.d: "[FROM.GetNameDefCap]から我々に対し、彼らが拡大しようとしている連合に加わるよう要求があった。彼らは汎スラヴ主義や汎バルカン主義、あるいはオーストリア＝ハンガリー帝国において共通の歴史を持っているなど、さまざな理由を挙げて地域内諸国の説得を試みているが、拒絶すれば彼らの脅威にさらされることも明白である。"
 MUN_czech.1030.a: "相手の言う通りにするのも悪くないかもしれん"
 MUN_czech.1030.b: "いまいち納得できない"
 MUN_czech.1031.t: "[FROM.GetName]が統一を提案"
 MUN_czech.1031.d: "[ROOT.GetNameDef]は降伏したが、[FROM.GetAdjective]政府は我々が戦闘を継続できるよう思いきった提案をしてきた。我が国の残存部分を彼らの国家と合併するというものだ。"
 MUN_czech.1031.a: "力を合わせれば、祖国をより確実に守ることができる"
 MUN_czech.1031.b: "我々の相違点はあまりに大きい"
 MUN_czech.1032.t: "隔たりを埋める"
 CZE_divide_nation_title_dynamic_sudentenland: "ズデーテンラントにおける$MUN_czech.1032.t$"
 CZE_divide_nation_title_dynamic_czech_states: "チェコの労働者とともに$MUN_czech.1032.t$"
 CZE_divide_nation_title_dynamic_tesinko_poles: "[72.GetName]における$MUN_czech.1032.t$"
 CZE_divide_nation_title_dynamic_slovakia_states: "[SLO.GetNonIdeologyName]における$MUN_czech.1032.t$"
 CZE_divide_nation_title_dynamic_hungarian_states: "[664.GetName]における$MUN_czech.1032.t$"
 CZE_divide_nation_title_dynamic_ukrainian_states: "[73.GetName]における$MUN_czech.1032.t$"
 MUN_czech.1032.d: "[FROM.getname]における問題解決に向けた最近の取り組みは、少なくとも当面は中央政府に対する怒りを収めることに成功した。これにより、政府の資源は解放され、我が国を分断する問題に対処するための他の社会や経済活動に注力できるようになった。"
 MUN_czech.1032.a: "もう一度始めよう"
 MUN_czech.1033.t: "[FROM.GetAdjective]亡命政府が認知を要請"
 MUN_czech.1033.d: "$CZE_edvard_benesh$率いる[FROM.GetAdjective]亡命政府は、[CZE.GetNonIdeologyName]の主権回復を目指す中で、我々に対しその代表団の受け入れを要請している。"
 MUN_czech.1033.a: "[GER.GetAdjective]に対する新たな味方だ。"
 MUN_czech.1033.b: "彼らに正当性はない"
 MUN_czech.1034.t: "スロヴァキアの混乱"
 MUN_czech.1034.d: "他の派閥による民族主義的な感情に屈したため、スロヴァキア人民党の党員は独自の準軍事組織を結成し、スロヴァキアの独立または少なくとも自治権を得ようと動きだした。この動きを阻止することで統一の体裁を維持するか、これを容認し、政府に忠実な地域に注力し、統一を実現するかという問題が浮上している。"
 MUN_czech.1034.a: "スロヴァキアへ軍隊を送れ！"
 MUN_czech.1034.b: "彼らを逮捕しろ。だが、ある程度の自治権を与えろ"
 MUN_czech.1034.c: "直接支配せよ。"
 MUN_czech.1034.c_tt: "§R我々はチェコスロヴァキアの運命に関する[GER.GetNameDef]の決断に従うことになる。§!"
 MUN_czech.1035.t: "[FROM.GetName]が武器の製造を申し出"
 MUN_czech.1035.d: "我々と[CZE.GetNameDef]との協力により、彼らは特殊な提案を提示した。現在国内で製造している武器を、彼らに対価を支払えば製造してくれるというものだ。これにより、我々は他の分野に注力することが可能になる。"
 MUN_czech.1035.a: "これで重複した取り組みを減らすことができる。"
 MUN_czech.1035.b: "我が軍を外国の装備に依存させてはならない。"
 #MUN_czech.1036.t: "" #Event uses MUN_czech.1032.t
 MUN_czech.1036.d: "大恐慌は、我が国の経済にも政治にも大打撃を与えた。多くの地域的な経済的・政治的な問題が発生しており、大恐慌からの奇跡的な回復にもかかわらず、これらの問題はさらに悪化する兆候を見せている。これらの問題を解決しない限り、我が国がさらに分断してしまうだろう。"
 MUN_czech.1036.a: "国を立て直さねば"
 CZE_divided_nation_event_onbroad_tt: "アンロックされた§Yディシジョン§!により、中核州に対するネガティブな§Y州補正§!を§Y削除§!できる。\n\nこれらの§Yデシジョン§!を完了すると、国民精神「§Y$CZE_a_divided_nation_dynamic_modifier$§!」のネガティブな補正が軽減され、最終的に§Y削除§!される。"
 MUN_czech.1037.t: "[GER.GetName]が[HUN.GetName]を保護"
 MUN_czech.1037.d: "我が国において、明らかに[HUN.GetNameDef]との戦争が正当化されていることに気付き、[GER.GetAdjective]の代表者たちは、[HUN.GetAdjective]と戦えば、[GER.GetNameDef]とも戦うことになると明言した。このまま計画を進めるかどうかは我々次第である。"
 MUN_czech.1037.a: "計画を中止しなければならない"
 MUN_czech.1037.b: "何も変わらない"
 MUN_czech.1038.t.1: "[FROM.GetName]が戦車設計のライセンスを提案"
 MUN_czech.1038.t.2: "[FROM.GetName]が銃器の売却を提案"
 MUN_czech.1038.t.3: "[FROM.GetName]が大砲の売却を提案"
 MUN_czech.1038.t.4: "[FROM.GetName]が軽戦車の売却を提案"
 MUN_czech.1038.t.5: "[FROM.GetName]が戦闘機の売却を提案"
 MUN_czech.1038.d: "[FROM.GetAdjective]政府、および同国の兵器製造会社の代表者が来訪し、武器の販売を提案してきた。価格はごく普通のようで、[FROM.GetNameDef]はさらに、非常に現代的な武器も提案している。"
 MUN_czech.1038.a: "良い取引だと思う"
 MUN_czech.1039.t: "[RUT.getname]が自治権協定を要求"
 MUN_czech.1039.d: "$RUT_augustin_voloshyn$は、我々が[SLO.getname]に認めた自治協定を念頭に、彼の地域に対しても同様の連邦協定を結ぶよう打診してきた。一見馬鹿げた提案だが、現在の状況を踏まえればこの要求をそのまま受け入れるしかない。"
 MUN_czech.1039.a: "どうなることやら"
 MUN_czech.1040.t: "[CZE.getname]が我が国に関税同盟条約を提案"
 MUN_czech.1040.d: "[CZE.getnameDEFCAP]が最近、我が国との関税同盟に関する外交協議の内容を再検討した。彼らが結ぼうとしている取引は公平なものに思えるが、後になって予想外の要求が追加される可能性もある。この条約もここまでの交渉内容もほとんど影響力のない形だけのものなので、条約締結に害はないだろう。"
 MUN_czech.1040.a: "損はなさそうだ"
 MUN_czech.1040.b: "信用ならない"
 MUN_czech.1041.t: "[FROM.getname]が関税同盟条約を却下"
 MUN_czech.1041.d: "自国経済への影響を根拠に、[From.getname]は我が国と関税同盟条約を結ぶことを拒んだ。彼らが挙げた拒絶の理由は、何も得るもののない事実無根の言い訳に聞こえる。"
 MUN_czech.1041.a: "残念だ"
 MUN_czech.1042.t: "[FROM.getname]が関税同盟条約に同意"
 MUN_czech.1042.d: "条約の内容に納得し、[FROM.getname]は提案された条件に同意した。これが両国間の関係を深める最初の一歩になるといいのだが。"
 MUN_czech.1042.a: "素晴らしい"
 MUN_czech.1043.t: "[FROM.getname]が我々に連邦への参加を要求"
 MUN_czech.1043.d: "[FROM.getname]は、我が国との関係強化と最近の世界事情を根拠に、我々は孤立するよりも彼らの保護下にいる方が安全であると主張している。ただ我々の領土を手にしたいだけの策略に思えるが、我が国はどうすべきだろうか？"
 MUN_czech.1043.a: "受け入れよう"
 MUN_czech.1043.b: "とんでもない考えだ"
 MUN_czech.1044.t: "[FROM.getname]が連邦への参加を拒絶"
 MUN_czech.1044.d: "我々の保護を受けるよりも孤立している方が安全であると考えた[FROM.getname]は、我が連邦への参加を拒絶した。ヨーロッパでの立場を強化しようとする我々の目標においては、これは大きな痛手である。[FROM.getname]に話が通じない今、我々はどうすべきだろうか？"
 MUN_czech.1044.a: "残念だ"
 MUN_czech.1044.b: "別の手段を講じなければならない"
 MUN_czech.1045.t: "[FROM.getname]が連邦への参加に同意"
 MUN_czech.1045.d: "孤立しているよりも我々の保護を受ける方が安全であると考えた[FROM.getname]は、連邦に加わる賢明な決断を下した。これでヨーロッパにおける我々の立場は大きく強化されるだろう。"
 MUN_czech.1045.a: "素晴らしい"
 MUN_czech.1046.t: "隔たりの回復"
 MUN_czech.1046.d: "国内の多くの問題に対処してきたことで、我が国における緊張が緩んできているようだ。数々の経済および社会計画を終えた後、この国はようやく回復し始めている。"
 MUN_czech.1046.a: "素晴らしい知らせだ"
 #MUN_czech.1047 is hidden
 MUN_czech.1048.t: "[FROM.GetName]が要求を受諾"
 MUN_czech.1048.t2: "[FROM.GetName]が提案に同意"
 MUN_czech.1048.d: "嫌々ながら、[FROM.GetAdjective]の役人たちは領土の要求を呑む意向を我々に示した。[FROM.GetAdjective]軍はすでに同領土から撤退を始めている。"
 MUN_czech.1048.d2: "長きにわたる協議の末、我々と[FROM.GetNameDef]双方の役人は、我々の連合の一環として、[FROM.GetAdjective]経済の新たな役割に合意した。この取り決めは両国の民に繁栄をもたらすに違いない。"
 MUN_czech.1048.d3: "我々の不可侵条約の提案は、[FROM.GetAdjective]の代表者にすぐさま熱意をもって受け入れられた。彼らの野心は違う方向に向けられているようだ。"
 MUN_czech.1048.d4: "深刻な脅威にさらされた[FROM.GetNameDef]は我々の同盟要求に屈した。"
 MUN_czech.1048.d5: "長きにわたる協議の末、我々と[FROM.GetNameDef]双方の役人は合意に達することができた。それは、我々の軍需産業の一部を彼らのための装備生産に専念させる見返りに、貿易品を受け取り市場や生産に投入するという内容だ。"
 #MUN_czech.1049 is a faction joining event so largely reuses generic loc
 MUN_czech.1049.d: "[FROM.GetNameDef]の新政府から同盟の話を持ちかけられた。当初、彼らの新しい軍事政権は反ドイツの姿勢を示していたが、どうやら現実的に考えて、かつての国際的協力国は頼りにならないと認識したようだ。"
 MUN_czech.1050.d: "[FROM.GetNameDef]から帰国した外交官から、彼らの同盟に加わるこちらの要求をはねつけられたと残念な知らせを受けた。その理由ははっきりしないが、現在、我々はかつての同盟国に感じている不安を露呈させているうえで、新たな同盟国も見つかっていないという困難な状況にある。"
 MUN_czech.1050.a: "では、相手側により有利な条件を提案するべきかもしれない"
 MUN_czech.1050.b: "より理想的な同盟国を探そう"
 MUN_czech.1051.t: "[FROM.GetName]が勢力圏を要求"
 MUN_czech.1051.d: "新たな同盟国の[FROM.GetNameDef]は国境を越えて影響力を拡大することに興味を示しており、[FROM.GetAdjective]の代表者は我々に対し、彼らの影響力拡大を承認し、これを支援するよう求めてきた。これにより、[ROOT.GetAdjective]と[FROM.GetAdjective]の勢力圏の間に明確な境界線が設定されることになる。"
 MUN_czech.1051.a: "重要な同盟国、[FROM.GetAdjective]を強化すべきである"
 MUN_czech.1052.t: "[FROM.GetName]は我々が[SOV.GetAdjective]軍の通過を許可するよう要求"
 MUN_czech.1052.d: "[FROM.GetNameDef]と[SOV.GetNameDef]の間で新たな外交協定が結ばれ、[FROM.GetNameDef]は紛争の際に[SOV.GetNameDef]が保護してくれると確信している。唯一の障害は両国が陸路でつながっていないことだ。これを受け、[FROM.GetAdjective]の外交官が我々の政府に接触し、紛争時に[SOV.GetAdjective]軍が我々の領土を通過して[FROM.GetNameDef]に向かうことを許可するように要求してきた。"
 MUN_czech.1052.a: "彼らの戦闘は我々も保護することになる。"
 MUN_czech.1053.t: "[HUN.GetAdjective]が持つ請求権を利用した[FROM.GetName]の圧力"
 MUN_czech.1053.d: "[HUN.GetNameDef]を従属国とした[FROM.GetNameDef]は、我々に同じ運命を受け入れるよう要求している。もし拒否すれば、彼らは[HUN.GetAdjective]が有する[ROM.GetAdjective]領土に対する請求権を支持すると脅してきた。我々は今、主権を失うか、領土保全を危険に晒すかの二者択一を迫られている。"
 CZE_cancel_anti_hungary_focus_tt: "国家方針「§Y$CZE_neutralize_the_hungarian_threat$§!」をキャンセル"
 MUN_czech.1054.t: "[LIT.GetName]への共同侵攻の提案"
 MUN_czech.1054.d: "かつての合意に従い、[FROM.GetNameDef]は我が国の強化に資する提案を持ちかけてきた。その内容は[LIT.GetNameDef]を強制的に併合するというものであり、それによって我が国は追加の資源を手にするとともに、敵が[LIT.GetNameDef]を通過して攻撃してくる可能性を排除できる。"
 MUN_czech.1054.a: "他国の拡大に抵抗するためには、我々も拡大しなければならない。"
 MUN_czech.1055.t: "[SOV.GetAdjective]の義勇軍が到着"
 MUN_czech.1055.d: "空輸兵站における前例のない偉業である。[SOV.GetNameDef]は我々の目下の戦争努力を支援するため、空軍を使って数個師団の義勇兵を[73.GetName]の空港に配備した。"
 MUN_czech.1056.t: "[FROM.GetName]が[975.GetName]を要求"
 MUN_czech.1056.d: "かつて第一次世界大戦後のパリ講和会議で提案されたように、[CZE.GetNameDef]は同盟国である[YUG.GetNameDef]へと通じる回廊が同盟の安全保障上必要であると表明した。この目標を達成するために、[FROM.GetAdjective]の代表団は最後通牒として、我々に[975.GetName]の割譲を要求している。"
 #THE FALL OF THE REPUBLIC EVENTS#
 MUN_the_fall_of_the_republic.1.t: "大規模な抗議活動の勃発"
 MUN_the_fall_of_the_republic.1.d: "[ROOT.GetLeader]が最近下した、ズデーテンラントを放棄する決断は、全国で抗議活動を引き起こしている。政治と軍の指導者たちは、絶望的な状況下での無意味な抵抗を避け、流血を回避したいと考えていたが、国民の多くは、彼らが間違った判断を下したと感じている。一部の政治勢力は、この混乱を機に自らの目的を推進するため動き始めている。"
 MUN_the_fall_of_the_republic.1.a: "我々に選択肢は無かった！"
 MUN_the_fall_of_the_republic.2.t.1: "第一共和国の滅亡"
 MUN_the_fall_of_the_republic.2.t.2: "政府内の混乱"
 MUN_the_fall_of_the_republic.2.d: "政府がズデーテンラントの降伏を決断してから、軍と政府の若手指導層による大規模な辞任が相次ぎ、我が国は大きな混乱に陥っている。一部の人物は一夜にして国外へ逃亡したとの報告もある。官僚の流出を食い止め、我が国の指導力に対する信頼を回復するため、政府内での重大な改革が急務となっている。"
 MUN_the_fall_of_the_republic.2.a: "根本的な改革が必要だ。"
 MUN_the_fall_of_the_republic.2.b: "方針を変えてはならない！"
 MUN_the_fall_of_the_republic.3.t: "[RUT.getname]が自治権を要求"
 MUN_the_fall_of_the_republic.3.d: "最近我が国に起きている政治的混乱により、カルパト＝ウクライナの小地域はそこと[ROOT.getname]の他の地域との間の長年の対立を理由に挙げ、[9.GetCapitalVictoryPointName]からのより大きな自治権を求めている。しかし、この要求は地域指導者が自らの権力を強化するためのものであるように見える。この要求を拒否することは、ただでさえ少ない政治的権力の状況下で、さらに多大な政治的代償を払うことになる。"
 MUN_the_fall_of_the_republic.3.a: "いいだろう"
 MUN_the_fall_of_the_republic.3.b: "とんでもない話だ！"
 MUN_the_fall_of_the_republic.3.c: "この地域を手放そう。"
 MUN_the_fall_of_the_republic.4.t: "[RUT.getname]の運命"
 MUN_the_fall_of_the_republic.4.d: "最近[CZE.getname]に起きた混乱の結果、[RUT.getname]はどの国の領土からも外れた状態となっている。この小さい地域は独立国を宣言し、近隣諸国に対して外交的な接触を図っている。我が政府内では、我が国の国境に接する戦略的に重要な地域が他国の支配下に入ることを懸念する声が強まっている。軍は、その地域に対し即時併合を要求する最後通牒を送るよう提案している。"
 MUN_the_fall_of_the_republic.4.a: "直ちに最後通牒を送れ！"
 MUN_the_fall_of_the_republic.4.b: "これは危険かもしれない。少し様子を見よう。"
 MUN_the_fall_of_the_republic.5.t: "[FROM.getname]が我が国の併合を要求！"
 MUN_the_fall_of_the_republic.5.d: "独立後、隣国が我々をその領土に加えようとするのは時間の問題だった。[FROM.getname]が最初にその動きを見せ、我々の降伏を要求している。どう対応すべきだろうか？"
 MUN_the_fall_of_the_republic.5.a: "最後の一人まで戦ってみせる！"
 MUN_the_fall_of_the_republic.5.b: "受け入れざるを得ない。"
 MUN_the_fall_of_the_republic.6.t: "[FROM.getname]が最後通牒を拒否！"
 MUN_the_fall_of_the_republic.6.d: "[FROM.getname]は意外にも我々の最後通牒を拒否し、武力をもって抵抗する方針を表明した。こうなったら、我々は侵略する以外の選択肢はない。戦闘計画と攻撃ルートは既に策定されており、あとは攻撃命令を下すのみだ。"
 MUN_the_fall_of_the_republic.6.a: "警告したぞ。"
 MUN_the_fall_of_the_republic.6.a_tt: "この作戦は[RUT.GetNameDef]に同盟国がいない限り§Y$HUN_pal_teleki$§!に影響を与えない。"
 MUN_the_fall_of_the_republic.6.b: "これは我々への被害が大きくなるかもしれない。少し待とう。"
 MUN_the_fall_of_the_republic.7.t: "[FROM.getname]が我々の要求に屈服"
 MUN_the_fall_of_the_republic.7.d: "予想通り、[FROM.getname]は我々の要求を受け入れ、いくつかの些細な条件と引き換えに我が国と合併することを承諾した。この小さな地域が、我が国のような強大な国家に対して抵抗することなど不可能だったのだ。これにより、我が国の北の国境は以前よりも防衛が強化され、政府は容易な勝利を収めたことにとても満足している。"
 MUN_the_fall_of_the_republic.7.a: "素晴らしい報せだ。"
 #BOP EVENTS#
 MUN_czech_bop.1.t: "艦隊の用意"
 MUN_czech_bop.1.d: "この10年の前半に実施された改革措置が徐々に成果を挙げ始めている。現在、我が国の軍隊はヨーロッパで最も近代的な軍隊の一つとなっている。しかし、一部の政治家や多くの産業コングロマリットのトップの間で、慢心が芽生え始めている。我が軍の戦闘能力に対する疑念や、それを自らの私利私欲のために利用しようとする勢力と闘わなければ、我が軍が常に最高の戦闘態勢を維持することはできないだろう。"
 MUN_czech_bop.1.a: "準備はできている。"
 MUN_czech_bop.2.t.1: "ドイツ再軍備の脅威"
 MUN_czech_bop.2.t.2: "隣国の軍拡"
 MUN_czech_bop.2.d.1: "[GER.getnameDEFcap]のラインラント再軍備化は、我が国の軍事および政治指導者の一部を不安にさせている。多くの者は、国が結んだ同盟関係と、ドイツの脅威に備えて軍が現在進めている準備に信頼を寄せているが、一部の者は、[GER.GetAdjective]の脅威に対抗できないのではないかと、懸念している。"
 MUN_czech_bop.2.d.2: "一部の隣国が軍備を大幅に拡大する計画を推進しているという知らせは、我が国の軍事および政治指導者の一部を不安にさせている。多くの者は、国が他国と結んだ同盟関係と、外国の脅威に備えて軍が現在進めている準備に信頼を寄せているが、一部の者は、我々が外国からの攻撃に対抗できないのではないかと、懸念している。"
 MUN_czech_bop.2.a: "準備を進める。"
 MUN_czech_bop.2.a_tt: "近隣諸国の再軍備が進み、起こり得る侵略に対する我々の抵抗能力に疑問を持つ者が軍内部に現れている。我々は軍を安心させるために行動しなければならない。"
 MUN_czech_bop.3.t: "[CZE.getname]が我が国に監視団を派遣した"
 MUN_czech_bop.3.d: "[CZE.getname]は最近、我が国に人員を派遣し、進行中の紛争を観察させている。同時に、同国の小火器製造会社が、我が国の外交官に対し非公式なルートを通じて連絡を取り、我が国が同社の小火器を購入する意向があるかどうかを打診してきた。これを行うには、我が国に対する制限措置があるため、小火器を密輸する必要が生じる。"
 MUN_czech_bop.3.a: "どのような展開になるか見届けよう。"
 MUN_czech_bop.3.b: "ただ見ているだけならいいが、それ以上のことはさせられない。"
 MUN_czech_bop_3_tt: "§Y[CZE.getname]§!の火器製造企業§Y$CZE_zbrojovka_brno_organization$§!は、我々に武器の密輸を試みるかもしれない。"
 MUN_czech_bop.4.t: "$CZE_zbrojovka_brno_organization$の計画"
 MUN_czech_bop.4.d: "[ETH.getname]は$CZE_zbrojovka_brno_organization$の武器製造会社の代表者と接触し、我々の銃器を密輸する計画に興味を示している。国際連盟の制裁にもかかわらず、[ETH.GetNameDef]の$CZE_zbrojovka_brno_organization$は、この計画を実行する意向を示している。国際連盟の決議に違反した場合、発覚すれば国際的に非難される可能性がある。"
 MUN_czech_bop.4.a: "やってみよう"
 MUN_czech_bop.4.b: "リスクを冒してまでやることではない"
 CZE_gun_smuggling_tt: "武器を密輸"
 CZE_we_got_caught_tt: "§Y$CZE_zbrojovka_brno_organization$§!が捕まった。"
 CZE_we_dont_get_caught_tt: "§Y$CZE_zbrojovka_brno_organization$§!は捕まらなかった。"
 MUN_czech_bop.5.t: "$CZE_zbrojovka_brno_organization$が密輸計画に同意"
 MUN_czech_bop.5.d: "チェコ政府の代表者と協議した結果、$CZE_zbrojovka_brno_organization$は国へ小規模な小火器の密輸を開始する秘密の承認を得た。彼らの専門知識は、裏ルートを通じて我々も活用することができる。"
 MUN_czech_bop.5.a: "有効活用させてもらおう。"
 MUN_czech_bop_5_tt: "この§Y製造者§!は戦争が終わると§R削除§!される。"
 ##SLOVAKIA##
 MUN_slovakia_little_war.1.t: "[71.Getname]における勝利"
 MUN_slovakia_little_war.1.d: "我が軍は[71.Getname]において敵軍を打ち破る戦果を挙げた。指揮官たちはこの戦いから貴重な学びと教訓を得ることができ、今後に活かすことができるだろう。"
 MUN_slovakia_little_war.1.a: "素晴らしい成果だ。"
 MUN_slovakia_little_war.2.t: "[71.Getname]における敗北"
 MUN_slovakia_little_war.2.d: "全力を尽くしたにもかかわらず、我が軍は[71.Getname]における戦闘で敗北した。開戦までに十分な弾薬と車両装備を準備できなかったのが大きな敗因だ。大きな痛手ではあるが、この戦闘に参加した指揮官たちには多くの学びがあったことだろう。"
 MUN_slovakia_little_war.2.a: "残念な結果だ。"
 MUN_slovakia_little_war.3.t: "[71.Getname]における国境衝突"
 MUN_slovakia_little_war.3.d: "[HUN.getnamedef]は$GER_first_vienna_award$によって我々の領土を手にしたにもかかわらず、さらに[71.getname]における国境の調整を要求している。我々は武力をもってこれに対応し、戦わずして領土を手放すことはないと示す必要がある。"
 MUN_slovakia_little_war.3.a: "なんて奴らだ！"
 MUN_slovakia_little_war.4.t: "[71.Getname]における膠着状態"
 MUN_slovakia_little_war.4.d: "全力を尽くしたにもかかわらず、我が軍は[71.Getname]における戦闘で勝ち切ることができかなった。開戦までに十分な弾薬と車両装備を準備できなかったのが大きな要因だ。大きな痛手ではあるが、この戦闘に参加した指揮官たちには多くの学びがあったことだろう。"
 MUN_slovakia_little_war.4.a: "残念だ。"
 ##Exile##
 MUN_czech_exile.1.t: "[CZE.GetAdjective]の亡命者が[ROOT.GetNameDef]に到着"
 MUN_czech_exile.1.d: "ミュンヘン会談を受けて[GER.GetNameDef]が解体された後、[CZE.GetAdjective]の亡命者たちは我が国を含む多くの国々にたどり着いた。彼らは我々を支援するために武器を取る意思があり、いつの日か我々の支援を受けて祖国を解放することを望んでいる。"
 MUN_czech_exile.1.a: "歓迎する。"
 ##NEWS EVENTS##
 MUN_czech.news.1.t: "ズデーテンラント危機"
 MUN_czech.news.1.desc: "ズデーテンラントの住民が[CZE.getnameDef]に対して武装反乱を始めた。ズデーテンラントの準軍事組織が各地域の警察署や政府施設への攻撃を開始したとの報告が相次いでいる。これは、[FROM.getname]が同地域を併合する意向を示した最近の知らせをきっかけとしている。\n\nこれらの反乱は[FROM.getname]と[CZE.GetNameDef]との間のより大規模な衝突の前兆のように思える。実際、この衝突はもう避けられないものだろう。"
 MUN_czech.news.1.a: "これはヨーロッパにとって不吉の前兆だ。"
 MUN_czech.news.1.b: "混乱とは登って行くものなのだ。"
 MUN_czech.news.1.c: "我々が勝利する！"
 MUN_czech.news.1.d: "外交が成功することを願っている。"
 MUN_czech.news.2.t: "[FROM.GetNameDefCap]が[RUT.GetNameDef]を侵略"
 MUN_czech.news.2.desc: "\n[CZE.getname]での政治的混乱に続く一連の出来事の中で、[RUT.getname]という小さな地域がどの領土からも外れた状態となっている。分離したこの小さな地域は、その後独立国家として宣言し、新たな国家の独立を維持するため民兵組織の結成を開始した。\n\n[FROM.getnamedefcap]は長年、この地域への野心を抱いており、この機会を逃すまいと、小さな独立国家に侵攻した。[RUT.getname]に対する勝利は、他者から見れば、すでに決まったものであるように思える。"
 MUN_czech.news.2.a: "カルパティア？なんだそれは。"
 MUN_czech.news.2.b: "楽な勝利となりそうだ。"
 MUN_czech.news.2.c: "かかってこい！"
 MUN_slovakia.news.1.t: "[71.Getname]の国境をめぐる戦闘"
 MUN_slovakia.news.1.desc: "[HUN.getnamedef]は$GER_first_vienna_award$によって[664.Getname]を奪還したにもかかわらず、さらに[71.Getname]における[SLO.getnamedef]との国境の調整を要求している。\n\nこの紛争は、はるかに弱い敵を相手に自国の軍事力を試したい[HUN.getnamedef]の口実のように見える。経験の浅い[SLO.getnamedef] 軍はこれに立ち向かう準備ができていない可能性がある。"
 MUN_slovakia.news.1.a: "子ども同士の喧嘩ではないか。"
 MUN_slovakia.news.1.b: "任務への準備はできている。"
