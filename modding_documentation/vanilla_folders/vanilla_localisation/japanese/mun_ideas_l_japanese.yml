 CZE_enemy_intelligence_collaborators: "敵の諜報協力者"
 CZE_enemy_intelligence_collaborators_no_lar: "敵の諜報協力者"
 CZE_first_sudetenland_fortification_program: "第1次ズデーテンラント要塞化計画"
