 CZE_anglo_czechoslovak_bank_desc: "プラハに拠点を置く3つの銀行が1930年に合併して生まれた銀行。現在は国内で2番目の規模を持つ。"
 CZE_praga_aviation: "$CZE_praga_aviation_organization$"
 #Dynamic Modifiers National Spritits
 CZE_ceskoslovenska_armada_dynamic_modifier: "チェコスロヴァキア軍"
 CZE_ceskoslovenska_armada_dynamic_modifier_desc: "チェコスロヴァキア軍は、主に旧オーストリア＝ハンガリー帝国軍のチェコ兵と、帰還したチェコスロヴァキア軍団から成る軍隊として新設された。両者の影響は今も色濃く残っている。"
 CZE_ceskoslovenske_letectvo_dynamic_modifier: "チェコスロヴァキア空軍"
 CZE_ceskoslovenske_letectvo_dynamic_modifier_desc: "飛行機の備えは万全ではないかもしれないが、パイロットは例外だ。あらゆる方面からの空の脅威に対抗すべく、天を海とする我らが空の船乗りたちは、誰もが1人で3人の働きをする。"
 CZE_a_divided_nation_dynamic_modifier: "分断された国家"
 CZE_a_divided_nation_dynamic_modifier_desc: "[CZE.GetAdjective]は、領内に住むすべての者を守る多元主義国家として、中央ヨーロッパにおいて独力でやってきた。しかし、大恐慌がそれを変えた。経済的困難が政府に対する不満を生み、さまざまな運動を呼び起こした。そして現在、それらの不満が国家を深く分断させているのだ。"
 CZE_skoda_works_dynamic_modifier: "シュコダ財閥"
 CZE_skoda_works_dynamic_modifier_desc: "シュコダは、我が国の重工業におけるあらゆる分野の製造、建設、投資事業を行っている企業集団である。国内においてその手が届かない場所は存在しない。"
 CZE_ceskoslovenske_alecne_lodstvo_dynamic_modifier: "チェコスロヴァキア海軍"
 #Dynamic State Modifiers
 CZE_sudetenland_german_state_modifier: "ズデーテンラントの分離主義"
 CZE_sudetenland_german_state_modifier_desc: "最近の経済不況に苦しんでいるのはズデーテンラントの産業界もまた同様だ。現地の人々はこの災難の責任を[ROOT.getname]政府に求め、不満を募らせている。"
 CZE_tesinko_polish_state_modifier: "ポーランドの分離主義"
 CZE_czech_state_modifier: "チェコの熟練労働者の不足"
 CZE_czech_state_modifier_desc: "人口の大半が農業従事者であるチェコは、20世紀の急速な経済発展に対応しきれていない。優れた技術を持つチェコ人労働者を確保するのは困難である。近代経済のニーズの変化に対応できるよう、若年層を育成するための取り組みが求められている。"
