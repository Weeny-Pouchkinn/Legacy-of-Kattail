 CZE_sudetenland_paramilitaries_modifier: "ズデーテンラントの準軍事活動"
 CZE_sudetenland_paramilitaries_modifier_desc: "ズデーテンラントのパルチザンと準軍事組織は現在、この地域において我が軍を妨害している。彼らは我が軍を積極的に攻撃し、敵国と手を結んでいる。"
 CZE_nationalist_protests: "国粋主義者の抗議"
