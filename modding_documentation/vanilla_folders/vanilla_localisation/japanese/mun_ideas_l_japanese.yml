 #National Spirits
 CZE_taticek_of_czechoslovakia: "タティーチェク・マサリク"
 CZE_taticek_of_czechoslovakia_desc: "「タティーチェク・マサリク（国家の父）」の愛称で呼ばれるトマーシュ・マサリクは、チェコスロヴァキア建国以来この国の礎となってきた存在である。不可能と思われた合意の形成や、解決困難な難局の数々を、マサリクは奇跡的に何度も乗り越え、チェコスロヴァキアの成長を助けてきた。大統領の座を退いた後ですらも、その影響力は絶大であり、彼の提言は助言というよりも命令として指導者層に受け止められている。"
 CZE_industrialists_veto: "実業家の拒否権"
 CZE_industrialists_veto_desc: "[CZE.GetNameDef]最大級のコングロマリットのトップに立つ実業家たちは我が国の政治に対して多大な影響力を有している。経済政策の問題に関して彼らの懸念事項を無視することはできず、経済動員は彼らが最も激しく抵抗する施策の一つである。"
 CZE_agrarian_politics_1: "農業政治"
 CZE_agrarian_politics_1_desc: "我が国は工業立国であるにもかかわらず、多くの政党は農民と地方の市民こそが政局を左右すると考えている。彼らの意見が経済政策にしばしば影響をもたらし、さらなる産業発展の政治的障害にもなっている。"
 CZE_directorate_of_fortification_works_no_gd_idea: "要塞化事業総局"
 CZE_directorate_of_fortification_works_no_gd_idea_desc: "ROPの名で知られる$CZE_directorate_of_fortification_works_no_gd_idea$は、国家の要塞化事業を監督する管理局である。"
 CZE_czech_corporatism: "チェコの協調主義"
 CZE_broken_shield: "壊れた盾"
 CZE_redirected_fortification_council_funds: "転用された要塞評議会の資金"
 CZE_army_readiness_1: "即応不可能な軍隊"
 CZE_army_readiness_1_desc: "軍の備えとは、人員や装備だけの問題ではない。防備は万全であるという自信、そして有事における政治や産業界の指導者たちからの十分な支援があって初めて実現できる。戦う手段を持っていることと、実際に効果的に戦えることはまったくの別物なのだ。"
 CZE_army_readiness_3: "万全な軍隊"
 CZE_army_readiness_3_desc: "軍の備えとは、人員や装備だけの問題ではない。防備は万全であるという自信、そして有事における政治や産業界の指導者たちからの十分な支援があって初めて実現できる。戦う手段を持っていることと、実際に効果的に戦えることはまったくの別物なのだ。"
 CZE_ready_for_anything_idea: "準備万端"
 CZE_sudeten_german_quandary: "難局にあるズデーテンラント"
 CZE_sudeten_german_quandary_desc: "ズデーテンラントの住人の大多数は現在の政府の下で自治権の拡大を望んでいるだけだが、ズデーテンラントの政党および支持者の多くはドイツ国家がこの地域の一部を併合しようとした場合、すぐに寝返る可能性がある。"
 CZE_sudeten_german_quandary_modifier_tt: "§Y常時効果§!:\n§Y[AUS.GetFlag][AUS.GetNonIdeologyName]§!、§Y[GER.GetFlag][GER.GetNonIdeologyName]§!、または自国と国境を接するその他の[BAY.GetFlag]§Yドイツ人国家§!が自国に対して§R戦争目標§!を正当化または獲得し、かつ§Y[69.GetName]§!、§Y[972.GetName]§!、または§Y[74.GetName]§!が自国の支配下にある場合:\n-（§Y支配下にあるすべてのズデーテンラントの州§!）:\n    §Y$CZE_sudetenland_paramilitaries_modifier$§!が追加され、以下の効果を付与:\n$MODIFIER_LOCAL_INTEL_TO_ENEMIES$: §R+10%§!\n       $MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$: §R-10.0%§!\n       $modifier_state_repair_speed_bunker_factor$: §R-10.00%§!\n\n - この§Y効果§!は一度しか発生しない"
 CZE_sudeten_challenge: "ズデーテンの困難"
 CZE_sudeten_challenge_desc: "ズデーテンラントにおける準軍事組織の最近の活動により、我々に対する彼らの攻撃は正当なものだという誤解が国際社会に広まっている。真実はそうではないと認めさせるには時間を要するだろう。"
 CZE_sudeten_facde: "外から見たズデーテン"
 CZE_sudeten_facde_desc: "現地の準軍事組織を支援しなかったことで、我々の[CZE.getname]に対する行動を正当化する試みは、国際社会からは見せかけにすぎないとみなされている。"
