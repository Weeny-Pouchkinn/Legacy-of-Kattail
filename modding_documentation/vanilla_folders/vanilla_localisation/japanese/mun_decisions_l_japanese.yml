 CZE_crisis_in_the_sudentenland: "ズデーテンラント危機"
 CZE_crisis_in_the_sudentenland_desc: "ズデーテンラントの準軍事組織が反乱を起こし、我々に対してゲリラ戦を仕掛けてきた。我々の部隊との継続的な衝突により、状況は混乱に陥っている。この状況を敵が利用する前に早期に収束させないといけない。"
