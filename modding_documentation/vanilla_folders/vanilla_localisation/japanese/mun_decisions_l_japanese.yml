 ###### CZECHOSLOVAKIA ######
 CZE_sudeten_promise_mission: "ズデーテンの約束"
 CZE_sudeten_promise_mission_desc: "ズデーテンラントの準軍事組織を支援することで、我々は彼らが[CZE.GETNAME]から独立し、我が国に加わることを援助する約束をした。この約束を破ることは、政治的な反発を招くことになる。"
 CZE_recall_zdenko_hudecek: "§Y$CZE_zdenko_hudecek$§!を召還"
 CZE_a_divided_nation_category: "分断された国家"
 CZE_a_divided_nation_category_desc: "国内の様々な運動から政府に対する不満が高まっており、もはや無視や軽視できない状況となっている。これらの問題を解決することは、国を分裂させようとする勢力を弱めることになるだろう。少なくとも当面の間は。"
 CZE_a_divided_nation_category_tt: "ディシジョンを選択: §Y$CZE_a_divided_nation_bridge_the_divide_fake$§!"
 CZE_a_divided_nation_category_2_tt: "§Y選択した場合の効果§!:\nディシジョン「§Y$CZE_a_divided_nation_category$§!」をアンロックする。これは国内の§Y州§!に対するネガティブな州補正を§Y削除§!し、§Y国民精神「$CZE_a_divided_nation_dynamic_modifier$」§!のネガティブな補正が軽減され、最終的に§Y削除§!される。"
 CZE_a_divided_nation_category_3_tt: "ディシジョン「§Y$CZE_a_divided_nation_category$§!」をアンロックする。これは国内の§Y州§!に対するネガティブな州補正を§Y削除§!し、§Y国民精神「$CZE_a_divided_nation_dynamic_modifier$」§!のネガティブな補正が軽減され、最終的に§Y削除§!される。"
 CZE_a_divided_nation_fake_category: "分断された国家"
 CZE_a_divided_nation_fake_category_desc: "国内の様々な運動から政府に対する不満が高まっており、もはや無視や軽視できない状況となっている。これらの問題を解決することは、国を分裂させようとする勢力を弱めることになるだろう。少なくとも当面の間は。"
