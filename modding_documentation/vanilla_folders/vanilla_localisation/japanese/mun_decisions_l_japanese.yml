 CZE_bop_car_rationing: "£BoP_right_texticon 自動車の配給"
 CZE_embezzle_quatermaster_funds: "£BoP_left_texticon 補給将校の資金を横領する"
 CZE_embezzle_quatermaster_funds_desc: "兵士たちは十分な待遇を受けている。兵舎のための資金の一部が他の用途に回されたとしても、誰も気づかないし、気にしないだろう。"
 CZE_prioritize_export_contracts: "£BoP_left_texticon 輸出契約を優先"
 CZE_prioritize_export_contracts_desc: "我々が大恐慌から抜け出すことができたのは、輸出産業のおかげだ。今さら行動を変える必要などないだろう。いずれにせよ、我が国が直面している脅威など、どれも大げさなものだ。大艦隊にはもうしばらく待ってもらおう。"
 CZE_focus_on_export_designs: "£BoP_left_texticon 輸出設計への注力"
 CZE_focus_on_export_designs_desc: "大艦隊は我々の設計に対して非常に厳しい要求を突きつけている。一方、輸出市場はより寛容で、大艦隊のための国内設計開発にも資金を提供している。したがって、実質的には、大艦隊は我々が研究開発費を大幅に節約していることに感謝すべきなのだ。"
 CZE_bop_reservist_training: "£BoP_right_texticon 予備軍訓練"
 CZE_junior_officer_recruitment: "£BoP_right_texticon 下級将校の採用取り組み"
 CZE_send_foreign_attaches: "£BoP_right_texticon 外国駐在武官を派遣する"
 CZE_send_observers_to_the_italo_ethiopian_war: "£BoP_right_texticon 監視団をエチオピアへ派遣する"
 CZE_send_observers_to_the_italo_ethiopian_war_bonus: "イタリア・エチオピア戦争に監視団を派遣した"
 CZE_send_observers_to_the_italo_ethiopian_war_desc: "戦闘現場で戦闘に関与している人物を観察し、非公式な接触を行うために、秘密裏に人員を潜入させることで、現代の軍隊の戦術や戦略に関する貴重な知識を得ることができる。また、これによって他の機会が開ける可能性もある。"
 CZE_send_observers_to_the_italo_ethiopian_war_tt: "§Y$CZE_zbrojovka_brno_organization$§!は§Y[ETH.getname]§!への銃器の密輸について調査する。"
 CZE_recruit_red_cross_veterans: "£BoP_right_texticon 赤十字の退役軍人の雇用"
 CZE_warehouse_inspections: "£BoP_right_texticon 倉庫検査"
 CZE_warehouse_inspections_desc: "確認しに行くまで、何かが欠けていることには気づかない。"
 CZE_construction_telephone_stations: "£BoP_right_texticon 電話局の建設"
 CZE_construction_telephone_stations_desc: "本部間に電話局を設置することで、最高司令部の連携が大幅に強化される。"
 CZE_state_defense_loans: "£BoP_right_texticon 国家防衛の融資"
 CZE_live_fire_exercise: "£BoP_right_texticon 実戦演習"
 CZE_live_fire_exercise_desc: "射撃場での一日より貴重なものはない。"
