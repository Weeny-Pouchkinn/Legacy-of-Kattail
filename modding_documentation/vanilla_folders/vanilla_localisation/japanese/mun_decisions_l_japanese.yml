 CZE_form_the_european_federation: "ヨーロッパ連邦を設立"
 CZE_central_european_federation_desc: "近隣諸国とは相違点よりも共通点の方が多い。民主主義連邦の設立は、多くの脅威に直面しながらも、中央ヨーロッパにおける多元主義を存続させる唯一の手段かもしれない。"
