 ###FORT DECISIONS###
 CZE_the_second_fortification_program_category: "要塞化計画"
 CZE_the_second_fortification_program_category_desc: "我が国の不利な国境は、国家の安全における深刻な懸念事項だ。周辺諸国は、自国の利益になるように国境を再編する意図を明確に示している。国境の強化を継続することは、いかなる敵対勢力も攻撃を躊躇させる効果をもたらすだろう。"
 CZE_fate_of_the_ro: "要塞評議会の運命"
 CZE_fate_of_the_ro_desc: "要塞評議会は、要塞化経過に関連する資金の調達を担当している。これらの資金がすぐに何らかの目的で使用されない場合、人々はなぜ資金が調達されたのか疑問に思うようになるだろう。"
 CZE_bop_army_bunker_maintenance: "要塞の維持への注力"
 CZE_bop_army_bunker_maintenance_desc: "要塞が適切に維持管理され、使用可能な状態に保たれていれば、万一要塞が守備要員を配置する必要が生じた場合、軍が自信を持って要塞を使うことができる。"
 CZE_fortification_research: "要塞化の研究"
 CZE_fortification_research_desc: "国境を強化しないといけないことは明白だが、問題はどのようにそれを行うかだ。研究によってその答えがわかるだろう。"
 CZE_fortification_research_tt: "国民精神§Y$CZE_directorate_of_fortification_works_no_gd_idea$§!を有している"
 CZE_fortification_research_subtract_variable_tt: "今後のすべての§Y要塞化計画§!ディシジョンは§Y30§!日早く§Y達成§!するようになる"
 CZE_fortification_decision_inprogress: "すでに別の要塞化計画に着手している"
 CZE_second_sudetenland_fortification_program: "第2次ズデーテンラント要塞化計画"
 CZE_second_sudetenland_fortification_program_desc: "ドイツとの国境の山地であるズデーテンラントは、国境の要塞化に最適な場所だ。フランスのマジノ線を学ぶことで、我々のラインを構築することができる。"
 CZE_third_sudetenland_fortification_program: "第3次ズデーテンラント要塞化計画"
 CZE_third_sudetenland_fortification_program_desc: "ズデーテンラントは今はまともな防衛線を誇っているが、国家の生存が危機に瀕しているときは「まとも」だけでは足りない。"
 CZE_fourth_sudetenland_fortification_program: "第4次ズデーテンラント要塞化計画"
 CZE_fourth_sudetenland_fortification_program_desc: "ズデーテンラントは強力な要塞システムを持っているが、より強力にしなければならない。"
 CZE_fortify_the_crossroads_with_slo: "要衝の要塞化"
 CZE_fortify_the_crossroads_with_slo_desc: "如何なる要塞システムも破壊される可能性がある。要塞線を突破した敵に容易に包囲される事態を防ぐために、我々は最も重要な都市の周りに要所を作ることができる。"
 CZE_fortify_the_hungarian_border_with_73: "ハンガリーとの国境の要塞化"
 CZE_fortify_the_hungarian_border_with_73_desc: "ハンガリーの領土回復主義は常に我が国への脅威であり、国境線に沿った要塞組織は我々の安全を保障する助けになるだろう。"
 CZE_fortify_the_polish_border_with_72: "ポーランドとの国境の要塞化"
 CZE_fortify_the_polish_border_with_72_desc: "ポーランドの侵略は留まるところを知らないが、うまくいけば、よく要塞化された国境線が彼らをより御しやすい標的とするだろう。"
