 CZE_autonomous_sentiment: "自治権の心情"
 CZE_autonomous_sentiment_desc: "自治派連合との同盟にはいくつかの難点がある。その一つは、[SLO.getname]が一定の自治権を獲得することを承諾するということだ。国内の他の地域も同様の待遇を要求する可能性がある。"
