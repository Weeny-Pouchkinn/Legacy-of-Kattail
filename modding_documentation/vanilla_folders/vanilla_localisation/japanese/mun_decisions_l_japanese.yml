 CZE_a_divided_nation_sudentenland_germans_cooperate_desc: "[FROM.Getname]の地元産業を救済すれば、迅速に地元住民の政治的支援を取り戻すだろう。"
 CZE_a_divided_nation_tesinko_poles: "§Y[FROM.getname]§!における統合への注力"
 CZE_a_divided_nation_czech_states: "§Y[FROM.getname]§!における教育への注力"
 CZE_a_divided_nation_czech_states_desc: "国の中心における産業の急速な成長の障害となっているのは、専門知識を持った人材の不足だ。成長する産業で働くための教育を強化するプログラムに投資しなければならない。"
