 AST_singapore_strategy_idea: "シンガポール防衛施設建設"
 AST_singapore_strategy_idea_desc: "我々はオーストラリアの要請に応じ、シンガポールの防衛施設の改善に努めるものとする。シンガポール戦略は太平洋防衛政策の中核を成すものである。\n\n§W§Y削除時§!（§Yシンガポール§!）:\n§Y航空基地§!を§G2§!つ追加。\n§Y海軍基地§!を§G2§!つ追加。\n§Y沿岸要塞§!を§G1§!つ追加。§!\n"
