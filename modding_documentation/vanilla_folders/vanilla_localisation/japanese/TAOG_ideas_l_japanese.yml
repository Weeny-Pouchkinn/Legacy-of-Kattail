 idea_SIA_constitutional_virtue: "立憲の美徳"
 idea_SIA_an_absolute_monarchy: "絶対君主制"
 idea_SIA_an_absolute_monarchy_desc: "すべての政治権力は王冠に帰属する。国王の言葉は法であり、異議は抑圧され、王威のすべてが国家動員の後ろ盾となる。王座は忠誠を命じ、軍はその道具である。"
 idea_SIA_a_constituional_monarchy: "立憲君主制"
 idea_SIA_a_constituional_monarchy_desc: "憲法の枠組みによって王権の限界が定められ、人民の権利が保障される。王冠が絶対的な権威ではなく団結の象徴となったことで、国家はより安定し、新たな思想に対してより寛容になり、民主主義世界との足並みもよりそろうことになる。"
 idea_SIA_restoring_order: "秩序の回復"
 idea_SIA_military_expansion_costs: "軍拡コスト"
 idea_SIA_a_modern_economy: "近代経済"
 idea_SIA_death_to_communists: "共産主義者に死を"
 idea_SIA_death_to_communists_desc: "反共主義の熱気が全軍に浸透しており、中国の共産主義軍に対して我が軍を優位に立たせている。"
 idea_SIA_death_to_nationalists: "民族主義者に死を"
 idea_SIA_death_to_nationalists_desc: "反国民党感情が全軍に浸透しており、中国国民党軍に対して我が軍を優位に立たせている。"
 idea_SIA_breaking_the_burmese_line: "ビルマ戦線の突破"
 idea_SIA_the_yellow_dossier: "黄色い文書"
 idea_SIA_the_yellow_dossier_desc: "国内産業の現状に関する機密報告書により、根深い非効率性と向き合わざるを得なくなった。報告書が求める改革は工場で実を結びつつあるが、それに伴う混乱にも相応の代償がある。"
 idea_SIA_the_yellow_dossier_2: "$idea_SIA_the_yellow_dossier$"
 idea_SIA_the_yellow_dossier_2_desc: "$idea_SIA_the_yellow_dossier_desc$"
 idea_SIA_pacific_war_preparations: "太平洋戦争の準備"
 idea_SIA_a_race_against_time: "時間との闘い"
 idea_SIA_overheated_economy: "過熱した経済"
 idea_SIA_overheated_economy_desc: "経済は本来の限界を超えて過熱している。消費者の需要は生産能力を上回り、過熱が収まるまで建設ブームは停滞している。"
 idea_SIA_ending_military_grift: "軍の汚職一掃"
 idea_SIA_the_military_oversight_bureau: "$SIA_military_oversight_bureau$"
 idea_SIA_the_military_oversight_bureau_desc: "軍監察局は新任の指揮官に対してより高い基準を設定し、将校団全体の専門性向上を加速させる。"
 idea_SIA_public_credit_debt: "公的信用債務"
 idea_SIA_public_credit_debt_desc: "国家の債務負担は経済に絶え間ない重荷となっており、本来なら生産や民需品へと向かうはずの資源を消費している。"
 idea_SIA_public_credit_debt_2: "$idea_SIA_public_credit_debt$の返済"
 idea_SIA_public_credit_debt_2_desc: "$idea_SIA_public_credit_debt_desc$"
 idea_SIA_revision_of_unequal_treaties: "不平等条約の改正"
 idea_SIA_purged_military: "追放された軍"
 idea_SIA_purged_military_desc: "政治的に信頼できないとみなされた将校らが排除されたことで、軍は経験豊富な指導力を欠くこととなり、組織運営と残存部隊の育成が妨げられている。"
 SIA_khana_ratsadon_inlay_title: "人民党"
 SIA_civilian_wing_label: "文民派"
 SIA_military_wing_label: "軍人派"
 SIA_wing_state_full_support: "§G全面支持§!"
 SIA_wing_state_slight_support: "§G限定的支持§!"
 SIA_wing_state_neutral: "§Y中立§!"
 SIA_wing_state_opposition: "§R反対§!"
 SIA_wing_state_rebellious: "§R反抗的§!"
 SIA_civilian_wing_history_tt: "人民党の文民派は、§Yプリディ・パノムヨン§!を筆頭とする進歩的な行政官や技術官僚によって率いられている。フランスで法学を修めたプリディは、農地改革、国家による経済計画、そして一般民衆に真の力を与える立憲民主主義への大志を抱いて帰国した。\n\n文民派は概して§G開発推進派§!であり、教育、インフラ、産業への投資を支持している。彼らは巨額の軍事支出に懐疑的であり、強権的支配へのいかなる傾倒も警戒している。彼らの支持は、国家を近代化し立憲政治を守る政策によって最も得やすい。"
 SIA_military_wing_history_tt: "人民党の軍人派は、自らを革命の真の守護者とみなす陸軍将校らが主導している。その中で最も野心的な人物は、ヨーロッパの民族主義運動への傾倒を年々深めている大佐、§Yプレーク・ピブーンソンクラーム§!である。\n\n軍人派は§G再軍備推進派§!であり、強力な中央集権国家に惹かれている。彼らはプリディの経済思想を危険なほど急進的であるとして疑い、防衛問題への文民の介入にはほとんど我慢ならない。彼らの忠誠は、軍事投資や国威を示す政策によって最も確保しやすい。"
 idea_SIA_wing_promotion_disruption: "派閥の再編"
 idea_SIA_wing_promotion_disruption_desc: "人民党の一方の派閥を公然と優遇したことで、政府の均衡は崩れてしまった。軽んじられた派閥は非協力的になり、軍の日常業務は乱れ、新たな体制が定着するまでは通常の行政にも支障が生じる。"
 idea_SIA_military_wing_unrest: "軍人派の反乱"
 idea_SIA_military_wing_unrest_desc: "将校たちの忍耐は再び限界に達した。軍人派は権力の掌握に失敗し、今や破壊工作、脱走、あからさまな協力拒否という形で怒りをぶつけている。不満分子を屈服させるまでは、軍の戦闘力は崩れたままだ。"
 idea_SIA_civilian_wing_unrest: "文民派の反乱"
 idea_SIA_civilian_wing_unrest_desc: "プリディの派閥は再び政府への信頼を失った。権力を握る二度目の機会を奪われ、文民派はストライキ、官僚的妨害、都市部での扇動に訴えている。事態が落ち着くまでは、経済は麻痺し、国家は統制不能に陥る。"
 idea_SIA_unwavering_civilian_support: "文民派への揺るがぬ支持"
 idea_SIA_unwavering_civilian_support_desc: "軍人派は解体され、正統性の問題も決着した。文民政府に異を唱える者はいない。軍の干渉から解放され、プリディ派のテクノクラートたちは、かつての連立体制では到底発揮できなかった熱意をもって行政に打ち込んでいる。"
 idea_SIA_unified_khana_ratsadon: "統一人民党"
 idea_SIA_unified_khana_ratsadon_desc: "軍人と文民の間にあったかつての争いは終わった。人民党の両派閥がついに同じ方向を向いたことで、政府はかつてないほど目的を一にして行動できるようになった。軍人、官僚、実業家たちは今や一体となって活動している。"
