 AST_a_sense_of_place: "場所の感覚"
 AST_a_sense_of_place_desc: "国家アイデンティティは人々を結びつける絆である。繁栄する文化の下、オーストラリア人は団結し、国境を脅かす可能性のあるあらゆる存在に対抗することを決意している。"
 AST_a_sense_of_place_upgraded: "場所の感覚"
 AST_a_sense_of_place_upgraded_desc: "かつて静かに育まれていた国民的アイデンティティは、より鋭さを帯びるようになった。これはもはや、土地や生活様式への誇りではなく、オーストラリアが築き上げてきたものは戦う価値があるという確信であり、南十字星の下に生きる人々にはその覚悟があるのだ。"
