 NZL_railways_board: "政府鉄道委員会"
 NZL_railways_board_desc: "政府鉄道委員会は1931年に鉄道局再編の一環として創設されたもので、政府の省庁から意思決定を切り離すための試みであった。しかし、設立以来、鉄道網改善の兆しはほとんど見られなかった。政府に対して、同委員会を廃止して直接統制を再開すべきだという圧力が高まっている。"
 NZL_great_depression: "大恐慌"
 NZL_great_depression_desc: "1929年に起こった世界経済の崩壊は、農業中心であったニュージーランド経済に深刻な打撃を与えた。複数の国がニュージーランドからの農産物購入を減らしたことで、多くの者が失業し、消費者の購買力が低下し、その結果その他の産業も崩壊した。数年にわたる緊縮財政を経た今、国民は方針転換を強く望んでいる。 "
 NZL_commonwealth_loyalty: "イギリス連邦への忠誠"
 NZL_commonwealth_loyalty_desc: "ニュージーランドはイギリス連邦の忠実な構成国であり続け、国王を正当な国家元首として維持している。ニュージーランド経済もまた、より広範な帝国の経済体系に深く統合されている。"
