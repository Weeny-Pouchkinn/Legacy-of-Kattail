 idea_INS_volksraad: "フォルクスラート"
 idea_INS_volksraad_desc: "フォルクスラートは1918年にオランダが「倫理政策」の一環として設立した評議会であり、群島全域に存在する様々な民族的少数派や文化の声を代表する準民主主義的な仕組みの構築を目的としている。理論上は民主的な性質を有しているが、総督およびオランダ王室は無条件の拒否権を保持している。"
 INS_volksraad_custom_tt: "§Yフォルクスラート顧問§!を雇用できるようになる\n§Yフォルクスラートの決定§!を使用できるようになる"
 INS_great_depression: "大恐慌"
 INS_great_depression_desc: "大恐慌が東インドにもたらした直接的な影響は小さなものであったが、その後世界的に講じられた保護貿易主義政策は、ゴムや石油のような原材料の輸出に依存していた東インドの経済に壊滅的な影響を及ぼした。"
 INS_great_depression_tt: "§Y$INS_great_depression$§!に以下の補正:"
 INS_dutch_east_indies: "管理不全の行政"
 INS_dutch_east_indies_desc: "東インドは数百もの異なる文化と言語が内在する広大な群島で、統治が極めて困難な植民地として知られている。様々な独立運動、文化的障壁、そして大恐慌の経済的影響も加わり、極めて非効率に行政が運営されている。1918年に導入された「倫理政策」は倫理的な労働規制の義務化と少数派への民主的代表権の付与によって状況を改善しようとする試みだが、大恐慌の影響でほとんどが機能していない。"
 INS_dutch_east_indies_tt: "§Y$INS_dutch_east_indies$§!に以下の補正:"
 INS_volksraad_tt: "§Y$INS_dutch_east_indies$§!に以下の補正:"
 INS_royal_netherlands_east_indies_army_desc: "王立オランダ領東インド陸軍（KNIL）は長きにわたって東インドに配備されている軍隊であり、オランダ本国から独立して運用されている。KNILはヨーロッパ人とインドネシア人両方の兵士で構成されているが、多数の文化が内在する群島とオランダの間にある文化的および言語的障壁によって、徴募は難しく時間のかかる工程になっている。"
 idea_INS_netherlands_most_precious_jewel: "オランダの最も貴重な宝石"
 idea_INS_netherlands_most_precious_jewel_desc: "オランダ領東インドは約350年にわたってオランダの植民地であり、植民地の行政はオランダ政府と緊密に統合されている。東インドはしばしば「オランダの王冠の宝石」と呼ばれ、オランダはこの貴重な宝石に対する支配を緩める意向はまったく示していない。"
 INS_netherlands_most_precious_jewel_tt: "£GFX_trigger_no 自治度を「自由」まで引き上げ可能"
