 idea_SIA_debt_repayment_desc: "赤字財政計画の代償がのしかかっている。歳入は債権者へと回され、かつて借入によって可能となった建設のペースはもはや維持できない。"
 idea_SIA_an_unceasy_alliance: "不安定な同盟"
 idea_SIA_an_unceasy_alliance_desc: "同盟は維持されているが、その軋みが表れはじめている。政府内部の疑念が、国家をより中立的な針路へと静かに引き寄せている。"
 idea_SIA_rural_support: "農村支援"
