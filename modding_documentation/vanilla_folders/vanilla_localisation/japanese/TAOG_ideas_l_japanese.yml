 INS_bangka_bauxite_export_desc: "バンカ島およびブリトゥン島には世界におけるボーキサイト埋蔵量の大部分が存在している。ボーキサイトはアルミニウムの主要な原料であり、我々自身でアルミニウム生産に投資することも可能だが、生産されるボーキサイトの莫大な量を考慮すれば、未加工のまま原料として大量に販売することも有効な戦略となり得る。"
