 INS_anti_colonialist_sentiment_idea: "反植民地主義の感情"
 INS_anti_colonialist_sentiment_idea_desc: "インドネシアの革命家たちは我が国で活動しており、国民全体にプロパガンダを広め、反植民地主義の感情を高めている。"
 INS_revolutionaries_working_with_indonesians_idea: "革命家たちがインドネシア人と協力"
 INS_revolutionaries_working_with_indonesians_idea_desc: "[ROOT.GetAdjective]の共産主義者たちがインドネシアの指導者たちと連絡を取っていることが発覚した。武装革命を計画している疑いがある。"
 ############
 ### SIAM ###
 ############
 idea_SIA_civilian_full_support: "文民派: §G全面支持§!"
 idea_SIA_civilian_full_support_desc: "文民派は政府を確固として支持している。行政官や技術官僚が専門知識を提供し、開発を前進させている。"
 idea_SIA_civilian_slight_support: "文民派: わずかな支持"
 idea_SIA_civilian_slight_support_desc: "文民派は政府の方針を広く支持している。彼らの協力は、ささやかではあるが目に見える利益をもたらす。"
 idea_SIA_civilian_neutral: "文民派: 中立"
 idea_SIA_civilian_neutral_desc: "文民派は政府を支援も妨害もしない。行政は機能しているが、真の政治的結束がもたらす推進力は欠けている。"
 idea_SIA_civilian_opposition: "文民派: 反対"
 idea_SIA_civilian_opposition_desc: "文民派は政府に敵対するようになった。官僚は仕事を遅らせ、予算は不適切に配分され、国家機構は停滞している。"
 idea_SIA_civilian_rebellious: "文民派: §R反抗的§!"
 idea_SIA_civilian_rebellious_desc: "文民派は公然と反抗している。不安定が広がり、政治的決裂の脅威は日に日に増している。"
 idea_SIA_military_full_support: "軍人派: §G全面支持§!"
 idea_SIA_military_full_support_desc: "軍人派は政府を確固として支持している。将校らは徴兵活動や兵器生産を後押しし、軍の資源を国家目標へと振り向けている。"
 idea_SIA_military_slight_support: "軍人派: わずかな支持"
 idea_SIA_military_slight_support_desc: "軍人派は広く協力的である。全面的な関与とまではいかないものの、その支持は徴兵と生産にささやかな改善をもたらす。"
 idea_SIA_military_neutral: "軍人派: 中立"
 idea_SIA_military_neutral_desc: "軍人派は態度を明らかにしていない。軍は熱意も抵抗もなく任務を遂行し、事態の推移を見守っている。"
 idea_SIA_military_opposition: "軍人派: 反対"
 idea_SIA_military_opposition_desc: "軍人派は政府に反して動いている。将校らは生産活動を妨害し、政府の大義に対する熱意は隊列から失われつつある。"
 idea_SIA_military_rebellious: "軍人派: §R反抗的§!"
 idea_SIA_military_rebellious_desc: "軍人派は公然たる反抗の瀬戸際にある。徴兵はサボタージュされ、兵器生産は滞り、クーデターの影が忍び寄っている。"
 idea_SIA_defenders_of_constitutional_liberty: "憲法上の自由の擁護者"
 idea_SIA_civil_service_heroism_1: "市民的英雄精神"
 idea_SIA_civil_service_heroism_1_desc: "官僚機構は難局に応え、その献身と専門知識によって、研究と国家開発のペースを静かに加速させている。"
 idea_SIA_civil_service_heroism_2: "$idea_civil_service_heroism_1$"
 idea_SIA_civil_service_heroism_2_desc: "$idea_SIA_civil_service_heroism_1_desc$"
 idea_SIA_redirected_military_funds: "軍事資金の転用"
 idea_SIA_thai_irredentism: "タイ領土回復主義"
 idea_SIA_oss_special_forces_training: "OSS特殊部隊訓練"
 idea_SIA_seized_japanese_funds: "接収された日本資金"
 idea_SIA_seized_japanese_funds_desc: "日本との取り決めが破綻した今、彼らが残した資金と備蓄は我々のものとなり、建設と工業生産の急増に活用できる。"
 idea_SIA_oss_special_forces_training_desc: "我々の工作員はOSSとともに、破壊工作、潜入、空挺作戦の訓練を積んできた。そこで得た教訓により、我々の特殊部隊は恐るべき戦力へと鍛え上げられた。"
 idea_SIA_sold_privy_purse_lands: "王室所有地の売却"
 idea_SIA_sold_privy_purse_lands_desc: "王室所有地の売却により国家に資本が注入され、経済的圧迫が緩和されて、建設に充てる資源が確保された。"
 idea_SIA_war_fervor: "戦意"
 idea_SIA_bloodlusted_irredentism: "血に飢えた領土回復主義"
 idea_SIA_bloodlusted_irredentism_desc: "領土的野心は、より激しい感情へと変質した。軍は、本来自分たちのものであるものを取り戻すと信じる者たちの確信を胸に戦っている。"
 idea_SIA_the_royal_police_counterweight: "王立警察の忠誠"
 idea_SIA_civilian_technocrats_in_institutions: "文民技術官僚"
 idea_SIA_civilian_technocrats_in_institutions_desc: "主要な国家機関に配置された文民の専門家が、資源採掘と政治任用の効率の双方を向上させた。"
 idea_SIA_yuvachon: "ユヴァチョン"
 idea_SIA_yuvachon_desc: "ユワチョン運動は国の若者に軍事規律を叩き込み、訓練済み人的資源の供給源を築くとともに、国家主義的感情を煽っている。"
 idea_SIA_yuvachon_2: "$idea_SIA_yuvachon$"
 idea_SIA_yuvachon_2_desc: "$idea_SIA_yuvachon_desc$"
 idea_SIA_rebuilding_the_war_torn_economy: "戦禍に傷ついた経済の再建"
 idea_SIA_specialist_marine_forces: "特殊海兵隊"
 idea_SIA_specialist_marine_forces_desc: "沿岸強襲作戦のため、水陸両用作戦の専門要員が訓練され、装備を整えられた。"
 idea_SIA_rehabilitated_military: "軍隊の回復"
 idea_SIA_desperate_gambit: "絶望的な一手"
 idea_SIA_desperate_gambit_desc: "自ら落ちたこの穴から抜け出す道は、まだあるかもしれない。登れ！"
 idea_SIA_purged_senior_military: "上級軍人の粛清"
 idea_SIA_purged_senior_military_desc: "政府への脅威とみなされた上級将校らが更迭された。経験豊富な指揮官の喪失は、軍の結束と専門的発展に傷跡を残している。"
 idea_SIA_cemented_control: "強固な支配"
 idea_SIA_cemented_control_desc: "政府は国家機関への支配を強固にした。政治的反対勢力は脇に追いやられ、権力機構は今や政府に有利な形で確実に機能している。"
 idea_SIA_cemented_control_2: "盤石な支配"
 idea_SIA_cemented_control_2_desc: "$idea_SIA_cemented_control_desc$"
 idea_SIA_cemented_control_3: "タイ国民戦時義務法"
 idea_SIA_cemented_control_3_desc: "王室と国民の主権を脅かす戦争が勃発した場合、武器であれそれ以外であれ、可能なあらゆる手段をもって占領に抵抗することは、すべての立派なタイ国民の義務である。"
 idea_SIA_suspend_ordinary_legal_procedures: "通常の法手続きの停止"
 idea_SIA_thai_cultural_mandates: "タイ文化命令"
 idea_SIA_military_humiliation: "軍部の屈辱"
 idea_SIA_death_defiant: "死を恐れぬ"
 idea_SIA_death_defiant_desc: "我々はすでに死んだも同然だ。できるものならかかってこい"
 idea_SIA_songsuradet_ascendant_0: "ソンスラデートの台頭"
 idea_SIA_songsuradet_ascendant_0_desc: "政府の怒りをうまくやり過ごしたプラヤー・ソンスラデートは、自身の基盤を固め、その結果いっそう強大な存在となった。今や彼は、人々が「手出しできない」と呼ぶような存在であり、知名度も地盤も高すぎて排除することができない。\n彼はおそらく政府の政策に干渉し、再び粛清の標的とならないよう意思決定を遅らせるだろう。"
