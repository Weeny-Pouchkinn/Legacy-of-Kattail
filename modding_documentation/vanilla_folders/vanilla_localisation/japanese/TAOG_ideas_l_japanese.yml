 AST_anti_fascist_measures: "反ファシスト対策"
 AST_anti_fascist_measures_desc: "ファシズムはまだオーストラリアに浸透しておらず、民主主義勢力はこの状態を維持したい。連邦調査局はファシスト集団が影響力を獲得するのを防ぐため、あらゆる不審分子を監視・拘束する。"
 ABDA_corps_expeditionnaire_spirit: "遠征軍"
 ABDA_corps_expeditionnaire_spirit_desc: "太平洋戦域に参加したフランス軍は、植民地での任務で鍛えられ、母国から遠く離れた困難な環境での作戦行動に慣れている。彼らは東南アジアでの戦闘経験により、日本の戦術や地形に精通しており、敵の攻勢に対して粘り強く対応できる戦力となっている。"
 ABDA_maintain_strategic_flexibility_spirit: "戦略的柔軟性"
 ABDA_maintain_strategic_flexibility_spirit_desc: "アメリカの工業生産は太平洋戦域へと向けられており、広大な海域全体に戦力を投射できる艦隊を維持するため、造船所の生産は加速されている。アメリカ合衆国は一つの戦線に過度に集中しないことで、状況に応じて必要な場所に海軍力を投下できる体制を確保している。"
 AST_toe_the_line_spirit: "規律に従う"
 AST_toe_the_line_spirit_desc: "国家は犠牲を求め、国民がこれに応じた。配給制、労働時間の延長、国家の取り組みへの民需生産の転用により、政府は他の手段では得られなかった資源を確保できたが、このような厳格な取り決めは広く支持されているわけではない。"
