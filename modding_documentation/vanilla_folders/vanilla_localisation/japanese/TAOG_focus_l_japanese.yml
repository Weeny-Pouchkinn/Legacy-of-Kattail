 AST_natunity_desc: "§Y挙国一致内閣§!\n§L危機の時代には、小さな争いが大きな争いに道を譲る。周辺諸国は次々と紛争に直面している。国内問題にはそれぞれ緊急性があるものの、流血の脅威がいよいよ差し迫れば、その緊急性は薄れていく。[AST.GetName]の民主主義政党は意見の相違を脇に置き、団結して世界に立ち向かわなければならない。§!"
