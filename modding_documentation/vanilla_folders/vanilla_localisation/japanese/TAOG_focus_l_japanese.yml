 add_random_stat_to_general_tt: "この将軍にランダムなスキル値を1つ追加する"
 generic_unlock_industrial_concern_tt: "工業会社として以下が利用可能: \n"
 NZL_rail_standardization_tt: "備蓄に§Y$NZL_train_equipment_1$§!を§Y[?NZL_train_var]§!ユニット追加する。"
 NZL_ministry_of_public_works: "公共事業省"
 NZL_ministry_of_public_works_desc: "綿密な計画と規律に基づく投資により、道路、鉄道、電力計画は場当たり的な対応ではなく、一貫性のある国家戦略に基づいて推進されることになる。"
 NZL_abolish_the_railways_board: "鉄道委員会の廃止"
 NZL_abolish_the_railways_board_desc: "政府鉄道委員会は鉄道網の近代化において効果的に機能してこなかった。この迷走した組織を廃止し、鉄道を省の統治下に戻す時である。"
 NZL_rail_standardization: "機関車の標準化"
 NZL_rail_standardization_desc: "[ROOT.GetName]は全国各地に工房を所有しているが、それぞれが品質の異なる機関車を製造してきた。鉄道システムをより効率的にするため、製造対象となる標準的な機関車をいくつか定め、それぞれを特定の用途に特化させる。 "
 NZL_full_employment: "完全雇用"
 NZL_full_employment_desc: "継続的な公共事業、慎重な計画、安定した産業の拡大を通じ、失業問題はついに機会に取って代わられた。不況によって遊休していた工場は再稼働し、国家の労働力は余すことなく生産的な企業に動員されている。信頼と安定を取り戻した我々は、単に回復しただけでなく、今後の課題に立ち向かう強さも得た。"
 NZL_direct_the_coal_industry: "石炭産業の統制"
 NZL_direct_the_coal_industry_desc: "鉄道、産業、発電に対して石炭がこれまで以上に重要度を増すなか、政府はこれに介入し、国家の利益のために生産と分配を調整しなければならない。"
 NZL_establish_the_ncb: "石炭庁の設立"
 NZL_establish_the_ncb_desc: "石炭庁を設立することで、国内に点在する鉱山を統制された指導下に置き、鉄道、産業、発電に対する安定した燃料供給を確保することができる。中央による監督は生産の合理化と効率化を促進し、民間の利益よりも戦略的な必要性を確実に優先させることができる。"
 NZL_electrification: "発電の拡大"
 NZL_electrification_desc: "国内の河川を活用し、水力発電を拡大することで、持続的な産業力の基盤を築くことができる。新たなダムと送電設備は国全体の発電能力を増大させ、工場、鉄道、港が必要とする電力を確実に供給できるようになる。"
 NZL_bureau_of_industry_taog: "$NZL_bureau_of_industry$"
 NZL_bureau_of_industry_taog_desc: "$NZL_bureau_of_industry_desc$"
 NZL_wairarapa_sheep_farms_taog: "$NZL_wairarapa_sheep_farms$"
 NZL_wairarapa_sheep_farms_taog_desc: "$NZL_wairarapa_sheep_farms_desc$"
 NZL_national_roads_board_taog: "$NZL_national_roads_board$"
 NZL_national_roads_board_taog_desc: "$NZL_national_roads_board_desc$"
 NZL_taranaki_oil_taog: "$NZL_taranaki_oil$"
 NZL_taranaki_oil_taog_desc: "$NZL_taranaki_oil_desc$"
 NZL_women_in_the_workforce: "女性労働力"
 NZL_women_in_the_workforce_desc: "人手不足が深刻化するなか、女性が工場、農場、公共サービスにおける重要な役割を進んで担い、戦時下の圧力によって生産が停滞することを防いでいる。訓練と雇用機会を拡大することにより、国防を維持しながら産業生産を持続することができる。"
 NZL_restart_the_onekaka_ironworks: "オネカカ製鉄所の再稼働"
 NZL_restart_the_onekaka_ironworks_desc: "オネカカ製鉄所はかつて、鉄と鋼を国内生産し、国外供給への依存度を減らすという我々の野心を体現していた。経済を活性化し、国家安全保障を強化するため、オネカカの高炉を再稼働することに関心が寄せられている。"
 NZL_new_zealand_steel_taog: "$NZL_new_zealand_steel$"
 NZL_new_zealand_steel_taog_desc: "$NZL_new_zealand_steel_desc$"
 NZL_scrap_metal_recycling: "再生利用キャンペーン"
 NZL_scrap_metal_recycling_desc: "我が国のような輸入依存経済には、戦略素材を浪費する余裕がない。経済的な強靭性を強化するため、金属やゴムを加工して再利用するためのスクラップ再生利用施設を設立すべきである。"
 NZL_domestic_car_industry: "車両組み立て工場への投資"
 NZL_domestic_car_industry_desc: "[ROOT.GetName]における車両生産は、外国の製造業者から輸送された部品の最終組み立てに限られていた。近年の国内製鉄への投資により、部品を自国で生産開始できる可能性が出てきた。"
 NZL_department_of_scientific_and_industrial_research_taog: "$NZL_department_of_scientific_and_industrial_research$"
 NZL_department_of_scientific_and_industrial_research_taog_desc: "$NZL_department_of_scientific_and_industrial_research_desc$"
 NZL_project_seal_taog: "$NZL_project_seal$"
 NZL_project_seal_taog_desc: "$NZL_project_seal_desc$"
 NZL_industrial_conscription_taog: "$NZL_industrial_conscription$"
 NZL_think_big_taog: "$NZL_think_big$"
 NZL_industrial_conscription_taog_desc: "$NZL_industrial_conscription_desc$"
 NZL_think_big_taog_desc: "$NZL_think_big_desc$"
 NZL_expand_the_university_of_auckland_taog: "$NZL_expand_the_university_of_auckland$"
 NZL_expand_the_university_of_auckland_taog_desc: "$NZL_expand_the_university_of_auckland_desc$"
 NZL_national_broadcasting_service: "国営放送サービス"
 NZL_national_broadcasting_service_desc: "1935年の選挙における郵便局の干渉および州の放送サービスに関する同局の手抜かりを鑑みると、組織運営の改革が必要なことは明白だ。加えて、使用する放送設備の最新化に向けた投資も行うべきである。"
 NZL_support_allies_with_meat: "食肉産業の活用"
 NZL_support_allies_with_meat_desc: "太平洋の同盟国はしばしば補給線を限界まで延長している。彼らの負担を軽減し、部隊に食糧を行き届かせるため、我々は食肉の供給を開始する。"
 NZL_support_allies_with_meat_tt: "すべての同盟国が§Yマップ外の民需工場§!を§G1§!つ獲得する"
 AST_COMINWEALTH_FACTION: "共産連邦"
 AST_cominwealth_tech_sharing_tt: "陣営内のすべての加盟国との§Y技術共有協定§!を締結する。"
