l_japanese:
 INS_nationalize_companies_tt: "すべての軍需産業組織と工業会社が国有化され、新たな名称が与えられる。"
 available_focus_tt: "§G利用可能§!な国家方針:\n"
 INS_is_union_tt: "オランダ・インドネシア連合を結成した"
 INS_is_union_tt_NOT: "オランダ・インドネシア連合を結成していない"
 INS_denounce_soetardjo: "スタルジョの糾弾"
 INS_denounce_soetardjo_tt: "我々は地下革命の計画を開始する。政府に潜入し、群島全域にゲリラ組織を設立する。準備が整えば、オランダから独立するためのゲリラ戦争を開始する。"
 INS_soetardjo_petition_debate_done_tt: "自治権を求めたスタルジョ請願に関するフォルクスラートの議論が終了した"
 INS_tkr_tt: "§Y人民治安軍§!に以下の補正:"
 INS_commander_sudirman_tt: "§Yスディルマン§!（[INS.GetFlag]）が§Y陸軍元帥§!に昇進する"
 INS_the_declaration_of_independence: "独立宣言"
 INS_the_declaration_of_independence_desc: "鉄は熱いうちに打たなければならず、これ以上リスクを冒して待つわけにはいかない！港、都市、工業の中心地に民兵を送り込み、オランダ当局に反応する時間を与えず、速やかに掌握すべきである。そして、我々は独立およびインドネシア共和国の樹立を宣言する。"
 INS_the_declaration_of_independence_tt: "我々は§Y独立§!を宣言する。§Y民兵基地§!または§Y司令部§!を設置したすべての州が我々の支配下に入り、それ以外は[HOL.GetNameDef]の支配下に残る。\n\n[HOL.GetNameDefCap]は我々の主権を認めず、低強度紛争が始まる。これは§R戦争§!に発展する可能性がある。\n\n州を奪取するための地上攻撃をアンロックする。"
 INSHOL_the_declaration_of_independence: "独立戦争"
 INS_laskar_rakjat: "ラスカル・ラヤット"
 INS_laskar_rakjat_desc: "この革命はインドネシア各地の大小様々な民兵組織によって構成されている。民兵を組織することは勝利のために欠かせない手順だが、性急になりすぎてはいけない。我々の政敵とつながりを持つ民兵を強化すれば、我々に破滅をもたらす可能性があるからだ。"
 INS_militia_tt: "新たに§Y自由の戦士§!民兵師団の師団編制を作成し、それらを管理するディシジョンをアンロックする。"
 INS_militia_warning_tt: "民兵は自由の戦士による§Y半自治§!集団である。彼らは我々のために戦うが、その支援は無償ではなく、その働きに対する報酬を期待する。§R要求が満たされない場合、安定度が大きく影響を受けることになる！§!"
 INS_usa_tanks_opinion_mod: "我々の戦車を購入した"
 INS_republic_add_generals_tt: "（§Y$INS_sudirman$§!（[INS.GetFlag]）、§Y$INS_soengkono$§!（[INS.GetFlag]）、§Y$INS_supriyadi$§!（[INS.GetFlag]）、§Y$INS_djatikoesoemo$§!（[INS.GetFlag]）、§Y$INS_maludin_simbolan$§!（[INS.GetFlag]））が将軍になる。"
 INS_big_militia_presence_tt: "独立宣言時に我々の民兵の支配下に入る。"
 INS_prepare_raiding_bases: "襲撃拠点を準備する"
 INS_prepare_raiding_bases_desc: "スパイ網を駆使し、群島全体に秘密裏に掩蔽壕を建設することで、革命が開始したらすぐさま襲撃できるよう準備を整えておく。"
 # <Joint Tree - Central Milestones>
 INSHOL_dutch_east_indies: "オランダ領東インド"
 INSHOL_dutch_east_indies_desc: "この植民地は約500年前に設立され、それ以来様々な形態をとってきた。世界は急速に変化しており、今我々が取る行動が今後の長きにわたるオランダとインドネシアの関係を左右することになる。"
 INSHOL_the_war_in_europe: "ヨーロッパでの戦争"
 INSHOL_the_war_in_europe_desc: "ヨーロッパにおける紛争は急速に激化しており、オランダは現在戦争中だ。我々はもはや彼らに保護されることを期待できず、自分の立場は自分で守らなければならない。さもなければ、外国勢力に制圧される危険がある。"
 # <Joint Tree - Military Equipment Contracts>
 INSHOL_military_equipment_contracts: "軍事装備品契約"
 INSHOL_military_equipment_contracts_desc: "オランダ領東インドは広大な群島であり、数千万人の市民を抱えている。我々の工業力では防衛に必要な生産量を到底確保することができない。しかし、我々には十分な資源があり、世界中で貿易を行うことができる。世界中の民主国家と契約を結べば、我々の問題は解決することができる。"
 INSHOL_hawk_75a7: "ホーク75A-7"
 INSHOL_hawk_75a7_desc: "アメリカのホーク75A-7戦闘機は東インドに最適な機体であり、低価格と高性能を兼ね備えている。製造者と契約を結べば、我が空軍が切実に必要としている強化を実現することができる。"
 INSHOL_purchase_american_tanks: "アメリカの戦車を購入する"
 INSHOL_purchase_american_tanks_desc: "オランダ領東インドは、戦車製造に必要な産業を有していないが、ゴム産業で得た資金を使い、アメリカから直接戦車を購入することはできる。"
 INSHOL_purchase_british_artillery: "イギリスの大砲を購入する"
 INSHOL_purchase_british_artillery_desc: "我々は大砲の製造をイギリスに外注することができ、他の装備の生産に注力することができる。"
 INSHOL_produce_own_goods: "国産品を製造する"
 INSHOL_produce_own_goods_desc: "我々は貿易によって十分な利益を確保することができるが、国内の製造ラインや軍需産業の企業をおろそかにしてはならない。これらの企業に補助金を与え、輸入への依存度を低下させるべきである。"
 # <Joint Tree - East Indies Investments>
 INSHOL_east_indies_investments: "オランダ領東インドへの投資"
 INSHOL_east_indies_investments_desc: "優れた宗主国は植民地の開発に投資するものである。オランダ領東インドの経済開発に投資することは、我々に大きな利益をもたらすと同時に、植民地の住民にとっても有益である。"
 INSHOL_east_indies_student_exchange: "オランダ領東インドの交換留学プログラム"
 INSHOL_east_indies_student_exchange_desc: "インドネシア人がオランダの大学で学ぶことができる制度を創設すれば、オランダとインドネシアの双方の経済に大きな恩恵をもたらすことになる。"
 INSHOL_east_indies_fokker_division: "フォッカー社東インド支部の設立"
 INSHOL_east_indies_fokker_division_desc: "東インド航空隊には十分な数のフォッカー機がライセンス提供されている。東インド航空隊を優先する専用の子会社設立を検討する価値がある。"
 INSHOL_expand_shell: "シェルのインフラ拡張"
 INSHOL_expand_shell_desc: "シェルは我々の経済において徐々に大きな部分を占めつつある。シェルの輸出能力に追いつくため、東インドの石油インフラを拡張しなければならないのは明らかだ。"
 INSHOL_increase_funding_for_tix: "T.IX航空機計画の資金を増額する"
 INSHOL_increase_funding_for_tix_desc: "フォッカー社の技術者が新型双発爆撃機の開発に取り組んでいる。これは、東インド航空隊が使用している旧式機の代わりになるものだ。この計画の予算はわずかで、完成までに非常に長い時間がかかるだろう。資金を増額することにより、進捗を大幅に速めることができる。"
 INSHOL_reduce_land_ownership_taxes: "土地所有税を減税する"
 INSHOL_reduce_land_ownership_taxes_desc: "インドネシアの住民による土地所有にかかる税金を減税し、農業や事業の発展を奨励すべきだ。"
 INSHOL_coffee_plantations: "コーヒー農園"
 INSHOL_coffee_plantations_desc: "東部諸島で国有地を増やすことに注力すべきだ。この土地を利用して、コーヒー農園を設立することができる。"
 INSHOL_overallwagen: "オーフェルファルワーゲン"
 INSHOL_overallwagen_desc: "東インド陸軍にとって、戦車は必ずしも解決策にならない。我々には戦車の製造に必要な工業力が欠けており、険しい地形がその用途を限定する。インドネシア向け装甲車の生産に投資することで、この不足を補うことができるかもしれない。"
 INSHOL_indonesian_cheap_labor: "インドネシアの低賃金労働力"
 INSHOL_indonesian_cheap_labor_desc: "$CONGO_cheap_labor_desc$" #LL: stealing this to save time, hope you don't mind!
 INSHOL_eastern_development_fund: "東部諸島開発基金"
 INSHOL_eastern_development_fund_desc: "我々はジャワ島とスマトラ島への投資に集中し過ぎており、植民地の大半の土地を無視している。将来の工業化を可能にするため、東部のインフラ開発に取り組まなければならない。"
 INSHOL_increase_rubber_taxes: "ゴム税の増税"
 INSHOL_increase_rubber_taxes_desc: "東インドのたくさんのゴム企業が植民地の資源を利用して莫大な富を得ている。これらの事業に重い税金を課すのは当然のことだ。"
 INSHOL_reform_knil: "王立オランダ領東インド陸軍の改革"
 INSHOL_reform_knil_desc: "東インドが群島全体の征服を完了して以来、王立オランダ領東インド陸軍の動きはないままであり、資金不足が深刻である。世界的な緊張は高まっており、我々は東インドの再軍備を早急に始めなければならない。"
 INSHOL_fund_ml_knil: "王立オランダ領東インド陸軍航空隊への資金提供"
 INSHOL_fund_ml_knil_desc: "世界の軍隊に追いつくためには、我々自身も本格的な空軍を設立しなければならない。さもなければ、大きな不利を被ることになる。"
 INSHOL_bandung_aircraft_facility_tt: "§Y西ジャワ:§!\n    前提となる国家方針を完了するごとに建築スロットを§G1つ§!、§Y軍需工場§!を§G1つ§!追加する。"
 INSHOL_rangers: "レンジャー部隊"
 INSHOL_rangers_desc: "東インドは群島で構成された広大な領土であり、多様な環境を有している。これらの島々を確実に防衛するため、過酷な環境下での戦闘に適応したレンジャー部隊を養成すべきである。"
 INSHOL_mountaineers: "山岳兵"
 INSHOL_mountaineers_desc: "群島国家として、その厳しい地形での戦闘に適応した山岳兵部隊を養成すべきである。"
 INSHOL_elevate_elite_infantry: "デポ・スペシアレ・トローペン"
 INSHOL_elevate_elite_infantry_desc: "いつまでも先の大戦の戦略に頼ることはできない。我々は新しい技術に適応しなければならず、後れを取ってはならない。あらゆる環境下で領土を防衛できる精鋭歩兵師団をいくつか編成すべきである。"
 INSHOL_modernize_knil: "王立オランダ領東インド陸軍の近代化"
 INSHOL_modernize_knil_desc: "王立オランダ領東インド陸軍のために新たな戦略とドクトリンを研究すれば、敵に対する優位性を確実に維持できる。"
 INSHOL_transfer_of_henri_winkelman: "ヘンリー・ヴィンケルマンの転属"
 INSHOL_transfer_of_henri_winkelman_desc: "ヘンリー・ヴィンケルマンはかつて、何年にもわたって王立オランダ領東インド陸軍に所属していた。東インドが再び彼を必要としているのは明らかだ。彼を正式に東インドに転属させる手配をすべきである。"
 INSHOL_eastern_conscription: "補助部隊を編成する"
 INSHOL_eastern_conscription_desc: "ジャワ島およびマドゥラ島には地域の藩王が支配する地元の補助部隊がいくつか存在する。この危機的な状況下で、これらの師団が我々の支配下に入るよう地元の統治者と交渉し、協定を結ぶことができる。"
 INSHOL_establish_vk_knil: "王立オランダ領東インド陸軍女性部隊の設立"
 INSHOL_establish_vk_knil_desc: "王立オランダ領東インド陸軍に女性義勇軍を設立する。彼女たちの貢献は我々の兵站と通信を改善するために重要な役割を果たす。"
 INSHOL_emergency_dockyard_construction: "緊急の造船所建設"
 INSHOL_emergency_dockyard_construction_desc: "強襲上陸の脅威を侮ることはできず、我々は海軍防御を最優先しなければならない。"
 INSHOL_emergency_powers_gov_general: "総督への非常権限付与"
 INSHOL_emergency_powers_gov_general_desc: "進行中の戦争により、難しい決断を遅滞なく下す必要に迫られている。東インドにおけるすべての決断を事前にオランダで決裁するのは不可能であり、[INS.GetLeader]に非常権限を与えて遅滞なく行動できるようにすべきである。"
 INSHOL_emergency_naval_purchases: "海軍緊急調達"
 INSHOL_emergency_naval_purchases_desc: "我が領土の沿岸部は危険にさらされており、防衛は不十分だ。海軍を強化しなければ、我々が滅ぶのも時間の問題である。借入金により民間企業から艦船を購入し、これを駆逐艦に改装しよう。"
 INSHOL_east_indies_navy: "東インド海軍"
 INSHOL_east_indies_navy_desc: "[INS.GetNameDefCap]には正式な海軍がなく、植民地防衛はオランダに委ねられている。欧州とアジアの緊張が高まる中、この体制は維持できない。独自の[INS.GetAdjective]海軍創設に向け、第一歩を踏み出さなければならない。"
 INSHOL_marines: "海兵隊"
 INSHOL_marines_desc: "新たな海軍の下に専任の東インド海兵隊を設立し、訓練中の海兵隊員をオランダの艦船に派遣して学ばせるべきである。"
 INSHOL_domestic_ship_production: "国内の艦船製造"
 INSHOL_domestic_ship_production_desc: "近隣諸国に対抗可能な海軍を築くためには、国内での艦船製造を強化し始めなければならない。"
 INSHOL_destroyers: "駆逐艦"
 INSHOL_destroyers_desc: "我々の大型軍艦は、護衛艦の援護なしに群島の狭い海域で行動できない。近代的な駆逐艦を建造すれば、[ROOT.GetAdjective]海軍は海上交通路を守り、海峡を渡る魚雷艇を撃退できる。"
 INSHOL_cruisers: "巡洋艦"
 INSHOL_cruisers_desc: "戦艦を持たない艦隊は、巡洋艦を主力に据えざるを得ない。強力な巡洋艦戦隊を整備すれば、[ROOT.GetAdjective]海軍は島々の間に広がる長距離海域を哨戒し、我が海域に侵入する通商破壊艦に対処できる。"
 INSHOL_submarines: "潜水艦"
 INSHOL_submarines_desc: "東インドの海峡は待ち伏せに適しており、潜水艦は沈める軍艦よりはるかに安く済む。強力な潜水艦部隊があれば、[ROOT.GetAdjective]海軍は海上交通路を守り、姿を見せずに敵輸送船を叩ける。"
 INSHOL_outsourced_navy: "企業への生産委託"
 INSHOL_outsourced_navy_desc: "我々の支出はすでに十分多く、植民地予算をこれ以上海軍へ振り向け続けることはできない。企業に報酬を支払い、我々に代わって生産を担わせることは可能だ。"
 INSHOL_divert_civilian_to_navy: "民需支出および陸軍支出の海軍への転用"
 INSHOL_divert_civilian_to_navy_desc: "現在の世界情勢では、強襲上陸のリスクがかつてないほど高まっている。出費を惜しむ余裕はない。政府のあらゆる部門から資金を海軍へ転用しなければならない。"
 INS_netherlands_can_remove_autonomy_tt_50: "\n[HOL.GetFlag]§Y[HOL.GetNameDefCap]§!がこの国家方針を先に完了した場合:\n    （[INS.GetFlag]§Y[INS.GetName]§!）: §Y£autonomy_texticon -50.00§!"
 INS_netherlands_can_remove_autonomy_tt_75: "\n[HOL.GetFlag]§Y[HOL.GetNameDefCap]§!がこの国家方針を先に完了した場合:\n    （[INS.GetFlag]§Y[INS.GetName]§!）: §Y£autonomy_texticon -75.00§!"
 INS_netherlands_can_remove_autonomy_tt_100: "\n[HOL.GetFlag]§Y[HOL.GetNameDefCap]§!がこの国家方針を先に完了した場合:\n    （[INS.GetFlag]§Y[INS.GetName]§!）: §Y£autonomy_texticon -100.00§!"
 INS_netherlands_can_remove_autonomy_tt_150: "\n[HOL.GetFlag]§Y[HOL.GetNameDefCap]§!がこの国家方針を先に完了した場合:\n    （[INS.GetFlag]§Y[INS.GetName]§!）: §Y£autonomy_texticon -150.00§!"
 INS_netherlands_can_remove_autonomy_tt_200: "\n[HOL.GetFlag]§Y[HOL.GetNameDefCap]§!がこの国家方針を先に完了した場合:\n    （[INS.GetFlag]§Y[INS.GetName]§!）: §Y£autonomy_texticon -200.00§!"
 INS_netherlands_can_remove_autonomy_tt_250: "\n[HOL.GetFlag]§Y[HOL.GetNameDefCap]§!がこの国家方針を先に完了した場合:\n    （[INS.GetFlag]§Y[INS.GetName]§!）: §Y£autonomy_texticon -250.00§!"
 INSHOL_begin_negotiations_soetardjo: "スタルジョとの交渉開始"
 INSHOL_begin_negotiations_soetardjo_desc: "自治権を求めたスタルジョ請願は承認される見込みが高く、民族主義者と王政支持者が歩み寄るチャンスである。彼の政党と正式な交渉を開始すべきだ。"
 INSHOL_urge_gov_veto: "総督に拒否権を行使させる"
 INSHOL_urge_gov_veto_desc: "スタルジョ請願は東インド政府を騙す民族主義者の策略である。すぐに総督に拒否権を行使させなければならない。さもなければ、我々が植民地を失うリスクがある。"
 INSHOL_eventual_autonomy: "将来的な自治への同意"
 INSHOL_eventual_autonomy_desc: "インドネシアの独立願望は強く、弱まる気配がない。我々は東インドの将来的な自治に同意はするが、これは植民地が自立可能だと証明された場合に限られ、民主主義の理想を維持し続けることが条件だ。"
 INSHOL_autonomous_dominion: "[GetYear]年スタルジョ法"
 INSHOL_autonomous_dominion_desc: "オランダはスタルジョ請願が有効となる条件として不合理な「自立」の定義を押し付けてきたが、インドネシアの独立への願いは強く、我々はその要件を満たすことに成功した。合意に従い、我々はオランダ王室からの完全かつ無条件の独立を宣言する。"
 INS_cannot_become_independent_tt: "§W§Y[INS.GetFlag][INS.GetNameDefCap]§!は外国の介入なしには§R永久に独立できなくなる。§!§!"
 INSHOL_sideline_the_volksraad: "フォルクスラートの決議を拒否する"
 INSHOL_sideline_the_volksraad_desc: "スタルジョが提出した請願はオランダ憲法第1条に明確に違反している。東インド政府に困難をもたらすものでしかなく、拒否権を行使しなければならない。"
 INSHOL_prioritize_dutch_profits: "オランダの利益を優先する"
 INSHOL_prioritize_dutch_profits_desc: "我々は本国の利益を増大させる取り組みに注力する。本国の経済的安定は王国全体の利益になる。"
 INSHOL_development_loans_netherlands: "オランダからの開発融資"
 INSHOL_development_loans_netherlands_desc: "工業化に向けた我々の取り組みを加速させるため、オランダの企業から融資を受けることができる。発展途上の植民地なので低い利率が保証されるが、それでもなお利息を払う必要がある。"
 INSHOL_request_economic_dev_subsidy: "経済開発補助金を要求する"
 INSHOL_request_economic_dev_subsidy_desc: "我々は収益性の高い植民地としての価値を宗主国に証明してきた。これを交渉材料とし、産業開発補助金を手にすることができる。"
 INSHOL_loyalty_to_crown: "王室への忠誠"
 INSHOL_loyalty_to_crown_desc: "東インドには様々な側面があるが、何よりも我々はオランダに忠誠を誓う植民地である。ウィルヘルミナ女王が我々を勝利に導くだろう。民族主義が約500年の歴史を終わらせることは許容できず、我々は王室への絶対的な忠誠を誓い続けなければならない。"
 INS_loans_timer: "\n§Y365§!日後:"
 INS_expand_batavia_med_school_tt: "§Y$INS_dutch_east_indies$§!: 研究速度補正が§G1.00%§!以上である。"
 INS_subsidize_local_business: "地元企業を援助する"
 INS_subsidize_local_business_desc: "経済成長を刺激するため、地元企業に補助金を出すべきだ。これにより、長期的には経済が活性化する。"
 INSHOL_education_reforms: "教育改革"
 INSHOL_education_reforms_desc: "東インドの多くの住人は教育を受ける機会がなく、中等学校を卒業した者はごくわずかである。東インドを豊かな工業国家にしたいのであれば、住民が適切な教育を受けられるようにしなければならない。"
 INS_expand_batavia_med_school: "バタビア医学校の拡張"
 INS_expand_batavia_med_school_desc: "バタビア医学校に新たなキャンパスを建設し、より多くの教授を雇用して拡張すれば、さらなる教育をより受けやすくなる。これは長期的な経済成長に不可欠である。"
 INS_prepare_for_policy_shift: "政策の転換に備える"
 INS_prepare_for_policy_shift_desc: "東インドの政治情勢は過去数十年の民族覚醒の影響を受けており、我々の現在の政策は明らかに時代遅れだ。我々の統治構造にある程度の変更を加えることを検討すべきである。"
 INS_reallocate_rubber_industry_funding: "ゴム産業の資金を再配分する"
 INS_reallocate_rubber_industry_funding_desc: "ゴム販売への依存は我々の経済に悲惨な影響をもたらした。経済を多様化するために、群島全域で資源の試掘、鉱山開発、工場の開設に取り組むべきである。実施するには相応の資金が必要になるので、ゴム農園を維持するための予算を削減しなければならない。"
 INS_reallocate_rubber_industry_funding_tt: "§Y州からゴムを排除§!し、より少量の§Y他の資源§!で置き換えるディシジョンをアンロックする。"
 INSHOL_nationalist_coallition: "民族主義者連合"
 INSHOL_nationalist_coallition_desc: "フォルクスラートは長きにわたり一つの声で語ってきたが、その声はあまりにも弱かった。請願と忍耐強い先送りの時代は終わった。議場内の民族主義者議員たちは相互の対立を脇に置き、無条件の独立を要求するだろう。議場の外にいる古参の声、かつてオランダが安全に排除したと思っていた男たちも、再び仲間に迎え入れられる。"
 INSHOL_volksraad_compromises: "フォルクスラートの妥協"
 INSHOL_volksraad_compromises_desc: "議場内の改革は我々をここまで導いてきた。今になってこの道を放棄する理由はない。フォルクスラートは今後も慎重な取り組みを続け、ハーグと譲歩を重ねながら、断絶ではなく忍耐によって自治を追求するだろう。オランダ連邦の内側にある未来は、その外側を目指して戦う未来よりも多くのものをもたらす。"
 INSHOL_establish_the_princely_council: "王侯評議会の設立"
 INSHOL_establish_the_princely_council_desc: "群島のスルタンやラージャは、バタヴィアの議場が決して得られなかった忠誠を集めている。彼らの宮廷は東インド会社よりも古く、それを継いだ共和国よりも古い。王侯諸家による正式な評議会は、これらの統治者に新国家の席を与え、その権威を我々のものと結び付けるだろう。"
 INSHOL_nationalize_dutch_companies: "オランダ企業を国有化する"
 INSHOL_nationalize_dutch_companies_desc: "大商館、海運会社、大農園事業、銀行は、誰もが覚えているかぎりずっとオランダ名を掲げてきた。これからはインドネシア名を掲げることになる。取締役会は刷新され、看板は取り外され、三世紀にわたってこの群島から吸い上げられてきた資本は、ついに群島そのもののものとなる。"
 INSHOL_democracy: "民主的なインドネシア"
 INSHOL_democracy_desc: "フォルクスラートは当初、中途半端な存在として生まれた。権限を慎重に制限された諮問機関であり、実質を与えずに代表制の外観だけを示すためのものだった。しかし、それは作り手たちの想定を超えて成長した。議場は真の立法府として再編され、自らが代表すると称する人民によって議員が選ばれ、その決定は、かつてフォルクスラートを短い鎖につないでいた政府を拘束することになる。"
 INSHOL_princely_authority: "王侯の権威"
 INSHOL_princely_authority_desc: "諮問評議会も、それにふさわしい役割を果たすかぎりは有用である。だが、この国の建国に名を貸したスルタンたちは、名以上のものを差し出してくれるかもしれない。議会は、彼らの一人を他の者たちの上に立たせようとする者たちの妨げにはならない。古き宮廷は、この問いが再び自分たちに向けられるのを長い間待ち続けてきた。"
 INSHOL_encourage_further_investment: "さらなる投資の奨励"
 INSHOL_encourage_further_investment_desc: "フォルクスラートで合意された条件により、政治問題は当面落ち着き、オランダ資本もそれに注目している。関税は緩和され、保証は拡大され、アムステルダムとロッテルダムの商工会議所には、群島が引き続き事業に開かれていると安心させることになる。旧体制下で利益を生んだものは、新体制下でも利益を生むだろう。"
 # <Joint Tree - ABDACOM>
 INSHOL_east_indies_artillery: "東インドでの大砲製造"
 INSHOL_east_indies_artillery_desc: "ジャワ島に大砲製造施設を開設すれば、我々の軍事的取り組みにおける外国との貿易への依存度を減らすことができる。"
 INSHOL_recall_gerardus_johannes_berenschot: "ベレンスホット将軍を呼び戻す"
 INSHOL_recall_gerardus_johannes_berenschot_desc: "ヘラルドゥス・ヨハネス・ベレンスホットはオランダ全体で最も才能のある将軍の一人だ。彼は経歴の大半を東インドで過ごしたが、数年間はオランダで過ごしたこともある。この危機的な時代に彼を東インドに呼び戻し、戦争努力を支援させなければならない。"
 INSHOL_east_indies_cruiser_manufacturing: "東インドでの巡洋艦製造"
 INSHOL_east_indies_cruiser_manufacturing_desc: "巡洋艦をオランダに直接発注する代わりに、我々が自らこれを製造することが真の海軍を作る上での第一歩であり、日本の脅威を考慮すれば、欠かせない取り組みである。"
 INSHOL_transfer_of_conrad_helfrich: "コンラート・ヘルフリフを東インドに転属させる"
 INSHOL_transfer_of_conrad_helfrich_desc: "コンラート・ヘルフリフ提督を直接東インドに転属させれば、東インドでの海軍の取り組みを劇的に改善することができる。"
 # <Joint Tree - Naval Program>
 INSHOL_naval_program: "オランダ・インドネシア海軍計画"
 INSHOL_naval_program_desc: "東インド海軍は、植民地海軍を含む他の海軍に大きく後れを取っている。迅速な発展を確実にするため、この新海軍の育成を我々が支援することは、すべての当事者にとって最善である。"
 INSHOL_naval_program_transfer_25_tt: "海軍の§Y25%§!を[INS.GetNameDef]に移管する。"
 INSHOL_naval_program_transfer_25_2_tt: "§Y[HOL.GetFlag][HOL.GetNameDefCap]§!は海軍の§Y25%§!を§Y[INS.GetNameDefCap]§!に移管する。"
 INSHOL_naval_program_transfer_100_tt: "§R海軍全体§!を[INS.GetNameDef]に移管する。"
 INSHOL_naval_program_transfer_100_2_tt: "§Y[HOL.GetFlag][HOL.GetNameDefCap]§!は海軍全体を§Y[INS.GetNameDefCap]§!に移管する。"
 INSHOL_naval_program_rejected_tt: "国家方針、§Y$INSHOL_naval_secondchance$§!をアンロック。"
 INSHOL_hybrid_navy: "混成海軍"
 INSHOL_hybrid_navy_desc: "我が海軍は[HOL.GetNameDef]の太平洋艦隊を引き継ぐことだけに依存することはできず、自らの艦船の製造に着手しなければならない。さもなければ、一つの失敗で海軍補給のすべてを遮断されかねない。"
 INSHOL_request_naval_control: "東インド艦隊"
 INSHOL_request_naval_control_desc: "[HOL.GetNameDefCap]は陥落し、海軍全体を指揮できる状態ではない。戦争終結までは、我々が海軍の指揮権を引き継ぐべきである。"
 INSHOL_naval_secondchance: "東インド海軍計画"
 INSHOL_naval_secondchance_desc: "[HOL.GetNameDef]は海軍の指揮権譲渡を拒否したが、我々は引き続き太平洋を防衛する必要があり、さもなければ制圧される恐れがある。我々の提案が受け入れられた場合ほどうまくいかないかもしれないが、十分機能する代替案を見つけることになるだろう。"
 # <Joint Tree - Netherlands in Exile>
 INSHOL_netherlands_in_exile: "亡命オランダ王国"
 INSHOL_netherlands_in_exile_desc: "王国陥落の悲劇は今、現実のものとなった。我々は敗北主義にまで落ちるわけにはいかない。起こったことを受け入れ、取り戻せるものを取り戻すことに集中しなければならない。"
 # INSHOL_relocate_prime_minister: "Relocate the Prime Minister to Java"
 INSHOL_relocate_our_generals: "陸軍をジャワ島に移転する"
 INSHOL_relocate_our_generals_desc: "残存する亡命将軍、指揮官、残留兵を手遅れになる前に最優先で[1058.GetName]に移動させなければならない。"
 #INSHOL_relocate_our_soldiers: "Transfer Holdout Soldiers to Java"
 INSHOL_netherlands_indonesia_union: "オランダ・インドネシア連合"
 INSHOL_netherlands_indonesia_union_desc: "[HOL.GetNameDef]と[INS.GetNameDef]が平等な連合国家を形成するなど、多くの者にとってはばかばかしい考えだ。しかし、我々が置かれた危機的状況下では、主権を維持する可能性を最大化するための唯一の手段に思える。"
 # <Sukarno Shared Branch - Resistance Buildup>
 INS_underground_revolution: "地下革命"
 INS_underground_revolution_desc: "我々は陰に隠れて革命計画を開始する。構成員の人数と民兵の活動をゆっくりと増加させ、準備が整えば攻撃を開始する。"
 INS_infiltrate_the_media: "報道機関への潜入"
 INS_infiltrate_the_media_desc: "我々は運動を通じ、東インドの報道機関の重役数名の協力を取り付けた。これを利用すれば、市民の心に密かに革命支持感情を植え付けることができる。"
 INS_infiltrate_the_army: "陸軍への潜入"
 INS_infiltrate_the_army_desc: "我々の構成員の多くが王立オランダ領東インド陸軍に入隊しており、下級兵士から少佐まで様々な階級を占めている。我々は可能な限りの機密情報を収集しつつ、同志をより高い階級に昇進させるべきである。ひとたび引き金を引けば、我々は王立オランダ領東インド陸軍に混乱を引き起こすことができる。"
 INS_privately_owned_military_industry: "民営軍需産業"
 INS_privately_owned_military_industry_desc: "軍需産業分野にいくつかの影の企業を設立し、革命が始まった後も軍需産業の支配を維持できるようにする。"
 INS_privately_owned_military_industry_tt: "§G2§!つの§Y軍需工場§!を陸軍司令部に追加する"
 INS_instigate_chaos_sulawesi: "スラウェシ島で混乱を引き起こす"
 INS_instigate_chaos_sulawesi_desc: "スラウェシ島で地元の民族主義者と協力し、ストライキや暴動を企て、民衆の急進化を進める。"
 INS_instigate_chaos_sulawesi_tt: "我々が独立を宣言すれば、§Y[673.GetName]§!と§Y[1056.GetName]§!を§G中核州§!として獲得する。これらはオランダ領東インドの中核州とはならない。"
 INS_instigate_chaos_medan: "メダンで混乱を引き起こす"
 INS_instigate_chaos_medan_desc: "メダンとリアウで地元の民族主義者と協力し、ストライキや暴動を企て、民衆の急進化を進める。"
 INS_instigate_chaos_medan_tt: "我々が独立を宣言すれば、§Y[1049.GetName]§!を§G中核州§!として獲得する。これはオランダ領東インドの中核州とはならない。"
 INS_embezzlement_scheme_in_batavia: "バタビアにおける横領計画"
 INS_embezzlement_scheme_in_batavia_desc: "独立宣言と同時に、バタビアから共和国領土に生産を移転させる計画を策定する。"
 INS_embezzlement_scheme_in_batavia_tt: "独立宣言と同時に、§Y[1058.GetName]§!にある工場の半分を我々の§Y革命本部§!に移転させる。"
 INS_volksraad_rumors: "フォルクスラート内での噂話"
 INS_volksraad_rumors_desc: "フォルクスラート内で革命に関する慎重な協議を開始する。成功すれば、フォルクスラートのインドネシア人議員を説得し、我々の大義に引き込むことができる。"
 INS_volksraad_rumors_tt: "独立宣言後、§Yインドネシア人§!のフォルクスラート顧問は全員§G留任§!する。"
 INS_railway_youth_force: "鉄道青年隊との協力"
 INS_railway_youth_force_desc: "鉄道青年隊は主に中部ジャワで活動するイスラム青年民兵組織であり、鉄道を掌握する彼らの戦略からその名が付けられた。彼らは有力な同盟相手になる一方で、活動的で好戦的な側面もあり、停戦状態があまりにも長く続くと政府に不満を持つようになるだろう。"
 INS_sleeper_informant_network: "[GetInformantNetworkName]"
 INS_Sleeper_Informant_Network_name: "潜伏情報提供者ネットワーク"
 INS_KNIL_Informant_Network_name: "王立オランダ領東インド陸軍情報提供者ネットワーク"
 INS_sleeper_informant_network_desc: "王立オランダ領東インド陸軍の行政機構全体に組み込まれた情報提供者ネットワークを構築し、敵の計画を事前に察知できるようにする。"
 INS_sleeper_informant_network_tt: "§R独立が宣言された場合:§!\n"
 # <Sukarno Shared Branch - Peoples Security Army>
 INS_the_peoples_security_army: "人民治安軍"
 INS_the_peoples_security_army_desc: "我々の構成員の大半を占める若いインドネシア人たちは、独立のために貢献して戦うことを熱望しており、焦燥感を強めている。革命武装勢力を結成し、将来の兵士の訓練を開始すべきである。"
 INS_commander_sudirman: "スディルマンの軍"
 INS_commander_sudirman_desc: "スディルマンは若いながらも将来有望な人物で、高い潜在能力を示しており、レジスタンスの若い構成員の間で絶大な人気を誇っている。彼が人民治安軍の進むべき道を先導すべきであり、我々を勝利に導くべきである。"
 INS_commander_oerip: "ウリップの軍"
 INS_commander_oerip_desc: "ウリップは数十年間陸軍に勤務し、王立オランダ領東インド陸軍で少佐に昇進した唯一のインドネシア人である。彼の知識と経験はあらゆる構成員を凌駕している。彼が人民治安軍の進むべき道を先導すべきであり、我々を勝利に導くべきである。"
 INS_sudirmans_promotion: "スディルマンの昇進"
 INS_sudirmans_promotion_desc: "スディルマンは優れた指導力を示し、いくつもの攻撃を成功に導いてきた。我らが指揮官の功績を認め、彼にふさわしい将軍の称号を授ける時である。"
 INS_tkr_steal_general: "王立オランダ領東インド陸軍の将軍を引き抜く"
 INS_tkr_steal_general_desc: "東インド陸軍の階級が高い構成員を説得し、我々の大義に参加させることができれば、我が軍を強化すると同時に敵を妨害することができる。"
 INS_tkr_supply: "すべての革命家は戦わなければならない"
 INS_tkr_supply_desc: "我々の運動に参加するすべての構成員には正式な軍事訓練を例外なく受けてもらう。"
 INS_tkr_professional_army: "常備軍"
 INS_tkr_professional_army_desc: "民兵ばかりに依存してはならず、秩序を維持するために共和国常備軍を編成すべきである。"
 INS_arm_the_revolutionaries: "革命家たちを武装させる"
 INS_arm_the_revolutionaries_desc: "活力に満ち、インドネシアのためにすべてを捧げる覚悟のある革命家と民族主義者から始めなければならない。彼らが祖国のために戦えるよう、必要な訓練と装備を提供しよう。"
 INS_arm_the_youth: "青年たちを武装させる"
 INS_arm_the_youth_desc: "革命家の次は青年たちを武装させなければならない。彼らはなお活力と希望に満ちており、革命の炎を受け継いでくれるだろう。可能な限り多くのインドネシア青年に、戦闘に必要な訓練と装備を確保しなければならない。戦闘が自らの故郷に及べば、彼らは即座に行動するだろう。"
 INS_arm_the_students: "学生たちを武装させる"
 INS_arm_the_students_desc: "学生たちは数十年前から革命の基盤を築いてきた。そして、これを前進させ続けるだろう。"
 INS_guerilla_industry: "ゲリラ産業"
 INS_guerilla_industry_desc: "群島全体に展開するゲリラ部隊を活用し、工場を掌握することで、民兵を武装させるための新たな銃器を生産できるようになる。"
 INS_indonesian_assault_doctrine: "インドネシアの突撃ドクトリン"
 INS_indonesian_assault_doctrine_desc: "戦争は兵士だけで成り立つものではない。100万人の兵士がいても、携行させる銃がなければ意味がない。我々は敵が支配する領土の奥深くまで進軍するため、高品質な火砲の確保を優先しなければならない。"
 INS_tighter_tkr_integration: "人民治安軍とラスカル・ラヤットの強固な統合"
 INS_tighter_tkr_integration_desc: "人民治安軍と多様な民兵組織は団結して行動しておらず、連携も限定的だ。戦争が続くにつれて、この状況がさらに多くの問題を引き起こすだろう。我々は軍と民兵を一つの統一組織に統合する必要がある。たとえ、民兵将校からの抗議が避けられないとしてもだ。"
 INS_quality_over_quantity: "量より質"
 INS_quality_over_quantity_desc: "考え抜かれた戦略と近代的装備を備えた熟練の兵士1名は、拳銃を携えた5名の学生を打ち破る。我々は数多くの兵士を動員するよりも、質が高くて十分に武装した兵士および特殊部隊を優先しなければならない。"
 INS_add_militia_cap_1_tt: "§Y自由の戦士§!師団の上限が§Y1§!増加する。\n"
 INS_add_militia_cap_2_tt: "§Y自由の戦士§!師団の上限が§Y2§!増加する。\n"
 INS_add_militia_cap_3_tt: "§Y自由の戦士§!師団の上限が§Y3§!増加する。\n"
 INS_add_3_militia_unit_tt: "§Y自由の戦士§!を3ユニット作成する。これらは§Y襲撃§!に使用でき、オランダの州における§G民兵の存在感§!を高める。"
 INS_add_fully_trained_militia_unit_tt: "訓練済みの§Y自由の戦士§!1ユニットを作成する。\n"
 # <Sukarno Shared Branch - Expand Resistance Membership>
 INS_expand_resistance_membership: "レジスタンスの構成員を拡大する"
 INS_expand_resistance_membership_desc: "我々の運動全体を一つの基地に集中させれば確実に失敗する。構成員を複数の民兵組織に編成し、各地に使者として派遣すれば、現地における支持拡大と影響力の強化につながる。"
 # <Central Independence Branch - Militias>
 INS_deploy_the_kris: "スラウェシ島のインドネシア人民奉仕団"
 INS_deploy_the_kris_desc: "スラウェシ島のインドネシア人民奉仕団はインドネシア語でKRISとして知られる活発な民兵組織であり、スラウェシ島およびマナドにおける民兵勢力の大部分を構成している。彼らを徴募し、正式に人民治安軍と共闘させるべきである。"
 INS_assist_the_pemuda: "青年活動家たちを支援する"
 INS_assist_the_pemuda_desc: "ジャワ島には様々な青年学生民兵が溢れている。彼らと協力し、オランダに対する彼らの任務に軍事支援を提供することで、有用な同盟相手を確保できるかもしれない。"
 INS_mobilize_the_pemuda: "青年活動家たちを動員する"
 INS_mobilize_the_pemuda_desc: "最大規模の青年組織の信頼を獲得した今、彼らを人民治安軍に動員する計画を開始すべきだ。"
 INS_organize_jakarta_pemuda: "ジャカルタの青年活動家たちを組織化する"
 INS_organize_jakarta_pemuda_desc: "ジャワ島には大小様々な青年活動家の組織が存在する。我々はその大半を動員および徴募してきたが、ジャカルタにはいまだに独立して活動する小規模な組織が数十残っている。彼らに連絡を取り、協力関係を構築しなければならない。"
 INS_recognize_moestopos_batallion: "モエストポ大隊を評価する"
 INS_recognize_moestopos_batallion_desc: "革命家のモエストポがスラバヤで「国防大臣代行」を自称し、スラバヤにおける民兵勢力の統制を維持している。彼の尽力は正式な評価に値し、人民治安軍の少将に正式に昇進させるべきである。"
 INS_darul_islam_focus: "ダルル・イスラム"
 INS_darul_islam_focus_desc: "カルトスウィルヨのヒズボラは西ジャワの丘陵でその実力を証明しており、彼らのような戦士を我々の戦列に加えないわけにはいかない。彼が率いる非正規兵を我が軍に加え、彼が持つ階級を我が軍でも認めよう。信仰に忠実な者たちは、いずれ共和国で自らの主張を通すことになるだろう。"
 # <Central Independence Branch - Navy>
 INS_just_a_fisherman: "ただの漁師か"
 INS_just_a_fisherman_desc: "群島での戦争を海軍なしに戦うのは困難で、長く維持できるものではない。我々は無謀とも思える戦略に挑戦する。漁師に扮した民兵を漁船に乗せ、オランダが支配する港に送り込むのだ。"
 INS_a_cheap_navy: "安価な海軍"
 INS_a_cheap_navy_desc: "我々には大規模で近代的な海軍を編成する時間も資金もない。持っているものでやりくりし、見つけたものを何でもかき集めなければならない。"
 INS_divert_army_funds_to_navy: "陸軍資金を海軍に転用する"
 INS_divert_army_funds_to_navy_desc: "インドネシアは群島であり、歩兵は輸送する艦船なしでは機能しない。人民治安軍の資金を新たな海軍に転用するのは価値のある犠牲だ。"
 INS_indonesian_naval_doctrine: "インドネシアの海軍ドクトリン"
 INS_indonesian_naval_doctrine_desc: "我々は独自の海軍を編成中であり、今重要なのは戦闘と訓練の方針となるドクトリンを検討することだ。可能な限り早く海軍ドクトリンを策定し、採用することを優先すべきである。"
 INS_domestic_shipbuilding: "国内での造船"
 INS_domestic_shipbuilding_desc: "いつまでも艦船の調達を拿捕と購入に頼ることはできない。拿捕できるオランダ艦は間もなく尽きるだろう。早急に自前の艦船建造を開始すべきである。"
 INS_acquire_modern_blueprints: "現代的な設計図の入手"
 INS_acquire_modern_blueprints_desc: "新たな海軍の構築に利用するため、他国や民間企業から設計図を購入する。"
 INS_reclaiming_the_dutch_navy: "オランダ領東インド海軍の再利用"
 INS_reclaiming_the_dutch_navy_desc: "我々が占領中の港にはたくさんのオランダ艦船が係留されている。今のうちにこれらの艦船を接収すべきだ。"
 INS_admiral_mas_pardi: "マス・パルディ提督"
 INS_admiral_mas_pardi_desc: "いかに優れた海軍でも、これを指揮する提督が必要である。マス・パルディは当然の選択だ。"
 INS_akademi_angkatan_laut: "海軍士官学校の建設"
 INS_akademi_angkatan_laut_desc: "海軍研究施設を備えた海軍士官学校を建設し、より多くの住民を技術者や提督として育成する。"
 # <Central Independence Branch - Militia Logistics>
 INS_pki_militia_tt: "タン・マラカは強力な民兵を擁しているが、インドネシアの意思のためだけではなく、§R共産主義§!とソビエトの意思のためにも戦っている。§R最終的には非共産主義政府に対して暴力的に敵対するだろう。§!"
 INS_increase_laskar_funding_tt: "民兵の要求が承諾されるたびに§Y軍需工場§!を1つ§W獲得§!する（最大§G6§!つ）"
 INS_subsidize_laskar_armament: "ラスカルの武装を援助する"
 INS_subsidize_laskar_armament_desc: "重装備の敵部隊に竹槍で立ち向かう民兵は長く生き残れない。民兵が使う銃器と弾薬の生産量を増やすことを優先する必要がある。"
 INS_loot_knil_weapons_caches: "王立オランダ領東インド陸軍の武器貯蔵庫を略奪する"
 INS_loot_knil_weapons_caches_desc: "革命前に王立オランダ領東インド陸軍が残した武器貯蔵庫は多数存在する。我々の構成員の多くはこの軍に所属していたことがあり、これらの武器貯蔵庫を見つけて略奪できるかもしれない。"
 INS_utilize_tan_malakas_militia: "タン・マラカの民兵を利用する"
 INS_utilize_tan_malakas_militia_desc: "共産主義者タン・マラカの民兵組織は、単独ではおそらくインドネシア全土で最強を誇っている。彼らを人民治安軍に動員できれば大きな恩恵を受けられるが、これにはリスクが伴う。強い政治的動機を持つ強力な民兵組織にこれほど大きな影響力を与えれば、彼らが自らのために権力を掌握しやすくなってしまう。"
 INS_increase_laskar_funding: "ラスカルの資金を増額する"
 INS_increase_laskar_funding_desc: "我々の戦力の大部分が民兵で構成されている。我々はこの事実を認識し、たとえ彼らが[INS.GetLeader]に対して完全に忠実でなくても資金を提供する必要がある。"
 INS_develop_a_functioning_airforce: "正式な空軍を編成する"
 INS_develop_a_functioning_airforce_desc: "空軍は陸軍に大きな影響を与える。我々は空軍の創設を優先すべきである。"
 # <Vice Presidential Edict - Intro>
 INS_political_stabilization: "秩序の回復"
 INS_political_stabilization_desc: "我が国は日に日に不安定さを増しており、すぐに対処しなければ内戦はほぼ避けられない状況だ。中央国民委員会、大統領、民兵指導者の間で交渉を開始し、解決策を見つけなければならない。"
 INS_vice_presidential_edict: "副大統領布告第X号に署名する"
 INS_vice_presidential_edict_desc: "中央国民委員会は、実質的な立法権を要求するという点において、ほぼ全会一致を見ている。中央国民委員会を独立した議会とし、大統領と共同で立法権を担わせるハイブリッド体制を提案する請願が大統領に提出された。この提案は魅力的だが、大統領の権限を形骸化させるリスクがある。"
 INS_local_cooperatives: "地域協同組合の設立"
 INS_local_cooperatives_desc: "西側諸国のような資本主義体制を構築すべきではないが、民営化がもたらす経済的利益は無視すべきではない。地域協同組合の設立を許可し、成功によって所有者が富を手にすることを認めよう。しかし、それらは政府の監督下に置かれ、地域外への拡大は禁じられる。"
 INS_local_unity: "藩王国の部分的な自治"
 INS_local_unity_desc: "既に混乱したこの時代における内部抗争を減らす一時的措置として、藩王国に部分的な自治権を付与する。"
 INS_education_subsidies: "教育助成金"
 INS_education_subsidies_desc: "国家の経済的な成功を望むのであれば、若者たちの未来への投資が絶対に不可欠である。手頃な学費で通える学校を共和国全土に建設する。"
 INS_land_reform: "農地改革"
 INS_land_reform_desc: "独立宣言前は広大な土地をオランダが直接所有していた。経済成長を促すため、これらの土地を利用したいと希望するすべてのインドネシア人に低価格で分配すべきである。"
 INS_dominion_of_atjeh: "アチェ自治領"
 INS_dominion_of_atjeh_desc: "アチェの分離主義運動は規模が大きく、なおも拡大している。この状況をさらに悪化させる理由はなく、彼らがインドネシアの一部に留まりつつ、大幅な自治権を得る妥協案を交渉すべきである。"
 # <Vice Presidential Edict - Presidential Balance>
 INS_dissolve_national_party: "国民党の解散"
 INS_dissolve_national_party_desc: "ハイブリッド体制は混乱を避けるために必要な妥協案として創設された。しかし、大統領がこれほどの権力を非民主的に保持することは許容できない。議会は大統領を罷免しなければならず、さもなければ民主主義は決して実現できないだろう。"
 INS_womens_sufferage: "女性参政権"
 INS_womens_sufferage_desc: "女性に投票権を拡大すれば、短期的には混乱が避けられないが、長期的な安定と民主主義のためには不可欠である。"
 INS_women_in_military: "軍の女性登用"
 INS_women_in_military_desc: "女性を軍務に就かせることは、我が軍を可能な限り強化するために不可欠である。"
 INS_fair_election: "公正な選挙"
 INS_fair_election_desc: "大統領が罷免され、革命は終結した。我々はついに権威主義の影響のない、初めての真に公正な選挙を実施することができる。"
 # < Hybrid Politics >
 INS_continue_hybrid_politics: "ハイブリッド政策の継続"
 INS_continue_hybrid_politics_desc: "ハイブリッド政策は必要悪である。最終目標は真の民主主義だが、すべての権力を国民の手に委ねるには、インドネシアはあまりにも若く不安定である。大統領と議会は相互に抑制し合い、いずれか一方に権力が偏るのを防ぐだろう。"
 INS_guided_economy: "指導される経済"
 INS_guided_economy_desc: "我々はインドネシア経済の統制を維持するため、これを直接監督する。すべての銀行に加え、石油部門と農業部門を国有化する。"
 INS_reform_education_system: "イデオロギー教育の義務化"
 INS_reform_education_system_desc: "革命を通じて、反乱を主導するのは常に社会秩序に不満を抱く学生や青年だと証明された。政府と国家の安全のため、我々は学校教育が政府のイデオロギーに準拠したものになるよう要請する。"
 INS_reform_education_system_2: "教育改革"
 INS_reform_education_system_2_desc: "将来的にインドネシアを豊かな国にするには、出生地にかかわらずすべてのインドネシア人に教育を受ける権利を与えなければならない。"
 INS_three_year_plan: "三年計画"
 INS_three_year_plan_desc: "三年計画を策定し、群島全体にインフラを整備し、島々を結びつけることができる。"
 INS_destroy_pacific_colonialism: "太平洋植民地主義を打ち破る"
 INS_destroy_pacific_colonialism_desc: "革命は終わったが、まだ戦いは残っている。我々の眼前には、いまだに植民地主義の圧政に苦しむ人々がたくさんいる。これを見過ごすわけにはいかず、彼らを宗主国から解放するため、行動しなければならない！"
 INS_rapid_mobilization: "迅速な動員"
 INS_rapid_mobilization_desc: "いかなる強国も、それを支える強力な軍を有している。我々が自らの地位を守ることができる地域の超大国を目指すなら、現在よりもはるかに強力な軍を編成することから始めなければならない。"
 INS_greater_indonesia: "大インドネシアの宣言"
 INS_greater_indonesia_desc: "古代ヌサンタラ帝国はかつて、マレー世界を一つの存在、一つの民族として統合していた。植民地主義の圧政からマラヤを解放した我々は、ヌサンタラの先祖がそうしたように、マレー世界全体を一つの統一国家として宣言すべきである。"
 # < State Religion >
 INS_secularism: "世俗主義"
 INS_secularism_desc: "インドネシアには多様な宗教を信仰する多数の人々が暮らしている。宗教と政治を混同すれば内紛を招くだけなので、宗教政党を禁止すべきである。"
 INS_integrate_sarekat_islam: "サレカット・イスラムの統合"
 INS_integrate_sarekat_islam_desc: "この大規模なイスラム政党は広く大衆の支持を受けており、彼らを政府に統合することは我々の利益にかなう。"
 # <Vice Presidential Edict - Sjahrir>
 INS_sjahrirs_continued_tenure: "シャフリールの任期継続"
 INS_sjahrirs_continued_tenure_desc: "シャフリール首相は自らが偉大な指導者であることを証明してきた。革命では我々を導き、我々の経済を発展させ、民主主義を確立した。我々は彼を首相として再選すべきである。"
 INS_unity_in_diversity: "多様性の中の統一"
 INS_unity_in_diversity_desc: "何世紀にもわたり、「多様性の中の統一」という言葉は我々の群島の精神を体現してきた。革命の実行中はこの思想がスローガンとなり、言葉も慣習も異なる我々インドネシア人に、一つの民族として団結することを思い出させてくれた。この団結が今後何世代にもわたって維持されるよう、この言葉を我々の憲法に明記すべきである。"
 INS_the_timor_issue: "[INS_timor_issue_scripted_name]"
 INS_timor_issue_scripted_name_issue: "ティモール問題"
 INS_timor_issue_scripted_name_attack: "東ティモールを攻撃"
 INS_the_timor_issue_desc: "[INS_timor_issue_scripted_desc]"
 INS_timor_issue_scripted_desc_issue: "東ティモールがインドネシアの正当な領土であることは明らかだ。にもかかわらず、革命終結後も依然として植民地支配を受けている。我々は[721.OWNER.GetName]に最後通牒を送り、東ティモールを即座に引き渡すよう要求する。"
 INS_timor_issue_scripted_desc_attack: "東ティモールがインドネシアの正当な領土であることは明らかである。島内の反乱勢力は独立を主張しているかもしれないが、彼らの意見が住民全体を代表しているわけではないのは明白だ。ポルトガルによる植民地支配の名残は共和国に統合しなければならない。"
 INS_pledge_to_allies: "連合国への誓約"
 INS_pledge_to_allies_desc: "世界中で拡大する紛争の一環で、我々は侵略を受ける危険にさらされている。我々と連合国の関係は不安定なものであったが、太平洋における民主主義国家の地位を確立した今、民主主義列強と手を結ぶべきである。"
 INS_mixed_economy_system: "混合経済体制"
 INS_mixed_economy_system_desc: "インドネシアは独特な国家であり、伝統的な資本主義や共産主義の下では繁栄しない。資本主義と共産主義の両方の要素を併せ持つ混合経済体制を構築すべきである。"
 INS_social_democracy: "社会民主主義"
 INS_social_democracy_desc: "シャフリールの経済政策が実施されて以来、[INS.GetAdjective]の経済は大幅に成長してきた。我々はインドネシアを完全な社会民主主義国家として宣言し、将来の経済政策を社会民主主義の原則に基づいて策定すべきである。"
 # <Vice Presidential Edict - Sjarifuddin>
 INS_prime_minister_sjarifuddin: "シャリフディン首相"
 INS_prime_minister_sjarifuddin_desc: "シャリフディンはインドネシアにとって最良の候補であり、彼の穏健な政策は共産主義者と社会主義者の歩み寄りを可能とする。"
 INS_concessions_to_communists: "共産主義者への譲歩"
 INS_concessions_to_communists_desc: "インドネシア共産党は議会でかなりの議席を有しており、安定を期すため彼らの指導者にはいくつかの閣僚ポストを与えるべきである。"
 INS_sjarifuddin_focus_2: "自主管理輸出経済"
 INS_sjarifuddin_focus_2_desc: "新たに獲得した独立を受け、輸出経済制度を見直し、オランダの利益を考慮しない形へと再編すべきである。輸出依存経済には依然として危険が伴うが、過去数年よりもはるかに安定した仕組みにできる。"
 # <Vice Presidential Edict - Hatta>
 INS_prime_minister_hatta: "ハッタ首相"
 INS_prime_minister_hatta_desc: "革命の宣言者として知られるモハマッド・ハッタは、スカルノの副大統領を務めており、二人の中では総じて民主主義寄りであった。ほとんどの政党が妥協できる首相として適任だろう。"
 INS_hatta_focus_2: "次の段階"
 INS_hatta_focus_2_desc: "革命は終結した。革命は続けなければならないと主張する政治家もいるが、そうした声は無視すべきである。代わりに我々は前を向き、未来の世代が繁栄の中で暮らせるようインドネシアを築き上げなければならない。"
 INS_hatta_princely_advisors: "藩王国の統合"
 INS_hatta_princely_advisors_desc: "我々は多様性の中に統一を見出す。この原則に基づいて国家を築いてきたが、革命の終結により共通の闘争が失われ、この理念には負担がかかっている。少数派集団の不満や蜂起を防ぐため、藩王国の地方統治者が国政に直接発言できる追加の評議会を設立すべきである。"
 INS_prime_minister_tt: "インドネシアで初めての総選挙が実施された"
 # < Guided Democracy >
 INS_guided_democracy: "指導される民主主義"
 INS_guided_democracy_desc: "民主主義は理想かもしれないが、今人民に権力を与えても混乱に終わるだけだ。スカルノを終身大統領に昇格させれば、彼は民主的な議会を監督し、必要ならば介入する。"
 INS_enact_militarism: "軍国主義の導入"
 INS_enact_militarism_desc: "我々は[JAP.GetNameDefCap]とその軍国主義政策からいくつかの教訓を学ぶべきである。同様の原則を採用すれば、我々の新政府に利益をもたらすだろう。"
 INS_sukarnos_industrialization: "ジャワ島の産業を強化する"
 INS_sukarnos_industrialization_desc: "ジャワ島の産業は我々の経済と軍隊を支える屋台骨だ。すべての道はローマに通ず。"
 INS_sukarnos_industrialization2: "誰もが自分の役割を果たさなければならない"
 INS_sukarnos_industrialization2_desc: "戦争努力はこの国の最優先事項である。したがって、すべてのインドネシア人がこれに貢献することが最優先事項となる。贅沢は敵であり、軍産複合体を成長させなければならない。"
 INS_japanese_military_lessons: "日本の軍事教訓"
 INS_japanese_military_lessons_desc: "日本の軍事ドクトリンを研究し、我が軍をこれに適応させるべきである。"
 # < Support Tan Malaka's Coup>
 INS_support_tan_malakas_coup: "タン・マラカのクーデターを支援する"
 INS_support_tan_malakas_coup_desc: "スカルノは独立を宣言したが、彼は中途半端な手段と外交的譲歩に終始する人物であると証明された。タン・マラカと彼が率いる闘争同盟は人民が求めるものを要求する。それはつまり、交渉なし、妥協なしの100%の独立だ。スカルノが革命のために全力で戦わないのなら、代わりに戦う指導者が必要である。"
 INS_minimum_program: "最小限綱領"
 INS_minimum_program_desc: "闘争同盟がその要求を明らかにした。それは、人民政府、人民軍、そして、外国が所有するすべての農園および産業の国有化である。我々はこの綱領を実行できる有能な人物を必要としている。ニョノは労働者を代表し、セティヤジットは党の有識者を代表する。彼らが手を携えることで、工場の現場から政府の中枢に至るまで、革命は円滑に進んでいくだろう。"
 INS_agrarian_reform: "農地改革"
 INS_agrarian_reform_desc: "インドネシアの土地は3世紀にわたって、よそ者の農園として搾取されてきた。これを耕した農民たちは他の仕事をほぼ知らない。この状況を変えずして何が革命か。我々は土地がそれを耕した者の手にわたるのを見届けよう。"
 INS_soviet_aid: "ソビエトからの支援"
 INS_soviet_aid_desc: "ソビエト連邦は我々の革命を承認し、これを支援する用意がある。我々と彼らの綱領にどのような差異があろうとも、提供されるものを拒む余裕はない。我々は武器を受け取り、前進すべきである。"
 INS_pacific_revolution: "太平洋革命"
 INS_pacific_revolution_desc: "植民地主義勢力はアジアから撤退したのではなく、インドネシアから撤退したにすぎない。古い秩序はマラヤやフィリピンのような場所で存続しており、これを打倒することを望む男女がそれぞれの場所にいる。革命は我々に彼らを支援する地位と義務の両方を与えた。我々は行動しなければならない。"
 INS_purge_oppurtunists_tt: "共産主義の支持率が§Y60%§!以上の国家で§Y$INS_launch_revolution$§!をアンロック。我々が革命を扇動した国家は我々の§Y傀儡§!になる。"
 INS_purge_oppurtunists: "日和見主義者の粛清"
 INS_purge_oppurtunists_desc: "ムソはモスクワで20年間過ごし、命令に従うことを学んだ。ソビエトの指示を懐に入れて帰国した彼は、我が共和国をコミンテルンの傀儡にする計画を携えていた。我々がオランダを追い出したのは、別の宗主に跪くためではない。革命をモスクワに売ろうとする日和見主義者は根絶やしにしなければならない。我々が解放する民衆は、クレムリンではなくジャカルタを仰ぐだろう。"
 INS_federation_of_aslia: "アスリア連邦"
 INS_federation_of_aslia_desc: "我々が解放する国々は独り立ちする必要はない。タン・マラカが常に思い描いていたのは単独の共和国よりも大きな存在だ。大陸から太平洋にわたる連邦が、いかなる植民地主義勢力の再来にも団結して立ち向かう。我々は彼らに、我が連邦への完全加盟を提案する。"
 INS_aslia_tt: "§Y太平洋§!の従属国の中核州化および併合が可能になる"
 INS_musso_ascends: "ムソの台頭"
 INS_musso_ascends_tt: "共産主義の支持率が§Y30%§!以上の国家で§Y$INS_launch_revolution$§!をアンロック。我々が革命を扇動した国家は独立を維持する。"
 INS_musso_ascends_desc: "タン・マラカは夢想家だ。ムソは夢想家がもたらせないものをもたらしてくれる。それは、ソビエト連邦の全面支援と、国際共産主義運動との連携だ。我々の革命は独り立ちする必要がない。"
 INS_soviet_economic_integration: "ソビエトの経済統合"
 INS_soviet_economic_integration_desc: "革命は我々に自由をもたらしたが、自由だけでは工場を建てることも、大衆を養うこともできない。ソビエト連邦は資本主義大国が提供しないものを提供する。それは、産業の専門知識、開発融資、植民地的な条件のない貿易である。これを断るのは愚かなことだ。"
 # <National Revolution - Reasserting Control>
 INSHOL_revolution_ongoing_tt: "インドネシアの独立戦争が進行中"
 INSHOL_reasserting_control: "東インドの支配権を取り返す"
 INSHOL_reasserting_control_desc: "我々が何世紀もかけて築いたものを、この日和見主義者たちが台無しにするのを、何もせずに見過ごすわけにはいかない。彼らは我々のインフラを破壊し、青年らを急進化させようとしている。我々は行動しなければならない！"
 INSHOL_request_british_support: "イギリスの支援を要請"
 INSHOL_request_british_support_desc: "同じ宗主国の立場である[ENG.GetNameDefCap]は我々の置かれた状況に同情的である可能性が高い。特に、革命家たちが成功すれば、東アジアにドミノ効果を引き起こしかねないからだ。経済および軍事の両面から支援を要請すべきである。"
 INS_eng_treaty_holside_tt: "§Y[ENG.GetNameDefCap]§!はこの紛争で我々側につくことを正式に宣言し、多大な支援を提供する。戦争が勝利に終われば、§Y[ENG.GetNameDefCap]§!はボルネオ島を獲得する権利を得る。"
 INS_eng_treaty_engside_tt: "我々は東インドの紛争で正式に§Y[HOL.GetNameDefCap]§!側につく。§Y[HOL.GetNameDefCap]§!が勝利すれば、我々はボルネオ島を所有する権利を得る。"
 INS_fra_treaty_holside_tt: "§Y[FRA.GetNameDefCap]§!はこの紛争で我々側につくことを正式に宣言し、多大な支援を提供する。戦争が勝利に終われば、§Y[FRA.GetNameDefCap]§!はスマトラ島北東部を獲得する権利を得る。"
 INS_fra_treaty_fraside_tt: "我々は東インドの紛争で正式に§Y[HOL.GetNameDefCap]§!側につく。§Y[HOL.GetNameDefCap]§!が勝利すれば、我々はスマトラ島北東部を所有する権利を得る。"
 INSHOL_franco_dutch_accord: "仏蘭協定"
 INSHOL_franco_dutch_accord_desc: "我が軍の兵士は共和国の民兵よりも優れた装備を身につけ、より組織化されている。にもかかわらず、彼らの圧倒的な数に押されて戦局は我々に不利な状況だ。勝利を確実なものとするためには、通常以上の外部支援が必要である。フランスに東インドの領土提供を申し出れば、太平洋における存在感を拡大したい彼らは介入してくれるかもしれない。"
 INSHOL_london_batavia_accord: "ロンドン・バタビア協定"
 INSHOL_london_batavia_accord_desc: "我が軍の兵士は共和国の民兵よりも優れた装備を身につけ、より組織化されている。にもかかわらず、彼らの圧倒的な数に押されて戦局は我々に不利な状況だ。勝利を確実なものとするためには、通常以上の外部支援が必要である。[ENG.GetNameDefCap]は自国がマラヤに駐留していることもあり、興味を持つ可能性がある。何か見返りを提示すれば、彼らを説得できるかもしれない。"
 INSHOL_australian_divisions: "オーストラリアの歩兵隊をジャワ島に派遣する"
 INSHOL_australian_divisions_desc: "ロンドン・バタビア協定に基づき、我々が要請すればイギリスはオーストラリアを経由して追加の師団を派遣する義務を負う。これは、オーストラリアが東インドに近接しており、東インドの外部で軍事基地を置く場所として最適だからである。"
 INSHOL_indian_divisions: "英印軍師団"
 INSHOL_indian_divisions_desc: "イギリスは自国の兵士を東インドに派遣することにはおそらく消極的だが、バタビアに近接していることもあり、英印軍師団の派遣を説得するのははるかに容易である。"
 INSHOL_undermine_the_militias: "民兵の弱体化"
 INSHOL_undermine_the_militias_desc: "報道は状況の深刻さを誇張している。民兵は手の届かないものに手を伸ばそうとする、ただの若いならず者集団にすぎない。彼らを阻止するためにすべての資源を注ぎ込む必要はなく、現状を維持して彼らが疲弊するのを待つべきである。"
 INSHOL_flag_will_fly_again: "旗は再びはためく"
 INSHOL_flag_will_fly_again_desc: "東インドでは何世紀にもわたりオランダ国旗が掲げられてきた。我々がそれを降ろすことを認めるなどあり得ないことだ。王冠の宝石である植民地を維持するために、戦車や爆撃機を送る必要があるのなら、すぐに送ってやろう！"
 INSHOL_flag_will_fly_again_tt: "§Y革命が終結するとこの精神は削除され、ルールの変更は元に戻る。§!"
 # <National Revolution - Escalation>
 INSHOL_mass_mobilization: "大量動員"
 INSHOL_mass_mobilization_desc: "十分に装備された軍隊なしには、この紛争に勝利して共和国を打ち破るのは不可能だ。我々は東インドを再軍備し、民生部門から王立オランダ領東インド陸軍に資金を転用しなければならない。"
 INSHOL_batavia_storm_operation: "バタビアへの急襲"
 INSHOL_instigate_infighting: "共和国内での内紛を扇動する"
 INSHOL_ultimatum_to_republic: "共和国への最後通牒"
 INSHOL_comite_rijkseenheid: "王国統一委員会"
 INSHOL_comite_rijkseenheid_desc: "東インドで国旗が降ろされそうになっているにもかかわらず、人々はそれをただ見ているだけだ。我々はこれを許容することはできない。オランダ国民が革命の中止を望んでいることを東インド政府に納得させなければならない！"
 INSHOL_increase_esclation_placeholder: "急速な戦闘の激化"
 INSHOL_increase_esclation_placeholder_desc: "我々の民兵は多くの重要港、都市、工業拠点を掌握した。もはやオランダの出方を待ち続けることはない。我々自身の手で大規模な軍事攻勢に打って出る！"
 INS_take_batavia_explination_tt: "ジャワ島全土の占領に成功すると、植民地政府を内部から破壊して§G戦争に勝利する§!。しかし、それを§Y730日§!以内に達成できなければ我々は§R滅亡する§!。"
 INSHOL_linggadjati_agreement: "停戦協定の交渉"
 INSHOL_linggadjati_agreement_desc: "ジャワ島への侵攻は困難であることが明らかとなり、我々の統治は不安定さを増している。共和国全体が崩壊するリスクを避けるため、我々は後退して防御態勢を整えなければならない。オランダと局地的停戦を交渉し、軍を再編成した上でジャワ島の攻略に集中すべきである。"
 INSHOL_increase_esclation_placeholder_tt: "局地的停戦を交渉し、ジャワ島の占領§Y期限を延長§!する§Yディシジョン§!をアンロック。"
 # <National Revolution - Peace Negotiation>
 INSHOL_seek_foreign_help: "外国からの支援を要請する"
 INSHOL_seek_foreign_help_desc: "経済が確立していない新興国が、工業化が進んだ植民地大国に戦争で勝利するのはほぼ不可能であり、これは公然の事実だ。我々の大義を支持する他国に連絡し、我々を支援する意思があるかを確認すべきである。"
 INSHOL_renville_agreement: "レンヴィル協定"
 INSHOL_renville_agreement_desc: "オランダによる前例のない攻撃により、革命は国際的な注目を得た。それでも、オランダは停戦協定を破り、我々の反応を誘発し続けている。我々は[USA.GetNameDef]に連絡しなければならない。彼らがインドネシアのために立ち上がるよう説得できれば、オランダは撤退するしかなくなるだろう。"
 INSHOL_no_compromise: "妥協しない、降伏もしない"
 INSHOL_no_compromise_desc: "オランダが強欲にも東部の諸島を無視し、大半の投資をジャワ島に集中させてきた結果、この島は植民地全体のアキレス腱になっている。このことが奴らの破滅を招くだろう！"
 INSHOL_end_to_bloodshed: "二国家解決"
 INSHOL_end_to_bloodshed_desc: "この紛争はあまりにも長く続き、ほとんど進展も後退もないまま日々新たな命が奪われている状況だ。これを継続したいと思う者はおらず、オランダの指導者と交渉の席につくべき時である。"
 INSHOL_reorganize_colonies: "植民地の再編"
 INS_we_will_need_another_tt: "我々はすでにジャワ島全域を支配しているため、ジャワ島に加えてもう一つの州を支配する必要がある。"
 # Industry Branch - New
 INS_centralize_the_state: "国家の中央集権化"
 INS_centralize_the_state_desc: "スマトラ島からスラウェシ島、ボルネオ島からバンカ島にいたるまで、我々の開発計画はかつて[1058.GetName]が名目上統治していた領土に道路、工場、行政機関をもたらした。これらの地域はもはや遠方の州ではなく、[INS.GetNameDefCap]である。"
 INS_centralize_the_state_1_tt: "前提となる§Y中核化された§!州:"
 INS_centralize_the_state_2_tt: "前提となる§Y中核化されていない§!州:"
 INS_fate_of_de_javasche_bank: "[INS_fate_of_de_javasche_bank_scripted_name]"
 INS_fate_of_de_javasche_bank_scripted_name_colony: "ジャワ銀行の運命"
 INS_fate_of_de_javasche_bank_scripted_name_independent: "インドネシア銀行の運命"
 INS_fate_of_de_javasche_bank_desc: "[INS_fate_of_de_javasche_bank_scripted_desc]"
 INS_fate_of_de_javasche_bank_scripted_desc_colony: "大恐慌の発生以来、東インドギルダーは急落を続けており、ジャワ銀行にはこれを止める手段がない。残された投資家の信頼が完全に消え去る前に、我々は自国通貨を安定させる方法を決定しなければならない。"
 INS_fate_of_de_javasche_bank_scripted_desc_independent: "我々は危機に瀕した通貨を引き継いだ。旧植民地ギルダーはすでに安定を欠いており、ルピアへの移行も市場の安定化には何ら寄与していない。インドネシア銀行は政府からの明確な指示を求めている。さもなければ、我々の若い経済はその代償を被ることになる。"
 INS_finish_the_bauxite_project: "バンカ計画を完了させる"
 INS_finish_the_bauxite_project_desc: "バンカ島とブリトゥン島の全域で道路、港、鉄道が稼働し、調査チームはタングステンおよびクロムの埋蔵量が当初の想定を上回ったと報告している。これらの島々はいずれ、共和国に対して最大限の価値を提供するだろう。"
 INS_australian_contracts: "オーストラリアとの契約"
 INS_australian_contracts_desc: "我々のゴムの備蓄は国内ニーズをとうに超えて増大している。自国産業向けの原材料に飢えているオーストラリアは自然な貿易相手である。オーストラリア企業と長期契約を結ぶことで収入は安定し、地域経済における我々の立場を強化するだろう。"
 INS_coopereate_with_chinese_businessmen: "華僑の実業家との協力"
 INS_coopereate_with_chinese_businessmen_desc: "裕福で強いコネクションを持つ商人階級は、長きにわたって群島全域における交易を促進してきた。我々は既に確立されたこれらのネットワークを排除せずに、彼らと協力すべきである。彼らの資本と商業の専門知識は、低迷する我々の経済を引き上げる上で計り知れない価値を発揮する可能性がある。"
 INS_oil_decisions_unlock_tt: "§Y石油§!を販売する新たなディシジョン、§Y$INS_realign_supply_chains_cat$§!をアンロック。"
 INS_negotiate_new_contracts_unlock_tt: "新たなディシジョン、§Y$INS_realign_supply_chains_cat$§!をアンロック。"
 INS_realign_supply_chains_explain_tt: "資源を2年リースで民間企業に売却するディシジョン、§Y$INS_realign_supply_chains_cat$§!をアンロック。"
 INS_negotiate_new_contracts: "新たな契約について交渉する"
 INS_negotiate_new_contracts_desc: "信頼できる供給者としての我々の評判は高まっており、これまで我々に閉ざされていた扉が開かれた。新たな買い手が集まってくる今、競合が値下げ攻勢をかけてくる前に速やかに行動し、長期契約で彼らを囲い込むべきである。"
 INS_all_in_on_rubber: "ゴムにすべてを賭ける"
 INS_all_in_on_rubber_desc: "ゴムは我々の最強の切り札であり、これを活用しない手はない。すべての利用可能な農園用地をゴム栽培に転用し、輸出体制を再編して地域の誰よりも速く安価に輸出できるようにする。"
 INS_more_market_resources: "大恐慌下で売上を伸ばす"
 INS_more_market_resources_desc: "世界は経済危機で落ち込んでいるかもしれないが、危機は機会を生み、大胆な者はそれをつかみ取る。我々の商品を競合が太刀打ちできない価格で市場に溢れさせれば、世界が回復した時にすべての棚と倉庫にインドネシア産品が並ぶことになる。"
 # <Industry Branch - Trade Policy>
 INS_recovering_from_the_great_depression: "大恐慌からの回復"
 INS_recovering_from_the_great_depression_desc: "大恐慌は[INS.GetNameDef]に壊滅的な影響をもたらした。我々の経済は主に輸出に依存しているため、世界中で見られた保護貿易主義は我々を苦しめ続けている。世界貿易が再び開放されつつある今、我々は新たな市場を開拓し、かつての貿易ルートを再構築しなければならない。"
 INS_first_come_first_serve: "先着優先"
 INS_first_come_first_serve_desc: "大恐慌下の保護貿易主義は下火になりつつあるものの、生産量の増大とギルダー高が原因でオランダの輸出市場は壊滅状態である。かつて取引のあった西側の貿易相手国は、需要を満たすために南アメリカとの貿易を開拓している。彼らを追って新たな貿易協定を結ぶよりも、アジアにおける新市場に進出する機会とすべきである。"
 INS_oil_export: "石油輸出の拡大"
 INS_oil_export_desc: "新たな貿易相手国との取引を確保するため、スマトラ島とカリマンタン島の石油インフラを改良する。"
 INS_increased_trade_with_japan: "日本との貿易拡大"
 INS_increased_trade_with_japan_desc: "貿易相手国として[JAP.GetNameDefCap]の価値はますます高まっており、彼らは我々の期待に応えている。2国間の経済協力を強化し、大恐慌の傷跡を消し去るため、我々は新たな貿易協定について交渉すべきである。これにより、西側の同盟国、特にオランダは動揺するかもしれない。しかし、自らの運命を自ら決める権利を求めるならば、独自の貿易路を確保する必要がある。"
 INS_asian_trade_investments: "アジア貿易への投資"
 INS_asian_trade_investments_desc: "大恐慌による壊滅的被害は、我々が西側の長期的な貿易相手国にいかに依存しすぎていたかを思い知らせてくれた。我々の経済が主に輸出に依存している以上、一国に依存することがないよう東南アジアに新たな市場を開拓し、これを拡大することがこれまで以上に重要である。"
 INS_asian_trade_investments_tt: "§Y420§!日ごとに、§Y大恐慌§!による市場への資源ペナルティが§Y5%§!§G改善§!され、負の補正が消えるまで続く。"
 INS_declare_free_trade: "自由貿易を宣言"
 INS_declare_free_trade_desc: "一つの国家とだけ連携してはいけない。[INS.GetNameDef]にとって最良の決断を、市場が自然に行うようにする。"
 INS_japanese_export_contracts: "一つの貿易契約はすべてを統べる"
 INS_japanese_export_contracts_desc: "[JAP.GetNameDef]と大規模な貿易協定について交渉し、[1049.GetName]および[672.GetName]のゴムをすべて販売する。非常に安価で販売することになるが、完売することが保証される。"
 INS_realign_supply_chains: "供給網の再編"
 INS_realign_supply_chains_desc: "大恐慌下の保護貿易主義は下火になりつつあるものの、生産量の増大とギルダー高が原因でオランダの輸出市場は壊滅状態である。かつて取引のあった西側の貿易相手国は、需要を満たすために南アメリカとの貿易を開拓している。我々は同盟国に対し、我々との貿易を再開するよう説得するための措置を講じなければならない。"
 INS_invite_foreign_companies: "アメリカの石油事業を支援"
 INS_invite_foreign_companies_desc: "1930年以来、スタンダード・オイル・オブ・カリフォルニアはオランダの子会社、蘭領太平洋石油会社を通じて我が国で事業を行っている。リアウにおける彼らの調査は有望であり、我々はできる限りの手を尽くして上流工程を支援すべきである。大規模な発見があれば、我々の収益を大幅に押し上げると同時に、他の国際企業に我が国への積極的投資を促すことにもなる。"
 INS_expand_sea_routes: "海路の拡張"
 INS_expand_sea_routes_desc: "我が国は天然資源に恵まれているが、採掘事業は専門化しすぎており、クロムやタングステンのような特定の希少鉱物の採掘に必要なインフラが不足している。軍需生産能力を向上させるためには、これらを他国から輸入する必要がある。拡大しつつある貿易ネットワークを最大限活用するためには、商船隊の輸送能力を向上させる必要がある。"
 INS_ship_contracts: "艦船契約の確保"
 INS_ship_contracts_desc: "戦時に貿易路を維持するためには海軍の整備が不可欠である。新たに開拓した貿易関係を利用すれば、艦船を調達するための契約を締結することもできる。"
 # <Industry Branch - Sumatra>
 INS_developing_sumatra: "スマトラ島の開発"
 INS_developing_sumatra_desc: "スマトラ島は群島の中で最も資源が豊富な島だが、インフラがあまりにも貧弱なため、採掘した資源の大半がバタビアにすら届いていない。輸送手段は未舗装路と未連結の鉄道を継ぎ接ぎで利用しており、我々のこの島での計画を支えるには到底不十分だ。この状況を放置することはできない。"
 INS_sumatra_railway: "スマトラ横断鉄道"
 INS_sumatra_railway_desc: "スマトラ島で進行中のインフラ開発取り組みの一環として、北部アチェからスマトラ島南端の港まで伸びる大規模な鉄道を建設すべきである。この港は船でバタビアと迅速に往来可能だ。この方法により、資源を最寄りの鉄道駅まで輸送すれば、そこから数日でバタビアに移送できるようになる。"
 INS_develop_borneo: "カリマンタン島の開発"
 INS_develop_borneo_desc: "カリマンタン島は大きな富を生み出す可能性を秘めているが、その開発は非常に遅れており、住民は貧困に苦しんでいる。貨物輸送は島に張り巡らされた多数の河川や水路に大きく依存しており、長距離通信は電力不足によって阻まれている。送電線と道路を建設すれば、将来的に調査および資源採取のための道を切り開くことができる。"
 INS_kalimantan_mic: "カリマンタン島の軍需産業"
 INS_kalimantan_mic_desc: "カリマンタン島における我々のインフラ開発取り組みは成果をあげた。電力と通信の普及により、かつては政府の呼びかけも届かなかったはるか遠方の地域社会とも接触できるようになった。この機会を活かせば、軍需生産の拡大に必要なものを揃えることができるだろう。この地域に新たな工場を建設し、新たに発見された労働力を動員するのだ。"
 INS_pontianak_to_balikpapan: "ポンティアナック発、タンジュン・セロル行き"
 INS_pontianak_to_balikpapan_desc: "カリマンタン島に鉄道を敷設するという構想は長きにわたって議論されてきたが、島の中央部に位置する過酷でほぼ未開拓の地形が実現を困難なものにしている。唯一の解決策は海岸から海岸へとU字型に伸びる鉄道である。安価な投資ではないが、長い目で見れば元が取れるだろう。"
 INS_develop_sulawesi: "スラウェシ島の開発"
 INS_develop_sulawesi_desc: "スラウェシ島は群島の中心であり、戦略的に重要な拠点だ。道路、送電線、通信網を整備し、戦時に軍事拠点として利用できるようにすべきである。"
 # <Industry Branch - Bangka Project>
 INS_the_bangka_project: "バンカ計画"
 INS_the_bangka_project_desc: "バンカ島およびブリトゥン島にはボーキサイト鉱床があり、小規模ながらインドネシア経済の要となっている。両島に道路、港、鉄道を建設し、豊かな鉱物資源から完全に利益を得られるようにする必要がある。"
 INS_aluminium_factory: "パンカルピナンのアルミニウム工場"
 INS_aluminium_factory_desc: "我々のボーキサイト採掘量は拡大しているが、国内でのアルミニウム生産が不足しているせいで利益が制限されている。バンカ・ブリトゥン州の州都、パンカルピナンは自国の工場を設立するのに理想的な場所だ。実現すれば、中間業者を排除して利益を最大化することができる。"
 INS_bauxite_export: "ボーキサイト輸出の強化"
 INS_bauxite_export_desc: "バンカ計画が完了し、我々は処理しきれないほど大量のボーキサイト原料を抱えることになった。すべてを売りさばくのは困難だが、市場の誰よりも手頃な価格を提示すれば、1グラムも残さずに完売することができる。販売量が膨大で、それに比例して利益も増えるため、既存の輸出と比較しても遜色ない利益を確保できるだろう。"
 INS_tin_mining: "錫採掘への投資"
 INS_tin_mining_desc: "バンカ島およびブリトゥン島における錫採掘の歴史は、ヨーロッパ人の群島への入植に先立つものである。したがって、当地の錫産業がいくぶん時代遅れなのは当然のことだ。生産能力の全面見直しには多額の費用がかかり、再建中は既存の錫産業は操業を停止する。しかし、長い目で見れば大きな利益をもたらす可能性がある。"
 in_240_days_tt: "§Y240日後:§!\n"
 INS_tin_to_usa: "[USA.GetNameDef]への錫販売"
 INS_tin_to_usa_desc: "[USA.GetNameDefCap]には錫を購入する企業や政府機関が溢れている。適切な採掘事業を確立した今、ここから大きな利益を得る好機である。"
 INS_tin_to_japan: "[JAP.GetNameDef]への錫販売"
 INS_tin_to_japan_desc: "[JAP.GetNameDefCap]には、現在では時代遅れで入れ替え可能と見なされている艦船が数多く存在する。そして、これらの艦船は[INS.GetAdjective]海軍には完全に適合する。我々は、錫産業で稼いだ資金でこれらの艦船を購入すべきだ。"
 INS_tin_to_japan_tt: "[JAP.GetNameDefCap]が我々に旧式の駆逐艦§Y9§!隻を譲渡する。"
 INS_new_bauxite_routes: "新たなボーキサイト販路"
 INS_new_bauxite_routes_desc: "ボーキサイト輸出量を増やすため、市場価格を下回る価格で販売するという我々の戦略は功を奏し、総収入は大幅に増加した。しかし、ここで立ち止まってはならない。我々は貿易網をさらに拡大し、供給網を最適化し、利益を最大化するためのあらゆる手段を模索すべきである。"
 INS_bangka_bauxite_export_flag: "国家方針§Y$INS_bauxite_export$§!を達成している:"
 INS_not_industry: "未来への計画"
 INS_not_industry_desc: "ジャワ島は我が国の鼓動する心臓であり、人口の大半が居住し、政府の所在地でもある。この島の工業化を本格的に進める前に、まずは土地を整えなければならない。土地測量、区画割り当て、用地の整備を行えば、工場を建設する際に最大の効果を得られる場所に建設できるようになる。"
 INS_construction_focus: "産業ブーム"
 INS_construction_focus_desc: "外国資本が流入し、輸出額は伸び、数年ぶりに国内産業に投資できる資金がある。この好機を逃してはならず、条件が有利なうちに建設を進めなければならない。"
 # <Industry Branch - Java>
 INS_developing_java: "ジャワ島のインフラ拡張"
 INS_developing_java_desc: "ジャワ島は群島の中で最も工業化が進んだ島であり、我が国の富の大半はここから生まれている。しかし、バタビアのような特定の都市は人口増加により過密化が進んでいる。増加する人口を支えるため、新たな住宅、商業地区、路面電車、鉄道、工場を整備し、これらの都市を拡張すべきである。"
 INS_prioritize_sugar_economy: "砂糖経済の優先"
 INS_prioritize_sugar_economy_desc: "バタビアはすでに群島内のいかなる都市よりも工業化がはるかに進んでおり、同市に対する政府の工業開発予算を削減すべきである。代わりに、この資金を利用して国内各地に小規模なヤシ農園を設立すべきだ。これらの農園で国際的な需要の高いパームシュガーを製造する。"
 INS_all_cards_into_industry: "産業におけるすべてのカード"
 INS_all_cards_into_industry_desc: "工業化は[1058.GetName]の経済に多大な影響を与えてきた。数千万人の住人を抱える島全体を工業化すれば、世界規模で影響力を持つことができるだろう。"
 INS_expand_batavia_technical_institute: "バタビア工科大学の拡張"
 INS_expand_batavia_technical_institute_desc: "バタビア工科大学を拡張すれば、より多くの学生に教育を受ける機会を与え、我々の技術開発の進展速度を高めることができる。"
 INS_quinine_export: "より収益性の高いキニーネ協定"
 INS_quinine_export_desc: "アムステルダムのキナ局はキニーネ輸出をほぼ独占している。キニーネはマラリアの治療薬として世界的な需要が高く、その輸出は特に利益が大きい。キナ局はキニーネの仕入れの大半を東インドから調達している。にもかかわらず、我々が受け取る利益はごくわずかだ。我々のキニーネ生産を交渉材料とし、より公平な協定について交渉すべきである。"
 INS_spend_profits_on_rural: "農村開発への利益充当"
 INS_spend_profits_on_rural_desc: "新たなキニーネ協定が締結され、我々は追加の収入を確保した。これを使って農村地域の交通および通信インフラを開発する好機である。これにより、将来の産業発展への道が切り開かれる。"
 INS_spend_profits_on_urban: "都市開発への利益充当"
 INS_spend_profits_on_urban_desc: "新たなキニーネ協定が締結され、我々は追加の収入を確保した。これを使ってバタビアの製造業を拡張する好機である。これにより、経済が多様化し、原材料輸出への依存度が低下する。"
 INS_spend_profits_on_military: "軍事開発への利益充当"
 INS_spend_profits_on_military_desc: "新たなキニーネ協定が締結され、我々は追加の収入を確保した。これを使ってジョグジャカルタとスマランに新たな武器工場を建設・維持すれば、我が軍を大幅に強化する好機となる。"
 INS_end_to_bloodshed_tt: "戦争は終わり、現在の占領状況に応じて新たな国境が策定される。ジャワ島、スマトラ島、ボルネオ島は、現時点でこの地域を最も支配している側が§Y併合§!する。"
