 HOL_taog_guarantee_colonial_loyalty: "植民地の忠誠を保証"
 HOL_taog_guarantee_colonial_loyalty_desc: "東インドでは民族主義が台頭しており、再び革命が画策されていることは明らかだ。1927年の反乱は容易に鎮圧されたが、情報筋によれば今回は前よりもはるかに用意周到な革命家集団と対峙する可能性があるという。スタルジョの平和的な民族主義運動にいくつかの譲歩を与えれば、民衆の注意を革命からスタルジョに向けることができるのではないだろうか？"
 HOL_taog_guarantee_colonial_loyalty_tt: "§W[INS.GetNameDef]で革命が発生しないことを保証する。§!\n[INS.GetNameDefCap]は平和的な独立宣言を試みる。これは国家方針§Y$INSHOL_industrialized_colony$§!を完了することで阻止できるが、そのためには植民地への多額の投資が必要となる。"
 ################
 ###   SIAM   ###
 ################
 SIA_the_khana_ratsadon: "人民党"
 SIA_the_khana_ratsadon_desc: "人民党は絶対主義を終わらせ、立憲政治への道を開いた。その遺産は争いと裏切りを経て血塗られたものになったが、いまだに近代的な[SIA.GetName]を築くための基礎であり続けている。"
 SIA_the_khana_ratsadon_tt: "\n§Y人民党§!が有効化される。\n\n§Y人民党§!は[ROOT.GetName]の第一党であり、§Y軍人派§!と§Y文民派§!に分かれている。\n\n§Y文民派§!は一般的に民間産業を重視した民主主義政策を好む。一方、§Y軍人派§!は親ファシスト政策および産業の軍事化を好む。\n\n我々の選択により我々への支持が上下し、それに応じてボーナスやペナルティが発生する。\n彼らが反抗的になった場合、クーデターを試みる可能性がある。\n\n支持状態は、§Y反抗的§!、§Y反対§!、§Y中立§!、§Yわずかな支持§!、§Y全面支持§!の5段階"
 SIA_shuffle_pridi_to_the_minister_of_interior: "文民派の地位の強化"
 SIA_shuffle_pridi_to_the_minister_of_interior_desc: "プリディを外務大臣ではなく内務大臣に据えることで、政府資源の配分をより効果的に統制し、強まりつつある軍の影響力に歯止めをかけられる。"
 SIA_shuffle_pridi_to_the_minister_of_interior_tt: "§Y$anti_fascist_raids$§!は今後§Y文民派§!の支持を上昇させ、§Y軍人派§!の支持を低下させる"
 SIA_civil_nationalism: "市民ナショナリズム"
 SIA_civil_nationalism_desc: "すべてのタイ国民は、身分に関わりなく、自らの忠誠を1つの政府や1人の人物に向けるべきではない。いま権力の座に誰が就いていようと、守るべきは自由と平等の価値であると理解しなければならない。"
 SIA_the_true_heirs_of_1932: "1932年革命の正統な継承者"
 SIA_the_true_heirs_of_1932_desc: "軍部は1932年革命を自分たちだけの手柄として描きたがるが、それが国民の勝利であったという事実を葬り去っている。国民にはその事実を思い出させるだけでよい。そうすれば、我々は彼らから力を得られる。"
 SIA_thammasat_university: "タマサート大学"
 SIA_thammasat_university_desc: "新設のタマサート大学は、タイに新たな革新の時代を切り開くためにも拡充していくべきである。"
 SIA_defenders_of_constitutional_liberty: "憲法上の自由の擁護者"
 SIA_defenders_of_constitutional_liberty_desc: "教師、銀行家、看護師など教養ある中間層は、軍人派が行きすぎた場合、自由を守るために奮い立たせ、動員できる。"
 SIA_dominate_public_symbols: "公的象徴の独占"
 SIA_dominate_public_symbols_desc: "軍人派は長らく、銅像を建て、自らを祝う祝日を制定することで、公的象徴を独占してきた。我々も独自の象徴を打ち立て、これに対抗しなければならない。人民の自決権と、旧来の専制に対する勝利をたたえるのだ。"
 SIA_civil_service_heroism: "市民的英雄精神"
 SIA_civil_service_heroism_desc: "国内外を問わず、いかなる勢力であれ法の支配を自らのものにしようとするなら、すべてのタイ国民がそれを守る生来の義務を自覚しなければならない。何者かが我々の自由を奪おうとするとき、必要なのは国民の支持だけではない。国民自身が旗手として立ち上がる必要がある。"
 SIA_spread_democratic_sentiment_in_universities: "大学に民主主義の気運を広げる"
 SIA_spread_democratic_sentiment_in_universities_desc: "学界に身を置く者たちは[SIA.GetName]の未来を内に抱えている。彼らが今日学ぶことは未来へと響いていく。現代の学徒たちに強い民主的義務感を植え付ければ、その精神を学び舎の外へと広げられるかもしれない。"
 SIA_sideline_disloyal_officers: "不忠な将校の左遷"
 SIA_sideline_disloyal_officers_desc: "軍の将校団は一枚岩ではない。その隊列の中には、政府ではなく、かつての庇護者や対立する派閥、あるいは自らの野心に忠誠を向ける者たちがいる。慎重な再配置と行政上の圧力により、こうした人物を脅威とならない任地へ移す一方、信頼に足ることを示した者たちには、それにふさわしい責務を与えることができる。"
 SIA_sideline_disloyal_officers_tt: "ランダムに選ばれた将軍2名が4年間§Y転任§!特性を得て、ボーナスを付与しなくなる。\n§Y転任§!特性を持たないランダムな将軍2名は、追加の能力値と正の特性を1つ獲得する。"
 SIA_direct_funds_from_the_military_towards_development: "軍費を開発に振り向ける"
 SIA_direct_funds_from_the_military_towards_development_desc: "軍人派は、自らの資金が開発に振り向けられることを面白く思わないだろう。だが、この投資不足が最終的には国民の利益になるのだと説明する責任は、我々ではなく彼らにある。"
 SIA_as_the_eyes_turn_towards_southeast_asia: "視線がアジアに向かうなかで"
 SIA_as_the_eyes_turn_towards_southeast_asia_desc: "東南アジアはもはや遠くの戦域ではなく、帝国、革命、戦争が交わる交差点である。[SIA.GetName]はこの闘争における一つの駒になるのか、それとも独自の構想を持つ強国になるのか、決断しなければならない。"
 SIA_support_songsuradets_military_clique: "ソンスラデート派軍閥への支援"
 SIA_support_songsuradets_military_clique_desc: "すべての将校が国家の敵というわけではない。ソンスラデートとその忠実な支持者たちは、シャムを崩壊寸前へと追い込んだ腐敗した将軍たちに代わる、規律ある軍部による選択肢を提示している。彼らの支援があれば、国家に混乱を招くことなく秩序を回復することができる。"
 SIA_support_songsuradets_military_clique_tt: "§Y内戦§!が勃発した場合、ソンスラデートが我々を支援し、追加で§Y3§!個師団を提供する\n§R我々がソンスラデートを強化した後に$SIA_the_songsuradet_rebellion$を通じて彼を拘束しようとした場合、彼が抵抗する可能性がある。§!"
 SIA_the_royal_police_counterweight: "王立警察"
 SIA_the_royal_police_counterweight_desc: "王立警察は独立した勢力として機能しており、反対派が権力を奪おうとした場合には、これに対抗するため利用できる。"
 SIA_the_royal_police_counterweight_tt: "§Y内戦§!が勃発した場合、王立警察が我々を支援し、追加で§Y2§!個師団を提供する"
 SIA_for_the_preservation_of_siamese_independence: "軍人派による支配の強化"
 SIA_for_the_preservation_of_siamese_independence_desc: "前世紀、列強は[SIA.GetAdjective]の領土保全を侵し続けてきた。そして、今世紀も状況は変わらないようだ。我々の生き方を守るには、断固たる行動が必要である。さもなくば、傷つき、分断され、引き裂かれた残存国家へと成り果ててしまうだろう。"
 SIA_for_the_preservation_of_siamese_independence_tt: "§Y$anti_democratic_raids$§!は今後§Y軍人派§!の支持を上昇させ、§Y文民派§!の支持を低下させる"
 SIA_the_peoples_day: "国民の日"
 SIA_the_peoples_day_desc: "旧君主制を打倒した際の軍の役割をこれ以上強調するよりも、国民自身の役割をこそ高く掲げるべきである。国民の日を制定すれば、国家を鼓舞し、国民にそれ以下では満足すべきでないと教えられる。"
 SIA_hold_military_parades: "軍事パレードの開催"
 SIA_hold_military_parades_desc: "軍の士気を高め、忠実な将軍たちに報い、国民に[SIA.GetAdjective]軍の力を再認識させるため、我々はバンコクで盛大なパレードを開催する。新聞各紙には載せるに値する話題を与えてやろう！"
 SIA_embed_technocrats_in_civilian_institutions: "技術官僚を文民機関に組み込む"
 SIA_embed_technocrats_in_civilian_institutions_desc: "政府内の技術官僚と手を結び、彼らを文民派の手足として用いることで、より広く手を伸ばし、軍の影響力に対抗できる。"
 SIA_military_academies_indoctrination: "士官学校での思想教育"
 SIA_military_academies_indoctrination_desc: "士官学校は思想教育の理想的な対象だ。武器も十分にあり、若い士官候補生たちは教官の影響を受けやすい。教官たちを味方につければ、軍の若者たちを味方につけたも同然だ。支配階級に忠実な強力な軍隊こそ、あらゆる強国の基盤であり、我々もまた強国となる。"
 SIA_the_king_of_the_white_elephant: "白象王"
 SIA_the_king_of_the_white_elephant_desc: "失われた領土の奪還を求める狂騒が国をのみ込もうとしており、世界もそれを注視している。この熱狂を鎮めるため、我々は反戦映画を製作する。これは英語で撮影される初のタイ映画となり、世界に[SIA.GetName]の真の姿を示すことになるだろう。"
 SIA_the_king_of_the_white_elephant_tt: "国家方針「§Y$SIA_sala_chaloem_thai_movie_theater$§!」完了時にプロパガンダ・キャンペーン「§Y$SIA_the_king_of_the_white_elephant$§!」をアンロックし、以下を得る:\n180日間、週ごとの安定度: §G+0.45%§!"
 SIA_drum_up_irredentism: "領土回復主義を煽る"
 SIA_drum_up_irredentism_desc: "来たる戦争に向けて軍の支持を確保するだけでは足りない。国民全体の支持も勝ち取らねばならない。我々の歴史的領土を奪った帝国主義列強との決着に向け、詩や映画、演説を通じて[SIA.GetName]を備えさせるのだ。"
 SIA_sell_privy_purse_lands: "王室所有地を売却する"
 SIA_sell_privy_purse_lands_desc: "王室は現在、我々の支配下にある広大な土地を保有している。これらの地所は国庫を大いに潤しうるうえ、その一部を選ばれた将校たちに有利な価格で売却すれば、彼らの忠誠も確保できる。"
 SIA_sell_privy_purse_lands_tt: "この精神が失効すると、§Y[SIA_phraya_phahon.GetName]§!がスキャンダルに巻き込まれ、§Y$SIA_phibuns_premiership$§!のファシズム要件を迂回できるようになる"
 SIA_war_fervor: "戦意"
 SIA_war_fervor_desc: "来たる戦争を前に太鼓が鳴り響く。国民の備えは整い、導火線には火がつき、戦意はまもなく頂点に達する。我々はこの熱気を、しかるべき大義へと向けねばならない。"
 SIA_war_fervor_tt: "他国に宣戦布告するまで戦争協力度が恒久的に上昇し、宣戦布告するとこの精神は取り除かれる。\n\n§Y戦争協力度§!が§Y95%§!を超えたまま長期間宣戦布告しない場合、内戦が勃発する。\n宣戦布告時: "
 SIA_the_midnight_meeting: "真夜中の会合"
 SIA_the_midnight_meeting_tt: "[SIA_plaek_phibunsongkhram.GetName]が[SIA.GetNameDef]で権力を掌握し、政府の指導者になる。我々は正当な君主制を復活させるため、彼を失脚させる必要がある。"
 SIA_the_midnight_meeting_desc: "陸軍元帥のソンスラデートは、ピブーンがさらに大きな権力を集めるのを眺め、いつか報いを受けると感じている。君主制とソンスラデートが生き残るならば、王党派、上級将校、文民の名士たちは秘密裏に会合し、ピブーンが敵対行動を起こす前に彼の排除について合意しなければならない。"
 SIA_meet_with_king_prajadhipok: "プラチャーティポック国王への謁見"
 SIA_meet_with_king_prajadhipok_desc: "国王不在の謀略はただの軍部の陰謀に過ぎない。亡命中のプラチャーティポック国王に謁見することで、我々は大義を王権の正統性の庇護下に置き、国王の祝福を確保することができる。国王は自らの復帰によって躊躇していた者たちを結集させ、政権を分裂させる可能性がある唯一の人物である。"
 SIA_prajadhipok_audience_with_churchill: "プラチャーティポック、[ENG.GetLeader]に謁見"
 SIA_prajadhipok_audience_with_churchill_desc: "[ENG.GetName]におけるプラチャーティポックの存在は単なる名声以上のものをもたらす。王党派による蜂起がアジアにおけるイギリスの利益に資することを[ENG.GetLeader]に納得させられれば、いずれはマラヤからの武器がいまだに王権に忠実な者たちの手にわたるかもしれない。"
 SIA_prajadhipok_audience_with_churchill_tt: "[ENG.GetName]が我々に以下のものを提供する "
 SIA_prajadhipok_audience_with_churchill_tt2: "内戦勃発時。"
 SIA_facilitate_prajadhipoks_move_to_japan: "プラチャーティポックの日本移住支援"
 SIA_facilitate_prajadhipoks_move_to_japan_desc: "[ROOT.GetNameDef]における騒乱で得をする可能性があるのはイギリスだけではない。プラチャーティポックの日本への渡航を手配することにより、東京からの好意を得られるかもしれず、さらに王党派の蜂起が内戦に発展した場合に師団の提供を受ける確約がもらえるかもしれない。"
 SIA_facilitate_prajadhipoks_move_to_japan_tt: "内戦中、[JAP.GetNameDef]からのレンジャー3個師団が我々を支援する。"
 SIA_the_kings_gambit: "王の一手"
 SIA_the_kings_gambit_desc: "プラチャーティポックは現政権に逮捕されることを十分予想した上でバンコクに帰還する。その行為は王党派に怒り、正統性、権威を与え、彼らの躊躇を捨てさせ、彼の名の下での蜂起を促す。亡命中の国王が拘束されれば、それを合図に[ROOT.GetName]を巡る戦いが始まる。"
 SIA_the_kings_gambit_tt: "我々が獲得する支持は、我々が味方につけた派閥の数に依存する。"
 SIA_restore_order: "秩序の回復"
 SIA_restore_order_desc: "内戦は勝利に終わったが、勝利だけでは王国は癒されない。瓦礫と化したものを再建し、守旧派を懐柔し、行政を再構築しなければならない。そうすることで、[ROOT.GetName]は混乱から立ち上がり、王位の安全が保証され、民衆の生活があるべき道に戻ることになる。"
 SIA_ananda_age_trigger_12: "アーナンタ国王が§Y12§!歳以上である（現在§Y[?var:SIA_anandas_age]§!歳）。彼の誕生日は9月20日"
 SIA_ananda_age_trigger_15: "アーナンタ国王が§Y15§!歳以上である（現在§Y[?var:SIA_anandas_age]§!歳）。彼の誕生日は9月20日"
 SIA_ananda_trait_tt: "アーナンタは即位時に以下を手に入れる: "
 SIA_to_forge_a_king: "王を擁立する"
 SIA_to_forge_a_king_desc: "アーナンタ国王は引き続き遠くスイスに滞在しており、まだ若く、その精神と人格は形成途上である。我々が彼の学業を慎重に導くことができれば、単なる名目上の君主ではなく、我々が意図する[ROOT.GetNameDef]の運命にふさわしい統治者になるだろう。"
 SIA_to_forge_a_king_tt: "未来の国王、アーナンタ・マヒドンはまだ幼く、現在は[SWI.GetName]で学んでいる。我々は彼の今後の学業や関心に影響を与えることができ、彼が偉大な国王になるよう導くことができる。\n\n彼が15歳になるまでの間、毎年の彼の誕生日に彼の学習分野を選択することができる。その結果、彼が即位する際に異なるボーナスが付与される。\n\n彼の誕生日は9月20日で、現在§Y[?var:SIA_anandas_age]§!歳である"
 SIA_ascend_the_throne: "即位"
 SIA_ascend_the_throne_desc: "摂政の時代は永遠に続かない。アーナンタは今、自ら王位という重責を担う年齢となった。彼が正式に即位すれば、復活した君主制は後見と策略から離れ、新しい正当な治世に移行することになる。"
 SIA_the_provincial_council_of_state: "地方国務評議会"
 SIA_the_provincial_council_of_state_desc: "戦闘は統治機構を破壊し、権威を不安定なものとした。若き国王アーナンタが自らの名の下に統治できるようになるまで、地方国務評議会を臨時の政府として設置しなければならない。そして評議会は、王党派が自らのためではなく、正統な君主制の復活のために戦っていることを宣言しなければならない。"
 SIA_the_regency_of_boworadet: "ボーウォーラデートの摂政政治"
 SIA_the_regency_of_boworadet_desc: "ボーウォーラデート親王は旧秩序の威信を帯びており、彼の忠誠心がどこにあるのかを疑う者はいない。彼をアーナンタの摂政として任命することで、我々は国家を保守派の手に委ね、君主制の復活が単なる閣僚の交代とは違うということを明確に示すことになる。"
 SIA_the_sacred_hierarchy: "聖なる序列"
 SIA_the_sacred_hierarchy_desc: "ボーウォーラデートは、王国が最も強いのはすべての身分の者が自らの地位をわきまえ、王権があらゆる世俗的な野心よりも上に立つ時だと考えている。君主制、信仰、[ROOT.GetNameDef]の自然の階層秩序は、取引の対象となる遺物ではなく、神聖な柱として再び取り扱わなければならない。"
 SIA_the_regency_of_songsuradet: "ソンスラデートの摂政政治"
 SIA_the_regency_of_songsuradet_desc: "ソンスラデートは自由主義者ではないが、近代国家が必要とするものを見失っているわけでもない。彼は摂政として王家の権威を維持しつつ、[ROOT.GetNameDef]の未来を規律、計画、軍主導の国家発展計画に委ねることができる。"
 SIA_order_discipline_and_unity: "秩序・規律・統一"
 SIA_order_discipline_and_unity_desc: "派閥政治と内戦による混乱は、王国をほぼ破壊しつくした。ソンスラデートの答えは明白で、統治における秩序、社会における規律、目的の統一であり、それによって王国をより強く、近代的な国家に作り直すことができる。"
 SIA_the_regency_of_rangsit: "ランシットの摂政政治"
 SIA_the_regency_of_rangsit_desc: "ランシット親王は、君主制を存続させるには自らを代議政治と調和させるしかないことを理解している。彼の摂政政治は王政の復活を提示するもので、威厳においては保守的でありながら、手法においては民主的であり、[ROOT.GetNameDef]に安定した議会制の未来を与える準備ができている。"
 SIA_constitutional_virtue: "立憲の美徳"
 SIA_constitutional_virtue_desc: "法を尊重する君主制は転覆しにくく、防衛しやすいものである。ランシットの指導の下、我々は立憲政治を復活させ、専制的な権力を抑制する。そして、王位は法の下での自由の守護者として立つ時にこそ最も強固であることを国民に教えることになる。"
 SIA_an_absolute_monarchy: "絶対君主制"
 SIA_an_absolute_monarchy_desc: "立憲君主制の試みがもたらしたものは、恥辱、クーデター、野心的な将校による王権の簒奪のみである。王位が再び忠誠を獲得しようとするならば、王権はその特権を完全に回復し、政党や議会に従属することなく統治しなければならない。"
 SIA_a_constitutional_monarchy: "立憲君主制"
 SIA_a_constitutional_monarchy_desc: "王位が王国を維持するために国家を支配する必要はない。持続可能な立憲的枠組みの中で君主制を復活させることにより、我々は王権と国民を結び付け、国王の尊厳が責任ある政府と共存することを保証する。"
 SIA_to_lay_the_bait: "餌を仕掛ける"
 SIA_to_lay_the_bait_tt: "我々は偽の経済計画を流出させ、軍部の反感を煽る。\n§Y$SIA_and_spring_the_trap$§!を遅らせるほど軍部への反発は増大し、我々への支持が強固なものとなる。\n\n$SIA_dem_event_count_cw_scale_tt$\n\n軍部が偽の草案を批判するたび、内戦における我々への支持が増加し、最大で内戦協力度が§Y75%§!に達する。さらに、民主主義への総支持率（§Y0%～100%§!）に応じ、内戦協力度が最大§Y25%§!加算される。"
 SIA_dem_event_count_cw_scale_tt: "§Y現在の予測支持率§!: §G[?var:SIA_dem_event_count_cw_scale|%]§!"
 SIA_to_lay_the_bait_desc: "経済改革を要求する「黄色い文書」を軍部は共産主義的だとして非難するだろう。急進的な偽の草案を先んじて流出させることにより、彼らの怒りを誘発し、その後より穏健な本物の草案を公表することで彼らの信用を失墜させることができる。"
 SIA_and_spring_the_trap: "そして罠を発動する"
 SIA_and_spring_the_trap_desc: "将軍たちが餌に食いついた。彼らの激しい怒りは反乱へと発展し、彼らの野心があらわとなった。一方で、文民政府は準備万全であった。反逆者たちは罠にかかり、[ROOT.GetName]の未来は憲法に忠誠を誓う者たちによって決定されることになる。"
 SIA_and_spring_the_trap_tt: "我々の総支持率が§Y80%§!を超えれば、内戦を回避して即座に軍部を排除できる。"
 SIA_rebuild_the_war_torn_economy: "戦禍に傷ついた経済の再建"
 SIA_rebuild_the_war_torn_economy_desc: "内戦によって道路、工場、稲田、貿易路が破壊された。すぐに再建に取り掛からなければならない。バンコクからのいかなる演説よりも、[ROOT.GetName]の安定化に寄与するのは賃金、穀物、鉄道、信用である。"
 SIA_end_military_grift: "軍の汚職一掃"
 SIA_end_military_grift_desc: "あまりにも長きにわたり、軍事予算は私腹を肥やす者や、後援組織、威信を誇示するための無駄な事業に費やされてきたが、戦争によって腐敗は白日の下にさらされた。すべての汚職契約、実体のない部隊、盗難物資を調査し、旧派閥から剥奪しなければならない。"
 SIA_the_purge: "粛清"
 SIA_the_purge_desc: "軍閥は文民の統治に従わず、国家を血に染めてきた。裏切り者に対する妥協の余地はない。将校、協力者、支持者たちが再び国家を脅かす前に、すべての指揮系統から排除しなければならない。"
 SIA_achieve_foreign_legitimacy: "外国から見た正当性の確立"
 SIA_achieve_foreign_legitimacy_desc: "海外列強は我が国の危機に疑念の目を向けており、シャムが軍事政権の手に落ちるのか、それとも革命に至るのかを見届けようとしている。我々は法に基づく文民政府が健在であり、国家を防衛する能力があることを証明しなければならない。"
 SIA_achieve_foreign_legitimacy_trigger: "いずれかの主要国の我々に対する評価が§Y75§!を超えている"
 SIA_countries_that_like_me_doctrine_tt: "以下に対して§Y[?var:SIA_countries_that_like_me]x§! §G50%§!のコスト削減: §Y陸軍ドクトリン§!"
 SIA_achieve_foreign_legitimacy_tt: "我々に対する評価が§Y75§!を超える主要国ごとに安定度を§G[?var:SIA_achieve_foreign_legitimacy_base_stab_gain|%.0]§!獲得する。\n\n条件を満たす主要国が§Y3§!か国を超える場合、超過した主要国ごとに§Y陸軍ドクトリン§!のコストを§Y1x§! §G50%§!削減する。\n\n条件を満たす主要国が§Y6§!か国以上の場合、§Y民需工場§!を§G2§!個獲得する。"
 SIA_secure_the_state: "国家の安定確保"
 SIA_secure_the_state_desc: "内戦での勝利は国家の安定を意味するものではない。反動的な将校が再結集する前に、鉄道、港湾、兵器庫、通信拠点を確保する必要がある。バンコクは平穏で、分断されず、確実な文民統制下に置かれなければならない。"
 SIA_expand_upon_the_dossier: "「黄色い文書」の拡張"
 SIA_expand_upon_the_dossier_desc: "「黄色い文書」は不安定な時期に書かれたものだが、その時期はもう過ぎ去った。軍閥が敗北したことで我々は先に進むことができる。農地改革をさらに進め、労働者保護を強化し、シャムを根本から作り変えることのできる国家になるのだ。"
 SIA_military_oversight_bureau: "軍監察局"
 SIA_military_oversight_bureau_desc: "軍が再び国家内国家になることを許容してはならない。文民主導の監督局が軍隊内部の人事、予算、政治活動を監視し、バンコクが軍の言いなりになるのでなく、軍がバンコクに従う体制を確立する。"
 SIA_military_oversight_bureau_tt: "§Y軍事監督局§!が5～9か月ごとに将軍に対する調査を実施する。この期間中、対象の将軍は監視の強化を警戒して効率が低下する。"
 SIA_the_yellow_dossier: "黄色い文書"
 SIA_the_yellow_dossier_desc: "急進的な偽草案はその役割を果たした。今こそ本物の「黄色い文書」の内容を実行する時だ。すなわち、慎重な改革、経済の近代化、そして、国家を混乱に陥れることなく軍部の支配を打破するために設計された、政治的保護策の導入である。"
 SIA_achieve_domestic_legitimacy: "国内における正当性の確立"
 SIA_achieve_domestic_legitimacy_desc: "政府は武力によって存続してきたが、これからは法と食糧と秩序によって勝利しなければならない。国民の信頼を回復させ、緊急措置を正当化し、文民統治が生存以上のものをもたらすことを証明せねば。"
 SIA_achieve_domestic_legitimacy_tt: "§Y人民党体制§!は無効化される。\n§Y軍人派§!は永久に解散し、その国民精神は完全に削除される。\n\n§Y文民派§!は永久に再編され、§Y$idea_SIA_unwavering_civilian_support$§!に移行する。"
 SIA_allies_integration: "連合国との統合"
 SIA_allies_integration_desc: "我が軍は連合国と連携して戦う術を学ばなければならない。シャムが単なる象徴的なパートナーを超える存在になるためには、指揮系統、通信、補給手順、装備基準を同じ水準まで引き上げなければならない。"
 SIA_prepare_for_a_pacific_war: "太平洋戦争に備える"
 SIA_prepare_for_a_pacific_war_desc: "帝国の視線は太平洋へと向けられている。日本の野心、ヨーロッパの植民地、連合国の戦略、すべてが迫りくる嵐を示している。最初の砲火が我が国の沿岸を襲う前に、シャムは備えなければならない。"
 SIA_the_end_of_gunboat_diplomacy: "砲艦外交の終焉"
 SIA_the_end_of_gunboat_diplomacy_desc: "外国の戦艦がチャオプラヤ川の河口から講和条件を強要することなど、は二度とあってはならない。バンコクを脅かすことは狂気の沙汰だと思わせるだけの火砲、ドック、機雷、沿岸防御をシャムは保有しなければならない。"
 SIA_preemtive_strike: "先制攻撃"
 SIA_preemtive_strike_desc: "日本が開戦時刻を選ぶのを指をくわえて待つのは愚策である。帝国がアジアを蹂躙するつもりならば、[SIA.GetName]は彼らの軍や艦隊が他方面に完全に投入される前に襲撃しなければならない。"
 SIA_the_siamese_armada: "[SIA.GetAdjective]艦隊"
 SIA_the_siamese_armada_desc: "近代国家の[SIA.GetName]には近代的な艦隊が必要である。新たな艦船、訓練された乗員、拡張された海軍インフラを備えた[SIA.GetAdjective]艦隊は、我が国の沿岸防衛を担い、その先まで戦力を投射できる戦力になるだろう。"
 SIA_asian_democratic_compact: "アジア民主協定"
 SIA_a_more_moderate_option: "もっと穏健な選択肢"
 SIA_a_more_moderate_option_desc: "改革は持続することが重要で、反対の嵐の中で自らを消耗させてはならない。「黄色い文書」を穏健な水準に保つことで、過激派を孤立させ、中間層をなだめ、最初の勝利を越えて存続する文民秩序を構築できる。"
 SIA_asian_democratic_compact_desc: "アジアはいつまでも遠方の帝国や列強の約束を頼りにすることはできない。この地域の民主国家は結束し、相互に防衛し、独立と自由がアジアで存続できることを証明しなければならない。"
 SIA_asian_democratic_compact_tt: "アジアの属国の独立を要求することが可能になり、それらの国を我々の陣営に招き入れることができるようになる。"
 SIA_asian_democratic_compact_modify: "§Y$SIA_asian_democratic_compact$§!に以下の補正を加える:"
 SIA_southeast_asia_joint_command: "東南アジア合同司令部"
 SIA_southeast_asia_joint_command_desc: "我々の協定を外交上の約束以上のものにしなければならない。合同司令部は東南アジア全域にわたって戦略、兵站、諜報、防衛計画を調整し、バラバラの軍を一枚の盾に変える役目を担う。"
 SIA_pan_asian_weapon_standardization: "汎アジア兵器規格統一"
 SIA_pan_asian_weapon_standardization_desc: "同盟国がそれぞれ異なるライフル、口径、無線機、車両を使っていては、兵站上の破綻を招く。兵器の標準化と生産計画の共有により、我々の連合はより強力で低コストになり、より迅速に武装できるようになる。"
 SIA_united_against_aggression: "侵略に対する団結"
 SIA_united_against_aggression_desc: "我々の協定の構成国が孤立することはない。脅威の主体が帝国、ファシスト、軍国主義者、日和見主義の隣国のいずれであろうと、アジアはこれに共同で対応する。"
 SIA_the_hammers_that_strike: "鉄槌の一撃"
 SIA_the_hammers_that_strike_desc: "我々の同盟はもはや生き残りを願う小国の集いではなく、一つの武器である。各構成国それぞれが鉄槌であり、アジアの支配を企むあらゆる勢力に団結して打撃を加える。"
 SIA_mobilize_the_defenders_of_siam: "シャムの守護者を動員する"
 SIA_mobilize_the_defenders_of_siam_desc: "かつて軍部は国家を失敗に導いたが、シャムには依然として守護者が必要だ。志願兵、忠誠心のある将校、地方警備隊、愛国的市民を一つの軍隊に編成し、国内外の敵から憲法を保護する。"
 SIA_join_the_allies: "連合国への参加"
 SIA_join_the_allies_desc: "世界が戦争に飲み込まれるなか、[ROOT.GetName]は孤立するわけにはいかない。連合は加盟国に武器を提供し、認知し、侵略に対抗する国家の一員としての地位を提供してくれる。彼らに加わることで、シャムの生存を、自由な世界を求めるより広範な闘争と結びつける。"
 SIA_the_malay_peninsular_defense_plan: "マレー半島防衛計画"
 SIA_the_malay_peninsular_defense_plan_desc: "戦争が東南アジアに到達したとき、真っ先に戦場と化すであろう場所の一つがマラヤだ。要塞化、補給基地、イギリスとの共同計画により、この半島を侵略者に対する盾に変える。"
 SIA_the_malay_peninsular_defense_plan_tt: "バンコクとシンガポールの間に鉄道を敷設する。\n\n[MAL.GetName]、シンガポール、[724.GetName]、[289.GetName]、[1076.GetName]のすべての戦勝点\n§Y沿岸要塞§!を§G2§!つ追加\n§Y陸上要塞§!を§G2§!つ追加\nこれらの各州:\n§Y固定対空砲§!を§G1§!つ追加"
 SIA_join_the_united_front: "統一戦線への参加"
 SIA_join_the_united_front_desc: "中国は[JAP.GetAdjective]の侵略下で血を流しているものの、まだ戦いをやめていない。統一戦線に参加することで、[SIA.GetName]はこの戦地を帝国の野望の墓場に変える手助けができる。"
 SIA_a_land_war_in_asia_desc: "宣言だけでは戦争に勝てない。シャムの兵士はアジアの困難な地形を行軍し、戦い、耐え抜かなければならないのだ。統一戦線に対する貢献は行動で示さなければ。"
 SIA_death_to_the_communists: "共産主義者に死を"
 SIA_death_to_the_communists_desc: "軍閥の敗北が次なる独裁への扉を開くものであってはならない。共産主義の扇動者たちはこの危機が国家を弱体化させたと信じている。だが彼らは間もなく、文民による民主主義が無防備ではないと知ることになるだろう。"
 SIA_death_to_the_nationalists: "民族主義者に死を"
 SIA_death_to_the_nationalists_desc: "日本を追い返すことはできたが、アジアの未来という問題は残ったままだ。かつての民族主義者による秩序は一つの階層を他の階層に置き換えるものにすぎない。アジアを作り直すのであれば、共産主義者が勝利しなければならない。"
 SIA_a_new_dawn_over_asia: "アジアの新たな夜明け"
 SIA_a_new_dawn_over_asia_desc: "大日本帝国は崩壊し、後釜を狙った腐敗した勢力も退けられた。帝国の支配から解放された未来を築こうと決意するアジア全域の国家に新たな夜明けが訪れようとしている。"
 SIA_phibuns_premiership: "ピブーンの首相就任"
 SIA_phibuns_premiership_desc: "[SIA_phraya_phahon.GetName]の首相任期が終わりを迎えるなか、党が選んだ後継者プレーク・ピブーンソンクラームは権力の座に就く準備を整えている。これは軍部を大いに喜ばせる一方で、文民派を不安に駆り立てるだろう。\nこの新しい時代に、我々が進むべき道は一つしかない。強い信念をもって進むのだ！"
 SIA_siamese_youth_movement: "[THIS.GetAdjective]青年運動"
 SIA_siamese_youth_movement_desc: "[THIS.GetName]の若者たちは、炎にくべた鋼のように鍛え上げなければならない。国家を尊重し、祖国を守る術を学ぶことで、彼らはタイ社会に欠かせない一員となるだろう。"
 SIA_territorial_defense_student: "国土防衛学生"
 SIA_territorial_defense_student_desc: "青年運動の延長として、最も有望な候補者たちを青年兵訓練キャンプに送ることができる。そこで彼らは[SIA.GetNameDef]の防衛に従事する。彼らは適切な軍事訓練を受け、軍が活用できる追加の戦力となるだろう。"
 SIA_expand_domestic_arms_workshops: "国内兵器工廠の拡充"
 SIA_expand_domestic_arms_workshops_desc: "国内の軍需物資生産能力は、ほかの先進国に比べてあまりにも立ち遅れている。本土での軍需生産拡大に力を注ぎ、我が軍に絶えず新たな装備が供給されるようにしなければならない。"
 SIA_look_to_european_fascism: "欧州ファシズムに学ぶ"
 SIA_look_to_european_fascism_desc: "この国を改革する好機が訪れている。過去の束縛を断ち、西洋で起きている出来事に触発されながら、新たな未来へと目を向けねばならない。旧世界秩序が解体されつつあるのは明白であり、取り残される者は先見性の欠如の代償を払うことになるだろう。"
 SIA_the_songsuradet_rebellion: "ソンスラデートの反乱"
 SIA_the_songsuradet_rebellion_desc: "上級将校プラヤー・ソンスラデートは、その気になれば現政権にとって脅威となりうる存在だ。この体制への危険を放置することはできず、ピブーン最大の政敵である彼は排除されなければならない。\nソンスラデートとその支持者を攻撃するための材料は十分にあり、それを利用すれば我々の権力を固め、国内の反対派を排除する助けとなるだろう。"
 SIA_the_songsuradet_rebellion_historical_tt: "将軍プラヤー・ソンスラデートは国家に対する陰謀の罪で告発される。彼と顧問の§Y[SIA_rangsit_prayurasakdi.GetName]§!は粛清される。\n\n以下を獲得\n"
 SIA_the_songsuradet_rebellion_historical_tt2: "期限切れ後、以下を獲得: "
 SIA_the_songsuradet_rebellion_historical_tt3: "§Y[?var:SIA_purged_military_timer]§!日間"
 SIA_the_songsuradet_rebellion_alt_tt: "将軍プラヤー・ソンスラデートは国家に対する陰謀の罪で告発される。\n\nしかし、我々が彼の軍閥を強化したため、彼は強気に出て召喚を拒否し、膠着状態、あるいは内戦に発展する可能性がある。"
 SIA_sue_the_king_in_exile: "亡命中の国王を提訴する"
 SIA_sue_the_king_in_exile_desc: "亡命中の国王は、大量の貴重品を[ENG.GetNameDefCap]へ持ち出したと噂されている。我々はそれを取り戻さなければならず、そのために彼とその配偶者を提訴することになっても構わない。"
 SIA_suspend_ordinary_legal_procedures: "通常の法手続きの停止"
 SIA_suspend_ordinary_legal_procedures_desc: "ソンスラデートの反乱は、国家安全保障の名のもとに大規模な改革を断行する機会を我々にもたらす。裁判所やその他の政治機関が担ってきた抑制と均衡は骨抜きにされ、権力集中に必要な時間を稼げるだろう。"
 SIA_the_duty_of_the_thai_people_during_the_war_act: "戦時におけるタイ国民の義務法"
 SIA_the_duty_of_the_thai_people_during_the_war_act_desc: "$idea_SIA_cemented_control_3_desc$"
 SIA_recognize_manchukuo: "満洲国を承認する"
 SIA_recognize_manchukuo_desc: "TODO_CM"
 SIA_press_censorship: "報道検閲"
 SIA_press_censorship_desc: "自由な報道は国家の安定を損なうおそれがある。ある程度の裁量は必要だが、メディアにおいては政府の声と意思が確実に優先されなければならない。"
 SIA_department_of_publicity: "宣伝局"
 SIA_department_of_publicity_desc: "いかなる国家にもプロパガンダ機関は不可欠だ。特に、我々のように領土的野心を抱く国家ならなおさらである。宣伝局に資金を投じれば、それを実現できる。"
 SIA_thai_cultural_mandates: "タイ文化命令"
 SIA_thai_cultural_mandates_desc: "文化命令を発し、国民の団結を強め、統一されたアイデンティティを築き上げることで、タイ国民を鼓舞し、強固な国民文化を形作ることができる。"
 SIA_thai_cultural_mandates_tt: "文化命令を発令するディシジョンをアンロックし、§Y政治力§!を消費してさまざまな強化を得る。文化命令第1号と、最初に選ぶ別の文化命令1つは無償である。"
 SIA_relocate_the_capital_to_phetchabun: "首都をペッチャブーンに移転する"
 SIA_relocate_the_capital_to_phetchabun_desc: "政府が脅威にさらされている！歴史が示すように、バンコクは海軍の攻撃に脆弱だ。たとえ不人気な決断になるとしても、首都をより内陸へ移す決断は下さねばならない。"
 SIA_relocate_the_capital_to_phetchabun_tt: "§Y[1076.GetName]§!から§Y[1077.GetName]§!へ最大§G3§!つの§Y軍需工場§!を移転する。\n§Y[1076.GetName]§!から§Y[1077.GetName]§!へ§G3§!つの§Y民需工場§!を移転する。\nペッチャブーン周辺にレベル§G3§!の要塞を建設する。"
 SIA_relocate_the_capital_to_phetchabun_tt2: "この精神の期限が切れると、基本安定度に§R-25%§!の修正を受ける"
 SIA_radio_propaganda: "ラジオ・プロパガンダ"
 SIA_radio_propaganda_desc: "[SIA.GetName]の電化が進むにつれ、ラジオは主要なメディアになりつつある。報道機関を掌握すべきであるのと同様に、何が放送されるかも掌握しなければならない。"
 SIA_sala_chaloem_thai_movie_theater: "サラ・チャルーム・タイ映画館"
 SIA_sala_chaloem_thai_movie_theater_tt: "プロパガンダ映画を制作するディシジョンをアンロックし、さまざまな強化を得る。例: \n"
 SIA_sala_chaloem_thai_movie_theater_desc: "映画は我が国では新しい媒体だが、その可能性は誰の目にも明らかだ。詩や書物、ラジオと同様に、庶民から上流階級まで人々の心をつかむことができる。この媒体を用いれば、偉大な[SIA.GetName]の興隆を見届けるという国民の決意を強められる。"
 SIA_pan_thaiism: "汎タイ主義"
 SIA_pan_thaiism_desc: "[ROOT.GetName]は、ただ生き残るだけでは足りない。繁栄しなければならない。[ROOT.GetAdjective]国民の未来は、三流国家に甘んじることではなく、世界情勢の積極的な担い手となることにある。そのためにはまず、かつて我々のものだった土地を奪った帝国主義者に対して国民の心を奮い立たせ、何を奪われたのかを思い起こさせねばならない。"
 vichy_exist_trigger: "§Yヴィシー・フランス§!が存在する"
 vichy_exist_not_trigger: "§Yヴィシー・フランス§!が存在しない"
 SIA_retake_lost_british_states: "失われた英領州の奪還"
 SIA_retake_lost_british_states_tt: "§Yビルマ§!および§Yマレーシア§!の英領に対する限定戦争を開始する能力をアンロック"
 INS_retake_lost_british_states_tt: "§Yマレーシア§!のイギリス領に対して限定戦争を開始できるようになる"
 SIA_retake_lost_british_states_desc: "我々の偉大な王国を分断したのは[FRA.GetAdjective]だけではない。[ENG.GetAdjective]もまた野心に駆られ、あらゆる機会を捉えて自らの取り分を奪っていった。彼らの目がより大きな敵に向いている今こそ、我々が行動すべき時だ。"
 SIA_recover_indochina: "インドシナの奪還"
 SIA_recover_indochina_desc: "前世紀、我が国は[FRA.GetAdjective]によって分断された。世界の裏側にある政府に、我々のすべきことや生き方を指図する権利などない。それでも彼らは砲艦と武力で、我々のものを奪い取ったのだ。今世紀、[FRA.GetAdjecive]の力は衰えつつある。今世紀は我々のものだ。"
 SIA_recover_indochina_tt: "§Yインドシナ§!領に対する限定戦争を開始する能力をアンロック"
 SIA_demand_the_return_of_lost_territory: "失われた領土の返還要求"
 SIA_demand_the_return_of_lost_territory_desc: "[FRA.GetNameDefCap]は弱みをさらけ出した。今や、衰えゆく影響力にしがみつく張り子の虎にすぎない。軍の崩壊によって、もはやかつての強さを示すことはできず、我々の要求に抗する立場にもない。"
 SIA_demand_the_return_of_lost_territory_tt: "§Yインドシナ§!および§Y[MAL.GetName]§!の一部の領有国に対し、§Y[1069.Getname]§!、§Y[1067.Getname]§!、§Y[741.Getname]§!、§Y[1068.Getname]§!、§Y[1061.Getname]§!、§Y[1064.Getname]§!、§Y[1065.Getname]§!、§Y[670.Getname]§!の返還を要求する。\n\n影響要因:\n-領有国に対する我々の戦闘力が30%以上\n-領有国が大国と交戦中\n-領有国が陣営に加盟していない\n-領有国が§Yヴィシー・フランス§!である\n-我々が陣営に加盟している\n-領有国が我々を嫌っている"
 SIA_the_greater_thai_empire: "大タイ帝国"
 SIA_the_greater_thai_empire_available_trigger: "§Y[ROOT.GetName]§!がすべてのインドシナ州を支配している\nすべてのインドシナ州の迎合度が§Y[?var:SIA_greater_thai_empire_compliance_requirement]%§!を超えている\n\n追加で以下が必要: "
 SIA_the_greater_thai_empire_desc: "我々が飛躍する時が来た。かつて奪われたものは取り戻され、国民もまた我々を事実上の統治者と認めている。こうして我々は、新たな大タイ帝国の正統な指導者としての正当性を確固たるものにしたのだ。"
 SIA_crack_down_of_foreign_merchants: "外国商人の取り締まり"
 SIA_crack_down_of_foreign_merchants_desc: "貿易は長きにわたり外国勢力の利害に左右されてきた。そのせいで、我が国の強靭性を損ないかねない脆弱性が生じている。経済安全保障を守るには、自国の貿易を自ら統制し、繁栄と安定が我々自身の支配する基盤の上に築かれるようにしなければならない。"
 SIA_royal_palace_bureau_directive_no_1523: "王宮局令第1523号"
 SIA_royal_palace_bureau_directive_no_1523_desc: "国内で国家主義が高まるなか、王室までもが政府支持を表明し、王宮の全構成員に対し、新式兵器の購入費として収入の10%を寄付するよう求めた。"
 SIA_end_factionalism: "派閥主義の終焉"
 SIA_end_factionalism_desc: "人民党の軍人派と文民派の亀裂は、革命以来あらゆる決定に影を落としてきた。両派閥を十分な期間にわたって政府の側につなぎ留めることができれば、ついに両者を一つの統一人民党へとまとめ上げ、クーデターの亡霊を永久に葬り去ることができる。"
 SIA_end_factionalism_available_tt: "§Y文民派§!と§Y軍人派§!はともに§G完全な支持§!を§Y270§!日間連続で維持している。"
 SIA_end_factionalism_tt: "人民党内部の派閥対立は終結する: \n   §Y文民§!派と§Y軍人§!派は解体され、§G統一人民党§!に再編される\n   国民精神§Y$idea_SIA_unified_khana_ratsadon$§!を獲得する"
 SIA_turn_off_the_khana_ratsadon: "人民党が無効化される"
 SIA_factionalism_overcome: "派閥主義の克服"
 SIA_new_territories_administration: "新領土統治"
 SIA_new_territories_administration_tt: "§Yインドシナ§!領を統治するディシジョンをアンロックし、迎合度、工業力、および要塞化を強化する。"
 SIA_new_territories_administration_desc: "失われた領土の奪還は始まりにすぎない。我々はそこに住む人々に、我々のほうがより良い選択肢であることを示さねばならない。新たな大[ROOT.GetName]の下で、すべての市民が平等を実感できるよう、生活水準を引き上げる包括的な計画を実施する。"
 SIA_new_territories_administration_available_trigger: "§Yインドシナ§!のいずれかの州が\n§Y[ROOT.GetName]§!の支配下にある"
 SIA_industrialization_drive: "工業化の推進"
 SIA_industrialization_drive_desc: "何世代にもわたり、[ROOT.GetName]の富は稲田と農村に依存してきた。しかし、現代世界を形作るのは農具ではなく工場と機械である。我々が列強の中で独立を維持するつもりなら、この農業王国を工業国家に転換しなければならない。"
 SIA_industrialization_drive_trigger: "§Y人民党§!が活動中"
 SIA_asian_financial_compact: "アジア金融協定"
 SIA_asian_financial_compact_desc: "ヨーロッパ資本はいまだにアジア貿易の多くを支配しており、我々の経済を外国の圧力にさらしている。近隣諸国とより緊密な金融関係を模索することで、独立性を損なうことなく融資、市場、投資へのアクセスを拡大することができる。"
 SIA_revision_of_unequal_treaties: "不平等条約の改正"
 SIA_revision_of_unequal_treaties_desc: "弱い立場で締結した古い協定は、いまだに外国の利害関係者に対して現代国家が容認すべきでないような特権を与えている。これらの不平等条約を改正し、[ROOT.GetNameDef]の通商、司法、利権に関する完全な権限を回復しなければならない。"
 SIA_renegotiate_teak_control: "チーク材利権の再交渉"
 SIA_renegotiate_teak_control_desc: "北部の森林は伐採業者に富をもたらす一方、国家への見返りはあまりにも少ない。チーク材利権に関する再交渉を行うことで、収益を取り戻し、伐採を規制し、シャムの木材がシャムの開発に寄与できるようにする。"
 SIA_a_fledgling_tobacco_industry: "タバコ産業の育成"
 SIA_a_fledgling_tobacco_industry_desc: "タバコは依然として小規模な交易品にとどまり、分散している上にほぼ組織化されていない。適度な保護と慎重な投資があれば、この小さな作物が頼もしい収入源になる可能性があり、税収、農村所得、工場労働を提供してくれるだろう。"
 SIA_a_fledgling_tobacco_industry_tt: "§Y$limited_exports$§!または§Y$closed_economy$§!の場合、追加の§Y民需工場§!を1つ得る"
 SIA_all_weather_roads: "全天候道路"
 SIA_all_weather_roads_desc: "雨が降るたびにたくさんの道路が消え、諸州が首都および市場から切り離されてしまう。全天候道路網は王国を一つに結びつけ、あらゆる季節に商品や兵士の移動が可能になる。"
 SIA_the_bank_of_siam: "サイアム銀行"
 SIA_the_bank_of_siam_desc: "産業の成長は慣習や個人的な便宜のみによって進展するものではない。より強力な国営銀行は信用、通貨、資本の循環に対する国家の統制を強化する。"
 SIA_thai_rice_company: "タイ米会社"
 SIA_thai_rice_company_desc: "米は依然として[ROOT.GetName]の生命線だが、その取引の多くは分断され、投機的であり、外国からの圧力に対して脆弱である。国営の米会社であれば、国家が輸出を主導し、価格を安定させ、稲田からの収穫を国力を支えるより強固な基盤に変えることができる。"
 SIA_uk_japan_focus_tt: "これにより、以下の効果を伴って[ENG.GetNameDef]と[JAP.GetNameDef]のいずれかを選択できる: \n\n§Y[ENG.GetFlag][ENG.GetNameDefCap]§!:"
 SIA_japan_option_tt: "§Y[JAP.GetFlag][JAP.GetNameDefCap]§!"
 SIA_send_bureaucrats_abroad: "官僚の海外派遣"
 SIA_send_bureaucrats_abroad_desc: "他国はすでに我々が必要としている省庁、学校、技術サービスを構築している。有望な官僚を外国に派遣することで、外国の統治を受けることなく行政経験を取り入れることができる。"
 SIA_baht_stabilization_act: "バーツ安定法"
 SIA_baht_stabilization_act_desc: "近代経済では商人が信頼し、投資家が受け入れる通貨が必要だ。バーツの安定化は貿易における不確実性を減らし、[ROOT.GetNameDef]に国際市場における強固な足掛かりを提供する。"
 SIA_siamese_development_cooperative: "シャム開発協同組合"
 SIA_siamese_development_cooperative_desc: "民間資本は慎重であり、国家は単独ですべてを建設することはできない。国家開発協同組合は官僚、商人、地主が経済全体に資する事業のために共同で資源を拠出することを可能とする。"
 SIA_boon_rawd_brewery: "ブンロート・ブリュワリー"
 SIA_boon_rawd_brewery_desc: "国内の醸造業は単に消費量だけの問題ではない。ブンロートのような企業は、シャムの資本、機械、経営によって、シャムの地に近代産業が創出できることを示している。"
 SIA_national_savings_bond: "国民貯蓄債券"
 SIA_national_savings_bond_desc: "道路や工場を建設しないまま、国家の富を金庫の中で眠らせていたり、装飾品という形のまま遊ばせてはいけない。国民貯蓄債券は個人の倹約を公共投資に転換する。"
 SIA_national_savings_bond_tt: "$SIA_national_savings_bond$の精神を獲得する。この精神は自国の§Y徴兵法§!に応じて効果が変わり、徴兵法が低いほどプラスの効果が強くなり、徴兵法が高いほど効果は低くなる。\n\n§Y$disarmed_nation$§!の場合は以下を獲得: "
 SIA_national_savings_bond_scraping_the_barrel: "§Y$scraping_the_barrel$§!の場合は以下を獲得:"
 SIA_national_savings_bond_volunteer_only: "§Y$volunteer_only$§!の場合は以下を獲得:"
 SIA_national_savings_bond_limited_conscription: "§Y$limited_conscription$§!の場合は以下を獲得:"
 SIA_national_savings_bond_extensive_conscription: "§Y$extensive_conscription$§!の場合は以下を獲得:"
 SIA_national_savings_bond_service_by_requirement: "§Y$service_by_requirement$§!の場合は以下を獲得:"
 SIA_national_savings_bond_all_adult_serve: "§Y$all_adults_serve$§!の場合は以下を獲得:"
 SIA_national_savings_bond_current: "現在の動員法は以下を付与: "
 SIA_deficit_spending: "赤字財政"
 SIA_deficit_spending_desc: "危険な世界に対応し得る近代経済を構築するには、正統派の簿記では到底間に合わない。国家は現行の収入に先立って積極的に支出しなければならない。公共事業や調達を利用して、産業成長を強制的に動かさなければならない。"
 SIA_deficit_spending_tt: "この精神が失効すると、以下を獲得: "
 SIA_acquire_light_tools: "軽工具の調達"
 SIA_acquire_light_tools_desc: "優れた機械を製造する前に、まずは工業の質素な道具の扱い方を習得しなければならない。軽工具と作業場設備を輸入すれば、小規模な工場と修理工場を[ROOT.GetName]全域に増やしていくことができる。"
 SIA_railway_and_port_extensions: "鉄道と港湾の拡張"
 SIA_railway_and_port_extensions_desc: "米も木材も錫も、市場に届かなければ価値がない。鉄道の延伸と港の拡張により諸州は国家の商業に組み込まれ、[ROOT.GetNameDef]をより広い世界に接続する。"
 SIA_mechanization_of_agriculture: "農業の機械化"
 SIA_mechanization_of_agriculture_desc: "あまりにも多くの労働者が伝統的な耕作に拘束されており、産業にまわす余力がほとんどない。農村部に近代的な道具と機械を導入すれば、生産量を引き上げて、労働力を工場に解放することができる。"
 SIA_irrigation: "灌漑"
 SIA_irrigation_desc: "農民の命運はいまだに洪水と干ばつに左右される。より広範な灌漑システムは収穫を安定させ、耕作地を拡大し、農村部を国家発展のより強固な基盤とする。"
 SIA_siam_cement_group: "[ROOT.GetName]・セメント・グループ"
 SIA_siam_cement_group_desc: "王室の庇護の下で設立された[ROOT.GetName]・セメント・グループは、[ROOT.GetNameDef]で最も重要な産業企業の一つである。重点的な投資と政府の後押しにより、この企業を国内供給業者から、我々のより広範な産業力の中核へと変えることができる。文字通り、国家の未来の土台を築くのである。"
 SIA_chemical_imports: "化学製品の輸入"
 SIA_chemical_imports_desc: "近代的な農業および産業はいずれも、我々がまだ十分な量を生産していない化合物に依存している。国内産業による生産が追いつくまでは、化学製品を輸入することにより、肥料、医薬品、染料、爆薬を供給することができる。"
 SIA_chemical_imports_tt: "この国家方針の完了時に評価が§Y[?var:ROOT.SIA_chemical_imports_opinion_threshold]§!を上回っている場合、マップ外の§Y民需工場§!を§G+1§!追加する。"
 INS_chemical_imports_stolen_tt: "この国家方針の完了時に評価が§Y75§!を上回っている場合、歩兵装備を§G[?var:ROOT.INS_guns_from_seek_help_focus]§!ユニット追加する。"
 SIA_foreign_currency_exchange: "外貨両替"
 SIA_foreign_currency_exchange_desc: "工業化には外国の機械、医薬品、燃料が必要だが、これらは希少な外貨でしか購入できない。統制された外貨両替制度は国家にとって最も重要な産業に外貨資金を誘導する。"
 SIA_farmers_into_the_city: "農民の都市流入"
 SIA_farmers_into_the_city_desc: "近代経済は農村の労働力のみでは維持できない。産業が拡大するにつれ、国家は稲田から都市へと秩序ある移住を促進し、新たな都市の労働力を形成しなければならない。"
 SIA_textile_mills: "繊維工場"
 SIA_textile_mills_desc: "生地は生活必需品の一つだが、その大半が外国で製造されて逆輸入されている。繊維工場は輸入品の代替となり、都市の労働者を雇用して[ROOT.GetNameDef]に近代生活の基礎となる産業の一つをもたらす。"
 SIA_public_credit: "公的信用"
 SIA_public_credit_desc: "商人、栽培者、製造者はいずれも資本の調達方法が限られている。公的信用を拡大することにより、政府は民間金融が躊躇する分野にも融資を行い、見過ごされてきた分野の開発を推進することができる。"
 SIA_public_credit_trigger: "$idea_SIA_public_credit_debt$は少なくとも§Y180日間§!有効である"
 SIA_a_modern_economy: "近代経済"
 SIA_a_modern_economy_desc: "旧来の農業を基礎とした秩序はすぐになくなるものではないが、もはや[ROOT.GetNameDef]の未来を定義できるものではない。銀行、学校、工場、そしてインフラが形成されつつある今、我々は独立した近代国家にふさわしい経済の構築を始めているところだ。"
 SIA_reduction_of_agricultural_yield_taxes: "農業収穫税の引き下げ"
 SIA_reduction_of_agricultural_yield_taxes_tt: "$idea_SIA_agricultural_tax_reduction$による§Y消費財§!のマイナス補正を毎月§Y[?var:SIA_agricultural_tax_reduction_cg_decrease_rate|%]§!軽減し、§Y安定度§!を毎月§Y[?var:SIA_agricultural_tax_reduction_stability_gain|%]§!上昇させる。これは§Y消費財§!のマイナス補正が§Y0%§!になるまで続く\n\nこの国民精神が削除されると以下を獲得する:\n"
 SIA_reduction_of_agricultural_yield_taxes_desc: "王国を養い、国家財政を支え、あらゆる困難に救いの手もなく耐えるようなことを農民に求めてはいけない。農業生産に対する課税を軽減することで、農村により多くの余剰を残し、耕作者の忠誠を強化し、土地からの生産量増加を促進する。"
 SIA_fuel_oil_act: "燃料油法"
 SIA_fuel_oil_act_desc: "近代の輸送、産業、防衛はいずれも燃料に依存しているが、戦時はその供給が制限される可能性がある。燃料油法は消費、貯蔵、緊急時の配分をより強固に国家の監督下に置き、希少な供給が浪費されることを防ぐ。"
 SIA_siam_electricity_company: "シャム電力会社"
 SIA_siam_electricity_company_desc: "信頼できる電力がなければ、近代社会の負担に経済が耐えられない。シャム電力会社を強化することで、発電量の拡大、連携の改善に努め、困難な状況下でも工場、補給基地、都市への電力供給が途切れないようにする。"
 SIA_revise_the_taxation_system: "税制改正"
 SIA_revise_the_taxation_system_desc: "困難と自立に備える我が国にとって、現行の税制は十分に機能していない。改正された制度はより平等に徴収を行い、浪費を抑制し、国家防衛負担と開発負担をより厳格に配分する。"
 SIA_census_the_hill_tribes: "山岳民族の国勢調査"
 SIA_census_the_hill_tribes_desc: "山岳地帯はいまだに行政、課税、供給が十分に行き届いていない。適切な国勢調査は、これらの地域をより効果的に統治するのに必要な知識を政府に与え、現地の住民と資源をより広い国家の営みに引き入れることを可能とする。"
 SIA_increase_rice_exports: "米輸出の拡大"
 SIA_increase_rice_exports_desc: "米は[ROOT.GetNameDef]が利用できる最も確実な外貨収入源である。市場が開かれている間に輸出量を拡大すれば、準備金の積み立て、戦略的な輸入、将来起こり得る混乱に備えた財政基盤の整備に取り組むことができる。"
 SIA_pad_thai: "パッタイ"
 SIA_pad_thai_desc: "近代国家を支えるのは官庁や工場だけではない。国民同士を結びつける共通の習慣もこれに寄与している。シャムの食材に由来する国民的な米料理を奨励することで、国内消費を推進し、農民を支え、不確実な時代における外国食品への依存を減らすことができる。"
 SIA_rice_husk_steam_turbines: "籾殻蒸気タービン"
 SIA_rice_husk_steam_turbines_desc: "外国人の目には無駄に映るものも、必要性を基に工夫すれば価値のあるものに転換できる。籾殻を燃やして蒸気発生の燃料とすることで、自国の収穫から電力を得ることができ、石炭および石油輸入への依存度を下げることができる。"
 SIA_domestic_tin_smelters: "国内スズ精錬所"
 SIA_domestic_tin_smelters_desc: "土から鉱石を掘り出して輸出するだけではもはや十分ではない。国内に錫精錬所を建設することで、資源価値のより多くを国内に留め、商業にも戦争にも不可欠な工業用金属を確保することができる。"
 SIA_use_ships_as_generators: "船舶発電"
 SIA_use_ships_as_generators_tt: "自国が所有する§Y主力艦§!を§Y中核州の港§!に配置することで、§Y主力艦§!1隻毎に工場のエネルギー消費§G-2%§!のボーナスを獲得し、最大§G-15%§!まで累積される。\n\nこれらの艦船が港を離れると、その分のボーナスが減少し、帰港するとボーナスを再び獲得する。"
 SIA_use_ships_as_generators_desc: "戦闘や貿易に適さなくなった旧式の艦船であっても、国家に対して貢献できる可能性がある。艦船を浮体式発電所として係留することで、貴重な燃料とインフラを温存しつつ、港および沿岸の産業に緊急電力を供給することができる。"
 SIA_diversity_foreign_reserves: "外貨準備の多様化"
 SIA_diversity_foreign_reserves_desc: "[ROOT.GetNameDef]にとって準備金を単一の外国の通貨や信用に偏らせるのは危険である。準備金を多様化することにより、外的衝撃のリスクを低減し、貿易および外交における行動の自由度を大きく確保することができる。"
 SIA_diversity_foreign_reserves_tt: "開戦時、追加で§G2§!つのマップ外§Y軍需工場§!を追加する。\n開戦時、ランダムな中核州に鋼鉄の産出量を§G8§!追加する。"
 SIA_exclusivity_resource_contract: "資源独占契約"
 SIA_exclusivity_resource_contract_desc: "とある外国のパートナーが単独で、我々の資源に対する優先利用権と引き換えに、資本の提供と買い付け保証を提案してきた。このような排他的契約は急速な発展をもたらす可能性がある反面、[ROOT.GetNameDef]の将来を一部他国の需要に結びつけることになる。"
 SIA_maintain_resource_independence: "資源自立の維持"
 SIA_maintain_resource_independence_desc: "外国との契約は速やかに利益をもたらすかもしれないが、その背後には依存のリスクが伴う。我々の資源に関して我々自身が主導権を持ち続けることにより、外国の需要ではなくシャムの需要に応じて資源を分配する自由を確保することができる。"
 SIA_kasetsart_university: "カセサート大学"
 SIA_kasetsart_university_desc: "農業の生産性を上げるためには知識の伝承だけではなく、科学に基づく指導が必要だ。カセサート大学は土地の近代化に貢献する農学者、獣医、技術専門家を養成する。"
 SIA_mahidol_university: "マヒドン大学"
 SIA_mahidol_university_desc: "近代国家には兵士や技術者だけではなく、医師、研究者、行政官が必要だ。マヒドン大学は高等教育を強化し、国家改革に必要な専門人材を養成する。"
 SIA_silpakorn_university: "シラパコーン大学"
 SIA_silpakorn_university_desc: "TODO_CM"
 SIA_contingency_funds: "予備資金"
 SIA_contingency_funds_desc: "平時に繁栄していても、国家が無防備に危機に突入すればほとんど価値がない。今から予備資金を確保しておけば、封鎖、不作、突然の戦争が発生しても国家機構がすぐに停止することはない。"
 SIA_contingency_funds_tt: "平時に予備資金を積み立てる。積み立て中は§Y消費財補正§!に若干の増加がある。\n\n戦時にはこの資金を放出することができ、その際には大きな生産ボーナスを得る。\n資金の持続期間は放出前に積み立てた期間に依存する。"
 SIA_prepare_for_the_next_blockade: "次なる封鎖への備え"
 SIA_prepare_for_the_next_blockade_desc: "敵対勢力により海上が脅威にさらされると、[ROOT.GetNameDef]は市場、機械、燃料から切り離される可能性がある。したがって、我々は今から次の封鎖に備えなければならない。必要に迫られる前に備蓄、緊急計画、代替手段を準備しなければならない。"
 SIA_domestic_arms_industry: "国内軍需産業"
 SIA_domestic_arms_industry_desc: "すべての小銃と砲弾を輸入に頼っていては、安全な王国だと言い切れない。たとえ始まりは小規模でも、国内軍需産業を立ち上げれば、[ROOT.GetNameDef]の兵士は自国の装備で武装できるようになり、外国からの物資の供給が途絶えても持ちこたえることができるようになる。"
 SIA_war_material_substitutions: "軍需物資の代替品"
 SIA_war_material_substitutions_desc: "封鎖時には完全な素材よりも手に入る素材のほうが価値が高い。金属、化学製品、輸入部品の代替品を研究し、輸入素材が届かなくなっても生産を継続できるようにしなければならない。"
 SIA_royal_thai_ordnance_factory: "タイ王国兵器工場"
 SIA_royal_thai_ordnance_factory_desc: "国家の安全を保つには、輸入武器や散在する修理工場以上のものが必要だ。タイ王国兵器工場は技術、機械、監督を王権の下に集約し、[ROOT.GetNameDef]に兵器および弾薬製造の恒久的な拠点を提供する。"
 SIA_built_to_withstand_every_flame: "あらゆる炎に耐える造り"
 SIA_built_to_withstand_every_flame_desc: "工場が一夜で消失すれば、翌朝からは国家に奉仕することができない。我々の倉庫、工場、工房は破壊工作、爆撃、事故によって簡単に生産を止めないよう、分散、耐火、緊急保護を念頭に建設しなければならない。"
 SIA_the_army_of_siam: "シャム陸軍"
 SIA_the_army_of_siam_desc: "我が軍の旧来の体制はもはや時代の要請に応えるものではない。[ROOT.GetName]が主権を守り、外国に対して自らの利益を主張するためには、新しい近代的な軍を設立する必要がある。世界各地で始まろうとしている戦争に対応できるよう、装備を整え訓練を受けた、組織化された軍でなければならない。"
 SIA_plan_for_a_short_war: "短期戦の計画"
 SIA_plan_for_a_short_war_desc: "我々の資源は限られており、敵の数は我々を上回る可能性がある。[ROOT.GetNameDefCap]には長期の消耗戦を戦う余裕はない。戦争が起こるならば、迅速果断に、敵が戦力を集結させる時間を与えず決着をつけねばならない。"
 SIA_intermediate_war_preparation: "中期戦への準備"
 SIA_intermediate_war_preparation_desc: "電撃作戦だけを想定して準備するのは危険だが、終わりのこない持久戦のみに備える編制も無駄である。バランスのとれたドクトリンは、[ROOT.GetName]がより手強い敵に対峙した時に、辛抱強く耐えながら力強い打撃を加えることを可能とする。"
 SIA_prepare_for_a_long_war: "長期戦への準備"
 SIA_prepare_for_a_long_war_desc: "列強は数か月で戦争を決着させるかもしれないが、それより小さな国はしばしば数年にわたって戦争に耐えなければならない。したがって、勇気とともに忍耐と持久力が必要となる長期の消耗戦に備えるため、[ROOT.GetAdjective]の軍備、産業、輸送を整えなければならない。"
 SIA_specialized_warfare: "特殊戦"
 SIA_specialized_warfare_desc: "我々の地域の地形は均一な軍には適していない。山岳、密林、河川地帯はそれぞれ異なる技能を要求する。特化部隊を育成することで、[ROOT.GetNameDef]はあらゆる戦場において適切な戦力で敵に対抗できるようになる。"
 SIA_artillery_reigns_supreme: "砲兵至上"
 SIA_artillery_reigns_supreme_desc: "現代戦は精神力だけで勝てるものではない。銃砲はいまだに戦場の王者であり、拠点を破壊し、突撃を粉砕し、歩兵の進路を切り開く。勝利のためには、[ROOT.GetAdjective]の火力を豊富かつ精密なものにしなければならない。"
 SIA_yield_the_air_war: "航空戦の放棄"
 SIA_yield_the_air_war_desc: "上空において列強と同じ条件で挑もうと思ってはならない。勝ち目の薄い争いに貴重な資源を浪費するよりも、我々は対空防衛を強化すべきである。敵の航空機が傷一つ負わず我が軍や都市を攻撃することを許してはならない。"
 SIA_the_thunder_at_the_gates: "門前に轟く雷鳴"
 SIA_the_thunder_at_the_gates_desc: "通常の銃砲では破れない要塞もあれば、圧倒的な火力で敵に知らしめる攻撃もある。重砲、攻城砲、列車砲は、いかなる敵の門戸も破壊可能な力を[ROOT.GetNameDef]に与える。我々の自制が弱さではないことを思い知らせてやろう。"
 SIA_night_time_training: "夜間訓練"
 SIA_night_time_training_desc: "白日の下で大胆な突撃を敢行しても、待ち受ける敵を前に惨事を招くことになる。暗闇に紛れての潜入、移動、攻撃を訓練した兵士ならば、夜目が利かず混乱した敵を相手に主導権を握ることができる。"
 SIA_steel_arteries: "鋼鉄の動脈"
 SIA_steel_arteries_desc: "陸軍は鉄道と道路を使わずに長距離を行軍することはできない。脅威にさらされたすべての国境へ部隊、物資、兵器を速やかに運ぶため、国家の鋼鉄の動脈を強化しなければならない。この取り組みにおいては、軍事安全保障と国家の発展は一体となって進む。"
 SIA_prepare_northern_infrastructure_for_war: "北部インフラの戦時整備"
 SIA_prepare_northern_infrastructure_for_war_desc: "ビルマおよびその背後にいる勢力と対立する上で、北部の進路は極めて重要になる。この地域の道路、鉄道、補給基地を直ちに拡張し、[ROOT.GetAdjective]軍が遅滞なく進軍および防衛できるようにしなければならない。"
 SIA_unconventional_tank_construction: "非正統派戦車建造"
 SIA_unconventional_tank_construction_desc: "列強の装甲車両計画をそのまま模倣することはできない。[ROOT.GetNameDef]が戦車を配備するならば、低コストで適応性の高い建造方法を追求し、見栄えを犠牲にして数と実用性を優先しなければならない。"
 SIA_conventional_tank_construction: "正統派戦車建造"
 SIA_conventional_tank_construction_desc: "装甲車両は現代戦で広く取り入れられている兵科であり、その場しのぎの対応では限界がある。したがって、確かな原理、標準化された設計、現代軍にふさわしい信頼できる生産方式に基づく正式な戦車産業を確立すべきである。"
 SIA_reverse_engineer_allied_tanks: "連合国戦車のリバースエンジニアリング"
 SIA_reverse_engineer_allied_tanks_desc: "実験の費用はすでに他国が負担してくれている。鹵獲した戦車や輸入した機械を分解し、それを研究することで、模倣することが可能だ。外国の設計から学ぶことにより、[ROOT.GetName]は装甲部隊の内製化に向けた道のりを短縮できるかもしれない。"
 SIA_tankettes: "豆戦車"
 SIA_tankettes_desc: "軽量、安価で生産が容易な豆戦車は、それ自体が大きな戦いの勝敗を左右することはないが、偵察、植民地戦、歩兵支援では依然として有用だ。資金力の限られた国家にとって、このような小型の装甲車両は機甲戦への現実的な入り口になる。"
 SIA_jungle_armor: "密林装甲"
 SIA_jungle_armor_desc: "ヨーロッパの平原向けに設計された鈍重な兵器は、我々の地域の密林には適さない。[ROOT.GetNameDef]に装甲車両を導入するならば、狭い小道、軟弱な地盤、過酷な気候に適応したものでなければならず、密林では重量を犠牲にして機動性を優先すべきである。"
 SIA_mountain_tanks: "山岳戦車"
 SIA_mountain_tanks_desc: "険しい丘陵や山岳路を歩兵だけに任せることはできない。起伏のある地形に適した小型の装甲車両を開発することにより、我が軍は通常の戦車が使えない地域に機甲戦力を投入できるようになる。"
 SIA_reluctant_submission: "不本意な服従"
 SIA_reluctant_submission_desc: "[ROOT.GetNameDef]がより強大な敵の侵攻に直面した場合、正面から抵抗しても破滅しかもたらさない瞬間が訪れるかもしれない。屈服することは苦々しいことだが、国家の滅亡を避け、好機の到来を待つため、政府は時には降伏しなければならない。"
 SIA_reluctant_submission_trigger: "我々が攻撃を受け、イベントで§Y降伏§!を選択した場合、この国家方針は自動的に完了する。"
 SIA_reluctant_submission_tt: "我々は攻撃してきた主要国と和平を結ぶことができるようになる。しかし、彼らは我々に紙幣の印刷を期待する。\n我が国の§Y消費財工場補正§!は毎月§Y[?idea_SIA_printing_money_monthly_change|%]§!、最大§Y[?idea_SIA_printing_money_monthly_change_max|%]§!まで上昇する。\n\n国家方針「§Y$SIA_thai_rice_company$§!」を実行すると、増加率が§G50%§!減少する。\n\n国家方針「§Y$SIA_demand_repatriation$§!」を実行すると、紙幣印刷の必要性がなくなる。"
 SIA_seri_thai: "セリタイ"
 SIA_seri_thai_desc: "降伏は必ずしも国民精神の放棄を意味するものではない。表面的には占領されて服従していても、忠実な地下組織を構築し、独立の大義を持ち続け、情報を収集し、[ROOT.GetName]が再び立ち上がる日に備えることができる。"
 SIA_contact_the_south_east_asia_command: "東南アジア司令部との接触"
 SIA_contact_the_south_east_asia_command_desc: "抵抗を単なる勇敢な行動で終わらせないためには、より広範な戦略との結びつきが必要になる。東南アジアにおける連合国の司令部と接触することにより、[ROOT.GetName]の愛国者たちは指導、物資、さらには大きな闘争における一員としての地位を確保することができる。"
 SIA_broadcast_weather_reports_to_the_allies: "連合国への気象報告"
 SIA_broadcast_weather_reports_to_the_allies_desc: "この地域の空と海は、艦隊や軍隊の影響を受けるだけでなく、天候によっても左右される。[ROOT.GetNameDef]からの信頼できる報告は、連合国の計画策定に役立ち、作戦行動を奇襲から守り、我が国に静かながらも価値のある戦争の協力者という地位を与える。"
 SIA_american_investment_aid: "米国投資援助"
 SIA_american_investment_aid_desc: "アメリカ合衆国は我々の地域では到底手の届かないほどの富を有している。もし我々の秘密裏の活動および国家的な取り組みに対し、アメリカの支援と投資を確保することができれば、[ROOT.GetNameDef]は困難に耐え、解放に備えるための物質的手段を手にすることができる。"
 SIA_thai_students_in_the_oss: "OSSのタイ人訓練生"
 SIA_thai_students_in_the_oss_desc: "愛国心のある次世代の青年たちに外国で訓練を受けさせ、諜報、破壊工作、非正規戦の技術を学ばせることができる。信頼できるタイの学生を連行国の情報機関の影響圏に送り込むことで、来たるべき見えない戦争に備えて有能な人材を育成することが可能だ。"
 SIA_prepare_to_drop: "降下準備"
 SIA_prepare_to_drop_desc: "解放の時、連合国は空から我々の国土に降下しようとするかもしれない。したがって、我々は空挺部隊を受け入れ、最も彼らを必要とする地点に誘導できるよう、降下地点を特定し、連絡要員を配置し、支援網を構築しなければならない。"
 SIA_unseat_the_government: "政府打倒"
 SIA_unseat_the_government_desc: "[ROOT.GetNameDef]を外国の支配に縛り付けている政権が永遠に存続することを許すわけにはいかない。抵抗活動、謀略、時宜を得た行動により、この国を差し出した者たちを排除し、シャムによりふさわしい政府を復活させることができる。"
 SIA_unseat_the_government_tt: "[ROOT.GetName]は現在の陣営を離脱し、戦争で陣営を変えて§Y連合国§!に加わる。\n\n忠誠派はこの変化に反発して蜂起し、内戦を引き起こす。\n\n我々の合計支持率が§Y80%超§!の場合、政権を追放し、内戦を回避できる。総支持率は民主主義への支持に加え、取り込んだ将軍1人につき§Y5%§!増加する。\n\n取り込んだ将軍による支持率: §Y[?var:SIA_seri_thai_cw_scale|%]§!、民主主義への支持率: §Y[?var:party_popularity@democratic|%]§!"
 SIA_choose_new_leader_tt: "旧政権が打倒された今、勝者は新政府の指導者を選択しなければならない。"
 SIA_the_phayap_army: "パヤップ軍"
 SIA_the_phayap_army_desc: "侵略者と運命をともにするのであれば、新しい戦争秩序の中で、我が軍も役割を与えられなければならない。西方および北方への遠征に特化した前線司令部を編成することにより、[ROOT.GetName]は強力なパートナーと並んで進軍し、独自の利益を追求できるようになる。"
 SIA_securing_the_rubber_islands: "ゴム諸島の確保"
 SIA_securing_the_rubber_islands_desc: "ゴムは現代戦の生命線であり、タイヤやシール部品、そして機甲戦における無数の装備に使用されている。南方にある資源が豊富な地域は、我々にとって奇貨であると同時に必要不可欠な場所である。他国に先んじて行動し、これを確保すべきだ。"
 SIA_breaking_the_burmese_line: "ビルマ戦線の突破"
 SIA_breaking_the_burmese_line_desc: "ビルマは我々の野心とその先の土地の間に立ちはだかる障壁である。[ROOT.GetAdjective]の武力がその価値を証明するためには、決意と計画、そして戦力の集中運用により、この地の敵戦線を突破しなければならない。"
 SIA_pacific_war: "太平洋戦争"
 SIA_pacific_war_desc: "東アジアにおける紛争はもはや対岸の火事ではない。太平洋における戦争は我らが地域にあるすべての国家の運命を形作るものであり、[ROOT.GetNameDef]はこの闘争において、追従者、協力者、犠牲者のいずれになるかを決めなければならない。"
 SIA_joint_asian_military_command: "アジア合同軍事司令部"
 SIA_joint_asian_military_command_desc: "我々の努力は地域の協力国との調整によってさらに強化される。合同司令体制は効率性の向上および計画立案の明確化を実現し、対立や混乱によって無駄に終わるおそれのある作戦に対して共通の方向性を指し示す。"
 SIA_demand_repatriation: "送還要求"
 SIA_demand_repatriation_desc: "必要性という名目で我々の領土に入り込んだ者たちは[ROOT.GetNameDef]に債務を負っている。我々の状況が好転したならば、奪われたものの返還を要求し、占領者に対して侵入の代償を払わせるべきである。"
 SIA_standing_our_ground: "陣地死守"
 SIA_standing_our_ground_desc: "撤退と交渉がさらなる屈辱しかもたらさないという局面は存在する。[ROOT.GetNameDefCap]は、銃口によって我々の運命を左右できると考える者たちを前に立ち上がり、戦い、撃退する意思を今も持ち合わせているのだと示さなければならない。"
 SIA_standing_our_ground_trigger: "我々が攻撃を受け、イベントで§Y抵抗§!を選択した場合、この国家方針は自動的に完了する。"
 SIA_ask_for_the_release_of_american_commodities: "アメリカ物資の放出要請"
 SIA_ask_for_the_release_of_american_commodities_desc: "アメリカの備蓄、機械、商品は、我が国が必要とする余裕をもたらしてくれるかもしれない。慎重な外交を通じ、我々はこのような物資の放出を要請し、物資不足を緩和するとともに、戦争努力の物質的基盤を強化することができる。"
 SIA_japanese_fighters: "日本製戦闘機"
 SIA_japanese_fighters_desc: "我々自身の航空産業は零細なままだが、外国製の航空機を活用すればその空白を埋めることができる。日本製の戦闘機を[ROOT.GetAdjective]が手にすれば、たとえ我が国の産業的脆弱性によって制限されるとしても、少なくともある程度の近代的航空戦力を得ることができる。"
 SIA_get_off_our_shores: "我々の海岸から出ていけ"
 SIA_get_off_our_shores_desc: "シャムの土地に外国の軍隊が存在することは、いかなる弁解をもってしても和らげることのできない侮辱である。武力によってであれ、国外情勢からの圧力によってであれ、我々は侵略者が我々の海岸から去り、[ROOT.GetNameDef]の尊厳が回復されることを断固として要求しなければならない。\n\nやつらはすべての残虐な者たちと同様、臆病者である。さあ、我々の海岸から出ていけ。"
 SIA_singaporean_reinforcements: "シンガポールからの援軍"
 SIA_singaporean_reinforcements_desc: "マラヤおよびその先における闘争は、我々自身の安全保障と切り離せるものではない。シンガポール周辺に集結している軍からの増援は、我々の戦線を強化し、連合国との連携を拡大し、この戦域を共通の目的の下に結びつけることができる。"
 modify_SIA_directorate_of_aeronautical_engineering: "§Y航空工学局§!に以下の補正:"
 SIA_aid_for_resources: "資源と引き換えの援助"
 SIA_aid_for_resources_desc: "我が国は外国の列強が切望する資源を有しているが、彼らが提供可能ないくつかの手段を欠いている。支援と資源の賢明な交換により、[ROOT.GetNameDef]への補給を維持し、我々の富を国家存続のために役立てることができる。"
 SIA_aid_for_resources_tt: "我々は[JAP.GetNameDef]に対し、我々の戦争への参加を要請し、見返りとして§Y[724.GetName]§!におけるゴム資源の権利を与える。"
 SIA_how_quickly_the_tables_turn: "急転する形勢"
 SIA_how_quickly_the_tables_turn_desc: "かつて[ROOT.GetNameDef]を従順な弱者として扱った者たちは、やがてこのバランスが逆転したことを認識するかもしれない。戦況の変化は目まぐるしく、我々の抑圧者がつまづき、ついには形勢が逆転する瞬間を捉える準備をしておかなければならない。"
 SIA_how_quickly_the_tables_turn_trigger: "主要国から攻撃を受け、その主要国が降伏した。"
 SIA_royal_thai_navy: "タイ王国海軍"
 SIA_royal_thai_navy_desc: "[ROOT.GetNameDef]の防衛は海岸線だけで終わらない。沿岸部、河川、海上貿易は王国にふさわしい艦隊を必要としている。タイ王国海軍を強化することにより、シャムが自らの海域の支配者であり続けることを保証する。"
 modify_royal_thai_navy: "§Y$idea_SIA_thai_royal_navy$§!を以下の通り補正:"
 SIA_direct_army_fundings_towards_the_navy: "陸軍予算を海軍へ振り向ける"
 SIA_direct_army_fundings_towards_the_navy_desc: "陸軍は軍事費の大部分を占めてきたが、[ROOT.GetNameDef]の戦略的ニーズは純粋に大陸的なものではない。資金を艦隊に振り向けることで、不均衡の是正を開始し、我々の商業と沿岸を守る海域を確保できるようになる。"
 SIA_thonburi_class_coastal_defense_ship: "トンブリ級海防戦艦"
 SIA_thonburi_class_coastal_defense_ship_desc: "地域の条件に合わせて適切に設計された艦隊であれば、規模は小さくてもなお、十分な戦闘力を発揮できるかもしれない。トンブリ級は[ROOT.GetNameDef]に相当な火力と、最も緊急に防衛すべき海域に適した役割を兼ね備えた、実用的な沿岸防衛手段を提供する。"
 SIA_acquire_submarines: "潜水艦の調達"
 SIA_acquire_submarines_desc: "潜水艦は小規模な海軍に、その規模を超えた打撃を与える機会をもたらす。海面下に身を隠すことで、海上輸送に脅威を与え、より強力な艦隊を抑止し、我々の沿岸に対するあらゆる敵対的計画を困難なものにすることができる。[ROOT.GetNameDefCap]はこのような兵器を軽視すべきではない。"
 SIA_submarine_day: "潜水艦の日"
 SIA_submarine_day_desc: "我が艦隊への水中戦の導入は、国民の認知と国家の熱狂を受けるに値するものだ。潜水艦部隊を称揚することにより、新兵の募集を促し、威信を高め、シャムが新たな海軍時代に突入していることを国民の意識に定着させることができる。"
 SIA_the_thonburi_dockyard_project: "トンブリ造船所計画"
 SIA_the_thonburi_dockyard_project_desc: "輸入した船体だけで海軍を維持するのは不可能だ。[ROOT.GetNameDef]が海上戦力を維持・拡大するためには、海上戦力の真の基盤を形成する造船所、工房、労働力に投資しなければならない。"
 SIA_expand_the_slipways: "船台の拡張"
 SIA_expand_the_slipways_desc: "今まさに形作られようとしている野心に対して、現在の施設は極めて窮屈である。船台を拡張することにより、艦船の建造および修理能力を向上させ、艦隊を規模と即応性の面から強化することができる。"
 SIA_a_new_drydock: "新たな乾ドック"
 SIA_a_new_drydock_desc: "本格的な海軍の維持には近代的な乾ドックが必要だ。これがなければ大型艦船の整備には依然として時間がかかり、効率は悪く、外国の支援にこれからも依存せざるを得ない。新たな乾ドックによって、[ROOT.GetNameDef]は自らの海軍の未来をしっかりと掌握できるようになる。"
 SIA_install_heavy_cranes_and_power_plant: "大型クレーンと発電所の設置"
 SIA_install_heavy_cranes_and_power_plant_desc: "造船は木材や鋼鉄だけの問題ではなく、機械と電力の問題でもある。大型クレーンと安定した電力供給は我々の造船所を粗末な施設から近代産業にふさわしい生産拠点に変えるだろう。"
 SIA_establish_the_foundry_and_machine_shop: "鋳造所と機械工場の設立"
 SIA_establish_the_foundry_and_machine_shop_desc: "輸入部品を組み立てた船体だけでは自立した海軍を樹立することはできない。独自の鋳造所と機械工場を設立することで、産業基盤が強化され、[ROOT.GetNameDef]が国内で軍艦の主要な部品を鋳造、成形、修理できるようになる。"
 SIA_the_thonburi_arsenal: "トンブリ造兵廠"
 SIA_the_thonburi_arsenal_desc: "兵器を伴わない造船所は不完全なままだ。トンブリに造兵廠を設立すれば、海軍砲、弾薬、関連装備の製造と備蓄が可能となり、我々の艦隊を国家産業とより密接に結びつけることができる。"
 SIA_focus_on_commercial_civilian_ships: "民間商船への注力"
 SIA_focus_on_commercial_civilian_ships_desc: "すべての船体が戦闘用である必要はない。商船、輸送船、その他の民間船舶は国家経済を循環させるものである。商業造船を促進することにより、[ROOT.GetNameDef]はより繁栄し、戦時の強靭性も向上する。"
 SIA_empower_the_coastguard: "沿岸警備隊の強化"
 SIA_empower_the_coastguard_desc: "艦隊は同時にあらゆる場所に存在することはできず、沿岸警備任務の多くは、より身軽な部隊に任せる方が適切である。強化された沿岸警備隊は我が国の漁業を保護し、海岸を警備し、海軍の負担を減らしてより重大な脅威に対応させることができる。"
 SIA_river_patrols: "河川哨戒"
 SIA_river_patrols_desc: "[ROOT.GetNameDef]にとって河川は道路であり、国境であり、同時に生命線でもある。これらの水域における哨戒艇は、我々が秩序を守り、地元の駐屯部隊を支援し、遠く離れた首都では対応が遅れがちな地域に国家の手を行き届かせるための助けとなる。"
 SIA_sell_bangkok_dock_co: "バンコク・ドック社の売却"
 SIA_sell_bangkok_dock_co_desc: "国営企業ではあまりにも時間がかかることを、民間資本なら達成できることがある。バンコク・ドック社を有能な実業家に売却することにより、投資を呼び込み、効率向上を促進し、公共資金をより差し迫った軍事ニーズに振り向けることができる。"
 SIA_a_race_against_time: "時間との闘い"
 SIA_a_race_against_time_desc: "我が国の海軍は時代遅れで、予算は不足し、現代戦への準備ができていない。直ちに造船、改修、沿岸防衛、海上訓練に資金を振り向けなければならない。時計の針は我が国の造船所より速く動いている。"
 SIA_a_race_against_time_tt: "この精神が失効すると、以下を獲得: "
 SIA_a_race_against_time_tt2: "§Y280§!日間"
