 AST_australian_military_forces: "オーストラリア軍"
 AST_australian_military_forces_desc: "先の大戦の戦火で鍛えられたオーストラリア軍は、遠い異国の地でその気概を証明し、紛争における最も残酷な作戦のうちのいくつかでしっかりと耐え抜いた。その後の数年で軍は規模を縮小され、防衛軍として再編された。その任務は主に本土の防衛任務である。過去に苦労して身につけた教訓は、再び必要とされる時にいつでも使える状態である。"
 AST_permanant_military_forces: "常備軍"
 AST_permanant_military_forces_desc: "オーストラリアの主要な軍事力は本土の防衛を任務とする民兵である。しかし、世界的な緊張が高まるこの時代においては、先の大戦で経験を積んだ者を中心とした将校や兵士からなる専門家集団を形成することが賢明だ。たとえ最初は予備的な役割での任務に就くとしても、この部隊は恒常性と標準化された訓練水準をもたらすだろう。"
 AST_invoke_the_1903_defence_act: "1903年国防法の発動"
 AST_invoke_the_1903_defence_act_desc: "オーストラリアは伝統的に国防を民兵に依存してきた。しかし、重大な脅威に直面した際には、1903年国防法を発動することができる。これにより、防衛目的で追加の人的資源の確保が可能となる。"
 AST_lithgow_small_arms_factory: "リスゴー小火器工廠"
 AST_lithgow_small_arms_factory_desc: "1912に設立されたリスゴー小火器工廠は、戦時におけるイギリス製の兵器および装備への依存を減らすために創設された。再び世界的な緊張が高まるなか、我が軍の増大する需要に応えるため、生産量を増やすべきである。"
 AST_dingo_scout_car: "ディンゴ偵察車"
 AST_dingo_scout_car_desc: "オーストラリアには装甲車両開発に関する強固な伝統は存在しない。しかし、この領域の強化を求める軍隊からの要請は増えている。したがって、ディンゴ偵察車のような国産設計をより積極的に採用すべきである。"
 AST_volunteer_defence_corps_taog: "義勇防衛隊"
 AST_volunteer_defence_corps_taog_desc: "イギリスのホーム・ガードに類似した部隊として設立された義勇防衛隊は、正規軍に入る資格を持たない者たちで構成される無給の市民民兵である。こうした制約はあるものの、彼らは現地の地形に詳しく、最悪の事態が発生した場合、ゲリラ戦において活躍することができる。"
 AST_war_carriers: "戦時輸送隊"
 AST_war_carriers_desc: "兵站は戦争に勝敗を左右する。オーストラリアが作戦行動を行う地形の多くは、トラックや列車のような通常の輸送手段に適していない。代わりに、地元の人的資源に頼るべきである。彼らは環境への適応に優れ、隠された道や近道にも精通している。"
 AST_anzac_spirit: "ANZAC精神"
 AST_anzac_spirit_desc: "オーストラリア・ニュージーランド軍団は先の大戦ですさまじい名声を獲得し、帝国の勝利のために多大な努力と血を費やした。彼らの資質は誰の目にも明らかであった。忍耐、勇気、創意工夫、陽気さに加え、危険と苦難に直面した際の気張らない反骨心を兼ね備えていたのだ。"
 AST_lee_enfield_no1_mark3: "リー・エンフィールドNo.1 Mk III*"
 AST_lee_enfield_no1_mark3_desc: "あの小さな星印には意味がある。リー・エンフィールドNo.1 Mk III*という表記は、より迅速でより低コストな生産を実現するべく、戦時改修が行われたことを示しているのだ。しかし、生産効率を向上したものの需要はこれを上回っており、そのため我々は「ペドル・スキーム」を採用しなければならない。これは生産量を上げるため、複数の小さな会社が分業で部品を生産し、リスゴーで組み立てるという方式のことである。"
 AST_new_south_wales_government_railways: "ニューサウスウェールズ州政府鉄道"
 AST_new_south_wales_government_railways_desc: "ニューサウスウェールズ州政府鉄道の工房は、大型鋼鉄部品の一体鋳造という独自の能力を有している。完全鋳造式の戦車車体や砲塔を生産できる数少ない連邦の一国として、我々はこの能力を有効活用すべきである。"
 AST_second_australian_imperial_force: "第2オーストラリア帝国軍"
 AST_second_australian_imperial_force_desc: "先の大戦中、オーストラリアは国外での戦闘に派遣するため、第1オーストラリア帝国軍を配備した。戦争が再び世界を飲み込もうとしているなか、我々はオーストラリアの力を国外で示すため、第2オーストラリア帝国軍を立ち上げるべきである。"
 AST_expeditionary_leader: "この§Y将軍§!は§Y遠征軍指導者§!の指揮官特性を持ち、海外において能力が向上するが、指揮できる師団数が制限される。"
 AST_expeditionary_leader_plural: "いずれの§Y将軍§!も§Y遠征軍指導者§!の指揮官特性を持ち、海外において能力が向上するが、指揮できる師団数が制限される。"
 AST_larrikinism: "ラリキニズム"
 AST_larrikinism_desc: "「粗野で騒々しいが、根は優しい」と定義されるラリキニズムは、今やオーストラリア文化を象徴するようになった。それはすなわち、頑強な忍耐力、権威に対する不遜さ、危険に直面した際の陽気な反骨心である。オーストラリア兵は先の大戦で粘り強く苦難に立ち向かい、それを平然と受け流すことで名声を得た。"
 AST_diggers: "ディガーズ"
 AST_diggers_desc: "「掘れ、掘れ、掘れ、安全になるまで掘れ」——これはオーストラリア・ニュージーランド軍団がガリポリに上陸した際、ウィリアム・バードウッド将軍が受けた命令であり、戦争におけるオーストラリア流の戦い方と同義になった。しかし、ディガーの精神はさらに深くオーストラリア兵とニュージーランド兵を「メイトシップ（仲間意識）」で結び付けている。これはすなわち、同志とともに、同志のために戦うという永続的な絆を意味している。"
 AST_owen_gun: "オーウェン銃"
 AST_owen_gun_desc: "革新的な国産兵器であるオーウェン銃は、我が国の兵士と同様、頑強な信頼性によって名声を得ている。我が軍が世界中で戦う際、この兵器を単にオーストラリアの創意工夫と設計の象徴としてだけではなく、戦争における我々の精神そのものとして受け入れるべきである。"
 AST_department_of_supply_and_development_taog: "供給開発省"
 AST_department_of_supply_and_development_taog_desc: "戦争の要求は我々の生産および兵站システムを限界に押しやっている。それらの調整・維持を担う専任機関の下に我々の取り組みを集約しなければならない。"
 AST_sentinel_tank_development: "センチネル戦車の開発"
 AST_sentinel_tank_development_desc: "我々はこれまで、戦車生産を国内で行う場合でも、輸入した設計図に頼ってきた。これらの戦車から得られた教訓にオーストラリア式の創意工夫を加え、我々の能力と資源に最適化された独自の戦車を開発すべきである。"
 AST_establish_training_camps: "訓練キャンプの設置"
 AST_establish_training_camps_desc: "先の大戦と同様に、第2帝国軍は世界のあらゆるところで戦うことを求められる可能性がある。したがって、北アフリカの砂漠から南太平洋の密林まで、兵士があらゆる環境に対応できるようにするべく、包括的な訓練計画を策定しなければならない。"
 AST_jungle_tanks_if_sentinel_tank_development: "「センチネル戦車の開発」を完了している場合:"
 jungle_heavy_tanks: "密林重戦車"
 AST_anti_malaria_campaign: "マラリア対策運動"
 AST_anti_malaria_campaign_desc: "我が軍は太平洋の密林での戦闘を命じられる可能性がある。そこで待ち構える、敵の弾丸よりも致命的な脅威はマラリアである。この目に見えない敵から部隊を守るため、断固とした行動を取らなければならない。"
 AST_defence_citizen_military_forces_act: "国防市民軍法"
 AST_defence_citizen_military_forces_act_desc: "これまで、国外に派遣できるのは志願制の職業軍人のみだった。紛争が激化するにつれ、必要に応じて民兵部隊を国外での任務に就かせることができるよう、法的枠組みを確立しなければならない。"
 AST_call_that_a_knife: "気にするな！"
 AST_call_that_a_knife_desc: "「あれはナイフじゃない……これがナイフだ！」——少しの虚勢とユーモアが効果を発揮する。我が国の兵士たちは自信と根性とあふれる気概をもって危険に立ち向かう。"
 AST_army_inventions_directorate_taog: "陸軍発明局"
 AST_army_inventions_directorate_taog_desc: "数少ないながらも戦争に利点があるとすれば、必要性に迫られて急速に技術革新が進むことはその一つである。これらの画期的な成果を発展、洗練、活用するための中央集権的な組織を設立すべきである。"
 AST_yeramba: "イェランバ"
 AST_yeramba_desc: "センチネルのようなオーストラリアが開発した車両の成功を踏まえ、次の段階としてイェランバを導入した。これは我々の兵廠に加わる強力な新兵器である。戦車の車台に25ポンド砲を据え付けたもので、機動性に優れており、敵に対して圧倒的な火力を発揮する。"
 AST_alice_springs: "アリススプリングス"
 AST_alice_springs_desc: "アウトバックは実に広大だ。その中心にアリススプリングスという小さな町がある。ここはオーストラリア全域にわたる作戦の際、中央兵站拠点として利用することができる。我々はここを開発し、あらゆる環境に対応可能な兵士を訓練するための陸軍基地を設置すべきである。"
 AST_australian_regular_army: "オーストラリア正規軍"
 AST_australian_regular_army_desc: "我々はガリポリの浜辺から北アフリカの砂漠、ギリシャの山岳、東南アジアの密林にいたるまで、様々な場所から多くの教訓を学んできた。この得難い経験は、他のいかなる軍隊よりも柔軟で順応性の高い軍隊を鍛え上げた。"
 AST_no1_flying_training_school: "第1飛行訓練学校"
 AST_no1_flying_training_school_desc: "1921年のオーストラリア空軍の創設とともに設立された飛行訓練学校は、航空要員の受容の変動に応じて開設と閉鎖を繰り返してきた。世界的な緊張が高まるなか、次世代のパイロットおよび乗組員を訓練するため、これを再開すべきである。"
 AST_empire_air_training_scheme_taog: "大英帝国航空訓練計画"
 AST_empire_air_training_scheme_taog_desc: "イギリス連邦航空訓練計画は連邦の一国に対して多額の資金と専門知識を提供し、大量のパイロットと乗組員を訓練するものである。その誘致競争は激しく、オーストラリアとカナダが有力候補となっており、我々は大英帝国航空訓練計画という名称で独自の提案書を提出した。"
 AST_volunteer_air_corps: "航空監視義勇隊"
 AST_volunteer_air_corps_desc: "オーストラリアの領空は広大で、正式部隊だけでは到底カバーしきれない。代わりに地元の志願兵を頼りにすべきである。全国に点在する数千もの監視所に人員を配置し、我が国の空を監視させるのだ。"
 AST_improved_ground_crews: "地上要員の強化"
 AST_improved_ground_crews_desc: "パイロット1人につき1チームの地上要員が必要である。航空機の整備、飛行調整、基地運用を適切に実施する彼らがいてこそ、パイロットは空を飛ぶことができるのだ。さらに、上空に同伴する航法士、砲手、爆撃手の必要性は言うまでもない。空軍が最大限の効率で運用できるよう、適切な訓練施設を設立しなければならない。"
 AST_advanced_pilot_training: "上級操縦訓練"
 AST_advanced_pilot_training_desc: "航空機はより複雑、高速、先進的なものになり、それらの技術を最大限に利用するため、パイロットの技能も合わせて向上させなければならない。"
 AST_advanced_pilot_training_tt: "§Y空軍ドクトリン§!の習熟度獲得速度§G+10%§!。"
 AST_commonwealth_aircraft_corporation_taog: "コモンウェルス航空機会社"
 AST_commonwealth_aircraft_corporation_taog_desc: "制空権をめぐる戦いへの関心が高まっており、後れを取ることは許されない。民間の愛好家や革新者たちはすでに航空産業の可能性に気付きはじめている。彼らに初期投資をすれば、この新興分野の成長を促し、拡大することができる。"
 AST_reestablish_central_flying_school: "中央飛行学校の再設立"
 AST_reestablish_central_flying_school_desc: "オーストラリアのもう一つの飛行学校であり、第1飛行訓練学校と並行して運営される中央飛行学校は、近代空軍の高まる需要に応える助けとなるだろう。緊張が高まるにつれ、我々は人員が必要とする施設を確実に準備しなければならない。"
 AST_aerodrome_of_democracy_democracy: "民主主義の飛行場"
 AST_aerodrome_of_democracy_fascism: "支配の飛行場"
 AST_aerodrome_of_democracy_communism: "解放の飛行場"
 AST_aerodrome_of_democracy_neutrality: "強さの飛行場"
 AST_aerodrome_of_democracy: "[GET_AERODOME_NAME]"
 AST_aerodrome_of_democracy_desc: "航空能力の最前線に達したオーストラリア空軍は、「[GET_AERODOME_NAME]」と呼ばれるようになった。我が国の飛行士は世界中で空中戦を展開し、我が国の爆撃機は敵の産業に死の影を落としている。"
 AST_government_aircraft_factories: "政府航空機工場"
 AST_government_aircraft_factories_desc: "我が国はヨーロッパから距離があるため、戦時に従来の航空機供給源を頼ることができない。したがって、国内製造能力を確保し、独自の仕様に基づいて機体やエンジンを製造できるようにしておくことが不可欠である。"
 AST_death_from_down_under_taog: "南半球から忍び寄る死"
 AST_death_from_down_under_taog_desc: "南半球の遥かかなたで、我が国は比肩するもののない空軍を築き上げた。我が国の航空機は世界各地に展開し、精密かつ破壊的な攻撃を仕掛ける。敵がどこに隠れようとも、死は南半球から訪れる。"
 AST_ride_the_lightning: "稲妻に乗る"
 AST_ride_the_lightning_desc: "我が国の航空機パイロットは航空戦力の先鋒であり、迅速かつ果敢で容赦がない。稲妻に乗って戦場に突入し、制空権を掌握し、敵機を迎撃し、我が軍がどこへ行こうとも、航空優勢がこれに続くようにする。"
 AST_the_gathering_storm: "迫り来る嵐"
 AST_the_gathering_storm_desc: "地平線上で嵐が渦巻いている。我が国の空軍力の強化により上空からの圧力を強まり、敵陣の最も弱い箇所を叩き、地上の進軍を支援することが可能となった。遠くに聞こえていた雷鳴は、やがて容赦ない破壊の嵐へと姿を変えるだろう。"
 AST_hear_the_thunder: "雷鳴を聞く"
 AST_hear_the_thunder_desc: "雷鳴が聞こえるか？南半球より、我が国の戦略爆撃機が世界中にオーストラリアの力を運ぶ。空がとどろき大地が震える時、敵は知ることになる。嵐が到来し、それが破壊をもたらすことを。"
 AST_department_of_aircraft_production: "航空機生産局"
 AST_department_of_aircraft_production_desc: "オーストラリア空軍の急速な拡大は、我が国の生産能力に大きな負担をかけている。我々はもっと野心的に考え、需要を満たせるように産業基盤を拡張・調整し、我が国の航空機が空を暗く覆えるようにしなければならない。"
 AST_royal_australian_navy: "王立オーストラリア海軍"
 AST_royal_australian_navy_desc: "連邦成立後に植民地の艦隊を統合して編成されたオーストラリア海軍は、先の大戦ではあらゆる戦域で活動した。その後は予算の制約により規模の縮小を余儀なくされたが、世界的な緊張が高まる今、再び艦隊を海に送り出す時が来た。"
 AST_coast_watchers: "沿岸監視隊"
 AST_coast_watchers_desc: "我が軍の大部分は依然として本土に集中しているが、北方からの進入路は極めて重要な早期警戒網としての役割を担っている。これらの外縁の島々に現地の諜報員を配置することで、オーストラリア本土に脅威が及ぶ遥か以前に、敵の空軍および海軍の動きを探知することが可能になる。"
 AST_marines: "海兵隊"
 AST_marines_desc: "島嶼地域の中でも最大の島国として、自国の海岸線を超えて戦力投射が可能な水陸両用戦力を保持しなければならない。防御から攻勢に転じる必要があれば、これらの戦力が島伝いの作戦を効果的に実行可能である。"
 AST_naval_auxiliary_patrol_taog: "海軍補助哨戒隊"
 AST_naval_auxiliary_patrol_taog_desc: "正規軍が他の任務に従事している間、地元の熱意ある志願兵に港および沿岸施設の防衛を任せることができる。地元水域に関する彼らの深い知識は極めて貴重であり、地元の漁師が軍務に就いているとは誰も疑わないだろう。"
 AST_cockatoo_island_shipyards_taog: "コッカトゥー島造船所"
 AST_cockatoo_island_shipyards_taog_desc: "コッカトゥー島造船所は長きにわたって帝国の修理および整備拠点として稼働し、国外におけるイギリス海軍の作戦を支えてきた。現在は王立オーストラリア海軍の中核拠点となっている。拡大する需要に応え、海軍力を維持するために、同施設の能力を拡張しなければならない。"
 AST_kangaroo_point_dry_dock_taog: "カンガルーポイント乾ドック"
 AST_kangaroo_point_dry_dock_taog_desc: "エバンス・ディーキン・アンド・カンパニーは主に工学企業だが、世界的な緊張の高まりを受け、造船能力を拡大する必要性を的確に認識し、カンガルーポイントに目を向けている。艦隊の継続的な成長を支えるため、彼らによるこの土地の取得を促すべきである。"
 AST_scrap_iron_flotilla_taog: "屑鉄戦隊"
 AST_scrap_iron_flotilla_taog_desc: "批評家には時代遅れで老朽化していると片づけられるが、それでもなお我が国の古い駆逐艦のいくつかが一つの編制にまとめられた。現代的な艦船のような威信はないが、これらの艦船は我々がすでに保有するものを有効活用できることを示している。"
 AST_cruising_for_a_bruising: "無謀な航海"
 AST_cruising_for_a_bruising_desc: "我が国の海軍は長きにわたって巡洋艦を巧みに運用してきた。これは拡大に値する伝統である。高速で汎用性が高く、攻撃能力に優れたこれらの艦船は、間もなく世界的な名声を得るだろう。その進路を横切るあらゆる敵は深刻な打撃を受けることになる。"
 AST_strike_from_down_under: "南半球からの一撃"
 AST_strike_from_down_under_desc: "海面下を滑るように進み、雷鳴のような音は響かせず、ひとたび艦船を発見すればそれを略奪してしまう。南半球から来る潜水艦のことを聞いたことがあるか？艦隊を失いたくなければ、逃げたほうが賢明である。"
 AST_hmas_sydney: "HMASシドニー"
 AST_hmas_sydney_desc: "戦艦の時代は終わった。海軍力の未来は艦隊の頭上の空にあり、オーストラリアは決して取り残されはしない。数年にわたる海軍の再建と近代化を通じ、最後の一歩を踏み出す準備は整っている。すなわち、今後一世代にわたってオーストラリアの海軍力を決定づける航空母艦である。"
 AST_conscription_level_allowed_tt: "さらなる徴兵を求める政治的意思（国家方針の人的資源アイコンを参照）"
 AST_conscription_level_allowed_limited_conscription_tt: "新たなレベルの§Y徴兵法§!がアンロックされ、§Y限定的徴兵§!が使用可能になる"
 AST_conscription_level_allowed_extensive_conscription_tt: "新たなレベルの§Y徴兵法§!がアンロックされ、§Y大規模徴兵§!が使用可能になる"
 AST_conscription_level_allowed_service_by_requirement_tt: "新たなレベルの§Y徴兵法§!がアンロックされ、§Y無際限徴兵§!が使用可能になる"
 AST_conscription_level_allowed_all_adults_serve_tt: "新たなレベルの§Y徴兵法§!がアンロックされ、§Y全成人徴兵§!が使用可能になる"
 AST_conscription_level_allowed_scraping_the_barrel_tt: "新たなレベルの§Y徴兵法§!がアンロックされ、§Y根こそぎ動員§!が使用可能になる"
