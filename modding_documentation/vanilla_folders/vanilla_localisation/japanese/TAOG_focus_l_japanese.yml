 # <Empower the Volksraad>
 INS_the_jewel_in_the_crown: "王冠の宝石"
 INS_the_jewel_in_the_crown_desc: "東インドはオランダ植民地の王冠の中でも最も輝かしい宝石であり、我々はこのままこれを保持するつもりである。フォルクスラートを通じ、我々の声はハーグに届く。"
