 effects_of_event_tt: "\n§Yイベントの影響§!:"
 AST_war_is_coming: "戦争は迫っている"
 AST_war_is_coming_desc: "過去30年間、我々は次々と現れる試練に直面してきたが、最後の試練が目前に迫り、オーストラリア民主主義の強さを試そうとしているようだ。前首相のビリー・ヒューズはこの件について明確な立場を示している。それは、好むか好まないかにかかわらず、戦争は起こるという主張だ。この主張を無視することは無責任であろう。"
 AST_war_is_coming_tt: "\n§Y民主選挙§!をアンロック"
 AST_war_is_coming_uap_advisors_tt: "（§Y$AST_billy_hughes$§!）:"
 AST_war_is_coming_alp_advisors_tt: "（§Y$AST_james_scullin$§!）:"
 AST_war_is_coming_decrease_advisors_tt: "（§Y$AST_maurice_blackburn$§!）:"
 AST_war_is_coming_advisors_tt: "\n政治顧問に以下の補正:"
 AST_advance_pacific_initiatives: "太平洋構想の推進"
 AST_advance_pacific_initiatives_desc: "不可侵条約の締結に成功し、我々とアジア隣国との関係は改善された。この関係性を最大限に利用し続け、新たな同盟国に対して我々の産業開発を支援するように要請する。"
 AST_advance_pacific_initiatives_tt: "\n次の国と不可侵条約を締結する:"
 AST_advance_pacific_initiatives_jap_tt: " §Y[JAP.GetName]§!はマップ外の§Y造船所§!§G2§!つを効果に追加。"
 AST_advance_pacific_initiatives_ins_tt: " §Y[INS.GetName]§!はマップ外の§Y合成精製所§!§G1§!つを効果に追加。"
 AST_advance_pacific_initiatives_chi_tt: " §Y[CHI.GetName]§!はマップ外の§Y民需工場§!§G2§!つを効果に追加。"
 AST_advance_pacific_initiatives_jap_2_tt: "§Y[JAP.GetName]§!は以下を提示:"
 AST_advance_pacific_initiatives_ins_2_tt: "§Y[INS.GetName]§!は以下を提示:"
 AST_advance_pacific_initiatives_chi_2_tt: "§Y[CHI.GetName]§!は以下を提示:"
 AST_advance_pacific_initiatives_2_tt: "\n関連する国家と交戦状態になると建物は削除される。"
 AST_pacific_initiatives_modifier: "外交構想"
 AST_domestic_industry: "国内産業"
 AST_domestic_industry_desc: "戦争が起きた場合、同盟国の防衛産業に供給を依存するわけにはいかない。自国の産業を拡大し、いかなる状況にも備えなければならない。"
 AST_a_democratic_bulwark: "民主主義の防波堤"
 AST_a_democratic_bulwark_desc: "ファシストと共産主義者の双方の脅威に揺るがず立ち向かうには、民主主義が先頭に立たなければならない。政府は、市民の意思が統治機構に確実に反映され、政治家の不満が有害なイデオロギーではなく別の民主政党への参加によって解消されるよう、積極的な措置を講じる政策を採用する。"
 AST_the_pacific_pact: "太平洋協定"
 AST_the_pacific_pact_desc: "1934年にライオンズが打ち出した太平洋構想は、オーストラリアとアジア主要国との接触を築き、我々の利益を英国官僚に代弁してもらう必要をなくした。これらの関係性を利用してアジア列強にオーストラリアへの不侵略を確約させられるのなら、それこそ我々の外交努力の究極の目標である。困難な試みではあろうが、挑む価値はある。"
 AST_a_collapsing_league_of_nations: "崩壊する国際連盟"
 AST_a_collapsing_league_of_nations_desc: "国際連盟は崩壊しつつある。善意に基づく取り組みだが、残念ながら非現実的な希望に根ざしている。制裁方策は容易に空虚なジェスチャーと化している。とりわけ、粗暴な国家を抑止する武力が存在しない場合にはなおさらだ。我々は再軍備を始めなければならない。"
 AST_department_of_munitions: "軍需省"
 AST_department_of_munitions_desc: "前線の兵士たちに十分な補給を行うには、軍需生産を加速させる必要がある。軍需省を設置すれば、軍需品の生産に対する監督を強化できる。"
 AST_call_for_a_referendum: "国民投票の実施"
 AST_call_for_a_referendum_desc: "我々は連邦政府の権限を強化したいが、まずは有権者の承認が必要だ。国民投票を実施すれば、その同意を得られる。"
 AST_rural_concessions: "農村部への譲歩"
 AST_rural_concessions_desc: "農村部の代表である地方党は単独で政権を担うには得票数が少なすぎる。しかし、彼らの影響力をオーストラリアの政治に受け入れることで、現在の与党である我々は追加の支持を得ることができる。"
 AST_rural_concessions_tt: "\n§Y$AST_country_party_influence_uap$§!は、この国家方針が完了した時点で政権を握っている政党の得票を増加させる。"
 AST_solidarity_by_the_empire: "帝国の結束"
 AST_solidarity_by_the_empire_desc: "これまで大英帝国は、戦時にも平時にも我々を導いてきた。今後もその助言を重んじ、起こりうる紛争への備えにおいて協力を続けるべきである。"
 AST_solidarity_by_the_empire_modifier: "帝国の結束"
 AST_wool_agreement: "羊毛協定"
 AST_wool_agreement_desc: "羊毛はオーストラリアを代表する輸出品の一つであり、その輸出は利益をもたらすだけでなく、輸入国との関係改善にも寄与している。しかしイギリスはその全量を要求している。兵士の軍服に用いる意図もあるが、羊毛不足の列強との交渉材料にする狙いもある。ここはイギリスの要求を受け入れよう。"
 AST_australian_war_cabinet: "オーストラリア戦時内閣"
 AST_australian_war_cabinet_desc: "イギリスの要求に応じ、我々独自の戦時内閣を設立する。この内閣は国家安全保障に専念できるので、効果的で戦略的な意思決定が担保される。"
 AST_singapore_strategy: "シンガポール戦略"
 AST_singapore_strategy_desc: "シンガポール戦略はオーストラリア防衛政策の中核をなすものだ。太平洋に駐留する王室海軍艦艇の基地として、シンガポールそのものが極めて重要である。我々は追加の防衛施設建設に踏み切るようイギリスを説得する一方で、オーストラリア海軍の能力強化に努める。"
 AST_singapore_strategy_tt: "§Y180§!日後（§Yシンガポール§!）:\n§Y航空基地§!を§G2§!つ追加。\n§Y海軍基地§!を§G2§!つ追加。\n§Y沿岸要塞§!を§G1§!つ追加。"
 AST_british_war_cabinet: "イギリス戦時内閣"
 AST_british_war_cabinet_desc: "戦争が勃発し、イギリスは連合国の戦争努力を効率的に進めるため、戦時内閣を設置した。彼らはこの件について我々の見解も求めており、オーストラリアの利益を代表するため首相が出発する。"
 potential_consequence_tt: "§Y想定される結果§!:\n"
 AST_british_pacific_fleet: "イギリス太平洋艦隊"
 AST_british_pacific_fleet_desc: "敵艦隊が南方へ制海権を拡大するのを抑止し、防ぎきるには、太平洋におけるイギリスの存在が不可欠となる。[Root.GetFactionName]の一員として、我々は沿岸水域を守るための共同指揮体制の確立に向けて行動を起こす。"
 AST_all_dressed_up: "完全装備"
 AST_all_dressed_up_desc: "オーストラリア兵がイギリスの戦争を戦うのであれば、その装備はイギリスの工場が賄うべきだ。"
 AST_overseas_loyalties: "海外への忠誠"
 AST_overseas_loyalties_desc: "我々は今後も海外の戦争に貢献し続け、オーストラリア兵にとって異国の地など存在しないことを改めて証明する。戦争が我々に降りかかるのではない。我々が戦争に赴くのだ。"
 AST_the_ultimate_overseas_duty: "究極の海外任務"
 AST_the_ultimate_overseas_duty_desc: "イギリスの首相は責務をあまりにもお粗末に果たしたため、自らの閣僚の間に不信が広がった。メンジーズはイギリス戦時内閣に出席するための訪英で強烈な印象を残しており、いまや彼こそがイギリスにとってより良い選択肢なのではないかと示唆する者もいる。彼がイギリス連邦の手綱を握れば、我々はメンジーズの[AST.GetName]への忠誠を利用し、権威を高めることができる。"
 AST_the_ultimate_overseas_duty_tt: "\n§Y$AST_robert_menzies$§!が§Y[ENG.GetNameDef]§!の指導者である場合、国家方針§Y$AST_a_change_of_authority$§!で§Y$autonomy_associated_dominion$§!になることができる。"
 AST_pleading_britain: "イギリスへの嘆願"
 AST_pleading_britain_desc: "戦争は確実に迫っており、我々も震え上がっている。ANZAC精神とディガーズの名声には最大限の敬意を払うとしても、[ENG.GetName]の援助がなければオーストラリアの戦争遂行能力はすぐに尽き果てるだろう。首相は可及的速やかに[ENG.GetLeader]へ電報を打つ。"
 AST_bound_once_more: "再び結ばれる"
 AST_bound_once_more_desc: "我々の道は分かれたが、再び交わることになる。[ENG.GetNameDefCap]と[AST.GetName]はいずれも国家的変化のただ中にあるが、その結果として生じた両者の距離は、意図せぬ有害な副作用にすぎない。少なくとも我々側にとってはそうである。我々は再び同盟を結び、変わりゆく両国が直面する障害を団結して乗り越える。"
 AST_eng_to_ast_faction_tt: "§Y[ENG.GetName]§!とその従属国が§Y[AST.GetFactionName]§!に参加する。"
 AST_faction_leader_tt: "§Y[AST.GetFactionName]§!陣営の盟主に設定"
 AST_eng_as_faction_leader_tt: "\n（[ENG.GetFlag]§Y[ENG.GetName]§!）$AST_faction_leader_tt$."
 AST_australian_command: "オーストラリア司令部"
 AST_australian_command_desc: "オーストラリアの防衛と安全保障の重要性は[ENG.GetNameDef]にとっても明らかとなっており、統合部隊の再編が必要だ。より多くのイギリス軍部隊をオーストラリアの指揮下に置くことで、より効率的な戦争努力を進められる。"
 AST_taking_the_helm: "舵を取る"
 AST_taking_the_helm_desc: "東南アジアにおける我々の影響力が拡大するにつれ、それを守るために海軍力も強化しなければならない。王立オーストラリア海軍への継続的な投資を優先し、東方の海域に対する支配を確立する。"
 AST_eastern_focus: "東方重視"
 AST_eastern_focus_desc: "イギリスの戦争がオーストラリアの戦争であるなら、オーストラリアの戦争もまたイギリスの戦争である。日本の侵攻は長らく否定しようのない脅威として迫っており、我々はもはや戦火が自らの身に降りかかるのをただ待つだけの消極姿勢を受け入れない。オーストラリアの決意が何を意味するのかを日本に示すとともに、イギリスにもまた、最も大胆な形——すなわち宣戦布告によってその忠誠を示させるのだ。"
 AST_eastern_focus_tt: "\nこの任務により、§Y[ENG.GetNameDef]§!は§Y[JAP.GetNameDef]§!に対して直ちに宣戦布告可能となり、180日以内に実施されなければ強制的に宣戦布告が行われる。§Y[ENG.GetNameDefCap]§!はオーストラリアの防衛建設に資金提供することで、任務の完了を遅らせることができる。"
 AST_holding_the_battlefield: "戦線維持"
 AST_holding_the_battlefield_desc: "多くのオーストラリア兵が海外で命を落としてきたにもかかわらず、その功績はイギリスのものとして数えられている。オーストラリアは講和会議の場で、[ENG.GetNameDef]と並ぶより大きな発言力を求める。さもなくば、我々の貢献は打ち切られかねない。"
 AST_holding_the_battlefield_tt: "§Y[ENG.GetNameDef]§!との講和会議で§Y傀儡§!行動および§Y州獲得§!行動の§Yコストを削減§!する。"
 AST_a_change_of_authority: "権限の変化"
 AST_a_change_of_authority_desc: "オーストラリアは従順な従属国から、尊敬される自己主張の強い国家へと成長した。今こそ、世界の列強の一つとなるための最後の一歩を踏み出す時である。[AST.GetFactionName]の盟主として、友は我々を敬い、敵は我々を恐れるだろう。防御を固めて踏みとどまることで、オーストラリアは決して屈しない。"
 AST_a_change_of_authority_tt: " §Y[ROOT.GetName]§!は宣戦布告できるようになる。\n§Y[ROOT.GetName]§!は参戦要請を拒否できるようになる。\n§Y[ROOT.GetName]§!は今後、宗主国に講和会議スコアを移譲しない。"
 AST_reinforcements: "防備の増強"
 AST_reinforcements_desc: "大半が未開発の北方地域に、防衛施設と航空基地を整備する。"
 AST_weekly_stability_tt: " 週ごとの安定度: §G+1.00%§!"
 AST_ending_overseas_conscription: "海外徴兵の廃止"
 AST_ending_overseas_conscription_desc: "我が国の兵士はただちに海外の戦線から離れねばならない。彼らはここで必要とされている。"
 AST_unlocking_conscription_1903_tt: "§Y徴兵法§!をアンロックするために必要。"
 AST_unlocking_further_conscription_tt: "§Y大規模徴兵§!または§Y無際限徴兵§!をアンロックするには、以下の国家方針のいずれかも必要: §Y$AST_british_pact$§!（ファシスト）、§Y$AST_refuse_british_wars$§!（ファシスト）、§Y$AST_toe_the_line$§!（ファシスト）、§Y$AST_from_picket_line_to_front_line$§!（共産主義者）、§Y$AST_part_with_colonizer$§!（共産主義者）。"
 AST_unlocking_conscription_tt: "§Y$AST_invoke_the_1903_defence_act$§!も実行済みの場合、残るすべての§Y徴兵法§!をアンロック。"
 AST_an_uncle_for_father_figure: "父の代わりに叔父を頼る"
 AST_an_uncle_for_father_figure_desc: "我々には近代的な兵器が不足している。そこで[USA.GetName]に供給を要請する。"
 AST_seven_million_britishers: "700万人の英国人"
 AST_seven_million_britishers_desc: "[ENG.GetLeader]は我々に明確な約束を与えることをためらってきたが、いざという時には、彼とイギリスが[AST.GetNameDef]への責務を果たすと信じよう。何しろ我々もまた700万人の英国人なのだから。"
 AST_seven_million_britishers_reinforcements_tt: "\n§Y「$AST_reinforcements$」が完了していない場合§!:"
 AST_seven_million_britishers_conscription_tt: "\n§Y「$AST_ending_overseas_conscription$」が完了していない場合§!:"
 AST_seven_million_britishers_uncle_tt: "\n§Y「$AST_an_uncle_for_father_figure$」が完了していない場合§!:"
 AST_we_endured: "我々は耐え抜いた"
 AST_we_endured_desc: "迫りくる紛争という予測は当初こそ圧倒的に思えたが、それを防衛力拡充の加速に活用したことで、結果的には意味を持った。我々は耐え抜き、これからも持ちこたえる。そして今や、最終目標である戦争の勝利に全力を注ぐ。"
 AST_under_the_rule_of_canberra: "キャンベラの統治下で"
 AST_under_the_rule_of_canberra_desc: "太平洋諸国のあいだで高まる緊張は憂慮すべきものであり、イギリスは自らの戦いで手いっぱいなため、我々の救援に駆けつける見込みは薄い。もし英連邦を再編し、太平洋およびインド洋の諸国をキャンベラから直接統治できるようにすれば、[ENG.GetNameDef]がなくとも一つの戦線のもとに結集できるかもしれない。"
 AST_its_fight_work_or_perish: "戦うか、働くか、さもなくば滅びるか"
 AST_its_fight_work_or_perish_desc: "戦争は始まった。あとは、その準備ができていることを証明するだけだ。"
 AST_no_foreign_battlefields: "海外戦場への派兵なし"
 AST_no_foreign_battlefields_desc: "ここまで長い時間がかかったが、ついに政府はいかなる国民に対しても海外の戦場での兵役を強制しないと宣言する。"
 AST_no_foreign_battlefields_modifier: "海外戦場への派兵なし"
 AST_platypus_modifier: "贈呈されたカモノハシ"
 AST_aerial_defense: "航空防衛"
 AST_aerial_defense_desc: "我々に世界大国に匹敵する海軍を維持する余裕はない。だが、我々に向けられるいかなる航空戦力にも匹敵する航空戦力を維持することなら可能だ。"
 AST_ratify_westminster_adoption_act: "ウェストミンスター憲章受諾法の批准"
 AST_ratify_westminster_adoption_act_desc: "長年にわたる政策の変更は議論を引き起こすかもしれないが、ウェストミンスター憲章受諾法の批准は、とうに済ませておくべきことだった。我々はどの戦争を自分たちの戦争とするかを、自ら選ぶ。"
 AST_ratify_westminster_adoption_act_tt: "£GFX_trigger_no 戦争への参加要請を拒否可能"
 AST_administer_the_mandate: "委任統治領の管理"
 AST_administer_the_mandate_desc: "1920年以来ニューギニアを国際連盟の委任統治下で統治してきたこと、そしてパプアが連邦成立以来ほぼ一貫して[AST.GetName]の外部領土であったことを考えれば、パプアニューギニア東部を[AST.GetName]の中核領土に加えるのは自然な流れである。国際連盟が解体した今、そのような連邦再編を進める好機が訪れている。"
 AST_a_rational_request: "理にかなった要求"
 AST_a_rational_request_desc: "シンガポール戦略は理論上は成り立つ。だが、それも理論上だけの話だ。ヘンリー・ウィンターらの強硬な声は最初から正しかった。太平洋戦争が勃発すれば、イギリスはおそらく本土の戦いで手一杯となり、英国の援助を前提とした戦略は成り立たない。ゆえに我々は、自らの海洋防衛に責任を持つため、シンガポールの統制権を要求する。"
 add_trait_to_theorist_tt: "§Y理論家§!に以下の特性を追加:"
 AST_volunteers: "志願兵"
 AST_volunteers_desc: "選べることこそが重要なのだ。参戦要請を拒否できるからといって、オーストラリアが常にそうするとはかぎらない。オーストラリア人は、自国であれ異国であれ、自ら正しいと信じるもののために戦う権利を持つべきである。"
 AST_until_the_tide_of_battle_swings: "戦況が変わるまで"
 AST_until_the_tide_of_battle_swings_desc: "我々は公の声明で、我々の裏庭でうごめく脅威をもはや無視できる時代は終わったと明言する。太平洋での戦いを、大戦全体の従属的な一局面として扱う政策は受け入れない。オーストラリアはただちに侵攻に備える。"
 AST_walls_and_whispers: "壁と耳"
 AST_walls_and_whispers_desc: "貫けない壁と、世の中の声を拾う耳は、国家安全保障という面で大きな可能性を秘めている。我が国全土において、より良い基盤上に陸上および沿岸防衛を築くための措置が開始され、その中に情報本部が設置される。"
 AST_united_states_as_our_keystone: "要石としてのアメリカ合衆国"
 AST_united_states_as_our_keystone_desc: "我々はイギリスが抱える問題を知っている。戦力分散の危険性も知っている。しかし同時に、オーストラリアを失ってもイギリスはなお持ちこたえられることも知っている。ゆえに我々は、オーストラリアを倒れさせないと決意している。そのため、アメリカ合衆国を要石とする計画の策定に全力を注ぐ。"
 AST_liberty_loans: "自由公債"
 AST_liberty_loans_desc: "この国史上最高の財務大臣だとさえ評されるベン・チフリーは、その経験を通じて戦時経済を管理する能力を証明してきた。彼の提言に従い、我々は国民に余剰所得を貯蓄へ回し、戦時公債へ投資するよう促す。"
 AST_inevitably_independent: "独立は不可避"
 AST_inevitably_independent_desc: "統一オーストラリア党は常に英国市民としての立場を重んじてきた。しかし、オーストラリアの利益に対する[ENG.GetNameDef]の無関心が、我々に独立宣言と自国防衛の優先を余儀なくさせた。今や英国の戦争に海外で従軍することは自然と問題でなくなり、反英派でさえ足並みをそろえる傾向にある。したがって、より広範な徴兵にも反発は少ないだろう。"
 AST_bring_on_the_giant: "巨人を迎え入れる"
 AST_bring_on_the_giant_desc: "ついに統一され、自立した国家として戦う我々は、まもなくその勇気を試されることになる。太平洋の向こう側も利害は一致しているようで、発達した軍需産業を持つ[USA.GetNameDef]は、豊富な物資の一部を我が軍に貸与することで、自国とオーストラリアの双方に大きな利益をもたらすことができる。"
 AST_bring_on_the_giant_tt: "  §Y[USA.GetNameDefCap]§!が同意した場合:\n §Y輸送船団§!§Y+50§!ユニットを備蓄に追加する。"
 AST_allied_after_all: "それでもなお同盟国"
 AST_allied_after_all_desc: "オーストラリアの独立は必要なことだったが、旧宗主国との協力がすべて終わるわけではない。我々はこれまでどおり[ENG.GetFactionName]への忠誠を維持しつつ、陣営内での影響力拡大を目指す。"
 AST_the_pacific_resistance: "太平洋抵抗戦線"
 AST_the_pacific_resistance_desc: "ついにオーストラリアは独立を果たした。そして、イギリスの戦争努力からも離脱するのが当然の流れだ。代わりに[USA.GetNameDef]との結束を追求すれば、オーストラリアの利益を重視した合同指揮戦略を築くことができる。その一方で、我々は自国の防衛産業とその拡張を独自に完全掌握する。"
 AST_the_pacific_resistance_tt1: "§Yオーストラリア§!が§Y[USA.GetFactionName]§!に加盟する。"
 AST_the_pacific_resistance_tt2: "§Y[USA.GetName]§!が§Y太平洋抵抗戦線§!に加盟する。"
 AST_conscription_at_last: "徴兵制の導入"
 AST_conscription_at_last_desc: "独立の味は甘美である。自国の防衛を優先する力を得たと実感できるからだ。しかし、この力には責任も伴う。強制的な徴兵制を軽々しく拡大すべきではないが、戦争に突入した今、それがどうしても必要な状況だ。"
 AST_equal_training: "同等の訓練"
 AST_equal_training_desc: "同盟国との協力は、勝手に機能するとみなすのではなく、磨き上げなければならない。オーストラリアは率先して[ROOT.GetFactionName]諸国の合同訓練キャンプを組織し、すべての兵士が等しく厳しい訓練を受けられるようにする。"
 AST_a_northern_barrier: "北方の防壁"
 AST_a_northern_barrier_desc: "敵は北方から迫っている。その手前には備えのない小国が連なっており、敵は我々の目の前に現れるまでに、それらを意のままに襲うことができる。もし[INS.GetNameDef]と団結して一つの防壁を築ければ、なおも彼らを食い止められるかもしれない。"
 AST_demand_resources: "資源の支配権を要求する"
 AST_demand_resources_desc: "拡張主義の侵略者がインドシナに目を向けるのは、領土そのものだけでなく、そこに眠る資源のためでもある。この富が敵の手に渡れば戦争を長引かせるだけだが、我々の手中にあれば戦争終結の助けとなる。ゆえに我々はこれらの資源の支配権を要求する。もし保有者が協力を拒むなら、それは敵と何ら変わらない。"
 AST_demand_resources_tt: "東南アジア諸国の資源の一部を要求する§Y$AST_resource_acquisition_cat$§!ディシジョンをアンロックする。"
 AST_reclaim_the_lost_territory: "失われた領土の奪還"
 AST_reclaim_the_lost_territory_desc: "オーストラリアの植民地を連邦へ統合する過程で、ニュージーランドは最終的に参加しない道を選んだ。しかし、それ以降も憲法はニュージーランドをオーストラリア連邦の潜在的な州の一つとして定め続けており、その加入も認めている。我々は東の隣国にそのことを思い出させ、現在の世界情勢は団結を求めているのだと訴える。"
 AST_reclaim_the_lost_territory_tt: "（[NZL.GetFlag]§Y[NZL.GetName]§!）は陸軍・海軍・空軍すべての戦力を§Y[AST.GetNameDef]§!に譲渡する"
 AST_australia_first: "オーストラリア・ファースト"
 AST_australia_first_desc: "中央党の極右的な勢いは長続きせず、1935年の解党をもって終わりを迎えた。しかし、実業家であり政治活動家でもあるウィリアム・ジョン・マイルズの思想に端を発する新たな動きが芽生えはじめている。しかし、この感情を刺激するための行動を取らなければ、発生した時と同じ速さで衰退していくかもしれない。ならば、行動しなければ。"
 AST_pankhurst_walsh: "アデラ・パンクハースト・ウォルシュ"
 AST_pankhurst_walsh_desc: "オーストラリア・ファースト運動の正式な発足にあたり、アデラ・パンクハースト・ウォルシュを会長に任命する。オーストラリア帝国婦人ギルドの創設者でもあるパンクハースト・ウォルシュはロンドンを拠点とする女性ギルドとの密接な関係を維持しつつ、長きにわたってイギリス市民権の価値を主張してきた。この価値観、すなわち「イギリスとの継続的な結びつき」は運動の中核を成す原則となる。"
 AST_stephensen: "P・R・スティーヴンセン"
 AST_stephensen_desc: "オーストラリア・ファースト運動の正式な発足にあたり、P・R・スティーヴンセンを会長に任命する。ウィリアム・ジョン・マイルズの文芸顧問であったスティーヴンセンは、師と孤立主義的かつ民族主義的な見解を共有している。これらの見解、すなわち「イギリスからの独立」と「オーストラリア文化の統一」は我々の運動の規約においても中核を成す2つの原則となる。"
 AST_stephensen_tt: "\n§Yオーストラリア・ファースト運動§!の会長の選択は、将来の行動の可能性を左右する。"
 AST_a_growing_womens_guild: "女性ギルドの拡大"
 AST_a_growing_womens_guild_desc: "オーストラリア帝国婦人ギルドは1928年の創設以来、国家の経済問題に対処するための産業協力を提唱してきた。国家のためには、国民は政府に対抗するのではなく支援すべきである。パンクハースト・ウォルシュがオーストラリア・ファーストの会長になることで、我々はその政治運動を通じて、この理念をさらに拡大することができる。"
 AST_realize_the_value_of_british_citizenship: "英国市民権の価値を認識する"
 AST_realize_the_value_of_british_citizenship_desc: "[AST.GetName]に対する[ENG.GetNameDefCap]の宗主権は、長きにわたって防護の盾であり、導きの光であった。我々のルーツはイギリスであり、我々はイギリスに属し続けるだろう。ただし、それが我々のためになるかぎりは。"
 AST_the_bolsheviks_counterforce: "反ボリシェヴィキ勢力"
 AST_the_bolsheviks_counterforce_desc: "捜査部門は数十年にわたって反体制的集団の活動を調査してきた。左翼の脅威を抑え込むその仕事ぶりは極めて有益であり、オーストラリア・ファーストの反対者が我々の成長に全力で抵抗していることを理由に軽視されるべきではない。我々はオーストラリアの情報機関内で地位を確保し、国家安全保障に対する真の脅威が優先に対処されるようにすべきである。"
 AST_public_meetings_tt: "構成員を動員してファシズムの支持を高める§Yオーストラリア・ファースト運動§!のディシジョンをアンロック。"
 AST_rile_up_veterans: "退役軍人の扇動"
 AST_rile_up_veterans_desc: "大恐慌の発生当初、第一次世界大戦の退役軍人たちは共産主義の台頭に対抗するため、極右の準軍事組織として結集した。これらの組織が解散済みだとしても、元構成員たちが消え去ったわけではない。オーストラリア・ファーストは彼らを吸収し、反共産主義の精神を引き継ぐべきである。"
 AST_eureka_stockade_monument_rally: "ユーレカ砦記念碑集会"
 AST_eureka_stockade_monument_rally_desc: "1854年、ユーレカ砦の反乱において、オーストラリアの金鉱夫たちは採掘許可の法外な費用と金鉱への課税をめぐり植民地当局と激しく戦った。当時はイギリスの宗主権に対する不満が明白であり、それは現在も続いている。我々はこの戦いの記念碑の下に集結し、イギリスからの分離を求めて決起する。"
 AST_australian_pivot_modifier: "オーストラリアの転換"
 AST_well-being_of_the_community: "共同体の福祉"
 AST_well-being_of_the_community_desc: "オーストラリア国民はキリスト教的な暮らしや家族の理想を重んじるべきである。しかし、過去数年の出生率の低さを見るに、これらの理想が十分に尊重されてこなかったことは明らかだ。共同体の福祉のために、家族生活を推進するキャンペーンを開始する。"
 AST_covert_networks: "秘密ネットワーク"
 AST_covert_networks_desc: "オーストラリア・ファーストが捜査部門内で活動するにあたり、我々は[ENG.GetNameDef]において思想を同じくする運動と国境を越えた協力関係を模索する。我々の宗主国との同盟は別な形で役立つ可能性があり、共通する思想を持った同盟者たちに秘密裏に接触し、我々の諜報能力を拡大することを可能とする。"
 AST_refuse_british_wars: "イギリスの戦争を拒否"
 AST_refuse_british_wars_desc: "先の大戦におけるガリポリの戦いは、[ENG.GetNameDef]が我々の遠征軍をいかに無謀に扱うかを示した。イギリスの名の下に再び海外作戦に参加するなど、もはや到底考えられない。オーストラリア国民は、イギリスの指揮下で二度と血が流されないことを求めており、政府は行動を迫られている。ウェストミンスター憲章受諾法を批准する。"
 AST_walls_like_uluru: "ウルルのごとき防壁"
 AST_walls_like_uluru_desc: "オーストラリアは、それ自体が一つの大陸である。帝国の盾なしに立つなら、自らの盾を築かなければならない。海岸線を固め、港を要塞化し、この国を容易な獲物とみなす者にとって、あらゆる接近路を危険なものにする。"
 AST_at_the_gates: "門前にて"
 AST_at_the_gates_desc: "世界は戦争へと向かっており、オーストラリアは備えのないまま不意を突かれてはならない。国中の工場と造船所は、さらに高い稼働段階へ移行しなければならない。これは他国の戦争への備えではなく、我々自身の生存への備えである。"
 AST_the_guild_for_the_war_effort: "戦争努力のためのギルド"
 AST_the_guild_for_the_war_effort_desc: "オーストラリア帝国婦人ギルドは王冠に奉仕するために設立されたが、その目的は完全に転換されつつある。同ギルドが築いた広大な組織網は、今後、自立したオーストラリアの軍需産業、病院、補給網へと力を注ぐことになる。"
 AST_for_the_southern_cross: "南十字星のために"
 AST_for_the_southern_cross_desc: "南十字星はイギリスの空に翻るものではない。我々の頭上に翻るものだ。オーストラリアのアイデンティティは現実のものであり、勝ち取られたものであり、守るに値するものである。新たな国民的誇りが形成されつつある。それはロンドンから借り受けたものでも、遠い制度によって定義されたものでもなく、この大地で、この星々の下で育まれたものだ。"
 AST_through_the_gates: "門をくぐって"
 AST_through_the_gates_desc: "準備は緊急対応へと移行した。国家防衛計画は、オーストラリア産業の総力を背に拡大されている。既存施設の隣には新たな施設が立ち上がり、生産目標は上方修正され、民需生産と軍事上の必要との境界は静かに消えつつある。"
 AST_toe_the_line: "規律に従う"
 AST_toe_the_line_desc: "繁栄の時代にオーストラリア人が慣れ親しんだ快適さは、今や脇に置かなければならない。配給制、長時間労働、奉仕への召集は独立の代償である。それに応じる者は、国家が自分たちを支える用意を整えていることを知るだろう。しかし、犠牲を他人の負担だと考える者に対して、国家はほとんど容赦しない。"
 AST_crush_the_gates: "門を打ち破る"
 AST_crush_the_gates_desc: "増強は完了した。オーストラリアの産業は今や全面的な戦時体制で稼働し、その生産力はすべて国防と国力の投射へと振り向けられている。いかなる嵐が訪れようとも、オーストラリアはもはや慌てて動員に奔走する消極的な自治領としてそれに向き合うことはない。"
 AST_national_defense: "国防"
 AST_national_defense_desc: "計画的な投資と国家による指導を通じて、オーストラリアは自国の防衛を支えられる産業基盤を築いた。工場と造船所は国家の監督下で稼働しており、その生産量は利益ではなく国家の必要によって測られる。"
 modify_AST_national_defense_tt: "§Y$AST_national_defense$§!を以下の通り補正:"
 AST_nauru_pact: "ナウル協定"
 AST_nauru_pact_desc: "権力掌握という最初の障害がまだ目前にある以上、独立の問題は遠い先のことに思える。しかし、オーストラリアの自治は我々だけの関心事ではない。イギリスがオーストラリア・ファーストに抵抗した場合、あるいは我々が最終的にイギリス連邦から離脱する場合に備えて、[GER.GetNameDef]から我々の主権の保証を取り付ける。その見返りとして、我々は政権掌握後、彼らが失った太平洋の島の一つ、ナウルを返還する。"
 AST_australian_culture_investments: "オーストラリア文化への投資"
 AST_australian_culture_investments_desc: "スティーヴンセンはエッセー『オーストラリアにおける文化の基礎』を通じてジンディウォロバク運動の形成に影響を与え、一つのことを明確にした。すなわち、「オーストラリアの文化は優先されなければならない」ということをである。政府は芸術家と作家の価値を完全に軽視しているようだが、我々は違う。ジンディウォロバク支持者とオーストラリア・ファースト支持者の両方を動員することにより、我々は文化的発展を促進していく。"
 AST_australian_culture_investments_tt: "\n§Y365§!日経過後:"
 AST_australia_first_party_focus: "オーストラリア・ファースト党"
 AST_australia_first_party_focus_desc: "オーストラリア・ファーストは構成員数を大きく伸ばし、運動の前進はもう止められない。オーストラリア国民は今こそ、新たに登録された最も声高な民族主義の声、オーストラリア・ファースト党を歓迎すべきである。"
 AST_australia_first_party_req_tt: "§Yオーストラリア・ファースト党§!が設立された。"
 AST_in_from_the_cold: "冷遇からの復権"
 AST_in_from_the_cold_desc: "オーストラリア・ファーストとその支持者たちはもう身を隠す必要がない。歴代政府の下で長きにわたって受けてきた不当な扱いはついに明るみになり、今こそ新たな声を聞かせるべき時である。"
 AST_absorb_the_uap: "UAPの吸収"
 AST_absorb_the_uap_desc: "統一オーストラリア党（UAP）は常に自由主義の立場を維持してきたが、右寄りの部分もある。しかし、新たな政党が政権を握った今、UAPの構成員には現政権の大義を支持する以外の選択肢がほぼないかもしれない。我々は最も有力な党員に働きかけ、彼らをオーストラリア・ファースト党に勧誘すべきである。"
 AST_big_business_pact: "大企業との協定"
 AST_big_business_pact_desc: "オーストラリア・ファースト党は国内産業の保護を目的としているため、財界トップに多くの支持者がいる。彼らの利益を増大させる政策を追求することと引き換えに、彼らは我々の政治的および軍事的目標を支持することになる。"
 AST_big_business_pact_tt: "\n産業および建設目標に影響を与える§Y「大企業との協定」§!のディシジョンをアンロック。"
 AST_autarky: "経済的自立"
 AST_autarky_desc: "外国との貿易に依存する経済は不安定であり、紛争が勃発した場合には特にそうだ。オーストラリアの産業は優先されなければならず、輸入品に負けていてはならない。国内経済を保護し、オーストラリアの自給体制を実現するためには、貿易を法的に制限するしかない。"
 AST_energy_independence: "エネルギー自給"
 AST_energy_independence_desc: "外国との貿易に依存する経済は不安定であり、紛争が勃発した場合には特にそうだ。過酷な時期にオーストラリアが機能することを保証するために、エネルギー自給は極めて重要である。精製所に投資することにより、国内のエネルギー生産を促進することができる。 "
 remove_2_offsite_dockyard: "マップ外の§Y海軍造船所§!を§R2§!つ削除する。"
 AST_british_pact: "イギリスとの協定"
 AST_british_pact_desc: "最近イギリス連邦から分離こそしたが、旧宗主国との協力継続は[AST.GetName]の利益に適うものである。[ENG.GetNameDef]が世界中に戦力を分散していることを考慮すれば、軍事協力によって負担を分担しようとする我々の姿勢は評価されるべきである。"
 AST_naurus_return_to_german_hands: "ナウル、ドイツへと返還"
 AST_naurus_return_to_german_hands_desc: "オーストラリア・ファーストが完全に政権を握った今、ナウルに関する約束を果たし、我々のドイツの同盟国に対しても義務の履行を求める時が来た。[AST.GetName]はついに連邦の束縛から解放され、この件に関してイギリスが口出しすることはできない。"
 AST_naurus_return_to_german_hands_tt: "§Yナウル協定§!が有効になる。"
 AST_naurus_return_to_german_hands_tt_2: "§Yナウル協定§!は現在有効。"
 AST_the_winner_takes_it_all: "勝者総取り"
 AST_the_winner_takes_it_all_desc: "かつてはナウル島を犠牲にしてドイツの協力を得ることが合理的に思われたが、もはやそうではなくなった。我々が強者であると証明された今、ソロモン諸島およびニュージーランドへの拡張を目指す。前者はナウル協定への背信を重ねることになるが、それでも構わない。結局のところ、ソロモン諸島もドイツからオーストラリアの手に渡ることになるだろう。"
 AST_resist_western_intruders: "西洋の侵略者への抵抗"
 AST_resist_western_intruders_desc: "西洋諸国は太平洋の問題に介入せずにいられないようだが、もはやそれは通用しない。彼らが我々の海岸に到達する前に、我々が彼らの海岸に到達する。[AST.GetName]が要求に屈する国家ではないことを証明してやろう。"
 AST_invasion_preparation_tt: "強襲上陸準備期間: §G-20.0%§!"
 AST_naval_invasion_penalty_tt: "強襲上陸ペナルティ: §G-20.0%§!"
 AST_expand_the_fort: "要塞の拡張"
 AST_expand_the_fort_desc: "西太平洋は[USA.GetNameDef]が支配すべき地域ではない。アメリカが領有権を主張している諸島は東アジア諸国に属しているのであり、オーストラリアの影響力が高まるいま、その島々の領有権を主張すべきは我々である。 "
 AST_integrate_the_fort: "要塞の統合"
 AST_integrate_the_fort_desc: "1920年以来ニューギニアを国際連盟の委任統治下で統治してきたこと、そしてパプアが連邦成立以来ほぼ一貫して[AST.GetName]の外部領土であったことを考えれば、パプアニューギニア東部を[AST.GetName]の中核領土に加えるのは自然な流れである。我々のオーストラリア文化の統一に向けた取り組みの一環として、これは次の段階になる。"
 AST_defying_american_interference: "アメリカの干渉をはねのける"
 AST_defying_american_interference_desc: "[USA.GetNameDefCap]の影は我々に覆いかぶさり、我々の行動が彼らの利益と一致しなければいつでも干渉すると脅してくる。強大な世界的大国が鉄の拳で[PHI.GetNameDef]を掌握しているかぎり、東アジア諸国が真に東アジアのものになることは決してないだろう。[AST.GetName]はいかなる外国の侵略者の権威にも屈しない。我々はフィリピンを手にしてみせる。"
 AST_the_pacific_garrison: "太平洋駐屯軍"
 AST_the_pacific_garrison_desc: "東南アジアおよび太平洋の保護はイギリスの利益になるが、ブリテン諸島からは距離がある。我々はイギリスから補給面での支援を受けることと引き換えに、この地域の防衛指揮権を引き受けることを申し出るべきである。これにより、[ENG.GetNameDef]は他の地域に注意を向けられるようになる。"
 AST_vichy_out_of_africa: "ヴィシーをアフリカから追い出す"
 AST_vichy_out_of_africa_desc: "ヴィシー・フランスの崩壊または協力関係の構築は[ENG.GetNameDef]の主目的の1つである。[AST.GetName]は友好のしるしとしてこれに参加し、フランス領アフリカの植民地が制圧されるまで協力すべきである。"
 AST_vichy_out_of_africa_tt1: "国家方針§Y「ヴィシーをアフリカから追い出す」§!を通じ、§Yアフリカ§!の§Yヴィシー・フランス§!領に対して請求権を追加する。\n"
 AST_vichy_out_of_africa_tt2: "§Y「ヴィシーをアフリカから追い出す」§!のディシジョンを通じ、§Yアフリカ§!の§Yヴィシー・フランス§!領に対して請求権を追加する。\n"
 AST_vichy_africa_claim_flag: "§Yアフリカ§!のすべての§Yヴィシー・フランス§!領に対する[AST.GetFlag]§Y[AST.GetName]§!の請求権が§Y「干渉は終わりだ」§!に追加される。"
 AST_vichy_claim_tt: "[AST.GetFlag]§Y[AST.GetName]§!の請求権が§Y「干渉は終わりだ」§!に追加される。"
 vichy_in_africa_trigger: "§Yヴィシー・フランス§!: 支配下の州のいずれか:\n    §Yアフリカ§!に存在する"
 vichy_wargoal: "§Yヴィシー・フランス§!に対して戦争目標§Y「併合」§!を獲得。"
 AST_britain_supplying_ships: "イギリスによる艦船供給"
 AST_britain_supplying_ships_desc: "イギリスの同盟国の沿岸防衛という重責を担うにあたり、[ROOT.GetName]の艦隊を拡張する必要しなければならないという事実が明らかとなった。[ENG.GetNameDefCap]が我々に艦船を供給するのは当然のことである。"
 AST_hand_in_glove: "緊密な協力"
 AST_hand_in_glove_desc: "北方へ拡大することで、東南アジアの外交および紛争に対するオーストラリアの影響力を高めることができる。我々はすでに、自国の利益とともにイギリスの利益も守れることを証明してきた。したがって、[ENG.GetNameDef]も、自国の遠方の領土は我々の手に委ねるべきであると理解するはずだ。"
 AST_claim_french_indochina: "仏領インドシナを請求"
 AST_claim_french_indochina_desc: "フランスの運命が定まらないなかでは、その植民地の運命も不透明である。他国が仏領インドシナに対して触手を伸ばそうとするかもしれないが、彼らが我々に先んじることはない。"
 AST_undeniably_ours: "紛れもなく我々のもの"
 AST_undeniably_ours_desc: "外交によって得られるものが何であれ、それですべてが手に入るわけではない。脆弱な状況にあるヴィシー・フランスの国境はもはや形だけのものでしかなく、その領土を完全に占領する機会を諦めることは極めて愚かである。必然的に、戦争の時が来たのだ。"
 AST_done_meddling: "干渉は終わりだ"
 AST_done_meddling_desc: "[AST.GetName]は古き祖国に変わらぬ忠誠を捧げ、胸を張ってイギリスとともに戦い続けている。オーストラリア人は頼りになるが、だからといって彼らの貢献を当然のものと見なしてはならない。[AST.GetName]が[ENG.GetNameDef]のために戦うなら、[ENG.GetNameDef]もまた[AST.GetName]のために戦うことになる。"
 AST_northern_advancement: "北方進出"
 AST_northern_advancement_desc: "オーストラリアは内政問題に目を向けたいところだが、我々自身が脅威とならない限り、外国の干渉がなくなることは期待できないだろう。[INS.GetNameDefCap]は我が国と似た立場の国家——すなわち、この地域に居座り続ける、ヨーロッパから来た侵略者の被害国である。我々がこの領土の領有権を主張すれば、それは「太平洋諸国に手を出すな」という明確な意思表示になるだろう。"
 AST_soothing_australian_fears: "オーストラリアの不安を和らげる"
 AST_soothing_australian_fears_desc: "一部の政府高官はオーストラリアと日本は協力できると信じているが、オーストラリア国民はそう思っていない。長きにわたって日本の侵攻を恐れてきた後で、潜在的な侵略者と手を結ぶという考えは多くの者にとって理解しがたいものだ。そこで、我々は彼らの恐怖を和らげることにした。戦争の準備を整えよう。"
 AST_soothing_australian_fears_tt: "\n§Y180§!日経過後:"
 AST_dividing_the_pacific: "太平洋の分割"
 AST_dividing_the_pacific_desc: "オーストラリア・ファーストは[JAP.GetNameDef]との平和を主張している。大半のオーストラリア国民とは異なり、常に立ちはだかる脅威ではなく太平洋における潜在的な同盟国だと定義している。[AST.GetName]の国力が増大するにつれ、[JAP.GetName]もこれに同意するのが当然であり、両国間の紛争のタネは発生前に解決されるべきである。"
 AST_dividing_the_pacific_ast_gain_tt: "[GET_AST_DIVIDING_THE_PACIFIC_AST_GAIN]"
 AST_dividing_the_pacific_jap_gain_tt: "[GET_AST_DIVIDING_THE_PACIFIC_JAP_GAIN]"
 AST_dividing_the_pacific_tt1: "§G我々は以下を獲得§!:"
 AST_dividing_the_pacific_tt2: "§R彼らは以下を獲得§!:"
 AST_dividing_the_pacific_tt3: "§Y[AST.GetName]§!は支配下にある以下の領土を譲渡する:"
 AST_against_war_and_fascism: "戦争とファシズムへの抵抗"
 AST_against_war_and_fascism_desc: "「反戦・反ファシズム運動」はコミンテルンの支援を受けた国際的活動のオーストラリア支部であり、反動主義勢力に対抗して労働者を動員することを目的としている。近年その勢いは失われているものの、その旗を再び掲げて前進することは我々の責務である。"
 AST_world_peace: "世界平和"
 AST_world_peace_desc: "「反戦・反ファシズム運動」は『世界平和』という名の雑誌の制作に精力的に取り組んでいる。この雑誌は特にスペイン内戦期のドイツおよびイタリアにおけるファシスト運動の悪事を暴露している。そこに書かれた記事に触発され、義勇兵たちは意欲的にファシズムとの闘争への参加を希望している。"
 AST_red_fred: "レッド・フレッド"
 AST_red_fred_desc: "「レッド」ことフレッド・パターソンが共産主義運動の中で初めて注目されたのは、1934年のブリスベン市長選に立候補したときのことであったが、選挙は大敗に終わった。しかし、彼の野心は今なお衰えておらず、現在はタウンズビルの市会議員選に立候補している。我々の支援があれば、彼は公職に就く初めての共産主義者になるかもしれない。"
 AST_workers_defence_corps_sparks_anew: "労働者防衛隊の再始動"
 AST_workers_defence_corps_sparks_anew_desc: "労働者防衛隊は元々ピケラインとストライキを防衛するために結成された。ニューガードのような集団からの攻撃が激しさを増すなか、労働者防衛隊はより良い権利と機会を求めて抗議する者たちの盾として活動すべく再編成された。"
 AST_a_controversial_recruitment: "物議を醸す徴募"
 AST_a_controversial_recruitment_desc: "モーリス・ブラックバーンは著名な社会主義系弁護士で、抑圧的な雇用主に対する法廷闘争において、労働者の権利を擁護することで知られている。労働党の一員だが、より急進的な「反戦・反ファシズム運動」との関係により、その忠誠心には疑いの目が向けられている。"
 AST_from_picket_line_to_front_line: "ピケ線から前線へ"
 AST_from_picket_line_to_front_line_desc: "労働者階級の解放に反対する者たちの脅迫的な戦術がますます攻撃的になっているため、我々自身の防衛もこれに応じて進化しなければならない。事件が起こるたびに労働者たちの決意はより強固なものとなり、防衛隊への参加希望者は増えている。"
 AST_pig_iron_protests: "銑鉄抗議運動"
 AST_pig_iron_protests_desc: "我々の港湾労働者は多くの点で政府に同意しておらず、とりわけ戦争中の国へ銑鉄を売ることには反対している。オーストラリア人は侵略に加担することにも、無辜の民間人に対して使用される装備を輸送することにも関心はない。であれば、[AST.GetName]もそうあるべきだ。ストライキを呼びかけよう。"
 AST_part_with_colonizer: "宗主国との決別"
 AST_part_with_colonizer_desc: "我々の闘争のルーツは大英帝国と、連中が遠方から押し付けてきた資本主義体制にある。しかし、この関係もここまでだ。イギリスが本国近くの危機に気を取られている今こそ、我々の運命をつかみ取り、自由で独立した国家として自らの進路を描く時である。"
 AST_take_it_to_the_streets: "街頭へ打って出る"
 AST_take_it_to_the_streets_desc: "労働争議は、我々が社会に変革を強いるための極めて強力な手段であり、搾取のためだけに設計された体制に対してこれを行使しなければならない。今こそ生産手段を取り戻す時である。オーストラリアの労働者よ、団結するのだ！"
 AST_workers_educational_association: "労働者教育協会"
 AST_workers_educational_association_desc: "労働者教育協会は労働者への教育機会の提供を目的とした国際組織であり、我々は独自の支部を設立すべきである。真の機会の平等は教室から始まる。"
 AST_off_leash: "束縛から解き放たれて"
 AST_off_leash_desc: "港湾労働者はオーストラリアにおける労働組合活動の中核をなす。大陸規模の島国のため、海上労働が経済において極めて重要な役割を果たしているのは当然のことだ。今こそ拘束を取り除き、産業の船乗りたちを解き放つ時である。"
 AST_a_national_housing_commission: "国家住宅委員会"
 AST_a_national_housing_commission_desc: "住宅供給は長きにわたって論争の種であった。誰もが雨風をしのぐ権利を有しているが、この基本的な必需品はあまりにも頻繁に労働者を苦しめ、その費用は経済的抑圧のいち形態となっている。しかし、そんな時代はもう終わりだ。我々はすべての者が公平に利用できる住宅を要求する。"
 AST_guaranteed_employment: "雇用保障"
 AST_guaranteed_employment_desc: "社会主義はあまりにも頻繁に、怠惰や依存といった困窮者への非難とともに退けられている。この状況を終わらせなければならない。我々が求めているのは労働における公正な機会と、家族を養えるだけの公正な賃金だけである。"
 AST_equal_pay: "同一賃金"
 AST_equal_pay_desc: "生産手段を所有する者はそこで働く労働者よりも多くを受け取るに値する。それは今も根強い誤謬である。所有者や管理者がより過酷な労働に従事しているわけでもなく、多くの技術を生まれ持っているわけでもない。賃金を平等化することによって、社会全体で労働の成果をもっと公平に分配することができる。"
 AST_all_for_one_one_for_all: "一人はみんなのために、みんなは一人のために"
 AST_all_for_one_one_for_all_desc: "「みんなは一人のために、私にはもっと多く」は長きにわたってブルジョワ結集のスローガンである。り、やつらの強欲により、要求は増えていくばかりだが、還元されるものはますます少なっている。富が下に流れるというのは嘘であり、平等に分割しなければならない。みんながみんなのために。"
 AST_abolition_of_private_property: "私有財産の廃止"
 AST_abolition_of_private_property_desc: "産業の歯車の潤滑油は労働者の血である。我々は富の蓄積という残虐な行為に終止符を打ち、私有財産を完全に廃止しなければならない。あらゆるものが共有され、各々は能力に応じて拠出し、必要性に応じて受け取ることになる。"
 AST_centralized_production: "生産の集中化"
 AST_centralized_production_desc: "市場原理は混沌としており不平等なものだ。真に公平な社会を築きたければ、国家は何を誰がどこで生産するかを決定する中心的役割を担わなければならない。我が国の官僚は詳細な記録を保持しており、生産目標を定めるのに最適な立場にある。"
 AST_public_institutions: "公的機関"
 AST_public_institutions_desc: "社会が機能するためには、医療や住宅から保育や交通にいたるまで、数多くの不可欠なサービスを必要としている。国家はこれらを普遍的に提供し、すべての者が制限なく利用できるようにしなければならない。私的な富の形成という命題から解放されたこれらの制度は、国民全体の必要に応えるために効率良く運用することができる。"
 AST_planned_extraction: "計画的採掘"
 AST_planned_extraction_desc: "我々がこれほどまでに資源の豊かな土地を所有しているのは幸運なことである。この富を体系的に採掘し、それを最も必要とする産業に振り向けられるようにしなければならない。"
 AST_maritime_commission: "$USA_maritime_commission$"
 AST_maritime_commission_desc: "$USA_maritime_commission_desc$"
 AST_state_research_funding: "国家研究助成"
 AST_state_research_funding_desc: "我が国の研究機関の成果を最大化するためには、国家が主たる資金源となり、最も必要とされる分野に研究活動を集中させ、厳格な情報統制を確保する必要がある誤った考えによって人民が悩む事態は、何としてでも避けなければならない。"
 AST_graziers_to_industry: "牧畜業から工業へ"
 AST_graziers_to_industry_desc: "大恐慌の間、労働者は安定を求めて農村部へと移動し、都市は空洞化した。生産手段を掌握した今、我々は彼らを産業に呼び戻すことができる。彼らには国家が必要とするものを強く認識してもらわなければならない。産業の炉は、人間の汗で動くのだということを。"
 AST_free_school_policy: "無償教育政策"
 AST_free_school_policy_desc: "模範的な人民は模範的な思想によって形作られる。生まれてから大学に入るまで、子どもたちが何を教わるのかは国家が導く。そうすることで、未来の世代に社会主義的理想の重要性を理解させるとともに、自由市場、ひいては自由な思想の危険性を理解させることができる。"
 AST_free_healthcare_policy: "無償医療政策"
 AST_free_healthcare_policy_desc: "我らが人民は病気とケガから解放される権利を持つ。万が一のことが起こっても、他の社会で見られるような不遇による困窮はあってはならない。我々は医療、病院、医師への普遍的なアクセスを提供する。なぜならば、健康な人民こそが生産的な人民だからである。"
 AST_the_publics_australia: "人民のオーストラリア"
 AST_the_publics_australia_desc: "我々は旧来の秩序を投げ捨て、一握りの者ではなく、多くの者のために存在する国家を樹立した。産業、労働、資源は今や人民全体に奉仕する。これが人民のオーストラリアである。平等で、団結し、決して打ち砕くことはできない。"
 # 'Cominwealth' over 'Commonwealth' is intentional
 AST_the_australian_commonwealth: "オーストラリア共産連邦"
 AST_the_australian_commonwealth_desc: "かつてイギリスは連邦の指導者としての地位を主張していたが、その構想は資本主義の権益によって堕落してしまった。我々がこの役割を引き継ぎ、連邦諸国を共有された社会主義の理想郷に導く。"
 AST_union_control_commonwealth: "§Y「労働組合の統制」§!のディシジョンをアンロック。\nニュージーランド、マレーシア、ビルマ、最終的にはインドへの共産主義者の潜入を可能とする。"
 AST_a_comrade_emancipated: "解放された同志"
 AST_a_comrade_emancipated_desc: "世界中には今なお資本主義の鎖に縛られ、人民の真の自由が奪われている国家が数多く存在する。自由な社会主義国家として、彼らの解放を支援するのが我々の義務である。世界の労働者よ、団結せよ。さすればともに鎖を断ち切ることができるだろう。"
 AST_union_control_local: "§Y「労働組合の統制」§!のディシジョンをアンロック。\nインドネシアとフィリピンへの共産主義者の潜入を可能とする。"
 AST_comintern: "コミンテルンへの加盟"
 AST_comintern_desc: "ソビエト連邦は時として真のマルクス主義から外れることもあったが、依然として労働者インターナショナルの旗手である。コミンテルンに加盟することで、我々は社会主義の精神を世界中に伝えるための努力を結集することができる。"
 AST_comintern_tt: "§Y[AST.GetName]§!が陣営の盟主の場合、その陣営はコミンテルンに統合される。それ以外の場合、§Y[AST.GetName]§!は単独でコミンテルンに加入する。"
 AST_for_greater_good: "より大きな善のために"
 AST_for_greater_good_desc: "世界革命という我々の構想は血と犠牲を必要とする。あまりにも多くの場所で社会主義の精神は息づいており、我々はその呼びかけに応じ、それが消えないように支援を送らなければならない。これは、より大きな善のためである。"
 AST_make_common_cause: "共闘する"
 AST_make_common_cause_desc: "我々の指導の下、連邦は資本主義的抑圧の闇から社会主義の光に導かれ、繁栄しはじめた。この重大な局面において、我々の意思が決して打ち砕かれることのないよう、より良き明日に向かってともに行進しなければならない。"
 AST_the_red_pacific: "赤い太平洋"
 AST_the_red_pacific_desc: "太平洋を革命の精神に基づき作り変えなければならない。我々が社会主義政府の台頭を支援することにより、この地域の島々と沿岸部の全域にわたって、岸から岸に赤い旗がたなびくことになる。"
 AST_the_irish_anti-britain_pact: "アイルランド反英協定"
 AST_the_irish_anti-britain_pact_desc: "イギリスは島国としての地理的優位性と海軍力に守られ、あまりにも長きにわたって資本主義の要塞として君臨してきた。アイルランドおよび北アイルランドの港湾労働者の間で騒乱を扇動することにより、防衛を突破し、我が軍がアイリッシュ海を越えるための道を切り開くことができる。"
 AST_stretch_the_fleet: "艦隊の拡張"
 AST_stretch_the_fleet_desc: "イギリスはその強大な艦隊に守られ、今なお資本主義の要塞として君臨している。我々の海軍力を拡張し、彼らに戦いを挑み、どちらの島がより大きいのかを世界に示す時である。"
 AST_chinese_relations: "中国との関係"
 AST_chinese_relations_desc: "中国の同志たちはまさに生存のために戦っている。支援する手段はあるが、包囲する帝国主義勢力が彼らを圧倒する前に、迅速に行動しなければならない。"
 AST_westward_battles: "西方の戦い"
 AST_westward_battles_desc: "ファシスト勢力は西方を支配しており、我々の存続基盤そのものを脅かしている。現在コミンテルンと同盟中の我々は彼らに戦いを挑み、我々が築き上げている労働者の理想郷を破壊しようとする者に立ち向かわなければならない。"
 AST_strongholds: "要塞"
 AST_strongholds_desc: "この新たな戦域で我々の地位を確保するため、帝国主義的資本主義の中枢に挑むアイルランドの同志を支援しなければならない。彼らのかつての独立闘争は、我々がともに世界的紛争の次の段階に備える上で貴重な教訓を提供してくれる。"
 AST_out_of_the_den: "巣穴を出る"
 AST_out_of_the_den_desc: "アイルランドにはイギリスの統治に対していまだに深い憤りを抱いている者が多い。今こそ我々の力を示し、彼らを闇から引き出し、共通の敵に立ち向かうべく我々の大義の下に結集させる時である。"
 AST_end_the_kingdom: "王国の終焉"
 AST_end_the_kingdom_desc: "時は来た。帝国主義的資本主義の根源はその腐敗した心臓を貫かれるだろう。大英帝国全土における労働者の解放は目前に迫っている。君主制を終わらせ、王国を終わらせよ。抑圧を終わらせるために、連邦の労働者たちよ、団結するのだ！"
 AST_red_solidarity: "赤き連帯"
 AST_red_solidarity_desc: "中国における闘争が激化し、数百万の人々が苦しみ、命を落としている。彼らの戦いは我々の戦いでもあり、これを傍観するわけにはいかない。我々は革命の炎が揺らぐことのないよう、これに介入し、負担を分かち合うことができる。"
 AST_red_solidarity_tt: "§Y[AST.GetName]§!が§Y[PRC.GetNameDef]§!による§Y[CHI.GetNameDef]§!との戦争に参加する。小規模な陣営がもう一方を吸収する。すでに両者が同盟関係にある場合は、§Y[AST.GetName]§!が直接参戦する。"
 AST_free_the_colonies: "植民地の解放"
 AST_free_the_colonies_desc: "革命の炎は崩壊しつつある大英帝国を焼き尽くす。かつての植民地は自由な国家となる。立ち上がれ、同志よ！拘束を打ち捨て、革命に参加するのだ！"
 AST_free_the_colonies_tt: "§Y[AST.GetName]§!は支配下にある旧イギリス植民地をすべて統合傀儡国に格下げする。"
 AST_battle_of_the_ocean: "大洋の戦い"
 AST_battle_of_the_ocean_desc: "大洋は長きにわたって世界貿易の動脈として機能してきた。今こそ戦いを太平洋に持ち込み、これに依存している仕組みを断ち切る時である。腐敗した資本家と革命の英雄たち双方の血によって大洋は赤く染まるだろう。"
 AST_borderless_solidarity: "国境なき連帯"
 AST_borderless_solidarity_desc: "連帯。それは世界の労働者を結び付ける言葉である。いかなる国境も我々を分断することはできず、いかなる国家も単独では立ち行かない。闘争が燃え上がる場所ならどこであれ、我々は呼びかけに応え、解放を巡る世界的闘争にともに立ち向かう。"
 AST_an_equal_union: "平等な連合"
 AST_an_equal_union_desc: "我々は革命の旗を掲げているが、参加する者はすべて平等な存在である。この連合では資源、労働、思想が自由に共有され、我々が築く未来においては、繁栄は集団的なものとなり、いかなる国家も我々の上に立つことはない。"
 AST_expanding_influence: "影響力の拡大"
 AST_expanding_influence_desc: "歴史の正しい側に立つ我々の思想は、それ自体が雄弁に物を語る。労働者の楽園を作るという約束は夢ではなく、現実のものとして進行中である。我々はこの構想を外部に広げ、他者を招き入れ、共通された未来をともに築くことができる。"
 AST_public_works: "公共事業"
 AST_public_works_desc: "大恐慌はオーストラリア経済を窮地に陥れた。我々は一連の公共事業計画に着手し、雇用と消費の回復を目指す。"
 AST_lang_plan: "ラング計画"
 AST_lang_plan_desc: "ジャック・ラングは外国債務の履行を公然と拒否し、その資金を国内成長を刺激する公共事業に振り向けたことにより、経済政策の最前線に躍り出た。結局、ない袖は振れないということだ。"
 AST_exports_for_economic_recovery: "輸出による経済回復"
 AST_exports_for_economic_recovery_desc: "ラングの考えに反対する者たちは、むしろ海外市場と債務を活用し、海外投資と販売を促進し、輸出志向経済に振り切ることを提案している。これにより、国内生産と雇用を促進し、ひいては消費支出を増加させるのが狙いである。"
 AST_the_phosphate_commision: "リン酸塩委員会"
 AST_the_phosphate_commision_desc: "先の大戦後、ナウルはオーストラリア、ニュージーランド、イギリスの共同信託統治下に置かれた。1919年には島内すべてのリン酸塩の販売権が、オーストラリアが主導する信託統治国に譲渡された。我々は主導的な立場を利用し、価格設定に影響を与え、国内市場向けに高い競争力のある価格を確保することができる。"
 AST_goods_standard: "物資本位制"
 AST_goods_standard_desc: "ジャック・ラングの経済理論の中核にあるのが、オーストラリアにおける金本位制の廃止と、これに代わる物本位制の導入である。これは、通貨の供給量と商品の生産量を連動させる仕組みであり、資本の流れが対外要因ではなく国内の生産性に結びつくことになる。"
 AST_standard_gauge_line_to_darwin: "ダーウィンへの標準軌鉄道"
 AST_standard_gauge_line_to_darwin_desc: "我々は長きにわたり、北部領土との適切な連絡を怠ってきた。経済に資金を還流させることを目的とした広範な公共事業計画の一環として、南部の都市と北部を結ぶ鉄道を建設することができる。"
 AST_lang_is_right: "ラングは正しい"
 AST_lang_is_right_desc: "なるほど、ラングは正しかったようだ！外国の債権者を優先することを拒み、代わりに我々自身の銀行制度をより積極的に活用することで、相当な資金を解放することができる。これらの資金は国内経済へと振り向けられ、必要な投資を提供し、成長を刺激することになる。"
 AST_within_reach: "手の届くところに"
 AST_within_reach_desc: "惜しいところまで来ているが、まだ届かない。オーストラリアは極めて資源が豊富な国家であり、もう少しだけ深く掘り進めれば、計り知れない富が我々の足元に眠っている。インフラの拡張により、遠隔地の鉱山でさえ開発可能になり、我々は鉱物資源主導でオーストラリアが繁栄する時代の目前にいる！"
 AST_a_domestic_supply_chain: "国内供給網"
 AST_a_domestic_supply_chain_desc: "我々が国内経済に重点を置いたことによる副次的効果の一つが、極めて強靭な生産体制の発展である。生産のあらゆる段階が国内に基盤を置くことにより、外部の衝撃からは大きく隔離されている。"
 AST_broken_hill_propietary_company: "ブロークン・ヒル・プロプライエタリー社"
 AST_broken_hill_propietary_company_desc: "ブロークン・ヒル・プロプライエタリー社は、オーストラリアにおける主要な鉱業および鉄鋼生産企業の一つである。地元では「ビッグ・オーストラリアン」と呼ばれており、この産業を支配している。原材料需要の劇的な増加により、同社はさらなる急速な成長に備えている。"
 AST_radium_hill: "ラジウム・ヒル"
 AST_radium_hill_desc: "南オーストラリアでウランが発見され、ラジウム・ヒル鉱山は大幅な拡張の可能性を秘めている。これらの新興技術の可能性の全容は明らかになっていないが、我々が原子力時代の入り口に立っていることは明らかで、これが我々の参入の第一歩になる可能性がある。"
 AST_industrial_expansion: "産業の拡大"
 AST_industrial_expansion_desc: "大恐慌により、過去10年の大半にわたり、我が国の経済生産は麻痺してきた。今や我々にはより直接的な行動を取るという政治的意思があり、それを産業基盤の大胆な拡大に向けるべきである。これにより、雇用を創出し、資源需要を拡大し、より多くの商品を市場に提供できるようになる。"
 AST_income_tax_assessment_act: "所得税査定法"
 AST_income_tax_assessment_act_desc: "我々の課税制度は極めて劣悪な状態にあり、国民にとって把握しにくく、極めて実施負担の重い、政府による厳格な監督を伴うものである。関連規定を抜本的に見直し合理化することで、徴税を大幅に効率化できる。"
 AST_council_for_scientific_and_industrial_research: "科学産業研究評議会"
 AST_council_for_scientific_and_industrial_research_desc: "科学産業研究評議会は1923年の帝国会議を受け、各植民地および自治領の経済基盤を拡大するために強化された。その貢献は大きいものであったが、この機関には新たな目標を与えるタイミングである。すなわち、製造業と第二次産業の開発である。"
 AST_bring_home_the_farmers: "農民を呼び戻す"
 AST_bring_home_the_farmers_desc: "大恐慌の間は労働者が農業労働を求めて農村に移動したため、主要都市は深刻な人口減少に見舞われた。現在は状況が改善し始めており、労働者の復帰に動機づけを行い、工場を再稼働させて生産再開すべきである。"
 AST_reverse_wage_cuts: "賃下げの撤回"
 AST_reverse_wage_cuts_desc: "これまでは企業に生き残るチャンスを与えるため、経済全体にわたる一連の賃金カットを実施してきた。現在、回復の兆しが見える以上は方針転換すべきである。賃金の上昇は購買力の増大につながり、消費と経済成長を促すのに役立つ。"
 AST_the_manpower_directorate: "労働力局"
 AST_the_manpower_directorate_desc: "経済がますます複雑化するにつれ、人的資源に関する課題も増えている。この機関は適切な人材が適切な役割に適切な技術を備えた状態で適切な時期に配置されることを確実なものとする。"
 AST_recovery: "回復"
 AST_recovery_desc: "国内総生産が初めて大恐慌前の水準を上回った。これは祝福すべき瞬間であり、今や我が国の経済の進路は上昇以外にない。我々は力強い成長の時代に入りつつあり、再び得られた繁栄の果実を享受する時である。"
 AST_devalued_currency: "通貨切り下げ"
 AST_devalued_currency_desc: "輸出額を増やす最も効果的な方法の一つが通貨を弱くすることである。もし外国の買い手が自国の通貨が強いことにより我々からより多くの商品を購入することができれば、我々は国際的にさらに競争力が上がる。しかし、これは諸刃の剣でもあり、他国からの輸入品もより高額になる。"
 AST_reverse_industry_tariffs: "産業関税の撤回"
 AST_reverse_industry_tariffs_desc: "これまで我々は関税によって国内産業を外国との競争から保護してきた。しかし、これは貿易戦争や我々の輸出品に対する報復関税を招き、価格上昇を引き起こしてきた。我々はこのような障壁を削減し、相互引き下げを奨励することで、貿易の拡大に努めるべきである。"
 AST_foreign_competition: "外国との競争"
 AST_foreign_competition_desc: "事業にとって競争は有益なものである。それは革新と効率化を促進し、慢心を排除してくれる。外の世界は弱肉強食なので、我々は自国の企業が最も強い存在であり、なおかつ規制などを取り払って自由に戦える状態にしておく必要がある。"
 AST_expanding_into_new_markets: "新市場への進出"
 AST_expanding_into_new_markets_desc: "国内市場に依存するよりも、海外市場を頼りにする方が有利なことは明白だ。国際市場は広大で、常に新たに開拓可能な市場が存在する。我々がやるべきことは、自らの強みを理解し、オーストラリアの製品およびビジネス慣習の優位性を示すだけで良いのだ。"
 AST_populate_or_perish: "人口増加か、さもなくば滅亡か"
 AST_populate_or_perish_desc: "大恐慌の発生時には出生率が急速に低下し、それ以来回復に苦しんできた。国内の継続的な発展のために、連邦移住省を設立し、新たな移民計画を実施・監督する。"
 AST_recruitment_drive: "徴募運動"
 AST_recruitment_drive_desc: "歴代政権の意志の弱さと、イギリスへの過度の依存は、長きにわたるオーストラリア軍の軽視を招いてきた。もはやこの状況を容認することはできず、我々はオーストラリア国防軍への徴兵を推進するための運動を開始する。"
 AST_new_deal: "ニューディール"
 AST_new_deal_desc: "[AST.GetName]の150周年記念式典で行われた抗議活動は、我が国の先住民関連法に再検討が必要なことを明らかにした。先住民の権利を支持する活動家の要請を受け、我々は彼らと面会し、先住民の完全な市民権獲得に向けた道筋をともに決定する。"
 AST_the_1938_sesquicentenary_flag: "イベント§Y「1938年の150周年記念式典」§!が発生した。"
 AST_the_1938_sesquicentenary_tt: "分岐ツリー§Y「人口増加か、さもなくば滅亡か」§!内の国家方針§Y「ニューディール」§!が選択可能になる。"
 AST_repeal_immigration_restrictions: "移民制限の撤廃"
 AST_repeal_immigration_restrictions_desc: "移住省は、誰が[AST.GetName]への移住を許可されるかを規定した時代遅れな法律の制約を受けている。論争を引き起こす危険性はあるが、これらの法律を廃止し、その代わりに移民の流入を統制する割当制度を確立する。"
 AST_womens_armed_services: "女性の軍務"
 AST_womens_armed_services_desc: "激しい反対にもかかわらず、女性軍務の創設が進められる。侵略者から[AST.GetName]を防衛するためには、性別を問わずあらゆる助力が歓迎されるべきである。徴兵および訓練を促進するために、軍の指導者の選定が極めて重要になる。"
 AST_northern_territory_reconnaissance_unit: "北部準州偵察隊"
 AST_northern_territory_reconnaissance_unit_desc: "空軍大尉であり人類学者でもあるドナルド・トムソンは、[AST.GetName]の軍務に先住民の人々を加えるべきだと主張してきたが、ついにこれが採用される。我々はトムソン自身に、現地の知識とブッシュクラフト技能を有する兵士による偵察部隊の編成を命じる。その任務は、我々の領土の中でもとりわけ過酷な僻地の監視だ。"
 AST_northern_territory_reconnaissance_unit_tt: "支援中隊§Y「北部準州偵察隊」§!をアンロック。"
 AST_torres_strait_battalion: "トレス海峡大隊"
 AST_torres_strait_battalion_desc: "トレス海峡中隊の駐屯部隊としての取り組みは適切に管理されてきたが、所属する兵士たちは潜在的に他の技能を有している。[AST.GetName]北岸沖の島々で生まれ育った兵士で構成されるこの部隊は、トレス海峡に関する広範な知識を有している。彼らを海兵隊として訓練し、大隊を編成するためにさらなる志願兵を募る。"
 AST_department_of_aboriginal_affairs: "先住民問題省"
 AST_department_of_aboriginal_affairs_desc: "先住民の権利を支持する活動家団体の提案を受け、新たに先住民問題省を設立する。同省は先住民の血を引く者たちからなる委員会の助言を受け、先住民の人々向けに適切な食糧と医療援助を確保することを目的としている。"
 AST_immediate_rights: "即時の権利付与"
 AST_immediate_rights_desc: "[AST.GetName]ではいかなる者も連邦の規制を受けず、いかなる出自も市民権の付与を制限することはない。我々独自の市民権法を制定し、我が国の住民はイギリス臣民に過ぎないという考えから脱却することにより、オーストラリア人の権利はもはや条件付きではなくなる。"
 AST_diverse_army: "多様な軍隊"
 AST_diverse_army_desc: "祖国を防衛する行為は特権であるだけでなく、権利でもある。志のあるすべてのオーストラリア人は入隊する資格があり、野心のあるすべての兵士は階級を上げられる。"
 ### RIGHT VS LEFT CAMPAIGN ###
 AST_bg_empty_text_tt: "民主主義政党間で得票数を調整し、政党別の国家方針群をアンロックする。\n\n国家方針§Y$AST_war_is_coming$§!を完了するとアンロックされる。"
 AST_right_vs_left_campaign_title_text: "民主的選挙"
