 # Alternative Communist Focus
 SIA_the_peoples_war_in_asia: "アジアにおける人民戦争"
 SIA_the_peoples_war_in_asia_desc: "[JAP.GetAdjective]の帝国主義に対する闘争は、単なる国家間の争いではない。労働者、農民、兵士が外国からの支配に立ち向かう戦争である。中国の共産主義勢力と共に立つことで、[ROOT.GetNameDef]はアジア全域に広がる、より大きな人民戦争に身を投じる。"
 SIA_peoples_war_in_asia_idea: "アジアにおける人民戦争"
 SIA_peoples_war_in_asia_idea_desc: "戦争を支えているのは正規部隊だけではない。地方委員会、パルチザンの案内人、農民の補給隊が、今や前線の軍を支えている。あらゆる村が補給拠点となり、あらゆる道が待ち伏せの場となり、あらゆる撤退が敵をさらに内陸へ誘い込む機会となる。"
 # Alternative Nationalist Focus
 SIA_national_defense_in_asia: "アジアにおける国防"
 SIA_national_defense_in_asia_desc: "アジアの防衛には、規律、階層、そして共通の戦略目的が必要である。中国の国民政府と共に立つことで、[ROOT.GetNameDef]は組織された軍隊と連携の取れた指揮の下、[JAP.GetAdjective]の拡大に抵抗することを決意した連合に加わる。"
 SIA_national_defense_in_asia_tt: "§Y[ROOT.GetNameWithFlag]§!は統一戦線の国民党勢力と協調する。\n§Y$SIA_national_defense_in_asia_idea$§!が追加され、以下を付与する:\n $MODIFIER_ARMY_ORG_FACTOR$: §G+5%§!\n $MODIFIER_PLANNING_SPEED$: §G+10%§!\n $MODIFIER_MAX_PLANNING$: §G+10%§!\n $MODIFIERS_ARMY_DEFENCE_FACTOR$: §G+5%§!"
 SIA_stronger_together: "団結すればより強く"
 SIA_stronger_together_desc: "戦争により、遠い約束や並立する同盟は、もはや障害に近いものとなった。[ROOT.GetNameDef]がアジアの行方を形作るのであれば、我々は協力相手に対し、彼らの陣営を我々の陣営に結び付け、来る闘争において単一の指揮系統を受け入れるよう求めなければならない。"
 idea_SIA_national_defense_in_asia: "アジアにおける国防"
 SIA_directorate_of_aeronautical_engineering_desc: "[ROOT.GetNameDef]の航空戦力の未来は、パイロットだけで確保できるものではない。技術者、検査官、工場、そして外国から購入した機材を実用可能な航空機へと転換できる中央機関が必要である。航空工学局は、この取り組みの基盤となるだろう。"
 idea_SIA_aeronautical_engineering_directorate: "航空工学局"
 SIA_standardize_aircraft_maintenance: "航空機整備の標準化"
 SIA_standardize_aircraft_maintenance_desc: "我々の航空機は多様な供給元からもたらされており、それぞれ部品、工具、修理慣行が異なっている。航空工学局の下で整備手順を標準化することにより、[ROOT.GetNameDef]はより多くの航空機を飛行可能な状態に保ち、地上での混乱による無駄を減らすことができる。"
 SIA_expand_aircraft_workshops: "航空機工場の拡張"
 SIA_expand_aircraft_workshops_desc: "航空工学局に必要なのは、事務所や検査書類だけではない。新たな工場、工作機械、訓練を受けた整備士があれば、損傷した航空機を国内で修理でき、簡単な部品なら外国からの供給を待たずに製造できる。"
 SIA_license_modern_airframes: "近代的な機体のライセンス生産"
 SIA_license_modern_airframes_desc: "[ROOT.GetNameDefCap]は、必要とするすべての航空機をまだ自力で設計できるわけではない。より現実的なのは、航空工学局の監督の下で外国の機体をライセンス生産し、その構造を研究して、我々の気候、飛行場、補給条件に適合させることである。"
 SIA_tropical_air_operations: "熱帯における航空作戦"
 SIA_tropical_air_operations_desc: "高温、多湿、モンスーンの雨、そして荒れた前線飛行場は、航空機と搭乗員に独自の負担を課す。エンジン、整備計画、パイロットのドクトリンをこうした環境に適応させることで、航空工学局は東南アジア上空における我が空軍の信頼性を高められる。"
