 idea_SIA_weather_broadcasts: "気象放送"
 idea_SIA_weather_broadcasts_desc: "定期的な気象放送により、空海軍は気象条件をより明確に把握できるようになり、悪天候下での作戦リスクを抑えつつ、より効果的に行動できる。"
 idea_SIA_seri_thai_contacts: "セリタイとの接触"
 idea_SIA_seri_thai_contacts_desc: "セリ・タイのレジスタンスネットワークとの接触は成果を上げつつあり、経験豊富な戦闘員を呼び込み、連合国との結び付きを強めている。"
