 INSHOL_foundations_of_defense_desc: "$HOL_the_foundations_of_defense_desc$"
 INSHOL_investments_in_civ_railways_tt: "この国家方針を[HOL.GetFlag]§Y[HOL.GetName]§!が達成した場合:\n         （[INS.GetFlag]§Y[INS.GetName]§!: §Y£autonomy_texticon -250.00§!）\n   この国家方針を[INS.GetFlag]§Y[INS.GetName]§!が達成した場合:\n         §Y£autonomy_texticon 250.00§!"
 INSHOL_investments_in_civ_railways: "民間鉄道への投資"
 INSHOL_investments_in_civ_railways_desc: "東インドの人民の支持を得るには民間インフラへの投資が必要だ。現在、我々の鉄道は主に貨物輸送に使用されている。ジャワ島およびスマトラ島の既存線路で運行させるための旅客列車を購入すべきである。"
 INSHOL_continue_exclusive_rights: "ジャワ銀行への独占権付与"
 INSHOL_continue_exclusive_rights_desc: "東インドギルダーは大恐慌の間にその価値の大半を失い、我々の経済成長は停止している。ジャワ銀行に対し、同行が1922年まで保有していた紙幣発行の独占権を与えることでギルダーの安定化をはかることができる。"
 INSHOL_peg_indies_guilder_to_dutch_guilder: "オランダギルダーに対する東インドギルダーの相場を固定"
 INSHOL_peg_indies_guilder_to_dutch_guilder_desc: "東インドギルダーは大恐慌の間にその価値の大半を失い、我々の経済成長は停止している。最も容易な解決策は、東インドギルダーの相場をより安定した通貨であるオランダギルダーに固定することである。これにより、宗主国との結びつきをさらに強めることにもなる。"
 INSHOL_peg_indies_guilder_to_us_dollar: "米ドルに対する東インドギルダーの相場を固定"
 INSHOL_peg_indies_guilder_to_us_dollar_desc: "東インドギルダーは大恐慌の間にその価値の大半を失い、我々の経済成長は停止している。東インドギルダーの相場をオランダギルダーに固定することも可能だが、米ドルはもっと安定した通貨だ。ギルダーの相場を米ドルに固定することは経済的自立を強めることにもつながり、自治をより到達可能な目標に変える。"
 indonesia_currency_pegged_to_dollar_modifier: "インド領ギルダーの米ドル固定相場制"
 INS_direct_rule_tt: "インドネシアの藩王国において占領法§Y$INS_direct_rule_occupation_law$§!をアンロックする。\n効果:\n     州から得られる工場と資源の§G増加§!\n     迎合度増加率が§R低下§!\n     レジスタンス拡大率が§R上昇§!"
 INS_local_autonomy_tt: "インドネシアの藩王国において占領法§Y$INS_local_autonomy_occupation_law$§!をアンロックする。\n効果:\n     全体的に§Y小規模な§!強化を獲得\n     迎合度増加率が§G上昇§!"
 INS_invest_in_batavian_education_req_tt: "フォルクスラートの任務を§Y3つ§!以上成功させた"
 INS_invest_in_batavian_education_req_2_tt: "フォルクスラートの任務を§Y6つ§!以上成功させた"
 INSHOL_eventual_autonomy_req_tt: "フォルクスラートの任務を§Y4つ§!以上成功させた"
 indonesia_volksraad_passed_12: "インドネシア国旗の正式承認 "
 INS_stronghold_java_tt: "すべてのインドネシアの州: [ROOT.GetFlag][ROOT.GetNameDefCap]に占領されていない"
 INSHOL_request_east_timor: "東ティモールの返還を要求"
 INSHOL_request_east_timor_desc: "ポルトガルによるティモール占領には正当性がなく、インドネシアの正当な領土なので、植民地時代の名残として許容できるものではない。我々はポルトガルに対し、ティモールを直ちに返還するよう正式に要求する。"
 INS_resist_occupation: "占領への抵抗"
 INS_resist_occupation_desc: "多くのインドネシア人はオランダに対して怒りを抱いているが、だからといって、我々はファシズムに屈するわけにはいかない。日本の侵攻に抵抗するためあらゆる手を尽くし、祖国を防衛しなければならない。"
 INS_local_resistance: "現地のレジスタンス"
 INS_local_resistance_desc: "まだ占領されていない領土にレジスタンス組織を編成し、もしそこが占領されても適切な時期に奪還できるよう準備する。"
 INS_stronghold_java: "ジャワ要塞"
 INS_stronghold_java_desc: "東インドはたくさんの住民が暮らす広大な群島であり、その地形は極めて過酷である。我々よりもはるかに強大な軍に対して、すべての島、密林、山岳地帯を残らず防衛しようとしても必ず失敗する。同胞を見捨てるのは容易ではないが、ジャワ島以外のすべての島から撤退し、すべての軍をジャワ島に集結させることは、国家全体として最善の選択となる可能性がある。"
 INS_silence_nationalists: "民族主義の支持者を鎮圧する"
 INS_silence_nationalists_desc: "日本の侵攻により、革命的な民族主義運動がオランダという共通の敵を理由に日本の侵攻を支持し始める事態となっている。この侵攻によって生じた不安定さは、かつてない速度で運動を拡大させている。すぐに何らかの対処をしなければ、完全に制御不能になる可能性がある。"
 INS_east_indies_exile_government: "東インド亡命政府"
 INS_east_indies_exile_government_desc: "悲しいことに、最大限の努力を尽くしたにもかかわらず、東インドは陥落した。しかし、まだ希望を失ってはならない。限られた資源の中で、できる限りの行動を続けなければならない。我々は戦いに敗れたかもしれないが、まだ戦争には敗れていない。"
 INS_establish_nefis: "NEFISの設立"
 INS_establish_nefis_desc: "我々は連合国とともにオランダ領東インド軍情報局（NEFIS）を設立し、これをオーストラリアに駐留させる。これにより、日本の占領軍を妨害するために秘密作戦を実行することが可能となる。小さな勝利の積み重ねを通じて、我々は祖国への帰還に近づいていく。"
 INS_evacuate_soldiers_to_australia: "オーストラリアへの兵士の避難"
 INS_evacuate_soldiers_to_australia_desc: "オーストラリア北部のNEFIS基地付近に軍事基地を建設し、占領された際に捕虜になることを免れた王立オランダ領東インド陸軍の兵士を駐留させ、戦闘を継続できるようにする。"
 INS_australian_weapons: "オーストラリア製の武器"
 INS_australian_weapons_desc: "秘密作戦の遂行は簡単なことではなく、成功させるには適切な装備が必要となる。オーストラリアの工場とライセンス契約を結び、NEFISのための武器を製造できるようにする。"
 INS_defenders_of_homeland: "郷土防衛義勇軍"
 INS_defenders_of_homeland_tt: "この国家方針は郷土防衛義勇軍が設立されると自動的に完了する。"
 INS_resist_occupation_tt: "この国家方針は我々が侵略を受け、かつ降伏しなかった場合、自動的に完了する。"
 INS_defenders_of_homeland_desc: "東インド政府が陥落し、新たな政権が樹立された。民族主義者および日本政府の指導の下、我々は王立オランダ領東インド陸軍より優れた新たな軍を創設し、戦争に勝利する。しかし、民族主義者と帝国主義者の同盟が脆弱であることは否定できない。この同盟は存続するのか？それとも流血の結末を迎えるのか？"
 INS_embrace_co_prosp_sphere: "共栄圏を受け入れる"
 INS_embrace_co_prosp_sphere_desc: "我々はついにオランダの統治を終わらせた。宗主国が一つから別のものに替わっただけとはいえ、経済的繁栄と汎アジア主義の約束は非常に魅力的である。オランダに二度とインドネシアへ戻ろうなどと思わせないため、我々は日本の戦争遂行を支援し続ける。"
 INS_seize_oppurtunity: "好機をつかむ"
 INS_seize_oppurtunity_desc: "[JAP.GetNameDefCap]は敗北に向かっており、占領政府は弱体化している。過去数世紀で初めて、我々はインドネシアを取り巻く束縛を完全に打ち破り、独立国家を樹立する好機を手にしている。今この機会に独立を宣言しなければ、次の機会がいつ訪れるかわからない。"
 INS_japanese_resource_infrastructure: "大規模な戦争努力への資金拠出"
 INS_japanese_resource_infrastructure_desc: "我々の主要な資源採掘インフラの支配権を[JAP.GetNameDef]に委ねるのは戦争に勝利するために欠かせない措置である。なぜならば、[JAP.GetAdjective]の部隊が常に十分な補給を受けていることは最優先事項だからだ。[JAP.GetNameDefCap]はまた、資源輸出の効率を高めるために現地インフラの開発も行うことになる。"
 INS_japanese_army_training: "軍の改革"
 INS_japanese_army_training_desc: "我々は宗主国の[JAP.GetAdjective]から学ぶことが多く、王立オランダ領東インド陸軍が解散した今、大日本帝国陸軍の指導を受けた新たな軍を創設し、外部の脅威からインドネシアを防衛可能な体制を整えるべきである。"
 INS_governor_general_de_jonge: "デ・ヨンゲ総督"
 INS_governor_general_de_jonge_desc: "ボニファシウス・コルネリス・デ・ヨンゲは冷酷な統治で知られ、あらゆる形態の民族主義に反対し、しばしばフォルクスラートの意向を無視した。東インドに対する彼の統治は長期にわたり、彼の経験は自身が東インド陸軍大臣を務めていた先の大戦まで遡る。"
 INS_governor_general_tjarda: "チャルダ総督"
 INS_tjarda_explain_tt: "1936年9月、§Yボニファシウス・コルネリス・デ・ヨンゲ§!の任期が満了し、後任の総督として§Yアリディウス・チャルダ・ファン・スタルケンボルフ・スタハウェル§!が選ばれた。"
 INS_governor_general_tjarda_desc: "アリディウス・チャルダ・ファン・スタルケンボルフ・スタハウェルは前任の総督とは若干異なる東インドの構想を持っている。依然として民族主義には反対しているものの、若干自由主義的な政策を持ち、フォルクスラートの意向により耳を傾ける姿勢である。"
 INS_electrical_investments: "電力への投資"
 INS_electrical_investments_desc: "工業化したヨーロッパの国家はすべて、産業を支えるための強力な電力網を有している。我が国が原料輸出への依存をやめ、独自の製造業を確立したいのであれば、ジャワ島全域にわたる大容量の電力網を建設すべきである。"
 INS_reduce_land_taxes: "土地所有税の引き下げ"
 INS_reduce_land_taxes_desc: "土地所有に課される高い税負担は、現地のインドネシア人が農園や事業のオーナーになることを困難にしている。このことは我々にとってゴム産業の独占を容易にしているが、国家全体では経済的な問題を引き起こしている。これらの税を以前の水準まで引き下げ、小規模な民間所有のゴム農園経営を可能にすることを検討すべきである。"
 INS_invest_in_batavian_education: "バタビアの教育への投資"
 INS_invest_in_batavian_education_desc: "フォルクスラートはインドネシア人の意思として、教育をより受けやすくすることを求めていると明らかにしている。なぜならば、現在は主にオランダ系インドネシア人と少数のインドネシア人エリートだけが教育を受ける余裕があるからだ。フォルクスラートの動議に従い、バタビア周辺に初等学校と中等学校をいくつか建設すべきである。"
 INS_javanese_education_investments: "ジャワの教育への投資"
 INS_javanese_education_investments_desc: "現在進行中の初等学校および中等学校の建設に加え、コミュニティ・カレッジと高等専門学校を建設できる。これにより、中流階級にとってさらなる高等教育が受けやすくなる。"
 INS_allow_local_autonomy: "地方自治を認める"
 INS_allow_local_autonomy_desc: "藩王国に自治を認める藩王領制度は民族主義運動の管理を容易にし、国家全体の安定性を向上させている。藩王国に認められる自治権の水準をさらに上げ、政府がより重要な問題に集中できるようにすべきである。"
 INS_direct_rule: "直接統治"
 INS_direct_rule_desc: "藩王国に自治を認める藩王領制度は行政に困難を一層加え、余分な官僚機構を必要とし、時間を浪費させている。今こそこの制度を完全に廃止し、群島全体に直接統治を徹底すべきである。"
 INS_seize_oppurtunity_tt: "§Y[JAP.GetFlag][JAP.GetName]§!は押し戻され、支配している州が§Y[?var:temp_states_plus_more]§!未満となった。（現在: §Y[?var:JAP.num_controlled_states]§!州）"
 INS_seize_oppurtunity_refuse_warn_tt: "§R民族革命が開始され、[HOL.GetNameDef]との戦争につながる可能性がある§!。"
 INS_economic_stabilization: "経済の安定化"
 INS_economic_stabilization_desc: "大恐慌と世界的な保護貿易主義は我々の経済を苦しめ、かつて原材料産業に携わっていた多くのインドネシア人が職を失っている。我々は抜本的な対策を講じ、失業した市民に職を割り当てられるような労働計画を創設しなければならない。"
 INS_restore_order_in_indies: "東インドの秩序回復"
 INS_restore_order_in_indies_desc: "東インドで勢いを増す民族主義運動は複数の地域を不安定化させており、これを阻止しなければ制御不能なまでに拡大する恐れがある。秩序と安定性の回復を最優先事項としなければならない。"
 INS_detangle_supply_chains: "供給網の合理化"
 INS_detangle_supply_chains_desc: "我々の輸出経済は商品が最終目的地に到達するまでに何十もの中間業者を介し、その都度手数料や税金、またはその他の名目で少しずつ売上から控除されている。この複雑な状況を合理化し、供給網の大部分を直接管理できるように努めるべきである。"
 INS_prioritize_industrial_growth: "産業成長の優先"
 INS_prioritize_industrial_growth_desc: "我々の輸出経済はあまりにも不安定であり、オランダの協力に依存し続ける要因となっている。バタビア全域に工場を建設することにより、製造業を確立すべきである。我々は太平洋で最も工業化された国家となる可能性を有している。"
 INS_closer_economic_ties_to_netherlands: "オランダとの経済的な結びつきの強化"
 INS_closer_economic_ties_to_netherlands_desc: "我々は宗主国から学ぶべきことが多く、特に経済に関してはそれが顕著だ。我々の輸出経済をさらにオランダと統合できれば、彼らのインフラやネットワークを利用し、より利益の大きな貿易取引を実現できる。"
 INS_prioritize_dutch_companies: "オランダの企業を優先する"
 INS_prioritize_dutch_companies_desc: "シェルやフォッカーのようなオランダの企業は何世紀にもわたって我々の経済を支えてきた。原材料輸出に関してはシェルと密接に統合されている。この関係は東インドに多大な富をもたらしており、我々は小規模の地元企業よりもこれらの企業を優先し、協力関係を強固に維持すべきである。"
 INSHOL_java_factories: "ジャワ島に武器工場を開設する"
 INSHOL_java_factories_desc: "基本的なことだが、単純に兵器工場を増設することが軍の戦力増強につながることは否定できない。この植民地では工業の中心地であるジャワ島に建設するのが最適だ。"
 INSHOL_license_dutch_weapon_blueprints: "オランダの武器設計図を利用する"
 INSHOL_license_dutch_weapon_blueprints_desc: "国内での製造工程を一から構築し、独自の技術設計を生み出すために投資するよりも、オランダの企業と協力して武器設計図を購入すべきである。"
 INSHOL_bangka_production_lines: "バンカ生産ライン"
 INSHOL_bangka_production_lines_desc: "バンカ計画の結果としてバンカ島のインフラは飛躍的に発展した。かつては小さな重要度の低い島だったが、新しい産業計画を実施するのに最適な場所へと変貌した。我々はバンカ島に新たな武器工場を建設することにより、王立オランダ領東インド陸軍を強化する好機を得ている。この島は集中的に道路、鉄道、港が整備されているため、他の場所に建設するよりも効率良く稼働するだろう。"
 INSHOL_artillerie_inrichtingen: "アルティレリー・インリヒティンゲン"
 INSHOL_artillerie_inrichtingen_desc: "アルティレリー・インリヒティンゲンはオランダで250年以上にわたり火砲およびその他の兵器を製造しており、東インドでも数十年にわたって操業を続けている。東インドに新たな製造施設を開設することにより、彼らの製造能力を拡大させれば、王立オランダ領東インド陸軍の能力向上に大きく寄与するとともに、雇用創出により資金不足の地域で経済を強化することにつながる。"
 INSHOL_ai_pyrotechnische: "アルティレリー・インリヒティンゲン火工部門"
 INSHOL_ai_pyrotechnische_desc: "アルティレリー・インリヒティンゲンは東インドにおける生産施設の拡張を継続するため、我々は同社の火工部門子会社の東インド部門設立に資金提供すべきである。"
 INSHOL_bio_pharma: "ビオ・ファルマ"
 INSHOL_bio_pharma_desc: "東インドの製薬業の拡大は、負傷兵が適切な治療を受けて安全に回復することを目的としており、王立オランダ領東インド陸軍を改革するための次の一手であることは明らかだ。東インドにおけるキニーネの普及により、この計画の費用は通常よりも大幅に低く抑えられている。"
 INSHOL_develop_fighters: "新型戦闘機の開発"
 INSHOL_develop_fighters_desc: "バタビアの技術者をアムステルダムに派遣し、フォッカーの戦闘機生産を直接学ばせれば、厳重に保護された製造上の機密にもアクセスできるだろう。彼らは東インドで近代的な国内戦闘機産業を確立するのに必要な知識と専門技術を持ち帰ってくれるはずだ。"
 INSHOL_develop_bombers: "新型爆撃機の開発"
 INSHOL_develop_bombers_desc: "バタビアの技術者をアムステルダムに派遣し、フォッカーの爆撃機生産を直接学ばせれば、厳重に保護された製造上の機密にもアクセスできるだろう。彼らは東インドで近代的な国内爆撃機産業を確立するのに必要な知識と専門技術を持ち帰ってくれるはずだ。"
 INSHOL_bandung_aircraft_facility: "バンドン航空機製造工場"
 INSHOL_bandung_aircraft_facility_desc: "設計図や製造上の機密は有用だが、それらを使って実際に航空機を製造しなければ意味がない。我々は現在の王立オランダ領東インド陸軍航空隊のニーズに応えるため、バンドンに新たな航空機製造施設を開設する。"
 INSHOL_netherlands_indies_air_doctrine: "オランダ領東インド航空ドクトリン"
 INSHOL_netherlands_indies_air_doctrine_desc: "我々と似た課題に直面している国々の空軍を研究し、彼らが苦労の末に得た経験を学び、東インドの現実に即したドクトリンを構築する。同じ過ちは繰り返さない。"
 INSHOL_manado_military_academy: "マカッサル士官学校"
 INSHOL_manado_military_academy_desc: "ジャワ島の外部に士官学校を設立することで東部諸島からの徴兵が可能となり、人的資源の不足を大幅に緩和する助けとなるだろう。東インドのほぼ中央に位置するマカッサルは開設場所として最適である。"
 INSHOL_infantry_training_in_borneo: "ボルネオ島での歩兵訓練"
 INSHOL_infantry_training_in_borneo_desc: "東インドは密生したジャングル、険しい山岳、過酷な地形で特徴づけられる。我々の兵士は主にジャワ島を拠点としており、このような環境での戦闘には著しく準備不足だ。我々はジャワ島の外部に軍事訓練を拡大し、より厳しい環境下で演習を実施しなければならない。ボルネオ島のジャングルや山岳に匹敵する場所は地球上にほとんどなく、世界水準のレンジャーを訓練するのに最適な場所だろう。"
 INSHOL_knil_engineers: "工兵隊"
 INSHOL_knil_engineers_desc: "歩兵やライフルの生産ばかりに力を注いではならない。戦闘に勝利するには兵站と通信が欠かせない役割を果たすことを忘れてはならない。工兵を訓練し、バタヴィアの職業学校に資金を提供することで、兵站の不備が我が軍の足かせにならないようにすべきである。"
 INSHOL_work_with_oil_barons: "石油王たちとの協力"
 INSHOL_work_with_oil_barons_desc: "大恐慌の影響により、輸出に依存した我々の経済は憂慮すべき状況にある。石油の販売を確実なものとするために、スマトラ島の石油王たちに一部の貿易交渉を委ねることを検討すべき時かもしれない。しかし、これには代償が伴い、彼らが取引に同意するためには我々が市場価格を大きく下回る価格で販売する必要がある。"
 INSHOL_rubber_taxation: "ゴムへの課税"
 INSHOL_rubber_taxation_desc: "東インドのゴム農園を帝国で最も価値のある資産の一つへと変貌させたのは、オランダが提供した投資と専門知識である。そこから生まれた富に対し、王室が正当な分配を求めるのは当然のことだ。何名かの地元の政治家が抗議しているが、帝国の利益は地方の扇動によって左右されるものではない。"
 INSHOL_padang_port: "パダン国際港"
 INSHOL_padang_port_desc: "パダンで生産された資源は国際市場に到達する前にジャワ島を経由しなければならない。なぜならば、この地域には大規模な輸送船団に対応する施設が存在しないからだ。この不要な迂回は我々の供給網を酷使し、スマトラ島の潜在的な経済力に制限をかけている。パダンに大規模な貨物港を建設することにより、迂回をする必要がなくなり、パダンの農園の収益性が向上する。"
 INSHOL_subsidize_bauxite: "ボーキサイト計画を補助する"
 INSHOL_subsidize_bauxite_desc: "ボーキサイトが豊富なバンカ島およびブリトゥン島を近代化させる計画が東インドで進行中である。この計画は非常に有望で、長期的な利益も見込めている。この計画を加速するため、我々は東インド政府を経済的に補助すべきである。"
 INSHOL_agricultural_subsidies: "農業部門の民営化"
 INSHOL_agricultural_subsidies_desc: "様々な規模の私有農場の設立を許可することにより、資金不足の農村地域におけるインフラ開発を加速し、同時に政府の収入を増やすことができる。これを実現するために、これらの農場から生まれる税収を東インドを介さずに直接オランダに送金する、構造的な税制枠組みを確立する。"
 INSHOL_import_sugar: "砂糖の輸入"
 INSHOL_import_sugar_desc: "我々は東インドで成長中の農業部門に価格統制を課し、我が国が必要とする砂糖の全量を他のいかなる政府も競争できない価格で東インドの農園から購入する。これにより、政府の砂糖独占を実現する。"
 INSHOL_import_lumber: "木材の輸入"
 INSHOL_import_lumber_desc: "我々は東インドで成長中の農業部門に価格統制を課し、我が国が必要とする木材の全量を他のいかなる政府も競争できない価格で東インドの農園から購入する。これにより、政府の木材独占を実現する。"
 INSHOL_industrialized_colony: "工業化された植民地"
 INS_no_peta_tt: "インドネシアは外国の侵略者と協力できなくなる。"
 INSHOL_industrialized_colony_desc: "東インドはかつては質素な植民地であったが、今ではアジア全域で最も工業化が進み、豊かな地域の一つになった。これはオランダおよび人類の歴史において記念すべき偉業である。我々の努力は実を結んだ。そして、今後も植民地への投資を継続し、オランダを再び世界的な大国として復活させよう。"
 INSHOL_economic_integration: "経済統合"
 INSHOL_economic_integration_desc: "オランダ領東インドは帝国の輝く宝石であり、その繁栄は女王、首相、総督による安定した指導によって確保されている。この安定を無謀な独立要求によって危険にさらしてはならない。そのような行いは無秩序と衰退しかもたらさない。我々はオランダと東インドの経済をさらに緊密に結び付け、安定と卓越性の継続を確実なものとする。"
 INSHOL_republic_of_indonesia: "インドネシア共和国"
 INSHOL_republic_of_indonesia_desc: "オランダが渋々スタルジョ請願に同意した際、結果として成立した法律によってインドネシアの独立に条件が課された。それは、インドネシアの経済的な自立を認めるための長い条件一覧であった。しかし、これらの条件はインドネシア人の決意によって完全に充足されたので、オランダは我々の正式な独立宣言を承諾せざるを得ない。"
 INSHOL_propose_malay_unification: "マレーの統一を提案"
 INSHOL_propose_malay_unification_desc: "インドネシアは数百の文化、言語、民族が共存する群島である。そのうちのいくつかは類似しているが、それ以外は明確に異なっている。しかし、植民地支配への共闘を通じて、我々は一つの国家、インドネシアの下での統一を見出した。だが、我々は統一の動きをここで止める理由を自らに問いかけるべきであろう。なぜならば、海峡の向こう側ではマラヤの人々が我々と同じ歴史と願望を共有しているからだ。"
 INSHOL_singapore_compromise: "シンガポールに関する妥協案"
 INSHOL_singapore_compromise_desc: "シンガポールは歴史的にも文化的にもインドネシアの領土であり、統一されたインドネシアに含まれるのは当然である。しかし、イギリスはシンガポールの戦略的重要性と軍事基地としての必要性を理由にこれを手放そうとしない。我々は、イギリスがこの島に軍を駐留させる権利を保持することを条件に、シンガポールが連合に加わるという妥協案を提案すべきである。"
 INSHOL_request_ceylon: "セイロンの譲渡を要求"
 INSHOL_request_ceylon_desc: "イギリスの植民地であるセイロンは、より広範なマレー世界と文化的・言語的な深い結びつきを有している。汎マラヤ連邦、すなわちマフィリンドが成長するにつれ、この島も連合の一員である方が自然となってきている。"
 INSHOL_papua_referendum: "パプアの住民投票"
 INSHOL_papua_referendum_desc: "現在、パプア島はインドネシアとオーストラリアの間で分断されている。我々の投資と開発により、我々側の半分は成長および繁栄する地域に姿を変えた。オーストラリア統治下の領土は放置され、未開発のままである。この島の未来は住民の手に委ねられるべきであり、パプア統一に関する正式な住民投票を要求しなければならない。"
 INSHOL_invite_phillipines: "マフィリンドの提案"
 INSHOL_invite_phillipines_desc: "我々の連合に所属する多くの民族は異なる言葉を話し、異なる伝統を維持しているが、ほぼすべてがマレー世界を起源としている。我々は連合国家を汎マラヤ連合に再編し、フィリピンを構成国として招待すべきである。かつてはいくつかの取るに足らない植民地だったが、今では東南アジアの地域強国として力強く立つ。"
