 ##### FABDA BRANCH ########
 ###########################
 # Root
 ABDA_abdacom: "ABDA総司令部の設立"
 ABDA_abdacom_desc: "敵勢力が東南アジアと太平洋全域で急速に進撃するなか、この地域の連合軍は一丸となってこれを食い止めなければならない。合同最高司令部を設立すれば、資源を結集し、海軍戦力を調整し、敵に対して統一戦線を張ることができる。"
 # Tier 1 - country-locked
 ABDA_fortress_singapore: "シンガポール要塞"
 ABDA_fortress_singapore_desc: "シンガポールは、この地域における我々の防衛戦略の要である。その要塞を強化し、強力な守備隊を配備すれば、ABDA総司令部全体の取り組みに必要不可欠な時間を稼ぎ、敵による迅速な戦略的勝利を阻むことができる。"
 ABDA_corps_expeditionnaire: "フランス極東遠征軍団"
 ABDA_corps_expeditionnaire_desc: "仏領インドシナはABDA総司令部の防衛線の北翼に位置する。フランス極東遠征軍団（CEFEO）を実戦任務に投入することで、[FRA.GetNameDef]は植民地軍の貴重な人員と経験を合同司令部にもたらす。"
 ABDA_maintain_strategic_flexibility: "戦略的柔軟性の維持"
 ABDA_maintain_strategic_flexibility_desc: "アメリカ合衆国は、いずれか一つの戦域に戦力を過剰投入してはならない。戦略予備戦力を慎重に管理することで、太平洋全域の最も必要とされる場所にアメリカの工業力と軍事力を確実に投入できるようにする。"
 # Tier 2
 ABDA_the_malay_barrier: "マレー防壁"
 ABDA_the_malay_barrier_desc: "マラヤから[INS.GetNonIdeologyName]にかけて鎖のように連なる島々は、自然の防壁を形成している。ABDA軍はこの地理的条件を活かし、陸海で連携した防衛体制を構築して敵の進撃を遅らせなければならない。"
 ABDA_develop_naval_infrastructure: "海軍インフラの開発"
 ABDA_develop_naval_infrastructure_desc: "太平洋で持続的な海軍作戦を行うには、基地、燃料集積所、修理施設が必要である。港湾や泊地のインフラに投資することで、ABDA海軍部隊の行動範囲と持久力を伸ばすことができる。"
 # Tier 3
 ABDA_unified_naval_command: "統合された海軍指揮"
 ABDA_unified_naval_command_desc: "陸上防衛体制が確立され、インフラも整ったことで、ABDAはすべての海軍部隊を単一の統一司令部の下に置くことができる。信号方式の標準化、情報の共有、哨戒航路の調整により、この戦域におけるすべての艦艇の有効性は飛躍的に高まるだろう。"
 # Tier 4
 ABDA_ship_a_day_sinking_quotas: "毎日撃沈のノルマ"
 ABDA_ship_a_day_sinking_quotas_desc: "太平洋全域に伸びる敵の補給線は、敵にとって戦略上の脆弱点である。潜水艦部隊と水上部隊に積極的かつ連携した撃沈目標を設定することで、ABDA総司令部は敵の兵站を消耗させ、防勢に追い込むことができる。"
 ABDA_naval_procurement: "海軍調達"
 ABDA_naval_procurement_desc: "すでに被った損失を早急に補充しなければならない。ABDA総司令部による調達計画を連携して進め、太平洋戦域に最も適した駆逐艦、潜水艦、哨戒艇を優先することで、我々の合同艦隊は敵の拡大に対抗できるようになる。"
 ABDA_keep_trade_open: "貿易の維持"
 ABDA_keep_trade_open_desc: "[INS.GetNonIdeologyName]のゴムと石油は、連合国の戦争努力に不可欠である。ABDA総司令部は、これらの極めて重要な資源を運ぶ航路を守り、敵の妨害から船団を保護して、我々の産業への貿易の流れを維持しなければならない。"
 # Tier 5 - capstone
 ABDA_expand_the_command: "司令部の拡大"
 ABDA_expand_the_command_desc: "ABDA総司令部はその価値を証明した。今こそその基盤を発展させ、この地域の他の連合国にも加盟を広げるとともに、研究と情報の共有を深め、敵の先手を打たなければならない。"
