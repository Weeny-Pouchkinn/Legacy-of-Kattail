 medium_tank_destroyer_equipment_desc: "駆逐戦車は通常のものより大口径の火砲を、砲塔ではなく固定砲座に取り付けた無限軌道車両である。中駆逐戦車は中戦車の車体をもとに設計されており、相応の機動力と火力を兼ね備えている。"
