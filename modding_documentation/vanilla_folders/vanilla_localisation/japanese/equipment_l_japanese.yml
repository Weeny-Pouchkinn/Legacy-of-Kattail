 light_tank_equipment: "軽戦車"
 light_tank_equipment_desc: "軽戦車は小型で機動性の高い装甲戦闘車両で、偵察任務と軽装甲の敵との戦闘の両方を遂行することができる。"
 light_tank_equipment_1: "軽戦車 I"
 light_tank_equipment_1_short: "軽戦車 I"
 light_tank_equipment_1_desc: "軽戦車は小型で機動性の高い装甲戦闘車両で、偵察任務と軽装甲の敵との戦闘の両方を遂行することができる。"
 GER_light_tank_equipment_1: "I号戦車"
 GER_light_tank_equipment_1_short: "I号戦車"
 GER_light_tank_equipment_1_desc: "I号戦車は30年代に生産されたドイツの軽戦車である。I号戦車の設計は1932年に開始され、1934年に大量生産が開始された。ドイツ陸軍の機甲戦術の構想を教育する目的のためだけの訓練用戦車だったが、I号戦車は新型戦車の不足を埋めるべく実戦で広範囲にわたって使用された。"
