 GER_land_cruiser_equipment_1_short: "ラッテ"
 GER_land_cruiser_equipment_1_desc: "P.1000ラッテは第二次世界大戦中に開発されたドイツの超重戦車の設計案である。クルップが1942年に提案した設計では、2門の280mm艦砲、複数の副武装、最大360mmの装甲を備えた1000トンの装甲車両が想定されていた。ラッテはあらゆる戦場の敵を圧倒できる機動要塞となることを目的としていた。しかし、その巨大さ、高い燃料消費量、および物流上の非現実性により、この計画は実現不可能と判断され、最終的に1943年に中止された。"
