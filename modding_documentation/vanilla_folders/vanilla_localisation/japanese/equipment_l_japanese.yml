 GER_medium_tank_aa_equipment_1_short: "メーベルワーゲン"
 GER_medium_tank_aa_equipment_1_desc: "砲塔を閉じた際に箱型になる事から、メーベルワーゲン（家具運搬用車両）と呼ばれた自走対空砲である。IV号戦車の車体を流用して開発された急増品で、3.7cm砲を搭載していた。"
 GER_medium_tank_aa_equipment_2: "IV号対空戦車 オストヴィント"
 GER_medium_tank_aa_equipment_2_short: "オストヴィント"
 GER_medium_tank_aa_equipment_2_desc: "IV号対空戦車オストヴィント（ドイツ語で東風）はIV号戦車をベースに使用した自走対空砲である。これは1944年にIV号対空戦車ヴィルべルヴィントの後継として開発された。IV号戦車の砲塔を撤去し、代わりに3.7cm FlaK 43対空砲を搭載した頂部が開放された六角形型の砲塔に交換されている。閉じた構造のほうが良いように思えるが、これは対空砲によって生まれる大量の発煙が原因で不可能だった。"
