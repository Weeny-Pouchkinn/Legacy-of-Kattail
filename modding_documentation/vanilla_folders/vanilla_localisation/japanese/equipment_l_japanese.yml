 GER_light_tank_equipment_3: "VK1602レオパルト"
 GER_light_tank_equipment_3_short: "レオパルト"
 GER_light_tank_equipment_3_desc: "VK1602 レオパルトはドイツ軍の偵察車両として1942年に設計された。設計段階では75mm kwk 41を備え付けられる予定だったが、後により小さな50mm砲に変更された。VK1602は、パンター中戦車の影響で全面に傾斜装甲を有しており、踏破性向上のため、350mm幅の履帯を備えていた。"
