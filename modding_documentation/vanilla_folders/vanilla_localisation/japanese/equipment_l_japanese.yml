 GER_heavy_tank_equipment_3_desc: "連合軍の兵士によって付けられた「キング・タイガー」を半ば文字通り翻訳したケーニヒスティーガー（Königstiger）という非公式な名前で知られるこの戦車は、ティーガーI戦車と同じコンセプトを踏襲しているが、更に恐るべきものとなるよう設計された。ティーガーIIはパンター戦車に採用された傾斜装甲と、ティーガーIの重装甲を併せ持っている。この戦車は180mmから100mmという前面装甲に守られ、長砲身の8.8cm KwK 43 L/71の主砲を持ち、重量はほぼ70tにまで達していた。"
