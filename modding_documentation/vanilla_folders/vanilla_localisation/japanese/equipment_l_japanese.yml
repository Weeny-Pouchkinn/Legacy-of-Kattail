 medium_tank_destroyer_equipment_2_desc: "駆逐戦車は通常のものより大口径の火砲を、砲塔ではなく固定砲座に取り付けた無限軌道車両である。中駆逐戦車は中戦車の車体をもとに設計されており、相応の機動力と火力を兼ね備えている。"
 medium_tank_destroyer_equipment_3: "中駆逐戦車 III"
 medium_tank_destroyer_equipment_3_short: "中駆逐戦車 III"
 medium_tank_destroyer_equipment_3_desc: "駆逐戦車は通常のものより大口径の火砲を、砲塔ではなく固定砲座に取り付けた無限軌道車両である。中駆逐戦車は中戦車の車体をもとに設計されており、相応の機動力と火力を兼ね備えている。"
 GER_medium_tank_destroyer_equipment_1: "III号突撃砲"
 GER_medium_tank_destroyer_equipment_1_short: "III号突撃砲"
 GER_medium_tank_destroyer_equipment_1_desc: "III号突撃砲は、第二次世界大戦中のドイツにおいて最も生産された装甲戦闘車両だった。この車両は実績のあるIII号戦車の車体を流用されて生産された。当初、歩兵支援用の機動力・装甲のある軽砲として企図された突撃砲は絶えず改良され、駆逐戦車として広く用いられた。"
 GER_medium_tank_destroyer_equipment_2: "IV号駆逐戦車"
 GER_medium_tank_destroyer_equipment_2_short: "IV号駆逐戦車"
 GER_medium_tank_destroyer_equipment_2_desc: "IV号駆逐戦車は装甲師団およびSS装甲師団の対戦車大隊で任務に就いた車両で、ノルマンディー、バルジの戦い、東部戦線で実戦に参した。駆逐戦車としては非常に優秀だったが、戦車の代用で役割外の任務に就くと性能は低下した。それにもかかわらず、戦争終盤では他の車両が使えないことが多く、戦車の代用として使用される機会が増えた。"
 GER_medium_tank_destroyer_equipment_3: "ヤークトパンター"
 GER_medium_tank_destroyer_equipment_3_short: "ヤークトパンター"
 GER_medium_tank_destroyer_equipment_3_desc: "ヤークトパンター（ドイツ語で狩猟する豹）は第二次大戦中のナチスドイツにおいて、パンターの車体を流用して生産された駆逐戦車である。戦争後期（1944年）に投入され、東部戦線、西部戦線の両方で使用された。ヤークトパンターは、ティーガーIIの非常に強力な8.8cm PaK 43砲とパンターの車体の特徴である優れた装甲とサスペンションを兼ね備えていたが、戦況の悪化した戦争後期のドイツでは少数生産に留まり、パーツ不足や搭乗員の訓練不足に悩まされた。"
