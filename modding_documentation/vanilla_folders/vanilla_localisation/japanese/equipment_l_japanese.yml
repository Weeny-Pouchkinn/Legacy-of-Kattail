 tank_armor_upgrade: "装甲"
 tank_armor_upgrade_desc: "敵が貫通できない装甲を備えれば師団は大いに有利になるが、代わりに移動速度は低下する。"
 tank_gun_upgrade: "主砲"
 tank_gun_upgrade_desc: "敵の装甲を撃ち破ることのできる砲を保持し続けることが重要だ。"
 tank_aa_upgrade: "対空兵装"
 tank_aa_upgrade_desc: "最新の航空機を撃墜できる対空火力を確保する。"
 tank_at_upgrade: "対戦車兵装"
 tank_at_upgrade_desc: "駆逐戦車が最新の敵戦車を撃破できる火力を確保する。"
 tank_art_upgrade: "榴弾砲兵装"
 tank_art_upgrade_desc: "あらゆる非装甲目標を撃滅できる強力な火力を確保する。"
 tank_reliability_upgrade: "信頼性"
 tank_reliability_upgrade_desc: "信頼性を高める事により故障による損失を減らし、補充の手間を減らすことができる。"
 mech_cost_upgrade: "生産コスト"
 mech_cost_upgrade_desc: "設計を効率化したり、重要度の低い資材を代用したりすることで、より早く車両の生産が可能となるが、信頼性は少しずつ低下していく。"
 tank_engine_upgrade: "エンジン"
 tank_engine_upgrade_desc: "機動性を高める事によって戦術的及び戦略的優位を得、装甲追加による減速を補うことができる。"
 ac_engine_upgrade: "エンジン"
 ac_engine_upgrade_desc: "機動性を高める事によって戦術的及び戦略的優位を得、装甲追加による減速を補うことができる。"
 ship_gun_upgrade: "艦砲"
 ship_gun_upgrade_desc: "敵の装甲を撃ち破ることのできる砲を保持し続けることが重要だ。"
 ship_torpedo_upgrade: "魚雷"
 ship_torpedo_upgrade_desc: "魚雷は小さな艦船からでも、一旦射程に入れば高確率で致命的な打撃を与える事ができる強力な兵器である。"
 ship_armor_upgrade: "装甲"
 ship_armor_upgrade_desc: "追加装甲は敵の砲火から自艦船を保護する。"
 carrier_armor_upgrade: "装甲"
 carrier_armor_upgrade_desc: "追加装甲は敵の砲火から自艦船を保護する。"
 ship_engine_upgrade: "機関"
 ship_engine_upgrade_desc: "より強力な機関を搭載した艦船は、戦闘において敵との距離を思い通りに保持する事ができる。"
 ship_reliability_upgrade: "信頼性"
 ship_reliability_upgrade_desc: "高い信頼性を持つ艦船は、粗雑な構造の艦船であれば大破するような攻撃を受けても、致命的な打撃になりにくい。"
 ship_anti_air_upgrade: "対空砲"
 ship_anti_air_upgrade_desc: "より多くの対空兵装を搭載する事は、より多くの敵機を撃墜できる事を意味する！"
 ship_ASW_upgrade: "対潜兵装"
 ship_ASW_upgrade_desc: "対潜兵装は、潜水艦の発見と捕捉に重要なものである。"
 destroyer_engine_upgrade: "機関"
 destroyer_engine_upgrade_desc: "より強力な機関を搭載した艦船は、戦闘において敵との距離を思い通りに保持する事ができる。"
 sub_engine_upgrade: "機関"
 sub_engine_upgrade_desc: "より強力な機関を搭載した艦船は、戦闘において敵との距離を思い通りに保持する事ができる。"
 sub_stealth_upgrade: "ステルス"
 sub_stealth_upgrade_desc: "潜水艦の最大の強みは、簡単には発見されず、そのままその有利な状況から攻撃できることだ。"
 sub_torpedo_upgrade: "魚雷"
 sub_torpedo_upgrade_desc: "魚雷は小さな艦船から射程内の敵艦船に、致命的な一撃を高い確率で与える事ができる強力な兵器である。"
 ship_deckspace_upgrade: "飛行甲板スペース"
 ship_deckspace_upgrade_desc: "艦載機を搭載し発艦させる為により広い空間を確保する。"
