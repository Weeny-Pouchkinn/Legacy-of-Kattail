 GER_medium_tank_artillery_equipment_1: "グリレ"
 GER_medium_tank_artillery_equipment_1_short: "グリレ"
 GER_medium_tank_artillery_equipment_1_desc: "Sd.Kfz. 138/1グリレ（ドイツ語でコオロギ）は第二次世界大戦中にドイツ軍が使用した自走砲である。生産台数は約490から500両であった。グリレは装甲擲弾兵連隊の歩兵砲中隊に配備され、重火器による機動火力支援を実施した。"
 GER_medium_tank_artillery_equipment_2: "フンメル"
 GER_medium_tank_artillery_equipment_2_short: "フンメル"
 GER_medium_tank_artillery_equipment_2_desc: "フンメル（ドイツ語でクマバチ）はIII/IV号戦車の車体に15cm榴弾砲を搭載した自走砲である。第二次世界大戦下の1943年初頭から戦争の終わりまでドイツ国防軍によって使用された。"
