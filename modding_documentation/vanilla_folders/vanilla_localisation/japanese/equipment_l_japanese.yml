 train_equipment_desc: "鉄道は補給元から、鉄道で結ばれた補給ハブに物資を輸送する。"
 train_equipment_1: "民間列車"
 train_equipment_1_desc: "通常の民間貨物輸送から軍に引き継がれたこの機関車は、大量の物資を長距離輸送するのに適している。しかし、民間用構造であるがゆえに脆弱である。"
 train_equipment_2: "戦時簡易列車"
 train_equipment_2_desc: "廉価生産を目指すべく、通常の貨物列車に見られる多くの機能を省略した簡易設計版。通常の列車と同様に脆弱であるが、より簡単に交換できる。"
 train_equipment_3: "装甲列車"
 train_equipment_3_desc: "機関車を重厚な装甲で包み込み、敵の攻撃を受けにくくしたもの。他の設計と同等の貨物輸送ができるが、生産コストが高い。"
