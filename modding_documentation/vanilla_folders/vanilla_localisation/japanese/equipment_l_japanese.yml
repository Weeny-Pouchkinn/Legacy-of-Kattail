 GER_light_tank_equipment_2: "II号戦車"
 GER_light_tank_equipment_2_short: "II号戦車"
 GER_light_tank_equipment_2_desc: "II号戦車はもともと、より大型で高性能の戦車が開発されるまでの当座しのぎとして設計されたものだが、より高性能の戦車が十分に供給されなかったため、実戦で広範に使用された。"
