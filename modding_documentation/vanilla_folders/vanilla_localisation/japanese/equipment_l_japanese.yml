 medium_tank_equipment_desc: "中戦車は比較的高い機動力を持つ多目的車両で、偵察、歩兵支援、対戦車戦闘のような数多くの役割を担うことができる。"
 medium_tank_equipment_1: "中戦車 I"
 medium_tank_equipment_1_short: "中戦車 I"
 medium_tank_equipment_1_desc: "中戦車は比較的高い機動力を持つ多目的車両で、偵察、歩兵支援、対戦車戦闘のような数多くの役割を担うことができる。"
 GER_medium_tank_equipment_1: "III号戦車"
 GER_medium_tank_equipment_1_short: "III号戦車"
 GER_medium_tank_equipment_1_desc: "1934年か35年という早い時期に、ハインツ・グデーリアン将軍は将来のドイツ機甲師団のための広範的な装備となるように、2つのタイプの戦車を提案した。1つ目は対戦車砲と2挺の機銃で武装した車両、2つ目は支援車両としてより大口径の武装を施した車両だった。III号戦車として知られる事になる前者は、戦車大隊における3個軽中隊の標準的な戦車となり、後者はIV号戦車として知られることになった。"
