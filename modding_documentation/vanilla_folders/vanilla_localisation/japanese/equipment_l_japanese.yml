 GER_light_tank_artillery_equipment_1: "I号突撃戦車 ビゾン"
 GER_light_tank_artillery_equipment_1_short: "ビゾン"
 GER_light_tank_artillery_equipment_1_desc: "牽引砲は自動車化歩兵連隊の歩兵砲中隊に割り当てられていたが、戦車の戦闘に追いつくのは困難を極めていた。最も簡単な解決策は戦線にそれを運ぶために予備の戦車の車体を改造することだった。ビゾンの場合は、I号戦車を利用している。"
