 railway_gun_equipment_desc: "重砲を鉄道車両に搭載して輸送するもの。"
 railway_gun_desc: "鉄道は、重火器を内陸部にまでそれなりの速度で移動が可能なので、敵の陣地を広範囲に、かつ効果的に砲撃が可能となる。"
