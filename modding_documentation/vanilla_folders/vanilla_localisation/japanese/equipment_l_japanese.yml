 gw_tank_equipment: "前大戦型戦車"
 gw_tank_equipment_short: "前大戦型戦車"
 gw_tank_equipment_desc: "第一次大戦の戦車は西部戦線で膠着した塹壕戦を打開するべく、イギリスとフランスで別々かつ同時に開発された。「タンク」は、開発初期にイギリスが機密保持のために名付けた名称だった。初期の戦車は機関銃と小口径砲で武装され、鈍足で、小火器の攻撃に耐えるだけの装甲しか備えていなかった。"
 GER_gw_tank_equipment: "ライヒトトラクトーア"
 GER_gw_tank_equipment_short: "ライヒトトラクトーア"
 GER_gw_tank_equipment_desc: "ライヒトトラクトーアはドイツの実験用戦車だった。第一次大戦ののち、ドイツはヴェルサイユ条約によって軍備の開発を制限されたが、「農業用トラクター」の名のもとに行われた秘密研究は軍用装甲車両と火砲を発展させた。"
