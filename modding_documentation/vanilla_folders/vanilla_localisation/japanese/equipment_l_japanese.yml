 mechanized_equipment_desc: "機械化歩兵は、移動と戦闘に装甲兵員輸送車（APCs）または歩兵戦闘車（IFVs）を用いる歩兵である。機械化歩兵は装甲車両により敵の攻撃から保護されている点で、非装甲車両（トラックやジープ）を用いる自動車化歩兵とは区別される。"
