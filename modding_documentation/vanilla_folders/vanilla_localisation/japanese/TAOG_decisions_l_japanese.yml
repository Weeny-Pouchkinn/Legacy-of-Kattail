 SIA_demand_independence_LAO: "§Y[LAO.GetName]§!の解放を要求"
 SIA_demand_independence_LAO_tt: "我々は[LAO.GetName]の解放をその支配者に対し要求する"
 SIA_demand_independence_CAM: "§Y[CAM.GetName]§!の解放を要求"
 SIA_demand_independence_CAM_tt: "我々は[CAM.GetName]の解放をその支配者に対し要求する"
 SIA_invite_to_adc: "§Y[FROM.GetName]§!を我々の陣営に招待"
 SIA_asian_democratic_compact_cat: "アジア民主協定"
 SIA_asian_democratic_compact_cat_desc: "アジアの諸民族には自らを統治する権利がある。アジアにおける民族自決の旗手として、我々は植民地勢力に圧力をかけ、その支配下にある国々を解放させることができる。"
 SIA_khana_ratsadon_cat: "人民党"
 SIA_khana_ratsadon_cat_desc: "絶対君主制を終わらせた人民党（カナ・ラサドン）は、一枚岩ではない。その軍人派と文民派はそれぞれ独自の国家構想を抱いており、両者の緊張関係はあらゆる意思決定の水面下に潜んでいる。両派閥の満足度を維持しなければ、連立が分裂する危険がある。"
 SIA_army_navy_reform_cat: "陸軍と海軍"
 SIA_army_navy_reform_cat_desc: "陸軍と海軍は、限られた同じ資源をめぐって競い合っている。両者の間で資金を移すことは絶え間ない綱渡りであり、再配分のたびに相手側の即応態勢に影響が及ぶ。"
 SIA_divert_army_funds_to_navy_toggle: "[SIA_GetDivertingArmyFundsToNavyTitle]"
 SIA_divert_army_funds_to_navy_toggle_tt: "[SIA_GetDivertingArmyFundsToNavyTT]"
 SIA_divert_army_funds_to_navy_toggle_do: "陸軍資金を海軍に転用する"
 SIA_divert_army_funds_to_navy_toggle_do_tt: "海軍の発展を加速するため、陸軍資金の一部を海軍に転用する。"
 SIA_divert_army_funds_to_navy_toggle_undo: "海軍への陸軍資金転用を停止する"
 SIA_divert_army_funds_to_navy_toggle_undo_tt: "今後は陸軍資金の一部を海軍に転用しない。"
 SIA_standing_our_ground_mission: "陣地死守"
 SIA_standing_our_ground_mission_tt: "我々は自由のために戦わなければならない。"
 SIA_sway_generals_to_seri_thai_tt: "我々がセリタイ側に取り込んだ将軍たちは、内戦勃発時に体制派の反乱ではなく我々側に参加する。"
 SIA_sway_general_cw_scale_tt: "内戦における我々の支持率が§Y5%§!増加する\n支持率が§Y80%§!を超えると内戦を回避し、無抵抗で権力を掌握する"
 SIA_sway_luang_chawengsaksongkhram_to_seri_thai: "ルアン・チャウェンサックソンクラームを取り込む"
 SIA_sway_luang_chawengsaksongkhram_to_seri_thai_desc: "ルアン・チャウェンサックソンクラームを説得し、セリタイの大義に取り込む。成功すれば、内戦勃発時に彼は我々側につく。"
 SIA_sway_aditya_dibabha_to_seri_thai: "アーティット・ティッパアーパーを取り込む"
 SIA_sway_aditya_dibabha_to_seri_thai_desc: "アーティット・ティッパアーパーを説得し、セリタイの大義に取り込む。成功すれば、内戦勃発時に彼は我々側につく。"
 SIA_sway_mangkorn_phromyothi_to_seri_thai: "マンコーン・プロムヨーティーを取り込む"
 SIA_sway_mangkorn_phromyothi_to_seri_thai_desc: "マンコーン・プロムヨーティーを説得し、セリタイの大義に取り込む。成功すれば、内戦勃発時に彼は我々側につく。"
 SIA_sway_luang_haansongkhram_to_seri_thai: "ルアン・ハーンソンクラームを取り込む"
 SIA_sway_luang_haansongkhram_to_seri_thai_desc: "ルアン・ハーンソンクラームを説得し、セリタイの大義に取り込む。成功すれば、内戦勃発時に彼は我々側につく。"
 SIA_sway_charun_rattanakun_seriroengrit_to_seri_thai: "チャルーン・ラッタナクン・セーリールンリットを取り込む"
 SIA_sway_charun_rattanakun_seriroengrit_to_seri_thai_desc: "チャルーン・ラッタナクン・セーリールンリットを説得し、セリタイの大義に取り込む。成功すれば、内戦勃発時に彼は我々側につく。"
