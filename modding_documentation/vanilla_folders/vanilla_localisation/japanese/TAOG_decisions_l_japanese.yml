 AST_election_approaching_cat_desc: "一つの政権がようやく落ち着いたかと思えば、すぐに次の選挙が近づき始める。民主主義政党は支持を高めるための手段を必死に探し回り、投票所が開き、投票箱が票で満たされるとき、それが勝利を確かなものにするだけの力になることを願っている。"
 AST_final_reforms_mission: "最終改革"
 AST_final_reforms_mission_desc: "安定した指導、保守的傾向、イギリスへの忠誠により、UAPは支持を強化し、続投の可能性をますます高めている。民衆の支持を維持するため、その指導者たちは改革を加速させなければならない。\n\n§Y有効中の効果:§!\n§W（§Y民主主義§!の国家方針）:\n完了時間を§Y7§!日短縮§!"
 AST_final_reforms_effect_tt: "\n§Y$AST_final_reforms_mission$§!が有効中の効果（§Y180§!日間）:"
 AST_labor_campaign_tour_mission: "労働党の遊説ツアー"
 AST_labor_campaign_tour_mission_desc: "すべての市民を代表するという使命のもと、ALPは帝国主義とオーストラリアの帝国への忠誠について異なる見方を採用した。国内の必要が第一であり、対外的な利益がもはや優先されるべきではない。\n\nこのメッセージを現在の与党と有権者の双方に広めるため、ALPは全国遊説に乗り出す。\n\n§Y有効中の効果:§!\n§W日ごとの§YA.L.P§!票増加: §G+0.05§!§!"
 AST_labor_campaign_tour_effect_tt: "\n§Y$AST_labor_campaign_tour_mission$§!が有効中の効果（§Y180§!日間）:\n日ごとの§YA.L.P§!票増加: §G+0.05§!\n\n§Y180§!日後の効果:"
 AST_election_season_cat: "選挙シーズン"
 AST_election_season_cat_desc: "一つの政権が腰を落ち着けるやいなや、次にその座を狙う者が準備を始める。この時点で民衆の支持を動かす手段はほとんど残されていないが、それでも各政党は試みることをやめない。勝負は終わるまで終わらず、その決着は投票箱で下される。"
 AST_election_countdown: "選挙までのカウントダウン"
 AST_election_countdown_desc: "投票所の開場まで数日しか残されていない。\n\n§W$AST_expected_election_winner_tt$§!"
 AST_government_formation_period: "政権樹立期間"
 AST_government_formation_period_desc: "各政党は自らの政策を決定する権力を望んでいるが、一定の状況下では、挙国一致内閣が最も理にかなった選択肢となる場合もある。\n\n§W§Y有効中の効果:§!\n£GFX_trigger_yes $AST_election_recently_concluded$\n\n$AST_ruling_party$は§Y挙国一致内閣§!を樹立できる。\n\nオーストラリアの国家方針ツリーにある「民主的選挙」ウィンドウで、§Y挙国一致内閣§!を樹立する。§!"
 AST_war_is_coming_cat: "戦争は迫っている"
 AST_war_is_coming_cat_desc: "緊張が高まり、オーストラリアでは役人と国民の両方が、たとえ自国の政策や利益にどれだけ反していようとも、戦争は避けられないかもしれないと気づきはじめている。\n\n我々は侵攻に備えた手続きを決定するため、閣僚会議を招集しなければならない。しかしその前に、すべての閣僚が同意するとは限らない行動をとっておく価値はあるかもしれない。"
 AST_seize_civilian_industry: "民需産業の掌握"
 AST_seize_civilian_industry_desc: "消費財は国民と経済の両方にとって不可欠なものだが、戦時中はそれ以上に優先すべき物がある。それは決して変えようのない事実だ。戦争は迫っており、我々はその時に備えなければならない。"
 AST_scorch_the_north: "北部を焼き払う"
 AST_scorch_the_north_desc: "北部からの侵攻を疑うならば、それを阻止する方法はいくつかある。しかし、いずれも代償を伴うものだ。焦土作戦は北部諸州の発展を後退させることにはなるが、侵略者を食い止めるために必要となる可能性がある。"
 AST_scorch_the_north_tt: "§Y北部の州が強襲上陸を受けた場合の効果: §!"
 AST_the_brisbane_line: "ブリスベン・ライン"
 AST_the_brisbane_line_desc: "オーストラリアの防衛能力は外国の侵略を完全に食い止めるには不十分かもしれない。国土全体を広く薄く守るよりも、重要な地域を優先して強固に防衛する方針を導入すれば、[AST.GetName]でも特に発展した人口の多い部分を支配下に置き続けることができる。\n\nこのような方針は、わずかたりとも譲歩を許さない者たちの反対を受けるに違いない。しかし、政府には[AST.GetName]を合理的な方向へと導く責務がある。"
 AST_summon_the_cabinet_mission: "閣議の招集"
 AST_summon_the_cabinet_mission_desc: "外交官、官僚、理論家をキャンベラに招集し、侵攻の可能性を議論しなければならない。"
 AST_summon_the_cabinet_tt1: "\nこのイベントは現政権を混乱させ、場合によってはその§Y崩壊§!につながる可能性がある。"
 AST_australian_accusations_modifier: "オーストラリアからの非難"
 AST_cabinet_trust_cat: "内閣信任"
 AST_cabinet_trust_increase_tt: "\n§Y内閣信任§!を§G上昇§!させる\n"
 AST_cabinet_trust_decrease_tt: "\n§Y内閣信任§!を§R低下§!させる\n"
 AST_cabinet_trust_remove_tt: "§Y内閣信任§!の精神を§G削除§!する"
 AST_australian_comforts_fund: "£BoP_right_texticon  オーストラリア兵士支援基金"
 AST_australian_comforts_fund_desc: "政府はキャンベラ航空事故の犠牲者の一人を称え、その未亡人が熱心に携わっているオーストラリア兵士支援基金に投資する。\n\nこの基金の目的は、軍が配給する食料や携行品を補完する品物を戦場に贈り、オーストラリア兵を慰労することである。結果として、戦争努力にも資する投資となる。"
 AST_eminent_successors: "£BoP_right_texticon   有力な後継者"
 AST_eminent_successors_desc: "キャンベラ航空事故の犠牲者には高名な政府高官が数名含まれていた。悲惨な運命をたどった彼らの埋め合わせはできないが、数名の著名な後継者を任命すれば、政府を安定させて国民と閣僚の信頼を回復できるかもしれない。"
 AST_critics_to_shame: "£BoP_right_texticon  批判者を恥じ入らせる"
 AST_critics_to_shame_desc: "キャンベラ航空事故は国家全体に影響を与え、すべてのオーストラリア国民を悲嘆にくれさせた。このような時期は、この状況を利用しようとする者が必ず現れる。我々は最も声高な批判者が秩序を破壊するために批判していることを暴かなければならない。"
 AST_approach_the_independents: "£BoP_left_texticon  無所属議員への接触"
 AST_approach_the_independents_desc: "最近の騒動を受け、政府がオーストラリアを導く能力に対する信頼が日に日に失われており、政権が不安定になっている。無所属議員に接触すれば、政権交代が最善策だと説得できるかもしれない。"
 AST_a_sound_voice: "£BoP_left_texticon  良識ある声"
 AST_a_sound_voice_desc: "この政治的に混乱した時代において、自信に満ちた一つの声がオーストラリア国民の間で信頼を呼び起こしているようだ。これが[AST.GetName]の次の指導者の声なのだろうか？"
 AST_challenge_government_narrative: "£BoP_left_texticon  政府の言説に異議を唱える"
 AST_challenge_government_narrative_desc: "キャンベラ航空事故に関して政府が公表した情報は不自然なものであり、一部の情報が隠されているという憶測を招いたのは必然であった。王立オーストラリア空軍の経験豊富な将校が理想的な飛行条件の下でなぜ搭乗機を墜落させたのか？政府に回答を要求すべきである。"
 AST_make_a_common_enemy: "共通の敵を作る"
 AST_make_a_common_enemy_desc: "キャンベラ航空事故で複数の高官が命を落としたことを受け、不信の声が増している。外国の関与を疑う声が多いのは、墜落状況が不自然だったからだけではない。結局、最も団結を強めるのは共通の敵なのだ。"
 AST_make_a_common_enemy_tt: "§Rイベントにより生じ得る影響:§!"
 AST_ensure_cabinet_loyalty: "内閣の忠誠心を確保する"
 AST_ensure_cabinet_loyalty_desc: "内閣の過半数が現政権に賛成票を投じる限り、不信任案の脅しは脅威ではない。内閣の忠誠心を確保すべきである。"
 AST_castle_crumbling_mission: "崩れゆく城"
 AST_castle_crumbling_mission_desc: "キャンベラ航空事故の余波を受け、オーストラリア国民の関心は自国の指導者に向いている。政府高官を失ってもなお現政権は国民の信頼に値するのか、それとも指導者の交代が単純に最善策なのだろうか？"
 AST_castle_crumbling_mission_event_tt: "§Yイベントの影響:§!"
 AST_castle_crumbling_mission_complete_tt: "任務、§Y崩れゆく城§!を完了する"
 AST_cabinet_trust_complete_1_flag: "ディシジョン、§Y共通の敵を作る§!を開始済みである"
 AST_cabinet_trust_complete_2_flag: "ディシジョン、§Y内閣の忠誠心を確保する§!を開始済みである"
 AST_cabinet_trust_complete_not_tt: "国家方針§Y「オーストラリア・ファースト」§!を選択していない"
 AST_canberra_air_disaster_flag: "$AST_canberra_air_disaster_events.1.t$"
 AST_war_angst_cat: "戦争への不安"
 AST_deteriorating_prime_minister_nerves_mission: "首相の精神状態悪化"
 AST_deteriorating_prime_minister_nerves_desc: "避けられない戦争の圧力を前に、[AST.GetLeader]の精神は追い詰められている。早急に不安を軽減しなければ、彼の精神はもたないかもしれない。"
 AST_australian_demands_cat: "オーストラリアの要求"
 AST_aid_australian_military_construction: "オーストラリアの軍需建設を支援する"
 AST_aid_australian_military_construction_desc: "イギリスは戦争の準備ができていない。オーストラリアの軍需建設を支援することにより、彼らの焦りを和らげることができるかもしれない。"
 AST_japanese_war_mission: "日本との戦争"
 AST_japanese_war_mission_desc: "オーストラリアは圧倒的な強敵である[JAP.GetNameDef]と単独で対峙することを望んでいない。彼らが我々に強く求めているのは、先手を打って差し迫る紛争をできるかぎり早く解決することだ。"
 AST_resource_acquisition_cat: "資源獲得"
 AST_request_resource_rights_in_indonesia: "[INS.GetNameDef]における資源の利権を要求"
 AST_request_resource_rights_in_malaya: "[MAL.GetNameDef]における資源の利権を要求"
 AST_request_resource_rights_in_burma: "[BRM.GetNameDef]における資源の利権を要求"
 AST_request_resource_rights_in_indochina: "仏領インドシナにおける資源の利権を要求"
 AST_resource_request_ongoing_flag: "資源の要求を§Y実行中§!"
 AST_australia_first_movement_cat: "オーストラリア・ファースト運動"
 AST_summons_to_australian_hall: "オーストラリアン・ホールへの招集"
 AST_summons_to_australian_hall_desc: "[AST.GetFascistParty]を拡大するための取り組みとして、我々は団結し、支持者を動員しなければならない。オーストラリアン・ホールが待っている。"
 AST_summons_to_australian_hall_upgrade: "$AST_summons_to_australian_hall$"
 AST_summons_to_australian_hall_upgrade_desc: "$AST_summons_to_australian_hall_desc$"
 AST_print_the_publicist: "『パブリシスト』の発行"
 AST_print_the_publicist_desc: "オーストラリア・ファースト運動の広報誌『パブリシスト』は潜在的な支持者に働きかける上で重要な役割を果たしている。次号を発行することにより、我々の主張を広めることができる。"
 AST_print_the_publicist_upgrade: "$AST_print_the_publicist$"
 AST_print_the_publicist_upgrade_desc: "$AST_print_the_publicist_desc$"
 AST_call_on_fascists: "[GET_AST_CALL_ON_FASCISTS]"
 AST_call_on_fascists_desc: "オーストラリア・ファースト運動は支持者の少ない小規模な運動のため、資金のやりくりに苦労することもある。しかし、同じような思想を持つ外国の団体が我々の大志に資金提供する意思を示した。これは我々の継続的な進展を確実なものとする解決策になり得る。"
 AST_call_on_japanese_fascists: "日本のファシストを頼る"
 AST_call_on_foreign_fascists: "外国のファシストを頼る"
 AST_a_convenient_disaster: "都合の良い災害"
 AST_a_convenient_disaster_desc: "オーストラリア・ファーストがどれだけ支持を集めても、保守派は常にこの団体のイデオロギーに対抗するだろう。オーストラリア・ファーストが権力獲得に成功するためには、通常の選挙より劇的な何かが必要だ。政府を混乱に陥れるような何かが。\n\n我々の運動にそのような出来事自体を引き起こす能力はないが、外国のファシズム支持者にはそれがある。我々の政権獲得を支援することにより、彼らは[AST.GetName]において同志を得ることになるだろう。"
 AST_a_convenient_disaster_tt: "\nこのイベントは現政権を混乱させ、最終的に§Y[AST.GetFascistParty]§!が与党となることを可能にする。"
 AST_a_convenient_disaster_flag: "ディシジョン§Y「都合の良い災害」§!を通じて§Yキャンベラ航空事故§!が発生した。"
 AST_insufficient_funds_mission: "$AST_insufficient_funds$"
 AST_sufficient_funds_tt: "十分な資金（あと§Y[?AST_insufficient_funds:days_left]§!日で到達）"
 AST_sufficient_funds_tt_2: "十分な資金を§G得る§!"
 AST_lose_sufficient_funds_tt_100: "十分な資金を§R失う§!（§Y100§!日間）\n"
 AST_lose_sufficient_funds_tt_50: "十分な資金を§R失う§!（§Y50§!日間）\n"
 AST_insufficient_funds: "資金不足"
 AST_afm_decisions_fascism_upgrade_tt: "\n§Yオーストラリア・ファースト運動に属するディシジョン§!から得られる1日あたりのファシズム支持率をアップグレードする。\n\n"
 AST_afm_decisions_autonomy_upgrade_tt: "\n§Yオーストラリア・ファースト運動に属するディシジョン§!から得られる自治度をアップグレードする。\n\n"
 AST_vichy_out_of_africa_cat: "ヴィシーをアフリカから追放"
 AST_demand_madagascar: "マダガスカルを要求"
 AST_demand_central_africa: "中央アフリカを要求"
 AST_demand_southwestern_territories: "南西部領土を要求"
 AST_vichy_req_ongoing_flag: "領土の要求を§Y実行中§!"
 AST_remove_vichy_out_of_africa_decisions: "\n§Y「ヴィシーをアフリカから追放」§!のディシジョンを削除。\n"
 AST_big_business_pact_cat: "大企業との協定"
 AST_big_business_request_ongoing_flag: "大企業への要求を§Y実行中§!"
 AST_naval_expansion: "$NOR_alt_dem_naval_expansion$"
 AST_naval_expansion_desc: "[ROOT.GetFascistParty]が実業界の有力者に有利な政策を進める見返りとして、彼らは党の目的に沿った産業改革への投資に同意した。\n\n[AST.GetName]が海軍力で勝る敵に対抗するには、艦隊を拡張しなければならない。一定期間、造船所に総力を集中し、艦船生産の増加を図る。"
 AST_factory_conversions: "工場の転換"
 AST_factory_conversions_desc: "[ROOT.GetFascistParty]は有力な実業家たちに利益をもたらす政策を押し進める代わりに、党の目的に沿った産業改革に彼らが投資する同意を取り付けた。\n\n防衛産業を優先しなければならず、これを支援するためにオーストラリアの工場を転換しなければならない。"
 AST_land_development: "土地開発"
 AST_land_development_desc: "[ROOT.GetFascistParty]は有力な実業家たちに利益をもたらす政策を押し進める代わりに、党の目的に沿った産業改革に彼らが投資する同意を取り付けた。\n\n[ROOT.GetName]の領土には工業化されずに未開発のままの土地が非常に多く残っている。これらの地域を開発することにより、建設に適した土地にすることができる。"
 AST_electrical_grid_expansions: "電力網の拡大"
 AST_electrical_grid_expansions_desc: "[ROOT.GetFascistParty]は有力な実業家たちに利益をもたらす政策を押し進める代わりに、党の目的に沿った産業改革に彼らが投資する同意を取り付けた。\n\n電力網を拡大することにより、輸入に依存しない国内でのエネルギー生産を促進することができる。"
 AST_factory_investments: "工場への投資"
 AST_factory_investments_desc: "[ROOT.GetFascistParty]は有力な実業家たちに利益をもたらす政策を押し進める代わりに、党の目的に沿った産業改革に彼らが投資する同意を取り付けた。\n\n紛争時に軍需物資と民需物資の両方を十分に確保するためには、工業力を拡大する必要がある。"
 AST_develop_port_kemla_steel_medium_decision: "ポート・ケンブラの第2高炉を建設する"
 AST_develop_port_kemla_steel_medium_decision_desc: "ポート・ケンブラは高炉1基でも十分に機能してきたが、需要が増加したため第2高炉を建設した方が良い。これにより、この地域の鋼鉄の生産量が約2倍になる。"
 AST_prospect_pilbara_iron_decision: "ピルバラ地区を鉱業に開放する"
 AST_prospect_pilbara_iron_decision_desc: "ピルバラ地区の鉄鉱石埋蔵量は世界有数である。しかし、国内でも極めて辺鄙な地域に位置するため、この資源を採掘するには莫大な投資が必要になるだろう……しかし、実現すれば利益も莫大である。"
 AST_scale_up_pilbara_mines_steel_decision: "ピルバラ鉱山の拡大"
 AST_scale_up_pilbara_mines_steel_decision_desc: "ピルバラ地区が大規模な鉱業に開放された今こそ、投資を呼び込むべきである！"
 AST_pilbara_mining_tt: "§Y$STATE_870$§!に対するさらなる探鉱を開放することにより、鋼鉄生産を無制限に増加させる反復可能なディシジョンを利用可能にする。"
 AST_scale_up_middleback_mines_steel_decision_1: "アイアン・ノブ鉱山の拡大"
 AST_scale_up_middleback_mines_steel_decision_1_desc: "アイアン・ノブ鉱山はしばらくの間操業してきたが、鉄鉱石の需要拡大を受け、ここでの採掘を拡大する時だ。"
 AST_scale_up_middleback_mines_steel_decision_2: "アイアン・モナーク鉱山の操業開始"
 AST_scale_up_middleback_mines_steel_decision_2_desc: "アイアン・ノブ鉱山だけでは我々の需要を満たすのに不十分だが、幸いにもミドルバック山脈には豊富な鉄鉱石が存在する。これまでで最大級の鉱山を設立する時だ！"
 AST_scale_up_middleback_mines_steel_decision_3: "アイアン・プリンス鉱山の操業開始"
 AST_scale_up_middleback_mines_steel_decision_3_desc: "戦時中の金属需要はかつてないほど高まっているが、ミドルバック山脈からの供給は続いている。"
 AST_expand_iron_mining_tt: "§Y$AST_exports_for_economic_recovery$§!と§Y$AST_within_reach$§!の両方を実行すると、§Y$STATE_870$§!にあるピルバラ地区での採掘が可能となり、無尽蔵に近い§Y鋼鉄§!資源が解放される。これを利用して経済を促進できる。"
 AST_develop_port_kemla_steel_tt: "これによりディシジョン、§Yポート・ケンブラの第2高炉を建設する§!が実行可能となり、我々の§Y鋼鉄生産量§!が大幅に増加する。"
 AST_develop_middleback_tt: "これにより、§Y$STATE_519$§!における§Y鋼鉄§!生産を開発する3つのディシジョンがアンロックされる"
 AST_expand_planned_extraction_pilbara_tt: "§Y$AST_planned_extraction$§!により、§Y$STATE_870$§!のピルバラ地域を開発し、ほぼ尽きることのない§Y鋼鉄§!資源を利用可能にする。これを経済の原動力にできる。"
