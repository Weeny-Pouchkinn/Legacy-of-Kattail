 INS_war_escalation_8_tt: "§Y[INS.GetName]§!: ジャワ島で潜入作戦を開始する国家方針をアンロック。§Rこれはインドネシアの早期勝利につながる可能性がある。§!\n§Y[INS.GetName]§!: スカルノの暗殺に失敗"
