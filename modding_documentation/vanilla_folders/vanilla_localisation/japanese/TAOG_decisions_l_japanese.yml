 AST_australia_formables_category_desc: "[AST.GetName]の根は、これからも常に我々を遠い南方へと結びつけるだろう。だが、その腕は長く伸び、今や我々の世界情勢に対する見解を誰も無視できなくなった。我々は拡大してきたし、今後さらに拡大することもできる。その事実を明確に示す新たな国名が必要だ。[AST.GetName]という繭を破った我々は翼を広げ、その色彩と紋様を世界に示し、称賛と認知を得る。その南方の新国家の名こそ、オーストラレーシアである。"
