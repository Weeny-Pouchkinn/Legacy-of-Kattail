 INS_no_raids_allowed_tt: "§W§Rこのディシジョンの実行中は、襲撃を行えない。§!§!"
 INS_is_deescalating_tt: "すでに鎮静化任務を実行中ではない"
 INS_escalate_the_conflict: "紛争の拡大"
 INS_escalate_the_conflict_desc: "暴動および敵軍との小競り合いを引き起こし、緊張と戦争拡大レベルを高め、後日より過激な作戦を実行した際の国際的な注目度を下げる地盤を整える。"
 INS_escalate_the_conflict_HOL: "$INS_escalate_the_conflict$"
 INS_escalate_the_conflict_HOL_desc: "$INS_escalate_the_conflict_desc$"
 INS_deescalate_the_conflict: "国際的な仲介を要請"
 INS_deescalate_the_conflict_2: "停戦を要求"
 INS_deescalate_the_conflict_desc: "オランダが我々と誠意ある交渉を行うとは思えない。彼らにとって我々はいまだに反逆者であり、国家として認めるどころか、鎮圧すべき厄介ごととしか考えていないのだ。しかし、世界の列強は別問題であり、ハーグもこれを簡単に無視することはできない。我々は国際社会に仲介を求め、自らの声では成し遂げられないことを、外国の圧力によって押し通す。"
 INS_deescalate_the_conflict_2_desc: "我々の襲撃はその役目を果たした。植民地駐屯部隊は我々の影響が及ぶ範囲を理解し、ハーグも我々が屈していないことを知った。しかしながら、襲撃の度にオランダに兵と艦艇を増やす口実を与えてしまっており、一方で我々はまだ全面戦争の準備ができていない。指揮官たちには攻撃を控えるよう通達が出される。次の一撃はオランダの挑発に応じるのではなく、我々の意思によって実行されるのだ。"
 INS_renville_tt_HOL: "§W§Y[USA.GetFlag][USA.GetNameDefCap]§!が我々に最後通牒を突きつける。我々が降伏してインドネシアから撤退しなければ、彼らは我々に§R宣戦布告§!する。§!"
 INS_renville_wont_happen_neutral_tt: "この紛争はアメリカの交渉が終了する前に終結し、彼らは介入できなくなる。"
 INS_renville_explain_USA_tt: "紛争が§Y365日§!以内に解決しない場合:\n\n"
 INS_renville_timer_mission_republic: "レンヴィル交渉は保留中"
 INS_renville_timer_mission_HOL: "$INS_renville_timer_mission_republic$"
 INS_national_revolution_peace_negotiation: "[FROM.GetName]からの撤退を交渉"
 indonesia_reduce_escalation_1_effect_tooltip_for_min_4: "拡大レベルを§G1§!低下させる（最低§Y4§!）。"
 INS_ongoing_influence_process: "民兵基地を建設中ではない"
 INS_current_revolution_strength_3_tt: "この州では現在、民兵活動が§G活発§!である。"
 INS_current_revolution_strength_0_tt: "この州では現在、民兵活動が行われていない。"
 INS_has_spent_points_trigger_tt: "追加の民兵基地を設立できない"
 INS_national_revolution_cat: "インドネシア独立戦争"
 INS_national_revolution_cat_desc: "350年に及ぶオランダの圧政の末、我々は自らの手で問題に対処し、独立を宣言するに至った。オランダは我々の政権を認めておらず、いまだに東インドを植民地として統治し、我々を犯罪者扱いしている。\n\n我々はさらに多くの地域と重要都市を掌握し、オランダ政府を内部から打倒しなければならない。しかし、綿密な計画なしに過度に攻勢に出ないよう注意が必要だ。我々が急激な行動に転じると、オランダの軍事介入を招きかねないからだ。"
 INS_national_revolution_cat_map: "陽動蜂起の開始"
 INS_national_revolution_dutch_cat: "東インドの革命派民兵"
 INS_national_revolution_dutch_cat_desc: "東インドの革命勢力は違法な独立宣言を行い、民兵部隊を使って東インドの各地を掌握した。我々は最善を尽くしたが、展開中の民兵部隊が膨大な数にのぼり、この地域の支配権を取り戻せない状況だ。\n\n彼らが支配都市を拡大し、東インド政府をさらに不安定にする前にこれを止めなければならない。彼らがこのような行いを続けるのであれば、過激な手段ではあるが、軍事力を行使する必要があるかもしれない。"
 INS_HOL_revolution_not_going_well_tt: "§Rバタビアを失えば、我々は東インドを統治することができず、革命勢力と和平協定を結ぶための交渉を行わざるを得なくなるだろう。§!"
 INS_gradual_escalation_republic: "段階的な拡大"
 INS_gradual_escalation_HOL: "段階的な拡大"
 INS_gradual_escalation_republic_desc: "我々が襲撃を重ねる度にオランダの報復は激しさを増しており、彼らの哨戒部隊が数か月前に放棄していた地区に進出している。我々の指揮官は長期間鎮静化していた場所での戦闘激化を報告しており、犠牲者数は新兵の採用では補えないペースで増えている。戦闘は昨年までは平静であったプロヴィンスにまで拡散している。"
 INS_gradual_escalation_HOL_desc: "各理事州からの報告によれば、状況は週を追うごとに悪化している。反乱勢力の攻撃は彼らが活動していないと思われていた地域にまで達しており、バタビアの軍司令部はこれまでに試みたことがないほど強硬な措置を求めている。ハーグでは閣議を重ねる度に慎重論者が減ってきている。"
 INS_national_revolution_republic_win_ins_tt: "[INS.GetAdjective]共和国の民兵がこの地域を§G事実上支配§!し、紛争は§G共和国側の勝利§!に終わる。"
 INS_national_revolution_republic_win_hol_tt: "[INS.GetAdjective]共和国の民兵がこの地域を§R事実上支配§!し、紛争は§R共和国側の勝利§!に終わる。"
 INS_national_revolution_dutch_cat_map: "民兵に占領された州を表示"
 INS_take_batavia: "ジャワ島を掌握する"
 INS_take_batavia_desc: "オランダが強欲にも東部の諸島を無視し、大半の投資をジャワ島に集中させてきた結果、この島は植民地全体のアキレス腱になっている。このことが奴らの破滅を招くだろう！我が軍はジャワ島に突入し、オランダの通信網と補給網を破壊して東インド政府を機能不全にさせる。"
 INS_hold_batavia_HOL: "ジャワ島の死守"
 INS_hold_batavia_HOL_desc: "共和国軍は部隊の大半をジャワ島に再配置する作戦を開始した。これは島全体の支配権奪取を目指すものであり、我々は抵抗し続けなければならない。奴らの作戦は危険を伴うものであり、失敗すれば奴らの政権を打倒するチャンスである。"
 INS_militias_moestopo_mission: "モエストポが自らの尽力に見合う昇進を要求"
 INS_militias_pki_uprising_mission: "共産主義者の蜂起は不可避"
 INS_pacific_revolution_cat: "太平洋革命"
 INS_instigate_in_country: "[FROM.GetName]で革命を扇動"
 INS_instigate_in_country_desc: "最後の植民地兵を[ROOT.GetAdjective]の地から追い出したが、革命はまだ終わっていない。[FROM.GetName]の労働者と農民は、我々が克服したものと同じ束縛に苦しんでいる。彼らにとって我々は、圧制者を打ち倒せることの証なのだ。彼らの内部に扇動者を送り込み、パンフレットを配布し、組合に資金援助し、革命の機が熟すまで彼らの不平不満を煽ろう。"
 INS_launch_revolution: "革命の呼びかけ"
 INS_launch_revolution_desc: "[FROM.GetName]では機が熟した。工作員の報告によれば、工場と農地で不安が強まっており、地元の党支部は行動を起こす準備ができている。[FROM.GetName]の労働者と農民に向け、本来自分たちが持つべきものを取り戻すべく、決起するよう呼びかける時が来たのだ。"
 INS_anti_colonialist_bonus: "[FROM.GetName]で反植民地主義感情を広める"
 INS_anti_colonialist_bonus_desc: "[FROM.GetName]の人民は宗主国のために苦労しており、他人の利益のために働かされている。彼らには、服従は選択肢の一つにすぎず、宗主は見せかけほどは強くないと気づかせよう。"
 INS_revolutionary_sentiment: "[FROM.GetAdjective]の革命勢力と協力する"
 INS_revolutionary_sentiment_desc: "[FROM.GetName]内部にはすでに大義を抱いた者たちがいる。彼らは信念を持っており、足りないのは組織と資源だ。これらの集団と連携することで、我々は既存秩序の崩壊を早めることができる。たとえ、結果として生じる不安定さが短期的に国家の統治を難しくするとしてもだ。"
 INS_arm_militias: "地元の[FROM.GetAdjective]民兵の武装化"
 INS_arm_militias_desc: "パンフレットと演説だけで進められる革命には限界がある。時がくれば、[FROM.GetName]の同志たちが戦える状態にしなければならない。余剰の武器と物資は我々に賛同する民兵に密輸する。そうすれば、敵が対峙するのは無防備な民衆ではなく武装集団だ。"
 INS_arm_militias_tt: "内戦勃発時、共産主義者に追加の師団が与えられる。"
 INS_propoganda_mission: "[FROM.GetName]に共産主義を広める"
 INS_propoganda_mission_desc: "党の組織者たちは[FROM.GetName]中に派遣され、読書サークルを設立し、労働組合から仲間を勧誘し、革命のメッセージを村々に伝播する。今日我々が植えた種はすぐに実を結ぶだろう。"
 INS_abandon_mission: "任務の放棄"
 INS_abandon_mission_desc: "我々の資源は有限であり、[FROM.GetNameDef]における闘争では必要量が現在の供給可能量を超えている。工作員には撤退させ、我々の努力は最も必要とされる場所に振り向けよう。"
 INS_aslia_cat: "太平洋の統一"
 INS_integrate_subject: "[FROM.GetName]の統合"
 INS_integrate_subject_in_progress: "すでに属国を統合中である"
 INS_can_raid_here_HOL: "襲撃可能な州"
 INS_can_raid_here_HOL_tt: "この州は共和国による民兵の地上襲撃の標的になる可能性がある。成功すると、この州は敵に奪取される。襲撃から州を防衛するためには以下のことを実行できる:\n$success_modifier_INS_has_influence_mod_counterplay$\n$success_modifier_INS_defense_modifier_counterplay$\n$success_modifier_INS_naval_dominance_modifier_counterplay$\n- §Y航空優勢§!の確保\n- 敵の諜報力低減\n- 当州のレジスタンス活動抑制"
 INS_war_escalation_text: "£generic_war_escalation_text_icon 拡大レベル: §Y[?INS.INS_war_escalation_level]§!"
 INS_war_escalation_level_tt: "§Y現在の拡大レベル§!\n\n拡大レベルは時間とともに上昇し、さらに民兵による§Y新たな州の占領§!、および[HOL.GetNameDef]による民兵活動への対抗措置によっても上昇する。状況が十分に激化すると§R全面戦争§!に突入する可能性がある。"
 INS_war_escalation_1_tt: "§Y[INS.GetName]§!: 地上攻撃をアンロック"
 INS_war_escalation_2_tt: "§Y[INS.GetName]§!: 停戦を命じるディシジョンをアンロック"
