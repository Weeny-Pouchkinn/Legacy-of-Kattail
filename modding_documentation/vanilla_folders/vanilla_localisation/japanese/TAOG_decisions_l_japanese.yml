l_japanese:
 HOL_recall_conrad_helfrich: "東インドからコンラート・ヘルフリフを呼び戻す"
 HOL_recall_conrad_helfrich_desc: "この差し迫った時局において、我々は何よりも本国を優先しなければならない。オランダ王立海軍で最も有能な提督であるコンラート・ヘルフリフは、オランダに帰還しなければならない。"
 INS_is_taking_volksraad: "フォルクスラートで法案を審議中"
 INS_volksraad_cat: "フォルクスラート"
 INS_volksraad_cat_desc: "東インドに民主主義を導入する試みとして1918年に導入された人民評議会である。オランダ語でフォルクスラートと呼ばれ、いわゆる「倫理政策」の一環であった。議席はオランダおよびインドネシアの役人が占めており、その選考方法は様々であった。オランダ本国は無条件の拒否権を有していたものの、フォルクスラートは政府に対して動議や法案を可決する権限を有していた。"
 INS_volksraad_allow_language_in_schools: "学校でのインドネシア語使用を許可"
 INS_volksraad_allow_language_in_schools_desc: "オランダ領東インドでは高等教育の授業がオランダ語のみで行われるため、高等教育を受ける機会が主にオランダ人と、オランダ語を話すインドネシア人の富裕層に限られている。現在、フォルクスラートではインドネシア語の学校を開校するための動議が審議されており、総督の裁決を待っている状況だ。"
 INS_volksraad_allow_language_in_government: "政府機関でのインドネシア語使用を許可"
 INS_volksraad_allow_language_in_government_desc: "フォルクスラートを含め、東インドで政府職に就くには、流暢なオランダ語能力が求められる。そのため、フォルクスラートの多くの議員——とりわけ現地人の地域社会代表者から、これが民主主義と呼べるのか疑問が呈されている。彼らは、可能なかぎりインドネシア語話者も政府職に就けるようにすべきだとする動議を提出した。"
 INS_volksraad_remove_education_quotas: "入学枠割当制を廃止"
 INS_volksraad_remove_education_quotas_desc: "現在、オランダ領東インドの教育制度は入学枠割当制を導入しており、インドネシア人学生とオランダ人学生のそれぞれを一定数ずつ受け入れることが義務付けられている。この仕組みはオランダ人を不当に優遇しているとの見方が一般的であり、フォルクスラートで論争の的となっていた。制度改正のやり方を何年も議論するより、入学枠割当制を完全に廃止した方が有意義かもしれない。"
 INS_volksraad_reduce_rubber_export_tax: "民間のゴム輸出税を減税"
 INS_volksraad_reduce_rubber_export_tax_desc: "現在、民間企業のゴム輸出には極めて高い税金が課されており、そのおかげで我々は市場を独占できている。しかし、結果として一部の地域では民間プランテーションの操業が困難となり、経済の停滞を招いている。導入当時はこの課税が妥当だと見なされていたが、大恐慌から始まった国際的な保護主義は、我々のゴム輸出の収益性を大きく低下させた。経済を刺激するため、減税に取り組む価値があるかもしれない。"
 INS_volksraad_knil_rank_limit: "軍の階級に関する差別禁止法を可決"
 INS_volksraad_knil_rank_limit_desc: "王立オランダ領東インド陸軍にはインドネシア人の昇進を阻む正式な規定があるわけではないが、彼らの昇進を制限する不文律はあり、最高の成果を挙げた軍人でも大佐の地位を超えて昇進することはない。フォルクスラートには、高い成果を挙げたインドネシア人将校の努力を評価するよう政府に圧力をかける勢力が複数存在する。"
 INS_volksraad_legalize_displaying_flag: "紅白旗の掲揚を合法化"
 INS_volksraad_legalize_displaying_flag_desc: "「インドネシア」の紅白旗は民族主義・反植民地主義組織と結び付けられ、現在は公の場での掲揚を禁止されている。紅白旗の掲揚を合法化すれば、我々の協調意思を示すことができ、群島全域で広がる民族主義の過激化を食い止められる可能性が高い。"
 INS_volksraad_education_subsidies_for_indonesians: "非オランダ人住民に対する教育助成金の解放"
 INS_volksraad_education_subsidies_for_indonesians_desc: "フォルクスラートではオランダ領東インドのオランダ人学生に対して提供されている補助金および奨学金に関して議論が続いている。現地人の地域社会代表者たちは、この制度を出自にかかわらずあらゆる学生に拡大すべきだと主張している。この意見は住民から多大な支持を得るだろうが、安価では済まないだろう。"
 INS_volksraad_indonesian_national_language: "インドネシア語を公用語にする"
 INS_volksraad_indonesian_national_language_desc: "インドネシア語は群島の多くの地域で共通語として発展し、異なる文化間の言語の隔たりを埋めてきた。今や教育および政府の業務でインドネシア語の使用が認められており、数多くのフォルクスラートの代表者が、植民地におけるインドネシア語がオランダ語と同等の地位を持つ公用語として法的に承認されることを嘆願している。"
 INS_volksraad_official_flag: "インドネシア国旗の公認"
 indonesia_volksraad_official_flag_effect_tt: "我々の国旗が紅白旗に変更される。"
 INS_volksraad_official_flag_desc: "自治要求の動議はフォルクスラートで最終的に可決され、数年前までオランダ領東インドと呼ばれていた地域はインドネシア自治領になった。我々の旗もこの変化に適応させるべきである。"
 indonesia_volksraad_passed_6: "軍における差別禁止法を可決した"
 INS_autonomy_indonesian_in_schools: "インドネシア語が学校で許可"
 INS_autonomy_indonesian_in_govenment: "インドネシア語が政府機関で許可"
 INS_autonomy_no_education_quotas: "入学枠割当制度が廃止"
 INS_autonomy_reduced_rubber_tax: "ゴム輸出税が引き下げ"
 INS_autonomy_knil_rank_limit: "軍における差別禁止法が可決"
 INS_autonomy_flag_legalized: "紅白旗の掲揚が合法化"
 INS_autonomy_education_subsidies: "インドネシア人が教育助成金を利用可能に"
 INS_autonomy_national_language: "インドネシア語が公認"
 INS_autonomy_official_flag: "インドネシア国旗が使用されるように"
 INS_move_capital_to_amsterdam: "首都をアムステルダムに移転"
 INS_move_capital_to_batavia: "首都をバタビアに移転"
 INS_sukarno_is_dead: "スカルノは死亡している"
 INS_atjeh_management: "アチェにおける治安維持活動"
 INS_atjeh_management_2: "アチェの統合"
 INS_soetardjo_petition: "スタルジョ請願の承認待ち"
 INS_soetardjo_petition_desc: "スタルジョが招集した円卓会議が開催され、[INS.GetNameDef]が自立に向けた経済的要件を満たさなければならないという結論に至った。我々はこれらの目標に向けて明確な進展を示さなければならず、さもなければ[HOL.GetNameDef]が現状を維持するために、最終的にこの決定を覆すだろう。 "
 INS_soetardjo_petition_refresh_tt: "任務の再開: §Yスタルジョ請願の承認待ち§!（§Y120日間§!）。"
 INS_soetardjo_pending: "フォルクスラートがスタルジョの自治請願を審議中"
 INS_soetardjo_pending_desc: "スタルジョは平和的な民族主義運動の指導者として知られるフォルクスラートの議員である。彼が主導している請願では、[INS.GetNameDef]の自治権拡大が要求されているほか、オランダ連邦の一部として自治を獲得したいというインドネシア人の願望について議論するために、オランダおよびインドネシアの代表者による円卓会議の開催が要求されている。現在フォルクスラートで審議中のこの請願は影響力が甚大のため、議論が終わり次第我々の対応を決定しなければならない。"
 INS_flag_legalized: "紅白旗の掲揚は合法である"
 INS_owned_states_at_game_start_tt: "すべてのインドネシア州"
 INS_win_condition_base_republic_warning: "オランダ領東インドを打倒する"
 INS_win_condition_base_republic_warning_desc: "我々は戦い続けなければならない。民間人を徴募し、すべてのインドネシア人の魂に炎を燃やし続けなければならない。東インド政府を打倒すれば、[HOL.GetNameDef]は降伏するしかなくなるだろう。"
 INS_win_condition_base_republic_real: "オランダ領東インドを打倒する"
 INS_win_condition_base_republic_real_desc: "我々は戦い続けなければならない。民間人を徴募し、すべてのインドネシア人の魂に炎を燃やし続けなければならない。東インド政府を打倒すれば、[HOL.GetNameDef]は降伏するしかなくなるだろう。"
 will_complete_when_conditions_met_tt: "前提条件が満たされ次第、自動的に選択される。"
 INS_militias_cat: "ラスカル・ラヤット"
 INS_militias_basic_summon: "民間人の動員"
 INS_militias_basic_summon_desc: "我々はインドネシアの独立に情熱を抱く青年および学生を徴募し、武装した民兵として人民治安軍に参加させる。"
 INS_militias_kris_repayment: "KRIS民兵がスラウェシ島への投資を要求"
 INS_militias_di_mission: "ダルル・イスラムが代表権を要求"
 INS_militias_jakarta_pemuda_mission: "ジャカルタの青年活動家が教育の改善を要求"
 INS_militias_railway_pemuda_mission: "鉄道青年隊が戦闘を要求"
 INS_revolution_planning_cat: "地下革命"
 INS_revolution_planning_hq: "革命本部を[FROM.GetName]に設立"
 INS_revolution_planning_hq_desc: "[FROM.GetName]に民兵本部を設立し、群島全域の民兵基地に対する中央司令部とする。本部と周辺地域は潜入任務で優先され、確実に我々の支配下に置かれる。"
 INS_revolution_planning_hq_tt: "革命本部の設立数が§Y3§!つ以下"
 INS_revolution_planning_hq_DONE: "革命本部"
 INS_revolution_planning_hq_DONE_desc: "我々の革命本部であり、民兵たちが指揮を仰ぐ場所である。我々が独立を宣言すれば、この州は我々の支配下に置かれる。"
 INS_revolution_planning_hq_DONE_trigger_tt: "本部は1つしか設立できない"
 INS_revolution_planning_envoy_DONE_trigger_tt: "同一州に複数の基地を設立することはできない"
 INS_revolution_planning_envoy_DONE: "[FROM.GetName]の民兵基地"
 INS_has_revolutionary_hq: "革命本部を設立した"
 INS_revolution_planning_influence_state: "民兵基地を[FROM.GetName]に設立する"
 INS_revolution_planning_influence_state_desc: "民兵を[FROM.GetName]に送り、民兵基地を設立する。これにより、我々が独立を宣言した後は革命勢力が本部と連絡し、さらに容易に作戦遂行できるようになる。"
 INS_revolution_planning_cat_map_name: "民兵の活動を管理する場所を選択する"
 INS_state_revolution_hq_tt: "我々が独立を宣言すれば、州は我々の支配下に置かれる"
 INS_hq_warning: "§W§Rここに本部を設置するのは困難であり、設置する場合は資源の大半を費やすことになる。§!§!"
 INS_revolution_points_remaining_tt: "少なくともあと§Y1§!つ民兵基地を建設できる（残り§Y[?INS_revolution_points_remaining]§!）"
 INS_revolution_planning_influence_state_points_notif_tt: "§Rジャワ島以外§!の州§Y[?INS_starting_revolution_points_count]§!つに追加で民兵基地を建設できるようになる。"
 INS_revolution_planning_influence_state_points_notif_tt_1: "§Rジャワ島以外§!の州§Y1§!つだけに追加で民兵基地を建設できるようになる。"
 INS_revolution_point_spend_tt: "[FROM.GetName]に民兵基地が建設される"
 INS_revolution_points_in_state_tt: "[FROM.GetName]には民兵基地がない"
