 SIA_khana_ratsadon_dummy_military: "軍事クーデターの危険性"
 SIA_khana_ratsadon_dummy_military_tt: "軍部の反感を買い続ければ、彼らはクーデターを起こすだろう。内戦を回避するために、§Y$idea_SIA_military_rebellious$§!をあまり長引かせるべきではない。"
 SIA_khana_ratsadon_dummy_military_desc: "軍部は人民党の強力な派閥である。彼らは自らの利益に反すると考える政策は承認しないが、国家の軍事化を促すと見なすものは承認する。"
 SIA_khana_ratsadon_military_coup_mission: "軍部は政府を打倒しようと目論んでいる！"
 SIA_khana_ratsadon_military_coup_mission_desc: "軍部は政府の最近の政策を、自分たちの利益を脅かすものだと見なしている。自分たちの地位が向上しない場合は政府を退陣させようと積極的に計画している。"
 SIA_khana_ratsadon_dummy_civilian: "文民派によるクーデターの危険性"
 SIA_khana_ratsadon_dummy_civilian_tt: "文民派の反感を買い続ければ、彼らはクーデターを起こすだろう。内戦を回避するために、§Y$idea_SIA_civilian_rebellious$§!をあまり長引かせるべきではない。"
 SIA_khana_ratsadon_dummy_civilian_desc: "文民派は人民党の強力な派閥である。彼らは自らの利益に反すると考える政策は承認しないが、彼らが民主的で文民志向だと見なすものは承認する。"
 SIA_khana_ratsadon_civilian_coup_mission: "文民派は政府を打倒しようと目論んでいる！"
 SIA_khana_ratsadon_civilian_coup_mission_desc: "文民派は政府の最近の政策を、自分たちの利益を脅かすものだと見なしている。自分たちの地位が向上しない場合は政府を退陣させようと積極的に計画している。"
 SIA_promote_civilian_wing: "文民派を取り込む"
 SIA_promote_civilian_wing_desc: "文民派が掲げる土地改革、司法制度、憲法に関する政策に政府の力を注げば、プリディ派の感謝を得られる。しかし、こうした露骨な肩入れが見過ごされることはない。将校団は不満を抱き、平時の行政にも混乱が生じ、事態が落ち着くまで高い代償を支払うことになる。"
 SIA_promote_military_wing: "軍人派を取り込む"
 SIA_promote_military_wing_desc: "将校たちの要求を受け入れ、軍の力を誇示すれば、ピブーン派の支持を得られる。しかし、こうした露骨な肩入れが見過ごされることはない。再編によって軍の日常業務は混乱し、平時の行政にも混乱が生じ、事態が落ち着くまで高い代償を支払うことになる。反乱寸前の派閥を引き戻すためにしか使えない、荒っぽい手段である。"
 SIA_cultivate_civilian_wing: "文民派との関係を育む"
 SIA_cultivate_civilian_wing_desc: "王宮局指令によって支配層内で得た立場は、文民派に辛抱強く働きかけ続ける道を開いた。反発を招くような急激な肩入れはせず、一つひとつ譲歩しながら、プリディ派をゆっくり着実に味方につけていく。長い道のりだが、望むかぎり歩き続けられるだろう。"
 SIA_cultivate_military_wing: "軍人派との関係を育む"
 SIA_cultivate_military_wing_desc: "王宮局指令によって支配層内で得た立場は、軍人派に辛抱強く働きかけ続ける道を開いた。反発を招くような急激な肩入れはせず、一つひとつ譲歩しながら、将校団をゆっくり着実に味方につけていく。長い道のりだが、望むかぎり歩き続けられるだろう。"
 SIA_end_factionalism_mission: "連立の維持"
 SIA_end_factionalism_mission_desc: "人民党の両派閥は完全に政府を支持している。両派閥から§G完全な支持§!を§Y270§!日間維持できれば、両者の対立は完全に終結する。いずれかの派閥の支持が揺らいだ場合、この取り組みは最初からやり直しとなる。"
