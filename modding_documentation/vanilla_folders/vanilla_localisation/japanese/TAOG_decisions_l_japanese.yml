 AST_communism_support_text: "共産主義の支持率[?party_popularity_100@communism|Y]%"
 AST_union_control_1_cat: "労働組合の統制"
 AST_union_control_1_cat_desc: "我々の組合員は、オーストラリア全土の一般大衆の間で支持の動員を始めた。我々は各州の議会に潜入し、内部から共産主義主導の政府への支持を築くことができる。これには大量の政治力を必要とし、国家を不安定化させる恐れがある。\n\nニューガードの退役軍人たちは我々の動きを厳しく監視しており、政府が適時に行動できなかった場合、あるいは国家が不安定になり過ぎた場合、この対立は国家を完全に引き裂く可能性がある。\n\n共産主義支持率: [?party_popularity_100@communism|Y]§Y%§!\n\n§R安定度が40%を下回った場合、または「退役軍人の反乱」の制限時間が過ぎた場合、内戦が勃発する。§!"
 AST_union_control_1_cat_name: "支持率を上げるために、労働組合をどの分野で扇動するかを選択"
 AST_union_control_1_map_area_name: "まだ影響を与えることができる州"
 AST_nationalizing_cat: "国有化"
 AST_union_control_2_cat: "労働組合の統制"
 AST_union_control_2_cat_desc: "[ROOT.GetNonIdeologyName]の労働者たちが抑圧者を倒したのは、帝国主義列強が海外の同志たちをなお鎖につないでいるのを傍観するためではない。国境を越えた共産主義の拡大は、単なる思想上の目標ではなく戦略上の必要である。我々は海を越えて革命の炎を煽り、帝国主義のくびきを脱しようとする者たちに希望と資源を与えなければならない。古い秩序が立つ足場を完全に失うまで、革命の炎を広げ続けるのだ。"
 AST_union_control_2_foreign_cat: "共産主義の抑圧"
 AST_union_control_tt: "オーストラリア全土の州に労働組合を設立しなければならない。しかし、ニューガードの退役軍人が共産主義の拡大を防ぐために活動している。"
 AST_seize_local_leadership_in_state_major: "[FROM.GetName]の現地の支配権を掌握する"
 AST_seize_local_leadership_in_state_mid: "[FROM.GetName]の現地の支配権を掌握する"
 AST_seize_local_leadership_in_state_low: "[FROM.GetName]の現地の支配権を掌握する"
 AST_seize_local_leadership_in_queensland: "クイーンズランドの現地の支配権を掌握する"
 AST_union_strike: "ストライキを実行する"
 AST_union_strike_desc: "我が国の労働者たちは、より良い条件と権利を求めてストライキを実行中だ。これが政府に新たな改革を導入させる圧力になるのは間違いない。"
 AST_veterans_revolt: "退役軍人の反乱"
 AST_veterans_revolt_desc: "軍には反共産主義者が数多くおり、その多くはかつてファシスト系組織の一員だった。彼らは共産主義を軽蔑しており、共産主義者が権力を握るぐらいなら武器を取るだろう。\n我々が革命の実現に時間をかけ過ぎた場合、または安定度を低下させ過ぎた場合、彼らは自らの手でそれを阻止するだろう。"
 AST_organize_in_nation: "§Y[FROM.GetName]§!の労働組合に潜入する"
 AST_organize_in_nation_desc: "労働運動に国境はない。同志たちのネットワークに資源を注ぎ込むことで、[FROM.GetName]の労働組合内に共産主義の組織者を根づかせ、労働者階級の内部から革命への草の根支持を築くことができる。"
 AST_civil_war_in_nation: "§Y[FROM.GetName]§!で革命を扇動"
 AST_civil_war_in_nation_desc: "我々の蒔いた種は実を結ぶ準備が整った。[FROM.GetName]における共産主義支持は、公然たる革命が手の届くところに来るまで成長した。資金、扇動者、そして慎重に時機を見極めた一押しがあれば、民衆の不満を武装蜂起へと変え、[FROM.GetName]をふさわしい労働者国家へ一歩近づけることができる。"
 AST_take_it_to_foreign_streets: "国際労働者連帯行進を組織する"
 AST_take_it_to_foreign_streets_desc: "労働者に国境はない。国際的な協調運動を開始し、すでに我々の影響力が根づいているすべての国の街頭にオーストラリアの共産主義組織者を送り込み、地元の運動を再活性化させ、革命の炎を燃やし続ける。"
 AST_take_it_to_foreign_streets_tt: "現在浸透済みのすべての国家において、「外国の共産主義者の影響」の有効期間を60日延長する。"
 AST_raj_locked_tt: "ニュージーランド、マラヤ、ビルマ、フィリピン、インドネシアのすべてが共産主義の統治下に入るまで、インド帝国を標的にすることはできない。"
 AST_supply_arms_to_nation: "§Y[FROM.GetName]§!に武器を供給する"
 AST_supply_arms_to_nation_desc: "同志たちに武器を供給する"
 AST_strikes_tt: "ストライキ実施中のみ、§Y$AST_workers_educational_association$§!、§Y$AST_off_leash$§!、§Y$AST_a_national_housing_commission$§!、§Y$AST_guaranteed_employment$§!、§Y$AST_equal_pay$§!を完了することができる。"
 AST_nationalization: "国有化の開始"
 AST_nationalizing_process_tt: "ディシジョン§Y「国有化の開始」§!を有効化し、§Y「国有化進行中」§!を適用する。このディシジョンは以下の国家方針に必要であり、§Y「人民のオーストラリア」§!を完了すると削除される。§Rその後、未選択の国家方針はすべてロックされる。§!"
