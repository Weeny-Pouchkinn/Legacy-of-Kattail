 SIA_public_credit_repayment: "公的信用返済"
 SIA_public_credit_repayment_tt: "公的信用債務を一括で全額返済し、すべての債務を解消する代わりに、一時的に大きな§Y消費財§!ペナルティを受ける。"
 idea_SIA_deficit_spending: "赤字財政"
 idea_SIA_deficit_spending_desc: "政府は身の丈を超えた支出を行い、加速する建設計画に借入資金をつぎ込んでいる。産業上の成果は確かだが、そのツケはいずれ支払わなければならない。"
 SIA_print_additional_money: "紙幣の増刷"
 SIA_print_additional_money_tt: "日本のためにさらに多くの紙幣を印刷する。"
 SIA_appeal_to_industrialists: "実業家への訴え"
 SIA_implement_industrialists_reforms_countdown: "実業家改革の実施"
 SIA_implement_industrialists_reforms_countdown_trigger: "§Y民需工場を2つ§!建設する（国家方針および貿易で獲得した工場を除く）"
 SIA_appeal_to_industrialists_tt: "実業家の支持を得る。\n\n彼らは内戦で我々を支援し、追加の装備を提供してくれる。一方、我々が産業基盤を拡大することを期待し、権力獲得から§Y720日§!以内に、内戦終了時に保有していた工場に加えて§Y民需工場§!をさらに§Y2つ§!建設する必要がある（国家方針および貿易で獲得した工場を除く）。\n\n達成できなければ、§Y安定度§!と§Y戦争協力度§!に打撃を受ける\n\n内戦勃発時に以下を獲得: "
 SIA_seek_support_from_constitutional_monarchists: "立憲君主主義者の支援を要請"
 SIA_implement_constitutionalist_reforms_countdown: "立憲主義改革を実行"
 SIA_seek_support_from_constitutional_monarchists_tt: "立憲君主主義者の支持を得る。\n\n彼らは内戦で我々を支援し、追加の師団を提供してくれる。一方、我々が立憲君主制を維持することを期待し、権力獲得から§Y720日§!以内に国家方針§Y$SIA_a_constitutional_monarchy$§!を完了させる必要がある。\n\n達成できなければ、§Y安定度§!と§Y戦争協力度§!に打撃を受ける"
 SIA_appeal_to_rural_people: "農村住民への訴え"
 SIA_appeal_to_rural_people_tt: "農村住民の支持を得る。\n\n彼らは内戦で我々を支援し、民兵を派兵してくれる。一方、見返りとして彼らに有利な農業政策を実施することを期待し、権力獲得から§Y720日§!以内に国家方針§Y$SIA_mechanization_of_agriculture$§!または§Y$SIA_reduction_of_agricultural_yield_taxes$§!のいずれかを完了させる必要がある。\n\n達成できなければ、§Y安定度§!と§Y戦争協力度§!に打撃を受ける\n\n内戦勃発時に以下を獲得: "
 SIA_implement_rural_reforms_countdown: "農村改革を実行"
 SIA_implement_absolutist_reforms_countdown: "絶対主義改革を実行"
 SIA_seek_support_from_absolutists_monarchists: "絶対君主主義者の支援を要請"
 SIA_seek_support_from_absolutists_monarchists_tt: "絶対君主主義者の支持を得る。\n\n彼らは内戦で我々を支援し、追加の師団を提供してくれる。一方、我々が絶対君主制に回帰することを期待し、権力獲得から§Y720日§!以内に国家方針§Y$SIA_an_absolute_monarchy$§!を完了させる必要がある。\n\n達成できなければ、§Y安定度§!と§Y戦争協力度§!に打撃を受ける"
 SIA_appeal_to_navy_clique: "海軍派閥への訴え"
 SIA_appeal_to_navy_clique_countdown: "海軍改革を実行"
 SIA_appeal_to_navy_clique_tt: "海軍派の支持を得る。\n\n彼らは内戦で我々を支援し、海軍全体と海兵隊1個師団を提供してくれる。ただし彼らは、権力獲得から§Y720日§!以内に国家方針§Y$SIA_thonburi_class_coastal_defense_ship$§!を完了し、自分たちに有利な海軍政策を実施するよう求めてくる。\n\n達成できなければ、§Y安定度§!と§Y戦争協力度§!が低下する。\n\n内戦開始時に以下を獲得:\n§Y海軍全体§!\n§Yタイ王国海兵隊§!の海兵隊師団\n§Y海兵隊§!技術"
 SIA_appeal_for_support_cat: "支持要請"
 SIA_appeal_for_support_cat_desc: "いかなる政治運動も単独では成功しない。君主主義者、立憲主義者、軍人、民間人はそれぞれ国家の一部に影響力を持っている。時が来たときに行動する力を得るためには、彼らの支持を慎重に育てなければならない。"
