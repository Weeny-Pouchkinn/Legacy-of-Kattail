 SIA_limited_war_cat: "限定戦争"
 SIA_limited_war_cat_desc: "この地域の大国に正面戦争で打ち勝つことは、まだ望めない。慎重に範囲を定めた作戦を通じて主張を少しずつ押し進めることで、相手の足場を削り取りながら、我々自身の力を高めていく。"
 SIA_start_limited_war_indochina: "インドシナで[FROM.GetName]に対する限定戦争を開始する"
 SIA_start_limited_war_indochina_tt_main: "§Y[FROM.GetName]§!に対して§Y限定戦争§!を開始する。\n§Y[FROM.GetName]§!に属するハイライトされたすべての州を支配すると、全面戦争に突入することなくこれらの州を獲得できる。\n§R降伏進捗を[?var:global.limited_war_surrender_threshold|%.0]を超えて失うと限定戦争に敗北する§!\n\n§R限定戦争に敗北すると、これまでに征服した領土の返還を余儀なくされる場合がある§!"
 SIA_start_limited_war_rejoin_faction: "現在所属する陣営を一時的に離脱し、§Y限定戦争§!の終了後に再加盟する。"
 SIA_start_limited_war_can_join_faction: "§Y限定戦争§!の終了後、再び陣営に加盟できる"
 is_not_engaged_in_a_limited_war: "§Y限定戦争§!を行っていない"
 SIA_limited_war_indochina: "[SIA_GetLimitedWarTarget]"
 SIA_limited_war_indochina_desc: "ハイライトされたすべての州を支配すると、§Y限定戦争§!に勝利し、全面戦争に発展させることなくそれらの州を獲得できる。\n§R降伏進捗が[?var:global.limited_war_surrender_threshold|%.0]を超えると、我々は限定戦争に敗北する。§!"
 SIA_limited_war_indochina_target: "§Y[?var:limited_war_target.GetName]§!との§Y限定戦争§!"
