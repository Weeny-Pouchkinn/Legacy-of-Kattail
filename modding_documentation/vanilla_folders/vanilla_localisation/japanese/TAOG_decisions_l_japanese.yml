 SIA_use_abandoned_french_tools: "放棄されたフランス製工具の活用"
 SIA_use_abandoned_french_tools_desc: "我々の占領地には、フランスが置き去りにした重機材がいくつか残されている。我々はそれらを自らのために活用できる。"
 SIA_fortress_saigon: "サイゴン要塞"
 SIA_fortress_saigon_desc: "我々の新帝国の北部はハノイが守る。北には山々、前面には紅河があり、あらゆる侵略者を食い止めるには絶好の立地である。"
 SIA_fortress_hanoi: "ハノイ要塞"
 SIA_fortress_hanoi_desc: "我々の新帝国の南部はサイゴンが守る。この要塞都市はバンコクの守護者となり、侵略者から[ROOT.GetName]湾を守る。"
