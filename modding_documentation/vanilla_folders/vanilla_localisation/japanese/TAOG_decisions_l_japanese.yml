 SIA_start_limited_war_malaysia_burma: "[FROM.GetName]との限定戦争を開始する"
 SIA_new_territories_administration_cat: "新領土統治"
 SIA_new_territories_administration_cat_desc: "征服は始まりに過ぎない。獲得した領土は、再征服を招く重荷ではなく、国家の恒久的な一部となるよう、統治・開発・防衛しなければならない。"
 SIA_finish_the_triangular_defense_network: "三角防衛網の完成"
 SIA_finish_the_triangular_defense_network_desc: "北部と南部の2つの要塞が完成すれば、それらをバンコクと結びつけて三角防衛網を構築できる。たとえひとつが陥落しても、残る拠点はなお機能し続ける。"
