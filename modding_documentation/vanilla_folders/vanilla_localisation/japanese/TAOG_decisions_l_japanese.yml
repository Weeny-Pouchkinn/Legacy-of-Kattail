 SIA_war_fervor_cat: "戦意"
 SIA_war_fervor_cat_desc: "民衆の戦争への熱狂は慎重に管理しなければならない。放置すれば、戦争熱は内側へ向かう。軍事的熱意を煽りながらその矛先を定めない政府は、自らが次の標的となる危険を負う。"
 SIA_war_fervor_coup_dummy: "戦意の沸騰"
 SIA_war_fervor_coup_dummy_desc: "はけ口のないまま民衆の戦意が沸騰すれば、その矛先は必然的に我々へ向けられることになる。"
 SIA_urge_restraint: "自制を促す"
 SIA_war_fervor_coup: "差し迫ったクーデター"
 SIA_modify_cultural_mandates: "$idea_SIA_thai_cultural_mandates$に以下の変更を加える:"
 SIA_mandate_1: "文化命令第1号"
 SIA_mandate_1_desc: "国家、国民および国籍の呼称は「タイ」とする。"
 SIA_mandate_1_tt: "§Y[THIS.GetName]§!は§Y$SIA_thailand$§!として知られるようになる"
 SIA_mandate_2: "文化命令第2号"
 SIA_mandate_2_desc: "タイ国民は、国家の利益と安全を考慮せずに、いかなる事業にも従事してはならない。\n\nタイ国民は、国家に損害を及ぼしかねないいかなる事柄も外国人に漏らしてはならない。これは国家への反逆である。\n\nタイ国民は、タイ国家の利益を考慮せずに外国人の代理人や代弁者として行動してはならず、国際紛争において外国人の意見を代弁したり、外国側に味方したりしてはならない。これらの行為は国家への反逆である。\n\nタイ国民は、国家を危険にさらすような形で、外国人に代わって土地を密かに購入してはならない。これらの行為は国家への反逆である。\n\n何者かが国家に反逆した場合、その行為を積極的かつ迅速に阻止することはタイ国民の義務である。"
 SIA_mandate_3: "文化命令第3号"
 SIA_mandate_3_desc: "タイ国民を、国籍の名称と一致しない呼称や、特定の集団の好みによる呼び方で呼んではならない。\n\nすべてのタイ国民を指す場合は、区別することなく「タイ」という名称を用いる。"
 SIA_mandate_4: "文化命令第4号"
 SIA_mandate_4_desc: "政府の慣例に従って国旗が掲揚または降納されるのを見たとき、敬礼ラッパや笛の音を聞いたとき、あるいは掲揚または降納の合図が出されたときは、規則または慣例に従って国旗に敬意を表さなければならない。\n\n国歌が聞こえたときは、それが公的な目的のために演奏される場合であれ、いかなる式典の一部として演奏される場合であれ、参加者または出席者は、規則あるいは慣例に従って国歌に敬意を表さなければならない。\n\n国旗、国歌、および国王賛歌に対して適切な敬意を払っていない者を見かけたときは、その者を戒め、これらに敬意を表すことの重要性を理解させなければならない。"
 SIA_mandate_5: "文化命令第5号"
 SIA_mandate_5_desc: "タイ国民は、タイ産品から作られた食品のみを消費するよう努めるべきである。\n\nタイ国民は、タイ産品から作られた衣類のみを着用するよう努めるべきである。\n\nタイ国民は、同胞たるタイ人による農業、商業、工業、その他の職業上の取り組みを支援すべきである。\n\nタイ国民は、政府またはタイ国民によって設立されたあらゆる公益事業を利用し、支援すべきである。\n\n本命令で支援される農業、商業、工業、その他の職業に従事するタイ国民は、水準を維持し、品質を向上させ、誠実に事業を営むよう努めなければならない。"
 SIA_mandate_6: "文化命令第6号"
 SIA_mandate_6_desc: "国歌の曲は、プラ・チェンドゥリヤンが作曲し、芸術局に保管されているものとする。\n\n国歌の歌詞は、陸軍が提出したものとする。"
 SIA_mandate_7: "文化命令第7号"
 SIA_mandate_7_desc: "すべてのタイ国民は国家建設に尽力しなければならない。働くことのできる者はすべて定職に就かなければならない。職を持たない者は国家にとって無益であり、タイ国民から尊敬されるに値しない。"
 SIA_mandate_8: "文化命令第8号"
 SIA_mandate_8_desc: "国王賛歌については、その歌詞を短縮し、「シャム」という語を「タイ」に置き換えるものとする。"
 SIA_mandate_9: "文化命令第9号"
 SIA_mandate_9_desc: "タイ国民はタイ語を称え、尊重し、敬意を払い、それを話すことを名誉に感じなければならない。\n\nタイ国民は、国語を学ぶことを善良な市民の義務と考え、少なくとも読み書きができなければならない。また、タイ国民は、タイ語を話せない、あるいはタイ語を読めない者がこれを学べるよう助け、支援することを重要な義務と考えなければならない。\n\nタイ国民は、出生地、居住地、または地域の訛りを分断の印とみなしてはならない。タイ国民として生まれた者はすべて、同じタイの血を引き、同じタイ語を話すということを真実として受け止めなければならない。出生地や訛りに違いはない。\n\nタイ国民は、善良なタイ市民として振る舞うことを自らの義務と考え、その義務をまだ知らず理解していない者に対しては、善良なタイ国民の義務とは何かを説き、導かなければならない。"
 SIA_mandate_10: "文化命令第10号"
 SIA_mandate_10_desc: "タイ国民は、適切な服装をせずに、公の集会、公共の場所、または市内に姿を現してはならない。不適切な服装には、下着だけの格好、上半身裸、腰布の着用が含まれる。\n\nタイ国民にふさわしい服装とは、制服（立場と機会が許す場合）、きちんとした洋装、きちんとした伝統衣装である。"
 SIA_mandate_11: "文化命令第11号"
 SIA_mandate_11_desc: "タイ国民は、自分の時間を3つに分けるべきである。すなわち、仕事、私的活動、休息と睡眠のための時間である。これが習慣になるまでは、規則正しく日課に従って過ごすべきである。\n\nタイ国民は、通常の私的活動を次のように行うべきである。食事は決まった時刻に取り、1日に4回を超えてはならない。睡眠はおよそ6～8時間とする。\n\nタイ国民は、落胆したり怠けたりすることなく、忠実に職務を果たすべきである。正午の休憩と昼食の時間は1時間を超えてはならない。勤務の終わりには、少なくとも1時間はスポーツなどで運動するか、あるいは園芸、ペットの世話、植樹などの活動を行うべきである。その後、入浴してから夕食を取る。\n\nタイ国民は、夜の自由時間を、必要な仕事の完了、家族や友人との会話、ラジオのニュースを聞いたり読書をしたりして知識を求めること、あるいは機会があればその他の娯楽や芸術に充てるべきである。"
 SIA_mandate_12: "文化命令第12号"
 SIA_mandate_12_desc: "公共の場所や路上では、子ども、高齢者、障がい者を助け、守るべきである。\n\n第1項に従う者は、タイ国民の尊敬に値する教養ある人物とみなされる。"
 SIA_movie_theater_cat: "$SIA_sala_chaloem_thai_movie_theater$"
 SIA_movie_theater_cat_desc: "銀幕は現代国家にとって最も強力な道具の一つである。厳選された映画とプロパガンダ運動を通じて、政府は世論を形成し、愛国心を煽り、反対の声をかき消すことができる。"
