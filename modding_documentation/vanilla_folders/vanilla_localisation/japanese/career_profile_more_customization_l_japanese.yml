 CAREER_PROFILE_I_AM_INEVITABLE: "私は絶対だ"
 CAREER_PROFILE_I_AM_INEVITABLE_DESCRIPTION: "数週間、毎週最低でも1プロヴィンス獲得する。"
 CAREER_PROFILE_FINESSE_IS_FASTER: "ズルした方が早い"
 CAREER_PROFILE_FINESSE_IS_FASTER_DESCRIPTION: "一定日数以上、暗号解読を行いつつも「暗号奪取」作戦の結果を復号情報から消去する。"
 CAREER_PROFILE_CARGO_EMBARGO: "貨物の禁輸"
 CAREER_PROFILE_CARGO_EMBARGO_DESCRIPTION: "一定数の国家に禁輸措置を課す。"
 CAREER_PROFILE_PRODUCTION_IS_POWER: "生産は力なり"
 CAREER_PROFILE_PRODUCTION_IS_POWER_DESCRIPTION: "一定数の民需工場、あるいは軍需工場を新たに建設する。"
 CAREER_PROFILE_ENGINEERING_BEHEMOTH_MEDAL: "エンジニアリングの巨人"
 CAREER_PROFILE_ENGINEERING_BEHEMOTH_MEDAL_DESCRIPTION: "一定以上の装甲評価がつく戦車を設計し、その戦車を1000両以上配備する。"
 CAREER_PROFILE_CASTLES_IN_THE_AIR_MEDAL: "空飛ぶ城"
 CAREER_PROFILE_CASTLES_IN_THE_AIR_MEDAL_DESCRIPTION: "一定の対空防御力を誇る航空機を設計し、その航空機の航空団（100機）を配備する。"
 CAREER_PROFILE_EXPERIMENTAL_SCIENCE_MASTERY: "実験的科学精通者"
 CAREER_PROFILE_EXPERIMENTAL_SCIENCE_MASTERY_DESCRIPTION: "1945年の終わりまでに以下の数の特別計画を完了する。"
 CAREER_PROFILE_RACE_FOR_THE_BOMB: "新型爆弾の開発競争"
 CAREER_PROFILE_RACE_FOR_THE_BOMB_DESCRIPTION: "核攻撃を成功させる:"
 CAREER_PROFILE_KNOWLEDGE_IS_POWER: "知識は力なり"
 CAREER_PROFILE_KNOWLEDGE_IS_POWER_DESCRIPTION: "以下の人数以上の熟練した科学者を持つ"
 CAREER_PROFILE_GRAND_STRATEGIKON_MEDAL: "戦略大全"
 CAREER_PROFILE_GRAND_STRATEGIKON_MEDAL_DESCRIPTION: "一定数のサブドクトリンを習得する"
 CAREER_PROFILE_PACTWEAVER_MEDAL: "契約紡ぎ"
 CAREER_PROFILE_PACTWEAVER_MEDAL_DESCRIPTION: "一定割合の陣営マニフェストを有する"
 CAREER_PROFILE_OVERACHIEVER_MEDAL: "頑張り屋"
 CAREER_PROFILE_OVERACHIEVER_MEDAL_DESCRIPTION: "一定数の陣営の長期目標を達成する"
 CAREER_PROFILE_BOATS_UP_MEDAL: "ボーツ・アップ"
 CAREER_PROFILE_BOATS_UP_MEDAL_DESCRIPTION: "艦長を提督に昇格させ、以下のスキルレベルに到達させる。"
 CAREER_PROFILE_POLISH_MY_HQ_MEDAL: "司令部を磨け"
 CAREER_PROFILE_POLISH_MY_HQ_MEDAL_DESCRIPTION: "生産コストが以下の値以上の陸軍司令部を配備する:"
 CAREER_PROFILE_DIRTY_MATH_MEDAL: "汚い計算"
 CAREER_PROFILE_DIRTY_MATH_MEDAL_DESCRIPTION: "敵指揮官を捕らえ、そのスキルレベルの合計を以下の数値以上にする。"
