l_japanese:
 operation_rescue_general: "捕虜となった指揮官の救出"
 operation_rescue_general_desc: "§L我が国の指揮官の一人が敵に捕らえられ、捕虜になっている。救出作戦を実行しなければならない。§!"
 free_general_free_in_transit: "輸送中の解放"
 free_general_free_in_transit_desc: "捕虜の移送が迫っていることを突き止めた我々の工作員が、移送経路上での奇襲を計画する。"
 free_general_assault_holding_area: "収容区域の強襲"
 free_general_assault_holding_area_desc: "敵は我が軍の指揮官を厳重に警備された場所に拘束しており、その位置は工作員によって特定された。捕らわれた指揮官を救出するため、工作員は大胆な襲撃を準備する。"
 free_general_disguise_and_extract: "変装と救出"
 free_general_disguise_and_extract_desc: "工作員は巧みな策略を用い、捕らえられた指揮官の変装を手助けすることで、敵を欺き友軍領土へ脱出できるようにする。"
