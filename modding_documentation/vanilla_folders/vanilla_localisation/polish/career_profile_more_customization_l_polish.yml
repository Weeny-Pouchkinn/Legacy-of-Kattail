 CAREER_PROFILE_QUALITY_OVER_QUANTITY_DESCRIPTION: "Uzyskaj korzystną relację strat po zadaniu wrogowi strat wynoszących co najmniej milion ludzi."
 CAREER_PROFILE_BRAINS_AND_BRUTE_FORCE_MEDAL: "Mądrość i brutalna siła"
