 #Ribbons
 CAREER_PROFILE_SYNTHETIC_SECURITY: "Syntetyczne bezpieczeństwo"
 CAREER_PROFILE_SYNTHETIC_SECURITY_DESCRIPTION: "Zyskaj ponad 30 jednostek gumy ze sztucznych źródeł (rafinerie materiałów syntetycznych)"
 CAREER_PROFILE_SYNTHETIC_SECURITY_QUOTE: "\"Gdyby kobiety w fabrykach przestały pracować na 20 minut, alianci przegraliby wojnę\".\n\n- Marszałek polny i głównodowodzący Joseph Joffre, I wojna światowa."
 CAREER_PROFILE_RUBBER_BARON: "Baron gumy"
 CAREER_PROFILE_RUBBER_BARON_DESCRIPTION: "Posiadaj co najmniej 1000 jednostek gumy i gospodarkę zamkniętą."
 CAREER_PROFILE_RUBBER_BARON_QUOTE: "\"(...) zdobycie kluczowych regionów produkcji gumy na Dalekim Wschodzie w 1942 r. pozbawiło świat źródeł 90% produkcji naturalnej gumy\".\n\n- The Southern Economic Journal, styczeń 1947 r."
 CAREER_PROFILE_THE_TRUCK_WILL_ALWAYS_GET_THROUGH: "Ciężarówka zawsze przejedzie"
 CAREER_PROFILE_THE_TRUCK_WILL_ALWAYS_GET_THROUGH_DESCRIPTION: "Ponad 5000 twoich ciężarówek z zaopatrzeniem musi dostarczyć zapasy twoim armiom."
 CAREER_PROFILE_THE_TRUCK_WILL_ALWAYS_GET_THROUGH_QUOTE: "\"Mówiono, że bombowiec zawsze się przebije. Ale na miejscu były już ciężarówki”.\n\n- autor nieznany"
 CAREER_PROFILE_MARE_NOSTRUM: "Mare Nostrum"
 CAREER_PROFILE_MARE_NOSTRUM_DESCRIPTION: "Zyskaj dominację na morzu w sześciu głównych regionach Morza Śródziemnego, z których co najmniej jeden jest sporny."
 CAREER_PROFILE_MARE_NOSTRUM_QUOTE: "\"Kiedy zgubiłem karabin, armia policzyła mi za to 85 dolarów. Właśnie dlatego w marynarce kapitan idzie na dno razem z okrętem\".\n\n- Dick Gregory"
 CAREER_PROFILE_BLITZ_THIS: "To jest szybkość..."
 CAREER_PROFILE_BLITZ_THIS_DESCRIPTION: "Wybierz elastyczną obronę jako ulubioną strategię generała, marszałka polnego lub kraju."
 CAREER_PROFILE_BLITZ_THIS_QUOTE: "\"Naciągnij szeregi niczym łucznik napinający łuk, a potem puść\".\n\n- Autor nieznany"
 CAREER_PROFILE_SCORCHED_EARTH: "Spalona ziemia"
 CAREER_PROFILE_SCORCHED_EARTH_DESCRIPTION: "Wysadzaj tory kolejowe, używając taktyki \"spalonej ziemi\", by spowolnić wrogie natarcie."
 CAREER_PROFILE_SCORCHED_EARTH_QUOTE: "\"(...) w ręce wroga nie może wpaść żadna lokomotywa ani wagon pasażerski, ani gram zboża albo choćby litr paliwa\".\n\n- Józef Stalin, przemówienie radiowe, 3 lipca 1941 r."
 CAREER_PROFILE_RULED_BY_FURNITURE: "Rządzeni przez meble!"
 CAREER_PROFILE_RULED_BY_FURNITURE_DESCRIPTION: "Nie posiadaj ani jednej osoby ani grupy ludzi opisywanych jako kierujący twoim krajem."
 CAREER_PROFILE_RULED_BY_FURNITURE_QUOTE: "\"Martwienie się jest jak fotel bujany, masz dzięki niemu jakieś zajęcie, ale do niczego nie dochodzisz\".\n\n– Stare angielskie przysłowie"
 CAREER_PROFILE_THE_THOUSAND_YEAR_BOND: "Tysiącletnia więź"
 CAREER_PROFILE_THE_THOUSAND_YEAR_BOND_DESCRIPTION: "Rozmieść sto batalionów kawalerii lub piechoty z wielbłądami."
 CAREER_PROFILE_THE_THOUSAND_YEAR_BOND_QUOTE: "\"Koń kawaleryjski musi mieć w sobie odrobinę szaleństwa, a jego jeździec powinien być kompletnym wariatem\".\n\n- Steven Pressfield"
 CAREER_PROFILE_ROCKETS_REIGN: "Rządy rakiet"
 CAREER_PROFILE_ROCKETS_REIGN_DESCRIPTION: "Zbuduj ponad 10 ośrodków rakietowych."
 CAREER_PROFILE_ROCKETS_REIGN_QUOTE: "\"Rakieta działała idealnie, jednak wylądowała na niewłaściwej planecie\".\n\n- Wernher Von Braun"
 CAREER_PROFILE_STEEL_AT_HIGH_SPEED: "Rozpędzona stal"
 CAREER_PROFILE_STEEL_AT_HIGH_SPEED_DESCRIPTION: "Rozmieść ponad 4000 czołgów o prędkości maksymalnej większej niż 12 km/h."
 CAREER_PROFILE_STEEL_AT_HIGH_SPEED_QUOTE: "\"Jeżeli wydaje ci się, że masz wszystko pod kontrolą, to za wolno jedziesz\".\n\n- Mario Andretti"
 CAREER_PROFILE_ORCHESTRA_OF_BOOM: "Grzmiąca orkiestra"
 CAREER_PROFILE_ORCHESTRA_OF_BOOM_DESCRIPTION: "Rozmieść dywizję posiadającą co najmniej jeden batalion przeciwlotniczy, artylerii rakietowej i przeciwpancerny, wspierane przez kompanię sygnalizacyjną."
 CAREER_PROFILE_ORCHESTRA_OF_BOOM_QUOTE: "\n\"Prawdziwa kakofonia dźwięków zlewających się w jeden ogłuszający ryk, ryk pociągu w tunelu, wzmocniony po milionkroć\".\n\n- Arnold D. Harvey"
 CAREER_PROFILE_TASK_FAILED_SUCCESSFULLY: "Udało się nie wykonać zadania"
 CAREER_PROFILE_TASK_FAILED_SUCCESSFULLY_DESCRIPTION: "Nie wykonaj uderzenia, mając co najmniej 80% szans powodzenia."
 CAREER_PROFILE_TASK_FAILED_SUCCESSFULLY_QUOTE: "\"Atak ten należy określić jako rozpoznanie bojem... Przed rozpoczęciem działań na o wiele większą skalę musieliśmy zgromadzić wszystkie niezbędne informacje...\"\n\n- Winston Churchill o rajdzie na Dieppe, 8 września 1942 r."
 CAREER_PROFILE_PUNCH_IT: "Gaz do dechy!"
 CAREER_PROFILE_PUNCH_IT_DESCRIPTION: "Dokonaj udanego uderzenia na placówkę jądrową, gdy kontrolujesz co najmniej jeden sąsiadujący z nią region."
 CAREER_PROFILE_PUNCH_IT_QUOTE: "\"Dla dobra życia narodów należało przywrócić armii gotowość do umierania\"\n\n - Aleksander Kiereński o ofensywie czerwcowej"
 CAREER_PROFILE_PLAN_L: "Plan L"
 CAREER_PROFILE_PLAN_L_DESCRIPTION: "Zaczynając jako kraj śródlądowy, zrealizuj 2 morskie projekty specjalne, zbuduj 10 niszczycieli, 5 krążowników, 2 pancerniki i 1 lotniskowiec."
 CAREER_PROFILE_PLAN_L_QUOTE: "\"Marynarka wojenna potrzebuje trzech lat na zbudowanie okrętu. Zbudowanie nowej tradycji zajmuje trzysta lat. Ewakuacja będzie trwała dalej\".\n\n - Andrew Cunningham o ewakuacji Krety"
 CAREER_PROFILE_SWEETENER_HEXADECAGON: "Słodki szesnastokąt"
 CAREER_PROFILE_SWEETENER_HEXADECAGON_DESCRIPTION: "Zbadaj 16 technologii odblokowywanych przez projekty specjalne"
 CAREER_PROFILE_SWEETENER_HEXADECAGON_QUOTE: "\"Kiedy przedstawiłem te obliczenia, obawialiśmy się, że możemy zapoczątkować reakcję łańcuchową, która może zniszczyć cały świat\".\n\n - Robert Oppenheimer, Oppenheimer"
 CAREER_PROFILE_ISLAND_HOPPER: "Wyspowy skoczek"
 CAREER_PROFILE_ISLAND_HOPPER_DESCRIPTION: "Przejmij kontrolę nad 10 strategicznymi miejscami"
 CAREER_PROFILE_ISLAND_HOPPER_QUOTE: "\"Chcesz przeżyć?! Uciekaj z plaży\"\n\n- John Basilone, \"Pacyfik\""
 CAREER_PROFILE_IM_THE_CAPTAIN_NOW: "Teraz ja jestem kapitanem"
 CAREER_PROFILE_IM_THE_CAPTAIN_NOW_DESCRIPTION: "Przejmij dowództwo nad frakcją jako pomniejsze państwo"
 CAREER_PROFILE_IM_THE_CAPTAIN_NOW_QUOTE: "\"Spójrz, teraz ja jestem kapitanem\".\n\n- Muse, \"Kapitan Philips\""
 CAREER_PROFILE_THREE_MUSKETEERS: "Trzech muszkieterów"
 CAREER_PROFILE_THREE_MUSKETEERS_DESCRIPTION: "Stwórz trzy teatry frakcji obsadzone przez twoich oficerów"
 CAREER_PROFILE_THREE_MUSKETEERS_QUOTE: "\"Jeden za wszystkich, wszyscy za jednego. Zjednoczeni zwyciężamy, podzieleni upadamy”.\n\n- Alexander Dumas"
 CAREER_PROFILE_THE_MORE_THE_MERRIER: "Im więcej, tym lepiej"
