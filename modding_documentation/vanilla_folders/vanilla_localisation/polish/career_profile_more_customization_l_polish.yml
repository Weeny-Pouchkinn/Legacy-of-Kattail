 CAREER_PROFILE_I_AM_INEVITABLE: "Jestem nieuniknionym"
 CAREER_PROFILE_I_AM_INEVITABLE_DESCRIPTION: "Przez określoną liczbę tygodni zdobywaj co najmniej jedną prowincję tygodniowo."
 CAREER_PROFILE_FINESSE_IS_FASTER: "Finezja to szybkość"
 CAREER_PROFILE_FINESSE_IS_FASTER_DESCRIPTION: "Podczas łamania jednego szyfru, operacja \"Zdobądź szyfr\" odejmuje więcej niż pewną liczbę dni od czasu potrzebnego na rozszyfrowanie."
 CAREER_PROFILE_CARGO_EMBARGO: "Embargo towarowe"
 CAREER_PROFILE_CARGO_EMBARGO_DESCRIPTION: "Nałóż embargo na określoną liczbę krajów."
 CAREER_PROFILE_PRODUCTION_IS_POWER: "Produkcja to siła"
 CAREER_PROFILE_PRODUCTION_IS_POWER_DESCRIPTION: "Zbuduj określoną liczbę nowych fabryk cywilnych i wojskowych."
 CAREER_PROFILE_ENGINEERING_BEHEMOTH_MEDAL: "Behemot inżynierii"
 CAREER_PROFILE_ENGINEERING_BEHEMOTH_MEDAL_DESCRIPTION: "Zaprojektuj czołg o określonym współczynniku pancerza i wprowadź do służby co najmniej 1000 sztuk."
 CAREER_PROFILE_CASTLES_IN_THE_AIR_MEDAL: "Podniebne zamki"
 CAREER_PROFILE_CASTLES_IN_THE_AIR_MEDAL_DESCRIPTION: "Zaprojektuj samolot o określonym współczynniku obrony przeciwlotniczej i wprowadź do służby co najmniej pełne skrzydło (100 maszyn)."
 CAREER_PROFILE_EXPERIMENTAL_SCIENCE_MASTERY: "Biegłość w nauce eksperymentalnej"
 CAREER_PROFILE_EXPERIMENTAL_SCIENCE_MASTERY_DESCRIPTION: "Przed końcem 1945 r. ukończ następującą liczbę projektów specjalnych."
 CAREER_PROFILE_RACE_FOR_THE_BOMB: "Wyścig atomowy"
 CAREER_PROFILE_RACE_FOR_THE_BOMB_DESCRIPTION: "Przeprowadź udany atak jądrowy przed następującym terminem:"
 CAREER_PROFILE_KNOWLEDGE_IS_POWER: "Wiedza to potęga"
 CAREER_PROFILE_KNOWLEDGE_IS_POWER_DESCRIPTION: "Posiadaj co najmniej poniższą liczbę doświadczonych naukowców"
 CAREER_PROFILE_GRAND_STRATEGIKON_MEDAL: "Wielki Strategikon"
 CAREER_PROFILE_GRAND_STRATEGIKON_MEDAL_DESCRIPTION: "Opanuj określoną liczbę doktryn dodatkowych."
 CAREER_PROFILE_PACTWEAVER_MEDAL: "Tkanie paktów"
 CAREER_PROFILE_PACTWEAVER_MEDAL_DESCRIPTION: "Uzyskaj określony stopień ukończenia manifestu frakcji."
 CAREER_PROFILE_OVERACHIEVER_MEDAL: "Przesadna ambicja"
 CAREER_PROFILE_OVERACHIEVER_MEDAL_DESCRIPTION: "Ukończ określoną liczbę długoterminowych celów frakcji."
 CAREER_PROFILE_BOATS_UP_MEDAL: "Okręty górą"
 CAREER_PROFILE_BOATS_UP_MEDAL_DESCRIPTION: "Awansuj kapitana okrętu na admirała i osiągnij poniższy poziom umiejętności."
 CAREER_PROFILE_POLISH_MY_HQ_MEDAL: "Szlifowanie sztabu"
 CAREER_PROFILE_POLISH_MY_HQ_MEDAL_DESCRIPTION: "Rozmieść sztab armii, którego koszt produkcji wynosi co najmniej"
 CAREER_PROFILE_DIRTY_MATH_MEDAL: "Brudna matematyka"
 CAREER_PROFILE_DIRTY_MATH_MEDAL_DESCRIPTION: "Weź do niewoli wrogich dowódców, których suma poziomów umiejętności jest co najmniej równa podanej liczbie."
