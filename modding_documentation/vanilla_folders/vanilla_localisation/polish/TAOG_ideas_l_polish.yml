 ############
 idea_SIA_civilian_full_support: "Skrzydło cywilne: §Gpełne wsparcie§!"
 idea_SIA_civilian_full_support_desc: "Skrzydło cywilne niezachwianie wspiera rząd. Administratorzy i technokraci wykorzystują swoje doświadczenie, by napędzać dalszy rozwój kraju."
 idea_SIA_civilian_slight_support: "Skrzydło cywilne: niewielkie wsparcie"
 idea_SIA_civilian_slight_support_desc: "Skrzydło cywilne w dużej mierze wspiera kierunki działania rządu. Ich współpraca przynosi skromne, ale namacalne korzyści."
 idea_SIA_civilian_neutral: "Skrzydło cywilne: neutralność"
 idea_SIA_civilian_neutral_desc: "Skrzydło cywilne nie wspiera rządu, ale nie przeszkadza w jego działaniach. Administracja działa, ale bez dodatkowego impulsu wynikającego z politycznej zgody."
 idea_SIA_civilian_opposition: "Skrzydło cywilne: opozycja"
 idea_SIA_civilian_opposition_desc: "Skrzydło cywilne zwróciło się przeciwko rządowi. Urzędnicy działają wolno, a budżety są źle realizowane, co uniemożliwia sprawne funkcjonowanie machiny państwowej."
 idea_SIA_civilian_rebellious: "Skrzydło cywilne: §Rbunt§!"
 idea_SIA_civilian_rebellious_desc: "Skrzydło cywilne otwarcie się buntuje. Destabilizacja nasila się, z każdym dniem rośnie ryzyko rozłamu politycznego."
 idea_SIA_military_full_support: "Skrzydło militarne: §Gpełne wsparcie§!"
 idea_SIA_military_full_support_desc: "Skrzydło militarne niezachwianie wspiera rząd. Oficerowie wspierają akcje werbunkowe i produkcję uzbrojenia, kierując zasoby armii na realizację celów narodowych."
 idea_SIA_military_slight_support: "Skrzydło militarne: niewielkie wsparcie"
 idea_SIA_military_slight_support_desc: "Skrzydło militarne w dużej mierze współpracuje z rządem. Choć nie jest to pełne zaangażowanie, poparcie udzielane przez tych oficerów przynosi skromne korzyści na polu działań werbunkowych oraz produkcji."
 idea_SIA_military_neutral: "Skrzydło militarne: neutralność"
 idea_SIA_military_neutral_desc: "Skrzydło militarne nie zajęło żadnego stanowiska. Armia wykonuje swoje obowiązki bez entuzjazmu czy oporu i czeka na rozwój wypadków."
 idea_SIA_military_opposition: "Skrzydło militarne: opozycja"
 idea_SIA_military_opposition_desc: "Skrzydło militarne działa przeciwko rządowi. Oficerowie podkopują działania na rzecz zwiększenia produkcji, a w szeregach armii słabnie entuzjazm wobec pracy władz cywilnych."
 idea_SIA_military_rebellious: "Skrzydło militarne: §Rbunt§!"
 idea_SIA_military_rebellious_desc: "Skrzydło militarne jest o krok od otwartego oporu. Pobór jest sabotowany, produkcja broni maleje, pojawiło się widmo przewrotu."
 idea_SIA_defenders_of_constitutional_liberty: "Obrońcy wolności konstytucyjnej"
 idea_SIA_civil_service_heroism_1: "Heroizm służby cywilnej"
 idea_SIA_civil_service_heroism_1_desc: "Służba cywilna stanęła na wysokości zadania, jej zaangażowanie i doświadczenie pozwoliło zwiększyć tempo badań naukowych oraz rozwoju państwa."
 idea_SIA_civil_service_heroism_2: "$idea_civil_service_heroism_1$"
 idea_SIA_civil_service_heroism_2_desc: "$idea_SIA_civil_service_heroism_1_desc$"
 idea_SIA_redirected_military_funds: "Przekierowanie funduszy wojskowych"
 idea_SIA_thai_irredentism: "Tajski irredentyzm"
 idea_SIA_oss_special_forces_training: "Szkolenie sił specjalnych OSS"
 idea_SIA_seized_japanese_funds: "Przejęto japońskie fundusze"
 idea_SIA_seized_japanese_funds_desc: "Umowa z Japończykami została zerwana, zatem pozostawione przez nich fundusze i zapasy należą do nas. Możemy wykorzystać je do zwiększenia wydajności sektora przemysłowego i budowlanego."
 idea_SIA_oss_special_forces_training_desc: "Nasi agenci zostali wyszkoleni w OSS do prowadzenia działań sabotażowych, przenikania oraz działań powietrznodesantowych. Dzięki tym kursom nasze siły specjalne stały się potężnym narzędziem."
 idea_SIA_sold_privy_purse_lands: "Sprzedane ziemie korony"
 idea_SIA_sold_privy_purse_lands_desc: "Sprzedaż ziem należących do korony dała państwu zastrzyk kapitału, który osłabił presję gospodarczą oraz pozwolił pozyskać zasoby niezbędne do rozbudowy."
 idea_SIA_war_fervor: "Gorączka wojenna"
 idea_SIA_bloodlusted_irredentism: "Żądny krwi irredentyzm"
 idea_SIA_bloodlusted_irredentism_desc: "Ambicje terytorialne stały się bardziej agresywne. Armia walczy w przekonaniu, że odzyskuje to, co słusznie należy się jej ojczyźnie."
 idea_SIA_the_royal_police_counterweight: "Sojusz z Policją Królewską"
 idea_SIA_civilian_technocrats_in_institutions: "Cywilni technokraci"
 idea_SIA_civilian_technocrats_in_institutions_desc: "Eksperci cywilni zatrudnieni w kluczowych instytucjach państwa sprawili, że zwiększyło się wydobycie surowców, a także wydajność osób zajmujących stanowiska polityczne."
 idea_SIA_yuvachon: "Yuvachon"
 idea_SIA_yuvachon_desc: "Ruch Yuvachon uczy młodych rodaków dyscypliny wojskowej, buduje zasób wyszkolonych ludzi i podsyca nacjonalistyczne sympatie."
 idea_SIA_yuvachon_2: "$idea_SIA_yuvachon$"
 idea_SIA_yuvachon_2_desc: "$idea_SIA_yuvachon_desc$"
 idea_SIA_rebuilding_the_war_torn_economy: "Odbudowa gospodarki zniszczonej przez wojnę"
 idea_SIA_specialist_marine_forces: "Specjalistyczne jednostki Piechoty Morskiej"
 idea_SIA_specialist_marine_forces_desc: "Kadra oddanych specjalistów desantu morskiego została wyszkolona i wyposażona do prowadzenia uderzeń na wrogie wybrzeża."
 idea_SIA_rehabilitated_military: "Zrehabilitowane wojsko"
 idea_SIA_desperate_gambit: "Desperacki gambit"
 idea_SIA_desperate_gambit_desc: "Może istnieje droga wyjścia z dziury, w której się znajdujesz. Do góry!"
 idea_SIA_purged_senior_military: "Dokonano czystki starszych oficerów"
 idea_SIA_purged_senior_military_desc: "Starsi oficerowie uważani za zagrożenie dla rządu zostali usunięci z zajmowanych stanowisk. Utrata doświadczonych dowódców odcisnęła piętno na spójności armii oraz rozwoju zawodowym żołnierzy."
 idea_SIA_cemented_control: "Umocniono kontrolę"
 idea_SIA_cemented_control_desc: "Rząd wzmocnił kontrolę nad instytucjami państwa. Opozycja polityczna została zmarginalizowana, a machina władzy działa teraz na korzyść rządzących."
 idea_SIA_cemented_control_2: "Ugruntowano kontrolę"
 idea_SIA_cemented_control_2_desc: "$idea_SIA_cemented_control_desc$"
 idea_SIA_cemented_control_3: "Ustawa o obowiązkach Tajlandii w wojnie"
 idea_SIA_cemented_control_3_desc: "Jeśli kiedykolwiek wojna zagrozi suwerenności Królestwa i jego mieszkańców, obowiązkiem każdego szanującego się Taja jest stawienie okupantowi oporu wszelkimi możliwymi środkami, czy to zbrojnie, czy w inny sposób."
 idea_SIA_suspend_ordinary_legal_procedures: "Zawieszono zwykłe procedury prawne"
 idea_SIA_thai_cultural_mandates: "Tajskie dekrety kulturowe"
 idea_SIA_military_humiliation: "Upokorzenie wojska"
 idea_SIA_death_defiant: "Opieranie się śmierci"
 idea_SIA_death_defiant_desc: "My już nie żyjemy. Jeśli potrafisz, przyjdź i weź, co ci się należy."
 idea_SIA_songsuradet_ascendant_0: "Potomek Songsuradeta"
 idea_SIA_songsuradet_ascendant_0_desc: "Phraya Songsuradet zdołał przetrwać pomyślnie gniew rządu, umocnić swoją bazę i zwiększyć swoją siłę. Ludzie mawiają teraz, że jest nietykalny - jego pozycja jest zbyt wysoka i umocniona, by można się było go pozbyć.\nMożna oczekiwać, że będzie wtrącał się w politykę rządu i spowalniał podejmowanie decyzji, by znów nie stać się celem czystki."
