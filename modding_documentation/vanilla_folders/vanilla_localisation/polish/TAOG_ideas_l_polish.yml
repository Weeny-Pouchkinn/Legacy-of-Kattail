 AST_faction_training_initiative_idea_1: "Program szkoleń"
 AST_faction_training_initiative_idea_1_desc: "Program wspólnego szkolenia obronnego na Pacyfiku to program współpracy członków zapewniający wszystkim żołnierzom sojuszu równie rygorystyczne szkolenie wojskowe."
