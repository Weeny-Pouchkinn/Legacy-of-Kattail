 AST_anti_fascist_measures: "Zapobieganie faszyzmowi"
 AST_anti_fascist_measures_desc: "Faszyzm nie zdążył jeszcze zakorzenić się w Australii i siły demokratyczne chcą, by tak pozostało. Wydział śledczy Wspólnoty będzie monitorował i zatrzymywał wszystkie podejrzane osoby, aby zapobiec wzrostowi wpływów faszystowskich ugrupowań."
 ABDA_corps_expeditionnaire_spirit: "Corps Expéditionnaire"
 ABDA_corps_expeditionnaire_spirit_desc: "Francuskie siły wysłane na front na Pacyfiku zostały zahartowane podczas służby w koloniach i przywykły do działania w trudnych warunkach z dala od ojczyzny. Doświadczenie zdobyte w walkach w Azji Południowo-Wschodniej pozwala im szczególnie dobrze orientować się w japońskiej taktyce i ukształtowaniu terenu, dzięki czemu mogą skutecznie odpierać natarcia wroga."
 ABDA_maintain_strategic_flexibility_spirit: "Elastyczność strategiczna"
 ABDA_maintain_strategic_flexibility_spirit_desc: "Amerykańska produkcja przemysłowa jest kierowana na front na Pacyfiku, a tempo prac stoczniowych zostało przyspieszone, aby utrzymać flotę zdolną do wywierania wpływu na całym oceanie. Nie angażując się nadmiernie na żadnym z frontów, Stany Zjednoczone zapewniają sobie możliwość wykorzystania swojej potęgi morskiej wszędzie tam, gdzie wymaga tego sytuacja."
 AST_toe_the_line_spirit: "Karnie w szeregu"
 AST_toe_the_line_spirit_desc: "Państwo wezwało obywateli do poświęceń i ci odpowiedzieli na to wezwanie. Racjonowanie żywności, wydłużenie godzin pracy oraz przekierowanie produkcji cywilnej na potrzeby działań wojennych pozwoliły uwolnić zasoby, których rząd nie miał możliwości pozyskać w inny sposób. Jest to dotkliwe rozwiązanie, które nie cieszy się powszechną popularnością."
