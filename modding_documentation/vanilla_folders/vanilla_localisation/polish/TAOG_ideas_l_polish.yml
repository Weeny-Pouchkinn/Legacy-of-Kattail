 idea_SIA_debt_repayment: "Spłata długu"
 idea_SIA_debt_repayment_desc: "Odczuwamy koszty obsługi deficytu budżetowego. Dochód trafia do kredytodawców i nie jesteśmy w stanie dłużej utrzymać tempa budowy napędzanego niegdyś dzięki pożyczkom."
 idea_SIA_an_unceasy_alliance: "Niepewny sojusz"
 idea_SIA_an_unceasy_alliance_desc: "Sojusz trwa dalej, ale widać w nim coraz większe zmęczenie. Wątpliwości wewnątrz rządu powodują, że kraj zaczyna schodzić na bardziej neutralny kurs."
 idea_SIA_rural_support: "Wsparcie wsi"
