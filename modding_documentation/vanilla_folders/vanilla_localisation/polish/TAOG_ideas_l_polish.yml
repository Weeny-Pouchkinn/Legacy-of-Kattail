 INS_bangka_bauxite_export_desc: "Na wyspach Bangka i Belitung znajdują się znaczne zasoby boksytu, który jest najważniejszą rudą aluminium. Chociaż moglibyśmy sami zainwestować w produkcję aluminium, ogromne ilości wydobywanego boksytu sprawiają, że opłacalną strategią jest sprzedaż tego surowca bez przetwarzania."
