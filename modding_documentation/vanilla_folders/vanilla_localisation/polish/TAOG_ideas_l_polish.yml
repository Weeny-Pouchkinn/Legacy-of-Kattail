 idea_SIA_constitutional_virtue: "Cnota konstytucyjna"
 idea_SIA_an_absolute_monarchy: "Monarchia absolutna"
 idea_SIA_an_absolute_monarchy_desc: "Cała władza polityczna spoczywa w rękach korony. Słowo króla jest prawem, odmienne poglądy są zwalczane, a cały ciężar prestiżu rodziny królewskiej wspiera mobilizację narodu. Tron domaga się wierności, a armia jest jego narzędziem."
 idea_SIA_a_constituional_monarchy: "Monarchia konstytucyjna"
 idea_SIA_a_constituional_monarchy_desc: "Ramy konstytucyjne nakładają ograniczenia na władzę królewską i chronią prawa ludu. Korona to jednoczący symbol, a nie władza absolutna, dzięki czemu kraj jest stabilniejszy, bardziej otwarty na nowe idee i bardziej pasuje do świata demokratycznego."
 idea_SIA_restoring_order: "Przywracanie porządku"
 idea_SIA_military_expansion_costs: "Koszty rozbudowy sił zbrojnych"
 idea_SIA_a_modern_economy: "Nowoczesna gospodarka"
 idea_SIA_death_to_communists: "Śmierć komunistom"
 idea_SIA_death_to_communists_desc: "W szeregach wojska trwa antykomunistyczna gorączka, dzięki czemu nasi żołnierze mają przewagę nad komunistycznymi armiami Chin."
 idea_SIA_death_to_nationalists: "Śmierć nacjonalistom"
 idea_SIA_death_to_nationalists_desc: "W szeregach wojska panują nastroje antynacjonalistyczne, dzięki czemu nasi żołnierze mają przewagę nad nacjonalistycznymi armiami Chin."
 idea_SIA_breaking_the_burmese_line: "Przełamanie linii birmańskiej"
 idea_SIA_the_yellow_dossier: "Żółte akta"
 idea_SIA_the_yellow_dossier_desc: "Tajny raport o stanie krajowego przemysłu zmusił nas do zmierzenia się z ogromną niewydajnością. Wymaga to reform, które przynoszą owoce w naszych fabrykach, choć wywołane nimi zamieszanie ma swoją cenę."
 idea_SIA_the_yellow_dossier_2: "$idea_SIA_the_yellow_dossier$"
 idea_SIA_the_yellow_dossier_2_desc: "$idea_SIA_the_yellow_dossier_desc$"
 idea_SIA_pacific_war_preparations: "Przygotowania do wojny na Pacyfiku"
 idea_SIA_a_race_against_time: "Wyścig z czasem"
 idea_SIA_overheated_economy: "Przegrzana gospodarka"
 idea_SIA_overheated_economy_desc: "Gospodarka została pchnięta poza jej naturalne ograniczenia. Popyt konsumencki przekroczył podaż, a boom budowlany zatrzymał się z powodu osłabienia koniunktury."
 idea_SIA_ending_military_grift: "Koniec oszustwa wojskowych"
 idea_SIA_the_military_oversight_bureau: "$SIA_military_oversight_bureau$"
 idea_SIA_the_military_oversight_bureau_desc: "Biuro Nadzoru Wojska wyznacza wyższe standardy dla nowych dowódców i przyspiesza nabywanie doświadczeń przez cały korpus oficerski."
 idea_SIA_public_credit_debt: "Dług publiczny"
 idea_SIA_public_credit_debt_desc: "Zobowiązania kredytowe państwa nieustannie ciążą gospodarce i pochłaniają zasoby, które moglibyśmy przeznaczyć na produkcję i towary cywilne."
 idea_SIA_public_credit_debt_2: "Spłata: $idea_SIA_public_credit_debt$"
 idea_SIA_public_credit_debt_2_desc: "$idea_SIA_public_credit_debt_desc$"
 idea_SIA_revision_of_unequal_treaties: "Rewizja traktatów nierównoprawnych"
 idea_SIA_purged_military: "Dokonano czystki w wojsku"
 idea_SIA_purged_military_desc: "Usunięcie oficerów uznanych za niepewnych spowodowało, że w wojsku pracuje mniej doświadczonych dowódców, co szkodzi całej organizacji i jej rozwojowi."
 SIA_khana_ratsadon_inlay_title: "Khana Ratsadon"
 SIA_civilian_wing_label: "Skrzydło cywilne"
 SIA_military_wing_label: "Skrzydło wojskowe"
 SIA_wing_state_full_support: "§GPełne poparcie§!"
 SIA_wing_state_slight_support: "§GSłabe poparcie§!"
 SIA_wing_state_neutral: "§YNeutralne§!"
 SIA_wing_state_opposition: "§RW opozycji§!"
 SIA_wing_state_rebellious: "§RBuntownicze§!"
 SIA_civilian_wing_history_tt: "Frakcja cywilna Khana Ratsadon jest kierowana przez progresywnych administratorów i technokratów, z których najważniejszy jest §YPridi Phanomyong§!. Studiował on prawo we Francji, skąd powrócił z ambicjami przeprowadzenia reformy ziemskiej, wdrożenia państwowego planowania gospodarki oraz utworzenia demokracji konstytucyjnej, która dałaby zwykłym ludziom prawdziwą władzę.\n\nSkrzydło cywilne jest w dużej mierze §Gprorozwojowe§!, stawia na edukację, infrastrukturę i przemysł. Jest natomiast sceptyczne wobec dużych wydatków wojskowych i zamierza wystrzegać się dryfowania ku rządom siły. Ich poparcie najłatwiej zdobyć poprzez polityki nastawione na modernizację państwa oraz ochronę rządu konstytucyjnego."
 SIA_military_wing_history_tt: "Frakcja wojskowa Khana Ratsadon jest zdominowana przez oficerów armii, którzy widzą siebie jako prawdziwych strażników rewolucji. Najambitniejszą postacią spośród nich jest §YPlaek Phibunsongkhram§!, pułkownik, którego podziw dla europejskich ruchów nacjonalistycznych rośnie z każdym mijającym rokiem.\n\nSkrzydło wojskowe opowiada się §Gza przezbrojeniem§! i chce stworzyć silne, scentralizowane państwo. Osoby z tego kręgu nieufnie pochodzą do pomysłów gospodarczych Pridiego, które uważają za niebezpiecznie radykalne, a jednocześnie nie chcą, aby cywile wtrącali się w kwestie obronności. Ich lojalność można sobie zaskarbić poprzez wydatki na zbrojenia i polityki służące projekcji siły kraju."
 idea_SIA_wing_promotion_disruption: "Zmiana kursu frakcji"
 idea_SIA_wing_promotion_disruption_desc: "Otwarte sprzyjanie jednemu skrzydłu Khana Ratsadon zachwiało rządową równowagą. Urażona frakcja spowalnia prace rządu, w armii zapanował chaos, a zwykłe administrowanie będzie utrudnione do czasu okrzepnięcia nowego układu sił."
 idea_SIA_military_wing_unrest: "Bunt skrzydła wojskowego"
 idea_SIA_military_wing_unrest_desc: "Oficerowie po raz kolejny stracili cierpliwość. Skrzydło wojskowe nie zdołało otwarcie przejąć władzy, więc teraz daje upust swojej furii poprzez sabotaże, dezercje i jawną odmowę współpracy. Siła bojowa armii gwałtownie maleje, jedynie zapanowanie nad malkontentami może odwrócić ten trend."
 idea_SIA_civilian_wing_unrest: "Bunt skrzydła cywilnego"
 idea_SIA_civilian_wing_unrest_desc: "Frakcja Pridiego ponownie utraciła wiarę w rząd. Nie otrzymawszy kolejnej szansy na objęcie władzy, skrzydło cywilne przeszło do strajków, obstrukcji biurokracji oraz agitacji w miastach. Gospodarka cierpi, a zarządzanie krajem stało się trudniejsze, jedynie schłodzenie nastrojów może zatrzymać te procesy."
 idea_SIA_unwavering_civilian_support: "Niezachwiane wsparcie cywilne"
 idea_SIA_unwavering_civilian_support_desc: "Skrzydło wojskowe rozpadło się, kwestia legitymizacji władzy została rozstrzygnięta, zatem administracja cywilna ma wolną rękę do działania. Kiedy wojsko nie wtrąca się w ich pracę, technokraci Pridiego rządzą z zapałem, jakiego dawna koalicja nigdy nie zdołała osiągnąć."
 idea_SIA_unified_khana_ratsadon: "Zjednoczona Partia Ludowa"
 idea_SIA_unified_khana_ratsadon_desc: "Dawny spór między żołnierzami i cywilami zakończył się. Wreszcie oba skrzydła Khana Ratsadon działają zgodnie, a rząd może wyznaczać wspólne cele, co nie było możliwe nigdy wcześniej. Teraz żołnierze, administratorzy i przemysłowcy pracują jak jedno ciało."
