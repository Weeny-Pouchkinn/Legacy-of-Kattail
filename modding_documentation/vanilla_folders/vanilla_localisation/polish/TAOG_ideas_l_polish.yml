 AST_unratified_westminster_act_idea: "Brak ratyfikacji ustawy o statucie westminsterskim"
 AST_unratified_westminster_act_idea_desc: "W 1931 roku uchwalono statut westminsterski, który umożliwił samorządnym [ENG.GetAdjective] dominium rozszerzenie ich suwerenności. Gdybyśmy go ratyfikowali, większość uprawnień brytyjskiego parlamentu do stanowienia [AST.GetAdjective] prawa zostałaby zniesiona."
