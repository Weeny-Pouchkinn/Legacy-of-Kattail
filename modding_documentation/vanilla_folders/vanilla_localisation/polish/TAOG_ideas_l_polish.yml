 AST_singapore_strategy_idea: "Budowa obrony Singapuru"
 AST_singapore_strategy_idea_desc: "Na prośbę Australii dołożymy starań, aby wzmocnić struktury obronne w Singapurze. W końcu strategia singapurska stanowi kluczowy element polityki obronnej regionu Pacyfiku.\n\n§W§YPrzy usunięciu§! (§YSingapur§!):\n Dodanie §G2§! §Ybaz lotniczych§!.\n Dodanie §G2§! §Ybaz morskich§!.\n Dodanie §G1§! §Yfortyfikacji brzegowej§!.§!\n"
