 AST_war_plan_japan: "Plan wojny z Japonią"
 AST_australian_culture_investments_idea: "Inwestycje w australijską kulturę"
 AST_australian_culture_investments_idea_desc: "§W§YPrzy usunięciu§!:\nDodanie modyfikatora §YPoczucie przynależności§!, który zapewnia\nStabilizację: §G+10,00%§!\nPoparcie wojny: §G+10,00%§!.§!\n"
 AST_a_sense_of_place: "Poczucie przynależności"
 AST_a_sense_of_place_desc: "Tożsamość narodowa stanowi spoiwo, które łączy naród. Australijczycy zjednoczyli się w ramach bogatej kultury, gotowi stawić opór każdemu, kto mógłby naruszyć granice ich ojczyzny."
 AST_a_sense_of_place_upgraded: "Poczucie przynależności"
 AST_a_sense_of_place_upgraded_desc: "Tożsamość narodowa, która niegdyś rozwijała się w ciszy, nabrała teraz bardziej radykalnego charakteru. Nie jest to już tylko duma z ojczyzny i stylu życia - to przekonanie, że warto walczyć o to, co zbudowała Australia, oraz że mężczyźni i kobiety żyjący pod Krzyżem Południa są gotowi to uczynić."
 AST_the_promise_of_nauru: "Obietnica dotycząca Nauru"
 AST_the_promise_of_nauru_tt: "Zaczyna działać, gdy §Y[AST.GetName]§! sfinalizuje porozumienie:\n§YNauru§! przechodzi pod kontrolę rządu §Y[GER.GetAdjective]§! i staje się jego własnością.\n§Y[AST.GetName]§! zostaje wolnym krajem\n[GET_AST_NAURU_PACT_FACTION_EFFECT]"
