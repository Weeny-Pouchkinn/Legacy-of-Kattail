 NZL_railways_board: "Rządowa Rada Kolejowa"
 NZL_railways_board_desc: "Rządowa Rada Kolejowa powstała w 1931 r., powierzono jej zadanie restrukturyzacji Departamentu Kolejnictwa tak, aby decyzyjność przestała należeć do departamentów rządu. Jednak od tego czasu nie doszło do znaczącej modernizacji sieci kolejowej. Narasta presja na rząd, żeby ten zlikwidował radę i odzyskał przekazane jej kompetencje."
 NZL_great_depression: "Wielki kryzys"
 NZL_great_depression_desc: "Zapaść światowej gospodarki w 1929 r. bardzo mocno dotknęła gospodarkę Nowej Zelandii, opierającą się głównie na produkcji rolnej. Inne państwa zmniejszyły zakupy nowozelandzkich produktów, co wywołało falę bezrobocia, obniżyło siłę nabywczą konsumentów, a to z kolei załamało koniunkturę w innych branżach."
 NZL_commonwealth_loyalty: "Lojalność Brytyjskiej Wspólnoty Narodów"
 NZL_commonwealth_loyalty_desc: "Nowa Zelandia pozostaje oddanym członkiem Brytyjskiej Wspólnoty Narodów i uznaje króla za głowę państwa. Gospodarka Nowej Zelandii jest też silnie zintegrowana z imperialnym systemem gospodarczym."
 NZL_national_coal_board_idea: "Narodowa Rada Węgla"
