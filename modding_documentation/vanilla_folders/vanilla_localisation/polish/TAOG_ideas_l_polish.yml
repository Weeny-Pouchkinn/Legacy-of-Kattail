 idea_INS_volksraad: "Volksraad"
 idea_INS_volksraad_desc: "Volksraad to rada utworzona przez Holandię w 1918 roku w ramach systemu \"etycznej polityki\". Jej celem było stworzenie systemu półdemokracji, w którym reprezentowane byłyby różne mniejszości etniczne i kultury z całego archipelagu. Choć teoretycznie ma ona charakter demokratyczny, gubernator generalny i holenderska korona dysponują bezwarunkowym prawem weta."
 INS_volksraad_custom_tt: "Umożliwia zatrudnienie §Ydoradców Volksraadu§!\nUmożliwia użycie §Ydecyzji Volksraadu§!"
 INS_great_depression: "Wielki kryzys"
 INS_great_depression_desc: "Chociaż bezpośredni wpływ wielkiego kryzysu na Indie był niewielki, to późniejsze działania protekcjonistyczne podjęte przez kraje na całym świecie miały katastrofalne skutki dla gospodarki Indii Wschodnich, która opiera się na stałym eksporcie surowców, takich jak kauczuk i ropa naftowa."
 INS_great_depression_tt: "Modyfikuje §Y$INS_great_depression$§! o:"
 INS_dutch_east_indies: "Kiepska administracja"
 INS_dutch_east_indies_desc: "Indie Wschodnie to rozległy archipelag, na którym występują setki różnych kultur i języków, co sprawia, że jest to kolonia wyjątkowo trudna w zarządzaniu. Różnorodne ruchy niepodległościowe, bariery kulturowe oraz skutki gospodarcze wielkiego kryzysu nie pomagają w tej kwestii, a administracja działa bardzo nieefektywnie. \"Etyczna polityka\" ustanowiona w 1918 roku miała na celu poprawę sytuacji poprzez wprowadzenie etycznych przepisów dotyczących pracy oraz zapewnienie demokratycznej reprezentacji mniejszościom, jednak wielki kryzys sprawił, że w większości przypadków nie były one egzekwowane."
 INS_dutch_east_indies_tt: "Modyfikuje §Y$INS_dutch_east_indies$§! o:"
 INS_volksraad_tt: "Modyfikuje §Y$INS_dutch_east_indies$§! o:"
 INS_royal_netherlands_east_indies_army_desc: "Koninklijk Nederlands Indisch Leger, czyli Królewska Holenderska Armia Indii Wschodnich (KHAIW), to istniejąca od dawna armia Indii Wschodnich działająca niezależnie od Holandii. W skład KHAIW wchodzą zarówno żołnierze europejscy, jak i indonezyjscy, choć bariery kulturowe i językowe między licznymi kulturami archipelagu a Holandią sprawiają, że werbunek jest trudnym i powolnym procesem."
 idea_INS_netherlands_most_precious_jewel: "Najcenniejszy klejnot Holandii"
 idea_INS_netherlands_most_precious_jewel_desc: "Holenderskie Indie Wschodnie były kolonią Holandii przez około 350 lat i administracja kolonii jest ściśle związana z holenderskimi władzami. Indie Wschodnie często nazywane są \"klejnotem w koronie Holandii\", a Holandia nie wykazuje najmniejszej chęci wypuszczenia tego cennego klejnotu ze swego uścisku."
 INS_netherlands_most_precious_jewel_tt: "£GFX_trigger_no Może zwiększyć autonomię do poziomu wolnego państwa"
