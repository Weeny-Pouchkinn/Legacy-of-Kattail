 AST_poor_population_growth: "Słaby wzrost populacji"
 AST_poor_population_growth_desc: "Kiedy w 1929 r. uderzył wielki kryzys, w Australii gwałtownie spadła liczba urodzeń. W połączeniu ze spadkiem imigracji, państwo to do tej pory nie wróciło do dawnego poziomu wzrostu populacji."
