 # ABDACOM Supreme Command dynamic modifier
 ABDA_supreme_command: "Naczelne dowództwo ABDACOM"
 ABDA_supreme_command_desc: "Dowództwo Amerykańsko-Brytyjsko-Holendersko-Australijskie (ABDACOM) opracowało jednolitą doktrynę morską obowiązującą we wszystkich marynarkach wojennych wchodzących w skład sojuszu. W miarę zacieśniania się współpracy wspólne działania wywiadowcze, skoordynowane patrole oraz wzajemne wsparcie logistyczne stopniowo zwiększają skuteczność bojową każdej floty działającej pod sztandarem ABDACOM."
 modify_ABDA_supreme_command_tt: "Modyfikuje: §Y$ABDA_supreme_command$§! o:"
