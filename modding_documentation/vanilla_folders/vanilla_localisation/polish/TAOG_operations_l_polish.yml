l_polish:
 operation_rescue_general: "Ratowanie pojmanego dowódcy"
 operation_rescue_general_desc: "§LJeden z naszych dowódców został pojmany przez wroga i trafił do niewoli. Musimy przygotować operację uwolnienia go.§!"
 free_general_free_in_transit: "Uwolnienie z transportu"
 free_general_free_in_transit_desc: "Nasi agenci ustalili, że cel zostanie wkrótce przeniesiony, dlatego zaplanują przechwycenie i zasadzkę na trasie przewozu."
 free_general_assault_holding_area: "Atak na miejsce przetrzymywania"
 free_general_assault_holding_area_desc: "Wróg więzi naszego dowódcę w strzeżonej placówce, naszym agentom udało się ustalić jej położenie. Przygotują śmiały szturm, którego celem będzie odbicie jeńca."
 free_general_disguise_and_extract: "Przebranie i ewakuacja"
 free_general_disguise_and_extract_desc: "Wykorzystując swoje rozległe doświadczenie, nasi agenci pomogą przygotować przebranie dla dowódcy, dzięki któremu oszuka on strażników i ucieknie na przyjazne terytorium."
