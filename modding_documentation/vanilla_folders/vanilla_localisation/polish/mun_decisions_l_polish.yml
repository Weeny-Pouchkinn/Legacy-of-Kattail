 CZE_embezzle_quatermaster_funds: "£BoP_left_texticon Defraudacja funduszy kwatermistrzostwa"
 CZE_embezzle_quatermaster_funds_desc: "Nasi żołnierze mają już wszystko, czego potrzebują. Na pewno nikt nie będzie miał nic przeciwko temu, by część funduszy dla koszar trafiła gdzieś indziej."
 CZE_prioritize_export_contracts: "£BoP_left_texticon Priorytet dla kontraktów eksportowych"
 CZE_prioritize_export_contracts_desc: "Nasz przemysł eksportowy pomógł nam wyjść z wielkiego kryzysu. Dlaczego teraz mielibyśmy zmienić sposób działania? Opinie o zagrożeniach dla naszego kraju i tak są przesadzone. Armada może poczekać."
 CZE_focus_on_export_designs: "£BoP_left_texticon Priorytet na projekty eksportowe"
 CZE_focus_on_export_designs_desc: "Armada ma ogromne wymagania wobec naszych projektów. Rynek eksportowy jest bardziej wyrozumiały i może nam pomóc sfinansować krajowe projekty dla armady. Tak naprawdę armada powinna nam dziękować za to, ile pieniędzy oszczędza dzięki nam na badaniach i rozwoju. Nie ma za co, armado."
