 ###FORT DECISIONS###
 CZE_the_second_fortification_program_category: "Programy rozbudowy fortyfikacji"
 CZE_the_second_fortification_program_category_desc: "Niekorzystny układ granic naszego kraju to coraz większe zagrożenie dla bezpieczeństwa narodowego. Sąsiadujące z nami kraje wyraźnie zadeklarowały, że zamierzają od nowa nakreślić nasze granice, oczywiście na swoją korzyść. Dalsza budowa umocnień granicznych sprawi, że ewentualny wróg dobrze się zastanowi, zanim nas zaatakuje."
 CZE_fate_of_the_ro: "Los Rady ds. Umocnień"
 CZE_fate_of_the_ro_desc: "Rada ds. Umocnień zajmuje się zbieraniem środków finansowych na nasze projekty rozbudowy umocnień. Jeżeli szybko nie wykorzystamy tych pieniędzy, ludzie zaczną się zastanawiać, po co je zbieraliśmy."
 CZE_bop_army_bunker_maintenance: "Program serwisowania fortyfikacji"
 CZE_bop_army_bunker_maintenance_desc: "Odpowiednie serwisowanie fortyfikacji i utrzymywanie ich w gotowości sprawi, że armia będzie pewna ich trwałości, jeśli zajdzie potrzeba ich obsadzenia."
 CZE_fortification_research: "Prace badawcze nad umocnieniami"
 CZE_fortification_research_desc: "To oczywiste, że musimy wzmocnić nasze granice, ale trzeba zadać sobie pytanie, jak to zrobić? Prace badawcze pomogą nam znaleźć na nie odpowiedź."
 CZE_fortification_research_tt: "Posiada ducha narodowego: §Y$CZE_directorate_of_fortification_works_no_gd_idea$§!"
 CZE_fortification_research_subtract_variable_tt: "§YUkończenie§! wszystkie decyzji dotyczących §Yprogramów rozbudowy fortyfikacji§! potrwa o §Y30§! dni krócej."
 CZE_fortification_decision_inprogress: "Już trwają prace nad innym programem rozbudowy umocnień"
 CZE_second_sudetenland_fortification_program: "Drugi program rozbudowy fortyfikacji Kraju Sudetów"
 CZE_second_sudetenland_fortification_program_desc: "Kraj Sudetów, nasza górska granica z Niemcami, to idealne miejsce na fortyfikacje graniczne. Po zapoznaniu się z francuską Linią Maginota możemy zbudować podobne umocnienia."
 CZE_third_sudetenland_fortification_program: "Trzeci program rozbudowy fortyfikacji Kraju Sudetów"
 CZE_third_sudetenland_fortification_program_desc: "W Kraju Sudetów znajduje się już przyzwoita linia obronna, ale to za mało, gdy stawką jest przetrwanie naszego państwa."
 CZE_fourth_sudetenland_fortification_program: "Czwarty program rozbudowy fortyfikacji Kraju Sudetów"
 CZE_fourth_sudetenland_fortification_program_desc: "Kraj Sudetów ma dobry system fortyfikacji, ale trzeba go jeszcze wzmocnić!"
 CZE_fortify_the_crossroads_with_slo: "Umocnienie skrzyżowań"
 CZE_fortify_the_crossroads_with_slo_desc: "Każdy system fortyfikacji można sforsować. Aby przygotować się na taką możliwość, możemy zbudować umocnienia wokół naszych najważniejszych miast. Dzięki temu wróg nie zajmie ich tak łatwo, gdy przebije się przez nasze linie."
 CZE_fortify_the_hungarian_border_with_73: "Umocnienie granicy z Węgrami"
 CZE_fortify_the_hungarian_border_with_73_desc: "Węgierski separatyzm stanowi nieustanne zagrożenie dla naszego kraju, system umocnień wzdłuż naszej wspólnej granicy pomoże zapewnić nam bezpieczeństwo."
 CZE_fortify_the_polish_border_with_72: "Umocnienie granicy z Polską"
 CZE_fortify_the_polish_border_with_72_desc: "Polska agresja jest nieobliczalna, ale może dobrze umocniona granica sprawi, że poszukają sobie łatwiejszego celu."
