 CZE_send_observers_to_the_italo_ethiopian_war_bonus: "Wysłano obserwatorów na wojnę włosko-etiopską"
 CZE_send_observers_to_the_italo_ethiopian_war_desc: "Przemycenie tam ludzi, którzy obserwowaliby wydarzenia i nawiązywali kontakty z osobami biorącymi udział w walkach, mogłoby dać nam niezwykle cenny wgląd we współczesne doktryny militarne. Mogłyby też pojawić się inne możliwości."
