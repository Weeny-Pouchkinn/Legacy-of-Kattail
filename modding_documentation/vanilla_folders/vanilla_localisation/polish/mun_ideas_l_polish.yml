 #National Spirits
 CZE_taticek_of_czechoslovakia: "Tatíček Masaryk"
 CZE_taticek_of_czechoslovakia_desc: "Tomáš Masaryk, na którego często mawia się \"Tatíček Masaryk\", co oznacza \"tatusia\" lub \"ojca\" (narodu), był opoką czechosłowackiego narodu od momentu jego powstania. Gdy koalicje wydawały się niemożliwe do zbudowania, a polityczne impasy zbyt duże do przezwyciężenia, Masaryk raz za razem dokonywał politycznych cudów, aby wzmocnić i rozwinąć Czechosłowację. Nawet po zakończeniu czynnej działalności politycznej jego sentymenty i sugestie są traktowane bardziej jak rozkazy niż rady."
 CZE_industrialists_veto: "Weto przemysłowców"
 CZE_industrialists_veto_desc: "Przemysłowcy wywierają znaczny wpływ na politykę kraju, ponieważ stoją na czele wielu największych [CZE.GetAdjective] konglomeratów. Nie można ignorować ich obaw w kwestiach polityki gospodarczej, a mobilizacja gospodarcza należy do działań, którym sprzeciwiają się najbardziej."
 CZE_agrarian_politics_1: "Polityka rolna"
 CZE_agrarian_politics_1_desc: "Pomimo przemysłowego charakteru naszego kraju, rolnicy i chłopi mają znaczny wpływ w wielu partiach politycznych. Ich nastroje często decydują o polityce gospodarczej i stanowią stałą polityczną przeszkodę w dalszym rozwoju przemysłu."
 CZE_directorate_of_fortification_works_no_gd_idea: "Dyrekcja Prac Fortyfikacyjnych"
 CZE_directorate_of_fortification_works_no_gd_idea_desc: "$CZE_directorate_of_fortification_works_no_gd_idea$ znana powszechnie jako ROP jest organem odpowiedzialnym za zarządzanie działaniami fortyfikacyjnymi w kraju."
 CZE_czech_corporatism: "Czeski korporacjonizm"
 CZE_broken_shield: "Przełamana tarcza"
 CZE_redirected_fortification_council_funds: "Przekierowanie funduszy Rady ds. Umocnień"
 CZE_army_readiness_1: "Nieprzygotowana armia"
 CZE_army_readiness_1_desc: "Gotowość armii to nie tylko ludzie i sprzęt w terenie. W obliczu zagrożenia liczy się także zaufanie do swojego przygotowania oraz wsparcie przywódców politycznych i przemysłowych kraju. Dysponowanie środkami do walki to jedno, a zdolność do jej skutecznego prowadzenia to zupełnie inna kwestia."
 CZE_army_readiness_3: "Przygotowana armia"
 CZE_army_readiness_3_desc: "Gotowość armii to nie tylko ludzie i sprzęt w terenie. W obliczu zagrożenia liczy się także zaufanie do swojego przygotowania oraz wsparcie przywódców politycznych i przemysłowych kraju. Dysponowanie środkami do walki to jedno, a zdolność do jej skutecznego prowadzenia to zupełnie inna kwestia."
 CZE_ready_for_anything_idea: "Gotowi na wszystko"
 CZE_sudeten_german_quandary: "Sudecki dylemat"
 CZE_sudeten_german_quandary_desc: "Chociaż większość mieszkańców Kraju Sudetów pragnie jedynie większej autonomii w ramach obecnego systemu rządów, wiele sudeckich partii politycznych i ich zwolenników mogłoby szybko stać się piątą kolumną, gdyby państwo niemieckie podjęło próbę aneksji jakiejkolwiek części tego regionu."
 CZE_sudeten_german_quandary_modifier_tt: "§YPasywny efekt§!:\nJeśli §Y[AUS.GetFlag][AUS.GetNonIdeologyName]§!, §Y[GER.GetFlag][GER.GetNonIdeologyName]§! lub jakikolwiek inny [BAY.GetFlag]§Yniemiecki kraj§! sąsiadujący z nami usprawiedliwi lub zyska §Rcel wojenny§! przeciwko nam, gdy kontrolujemy §Y[69.GetName]§!, §Y[972.GetName]§! lub §Y[74.GetName]§!:\n - (§YWszystkie kontrolowane regiony Kraju Sudetów§!):\n    Dodaje modyfikator (§Y$CZE_sudetenland_paramilitaries_modifier$§!), który zapewnia:\n       $MODIFIER_LOCAL_INTEL_TO_ENEMIES$: §R+10%§!\n       $MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$: §R-10,0%§!\n       $modifier_state_repair_speed_bunker_factor$: §R-10,00%§!\n\n - Ten §Yefekt§! może wystąpić tylko raz"
 CZE_sudeten_challenge: "Sudeckie wyzwanie"
 CZE_sudeten_challenge_desc: "Niedawna aktywność sudeckich organizacji paramilitarnych w Kraju Sudetów sprawiła, że wielu członków społeczności międzynarodowej uwierzyło, iż obecne agresywne działania przeciwko nam są uzasadnione! Potrzeba czasu, aby przekonać świat, że jest inaczej."
 CZE_sudeten_facde: "Sudecka fasada"
 CZE_sudeten_facde_desc: "Przez brak wsparcia dla lokalnych organizacji paramilitarnych nasze uzasadnienia dla działań przeciwko [CZE.GetAdjective] państwu są teraz postrzegane na całym świecie jako fasada."
