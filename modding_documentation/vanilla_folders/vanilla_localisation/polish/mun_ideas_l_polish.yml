 #Dynamic Modifiers National Spritits
 CZE_ceskoslovenska_armada_dynamic_modifier: "Československá Armáda"
 CZE_ceskoslovenska_armada_dynamic_modifier_desc: "Wojsko powstało na bazie austro-węgierskich jednostek czeskich i weteranów Legionu Czechosłowackiego. Dziedzictwo obu tych formacji nadal wpływa na sposób zarządzania wojskiem."
 CZE_ceskoslovenske_letectvo_dynamic_modifier: "Československé Letectvo"
 CZE_ceskoslovenske_letectvo_dynamic_modifier_desc: "Nasi piloci w odróżnieniu od samolotów są zawsze gotowi. W obliczu potencjalnych zagrożeń z powietrza, które mogą nadejść z każdej strony, musimy uczynić powietrze naszym morzem. Każdy pilot musi pracować za trzech."
 CZE_a_divided_nation_dynamic_modifier: "Podzielony naród"
 CZE_a_divided_nation_dynamic_modifier_desc: "Państwo [CZE.GetAdjective] wyróżniało się w Europie Środkowej swoim pluralizmem i chronieniem wszystkich obywateli zamieszkujących jego granice. Jednak wielki kryzys zmienił ten stan rzeczy. Trudności gospodarcze spowodowały narastanie niechęci wobec rządu ze strony różnych ugrupowań działających w kraju. Urazy te obecnie głęboko dzielą naród."
 CZE_skoda_works_dynamic_modifier: "Zakłady Škoda"
 CZE_skoda_works_dynamic_modifier_desc: "Firma Škoda zajmuje się produkcją, konstruowaniem i inwestycjami we wszystkich sektorach naszego przemysłu ciężkiego. Jej wpływ w naszym kraju nie zna granic."
 CZE_ceskoslovenske_alecne_lodstvo_dynamic_modifier: "Československé válečné loďstvo"
 #Dynamic State Modifiers
 CZE_sudetenland_german_state_modifier: "Separatyzm Kraju Sudetów"
 CZE_sudetenland_german_state_modifier_desc: "Ostatnie trudności gospodarcze dotknęły przemysł w Kraju Sudetów. Cierpiąca z tego powodu ludność zamieszkująca ten region obwinia o to [ROOT.GetAdjective] rząd."
 CZE_tesinko_polish_state_modifier: "Polski separatyzm"
 CZE_czech_state_modifier: "Niedobór wykwalifikowanych czeskich pracowników"
 CZE_czech_state_modifier_desc: "Szybki rozwój gospodarczy w XX wieku stanowił obciążenie dla w dużej mierze rolniczej ludności Czech. Obsadzenie stanowisk wykwalifikowaną i kompetentną czeską siłą roboczą sprawia trudności. Należy podjąć wysiłki w celu przygotowania młodych obywateli Czech do zmieniających się potrzeb nowoczesnej gospodarki."
