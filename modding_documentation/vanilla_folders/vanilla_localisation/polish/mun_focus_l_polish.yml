 #Germany
 GER_integrate_czech_manufacturers: "Integracja czeskich producentów"
 GER_integrate_czech_manufacturers_desc: "Czeski przemysł jest prawdziwą kopalnią specjalistycznej wiedzy i zasobów dla naszej gospodarki. Dodatkowa potęga przemysłowa oferowana przez czeskich wytwórców byłaby ogromnym bodźcem dla naszego przemysłu zbrojeniowego. Zintegrowanie ich z naszymi liniami produkcyjnymi jest więc jak najbardziej uzasadnione."
