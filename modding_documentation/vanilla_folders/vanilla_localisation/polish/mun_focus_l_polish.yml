l_polish:
 #Shortcuts
 CZE_military_path_shortcut: "Siły zbrojne"
 CZE_economic_path_shortcut: "Gospodarka"
 CZE_diplomacy_path_shortcut: "Dyplomacja"
 CZE_fort_path_shortcut: "Rozbudowa fortyfikacji"
 CZE_skoda_priority_shortcut_name: "Priorytet na Škodę"
 CZE_political_path_shortcut: "Polityka"
 # Č does show when scrolling through focuses, but not in the detailed focus view title (does work in the description though)
 CZE_coalition_building: "Budowanie koalicji"
 CZE_coalition_building_desc: "Koalicja, która powstała po wyborach, musi zacieśnić więzi między swoimi członkami, jeśli ma skutecznie funkcjonować. Niedawna rezygnacja Jana Malypetra ze stanowiska premiera wywarła dodatkową presję na szeroką koalicję, by ta ugruntowała swoje poparcie."
 CZE_merge_the_paramilitaries: "Połączenie organizacji paramilitarnych"
 CZE_merge_the_paramilitaries_desc: "Nasze organizacje paramilitarne są rozproszone i podzielone na wiele ugrupowań. Jeżeli zamierzamy wykorzystać je do celów militarnych, musimy zmusić je do połączenia się."
 CZE_integrated_paramilitaries: "Integracja organizacji paramilitarnych"
 CZE_integrated_paramilitaries_desc: "Ten pomysł nie ucieszy wojskowych, ale zintegrowanie organizacji paramilitarnych z naszymi siłami zbrojnymi powiększy nasze rezerwy na czas, gdy będą najbardziej potrzebne."
 CZE_wielding_the_hammer: "Zastosowanie młota"
 CZE_wielding_the_hammer_desc: "Możemy wykorzystać naszą przewagę w Zgromadzeniu Narodowym, aby znacznie przyspieszyć proces uchwalania ustaw w porównaniu z obecną sytuacją. Niezwykle ważne jest, aby uporządkować naszą izbę ustawodawczą."
 CZE_emergency_measures: "Środki nadzwyczajne"
 CZE_emergency_measures_desc: "Jeśli zastosujemy nadzwyczajne środki, które pomogą nam poradzić sobie z licznymi kryzysami dotykającymi nasz kraj, a jednocześnie wykorzystamy niektóre z nich do baczniejszej obserwacji osób budzących wątpliwości co do ich lojalności wobec naszego narodu, będziemy lepiej przygotowani do stawienia czoła obecnym wyzwaniom."
 CZE_king_of_the_castle: "Król zamku"
 CZE_king_of_the_castle_desc: "Wszyscy wiemy, kto rozdaje karty w naszym rządzie. W czasach wielkiej niepewności nie powinniśmy dłużej udawać, niech $CZE_edvard_benesh$ rządzi bardziej bezpośrednio. Od tego zależy bezpieczeństwo naszego kraju."
 CZE_closer_ties_with_the_moderate_germany_parties: "Mobilizacja umiarkowanych partii Kraju Sudetów"
 CZE_closer_ties_with_the_moderate_germany_parties_desc: "Niektóre partie Kraju Sudetów są gotowe współpracować z naszą koalicją i porozumieć się z rządem. Trzeba zacieśnić te więzi."
 CZE_complete_reconciliation: "Całkowite pojednanie"
 CZE_complete_reconciliation_desc: "Włożyliśmy wiele pracy w zbudowanie mostów zaufania. Czas pojednać się z naszymi rodakami."
 CZE_complete_reconciliation_cooldown_flag: "Zrealizowano cel §Y$CZE_closer_ties_with_the_moderate_germany_parties$§!"
 CZE_complete_reconciliation_cooldown_flag_tt: "Minęło dni: [?CZE_complete_reconciliation_cooldown_flag:days|Y0]"
 CZE_bastion_of_liberty: "Bastion wolności"
 CZE_bastion_of_liberty_desc: "W tej dekadzie jesteśmy jednym z niewielu pluralistycznych krajów Europy na wschód od Renu. Dopilnujmy, by ludzie o tym nie zapomnieli."
 CZE_standing_against_the_storm: "Walka z zawieruchą"
 CZE_standing_against_the_storm_desc: "Mimo pewnych braków i słabego przygotowania, jesteśmy gotowi zmierzyć się z każdym wyzwaniem oraz walczyć z nadciągającą zawieruchą."
 CZE_truth_prevails: "Prawda zwycięży"
 CZE_truth_prevails_desc: "Nawet w obliczu ogromnych przeciwności i niewykonalnych zadań, nasz kraj wie, że nasze motto narodowe \"Prawda zwycięży\" sprawdzi się, gdy kurz opadnie. Dążmy do prawdy, słuchajmy prawdy, a zwyciężymy."
 CZE_negotiations_with_the_autonomous_bloc: "Negocjacje z blokiem autonomii"
 CZE_negotiations_with_the_autonomous_bloc_desc: "Jeżeli zamierzamy zbudować koalicję, która nie odda władzy w ręce legionu klakierów Benesa w Zgromadzeniu Narodowym, będziemy musieli współpracować z blokiem autonomii. Za uzyskanie jego pełnego poparcia przyjdzie nam jednak słono zapłacić."
 CZE_slovakia_autonomy_agreement: "Porozumienie w sprawie autonomii Słowacji"
 CZE_slovakia_autonomy_agreement_desc: "Cena za współpracę bloku autonomii z naszą koalicją to zawarte z naszym rządem porozumienie o autonomii. To ogromna cena, ale jeśli nie dotrzymamy naszej części umowy, konsekwencje będą znacznie gorsze."
 CZE_slovakia_autonomy_agreement_tt: "Rząd §Y[RUT.GetAdjective]§! zechce zawarcia takiej samej umowy, jaką zawarliśmy z władzami §Y[SLO.GetAdjective]§!!"
 CZE_slovakia_autonomy_agreement_2_tt: "Po wybraniu tego celu $CZE_the_autonomous_bloc_demands$ zostaną odroczone o §Y35 dni§!."
 CZE_topple_the_king: "Obalenie króla"
 CZE_topple_the_king_desc: "$CZE_edvard_benesh$ ma przytłaczający wpływ na nasz rząd. Jego władza wykracza poza zakres prerogatyw prezydenta, ponieważ ma za sobą legion lojalistów w parlamencie. Skoro zaistniały odpowiednie warunki, możemy osłabić jego pozycję w Horní Komora."
 CZE_comprise_with_the_carpathians: "Kompromis z Karpatami"
 CZE_comprise_with_the_carpathians_desc: "Region Zakarpacia mocno naciska w sprawie zawarcia porozumienia o federalizacji, podobnego do tego, które zawarliśmy ze [SLO.getadjective] rządem. Jeśli to zrobimy, osłabnie nasza pozycja w tym regionie i w: [9.getname]. Lepiej się z nimi porozumieć, niż całkowicie ulegać ich żądaniom."
 CZE_the_rut_demands_add_35_CZE_comprise_with_the_carpathians_tt: "Po wybraniu tego celu $CZE_the_rut_demands$ zostaną odroczone o §Y35 dni§!."
 CZE_cut_carpathia_loose: "Pozbądźmy się Karpat"
 CZE_cut_carpathia_loose_desc: "Słowacja stała się państwem federalnym, więc region Zakarpacia liczy na takie samo porozumienie. Wydaje się to nierozsądne, ale trudno będzie nam rządzić bez Słowacji znajdującej się pod naszą bezpośrednią kontrolą. Może powinniśmy spełnić te żądania."
 CZE_compromise_with_the_veteran_agrarian: "Kompromis z doświadczonymi agrarianami"
 CZE_compromise_with_the_veteran_agrarian_desc: "Stara gwardia agrarian przeszkadza nam w dotarciu do powiększającego się elektoratu miejskiego. Musimy osiągnąć kompromis z tymi ludźmi, żebyśmy dostali to, czego chcemy."
 CZE_reorient_the_broad_coalition: "Reorientacja szerokiej koalicji"
 CZE_reorient_the_broad_coalition_desc: "Szeroka koalicja od wielu lat kieruje działaniami naszego rządu. W ostatnim czasie wiele tworzących ją partii politycznych utrudnia sterowanie koalicją. Czas na reorientację polityki i działalności ministrów."
 CZE_leverage_sokol: "Ruch Sokół"
 CZE_leverage_sokol_desc: "Organizacja Sokol od dziesięcioleci pełni w naszym kraju istotną rolę. W czasie kryzysu możemy zmusić ją do pomocy w szkoleniach paramilitarnych i kursach dla rekrutów naszej armii, gdy będą nam najbardziej potrzebni."
 CZE_urbanist_policies: "Polityki urbanistyczne"
 CZE_deepend_ties_with_the_trademans: "Zacieśnienie więzów z handlarzami"
 CZE_deepend_ties_with_the_trademans_desc: "Partia handlarzy cieszy się popularnością wśród elektoratu należącego do miejskiej klasy średniej. Jeżeli damy jej większą władzę i będziemy współpracować, być może dotrzemy do tej grupy społecznej, nie tracąc przy tym głosów mieszkańców wsi."
 CZE_apart_but_togather: "Osobno, ale razem"
 CZE_apart_but_togather_desc: "Obecnie nasze regiony cieszą się większą autonomią niż kiedykolwiek, ale jako kraj nigdy nie byliśmy silniejsi. Jesteśmy gotowi na każde przeciwieństwo losu."
 CZE_contact_henlein: "Kontakt z Henleinem"
 CZE_contact_henlein_desc: "$CZE_konrad_henlein$ od lat jest cierniem w boku naszego rządu. Jednak w świetle niedawnych wydarzeń na arenie międzynarodowej może już czas zacząć z nim rozmawiać."
 CZE_contact_henlein_cooldown_flag: "Zrealizowano cel §Y$CZE_no_compromise_with_the_sdp$§!"
 CZE_contact_henlein_cooldown_flag_tt: "Minęło dni: [?CZE_contact_henlein_cooldown_flag:days|Y0]"
 CZE_contact_henlein_focus_warning_tt: "Jeżeli zrealizujemy §Ycel narodowy§! §Y$CZE_no_compromise_with_the_sdp$§!, nie będziemy mogli go wybrać przez §Y350§! dni."
 CZE_contact_henlein_focus_order_warning_tt: "Jeżeli zrealizujemy cel §Y$CZE_no_compromise_with_the_sdp$§! po zrealizowaniu tego §Ycelu narodowego§!, §Y$CZE_konrad_henlein$§! przejdzie na emeryturę."
 CZE_no_compromise_with_the_sdp: "Kontynuujmy izolowanie SdP"
 CZE_no_compromise_with_the_sdp_desc: "SdP nie może niczego wnieść do naszej koalicji. Oni dążą jedynie do zwiększania napięć politycznych i próbują oczerniać działania naszego rządu. W imię dobrego rządzenia nie powinno się ich przyjmować do żadnej koalicji."
 CZE_no_compromise_with_the_sdp_cooldown_flag: "Zrealizowano cel §Y$CZE_contact_henlein$§!"
 CZE_no_compromise_with_the_sdp_cooldown_flag_tt: "Minęło dni: [?CZE_no_compromise_with_the_sdp_cooldown_flag:days|Y0]"
 CZE_no_compromise_with_the_sdp_focus_warning_tt: "Jeżeli zrealizujemy §Ycel narodowy§! §Y$CZE_contact_henlein$§!, nie będziemy mogli go wybrać przez §Y350§! dni."
 # CZE_economic_integration: "Economic Integration"
 # CZE_economic_integration_desc: "Why stop at a customs union? Economic integration will further grow our economies and ensure our future is an affluent one for all members."
 CZE_form_a_federation: "Tworzenie federacji"
 CZE_form_a_federation_desc: "Marzenie o federacji środkowoeuropejskiej wreszcie jest w zasięgu ręki. Możemy ją stworzyć, stać się ogromną demokracją o sile, która pozwoli nam samodzielnie opierać się wielkim mocarstwom!"
 CZE_bend_the_bars: "$ITA_bend_the_bars$"
 CZE_bend_the_bars_desc: "$GER_european_confederation_desc$"
 CZE_reassure_the_army: "Zapewnienia dla armii"
 CZE_reassure_the_army_desc: "Armia jest zaniepokojona niedawnymi decyzjami i politykami rządu. Musimy zapewnić siły zbrojne, że stoimy po ich stronie, niezależnie od słów albo poczynań władz."
 CZE_outreach_to_the_western_powers: "Kolejny kontakt z zachodnimi mocarstwami"
 CZE_outreach_to_the_western_powers_desc: "Zachodnie demokracje twierdzą, że możemy na nie liczyć, ale powinniśmy zacieśnić nasze kontakty z nimi, aby mieć pewność, że ich słowa znajdą pokrycie w czynach, gdy będzie to najbardziej potrzebne."
 CZE_demand_guarantees: "Zażądajmy silniejszych gwarancji"
 CZE_demand_guarantees_desc: "Mimo obowiązujących traktatów i sojuszy musimy zadbać, by nasi partnerzy nie opuścili nas w godzinie próby tylko z tego powodu, że takie rozwiązanie będzie dla nich łatwiejsze. Potrzebujemy czegoś więcej niż gwarancji."
 CZE_guardian_of_central_europe: "Strażnik Europy Środkowej"
 CZE_guardian_of_central_europe_desc: "Dzięki naszej aktualnej pozycji możemy stać się opiekunami demokracji w środku Europy. Możemy chronić kraje, które same sobie nie poradzą, i dopilnować, by demokracja zwyciężyła."
 CZE_central_european_faction: "Władca Europy Środkowej"
 CZE_central_european_faction_desc: "Choć skoncentrowaliśmy się na wzmocnieniu naszej ojczyzny, zamiast zbytnio polegać na dyplomacji, pod żadnym pozorem nie możemy zanadto rozciągnąć naszych wpływów, dlatego może warto spojrzeć poza nasze granice."
 CZE_strike_at_the_heart_of_bolshevism: "[THIS.GetAntiSovietFocusName]"
 CZE_strike_at_the_heart_of_bolshevism_1: "Uderzenie w serce bolszewizmu"
 CZE_strike_at_the_heart_of_bolshevism_2: "Zabezpieczenie wschodniej flanki"
 CZE_strike_at_the_heart_of_bolshevism_desc: "Ekspansja państwa [SOV.GetAdjective] to egzystencjalne zagrożenie dla Europy i naszego kraju. Musimy stać się zaporą, która zatrzyma tę falę."
 CZE_destroy_the_fascist_threats: "Zniszczmy faszystowskie zagrożenia"
 CZE_destroy_the_fascist_threats_desc: "[CZE_get_fascist_threats_desc]"
 CZE_destroy_the_fascist_threats_desc_enemy_ger: "Wszyscy wiemy, kto jest największym zagrożeniem dla pokoju w Europie. [GER.getnamedefCAP] to państwo, które prędzej czy później trzeba będzie zatrzymać. Jeśli nie ma ku temu chętnych, to my możemy podjąć się tego zadania."
 CZE_destroy_the_fascist_threats_desc_backup: "Dla naszego bezpieczeństwa niezwykle ważne jest, aby sąsiednie kraje nie kierowały się ekspansjonistyczną retoryką, która prędzej czy później może zostać wymierzona przeciwko nam."
 CZE_peace_on_our_time: "Peace for Our Time"
 CZE_peace_on_our_time_desc: "Zbyt długo byliśmy lekceważeni w europejskich stosunkach międzynarodowych. Czas z tym skończyć! Możemy stanąć na własnych nogach i stawiać swoje warunki. Zarówno na wojnie, jak i w czasie pokoju."
 CZE_reach_out_for_military_assistance: "Wniosek o pomoc wojskową"
 CZE_free_tuka: "$CZE_vojtech_tuka$ ma wyjść na wolność"
 CZE_free_tuka_desc: "$CZE_vojtech_tuka$ kończy odsiadywać karę więzienia i zamiast szukać powodu, żeby zatrzymać go tam na dłużej, możemy go wypuścić i zatrudnić w naszym rządzie. Lepiej, żeby pracował dla nas, niż działał przeciwko nam."
 CZE_grow_the_anglo_czechoslovak_prague_credit_bank: "Bank angielsko-czechosłowacki"
 CZE_grow_the_anglo_czechoslovak_prague_credit_bank_desc: "Angielsko-Czechosłowacki Bank Kredytowy to jedna z głównych sił napędowych naszego przemysłu. Bez jego pieniędzy nie utrzymalibyśmy tak wielu firm eksportujących swoje towary. Utworzenie jego oddziałów w Nowym Jorku i zacieśnienie więzi z władzami [ENG.GetAdjective] sprawią, że bank stanie się jeszcze większy. Ponadto [ENG.GetName] zyska powód, by wpierać dalsze istnienie naszego państwa."
 CZE_feeding_the_alligator: "Karmienie krokodyla"
 CZE_feeding_the_alligator_desc: "Plany rządu [GER.getadjective] wobec Kraju Sudetów zagrażają istnieniu naszego kraju. Jeżeli damy im to, czego chcą, prawdopodobnie dadzą nam spokój. Prawda?"
 CZE_complete_capitulation: "Bezwarunkowa kapitulacja"
 CZE_complete_capitulation_desc: "Czy mamy inne wyjście niż ustąpić? Nie oprzemy się burzy, która zbiera się na horyzoncie. Może porozumienie z władzami [GER.getadjective], gdy mamy jeszcze jakieś atuty, sprawi, że zachowamy choć częściową niepodległość."
 CZE_stabilize_the_protectorate: "Ustabilizujmy protektorat"
 CZE_stabilize_the_protectorate_desc: "Protektorat trudno nazwać stabilnym. Musimy podjąć działania, które przekonają nasze społeczeństwo, że jesteśmy prawowitym rządem i możemy zaspokajać potrzeby obywateli."
 CZE_stabilize_the_protectorate_unretire_henlein_tt: "§Y$CZE_konrad_henlein$§! powróci z emerytury w: §Y[ROOT.GetName]§!"
 CZE_full_faith_in_hacha: "Całkowita wiara w Háchę"
 CZE_full_faith_in_hacha_desc: "$CZE_emil_hacha$ cieszy się w naszym społeczeństwie większymi szacunkiem i popularnością niż $CZE_emanuel_moravec$. Jego praca może wyglądać podejrzanie, ale nie da się zastąpić tak popularnej marionetki."
 CZE_moravecs_bohemia: "Czechy Moraveca"
 CZE_moravecs_bohemia_desc: "Krążą plotki, że $CZE_emil_hacha$ stara się podkopać pozycję naszego rządu. Jeśli chcemy odnieść sukces i rozwijać się w obecnych warunkach, potrzebujemy przywództwa, któremu bliższa będzie ideologia naszego władcy."
 CZE_form_the_government_army: "Utworzenie armii rządowej"
 CZE_form_the_government_army_desc: "Jeżeli nasz kraj ma odnieść sukces, musimy powołać nową armię, pozbawioną wad poprzedniej. Dowództwo musi być bardziej politycznie dopasowane do rządu."
 CZE_forced_administration_of_companies: "Przymusowe administrowanie firmami"
 CZE_forced_administration_of_companies_desc: "Mimo potężnego nadzoru, niektóre firmy nadal działają poza naszą kontrolą. Czas narzucić im naszą administrację."
 CZE_revisit_custom_union_talks: "Powrót do rozmów o unii celnej"
 CZE_revisit_custom_union_talks_desc: "Rozmowy o unii celnej z niektórymi naszymi sąsiadami nie potoczyły się dobrze w porównaniu z innymi. Czas do nich wrócić i ponownie naciskać w sprawie zawarcia takiego porozumienia między naszymi krajami."
 CZE_revisit_custom_union_talks_tt: "Wciąż będziemy mogli wykorzystać inne §Ysposoby§!, by przekonać ich do przyłączenia się do nas."
 CZE_revisit_custom_union_talks_2_tt: "Będą skłonniejsi spełnić nasze żądania dołączenia do naszej federacji"
 CZE_reintegrate_cross_border_rail_connections: "Modernizacja transgranicznych połączeń kolejowych"
 CZE_reintegrate_cross_border_rail_connections_desc: "Modernizacja połączeń kolejowych z naszymi sąsiadami to dobry sposób na zyskanie ich przychylności. Tym bardziej, gdybyśmy zamierzali zacieśnić więzi gospodarcze łączące nasze kraje."
 CZE_reintegrate_cross_border_rail_connections_flag: "Zmodernizowano transgraniczne połączenia kolejowe"
 CZE_vonapo_20: "VONAPO 20"
 CZE_vonapo_20_desc: "Nie tylko naszym zdaniem [GER.GetNameDef] to narastające zagrożenie, dlatego opracowano plan współpracy z rządem [SOV.GetAdjective] przy gromadzeniu danych wywiadowczych, dzięki czemu łatwiej będzie nam pokrzyżować [GER.GetAdjective] plany."
 CZE_increase_funding_from_moscow: "Zwiększenie finansowania z: [SOV.capital.GetCapitalVictoryPointName]"
 CZE_increase_funding_from_moscow_desc: "[ROOT.GetCommunistParty] ma tak mało pieniędzy, że obecnie płaci za swój rozwój z wynagrodzeń swoich przedstawicieli. Żeby się rozwijać, musimy zwrócić się do władz [SOV.GetAdjective] o zwiększenie finansowania przeznaczonego na dystrybucję naszej gazety i werbowanie nowych członków."
 CZE_zdenek_fierlinger_tt: "Mianowanie doradcy: §Y$CZE_zdenek_fierlinger$§!"
 CZE_expand_the_communist_press: "Rozbudowa prasy komunistycznej"
 CZE_expand_the_communist_press_desc: "Nasza gazeta codzienna \"Czerwone Prawo\" może stać się źródłem informacji dla ludzi, którzy obecnie nie czytają żadnej prasy, potrzebujemy tylko zwiększenia jej finansowania."
 CZE_anti_rearmament_propaganda: "Propaganda przeciw zbrojeniom"
 CZE_anti_rearmament_propaganda_desc: "Upadek faszystowskiego rządu naszego największego przeciwnika, którym jest [GER.GetNonIdeologyName], pokazuje, że od początku mieliśmy rację, sprzeciwiając się zbrojeniom."
 CZE_anti_democratic_propaganda: "Antydemokratyczna propaganda"
 CZE_anti_democratic_propaganda_desc: "By zbudować poparcie dla naszej partii, musimy ukazać błędy poprzednich rządów republiki i udowodnić, że będąc na ich miejscu, lepiej byśmy sobie poradzili."
 CZE_form_workers_brigades: "Utworzenie bojówek robotników"
 CZE_form_workers_brigades_desc: "Robotnicy, których wyzwalamy, muszą być gotowi do udziału we wspólnej walce. Może nie są wyszkolonymi żołnierzami, ale w zależności od wykonywanej pracy mogą działać jako specjaliści."
 CZE_kohler_faction: "Frakcja Köhlera"
 CZE_kohler_faction_desc: "Frakcja Brunona Köhlera uważa, że burżuazję należy obalić przemocą, jeśli ma powstać działające państwo czechosłowackie."
 CZE_gottwald_faction: "Frakcja Gottwalda"
 CZE_gottwald_faction_desc: "Stalinowska frakcja Klementa Gottwalda, ślepo wierna Moskwie, zamierza urządzić państwo czechosłowackie na wzór ZSRR."
 CZE_zapotocky_faction: "Frakcja Zápotockego"
 CZE_zapotocky_faction_desc: "Założyciele partii komunistycznej Bohumir Šmeral i Antonin Zápotocký chcieli prowadzić bardziej umiarkowaną politykę niż ta, którą narzucił partii Klement Gottwald. Musimy wrócić do tych korzeni, aby naprawdę skutecznie trafić do [CZE.GetAdjective] społeczeństwa."
 CZE_ally_with_moderate_socialists: "Współpraca z umiarkowanymi socjalistami"
 CZE_ally_with_moderate_socialists_desc: "Są kraje, gdzie [SOV.GetLeader] nie cieszy się uwielbieniem, a komuniści nie odnoszą sukcesów wyborczych. Dlatego nie powinniśmy stronić od współpracy z bardziej umiarkowanymi ruchami."
 CZE_democracies_willing_to_join_faction_tt: "§YKraje demokratyczne chętnie wejdą do naszej frakcji komunistycznej.§!"
 CZE_limited_cooperation: "Ograniczona współpraca z: [SOV.GetLeader]"
 CZE_limited_cooperation_desc: "Chociaż różnią nas ideologie, nawet władze [SOV.GetAdjective] mogą uznać nas za cennych partnerów i uczestniczyć w bardziej pragmatycznych porozumieniach, a jednocześnie potępiać nas w swoich gazetach."
 CZE_denounce_stalinism: "Potępienie stalinizmu"
 CZE_denounce_stalinism_desc: "Podłości Stalina na zawsze splamiły reputację komunizmu, czas podjąć działania militarne, by wyzwolić narody spod władzy takich samych reżimów."
 CZE_country_leader_has_ideology_stalinism_tt: "Ideologia przywódcy kraju: §Y$stalinism$§!"
 CZE_cooperate_with_tito: "Współpraca z Tito"
 CZE_cooperate_with_tito_desc: "[YUG.GetNameDefCap] próbuje, podobnie jak my, pragmatycznej wersji komunizmu – też pragnie zjednoczyć różne ludy pod czerwonym sztandarem. W obliczu tych wyzwań powinniśmy współpracować w kwestiach politycznych i militarnych."
 CZE_reduce_divided_nation_cost_tt: "Zmniejszenie kosztu i czasu trwania większości decyzji §Ypodzielonego państwa§!."
 CZE_balkan_union: "Powiększenie unii"
 CZE_balkan_union_desc: "Chociaż coraz więcej krajów regionu wchodzi na ścieżkę komunizmu, to bez silnej współpracy nie jesteśmy w stanie bronić się przed wielkimi mocarstwami. Najłatwiej zrobimy to, jeśli stworzymy unię."
 CZE_cooperation_with_the_ussr: "Współpraca z: [SOV.GetLeader]"
 CZE_cooperation_with_the_ussr_desc: "Nawet najbardziej żarliwi poplecznicy państwa [SOV.GetAdjective] spośród członków partii, którzy odwiedzili ten kraj, zdają sobie sprawę z wad przeprowadzonej tam kolektywizacji. Jeśli podejmiemy współpracę z nimi przy kolektywizacji, możemy dogłębnie przeanalizować, co się tam nie udało, a co zakończyło sukcesem, po czym opracować plan wdrożenia rozwiązań najlepszych dla państwa [ROOT.GetAdjective]"
 CZE_exchange_military_expertise: "Wymiana doświadczeń militarnych"
 CZE_exchange_military_expertise_desc: "[SOV.GetNameDefCap], jak większość mocarstw posiadających duże armie, eksperymentuje na polu taktyki. Powinniśmy zwrócić się do nich o podzielenie się wnioskami, a w zamian udostępnimy nasze."
 CZE_pressure_romania: "Nacisk na Rumunię"
 CZE_pressure_romania_desc: "[ROM.GetNameDefCap] może okazać się poważnym zagrożeniem, jeśli porozumie się z naszymi wrogami. Może doprowadzić do pogorszania naszych stosunków z rządem [SOV.GetAddjective] albo dostarczyć naszym rywalom ropę. Z [SOV.GetAdjective] wsparciem jesteśmy na tyle groźni, że bez uciekania się do wojny możemy przekonać rząd [ROM.GetAdjective] do współpracy z nami."
 CZE_facility_in_state_tt: "Jeżeli w regionie $STATE|Y$ nie istnieją inne §Yplacówki eksperymentalne§!, zyskamy §G1§! $FACILITY_TYPE|Y$ w: $STATE|Y$."
 CZE_spread_the_revolution: "Szerzenie rewolucji"
 CZE_spread_the_revolution_desc: "Skoro rewolucja w państwie [ROOT.GetAdjective] powiodła się, powinniśmy zachęcić proletariat za granicą do walki o wolność. Możemy pomóc mu w tych zmaganiach."
 CZE_agrarian_reform: "Przywrócenie urzędu ds. gruntów"
 CZE_agrarian_reform_desc: "Niedawno zlikwidowany urząd ds. gruntów odpowiadał za redystrybucję terenów uprawnych (głównie), czas zreformować tę instytucję, by mogła korzystać z bardziej drastycznych środków."
 CZE_realign_the_church: "Ateizm państwowy"
 CZE_realign_the_church_desc: "Religia już za długo jest elementem dzielącym [CZE.GetAdjective] społeczeństwo. Musimy ograniczyć jej wpływ na sprawy państwowe, takie jak edukacja i media, dzięki czemu naród stanie się bardziej zjednoczony."
 CZE_create_a_secret_police_branch: "Utworzenie tajnego wydziału policji"
 CZE_create_a_secret_police_branch_desc: "By zapewnić stabilizację, musimy bronić się przed wrogami zewnętrznymi i wewnętrznymi. Społeczeństwo potrzebuje czasu, by przywyknąć do nowego systemu, szczególnie że ten jest dopiero udoskonalany."
 CZE_promote_urbanization: "$ARG_promote_urbanization$"
 CZE_promote_urbanization_desc: "Teraz, gdy udało nam się stworzyć wydajne gospodarstwa spółdzielcze, możemy uruchomić programy mające na celu zachęcenie części ludności wiejskiej do przeniesienia się do miast i zwiększenie ich produktywności."
 CZE_confiscate_church_lands: "Konfiskata ziem kościelnych"
 CZE_confiscate_church_lands_desc: "Kościół posiada o wiele więcej ziem i bogactwa, niż potrzebuje. Musimy przekazać część tych terenów w inne ręce, tak jak było w przypadku rolników."
 CZE_change_the_narrative: "Zmiana narracji"
 CZE_change_the_narrative_desc: "Choć Kościół na razie nie poparł naszej rewolucji, dostosowanie jego wartości do naszych może odegrać istotną rolę w budowaniu poparcia dla nowych władz."
 CZE_the_second_fortification_program: "Rozpoczęcie drugiego programu rozbudowy fortyfikacji"
 CZE_the_second_fortification_program_desc: "Pierwszy program budowy fortyfikacji stworzył podwaliny pod kolejne etapy rozbudowy. Dla dobra przyszłości naszego kraju musimy jak najszybciej ruszyć z drugim programem powiększenia i projektowania umocnień."
 CZE_redirect_the_fortification_councils_funds: "Przekierowanie funduszy Rady ds. Umocnień"
 CZE_redirect_the_fortification_councils_funds_desc: "Te programy rozbudowy fortyfikacji potężnie obciążają naszą gospodarkę. Środki te można lepiej spożytkować poprzez finansowanie innych programów. Przecież wojsko nie potrzebuje już więcej umocnień, ma ich pod dostatkiem."
 CZE_jachymov_uranium_mine: "Kopalnia uranu Jachymów"
 CZE_jachymov_uranium_mine_desc: "Kopalnia w Jachymowie przez długi czas dostarczała uran oraz inne rudy, jednak ten pierwszy nie miał zbyt wielu zastosowań do czasu najnowszych przełomów w fizyce."
 CZE_skoda_internal_competition: "Zachęta do wewnętrznej konkurencji"
 CZE_skoda_internal_competition_desc: "W tak dużej firmie jak Škoda trudno jest utrzymać najwyższą wydajność wszystkich pracowników. Zachęty do wewnętrznej konkurencji mogą znacznie poprawić produktywność ludzi we wszystkich naszych fabrykach."
 CZE_skoda_max_optimization_tt: "Maksymalny poziom optymalizacji §Ypriorytetu na Škodę§! wzrośnie do 7."
 CZE_skoda_increase_cooperation: "Bliższa współpraca ze Škodą"
 CZE_skoda_increase_cooperation_desc: "W celu poprawienia naszej sytuacji możemy poprawić wydajność poprzez zwiększenie współpracy między fabrykami. Może to też zachęcić je do dzielenia się doświadczeniami."
 CZE_skoda_fast_optimization_tt: "Wartość o jaką z czasem rośnie ku maksymalnej wartości poziom optymalizacji §Ycelu Škody§! £GFX_prod_eff_cap: §G+100,0%§!"
 CZE_master_of_armaments: "Mistrz Uzbrojenia"
 CZE_master_of_armaments_desc: "Zakłady Škoda są największym producentem uzbrojenia na naszych ziemiach od czasów Austro-Węgier. Ich wiedza i doświadczenie nie mają sobie równych wśród konglomeratów przemysłowych naszego kraju. Czas nadać im tytuł Mistrza Uzbrojenia."
 CZE_only_the_best_is_good_enough: "Zadowoli nas tylko to, co najlepsze"
 CZE_only_the_best_is_good_enough_desc: "Zakłady Škoda zawsze szczyciły się etyką ciężkiej pracy i duchem innowacyjności. Nasi założyciele zawsze kierowali się mottem: \"Naszych klientów zadowoli tylko to, co najlepsze!\" W obecnych czasach te słowa są jeszcze bardziej prawdziwe."
 CZE_an_industrial_legacy: "Przemysłowe dziedzictwo"
 CZE_an_industrial_legacy_desc: "Skoro wprowadziliśmy nasz przemysł krajowy na niewyobrażalne wcześniej wyżyny, możemy wreszcie przyjąć i wykorzystać nasze przemysłowe dziedzictwo. Jesteśmy industrialnym gigantem."
 CZE_powerhouse_of_europe: "Europejska potęga"
 CZE_powerhouse_of_europe_desc: "Nasz przemysł wzbudza teraz zazdrość całego świata. Musimy zadbać o to, by nasz sektor energetyczny był w stanie zapewnić mu odpowiednie zasilanie."
 CZE_supply_fighters_for_allies: "Dostawy myśliwców do aliantów"
 CZE_supply_fighters_for_allies_desc: "Rządy [FRA.GetAdjective] i [ENG.GetAdjective] bardzo obawiają się, że kiedy wybuchnie konflikt, [GER.GetAdjective] samoloty szybko uporają się z ich obroną i uderzą na miasta. Jeśli ich siły powietrzne zostaną wzmocnione, wzrośnie potencjał tych państw do zatrzymania [GER.GetAdjective] ekspansji bez poświęcania wielu istnień."
 CZE_allies_more_likely_to_defend_us_tt: "§YAlianci będą skłonniejsi wesprzeć nas w walce z niemieckim ekspansjonizmem dotyczącym Kraju Sudetów.§!"
 CZE_allies_more_likely_to_defend_us_2_tt: "§YAlianci będą znacznie skłonniejsi wesprzeć nas w walce z niemieckim ekspansjonizmem dotyczącym Kraju Sudetów.§!"
 CZE_allies_more_likely_to_defend_us_3_tt: "§YAlianci będą trochę skłonniejsi wesprzeć nas w walce z niemieckim ekspansjonizmem dotyczącym Kraju Sudetów.§!"
 CZE_establish_the_state_defense_guard: "Utworzenie Narodowej Straży Obronnej"
 CZE_german_nonagressionpact: "Pakt Haushofer-Krofta"
 CZE_german_nonagressionpact_desc: "Negocjacje w sprawie paktu o nieagresji z rządem [GER.GetAdjective] trwały już jakiś czas, ale zostały przerwane, gdy pojawiły się symptomy destabilizacji państwa [SOV.GetAdjective] i nowe plany ekspansji. W tej chwili [GER.GetNameDef] zajmują się swoimi wrogami, więc musimy podjąć próbę wznowienia tych rozmów."
 CZE_revive_the_czechoslovak_legion_dynamic: "[CZE_revive_the_czechoslovak_legion]"
 CZE_revive_the_czechoslovak_legion_default: "Odnowienie Legionu Czechosłowackiego"
 CZE_revive_the_czechoslovak_legion_communist: "Utworzenie organizacji ochotników"
 CZE_revive_the_czechoslovak_legion_dynamic_desc: "Na całym świecie rosną niepokoje, a dzielni żołnierze [ROOT.GetAdjective] są gotowi do obrony ojczyzny. Ale przeszłość pokazała, że czasami nasze wojska muszą walczyć za granicą, by bronić ojczyzny. Dlatego znowu musimy znaleźć ludzi gotowych opuścić swoje domy, aby ich bronić."
 CZE_revive_the_czechoslovak_legion_nsb_tt: "§Y$CZE_legacy_of_the_czechoslovak_legion_army_spirit$§! przestanie być §Yduchem armii§! i stanie się §Yduchem narodowym§!."
 CZE_state_sponsored_recruitment_for_spain: "Finansowana przez państwo rekrutacja dla Hiszpanii"
 CZE_state_sponsored_recruitment_for_spain_desc: "Wybuchł nowy konflikt, w którym [ROOT.GetAdjective] weterani walk mogą odegrać kluczową rolę. Powinniśmy ich zachęcić do opowiedzenia się po stronie, której polityka jest nam najbliższa. Jednocześnie moglibyśmy dowiedzieć się, jak przez ostatnią dekadę zmieniła się sztuka wojenna."
 CZE_support_spain_reward_tt: "§YEfekty, jeżeli wygra lub przegra hiszpańska frakcja, dla której będą walczyć nasi ochotnicy:§!"
 CZE_profit_off_the_spanish_civil_war: "Korzyści z hiszpańskiej wojny domowej"
 CZE_profit_off_the_spanish_civil_war_desc: "Hiszpańska wojna domowa staje się konfliktem zastępczym dla wielkich mocarstw. Nie powinniśmy wtrącać się do trwających walk i narażać naszych dzielnych żołnierzy. Ale to doskonała okazja na sfinansowanie rozbudowy naszego przemysłu dzięki sprzedaży broni – nawet obu stronom sporu."
 CZE_skoda_sell_weapons_to_SPR_tt: "Odblokowanie decyzji: §YPotajemna sprzedaż broni do hiszpańskiej frakcji§!"
 CZE_placate_benes_faction: "Ustąpmy frakcji Beneša"
 CZE_placate_benes_faction_desc: "$CZE_milan_hodza$ musi pogodzić się z faktem, że jego działalność jako ministra spraw zagranicznych była katastrofalna. $CZE_edvard_benesh$ jest gotów wejść do gry wraz ze swoimi agrarianami i umocnić władzę, którą sprawuje premier $CZE_milan_hodza$, jeśli ten zrezygnuje ze stanowiska ministra spraw zagranicznych."
 CZE_claim_lands_of_the_bohemian_crown: "Przejęcie ziem korony czeskiej"
 CZE_claim_lands_of_the_bohemian_crown_desc: "Ponieważ przez wiele wieków nasz kraj znajdował się na pograniczu różnych imperiów, nasze granice zmieniały się częściej w wyniku wojen niż woli jego mieszkańców. Nadszedł czas naprawić tę zmianę."
 CZE_demand_katowice: "Zażądajmy regionu [762.GetName]"
 CZE_demand_katowice_desc: "Przejęcie kontroli nad regionem [762.GetName] oznaczałoby nie tylko przywrócenie naszych dawnych granic, ale też osłabienie [POL.GetAdjective] roszczeń do regionu [72.GetName]."
 CZE_fight_over_silesia: "Walka o Śląsk"
 CZE_fight_over_silesia_desc: "Może Śląsk zgodnie z prawem jest ziemią [ROOT.GetAdjective], ale lepiej unikać otwartej wojny z: [66.owner.GetNameDef]. Musimy zademonstrować naszą siłę w dużej potyczce granicznej, być może w ten sposób zdobędziemy terytorium bez wszczynania wojny, jeśli [66.owner.GetNameDef] nie chce walczyć w obronie Śląska."
 CZE_dismantle_poland: "Rozbiór: [POL.GetNonIdeologyName]"
 CZE_dismantle_poland_desc: "Wyraźnie widać, że [POL.GetNameDef] nie może się bronić samotnie, zatem nie stanie się buforem chroniącym nas przed naszymi wrogami. Zamiast tego powinniśmy wzmocnić nasze państwo."
 CZE_proclaim_the_restoration_of_bohemia: "Ogłoszenie przywrócenia Królestwa Czeskiego"
 CZE_proclaim_the_restoration_of_bohemia_desc: "Jeśli przywrócimy nasze dawne granice, możemy odzyskać swoje dziedzictwo i skoncentrować się na integracji pozyskanych ziem."
 CZE_integrate_lost_territories: "Integracja utraconych terytoriów"
 CZE_integrate_lost_territories_desc: "Historyczne ziemie Królestwa Czeskiego rozciągają się od Morza Bałtyckiego aż po Adriatyk. Nadszedł czas odwołać się do tej spuścizny w procesie integracji naszych nowych posiadłości."
 CZE_deepen_ties_with_puppet_kingdoms: "Zacieśnienie więzów z marionetkowymi królestwami"
 CZE_deepen_ties_with_puppet_kingdoms_desc: "Choć mamy wyraźnie nakreśloną strefę wpływów, musimy ją rozszerzyć, aby czerpać jak największe korzyści ze współpracujących z nami krajów."
 CZE_poland_alliance_monarchist: "Porozumienie z: [POL.GetNonIdeologyName]"
 CZE_poland_alliance_monarchist_desc: "$CZE_ally_poland_desc$"
 CZE_a_strong_poland: "Silna [POL.GetNonIdeologyName]"
 CZE_a_strong_poland_desc: "[POL.GetNameDef] posiada jedną z najsilniejszych armii Europy Wschodniej, dzięki czemu może stać się cennym sojusznikiem."
 CZE_mend_balkan_relations: "Naprawa stosunków na Bałkanach"
 CZE_facilitate_a_strong_hungary: "Ułatwienie budowy silnych Węgier"
 CZE_facilitate_a_strong_hungary_desc: "Od czasu uzyskania niepodległości [HUN.GetNameDef] mają z nami kruche stosunki. Ale nadchodzi konflikt, więc może uda się pozyskać ich dla naszej sprawy."
 CZE_subjegate_romania: "Nacisk na Rumunię w sprawie [HUN.GetAdjective] roszczeń"
 CZE_subjegate_romania_desc: "Roszczenia naszej [HUN.GetAdjective] marionetki to użyteczne narzędzie przeciwko rządowi [ROM.GetAdjective] Grożąc, że pozwolimy władzom [HUN.GetAdjective] wysunąć roszczenia do [ROM.GetAdjective] terytoriom i pomożemy im zdobyć te ziemie, możemy sprawić, że [ROM.GetNameDef] zacznie z nami współpracować."
 CZE_demanded_overlordship_HUN: "Podporządkowano Węgry"
 CZE_demanded_overlordship_ROM: "Podporządkowano Rumunię"
 CZE_integrate_hungary: "Integracja dawnych austriackich terytoriów"
 CZE_integrate_hungary_desc: "Skoro zbudowaliśmy dużą strefę wpływów, zintegrowanie świeżo powiększonego państwa [HUN.GetAdjective] i innych terytoriów mogłoby doprowadzić do odnowienia granic Austro-Węgier, ale pod [ROOT.GetAdjective] przywództwem."
 CZE_subjegate_serbia: "Podporządkuj: [YUG.GetName]"
 CZE_subjegate_serbia_desc: "Osłabione państwo [YUG.GetAdjective] przestało być skutecznym buforem chroniącym naszą południową flankę. Po zintegrowaniu Słowenii powinniśmy kontynuować ekspansję."
 CZE_strike_the_eastern_threat: "Uderzenie w zagrożenie ze wschodu"
 CZE_strike_the_eastern_threat_desc: "Hipokryci z władz [SOV.GetAdjective] usprawiedliwiają swoje imperialne ambicje, krytykując nasz rząd. Ten kraj to zagrożenie dla istnienia państwa [CZE.GetAdjective] i trzeba się go pozbyć."
 CZE_assist_austria: "Ochrona: [AUS.GetName]"
 CZE_assist_austria_desc: "Utrzymywanie państwa [AUS.GetAdjective] z dala od wszelkich konfliktów ma kluczowe znaczenie dla naszego bezpieczeństwa narodowego. Granica [AUS.GetAdjective] to jeden z najwrażliwszych punktów naszej obrony. Gospodarka tego kraju mogłaby stać się cennym zasobem naszych wrogów, do czego nie możemy dopuścić."
 CZE_return_to_democracy: "Przywróćmy demokrację"
 CZE_return_to_democracy_desc: "Nasza ojczyzna jest bezpieczna, a w społeczeństwie rośnie świadomość, że dyktatura wojskowa przestała być skutecznym ustrojem. Czas rozpisać wybory i oddać władzę z powrotem w ręce demokratycznej administracji cywilnej."
 CZE_cooperate_with_the_allies: "Współpraca z aliantami"
 CZE_cooperate_with_the_allies_desc: "Po zaprowadzeniu większej równowagi w tym regionie możemy rozpocząć działania na rzecz odnowienia więzi z naszymi tradycyjnymi sojusznikami."
 CZE_eliminate_austrian_defeatists: "Pokonaj [AUS.GetAdjective] defetystów"
 CZE_eliminate_austrian_defeatists_desc: "[AUS.GetNameDefCap] nie ma już woli obrony własnego państwa. Musimy natychmiast interweniować, zanim wróg zjawi się u naszych bram."
 CZE_the_legacy_of_ottokar: "Spuścizna Ottokara"
 CZE_the_legacy_of_ottokar_desc: "Legendarny król Ottokar II powiększył królestwo Czech o Austrię i aż po Adriatyk za zgodą austriackiej arystokracji. Znowu musimy zwrócić się do Austriaków, zarówno tych szlachetnie urodzonych, jak i pochodzących z gminu."
 CZE_demand_the_istrian_peninsula: "Domagajmy się Istrii."
 CZE_demand_the_istrian_peninsula_desc: "[ROOT.GetNameDefCap] to kraj bez dostępu do morza, co już zbyt długo stanowi przeszkodę dla naszych wpływów oraz handlu. Nasza gospodarka nie może dłużej działać na łasce sąsiednich państw, dlatego powinniśmy zażądać dostępu do Atlantyku."
 CZE_demand_slovenia: "Domagajmy się Słowenii."
 CZE_demand_slovenia_desc: "Słowenia była ważną częścią Cesarstwa Austriackiego, a skoro przejęliśmy kontrolę nad sercem tego imperium, powinniśmy dążyć do ponownego odzyskania tych terytoriów."
 CZE_demand_overlordship_of_yugoslav_league: "Domagajmy się władzy nad Ligą [YUG.GetAdjective]"
 CZE_demand_overlordship_of_yugoslav_league_desc: "Zarówno my, jak i rząd [YUG.GetAdjective] wiemy, że autonomia lokalna jest czasem niezbędna w wieloetnicznym państwie, ale ich sojusz jest teraz zbyt słaby, aby móc obronić się samodzielnie. Dlatego trzeba sprawić, by władze [YUG.GetAdjective] to zrozumiały i pozwoliły nam interweniować."
 CZE_expand_the_rome_protocols: "Rozszerzenie protokołów rzymskich"
 CZE_expand_the_rome_protocols_desc: "Naszemu nowemu rządowi jest bliżej do władz [ITA.GetAdjective] niż do administracji [GER.GetAdjective], z którą to [ITA.capital.GetCapitalVictoryPointName] spiera się o Austrię. Gdyby państwo [ITA.GetAdjective] dołączyło do protokołów rzymskich, zyskałoby impuls do pozostania na obecnym kursie, zamiast skłaniać się ku bliższym stosunkom z rządem [GER.GetAdjective]"
 CZE_prague_protocols: "Protokoły praskie"
 CZE_soviet_alliance: "Powiększenie traktatu sojuszniczego z 1935 r."
 CZE_soviet_alliance_desc: "Aktualny traktat sojuszniczy zawarty z rządem [SOV.GetAdjective] jest zbyt mętny, by można było stwierdzić, że gwarantuje ich interwencję, gdybyśmy zostali zaatakowani. Dlatego musimy zaproponować im nowe porozumienia, jeżeli chcemy zagwarantować sobie bezpieczeństwo."
 CZE_airlift_soviet_support: "Powietrzny transport radzieckiego wsparcia"
 CZE_airlift_soviet_support_desc: "Brak granic z naszym [SOV.GetAdjective] sojusznikiem sprawił, że pojawił się nowatorski pomysł przerzucenia wojsk [SOV.GetAdjective] drogą powietrzną. Byłaby to pierwsza w historii operacja transportowa takich rozmiarów, ale dzięki temu żołnierze [SOV.GetAdjective] nie musieliby wchodzić na terytorium naszych sąsiadów, przynajmniej na lądzie."
 CZE_unlocks_volunteer_transport_raid_tt: "Odblokowanie §Ynalotu§!:\nMost powietrzny dla sowieckich ochotników w: §Y[73.GetName]§!"
 CZE_intervene_in_the_ussr: "Interwencja w [SOV.GetAdjective] wojnie domowej"
 CZE_intervene_in_the_ussr_desc: "[SOV.GetNameDef]: znowu dochodzi tam do niepokojów i choć dawna rodzina carska, którą wspieraliśmy, nie odzyska już władzy, nie możemy zignorować możliwości powstania bardziej sprzyjającego nam rządu."
 CZE_forgive_trading_debts: "Anulowanie długów handlowych"
 CZE_forgive_trading_debts_desc: "Destabilizacja gospodarki i wielki kryzys sprawiły, że część naszych potencjalnych sojuszników ma wobec nas długi, z których spłacaniem mają problemy, co szkodzi naszym stosunkom. Rząd mógłby anulować te długi i zapłacić krajowym przedsiębiorstwom, które mogłyby ucierpieć na skutek tego posunięcia."
 CZE_improve_balkan_trade_relations: "Poprawa relacji handlowych na Bałkanach"
 CZE_improve_balkan_trade_relations_desc: "Naszym największym atutem, który może pomóc w pozyskaniu sojuszników na Bałkanach, jest nasza gospodarka. Powinniśmy pokazać, że jesteśmy gotowi przeznaczyć środki na poprawę sytuacji gospodarczej naszych potencjalnych sojuszników."
 CZE_ally_austria: "Sojusz z: [AUS.GetName]"
 CZE_ally_austria_desc: "Rząd [AUS.GetAdjective] omal nie został obalony przez nazistowskich bandziorów ledwie kilka lat temu, więc powinien dostrzec korzyści płynące ze współpracy z państwem [ROOT.GetNameDef]."
 CZE_demand_the_czech_corridor: "Żądanie utworzenia Korytarza Czeskiego"
 CZE_demand_the_czech_corridor_desc: "W miarę jak przekształcamy Małą Ententę w pełnoprawny sojusz, coraz bardziej oczywisty staje się fakt, że w razie konfliktu wysłanie wojsk do naszych sojuszników lub przyjęcie ich oddziałów może okazać się bardzo trudne. Wydzielenie pasa łączącego nasz kraj z [YUG.GetAdjective] terytorium - zgodnie z propozycją zgłoszoną po zakończeniu wielkiej wojny - mogłoby zwiększyć nasze bezpieczeństwo i zabezpieczyć nasz handel."
 CZE_ally_hungary: "Sojusz z: [HUN.GetName]"
 CZE_ally_hungary_desc: "Mimo konfliktów, które zatruwały nasze stosunki z rządem [HUN.GetAdjective] od narodzin państwa [CZE.GetAdjective], od niedawna dostrzegamy w nich potencjał do stania się cennym sojusznikiem."
 CZE_ally_yugoslavia: "Sojusz z: [YUG.GetName]"
 CZE_ally_yugoslavia_desc: "[YUG.GetNameDefCap] ma w ostatnim czasie problemy gospodarcze, ale należy pamiętać o ich zasobach strategicznych i położeniu."
 CZE_protect_neutrality: "Ochrona neutralności"
 CZE_protect_neutrality_desc: "Pierwsza wojna światowa wyraźnie pokazała, że próby zachowania neutralności są daremne, gdy wróg weźmie kogoś na celownik. Ochrona tych krajów oznacza zmuszenie naszych wrogów do prowadzenia wojny na dwa fronty w czasie ekspansji, zamiast pozwalać im rozdawać karty."
 CZE_if_cooperate_with_moderate_socialists_completed_tt: "Efekty ukończenia §Ywspółpracy z umiarkowanymi socjalistami§!:"
 CZE_mutual_protection_agreement_with_switzerland: "Umowa o ochronie z: [SWI.GetNonIdeologyName]"
 CZE_mutual_protection_agreement_with_switzerland_desc: "Zarówno my, jak i [SWI.GetNameDef] prowadzimy działania, które mają spowodować, że inwazja na nasze terytoria będzie niemożliwa bez poniesienia przytłaczających strat. Dzięki współpracy możemy stworzyć armię tak liczną, że zdolną nie tylko do działań obronnych, ale także do przeprowadzenia skutecznego kontrataku."
 CZE_exchange_technology: "Współpraca badawcza"
 CZE_exchange_technology_desc: "Mimo ogromnej ilości zasobów naturalnych, na Bałkanach nie ma dochodowych kolonii ani nowoczesnego przemysłu wielkich mocarstw. Dlatego tak istotna jest współpraca badawcza, która pozwoli nam skupić się na naszych specjalnościach."
 CZE_demand_corridor_to_ussr: "Zażądaj my korytarza do terytorium [SOV.GetAdjective]"
 CZE_demand_corridor_to_ussr_desc: "Jeżeli [POL.GetNameDef] nie będzie z nami współpracować, podejmiemy bardziej zdecydowane działania, by zapewnić sukces naszych [SOV.GetAdjective]"
 CZE_ally_poland: "Sojusz z: [POL.GetName]"
 CZE_ally_poland_desc: "Mając w pamięci wojnę polsko-rosyjską i rosnące zagrożenie na zachodzie, [POL.GetNameDef], podobnie jak my, szuka gwarancji bezpieczeństwa. Musimy przekonać rząd [POL.GetAdjective], że neutralność ich nie uratuje i powinni sprzymierzyć się z nami."
 CZE_realize_the_polish_czechoslovak_confederation: "Utworzenie konfederacji"
 CZE_realize_the_polish_czechoslovak_confederation_desc: "Mimo bohaterskiej walki wojska [POL.GetAdjective] zostały pokonane, a rząd tego kraju udał się na uchodźstwo. Po tych wydarzeniach pojawił się pomysł stworzenia unii z naszym krajem. Łącząc nasze rządy, moglibyśmy zmobilizować społeczeństwo [POL.GetAdjective] pod sztandarem tego nowego państwa i przeprowadzić skoordynowane działania w celu wyzwolenia naszej wspólnej ojczyzny."
 CZE_integrate_western_ukrainians: "Integracja Ukraińców zachodnich"
 CZE_integrate_western_ukrainians_desc: "Ukraińcy zamieszkujący na [CZE.GetAdjective] terytorium otrzymali dużą pomoc i swobodę, a teraz możemy podjąć próbę zintegrowania nowo pozyskanych ziem z naszą ukraińską prowincją."
 CZE_ally_russia: "Sojusz z: [SOV.GetNonIdeologyName]"
 CZE_ally_russia_desc: "Skoro rząd [SOV.GetAdjective] podjął z nami bliższą współpracę, możemy spróbować ekspansji, opierając się na mętnym porozumieniu zawartym z ich poprzednim rządem."
 CZE_claim_ukraine: "Utworzenie przyjaznego rządu ukraińskiego"
 CZE_claim_ukraine_desc: "Ukraina to istotna część państwa [SOV.GetAdjective], jeśli ją zajmiemy, będziemy mogli utworzyć potężny obszar buforowy."
 CZE_strengthen_the_little_entente: "Sformalizowanie Małej Ententy"
 CZE_strengthen_the_little_entente_desc: "Mała Ententa dąży głównie do powstrzymania rządu [HUN.GetAdjective], ale ma potencjał stać się poważnym sojuszem posiadającym dużą armię."
 CZE_seek_french_leadership: "Zwróćmy się do rządu [FROM.GetAdjective] o przywództwo"
 CZE_seek_french_leadership_desc: "Choć utworzenie tego sojuszu to nasza inicjatywa, jest oczywiste, że armia [FRA.GetAdjective] byłaby świetnym uzupełnieniem każdego przymierza. Nawet gdyby wiązało się to z przekazaniem jej przywództwa."
 CZE_increase_food_and_resource_imports: "Zwiększenie importu żywności i surowców"
 CZE_increase_food_and_resource_imports_desc: "Nasi nowi sojusznicy mają rozwiniętą branżę rolną, zatem nasza nie musi już otrzymywać dopłat. Tani import surowców to dla nas oszczędność pieniędzy, a dla naszych sojuszników zastrzyk wzmacniający ich gospodarkę."
 CZE_double_down_on_heavy_industry: "Przyspieszenie rozwoju przemysłu ciężkiego"
 CZE_double_down_on_heavy_industry_desc: "Nowe porozumienia z naszymi sojusznikami pozwolą nam skoncentrować się na najbardziej konkurencyjnych branżach, takich jak przemysł zbrojeniowy. Nadmiar produkcji możemy sprzedać."
 CZE_neutralize_the_hungarian_threat: "Neutralizacja zagrożenia [HUN.GetAdjective]"
 CZE_neutralize_the_hungarian_threat_desc: "[HUN.GetNameDefCap] to przeszkoda na drodze do wymiany handlowej z potencjalnymi sojusznikami na południu, a jeśli dołączy do naszych wrogów, może związać istotną część naszej armii, mimo obowiązywania traktatu w Trianon."
 CZE_cancel_anti_hungary_focus: "Wycofano się po [GER.GetAdjective] interwencji"
 CZE_ally_romania: "Sojusz z: [ROM.GetName]"
 CZE_ally_romania_desc: "[ROM.GetNameDefCap] to jedno z najbardziej samowystarczalnych państw regionu, produkujące żywność i bezcenną ropę. Współpraca z nim nie tylko ułatwiłaby obu stronom wzajemny dostęp do zasobów, ale jednocześnie odcięła też naszych wrogów od surowców potrzebnych do wojny z nami."
 CZE_divide_germany: "Rozbiór Niemiec"
 CZE_divide_germany_desc: "Trudno zmagać się w pojedynkę z [GER.GetAdjective] zagrożeniem, dlatego powinniśmy szukać sojuszników, którzy, podobnie jak my, są zaniepokojeni [GER.GetAdjective] ekspansją i są gotowi podjąć działania wyprzedzające."
 CZE_if_FRA_ally_tt: "Efekty, jeśli §YFrancja jest monarchistyczna§! i nie współpracuje z nikim innym:"
 CZE_if_POL_ally_tt: "Efekty, jeśli §Ysilna Polska§! została ukończona, dzięki czemu [POL.GetNonIdeologyName] zapewnia gwarancję:"
 CZE_revolutionary_brigades: "Utworzono brygady rewolucyjne"
 CZE_revolutionary_brigades_desc: "Nasi rewolucjoniści, którzy walczą obecnie po stronie państwa [ROOT.GetAdjective], powinni stać się częścią armii zawodowej."
 CZE_recruit_communist_exiles: "Werbunek wypędzonych komunistów"
 CZE_recruit_communist_exiles_desc: "[ROOT.capital.GetCapitalVictoryPointName] to od dawna schronienie dla wypędzonych rewolucjonistów, którzy mogliby przydać się naszemu rządowi."
 CZE_destabilize_potential_adversaries: "Destabilizacja potencjalnych przeciwników"
 CZE_destabilize_potential_adversaries_desc: "Wypędzeni komuniści, z którymi pracujemy, znają swoją ojczyznę o wiele lepiej niż którykolwiek z naszych szpiegów. Musimy w pełni wykorzystać tę wiedzę podczas ustalania strategii wyzwalania ich ojczyzny."
 CZE_nationalize_key_industries: "Nacjonalizacja banków i kopalń"
 CZE_nationalize_key_industries_desc: "Kopalnie dostarczają surowce, z których nasz przemysł wytwarza narzędzia wojny. Zapewnienie dostaw materiałów w czasie kryzysu najlepiej zostawić w rękach rządu, a nie przemysłowców i finansistów."
 CZE_rehabilitate_the_army: "Rehabilitacja armii."
 CZE_rehabilitate_the_army_desc: "Większość generałów armii [CZE.GetAdjective] to weterani Legionu Czechosłowackiego, który walczył głównie z Sowietami podczas ich wojny domowej. Musimy dopilnować, by byli oni lojalni wobec rządu [CZE.GetAdjective]"
 CZE_unlock_civil_war_army_generals_tt: "Odzyskanie dowódców utraconych w wojnie domowej"
 CZE_recruit_ideologically_aligned_generals: "Werbunek ideologicznie wiernych generałów"
 CZE_recruit_ideologically_aligned_generals_desc: "Czas zmodyfikować nasze programy szkolenia i wprowadzić do armii nowych kandydatów, rozumiejących nowe wartości wojska."
 CZE_recruit_communist_generic_general_tt: "Zyskuje komunistycznego generała."
 CZE_purge_two_random_commanders_tt: "Dwaj losowo wybrani dowódcy padną ofiarami czystki."
 CZE_czechoslovak_union: "Związek Czechosłowacki"
 CZE_czechoslovak_union_desc: "Należy zwiększyć [CZE.GetAdjective] autonomię lokalną. Dzięki temu będzie można dostosować system komunistyczny do miejscowych warunków."
 CZE_continue_industrial_relocation_schemes: "Dalsza realizacja planów przeniesienia zakładów zbrojeniowych"
 CZE_continue_industrial_relocation_schemes_desc: "Ze względu na nasze bezpieczeństwo narodowe musimy kontynuować przenoszenie najbardziej zagrożonych fabryk na obszary, gdzie będą lepiej chronione przed atakami z powietrza i lądu. Nie możemy narażać tak ważnej gałęzi przemysłu."
 CZE_continue_industrial_relocation_schemes_tt: "Usuń §Y1 fabrykę wojskową§!."
 CZE_continue_industrial_relocation_schemes_2_tt: "§RFabryki będzie trzeba odbudować.§!"
 CZE_establish_a_armament_factory_in_uhersky_brod: "Zbudowano zakład zbrojeniowy Uherský Brod"
 CZE_establish_a_armament_factory_in_uhersky_brod_desc: "Fabryka w Uherským Brodzie to zakład zbrojeniowy specjalizujący się w wytwarzaniu i projektowaniu broni maszynowej dla piechoty i lotnictwa. Planujemy uczynić ją najnowocześniejszą fabryką tego rodzaju na świecie."
 CZE_appeal_to_the_castle: "Apel do Zamku"
 CZE_appeal_to_the_castle_desc: "W Czechosłowacji 'Zamek' oznacza rozległą sieć wpływowych organizacji i osób wspierających prezydentów. Dzięki tej władzy prezydenci mają większe wpływy, niż wynikałoby to z ich ograniczonych prerogatyw zapisanych w konstytucji. Apel o pomoc tej grupy mógłby przynieść nam ogromne korzyści w walce o przywództwo."
 CZE_petition_the_nobles: "Zwróćmy się do szlachty"
 CZE_petition_the_nobles_desc: "Szlachta [ROOT.GetAdjective] nie ma już uznawanych tytułów, ale wciąż stanowi wpływową część [ROOT.GetAdjective] społeczeństwa, jej poparcie zapewniłoby legitymizację oraz zasoby potrzebne do pozyskania dalszego wsparcia."
 CZE_unify_the_fascist_parties: "Zjednoczenie partii faszystowskich"
 CZE_unify_the_fascist_parties_desc: "Między partiami faszystowskimi panują głębokie podziały, niektóre ugrupowania są tak ekstremalne, że nie mogą liczyć na zyskanie znaczącego poparcia. Te partie muszą się zjednoczyć, by bronić kraju i stworzyć wizję Czechosłowacji, która zwraca się nie tylko ku ekstremistom."
 CZE_pro_rearmament_propaganda: "Propaganda promująca zbrojenia"
 CZE_pro_rearmament_propaganda_desc: "Żeby zwiększyć poparcie dla idei bardziej zcentralizowanego rządu, musimy naświetlić aktualną, niestabilną sytuację międzynarodową. Pomoże to też zmotywować społeczeństwo do wspierania planów wzmocnienia armii, gdy zajdzie taka konieczność."
 CZE_align_nationalist_parties: "Sojusz z czeskimi partiami nacjonalistycznymi"
 CZE_align_nationalist_parties_desc: "Powinniśmy kierować przekaz do wszystkich obywateli [ROOT.GetAdjective], ale nie możemy zapominać, że tradycyjne czeskie partie nacjonalistyczne mają największe wpływy na scenie politycznej i to dzięki nim gromadzenie poparcia będzie najłatwiejsze."
 CZE_align_slovak_catholics: "Sojusz ze słowackimi katolikami"
 CZE_align_slovak_catholics_desc: "Partie nacjonalistyczne i katolickie cieszą się obecnie największym poparciem w Słowacji. Porozumienie z nacjonalistami byłoby trudne bez poważnych ustępstw, ale dzięki niemu katolicy mogą opowiedzieć się po naszej stronie."
 CZE_jozef_tiso_tt: "Mianowanie doradcy: §Y$CZE_jozef_tiso$§!"
 CZE_align_catholic_parties: "Sojusz z ČSL"
 CZE_align_catholic_parties_desc: "ČSL i inne partie katolickie stanowiły tradycyjną bazę poparcia dla systemu monarchistycznego w Cesarstwie Austro-Węgier, nadszedł czas przekonać je do powrotu do tych poglądów."
 CZE_restore_the_monarchy: "Przywrócenie monarchii"
 CZE_restore_the_monarchy_desc: "Zdobyliśmy poparcie dla wprowadzenia nowego systemu, zatem czas przedstawić naszą udoskonaloną ideę całemu społeczeństwu. Gdyby $CZE_karel_schwarzenberg$ został wybrany monarchą, trafilibyśmy do dawnych sympatyków monarchii, a także zyskali nowych, ponieważ kandydat na władcę ma [ROOT.GetAdjective] korzenie, a nie [AUS.GetAdjective], jak wcześniej narzucani nam monarchowie."
 CZE_semi_constitutional_monarchy: "System częściowo konstytucyjny"
 CZE_semi_constitutional_monarchy_desc: "Wybraliśmy nowego monarchę, więc czas zmienić konstytucję. Niektórzy nawołują do centralizacji władzy, co pozwoli uniknąć walk wewnętrznych w tych niespokojnych czasach, jednak nie ma wątpliwości, że monarcha nie może zajmować się wszystkim. Dlatego może lepiej będzie częściowo zachować obecny system, który pomógłby w zarządzaniu krajem, natomiast monarcha kierowałby narodem."
 CZE_restore_noble_titles: "Przywrócenie tytułów szlacheckich"
 CZE_restore_noble_titles_desc: "Po ustanowieniu republiki szlachta utraciła swoje tytuły, ale nadszedł czas, by nagrodzić jej współpracę ich przywróceniem. Pozwoli nam to też nadawać tytuły honorowe takim bohaterom jak doświadczeni oficerowie, którzy wielokrotnie walczyli za państwo [ROOT.GetAdjective]"
 CZE_restore_the_austro_hungarian_customs_union: "Przywrócenie unii celnej cesarstwa"
 CZE_restore_the_austro_hungarian_customs_union_desc: "Jedną z niezaprzeczalnych zalet cesarstwa Austro-Węgier były niewielkie bariery handlowe nałożone na nasz przemysł. Przywrócenie tej unii stanowiłoby pierwszy krok ku wciągnięciu dawnych państw członkowskich w naszą strefę wpływów."
 CZE_customs_union: "Unia celna"
 CZE_catholic_focus: "Priorytet na katolicyzm"
 CZE_catholic_focus_desc: "Chociaż husyci są słynnym elementem [ROOT.GetAdjective] historii, to wielu ludzi wyznaje katolicyzm. Powinniśmy się do nich zwrócić i zwiększyć ich rolę w społeczeństwie."
 CZE_hussite_legacy: "Husyckie dziedzictwo"
 CZE_hussite_legacy_desc: "Husyci nie tylko promowali bardziej protestancką postać chrześcijaństwa, ale także wyróżniali się tolerancją dla innych opinii w tej sprawie, w przeciwieństwie do tyranów, którzy toczyli z nimi wojny."
 CZE_align_with_germany: "Zbliżenie z: [GER.GetNonIdeologyName]"
 CZE_align_with_germany_desc: "Nowy rząd [GER.GetAdjective] może nie jest mniej ekspansjonistyczny, ale może okazać się bardziej pragmatyczny w dobieraniu sobie sojuszników. Powinniśmy dążyć do znalezienia się wśród tych, z którymi warto się sprzymierzyć."
 CZE_rally_against_germany: "Zjednoczenie przeciwko: [GER.GetNonIdeologyName]"
 CZE_rally_against_germany_desc: "Czechosłowacy dzielnie walczyli o swoją niepodległość, a teraz musimy zaapelować do wszystkich obywateli o obronę tejże niepodległości."
 CZE_integrate_sudeten_germans: "Integracja Kraju Sudetów"
 CZE_integrate_sudeten_germans_desc: "Podziały wśród populacji Kraju Sudetów nie pomagają nikomu, musimy przyjrzeć się obawom tych ludzi i zmierzyć się z nimi. Jeżeli oskarżenia o złe traktowanie staną się mało wiarygodne, zdołamy osłabić tendencje niepodległościowe."
 CZE_cooperate_with_the_sdp: "Współpraca z SdP"
 CZE_cooperate_with_the_sdp_desc: "Choć obecnie SdP jest siłą wywołującą destabilizację, odpowiednie zachęty mogą skłonić ich do współpracy, taką zachętą mogłoby być włączenie do koalicji rządzącej."
 CZE_revive_the_december_bloc: "Odnowienie bloku grudniowego"
 CZE_revive_the_december_bloc_desc: "Blok grudniowy składał się z partii faszystowskich, mniejszościowych i prawicowych, które były przeciwne wyborowi Edwarda Benesa na prezydenta. Należy odnowić tę organizację, by stała się alternatywą dla obecnego rządu."
 CZE_revert_1926_anti_military_laws: "Cofnięcie praw antymilitarnych z 1927 r."
 CZE_revert_1926_anti_military_laws_desc: "Po próbie przewrotu, której dokonał $CZE_radola_gajda$, armia oraz żandarmeria straciły prawo do głosowania oraz inne przywileje. W tych trudnych czasach wojsko ma ogromne znaczenie, zatem powinniśmy zlikwidować te ograniczenia i rozdział armii od polityki."
 CZE_bop_to_fascism_support_tt: "Dodaj jedną trzecią współczynnika §Y$CZE_bop_army_readiness$§! do wartości poparcia dla faszystów:"
 CZE_power_to_the_military: "Władza dla wojska"
 CZE_power_to_the_military_desc: "To oczywiste, że na obronę kraju nie można szczędzić wydatków, dlatego ludzie u władzy muszą zrozumieć potrzeby armii, a nie da się tego osiągnąć w lepszy sposób niż poprzez ustanowienie rządu wojskowych."
 CZE_militarize_the_associations: "Militaryzacja stowarzyszeń"
 CZE_militarize_the_associations_desc: "Liczne [CZE.GetAdjective] stowarzyszenia mogą wspierać obronę kraju, ucząc ludzi umiejętności potrzebnych każdemu żołnierzowi. Powinny robić to jeszcze, zanim ruszy mobilizacja."
 CZE_aggressive_foreign_policy: "Agresywna polityka zagraniczna"
 CZE_aggressive_foreign_policy_desc: "Skończyły się czasy kruchych układów opartych na zaufaniu. Musimy działać zdecydowanie, aby zapewnić sobie bezpieczeństwo, nawet jeśli wymaga to dużych poświęceń."
 CZE_work_with_germany: "Współpraca z rządem [GER.GetAdjective]"
 CZE_work_with_germany_desc: "Kwestia Sudetów została rozstrzygnięta, może więc władze [GER.GetAdjective] dostrzegą wreszcie, jakim cennym sojusznikiem może być państwo [ROOT.GetAdjective]."
 CZE_control_the_associations: "Kontrola stowarzyszeń"
 CZE_control_the_associations_desc: "[CZE.GetNonIdeologyName] to kraj licznych organizacji, od ludzi wykonujących ten sam zawód, aż po hobby lub uprawiane dyscypliny sportu. Kto ma nad nimi kontrolę, ten ma kontrolę nad dużą częścią społeczeństwa."
 CZE_diversify_bata: "Dywersyfikacja Bat'a"
 CZE_diversify_bata_desc: "Bat'a to firma produkująca dobra konsumenckie, którą moglibyśmy wykorzystać w naszym łańcuchu dostaw zasobów. Dzięki temu pozyskamy podstawowe materiały, które trudno zdobyć w inny sposób."
 CZE_devaluate_the_koruna: "Dewaluacja korony"
 CZE_devaluate_the_koruna_desc: "Posiadanie silnej waluty to zagrożenie dla gospodarki kraju, której większa część opiera się na eksporcie. Osłabienie waluty może wywołać krótkookresowe kłopoty, ale w dłuższej perspektywie dobrze na tym wyjdziemy."
 CZE_continue_the_central_bohemia_plan: "Plan industrializacji środkowych Czech"
 CZE_continue_the_central_bohemia_plan_desc: "Kontynuacja planu rozbudowy obszarów przemysłowych w centrum kraju pozwoliłaby nam czerpać korzyści ze skali tego przedsięwzięcia. Rozbudowa przemysłu daleko poza granicami państwa to również mądry krok z punktu widzenia bezpieczeństwa narodowego."
 CZE_balance_industrial_invevestments: "Zrównoważenie rozwoju przemysłowego"
 CZE_balance_industrial_invevestments_desc: "Pozostawienie słabo rozwiniętych terenów wokół obszarów [9.getname] i [75.getname] to jeden z powodów, dla których nasze państwo zaczęło się dzielić na początku dekady. Rozrost obszarów na zewnątrz kraju pomoże nam zmniejszyć tę lukę w rozwoju przemysłowym pomiędzy tymi dwoma miejscami."
 CZE_expand_prf_science_facilities: "Rozbudowa placówek naukowych PRF"
 CZE_expand_prf_science_facilities_desc: "Placówki naukowe PRF są wypełnione bystrymi ludźmi, którzy tylko czekają na okazję, by zająć się czymś bardziej ambitnym. Rozbudowa tego departamentu i scalenie go z rządem to dobry początek drogi do usprawnienia naszych badań naukowych."
 CZE_raise_more_industrial_funds: "Zwiększenie finansowania przemysłu"
 CZE_raise_more_industrial_funds_desc: "Od czasów Austro-Węgier aż po dziś przemysł jest sercem naszego narodu. Jeśli zapewnimy mu dostateczny budżet i finansowanie, sprawimy, że dalej będzie rozkwitał w tej nękanej problemami Europie."
 CZE_skoda_priority_focus_info_tt: "Osiągnięcie niektórych §Ycelów narodowych§! wymaga od nas posiadania określonego celu £GFX_CZE_skoda_text_icon §Ypriorytetu na Škodę§!. Cele te są wskazywane małą ikoną związaną z wymaganym £GFX_CZE_skoda_text_icon §Ypriorytetem na Škodę§!."
 CZE_joint_stock_schemes: "Przedsięwzięcia akcyjne"
 CZE_joint_stock_schemes_desc: "Przedsięwzięcia akcyjne dostarczały nam gospodarczego wzrostu przy braku tradycyjnych źródeł finansowania. Dalsze wykorzystywanie tej strategii pozwoli naszej gospodarce jeszcze bardziej się rozrosnąć."
 CZE_the_slovak_arrow: "Słowacka strzała"
 CZE_the_slovak_arrow_desc: "Zbudowanie szybkiego szynobusu łączącego nasze dwa główne miasta byłoby znacznym powodem do narodowej dumy. Zapewniłoby nam również dobrą wymówkę do usprawnienia infrastruktury kolejowej."
 CZE_finish_double_tracking_efforts: "Budowa podwójnych torów"
 CZE_finish_double_tracking_efforts_desc: "Dokończenie budowy podwójnych torów przy naszych najważniejszych drogach kolejowych pozwoli nam zwiększyć ich przepustowość, co doprowadzi do lepszej łączności pomiędzy pomniejszymi miastami."
 CZE_realize_motorway_proposals: "Realizacja projektów autostrad"
 CZE_realize_motorway_proposals_desc: "Naszemu rządowi przedstawiono kilka projektów autostrad, które znacząco poprawiłyby spójność dróg w obrębie naszych granic. Powinniśmy je zrealizować."
 CZE_build_additional_rail_stations: "Budowa dodatkowych stacji kolejowych"
 CZE_build_additional_rail_stations_desc: "Nasza infrastruktura kolejowa się rozrasta i niektóre istniejące stacje nie nadążają za wzmożonym ruchem pociągów. Ulepszenie ich znacznie pomogłoby nam w transportowaniu większej liczby ludzi i ilości towarów do ich miejsc docelowych."
 CZE_build_additional_rail_stations_focus_cost_tt: "Przyjmowanie celu §Y$CZE_devaluate_the_koruna$§! skróci czas realizacji tego celu do §G35§! dni."
 CZE_grow_ckd_secondary_facilities: "Drugorzędne placówki CKD"
 CZE_grow_ckd_secondary_facilities_desc: "CKD ma wiele mniejszych, drugorzędnych placówek wytwarzających istotne dobra przemysłowe, takie jak generatory elektryczne. Rozbudowa ich pomogłaby w rozwoju naszego przemysłu ciężkiego."
 CZE_bolster_domestic_construction: "Wzmocnienie konstrukcji krajowej"
 CZE_bolster_domestic_construction_desc: "Odkąd odzyskaliśmy niepodległość po końcu wielkiej wojny, nasz krajowy sektor budowlany stabilnie się rozrasta. Dofinansowanie niektórych inwestycji wykonawców średniego szczebla pozwoli nam jeszcze bardziej go wzmocnić."
 CZE_invest_in_vhht: "Inwestycja w VHHT"
 CZE_invest_in_vhht_desc: "VHHT to firma obejmująca mnóstwo różnych zakładów metalurgicznych w całym kraju. Jeśli zainwestujemy w jej rozwój, z upływem czasu usprawnimy wiele obszarów naszej produkcji metalu."
 CZE_expand_vitkovice_ironworks: "Rozbudowa Vítkovické Ironworks"
 CZE_expand_vitkovice_ironworks_desc: "Vítkovické Ironworks to ważny dostawca żelaza w obrębie państwa [74.getname]. Rozbudowa tej placówki znacznie zwiększy jej wydajność."
 CZE_expand_central_bohemian_mines: "Rozbudowa czeskich centralnych kopalni"
 CZE_expand_central_bohemian_mines_desc: "Kopalnie położone w sercu naszego kraju mają kluczowe znaczenie dla naszego bezpieczeństwa energetycznego. Musimy je jak najszybciej rozbudować."
 CZE_increase_bauxite_imports: "Zwiększenie importu boksytu"
 CZE_increase_bauxite_imports_desc: "Może i nasz kraj nie obfituje w aluminium, lecz poprzez pewne procesy rafinacji i zwiększenie importu boksytu możemy wytwarzać u siebie pewne ilości tego surowca. To pomoże w łagodzeniu niedoborów pewnych zasobów."
 CZE_merge_the_oil_companies: "Połączenie koncernów naftowych"
 CZE_merge_the_oil_companies_desc: "Nasze koncerny naftowe ledwo zasługują na to miano. To małe korporacje zbudowane wokół garści szybów naftowych. Jeśli je połączymy i obejmiemy państwową kontrolą, uzyskamy większe rezultaty ze stosunkowo małego potencjału naszego przemysłu naftowego."
 CZE_expand_trinec_ironworks: "Huta Trzyniecka"
 CZE_expand_trinec_ironworks_desc: "Huta Trzyniecka to tytan przemysłu w regionie [72.getname] od początku swojego istnienia. Dalsze inwestycje w nią przyniosą nam ogromne zyski z produkcji surowców."
 CZE_consolidate_mining_operations: "Konsolidacja działań górniczych"
 CZE_consolidate_mining_operations_desc: "Nasze firmy górnicze mogłyby działać bardziej optymalnie, gdybyśmy popracowali nad połączeniem ich dla większej wydajności. Pozwoliłoby to na skuteczniejsze badania naukowe i rozbudowę istniejących kopalń."
 CZE_expand_praga: "Kontrakty z Pragą"
 CZE_expand_praga_desc: "Praga od wielu lat jest źródłem różnych komponentów dla naszego przemysłu zbrojeniowego. To logiczne, abyśmy nagrodzili to miasto dodatkowymi kontraktami, by mogło się dalej rozwijać."
 CZE_shrink_educational_disparities: "Zmniejszenie nierówności edukacyjnych"
 CZE_shrink_educational_disparities_desc: "Na naszych wiejskich obszarach brak dostępu do wykształcenia, które jest oferowane w miastach. Musimy zwalczać te nierówności, realizując na tych terenach rozległe programy edukacyjne."
 CZE_kickstart_rapid_rearmanent: "Rozpoczęcie szybkiego przezbrajania"
 CZE_kickstart_rapid_rearmanent_desc: "Wielu polityków i biznesmenów może i uważa, że to fatalna decyzja, ale musimy natychmiast rozpocząć przezbrajanie. Tajemnicą poliszynela jest, iż sąsiednie państwa się nie rozbrajają - a w zasadzie robią coś zupełnie przeciwnego. Musimy przygotować armię, póki jeszcze jest czas."
 CZE_keep_focus_on_weapon_exports: "Skupienie się na eksporcie broni"
 CZE_keep_focus_on_weapon_exports_desc: "To duże firmy eksportujące broń wydostały nas z gospodarczego niżu. Odwracanie tego trendu byłoby groźne politycznie i ekonomicznie. Lepiej będzie na ten moment utrzymać kierunek. Jakiekolwiek domniemane zagrożenia wobec nas i tak są wydumane."
 CZE_force_the_industrialists_hand: "Przymuszenie przemysłowców"
 CZE_force_the_industrialists_hand_desc: "Przemysłowcy i ich konglomeraty już zbyt długo powstrzymują nas przed skutecznym przezbrojeniem się. Czas, byśmy dokonali wyboru za nich – dla dobra narodu."
 CZE_embrace_corporatism: "Przyjęcie korporacjonizmu"
 CZE_embrace_corporatism_desc: "Moglibyśmy ponegocjować z przemysłowcami, aby pomogli nam rozpocząć przezbrajanie w zamian za przystanie na kilka warunków. Częściowe zmiany polityki na ich korzyść są jak najbardziej rozsądne i leżą w naszym interesie."
 CZE_expand_existing_armory_plants: "Rozbudowa istniejących zbrojowni"
 CZE_expand_existing_armory_plants_desc: "Przeniesienie naszych niektórych zbrojowni będzie kosztowną inwestycją o krótkotrwałym zysku. Ich rozbudowa natomiast pozwoli cieszyć się zwiększeniem produkcji, badań naukowych i rozwoju w tych miejscach, pomimo ryzyka, iż mogą zostać zaatakowane przez wroga."
 CZE_expand_skoda_offices: "Rozbudowa biur Škody"
 CZE_expand_skoda_offices_desc: "To nasze międzynarodowe biura napędzają sprzedaż naszej broni. Rozbudowanie ich w nowych miejscach to rozsądna decyzja."
 CZE_skoda_office_unlock_tt: "Odblokowanie decyzji: §YBudowa biur sprzedaży broni§!"
 CZE_complete_the_power_grid: "Ukończenie sieci zasilania"
 CZE_complete_the_power_grid_desc: "Sieć zasilania na obszarach wiejskich wymaga dalszej pracy. Nie nadąża ona za resztą kraju i stanowi przeszkodę w rozwoju gospodarczym."
 CZE_build_the_slapy_reservoir: "Budowa Zapory Slapy"
 CZE_build_the_slapy_reservoir_desc: "Zbudowanie zapory w regionie Slapy zapewni większe ilości energii oraz lokalne możliwości gospodarcze. To z kolei znacznie pomoże w rozwoju przemysłu na tym obszarze."
 CZE_diversify_refinery_processes: "Zróżnicowanie procesów rafinacji"
 CZE_diversify_refinery_processes_desc: "Nasze szyby naftowe mogłyby wytwarzać przeróżne produkty uboczne. Problem w tym, że nie wiemy, jak do tego doprowadzić. Jeśli poświęcimy czas na zbadanie tej kwestii, uda nam się urzeczywistnić to marzenie."
 CZE_enlarge_smaller_wells: "Powiększenie małych szybów"
 CZE_enlarge_smaller_wells_desc: "Niektóre nasze szyby, choć małe, mogłyby produkować znacznie więcej ropy niż dotychczas. Wystarczy tylko, że poświęcimy czas na zrealizowanie tego celu."
 CZE_develop_sudetenland_resources: "Eksploatacja zasobów Kraju Sudeckiego"
 CZE_develop_sudetenland_resources_desc: "Kraj Sudecki posiada wiele złóż surowców, których aktualnie nie eksploatujemy. Błędem byłoby nie wybudować większej liczby kopalń na tym obszarze."
 CZE_grow_tatras_capabilities: "Zwiększenie potencjału Tatry"
 CZE_grow_tatras_capabilities_desc: "Niewielki departament czołgów Tatry ma kilka innowacyjnych schematów. Jeśli damy im dodatkowe zasoby, będą mogli dalej rozwijać projekty opancerzenia."
 CZE_bailout_moser: "Dofinansowanie Mosera"
 CZE_bailout_moser_desc: "Moser boleśnie odczuł skutki wielkiego kryzysu. Należy dofinansować i ponownie otworzyć ich placówki, aby zwolnieni wcześniej ludzie mogli wrócić do pracy."
 CZE_merge_skodas_consumer_good_plants: "Połączenie fabryk dóbr konsumpcyjnych Škody"
 CZE_merge_skodas_consumer_good_plants_desc: "Škoda ma wiele małych fabryk dóbr konsumpcyjnych, które nie są scentralizowane, mimo że pomogłoby to w optymalizacji wielu obszarów produkcji i wywarło ogólny pozytywny wpływ na tę markę."
 CZE_giant_of_central_europe_industry: "Giganci przemysłu"
 CZE_giant_of_central_europe_industry_desc: "Myśleliśmy, że to niedostępne dla nas wyżyny. Jesteśmy gigantami przemysłu w Europie!"
 CZE_continue_armed_force_reform: "Kontynuacja reformy sił zbrojnych"
 CZE_continue_armed_force_reform_desc: "Jeśli będziemy kontynuować modernizację sił zbrojnych zgodnie z zaplanowanym harmonogramem i przydzielać regiony militarne prowincjonalnym kwaterom głównym, osiągniemy lepszą koordynację w potencjalnych konfliktach."
 CZE_air_force_officer_recruitment: "Rekrutacja oficerów sił powietrznych"
 CZE_air_force_officer_recruitment_desc: "Aerokluby w całym kraju współpracują ze szkołą oficerską rezerw sił powietrznych i pomagają zaspokoić krytyczną potrzebę na oficerów rezerwy, oferując kursy latania i ćwiczenia z amunicją bojową."
 CZE_national_defense_act: "Ustawa o obronie narodowej"
 CZE_national_defense_act_desc: "Ta ustawa opisuje wszelkie środki, militarne i cywilne, mające na celu zwalczanie zagrożenia atakiem na suwerenność, integralność, jedność i bezpieczeństwo naszego narodu. Wszystko to pod nadzorem Najwyższej Rady Bezpieczeństwa Narodowego (NROS)."
 CZE_car_and_oil_rationing: "Racjonowanie samochodów i ropy"
 CZE_car_and_oil_rationing_desc: "Racjonowanie prywatnych pojazdów i ich rekwizycja według naszych potrzeb pozwoli nam przeznaczyć produkowane samochody i zasoby benzyny na cele wojskowe."
 CZE_expand_airfield_capacity: "Rozbudowa sił powietrznych"
 CZE_expand_airfield_capacity_desc: "3. wydział lotnictwa zaplanował budowę nowych lądowisk i hangarów, które pozwolą właściwie eksploatować, przechowywać i naprawiać nasze samoloty. Powstaną też kwatery dla naszych nowych szwadronów i załogi naziemnej."
 CZE_trust_in_old_guard: "Wiara w starą gwardię"
 CZE_trust_in_old_guard_desc: "Zdolności powietrzne i doświadczenie z wielkiej wojny zostaną przekazane nowemu pokoleniu przez weteranów, w których pokładamy niezachwiane zaufanie."
 CZE_expand_the_aero_clubs: "Rozbudowa aeroklubów"
 CZE_expand_the_aero_clubs_desc: "Aerokluby udowodniły swoją przydatność, zapewniając naszemu krajowi stały dopływ utalentowanych pilotów. Powinniśmy je rozbudować."
 CZE_invest_in_the_smaller_air_plants: "Inwestycje w małe fabryki samolotów"
 CZE_invest_in_the_smaller_air_plants_desc: "Małe, nowe firmy produkujące samoloty to niezbędna konkurencja dla już umocnionych wytwórców. Inwestując w nie, łatwiej sprostamy szeroko pojętym wymaganiom produkcji."
 CZE_continue_avia_expansion: "Dalsza rozbudowa Avii"
 CZE_continue_avia_expansion_desc: "Inwestycje w Avię zapewnią im dodatkowy sprzęt, którego potrzebują do zwiększenia sprawności produkcyjnej. To pomoże osiągnąć większą wydajność w tworzeniu płatowców, które są obecnie wysoce pożądane."
 CZE_increase_military_aeronautical_institute_funding: "Zwiększenie finansowania lotnictwa wojskowego"
 CZE_increase_military_aeronautical_institute_funding_desc: "Jeśli zbudujemy dodatkowe ośrodki Centrum Badań i Testów Lotniczych (VZLÚ), zyskamy większą wiedzę o aerodynamice, a jednocześnie ulepszymy i unowocześnimy projekty naszych samolotów."
 CZE_air_training_abroad: "Szkolenia lotnicze za granicą"
 CZE_air_training_abroad_desc: "Jeśli wyślemy kursantów na szkolenia lotnicze do zaprzyjaźnionych krajów, zyskają oni cenną wiedzę z różnych źródeł i rozpoczną po powrocie służbę z osobistym doświadczeniem."
 CZE_establish_air_defense_zones: "Stworzenie stref obrony przeciwlotniczej"
 CZE_establish_air_defense_zones_desc: "Moglibyśmy skupić nasze nowe działa przeciwlotnicze w kluczowych miejscach i fabrykach, tworząc w ten sposób strefy obrony przeciwlotniczej dzięki węzłom łączności na poziomie terytorialnym. To zwiększy jej skuteczność."
 CZE_establish_air_defense_zones_enable_tt: "Umożliwia §YStrefy obrony przeciwlotniczej§!"
 CZE_establish_air_defense_zones_tt: "Współczynnik szansy trafienia statycznej obrony plot.: §G+10%§!"
 CZE_the_air_is_our_sea: "Powietrze to nasze morze"
 CZE_the_air_is_our_sea_desc: "Dzięki systematycznym szkoleniom nasi piloci będą latać z odwagą i pewnością siebie. „Nie mamy ani portów nad oceanem, ani okrętów tam pływających. Powietrze to nasze morze”."
 CZE_bring_kramer_and_lobel_under_state_control: "Kramer & Löbl pod kontrolą państwa"
 CZE_bring_kramer_and_lobel_under_state_control_desc: "Poprzez nacjonalizację firmy Kramer & Löbl zapewnimy sobie ciągłość badań naukowych i punktualne dostawy kluczowych elementów elektrycznych i akcesoriów radiowych."
 CZE_second_to_none: "Najlepsi z najlepszych"
 CZE_second_to_none_desc: "Schematy samolotów tworzone przez nasz przemysł lotniczy z dnia na dzień są coraz lepsze. Jeśli będziemy kontynuować badania w tej dziedzinie, staniemy się najlepszymi z najlepszych!"
 CZE_diversify_airframe_production: "Dywersyfikacja produkcji płatowców"
 CZE_diversify_airframe_production_desc: "W kwestiach powietrznych nie możemy polegać wyłącznie na myśliwcach. Do różnych rodzajów misji potrzebujemy też innych samolotów i większych płatowców."
 CZE_projekt_l_52: "Projekt 52"
 CZE_projekt_l_52_desc: "Technologia silnika odrzutowego to przyszłość lotnictwa wojskowego, choć na obecnym etapie wymaga dopracowania. Lecz przy odrobinie wysiłku zdołamy zaprojektować specjalny, nowy płatowiec z jej wykorzystaniem, dzięki czemu nie zostaniemy w tyle za innymi."
 CZE_fund_vladimir_mandl_research: "Finansowanie badań Władimira Mandla"
 CZE_fund_vladimir_mandl_research_desc: "$CZE_vladimir_mandl$ to prawnik zafascynowany ideą technologii rakietowej. Jeśli nawiążemy z nim współpracę i zapewnimy mu zasoby potrzebne do przekształcenia badań w użyteczną technologię, ogromnie skorzystamy na tym partnerstwie."
 CZE_mobilize_the_reserves: "Mobilizacja rezerw"
 CZE_mobilize_the_reserves_desc: "Napięcia przy naszych granicach są coraz większe. Musimy wezwać pod broń rezerwistów i wybranych specjalistów wojskowych zgodnie z kartami poboru."
 CZE_three_kings: "Trzech królów"
 CZE_three_kings_desc: "Oficjalne wsparcie naszych grup oporu znacznie zwiększy ich zdolność do zaszkodzenia wojsku. Może również pomóc naszej armii w działaniach polowych."
 CZE_form_the_state_defense_guard: "Utworzenie Straży Obrony Państwa"
 CZE_form_the_state_defense_guard_desc: "Jeśli stworzymy SOP, zyskamy organizację wyspecjalizowaną w ochronie naszych pokaźnych granic. Ponieważ jej członkowie będą militarnie zorganizowani i wyszkoleni, posłużą jako pierwsza linia obrony podczas naruszenia granicy przez wroga."
 CZE_expand_the_horska_divisions: "Rozszerzenie dywizji górskiej"
 CZE_expand_the_horska_divisions_desc: "Nasz kraj składa się głównie z niskich wzgórz i płaskowyżów, dlatego żołnierze wyszkoleni do walki w górach będą najbardziej przydatni w starciach na tym trudnym terenie."
 CZE_develop_horska_artillery: "Stworzenie Horskégo Dělostřelectva"
 CZE_develop_horska_artillery_desc: "Jeśli zmodyfikujemy naszą artylerię, by była lekka i łatwa do rozmontowania, zapewnimy naszym żołnierzom dostateczną siłę ognia na górskich i pagórkowatych terenach."
 CZE_develop_horska_artillery_tech_tt: "Umożliwia: §YArtyleria górska§!\n§YArtyleria (góry)§!\n  Atak: §G+10%§!\n  Ruch: §G+10%§!\n§YArtyleria (wzgórza)§!\n  Atak: §G+10%§!\n  Ruch: §G+10%§!"
 CZE_bribery_investigations: "Dochodzenie w sprawie przekupstwa"
 CZE_bribery_investigations_desc: "Otrzymaliśmy anonimowy list dotyczący posiłków i traktowania żołnierzy. Niektóre dowody wskazują na niewłaściwe zachowanie pewnych kwatermistrzów. Musimy położyć temu procederowi kres, nim zaszkodzi on naszej armii w większej skali."
 CZE_bribery_investigations_remove_effect_tt: "Ten duch narodowy zostanie usunięty po wypełnieniu celu \"§Y$CZE_bribery_investigations$§!\"."
 CZE_opl_exercises: "Ćwiczenia przeciwlotnicze"
 CZE_opl_exercises_desc: "Ćwiczenia z obrony przeciwlotniczej pozwolą naszej armii przećwiczyć manewry z większą koordynacją i koncentracją, co zwiększy ogólną mobilność i bezpieczeństwo żołnierzy."
 CZE_rapid_response_divisions: "Szybka dywizja"
 CZE_rapid_response_divisions_desc: "Zagraniczne armie pokazały, jak ważne są mobilne dywizje zdolne do przemieszczania się szybciej od wroga, co uwidoczniło ich potencjał. Moglibyśmy na próbę stworzyć podobne jednostki."
 CZE_redouble_tank_development_efforts: "Zdwojenie starań ulepszania czołgów"
 CZE_redouble_tank_development_efforts_desc: "Nasz aktualny projekt lekkiego czołgu ma pewne braki w porównaniu z podobnymi opancerzonymi jednostkami w Europie. Musimy zdwoić wysiłki, by zlikwidować tę lukę dzielącą nas od rywali."
 CZE_rearmed_and_retooled: "Ponowne zbrojenie i organizacja"
 CZE_rearmed_and_retooled_desc: "Nasze aktualne podwozie cięższego czołgu można by jeszcze usprawnić. Powinniśmy pójść w tym kierunku, by umożliwić dalszy rozwój naszych wojsk opancerzonych."
 CZE_establish_the_fall_backlines: "Wytyczenie linii odwrotu"
 CZE_establish_the_fall_backlines_desc: "Musimy realistycznie spojrzeć na fakt, że w niektórych miejscach linia naszej obrony zostanie przerwana. Jeśli do tego dojdzie, tylko dzięki przygotowanej linii odwrotu unikniemy całkowitej porażki."
 CZE_establish_the_fall_backlines_masterful_delay_tactic_tt: "\nUmożliwia taktykę: §Y$tactic_masterful_delay$§!"
 CZE_anti_tank_development: "Rozwój dział przeciwczołgowych"
 CZE_anti_tank_development_desc: "Coraz więcej armii korzysta z dużych dywizji opancerzonych, co zmusza nas do ulepszenia naszych dział przeciwczołgowych. Tylko umiejętność rozprawienia się z wrogimi czołgami w polu pozwoli nam w pełni odeprzeć przeciwnika."
 CZE_anti_tank_development_tech_tt: "Umożliwia: §YUlepszenia przeciwczołgowe§!\nPrzebicie §Yartylerii§!: §G+5%§!\nPrzebicie §Yartylerii wspierającej§!: §G+5%§!\nPrzebicie §Yartylerii przeciwczołgowej§!: §G+5%§!\nPrzebicie §Ywspierającej artylerii przeciwczołgowej§!: §G+5%§!"
 CZE_recon_in_force: "Zwiad na dużą skalę"
 CZE_recon_in_force_tech_tt: "Umożliwia §YZwiad na dużą skalę§! \n§YZwiad§!: PW: §G+5§!\nZwiad: §G+10,0%§!."
 CZE_recon_in_force_desc: "Zwiad nawiązujący kontakt z wrogiem podczas testowania jego obrony to bezcenne źródło informacji."
 CZE_integrate_fortification_engineers: "Integracja specjalistów od fortyfikacji"
 CZE_integrate_fortification_engineers_desc: "Kiedy nasi specjaliści od fortyfikacji akurat nie spędzają czasu na budowaniu statycznych umocnień, możemy szybko przydzielić im zadania wzmacniania obronności na linii frontu. Lepsze tymczasowe struktury obronne pomogą walczącym tam żołnierzom."
 CZE_integrate_fortification_engineers_tech_tt: "Umożliwia: §YIntegrację specjalistów od fortyfikacji§!\n§YKompania saperów§!:\nOkopanie się §G+10,00%§!.\n§Y(Fort)§!\n Obrona §G+10,0%§!"
 CZE_concealment_efforts: "Opracowanie kamuflażu"
 CZE_concealment_efforts_desc: "Z powodu powszechnie stosowanych ataków naziemnych i samolotów zwiadowczych używanie siatek maskujących i innych taktyk kamuflażu stało się koniecznością. Musimy poświęcić więcej uwagi temu, aby nasi żołnierze byli dobrze ukryci na polu walki."
 CZE_concealment_efforts_tech_tt: "Umożliwia: §YUlepszona siatka maskująca§! \n§YPiechota (las)§!\n Obrona: §G+10%§!"
 CZE_elevate_the_vsv: "Wzmocnienie Akademii Wojny"
 CZE_elevate_the_vsv_desc: "Bycie głównym mózgiem wojska to ogromna odpowiedzialność w skali całego państwa i narodu. Dlatego służba w sztabie generalnym wymaga oficerów o jak najlepszym przeszkoleniu zawodowym, a także niezawodności, samokontroli, wyczuciu i sile charakteru."
 CZE_continue_with_snejdareks_plan_dynamic: "[CZE_continue_with_snejdareks_plan]"
 CZE_continue_with_snejdareks_plan_default: "Kontynuacja planu Šnejdáreka"
 CZE_continue_with_snejdareks_plan_no_snejdareks: "Kontynuacja planu obrony statycznej"
 CZE_continue_with_snejdareks_plan_dynamic_desc: "Stworzenie skutecznej sieci obrony uniemożliwia niespodziewane wdarcie się wroga na nasz teren. Zapewnia ochronę i tworzy silny fundament do przejścia ze strategicznej obrony do ataku."
 CZE_go_with_vojcechovskys_plan_dynamic: "[CZE_go_with_vojcechovskys_plan]"
 CZE_go_with_vojcechovskys_plan_default: "Wybór planu Lužy"
 CZE_go_with_vojcechovskys_plan_no_luza: "Doktryna obrony aktywnej"
 CZE_go_with_vojcechovskys_plan_dynamic_desc: "Wadą statycznej obrony jest to, że nie można jej przenieść. Gdy padnie, nie można jej już wykorzystać do celów ofensywnych - pozostaje jedynie szczątkami pierwotnej linii defensywy."
 CZE_improve_the_current_officer_pool: "Zwiększenie puli oficerów"
 CZE_improve_the_current_officer_pool_desc: "Awansujemy personel, który udowodnił, że może stać się trzonem naszej armii. Odegra on kluczowe role w nadzorowaniu i koordynowaniu przepływu informacji pomiędzy wysokim dowództwem a lokalnymi jednostkami."
 CZE_elevate_slovak_officers: "Wzmocnienie słowackich oficerów"
 CZE_elevate_slovak_officers_desc: "Skupimy się na wzmocnieniu pozycji Słowaków i ich reprezentacji w naszych szeregach. Spodziewamy się, że obniżając wymagania dla słowackich kandydatów, osiągniemy większą spójność armii w przyszłości."
 CZE_promote_moravec_writings: "Promowanie dzieł Moraveca"
 CZE_promote_moravec_writings_desc: "Choć takie dzieła Moraveca, jak \"Żołnierze i czas\" oraz \"Obrona państwa\" budzą bardzo sprzeczne reakcje, jego niedawno opublikowane \"Militarne znaczenie naszego kraju w Europie Środkowej\" stało się tematem artykułów prasowych na całym kontynencie. Musimy go zachęcić, aby dalej jednoznacznie wypowiadał się o kwestiach polityki obronnej i historii militarnej."
 CZE_lessons_of_war: "Lekcje wojny"
 CZE_lessons_of_war_desc: "Mamy już na koncie doświadczenie walki z kimś równym sobie, możemy więc wykorzystać tę lekcję do usprawnienia naszego najwyższego dowództwa. Nic nie zastąpi wniosków wyciągniętych z prawdziwej walki z inną armią."
 CZE_lessons_of_war_i_had_war_with_major_flag: "Toczono wojnę z mocarstwem"
 CZE_for_the_homeland: "Za ojczyznę"
 CZE_for_the_homeland_desc: "Nasze wojsko przygotowało się do nachodzącego wyzwania, więc mamy teraz pewność, że jesteśmy gotowi do obrony ojczyzny. Nie ma zadania, z którym sobie nie poradzimy."
 CZE_the_lions_roar: "Ryk lwa"
 CZE_the_lions_roar_desc: "Symbol Czechosłowackiego Lwa ucieleśnia największe zalety naszej armii. Odwagę, siłę i niezrównane bohaterstwo. Wszyscy dowiedzą się, czym jest niesamowity duch naszych sił zbrojnych."
 CZE_diversify_our_specialists: "Dywersyfikacja specjalistów"
 CZE_diversify_our_specialists_desc: "Górskie dywizje to nie wszystko – musimy powołać większą liczbę różnych specjalistów. Wojna rozgrywa się nie tylko na wzgórzach i w górach."
 CZE_merge_the_financial_and_state_guard: "Wcielenie straży finansowej do SOP"
 CZE_merge_the_financial_and_state_guard_desc: "Utworzenie Straży Obrony Państwa sprawia, że strażnicy finansowi nie są już potrzebni. Włączenie ich do Straży Obrony Państwa pomogłoby szybko zwiększyć jej liczebność."
 CZE_merge_the_financial_and_state_guard_tt: "Umożliwia §Yzintegrowanie Straży Finansowej§! \n§YŻandarmeria§!: PW: §G+5§!."
 CZE_logistics_beyond_the_sudetes: "Logistyka poza Sudetami"
 CZE_logistics_beyond_the_sudetes_desc: "Jeśli chcemy prowadzić działania bojowe poza Sudetami, musimy opanować logistykę długodystansową, która różni się znacznie od logistyki na rodzimym obszarze."
 CZE_logistics_beyond_the_sudetes_tt: "Umożliwia korzystanie z §Yulepszonych składów zaopatrzenia§!\n§YKompanie logistyczne§!: Zużycie zaopatrzenia: §G-10%§!"
 CZE_expand_the_river_monitor_fleet: "Powiększenie floty monitorów rzecznych"
 CZE_expand_the_river_monitor_fleet_desc: "Nasza flota monitorów rzecznych jest jedną z największych w Europie i pomaga naszej armii w obronie obszarów śródlądowych. Jej rozbudowa znacznie podniosłaby jej zdolność do wykonywania tego zadania."
 CZE_the_tvp_project: "Projekt TVP"
 CZE_the_tvp_project_desc: "Nasza armia zaproponowała stworzenie programu czołgów ogólnego zastosowania (TVP) w celu opracowania krajowego projektu czołgu. Część naszych producentów, którzy mają duże doświadczenie w produkcji tego rodzaju pojazdów, wyraziła zainteresowanie tym projektem."
 CZE_expand_the_land_department_of_vtu: "Powiększenie wydziału lądowego VTÚ"
 CZE_expand_the_land_department_of_vtu_desc: "Rozbudowa wydziału lądowego Wojskowego Instytutu Technicznego (VTÚ) zapewniłaby mu dodatkowy sprzęt i poligony doświadczalne, które wsparłyby jego wysiłki badawcze nad przyszłym sprzętem."
 CZE_department_two_expansion: "Wydział drugi"
 CZE_department_two_expansion_desc: "Nasze skrzydło wywiadowcze, wydział drugi, potrzebuje więcej zasobów, aby móc wykonywać lepiej swoje zadania i chronić nas przed szpiegami wroga. Może to również prowadzić do rozbudowy poszczególnych skrzydeł agencji."
 CZE_military_intelligence: "Skrzydło wywiadu wojskowego"
 CZE_military_intelligence_desc: "Wywiad wojskowy jest jedną z najważniejszych części agencji wywiadu. Zwiększenie nakładów przeznaczanych na ten obszar przyniosłoby wymierne korzyści."
 CZE_air_intelligence: "Skrzydło wywiadu sił powietrznych"
 CZE_air_intelligence_desc: "Wiedza o tym, ile samolotów znajduje się w siłach powietrznych wroga, jest krytycznym aspektem pozwalającym odnieść zwycięstwo w wojnie powietrznej. Właściwe informacje na temat sił powietrznych wroga są kluczowe, gdy podejmujemy z nim walkę w tym obszarze."
 CZE_within_the_eagles_nest: "W orlim gnieździe"
 CZE_within_the_eagles_nest_desc: "Dysponowanie armią informatorów i sabotażystów tuż za naszymi granicami zapewniłoby naszej armii ogromną przewagę. Dzięki pomocy wydziału drugiego nasze siatki szpiegowskie w tych miejscach mogłyby rozwinąć się do olbrzymich rozmiarów."
 CZE_restart_naval_gun_production: "Wznowienie produkcji dział morskich"
 CZE_restart_naval_gun_production_desc: "Zakłady Škoda były niegdyś największym konstruktorem i wytwórcą dział morskich w imperium austro-węgierskim. Przywrócenie ich produkcji otworzyłoby możliwość wznowienia krajowej produkcji morskiej."
 CZE_restart_naval_gun_production_tt: "Cel marynarki wojennej §Ypriorytetu na Škodę§! staje się §Yaktywny§!"
 CZE_reform_the_naval_detachment: "Przywrócenie oddziału marynarki wojennej"
 CZE_reform_the_naval_detachment_desc: "Oddział marynarki wojennej został niedawno rozwiązany, a jego żołnierze włączeni w szeregi armii. Ostatnie wydarzenia sprawiły, że jego przywrócenie stało się koniecznością."
 CZE_build_2_dockyards_when_we_have_coast_tt: "Natychmiast zbuduje §G2§! §Ystocznie wojskowe§! w losowym kontrolowanym nadmorskim §Yregionie§!."
 CZE_skoda_naval_yards: "Stocznie marynarki wojennej Škody"
 CZE_skoda_naval_yards_desc: "Teraz, gdy znów mamy dostęp do morza, możemy ponownie uruchomić dawny sektor przemysłu stoczniowego imperium austro-węgierskiego, wykorzystując wiedzę i doświadczenie, które wciąż mamy w naszych granicach. Uruchomienie krajowych stoczni powinno być priorytetem."
 CZE_build_3_dockyards_when_we_have_coast_tt: "Natychmiast zbuduje §G3§! §Ystocznie wojskowe§! w losowym kontrolowanym nadmorskim §Yregionie§!."
 CZE_legacy_of_the_kriegsmarine: "Dziedzictwo Kriegsmarine"
 CZE_legacy_of_the_kriegsmarine_desc: "Dzięki temu, że jeszcze nie tak dawno temu pomagaliśmy w budowie dużych pancerników, wciąż mamy niezbędne ku temu możliwości. Jest to dziedzictwo tych samych fabryk, które pomogły stworzyć austro-węgierską Kriegsmarine."
 CZE_build_off_old_ganz_danubius_designs: "Wykorzystanie projektów z Ganz Danubis"
 CZE_build_off_old_ganz_danubius_designs_desc: "Odkurzone projekty z Ganz Danubius mogą okazać się przydatne podczas budowy nowej klasy krążowników. Ludzie mający wiedzę na temat tych projektów wciąż żyją w naszych granicach."
 CZE_modernize_trieste_designs: "Modernizacja projektów z Triestu"
 CZE_modernize_trieste_designs_desc: "Wykorzystując stare projekty austro-węgierskiej marynarki wojennej do budowy mniejszych pancerników, będziemy mieli lepsze rozeznanie w tym, jak skonstruować tę klasę okrętów."
 CZE_leverage_gunboat_experience: "Wykorzystanie doświadczenia z kanonierkami"
 CZE_leverage_gunboat_experience_desc: "Nasze doświadczenie w projektowaniu kanonierek może zostać wykorzystane przy tworzeniu niszczycieli. Nasza obecna baza wiedzy pomogłaby przyspieszyć proces projektowania."
 CZE_revive_kraljevica_designs: "Wskrzeszenie projektów z Kraljevicy"
 CZE_revive_kraljevica_designs_desc: "Wykorzystując naszą wiedzę na temat kanonierek i studiując stare projekty z Kraljevicy, możemy wskrzesić tę klasę niszczycieli dla naszego narodu."
 CZE_wolfs_of_bohemia: "Wilki Bohemii"
 CZE_wolfs_of_bohemia_desc: "Biorąc pod uwagę doświadczenie z okrętami podwodnymi, które wciąż istnieją w naszych granicach, stworzenie własnych wilczych stad nie byłoby zbyt trudne."
 CZE_raider_lineage: "Najeźdźcze tradycje"
 CZE_raider_lineage_desc: "Mamy tradycję najazdów związanych z byłymi oficerami austro-węgierskiej marynarki wojennej. Powinniśmy wykorzystać to doświadczenie."
 CZE_a_modern_navy: "Nowoczesna marynarka wojenna"
 CZE_a_modern_navy_desc: "Dzięki postępowi w zakresie technologii morskich możemy wreszcie powiedzieć, że mamy nowoczesną i sprawną marynarkę wojenną."
 CZE_build_1_dockyards_when_we_have_coast_tt: "Natychmiast zbuduje §G1§! §Ystocznię wojskową§! w losowym kontrolowanym nadmorskim §Yregionie§!."
 CZE_naval_aviation: "Lotnictwo morskie"
 CZE_naval_aviation_desc: "Lotniskowce i ich samoloty wydają się przyszłością działań wojennych na morzu. Musimy zainwestować czas w te nowe obszary walki morskiej."
 CZE_across_the_atlantic: "Przez Atlantyk"
 CZE_across_the_atlantic_desc: "Aby marynarka wojenna była skuteczna, musi być w stanie pokonać ocean. Musimy sprawić, by nasza marynarka wojenna mogła pokonywać duże odległości."
 CZE_joint_equipment_designs: "Wspólne projekty wyposażenia"
 CZE_joint_equipment_designs_desc: "[ROOT.GetNameDef] i [GER.GetNameDef] przodują w dziedzinie projektowania samolotów i czołgów, a każdy z tych krajów ma własne specjalizacje. Powinniśmy dzielić się informacjami, abyśmy mogli nadal koncentrować się na polach, w których jesteśmy najlepsi."
 CZE_negotiate_sphere_of_influence: "Negocjowanie strefy wpływów"
 CZE_negotiate_sphere_of_influence_desc: "Zasoby wojskowe rządu [ROOT.GetAdjective] mają bezsprzecznie ogromną wartość dla [GER.GetAdjective] sojuszu. To oczywiste, że w zamian możemy oczekiwać zdobyczy terytorialnych."
 CZE_set_up_polish_puppet_state: "Ustanowienie południowego [POL.GetAdjective] państwa marionetkowego"
 CZE_set_up_polish_puppet_state_desc: "Odkąd władze [GER.GetAdjective] są zainteresowane stworzeniem w Polsce państwa marionetkowego, musimy próbować zrobić to samo."
 CZE_usurp_the_mantle: "Przejęcie tytułu"
 CZE_usurp_the_mantle_desc: "Nasze królestwo rozciąga się od Morza Bałtyckiego po Adriatyk i obejmuje tereny należące niegdyś do Austrii - historycznej potęgi regionalnej - dzięki czemu możemy teraz ogłosić się prawowitymi następcami Świętego Cesarstwa Rzymskiego."
 CZE_austro_hungary_puppets: "Każdy §Ypoddany region§! podlegający wymaganiu celu"
 CZE_decrease_autonomy_tier: "Nastąpi utrata poziomu autonomii w następujących poddanych regionach: §Y$autonomy_dominion$§! i §Y$autonomy_puppet$§!."
 #Exile Focus
 CZE_prepare_for_exile: "Przygotowania do emigracji"
 CZE_prepare_for_exile_desc: "Państwo powinno potajemnie pomagać naszym przywódcom politycznym w ucieczce za granicę i utworzeniu rządu na uchodźstwie."
 CZE_joins_government_in_exile_tt: "Dołącza do §Yrządu na uchodźstwie§!"
 CZE_infiltrate_collaborationist_organizations: "Infiltracja kolaborantów"
 CZE_administrative_chaos_tt: "Efekt §Ydla Reichskommissariatu§! po ukończeniu celu §Y$CZE_enter_exile$§!:"
 CZE_infiltrate_collaborationist_organizations_desc: "Obywatele [ROOT.GetAdjective] lojalni wobec rządu na uchodźstwie przewodzący organizacjom kolaborantów mogą wydawać się dziwnym pomysłem, ale to idealny sposób na podkopywanie wrogich działań i pozyskiwanie informacji na ich temat."
 CZE_enter_exile: "Przejście na uchodźstwo"
 CZE_enter_exile_desc: "Teraz, gdy potencjalni sojusznicy wreszcie walczą z [GER.GetAdjective] aligatorem, nasz rząd może przygotować się i walczyć o odzyskanie naszej suwerenności."
 CZE_refused_exile: "Odmowa przyjęcia [ROOT.GetAdjective] uchodźców"
 CZE_contact_the_czech_and_slovak_legion: "Nawiązanie kontaktu z czeskim i słowackim legionem"
 CZE_contact_the_czech_and_slovak_legion_desc: "Dzielni obywatele [ROOT.GetAdjective] uciekli, a ich celem jest [POL.GetNameDef] i [FRA.GetNameDef], gdzie będą kontynuować walkę o wolne [CZE.GetName]. Powinniśmy nawiązać kontakt z tymi siłami i koordynować ich działania."
 CZE_skoda_priority_shortcut_finder: "Priorytet na Škodę"
 CZE_skoda_priority_shortcut_finder_desc: "To obecny priorytet Škody"
