 ### INS News
 taog_news.1.t: "Świt Unii Holendersko-Indonezyjskiej"
 taog_news.1.desc: "[1058.GetName]: Ku powszechnemu zaskoczeniu, królowa Wilhelmina ogłosiła wczoraj powstanie nowego państwa: Unii Holendersko-Indonezyjskiej. Skoro ojczyzna jest okupowana, rząd [HOL.GetAdjective] na uchodźstwie oraz administracja [INS.GetAdjective] zgodziły się sprawować władzę jako jedno ciało podległe koronie. Przedstawiciele obu krajów określają tę decyzję bardziej jako konieczność niż wybór, rozpaczliwą próbę zachowania jedności i władzy królestwa na dwóch kontynentach."
 taog_news.1.a: "Ciekawy rozwój wypadków."
 taog_news.2.t: "Indonezyjska Deklaracja Niepodległości"
 taog_news.2.desc: "Podczas dzisiejszego przemówienia na Jawie, [INS.GetLeader], [INS.GetAdjective] rewolucjonista, ogłosił niepodległość nowo powstałej Republiki Indonezji. [HOL.GetNameDef] nie uznaje niezależności tego państwa, jednak milicje republikańskie już sprawują kontrolę nad częścią jego terytorium."
 taog_news.2.a: "To może być impuls do dużych, globalnych zmian."
 ############
 ### SIAM ###
 ############
 siam.1.t: "[SIA_phraya_phahon.GetName] zamieszany w skandal"
 siam.1.desc: "[SIA_phraya_phahon.GetName] został oskarżony o sprzedaż nieruchomości korony oficjelom po cenach niższych od rynkowych. Ten skandal znacznie ograniczył jego siłę w Zgromadzeniu Ludowym. Wygląda na to, że czas wpływów, jakie posiada [SIA_phraya_phahon.GetName], dobiega końca."
 siam.1.a: "Może to otworzy drogę komuś innemu?"
 #Spmgsiradet rebellion historical
 siam.2.t: "Trzecia próba zamachu na życie: [SIA_plaek_phibunsongkhram.GetName]"
 siam.2.desc: "Korespondent agencji Reuters w Bangkoku przekazał informację o trzeciej już w ciągu czterech ostatnich lat próbie otrucia premiera Syjamu, Phibula Songgrama.\nKomunikat mówi o truciźnie dodanej do jedzenia, której działanie odczuwali przez jakiś czas pan Songgram oraz jego żona i córka.\nBrytyjski sekretarz spraw zagranicznych, lord Halifax, przesłał do premiera Songgrama list, w którym wyraża zaniepokojenie tchórzliwą próbą zamachu oraz zadowolenie z faktu, że premierowi nie stało się nic poważnego." #https://trove.nla.gov.au/newspaper/article/47990695
 siam.2.a: "Kto mógł to zrobić?"
 siam.3.t: "Wygnano Phraya Songsuradeta"
 siam.3.desc: "Phraya Songsuradet został oskarżony o przygotowanie co najmniej jednej próby zamachu, której celem był [SIA_plaek_phibunsongkhram.GetName], a także o przygotowywanie puczu w celu obalenia rządu. Rząd zdecydował, że Phraya Songsuradet zostanie pozbawiony dowództwa, stopni oraz tytułów, po czym przymusowo przejdzie do rezerwy bez prawa do emerytury i będzie musiał opuścić kraj.\nKrytycy twierdzą, że jest to słabo zamaskowana czystka, której pomysłodawcą jest [SIA_plaek_phibunsongkhram.GetName], pragnący pozbyć się swojego głównego rywala, jednak wszyscy wiedzą, że te oskarżenia to zwykłe oszczerstwa."
 siam.3.a: "Smutny koniec."
 siam.4.t: "Aresztowano sympatyków Songsuradeta"
 siam.4.desc: "We wczesnych godzinach porannych, z pomocą Królewskiej Policji Tajskiej, rząd aresztował 51 kolejnych podejrzanych oraz sympatyków, w tym księcia Rangsita, Phrayę Thepahatsadina i Phrayę Udoma Pongphensawada. Oskarża się ich o spiskowanie z Phrayą Songsuradetem przeciwko państwu. Na szczególną uwagę zasługuje fakt, że Rangsit, członek rodziny królewskiej, stanie przed sądem. Część komentatorów zastanawia się, czy książę nie stał się celem ataku, by nakłonić do posłuszeństwa pozostałych członków rodziny królewskiej, którzy wciąż przebywają na terytorium [THIS.GetAdjective]"
 siam.4.a: "Atmosfera się zagęszcza."
 siam.5.t: "Bunt 18 korpusów"
 siam.5.desc: "Phibul powołał specjalny trybunał, który osądził 51 osób zamieszanych w bunt, z których 25 skazano na dożywocie, a 21 ma stanąć przed plutonem egzekucyjnym. Z tej drugiej grupy trójka ma otrzymać ułaskawienie ze względu na ich wcześniejsze chwalebne zasługi, są wśród nich książę Rangsit i Phraya Thepahatsadin."
 siam.5.a: "Trzeba zakończyć tę sprawę."
 #Songsuradet rebellion alternative
 siam.6.t: "Impas z Songsuradetem"
 siam.6.desc: "Phraya Songsuradet został oskarżony o przygotowanie co najmniej jednej próby zamachu, której celem był [SIA_plaek_phibunsongkhram.GetName], a także o przygotowywanie puczu w celu obalenia rządu. Rząd zdecydował, że Phraya Songsuradet zostanie pozbawiony dowództwa i wygnany.\nJednak aresztowaniu Songsuradeta zapobiegli wierni mu żołnierze, którzy uznali to zatrzymanie za motywowane politycznie. Rząd i wojskowa klika Songsuradeta znaleźli się w impasie, żadna ze stron nie zamierza ustąpić."
 siam.6.a: "Nie ustąpimy."
 siam.6.b: "Źle się to skończyło. Ustąpmy."
 siam.7.t: "Songsuradet zabiega o poparcie marynarki"
 siam.7.desc: "Impas między siłami rządowymi a wojskową kliką Songsuradeta trwa dalej, a śledczy donoszą o pojawieniu się pogłosek o sojuszu Królewskiej Marynarki Wojennej z Songsuradetem, którego celem jest walka z rosnącym w siłę autorytaryzmem Phibunsa.\nTo nie wszystko, niektórzy doradcy rodu królewskiego informują, że przedstawiciele Songsuradeta spotykają się z najważniejszymi książętami, co zwiększa obawy, że rodzina królewska również opowie się po stronie opozycji."
 siam.7.a: "My jesteśmy rządem, nie pozwolimy nas szantażować!"
 siam.7.b: "Sytuacja wymyka się spod kontroli. Wycofajmy się."
 #alt-hist actual rebellion
 siam.8.t: "Rebelia Songsuradeta"
 siam.8.desc: "Zdobywszy dostatecznie silne poparcie, zarówno polityczne, jak i militarne, wojskowa klika Songsuradeta współpracująca z marynarką wojenną przejęły dużą część terytorium [THIS.GetAdjective] Wczesnym rankiem na przedmieściach Bangkoku rozległy się strzały, a cały kraj przygotowuje się do otwartej wojny domowej między rządem i Songsuradetem."
 siam.8.a: "Rząd musi przetrwać."
 #alt-hist actual rebellion
 siam.9.t: "Koniec rebelii Songsuradeta"
 siam.9.desc: "Rebelianci zostali rozbici, Songsuradet trafił do aresztu, pozostaje tylko postawić go przed sądem, co w tej chwili będzie jedynie formalnością. W spisku brała udział nie tylko armia i marynarka wojenna, ale też rodzina królewska, na przykład książę Rangsit otwarcie poparł buntowników. Należy dokonać głębokiej czystki dysydentów, nie ma innego rozwiązania."
 siam.9.a: "Nadszedł czas odbudowy."
 #Attack Indochina
 siam.10.t: "Zwycięstwo!"
 siam.10.desc: "Wróg jest w odwrocie, zwycięstwo nie powinno wymknąć się nam z rąk. W pełni kontrolujemy terytorium, więc dawne siły imperialistyczne zapewne drżą ze strachu. Jak mogli przegrać? To znak czuwającej nad nami opatrzności bożej."
 siam.10.a: "Niech żyje [ROOT.GetNameDef]!"
 siam.10.b: "Właściwie to idzie całkiem nieźle."
 siam.11.t: "Przełom strategiczny sił [FROM.GetAdjective]"
 siam.11.desc: "Wbrew oczekiwaniom, wojsko [FROM.GetAdjective] wymanewrowało nasze siły i zajęło sporny region. Okupacja osłabiła naszą władzę i podała w wątpliwość nasze roszczenia wobec tego obszaru. Dalszy konflikt grozi pogłębieniem erozji dyscypliny oraz zaufania, ale oddanie tych ziem byłoby publicznym przyznaniem się do klęski."
 siam.11.a: "Musimy ograniczyć straty i wycofać się."
 siam.11.b: "Nie odstąpimy od naszych roszczeń!"
 siam.12.t: "[FROM.GetName] uznaje porażkę."
 siam.12.desc: "Nasza kampania zakończyła się sukcesem. Opór wroga załamał się, a [FROM.GetName] formalnie zrzeka się kontroli nad spornymi ziemiami, żeby uniknąć dalszych zniszczeń. To zwycięstwo zwiększa nasz prestiż i bezpieczeństwo naszych granic. Przynajmniej na razie."
 siam.12.a: "Nikt nie może wątpić w naszą siłę."
 siam.13.t: "[FROM.GetName] odrzuca jakiekolwiek porozumienie"
 siam.13.desc: "[FROM.GetName] odrzuca wszystkie propozycje porozumienia zakładające ustępstwa terytorialne, uważa je za nie do zaakceptowania. Przywódcy tego kraju ogłosili, że tylko zniszczenie naszego państwa może zakończyć ten konflikt."
 siam.13.a: "Niech tak będzie."
 siam.14.t: "[FROM.GetNameDefCap] rozpoczyna wojnę totalną"
 siam.14.desc: "[FROM.GetNameDefCap] nie udaje już, że chce negocjacji. Zamiary są oczywiste: całkowity podbój i wchłonięcie naszego kraju. O wyniku tej wojny nie zadecydują traktaty, lecz totalne zwycięstwo lub totalna porażka."
 siam.14.a: "Żadnych kompromisów, żadnej kapitulacji."
 siam.15.t: "Natarcie sił [SIA.GetAdjective] straciło impet"
 siam.15.desc: "Błyskawiczny atak wojsk [SIA.GetAdjective] zaskoczył nas, ale natarcie słabnie z powodu narastającego wyczerpania, co obnaża ich słabość. Zakładano szybką kampanię, lecz ta zamieniła się w ciężkie boje, skutkujące niewielkimi postępami sił [SIA.GetAdjective] Możemy okazać wspaniałomyślność i dać im możliwość wycofania się poprzez ustępstwa, jednak decyzja zależy od tego, czy taka łaska przysłuży się naszym interesom bardziej niż totalne zwycięstwo."
 siam.15.a: "Zaproponujmy ustępstwa"
 siam.15.b: "Nie interesuje nas nic poza totalnym zwycięstwem."
 siam.16.t: "Spowolniona ofensywa"
 siam.16.desc: "Nasza ofensywa zwolniła, ale to samo w sobie nie jest problemem. Problem w tym, że wróg o tym wie. Otrzymaliśmy ultimatum, możemy poddać się i ponieść minimalne straty, albo kontynuować wojnę i rozlew krwi. Różnica tylko w tym, ilu pochowamy."
 siam.16.a: "W takim razie pokój"
 siam.16.b: "Nigdy się nie poddamy!"
 siam.17.t: "[FROM.GetName] nie zamierza się ugiąć"
 siam.17.desc: "Rząd [FROM.GetAdjective] stwierdził w ostrych słowach, że prędzej cały jego kraj stanie w płomieniach, niż odda nam choćby jego najmniejszą część. Wojna toczy się dalej."
 siam.17.a: "Ich życzenie zostanie spełnione."
 siam.18.t: "[FROM.GetName] chce zmusić nas do kapitulacji!"
 siam.18.desc: "Przechwycone komunikaty z wrogiego sztabu naczelnego potwierdziły nasze największe obawy. Nie będzie wynegocjowanego porozumienia ani ustępstw, dzięki którym wojna mogłaby zakończyć się umiarkowanym kosztem. Przeciwnik chce bezwarunkowej kapitulacji naszego kraju i skazać nas na życie pod kolejnym imperialistycznym butem. Jeżeli mają taki cel, dostaną tylko jedną odpowiedź. Nie ugniemy się."
 siam.18.a: "[ROOT.GetNameDefCap] nie ustępuje!"
 siam.19.t: "[SIA.GetName] domaga się zwrotu terytoriów"
 siam.19.desc: "Rząd [SIA.GetAdjective], zachęcony rosnącym nacjonalizmem i zauważalnym osłabieniem naszych sił w regionie, zażądał zwrotu terytoriów, które według niego są rdzennymi ziemiami jego państwa. To oczywiste, że porywają się z motyką na słońce, ale raczej nie warto walczyć o tereny, których się domagają, tym bardziej że świat coraz szybciej stacza się ku Armagedonowi."
 siam.19.a: "Nie warto o to walczyć"
 siam.19.b: "Chyba oszaleli!"
 siam.20.t: "[FROM.GetName] przekazuje terytoria"
 siam.20.desc: "Rząd [FROM.GetAdjective] postanowił oddać nam nasze terytoria, nieważne, czy to dowodzi uznania naszej zwierzchności nad tymi ziemiami, czy może ustąpili pod naciskiem innych sił. Najważniejsze, że walczymy w słusznej sprawie."
 siam.20.a: "Wspaniały dzień!"
 siam.21.t: "[FROM.GetName] odmawia oddania terytoriów"
 siam.21.desc: "Rząd [FROM.GetAdjective] odrzuca nasz wniosek. Ci imperialiści trzymają się pazurami porządku z ubiegłego wieku, nie potrafią zaakceptować faktu, że skończył się czas tych tak zwanych \"wielkich narodów\"."
 siam.21.a: "Uświadomimy im to."
 SIA_sent_bureaucrats_to_us: "Szkolą u nas swoich urzędników służby cywilnej"
 SIA_tied_their_currency_to_ours: "Powiązali swoją walutę z naszą"
 SIA_sent_started_cooperative_with_us: "Rozpoczęli z nami kooperatywę rozwoju"
 siam.22.t: "Wyślijmy [SIA.GetAdjective] urzędników za granicę"
 siam.22.desc: "Nasi urzędnicy nie znają nowoczesnej ekonomii, nie przekazano im wiedzy niezbędnej do napędzania rozwoju. Na szczęście jest wiele państw posiadających sprawny, rozbudowany aparat urzędniczy, do których możemy ich wysłać, by tam zdobyli doświadczenie, zamiast importować obce władze."
 siam.22.a: "Wyślijmy ich do: [ENG.GetName]"
 siam.22.b: "Wyślijmy ich do: [JAP.GetName]"
 siam.23.t: "Ustawa o stabilizacji bata tajskiego"
 siam.23.desc: "Bat musi mieć jakieś pokrycie, kiedy [ROOT.GetName] dąży do uporządkowania handlu i finansów. Nasi urzędnicy przekonują, że stabilizacja monetarna wymaga mocnej zewnętrznej kotwicy, powiązanej z walutą, której ufają kupcy, kredytodawcy oraz partnerzy zagraniczni. To nie tylko wybór mechanizmu. To decyzja o kierunkach naszego handlu, charakterze rozwoju i zagranicznych wpływach na [SIA.GetAdjective] gospodarkę."
 siam.23.a: "Powiążmy bata z funtem szterlingiem"
 siam.23.b: "Powiążmy bata z jenem"
 siam.24.t: "Kooperatywa [SIA.GetAdjective] rozwoju"
 siam.24.desc: "Kooperatywa [SIA.GetAdjective] rozwoju daje państwu nowe narzędzie do modernizacji kraju, jednak ambicje wciąż przerastają krajowy kapitał. Budowa sieci kolejowej, warsztatów i elektryfikacja wymagają finansowania z zewnątrz, jeżeli mają być szybko realizowane. Mamy do wyboru dwie drogi. Inwestycje [ENG.GetAdjective] to dostęp do rynków rozwiniętych, doświadczonych firm oraz do finansowego prestiżu Londynu. Z kolei inwestycje [JAP.GetAdjective] to silniejsze partnerstwo ze wschodzącą azjatycką potęgą, która dąży do powiększania swoich wpływów. Obie ścieżki mogą przyspieszyć nasz rozwój, ale każda z nich wiąże się z jakimiś zobowiązaniami."
 siam.24.a: "Zabiegajmy o [ENG.GetAdjective] inwestycje"
 siam.24.b: "Zabiegajmy o [JAP.GetAdjective] inwestycje"
 siam.25.t: "Prajadhipok nie żyje"
 siam.25.desc: "Król Prajadhipok nie żyje. Były król, który przez lata wygnania i niepokojów nosił imię upamiętniające dawny porządek, odszedł ze świata spraw doczesnych i przeszedł do historii. Dla niektórych jego śmierć zamyka ostatni rozdział walki, która zaczęła się wraz z końcem rządów absolutnych. Jednak sprawa, którą ucieleśniał, nie umarła wraz z nim. Tron trwa, dynastia nadal istnieje, a my musimy działać dalej na rzecz odzyskania godności i stabilizacji państwa [ROOT.GetAdjective] w imieniu młodego króla Anandy."
 siam.25.a: "Niech Jego Wysokość trafi do nieba."
 siam.27.t: "Stworzenie króla"
 siam.27.desc: "Król Ananda nadal przebywa w [SWI.GetName], daleko od królestwa, którym kiedyś będzie rządził. Jednak odległość nie sprawia, że znajduje się poza naszymi wpływami. Możemy wybierać nauczycieli, uczulać obywateli i promować zwyczaje tak, aby ukształtować jego umysł z myślą o przyszłości, jakiej chcemy dla [ROOT.GetNameDef]. To, czy król powróci jako żołnierz, uczony, czy ktoś więcej, zależy w dużej mierze od tego, czego będzie się teraz uczył.\n\nBo kimże jest władca, jeśli nie przedłużeniem własnego kraju?"
 siam.27.a: "Pokierujmy go ku działaniu na polu nauki."
 siam.27.b: "Nauczmy go sztuki wojennej."
 siam.27.c: "Skierujmy go w stronę administracji i zaopatrzenia."
 siam.27.d: "Dajmy mu wiedzę o przemyśle i rozwoju."
 siam.28.t: "Koronacja króla Anandy"
 siam.28.desc: "Długie lata władzy regencyjnej zbliżają się do końca. W Bangkoku, w obecności książąt, mnichów, ministrów i urzędników państwowych, Ananda zasiadł na tronie i otrzymał honory należne królowi Chakri. Podczas uroczystości zadeklarowano ciągłość w miejsce niepokojów i uświęcony porządek w miejsce zamętu. Dla królestwa koronacja ta to nie tylko ceremonia, ale także ukazanie trwałości korony, niezachwianej przez wygnanie i wojnę domową, ale również początek nowych rządów w: [ROOT.GetNameDef]."
 siam.28.a: "Niech żyje król."
 siam.29.t: "Badania nad tradycyjnymi czołgami"
 siam.29.desc: "Klasyczne czołgi nadal królują na polu bitwy, dlatego musimy uczyć się od najlepszych, aby stworzyć potężną dywizję czołgową."
 siam.29.a: "Będziemy uczyć się od Niemców"
 siam.29.b: "Będziemy uczyć się od Amerykanów"
 siam.29.c: "Będziemy uczyć się od Brytyjczyków"
 siam.31.t: "Pozyskanie okrętów podwodnych"
 siam.31.desc: "Rozbudowa marynarki wojennej wymaga utworzenia floty podwodnej i musimy zdecydować, skąd pozyskamy nasze okręty. Zarówno [ENG.GetNameDef], jak i [JAP.GetNameDef] przedstawiły swoje oferty, jednak wybór ten ma konsekwencje wykraczające daleko poza stocznie."
 siam.31.a: "Postawimy na [ENG.GetAdjective] okręty podwodne."
 siam.31.b: "Stworzymy flotę okrętów podwodnych, korzystając z [JAP.GetAdjective] jednostek."
 siam.32.t: "Pozyskanie okrętów obrony wybrzeża"
 siam.32.desc: "Nasze wody przybrzeżne wymagają sprawnych okrętów obronnych i musimy wybrać dostawcę tych jednostek. Zarówno [ENG.GetNameDefCap], jak i [JAP.GetNameDef] są gotowe do realizacji zamówienia - to, jaką podejmiemy decyzję, będzie miało wpływ zarówno na naszą flotę, jak i na nasze stosunki zagraniczne."
 siam.32.a: "Obronę naszym brzegom zapewnią [ENG.GetAdjective] okręty."
 siam.32.b: "Nasza flota przybrzeżna będzie korzystała z [JAP.GetAdjective] okrętów."
 siam.33.t: "Sprzedaż Bangkok Dock Co"
 siam.33.desc: "Sprzedaż stoczni w Bangkoku została sfinalizowana, a uzyskane środki znajdują się obecnie w kasie państwa. Rząd musi zdecydować, na co najlepiej przeznaczyć te fundusze: na zmniejszenie obciążeń finansowych zwykłych obywateli, przyspieszenie realizacji krajowych planów rozwoju technologicznego czy też na wzmocnienie zaufania w przyszłość kraju."
 siam.33.a: "Zmniejsz obciążenie podatkowe obywateli."
 siam.33.b: "Przeznacz środki na badania związane z marynarką wojenną."
 siam.33.c: "Wykorzystaj te zyski, by pokrzepić naród."
 siam.34.t: "Żądania [FROM.GetAdjective] sił u naszych brzegów"
 siam.34.desc: "[ROOT.GetNameDef] mierzy się z naciskiem ze strony [FROM.GetAdjective] sił, a [FROM.GetAdjective] dyplomaci wypowiadają się z pewnością siebie ludzi przekonanych, że sprawa jest już rozstrzygnięta. Posługują się typowymi frazesami o porządku i stabilności, jednak w rzeczywistości dążą do naszego podporządkowania. Możemy ulec i zachować państwo w okrojonej formie, przyłączyć się do ich frakcji w nadziei na zachowanie pewnej swobody działania lub odpowiedzieć na tę presję otwartym sprzeciwem i nakazać najeźdźcy opuszczenie naszych wybrzeży."
 siam.34.a: "Dołączymy do ich frakcji i zachowamy nasze rządy."
 siam.34.b: "Niech trzymają się z dala od naszych brzegów."
 siam.35.t: "[JAP.GetNameDefCap] domaga się wydrukowania więcej pieniędzy"
 siam.35.desc: "[JAP.GetNameDefCap] jasno przedstawia swoje oczekiwania: mamy zwiększyć podaż pieniądza, aby zaspokoić ich potrzeby gospodarcze. Konsekwencje odczują nasi obywatele, borykając się z rosnącymi cenami, podczas gdy [JAP.GetAdjective] przemysł będzie czerpał z tego korzyści. Nie mamy zbyt dużego pola manewru, by się temu sprzeciwić."
 siam.35.a: "Spełnij [JAP.GetAdjective] żądania."
 siam.36.t: "[SIA.GetNameDefCap] żąda spłaty długu"
 siam.36.desc: "[SIA.GetNameDefCap] oficjalnie domaga się od nas zwrotu kosztów poniesionych w związku z narzuconą przez nas umową dotyczącą dodruku pieniądza. Układ ten dobrze nam służył, ale nadszedł czas za to zapłacić."
 siam.36.a: "Uznaj dług i zacznij jego spłatę."
 siam.37.t: "[JAP.GetNameDefCap] zgadza się na spłatę długu"
 siam.37.desc: "Nasze żądania zostały wysłuchane i [JAP.GetNameDef] rozpocznie zwrot kosztów ekonomicznych związanych z dodrukiem pieniądza. Odszkodowanie to nie zniweluje w pełni obciążenia, jakie spadło na nasz naród, ale przyniesie pewną ulgę skarbowi państwa."
 siam.37.a: "To uczciwe rozstrzygnięcie. Nasza gospodarka wyjdzie z kryzysu."
 siam.38.t: "Rząd [SIA.GetAdjective] dąży do porozumienia"
 siam.38.desc: "Rząd [SIA.GetAdjective] zwrócił się do nas z prośbą o ustalenie warunków ugody. Jego ministrowie przyznają teraz to, co udowodniła już nasza broń - że to [ROOT.GetNameDef] ma przewagę w tym konflikcie. Możemy przyjąć ich kapitulację i zmusić do posłuszeństwa, wiążąc ich z naszą frakcją, tak by ich rząd służył naszej szerszej sprawie, albo odrzucić wszelkie kompromisy i kontynuować kampanię, aż Syjam zostanie całkowicie podbity."
 siam.38.a: "Przyjmij kapitulację."
 siam.38.b: "Nie. Zakończymy to siłą."
 siam.39.t: "Rząd [FROM.GetAdjective] przyjmuje naszą kapitulację"
 siam.39.desc: "Decyzja zapadła. [FROM.GetLeader] przyjmuje naszą kapitulację. [ROOT.GetNameDef] uniknie dalszej dewastacji, choć nie upokorzenia. Armia otrzymała rozkaz zaprzestania działań, a rząd utrzymuje się przy władzy jedynie dzięki przychylności silniejszej potęgi. Zachowujemy państwo, ale kosztem dumy i swobody działania."
 siam.39.a: "Znosimy to, co konieczne."
 siam.40.t: "Rząd [FROM.GetAdjective] odrzuca naszą kapitulację"
 siam.40.desc: "[FROM.GetLeader] odrzuca wszystkie propozycje wysłane z Bangkoku. Żadna oferta nie została uznana za wystarczającą, żaden kompromis za akceptowalny. Wróg zamierza rozstrzygnąć spór wyłącznie w drodze całkowitego podboju. [ROOT.GetNameDef] może jedynie stawić opór. Skoro nie chcą opuścić naszych wybrzeży w drodze porozumienia, trzeba ich stąd wyprzeć siłą."
 siam.40.a: "Zatem będziemy walczyć."
 siam.41.t: "[FROM.GetNameDefCap] wysyła urzędników na szkolenie"
 siam.41.desc: "Przybyła delegacja [FROM.GetAdjective] urzędników, aby zapoznać się z naszym systemem administracyjnym i metodami badawczymi. Najwyraźniej [FROM.GetAdjective] władze zamierzają unowocześnić swoją administrację, korzystając z wiedzy zagranicznych specjalistów, i [ROOT.GetNameDef] jest dla nich wzorem. Wizyta ta stanowi milczące uznanie naszych metod oraz okazję do zacieśnienia dobrych stosunków z innym rządem."
 siam.41.a: "Serdecznie witamy ich delegację."
 siam.42.t: "[FROM.GetNameDefCap] wiąże swoją walutę z naszą"
 siam.42.desc: "[FROM.GetNameDefCap] oficjalnie wiąże kurs swojej waluty z naszą. Decyzja ta zbliża ten kraj do naszej strefy gospodarczej i świadczy o zaufaniu do stabilności naszych instytucji finansowych. Wymiana handlowa między naszymi krajami powinna stać się bardziej przewidywalna, a [FROM.GetAdjective] handlarze będą mogli łatwiej nawiązywać kontakty biznesowe z naszymi przedsiębiorcami."
 siam.42.a: "To pozytywny postęp w naszych stosunkach handlowych."
 siam.43.t: "[FROM.GetNameDefCap] prosi o inwestycje rozwojowe"
 siam.43.desc: "[FROM.GetNameDefCap] kieruje zaproszenie do naszych inżynierów i specjalistów, aby pomogli w rozwoju tego kraju. Współpraca ta zapewni naszym przedsiębiorstwom przyczółek w regionie i wzmocni więzi gospodarcze między naszymi rządami. Jest to skromna propozycja, która z czasem może przynieść znaczne korzyści."
 siam.43.a: "Chętnie pomożemy."
 siam.44.t: "[FROM.GetNameDefCap] zamawia okręty podwodne"
 siam.44.desc: "[FROM.GetNameDefCap] składa zamówienie na zaprojektowane przez nas okręty podwodne. Transakcja ta stanowi znaczący dowód zaufania do naszego przemysłu stoczniowego i poszerza [FROM.GetAdjective] wpływ na wody Azji Południowo-Wschodniej."
 siam.44.a: "To mile widziane zlecenie dla naszych stoczni."
 SIA_purchased_submarines_from_us: "Kupili od nas okręty podwodne"
 siam.45.t: "[FROM.GetNameDefCap] proponuje połączenie sojuszy"
 siam.45.desc: "[FROM.GetLeader] przysyła [FROM.GetAdjective] delegację z propozycją. Twierdzą, że nasze odrębne sojusze dążą obecnie do tych samych ogólnych celów, a jednocześnie powodują podział sił, zasobów i wpływów dyplomatycznych między konkurujące ze sobą dowództwa.\n\nŁącząc nasze siły z ich siłami, stworzylibyśmy silniejszy blok zdolny do koordynowania strategii na szerszym froncie. Taka umowa wzmocniłaby wspólną sprawę, choć wymagałaby od nas również zaakceptowania [FROM.GetAdjective] wpływu na przyszły kierunek działań sojuszu."
 siam.45.a: "Zjednoczony front to konieczność."
 siam.45.b: "Nasz sojusz dotyczy tylko nas."
 siam.46.t: "[FROM.GetNameDefCap] godzi się na połączenie"
 siam.46.desc: "[FROM.GetLeader] akceptuje naszą propozycję połączenia naszych sojuszy w jedną koalicję. Oddzielne dotychczas dowództwa i kanały dyplomatyczne zostają połączone w jedną strukturę, co pozwoli naszym rządom znacznie sprawniej koordynować plany wojenne, zaopatrzenie oraz politykę zagraniczną.\n\nPorozumienie to nie jest pozbawione wyzwań, jednak konieczność zachowania jedności przeważyła."
 siam.46.a: "Razem jesteśmy silniejsi."
 siam.47.t: "[FROM.GetNameDefCap] nie zgadza się na połączenie"
 siam.47.desc: "[FROM.GetLeader] odrzuca naszą propozycję połączenia naszych sojuszy. Ich władze twierdzą, że współpraca może być kontynuowana w obszarach, w których nasze interesy są zbieżne, ale nie zamierzają włączyć swojego sojuszu do szerszej koalicji, na której czele stoi [ROOT.Capital.GetCapitalVictoryPointName].\n\nNasze bloki pozostaną rozdzielone. Musimy realizować nasze cele, nie licząc na ich pełne zaangażowanie."
 siam.47.a: "W takim razie będziemy działać oddzielnie."
 siam.48.t: "[SIA.GetName] wnioskuje o [JAP.GetAdjective] pomoc"
 siam.48.desc: "[SIA.GetNameDefCap] zwraca się do nas z formalną prośbą o pomoc wojskową w walce z wojskami, które najechały ten kraj. W zamian rząd [SIA.GetAdjective] jest gotowy dać [JAP.GetAdjective] firmom uprzywilejowany dostęp do zasobów strategicznych, infrastruktury i praw handlowych.\n\nWsparcie [SIA.GetAdjective] walki pozwoli nam rozszerzyć nasze wpływy w Azji Południowo-Wschodniej oraz zdobyć cenne zasoby dla naszego Imperium, choć może to też spowodować nasze głębsze uwikłanie w regionalne konflikty."
 siam.48.a: "Przyjmijmy ich propozycję."
 siam.48.b: "[JAP.GetName] nie ma wolnych zasobów."
 siam.49.t: "[JAP.GetName] pozytywnie reaguje na nasz apel"
 siam.49.desc: "[JAP.GetNameDefCap] zgadza się wesprzeć rząd [ROOT.GetAdjective] w jego walce, [JAP.GetAdjective] doradcy, wyposażenie i zasoby niebawem zaczną do nas docierać. W zamian [JAP.GetAdjective] firmy otrzymały koncesje gospodarcze, zgodnie z porozumieniem między naszymi krajami.\n\nRząd cieszy się z przetrwania kraju, ale wielu ludzi zastanawia się, ile niepodległości oddaliśmy w zamian za tę pomoc."
 siam.49.a: "Zyskaliśmy sojusznika."
 SIA_japan_aid_request.4.t: "[JAP.GetName] negatywnie odpowiada na nasz apel"
 SIA_japan_aid_request.4.desc: "Rząd [JAP.GetAdjective] odrzucił nasz wniosek o pomoc wojskową. Tokio twierdzi, że Cesarstwo nie może w tej chwili przeznaczyć na naszą walkę ludzi ani materiałów.\n\nBez pomocy zagranicznej [ROOT.GetNameDef] musi polegać na własnej sile, by przetrwać tę inwazję."
 SIA_japan_aid_request.4.a: "A więc jesteśmy sami."
 siam_adc.1.t: "[FROM.GetNameDefCap] żąda niepodległości dla kraju [?var:SIA_adc_demand_country_to_be_released.GetNameDef]"
 siam_adc.1.desc: "Otrzymaliśmy oficjalną notę od [FROM.GetAdjective] władz, w której [FROM.GetLeader] potępia naszą okupację azjatyckich krajów jako rażące pogwałcenie ich prawa do samostanowienia. Wiadomość stwierdza, że Azja nie jest łupem, który można dzielić lub którym można administrować zgodnie z obcymi zachciankami. Zawiera też żądanie, abyśmy natychmiast wycofali nasze siły oraz przywrócili niezależny kraj [?var:SIA_adc_demand_country_to_be_released.GetNameDef].\n\nŻądanie to nie pozostawia miejsca na wątpliwości. Władze [FROM.GetAdjective] oczekują spełnienia tego żądania, a każda odmowa z naszej strony zostanie odebrana jako celowa zniewaga ich narodu."
 siam_adc.1.a: "Uwolnimy ich."
 siam_adc.1.b: "Pozostaną pod okupacją."
 siam_adc.2.t: "Kraj [FROM.GetNameDefCap] oferuje przywrócenie nam niepodległości"
 siam_adc.2.desc: "Władze [FROM.GetAdjective] zgodziły się na [SIA.GetAdjective] żądania dotyczące [ROOT.GetAdjective] przyszłości, więc [FROM.GetLeader] zadaje nam ostateczne pytanie. Okupacyjne władze są gotowe wycofać się i uznać suwerenny [ROOT.GetAdjective] rząd, jeśli postanowimy stanąć na własnych nogach.\n\nNiepodległość zapewnia godność i swobodę działania, ale wiąże się też z koniecznością samodzielnej odbudowy państwa bez [FROM.GetAdjective] gwarancji. Pozostanie pod ich protekcją jest rozwiązaniem skromniejszym, ale może oszczędzić krajowi chaosu w tych niepewnych czasach."
 siam_adc.2.a: "Będziemy wolnym narodem."
 siam_adc.2.b: "Pozostaniemy pod [FROM.GetAdjective] protekcją."
 siam_adc.3.t: "[?var:SIA_tag_that_was_released_due_to_sia_pressure.GetName] przyjmuje niepodległość"
 siam_adc.3.desc: "[?var:SIA_tag_that_was_released_due_to_sia_pressure.GetNameDef] opowiada się za niepodległością. W związku z planowanym rozwiązaniem administracji okupacyjnej [var:SIA_tag_that_was_released_due_to_sia_pressure.GetAdjective] władze przygotowują się do zastąpienia jej i zajęcia miejsca wśród suwerennych narodów świata."
 siam_adc.3.a: "Co przyniesie przyszłość?"
 siam_adc.4.t: "[FROM.GetNameDefCap] odrzuca niepodległość"
 siam_adc.4.desc: "Mimo możliwości uzyskania niepodległości [FROM.GetAdjective] rząd odrzucił propozycję natychmiastowej niezależności. Jego ministrowie twierdzą, że państwo nie jest jeszcze gotowe, by podołać obciążeniom związanym z pełną suwerennością, i na razie lepiej utrzymać status quo."
 siam_adc.4.a: "W takim razie obowiązują dotychczasowe ustalenia."
 siam_adc.5.t: "Władze [FROM.GetAdjective] odrzucają nasze żądania"
 siam_adc.5.desc: "Władze [FROM.GetAdjective] dały jasno do zrozumienia, że nasze żądania są w najlepszym razie śmieszne. Jako dowód na to, że nie jesteśmy w stanie podważyć obecnego układu, wskazują na nasze słabe siły zbrojne."
 siam_adc.5.a: "W takim razie udowodnimy im, że się mylą."
 siam_dem_event_count: "Nasza zwłoka sprzyja kampanii oszczerstw planowanej przez wojsko"
 siam_dem.2.t: "Sprzeciw armii"
 siam_dem.2.desc: "Podczas prywatnego spotkania ministrów i wyższych oficerów przedstawiciel wojska ostro skrytykował propozycję zawartą w żółtych aktach. Twierdzi, że jej autorzy zbyt swobodnie wypowiadają się na temat kierowania państwem, redystrybucji i obowiązków społecznych, nie zwracając przy tym wystarczającej uwagi na dyscyplinę, własność oraz obciążenia, jakie spadłyby na korpus oficerski i obszary wiejskie. Jego zdaniem [ROOT.GetAdjective] przebudowa nie jest możliwa w oparciu o teorie spisane na papierze, podczas gdy świat z miesiąca na miesiąc staje się coraz bardziej niebezpieczny."
 siam_dem.2.a: "Wojsko przedstawiło swoje stanowisko"
 siam_dem.3.t: "Publiczna krytyka"
 siam_dem.3.desc: "Spór wyszedł poza salę obrad. Gazeta powszechnie uważana za organ prasowy wojska opublikowała ostrą krytykę żółtej teczki, przedstawiając ją jako obcy program pod płaszczykiem patriotycznej retoryki. Redaktorzy ostrzegają, że propozycja ta przedkłada spory klasowe nad jedność narodową, osłabia zaufanie do ugruntowanych instytucji i budzi niebezpieczne oczekiwania wśród robotników i chłopów. Już po południu artykuł ten jest cytowany w koszarach, biurach i herbaciarniach, a to, co było wewnętrzną dyskusją, stało się teraz publiczną kontrowersją."
 siam_dem.3.a: "Krytyka się rozprzestrzenia"
 siam_dem.4.t: "Phibun potępia żółtą teczkę"
 siam_dem.4.desc: "Phibun dołączył do sporu otwarcie i z niekwestionowaną siłą. Przemawiając przed zwolennikami i oficerami, potępił żółtą teczkę jako komunistyczną w swej istocie, niezależnie od tego, jakiego języka używają jej obrońcy. Oświadczył, że każdy program, który stawia państwo ponad własnością, obiecuje radykalne przemiany społeczne i podburza niższe klasy społeczne, jest zatruwającą [ROOT.GetAdjective] naród czerwoną trucizną - tylko pod inną nazwą."
 siam_dem.4.a: "Nie pozostawia żadnych wątpliwości"
 siam_dem.5.t: "Należy utworzyć rząd"
 siam_dem.5.desc: "Dawny reżim został pokonany, Seri Thai zwyciężyło. Ale zwycięstwo to nie rząd, a koalicja, która powstała do walki z Phibunem, nie ustaliła, co powinno nastać po nim. W kuluarach władzy wymieniane są trzy nazwiska: Pridi Banomyong, sumienie ruchu oporu; Khuang Aphaiwong, człowiek tak łagodny, że nikogo nie obraża; oraz generał Phin Choonhavan, który cieszy się szacunkiem wśród oficerów. To, komu powierzymy władzę, zdecyduje o kształcie przyszłego pokoju."
 siam_dem.5.a: "Pridi Banomyong zostanie przywódcą. Ruch oporu zasłużył na to."
 siam_dem.5.b: "Khuang Aphaiwong, twarz wszystkich frakcji, może wziąć na siebie tę rolę."
 siam_dem.5.c: "Generał Phin Choonhavan. Armia otrzyma należne jej miejsce."
 ###################
 #### AUSTRALIA ####
 ###################
 AST_election_events.1.t.a: "Zwycięstwo PZA!"
 AST_election_events.1.t.b: "Zwycięstwo Partii Pracy!"
 AST_election_events.1.desc.a: "Głosy zostały policzone. Wybory wygrała Partia Zjednoczonej Australii.\n\nPZA potrzebuje trochę czasu na utworzenie rządu, po czym przez kolejne trzy lata udowodni obywatelom, że podjęli właściwą decyzję, oddając władzę jej posłom."
 AST_election_events.1.desc.b: "Głosy zostały policzone. Wybory wygrała Australijska Partia Pracy.\n\nPartia Pracy potrzebuje trochę czasu na utworzenie rządu, po czym przez kolejne trzy lata udowodni obywatelom, że podjęli właściwą decyzję, oddając władzę jej posłom."
 AST_election_events.1.a: "Naród zdecydował."
 AST_election_events.2.t: "W połowie drogi do wyborów federalnych"
 AST_election_events.2.desc: "Partia $AST_democratic_party_long$ stoi na czele [AST.GetAdjective] władz od 1931 roku, wyprowadza kraj z wielkiego kryzysu i zwalcza antydemokratyczne nastroje. Dzięki stabilnemu przywództwu, konserwatywnym poglądom i lojalności wobec Wielkiej Brytanii PZA umocniła swoje poparcie, a perspektywa kolejnej kadencji staje się coraz bardziej realna. Jednak w tej sprawie głos ma jeszcze jedna partia.\n\nWciąż dochodząc do siebie po wotum nieufności, które pozbawiło ją władzy w 1931 roku, $AST_labor_party_long$ zaczyna odzyskiwać popularność. Po uciszeniu głosów komunistów klasa robotnicza szuka nowego przewodnika. W ramach swojej misji reprezentowania wszystkich obywateli APP przyjęła inne podejście do imperializmu i lojalności Australii wobec Imperium. Potrzeby krajowe powinny być na pierwszym miejscu, a obce interesy powinny zejść na dalszy plan.\n\nDo następnych wyborów federalnych pozostało półtora roku. Jeśli PZA chce zapewnić sobie kolejne zwycięstwo, jej przywódcy muszą przyspieszyć reformy, które pozwolą jej zachować poparcie społeczne. W przeciwnym razie kampania APP może zapewnić jej powrót na szczyt."
 AST_election_events.2.a: "PZA wprowadzi w życie swoje ostatnie reformy."
 AST_election_events.2.b: "Objazdowa kampania po Australii zwiększy poparcie dla APP."
 AST_election_events.3.t: "$AST_election_season_cat$"
 AST_election_events.3.desc: "$AST_election_season_cat_desc$"
 AST_election_events.3.a: "Zaczyna się."
 AST_diplomatic_events.1.t: "Australijski pakt o nieagresji"
 AST_diplomatic_events.1.desc: "W ramach niedawnych działań dyplomatycznych, rząd Australii chciałby zawrzeć układy o nieagresji z kilkoma krajami azjatyckimi. Jesteśmy w tym gronie. Nasza odpowiedź w pewnym stopniu zdecyduje o tym, że ta próba uniknięcia wojny ukaże australijskich urzędników jako oderwanych od rzeczywistości, czy może jako honorowych i niewinnych.\n\nCzy zawrzemy pakt o nieagresji z: [AST.GetName]?"
 AST_diplomatic_events.1.a: "Bez wahania odpowiadamy: nie."
 AST_diplomatic_events.1.b: "Tak, uczynimy to."
 AST_diplomatic_events.2.t: "Opór Paktu Pacyficznego"
 AST_diplomatic_events.2.desc: "Delegacja do [FROM.GetNameDef] przesłała nam odpowiedź tego kraju na naszą propozycję zawarcia paktu o nieagresji. Wiedzieliśmy, że to śmiała oferta, zatem nie zaskoczyło nas, że [FROM.GetLeader] odmawia."
 AST_diplomatic_events.2.a: "Warto było spróbować."
 AST_diplomatic_events.3.t: "Niech Żyje Pakt Pacyficzny"
 AST_diplomatic_events.3.desc: "Delegacja do [FROM.GetNameDef] przesłała nam odpowiedź tego kraju na naszą propozycję zawarcia paktu o nieagresji. Ku naszej radości [FROM.GetLeader] docenia naszą inicjatywę i zgadza się pod nią podpisać."
 AST_diplomatic_events.3.a: "Doskonale!"
 AST_diplomatic_events.4.t: "Australia domaga się Singapuru"
 AST_diplomatic_events.4.desc: "[AST.GetNameDefCap] od dawna podważa funkcjonowanie strategii singapurskiej. Według australijskich urzędników nie ma pewności, czy bylibyśmy w stanie pomóc ich krajowi, gdyby na Oceanie Spokojnym wybuchła wojna. Przekazanie obowiązków morskich w tym regionie rządowi [AST.GetAdjective] zdjęłoby ciężar z Brytyjczyków, ale przeniosłoby go na australijskie barki.\n\nCzy możemy wierzyć, że większa władza Australii wzmocniłaby pozycję naszych poddanych i terytoriów na Oceanie Spokojnym bardziej niż utrzymanie Singapuru jako naszej posiadłości?"
 AST_diplomatic_events.4.a: "Tak, możemy."
 AST_diplomatic_events.4.b: "Singapur pozostanie nasz."
 AST_diplomatic_events.5.t: "Wielka Brytania zgadza się na nasz wniosek"
 AST_diplomatic_events.5.desc: "Wielka Brytania zgodziła się przekazać Singapur władzom Australii. Dzięki temu przestanie obowiązywać przestarzała strategia singapurska, teraz sami będziemy odpowiedzialni za naszą obronę."
 AST_diplomatic_events.5.a: "Strategia została napisana na nowo!"
 AST_diplomatic_events.5.a.tt: "§YSingapur§!:\n Jest kontrolowany przez §YAustralię§!.\n Należy do §YAustralii§!.\n§YWyspa Bożego Narodzenia§!:\n Jest kontrolowana przez §YAustralię§!.\n Należy do §YAustralii§!.\n§YWyspy Kokosowe§!:\n Są kontrolowane przez §YAustralię§!.\n Należą do §YAustralii§!."
 AST_diplomatic_events.6.t: "Wielka Brytania odrzuca naszą prośbę"
 AST_diplomatic_events.6.desc: "Wielka Brytania odmówiła przekazania Singapuru władzom australijskim. Status quo zostanie utrzymane."
 AST_diplomatic_events.6.a: "Strategia singapurska po prostu musi obowiązywać."
 AST_diplomatic_events.7.t: "[AST.GetName] zwraca się do nas o pomoc"
 AST_diplomatic_events.7.desc: "[AST.GetNameDefCap] chce otrzymać od sojuszników wyposażenie niezbędne w wysiłku wojennym i zwraca się do nas o pomoc w zarządzaniu niezbędnymi dostawami. Czy możemy przekazać władzom [AST.GetAdjective] jakieś konwoje?"
 AST_diplomatic_events.7.a: "Możemy."
 AST_diplomatic_events.7.b: "Nie możemy."
 AST_diplomatic_events.8.t: "[USA.GetName] zgadza się na nasz wniosek"
 AST_diplomatic_events.8.desc: "[USA.GetNameDefCap] zgadza się oddać kilka konwojów, by w ten sposób pomóc rządowi [AST.GetAdjective] w dostawach zaopatrzenia."
 AST_diplomatic_events.8.a: "Bardzo się przydadzą!"
 AST_diplomatic_events.9.t: "[USA.GetName] odrzuca naszą prośbę"
 AST_diplomatic_events.9.desc: "[USA.GetNameDefCap] nie ma konwojów, które mogłyby pomóc rządowi [AST.GetAdjective] w dostawach zaopatrzenia."
 AST_diplomatic_events.9.a: "Musimy sami poradzić sobie z dostawami."
 AST_diplomatic_events.10.t: "Sojusz wojenny"
 AST_diplomatic_events.10.desc: "[AST.GetNameDefCap] bardzo ceni sobie sojusz z rządem [USA.GetAdjective] i domaga się jego formalizacji w postaci zwykłej międzynarodowej koalicji wojennej. Łącząc siły, nasze kraje będą mogły sobie pomagać w obecnych i przyszłych konfliktach."
 AST_diplomatic_events.10.a: "Musimy się zgodzić."
 AST_diplomatic_events.10.b: "Bez nich [USA.GetNameDefCap] to silniejsze państwo."
 AST_diplomatic_events.11.t: "Sojusz wojenny"
 AST_diplomatic_events.11.desc: "[USA.GetNameDefCap] zgadza się połączyć siły. Jako członkowie frakcji [AST.GetFactionName], [AST.GetName] i [USA.GetName] będą się wspierać w obecnych i przyszłych konfliktach."
 AST_diplomatic_events.11.a: "Wrogowie będą się nas obawiać."
 AST_diplomatic_events.12.t: "Odrzucony sojusz wojenny"
 AST_diplomatic_events.12.desc: "[USA.GetNameDefCap] odrzuca naszą propozycję połączenia sił. [AST.GetNameDefCap] i [USA.GetName] będą prowadzić wysiłek wojenny niezależnie od siebie."
 AST_diplomatic_events.12.a: "Musimy walczyć bez nich."
 AST_diplomatic_events.13.t: "Punkt 6"
 AST_diplomatic_events.13.desc: "Nowa Zelandia postanowiła ostatecznie nie brać udziału w procesie jednoczenia australijskich kolonii w federację. Lecz od tamtej pory australijska konstytucja definiuje ją jako jeden z potencjalnych regionów Wspólnoty Narodów i zezwala na przyjęcie nas.\n\n[AST.GetName] twierdzi teraz, że obecna sytuacja na świecie wymaga jedności i domaga się, żeby [NZL.GetName] została przekazana władzom australijskim. Czy powinniśmy rozpisać referendum w tej sprawie?"
 AST_diplomatic_events.13.a: "Zróbmy to."
 AST_diplomatic_events.13.a.tt: "Przeprowadzimy referendum, którego wynik może zdecydować o §Raneksji§!: §Y[NZL.GetName]§!"
 AST_diplomatic_events.13.b: "Nie ma takiej możliwości!"
 AST_diplomatic_events.14.t: "[NZL.GetNameDefCap] staje się stanem Australii"
 AST_diplomatic_events.14.desc: "Po niedawnym referendum [NZL.GetName] powołuje się na punkt 6 australijskiej konstytucji. Nowozelandczycy przyznali, że ich ziemie będą bezpieczniejsze pod nadzorem Australii, dlatego zgodzili się dołączyć do: [AST.GetNameDef]."
 AST_diplomatic_events.14.a: "Australia powiększa się."
 AST_diplomatic_events.15.t: "Sprzeciw opinii publicznej w Nowej Zelandii"
 AST_diplomatic_events.15.desc: "Po niedawnym referendum [NZL.GetName] nie zamierza powoływać się na punkt 6 australijskiej konstytucji. [NZL.GetNameDefCap] pozostanie niepodległym państwem."
 AST_diplomatic_events.15.a: "Australia nie zmieni swoich granic."
 AST_diplomatic_events.16.t: "[NZL.GetNameDefCap]: sprzeciw urzędników"
 AST_diplomatic_events.16.desc: "Mimo australijskich nacisków [NZL.GetName] nie zamierza rozpisywać referendum w sprawie powołania się na Punkt 6 australijskiej konstytucji. [NZL.GetNameDefCap] pozostanie niepodległym państwem."
 AST_diplomatic_events.16.a: "Australia nie zmienia swoich granic."
 AST_diplomatic_events.17.t: "Partnerstwo z Australią"
 AST_diplomatic_events.17.desc: "Wróg nadchodzi z północy, to tylko kwestia czasu, zanim stanie u naszych bram, a przynajmniej tak twierdzą australijscy urzędnicy. [AST.GetNameDefCap] proponuje nam zjednoczenie w celu utworzenia jednolitej przeszkody, najlepiej będzie, jeśli [INS.GetName] znajdzie się pod nadzorem Australii, ale wystarczy przynajmniej dostęp wojskowy."
 AST_diplomatic_events.17.a: "Zgoda na znalezienie się pod nadzorem Australii."
 AST_diplomatic_events.17.a.tt: "§Y[INS.GetNameDefCap]§! stanie się państwem §Ymarionetkowym§!, którym zarządzać będzie §Y[AST.GetNameDefCap]§!."
 AST_diplomatic_events.17.b: "Udzielenie dostępu wojskowego."
 AST_diplomatic_events.17.b.tt: "§Y[INS.GetNameDefCap]§! udzieli §Ydostępu wojskowego§! dla: §Y[AST.GetNameDefCap]§!."
 AST_diplomatic_events.17.c: "Nie zgodzimy się na żadną z tych propozycji."
 AST_diplomatic_events.18.t: "[INS.GetNameDefCap] zgadza się spełnić żądanie Australii"
 AST_diplomatic_events.18.desc: "[INS.GetName] zgadza się spełnić nasze żądanie, nasza współpraca będzie miała ogromny wpływ na potencjał obronny obu naszych krajów."
 AST_diplomatic_events.18.a: "Fantastycznie!"
 AST_diplomatic_events.19.t: "[INS.GetNameDefCap] odmawia"
 AST_diplomatic_events.19.desc: "[INS.GetName] nie zgadza się spełnić naszego żądania, nasze kraje będą musiały bronić się same."
 AST_diplomatic_events.19.a: "[AST.GetNameDefCap] przetrwa konflikty bez ich pomocy."
 AST_diplomatic_events.20.t: "Powołania do brytyjskiej rady wojennej"
 AST_diplomatic_events.20.desc: "[GET_AST_BWC_COUNT][ENG.GetNameDefCap] powołuje premiera Australii do brytyjskiej rady wojennej. Sytuacja na świecie jest groźna, więc Wielka Brytania dąży do uzgodnienia strategii i rozpoczęcia współpracy wojskowej ze swoimi sojusznikami.\n\nJednak Australia ma własne zmartwienia. Czy premier powinien poświęcać część swojego czasu, by zadowolić Brytyjczyków?"
 AST_diplomatic_events.20.a: "[AST.GetLeader] wyruszy do Wielkiej Brytanii."
 AST_diplomatic_events.20.b: "Potrzebujemy go tutaj."
 AST_bwc_count_2: "Już drugi raz [ENG.GetLeader] prosi, aby [AST.GetLeader] pojawił się, twierdzi, że to nasza bliska współpraca zdecyduje o wyniku naszej wspólnej walki.\n\n"
 AST_bwc_count_3: "[AST.GetLeader] ponownie otrzymuje prośbę o udanie się przez ocean, by działać na rzecz podtrzymania współpracy w ramach Wspólnoty Narodów. Nie oczekujemy wielu takich próśb, musimy jedynie wyraźnie zadeklarować, czy mamy interes we wspólnych działaniach, czy też w zajmowaniu się własnymi sprawami.\n\n"
 AST_bwc_accept_effect_tt: "§YEfekty trzykrotnego przyjęcia wezwania:§!"
 AST_bwc_accept_tt: "Przyjmij wezwanie dla §Y[?var:AST_bwc_accept]§!/§Y3§! razy"
 AST_diplomatic_events.22.t: "Pomyślny udział w brytyjskiej radzie wojennej"
 AST_diplomatic_events.22.desc: "W zeszłym roku australijski premier regularnie brał udział w obradach brytyjskiej rady wojennej. Choć [AST.GetNameDef] musiała czasem ponieść tego koszt, nasz naród jest teraz silniejszy dzięki współpracy z brytyjskim wojskiem."
 AST_diplomatic_events.22.a: "To było warte poniesionych starań."
 AST_diplomatic_events.23.t: "[ENG.GetLeader] nie dąży już do wojskowej współpracy z Australią"
 AST_diplomatic_events.23.desc: "[ENG.GetNameDefCap] kilkukrotnie wzywał australijskiego premiera do udziału w obradach brytyjskiej rady wojennej, ale po kolejnych odmowach [ENG.GetLeader] nie widzi już powodu, by dalej to robić."
 AST_diplomatic_events.23.a: "To zrozumiałe."
 AST_diplomatic_events.24.t: "Zmiana przywództwa"
 AST_diplomatic_events.24.desc: "Premier Australii wywarł olbrzymi wpływ na działania wojenne Brytyjskiej Wspólnoty Narodów. Odwiedzając regularnie Londyn, Robert Menzies zyskał zaufanie brytyjskich ministrów, których wiara we własnego przywódcę jednocześnie osłabła. Ministrowie zaczęli naciskać na [ENG.GetAdjective] przywódcę, by ustąpił ze stanowiska i zwolnił je dla Menziesa.\n\nNawet jeśli [AST.GetName] straci swojego premiera, zyska wieczną lojalność zwierzchnika, którą chroni australijski rodak sprawujący obecnie władzę w Wielkiej Brytanii. Australia pragnie wzmocnienia swojego autorytetu, a Robert Menzies będzie pierwszym, który się do tego przyczyni."
 AST_diplomatic_events.24.a: "Sytuacja się zmienia."
 AST_diplomatic_events.25.t: "Pod rządami Canberry"
 AST_diplomatic_events.25.desc: "Narastające napięcia między krajami na Pacyfiku są niepokojące i nie mamy pewności, że zajęci własnymi bitwami Brytyjczycy przybędą nam z pomocą - a przynajmniej tak twierdzi [AST.GetName].\n\nChce odtworzyć Brytyjską Wspólnotę Narodów, by kraje Oceanu Spokojnego oraz Indyjskiego mogły być administrowane bezpośrednio przez Canberrę. Czy powinniśmy się na to zgodzić?"
 AST_diplomatic_events.25.a: "Zróbmy to. Region Pacyfiku pod jednolitą władzą będzie silniejszy."
 AST_diplomatic_events.25.b: "Nie ma mowy!"
 AST_diplomatic_events.26.t: "Wspólnota Narodów Pacyfiku"
 AST_diplomatic_events.26.desc: "[ENG.GetNameDefCap] wyraża zgodę. Region Pacyfiku pod jednolitą władzą będzie silniejszy. Brytyjskie terytoria nad Pacyfikiem zostały przekazane pod naszą kontrolę."
 AST_diplomatic_events.26.a: "Kraje Pacyfiku dołączają do naszych sił."
 AST_diplomatic_events.27.t: "Wielka Brytania odrzuca naszą prośbę"
 AST_diplomatic_events.27.desc: "[ENG.GetNameDefCap] nie wyraża zgody. Region Pacyfiku nie stanie się silniejszy pod jednolitą władzą. Brytyjskie terytoria nad Pacyfikiem pozostaną pod kontrolą Wielkiej Brytanii."
 AST_diplomatic_events.27.a: "Australia da sobie radę tak czy inaczej."
 AST_diplomatic_events.28.t: "[ENG.GetLeader] rozłącza się"
 AST_diplomatic_events.28.desc: "[ENG.GetLeader] i premier odbyli napiętą rozmowę telefoniczną, po której Australia nie zyskała zbyt wiele, a Wielka Brytania z jeszcze większą niechęcią odbiera naciski o australijskie interesy, jakie wywiera [AST.GetLeader]."
 AST_diplomatic_events.28.a: "Australia musi sama zadbać o swoją obronę."
 AST_diplomatic_events.29.t: "Wielka Brytania przyjdzie nam z pomocą"
 AST_diplomatic_events.29.desc: "Ulegając australijskim naciskom, by dążyć do konfliktu z [JAP.GetAdjective] państwem, [ENG.GetNameDef] zgodziła się wesprzeć nasze przedsięwzięcia obronne."
 AST_diplomatic_events.29.a: "Jesteśmy wdzięczni za pomoc, ale wojny z Japonią nie unikniemy."
 AST_diplomatic_events.30.t: "Australia domaga się prawa do zasobów"
 AST_diplomatic_events.30.desc: "Ekspansjonistyczni agresorzy widzą w Indochinach nie tylko terytorium do zajęcia, lecz także zasoby do zagarnięcia. Jeśli bogactwa te trafią w ręce wroga, spowodują wydłużenie wojny, podczas gdy Australia mogłaby z ich pomocą ją zakończyć - a przynajmniej tak twierdzi rząd tego kraju.\n\nCzy powinniśmy zapewnić im prawo do zasobów na naszym terytorium?"
 AST_diplomatic_events.30.a: "Zróbmy to."
 AST_diplomatic_events.30.b: "[AST.GetName] również nie powinna zagarniać tych zasobów."
 AST_diplomatic_events.31.t: "[FROM.GetNameDefCap] ogłasza, że [AST.GetName] może korzystać z zasobów"
 AST_diplomatic_events.31.desc: "Ekspansjonistyczni agresorzy widzą w Indochinach nie tylko terytorium do zajęcia, lecz także zasoby do zagarnięcia. Jeśli bogactwa te trafią w ręce wroga, spowodują wydłużenie wojny, podczas gdy Australia mogłaby z ich pomocą ją zakończyć - a przynajmniej tak twierdzi rząd tego kraju.\n\n[ROOT.OVERLORD.GetNameDefCap] zgadza się na tę prośbę."
 AST_diplomatic_events.31.a: "Nie mamy nad tym kontroli."
 AST_diplomatic_events.32.t: "[FROM.GetNameDefCap] zezwala na korzystanie z zasobów"
 AST_diplomatic_events.32.desc: "[FROM.GetNameDefCap] zgadza się z tym, że zasoby Indochin znajdą lepsze zastosowanie w rękach Australijczyków, przyznając nam tym samym prawo do nich."
 AST_diplomatic_events.32.a: "Bardzo się przydadzą."
 AST_diplomatic_events.33.t: "[FROM.GetNameDefCap] odmawia prawa do zasobów"
 AST_diplomatic_events.33.desc: "[FROM.GetNameDefCap] nie zgadza się z tym, że surowce Indochin znajdą lepsze zastosowanie w rękach Australijczyków, odmawiając nam tym samym prawa do nich."
 AST_diplomatic_events.33.a: "Miejmy nadzieję, że nie skończą w rękach wroga."
 AST_diplomatic_events.34.t: "[AST.GetNameDefCap] prosi o podział pacyficznych terytoriów"
 AST_diplomatic_events.34.desc: "[AST.GetNameDefCap] proponuje pakt, który ma zapobiec potencjalnym konfliktom między naszymi państwami. Jeśli podzielimy pacyficzne terytoria między siebie, będziemy mogli planować ekspansję bez wchodzenia sobie nawzajem w drogę."
 AST_diplomatic_events.34.a: "Pakt to rozsądna propozycja."
 AST_diplomatic_events.34.b: "[JAP.GetNameDefCap] nie będzie pytać nikogo o zdanie przy ekspansji."
 AST_diplomatic_events.35.t: "Pacyfik zostaje podzielony"
 AST_diplomatic_events.35.desc: "[AST.GetNameDefCap] i [JAP.GetNameDefCap] doszły do porozumienia w sprawie zajmowania nowych terytoriów nad Pacyfikiem. Miejmy nadzieję, że pomoże to uniknąć przyszłych konfliktów między naszymi mocarstwami."
 AST_diplomatic_events.35.a: "Zatem wszystko ustalone!"
 AST_diplomatic_events.36.t: "Pacyfik podzieli się sam"
 AST_diplomatic_events.36.desc: "[JAP.GetNameDefCap] nie zgadza się na podział pacyficznych terytoriów pomiędzy nasze mocarstwa. Japoński rząd nie zamierza pytać nikogo o zdanie przy ekspansji."
 AST_diplomatic_events.36.a: "Australijski rząd uczyni to samo."
 AST_diplomatic_events.37.t: "Przekazanie władzy"
 AST_diplomatic_events.37.desc: "Z nieznanych przyczyn [AST.GetName] postanowiła, że od tej pory naszymi terenami zarządzać będzie [JAP.GetNameDef]. Za kulisami dzieje się coś złowrogiego i to tylko kwestia czasu, aż świat dowie się, o co chodzi."
 AST_diplomatic_events.37.a: "Najwyraźniej nie mamy tu nic do powiedzenia."
 AST_diplomatic_events.38.t: "Układ w Nauru"
 AST_diplomatic_events.38.desc: "Wskutek pierwszej wojny światowej kilka niemieckich terytoriów nad Pacyfikiem znalazło się pod australijską kontrolą, ale być może istnieje sposób na odzyskanie jednego z nich - wyspy Nauru.\n\n[AST.GetFascistParty] wyznaje wartości zgodne z naszymi interesami, do których zalicza się pełne rozdzielenie [AST.GetAdjective] i [ENG.GetAdjective] państwa. Z powodu ograniczonych wpływów tego ruchu jego przedstawiciele szukają naszego wsparcia, by przyśpieszyć jego rozwój, a gdy osiągną pełnię władzy, zwrócą kontrolę nad wyspą Nauru - oczywiście pod warunkiem, że udzielimy im gwarancji, gdy będą dążyć do niepodległości."
 AST_diplomatic_events.38.a: "Odzyskamy nasze terytorium!"
 AST_diplomatic_events.38.b: "Nie możemy składać pustych obietnic."
 AST_diplomatic_events.39.t: "[GER.GetNameDefCap] zgadza się na układ w Nauru"
 AST_diplomatic_events.39.desc: "[GER.GetNameDefCap] i [AST.GetFascistParty] dochodzą do porozumienia: [AST.GetName] ma osiągnąć niepodległość. [AST.GetFascistParty] ma obecnie ograniczone wpływy polityczne, więc [GER.GetAdjective] władze wesprą partię dotacją, aby przyspieszyć jej rozwój, a gdy nasze wpływy nie będą już ograniczone, porozumienie zostanie w pełni zrealizowane."
 AST_diplomatic_events.39.a: "Doskonale!"
 AST_diplomatic_events.40.t: "Układ w Nauru zostaje zerwany"
 AST_diplomatic_events.40.desc: "Nie chcąc składać obietnic bez pokrycia, [GER.GetAdjective] władze odmawiają wsparcia naszego dążenia do przejęcia władzy. Układ w Nauru odchodzi w niebyt, nim został w ogóle zawiązany. [AST.GetFascistParty] i ambicje tej partii pozostają wyłącznie naszą odpowiedzialnością."
 AST_diplomatic_events.40.a: "[AST.GetFascistParty] będzie działać bez poparcia Niemców."
 AST_diplomatic_events.41.t: "Nauru wraca do rąk Niemców"
 AST_diplomatic_events.41.desc: "[AST.GetFascistParty] zdobywa pełną władzę i dotrzymuje obietnicy oraz swojej części umowy. Nauru wraca pod [GER.GetAdjective] kontrolę, a my będziemy gwarantami australijskiej niepodległości."
 AST_diplomatic_events.41.a: "Tak się stanie."
 AST_diplomatic_events.42.t: "[AST.GetFascistParty] łamie obietnicę"
 AST_diplomatic_events.42.desc: "Obietnice mają jedną poważną wadę - można je złamać. [AST.GetFascistParty] sprawuje władzę, ale partyjni przywódcy postanowili, że należy im się nie tylko Nauru, ale także inne wyspy Pacyfiku.\n\nNasze dawne pacyficzne terytoria pozostaną poza naszym zasięgiem dokładnie tak samo jak przed podpisaniem układu w Nauru, a jeśli chcemy, by było inaczej, czeka nas wojna."
 AST_diplomatic_events.42.a: "Przyszłość pokaże konsekwencje tej decyzji."
 AST_diplomatic_events.43.t: "Władze [AST.GetAdjective] domagają się Azji Południowo-Wschodniej"
 AST_diplomatic_events.43.desc: "Władze [AST.GetAdjective] twierdzą, że dzięki ekspansji na północ możemy zwiększyć nasz wspólny wpływ na dyplomację i konflikty w Azji Południowo-Wschodniej. Chociaż nie jest to otwarte żądanie, [AST.GetLeader] sugeruje, że odmowa nie zostanie zaakceptowana."
 AST_diplomatic_events.43.a: "Naszą uwagę zajmują inne kwestie, więc to dobre rozwiązanie."
 AST_diplomatic_events.43.b: "Tak czy inaczej, spotka ich odmowa."
 AST_diplomatic_events.44.t: "Transfer Azji Południowo-Wschodniej"
 AST_diplomatic_events.44.desc: "[ENG.GetNameDefCap] w swojej mądrości zgadza się na przekazanie nam terytoriów w Azji Południowo-Wschodniej. Wraz z poszerzeniem granic Australii rosną też nasze wpływy, więc to tylko kwestia czasu, zanim świat stanie przed nami otworem."
 AST_diplomatic_events.44.a: "Czeka nas świetlana przyszłość."
 AST_diplomatic_events.45.t: "Sytuacja w Azji Południowo-Wschodniej pozostaje bez zmian"
 AST_diplomatic_events.45.desc: "[ENG.GetNameDefCap] odrzuca propozycję przekazania nam swoich terytoriów w Azji Południowo-Wschodniej. Niemniej jednak perspektywa sprawowania kontroli nad tym regionem nadal wydaje nam się atrakcyjna i choć nie będzie on należał do nas na nasze żądanie, to może jeszcze stać się naszą własnością."
 AST_diplomatic_events.45.a: "Tak, to możliwe."
 #AST_diplomatic_events.46.t was removed
 AST_diplomatic_events.47.t: "Współdzielenie obciążeń"
 AST_diplomatic_events.47.desc: "Pomimo niedawnego wystąpienia z Brytyjskiej Wspólnoty Narodów [AST.GetName] proponuje współpracę wojskową. [AST.GetName] twierdzi, że [ENG.GetNameDefCap] skorzysta na podziale obciążeń, biorąc pod uwagę to, jak bardzo rozległy jest obszar brytyjskich interesów."
 AST_diplomatic_events.47.a: "Zgadzamy się."
 AST_diplomatic_events.47.b: "Poradzimy sobie sami."
 AST_diplomatic_events.48.t: "Pakt brytyjsko-australijski"
 AST_diplomatic_events.48.desc: "[ENG.GetNameDefCap] zgadza się na podpisanie paktu o nieagresji, kładąc tym samym podwaliny pod współpracę wojskową."
 AST_diplomatic_events.48.a: "To początek nowego rozdziału w naszych stosunkach."
 AST_diplomatic_events.49.t: "Niepodpisany pakt"
 AST_diplomatic_events.49.desc: "[ENG.GetNameDefCap] odmawia podpisania paktu o nieagresji. Próba nawiązania współpracy wojskowej między naszymi krajami zakończyła się zatem niepowodzeniem i musimy kontynuować nasze zewnętrzne działania na własną rękę."
 AST_diplomatic_events.49.a: "W rzeczy samej."
 AST_diplomatic_events.50.t: "Australijski garnizon na Pacyfiku"
 AST_diplomatic_events.50.desc: "Chociaż ochrona Azji Południowo-Wschodniej i regionu Pacyfiku leży w interesie Wielkiej Brytanii, region ten znajduje się daleko od Wysp Brytyjskich; tak to rozumie [FROM.GetName]. W zamian za nasze wsparcie w zakresie zaopatrzenia zaproponowali przejęcie dowództwa nad obroną tego terytorium, co pozwoli nam skupić uwagę na innych sprawach."
 AST_diplomatic_events.50.a: "Wsparcie [FROM.GetAdjective] sił jest mile widziane."
 AST_diplomatic_events.50.b: "Region ten znajduje się wystarczająco blisko."
 AST_diplomatic_events.51.t: "Garnizon [ENG.GetAdjective] sił na Pacyfiku"
 AST_diplomatic_events.51.desc: "[FROM.GetNameDefCap] wyraża zgodę; wody Azji Południowo-Wschodniej będą objęte naszą ochroną. W zamian za brytyjskie dostawy paliwa [ROOT.GetName] dołoży wszelkich starań, aby zwiększyć dominację morską na sąsiednich wodach."
 AST_diplomatic_events.51.a: "Te wody będą nasze."
 AST_diplomatic_events.52.t: "Australijski garnizon na Pacyfiku"
 AST_diplomatic_events.52.desc: "[FROM.GetNameDefCap] wyraża sprzeciw; nie potrzebuje pomocy w obronie wód Azji Południowo-Wschodniej. Jednak niezależnie od brytyjskiego wsparcia [ROOT.GetName] dołoży wszelkich starań, by umocnić swoją dominację morską na sąsiednich wodach."
 AST_diplomatic_events.52.a: "Te wody będą nasze."
 AST_diplomatic_events.53.t: "Wyparcie Vichy z Afryki"
 AST_diplomatic_events.53.desc: "[AST.GetName] podejrzewa, że upadek lub zmuszanie do współpracy Francji Vichy jest jednym z głównych celów [ENG.GetAdjective] władz, i w związku z tym oferuje dołączenie do tych działań i kontynuowanie walki o francuskie kolonie afrykańskie, dopóki Vichy nie zostanie pokonane. Chociaż za tą propozycją może kryć się jakiś nieznany plan, nie ma wątpliwości, że zwiększona obecność sojuszników w regionie przyniosłaby nam korzyści.\n\nJeśli wyrazimy zgodę, [AST.GetName] rozpocznie rozmowy z Francją Vichy, dążąc do pokojowego przekazania jej kolonii i utworzenia australijskiego garnizonu."
 AST_diplomatic_events.53.a: "Przyjmiemy ich wsparcie."
 AST_diplomatic_events.53.b: "Istnieje zbyt wielkie ryzyko, że [AST.GetName] wykorzysta to przeciwko nam."
 AST_diplomatic_events.54.t: "Ku pomocy"
 AST_diplomatic_events.54.desc: "[ENG.GetNameDefCap] przyznaje: zwiększona obecność sojuszników w Afryce przyniosłaby korzyści Wspólnocie Narodów.\n\nRozpoczniemy rozmowy z Francją Vichy, dążąc do pokojowego przejęcia jej kolonii i utworzenia australijskiego garnizonu."
 AST_diplomatic_events.54.a: "Tak zrobimy."
 AST_diplomatic_events.55.t: "Z przyzwoleniem lub bez"
 AST_diplomatic_events.55.desc: "[ENG.GetNameDefCap] odrzuca australijską pomoc w Afryce i zamierza samodzielnie zająć się kwestią Francji Vichy. Niemniej jednak naszych ambicji nie da się tak łatwo przekreślić.\n\nAustralijska kontrola nad afrykańskimi terytoriami Francji Vichy uczyniłaby nas równorzędnym partnerem Brytyjskiej Wspólnoty Narodów, a nie jej podwładnym. Musimy dążyć do tego celu wbrew [ENG.GetAdjective] życzeniom, choć będzie to wymagało użycia siły."
 AST_diplomatic_events.55.a: "Dokonamy ekspansji."
 AST_diplomatic_events.56.t: "Władze [AST.GetAdjective] żądają afrykańskich terytoriów"
 AST_diplomatic_events.56.desc: "[AST.GetName] puka do naszych drzwi jako [ENG.GetAdjective] emisariusz, żądając przekazania afrykańskich terytoriów.\n\nWładze [ENG.GetAdjective] mają zamiar rozszerzyć swoje wpływy w Afryce. Jeśli nie zgodzimy się na australijską okupację, powrócą do nas z bronią w ręku."
 AST_diplomatic_events.56.a: "Terytoria te zostaną przekazane, aby uniknąć konfliktu."
 AST_diplomatic_events.56.b: "W takim razie będą się musieli pofatygować."
 AST_diplomatic_events.57.t: "Francja Vichy przekazuje afrykańskie terytoria"
 AST_diplomatic_events.57.desc: "Francja Vichy zgodziła się przekazać afrykańskie terytoria będące obiektem żądań i zezwoliła australijskiemu garnizonowi na przejęcie kontroli nad tym regionem."
 AST_diplomatic_events.57.a: "Będziemy kontynuować ekspansję w Afryce!"
 AST_diplomatic_events.58.t: "Francja Vichy odrzuca [AST.GetAdjective] żądania terytorialne"
 AST_diplomatic_events.58.desc: "Francja Vichy odmawia przyznania nam afrykańskich terytoriów. Nie była to jednak prośba, lecz żądanie.\n\nPrzejmiemy region, którego nam odmówiono, choć będzie to wymagało użycia siły."
 AST_diplomatic_events.58.a: "Pokojowo czy nie, [AST.GetAdjective] ekspansja będzie kontynuowana."
 #AST_diplomatic_events.59 was removed
 #AST_diplomatic_events.60 was removed
 #AST_diplomatic_events.61 was removed
 AST_diplomatic_events.62.t: "Antybrytyjski pakt?"
 AST_diplomatic_events.62.desc: "Zwrócili się do nas [AST.GetAdjective] dyplomaci z propozycją zawarcia antybrytyjskiego paktu. Oznaczałoby to, że pomogliby nam odebrać północną Irlandię z rąk Anglików, bez konieczności bezpośredniej interwencji z naszej strony.\nW zamian, gdyby im się to udało, dołączylibyśmy do ich frakcji i wspierali ich w ewentualnej przyszłej wojnie z Wielką Brytanią.\nChociaż zjednoczenie z północą jest kuszące, musimy dokładnie rozważyć, czy możemy sobie pozwolić na tak silną antagonizację naszego potężniejszego sąsiada, a co ważniejsze, czy w razie konfliktu uda nam się wyjść z niego zwycięsko - aby cała Irlandia nie stała się ponownie tylko brytyjską kolonią."
 AST_diplomatic_events.62.a: "Zjednoczenie nie może czekać! Podpiszmy pakt!"
 AST_diplomatic_events.62.b: "To zbyt niebezpieczne."
 AST_diplomatic_events.63.t: "Irlandia odrzuca propozycję!"
 AST_diplomatic_events.63.desc: "Irlandia odmówiła podpisania antybrytyjskiego paktu."
 AST_diplomatic_events.63.a: "W takim razie Irlandia pozostanie podzielona."
 AST_diplomatic_events.64.t: "Irlandia przyjmuje propozycję!"
 AST_diplomatic_events.64.desc: "Irlandia zgodziła się na podpisanie antybrytyjskiego paktu."
 AST_diplomatic_events.64.a: "Naprzód! Na Belfast!"
 AST_diplomatic_events.65.t: "[FROM.GetName]: propozycja wsparcia" ### Support for the Chinese Communists - Sends event from AST to PRC offering support
 AST_diplomatic_events.65.desc: "[FROM.GetNameDef]: [FROM.GetCommunistParty] ma w tym państwie coraz większe wpływy, co obecnie przynosi skutki w postaci przedstawicieli wędrujących po Chinach i informujących nas o [FROM.GetAdjective] ochotnikach, którzy mobilizują się, by wesprzeć nasze siły. Co więcej, posiadają oni zapasowe wyposażenie, które będzie pomocą dla naszych żołnierzy."
 AST_diplomatic_events.65.a: "To dobry początek współpracy z naszymi [FROM.GetAdjective] towarzyszami."
 #AST_diplomatic_events.65.b: "They should focus on their own revolution"
 AST_diplomatic_events.66.t: "[FROM.GetName]: podziękowania za wsparcie" ### Support for the Chinese Communists - They accept
 AST_diplomatic_events.66.desc: "[FROM.GetLeader] podziękował nam poprzez swoich przedstawicieli za wsparcie naszych ochotników i zaopatrzenie wojskowe. Obszerne doświadczenie [FROM.GetAdjective] sił z wojny domowej z pewnością sprawi, że owe zasoby zostaną skutecznie wykorzystane."
 AST_diplomatic_events.66.a: "To świetny pierwszy krok."
 AST_diplomatic_events.67.t: "[FROM.GetName]: podziękowania za wsparcie" ### Support for the Chinese Communists - They accept
 AST_diplomatic_events.67.desc: "[FROM.GetLeader] podziękował nam poprzez swoich przedstawicieli za wsparcie naszych ochotników i zaopatrzenie wojskowe. Obszerne doświadczenie [FROM.GetAdjective] sił z wojny domowej z pewnością sprawi, że owe zasoby zostaną skutecznie wykorzystane."
 AST_diplomatic_events.67.a: "To świetny pierwszy krok."
 AST_diplomatic_events.68.t: "Żądania Australii"
 AST_diplomatic_events.68.desc: "[JAP.GetNameDef] to straszliwy wróg, z którym Australia nie chce mierzyć się samotnie. Naciska na nas, abyśmy przejęli inicjatywę i jak najszybciej załagodzili nadciągający konflikt."
 AST_diplomatic_events.68.a: "Ależ nieoczekiwany zwrot."
 AST_diplomatic_events.69.t: "Odnowiona więź"
 AST_diplomatic_events.69.desc: "[ENG.GetNameDef] i [AST.GetName] to kraje, które łączy więź poddawana próbie. [AST.GetName] chce przywrócić tej więzi dawną siłę - ma w brytyjskim rządzie tak silne powiązania i sojuszników, że jego przywódcy po prostu nie mogą odmówić. Narody te ponownie dołączą do tej samej frakcji, a Wyspy i Antypody znów będą współpracować."
 AST_diplomatic_events.69.a: "Tak się też stanie."
 AST_diplomatic_events.71.t: "Australia domaga się przekazania jej wysp na Pacyfiku"
 AST_diplomatic_events.71.desc: "[AST.GetName] domaga się przekazania pod jej kontrolę naszych wysp na Pacyfiku. Twierdzi, że zachodni Ocean Spokojny nie może znajdować się pod jurysdykcją rządu [USA.GetAdjective]. Te wyspy mogą być niewielką ceną za złagodzenie australijskiej wrogości, ale i tak to odczujemy. Czy chcemy zaryzykować gniew umacniającego się mocarstwa faszystowskiego, choć i tak mamy ręce pełne roboty?"
 AST_diplomatic_events.71.a: "Nie, nie chcemy."
 AST_diplomatic_events.71.b: "Wyspy na Pacyfiku pozostaną nasze."
 AST_diplomatic_events.72.t: "Przekazanie [USA.GetAdjective] wysp na Pacyfiku"
 AST_diplomatic_events.72.desc: "Rząd [USA.GetAdjective] ma sporo na głowie, więc wyspy na Pacyfiku były dla niego niewielką ceną za osłabienie australijskiej wrogości. Teraz te wyspy są nasze."
 AST_diplomatic_events.72.a: "Doskonale."
 AST_diplomatic_events.73.t: "[USA.GetNameDefCap] odmawia"
 AST_diplomatic_events.73.desc: "[USA.GetNameDefCap] odmawia przekazania nam swoich wysp na Pacyfiku. Mimo naszych żądań i rosnących wpływów na Oceanie Spokojnym Waszyngton nie zamierza zrzec się tych wysp."
 AST_diplomatic_events.73.a: "Wyspy nie będą nasze. Na razie."
 AST_diplomatic_events.74.t: "Australijskie żądania przekazania Filipin"
 AST_diplomatic_events.74.desc: "[AST.GetName], w ramach realizacji swoich ambicji powiększenia terytorium, domaga się przekazania im terytorium [PHI.GetAdjective]. [AST.GetName] grozi, że jeśli odmówimy, wypowie nam wojnę. Twierdzi, że władze [USA.GetAdjective] nie mają możliwości zachowania ziem, które znajdują się w [AST.GetAdjective] strefie wpływów."
 AST_diplomatic_events.74.a: "Nie możemy ryzykować wojny. Spełnijmy ich żądania."
 AST_diplomatic_events.74.b: "Filipiny pozostaną nasze!"
 AST_diplomatic_events.75.t: "Przekazanie: [PHI.GetNameDef]"
 AST_diplomatic_events.75.desc: "To oczywiste, że [AST.GetName] jako rosnące mocarstwo faszystowskie zaczyna czerpać pewne korzyści z obranego kursu, gdyż budzi poważne obawy innych państw. Rząd [USA.GetAdjective] zgodził się. [PHI.GetNameDef] to nasze terytorium."
 AST_diplomatic_events.75.a: "Rodzi się nowy porządek."
 AST_diplomatic_events.76.t: "[USA.GetNameDefCap] odmawia"
 AST_diplomatic_events.76.desc: "[USA.GetNameDefCap] deklaruje, że [PHI.GetNameDef] to ich terytorium, którego nie zamierzają oddać. Mimo naszych żądań i rosnących wpływów na Oceanie Spokojnym Waszyngton nie zamierza zrzec się tych ziem."
 AST_diplomatic_events.76.a: "To oznacza wojnę."
 AST_diplomatic_events.78.t: "[AST.GetName] zwraca się o gwarancje wymierzone w potęgę"
 AST_diplomatic_events.78.desc: "[AST.GetNameDefCap] ma takie same śmiałe cele jak my:\n\n[USA.GetNameDefCap] to kraj, który rzuca na nas swój cień, grożąc interwencją za każdym razem, gdy nasze działania nie pokrywają się z jego interesami. Gdy takie mocarstwo miesza się w japońskie i australijskie sprawy, Azja Wschodnia nigdy nie będzie naprawdę należeć do nas. Dlatego [AST.GetName] pójdzie na wojnę.\n\nPremier [AST.GetLeader] jasno określił swoje zamiary: [AST.GetName] chce walczyć z siłami [USA.GetAdjective], dlatego zwraca się do nas o pomoc na wypadek, gdyby Amerykanie okazali się zbyt silni."
 AST_diplomatic_events.78.a: "Udzielimy im gwarancji."
 AST_diplomatic_events.78.b: "[JAP.GetNameDefCap] musi zająć się swoimi sprawami."
 AST_diplomatic_events.79.t: "[JAP.GetNameDefCap] udziela gwarancji dla: [AST.GetName]"
 AST_diplomatic_events.79.desc: "To oczywiste, nie tylko dla nas, że [USA.GetNameDef] miesza się w stosunki dyplomatyczne w Azji i Oceanii, co jest zarówno niepożądane, jak i niedopuszczalne. [JAP.GetNameDefCap] zgadza się udzielić gwarancji naszemu krajowi, już nie musimy obawiać się naszych wrogów, ponieważ mamy sojusznika, który przyjdzie nam z pomocą, jeśli Amerykanie okażą się zbyt silni."
 AST_diplomatic_events.79.a: "Idziemy na wojnę."
 AST_diplomatic_events.80.t: "[JAP.GetNameDefCap] nie udzieli nam gwarancji"
 AST_diplomatic_events.80.desc: "[USA.GetNameDefCap] miesza się w stosunki dyplomatycznych w Azji i Oceanii, co jest zarówno niepożądane, jak i niedopuszczalne, ale chyba tylko my zdajemy sobie z tego sprawę. [JAP.GetNameDefCap] nie udzieli nam gwarancji, zatem musimy samotnie stanąć do walki z naszymi wrogami."
 AST_diplomatic_events.80.a: "I tak się stanie."
 AST_diplomatic_events.81.t: "Ujmujący symbol jedności"
 AST_diplomatic_events.81.desc: "Zainteresowanie brytyjskiego premiera zwierzętami nie uszło niczyjej uwadze, jego kolekcja jest imponująca. Kolejny okaz do tej różnorodnej rodziny stworzeń z pewnością zostanie doceniony, tym bardziej że będzie to egzotyczne zwierzę.\n\nSam [ENG.GetLeader] wyraził zainteresowanie dziobakiem australijskim, i chociaż eksport tych stworzeń jest obecnie zakazany ze względu na zagrożenie zdrowotne związane z przewozem osobników tego gatunku, to może w tym przypadku moglibyśmy zrobić wyjątek.\n\nCzy spełnimy życzenie premiera i dziobak stanie się symbolem jedności?"
 AST_diplomatic_events.81.a: "[ENG.GetLeader] dostanie upragnionego dziobaka."
 AST_diplomatic_events.81.b: "Zakaz eksportu nie zostanie zniesiony, nawet dla premiera."
 AST_diplomatic_events.82.t: "[ENG.GetLeader] przekazuje ponure informacje"
 AST_diplomatic_events.82.desc: "Transportowiec, który sześć tygodni temu wypłynął z Melbourne z całym wybiegiem dla dziobaków na pokładzie, zawinął do [ENG.GetAdjective] portu. Jednak przybycie statku nie było radosnym wydarzeniem, ponieważ przewożone zwierzę nie przeżyło podróży. [ENG.GetLeader] rozpacza nad losem swojego zwierzaka, któremu zdążył już nadać imię, twierdzi też, że za zgonem dziobaka stoją wrogowie. Wygląda na to, że wybuchy spowodowane atakiem okrętu podwodnego przeraziły zwierzę na śmierć.\n\nJednak dziennik opiekuna dziobaka wskazuje na inną, prawdopodobną przyczynę zgonu: temperatura wody i powietrza na wybiegu przekraczała dopuszczalne poziomy.\n\nTak czy owak [ENG.GetLeader] stracił swojego dziobaka, brytyjski premier musi jakoś żyć bez niego."
 AST_diplomatic_events.82.a: "To naprawdę smutna wiadomość."
 AST_political_events.1.t: "Wezwanie do przeprowadzenia referendum"
 AST_political_events.1.desc: "Są dwa obszary, w których jako rząd dążymy do zwiększenia kontroli: lotnictwo i sprzedaż.\n\nJeśli chodzi o lotnictwo, celem jest zmiana konstytucji, by nadać parlamentowi Wspólnoty Narodów władzę nad ustanawianiem praw o nawigacji powietrznej i samolotach.\n\nPoprawka dotycząca sprzedaży ma zezwolić na współpracę Wspólnoty Narodów i regionów w tym zakresie, co aktualna konstytucja uniemożliwia.\n\nNa czym skupimy się w referendum?"
 AST_political_events.1.a: "Na lotnictwie, by uregulować nawigację powietrzną nad [AST.GetAdjective] terytorium."
 AST_political_events.1.a.tt: "Gdy reforma zostanie uchwalona:\n dodaj §Yuchwaloną reformę lotnictwa§!, która zapewnia:\n Szybkość rozwoju technologii powietrznych: §G+15%§!\n tempo budowy §Ybaz lotniczych§!: §G+5%§!"
 AST_political_events.1.b: "Na sprzedaży, by skoordynować rolnicze plany sprzedażowe w całym kraju."
 AST_political_events.1.b.tt: "Gdy reforma zostanie uchwalona:\n dodaj §Yuchwaloną reformę o sprzedaży§!, która zapewnia:\n Współczynnik fabryk dóbr konsumpcyjnych: §Y-10%§!"
 AST_political_events.2.t: "Udane referendum"
 AST_political_events.2.desc.a: "Społeczeństwo wyraziło zgodę na wprowadzenie w życie naszej reformy lotnictwa. W momencie tworzenia australijskiej konstytucji lotnictwo jeszcze nie istniało, dlatego słuszne jest, by rząd w końcu przejął zwierzchnictwo nad nawigacją lotniczą i regulacjami w tej dziedzinie. W trosce o bezpieczeństwo i efektywność należy teraz wprowadzić jednolite krajowe przepisy lotnicze."
 AST_political_events.2.desc.b: "Społeczeństwo wyraziło zgodę na wprowadzenie reformy rynku. Dzięki uprawnieniom do regulowania rynku produktów rolnych i ich sprzedaży rząd będzie teraz mógł stabilizować je oraz usprawniać współpracę między poszczególnymi stanami. Dochody rolników staną się bardziej stabilne, podobnie jak krajowa gospodarka."
 AST_political_events.2.a: "Władza federalna będzie większa!"
 AST_political_events.4.t: "Premier nie wytrzymuje"
 AST_political_events.4.desc: "Przywódcy państwa [AST.GetAdjective] od dawna działają pod presją przygotowań do wojny, związany z nimi stres sprawił, że premier zmarł na zawał.\n\nBiorąc pod uwagę bieżącą sytuację na świecie, będziemy boleśnie odczuwać brak jego przywództwa. Tak czy inaczej, Australia musi poradzić sobie z nowym przywódcą u steru: [AST.GetLeader]."
 AST_political_events.4.a: "To narodowa tragedia."
 AST_political_events.5.t: "Australijski rząd radykalizuje się"
 AST_political_events.5.desc: "Grupa buntowniczych osób o kontrowersyjnych poglądach utworzyła ruch Australia Przede Wszystkim. Rząd obawia się, że jego członkowie mogą nie do końca popierać demokrację, i postanowił objąć ich ścisłą obserwacją. Ingerencja demokratów ograniczy nasze możliwości organizacyjne i zahamuje proces pozyskiwania nowych członków."
 AST_political_events.5.a: "Czas pokaże prawdziwą naturę tej organizacji."
 AST_political_events.6.t: "150. rocznica w 1938 roku"
 AST_political_events.6.desc: "Dzisiaj rano, podczas obchodów 150. rocznicy powstania Australii, wypadającej w 1938 roku, oraz parady pod hasłem „Marsz Australii do państwowości” przechodzącej głównymi ulicami Sydney, przed budynkiem Australia Hall odbyła się demonstracja.\n\nAktywiści i grupy walczące o prawa Aborygenów zebrali się, aby zwrócić uwagę na fakt, że 150. rocznica upamiętnia nie tylko początek brytyjskiej kolonizacji, ale także konstytucyjną dyskryminację rdzennej ludności. Aktywiści domagali się nowych przepisów dotyczących edukacji i opieki nad Aborygenami, a także nowej polityki umożliwiającej przyznanie rdzennej ludności pełni praw obywatelskich."
 AST_political_events.6.a: "Należy podjąć działanie."
 AST_political_events.7.t: "Imperialny nacisk"
 AST_political_events.7.desc: "W świetle ostatnich wydarzeń nie można już zaprzeczyć, że w australijskiej polityce zachodzą zmiany. [ENG.GetNameDefCap] podejmuje działania dyplomatyczne, aby [AST.GetName] i [AST.GetAdjective] władze pozostały na ścieżce odpowiedniej dla kraju należącego do Wspólnoty Narodów, mając nadzieję, że pokojowe naciski w wystarczą do utrzymania lojalności tego dominium."
 AST_political_events.7.a: "Pomimo starań Wielkiej Brytanii, to [AST.GetName] zdecyduje o swojej przyszłości."
 AST_political_events.8.t: "Nadchodzi wojna"
 AST_political_events.8.desc: "$AST_war_is_coming_cat_desc$"
 AST_political_events.8.a: "Musimy się przygotować."
 AST_political_events.9.t: "Spór o Dalfram"
 AST_political_events.9.desc: "Spór dotyczący załadunku surówki hutniczej przerodził się w coś znacznie poważniejszego. Robotnicy w całej Australii solidarnie zaprzestali pracy, protestując przeciwko działaniom rządu i przemysłu. W miarę jak strajki się rozprzestrzeniają, a napięcie rośnie, kryzys nabiera tempa i pojawiają się żądania dymisji osób sprawujących władzę. W związku z tym rząd, który nie zdołał opanować sytuacji, postanawia ustąpić, pozostawiając pole do działania partii [AST.GetCommunistParty]."
 AST_political_events.9.a: "Będziemy działać i przejmiemy władzę."
 AST_canberra_air_disaster_events.1.t: "Katastrofa powietrzna nad Canberrą"
 AST_canberra_air_disaster_events.1.desc: "Dziś rano samolot Lockheed Hudson rozbił się tuż przy obrzeżach Canberry. Wśród dziesięciu osób na pokładzie był dowódca armii i jego sztab, którzy lecieli na posiedzenie rady gabinetowej. Niestety, wszyscy pasażerowie tragicznie zginęli.\n\nPrzyczyny katastrofy są zagadką. Warunki pogodowe były idealne, a samolot był pilotowany przez doświadczonego kapitana lotnictwa RAAF Roberta Hitchcocka.\n\nNiezależnie od przyczyny, jest to upiorny dzień nie tylko dla rodzin i przyjaciół ofiar, lecz także i całego państwa. Australia spogląda ku swoim przywódcom. Jaka będzie ich reakcja?"
 AST_canberra_air_disaster_events.1.a: "To tragedia."
 AST_canberra_air_disaster_events.1.a.tt: "Odblokowanie nowych decyzji (§YZaufanie gabinetu§!) i §Ymisji§! ocalenia lub obalenia aktualnego rządu."
 AST_canberra_air_disaster_events.2.t: "[AST.GetRulingParty] trwa dalej"
 AST_canberra_air_disaster_events.2.desc: "Aktualnie panujący rząd pomyślnie przeprowadził Australię przez wewnętrzny zamęt po katastrofie lotniczej w Canberze. [AST.GetRulingParty], niczym opiekuńcze światło, udowodniła swą niezawodność i siłę w czasie próby, zyskując większe poparcie w całym kraju."
 AST_canberra_air_disaster_events.2.a: "Przyszłość pokaże, co dalej."
 AST_canberra_air_disaster_events.3.t: "Wniosek o wotum nieufności"
 AST_canberra_air_disaster_events.3.desc: "Po uchwaleniu wotum nieufności panujący rząd został w końcu obalony i niechętnie przekazał władzę swoim następcom. Po okresie politycznej destabilizacji i publicznej nieufności Australia jest gotowa na nowy początek."
 AST_canberra_air_disaster_events.3.a: "Nowa władza przybywa Australii z pomocą."
 AST_canberra_air_disaster_events.4.t: "Zmiana przywództwa"
 AST_canberra_air_disaster_events.4.desc: "Po okresie politycznej destabilizacji i publicznej nieufności, [AST.GetRulingParty] zmienia swoich przywódców. Przeważająca większość zmusza premiera do ustąpienia w głosowaniu, robiąc miejsce dla jego następcy."
 AST_canberra_air_disaster_events.4.a: "Miejmy nadzieję, że to zapewni Australii dobrą przyszłość."
 AST_canberra_air_disaster_events.5.t: "Oskarżenia ze strony Australii"
 AST_canberra_air_disaster_events.5.desc: "[AST.GetName] obrzuciła nas oskarżeniami podczas konferencji prasowej, twierdząc, że odpowiadamy za niedawną katastrofę lotniczą na terenie tego kraju, w której zginęło kilku przedstawicieli rządu.\n\nRzecz jasna, oskarżenia te są zupełnie bezpodstawne, co czyni tę zniewagę jeszcze bardziej bezczelną."
 AST_canberra_air_disaster_events.5.a: "To nieprawdziwe stwierdzenia i nie musimy na nie reagować."
 AST_canberra_air_disaster_events.5.b: "Nie pozostawimy tego bezkarnie."
 AST_canberra_air_disaster_events.6.t: "[JAP.GetNameDefCap] odpowiada"
 AST_canberra_air_disaster_events.6.desc: "[JAP.GetNameDefCap] surowo odpowiedziało na nasze oskarżenia, uznając je za akt agresji. [JAP.GetLeader] jeszcze bardziej zaognia konflikt, twierdząc, że jego kraj ma teraz prawo, by zaatakować nasze ziemie."
 AST_canberra_air_disaster_events.6.a: "Nie będziemy zwiększać tego napięcia."
 AST_canberra_air_disaster_events.6.b: "Nie pozostawimy tego bez odpowiedzi."
 INS_limited_war_events.1.t: "Zmiażdżyć Malaje!"
 INS_limited_war_events.1.desc: "Linie wroga zostały przełamane, a nasi żołnierze posuwają się naprzód bez przeszkód. Po drugiej stronie cieśniny brytyjskie państwo zależne rozpada się pod naporem gniewu społeczeństwa. Marionetki Londynu sądziły, że bagnety ochronią je przed osądem historii. Myliły się."
 INS_limited_war_events.1.a: "Merdeka!"
 INS_limited_war_events.1.b: "To wspaniały dzień dla republiki."
 INS_limited_war_events.2.t: "Kontratak [FROM.GetAdjective] sił"
 INS_limited_war_events.2.desc: "To, co miało być szybkim atakiem na marionetkowy reżim, przybrało niekorzystny obrót. Wzmocnione przez imperialnych mocodawców [FROM.GetAdjective] siły wyparły naszych żołnierzy ze spornego obszaru i zaczęły jego okupację. Każdego dnia radio transmituje ich przechwałki. Kontynuowanie ofensywy grozi kolejnym upokorzeniem, ale wycofanie się oznacza przyznanie się do porażki przed całym archipelagiem."
 INS_limited_war_events.2.a: "Wycofajmy ludzi. Ratujmy, co się da."
 INS_limited_war_events.2.b: "Nie poddamy się marionetkom!"
 INS_limited_war_events.3.t: "[FROM.GetName] klęka przed republiką"
 INS_limited_war_events.3.desc: "Nadeszła wiadomość z Kuala Lumpur. Marionetkowy rząd porzucony w decydującej chwili przez swoich londyńskich mocodawców zaakceptował nasze warunki, byle tylko nie dopuścić do spalenia jego miast. Sporne tereny stały się naszą własnością. Pozostałe zależne państwa regionu dobrze zapamiętają tę lekcję."
 INS_limited_war_events.3.a: "Indonezja powstaje."
 INS_limited_war_events.4.t: "[FROM.GetName] odrzuca nasze warunki"
 INS_limited_war_events.4.desc: "[FROM.GetName] z pogardą odrzuca naszą ofertę. Marionetkowi ministrowie, czytając z kartki scenariusz napisany w Whitehall, oświadczają, że nie oddadzą nawet kawałka ziemi i że podporządkują sobie samą republikę, nim ucichną działa."
 INS_limited_war_events.4.a: "Niech więc przemówią działa."
 INS_limited_war_events.5.t: "[FROM.GetNameDef] chce naszego unicestwienia"
 INS_limited_war_events.5.desc: "[FROM.GetNameDefCap] porzuca ostatnie pozory stonowanej wojny. W swoich przekazach [FROM.GetAdjective] władze otwarcie mówią teraz o rozbiorze republiki i podziale jej wysp między dawnych kolonialnych władców. Ta sprawa nie zakończy się pokojowo. Albo Indonezja przetrwa ten konflikt, albo w ogóle przestanie istnieć."
 INS_limited_war_events.5.a: "Albo staniemy razem, albo razem upadniemy."
 INS_limited_war_events.6.t: "Ofensywa [FROM.GetAdjective] sił ulega załamaniu"
 INS_limited_war_events.6.desc: "Atak [FROM.GetAdjective] sił zaskoczył nas, a do tego nastąpił w najgorszej porze roku. Jednak ich ofensywa utknęła w martwym punkcie. Ich żołnierze są zmęczeni, linie zaopatrzeniowe rozciągnięte, a retoryka serwowana z Londynu z każdym komunikatem traci na skuteczności. Być może republika okaże się wielkoduszna i zaproponuje marionetkowym państwom możliwość wycofania się z tego konfliktu, choć wielu twierdzi, że zdecydowane zwycięstwo służy sprawie bardziej niż umiarkowane."
 INS_limited_war_events.6.a: "Zaproponuj im warunki."
 INS_limited_war_events.6.b: "Żadnej litości dla marionetek."
 INS_limited_war_events.7.t: "Nasza ofensywa ulega zatrzymaniu"
 INS_limited_war_events.7.desc: "Nasze natarcie utknęło w martwym punkcie, a co gorsza, wróg o tym wie. Zza cieśniny dotarło do nas żądanie. Albo natychmiast złożymy broń i zgodzimy się na ich warunki, albo lista ofiar będzie się wydłużać, a wynik i tak nie ulegnie zmianie. Jedyną różnicą jest to, jak wielki będzie pogrzeb."
 INS_limited_war_events.7.a: "Lepszy kiepski pokój niż gorsza wojna."
 INS_limited_war_events.7.b: "Republika się nie poddaje."
 INS_limited_war_events.8.t: "[FROM.GetName] nie zamierza się ugiąć"
 INS_limited_war_events.8.desc: "[FROM.GetName] reaguje na naszą ofertę z pogardą. Ich ministrowie oświadczają, że woleliby raczej spalić każdą wioskę od Penangu po Johor, niż pójść na jakiekolwiek ustępstwa wobec republiki. To oznacza wojnę."
 INS_limited_war_events.8.a: "Dobrze."
 INS_limited_war_events.9.t: "[FROM.GetName] chce rozbicia republiki!"
 INS_limited_war_events.9.desc: "Przechwycone komunikaty radiowe z dowództwa wroga potwierdziły najgorsze. Nie będzie żadnego porozumienia, żadnego wyważonego pokoju, żadnego powrotu do poprzednich granic. Marionetki i ich londyńscy zwierzchnicy domagają się całkowitej kapitulacji republiki, rozbicia Indonezji na kawałki i poddania jej wysp ponownie imperialistycznej kontroli, z której je wyrwaliśmy. Na to jest tylko jedna odpowiedź."
 INS_limited_war_events.9.a: "Indonezja się nie podda!"
 ### AST - Union Control Events ###
 AST_union_control_events.1.t: "Obcy agenci w naszych związkach zawodowych"
 AST_union_control_events.1.desc: "Służby wywiadowcze zwróciły uwagę rządu na niepokojący raport. Agenci australijskich komunistów nawiązują kontakty z lokalnymi przywódcami związków zawodowych, rozpowszechniają radykalne materiały i zachęcają pracowników do organizowania się zgodnie z rewolucyjnymi ideami. Ruch ten jest na razie niewielki, ale przedstawiciele służb bezpieczeństwa ostrzegają, że właśnie tak się to wszystko zaczyna. Należy podjąć decyzję, zanim ruch ten się umocni."
 AST_union_control_events.1.a: "Trzeba objąć ich nadzorem. Będziemy obserwować i czekać."
 AST_union_control_events.4.t: "Komunistyczni intruzi przejmują [MAL.GetAdjective] terytorium"
 AST_union_control_events.4.desc: "Do rządu dotarła szokująca informacja. W wyniku skoordynowanej operacji przejęto jeden z naszych stanów i ogłoszono go częścią rewolucyjnego rządu. Tempo i organizacja tego ataku nasuwają niepokojące pytania - nasze służby wywiadowcze podejrzewają, że buntownicy nie działali samodzielnie i że mogły ich tu sprowadzić obce siły. Ci, którym udało się uniknąć przejęcia, nie poddali się. Przegrupowali się i chwycili za broń, zdeterminowani, by odzyskać to, co im odebrano."
 AST_union_control_events.4.a: "Dowiedz się, kto za tym stoi. Rebelianci nie utrzymają swoich pozycji zbyt długo."
 AST_union_control_events.4.a.tt: "Powstały antykomunistyczne bojówki, które zjednoczyły się, by stawić opór komunistycznej okupacji."
 AST_union_control_events.5.t: "Katastrofa na [MAL.GetAdjective] wodach"
 AST_union_control_events.5.desc: "Operacja zakończyła się katastrofą. Naszym żołnierzom nie udało się wylądować na brzegu. Zostali zawróceni przez lojalistyczne patrole, przepadli w cieśninie lub zostali pojmani, zanim zdążyli dotrzeć na pozycje. Szczegóły są niejasne, ale wynik jest oczywisty. Co gorsza, o wszystkim dowiedziała się prasa. W parlamencie padają teraz pytania o to, co nasze siły właściwie robiły na tych wodach. Reakcja opinii publicznej jest pełna szoku i zażenowania. Niezależnie od korzyści, jakie mieliśmy nadzieję zapewnić rewolucji, będziemy musieli znaleźć inny sposób."
 AST_union_control_events.5.a: "To straszna porażka. Musimy poszukać innych sposobów, by wesprzeć naszych towarzyszy."
 AST_union_control_events.3.t: "[MAL.GetNonIdeologyName] - wybuch rewolucji"
 AST_union_control_events.3.desc: "Robotnicy [MAL.GetAdjective] rozpoczęli bunt. Komórki komunistyczne, które rozwinęły się dzięki naszej długotrwałej kampanii, chwyciły za broń w całym kraju - jednak sytuacja na froncie jest niepokojąca. Siły rewolucyjne skoncentrowały się w niewłaściwych rejonach i są oddzielone od serca półwyspu przez wodę i dżunglę. Bez przyczółka na kontynencie rząd po prostu poczeka, aż buntownicy opadną z sił, i zagłodzi rewolucję, zanim zdąży się ona rozprzestrzenić. Australia musi działać potajemnie i szybko, aby wysłać bojowników na półwysep i zapewnić rewolucji przestrzeń niezbędną do przetrwania."
 AST_union_control_events.3.a: "Nie możemy pozwolić, by rewolucja upadła na plaży. Zapewnijmy jej przyczółek."
 AST_union_control_events.2.t: "Agitatorzy z [AST.GetAdjective] wsparciem na naszych ulicach"
 AST_union_control_events.2.desc: "Agenci australijskiego komunistycznego rządu pojawili się w naszych miastach. Nie ukrywają się - pod bramami fabryk rozdawane są ulotki, na publicznych placach wygłaszane są przemówienia, a między australijskimi agentami a lokalnymi grupami radykałów powstają solidarnościowe powiązania. Wydaje się, że istniejące sieci obcych wpływów z dnia na dzień nabrały nowego wigoru. To skoordynowana kampania i rząd musi zdecydować, jak na nią zareagować, zanim niezadowolenie społeczne przerodzi się w coś trudniejszego do opanowania."
 AST_union_control_events.2.b: "Niepokojący obrót wydarzeń."
 ###########################
 ##### ABDACOM EVENTS ######
 ###########################
 ABDA_events.1.t: "Zaproszenie do nowego naczelnego dowództwa"
 ABDA_events.1.desc: "[FROM.GetNameDef] powołuje połączone naczelne dowództwo teatru Pacyfiku i zaprasza nas do tego ciała. Inicjatywa ta nosi nazwę ABDACOM, a jej zadaniem jest połączenie w ramach jednego dowództwa sił morskich, powietrznych oraz lądowych wszystkich krajów działających w regionie. Członkostwo oznaczałoby ściślejszą koordynację działań z [FROM.GetNameDef] i innymi partnerami, którzy już uczestniczą w tym formacie. Musimy postanowić, czy przyjmujemy to zaproszenie."
 ABDA_events.1.a: "Staniemy ramię w ramię."
 ABDA_events.1.b: "W tej chwili nie możemy dołączyć."
 ABDA_events.2.t: "[FROM.GetName] przystępuje do ABDACOM"
 ABDA_events.2.desc: "[FROM.GetNameDef] przyjmuje nasze zaproszenie do naczelnego dowództwa ABDACOM. Ich wojska będą teraz działać w ramach wspólnej struktury dowódczej, co wzmocni naszą pozycję w regionie Pacyfiku."
 ABDA_events.2.a: "To pozytywna wiadomość."
 ABDA_events.3.t: "Rząd [FROM.GetAdjective] odmawia przystąpienia"
 ABDA_events.3.desc: "[FROM.GetNameDef] odrzuca nasze zaproszenie do naczelnego dowództwa ABDACOM. Ich wojska na razie nie będą uczestniczyć we wspólnych działaniach, ale drzwi wciąż pozostają otwarte."
 ABDA_events.3.a: "To niefortunne, ale zostało zauważone."
 ABDA_events.5.t: "Zaproszenie do ABDACOM"
 ABDA_events.5.desc: "[FROM.GetNameDef] zaprasza nas do Dowództwa Amerykańsko-Brytyjsko-Holendersko-Australijskiego. ABDACOM już stało się najwyższą władzą koordynującą działania wojska alianckich na teatrze Pacyfiku i łączy marynarki wojenne i armie mocarstw alianckich w ramach jednego dowództwa. Partycypacja w tym ciele oznaczałaby działanie naszych wojsk w tej połączonej strukturze, dostęp do wspólnych danych wywiadowczych, koordynację doktryny i ogromne wsparcie ze strony sil alianckich. Musimy podjąć decyzję."
 ABDA_events.5.a: "Staniemy ramię w ramię."
 ABDA_events.5.b: "W tej chwili nie możemy dołączyć."
 ABDA_events.4.t: "Obrona Singapuru"
 ABDA_events.4.desc: "Singapur stał się kluczowym ogniwem obrony ABDACOM, dlatego nasi dowódcy muszą zdecydować o kształcie inwestycji w umocnienia. Naszym priorytetem mogą stać się morskie podejścia i obrona portów albo wzmocnienie podejść lądowych na wypadek inwazji lądowej. Możemy też rozdzielić nasze zasoby między oba te elementy. Każde działanie wpłynie na to, w jaki sposób będzie broniony Singapur, gdy nadciągną wojska wroga."
 ABDA_events.4.a: "Wzmocnijmy obronę podejść morskich. Siła Singapuru leży w jego porcie."
 ABDA_events.4.b: "Umocnijmy podejścia lądowe. Prawdziwe zagrożenie nadejdzie od lądu."
 ABDA_events.4.c: "Zrównoważone rozwiązanie. Musimy bronić wszystkich kierunków ataku."
 ABDA_fortress_singapore_choice_tt: "Ukończenie tego celu narodowego pozwoli wybrać sposób umocnienia Singapuru."
 ABDA_faction_membership_requirement_tt: "Dostępni członkowie frakcji otrzymają zaproszenia do przyłączenia się."
