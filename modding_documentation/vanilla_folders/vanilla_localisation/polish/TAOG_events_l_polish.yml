 ### INS - Political Events
 INS_political_events.1.t: "Nowy gubernator generalny: [INS.GetNameDef]"
 INS_political_events.1.desc: "[INS.GetLeader] wkrótce zakończy swoją pięcioletnią kadencję, zatem musimy znaleźć mu godnego następcę. Królowa Wilhelmina zarekomendowała Alidiusa Tjarda van Starkenborgh Stachouwera, który wykazał się jako ambasador nadzwyczajny i pełnomocnik ministra."
 INS_political_events.1.a: "Życzenie królowej jest dla nas rozkazem."
 INS_political_events.1.b: "[INS.GetLeader] dobrze się spisał, powinien zostać na kolejną kadencję."
 INS_political_events.2.t: "[FROM.GetName] domaga się przekazania własności regionu [721.GetName]"
 INS_political_events.2.desc: "Nowy rząd republikański w dawnych Indiach ogłosił, że cały archipelag jest jego terytorium. [FROM.GetLeader] przesłał nam oficjalne żądanie przekazania własności regionu [721.GetName], grożąc, że na odmowę odpowie interwencją wojskową."
 INS_political_events.2.a: "Zgoda, to sprawa niewarta zachodu."
 INS_political_events.2.b: "Nie ma takiej możliwości!"
 INS_political_events.3.t: "[FROM.GetName] zgadza się przekazać własność regionu [721.GetName]"
 INS_political_events.3.desc: "Zgodnie z przewidywaniami, [FROM.GetLeader] zgodził się spełnić nasze żądania i rozpoczął wycofywanie wojsk z regionu [721.GetName]. Wojska TKR weszły na te ziemie wraz z kilkoma przedstawicielami rządu. Sam [INS.GetLeader] przemówił w Dili i ogłosił wyzwolenie od kolonialnych wpływów."
 INS_political_events.3.a: "Wspaniale!"
 INS_political_events.4.t: "[FROM.GetName] odmawia przekazania własności regionu [721.GetName]"
 INS_political_events.4.desc: "Negocjacje z rządem [FROM.GetAdjective] źle się potoczyły. [FROM.GetLeader] stanowczo odmówił przekazania własności regionu [721.GetName] i przedwcześnie zakończył spotkanie."
 INS_political_events.4.a: "A więc wojna."
 INS_political_events.5.t: "Wybory powszechne w Indonezji"
 INS_political_events.5.desc: "To historyczna chwila w dziejach Indonezji. Rewolucja oficjalnie dobiegła końca, a premier [INS.GetLeader] ogłosił, że odbędą się tam pierwsze wolne i demokratyczne wybory. Ich wynik będzie miał długofalowe skutki dla tego kraju."
 INS_political_events.5.a: "Sutan Sjahrir doprowadził nasz kraj do tego momentu, może poprowadzić nas dalej!"
 INS_political_events.5.b: "Amir Sjarifuddin to kompromisowy kandydat dla socjalistów i nacjonalistów."
 INS_political_events.5.c: "Mohammad Hatta rozpoczął tę rewolucję i doprowadzi ją do końca."
 INS_political_events.6.t: "Nasze przygotowania się opłaciły"
 INS_political_events.6.desc: "Zaczęła się rewolucja, zatem nasi partyzanci, którzy przeniknęli do indyjskiej administracji, nie muszą dłużej działać potajemnie i rozpoczną realizację misji sabotażowych, zanim Holandia zdąży zareagować."
 INS_political_events.6.a: "Musimy działać szybko."
 INS_political_events.7.t: "Petycja Soetardjo"
 INS_political_events.7.desc: "Petycja do Volksraadu przygotowana przez Soetardjo, w której domaga się zwołania konferencji okrągłego stołu między holenderskimi i indonezyjskimi przedstawicielami, gdzie zostałoby omówione indonezyjskie dążenie do uzyskania autonomii, przeszła etap debaty wewnętrznej i została przekazana gubernatorowi generalnemu do akceptacji. Wielu doradców uważa, że należy zachować status quo, a zatem zawetować tę petycję, jednak należy pamiętać, że ruchy nacjonalistyczne są coraz silniejsze i bardziej radykalne. Jeżeli wciąż będziemy odrzucać każdy pokojowy wniosek o nadanie autonomii, nacjonaliści mogą sięgnąć po rozwiązania siłowe."
 INS_political_events.7.a: "Musimy rozpocząć negocjacje, żeby uniknąć nieuchronnej wojny domowej."
 INS_political_events.7.b: "Trzeba zachować status quo."
 INS_political_events.7.c: "Może nacjonaliści mają rację?"
 INS_political_events.8.t: "Nieuchronna [?event_target:INS_invasion_event_invader.GetAdjective] okupacja"
 INS_political_events.8.desc: "Żołnierze [?event_target:INS_invasion_event_invader.Adjective] przybyli na [?event_target:INS_invasion_event_invaded_state.GetAdjective] terytorium, a znajdujące się tam nasze wojska były tak nieliczne, że musieliśmy wydać rozkaz ewakuacji wszystkich sił z regionu [?event_target:INS_invasion_event_invaded_state.GetName]. Wojska [?event_target:INS_invasion_event_invader.GetAdjective] kontynuują natarcie w Indiach, mamy raczej niewielkie szanse uniknąć okupacji."
 INS_political_events.8.a: "Aresztujemy nacjonalistów i będziemy bronić kraju aż do śmierci!"
 INS_political_events.9.t: "Indonezyjczycy ogłosili niepodległość"
 INS_political_events.9.desc: "[JAP.GetNameDef] wycofuje swoje wojska z Indii Wschodnich, dlatego wysłaliśmy żołnierzy do Batavii, by przywrócić tam rządy kolonialne. Jednak nasi ludzie przekonali się, że indyjska scena polityczna bardzo się zmieniła od czasów okupacji. Nim nasze siły dotarły do Batavii, [INS.GetLeader] zdążył podpisać deklarację niepodległości, ogłosił powstanie suwerennej Republiki Indonezji, co spotkało się z szerokim poparciem opinii publicznej."
 INS_political_events.9.a: "Wysłać czołgi!"
 INS_political_events.9.b: "To na nic, nie potrzebujemy kolejnych starć. Powinniśmy zająć się odbudową ojczyzny."
 INS_political_events.11.t: "[HOL.GetNameDefCap] uznaje niezależność Indonezji"
 INS_political_events.11.desc: "Po ogłoszeniu niepodległości, nasze milicje natychmiast przygotowały się do obrony naszego terytorium przed spodziewaną holenderską inwazją. Jednak, ku zaskoczeniu wielu osób, [HOL.GetLeader] ogłosił, że nie wyda rozkazu przeprowadzenia ataku, lecz postawi na odbudowę Holandii i nie zamierza dążyć do dalszego konfliktu."
 INS_political_events.11.a: "To zaskoczenie, ale miłe."
 INS_political_events.12.t: "Spotkanie z nacjonalistami indonezyjskimi"
 INS_political_events.12.desc: "[?event_target:INS_invasion_event_invaded_state.GetName]: nasze wojska przeprowadziły desant, jesteśmy o krok od zwycięstwa na froncie indonezyjskim. Musimy postanowić, jak ma wyglądać okupacja Indonezji. Dzięki okupacji bezpośredniej zdobędziemy potrzebne nam zasoby, jednak będzie ona kosztowna i trudna. Negocjowaliśmy z Sukarno, jednym z ważniejszych rewolucjonistów, i wspólnie opracowaliśmy plan utworzenia przez nas indonezyjskiego państwa marionetkowego. Oficjalnie częściową władzę będzie sprawował Sukarno, ale pod naszym dowództwem. Dzięki temu indonezyjscy cywile będą spokojni, a takie rozwiązanie to tańsza alternatywa dla totalnej okupacji."
 INS_political_events.12.a: "Powinniśmy kontynuować negocjacje z Sukarno."
 INS_political_events.12.b: "Nie interesuje nas współpraca z rewolucjonistami."
 INS_political_events.13.t: "Nieuchronna [?event_target:INS_invasion_event_invader.GetAdjective] okupacja"
 INS_political_events.13.desc: "Żołnierze [?event_target:INS_invasion_event_invader.Adjective] przybyli na [?event_target:INS_invasion_event_invaded_state.GetAdjective] terytorium, a znajdujące się tam nasze wojska były tak nieliczne, że musieliśmy wydać rozkaz ewakuacji wszystkich sił z regionu [?event_target:INS_invasion_event_invaded_state.GetName]. Wojska [?event_target:INS_invasion_event_invader.GetAdjective] kontynuują natarcie w Indiach, mamy raczej niewielkie szanse uniknąć okupacji. Ponadto nasi szpiedzy informują, że [?event_target:INS_invasion_event_invader.GetLeader] prowadzi negocjacje z Sukarno i innymi nacjonalistycznymi przywódcami. Celem tych rozmów jest utworzenie indonezyjskiego państwa marionetkowego z Sukarno na czele, realizującym polecenia Strefy Wspólnego Dobrobytu."
 INS_political_events.13.a: "Aresztujemy nacjonalistów i będziemy bronić kraju aż do śmierci!"
 INS_political_events.13.b: "To niebezpieczne, ale może to realna szansa na uzyskanie niepodległości?"
 INS_peta_explain_tt: "Jeśli [JAP.GetAdjective] siły zostaną odparte, będziemy mogli wykorzystać chaos okupacji, by ogłosić całkowitą niepodległość."
 INS_peta_explain_tt_jap: "§RMożemy liczyć na lojalność [INS.GetAdjective] władz, ale jeśli zaczniemy tracić kontrolę nad terytorium, mogą zwrócić się przeciwko nam i [INS.GetName] ogłosi niepodległość§!."
 INS_political_events.14.t: "Aresztowano nacjonalistycznych przywódców"
 INS_political_events.14.desc: "Sukarno, wraz z innymi ważnymi indonezyjskimi rewolucjonistami, zostali zatrzymani przez holenderską żandarmerię, zanim zdążyli powołać marionetkowy reżim."
 INS_political_events.14.a: "Szkoda, byłby cennym sojusznikiem."
 INS_political_events.15.t: "Obrońcy ojczyzny"
 INS_political_events.15.desc: "Negocjacje z Sukarno zakończyły się, trwa tworzenie marionetkowego reżimu w Indonezji. Sukarno wykorzystał swoje koneksje oraz obecność naszych wojsk, by zdestabilizować holenderski rząd i uzyskać faktyczną kontrolę nad archipelagiem."
 INS_political_events.15.a: "Nie tylko pozyskaliśmy tanie zasoby, ale zdobyliśmy też cennego sojusznika."
 INS_political_events.16.t: "Okupacja Indii przez siły [?event_target:INS_invasion_event_invader.GetAdjective]"
 INS_political_events.16.desc: "Wojska [?event_target:INS_invasion_event_invader.GetAdjective] w Indiach współpracowały z indonezyjskimi nacjonalistami, by zdestabilizować naszą administrację kolonialną i rozpocząć pełną okupację Indii. Holenderskie flagi zostały opuszczone i zastąpione indonezyjskimi, a rdzenni mieszkańcy Indii wydają się akceptować [?event_target:INS_invasion_event_invader.GetAdjective] okupantów. To ponura perspektywa dla naszego kolonialnego imperium."
 INS_political_events.16.a: "Wygrali bitwę, ale jeszcze nie wygrali wojny."
 INS_political_events.17.t: "[INS.GetName] ogłasza niepodległość"
 INS_political_events.17.desc: "Do sztabu generalnego dotarły wieści z Batavii. Sukarno i jego klika, których sami wyznaczyliśmy do sprawowania rządów nad wyspami w imieniu cesarza, ogłosili powstanie [FROM.GetAdjective] republiki w odpowiedzi na nasze powtarzające się straty terytorialne. Wierzą, że nasze siły są zbyt rozproszone, abyśmy mogli podjąć przeciwko nim jakiekolwiek działania."
 INS_political_events.17.a: "Niestety, mogą mieć rację."
 INS_political_events.18.t: "Tan Malaka wraca do Indonezji"
 INS_political_events.18.desc: "Tan Malaka - indonezyjski komunista, który przez ostatnie lata pełnił funkcję zaufanego doradcy naszego rządu - ogłosił swoje natychmiastowe odejście. [INS.GetNameDef] to teraz wolna republika, więc zamierza powrócić w końcu do kraju, w którym ostatni raz przebywał jako uciekinier ponad dwie dekady temu. Dziękuje nam za udzielone schronienie i swobodę kontynuowania swojej działalności, dodając jedynie, że jego miejsce jest teraz w ojczyźnie."
 INS_political_events.18.a: "Życzymy mu szczęścia."
 INS_political_events.19.t: "[HOL.GetName] odwołuje admirała Helfricha"
 INS_political_events.19.desc: "[1058.GetName] otrzymuje wiadomość, że admirał Conrad Helfrich, dowódca naszych sił morskich i najzdolniejszy oficer, jakiego mamy na tych wodach, dostał rozkaz powrotu do kraju. Haga podaje jako powód pilne potrzeby w metropolii i nie udziela żadnych dalszych wyjaśnień. Jego wyjazd osłabia obronę archipelagu w momencie, gdy nasza pozycja w tym regionie jest daleka od stabilnej. W mesie oficerskiej w Surabai panują podobno ponure nastroje."
 INS_political_events.19.a: "To ponury dzień dla floty"
 ### INS - Industrial Events
 INS_industrial_events.4.t: "[FROM.FROM.GetName]: Realokacja budżetu"
 INS_industrial_events.4.desc: "[FROM.FROM.GetName]: Zamknięcie plantacji kauczuku sprawiło, że w naszym budżecie pojawiła się przestrzeń dla nowych projektów przemysłowych w tym regionie."
 INS_industrial_events.4.a: "[FROM.FROM.GetName]: Zbudujemy szyby naftowe."
 INS_industrial_events.4.b: "[FROM.FROM.GetName]: Powinniśmy zbudować hutę aluminium."
 INS_industrial_events.4.c: "Powinniśmy szukać zasobów, których jeszcze nie wytwarzamy."
 INS_industrial_events.4.d: "[FROM.FROM.GetName]: Możemy otworzyć kopalnie węgla."
 INS_industrial_events.5.t: "[INS_industrial_events_5_t_scripted]"
 INS_industrial_events_5_t_colonial: "Los De Javasche Bank"
 INS_industrial_events_5_t_independent: "Los Banku Indonezji"
 INS_industrial_events.5.desc: "[INS_industrial_events_5_desc_scripted]"
 INS_industrial_events_5_desc_colonial: "Rezerwy De Javasche Bank spadły do najniższego poziomu tej dekady. Gulden z każdym miesiącem traci na wartości, a właściciele plantacji domagają się płacenia im w obcej walucie. Nasi doradcy finansowi zgadzają się, że bank nie zdoła samodzielnie zatrzymać tego procesu, ale toczą ostre spory o to, jakie środki zaradcze należy podjąć."
 INS_industrial_events_5_desc_independent: "Bank Indonezji poinformował, że tylko w ostatnim kwartale rupia straciła jedną piątą swojej wartości. Handlarze ryżu z Surabai przestali ją przyjmować i chcą, by płacono im zagranicznymi banknotami. Nasz minister finansów twierdzi, że walutę da się uratować, ale tylko jeśli podejmiemy szybkie i zdecydowane działania."
 INS_industrial_events.5.a: "Powinniśmy dążyć do umocnienia guldena, zamiast go zastępować."
 INS_industrial_events.5.b: "Ustalimy stały kurs guldena indyjskiego do guldena holenderskiego."
 INS_industrial_events.5.c: "Ustalimy stały kurs guldena indyjskiego do dolara amerykańskiego."
 INS_industrial_events.6.t: "Korzystniejsza umowa"
 INS_industrial_events.6.desc: "Kinabureau zgadza się na nasze warunki. Malaria szaleje na połowie terenów tropikalnych, jak na razie nie widać substytutu dla chininy, więc nie mieli innego wyjścia. Nowa umowa gwarantuje nam znacznie większy udział w zyskach z każdego grama chininy, który opuści nasz kraj. Pozostaje pytanie, na co przeznaczymy te dodatkowe zyski."
 INS_industrial_events.6.a: "Zainwestujmy w nasze miasta"
 INS_industrial_events.6.b: "Inwestycje na wyspach zewnętrznych"
 INS_industrial_events.6.c: "Wzmocnimy nasz przemysł zbrojeniowy"
 # Rubber shipment dispatched
 INS_industrial_events.28.t: "Wysłano transport kauczuku"
 INS_industrial_events.28.desc: "Na konwoje załadowano resztę kauczuku, po czym wypłynęły w morze. Nasi odbiorcy otrzymają opłacony towar, a w naszych księgach w przewidzianym czasie pojawi się uzgodniona kwota. Przez kolejne dwa lata koszt tej transakcji będzie widniał w naszym bilansie, by przypominać, jak mamy działać w czasie kryzysu."
 INS_industrial_events.28.a: "Tak jest."
 INS_industrial_events.28.b: "Przygotować kolejną dostawę."
 # Oil shipment dispatched
 INS_industrial_events.36.t: "Wysłano transport ropy"
 INS_industrial_events.36.desc: "Tankowce wypłynęły z naszych rafinerii, zawartość ich ładowni dotrze do portów wskazanych przez odbiorców. Zapłata została uzgodniona, otrzymamy pełną kwotę, choć ta transakcja sprzedaży będzie ciążyła naszej gospodarce jeszcze przez dwa lata. Takie warunki proponuje świat w tych chudych latach."
 INS_industrial_events.36.a: "Tak jest."
 INS_industrial_events.36.b: "Przygotować kolejną dostawę."
 ### INS - Volksraad
 INS_volksraad_events.2.t: "[HOL.GetLeader] zawetował petycję Volksraadu"
 INS_volksraad_events.2.desc: "Choć [INS.GetLeader] zaakceptował petycję, została ona zawetowana po tym, jak zapoznał się z nią [HOL.GetLeader]. To uniemożliwia nam w tej chwili dalszą implementację."
 INS_volksraad_events.2.a: "Może w przyszłości spróbujemy przedłożyć ratyfikowaną petycję."
 # Generic/Reused
 INS_volksraad_events.10.t: "Wniosek Volksraadu o dopuszczenie w szkołach języka indonezyjskiego"
 INS_volksraad_events.10.desc: "[INS.GetLeader] zaakceptował petycję Volksraadu o utworzenie szkół i uczelni nauczających w języku indonezyjskim na terenie państwa [INS.GetAdjective] [HOL.GetLeader] otrzymał teraz petycję do ostatecznej akceptacji."
 INS_volksraad_events.10.a: "Volksraad spełnia swoją rolę."
 INS_volksraad_events.10.b: "Nie ma takiej możliwości. Weto!"
 INS_volksraad_events.11.t: "Edukacja będzie realizowana w języku indonezyjskim."
 INS_volksraad_events.11.desc: "[HOL.GetLeader] podpisał petycję, zatem uzyskała ona oficjalną akceptację. Wprowadzenie jej w życie ruszy niebawem, gdy tylko zostaną dopracowane ostatnie szczegóły."
 INS_volksraad_events.11.a: "Volksraad spełnia swoją rolę."
 # Individual laws
 INS_volksraad_events.20.t: "Wniosek Volksraadu o dopuszczenie języka indonezyjskiego w rządzie"
 INS_volksraad_events.20.desc: "Wszystkie stanowiska rządowe w Indiach, także w Volksraadzie, wymagają płynnej znajomości języka holenderskiego, przez co wielu członków tego ciała, szczególnie przedstawiciele rdzennych społeczności, podaje w wątpliwość demokratyczność tej instytucji. Przygotowali oni wniosek, w którym domagają się, by tam, gdzie jest to możliwe, na stanowiskach rządowych mogły pracować osoby posługujące się językiem indonezyjskim."
 INS_volksraad_events.21.t: "Język indonezyjski stał się językiem używanym w strukturach rządowych!"
 INS_volksraad_events.21.desc: "[HOL.GetLeader] podpisał petycję, zatem uzyskała ona oficjalną akceptację. Wprowadzenie jej w życie ruszy niebawem, gdy tylko zostaną dopracowane ostatnie szczegóły."
 INS_volksraad_events.30.t: "Wniosek Volksraadu o likwidację systemu limitów edukacyjnych"
 INS_volksraad_events.30.desc: "[INS.GetLeader] zaakceptował petycję Volksraadu o likwidację systemu limitów edukacyjnych na terytorium [INS.GetAdjective], co ma zakończyć wieloletnie spory toczące się w łonie Volksraadu w kwestii jego implementacji i uczciwości. [HOL.GetLeader] otrzymał teraz petycję do ostatecznej akceptacji."
 INS_volksraad_events.31.t: "System limitów edukacyjnych został zlikwidowany."
 INS_volksraad_events.31.desc: "[HOL.GetLeader] podpisał petycję, zatem uzyskała ona oficjalną akceptację. Wprowadzenie jej w życie ruszy niebawem, gdy tylko zostaną dopracowane ostatnie szczegóły."
 INS_volksraad_events.40.t: "Wniosek Volksraadu o zmniejszenie podatku eksportowego na kauczuk"
 INS_volksraad_events.40.desc: "[INS.GetLeader] podpisał i zaakceptował petycję Volksraadu o zmniejszenie wysokich podatków nakładanych na prywatne plantacje kauczuku. W przeszłości te podatki zapewniały rządowi niezwykle lukratywny monopol na ten surowiec, jednak protekcjonizm międzynarodowy uczynił ten system mniej dochodowym. [INS.GetLeader] stwierdził, że nie wierzy już, że podatki równoważą wywoływane przez nie skutki ekonomiczne."
 INS_volksraad_events.40.a: "[INS.GetLeader] ma rację."
 INS_volksraad_events.40.b: "Podatki zostają."
 INS_volksraad_events.41.t: "Podatek od eksportu kauczuku przez podmioty prywatne został zmniejszony."
 INS_volksraad_events.41.desc: "[HOL.GetLeader] podpisał petycję, zatem uzyskała ona oficjalną akceptację. Wprowadzenie jej w życie ruszy niebawem, gdy tylko zostaną dopracowane ostatnie szczegóły."
 INS_volksraad_events.60.t: "Wniosek Volksraadu o zniesienie niepisanego ograniczenia możliwości awansów dla indonezyjskich oficerów"
 INS_volksraad_events.60.desc: "[INS.GetLeader] zaakceptował petycję Volksraadu o zniesienie niepisanej zasady, która ogranicza rangę, jaką mogą osiągnąć nieholenderscy oficerowie KHAIW. Indonezyjscy oficerowie, których stopnie zostaną uznane za zbyt niskie jak na ich dokonania, otrzymają awanse. [HOL.GetLeader] otrzymał tę petycję do ostatecznej akceptacji."
 INS_volksraad_events.61.t: "Szklany sufit dla [INS.GetAdjective] generałów został zlikwidowany."
 INS_volksraad_events.61.desc: "[HOL.GetLeader] podpisał petycję, zatem uzyskała ona oficjalną akceptację. Wprowadzenie jej w życie ruszy niebawem, gdy tylko zostaną dopracowane ostatnie szczegóły."
 INS_volksraad_events.70.t: "Wniosek Volksraadu o legalizację publicznego prezentowania narodowych flag i symboliki"
 INS_volksraad_events.70.desc: "[INS.GetLeader] zaakceptował petycję Volksraadu o zniesienie ograniczeń prezentowania narodowych flag i symboliki w [INS.GetAdjective] miejscach publicznych, głównie w celu ograniczenia radykalizacji wielu młodych nacjonalistów. [INS.GetLeader] twierdzi, że w tej sprawie powinniśmy przyjąć postawę obronną, współpracować z pokojowo nastawionymi przywódcami nacjonalistów, a jednocześnie wykorzenić ruchy rewolucyjne w naszym kraju. Jednak ostateczna decyzja należy do nas."
 INS_volksraad_events.71.t: "Wywieszanie czerwono-białej flagi nie jest już nielegalne!"
 INS_volksraad_events.71.desc: "[HOL.GetLeader] podpisał petycję, zatem uzyskała ona oficjalną akceptację. Wprowadzenie jej w życie ruszy niebawem, gdy tylko zostaną dopracowane ostatnie szczegóły."
 INS_volksraad_events.100.t: "Wniosek Volksraadu o wprowadzenie subsydiów edukacyjnych dla nieholenderskich mieszkańców"
 INS_volksraad_events.100.desc: "[INS.GetLeader] zaakceptował petycję Volksraadu o umożliwienie nieholenderskim mieszkańcom państwa [INS.GetAdjective] ubiegania się o subsydia edukacyjne. [HOL.GetLeader] otrzymał teraz petycję do ostatecznej akceptacji."
 INS_volksraad_events.101.t: "Mieszkańcy [INS.GetAdjective] mogą teraz ubiegać się o subsydia edukacyjne"
 INS_volksraad_events.101.desc: "[HOL.GetLeader] podpisał petycję, zatem uzyskała ona oficjalną akceptację. Wprowadzenie jej w życie ruszy niebawem, gdy tylko zostaną dopracowane ostatnie szczegóły."
 ### INS - Dutch Interaction Events
 INS_dutch_events.1.t: "[INS.GetNameDefCap] zwraca się o przekazanie dowodzenia naszą marynarką wojenną"
 INS_dutch_events.1.desc: "Po upadku naszej ojczyzny, [INS.GetNameDef] zwraca się do nas o przekazanie im dowodzenia naszymi siłami morskimi. Twierdzą oni, że połączone dowództwo doprowadzi do poprawy koordynacji w tym wyjątkowym czasie."
 INS_dutch_events.1.a: "Jeżeli to wzmocni naszą sprawę, musimy się zgodzić."
 INS_dutch_events.1.b: "Nasze okręty będą wykonywać jedynie rozkazy płynące z Hagi."
 INS_dutch_events.2.t: "[HOL.GetNameDefCap] zgadza się na naszą propozycję dowodzenia marynarką wojenną"
 INS_dutch_events.2.desc: "[HOL.GetNameDefCap] zgadza się na naszą propozycję przekazania nam dowództwa nad połączonymi siłami morskimi naszych krajów. Zmiany przebiegają bez przeszkód, zarówno [HOL.GetAdjective], jak i [INS.GetAdjective] oficerowie współpracują, żeby wzmocnić naszą pozycję na Oceanie Spokojnym."
 INS_dutch_events.2.a: "Razem obronimy Ocean Spokojny!"
 INS_dutch_events.3.t: "[HOL.GetNameDefCap] odrzuca naszą propozycję dowodzenia marynarką wojenną"
 INS_dutch_events.3.desc: "[HOL.GetNameDefCap] odrzuca naszą propozycję wspólnego dowodzenia marynarką wojenną ze względu na problemy logistyczne i administracyjne. To rozczarowujące, ale wciąż współpracujemy na innych polach wysiłku wojennego."
 INS_dutch_events.3.a: "Znajdziemy jakiś inny sposób, by wzmocnić nasze wpływy w marynarce wojennej."
 INS_dutch_events.4.t: "[HOL.GetNameDefCap] tworzy [HOL.GetAdjective]-[INS.GetAdjective] program marynarki wojennej"
 INS_dutch_events.4.desc: "[HOL.GetNameDefCap] ogłasza stworzenie [HOL.GetAdjective]-[INS.GetAdjective] programu marynarki wojennej, czyli wspólnej inicjatywy, której celem jest reorganizacja i rozbudowa naszych sił morskich. Doświadczenie państwa [HOL.GetAdjective] i [INS.GetAdjective] pracownicy wspólnymi siłami stworzą fundament nowej sieci obronnej na Oceanie Spokojnym."
 INS_dutch_events.4.a: "To zdecydowany krok ku zapewnieniu przetrwania obu państw."
 ### INS - Netherlands–Indonesia Union Events
 INS_union_events.1.t: "[HOL.GetNameDefCap] domaga się przeniesienia rządu do: [1058.GetName]"
 INS_union_events.1.desc: "Po utracie ziem ojczystych [HOL.GetNameDef] informuje, że tamtejszy rząd i dwór królewski przeniosą się do: [1058.GetName]. Piszą o konieczności, ciągłości i potrzebie zachowania królestwa tam, gdzie jeszcze powiewa jego flaga."
 INS_union_events.1.a: "Wojna będzie kontynuowana z: [1058.GetName]."
 INS_union_events.1.b: "Za kogo oni się uważają? To nic więcej jak próba odzyskania kolonialnej dominacji!"
 INS_union_events.2.t: "[INS.GetNameDefCap] zgadza się na propozycję przeniesienia"
 INS_union_events.2.desc: "[INS.GetNameDefCap] zgadza się, by nasz rząd na uchodźstwie miał swoją siedzibę w: [1058.GetName]. Trwają przygotowania do przenosin, obie administracje koordynują integrację urzędów i pracowników. Razem poniesiemy pochodnię królestwa ze wschodu."
 INS_union_events.2.a: "Zjednoczony front przeciwko wspólnym wrogom."
 INS_union_events.3.t: "[INS.GetNameDefCap] odrzuca propozycję przeniesienia"
 INS_union_events.3.desc: "[INS.GetNameDefCap] stanowczo odmówiło zgody na przeniesienie naszego rządu do: [1058.GetName]. [INS.GetLeader] twierdzi, że nie mamy prawa domagać się takiego poziomu pomocy, skoro już teraz ma ogromne trudności."
 INS_union_events.3.a: "Chyba zapomnieli, jaki sztandar wciąż nas łączy."
 INS_union_events.4.t: "[HOL.GetNameDefCap] przenosi siły zbrojne do: [1058.GetName]"
 INS_union_events.4.desc: "Przybyły pierwsze transportowce z ojczyzny. Na ich pokładach znajdowało się wielu oficerów, żołnierzy i pozostałości naszych arsenałów. Zgodnie z przewidywaniami, część konwojów nie dotarła do portu. Wszystko, co ocalało, stanie się fundamentem naszych wojsk w: [1058.GetName]."
 INS_union_events.4.a: "To wystarczy, by nasza flaga wciąż dumnie powiewała."
 # INS proposed union
 INS_union_events.5.t: "[INS.GetNameDefCap] proponuje powołanie unii holendersko-indonezyjskiej"
 INS_union_events.5.desc: "Cały świat wie, że wojna nie toczy się po naszej myśli. Nasz kraj upadł, a nasza baza operacyjna została przeniesiona na wschód. Ministrowie rządu [INS.GetAdjective] przesłali nam propozycję zawarcia unii, na czele której miałaby stanąć królowa Wilhelmina, by zapewnić jak najściślejszą współpracę. Choć ta oferta nikomu nie przypadła do gustu, to może okazać się kluczem do naszego przetrwania."
 INS_union_events.5.a: "Musimy zaryzykować. Niech żyje królowa!"
 INS_union_events.5.b: "Nie możemy na to przystać."
 INS_union_events.6.t: "[HOL.GetNameDefCap] zgadza się na propozycję unii"
 INS_union_events.6.desc: "Po pilnym zebraniu rady gabinetowej [HOL.GetLeader] przyjął [INS.GetAdjective] propozycję. Dekret jest krótki i rzeczowy. Od tej chwili nasze rządy będą działać jako jedno ciało podległe koronie i tak będzie aż do zakończenia wojny."
 INS_union_events.6.a: "To historyczne porozumienie obu państw."
 INS_union_events.7.t: "[HOL.GetNameDefCap] odrzuca propozycję unii"
 INS_union_events.7.desc: "Rada gabinetowa państwa [HOL.GetAdjective] odrzuciła propozycję stworzenia unii. Odpowiedź naszych partnerów jest zdecydowana, współpraca będzie trwać, ale nikt nie zamierza dzielić się suwerennością."
 INS_union_events.7.a: "To i tak miało niewielkie szanse powodzenia."
 # HOL proposed union
 INS_union_events.8.t: "[HOL.GetNameDefCap] proponuje powołanie unii holendersko-indonezyjskiej"
 INS_union_events.8.desc: "Cały świat wie, że wojna nie toczy się po naszej myśli. Państwo [HOL.GetAdjective] upadło, a jego baza operacyjna została przeniesiona na wschód. Przywódcy [HOL.GetAdjective] przesłali nam propozycję zawarcia unii, na czele której miałaby stanąć królowa Wilhelmina, by zapewnić jak najściślejszą współpracę. Choć ta oferta nikomu nie przypadła do gustu, to może okazać się kluczem do naszego przetrwania."
 INS_union_events.8.a: "Trzeba to uczynić."
 INS_union_events.8.b: "To nic więcej jak próba odzyskania kolonialnej dominacji!"
 INS_union_events.9.t: "[INS.GetNameDefCap] zgadza się na propozycję unii"
 INS_union_events.9.desc: "[INS.GetNameDefCap] zgadza się na naszą propozycję. Trudno powiedzieć, do czego to doprowadzi, ale na razie skoncentrujmy się na wysiłku wojennym."
 INS_union_events.9.a: "Jeżeli mamy wytrwać, musimy działać razem."
 INS_union_events.10.t: "[INS.GetNameDefCap] odrzuca propozycję unii"
 INS_union_events.10.desc: "[INS.GetNameDefCap] odrzuca naszą propozycję unii. Obywatele [INS.GetAdjective] i przywódcy tego narodu uważają, że na dłuższą metę taki projekt nie przyniesie niczego dobrego, dlatego nie zamierzają dzielić się władzą."
 INS_union_events.10.a: "To i tak miało niewielkie szanse powodzenia."
 # Flags
 INS_exile_accepted_flag: "Gości rząd [HOL.GetAdjective] na uchodźstwie"
 INS_hey_btw_you_are_gonna_die_just_know_that_yeah_tt: "§RTo spowoduje zakończenie twojej gry.§!"
 # Revolution events
 INS_revolution_events.1.t: "[HOL.GetNameDefCap] rozpoczyna niszczenie republiki"
 INS_revolution_events.1.desc: "Zgodnie z przewidywaniami, rząd holenderski zareagował na nasze żądanie niepodległości wysłaniem żołnierzy do regionu [1058.GetName] oraz rozpowszechnianiem w mediach antyrepublikańskiej propagandy."
 INS_revolution_events.1.a: "Musimy szybko działać."
 INS_revolution_events.2.t: "[HOL.GetNameDefCap] prosi o dodatkową pomoc"
 INS_revolution_events.2.desc: "[HOL.GetLeader] zwołał pilne spotkanie z naszymi przywódcami, na którym zwrócił się o dalszą pomoc w ponownym podboju Indii, chce nawet, byśmy dołączyli do tego konfliktu. [HOL.GetLeader] stwierdził, że sytuacja jest dramatyczna, a wojska holenderskie nie są w stanie odeprzeć milicji rewolucjonistów. [HOL.GetLeader] obiecuje, że za naszą pomoc otrzymamy Borneo."
 INS_revolution_events.2.a: "Zrobimy to dla Borneo."
 INS_revolution_events.2.b: "Nie jesteśmy zainteresowani."
 INS_revolution_events.3.t: "[ENG.GetNameDefCap] zgadza się na porozumienie Londyn-Batavia"
 INS_revolution_events.3.desc: "[ENG.GetNameDefCap] zgadza się bezpośrednio dołączyć do konfliktu, wyśle kilka dywizji, które będą walczyć w Batavii. Będziemy musieli oddać Borneo, ale dzięki temu przechylimy szalę na naszą stronę."
 INS_revolution_events.3.a: "Borneo to konieczne poświęcenie."
 INS_revolution_events.4.t: "[ENG.GetNameDefCap] odrzuca porozumienie Londyn-Batavia"
 INS_revolution_events.4.desc: "[ENG.GetNameDefCap] odmawia udzielenia dalszej pomocy w konflikcie, choć to pilna potrzeba i zaproponowaliśmy nagrodę. [ENG.GetLeader] twierdzi, że przetrwanie naszego imperium kolonialnego leży w ich najlepszym interesie, ale ryzyko globalnej eskalacji spowodowanej ich zaangażowaniem jest zbyt duże, zatem musimy poradzić sobie sami."
 INS_revolution_events.4.a: "Źle to wygląda."
 INS_revolution_events.5.t: "[HOL.GetNameDefCap] zwraca się do nas o pomoc"
 INS_revolution_events.5.desc: "Rewolucjoniści w Holenderskich Indiach Wschodnich ogłosili niepodległość od państwa [HOL.GetAdjective] i zajęli większe miasta. [HOL.GetLeader] zwrócił się do nas o pilną pomoc militarną w przygotowaniach do inwazji."
 INS_revolution_events.5.a: "Jeżeli rewolucjoniści zwyciężą, mieszkańcy naszych kolonii mogą zechcieć pójść w ich ślady."
 INS_revolution_events.5.b: "Nie jesteśmy zainteresowani."
 INS_revolution_events.6.t: "[ENG.GetNameDefCap] zgadza się nam pomóc"
 INS_revolution_events.6.desc: "[ENG.GetNameDefCap] zgadza się wysłać żołnierzy ochotników i wyposażenie do regionu [1058.GetName], by pomóc nam odzyskać kontrolę nad Indiami."
 INS_revolution_events.6.a: "To będzie proste."
 INS_revolution_events.7.t: "[ENG.GetNameDefCap] odmawia udzielenia nam pomocy"
 INS_revolution_events.7.desc: "[ENG.GetNameDefCap] odmawia udzielenia nam pomocy w odzyskaniu kontroli nad Indiami. Twierdzą, że Indie to nie ich zmartwienia, choć konflikt toczy się blisko nich. Musimy samodzielnie dokonać przezbrojenia KHAIW."
 INS_revolution_events.7.a: "To niedopuszczalne!"
 INS_revolution_events.8.t: "Milicje rewolucyjne spiskują w Indiach"
 INS_revolution_events.8.desc: "Nasza policja kolonialna w Indiach Wschodnich aresztowała i przesłuchała licznych członków ruchu rewolucyjnego rodzącego się w Indonezji. Wygląda na to, że zamierzają rozmieścić tam wojska w ramach przygotowań do kampanii odzyskania niepodległości. Jeszcze nie mamy pewności, ale możliwe, że planują zbrojną rewolucję."
 INS_revolution_events.8.a: "Musimy uważnie obserwować sytuację."
 INS_revolution_events.9.t: "Indonezyjska Deklaracja Niepodległości"
 INS_revolution_events.9.desc: "[INS.GetLeader] wygłosił dziś na Jawie przemówienie, w którym ogłosił niepodległość nowo powstałej Republiki Idnonezji. Nie uznajemy tego nowego państwa, ale jego milicje zajęły część terytoriów, a nasza policja nie jest w stanie nimi zarządzać. Jeżeli nie podejdziemy do tego poważnie, może wybuchnąć otwarta wojna."
 INS_revolution_events.9.a: "To niedopuszczalne!"
 INS_revolution_events.9.b: "Szkoda energii. Jeśli tak bardzo chcą niepodległości, to ją dostaną."
 #INS_revolution_events.10.t: ""
 #INS_revolution_events.10.desc: ""
 #INS_revolution_events.10.a: ""
 INS_revolution_events.11.t: "Indyjskie siły zbrojne zatrzymały kampanię milicji"
 INS_revolution_events.11.desc: "Republikańskie milicje przeprowadziły operację militarną mającą na celu zajęcie regionu [?event_target:INS_temp_occupied_state.GetName]. Nasi dzielni żołnierze w Indiach z powodzeniem odparli atak, wciąż całkowicie panujemy nad tym terenem."
 INS_revolution_events.11.a: "[HOL.GetNameDef] odnosi kolejne zwycięstwo."
 INS_revolution_events.12.t: "Milicje próbują zająć region [?event_target:INS_temp_occupied_state.GetName]"
 INS_revolution_events.12.desc: "Republikańskie bojówki przeprowadziły operację militarną, której celem było zajęcie regionu [?event_target:INS_temp_occupied_state.GetName]. Naszej policji i żołnierzom udało się w końcu opanować sytuację, ale mimo to doszło tam do niepokojów. Wielu cywili popiera milicje i publicznie krytykuje rząd [HOL.GetAdjective]"
 INS_revolution_events.12.a: "Nie możemy dopuścić do eskalacji."
 INS_revolution_events.14.t: "Milicje zajęły region [?event_target:INS_temp_occupied_state.GetName]"
 INS_revolution_events.14.desc: "Mimo usilnych starań naszej policji kolonialnej i wojska, milicje republikańskie przeprowadziły udaną operację militarną i zajęły region [?event_target:INS_temp_occupied_state.GetName]. Nasze siły musiały się wycofać, a z uwagi na działania bojówek zarządzanie tym terytorium stało się niemożliwe. Jeżeli nie ukrócimy poczynań buntowników, możemy na zawsze utracić naszą wielką kolonię."
 INS_revolution_events.14.a: "To oburzające!"
 INS_revolution_no_effect_tt: "Brak efektów"
 INS_revolution_events.19.t: "Negocjacje pokojowe w Indiach"
 INS_revolution_events.19.desc: "[HOL.GetLeader] i [INS.GetLeader] spotkali się, aby omówić ewentualne porozumienie pokojowe. [INS.GetLeader] stwierdził, że zginęło zbyt wielu ludzi, i zaproponował trwałe wstrzymanie walk oraz utworzenie dwóch państw z granicami w nieznacznie zmienionym obecnym kształcie."
 INS_revolution_events.19.a: "Musimy się zgodzić. Zginęło zbyt wielu ludzi."
 INS_revolution_events.19.b: "Jeśli tak bardzo chcecie pokoju, możecie się poddać!"
 INS_revolution_events.20.t: "[HOL.GetNameDefCap] zgadza się na utworzenie dwóch państw!"
 INS_revolution_events.20.desc: "[INS.GetLeader] i [HOL.GetLeader] zakończyli spotkanie, po którym ogłoszono dobre wieści. Obie strony zgodziły się na utworzenie dwóch państw, zatem niezwłocznie zaczynamy przemieszczanie wojsk na terytoria odpowiadające nowym granicom. Nikomu nie podoba się, że musieliśmy porzucić część Indonezyjczyków, ale decyzja o zakończeniu walk jest korzystna dla wszystkich."
 INS_revolution_events.20.a: "Wreszcie zakończy się rozlew krwi."
 INS_revolution_events.21.t: "[HOL.GetNameDefCap] odmawia przerwania walk"
 INS_revolution_events.21.desc: "Spotkanie, które odbyli [INS.GetLeader] i [HOL.GetLeader] nie potoczyło się zgodnie z planem, złość obu stron była widoczna i nie udało im się osiągnąć kompromisu, a spotkanie zakończyło się przedwcześnie."
 INS_revolution_events.21.a: "Jak wielu ludzi musi jeszcze zginąć?"
 INS_revolution_events.22.t: "[HOL.GetNameDefCap] zwraca się do nas o pomoc"
 INS_revolution_events.22.desc: "[HOL.GetLeader] i [FRA.GetLeader] spotkali się w Amsterdamie, żeby omówić sytuację w Indiach. Podczas spotkania [HOL.GetLeader] wyjaśnił, że rewolucjoniści zaczęli dozbrajać milicję w tempie, za którym nie nadąża armia holenderska, przez co [HOL.GetNameDef] może utracić status kolonialnego hegemona. Dlatego domaga się, abyśmy włączyli się w ten konflikt po stronie Holendrów i wysłali do Batavii dywizje, które pomogą w odzyskaniu Indii. W zamian, po przywróceniu porządku, otrzymalibyśmy północno-wschodnią Sumatrę."
 INS_revolution_events.22.a: "Pomaganie będzie drogie, ale warto to zrobić za Sumatrę."
 INS_revolution_events.22.b: "Proszą nas o zbyt wiele."
 INS_revolution_events.23.t: "[FRA.GetNameDefCap] zgadza się nam pomóc!"
 INS_revolution_events.23.desc: "[FRA.GetNameDefCap] odpowiada na nasze wezwanie o pomoc i niezwłocznie wyśle do Batavii wiele francuskich dywizji."
 INS_revolution_events.23.a: "Teraz szala przechyliła się na naszą korzyść."
 INS_revolution_events.24.t: "[FRA.GetNameDefCap] odmawia pomocy."
 INS_revolution_events.24.desc: "[FRA.GetNameDefCap] odmawia nam wsparcia w kwestii rewolucji, choć to paląca kwestia. Musimy błyskawicznie zacząć zbrojenia, w przeciwnym razie przeciwnik zyska przewagę liczebną."
 INS_revolution_events.24.a: "Źle to wygląda."
 INS_revolution_events.25.t: "Koniec wojny w Indonezji."
 INS_revolution_events.25.desc: "Wojska [HOL.GetAdjective] zniszczyły duże bazy milicji i obaliły rząd republikański. Elity i dowódcy republikanów zostali aresztowani, a indyjskie władze powróciły do zarządzania dawnym terytorium republikańskim. Zgodnie z obietnicą otrzymamy uzgodnione terytorium w zamian za nasz wkład."
 INS_revolution_events.25.a: "Wspaniale!"
 INS_revolution_events.26.t: "Koniec wojny w Indonezji."
 INS_revolution_events.26.desc: "Wojska [HOL.GetAdjective] i milicje republikańskie walczą ze sobą dłużej, niż zakładały obie strony, dlatego [HOL.GetLeader] zgadza się podpisać porozumienie pokojowe zakładające utworzenie dwóch państw. A ponieważ dotrzymaliśmy naszej umowy, [HOL.GetLeader] potwierdza, że otrzymamy obiecane nam terytorium."
 INS_revolution_events.26.a: "Ciekawy rozwój wypadków."
 INS_revolution_events.27.t: "Koniec wojny w Indonezji."
 INS_revolution_events.27.desc: "Wojska [HOL.GetAdjective] i milicje republikańskie walczą ze sobą dłużej, niż zakładały obie strony, mimo [HOL.GetAdjective] wysiłków i naszego zaangażowania militarnego. Sama liczebność sił milicji oraz partyzancki charakter tej armii sprawiły, że doszło do pata, który daje dużo większe korzyści republikanom. Dlatego [HOL.GetLeader] decyduje się na podpisanie porozumienia pokojowego, które doprowadzi do powstania dwóch państw zgodnie z celami republikanów. Po Indiach pozostanie jedynie cień ich dawnej chwały. [HOL.GetLeader] twierdzi, że skoro konflikt zakończył się porażką, nie może nam przekazać terytorium obiecanego w zamian za nasz wkład militarny."
 INS_revolution_events.27.a: "To szaleństwo!"
 INS_revolution_events.28.t: "Upadek Indii"
 INS_revolution_events.28.desc: "Mimo ogromnych wydatków zbrojeniowych rządu [HOL.GetAdjective] oraz naszego bezpośredniego zaangażowania w ten konflikt, sama liczebność milicji w Indiach wystarczyła, by pokonać nasze siły i zająć wszystkie duże miasta. Administracja holenderska została obalona i zmuszona do kapitulacji."
 INS_revolution_events.28.a: "Ale obiecano nam terytorium!"
 INS_revolution_events.29.t: "Upadek Indii"
 INS_revolution_events.29.desc: "Mimo naszych usilnych starań, rewolucjoniści w Indiach przejęli kontrolę nad naszymi dużymi miastami i od środka zniszczyli rząd kolonialny. Nasi generałowie trafili do niewoli, a łączność została zerwana. Nie pozostaje nam nic innego, jak pogodzić się z porażką."
 INS_revolution_events.29.a: "Co za tragedia."
 INS_revolution_events.30.t: "[INS.GetLeader] proponuje lokalne zawieszenie broni"
 INS_revolution_events.30.desc: "[INS.GetLeader] proponuje zawieszenie broni w: [FROM.GetName]. Obiecuje wycofać swoje wojska z [FROM.GetAdjective] terytorium, jeśli się zgodzimy, dzięki czemu nasze siły odzyskają kontrolę nad regionem. Jednak stanie się to pod warunkiem, że tymczasowo opóźnimy nasze operacje militarne i damy rewolucjonistom czas na planowanie działań."
 INS_revolution_events.30.a: "Zgodzimy się na to."
 INS_revolution_events.30.b: "Odmawiamy, użyjemy siły i [FROM.GetName] wróci do nas!"
 INS_revolution_events.31.t: "[HOL.GetNameDefCap] zgadza się na rozejm z [FROM.GetName]"
 INS_revolution_events.31.desc: "Negocjacje w sprawie rozejmu były udane, [HOL.GetLeader] zgadza się na nasze warunki. Dowódcy milicji na terytorium [FROM.GetAdjective] otrzymali rozkazy natychmiastowego wycofania swoich sił."
 INS_revolution_events.31.a: "Oby dotrzymali swojej części umowy."
 INS_revolution_events.32.t: "[HOL.GetNameDefCap] odmawia zawarcia rozejmu"
 INS_revolution_events.32.desc: "Negocjacje w sprawie rozejmu nie potoczyły się zgodnie z planem, [HOL.GetLeader] odmawia podpisania porozumienia i zrywa rozmowy, nie osiągnąwszy kompromisu."
 INS_revolution_events.32.a: "To niedopuszczalne!"
 INS_revolution_events.33.t: "[INS.GetNameDefCap] domaga się mediacji"
 INS_revolution_events.33.desc: "Indonezyjscy republikanie zwrócili się do nas oficjalnie o pomoc w uzgodnieniu porozumienia z Holendrami. Nasi doradcy w tym regionie informują, że sytuacja błyskawicznie się pogarsza, a dalsze działania wojsk holenderskich mogą wepchnąć nacjonalistów w objęcia Rosjan. Holandia to cenny sojusznik w Europie, ale nie możemy lekceważyć rzeczywistości politycznej w Azji Połudiowo-Wschodniej. Jeżeli przez naszą bierność Indonezja padnie łupem komunizmu, wina spadnie na nas."
 INS_revolution_events.33.a: "Wyślijmy mediatorów."
 INS_revolution_events.33.b: "Nie możemy narażać naszych relacji z Holendrami."
 INS_revolution_events.34.t: "Rząd [FROM.GetAdjective] zgadza się na mediacje"
 INS_revolution_events.34.desc: "Waszyngton zgodził się poprowadzić mediacje pomiędzy naszym i holenderskim rządem. Amerykańscy wysłannicy są w drodze, przedstawiono już formalną propozycję rozejmu. To wielka okazja. Ponieważ największe mocarstwo świata wspiera negocjacje, Holendrom będzie o wiele trudniej grać na zwłokę lub uciec się do użycia siły. Musimy przyjąć twardą postawę przy stole negocjacyjnym i pozwolić Amerykanom robić to, co najlepiej potrafią."
 INS_revolution_events.34.a: "Miejmy nadzieję, że Holendrzy posłuchają rozsądku."
 INS_revolution_events.35.t: "[USA.GetNameDefCap] ogłasza mediacje"
 INS_revolution_events.35.desc: "Amerykanie zainteresowali się sprawą Indonezji. Waszyngton twierdzi, że pełni rolę bezstronnego mediatora, ale implikacje są oczywiste. Jeżeli nie rozstrzygniemy tego konfliktu po ich myśli, wykorzystają swoją ogromną przewagę nad nami. Nasi negocjatorzy muszą działać ostrożnie. Nie możemy sobie pozwolić na utratę dobrej woli Amerykanów."
 INS_revolution_events.35.a: "Rozstrzygniemy to na własnych warunkach."
 INS_revolution_events.36.t: "[FROM.GetNameDefCap] odmawia interwencji"
 INS_revolution_events.36.desc: "Amerykanie odrzucili nasz wniosek o mediacje. Waszyngton postanowił opowiedzieć się po stronie swoich europejskich sojuszników, zamiast wesprzeć nas w walce o samostanowienie. Zostaliśmy sami. To ogromny cios, lecz rewolucja wybuchła nie dlatego, że spodziewaliśmy się pomocy obcych mocarstw w walce o naszą wolność."
 INS_revolution_events.36.a: "Wygramy tę wojnę bez nich."
 INS_revolution_events.37.t: "[USA.GetNameDefCap] stawia ultimatum"
 INS_revolution_events.37.desc: "Amerykanie stracili cierpliwość. Waszyngton przedstawił ultimatum, w którym domaga się niezwłocznego wstrzymania wszelkich działań zbrojnych w Indonezji oraz uznania indonezyjskiej suwerenności. Groźba jest ledwie zawoalowana. Nasza pozycja na scenie międzynarodowej nie przetrwa publicznego zerwania stosunków z Amerykanami, a naszej gospodarki nie stać na skutki takiego zdarzenia. Nasi generałowie twierdzą, że wciąż możemy wygrać tę kampanię, ale jakim kosztem?"
 INS_revolution_events.37.a: "Nie mamy wyboru, musimy się ugiąć."
 INS_revolution_events.37.b: "Indonezja należy do nas. Nie ugniemy się."
 INS_revolution_events.38.t: "Holendrzy ustępują"
 INS_revolution_events.38.desc: "To koniec. Rząd holenderski zaakceptował amerykańskie ultimatum i uznał naszą suwerenność. Trzysta pięćdziesiąt lat rządów kolonialnych zakończyło się nie tylko na polu bitwy, ale także przy stole negocjacyjnym, gdzie wsparło nas najpotężniejsze mocarstwo świata. Republika jest wreszcie nasza."
 INS_revolution_events.38.a: "Merdeka!"
 INS_revolution_events.39.t: "Holendrzy odmawiają"
 INS_revolution_events.39.desc: "Wbrew wszelkim oczekiwaniom, Holendrzy odrzucili amerykańskie ultimatum. Ich generałowie muszą wierzyć, że zdołają wygrać tę wojnę, zanim Waszyngton zacznie działać. Mylą się. Teraz Amerykanie otwarcie opowiadają się po naszej stronie, zatem równowaga sił uległa potężnej zmianie. Niech atakują. Już nie walczymy sami."
 INS_revolution_events.39.a: "Świat stanął u naszego boku."
 INS_revolution_events.40.t: "Holendrzy przystają na nasze warunki"
 INS_revolution_events.40.desc: "Haga zaakceptowała nasze ultimatum. Wojska holenderskie wycofają się z Indonezji, a republika indonezyjska uzyska suwerenność. To zadowalające zakończenie tego niefortunnego epizodu. Nasze interesy w tym regionie są teraz o wiele lepiej obsługiwane przez stabilną, niepodległą Indonezję, a nie opierają się na kolonialnym przedsięwzięciu, nad którym Holendrzy przestali panować."
 INS_revolution_events.40.a: "To rozsądne zakończenie."
 INS_revolution_events.41.t: "Holendrzy sprzeciwili się nam"
 INS_revolution_events.41.desc: "Haga błyskawicznie odrzuciła nasze ultimatum. Wojska holenderskie w Indonezji kontynuują działania, wbrew amerykańskim żądaniom. To ogromny błąd. Holandia nie może jednocześnie prowadzić wojny kolonialnej w Azji i być zależną od pomocy amerykańskiej w Europie. Zmusili nas do działania."
 INS_revolution_events.41.a: "Niech tak będzie."
 INS_revolution_events.42.t: "Ostatni rzut kośćmi"
 INS_revolution_events.42.desc: "Nasze służby wywiadowcze działające w Batavii meldują, że wróg prowadzi przygotowania, jakich jeszcze nie widzieliśmy u republikanów. Prawdopodobnie szykują się do przeprowadzenia operacji destabilizacyjnej w postaci uderzenia na Jawę i zniszczenia naszej infrastruktury łączności, czym zagwarantują sobie zwycięstwo. Jednak to niezwykle ryzykowna operacja wymagająca, by przeznaczyli na nią całe swoje zasoby. Nasi generałowie szacują, że wrogowie zdołają utrzymać te pozycje przez około dwa lata i trudno im będzie się z nich wycofać. Jeżeli zatrzymamy ich dostatecznie długo, będziemy mogli zmiażdżyć ich rząd i rewolucję niczym przejrzałego pomidora."
 INS_revolution_events.42.a: "To początek ostatecznej bitwy."
 INS_revolution_events.43.t: "Utworzono bazę milicji w: [FROM.GetName]"
 INS_revolution_events.43.desc: "[FROM.GetName]: nasze starania przyniosły owoce, a przywódcy lokalnej milicji potwierdzili, że są gotowi do działania w razie potrzeby."
 INS_revolution_events.43.a: "Musimy starać się dalej."
 # Chaos Events
 INS_chaos_events.1.t: "Bitwa w Surabai"
 INS_chaos_events.1.desc: "Po ogłoszeniu niepodległości doszło do destabilizacji władzy w Surabai. Dziś grupa holenderskich lojalistów rozwiesiła dawną flagę kolonialną na dachu dawnego hotelu Yamato. Miejscowi pemuda wdarli się do budynku, zdjęli ją i zastąpili czerwono-białą flagą Indonezji. Incydent ten przerodził się w brutalne, chaotyczne starcia."
 INS_chaos_events.1.a: "Słusznie postąpili!"
 INS_chaos_events.1.b: "Rozkażmy wstrzymanie ognia, nie możemy ryzykować eskalacji."
 INS_chaos_events.2.t: "Połączenie partii socjalistycznych"
 INS_chaos_events.2.desc: "Dwie największe indonezyjskie partie socjalistyczne, kierowane przez Amira Sjarifuddina i Sutana Sjahrira, ogłosiły dziś swoje połączenie. W ten sposób powstała zjednoczona Partia Socjalistyczna Indonezji. To znacznie zwiększy jej polityczne wpływy oraz może zagrozić naszej administracji."
 INS_chaos_events.2.a: "Zezwólmy im na to."
 INS_chaos_events.2.b: "Nie ma czasu na politykę, wprowadźmy stan wojenny!"
 INS_chaos_events.3.t: "Nieudany zamach na życie Sukarno"
 INS_chaos_events.3.desc: "Dziś doszło do zamachu na życie Sukarno, holenderski żołnierz ostrzelał jego samochód. Na szczęście Sukarno nie było w pojeździe, jednak szofer odniósł poważne rany. Ta próba nie powiodła się, ale z pewnością będą kolejne, zarówno ze strony żołnierzy holenderskich, jak i indonezyjskiej opozycji."
 INS_chaos_events.3.a: "Musimy zaprowadzić porządek!"
 INS_chaos_events.4.t: "Zabójstwo Sukarno"
 INS_chaos_events.4.desc: "Indonezję dotknęła dziś tragedia. Doszło do kolejnego zamachu na Sukarno, tym razem udanego. Nie możemy pozwolić, by doszło przez to kryzysu sukcesji - jeśli szybko nie zaprowadzimy porządku, republika upadnie."
 INS_chaos_events.4.a: "Wiceprezydent Hatta przejmie władzę."
 INS_chaos_events.4.b: "Partia Socjalistyczna przejmie władzę."
 INS_chaos_events.4.c: "Zlikwidujmy republikę, Tan Malaka poprowadzi nas do zwycięstwa!"
 # Loyalist Events
 INS_loyalist_events.1.t: "[INS.GetLeader] domaga się przeniesienia Henriego Winkelmana"
 INS_loyalist_events.1.desc: "[INS.GetLeader] skontaktował się z nami w sprawie konfliktów trwających na świecie oraz niebezpiecznej sytuacji, w jakiej znajduje się [INS.GetNameDef]. [INS.GetLeader] proponuje, aby Henri Winkelman, były dowódca Królewskiej Holenderskiej Armii Indii Wschodnich, został formalnie przeniesiony z powrotem do [INS.GetNameDef], gdzie miałby zająć się bezpieczeństwem kolonii."
 INS_loyalist_events.1.a: "Zlecimy jego niezwłoczne przeniesienie."
 INS_loyalist_events.1.b: "Henri Winkelman jest potrzebny w ojczyźnie."
 INS_loyalist_events.2.t: "[HOL.GetLeader] zgadza się na przeniesienie Henriego Winkelmana."
 INS_loyalist_events.2.desc: "[INS.GetLeader] powrócił z [HOL.GetNameDef], gdzie przyjął go [HOL.GetLeader]. Spotkanie było udane, [HOL.GetLeader] wyraził zrozumienie i zgodził się na niezwłoczne przeniesienie Winkelmana. Henri Winkelman jest w drodze do regionu [1058.GetName], gdzie będzie czekał na nasze polecenia."
 INS_loyalist_events.2.a: "Bardzo nam to pomoże."
 INS_loyalist_events.3.t: "[HOL.GetLeader] odmawia przeniesienia Henriego Winkelmana."
 INS_loyalist_events.3.desc: "[INS.GetLeader] powrócił z [HOL.GetNameDef], gdzie przyjął go [HOL.GetLeader]. Niestety, Henri Winkelman nie zostanie wysłany do Indii, musimy bronić się bez niego."
 INS_loyalist_events.3.a: "Musimy jak najszybciej opracować nowy plan."
 INS_henri_winkelman_tt: "Odmowa przeniesienia Henriego Winkelmana"
 # MALAYA CHAIN - Independent Malaya
 INS_loyalist_events.4.t: "[FROM.GetNameDefCap] proponuje zjednoczenie."
 INS_loyalist_events.4.desc: "[ROOT.Capital.GetCapitalVictoryPointName]: Delegacja [FROM.GetAdjective] przybyła z propozycją zjednoczenia. Jej członkowie wskazują na wspólne dziedzictwo malajskie naszych ludów oraz na fakt, że granice między naszymi krajami zostały wytyczone przez europejskich administratorów kolonialnych, a nie przez ludzi zamieszkujących te ziemie. Według tej propozycji oba nasze rządy zostałyby rozwiązane i zreformowane w ramach jednego państwa."
 INS_loyalist_events.4.a: "Przyjmujemy tę propozycję."
 INS_loyalist_events.4.b: "Musimy odmówić."
 INS_loyalist_events.5.t: "[FROM.GetNameDefCap] zgadza się na zjednoczenie"
 INS_loyalist_events.5.desc: "Nasi dyplomaci wrócili z [FROM.Capital.GetCapitalVictoryPointName] z doskonałymi wieściami. Rząd [FROM.GetAdjective] zaakceptował naszą propozycję, a jego urzędnicy już rozpoczęli przygotowania do integracji ich terytoriów z naszą administracją."
 INS_loyalist_events.5.a: "Razem jesteśmy silniejsi!"
 INS_loyalist_events.6.t: "[FROM.GetNameDefCap] odmawia zjednoczenia"
 INS_loyalist_events.6.desc: "Nasi dyplomaci wrócili z [FROM.Capital.GetCapitalVictoryPointName] z pustymi rękami. Rząd [FROM.GetAdjective] nie przystał na naszą propozycję. Podano niewiele powodów tej decyzji, a nasi dyplomaci wrócili do ojczyzny po zwyczajowej wymianie uprzejmości."
 INS_loyalist_events.6.a: "Ich strata."
 # MALAYA CHAIN - Subject Malaya (Overlord receives)
 INS_loyalist_events.7.t: "[FROM.GetNameDefCap] domaga się referendum w: [MAL.GetName]"
 INS_loyalist_events.7.desc: "[FROM.GetNameDefCap] zwraca się z oficjalnym wnioskiem o zezwolenie na organizację referendum w: [MAL.GetName]. Miało by ono dotyczyć zjednoczenia z ich państwem. Ich ambasador otwarcie wyraził swoje zdanie o prawdopodobnym wyniku takiego plebiscytu: ludy Malajów po obu stronach uważają się za jeden naród. Zezwolenie na referendum praktycznie na pewno oznaczałoby utratę: [MAL.GetName]."
 INS_loyalist_events.7.a: "Niech lud zdecyduje."
 INS_loyalist_events.7.b: "Nie pozwolimy na to."
 # MALAYA CHAIN - Subject Malaya (MAL receives after overlord agrees)
 INS_loyalist_events.8.t: "[FROM.GetNameDefCap] zgadza się na referendum w sprawie zjednoczenia"
 INS_loyalist_events.8.desc: "Nasz władca zezwolił na przeprowadzenie w naszym kraju referendum przez: [FROM.FROM.GetNameDef]. Działacze [FROM.FROM.GetAdjective] przybyli licznie, a głosowanie odbędzie się w ciągu miesiąca. Pytanie do naszych obywateli jest proste. Czy chcemy dołączyć do [FROM.FROM.GetNameDef], czy wolimy niczego nie zmieniać?"
 INS_loyalist_events.8.a: "Dołączymy do nich."
 INS_loyalist_events.8.b: "Wolelibyśmy zostać."
 # MALAYA CHAIN - Overlord informed of MAL's choice
 INS_loyalist_events.9.t: "[FROM.GetNameDefCap] głosuje przeciwko zjednoczeniu"
 INS_loyalist_events.9.desc: "[FROM.GetName]: Referendum dobiegło końca. Obywatele [FROM.GetAdjective] zagłosowali za pozostaniem pod naszą władzą. Działacze [FROM.FROM.GetAdjective] wyjechali."
 INS_loyalist_events.9.a: "Można było się tego spodziewać."
 INS_loyalist_events.10.t: "[FROM.GetNameDefCap] głosuje za zjednoczeniem"
 INS_loyalist_events.10.desc: "[FROM.GetName]: Referendum zakończyło się zdecydowanym poparciem zjednoczenia z [FROM.FROM.GetNameDef]. Nasi administratorzy w tym regionie donoszą, że spodziewano się takiego wyniku. Jesteśmy zobowiązani uszanować wynik tego plebiscytu."
 INS_loyalist_events.10.a: "Daliśmy słowo."
 # MALAYA CHAIN - INS receives result
 INS_loyalist_events.11.t: "Sukces malajskiego referendum"
 INS_loyalist_events.11.desc: "Obywatele [MAL.GetAdjective] zagłosowali za połączeniem z naszym krajem. Urzędnicy [MAL.GetAdjective] współpracują z naszą administracją przy przekazywaniu władzy. Z mapy malajskiego świata zniknie jedna granica."
 INS_loyalist_events.11.a: "Witajcie w domu."
 INS_loyalist_events.12.t: "Odmowa zjednoczenia Malajów"
 INS_loyalist_events.12.desc: "Nasza propozycja zjednoczenia z państwem [MAL.GetAdjective] została odrzucona. Władze [MAL.GetAdjective] albo ich zwierzchnicy postanowili odmówić połączenia. Wrócimy do tej sprawy w bardziej dogodnym czasie."
 INS_loyalist_events.12.a: "Nie zapomnimy im tego."
 INS_loyalist_events.13.t: "[FROM.GetNameDefCap] proponuje kompromis w sprawie Singapuru"
 INS_loyalist_events.13.desc: "Rząd [FROM.GetAdjective] przedstawił nam propozycję dotyczącą Singapuru. Domagają się suwerenności swojej wyspy i powołują się na należne jej miejsce w świecie Malajów. W zamian są gotowi zagwarantować nam stały dostęp do portu, obiektów wojskowych i utrzymania obowiązujących praw do pozyskiwania zasobów."
 INS_loyalist_events.13.a: "To uczciwe porozumienie."
 INS_loyalist_events.13.b: "Singapur nie jest na sprzedaż."
 INS_loyalist_events.14.t: "Zaakceptowano kompromis w sprawie Singapuru"
 INS_loyalist_events.14.desc: "Umowa została zaakceptowana. Singapur przejdzie pod naszą kontrolę, a jego dawni zarządcy zachowają dostęp handlowy i wojskowy do portu. Nasza flaga powiewa teraz nad jednym z najważniejszych portów Azji."
 INS_loyalist_events.14.a: "Cieśniny są nasze."
 INS_loyalist_events.15.t: "Odrzucono kompromis w sprawie Singapuru"
 INS_loyalist_events.15.desc: "Nasza propozycja została odrzucona. Zarządcy Singapuru nie zamierzają oddać wyspy, niezależnie od proponowanych warunków. Zaoferowaliśmy im wszystko poza dalszą suwerennością, ale to nie wystarczyło."
 INS_loyalist_events.15.a: "Niech tak będzie."
 INS_loyalist_events.16.t: "[FROM.GetNameDefCap] domaga się przekazania Cejlonu"
 INS_loyalist_events.16.desc: "Rząd [FROM.GetAdjective] złożył formalny wniosek o przekazanie mu Cejlonu. Ich dyplomaci powołują się na odwieczne więzi handlowe i etniczne między tą wyspą a światem malajskim. Prawdę powiedziawszy, te argumenty nie są przekonujące, ale [FROM.GetNameDef] to na tyle silny kraj, że takie wnioski należy uważnie rozpatrzyć."
 INS_loyalist_events.16.a: "Dobrze, dajmy im to, czego chcą."
 INS_loyalist_events.16.b: "Cejlon pozostanie pod naszą kontrolą."
 INS_loyalist_events.17.t: "Przekazano Cejlon"
 INS_loyalist_events.17.desc: "Przekazanie Cejlonu zostało wykonane. Nasza administracja zaczęła przenosić urzędników na tę wyspę, zmiana władzy przebiegła bez zakłóceń. Posiadamy teraz terytoria po obu stronach cieśniny."
 INS_loyalist_events.17.a: "Doskonale."
 INS_loyalist_events.18.t: "Odrzucono wniosek o przekazanie Cejlonu"
 INS_loyalist_events.18.desc: "Nasz wniosek o przekazanie Cejlonu został odrzucony. Obecna władza nie zamierza pozbyć się tej wyspy, a nasi dyplomaci donoszą, że dalsze rozmowy na ten temat nie mają sensu."
 INS_loyalist_events.18.a: "Może innym razem."
 INS_loyalist_events.19.t: "[FROM.GetNameDefCap] domaga się referendum w Papui"
 INS_loyalist_events.19.desc: "[FROM.GetNameDefCap] domaga się, abyśmy zezwolili na przeprowadzenie referendum we wschodniej części Papui. Po [FROM.GetAdjective] stronie granicy są nowe drogi przez dżunglę, szpitale obsadzone rządowymi lekarzami, a także szkoły nauczające w miejscowych językach. Po naszej stronie, ostatni gubernator odwiedził Port Moresby dwa razy w ciągu trzech lat. Ambasador [FROM.GetAdjective] nie musiał mówić nic więcej."
 INS_loyalist_events.19.a: "Niech zorganizują to głosowanie."
 INS_loyalist_events.19.b: "Nie pozwolimy na to."
 INS_loyalist_events.20.t: "Zgoda na referendum w Papui"
 INS_loyalist_events.20.desc: "Australijczycy zgodzili się na przeprowadzenie referendum. Wynik był taki sam w każdym dystrykcie wschodniej Papui. Nasze inwestycje w zachodniej części wyspy mówią więcej niż jakikolwiek plakat kampanijny."
 INS_loyalist_events.20.a: "Wyspa wreszcie stała się jednością."
 INS_loyalist_events.21.t: "Brak zgody na referendum w Papui"
 INS_loyalist_events.21.desc: "Australijczycy odmówili. Ich gubernator w Port Moresby wydał oświadczenie, w którym nazwał nasz wniosek obrazą dla australijskiej suwerenności. Nikt nie spytał mieszkańców Papui o zdanie."
 INS_loyalist_events.21.a: "Zapamiętamy to."
 INS_loyalist_events.22.t: "[FROM.GetNameDefCap] domaga się Timoru Wschodniego"
 INS_loyalist_events.22.desc: "Rząd [FROM.GetAdjective] wystosował formalny wniosek o oddanie mu Timoru Wschodniego. Ich ambasador stwierdził, że znajdujący się tam nasz garnizon liczy mniej niż dwustu ludzi, a Lizbona w ostatnich latach nie wyłożyła praktycznie żadnych środków na rozwój tego regionu. Następnie zapytał, dlaczego tak kurczowo chcemy zachować te ziemie."
 INS_loyalist_events.22.a: "Nie warto o to walczyć."
 INS_loyalist_events.22.b: "Timor jest nasz i takim pozostanie."
 INS_loyalist_events.23.t: "Oddano Timor Wschodni"
 INS_loyalist_events.23.desc: "Władze kontrolujące Timor Wschodni zaczęły wycofywać swój garnizon oraz administrację kolonialną. Wkrótce cała wyspa stanie się [INS.GetAdjective] terytorium."
 INS_loyalist_events.23.a: "I tak powinno być."
 INS_loyalist_events.24.t: "Odmówiono oddania Timoru Wschodniego"
 INS_loyalist_events.24.desc: "Gubernator kolonialny w Dili osobiście napisał wiadomość, w której odrzuca nasz wniosek. Twierdzi, że Timor Wschodni pozostanie niezależnym terytorium należącym do jego rządu. Nasz sztab generalny sporządził plany awaryjne na wypadek, gdyby nasze władze chciały prowadzić dalsze działania w tej kwestii."
 INS_loyalist_events.24.a: "Rozpocząć przygotowania."
 INS_loyalist_events.25.t: "[FROM.GetNameDefCap] proponuje zjednoczenie."
 INS_loyalist_events.25.desc: "Delegacja [FROM.GetAdjective] przybyła z propozycją zjednoczenia naszych obu republik. Twierdzą, że nasze ludy mają wspólne austronezyjskie korzenie o wiele starsze niż dzielące nas granice kolonialne, a jedno państwo obejmujące cały archipelag byłoby największą siłą w Azji Południowo Wschodniej. Jeśli się zgodzimy, nasz rząd zostanie rozwiązany i zintegrowany z ich władzami."
 INS_loyalist_events.25.a: "Zgoda."
 INS_loyalist_events.25.b: "Zbyt ciężko walczyliśmy o tę republikę."
 INS_loyalist_events.26.t: "[FROM.GetNameDefCap] zgadza się na zjednoczenie"
 INS_loyalist_events.26.desc: "Rząd [FROM.GetAdjective] przystał na naszą propozycję. Ich urzędnicy już koordynują działania z naszymi, by proces integracji ruszył jak najszybciej. Od Aceh do Luzonu, od Borneo aż po Mindanao, nasz kraj zajmuje teraz cały archipelag Malajów."
 INS_loyalist_events.26.a: "To początek nowej epoki."
 INS_loyalist_events.27.t: "[FROM.GetNameDefCap] odmawia zjednoczenia"
 INS_loyalist_events.27.desc: "Rząd [FROM.GetAdjective] odmówił. Niedawno sami walczyli o niepodległość, wiele ich to kosztowało, zatem nie zamierzają teraz zrzec się suwerenności na rzecz innego kraju. Propozycja została odłożona na półkę."
 INS_loyalist_events.27.a: "Szkoda."
 INS_loyalist_events.28.t: "[FROM.GetNameDefCap] domaga się referendum w: [PHI.GetName]"
 INS_loyalist_events.28.desc: "[FROM.GetNameDefCap] zwraca się z wnioskiem formalnym o zgodę na przeprowadzenie referendum w sprawie zjednoczenia w: [PHI.GetName]. Ich dyplomaci podkreślają wspólne austronezyjskie pochodzenie obu ludów oraz sztuczną naturę rozdzielających je granic kolonialnych. Jeżeli dojdzie do głosowania, wynik będzie prawdopodobnie korzystny dla: [FROM.GetNameDef]."
 INS_loyalist_events.28.a: "Naród powinien mieć możliwość podjęcia decyzji."
 INS_loyalist_events.28.b: "Nie ma mowy."
 INS_loyalist_events.29.t: "Zgoda na referendum w kwestii zjednoczenia"
 INS_loyalist_events.29.desc: "[FROM.FROM.GetNameDefCap] proponuje zjednoczenie naszych dwóch narodów w oparciu o nasze wspólne austronezyjskie dziedzictwo. Nasze władze pozwoliły im przeprowadzić referendum w tej sprawie, a na miejsce zaczęły przybywać osoby prowadzące [FROM.FROM.GetAdjective] kampanię. Wynik zdecyduje, czy republika dołączy do [FROM.FROM.GetNameDef], czy też będzie działać w obecnym układzie."
 INS_loyalist_events.29.a: "Ciekawa propozycja."
 INS_loyalist_events.29.b: "Nie ma takiej możliwości."
 INS_loyalist_events.30.t: "[FROM.GetNameDefCap] głosuje przeciwko zjednoczeniu"
 INS_loyalist_events.30.desc: "Głosy zostały policzone, a osoby prowadzące [FROM.FROM.GetAdjective] kampanię odesłane do domu. Lud [FROM.GetAdjective] zagłosował za pozostaniem. Wygląda na to, że [FROM.Capital.GetCapitalVictoryPointName] to miejsce, gdzie niepodległość jeszcze coś znaczy."
 INS_loyalist_events.30.a: "To koniec."
 INS_loyalist_events.31.t: "[FROM.GetNameDefCap] głosuje za zjednoczeniem"
 INS_loyalist_events.31.desc: "Głosy zostały policzone. Lud [FROM.GetAdjective] woli [FROM.FROM.GetNameDef] niż nas, ale przewaga była ogromna. Nasi administratorzy już otrzymują polecenia rozpoczęcia przekazania władzy."
 INS_loyalist_events.31.a: "Naród zdecydował."
 INS_loyalist_events.32.t: "[PHI.GetNameDef] głosuje za zjednoczeniem"
 INS_loyalist_events.32.desc: "Referendum [PHI.GetAdjective] zakończyło się po naszej myśli. Ich rząd zaakceptował wynik i nawiązał kontakt z naszym ministerstwem spraw zagranicznych, by przygotować przekazanie władzy."
 INS_loyalist_events.32.a: "Wreszcie razem."
 INS_loyalist_events.33.t: "[PHI.GetNameDefCap] nie zgadza się na zjednoczenie"
 INS_loyalist_events.33.desc: "Rząd [PHI.GetAdjective] odrzucił naszą propozycję zjednoczenia. Tamtejszy parlament zagłosował tak, że projekt ustawy nawet nie trafił do drugiego czytania. Proponowaliśmy im miejsce w najwspanialszym państwie Azji Południowo-Wschodniej, a oni napluli nam w twarz."
 INS_loyalist_events.33.a: "To tylko niewielka przeszkoda."
 INS_communist_events.6.t: "Agenci [FROM.GetAdjective] agitują w: [ROOT.GetName]"
 INS_communist_events.6.desc: "Nasze służby wywiadowcze potwierdziły to, co podejrzewaliśmy od dawna. [FROM.GetNameDefCap] prowadzi od dawna na naszym terytorium kampanię wywrotową, opłaca komórki radykalnych ruchów, rozpowszechnia podburzające ulotki oraz organizuje strajki robotników. Ich agenci przeniknęli do związków zawodowych i spółdzielni rolnych, a teraz otwarcie wzywają do obalenia naszego rządu. Sytuacja osiągnęła punkt wrzenia, musimy działać zdecydowanie, zanim sytuacja wymknie się spod kontroli."
 INS_communist_events.6.a: "To niedopuszczalne!"
 INS_communist_events.7.t: "[FROM.GetName]: komunistyczna działalność wywrotowa"
 INS_communist_events.7.desc: "Docierają do nas niepokojące meldunki z: [FROM.FROM.GetName]. Agenci działający na zlecenie rządu [FROM.GetAdjective] podkręcają nastroje rewolucyjne wśród miejscowej populacji, wykorzystują niechęć naszej administracji, aby budować poparcie do przejęcia władzy przez komunistów. Jeżeli nic nie zrobimy, [FROM.FROM.GetNameDef] wpadnie w ręce radykałów, a ta zgnilizna może rozszerzyć się na resztę naszych terytoriów."
 INS_communist_events.7.a: "Trzeba ukrócić tę działalność, zanim się rozszerzy!"
 INS_communist_events.8.t: "Propaganda [FROM.GetAdjective] rozpowszechniana w: [ROOT.GetName]"
 INS_communist_events.8.desc: "W naszych fabrykach, na targach i uniwersytetach pojawia się coraz więcej [FROM.GetAdjective] ulotek i broszur. Szerzą one wiedzę o walce klas i obiecują wyzwolenie poprzez rewolucję, a nasza policja donosi, że takie treści trafiają na podatny grunt wśród niezadowolonych obywateli. To prymitywne, ale skuteczne materiały, a ich rozpowszechnianie nie zwalnia."
 INS_communist_events.8.a: "Dowiedzmy się, kto rozpowszechnia te ohydztwa!"
 ## Call for Revolution - Main Event (sent to target) ##
 INS_communist_events.1.t: "Rewolucja w: [ROOT.GetName]"
 INS_communist_events.1.desc: "Sytuacja jest fatalna i już nic tego nie zmieni. Agitacja [FROM.GetAdjective] zrobiła swoje, a ruchu komunistycznego na [ROOT.GetAdjective] terytorium nie można już zatrzymać zwyczajnymi metodami. Strajki generalne paraliżują miasta, uzbrojeni partyzanci zajęli całe prowincje, a rząd [FROM.GetAdjective] udzielił rewolucjonistom pełnego poparcia. Nasze siły bezpieczeństwa mają za dużo pracy, nie możemy też być pewni ich lojalności. Musimy zdecydować, czy chcemy walczyć o przetrwanie państwa, czy też pogodzimy się z tym, co nieuchronne, zanim przelejemy więcej krwi."
 INS_communist_events.1.a: "Zmobilizować armię. Nie poddamy się bez walki."
 INS_communist_events.1.b: "Dalszy opór tylko zrujnuje naszych obywateli."
 INS_communist_events.1.c: "Może jeśli damy im miejsce przy stole, zdołamy nad tym zapanować."
 ## Civil War Chosen - sent to Indonesia ##
 INS_communist_events.2.t: "[FROM.GetNameDefCap] postanawia walczyć"
 INS_communist_events.2.desc: "Rząd [FROM.GetAdjective] nie zamierza się poddać i rozkazał swoim siłom zbrojnym zdławić ruch rewolucyjny. Nasi towarzysze już zajmują pozycje oraz opanowują najważniejsze twierdze. To nie będzie krótki bój, ale obywatele [FROM.GetAdjective] podjęli decyzję, a my dopilnujemy, żeby nie byli sami."
 INS_communist_events.2.a: "Rewolucja idzie naprzód."
 ## Surrender - sent to Indonesia ##
 INS_communist_events.3.t: "[FROM.GetNameDefCap] kapituluje"
 INS_communist_events.3.desc: "Dawny rząd [FROM.GetAdjective] skapitulował. W obliczu ogromnego ruchu rewolucyjnego i pewności, że stoją za nim władze [ROOT.GetAdjective], stwierdzono, że nie ma innego wyjścia niż poddanie się. Partia komunistyczna przejęła władzę, a nowy rząd już zwrócił się do nas o radę. Kolejny naród został wyzwolony spod jarzma dawnego porządku."
 INS_communist_events.3.a: "Wspaniałe zwycięstwo klasy robotniczej całego świata."
 ## Civil War in Subject - sent to overlord ##
 INS_communist_events.4.t: "[FROM.GetName] - wybuch wojny domowej"
 INS_communist_events.4.desc: "Rewolucjoniści komunistyczni, uzbrojeni i zorganizowani z pomocą rządu [FROM.FROM.GetAdjective], rozpoczęli otwarte powstanie na ziemiach [FROM.GetAdjective] Administracja kolonialna straciła kontrolę nad ogromnym terytorium, a gubernator donosi, że miejscowy garnizon nie zdoła przywrócić porządku, jeśli nie otrzyma posiłków."
 INS_communist_events.4.a: "Wysłać wojsko. [FROM.GetName] należy do nas!"
 ## Subject Surrendered - sent to overlord ##
 INS_communist_events.5.t: "Komuniści przejęli: [FROM.GetName]"
 INS_communist_events.5.desc: "Administracja [FROM.GetAdjective] poddała się bez walki komunistycznym powstańcom. Gubernator i jego podwładni zostali aresztowani, nasza flaga zdjęta, po czym powołano rząd rewolucyjny. Za wszystkim stoją władze [FROM.FROM.GetAdjective] oraz ich agenci, od miesięcy podkopujący tam naszą pozycję. To praktycznie kradzież i nie zamierzamy zostawić jej bez odpowiedzi."
 INS_communist_events.5.a: "To skandal!"
 # Cooperate with Revolutionaries (sent to target)
 INS_communist_events.9.t: "Spotkanie [FROM.GetAdjective] oficerów z dysydentami"
 INS_communist_events.9.desc: "Agenci [FROM.GetAdjective] współpracowali ze znanymi agitatorami oraz przywódcami ruchów buntowniczych w całym kraju. Studenccy aktywiści, którzy niegdyś rozdawali na ulicach nasze ulotki, teraz organizują zamknięte zebrania z ludźmi posługującymi się [FROM.GetAdjective] paszportami dyplomatycznymi. Zakazane publikacje są drukowane tak szybko, że policja nie nadąża z ich konfiskowaniem, a protesty, które kiedyś gasły już po południu, teraz powodują zamknięcie całych dzielnic na kilka dni. Ci komuniści z każdym dniem potrafią się lepiej organizować, jeżeli nie zaczniemy działać szybko, możemy utracić kontrolę nad tymi miejscami."
 INS_communist_events.9.a: "Natychmiast pozbyć się tych zagranicznych agentów!"
 # Spread Anti-Colonialist Sentiment (sent to subject target)
 INS_communist_events.10.t: "Coraz większa popularność [FROM.GetAdjective] retoryki"
 INS_communist_events.10.desc: "W koszarach i wśród służby cywilnej krążą [FROM.GetAdjective] ulotki, a wszelkie konfiskaty nie są w stanie zatrzymać ich napływu. Opisuje się w nich wyzwalanie narodów, ludy, które obaliły gubernatorów kolonialnych i zbudowały coś samodzielnie. Łatwiej byłoby zwalczać tę propagandę, gdyby nie było w niej ziarna prawdy. Nawet lojalni urzędnicy zaczynają pytać, po cichu, czy nasze obecne położenie dobrze służy naszemu ludowi, czy tylko naszym panom."
 INS_communist_events.10.a: "Musimy postępować ostrożnie."
