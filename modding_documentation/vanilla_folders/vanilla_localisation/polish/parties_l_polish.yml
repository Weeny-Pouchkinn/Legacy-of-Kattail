 emperor_fascism: "Faszyzm cesarski"
 emperor_fascism_desc: "Faszyzm cesarski to rodzaj ultranacjonalizmu, w którym masy nie mają nic do powiedzenia. System ten jest często nazywany \"odgórnym faszyzmem\", gdzie władzę sprawują wojskowi i arystokratyczni biurokraci, cesarz jest otoczony ogromną czcią i wierzy się w jego boskość oraz nieomylność."
 japan_militarism_ideology: "Militaryzm"
 japan_militarism_ideology_desc: "Militaryzm to ideologia, w której przywódca narodu sprawuje władzę tylko tytularnie i działa raczej jako marionetka wojska, a nie niezależny polityk. Nieustannie realizuje on agendę wojskowych, której ostatecznym celem jest polityka szybkiej ekspansji."
 buddhist_socialism: "Buddyjski socjalizm"
 buddhist_socialism_desc: "Buddyjski socjalizm, nazywany też dhāmmicznym albo naturalnym socjalizmem, to ideologia polityczna głosząca socjalizm oparty na zasadach buddyzmu. Zarówno socjalizm, jak i buddyzm zakładają zakończenie cierpienia poprzez analizę warunków i usunięcie głównych przyczyn poprzez praktykę. Oba dążą do transformacji osobistej świadomości, co ma zakończyć alienację oraz samolubność człowieka."
