 SAF_BLITZKRIEG_DESC: "Gdy zaczęła się wielka wojna, wielu mieszkańców Afryki Południowej odmówiło walki dla brytyjskich władców. Południowoafrykańskie wojsko spędziło większą część konfliktu na ściganiu sił niemieckich w afrykańskich koloniach, odnosząc niewielkie sukcesy.\n\nAle szykuje się nowa wojna. I znowu część mieszkańców Afryki Południowej uważa, że ich kraj nie powinien wcale walczyć z Niemcami. Niektórzy wierzą nawet, że nadszedł czas, by potomkowie Burów sięgnęli po wolność, której nie dano ich przodkom."
 NZL_BLITZKRIEG_DESC: "Ten mały kraj na południowym Pacyfiku dzielnie walczył w wielkiej wojnie, ponosząc poważne straty w krwawych bitwach pod Gallipoli i na froncie zachodnim. Prawie połowa mężczyzn w wieku poborowym brała udział w walkach za granicą, wielu z nich nie wróciło już do domu.\n\nOd ostatniego konfliktu upłynęło około dwudziestu lat i obywatele Nowej Zelandii przyglądają się z niepokojem scenie światowej. Tym razem widmo wojny zdaje się być bliżej ich ojczyzny..."
 RAJ_BLITZKRIEG_DESC: "Klejnot koronny Imperium Brytyjskiego, Cesarstwo Indyjskie, to dziwne połączenie imperialnej mocy i imperialnej niemocy. Nieliczna elita brytyjskich urzędników sprawuje władzę nad wielkim subkontynentem, zamieszkałym przez setki milionów poddanych. Wśród tych ludzi są żołnierze indyjskiej armii, którzy dzielnie walczyli podczas wielkiej wojny.\n\nPrzywódcy indyjscy liczyli na to, że poświęcenie w czasie ostatniej wojny pomoże im uniezależnić się od Wielkiej Brytanii, ale na razie te nadzieje okazują się płonne. Zbliża się kolejna wojna i wielu ludzi uważa, że nadszedł czas wywalczyć tę wolność wszelkimi koniecznymi metodami."
 CZE_GATHERING_STORM_DESC: "Podczas wielkiej wojny siły czeskie walczyły w szeregach ententy na terenie całej Europie, by zdobyć poparcie dla powstania ich własnego państwa. Wysiłki te zostały nagrodzone, gdy na gruzach mocarstwa Austro-Węgier powstała Czechosłowacja. \n\nPo wybuchowym uzyskaniu państwowości Czechosłowacja stworzyła Małą Ententę, sojusz z Jugosławią i Rumunią mający pokrzyżować działania Węgier dążących do odbudowy imperium austro-węgierskiego. Krajobraz polityczny Europy zmienia się jednak pod wpływem rosnącej potęgi Niemiec."
 HUN_GATHERING_STORM_DESC: "Węgry, stanowiące połowę mocarstwa Austro-Węgier, po wielkiej wojnie były traktowane przez zwycięskie siły ententy jak pokonany wróg. Traktat w Trianon pozbawił ten kraj prawie dwóch trzecich terytorium. Miliony rdzennych Węgrów znalazły się poza granicami swojej ojczyzny, a gospodarka była w opłakanym stanie. Surowe ograniczenia zbrojeń miały zagwarantować, że Węgry już nigdy nie zagrożą pokojowi w Europie. \n\nJednak zmieniający się klimat polityczny na kontynencie może przynieść szansę naprawy błędów przeszłości i odbudowy dawnej wielkości tego państwa."
 ROM_GATHERING_STORM_DESC: "Rumunia znalazła się po stronie zwycięzców wielkiej wojny, w wyniku czego uzyskała nowe terytoria i ludzi, z których nie wszyscy byli Rumunami. Aby zabezpieczyć się przed rewanżystycznymi zapędami państw, które musiały oddać część swoich ziem, Rumunia stworzyła sieć sojuszy w regionie Bałkanów. Jednak w ostatnich latach kraj koncentrował swą uwagę głównie na sprawach wewnętrznych, a rząd króla Karola II pozwolił na osłabienie tych sojuszy. \n\nSytuacja polityczna w Europie zmienia się, przez co Rumunia może zostać osamotniona i bezbronna."
 HUN_BLITZKRIEG_DESC: "Węgry, stanowiące połowę mocarstwa Austro-Węgier, po wielkiej wojnie były traktowane przez zwycięskie siły ententy jak pokonany wróg. Traktat w Trianon pozbawił ten kraj prawie dwóch trzecich terytorium. Miliony rdzennych Węgrów znalazły się poza granicami swojej ojczyzny, a gospodarka była w opłakanym stanie. Surowe ograniczenia zbrojeń miały zagwarantować, że Węgry już nigdy nie zagrożą pokojowi w Europie. \n\nJednak zmieniający się klimat polityczny na kontynencie może przynieść szansę naprawy błędów przeszłości i odbudowy dawnej wielkości tego państwa."
 ROM_BLITZKRIEG_DESC: "Rumunia znalazła się po stronie zwycięzców wielkiej wojny, w wyniku czego uzyskała nowe terytoria i ludzi, z których nie wszyscy byli Rumunami. Aby zabezpieczyć się przed rewanżystycznymi zapędami państw, które musiały oddać część swoich ziem, Rumunia stworzyła sieć sojuszy w regionie Bałkanów. Jednak w ostatnich latach kraj koncentrował swą uwagę głównie na sprawach wewnętrznych, a rząd króla Karola II pozwolił na osłabienie tych sojuszy. \n\nSytuacja polityczna w Europie zmienia się, przez co Rumunia może zostać osamotniona i bezbronna."
 YUG_GATHERING_STORM_DESC: "Jugosławia powstała, gdy nowe państwo Serbów, Chorwatów i Słoweńców połączyło się z niepodległym Królestwem Serbii w 1922 r. Początkowo Jugosławia weszła do Małej Ententy i ententy bałkańskiej, by zagwarantować sobie niepodległość. Jednak niedawny zamach na króla Aleksandra, rosnąca wewnętrzna presja ze strony nacjonalistów oraz zewnętrzne naciski Włoch i Niemiec wywołały potężne niepokoje, a także zmianę pozycji politycznej i strategicznej Rumunii."
 YUG_BLITZKRIEG_DESC: "Jugosławia powstała, gdy w 1922 r. nowe Królestwo Serbów, Chorwatów i Słoweńców połączyło się z niepodległym Królestwem Serbii.  Początkowo Jugosławia weszła do Małej Ententy i Ententy Bałkańskiej, by zagwarantować sobie niepodległość, jednak rosnąca wewnętrzna presja ze strony nacjonalistów oraz zewnętrzne naciski Włoch i Niemiec wywołały potężne niepokoje, a także zmianę pozycji politycznej i strategicznej Rumunii."
 CHI_GATHERING_STORM_DESC: "Po rewolucji, która obaliła ostatniego cesarza z dynastii Qing, młoda Republika Chińska walczyła o przetrwanie. Watażkowie władają większością ziem na peryferiach, a w centrum kraju komuniści założyli centrum zarządzania w odległej górskiej dolinie. Tuż przy granicy Japonia stworzyła rząd marionetkowy z ostatnim chińskim cesarzem na czele, który pragnie ponownie zjednoczyć kraj pod swoimi rządami.\n\nMając wielu niebezpiecznych wrogów, rząd Czang Kaj-szeka musi dokonać trudnych wyborów, jeśli chce przetrwać i rządzić Chinami."
 PRC_GATHERING_STORM_DESC: "Ledwie dwa lata temu Komunistycznej Partii Chin groziło całkowite wyniszczenie. Żeby przetrwać, wyruszyła w długą podróż, którą nazwano Długim Marszem. Tylko niewielka część armii przetrwała trudy marszu, fabryk jest niewiele, więc trudno będzie o zwycięstwo w chińskiej wojnie domowej.\n\nAle może z czasem ludność przekona się do komunistycznych idei, powstaną nowe armie i bazy, a gdy nadejdzie właściwa chwila, rewolucja rozpocznie się od nowa, by ostatecznie zwyciężyć."
 CHI_BLITZKRIEG_DESC: "Po dwóch latach wojny z Japonią armie Czang Kaj-szeka wykrwawiły się, próbując zatrzymać atak nieprzyjaciela. Wróg zajął najbogatsze regiony kraju. Zachodnie demokracje udzieliły tylko niewielkiego wsparcia, a komuniści nie kwapią się do otwartego starcia z wrogiem.\n\nWojna może rozszerzyć się bardziej, wygląda na to, że najgorsze jeszcze nie nadeszło. Jednak dzięki temu, że japoński atak jest hamowany przez same rozmiary kraju, wróg może zainteresować się innymi kierunkami, a nowe sojusze mogą jeszcze zmienić równowagę sił..."
 PRC_BLITZKRIEG_DESC: "W obliczu potężnej japońskiej ofensywy nacjonaliści i komuniści zawarli kruchy rozejm. Obie strony zdają sobie sprawę, że ten zjednoczony front nie przetrwa długo. Centralny region komunistów w Yan’an stał się teraz linią frontu w wojnie z Japonią.\n\nKomuniści muszą oszczędnie gospodarować zasobami, jeśli chcą przetrwać. Wszystkie straty poniesione w walce z Japończykami będą miały dwukrotnie większą wagę, gdy przyjdzie czas zmierzyć się z nacjonalistami. Możliwe, że właśnie na to liczy rząd Czang Kaj-szeka..."
 MAN_GATHERING_STORM_DESC: "Puyi, ostatni cesarz Chin, usunięty ze Smoczego Tronu w wieku sześciu lat, był cierpliwy. Gdy jego dawne cesarstwo rozdzierała wojna domowa, Puyi znalazł nowego sojusznika w Japonii.\n\nDla Puyia powstanie Imperium Mandżukuo w 1932 r. było zaledwie pierwszym krokiem na drodze do odzyskania rodowego dziedzictwa. W tej chwili utrzymuje władzę dzięki armii japońskiej, ale za jakiś czas może pojawić się okazja do zrzucenia kajdan i objęcia roli, do której się urodził..."
 MAN_BLITZKRIEG_DESC: "Puyi, ostatni cesarz Chin, usunięty ze Smoczego Tronu w wieku sześciu lat, był cierpliwy. Gdy jego dawne cesarstwo rozdzierała wojna domowa, Puyi znalazł nowego sojusznika w Japonii.\n\nDla Puyia powstanie Imperium Mandżukuo w 1932 r. było zaledwie pierwszym krokiem na drodze do odzyskania rodowego dziedzictwa. W tej chwili utrzymuje władzę dzięki armii japońskiej, ale za jakiś czas może pojawić się okazja do zrzucenia kajdan i objęcia roli, do której się urodził..."
 MAN_TSR_GATHERING_STORM_DESC: "Mandżukuo stoi na kruchych fundamentach. Powstałe w 1932 roku państwo miało pomóc w legitymizacji władzy Japończyków nad Mandżurią. Zgodnie z ich wolą jego cesarzem został Puyi.\n\nPozostaje pytanie, czy Puyi pozostanie w cieniu, podczas gdy Stowarzyszenie Zgody i armia japońska zajmą się rządami? Czy też podejmie próbę odzyskania władzy, ryzykując całkowitą jej utratę wskutek działań grupy bandytów, którzy żądają jej równie mocno jak on?"
 MAN_TSR_BLITZKRIEG_DESC: "Mandżukuo to wyodrębnione niegdyś z północnej części Chin przez japońską armię państwo, które ustanowiło Puyi jako swojego cesarza, żeby spróbować choć trochę zalegitymizować swoją odrębność. Obecnie stało się pełnoprawnym członkiem Strefy Wspólnego Dobrobytu Wielkiej Azji Wschodniej. Powstaje pytanie, czy pozostanie ono w rękach Stowarzyszenia Zgody, czy też wpadnie w ręce Puyi."
 WARLORDS_GATHERING_STORM_DESC: "Słabość rządu centralnego może umożliwić co ambitniejszym jednostkom dojście do władzy. Na peryferiach kraju lokalni liderzy stworzyli swoje małe lenna, nie przejmując się zbytnio poleceniami rządu centralnego. \n\nNadchodzi wojna, każdy z tych watażków stoi przed trudnym wyborem: współpracować z rządem centralnym czy zawrzeć sojusz z komunistami? Każda opcja może zaowocować miejscem przy stole władzy, ale jest też trzecia możliwość: zdobycie Chin dla siebie."
 WARLORDS_BLITZKRIEG_DESC: "Wojna z Japonią zmusiła chińskich watażków do opowiedzenia się po jednej ze stron, ale nie ma wątpliwości, że ten sojusz nie przetrwa długo. Nadejdzie dzień, gdy nie będzie już potrzebny, i wtedy ponownie rozpocznie się rozgrywka pomiędzy tymi wszystkimi ambitnymi i bezwzględnymi ludźmi, a jej stawką będzie tytuł władcy Chin."
 MEXICO_GATHERING_STORM_DESC: "Po obaleniu tyrana Porfiria Díaza Meksyk pogrążył się w trwających dwadzieścia lat wojnach domowych. Centryści walczyli z regionalistami, chłopi i socjaliści zmagali się w właścicielami hacjend. Spory o rolę państwa i religii powróciły wprost z annałów Oświecenia, by nękać Meksyk.\n\nRząd sekularystów twierdzi, że wygrał te spory, ale zasiada na tronie z gruzu. Gdy odbudowa Meksyku dobiegnie końca, być może wyłoni się inny zwycięzca."
 MEXICO_BLITZKRIEG_DESC: "Rząd Lázara Cárdenasa okazał się większą siłą napędową pozytywnych zmian społecznych niż gabinet jego poprzednika, prezydenta Plutarca Callesa, który został wygnany i przebywa obecnie w Ameryce. Sytuacja gospodarcza unormowała się, a zagraniczne koncerny naftowe działają pod nadzorem państwa, dzięki czemu rząd meksykański może spoglądać poza swoje granice. Ameryka ma wrogów na wielu frontach i najprawdopodobniej wybaczy upaństwowienie Standard Oil, ale zaprzyjaźnienie się z jej wrogami może przynieść jeszcze większe zyski..."
 NETHERLANDS_GATHERING_STORM_DESC: "Rząd holenderski z niepokojem obserwuje rosnące napięcie międzynarodowe. Gospodarka kraju szwankuje, ruch pacyfistyczny ma się doskonale, a silna wiara w neutralność odstręcza ewentualnych sojuszników. Wszystko to powoduje, że Holendrzy nie są w stanie przygotować odpowiedniej obrony.\n\nJednocześnie znaczenie Holandii jako bramy handlowej na kontynent sprawia, że zarówno Brytyjczycy, jak i Niemcy pragną holenderskiej \"współpracy\", by zaszkodzić drugiej stronie. Ewentualna odmowa ma duże szanse spotkać się z wrogością. Może wycofanie się do kolonii to jedyny sposób odparcia takiej inwazji..."
 NETHERLANDS_BLITZKRIEG_DESC: "Wojna pomiędzy Niemcami i innymi mocarstwami europejskimi wydaje się nieunikniona. Chociaż Holandia po raz kolejny wybrała neutralność, jej przywódcy rozważają opracowanie tajnych planów sztabowych wspólnie z południowymi sąsiadami w celu przygotowania się do ewentualnych działań zbrojnych.\n\nArmia została zmobilizowana, a prace nad holenderskimi liniami obronnymi nabierają tempa – wszystko to, by przygotować kraj do obrony przed pogwałceniem jego niepodległości. Jeśli to się nie uda, zawsze są jeszcze kolonie..."
 SPAIN_GATHERING_STORM_DESC: "W pierwszych pięciu latach swego istnienia raczkująca Druga Republika Hiszpańska musiała zmierzyć się ze strajkami, próbą przewrotu wojskowego i dużym powstaniem. Przetrwała te wyzwania, jednak hiszpańskie społeczeństwo cierpi z powodu polaryzacji politycznej i starć pomiędzy anarchistami, komunistami oraz falangistami.\n\nWszystkie strony czekają z nadzieją na wybory powszechne, które odbędą się w 1936 r., ale mało prawdopodobnym jest, że zwycięstwo którejś z frakcji ustabilizuje sytuację. A gdy trwają walki, wojsko czeka i spiskuje..."
 SPAIN_BLITZKRIEG_DESC: "Wojna domowa, która przez ostanie trzy lata pustoszyła kraj, wreszcie dobiegła końca. Pod wodzą Franco zwycięzcy muszą teraz zająć się odbudową Hiszpanii, zlikwidowaniem ostatnich ognisk ruchu oporu i zasypaniem podziałów powstałych w czasie wojny.\n\nMają na to ograniczony czas, ponieważ świat nieubłaganie zmierza ku jeszcze większej i bardziej krwawej wojnie. Jeśli Hiszpania ma się bronić albo skorzystać z możliwości stwarzanych przez nadchodzący konflikt, musi niezwłocznie przygotować do tego swój przemysł i swoje wojska."
 PORTUGAL_GATHERING_STORM_DESC: "Po dojściu Salazara do władzy w roku 1932 w Portugalii zakończył się niespokojny czas Pierwszej Republiki. Jego wizja silnego państwa portugalskiego, niezależnego finansowo i politycznie od wielkich mocarstw, doprowadziła do powstania Estado Novo i stała się fundamentem rozwoju portugalskiego przemysłu i modernizacji armii. \n\nPortugalia musi teraz wybrać dalszy kierunek, bo w sąsiedniej Hiszpanii nasilają się niepokoje polityczne i społeczne, a napięcie na arenie międzynarodowej staje się coraz większe..."
 PORTUGAL_BLITZKRIEG_DESC: "Konserwatywny i nacjonalistyczny rząd Salazara pozwolił Portugalii zachować neutralność w czasie hiszpańskiej wojny domowej, a jednocześnie wspierał nacjonalistów i przyczynił się do porażki zwolenników komunizmu i anarchii. \n\nSytuacja na Półwyspie Iberyjskim wreszcie się ustabilizowała, więc nadszedł czas na poszukiwanie potencjalnych zagranicznych sojuszników i rozważenie, jaką rolę odegra Portugalia w prawdopodobnie nieuniknionym konflikcie światowym."
 LIT_GATHERING_STORM_DESC: "Kiedy Polska ciągle próbuje wciągnąć Litwę do nowej Rzeczpospolitej, kiedy Rosjanie nie uznają litewskiego prawa do samostanowienia, a w regionie Memel rośnie zagrożenie ze strony nazistów, pewien weteran wojny o niepodległość postanowił walczyć o zachowanie stabilności i niepodległości narodu litewskiego. Mając do dyspozycji ograniczone zasoby, Antanas Smetona kieruje niestabilnym reżimem. Na wsiach panoszy się Żelazny Wilk, którego członków rozjuszyło aresztowanie ich przywódcy Augustinasa Voldemarasa. Zbliża się wojna, a Litwa musi za wszelką cenę bronić swoich obywateli."
 LIT_BLITZKRIEG_DESC: "Wszystko przygotowane. Antanas Smetona został dyktatorem, teraz nie uda się zrealizować marzeń o odnowieniu Republiki Litewskiej. Zawarto porozumienie z Rosjanami, na mocy którego po rozbiorze Polski Wilno powróci do Litwy. Ale czy Smetona może wierzyć, że Stalin i jego nienasycona machina wojenna będą zawsze szanować litewską niepodległość?"
 LAT_GATHERING_STORM_DESC: "Minęły dwa lata od przewrotu majowego, a status Łotwy nadal jest niepewny. Kārlis Ulmanis, który kiedyś był premierem łotewskiego rządu, teraz pozuje na dyktatora, a zwolennicy demokracji głośno sprzeciwiają się temu atakowi na wolność Łotwy. Faszystowska organizacja Pērkonkrusts jest wzburzona po aresztowaniu jej przywódcy Gustavsa Celmiņša i jeśli dyktatura nie zlikwiduje szybko tego zagrożenia, na Łotwie może wybuchnąć wojna domowa.\n\nNiebezpieczeństwa czają się na wschodzie i zachodzie, więc Łotwa balansuje na cienkiej linii między zwycięstwem a unicestwieniem."
 LAT_BLITZKRIEG_DESC: "Zbytnie poleganie Łotwy na wymianie handlowej ze Związkiem Radzieckim zemściło się na dyktaturze. ZSRR i Rzesza Niemiecka pokazały pazury i dybią na Ulmanisa. Jeśli Łotwa ma pozostać niepodległa, trzeba przeprowadzić błyskawiczną mobilizację, chyba że dyktatura woli podkulić ogon i błagać Rosjan o łaskę..."
 EST_GATHERING_STORM_DESC: "W obliczu komunistycznego zagrożenia na wschodzie i faszystowskiego na południu Konstantin Päts i Isamaaliit przejęli całkowitą kontrolę nad Estonią, by zadbać o jej przyszłość. Grupa weteranów estońskiej wojny o niepodległość tworzyła ruch zwany wabsami. To prawicowi populiści dążący do wyrwania władzy z rąk neutralnego rządu.\n\nPrzyszłość Estonii jest niepewna. Czy Päts utrzyma pokój i nastanie epoka spokoju, czy też wabsowie przejmą władzę i stworzą nowe państwo estońskie?"
 EST_BLITZKRIEG_DESC: "Estonia znalazła się w potrzasku pomiędzy morzem i czerwonym zagrożeniem na wschodzie. Nie ma już u swego boku dawnych sojuszników. Kapitulacja wydaje się nieunikniona, ale naród estoński może przetrwać: obywatele będą zniewoleni przez ZSRR albo zostaną członkami leśnej partyzantki."
 BUL_GATHERING_STORM_DESC: "Po wojnie niepodległościowej w roku 1878 i odrzuceniu traktatu w San Stefano przez zachodnie demokracje historię Bułgarii znaczyły ciągłe konflikty i zdrady na Bałkanach. Jako pokonany członek Trójprzymierza w I wojnie światowej Bułgaria doznała znacznych strat terytorialnych, a traktat w Neuilly-sur-Seine nałożył na kraj ciężkie sankcje gospodarcze i ograniczenia militarne. \n\nJednak wraz z wielkimi zmianami społeczno-politycznymi, jakie nastąpiły w Europie, nadszedł czas, by Bułgaria wybrała swoją własną drogę i zajęła należne jej miejsce na Bałkanach."
 BUL_BLITZKRIEG_DESC: "Przez ostatnie kilka lat car Borys konsolidował swoją władzę, rozwiązując konspiracyjną organizację Zweno oraz zwracając politykę zagraniczną Bułgarii ku Niemcom. Niedawne negocjacje z sąsiadami na Bałkanach sprawiły, że Wielka Brytania zniosła restrykcje wojskowe nałożone na kraj po I wojnie światowej, aby zapobiec dołączeniu Bułgarii do państw Osi. \nTeraz car stara się odzyskać utracone w przeszłości terytoria bez wywoływania nowego konfliktu zbrojnego, ale na scenie międzynarodowej Europy rośnie napięcie, więc przyszłość Bułgarii jest niepewna..."
 GRE_GATHERING_STORM_DESC: "Grecja to kraj pogrążony w kryzysie. Rojaliści i republikanie toczą zażartą walkę o duszę narodu, która doprowadziła do obalenia Drugiej Republiki Helleńskiej w 1935 r. Król, autokratyczny obcokrajowiec, pozostaje postacią dzielącą obywateli, a jego przyszłość jest niepewna. \n\nZajęta błahymi sprawami polityki wewnętrznej, wroga i rewanżystyczna Bułgaria gnije na północy, a na wschodzie Turcja – dawny przeciwnik Grecji, a teraz jej nowy sojusznik – przechodzi metamorfozę. Natomiast po drugiej stronie Adriatyku czai się potężny potwór..."
 GRE_BLITZKRIEG_DESC: "Pod silnymi rządami dyktatora Joanisa Metaksasa w Grecji powróciła równowaga. Plan czteroletni umożliwił rozwój greckiego przemysłu przez ostatnie lata, a zadłużenie państwa, choć nadal niebezpiecznie wysokie, wydaje się pod kontrolą. \n\nNiestety, silny rząd i rozsądna polityka gospodarcza mogą w niczym nie pomóc temu zagrożonemu państwu. Na horyzoncie majaczy wielka, potworna wojna, a mimo stanowczych zapewnień Metaksasa o zachowaniu przez Grecję neutralności w ewentualnym konflikcie, ostateczna decyzja w tej sprawie może nie zależeć od niego..."
 TUR_GATHERING_STORM_DESC: "Z popiołów Imperium Osmańskiego narodziła się Republika Turecka. Turcja zapłaciła za swoją niepodległość krwią w czasie kampanii narodowej w 1923 r. i choć była to słuszna walka, jej koszty nadal ciążą na narodzie tureckim. \n\nKonserwatyści religijni są plagą toczącą zaplecze kraju, ze wszystkich sił opierają się ogólnonarodowej modernizacji, a kurdyjscy nacjonaliści sieją zniszczenie na wschodzie. Poważany prezydent Mustafa Kemal Atatürk musi zjednoczyć kraj albo przekazać pałeczkę liderowi, który mógłby to uczynić. Musi zrobić to szybko, ponieważ w Europie zaczynają się kłopoty..."
 TUR_BLITZKRIEG_DESC: "Zmarł Ojciec Turków, Mustafa Kemal Atatürk. Naród pogrążył się w żałobie, a na czele państwa stanął szanowany polityk İsmet İnönü. İnönü przejął podzielony kraj, w którym różnice nasiliły się po śmierci człowieka, który wskazywał narodowi drogę. \n\nPoza kłopotami wewnętrznymi İnönü musi brać pod uwagę perspektywę wybuchu wojny w Europie, która może okazać się jeszcze bardziej niszczycielska od wielkiej wojny. Atatürk często powtarzał mantrę: \"Pokój w ojczyźnie, pokój na świecie\". Czy İnönü zdoła zachować pokój w tym trudnym czasie?"
 ETH_GATHERING_STORM_DESC: "Etiopia ma wielowiekową historię i równie długo panującą dynastię cesarską. Haile Selassie dołożył wielu starań, by zmodernizować nasze imperium, ale proces ten został przerwany, gdy Włochy zaatakowały Etiopię po raz drugi w ciągu 40 lat. Sytuacja wygląda ponuro, ale jeśli cesarstwo zjednoczy swe siły, może zdoła ponownie zatrzymać najeźdźców. \n\nJeśli Europa ma pozostać wolna, cała Afryka Wschodnia musi zostać raz na zawsze wyzwolona spod władzy Europejczyków."
 AFA_GATHERING_STORM_DESC: "Lud Afar od dawna zamieszkuje rozległą pustynię Danakil rozciągającą się od Dżibuti na wschodzie po Etiopię na zachodzie. Ostatnio jednak Włochy zyskują coraz większe wpływy w tym regionie, a Mohammed Yayyo przedkłada Benito Mussoliniego nad Haile Selassiego.\n\nW obliczu trwającej obecnie drugiej wojny włosko-etiopskiej wydaje się, że w najbliższej przyszłości konieczne będzie podjęcie decyzji: czy przyszłość Afarów będzie związana z Włochami, czy też lepszym rozwiązaniem będzie dla nich samodzielność?"
 FIN_GATHERING_STORM_DESC: "Finlandia to młody kraj, który wyzwolił się spod panowania Rosji w 1917 r. po krwawej wojnie domowej. Blizny wojenne są nadal świeże, a rząd koalicyjny wciąż ma problemy z efektywną współpracą. Wszystko wskazuje na to, że Związek Radziecki chce zająć fińskie terytoria w pobliżu Leningradu, a Finlandia jest źle przygotowana do ewentualnego konfliktu. Ma ona jednak za sobą długą historię wojskowego męstwa i nieugiętości, a jej żołnierze są niezwykle wierni swemu krajowi. \n\nNapięcie rośnie i konflikt wisi w powietrzu, przez co przyszłość Finlandii stała się niepewna."
 FIN_BLITZKRIEG_DESC: "Finlandia znalazła się między Związkiem Radzieckim a nazistowskimi Niemcami, a napięcia między tymi dwoma mocarstwami ciągle się nasilają. Negocjacje ze Związkiem Radzieckim załamały się i rząd musi teraz podjąć trudne decyzje dotyczące ochrony niepodległości swego kraju. \n\nPodjęto działania w celu wzmocnienia fińskiej obrony, jednak armia wciąż jest słabo wyposażona, a siły powietrzne i marynarka wojenna właściwie nie istnieją. Mimo to silne poczucie fińskiej dumy narodowej oraz męstwo żołnierzy wzmacniają jej wolę obrony niepodległości."
 SWE_GATHERING_STORM_DESC: "Chociaż podczas wielkiej wojny Szwecja zachowała neutralność, ucierpiała w wyniku brytyjskich starań założenia blokady na Niemcy. Na kontynencie rośnie napięcie i naród szwedzki niepokoi się, że znowu ucierpi w wyniku działań wielkich mocarstw. \n\nJednocześnie socjaldemokraci próbują znaleźć równowagę między budowaniem państwa opiekuńczego, które wspiera słabszą część obywateli, a stworzeniem silnego wojska, które pozwoli zachować Szwecji neutralność."
 SWE_BLITZKRIEG_DESC: "Groźba wybuchu kolejnej wielkiej wojny rośnie z każdym dniem, w miarę jak Niemcy naruszają granice swoich sąsiadów. Ich potęga militarna w znacznej mierze zależy od szwedzkiej rudy żelaza, co wywołuje obawy, że ich ambicje terytorialne mogą wkrótce wyjść poza państwa bałtyckie i objąć Skandynawię. \n\nSpodziewając się takiego zagrożenia, armia szwedzka rozpoczęła przezbrajanie i modernizację dzięki prężnemu krajowemu przemysłowi zbrojeniowemu. Nie wiadomo jeszcze, czy kraj ten jest w stanie odstraszyć potencjalnego agresora."
 NOR_GATHERING_STORM_DESC: "Od czasu uzyskania niepodległości od Szwecji w 1905 r. Norwegia szukała własnej drogi politycznej i dopiero teraz zaczyna wykazywać oznaki stabilizacji politycznej oraz odbicia po trudnych latach trzydziestych.\n\nObecnie jej sąsiedzi z południa spierają się ze sobą, a wybuch wojny jest bardzo prawdopodobny. Norwegia musi więc znaleźć drogę, która umożliwi jej zachowanie kruchej niepodległości. Nygaardsvold stawia na neutralność i rozbrojenie, by nie prowokować żadnej z potęg europejskich, ale trudno powiedzieć, czy taka postawa przyniesie spodziewane skutki."
 NOR_BLITZKRIEG_DESC: "Trzecia Rzesza rośnie w siłę i powiększa swoje terytorium. W związku z tym faszystowskie organizacje w Norwegii chcą wykorzystać ewentualną niemiecką inwazję, by przejąć władzę w kraju i kolaborować z wrogiem.\n\nVidkun Quisling, pozbawiony skrupułów poplecznik partii nazistowskiej, prawdopodobnie spiskuje, by władza trafiła w ręce jego partii Nasjonal Samling. Czas rozpocząć pospieszne przygotowania. Norwegia musi się zjednoczyć, by odeprzeć zagrożenia zewnętrzne i wewnętrzne."
 DEN_GATHERING_STORM_DESC: "Napięcie w Europie znowu rośnie, a Dania ma słabą armię i gospodarkę, która wciąż odczuwa skutki wielkiego kryzysu.\n\nDuńczycy muszą znaleźć sposób na walkę z bezrobociem i rosnącą popularnością ekstremistycznych ruchów politycznych, a jednocześnie ponownie zastanowić się nad zaletami polityki neutralności oraz ustępstw.\n\nDania wciąż jest panią własnego losu, ale trudno powiedzieć, na jak długo."
 DEN_BLITZKRIEG_DESC: "Dania znajduje się w niebezpiecznym położeniu. Jej siły zbrojne były zaniedbywane na skutek wieloletnich cięć budżetowych, których celem było zaspokojenie żądań o wiele większego i silniejszego sąsiada: Niemiec. \n\nUstępstwa jednak nie powstrzymały Rzeszy Niemieckiej przed konsolidowaniem jej potęgi w Europie i wysuwaniem roszczeń wobec innych krajów. Dania musi teraz wierzyć, że zadeklarowanie neutralności uratuje ją podobnie jak podczas niszczycielskiej wielkiej wojny."
 ICE_GATHERING_STORM_DESC: "Islandia ma długą historię izolacji i eksploracji. Zmieniła dawną właścicielkę Norwegię na obecną Danię, gdy ta pierwsza stała się partnerką Szwecji w 1814 r. Własny rząd posiada dopiero od 1919 r.\n\nPo tym jak wielki kryzys uderzył w Islandię, jej sytuacja jest nie do pozazdroszczenia, na horyzoncie majaczy konflikt, więc może już czas opuścić tonący okręt i raz na zawsze zerwać więzi z Danią."
 ICE_BLITZKRIEG_DESC: "Po niedawnych niemieckich żądaniach wyraźnie widać, że sytuacja w Europie musi się pogorszyć, a duński atak jest raczej nieuchronny.\n\nW tej sytuacji ważą się losy Islandii, prawdopodobnie będzie ona zabiegała o amerykańską ochronę, jeśli chciałaby nie mieszać się w konflikt, który niebawem rozgorzeje."
 BRA_GATHERING_STORM_DESC: "Wielki Kryzys zrujnował brazylijską gospodarkę z powodu nadmiernego uzależnienia od eksportu. Kolejne lata przyniosły rosnący poziom wstrząsów politycznych, gdy koalicje oficerów wojskowych, robotników i polityków obaliły oligarchię rządzącą krajem i zastąpiły ją kruchą demokratyczną konstytucją. \n\nGetúlio Vargas stał się wiodącą postacią brazylijskiej polityki, powstrzymując niedawno komunistyczny zamach stanu i przejmując władzę w trybie nadzwyczajnym. Dopiero okaże się, czy demokracja zostanie przywrócona, czy też Vargas poprowadzi państwo w bardziej autorytarnym kierunku."
 BRA_BLITZKRIEG_DESC: "Getúlio Vargas przejął kontrolę nad rządem i zawiesił działanie demokracji. Mając na razie zapewnioną władzę, brazylijski przywódca zwraca się teraz ku sprawom międzynarodowym. Wojna w Europie wydaje się nieunikniona, a paranoiczna obawa przed argentyńskim wtargnięciem na terytorium Brazylii jest w centrum uwagi przywódców narodu. Istnieje jednak nadzieja, że sojusz ze Stanami Zjednoczonymi mógłby w przyszłości ochronić Brazylię."
 ARG_GATHERING_STORM_DESC: "W 1930 roku gabinet Hipólito Yrigoyena został obalony w pierwszym wojskowym przewrocie od czasu przyjęcia argentyńskiej konstytucji. Tak rozpoczęła się tak zwana Niesławna Dekada. Argentyna musi poruszać się w szybko zmieniającym się świecie, gdzie wielkie mocarstwa zagrażają kruchemu pokojowi utrzymywanemu od zakończenia wielkiej wojny. \n\nCo jest większym zagrożeniem? Zbierająca się burza w Europie? Właśni sąsiedzi? A może sami Argentyńczycy? Argentyna będzie musiała się bronić i ugruntować swoje miejsce na światowej scenie."
 ARG_BLITZKRIEG_DESC: "W wyniku najbardziej sfałszowanych wyborów w historii Argentyny Concordancia wciąż posiada większość w rządzie, a Roberto María Ortiz kieruje teraz krajem jako prezydent. \n\nJednak wraz ze wzrostem napięcia między dwoma najbliższymi przyjaciółmi Argentyny w Europie kraj musi teraz przygotować się na nieuniknione rozdarcie między dwiema frakcjami. Co więcej, niezadowolenie w wojsku rośnie i nadal jest podsycana paranoja na punkcie ciągle drzemiącego rywala na północy. Argentyna stoi na rozdrożu i musi dokładnie przemyśleć, jak zareagować."
 CHL_GATHERING_STORM_DESC: "W wyniku krachu na Wall Street Stany Zjednoczone przestały importować miedź i saletrę z Chile, co było głównym źródłem dochodów tego kraju. Przez to Chile stało się najbardziej dotkniętym kryzysem gospodarczym krajem Ameryki Południowej, a niestabilność polityczna, którą kryzys tylko pogłębił, nie została jeszcze zażegnana. \n\nGdy kadencja Artura Alessandriego dobiega końca, ruch faszystowski rośnie w siłę, a kraj żywo pamięta przewroty z poprzedniej dekady, a także Socjalistyczną Republikę Chile z 1932 roku."
 CHL_BLITZKRIEG_DESC: "Po niedawnej, nieudanej próbie zamachu stanu Jorge Gonzáleza von Maréesa i jego kolegów z Nacistas Arturo Alessandri ustąpił ze stanowiska, a Pedro Aguirre Cerda został wybrany na nowego prezydenta Chile. Zagrożenie militarne wciąż jest jednak bliskie i wydaje się nieuchronne, że generał Ariosto Herrera i jego zwolennicy spróbują dokonać własnego przewrotu.\n\nKolejnym niebezpieczeństwem majaczącym na horyzoncie jest wojna, ponieważ napięcia rosną nie tylko w Europie i Azji, ale także w Amazonii, blisko chilijskiego terytorium."
 PAR_GATHERING_STORM_DESC: "Mimo że kraj ten właśnie wyszedł zwycięsko z krwawej wojny o Chaco przeciwko Boliwii, jest on wyczerpany gospodarczo i silnie zmilitaryzowany, a niepopularny Ayala nie jest w stanie opanować sytuacji, ponieważ to właśnie on - wraz z José Félixem Estigarribią, swoją prawą ręką - jest odpowiedzialny za wybuch tej wojny.\n\nWojsko popierające Rafaela Franco i socjalistyczny ruch febrerystów wydaje się przygotowywać do obalenia rządu i wszystko wskazuje na to, że nie ustąpi on bez walki."
 PAR_BLITZKRIEG_DESC: "Po tym, jak zamach stanu zorganizowany przez febrerystów doprowadził do obalenia Ayali i jego liberalnych popleczników, wielu pokłada nadzieję w Rafaelu Franco, licząc, że pomści on liczne upokorzenia, jakie spotkały naród, i ponownie zaatakuje Boliwię, choć wydaje się to coraz mniej prawdopodobne.\n\nNiektórzy oficerowie już knują spisek mający na celu obalenie go i wymianę na Higinio Morinigo przy pomocy faszystowskiej organizacji paramilitarnej Guión Rojo, dążąc do zacieśnienia więzi z państwami Osi."
 URG_GATHERING_STORM_DESC: "Podczas wydarzeń znanych jako urugwajski zamach stanu z 1933 roku prezydent Gabriel Terra obalił własny rząd, rozwiązując parlament i osłabiając kontrolę konstytucyjną, aby rządzić w coraz bardziej autorytarny sposób. Do tego momentu Urugwaj był jedną z najbardziej postępowych demokracji Ameryki Łacińskiej pod rządami José Batlle y Ordóñeza, który kierował się liberalną doktryną zwaną batllizmem.\n\nZadłużenie zagraniczne nie pomogło sytuacji politycznej i orientalna republika znalazła się pod rządami dyktatury, która nie może trwać wiecznie."
 URG_BLITZKRIEG_DESC: "Były dyktator Gabriel Terra przekazał niedawno władzę swojemu szwagrowi Alfredo Baldomirowi, który również należy do partii Colorado. Jako że jest on bardziej liberalny i przychylny aliantom, wydaje się, że kraj ten ponownie wkroczy na ścieżkę liberalnej demokracji, wspierając wielkie mocarstwa w utrzymaniu międzynarodowego porządku i prawa."
 AUS_GATHERING_STORM_DESC: "Austria wciąż jest wstrząśnięta \"samorozwiązaniem parlamentu\" z 1934 roku i późniejszym zabójstwem kanclerza Engelberta Dolfussa, więc nadal panuje tam duże napięcie. Związani surowym traktatem z Saint-Germain-En-Laye i zmagający się z kryzysem gospodarczym austriaccy przywódcy pod wodzą kanclerza Schuschnigga stają przed decyzjami na monumentalną skalę. Zaakceptować swój los, jeśli Niemcy uderzą? Stawiać opór do samego końca, dyplomatycznie lub militarnie? A może spojrzeć w przeszłość, przypomnieć sobie dawne cesarstwo i to, którym ma się stać?"
 AFG_GATHERING_STORM_DESC: "Pod rządami króla Zahira Szacha i jego wujów Afganistan staje się względnie stabilnym regionem. Ale pod powierzchnią wiecznego królestwa wciąż istnieją prądy nieufności i gniewu. Niektórzy liczą na radykalną modernizację, której próbował wygnany Amanullah Chan i który ponoć realizuje plan powrotu na tron. Natomiast inni wierzą, że ślimacze tempo zmian pod rządami Zahira Szacha nadal jest za szybkie, a kraj powinien wrócić do swoich tradycyjnych korzeni. Może jednak w obliczu destabilizacji całego świata obywatele Afganistanu zdołają się zjednoczyć, żeby wykorzystać tę sytuację."
 AFG_BLITZKRIEG_DESC: "Podczas gdy król Zahira Szach stara się odnaleźć w swojej roli, narastają wyzwania związane z jego rządami. Wielka Brytania, Niemcy i Związek Radziecki szarpią się o wpływy w strategicznie położonym królestwie, inwestując tam oraz grożąc interwencją. W międzyczasie wichrzyciele przekraczają granice z Cesarstwem Indyjskim i wywołują niepokoje po obu stronach. Ale skoro świat znowu znalazł się na krawędzi wojny, należy zapytać: co zrobi Afganistan?"
 BEL_GATHERING_STORM_DESC: "Belgia wciąż nosi blizny po doświadczeniach wielkiej wojny, duża część tego kraju wciąż jest w ruinie, a rany w psychice jej obywateli są jeszcze głębsze. Demokratyczna przyszłość tego kraju jest zagrożona, ponieważ frakcje faszystowskie oskarżają władze o korupcję. \n\nNa arenie międzynarodowej Belgia balansuje pomiędzy zobowiązaniami traktatowymi wobec tych, którzy zamienili ten kraj w pole bitwy, a obawami o dzisiejsze bezpieczeństwo w coraz bardziej niespokojnym świecie."
 BEL_BLITZKRIEG_DESC: "Sytuacja w Belgii nadal jest niestabilna, ale to nic w porównaniu do tego, co dzieje się na arenie światowej. Wojsko kraju przeszło rozbudowę i modernizację z wielkim naciskiem na fortyfikacje równie potężne co francuska Linia Maginota.\n\nBelgijski rząd porzucił swoich sojuszników i zadeklarował całkowitą neutralność, nie powstrzymało to jednak podpisywania zakulisowych umów na wypadek ataku. Belgia z niepokojem obserwuje rozbudowę militarną swojego sąsiada."
 COG_GATHERING_STORM_DESC: "Choć wciąż naznaczone piętnem Wolnego Państwa Kongo i króla Leopolda II, Kongo Belgijskie przebyło od tamtej pory długą drogę. Kolonijny rząd nadal korzysta z taniej siły roboczej w kopalniach, a większość mieszkańców kraju wali głowami w szklany sufit, nie będąc w stanie zdobyć wyższego wykształcenia. Nie wszystko jest jednak jeszcze stracone.\n\nKolonijne ambicje Włochów rosną coraz bardziej, a biorąc pod uwagę ich sukces w wielkiej wojnie, Force Publique pomimo pewnych braków ponownie zbroi się, by bronić swojego kraju."
 COG_BLITZKRIEG_DESC: "Włosi zakończyli podbój Abisynii, a Rzesza Niemiecka zdobywa nowe tereny w Europie, co sprawia, że sytuacja zaczyna wyglądać nieciekawie. Kolonijne ambicje Włochów sięgają dalej niż Afryka Wschodnia i mogą nam zagrozić w najbliższej przyszłości, natomiast Hitler interesuje się belgijskimi władcami w ramach swojego planu osiągnięcia hegemonii nad europejskim kontynentem.\n\nWygląda na to, że wojna zapuka niedługo do naszych drzwi, jeśli my nie wyjdziemy jej naprzeciw..."
 PER_GATHERING_STORM_DESC: "Wcześniej nazywany Persją wspaniały Iran znalazł się między młotem a kowadłem pomrukujących olbrzymów. Gdy neutralny Iran przechodzi szybką modernizację dzięki pomocy Rzeszy Niemieckiej, to dawni partnerzy w Wielkiej Brytanii i Związku Radzieckim patrzą na to z nieufnością. Reza Szach Pahlawi nie chce pozwolić, by te dwa kraje zagrażały irańskiej niepodległości, nawet jeśli może to doprowadzić do inwazji.\n\nCzy neutralność Iranu zostanie uszanowana? Czy jesteśmy gotowi do obrony ojczyzny przed nikczemnymi najeźdźcami? Jeżeli wszystko zawodzi, może czas spojrzeć w naszą przeszłość i wskrzesić ducha dawnego Imperium Perskiego..."
 IRQ_GATHERING_STORM_DESC: "Pod rządami króla Fajsala I, a później jego syna, króla Ghaziego, Irak próbuje radzić sobie ze skutkami wielkiej wojny jako brytyjskie terytorium mandatowe. Dynastia Haszymidów stara się równoważyć nacjonalizm z modernizacją, ale pod powierzchnią buzuje niezadowolenie. Przywódcy plemienni gardzą władzą centralną, a miejskie elity naciskają w sprawie większej niezależności od brytyjskich wpływów. Panarabskie nastroje zderzają się z rozmaitymi irakijskimi tożsamościami religijnymi i etnicznymi, które składają się na kruchą jedność. W miarę zbliżania się kolejnego wielkiego konfliktu światowego, Irak balansuje między wrzeniem a konsolidacją, jego przyszłość jest niepewna, ale pełna możliwości."
 IRQ_BLITZKRIEG_DESC: "W ostatnich latach Irak staje się coraz bardziej niespokojny. Przewrót w roku 1936, na czele którego stał Bakr Sidki, zniszczył kruchą władzę dynastii Haszymidów i stworzył niebezpieczny precedens wtrącania się wojska w politykę. Pod powierzchnią rosną napięcia między przywódcami plemiennymi, którzy opierają się centralizacji, reformatorów interesuje modernizacja, a niespokojna armia czuje się ośmielona świeżo zdobytą władzą. Rośnie panarabski nacjonalizm zwalczający wpływy brytyjskie i podsycający marzenia o jedności regionu. Równowaga światowa chwieje się, a Irak stanął na rozdrożu, ma przed sobą niepewną przyszłość, a jego obywatele są podzieleni."
 PER_BLITZKRIEG_DESC: "Iran stoi o krok od niepewnej i burzliwej przyszłości. Kiedy w Europie zaczyna się wojna, Reza Szach Pahlawi czuje zaniepokojenie, gdyż naciska go dwójka wielkich graczy, którzy wydają się zainteresowani udziałem w wielkim konflikcie.\n\nNiepodległość Iranu może stanąć pod znakiem zapytania, jeśli ktoś zapragnie zdobyć zasoby. Rząd szacha musi się przygotować na ewentualną inwazję. Ale czy zdąży zmobilizować siły?"
 PHI_GATHERING_STORM_DESC: "W 1935 roku Stany Zjednoczone w końcu zgodziły się na pokojowe dojście do niepodległości w ciągu dziesięciu lat. Filipiny są wciąż na początku tego procesu, ale mają coraz większą kontrolę nad własnym losem.\n\nCzy utrzymają więzi z USA, czy też poszukają zagranicznego wsparcia, aby przyspieszyć proces odzyskiwania wolności? Filipiny mają przed sobą świetlaną przyszłość, ale czy wokół tego młodego kraju nie krążą już rekiny?"
 SIA_BLITZKRIEG_DESC: "Od momentu przejęcia władzy pod koniec 1938 roku premier Phibunsongkhram odmienił Syjam na swój własny obraz. Kraj ma nową nazwę - Tajlandia - oraz nowe credo: dyscyplinę wojskową, wszechtajski nacjonalizm oraz ambicje terytorialne wobec ludów posługujących się językiem tajskim, które nadal pozostają pod francuskim i brytyjskim kolonialnym zwierzchnictwem.\n\nPodczas gdy Europa pogrąża się w wojnie, a Japonia coraz głębiej wkracza do Chin, armia Phibuna z dnia na dzień rośnie w siłę. Jego ambicje nie są tajemnicą. Jedynym pytaniem pozostaje, po czyjej stronie stanie Tajlandia, gdy nadejdzie decydujący moment."
 PHI_BLITZKRIEG_DESC: "Stany Zjednoczone dotrzymują jak dotąd słowa, wspierając Filipiny w dążeniu do niepodległości.\n\nTymczasem między Chinami a Japonią wybuchła wojna, a wyspiarskie państwo z niepokojem obserwuje imperialistyczne aspiracje swojego północnego sąsiada.\n\nAmerykańskie posiłki zaczęły przybywać, aby wzmocnić filipińską obronę, ale czy to wystarczy? Japonia wyczuła krew."
 SIA_GATHERING_STORM_DESC: "Minęły zaledwie cztery lata, odkąd grupa Khana Ratsadon położyła kres wielowiekowej monarchii absolutnej. Syjam stawia pierwsze kroki jako państwo konstytucyjne, ale jego jedność już zaczyna się chwiać: cywilni reformatorzy marzą o demokracji, podczas gdy wojsko domaga się siły, dyscypliny i wszechtajskiej ekspansji.\n\nSyjam otoczony przez brytyjskie i francuskie mocarstwa kolonialne oraz z rosnącą w siłę Japonią posuwającą się na północ musi zachować ostrożność. Nadchodząca burza może zmusić ten młody naród do wyboru jednej ze stron - albo znalezienia sposobu na przetrwanie bez sojuszników."
 INS_GATHERING_STORM_DESC: "Przez ponad trzy stulecia Holenderskie Indie Wschodnie były klejnotem w koronie kolonialnego imperium Holandii. Ten rozległy archipelag wysp, języków i kultur ledwo spajała kolonialna administracja.\n\nZ dnia na dzień kontrola Hagi słabnie. Ludność zmęczona wyzyskiem coraz bardziej otwiera się na nacjonalistyczne tendencje. Lecz ruchom tym daleko do jednogłośności, a ich wizje przyszłości Indonezji wykluczają się wzajemnie. O przyszłości Indii zadecyduje to, czy zdołają zniwelować dzielące ich różnice i przemówić wspólnym głosem."
 INS_BLITZKRIEG_DESC: "Trzy lata temu Soetardjo wraz z innymi składającymi petycję zwrócił się do Hagi z prośbą o zwołanie w ciągu dziesięciu lat konferencji poświęconej sprawie samorządności. W listopadzie ubiegłego roku nadszedł królewski dekret. Odpowiedź brzmiała: nie.\n\nOdmowa przyniosła efekt, którego nie udało się osiągnąć wieloletnim agitacjom. W maju osiem największych organizacji nacjonalistycznych odłożyło na bok spory i połączyło się w jedną federację, wspólnie domagając się utworzenia indonezyjskiego parlamentu. Kolonialna administracja odpowiada tak jak zawsze, ale Japonia posuwa się coraz dalej na południe przez Chiny, a Indie znajdują się daleko od Hagi."
