 idea_SIA_weather_broadcasts_desc: "Regularne prognozy pogody zapewniają naszym siłom powietrznym i morskim jasny obraz warunków atmosferycznych, co zwiększa ich skuteczność i obniża ryzyko działania w niekorzystnej pogodzie."
 idea_SIA_seri_thai_contacts: "Kontakty z Seri Thai"
 idea_SIA_seri_thai_contacts_desc: "Kontakty z siecią ruchu oporu Seri Thai okazują się cenne, zapewniają nam doświadczonych bojowników i wzmacniają więzi z aliantami."
 idea_SIA_secure_rubber_islands: "Kontrola nad wyspami kauczukowymi"
 idea_SIA_joint_military_command: "Połączone dowództwo wojsk"
