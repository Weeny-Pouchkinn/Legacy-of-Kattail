 # Root
 ABDA_abdacom: "Utworzenie ABDACOM"
 ABDA_abdacom_desc: "Wrogie mocarstwa szybko opanowują kolejne terytoria Azji Południowo-Wschodniej i Pacyfiku. By zatrzymać ich marsz, siły alianckie w regionie muszą działać wspólnie. Poprzez utworzenie połączonego naczelnego dowództwa możemy dzielić się zasobami, koordynować działania naszych sił morskich i wspólnie stanąć do walki z nieprzyjacielem."
 # Tier 1 - country-locked
 ABDA_fortress_singapore: "Forteca Singapur"
 ABDA_fortress_singapore_desc: "Singapur to filar naszej strategii obronnej w regionie. Modernizacja jego umocnień i skoszarowanie tam większych sił pozwoli nam zyskać czas na szerzej zakrojone działania ABDACOM i zapobiegnie błyskawicznemu zwycięstwu strategicznemu wroga."
 ABDA_corps_expeditionnaire: "CEFEO"
 ABDA_corps_expeditionnaire_desc: "Indochiny Francuskie znajdują się na północnej flance pierścienia obronnego ABDACOM. Wysłanie przez rząd [FRA.GetAdjective] Corps Expéditionnaire Français en Extrême-Orient do prowadzenia aktywnych działań da połączonemu dowództwu niezbędną siłę żywą oraz doświadczenie."
 ABDA_maintain_strategic_flexibility: "Zachowanie elastyczności strategicznej"
 ABDA_maintain_strategic_flexibility_desc: "Stany Zjednoczone nie mogą angażować zbyt wielkich sił w jednym teatrze działań. Rozważne zarządzanie naszą rezerwą strategiczną zagwarantuje, że siła amerykańskiego przemysłu i sił zbrojnych będą wykorzystywane w najbardziej newralgicznych miejscach na Pacyfiku."
 # Tier 2
 ABDA_the_malay_barrier: "Bariera malajska"
 ABDA_the_malay_barrier_desc: "Łańcuch wysp rozciągający się na obszarze Malaje-[INS.GetNonIdeologyName] tworzy naturalną barierę obronną. Wojska ABDA muszą wykorzystać tę cechę geograficzną i zbudować skoordynowaną obroną morską oraz lądową, która spowolni natarcie wroga."
 ABDA_develop_naval_infrastructure: "Rozwój infrastruktury marynarki wojennej"
 ABDA_develop_naval_infrastructure_desc: "Do prowadzenia długotrwałych działań morskich na Pacyfiku potrzebne są bazy, składy paliw i placówki naprawcze. Inwestycje w naszą infrastrukturę portową oraz kotwicowiska zwiększą zasięg i odporność sił morskich ABDA."
 # Tier 3
 ABDA_unified_naval_command: "Zjednoczone dowodzenie na morzu"
 ABDA_unified_naval_command_desc: "Dzięki zbudowaniu umocnień lądowych i infrastruktury, ABDA może teraz umieścić wszystkie siły morskie pod jednym, połączonym dowództwem. Ujednolicone sygnały, wymiana informacji wywiadowczych i koordynowanie tras patrolowych zwielokrotnią skuteczność każdego okrętu działającego w tym teatrze."
 # Tier 4
 ABDA_ship_a_day_sinking_quotas: "Dzienna norma zatopień"
 ABDA_ship_a_day_sinking_quotas_desc: "Linie zaopatrzenia biegnące przez Ocean Spokojny to słaby punkt nieprzyjaciela. Jeśli ABDACOM wyznaczy naszym okrętom podwodnym i jednostkom nawodnym agresywne i skoordynowane normy zatopień, możemy wykrwawić logistykę wroga oraz zepchnąć go do defensywy."
 ABDA_naval_procurement: "Zakupy marynarki wojennej"
 ABDA_naval_procurement_desc: "Poniesione straty wymagają natychmiastowych uzupełnień. Program skoordynowanych zakupów dokonywanych przez ABDACOM da priorytet niszczycielom, okrętom podwodnym i jednostkom patrolowym, które najlepiej sprawdzają się na Pacyfiku. Dzięki temu nasza połączona flota zyska potencjał do zatrzymania ekspansji wroga."
 ABDA_keep_trade_open: "Utrzymanie wymiany handlowej"
 ABDA_keep_trade_open_desc: "Kauczuk i ropa naftowa, których dostawcą jest [INS.GetNonIdeologyName], mają kluczowe znaczenie dla wysiłku wojennego aliantów. ABDACOM musi zabezpieczać szlaki morskie, którymi dostarcza się te ważne zasoby, a także chronić konwoje przed atakami wroga i utrzymać dostawy towarów dla naszego przemysłu."
 # Tier 5 - capstone
 ABDA_expand_the_command: "Rozbudowa dowództwa"
 ABDA_expand_the_command_desc: "ABDACOM udowodniło swoją wartość. Teraz możemy budować na tym fundamencie i rozszerzyć udział w tym formacie o inne kraje sojusznicze w regionie oraz zwiększyć wymianę informacji wywiadowczych i badawczych, aby utrzymać przewagę nad wrogiem."
