 HOL_curtail_colonial_autonomy_taog: "$HOL_curtail_colonial_autonomy$"
 HOL_curtail_colonial_autonomy_taog_desc: "$HOL_curtail_colonial_autonomy_desc$"
 HOL_taog_guarantee_colonial_loyalty: "Zagwarantowanie kolonialnej lojalności"
 HOL_taog_guarantee_colonial_loyalty_desc: "W Indiach Wschodnich nasilają się nastroje nacjonalistyczne i bez wątpienia szykuje się kolejna rewolucja. Chociaż ta, z którą mieliśmy do czynienia w 1927 r., została z łatwością stłumiona, nasze źródła donoszą, że tym razem możemy mieć do czynienia ze znacznie lepiej przygotowaną grupą rewolucjonistów. Być może jeśli poszlibyśmy na pewne ustępstwa wobec pokojowego ruchu nacjonalistycznego Soetardjo, udałoby się nam odwrócić uwagę ludności cywilnej od rewolucji i skierować ją w stronę Soetardjo?"
 HOL_taog_guarantee_colonial_loyalty_tt: "§WGwarantuje, że [INS.GetNameDef] nie rozpocznie rewolucji.§!\n[INS.GetNameDef] podejmie próbę pokojowego ogłoszenia niepodległości. Można to powstrzymać, wykonując cel §Y$INSHOL_industrialized_colony$§!, który wymaga znacznych inwestycji w kolonię."
