 # Alternative Communist Focus
 SIA_the_peoples_war_in_asia: "Wojna ludowa w Azji"
 SIA_the_peoples_war_in_asia_desc: "Zmagania z [JAP.GetAdjective] imperializmem to nie tylko konflikt państw. To wojna robotników, wieśniaków i żołnierzy z zagraniczną dominacją. Stając po stronie sił komunistów w Chinach, państwo [ROOT.GetAdjective] zaangażuje się w wojnę ludową na większą skalę na terenie całej Azji."
 SIA_peoples_war_in_asia_idea: "Wojna ludowa w Azji"
 SIA_peoples_war_in_asia_idea_desc: "W wojnie bierze udział nie tylko zawodowe wojsko. Lokalne komitety, partyzanccy przewodnicy i wiejskie kolumny zaopatrzenia również służą teraz armii na polu walki. Każda wioska zmieniła się w skład zaopatrzenia, każda droga jest możliwym miejscem zasadzki, a każdy odwrót szansą na zwabienie wroga w głąb lądu."
 # Alternative Nationalist Focus
 SIA_national_defense_in_asia: "Narodowa obrona w Azji"
 SIA_national_defense_in_asia_desc: "Obrona Azji wymaga dyscypliny, hierarchii i wspólnego celu strategicznego. Stając po stronie nacjonalistycznego rządu Chin, państwo [ROOT.GetAdjective] dołączy do koalicji, której celem jest stawienie oporu [JAP.GetAdjective] ekspansji przy pomocy zorganizowanych armii i skoordynowanego dowództwa."
 SIA_national_defense_in_asia_tt: "§Y[ROOT.GetNameWithFlag]§! dołącza do nacjonalistycznych sił zjednoczonego frontu.\nDodaje §Y$SIA_national_defense_in_asia_idea$§!, co zapewnia:\n $MODIFIER_ARMY_ORG_FACTOR$: §G+5%§!\n $MODIFIER_PLANNING_SPEED$: §G+10%§!\n $MODIFIER_MAX_PLANNING$: §G+10%§!\n $MODIFIERS_ARMY_DEFENCE_FACTOR$: §G+5%§!"
 SIA_stronger_together: "Razem silniejsi"
 SIA_stronger_together_desc: "Wojna zredukowała odległe obietnice i równoległe sojusze do zaledwie przeszkód. Jeśli [ROOT.GetAdjective] państwo ma kształtować przyszłość Azji, musimy poprosić sprzymierzeńców o zjednoczenie się z nami i podporządkowanie wspólnemu dowództwu w nadchodzącym starciu."
 idea_SIA_national_defense_in_asia: "Narodowa obrona w Azji"
 SIA_directorate_of_aeronautical_engineering_desc: "Przyszłość [ROOT.GetAdjective] sił powietrznych nie zależy wyłącznie od pilotów. Wymaga inżynierów, inspektorów, zakładów i władzy centralnej, która zdoła przekształcić kupione za granicą samoloty w sprawne jednostki. Podstawą tego przedsięwzięcia będzie Dyrekcja ds. Inżynierii Lotniczej."
 idea_SIA_aeronautical_engineering_directorate: "Dyrekcja ds. Inżynierii Lotniczej"
 SIA_standardize_aircraft_maintenance: "Standaryzacja serwisowania samolotów"
 SIA_standardize_aircraft_maintenance_desc: "Nasze samoloty pochodzą z wielu źródeł, co skutkuje zróżnicowaniem części, narzędzi i nawyków naprawy. Wprowadzając ustandaryzowane procedury serwisowania nadzorowane przez Dyrekcję, państwo [ROOT.GetAdjective] będzie mogło posługiwać się większą ilością samolotów naraz przy jednoczesnym zredukowaniu chaosu panującego na ziemi."
 SIA_expand_aircraft_workshops: "Rozbudowa zakładów lotniczych"
 SIA_expand_aircraft_workshops_desc: "Dyrekcja potrzebuje czegoś więcej niż biura i raporty z inspekcji. Nowe zakłady, narzędzia mechaniczne i wyszkoleni mechanicy umożliwią lokalną naprawę uszkodzonych pojazdów i produkcję części bez oczekiwania na dostawy zza granicy."
 SIA_license_modern_airframes: "Licencje na nowoczesne samoloty"
 SIA_license_modern_airframes_desc: "[ROOT.GetNameDefCap] nie może jeszcze projektować wszystkich potrzebnych samolotów. Bardziej praktycznym podejściem jest zakup zagranicznej licencji, przeanalizowanie jej i przystosowanie na jej podstawie do naszego klimatu lotnisk i warunków zaopatrzenia pod nadzorem Dyrekcji."
 SIA_tropical_air_operations: "Operacje lotnictwa tropikalnego"
 SIA_tropical_air_operations_desc: "Upał, wilgoć, monsuny i nierówne pola to wymagające warunki dla samolotów i ich załóg. Gdy Dyrekcja dostosuje do nich silniki, harmonogramy napraw i doktryny dla pilotów, zwiększy niezawodność naszych sił powietrznych nad Azją Południowo-Wschodnią."
 ##########
 #### AUSTRALIA ####
 ###################
 effects_of_event_tt: "\n§YEfekty wydarzenia§!:"
 AST_war_is_coming: "Nadciąga wojna"
 AST_war_is_coming_desc: "Choć ostatnie trzy dziesięciolecia naznaczone były nieustannymi zmaganiami, na horyzoncie majaczy jeszcze jedno wyzwanie, które ostatecznie przetestuje siłę australijskiej demokracji. Były premier Billy Hughes wyraża się w tej sprawie jasno i lekceważenie jego stwierdzeń o zbliżającej się wojnie byłoby z naszej strony niezwykle nieodpowiedzialne."
 AST_war_is_coming_tt: "\nOdblokuj §Ydemokratyczne wybory§!"
 AST_war_is_coming_uap_advisors_tt: "(§Y$AST_billy_hughes$§!):"
 AST_war_is_coming_alp_advisors_tt: "(§Y$AST_james_scullin$§!):"
 AST_war_is_coming_decrease_advisors_tt: "(§Y$AST_maurice_blackburn$§!):"
 AST_war_is_coming_advisors_tt: "\nModyfikacja doradcy politycznego:"
 AST_advance_pacific_initiatives: "Uruchomienie inicjatyw pacyficznych"
 AST_advance_pacific_initiatives_desc: "Dzięki zawartym przez nas paktom o nieagresji poprawiliśmy stosunki z naszymi azjatyckimi sąsiadami. Będziemy dalej wykorzystywać te relacje i zwracać się do naszych nowych sojuszników o pomoc w rozbudowie naszego przemysłu."
 AST_advance_pacific_initiatives_tt: "\nZawarcie paktu o nieagresji z:"
 AST_advance_pacific_initiatives_jap_tt: " §Y[JAP.GetName]§!, aby dodać do efektów §G2§! §Ystocznie§! poza mapą."
 AST_advance_pacific_initiatives_ins_tt: " §Y[INS.GetName]§!, aby dodać do efektów §G1§! §Yrafinerię paliw syntetycznych§! poza mapą."
 AST_advance_pacific_initiatives_chi_tt: " §Y[CHI.GetName]§!, aby dodać do efektów §G2§! §Yfabryki cywilne§! poza mapą."
 AST_advance_pacific_initiatives_jap_2_tt: "§Y[JAP.GetName]§! oferuje:"
 AST_advance_pacific_initiatives_ins_2_tt: "§Y[INS.GetName]§! oferuje:"
 AST_advance_pacific_initiatives_chi_2_tt: "§Y[CHI.GetName]§! oferuje:"
 AST_advance_pacific_initiatives_2_tt: "\nBudynki zostaną usunięte, jeżeli dany kraj będzie z nami w stanie wojny."
 AST_pacific_initiatives_modifier: "Inicjatywy dyplomatyczne"
 AST_domestic_industry: "Krajowy przemysł"
 AST_domestic_industry_desc: "Nie możemy liczyć na to, że w razie wojny zaopatrywać nas będzie przemysł obronny naszych sojuszników. Musimy rozbudować nasze własne zdolności produkcyjne, aby przygotować się na każdy scenariusz."
 AST_a_democratic_bulwark: "Bastion demokracji"
 AST_a_democratic_bulwark_desc: "Tylko dzięki demokracji możemy stawić czoła faszyzmowi i komunizmowi. Rząd rozpocznie proaktywne działania zmierzające do tego, by obywatele byli reprezentowani w organach rządowych i by złagodzić niezadowolenie polityków poprzez dołączenie do różnych partii demokratycznych zamiast tych wyznających szkodliwe ideologie."
 AST_the_pacific_pact: "Pakt pacyficzny"
 AST_the_pacific_pact_desc: "Uruchomione w 1934 roku przez Lyonsa inicjatywy pacyficzne doprowadziły do nawiązania kontaktów między Australią a dużymi krajami Azji, dzięki czemu nasz kraj nie musi już polegać na brytyjskich urzędnikach w kwestii reprezentowania naszych interesów. Ostatecznym celem naszych wysiłków dyplomatycznych byłoby wykorzystanie tych relacji, by zagwarantować, że żadne mocarstwo azjatyckie nie zaatakuje Australii. To duże wyzwanie, lecz z pewnością warte zachodu."
 AST_a_collapsing_league_of_nations: "Upadająca Liga Narodów"
 AST_a_collapsing_league_of_nations_desc: "Liga Narodów to inicjatywa podjęta w dobrych intencjach i niestety oparta na mało realistycznych założeniach, która właśnie upada. Sankcje szybko stały się jedynie pustymi gestami, zwłaszcza że Liga nie ma sił zbrojnych, za pomocą których mogłaby powstrzymywać niepokorne nacje. Musimy rozpocząć ponowne zbrojenia."
 AST_department_of_munitions: "Departament Uzbrojenia"
 AST_department_of_munitions_desc: "Chcąc właściwie zaopatrywać naszych żołnierzy na froncie, musimy przyspieszyć produkcję uzbrojenia. Poprzez ustanowienie Departamentu Uzbrojenia możemy zapewnić zwiększony nadzór nad produkcją elementów naszej obrony."
 AST_call_for_a_referendum: "Wezwanie do przeprowadzenia referendum"
 AST_call_for_a_referendum_desc: "Chcemy zwiększyć kontrolę rządu federalnego, lecz w tym celu potrzebujemy najpierw zgody naszych wyborców. Możemy tego dokonać poprzez przeprowadzenie referendum."
 AST_rural_concessions: "Ustępstwa wobec wsi"
 AST_rural_concessions_desc: "Reprezentanci wsi z Partii Agrarnej zdobywają zbyt mało głosów, by samodzielnie rządzić, ale oferując im wpływ na australijską politykę, my - jako obecna partia rządząca - możemy zyskać dodatkowe poparcie."
 AST_rural_concessions_tt: "\nCel §Y$AST_country_party_influence_uap$§! zwiększy ilość głosów na rządzącą partię po jego wykonaniu."
 AST_solidarity_by_the_empire: "Solidarność ze strony imperium"
 AST_solidarity_by_the_empire_desc: "Do tej pory Imperium Brytyjskie przewodziło nam zarówno w czasach wojny, jak i pokoju. Nadal będziemy cenić ich rady i współpracować z nimi przy przygotowaniach do potencjalnych konfliktów."
 AST_solidarity_by_the_empire_modifier: "Solidarność ze strony imperium"
 AST_wool_agreement: "Porozumienie w sprawie wełny"
 AST_wool_agreement_desc: "Wełna jest jednym z najlepszych produktów komercyjnych Australii. Jej sprzedaż nie tylko przynosi zyski, ale także poprawia relacje z krajami, które ją importują. Jednak Brytyjczycy domagają się jej w zasadzie w całości, częściowo do produkcji mundurów dla żołnierzy, ale także do negocjacji z państwami, w których tego surowca brakuje. Spełnimy te żądania."
 AST_australian_war_cabinet: "Australijska rada wojenna"
 AST_australian_war_cabinet_desc: "Za namową Zjednoczonego Królestwa powołamy własną radę wojenną. Będzie się ona skupiać wyłącznie na bezpieczeństwie narodowym, co pozwoli na skuteczny i strategiczny proces decyzyjny."
 AST_singapore_strategy: "Strategia singapurska"
 AST_singapore_strategy_desc: "Strategia singapurska jest jednym z podstawowych elementów polityki obronnej Australii. Terytorium samego Singapuru ma ogromne znaczenie, jako że znajduje się tam baza okrętów Królewskiej Marynarki Wojennej stacjonujących w rejonie Pacyfiku. Przekonamy Brytyjczyków, by wybudowali tam dodatkowe umocnienia, natomiast my zwiększymy potencjał australijskiej marynarki wojennej."
 AST_singapore_strategy_tt: "Po §Y180§! dniach (§YSingapur§!):\n Dodanie §G2§! §Ybaz lotniczych§!.\n Dodanie §G2§! §Ybaz morskich§!.\n Dodanie §G1§! §Yfortyfikacji brzegowej§!."
 AST_british_war_cabinet: "Brytyjska rada wojenna"
 AST_british_war_cabinet_desc: "Wojna stała się faktem. Zjednoczone Królestwo powołało radę wojenną w celu skutecznego prowadzenia sojuszniczych działań wojennych. Nas również wezwali, abyśmy podzielili się swoim stanowiskiem w tej sprawie, toteż na radę wyruszy nasz premier, by reprezentować australijskie interesy."
 potential_consequence_tt: "§YPotencjalne konsekwencje§!:\n"
 AST_british_pacific_fleet: "Brytyjska flota na Pacyfiku"
 AST_british_pacific_fleet_desc: "Brytyjska obecność na Pacyfiku będzie kluczowa, zarówno by odstraszyć okręty wroga rozszerzającego swoją dominację na południe, jak i bronić się przed nimi. Będąc częścią frakcji [Root.GetFactionName], podejmiemy działania w celu ustanowienia wspólnej struktury dowodzenia, aby chronić nasze wody przybrzeżne."
 AST_all_dressed_up: "Pełne wyposażenie"
 AST_all_dressed_up_desc: "Jeśli australijscy żołnierze mają brać udział w brytyjskich wojnach, zaopatrywać ich będą brytyjskie fabryki."
 AST_overseas_loyalties: "Lojalność za granicą"
 AST_overseas_loyalties_desc: "Nadal będziemy brać udział w wojnach poza granicami kraju, po raz kolejny potwierdzając, że żadne terytorium nie jest dla australijskich żołnierzy obce. To nie wojny nas nawiedzają, tylko my je."
 AST_the_ultimate_overseas_duty: "Najważniejszy obowiązek wobec zagranicy"
 AST_the_ultimate_overseas_duty_desc: "Niewłaściwe pełnienie obowiązków przez premiera Wielkiej Brytanii spowodowało nieufność ze strony jego własnych ministrów. Menzies wywarł ogromne wrażenie podczas narad brytyjskiej rady wojennej, dlatego też niektórzy sugerują, że może on być lepszym kandydatem dla Brytyjczyków. Jeśli obejmie rządy nad Wspólnotą Narodów, będziemy mogli wykorzystać jego lojalność wobec [AST.GetAdjective] państwa i zwiększyć naszą władzę."
 AST_the_ultimate_overseas_duty_tt: "\nJeśli §Y$AST_robert_menzies$§! pełni rolę przywódcy §Y[ENG.GetAdjective] państwa§!, cel §Y$AST_a_change_of_authority$§! może zmienić się w: §Y$autonomy_associated_dominion$§!."
 AST_pleading_britain: "Błagać Brytyjczyków"
 AST_pleading_britain_desc: "Wojna nieuchronnie nadciąga, co powoduje u nas wielkie obawy. Z całym szacunkiem dla ducha australijskich i nowozelandzkich żołnierzy oraz reputacji kopaczy, bez [ENG.GetAdjective] pomocy możliwości prowadzenia wojny przez Australię szybko by się skończyły. Nasz premier i [ENG.GetLeader] muszą niezwłocznie ze sobą porozmawiać."
 AST_bound_once_more: "Odnowiona więź"
 AST_bound_once_more_desc: "Nasze rozdzielone drogi na powrót się złączą. [ENG.GetNameDefCap] i [AST.GetName] przechodzą narodowe zmiany, ale dystans, który powstał przez nie między nami to zaledwie niechciany i niekorzystny skutek. Przynajmniej z naszej perspektywy. Nawiążemy sojusz ponownie i wspólnie pokonamy przeszkody związane ze zmianami w naszych krajach."
 AST_eng_to_ast_faction_tt: "§Y[ENG.GetName]§! i jej poddani dołączą do frakcji §Y[AST.GetFactionName]§!."
 AST_faction_leader_tt: "Wyznacz na przywódcę frakcji §Y[AST.GetFactionName]§!."
 AST_eng_as_faction_leader_tt: "\n([ENG.GetFlag]§Y[ENG.GetName]§!) $AST_faction_leader_tt$."
 AST_australian_command: "Australijskie dowództwo"
 AST_australian_command_desc: "Nawet [ENG.GetNameDef] dostrzega znaczenie obrony i bezpieczeństwa Australii, dlatego też potrzebna jest reorganizacja naszych połączonych sił. Gdy pod australijskim dowództwem znajdzie się więcej wojsk brytyjskich, przeprowadzane działania wojenne będą skuteczniejsze."
 AST_taking_the_helm: "Przejęcie steru"
 AST_taking_the_helm_desc: "Nasze wpływy w Azji Południowo-Wschodniej rosną, dlatego nasz potencjał morski musi wystarczyć do ich obrony. Skupimy się na dalszych inwestycjach w Królewską Australijską Marynarkę Wojenną i obejmiemy kontrolę nad wschodnimi morzami."
 AST_eastern_focus: "Koncentracja na wschodzie"
 AST_eastern_focus_desc: "Skoro brytyjskie wojny są również wojnami australijskimi, to działa to również w drugą stronę. Zagrożenie japońskim atakiem jest znane od dawna, a my nie będziemy już dłużej biernie oczekiwać na rozpoczęcie konfliktu. Pokażemy Japończykom naszą determinację, podczas gdy Brytyjczycy dowiodą swej lojalności najodważniejszą deklaracją z możliwych: wypowiedzeniem wojny."
 AST_eastern_focus_tt: "\nDzięki tej misji §Y[ENG.GetNameDef]§! otrzyma możliwość natychmiastowego wypowiedzenia wojny władzom §Y[JAP.GetAdjective]§! i będzie mieć obowiązek zrobić to w ciągu 180 dni. §Y[ENG.GetNameDefCap]§! może opóźnić wykonanie tej misji, jeśli sfinansuje budowę australijskiej obrony."
 AST_holding_the_battlefield: "Utrzymanie pola bitwy"
 AST_holding_the_battlefield_desc: "Wielu australijskich żołnierzy poległo za granicą, a ich wysiłki zostały uznane za brytyjskie. Australia domaga się większej roli u boku [ENG.GetAdjective] władz na konferencjach pokojowych, w przeciwnym wypadku możemy zaprzestać dalszego wsparcia."
 AST_holding_the_battlefield_tt: "§YZmniejsz koszt§! działania §Ypaństwa marionetkowego§! i §Yzajmij regiony§! na konferencjach pokojowych z: §Y[ENG.GetNameDef]§!."
 AST_a_change_of_authority: "Zmieniający się autorytet"
 AST_a_change_of_authority_desc: "Australia zmieniła się z posłusznego poddanego w szanowany i asertywny naród. Czas na ostateczny krok do stania się jednym ze światowych mocarstw. Sojusznicy szanują nas jako przywódcę frakcji [AST.GetFactionName], a wrogowie drżą ze strachu. Australia umocni swoją pozycję i nigdy się nie podda."
 AST_a_change_of_authority_tt: " §Y[ROOT.GetName]§! może wypowiadać wojny.\n §Y[ROOT.GetName]§! może odrzucać wezwania do wojny.\n §Y[ROOT.GetName]§! nie przekazuje już wskaźnika pokoju swojemu suwerenowi."
 AST_reinforcements: "Uzupełnienia"
 AST_reinforcements_desc: "W zazwyczaj słabo rozwiniętych rejonach na północy kraju wzniesiemy konstrukcje obronne i bazy lotnicze."
 AST_weekly_stability_tt: "Stabilizacja tygodniowa: §G+1,00%§!"
 AST_ending_overseas_conscription: "Zakończenie służby za granicą"
 AST_ending_overseas_conscription_desc: "Nasi żołnierze muszą natychmiast wrócić do kraju, są tutaj potrzebni."
 AST_unlocking_conscription_1903_tt: "Wymagane do odblokowania §Yprawa służby wojskowej§!."
 AST_unlocking_further_conscription_tt: "Do odblokowania §Ypełnego poboru§! lub §Yobowiązkowej służby§! potrzebujesz dowolnego z następujących celów: §Y$AST_british_pact$§! (faszyzm), §Y$AST_refuse_british_wars$§! (faszyzm), §Y$AST_toe_the_line$§! (faszyzm), §Y$AST_from_picket_line_to_front_line$§! (komunizm) lub §Y$AST_part_with_colonizer$§! (komunizm)."
 AST_unlocking_conscription_tt: "Jeśli masz też §Y$AST_invoke_the_1903_defence_act$§!, odblokujesz wszystkie pozostałe §Yprawa służby wojskowej§!."
 AST_an_uncle_for_father_figure: "Ceniony wuj"
 AST_an_uncle_for_father_figure_desc: "Brakuje nam nowoczesnego uzbrojenia, dlatego też zwrócimy się z prośbą o taki sprzęt do [USA.GetAdjective] władz."
 AST_seven_million_britishers: "Siedem milionów Brytyjczyków"
 AST_seven_million_britishers_desc: "Choć [ENG.GetLeader] niechętnie składa jakiekolwiek obietnice, wierzymy, że gdy przyjdzie co do czego, on i cała Wielka Brytania nam pomogą, a [AST.GetNameDef] nie pozostanie sama. W końcu jesteśmy tylko siedmioma milionami Brytyjczyków."
 AST_seven_million_britishers_reinforcements_tt: "\n§Y$AST_reinforcements$ - brak ukończenia§!:"
 AST_seven_million_britishers_conscription_tt: "\n§Y$AST_ending_overseas_conscription$ - brak ukończenia§!:"
 AST_seven_million_britishers_uncle_tt: "\n§Y$AST_an_uncle_for_father_figure$ - brak ukończenia§!:"
 AST_we_endured: "Przetrwaliśmy"
 AST_we_endured_desc: "Zapowiedź nadciągającego konfliktu może być z początku przytłaczająca, lecz była ona przydatna, gdy użyliśmy jej do przyspieszenia rozbudowy naszych zdolności obronnych. Przetrwaliśmy i nadal trwać będziemy, całkowicie oddani naszemu najważniejszemu celowi: zwycięstwu w wojnie."
 AST_under_the_rule_of_canberra: "Pod rządami Canberry"
 AST_under_the_rule_of_canberra_desc: "Narastające napięcia między krajami na Pacyfiku są niepokojące, a ponadto nie jesteśmy przekonani, że zajęci własnymi bitwami Brytyjczycy przybędą nam z pomocą. Gdybyśmy odtworzyli Brytyjską Wspólnotę Narodów, a kraje Oceanu Spokojnego oraz Indyjskiego byłyby administrowane bezpośrednio przez Canberrę, być może moglibyśmy zjednoczyć się i utworzyć wspólny front, nawet bez pomocy [ENG.GetAdjective] władz."
 AST_its_fight_work_or_perish: "Walcz, pracuj albo giń"
 AST_its_fight_work_or_perish_desc: "Wybuchła wojna i pozostało jedynie udowodnić, że jesteśmy na nią gotowi."
 AST_no_foreign_battlefields: "Żadnej walki za granicą"
 AST_no_foreign_battlefields_desc: "Spodziewaliśmy się tego od dawna, ale rząd wreszcie ogłosi zakaz stosowania przymusu wobec obywateli w celu mobilizacji do służby wojskowej za granicą."
 AST_no_foreign_battlefields_modifier: "Żadnej walki za granicą"
 AST_platypus_modifier: "Podarowany dziobak"
 AST_aerial_defense: "Obrona powietrzna"
 AST_aerial_defense_desc: "Jeśli nie możemy sobie pozwolić, a tak właśnie jest, na marynarkę wojenną zbliżoną do światowych mocarstw, to wciąż w naszym zasięgu jest utrzymanie floty powietrznej mogącej z powodzeniem walczyć z tym, czym mogą nas wrogowie zaatakować."
 AST_ratify_westminster_adoption_act: "Ratyfikacja ustawy o przyjęciu statutu westminsterskiego"
 AST_ratify_westminster_adoption_act_desc: "Mimo kontrowersji, jaką może wywołać zmiana tradycyjnej polityki, już dawno należało ratyfikować ustawę o przyjęciu statutu westminsterskiego. Sami będziemy decydować o tym, które wojny są naszymi."
 AST_ratify_westminster_adoption_act_tt: "£GFX_trigger_no Może odrzucić wezwanie do wojny"
 AST_administer_the_mandate: "Sprawowanie mandatu"
 AST_administer_the_mandate_desc: "Jako że od roku 1920 władamy Nową Gwineą zgodnie z mandatem nadanym przez Ligę Narodów, a Papua stanowi zewnętrzne [AST.GetAdjective] terytorium niemalże od zawiązania federacji, wschodnia część Papui Nowej Gwinei byłaby naturalnym uzupełnieniem prowincji narodowych naszego kraju. Obecnie, gdy Liga Narodów została rozwiązana, pojawiła się sposobność przeprowadzenia takiej reorganizacji naszej federacji."
 AST_a_rational_request: "Rozsądna propozycja"
 AST_a_rational_request_desc: "Strategia singapurska w teorii się sprawdza, ale tylko w teorii. Henry Wynter i inni zaciekli mówcy od samego początku mieli rację. Gdy wybuchnie wojna na Pacyfiku, Wielka Brytania prawdopodobnie będzie zajęta walką na własnym kontynencie, więc strategia zbudowana na tym, że Brytyjczycy przybędą z pomocą, po prostu się nie sprawdzi. Powinniśmy poprosić o kontrolę nad Singapurem, abyśmy sami byli odpowiedzialni za ochronę naszych oceanów."
 add_trait_to_theorist_tt: "Dodaj specjalizację dla §Yteoretyka§!:"
 AST_volunteers: "Ochotnicy"
 AST_volunteers_desc: "Najważniejsze, by mieć wybór. Możliwość odmówienia wezwania do broni nie oznacza, że Australia zawsze to zrobi. Australijczycy powinni mieć prawo, by walczyć za słuszną sprawę, czy to na własnej, czy też obcej ziemi."
 AST_until_the_tide_of_battle_swings: "Póki los bitwy się nie odmieni"
 AST_until_the_tide_of_battle_swings_desc: "Zamierzamy jasno ogłosić publicznie, że nie będziemy dłużej ignorować zagrożenia kotłującego się na naszym podwórku. Nie zgadzamy się na przyjęcie polityki, według której zmagania na Pacyfiku mają być traktowane jako podrzędne wobec głównego konfliktu. Australia natychmiast rozpocznie przygotowania do inwazji."
 AST_walls_and_whispers: "Mury i szepty"
 AST_walls_and_whispers_desc: "Potężne mury i uważne śledzenie wydarzeń to podstawa potencjału bezpieczeństwa narodowego. Podejmiemy kroki, by usprawnić siły obronne na lądzie i wybrzeżach oraz stworzyć siedzibę wywiadu."
 AST_united_states_as_our_keystone: "Stany Zjednoczone jako nasz fundament"
 AST_united_states_as_our_keystone_desc: "Znamy problemy, z którymi mierzy się Zjednoczone Królestwo. Znamy zagrożenia płynące z rozproszenia siły, lecz wiemy też, że Wielka Brytania przetrwa nawet w obliczu klęski Australii. Jesteśmy zatem zdeterminowani, by do niej nie dopuścić, i dołożymy wszelkich starań, by opracować plan oparty na wsparciu Stanów Zjednoczonych."
 AST_liberty_loans: "Wolnościowe pożyczki"
 AST_liberty_loans_desc: "Jako skarbnik - niektórzy nawet twierdzą, że najlepszy w historii kraju - Ben Chifley udowodnił, że potrafi zarządzać gospodarką w czasie wojny. Rekomendując go, zachęcimy obywateli do oszczędzania nadwyżek swoich dochodów i inwestowania w pożyczki wojenne."
 AST_inevitably_independent: "Nieuchronna niepodległość"
 AST_inevitably_independent_desc: "Choć Partia Zjednoczonej Australii zawsze ceniła sobie brytyjskie obywatelstwo, [ENG.GetAdjective] obojętność wobec australijskich interesów zmusiła nas do ogłoszenia niepodległości i skupienia się na własnej obronie. Służba w brytyjskich wojnach za granicą przestała być problemem, dlatego nawet przeciwnicy lojalizmu są bardziej posłuszni i pobór na większą skalę spotka się z mniejszym oporem."
 AST_bring_on_the_giant: "Wsparcie giganta"
 AST_bring_on_the_giant_desc: "Jako w końcu zjednoczony i niezależny naród wkrótce zostaniemy poddani próbie odwagi. Wydaje się, że po drugiej stronie Pacyfiku podzielają nasze poglądy, a dzięki dobrze rozwiniętemu przemysłowi zbrojeniowemu [USA.GetAdjective] państwo może użyczyć australijskim żołnierzom nadwyżek wyposażenia, co przyniesie korzyści obu stronom."
 AST_bring_on_the_giant_tt: "  Jeśli §Y[USA.GetAdjective] władze§! wyrażą zgodę:\n §Y50§! jednostek §Ykonwojowych§! zostanie dodanych do zapasów narodowych."
 AST_allied_after_all: "Jednak sprzymierzeni"
 AST_allied_after_all_desc: "Choć australijska niepodległość była koniecznością, współpraca z naszym dawnym suwerenem nie ustanie. Pozostaniemy lojalni [ENG.GetAdjective] państwu, lecz będziemy dążyć do zyskania większych wpływów w obrębie naszej frakcji."
 AST_the_pacific_resistance: "Ruch oporu na Oceanie Spokojnym"
 AST_the_pacific_resistance_desc: "Australijska niepodległość wreszcie stała się rzeczywistością i mamy pełne prawo odstąpić również od brytyjskich działań wojennych. Jeśli zamiast tego nawiążemy sojusz z [USA.GetAdjective] państwem, będziemy mogli tworzyć wspólne strategie uwzględniające australijskie interesy i stanowić jednocześnie niezależną kontrolę nad własnym przemysłem obronnym i jego rozwojem."
 AST_the_pacific_resistance_tt1: "§YAustralia§! dołącza do: §Y[USA.GetFactionName]§!."
 AST_the_pacific_resistance_tt2: "Do §YRuchu oporu na Oceanie Spokojnym§! dołącza: §Y[USA.GetName]§!."
 AST_conscription_at_last: "W końcu pobór"
 AST_conscription_at_last_desc: "Niepodległość smakuje słodko, gdy uświadamiamy sobie, że mamy teraz prawo decydować o priorytetach naszej obrony - ale z tą władzą wiążą się również obowiązki. Obowiązkowej służby wojskowej nie należy pochopnie rozszerzać, ale w obliczu zbliżającej się wojny stało się to konieczne."
 AST_equal_training: "Równe przeszkolenie"
 AST_equal_training_desc: "Nie możemy zakładać, że współpraca z sojusznikami będzie funkcjonować bez naszego udziału - należy ją dopracowywać. Australia podejmie się zorganizowania wspólnych obozów szkoleniowych dla narodów z frakcji [ROOT.GetFactionName] i dopilnuje, aby wszyscy żołnierze otrzymali równie rygorystyczne przeszkolenie."
 AST_a_northern_barrier: "Północna bariera"
 AST_a_northern_barrier_desc: "Wróg nadchodzi z północy, a na jego drodze znajdują się małe, nieprzygotowane państwa, które może swobodnie zaatakować, nim stanie na naszym progu. Jeśli zjednoczymy się z [INS.GetAdjective] krajem, by utworzyć jednolitą barierę, może zdołamy go powstrzymać."
 AST_demand_resources: "Żądania zasobów"
 AST_demand_resources_desc: "Ekspansjonistyczni agresorzy widzą w Indochinach nie tylko terytorium do zajęcia, lecz także zasoby do zagarnięcia. Jeśli bogactwa te trafią w ręce wroga, spowodują wydłużenie wojny, podczas gdy my moglibyśmy z ich pomocą ją zakończyć. Poprosimy o wydanie tych zasobów. Jeśli ich właściciele odmówią współpracy, mogą równie dobrze stanąć po stronie wroga."
 AST_demand_resources_tt: "Odblokuj decyzje §Y$AST_resource_acquisition_cat$§! umożliwiające prośbę o udział w zasobach krajów Azji Południowo-Wschodniej."
 AST_reclaim_the_lost_territory: "Odzyskanie utraconego terytorium"
 AST_reclaim_the_lost_territory_desc: "Nowa Zelandia postanowiła ostatecznie nie brać udziału w procesie jednoczenia australijskich kolonii w federację. Lecz od tamtej pory konstytucja definiuje ją jako jeden z potencjalnych regionów australijskiej Wspólnoty Narodów i zezwala jej na dołączenie. Przypomnijmy o tym wschodnim sąsiadom, argumentując, że obecna sytuacja na świecie wymaga od nas jedności."
 AST_reclaim_the_lost_territory_tt: "([NZL.GetFlag]§Y[NZL.GetName]§!) przekazuje wszystkie swoje siły lądowe, morskie i powietrzne na rzecz: §Y[AST.GetNameDef]§!"
 AST_australia_first: "Australia przede wszystkim"
 AST_australia_first_desc: "Skrajnie prawicowy zapał Partii Centrum był krótkotrwały i zakończył się wraz z jej rozwiązaniem w 1935 roku. Zaczyna się jednak rodzić coś nowego, wywodzącego się z idei przedsiębiorcy i działacza politycznego Williama Johna Milesa. Ale jeżeli nie podejmiemy działań w celu mobilizacji tych nastrojów, mogą one zniknąć równie szybko, jak się pojawiły. Dlatego będziemy działać."
 AST_pankhurst_walsh: "Adela Pankhurst Walsh"
 AST_pankhurst_walsh_desc: "Podczas formalnego powołania ruchu Australia Przede Wszystkim na jego przewodniczącą wybierzemy Adelę Pankhurst Walsh. Jako założycielka Australian Women's Guild of Empire Pankhurst Walsh - pozostając w bliskich stosunkach z londyńską Women's Guild - od dawna była orędowniczką wartości brytyjskiego obywatelstwa. Wartość ta stanie się podstawową zasadą naszego ruchu: utrzymanie więzi z Wielką Brytanią."
 AST_stephensen: "P.R. Stephensen"
 AST_stephensen_desc: "Podczas formalnego powołania ruchu Australia Przede Wszystkim na jego przewodniczącego wybierzemy P.R. Stephensena. Jako doradca literacki Williama Johna Milesa Stephensen podzielał izolacjonistyczne i nacjonalistyczne poglądy swojego mentora. Poglądy te stały się dwiema podstawowymi zasadami naszego ruchu: niezależność od Wielkiej Brytanii oraz unifikacja australijskiej kultury."
 AST_stephensen_tt: "\nWybór przewodniczącego §Yruchu Australia Przede Wszystkim§! wpływa na dostępność przyszłych działań."
 AST_a_growing_womens_guild: "Rozwój Gildii Kobiet"
 AST_a_growing_womens_guild_desc: "Od czasu swojego powstania w 1928 r. Australijska Gildia Kobiet Imperium opowiada się za współpracą przemysłową w celu zwalczania krajowych problemów gospodarczych. Dla dobra kraju obywatele muszą pomagać rządowi, a nie działać przeciwko niemu. Kiedy Pankhurst Walsh przewodniczy Australii Przede Wszystkim, dzięki temu ruchowi politycznemu możemy dotrzeć z tym przesłaniem do jeszcze szerszej publiczności."
 AST_realize_the_value_of_british_citizenship: "Wartość brytyjskiego obywatelstwa"
 AST_realize_the_value_of_british_citizenship_desc: "Władza, jaką [ENG.GetNameDefCap] sprawuje nad państwem [AST.GetAdjective], od dawna służy naszemu krajowi jako tarcza i drogowskaz. Pochodzimy z Brytanii i to się nie zmieni, dopóki przynosi nam to korzyści."
 AST_the_bolsheviks_counterforce: "Działania wymierzone w bolszewików"
 AST_the_bolsheviks_counterforce_desc: "Wydział śledczy od kilkudziesięciu lat prowadzi dochodzenia w sprawie działalności grup wywrotowych. Jego udział w zwalczaniu lewicowych zagrożeń ma ogromne znaczenie, nie należy go lekceważyć, ponieważ przeciwnicy Australii Przede Wszystkim starają się ograniczać nasz rozwój. Powinniśmy dążyć do obsadzenia stanowisk w australijskim biurze wywiadowczym i zadbać, by traktowano tam priorytetowo prawdziwe zagrożenie dla bezpieczeństwa narodowego."
 AST_public_meetings_tt: "Odblokowanie decyzji §YRuchu Australia Przede Wszystkim§! w celu zmobilizowania członków i zwiększenia poparcia dla faszystów."
 AST_rile_up_veterans: "Podburzanie weteranów"
 AST_rile_up_veterans_desc: "Wraz z nastaniem wielkiego kryzysu weterani I wojny światowej zjednoczyli się w skrajnie prawicowych ugrupowaniach paramilitarnych, aby przeciwdziałać rozprzestrzenianiu się komunizmu. Nawet jeśli ugrupowania te już się rozpadły, ich byli członkowie nie zniknęli. Australia Przede Wszystkim wchłonie ich i w ten sposób pochodnia antykomunizmu zostanie przekazana dalej."
 AST_eureka_stockade_monument_rally: "Manifestacje pod pomnikiem powstania w Eurece"
 AST_eureka_stockade_monument_rally_desc: "W 1854 r. w czasie bitwy o palisadę w Eurece, australijscy górnicy zaciekle walczyli z siłami kolonialnymi z powodu nadmiernych kosztów pozwoleń na wydobycie oraz opodatkowania kopalń złota. Niezadowolenie z brytyjskiej władzy było wtedy wyraźne, podobnie jak teraz. Spotkamy się pod pomnikiem upamiętniającymi tę bitwę i będziemy manifestować na rzecz uniezależnienia się od Wielkiej Brytanii."
 AST_australian_pivot_modifier: "Australijski piwot"
 AST_well-being_of_the_community: "Dobrobyt społeczeństwa"
 AST_well-being_of_the_community_desc: "Chrześcijańskie ideały życia i rodziny powinny być wysoce cenione przez australijskie społeczeństwo. Jednak mała liczba urodzin w ubiegłych latach wskazuje, że ideały te nie były dostatecznie przestrzegane. Dla dobra społeczności powinniśmy prowadzić kampanię promującą życie rodzinne."
 AST_covert_networks: "Tajne sieci"
 AST_covert_networks_desc: "Skoro Australia Przede Wszystkim działa wewnątrz wydziału śledczego, będziemy dążyć do współpracy zagranicznej z bliskimi nam ideowo ruchami [ENG.GetAdjective] Sojusz z naszym władcą może przysłużyć się nam też w inny sposób: ułatwi nam potajemne dotarcie do naszych ideologicznych sojuszników oraz zwiększenie możliwości naszego wywiadu."
 AST_refuse_british_wars: "Odstąpienie od brytyjskich wojen"
 AST_refuse_british_wars_desc: "Bitwa o Gallipoli pokazała, z jaką niedbałością [ENG.GetNameDef] traktuje nasze siły ekspedycyjne, przez co kolejna zagraniczna kampania w imieniu tego kraju jest nie do pomyślenia. Australijczycy żądają, by ich krew nie była więcej przelewana pod brytyjskim dowództwem, zmuszając rząd do działania. Statut westminsterski zostanie ratyfikowany."
 AST_walls_like_uluru: "Mury jak Uluru"
 AST_walls_like_uluru_desc: "Australia to samodzielny kontynent. Jeśli mamy wytrwać bez ochrony Imperium, musimy zbudować własne. Wybrzeże zostanie umocnione, porty ufortyfikowane, a każdemu, kto uzna nasz kraj za łatwą zdobycz, będzie trudno się do nas zbliżyć."
 AST_at_the_gates: "U bram"
 AST_at_the_gates_desc: "Świat zmierza ku wojnie i Australia musi być na to gotowa. Krajowe fabryki i stocznie muszą pracować na wyższych obrotach. To gwarancja własnego przetrwania, nie szykowanie się do cudzego konfliktu."
 AST_the_guild_for_the_war_effort: "Gildia działań wojennych"
 AST_the_guild_for_the_war_effort_desc: "Australijska Gildia Kobiet Imperium powstała, by służyć Koronie. Jej cel całkowicie się zmieni. Rozległa organizacyjna sieć skieruje swoje zasoby na wspieranie przemysłu wojennego, szpitali i łańcuchów dostaw samodzielnej Australii."
 AST_for_the_southern_cross: "Za Southern Cross"
 AST_for_the_southern_cross_desc: "Krzyż Południa nie powiewa nad Wielką Brytanią, lecz nad nami. Australijska tożsamość to coś prawdziwego, zasłużonego i godnego ochrony. Rodzi się nowa, narodowa duma, nie zapożyczona z Londynu czy określona przez odległe instytucje, lecz powstała tu, na tej ziemi i pod tym niebem."
 AST_through_the_gates: "Przez bramy"
 AST_through_the_gates_desc: "Przygotowania ustąpiły pośpiechowi. Narodowy program obrony jest poszerzany w oparciu o pełen potencjał australijskiego przemysłu. Obok istniejących zakładów powstają nowe, cele produkcji są podwyższane, a granica pomiędzy produkcją cywilną i potrzebami wojska po cichu zanika."
 AST_toe_the_line: "Karnie w szeregu"
 AST_toe_the_line_desc: "Musimy odłożyć na bok wygody, do których Australijczycy przywykli w ciągu lat dobrobytu. Ceną niepodległości jest racjonowanie, dłuższe godziny pracy i wezwanie do służby. Ci, którzy odpowiedzą, ujrzą naród gotowy do wsparcia ich. Lecz państwo nie będzie okazywało wyrozumiałości dla ludzi sądzących, że ofiarność to cudze brzemię."
 AST_crush_the_gates: "Zniszczenie bram"
 AST_crush_the_gates_desc: "Zakończyliśmy rozbudowę. Obecnie australijski przemysł działa w trybie wojennym, cała produkcja jest przeznaczona na potrzeby obrony oraz projekcji siły państwa. Australia jest przygotowana na każdą burzę i nie będzie opornym dominium z trudem realizującym mobilizację."
 AST_national_defense: "Obrona narodowa"
 AST_national_defense_desc: "Dzięki odpowiedniemu ukierunkowaniu inwestycji i zarządzaniu przez państwo Australia stworzyła bazę przemysłową, która udźwignie ciężar obrony kraju. Fabryki i stocznie działają pod nadzorem władz, a ich produkcja nie ma na celu osiągnięcia zysków, lecz zaspokojenie potrzeb kraju."
 modify_AST_national_defense_tt: "Modyfikuje: §Y$AST_national_defense$§! o:"
 AST_nauru_pact: "Układ w Nauru"
 AST_nauru_pact_desc: "Największa przeszkoda, czyli przejęcie władzy, wciąż jest przed nami, zatem kwestia niepodległości wydaje się odległa. Jednak autonomia Australii leży nie tylko w naszym interesie. W zamian za [GER.GetAdjective] gwarancje naszej suwerenności na wypadek brytyjskiego oporu wobec działalności Australii Przede Wszystkim lub ewentualnego wyjścia ze Wspólnoty Narodów, po przejęciu władzy oddamy im jedną z utraconych przez nich wysp na Oceanie Spokojnym: Nauru."
 AST_australian_culture_investments: "Inwestycje w australijską kulturę"
 AST_australian_culture_investments_desc: "W eseju zatytułowanym \"Fundamenty kultury Australii\" Stephensen wywarł wpływ na powstanie ruchu poetyckiego Jindyworobak i jasno dał do zrozumienia, że kultura australijska musi stać się priorytetem. Rząd wydaje się całkowicie zaniedbywać wartość artystów i pisarzy, ale my tego nie uczynimy. Zmobilizowanie popleczników Jindyworobak oraz Australii Przede Wszystkim pozwoli nam stymulować rozwój kultury."
 AST_australian_culture_investments_tt: "\nPo §Y365§! dniach:"
 AST_australia_first_party_focus: "Partia Australia Przede Wszystkim"
 AST_australia_first_party_focus_desc: "Liczba członków Australia Przede Wszystkim wzrosła do takiego poziomu, że nie da się już powstrzymać rozwoju tego ruchu. Nadszedł czas, aby społeczeństwo australijskie przyjęło z otwartymi ramionami nowo zarejestrowaną partię, która jest najgłośniejszym głosem nacjonalistów: partię Australia Przede Wszystkim."
 AST_australia_first_party_req_tt: "Powstała §Ypartia Australia Przede Wszystkim§!."
 AST_in_from_the_cold: "Wyjście z chłodu"
 AST_in_from_the_cold_desc: "Partia Australia Przede Wszystkim i jej zwolennicy nie muszą się już ukrywać. Złe traktowanie, jakiego doświadczył nasz naród za wielu poprzednich rządów, w końcu wyszło na jaw i nadszedł czas, by do głosu doszły nowe siły."
 AST_absorb_the_uap: "Przejęcie UAP"
 AST_absorb_the_uap_desc: "Chociaż Partia Zjednoczonej Australii zawsze pozostawała liberalna, jest również prawicowa. Wraz z przejęciem władzy przez nową partię członkowie PZA mogą nie mieć innego wyboru, jak popierać działania obecnego rządu. Skontaktujemy się z najważniejszymi członkami i zwerbujemy ich do partii Australia Przede Wszystkim."
 AST_big_business_pact: "Wielki pakt biznesowy"
 AST_big_business_pact_desc: "Partia Australia Przede Wszystkim dąży do ochrony krajowego przemysłu, więc zyskała wielu zwolenników wśród czołowych przedstawicieli biznesu. W zamian za realizację polityki sprzyjającej wzrostowi ich zysków będą oni wspierać nasze cele polityczne i militarne."
 AST_big_business_pact_tt: "\nOdblokowanie decyzji §Ywielkiego paktu biznesowego§!, żeby wpływać na cele przemysłowe i budowlane."
 AST_autarky: "Autarkia"
 AST_autarky_desc: "Uzależnienie od handlu zagranicznego jest ryzykowne, zwłaszcza w czasach konfliktów; priorytetem powinien być przemysł australijski, który nie może zostać wyparty przez import. Tylko poprzez zaostrzenie przepisów handlowych możemy chronić gospodarkę krajową i zapewnić Australii samowystarczalność."
 AST_energy_independence: "Zależność energetyczna"
 AST_energy_independence_desc: "Uzależnienie od handlu zagranicznego jest ryzykowne, zwłaszcza podczas konfliktów; niezależność energetyczna ma kluczowe znaczenie dla zapewnienia funkcjonowania Australii nawet w najtrudniejszych czasach. Inwestując w rafinerie, możemy wspierać krajową produkcję energii."
 remove_2_offsite_dockyard: "Usuń §R2§! §Ystocznie§! znajdujące się poza mapą."
 AST_british_pact: "Brytyjski pakt"
 AST_british_pact_desc: "Choć niedawno opuściliśmy Brytyjską Wspólnotę Narodów, w [AST.GetAdjective] interesie jest dalsza współpraca z naszą dawną ojczyzną. [ENG.GetNameDef] ma problemy na całym świecie, zatem doceni naszą gotowość do współpracy wojskowej i wzięcia na siebie ciężaru części działań."
 AST_naurus_return_to_german_hands: "Nauru wraca do rąk Niemców"
 AST_naurus_return_to_german_hands_desc: "Skoro Australia Przede Wszystkim sprawuje pełnię władzy w kraju, powinniśmy zrealizować obietnicę dotyczącą Nauru, a nasi niemieccy sojusznicy muszą dotrzymać swojej części umowy. [AST.GetName] wreszcie uwolni się z kajdan Wspólnoty Narodów, Brytyjczycy nie mają w tej kwestii nic do powiedzenia."
 AST_naurus_return_to_german_hands_tt: "\"§YUkład w Nauru§!\" wchodzi w życie."
 AST_naurus_return_to_german_hands_tt_2: "\"§YUkład w Nauru§!\" obowiązuje."
 AST_the_winner_takes_it_all: "Zwycięzca bierze wszystko"
 AST_the_winner_takes_it_all_desc: "Wcześniej poświęcenie wyspy Nauru w zamian za niemiecką współpracę wydawało się rozsądnym rozwiązaniem, lecz sytuacja zmieniła się. Posiadamy duży potencjał, zatem powinniśmy dokonać ekspansji na Wyspy Salomona i Nową Zelandię. Choć w przypadku tych pierwszych powiększyłoby to zakres złamania układu w Nauru, ponieważ Wyspy Salomona staną się kolejnym niemieckim terytorium przejętym przez Australię."
 AST_resist_western_intruders: "Opór wobec intruzów z Zachodu"
 AST_resist_western_intruders_desc: "Zachodnie państwa wydają się odczuwać potrzebę ingerowania w sprawy regionu Pacyfiku, ale nadszedł czas, by położyć temu kres. Zanim dotrą do naszych brzegów, my staniemy już na ich brzegach, udowadniając, że [AST.GetName] nie jest krajem, który ulega żądaniom."
 AST_invasion_preparation_tt: "Szybkość przygotowania inwazji: §G-20,0%§!"
 AST_naval_invasion_penalty_tt: "Kara za inwazję: §G-20,0%§!"
 AST_expand_the_fort: "Rozbudowa fortu"
 AST_expand_the_fort_desc: "Zachodni Pacyfik nie podlega [USA.GetAdjective] władzy. Wyspy, do których prawa roszczą sobie Amerykanie, należą do krajów Azji Wschodniej, a wraz ze wzrostem australijskich wpływów to właśnie my je sobie przywłaszczymy."
 AST_integrate_the_fort: "Integracja fortu"
 AST_integrate_the_fort_desc: "Jako że od roku 1920 władamy Nową Gwineą zgodnie z mandatem nadanym przez Ligę Narodów, a Papua stanowi zewnętrzne [AST.GetAdjective] terytorium Australii niemalże od zawiązania federacji, wschodnia część Papui Nowej Gwinei byłaby naturalnym uzupełnieniem prowincji narodowych naszego kraju. To byłby kolejny krok w ramach naszych działań na rzecz zjednoczenia australijskiej kultury."
 AST_defying_american_interference: "Sprzeciw wobec amerykańskiej interwencji"
 AST_defying_american_interference_desc: "[USA.GetNameDefCap] to kraj, który rzuca na nas swój cień, grożąc interwencją za każdym razem, gdy nasze działania nie pokrywają się z jego interesami. Gdy państwo [PHI.GetNameDef] znajduje się w żelaznym uścisku potęgi o tak ogromnym znaczeniu na arenie międzynarodowej, narody Azji Wschodniej nigdy nie będą naprawdę należeć do Azji Wschodniej. [AST.GetName] nie podda się żadnej władzy obcych najeźdźców - Filipiny będą nasze."
 AST_the_pacific_garrison: "Garnizon na Pacyfiku"
 AST_the_pacific_garrison_desc: "Chociaż ochrona Azji Południowo-Wschodniej i regionu Pacyfiku leży w interesie Wielkiej Brytanii, region ten znajduje się daleko od Wysp Brytyjskich. W zamian za ich wsparcie w zakresie zaopatrzenia zaproponowaliśmy przejęcie dowództwa nad obroną tego terytorium, dzięki czemu rząd [ENG.GetAdjective] będzie mógł zająć się innymi sprawami."
 AST_vichy_out_of_africa: "Wyparcie Vichy z Afryki"
 AST_vichy_out_of_africa_desc: "Upadek Francji Vichy lub współpraca z nią to jeden z głównych celów [ENG.GetAdjective] W ramach gestu dobrej woli, [AST.GetName] przyłączy się do działań i podejmie próbę podporządkowania sobie kolonii francuskich w Afryce."
 AST_vichy_out_of_africa_tt1: "Dodaje roszczenia wobec terytoriów §YFrancji Vichy§! w §YAfryce§! poprzez cel narodowy §YWyparcie Vichy z Afryki§!.\n"
 AST_vichy_out_of_africa_tt2: "Dodaje roszczenia wobec terytoriów §YFrancji Vichy§! w §YAfryce§! poprzez decyzje §YWyparcia Vichy z Afryki§!.\n"
 AST_vichy_africa_claim_flag: "Roszenia, które [AST.GetFlag]§Y[AST.GetName]§! wysuwa wobec wszystkich terytoriów §YFrancji Vichy§! w §YAfryce§!, zostają dodane do §Ykońca destabilizacji§!."
 AST_vichy_claim_tt: "Roszenia, które wysuwa [AST.GetFlag]§Y[AST.GetName]§!, zostają dodane do §Ykońca destabilizacji§!."
 vichy_in_africa_trigger: "§YFrancja Vichy§!: Dowolny kontrolowany region:\n    Jest w §YAfryce§!"
 vichy_wargoal: "Zdobywa cel wojenny §Yaneksja§! przeciwko §YFrancji Vichy§!."
 AST_britain_supplying_ships: "Brytyjskie dostawy okrętów"
 AST_britain_supplying_ships_desc: "Dźwiganie ciężaru ochrony wybrzeży brytyjskich sojuszników pokazało, że [ROOT.GetAdjective] flota wymaga rozbudowy. To oczywiste, że [ENG.GetNameDefCap] musi dostarczyć nam okręty."
 AST_hand_in_glove: "W ścisłej współpracy"
 AST_hand_in_glove_desc: "Dzięki ekspansji na północ możemy zwiększyć wpływy Australii na polu dyplomacji i konfliktów w Azji Południowo-Wschodniej. Dowiedliśmy już, że potrafimy chronić jednocześnie interesy własne i brytyjskie, zatem [ENG.GetNameDef] musi zrozumieć, dlaczego należy przekazać w nasze ręce odległe terytoria."
 AST_claim_french_indochina: "Roszczenia wobec Indochin Francuskich"
 AST_claim_french_indochina_desc: "Los Francji jest niepewny, to samo dotyczy jej kolonii. Inne kraje mogą zechcieć położyć swoje chciwe ręce na Indochinach Francuskich, ale z nami nie wygrają."
 AST_undeniably_ours: "Niezaprzeczalnie nasza własność"
 AST_undeniably_ours_desc: "Niezależnie od tego, co może przynieść nam dyplomacja, nigdy nie da nam wszystkiego. W tak niepewnej sytuacji granice Francji Vichy to tylko sugerowane linie na mapie, a przespanie okazji na pełną okupację jej terytoriów byłoby bardzo niemądre. Nieuchronnie nadszedł czas na wojnę."
 AST_done_meddling: "Koniec destabilizacji"
 AST_done_meddling_desc: "[AST.GetName] zawsze działa lojalnie wobec starego kraju i dumnie walczy w bojach toczonych przez Brytyjczyków. Na Australijczykach można polegać, ale to nie oznacza, że można ich lekceważyć. [AST.GetName] walczy tam, gdzie [ENG.GetNameDef] tego potrzebuje, więc [ENG.GetNameDef] musi też walczyć tam, gdzie potrzebuje tego [AST.GetName]."
 AST_northern_advancement: "Marsz na północ"
 AST_northern_advancement_desc: "Chociaż Australia wolałaby skupić się na własnych politycznych sprawach, nie powinniśmy oczekiwać, że zostaniemy pozostawieni w spokoju, jeśli nie staniemy się dla innych zagrożeniem. [INS.GetNameDefCap] to kraj podobny do naszego - ofiara europejskich najeźdźców, którzy nie chcą odejść. Zgłaszając nasze roszczenia do tego terytorium, wysyłamy jasny sygnał: narody Pacyfiku należy pozostawić w spokoju."
 AST_soothing_australian_fears: "Uspokajanie australijskich lęków"
 AST_soothing_australian_fears_desc: "Chociaż niektórzy przedstawiciele rządu wierzą w możliwość współpracy Australii z Japonią, australijska opinia publiczna nie podziela tego przekonania. Po tak długim okresie obaw przed japońską inwazją dla większości ludzi trudno jest pojąć ideę połączenia sił z potencjalnym agresorem. Musimy więc złagodzić ich obawy, przygotowując się do wojny."
 AST_soothing_australian_fears_tt: "\nPo §Y180§! dniach:"
 AST_dividing_the_pacific: "Podział Pacyfiku"
 AST_dividing_the_pacific_desc: "Organizacja Australia Przede Wszystkim propaguje ideę pokoju, który powinny zawrzeć Australia i [JAP.GetNameDef], postrzegając ten kraj - w odróżnieniu od większości obywateli Australii - jako potencjalnego sojusznika w regionie Pacyfiku, a nie jako stałe zagrożenie. Biorąc pod uwagę rosnącą [AST.GetAdjective] potęgę, należy oczekiwać, że [JAP.GetAdjective] władze przystaną na to, a ewentualne konflikty między naszymi krajami będą rozwiązywane, zanim zdążą się pojawić."
 AST_dividing_the_pacific_ast_gain_tt: "[GET_AST_DIVIDING_THE_PACIFIC_AST_GAIN]"
 AST_dividing_the_pacific_jap_gain_tt: "[GET_AST_DIVIDING_THE_PACIFIC_JAP_GAIN]"
 AST_dividing_the_pacific_tt1: "§GMy zyskujemy§!:"
 AST_dividing_the_pacific_tt2: "§ROni zyskują§!:"
 AST_dividing_the_pacific_tt3: "§Y[AST.GetName]§! przekazuje następujące kontrolowane terytoria:"
 AST_against_war_and_fascism: "Przeciwko wojnie i faszyzmowi"
 AST_against_war_and_fascism_desc: "Ruch przeciwko wojnie i faszyzmowi to australijska odnoga międzynarodowych działań Kominternu na rzecz mobilizacji robotników przeciwko siłom reakcyjnym. Choć w ostatnich latach stracił na znaczeniu, to naszym zadaniem jest podnieść ten sztandar i ponieść go dalej."
 AST_world_peace: "World Peace"
 AST_world_peace_desc: "Ruch przeciwko wojnie i faszyzmowi intensywnie pracuje nad wydaniem czasopisma zatytułowanego \"World Peace\", które ujawnia zło związane z ruchem faszystowskim w Niemczech, we Włoszech, w szczególności podczas hiszpańskiej wojny domowej. Publikowane tam artykuły skłoniły ochotników do przyłączenia się do walki z faszyzmem."
 AST_red_fred: "Czerwony Fred"
 AST_red_fred_desc: "\"Czerwony\" Fred Paterson stał się istotną postacią ruchu komunistycznego jako kandydat w wyborach na burmistrza Brisbane w 1934 r., w których poniósł sromotną klęskę. Jednak jego ambicje nie zmieniły się, a teraz stanął do walki o fotel radnego miejskiego w Townsville. Dzięki naszemu poparciu może zostać pierwszym komunistą wybranym na urząd publiczny."
 AST_workers_defence_corps_sparks_anew: "Wskrzeszenie obronnych sił robotniczych"
 AST_workers_defence_corps_sparks_anew_desc: "Obronne siły robotnicze powołano początkowo w celu ochrony strajków i pikiet. Stały się znowu potrzebne w obliczu narastającej agresji takich grup jak Nowa Gwardia, by bronić ludzi protestujących o lepsze prawa i możliwości."
 AST_a_controversial_recruitment: "Kontrowersyjny werbunek"
 AST_a_controversial_recruitment_desc: "Maurice Blackburn to znany prawnik i socjalista, który zasłynął obroną praw robotników w bataliach prawnych z ciemiężącymi ich pracodawcami. Należy do Partii Pracy, lecz jego lojalność wzbudziła wątpliwości z powodu jego powiązań z bardziej radykalnym ruchem przeciwko wojnie i faszyzmowi."
 AST_from_picket_line_to_front_line: "Z pikiety na linię frontu"
 AST_from_picket_line_to_front_line_desc: "Taktyki zastraszania wykorzystywane przez osoby sprzeciwiające się wyzwoleniu klasy robotniczej stają się coraz bardziej agresywne, zatem musimy dostosować do nich naszą ochronę. Z każdym incydentem determinacja robotników rośnie, coraz więcej ludzi dołącza do sił obronnych."
 AST_pig_iron_protests: "Protesty w sprawie surówki hutniczej"
 AST_pig_iron_protests_desc: "Nasi dokerzy nie zgadzają się z rządem w wielu sprawach, a w szczególności w kwestii sprzedaży surówki hutniczej państwom biorącym udział w wojnie. Australijczycy nie są zainteresowani udziałem w agresji ani dostarczaniem wyposażenia, które zostanie wykorzystane przeciwko niewinnym cywilom, dlatego [AST.GetName] również tego nie uczyni. Zorganizujemy strajk."
 AST_part_with_colonizer: "Pożegnanie z kolonizatorem"
 AST_part_with_colonizer_desc: "Źródłem naszych kłopotów jest Imperium Brytyjskie i narzucony przez nie system kapitalistyczny. Dość tego. Wielka Brytania ma problemy bliżej swojego podwórka, zatem już czas wziąć nasz los we własne ręce i obrać własny kurs jako wolny i niepodległy kraj."
 AST_take_it_to_the_streets: "Manifestacje uliczne"
 AST_take_it_to_the_streets_desc: "Działania w przemyśle to jedno z naszych najsilniejszych narzędzi do wymuszania zmian społecznych. Musimy wykorzystać je przeciwko systemowi, którego jedynym celem jest wyzysk. Czas odzyskać środki produkcji, robotnicy Australii, jednoczcie się!"
 AST_workers_educational_association: "Stowarzyszenie Edukacji Robotników"
 AST_workers_educational_association_desc: "Stowarzyszenie Edukacji Robotników to międzynarodowa organizacja zajmująca się dostępnością edukacji dla klasy robotniczej. Powinniśmy mieć jego własną odnogę, gdyż prawdziwe wyrównywanie szans zaczyna się w szkolnej klasie."
 AST_off_leash: "Spuszczenie ze smyczy"
 AST_off_leash_desc: "Dokerzy są fundamentem działań australijskich związków zawodowych. Jesteśmy wyspą rozmiarów kontynentu, więc nic dziwnego, że praca związana z morzem odgrywa tak istotną rolę w naszej gospodarce. Czas zdjąć obroże i spuścić morskie psy przemysłu."
 AST_a_national_housing_commission: "Narodowa Komisja Mieszkalna"
 AST_a_national_housing_commission_desc: "Mieszkalnictwo to od dawna sporny temat. Każdy zasługuje na dach nad głową, ale za często ta podstawowa potrzeba jest wykorzystywana przeciwko robotnikom, a koszty mieszkań stały się formą opresji ekonomicznej. Koniec z tym. Będziemy się domagać sprawiedliwej dostępności mieszkań dla wszystkich obywateli."
 AST_guaranteed_employment: "Długotrwałe rozmieszczanie"
 AST_guaranteed_employment_desc: "Socjalizm zbyt często spotyka się z lekceważeniem, zarzutami lenistwa albo zależności wymierzonymi w osoby w potrzebie. To musi się skończyć. Chcemy jedynie równych szans w pracy oraz sprawiedliwych wynagrodzeń, które pozwolą wyżywić nasze rodziny."
 AST_equal_pay: "Równość płac"
 AST_equal_pay_desc: "Ciągle pokutuje przekonanie, że właściciele środków produkcji zasługują na więcej niż ich pracownicy. Właściciele i kadra zarządzająca nie harują ciężej ani nie mają większych wrodzonych umiejętności. Dzięki wyrównaniu płac owoce pracy mogą być sprawiedliwiej rozdzielane w społeczeństwie."
 AST_all_for_one_one_for_all: "Jeden za wszystkich, wszyscy za jednego"
 AST_all_for_one_one_for_all_desc: "\"Wszyscy za jednego i więcej dla mnie\" to od dawna motto jednoczące burżuazję, która przez chciwość domaga się coraz więcej, a jednocześnie daje coraz mniej od siebie. Obietnica, że bogactwo będzie skapywało w dół, to kłamstwo. Powinno ono być dzielone równo, przez wszystkich i dla wszystkich."
 AST_abolition_of_private_property: "Zniesienie własności prywatnej"
 AST_abolition_of_private_property_desc: "Tryby przemysłu są oliwione krwią robotników. Musimy skończyć z brutalną akumulacją bogactwa i całkowicie zakazać posiadania własności prywatnej. Wszystko będzie wspólne, od każdego według jego zdolności, każdemu według jego potrzeb."
 AST_centralized_production: "Centralizacja produkcji"
 AST_centralized_production_desc: "Siły rynku są chaotyczne i niesprawiedliwe. Jeżeli chcemy zbudować prawdziwie sprawiedliwe społeczeństwo, państwo musi centralnie decydować, co będzie wytwarzane, przez kogo i gdzie. Nasza biurokracja posiada rozległe archiwa, zatem najlepiej poradzi sobie z zadaniem wyznaczenia kwot produkcji."
 AST_public_institutions: "Instytucje publiczne"
 AST_public_institutions_desc: "Społeczeństwo potrzebuje działania wielu niezbędnych usług, od ochrony zdrowia i mieszkalnictwa, aż po opiekę nad dziećmi oraz transport. Państwo musi dostarczać ich powszechnie, by były bez ograniczeń dostępne dla wszystkich obywateli. Te systemy, wolne od imperatywu wytwarzania prywatnego zysku, mogą działać wydajnie i zaspokajać potrzeby całej populacji."
 AST_planned_extraction: "Planowane wydobycie"
 AST_planned_extraction_desc: "Mamy szczęście, że nasze ziemie są bogate w zasoby. Musimy zadbać o ich systematyczne wydobycie i kierowanie do gałęzi przemysłu, które najbardziej ich potrzebują."
 AST_maritime_commission: "$USA_maritime_commission$"
 AST_maritime_commission_desc: "$USA_maritime_commission_desc$"
 AST_state_research_funding: "Państwowe finansowanie badań"
 AST_state_research_funding_desc: "W celu maksymalizacji wydajności naszych instytucji badawczych, państwo musi stać się głównym źródłem ich finansowania i ukierunkowywać ich pracę na pola, w których jest ona najbardziej potrzebna. Jednocześnie należy ściśle kontrolować przepływ informacji. Przecież nie możemy dopuścić, żeby nasi obywatele zaprzątali sobie głowi niewłaściwymi ideami."
 AST_graziers_to_industry: "Od hodowli do przemysłu"
 AST_graziers_to_industry_desc: "W czasie wielkiego kryzysu nasze miasta opustoszały, ponieważ robotnicy szukali stabilizacji na wsi. Teraz, dzięki przejęciu kontroli nad środkami produkcji, możemy ściągnąć tych ludzi z powrotem do przemysłu. Musimy wskazać im, czego potrzebuje kraj, muszą dowiedzieć się, że piece przemysłu są zasilane ludzkim potem."
 AST_free_school_policy: "Polityka darmowego szkolnictwa"
 AST_free_school_policy_desc: "Żeby kształtować współczesnego obywatela, musimy kształtować jego idee. Od kołyski, aż po uniwersytet, państwo powinno decydować, czego nauczą się nasze dzieci. Dzięki temu przyszłe pokolenia będą rozumiały wagę socjalistycznego ideału oraz zagrożenia wytwarzane przez wolne rynki... i wolne myśli."
 AST_free_healthcare_policy: "Polityka darmowej opieki zdrowotnej"
 AST_free_healthcare_policy_desc: "Nasze społeczeństwo zasługuje na wolność od chorób i urazów, a jeśli stanie się najgorsze, ludzi nie może dotknąć nieszczęście, jak dzieje się to w innych społeczeństwach. Zapewnimy powszechny dostęp do służby zdrowia, szpitali i lekarzy. Zdrowy lud to produktywny lud."
 AST_the_publics_australia: "Australia dla obywateli"
 AST_the_publics_australia_desc: "Odrzuciliśmy dany porządek i zbudowaliśmy kraj, który istnieje dla wielu, a nie dla nielicznych. Przemysł, praca i zasoby służą teraz wszystkim ludziom. To Australia Ludowa. Równa, zjednoczona i niepokonana."
 # 'Cominwealth' over 'Commonwealth' is intentional
 AST_the_australian_commonwealth: "Australijska Wspólnota Narodów"
 AST_the_australian_commonwealth_desc: "Niegdyś Wielka Brytania pełniła rolę przywódcy Wspólnoty Narodów, jednak jej wizja została wypaczona przez interesy kapitalistów. Przejmiemy tę rolę i poprowadzimy kraje ku wspólnej socjalistycznej utopii."
 AST_union_control_commonwealth: "Odblokowanie decyzji §Ykontroli nad związkami§!.\nUmożliwia to przeniknięcie w szeregi komunistów w Nowej Zelandii, Malezji, Birmie, a na koniec w Indiach."
 AST_a_comrade_emancipated: "Wyzwolenie towarzysza"
 AST_a_comrade_emancipated_desc: "Wiele krajów świata wciąż tkwi w okowach kapitalizmu, a ich obywatele nie znają prawdziwej wolności. Jako wolne państwo socjalistyczne mamy obowiązek pomóc im w wyzwoleniu. Robotnicy świata, jednoczcie się, a my pomożemy wam zerwać te kajdany."
 AST_union_control_local: "Odblokowanie decyzji §Ykontrola nad związkami§!.\nUmożliwia to przeniknięcie do Indonezji i Filipin."
 AST_comintern: "Dołączenie do Kominternu"
 AST_comintern_desc: "Chociaż czasami odchodził od zasad prawdziwego marksizmu, Związek Radziecki wciąż niesie sztandar międzynarodówki robotników. Poprzez wejście do Kominternu możemy działać wspólnie na rzecz krzewienia komunizmu na całym świecie."
 AST_comintern_tt: "Jeżeli §Y[AST.GetName]§! stoi na czele frakcji, dojdzie do połączenia z Kominternem. W przeciwnym razie §Y[AST.GetName]§! sama dołączy do Kominternu."
 AST_for_greater_good: "Dla większego dobra"
 AST_for_greater_good_desc: "Nasza wizja światowej rewolucji wymaga ofiar i krwi. Ogień socjalizmu przygasa w zbyt wielu miejscach, by go podtrzymać, musimy skonsolidować i wysłać nasze wsparcie. Przecież to działanie dla większego dobra."
 AST_make_common_cause: "Stworzenie wspólnego celu"
 AST_make_common_cause_desc: "Pod naszym przywództwem Wspólnota Narodów rozkwitła, kierując się światłem socjalizmu wyszła z mroku kapitalistycznego ucisku. W tym krytycznym momencie musimy dopilnować, by nasza wola pozostała niezłomna, i razem kroczyć w stronę lepszego jutra."
 AST_the_red_pacific: "Czerwony Pacyfik"
 AST_the_red_pacific_desc: "Region Oceanu Spokojnego należy zmienić zgodnie z założeniami rewolucji. Na jego wyspach i wybrzeżach będziemy wspierać powstawanie socjalistycznych rządów i sprawimy, że czerwony sztandar będzie powiewał na każdej plaży."
 AST_the_irish_anti-britain_pact: "Irlandzki pakt antybrytyjski"
 AST_the_irish_anti-britain_pact_desc: "Wielka Brytania zbyt długo była twierdzą kapitalizmu, chroniona dzięki swojej wyspiarskiej pozycji oraz sile marynarki wojennej. Dzięki podsycaniu niepokojów wśród dokerów w Irlandii i Irlandii Północnej możemy przełamać tamtejszą obronę oraz otworzyć naszym wojskom drogę przez Morze Irlandzkie."
 AST_stretch_the_fleet: "Rozprzestrzenienie floty"
 AST_stretch_the_fleet_desc: "Wielka Brytania pozostaje twierdzą kapitalizmu chronioną przez potężną flotę. Czas rozbudować potencjał naszej marynarki wojennej, uderzyć na Brytyjczyków i pokazać światu, która wyspa jest większa."
 AST_chinese_relations: "Relacje z Chinami"
 AST_chinese_relations_desc: "Nasi towarzysze w Chinach walczą o przetrwanie. Mamy możliwości udzielenia im pomocy, ale trzeba działać szybko, zanim zostaną zalani przez skierowane przeciwko nim wojska imperialistów."
 AST_westward_battles: "Bitwy na zachodzie"
 AST_westward_battles_desc: "Wojska faszystowskie dominują na zachodzie i zagrażają podstawom naszego istnienia. Musimy na nie uderzyć w sojuszu z Kominternem oraz stawić opór tym, którzy chcą zniszczyć budowaną przez nas robotniczą utopię."
 AST_strongholds: "Twierdze"
 AST_strongholds_desc: "Żeby umocnić naszą pozycję na tym nowym teatrze, musimy wesprzeć naszych irlandzkich towarzyszy w walce z imperialistycznym sercem kapitalizmu. Ich wcześniejsza walka o niepodległość to dla nas cenna lekcja w trakcie przygotowań do następnego etapu konfliktu światowego."
 AST_out_of_the_den: "Wyjście z kryjówki"
 AST_out_of_the_den_desc: "Wielu Irlandczyków wciąż pała głęboką niechęcią do władzy brytyjskiej. Czas pokazać naszą siłę i sprawić, że ci ludzie wyjdą z cienia, zjednoczyć ich w ramach walki ze wspólnym wrogiem."
 AST_end_the_kingdom: "Koniec królestwa"
 AST_end_the_kingdom_desc: "Już czas. Źródło imperialistycznego kapitalizmu otrzyma cios w jego przegniłe serce. Robotnicy w całym Imperium Brytyjskim zostaną wkrótce wyzwoleni. Precz z monarchią. Precz z królestwem. Precz z uciskiem. Robotnicy Wspólnoty Narodów, jednoczcie się!"
 AST_red_solidarity: "Czerwona solidarność"
 AST_red_solidarity_desc: "Trwają zmagania w Chinach, miliony ludzi cierpią i umierają. Ich walka to nasza walka, zatem nie powinniśmy stać bezczynnie. Możemy interweniować, wziąć na siebie część ciężaru zmagań i sprawić, że ogień rewolucji nie zgaśnie."
 AST_red_solidarity_tt: "§Y[AST.GetName]§! dołącza do wojny §Y[PRC.GetNameDef]§!-§Y[CHI.GetNameDef]§!. Mniejsza z frakcji wchłania drugą albo §Y[AST.GetName]§! bezpośrednio wchodzi do wojny, jeśli oba kraje są już sojusznikami."
 AST_free_the_colonies: "Wyzwól kolonie"
 AST_free_the_colonies_desc: "Ogień rewolucji ogarnia walące się Imperium Brytyjskie. Kolonie przestaną być koloniami, będą wolnymi krajami. Buntujcie się, towarzysze! Zrzućcie kajdany i dołączcie do rewolucji!"
 AST_free_the_colonies_tt: "§Y[AST.GetName]§! degraduje wszystkie kontrolowane przez siebie dawne kolonie brytyjskie i zamienia je w zintegrowane państwa marionetkowe."
 AST_battle_of_the_ocean: "Bitwa o ocean"
 AST_battle_of_the_ocean_desc: "Oceany od dawna są arteriami handlu światowego. Już czas przenieść walkę na Pacyfik i zaszkodzić systemowi, który utrzymuje się dzięki temu rejonowi. Wody zabarwią się krwią zepsutych kapitalistów i bohaterów rewolucji."
 AST_borderless_solidarity: "Solidarność bez granic"
 AST_borderless_solidarity_desc: "Solidarność. Słowo jednoczące robotników na całym świecie. Nie podzielą nas żadne granice, żaden kraj nie będzie sam. Gdziekolwiek rozgorzeje ogień walki, odpowiemy na wezwanie i wspólnie staniemy do globalnej walki wyzwoleńczej."
 AST_an_equal_union: "Unia równości"
 AST_an_equal_union_desc: "Chociaż to my niesiemy sztandar rewolucji, każdy, kto do nas dołącza, jest nam równy. W tej unii swobodnie dzielimy się zasobami, pracą i ideami, żeby zbudować przyszłość, w której dobrobyt będzie wspólny, a żaden kraj nie będzie ważniejszy od innych."
 AST_expanding_influence: "Poszerzanie wpływów"
 AST_expanding_influence_desc: "Opowiadamy się po właściwej stronie historii, a nasze idee mówią same za siebie. Perspektywa robotniczego raju to nie sen, lecz budowana rzeczywistość. Możemy ponieść tę wizję dalej, zaprosić innych do budowania wspólnej przyszłości."
 AST_public_works: "Prace publiczne"
 AST_public_works_desc: "Wielki kryzys postawił australijską gospodarkę w bardzo trudnej sytuacji. Rozpoczniemy liczne programy robót publicznych, aby zapewnić ludziom miejsca pracy i ożywić wydatki konsumpcyjne."
 AST_lang_plan: "Plan Langa"
 AST_lang_plan_desc: "Jack Lang wysunął się na pierwszy plan polityki gospodarczej dzięki głośnej odmowie spłaty zagranicznych zobowiązań finansowych i postulatowi przeznaczenia tych środków na inwestycje publiczne mające na celu pobudzenie krajowego wzrostu gospodarczego. W końcu nie da się ukręcić bicza z piachu."
 AST_exports_for_economic_recovery: "Eksport dla odbudowy gospodarki"
 AST_exports_for_economic_recovery_desc: "Przeciwnicy koncepcji Langa proponują wykorzystanie międzynarodowych rynków i zadłużenia w celu pobudzenia zagranicznych inwestycji i sprzedaży, stawiając na gospodarkę zorientowaną na eksport, aby ożywić krajową produkcję, zatrudnienie, a w konsekwencji także wydatki konsumentów."
 AST_the_phosphate_commision: "Komisja Fosforytowa"
 AST_the_phosphate_commision_desc: "Po zakończeniu I wojny światowej Nauru zostało objęte wspólną kuratelą Australii, Nowej Zelandii i Wielkiej Brytanii. W 1919 roku prawa do całej sprzedaży fosforytów z wyspy zostały przekazane tym kuratorom, na czele których stała Australia. Korzystając z naszej przywódczej pozycji, możemy wpływać na kształtowanie cen i zapewnić bardzo konkurencyjne stawki dla naszego rynku krajowego."
 AST_goods_standard: "Standard towarów"
 AST_goods_standard_desc: "Jedną z podstawowych zasad teorii ekonomicznej Jacka Langa jest zniesienie standardu złota w Australii i zastąpienie go standardem towarów, który wiąże podaż pieniądza z rzeczywistą ilością wyprodukowanych towarów. Dzięki temu przepływ kapitału jest bezpośrednio powiązany z krajową produktywnością, a nie z czynnikami zewnętrznymi."
 AST_standard_gauge_line_to_darwin: "Kolej normalnotorowa do Darwin"
 AST_standard_gauge_line_to_darwin_desc: "Zbyt długo brakowało nam dobrego połączenia z naszymi północnymi terytoriami. W ramach szeroko zakrojonego programu robót publicznych mającego na celu pobudzenie gospodarki możemy zbudować linię kolejową łączącą nasze południowe miasta z północą."
 AST_lang_is_right: "Lang ma rację"
 AST_lang_is_right_desc: "Okazuje się, że Lang miał rację! Odmawiając przyznania pierwszeństwa zagranicznym kredytodawcom i zamiast tego wykorzystując nasz własny system bankowy w sposób bardziej zdecydowany, możemy uwolnić znaczne środki. Środki te można następnie przekazać gospodarce krajowej, zapewniając tak potrzebne inwestycje i pobudzając wzrost gospodarczy."
 AST_within_reach: "W zasięgu"
 AST_within_reach_desc: "Tak blisko, a jednak tak daleko. Australia jest krajem niezwykle bogatym w surowce - tuż pod powierzchnią ziemi kryją się niewyobrażalne bogactwa, które tylko czekają, by je wydobyć. Dzięki rozbudowie infrastruktury nawet odległe kopalnie stały się dostępne, a my stoimy u progu ery australijskiego dobrobytu opartego na wydobyciu surowców mineralnych."
 AST_a_domestic_supply_chain: "Krajowa sieć zaopatrzenia"
 AST_a_domestic_supply_chain_desc: "Jednym z dodatkowych pozytywnych efektów skupienia się na gospodarce krajowej jest powstanie wyjątkowo odpornego systemu produkcyjnego. Wszystkie etapy produkcji odbywają się w kraju, dzięki czemu jesteśmy dobrze zabezpieczeni przed zewnętrznymi wstrząsami gospodarczymi."
 AST_broken_hill_propietary_company: "Broken Hill Proprietary Company"
 AST_broken_hill_propietary_company_desc: "Firma Broken Hill Proprietary Company jest jedną z największych firm wydobywczych i produkujących stal w Australii. Nazywana przez miejscowych \"The Big Australian\" zdominowała przemysł wydobywczy. Dzięki gwałtownemu wzrostowi popytu na surowce firma ma doskonałe warunki do jeszcze szybszego rozwoju."
 AST_radium_hill: "Radium Hill"
 AST_radium_hill_desc: "W Australii Południowej odkryto złoża uranu, a kopalnia Radium Hill ma duży potencjał rozwojowy. Chociaż wciąż odkrywamy pełen zakres możliwości tych nowych technologii, jasne jest, że stoimy u progu ery atomowej i może to być nasz pierwszy krok w jej kierunku."
 AST_industrial_expansion: "Rozbudowa przemysłu"
 AST_industrial_expansion_desc: "Wielki kryzys przez większą część ostatniej dekady poważnie osłabił potencjał gospodarczy naszego kraju. Teraz, gdy mamy polityczną wolę podjęcia bardziej zdecydowanych działań, powinniśmy wykorzystać ją do śmiałej rozbudowy naszej bazy przemysłowej, tworząc miejsca pracy, zwiększając popyt na surowce i produkując więcej towarów na rynek."
 AST_income_tax_assessment_act: "Ustawa o szacowaniu podatku dochodowego"
 AST_income_tax_assessment_act_desc: "Nasz system podatkowy jest w opłakanym stanie i sprawia trudności obywatelom, którzy nie są w stanie go zrozumieć, co wymaga kosztownego nadzoru, na który nie możemy sobie pozwolić. Dzięki gruntownej reformie i uproszczeniu odpowiednich przepisów możemy znacznie zwiększyć efektywność poboru podatków."
 AST_council_for_scientific_and_industrial_research: "Rada Badań Naukowych i Przemysłowych"
 AST_council_for_scientific_and_industrial_research_desc: "W następstwie konferencji imperialnej z 1923 roku wzmocniono Radę Badań Naukowych i Przemysłowych, aby pomóc w poszerzeniu bazy gospodarczej poszczególnych kolonii i dominiów. Chociaż jej wkład był znaczący, nadszedł czas, aby nadać tej instytucji nowy kierunek działania: rozwój przemysłu wytwórczego i przetwórczego."
 AST_bring_home_the_farmers: "Powrót rolników do domu"
 AST_bring_home_the_farmers_desc: "Podczas wielkiego kryzysu nasze największe miasta doświadczyły poważnego wyludnienia, spowodowanego migracją robotników na wieś w poszukiwaniu pracy w rolnictwie. Sytuacja zaczyna się poprawiać, więc powinniśmy zachęcać robotników do powrotu, abyśmy mogli ponownie uruchomić fabryki i wznowić produkcję."
 AST_reverse_wage_cuts: "Odwrócone obniżki wynagrodzeń"
 AST_reverse_wage_cuts_desc: "W celu zapewnienia przedsiębiorstwom szansy na przetrwanie wprowadziliśmy cięcia wynagrodzeń w całej gospodarce. Obecnie obserwujemy oznaki ożywienia gospodarczego, więc powinniśmy zmienić kurs. Rosnące wynagrodzenia prowadzą do wzrostu siły nabywczej, co sprzyja konsumpcji i wzrostowi gospodarczemu."
 AST_the_manpower_directorate: "Dyrekcja Zasobów Ludzkich"
 AST_the_manpower_directorate_desc: "Wraz ze wzrostem złożoności naszej gospodarki stajemy przed coraz większymi wyzwaniami związanymi z zasobami ludzkimi. Dyrekcja ta zadba o to, by odpowiednie osoby z odpowiednimi umiejętnościami zajmowały w odpowiednim czasie odpowiednie stanowiska."
 AST_recovery: "Odnowa"
 AST_recovery_desc: "Po raz pierwszy nasz produkt krajowy brutto przekroczył poziom sprzed wielkiego kryzysu. To powód do radości, ponieważ nasza gospodarka znajduje się obecnie na ścieżce wzrostu. Wkraczamy w okres dynamicznego rozwoju i nadszedł czas, by czerpać korzyści z naszego odrodzonego dobrobytu."
 AST_devalued_currency: "Dewaluacja waluty"
 AST_devalued_currency_desc: "Jednym z najskuteczniejszych sposobów na zwiększenie eksportu jest osłabienie waluty. Gdy zagraniczni nabywcy mogą kupić więcej naszych towarów, ponieważ ich pieniądze mają większą wartość, stajemy się bardziej konkurencyjni na rynku międzynarodowym. Jest to jednak miecz obosieczny, ponieważ import z innych krajów staje się przez to droższy."
 AST_reverse_industry_tariffs: "Ewaluacja ceł przemysłowych"
 AST_reverse_industry_tariffs_desc: "W przeszłości stosowaliśmy cła, aby chronić nasz krajowy przemysł przed zagraniczną konkurencją. Doprowadziło to jednak do wojen handlowych i wprowadzenia ceł odwetowych na nasze towary eksportowe, co spowodowało wzrost cen. Powinniśmy zmniejszyć te bariery i zachęcać do wzajemnego obniżania ceł, aby zwiększyć handel."
 AST_foreign_competition: "Konkurencja zagraniczna"
 AST_foreign_competition_desc: "Konkurencja jest dobra dla biznesu; sprzyja innowacyjności i wydajności, a jednocześnie eliminuje złudne poczucie bezpieczeństwa. Żyjemy w świecie, w którym panuje bezwzględna rywalizacja, i musimy zadbać o to, by to nasza strona była najbardziej bezwzględna, usuwając krępujące nas ograniczenia."
 AST_expanding_into_new_markets: "Wejście na nowe rynki"
 AST_expanding_into_new_markets_desc: "Korzyści płynące ze skupienia się na rynkach zagranicznych zamiast na rynku krajowym są oczywiste. Globalny rynek jest ogromny. Zawsze znajdą się nowe obszary do ekspansji; musimy tylko odkryć naszą przewagę i udowodnić wyższość australijskich produktów oraz praktyk biznesowych."
 AST_populate_or_perish: "Wzrost populacji lub zagłada"
 AST_populate_or_perish_desc: "Kiedy uderzył wielki kryzys, liczba narodzin gwałtownie spadła i od tamtej pory ma problemy z powróceniem do dawnych poziomów. Żeby zapewnić trwały rozwój kraju, powołamy federalny Departament Imigracji, który zajmie się realizacją i nadzorowaniem nowego programu imigracyjnego."
 AST_recruitment_drive: "Zwiększenie rekrutacji"
 AST_recruitment_drive_desc: "Brak woli poprzednich rządów, a także ich nadmierne poleganie na Wielkiej Brytanii doprowadziły do długotrwałego zaniedbywania australijskich sił zbrojnych. Teraz to się zmieni, ruszamy z kampanią, która ma zwiększyć rekrutację do Australijskich Sił Obronnych."
 AST_new_deal: "Nowy Ład"
 AST_new_deal_desc: "Protesty, do których doszło podczas obchodów stopięćdziesięciolecia naszego kraju, wyraźnie pokazały, że powinniśmy zmienić prawa dotyczące rdzennych mieszkańców. Na wniosek aktywistów walczących o prawa Aborygenów spotkamy się z nimi, aby wspólnie stworzyć ścieżkę, która pozwoli uzyskać pełne obywatelstwo rdzennym ludom."
 AST_the_1938_sesquicentenary_flag: "Doszło do wydarzenia §Y150. rocznica w 1938 roku§!."
 AST_the_1938_sesquicentenary_tt: "Cel narodowy '§YNowy Ład§!' w §Ygałęzi wzrost populacji lub zagłada§! staje się dostępny."
 AST_repeal_immigration_restrictions: "Zniesienie ograniczeń imigracyjnych"
 AST_repeal_immigration_restrictions_desc: "Departament Imigracji jest ograniczany przez przestarzałe prawa określające, kto może imigrować do: [AST.GetName]. Choć może to wywołać kontrowersje, uchylimy te prawa i wprowadzimy system kwotowy, który pozwoli kontrolować napływ imigrantów."
 AST_womens_armed_services: "Kobiece Siły Zbrojne"
 AST_womens_armed_services_desc: "Mimo silnych sprzeciwów stworzymy kobiece siły zbrojne. [AST.GetName] potrzebuje wszystkich rąk do obrony przed agresorami, niezależnie od płci. W celu zwiększenia werbunku i szkolenia, najważniejszy jest wybór osób, które pokierują tymi siłami."
 AST_northern_territory_reconnaissance_unit: "Jednostka zwiadu północnych terytoriów"
 AST_northern_territory_reconnaissance_unit_desc: "Donald Thomson, porucznik lotnictwa i antropolog, opowiada się za włączeniem populacji Aborygenów do [AST.GetAdjective] sił zbrojnych, a teraz spełnimy jego życzenie. Powierzymy mu zadanie osobistego utworzenia jednostki zwiadu złożonej z mężczyzn posiadających wiedzę o danym terenie oraz umiejętności pozwalające przetrwać nawet w najbardziej odległych i niegościnnych miejscach."
 AST_northern_territory_reconnaissance_unit_tt: "Odblokuj kompanię wsparcia §Yjednostka zwiadu północnych terytoriów§!."
 AST_torres_strait_battalion: "Batalion Cieśniny Torresa"
 AST_torres_strait_battalion_desc: "Działania garnizonu kompanii Cieśniny Torresa były dobrze zarządzane, lecz jej ludzie mają potencjał do innych osiągnięć. Jej członkowie pochodzą z wysp położonych na północ od [AST.GetAdjective] wybrzeża, dzięki czemu jednostka ta doskonale zna Cieśninę Torresa. Kompania przejdzie szkolenie piechoty morskiej, postaramy się też przyciągnąć kolejnych ochotników, by powołać z nich batalion."
 AST_department_of_aboriginal_affairs: "Departament Spraw Aborygenów"
 AST_department_of_aboriginal_affairs_desc: "Postąpimy zgodnie z radą grup aktywistów praw Aborygenów i utworzymy nowy Departament Spraw Aborygenów, któremu będzie doradzał komitet ds. aborygeńskiego dziedzictwa. Jego celem będzie zapewnienie rdzennym mieszkańcom dostępu do odpowiedniej żywności oraz pomocy medycznej."
 AST_immediate_rights: "Natychmiastowe prawa"
 AST_immediate_rights_desc: "Żadna grupa [AST.GetAdjective] populacji nie będzie podlegała regulacjom ze strony federacji, a ich dziedzictwo nie będzie ograniczało praw obywatelskich. Dzięki wdrożeniu własnej ustawy o obywatelstwie i odejściu od założenia, że naszą populację tworzą jedynie brytyjscy poddani, prawa Australijczyków przestaną być warunkowe."
 AST_diverse_army: "Zróżnicowana armia"
 AST_diverse_army_desc: "Obrona ojczyzny to nie tylko przywilej, ale też prawo. Każdy chętny Australijczyk powinien mieć możliwość wstąpienia do wojska, a każdy ambitny żołnierz otrzymać możliwość awansu."
 ### RIGHT VS LEFT CAMPAIGN ###
 AST_bg_empty_text_tt: "Zrównoważ podział głosów między partie demokratyczne i odblokuj zbiory celów poszczególnych partii.\n\nUkończ cel §Y$AST_war_is_coming$§!, aby odblokować."
 AST_right_vs_left_campaign_title_text: "Demokratyczne wybory"
 AST_expected_election_winner_text: "§YPrognozowany zwycięzca§!"
 AST_uap_confirmed_election_winner_text: "§WZWYCIĘSTWO WYBORCZE§! §YPZA§!"
 AST_alp_confirmed_election_winner_text: "§WZWYCIĘSTWO WYBORCZE§! §YAPP§!"
