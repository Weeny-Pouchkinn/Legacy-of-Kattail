 AST_uap_election_campaign_tt: "§YKampania wyborcza PZA§!\n§LMobilizacja klasy średniej, przedsiębiorców i imperialnych lojalistów. Partia Zjednoczonej Australii ruszy z kampanią polityczną.§!\n\n§YEfekt:§!\nDzienny spadek siły politycznej: §R1,00§!\nDzienny przyrost głosów na §YPZA§!: §G+0,05%§!"
 AST_alp_election_campaign_tt: "§YKampania wyborcza APP§!\n§LMobilizacja klasy robotniczej, związkowców i osób wspierających reformy wewnętrzne. Australijska Partia Pracy ruszy z kampanią polityczną.§!\n\n§YEfekt:§!\nDzienny spadek siły politycznej: §R1,00§!\nDzienny przyrost głosów na §YAPP§!: §G+0,05%§!"
