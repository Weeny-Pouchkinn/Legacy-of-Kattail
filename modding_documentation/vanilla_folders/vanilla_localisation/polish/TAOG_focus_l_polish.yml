 AST_natunity_desc: "§YRząd Jedności Narodowej§!\n§LW czasie kryzysu małe walki torują drogę większym. Kraje wokół nas mierzą się z kolejnymi konfliktami i choć sprawy wewnętrzne są pilne, wszystkie bledną w zderzeniu z coraz większym prawdopodobieństwem rozlewu krwi. Partie demokratyczne na [AST.GetAdjective] scenie politycznej muszą zapomnieć o dzielących je różnicach i wspólnie zmierzyć się ze światem.§!"
