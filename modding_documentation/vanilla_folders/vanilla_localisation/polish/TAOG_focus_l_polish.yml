 ###   SIAM   ###
 ################
 SIA_the_khana_ratsadon: "Khana Ratsadon"
 SIA_the_khana_ratsadon_desc: "Partia Ludowa położyła kres absolutyzmowi i otworzyła drogę do rządów konstytucyjnych. Jej dziedzictwo było przedmiotem sporów, zostało zdradzone i splamione krwią, ale pozostaje fundamentem, na którym można zbudować nowoczesną [SIA.GetAdjective] państwowość."
 SIA_the_khana_ratsadon_tt: "\nPartia §YKhana Ratsadon§! staje się aktywna.\n\n§YKhana Ratsadon§! to główna [ROOT.GetAdjective] partia, która dzieli się na §Yskrzydło militarne§! i §Yskrzydło cywilne§!.\n\n§YSkrzydło cywilne§! zazwyczaj popiera politykę prodemokratyczną, kładąc nacisk na przemysł cywilny, podczas gdy §Yskrzydło militarne§! zazwyczaj popiera politykę profaszystowską i militaryzację przemysłu.\n\nNasze decyzje sprawią, że będą nas lubić bardziej lub mniej, co przełoży się na różne premie lub kary.\nJeśli zaczną się buntować, mogą podjąć próbę przeprowadzenia zamachu stanu.\n\nRóżne poziomy poparcia to: §Ybunt§!, §Yopozycja§!, §Yneutralność§!, §Yniewielkie poparcie§! i §Ypełne poparcie§!."
 SIA_shuffle_pridi_to_the_minister_of_interior: "Wzmocnienie pozycji skrzydła cywilnego"
 SIA_shuffle_pridi_to_the_minister_of_interior_desc: "Przesuwając Pridiego na stanowisko ministra spraw wewnętrznych, a nie ministra spraw zagranicznych, damy mu skuteczniejszą kontrolę nad alokacją zasobów rządowych i możliwość hamowania rosnących wpływów wojska."
 SIA_shuffle_pridi_to_the_minister_of_interior_tt: "§Y$anti_fascist_raids$§! będą teraz zwiększały poparcie §Yskrzydła cywilnego§! i zmniejszały poparcie §Yskrzydła militarnego§!"
 SIA_civil_nationalism: "Nacjonalizm cywilny"
 SIA_civil_nationalism_desc: "Każdy Taj niezależnie od statusu musi wiedzieć, że nie powinien być wierny jednemu rządowi lub osobie, lecz dbać o wartości swobód, wolności i równości, niezależnie od tego, kto w danym momencie zasiada na tronie."
 SIA_the_true_heirs_of_1932: "Prawdziwi spadkobiercy 1932 r."
 SIA_the_true_heirs_of_1932_desc: "Wojskowi lubią przedstawiać rewolucję 1932 r. jako wyłącznie ich osiągnięcie, nie bacząc na fakt, że było to zwycięstwo ludu. Trzeba przypomnieć o tym obywatelom i zaczerpnąć od nich siły."
 SIA_thammasat_university: "Uniwersytet Thammasat"
 SIA_thammasat_university_desc: "Thammasat jako nowo utworzony uniwersytet mógłby, i powinien, przejść rozbudowę, żeby otworzyć drogę dla nowej ery tajskich innowacji."
 SIA_defenders_of_constitutional_liberty: "Obrońcy wolności konstytucyjnej"
 SIA_defenders_of_constitutional_liberty_desc: "Nauczyciele, bankierzy, pielęgniarki: wykształconą klasę średnią można pobudzić i zmobilizować do obrony wolności, jeśli skrzydło wojskowe posunie się za daleko."
 SIA_dominate_public_symbols: "Dominacja symboli publicznych"
 SIA_dominate_public_symbols_desc: "Skrzydło wojskowe już dawno zdominowało symbole publiczne, stawiało pomniki i ustanawiało święta państwowe na własną cześć. Musimy się temu przeciwstawić, tworząc własne symbole na cześć prawa ludu do samostanowienia oraz zwycięstwa nad dawną autokracją."
 SIA_civil_service_heroism: "Heroizm służby cywilnej"
 SIA_civil_service_heroism_desc: "Każdy Taj musi mieć wpojony obowiązek ochrony rządów prawa na wypadek gdyby jakaś siła, zewnętrzna lub wewnętrzna, próbowała przejąć władzę. Potrzebujemy poparcia ludu nie tylko na wypadek próby odebrania nam naszych wolności, lud musi też ponieść sztandary naszej sprawy."
 SIA_spread_democratic_sentiment_in_universities: "Rozsiewanie prodemokratycznych nastrojów na uniwersytetach"
 SIA_spread_democratic_sentiment_in_universities_desc: "Uczelnie wyższe budują przyszłe kadry państwa [SIA.GetAdjective] To, czego dziś nauczą się studenci, będzie rezonować w przyszłości, a wpojenie dzisiejszym uczonym silnego przywiązania do demokracji sprawi, że wyjdzie ono poza uczelniane mury."
 SIA_sideline_disloyal_officers: "Odsunięcie nielojalnych oficerów"
 SIA_sideline_disloyal_officers_desc: "Korpus oficerski armii nie jest monolitem. W jego szeregach zasiadają ludzie wierni swoim byłym protektorom, wrogim frakcjom lub własnym ambicjom, a nie rządowi. Za pomocą dobrze przemyślanych przydziałów i presji administracyjnej można przenieść tych ludzi na stanowiska, gdzie nie będą stwarzali zagrożenia. Dzięki temu zasłużona odpowiedzialność spadnie na osoby, które udowodniły swoją niezawodność."
 SIA_sideline_disloyal_officers_tt: "Dwaj losowo wybrani generałowie otrzymają cechę §Yzmiana przydziału§! na 4 lata, co sprawi, że nie będą przynosić żadnych premii.\nDwaj losowo wybrani generałowie, którzy nie mają cechy §Yzmiana przydziału§!, otrzymają dodatkowe statystyki i dodatkową cechę pozytywną."
 SIA_direct_funds_from_the_military_towards_development: "Przekierowanie funduszy z celów wojskowych na rozwojowe"
 SIA_direct_funds_from_the_military_towards_development_desc: "Choć skrzydło wojskowe będzie niezadowolone z przeniesienia funduszy na cele rozwojowe, to ono, a nie my, będzie musiało wyjaśnić opinii publicznej, dlaczego ten brak inwestycji będzie dla niej korzystny."
 SIA_as_the_eyes_turn_towards_southeast_asia: "Uwaga świata skupia się na Azji"
 SIA_as_the_eyes_turn_towards_southeast_asia_desc: "Azja Południowo-Wschodnia nie jest już odległym zakątkiem świata. To skrzyżowanie dróg imperium, rewolucji i wojny. [SIA.GetName] musi zdecydować, czy będzie pionkiem w tej walce, czy też potęgą realizującą własne plany."
 SIA_support_songsuradets_military_clique: "Wsparcie dla kliki wojskowej Songsuradeta"
 SIA_support_songsuradets_military_clique_desc: "Nie każdy oficer jest wrogiem narodu. Songsuradet i jego zwolennicy stanowią zdyscyplinowaną alternatywę wojskową dla skorumpowanych generałów, którzy doprowadzili Syjam na skraj upadku. Dzięki ich wsparciu można przywrócić porządek, nie skazując państwa na chaos."
 SIA_support_songsuradets_military_clique_tt: "W razie wybuchu §Ywojny domowej§! Songsuradet poprze nas i przekaże §Y3§! dodatkowe dywizje.\n§RJeśli wzmocnimy Songsuradeta, a następnie spróbujemy go zatrzymać, w czym pomogłaby nam $SIA_the_songsuradet_rebellion$, może stawić opór.§!"
 SIA_the_royal_police_counterweight: "Policja Królewska"
 SIA_the_royal_police_counterweight_desc: "Policja Królewska to niezależna formacja, którą możemy wykorzystać przeciwko naszej opozycji, jeśli ta spróbuje przejąć władzę."
 SIA_the_royal_police_counterweight_tt: "W razie wybuchu §Ywojny domowej§! Policja Królewska poprze nas i przekaże §Y2§! dodatkową dywizję."
 SIA_for_the_preservation_of_siamese_independence: "Konsolidacja kontroli militarnego skrzydła"
 SIA_for_the_preservation_of_siamese_independence_desc: "W ostatnim wieku światowe mocarstwa niejednokrotnie zagrażały [SIA.GetAdjective] integralności terytorialnej i wygląda na to, że w tym stuleciu będzie podobnie. Musimy podjąć zdecydowane działania, jeżeli chcemy ocalić naszą niezależność. W przeciwnym razie staniemy się państwem kadłubkowym, okaleczonym, podzielonym i rozdartym."
 SIA_for_the_preservation_of_siamese_independence_tt: "§Y$anti_democratic_raids$§! będą teraz zwiększały poparcie §Yskrzydła militarnego§! i zmniejszały poparcie §Yskrzydła cywilnego§!"
 SIA_the_peoples_day: "Dzień Ludu"
 SIA_the_peoples_day_desc: "Zamiast dalej podkreślać rolę wojska w obaleniu dawnej monarchii, powinniśmy doceniać udział samych obywateli. Ustanowienie Dnia Ludu pobudzi naród i pokaże wszystkim ludziom, że zasługują na uznanie."
 SIA_hold_military_parades: "Zorganizowanie defilad wojskowych"
 SIA_hold_military_parades_desc: "W celu zwiększania morale wojska, nagrodzenia naszych generałów i przypomnienia obywatelom o potędze [SIA.GetAdjective] sił zbrojnych, zorganizujemy wielką defiladę w Bangkoku. Dajmy gazetom temat, który warto opisać!"
 SIA_embed_technocrats_in_civilian_institutions: "Wprowadzenie technokratów do instytucji cywilnych"
 SIA_embed_technocrats_in_civilian_institutions_desc: "Możemy stworzyć w rządzie sojusze z technokratami, wykorzystać ich jako przedłużenie skrzydła cywilnego, by sięgnąć dalej i przeciwdziałać wpływom wojska."
 SIA_military_academies_indoctrination: "Indoktrynacja w akademiach wojskowych"
 SIA_military_academies_indoctrination_desc: "Nasze akademie wojskowe są doskonałymi miejscami do szkolenia ideologicznego. Znajduje się tam dobre uzbrojenie, a młodzi kadeci łatwo ulegają wpływom instruktorów. Zyskajmy przychylność instruktorów, by w ten sposób zdobyć młodzież. Silne wojsko, wierne klasie rządzącej, to fundament każdego silnego państwa i takim staniemy się niebawem."
 SIA_the_king_of_the_white_elephant: "Król Białego Słonia"
 SIA_the_king_of_the_white_elephant_desc: "Histeria związana z odzyskaniem utraconych ziem może ogarnąć naród, a świat patrzy. Żeby ostudzić ten zapał, wyprodukujemy film antywojenny, pierwszy tajski obraz w języku angielskim, żeby pokazać światu prawdziwą twarz państwa [SIA.GetAdjective]"
 SIA_the_king_of_the_white_elephant_tt: "Odblokowanie kampanii propagandowej §Y$SIA_the_king_of_the_white_elephant$§! po ukończeniu celu §Y$SIA_sala_chaloem_thai_movie_theater$§!, który przynosi:\nstabilizacja tygodniowa: §G+0,45%§! na 180 dni"
 SIA_drum_up_irredentism: "Wzmocnienie irredentyzmu"
 SIA_drum_up_irredentism_desc: "Pozyskanie poparcia wojska dla przyszłej wojny nie wystarczy, musimy mieć po naszej stronie także całe społeczeństwo. Dzięki wierszom, filmom oraz przemowom przygotujemy naród [SIA.GetAdjective] na ostateczną walkę z imperialistycznymi mocarstwami, które ukradły nasze dawne ziemie."
 SIA_sell_privy_purse_lands: "Sprzedaż ziem korony"
 SIA_sell_privy_purse_lands_desc: "Rodzina królewska posiada ogromne połacie ziemi na terenach, które obecnie są pod naszą kontrolą. Te majątki mogłyby znacznie zwiększyć nasze zasoby finansowe, a część z nich można sprzedać po preferencyjnych cenach wybranym urzędnikom, żeby zyskać ich lojalność."
 SIA_sell_privy_purse_lands_tt: "Kiedy duch zniknie, §Y[SIA_phraya_phahon.GetName]§! pogrąży się w atmosferze skandalu, co pozwoli ci ominąć wymóg faszyzmu dla: §Y$SIA_phibuns_premiership$§!"
 SIA_war_fervor: "Gorączka wojenna"
 SIA_war_fervor_desc: "Konflikt zbliża się z każdym dniem. Ludzie są gotowi, zapałka została zapalona, a gorączka wojenna niebawem sięgnie zenitu. Musimy wykorzystać tę energię w dobrej sprawie."
 SIA_war_fervor_tt: "Poparcie wojny wzrośnie na stałe do czasu jej wypowiedzenia dowolnemu innemu krajowi, po którym ten duch zostanie usunięty.\n\nJeżeli §Ypoparcie wojny§! będzie zbyt długo utrzymać się powyżej §Y95%§! bez wypowiedzenia wojny, wybuchnie wojna domowa.\nPo wypowiedzeniu wojny:"
 SIA_the_midnight_meeting: "Spotkanie o północy"
 SIA_the_midnight_meeting_tt: "[SIA_plaek_phibunsongkhram.GetName] przejmie władzę, stając na czele [SIA.GetAdjective] rządu. Będziemy musieli pozbawić go stanowiska, aby przywrócić prawdziwą monarchię."
 SIA_the_midnight_meeting_desc: "Marszałek polny Songsuradet obserwuje, jak Phibun zdobywa coraz większą władzę, i dostrzega w tym zapowiedź rozliczenia. Jeśli monarchia i Songsuradet mają przetrwać, rojaliści, wyżsi oficerowie i cywilni notable muszą spotkać się w tajemnicy i porozumieć się w sprawie usunięcia Phibuna, zanim ten podejmie przeciwko nim działania."
 SIA_meet_with_king_prajadhipok: "Spotkanie z królem Prajadhipokiem"
 SIA_meet_with_king_prajadhipok_desc: "Spisek bez króla to tylko kolejna wojskowa intryga. Dzięki spotkaniu z królem Prajadhipokiem na wygnaniu możemy nadać naszej sprawie królewską legitymizację i zapewnić sobie poparcie jedynej osoby, której powrót może zmobilizować niezdecydowanych i doprowadzić do rozpadu reżimu."
 SIA_prajadhipok_audience_with_churchill: "[ENG.GetLeader] przyjmuje Prajadhipoka"
 SIA_prajadhipok_audience_with_churchill_desc: "[ENG.GetName] to cel podróży Prajadhipoka, od której zależy coś więcej niż tylko jego prestiż. [ENG.GetLeader] ma duże wpływy. Jeśli Prajadhipokowi uda się przekonać brytyjskie władze, że powstanie lojalistów jest korzystne dla ich interesów w Azji, broń z Malajów może trafić w ręce ludzi wciąż wiernych tronowi."
 SIA_prajadhipok_audience_with_churchill_tt: "[ENG.GetName] dostarczy nam:"
 SIA_prajadhipok_audience_with_churchill_tt2: "Na początku wojny domowej."
 SIA_facilitate_prajadhipoks_move_to_japan: "Ułatwienie Prajadhipokom przeniesienia do Japonii"
 SIA_facilitate_prajadhipoks_move_to_japan_desc: "Wielka Brytania nie jest jedyną potęgą, która może skorzystać na zamieszkach, z którymi zmaga się [ROOT.GetNameDef]. Organizując przejazd Prajadhipoka do Japonii, możemy zyskać przychylność Tokio, a być może nawet zapewnienie, że w razie przerodzenia się powstania rojalistów w wojnę domową otrzymamy japońskie wsparcie wojskowe."
 SIA_facilitate_prajadhipoks_move_to_japan_tt: "[JAP.GetNameDef] wesprze nas 3 dywizjami rangerów podczas wojny domowej."
 SIA_the_kings_gambit: "Królewski gambit"
 SIA_the_kings_gambit_desc: "Prajadhipok zamierza wrócić do Bangkoku, w pełni świadomy tego, że reżim go aresztuje. Ten krok dostarczy rojalistom pretekstu do wyrażenia oburzenia oraz zapewni im legitymizację i autorytet, których potrzebują, by odłożyć na bok wątpliwości i powstać w jego imieniu. Gdy wygnany król zostanie pojmany, zostanie wydany sygnał i rozpocznie się walka, której stawką będzie [ROOT.GetName]."
 SIA_the_kings_gambit_tt: "Nasze wsparcie będzie uzależnione od liczby klik po naszej stronie."
 SIA_restore_order: "Przywrócenie porządku"
 SIA_restore_order_desc: "Wojna domowa została wygrana, ale samo zwycięstwo nie wystarczy, by uleczyć królestwo. Trzeba odbudować zniszczone miasta, spacyfikować starą gwardię i zreorganizować administrację, aby zapewnić krajowi porządek, stabilną monarchię i sprawne funkcjonowanie życia publicznego. [ROOT.GetName] to kraj, który na to zasługuje."
 SIA_ananda_age_trigger_12: "Król Ananda ma co najmniej §Y12§! lat (obecnie §Y[?var:SIA_anandas_age]§!). Urodził się 20 września"
 SIA_ananda_age_trigger_15: "Król Ananda ma co najmniej §Y15§! lat (obecnie §Y[?var:SIA_anandas_age]§!). Urodził się 20 września"
 SIA_ananda_trait_tt: "Gdy Ananda zasiądzie na tronie, otrzyma:"
 SIA_to_forge_a_king: "Stworzenie króla"
 SIA_to_forge_a_king_desc: "Król Ananda przebywa w odległej Szwajcarii i jest na tyle młody, że jego umysł i charakter wciąż się kształtują. Jeśli odpowiednio pokierujemy jego edukacją, być może uda nam się wychować nie tylko koronowaną marionetkę, ale władcę godnego przyszłości, na jaką zasługują [ROOT.GetNameDef] i nasz naród."
 SIA_to_forge_a_king_tt: "Przyszły król, Ananda Mahidol, jest obecnie chłopcem i pobiera naukę za granicą w [SWI.GetAdjective] szkołach. Możemy wpływać na jego przyszłą edukację i zainteresowania, aby wyrósł na wspaniałego króla.\n\nKażdego roku w dniu jego urodzin, aż do ukończenia przez niego 15 lat, będziemy mogli wybrać dla niego dziedzinę, którą będzie studiował, co zapewni mu różne korzyści, gdy w końcu zasiądzie na tronie.\n\nJego urodziny wpadają 20 września. Obecnie ma §Y[?var:SIA_anandas_age]§! lat."
 SIA_ascend_the_throne: "Objęcie tronu"
 SIA_ascend_the_throne_desc: "Okres regencji nie może trwać wiecznie. Ananda osiągnął już wiek, w którym może przejąć ciężar królewskich obowiązków, a jego oficjalna intronizacja pozwoli odrodzonej monarchii wyjść z okresu kurateli i intryg i wkroczyć w nową erę prawowitych rządów."
 SIA_the_provincial_council_of_state: "Rada stanu prowincji"
 SIA_the_provincial_council_of_state_desc: "Walka powoduje rozpad machiny państwowej i podważa autorytet władzy. Dopóki młody król Ananda nie będzie mógł sprawować rządów we własnym imieniu, tymczasową władzę musi przejąć rada stanu prowincji, która ogłosi, że lojaliści walczą nie dla własnej korzyści, lecz w imię przywrócenia prawowitej monarchii."
 SIA_the_regency_of_boworadet: "Regencja Boworadeja"
 SIA_the_regency_of_boworadet_desc: "Książę Boworadej reprezentuje prestiż dawnego porządku i nikt nie ma wątpliwości, komu jest lojalny. Mianując go regentem w imieniu Anandy, przekazujemy państwo w ręce konserwatystów i dajemy jasno do zrozumienia, że odnowienie monarchii to coś więcej niż tylko zmiana ministrów."
 SIA_the_sacred_hierarchy: "Święta hierarchia"
 SIA_the_sacred_hierarchy_desc: "Boworadej uważa, że królestwo jest najsilniejsze wtedy, gdy każdy stan zna swoje miejsce, a król stoi ponad wszelkimi doczesnymi ambicjami. Monarchia, wiara i naturalna [ROOT.GetAdjective] hierarchia muszą być ponownie traktowane jako święte filary, a nie jako relikty, które można na coś przehandlować."
 SIA_the_regency_of_songsuradet: "Regencja Songsuradeta"
 SIA_the_regency_of_songsuradet_desc: "Songsuradet nie jest liberałem, ale nie jest też głuchy na potrzeby nowoczesnego państwa. Jako regent potrafi zachować królewski autorytet, powierzając jednocześnie [ROOT.GetAdjective] przyszłość dyscyplinie, planowaniu oraz kierowanemu przez wojsko programowi rozwoju narodowego."
 SIA_order_discipline_and_unity: "Nakaz zachowania jedności i dyscypliny"
 SIA_order_discipline_and_unity_desc: "Chaos spowodowany walkami frakcyjnymi i wojną domową niemal doprowadził do upadku królestwa. Odpowiedź Songsuradeta jest prosta: porządek w rządzie, dyscyplina w społeczeństwie i wspólny cel, aby królestwo odrodziło się jako silniejsze i bardziej nowoczesne państwo."
 SIA_the_regency_of_rangsit: "Regencja Rangsita"
 SIA_the_regency_of_rangsit_desc: "Książę Rangsit rozumie, że warunkiem przetrwania monarchii jest pojednanie z rządem przedstawicielskim. Jego regencja daje szansę na przywrócenie monarchii, która zachowuje konserwatywny majestat, ale opiera się na demokratycznych zasadach i jest gotowa zapewnić [ROOT.GetAdjective] narodowi stabilną parlamentarną przyszłość."
 SIA_constitutional_virtue: "Cnota konstytucyjna"
 SIA_constitutional_virtue_desc: "Monarchia przestrzegająca prawa jest trudniejsza do obalenia i łatwiejsza do obrony. Pod przewodnictwem Rangsita przywrócimy rządy konstytucyjne, ograniczymy samowolę władzy i uświadomimy narodowi, że monarchia jest najbezpieczniejsza, gdy pełni rolę strażnika wolności opartej na prawie."
 SIA_an_absolute_monarchy: "Monarchia absolutna"
 SIA_an_absolute_monarchy_desc: "Eksperyment z ograniczoną monarchią przyniósł jedynie upokorzenia, zamachy stanu i uzurpację władzy królewskiej przez ambitnych oficerów. Jeśli tron ma znowu cieszyć się lojalnością, monarchia musi odzyskać pełnię swoich prerogatyw i sprawować rządy bez podporządkowania partiom politycznym czy parlamentowi."
 SIA_a_constitutional_monarchy: "Monarchia konstytucyjna"
 SIA_a_constitutional_monarchy_desc: "Tron nie musi sprawować absolutnej władzy nad państwem, aby zapewnić przetrwanie królestwa. Przywracając monarchię w ramach trwałego porządku konstytucyjnego, możemy zacieśnić więź między koroną a narodem oraz zagwarantować współistnienie królewskiego majestatu z odpowiedzialnym rządem."
 SIA_to_lay_the_bait: "Zanęcanie"
 SIA_to_lay_the_bait_tt: "Ujawnimy sfabrykowany plan gospodarczy, aby sprowokować wojsko.\nIm dłużej odkładane będzie §Y$SIA_and_spring_the_trap$§!, tym większy będzie sprzeciw wobec wojska i tym silniejsze stanie się nasze poparcie.\n\n$SIA_dem_event_count_cw_scale_tt$\n\nZa każdym razem, gdy wojsko skrytykuje ten fałszywy projekt, nasze poparcie w wojnie domowej wzrośnie, aż do maksymalnego poziomu §Y75%§! poparcia w wojnie domowej. Dodatkowe §Y25%§! poparcia w wojnie domowej można uzyskać z naszego całkowitego poparcia demokratycznego (skalowanego z §Y0-100%§!)."
 SIA_dem_event_count_cw_scale_tt: "§YObecne przewidywane wsparcie§!: §G[?var:SIA_dem_event_count_cw_scale|%]§!"
 SIA_to_lay_the_bait_desc: "Żółte akta postulują reformę gospodarczą, ale wojsko uzna to za komunizm. Ujawniając najpierw sfabrykowany radykalny projekt, możemy wywołać ich oburzenie, a następnie podważyć ich wiarygodność, gdy opublikowana zostanie prawdziwa, łagodniejsza wersja."
 SIA_and_spring_the_trap: "Uruchomienie pułapki"
 SIA_and_spring_the_trap_desc: "Generałowie połknęli przynętę. Ich oburzenie przerodziło się w bunt, a bunt ujawnił ich ambicje - na co cywilny rząd był przygotowany. Teraz pułapka się zamyka, a o [ROOT.GetAdjective] przyszłości zadecydują ci, którzy pozostają wierni konstytucji."
 SIA_and_spring_the_trap_tt: "Jeśli nasze całkowite poparcie przekroczy §Y80%§!, unikniemy wojny domowej i natychmiast pozbawimy wojsko władzy."
 SIA_rebuild_the_war_torn_economy: "Odbudowa gospodarki ze zniszczeń wojennych"
 SIA_rebuild_the_war_torn_economy_desc: "Wojna domowa zniszczyła drogi, fabryki, pola ryżowe i szlaki handlowe. Odbudowa musi rozpocząć się natychmiast. Płace, zboże, linie kolejowe i kredyty przyczynią się do stabilizacji sytuacji bardziej niż jakiekolwiek przemówienie wygłoszone w Bangkoku. Tego właśnie potrzebuje [ROOT.GetName]."
 SIA_end_military_grift: "Koniec oszustwa wojskowych"
 SIA_end_military_grift_desc: "Zbyt długo budżety wojskowe służyły do powiększania prywatnych fortun, zasilania klientelistycznych układów i finansowania bezużytecznych projektów budujących prestiż. Wojna ujawniła tę zgniliznę. Każdy przypadek korupcji przy zawieraniu kontraktów, fikcyjnej jednostki i skradzionej dostawy musi zostać zbadany, a wydane na nie środki odebrane starej klice."
 SIA_the_purge: "Czystka"
 SIA_the_purge_desc: "Klika wojskowa wolała skąpać naród we krwi, niż podporządkować się cywilnej władzy. Nie ma kompromisu ze zdrajcami. Oficerów, kolaborantów i sympatyków należy usunąć ze wszystkich stanowisk dowódczych, zanim znów zagrożą państwu."
 SIA_achieve_foreign_legitimacy: "Zdobycie międzynarodowej legitymizacji"
 SIA_achieve_foreign_legitimacy_desc: "Zagraniczne mocarstwa obserwowały nasz kryzys z niepewnością, zastanawiając się, czy Syjam ulegnie juncie, czy też wybuchnie w nim rewolucja. Musimy udowodnić, że cywilne rządy są stabilne, przestrzegają prawa i są w stanie bronić kraj."
 SIA_achieve_foreign_legitimacy_trigger: "Opinia dowolnego mocarstwa o nas jest większa niż §Y75§!"
 SIA_countries_that_like_me_doctrine_tt: "§Y[?var:SIA_countries_that_like_me]x§! §G50%§! redukcji kosztu §Ydoktryny lądowej§!"
 SIA_achieve_foreign_legitimacy_tt: "§G[?var:SIA_achieve_foreign_legitimacy_base_stab_gain|%.0]§! stabilizacji za każde mocarstwo, którego opinia o nas jest większa niż §Y75§!.\n\nJeśli takich mocarstw jest więcej niż §Y3§!, zyskamy §Y1x§! §G50%§! redukcji kosztów: §Ydoktryny lądowej§! za każde mocarstwo ponad ten próg.\n\nJeśli takich mocarstw jest co najmniej §Y6§!, zyskujemy §G+2§! §Yfabryki cywilne§!."
 SIA_secure_the_state: "Zabezpieczenie kraju"
 SIA_secure_the_state_desc: "Zwycięstwo w wojnie domowej nie oznacza jeszcze stabilizacji. Należy zabezpieczyć linie kolejowe, porty, arsenały i węzły komunikacyjne, zanim reakcyjni oficerowie zdążą się przegrupować. W Bangkoku musi panować spokój, miasto musi mieć zapewnione połączenia komunikacyjne i pozostawać pod ścisłą kontrolą cywilnych władz."
 SIA_expand_upon_the_dossier: "Rozbudowa żółtych akt"
 SIA_expand_upon_the_dossier_desc: "Żółte akta powstały z myślą o trudnym momencie. Ten moment już minął. Po pokonaniu wojskowej kliki możemy pójść o krok dalej: przeprowadzić głębszą reformę rolną, zapewnić lepszą ochronę praw pracowniczych oraz stworzyć państwo zdolne do gruntownej przebudowy Syjamu."
 SIA_military_oversight_bureau: "Biuro Nadzoru Wojska"
 SIA_military_oversight_bureau_desc: "Nie można dopuścić, by armia ponownie stała się państwem w państwie. Cywilna agencja nadzorcza będzie monitorować nominacje, budżety i działalność polityczną w siłach zbrojnych, dbając o to, by to koszary odpowiadały przed Bangkokiem, a nie odwrotnie."
 SIA_military_oversight_bureau_tt: "§YBNW§! przeprowadza postępowania wyjaśniające wobec generałów co 5-9 miesięcy. W tym okresie generałowie, którzy są przedmiotem dochodzenia, działają z mniejszą wydajnością, obawiając się wzmożonej kontroli."
 SIA_the_yellow_dossier: "Żółte akta"
 SIA_the_yellow_dossier_desc: "Fałszywy radykalny projekt spełnił swoje zadanie. Teraz można wprowadzić w życie prawdziwe żółte akta: wyważone reformy, modernizację gospodarczą oraz zabezpieczenia polityczne mające na celu przełamanie dominacji wojskowej bez pogrążania kraju w chaosie."
 SIA_achieve_domestic_legitimacy: "Zdobycie legitymizacji w kraju"
 SIA_achieve_domestic_legitimacy_desc: "Rząd utrzymał się przy władzy dzięki sile zbrojnej, ale teraz musi zwyciężyć dzięki prawu, chlebowi i porządkowi. Należy przywrócić zaufanie społeczne, uzasadnić wprowadzenie nadzwyczajnych środków i pokazać obywatelom, że cywilne rządy oferują coś więcej niż tylko przetrwanie."
 SIA_achieve_domestic_legitimacy_tt: "§YSystem Khana Ratsadon§! zostanie wyłączony.\n§YSkrzydło wojskowe§! zostanie trwale rozwiązane, a jego duch całkowicie usunięty.\n\n§YSkrzydło cywilne§! zostanie trwale przekształcone w: §Y$idea_SIA_unwavering_civilian_support$§!."
 SIA_allies_integration: "Integracja z aliantami"
 SIA_allies_integration_desc: "Nasze siły zbrojne muszą nauczyć się walczyć ramię w ramię z aliantami. Struktury dowodzenia, systemy łączności, procedury zaopatrzeniowe oraz standardy wyposażenia muszą zostać ujednolicone, zanim Syjam będzie mógł stać się czymś więcej niż tylko symbolicznym partnerem."
 SIA_prepare_for_a_pacific_war: "Przygotowania do wojny na Pacyfiku"
 SIA_prepare_for_a_pacific_war_desc: "Uwaga imperiów skupia się na Pacyfiku. Ambicje Japonii, europejskie kolonie i strategia aliantów - wszystko to zapowiada nadchodzącą burzę. Syjam musi przygotować się, zanim pierwsze strzały dosięgną naszych brzegów."
 SIA_the_end_of_gunboat_diplomacy: "Koniec dyplomacji kanonierek"
 SIA_the_end_of_gunboat_diplomacy_desc: "Nigdy więcej zagraniczne okręty wojenne nie będą dyktować warunków u ujścia rzeki Chao Phraya. Syjam musi dysponować działami, dokami, minami i umocnieniami brzegowymi, dzięki którym każda próba ataku na Bangkok stanie się aktem szaleństwa."
 SIA_preemtive_strike: "Uderzenie wyprzedzające"
 SIA_preemtive_strike_desc: "Czekanie, aż Japonia wybierze moment rozpoczęcia wojny, byłoby szaleństwem. Jeśli imperium zamierza przetoczyć się przez Azję, to [SIA.GetName] musi uderzyć, zanim [SIA.GetAdjective] armie i floty zostaną w pełni zaangażowane gdzie indziej."
 SIA_the_siamese_armada: "Armada [SIA.GetAdjective]"
 SIA_the_siamese_armada_desc: "Nowoczesne [SIA.GetAdjective] państwo potrzebuje nowoczesnej floty. Dzięki nowym okrętom, wyszkolonym załogom i rozbudowanej infrastrukturze morskiej [SIA.GetAdjective] flota stanie się siłą zdolną do obrony naszych wybrzeży i wywierania wpływu poza ich granicami."
 SIA_asian_democratic_compact: "Azjatycka ugoda demokratyczna"
 SIA_a_more_moderate_option: "Bardziej umiarkowana opcja"
 SIA_a_more_moderate_option_desc: "Reforma musi trwać, a nie wypalić się w ogniu sprzeciwu. Utrzymując żółte akta w umiarkowanych ryzach, możemy odizolować ekstremistów, uspokoić klasę średnią i zbudować cywilny porządek, który przetrwa swoje pierwsze zwycięstwo."
 SIA_asian_democratic_compact_desc: "Azja nie może wiecznie polegać na odległych imperiach ani obietnicach wielkich mocarstw. Demokratyczne narody regionu muszą stanąć ramię w ramię, bronić się nawzajem i udowodnić, że niezależność i wolność mogą przetrwać w Azji."
 SIA_asian_democratic_compact_tt: "Odblokowuje możliwość domagania się niepodległości dla azjatyckich poddanych państw oraz zapraszania ich do naszej frakcji."
 SIA_asian_democratic_compact_modify: "Modyfikuje: §Y$SIA_asian_democratic_compact$§! o:"
 SIA_southeast_asia_joint_command: "Połączone Dowództwo Azji Południowo-Wschodniej"
 SIA_southeast_asia_joint_command_desc: "Nasz pakt musi stać się czymś więcej niż tylko dyplomatyczną obietnicą. Wspólne dowództwo będzie koordynować strategię, zaopatrzenie, wywiad i plany obronne w całej Azji Południowo-Wschodniej, przekształcając odrębne armie we wspólną tarczę."
 SIA_pan_asian_weapon_standardization: "Ogólnoazjatycki standard uzbrojenia"
 SIA_pan_asian_weapon_standardization_desc: "Korzystanie przez sojuszników z różnych karabinów, kalibrów, radiostacji i pojazdów stwarza ryzyko logistycznej porażki. Ujednolicenie uzbrojenia i wspólne plany produkcyjne sprawią, że nasza koalicja będzie silniejsza, tańsza i szybciej uzbrojona."
 SIA_united_against_aggression: "Zjednoczeni wobec agresji"
 SIA_united_against_aggression_desc: "Żaden członek naszego paktu nie pozostanie sam. Niezależnie od tego, czy zagrożenie będzie pochodzić ze strony imperium, faszyzmu, militaryzmu czy oportunistycznych sąsiadów, narody Azji odpowiedzą wspólnie."
 SIA_the_hammers_that_strike: "Potężne młoty"
 SIA_the_hammers_that_strike_desc: "Nasz sojusz nie jest już zbiorem małych państw, które liczą na przetrwanie. Jest bronią. Każdy naród jest młotem i razem uderzymy w każdą potęgę, która będzie dążyć do dominacji w Azji."
 SIA_mobilize_the_defenders_of_siam: "Mobilizacja obrońców Syjamu"
 SIA_mobilize_the_defenders_of_siam_desc: "Dawne wojsko zawiodło naród, ale Syjam wciąż potrzebuje obrońców. Ochotnicy, lojalni oficerowie, prowincjonalni strażnicy oraz patriotyczni obywatele muszą zostać zorganizowani, aby tworzyć siły chroniące konstytucję przed wrogami zarówno wewnętrznymi, jak i zewnętrznymi."
 SIA_join_the_allies: "Dołączenie do aliantów"
 SIA_join_the_allies_desc: "[ROOT.GetName] nie może stać z boku, gdy świat jest pogrążony w wojnie. Alianci oferują broń, uznanie i miejsce wśród narodów opierających się agresji. Dołączając do nich, wiążemy przetrwanie Syjamu z szerszą walką o wolny świat."
 SIA_the_malay_peninsular_defense_plan: "Plan obrony Półwyspu Malajskiego"
 SIA_the_malay_peninsular_defense_plan_desc: "Jeśli w Azji Południowo-Wschodniej wybuchnie wojna, Malaje staną się jedną z pierwszych aren walk. Umocnienia, magazyny zaopatrzeniowe oraz wspólne działania z Brytyjczykami sprawią, że półwysep stanie się tarczą chroniącą przed inwazją."
 SIA_the_malay_peninsular_defense_plan_tt: "Buduje linię kolejową między Bangkokiem a Singapurem.\n\nKażdy punkt zwycięstwa w: [MAL.GetName], Singapur, [724.GetName], [289.GetName] i [1076.GetName]\nDodanie §G2§! §Yfortyfikacji brzegowych§!\nDodanie §G2§! §Yfortyfikacji lądowych§!\nKażdy z tych regionów:\nDodanie §G1§! §Ystatycznej obrony przeciwpowietrznej§!"
 SIA_join_the_united_front: "Przystąpienie do zjednoczonego frontu"
 SIA_join_the_united_front_desc: "Chiny cierpią z powodu [JAP.GetAdjective] agresji, a mimo to nadal walczą. Dołączając do zjednoczonego frontu, [SIA.GetName] może pomóc zamienić wojnę na lądzie w cmentarzysko imperialnych ambicji."
 SIA_a_land_war_in_asia_desc: "Wojny nie można wygrać samymi deklaracjami. Syjamskie oddziały muszą maszerować, walczyć i znosić ciężkie warunki panujące w Azji. Nasze zaangażowanie w zjednoczony front musi przejawiać się konkretnymi działaniami."
 SIA_death_to_the_communists: "Śmierć komunistom"
 SIA_death_to_the_communists_desc: "Pokonanie kliki wojskowej nie może otworzyć drzwi kolejnej tyranii. Komunistyczni agitatorzy są przekonani, że kryzys osłabił państwo. Wkrótce przekonają się, że cywilna demokracja nie jest bezbronna."
 SIA_death_to_the_nationalists: "Śmierć nacjonalistom"
 SIA_death_to_the_nationalists_desc: "Japonia została wyparta, ale kwestia przyszłości Azji pozostaje otwarta. Stary nacjonalistyczny porządek zastąpi tylko jedną hierarchię inną. Jeśli Azja ma zostać przekształcona, muszą zwyciężyć komuniści."
 SIA_a_new_dawn_over_asia: "Nowy świt w Azji"
 SIA_a_new_dawn_over_asia_desc: "Japońskie imperium upadło, a skorumpowane siły, które chciały przejąć jego ruiny, zostały odrzucone. W całej Azji nastał nowy świt dla narodów zdeterminowanych, by budować swoją przyszłość wolną od imperialnej dominacji."
 SIA_phibuns_premiership: "Premierostwo Phibuna"
 SIA_phibuns_premiership_desc: "[SIA_phraya_phahon.GetName] kończy swoją misję na stanowisku premiera, a władzę przejmie następca wybrany przez partię, Plaek Phibunsongkhram. To poprawi nasze notowania w szeregach wojska, ale wywoła obawy skrzydła cywilnego.\nW nową epokę możemy wejść tylko w jeden sposób, z wielką wiarą!"
 SIA_siamese_youth_movement: "Ruch Młodzieży [THIS.GetAdjective]"
 SIA_siamese_youth_movement_desc: "[THIS.GetName]: młodzi dorośli potrzebują dyscypliny, trzeba ich zahartować niczym stal w ogniu. Nauczą się szacunku dla państwa, działać w obronie ojczyzny i być wartościowymi członkami tajskiego społeczeństwa."
 SIA_territorial_defense_student: "Student obrony terytorialnej"
 SIA_territorial_defense_student_desc: "Dzięki powiększeniu ruchu młodzieżowego najbardziej obiecujący kandydaci mogą trafić do obozów szkolenia wojskowego, gdzie będą pomagać w obronie [SIA.GetAdjective] ziemi. Przejdą oni odpowiednie szkolenie wojskowe i staną się dodatkowym narzędziem w dyspozycji armii."
 SIA_expand_domestic_arms_workshops: "Rozbudowa krajowych zakładów zbrojeniowych"
 SIA_expand_domestic_arms_workshops_desc: "Nasze krajowe możliwości produkcji sprzętu wojskowego pozostają daleko w tyle za innymi rozwiniętymi krajami. Musimy skupić się na rozbudowie produkcji zbrojeniowej w ojczyźnie, by szybko dostarczać je naszym oddziałom."
 SIA_look_to_european_fascism: "Spojrzenie w stronę europejskiego faszyzmu"
 SIA_look_to_european_fascism_desc: "Mamy możliwość zreformowania tego kraju. Po wyzwoleniu się z okowów przeszłości i zainspirowani wydarzeniami na Zachodzie spojrzymy ku nowej przyszłości. Oczywistym jest, że stary porządek świata legł w gruzach, a ci, którzy pozostaną w tyle, odczują skutki swojego braku wyobraźni."
 SIA_the_songsuradet_rebellion: "Rebelia Songsuradeta"
 SIA_the_songsuradet_rebellion_desc: "Starszy oficer Phraya Songsuradet stanowiłby zagrożenie dla obecnego reżimu, gdyby tylko tego chciał. Nie można tego tolerować, dlatego też główny rywal Phibuna musi odejść.\nDysponujemy obszernymi materiałami, które mogą zostać wykorzystane do obciążenia Songsuradeta i jego popleczników, co przyczyniłoby się do umocnienia naszej władzy i wyeliminowania krajowych oponentów."
 SIA_the_songsuradet_rebellion_historical_tt: "Generał Phraya Songsuradet zostanie oskarżony o spisek przeciwko państwu. Usunięty zostanie zarówno on sam, jak i jego doradca, §Y[SIA_rangsit_prayurasakdi.GetName]§!.\n\nZyskamy:\n"
 SIA_the_songsuradet_rebellion_historical_tt2: "Po ukończeniu zyskamy:"
 SIA_the_songsuradet_rebellion_historical_tt3: "na §Y[?var:SIA_purged_military_timer]§! dzień (dni)"
 SIA_the_songsuradet_rebellion_alt_tt: "Generał Phraya Songsuradet zostanie oskarżony o spisek przeciwko państwu.\n\nJednak z uwagi na to, że wzmocniliśmy jego wojskową klikę, może on, ośmielony, odrzucić wezwanie, doprowadzając do impasu bądź nawet wojny domowej."
 SIA_sue_the_king_in_exile: "Wytoczenie procesu królowi na uchodźstwie"
 SIA_sue_the_king_in_exile_desc: "Podobno król na uchodźstwie zabrał ze sobą wiele kosztowności do [ENG.GetAdjective] kraju. Powinniśmy je odzyskać. Jeśli musimy w tym celu wytoczyć proces jemu i jego małżonce, to niech tak będzie."
 SIA_suspend_ordinary_legal_procedures: "Zawieszenie zwykłych procedur prawnych"
 SIA_suspend_ordinary_legal_procedures_desc: "Dzięki rebelii Songsuradeta mamy możliwość wprowadzenia szeroko zakrojonych reform w imię bezpieczeństwa narodowego. Mechanizmy kontroli i równowagi, będące w rękach sądów i innych organów politycznych, zostaną osłabione, dając nam czas potrzebny na centralizację władzy."
 SIA_the_duty_of_the_thai_people_during_the_war_act: "Obowiązki narodu tajskiego w czasie działań wojennych"
 SIA_the_duty_of_the_thai_people_during_the_war_act_desc: "$idea_SIA_cemented_control_3_desc$"
 SIA_recognize_manchukuo: "Uznanie Mandżukuo"
 SIA_recognize_manchukuo_desc: "TODO_CM"
 SIA_press_censorship: "Cenzura prasy"
 SIA_press_censorship_desc: "Wolna prasa jest zagrożeniem dla stabilności państwa. Choć dobrze jest mieć pewien wybór, musimy zadbać o to, by głos i wola władz miały w mediach pierwszeństwo."
 SIA_department_of_publicity: "Departament Promocji"
 SIA_department_of_publicity_desc: "Machina propagandowa jest niezbędna w każdym kraju, a w szczególności takim jak nasz, mającym pewne ambicje terytorialne. Możemy tego dokonać poprzez sfinansowanie Departamentu Promocji."
 SIA_thai_cultural_mandates: "Tajskie dekrety kulturowe"
 SIA_thai_cultural_mandates_desc: "Wydając dekrety, możemy pobudzić tajską ludność do działania i stworzyć silną kulturę narodową, a tym samym wzmocnić jedność narodu i ukształtować wspólną tożsamość."
 SIA_thai_cultural_mandates_tt: "Odblokowanie decyzji o wydaniu dekretów kulturowych dających rozmaite wzmocnienia dla kosztu §Ysiły politycznej§!. Dekret pierwszy oraz pierwszy z reszty dekretów są za darmo."
 SIA_relocate_the_capital_to_phetchabun: "Przeniesienie stolicy do Phetchabunu"
 SIA_relocate_the_capital_to_phetchabun_desc: "Nasz rząd jest zagrożony! Historia dowiodła, że Bangkok jest narażony na ataki z morza, zatem choć z pewnością nie będzie to zbyt popularna decyzja, jesteśmy zmuszeni przenieść stolicę w głąb lądu."
 SIA_relocate_the_capital_to_phetchabun_tt: "Przenosi do §G3§! §Yfabryk wojskowych§! z regionu §Y[1076.GetName]§! do regionu §Y[1077.GetName]§!\nPrzenosi §G3§! §Yfabryki cywilne§! z regionu §Y[1076.GetName]§! do regionu §Y[1077.GetName]§!\nBuduje fortyfikacje poziomu §G3§! wokół Phetchabunu"
 SIA_relocate_the_capital_to_phetchabun_tt2: "Po upływie limitu czas duchów - stabilizacja podstawowa: §R-25%§!"
 SIA_radio_propaganda: "Propaganda radiowa"
 SIA_radio_propaganda_desc: "Wraz z rozwojem elektryfikacji [SIA.GetAdjective] kraju radio staje się kluczowym medium, toteż powinniśmy mieć kontrolę nad tym, co jest emitowane, podobnie jak ma to miejsce w przypadku prasy."
 SIA_sala_chaloem_thai_movie_theater: "Kino Sala Chaloem Thai"
 SIA_sala_chaloem_thai_movie_theater_tt: "Odblokowanie decyzji o tworzeniu filmów propagandowych dających rozmaite wzmocnienia. Na przykład:\n"
 SIA_sala_chaloem_thai_movie_theater_desc: "Filmy są w naszym kraju medium nowym, lecz ich potencjał jest dla wszystkich oczywisty. Tak samo jak w przypadku wierszy, powieści i radia, można za ich pomocą wypełnić serca i umysły zarówno pospólstwa, jak i elity. Dzięki filmom możemy wzmocnić w naszych obywatelach determinację w budowaniu wielkiego państwa [SIA.GetAdjective]"
 SIA_pan_thaiism: "Idea zjednoczenia Tajów"
 SIA_pan_thaiism_desc: "[ROOT.GetName] nie chce jedynie trwać, potrzebuje się także rozwijać. Przyszłość [ROOT.GetAdjective] narodu nie może polegać na pogodzeniu się ze statusem państwa trzeciej kategorii, kraj powinien stać się aktywnym graczem na arenie międzynarodowej. Przede wszystkim należy zmobilizować serca i umysły ludności przeciwko imperialistom, którzy odebrali nam to, co kiedyś było nasze, jak również przypomnieć narodowi o tym, co zostało nam zabrane."
 vichy_exist_trigger: "§YFrancja Vichy§! istnieje"
 vichy_exist_not_trigger: "§YFrancja Vichy§! nie istnieje"
 SIA_retake_lost_british_states: "Odzyskanie utraconych terytoriów brytyjskich"
 SIA_retake_lost_british_states_tt: "Odblokowanie możliwości rozpoczęcia ograniczonych wojen przeciwko brytyjskim terytoriom w §YBirmie§! i §YMalezji§!"
 INS_retake_lost_british_states_tt: "Odblokowanie możliwości rozpoczęcia ograniczonych wojen przeciwko brytyjskim terytoriom w §YMalezji§!"
 SIA_retake_lost_british_states_desc: "Nie tylko [FRA.GetAdjective] państwo podzieliło nasze wspaniałe królestwo, [ENG.GetAdjective] kraj w swej ambicji również wykorzystywał każdą okazję, by zagrabić choćby jego część. Obydwa te państwa są obecnie skupione na większych rywalach, więc jest to dla nas doskonały moment, by działać."
 SIA_recover_indochina: "Odzyskanie Indochin"
 SIA_recover_indochina_desc: "Przez ostatnie stulecie nasz kraj był podzielony przez państwo [FRA.GetAdjective] - rząd po drugiej stronie świata, który nie powinien mówić nam, co mamy robić ani jak żyć, a mimo to w swoich kanonierkach i z bronią w ręku odebrali nam nasze ziemie. Obecnie siła [FRA.GetAdjective] kraju słabnie, więc ten wiek będzie należeć do nas."
 SIA_recover_indochina_tt: "Odblokowanie możliwości rozpoczęcia ograniczonych wojen przeciwko terytoriom §YIndochin§!"
 SIA_demand_the_return_of_lost_territory: "Zażądaj zwrotu utraconego terytorium"
 SIA_demand_the_return_of_lost_territory_desc: "[FRA.GetNameDefCap] jest krajem bezsilnym, będącym jedynie papierowym tygrysem kurczowo trzymającym się resztek swoich wpływów. Wraz z osłabieniem wojsk nie mają oni możliwości pokazać swojej siły i nie są w stanie przeciwstawić się naszym żądaniom."
 SIA_demand_the_return_of_lost_territory_tt: "Poprosimy rządy mające kontrolę nad §YIndochinami§! i częścią §Y[MAL.GetAdjective]§! kraju o zwrócenie nam regionów §Y[1069.Getname]§!, §Y[1067.Getname]§!, §Y[741.Getname]§!, §Y[1068.Getname]§!, §Y[1061.Getname]§!, §Y[1064.Getname]§!, §Y[1065.Getname]§! i §Y[670.Getname]§!.\n\nCzynniki wpływające:\n- Siła armii na poziomie co najmniej 30% w porównaniu do właściciela regionu\n- Właściciel regionu w stanie wojny z mocarstwem\n- Właściciel regionu nie jest częścią frakcji\n- Właścicielem jest §YFrancja Vichy§!\n- Nasz kraj jest częścią frakcji\n- Właściciel regionu żywi do nas niechęć"
 SIA_the_greater_thai_empire: "Większe Imperium Tajskie"
 SIA_the_greater_thai_empire_available_trigger: "§Y[ROOT.GetName]§! kontroluje każdy region Indochin\nPosłuszeństwo każdego regionu Indochin jest większe niż: §Y[?var:SIA_greater_thai_empire_compliance_requirement]%§!\n\nDodatkowe wymagania:"
 SIA_the_greater_thai_empire_desc: "Nadszedł moment sięgnięcia po władzę. Odzyskaliśmy to, co niegdyś zostało nam odebrane. Dzięki ludności, która uznaje naszą władzę, mamy obecnie właściwie ugruntowaną pozycję prawowitych przywódców odnowionego Wielkiego Imperium Tajskiego."
 SIA_crack_down_of_foreign_merchants: "Rozprawienie się z obcymi kupcami"
 SIA_crack_down_of_foreign_merchants_desc: "Nasz handel od dawna kształtowany był przez zagraniczne interesy, co mogło mieć negatywny wpływ na odporność kraju. Żeby zapewnić bezpieczeństwo gospodarcze, musimy kontrolować krajowy handel, aby dobrobyt i stabilność państwa oparte były na filarach kontrolowanych jedynie przez nas."
 SIA_royal_palace_bureau_directive_no_1523: "Dyrektywa nr 1523 biura pałacu królewskiego"
 SIA_royal_palace_bureau_directive_no_1523_desc: "Wraz z falą nacjonalizmu w kraju nawet korona poparła nasz rząd, prosząc każdego członka pałacu królewskiego o wpłatę 10% swojego dochodu na zakup ulepszonego uzbrojenia."
 SIA_end_factionalism: "Koniec frakcyjności"
 SIA_end_factionalism_desc: "Przepaść pomiędzy wojskowym i cywilnym skrzydłem Khana Ratsadon odbijała się na każdej decyzji podejmowanej od czasu rewolucji. Jeżeli zdołamy wystarczająco długo utrzymać poparcie obu frakcji dla rządu, być może ostatecznie połączymy je w jednolitą, zjednoczoną Partię Ludową i na dobre pogrzebiemy widmo przewrotu."
 SIA_end_factionalism_available_tt: "Zarówno §Yskrzydło cywilne§!, jak i §Yskrzydło wojskowe§! miały §Gpełne poparcie§! przez §Y270§! dni z rzędu."
 SIA_end_factionalism_tt: "Frakcyjna rywalizacja wewnątrz Khana Ratsadon dobiegła końca:\n Skrzyła §Ycywilne§! i §Ywojskowe§! zostały połączone w §Gzjednoczoną Partię Ludową§!\n Zyskujesz ducha §Y$idea_SIA_unified_khana_ratsadon$§!"
 SIA_turn_off_the_khana_ratsadon: "Partia Khana Ratsadon jest nieaktywna"
 SIA_factionalism_overcome: "Przezwyciężenie frakcyjności"
 SIA_new_territories_administration: "Administracja nad nowymi terytoriami"
 SIA_new_territories_administration_tt: "Odblokowanie decyzji o zarządzaniu §Yindochińskimi§! terytoriami, co zwiększa posłuszeństwo, rozwija przemysł i rozbudowuje fortyfikacje."
 SIA_new_territories_administration_desc: "Odzyskanie utraconych ziem to jedynie początek. Musimy pokazać obecnym mieszkańcom tych terenów, że jesteśmy lepszym wyborem. Uruchomimy szeroko zakrojony program w celu poprawy standardu życia każdego obywatela, aby wszyscy byli równi w naszym nowym, wspaniałym [ROOT.GetAdjective] kraju."
 SIA_new_territories_administration_available_trigger: "Dowolny region na obszarze §YIndochin§!\n   jest kontrolowany przez: §Y[ROOT.GetName]§!"
 SIA_industrialization_drive: "Dążenie do industrializacji"
 SIA_industrialization_drive_desc: "Od pokoleń [ROOT.GetName] opiera swój dobrobyt na polach ryżowych i wiejskich osadach. Jednak współczesny świat kształtują nie pługi, lecz fabryki i maszyny. Jeśli chcemy zachować naszą niezależność wśród wielkich mocarstw, musimy przekształcić nasze rolnicze królestwo w kraj przemysłowy."
 SIA_industrialization_drive_trigger: "Partia §YKhana Ratsadon§! jest aktywna"
 SIA_asian_financial_compact: "Azjatyckie porozumienie finansowe"
 SIA_asian_financial_compact_desc: "Europejski kapitał nadal dominuje nad większością azjatyckiego handlu, co naraża naszą gospodarkę na zagraniczne naciski. Dążąc do zacieśnienia współpracy finansowej z naszymi sąsiadami, możemy zwiększyć nasz dostęp do kredytów, rynków i inwestycji bez utraty niezależności."
 SIA_revision_of_unequal_treaties: "Rewizja traktatów nierównoprawnych"
 SIA_revision_of_unequal_treaties_desc: "Stare umowy podpisane pod presją nadal przyznają zagranicznym podmiotom przywileje, których żadne nowoczesne państwo nie powinno tolerować. Musimy zrewidować te nierówne traktaty, dzięki czemu [ROOT.GetNameDef] odzyska pełną władzę nad handlem, sądami i koncesjami."
 SIA_renegotiate_teak_control: "Renegocjacje w sprawie kontroli nad tekiem"
 SIA_renegotiate_teak_control_desc: "Nasze północne lasy przynoszą zyski koncesjonariuszom, podczas gdy państwo otrzymuje zbyt małą część tych dochodów. Dzięki renegocjacji zasad zarządzania uprawą drzew tekowych możemy zapewnić sobie przysługujące nam dochody, uregulować pozyskiwanie drewna i zagwarantować, by drewno z Syjamu służyło rozwojowi tego kraju."
 SIA_a_fledgling_tobacco_industry: "Rodzący się przemysł tytoniowy"
 SIA_a_fledgling_tobacco_industry_desc: "Uprawa tytoniu pozostaje niewielką, rozproszoną i słabo zorganizowaną gałęzią gospodarki. Dzięki umiarkowanej ochronie i rozważnym inwestycjom ta skromna uprawa może stać się niezawodnym źródłem dochodów z podatku akcyzowego, zarobków na obszarach wiejskich oraz miejsc pracy w zakładach przetwórczych."
 SIA_a_fledgling_tobacco_industry_tt: "§Y$limited_exports$§! lub §Y$closed_economy$§! zapewnią nam dodatkową §Yfabrykę cywilną§!"
 SIA_all_weather_roads: "Utwardzenie wszystkich dróg"
 SIA_all_weather_roads_desc: "Zbyt wiele dróg znika wraz z nadejściem deszczów, przez co prowincje tracą dostęp do stolicy i rynków. Sieć dróg przystosowanych do każdych warunków pogodowych połączy królestwo i umożliwi transport towarów oraz przemieszczanie się żołnierzy niezależnie od pory roku."
 SIA_the_bank_of_siam: "Bank Syjamu"
 SIA_the_bank_of_siam_desc: "Rozwój przemysłowy nie może opierać się wyłącznie na zwyczajach i prywatnych przysługach. Silniejszy bank narodowy zapewni państwu większą kontrolę nad kredytami, walutą i obrotem kapitału."
 SIA_thai_rice_company: "Tajski producent ryżu"
 SIA_thai_rice_company_desc: "[ROOT.GetName] opiera się na ryżu, jednak zbyt duża część handlu tym towarem jest rozdrobniona, ma charakter spekulacyjny i jest podatna na presję zagraniczną. Utworzenie państwowej spółki ryżowej pozwoli rządowi sterować eksportem, stabilizować ceny i przekształcić zbiory z naszych pól ryżowych w solidniejszy fundament narodowej potęgi."
 SIA_uk_japan_focus_tt: "Umożliwia to wybranie strony [ENG.GetAdjective] lub [JAP.GetAdjective] z następującymi skutkami:\n\n§Y[ENG.GetFlag][ENG.GetNameDefCap]§!:"
 SIA_japan_option_tt: "§Y[JAP.GetFlag][JAP.GetNameDefCap]§!"
 SIA_send_bureaucrats_abroad: "Wysłanie biurokratów za granicę"
 SIA_send_bureaucrats_abroad_desc: "Inne kraje stworzyły już ministerstwa, szkoły i służby techniczne, których obecnie potrzebujemy. Wysyłając obiecujących urzędników za granicę, możemy czerpać z ich doświadczeń administracyjnych bez importowania obcych reguł."
 SIA_baht_stabilization_act: "Ustawa o stabilizacji bata tajskiego"
 SIA_baht_stabilization_act_desc: "Nowoczesna gospodarka wymaga waluty, której ufają kupcy i którą akceptują inwestorzy. Stabilizacja bata zmniejszy niepewność w handlu i sprawi, że [ROOT.GetNameDef] zyska silniejszą pozycję na międzynarodowym rynku."
 SIA_siamese_development_cooperative: "Kooperatywa syjamskiego rozwoju"
 SIA_siamese_development_cooperative_desc: "Prywatny kapitał zachowuje ostrożność, a państwo nie jest w stanie samodzielnie zrealizować wszystkich inwestycji. Krajowa spółdzielnia na rzecz rozwoju umożliwi urzędnikom, kupcom i właścicielom ziemskim połączenie zasobów na potrzeby projektów służących wspólnej gospodarce."
 SIA_boon_rawd_brewery: "Browar Boon Rawd"
 SIA_boon_rawd_brewery_desc: "Krajowy przemysł piwowarski to coś więcej niż tylko kwestia konsumpcji. Przedsiębiorstwa takie jak Boon Rawd dowodzą, że syjamski kapitał, maszyny i kadra zarządzająca są w stanie stworzyć nowoczesny przemysł na syjamskiej ziemi."
 SIA_national_savings_bond: "Narodowe obligacje skarbowe"
 SIA_national_savings_bond_desc: "Bogactwo narodu nie może leżeć bezczynnie w sejfach i służyć jedynie jako ozdoba, podczas gdy drogi i fabryki wciąż nie są wybudowane. Państwowe obligacje oszczędnościowe pozwolą przekształcić prywatne oszczędności w publiczne inwestycje."
 SIA_national_savings_bond_tt: "Zyskuje ducha $SIA_national_savings_bond$, na który wpływa twoje §Yprawo służby wojskowej§!. Im łagodniejsze przepisy dotyczące poboru wojskowego, tym większe są pozytywne efekty, a im surowsze, tym efekty są gorsze.\n\nPoziom §Y$disarmed_nation$§!:"
 SIA_national_savings_bond_scraping_the_barrel: "Poziom §Y$scraping_the_barrel$§!:"
 SIA_national_savings_bond_volunteer_only: "Poziom §Y$volunteer_only$§!:"
 SIA_national_savings_bond_limited_conscription: "Poziom §Y$limited_conscription$§!:"
 SIA_national_savings_bond_extensive_conscription: "Poziom §Y$extensive_conscription$§!:"
 SIA_national_savings_bond_service_by_requirement: "Poziom §Y$service_by_requirement$§!:"
 SIA_national_savings_bond_all_adult_serve: "Poziom §Y$all_adults_serve$§!:"
 SIA_national_savings_bond_current: "Obecne prawo dotyczące mobilizacji zapewniłoby nam:"
 SIA_deficit_spending: "Deficyt budżetowy"
 SIA_deficit_spending_desc: "Tradycyjna księgowość nie zbuduje nowoczesnej gospodarki na czas, by stawić czoła zagrożeniom współczesnego świata. Państwo musi być gotowe wydawać środki wykraczające poza bieżące dochody, wykorzystując roboty i zamówienia publiczne do pobudzenia wzrostu przemysłowego."
 SIA_deficit_spending_tt: "Gdy upłynie czas ducha:"
 SIA_acquire_light_tools: "Pozyskanie lekkich narzędzi"
 SIA_acquire_light_tools_desc: "Zanim będziemy w stanie produkować wspaniałe maszyny, najpierw musimy opanować obsługę prostych narzędzi przemysłowych. Import lekkich narzędzi i wyposażenia warsztatowego sprawi, że [ROOT.GetName] zyska wiele małych zakładów i warsztatów naprawczych."
 SIA_railway_and_port_extensions: "Rozbudowa portów i kolei"
 SIA_railway_and_port_extensions_desc: "Ryż, drewno i cyna nie mają żadnej wartości, jeśli nie trafią na rynek. Rozbudowa sieci kolejowej i powiększenie naszych portów pozwolą prowincjom uczestniczyć w krajowym obrocie handlowym oraz sprawią, że [ROOT.GetNameDef] otworzy się szerzej na świat."
 SIA_mechanization_of_agriculture: "Mechanizacja rolnictwa"
 SIA_mechanization_of_agriculture_desc: "Zbyt duża część siły roboczej pozostaje związana z tradycyjnym rolnictwem, przez co przemysł cierpi na niedobór rąk do pracy. Wprowadzając na wieś nowoczesne narzędzia i maszyny, możemy zwiększyć produkcję rolną, uwalniając jednocześnie siłę roboczą, by mogła wspierać produkcję przemysłową."
 SIA_irrigation: "Irygacja"
 SIA_irrigation_desc: "Losy chłopów wciąż zależą od powodzi i suszy. Rozbudowany system nawadniający zapewni stabilne zbiory, pozwoli na zwiększenie areału upraw i sprawi, że obszary wiejskie staną się pewniejszym fundamentem rozwoju kraju."
 SIA_siam_cement_group: "Państwowa [ROOT.GetAdjective] grupa cementowa"
 SIA_siam_cement_group_desc: "Utworzona pod królewskim patronatem [ROOT.GetAdjective] grupa cementowa jest jednym z najważniejszych przedsiębiorstw przemysłowych tego państwa. Za pomocą precyzyjnych inwestycji i rządowego wsparcia można przemienić je z krajowego dostawcy w zalążek naszego zwiększonego potencjału przemysłowego - fundament dla przyszłości narodu, i to w całkiem dosłownym sensie."
 SIA_chemical_imports: "Import wyrobów chemicznych"
 SIA_chemical_imports_desc: "Zarówno nowoczesne rolnictwo, jak i przemysł są uzależnione od związków chemicznych, których nie produkujemy jeszcze w wystarczających ilościach. Import chemikaliów zapewni nam dostęp do nawozów, leków, barwników i materiałów wybuchowych do czasu, aż krajowy przemysł będzie w stanie zaspokoić nasze potrzeby."
 SIA_chemical_imports_tt: "§G+1§! dodatkowa §Yfabryka cywilna§! poza mapą, jeśli opinia wynosi ponad §Y[?var:ROOT.SIA_chemical_imports_opinion_threshold]§!, gdy cel zostanie ukończony."
 INS_chemical_imports_stolen_tt: "§G[?var:ROOT.INS_guns_from_seek_help_focus]§! jednostek wyposażenia piechoty, jeśli opinia wynosi ponad §Y75§!, gdy cel zostanie ukończony."
 SIA_foreign_currency_exchange: "Wymiana walut zagranicznych"
 SIA_foreign_currency_exchange_desc: "Industrializacja wymaga zagranicznych maszyn, leków i paliwa, które można nabyć jedynie za pomocą środków walutowych, którymi dysponujemy w ograniczonym zakresie. System kontrolowanej wymiany walut pozwoli skierować zagraniczne fundusze do gałęzi przemysłu o największym znaczeniu dla państwa."
 SIA_farmers_into_the_city: "Rolnicy do miast"
 SIA_farmers_into_the_city_desc: "Nowoczesna gospodarka nie może opierać się wyłącznie na pracy wiejskiej populacji. Wraz z rozwojem przemysłu państwo musi wspierać zorganizowaną migrację z pól ryżowych do miast, gdzie może powstać nowa miejska siła robocza."
 SIA_textile_mills: "Zakłady włókiennicze"
 SIA_textile_mills_desc: "Tkaniny należą do artykułów codziennego użytku, a jednak znaczna ich część jest produkowana za granicą. Zakłady włókiennicze zastąpią import, zapewnią zatrudnienie mieszkańcom miast i sprawią, że [ROOT.GetNameDef] zyska jedną z podstawowych gałęzi przemysłu współczesnego świata."
 SIA_public_credit: "Dług publiczny"
 SIA_public_credit_desc: "Zarówno kupcy, jak i rolnicy oraz producenci borykają się z problemem ograniczonego dostępu do kapitału. Rozszerzając ofertę kredytów publicznych, rząd może udzielać pożyczek tam, gdzie prywatne instytucje finansowe nie są skłonne tego robić, i stymulować rozwój zaniedbanych sektorów."
 SIA_public_credit_trigger: "$idea_SIA_public_credit_debt$: aktywne od co najmniej §Y180 dni§!"
 SIA_a_modern_economy: "Nowoczesna gospodarka"
 SIA_a_modern_economy_desc: "Stary porządek agrarny nie zniknie z dnia na dzień, ale nie może już dłużej decydować o [ROOT.GetAdjective] przyszłości. Wraz z tworzeniem sieci banków, szkół, fabryk i infrastruktury zaczynamy budować gospodarkę godną niepodległego, nowoczesnego państwa."
 SIA_reduction_of_agricultural_yield_taxes: "Zmniejszenie podatków od plonów rolnych"
 SIA_reduction_of_agricultural_yield_taxes_tt: "Zmniejsza ilość §Ydóbr konsumpcyjnych§!, które zapewnia $idea_SIA_agricultural_tax_reduction$, o §Y[?var:SIA_agricultural_tax_reduction_cg_decrease_rate|%]§! co miesiąc, zwiększając jednocześnie co miesiąc §Ystabilizację§! o §Y[?var:SIA_agricultural_tax_reduction_stability_gain|%]§!, do chwili aż kara do ilości §Ydóbr konsumpcyjnych§! spadnie do §Y0%§!\n\nPo usunięciu tego ducha zyskujesz:\n"
 SIA_reduction_of_agricultural_yield_taxes_desc: "Nie można wymagać od chłopstwa, by wyżywiło królestwo, finansowało państwo i znosiło wszelkie trudy bez żadnej pomocy. Obniżając podatki od płodów rolnych, pozostawiamy na wsi większą nadwyżkę, wzmacniamy lojalność rolników i zachęcamy do zwiększenia wydajności upraw."
 SIA_fuel_oil_act: "Ustawa o paliwach"
 SIA_fuel_oil_act_desc: "Współczesny transport, przemysł i obrona są uzależnione od paliwa, jednak w czasie wojny dostęp do niego może zostać ograniczony. Ustawa o paliwach zapewni ściślejszy państwowy nadzór nad ich zużyciem, magazynowaniem i awaryjnym racjonowaniem, tak aby nie marnować ograniczonych zasobów."
 SIA_siam_electricity_company: "Syjamskie przedsiębiorstwo energetyczne"
 SIA_siam_electricity_company_desc: "Żadna gospodarka nie jest w stanie sprostać współczesnym wyzwaniom bez niezawodnych dostaw energii. Wzmacniając pozycję syjamskiego przedsiębiorstwa energetycznego, możemy zwiększyć moce wytwórcze, usprawnić koordynację oraz zapewnić dostawy energii do zakładów, magazynów i miast nawet w trudnych warunkach."
 SIA_revise_the_taxation_system: "Zmiana systemu podatkowego"
 SIA_revise_the_taxation_system_desc: "Obecna struktura systemu podatkowego nie odpowiada potrzebom państwa przygotowującego się na trudne czasy i dążącego do samowystarczalności. Zmieniony system pozwoli na bardziej równomierny pobór podatków, ograniczy marnotrawstwo oraz zapewni większą dyscyplinę w rozdzielaniu środków na obronę narodową i rozwój."
 SIA_census_the_hill_tribes: "Przeprowadzenie spisu ludności w plemionach górskich"
 SIA_census_the_hill_tribes_desc: "Obszary górskie pozostają poza pełnym zasięgiem administracji, systemu podatkowego i systemu zaopatrzenia. Przeprowadzenie rzetelnego spisu ludności zapewni rządowi wiedzę niezbędną do skuteczniejszego zarządzania tymi regionami oraz włączenia ich mieszkańców i zasobów do życia całego kraju."
 SIA_increase_rice_exports: "Zwiększenie eksportu ryżu"
 SIA_increase_rice_exports_desc: "Ryż stanowi najpewniejsze źródło dochodów z eksportu, na jakim może polegać [ROOT.GetNameDef]. Zwiększając eksport, gdy rynki nadal są otwarte, możemy zgromadzić rezerwy finansowe, sfinansować strategiczne zakupy zagraniczne i przygotować budżet na ewentualne przyszłe zakłócenia."
 SIA_pad_thai: "Pad Thai"
 SIA_pad_thai_desc: "Nowoczesne państwo opiera się nie tylko na ministerstwach i fabrykach, ale także na wspólnych zwyczajach, które łączą społeczeństwo. Promując narodową potrawę z ryżu przygotowaną z tajskich składników, pobudzamy krajową konsumpcję, wspieramy naszych rolników i zmniejszamy zależność od zagranicznej żywności w niepewnych czasach."
 SIA_rice_husk_steam_turbines: "Turbiny parowe napędzane łuskami ryżowymi"
 SIA_rice_husk_steam_turbines_desc: "Konieczność uczy nas doceniać to, co obcokrajowcy postrzegają jako odpad. Spalając łuski ryżowe w celu wytworzenia pary, możemy czerpać energię z własnych upraw i zmniejszyć naszą zależność od importowanego węgla i ropy."
 SIA_domestic_tin_smelters: "Krajowe huty cyny"
 SIA_domestic_tin_smelters_desc: "Nie wystarczy już tylko wydobywać rudę z ziemi i wysyłać ją za granicę. Budując krajowe huty cyny, zatrzymujemy w kraju większą część wartości naszych surowców i zabezpieczamy sobie dostęp do metalu ważnego zarówno dla gospodarki, jak i wojska."
 SIA_use_ships_as_generators: "Wykorzystywanie okrętów jako generatorów"
 SIA_use_ships_as_generators_tt: "Umieszczenie posiadanych przez nas §Yokrętów liniowych§! w §Yportach regionów narodowych§! zapewni nam premię zmniejszającą zużycie energii przez fabryki o §G2%§! na §Yokręt liniowy§! (maksymalnie o §G15%§!).\n\nJeśli okręty opuszczą porty, premia zostanie odpowiednio zmniejszona. Powrót okrętów do portów przywróci zapewnianą przez nie premię."
 SIA_use_ships_as_generators_desc: "Nawet starsze okręty, które nie nadają się już do działań bojowych ani handlowych, mogą nadal służyć krajowi. Wykorzystując statki jako pływające elektrownie, możemy zapewnić awaryjne zasilanie portów i zakładów przemysłowych na wybrzeżu, jednocześnie oszczędzając cenne paliwo i infrastrukturę."
 SIA_diversity_foreign_reserves: "Dywersyfikacja rezerw walutowych"
 SIA_diversity_foreign_reserves_desc: "[ROOT.GetNameDef] naraża się na ryzyko, opierając swoje bezpieczeństwo finansowe na walucie lub wiarygodności kredytowej jakiegokolwiek pojedynczego zagranicznego mocarstwa. Dzięki dywersyfikacji naszych rezerw ograniczamy skutki zewnętrznych wstrząsów i zachowujemy większą swobodę działania w dziedzinie handlu i dyplomacji."
 SIA_diversity_foreign_reserves_tt: "Dodaje dodatkowe §G2§! §Yfabryki wojskowe§! poza mapą, na początku wojny.\nDodaje produkcję §G8§! jednostek stali w losowym regionie narodowym, na początku wojny."
 SIA_exclusivity_resource_contract: "Umowa o zasobach na wyłączność"
 SIA_exclusivity_resource_contract_desc: "Pojedynczy zagraniczny partner oferuje kapitał i gwarantowane zakupy w zamian za uprzywilejowany dostęp do naszych zasobów. Taka wyłączna umowa może przyspieszyć rozwój, choć [ROOT.GetNameDef] wiąże przez to część swojej przyszłości z potrzebami innego kraju."
 SIA_maintain_resource_independence: "Utrzymanie niezależności surowcowej"
 SIA_maintain_resource_independence_desc: "Zagraniczne kontrakty mogą przynosić szybkie zyski, ale w ślad za nimi pojawia się uzależnienie. Zachowując kontrolę nad naszymi zasobami, zachowujemy swobodę wykorzystywania ich zgodnie z potrzebami Syjamu, a nie z żądaniami zagranicy."
 SIA_kasetsart_university: "Uniwersytet Kasetsart"
 SIA_kasetsart_university_desc: "Jeśli rolnictwo ma stać się bardziej wydajne, musi opierać się na nauce, a nie wyłącznie na tradycji. Uniwersytet Kasetsart będzie kształcił agronomów, weterynarzy i techników, którzy przyczynią się do modernizacji kraju."
 SIA_mahidol_university: "Uniwersytet Mahidol"
 SIA_mahidol_university_desc: "Nowoczesne państwo potrzebuje lekarzy, naukowców i urzędników w takim samym stopniu jak żołnierzy i inżynierów. Uniwersytet Mahidol wzmocni szkolnictwo wyższe i zapewni wykwalifikowanych specjalistów niezbędnych do przeprowadzenia krajowych reform."
 SIA_silpakorn_university: "Uniwersytet Silpakorn"
 SIA_silpakorn_university_desc: "TODO_CM"
 SIA_contingency_funds: "Fundusze planów awaryjnych"
 SIA_contingency_funds_desc: "Dobrobyt w czasach pokoju ma niewielką wartość, jeśli państwo wkracza w kryzys nieprzygotowane. Tworząc już teraz fundusze na wypadek nieprzewidzianych sytuacji, zagwarantujemy, że blokada, nieurodzaj czy nagła wojna nie spowodują natychmiastowego paraliżu aparatu rządowego."
 SIA_contingency_funds_tt: "W czasie pokoju będziemy gromadzić środki w ramach funduszu planów awaryjnych. Gromadząc je, zyskamy umiarkowany §Ywspółczynnik dóbr konsumpcyjnych§!.\n\nW czasie wojny będziemy mogli - jeśli zechcemy - uruchomić ten fundusz, uzyskując w ten sposób dużą premię do produkcji.\nTo, na jak długo wystarczą te środki, zależy od tego, jak długo będziemy je gromadzić przed ich wypłaceniem."
 SIA_prepare_for_the_next_blockade: "Przygotowania do kolejnej blokady"
 SIA_prepare_for_the_next_blockade_desc: "Jeśli sytuacja na morzach stanie się niebezpieczna, [ROOT.GetNameDef] może stracić dostęp do rynków, maszyn i paliwa. Musimy zatem już teraz przygotować się na kolejną blokadę, gromadząc zapasy, opracowując plany kryzysowe i szukając zamienników, zanim zmusi nas do tego konieczność."
 SIA_domestic_arms_industry: "Krajowy przemysł zbrojeniowy"
 SIA_domestic_arms_industry_desc: "Królestwo, które musi importować każdy karabin i każdy nabój, nie może uważać się za bezpieczne. Niezależnie od tego, jak skromne są jego początki, krajowy przemysł zbrojeniowy pozwoli wyposażyć [ROOT.GetAdjective] żołnierzy w broń pochodzącą z własnych zakładów i przetrwać w sytuacji, gdy zabraknie dostaw z zagranicy."
 SIA_war_material_substitutions: "Wojenne zamienniki"
 SIA_war_material_substitutions_desc: "Podczas blokady idealny surowiec ma mniejszą wartość niż ten, który jest dostępny. Musimy poszukiwać zamienników metali, chemikaliów i importowanych komponentów, aby produkcja mogła trwać nawet wtedy, gdy zagraniczne towary przestaną docierać do naszych brzegów."
 SIA_royal_thai_ordnance_factory: "Fabryka uzbrojenia Królestwa Tajlandii"
 SIA_royal_thai_ordnance_factory_desc: "Bezpieczeństwo państwa wymaga czegoś więcej niż tylko importowanej broni i rozproszonych warsztatów naprawczych. Fabryka uzbrojenia Królestwa Tajlandii zgromadzi specjalistów, sprzęt i nadzór pod auspicjami korony, dzięki czemu [ROOT.GetNameDef] zyska stały ośrodek produkcji broni i amunicji."
 SIA_built_to_withstand_every_flame: "Stworzone, by wytrzymać każdy płomień"
 SIA_built_to_withstand_every_flame_desc: "Fabryka, która spłonie w ciągu jednej nocy, nie będzie w stanie służyć krajowi rankiem następnego dnia. Nasze magazyny, zakłady i warsztaty muszą być budowane z uwzględnieniem zasad rozproszenia, ochrony przeciwpożarowej i zabezpieczeń na wypadek sytuacji awaryjnych, aby sabotaż, bombardowanie czy wypadek nie mogły tak łatwo sparaliżować produkcji."
 SIA_the_army_of_siam: "Armia Syjamu"
 SIA_the_army_of_siam_desc: "Dotychczasowa struktura naszych sił zbrojnych nie odpowiada już wymaganiom dzisiejszych czasów. Jeśli [ROOT.GetName] ma bronić swojej suwerenności i realizować swoje interesy za granicą, musimy stworzyć nową, nowoczesną armię, wyposażoną, wyszkoloną i zorganizowaną z myślą o wojnach, które obecnie nabierają tempa na całym świecie."
 SIA_plan_for_a_short_war: "Plan na krótką wojnę"
 SIA_plan_for_a_short_war_desc: "Nasze zasoby są ograniczone, a wrogów może być wielu. [ROOT.GetNameDefCap] nie może sobie pozwolić na długą wojnę na wyczerpanie. Jeśli dojdzie do konfliktu, musi on być szybki, zdecydowany i rozstrzygnięty, zanim wróg zdąży zebrać siły."
 SIA_intermediate_war_preparation: "Pośrednie przygotowania do wojny"
 SIA_intermediate_war_preparation_desc: "Niebezpieczne jest przygotowywanie się wyłącznie do błyskawicznej kampanii, ale organizowanie się jedynie pod kątem niekończącej się walki jest marnotrawstwem. Dzięki wyważonej doktrynie [ROOT.GetName] zyska możliwość energicznego ataku, zachowując jednocześnie odporność potrzebną do stawienia czoła bardziej upartemu przeciwnikowi."
 SIA_prepare_for_a_long_war: "Przygotowanie do długiej wojny"
 SIA_prepare_for_a_long_war_desc: "Mocarstwa mogą rozstrzygać wojny w ciągu kilku miesięcy, ale mniejsze narody często zmuszone są znosić je przez lata. Musimy zatem przygotować [ROOT.GetAdjective] siły zbrojne, przemysł i transport na długi, wyczerpujący konflikt, w którym cierpliwość i wytrwałość mają równie duże znaczenie jak odwaga."
 SIA_specialized_warfare: "Wyspecjalizowane działania wojenne"
 SIA_specialized_warfare_desc: "Ukształtowanie terenu naszego regionu nie sprzyja tworzeniu jednolitej armii. Góry, dżungla i tereny nadrzeczne wymagają odmiennych umiejętności. Dzięki szkoleniu wyspecjalizowanych oddziałów możemy zadbać o to, by [ROOT.GetAdjective] państwo mogło stawić czoła wrogowi przy użyciu sił odpowiednich do warunków panujących na danym obszarze."
 SIA_artillery_reigns_supreme: "Zwycięstwo artylerii"
 SIA_artillery_reigns_supreme_desc: "Współczesnej bitwy nie wygrywa się wyłącznie dzięki determinacji. Artyleria pozostaje królem pola bitwy - niszczy umocnienia, powstrzymuje ataki i toruje drogę naszej piechocie. Jeśli mamy odnieść zwycięstwo, [ROOT.GetAdjective] siła ognia musi być zarówno potężna, jak i precyzyjna."
 SIA_yield_the_air_war: "Ustąpienie w wojnie powietrznej"
 SIA_yield_the_air_war_desc: "Nie mamy szans, by na równych warunkach rzucić wyzwanie wielkim mocarstwom w przestworzach. Zamiast marnować cenne zasoby w rywalizacji, której raczej nie wygramy, wzmocnimy naszą obronę przeciwlotniczą i nie pozwolimy samolotom wroga bezkarnie atakować naszych żołnierzy i miast."
 SIA_the_thunder_at_the_gates: "Grom u bram"
 SIA_the_thunder_at_the_gates_desc: "Są fortece, których zwykła artyleria nie jest w stanie zdobyć, i ataki, które trzeba zapowiedzieć przy użyciu przytłaczającej siły. Ciężka artyleria, działa oblężnicze i działa kolejowe zapewnią [ROOT.GetAdjective] wojskom siłę potrzebną do wyważenia bram każdego wroga, który pomyli naszą powściągliwość ze słabością."
 SIA_night_time_training: "Szkolenie nocne"
 SIA_night_time_training_desc: "Zuchwałe ataki w biały dzień mogą zakończyć się katastrofą w starciu z przygotowanym przeciwnikiem. Jeśli wyszkolimy naszych żołnierzy w zakresie infiltracji, przemieszczania się i ataku pod osłoną nocy, możemy przejąć inicjatywę, gdy wróg jest ślepy, zdezorientowany i najmniej przygotowany do walki."
 SIA_steel_arteries: "Stalowe arterie"
 SIA_steel_arteries_desc: "Żadna armia nie dotrze daleko bez linii kolejowych i dróg, które służą do jej zaopatrzenia. Należy wzmocnić stalowe arterie kraju, aby żołnierze, zaopatrzenie i broń mogły być szybko transportowane na każdą zagrożoną granicę. W tym przypadku bezpieczeństwo wojskowe i rozwój kraju idą ze sobą w parze."
 SIA_prepare_northern_infrastructure_for_war: "Przygotowanie północnej infrastruktury do wojny"
 SIA_prepare_northern_infrastructure_for_war_desc: "Północne podejścia będą miały kluczowe znaczenie w każdej konfrontacji z Birmą i jej sojusznikami. Należy niezwłocznie rozbudować drogi, linie kolejowe i magazyny w tym regionie, aby [ROOT.GetAdjective] siły mogły prowadzić tam bez opóźnień działania ofensywne lub obronne."
 SIA_unconventional_tank_construction: "Nietypowe konstrukcje czołgów"
 SIA_unconventional_tank_construction_desc: "Nie możemy naśladować programów zbrojeniowych wielkich mocarstw w najdrobniejszych szczegółach. Jeśli [ROOT.GetNameDef] ma w ogóle wprowadzić do służby czołgi, musimy postawić na tańsze i bardziej elastyczne metody produkcji, rezygnując z okazałości na rzecz liczby i użyteczności."
 SIA_conventional_tank_construction: "Klasyczne konstrukcje czołgów"
 SIA_conventional_tank_construction_desc: "Pancerz stał się nieodłącznym elementem współczesnej wojny, a prowizoryczne rozwiązania nie wystarczą na długo. Powinniśmy zatem stworzyć prawdziwy przemysł produkujący czołgi, oparty na solidnych fundamentach, standardowych projektach i niezawodnych metodach produkcji, godny nowoczesnej armii."
 SIA_reverse_engineer_allied_tanks: "Analiza sojuszniczych czołgów"
 SIA_reverse_engineer_allied_tanks_desc: "Inni ponieśli już koszty związane z eksperymentami. Zdobyte czołgi i sprowadzone maszyny można rozebrać na części, zbadać i skopiować. Czerpiąc z zagranicznych projektów, [ROOT.GetName] może skrócić proces tworzenia własnych wojsk pancernych."
 SIA_tankettes: "Tankietki"
 SIA_tankettes_desc: "Lekkie, tanie i łatwe w produkcji tankietki same w sobie nie rozstrzygną losów wielkich bitew, ale mogą pełnić funkcję zwiadowczą, przydać się w wojnach kolonialnych oraz wspierać piechotę. Dla krajów o ograniczonych środkach takie małe pojazdy opancerzone stanowią praktyczny sposób na mechanizację wojsk."
 SIA_jungle_armor: "Pancerze do dżungli"
 SIA_jungle_armor_desc: "Dżungle naszego regionu nie są miejscem dla ociężałych maszyn zaprojektowanych z myślą o równinach Europy. Jeśli pojazdy opancerzone mają służyć w [ROOT.GetAdjective] armii, muszą być przystosowane do wąskich szlaków, trudnego terenu i uciążliwego klimatu, a tam, gdzie wymaga tego dżungla, zwiększonej mobilności kosztem masy."
 SIA_mountain_tanks: "Czołgi górskie"
 SIA_mountain_tanks_desc: "Nie można pozostawić trudnych wzgórz i przełęczy wyłącznie piechocie. Dzięki wprowadzeniu kompaktowych pojazdów opancerzonych przystosowanych do poruszania się w trudnym terenie możemy zapewnić naszym siłom zbrojnym chronioną siłę ognia na obszarach, w których zwykłe czołgi zawodzą."
 SIA_reluctant_submission: "Niechętna uległość"
 SIA_reluctant_submission_desc: "Jeśli [ROOT.GetNameDef] stanie w obliczu inwazji potężniejszego wroga, może nadejść chwila, gdy otwarty opór zacznie oznaczać jedynie zagładę. Podporządkowanie się jest gorzkie, jednak czasami władza musi ustąpić, by uchronić naród przed zniszczeniem i poczekać na bardziej sprzyjający moment."
 SIA_reluctant_submission_trigger: "Ten cel zostanie automatycznie wypełniony, jeśli zostaniemy zaatakowani i wybierzemy opcję §Ypodporządkowania się§!."
 SIA_reluctant_submission_tt: "Będziemy w stanie zawrzeć pokój z atakującym mocarstwem. Będzie jednak oczekiwało, że zaczniemy drukować dla niego pieniądze.\nNasz §Ywspółczynnik fabryk dóbr konsumpcyjnych§! wzrośnie o §Y[?idea_SIA_printing_money_monthly_change|%]§! miesięcznie do maksymalnie §Y[?idea_SIA_printing_money_monthly_change_max|%]§!.\n\nPrzyjęcie celu §Y$SIA_thai_rice_company$§! zmniejszy tempo wzrostu o §G50%§!\n\nPrzyjęcie celu §Y$SIA_demand_repatriation$§! usunie konieczność drukowania pieniędzy."
 SIA_seri_thai: "Seri Thai"
 SIA_seri_thai_desc: "Podporządkowanie się nie musi oznaczać rezygnacji z narodowego ducha. Za fasadą okupacyjnego posłuszeństwa można zorganizować lojalną konspirację, która będzie działać na rzecz niepodległości, zbierać informacje wywiadowcze i przygotowywać się na dzień, w którym [ROOT.GetAdjective] państwo odzyska niepodległość."
 SIA_contact_the_south_east_asia_command: "Nawiązanie kontaktu z dowodzeniem w Azji Południowo-Wschodniej"
 SIA_contact_the_south_east_asia_command_desc: "Jeśli opór ma być czymś więcej niż tylko gestami heroizmu, musi być wpisany w szerszą strategię. Poprzez nawiązanie kontaktu z dowództwem aliantów w Azji Południowo-Wschodniej [ROOT.GetAdjective] patrioci mogą zapewnić sobie doradztwo, zaopatrzenie i miejsce w szerszym konflikcie."
 SIA_broadcast_weather_reports_to_the_allies: "Nadawanie raportów pogodowych sojusznikom"
 SIA_broadcast_weather_reports_to_the_allies_desc: "Niebem i morzami regionu rządzi w równym stopniu pogoda, co floty i armie. Wiarygodne meldunki z [ROOT.GetAdjective] terytorium mogą pomóc aliantom w planowaniu, uchronić ich operacje przed atakiem z zaskoczenia oraz sprawić, że nasza ojczyzna stanie się cichym, ale cennym partnerem w ich wojnie."
 SIA_american_investment_aid: "Amerykańska pomoc inwestycyjna"
 SIA_american_investment_aid_desc: "Stany Zjednoczone dysponują bogactwem przewyższającym możliwości naszego regionu. Jeśli uda nam się pozyskać amerykańską pomoc i inwestycje na rzecz naszych tajnych i narodowych działań, [ROOT.GetNameDef] zyska środki niezbędne do przetrwania trudności i przygotowania się do wyzwolenia."
 SIA_thai_students_in_the_oss: "Studenci tajscy w OSS"
 SIA_thai_students_in_the_oss_desc: "Nowe pokolenie patriotycznej młodzieży można wyszkolić za granicą w dziedzinie szpiegostwa, sabotażu i wojny partyzanckiej. Jeśli wyślemy zaufanych tajskich studentów pod skrzydła wywiadu aliantów, przygotujemy zdolnych ludzi do przyszłej wojny w ukryciu."
 SIA_prepare_to_drop: "Przygotowanie do zrzutu"
 SIA_prepare_to_drop_desc: "Kiedy nadejdzie godzina wyzwolenia, alianci mogą spróbować wkroczyć na nasze terytorium z powietrza. Musimy zatem wyznaczyć lądowiska, przygotować kontakty i zorganizować sieci wsparcia, aby przyjąć zrzucanych żołnierzy i skierować ich tam, gdzie są najbardziej potrzebni."
 SIA_unseat_the_government: "Obalenie rządu"
 SIA_unseat_the_government_desc: "Nie można pozwolić, by reżim, który podporządkował [ROOT.GetAdjective] naród obcej potędze, trwał wiecznie. Dzięki oporowi, intrygom i działaniom podjętym w odpowiednim momencie możemy pozbyć się tych, którzy narazili naród na niebezpieczeństwo, i przywrócić władzę godną Syjamu."
 SIA_unseat_the_government_tt: "[ROOT.GetName] opuści swoją bieżącą frakcję i zmieni stronę w wojnie, dołączając do §Yaliantów§!.\n\nLojaliści powstaną przeciwko zmianom, rozpoczynając wojnę domową.\n\nJeżeli połączone poparcie wynosi §Yponad 80%§!, obalimy rząd i unikniemy wojny domowej. Nasze łączne poparcie wynosi §Y5%§! za każdego przekonanego generała, plus nasze poparcie demokratyczne.\n\nNasze poparcie uzyskane dzięki przekonanym generałom wynosi §Y[?var:SIA_seri_thai_cw_scale|%]§!, a nasze poparcie demokratyczne to §Y[?var:party_popularity@democratic|%]§!"
 SIA_choose_new_leader_tt: "Dawny reżim został zniszczony, teraz zwycięzcy muszą postanowić, kto stanie na czele nowego rządu."
 SIA_the_phayap_army: "Armia Phayap"
 SIA_the_phayap_army_desc: "Jeśli zdecydujemy się stanąć po stronie najeźdźcy, nasze armie muszą znaleźć swoje miejsce w nowym porządku wojennym. Utworzenie specjalnego dowództwa polowego dla operacji na zachodzie i północy pozwoli [ROOT.GetAdjective] armii kroczyć u boku potężnego partnera i osiągać własne korzyści."
 SIA_securing_the_rubber_islands: "Kontrola nad wyspami kauczukowymi"
 SIA_securing_the_rubber_islands_desc: "Kauczuk jest siłą napędową współczesnej wojny - stanowi surowiec do produkcji opon, uszczelek i niezliczonych elementów niezbędnych podczas zmechanizowanego konfliktu zbrojnego. Bogate w surowce terytoria na południu stanowią zarówno szansę, jak i konieczność. Powinniśmy podjąć działania, aby zabezpieczyć je, zanim zrobią to inni."
 SIA_breaking_the_burmese_line: "Przełamanie linii birmańskiej"
 SIA_breaking_the_burmese_line_desc: "Birma stanowi barierę między naszymi ambicjami a terytoriami leżącymi za nią. Jeśli [ROOT.GetAdjective] siły mają udowodnić swoją wartość, linie wroga w tym rejonie trzeba przełamać dzięki determinacji, odpowiedniemu planowaniu i skoncentrowanemu użyciu siły."
 SIA_pacific_war: "Wojna na Pacyfiku"
 SIA_pacific_war_desc: "Konfliktu w Azji Wschodniej nie można już dłużej traktować jako czegoś odległego. Wojna na Pacyfiku decyduje o losie wszystkich narodów w naszym regionie, a [ROOT.GetNameDef] musi określić swoją rolę w tej walce - jako poplecznik, partner lub ofiara."
 SIA_joint_asian_military_command: "Połączone dowództwo wojsk azjatyckich"
 SIA_joint_asian_military_command_desc: "Nasze działania będą skuteczniejsze, jeśli będziemy je koordynować z działaniami naszych regionalnych partnerów. Połączone dowództwo gwarantuje większą skuteczność, przejrzystsze planowanie oraz wspólny kierunek działań w ramach kampanii, które w przeciwnym razie mogłyby zostać zniweczone przez rywalizację i zamieszanie."
 SIA_demand_repatriation: "Żądanie repatriacji"
 SIA_demand_repatriation_desc: "Ci, którzy wkroczyli na nasze terytorium pod pretekstem konieczności, zaciągnęli dług wobec [ROOT.GetAdjective] narodu. Gdy tylko poprawi się nasza sytuacja, powinniśmy zażądać zwrotu tego, co zostało nam odebrane, i naciskać na okupanta, by pokrył koszty swojej inwazji."
 SIA_standing_our_ground: "Obrona za wszelką cenę"
 SIA_standing_our_ground_desc: "Nadchodzi moment, gdy wycofanie się i negocjacje oznaczają jedynie większe upokorzenie. [ROOT.GetNameDefCap] musi pokazać, że wciąż ma wolę, by stawiać opór, walczyć i wyprzeć tych, którzy uważają, że mogą siłą decydować o naszym losie."
 SIA_standing_our_ground_trigger: "Ten cel zostanie automatycznie wypełniony, jeśli zostaniemy zaatakowani i wybierzemy opcję §Ystawiania oporu§!."
 SIA_ask_for_the_release_of_american_commodities: "Prośba o uwolnienie amerykańskich towarów"
 SIA_ask_for_the_release_of_american_commodities_desc: "Amerykańskie zapasy, maszyny i dobra mogą zapewnić naszemu krajowi niezbędną ulgę. Dzięki rozważnej dyplomacji możemy zwrócić się o udostępnienie tych środków, co złagodzi niedobory i wzmocni materialne podstawy naszych wysiłków wojennych."
 SIA_japanese_fighters: "Japońskie myśliwce"
 SIA_japanese_fighters_desc: "Chociaż nasz własny przemysł lotniczy jest wciąż niewielki, zagraniczne samoloty mogą pomóc wypełnić lukę. Japońskie myśliwce w [ROOT.GetAdjective] rękach zapewniłyby nam przynajmniej pewną dozę nowoczesnego potencjału lotniczego, nawet jeśli tylko w granicach wyznaczonych przez słabość naszego przemysłu."
 SIA_get_off_our_shores: "Opuśćcie nasze wybrzeża"
 SIA_get_off_our_shores_desc: "Obecność obcych wojsk na syjamskiej ziemi stanowi zniewagę, której nie złagodzą żadne wymówki. Niezależnie od tego, czy będzie to wymagało użycia siły zbrojnej, czy też wywarcia nacisku poprzez wydarzenia za granicą, musimy domagać się, by najeźdźca opuścił nasze terytorium. [ROOT.GetNameDef] musi odzyskać swoją godność.\n\nTo tchórze - jak wszyscy okrutni ludzie. Wynoście się z naszego wybrzeża."
 SIA_singaporean_reinforcements: "Singapurskie wsparcie"
 SIA_singaporean_reinforcements_desc: "Walk na Malajach i w innych regionach nie sposób oddzielić od naszego bezpieczeństwa. Posiłki pozyskane z sił skoncentrowanych wokół Singapuru mogą wzmocnić nasze pozycje, pogłębić współpracę z aliantami oraz zjednoczyć cały teatr działań wokół jednego celu."
 modify_SIA_directorate_of_aeronautical_engineering: "Modyfikuje: §YDyrekcja ds. Inżynierii Lotniczej§! o:"
 SIA_aid_for_resources: "Prośba o zasoby"
 SIA_aid_for_resources_desc: "Nasz kraj posiada zasoby, których pożądają inne kraje, lecz nie ma narzędzi, których mogą dostarczyć te państwa. Rozważna wymiana pomocy na materiały pozwoli zaopatrywać państwo [ROOT.GetAdjective], a pozyskane przez nas środki umożliwią nam przetrwanie."
 SIA_aid_for_resources_tt: "Zwrócimy się do [JAP.GetAdjective] władz z prośbą o przyłączenie się do naszej wojny przeciwko przyznaniu im praw do eksploatacji kauczuku w: §Y[724.GetName]§!"
 SIA_how_quickly_the_tables_turn: "Jak szybko role się odwracają"
 SIA_how_quickly_the_tables_turn_desc: "Ci, którzy kiedyś uważali państwo [ROOT.GetAdjective] za słabe i uległe, mogą wkrótce być zaskoczeni zmianą równowagi. Podczas wojny szczęście bywa kapryśne, musimy być gotowi wykorzystać okazję, kiedy nasi ciemiężcy zaczną się chwiać i znajdą się w niekorzystnej sytuacji."
 SIA_how_quickly_the_tables_turn_trigger: "Zostaliśmy zaatakowani przez mocarstwo i doprowadziliśmy do jego kapitulacji."
 SIA_royal_thai_navy: "Marynarka Wojenna Królestwa Tajlandii"
 SIA_royal_thai_navy_desc: "Obrona państwa [ROOT.GetAdjective] nie ogranicza się do linii brzegowej. Nasze wybrzeża, rzeki i handel morski potrzebują floty godnej królestwa. Wzmocnienie Tajskiej Królewskiej Marynarki Wojennej spowoduje, że Syjam nie straci panowania nad własnymi wodami."
 modify_royal_thai_navy: "Modyfikuje: §Y$idea_SIA_thai_royal_navy$§! o:"
 SIA_direct_army_fundings_towards_the_navy: "Przekazanie funduszy dla armii na rzecz marynarki wojennej"
 SIA_direct_army_fundings_towards_the_navy_desc: "Wojska lądowe od dawna pochłaniają lwią część wydatków na wojsko, jednak [ROOT.GetAdjective] potrzeby strategiczne dotyczą nie tylko kontynentu. Jeśli będziemy przekazywać część pieniędzy na rzecz floty, zaczniemy naprawiać tę nierównowagę oraz zabezpieczymy wybrzeże i morza, na których opiera się nasz handel."
 SIA_thonburi_class_coastal_defense_ship: "Okręt obrony wybrzeża klasy Thonburi"
 SIA_thonburi_class_coastal_defense_ship_desc: "Skromna flota wciąż może mieć ostre kły, jeśli zostanie skrojona pod lokalne warunki. Klasa Thonburi to praktyczny środek ochrony [ROOT.GetAdjective] wybrzeża, łączący niemałą siłę ognia z rolą dopasowaną do wód, które wymagają naszej pilnej ochrony."
 SIA_acquire_submarines: "Pozyskanie okrętów podwodnych"
 SIA_acquire_submarines_desc: "Okręty podwodne dają niewielkiej marynarce wojennej możliwość zadawania ciosów silniejszemu przeciwnikowi. Kryjąc się pod falami, mogą zagrażać transportowi morskiemu, odstraszać większe floty i komplikować wrogom plany związane z naszym wybrzeżem. [ROOT.GetNameDefCap] nie może zaniedbać takiej broni."
 SIA_submarine_day: "Dzień okrętów podwodnych"
 SIA_submarine_day_desc: "Pozyskanie przez naszą flotę zdolności do działań podwodnych zasługuje na publiczne uznanie i narodowy entuzjazm. Celebrowanie tej gałęzi marynarki wojennej może pozytywnie wpłynąć na rekrutację, zwiększyć prestiż tej służby oraz pokazać opinii publicznej, że Syjam wchodzi w nową erę działań marynarki wojennej."
 SIA_the_thonburi_dockyard_project: "Projekt stoczni w Thonburi"
 SIA_the_thonburi_dockyard_project_desc: "Marynarka wojenna nie może opierać się jedynie na importowanych kadłubach. Jeżeli [ROOT.GetNameDef] chce utrzymywać i powiększać swoje siły morskie, musi zainwestować w stocznie, warsztaty oraz pracę, stanowiące prawdziwy fundament potęgi morskiej."
 SIA_expand_the_slipways: "Rozbudowa pochylni okrętowych"
 SIA_expand_the_slipways_desc: "Posiadane przez nas obiekty są zbyt ciasne dla naszych nowych ambicji. Powiększenie pochylni poprawi wydajność budowy oraz naprawy okrętów, dzięki czemu wzrosną gotowość i rozmiary floty."
 SIA_a_new_drydock: "Nowy suchy dok"
 SIA_a_new_drydock_desc: "Do poważnej obsługi serwisowej okrętów potrzebny jest nowoczesny suchy dok. Bez niego przeglądy większych jednostek są powolne, niewydajne i uzależnione od zagranicznego wsparcia. Nowy suchy dok sprawi, że [ROOT.GetNameDef] będzie mieć większy wpływ na swoje przyszłe działania morskie."
 SIA_install_heavy_cranes_and_power_plant: "Instalacja ciężkich dźwigów i elektrowni"
 SIA_install_heavy_cranes_and_power_plant_desc: "Budowa okrętów to nie tylko dostawy drewna i stali, ale także energii oraz maszyn. Ciężkie żurawie i niezakłócone dostawy energii sprawią, że nasze stocznie przestaną być prymitywnymi obiektami i przeobrażą je w narzędzia nowoczesnego przemysłu."
 SIA_establish_the_foundry_and_machine_shop: "Postawienie huty i warsztatu mechanicznego"
 SIA_establish_the_foundry_and_machine_shop_desc: "Samodzielna marynarka wojenna wymaga czegoś więcej niż kadłuby składane z importowanych części. Sfinansowanie własnej huty i warsztatu maszyn wzmocni [ROOT.GetAdjective] krajowe zdolności odlewania, kształtowania oraz naprawy istotnych elementów okrętów wojennych."
 SIA_the_thonburi_arsenal: "Arsenał w Thonburi"
 SIA_the_thonburi_arsenal_desc: "Bez uzbrojenia stocznia jest niekompletna. Budowa arsenału w Thonburi pozwoli nam produkować i składować armaty morskie, amunicję, a także związane z nimi wyposażenie. Ponadto dzięki temu nasza flota zostanie silniej powiązana z krajowym przemysłem."
 SIA_focus_on_commercial_civilian_ships: "Nacisk na komercyjne statki cywilne"
 SIA_focus_on_commercial_civilian_ships_desc: "Nie każda położona stępka musi być przeznaczona do walki. Statki handlowe, transportowce i inne jednostki cywilne tworzą krwiobieg krajowej gospodarki. Wspierając budowę statków komercyjnych, [ROOT.GetNameDef] zwiększa swój dobrobyt, a jednocześnie odporność na czas ewentualnej wojny."
 SIA_empower_the_coastguard: "Wzmocnienie straży przybrzeżnej"
 SIA_empower_the_coastguard_desc: "Flota nie może być wszędzie, a inne, lżejsze, służby mogą lepiej realizować wiele zadań ochrony wybrzeża. Wzmocnienie straży przybrzeżnej zapewni ochronę naszym rybakom, linii brzegowej, a jednocześnie pozwoli marynarce wojennej zajmować się poważniejszymi zagrożeniami."
 SIA_river_patrols: "Patrole rzeczne"
 SIA_river_patrols_desc: "Rzeki to jednocześnie drogi, granice i źródło dochodów państwa [ROOT.GetAdjective] Kutry patrolowe na tych wodach ułatwią nam utrzymanie porządku, wspieranie lokalnych garnizonów, a także pozwolą dotrzeć państwu do regionów, w których decyzje podejmowane w stolicy są wdrażane zbyt wolno."
 SIA_sell_bangkok_dock_co: "Sprzedaż Bangkok Dock Co"
 SIA_sell_bangkok_dock_co_desc: "Kapitał prywatny może odnieść sukces tam, gdzie państwo działa zbyt wolno. Sprzedaż stoczni w Bangkoku w kompetentne ręce umożliwi przyciągnięcie inwestycji, pobudzi wydajność i pozwoli skierować środki publiczne na istotniejsze potrzeby militarne."
 SIA_a_race_against_time: "Wyścig z czasem"
 SIA_a_race_against_time_desc: "Nasza marynarka wojenna jest przestarzała, niedofinansowana i nieprzygotowana do współczesnej wojny. Należy niezwłocznie przekierować środki na budowę okrętów, modernizację, obronę wybrzeża oraz szkolenie marynarzy. Czas ucieka."
 SIA_a_race_against_time_tt: "Gdy upłynie czas ducha, zyskamy:"
 SIA_a_race_against_time_tt2: "na §Y280§! dni"
