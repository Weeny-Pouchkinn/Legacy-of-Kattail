 AST_australian_military_forces: "Australijskie Siły Zbrojne"
 AST_australian_military_forces_desc: "Zahartowane w ogniu I wojny światowej australijskie siły zbrojne wykazały się męstwem na odległych wybrzeżach, dzielnie stawiając opór podczas najbardziej brutalnych kampanii tego konfliktu. W kolejnych latach armia została zredukowana i przekształcona w siły obronne, których głównym zadaniem jest obrona ojczystych wysp. Opłacone krwią doświadczenia przeszłości pozostają żywe i gotowe do ponownego wykorzystania."
 AST_permanant_military_forces: "Stałe siły zbrojne"
 AST_permanant_military_forces_desc: "Podstawową formacją sił zbrojnych Australii jest milicja, której zadaniem jest obrona kontynentu. Jednak teraz, w czasie rosnących napięć na arenie światowej, warto powołać kadrę zawodowych oficerów oraz żołnierzy, z których wielu zdobyło doświadczenie podczas wielkiej wojny. Nawet gdyby początkowo służyli tylko w rezerwie, wnieśliby stały i jednolity poziom szkolenia."
 AST_invoke_the_1903_defence_act: "Wykorzystanie ustawy o obronie z 1903 roku"
 AST_invoke_the_1903_defence_act_desc: "Jeśli idzie o obronę narodową, Australia tradycyjnie polega na swojej milicji. Jednak w czasach dużego zagrożenia, możemy powołać się na Ustawę o obronie z 1903 r. Pozwala to zmobilizować więcej ludzi do celów obronnych."
 AST_lithgow_small_arms_factory: "Fabryka broni Lithgow"
 AST_lithgow_small_arms_factory_desc: "Fabryka broni Lithgow powstała w 1912 r. w celu zmniejszenia zależności od dostaw brytyjskiej broni i wyposażenia w czasie wojny. Napięcie na arenie międzynarodowej znowu rośnie, zatem powinniśmy zwiększyć produkcję, by zaspokoić rosnące zapotrzebowanie ze strony naszych sił zbrojnych."
 AST_dingo_scout_car: "Samochód rozpoznawczy Dingo"
 AST_dingo_scout_car_desc: "Australia nie ma silnej tradycji projektowania pojazdów pancernych, ale nasze siły zbrojne coraz mocniej domagają się poprawy na tym polu. Dlatego powinniśmy mocniej stawiać na wdrażanie krajowych konstrukcji, takich jak samochód rozpoznawczy Dingo."
 AST_volunteer_defence_corps_taog: "Korpus Obrony Ochotniczej"
 AST_volunteer_defence_corps_taog_desc: "Korpus Obrony Ochotniczej, stworzony jako siły wzorowane na brytyjskiej Gwardii Narodowej, to niepobierająca żołdu milicja obywatelska, w której szeregach służą osoby, które nie kwalifikują się do regularnej służby. Mimo tych ograniczeń, ich znajomość lokalnego terenu sprawia, że będą mogli prowadzić działania partyzanckie, jeśli dojdzie do najgorszego."
 AST_war_carriers: "Tragarze wojskowi"
 AST_war_carriers_desc: "Wojny wygrywa się logistyką, a większość terenu, na którym prowadzi działania Australia, jest trudno dostępna dla konwencjonalnych środków transportu, takich jak ciężarówki czy pociągi. Zamiast tego powinniśmy polegać na miejscowych zasobach ludzkich, dobrze przystosowanych do warunków panujących w danym miejscu, a także znających ukryte szlaki oraz skróty."
 AST_anzac_spirit: "Duch ANZAC"
 AST_anzac_spirit_desc: "Korpus Wojskowy Australii i Nowej Zelandii zyskał bardzo dobrą reputację w czasie wielkiej wojny, kiedy to wiele osiągnął, a także przelał dużo krwi, przyczyniając się do zwycięstwa Imperium. Zalety tych sił były oczywiste: wytrwałość, odwaga, elastyczność i poczucie humoru, połączone z pozornie beztroskim lekceważeniem niebezpieczeństw oraz trudów."
 AST_lee_enfield_no1_mark3: "Karabin Lee-Enfield nr 1 Mk III"
 AST_lee_enfield_no1_mark3_desc: "Ta mała gwiazda ma znaczenie. Karabin Lee-Enfield nr 1 Mk III* posiada wprowadzone w czasie wojny modyfikacje przyspieszające produkcję i zmniejszające jej koszt. Ponieważ popyt przekracza nawet tę zwiększoną podaż, musimy wprowadzić rozproszony model produkcji, w którym elementy broni są wytwarzane przez mniejsze firmy, a następnie składane w całość w Lithgow, co dodatkowo zwiększa wydajność."
 AST_new_south_wales_government_railways: "Rządowe koleje Nowej Południowej Walii"
 AST_new_south_wales_government_railways_desc: "Warsztaty rządowych kolei Nowej Południowej Walii posiadają wyjątkową zdolność: mogą odlewać jednolite duże elementy stalowe. Jako jeden z nielicznych krajów Wspólnoty Narodów produkujący odlewane kadłuby oraz wieże czołgów powinniśmy dobrze wykorzystać ten potencjał."
 AST_second_australian_imperial_force: "Drugie Australijskie Siły Imperialne"
 AST_second_australian_imperial_force_desc: "W czasie wielkiej wojny Australia wysłała do walki za granicą Pierwsze Australijskie Siły Imperialne. Światu ponownie grozi wojna, zatem powinniśmy powołać Drugie Australijskie Siły Imperialne, które zademonstrują siłę Australii za oceanem."
 AST_expeditionary_leader: "§YGenerałowie§! będą mieli specjalizację §YPrzywódca ekspedycji§!, która zwiększa ich możliwości za morzem, ale ogranicza liczbę dowodzonych przez nich dywizji."
 AST_expeditionary_leader_plural: "Obaj §Ygenerałowie§! będą mieli specjalizację §YPrzywódca ekspedycji§!, która zwiększa ich możliwości za morzem, ale ogranicza liczbę dowodzonych przez nich dywizji."
 AST_larrikinism: "Krnąbrność"
 AST_larrikinism_desc: "Opisujący \"osobę prostacką, hałaśliwą, ale o dobrym sercu\", larrikinizm stał się ucieleśnieniem australijskiej kultury, szorstkiej wytrwałości, lekceważenia władzy i żartobliwej przekory w obliczu zagrożenia. Podczas wielkiej wojny australijscy żołnierze zasłynęli niezłomnością oraz opanowaniem w najtrudniejszych sytuacjach."
 AST_diggers: "Kopacze"
 AST_diggers_desc: "\"Kopcie, kopcie, kopcie, aż będziecie bezpieczni\" - brzmiał rozkaz wydany generałowi Williamowi Birdwoodowi, kiedy Australijczycy i Nowozelandczycy wylądowali pod Gallipoli. Słowa te stały się synonimem australijskiego sposobu prowadzenia wojny. Jednak duch Kopacza sięga głębiej, łącząc australijskich i nowozelandzkich żołnierzy poprzez braterstwo. Ta trwała więź rodzi się podczas walki ramię w ramię ze swoimi towarzyszami i za nich."
 AST_owen_gun: "Pistolet maszynowy Owen"
 AST_owen_gun_desc: "Innowacyjna, ojczysta konstrukcja pistoletu maszynowego Owen słynie z ogromnej niezawodności, podobnie jak nasi żołnierze. Nasze wojska walczą na całym świecie, zatem powinniśmy widzieć w tej broni nie tylko symbol pomysłowości australijskich konstruktorów, ale także naszego ducha bojowego."
 AST_department_of_supply_and_development_taog: "Departament Zaopatrzenia i Rozwoju"
 AST_department_of_supply_and_development_taog_desc: "Wojenny popyt mocno nadweręża nasze systemy produkcji i logistyki, dlatego musimy dokonać centralizacji naszych działań pod auspicjami specjalnego organu zajmującego się koordynacją oraz utrzymywaniem tych systemów."
 AST_sentinel_tank_development: "Projektowanie czołgów Sentinel"
 AST_sentinel_tank_development_desc: "W przeszłości korzystaliśmy z importowanych konstrukcji czołgów, nawet gdy produkowaliśmy je w naszym kraju. Powinniśmy wdrożyć wnioski z wiedzy zdobytej dzięki tym maszynom i, dodając trochę australijskich innowacji, zaprojektować własny czołg, dopasowany do naszych możliwości oraz zasobów."
 AST_establish_training_camps: "Utworzenie obozów szkoleniowych"
 AST_establish_training_camps_desc: "Podobnie jak podczas wielkiej wojny, Drugie Siły Imperialne mogą trafić do walki w dowolnym miejscu świata. Dlatego należy opracować szczegółowe programy szkoleniowe, które przygotują naszych żołnierzy do działań w każdym środowisku, od pustyń Afryki Północnej, aż po lasy tropikalne Południowego Pacyfiku."
 AST_jungle_tanks_if_sentinel_tank_development: "Jeżeli ukończyliśmy \"Projektowanie czołgów Sentinel\":"
 jungle_heavy_tanks: "Czołgi ciężkie do działań w dżungli"
 AST_anti_malaria_campaign: "Kampania zwalczania malarii"
 AST_anti_malaria_campaign_desc: "Nasze wojska mogą brać udział w walkach w lasach tropikalnych regionu Pacyfiku, gdzie czai się zagrożenie bardziej zabójcze niż kule: malaria. Musimy podjąć zdecydowane działania, żeby chronić naszych żołnierzy przed tym niewidzialnym wrogiem."
 AST_defence_citizen_military_forces_act: "Ustawa o obronnych wojskach obywatelskich"
 AST_defence_citizen_military_forces_act_desc: "Do dzisiaj tylko ochotnicy spośród zawodowych żołnierzy mogli być wysyłani do działań poza granicami ojczyzny. Konflikt narasta, dlatego musimy stworzyć ramy prawne, które umożliwiają jednostkom milicji służbę za granicą, jeśli zajdzie taka potrzeba."
 AST_call_that_a_knife: "Bez obaw!"
 AST_call_that_a_knife_desc: "\"To nie jest nóż. TO jest nóż!\" Odrobina humoru i brawury ma ogromne znaczenie. Nasi żołnierze mierzą się z niebezpieczeństwem z dozą pewności siebie, determinacji i zawadiactwa."
 AST_army_inventions_directorate_taog: "Wydział ds. Wynalazków Wojskowych"
 AST_army_inventions_directorate_taog_desc: "Jedną z korzyści płynących z wojny, jeśli można to tak nazwać, jest szybki rozwój innowacji technologicznych, napędzany koniecznością. Powinniśmy stworzyć centralną organizację, która zajmie się opracowywaniem, doskonaleniem i wdrażaniem tych przełomowych odkryć."
 AST_yeramba: "Yeramba"
 AST_yeramba_desc: "Wykorzystując sukces stworzonych w Australii takich pojazdów jak Sentinel, opracowaliśmy kolejny, potężny element przeznaczony dla naszego arsenału. 25-funtowa armata zamontowana na podwoziu czołgowym to mobilna, niszczycielska siła ognia, która może spaść na naszych wrogów."
 AST_alice_springs: "Alice Springs"
 AST_alice_springs_desc: "Outback to olbrzymi teren... naprawdę olbrzymi. W jego sercu znajduje się miasteczko Alice Springs, które może służyć jako główny węzeł logistyczny do działań w całej Australii. Powinniśmy zainwestować w jego rozwój i zbudować tam bazę wojskową, gdzie żołnierze będą szkoleni do działań w każdym środowisku."
 AST_australian_regular_army: "Regularna armia australijska"
 AST_australian_regular_army_desc: "Dostaliśmy liczne nauczki, od plaż Gallipoli, aż po pustynie Afryki Północnej, góry Grecji i lasy tropikalne Azji Południowo-Wschodniej. To ciężko wypracowane doświadczenie wykuło armię, z którą żadna inna nie może mierzyć się pod względem elastyczności oraz potencjału do adaptacji."
 AST_no1_flying_training_school: "Najlepsza szkoła lotnicza"
 AST_no1_flying_training_school_desc: "Szkoła Lotnicza, założona w 1921 r. jednocześnie z utworzeniem Królewskich Australijskich Sił Powietrznych, była otwierana i zamykana w rytm zapotrzebowania na lotników. Napięcie na arenie międzynarodowej rośnie, więc powinniśmy otworzyć ją ponownie, aby wyszkolić nowe pokolenie pilotów oraz personelu lotniczego."
 AST_empire_air_training_scheme_taog: "Plan szkolenia imperialnego lotnictwa"
 AST_empire_air_training_scheme_taog_desc: "Plan Szkolenia Lotnictwa Wspólnoty Brytyjskiej zapewnia hojne finansowanie i wiedzę krajowi Wspólnoty Narodów na szkolenie dużej liczby pilotów oraz personelu lotniczego. Konkurencja o zostanie gospodarzem tego programu jest zacięta, Australia i Kanada to najpoważniejsze kandydatki. Przesłaliśmy własny wniosek zgodnie z Imperialnym Harmonogramem Szkolenia Lotnictwa."
 AST_volunteer_air_corps: "Ochotniczy Korpus Obserwacji Powietrznej"
 AST_volunteer_air_corps_desc: "Przestrzeń powietrzna Australii jest ogromna, znacznie przekracza zasięg działania oficjalnych jednostek. Powinniśmy polegać też na miejscowych ochotnikach, którzy obsadzą tysiące punktów obserwacyjnych w całym kraju, by strzec naszego nieba."
 AST_improved_ground_crews: "Usprawnione załogi naziemne"
 AST_improved_ground_crews_desc: "Na każdego pilota przypada zespół personelu naziemnego, który dba od sprawność techniczną samolotów, koordynację lotów i działanie bazy. Nie można zapominać także o nawigatorach, strzelcach i bombardierach, tworzących załogi maszyn. Musimy stworzyć odpowiednie placówki szkoleniowe, dzięki czemu nasze siły powietrzne będą działać z maksymalną skutecznością."
 AST_advanced_pilot_training: "Zaawansowane szkolenia pilotów"
 AST_advanced_pilot_training_desc: "Samoloty stają się coraz bardziej skomplikowane, szybsze i nowocześniejsze, więc kompetencje naszych pilotów muszą rosnąć, aby mogli w pełni korzystać z tych technologii."
 AST_advanced_pilot_training_tt: "§G+10%§! do szybkości zdobywania biegłości przez §Ydoktryny powietrzne§!."
 AST_commonwealth_aircraft_corporation_taog: "Commonwealth Aircraft Corporation"
 AST_commonwealth_aircraft_corporation_taog_desc: "Rośnie zainteresowanie wojną powietrzną, dlatego w tej dziedzinie nie możemy pozostać w tyle. Cywilni entuzjaści i innowatorzy już dostrzegli potencjał przemysłu aeronautycznego. Jeśli zapewnimy im odpowiednie finansowanie początkowe, możemy zbudować oraz powiększyć tę rodzącą się branżę."
 AST_reestablish_central_flying_school: "Odtworzenie centralnej szkoły lotniczej"
 AST_reestablish_central_flying_school_desc: "Centralna Szkoła Lotnicza to kolejna australijska szkoła lotnicza, działająca obok Szkoły Lotniczej nr 1. Pozwoli zaspokoić rosnące zapotrzebowanie na nowoczesne siły powietrzne. W miarę narastania napięć międzynarodowych musimy zapewnić naszemu personelowi niezbędne placówki."
 AST_aerodrome_of_democracy_democracy: "Lądowisko demokracji"
 AST_aerodrome_of_democracy_fascism: "Lądowisko dominacji"
 AST_aerodrome_of_democracy_communism: "Lądowisko emancypacji"
 AST_aerodrome_of_democracy_neutrality: "Lądowisko siły"
 AST_aerodrome_of_democracy: "[GET_AERODOME_NAME]"
 AST_aerodrome_of_democracy_desc: "Osiągnąwszy szczytowy potencjał lotnictwa, Australijskie Siły Powietrzne uzyskały tytuł \"[GET_AERODOME_NAME]\". Nasi lotnicy toczą walki powietrzne na całym świecie, a nasze bombowce rzucają zabójcze cienie na przemysł naszych wrogów."
 AST_government_aircraft_factories: "Rządowe fabryki samolotów"
 AST_government_aircraft_factories_desc: "Biorąc pod uwagę odległość dzielącą nas od Europy, w czasie wojny nie możemy polegać na tradycyjnych źródłach dostaw samolotów. Dlatego uzyskanie krajowych zdolności produkcyjnych jest priorytetem, gdyż pozwoli nam wytwarzać płatowce i silniki opracowane według naszych specyfikacji."
 AST_death_from_down_under_taog: "Śmierć z antypodów"
 AST_death_from_down_under_taog_desc: "W odległych zakątkach półkuli południowej stworzyliśmy niezrównane siły powietrzne. Samoloty z dolnej półkuli działają na całym świecie, prowadzą precyzyjne i niszczycielskie uderzenia tam, gdzie kryją się nasi wrogowie."
 AST_ride_the_lightning: "Pęd błyskawicy"
 AST_ride_the_lightning_desc: "Nasi piloci myśliwscy stanowią gro naszych sił powietrznych, są szybcy, agresywni i niezłomni. Rzucają się w wir walki, przejmują panowanie w przestworzach, przechwytują samoloty wroga i zapewniają dominację powietrzną w rejonie działania naszych wojsk."
 AST_the_gathering_storm: "Nadciągająca burza"
 AST_the_gathering_storm_desc: "Nadciąga burza. Rosnąca siła naszego lotnictwa zapewni presję z przestworzy, uderzymy w najsłabsze punkty wroga i wesprzemy nasze natarcie. Na razie słychać odległy grzmot, lecz niebawem przemieni się on w nieustający huragan zniszczenia."
 AST_hear_the_thunder: "Huk gromu"
 AST_hear_the_thunder_desc: "Czy słyszycie huk, czy słyszycie huk gromu? Nasze bombowce startują z antypodów i strategiczne niosą potęgę Australii w inne regiony świata. Gdy z nieba dobiega ryk, a ziemia drży, nasi wrogowie wiedzą, że nadeszła burza, która niesie im zniszczenie."
 AST_department_of_aircraft_production: "Departament produkcji samolotów"
 AST_department_of_aircraft_production_desc: "Błyskawiczny rozwój Królewskich Australijskich Sił Powietrznych znacząco nadwerężył nasz potencjał produkcyjny. Musimy myśleć ambitniej, rozbudowywać i koordynować działanie bazy przemysłowej tak, by zaspokoić popyt i wysłać w przestworza tyle naszych samolotów, że nieboskłon pociemnieje."
 AST_royal_australian_navy: "Królewska Australijska Marynarka Wojenna"
 AST_royal_australian_navy_desc: "Królewska Australijska Marynarka Wojenna, utworzona po powstaniu federacji, poprzez zjednoczenie flot kolonialnych, działała praktycznie na każdym teatrze działań wielkiej wojny. Od tamtego czasu skurczyła się z powodu zmniejszenia finansowania, ale w obliczu narastających napięć na świecie, czas wysłać flotę z powrotem na morza i oceany."
 AST_coast_watchers: "Straż wybrzeża"
 AST_coast_watchers_desc: "Większość naszych sił koncentruje swoją uwagę na stałym lądzie, ale nasze północne podejścia mogłyby stać się istotną siecią wczesnego ostrzegania. Jeśli rozmieścimy agentów wywiadu na tych zewnętrznych wyspach, możemy wykryć ruchy sił powietrznych i morskich wroga na długo, nim zagrożą wybrzeżu Australii."
 AST_marines: "Piechota morska"
 AST_marines_desc: "Jako największa wyspa na oceanie wysp musimy posiadać zdolności do wykonywania desantów morskich, które umożliwią nam projekcję siły poza nasze wybrzeże. Gdyby zaszła potrzeba przejść z obrony do natarcia, takie siły będą mogły sprawnie przemieszczać się z wyspy na wyspę."
 AST_naval_auxiliary_patrol_taog: "Pomocnicza służba patrolowa"
 AST_naval_auxiliary_patrol_taog_desc: "Nasze wojska zawodowe prowadzą inne działania, zatem powinniśmy wykorzystać miejscowych ochotników do ochrony naszych portów i obiektów na wybrzeżu. Ludzie ci znają dokładnie miejscowe szlaki wodne, to nieoceniona wiedza, w dodatku nikt nie będzie podejrzewał, że jakiś miejscowy rybak pracuje dla nas."
 AST_cockatoo_island_shipyards_taog: "Stocznie na Cockatoo Island"
 AST_cockatoo_island_shipyards_taog_desc: "Stocznie na Cockatoo Island od dawna są imperialnym ośrodkiem serwisowym i remontowym, który wspiera zagraniczne działania Królewskiej Marynarki Wojennej. Teraz staną się kamieniem węgielnym Królewskiej Australijskiej Marynarki Wojennej, musimy je rozbudować, aby mogły zaspokoić rosnące potrzeby naszej floty oraz utrzymać nasz potencjał morski."
 AST_kangaroo_point_dry_dock_taog: "Suchy dok w Kangaroo Point"
 AST_kangaroo_point_dry_dock_taog_desc: "Choć Evans Deakin and Company to przede wszystkim firma inżynieryjna, słusznie zauważyła ona potrzebę zwiększenia potencjału budowy okrętów w obliczu wzrostu napięć międzynarodowych i z tą myślą chce zainwestować w Kangaroo Point. Powinniśmy ułatwić im przejęcie tego terenu, aby w ten sposób pomóc w dalszej rozbudowie naszej floty."
 AST_scrap_iron_flotilla_taog: "Złomowa Flotylla"
 AST_scrap_iron_flotilla_taog_desc: "Lekceważone przez krytyków, uważane przez nich za zużyte i przestarzałe, nasze starsze niszczyciele połączono w ramach jednej formacji. Choć nie mają prestiżu nowoczesnych jednostek, okręty te stanowią pomysłowe wykorzystanie tego, co już posiadamy."
 AST_cruising_for_a_bruising: "Szukanie kłopotów"
 AST_cruising_for_a_bruising_desc: "Nasza marynarka wojenna od dawna sprawnie wykorzystywała krążowniki, warto jeszcze wzmocnić tę tradycję. Te szybkie, uniwersalne i potężne okręty wkrótce zasłyną na całym świecie. Każdy wróg, który wejdzie im w drogę, może spodziewać się solidnego lania."
 AST_strike_from_down_under: "Natarcie spod ziemi"
 AST_strike_from_down_under_desc: "Bezszelestnie suną w morskiej otchłani, znajdą was i splądrują wasze statki. Słyszeliście o okrętach podwodnych z antypodów? Uciekajcie, jeśli wasza flota jest wam droga. Hura!"
 AST_hmas_sydney: "HMAS Sydney"
 AST_hmas_sydney_desc: "Era pancerników dobiegła końca. Przyszłość potęg morskich leży w przestworzach nad flotą i Australia nie pozostanie pod tym względem w tyle. Po wielu latach odbudowy i modernizacji naszej marynarki wojennej jesteśmy gotowi na ten ostatni krok: budowę lotniskowca, który będzie symbolem australijskiej potęgi morskiej przez całe następne pokolenie."
 AST_conscription_level_allowed_tt: "Wola polityczna na rzecz poszerzenia poboru do wojska (szukaj ikony zasobów ludzkich przy celach)"
 AST_conscription_level_allowed_limited_conscription_tt: "Odblokuj dodatkowy poziom §Yprawa służby wojskowej§!, który udostępni §Yczęściowy pobór§!"
 AST_conscription_level_allowed_extensive_conscription_tt: "Odblokuj dodatkowy poziom §Yprawa służby wojskowej§!, który udostępni §Ypełny pobór§!"
 AST_conscription_level_allowed_service_by_requirement_tt: "Odblokuj dodatkowy poziom §Yprawa służby wojskowej§!, który udostępni §Yobowiązkową służbę§!"
 AST_conscription_level_allowed_all_adults_serve_tt: "Odblokuj dodatkowy poziom §Yprawa służby wojskowej§!, który udostępni §Ysłużbę wszystkich dorosłych§!"
 AST_conscription_level_allowed_scraping_the_barrel_tt: "Odblokuj dodatkowy poziom §Yprawa służby wojskowej§!, który udostępni §Ybrak selekcji§!"
 AST_conscription_law_so_far: "[CONSCRIPTION_LAW_SO_FAR]"
