 AST_party_campaign_text: "Kampania polityczna"
 AST_government_formation_period_title: "§WCzas tworzenia rządu:§!"
 AST_government_formation_period_timer: "§Y[?AST_election_recently_concluded:days_left]§! §Wdni§!"
 AST_form_unity_government_text: "Rząd Jedności Narodowej"
