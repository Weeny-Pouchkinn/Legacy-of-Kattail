 ### MISC ###
 ############
 add_random_stat_to_general_tt: "Ten generał otrzyma dodatkową, losową umiejętność"
 generic_unlock_industrial_concern_tt: "Dostępne jako koncern przemysłowy: \n"
 NZL_rail_standardization_tt: "§Y[?NZL_train_var]§! jednostek §Y$NZL_train_equipment_1$§! do zapasów narodowych."
 NZL_ministry_of_public_works: "Ministerstwo Robót Publicznych"
 NZL_ministry_of_public_works_desc: "Dzięki koordynacji planowania i dyscyplinie inwestycji, drogi, trasy kolejowe i sieci zasilające będą rozwijane zgodnie ze spójną strategią narodową, a nie poprzez nieskoordynowane działania."
 NZL_abolish_the_railways_board: "Likwidacja rady kolejowej"
 NZL_abolish_the_railways_board_desc: "Rządowa rada kolejowa okazała się nieskuteczna, jeśli idzie o modernizację sieci. Czas zlikwidować tę aberrację i przywrócić kontrolę ministerstwa nad kolejami."
 NZL_rail_standardization: "Standaryzacja lokomotyw"
 NZL_rail_standardization_desc: "[ROOT.GetName] posiada wiele warsztatów w całym kraju, które produkują lokomotywy różnej jakości. Żeby system kolejowy stał się bardziej wydajny, opracujemy określoną liczbę standardowych lokomotyw, które będą produkowane w tych zakładach, każda z nich będzie przeznaczona do określonego celu. "
 NZL_full_employment: "Pełne zatrudnienie"
 NZL_full_employment_desc: "Dzięki nieprzerwanym robotom publicznym, rozważnemu planowaniu i trwałej ekspansji przemysłowej bezrobocie wreszcie ustąpiło miejsca możliwościom. Warsztaty, które zamknięto w kryzysowych latach, znowu działają, a siła robocza kraju maksymalnie wspiera produktywne przedsięwzięcia. Przywróciwszy zaufanie i stabilizację, nie tylko się podnieśliśmy, ale mamy też nowe siły, aby zmierzyć się z czekającymi nas wyzwaniami."
 NZL_direct_the_coal_industry: "Nadzór nad przemysłem węglowym"
 NZL_direct_the_coal_industry_desc: "Węgiel ma coraz większe znaczenie dla naszych kolei, przemysłu i elektrowni, dlatego w interesie narodowym rząd powinien zająć się koordynacją produkcji i dystrybucji tego surowca."
 NZL_establish_the_ncb: "Utworzenie Krajowej Rady Węglowej"
 NZL_establish_the_ncb_desc: "Stworzenie Krajowej Rady Węglowej pozwoli skoordynować nadzór nad rozproszonymi kopalniami i zapewni stabilne zaopatrzenie paliwa dla kolei, przemysłu oraz elektrowni. Poprzez nadzór centralny zracjonalizujemy produkcję, poprawimy wydajność i zagwarantujemy, że potrzeby strategiczne będą stawiane wyżej niż prywatne interesy."
 NZL_electrification: "Zwiększenie produkcji energii"
 NZL_electrification_desc: "Poprzez ujarzmienie naszych rzek i zwiększenie produkcji energii w hydroelektrowniach możemy zbudować fundamenty trwałej siły przemysłu. Nowe zapory i sieci przesyłowe zwiększą wydajność w całym kraju, dzięki czemu fabryki, koleje oraz porty będą otrzymywały potrzebne im ilości energii."
 NZL_bureau_of_industry_taog: "$NZL_bureau_of_industry$"
 NZL_bureau_of_industry_taog_desc: "$NZL_bureau_of_industry_desc$"
 NZL_wairarapa_sheep_farms_taog: "$NZL_wairarapa_sheep_farms$"
 NZL_wairarapa_sheep_farms_taog_desc: "$NZL_wairarapa_sheep_farms_desc$"
 NZL_national_roads_board_taog: "$NZL_national_roads_board$"
 NZL_national_roads_board_taog_desc: "$NZL_national_roads_board_desc$"
 NZL_taranaki_oil_taog: "$NZL_taranaki_oil$"
 NZL_taranaki_oil_taog_desc: "$NZL_taranaki_oil_desc$"
 NZL_women_in_the_workforce: "Pracujące kobiety"
 NZL_women_in_the_workforce_desc: "Niedobory siły roboczej rosną, co zwiększa rolę kobiet w fabrykach, w rolnictwie oraz usługach publicznych. Dzięki temu produkcja nie załamuje się mimo obciążenia wojną. Zwiększenie możliwości szkoleniowych oraz zatrudnienia pozwoli nam utrzymać poziom wytwórczości przemysłowej oraz krajowy potencjał obronny."
 NZL_restart_the_onekaka_ironworks: "Uruchomienie huty żelaza Onekaka"
 NZL_restart_the_onekaka_ironworks_desc: "Huta Onekaka miała kiedyś zrealizować naszą ambicję krajowej produkcji żelaza i stali, aby zmniejszyć zależność od dostaw z innych państw. W celu ożywienia gospodarki i zwiększenia bezpieczeństwa narodowego, powinniśmy rozważyć ponowne uruchomienie pieców w Onekaka."
 NZL_new_zealand_steel_taog: "$NZL_new_zealand_steel$"
 NZL_new_zealand_steel_taog_desc: "$NZL_new_zealand_steel_desc$"
 NZL_scrap_metal_recycling: "Kampania recyklingowa"
 NZL_scrap_metal_recycling_desc: "Taka gospodarka jak nasza, silnie oparta na eksporcie, nie może sobie pozwolić na marnowanie zasobów strategicznych. Żeby zwiększyć naszą odporność gospodarczą powinniśmy stworzyć placówki odzyskiwania złomu, które umożliwią nam przetwarzanie i ponowne użycie metali oraz gumy."
 NZL_domestic_car_industry: "Inwestycja w zakłady montażu pojazdów"
 NZL_domestic_car_industry_desc: "Produkcja pojazdów w [ROOT.GetAdjective] zakładach ogranicza się do składania części pochodzących od zagranicznych wytwórców, które są tu dostarczane do ostatecznego montażu. Dzięki naszym niedawnym inwestycjom w krajową produkcję stali możemy uruchomić wytwarzanie własnych komponentów."
 NZL_department_of_scientific_and_industrial_research_taog: "$NZL_department_of_scientific_and_industrial_research$"
 NZL_department_of_scientific_and_industrial_research_taog_desc: "$NZL_department_of_scientific_and_industrial_research_desc$"
 NZL_project_seal_taog: "$NZL_project_seal$"
 NZL_project_seal_taog_desc: "$NZL_project_seal_desc$"
 NZL_industrial_conscription_taog: "$NZL_industrial_conscription$"
 NZL_think_big_taog: "$NZL_think_big$"
 NZL_industrial_conscription_taog_desc: "$NZL_industrial_conscription_desc$"
 NZL_think_big_taog_desc: "$NZL_think_big_desc$"
 NZL_expand_the_university_of_auckland_taog: "$NZL_expand_the_university_of_auckland$"
 NZL_expand_the_university_of_auckland_taog_desc: "$NZL_expand_the_university_of_auckland_desc$"
 NZL_national_broadcasting_service: "Narodowy Serwis Radiofoniczny"
 NZL_national_broadcasting_service_desc: "Po ingerencji w wybory 1935 r. przez pocztę i jej nadzór nad państwowymi usługami radiofonicznymi musimy zreformować zarządzanie tą organizacją. Powinniśmy też zainwestować w modernizację sprzętu nadawczego."
 NZL_support_allies_with_meat: "Wykorzystanie przemysłu mięsnego"
 NZL_support_allies_with_meat_desc: "Nasi sojusznicy na Pacyfiku często rozciągają do granic swoje linie zaopatrzeniowe. Żeby zmniejszyć ich obciążenie i wykarmić wojsko, powinniśmy zacząć zaopatrywać ich w mięso."
 NZL_support_allies_with_meat_tt: "Wszyscy sojusznicy otrzymają §G1§! §Yfabrykę cywilną poza mapą§!"
 AST_COMINWEALTH_FACTION: "Wspólnota Narodów"
 AST_cominwealth_tech_sharing_tt: "Zawrzemy §Yumowę o przekazywaniu technologii§! ze wszystkimi członkami naszej frakcji."
 AST_modify_offshore_advancements_spirit_tt: "Modyfikuje §Y$AST_offshore_advancements_spirit$§! o:"
 AST_gain_claims_on_japan_tt: "Zyskamy roszczenia do §Yjapońskich wysp ojczystych§!"
 AST_ireland_anti_british_pact_offer_accept_tt: "Jeżeli się zgodzą:"
 AST_through_the_barricades_tt: "Jeżeli §Y[ENG.GetNameDef]§! ma przynajmniej §Y10%§! poparcia dla komunistów, to na początku wojny dokerzy z §Y[132.GetCapitalVictoryPointName]§! powstaną, by nas poprzeć!"
 AST_end_the_kingdom_ireland_join_tt: "Ponieważ [IRE.GetName] należy do paktu antybrytyjskiego, wejdzie do konfliktu po naszej stronie, gdy wypowiemy wojnę rządowi [ENG.GetAdjective]"
