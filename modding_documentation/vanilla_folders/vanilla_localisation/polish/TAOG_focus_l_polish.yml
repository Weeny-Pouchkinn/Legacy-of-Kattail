 INSHOL_foundations_of_defense_desc: "$HOL_the_foundations_of_defense_desc$"
 INSHOL_investments_in_civ_railways_tt: "Jeśli [HOL.GetFlag]§Y[HOL.GetName]§! zrealizuje cel:\n         ([INS.GetFlag]§Y[INS.GetName]§!: Dodanie §Y£autonomy_texticon -250,00§!)\n   Jeśli [INS.GetFlag]§Y[INS.GetName]§! ukończy cel:\n         Dodanie §Y£autonomy_texticon 250,00§!"
 INSHOL_investments_in_civ_railways: "Inwestycje w cywilną kolej"
 INSHOL_investments_in_civ_railways_desc: "Aby zdobyć poparcie mieszkańców Indii Wschodnich, konieczne są inwestycje w cywilną infrastrukturę. Obecnie nasze linie kolejowe obsługują głównie transport towarowy. Powinniśmy zakupić pociągi pasażerskie, które będą kursowały po istniejących już liniach kolejowych na Jawie i Sumatrze."
 INSHOL_continue_exclusive_rights: "Ekskluzywne uprawnienia dla De Javasche Bank"
 INSHOL_continue_exclusive_rights_desc: "Gulden Indii Wschodnich stracił większość swojej wartości podczas wielkiego kryzysu, a nasz wzrost gospodarczy uległ zahamowaniu. Moglibyśmy spróbować ustabilizować kurs guldena, przyznając Bankowi Jawajskiemu wyłączne prawo do emisji banknotów, które miał do 1922 roku."
 INSHOL_peg_indies_guilder_to_dutch_guilder: "Powiązanie guldena indyjskiego z guldenem holenderskim"
 INSHOL_peg_indies_guilder_to_dutch_guilder_desc: "Gulden Indii Wschodnich stracił większość swojej wartości podczas wielkiego kryzysu, a nasz wzrost gospodarczy uległ zahamowaniu. Najprostszym rozwiązaniem jest powiązanie guldena Indii Wschodnich z guldenem holenderskim, który jest znacznie bardziej stabilną walutą. Zbliży to też nas do naszych zwierzchników."
 INSHOL_peg_indies_guilder_to_us_dollar: "Powiązanie guldena Indii Wschodnich z dolarem amerykańskim"
 INSHOL_peg_indies_guilder_to_us_dollar_desc: "Gulden Indii Wschodnich stracił większość swojej wartości podczas wielkiego kryzysu, a nasz wzrost gospodarczy uległ zahamowaniu. Chociaż moglibyśmy powiązać gulden Indii Wschodnich z guldenem holenderskim, dolar amerykański jest walutą znacznie stabilniejszą. Powiązanie guldena z dolarem zapewniłoby nam również większą niezależność gospodarczą, dzięki czemu samorządność stałaby się celem łatwiejszym do osiągnięcia."
 indonesia_currency_pegged_to_dollar_modifier: "Gulden Indyjski powiązany z dolarem amerykańskim"
 INS_direct_rule_tt: "Odblokowanie prawa okupacyjnego §Y$INS_direct_rule_occupation_law$§! w indonezyjskich księstwach-państwach.\nEfekty:\n     §GZwiększenie§! liczby fabryk i ilości zasobów z państwa\n     §RZmniejszenie§! szybkości wzrostu posłuszeństwa\n     §RZwiększenie§! rozwoju ruchu oporu"
 INS_local_autonomy_tt: "Odblokowanie prawa okupacyjnego §Y$INS_local_autonomy_occupation_law$§! w indonezyjskich księstwach-państwach.\nEfekty:\n     §YMałe§! ogólne wzmocnienia\n     §GZwiększenie§! szybkości wzrostu posłuszeństwa"
 INS_invest_in_batavian_education_req_tt: "Ukończono pomyślnie co najmniej §Y3§! misje Volksraadu"
 INS_invest_in_batavian_education_req_2_tt: "Ukończono pomyślnie co najmniej §Y6§! misji Volksraadu"
 INSHOL_eventual_autonomy_req_tt: "Ukończono pomyślnie co najmniej §Y4§! misje Volksraadu"
 indonesia_volksraad_passed_12: "Indonezyjska flaga państwowa została oficjalnie uznana"
 INS_stronghold_java_tt: "Żaden indonezyjski region nie jest okupowany przez: [ROOT.GetFlag][ROOT.GetNameDefCap]"
 INSHOL_request_east_timor: "Żądanie zwrotu Timoru Wschodniego"
 INSHOL_request_east_timor_desc: "Portugalia nie ma prawa okupować Timoru - jest to relikt historii kolonialnej, którego nie możemy dłużej tolerować, ponieważ terytorium to należy do Indonezji. Zwrócimy się do Portugalii z oficjalnym żądaniem natychmiastowego zwrotu Timoru."
 INS_resist_occupation: "Opór wobec okupacji"
 INS_resist_occupation_desc: "Gniew, jaki wielu Indonezyjczyków żywi wobec Holandii, nie może doprowadzić nas do pogrążenia się w faszyzmie. Musimy zrobić wszystko, co w naszej mocy, aby stawić opór japońskiej inwazji i bronić ojczyzny."
 INS_local_resistance: "Miejscowy ruch oporu"
 INS_local_resistance_desc: "Utworzymy komórki ruchu oporu na terenach, które nie są jeszcze okupowane, aby w razie ich zajęcia być gotowymi do odzyskania, gdy nadejdzie odpowiedni moment."
 INS_stronghold_java: "Twierdza Jawa"
 INS_stronghold_java_desc: "Indie Wschodnie to rozległy archipelag zamieszkały przez wiele ludów i charakteryzujący się niezwykle trudnym terenem. Próba obrony każdej wyspy, dżungli i góry przed armią znacznie przewyższającą nasze siły zbrojne, jest z góry skazana na porażkę. Choć porzucenie naszych rodaków nie jest łatwe, ewakuacja może okazać się najlepszym rozwiązaniem dla dobra całego narodu. Trzeba przemyśleć opuszczenie wszystkich wysp z wyjątkiem Jawy, co pozwoli nam umieścić tam całą naszą armię."
 INS_silence_nationalists: "Uciszenie nacjonalistycznych sympatyków"
 INS_silence_nationalists_desc: "Japońska inwazja sprawiła, że nacjonalistyczne ruchy rewolucyjne zaczęły popierać japońskich najeźdźców ze względu na wspólnego wroga, którym jest Holandia. Niestabilność wywołana inwazją doprowadziła do niespotykanego dotąd przyspieszenia rozwoju tych ruchów. Jeśli nie podejmiemy natychmiastowych działań, sytuacja może całkowicie wymknąć się spod kontroli."
 INS_east_indies_exile_government: "Rząd Indii Wschodnich na wygnaniu"
 INS_east_indies_exile_government_desc: "Niestety, mimo naszych wysiłków Indie Wschodnie upadły. Nie możemy jednak tracić nadziei. Musimy nadal robić wszystko, co w naszej mocy, korzystając z ograniczonych zasobów, jakimi dysponujemy. Być może przegraliśmy bitwę, ale wojna jeszcze się nie skończyła."
 INS_establish_nefis: "Utworzenie SWHSZIW"
 INS_establish_nefis_desc: "We współpracy z sojusznikami utworzymy Służbę Wywiadowczą Holenderskich Sił Zbrojnych Indii Wschodnich, która będzie stacjonowała w Australii. Za jej pośrednictwem będziemy prowadzić tajne operacje sabotujące działania japońskich sił okupacyjnych. Każde, nawet najmniejsze zwycięstwo przybliża nas do powrotu do ojczyzny."
 INS_evacuate_soldiers_to_australia: "Ewakuacja żołnierzy do Australii"
 INS_evacuate_soldiers_to_australia_desc: "Utworzymy bazę wojskową w pobliżu bazy SWHSZIW w północnej Australii. Stacjonować tam będą żołnierze KHAIW, którym udało się uniknąć schwytania podczas okupacji, co pozwoli nam kontynuować walkę."
 INS_australian_weapons: "Australijska broń"
 INS_australian_weapons_desc: "Tajne operacje nie są łatwe do przeprowadzenia i aby odnieść sukces, będziemy potrzebować odpowiedniego sprzętu. Możemy uzyskać licencje od australijskich fabryk i przekształcić je tak, by produkowały broń dla SWHSZIW."
 INS_defenders_of_homeland: "Obrońcy ojczyzny"
 INS_defenders_of_homeland_tt: "Ten cel zostanie automatycznie wypełniony, gdy powstanie armia obrońców ojczyzny."
 INS_resist_occupation_tt: "Ten cel zostanie automatycznie wypełniony, gdy zostaniemy najechani i się nie poddamy."
 INS_defenders_of_homeland_desc: "Rząd Indii Wschodnich upadł, a jego miejsce zajął nowy reżim. Pod przewodnictwem nacjonalistów i japońskiego rządu stworzymy nową armię, przewyższającą KHAIW, i wygramy wojnę. Nie da się jednak zaprzeczyć, że sojusz nacjonalistów i imperialistów jest kruchy. Czy sojusz ten przetrwa, czy też zakończy się rozlewem krwi?"
 INS_embrace_co_prosp_sphere: "Dołączenie do Strefy Wspólnego Dobrobytu"
 INS_embrace_co_prosp_sphere_desc: "Wreszcie położyliśmy kres panowaniu Holandii i choć zastąpiliśmy jednego władcę innym, obietnice dobrobytu gospodarczego i panazjatyckości są bardzo zachęcające. Będziemy dalej wspierać działania wojenne Japonii, by zniechęcić Holandię do powrotu do Indonezji."
 INS_seize_oppurtunity: "Wykorzystanie historycznej szansy"
 INS_seize_oppurtunity_desc: "[JAP.GetNameDefCap] przegrywa, a [JAP.GetAdjective] rząd okupacyjny jest słaby. Po raz pierwszy od wielu stuleci mamy realną szansę na trwałe zrzucenie kajdan krępujących Indonezję i stworzenie niepodległego państwa. Jeśli nie wykorzystamy tej okazji, by ogłosić niepodległość teraz, nie wiadomo, ile czasu minie, zanim pojawi się kolejna taka szansa."
 INS_japanese_resource_infrastructure: "Wspieranie zwiększonego wysiłku wojennego"
 INS_japanese_resource_infrastructure_desc: "Przekazanie kontroli nad naszą podstawową infrastrukturą wydobywczą [JAP.GetAdjective] władzom jest niezbędnym krokiem do wygrania wojny, ponieważ zapewnienie ciągłego, pełnego zaopatrzenia [JAP.GetAdjective] jednostek ma najwyższy priorytet. [JAP.GetNameDefCap] będzie też rozwijać naszą lokalną infrastrukturę w celu zwiększenia eksportu."
 INS_japanese_army_training: "Reforma armii"
 INS_japanese_army_training_desc: "Mamy wiele do nauczenia się od naszych [JAP.GetAdjective] władców, a teraz, gdy KHAIW została rozwiązana, powinniśmy stworzyć nową armię szkoloną przez Cesarską Armię Japonii i gotową do obrony Indonezji przed zewnętrznymi zagrożeniami."
 INS_governor_general_de_jonge: "Gubernator generalny de Jonge"
 INS_governor_general_de_jonge_desc: "Bonifacius Cornelis de Jonge znany jest z rządów twardej ręki, zwalczania wszelkich przejawów nacjonalizmu oraz częstego ignorowania postulatów Volksraadu. Włada Indiami Wschodnimi od dawna, a jego doświadczenie sięga czasów wielkiej wojny, podczas której pełnił funkcję ministra wojny Indii."
 INS_governor_general_tjarda: "Gubernator generalny Tjarda"
 INS_tjarda_explain_tt: "Kadencja §YBonifaciusa Cornelisa de Jonge§! dobiegła końca, a we wrześniu 1936 roku na jego następcę jako gubernator został wybrany §YAlidius Tjarda van Starkenborgh Stachouwe§!."
 INS_governor_general_tjarda_desc: "Alidius Tjarda van Starkenborgh Stachouwer ma nieco inne poglądy na temat Indii Wschodnich niż jego poprzednik. Chociaż wciąż sprzeciwia się nacjonalizmowi, prowadzi nieco bardziej liberalną politykę i chętniej przychyla się do postulatów Volksraadu."
 INS_electrical_investments: "Elektryczne inwestycje"
 INS_electrical_investments_desc: "Każdy zindustrializowany europejski kraj dysponuje rozbudowaną siecią energetyczną, która wspiera jego przemysł. Jeśli chcemy odejść od eksportu surowców i stworzyć własny przemysł wytwórczy, tak jak oni, powinniśmy zbudować sieć energetyczną o dużej przepustowości, która obejmie całą Jawę."
 INS_reduce_land_taxes: "Obniżenie podatków od gruntów"
 INS_reduce_land_taxes_desc: "Wysokie podatki od posiadania gruntów utrudniają rdzennym mieszkańcom Indonezji prowadzenie plantacji i działalności gospodarczych. Chociaż ułatwiło nam to utrzymanie monopolu w branży kauczukowej, spowodowało to problemy gospodarcze w całym kraju. Powinniśmy rozważyć obniżenie tych podatków do poprzednich stawek, co umożliwiłoby funkcjonowanie mniejszych, prywatnych plantacji drzew kauczukowych."
 INS_invest_in_batavian_education: "Inwestycje w edukację w Batavii"
 INS_invest_in_batavian_education_desc: "Volksraad jasno stwierdził, że wolą narodu indonezyjskiego jest zwiększenie dostępności edukacji, ponieważ obecnie mogą sobie na nią pozwolić głównie Indonezyjczycy pochodzenia holenderskiego oraz niewielka grupa indonezyjskiej elity. Aby zrealizować postulat Volksraadu, powinniśmy wybudować kilka szkół podstawowych i średnich w Batavii i jej okolicach."
 INS_javanese_education_investments: "Inwestycje w edukację na Jawie"
 INS_javanese_education_investments_desc: "Oprócz realizowanego obecnie projektu budowy szkół podstawowych i średnich moglibyśmy wybudować uczelnię publiczną oraz specjalistyczne szkoły zawodowe, co znacznie zwiększyłoby dostępność dalszej edukacji dla rodzin z klasy średniej."
 INS_allow_local_autonomy: "Dopuszczenie autonomii lokalnej"
 INS_allow_local_autonomy_desc: "System Vorstenlanden, zapewniający księstwom-państwom samorządność, znacznie ułatwił kontrolowanie ruchów nacjonalistycznych i zwiększył stabilność całego kraju. Powinniśmy jeszcze bardziej zwiększyć poziom autonomii przyznanej księstwom-państwom, co pozwoli rządowi skupić się na ważniejszych sprawach."
 INS_direct_rule: "Bezpośrednie rządy"
 INS_direct_rule_desc: "System Vorstenlanden, przyznający księstwom-państwom samorządność, utrudnia administrowanie krajem, powodując zwiększenie biurokracji i stratę czasu. Najwyższa pora całkowicie znieść ten system i wprowadzić bezpośrednie rządy nad całym archipelagiem."
 INS_seize_oppurtunity_tt: "§Y[JAP.GetFlag][JAP.GetName]§! odpowiedziała kontratakiem, a liczba kontrolowanych przez to państwo regionów wynosi mniej niż §Y[?var:temp_states_plus_more]§!. (Obecnie: §Y[?var:JAP.num_controlled_states]§!)"
 INS_seize_oppurtunity_refuse_warn_tt: "§RRozpocznie się rewolucja narodowa, co może doprowadzić do wojny z: [HOL.GetNameDef]§!."
 INS_economic_stabilization: "Stabilizacja gospodarcza"
 INS_economic_stabilization_desc: "Wielki kryzys i światowy protekcjonizm doprowadziły naszą gospodarkę do załamania, przez co wielu Indonezyjczyków, którzy niegdyś pracowali w przemyśle surowcowym, straciło pracę. Musimy podjąć zdecydowane działania i stworzyć program, w ramach którego obywatele pozostający bez pracy otrzymają zatrudnienie."
 INS_restore_order_in_indies: "Przywrócenie porządku w Indiach Wschodnich"
 INS_restore_order_in_indies_desc: "Rosnący w siłę ruch nacjonalistyczny w Indiach Wschodnich doprowadził do destabilizacji kilku regionów i może wymknąć się spod kontroli, jeśli go nie powstrzymamy. Naszym priorytetem musi być przywrócenie porządku i stabilności."
 INS_detangle_supply_chains: "Uporządkowanie łańcuchów dostaw"
 INS_detangle_supply_chains_desc: "W naszej gospodarce eksportowej towary przed dotarciem do celu muszą przejść przez dziesiątki pośredników, z których każdy pobiera opłatę, podatek lub inny rodzaj prowizji. Powinniśmy dążyć do wyeliminowania tego bałaganu i przejęcia bezpośredniej kontroli nad przeważającą częścią łańcucha dostaw."
 INS_prioritize_industrial_growth: "Priorytet na rozwój przemysłowy"
 INS_prioritize_industrial_growth_desc: "Nasza gospodarka eksportowa jest zbyt niestabilna i uzależnia nas od współpracy z Holandią. Powinniśmy skupić się na rozwoju przemysłu wytwórczego poprzez budowę fabryk w Batavii. Moglibyśmy stać się najbardziej uprzemysłowionym krajem w regionie Pacyfiku."
 INS_closer_economic_ties_to_netherlands: "Zacieśnienie więzi gospodarczych z Holandią"
 INS_closer_economic_ties_to_netherlands_desc: "Możemy się wiele nauczyć od naszych zwierzchników, zwłaszcza w kwestiach gospodarczych. Gdybyśmy jeszcze bardziej zintegrowali naszą gospodarkę eksportową z gospodarką Holandii, moglibyśmy wykorzystać ich infrastrukturę i kontakty, aby zawrzeć korzystniejsze umowy handlowe."
 INS_prioritize_dutch_companies: "Priorytet na holenderskie przedsiębiorstwa"
 INS_prioritize_dutch_companies_desc: "Holenderskie przedsiębiorstwa, takie jak Shell i Fokker, od wieków stanowią filar naszej gospodarki, a eksport naszych surowców jest ściśle powiązany z działalnością firmy Shell. Przyniosło to Indiom Wschodnim znaczne bogactwo i powinniśmy traktować je priorytetowo w stosunku do mniejszych, lokalnych przedsiębiorstw, aby zagwarantować utrzymanie ścisłej współpracy."
 INSHOL_java_factories: "Otwarcie fabryk broni na Jawie"
 INSHOL_java_factories_desc: "Choć brzmi to banalnie, nie da się zaprzeczyć, że samo wybudowanie większej liczby fabryk zbrojeniowych w znacznym stopniu przyczynia się do wzmocnienia armii. Jako przemysłowe centrum kolonii Jawa jest oczywistym miejscem do ich budowy."
 INSHOL_license_dutch_weapon_blueprints: "Nabycie licencji na holenderskie plany broni"
 INSHOL_license_dutch_weapon_blueprints_desc: "Zamiast inwestować w stworzenie od podstaw całego krajowego procesu produkcyjnego i opracowywanie własnych projektów technologicznych, powinniśmy nawiązać współpracę z holenderskimi firmami w celu nabycia ich planów konstrukcyjnych broni."
 INSHOL_bangka_production_lines: "Linie produkcyjne na wyspie Bangka"
 INSHOL_bangka_production_lines_desc: "Gwałtowny rozwój infrastruktury na wyspie Bangka, będący wynikiem realizacji projektu Bangka, sprawił, że ta niegdyś niewielka i mało znacząca wysepka stała się idealnym miejscem dla nowych przedsięwzięć przemysłowych. Mamy okazję wzmocnić KHAIW poprzez budowę na niej nowej fabryki broni, która dzięki koncentracji dróg, linii kolejowych i portów będzie działać wydajniej, niż gdybyśmy wznieśli ją gdzie indziej."
 INSHOL_artillerie_inrichtingen: "Artillerie Inrichtingen"
 INSHOL_artillerie_inrichtingen_desc: "Firma Artillerie Inrichtingen od ponad 250 lat zajmuje się produkcją broni artyleryjskiej i innych rodzajów uzbrojenia w Holandii, a od kilkudziesięciu lat prowadzi działalność w Indiach Wschodnich. Rozszerzenie możliwości produkcyjnych poprzez otwarcie nowych zakładów w Indiach Wschodnich znacznie poprawiłoby potencjał bojowy KHAIW, a jednocześnie wzmocniłoby gospodarkę regionów dotkniętych niedofinansowaniem poprzez tworzenie nowych miejsc pracy."
 INSHOL_ai_pyrotechnische: "Artillerie Inrichtingen Pyrotechnische"
 INSHOL_ai_pyrotechnische_desc: "W ramach dalszej rozbudowy zakładów produkcyjnych Artillerie Inrichtingen w Indiach Wschodnich powinniśmy sfinansować utworzenie tam oddziału spółki zależnej Artillerie Inrichtingen zajmującej się materiałami pirotechnicznymi."
 INSHOL_bio_pharma: "Bio Pharma"
 INSHOL_bio_pharma_desc: "Rozwój przemysłu farmaceutycznego w Indiach Wschodnich stanowi oczywisty kolejny krok w reformowaniu KHAIW mający na celu zapewnienie rannym żołnierzom odpowiedniego leczenia i bezpiecznego powrotu do zdrowia. Powszechna dostępność chininy w Indiach Wschodnich sprawia, że koszty tego przedsięwzięcia są znacznie niższe niż zazwyczaj."
 INSHOL_develop_fighters: "Zaprojektowanie nowych myśliwców"
 INSHOL_develop_fighters_desc: "Wyślemy batawiańskich inżynierów do Amsterdamu, aby osobiście zapoznali się z produkcją myśliwców firmy Fokker i uzyskali dostęp do jej ściśle strzeżonych tajemnic produkcyjnych. Powrócą oni z wiedzą i doświadczeniem technicznym niezbędnymi do stworzenia nowoczesnego krajowego przemysłu lotniczego wytwarzającego myśliwce w Indiach Wschodnich."
 INSHOL_develop_bombers: "Zaprojektowanie nowych bombowców"
 INSHOL_develop_bombers_desc: "Wyślemy batawiańskich inżynierów do Amsterdamu, aby osobiście zapoznali się z produkcją bombowców firmy Fokker i uzyskali dostęp do jej ściśle strzeżonych tajemnic produkcyjnych. Powrócą oni z wiedzą i doświadczeniem technicznym niezbędnymi do stworzenia nowoczesnego krajowego przemysłu lotniczego wytwarzającego bombowce w Indiach Wschodnich."
 INSHOL_bandung_aircraft_facility: "Zakłady lotnicze w Bandungu"
 INSHOL_bandung_aircraft_facility_desc: "Plany i tajemnice produkcyjne są co prawda przydatne, ale nie mają żadnej wartości, dopóki nie zbudujemy na ich podstawie samolotów. Otworzymy nowe zakłady lotnicze w Bandungu, aby zaspokoić bieżące potrzeby KHSPAIW."
 INSHOL_netherlands_indies_air_doctrine: "Holendersko-indyjska doktryna powietrzna"
 INSHOL_netherlands_indies_air_doctrine_desc: "Będziemy analizować siły powietrzne krajów borykających się z podobnymi wyzwaniami jak my, czerpiąc z ich ciężko zdobytych doświadczeń, aby stworzyć doktrynę dostosowaną do realiów Indii Wschodnich, unikając powtórzenia ich historycznych błędów."
 INSHOL_manado_military_academy: "Makasarska akademia wojskowa"
 INSHOL_manado_military_academy_desc: "Utworzenie akademii wojskowej poza Jawą znacznie złagodzi problem niedoboru kadr i umożliwi przeprowadzanie poboru na wschodnich wyspach. Miasto Makassar położone mniej więcej w środkowej części Indii Wschodnich jest do tego idealnym miejscem."
 INSHOL_infantry_training_in_borneo: "Szkolenie piechoty na Borneo"
 INSHOL_infantry_training_in_borneo_desc: "Indie Wschodnie charakteryzują się gęstymi dżunglami, urwistymi górami i surowym terenem. Nasi żołnierze stacjonujący głównie na Jawie są całkowicie nieprzygotowani do walki w takich warunkach. Musimy przeprowadzić szkolenia wojskowe poza Jawą w trudniejszych warunkach. Niewiele jest na świecie miejsc, które mogłyby równać się z dżunglami i górami Borneo, co czyni tę wyspę idealnym miejscem do szkolenia światowej klasy rangerów."
 INSHOL_knil_engineers: "Korpus Inżynieryjny"
 INSHOL_knil_engineers_desc: "Nie możemy skupiać wszystkich naszych wysiłków wyłącznie na piechocie i produkcji broni strzeleckiej; musimy pamiętać, że logistyka i łączność odgrywają kluczową rolę na polu bitwy. Powinniśmy szkolić inżynierów i finansować batawiańskie szkoły zawodowe, aby nasza armia nie była paraliżowana przez słabą logistykę."
 INSHOL_work_with_oil_barons: "Współpraca z potentatami naftowymi"
 INSHOL_work_with_oil_barons_desc: "Wielki kryzys doprowadził naszą gospodarkę opartą na eksporcie do opłakanego stanu. Być może nadszedł czas, aby rozważyć przekazanie części negocjacji handlowych w ręce potentatów naftowych z Sumatry, aby zagwarantować sprzedaż ropy. Będzie to jednak wiązało się z pewnymi kosztami, ponieważ w zamian za ich zgodę na ten układ będziemy musieli sprzedawać ropę po cenach znacznie niższych od rynkowych."
 INSHOL_rubber_taxation: "Opodatkowanie kauczuku"
 INSHOL_rubber_taxation_desc: "Holenderskie inwestycje i fachowa wiedza przekształciły plantacje kauczuku w Indiach Wschodnich w jeden z najcenniejszych aktywów imperium. To słuszne, że Korona domaga się należnej jej części bogactwa, które sama stworzyła. Choć niektórzy lokalni politycy protestują, interesy imperium nie mogą być podporządkowane prowincjonalnym niepokojom."
 INSHOL_padang_port: "Międzynarodowy port w Padangu"
 INSHOL_padang_port_desc: "Zanim towary produkowane w Padangu trafią na międzynarodowe rynki, muszą najpierw zostać przewiezione przez Jawę, ponieważ w regionie tym brakuje infrastruktury umożliwiającej obsługę dużych flot transportowych. Ten zbędny etap obciąża nasz łańcuch dostaw i ogranicza potencjał gospodarczy Sumatry. Dzięki budowie dużego portu towarowego w Padangu możemy wyeliminować ten dodatkowy krok, zwiększając tym samym rentowność plantacji w Padangu."
 INSHOL_subsidize_bauxite: "Wsparcie finansowe projektów boksytowych"
 INSHOL_subsidize_bauxite_desc: "Realizowany obecnie w Indiach projekt modernizacji bogatych w boksyt wysp Bangka i Belitung jest bardzo obiecujący, a szanse na związane z nim długoterminowe zyski są duże. Powinniśmy wesprzeć rząd Indii dotacjami gospodarczymi, aby przyspieszyć realizację tego projektu."
 INSHOL_agricultural_subsidies: "Prywatyzacja sektora rolnego"
 INSHOL_agricultural_subsidies_desc: "Jeśli zezwolimy na zakładanie prywatnych gospodarstw rolnych o różnej wielkości, możemy przyspieszyć rozwój infrastruktury w niedofinansowanych regionach wiejskich, jednocześnie zwiększając dochody rządowe. Aby to osiągnąć, stworzymy strukturę podatkową, w ramach której wszystkie dochody podatkowe generowane przez te gospodarstwa będą przekazywane bezpośrednio do Holandii bez pośrednictwa Indii Wschodnich."
 INSHOL_import_sugar: "Import cukru"
 INSHOL_import_sugar_desc: "Wprowadzimy kontrolę cen w rozwijającym się sektorze rolnym w Indiach Wschodnich, aby importować cały krajowy cukier z tamtejszych plantacji po cenach, którym nie dorówna żaden inny rząd, oraz ustanowimy państwowy monopol na cukier."
 INSHOL_import_lumber: "Import drewna"
 INSHOL_import_lumber_desc: "Wprowadzimy kontrolę cen w rozwijającym się sektorze rolnym w Indiach Wschodnich, aby importować całe krajowe drewno z tamtejszych plantacji po cenach, którym nie dorówna żaden inny rząd, oraz ustanowimy państwowy monopol na drewno."
 INSHOL_industrialized_colony: "Uprzemysłowiona kolonia"
 INS_no_peta_tt: "Indonezja nie będzie mogła współpracować z obcymi najeźdźcami."
 INSHOL_industrialized_colony_desc: "Indie Wschodnie, będące dawniej skromną kolonią, stały się jednym z najbardziej uprzemysłowionych i bogatych regionów w całej Azji. Jest to przełomowy moment w historii Holandii i całej ludzkości. Nasze wysiłki przyniosły efekty i będziemy nadal inwestować w rozwój naszej kolonii, aby ponownie uczynić Holandię światową potęgą."
 INSHOL_economic_integration: "Integracja gospodarcza"
 INSHOL_economic_integration_desc: "Holenderskie Indie Wschodnie są klejnotem w koronie naszego imperium, a ich dobrobyt jest zapewniony przez stabilne przywództwo królowej, premiera oraz gubernatora generalnego. Stabilności tej nie mogą zagrozić lekkomyślne nawoływania do niepodległości, która przyniosłaby jedynie chaos i upadek. Będziemy jeszcze ściślej integrować gospodarki Holandii i Indii Wschodnich, zapewniając im trwałą stabilność i pomyślność."
 INSHOL_republic_of_indonesia: "Republika Indonezji"
 INSHOL_republic_of_indonesia_desc: "Kiedy Holandia niechętnie zgodziła się na przyjęcie petycji Soetardjo, wynikające z niej przepisy prawne uzależniły uzyskanie niepodległości przez Indonezję od spełnienia długiej listy warunków, które miały potwierdzić jej samowystarczalność gospodarczą. Mimo to warunki te zostały obecnie w całości spełnione dzięki determinacji narodu indonezyjskiego, a Holandia nie ma innego wyjścia, jak tylko zaakceptować naszą formalną deklarację niepodległości."
 INSHOL_propose_malay_unification: "Propozycja malajskiego zjednoczenia"
 INSHOL_propose_malay_unification_desc: "Indonezja to archipelag będący domem dla setek kultur, języków i grup etnicznych. Niektóre z nich są do siebie podobne, inne zaś wyraźnie się od siebie różnią. Jednak dzięki wspólnej walce z kolonialnym jarzmem zjednoczyliśmy się w ramach jednego narodu - Indonezji. Być może powinniśmy zadać sobie pytanie, dlaczego ta jedność musi się kończyć właśnie tutaj, skoro po drugiej stronie cieśniny mieszkańcy Malajów mają niemal taką samą historię i aspiracje jak my?"
 INSHOL_singapore_compromise: "Singapurski kompromis"
 INSHOL_singapore_compromise_desc: "Singapur jest historycznie i kulturowo częścią Indonezji, więc oczywiste jest, że powinien zostać włączony do zjednoczonej Indonezji. Jednak Wielka Brytania nie chce zrezygnować z Singapuru ze względu na jego strategiczne znaczenie i konieczność utrzymania w nim bazy wojskowej. Powinniśmy zaproponować kompromis, w ramach którego Singapur przystąpi do unii pod warunkiem zachowania przez Wielką Brytanię prawa do utrzymania na wyspie swoich sił zbrojnych."
 INSHOL_request_ceylon: "Wniosek o przekazanie Cejlonu"
 INSHOL_request_ceylon_desc: "Brytyjska kolonia na Cejlonie ma głębokie więzi kulturowe i językowe z szeroko pojętym światem malajskim. W miarę rozwoju panmalajskiej federacji Mafilindo naturalnym jest, że również ta wyspa powinna znaleźć w niej dla siebie miejsce."
 INSHOL_papua_referendum: "Referendum w Papui"
 INSHOL_papua_referendum_desc: "Obecnie wyspa Papua jest podzielona między Indonezję i Australię. Dzięki naszym inwestycjom i działaniom na rzecz rozwoju nasza część wyspy stała się dynamicznie rozwijającym się i zamożnym regionem, podczas gdy terytorium administrowane przez Australię pozostaje zaniedbane i słabo rozwinięte. Przyszłość wyspy powinna leżeć w rękach jej mieszkańców, dlatego też musimy domagać się przeprowadzenia oficjalnego referendum w sprawie zjednoczenia Papui."
 INSHOL_invite_phillipines: "Propozycja utworzenia Mafilindo"
 INSHOL_invite_phillipines_desc: "Liczne ludy naszej unii posługują się różnymi językami i pielęgnują odmienne tradycje, jednak niemal wszystkie wywodzą się z malajskiego świata. Powinniśmy przekształcić naszą unię w panmalajską konfederację, zapraszając Filipiny do grona jej członków. To, co niegdyś było zbiorem kilku nieznaczących kolonii, stanie się potęgą regionalną Azji Południowo-Wschodniej."
 INS_focus_time_reduce_usa_tt: "§Y$INS_realign_supply_chains$§! skróci czas potrzebny dla tego celu o 70 dni."
 INS_focus_time_reduce_jap_tt: "§Y$INS_first_come_first_serve$§! skróci czas potrzebny dla tego celu o 70 dni."
 INS_focus_time_reduce_fokker_tt: "§Y$INSHOL_east_indies_fokker_division$§! skróci czas potrzebny dla tego celu o 35 dni."
 INS_focus_time_reduce_tjarda_tt: "§Y$INS_governor_general_tjarda$§! skróci czas potrzebny dla tego celu o 35 dni."
 INS_focus_time_reduce_pki_tt: "§Y$INS_utilize_tan_malakas_militia$§! skróci czas potrzebny dla tego celu o 35 dni."
