l_polish:
 INS_nationalize_companies_tt: "Wszystkie wojskowe organizacje i koncerny przemysłowe zostaną znacjonalizowane i otrzymają nową nazwę."
 available_focus_tt: "§GDostępne§! cele:\n"
 INS_is_union_tt: "Utworzono Unię Holendersko-Indonezyjską"
 INS_is_union_tt_NOT: "Nie utworzono Unii Holendersko-Indonezyjskiej"
 INS_denounce_soetardjo: "Potępienie Soetardjo"
 INS_denounce_soetardjo_tt: "Zaczniemy planować podziemną rewolucję, infiltrację rządu i ustanowienie komórek partyzanckich na archipelagu. Gdy się przygotujemy, rozpoczniemy wojnę partyzancką z Holendrami."
 INS_soetardjo_petition_debate_done_tt: "Debata Volksraadu nad petycją Soetardjo o autonomię dobiegła końca"
 INS_tkr_tt: "Modyfikuje §YLudową Armię Obronną§! o:"
 INS_commander_sudirman_tt: "§YSudirman§!([INS.GetFlag]) awansuje na §Ymarszałka polnego§!"
 INS_the_declaration_of_independence: "Deklaracja niepodległości"
 INS_the_declaration_of_independence_desc: "Nie możemy dłużej zwlekać, ryzykując. Musimy kuć żelazo, póki gorące! Należy wysłać nasze milicje, by zajęły porty, miasta i ośrodki przemysłowe na tyle szybko, by holenderskie władze nie zdążyły zareagować. Następnie ogłosimy niepodległość jako Republika Indonezji."
 INS_the_declaration_of_independence_tt: "Ogłosimy §Yniepodległość§!. Każdy region, w którym utworzyliśmy §Ybazę§! lub §Ykwaterę główną milicji§!, znajdzie się pod naszą kontrolą, a nad resztą władzę zachowa [HOL.GetNameDef].\n\n[HOL.GetNameDef] nie uzna naszej suwerenności i rozpocznie się konflikt o małym nasileniu, który może eskalować do §Rwojny§!.\n\nOdblokowuje najazdy lądowe w celu przejmowania regionów."
 INSHOL_the_declaration_of_independence: "Rewolucja narodowa"
 INS_laskar_rakjat: "Laskar Rakyat"
 INS_laskar_rakjat_desc: "Na rewolucję składa się aktywność wielu różnych małych i dużych milicji w całej Indonezji. Zorganizowanie ich jest kluczem do zwycięstwa. Lecz nie możemy się zbyt spieszyć, gdyż wzmacnianie milicji powiązanych z naszymi rywalami politycznymi może skończyć się katastrofą."
 INS_militia_tt: "Tworzy nowy szablon dywizji milicji §Ybojowników o wolność§! i odblokowuje decyzje o zarządzaniu nimi."
 INS_militia_warning_tt: "Milicje to §Yczęściowo autonomiczne§! grupy bojowników o wolność. Będą dla nas walczyć, lecz nie za darmo. W zamian oczekują wynagrodzenia za swoje starania. §RNiespełnienie ich wymagań drastycznie wpłynie na stabilizację!§!"
 INS_usa_tanks_opinion_mod: "Zakupiliśmy czołgi"
 INS_republic_add_generals_tt: "(§Y$INS_sudirman$§!([INS.GetFlag]), §Y$INS_soengkono$§!([INS.GetFlag]), §Y$INS_supriyadi$§!([INS.GetFlag]), §Y$INS_djatikoesoemo$§!([INS.GetFlag]), §Y$INS_maludin_simbolan$§!([INS.GetFlag])) zostają generałami."
 INS_big_militia_presence_tt: "Nasze milicje będą kontrolować ten region, gdy ogłosimy niepodległość."
 INS_prepare_raiding_bases: "Przygotowanie baz do najazdów"
 INS_prepare_raiding_bases_desc: "Wykorzystamy naszą siatkę szpiegów, aby potajemnie rozbudować sieć bunkrów na całym archipelagu, dzięki czemu będziemy gotowi do działania, gdy tylko wybuchnie rewolucja."
 # <Joint Tree - Central Milestones>
 INSHOL_dutch_east_indies: "Holenderskie Indie Wschodnie"
 INSHOL_dutch_east_indies_desc: "Ta kolonia powstała prawie 500 lat temu i przez ten czas wielokrotnie się przeobrażała. Świat szybko się zmienia, a nasze czyny zadecydują o holendersko-indonezyjskich relacjach w dalekiej przyszłości."
 INSHOL_the_war_in_europe: "Wojna w Europie"
 INSHOL_the_war_in_europe_desc: "Konflikt w Europie gwałtownie się wzmaga, a Holandia obecnie prowadzi wojnę. Nie możemy dłużej liczyć na jej ochronę i musimy bronić się samodzielnie, inaczej padniemy ofiarą zakusów obcych sił."
 # <Joint Tree - Military Equipment Contracts>
 INSHOL_military_equipment_contracts: "Kontrakty na wojskowe wyposażenie"
 INSHOL_military_equipment_contracts_desc: "Indie to rozległy archipelag zamieszkany przez dziesiątki milionów obywateli. Daleko nam do przemysłowego potencjału niezbędnego do samodzielnej obrony. Mamy jednak dość zasobów, by nawiązywać handel z partnerami z całego świata. Możemy rozwiązać ten problem, podpisując umowy z demokratycznymi państwami."
 INSHOL_hawk_75a7: "Hawk 75a-7"
 INSHOL_hawk_75a7_desc: "Amerykański myśliwiec Hawk 75A-7 to doskonały samolot dla Indii - tani i potężny. Możemy podpisać umowę z jego producentem, by dzięki temu dokonać koniecznych ulepszeń naszych sił powietrznych."
 INSHOL_purchase_american_tanks: "Zakup amerykańskich czołgów"
 INSHOL_purchase_american_tanks_desc: "Choć Indiom brakuje możliwości przemysłowych do produkcji czołgów, możemy kupić je bezpośrednio od Stanów Zjednoczonych za środki z indyjskiego przemysłu kauczukowego."
 INSHOL_purchase_british_artillery: "Zakup brytyjskiej artylerii"
 INSHOL_purchase_british_artillery_desc: "Produkcją artylerii może dla nas zająć się Zjednoczone Królestwo, co pozwoli nam skupić się na innych typach wyposażenia."
 INSHOL_produce_own_goods: "Produkcja własnych towarów"
 INSHOL_produce_own_goods_desc: "Choć na wyciągnięcie ręki mamy wiele dochodowych umów handlowych, nie wolno nam zapomnieć o własnych liniach montażowych i wojskowych firmach przemysłowych. Powinniśmy je dofinansować, by mniej polegać na zagranicznym imporcie."
 # <Joint Tree - East Indies Investments>
 INSHOL_east_indies_investments: "Inwestycje w Indiach Wschodnich"
 INSHOL_east_indies_investments_desc: "Dobry władca to taki, który inwestuje w rozwój swoich kolonii. Finansowanie gospodarczego wzrostu Indii leży w naszym interesie i jest korzystne dla obywateli tej kolonii."
 INSHOL_east_indies_student_exchange: "Programy wymiany studenckiej w Indiach Wschodnich"
 INSHOL_east_indies_student_exchange_desc: "Stworzenie systemu, dzięki któremu Indonezyjczycy będą mogli studiować na holenderskich uniwersytetach, może znacznie wzmocnić gospodarkę zarówno Holandii, jak i Indii."
 INSHOL_east_indies_fokker_division: "Utworzenie dywizji Fokkerów w Indiach Wschodnich"
 INSHOL_east_indies_fokker_division_desc: "Indyjskie siły powietrzne korzystają z licencji Fokkera w tak dużym zakresie, że warto rozważyć utworzenie specjalnej spółki zależnej skupionej na siłach powietrznych Indii."
 INSHOL_expand_shell: "Rozwój infrastruktury Shella"
 INSHOL_expand_shell_desc: "Shell stopniowo staje się coraz większą częścią naszej gospodarki. To oczywiste, że powinniśmy rozbudować infrastrukturę naftową w Indiach, by nadążyć za potencjałem eksportowym Shella."
 INSHOL_increase_funding_for_tix: "Zwiększenie finansowania projektu samolotu T.IX"
 INSHOL_increase_funding_for_tix_desc: "Inżynierowie Fokkera pracują nad nowym dwusilnikowym bombowcem, który ma zastąpić przestarzałe modele wykorzystywane przez indyjskie siły powietrzne. To bardzo słabo finansowany projekt, którego ukończenie potrwa pewnie bardzo długo. Możemy zwiększyć ten budżet i znacznie go przyspieszyć."
 INSHOL_reduce_land_ownership_taxes: "Obniżenie podatków od posiadania gruntów"
 INSHOL_reduce_land_ownership_taxes_desc: "Powinniśmy obniżyć podatek nakładany na indonezyjskich obywateli posiadających ziemię, by wspomóc rozwój gospodarstw i firm."
 INSHOL_coffee_plantations: "Plantacje kawy"
 INSHOL_coffee_plantations_desc: "Powinniśmy dążyć do zdobycia większej ilości państwowej ziemi na wschodnich wyspach, by móc zbudować tam plantacje kawy."
 INSHOL_overallwagen: "Overvalwagen"
 INSHOL_overallwagen_desc: "Czołgi niekoniecznie są najlepszym rozwiązaniem dla armii Indii Wschodnich. Brak nam siły przemysłowej do ich produkcji, a trudny teren znacznie ogranicza ich przydatność. Mogliśmy zamiast tego zainwestować w konstrukcję wozów pancernych dla Indonezji."
 INSHOL_indonesian_cheap_labor: "Indonezyjska tania siła robocza"
 INSHOL_indonesian_cheap_labor_desc: "$CONGO_cheap_labor_desc$" #LL: stealing this to save time, hope you don't mind!
 INSHOL_eastern_development_fund: "Fundusz rozwoju dla wschodnich wysp"
 INSHOL_eastern_development_fund_desc: "Za bardzo skupiamy się na inwestowaniu w Jawę i Sumatrę, ignorując przy tym większość terenów kolonii. Powinniśmy zaangażować się w rozwój infrastruktury na wschodzie, co pozwoli na dalszą industrializację."
 INSHOL_increase_rubber_taxes: "Zwiększenie podatku od kauczuku"
 INSHOL_increase_rubber_taxes_desc: "Wiele przedsiębiorstw kauczukowych w Indiach gromadzi duże zyski kosztem zasobów kolonii. To sprawiedliwe, abyśmy obłożyli tę działalność pokaźnym podatkiem."
 INSHOL_reform_knil: "Reforma KHAIW"
 INSHOL_reform_knil_desc: "Odkąd Indie Wschodnie z powodzeniem podbiły cały archipelag, Królewska Holenderska Armia Indii Wschodnich tkwi w bezruchu, cierpiąc poważne niedofinansowanie. Musimy jak najszybciej uzbroić Indie na nowo, gdyż napięcia na świecie rosną."
 INSHOL_fund_ml_knil: "Dofinansowanie KHSPAIW"
 INSHOL_fund_ml_knil_desc: "Jeśli chcemy nadążyć za innymi armiami świata, musimy stworzyć własne, porządne siły powietrze, w przeciwnym razie będziemy w mocno niekorzystnej sytuacji."
 INSHOL_bandung_aircraft_facility_tt: "§YJawa Zachodnia:§!\n    Dodaj §G1§! miejsce na budynki i §G1§! §Yfabrykę wojskową§! za każdy ukończony wstępny cel."
 INSHOL_rangers: "Rangerzy"
 INSHOL_rangers_desc: "Indie to rozległy archipelag o zróżnicowanym środowisku. Powinniśmy wyszkolić rangerów przystosowanych do walki w tych surowych warunkach, by móc bronić tych terenów."
 INSHOL_mountaineers: "Piechota górska"
 INSHOL_mountaineers_desc: "Powinniśmy wyszkolić piechotę górską przygotowaną do walki w surowych, górskich warunkach naszego archipelagu."
 INSHOL_elevate_elite_infantry: "Baza Speciale Troepen"
 INSHOL_elevate_elite_infantry_desc: "Nie możemy wiecznie polegać na strategiach wielkiej wojny. Musimy przystosować się do nowych technologii, by nie pozostać w tyle. Powinniśmy powołać do życia kilka elitarnych dywizji piechoty, które będą w stanie bronić terenu we wszystkich rodzajach środowiska."
 INSHOL_modernize_knil: "Modernizacja KHAIW"
 INSHOL_modernize_knil_desc: "Będziemy analizować nowe strategie i doktryny dla Armii Indii Wschodnich, by utrzymać przewagę nad przeciwnikiem."
 INSHOL_transfer_of_henri_winkelman: "Przeniesienie Henriego Winkelmana"
 INSHOL_transfer_of_henri_winkelman_desc: "Henri Winkelman przez wiele lat służył w KHAIW. Teraz znów jest tam potrzebny, więc powinniśmy zorganizować jego oficjalne przeniesienie do Indii Wschodnich."
 INSHOL_eastern_conscription: "Utworzenie korpusu pomocniczego"
 INSHOL_eastern_conscription_desc: "Na Jawie i Madurze istnieje kilka lokalnych korpusów pomocniczych kontrolowanych przez miejscowych monarchów. W tych ciężkich czasach moglibyśmy porozumieć się z tymi władcami, by oddziały te działały pod naszym dowództwem."
 INSHOL_establish_vk_knil: "Utworzenie Ochotniczego Korpusu Kobiet w KHAIW"
 INSHOL_establish_vk_knil_desc: "Utworzymy w KHAIW Ochotniczy Korpus Kobiet. Ich wsparcie będzie odgrywać istotną rolę w poprawie naszej logistyki i łączności."
 INSHOL_emergency_dockyard_construction: "Pilna budowa stoczni"
 INSHOL_emergency_dockyard_construction_desc: "Zagrożenie desantem morskim nie może być przez nas lekceważone. Obrona morska musi być naszym priorytetem."
 INSHOL_emergency_powers_gov_general: "Nadzwyczajne uprawnienia gubernatora generalnego"
 INSHOL_emergency_powers_gov_general_desc: "Trwająca wojna wymaga podejmowania trudnych decyzji bez zbędnej zwłoki, co nie jest możliwe, gdy wszystkie decyzje w Indiach Wschodnich muszą najpierw przejść przez holenderskie władze. [INS.GetLeader] powinien otrzymać nadzwyczajne uprawnienia, by podejmować działania bez żadnych opóźnień."
 INSHOL_emergency_naval_purchases: "Interwencyjne zakupy dla marynarki"
 INSHOL_emergency_naval_purchases_desc: "Nasze wybrzeża są zagrożone i niewystarczająco chronione. Czas jest tu na wagę złota. Musimy mieć silniejszą marynarkę albo czeka nas zagłada. Zadłużymy się, by zakupić okręty od prywatnych firm, i przekształcimy je w niszczyciele."
 INSHOL_east_indies_navy: "Marynarka Wojenna Indii Wschodnich"
 INSHOL_east_indies_navy_desc: "[INS.GetNameDefCap] jest krajem, który formalnie nie posiada własnej marynarki, przez co Holandia musi chronić tę kolonię. Wraz z narastającymi napięciami w Europie i Azji na dłuższą metę to się nie sprawdzi. Musimy poczynić pierwsze kroki w stronę utworzenia [INS.GetAdjective] marynarki."
 INSHOL_marines: "Piechota morska"
 INSHOL_marines_desc: "Powinniśmy utworzyć specjalny Indyjski Korpus Piechoty Morskiej w ramach nowej marynarki wojennej i wysłać rekrutów, by poznawali holenderskie okręty."
 INSHOL_domestic_ship_production: "Krajowa produkcja okrętów"
 INSHOL_domestic_ship_production_desc: "Jeżeli nasza marynarka wojenna ma odeprzeć naszych sąsiadów, musimy zacząć zwiększać krajową produkcję okrętów."
 INSHOL_destroyers: "Niszczyciele"
 INSHOL_destroyers_desc: "Nasze cięższe okręty wojenne nie mogą działać w ciasnych obszarach morskich archipelagu bez ochrony w postaci eskortowców. Wykorzystanie nowoczesnych niszczycieli pozwoli [ROOT.GetAdjective] marynarce strzec szlaków handlowych i odstraszać torpedowce operujące w cieśninach."
 INSHOL_cruisers: "Krążowniki"
 INSHOL_cruisers_desc: "Flota bez pancerników musi opierać się na krążownikach. Zbudowanie silnej eskadry krążowników da [ROOT.GetAdjective] marynarce jednostki zdolne do prowadzenia działań patrolowych na dalekich dystansach między wyspami oraz możliwość reagowania na pojawienie się na naszych wodach intruzów."
 INSHOL_submarines: "Okręty podwodne"
 INSHOL_submarines_desc: "Cieśniny Indii Wschodnich to idealne miejsce na zasadzkę, a okręt podwodny kosztuje o wiele mniej niż okręt wojenny, którego pośle na dno. Odpowiednie siły podwodne pozwolą [ROOT.GetAdjective] marynarce chronić szlaki handlowe oraz atakować wrogie transportowce, nie zdradzając przy tym swojej obecności."
 INSHOL_outsourced_navy: "Zlecenie produkcji korporacjom"
 INSHOL_outsourced_navy_desc: "Mamy już dostatecznie duże wydatki i nie możemy przeznaczyć na marynarkę wojenną jeszcze większych środków z budżetu kolonii. Możemy zapłacić korporacjom, by produkowały dla nas."
 INSHOL_divert_civilian_to_navy: "Przekierowanie środków z budżetu wojsk lądowych i cywilnego do marynarki wojennej."
 INSHOL_divert_civilian_to_navy_desc: "Obecna sytuacja na świecie powoduje, że ryzyko inwazji od strony morza jest większe niż kiedykolwiek. Nie możemy być oszczędni, musimy przekierować środki ze wszystkich sektorów rządowych na rzecz marynarki wojennej."
 INS_netherlands_can_remove_autonomy_tt_50: "\nJeśli [HOL.GetFlag]§Y[HOL.GetNameDefCap]§! ukończy najpierw ten cel:\n    ([INS.GetFlag]§Y[INS.GetName]§!): Dodanie §Y£autonomy_texticon -50,00§!"
 INS_netherlands_can_remove_autonomy_tt_75: "\nJeśli [HOL.GetFlag]§Y[HOL.GetNameDefCap]§! ukończy najpierw ten cel:\n    ([INS.GetFlag]§Y[INS.GetName]§!): Dodanie §Y£autonomy_texticon -75,00§!"
 INS_netherlands_can_remove_autonomy_tt_100: "\nJeśli [HOL.GetFlag]§Y[HOL.GetNameDefCap]§! ukończy najpierw ten cel:\n    ([INS.GetFlag]§Y[INS.GetName]§!): Dodanie §Y£autonomy_texticon -100,00§!"
 INS_netherlands_can_remove_autonomy_tt_150: "\nJeśli [HOL.GetFlag]§Y[HOL.GetNameDefCap]§! ukończy najpierw ten cel:\n    ([INS.GetFlag]§Y[INS.GetName]§!): Dodanie §Y£autonomy_texticon -150,00§!"
 INS_netherlands_can_remove_autonomy_tt_200: "\nJeśli [HOL.GetFlag]§Y[HOL.GetNameDefCap]§! ukończy najpierw ten cel:\n    ([INS.GetFlag]§Y[INS.GetName]§!): Dodanie §Y£autonomy_texticon -200,00§!"
 INS_netherlands_can_remove_autonomy_tt_250: "\nJeśli [HOL.GetFlag]§Y[HOL.GetNameDefCap]§! ukończy najpierw ten cel:\n    ([INS.GetFlag]§Y[INS.GetName]§!): Dodanie §Y£autonomy_texticon -250,00§!"
 INSHOL_begin_negotiations_soetardjo: "Rozpoczęcie negocjacji z Soetardjo"
 INSHOL_begin_negotiations_soetardjo_desc: "Petycja Soetardjo w sprawie autonomii wydaje się obiecująca, daje nam okazję do opracowania kompromisu między nacjonalistami i lojalistami. Powinniśmy rozpocząć formalne negocjacje z jego partią."
 INSHOL_urge_gov_veto: "Zachęcenie gubernatora do sprzeciwu"
 INSHOL_urge_gov_veto_desc: "Petycja Soetardjo jest nacjonalistycznym spiskiem, na który daje się nabrać rząd Indii Wschodnich. Musimy zachęcić gubernatora generalnego do natychmiastowego odrzucenia petycji, inaczej istnieje ryzyko utraty naszej kolonii."
 INSHOL_eventual_autonomy: "Zgoda na przyszłą autonomię"
 INSHOL_eventual_autonomy_desc: "Indonezyjskie pragnienie niepodległości jest silne i zdecydowanie nie słabnie. Zgodzimy się na przyszłą autonomię dla Indii Wschodnich, ale tylko pod warunkiem, jeśli udowodnią, że kolonia ta jest w stanie sama funkcjonować oraz że będzie nadal pielęgnować demokratyczne ideały."
 INSHOL_autonomous_dominion: "Petycja Soetardjo z roku [GetYear]"
 INSHOL_autonomous_dominion_desc: "Pomimo niedorzecznej definicji samowystarczalności, którą narzuciła nam Holandia jako warunek uznania warunków petycji Soetardjo, indonezyjskie pragnienie niepodległości okazało się dość silne, by spełnić te wymagania. Zgodnie z umową ogłosimy całkowitą i bezwarunkową niezależność od holenderskiej korony."
 INS_cannot_become_independent_tt: "§W§Y[INS.GetFlag][INS.GetNameDefCap]§!: §Rpozbawienie szansy na uzyskanie niepodległości§! bez obcej interwencji.§!"
 INSHOL_sideline_the_volksraad: "Marginalizacja Volksraadu"
 INSHOL_sideline_the_volksraad_desc: "Petycja Soetardjo stanowi jasne pogwałcenie artykułu 1 holenderskiej konstytucji i przysporzy jedynie trudności administracji Indii Wschodnich. Należy tę petycję odrzucić."
 INSHOL_prioritize_dutch_profits: "Priorytet na zyski Holandii"
 INSHOL_prioritize_dutch_profits_desc: "Skoncentrujemy wysiłki na zwiększaniu zysków dla naszej ojczyzny. Ich stabilność gospodarcza służy interesowi całego królestwa."
 INSHOL_development_loans_netherlands: "Pożyczki rozwojowe z Holandii"
 INSHOL_development_loans_netherlands_desc: "Żeby przyspieszyć proces industrializacji, możemy zaciągnąć pożyczki od holenderskich przedsiębiorstw. Choć wykorzystamy naszą pozycję rozwijającej się kolonii w celu uzyskania niższego oprocentowania, wciąż będziemy zmuszeni płacić odsetki."
 INSHOL_request_economic_dev_subsidy: "Prośba o dotacje na rozwój gospodarczy"
 INSHOL_request_economic_dev_subsidy_desc: "Udowodniliśmy naszemu władcy, że jesteśmy kolonią przynoszącą zyski. Możemy to wykorzystać, by otrzymać dotacje na rozwój przemysłowy."
 INSHOL_loyalty_to_crown: "Lojalność wobec korony"
 INSHOL_loyalty_to_crown_desc: "O Indiach Wschodnich można powiedzieć wiele rzeczy, ale nade wszystko jesteśmy lojalną kolonią holenderską. Królowa Wilhelmina poprowadzi nas ku zwycięstwu. Nie możemy pozwolić, by nacjonalizm zaprzepaścił niemal pięćsetletnią historię, toteż musimy wciąż podkreślać naszą całkowitą lojalność wobec korony."
 INS_loans_timer: "\nZa §Y365§! dni:"
 INS_expand_batavia_med_school_tt: "§Y$INS_dutch_east_indies$§!: modyfikator szybkości rozwoju wynosi co najmniej §G1,00%§!."
 INS_subsidize_local_business: "Dotacje dla miejscowych przedsiębiorstw"
 INS_subsidize_local_business_desc: "Powinniśmy przyznać dotacje miejscowym przedsiębiorstwom, aby pobudzić wzrost gospodarczy, wzmacniając przy tym naszą gospodarkę w dłuższej perspektywie."
 INSHOL_education_reforms: "Reformy edukacji"
 INSHOL_education_reforms_desc: "Wielu mieszkańców Indii Wschodnich nie ma możliwości zdobycia wykształcenia, a jedynie nieliczni zdołali ukończyć szkołę średnią. Jeśli chcemy, by kolonia ta stała się bogatym i uprzemysłowionym regionem, musimy zapewnić ogólnodostępną edukację dla całej populacji."
 INS_expand_batavia_med_school: "Rozwój szkoły medycznej w Batavii"
 INS_expand_batavia_med_school_desc: "Rozwój szkoły medycznej w Batavii poprzez postawienie nowych kampusów i zatrudnienie kolejnych profesorów spowoduje dalsze zwiększenie dostępności edukacji, co w dłuższej perspektywie jest kluczowe dla naszego wzrostu gospodarczego."
 INS_prepare_for_policy_shift: "Przygotowanie do zmiany polityki"
 INS_prepare_for_policy_shift_desc: "Duży wpływ na rzeczywistość polityczną w Indiach Wschodnich miało przebudzenie narodowe z ostatnich dekad, a nasza obecna polityka jest wyraźnie przestarzała. Powinniśmy rozważyć dokonanie pewnych zmian w strukturach władzy."
 INS_reallocate_rubber_industry_funding: "Przekierowanie funduszy z branży kauczukowej"
 INS_reallocate_rubber_industry_funding_desc: "Uzależnienie od sprzedaży gumy miało katastrofalny wpływ na naszą gospodarkę. Powinniśmy dokonać dywersyfikacji naszych gałęzi gospodarczych poprzez poszukiwanie zasobów oraz otwieranie nowych kopalni i fabryk na całym archipelagu. Nie będzie to tanie przedsięwzięcie, toteż musimy zredukować budżet na utrzymywanie plantacji kauczuku."
 INS_reallocate_rubber_industry_funding_tt: "Odblokowanie decyzji o §Yusunięciu kauczuku z regionu§! i zastąpieniu go mniejszą ilością §Yróżnych zasobów§!."
 INSHOL_nationalist_coallition: "Nacjonalistyczna koalicja"
 INSHOL_nationalist_coallition_desc: "Zbyt długo już Volksraad mówi jednym, i to zbyt cichym głosem. Czas na petycje i unikanie odpowiedzialności minął. Powstanie nacjonalistyczna koalicja, która odłoży spory na bok i zażąda bezwarunkowej niepodległości. Dawne głosy spoza sali obrad należące do ludzi, których Holandia uznała za pomyślnie wykluczonych z debaty, powrócą do naszego grona."
 INSHOL_volksraad_compromises: "Ugody w Volksraadzie"
 INSHOL_volksraad_compromises_desc: "Osiągnęliśmy tak wiele dzięki reformom i nie ma powodu, by porzucać nagle tę drogę. Volksraad będzie kontynuował ostrożną pracę wymiany ustępstw z Hagą i dążenia do samowładztwa poprzez cierpliwość, a nie rozłam. Przyszłość w obrębie holenderskiej wspólnoty narodów jest więcej warta niż walka o wystąpienie z niej."
 INSHOL_establish_the_princely_council: "Utworzenie Rady Książęcej"
 INSHOL_establish_the_princely_council_desc: "Żadna rada Batavii nie ma tak dużej władzy, jak sułtani i radżowie z archipelagu. Ich dwory są starsze niż sama kompania i republika, która istniała przed nią. Oficjalna rada książęcych rodów zapewni tym władcom miejsce w rządzie nowego państwa i połączy ich władzę z naszą."
 INSHOL_nationalize_dutch_companies: "Nacjonalizacja holenderskich przedsiębiorstw"
 INSHOL_nationalize_dutch_companies_desc: "Wielkie gildie handlowe, szlaki transportowe, plantacje i banki od niepamiętnych czasów należą do Holendrów. Od teraz zarządzać nimi będą Indonezyjczycy. Zmieni się skład rad nadzorczych, a kapitał, który od trzech stuleci trafiał za granicę, wreszcie znajdzie się w rękach wyspiarzy."
 INSHOL_democracy: "Demokratyczna Indonezja"
 INSHOL_democracy_desc: "Volksraad powstał jako półśrodek, organ doradczy o skrupulatnie ograniczonej władzy mający stwarzać pozory reprezentacji przy jednoczesnym braku realnego znaczenia. Lecz przerósł on zamierzenia twórców. Zostanie przemianowany na prawdziwy organ ustawodawczy, jego członkowie będą wybierani przez lud, który ten organ ma reprezentować, a jego decyzje będą wiążące wobec rządu, który niegdyś trzymał go na krótkiej smyczy."
 INSHOL_princely_authority: "Książęca władza"
 INSHOL_princely_authority_desc: "Rada doradcza to przydatna rzecz, lecz sułtani, którzy przyczynili się do powstania tego kraju, mogą być kimś znacznie więcej. Parlament nie będzie stawał na drodze tym, którzy są skłonni wynieść kogoś spośród swych szeregów na tron. Stare dwory od dawna czekają na zwrócenie się do nich z tą kwestią."
 INSHOL_encourage_further_investment: "Zachęcenie do dalszych inwestycji"
 INSHOL_encourage_further_investment_desc: "Porozumienie zawarte w Volksraadzie uspokoiło polityczne spory, co holenderska stolica zauważyła. Cła zostaną złagodzone, gwarancje przedłużone, a izby handlowe w Amsterdamie i Rotterdamie zapewnione, że archipelag wciąż jest otwarty na handel. Wszystkie umowy korzystne w ramach starego układu wciąż będą przynosić zyski."
 # <Joint Tree - ABDACOM>
 INSHOL_east_indies_artillery: "Produkcja artylerii w Indiach Wschodnich"
 INSHOL_east_indies_artillery_desc: "Otwarcie na Jawie zakładów produkujących artylerię pozwoli nam zmniejszyć uzależnienie naszych działań wojskowych od handlu zagranicznego."
 INSHOL_recall_gerardus_johannes_berenschot: "Odwołanie generała Berenschota"
 INSHOL_recall_gerardus_johannes_berenschot_desc: "Gerardus Johannes Berenschot jest jednym z najbardziej utalentowanych generałów wspólnoty. Większość swojej kariery wojskowej spędził w Indiach Wschodnich, lecz przez kilka lat stacjonował w Holandii. W tych ciężkich czasach musimy go wezwać z powrotem do Azji, by wspomóc działania wojenne."
 INSHOL_east_indies_cruiser_manufacturing: "Produkcja krążowników w Indiach Wschodnich"
 INSHOL_east_indies_cruiser_manufacturing_desc: "Produkcja własnych krążowników zamiast zamawiania ich bezpośrednio z Holandii jest pierwszym krokiem do utworzenia prawdziwej marynarki, co jest wysiłkiem koniecznym, biorąc pod uwagę zagrożenie ze strony Japonii."
 INSHOL_transfer_of_conrad_helfrich: "Przeniesienie Conrada Helfricha do Indii Wschodnich"
 INSHOL_transfer_of_conrad_helfrich_desc: "Przeniesienie admirała Conrada Helfricha wprost do Indii Wschodnich znacząco poprawi działania morskie w tym regionie."
 # <Joint Tree - Naval Program>
 INSHOL_naval_program: "Holendersko-indonezyjski program marynarki wojennej"
 INSHOL_naval_program_desc: "Marynarka Wojenna Indii Wschodnich pozostaje daleko w tyle za innymi siłami morskimi, nawet kolonialnymi. Stworzenie nowej marynarki wojennej leży w najlepszym interesie wszystkich partii, ponieważ umożliwi nam ona szybki rozwój."
 INSHOL_naval_program_transfer_25_tt: "Przeniesienie §Y25%§! naszej marynarki wojennej do: [INS.GetNameDef]."
 INSHOL_naval_program_transfer_25_2_tt: "§Y[HOL.GetFlag] [HOL.GetNameDefCap]§! przeniesie §Y25%§! swojej marynarki do: §Y[INS.GetNameDefCap]§!."
 INSHOL_naval_program_transfer_100_tt: "Przeniesienie §Rcałej naszej marynarki§! do: [INS.GetNameDef]."
 INSHOL_naval_program_transfer_100_2_tt: "§Y[HOL.GetFlag] [HOL.GetNameDefCap]§! przeniesie całą swoją marynarkę do: §Y[INS.GetNameDefCap]§!."
 INSHOL_naval_program_rejected_tt: "Odblokowanie celu narodowego: §Y$INSHOL_naval_secondchance$§!."
 INSHOL_hybrid_navy: "Marynarka hybrydowa"
 INSHOL_hybrid_navy_desc: "Nasza marynarka nie może polegać jedynie na przejęciu floty [HOL.GetAdjective] na Pacyfiku. Musimy rozpocząć produkcję naszych własnych okrętów, w przeciwnym razie jeden błąd może kosztować nas odcięcie od całości morskiego zaopatrzenia."
 INSHOL_request_naval_control: "Eskadra Indii Wschodnich"
 INSHOL_request_naval_control_desc: "Państwo [HOL.GetAdjective] upadło i nie jest w stanie dowodzić całą marynarką. Powinniśmy przejąć nad nią kontrolę do końca wojny."
 INSHOL_naval_secondchance: "Program morski Indii Wschodnich"
 INSHOL_naval_secondchance_desc: "Choć [HOL.GetNameDef] odmawia przekazania kontroli nad marynarką, wciąż musimy chronić wody Pacyfiku, jeśli nie chcemy zostać podbici. Jesteśmy zmuszeni opracować wystarczająco dobrą alternatywę, mimo że prawdopodobnie nie będzie ona tak skuteczna jak nasza odrzucona propozycja."
 # <Joint Tree - Netherlands in Exile>
 INSHOL_netherlands_in_exile: "Holandia na uchodźstwie"
 INSHOL_netherlands_in_exile_desc: "Tragiczny upadek naszego królestwa jest obecnie faktem. Nie możemy jednak ulegać defetyzmowi. Trzeba to zaakceptować i skupić się na tym, co da się jeszcze uratować."
 # INSHOL_relocate_prime_minister: "Relocate the Prime Minister to Java"
 INSHOL_relocate_our_generals: "Przeniesienie naszej armii na Jawę"
 INSHOL_relocate_our_generals_desc: "Generałowie, dowódcy i pozostali przy życiu żołnierze na uchodźstwie muszą natychmiast zostać przeniesieni do regionu [1058.GetName], nim będzie na to za późno."
 #INSHOL_relocate_our_soldiers: "Transfer Holdout Soldiers to Java"
 INSHOL_netherlands_indonesia_union: "Unia Holendersko-Indonezyjska"
 INSHOL_netherlands_indonesia_union_desc: "Pomysł unii, w której [HOL.GetNameDef] i [INS.GetNameDef] mają takie same prawa, jest dla wielu zabawny, lecz w obliczu kryzysu, w jakim się znaleźliśmy, daje on najwięcej szans na zachowanie suwerenności."
 # <Sukarno Shared Branch - Resistance Buildup>
 INS_underground_revolution: "Podziemna rewolucja"
 INS_underground_revolution_desc: "Zaczniemy planować rewolucję z ukrycia, powoli zwiększając liczbę członków i aktywność milicji, aż będziemy gotowi do uderzenia."
 INS_infiltrate_the_media: "Infiltracja mediów"
 INS_infiltrate_the_media_desc: "Nasz ruch zyskał kilku wysoko postawionych członków organizacji medialnych w Indiach Wschodnich. Możemy to wykorzystać, by delikatnie zasiać prorewolucyjne nastroje w umysłach obywateli."
 INS_infiltrate_the_army: "Infiltracja armii"
 INS_infiltrate_the_army_desc: "Wielu naszych członków jest częścią KHAIW, od szeregowych żołnierzy po majorów. Powinniśmy gromadzić jak najwięcej sekretów, umieszczając przy tym naszych ludzi na wysokich stanowiskach. Gdy wybuchnie rewolucja, będziemy mogli wywołać chaos w KHAIW."
 INS_privately_owned_military_industry: "Prywatny przemysł zbrojeniowy"
 INS_privately_owned_military_industry_desc: "Założymy kilka firm widmo w branży wojskowej, aby przejąć kontrolę nad całym przemysłem zbrojeniowym, gdy rozpocznie się rewolucja."
 INS_privately_owned_military_industry_tt: "Dodaj §G2§! §Yfabryki wojskowe§! w twoim sztabie"
 INS_instigate_chaos_sulawesi: "Wywołanie chaosu na Celebes"
 INS_instigate_chaos_sulawesi_desc: "Będziemy współpracować z lokalnymi nacjonalistami na Celebes, aby organizować strajki, rozruchy i radykalizować miejscową ludność."
 INS_instigate_chaos_sulawesi_tt: "Po ogłoszeniu niepodległości regiony §Y[673.GetName]§! oraz §Y[1056.GetName]§! staną się naszymi §Gregionami narodowymi§!. Przestaną one być regionami narodowymi Holenderskich Indii Wschodnich."
 INS_instigate_chaos_medan: "Wywołanie chaosu w Medan"
 INS_instigate_chaos_medan_desc: "Będziemy współpracować z lokalnymi nacjonalistami w Medanie i Riouw, aby organizować strajki, rozruchy i radykalizować miejscową ludność."
 INS_instigate_chaos_medan_tt: "Po ogłoszeniu niepodległości region §Y[1049.GetName]§! stanie się naszym §Gregionem narodowym§!. Przestanie on być regionem narodowym Holenderskich Indii Wschodnich."
 INS_embezzlement_scheme_in_batavia: "Spisek w Batavii"
 INS_embezzlement_scheme_in_batavia_desc: "Opracujemy spisek, aby po ogłoszeniu niepodległości przenieść produkcję z Batavii na terytorium republikańskie."
 INS_embezzlement_scheme_in_batavia_tt: "Po ogłoszeniu niepodległości połowa fabryk regionu §Y[1058.GetName]§! zostanie przeniesiona do naszej §Ykwatery głównej rewolucji§!."
 INS_volksraad_rumors: "Pogłoski w Volksraadzie"
 INS_volksraad_rumors_desc: "Rozpoczniemy dyskretne rozmowy na temat rewolucji w Volksraadzie. Jeśli nam się powiedzie, będziemy w stanie przekonać członków indonezyjskiego Volksraadu, by do nas dołączyli."
 INS_volksraad_rumors_tt: "Po ogłoszeniu niepodległości wszyscy doradcy z §Yindonezyjskiego§! Volksraadu §Gpozostaną§! na swoich stanowiskach."
 INS_railway_youth_force: "Współpraca z młodzieżowymi bojówkami kolejowymi"
 INS_railway_youth_force_desc: "Młodzieżowe bojówki kolejowe to islamska grupa młodzieżowa działająca głównie w Jawie Środkowej, nazwana tak z racji ich strategii przejmowania linii kolejowych. Byliby oni cennym sojusznikiem, jednak są mocno aktywni i chętni do walki. Nie będą zadowoleni z rządu, jeśli zawieszenie broni będzie trwać zbyt długo."
 INS_sleeper_informant_network: "[GetInformantNetworkName]"
 INS_Sleeper_Informant_Network_name: "Sieć tajnych informatorów"
 INS_KNIL_Informant_Network_name: "Sieć informatorów KHAIW"
 INS_sleeper_informant_network_desc: "Stworzymy sieć informatorów osadzoną w strukturze administracyjnej KHAIW, która będzie ostrzegać nas o planach wroga."
 INS_sleeper_informant_network_tt: "§RPo ogłoszeniu niepodległości:§!\n"
 # <Sukarno Shared Branch - Peoples Security Army>
 INS_the_peoples_security_army: "Ludowa Armia Obronna"
 INS_the_peoples_security_army_desc: "Nasi członkowie, głównie młodzi Indonezyjczycy, są coraz bardziej zniecierpliwieni i palą się do działania oraz do walki o naszą niepodległość. Powinniśmy utworzyć rewolucyjne siły zbrojne i rozpocząć szkolenie naszych przyszłych żołnierzy."
 INS_commander_sudirman: "Armia Sudirmana"
 INS_commander_sudirman_desc: "Mimo swojego młodego wieku Sudirman wykazuje się ogromnym potencjałem oraz jest wielce popularny wśród młodych członków ruchu oporu. Powinien on przewodzić Ludowej Armii Obronnej i poprowadzić nas do zwycięstwa."
 INS_commander_oerip: "Armia Oeripa"
 INS_commander_oerip_desc: "Oerip służył w armii przez wiele lat i jest jedynym Indonezyjczykiem w KHAIW, który kiedykolwiek otrzymał awans na stopień majora. Jego wiedza i doświadczenie są znacząco większe niż u innych członków. Powinien on przewodzić Ludowej Armii Obronnej i poprowadzić nas do zwycięstwa."
 INS_sudirmans_promotion: "Awans Sudirmana"
 INS_sudirmans_promotion_desc: "Sudirman wykazał się wspaniałym przywództwem i przeprowadził kilka udanych ataków. Czas, byśmy docenili tego dowódcę, nadając mu zasłużony tytuł generała."
 INS_tkr_steal_general: "Przejęcie generałów KHAIW"
 INS_tkr_steal_general_desc: "Jeśli przekonamy wysoko postawionych członków Armii Indii Wschodnich do wsparcia naszej sprawy, jednocześnie wzmocnimy swoją armię oraz osłabimy ich."
 INS_tkr_supply: "Każdy rewolucjonista musi podjąć walkę"
 INS_tkr_supply_desc: "Dopilnujemy, by każdy członek naszego ruchu, bez żadnych wyjątków, otrzymał formalne przeszkolenie wojskowe."
 INS_tkr_professional_army: "Armia zawodowa"
 INS_tkr_professional_army_desc: "Nie możemy polegać jedynie na bojówkach. Powinniśmy utworzyć zawodową armię republikańską, aby utrzymać porządek."
 INS_arm_the_revolutionaries: "Uzbrojenie rewolucjonistów"
 INS_arm_the_revolutionaries_desc: "Musimy zacząć od rewolucjonistów i nacjonalistów, którzy gotowi są poświęcić swoje życia dla Indonezji. Zapewnimy im przeszkolenie oraz sprzęt, których potrzebują, by walczyć za swój kraj."
 INS_arm_the_youth: "Uzbrojenie młodych"
 INS_arm_the_youth_desc: "Oprócz rewolucjonistów musimy również uzbroić młodzież, bo to oni, wciąż pełni energii i nadziei, poniosą płomień rewolucji. Powinniśmy dopilnować, by jak najwięcej młodych Indonezyjczyków zostało przeszkolonych i wyposażonych do przyszłej walki. Jeśli walka dotrze do ich domów, będą gotowi do działania."
 INS_arm_the_students: "Uzbrojenie studentów"
 INS_arm_the_students_desc: "Wiele lat temu to studenci położyli podwaliny pod rewolucję i będą jej również przewodzić w przyszłości."
 INS_guerilla_industry: "Przemysł dla sił partyzanckich"
 INS_guerilla_industry_desc: "Wykorzystamy nasze siły partyzanckie na całym archipelagu, by przejąć kontrolę nad fabrykami, co pozwoli na produkcję nowej broni dla naszych bojówek."
 INS_indonesian_assault_doctrine: "Indonezyjska doktryna uderzeniowa"
 INS_indonesian_assault_doctrine_desc: "Nie tylko żołnierze są częścią wojny. Miliony mężczyzn nie znaczą nic, jeśli nie dzierżą broni, którą mogliby walczyć. Naszym priorytetem musi stać się zdobycie wysokiej jakości artylerii, by móc przedrzeć się głębiej na terytorium wroga."
 INS_tighter_tkr_integration: "Ściślejsza integracja sił TKR i Laskar"
 INS_tighter_tkr_integration_desc: "Ludowa Armia Obronna oraz różne bojówki nie współpracują ze sobą, a koordynacja działań jest ograniczona. Im dłużej będzie trwała wojna, tym więcej problemów będzie to powodować, dlatego też musimy przekształcić siły zbrojne i milicje w jednolitą organizację, mimo nieuchronnych protestów ze strony oficerów milicji."
 INS_quality_over_quantity: "Jakość ważniejsza niż ilość"
 INS_quality_over_quantity_desc: "Jeden właściwie przeszkolony żołnierz o przemyślanej strategii i nowoczesnym wyposażeniu pokona pięciu studentów z pistoletami. Naszym priorytetem muszą być porządnie przeszkoleni i uzbrojeni żołnierze oraz siły specjalne, a nie rekrutacja jak największej liczby żołnierzy."
 INS_add_militia_cap_1_tt: "Limit dywizji §Ybojowników o wolność§! zwiększa się o §Y1§!.\n"
 INS_add_militia_cap_2_tt: "Limit dywizji §Ybojowników o wolność§! zwiększa się o §Y2§!.\n"
 INS_add_militia_cap_3_tt: "Limit dywizji §Ybojowników o wolność§! zwiększa się o §Y3§!.\n"
 INS_add_3_militia_unit_tt: "Stwórz trzy jednostki §Ybojowników o wolność§!, których można użyć do §Ynajazdów§! i zwiększenia §Gobecności milicji§! w holenderskich regionach."
 INS_add_fully_trained_militia_unit_tt: "Stwórz wyszkoloną jednostkę §Ybojowników o wolność§!.\n"
 # <Sukarno Shared Branch - Expand Resistance Membership>
 INS_expand_resistance_membership: "Zwiększenie liczby członków ruchu oporu"
 INS_expand_resistance_membership_desc: "Skoncentrowanie całego naszego ruchu w jednym miejscu to prosta droga do porażki. Sformujemy z naszych członków grupy milicji i skierujemy je do różnych regionów, by zwiększyć w nich naszą popularność oraz kontrolę."
 # <Central Independence Branch - Militias>
 INS_deploy_the_kris: "Indonezyjska Służba Ludowa na Celebes"
 INS_deploy_the_kris_desc: "Indonezyjska Służba Ludowa na Celebes, w języku indonezyjskim znana jako KRIS, to aktywnie działająca grupa milicji stanowiąca większość obecności milicji na Celebes oraz Manado. Powinniśmy ich zwerbować, by oficjalnie walczyli u boku TKR."
 INS_assist_the_pemuda: "Pomoc dla pemuda"
 INS_assist_the_pemuda_desc: "Na Jawie działa wiele bojówek pemuda. Dzięki połączeniu naszych sił i zapewnieniu pomocy wojskowej w ich walce przeciwko Holendrom możemy zyskać wartościowego sojusznika."
 INS_mobilize_the_pemuda: "Mobilizacja pemuda"
 INS_mobilize_the_pemuda_desc: "Zdobyliśmy już zaufanie największych grup pemuda, więc powinniśmy wdrożyć plany zwerbowania ich do TKR."
 INS_organize_jakarta_pemuda: "Zrzeszenie pemuda z Dżakarty"
 INS_organize_jakarta_pemuda_desc: "Na Jawie działa wiele grup pemuda różnych wielkości. Choć zmobilizowaliśmy i zwerbowaliśmy większość z nich, nadal mnóstwo niewielkich grup w Dżakarcie działa niezależnie. Musimy się z nimi skontaktować i nawiązać współpracę."
 INS_recognize_moestopos_batallion: "Uznanie dla batalionu Moestopo"
 INS_recognize_moestopos_batallion_desc: "Rewolucjonista znany jako Moestopo ogłosił siebie pełniącym obowiązki ministra obrony w Surabai, utrzymując kontrolę nad siłami milicji w tym mieście. Jego działania zasługują na formalne uznanie, powinniśmy oficjalnie awansować go na generała majora TKR."
 INS_darul_islam_focus: "Darul Islam"
 INS_darul_islam_focus_desc: "Hizbullah Kartosoewirjo sprawdził się w górach Jawy Zachodniej i nie możemy sobie pozwolić na to, by tacy bojownicy pozostali poza naszymi szeregami. Niech jego partyzanci staną po naszej stronie, a sam Kartosoewirjo niech otrzyma stopień, na który zasłużył. Wierni już wkrótce upomną się o swoje prawa w republice."
 # <Central Independence Branch - Navy>
 INS_just_a_fisherman: "Zwyczajni rybacy"
 INS_just_a_fisherman_desc: "Prowadzenie działań wojennych na archipelagu bez posiadania własnej marynarki jest trudnym zadaniem i nie możemy go zbyt długo kontynuować. Spróbujemy dość prostej strategii, tzn. wyślemy do holenderskich portów łodzie rybackie z milicją w przebraniu rybaków."
 INS_a_cheap_navy: "Tania marynarka"
 INS_a_cheap_navy_desc: "Nie mamy czasu ani pieniędzy na wybudowanie wielkiej i nowoczesnej marynarki. Musimy zadowolić się tym, co mamy, i poskładać wszystko to, co się da."
 INS_divert_army_funds_to_navy: "Przekierowanie środków na armię do marynarki wojennej"
 INS_divert_army_funds_to_navy_desc: "Indonezja jest archipelagiem, toteż nasza piechota nie znaczy nic bez okrętów, którymi można transportować żołnierzy. Warto więc przekierować środki z TKR do wykorzystania przez naszą nową marynarkę."
 INS_indonesian_naval_doctrine: "Indonezyjska doktryna morska"
 INS_indonesian_naval_doctrine_desc: "Skoro budujemy już własną marynarkę, powinniśmy rozważyć ustanowienie doktryny, zgodnie z którą będziemy walczyć i trenować. Naszym priorytetem powinno być jak najszybsze opracowanie i przyjęcie doktryny morskiej."
 INS_domestic_shipbuilding: "Rodzime stocznie"
 INS_domestic_shipbuilding_desc: "Nie możemy wiecznie polegać na przechwyconych i zakupionych okrętach, a wkrótce nie będzie też już żadnych holenderskich maszyn do przejęcia. Powinniśmy jak najszybciej zacząć budować nasze własne jednostki."
 INS_acquire_modern_blueprints: "Pozyskanie nowoczesnych schematów"
 INS_acquire_modern_blueprints_desc: "Zakupimy schematy od innych krajów i prywatnych firm, po czym użyjemy ich do konstrukcji własnej, nowej marynarki."
 INS_reclaiming_the_dutch_navy: "Przejęcie marynarki Holenderskich Indii Wschodnich"
 INS_reclaiming_the_dutch_navy_desc: "Holendrzy pozostawili wiele okrętów stacjonujących w zajętych obecnie przez nas portach. Skoro mamy taką szansę, powinniśmy przejąć te jednostki."
 INS_admiral_mas_pardi: "Admirał Mas Pardi"
 INS_admiral_mas_pardi_desc: "Każda dobra marynarka potrzebuje admirała, który by nią dowodził. Mas Pardi jest oczywistym wyborem."
 INS_akademi_angkatan_laut: "Wybudowanie Akademii Angkatan Laut"
 INS_akademi_angkatan_laut_desc: "Wybudujemy akademię marynarki wojennej wraz z placówkami badawczymi, dzięki czemu wyszkolimy więcej obywateli na przyszłych inżynierów i admirałów."
 # <Central Independence Branch - Militia Logistics>
 INS_pki_militia_tt: "Tan Malaka kontroluje potężne siły milicji, jednak walczą one nie tylko o dobro Indonezji, ale także w imieniu §Rkomunizmu§! i Sowietów. §RKoniec końców wystąpią oni zbrojnie przeciwko każdemu niekomunistycznemu rządowi.§!"
 INS_increase_laskar_funding_tt: "§WZyskaj§! 1§Y fabrykę wojskową§! za każde spełnione żądanie milicji (maksymalnie §G6§!)"
 INS_subsidize_laskar_armament: "Dofinansowanie uzbrojenia milicji Laskar"
 INS_subsidize_laskar_armament_desc: "Milicje walczące bambusowymi włóczniami nie przetrwają zbyt długo w starciu z ciężko uzbrojonymi jednostkami. Naszym priorytetem musi być zwiększenie produkcji broni i amunicji dla tych milicji."
 INS_loot_knil_weapons_caches: "Złupienie składów broni KHAIW"
 INS_loot_knil_weapons_caches_desc: "Istnieje sporo składów broni, z których KHAIW korzystało przed rewolucją. Wielu naszych członków to byli żołnierze KHAIW, więc możliwe, że będziemy w stanie znaleźć i splądrować te magazyny."
 INS_utilize_tan_malakas_militia: "Wykorzystanie milicji Tan Malaki"
 INS_utilize_tan_malakas_militia_desc: "Czerwona milicja Tan Malaki jest prawdopodobnie najsilniejszą pojedynczą formacją tego typu w całej Indonezji, więc zwerbowanie ich do TKR byłoby ogromną korzyścią. Jeśli jednak tak potężna milicja kierująca się pobudkami politycznymi zyska tak szerokie wpływy, istnieje ryzyko, że wykorzysta je ona do przejęcia władzy dla siebie."
 INS_increase_laskar_funding: "Zwiększenie finansowania milicji Laskar"
 INS_increase_laskar_funding_desc: "Milicje są trzonem naszych sił. Musimy to uznać i odpowiednio je finansować, nawet jeśli [INS.GetLeader] nie cieszy się stuprocentową lojalnością."
 INS_develop_a_functioning_airforce: "Zbudowanie właściwych sił powietrznych"
 INS_develop_a_functioning_airforce_desc: "Siły powietrzne mają ogromny wpływ na armię, toteż naszym priorytetem powinno być ich zbudowanie."
 # <Vice Presidential Edict - Intro>
 INS_political_stabilization: "Przywrócenie porządku"
 INS_political_stabilization_desc: "Nasze państwo jest z każdym dniem coraz bardziej niestabilne. Jeśli szybko nie zareagujemy, wojna domowa jest niemal pewna. Aby znaleźć rozwiązanie, musimy rozpocząć negocjacje między Komitetem Narodowym, prezydentem i liderami milicji."
 INS_vice_presidential_edict: "Podpisanie 10. dekretu wiceprezydenta"
 INS_vice_presidential_edict_desc: "Komitet Narodowy niemalże jednomyślnie domaga się prawdziwej władzy ustawodawczej. Petycja przekazana na ręce prezydenta proponuje system hybrydowy, w którym to Komitet Narodowy staje się niezależnym parlamentem, dzieląc wspólną władzę ustawodawczą z prezydentem. Oferta jest kusząca, lecz istnieje ryzyko, że władza prezydenta mocno straci na znaczeniu."
 INS_local_cooperatives: "Ustanowienie lokalnych spółdzielni"
 INS_local_cooperatives_desc: "Nie powinniśmy tworzyć takiego systemu kapitalistycznego, jaki jest na Zachodzie, lecz nie powinniśmy też lekceważyć korzyści gospodarczych płynących z prywatyzacji. Pozwolimy na tworzenie lokalnych spółdzielni, gdzie odnoszone sukcesy zapewnią bogactwo ich właścicielom. Będą one jednak nadzorowane przez władze, a rozszerzenie działalności poza swoją okolicę będzie zakazane."
 INS_local_unity: "Częściowo autonomiczne księstwo"
 INS_local_unity_desc: "Udzielimy księstwom-państwom częściowej autonomii w ramach środka tymczasowego ograniczającego konflikty wewnętrzne w tych trudnych czasach."
 INS_education_subsidies: "Subsydia edukacyjne"
 INS_education_subsidies_desc: "Inwestycja w przyszłość młodzieży jest absolutnie konieczna, jeśli chcemy być krajem odnoszącym sukcesy gospodarcze. Zbudujemy przystępne szkoły na terenie całej republiki."
 INS_land_reform: "Reforma ziemi"
 INS_land_reform_desc: "Przed ogłoszeniem naszej niepodległości Holandia bezpośrednio posiadała ogromne połacie ziemi. Powinniśmy rozdzielić je wśród wszystkich Indonezyjczyków, którzy za niewielką opłatą będą mogli z nich korzystać, pobudzając przy tym wzrost gospodarczy."
 INS_dominion_of_atjeh: "Dominium Aceh"
 INS_dominion_of_atjeh_desc: "Ruch separatystyczny w Aceh jest spory oraz zyskuje na sile. Nie ma sensu zaostrzać sytuacji, zamiast tego powinniśmy wynegocjować kompromis, w którym region ten pozostanie indonezyjski, lecz zyska spora autonomię."
 # <Vice Presidential Edict - Presidential Balance>
 INS_dissolve_national_party: "Rozwiązanie Partii Narodowej"
 INS_dissolve_national_party_desc: "System hybrydowy był potrzebnym kompromisem, by uniknąć chaosu. Nie możemy pozwolić prezydentowi na niedemokratyczne posiadanie tak dużej władzy. Musi on zostać usunięty z urzędu przez parlament, bo inaczej nigdy nie osiągniemy demokracji."
 INS_womens_sufferage: "Emancypacja kobiet"
 INS_womens_sufferage_desc: "Nadanie praw wyborczych kobietom doprowadzi w krótkim okresie do destabilizacji, lecz jest potrzebne, by w przyszłości osiągnąć stabilizację i demokrację."
 INS_women_in_military: "Kobiety w wojsku"
 INS_women_in_military_desc: "Musimy pozwolić kobietom na służbę w wojsku, aby nasze siły zbrojne stały się tak potężne, jak to tylko możliwe."
 INS_fair_election: "Uczciwe wybory"
 INS_fair_election_desc: "Po usunięciu prezydenta z urzędu i zakończonej rewolucji możemy wreszcie zorganizować nasze pierwsze uczciwe wybory, bez autorytarnych wpływów."
 # < Hybrid Politics >
 INS_continue_hybrid_politics: "Kontynuacja hybrydowej polityki"
 INS_continue_hybrid_politics_desc: "Hybrydowa polityka to zło konieczne. Choć ostatecznym celem jest prawdziwa demokracja, Indonezja jest zbyt młodym i niestabilnym państwem, by cała władza została przekazana w ręce ludu. Prezydent i parlament będą nadal siebie nawzajem kontrolować, aby żadne z tych ciał nie stało się zbyt potężne."
 INS_guided_economy: "Gospodarka sterowana"
 INS_guided_economy_desc: "Będziemy bezpośrednio nadzorować gospodarkę Indonezji, aby zachować kontrolę. Znacjonalizujemy wszystkie banki oraz sektory ropy naftowej i rolnictwa."
 INS_reform_education_system: "Obowiązkowa edukacja ideologiczna"
 INS_reform_education_system_desc: "Rewolucja dowiodła, że niezadowolenie studentów i młodych z porządku społecznego zawsze prowadzi do buntu. Dla bezpieczeństwa naszego rządu i narodu wprowadzimy w szkołach obowiązek nauki zgodny z rządową ideologią."
 INS_reform_education_system_2: "Reforma edukacji"
 INS_reform_education_system_2_desc: "Jeśli chcemy, by Indonezja stała się w przyszłości bogatym państwem, wszyscy obywatele, bez względu na miejsce urodzenia, muszą mieć zapewniony dostęp do powszechnej edukacji."
 INS_three_year_plan: "Plan trzyletni"
 INS_three_year_plan_desc: "Możemy opracować plan trzyletni, aby zbudować potrzebną infrastrukturę na całym archipelagu i połączyć ze sobą wyspy."
 INS_destroy_pacific_colonialism: "Zniszczyć kolonializm w regionie Pacyfiku"
 INS_destroy_pacific_colonialism_desc: "Choć rewolucja dobiegła końca, walka jeszcze się nie zakończyła. Wciąż wielu ludzi tuż obok nas żyje pod butem kolonialnych tyranów. Nie możemy bezczynnie stać i patrzeć, musimy podjąć działania, by wyzwolić ich spod tego jarzma!"
 INS_rapid_mobilization: "Szybka mobilizacja"
 INS_rapid_mobilization_desc: "Każdy potężny kraj posiada silną armię, na której może polegać. Jeśli chcemy stać się mocarstwem regionalnym zdolnym do samodzielnej obrony, musimy uczynić naszą armię dużo silniejszą, niż jest obecnie."
 INS_greater_indonesia: "Ogłoszenie powstania Wielkiej Indonezji"
 INS_greater_indonesia_desc: "Starożytne imperium Nusantary jednoczyło niegdyś wszystkie ludy malajskiego świata jako jeden naród. Po wyzwoleniu Malajów spod kolonialnego buta powinniśmy zrobić to samo co nasi przodkowie i ogłosić cały malajski świat jednym narodem."
 # < State Religion >
 INS_secularism: "Sekularyzm"
 INS_secularism_desc: "Indonezja jest domem dla wielu ludzi i religii. Mieszanie polityki i religii zawsze prowadzi do konfliktów wewnętrznych, dlatego też powinniśmy zakazać religijnych partii politycznych."
 INS_integrate_sarekat_islam: "Uwzględnienie partii Sarekat Islam"
 INS_integrate_sarekat_islam_desc: "Duże islamskie partie polityczne cieszą się dużym poparciem. W naszym najlepszym interesie jest włączenie ich członków do rządu."
 # <Vice Presidential Edict - Sjahrir>
 INS_sjahrirs_continued_tenure: "Kolejna kadencja dla Sjahrira"
 INS_sjahrirs_continued_tenure_desc: "Premier Sjahrir okazał się wielkim przywódcą, gdy prowadził nas przez rewolucję, wzmacniał naszą gospodarkę i ustanowił demokrację. Powinniśmy go ponownie wybrać na premiera."
 INS_unity_in_diversity: "Jedność w różnorodności"
 INS_unity_in_diversity_desc: "Przez całe wieki słowa \"jedność w różnorodności\" oddawały ducha naszego archipelagu. W trakcie rewolucji idea ta stała się okrzykiem bojowym i przypominała Indonezyjczykom, że pomimo wielu języków i tradycji, stoimy ramię w ramię jako jeden naród. Musimy te słowa wpisać do naszej konstytucji, aby zachować naszą jedność dla przyszłych pokoleń."
 INS_the_timor_issue: "[INS_timor_issue_scripted_name]"
 INS_timor_issue_scripted_name_issue: "Kwestia Timoru"
 INS_timor_issue_scripted_name_attack: "Atak na Timor Wschodni"
 INS_the_timor_issue_desc: "[INS_timor_issue_scripted_desc]"
 INS_timor_issue_scripted_desc_issue: "Timor Wschodni to bez wątpienia prawowite terytorium Indonezji, lecz mimo faktu, że rewolucja dobiegła końca, region ten wciąż znajduje się pod kolonialnym jarzmem. [721.OWNER.GetName] otrzyma od nas ultimatum, w którym będziemy domagać się natychmiastowego przekazania Timoru Wschodniego."
 INS_timor_issue_scripted_desc_attack: "Timor Wschodni to oczywiście prawowite terytorium Indonezji. Buntownicy na wyspie mogą twierdzić, że jest ona niepodległa, ale nie wypowiadają się w imieniu całej populacji. Należy zintegrować z republiką to, co zostało z portugalskiego kolonializmu."
 INS_pledge_to_allies: "Obietnica dla sojuszników"
 INS_pledge_to_allies_desc: "W ramach narastającego konfliktu światowego istnieje zagrożenie, że zostaniemy zaatakowani. Choć nasze stosunki z sojusznikami bywają trudne, staliśmy się demokratyczną potęgą w regionie Pacyfiku i powinniśmy sprzymierzyć się z demokratycznymi supermocarstwami."
 INS_mixed_economy_system: "System gospodarki mieszanej"
 INS_mixed_economy_system_desc: "Indonezja jest krajem wyjątkowym i nie będzie się właściwie rozwijać w tradycyjnych warunkach kapitalizmu czy komunizmu. Powinniśmy opracować system gospodarki mieszanej zawierającej elementy obu tych systemów."
 INS_social_democracy: "Socjaldemokracja"
 INS_social_democracy_desc: "Odkąd wdrożono politykę gospodarczą stworzoną przez Sjahrira, [INS.GetAdjective] gospodarka dynamicznie się rozwinęła. Powinniśmy ogłosić Indonezję państwem w pełni socjaldemokratycznym i opracować przyszłą politykę gospodarczą opartą na socjaldemokratycznych zasadach."
 # <Vice Presidential Edict - Sjarifuddin>
 INS_prime_minister_sjarifuddin: "Premier Sjarifuddin"
 INS_prime_minister_sjarifuddin_desc: "Sjarifuddin to najlepszy kandydat dla indonezyjskiego państwa. Jego umiarkowane poglądy pozwalają na kompromis między komunistami a socjalistami."
 INS_concessions_to_communists: "Ustępstwa wobec komunistów"
 INS_concessions_to_communists_desc: "PKI jest znaczącą siłą w parlamencie. W celu zapewnienia stabilizacji powinniśmy przyznać przywódcom PKI kilka stanowisk ministerialnych."
 INS_sjarifuddin_focus_2: "Samodzielnie zarządzana gospodarka eksportowa"
 INS_sjarifuddin_focus_2_desc: "Jednym z pierwszych naszych kroków po zdobyciu niepodległości powinna być reorganizacja naszej gospodarki, aby nie przynosiła więcej zysków Holendrom. Choć system oparty na eksporcie wciąż jest niebezpieczny, możemy sprawić, by stał się dużo bardziej niezawodny."
 # <Vice Presidential Edict - Hatta>
 INS_prime_minister_hatta: "Premier Hatta"
 INS_prime_minister_hatta_desc: "Mohammad Hatta, znany też jako proklamator rewolucji, pełni urząd wiceprezydenta Sukarno i bardziej niż on skłania się ku demokracji. Będzie odpowiednim premierem, na wybór którego zgodzi się większość partii politycznych."
 INS_hatta_focus_2: "Kolejne kroki"
 INS_hatta_focus_2_desc: "Rewolucja dobiegła końca i choć niektórzy politycy nalegają na jej kontynuowanie, należy ich zignorować. Zamiast tego powinniśmy spojrzeć w przyszłość i zbudować fundament, na którym przyszłe pokolenia Indonezji będą żyły w dobrobycie."
 INS_hatta_princely_advisors: "Integracja księstw-państw"
 INS_hatta_princely_advisors_desc: "Jednoczy nas różnorodność. To fundament, na którym zbudowaliśmy nasz naród, lecz zakończenie rewolucji i brak wspólnych wysiłków wystawił go na próbę. Aby nie doszło do niechęci i buntów ze strony mniejszości, powinniśmy ustanowić dodatkową radę, w której lokalni władcy księstw-państw będą mogli decydować o polityce narodowej."
 INS_prime_minister_tt: "Przeprowadzono pierwsze indonezyjskie wybory powszechne"
 # < Guided Democracy >
 INS_guided_democracy: "Sterowana demokracja"
 INS_guided_democracy_desc: "Demokracja może być wspaniała, lecz oddanie w tej chwili władzy ludowi doprowadzi jedynie do chaosu. Wybierzemy Sukarno na dożywotniego prezydenta, który będzie nadzorował demokratyczny parlament i interweniował w razie potrzeby."
 INS_enact_militarism: "Wprowadzenie militaryzmu"
 INS_enact_militarism_desc: "Powinniśmy wyciągnąć kilka lekcji z [JAP.GetAdjective] polityki wojskowej. Przyjęcie podobnych zasad będzie korzystne dla naszego nowego rządu."
 INS_sukarnos_industrialization: "Wsparcie jawajskiego przemysłu"
 INS_sukarnos_industrialization_desc: "Jawajski przemysł jest podstawą naszej gospodarki i wojska. Wszystkie drogi muszą prowadzić do Rzymu."
 INS_sukarnos_industrialization2: "Każdy musi odegrać swoją rolę"
 INS_sukarnos_industrialization2_desc: "Najwyższym priorytetem dla tego kraju są działania wojenne, dlatego też najwyższym priorytetem każdego Indonezyjczyka jest zaangażowanie się w nie. Luksus naszym wrogiem, a kompleks wojskowo-przemysłowy musi się rozwijać."
 INS_japanese_military_lessons: "Lekcje z japońskiej wojskowości"
 INS_japanese_military_lessons_desc: "Powinniśmy studiować japońskie doktryny wojskowe i odpowiednio dostosowywać do nich naszą armię."
 # < Support Tan Malaka's Coup>
 INS_support_tan_malakas_coup: "Wsparcie przewrotu Tan Malaki"
 INS_support_tan_malakas_coup_desc: "Sukarno ogłosił naszą niepodległość, jednak okazał się on człowiekiem półśrodków i ustępstw dyplomatycznych. Tan Malaka i jego Persatuan Perjuangan domagają się tego samego co naród: pełnej niepodległości, żadnych negocjacji ani kompromisów. Jeśli Sukarno nie będzie z całych sił wspierał rewolucji, rewolucja będzie musiała znaleźć przywódcę, który to zrobi."
 INS_minimum_program: "Program minimum"
 INS_minimum_program_desc: "Władze Persatuan Perjuangan przedstawiły swoje żądania: ludowy rząd, ludowa armia oraz nacjonalizacja wszystkich zagranicznych plantacji oraz przemysłu. Potrzebujemy zdolnych ludzi, którzy będą ten program kontynuować. Njono występuje w imieniu robotników, a Setyadjit mówi głosem partyjnych intelektualistów. Wspólnie dopilnują oni, by rewolucja była właściwie zorganizowana od fabryk po rządowe gabinety."
 INS_agrarian_reform: "Reforma rolna"
 INS_agrarian_reform_desc: "Przez trzy stulecia ziemia Indonezji karmiła obcych. Chłopi, którzy pracowali plantacjach, nie znali innego życia. Rewolucja, która tego stanu rzeczy nie zmienia, nie jest prawdziwą rewolucją. Dopilnujemy, by ziemie te zostały przekazane tym, którzy ją uprawiają."
 INS_soviet_aid: "Pomoc radziecka"
 INS_soviet_aid_desc: "Związek Radziecki docenił naszą rewolucję i jest gotowy ją wesprzeć. Niezależnie od różnic programowych między nami a Moskwą, nie możemy sobie pozwolić na odrzucenie takiej oferty. Powinniśmy chwycić za broń i nie zatrzymywać się."
 INS_pacific_revolution: "Pacyficzna rewolucja"
 INS_pacific_revolution_desc: "Mocarstwa kolonialne nie wycofały się z Azji, a jedynie z samej Indonezji. Stary porządek wciąż trzyma się w krajach takich jak Malaje czy Filipiny, a w każdym z nich można znaleźć wiele kobiet i mężczyzn, którzy pragną obalenia tego ładu. Rewolucja przyniosła nam pozycję oraz zobowiązanie, aby im w tym pomóc. Musimy to zrobić."
 INS_purge_oppurtunists_tt: "§Y$INS_launch_revolution$§!: odblokowanie w krajach, gdzie poparcie komunizmu wynosi §Y60%§! lub więcej. Kraje, w których wszczynamy rewolucję, staną się naszymi §Ypaństwami marionetkowymi§!."
 INS_purge_oppurtunists: "Czystka wśród oportunistów"
 INS_purge_oppurtunists_desc: "Musso spędził dwadzieścia lat w Moskwie, ucząc się wykonywania rozkazów. Powrócił do kraju z radzieckimi instrukcjami w kieszeni i planem przekształcenia naszej republiki w marionetkę Kominternu. Nie obaliliśmy Holendrów po to, by ugiąć się przed kolejnym obcym władcą. Musimy wykorzenić wszystkich oportunistów, którzy chcieliby zaprzedać naszą rewolucję Moskwie. Ludzie, których wyzwalamy, będą spoglądać na Dżakartę, a nie Kreml."
 INS_federation_of_aslia: "Federacja Aslii"
 INS_federation_of_aslia_desc: "Wyzwalane przez nas narody nie muszą być osamotnione. Tan Malaka od zawsze myślał o czymś większym niż samej republice. Myślał o federacji krajów od ojczyzny aż po sam Pacyfik, zjednoczonych przeciwko kolonialnym mocarstwom, które ośmieliłyby się tu wrócić. Zaoferujemy tym narodom pełną przynależność do naszego państwa."
 INS_aslia_tt: "Pozwala na unaradawianie i anektowanie §Ypacyficznych§! poddanych"
 INS_musso_ascends: "Musso przejmuje władzę"
 INS_musso_ascends_tt: "§Y$INS_launch_revolution$§!: odblokowanie w krajach, gdzie poparcie komunizmu wynosi §Y30%§! lub więcej. Kraje, w których wszczynamy rewolucję, pozostaną niepodległe."
 INS_musso_ascends_desc: "Tan Malaka jest marzycielem. Musso posiada to, czego nie mają marzyciele: pełne wsparcie Związku Radzieckiego i solidarność ze strony międzynarodowego ruchu komunistycznego. Nasza rewolucja nie musi być osamotniona."
 INS_soviet_economic_integration: "Radziecka integracja gospodarcza"
 INS_soviet_economic_integration_desc: "Rewolucja przyniosła nam wolność, lecz sama wolność nie zbuduje fabryk ani nie wykarmi mas. Związek Radziecki oferuje to, czego nie da nam żadne kapitalistyczne mocarstwo: wiedzę przemysłową, kredyty na rozwój oraz handel na warunkach pozbawionych kolonialnych haczyków. Głupotą byłoby odmówić."
 # <National Revolution - Reasserting Control>
 INSHOL_revolution_ongoing_tt: "Trwa indonezyjska rewolucja"
 INSHOL_reasserting_control: "Odzyskanie kontroli nad Indiami Wschodnimi"
 INSHOL_reasserting_control_desc: "Nie możemy bezczynnie stać i patrzeć, jak ci oportuniści burzą wszystko, co budowaliśmy przez całe stulecia, jednocześnie niszcząc naszą infrastrukturę i radykalizując młodych. Musimy działać!"
 INSHOL_request_british_support: "Prośba o brytyjskie wsparcie"
 INSHOL_request_british_support_desc: "[ENG.GetNameDefCap], czyli podobne do nas mocarstwo kolonialne, prawdopodobnie okaże zrozumienie dla naszej sytuacji, zwłaszcza że zwycięstwo rewolucji może wywołać w Azji Wschodniej efekt domina. Powinniśmy poprosić o ich wsparcie gospodarcze i wojskowe."
 INS_eng_treaty_holside_tt: "§Y[ENG.GetNameDefCap]§! oficjalnie opowie się po naszej stronie w konflikcie i zapewni znaczną pomoc. Jeśli wojna zakończy się zwycięstwem, §Y[ENG.GetNameDefCap]§! otrzyma Borneo."
 INS_eng_treaty_engside_tt: "W konflikcie w Indiach Wschodnich oficjalnie sprzymierzymy się z państwem §Y[HOL.GetAdjective]§! Jeśli §Y[HOL.GetNameDefCap]§! zwycięży, przejmiemy Borneo na własność."
 INS_fra_treaty_holside_tt: "§Y[FRA.GetNameDefCap]§! oficjalnie opowie się po naszej stronie w konflikcie i zapewni znaczną pomoc. Jeśli wojna zakończy się zwycięstwem, §Y[FRA.GetNameDefCap]§! otrzyma północno-wschodnią Sumatrę."
 INS_fra_treaty_fraside_tt: "W konflikcie w Indiach Wschodnich oficjalnie sprzymierzymy się z państwem §Y[HOL.GetAdjective]§! Jeśli §Y[HOL.GetNameDefCap]§! zwycięży, przejmiemy północno-wschodnią Sumatrę na własność."
 INSHOL_franco_dutch_accord: "Porozumienie francusko-holenderskie"
 INSHOL_franco_dutch_accord_desc: "Mimo że nasi żołnierze są lepiej wyposażeni i zorganizowani od republikańskich milicji, ich przewaga liczebna sprawiła, że przebieg konfliktu przybrał niekorzystny dla nas obrót. Aby zapewnić sobie zwycięstwo, potrzebujemy wsparcia z zewnątrz - większego, niż większość byłaby skłonna nam udzielić. Francja może być skłonna pomóc, jeśli w zamian zaoferujemy im terytorium w Indiach Wschodnich, dzięki któremu będą oni w stanie rozszerzyć swoją obecność w regionie Pacyfiku."
 INSHOL_london_batavia_accord: "Porozumienie Londyn-Batavia"
 INSHOL_london_batavia_accord_desc: "Mimo że nasi żołnierze są lepiej wyposażeni i zorganizowani od republikańskich milicji, ich przewaga liczebna sprawiła, że przebieg konfliktu przybrał niekorzystny dla nas obrót. Aby zapewnić sobie zwycięstwo, potrzebujemy wsparcia z zewnątrz - większego, niż większość byłaby skłonna nam udzielić. Władze [ENG.GetAdjective] mogą być zainteresowane ze względu na swoją obecność na Malajach. Być może udałoby się je przekonać, gdybyśmy zaoferowali coś w zamian?"
 INSHOL_australian_divisions: "Wysłanie australijskiej piechoty na Jawę"
 INSHOL_australian_divisions_desc: "Zgodnie z porozumieniem Londyn-Batavia Wielka Brytania ma obowiązek wysłać na nasze żądanie dodatkowe dywizje do Indii Wschodnich przez Australię, ponieważ bliskość Australii do Indii Wschodnich sprawia, że jest ona idealnym kandydatem do utworzenia bazy wojskowej poza indyjskim terytorium."
 INSHOL_indian_divisions: "Oddziały brytyjskiej armii indyjskiej"
 INSHOL_indian_divisions_desc: "Chociaż Wielka Brytania najprawdopodobniej nie będzie skłonna wysłać własnych żołnierzy do Indii Wschodnich, przekonanie jej do wysłania indyjskich dywizji jest znacznie łatwiejsze, szczególnie ze względu na ich bliskość do Batavii."
 INSHOL_undermine_the_militias: "Osłabienie milicji"
 INSHOL_undermine_the_militias_desc: "Media wyolbrzymiają powagę tej sytuacji; milicja to tylko grupa zbuntowanych młodych ludzi, którzy próbują osiągnąć coś niemożliwego. Nie musimy angażować wszystkich naszych zasobów, by ich powstrzymać; powinniśmy po prostu utrzymać pozycję i poczekać, aż się zmęczą."
 INSHOL_flag_will_fly_again: "Flaga będzie ponownie powiewać"
 INSHOL_flag_will_fly_again_desc: "Holenderska flaga powiewa w Indiach Wschodnich od wieków i za nic w świecie nie pozwolimy, by została opuszczona. Jeśli utrzymanie naszej najcenniejszej kolonii wymaga wysłania czołgów i bombowców, to zostaną one wysłane!"
 INSHOL_flag_will_fly_again_tt: "§YGdy rewolucja dobiegnie końca, duch zostanie usunięty, a zmiany w zasadach cofnięte.§!"
 # <National Revolution - Escalation>
 INSHOL_mass_mobilization: "Masowa mobilizacja"
 INSHOL_mass_mobilization_desc: "Nie zdołamy wygrać tego konfliktu i pokonać republiki bez dobrze wyposażonej armii. Musimy ponownie uzbroić Indie Wschodnie i przekierować środki finansowe z sektorów cywilnych do KHAIW."
 INSHOL_batavia_storm_operation: "Szturm na Batavię"
 INSHOL_instigate_infighting: "Sprowokowanie wewnętrznej walki w republice"
 INSHOL_ultimatum_to_republic: "Ultimatum dla republiki"
 INSHOL_comite_rijkseenheid: "Comité Rijkseenheid"
 INSHOL_comite_rijkseenheid_desc: "Flaga jest opuszczana w Indiach Wschodnich, a ludzie tylko się temu przyglądają. Nie możemy na to pozwolić, musimy przekonać indyjską administrację, że Holendrzy chcą, by powstrzymano rewolucję!"
 INSHOL_increase_esclation_placeholder: "Gwałtowna eskalacja"
 INSHOL_increase_esclation_placeholder_desc: "Nasze milicje przejęły wiele ważnych portów, miast i ośrodków przemysłowych. Nie będziemy czekać na reakcję Holandii i sami wezwiemy do wielkiej wojskowej ofensywy!"
 INS_take_batavia_explination_tt: "Jeśli uda nam się zająć całą Jawę, zniszczymy rząd kolonialny od środka i §Gwygramy wojnę§!. Jeśli jednak nie uda nam się tego dokonać w ciągu §Y730 dni§!, §Rprzepadniemy§!."
 INSHOL_linggadjati_agreement: "Negocjowanie porozumień o zawieszeniu broni"
 INSHOL_linggadjati_agreement_desc: "Inwazja na Jawę okazała się trudna, a nasza administracja traci stabilność. Musimy wycofać się i przejść do defensywy, aby nie narażać całej republiki na upadek. Powinniśmy wynegocjować lokalne zawieszenie broni z Holandią, co umożliwi nam reorganizację sił, zanim ponownie skoncentrujemy się na Jawie."
 INSHOL_increase_esclation_placeholder_tt: "Odblokowanie §Ydecyzji§! o negocjowaniu zawieszenia ognia i §Ywydłużenia czasu§! na zajęcie Jawy."
 # <National Revolution - Peace Negotiation>
 INSHOL_seek_foreign_help: "Poszukiwanie zagranicznej pomocy"
 INSHOL_seek_foreign_help_desc: "Nie jest tajemnicą, że podjęcie próby wygrania wojny z silnie uprzemysłowioną potęgą kolonialną jako nowo powstałe państwo bez ugruntowanej gospodarki jest zadaniem niemal niemożliwym do wykonania. Powinniśmy zwrócić się do innych krajów, które popierają naszą sprawę, aby sprawdzić, czy byłyby skłonne nam pomóc."
 INSHOL_renville_agreement: "Porozumienie z Renville"
 INSHOL_renville_agreement_desc: "Bezprecedensowa agresja ze strony Holandii sprawiła, że rewolucja znalazła się w centrum międzynarodowej uwagi, a mimo to Holandia nadal łamie warunki zawieszenia broni i prowokuje nas do działania. Musimy spróbować skontaktować się z [USA.GetAdjective] władzami - jeśli uda nam się przekonać je do wsparcia Indonezji, Holandia będzie zmuszona do ustąpienia."
 INSHOL_no_compromise: "Żadnych kompromisów, żadnej kapitulacji"
 INSHOL_no_compromise_desc: "Holenderska chciwość, która skłoniła ich do inwestowania niemal wyłącznie na Jawie i zignorowania wschodnich wysp, sprawiła, że Jawa stała się piętą achillesową całej kolonii. To będzie ich zguba!"
 INSHOL_end_to_bloodshed: "Rozwiązanie z dwoma państwami"
 INSHOL_end_to_bloodshed_desc: "Ten konflikt trwa zdecydowanie zbyt długo i nie przynosi żadnych konkretnych rezultatów poza rosnącą każdego dnia liczbą zabitych. Nikt nie chce tego kontynuować - nadszedł czas, abyśmy podjęli rozmowy z holenderskimi przywódcami przy stole negocjacyjnym."
 INSHOL_reorganize_colonies: "Reorganizacja kolonii"
 INS_we_will_need_another_tt: "Ponieważ kontrolujemy już całą Jawę, będziemy musieli przejąć kontrolę nad jeszcze jednym regionem oprócz Jawy."
 # Industry Branch - New
 INS_centralize_the_state: "Centralizacja państwa"
 INS_centralize_the_state_desc: "Od Sumatry po Celebes, od Borneo po Bangkę - dzięki naszym programom rozwojowym na terenach, którymi [1058.GetName] zarządzała niegdyś jedynie formalnie, powstały drogi, fabryki i instytucje. Regiony te nie są już odległymi prowincjami. Stały się jednością z [INS.GetAdjective] państwem."
 INS_centralize_the_state_1_tt: "Wymagane regiony, które są §Yregionami narodowymi§!:"
 INS_centralize_the_state_2_tt: "Wymagane regiony, które nie są §Yregionami narodowymi§!:"
 INS_fate_of_de_javasche_bank: "[INS_fate_of_de_javasche_bank_scripted_name]"
 INS_fate_of_de_javasche_bank_scripted_name_colony: "Los De Javasche Bank"
 INS_fate_of_de_javasche_bank_scripted_name_independent: "Los Banku Indonezji"
 INS_fate_of_de_javasche_bank_desc: "[INS_fate_of_de_javasche_bank_scripted_desc]"
 INS_fate_of_de_javasche_bank_scripted_desc_colony: "Od początku kryzysu gospodarczego kurs guldena Indii Wschodnich gwałtownie spada, a De Javasche Bank nie dysponuje środkami, które pozwoliłyby ten spadek powstrzymać. Musimy znaleźć sposób na stabilizację naszej waluty, zanim stracimy resztki zaufania inwestorów."
 INS_fate_of_de_javasche_bank_scripted_desc_independent: "Odziedziczyliśmy walutę pogrążoną w kryzysie. Stary kolonialny gulden tracił na wartości, a przejście na rupię wcale nie przyczyniło się do ustabilizowania rynku. Bank Indonezji potrzebuje jasnych wytycznych od rządu, bo bez nich ucierpi nasza młoda gospodarka."
 INS_finish_the_bauxite_project: "Ukończenie projektu Bangka"
 INS_finish_the_bauxite_project_desc: "Wraz z oddaniem do użytku nowych dróg, portów i linii kolejowych na obszarze Bangka i Belitung zespoły geologiczne odkryły złoża wolframu i chromu, których wielkość przekracza nasze wstępne oczekiwania. Wyspy te jeszcze udowodnią swoją prawdziwą wartość dla republiki."
 INS_australian_contracts: "Australijskie kontrakty"
 INS_australian_contracts_desc: "Nasze zapasy kauczuku znacznie przewyższają krajowe zapotrzebowanie. Australia, która nieustannie poszukuje surowców dla swojego przemysłu, jest dla nas naturalnym partnerem handlowym. Zawarcie długoterminowych umów z australijskimi firmami zapewniłoby nam stałe dochody i umocniło naszą pozycję w regionalnej gospodarce."
 INS_coopereate_with_chinese_businessmen: "Współpraca z chińskimi przedsiębiorcami"
 INS_coopereate_with_chinese_businessmen_desc: "Zamożna i posiadająca rozległe kontakty klasa kupiecka od dawna ułatwia handel na obszarze archipelagu. Zamiast marginalizować te ugruntowane sieci, powinniśmy z nimi współpracować. Ich kapitał i wiedza handlowa mogą okazać się nieocenione w wyprowadzeniu naszej gospodarki z obecnego zastoju."
 INS_oil_decisions_unlock_tt: "Odblokowanie nowych decyzji (§Y$INS_realign_supply_chains_cat$§!) dotyczących sprzedaży §Yropy§!."
 INS_negotiate_new_contracts_unlock_tt: "Odblokowanie nowych decyzji (§Y$INS_realign_supply_chains_cat$§!)."
 INS_realign_supply_chains_explain_tt: "Odblokowanie decyzji (§Y$INS_realign_supply_chains_cat$§!) dotyczących sprzedaży surowców prywatnym firmom w ramach 2-letniej dzierżawy."
 INS_negotiate_new_contracts: "Negocjowanie nowych kontraktów"
 INS_negotiate_new_contracts_desc: "Rosnąca renoma niezawodnego dostawcy otworzyła drzwi, które wcześniej były dla nas zamknięte. Pojawiają się nowi nabywcy i powinniśmy działać szybko, aby zawrzeć z nimi długoterminowe umowy, zanim wyprzedzą nas konkurenci."
 INS_all_in_on_rubber: "Postawienie wszystkiego na kauczuk"
 INS_all_in_on_rubber_desc: "Kauczuk jest naszym największym atutem i zamierzamy go wykorzystać. Każdy dostępny akr ziemi uprawnej zostanie przeznaczony pod uprawę drzew kauczukowych, a nasz system eksportowy zostanie zrestrukturyzowany tak, aby transportować ten towar szybciej i taniej niż ktokolwiek inny w regionie."
 INS_more_market_resources: "Zalanie wielkiego kryzysu"
 INS_more_market_resources_desc: "Świat może być pogrążony w kryzysie gospodarczym, ale kryzys to szansa dla tych, którzy mają odwagę ją wykorzystać. Zalewając rynek naszymi towarami w cenach, których żaden konkurent nie jest w stanie obniżyć, zadbamy o to, by w momencie ożywienia gospodarczego indonezyjskie produkty znajdowały się na każdej sklepowej półce i w każdym magazynie."
 # <Industry Branch - Trade Policy>
 INS_recovering_from_the_great_depression: "Wyjście z wielkiego kryzysu"
 INS_recovering_from_the_great_depression_desc: "Wielki Kryzys miał druzgocący wpływ na wiele krajów i [INS.GetNameDef] nie jest tu wyjątkiem. Nasza gospodarka opiera się głównie na eksporcie, więc protekcjonizm, który ogarnął świat, poważnie nas osłabił. W obliczu ponownego ożywienia światowego handlu musimy znaleźć nowe rynki zbytu i podjąć działania mające na celu wznowienie dawnych szlaków handlowych."
 INS_first_come_first_serve: "Kto pierwszy, ten lepszy"
 INS_first_come_first_serve_desc: "Chociaż protekcjonizm związany z wielkim kryzysem zaczyna słabnąć, wzrost produkcji i zawyżony kurs guldena doprowadziły do załamania się holenderskiego eksportu, ponieważ nasi dawni partnerzy handlowi z Zachodu zaczęli zaspakajać swój popyt produktami z Ameryki Południowej. Zamiast zabiegać o nowe umowy handlowe z nimi, moglibyśmy potraktować tę sytuację jako okazję do ekspansji na nowe rynki w Azji."
 INS_oil_export: "Zwiększony eksport ropy"
 INS_oil_export_desc: "Zmodernizujemy infrastrukturę naftową na Sumatrze i Kalimantanie, aby zabezpieczyć umowy handlowe z naszymi nowymi partnerami handlowymi."
 INS_increased_trade_with_japan: "Zwiększony handel z Japonią"
 INS_increased_trade_with_japan_desc: "[JAP.GetNameDefCap] staje się coraz cenniejszym partnerem handlowym, który nigdy nas nie zawiódł. Powinniśmy wynegocjować nowe umowy handlowe, aby pogłębić współpracę gospodarczą między naszymi krajami i pomóc nam otrząsnąć się ze skutków wielkiego kryzysu. Może to zaniepokoić naszych zachodnich sojuszników, zwłaszcza Holandię. Jeśli jednak chcemy mieć wpływ na swoje losy, musimy zadbać o własne relacje handlowe."
 INS_asian_trade_investments: "Azjatyckie inwestycje handlowe"
 INS_asian_trade_investments_desc: "Szkody spowodowane przez wielki kryzys uświadomiły nam, jak bardzo byliśmy uzależnieni od naszych długoletnich zachodnich partnerów handlowych. Nasza gospodarka opiera się głównie na eksporcie, dlatego teraz bardziej niż kiedykolwiek wcześniej musimy pozyskać i rozwijać nowe rynki w Azji Południowo-Wschodniej, aby nasza gospodarka nie była uzależniona od żadnego pojedynczego kraju."
 INS_asian_trade_investments_tt: "Co §Y420§! dni kara do surowców na rynek związana z §Ywielkim kryzysem§! będzie §Gzmniejszana§! o §Y5%§!, aż do chwili, gdy negatywne modyfikatory zostaną wyeliminowane."
 INS_declare_free_trade: "Deklaracja wolnego handlu"
 INS_declare_free_trade_desc: "Nie powinniśmy skupiać się wyłącznie na jednym kraju; pozwolimy, by rynek w naturalny sposób podjął najlepsze decyzje dotyczące [INS.GetAdjective] przyszłości."
 INS_japanese_export_contracts: "Jedna umowa, by sprzedać wszystko"
 INS_japanese_export_contracts_desc: "Wynegocjujemy wielką umowę handlową z [JAP.GetAdjective] władzami i sprzedamy w jej ramach cały kauczuk, który wytwarzają [1049.GetName] oraz [672.GetName]. Chociaż cena sprzedaży będzie bardzo niska, to będziemy mieli gwarancję, że całość znajdzie nabywcę."
 INS_realign_supply_chains: "Przywrócenie łańcuchów dostaw"
 INS_realign_supply_chains_desc: "Chociaż protekcjonizm związany z wielkim kryzysem zaczyna słabnąć, wzrost produkcji i zawyżony kurs guldena doprowadziły do załamania się holenderskiego eksportu, ponieważ nasi dawni partnerzy handlowi z Zachodu zaczęli zaspakajać swój popyt produktami z Ameryki Południowej. Musimy podjąć działania, aby przekonać naszych sojuszników do wznowienia handlu z nami."
 INS_invite_foreign_companies: "Wsparcie amerykańskich inwestycji naftowych"
 INS_invite_foreign_companies_desc: "Od 1930 roku firma Standard Oil California prowadzi działalność w naszym kraju za pośrednictwem swojej holenderskiej spółki zależnej, Nederlandsche Pacific Petroleum Maatschappij. Wyniki jej poszukiwań w Riouw są obiecujące, dlatego powinniśmy wspierać jej działania w sektorze wydobywczym w każdy możliwy sposób - duże odkrycie nie tylko zwiększyłoby nasze dochody, ale zachęciłoby też inne międzynarodowe firmy do inwestowania w naszym kraju."
 INS_expand_sea_routes: "Poszerzenie szlaków morskich"
 INS_expand_sea_routes_desc: "Nasz kraj jest bogaty w surowce naturalne, ale nasz przemysł wydobywczy jest zbyt wyspecjalizowany i brakuje nam infrastruktury niezbędnej do wydobywania pewnych rzadkich surowców, takich jak chrom i wolfram. Jeśli chcemy zwiększyć nasze możliwości w zakresie produkcji wojskowej, będziemy musieli importować te surowce z innych krajów. Aby w pełni wykorzystać naszą rozwijającą się sieć handlową, będziemy musieli zwiększyć potencjał naszej floty handlowej."
 INS_ship_contracts: "Zabezpieczenie kontraktów na budowę floty"
 INS_ship_contracts_desc: "Stworzenie marynarki wojennej jest niezbędne do utrzymania naszych szlaków handlowych w razie wybuchu wojny. Możemy wykorzystać nasze nowo nawiązane relacje handlowe do pozyskania kontraktów na budowę floty."
 # <Industry Branch - Sumatra>
 INS_developing_sumatra: "Rozwój Sumatry"
 INS_developing_sumatra_desc: "Sumatra jest najbogatszą w surowce wyspą archipelagu, jednak jej infrastruktura jest tak słabo rozwinięta, że znaczna część wydobywanych surowców nigdy nie trafia nawet do Batavii. Transport opiera się na sieci nieutwardzonych dróg i niepołączonych ze sobą linii kolejowych, co jest zdecydowanie niewystarczające, by umożliwić realizację naszych planów dotyczących tej wyspy. Należy to zmienić."
 INS_sumatra_railway: "Sumatrzańska linia kolejowa"
 INS_sumatra_railway_desc: "W ramach naszych bieżących działań na rzecz rozwoju infrastruktury Sumatry powinniśmy zbudować rozległą linię kolejową biegnącą od północnej części Aceh do najbardziej na południe wysuniętego portu na Sumatrze, który umożliwia szybkie połączenie morskie z Batavią. Dzięki temu surowce trzeba będzie transportować jedynie do najbliższej stacji kolejowej, skąd w ciągu kilku dni będziemy mogli je przewieźć do Batavii."
 INS_develop_borneo: "Rozwój Kalimantanu"
 INS_develop_borneo_desc: "Kalimantan ma potencjał, by stać się niezwykle bogatym regionem, jednak wyspa jest bardzo słabo rozwinięta, a jej mieszkańcy borykają się z ubóstwem. Transport towarów opiera się w dużej mierze na licznych rzekach i kanałach wyspy, a wszelka komunikacja na większe odległości jest utrudniona z powodu braku energii elektrycznej. Budowa linii energetycznych i dróg pozwoli przygotować grunt pod przyszłe prace geodezyjne i wydobycie surowców."
 INS_kalimantan_mic: "Przemysł zbrojeniowy na Kalimantanie"
 INS_kalimantan_mic_desc: "Nasze działania na rzecz rozwoju infrastruktury na Kalimantanie przyniosły efekty. Rozbudowa sieci energetycznej i komunikacyjnej pozwoliła nam nawiązać kontakt ze społecznościami, które wcześniej znajdowały się poza zasięgiem wpływów rządu. Możemy wykorzystać tę okazję, by zaspokoić nasze zapotrzebowanie na zwiększoną produkcję wojskową poprzez budowę nowych fabryk w regionie i zatrudnienie w nich nowo pozyskanych pracowników."
 INS_pontianak_to_balikpapan: "Od Pontianaku do Tanjung Selor"
 INS_pontianak_to_balikpapan_desc: "Pomysł budowy linii kolejowej na Kalimantanie był już wielokrotnie omawiany, jednak trudny, w większości niezbadany teren w centrum wyspy sprawia, że jest to niełatwe zadanie. Jedynym rozwiązaniem jest linia kolejowa w kształcie litery U, biegnąca od wybrzeża do wybrzeża. Nie będzie to tania inwestycja, ale z czasem na pewno się zwróci."
 INS_develop_sulawesi: "Rozwój Celebesu"
 INS_develop_sulawesi_desc: "Wyspa Celebes to centrum archipelagu, a zatem ważne strategicznie miejsce. Powinniśmy zbudować na niej drogi, linie energetyczne i infrastrukturę łącznościową, aby w razie wojny można było wykorzystać ją jako centrum operacji wojskowych."
 # <Industry Branch - Bangka Project>
 INS_the_bangka_project: "Projekt Bangka"
 INS_the_bangka_project_desc: "Wyspy Bangka i Belitung, choć niewielkie, stanowią filar indonezyjskiej gospodarki dzięki występującym na nich złożom boksytu. Musimy wybudować na nich drogi, porty i linie kolejowe, aby w pełni wykorzystać ogromne bogactwa surowcowe tych wysp."
 INS_aluminium_factory: "Wytwórnia aluminium Pangkalpinangu"
 INS_aluminium_factory_desc: "Wydobycie rudy boksytu rośnie, ale brak krajowej produkcji aluminium ogranicza nasze zyski. Jako stolica prowincji wysp Bangkal i Belitung Pangkalpinang byłby idealnym miejscem do otwarcia naszych własnych fabryk. Dzięki temu moglibyśmy wyeliminować pośredników i uzyskać maksymalne zyski."
 INS_bauxite_export: "Zwiększenie eksportu boksytu"
 INS_bauxite_export_desc: "Ukończenie projektu Bangka sprawiło, że dysponujemy większą ilością rudy boksytu, niż jesteśmy w stanie wykorzystać. Chociaż próba sprzedaży wszystkiego byłaby trudna, moglibyśmy zaoferować znacznie niższą cenę za boksyt niż inni gracze na rynku, gwarantując tym samym sprzedaż każdego grama. Ze względu na ogromną ilość boksytu, jaką możemy sprzedać, przyniosłoby to nadal proporcjonalny wzrost zysków w porównaniu z naszym obecnym eksportem."
 INS_tin_mining: "Inwestycje w wydobycie cyny"
 INS_tin_mining_desc: "Historia wydobycia cyny na wyspach Bangka i Belitung sięga czasów sprzed przybycia na ten archipelag Europejczyków. Nic więc dziwnego, że przemysł cynowy na tych wyspach już dawno powinien zostać zmodernizowany. Kompleksowa modernizacja zdolności produkcyjnych to kosztowne przedsięwzięcie i w trakcie jej realizacji nasz obecny przemysł cynowy przez pewien czas nie będzie działał. Jednak długoterminowe zyski mogą być znaczne."
 in_240_days_tt: "§YZa 240 dni:§!\n"
 INS_tin_to_usa: "Sprzedaż cyny do: [USA.GetNameDef]"
 INS_tin_to_usa_desc: "[USA.GetNameDefCap] to kraj pełen korporacji i rządowych instytucji kupujących cynę. Dysponujemy dobrze zorganizowanym przemysłem wydobywczym, więc mamy szansę na osiągnięcie w nim znacznych zysków."
 INS_tin_to_japan: "Sprzedaż cyny do: [JAP.GetNameDef]"
 INS_tin_to_japan_desc: "[JAP.GetNameDefCap] ma wiele okrętów uznawanych za przestarzałe i wymagające wymiany, które sprawdziłyby się świetnie w [INS.GetAdjective] marynarce wojennej. Powinniśmy kupić te jednostki za pieniądze zarobione na produkcji cyny."
 INS_tin_to_japan_tt: "Władze [JAP.GetAdjective] przekażą nam §Y9§! starszych niszczycieli."
 INS_new_bauxite_routes: "Nowe szlaki boksytowe"
 INS_new_bauxite_routes_desc: "Nasza strategia polegająca na oferowaniu cen niższych od rynkowych w celu zwiększenia wolumenu eksportu boksytu okazała się skuteczna i pozwoliła nam znacznie zwiększyć łączny dochód. Nie możemy jednak na tym poprzestać. Powinniśmy nadal rozbudowywać nasze sieci handlowe, optymalizować łańcuchy dostaw oraz poszukiwać wszelkich możliwości zwiększenia naszych zysków."
 INS_bangka_bauxite_export_flag: "Zrealizowano cel §Y$INS_bauxite_export$§!:"
 INS_not_industry: "Planowanie przyszłości"
 INS_not_industry_desc: "Jawa jest sercem naszego kraju, domem dla większości naszej ludności i siedzibą naszego rządu. Zanim rozpoczniemy poważną industrializację wyspy, musimy przygotować pod nią grunt. Pomiary geodezyjne, wytyczenie stref zagospodarowania przestrzennego i oczyszczenie terenów budowlanych zagwarantują, że gdy powstaną fabryki, będą zlokalizowane tam, gdzie przyniosą największe korzyści."
 INS_construction_focus: "Boom gospodarczy"
 INS_construction_focus_desc: "Napływa kapitał zagraniczny, rosną dochody z eksportu, i po raz pierwszy od lat mamy realne środki na inwestycje w krajowy przemysł. Musimy wykorzystać tę okazję i działać, póki warunki nam sprzyjają."
 # <Industry Branch - Java>
 INS_developing_java: "Rozwój jawajskiej infrastruktury"
 INS_developing_java_desc: "Jawa jest zdecydowanie najbardziej uprzemysłowioną wyspą archipelagu i źródłem większości naszego bogactwa. Jednak niektóre miasta, takie jak Batavia, stają się coraz bardziej zatłoczone z powodu wzrostu liczby ludności. Powinniśmy rozbudować te miasta, tworząc nowe osiedla mieszkaniowe, strefy handlowe, linie tramwajowe i kolejowe oraz fabryki, aby sprostać potrzebom powiększającej się populacji."
 INS_prioritize_sugar_economy: "Nadanie priorytetu rynkowi cukru"
 INS_prioritize_sugar_economy_desc: "Powinniśmy zmniejszyć środki z budżetu państwowego przeznaczone na rozwój batawiańskiego przemysłu; miasto to jest już znacznie bardziej uprzemysłowione niż jakiekolwiek inne w archipelagu. Zamiast tego powinniśmy przeznaczyć te pieniądze na założenie wielu małych plantacji palmowych w całym kraju. Plantacje te będą produkować cukier palmowy, który jest towarem pożądanym na międzynarodowym rynku."
 INS_all_cards_into_industry: "Wszystko na przemysł"
 INS_all_cards_into_industry_desc: "[1058.GetName] i jej gospodarka odczuły ogromny wpływ industrializacji. Gdybyśmy zindustrializowali całą wyspę zamieszkaną przez dziesiątki milionów obywateli, moglibyśmy zyskać znaczenie w skali globalnej."
 INS_expand_batavia_technical_institute: "Rozbudowa Instytutu Technologii w Batavii"
 INS_expand_batavia_technical_institute_desc: "Rozbudowa Instytutu Technologii w Batavii umożliwi kształcenie większej liczby studentów i przyspieszy tempo naszego rozwoju technologicznego."
 INS_quinine_export: "Korzystniejsza umowa sprzedaży chininy"
 INS_quinine_export_desc: "Kinabureau w Amsterdamie ma niemal monopol na eksport chininy, co przynosi znaczne zyski, ponieważ jej zastosowanie w leczeniu malarii zapewnia wysoki popyt na całym świecie. Kinabureau pozyskuje większość chininy z Indii Wschodnich, a mimo to otrzymujemy jedynie niewielką część zysków. Powinniśmy wykorzystać naszą produkcję chininy jako kartę przetargową w negocjacjach dotyczących bardziej sprawiedliwej umowy."
 INS_spend_profits_on_rural: "Wydanie zysków na rozwój wsi"
 INS_spend_profits_on_rural_desc: "Po sfinalizowaniu naszej nowej umowy dotyczącej chininy możemy wykorzystać dodatkowe zyski na rozwój infrastruktury transportowej i komunikacyjnej na obszarach wiejskich, przygotowując grunt pod przyszły rozwój przemysłowy."
 INS_spend_profits_on_urban: "Wydanie zysków na rozwój miasta"
 INS_spend_profits_on_urban_desc: "Po sfinalizowaniu naszej nowej umowy dotyczącej chininy możemy wykorzystać dodatkowe zyski na rozwój przemysłu wytwórczego w Batavii, co pozwoli nam zdywersyfikować gospodarkę i zmniejszyć zależność od eksportu surowców."
 INS_spend_profits_on_military: "Wydanie zysków na rozwój wojska"
 INS_spend_profits_on_military_desc: "Po sfinalizowaniu naszej nowej umowy dotyczącej chininy możemy znacznie wzmocnić nasze siły zbrojne, przeznaczając dodatkowe zyski na budowę i utrzymanie nowych fabryk broni w Yogyakarcie i Semarangu."
 INS_end_to_bloodshed_tt: "Wojna dobiegnie końca, a nowe granice zostaną wytyczone na podstawie obecnego stanu okupacji. Jawa, Sumatra i Borneo zostaną §Yanektowane§! przez stronę, która obecnie sprawuje największą kontrolę nad tym obszarem."
