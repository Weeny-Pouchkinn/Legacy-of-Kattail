 # <Empower the Volksraad>
 INS_the_jewel_in_the_crown: "Klejnot w koronie"
 INS_the_jewel_in_the_crown_desc: "Indie Wschodnie są najwspanialszym klejnotem w koronie holenderskich kolonii i zamierzamy zadbać o to, by tak pozostało. Dzięki Volksraadowi nasz głos jest słyszany w Hadze."
