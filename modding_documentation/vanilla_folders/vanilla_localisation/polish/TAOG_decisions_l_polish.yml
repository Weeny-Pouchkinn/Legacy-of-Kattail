 SIA_public_credit_repayment: "Spłata długu publicznego"
 SIA_public_credit_repayment_tt: "Spłacimy cały dług publiczny za jednym zamachem kosztem dużej, tymczasowej kary do §Ydóbr konsumpcyjnych§!."
 idea_SIA_deficit_spending: "Deficyt budżetowy"
 idea_SIA_deficit_spending_desc: "Rząd wydaje więcej, niż może sobie pozwolić, przeznaczając pożyczone środki na realizację przyspieszonego programu budowlanego. Korzyści dla przemysłu są realne, ale wkrótce nadejdzie czas spłaty długu."
 SIA_print_additional_money: "Druk dodatkowych pieniędzy"
 SIA_print_additional_money_tt: "Wydrukujemy jeszcze więcej pieniędzy dla Japonii."
 SIA_appeal_to_industrialists: "Apel do przemysłowców"
 SIA_implement_industrialists_reforms_countdown: "Wdrożenie reform przemysłowych"
 SIA_implement_industrialists_reforms_countdown_trigger: "Zbuduj §Y2 fabryki cywilne§! (nie licząc fabryk zyskanych z celów i handlu)"
 SIA_appeal_to_industrialists_tt: "Zyskamy poparcie przemysłowców.\n\nPomogą nam w wojnie domowej, zapewniając dodatkowe wyposażenie. Oczekują jednak, że powiększymy naszą bazę przemysłową, budując §Y2§! dodatkowe §Yfabryki cywilne§! ponad stan posiadany na koniec wojny domowej w ciągu §Y720 dni§! od zdobycia władzy (nie licząc fabryk zyskanych z celów lub handlu). \n\nNieuczynienie tego spowoduje spadek §Ystabilizacji§! i §Ypoparcia wojny§!.\n\nNa początku wojny domowej otrzymamy:"
 SIA_seek_support_from_constitutional_monarchists: "Poszukiwanie wsparcia monarchistów konstytucyjnych"
 SIA_implement_constitutionalist_reforms_countdown: "Wdrożenie reform konstytucjonalistów"
 SIA_seek_support_from_constitutional_monarchists_tt: "Zyskamy poparcie monarchistów konstytucyjnych.\n\nPomogą nam w wojnie domowej, zapewniając dodatkowe dywizje. Oczekują jednak, że pozostaniemy monarchią konstytucyjną, wykonując cel §Y$SIA_a_constitutional_monarchy$§! w ciągu §Y720 dni§! od zdobycia władzy.\n\nNieuczynienie tego spowoduje spadek §Ystabilizacji§! i §Ypoparcia wojny§!."
 SIA_appeal_to_rural_people: "Apel do mieszkańców wsi"
 SIA_appeal_to_rural_people_tt: "Zyskamy poparcie mieszkańców wsi.\n\nPomogą nam w wojnie domowej, zapewniając milicje. Oczekują jednak, że w zamian uchwalimy korzystne dla wsi reformy, wykonując cel §Y$SIA_mechanization_of_agriculture$§! lub §Y$SIA_reduction_of_agricultural_yield_taxes$§! w ciągu §Y720 dni§! od zdobycia władzy.\n\nNieuczynienie tego spowoduje spadek §Ystabilizacji§! i §Ypoparcia wojny§!\n\n. Na początku wojny domowej otrzymamy:"
 SIA_implement_rural_reforms_countdown: "Wdrożenie reform rolnych"
 SIA_implement_absolutist_reforms_countdown: "Wdrożenie reform absolutystów"
 SIA_seek_support_from_absolutists_monarchists: "Poszukiwanie wsparcia monarchistów absolutystycznych"
 SIA_seek_support_from_absolutists_monarchists_tt: "Zyskamy poparcie monarchistów absolutystycznych.\n\nPomogą nam w wojnie domowej, zapewniając dodatkowe dywizje. Oczekują jednak, że pozostaniemy monarchią absolutną, wykonując cel §Y$SIA_an_absolute_monarchy$§! w ciągu §Y720 dni§! od zdobycia władzy.\n\nNieuczynienie tego spowoduje spadek §Ystabilizacji§! i §Ypoparcia wojny§!."
 SIA_appeal_to_navy_clique: "Apel do kliki morskiej"
 SIA_appeal_to_navy_clique_countdown: "Wdrażanie reform marynarki"
 SIA_appeal_to_navy_clique_tt: "Zyskamy poparcie kliki morskiej.\n\nPomogą nam w wojnie domowej, zapewniając milicje. Oczekują jednak, że w zamian uchwalimy korzystne dla marynarki reformy, wykonując cel §Y$SIA_thonburi_class_coastal_defense_ship$§! w ciągu §Y720 dni§! od zdobycia władzy.\n\nNieuczynienie tego spowoduje spadek §Ystabilizacji§! i §Ypoparcia wojny§!\n\n. Na początku wojny domowej otrzymamy:\n§YNaszą całą marynarkę§!\n§YKorpus Tajskiej Królewskiej Piechoty Morskiej§!\nTechnologię §Ypiechoty morskiej§!"
 SIA_appeal_for_support_cat: "Prośba o wsparcie"
 SIA_appeal_for_support_cat_desc: "Żadna siła polityczna nie odniesie sukcesu w pojedynkę. Monarchiści, konstytucjonaliści, żołnierze i cywile sprawują władzę nad poszczególnymi częściami kraju. Musimy starannie pielęgnować ich poparcie, jeśli chcemy mieć siłę do działania, gdy nadejdzie właściwy moment."
 SIA_demand_independence: "Żądanie niezależności dla: §Y[FROM.GetName]§! od: §Y[FROM.OVERLORD.GetNameDef]§!"
 SIA_demand_independence_VIN: "Żądanie uwolnienia: §Y[VIN.GetName]§!"
 SIA_demand_independence_VIN_tt: "Zażądamy, by zarządcy uwolnili: [VIN.GetName]"
 SIA_demand_independence_LAO: "Żądanie uwolnienia: §Y[LAO.GetName]§!"
 SIA_demand_independence_LAO_tt: "Zażądamy, by zarządcy uwolnili: [LAO.GetName]"
 SIA_demand_independence_CAM: "Żądanie uwolnienia: §Y[CAM.GetName]§!"
 SIA_demand_independence_CAM_tt: "Zażądamy, by zarządcy uwolnili: [CAM.GetName]"
 SIA_invite_to_adc: "Zaproszenie do naszej frakcji: §Y[FROM.GetName]§!"
 SIA_asian_democratic_compact_cat: "Azjatycki Pakt Demokratyczny"
 SIA_asian_democratic_compact_cat_desc: "Narody Azji mają prawo do samodzielnego sprawowania władzy. Jako orędownicy azjatyckiego prawa do samostanowienia możemy wywierać presję na kolonialne mocarstwa, by uwolniły narody, które trzymają w niewoli."
 SIA_khana_ratsadon_cat: "Khana Ratsadon"
 SIA_khana_ratsadon_cat_desc: "Partia Khana Ratsadon, czyli partia ludowa, która położyła kres monarchii absolutnej, nie jest monolitem. Jej skrzydło wojskowe i cywilne mają własne wizje przyszłości kraju, a napięcie między nimi jest odczuwalne przy każdej podejmowanej decyzji. Trzeba zadbać o zadowolenie obu frakcji, aby koalicja się nie rozpadła."
 SIA_army_navy_reform_cat: "Armia i marynarka wojenna"
 SIA_army_navy_reform_cat_desc: "Armia i marynarka wojenna rywalizują o tę samą ograniczoną pulę zasobów. Przesuwanie środków między tymi dwoma rodzajami sił zbrojnych wymaga ciągłego balansowania, a każda relokacja ma wpływ na gotowość bojową drugiej ze stron."
 SIA_divert_army_funds_to_navy_toggle: "[SIA_GetDivertingArmyFundsToNavyTitle]"
 SIA_divert_army_funds_to_navy_toggle_tt: "[SIA_GetDivertingArmyFundsToNavyTT]"
 SIA_divert_army_funds_to_navy_toggle_do: "Przekierowanie funduszy armii do marynarki"
 SIA_divert_army_funds_to_navy_toggle_do_tt: "Przekierujemy część funduszy naszej armii do marynarki wojennej, by przyspieszyć jej rozwój."
 SIA_divert_army_funds_to_navy_toggle_undo: "Koniec przekierowywania funduszy armii do marynarki"
 SIA_divert_army_funds_to_navy_toggle_undo_tt: "Nie będziemy już przekierowywać części funduszy naszej armii do marynarki wojennej."
 SIA_standing_our_ground_mission: "Walka za wszelką cenę"
 SIA_standing_our_ground_mission_tt: "Musimy walczyć o naszą wolność."
 SIA_sway_generals_to_seri_thai_tt: "Gdy wybuchnie wojna domowa, generałowie, których przekonaliśmy do przejścia na stronę Seri Thai, dołączą do nas, a nie do rewolucji lojalistów."
 SIA_sway_general_cw_scale_tt: "Zwiększa nasze poparcie w wojnie domowej o §Y5%§!\nJeśli poparcie wyniesie ponad §Y80%§!, uda się uniknąć wojny domowej i bezkrwawo przejmiemy władzę."
 SIA_sway_luang_chawengsaksongkhram_to_seri_thai: "Przekonanie Luanga Chawengsaksongkhrama"
 SIA_sway_luang_chawengsaksongkhram_to_seri_thai_desc: "Zdobądźmy poparcie Luanga Chawengsaksongkhrama dla sprawy Seri Thai. Jeśli to się powiedzie, opowie się ona po naszej stronie, gdy wybuchnie wojna domowa."
 SIA_sway_aditya_dibabha_to_seri_thai: "Przekonanie Aditya Dibabhy"
 SIA_sway_aditya_dibabha_to_seri_thai_desc: "Zdobądźmy poparcie Aditya Dibabhy dla sprawy Seri Thai. Jeśli to się powiedzie, opowie się ona po naszej stronie, gdy wybuchnie wojna domowa."
 SIA_sway_mangkorn_phromyothi_to_seri_thai: "Przekonanie Mangkorna Phromyothiego"
 SIA_sway_mangkorn_phromyothi_to_seri_thai_desc: "Zdobądźmy poparcie Mangkorna Phromyothiego dla sprawy Seri Thai. Jeśli to się powiedzie, opowie się ona po naszej stronie, gdy wybuchnie wojna domowa."
 SIA_sway_luang_haansongkhram_to_seri_thai: "Przekonanie Luanga Haansongkhrama"
 SIA_sway_luang_haansongkhram_to_seri_thai_desc: "Zdobądźmy poparcie Luanga Haansongkhrama dla sprawy Seri Thai. Jeśli to się powiedzie, opowie się ona po naszej stronie, gdy wybuchnie wojna domowa."
 SIA_sway_charun_rattanakun_seriroengrit_to_seri_thai: "Przekonanie Charuna Rattanakuna Seriroengrita"
 SIA_sway_charun_rattanakun_seriroengrit_to_seri_thai_desc: "Zdobądźmy poparcie Charuna Rattanakuna Seriroengrita dla sprawy Seri Thai. Jeśli to się powiedzie, opowie się ona po naszej stronie, gdy wybuchnie wojna domowa."
 SIA_sway_phichit_kriangsakphichit_to_seri_thai: "Przekonanie Phichita Kriangsakphichita"
 SIA_sway_phichit_kriangsakphichit_to_seri_thai_desc: "Zdobądźmy poparcie Phichita Kriangsakphichita dla sprawy Seri Thai. Jeśli to się powiedzie, opowie się ona po naszej stronie, gdy wybuchnie wojna domowa."
 SIA_sway_jira_wichitsongkhram_to_seri_thai: "Przekonanie Jiry Wichitsongkhrama"
 SIA_sway_jira_wichitsongkhram_to_seri_thai_desc: "Zdobądźmy poparcie Jiry Wichitsongkhrama dla sprawy Seri Thai. Jeśli to się powiedzie, opowie się ona po naszej stronie, gdy wybuchnie wojna domowa."
 SIA_sway_phin_choonhavan_to_seri_thai: "Przekonanie Phina Choonhavana"
 SIA_sway_phin_choonhavan_to_seri_thai_desc: "Zdobądźmy poparcie Phina Choonhavana dla sprawy Seri Thai. Jeśli to się powiedzie, opowie się ona po naszej stronie, gdy wybuchnie wojna domowa."
 SIA_sway_tiang_sirikhan_to_seri_thai: "Przekonanie Tianga Sirikhana"
 SIA_sway_tiang_sirikhan_to_seri_thai_desc: "Zdobądźmy poparcie Tianga Sirikhana dla sprawy Seri Thai. Jeśli to się powiedzie, opowie się ona po naszej stronie, gdy wybuchnie wojna domowa."
 SIA_khana_ratsadon_dummy_military: "Ryzyko przewrotu wojskowego"
 SIA_khana_ratsadon_dummy_military_tt: "Zbytnia antagonizacja sił zbrojnych może doprowadzić do przewrotu wojskowego. Stan \"§Y$idea_SIA_military_rebellious$§!\" nie może utrzymywać się zbyt długo, jeśli chcemy uniknąć wojny domowej."
 SIA_khana_ratsadon_dummy_military_desc: "Wojsko stanowi potężną klikę w partii Khana Ratsadon. Nie poprze działań, które uzna za sprzeczne ze swoimi interesami, ale będzie popierać rozwiązania sprzyjające militaryzacji kraju."
 SIA_khana_ratsadon_military_coup_mission: "Wojsko planuje obalić rząd!"
 SIA_khana_ratsadon_military_coup_mission_desc: "Wojsko postrzega obecną politykę rządu jako zagrożenie dla swoich interesów. Jeśli jego pozycja się nie poprawi, planuje doprowadzić do upadku rządu."
 SIA_khana_ratsadon_dummy_civilian: "Ryzyko przewrotu ze strony cywilnego skrzydła"
 SIA_khana_ratsadon_dummy_civilian_tt: "Zbytnia antagonizacja cywilnego skrzydła może doprowadzić do przewrotu wojskowego. Stan \"§Y$idea_SIA_civilian_rebellious$§!\" nie może utrzymywać się zbyt długo, jeśli chcemy uniknąć wojny domowej."
 SIA_khana_ratsadon_dummy_civilian_desc: "Cywilne skrzydło stanowi potężną klikę w partii Khana Ratsadon. Nie poprze działań, które uzna za sprzeczne ze swoimi interesami, ale będzie popierać rozwiązania, które uzna za sprzyjające demokracji i ludności cywilnej."
 SIA_khana_ratsadon_civilian_coup_mission: "Cywilne skrzydło planuje obalić rząd!"
 SIA_khana_ratsadon_civilian_coup_mission_desc: "Cywilne skrzydło postrzega obecną politykę rządu jako zagrożenie dla swoich interesów. Jeśli jego pozycja się nie poprawi, planuje doprowadzić do upadku rządu."
 SIA_promote_civilian_wing: "Zabieganie o poparcie skrzydła cywilnego"
 SIA_promote_civilian_wing_desc: "Udzielając rządowego poparcia planom skrzydła cywilnego dotyczącym reformy rolnej, zmian w sądownictwie i konstytucji możemy zyskać wdzięczność frakcji Pridiego. Jednak takie faworyzowanie na pewno zostanie zauważone, korpus oficerski będzie niezadowolony, a gdy kurz opadnie, zakłócenia w codziennym zarządzaniu wywołają ogromne koszty."
 SIA_promote_military_wing: "Zabieganie o poparcie skrzydła wojskowego"
 SIA_promote_military_wing_desc: "Jeśli spełnimy żądania oficerów i zaprezentujemy potęgę sił zbrojnych, możemy zyskać wdzięczność frakcji Phibuna. Jednak takie faworyzowanie na pewno zostanie zauważone, zmiana polityki wywoła zamieszanie w funkcjonowaniu armii, a gdy kurz opadnie, zakłócenia w codziennym zarządzaniu wywołają ogromne koszty. To tępe narzędzie, którego jedynym zadaniem jest zapobieżenie buntowi skrzydła wojskowego."
 SIA_cultivate_civilian_wing: "Kultywowanie stosunków ze skrzydłem cywilnym"
 SIA_cultivate_civilian_wing_desc: "Dyrektywa biura pałacu królewskiego dała establishmentowi wysoką pozycję, co otwiera drzwi do cierpliwego, trwałego zabiegania o poparcie skrzydła cywilnego. Nie doszło do żadnego faworyzowania, które mogłoby wywołać negatywne skutki. Przed nami jedynie powolna, ciągła praca nad zdobyciem przychylności frakcji Pridiego, ustępstwo za ustępstwem. Czeka nas długa droga, ale możemy zajść nią tak daleko, jak zechcemy."
 SIA_cultivate_military_wing: "Kultywowanie stosunków ze skrzydłem wojskowym"
 SIA_cultivate_military_wing_desc: "Dyrektywa biura pałacu królewskiego dała establishmentowi wysoką pozycję, co otwiera drzwi do cierpliwego, trwałego zabiegania o poparcie skrzydła wojskowego. Nie doszło do żadnego faworyzowania, które mogłoby wywołać negatywne skutki. Przed nami jedynie powolna, ciągła praca nad zdobyciem przychylności korpusu oficerskiego, ustępstwo za ustępstwem. Czeka nas długa droga, ale możemy zajść nią tak daleko, jak zechcemy."
 SIA_end_factionalism_mission: "Utrzymywanie spójności koalicji"
 SIA_end_factionalism_mission_desc: "W tej chwili oba skrzydła Khana Ratsadon w pełni popierają rząd. Jeżeli utrzymamy ich §Gcałkowite poparcie§! przez §Y270§! dni, rywalizacja między nimi może zakończyć się na dobre. Jeżeli entuzjazm któregoś ze skrzydeł osłabnie, będziemy musieli zacząć naszą pracę od nowa."
