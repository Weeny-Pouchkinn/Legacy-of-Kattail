 AST_communism_support_text: "[?party_popularity_100@communism|Y]% poparcia dla komunistów"
 AST_union_control_1_cat: "Kontrola nad związkami"
 AST_union_control_1_cat_desc: "Członkowie naszego związku zaczęli mobilizować poparcie wśród ogółu społeczeństwa w całej Australii. Możemy przeniknąć do organów ustawodawczych w poszczególnych stanach, budując poparcie dla rządu kierowanego przez komunistów od wewnątrz. Będzie to wymagało znacznego nakładu sił politycznych i grozi destabilizacją kraju.\n\nWeterani z Nowej Gwardii bacznie obserwują nasze działania i jeśli rząd nie podejmie działań na czas lub sytuacja w kraju stanie się zbyt niestabilna, konflikt ten może spowodować całkowity rozpad kraju.\n\nPoparcie dla komunistów: [?party_popularity_100@communism|Y]§Y%§!\n\n§RJeśli poziom stabilizacji spadnie poniżej 40% lub jeśli upłynie limit czasu buntu weteranów, wybuchnie wojna domowa.§!"
 AST_union_control_1_cat_name: "Wybierz, jak zmobilizować związki zawodowe do poparcia twojej sprawy"
 AST_union_control_1_map_area_name: "Regiony, na które nadal można wywierać wpływ"
 AST_nationalizing_cat: "Nacjonalizacja"
 AST_union_control_2_cat: "Kontrola nad związkami"
 AST_union_control_2_cat_desc: "[ROOT.GetNonIdeologyName] i popierający tę ideologię robotnicy nie obalili swoich ciemiężców po to, by patrzeć, jak imperialistyczne mocarstwa nadal trzymają naszych towarzyszy za oceanem w kajdanach. Szerzenie komunizmu poza granice naszego kraju to nie tylko cel ideologiczny, ale strategiczna konieczność. Musimy podsycać ogień rewolucji za oceanem, dając nadzieję i środki tym, którzy pragną zrzucić jarzmo imperializmu, aż stary porządek straci wszelkie oparcie."
 AST_union_control_2_foreign_cat: "Tłumienie komunizmu"
 AST_union_control_tt: "W różnych regionach Australii muszą powstać związki zawodowe, lecz weterani z Nowej Gwardii starają się powstrzymać rozwój komunizmu."
 AST_seize_local_leadership_in_state_major: "[FROM.GetName]: przejęcie lokalnej władzy"
 AST_seize_local_leadership_in_state_mid: "[FROM.GetName]: przejęcie lokalnej władzy"
 AST_seize_local_leadership_in_state_low: "[FROM.GetName]: przejęcie lokalnej władzy"
 AST_seize_local_leadership_in_queensland: "Przejęcie lokalnej władzy w Queensland"
 AST_union_strike: "Organizowanie strajku"
 AST_union_strike_desc: "Nasi robotnicy opuszczają swoje miejsca pracy, domagając się lepszych warunków i praw. Z pewnością wywrze to presję na rząd, by wprowadził nowe reformy."
 AST_veterans_revolt: "Bunt weteranów"
 AST_veterans_revolt_desc: "W armii jest mnóstwo przeciwników komunizmu, a wielu z nich należało wcześniej do faszystowskich ugrupowań. Ci ludzie gardzą komunizmem i prędzej sięgną po broń, niż zgodzą się na to, by stał się panującym ustrojem.\nJeśli będziemy za długo zwlekać z naszą rewolucją, lub pozwolimy, by poziom stabilizacji spadł zbyt nisko, wezmą sprawy w swoje ręce i całkowicie nam ją uniemożliwią."
 AST_organize_in_nation: "Infiltracja związków zawodowych w: §Y[FROM.GetName]§!"
 AST_organize_in_nation_desc: "Ruch robotniczy nie zna granic. Kierując środki do siatek naszych towarzyszy, możemy wprowadzić komunistycznych działaczy do [FROM.GetAdjective] związków zawodowych, budując oddolne poparcie dla rewolucji w szeregach klasy robotniczej."
 AST_civil_war_in_nation: "§Y[FROM.GetName]§!: wszczęcie rewolucji"
 AST_civil_war_in_nation_desc: "Zasiane przez nas ziarno jest gotowe, by wydać plon. Poparcie dla komunistów w [FROM.GetAdjective] społeczeństwie wzrosło do tego stopnia, że otwarta rewolucja jest już w zasięgu ręki. Dzięki funduszom, agitatorom i starannie zaplanowanej akcji możemy przekształcić niezadowolenie społeczne w zbrojne powstanie, dzięki czemu [FROM.GetName] będzie o krok bliżej do upragnionego państwa robotniczego."
 AST_take_it_to_foreign_streets: "Organizacja międzynarodowego marszu solidarności robotniczej"
 AST_take_it_to_foreign_streets_desc: "Robotnicy nie znają granic. Rozpoczniemy skoordynowaną międzynarodową kampanię, wysyłając australijskich działaczy komunistycznych na ulice wszystkich krajów, w których udało nam się już zdobyć przyczółek, ożywiając w ten sposób lokalne ruchy i podtrzymując płomień rewolucji."
 AST_take_it_to_foreign_streets_tt: "Wydłuża czas trwania wpływów zagranicznych komunistów o 60 dni we wszystkich zinfiltrowanych obecnie krajach."
 AST_raj_locked_tt: "Cesarstwo Indyjskie nie może być celem do chwili, aż Nowa Zelandia, Malaje, Birma, Filipiny i Indonezja znajdą się pod panowaniem komunistów."
 AST_supply_arms_to_nation: "Dostawy broni dla: §Y[FROM.GetName]§!"
 AST_supply_arms_to_nation_desc: "Zaopatrzymy naszych towarzyszy w broń."
 AST_strikes_tt: "Decyzje §Y$AST_workers_educational_association$§!, §Y$AST_off_leash$§! §Y$AST_a_national_housing_commission$§! §Y$AST_guaranteed_employment$§! i §Y$AST_equal_pay$§! możesz ukończyć tylko podczas trwającego strajku."
 AST_nationalization: "Rozpoczęcie nacjonalizacji"
 AST_nationalizing_process_tt: "Umożliwia podjęcie decyzji §YRozpoczęcie nacjonalizacji§! i zastosowanie decyzji §YTrwająca nacjonalizacja§!. Wymagane dla poniższych celów i znika po ukończeniu celu §YAustralia dla obywateli§!. §RNiewybrane cele zostaną zablokowane!§!"
 AST_nationalization_underway_tt: "§YTrwająca nacjonalizacja§! \nMoc przerobowa fabryk: §R-30%§! \nWydajność stoczni: §R-30%§!"
 AST_nationalizing_process_ends_tt: "§RWybranie tego celu zablokuje wszystkie powyższe cele!§!"
