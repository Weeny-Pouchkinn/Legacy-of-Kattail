 AST_election_approaching_cat: "Nadchodzą wybory"
 AST_election_approaching_cat_desc: "Ledwie rząd zdąży się zadomowić, a już zbliżają się kolejne wybory. Partie demokratyczne robią wszystko, co w ich mocy, by zdobyć jak największe poparcie, mając nadzieję, że wystarczy to do osiągnięcia zwycięstwa, gdy tylko otworzą się lokale wyborcze, a urny zapełnią się głosami."
 AST_final_reforms_mission: "Ostateczne reformy"
 AST_final_reforms_mission_desc: "Dzięki stabilnemu przywództwu, konserwatywnym skłonnościom i lojalności wobec Wielkiej Brytanii, PZA zyskała silne wsparcie i zapewniła sobie duże szanse na kolejną kadencję. Aby nie stracić poparcia opinii publicznej, jej przywódcy muszą przyspieszyć wprowadzanie reform.\n\n§YGdy są aktywne, zapewniają efekty:§!\n§W(§YDemokratyczne§! cele):\nSkrócenie czasu ukończenia o §Y7§! dni.§!"
 AST_final_reforms_effect_tt: "\nEfekty, gdy §Y$AST_final_reforms_mission$§! są aktywne (§Y180§! dni):"
 AST_labor_campaign_tour_mission: "Objazdowa kampania Partii Pracy"
 AST_labor_campaign_tour_mission_desc: "Dążąc do reprezentowania wszystkich obywateli, APP przyjęła inne stanowisko w sprawie imperializmu i lojalności Australii wobec Imperium. Potrzeby kraju powinny być priorytetem, a obce interesy zejść na dalszy plan.\n\nAby rozpowszechnić ten przekaz wśród rządzącej partii i elektoratu, APP wyruszy na objazdową kampanię po całym kraju.\n\n§YGdy jest aktywna, zapewnia efekty:§!\n§WDzienny przyrost głosów na §YAPP§!: §G+0,05§!§!."
 AST_labor_campaign_tour_effect_tt: "\nEfekty, gdy §Y$AST_labor_campaign_tour_mission$§! jest aktywna (§Y180§! dni):\nDzienny przyrost głosów na §YAPP§!: §G+0,05§!\n\nEfekty za §Y180§! dni:"
 AST_election_season_cat: "Sezon wyborczy"
 AST_election_season_cat_desc: "Poprzedni rząd nie zdążył się nawet wygodnie rozsiąść, a już kolejny zamierza zająć jego miejsce. Niewiele można zrobić, by przekonać opinię publiczną, choć partie nie przestaną próbować. Walka trwa do końca, a ten nastąpi dopiero przy urnach wyborczych."
 AST_election_countdown: "Odliczanie do wyborów"
 AST_election_countdown_desc: "Do otwarcia lokali wyborczych pozostało zaledwie kilka dni.\n\n§W$AST_expected_election_winner_tt$§!"
 AST_government_formation_period: "Czas tworzenia rządu"
 AST_government_formation_period_desc: "Każda partia chce móc decydować o swojej polityce, lecz w określonych warunkach najrozsądniejszym wyborem jest Rząd Jedności Narodowej.\n\n§W§YEfekty, gdy jest aktywny:§!\n£GFX_trigger_yes $AST_election_recently_concluded$\n\n$AST_ruling_party$ może utworzyć §YRząd Jedności Narodowej§!.\n\nUtwórz §YRząd Jedności Narodowej§! w oknie demokratycznych wyborów w australijskim drzewku celów narodowych.§!"
 AST_war_is_coming_cat: "Nadchodzi wojna"
 AST_war_is_coming_cat_desc: "Napięcie rośnie i zarówno australijscy urzędnicy, jak i obywatele zaczynają zdawać sobie sprawę, że wojna może być nieunikniona, niezależnie od tego, jak bardzo niekorzystna byłaby dla ich polityki czy interesów.\n\nMusimy zwołać posiedzenie rządu, aby uzgodnić procedury na wypadek inwazji. Zanim jednak to zrobimy, warto podjąć działania, z którymi cały rząd może się nie zgodzić."
 AST_seize_civilian_industry: "Przejęcie cywilnego przemysłu"
 AST_seize_civilian_industry_desc: "Chociaż dobra konsumpcyjne są niezbędne zarówno dla naszych obywateli, jak i dla gospodarki, nie da się zaprzeczyć, że w czasie wojny pojawiają się pilniejsze potrzeby. Wojna nadchodzi; musimy być na nią przygotowani."
 AST_scorch_the_north: "Spalona Północ"
 AST_scorch_the_north_desc: "Jeśli podejrzewamy inwazję z północy, istnieją sposoby, by ją powstrzymać, choć wiążą się one z pewnymi kosztami. Chociaż polityka spalonej ziemi spowolni rozwój naszych północnych stanów, może być konieczna, by odeprzeć agresorów."
 AST_scorch_the_north_tt: "§YEfekty, kiedy w regionie północnym dojdzie do desantu morskiego:§!"
 AST_the_brisbane_line: "Linia Brisbane"
 AST_the_brisbane_line_desc: "Zdolności obronne Australii mogą nie być wystarczająco silne, by całkowicie powstrzymać zagraniczną agresję. Przyjmując politykę, która nadaje priorytet silnej obronie kluczowych terytoriów, a nie słabej obronie wszystkich obszarów, możemy zadbać o to, by najbardziej rozwinięte i zaludnione części, na których polega [AST.GetName], pozostały pod naszą kontrolą.\n\nChociaż taka polityka bez wątpienia spotka się ze sprzeciwem tych, którzy odrzucają wszelkie ustępstwa, rząd ma obowiązek kierować australijską politykę w rozsądnym kierunku."
 AST_summon_the_cabinet_mission: "Zwołanie gabinetu"
 AST_summon_the_cabinet_mission_desc: "Musimy wezwać do Canberry dyplomatów, urzędników i teoretyków, by omówić kwestię potencjalnej inwazji."
 AST_summon_the_cabinet_tt1: "\nTo wydarzenie zachwieje stabilnością obecnego rządu, co może doprowadzić do jego §Yupadku§!."
 AST_australian_accusations_modifier: "Oskarżenia ze strony Australii"
 AST_cabinet_trust_cat: "Zaufanie gabinetu"
 AST_cabinet_trust_increase_tt: "\n§GZwiększenie§! §Yzaufania gabinetu§!\n"
 AST_cabinet_trust_decrease_tt: "\n§RZmniejszenie§! §Yzaufania gabinetu§!\n"
 AST_cabinet_trust_remove_tt: "§GUsunięcie§! §Yduchów zaufania gabinetu§!"
 AST_australian_comforts_fund: "£BoP_right_texticon  Australian Comforts Fund"
 AST_australian_comforts_fund_desc: "Rząd powinien uhonorować pamięć jednego ze zmarłych w katastrofie lotniczej w Canberze, inwestując w Australian Comforts Fund, gdzie z entuzjazmem pracuje jego żona.\n\nÓw fundusz działa po to, by ułatwić czas spędzany przez australijskich żołnierzy w polu poprzez wysyłanie im zaopatrzenia uzupełniającego racje wojskowe i przedmioty osobiste, dlatego nasz wysiłek wojenny również skorzysta na tej inwestycji."
 AST_eminent_successors: "£BoP_right_texticon Wybitni następcy"
 AST_eminent_successors_desc: "Niektórymi z ofiar katastrofy lotniczej w Canberze byli wysoce poważani przedstawiciele rządu. Choć nic nie zrekompensuje nam tej potwornej straty, być może wyznaczenie kilku wybitnych następców pomoże ustabilizować rząd i odzyskać zaufanie opinii publicznej i ministrów."
 AST_critics_to_shame: "£BoP_right_texticon Haniebni krytycy"
 AST_critics_to_shame_desc: "Katastrofa lotnicza w Canberze wpłynęła na cały naród i dotknęła żałobą każdego Australijczyka. W takich chwilach zawsze znajdą się ludzie próbujący wykorzystać sytuację. Powinniśmy obnażyć najgłośniejszych krytyków jako podjudzaczy burzących porządek, którymi w istocie są."
 AST_approach_the_independents: "£BoP_left_texticon Zwróćmy się do niepodległościowców"
 AST_approach_the_independents_desc: "Rząd jest niestabilny, gdyż wiara w jego umiejętności wyprowadzenia Australii z obecnego zamętu słabnie z dnia na dzień. Jeśli zwrócimy się do niepodległościowców, może zdołamy ich przekonać, że zmiana rządu leży w interesie nas wszystkich."
 AST_a_sound_voice: "£BoP_left_texticon Pewny głos"
 AST_a_sound_voice_desc: "W czasie politycznego zamętu jeden pewny głos wydaje się wzbudzać w Australijczykach zaufanie. Czy to głos kolejnego [AST.GetAdjective] przywódcy?"
 AST_challenge_government_narrative: "£BoP_left_texticon Podważenie rządowej narracji"
 AST_challenge_government_narrative_desc: "Informacje podane przez rząd o katastrofie lotniczej w Canberze wydają się niezwykłe, co prowadzi wprost do spekulacji, że niektóre z nich zatajono. Jak doświadczony pilot RAAF mógł się rozbić w doskonałych warunkach do lotu? Należy naciskać rząd o udzielenie odpowiedzi."
 AST_make_a_common_enemy: "Znalezienie wspólnego wroga"
 AST_make_a_common_enemy_desc: "Głosy nieufności rozbrzmiewają raz za razem po śmierci urzędników w katastrofie lotniczej w Canberze. Nietypowe okoliczności wypadku to nie jedyne przesłanki, które skłaniają do podejrzewania zagranicznego udziału w całym zajściu. W końcu nic tak nie jednoczy jak wspólny wróg."
 AST_make_a_common_enemy_tt: "§RMożliwe efekty wydarzenia:§!"
 AST_ensure_cabinet_loyalty: "Zadbanie o lojalność gabinetu"
 AST_ensure_cabinet_loyalty_desc: "Groźba wotum nieufności nie jest realna, jeśli większość gabinetu głosuje na korzyść panującego rządu. Musimy zadbać o jego lojalność."
 AST_castle_crumbling_mission: "Zamek się wali"
 AST_castle_crumbling_mission_desc: "W obliczu skutków tragicznej katastrofy lotniczej w Canberze Australia spogląda na swoich przywódców. Czy panujący rząd okaże się godny dalszego zaufania publicznego po utracie swoich przedstawicieli? A może najlepszym rozwiązaniem będzie zmiana przywództwa?"
 AST_castle_crumbling_mission_event_tt: "§YEfekty wydarzenia:§!"
 AST_castle_crumbling_mission_complete_tt: "Ukończenie misji §YZamek się wali§!"
 AST_cabinet_trust_complete_1_flag: "Podjęto decyzję: §YZnalezienie wspólnego wroga§!"
 AST_cabinet_trust_complete_2_flag: "Podjęto decyzję: §YZadbanie o lojalność gabinetu§!"
 AST_cabinet_trust_complete_not_tt: "Nie wybrano celu §YAustralia Przede Wszystkim§!"
 AST_canberra_air_disaster_flag: "$AST_canberra_air_disaster_events.1.t$"
 AST_war_angst_cat: "Niepokoje wojenne"
 AST_deteriorating_prime_minister_nerves_mission: "Premier na skraju załamania"
 AST_deteriorating_prime_minister_nerves_desc: "[AST.GetLeader] musi znosić presję nieuniknionej wojny. Jeśli wkrótce nie znajdzie ukojenia, może nie wytrzymać tego nerwowo."
 AST_australian_demands_cat: "Żądania Australii"
 AST_aid_australian_military_construction: "Wsparcie budów wojskowych w Australii"
 AST_aid_australian_military_construction_desc: "Wielka Brytania nie jest gotowa na wojnę. Jeśli wesprzemy Australię w budowach wojskowych, być może ostudzimy jej niecierpliwość."
 AST_japanese_war_mission: "Wojna z Japonią"
 AST_japanese_war_mission_desc: "[JAP.GetNameDef] to straszliwy wróg, z którym Australia nie chce mierzyć się samotnie. Naciska na nas, abyśmy przejęli inicjatywę i jak najszybciej załagodzili nadciągający konflikt."
 AST_resource_acquisition_cat: "Pozyskiwanie zasobów"
 AST_request_resource_rights_in_indonesia: "Prośba o prawa do zasobów w: [INS.GetNameDef]"
 AST_request_resource_rights_in_malaya: "Prośba o prawa do zasobów w: [MAL.GetNameDef]"
 AST_request_resource_rights_in_burma: "Prośba o prawa do zasobów w: [BRM.GetNameDef]"
 AST_request_resource_rights_in_indochina: "Prośba o prawa do zasobów w Indochinach Francuskich"
 AST_resource_request_ongoing_flag: "Prośba o prawa do zasobów §Yjest rozpatrywana§!"
 AST_australia_first_movement_cat: "Ruch Australia Przede Wszystkim"
 AST_summons_to_australian_hall: "Wezwanie do Australian Hall"
 AST_summons_to_australian_hall_desc: "Aby poszerzyć szeregi ruchu [AST.GetFascistParty], musimy zjednoczyć i zmobilizować naszych sojuszników. Australian Hall już czeka."
 AST_summons_to_australian_hall_upgrade: "$AST_summons_to_australian_hall$"
 AST_summons_to_australian_hall_upgrade_desc: "$AST_summons_to_australian_hall_desc$"
 AST_print_the_publicist: "Wydrukowanie publicysty"
 AST_print_the_publicist_desc: "The Publicist, czyli biuletyn ruchu Australia Przede Wszystkim, pomaga nam docierać do potencjalnych sojuszników. Druk kolejnego wydania pozwoli nam szerzyć nasze idee."
 AST_print_the_publicist_upgrade: "$AST_print_the_publicist$"
 AST_print_the_publicist_upgrade_desc: "$AST_print_the_publicist_desc$"
 AST_call_on_fascists: "[GET_AST_CALL_ON_FASCISTS]"
 AST_call_on_fascists_desc: "Australia Przede Wszystkim to mały ruch i nie zawsze potrafi związać koniec z końcem. Jest jednak za granicą grupa o podobnych poglądach, która wyraziła zainteresowanie finansowaniem naszych ambicji i zaoferowała rozwiązanie, które pomoże nam się rozwijać."
 AST_call_on_japanese_fascists: "Zwrócenie się do japońskich faszystów"
 AST_call_on_foreign_fascists: "Zwrócenie się do zagranicznych faszystów"
 AST_a_convenient_disaster: "Dogodna katastrofa"
 AST_a_convenient_disaster_desc: "Niezależnie od tego, jak popularna stanie się partia Australia Przede Wszystkim, konserwatyści zawsze będą sprzeciwiać się jej ideologii. Aby mogła skutecznie przejąć władzę, konieczne może być coś bardziej radykalnego niż zwykłe wybory - coś, co pogrąży rząd w chaosie.\n\nNasz ruch nie jest w stanie samodzielnie wywołać takiego wydarzenia, ale nasi zagraniczni faszystowscy zwolennicy - tak. Pomagając nam w dojściu do władzy, zagraniczni faszyści zyskają [AST.GetAdjective] przyjaciela."
 AST_a_convenient_disaster_tt: "\nTo wydarzenie zachwieje stabilnością obecnego rządu, co ostatecznie pozwoli partii §Y[AST.GetFascistParty]§! przejąć władzę."
 AST_a_convenient_disaster_flag: "§YKatastrofa powietrzna nad Canberrą§! została wywołana przez decyzję §Ydogodna katastrofa§!."
 AST_insufficient_funds_mission: "$AST_insufficient_funds$"
 AST_sufficient_funds_tt: "Wystarczające fundusze (dni do osiągnięcia: §Y[?AST_insufficient_funds:days_left]§!)"
 AST_sufficient_funds_tt_2: "§GZyskaj§! wystarczające fundusze"
 AST_lose_sufficient_funds_tt_100: "§RUtrata§! wystarczających funduszy (na §Y100§! dni)\n"
 AST_lose_sufficient_funds_tt_50: "§RUtrata§! wystarczających funduszy (na §Y50§! dni)\n"
 AST_insufficient_funds: "Niewystarczające fundusze"
 AST_afm_decisions_fascism_upgrade_tt: "\nZwiększenie codziennego poparcia dla faszyzmu §Ydecyzji Ruchu Australia Przede Wszystkim§!.\n\n"
 AST_afm_decisions_autonomy_upgrade_tt: "\nZwiększenie przyrostu autonomii §Ydecyzji Ruchu Australia Przede Wszystkim§!.\n\n"
 AST_vichy_out_of_africa_cat: "Wyparcie Vichy z Afryki"
 AST_demand_madagascar: "Żądanie Madagaskaru"
 AST_demand_central_africa: "Żądanie Afryki Środkowej"
 AST_demand_southwestern_territories: "Żądanie południowo-zachodnich terytoriów"
 AST_vichy_req_ongoing_flag: "Żądanie terytorialne §Yjest rozpatrywane§!"
 AST_remove_vichy_out_of_africa_decisions: "\nUsunięcie decyzji §YWyparcie Vichy z Afryki§!.\n"
 AST_big_business_pact_cat: "Wielki pakt biznesowy"
 AST_big_business_request_ongoing_flag: "Prośba o wielki pakt biznesowy §Yjest rozpatrywana§!"
 AST_naval_expansion: "$NOR_alt_dem_naval_expansion$"
 AST_naval_expansion_desc: "W zamian za to, że [ROOT.GetFascistParty] przyłoży się do korzystnych dla siebie reform, czołowi prominenci biznesowi zgodzili się na inwestycję w reformy przemysłowe dopasowane do celów partii.\n\nTrzeba rozbudować flotę, jeśli [AST.GetName] ma mieć szanse w walce z wrogami dysponującymi większymi siłami morskimi. Przez pewien czas stocznie powinny działać z maksymalną wydajnością, by zwiększyć produkcję okrętów."
 AST_factory_conversions: "Przekształcanie fabryk"
 AST_factory_conversions_desc: "W zamian za to, że [ROOT.GetFascistParty] przyłoży się do korzystnych dla siebie reform, czołowi prominenci biznesowi zgodzili się na inwestycję w reformy przemysłowe dopasowane do celów partii.\n\nPriorytetem musi być przemysł obronny, dlatego należy przekształcić australijskie fabryki, by mogły go wspierać."
 AST_land_development: "Rozwój infrastruktury"
 AST_land_development_desc: "W zamian za to, że [ROOT.GetFascistParty] przyłoży się do korzystnych dla siebie reform, czołowi prominenci biznesowi zgodzili się na inwestycję w reformy przemysłowe dopasowane do celów partii.\n\nZbyt duża część [ROOT.GetAdjective] ziem jest nieuprzemysłowiona i słabo rozwinięta. Jeśli skupimy się na tych regionach, uczynimy je zdatnymi do rozbudowy."
 AST_electrical_grid_expansions: "Rozbudowa sieci energetycznej"
 AST_electrical_grid_expansions_desc: "W zamian za to, że [ROOT.GetFascistParty] przyłoży się do korzystnych dla siebie reform, czołowi prominenci biznesowi zgodzili się na inwestycję w reformy przemysłowe dopasowane do celów partii.\n\nRozbudowując sieć energetyczną, możemy promować krajową produkcję niezależną od importu."
 AST_factory_investments: "Inwestycje w fabryki"
 AST_factory_investments_desc: "W zamian za to, że [ROOT.GetFascistParty] przyłoży się do korzystnych dla siebie reform, czołowi prominenci biznesowi zgodzili się na inwestycję w reformy przemysłowe dopasowane do celów partii.\n\nJeśli chcemy móc polegać w czasie konfliktu zarówno na wojskowym, jak i cywilnym zaopatrzeniu, musimy zwiększyć swój potencjał przemysłowy."
 AST_develop_port_kemla_steel_medium_decision: "Budowa drugiego wielkiego pieca w Port Kembla"
 AST_develop_port_kemla_steel_medium_decision_desc: "Port Kembla funkcjonuje jak dotąd dobrze z tylko jednym wielkim piecem, lecz zapotrzebowanie wzrosło na tyle, że przydałoby się zbudować drugi. Mniej więcej podwoi to produkcję stali w regionie."
 AST_prospect_pilbara_iron_decision: "Otwarcie wydobycia w regionie Pilbara"
 AST_prospect_pilbara_iron_decision_desc: "W regionie Pilbara znajdują się olbrzymie złoża żelaza, jedne z największych na świecie. Inwestycja, jakiej wymagałaby eksploatacja tego niezwykle dalekiego zakątka kraju, byłaby ogromna... choć zyski pewnie by jej dorównały."
 AST_scale_up_pilbara_mines_steel_decision: "Rozbudowa kopalni w Pilbarze"
 AST_scale_up_pilbara_mines_steel_decision_desc: "Skoro region Pilbara otworzył się na wydobycie na większą skalę, czas rozpocząć inwestycję!"
 AST_pilbara_mining_tt: "Otwarcie regionu §Y$STATE_870$§! na dalsze wydobycie pozwoli wielokrotnie decydować o zwiększaniu produkcji stali bez ograniczeń."
 AST_scale_up_middleback_mines_steel_decision_1: "Rozbudowa kopalni Iron Knob"
 AST_scale_up_middleback_mines_steel_decision_1_desc: "Choć kopalnia Iron Knob jest aktywna od jakiegoś czasu, rosnące zapotrzebowanie na żelazo zmusza nas do zwiększenia jej wydajności."
 AST_scale_up_middleback_mines_steel_decision_2: "Otwarcie kopalni Iron Monarch"
 AST_scale_up_middleback_mines_steel_decision_2_desc: "Kopalnia Iron Knob nie zaspokaja naszych potrzeb. Na szczęście góry Middleback są bogate w żelazo. Czas zbudować naszą największą kopalnię w historii!"
 AST_scale_up_middleback_mines_steel_decision_3: "Otwarcie kopalni Iron Prince"
 AST_scale_up_middleback_mines_steel_decision_3_desc: "Zapotrzebowanie na metale w czasie wojny jeszcze nigdy nie było tak wysokie, ale góry Middleback wciąż nam ich dostarczają."
 AST_expand_iron_mining_tt: "Decyzje §Y$AST_exports_for_economic_recovery$§! i §Y$AST_within_reach$§! umożliwiają eksploatację regionu Pilbara w rejonie §Y$STATE_870$§!, zapewniając niemal niewyczerpane źródło §Ystali§!. Możemy dzięki temu napędzić gospodarkę."
 AST_develop_port_kemla_steel_tt: "Pozwoli nam to podjąć decyzję §YBudowa drugiego wielkiego pieca w Port Kembla§!, która znacznie zwiększy naszą produkcję §Ystali§!."
 AST_develop_middleback_tt: "Odblokuje to trzy decyzje, które zwiększą naszą produkcję §Ystali§! w: §Y$STATE_519$§!."
 AST_expand_planned_extraction_pilbara_tt: "§Y$AST_planned_extraction$§! umożliwia eksploatację regionu Pilbara w rejonie §Y$STATE_870$§!, zapewniając niemal niewyczerpane źródło §Ystali§!. Możemy dzięki temu napędzić gospodarkę."
 AST_ireland_weapon_smuggling_cat: "Zbrojenie Irlandczyków"
 AST_smuggle_arms_to_ireland: "Przemyt broni do Irlandii"
 AST_smuggle_arms_to_ireland_desc: "Musimy dostarczyć Irlandczykom broń niezbędną do walki z Brytyjczykami."
 AST_smuggle_arms_to_ireland_ongoing_flag: "Przemyt broni §Ytrwa§!"
 AST_smuggle_arms_to_northern_ireland: "Przemyt broni do Irlandii Północnej"
 AST_smuggle_arms_to_northern_ireland_desc: "Jeśli uda nam się zapewnić Irlandii Północnej dostateczną ilość broni i wystarczające powiązania z Irlandią, zdołamy zagwarantować, że zjednoczy się z Irlandią, zanim Brytyjczycy zdążą interweniować."
 AST_northern_ireland_rises_up: "Powstanie w Irlandii Północnej"
 AST_specialize_on_jungle_combat: "Specjalizacja w walce w dżungli"
 AST_specialize_on_desert_combat: "Specjalizacja w walce na pustyni"
