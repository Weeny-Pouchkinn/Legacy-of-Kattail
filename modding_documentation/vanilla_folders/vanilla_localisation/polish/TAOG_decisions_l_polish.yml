l_polish:
 HOL_recall_conrad_helfrich: "Odwołanie Conrada Helfricha z Indii Wschodnich"
 HOL_recall_conrad_helfrich_desc: "W tych burzliwych czasach musimy przedkładać dobro ojczyzny ponad wszystko inne. Conrad Helfrich jako najlepszy admirał Królewskiej Holenderskiej Marynarki Wojennej musi powrócić do Holandii."
 INS_is_taking_volksraad: "Obecnie uchwala prawo w Volksraadzie"
 INS_volksraad_cat: "Volksraad"
 INS_volksraad_cat_desc: "Rada Ludowa, zwana w Holandii Volksraadem, została stworzona w 1918 roku w ramach próby wprowadzenia demokracji do Indii Wschodnich za pomocą tak zwanej etycznej polityki. W radzie zasiadają zarówno holenderscy, jak i indonezyjscy przedstawiciele wybierani różnymi sposobami. Choć Holandia zachowuje prawo do bezwarunkowego weta, Volksraad może uchwalać wnioski i uchwały dla rządu."
 INS_volksraad_allow_language_in_schools: "Dopuszczenie języka indonezyjskiego w szkołach"
 INS_volksraad_allow_language_in_schools_desc: "Dostęp do wyższego wykształcenia w Indiach jest w większości ograniczony dla Holendrów i bogatych Indonezyjczyków mówiących po holendersku, gdyż to jedyny język używany w szkolnictwie. Po Volksraadzie krąży wniosek, by wprowadzić nauczanie po indonezyjsku, który oczekuje głosu gubernatora generalnego."
 INS_volksraad_allow_language_in_government: "Dopuszczenie języka indonezyjskiego w rządzie"
 INS_volksraad_allow_language_in_government_desc: "Wszystkie stanowiska rządowe w Indiach, także w Volksraadzie, wymagają płynnej znajomości języka holenderskiego, przez co wielu członków tego ciała, szczególnie przedstawiciele rdzennych społeczności, podaje w wątpliwość demokratyczność tej instytucji. Przygotowali oni wniosek, w którym domagają się, by tam, gdzie jest to możliwe, na stanowiskach rządowych mogły pracować osoby posługujące się językiem indonezyjskim."
 INS_volksraad_remove_education_quotas: "Likwidacja systemu limitów edukacyjnych"
 INS_volksraad_remove_education_quotas_desc: "System kształcenia w Indiach Wschodnich obecnie funkcjonuje w oparciu o określone limity przyjmowanych indonezyjskich i holenderskich uczniów. Powoduje to kontrowersje w Volksraadzie z powodu powszechnie panującego poglądu, że układ faworyzuje holenderską stronę. Moglibyśmy dalej przyglądać się latami kłótniom w Volksraadzie o to, jak zreformować system, albo całkowicie znieść limity edukacyjne."
 INS_volksraad_reduce_rubber_export_tax: "Ograniczenie podatku na eksport prywatnego kauczuku"
 INS_volksraad_reduce_rubber_export_tax_desc: "Obecnie prywatne firmy eksportujące kauczuk muszą płacić niebywale wysoki podatek, co pozwala nam utrzymać monopol na rynku. Doprowadziło to jednak to stagnacji gospodarczej w niektórych regionach z powodu tego, że prywatne plantacje nie są tam w stanie funkcjonować. Prawo to było korzystne w momencie jego wprowadzenia, lecz międzynarodowy protekcjonizm przed wielkim kryzysem sprawił, że na eksporcie kauczuku zyskujemy znacznie mniej. Może warto byłoby obniżyć wspomniany podatek, by pobudzić gospodarkę do ruchu."
 INS_volksraad_knil_rank_limit: "Przyjęcie przepisów antydyskryminacyjnych dotyczących stopni wojskowych"
 INS_volksraad_knil_rank_limit_desc: "Choć żadna formalna zasada nie powstrzymuje rdzennych Indonezyjczyków przed awansowaniem w szeregach KHAIW, istnieje niepisana reguła, która im to uniemożliwia, powstrzymując nawet najzdolniejszych wojskowych przed osiągnięciem tytułu przewyższającego pułkownika. Kilka stronnictw Volksraadu zaczęło wywierać naciski na rząd, by docenił starania kompetentnych indonezyjskich oficerów."
 INS_volksraad_legalize_displaying_flag: "Legalizacja wywieszania czerwono-białej flagi"
 INS_volksraad_legalize_displaying_flag_desc: "Publiczne wywieszanie czerwono-białej flagi Indonezji jest obecnie nielegalne, gdyż ma ona powiązania z nacjonalistycznymi, antykolonialnymi organizacjami. Legalizacja flagi stanowiłaby dowód naszej skłonności do współpracy i powtrzymałaby trwającą radykalizację nacjonalistów w całym archipelagu."
 INS_volksraad_education_subsidies_for_indonesians: "Wprowadzenie subsydiów edukacyjnych dla nieholenderskich mieszkańców"
 INS_volksraad_education_subsidies_for_indonesians_desc: "W Volksraadzie wrze debata na temat subsydiów i stypendiów przyznawanych holenderskim studentom w Indiach Wschodnich. Kilku przedstawicieli rdzennych społeczności w Volksraadzie nalega, by objąć tym systemem wszystkich studentów, niezależnie od pochodzenia. Zjednałoby nam to sporą sympatię populacji, choć niemałym kosztem."
 INS_volksraad_indonesian_national_language: "Ustanowienie indonezyjskiego językiem narodowym"
 INS_volksraad_indonesian_national_language_desc: "Język indonezyjski stał się dominującym językiem w wielu częściach archipelagu, zbliżając do siebie różne kultury. Ponieważ jest już dopuszczony do użytku w obrębie stanowisk edukacyjnych i rządowych, wielu przedstawicieli Volksraadu zaczęło zgłaszać wniosek, by został też prawnie uznany jako oficjalny język kolonii i zyskał status równy językowi holenderskiemu."
 INS_volksraad_official_flag: "Legalizacja flagi Indonezji"
 indonesia_volksraad_official_flag_effect_tt: "Nasza flaga zostanie zastąpiona flagą czerwono-białą."
 INS_volksraad_official_flag_desc: "Wnioski w Volksraadzie nawołujące do autonomii osiągnęły cel i to, co jeszcze parę lat temu zwano Holenderskimi Indiami Wschodnimi, jest obecnie Dominium Indonezji. Należy zmienić flagę, by odzwierciedlała te zmiany."
 indonesia_volksraad_passed_6: "Przyjęto przepisy antydyskryminacyjne w siłach zbrojnych"
 INS_autonomy_indonesian_in_schools: "Język indonezyjski dozwolony w szkołach"
 INS_autonomy_indonesian_in_govenment: "Język indonezyjski dozwolony w rządzie"
 INS_autonomy_no_education_quotas: "Zniesienie limitów w szkolnictwie"
 INS_autonomy_reduced_rubber_tax: "Obniżono podatek od eksportu kauczuku"
 INS_autonomy_knil_rank_limit: "Przyjęto przepisy antydyskryminacyjne w siłach zbrojnych"
 INS_autonomy_flag_legalized: "Legalizacja wywieszania czerwono-białej flagi"
 INS_autonomy_education_subsidies: "Subsydia edukacyjne dostępne dla Indonezyjczyków"
 INS_autonomy_national_language: "Uznanie języka indonezyjskiego"
 INS_autonomy_official_flag: "Indonezyjska flaga wprowadzona do użytku"
 INS_move_capital_to_amsterdam: "Przenieś stolicę do Amsterdamu"
 INS_move_capital_to_batavia: "Przenieś stolicę do Batavii"
 INS_sukarno_is_dead: "Sukarno nie żyje"
 INS_atjeh_management: "Akcja policyjna w Aceh"
 INS_atjeh_management_2: "Integracja Aceh"
 INS_soetardjo_petition: "Petycja Soetardjo oczekuje na zatwierdzenie"
 INS_soetardjo_petition_desc: "Odbyła się konferencja okrągłego stołu, o którą nawoływał Soetardjo. Obradujący uznali, że [INS.GetNameDef] musi spełnić szereg gospodarczych warunków, które zapewnią państwu samowystarczalność. Powinniśmy jasno zademonstrować postępy ku tym celom, inaczej [HOL.GetNameDef] ostatecznie obali tę decyzję, by zachować status quo."
 INS_soetardjo_petition_refresh_tt: "Reaktywuje misję: §YPetycja Soetardjo oczekuje na zatwierdzenie§! trwającą §Y120 dni§!."
 INS_soetardjo_pending: "Volksraad debatuje nad petycją Soetardjo o autonomię"
 INS_soetardjo_pending_desc: "Soetardjo to członek Volksraadu znany z dowodzenia pokojowym ruchem nacjonalistycznym. Obecnie organizuje on petycję z prośbą o to, by [INS.GetAdjective] państwu przyznano większą autonomię, i nawołuje do urządzenia konferencji okrągłego stołu pomiędzy holenderskimi i indonezyjskimi przedstawicielami, którzy mieliby porozmawiać o pragnieniach Indonezyjczyków zyskania niezależności jako część holenderskiej Wspólnoty Narodów. Owa petycja jest już tematem debat w Volksraadzie. Po ich zakończeniu musimy się do niej ustosunkować, gdyż niesie ze sobą ogromne konsekwencje."
 INS_flag_legalized: "Wywieszanie czerwono-białej flagi jest już legalne"
 INS_owned_states_at_game_start_tt: "Wszystkie indonezyjskie regiony"
 INS_win_condition_base_republic_warning: "Zniszczyć Indie Wschodnie"
 INS_win_condition_base_republic_warning_desc: "Musimy dalej walczyć, werbować cywilów i pilnować, by ogień płonął w każdej indonezyjskiej duszy. Gdy obalimy administrację Indii, [HOL.GetNameDef] będzie zmuszona się poddać."
 INS_win_condition_base_republic_real: "Zniszczyć Indie Wschodnie"
 INS_win_condition_base_republic_real_desc: "Musimy dalej walczyć, werbować cywilów i pilnować, by ogień płonął w każdej indonezyjskiej duszy. Gdy obalimy administrację Indii, [HOL.GetNameDef] będzie zmuszona się poddać."
 will_complete_when_conditions_met_tt: "Wybór tej decyzji nastąpi automatycznie, gdy zostaną spełnione wstępne warunki."
 INS_militias_cat: "Laskar Rakyat"
 INS_militias_basic_summon: "Mobilizacja cywilów"
 INS_militias_basic_summon_desc: "Będziemy werbować młodych dorosłych i studentów, którzy pragną indonezyjskiej niepodległości, by dołączyli do TKR jako zbrojna milicja."
 INS_militias_kris_repayment: "Milicja KRIS żąda inwestycji w Sulawesi"
 INS_militias_di_mission: "Ruch Darul Islam domaga się reprezentacji"
 INS_militias_jakarta_pemuda_mission: "Pemuda z Dżakarty żądają poprawy edukacji"
 INS_militias_railway_pemuda_mission: "Młodzieżowe bojówki kolejowe palą się do walki"
 INS_revolution_planning_cat: "Podziemna rewolucja"
 INS_revolution_planning_hq: "Stwórz kwaterę główną rewolucji w: [FROM.GetName]"
 INS_revolution_planning_hq_desc: "[FROM.GetName] to miejsce, w którym założymy kwaterę główną naszej milicji. Będzie ona służyć jako centrum dowodzenia bazami milicji na całym archipelagu. Nasza kwatera główna i otaczające ją terytorium będą priorytetem dla misji infiltracji i będziemy stanowić nad nimi silną kontrolę."
 INS_revolution_planning_hq_tt: "Zbudowano co najmniej §Y3§! kwatery główne rewolucji"
 INS_revolution_planning_hq_DONE: "Kwatera główna rewolucji"
 INS_revolution_planning_hq_DONE_desc: "To kwatera główna rewolucji, do której zgłasza się nasza milicja. Będziemy kontrolować ten region po ogłoszeniu niepodległości."
 INS_revolution_planning_hq_DONE_trigger_tt: "Można ustanowić tylko jedną kwaterę główną"
 INS_revolution_planning_envoy_DONE_trigger_tt: "Nie można ustanowić wielu baz w tym samym regionie"
 INS_revolution_planning_envoy_DONE: "Baza milicji w: [FROM.GetName]"
 INS_has_revolutionary_hq: "Ustanowiono kwaterę główną rewolucji"
 INS_revolution_planning_influence_state: "Stwórz bazę milicji w: [FROM.GetName]"
 INS_revolution_planning_influence_state_desc: "[FROM.GetName]: wyślemy tu milicje, by ustanowić dla nich bazę i zapewnić lokalnym rewolucjonistom komunikację z kwaterą główną i łatwiejsze wykonywanie operacji po tym, jak ogłosimy niepodległość."
 INS_revolution_planning_cat_map_name: "Wybierz, gdzie chcesz zarządzać aktywnością milicji"
 INS_state_revolution_hq_tt: "Będziemy kontrolować ten region po ogłoszeniu niepodległości"
 INS_hq_warning: "§W§RUmieszczenie tu kwatery głównej będzie trudne i zużyje większość naszych zasobów.§!§!"
 INS_revolution_points_remaining_tt: "Można zbudować co najmniej §Y1§! bazę milicji więcej (obecnie pozostało: §Y[?INS_revolution_points_remaining]§!)"
 INS_revolution_planning_influence_state_points_notif_tt: "Liczba dodatkowych §Rnienależących do Jawy§! regionów, w których będziemy mogli ustanowić bazę milicji, to §Y[?INS_starting_revolution_points_count]§!."
 INS_revolution_planning_influence_state_points_notif_tt_1: "Będziemy mogli ustanowić bazę milicji tylko w §Y1§! dodatkowym §Rnienależącym do Jawy§! regionie."
 INS_revolution_point_spend_tt: "Powstaje baza milicji w: [FROM.GetName]"
 INS_revolution_points_in_state_tt: "[FROM.GetName]: nie ma tu ustanowionej bazy milicji"
 war_escalation_1_or_more_tt: "Eskalacja wynosi co najmniej §Y1§!"
 war_escalation_2_or_more_tt: "Eskalacja wynosi co najmniej §Y2§!"
