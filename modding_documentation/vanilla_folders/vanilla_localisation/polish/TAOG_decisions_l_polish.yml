 SIA_war_fervor_cat_desc: "Należy rozważnie zarządzać ludzką skłonnością do konfliktów. Niekontrolowane wojenne zapędy zwrócą się przeciwko własnej władzy - rząd, który podsyca ducha walki, nie kierując go w odpowiednim kierunku, może stać się jego kolejnym celem."
 SIA_war_fervor_coup_dummy: "Narastająca gorączka wojenna"
 SIA_war_fervor_coup_dummy_desc: "Jeśli gorączka wojenna społeczeństwa nie znajdzie jakiegoś ujścia, z pewnością zostanie przekierowana na nas."
 SIA_urge_restraint: "Zachęcajmy do rozwagi"
 SIA_war_fervor_coup: "Nieuchronny przewrót"
 SIA_modify_cultural_mandates: "Modyfikuje $idea_SIA_thai_cultural_mandates$ o:"
 SIA_mandate_1: "Pierwszy dekret"
 SIA_mandate_1_desc: "Ludzie z tego kraju będą nazywani Tajami."
 SIA_mandate_1_tt: "§Y[THIS.GetName]§! będzie nosić nazwę §Y$SIA_thailand$§!"
 SIA_mandate_2: "Drugi dekret"
 SIA_mandate_2_desc: "Tajowie nie mogą prowadzić żadnych interesów, nie biorąc pod uwagę korzyści i bezpieczeństwa kraju.\n\nTajowie nie mogą ujawniać obcokrajowcom niczego, co mogłoby zaszkodzić krajowi. Takie działania to akt zdrady narodowej.\n\nTajowie nie mogą działać jako agenci lub przedstawiciele obcokrajowców, nie mając na uwadze korzyści narodu tajskiego, i nie mogą wyrażać opinii obcokrajowców ani opowiadać się po ich stronie w sporach międzynarodowych. Takie działania to akt zdrady narodowej.\n\nTajowie nie mogą potajemnie nabywać ziemi w imieniu obcokrajowców w sposób, który mógłby zagrozić krajowi. Takie działania to akt zdrady narodowej.\n\n Jeśli jakaś osoba dopuszcza się zdrady narodowej, lud tajski ma obowiązek szybko i aktywnie temu przeciwdziałać."
 SIA_mandate_3: "Trzeci dekret"
 SIA_mandate_3_desc: "Zaprzestanie niespójnego określania ludu tajskiego nazwą narodowości lub zgodnie z preferencjami grupy.\n\nNależy używać nazwy Tajowie w odniesieniu do wszystkich ludów tajskich, bez dzielenia ich na mniejsze grupy."
 SIA_mandate_4: "Czwarty dekret"
 SIA_mandate_4_desc: "Widząc podnoszenie lub opuszczanie flagi zgodnie z ceremoniałem rządowym, albo słysząc salut trąbki lub gwizdka, ewentualnie sygnał podniesienia albo opuszczenia flagi, należy oddać jej honory, zgodnie z przepisami lub ceremoniałem.\n\nSłysząc hymn państwowy, czy to podczas oficjalnych wydarzeń, czy też w ramach dowolnej ceremonii, uczestnicy i widzowie są zobowiązani oddać honory zgodnie z przepisami lub ceremoniałem.\n\nW przypadku zauważenia osoby nieoddającej honorów, należy przekonać ją, by dostrzegła wagę poszanowania flagi narodowej, hymnu państwowego i hymnu królewskiego."
 SIA_mandate_5: "Piąty dekret"
 SIA_mandate_5_desc: "Tajowie powinni dokładać starań, by spożywać wyłącznie żywność przygotowaną z tajskich produktów.\n\nTajowie powinni dokładać starań, by nosić odzież wyprodukowaną wyłącznie z tajskich produktów.\n\nTajowie powinni wspierać rolniczą, handlową, przemysłową i inną aktywność zawodową współobywateli.\n\nTajowie powinni korzystać z usług publicznych wprowadzonych przez rząd lub obywateli.\n\nTajowie prowadzący działalność rolną, handlową, przemysłową lub inną wspieraną przez ten dekret muszą dążyć do zachowania standardów, poprawy jakości oraz uczciwego prowadzenia swojego interesu."
 SIA_mandate_6: "Szósty dekret"
 SIA_mandate_6_desc: "Hymnem państwowym będzie utwór skomponowany przez Phrę Chenduriyanga, zarchiwizowany w Wydziale Sztuk Pięknych.\n\nSłowa hymnu państwowego zostaną przekazane przez armię."
 SIA_mandate_7: "Siódmy dekret"
 SIA_mandate_7_desc: "Każdy Taj musi wspomagać budowę państwa. Każda sprawna osoba musi pracować w stabilnym zawodzie. Każda osoba niewykonująca żadnego zawodu nie wspomaga kraju i nie zasługuje na szacunek Tajów."
 SIA_mandate_8: "Ósmy dekret"
 SIA_mandate_8_desc: "Słowa hymnu państwowego zostaną skrócone, a słowo \"syjamski\" zostanie zastąpione słowem \"tajski\"."
 SIA_mandate_9: "Dziewiąty dekret"
 SIA_mandate_9_desc: "Tajowie muszą sławić, czcić i szanować język tajski i czuć dumę z posługiwania się nim.\n\nTajowie muszą uważać za obowiązek dobrego obywatela uczenie się języka państwowego, a także powinni przynajmniej czytać i pisać. Tajowie muszą też brać na siebie ważny obowiązek wspierania obywateli, którzy nie mówią po tajsku albo nie potrafią czytać w tym języku.\n\nTajom nie wolno brać miejsca urodzenia, zamieszkania lub akcentu regionalnego za wyznacznik podziałów społecznych. Każdy musi być przekonany, że wszystkie osoby urodzone jako Tajowie mają tę samą tajską krew i posługują się tym samym językiem tajskim. Miejsce urodzenia i akcent niczego nie zmieniają.\n\nTajowie mają obowiązek zachowywać się tak, jak powinni czynić to dobrzy tajscy obywatele, a także zachęcać i instruować osoby, które dotąd nie rozumieją swoich obowiązków, jakie zadania stawia się przed dobrymi obywatelami państwa tajskiego."
 SIA_mandate_10: "Dziesiąty dekret"
 SIA_mandate_10_desc: "Tajowie nie powinni pojawiać się w niestosownych strojach na zgromadzeniach, w miejscach publicznych lub na terenie miast. Niewłaściwy ubiór to między innymi noszenie samej bielizny, odzieży zasłaniającej całe ciało albo chodzenie bez koszuli.\n\nWłaściwy strój Tajów składa się z: uniformów zgodnych z zajmowanym stanowiskiem lub okazją, stonowanego stroju internacjonalistycznego, stonowanego stroju tradycyjnego."
 SIA_mandate_11: "Jedenasty dekret"
 SIA_mandate_11_desc: "Tajowie powinni dzielić swój czas na trzy części. Jedną przeznaczoną na pracę, jedną na sprawy osobiste i jedną na sen oraz odpoczynek. Należy je uporządkować i przestrzegać harmonogramu, aż ten stanie się nawykiem.\n\nTajowie powinni realizować swoje sprawy osobiste w następujący sposób: spożywać posiłki o określonych porach, nie częściej niż cztery razy dziennie, a także przesypiać od sześciu do ośmiu godzin.\n\nTajowie powinni sumiennie wykonywać swoje obowiązki zawodowe, nie zniechęcać się przy tym i nie obijać. Odpoczynek w południe i drugie śniadanie nie powinny zająć więcej niż godzinę. Na koniec dnia pracy należy zażywać ruchu w postaci uprawiania sportu przez co najmniej godzinę, albo poprzez inne aktywności, takie jak ogrodnictwo, opiekowanie się zwierzętami lub sadzenie drzew. Następnie, po prysznicu, należy zjeść kolację.\n\nTajowie powinni wykorzystywać wolny czas wieczorny na wykonywanie niezbędnych prac, rozmowy z rodziną i przyjaciółmi, zdobywanie wiedzy poprzez słuchanie wiadomości radiowych lub czytanie, można też oddawać się innym rozrywkom lub sztuce, jeśli mają ku temu okazję."
 SIA_mandate_12: "Dwunasty dekret"
 SIA_mandate_12_desc: "W miejscach publicznych lub na drogach obywatele powinni pomagać dzieciom, starcom albo niepełnosprawnym.\n\nKtokolwiek przestrzega punktu pierwszego, jest osobą kulturalną i zasługuje na szacunek Tajów."
 SIA_movie_theater_cat: "$SIA_sala_chaloem_thai_movie_theater$"
 SIA_movie_theater_cat_desc: "Srebrny ekran należy do najpotężniejszych narzędzi nowoczesnego państwa. Dzięki starannie dobranym filmom i kampaniom propagandowym rząd może kształtować opinię publiczną, rozbudzać patriotyzm i zagłuszać głosy sprzeciwu."
