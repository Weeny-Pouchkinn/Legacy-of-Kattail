 SIA_limited_war_cat: "Ograniczona wojna"
 SIA_limited_war_cat_desc: "Nie możemy liczyć na to, że pokonamy wielkie mocarstwa regionu w otwartej wojnie - przynajmniej na razie. Realizując nasze cele krok po kroku poprzez starannie zaplanowane działania, stopniowo osłabiamy ich pozycję, podczas gdy nasza siła wciąż rośnie."
 SIA_start_limited_war_indochina: "Rozpocznij ograniczoną wojnę w Indochinach przeciwko państwu [FROM.GetAdjective]"
 SIA_start_limited_war_indochina_tt_main: "Rozpoczyna §Yograniczoną wojnę§! przeciwko państwu §Y[FROM.GetAdjective]§!\nKontrolując wszystkie zaznaczone regiony, których właścicielem jest państwo §Y[FROM.GetName]§!, będziemy mogli je przejąć, nie wywołując wojny na pełną skalę.\n§RUtrata więcej niż [?var:global.limited_war_surrender_threshold|%.0] postępu kapitulacji doprowadzi do naszej przegranej w ograniczonej wojnie§!\n\n§RPrzegranie ograniczonej wojny może zmusić nas od oddania uprzednio zdobytych terytoriów§!"
 SIA_start_limited_war_rejoin_faction: "Tymczasowo opuścimy naszą obecną frakcję i wrócimy do niej, gdy zakończą się §Yograniczone wojny§!."
 SIA_start_limited_war_can_join_faction: "Będziemy mogli ponownie dołączyć do frakcji, gdy skończy się §Yograniczona wojna§!."
 is_not_engaged_in_a_limited_war: "Nie bierze udziału w §Yograniczonej wojnie§!."
 SIA_limited_war_indochina: "[SIA_GetLimitedWarTarget]"
 SIA_limited_war_indochina_desc: "Zajmij wszystkie zaznaczone regiony, by wygrać §Yograniczoną wojnę§! i uniknąć konfliktu na pełną skalę.\n§RUtrata więcej niż [?var:global.limited_war_surrender_threshold|%.0] postępu kapitulacji doprowadzi do naszej przegranej w ograniczonej wojnie§!"
 SIA_limited_war_indochina_target: "§YOgraniczona wojna§! przeciwko: §Y[?var:limited_war_target.GetName]§!"
 SIA_limited_war_indochina_no_target: "Ograniczona wojna zakończona porażką"
 SIA_start_limited_war_malaysia_burma: "Rozpocznij ograniczoną wojnę przeciwko państwu [FROM.GetAdjective]"
 SIA_new_territories_administration_cat: "Administracja nad nowymi terytoriami"
 SIA_new_territories_administration_cat_desc: "Podbój to dopiero początek. Zdobyte przez nas terytoria wymagają zarządzania, rozwoju i obrony, jeśli mają stać się trwałym składnikiem państwa, a nie obciążeniem, które naraża nas na ponowny podbój."
 SIA_finish_the_triangular_defense_network: "Ukończ trójkątną sieć obronną"
 SIA_finish_the_triangular_defense_network_desc: "Po ukończeniu budowy dwóch fortec na północy i południu, możemy połączyć je z Bangkokiem, by stworzyć trójkątną sieć obronną. Jeśli jeden z jej elementów upadnie, pozostałe będą działać dalej."
