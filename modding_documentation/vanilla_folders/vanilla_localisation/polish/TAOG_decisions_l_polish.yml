 INS_no_raids_allowed_tt: "§W§RNajazdy będą niedostępne, gdy ta decyzja jest aktywna.§!§!"
 INS_is_deescalating_tt: "Nie prowadzi już misji deeskalacyjnej"
 INS_escalate_the_conflict: "Eskalacja konfliktu"
 INS_escalate_the_conflict_desc: "Będziemy organizować zamieszki i potyczki z siłami wroga, aby zwiększyć napięcie i doprowadzić do eskalacji konfliktu, aby później móc przeprowadzać bardziej zdecydowane operacje, które spotkają się z mniejszym sprzeciwem międzynarodowym."
 INS_escalate_the_conflict_HOL: "$INS_escalate_the_conflict$"
 INS_escalate_the_conflict_HOL_desc: "$INS_escalate_the_conflict_desc$"
 INS_deescalate_the_conflict: "Prośba o mediacje międzynarodowe"
 INS_deescalate_the_conflict_2: "Rozkaz wstrzymania ognia"
 INS_deescalate_the_conflict_desc: "Holendrzy nie będą z nami negocjować w dobrej wierze. W ich oczach pozostajemy buntownikami, utrudnieniem, którego należy się pozbyć, a nie narodem, z którym trzeba się liczyć. Ale światowe mocarstwa to zupełnie inna sprawa - Haga nie może tak łatwo ich zignorować. Zwrócimy się do społeczności międzynarodowej z prośbą o mediację, aby zagraniczna presja wymusiła to, czego nie jesteśmy w stanie osiągnąć własnymi siłami."
 INS_deescalate_the_conflict_2_desc: "Nasze ataki przyniosły oczekiwany skutek. Garnizon kolonialny zdaje sobie sprawę z zasięgu naszych działań, a Haga wie, że nie damy się zastraszyć. Jednak każde uderzenie daje Holandii nowy pretekst do wysłania kolejnych żołnierzy i statków, a my nie jesteśmy gotowi na otwartą wojnę. Przekażemy naszym dowódcom rozkaz wstrzymania ognia. Kolejny cios zadamy wtedy, kiedy sami uznamy to za stosowne, a nie gdy sprowokują nas do tego Holendrzy."
 INS_renville_tt_HOL: "§W§Y[USA.GetFlag][USA.GetNameDefCap]§! - władze tego kraju dadzą nam ultimatum. Jeśli nie poddamy się i nie wycofamy z Indonezji, §Rwypowiedzą nam wojnę§!§!."
 INS_renville_wont_happen_neutral_tt: "Konflikt zakończy się szybciej niż amerykańskie negocjacje. Nie będą mogli interweniować."
 INS_renville_explain_USA_tt: "Jeśli konflikt nie zostanie zażegnany w ciągu §Y365 dni§!:\n\n"
 INS_renville_timer_mission_republic: "Negocjacje w Renville trwają"
 INS_renville_timer_mission_HOL: "$INS_renville_timer_mission_republic$"
 INS_national_revolution_peace_negotiation: "Negocjacje wycofania się z: [FROM.GetName]"
 indonesia_reduce_escalation_1_effect_tooltip_for_min_4: "Zmniejsza eskalację o §G1§!, ale nie mniej niż do §Y4§!."
 INS_ongoing_influence_process: "Nie jest w trakcie tworzenia bazy milicji"
 INS_current_revolution_strength_3_tt: "W tym regionie panuje aktualnie §Gwysoka§! aktywność milicji."
 INS_current_revolution_strength_0_tt: "W tym regionie milicja nie jest aktualnie aktywna."
 INS_has_spent_points_trigger_tt: "Nie można ustanowić dodatkowych baz milicji"
 INS_national_revolution_cat: "Indonezyjska rewolucja narodowa"
 INS_national_revolution_cat_desc: "Po 350 latach holenderskiej tyranii wzięliśmy sprawy w swoje ręce i ogłosiliśmy niepodległość. Holandia nie uznaje naszej autonomii i wciąż rządzi Indiami jak własną kolonią, uznając nas za zbrodniarzy.\n\nMusimy przejmować kontrolę nad kolejnymi regionami i ważnymi miastami, by obalić holenderski rząd od wewnątrz. Musimy jednak starannie planować manewry i nie przesadzić z agresją, gdyż gwałtowna eskalacja z naszej strony może sprowokować reakcję holenderskiej armii."
 INS_national_revolution_cat_map: "Rozpoczęcie pozorowanych powstań"
 INS_national_revolution_dutch_cat: "Milicje rewolucyjne w Indiach"
 INS_national_revolution_dutch_cat_desc: "Rewolucjoniści w Indiach Wschodnich nielegalnie ogłosili niepodległość i zbrojnie przejęli kontrolę nad regionami Indii. Choć bardzo się staraliśmy, nie zdołaliśmy odzyskać władzy nad tymi terenami z powodu ogromnej liczebności obecnej tam milicji.\n\nMusimy ich powstrzymać, zanim zajmą więcej miast i jeszcze bardziej zdestabilizują indyjską administrację. Choć to ekstremalne rozwiązanie, być może będziemy musieli posłużyć się wojskiem, jeśli nie zaprzestaną tego postępowania."
 INS_HOL_revolution_not_going_well_tt: "§RBez Batavii nie możemy rządzić Indiami. Nie mamy wyboru, musimy negocjować pakt pokojowy z rewolucjonistami.§!"
 INS_gradual_escalation_republic: "Stopniowa eskalacja"
 INS_gradual_escalation_HOL: "Stopniowa eskalacja"
 INS_gradual_escalation_republic_desc: "Holenderskie działania odwetowe nasilają się po każdym naszym rajdzie, a ich patrole wkraczają na tereny, które opuściły już wiele miesięcy temu. Nasi dowódcy donoszą o coraz bardziej zaciętych walkach w miejscach, które od dawna uważano za opanowane, a nasze straty rosną w tempie, które nie pozwala nam nadążyć z uzupełnianiem szeregów. Konflikt rozprzestrzenił się na prowincje, w których w zeszłym roku panował spokój."
 INS_gradual_escalation_HOL_desc: "Doniesienia z naszych placówek stają się z tygodnia na tydzień coraz bardziej niepokojące. Buntownicy atakują w okręgach, w których nie spodziewano się ich obecności, a dowództwo wojskowe w Batavii domaga się podjęcia środków o wiele bardziej zdecydowanych niż kiedykolwiek wcześniej. W Hadze na każdym posiedzeniu rządu maleje liczba tych, którzy niegdyś zalecali cierpliwość."
 INS_national_revolution_republic_win_ins_tt: "Republikańskie milicje [INS.GetAdjective] zyskają §Gfaktyczną kontrolę§! nad tym regionem, a konflikt zakończy się §Gzwycięstwem republikanów§!."
 INS_national_revolution_republic_win_hol_tt: "Republikańskie milicje [INS.GetAdjective] zyskają §Rfaktyczną kontrolę§! nad tym regionem, a konflikt zakończy się §Rzwycięstwem republikanów§!."
 INS_national_revolution_dutch_cat_map: "Zobacz regiony okupowane przez milicje"
 INS_take_batavia: "Przejęcie kontroli nad Jawą"
 INS_take_batavia_desc: "Holenderska chciwość, która skłoniła ich do inwestowania niemal wyłącznie na Jawie i zignorowania wschodnich wysp, sprawiła, że Jawa stała się piętą achillesową całej kolonii. To będzie ich zguba! Nasze siły muszą wedrzeć się na Jawę i zniszczyć holenderską sieć komunikacji i zaopatrzenia, obezwładniając tym samym indyjską administrację."
 INS_hold_batavia_HOL: "Utrzymać Jawę"
 INS_hold_batavia_HOL_desc: "Siły republikańskie rozpoczęły operację przenoszenia większości swoich sił na Jawę, próbując przejąć kontrolę nad całą wyspą. Musimy dalej stawiać im opór. To ryzykowna operacja - jeśli im się nie uda, będziemy mieć szansę na obalenie ich rządu."
 INS_militias_moestopo_mission: "Moestopo żąda awansu za swoje starania"
 INS_militias_pki_uprising_mission: "Powstanie komunistów jest nieuniknione"
 INS_pacific_revolution_cat: "Pacyficzna rewolucja"
 INS_instigate_in_country: "[FROM.GetName]: wszczęcie rewolucji"
 INS_instigate_in_country_desc: "Nasza rewolucja nie skończyła się wraz z wyparciem ostatniego kolonialnego żołnierza z [ROOT.GetAdjective] ziemi. Robotnicy i wieśniacy z regionu [FROM.GetName] cierpią pod tym samym jarzmem, które zrzuciliśmy z siebie, i obecnie uważają nas za dowód tego, że oprawców da się pokonać. Poślemy do nich naszych agitatorów, rozpowszechnimy broszury, ufundujemy im związki zawodowe i podsycimy płomień niezadowolenia, by okoliczności do rewolucji dojrzały."
 INS_launch_revolution: "Wezwanie do rewolucji"
 INS_launch_revolution_desc: "Region [FROM.GetName] dojrzał do rewolucji. Nasi agenci donoszą o rosnących niepokojach w fabrykach i na polach, a lokalne komórki partii są gotowe do działania. Przyszedł czas, by wezwać robotników i wieśniaków z [FROM.GetAdjective] ziem, by zbuntowali się i zagarnęli to, co im się słusznie należy."
 INS_anti_colonialist_bonus: "[FROM.GetName]: propagowanie antykolonialnych nastrojów"
 INS_anti_colonialist_bonus_desc: "Mieszkańcy [FROM.GetAdjective] ziem tyrają na korzyść obcego władcy, zmuszeni służyć cudzym interesom. Przypomnimy im, że poddaństwo to wybór, a ów władca nie jest aż tak silny, na jakiego pozuje."
 INS_revolutionary_sentiment: "Współpraca z [FROM.GetAdjective] rewolucjonistami"
 INS_revolutionary_sentiment_desc: "[FROM.GetName]: są tu ludzie, którzy już podjęli się walki o swoją sprawę. Brak im zorganizowania i zasobów, ale nie determinacji. Koordynując te grupy, możemy przyspieszyć upadek istniejącego porządku, nawet jeśli następująca po tym niestabilność przez krótki czas utrudni zarządzanie krajem."
 INS_arm_militias: "Uzbrojenie lokalnych [FROM.GetAdjective] milicji"
 INS_arm_militias_desc: "Ulotki i przemowy wspierają rewolucję w ograniczonym stopniu. Gdy nadejdzie odpowiedni moment, nasi towarzysze z [FROM.GetAdjective] ziem muszą być gotowi do walki. Nadwyżka broni i zaopatrzenia zostanie przemycona do sympatyzujących z nami milicji, aby reakcyjne siły zmierzyły się z uzbrojoną, a nie bezbronną ludnością."
 INS_arm_militias_tt: "W razie wybuchu wojny domowej komuniści rozpoczną z dodatkowymi dywizjami."
 INS_propoganda_mission: "[FROM.GetName]: szerzenie komunizmu"
 INS_propoganda_mission_desc: "Na teren [FROM.GetAdjective] państwa zostaną wysłani organizatorzy partii, by zakładać kręgi czytelnicze, werbować członków związków zawodowych i szerzyć przekaz rewolucji na wsiach. Nasiona, które dziś zasiejemy, wkrótce dadzą owoce."
 INS_abandon_mission: "Porzucenie misji"
 INS_abandon_mission_desc: "Nasze zasoby nie są nieograniczone, a zmagania na [FROM.GetAdjective] terenie wymagają od nas więcej, niż jesteśmy w stanie dać. Wycofamy zatem swoich agentów i skierujemy wysiłki tam, gdzie są najbardziej potrzebne."
 INS_aslia_cat: "Zjednoczenie Pacyfiku"
 INS_integrate_subject: "Integracja państwa [FROM.GetAdjective]"
 INS_integrate_subject_in_progress: "Jest w trakcie integracji poddanego"
 INS_can_raid_here_HOL: "Region zagrożony najazdem"
 INS_can_raid_here_HOL_tt: "Ten region jest potencjalnym celem lądowego najazdu milicji republiki. Jeśli atak się powiedzie, stracimy to terytorium. Aby ochronić region przed najazdami, możemy rozważyć następujące działania:\n$success_modifier_INS_has_influence_mod_counterplay$\n$success_modifier_INS_defense_modifier_counterplay$\n$success_modifier_INS_naval_dominance_modifier_counterplay$\n- Zwiększenie §Ydominacji powietrznej§!\n- Ograniczenie działalności wywiadowczej wroga\n- Zmniejszenie ruchu oporu w regionie"
 INS_war_escalation_text: "£generic_war_escalation_text_icon Poziom eskalacji: §Y[?INS.INS_war_escalation_level]§!"
 INS_war_escalation_level_tt: "§YObecna eskalacja§!\n\nPoziom eskalacji rośnie z upływem czasu, a także w miarę §Yzajmowania nowych regionów§! przez milicje i działań, które podejmuje [HOL.GetNameDef] w zwalczaniu aktywności milicji. Odpowiednio wysoki poziom eskalacji przeradza się w §Rwojnę totalną§!."
