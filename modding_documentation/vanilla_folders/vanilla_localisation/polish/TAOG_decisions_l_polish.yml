 INS_revolution_war_HOL_desc: "Ci rebelianci zbyt długo pozostają bezkarni. Na powstrzymanie działań milicji przeznaczono zdecydowanie zbyt wiele środków finansowych i zasobów wojskowych, a mimo to buntownicy kontynuują swoją ekspansję. Nie możemy dłużej czekać - jedyną drogą naprzód jest wojna totalna."
