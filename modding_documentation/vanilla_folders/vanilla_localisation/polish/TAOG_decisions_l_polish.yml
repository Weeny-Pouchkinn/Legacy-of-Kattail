 SIA_release_contigency_funds_tt: "Modyfikuje §Y$idea_SIA_contingency_funds$§! o\n"
 SIA_release_contigency_funds_tt2: "na §Y[?var:SIA_contingency_funds]§! mies. Z końcem tego okresu fundusze wyczerpią się. Im dłużej fundusze będą zbierane w czasie pokoju, tym dłużej wystarczą w trakcie wojny."
