 SIA_develop_eastern_burma: "Utwórz Saharat Thai Doem"
 SIA_use_abandoned_french_tools: "Użycie porzuconych francuskich narzędzi"
 SIA_use_abandoned_french_tools_desc: "Francuzi zostawili część swoich ciężkich narzędzi na naszych terenach okupowanych. Możemy je wykorzystać."
 SIA_fortress_saigon: "Twierdza Sajgon"
 SIA_fortress_saigon_desc: "Północna część naszego nowego imperium będzie chroniona przez Hanoi. Góry na północy i Rzeka Czerwona sprawiają, że twierdza może odeprzeć dowolnego napastnika."
 SIA_fortress_hanoi: "Twierdza Hanoi"
 SIA_fortress_hanoi_desc: "Południowe Imperium będzie chronione przez Sajgon. To miasto-twierdza będzie chroniło Bangkok i zatokę [ROOT.GetAdjective] przed najeźdźcami."
