 AST_australia_formables_category_desc: "Choć [AST.GetName] ma korzenie wiążące nas z odległym południem, posiadamy długie ramiona, które mogą sięgać naprawdę daleko, więc inne kraje nie mogą już lekceważyć naszych opinii o wydarzeniach na świecie. Staliśmy się więksi, a być może będziemy jeszcze więksi, więc nowa nazwa naszego kraju powinna to podkreślać. [AST.GetName] to kokon, z którego się wyłoniliśmy, rozpościeramy skrzydła, aby świat mógł nas szanować i podziwiać, teraz nadamy nazwę i wybierzemy barwy nowego państwa na południu: Australazji."
