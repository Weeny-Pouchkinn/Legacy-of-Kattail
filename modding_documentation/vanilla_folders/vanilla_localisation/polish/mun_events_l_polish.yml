l_polish:
 ##CZECHOSLOVAKIA##
 MUN_czech_skoda_priority.t: "Zakłady Škoda"
 MUN_czech_skoda_priority.d: "Zakłady Škoda wytwarzają szeroki wachlarz produktów, od artylerii, aż po czołgi, pociągi i działa morskie. Daje to firmie ogromną elastyczność w postaci przekierowywania zasobów tam, gdzie są najbardziej potrzebne, czym możemy częściowo sterować."
 MUN_czech_skoda_priority.1.a: "Interesujące"
 MUN_czech.2.t.1: "Organizacje paramilitarne z Kraju Sudetów proszą o pomoc"
 MUN_czech.2.t.2: "Korpus Wolnego Kraju Sudetów prosi o pomoc"
 MUN_czech.2.t.3: "Bojówki robotnicze z Kraju Sudetów proszą o pomoc"
 MUN_czech.2.d.1: "W świetle niedawnych wiadomości o naszych zamiarach względem państwa [CZE.GetAdjective], wiele partii politycznych Kraju Sudetów szybko stworzyło organizacje paramilitarne w nadziei, że uda im się osłabić rząd [CZE.GetAdjective] Teraz proszą nas o pomoc w dokonywaniu wypadów na drugą stronę granicy i prowadzeniu działań sabotażowych, które pomogą nam w naszych zmaganiach z [CZE.GetAdjective] reżimem."
 MUN_czech.2.d.2: "W świetnie niedawnych wiadomości o naszych zamiarach względem państwa [CZE.GetAdjective], partie polityczne Kraju Sudetów szybko zmobilizowały swoją organizację paramilitarną: Korpus Wolnego Kraju Sudetów, który sformował swoje jednostki w całym Kraju Sudetów i zaczął atakować [CZE.GetAdjective] obiekty rządowe. Teraz proszą nas o maksymalną pomoc w dokonywaniu wypadów na drugą stronę granicy i prowadzeniu działań sabotażowych, wymierzonych w [CZE.GetAdjective] reżim."
 MUN_czech.2.d.3: "W świetle niedawnych wiadomości o naszych zamiarach względem państwa [CZE.GetAdjective], lokalne partie komunistyczne szybko zmobilizowały bojówki robotnicze, które sformowały swoje jednostki i zaczęły atakować [CZE.GetAdjective] obiekty rządowe w Kraju Sudetów. Teraz proszą nas o maksymalną pomoc w dokonywaniu wypadów na drugą stronę granicy i prowadzeniu działań sabotażowych, wymierzonych w [CZE.GetAdjective] reżim oraz innych kontrrewolucjonistów."
 MUN_czech.2.a: "Oczywiście, że pomożemy."
 MUN_czech.2.b: "Może nie powinniśmy im dalej pomagać."
 MUN_czech.3.t: "Działania partyzanckie w Kraju Sudetów"
 MUN_czech.3.d: "W obliczu niedawnej informacji, że [FROM.getname] zamierza zaanektować Kraj Sudetów, działające tam organizacje paramilitarne rozpoczęły wojnę partyzancką przeciwko nam. Zaczęli atakować budynki rządowe i nasze umocnienia w kilku miejscach. Jeżeli chcemy poprawić naszą sytuację militarną w tym rejonie, musimy uporać się z tymi bojówkarzami."
 MUN_czech.3.a: "Czy może być gorzej?"
 MUN_czech.4.t: "Kryzys zaufania"
 MUN_czech.4.d: "Niedawne wieści o wymierzonej w nas agresji militarnej zatrząsnęły rządem w posadach. [CZE.GetLeader] nie wierzy już w zdolność własnego gabinetu do kierowania krajem w czasie tego kryzysu. Zażądaliśmy, by $CZE_jan_syrovy$ przejął przywództwo i zarządzanie państwem. $CZE_jan_syrovy$ stwierdził, że niezbyt interesuje go przywództwo, jednak [CZE.GetLeader] powiedział mu, że nie ma innego wyboru niż stanąć za sterem, by przeprowadzić nas przez tę burzę."
 MUN_czech.4.a: "Potrzebujemy was bardziej niż kiedykolwiek."
 MUN_czech.4.b: "Nie traćmy głowy."
 MUN_czech.5.t: "Zmarł Tomáš Masaryk"
 MUN_czech.5.d: "Masaryk pełnił rolę stabilizującą w polityce czechosłowackiej przez ponad dwie dekady. Kiedy wydawało się, że powstanie koalicji jest niemożliwe, a impasy polityczne są nie do przełamania, Masaryk, raz za razem, dokonywał politycznych cudów i pomagał wzmocnić oraz rozwijać Czechosłowację, aż stała się takim krajem, jakim ją dziś znamy. Cały kraj odczuje brak tego wielkiego człowieka."
 MUN_czech.5.a: "Był niezastąpionym gigantem polityki."
 MUN_czech.7.t: "Rewizja zobowiązań wobec państwa [CZE.getadjective]"
 MUN_czech.7.d: "Niedawno dotarła do nas wiadomość, że władze [GER.getadjective] chcą zaanektować Kraj Sudetów i są gotowe ruszyć na wojnę z państwem [CZE.getadjective], by osiągnąć ten cel. Mamy porozumienie obronne z rządem [CZE.getadjective], co oznacza, że jeśli wybuchnie wojna [CZE.getadjective]-[GER.getadjective], jesteśmy zobowiązani przyjść mu z pomocą. Jeżeli chcemy tego uniknąć, musimy niezwłocznie wypowiedzieć nasze porozumienia obronne z państwem [CZE.getadjective]"
 MUN_czech.7.a: "Nie opuścimy przyjaciół"
 MUN_czech.7.b: "Nie mielibyśmy szans z [GER.getadjective] potęgą"
 MUN_czech.1001.t: "[FROM.GetNameDefCap] żąda korytarza do: [SOV.GetNameDef]"
 MUN_czech.1001.d: "Pragnąc skoordynować swoje działania militarne z wojskami [SOV.GetAdjective], rząd [FROM.GetAdjective] zażądał od nas przekazania mu przygranicznych regionów [89.GetName] i [91.GetName]."
 MUN_czech.1002.t: "[FROM.GetNameDefCap] domaga się wpływu na Ligę Jugosłowiańską"
 MUN_czech.1002.d: "Po ekspansji na południe rząd [FROM.GetAdjective] przedstawił niecodzienne żądanie. Nie domaga się przejęcia ziemi, ale kontroli nad Ligą Obrony Jugosławii, by stać się protektorem i władcą państw północnych Bałkanów, które w tej chwili są naszymi poddanymi. Twierdzi, że jego kraj będzie lepszym obrońcą niż my, ale to może być tylko wymówka."
 MUN_czech.1002.a: "Może mają rację"
 MUN_czech.1002.b: "Nie, to my chronimy te kraje!"
 MUN_czech.1003.t: "[FROM.GetName] odrzuca żądania"
 MUN_czech.1003.d: "Mimo przekonującej argumentacji przedstawionej przez naszych dyplomatów, [FROM.GetNameDef] nie zamierza zrealizować naszych żądań."
 MUN_czech.1003.a: "Nie dają nam wyboru."
 MUN_czech.1004.t: "[FROM.GetName] rusza na Węgry"
 MUN_czech.1004.d: "[ROOT.capital.GetCapitalVictoryPointName]: dotarły wieści o wojskach [FROM.GetAdjective] zmierzających w stronę granicy [HUN.GetAdjective] Choć władze [HUN.GetAdjective] na pewno niedługo się z nami skontaktują, powinniśmy już zdecydować, czy pomożemy państwu [HUN.GetAdjective] i zyskamy potencjalnego sojusznika, czy też pozwolimy rządowi [FROM.GetAdjective] na dalszą realizację jego planów."
 MUN_czech.1004.a: "Powinniśmy chronić nasze interesy"
 MUN_czech.1004.b: "Nie mieszajmy się w to"
 MUN_czech.1005.t: "[FROM.GetName] żąda terytorium na wybrzeżu"
 MUN_czech.1005.d: "Rząd [FROM.GetAdjective] stopniowo powiększa swoje dominium, a jego przedstawiciele zaczęli się domagać, byśmy oddali im ziemie, które niegdyś należały do [FROM.GetAdjective] szlachty. Twierdzą, że dzięki temu uzyskają dostęp do Adriatyku i najwyraźniej nie interesuje ich nasze zdanie w tej sprawie."
 MUN_czech.1006.t: "[FROM.GetName] proponuje partnerstwo"
 MUN_czech.1006.d: "Władze [FROM.GetAdjective] proponują nam traktat o obronie wzajemnej w nadziei, że połączone siły naszych wojsk odstraszą ewentualnych najeźdźców. Co ciekawe, traktat ten zawiera także utajnione klauzule, w których opisano potencjalną [ROOT.GetAdjective] ekspansję, w której miałby pomóc rząd [FROM.GetAdjective]"
 MUN_czech.1007.t: "[FROM.GetName] żąda współpracy"
 MUN_czech.1007.d: "Nieufność między nami a [FROM.GetAdjective] władzami od czasu powstania ich kraju sprawiła, że teraz domagają się oni naszego podporządkowania pod groźbą inwazji. Co ciekawe, władze [FROM.GetAdjective] odwołują się też do naszych ambicji terytorialnych, obiecując, że w zamian za zrzeczenie się naszych roszczeń wobec ich ziem pomogą nam zdobyć inne interesujące nas regiony."
 MUN_czech.1007.b: "Musimy zachować niepodległość!"
 MUN_czech.1008.t: "[FROM.GetName] proponuje sojusz z: [CZE_invited_country.GetName]"
 MUN_czech.1008.d: "Przedstawiciele władz [FROM.GetAdjective], pomostu łączącego nas z Europą Środkową, zaproponowali nam powiększenie naszego sojuszu poprzez zaproszenie do niego rządu [CZE_invited_country.GetAdjective]."
 MUN_czech.1008.a: "Dalsze odstraszanie agresorów"
 MUN_czech.1008.b: "Nie można od nas oczekiwać, że będziemy bronić całej Europy."
 MUN_czech.1009.t: "[FROM.GetName] zaprasza nas do frakcji [CZE.GetFactionName]"
 MUN_czech.1009.d: "Dyplomaci [FROM.GetAdjective] zakomunikowali nam, że będziemy mile widziani w ich sojuszu. Jednak w przeszłości nasze roszczenia terytorialne były przyczyną sporów w relacjach z [FROM.GetAdjective] władzami. Musimy teraz zdecydować, czy chcemy wciąż wysuwać te roszczenia, czy też skoncentrujemy się na budowaniu bardziej przyjaznych stosunków."
 MUN_czech.1009.a: "Zdrowie naszego nowego sojusznika!"
 MUN_czech.1009.b: "Dołączymy po uznaniu naszych roszczeń"
 MUN_czech.1009.c: "Nie jesteśmy zainteresowani"
 MUN_czech.1010.t: "[FROM.GetName] zaprasza nas do kierowania frakcją [CZE.GetFactionName]"
 MUN_czech.1010.d: "Po niedawnej próbie uczynienia z porozumień Małej Ententy prawdziwego sojuszu rząd [FROM.GetAdjective] przedstawił propozycję: chcą, żebyśmy stanęli na czele tej nowej frakcji. Przekazaliby nam przywództwo, a my zyskalibyśmy cennego obrońcę, układ powiększający nasze wpływy, ale prawdopodobnie w krajach, którym grozi niebezpieczeństwo."
 MUN_czech.1010.a: "Byliby cennymi sojusznikami."
 MUN_czech.1010.b: "Wystarczy nam ochrona państwa [ROOT.GetAdjective]"
 MUN_czech.1011.t: "[FROM.GetName] proponuje porozumienie obronne."
 MUN_czech.1011.d: "W ramach działań zniechęcających do agresji wobec państwa [FROM.GetAdjective] tamtejsi dyplomaci przedstawili nam szkic traktatu o obronie wzajemnej. W zamian za nasze poparcie oferują nam taką samą ochronę, co zmusiłoby ewentualnego agresora do prowadzenia wojny na dwa fronty."
 MUN_czech.1011.a: "Warto zaryzykować"
 MUN_czech.1011.b: "Neutralność to bezpieczniejsze rozwiązanie"
 MUN_czech.1012.t: "[FROM.GetName] domaga się naszego podporządkowania."
 MUN_czech.1012.d: "Rząd [FROM.GetAdjective], ośmielony niedawno zawartym sojuszem, przedstawił nam żądania, których spełnienie byłoby jednoznaczne z utratą naszej niepodległości. Władze [SOV.GetAdjective] interesują się tym regionem, więc musimy postanowić, czy możemy sobie pozwolić na odrzucenie tego ultimatum."
 MUN_czech.1012.a: "Opór oznaczałby niepotrzebną śmierć [ROOT.GetAdjective] obywateli"
 MUN_czech.1012.b: "Lepsza śmierć niż hańba!"
 MUN_czech.1013.t: "[FROM.GetName] proponuje warunkowy sojusz"
 MUN_czech.1013.d: "Po dokładnej analizie rząd [FROM.GetAdjective] ogłosił, że również uważa ewentualny sojusz za korzystny, jednak stwierdził też, iż nie zrezygnuje ze swoich roszczeń terytorialnych. Dlatego złożył nam propozycję: dołączy do naszej frakcji, ale tylko, jeżeli przekażemy mu ziemie, których się domaga."
 MUN_czech.1013.a: "Warto zdobyć się na takie poświęcenie."
 MUN_czech.1013.b: "Próbujemy chronić nasze terytorium!"
 MUN_czech.1014.t: "[FROM.GetName] domaga się ochrony."
 MUN_czech.1014.d: "Wpływowi [FROM.GetAdjective] dyplomaci skontaktowali się z ministrem spraw zagranicznych i zawnioskowali o wzmocnienie mglistych obietnic obrony naszkicowanych w traktacie czechosłowacko-radzieckim z 1935 r."
 MUN_czech.1014.a: "Może powinniśmy spróbować chronić naszego sojusznika"
 MUN_czech.1014.b: "Pozostańmy przy mglistych obietnicach"
 MUN_czech.1015.t: "[FROM.GetName] proponuje połączenie naszych frakcji"
 MUN_czech.1015.d: "Skoro mamy teraz tych samych wrogów, władze [FROM.GetAdjective] zaproponowały nam pogłębienie współpracy poprzez integrację naszych frakcji."
 MUN_czech.1015.a: "Skoordynowane działania mogą ocalić wiele istnień"
 MUN_czech.1015.b: "Musimy zachować kontrolę"
 MUN_czech.1016.t: "[FROM.GetName] proponuje pakt o nieagresji"
 MUN_czech.1016.d: "W oparciu o wcześniejsze rozmowy, które przerwano po zmianie planów wobec polityki zagranicznej, rząd [FROM.GetAdjective] proponuje wznowienie negocjacji nad paktem o nieagresji."
 MUN_czech.1016.a: "Jedna granica mniej do obrony"
 MUN_czech.1016.b: "To może utrudnić realizację naszych ambicji"
 MUN_czech.1017.t: "Wspólna inwazja na: [GER.GetNameDef]?"
 MUN_czech.1017.d: "Władze [FROM.GetAdjective] skontaktowały się z najważniejszymi osobami w rządzie [ROOT.GetAdjective], by przedstawić tajne plany inwazji na państwo [GER.GetAdjective] Pokazawszy swoje zaangażowanie w usunięcie [GER.GetAdjective] zagrożenia, proszą o naszą pomoc, żebyśmy razem pokonali potężną armię [GER.GetAdjective]"
 MUN_czech.1017.a: "Uderzymy z nimi na państwo [GER.GetAdjective]"
 MUN_czech.1017.b: "To zbyt niebezpieczne"
 MUN_czech.1018.t: "Samotna walka z: [GER.GetNameDef]?"
 MUN_czech.1018.t.2: "Wspólna inwazja na: [GER.GetNameDef]"
 MUN_czech.1018.d: "Mimo naszych wysiłków dyplomatycznych nie zdołaliśmy uzyskać zagranicznego poparcia dla ataku uprzedzającego na terytorium [GER.GetAdjective] Rodzi się pytanie, czy nadal chcemy zrealizować nasz plan ataku."
 MUN_czech.1018.d.FRA_POL: "Nasi dyplomaci z [FRA.GetAdjective] i [POL.GetAdjective] placówek donoszą, że oba kraje zobowiązały się pomóc nam w inwazji na [GER.GetAdjective] terytorium."
 MUN_czech.1018.d.FRA: "Nasi dyplomaci wrócili z doskonałą wiadomością, rząd [FRA.GetAdjective] zgodził się uczestniczyć we wspólnej inwazji na [GER.GetAdjective] terytorium. Musimy teraz ocenić, czy nasze połączone wojska będą wystarczającą siłą do realizacji tego zadania."
 MUN_czech.1018.d.POL: "Nasi dyplomaci wrócili z doskonałą wiadomością, rząd [POL.GetAdjective] zgodził się uczestniczyć we wspólnej inwazji na [GER.GetAdjective] terytorium. Musimy teraz ocenić, czy nasze połączone wojska będą wystarczającą siłą do realizacji tego zadania."
 MUN_czech.1018.a: "Całkowicie ich zaskoczymy"
 MUN_czech.1018.b: "To jednak zbyt ryzykowne"
 MUN_czech.1019.t: "[FROM.GetName] żąda: [762.GetName]"
 MUN_czech.1019.d: "Powołując się na chęć przywrócenia dawnych czeskich granic i legitymizacji kontroli nad regionem [72.GetName], władze [FROM.GetAdjective] przedstawiły ultimatum, w którym domagają się od nas oddania regionu [762.GetName]."
 MUN_czech.1019.a: "Może to zapewni nam bezpieczeństwo"
 MUN_czech.1020.t: "[FROM.GetName] proponuje warunkową inwestycję"
 MUN_czech.1020.a: "Świetny układ!"
 MUN_czech.1020.b: "Nie możemy przystać na te warunki."
 MUN_czech.1020.d: "Przybyli [FROM.GetAdjective] dyplomaci, by przedstawić zarys porozumienia, na mocy którego ich kraj zainwestuje w nasz przemysł oraz infrastrukturę w zamian za umowę surowcową. To posunięcie, po nieudanych inwestycjach z poprzednich lat, oznacza powrót do działań mających na celu poprawę naszych stosunków."
 CZE_investment_effects_tt: "Za §Y100 dni§! otrzymamy:\n§YInfrastrukturę§! w §Y3§! losowych regionach.\n§YFabrykę cywilną§! w §Y1§! losowym regionie.\n"
 MUN_czech.1021.t: "Powrót austro-węgierskiej unii celnej?"
 MUN_czech.1021.d: "Rząd [CZE.GetNameAdjective] przedstawił nam zarys umowy handlowej między dwoma narodami dawnych Austro-Węgier. Chociaż nowe [CZE.GetAdjective] władze są zadowolone z niepodległości, to bardzo chętnie przywróciłby korzystne elementy dawnych Austro-Węgier."
 MUN_czech.1021.a: "Zwiększenie handlu brzmi zachęcająco."
 MUN_czech.1021.b: "Musimy chronić naszych krajowych producentów."
 MUN_czech.1022.t: "Wojska [CZE.GetAdjective] zajmują Śląsk"
 MUN_czech.1022.d: "Po zaciętych walkach w górach regionu [69.GetName] wojska [CZE.GetAdjective] przebiły się dalej i zajęły cały Śląsk, zanim siły, z którymi się starły, zdążyły się pozbierać i stawić poważny opór."
 MUN_czech.1022.a: "Musimy interweniować."
 MUN_czech.1022.b: "Nie możemy stworzyć sobie kolejnego wroga."
 MUN_czech.1022.c: "Wspaniałe zwycięstwo!"
 MUN_czech.1023.t: "Rząd [CZE.GetAdjective] rozpoczyna walkę o Śląsk"
 MUN_czech.1023.d: "Przedstawiając dziwne argumenty o średniowiecznych królestwach i imperiach, rząd [FROM.GetAdjective] zamienił potyczki graniczne w lokalną wojnę o panowanie nad [ROOT.GetAdjective] Śląskiem."
 MUN_czech.1023.a: "Przygotować wojska."
 MUN_czech.1024.t: "Rząd [CZE.GetAdjective] proponuje porozumienie pokojowe."
 MUN_czech.1024.d: "Po tym, jak potyczki graniczne na Śląsku przerodziły się w otwartą wojnę, rząd [FROM.GetAdjective] wyraził gotowość do zakończenia tego konfliktu, jeśli zostaną mu przekazane ziemie opanowane przez jego wojska."
 MUN_czech.1024.a: "Może powinniśmy skoncentrować się na innych obszarach"
 MUN_czech.1024.b: "Wciąż jesteśmy w korzystnej sytuacji"
 MUN_czech.1024.c: "To nie podlega negocjacjom!"
 MUN_czech.1025.t: "Koniec hiszpańskiej misji ochotniczej"
 MUN_czech.1025.d.1: "Wojska [ROOT.GetAdjective] wysłane na [CZE_supported_spanish_faction.GetAdjective] terytorium wracają do ojczyzny po tym, jak pomogły w osiągnięciu zwycięstwa. Dzięki tym starciom nasi żołnierze zdobyli nowe doświadczenia, szczególnie dotyczy to jednostek medycznych."
 MUN_czech.1025.d.2: "Choć wojska [ROOT.GetAdjective] mężnie walczyły w hiszpańskiej wojnie domowej, strona, którą wsparliśmy, została pokonana. Mimo to nasi żołnierze, a w szczególności zespoły medyczne, zdobyli bardzo cenne doświadczenia."
 MUN_czech.1025.a: "Miejmy nadzieję, że nie będziemy musieli skorzystać z tych doświadczeń w ojczyźnie."
 MUN_czech.1026.t: "Rząd [FROM.GetAdjective] odrzuca propozycję"
 MUN_czech.1026.a: "Ich strata."
 MUN_czech.1026.b: "To niepokojący rozwój wydarzeń."
 MUN_czech.1026.france_refuses_to_lead: "Choć zaproponowaliśmy rządowi [FROM.GetAdjective] przywódczą rolę w zamian za przystąpienie do naszego sojuszu, nie zdecydował się on na ten krok. Wygląda na to, że władze [FROM.GetAdjective] próbują zachować neutralność albo grają na czas."
 MUN_czech.1026.sphere_of_influence: "Chociaż członkowie [FROM.GetAdjective] rządu zapewnili nas, że doceniają naszą obecność we frakcji [ROOT.GetFactionName], stwierdzili jednocześnie, że rozszerzenie naszych wpływów na Bałkany byłoby przesadą i mogłoby odstraszyć potencjalnych sojuszników."
 MUN_czech.1026.guarantee: "Nasi dyplomaci informują, że pomimo ich wysiłków władze [FROM.GetAdjective] nie przystały na naszą propozycję zawarcia paktu o obronie wzajemnej. Ich zdaniem jesteśmy bardziej zagrożeni niż oni. Oby się mylili."
 MUN_czech.1026.faction_merge: "Mimo naszych ogromnych wysiłków, nasi i [FROM.GetAdjective] dyplomaci nie porozumieli się w kwestii układu jednoczącego frakcję [ROOT.GetFactionName] z frakcją [FROM.GetFactionName]."
 MUN_czech.1026.non_aggression: "Mimo zapewnień o ich pokojowych zamiarach, [FROM.GetAdjective] dyplomaci odmówili podpisania z naszym krajem paktu o nieagresji. Na razie nie wiemy dlaczego."
 MUN_czech.1026.trade_deal: "Władze [FROM.GetAdjective] twierdzą, że ich kraj chce zachować niezależność gospodarczą, i dlatego odrzuciły naszą propozycję umowy handlowej."
 MUN_czech.1026.faction_invite: "Chociaż nasi dyplomaci przedstawili władzom [FROM.GetAdjective] argumenty za stworzeniem z nami sojuszu, okazały się one nieprzekonujące."
 MUN_czech.1026.weapons_sale: "Mimo naszej wspaniałomyślnej oferty rząd [FROM.GetAdjective] postanowił na razie nie kupować od nas broni."
 MUN_czech.1026.unification: "Mimo świadomości, jakie korzyści przyniosłoby stworzenie federacji, władze [FROM.GetAdjective] postanowiły, że ich rząd na uchodźstwie będzie jedynym, pełnoprawnym zarządcą ich ziem."
 MUN_czech.1026.white_peace: "Nasi wysłannicy powrócili dziś ze smutną wiadomością. [66.GetName] znajduje się pod naszą okupacją, ale [FROM.GetAdjective] przywódcy nie są skłonni do podpisania traktatu pokojowego. Wygląda na to, że będziemy musieli kontynuować podbój albo liczyć na to, że uda nam się wyczerpać ich siły."
 MUN_czech.1027.t: "Zawrzeć [FROM.GetAdjective]-[ROOT.GetAdjective] umowę handlową?"
 MUN_czech.1027.d: "Mimo początkowych różnic ideologicznych rząd [FROM.GetAdjective] odwołał się do naszego pragmatyzmu w swojej propozycji zawarcia umowy handlowej. W zamian za umożliwienie państwu [FROM.GetAdjective] eksploatacji zasobów w regionie [202.GetName] otrzymamy pomoc w postaci narzędzi mechanicznych, których tak bardzo potrzebujemy do zwiększenia wydajności naszego przemysłu."
 MUN_czech.1027.a: "To cholernie dobra umowa."
 MUN_czech.1027.b: "Nie powinniśmy udostępniać im tych zasobów."
 MUN_czech.1028.t: "Opóźnienie rozbudowy fortyfikacji"
 MUN_czech.1028.d: "Wielu ludzi dopytuje, dlaczego rząd nie kontynuuje projektów rozbudowy fortyfikacji zapoczątkowanych pod koniec ubiegłego roku. Rząd utworzył rezerwę pieniędzy na budowę dodatkowych fortów nadzorowaną przez Radę ds. Umocnień. Ludzie nie widzą postępów tego programu i domagają się jego wznowienia albo zwrócenia funduszy. Jeżeli chcemy kontynuować nasze programy rozbudowy fortyfikacji, musimy niezwłocznie wznowić przerwane prace, aby projekty zostały zrealizowane na czas."
 MUN_czech.1028.a: "Nie mamy czasu do stracenia!"
 CZE_no_time_to_lose_tt: "Czas na ukończenie projektów fortyfikacyjnych przed pojawieniem się zagrożenia jest teraz bardzo krótki."
 MUN_czech.1029.t: "Ukończono projekt rozbudowy fortyfikacji"
 MUN_czech.1029.d: "Nasz niedawny projekt rozbudowy fortyfikacji został ukończony i mamy zasoby na rozpoczęcie kolejnego. Nasi inżynierowie są gotowi niezwłocznie przenieść się w inne miejsce, by zacząć budowę nowej linii umocnień."
 MUN_czech.1029.a: "Doskonała robota, panowie."
 MUN_czech.1030.t: "[FROM.GetName] żąda integracji"
 MUN_czech.1030.d: "Władze [FROM.GetAdjective] domagają się, byśmy dołączyli do powiększanej przez nie unii. Zwróciły się w tej sprawie także do innych krajów w regionie, przedstawiając im różne uzasadnienia dla tego kroku: pansłowiańskość, panbałkanizm albo wspólna historia cesarstwa Austro-Węgier. Propozycja jest też podszyta groźbą, która zostanie spełniona, jeśli odmówimy."
 MUN_czech.1030.a: "Może to dobry pomysł"
 MUN_czech.1030.b: "To nie brzmi zbyt przekonująco"
 MUN_czech.1031.t: "[FROM.GetName] proponuje unię"
 MUN_czech.1031.d: "Choć państwo [ROOT.GetAdjective] skapitulowało, rząd [FROM.GetAdjective] przedstawił radykalną propozycję, która umożliwi nam dalszą walkę: połączenie pozostałości naszego kraju z ich państwem."
 MUN_czech.1031.a: "Razem będzie łatwiej bronić naszych ojczyzn"
 MUN_czech.1031.b: "Zbyt wiele nas różni"
 MUN_czech.1032.t: "Budowa mostów"
 CZE_divide_nation_title_dynamic_sudentenland: "$MUN_czech.1032.t$ w Kraju Sudetów"
 CZE_divide_nation_title_dynamic_czech_states: "$MUN_czech.1032.t$ z czeskimi robotnikami"
 CZE_divide_nation_title_dynamic_tesinko_poles: "$MUN_czech.1032.t$ w regionie [72.GetName]"
 CZE_divide_nation_title_dynamic_slovakia_states: "$MUN_czech.1032.t$ w: [SLO.GetNonIdeologyName]"
 CZE_divide_nation_title_dynamic_hungarian_states: "$MUN_czech.1032.t$ w regionie [664.GetName]"
 CZE_divide_nation_title_dynamic_ukrainian_states: "$MUN_czech.1032.t$ w regionie [73.GetName]"
 MUN_czech.1032.d: "Niedawne działania mające rozwiązać problemy państwa [FROM.GetAdjective] załagodziły gniew wymierzony w rząd centralny, przynajmniej na jakiś czas. Zasoby, którymi dysponują nasze władze, można teraz przeznaczyć na inne programy społeczne lub gospodarcze, zwalczające problemy, które są przyczyną podziałów w naszym kraju."
 MUN_czech.1032.a: "Zróbmy to jeszcze raz."
 MUN_czech.1033.t: "Rząd [FROM.GetAdjective] na uchodźstwie domaga się uznania."
 MUN_czech.1033.d: "Rząd [FROM.GetAdjective] na uchodźstwie, na czele którego stoi $CZE_edvard_benesh$, zwrócił się do nas z prośbą o przyjęcie jego delegacji na rozmowy o trwającej walce o niepodległość państwa [CZE.GetAdjective]"
 MUN_czech.1033.a: "Kolejny sojusznik przeciwko państwu [GER.GetAdjective]"
 MUN_czech.1033.b: "To nielegalne władze."
 MUN_czech.1034.t: "Niepokoje na Słowacji"
 MUN_czech.1034.d: "Ponieważ ulegliśmy nastrojom nacjonalistycznym innych ugrupowań, członkowie Słowackiej Partii Ludowej stworzyli własną organizację paramilitarną, która dąży teraz do uzyskania niezależności, a przynajmniej autonomii, dla Słowacji. Rodzi się pytanie, czy mamy koncentrować się na utrzymywaniu pozorów jedności poprzez uniemożliwienie im tego, czy też pozwolimy im na to i skupimy się na ziemiach lojalnych wobec rządu."
 MUN_czech.1034.a: "Wysłać wojska na Słowację!"
 MUN_czech.1034.b: "Aresztujmy ich, ale dajmy im też częściową autonomię."
 MUN_czech.1034.c: "Przejmij bezpośrednią kontrolę"
 MUN_czech.1034.c_tt: "§RBędziemy musieli pogodzić się z [GER.GetAdjective] decyzją dotyczącą losów Czechosłowacji.§!"
 MUN_czech.1035.t: "[FROM.GetName] chce produkować dla nas broń."
 MUN_czech.1035.d: "Nasze kluczowe partnerstwo z państwem [CZE.GetAdjective] sprawiło, że otrzymaliśmy propozycję wyjątkowego porozumienia: przemysł [CZE.GetAdjective] jest gotowy produkować dla nas uzbrojenie, które obecnie wytwarzamy w kraju, oczywiście nie zrobi tego za darmo. Pozwoli nam to skoncentrować się na innych sektorach naszego przemysłu."
 MUN_czech.1035.a: "Oznacza to zmniejszenie liczby zbędnych działań"
 MUN_czech.1035.b: "Nie możemy uzależniać naszej armii od zagranicznego sprzętu"
 #MUN_czech.1036.t: "" #Event uses MUN_czech.1032.t
 MUN_czech.1036.d: "Wielki kryzys nie obszedł się z nami łagodnie, trapią nas rozliczne regionalne problemy polityczne i gospodarcze, które zdają się pogłębiać, nawet w obliczu cudownego odbicia po tym trudnym okresie. Musimy zmierzyć się z tymi wyzwaniami, zanim doprowadzą do dalszych podziałów w naszym narodzie."
 MUN_czech.1036.a: "Musimy uleczyć nasz kraj."
 CZE_divided_nation_event_onbroad_tt: "Odblokowano §Ydecyzje§!, które pozwalają nam §Yusunąć§! negatywne §Ymodyfikatory regionów§! z naszych regionów narodowych.\n\nPodjęcie tych §Ydecyzji§! zmniejszy również negatywne modyfikatory §Y$CZE_a_divided_nation_dynamic_modifier$§! ducha narodowego do czasu jego §Yusunięcia§!."
 MUN_czech.1037.t: "Rząd [GER.GetAdjective] chroni państwo [HUN.GetAdjective]"
 MUN_czech.1037.d: "Zauważywszy pojawiające się w naszym kraju narracje w oczywisty sposób uzasadniające wojnę z państwem [HUN.GetAdjective], przedstawiciele władz [GER.GetAdjective] zadeklarowali stanowczo, że zaatakowanie terytorium [HUN.GetAdjective] będzie oznaczało także wypowiedzenie wojny państwu [GER.GetAdjective] Od nas zależy, czy podejmiemy dalsze działania."
 MUN_czech.1037.a: "Musimy odwołać nasze plany"
 MUN_czech.1037.b: "To niczego nie zmienia"
 MUN_czech.1038.t.1: "Rząd [FROM.GetAdjective] proponuje licencje na swoje czołgi"
 MUN_czech.1038.t.2: "Rząd [FROM.GetAdjective] proponuje sprzedaż broni palnej"
 MUN_czech.1038.t.3: "Rząd [FROM.GetAdjective] proponuje sprzedaż artylerii"
 MUN_czech.1038.t.4: "Rząd [FROM.GetAdjective] proponuje sprzedaż czołgów lekkich"
 MUN_czech.1038.t.5: "Rząd [FROM.GetAdjective] proponuje sprzedaż myśliwców"
 MUN_czech.1038.d: "Przedstawiciele [FROM.GetAdjective] rządu i tamtejszych firm zbrojeniowych zaproponowali nam sprzedaż broni. Ceny nie odbiegają od standardów, a ponadto część oferowanego nam [FROM.GetAdjective] uzbrojenia jest bardzo nowoczesna."
 MUN_czech.1038.a: "To chyba dobry układ"
 MUN_czech.1039.t: "Rząd [RUT.GetAdjective] domaga się porozumienia w sprawie autonomii"
 MUN_czech.1039.d: "W świetle porozumienia w sprawie autonomii, które zawarliśmy z rządem [SLO.GetAdjective], $RUT_augustin_voloshyn$ zwrócił się do nas z propozycją takiej samej umowy o federalizacji. Choć wydaje się to absurdalne, w zaistniałych okolicznościach musimy przyjąć te żądania na słowo."
 MUN_czech.1039.a: "Musimy się zastanowić"
 MUN_czech.1040.t: "Rząd [CZE.GetAdjective] proponuje nam traktat o unii celnej"
 MUN_czech.1040.d: "Władze [CZE.GetAdjective] wróciły niedawno do tematu rozmów dyplomatycznych dotyczących unii celnej między naszymi krajami. Ich propozycja wydaje się uczciwa, ale później mogą nas zaskoczyć, przedstawiając nowe żądania. Ten traktat oraz wymiana, której dotyczy, wydają się symboliczne i trywialne, zatem nic się nie stanie, jeśli go podpiszemy."
 MUN_czech.1040.a: "To chyba nic groźnego"
 MUN_czech.1040.b: "Nie można im ufać"
 MUN_czech.1041.t: "Rząd [FROM.GetAdjective] odmawia zawarcia traktatu o unii celnej"
 MUN_czech.1041.d: "Twierdząc, że traktat ten mógłby zachwiać ich gospodarką, władze [From.GetAdjective] odmówiły zawarcia z nami unii celnej. To uzasadnienie wydaje się bezpodstawne."
 MUN_czech.1041.a: "Co za rozczarowanie"
 MUN_czech.1042.t: "Rząd [FROM.GetAdjective] zgadza się zawrzeć traktat o unii celnej"
 MUN_czech.1042.d: "Uznawszy traktat za zadowalający, władze [FROM.GetAdjective] przystały na jego warunki. Miejmy nadzieję, że to pierwszy krok ku zacieśnieniu więzi między naszymi krajami."
 MUN_czech.1042.a: "Doskonale"
 MUN_czech.1043.t: "[FROM.getname]: [FROM.GetAdjective] rząd domaga się, byśmy dołączyli do ich federacji"
 MUN_czech.1043.d: "Powołując się na zbliżenie między naszymi krajami i niedawne wydarzenia na arenie międzynarodowej, rząd [FROM.GetAdjective] twierdzi, że lepiej dla nas byłoby znaleźć się pod jego ochroną, aniżeli pozostać w osamotnieniu. To prawdopodobnie fortel, dzięki któremu chcą okupować nasze terytorium. Co powinniśmy zrobić?"
 MUN_czech.1043.a: "Zgoda"
 MUN_czech.1043.b: "To fatalny pomysł"
 MUN_czech.1044.t: "Rząd [FROM.GetAdjective] odmawia przystąpienia do federacji"
 MUN_czech.1044.d: "Uznawszy, że bez naszej władzy poradzą sobie lepiej, władze [FROM.GetAdjective] odrzuciły propozycję dołączenia do naszej federacji. To poważnie utrudni nam umocnienie naszej pozycji w Europie. Co powinniśmy zrobić, skoro już wiemy, że rząd [FROM.GetAdjective] nie otrzeźwieje?"
 MUN_czech.1044.a: "Szkoda"
 MUN_czech.1044.b: "Będziemy musieli spróbować czegoś innego"
 MUN_czech.1045.t: "Rząd [FROM.GetAdjective] zgadza się przystąpić do federacji"
 MUN_czech.1045.d: "Uświadomiwszy sobie, że ich kraj będzie bezpieczniejszy pod naszą ochroną, władze [FROM.GetAdjective] podjęły rozsądną decyzję o przystąpieniu do naszej federacji. Dzięki temu znacznie umocnimy naszą pozycję w Europie."
 MUN_czech.1045.a: "Doskonale"
 MUN_czech.1046.t: "Budowa mostów"
 MUN_czech.1046.d: "Po długich zmaganiach z problemami dotykającymi naszego kraju sytuacja zaczyna się poprawiać. Zakończyło się wiele programów społecznych i gospodarczych, a nasze państwo zaczyna stawać na nogi."
 MUN_czech.1046.a: "Wspaniałe wieści"
 #MUN_czech.1047 is hidden
 MUN_czech.1048.t: "Rząd [FROM.GetAdjective] zgadza się na żądania"
 MUN_czech.1048.t2: "[FROM.GetName]: [FROM.GetAdjective] władze zgadzają się na propozycję"
 MUN_czech.1048.d: "Choć niechętnie, władze [FROM.GetAdjective] poinformowały nas, że spełnią nasze żądania terytorialne. Wojska [FROM.GetAdjective] już się wycofują ze wskazanego terytorium."
 MUN_czech.1048.d2: "Po długich rozmowach nasi przedstawiciele oraz [FROM.GetAdjective] przedstawiciele osiągnęli porozumienie w sprawie nowej roli [FROM.GetAdjective] gospodarki w ramach naszej unii. To porozumienie z pewnością przyniesie dobrobyt wszystkim naszym obywatelom."
 MUN_czech.1048.d3: "Nasza propozycja zawarcia paktu o nieagresji spotkała się z ogromnym entuzjazmem ze strony [FROM.GetAdjective] przedstawicieli, choć wydaje się, że ich ambicje skupiają się obecnie na innych kwestiach."
 MUN_czech.1048.d4: "W obliczu poważnego zagrożenia [FROM.GetAdjective] władze zgodziły się na podporządkowanie się nam."
 MUN_czech.1048.d5: "Po długich rozmowach nasi i [FROM.GetAdjective] przedstawiciele osiągnęli porozumienie, zgodnie z którym część naszego przemysłu zbrojeniowego zostanie wykorzystana do produkcji sprzętu na ich potrzeby. W zamian otrzymamy towary przeznaczone na nasze rynki i na potrzeby naszej produkcji."
 #MUN_czech.1049 is a faction joining event so largely reuses generic loc
 MUN_czech.1049.d: "Nowy wojskowy rząd [FROM.GetAdjective] zaproponował nam sojusz. Choć był on początkowo nastawiony antyniemiecko, postanowił jednak działać pragmatycznie, a jednocześnie uznał, że nie może polegać na swoich dawnych partnerach międzynarodowych."
 MUN_czech.1050.d: "Nasi dyplomaci wrócili ze spotkania z przedstawicielami władz [FROM.GetAdjective] i przekazali rozczarowującą wiadomość, że nasza prośba o przyjęcie nas do ich sojuszu została odrzucona. Powody tej decyzji są niejasne, ale znaleźliśmy się przez to w trudnej sytuacji, ponieważ wyraziliśmy obawy co do naszych tradycyjnych sojuszników, a nie zyskaliśmy nowych."
 MUN_czech.1050.a: "Może trzeba zaproponować korzystniejsze warunki"
 MUN_czech.1050.b: "Poszukajmy lepszych sojuszników"
 MUN_czech.1051.t: "Rząd [FROM.GetAdjective] domaga się strefy wpływów"
 MUN_czech.1051.d: "Nasz nowy sojusznik, rząd [FROM.GetAdjective], jest zainteresowany rozszerzeniem swoich wpływów poza własne granice. Dlatego jego przedstawiciele zwrócili się do nas o zgodę na tę ekspansję oraz wsparcie jej tam, gdzie trzeba wyznaczyć jasne granice między [ROOT.GetAdjective] i [FROM.GetAdjective] wpływami."
 MUN_czech.1051.a: "Powinniśmy wzmocnić naszego kluczowego, [FROM.GetAdjective] sojusznika"
 MUN_czech.1052.t: "[FROM.GetName]: Prośba o zgodę na przemarsz [SOV.GetAdjective] oddziałów"
 MUN_czech.1052.d: "[FROM.GetNameDef] i [SOV.GetNameDef] zawarli nowe porozumienie dyplomatyczne, więc [FROM.GetAdjective] władze są przekonane, że w razie konfliktu mogą liczyć na [SOV.GetAdjective] ochronę. Jedyną przeszkodą jest brak połączenia lądowego między tymi krajami, w związku z czym [FROM.GetAdjective] dyplomaci zwrócili się do naszego rządu z prośbą o zezwolenie na przepuszczenie [SOV.GetAdjective] wojsk przez nasze terytorium, gdyby doszło do konfliktu."
 MUN_czech.1052.a: "Ich walka zapewni ochronę również nam"
 MUN_czech.1053.t: "Władze [FROM.GetAdjective] naciskają na nas [HUN.GetAdjective] roszczeniami"
 MUN_czech.1053.d: "[HUN.GetNameDef] to teraz państwo zależne. Sukces ten ośmielił [FROM.GetAdjective] władze, które domagają się, abyśmy też im ulegli. Grożą, że jeśli odmówimy, poprą [HUN.GetAdjective] roszczenia dotyczące [ROM.GetAdjective] terytorium. Musimy wybrać między utratą suwerenności a potencjalnym zagrożeniem dla naszej integralności terytorialnej."
 CZE_cancel_anti_hungary_focus_tt: "Anuluje cel: §Y$CZE_neutralize_the_hungarian_threat$§!"
 MUN_czech.1054.t: "Wspólna inwazja na: [LIT.GetName]?"
 MUN_czech.1054.d: "Zgodnie z wcześniejszymi ustaleniami [FROM.GetAdjective] władze przedstawiły nam propozycję, która przyczyniłaby się do wzmocnienia naszego kraju. Chodzi o zmuszenie [LIT.GetAdjective] władz do zjednoczenia z nami, co zapewniłoby nam dostęp do dodatkowych zasobów i uniemożliwiłoby wrogowi atakowanie nas przez [LIT.GetAdjective] terytorium."
 MUN_czech.1054.a: "Musimy poszerzać granice, aby przeciwstawić się ekspansji innych"
 MUN_czech.1055.t: "Przybycie [SOV.GetAdjective] ochotników"
 MUN_czech.1055.d: "W ramach bezprecedensowej operacji logistyki lotniczej [SOV.GetAdjective] władze wykorzystały swoje siły powietrzne do przetransportowania kilku dywizji ochotników na nasze lotnisko (lokalizacja: [73.GetName]) w celu wsparcia naszych bieżących działań wojennych."
 MUN_czech.1056.t: "[FROM.GetName]: żądanie przekazania regionu [975.GetName]"
 MUN_czech.1056.d: "[CZE.GetNameDef] i [YUG.GetNameDef] muszą zostać połączone lądowym korytarzem, by zabezpieczyć ich sojusz. Koncepcja ta zgłaszana już niegdyś podczas konferencji pokojowej w Paryżu po zakończeniu wielkiej wojny powraca w postaci żądania przedstawicieli [FROM.GetAdjective] władz, którzy domagają się od nas przekazania im części naszego terytorium, regionu [975.GetName]."
 #THE FALL OF THE REPUBLIC EVENTS#
 MUN_the_fall_of_the_republic.1.t: "Wybuch masowych protestów"
 MUN_the_fall_of_the_republic.1.d: "[ROOT.GetLeader] podjął niedawną decyzję o oddaniu Kraju Sudetów, co doprowadziło do wybuchu protestów w narodzie. Przywództwo wojskowe i polityczne chciało uniknąć rozlewu krwi w działaniach, które uznało za bezsensowny opór w przegranej sprawie, jednak wielu obywateli nie zgadza się z tą decyzją. Niektóre ruchy polityczne chcą wykorzystać ten chaos, by realizować własne cele."
 MUN_the_fall_of_the_republic.1.a: "Nie mieliśmy wyboru!"
 MUN_the_fall_of_the_republic.2.t.1: "Upadek Pierwszej Republiki"
 MUN_the_fall_of_the_republic.2.t.2: "Chaos w rządzie"
 MUN_the_fall_of_the_republic.2.d: "Po decyzji rządu o oddaniu Kraju Sudetów nastąpiła duża fala rezygnacji młodszych oficerów armii i urzędników rządowych. Mówi się, że część tych osób natychmiast uciekła z kraju. Rząd wymaga dużych zmian, by zahamować odpływ urzędników i przywrócić w społeczeństwie wiarę w nasze możliwości kierowania państwem."
 MUN_the_fall_of_the_republic.2.a: "Potrzebujemy radykalnych zmian."
 MUN_the_fall_of_the_republic.2.b: "Musimy utrzymać obrany kurs!"
 MUN_the_fall_of_the_republic.3.t: "[RUT.getname] wnioskuje o autonomię"
 MUN_the_fall_of_the_republic.3.d: "Po niedawnym zamęcie w naszym kraju niewielki region, Karpato-Ukraina, chce zwiększyć swoją autonomię od: [9.GetCapitalVictoryPointName]. Powołują się na wielowiekowe różnice między tym regionem, a resztą państwa [ROOT.getadjective] Ale ten wniosek to raczej pomysł miejscowych liderów na wykorzystanie okazji do zwiększenia własnej władzy. Jeśli odrzucimy ten wniosek, stracimy sporo kapitału politycznego w czasie, gdy nie możemy sobie na to pozwolić."
 MUN_the_fall_of_the_republic.3.a: "Oczywiście, czemu nie?"
 MUN_the_fall_of_the_republic.3.b: "Nie ma takiej możliwości!"
 MUN_the_fall_of_the_republic.3.c: "Puść ich wolno."
 MUN_the_fall_of_the_republic.4.t: "Los państwa [RUT.getadjective]"
 MUN_the_fall_of_the_republic.4.d: "W wyniku chaosu, który niedawno zapanował w państwie [CZE.getadjective], niewielki region, [RUT.getname], oderwał się od naszego kraju. Jego władze twierdzą, że są niepodległym państwem i nawiązały stosunki dyplomatyczne z sąsiadami. Wielu członków naszego rządu jest zaniepokojonych faktem, że region o tak dużym znaczeniu strategicznym może wpaść w ręce kogoś innego. Armia radzi wystosować wobec secesjonistów ultimatum wzywające ich do ponownego przyłączenia tego regionu do naszego państwa."
 MUN_the_fall_of_the_republic.4.a: "Natychmiast wyślijmy ultimatum!"
 MUN_the_fall_of_the_republic.4.b: "To mogłoby być ryzykowne, lepiej weźmy ich na przeczekanie."
 MUN_the_fall_of_the_republic.5.t: "[FROM.getname] żąda naszej aneksji!"
 MUN_the_fall_of_the_republic.5.d: "Po odzyskaniu przez nas niepodległości było kwestią czasu, aż któryś z naszych sąsiadów zechce przyłączyć nas do swojego terytorium. Rząd [FROM.getadjective] zrobił to jako pierwszy, domaga się naszej kapitulacji. Co zrobimy?"
 MUN_the_fall_of_the_republic.5.a: "Będziemy walczyć do ostatniego człowieka!"
 MUN_the_fall_of_the_republic.5.b: "Musimy się zgodzić."
 MUN_the_fall_of_the_republic.6.t: "Władze [FROM.getadjective] odrzucają nasze ultimatum!"
 MUN_the_fall_of_the_republic.6.d: "Ku naszemu zaskoczeniu władze [FROM.getadjective] odrzuciły nasze ultimatum i kraj zamierza stawić nam zbrojny opór. Nie pozostało nam nic innego niż przeprowadzenie inwazji. Już wcześniej przygotowaliśmy plany działań zbrojnych oraz kierunków natarcia, teraz wystarczy tylko wydać rozkaz ataku."
 MUN_the_fall_of_the_republic.6.a: "Ostrzegaliśmy ich."
 MUN_the_fall_of_the_republic.6.a_tt: "Ta operacja nie wpłynie na: §Y$HUN_pal_teleki$§!, chyba że państwo [RUT.GetNameDef] ma sojuszników"
 MUN_the_fall_of_the_republic.6.b: "To może się zemścić, lepiej się wstrzymajmy."
 MUN_the_fall_of_the_republic.7.t: "Władze [FROM.getadjective] spełniają nasze żądania"
 MUN_the_fall_of_the_republic.7.d: "Zgodnie z powszechnymi oczekiwaniami władze [FROM.GetAdjective] zgodziły się na aneksję przez nasze państwo, w zamian za spełnienie jakichś błahych warunków. Ten niewielki region nie miał szans oprzeć się tak potężnemu krajowi jak nasz. W ten sposób wzmocniliśmy bezpieczeństwo naszej północnej granicy, a rząd jest bardzo zadowolony z tego łatwego zwycięstwa."
 MUN_the_fall_of_the_republic.7.a: "To doskonała wiadomość."
 #BOP EVENTS#
 MUN_czech_bop.1.t: "Gotowość armady"
 MUN_czech_bop.1.d: "Reformy rozpoczęte w pierwszej połowie dekady zaczęły przynosić owoce. Obecnie nasza armia należy do najnowocześniejszych w Europie. Jednak część polityków zaczyna popadać w samozadowolenie, podobnie jak szefowie wielu konglomeratów przemysłowych. Jeśli nasze siły zbrojne mają utrzymać najwyższą gotowość, musimy stłumić wszelkie wątpliwości co do ich zdolności bojowych i zamknąć usta tym, którzy podkopują autorytet wojska, kierując się osobistymi korzyściami."
 MUN_czech_bop.1.a: "Będziemy gotowi."
 MUN_czech_bop.2.t.1: "Widmo remilitaryzacji Niemiec"
 MUN_czech_bop.2.t.2: "Ekspansja militarna sąsiednich krajów"
 MUN_czech_bop.2.d.1: "Rząd [GER.getadjective] dokonał niedawno remilitaryzacji Nadrenii, co przeraziło część naszych przywódców wojskowych i politycznych. Wiele osób wierzy w zawarte sojusze i prowadzone przez armię przygotowania do walki z ewentualnym niemieckim zagrożeniem. Jednak niektórzy nie są tak pewni, czy zdołamy przeciwstawić się [GER.GetAdjective] sile."
 MUN_czech_bop.2.d.2: "Niedawne informacje o naszych sąsiadach wdrażających programy znaczącej rozbudowy swoich sił zbrojnych przeraziły część naszych przywódców wojskowych i politycznych. Wiele osób wierzy w sojusze zawarte z innymi krajami i prowadzone przez armię przygotowania do walki z ewentualnym zagranicznym zagrożeniem. Jednak niektórzy nie są tak pewni, czy zdołamy przeciwstawić się obcej agresji."
 MUN_czech_bop.2.a: "Będziemy przygotowani."
 MUN_czech_bop.2.a_tt: "Działania naszych sąsiadów w zakresie zbrojeń sprawiły, że niektórzy członkowie naszej armii zaczęli wątpić w naszą zdolność do przeciwstawienia się ewentualnej agresji. Musimy uspokoić nasze siły odpowiednimi działaniami."
 MUN_czech_bop.3.t: "Rząd [CZE.getadjective] przysłał obserwatorów do naszego kraju"
 MUN_czech_bop.3.d: "Rząd [CZE.getadjective] przysłał niedawno do naszego kraju ludzi mających obserwować trwający konflikt. Jednocześnie jeden z ich producentów broni małokalibrowej skontaktował się zakulisowo z naszymi dyplomatami i zaproponował im sprzedaż swoich produktów. Z uwagi na nałożone na nas ograniczenia, wiązałoby się to z koniecznością przemycenia tej broni do naszego kraju."
 MUN_czech_bop.3.a: "Przekonajmy się, co z tego wyjdzie."
 MUN_czech_bop.3.b: "Nie możemy im pozwolić na coś więcej niż przyglądanie się."
 MUN_czech_bop_3_tt: "Producent broni §Y$CZE_zbrojovka_brno_organization$§! o §Y[CZE.getadjective]§! pochodzeniu może próbować przemycić do nas broń."
 MUN_czech_bop.4.t: "Plany zakładów $CZE_zbrojovka_brno_organization$"
 MUN_czech_bop.4.d: "Rząd [ETH.GetAdjective] nawiązał kontakt z przedstawicielami przedsiębiorstwa zbrojeniowego $CZE_zbrojovka_brno_organization$ i wyraził zainteresowanie przemyceniem naszej broni do swojego kraju. Choć Liga Narodów nałożyła na państwo [ETH.GetAdjective] sankcje, $CZE_zbrojovka_brno_organization$ chętnie podejmie się realizacji tej dostawy. Jeżeli zostaniemy przyłapani, złamanie zakazu Ligi Narodów wywoła skandal na arenie międzynarodowej."
 MUN_czech_bop.4.a: "Zróbmy to."
 MUN_czech_bop.4.b: "Nie warto ryzykować ewentualnych reperkusji."
 CZE_gun_smuggling_tt: "Przemyt broni do kraju"
 CZE_we_got_caught_tt: "Przedsiębiorstwo §Y$CZE_zbrojovka_brno_organization$§! zostaje przyłapane."
 CZE_we_dont_get_caught_tt: "Przedsiębiorstwo §Y$CZE_zbrojovka_brno_organization$§! nie zostaje przyłapane."
 MUN_czech_bop.5.t: "$CZE_zbrojovka_brno_organization$ zgadza się dokonać przemytu"
 MUN_czech_bop.5.d: "W rozmowie z przedstawicielami czeskiego rządu zakłady $CZE_zbrojovka_brno_organization$ otrzymały potajemną zgodę na rozpoczęcie przemytu niewielkich ilości broni małokalibrowej do naszego kraju. Ponadto możemy liczyć na zakulisowe korzystanie z doświadczeń tej firmy."
 MUN_czech_bop.5.a: "Dobrze wykorzystamy to uzbrojenie."
 MUN_czech_bop_5_tt: "Ten §Yproducent§! zostanie §Rusunięty§! po zakończeniu wojny."
 ##SLOVAKIA##
 MUN_slovakia_little_war.1.t: "[71.Getname] areną zwycięstwa"
 MUN_slovakia_little_war.1.d: "Nasza armia dobrze się spisała w regionie [71.Getname], gdzie pokonała siły wroga. W działaniach bojowych nasi dowódcy zdobyli bezcenne informacje oraz lekcje, które zaprocentują w przyszłości."
 MUN_slovakia_little_war.1.a: "Doskonała robota."
 MUN_slovakia_little_war.2.t: "[71.Getname] areną porażki"
 MUN_slovakia_little_war.2.d: "Mimo usilnych starań nasze wojska zostały pokonane w regionie [71.Getname]. Najważniejszą przyczyną naszej porażki okazały się niedostateczne zapasy amunicji i sprzętu zmotoryzowanego zgromadzone przed rozpoczęciem konfliktu. Pomimo porażki dowódcy biorący udział w tych działaniach zdobyli niezwykle cenną wiedzę."
 MUN_slovakia_little_war.2.a: "Rozczarowujący rezultat."
 MUN_slovakia_little_war.3.t: "[71.Getname]: starcia graniczne"
 MUN_slovakia_little_war.3.d: "Nawet po tym, jak $GER_first_vienna_award$ dał im nasze terytorium, władze [HUN.GetAdjective] wciąż dążą do korekty granicy z nami w regionie [71.getname]. Musimy stanowczo się przeciwstawić, by pokazać im, że nie oddamy naszej ziemi bez walki."
 MUN_slovakia_little_war.3.a: "Jak śmieli!"
 MUN_slovakia_little_war.4.t: "Pat w regionie [71.Getname]"
 MUN_slovakia_little_war.4.d: "Mimo usilnych starań nasze wojska nie zdołały wygrać potyczki w regionie [71.Getname]. Najważniejszą przyczyną braku wygranej okazały się niedostateczne zapasy amunicji i sprzętu zmotoryzowanego zgromadzone przed rozpoczęciem konfliktu. Pomimo niepowodzenia dowódcy biorący udział w tych działaniach zdobyli niezwykle cenną wiedzę."
 MUN_slovakia_little_war.4.a: "Co za rozczarowanie."
 ##Exile##
 MUN_czech_exile.1.t: "Przybycie [CZE.GetAdjective] uchodźców do: [ROOT.GetNameDef]"
 MUN_czech_exile.1.d: "[GER.GetNameDef] rozpada się w wyniku ustaleń konferencji monachijskiej, przez co [CZE.GetAdjective] uchodźcy przybywają do wielu krajów - w tym do naszego. Są gotowi chwycić za broń, by nam pomóc, w nadziei, że pewnego dnia z naszą pomocą uda im się wyzwolić swoją ojczyznę."
 MUN_czech_exile.1.a: "Witajcie."
 ##NEWS EVENTS##
 MUN_czech.news.1.t: "Kryzys w Kraju Sudetów"
 MUN_czech.news.1.desc: "Mieszkańcy Kraju Sudetów rozpoczęli zbrojne powstanie przeciwko władzom [CZE.getadjective]. Pojawiły się doniesienia o sudeckich bojówkach, które zaatakowały posterunki policji oraz budynki rządowe w całym regionie. Przyczyną tego wybuchu była niedawna informacja, że rząd [FROM.getadjective] zamierza dokonać aneksji tego regionu.\n\nTe bunty to prawdopodobnie preludium do większego konfliktu [FROM.getname]-[CZE.GetNameDef]. Ten konflikt wydaje się nieunikniony."
 MUN_czech.news.1.a: "To źle wróży całej Europie."
 MUN_czech.news.1.b: "Chaos to drabina."
 MUN_czech.news.1.c: "Zwyciężymy!"
 MUN_czech.news.1.d: "Miejmy nadzieję, że zwycięży dyplomacja."
 MUN_czech.news.2.t: "[FROM.GetNameDefCap] najeżdża na: [RUT.GetNameDef]"
 MUN_czech.news.2.desc: "\nW trakcie niedawnej serii wydarzeń zapoczątkowanych chaosem na [CZE.GetAdjective] scenie politycznej niewielki region [RUT.getname] opuścił granice innych państw. To niewielkie secesjonistyczne terytorium ogłosiło niepodległość i zaczęło formować oddziały milicji do obrony swojej świeżo zdobytej państwowości.\n\nRząd [FROM.GetAdjective] od dawna planował zdobyć ten region, więc gdy tylko nadarzyła się okazja, błyskawicznie najechał to niewielkie państewko. Wielu obserwatorów uważa, że [RUT.getname] z pewnością przegra to starcie."
 MUN_czech.news.2.a: "Karpato co?"
 MUN_czech.news.2.b: "To będzie proste."
 MUN_czech.news.2.c: "Przyjdźcie, jeśli się odważycie!"
 MUN_slovakia.news.1.t: "[71.Getname] areną potyczek granicznych"
 MUN_slovakia.news.1.desc: "Choć $GER_first_vienna_award$ zdecydował o zwróceniu im regionu [664.Getname], władze [HUN.getadjective] nadal dążą do korekty granic z państwem [SLO.getadjective] w regionie [71.Getname].\n\nKonflikt ten to prawdopodobnie jedynie wymówka, którą rząd [HUN.getadjective] wykorzystuje do sprawdzenia siły swojej armii w starciu ze znacznie słabszym przeciwnikiem. Młoda armia [SLO.getadjective] może nie być jeszcze gotowa na czekające ją wyzwanie."
 MUN_slovakia.news.1.a: "Kłócą się jak dzieci."
 MUN_slovakia.news.1.b: "Jesteśmy przygotowani."
