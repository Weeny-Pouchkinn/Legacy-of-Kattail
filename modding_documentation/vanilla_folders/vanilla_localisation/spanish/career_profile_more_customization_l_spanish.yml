 #Ribbons
 CAREER_PROFILE_SYNTHETIC_SECURITY: "Seguridad sintética"
 CAREER_PROFILE_SYNTHETIC_SECURITY_DESCRIPTION: "Consigue más de 30 unidades de caucho de fuentes artificiales (refinerías sintéticas)."
 CAREER_PROFILE_SYNTHETIC_SECURITY_QUOTE: "\"Si las mujeres en las fábricas dejaran de trabajar durante 20 minutos, los Aliados perderían la guerra\".\n\n- Joseph Joffre, mariscal de campo y comandante general durante la Primera Guerra Mundial"
 CAREER_PROFILE_RUBBER_BARON: "Barón del caucho"
 CAREER_PROFILE_RUBBER_BARON_DESCRIPTION: "Controla al menos 1000 unidades de caucho y dispón de una economía cerrada."
 CAREER_PROFILE_RUBBER_BARON_QUOTE: "\"... la captura de las principales zonas de producción de caucho en el Lejano Oriente en 1942 eliminó las fuentes del 90% de producción de caucho natural del mundo\".\n\n- The Southern Economic Journal, enero de 1947"
 CAREER_PROFILE_THE_TRUCK_WILL_ALWAYS_GET_THROUGH: "El camión siempre pasará"
 CAREER_PROFILE_THE_TRUCK_WILL_ALWAYS_GET_THROUGH_DESCRIPTION: "Consigue que más de 5000 camiones lleven suministros a los ejércitos."
 CAREER_PROFILE_THE_TRUCK_WILL_ALWAYS_GET_THROUGH_QUOTE: "\"Decían que el bombardero siempre pasaría. Pero los camiones ya estaban ahí\".\n\n- Desconocido"
 CAREER_PROFILE_MARE_NOSTRUM: "Mare Nostrum"
 CAREER_PROFILE_MARE_NOSTRUM_DESCRIPTION: "Gana dominio naval en las seis regiones marítimas principales del Mediterráneo, y una de ellas debe estar en disputa."
 CAREER_PROFILE_MARE_NOSTRUM_QUOTE: "\"Cuando perdí mi fusil, el Ejército me cobró 85 dólares. Creo que, por esa razón, en la Marina el capitán se hunde con el barco\".\n\n- Dick Gregory"
 CAREER_PROFILE_BLITZ_THIS: "Bombardea esto..."
 CAREER_PROFILE_BLITZ_THIS_DESCRIPTION: "Opta por una defensa elástica como estrategia preferida en un general, mariscal de campo o país."
 CAREER_PROFILE_BLITZ_THIS_QUOTE: "\"Estira las líneas de defensa como un arquero tensando el arco y, luego, suelta\".\n\n- Desconocido"
 CAREER_PROFILE_SCORCHED_EARTH: "Tierra quemada"
 CAREER_PROFILE_SCORCHED_EARTH_DESCRIPTION: "Detona ferrocarriles con la función \"tierra quemada\" para frenar el avance enemigo."
 CAREER_PROFILE_SCORCHED_EARTH_QUOTE: "\"... el enemigo no debe encontrar una sola locomotora, un solo vagón, un solo kilo de cereales y ni tan solo un litro de combustible\".\n\n- Joseph Stalin, radiomensaje, 3 de julio de 1941"
 CAREER_PROFILE_RULED_BY_FURNITURE: "¡Nadie al volante!"
 CAREER_PROFILE_RULED_BY_FURNITURE_DESCRIPTION: "No dejes que se atribuya el mando de tu nación a uno o varios individuos concretos."
 CAREER_PROFILE_RULED_BY_FURNITURE_QUOTE: "\"La preocupación es como una mecedora: te da algo que hacer, pero nunca te lleva a ninguna parte\".\n\n- Antiguo proverbio inglés"
 CAREER_PROFILE_THE_THOUSAND_YEAR_BOND: "El vínculo milenario"
 CAREER_PROFILE_THE_THOUSAND_YEAR_BOND_DESCRIPTION: "Despliega cien batallones de caballería o caballería a camello."
 CAREER_PROFILE_THE_THOUSAND_YEAR_BOND_QUOTE: "\"Un caballo debe estar un poco loco para ser una buena montura de caballería, y su jinete debe estar completamente loco\".\n\n- Steven Pressfield"
 CAREER_PROFILE_ROCKETS_REIGN: "Reino de los cohetes"
 CAREER_PROFILE_ROCKETS_REIGN_DESCRIPTION: "Construye más de 10 instalaciones de cohetes."
 CAREER_PROFILE_ROCKETS_REIGN_QUOTE: "\"El cohete funcionó perfectamente, excepto que aterrizó en el planeta equivocado\".\n\n- Wernher Von Braun"
 CAREER_PROFILE_STEEL_AT_HIGH_SPEED: "Acero a gran velocidad"
 CAREER_PROFILE_STEEL_AT_HIGH_SPEED_DESCRIPTION: "Despliega más de 4000 tanques con una velocidad máxima superior a los 12 km/h."
 CAREER_PROFILE_STEEL_AT_HIGH_SPEED_QUOTE: "\"Si todo está bajo control, es que no vas lo suficientemente rápido\".\n\n- Mario Andretti"
 CAREER_PROFILE_ORCHESTRA_OF_BOOM: "Orquesta explosiva"
 CAREER_PROFILE_ORCHESTRA_OF_BOOM_DESCRIPTION: "Despliega una división que tenga al menos un batallón de defensa antiaérea, artillería, artillería de cohetes y antitanques, con el soporte de una compañía de transmisiones."
 CAREER_PROFILE_ORCHESTRA_OF_BOOM_QUOTE: "\n\"Un verdadero crescendo de sonidos, tan continuos que se fusionan y se mezclan en un solo rugido aniquilador, el rugido de un tren en un túnel multiplicado por un millón\".\n\n- Arnold D. Harvey"
 CAREER_PROFILE_TASK_FAILED_SUCCESSFULLY: "La misión ha fracasado"
 CAREER_PROFILE_TASK_FAILED_SUCCESSFULLY_DESCRIPTION: "Consigue que fracase un asalto con una tasa de éxito del 80% o más."
 CAREER_PROFILE_TASK_FAILED_SUCCESSFULLY_QUOTE: "\"La batalla ha de considerarse un reconocimiento de fuerza. Hemos tenido que recabar toda la información necesaria antes de iniciar operaciones a una escala mucho mayor\".\n\n- Winston Churchill sobre la Batalla de Dieppe el 8 de septiembre de 1942"
 CAREER_PROFILE_PUNCH_IT: "¡Dale!"
 CAREER_PROFILE_PUNCH_IT_DESCRIPTION: "Instalación nuclear asaltada mientras se controla, al menos, un Estado vecino de la misma."
 CAREER_PROFILE_PUNCH_IT_QUOTE: "\"Por el bienestar de las naciones, ha sido necesario que el ejército recupere la voluntad de morir\".\n\n - Alexander Kerensky sobre la Ofensiva de Julio"
 CAREER_PROFILE_PLAN_L: "Plan L"
 CAREER_PROFILE_PLAN_L_DESCRIPTION: "Empieza como país interior, completa 2 proyectos especiales navales, construye 10 destructores, 5 cruceros, 2 acorazados y 1 portaaviones."
 CAREER_PROFILE_PLAN_L_QUOTE: "\"La armada tarda tres años en construir un barco. Tardaremos trescientos años en instaurar una nueva tradición. La evacuación continuará\".\n\n - Andrew Cunningham sobre la evacuación de Creta"
 CAREER_PROFILE_SWEETENER_HEXADECAGON: "Incentivo hexadecagonal"
 CAREER_PROFILE_SWEETENER_HEXADECAGON_DESCRIPTION: "Investiga 16 tecnologías desbloqueadas por proyectos especiales"
 CAREER_PROFILE_SWEETENER_HEXADECAGON_QUOTE: "\"Cuando acudí a ti con esos cálculos, pensamos que quizá daríamos comienzo a una reacción en cadena que podría destruir el mundo entero\".\n\n - Robert Oppenheimer, Oppenheimer"
 CAREER_PROFILE_ISLAND_HOPPER: "Asaltaislas"
 CAREER_PROFILE_ISLAND_HOPPER_DESCRIPTION: "Hazte con el control de 10 emplazamientos estratégicos."
 CAREER_PROFILE_ISLAND_HOPPER_QUOTE: "\"¿Queréis vivir? ¡Pues largo de la playa!\".\n\n - John Basilone, The Pacific"
 CAREER_PROFILE_IM_THE_CAPTAIN_NOW: "Ahora soy yo el capitán"
 CAREER_PROFILE_IM_THE_CAPTAIN_NOW_DESCRIPTION: "Jugando con una nación menor, toma el liderazgo de una facción."
 CAREER_PROFILE_IM_THE_CAPTAIN_NOW_QUOTE: "\"Mírame, ahora yo capitán\".\n\n - Muse, capitán Phillips"
 CAREER_PROFILE_THREE_MUSKETEERS: "Los tres mosqueteros"
 CAREER_PROFILE_THREE_MUSKETEERS_DESCRIPTION: "Establece tres escenarios de facción con el desempeño de tus oficiales."
 CAREER_PROFILE_THREE_MUSKETEERS_QUOTE: "\"Todos para uno, y uno para todos. ¡Unidos, resistiremos! ¡Divididos, seremos vencidos!\".\n\n - Alexandre Dumas"
 CAREER_PROFILE_THE_MORE_THE_MERRIER: "Cuantos más mejor"
 CAREER_PROFILE_THE_MORE_THE_MERRIER_DESCRIPTION: "Consigue una bonificación de investigación conjunta en facción del 30%."
 CAREER_PROFILE_THE_MORE_THE_MERRIER_QUOTE: "\"Ningún hombre es una isla entera por sí mismo. Cada hombre es una pieza del continente, una parte del todo\".\n\n - John Donne"
 CAREER_PROFILE_IM_HERE_TO_RESCUE_YOU: "¡He venido a rescatarlo!"
 CAREER_PROFILE_IM_HERE_TO_RESCUE_YOU_DESCRIPTION: "Lleva a cabo con éxito un asalto para rescatar a tu comandante cautivo."
 CAREER_PROFILE_IM_HERE_TO_RESCUE_YOU_QUOTE: "\"Perdona por llegar unos minutos tarde\".\n\n - Lord Lovat"
 CAREER_PROFILE_DEJA_VU: "Déjà vu"
 CAREER_PROFILE_DEJA_VU_DESCRIPTION: "Lleva a cabo con éxito una operación de espionaje para rescatar a tu comandante cautivo."
 CAREER_PROFILE_DEJA_VU_QUOTE: "\"He vuelto a plantear la cuestión del rescate, y esta vez se ha actuado al respecto\".\n\n - Teniente Lapham"
 CAREER_PROFILE_THE_MORE_THINGS_CHANGES: "\"Cuanto más grande es el cambio, menos se cambia\"."
 CAREER_PROFILE_THE_MORE_THINGS_CHANGES_DESCRIPTION: "Obtén dominio completo de 2 doctrinas secundarias de las fuerzas especiales."
 CAREER_PROFILE_THE_MORE_THINGS_CHANGES_QUOTE: "\"Éramos prescindibles. Éramos un añadido, nada más\".\n\n - Teniente general Colin Gubbins"
 CAREER_PROFILE_FULLY_DECKED_OUT: "Bien servido"
 CAREER_PROFILE_FULLY_DECKED_OUT_DESCRIPTION: "Diseña y despliega una división que contenga 5 unidades de apoyo de división y 5 unidades de apoyo de regimiento."
 CAREER_PROFILE_FULLY_DECKED_OUT_QUOTE: "\"En caso de duda, atacad\".\n\n - George Patton"
 #Statistics
 CAREER_PROFILE_AIRSPACE_SUPERIORITY_RATING_LABEL: "Puntuación de superioridad en espacio aéreo disputado"
 CAREER_PROFILE_CIVILIAN_FACTORIES_BUILT_LABEL: "Fábricas civiles construidas"
 CAREER_PROFILE_MILITARY_FACTORIES_BUILT_LABEL: "Fábricas militares construidas"
