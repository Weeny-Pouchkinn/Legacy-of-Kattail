 emperor_fascism: "Fascismo imperial"
 emperor_fascism_desc: "El fascismo imperial, conocido también como \"fascismo desde lo alto\" es una vertiente del ultranacionalismo en la que las masas no tienen voz ni voto, y el poder lo ostenta una élite burocrática de militares y aristócratas que deben suma reverencia al emperador de la nación, monarca al que se enaltece como a una figura divina infalible."
 japan_militarism_ideology: "Militarismo"
 japan_militarism_ideology_desc: "El militarismo es una ideología en la que el líder de la nación tan solo ostenta un poder simbólico y actúa más bien como un títere al servicio del ejército nacional que como político independiente. Su objetivo trascendental es una política de expansionismo exacerbado."
 buddhist_socialism: "Socialismo budista"
 buddhist_socialism_desc: "El socialismo budista, también conocido como socialismo dhármico o natural, es una ideología política que defiende el socialismo basado en los principios del budismo. Tanto el budismo como el socialismo buscan poner fin al sufrimiento mediante el análisis de sus condiciones y la eliminación de sus causas principales a través de la praxis. Ambos también buscan proporcionar una transformación de la conciencia personal para poner fin a la alienación y el egoísmo humanos."
