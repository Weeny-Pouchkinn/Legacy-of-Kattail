l_spanish:
 operation_rescue_general: "Rescatar a comandante capturado"
 operation_rescue_general_desc: "§LEl enemigo ha capturado a uno de nuestros comandantes y lo tiene cautivo. Debemos planificar una operación para rescatarlo.§!"
 free_general_free_in_transit: "Liberación durante el traslado"
 free_general_free_in_transit_desc: "Nuestros agentes han identificado un traslado inminente del individuo y van a planear una oportunidad para interceptar y emboscar el traslado mientras se lleva a cabo."
 free_general_assault_holding_area: "Asalto al lugar del cautiverio"
 free_general_assault_holding_area_desc: "El enemigo tiene retenido a nuestro comandante en un lugar protegido que nuestros agentes han localizado. Se va a preparar un audaz asalto para liberarlo."
 free_general_disguise_and_extract: "Caracterización y extracción"
 free_general_disguise_and_extract_desc: "Gracias a su avezada astucia, nuestros agentes ayudarán al comandante capturado a fabricar un disfraz que le permita engañar a los captores y escapar a territorio amigo."
