l_spanish:
 #Shortcuts
 CZE_military_path_shortcut: "Fuerzas armadas"
 CZE_economic_path_shortcut: "Economía"
 CZE_diplomacy_path_shortcut: "Diplomacia"
 CZE_fort_path_shortcut: "Trabajos de fortificación"
 CZE_skoda_priority_shortcut_name: "Prioridad de Škoda"
 CZE_political_path_shortcut: "Política"
 # Č does show when scrolling through focuses, but not in the detailed focus view title (does work in the description though)
 CZE_coalition_building: "Creación de una coalición"
 CZE_coalition_building_desc: "La coalición surgida tras el resultado de las elecciones debe crear una mayor unidad entre sus miembros si quiere funcionar con eficacia. La reciente retirada de Jan Malypetr como primer ministro ha supuesto una presión adicional para que la gran coalición consolide su apoyo."
 CZE_merge_the_paramilitaries: "Fusionar los grupos paramilitares"
 CZE_merge_the_paramilitaries_desc: "Nuestros paramilitares se han dispersado y dividido en varios grupos. Si pretendemos recurrir a ellos, tendremos que obligarlos a fusionarse."
 CZE_integrated_paramilitaries: "Integrar a los paramilitares"
 CZE_integrated_paramilitaries_desc: "Es posible que al ejército no le agrade la idea, pero si integramos a los grupos paramilitares en él, dispondremos de reservas para cuando más falta nos hagan."
 CZE_wielding_the_hammer: "Empuñando el martillo"
 CZE_wielding_the_hammer_desc: "Podemos aprovechar nuestra superioridad en la Asamblea Nacional para acelerar el proceso de aprobación de leyes. Es de suma importancia poner orden en la cámara legislativa."
 CZE_emergency_measures: "Medidas de emergencia"
 CZE_emergency_measures_desc: "Implementaremos medidas de emergencia para lidiar con las múltiples crisis que asolan nuestro país, y emplearemos algunas de ellas para no perder de vista a quienes, en términos de ideología, discrepan con nuestro gobierno. Así, estaremos mejor preparados para superar los desafíos a los que nos enfrentamos."
 CZE_king_of_the_castle: "Mandamás"
 CZE_king_of_the_castle_desc: "Todos sabemos quién mueve los hilos en nuestro gobierno. Corren tiempos de gran incertidumbre y es hora de dejar de fingir y permitirle a $CZE_edvard_benesh$ que gobierne de forma más directa. La seguridad de nuestro país depende de ello."
 CZE_closer_ties_with_the_moderate_germany_parties: "Movilizar a los partidos moderados de los Sudetes"
 CZE_closer_ties_with_the_moderate_germany_parties_desc: "Algunos partidos de los Sudetes están dispuestos a colaborar con nuestra coalición y a establecer vínculos con el gobierno. Estrechemos esa relación."
 CZE_complete_reconciliation: "Reconciliación plena"
 CZE_complete_reconciliation_desc: "Hemos puesto de nuestra parte por tender puentes y recuperar la confianza. Es hora de reconciliarnos con nuestros compatriotas."
 CZE_complete_reconciliation_cooldown_flag: "Ha completado el enfoque §Y$CZE_closer_ties_with_the_moderate_germany_parties$§!"
 CZE_complete_reconciliation_cooldown_flag_tt: "Días que quedan: [?CZE_complete_reconciliation_cooldown_flag:days|Y0]"
 CZE_bastion_of_liberty: "Bastión de la libertad"
 CZE_bastion_of_liberty_desc: "En esta década, hemos sido unos de los pocos países verdaderamente pluralistas en la Europa del este del Rin. Que la gente no lo olvide."
 CZE_standing_against_the_storm: "Resistir contra la tormenta"
 CZE_standing_against_the_storm_desc: "A pesar de nuestras carencias y posible falta de preparación, afrontaremos cualquier desafío con firmeza y resistiremos a las tormentas que se avecinen."
 CZE_truth_prevails: "La verdad prevalece"
 CZE_truth_prevails_desc: "Incluso ante las grandes adversidades y las tareas imposibles, nuestro país sabe que el lema nacional (\"La verdad prevalece\") resonará con fuerza cuando todo esté dicho y hecho. Buscad la verdad, escuchadla y así prevalecerá."
 CZE_negotiations_with_the_autonomous_bloc: "Negociaciones con el bloque autónomo"
 CZE_negotiations_with_the_autonomous_bloc_desc: "Si queremos formar una coalición que no otorgue poder a la legión de lacayos de Beneš en la Asamblea Nacional, tendremos que colaborar con el bloque autónomo. Sin embargo, ganarnos su apoyo pleno conllevará un alto coste."
 CZE_slovakia_autonomy_agreement: "Acuerdo de autonomía de Eslovaquia"
 CZE_slovakia_autonomy_agreement_desc: "El precio que pagan los bloques autónomos que colaboran con nuestra coalición es un acuerdo de autonomía con nuestro gobierno. El coste es alto, pero las consecuencias de no cumplir con nuestra parte del trato podrían ser peores."
 CZE_slovakia_autonomy_agreement_tt: "¡§Y[RUT.getname]§! pedirá el mismo tratamiento que demos a §Y[SLO.getname]§!!"
 CZE_slovakia_autonomy_agreement_2_tt: "Las $CZE_the_autonomous_bloc_demands$ se aplazarán §Y35 días§! al seleccionar este enfoque."
 CZE_topple_the_king: "Derrocar al rey"
 CZE_topple_the_king_desc: "La influencia de $CZE_edvard_benesh$ en nuestro gobierno es asfixiante. Gracias al apoyo del que goza dentro del parlamento, su poder va más allá de sus funciones como presidente. Ahora que la situación es propicia, podemos suplantar su influencia en Horní Komora."
 CZE_comprise_with_the_carpathians: "Compromiso con los Cárpatos"
 CZE_comprise_with_the_carpathians_desc: "La región de Rutenia está presionando para que alcancemos un acuerdo de federalización similar al que le conferimos a [SLO.GetNameDef]. Esto debilitaría en gran medida nuestra posición en la región y en [9.GetName]. Llegar a un acuerdo es mejor que ceder a sus exigencias."
 CZE_the_rut_demands_add_35_CZE_comprise_with_the_carpathians_tt: "Las $CZE_the_rut_demands$ se aplazarán §Y35 días§! al seleccionar este enfoque."
 CZE_cut_carpathia_loose: "Dejar libre al Cárpato"
 CZE_cut_carpathia_loose_desc: "Ahora que Eslovaquia es un estado federal, la región de Rutenia se ha propuesto lograr un acuerdo parecido. Si bien la iniciativa puede antojarse descabellada en un principio, será complicado gobernar la región sin Eslovaquia sometida a nuestro control directo. Cabe plantearse, en este caso, ceder a sus exigencias."
 CZE_compromise_with_the_veteran_agrarian: "Compromiso con los agricultores"
 CZE_compromise_with_the_veteran_agrarian_desc: "La vieja guardia agraria nos supone un obstáculo a la hora de ganarnos al electorado urbano, cada vez más numeroso. Es imperioso avenirnos con ellos para obtener lo que deseamos."
 CZE_reorient_the_broad_coalition: "Reorientar el frente amplio"
 CZE_reorient_the_broad_coalition_desc: "Nuestro gobierno lleva ya muchos años encabezado por una amplia coalición de fuerzas políticas. Sin embargo, el consenso brilla por su ausencia últimamente entre los partidos que la integran. No podemos seguir postergando la reorientación de las políticas y objetivos de los distintos ministerios."
 CZE_leverage_sokol: "El movimiento Sokol"
 CZE_leverage_sokol_desc: "El movimiento Sokol es una organización de gran calado en nuestro país desde hace décadas. En contextos de crisis, podríamos dejar en sus manos el adiestramiento paramilitar, y sus miembros bien podrían ser valiosos soldados cuando la necesidad apriete."
 CZE_urbanist_policies: "Políticas urbanistas"
 CZE_deepend_ties_with_the_trademans: "Estrechar lazos con los mercantilistas"
 CZE_deepend_ties_with_the_trademans_desc: "El partido mercantilista goza de gran popularidad entre los votantes de clase media. Si los secundamos y colaboramos con ellos, tenderemos puentes con el electorado urbano sin que con ello se aliene al votante rural."
 CZE_apart_but_togather: "Separados pero unidos"
 CZE_apart_but_togather_desc: "Nuestras regiones gozan de mayor autonomía que nunca, pero también somos hoy más fuertes que ayer. Estamos preparados para afrontar cualquier escollo que se presente."
 CZE_contact_henlein: "Contactar con Henlein"
 CZE_contact_henlein_desc: "$CZE_konrad_henlein$ ha supuesto desde hace años un quebradero de cabeza constante para nuestro gobierno. Sin embargo, habida cuenta de la actualidad en el panorama internacional, tal vez sea oportuno entablar diálogo con él."
 CZE_contact_henlein_cooldown_flag: "Ha completado el enfoque §Y$CZE_no_compromise_with_the_sdp$§!"
 CZE_contact_henlein_cooldown_flag_tt: "Días que quedan: [?CZE_contact_henlein_cooldown_flag:days|Y0]"
 CZE_contact_henlein_focus_warning_tt: "Si completamos §Y$CZE_no_compromise_with_the_sdp$§!, tendremos que esperar §Y350§! días para poder seleccionar este §Yenfoque nacional§!."
 CZE_contact_henlein_focus_order_warning_tt: "Si tras completar este §Yenfoque nacional§! completamos §Y$CZE_no_compromise_with_the_sdp$§!, §Y$CZE_konrad_henlein$§! se jubilará."
 CZE_no_compromise_with_the_sdp: "Seguir vetando al Partido Alemán de los Sudetes"
 CZE_no_compromise_with_the_sdp_desc: "El Partido Alemán de los Sudetes no tiene nada que aportar a nuestra coalición. Tan solo buscan tensión política y empañar todo ejercicio que desempeñe nuestro gobierno. En aras de la gobernabilidad, es necesario seguir impidiéndoles que entren a formar parte de ninguna coalición."
 CZE_no_compromise_with_the_sdp_cooldown_flag: "Ha completado el enfoque §Y$CZE_contact_henlein$§!"
 CZE_no_compromise_with_the_sdp_cooldown_flag_tt: "Días que quedan: [?CZE_no_compromise_with_the_sdp_cooldown_flag:days|Y0]"
 CZE_no_compromise_with_the_sdp_focus_warning_tt: "Si completamos §Y$CZE_contact_henlein$§!, tendremos que esperar §Y350§! días para poder seleccionar este §Yenfoque nacional§!."
 # CZE_economic_integration: "Economic Integration"
 # CZE_economic_integration_desc: "Why stop at a customs union? Economic integration will further grow our economies and ensure our future is an affluent one for all members."
 CZE_form_a_federation: "Fundar una federación"
 CZE_form_a_federation_desc: "La idea de una federación central europea ya es más que una simple ensoñación. ¡Hoy poseemos poder suficiente para fundar una y, en calidad de gigante de la democracia, hacer frente si es necesario a las grandes potencias!"
 CZE_bend_the_bars: "$ITA_bend_the_bars$"
 CZE_bend_the_bars_desc: "$GER_european_confederation_desc$"
 CZE_reassure_the_army: "Apaciguar al ejército"
 CZE_reassure_the_army_desc: "Hay cierto nerviosismo en el ejército a causa de las últimas decisiones y políticas de nuestro gobierno. Haríamos bien en asegurarles que cuentan con nuestro amparo, por mucho que diga o haga el gobierno."
 CZE_outreach_to_the_western_powers: "Estrechar lazos con potencias occidentales"
 CZE_outreach_to_the_western_powers_desc: "Las democracias de Occidente nos aseguran su respaldo, pero no podemos dejar de trabajar en nuestras relaciones con ellas. Solo así nos cercioraremos de que sus bonitas palabras se tornen en actos cuando acucie la necesidad."
 CZE_demand_guarantees: "Exigir garantías tangibles"
 CZE_demand_guarantees_desc: "Aunque no faltan tratados y alianzas, debemos asegurarnos de que, en tiempos de desesperación, nuestros socios no nos dejarán en la estacada para evitarse complicaciones. Necesitamos garantías que no puedan quedarse en papel mojado."
 CZE_guardian_of_central_europe: "Guardianes de Europa Central"
 CZE_guardian_of_central_europe_desc: "Dada nuestra posición actual, bien podríamos considerarnos abanderados de la democracia en Europa Central y velar por los intereses de aquellas naciones incapaces de valerse solas. Todo sea por el triunfo de la democracia."
 CZE_central_european_faction: "Soberanos de Europa Central"
 CZE_central_european_faction_desc: "A pesar de nuestro afán por fortalecernos sin depender en demasía de la diplomacia, es fundamental no excedernos en cuanto a influencia. Tal vez vaya siendo hora de trabajar más allá de nuestras fronteras."
 CZE_strike_at_the_heart_of_bolshevism: "[THIS.GetAntiSovietFocusName]"
 CZE_strike_at_the_heart_of_bolshevism_1: "Atacar al seno del bolchevismo"
 CZE_strike_at_the_heart_of_bolshevism_2: "Asegurar el flanco oriental"
 CZE_strike_at_the_heart_of_bolshevism_desc: "La expansión de [SOV.GetNameDef] es una amenaza existencial para Europa y para nuestra nación. Nos corresponde, pues, ser el dique que le ponga coto."
 CZE_destroy_the_fascist_threats: "Acabar con las amenazas fascistas"
 CZE_destroy_the_fascist_threats_desc: "[CZE_get_fascist_threats_desc]"
 CZE_destroy_the_fascist_threats_desc_enemy_ger: "Sabemos de sobra cuál es la mayor amenaza para la paz en Europa. Alguien debe pararle los pies a [GER.GetNameDefCAP] antes de que sea tarde. Si nadie da el paso, ese alguien bien podemos ser nosotros."
 CZE_destroy_the_fascist_threats_desc_backup: "Por nuestra seguridad, es fundamental que nuestros países vecinos no adopten la retórica expansionista en cuyo punto de mira estaremos tarde o temprano."
 CZE_peace_on_our_time: "Peace for Our Time"
 CZE_peace_on_our_time_desc: "Hemos sido una cuestión secundaria en las relaciones internacionales europeas durante demasiado tiempo. ¡Esto ya no será así! Podemos valernos por nosotros mismos y fijar nuestras condiciones. Tanto en la guerra como en la paz."
 CZE_reach_out_for_military_assistance: "Solicitar asistencia militar"
 CZE_free_tuka: "Liberar a $CZE_vojtech_tuka$"
 CZE_free_tuka_desc: "$CZE_vojtech_tuka$ ha cumplido su sentencia en prisión. En lugar de buscar una excusa para prolongarla, podríamos optar por concederle la libertad y ponerlo al servicio de nuestro gobierno. Más provechoso será tenerlo a nuestras órdenes que trabajando por su cuenta."
 CZE_grow_the_anglo_czechoslovak_prague_credit_bank: "Banco Anglo-Checoslovaco"
 CZE_grow_the_anglo_czechoslovak_prague_credit_bank_desc: "El Banco de Crédito Anglo-Checoslovaco ha sido uno de los principales motores de nuestra industria. Y es que, sin sus fondos, no podríamos sostener el nivel de exportación que hemos logrado. Esta gran entidad se puede volver aún más grande si se abren filiales en Nueva York y se estrechan los lazos con [ENG.GetNameDef]. Además, de esta manera, a [ENG.GetName] le interesará defender la supervivencia de nuestra nación."
 CZE_feeding_the_alligator: "Agachar las orejas"
 CZE_feeding_the_alligator_desc: "Lo que [GER.GetName] pretende hacer de los Sudetes constituye una amenaza para la existencia misma de nuestra nación. Si les damos lo que desean, seguro que nos dejan tranquilos. ¿Verdad que sí?"
 CZE_complete_capitulation: "Sumisión total"
 CZE_complete_capitulation_desc: "¿Qué más remedio nos queda que ceder? El temporal que se avecina no somos capaces de capearlo. Si llegamos a un acuerdo con [GER.GetNameDef] ahora que aún tenemos algo con lo que negociar, nos agraciarán con cierta independencia, aun bajo su yugo."
 CZE_stabilize_the_protectorate: "Estabilizar el protectorado"
 CZE_stabilize_the_protectorate_desc: "Son tiempos turbulentos en el protectorado. Debemos poner de nuestra parte para convencer a la población de que este gobierno es legítimo y capaz de satisfacer sus necesidades."
 CZE_stabilize_the_protectorate_unretire_henlein_tt: "§Y$CZE_konrad_henlein$§! regresa al servicio de §Y[ROOT.GetName]§!."
 CZE_full_faith_in_hacha: "Fe plena en Hácha"
 CZE_full_faith_in_hacha_desc: "$CZE_emil_hacha$ suscita mucho más cariño y respeto entre la población que $CZE_emanuel_moravec$. Su labor podrá ser algo sospechosa, pero la popularidad prima sobre todo lo demás."
 CZE_moravecs_bohemia: "La Bohemia de Moravec"
 CZE_moravecs_bohemia_desc: "Corren raudos rumores de que $CZE_emil_hacha$ pretende desprestigiar al nuevo gobierno. Si aspiramos a prosperar y salir adelante en la coyuntura que nos ocupa, vamos a necesitar un liderazgo más afín a la ideología de nuestros soberanos."
 CZE_form_the_government_army: "Constituir el ejército del gobierno"
 CZE_form_the_government_army_desc: "Si deseamos que este país ondee victorioso su bandera, debemos constituir un nuevo ejército que no adolezca de las deficiencias del anterior, con un mando más próximo a nuestro gobierno en lo que respecta al terreno político."
 CZE_forced_administration_of_companies: "Administración forzosa de empresas"
 CZE_forced_administration_of_companies_desc: "A pesar de nuestro empeño en evitarlo, aún hay empresas que operan ajenas a nuestro control. Sometámoslas a nuestra administración sin demora."
 CZE_revisit_custom_union_talks: "Retomar el diálogo de la unión aduanera"
 CZE_revisit_custom_union_talks_desc: "Con según que vecinos, la negociación con respecto a la unión aduanera dejó bastante que desear. Va siendo hora de retomar el diálogo y redoblar nuestro envite a favor de la unión aduanera entre nuestros países."
 CZE_revisit_custom_union_talks_tt: "Aún podremos convencerlos de que se unan a nosotros, aunque por otros §Ymedios§!."
 CZE_revisit_custom_union_talks_2_tt: "Será mucho más probable que acepten nuestras exigencias de que se unan a nuestra federación."
 CZE_reintegrate_cross_border_rail_connections: "Mejorar las conexiones ferroviarias transfronterizas"
 CZE_reintegrate_cross_border_rail_connections_desc: "Mejorar las conexiones ferroviarias con nuestros vecinos nos puede servir para ganarnos su solidaridad, más aún si tenemos por objetivo mejorar nuestros vínculos económicos."
 CZE_reintegrate_cross_border_rail_connections_flag: "Las conexiones ferroviarias transfronterizas han mejorado"
 CZE_vonapo_20: "VONAPO 20"
 CZE_vonapo_20_desc: "No somos los únicos en advertir el peligro cada vez mayor proveniente de [GER.GetNameDef]. Se ha puesto en marcha una iniciativa de colaboración con [SOV.GetNameDef] cuyo fin es recabar información para echar por tierra las ambiciones [GER.GetAdjective]."
 CZE_increase_funding_from_moscow: "Solicitar financiación de [SOV.capital.GetCapitalVictoryPointName]"
 CZE_increase_funding_from_moscow_desc: "Las finanzas del [ROOT.GetCommunistParty] hacen aguas por doquier. Tanto es así, que las rentas de la sede las están costeando sus representantes de su propio bolsillo. Debemos recurrir a la financiación de [SOV.GetNameDef] a fin de crecer, desarrollar nuestro periódico y engrosar las filas de la militancia."
 CZE_zdenek_fierlinger_tt: "Nombrar consejero a §Y$CZE_zdenek_fierlinger$§!"
 CZE_expand_the_communist_press: "Acrecentar la prensa comunista"
 CZE_expand_the_communist_press_desc: "Nuestro periódico \"El Derecho Rojo\" podría servir para informar a quienes en estos tiempos no tienen un periódico que leer. Tan solo será necesario aumentar la financiación."
 CZE_anti_rearmament_propaganda: "Propaganda contra el rearme"
 CZE_anti_rearmament_propaganda_desc: "Con la caída del gobierno fascista de nuestro gran adversario, [GER.GetNonIdeologyName], podemos aseverar que hicimos bien en posicionarnos desde un principio en contra de la carrera armamentística."
 CZE_anti_democratic_propaganda: "Propaganda antidemócrata"
 CZE_anti_democratic_propaganda_desc: "A fin de aunar apoyos para nuestro partido, urge señalar las deficiencias de los gobiernos que se han sucedido en nuestra república y demostrar que nosotros llevaríamos una gestión mucho más ejemplar."
 CZE_form_workers_brigades: "Fundar una milicia proletaria"
 CZE_form_workers_brigades_desc: "Los trabajadores que liberamos deben estar preparados para participar en la lucha. Aunque carezcan de adiestramiento militar, pueden aportar los conocimientos profesionales que posea cada cual."
 CZE_kohler_faction: "La facción de Köhler"
 CZE_kohler_faction_desc: "Bruno Köhler y sus partidarios sostienen que es necesario defenestrar a la burguesía para fundar un Estado comunista checoslovaco capaz de prosperar."
 CZE_gottwald_faction: "La facción de Gottwald"
 CZE_gottwald_faction_desc: "Haciendo gala de una lealtad férrea a Moscú, la facción estalinista de Klement Gottwald aboga por un Estado checoslovaco a imagen y semejanza de la URSS."
 CZE_zapotocky_faction: "La facción de Zápotocký"
 CZE_zapotocky_faction_desc: "Los fundadores del partido comunista, Bohumir Šmeral y Antonin Zápotocký, propugnan una política más moderada que la que impuso Klement Gottwald al partido. Volvamos a aquellos postulados iniciales, pues solo así nos ganaremos la simpatía de todos los pueblos [CZE.GetAdjective]."
 CZE_ally_with_moderate_socialists: "Cooperar con los socialistas moderados"
 CZE_ally_with_moderate_socialists_desc: "Habrá países donde el comunismo no arrase en los comicios o [SOV.GetLeader] no goce de gran popularidad. No nos conviene, por tanto, cerrarnos las puertas a cooperar con corrientes más moderadas."
 CZE_democracies_willing_to_join_faction_tt: "§YLas naciones democráticas estarán más dispuestas a sumarse a nuestra facción comunista.§!"
 CZE_limited_cooperation: "Cooperación limitada con [SOV.GetLeader]"
 CZE_limited_cooperation_desc: "Pese a nuestras diferencias ideológicas, es posible que incluso [SOV.GetNameDef] nos reconozca como a un socio de valor y participe en según qué acuerdos pragmáticos, aunque en sus periódicos se nos denueste."
 CZE_denounce_stalinism: "Denunciar el estalinismo"
 CZE_denounce_stalinism_desc: "Por culpa de las injusticias de Stalin, la reputación del comunismo ha quedado mancillada de cara la posterioridad. Va siendo hora de tomar medidas militares para liberar a quienes sufren la tiranía de regímenes como el suyo."
 CZE_country_leader_has_ideology_stalinism_tt: "La ideología de quien gobierna el país es: §Y$stalinism$§!"
 CZE_cooperate_with_tito: "Cooperar con Tito"
 CZE_cooperate_with_tito_desc: "[YUG.GetNameDefCap] trata de poner en práctica un acercamiento pragmático al comunismo similar al nuestro. De igual manera, trata de aunar bajo el estandarte rojo a pueblos diversos. Debemos colaborar para acometer estas dificultades, tanto en el plano militar como en el político."
 CZE_reduce_divided_nation_cost_tt: "Reduce el coste y la duración de la mayoría de decisiones de §YUna nación dividida§!"
 CZE_balkan_union: "Consolidar la unión"
 CZE_balkan_union_desc: "Aunque son muchas las naciones de nuestro entorno que han abierto sus puertas al comunismo, no nos podremos defender de las potencias principales sin una colaboración indefectible. Para conseguirlo, lo más eficaz sería forjar una unión."
 CZE_cooperation_with_the_ussr: "Cooperación con [SOV.GetLeader]"
 CZE_cooperation_with_the_ussr_desc: "Hasta los partidarios más fervientes de [SOV.GetNameDef] dentro de nuestro partido reconocieron tras visitar el país las desventajas que ha supuesto su colectivización. Aun así, si colaboramos con su modelo actual, podremos analizar en qué erraron y en qué acertaron, y aplicar en [ROOT.GetNameDef] lo aprendido."
 CZE_exchange_military_expertise: "Compartir experiencia militar"
 CZE_exchange_military_expertise_desc: "[SOV.GetNameDefCap], al igual que la mayoría de las potencias con un ejército importante, ha experimentado con tácticas militares. Haríamos bien en pedir que nos transmitan sus aprendizajes, y nosotros compartiremos los nuestros."
 CZE_pressure_romania: "Presionar a Rumanía"
 CZE_pressure_romania_desc: "Si llegara a congeniar con nuestros adversarios, [ROM.GetNameDefCap] podría constituir una amenaza muy peligrosa y llegar incluso a truncar nuestra conexión con [SOV.GetNameDef] o procurar al enemigo un petróleo valiosísimo. Gracias al respaldo [SOV.GetAdjective], tal vez infundamos temor suficiente como para meterlos en cintura sin necesidad de un conflicto armado."
 CZE_facility_in_state_tt: "Si no hay otras §Yinstalaciones experimentales§! en $STATE|Y$, ganaremos §G1§! $FACILITY_TYPE|Y$ en $STATE|Y$."
 CZE_spread_the_revolution: "Extender la revolución"
 CZE_spread_the_revolution_desc: "La revolución ha triunfado en [ROOT.GetNameDef], y el siguiente paso es alentar al proletariado de otros países a luchar por su libertad, una lucha que podríamos respaldar."
 CZE_agrarian_reform: "Refundar la Oficina de Administración de Tierras"
 CZE_agrarian_reform_desc: "La Oficina de Administración de Tierras, disuelta hace no mucho, se ocupaba de redistribuir territorios agrícolas en su mayoría. Ya es hora de reformar dicha institución para poner en práctica medidas más tajantes."
 CZE_realign_the_church: "Ateísmo estatal"
 CZE_realign_the_church_desc: "Demasiado tiempo hemos permitido ya que la religión divida a las gentes [CZE.GetAdjective]. En adelante, restringiremos su influencia en ámbitos de Estado tales como la educación y la prensa, dando lugar así a una sociedad más unida."
 CZE_create_a_secret_police_branch: "Crear una división de policía secreta"
 CZE_create_a_secret_police_branch_desc: "En aras de la estabilidad, debemos defendernos de quienes buscan nuestro detrimento tanto desde dentro como desde fuera de nuestras fronteras, aprovechando que la población necesita tiempo para aclimatarse a un sistema aún en vías de perfeccionamiento."
 CZE_promote_urbanization: "$ARG_promote_urbanization$"
 CZE_promote_urbanization_desc: "Ahora que hemos creado granjas comunales eficientes, podemos iniciar programas para atraer a parte de la población rural a las ciudades y aumentar la productividad en ellas."
 CZE_confiscate_church_lands: "Expropiar las tierras de la Iglesia"
 CZE_confiscate_church_lands_desc: "La Iglesia posee muchísimas más tierras y riquezas de las que necesita para desempeñar sus cometidos. Parte de esas tierras se tienen que redistribuir, como hicimos ya con los campesinos."
 CZE_change_the_narrative: "Distorsionar la narrativa"
 CZE_change_the_narrative_desc: "Aunque la Iglesia no se ha pronunciado en apoyo de nuestra revolución por el momento, el acercamiento de nuestros valores y los suyos puede contribuir en gran medida a la popularidad del nuevo régimen."
 CZE_the_second_fortification_program: "Iniciar el segundo programa de fortificación"
 CZE_the_second_fortification_program_desc: "El primer programa de fortificación sentó las bases de las defensas cuya construcción necesitamos acometer de inmediato. En aras del futuro de nuestra nación, debemos poner en marcha el segundo programa cuanto antes y desarrollar nuestras líneas de fortificación."
 CZE_redirect_the_fortification_councils_funds: "Redirigir fondos de fortificación"
 CZE_redirect_the_fortification_councils_funds_desc: "Estos programas de fortificación son un lastre nada desdeñable para nuestra economía, y los fondos destinados a ellos estarían mejor empleados en financiar programas diversos. Además, el ejército no necesita más defensas, tiene de sobra."
 CZE_jachymov_uranium_mine: "Mina de uranio de Jáchymov"
 CZE_jachymov_uranium_mine_desc: "Las minas de Jáchymov son desde hace años una rica fuente de uranio y otros minerales. Sin embargo, el uranio no fue de gran provecho hasta que se produjeron los últimos avances en el campo de la física."
 CZE_skoda_internal_competition: "Estimular la competencia interna"
 CZE_skoda_internal_competition_desc: "En compañías de la envergadura de Škoda, cuesta que toda la plantilla rinda a niveles de productividad óptimos. Incentivar la competencia en todos los escalafones del organigrama se traducirá en una mejoría del desempeño laboral en todos nuestros centros."
 CZE_skoda_max_optimization_tt: "El nivel máximo de optimización del §Yenfoque de Škoda§! aumentará a 7."
 CZE_skoda_increase_cooperation: "Redoblar la cooperación dentro de Škoda"
 CZE_skoda_increase_cooperation_desc: "Con vistas a seguir mejorando, sería oportuno fomentar la cooperación entre fábricas para lograr un aumento del rendimiento, una medida que puede propiciar también la puesta en común de conocimientos y experiencia entre centros."
 CZE_skoda_fast_optimization_tt: "Índice de §Yenfoque de Škoda§! £GFX_prod_eff_cap El nivel de optimización aumenta con el tiempo hacia el nivel máximo: §G+100%§!"
 CZE_master_of_armaments: "Maestros de armamento"
 CZE_master_of_armaments_desc: "Škoda Works ha sido el mayor fabricante de armas de nuestro país desde los tiempos del Imperio austrohúngaro. Su experiencia y conocimientos técnicos no tienen parangón entre nuestros conglomerados industriales. Es hora de otorgarles el título de \"maestros de armamento\"."
 CZE_only_the_best_is_good_enough: "Solo lo mejor es lo suficientemente bueno"
 CZE_only_the_best_is_good_enough_desc: "Škoda Works siempre se ha guiado por una ética de trabajo duro y un espíritu innovador. Nuestros fundadores siempre se han regido por el lema \"¡Solo lo mejor es lo suficientemente bueno para nuestros clientes!\", un lema que es más cierto que nunca en los últimos tiempos."
 CZE_an_industrial_legacy: "Un legado industrial"
 CZE_an_industrial_legacy_desc: "Después de haber desarrollado la industria de nuestro país hasta cotas que antes se consideraban imposibles, por fin podemos aceptar y reivindicar nuestro legado industrial. Somos una potencia industrial sin parangón."
 CZE_powerhouse_of_europe: "Fuerza motriz de Europa"
 CZE_powerhouse_of_europe_desc: "Nuestra industria es la envidia del mundo entero. Hemos de garantizar que nuestro sector energético la abastece como es debido."
 CZE_supply_fighters_for_allies: "Suministrar cazas a los Aliados"
 CZE_supply_fighters_for_allies_desc: "Las administraciones [FRA.GetAdjective] y [ENG.GetAdjective] viven con un gran temor a que los aviones [GER.GetAdjective] enseguida desborden a sus defensas y se ensañen con sus ciudades si llegara a estallar un conflicto. Si contribuimos a acrecentar sus fuerzas aéreas, confiarán en su capacidad para detener el avance [GER.GetAdjective] sin incurrir en un número elevado de bajas."
 CZE_allies_more_likely_to_defend_us_tt: "§YSerá más probable que los Aliados nos respalden frente al expansionismo alemán con respecto al asunto de los Sudetes.§!"
 CZE_allies_more_likely_to_defend_us_2_tt: "§YSerá mucho más probable que los Aliados nos respalden frente al expansionismo alemán con respecto al asunto de los Sudetes.§!"
 CZE_allies_more_likely_to_defend_us_3_tt: "§YSerá un poco más probable que los Aliados nos respalden frente al expansionismo alemán con respecto al asunto de los Sudetes.§!"
 CZE_establish_the_state_defense_guard: "Fundar la Guardia Defensora del Estado"
 CZE_german_nonagressionpact: "Pacto Haushofer-Krofta"
 CZE_german_nonagressionpact_desc: "Hace ya cierto tiempo que se negocia un pacto de no agresión con [GER.GetNameDef]. Sin embargo, a raíz de ciertos síntomas de inestabilidad en [SOV.GetNameDef] y el desarrollo de nuevos planes expansionistas, el proceso se estancó. Ahora que otros enemigos acaparan la atención de [GER.GetNameDef], convendría tratar de retomar el diálogo."
 CZE_revive_the_czechoslovak_legion_dynamic: "[CZE_revive_the_czechoslovak_legion]"
 CZE_revive_the_czechoslovak_legion_default: "Revivir la Legión Checoslovaca"
 CZE_revive_the_czechoslovak_legion_communist: "Fundar una organización de voluntarios"
 CZE_revive_the_czechoslovak_legion_dynamic_desc: "Se está gestando un temporal de escala mundial, y los valerosos soldados de [ROOT.GetNameDef] están dispuestos a defender su patria. No obstante, y como ya tuvimos ocasión de aprender, defender la patria en ocasiones conlleva enviar a nuestras tropas a combatir al extranjero. Será necesario convocar una vez más a soldados deseosos de abandonar su tierra, paradójicamente, con el fin de defenderla."
 CZE_revive_the_czechoslovak_legion_nsb_tt: "§Y$CZE_legacy_of_the_czechoslovak_legion_army_spirit$§! pasará de ser un §Yespíritu del ejército§! a un §Yespíritu nacional§!."
 CZE_state_sponsored_recruitment_for_spain: "Reclutamiento de colaboración con España auspiciado por el Estado"
 CZE_state_sponsored_recruitment_for_spain_desc: "Tenemos el deber de instar a los avezados combatientes voluntarios de [ROOT.GetNameDef] a apoyar al bando de la Guerra Civil Española que más afín sea a nuestras políticas, ya que su intervención en el conflicto bien podría determinar el desenlace del mismo. Tal vez aprendamos incluso alguna que otra lección valiosa acerca de maniobras bélicas desarrolladas en la última década."
 CZE_support_spain_reward_tt: "§YEfectos si una facción española cuenta con voluntarios nuestros al ganar o perder:§!"
 CZE_profit_off_the_spanish_civil_war: "Sacar tajada de la Guerra Civil Española"
 CZE_profit_off_the_spanish_civil_war_desc: "La Guerra Civil Española está tomando un cariz de conflicto satelital para las grandes potencias. No deberíamos arriesgar las vidas de nuestros valientes soldados en un conflicto así. En cambio, es la oportunidad perfecta para nutrir de capital a nuestra industria vendiendo armas, a ser posible, a ambos bandos."
 CZE_skoda_sell_weapons_to_SPR_tt: "Desbloquea las decisiones: §YVender armas de forma encubierta a un bando español§!"
 CZE_placate_benes_faction: "Rendirse a la facción de Beneš"
 CZE_placate_benes_faction_desc: "$CZE_milan_hodza$ tiene que asimilar que su andadura como Ministro de Asuntos exteriores ha sido un desastre. $CZE_edvard_benesh$, con sus simpatizantes del partido agrario, se prestará a respaldar a $CZE_milan_hodza$ en el cargo de Primer Ministro siempre y cuando este renuncie al Ministerio de Asuntos exteriores."
 CZE_claim_lands_of_the_bohemian_crown: "Exigir los territorios de la corona de Bohemia"
 CZE_claim_lands_of_the_bohemian_crown_desc: "Puesto que nuestra nación fue territorio fronterizo de diversos imperios a lo largo de los siglos, fueron más los diversos conflictos que la voluntad del pueblo lo que delineó nuestras fronteras en multitud de ocasiones. Ha llegado el momento de saldar esa cuenta pendiente."
 CZE_demand_katowice: "Exigir [762.GetName]"
 CZE_demand_katowice_desc: "Si integramos [762.GetName] en el territorio nacional, no solo recuperaremos nuestras fronteras de antaño; también restaremos fundamento a las reivindicaciones [POL.GetAdjective] con respecto a [72.GetName]."
 CZE_fight_over_silesia: "Luchar por Silesia"
 CZE_fight_over_silesia_desc: "Por mucho que Silesia sea territorio legítimo [ROOT.GetAdjective], es preferible evitar una guerra total con [66.owner.GetNameDef]. Así pues, hagamos gala de nuestro poderío con una escaramuza fronteriza de gran calado, y tal vez así logremos adueñarnos de la región sin llegar a disputar un conflicto serio, siempre y cuando [66.owner.GetNameDef] no desee destinar recursos ingentes a la defensa de Silesia."
 CZE_dismantle_poland: "Desmantelar [POL.GetNonIdeologyName]"
 CZE_dismantle_poland_desc: "Habida cuenta de su incapacidad de defenderse, queda de manifiesto que no podemos confiar en que [POL.GetNameDef] sirva de estado colchón frente a nuestros enemigos. Lo más aconsejable, pues, es fortalecer nuestro propio Estado."
 CZE_proclaim_the_restoration_of_bohemia: "Proclamar la restauración del Reino de Bohemia"
 CZE_proclaim_the_restoration_of_bohemia_desc: "Ahora que nuestras fronteras vuelven a ser las de otrora, podemos hacer hincapié en recuperar lo que por legado nos pertenece e integrar nuevas tierras."
 CZE_integrate_lost_territories: "Integrar territorios perdidos"
 CZE_integrate_lost_territories_desc: "Las tierras históricas del Reino de Bohemia se extienden desde el mar Báltico hasta el Adriático. Ha llegado el momento de recurrir a esta historia mientras integramos nuestras nuevas posesiones."
 CZE_deepen_ties_with_puppet_kingdoms: "Afianzar los lazos con los reinos títeres"
 CZE_deepen_ties_with_puppet_kingdoms_desc: "Aunque ahora contamos con una esfera de influencia clara, tendremos que reforzar aún más nuestro dominio para sacar el máximo partido de estas naciones alineadas."
 CZE_poland_alliance_monarchist: "Acuerdo con [POL.GetNonIdeologyName]"
 CZE_poland_alliance_monarchist_desc: "$CZE_ally_poland_desc$"
 CZE_a_strong_poland: "Una [POL.GetNonIdeologyName] fuerte"
 CZE_a_strong_poland_desc: "Con uno de los ejércitos más poderosos de Europa del Este, [POL.GetNameDef] tiene el potencial de convertirse en un valioso aliado."
 CZE_mend_balkan_relations: "Mejorar las relaciones en los Balcanes"
 CZE_facilitate_a_strong_hungary: "Fomentar una Hungría fuerte"
 CZE_facilitate_a_strong_hungary_desc: "Desde su independencia, [HUN.GetNameDef] ha mantenido relaciones inestables con nosotros. Sin embargo, con el conflicto gestándose, es posible que nuestra causa les convenza."
 CZE_subjegate_romania: "Presionar a Rumanía con exigencias [HUN.GetAdjective]"
 CZE_subjegate_romania_desc: "Las reivindicaciones de nuestro títere [HUN.GetAdjective] son una herramienta útil contra [ROM.GetNameDef]. Al amenazar con permitir que [HUN.GetNameDef] imponga sus reivindicaciones en el territorio [ROM.GetAdjective] y ayudarlos a hacerse con él, podríamos exigir la alineación de [ROM.GetNameDef]."
 CZE_demanded_overlordship_HUN: "Hungría subyugada"
 CZE_demanded_overlordship_ROM: "Rumanía subyugada"
 CZE_integrate_hungary: "Integrar antiguos territorios austríacos"
 CZE_integrate_hungary_desc: "Ahora que hemos establecido una esfera de influencia significativa, la integración de la recién ampliada [HUN.GetName] y otros territorios podría llevar al restablecimiento de las fronteras austrohúngaras, aunque bajo el liderazgo [ROOT.GetAdjective]."
 CZE_subjegate_serbia: "Someter a [YUG.GetName]"
 CZE_subjegate_serbia_desc: "La ahora debilitada [YUG.GetName] ya no sirve como estado colchón eficaz para defender nuestro flanco sur tras la integración de Eslovenia. Ahora deberíamos aspirar a expandirnos aún más."
 CZE_strike_the_eastern_threat: "Aplastar la amenaza oriental"
 CZE_strike_the_eastern_threat_desc: "Los hipócritas de [SOV.GetName], que justifican sus ambiciones imperiales criticando a nuestro gobierno, constituyen una amenaza existencial para [CZE.GetName] y deben ser eliminados."
 CZE_assist_austria: "Proteger [AUS.GetName]"
 CZE_assist_austria_desc: "Mantener a [AUS.GetNameDef] fuera de cualquier conflicto es esencial para nuestra seguridad nacional. La frontera [AUS.GetAdjective] es uno de los puntos más vulnerables de nuestras defensas. Además, su economía sería un activo valioso para nuestros enemigos, lo cual no hemos de permitir."
 CZE_return_to_democracy: "Regresar a la democracia"
 CZE_return_to_democracy_desc: "Con nuestro hogar protegido, la población es cada vez más consciente de que una dictadura militar ya no es productiva. Por lo tanto, es hora de celebrar elecciones y devolver el poder a una administración democrática y encabezada por civiles."
 CZE_cooperate_with_the_allies: "Cooperar con los aliados"
 CZE_cooperate_with_the_allies_desc: "Ahora que la región tiene más estabilidad, debemos esforzarnos por restablecer los lazos con nuestros aliados tradicionales."
 CZE_eliminate_austrian_defeatists: "Derrotar a los derrotistas [AUS.GetAdjective]"
 CZE_eliminate_austrian_defeatists_desc: "[AUS.GetNameDefCap] ha renunciado a defender su Estado. Debemos intervenir ahora antes de que nuestros enemigos lleguen a nuestras puertas."
 CZE_the_legacy_of_ottokar: "El legado de Otakar"
 CZE_the_legacy_of_ottokar_desc: "El legendario rey Otakar II amplió el Reino de Bohemia hasta Austria y el Adriático con el consentimiento de los nobles austriacos. Debemos apelar una vez más a los austriacos, tanto nobles como plebeyos."
 CZE_demand_the_istrian_peninsula: "Exigir la península de Istria"
 CZE_demand_the_istrian_peninsula_desc: "Que [ROOT.GetNameDefCap] sea un país sin salida al mar ha sido durante demasiado tiempo un obstáculo para nuestro comercio e influencia. Ya no podemos aceptar que nuestra economía esté a merced de los países vecinos y debemos exigir un acceso al Adriático."
 CZE_demand_slovenia: "Exigir Eslovenia"
 CZE_demand_slovenia_desc: "Eslovenia fue una parte importante del Imperio austriaco y, ahora que hemos asumido el control del núcleo de ese imperio, debemos reclamar su territorio una vez más."
 CZE_demand_overlordship_of_yugoslav_league: "Exigir el dominio absoluto de la Liga [YUG.GetAdjective]"
 CZE_demand_overlordship_of_yugoslav_league_desc: "Aunque sabemos tan bien como [YUG.GetName] que la autonomía local es a veces necesaria en una nación multiétnica, su alianza ahora es demasiado débil para defenderse. Debemos apelar a [YUG.GetNameDef] para que lo reconozca y nos permita intervenir."
 CZE_expand_the_rome_protocols: "Ampliar los Protocolos de Roma"
 CZE_expand_the_rome_protocols_desc: "Nuestro nuevo gobierno se alinea mucho más con el de [ITA.capital.GetCapitalVictoryPointName] que con el de [GER.capital.GetCapitalVictoryPointName]. Con los desacuerdos entre ambos sobre Austria, unirse a los Protocolos de Roma podría dar a [ITA.GetNameDef] la confianza que necesita para mantener su rumbo actual en lugar de volverse hacia [GER.GetNameDef]."
 CZE_prague_protocols: "Protocolos de Praga"
 CZE_soviet_alliance: "Ampliar el Tratado de Alianza de 1935"
 CZE_soviet_alliance_desc: "El actual Tratado de Alianza con [SOV.GetNameDef] es demasiado ambiguo como para estar seguros de que intervendrán si somos atacados, por lo que debemos ponernos en contacto con ellos para alcanzar un nuevo acuerdo si queremos garantizar nuestra seguridad."
 CZE_airlift_soviet_support: "Apoyo aéreo soviético"
 CZE_airlift_soviet_support_desc: "La falta de fronteras con nuestro aliado [SOV.GetAdjective] ha dado lugar a la novedosa idea de enviar tropas [SOV.GetAdjective] por aire. Nunca antes se ha llevado a cabo una operación de transporte de tal envergadura, pero significaría que las tropas [SOV.GetAdjective] no tendrían que entrar en el territorio de nuestros vecinos, al menos por tierra."
 CZE_unlocks_volunteer_transport_raid_tt: "Desbloquea el §Yasalto§!:\npuente aéreo para los voluntarios soviéticos en §Y[73.GetName]§!."
 CZE_intervene_in_the_ussr: "Intervenir en la guerra civil [SOV.GetAdjective]"
 CZE_intervene_in_the_ussr_desc: "Una vez más hay disturbios en [SOV.GetNameDef] y, aunque la familia real a la que antaño apoyábamos no va a regresar, no se puede descartar la posibilidad de un gobierno más favorable."
 CZE_forgive_trading_debts: "Condonar las deudas comerciales"
 CZE_forgive_trading_debts_desc: "La inestabilidad económica y la Gran Depresión han provocado que algunos de nuestros posibles aliados tengan deudas con nosotros difíciles de pagar, lo cual deteriora las relaciones. El gobierno podría condonar estas deudas y compensar a las empresas locales afectadas por esta medida."
 CZE_improve_balkan_trade_relations: "Mejorar las relaciones comerciales en los Balcanes"
 CZE_improve_balkan_trade_relations_desc: "Nuestro mayor activo para ganarnos a los posibles aliados balcánicos es nuestra economía, así que debemos mostrar nuestra disposición a invertir recursos para mejorar la situación económica de estos posibles aliados."
 CZE_ally_austria: "Aliarse con [AUS.GetName]"
 CZE_ally_austria_desc: "[AUS.GetNameDef], cuyo gobierno estuvo a punto de ser derrocado por criminales nazis hace solo unos años, debería empezar a darse cuenta de los posibles beneficios de cooperar con [ROOT.GetNameDef]."
 CZE_demand_the_czech_corridor: "Exigir el corredor checo"
 CZE_demand_the_czech_corridor_desc: "A medida que consolidamos la Pequeña Entente como una alianza en condiciones, está cada vez más claro que enviar tropas a nuestros aliados, o recibir a las suyas, podría complicarse de cara a un conflicto. Disponer de una franja territorial que conecte nuestro país con [YUG.GetNameDef], tal y como se propuso tras la Gran Guerra, mejorará nuestra seguridad y protegerá nuestro comercio."
 CZE_ally_hungary: "Aliarse con [HUN.GetName]"
 CZE_ally_hungary_desc: "A pesar de los conflictos que han marcado nuestras relaciones con [HUN.GetNonIdeologyName] desde el surgimiento de [CZE.GetNonIdeologyName], recientemente han mostrado potencial para convertirse en un valioso aliado."
 CZE_ally_yugoslavia: "Aliarse con [YUG.GetName]"
 CZE_ally_yugoslavia_desc: "Puede que [YUG.GetNameDefCap] haya tenido dificultades económicas en los últimos tiempos, pero no se pueden pasar por alto sus recursos estratégicos y su ubicación."
 CZE_protect_neutrality: "Proteger la neutralidad"
 CZE_protect_neutrality_desc: "La Primera Guerra Mundial dejó claro que intentar mantenerse neutral es inútil cuando se está en el punto de mira del enemigo. Proteger a estas naciones significa obligar a nuestros enemigos a librar una guerra en dos frentes cuando se expanden, en lugar de permitirles dividir y conquistar."
 CZE_if_cooperate_with_moderate_socialists_completed_tt: "Efectos si se ha completado §YCooperar con los socialistas moderados§!:"
 CZE_mutual_protection_agreement_with_switzerland: "Acuerdo de protección con [SWI.GetNonIdeologyName]"
 CZE_mutual_protection_agreement_with_switzerland_desc: "Tanto nosotros como [SWI.GetNameDef] estamos trabajando para lograr una situación en la que sea imposible invadir nuestras tierras sin sufrir pérdidas inasumibles. Si cooperamos, podríamos reunir un ejército con efectivos suficientes no solo para defendernos, sino también para contraatacar de forma decisiva."
 CZE_exchange_technology: "Cooperar en investigación"
 CZE_exchange_technology_desc: "A pesar de la abundancia de recursos naturales, los Balcanes carecen de las colonias rentables o la industria avanzada de las grandes potencias. Por lo tanto, es fundamental que cooperemos en materia de investigación para poder centrarnos en nuestras respectivas especialidades."
 CZE_demand_corridor_to_ussr: "Exigir un corredor hasta [SOV.GetName]"
 CZE_demand_corridor_to_ussr_desc: "Si [POL.GetNameDef] no coopera con nosotros, tendremos que tomar medidas más serias para garantizar el acceso a nuestros aliados de [SOV.GetName]."
 CZE_ally_poland: "Aliarse con [POL.GetName]"
 CZE_ally_poland_desc: "Con la guerra polaco-soviética aún en la memoria y una amenaza creciente al oeste, [POL.GetNameDef] se encuentra en una búsqueda de seguridad similar a la nuestra. Debemos convencer al gobierno [POL.GetAdjective] de que la neutralidad no los salvará, y de que deben unir su destino al nuestro."
 CZE_realize_the_polish_czechoslovak_confederation: "Crear una confederación"
 CZE_realize_the_polish_czechoslovak_confederation_desc: "A pesar de su valiente lucha, [POL.GetNameDef] ha sido derrotada. Ahora que su gobierno está en el exilio, han surgido ideas de una unión con nosotros. Si su gobierno y el nuestro se fusionaran, podríamos reunir al pueblo [POL.GetAdjective] en este nuevo Estado y emprender un esfuerzo coordinado para liberar nuestra patria común."
 CZE_integrate_western_ukrainians: "Integrar a los ucranianos occidentales"
 CZE_integrate_western_ukrainians_desc: "A los ucranianos de [CZE.GetNameDef] se les ha ofrecido una gran ayuda y autonomía. Ahora podemos intentar integrar los nuevos territorios adquiridos en nuestra provincia ucraniana."
 CZE_ally_russia: "Aliarse con [SOV.GetNonIdeologyName]"
 CZE_ally_russia_desc: "Ahora que el gobierno de [SOV.GetNameDef] está más alineado con el nuestro, podríamos intentar ampliar el acuerdo impreciso firmado con su gobierno anterior."
 CZE_claim_ukraine: "Establecer un gobierno ucraniano amistoso"
 CZE_claim_ukraine_desc: "Ucrania es una pieza importante de [SOV.GetNameDef]. Al apoderarnos de ella, podríamos formar un poderoso estado colchón."
 CZE_strengthen_the_little_entente: "Formalizar la Pequeña Entente"
 CZE_strengthen_the_little_entente_desc: "La Pequeña Entente, dirigida principalmente a contener a [HUN.GetNonIdeologyName], tiene el potencial de convertirse en una alianza seria con un ejército considerable."
 CZE_seek_french_leadership: "Buscar el liderazgo [FRA.GetAdjective]"
 CZE_seek_french_leadership_desc: "Si bien ha sido nuestra iniciativa aliarnos, está claro que el ejército de [FRA.GetNonIdeologyName] sería una gran incorporación para cualquier alianza, incluso si eso significa ceder el liderazgo."
 CZE_increase_food_and_resource_imports: "Aumentar las importaciones de alimentos y recursos"
 CZE_increase_food_and_resource_imports_desc: "Ahora que nuestros nuevos aliados cuentan con una industria agrícola fuerte, ya no es tan necesario subvencionar la nuestra. Importar recursos a bajo precio nos permitirá ahorrar dinero y, al mismo tiempo, impulsará la economía de nuestros aliados."
 CZE_double_down_on_heavy_industry: "Apostar fuerte por la industria pesada"
 CZE_double_down_on_heavy_industry_desc: "Los nuevos acuerdos con nuestros aliados nos permitirán centrarnos en las industrias más competitivas, como la industria armamentística. Cualquier excedente podrá venderse."
 CZE_neutralize_the_hungarian_threat: "Neutralizar la amenaza [HUN.GetAdjective]"
 CZE_neutralize_the_hungarian_threat_desc: "[HUN.GetNameDefCap] es un obstáculo para el comercio con posibles aliados del sur y, si se alía con nuestros enemigos, podría mantener ocupada una parte potencialmente vital de nuestro ejército a pesar del impacto del Tratado de Trianón."
 CZE_cancel_anti_hungary_focus: "Se echó atrás después de la intervención [GER.GetAdjective]"
 CZE_ally_romania: "Aliarse con [ROM.GetName]"
 CZE_ally_romania_desc: "[ROM.GetNameDefCap] es una de las naciones más autosuficientes de la región, ya que produce alimentos y petróleo de gran valor. Aliarnos con ellos no solo nos facilitaría el acceso mutuo a los recursos de cada uno, sino que también privaría a nuestros enemigos de las materias primas que necesitan para librar una guerra contra nosotros."
 CZE_divide_germany: "Dividir Alemania"
 CZE_divide_germany_desc: "La amenaza de [GER.GetNameDef] es difícil de contrarrestar sin ayuda, por lo que debemos buscar aliados que compartan nuestra preocupación por la expansión [GER.GetAdjective] y tengan la voluntad de actuar de forma preventiva."
 CZE_if_FRA_ally_tt: "Efectos si §YFrancia es monárquica§! y no se ha aliado con nadie más todavía:"
 CZE_if_POL_ally_tt: "Efectos si §YUna Polonia fuerte§! se ha completado con éxito y [POL.GetNonIdeologyName] ha ofrecido garantías:"
 CZE_revolutionary_brigades: "Brigadas revolucionarias"
 CZE_revolutionary_brigades_desc: "Nuestros revolucionarios, que ya tienen experiencia luchando por [ROOT.GetNameDef], deben integrarse más en el ejército regular."
 CZE_recruit_communist_exiles: "Reclutar a los exiliados comunistas"
 CZE_recruit_communist_exiles_desc: "[ROOT.capital.GetCapitalVictoryPointName] ha sido durante mucho tiempo un refugio seguro para los revolucionarios exiliados, y nuestro nuevo gobierno podría hacer uso de ellos."
 CZE_destabilize_potential_adversaries: "Desestabilizar a posibles adversarios"
 CZE_destabilize_potential_adversaries_desc: "Los comunistas exiliados con los que trabajamos tienen un conocimiento de su país natal que incluso nuestros espías tienen dificultades para igualar. Debemos aprovechar al máximo esta información a la hora de decidir una estrategia para liberar su patria."
 CZE_nationalize_key_industries: "Nacionalizar los bancos y las minas"
 CZE_nationalize_key_industries_desc: "Las minas proporcionan la materia prima con la que nuestra industria forja las armas de la guerra. En tiempos de crisis, es mejor dejar el suministro de material en manos del gobierno, y no de financieros e industriales."
 CZE_rehabilitate_the_army: "Rehabilitar el ejército"
 CZE_rehabilitate_the_army_desc: "La mayoría de los generales del ejército [CZE.GetAdjective] son veteranos de la Legión Checoslovaca, que luchó contra los soviéticos en la guerra civil. Será necesario garantizar su lealtad al nuevo gobierno [CZE.GetAdjective]."
 CZE_unlock_civil_war_army_generals_tt: "Recuperar a los comandantes perdidos en la guerra civil"
 CZE_recruit_ideologically_aligned_generals: "Reclutar generales ideológicamente fiables"
 CZE_recruit_ideologically_aligned_generals_desc: "Es hora de ajustar nuestros programas de entrenamiento y enriquecer el ejército con nuevos candidatos que entiendan sus nuevos valores."
 CZE_recruit_communist_generic_general_tt: "Obtiene un general comunista."
 CZE_purge_two_random_commanders_tt: "Se purgarán dos comandantes elegidos al azar."
 CZE_czechoslovak_union: "Unión Checoslovaca"
 CZE_czechoslovak_union_desc: "Es necesario aumentar la autonomía local en [CZE.GetNameDef], lo que permitirá adaptar el sistema comunista a las circunstancias locales."
 CZE_continue_industrial_relocation_schemes: "Continuar con los planes de reubicación de las armerías"
 CZE_continue_industrial_relocation_schemes_desc: "Por el bien de nuestra seguridad nacional, debemos seguir trasladando nuestras fábricas más vulnerables a zonas donde estén mejor protegidas contra ataques aéreos y terrestres. No podemos arriesgar una industria tan importante poniéndola en peligro."
 CZE_continue_industrial_relocation_schemes_tt: "Elimina §Y1 fábrica militar§!."
 CZE_continue_industrial_relocation_schemes_2_tt: "§RHabrá que reconstruir las fábricas.§!"
 CZE_establish_a_armament_factory_in_uhersky_brod: "Fundar la fábrica de armamento Uherský Brod"
 CZE_establish_a_armament_factory_in_uhersky_brod_desc: "Uherský Brod es una fábrica de armamento que se especializa en diseñar y fabricar armas automáticas para la infantería y la aviación. Planeamos convertirla en la fábrica más avanzada de su clase en el mundo."
 CZE_appeal_to_the_castle: "Llamamiento al Castillo"
 CZE_appeal_to_the_castle_desc: "El \"castillo\" de Checoslovaquia hace referencia a la extensa red de organizaciones y personas influyentes que apoyan a sus presidentes. Este poder, a su vez, les permite ejercer más influencia de la que sugerirían sus limitadas funciones constitucionales. Recabar el apoyo de esta organización supondría un impulso increíble para nuestra lucha por el liderazgo."
 CZE_petition_the_nobles: "Pedir ayuda a los nobles"
 CZE_petition_the_nobles_desc: "La clase noble de [ROOT.GetNameDef] puede que ya no tenga títulos reconocidos, pero sigue siendo una parte influyente de la sociedad [ROOT.GetAdjective], y su apoyo nos proporcionaría tanto la legitimidad como los recursos necesarios para obtener más protección."
 CZE_unify_the_fascist_parties: "Unificar los partidos fascistas"
 CZE_unify_the_fascist_parties_desc: "El panorama de los partidos fascistas está fragmentado, con formaciones tan extremistas que nunca podrán aspirar a obtener un apoyo significativo. En defensa de la nación, es necesario que estos partidos se unan y creen una visión de Checoslovaquia que no solo resulte atractiva para los extremistas."
 CZE_pro_rearmament_propaganda: "Propaganda a favor del rearme"
 CZE_pro_rearmament_propaganda_desc: "Para aumentar el apoyo a un gobierno más centralizado, debemos destacar la frágil situación actual del mundo que nos rodea. Esto también ayudará a motivar a la población a apoyar los planes para reforzar el ejército cuando sea necesario."
 CZE_align_nationalist_parties: "Alinear los partidos nacionalistas checos"
 CZE_align_nationalist_parties_desc: "Aunque debemos intentar atraer a todos los ideales [ROOT.GetAdjective], no se puede negar que los partidos nacionalistas checos tradicionales son los más influyentes en la escena política, y es con ellos con quienes podemos recabar apoyo más fácilmente."
 CZE_align_slovak_catholics: "Alinear a los católicos eslovacos"
 CZE_align_slovak_catholics_desc: "Los partidos católicos y nacionalistas cuentan actualmente con un gran apoyo en Eslovaquia. Aunque sería difícil atraer a los nacionalistas sin concesiones importantes, tal vez podamos reunir a los elementos católicos en torno a nuestra causa."
 CZE_jozef_tiso_tt: "Nombrar consejero a §Y$CZE_jozef_tiso$§!"
 CZE_align_catholic_parties: "Alinear al ČSL"
 CZE_align_catholic_parties_desc: "El ČSL y otros partidos católicos fueron la base tradicional del sistema monárquico en el Imperio austrohúngaro, es hora de que intentemos que vuelvan a esa posición."
 CZE_restore_the_monarchy: "Restaurar la monarquía"
 CZE_restore_the_monarchy_desc: "Ahora que se ha establecido el apoyo a un nuevo sistema, es el momento de presentar la idea perfeccionada al pueblo. Con $CZE_karel_schwarzenberg$ como monarca, apelamos tanto a los antiguos partidarios de la monarquía como a los nuevos, ya que el monarca propuesto es [ROOT.GetAdjective], y no [AUS.GetAdjective] como el que se nos impuso anteriormente."
 CZE_semi_constitutional_monarchy: "Un sistema semiconstitucional"
 CZE_semi_constitutional_monarchy_desc: "Ahora que se ha elegido un monarca, es el momento de revisar la Constitución. Aunque algunos abogan por centralizar el poder para evitar luchas internas en estos tiempos turbulentos, está claro que el monarca no puede hacerlo todo por sí solo. Por lo tanto, quizá lo mejor sea mantener en parte el sistema actual para ayudar a gobernar el país, al tiempo que se cuenta con el monarca para guiarlo."
 CZE_restore_noble_titles: "Restablecer títulos nobiliarios"
 CZE_restore_noble_titles_desc: "Anteriormente abolidos cuando se fundó la república, es hora de recompensar la cooperación de la nobleza restaurándola. Esto también nos permitirá otorgar títulos honoríficos a héroes como los oficiales veteranos que lucharon una y otra vez por el Estado [ROOT.GetAdjective]."
 CZE_restore_the_austro_hungarian_customs_union: "Restablecer la unión aduanera del imperio"
 CZE_restore_the_austro_hungarian_customs_union_desc: "Una de las ventajas innegables del Imperio austrohúngaro eran las escasas barreras comerciales para nuestra industria, por lo que recuperar esta unión sería el primer paso para atraer a los demás países que lo integraban a nuestra esfera de influencia."
 CZE_customs_union: "Unión aduanera"
 CZE_catholic_focus: "Enfoque católico"
 CZE_catholic_focus_desc: "A pesar de que los husitas son una parte famosa de la historia [ROOT.GetAdjective], muchos siguen teniendo creencias católicas a las que debemos apelar aumentando su papel en la sociedad."
 CZE_hussite_legacy: "Legado husita"
 CZE_hussite_legacy_desc: "Los husitas no solo promovieron un estilo más protestante del cristianismo, sino que también se distinguieron por su tolerancia hacia otras opiniones al respecto, a diferencia de los tiranos que libraron guerras para oponerse a ellos."
 CZE_align_with_germany: "Aliarse con [GER.GetNonIdeologyName]"
 CZE_align_with_germany_desc: "El nuevo gobierno de [GER.GetNameDef] no tiene por qué ser menos expansionista, pero es posible que se muestre más dispuesto a ser pragmático a la hora de elegir con quién forma alianzas y a quién denuncia. Debemos esforzarnos por estar en el primer grupo."
 CZE_rally_against_germany: "Protesta contra [GER.GetNonIdeologyName]"
 CZE_rally_against_germany_desc: "Los checoslovacos lucharon con valentía por su independencia, y ahora debemos hacer un llamamiento a todos los pueblos para que protejan esa independencia."
 CZE_integrate_sudeten_germans: "Incorporar los Sudetes"
 CZE_integrate_sudeten_germans_desc: "La división entre la población de los Sudetes no es buena. Debemos intentar comprender sus preocupaciones y trabajar para resolverlas. Solo así podremos desarmar a los líderes independentistas, ya que sus denuncias de maltrato serían difíciles de creer."
 CZE_cooperate_with_the_sdp: "Cooperar con el Partido Alemán de los Sudetes"
 CZE_cooperate_with_the_sdp_desc: "Aunque actualmente es una fuerza desestabilizadora, el Partido Alemán de los Sudetes podría alinearse si se lo anima adecuadamente, por ejemplo, incluyéndolo en la coalición gobernante."
 CZE_revive_the_december_bloc: "Reavivar el bloque fascista"
 CZE_revive_the_december_bloc_desc: "El bloque de partidos fascistas, minoritarios y de derecha que se opuso en diciembre a la presidencia de Edvard Beneš debería restablecerse para ofrecer una alternativa al actual gobierno."
 CZE_revert_1926_anti_military_laws: "Derogar las leyes antimilitares de 1927"
 CZE_revert_1926_anti_military_laws_desc: "Tras el intento de golpe de Estado de $CZE_radola_gajda$, el ejército y la gendarmería perdieron su derecho al voto, así como otros privilegios. Dada la posición crucial del ejército en estos tiempos difíciles, es justo que eliminemos estas restricciones y deshagamos la división entre el ejército y la política."
 CZE_bop_to_fascism_support_tt: "Añade un tercio del valor de §Y$CZE_bop_army_readiness$§! para apoyar el fascismo:"
 CZE_power_to_the_military: "Poder para los militares"
 CZE_power_to_the_military_desc: "Es evidente que no se pueden escatimar recursos en la defensa de la nación, por lo que es fundamental que quienes ostentan el poder comprendan las necesidades del ejército, y no hay mejor manera de lograrlo que con un gobierno militar."
 CZE_militarize_the_associations: "Militarizar las asociaciones"
 CZE_militarize_the_associations_desc: "Las numerosas asociaciones de [CZE.GetNameDef] podrían contribuir a la defensa de la nación enseñando habilidades esenciales para un soldado, incluso antes de que se movilice la población."
 CZE_aggressive_foreign_policy: "Política exterior agresiva"
 CZE_aggressive_foreign_policy_desc: "Se acabó el momento de confiar en pactos frágiles; debemos actuar con determinación para salvaguardar nuestra seguridad, aunque ello implique sacrificios importantes."
 CZE_work_with_germany: "Trabajar con [GER.GetNameDef]"
 CZE_work_with_germany_desc: "Una vez resuelta la cuestión de los Sudetes, tal vez [GER.GetNameDef] podría ahora reconocer la valía de [ROOT.GetNameDef] como aliado."
 CZE_control_the_associations: "Controlar las asociaciones"
 CZE_control_the_associations_desc: "[CZE.GetNonIdeologyName] cuenta con numerosas organizaciones, desde personas que comparten el mismo trabajo hasta asociaciones deportivas o de ocio. Si controlamos estas organizaciones, controlaremos gran parte de la sociedad."
 CZE_diversify_bata: "Diversificar Bat'a"
 CZE_diversify_bata_desc: "Bat'a es una gran empresa de consumo que podríamos aprovechar para nuestra cadena de suministro de recursos. Nos pueden ayudar proporcionándonos materiales esenciales que de otro modo nos resultaría difícil conseguir."
 CZE_devaluate_the_koruna: "Devaluar la corona checa"
 CZE_devaluate_the_koruna_desc: "Tener una moneda fuerte es una posición económica peligrosa para un país que depende de las exportaciones en una buena parte de su economía. Debilitar nuestra moneda puede suponer un sacrificio a corto plazo, pero en el futuro saldremos ganando."
 CZE_continue_the_central_bohemia_plan: "El plan de Bohemia Central"
 CZE_continue_the_central_bohemia_plan_desc: "Continuar con nuestro plan de ampliar las zonas industriales del centro del país nos permitiría aprovechar la economía de escala. Además, desde el punto de vista de la seguridad nacional, es buena idea que la industria se desarrolle lejos de nuestras fronteras."
 CZE_balance_industrial_invevestments: "Compensar la inversión en desarrollo industrial"
 CZE_balance_industrial_invevestments_desc: "Una de las razones por las que nuestro país comenzó a dividirse al principio de la década fue el subdesarrollo de las zonas exteriores de [9.GetName] y [75.GetName]. Si desarrollamos las zonas del exterior del país, reduciremos las diferencias en desarrollo industrial."
 CZE_expand_prf_science_facilities: "Ampliar las instalaciones científicas de la PřF"
 CZE_expand_prf_science_facilities_desc: "Las instalaciones científicas de la PřF están llenas de mentes brillantes que aguardan la oportunidad de hacer algo más importante que su trabajo actual. Si ampliamos el departamento y las hacemos colaborar con el gobierno, empezaríamos a mejorar nuestra investigación."
 CZE_raise_more_industrial_funds: "Destinar más financiación a la industria"
 CZE_raise_more_industrial_funds_desc: "Desde los tiempos de Austria-Hungría hasta el presente, la industria ha sido el corazón de nuestra nación. Si le proporcionamos el presupuesto y la financiación esenciales, seguirá prosperando en esta Europa de conflictos."
 CZE_skoda_priority_focus_info_tt: "Algunos §Yenfoques nacionales§! requieren un enfoque £GFX_CZE_skoda_text_icon §YPrioridad de Škoda§! determinado para completarlos. Estos enfoques aparecen con un icono pequeño que determina su nivel de £GFX_CZE_skoda_text_icon §YPrioridad de Škoda§!."
 CZE_joint_stock_schemes: "Proyectos de sociedades anónimas"
 CZE_joint_stock_schemes_desc: "Las sociedades anónimas han sido procedencia de crecimiento económico cuando las fuentes de financiación tradicionales han flaqueado. Si seguimos empleando esta táctica, nuestra economía crecerá aún más."
 CZE_the_slovak_arrow: "La Flecha Eslovaca"
 CZE_the_slovak_arrow_desc: "El desarrollo de un tren rápido entre dos de nuestras mayores ciudades sería una fuente importante de orgullo nacional y una buena excusa para mejorar las infraestructuras ferroviarias."
 CZE_finish_double_tracking_efforts: "Implantación de la doble vía"
 CZE_finish_double_tracking_efforts_desc: "Si terminamos de instalar la doble vía en las líneas ferroviarias secundarias más importantes, podremos aumentar el tráfico en esas líneas y mejoraremos las conexiones entre nuestras ciudades secundarias."
 CZE_realize_motorway_proposals: "Hacer realidad las propuestas de autopista"
 CZE_realize_motorway_proposals_desc: "Han presentado al gobierno varias propuestas de autovía que mejorarían mucho las conexiones por carretera dentro de nuestras fronteras. Debemos poner en práctica estas propuestas y hacerlas realidad."
 CZE_build_additional_rail_stations: "Construir más estaciones ferroviarias"
 CZE_build_additional_rail_stations_desc: "Ahora que hemos desarrollado nuevas infraestructuras ferroviarias, algunas de las estaciones antiguas no pueden con el aumento de tráfico. Si las renovamos, podríamos trasladar más cantidad de personas y mercancías al lugar en el que son necesarias."
 CZE_build_additional_rail_stations_focus_cost_tt: "Adoptar §Y$CZE_devaluate_the_koruna$§! reducirá el tiempo que lleva este enfoque hasta §G35§! días."
 CZE_grow_ckd_secondary_facilities: "Instalaciones secundarias de CKD"
 CZE_grow_ckd_secondary_facilities_desc: "CKD tiene muchas plantas secundarias, más pequeñas, que fabrican productos industriales importantes, como generadores eléctricos. Ampliar estas plantas estimularía el crecimiento de nuestra industria pesada."
 CZE_bolster_domestic_construction: "Impulsar la construcción local"
 CZE_bolster_domestic_construction_desc: "El sector de la construcción no ha cesado de crecer desde que declaramos nuestra independencia al finalizar la Gran Guerra. Si damos dinero a algunas constructoras de mediano tamaño, el aumento de la inversión lo mejorará aún más."
 CZE_invest_in_vhht: "Invertir en VHHT"
 CZE_invest_in_vhht_desc: "VHHT es una empresa propietaria de diversas plantas metalúrgicas en todo el país. Al invertir en ellas y ampliarlas, mejoraríamos distintas áreas en todos los niveles de nuestra producción de metal."
 CZE_expand_vitkovice_ironworks: "Ampliar la metalúrgica Vítkovické"
 CZE_expand_vitkovice_ironworks_desc: "La metalúrgica Vítkovické es un proveedor de hierro importante en [74.GetName]. Si lo ampliamos, la producción de la planta aumentaría mucho."
 CZE_expand_central_bohemian_mines: "Ampliar las minas de Bohemia Central"
 CZE_expand_central_bohemian_mines_desc: "Las minas del centro de nuestro país son las más importantes para nuestra seguridad energética. Hemos de ampliarlas cuanto antes."
 CZE_increase_bauxite_imports: "Aumentar las importaciones de bauxita"
 CZE_increase_bauxite_imports_desc: "Puede que nuestro país no sea rico en aluminio, pero podemos emplear ciertos procesos de refinado y aumentar las importaciones de bauxita para producir aquí una pequeña cantidad de este metal y aliviar la escasez de recursos."
 CZE_merge_the_oil_companies: "Fusionar las compañías petroleras"
 CZE_merge_the_oil_companies_desc: "Nuestras petroleras apenas son dignas de ese nombre. Son pequeñas compañías construidas alrededor de un puñado de pozos. Si las fusionamos todas y las ponemos bajo el control del Estado, podemos sacar más partido al sector del petróleo."
 CZE_expand_trinec_ironworks: "Planta metalúrgica de Třinec"
 CZE_expand_trinec_ironworks_desc: "La acerera de Trinec ha sido un titán del sector en [72.GetName] desde su fundación. Aumentar la inversión nos daría enormes dividendos en forma de producción de recursos."
 CZE_consolidate_mining_operations: "Consolidar las operaciones mineras"
 CZE_consolidate_mining_operations_desc: "Nuestras operaciones mineras funcionarían mejor si se combinara la administración de todas las compañías. De esta forma, sus prospecciones y sus esfuerzos para ampliar las minas serían más rentables."
 CZE_expand_praga: "Contratos de Praga"
 CZE_expand_praga_desc: "Praga ha abastecido de distintos componentes a nuestra industria militar desde hace años. Es lógico que recompensemos a la ciudad con más contratos que le permitan crecer."
 CZE_shrink_educational_disparities: "Reducir la disparidad educativa"
 CZE_shrink_educational_disparities_desc: "Nuestras zonas rurales no cuentan con las mismas posibilidades de educación que las urbanas. Debemos combatir esta disparidad con amplios programas educativos dirigidos a estas zonas."
 CZE_kickstart_rapid_rearmanent: "Iniciar un rearme rápido"
 CZE_kickstart_rapid_rearmanent_desc: "Muchos políticos y empresarios pueden pensar que es una elección terrible, pero tenemos que iniciar ya el rearme. Los países que nos rodean no se están desarmando, sino todo lo contrario; es un secreto a voces. Debemos preparar a nuestro ejército ahora que estamos a tiempo."
 CZE_keep_focus_on_weapon_exports: "Mantener el enfoque en la exportación de armas"
 CZE_keep_focus_on_weapon_exports_desc: "Nuestras grandes empresas de exportación de armas son lo que nos sacó de la depresión económica. Invertir esa tendencia sería peligroso política y económicamente. En este momento, mantener el rumbo es el mejor curso de acción. Las amenazas contra nosotros son una exageración."
 CZE_force_the_industrialists_hand: "Presionar a los industrialistas"
 CZE_force_the_industrialists_hand_desc: "En la práctica, los industrialistas y las compañías han frenado nuestra capacidad de rearme durante demasiado tiempo. Es hora de que les hagamos optar por el bien de la nación."
 CZE_embrace_corporatism: "Adoptar el corporativismo"
 CZE_embrace_corporatism_desc: "Podríamos conseguir que los industrialistas nos ayuden a reiniciar el rearme si aceptamos algunos de sus términos. Algunos cambios de política que les beneficien son más que razonables y también nos interesan."
 CZE_expand_existing_armory_plants: "Ampliar las armerías existentes"
 CZE_expand_existing_armory_plants_desc: "Cambiar de lugar las armerías existentes sería una inversión costosa con poca ganancia a largo plazo. Podemos ampliar las instalaciones existentes para potenciar la producción, la investigación y el desarrollo en su lugar actual, aun corriendo el riesgo de que se encuentren en lugares más vulnerables a posibles ataques enemigos."
 CZE_expand_skoda_offices: "Ampliar las oficinas de Škoda"
 CZE_expand_skoda_offices_desc: "Nuestras oficinas internacionales son las que impulsan la venta de nuestras armas. Ampliarlas a nuevas ubicaciones es una decisión sensata."
 CZE_skoda_office_unlock_tt: "Desbloquea la decisión §YConstruir oficina de venta de armas§!."
 CZE_complete_the_power_grid: "Completar la red eléctrica"
 CZE_complete_the_power_grid_desc: "La red de eléctrica de las zonas rurales necesita más trabajo, ya que está por detrás del resto del país y es un obstáculo para lograr un progreso económico mayor."
 CZE_build_the_slapy_reservoir: "Construir el embalse de Slapy"
 CZE_build_the_slapy_reservoir_desc: "Construir una presa cerca de Slapy permitiría generar más energía y oportunidades económicas en la zona. El aumento de la generación de energía fomentará en gran medida el crecimiento de la industria en la región."
 CZE_diversify_refinery_processes: "Diversificar los procesos de las refinerías"
 CZE_diversify_refinery_processes_desc: "Nuestros pozos podrían producir subproductos del petróleo muy diversos. El único problema es que no sabemos cómo hacerlo. Si invertimos tiempo de investigación en averiguarlo, podremos hacer este sueño realidad."
 CZE_enlarge_smaller_wells: "Agrandar los pozos pequeños"
 CZE_enlarge_smaller_wells_desc: "A pesar de su tamaño, nuestros pozos más pequeños pueden producir mucho más petróleo del que producen actualmente. Lo único que hay que hacer es invertir tiempo para que lo hagan."
 CZE_develop_sudetenland_resources: "Desarrollar los recursos de los Sudetes"
 CZE_develop_sudetenland_resources_desc: "Los Sudetes cuentan con gran cantidad de yacimientos que no estamos aprovechando. Sería un error no invertir en la construcción de más minas en la zona."
 CZE_grow_tatras_capabilities: "Desarrollar la capacidad de Tatra"
 CZE_grow_tatras_capabilities_desc: "El departamento de tanques de Tatra, aunque pequeño, tiene diseños de producción novedosos. Darles más recursos les permitirá seguir haciendo avances en el diseño de blindados."
 CZE_bailout_moser: "Rescatar a Moser"
 CZE_bailout_moser_desc: "Moser atraviesa tiempos difíciles desde la Gran Depresión. Es necesario rescatar su industria, volver a abrir sus fábricas y poner a trabajar de nuevo a las personas que han despedido."
 CZE_merge_skodas_consumer_good_plants: "Fusionar las fábricas de productos de consumo de Škoda"
 CZE_merge_skodas_consumer_good_plants_desc: "Škoda tiene un montón de pequeñas fábricas de productos de consumo que no están centralizadas. Fusionarlas optimizaría su producción en muchas áreas. También podría tener efectos positivos para Škoda en general."
 CZE_giant_of_central_europe_industry: "Gigante de la industria"
 CZE_giant_of_central_europe_industry_desc: "Hemos alcanzado niveles que creíamos imposibles. ¡Ahora somos un titán de la industria europea!"
 CZE_continue_armed_force_reform: "Seguir reformando las fuerzas armadas"
 CZE_continue_armed_force_reform_desc: "Si seguimos modernizando nuestras fuerzas armadas de acuerdo con el calendario previsto y reasignamos las regiones militares a nuestro cuartel general provincial, tendremos mejor coordinación ante un posible conflicto."
 CZE_air_force_officer_recruitment: "Reclutamiento de oficiales para las fuerzas aéreas"
 CZE_air_force_officer_recruitment_desc: "Los aeroclubes de todos los Estados, en colaboración con la Escuela de Oficiales de Reserva de la Fuerza Aérea, satisfacen la necesidad crítica de oficiales de reserva con su oferta de cursos de vuelo y maniobras con fuego real."
 CZE_national_defense_act: "Ley de Defensa Nacional"
 CZE_national_defense_act_desc: "Esta ley de defensa abarca todas las medidas, militares o de otro tipo, destinadas a contrarrestar cualquier amenaza o ataque a la soberanía, integridad, unidad y seguridad de nuestra nación, bajo la supervisión del Consejo Supremo de Defensa Nacional (NROS)."
 CZE_car_and_oil_rationing: "Racionamiento de automóviles y combustible"
 CZE_car_and_oil_rationing_desc: "Racionar los vehículos de motor privados y requisar los que necesitemos nos permitiría centrar la producción de vehículos y los recursos petrolíferos en las necesidades militares."
 CZE_expand_airfield_capacity: "Ampliar la capacidad de los aeródromos"
 CZE_expand_airfield_capacity_desc: "El Tercer Departamento de Aviación ha planeado nuevos aeródromos y hangares para operar, almacenar y reparar los aviones, además de residencias para las nuevas escuadrillas y la tripulación de tierra."
 CZE_trust_in_old_guard: "Confiar en la vieja guardia"
 CZE_trust_in_old_guard_desc: "Los veteranos, en quienes depositamos nuestra firme confianza, transmitirán las habilidades aéreas y la experiencia de la Gran Guerra a la nueva generación."
 CZE_expand_the_aero_clubs: "Ampliar los aeroclubes"
 CZE_expand_the_aero_clubs_desc: "Los aeroclubes han demostrado su utilidad para proporcionar al país un flujo constante de pilotos bien preparados; debemos ampliarlos aún más."
 CZE_invest_in_the_smaller_air_plants: "Invertir en plantas aeronáuticas pequeñas"
 CZE_invest_in_the_smaller_air_plants_desc: "Podemos invertir en fábricas aeronáuticas nuevas y más pequeñas para aumentar la competencia entre las ya establecidas. Eso nos ayudaría a manejar requisitos de producción más amplios."
 CZE_continue_avia_expansion: "Continuar con la expansión de Avia"
 CZE_continue_avia_expansion_desc: "Invertir en Avia les proporcionará la maquinaria necesaria para reforzar su capacidad de producción, lo que aumentaría su eficacia para producir estructuras con alta demanda."
 CZE_increase_military_aeronautical_institute_funding: "Aumentar el gasto militar en aeronáutica"
 CZE_increase_military_aeronautical_institute_funding_desc: "Si construimos más instalaciones para el Instituto de Investigación y Pruebas Aeroespaciales (VZLÚ), obtendremos mejores conocimientos sobre la aerodinámica para refinar aún más el diseño de nuestras aeronaves."
 CZE_air_training_abroad: "Entrenamiento aéreo en el extranjero"
 CZE_air_training_abroad_desc: "Podemos enviar aprendices a las fuerzas aéreas de naciones amigas para que adquieran información valiosa desde perspectivas diversas y experiencia de primera mano, y nos la ofrezcan a su regreso."
 CZE_establish_air_defense_zones: "Establecer zonas de defensa aérea"
 CZE_establish_air_defense_zones_desc: "Podríamos asignar las nuevas baterías antiaéreas a puntos y fábricas clave, y establecer zonas de defensa aérea por medio de nodos de comunicación territoriales para optimizar nuestra precisión antiaérea."
 CZE_establish_air_defense_zones_enable_tt: "Permite las §Yzonas de defensa aérea§!"
 CZE_establish_air_defense_zones_tt: "Factor de probabilidad de impacto antiaéreo estático: §G+10%§!"
 CZE_the_air_is_our_sea: "El aire es nuestro mar"
 CZE_the_air_is_our_sea_desc: "Tras la formación sistemática de pilotos, debe estar nuestro lema, que hará a los pilotos volar con confianza y valor: \"No tenemos puertos marinos ni barcos marinos. El aire es nuestro mar\"."
 CZE_bring_kramer_and_lobel_under_state_control: "Poner a Kramer & Löbl bajo el control del Estado"
 CZE_bring_kramer_and_lobel_under_state_control_desc: "Nacionalicemos Kramer & Löbl para asegurar la continuidad de la investigación y la entrega oportuna de productos eléctricos y accesorios de radio esenciales."
 CZE_second_to_none: "Nada que envidiar"
 CZE_second_to_none_desc: "Los diseños de aviones de nuestra industria aeronáutica mejoran día a día. Con más investigación, ¡nuestros diseños no tendrán nada que envidiar en el resto del mundo!"
 CZE_diversify_airframe_production: "Diversificar la producción de estructuras"
 CZE_diversify_airframe_production_desc: "No podemos limitarnos a confiar en nuestros cazas para pelear en el aire. Hacen falta otros aviones y naves más grandes para cumplir otros tipos de misiones."
 CZE_projekt_l_52: "Projekt L 52"
 CZE_projekt_l_52_desc: "La tecnología del motor a reacción es el futuro de la aviación militar. Está un poco verde en la actualidad, pero si dedicamos el tiempo necesario a desarrollar un proyecto al respecto y diseñar una estructura adaptada a esta tecnología, podemos seguir en cabeza."
 CZE_fund_vladimir_mandl_research: "Financiar la investigación de Vladimir Mandl"
 CZE_fund_vladimir_mandl_research_desc: "Un abogado llamado $CZE_vladimir_mandl$ está fascinado con la tecnología de cohetes. Si colaboramos con él y le damos los recursos que necesita para convertir su investigación en tecnología utilizable, podríamos beneficiarnos mucho."
 CZE_mobilize_the_reserves: "Movilizar a la reserva"
 CZE_mobilize_the_reserves_desc: "La tensión en nuestra frontera está empeorando. Debemos llamar a reservistas y especialistas militares preseleccionados de acuerdo con los planes de movilización."
 CZE_three_kings: "Los Tres Reyes"
 CZE_three_kings_desc: "Ayudar a nuestros grupos de resistencia de forma oficial aumentará enormemente su capacidad para atacar al ejército. También puede ayudar a nuestro ejército en la batalla."
 CZE_form_the_state_defense_guard: "Fundar la Guardia Defensora del Estado"
 CZE_form_the_state_defense_guard_desc: "Si fundamos la Guardia Defensora del Estado, tendremos un organismo especializado en proteger nuestras largas fronteras. Los miembros de esta guardia, organizados y entrenados militarmente, servirán como primera línea de defensa ante cualquier incursión fronteriza."
 CZE_expand_the_horska_divisions: "Ampliar la división Horská"
 CZE_expand_the_horska_divisions_desc: "Como nuestro país está formado, sobre todo, por colinas bajas y mesetas, los soldados especialmente entrenados para la guerra de montaña serán cruciales en esos terrenos difíciles."
 CZE_develop_horska_artillery: "Desarrollar la Horské Dělostřelectvo"
 CZE_develop_horska_artillery_desc: "Al modificar nuestra artillería actual para que sea ligera y desmontable, nos aseguraremos de que nuestras tropas tengan suficiente poder de fuego en terrenos montañosos y colinas."
 CZE_develop_horska_artillery_tech_tt: "Permite §YArtillería Horská§!\n§YArtillería (montañas)§!\n  Ataque: §G+10%§!\n  Movimiento: §G+10%§!\n§YArtillería (colinas)§!\n  Ataque: §G+10%§!\n  Movimiento: §G+10%§!"
 CZE_bribery_investigations: "Investigación de sobornos"
 CZE_bribery_investigations_desc: "Hemos recibido una carta anónima sobre la comida y el trato de los soldados. Algunas de las pruebas apuntan a la conducta impropia de varios oficiales de intendencia. Debemos poner fin a esto antes de que perjudique más al ejército."
 CZE_bribery_investigations_remove_effect_tt: "Este espíritu nacional desaparecerá cuando se complete el enfoque \"§Y$CZE_bribery_investigations$§!\"."
 CZE_opl_exercises: "Operaciones antiaéreas"
 CZE_opl_exercises_desc: "Al realizar simulacros de defensa antiaérea (OPL), nuestro ejército podría practicar maniobras con más coordinación y menos bajas, mejorando así los movimientos generales de tropas y su seguridad."
 CZE_rapid_response_divisions: "División rápida"
 CZE_rapid_response_divisions_desc: "Los ejércitos extranjeros han demostrado la utilidad de una unidad móvil capaz de reposicionarse con más rapidez que el enemigo. Podríamos crear unidades similares para evaluarlas."
 CZE_redouble_tank_development_efforts: "Redoblar los esfuerzos de desarrollo de tanques"
 CZE_redouble_tank_development_efforts_desc: "El diseño actual de nuestros tanques ligeros es mejorable en comparación con los de otros blindados de Europa. Debemos redoblar los esfuerzos para asegurarnos de estar a la altura."
 CZE_rearmed_and_retooled: "Rearmado y reacondicionado"
 CZE_rearmed_and_retooled_desc: "Nuestro chasis de tanque más pesado podría modernizarse. Debemos continuar explorando en esta dirección para preparar la ampliación de nuestro cuerpo blindado."
 CZE_establish_the_fall_backlines: "Establecer las líneas de retirada"
 CZE_establish_the_fall_backlines_desc: "Tenemos que ser realistas y admitir que nuestras defensas fallarán en algunos puntos. Si eso sucede, contar con líneas de retirada supondrá la diferencia entre la victoria y la derrota."
 CZE_establish_the_fall_backlines_masterful_delay_tactic_tt: "\nPermite la táctica: §Y$tactic_masterful_delay$§!."
 CZE_anti_tank_development: "Desarrollo de armas antitanque"
 CZE_anti_tank_development_desc: "Cada vez más ejércitos despliegan fuerzas blindadas y estas son más grandes; es imprescindible mejorar nuestros cañones antitanque. Poder combatir tanques con armas de campo marcará la diferencia entre rechazar al enemigo o dejarlo pasar."
 CZE_anti_tank_development_tech_tt: "Permite §Ymejoras antitanque§!\nPerforación de §Yartillería§!: §G+5%§!\nPerforación de §Yartillería de apoyo§!: §G+5%§!\nPerforación de §Yantitanque§!: §G+5%§!\nPerforación de §Yantitanque de apoyo§!: §G+5%§!"
 CZE_recon_in_force: "Reconocimiento vigente"
 CZE_recon_in_force_tech_tt: "Permite §YReconocimiento vigente§! \n§YReconocimiento§!: PS: §G+5§!\nReconocimiento: §G+10,0%§!."
 CZE_recon_in_force_desc: "Un reconocimiento que haga contacto con el enemigo mientras pone a prueba sus defensas es una forma valiosísima de obtener información."
 CZE_integrate_fortification_engineers: "Integrar a ingenieros de fortificaciones"
 CZE_integrate_fortification_engineers_desc: "Cuando los ingenieros de fortificaciones del ejército no se dediquen a construir fortificaciones estáticas, podemos pasarlos rápidamente a tareas del frente para mejorar las defensas. Así ayudarían a las fuerzas de primera línea a crear mejores estructuras de defensa temporales para las tropas."
 CZE_integrate_fortification_engineers_tech_tt: "Permite §YIngenieros de fortificación integrados§!\n§YCompañía de ingeniería§!:\nAtrincheramiento §G+10,00%§!.\n§Y(Fortificación)§!\n Defensa §G+10,0%§!"
 CZE_concealment_efforts: "Medidas de ocultación"
 CZE_concealment_efforts_desc: "El uso generalizado de aviones de ataque terrestre y de reconocimiento ha hecho que el camuflaje y otras tácticas de ocultación sean una necesidad. Necesitamos reforzar nuestras medidas para que las tropas estén bien camufladas en el campo."
 CZE_concealment_efforts_tech_tt: "Permite §YCamuflaje mejorado§! \n§YInfantería a pie (bosque)§!\n Defensa: §G+10%§!"
 CZE_elevate_the_vsv: "Priorizar la Academia de Guerra"
 CZE_elevate_the_vsv_desc: "Ser el cerebro de los militares es una enorme responsabilidad nacional y estatal. El servicio del Estado Mayor requiere oficiales con las mejores cualidades en cuanto a formación profesional, fiabilidad, autocontrol, tacto y carácter."
 CZE_continue_with_snejdareks_plan_dynamic: "[CZE_continue_with_snejdareks_plan]"
 CZE_continue_with_snejdareks_plan_default: "Continuar con el plan de Šnejdárek"
 CZE_continue_with_snejdareks_plan_no_snejdareks: "Continuar con el plan de defensa estática"
 CZE_continue_with_snejdareks_plan_dynamic_desc: "Una red de defensa eficaz evita incursiones inesperadas de las tropas enemigas. Proporciona protección y crea una base sólida para pasar de la defensa estratégica a la ofensiva."
 CZE_go_with_vojcechovskys_plan_dynamic: "[CZE_go_with_vojcechovskys_plan]"
 CZE_go_with_vojcechovskys_plan_default: "Cambiar al plan de Luža"
 CZE_go_with_vojcechovskys_plan_no_luza: "Doctrina de defensa activa"
 CZE_go_with_vojcechovskys_plan_dynamic_desc: "La desventaja de las defensas estáticas es que no se puede maniobrar con ellas. Una vez traspasadas, no se pueden utilizar con fines ofensivos y solo quedan sus restos en la ubicación inicial."
 CZE_improve_the_current_officer_pool: "Mejorar el grupo de oficiales"
 CZE_improve_the_current_officer_pool_desc: "Ascenderemos a quienes hayan demostrado su capacidad para que se conviertan en la columna vertebral del ejército, ya que son esenciales para desempeñar funciones de supervisión y coordinación entre los mandos superiores y las unidades locales."
 CZE_elevate_slovak_officers: "Priorizar a oficiales eslovacos"
 CZE_elevate_slovak_officers_desc: "Nos centraremos en priorizar a los eslovacos para mejorar su representación en el ejército. Al reducir algunos requisitos para los solicitantes de los distritos eslovacos, esperamos que aumente la cohesión del ejército en el futuro."
 CZE_promote_moravec_writings: "Promocionar las publicaciones de Moravec"
 CZE_promote_moravec_writings_desc: "Aunque las obras de Moravec \"Soldados y tiempo\" y \"Defensa nacional\" provocan reacciones contradictorias, su reciente libro \"Importancia Militar de nuestro Estado en Centroeuropa\" se ha mencionado en los diarios de toda Europa. Debemos animarlo a continuar su trabajo como experto inequívoco en temas de política de defensa e historia militar."
 CZE_lessons_of_war: "Lecciones de guerra"
 CZE_lessons_of_war_desc: "Ahora que tenemos experiencia de combate con nuestros iguales, podemos utilizar estas lecciones para mejorar nuestro alto mando. No hay mejor lección que la aprendida en combate real con el ejército."
 CZE_lessons_of_war_i_had_war_with_major_flag: "Estuvo en guerra con una gran potencia"
 CZE_for_the_homeland: "Por la patria"
 CZE_for_the_homeland_desc: "Con nuestras fuerzas armadas totalmente preparadas para el desafío que nos espera, ya podemos afirmar con certeza que estamos listos para defender nuestra patria. Podremos desempeñar cualquier tarea que se nos presente."
 CZE_the_lions_roar: "El rugido del león"
 CZE_the_lions_roar_desc: "El símbolo del león checoslovaco representa las mejores cualidades de nuestro ejército: valentía, poder y heroísmo en su máxima expresión. Todos conocerán el inigualable espíritu de nuestras fuerzas armadas."
 CZE_diversify_our_specialists: "Diversificar a nuestros especialistas"
 CZE_diversify_our_specialists_desc: "Tenemos que diversificarnos con más especialistas, aparte de la división Horská. La guerra se libra en más lugares que no son montañas y colinas."
 CZE_merge_the_financial_and_state_guard: "Fusionar la guardia financiera y la guardia del Estado"
 CZE_merge_the_financial_and_state_guard_desc: "Con la creación de la Guardia Defensora del Estado, ya no se necesitan las guardias financieras. Fusionarlas con la Guardia Defensora del Estado ayudaría a aumentar rápidamente el número de SOS."
 CZE_merge_the_financial_and_state_guard_tt: "Permite §YGuardia Financiera Integrada§! \n§YPolicía militar§!: PS: §G+5§!."
 CZE_logistics_beyond_the_sudetes: "Logística más allá de los Sudetes"
 CZE_logistics_beyond_the_sudetes_desc: "Si pretendemos llevar a cabo operaciones de combate más allá de los Sudetes, tenemos que aprender cómo funciona la logística a larga distancia. Es muy diferente de a lo que estamos acostumbrados en nuestra zona."
 CZE_logistics_beyond_the_sudetes_tt: "Permite §Yalmacenes de suministros mejorados§!\n§YCompañía de logística§!: Uso de suministros: §G-10 %§!"
 CZE_expand_the_river_monitor_fleet: "Ampliar la flota de monitores fluviales"
 CZE_expand_the_river_monitor_fleet_desc: "Nuestra flota de monitores fluviales es una de las más grandes de Europa y ayuda a nuestro ejército con la defensa de las zonas interiores. Ampliarla aumentaría considerablemente su capacidad para llevar a cabo esta tarea."
 CZE_the_tvp_project: "El proyecto TVP"
 CZE_the_tvp_project_desc: "Nuestro ejército ha propuesto un programa de tanques de uso general (TVP) para desarrollar un diseño nacional de tanque. Algunos de nuestros fabricantes que cuentan con una amplia experiencia en la producción de tanques han mostrado interés en el proyecto."
 CZE_expand_the_land_department_of_vtu: "Ampliar el Departamento Terrestre de VTÚ"
 CZE_expand_the_land_department_of_vtu_desc: "Ampliando el Departamento Terrestre del Instituto Técnico Militar (VTÚ), se obtendrían más materiales y campos de pruebas para reforzar los esfuerzos de investigación destinados a nuestro equipamiento futuro."
 CZE_department_two_expansion: "Departamento Dos"
 CZE_department_two_expansion_desc: "Nuestra división de inteligencia, el Departamento Dos, necesita más recursos para poder proteger mejor a la agencia de los espías enemigos. Esto también podría conducir a la ampliación de divisiones específicas dentro de la agencia."
 CZE_military_intelligence: "División de inteligencia militar"
 CZE_military_intelligence_desc: "La inteligencia militar es una de las partes más importantes de una agencia de inteligencia. Dedicar más recursos a esta área nos reportaría beneficios."
 CZE_air_intelligence: "División de inteligencia aérea"
 CZE_air_intelligence_desc: "Saber el número de aviones que conforman una fuerza aérea enemiga es un elemento fundamental para ganar la guerra del aire. Disponer de información adecuada sobre las fuerzas aéreas del enemigo es clave cuando entramos en combate con ellas en la zona."
 CZE_within_the_eagles_nest: "Dentro del Nido de las Águilas"
 CZE_within_the_eagles_nest_desc: "Disponer de un ejército de informadores y saboteadores justo a las puertas de nuestra casa sería una gran ventaja para nuestro ejército. Con la ayuda del Departamento Dos, nuestras redes de espionaje en estos lugares podrían crecer hasta alcanzar un tamaño enorme."
 CZE_restart_naval_gun_production: "Reanudar la producción de artillería naval"
 CZE_restart_naval_gun_production_desc: "Škoda fue el mayor diseñador y fabricante de artillería naval del Imperio austrohúngaro. Reiniciar la producción crearía oportunidades para reanudar la producción naval nacional."
 CZE_restart_naval_gun_production_tt: "El enfoque naval §YPrioridad de Škoda§! pasa a estar §Yactivo§!"
 CZE_reform_the_naval_detachment: "Reformar el Destacamento Naval"
 CZE_reform_the_naval_detachment_desc: "El Destacamento Naval se disolvió recientemente en vista de que era más adecuado integrarlo en el ejército. Los acontecimientos recientes han hecho que ahora sea necesario recuperarlo."
 CZE_build_2_dockyards_when_we_have_coast_tt: "Construirá al instante §G2§! §Yastilleros navales§! en un §YEstado§! costero aleatorio cuando se controla uno."
 CZE_skoda_naval_yards: "Astilleros navales de Škoda"
 CZE_skoda_naval_yards_desc: "Ahora que volvemos a tener acceso directo al mar, podemos reactivar las antiguas industrias navales del Imperio austrohúngaro gracias a la experiencia que aún conservamos dentro de nuestras fronteras. Poner en marcha los astilleros del país debería ser una prioridad absoluta."
 CZE_build_3_dockyards_when_we_have_coast_tt: "Construirá al instante §G3§! §Yastilleros navales§! en un §YEstado§! costero aleatorio cuando se controla uno."
 CZE_legacy_of_the_kriegsmarine: "El legado de la Kriegsmarine"
 CZE_legacy_of_the_kriegsmarine_desc: "Al haber colaborado en la construcción de grandes acorazados no hace tanto tiempo, es muy factible que aún tengamos la capacidad de llevarlo a cabo. Se trata de la herencia de las mismas fábricas que ayudaron a construir la Kriegsmarine austrohúngara."
 CZE_build_off_old_ganz_danubius_designs: "Basado en los antiguos diseños de Ganz Danubius"
 CZE_build_off_old_ganz_danubius_designs_desc: "Los diseños reimaginados de Ganz Danubius podrían resultar útiles para construir nuevos barcos de clase crucero. Todavía hay personas que poseen conocimientos sobre estos diseños viviendo dentro de nuestras fronteras."
 CZE_modernize_trieste_designs: "Modernizar los diseños de Trieste"
 CZE_modernize_trieste_designs_desc: "Al usar diseños antiguos de la armada austrohúngara para acorazados de menor tamaño, obtendremos una mejor comprensión sobre cómo construir este tipo de buques."
 CZE_leverage_gunboat_experience: "Aprovechar la experiencia con cañoneros"
 CZE_leverage_gunboat_experience_desc: "Podemos aprovechar nuestra experiencia en el diseño de cañoneros para la fabricación de destructores. Nuestra base técnica actual contribuiría a acelerar el proceso de diseño."
 CZE_revive_kraljevica_designs: "Revivir los diseños de los Kraljevica"
 CZE_revive_kraljevica_designs_desc: "Gracias a nuestros conocimientos sobre cañoneros y al estudio de antiguos diseños de los Kraljevica, podemos revivir esta clase de destructores para nuestra nación."
 CZE_wolfs_of_bohemia: "Lobos de Bohemia"
 CZE_wolfs_of_bohemia_desc: "Dada la experiencia con submarinos que aún pervive dentro de nuestras fronteras, no sería demasiado difícil crear nuestras propias manadas de lobos submarinos."
 CZE_raider_lineage: "Herencia de incursiones"
 CZE_raider_lineage_desc: "Debemos aprovechar la experiencia que nos brinda el largo historial de incursiones de nuestros oficiales que pertenecieron a la armada austrohúngara."
 CZE_a_modern_navy: "Armada moderna"
 CZE_a_modern_navy_desc: "Ahora que hemos desarrollado nuestras tecnologías navales, por fin podemos decir que contamos con una armada moderna y capaz."
 CZE_build_1_dockyards_when_we_have_coast_tt: "Construirá al instante §G1§! §Yastillero naval§! en un §YEstado§! costero aleatorio cuando se controla uno."
 CZE_naval_aviation: "Aviación naval"
 CZE_naval_aviation_desc: "Los portaaviones y sus aviones aparentan ser el futuro de la guerra naval. Debemos invertir tiempo en estas nuevas áreas del combate naval."
 CZE_across_the_atlantic: "A través del Atlántico"
 CZE_across_the_atlantic_desc: "Una armada necesita desplegarse por todo el océano para ser eficaz. Necesitamos que nuestra armada sea capaz de desplazarse a través de largas distancias."
 CZE_joint_equipment_designs: "Diseños de equipo conjunto"
 CZE_joint_equipment_designs_desc: "Tanto [ROOT.GetNameDef] como [GER.GetNameDef] están en la vanguardia del diseño de tanques y aviones con sus propias especialidades. Deberíamos tratar de compartir información para seguir centrándonos en lo que hacemos mejor."
 CZE_negotiate_sphere_of_influence: "Negociar la esfera de influencia"
 CZE_negotiate_sphere_of_influence_desc: "Es innegable que los recursos militares de [ROOT.GetNameDef] son de gran valor para la alianza [GER.GetAdjective]. Lo más justo es que pidamos algún territorio a cambio."
 CZE_set_up_polish_puppet_state: "Fundar el estado títere [POL.GetAdjective] meridional"
 CZE_set_up_polish_puppet_state_desc: "En vista de que [GER.GetNameDef] tiene interés en fundar un estado títere en Polonia, es evidente que nosotros tenemos que hacer lo mismo."
 CZE_usurp_the_mantle: "Usurpar el mando"
 CZE_usurp_the_mantle_desc: "Con nuestro reino extendiéndose del mar Báltico al Adriático y gobernando las tierras de la histórica potencia regional de Austria, ahora podemos proclamarnos los legítimos sucesores del Sacro Imperio Romano."
 CZE_austro_hungary_puppets: "Todo §Ysúbdito§! objetivo del requisito del enfoque"
 CZE_decrease_autonomy_tier: "Todo súbdito de §Y$autonomy_dominion$§! o §Y$autonomy_puppet$§! perderá un nivel de autonomía."
 #Exile Focus
 CZE_prepare_for_exile: "Prepararse para el exilio"
 CZE_prepare_for_exile_desc: "El Estado debería ayudar en secreto a nuestros líderes políticos en su empeño de huir al extranjero y establecer un gobierno en el exilio."
 CZE_joins_government_in_exile_tt: "Se une al §Ygobierno en el exilio§!"
 CZE_infiltrate_collaborationist_organizations: "Infiltrar colaboracionistas"
 CZE_administrative_chaos_tt: "Efecto §Ypara el Reichskommissariat§! cuando §Y$CZE_enter_exile$§! se ha completado:"
 CZE_infiltrate_collaborationist_organizations_desc: "Puede parecer extraño que haya individuos [ROOT.GetAdjective] leales al gobierno en el exilio que se están instalando para liderar organizaciones colaboracionistas, pero es la mejor forma de minarlas y estar al tanto de sus actividades."
 CZE_enter_exile: "Ir al exilio"
 CZE_enter_exile_desc: "Con nuestros potenciales aliados luchando por fin contra el caimán [GER.GetAdjective], nuestro gobierno puede prepararse y luchar por la vuelta de nuestra soberanía."
 CZE_refused_exile: "Rechazó acoger a [ROOT.GetName]"
 CZE_contact_the_czech_and_slovak_legion: "Contactar con las legiones checa y eslovaca"
 CZE_contact_the_czech_and_slovak_legion_desc: "Muchos valientes [ROOT.GetAdjective] han huido a [POL.GetNameDef] y [FRA.GetNameDef] para continuar luchando por una [CZE.GetName] libre. Deberíamos contactar con estas fuerzas y coordinarlas."
 CZE_skoda_priority_shortcut_finder: "Prioridad de Škoda"
 CZE_skoda_priority_shortcut_finder_desc: "Esta es la prioridad actual de Škoda"
