 #Germany
 GER_integrate_czech_manufacturers: "Integrar a los fabricantes checos"
 GER_integrate_czech_manufacturers_desc: "La industria que contiene Bohemia es una mina de oro en cuanto a experiencia en fabricación y recursos industriales para nuestra economía. La potencia industrial adicional que aportan los fabricantes de Bohemia supondría un enorme impulso para nuestra industria armamentística. Es perfectamente razonable integrarlos en nuestras líneas de producción."
 GER_integrate_czech_manufacturers_no_aat_tt: "§GDisponible§! como §Ycompañías de diseño§!:\n§Y$CZE_skoda_works_german_organization$§!, §Y$CZE_bohmische_mahrische_maschinenfabrik_ag_german_organization$§!, §Y$CZE_zlin_aircraft_organization$§! y §Y$CZE_ceska_zbrojovka_uhersky_brod_organization$§!"
