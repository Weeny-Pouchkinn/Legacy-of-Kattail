 idea_SIA_land_war_in_asia: "Guerra terrestre en Asia"
 # Alternative Communist Focus
 SIA_the_peoples_war_in_asia: "La guerra popular de Asia"
 SIA_the_peoples_war_in_asia_desc: "La lucha contra el imperialismo [JAP.GetAdjective] no es un mero conflicto entre estados, sino una guerra de obreros, campesinos y soldados contra el dominio extranjero. Si nos aliamos con las fuerzas comunistas de China, [ROOT.GetNameDef] se comprometerá a participar en una guerra popular por toda Asia."
 SIA_peoples_war_in_asia_idea: "Guerra popular de Asia"
 SIA_peoples_war_in_asia_idea_desc: "En la guerra no solo luchan las formaciones habituales. Los comités locales, los guías partisanos y las redes de abastecimiento campesinas prestan ayuda al ejército en el campo de batalla. Las poblaciones se convierten en almacenes, los caminos, en zonas de emboscadas, y las retiradas, en oportunidades para atraer al enemigo hacia el interior."
 # Alternative Nationalist Focus
 SIA_national_defense_in_asia: "Defensa nacional en Asia"
 SIA_national_defense_in_asia_desc: "La defensa de Asia requiere disciplina, jerarquía y un objetivo estratégico común. Si nos posicionamos del lado del gobierno nacionalista chino, [ROOT.GetNameDef] se unirá a una coalición decidida a resistir la expansión [JAP.GetAdjective] mediante el uso de ejércitos organizados y un mando coordinado."
 SIA_national_defense_in_asia_tt: "§Y[ROOT.GetNameWithFlag]§! se alía con las fuerzas nacionalistas del Frente Unido.\nAñade §Y$SIA_national_defense_in_asia_idea$§!, que otorga:\n$MODIFIER_ARMY_ORG_FACTOR$: §G+5%§!\n$MODIFIER_PLANNING_SPEED$: §G+10%§!\n$MODIFIER_MAX_PLANNING$: §G+10%§!\n$MODIFIERS_ARMY_DEFENCE_FACTOR$: §G+5%§!"
 SIA_stronger_together: "La unión hace la fuerza"
 SIA_stronger_together_desc: "La guerra ha reducido las promesas futuras y las alianzas paralelas a poco más que obstáculos. Si [ROOT.GetNameDef] decide qué rumbo tomará Asia, hemos de pedirles a nuestros aliados que unan su facción a la nuestra y acepten actuar bajo un mismo mando en el conflicto que nos aguarda."
 idea_SIA_national_defense_in_asia: "Defensa nacional en Asia"
 SIA_directorate_of_aeronautical_engineering_desc: "El futuro de la fuerza aérea de [ROOT.GetNameDef] no depende solo de los pilotos. Necesitamos ingenieros, inspectores, talleres y una autoridad central capaz de convertir las adquisiciones extranjeras en aviones funcionales. La Directiva de Ingeniería Aeronáutica debe convertirse en la base de este objetivo."
 idea_SIA_aeronautical_engineering_directorate: "Directiva de Ingeniería Aeronáutica"
 SIA_standardize_aircraft_maintenance: "Estandarizar el mantenimiento de aviones"
 SIA_standardize_aircraft_maintenance_desc: "Como nuestros aviones provienen de diferentes orígenes, cada uno tiene unas piezas, herramientas y métodos de reparación concretos. Si estandarizamos los procedimientos de mantenimiento para que estén en manos de la Directiva, [ROOT.GetNameDef] podrá disponer de un mayor número operativo en el aire y reducir los residuos consecuencia de la confusión en tierra."
 SIA_expand_aircraft_workshops: "Ampliación de talleres de aviones"
 SIA_expand_aircraft_workshops_desc: "La Directiva necesita más que despachos y papeles de inspección. La implantación de nuevos talleres, maquinaria y mecánicos experimentados nos permitirá reparar los aviones en nuestro territorio y fabricar componentes sencillos sin necesidad de depender de las importaciones extranjeras."
 SIA_license_modern_airframes: "Autorizar estructuras modernas"
 SIA_license_modern_airframes_desc: "[ROOT.GetNameDefCap] todavía no está en condiciones de diseñar todos los aviones que necesita. Lo más práctico es autorizar los modelos extranjeros, analizar su construcción y adaptarlos a nuestro clima, aeródromos y condiciones de suministros bajo la supervisión de la Directiva."
 SIA_tropical_air_operations: "Operaciones aéreas tropicales"
 SIA_tropical_air_operations_desc: "El calor, la humedad, las lluvias monzónicas y los terrenos accidentados dificultan las labores de los aviones y de las tripulaciones. Si adaptamos los motores, calendarios de mantenimiento y doctrina aérea a estas condiciones, nuestra fuerza aérea será más fiable sobre los cielos del Sudeste Asiático."
 ##########
 #### AUSTRALIA ####
 ###################
 effects_of_event_tt: "\n§YEfectos del evento§!:"
 AST_war_is_coming: "La guerra se acerca"
 AST_war_is_coming_desc: "En los últimos treinta años, nos hemos enfrentado a un desafío tras otro y, sin embargo, parece que aún nos aguarda uno más, que pondrá a prueba la fortaleza de la democracia australiana de una vez por todas. El ex primer ministro Billy Hughes ha hablado con claridad al respecto, y sería irresponsable por nuestra parte hacer caso omiso de sus proclamas acerca del advenimiento de una guerra, nos guste o no."
 AST_war_is_coming_tt: "\nDesbloquea §Yelecciones democráticas§!."
 AST_war_is_coming_uap_advisors_tt: "(§Y$AST_billy_hughes$§!):"
 AST_war_is_coming_alp_advisors_tt: "(§Y$AST_james_scullin$§!):"
 AST_war_is_coming_decrease_advisors_tt: "(§Y$AST_maurice_blackburn$§!):"
 AST_war_is_coming_advisors_tt: "\nModifica consejero político en:"
 AST_advance_pacific_initiatives: "Iniciativas pacifistas avanzadas"
 AST_advance_pacific_initiatives_desc: "Gracias a los pactos de no agresión que hemos logrado establecer, la relación con nuestros vecinos asiáticos ha mejorado. Seguiremos sacando el máximo partido de estas relaciones y pediremos a nuestros nuevos aliados que nos ayuden en nuestro desarrollo industrial."
 AST_advance_pacific_initiatives_tt: "\nPromulgar un pacto de no agresión con:"
 AST_advance_pacific_initiatives_jap_tt: " §Y[JAP.GetName]§! para añadir §G2§! §Yastilleros§! fuera del mapa a los efectos."
 AST_advance_pacific_initiatives_ins_tt: " §Y[INS.GetName]§! para añadir §G1§! §Yrefinería sintética§! fuera del mapa a los efectos."
 AST_advance_pacific_initiatives_chi_tt: " §Y[CHI.GetName]§! para añadir §G2§! §Yfábricas civiles§! fuera del mapa a los efectos."
 AST_advance_pacific_initiatives_jap_2_tt: "§Y[JAP.GetName]§! ofrece:"
 AST_advance_pacific_initiatives_ins_2_tt: "§Y[INS.GetName]§! ofrece:"
 AST_advance_pacific_initiatives_chi_2_tt: "§Y[CHI.GetName]§! ofrece:"
 AST_advance_pacific_initiatives_2_tt: "\nLos edificios se eliminarán si se entra en guerra con una nación relacionada."
 AST_pacific_initiatives_modifier: "Iniciativas diplomáticas"
 AST_domestic_industry: "Industria nacional"
 AST_domestic_industry_desc: "No podemos contar con que las industrias de defensa aliadas nos abastezcan si estallase la guerra. Debemos expandir nuestras propias industrias y así estaremos preparados para lo que se avecine."
 AST_a_democratic_bulwark: "Un baluarte democrático"
 AST_a_democratic_bulwark_desc: "Para hacer frente a las amenazas fascistas y comunistas, la democracia debe liderar el camino. El gobierno adoptará una política de medidas proactivas para garantizar la representación ciudadana en el seno del gobierno y satisfacer el descontento de los políticos mediante su adhesión a diferentes partidos democráticos en lugar de a ideologías perjudiciales."
 AST_the_pacific_pact: "El Acuerdo del Pacífico"
 AST_the_pacific_pact_desc: "Las iniciativas pacifistas de Lyons de 1934 establecieron contacto entre Australia y las grandes potencias asiáticas, lo que nos permitió dejar de depender de los funcionarios británicos para representar nuestros intereses. Si podemos usar esas relaciones para garantizar la no agresión de las potencias asiáticas a Australia, ese sería el objetivo final de nuestros esfuerzos diplomáticos. Quizá entrañe un desafío, pero merecerá la pena."
 AST_a_collapsing_league_of_nations: "Una Sociedad de Naciones en declive"
 AST_a_collapsing_league_of_nations_desc: "La Sociedad de Naciones, una iniciativa con buenas intenciones que desafortunadamente se aferraba a unas esperanzas poco realistas, se está viniendo abajo. Toda política de sanciones se convierte en un gesto vano, y más cuando no se dispone de fuerzas armadas para mantener a raya a las naciones rebeldes. Hemos de iniciar el rearme."
 AST_department_of_munitions: "Departamento de munición"
 AST_department_of_munitions_desc: "Para abastecer como es debido a los hombres del frente, necesitamos acelerar la producción de munición. Al instaurar un departamento de munición conseguiremos mejorar la supervisión de la producción de componentes de defensa."
 AST_call_for_a_referendum: "Convocatoria de referéndum"
 AST_call_for_a_referendum_desc: "Queremos aumentar el control gubernamental federal, pero primero necesitamos la aprobación de los votantes. Convocaremos un referéndum para tal fin."
 AST_rural_concessions: "Concesiones rurales"
 AST_rural_concessions_desc: "Los representantes rurales del Partido del Campo obtienen muy pocos votos como para gobernar en solitario, pero si acogemos favorablemente su influencia en la política australiana, podremos conseguir más apoyos como partido de gobierno."
 AST_rural_concessions_tt: "\n§Y$AST_country_party_influence_uap$§! aumentará los votos para el partido en el poder cuando se complete el enfoque."
 AST_solidarity_by_the_empire: "Solidaridad del imperio"
 AST_solidarity_by_the_empire_desc: "Hasta ahora, el Imperio británico nos ha hecho las veces de faro tanto en tiempos de guerra como de paz. Continuaremos valorando su consejo y colaborando en la preparación de cara a posibles conflictos."
 AST_solidarity_by_the_empire_modifier: "Solidaridad del imperio"
 AST_wool_agreement: "Acuerdo lanero"
 AST_wool_agreement_desc: "Dado que la lana es uno de los productos comerciales más importantes de Australia, su exportación no solo contribuye monetariamente, sino que mejora las relaciones con las naciones importadoras. Sin embargo, Gran Bretaña exige la entrega total de existencias con la intención de usarla para los uniformes de sus soldados y en las negociaciones con potencias que carecen de ella. Cederemos a sus exigencias."
 AST_australian_war_cabinet: "Gabinete de guerra australiano"
 AST_australian_war_cabinet_desc: "Por orden de Reino Unido, instauraremos nuestro propio gabinete de guerra. Así, y permitiendo que el organismo se centre única y exclusivamente en la seguridad nacional, garantizaremos la toma de decisiones de forma eficaz y estratégica."
 AST_singapore_strategy: "Estrategia Singapur"
 AST_singapore_strategy_desc: "La Estrategia Singapur es fundamental para la política de defensa australiana y, como base de la Marina Real estacionada en el Pacífico que es, el territorio de Singapur es de vital importancia. Hemos de convencer a los británicos de que erijan construcciones de defensa adicionales mientras nosotros fortalecemos las capacidades navales australianas."
 AST_singapore_strategy_tt: "Tras §Y180§! días (§YSingapur§!):\nAñade §G2§! §Ybases aéreas§!.\nAñade §G2§! §Ybases navales§!.\nAñade §G1§! §Yfuerte costero§!."
 AST_british_war_cabinet: "Gabinete de guerra británico"
 AST_british_war_cabinet_desc: "La guerra ha estallado y Reino Unido ha creado un gabinete de guerra para garantizar que el esfuerzo bélico de los Aliados llega a buen puerto. Nos han convocado para compartir nuestra opinión al respecto y, por tanto, el primer ministro partirá para representar los intereses de Australia."
 potential_consequence_tt: "§YPosible consecuencia§!:\n"
 AST_british_pacific_fleet: "Flota británica del Pacífico"
 AST_british_pacific_fleet_desc: "La presencia británica en el Pacífico será crucial para desalentar y defendernos de los navíos enemigos que expanden su dominio naval hacia el sur. Dado que formamos parte de [Root.GetFactionName], tomaremos medidas para crear una estructura de mando conjunta y proteger así las aguas costeras."
 AST_all_dressed_up: "Con ropa de calidad"
 AST_all_dressed_up_desc: "Si los soldados australianos luchan en las guerras británicas, las fábricas británicas deberán equiparlos."
 AST_overseas_loyalties: "Lealtades extranjeras"
 AST_overseas_loyalties_desc: "Seguiremos contribuyendo a las guerras ajenas para demostrar una vez más que no hay territorio que se les resista a los soldados australianos. Las guerras no vienen a por nosotros; nosotros vamos a por ellas."
 AST_the_ultimate_overseas_duty: "El deber definitivo en ultramar"
 AST_the_ultimate_overseas_duty_desc: "El primer ministro británico ha descuidado sus responsabilidades hasta tal punto que hasta sus propios ministros desconfían de él. Menzies ha causado muy buena impresión durante sus visitas para asistir al gabinete de guerra británico, y ahora hay quien insinúa que es la mejor opción para el país. Con él al frente de la Mancomunidad, podemos sacarle partido a la lealtad de Menzies hacia [AST.GetName] para gozar de una mayor influencia."
 AST_the_ultimate_overseas_duty_tt: "\nCon §Y$AST_robert_menzies$§! como líder en §Y[ENG.GetNameDef]§!, podemos adoptar el enfoque §Y$AST_a_change_of_authority$§! y convertirnos en §Y$autonomy_associated_dominion$§!."
 AST_pleading_britain: "Suplicar a Gran Bretaña"
 AST_pleading_britain_desc: "La guerra se avecina, cosa que nos tiene temblando. Con el debido respeto hacia el Espíritu Anzac y la reputación de los Diggers, la capacidad bélica de Australia se quedaría en mínimos sin la ayuda de [ENG.GetName]. El primer ministro ha de enviarle un telegrama a [ENG.GetLeader] cuanto antes."
 AST_bound_once_more: "Juntos de nuevo"
 AST_bound_once_more_desc: "Nuestros caminos se han separado, pero volverán a unirse. [ENG.GetNameDefCap] y [AST.GetName] están experimentando cambios a nivel nacional, pero la distancia que nos separa como consecuencia es un efecto adverso e involuntario, al menos por nuestra parte. Debemos aliarnos de nuevo y superar juntos los obstáculos a los que se enfrentan nuestras naciones."
 AST_eng_to_ast_faction_tt: "§Y[ENG.GetName]§! y sus súbditos se unen a §Y[AST.GetFactionName]§!."
 AST_faction_leader_tt: "Nombrar al líder de la facción §Y[AST.GetFactionName]§!."
 AST_eng_as_faction_leader_tt: "\n([ENG.GetFlag]§Y[ENG.GetName]§!) $AST_faction_leader_tt$."
 AST_australian_command: "Mando de Australia"
 AST_australian_command_desc: "Dado que la importancia de la defensa y seguridad de Australia salta a la vista hasta en [ENG.GetNameDef], es necesario reorganizar nuestras fuerzas conjuntas. Si disponemos de más efectivos británicos bajo el mando australiano, actuaremos con mayor eficiencia en combate."
 AST_taking_the_helm: "Tomar las riendas"
 AST_taking_the_helm_desc: "Ahora que nuestra influencia se está extendiendo por el Sudeste Asiático, hemos de fortalecer nuestra capacidad naval para defenderlo. Hay que priorizar la inversión de la Armada Real Australiana y hacernos con el control de los mares orientales."
 AST_eastern_focus: "Enfoque oriental"
 AST_eastern_focus_desc: "Si las guerras británicas son guerras australianas, las australianas también son británicas. Es innegable que desde hace tiempo se está fraguando una invasión por parte de Japón, y ya no toleraremos la pasividad actual que aguarda a que el conflicto llame a nuestra puerta. Le mostraremos a Japón en qué consiste la determinación australiana, mientras Gran Bretaña reafirma su lealtad en la declaración más audaz de todas: una declaración de guerra."
 AST_eastern_focus_tt: "\nLa misión permitirá a §Y[ENG.GetNameDef]§! declararle la guerra a §Y[JAP.GetNameDef]§! inmediatamente, u obligar a que lo hagan si no lo han hecho en 180 días. §Y[ENG.GetNameDefCap]§! puede retrasar el plazo de la misión financiando la construcción de defensas australianas."
 AST_holding_the_battlefield: "Resistir en el campo de batalla"
 AST_holding_the_battlefield_desc: "Muchos soldados australianos han caído en el extranjero y, para colmo, sus hazañas se las adjudican a los británicos. Australia exige tener más influencia en la mesa de negociaciones de las conferencias de paz junto con [ENG.GetNameDef]. De lo contrario, quizá dejemos de contribuir."
 AST_holding_the_battlefield_tt: "Se §Yreduce el coste§! de las acciones §YTítere§! y §YTomar Estados§! en conferencias de paz con §Y[ENG.GetNameDef]§!."
 AST_a_change_of_authority: "Un cambio de autoridad"
 AST_a_change_of_authority_desc: "Para ser un súbdito sumiso, Australia se ha convertido en una nación resuelta y respetada. Ya va siendo hora de que dé el último paso para convertirse en una potencia a nivel mundial. Como líderes de [AST.GetFactionName], nuestros amigos nos respetarán y nuestros enemigos nos temerán. Australia se mantendrá firme y no cederá."
 AST_a_change_of_authority_tt: " §Y[ROOT.GetName]§! ahora puede declarar guerras.\n §Y[ROOT.GetName]§! ahora puede rechazar unirse a la guerra.\n §Y[ROOT.GetName]§! ya no transfiere su puntuación de paz a su gobernante."
 AST_reinforcements: "Refuerzos"
 AST_reinforcements_desc: "Dotaremos a las zonas septentrionales subdesarrolladas de instalaciones defensivas y bases aéreas."
 AST_weekly_stability_tt: " Estabilidad semanal: §G+1%§!"
 AST_ending_overseas_conscription: "Acabar con el reclutamiento extranjero"
 AST_ending_overseas_conscription_desc: "Nuestros soldados han de retirarse de las costas extranjeras de inmediato, pues los necesitamos aquí."
 AST_unlocking_conscription_1903_tt: "Se requiere para desbloquear §YLeyes de reclutamiento§!."
 AST_unlocking_further_conscription_tt: "Para §YReclutamiento amplio§! o §YServicio obligatorio§!, también necesitarás cualquiera de los siguientes enfoques; §Y$AST_british_pact$§! (fascista), §Y$AST_refuse_british_wars$§! (fascista), §Y$AST_toe_the_line$§! (fascista), §Y$AST_from_picket_line_to_front_line$§! (comunista) o §Y$AST_part_with_colonizer$§! (comunista)."
 AST_unlocking_conscription_tt: "Si también tienes §Y$AST_invoke_the_1903_defence_act$§!, desbloquearás todas las §YLeyes de reclutamiento§! restantes."
 AST_an_uncle_for_father_figure: "Un tío como figura paterna"
 AST_an_uncle_for_father_figure_desc: "Como carecemos de armamento moderno, hemos de solicitarle a [USA.GetName] que nos lo provea."
 AST_seven_million_britishers: "Siete millones de británicos"
 AST_seven_million_britishers_desc: "Aunque [ENG.GetLeader] se ha mostrado reacio a hacernos promesas, debemos confiar en su compromiso y el de Gran Bretaña para con [AST.GetNameDef] llegado el momento. Al fin y al cabo, no somos más que siete millones de británicos."
 AST_seven_million_britishers_reinforcements_tt: "\n§YSi $AST_reinforcements$ no se ha completado§!:"
 AST_seven_million_britishers_conscription_tt: "\n§YSi $AST_ending_overseas_conscription$ no se ha completado§!:"
 AST_seven_million_britishers_uncle_tt: "\n§YSi $AST_an_uncle_for_father_figure$ no se ha completado§!:"
 AST_we_endured: "Hemos resistido"
 AST_we_endured_desc: "Quizá de primeras el pronóstico de un conflicto inminente haya sido abrumador, pero, al final, nos ha servido para acelerar la expansión de nuestras capacidades de defensa. Hemos resistido y persistiremos ahora que tenemos un objetivo muy claro: ganar la guerra."
 AST_under_the_rule_of_canberra: "Bajo el gobierno de Camberra"
 AST_under_the_rule_of_canberra_desc: "La tensión creciente entre los países del Pacífico es preocupante y, dado que Gran Bretaña está ocupada librando sus propias batallas, no puede acudir en nuestra ayuda. Si reconstruimos la Mancomunidad Británica de Naciones para que las naciones del Pacífico y el océano Índico se gestionen directamente desde Camberra, quizá podamos unirnos en un solo frente e incluso sin [ENG.GetNameDef]."
 AST_its_fight_work_or_perish: "Luchar, trabajar o perecer"
 AST_its_fight_work_or_perish_desc: "La guerra ha comenzado y solo tenemos una opción: demostrar que estamos preparados."
 AST_no_foreign_battlefields: "No más campos de batalla extranjeros"
 AST_no_foreign_battlefields_desc: "Tras una larga espera, al fin el gobierno va a declarar que no se coaccionará a ningún ciudadano para que sirva en campos de batalla extranjeros."
 AST_no_foreign_battlefields_modifier: "No más campos de batalla extranjeros"
 AST_platypus_modifier: "Un ornitorrinco como presente"
 AST_aerial_defense: "Defensa aérea"
 AST_aerial_defense_desc: "Si bien no podemos permitirnos tener una armada naval a la altura de las de las potencias mundiales, sí que está a nuestro alcance mantener una flota aérea similar a las que pueden enfrentarse a nosotros."
 AST_ratify_westminster_adoption_act: "Ratificar la Ley de Adopción de Westminster"
 AST_ratify_westminster_adoption_act_desc: "Pese a la controversia que puede provocar un cambio de políticas largamente asentadas, ya va siendo hora de que ratifiquemos la Ley de Adopción de Westminster. Nosotros decidiremos qué guerras librar."
 AST_ratify_westminster_adoption_act_tt: "£GFX_trigger_no Puede rechazar la llamada a la guerra"
 AST_administer_the_mandate: "Administrar el mandato"
 AST_administer_the_mandate_desc: "Tras controlar Nueva Guinea bajo el mandato de la Sociedad de Naciones desde 1920, y dado que Papúa ha sido territorio externo de [AST.GetName] casi desde la Federación, es lógico que la parte oriental de Papúa Nueva Guinea pase a formar parte de los territorios esenciales de [AST.GetName]. Ahora que la Sociedad de Naciones se ha disuelto, tenemos la oportunidad de llevar a cabo tal reorganización federal."
 AST_a_rational_request: "Una petición lógica"
 AST_a_rational_request_desc: "La Estrategia Singapur funciona en teoría, pero está por ver si en la práctica lo hará también. Henry Wynter y otras voces extremas llevaban razón: todo apunta a que Gran Bretaña será ocupada si estalla una guerra en el Pacífico y, por tanto, cualquier estrategia concebida en torno a la ayuda británica fracasará. Solicitaremos el control de Singapur para que la defensa de nuestros océanos recaiga sobre nosotros."
 add_trait_to_theorist_tt: "Añade el rasgo a §YTeórico§!:"
 AST_volunteers: "Voluntarios"
 AST_volunteers_desc: "Poder elegir es lo importante. Que Australia tenga la opción de rechazar la llamada a las armas no significa que vaya a hacerlo. Los australianos tendrán derecho a luchar por lo que es justo, tanto en su territorio como en el ajeno."
 AST_until_the_tide_of_battle_swings: "Hasta que la suerte de la batalla cambie"
 AST_until_the_tide_of_battle_swings_desc: "Dejaremos bien claro públicamente que ya no es posible ignorar la amenaza que nos acecha. Nos negamos a aceptar la idea de que la lucha del Pacífico ha de abordarse como si estuviera vinculada al conflicto principal. Australia debe prepararse para una invasión de inmediato."
 AST_walls_and_whispers: "Murallas y susurros"
 AST_walls_and_whispers_desc: "Unas murallas impenetrables combinadas con una estrecha vigilancia del terreno ofrecen un gran potencial para la seguridad nacional. Tomaremos medidas para afianzar las bases sobre las que asentar las defensas de tierra firme y de las costas por todas nuestras tierras, y estableceremos un cuartel general de inteligencia en su interior."
 AST_united_states_as_our_keystone: "Estados Unidos como piedra angular"
 AST_united_states_as_our_keystone_desc: "Conocemos los problemas a los que se enfrenta Reino Unido. Somos conscientes de los peligros que entraña dispersar las fuerzas, pero también sabemos que Australia puede irse y que Gran Bretaña puede resistir. Por lo tanto, consideramos que Australia no debería marcharse y pondremos de nuestra parte para trazar un plan cuya piedra angular sea Estados Unidos."
 AST_liberty_loans: "Los préstamos de la libertad"
 AST_liberty_loans_desc: "Gracias a su experiencia como tesorero (el mejor que ha habido jamás, según afirman algunos), Ben Chifley ha demostrado su capacidad para gestionar la economía en tiempos de guerra. Por recomendación suya, alentaremos a la población a ahorrar parte de sus ingresos y a invertir en bonos de guerra."
 AST_inevitably_independent: "Inevitablemente independiente"
 AST_inevitably_independent_desc: "Aunque el Partido por una Australia Unida siempre ha valorado la ciudadanía británica, la indiferencia de [ENG.GetNameDef] ante los intereses australianos nos ha obligado a declarar la independencia y a priorizar nuestra propia defensa. Ahora que nuestra presencia en las guerras británicas del extranjero carece de relevancia, hasta los antilealistas tienden a cumplir las normas y, si decidimos ampliar el reclutamiento, opondrán menos resistencia."
 AST_bring_on_the_giant: "Que pase el gigante"
 AST_bring_on_the_giant_desc: "Como un país unificado y autónomo al fin, pondremos a prueba nuestra valía. En el otro lado del Pacífico parecen compartir nuestros intereses. La industria militar desarrollada de [USA.GetNameDef] nos beneficiará a ambos, pues arrendará parte de sus cuantiosos suministros a nuestras tropas."
 AST_bring_on_the_giant_tt: "  Si §Y[USA.GetNameDefCap]§! está de acuerdo:\n§Y+50§! §Yconvoyes§! se añadirán a la reserva nacional."
 AST_allied_after_all: "Aliados, al fin y al cabo"
 AST_allied_after_all_desc: "Aunque la independencia de Australia era una necesidad, no debemos cortar de raíz la relación con nuestro antiguo gobernante. Seguiremos siendo fieles a [ENG.GetFactionName] en la misma medida que hasta ahora, pero nuestro objetivo es disponer de una mayor influencia dentro de la facción."
 AST_the_pacific_resistance: "La Resistencia del Pacífico"
 AST_the_pacific_resistance_desc: "Por fin hemos conseguido la independencia australiana, y lo suyo es que también nos desvinculemos de los británicos en lo que al esfuerzo bélico se refiere. Si buscamos la unidad con [USA.GetNameDef], podremos idear estrategias de mando conjuntas que valoren los intereses australianos mientras, de forma independiente, asumimos el control total de nuestra industria de defensa y su expansión."
 AST_the_pacific_resistance_tt1: "§YAustralia§! se une a §Y[USA.GetFactionName]§!."
 AST_the_pacific_resistance_tt2: "§Y[USA.GetName]§! se une a la §YResistencia del Pacífico§!."
 AST_conscription_at_last: "Reclutamiento al fin"
 AST_conscription_at_last_desc: "La independencia es maravillosa, pues ahora estamos en condiciones de priorizar nuestra defensa. Pero ese poder también conlleva responsabilidades. El reclutamiento obligatorio no debería aumentarse a la ligera, pero al tener la guerra encima se ha vuelto necesario."
 AST_equal_training: "Entrenamiento idéntico"
 AST_equal_training_desc: "Hemos de mejorar la cooperación con nuestros aliados y no asumir que funcionará por ciencia infusa. Australia tomará la iniciativa para organizar campos de entrenamiento conjuntos para los países de la facción [ROOT.GetFactionName] y garantizar que todos los soldados reciben el mismo entrenamiento riguroso."
 AST_a_northern_barrier: "Una barrera norte"
 AST_a_northern_barrier_desc: "El enemigo se acerca desde el norte y ante él se hallan naciones más pequeñas y desprovistas a las que puede atacar a voluntad antes de llamar a nuestra puerta. Si cooperamos con [INS.GetNameDef] para formar una única barrera, quizá tengamos posibilidades de reprimirlos."
 AST_demand_resources: "Exigir recursos"
 AST_demand_resources_desc: "Los agresores expansionistas tienen la mirada puesta en Indochina no solo por su territorio, sino también por los recursos que posee. Si las riquezas acaban en manos del enemigo, la guerra se prolongará. En cambio, si acaban en las nuestras, el conflicto podría llegar a su fin. Solicitaremos controlar estos recursos y, si sus dueños se niegan a cooperar, nada los diferencia del enemigo."
 AST_demand_resources_tt: "Desbloquea decisiones de §Y$AST_resource_acquisition_cat$§! para solicitar parte de los recursos de las naciones del Sudeste Asiático."
 AST_reclaim_the_lost_territory: "Recuperar el territorio perdido"
 AST_reclaim_the_lost_territory_desc: "En pleno proceso mediante el cual las colonias australianas se unirían en una federación, Nueva Zelanda decidió mantenerse al margen. Sin embargo, la Constitución sigue contemplando esta última como uno de los posibles estados de la Mancomunidad australiana y permite su admisión. Debemos recordarles esto a nuestros vecinos orientales y argumentarles que la situación mundial actual exige unidad."
 AST_reclaim_the_lost_territory_tt: "([NZL.GetFlag]§Y[NZL.GetName]§!) Transfiere todas las fuerzas terrestres, navales y aéreas a §Y[AST.GetNameDef]§!."
 AST_australia_first: "Australia es lo primero"
 AST_australia_first_desc: "El ímpetu de extrema derecha del Partido del Centro fue efímero, concluyendo con su disolución en 1935. Sin embargo, algo nuevo empieza a fraguarse a partir de las ideas del hombre de negocios y activista político William John Miles. Sin embargo, si no se emprende ninguna acción para movilizar dichos sentimientos, estos podrían extinguirse tan rápido como surgieron. Por ello, habrá que emprender acciones."
 AST_pankhurst_walsh: "Adela Pankhurst Walsh"
 AST_pankhurst_walsh_desc: "En el establecimiento formal del movimiento Australia First nombraremos presidenta a Adela Pankhurst Walsh. Como fundadora del Gremio de Mujeres Australianas del Imperio, Pankhurst Walsh (que mantiene un vínculo estrecho con el Gremio de Mujeres de Londres) hace mucho que defiende el valor de la ciudadanía británica, valor que formará el principio rector de nuestro movimiento: mantener los lazos con Gran Bretaña."
 AST_stephensen: "P. R. Stephensen"
 AST_stephensen_desc: "En el establecimiento formal del movimiento Australia First, nombraremos presidente a P. R. Stephensen. Como asesor literario de William John Miles, Stephensen comparte las ideas aislacionistas y nacionalistas de su mentor. Estas formarán los dos principios esenciales de la constitución de nuestro movimiento: la independencia de Gran Bretaña y la unificación de la cultura australiana."
 AST_stephensen_tt: "\nLa elección de la presidencia del §Ymovimiento Australia First§! decide las posibles acciones futuras."
 AST_a_growing_womens_guild: "Un gremio femenino en desarrollo"
 AST_a_growing_womens_guild_desc: "Desde que se fundó en 1928, el Gremio de Mujeres Australianas del Imperio ha defendido la cooperación industrial para combatir los problemas económicos nacionales. Por el bien de la nación, los ciudadanos apoyarán a su gobierno en vez de trabajar contra él. Con Pankhurst Walsh como presidenta por Australia First, podemos extender este mensaje más lejos a través de este movimiento político."
 AST_realize_the_value_of_british_citizenship: "Reparar en el valor de la ciudadanía británica"
 AST_realize_the_value_of_british_citizenship_desc: "El dominio de [ENG.GetNameDef] sobre [AST.GetName] ha servido mucho tiempo a nuestra nación tanto como escudo protector como faro de guía. De Gran Bretaña hemos venido y de Gran Bretaña seguiremos siendo... mientras nos siga viniendo bien."
 AST_the_bolsheviks_counterforce: "El contrapeso de los bolcheviques"
 AST_the_bolsheviks_counterforce_desc: "La Agencia de Investigación lleva décadas indagando en las actividades de grupos subversivos. Su trabajo para neutralizar amenazas izquierdistas tiene un gran valor y no debería descuidarse solo porque los que se oponen a Australia First prefieran resistirse a nuestro crecimiento. Buscaremos puestos dentro de la oficina de inteligencia australiana y garantizaremos que se le dé prioridad a la verdadera amenaza contra la seguridad nacional."
 AST_public_meetings_tt: "Desbloquea decisiones del §Ymovimiento Australia First§! para movilizar a sus miembros y aumentar el apoyo al fascismo."
 AST_rile_up_veterans: "Agitar a los veteranos"
 AST_rile_up_veterans_desc: "Al inicio de la Gran Depresión, los veteranos de la Primera Guerra Mundial se unieron en grupos paramilitares de extrema derecha para contrarrestar el auge del comunismo. Aunque esos grupos se hayan disuelto desde entonces, sus antiguos miembros no han desaparecido. Australia First los absorberá tomando el testigo de la causa anticomunista."
 AST_eureka_stockade_monument_rally: "Concentración en el monumento a la Eureka Stockade"
 AST_eureka_stockade_monument_rally_desc: "En 1854, en la batalla de la Eureka Stockade, los buscadores de oro australianos lucharon ferozmente contra las fuerzas coloniales por los costes poco razonables de los permisos de explotación minera y los impuestos sobre las minas de oro. El descontento con la soberanía británica era aparente entonces y lo sigue siendo ahora. Nos reuniremos en el monumento a la batalla y promoveremos la ruptura con Gran Bretaña."
 AST_australian_pivot_modifier: "Reenfoque australiano"
 AST_well-being_of_the_community: "Bienestar de la comunidad"
 AST_well-being_of_the_community_desc: "Los ideales cristianos de vida y de familia deberían ser muy valorados por la población australiana. Sin embargo, viendo la bajísima natalidad de los últimos años, es innegable que dichos ideales no se han promulgado lo suficiente. Por el bienestar de la comunidad, lanzaremos una campaña que promueva la vida familiar."
 AST_covert_networks: "Redes encubiertas"
 AST_covert_networks_desc: "Con Australia First actuando dentro de la Agencia de Investigación, buscaremos la cooperación más allá de las fronteras con movimientos de intenciones similares en [ENG.GetNameDef]. La alianza con nuestro soberano podría servirnos de otro modo más, permitiéndonos llegar en secreto a aliados afines ideológicamente y expandir el alcance de nuestra inteligencia."
 AST_refuse_british_wars: "Rechazar las guerras británicas"
 AST_refuse_british_wars_desc: "La campaña de Galípoli de la Gran Guerra demostró la imprudencia con la que [ENG.GetNameDef] trata a nuestras fuerzas expedicionarias, haciendo que la idea de otra campaña en el extranjero librada en su nombre sea inconcebible. Los australianos exigen que no se derrame más sangre a las órdenes de los británicos, lo que obliga al gobierno a actuar: hay que ratificar la Ley de Westminster."
 AST_walls_like_uluru: "Muros como Uluru"
 AST_walls_like_uluru_desc: "Australia ya es un continente en sí mismo. Si queremos subsistir sin la protección del Imperio, hemos de contar con la nuestra propia. Reforzaremos las costas y fortificaremos los puertos. Acceder a nuestro territorio será peligroso para quien ose subestimar a esta nación."
 AST_at_the_gates: "A las puertas"
 AST_at_the_gates_desc: "El mundo está cada vez más cerca de la guerra y a Australia no la pillarán de improviso. Las fábricas y los astilleros nacionales deben acelerar la producción. No nos estamos preparando para un conflicto ajeno, sino para nuestra propia supervivencia."
 AST_the_guild_for_the_war_effort: "El gremio para el esfuerzo bélico"
 AST_the_guild_for_the_war_effort_desc: "El Gremio de Mujeres Australianas del Imperio se fundó para servir a la Corona, pero su objetivo ha cambiado. La gran red organizativa de la que dispone centrará sus esfuerzos en la industria bélica, los hospitales y las cadenas de suministros de una Australia autosuficiente."
 AST_for_the_southern_cross: "Por el Southern Cross"
 AST_for_the_southern_cross_desc: "El Southern Cross no vuela sobre Gran Bretaña, sino sobre nosotros. La identidad australiana existe; es algo que nos hemos ganado y que merece la pena defender. Estamos viendo nacer un sentimiento de orgullo nacional que no se ha originado en Londres ni han moldeado las instituciones forasteras, sino que ha surgido aquí, en este territorio y bajo estas estrellas."
 AST_through_the_gates: "A través de las puertas"
 AST_through_the_gates_desc: "La preparación ha dado paso a la urgencia. Con el respaldo de toda la industria australiana, se ha ampliado el programa de defensa nacional. Se están construyendo instalaciones nuevas junto a las ya existentes, se están revisando al alza los objetivos de producción, y la línea que separa la producción civil de las necesidades militares es cada vez más difusa."
 AST_toe_the_line: "Acatar las normas"
 AST_toe_the_line_desc: "Hay que dejar al margen las comodidades a las que se acostumbraron los australianos durante los años de prosperidad. El racionamiento, unas jornadas de trabajo más largas y el servicio militar obligatorio es el precio que hay que pagar por la independencia. Quienes respondan como es debido contarán con el apoyo de la nación, pero el Estado no se mostrará paciente con quienes consideran que no han de hacer sacrificios."
 AST_crush_the_gates: "Destrozar las puertas"
 AST_crush_the_gates_desc: "El desarrollo ha concluido. Ahora, la industria australiana opera en pie de guerra y destina toda su producción a la defensa y la proyección del poder nacional. Por fiera que sea la tormenta que se avecina, Australia no reaccionará como un dominio remiso al que le cuesta movilizarse."
 AST_national_defense: "Defensa nacional"
 AST_national_defense_desc: "Gracias a las inversiones planificadas y a las indicaciones del gobierno, Australia ha creado una base industrial capaz de sustentar su propia defensa. El Estado supervisa el funcionamiento de las fábricas y los astilleros, y mide la producción teniendo en cuenta las necesidades de la nación, no en términos de beneficio."
 modify_AST_national_defense_tt: "Modifica §Y$AST_national_defense$§! en:"
 AST_nauru_pact: "Pacto de Nauru"
 AST_nauru_pact_desc: "Con el obstáculo inicial de tomar el poder aún por delante, la cuestión de la independencia aún parece lejana. Sin embargo, la autonomía australiana no solo es algo que nos interese a nosotros. A cambio de la garantía de soberanía que nos ofrece [GER.GetNameDef] en caso de que Gran Bretaña se resista a Australia First o la posible futura secesión de la Mancomunidad, al tomar el poder les devolveremos una de las islas del Pacífico que perdieron: Nauru."
 AST_australian_culture_investments: "Inversiones en la cultura australiana"
 AST_australian_culture_investments_desc: "Con su ensayo Los fundamentos de la cultura en Australia, Stephensen ha influido en la formación del movimiento poético Jindyworobak, y ha dejado clara una cosa: debe darse prioridad a la cultura australiana. El gobierno parece ignorar completamente el valor de los artistas y los escritores, pero nosotros no lo haremos. Movilizando a los partidarios del Jindyworobak y de Australia First fomentaremos el desarrollo cultural."
 AST_australian_culture_investments_tt: "\nTras §Y365§! días:"
 AST_australia_first_party_focus: "Australia First Party"
 AST_australia_first_party_focus_desc: "Los miembros del Australia First Party han aumentado tanto que el avance del movimiento ya no se puede contener. Es hora de que el pueblo australiano dé la bienvenida a la voz nacionalista más alta registrada hasta ahora: el Australia First Party."
 AST_australia_first_party_req_tt: "Se ha fundado el §YAustralia First Party§!."
 AST_in_from_the_cold: "A la intemperie"
 AST_in_from_the_cold_desc: "El movimiento Australia First y sus seguidores ya no pueden ocultarse. El maltrato que ha sufrido nuestra nación bajo una larga sucesión de gobiernos anteriores ha quedado expuesto al fin, y es hora de que se oigan nuevas voces."
 AST_absorb_the_uap: "Absorber el PAU"
 AST_absorb_the_uap_desc: "Aunque el Partido por una Australia Unida siempre ha sido liberal, también es de derechas. Sin embargo, con un nuevo partido político al frente, los miembros del PAU quizá no tengan más opción que apoyar la causa del gobierno actual. Contactaremos con sus miembros más prominentes y los reclutaremos para el Australia First Party."
 AST_big_business_pact: "Pacto de grandes empresas"
 AST_big_business_pact_desc: "Dado que el Australia First Party pretende proteger la industria nacional, ha encontrado a muchos partidarios entre los principales líderes empresariales. A cambio de promover políticas que aumenten sus beneficios, apoyarán nuestras metas militares y políticas."
 AST_big_business_pact_tt: "\nDesbloquea decisiones de §YPacto de grandes empresas§! para tener impacto en las metas industriales y de construcción."
 AST_autarky: "Autarquía"
 AST_autarky_desc: "Depender del comercio exterior es peligroso, especialmente en tiempos de conflicto; debe dársele prioridad a las industrias australianas, sin que las releguen las importaciones. Solo restringiendo nuestras leyes de comercio podremos proteger la economía nacional y garantizar que Australia se autoabastezca."
 AST_energy_independence: "Independencia energética"
 AST_energy_independence_desc: "Depender del comercio exterior es peligroso, especialmente en tiempos de conflicto; la independencia energética es vital para garantizar que Australia pueda funcionar hasta en los tiempos más aciagos. Invirtiendo en refinerías, podremos promover la producción nacional de energía."
 remove_2_offsite_dockyard: "Elimina §R2§! §Yastilleros navales§! fuera del mapa."
 AST_british_pact: "Pacto británico"
 AST_british_pact_desc: "Pese a nuestra reciente escisión de la Mancomunidad Británica de Naciones, a [AST.GetName] le interesa seguir cooperando con su vieja patria. Teniendo en cuenta que [ENG.GetNameDef] debe repartir sus efectivos por todo el planeta, nuestra disposición a aligerarles la carga ofreciendo cooperación militar debería ser bien recibida."
 AST_naurus_return_to_german_hands: "Nauru vuelve a manos alemanas"
 AST_naurus_return_to_german_hands_desc: "Ahora que Australia First ha tomado las riendas del país por completo, es hora de que cumplamos la promesa de devolución de Nauru y de que nuestros aliados alemanes formalicen su parte del trato. [AST.GetName] al fin se liberará de las cadenas de la Mancomunidad y dejará a los británicos sin voz ni voto en la cuestión."
 AST_naurus_return_to_german_hands_tt: "El \"§YPacto de Nauru§!\" pasa a estar activo."
 AST_naurus_return_to_german_hands_tt_2: "El \"§YPacto de Nauru§!\" está activo."
 AST_the_winner_takes_it_all: "El ganador se lo queda todo"
 AST_the_winner_takes_it_all_desc: "Aunque sacrificar la isla de Nauru a cambio de la cooperación alemana parecía razonable en otro momento, ya no es el caso. Una vez demostrada la fuerza de nuestras capacidades, buscaremos expandirnos a las Islas Salomón y a Nueva Zelanda, aunque lo primero agrave nuestra traición al Pacto de Nauru. Después de todo, las Islas Salomón se convertirán en otro territorio alemán arrebatado por los australianos."
 AST_resist_western_intruders: "Resistir a los intrusos occidentales"
 AST_resist_western_intruders_desc: "Las naciones occidentales parecen sentirse obligadas a inmiscuirse en los asuntos del Pacífico, pero ya no lo toleraremos más. Antes de que lleguen a nuestras costas, llegaremos nosotros a las suyas, demostrando que [AST.GetName] no es una nación que se someta a sus exigencias."
 AST_invasion_preparation_tt: "Tiempo de preparación de invasión: §G-20,0%§!"
 AST_naval_invasion_penalty_tt: "Penalización de invasión: §G-20,0%§!"
 AST_expand_the_fort: "Ampliar el fuerte"
 AST_expand_the_fort_desc: "[USA.GetNameDef] no debe estar al mando del Pacífico occidental. Las islas reclamadas por Estados Unidos pertenecen a las naciones del este de Asia, y al ir creciendo la influencia australiana, nosotros debemos ser los que las reclamemos."
 AST_integrate_the_fort: "Integrar el fuerte"
 AST_integrate_the_fort_desc: "Tras controlar Nueva Guinea bajo el mandato de la Sociedad de Naciones desde 1920, y dado que Papúa ha sido territorio externo de [AST.GetName] casi desde la Federación, es lógico que la parte oriental de Papúa Nueva Guinea pase a formar parte de los territorios esenciales de [AST.GetName]. Como parte de nuestros esfuerzos para unificar la cultura australiana, este debería ser el siguiente paso."
 AST_defying_american_interference: "Desafiar a la interferencia estadounidense"
 AST_defying_american_interference_desc: "La sombra de [USA.GetNameDefCap] se cierne sobre nosotros, amenazando con interferir cada vez que nuestros actos no concuerden con sus intereses. Con una potencia mundial de tal magnitud cerrando su puño de hierro en torno a [PHI.GetNameDef], las naciones de Asia Oriental nunca pertenecerán realmente a Asia Oriental. [AST.GetName] no se someterá a la autoridad de ningún intruso extranjero. Las Filipinas serán nuestras."
 AST_the_pacific_garrison: "La guarnición del Pacífico"
 AST_the_pacific_garrison_desc: "Si bien al gobierno británico le interesa que el Sudeste Asiático y el Pacífico estén bien protegidos, se trata de una región muy distante del archipiélago británico. A cambio de su apoyo en el suministro, les ofreceremos asumir el mando de la defensa de ese territorio, permitiendo que [ENG.GetNameDef] dedique su atención a otros frentes."
 AST_vichy_out_of_africa: "Vichy fuera de África"
 AST_vichy_out_of_africa_desc: "La caída o cooperación de la Francia de Vichy es uno de los principales objetivos de [ENG.GetNameDef]. Como gesto de buena voluntad, [AST.GetName] intervendrá tratando de hacerse con las colonias francesas en África hasta su dominio."
 AST_vichy_out_of_africa_tt1: "Añade reivindicaciones de los territorios de la §YFrancia de Vichy§! en §YÁfrica§! mediante el enfoque §YVichy fuera de África§!.\n"
 AST_vichy_out_of_africa_tt2: "Añade reivindicaciones de los territorios de la §YFrancia de Vichy§! en §YÁfrica§! mediante las decisiones §YVichy fuera de África§!.\n"
 AST_vichy_africa_claim_flag: "Las reivindicaciones de [AST.GetFlag]§Y[AST.GetName]§! de todos los territorios de la §YFrancia de Vichy§! en §YÁfrica§! se añaden a §YAdiós a inmiscuirse§!."
 AST_vichy_claim_tt: "Las reivindicaciones de [AST.GetFlag]§Y[AST.GetName]§! se añaden a §YAdiós a inmiscuirse§!."
 vichy_in_africa_trigger: "§YFrancia de Vichy§!: Cualquier estado controlado:\n    Está en §YÁfrica§!"
 vichy_wargoal: "Obtiene el objetivo de guerra §YAnexionar§! contra la §YFrancia de Vichy§!."
 AST_britain_supplying_ships: "Barcos de suministros británicos"
 AST_britain_supplying_ships_desc: "Tras cargar con el peso de proteger las costas de los aliados británicos, ha resultado evidente que es necesario expandir la flota de [ROOT.GetName]. Lo justo es que [ENG.GetNameDef] nos proporcione los barcos."
 AST_hand_in_glove: "Confabulaciones"
 AST_hand_in_glove_desc: "Al expandirnos hacia el norte, podremos aumentar la influencia australiana sobre la diplomacia y los conflictos del Sudeste Asiático. Ya hemos demostrado nuestra capacidad para salvaguardar los intereses británicos junto con los nuestros, y [ENG.GetNameDef] debe entender por qué sería mejor que sus territorios remotos quedasen en nuestras manos."
 AST_claim_french_indochina: "Reclamar la Indochina francesa"
 AST_claim_french_indochina_desc: "Con el destino de Francia aún por determinar, el de sus colonias tampoco está decidido. Puede que otras naciones intenten hacerse con la Indochina francesa, pero no nos pasarán por encima."
 AST_undeniably_ours: "Nos pertenece y punto"
 AST_undeniably_ours_desc: "Independientemente de lo que podamos conseguir con la diplomacia, nunca lo conseguiremos todo. En su frágil estado, las fronteras de la Francia de Vichy son solo meras sugerencias, y dejar pasar la oportunidad de ocupar completamente sus tierras sería insensato. La hora de la guerra ha llegado inevitablemente."
 AST_done_meddling: "Adiós a inmiscuirse"
 AST_done_meddling_desc: "Siempre leal a la vieja patria, [AST.GetName] sigue librando batallas británicas con la cabeza bien alta. Los australianos son un pueblo con el que puedes contar, pero eso no significa que no debas corresponderles. Mientras [AST.GetName] luche por [ENG.GetNameDef], [ENG.GetNameDef] también luchará por [AST.GetName]."
 AST_northern_advancement: "Avance septentrional"
 AST_northern_advancement_desc: "Aunque Australia preferiría ocuparse de sus propios asuntos políticos, no podemos contar con que nos dejen en paz si no nos convertimos en una amenaza. [INS.GetNameDefCap] es una nación como la nuestra: son una víctima de intrusos europeos que no se marchan. Al reclamar nosotros el territorio, mandamos una señal clara: es mejor dejar en paz a las naciones del Pacífico."
 AST_soothing_australian_fears: "Apaciguar los miedos de Australia"
 AST_soothing_australian_fears_desc: "Aunque algunos funcionarios creen en la posibilidad de la cooperación entre Australia y Japón, la ciudadanía australiana no. Tras temer tanto tiempo una invasión japonesa, la idea de cooperar con el mismo posible agresor resulta difícil de aceptar para la mayoría. Y así apaciguaremos sus miedos: preparándonos para la guerra."
 AST_soothing_australian_fears_tt: "\nTras §Y180§! días:"
 AST_dividing_the_pacific: "División del Pacífico"
 AST_dividing_the_pacific_desc: "El movimiento Australia First defiende la paz con [JAP.GetNameDef], definiendo la nación como posible aliado del Pacífico más que como una continua amenaza inminente, al contrario que muchos ciudadanos australianos. A medida que el poder de [AST.GetName] se amplía, es razonable que [JAP.GetName] también lo vea así y que se zanjen los posibles conflictos entre nuestras dos naciones antes de que tengan la oportunidad de estallar."
 AST_dividing_the_pacific_ast_gain_tt: "[GET_AST_DIVIDING_THE_PACIFIC_AST_GAIN]"
 AST_dividing_the_pacific_jap_gain_tt: "[GET_AST_DIVIDING_THE_PACIFIC_JAP_GAIN]"
 AST_dividing_the_pacific_tt1: "§GGanamos§!:"
 AST_dividing_the_pacific_tt2: "§RGanan§!:"
 AST_dividing_the_pacific_tt3: "§Y[AST.GetName]§! transfiere los siguientes territorios controlados:"
 AST_against_war_and_fascism: "Contra la guerra y el fascismo"
 AST_against_war_and_fascism_desc: "El Movimiento contra la Guerra y el Fascismo es la rama australiana de una iniciativa internacional patrocinada por la Comintern para movilizar a los trabajadores contra las fuerzas reaccionarias. Aunque ha perdido empuje en los últimos años, nos corresponde a nosotros continuar su labor una vez más."
 AST_world_peace: "Paz mundial"
 AST_world_peace_desc: "El Movimiento contra la Guerra y el Fascismo ha estado esforzándose en producir una revista llamada \"Paz mundial\" que expone las maldades del movimiento fascista en Alemania, Italia y especialmente durante la Guerra Civil Española. Espoleados por los artículos publicados en ella, hay voluntarios ansiosos por unirse a la lucha contra el fascismo."
 AST_red_fred: "Fred el rojo"
 AST_red_fred_desc: "Fred Paterson, \"el rojo\", se hizo conocido dentro del movimiento comunista como candidato a la alcaldía de Brisbane en 1934, donde sufrió una estrepitosa derrota. Pero sus ambiciones se han mantenido intactas y ahora se presenta a las elecciones para ser concejal en Townsville. Con nuestro apoyo, podría convertirse en el primer comunista elegido para un cargo público."
 AST_workers_defence_corps_sparks_anew: "El Comité de Defensa de los Trabajadores recupera su esplendor"
 AST_workers_defence_corps_sparks_anew_desc: "El Comité de Defensa de los Trabajadores se formó originalmente para defender los piquetes y las huelgas. Ante la creciente agresividad de grupos como la Nueva Guardia, se ha reagrupado para volver a servir de escudo a aquellos que protestan para conseguir mejores derechos y oportunidades."
 AST_a_controversial_recruitment: "Un reclutamiento polémico"
 AST_a_controversial_recruitment_desc: "Maurice Blackburn es un conocido abogado socialista, famoso por defender los derechos de los trabajadores en batallas legales contra jefes opresores. Como miembro del Partido Laborista, su lealtad ha sido puesta en entredicho debido a sus vínculos con el Movimiento contra la Guerra y el Fascismo, más radical."
 AST_from_picket_line_to_front_line: "De los piquetes al frente"
 AST_from_picket_line_to_front_line_desc: "Al ir volviéndose más agresivas las tácticas de intimidación de los que se oponen a la liberación de la clase trabajadora, nuestras defensas deben evolucionar en respuesta. Con cada incidente, los trabajadores se muestran más decididos, y cada vez son más los que se presentan voluntarios para unirse al Comité de Defensa."
 AST_pig_iron_protests: "Protestas del arrabio"
 AST_pig_iron_protests_desc: "En muchas ocasiones, nuestros estibadores no están de acuerdo con el gobierno, sobre todo en lo que se refiere a la venta de arrabio a países en guerra. Los australianos no tienen interés alguno en involucrarse en conflictos ni en transportar equipamiento que se usará contra civiles inocentes, al igual que [AST.GetName], que, por ende, procederá a convocar una huelga."
 AST_part_with_colonizer: "Separarse del colonizador"
 AST_part_with_colonizer_desc: "La raíz de nuestros problemas está en el Imperio británico y el sistema capitalista que impuso desde la distancia. Eso se acabó. Con Gran Bretaña distraída por crisis más cercanas, es el momento de tomar el control de nuestro destino y trazar nuestro propio rumbo como una nación libre e independiente."
 AST_take_it_to_the_streets: "Tomar las calles"
 AST_take_it_to_the_streets_desc: "La acción sindical es una de las herramientas más poderosas con las que contamos para forzar un cambio en la sociedad, y debemos esgrimirla contra un sistema diseñado únicamente para explotar. Ahora es el momento de recuperar los medios de producción. ¡Obreros de Australia, uníos!"
 AST_workers_educational_association: "Asociación Educativa de Trabajadores"
 AST_workers_educational_association_desc: "La Asociación Educativa de Trabajadores es una organización internacional dedicada a hacer accesible la educación a la gente trabajadora. Deberíamos establecer nuestra propia filial, pues la auténtica igualdad de oportunidades comienza en el aula."
 AST_off_leash: "Sin collar"
 AST_off_leash_desc: "Los estibadores conforman la columna vertebral de la acción sindical en Australia. Al ser una isla del tamaño de un continente, no es de extrañar que la mano de obra naval desempeñe un papel tan vital en nuestra economía. Es hora de quitarles el collar y dejar sueltos a los lobos de mar de la industria."
 AST_a_national_housing_commission: "Una comisión de vivienda pública"
 AST_a_national_housing_commission_desc: "La vivienda es un asunto polémico desde hace mucho. Todo el mundo merece un techo bajo el que cobijarse, pero esta necesidad básica se usa en detrimento de los trabajadores demasiado a menudo, y su coste es una forma de opresión económica. Ya no será así. Exigiremos un acceso justo a la vivienda para todos."
 AST_guaranteed_employment: "Empleo garantizado"
 AST_guaranteed_employment_desc: "Con demasiada frecuencia se tacha al socialismo de perezoso o clientelista para con las personas necesitadas. Eso debe acabar. Solo buscamos oportunidades válidas de trabajo y un salario justo con el que mantener a nuestras familias."
 AST_equal_pay: "Igualdad salarial"
 AST_equal_pay_desc: "La idea de que quienes poseen los medios de producción merecen más que quienes trabajan en ellos es una falacia pertinaz. Los propietarios y los directivos no trabajan más, ni están intrínsecamente más cualificados. Al igualar los salarios, los frutos del trabajo pueden repartirse más equitativamente entre toda la sociedad."
 AST_all_for_one_one_for_all: "Todos para uno y uno para todos"
 AST_all_for_one_one_for_all_desc: "\"Todo para uno, y más para mí\" ha sido durante mucho tiempo el grito de guerra de la burguesía, cuya codicia exige cada vez más mientras devuelve cada vez menos. La promesa de que la riqueza fluirá hacia abajo es mentira. Lo generado por todos debe repartirse por igual para todos."
 AST_abolition_of_private_property: "Abolición de la propiedad privada"
 AST_abolition_of_private_property_desc: "Es la sangre de los trabajadores la que engrasa la maquinaria de la industria. Hay que acabar con la brutalidad de la acumulación y abolir por completo la propiedad privada. Todo será compartido, cada uno aportará según su capacidad y a cada uno se le dará según su necesidad."
 AST_centralized_production: "Producción centralizada"
 AST_centralized_production_desc: "Las fuerzas del mercado son caóticas y desiguales. Si queremos construir una sociedad verdaderamente justa, el Estado debe asumir el papel central a la hora de decidir qué se produce, quién lo produce y dónde. Nuestra burocracia mantiene registros meticulosos y es la más apta para fijar las cuotas de producción."
 AST_public_institutions: "Instituciones públicas"
 AST_public_institutions_desc: "La sociedad necesita numerosos servicios esenciales para funcionar; desde la sanidad y la vivienda hasta el cuidado infantil y el transporte. El Estado debe proporcionarlos de manera universal y garantizar el acceso a todos sin restricciones. Liberados del imperativo de generar beneficios privados, estos sistemas actuarán de modo eficiente para atender las necesidades de toda la población."
 AST_planned_extraction: "Extracción planificada"
 AST_planned_extraction_desc: "Tenemos la suerte de poseer una tierra rica en recursos. Hemos de asegurarnos de que se extraen de manera sistemática y se destinan a las industrias que más los necesitan."
 AST_maritime_commission: "$USA_maritime_commission$"
 AST_maritime_commission_desc: "$USA_maritime_commission_desc$"
 AST_state_research_funding: "Financiación de la investigación estatal"
 AST_state_research_funding_desc: "Para maximizar la eficacia de nuestras instituciones de investigación, el Estado debe actuar como su principal fuente de financiación; dirigirá los esfuerzos allí donde más se necesitan y garantizará que la información se controle estrictamente. Al fin y al cabo, no podemos arriesgarnos a que nuestros ciudadanos se vean perturbados por ideas equivocadas."
 AST_graziers_to_industry: "Ganaderos e industria"
 AST_graziers_to_industry_desc: "Durante la Gran Depresión, nuestras ciudades se vaciaron porque los trabajadores buscaban estabilidad en el campo. Ahora, con el control de los medios de producción, podemos atraerlos de nuevo a la industria. Debemos inculcarles la idea de lo que la nación necesita: los hornos de la industria deben alimentarse con el sudor del hombre."
 AST_free_school_policy: "Política de educación pública"
 AST_free_school_policy_desc: "Para dar forma al ciudadano modelo, debemos moldear sus ideas. Desde la cuna hasta la universidad, el Estado controlará lo que se enseñe a nuestros hijos. Así, nos aseguraremos de que las generaciones futuras comprendan la importancia del ideal socialista y los peligros del libre mercado... y del libre pensamiento."
 AST_free_healthcare_policy: "Política de salud pública"
 AST_free_healthcare_policy_desc: "Nuestro pueblo merece vivir libre de enfermedades y lesiones; y en caso de que ocurra lo peor, no debe verse doblegado por la desgracia, como ocurre en otras sociedades. Proporcionaremos acceso universal a la sanidad, los hospitales y el personal médico, porque un pueblo sano es un pueblo productivo."
 AST_the_publics_australia: "La Australia del pueblo"
 AST_the_publics_australia_desc: "Hemos dejado de lado el viejo orden y hemos construido una nación para muchos, no para unos pocos. La industria, el trabajo y los recursos están ahora al servicio del pueblo en su conjunto. Esta es la Australia del pueblo. Igualitaria, unida e inquebrantable."
 # 'Cominwealth' over 'Commonwealth' is intentional
 AST_the_australian_commonwealth: "La Mancomunidad australiana"
 AST_the_australian_commonwealth_desc: "Gran Bretaña encabezó en su día el liderazgo de la Mancomunidad, pero su visión se ha visto corrompida por los intereses capitalistas. Nosotros asumiremos ese papel y guiaremos a las naciones hacia una utopía socialista compartida."
 AST_union_control_commonwealth: "Desbloquea decisiones sobre el §YControl de los sindicatos§!.\nPermite la infiltración comunista en Nueva Zelanda, Malasia, Birmania y, en última instancia, India."
 AST_a_comrade_emancipated: "Un camarada emancipado"
 AST_a_comrade_emancipated_desc: "En el mundo entero, numerosas naciones siguen atadas por las cadenas del capitalismo, y a sus pueblos se les niega la verdadera libertad. Como Estado socialista libre, nuestro deber es contribuir a su emancipación. Trabajadores del mundo, uníos y juntos nos liberaremos de esas cadenas."
 AST_union_control_local: "Desbloquea decisiones sobre el §YControl de los sindicatos§!.\nPermite la infiltración comunista en Indonesia y Filipinas."
 AST_comintern: "Unirse a la Comintern"
 AST_comintern_desc: "Aunque a veces se ha apartado de los verdaderos principios marxistas, la Unión Soviética sigue siendo la abanderada de una internacional obrera. Uniéndonos a la Comintern, podemos aunar nuestros esfuerzos para llevar la antorcha del socialismo por todo el mundo."
 AST_comintern_tt: "Si §Y[AST.GetName]§! lidera una facción, pasará a formar parte de la Comintern. Si no, §Y[AST.GetName]§! se unirá a la Comintern sin nadie más."
 AST_for_greater_good: "Por un bien mayor"
 AST_for_greater_good_desc: "Nuestra visión de la revolución mundial exige sangre y sacrificio. La antorcha del socialismo flaquea en demasiados lugares; debemos responder a la llamada y enviar nuestro apoyo para asegurarnos de que no se apague. Al fin y al cabo, lo hacemos por un bien mayor (el bien mayor)."
 AST_make_common_cause: "Hacer causa común"
 AST_make_common_cause_desc: "Bajo nuestro liderazgo, la Mancomunidad ha empezado a prosperar, guiada por la luz del socialismo para salir de la oscuridad de la opresión capitalista. En este momento crítico, debemos asegurarnos de que no se quiebre nuestra voluntad y de que marchemos juntos hacia un mañana mejor."
 AST_the_red_pacific: "El Pacífico rojo"
 AST_the_red_pacific_desc: "El Pacífico debe rehacerse a imagen de la revolución. En todas las islas y costas de nuestra región, apoyaremos el ascenso de gobiernos socialistas y nos aseguraremos de que la bandera roja ondee en todas sus costas."
 AST_the_irish_anti-britain_pact: "El pacto antibritánico irlandés"
 AST_the_irish_anti-britain_pact_desc: "Gran Bretaña ha sido un bastión del capitalismo durante demasiado tiempo, protegida por su posición insular y su fuerza naval. Si generamos malestar entre los trabajadores portuarios de Irlanda e Irlanda del Norte, podemos quebrar sus defensas y abrir una ruta para nuestras fuerzas a través del mar de Irlanda."
 AST_stretch_the_fleet: "Extender la flota"
 AST_stretch_the_fleet_desc: "Gran Bretaña sigue siendo el baluarte del capitalismo, protegida por su poderosa flota. Ha llegado el momento de ampliar nuestras capacidades navales, plantarles cara y demostrar al mundo qué isla es más grande."
 AST_chinese_relations: "Relaciones chinas"
 AST_chinese_relations_desc: "Nuestros camaradas chinos luchan por su propia supervivencia. Tenemos los medios para ayudarlos, pero debemos actuar con rapidez antes de que se vean superados por las fuerzas imperialistas que se han desplegado contra ellos."
 AST_westward_battles: "Combates en el oeste"
 AST_westward_battles_desc: "Las fuerzas fascistas dominan Occidente y con ello amenazan el tejido mismo de nuestra supervivencia. Alineados ahora con la Comintern, debemos llevar la lucha hasta ellos y enfrentarnos a quienes quieren destruir la utopía obrera que estamos construyendo."
 AST_strongholds: "Baluartes"
 AST_strongholds_desc: "Para asegurar nuestra posición en este nuevo escenario, debemos apoyar a nuestros camaradas irlandeses contra el corazón imperial del capitalismo. Su lucha de antaño por la independencia nos ofrece valiosas lecciones mientras nos preparamos juntos para la siguiente etapa del conflicto mundial."
 AST_out_of_the_den: "Fuera de la guarida"
 AST_out_of_the_den_desc: "Muchos irlandeses siguen sintiendo un profundo resentimiento hacia el dominio británico. Es hora de mostrar nuestra fuerza y sacarlos de las sombras para unirlos a nuestra causa contra un enemigo común."
 AST_end_the_kingdom: "Acabar con el reino"
 AST_end_the_kingdom_desc: "Ha llegado el momento. La raíz del capitalismo imperialista recibirá una puñalada en su corazón podrido. La liberación de los trabajadores de todo el Imperio británico está cerca. Acabad con la monarquía. Acabad con el reino. Acabad con la opresión. Trabajadores de la Mancomunidad, ¡uníos!"
 AST_red_solidarity: "Solidaridad roja"
 AST_red_solidarity_desc: "La lucha en China continúa, mientras millones de personas sufren y mueren. Su lucha es nuestra lucha, y no podemos quedarnos de brazos cruzados. Podemos intervenir, ayudarlos con su carga y asegurarnos de que la llama de la revolución no decaiga."
 AST_red_solidarity_tt: "§Y[AST.GetName]§! se posiciona del lado de §Y[PRC.GetNameDef]§! en la guerra contra §Y[CHI.GetNameDef]§!. La facción de menor tamaño absorbe a la otra o §Y[AST.GetName]§! se une a la guerra si ya existe una alianza entre ellas."
 AST_free_the_colonies: "Liberar las colonias"
 AST_free_the_colonies_desc: "El fuego de la revolución hace arder el ruinoso Imperio británico. Las colonias ya no serán colonias, sino naciones libres. ¡Levantaos, camaradas! ¡Despojaos de vuestros grilletes y uníos a la revolución!"
 AST_free_the_colonies_tt: "§Y[AST.GetName]§! degrada a títeres integrados a todas las colonias británicas que controla."
 AST_battle_of_the_ocean: "Batalla del océano"
 AST_battle_of_the_ocean_desc: "Los océanos han sido durante mucho tiempo las arterias del comercio mundial. Ahora ha llegado el momento de llevar la lucha al Pacífico y cercenar el sistema que sustenta. Las aguas se teñirán de rojo con la sangre tanto de los capitalistas corruptos como de los héroes de la revolución."
 AST_borderless_solidarity: "Solidaridad sin fronteras"
 AST_borderless_solidarity_desc: "Solidaridad. Esa es la palabra que une a los trabajadores del mundo. Ninguna frontera puede dividirnos, ninguna nación puede sostenerse sola. Allá donde arda la revolución, responderemos a la llamada y nos mantendremos unidos en la lucha mundial por la liberación."
 AST_an_equal_union: "Una unión igualitaria"
 AST_an_equal_union_desc: "Aunque portamos el estandarte de la revolución, todos los que se unen a nosotros son iguales. En esta unión, los recursos, el trabajo y las ideas se comparten con libertad; eso forjará un futuro en el que la prosperidad sea colectiva y ninguna nación esté por encima de otra."
 AST_expanding_influence: "Ampliar la influencia"
 AST_expanding_influence_desc: "Estamos en el lado correcto de la historia, así que nuestras ideas hablan por sí solas. La promesa de un paraíso de los trabajadores no es un sueño, sino una realidad en ciernes. Podemos difundir esta visión e invitar a otros a unirse a nosotros para construir un futuro común."
 AST_public_works: "Obras públicas"
 AST_public_works_desc: "La Gran Depresión ha dejado temblando la economía australiana. Iniciaremos una serie de programas de obras públicas para que la gente vuelva a trabajar y se conviertan de nuevo en consumidores."
 AST_lang_plan: "Plan de Lang"
 AST_lang_plan_desc: "Jack Lang se ha puesto al frente de la política económica con su notorio rechazo a pagar la deuda externa, redirigiendo esos fondos a iniciativas públicas dirigidas a estimular el crecimiento nacional. Después de todo, no se puede sacar de donde no hay."
 AST_exports_for_economic_recovery: "Exportaciones para la recuperación económica"
 AST_exports_for_economic_recovery_desc: "Los que se oponen a las ideas de Lang proponen aprovechar la deuda y los mercados externos para fomentar las ventas y las inversiones en el extranjero, comprometiéndose con una economía orientada a las exportaciones para reforzar la producción nacional, el empleo y finalmente el consumo."
 AST_the_phosphate_commision: "La Comisión del Fosfato"
 AST_the_phosphate_commision_desc: "Tras la Gran Guerra, Nauru quedó bajo la administración fiduciaria conjunta de Australia, Nueva Zelanda y el Reino Unido. En 1919, los derechos de todas las ventas de los fosfatos de la isla se transfirieron a estos miembros, liderados por Australia. Gracias a nuestra posición de liderazgo, podemos influir en los precios y hacernos con tarifas muy competitivas para nuestro mercado nacional."
 AST_goods_standard: "Patrón mercancía"
 AST_goods_standard_desc: "Un precepto esencial de la teoría económica de Jack Lang es la abolición del patrón oro en Australia para sustituirlo por un patrón mercancía que vincula el suministro de dinero a la cantidad real de bienes producidos. Esto garantiza que el flujo de capital esté vinculado directamente a la productividad nacional y no a factores externos."
 AST_standard_gauge_line_to_darwin: "Línea de ancho internacional hasta Darwin"
 AST_standard_gauge_line_to_darwin_desc: "Hace demasiado tiempo que nos faltan conexiones adecuadas para nuestros territorios del norte. Como parte de nuestro programa más amplio de obras públicas con vistas a reencauzar el dinero a la economía, podemos construir un ferrocarril que conecte nuestras ciudades del sur con el norte."
 AST_lang_is_right: "Lang lleva razón"
 AST_lang_is_right_desc: "¡Resulta que Lang tenía razón! Al negarnos a priorizar a los acreedores extranjeros y hacer un uso más agresivo de nuestro propio sistema bancario, podemos liberar una cantidad significativa de fondos que pueden dirigirse a la economía nacional, proporcionando una inversión que hacía mucha falta y estimulando el crecimiento."
 AST_within_reach: "Dentro del alcance"
 AST_within_reach_desc: "Tan cerca, y a la vez tan lejos. Australia es una nación rica en recursos, y si excavamos un poco más, encontraremos incontables riquezas bajo nuestros pies. Con la expansión de nuestra infraestructura, hasta las minas remotas se han convertido en accesibles y estamos a las puertas de una era de prosperidad australiana basada en la riqueza mineral."
 AST_a_domestic_supply_chain: "Una cadena de suministros nacional"
 AST_a_domestic_supply_chain_desc: "Un efecto secundario de centrarnos en la economía nacional es el desarrollo de un sistema de producción con un aguante extraordinario. Al haber ubicado en casa todos los niveles de la producción, estamos aislados de las conmociones externas."
 AST_broken_hill_propietary_company: "Compañía Broken Hill Proprietary"
 AST_broken_hill_propietary_company_desc: "Broken Hill Proprietary es una de las principales compañías mineras y de producción de acero de Australia y por eso se la conoce como \"La Gran Australiana\". Debido al drástico aumento de la demanda de materias primas, la compañía, que domina el sector, está bien posicionada para crecer con aún más rapidez."
 AST_radium_hill: "Radium Hill"
 AST_radium_hill_desc: "Se ha descubierto uranio en el sur de Australia, y la mina de Radium Hill tiene un potencial considerable para la expansión. Mientras seguimos descubriendo todas las posibilidades de estas tecnologías emergentes, está claro que nos encontramos en el umbral de la era atómica, y esta podría ser nuestra entrada en ella."
 AST_industrial_expansion: "Expansión industrial"
 AST_industrial_expansion_desc: "La Gran Depresión ha paralizado el rendimiento económico de nuestra nación durante gran parte de la pasada década. Ahora que tenemos la voluntad política para actuar de forma más directa, deberíamos canalizarla para realizar una gran expansión de nuestra base industrial, creando puestos de trabajo, aumentando la demanda de recursos y produciendo más bienes para el mercado."
 AST_income_tax_assessment_act: "Ley de evaluación del impuesto sobre la renta"
 AST_income_tax_assessment_act_desc: "Nuestro sistema de recaudación se encuentra en un estado lamentable y es difícil de transitar para el pueblo, requiriendo más inspecciones del gobierno de las que podemos permitirnos. Al revisar y simplificar las medidas pertinentes, podemos hacer que la recaudación de impuestos sea significativamente más eficiente."
 AST_council_for_scientific_and_industrial_research: "Consejo de investigación científica e industrial"
 AST_council_for_scientific_and_industrial_research_desc: "El Consejo de investigación científica e industrial se reforzó tras la Conferencia Imperial de 1923 para ayudar a expandir la base económica de las distintas colonias y dominios. Aunque sus contribuciones han sido significativas, es hora de dar a este organismo un nuevo objetivo: el desarrollo de la fabricación y las industrias secundarias."
 AST_bring_home_the_farmers: "Reintegrar a los agricultores"
 AST_bring_home_the_farmers_desc: "Durante la Gran Depresión, nuestras ciudades principales se encontraban seriamente despobladas, pues los trabajadores se habían ido al campo en busca de trabajo agrícola. Ahora que las condiciones comienzan a mejorar, deberíamos incentivar el retorno de nuestra fuerza laboral para que podamos volver a poner en marcha las fábricas y reanudar la producción."
 AST_reverse_wage_cuts: "Revocar los recortes salariales"
 AST_reverse_wage_cuts_desc: "Para que los negocios tengan alguna oportunidad, hemos implementado una serie de recortes de salarios en toda la economía. Ahora que vemos señales de recuperación, deberíamos dar marcha atrás. La subida de salarios lleva a una mayor capacidad de gasto, ayudando a impulsar el consumo y el crecimiento económico."
 AST_the_manpower_directorate: "Junta Directiva de Mano de Obra"
 AST_the_manpower_directorate_desc: "Al volverse cada vez más compleja nuestra economía, nos enfrentamos a carencias crecientes de mano de obra. Esta junta directiva garantizará que la gente apropiada ocupe los puestos pertinentes con las habilidades que correspondan en el momento adecuado."
 AST_recovery: "Recuperación"
 AST_recovery_desc: "Por primera vez, nuestro producto interior bruto ha sobrepasado los niveles anteriores a la Gran Depresión. Es un momento de celebración, pues la única trayectoria para nuestra economía ahora es ascendente. Entramos en un periodo de fuerte crecimiento y es hora de cosechar las recompensas de nuestra renovada prosperidad."
 AST_devalued_currency: "Divisa devaluada"
 AST_devalued_currency_desc: "Uno de los modos más efectivos de aumentar las exportaciones es tener una divisa más débil. Si los compradores extranjeros pueden comprar más de nuestros bienes porque su dinero tiene mayor valor, nos volvemos más competitivos a nivel internacional. Ahora bien, se trata de un arma de doble filo, pues las importaciones de otras naciones también se volverán más caras."
 AST_reverse_industry_tariffs: "Revocar los aranceles industriales"
 AST_reverse_industry_tariffs_desc: "En el pasado, hemos usado los aranceles para proteger nuestras industrias nacionales de la competencia extranjera. Sin embargo, esto ha llevado a guerras comerciales y aranceles de represalia contra nuestras exportaciones, aumentando así los precios. Deberíamos reducir estas barreras y fomentar los descuentos de manera recíproca para ayudar a expandir el comercio."
 AST_foreign_competition: "Competición extranjera"
 AST_foreign_competition_desc: "La competencia es buena para los negocios; fomenta la innovación y la eficacia, a la vez que evita el exceso de confianza. Se trata de un mundo despiadado, así que hay que tener menos piedad que nadie y liberarnos para competir con total libertad."
 AST_expanding_into_new_markets: "Abrirse a nuevos mercados"
 AST_expanding_into_new_markets_desc: "La ventaja de depender de mercados extranjeros por encima del mercado nacional es sencilla. El mercado global es inmenso. Siempre habrá nuevos mercados en los que internarse; solo tenemos que centrarnos y demostrar la superioridad de los productos y las prácticas empresariales de Australia."
 AST_populate_or_perish: "Poblar o perecer"
 AST_populate_or_perish_desc: "Cuando sobrevino la Gran Depresión, las tasas de natalidad descendieron con rapidez, y desde entonces pugnan por recuperarse. Con el propósito de continuar nuestro desarrollo interno, estableceremos un Departamento federal de Inmigración que dirija y supervise un nuevo programa a tal efecto."
 AST_recruitment_drive: "Campaña de reclutamiento"
 AST_recruitment_drive_desc: "La escasa voluntad de los gobiernos anteriores, así como su excesiva dependencia de Gran Bretaña, han dado lugar a un largo periodo de abandono de las fuerzas armadas australianas. Esto dejará de ser así, ya que lanzaremos una campaña con la que impulsar el reclutamiento para las Fuerzas de Defensa Australianas."
 AST_new_deal: "Nuevo trato"
 AST_new_deal_desc: "La protesta que tuvo lugar durante el sesquicentenario de [AST.GetName] puso de manifiesto que hemos de reconsiderar nuestras leyes relativas a los ciudadanos indígenas. A petición de los activistas por los derechos de los aborígenes, nos reuniremos con ellos para acordar juntos un camino hacia la plena ciudadanía de los pueblos indígenas."
 AST_the_1938_sesquicentenary_flag: "Ha tenido lugar el evento §YEl Sesquicentenario de 1938§!."
 AST_the_1938_sesquicentenary_tt: "El enfoque \"§YNuevo trato§!\" en la rama §YPoblar o perecer§! pasa a estar disponible."
 AST_repeal_immigration_restrictions: "Derogar las restricciones a la inmigración"
 AST_repeal_immigration_restrictions_desc: "El Departamento de Inmigración se ve limitado por unas leyes obsoletas que establecen a quién se permite migrar a [AST.GetName]. A pesar del riesgo de generar polémica, derogaremos esas leyes y estableceremos en su lugar un sistema de cuotas con el que controlar el flujo de inmigrantes."
 AST_womens_armed_services: "Servicio militar femenino"
 AST_womens_armed_services_desc: "A pesar de la feroz oposición, se procederá a la creación del servicio militar femenino. Toda mano amiga será bienvenida para defender [AST.GetName] de sus agresores, con independencia de su sexo. Para fomentar el reclutamiento y el entrenamiento, la elección de los directores de estas fuerzas es de suma importancia."
 AST_northern_territory_reconnaissance_unit: "Unidad de reconocimiento del territorio del norte"
 AST_northern_territory_reconnaissance_unit_desc: "El teniente de vuelo y antropólogo Donald Thomson ha venido abogando por la inclusión de la población aborigen en el servicio militar de [AST.GetName], y por fin se le hará caso. Encargaremos personalmente a Thomson la creación de una unidad de reconocimiento formada por hombres con conocimientos de la región y habilidades para la vida en el monte que vigilen incluso nuestras tierras más remotas e inhóspitas."
 AST_northern_territory_reconnaissance_unit_tt: "Desbloquea la compañía de apoyo §YUnidad de reconocimiento del territorio del norte§!."
 AST_torres_strait_battalion: "Batallón del estrecho de Torres"
 AST_torres_strait_battalion_desc: "El desempeño de la Compañía del estrecho de Torres como guarnición se ha gestionado bien, pero sus hombres tienen potencial para alcanzar otros objetivos. Al ser sus integrantes originarios de las islas de la costa norte de [AST.GetName], la unidad posee un amplio conocimiento del estrecho de Torres. Formaremos a sus hombres como infantes de marina y pediremos más voluntarios para formar un batallón."
 AST_department_of_aboriginal_affairs: "Departamento de Asuntos Aborígenes"
 AST_department_of_aboriginal_affairs_desc: "Pondremos en práctica la sugerencia de los grupos de activistas por los derechos de los aborígenes y crearemos un nuevo Departamento de Asuntos Aborígenes. Lo asesorará un comité de ascendencia aborigen, cuyo objetivo será garantizar el acceso de la población indígena a una alimentación y una asistencia médica adecuadas."
 AST_immediate_rights: "Derechos inmediatos"
 AST_immediate_rights_desc: "La federación no regulará a ningún grupo de población dentro de [AST.GetName], y ninguna ascendencia restringirá la concesión de derechos civiles. Al establecer nuestra propia ley de ciudadanía y alejarnos de la noción de que nuestra población está formada únicamente por súbditos británicos, los derechos australianos dejarán de tener un carácter condicional."
 AST_diverse_army: "Ejército diverso"
 AST_diverse_army_desc: "El acto de defender la patria no es solo un privilegio, sino un derecho. Todo australiano que lo desee debe poder alistarse, y todo soldado ambicioso debe poder ascender."
