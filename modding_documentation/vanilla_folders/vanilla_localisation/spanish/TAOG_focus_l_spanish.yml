 AST_natunity_desc: "§YGobierno de unidad nacional§!\n§LEn momentos de crisis, las pequeñas desavenencias acaban desembocando en grandes guerras. Las naciones que nos rodean se enfrentan a un conflicto tras otro y, pese a que los problemas internos urgen, esa urgencia se desvanece cuando la amenaza de muerte se vuelve inminente. Los partidos democráticos de [AST.GetName] han de dejar al margen sus diferencias y aunar fuerzas para enfrentarse al mundo.§!"
