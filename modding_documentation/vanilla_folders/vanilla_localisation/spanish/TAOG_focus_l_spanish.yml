l_spanish:
 INS_nationalize_companies_tt: "Todas las organizaciones industriales militares y las compañías industriales se nacionalizarán y serán rebautizadas."
 available_focus_tt: "Enfoque(s) §Gdisponible(s)§!:\n"
 INS_is_union_tt: "Se ha creado la Unión Neerlando-Indonesia"
 INS_is_union_tt_NOT: "No se ha creado la Unión Neerlando-Indonesia"
 INS_denounce_soetardjo: "Denunciar a Soetardjo"
 INS_denounce_soetardjo_tt: "Comenzaremos a orquestar una revolución clandestina, infiltrándonos en el gobierno y creando células de guerrilla por todo el archipiélago. Cuando estemos lo bastante preparados, iniciaremos una guerra de guerrillas independentista contra los neerlandeses."
 INS_soetardjo_petition_debate_done_tt: "El debate del Volksraad sobre la petición de autonomía de Soetardjo ha terminado."
 INS_tkr_tt: "Modifica §YEl ejército del pueblo§! en:"
 INS_commander_sudirman_tt: "§YSudirman§! ([INS.GetFlag]) asciende a §Ymariscal de campo§!."
 INS_the_declaration_of_independence: "La Declaración de Independencia"
 INS_the_declaration_of_independence_desc: "No podemos arriesgarnos a esperar más, ¡debemos atacar mientras tengamos la iniciativa! Debemos enviar a nuestras milicias a tomar el control de puertos, ciudades y centros industriales lo bastante rápido como para que las autoridades neerlandesas no tengan tiempo de reaccionar. Después declararemos la independencia y proclamaremos la República de Indonesia."
 INS_the_declaration_of_independence_tt: "Declararemos la §Yindependencia§!. Todos los estados en los que hayamos establecido una §Ybase de la milicia§! o §Ycuartel general§! estarán bajo nuestro control, y el resto seguirá del lado de [HOL.GetNameDef].\n\n[HOL.GetNameDefCap] no reconocerá nuestra soberanía y comenzará un conflicto de baja intensidad. Esto podría escalar hasta convertirse en una §Rguerra§!.\n\nDesbloquea incursiones terrestres para conquistar estados."
 INSHOL_the_declaration_of_independence: "La revolución nacional"
 INS_laskar_rakjat: "Laskar Rakyat"
 INS_laskar_rakjat_desc: "La revolución está formada por muchas milicias diferentes en toda Indonesia, algunas grandes y otras pequeñas. Organizar las milicias es un paso necesario para alcanzar la victoria. Sin embargo, no debemos precipitarnos, ya que dar poder a las milicias vinculadas a nuestros rivales políticos podría suponer una catástrofe."
 INS_militia_tt: "Crea una nueva plantilla de división de milicia §YLuchador por la libertad§! y desbloquea decisiones para gestionarla."
 INS_militia_warning_tt: "Las milicias son grupos §Ysemiautónomos§! de revolucionarios. Lucharán por nosotros, pero su ayuda no es altruista. Esperan recibir una compensación por su esfuerzo. §RLa estabilidad se verá afectada de manera drástica si no se satisfacen sus demandas§!."
 INS_usa_tanks_opinion_mod: "Ha comprado nuestros tanques"
 INS_republic_add_generals_tt: "(§Y$INS_sudirman$§!([INS.GetFlag]), §Y$INS_soengkono$§!([INS.GetFlag]), §Y$INS_supriyadi$§!([INS.GetFlag]), §Y$INS_djatikoesoemo$§!([INS.GetFlag]), §Y$INS_maludin_simbolan$§!([INS.GetFlag])) se convierte en general."
 INS_big_militia_presence_tt: "Nuestras milicias tendrán el control tras declarar la independencia."
 INS_prepare_raiding_bases: "Preparar bases de asalto"
 INS_prepare_raiding_bases_desc: "Utilizaremos nuestra red de espías para establecer búnkeres por todo el archipiélago en secreto, garantizando que estemos preparados para atacar en cuanto comience la revolución."
 # <Joint Tree - Central Milestones>
 INSHOL_dutch_east_indies: "Indias Orientales Neerlandesas"
 INSHOL_dutch_east_indies_desc: "La colonia se fundó hace casi 500 años y desde entonces ha adoptado muchas formas. El mundo cambia rápidamente, y nuestras acciones de hoy dictarán el futuro de las relaciones entre Holanda e Indonesia."
 INSHOL_the_war_in_europe: "La guerra en Europa"
 INSHOL_the_war_in_europe_desc: "El conflicto en Europa se agrava con rapidez, y Holanda está ahora en guerra. Ya no podemos confiar en que nos protejan y debemos mantenernos firmes, pues, de lo contrario, corremos el riesgo de que las potencias extranjeras nos superen."
 # <Joint Tree - Military Equipment Contracts>
 INSHOL_military_equipment_contracts: "Contratos de equipo militar"
 INSHOL_military_equipment_contracts_desc: "Las Indias Orientales son un vasto archipiélago con decenas de millones de ciudadanos. Estamos lejos de poseer la capacidad industrial necesaria para defendernos. Sin embargo, tenemos recursos suficientes para asegurar el comercio en todo el mundo. Nuestro problema puede resolverse si firmamos contratos con las democracias del mundo entero."
 INSHOL_hawk_75a7: "El Hawk 75A-7"
 INSHOL_hawk_75a7_desc: "El caza estadounidense Hawk 75A-7 es el avión perfecto para las Indias Orientales; es asequible y potente. Podemos llegar a un acuerdo con el fabricante para introducir las mejoras que tanto necesitan nuestras fuerzas aéreas."
 INSHOL_purchase_american_tanks: "Adquirir tanques estadounidenses"
 INSHOL_purchase_american_tanks_desc: "Aunque las Indias Orientales carecen de la industria necesaria para fabricar tanques, podemos comprárselos directamente a Estados Unidos, financiados por la industria del caucho de las Indias Orientales."
 INSHOL_purchase_british_artillery: "Adquirir artillería británica"
 INSHOL_purchase_british_artillery_desc: "Podemos externalizar la fabricación de nuestra artillería al Reino Unido; eso nos permite dar prioridad a otros equipos."
 INSHOL_produce_own_goods: "Producir nuestros propios productos"
 INSHOL_produce_own_goods_desc: "Aunque podemos conseguir muchos acuerdos comerciales lucrativos, no debemos olvidarnos de nuestras propias cadenas de producción y nuestras compañías industriales militares, a las que deberíamos subvencionar para que podamos llegar a ser menos dependientes de las importaciones extranjeras."
 # <Joint Tree - East Indies Investments>
 INSHOL_east_indies_investments: "Inversiones en las Indias Orientales"
 INSHOL_east_indies_investments_desc: "Una buena gobernanza conlleva invertir en el desarrollo de las colonias. Hacer inversiones para el desarrollo económico de las Indias Orientales nos beneficia a nosotros y a los ciudadanos de la colonia."
 INSHOL_east_indies_student_exchange: "Programa de intercambio de estudiantes de las Indias Orientales"
 INSHOL_east_indies_student_exchange_desc: "La creación de un sistema mediante el cual los indonesios puedan trasladarse a los Países Bajos para estudiar en nuestras universidades puede suponer un gran impulso para la economía, tanto de los Países Bajos como de las Indias Orientales."
 INSHOL_east_indies_fokker_division: "Formar una división de Fokker para las Indias Orientales"
 INSHOL_east_indies_fokker_division_desc: "Las fuerzas aéreas de las Indias Orientales han concedido una licencia a Fokker que hace que merezca la pena considerar la creación de una filial dedicada prioritariamente a las fuerzas aéreas de las Indias Orientales."
 INSHOL_expand_shell: "Ampliar las infraestructuras de Shell"
 INSHOL_expand_shell_desc: "Shell se está convirtiendo poco a poco en una parte cada vez más importante de nuestra economía. Está claro que debemos ampliar la infraestructura petrolera en las Indias Orientales para mantener el ritmo de las exportaciones de Shell."
 INSHOL_increase_funding_for_tix: "Aumentar la financiación para el proyecto del avión T.IX"
 INSHOL_increase_funding_for_tix_desc: "Los ingenieros de Fokker están desarrollando un nuevo bombardero bimotor para sustituir a los obsoletos modelos que venían usando las fuerzas aéreas de las Indias Orientales. Este proyecto tiene un presupuesto muy bajo y es probable que no se complete hasta dentro de mucho tiempo. Podemos aumentar su financiación para acelerar en gran medida su progreso."
 INSHOL_reduce_land_ownership_taxes: "Bajar los impuestos a la propiedad de la tierra"
 INSHOL_reduce_land_ownership_taxes_desc: "Deberíamos reducir los impuestos que gravan a los terratenientes indonesios; así, fomentaremos el desarrollo de granjas y empresas."
 INSHOL_coffee_plantations: "Plantaciones de café"
 INSHOL_coffee_plantations_desc: "Deberíamos centrarnos en obtener más tierras de propiedad estatal en las islas orientales. Podemos utilizar esas tierras para plantar cafetales."
 INSHOL_overallwagen: "Overvalwagen"
 INSHOL_overallwagen_desc: "Los tanques no son necesariamente la mejor alternativa para el ejército de las Indias Orientales. Carecemos de la fuerza industrial necesaria para producirlos y lo accidentado del terreno acota mucho su uso. Podríamos invertir en la construcción de vehículos blindados para Indonesia con los que suplir esa carencia."
 INSHOL_indonesian_cheap_labor: "Mano de obra barata indonesia"
 INSHOL_indonesian_cheap_labor_desc: "$CONGO_cheap_labor_desc$" #LL: stealing this to save time, hope you don't mind!
 INSHOL_eastern_development_fund: "Fondo de desarrollo para las islas orientales"
 INSHOL_eastern_development_fund_desc: "Nos centramos demasiado en las inversiones en Java y Sumatra e ignoramos la mayor parte del territorio de las colonias. Debemos comprometernos a desarrollar las infraestructuras orientales para que pueda darse la futura industrialización."
 INSHOL_increase_rubber_taxes: "Subir los impuestos al caucho"
 INSHOL_increase_rubber_taxes_desc: "Muchas empresas del caucho de las Indias Orientales están haciendo una fortuna gracias a los recursos de la colonia. Es justo que les impongamos un elevado impuesto."
 INSHOL_reform_knil: "Reformar el KNIL"
 INSHOL_reform_knil_desc: "Desde que las Indias Orientales completaron la conquista de todo el archipiélago, el Real Ejército de las Indias Orientales Neerlandesas ha quedado estancado y tiene una grave falta de financiación. Con el aumento de las tensiones en todo el mundo, debemos empezar a rearmar las Indias Orientales cuanto antes."
 INSHOL_fund_ml_knil: "Financiar al ML-KNIL"
 INSHOL_fund_ml_knil_desc: "Si queremos igualarnos al resto de los ejércitos del mundo, debemos construir unas fuerzas aéreas propias adecuadas. De lo contrario, estaremos en significativa desventaja."
 INSHOL_bandung_aircraft_facility_tt: "§YJava Occidental:§!\n    Añade §G1§! ranura de construcción y §G1§! §Yfábrica militar§! por cada enfoque requerido completado."
 INSHOL_rangers: "Rangers"
 INSHOL_rangers_desc: "Las Indias Orientales son un vasto archipiélago con un entorno diverso. Debemos entrenar a Rangers adaptados al combate en estos duros entornos para asegurarnos de que estamos preparados para defenderlos."
 INSHOL_mountaineers: "Montañeros"
 INSHOL_mountaineers_desc: "Debemos formar a montañeros preparados para luchar en el terreno hostil de nuestro archipiélago."
 INSHOL_elevate_elite_infantry: "Depot Speciale Troepen"
 INSHOL_elevate_elite_infantry_desc: "No podemos confiar eternamente en las estrategias de la Gran Guerra. Debemos adaptarnos a las nuevas tecnologías y asegurarnos de no quedarnos atrás. Deberíamos crear varias divisiones de infantería de élite preparadas para defender todo tipo de entornos."
 INSHOL_modernize_knil: "Modernizar el KNIL"
 INSHOL_modernize_knil_desc: "Estudiaremos nuevas estrategias y doctrinas para el ejército de las Indias Orientales. Nos aseguraremos de tener ventaja sobre el enemigo."
 INSHOL_transfer_of_henri_winkelman: "Traslado de Henri Winkelman"
 INSHOL_transfer_of_henri_winkelman_desc: "Henri Winkelman sirvió en el KNIL durante muchos años. Está claro que se le necesita de nuevo en las Indias Orientales, y deberíamos preparar su traslado oficial allí."
 INSHOL_eastern_conscription: "Controlar los cuerpos auxiliares"
 INSHOL_eastern_conscription_desc: "Hay varios cuerpos auxiliares indígenas en Java y Madura controlados por gobernantes locales. En estos tiempos difíciles, podríamos llegar a un acuerdo con ellos para que esas divisiones queden bajo nuestra autoridad."
 INSHOL_establish_vk_knil: "Fundar el VK-KNIL"
 INSHOL_establish_vk_knil_desc: "Fundaremos un Cuerpo Voluntario de Mujeres para el KNIL. Sus contribuciones jugarán un papel importante a la hora de mejorar la logística y las comunicaciones."
 INSHOL_emergency_dockyard_construction: "Construcción urgente de un astillero"
 INSHOL_emergency_dockyard_construction_desc: "No podemos tomarnos en vano la amenaza de una invasión por mar. Nuestra prioridad absoluta ha de ser la defensa naval."
 INSHOL_emergency_powers_gov_general: "Poderes de emergencia del gobernador general"
 INSHOL_emergency_powers_gov_general_desc: "La guerra actual exige que se tomen decisiones complicadas aprisa, cosa que no es posible si todas las decisiones de las Indias tienen que pasar primero por los Países Bajos. Hemos de otorgarle la autoridad de emergencia a [INS.GetLeader] para que actúe sin dilación."
 INSHOL_emergency_naval_purchases: "Compras navales de emergencia"
 INSHOL_emergency_naval_purchases_desc: "Nuestras costas no son seguras ni están bien defendidas. El tiempo apremia y, si no queremos perecer, hemos de contar con una armada más fuerte. Compraremos buques a las empresas privadas mediante deuda y los reacondicionaremos para convertirlos en destructores navales."
 INSHOL_east_indies_navy: "Armada de las Indias Orientales"
 INSHOL_east_indies_navy_desc: "[INS.GetNameDefCap] carece de armada oficial, lo que nos obligaba a defender la colonia. Ahora que las tensiones entre Europa y Asia van en aumento, esto ya no es viable. Hemos de dar un paso adelante y fundar una armada [INS.GetAdjective] propia, aunque eso conlleve una fuerte inversión económica."
 INSHOL_marines: "Infantes de marina"
 INSHOL_marines_desc: "Deberíamos crear un Cuerpo de infantes de marina de las Indias independiente, supeditado a la nueva Armada, y enviar a los nuevos infantes a entrenarse en los barcos holandeses."
 INSHOL_domestic_ship_production: "Producción interna de barcos"
 INSHOL_domestic_ship_production_desc: "Si queremos que nuestra armada pueda hacer frente a nuestros vecinos, debemos empezar a aumentar nuestra propia producción de barcos."
 INSHOL_destroyers: "Destructores"
 INSHOL_destroyers_desc: "Nuestros buques de guerra más pesados no pueden navegar por los estrechos del archipiélago sin escoltas que los protejan. Al construir destructores modernos, la Armada [ROOT.GetAdjective] podrá proteger sus rutas marítimas y repeler a las lanchas torpederas que surcan los estrechos."
 INSHOL_cruisers: "Cruceros"
 INSHOL_cruisers_desc: "Una flota sin acorazados debe basar su fuerza en los cruceros. La creación de una sólida escuadra de cruceros dará a la armada [ROOT.GetAdjective] un núcleo fuerte capaz de cubrir las largas distancias entre las islas en sus patrullas y hacer frente a cualquier incursión en nuestras aguas."
 INSHOL_submarines: "Submarinos"
 INSHOL_submarines_desc: "Los estrechos de las Indias Orientales son ideales para las emboscadas, y un submarino es mucho menos costoso que el buque de guerra al que envía al fondo del mar. Una flota submarina potente permite a la armada [ROOT.GetAdjective] controlar las rutas marítimas y atacar a la flota enemiga siempre desde el sigilo."
 INSHOL_outsourced_navy: "Producción externalizada a grandes empresas"
 INSHOL_outsourced_navy_desc: "Tal y como están las cosas, ya tenemos bastantes gastos; no podemos seguir destinando cada vez más fondos del presupuesto colonial a la armada. Podemos pagar a grandes empresas para que se encarguen de la producción por nosotros."
 INSHOL_divert_civilian_to_navy: "Destinar a la armada los fondos del ejército y los programas civiles"
 INSHOL_divert_civilian_to_navy_desc: "Tal y como está el mundo, el riesgo de una invasión naval es mayor que nunca. No podemos permitirnos ser austeros; debemos destinar fondos de todos los sectores del gobierno a la armada."
 INS_netherlands_can_remove_autonomy_tt_50: "\nSi [HOL.GetFlag]§Y[HOL.GetNameDefCap]§! completa primero su enfoque:\n    ([INS.GetFlag]§Y[INS.GetName]§!): Añade §Y£autonomy_texticon -50,00§!"
 INS_netherlands_can_remove_autonomy_tt_75: "\nSi [HOL.GetFlag]§Y[HOL.GetNameDefCap]§! completa primero su enfoque:\n    ([INS.GetFlag]§Y[INS.GetName]§!): Añade §Y£autonomy_texticon -75,00§!"
 INS_netherlands_can_remove_autonomy_tt_100: "\nSi [HOL.GetFlag]§Y[HOL.GetNameDefCap]§! completa primero su enfoque:\n    ([INS.GetFlag]§Y[INS.GetName]§!): Añade §Y£autonomy_texticon -100,00§!"
 INS_netherlands_can_remove_autonomy_tt_150: "\nSi [HOL.GetFlag]§Y[HOL.GetNameDefCap]§! completa primero su enfoque:\n    ([INS.GetFlag]§Y[INS.GetName]§!): Añade §Y£autonomy_texticon -150,00§!"
 INS_netherlands_can_remove_autonomy_tt_200: "\nSi [HOL.GetFlag]§Y[HOL.GetNameDefCap]§! completa primero su enfoque:\n    ([INS.GetFlag]§Y[INS.GetName]§!): Añade §Y£autonomy_texticon -200,00§!"
 INS_netherlands_can_remove_autonomy_tt_250: "\nSi [HOL.GetFlag]§Y[HOL.GetNameDefCap]§! completa primero su enfoque:\n    ([INS.GetFlag]§Y[INS.GetName]§!): Añade §Y£autonomy_texticon -250,00§!"
 INSHOL_begin_negotiations_soetardjo: "Iniciar negociaciones con Soetardjo"
 INSHOL_begin_negotiations_soetardjo_desc: "La petición de autonomía por parte de Soetardjo promete, pues nos brinda la oportunidad de que nacionalistas y lealistas lleguen a un acuerdo. Hemos de emprender negociaciones con su partido."
 INSHOL_urge_gov_veto: "Instar al veto del gobernador"
 INSHOL_urge_gov_veto_desc: "La Petición de Soetardjo es una treta nacionalista que el gobierno de las Indias se ha tragado. Hemos de instar al gobernador general a vetarla de inmediato o correremos el riesgo de perder nuestra colonia."
 INSHOL_eventual_autonomy: "Acordar una autonomía futura"
 INSHOL_eventual_autonomy_desc: "El deseo de Indonesia de conseguir la independencia es fuerte y no se disipará. Aceptaremos otorgarles la autonomía a las Indias, pero solo cuando hayan demostrado que son capaces de sustentarse por sí mismas y que seguirán defendiendo las ideas democráticas."
 INSHOL_autonomous_dominion: "La Ley de Soetardjo de [GetYear]"
 INSHOL_autonomous_dominion_desc: "A pesar de la irracional definición de \"autosuficiencia\" instaurada por los Países Bajos, la cual hemos de alcanzar para que los términos establecidos en la Petición de Soetardjo sean válidos, el deseo de Indonesia de ser un país independiente es tan fuerte que nos las hemos apañado para cumplir con estos requisitos. Tal y como estipula el acuerdo, declararemos nuestra independencia total y absoluta de la Corona neerlandesa."
 INS_cannot_become_independent_tt: "§W§Y[INS.GetFlag][INS.GetNameDefCap]§! no podrá §Rconseguir la independencia§! sin la intervención extranjera.§!"
 INSHOL_sideline_the_volksraad: "Marginar al Volksraad"
 INSHOL_sideline_the_volksraad_desc: "La Petición de Soetardjo es una clara violación del Artículo 1 de la Constitución Neerlandesa, y solo perjudicará a la administración de las Indias. Hay que vetarla."
 INSHOL_prioritize_dutch_profits: "Dar prioridad a los beneficios neerlandeses"
 INSHOL_prioritize_dutch_profits_desc: "Nos centraremos en aumentar los beneficios para la patria. La estabilidad económica repercute en el bienestar de todo el reino."
 INSHOL_development_loans_netherlands: "Préstamos para el desarrollo de parte de los Países Bajos"
 INSHOL_development_loans_netherlands_desc: "Podemos aceptar préstamos de las empresas neerlandesas para agilizar nuestra industrialización. Aunque nos escudemos en que somos una colonia en desarrollo para conseguir intereses bajos, tendremos que pagarlos."
 INSHOL_request_economic_dev_subsidy: "Solicitar subvenciones para el desarrollo económico"
 INSHOL_request_economic_dev_subsidy_desc: "Le hemos demostrado nuestro valor como colonia rentable a nuestro gobernante, argumento del que nos serviremos para negociar y conseguir subvenciones para el desarrollo industrial."
 INSHOL_loyalty_to_crown: "Lealtad a la Corona"
 INSHOL_loyalty_to_crown_desc: "Las Indias Orientales son muchas cosas, pero, sobre todo, leales a la colonia neerlandesa. La reina Guillermina nos llevará hasta la victoria. No podemos permitir que el nacionalismo acabe con casi 500 años de historia, y hemos de seguir reafirmando nuestra lealtad plena hacia la Corona."
 INS_loans_timer: "\nEn §Y365§! días:"
 INS_expand_batavia_med_school_tt: "§Y$INS_dutch_east_indies$§!: el modificador de velocidad de investigación es de al menos un §G1,00%§!."
 INS_subsidize_local_business: "Subvencionar los negocios locales"
 INS_subsidize_local_business_desc: "Debemos conceder subvenciones a los negocios locales para impulsar el crecimiento económico y fomentar nuestra economía a la larga."
 INSHOL_education_reforms: "Reformas de la educación"
 INSHOL_education_reforms_desc: "Muchos ciudadanos de las Indias Orientales no tienen acceso a la educación, y pocos han terminado la escuela secundaria. Si queremos que las Indias Orientales se conviertan en un estado industrializado y próspero, hemos de garantizar que la educación sea accesible para toda la población."
 INS_expand_batavia_med_school: "Ampliar la Escuela Médica de Batavia"
 INS_expand_batavia_med_school_desc: "Si ampliamos la Escuela Médica de Batavia mediante la construcción de nuevas instalaciones y contratamos a más profesores, la educación superior será mucho más accesible, cosa fundamental para nuestro crecimiento económico a largo plazo."
 INS_prepare_for_policy_shift: "Prepararse para un cambio de política"
 INS_prepare_for_policy_shift_desc: "El panorama político de las Indias ha sufrido las consecuencias del despertar nacional de las últimas décadas, y nuestras políticas se han quedado obsoletas. Deberíamos plantearnos hacer cambios en la estructura del gobierno."
 INS_reallocate_rubber_industry_funding: "Reasignar la financiación de la industria del caucho"
 INS_reallocate_rubber_industry_funding_desc: "Depender de las ventas del caucho ha perjudicado a nuestra economía. Debemos explotar nuestros recursos y abrir minas y fábricas por todo el archipiélago para diversificarla. No será barato, por lo que tendremos que reducir el presupuesto destinado a las plantaciones de caucho."
 INS_reallocate_rubber_industry_funding_tt: "Desbloquea una decisión para §Yeliminar el caucho de un estado§! y lo reemplaza por pequeñas cantidades de §Yotros recursos§!."
 INSHOL_nationalist_coallition: "Una coalición nacionalista"
 INSHOL_nationalist_coallition_desc: "El Volksraad lleva demasiado tiempo hablando de forma unilateral, y últimamente no se ha pronunciado. Ya hemos dejado atrás la época de las peticiones y la paciencia ante las demoras. Una coalición formada por miembros nacionalistas de la cámara dejará a un lado sus diferencias y exigirá la independencia de forma incondicional. Las voces más veteranas de la cámara, unos hombres a los que los neerlandeses no consideraban una amenaza, retomarán sus funciones."
 INSHOL_volksraad_compromises: "Compromisos del Volksraad"
 INSHOL_volksraad_compromises_desc: "La reforma de la cámara es lo que nos ha hecho avanzar, y no hay razón alguna para abandonar ahora ese camino. El Volksraad continuará desempeñando su labor de forma comedida, intercambiando concesiones con La Haya y mostrándose paciente por alcanzar la autonomía, en lugar de romper relaciones. Un futuro dentro de la Mancomunidad neerlandesa beneficia más que un futuro luchando por prosperar fuera de ella."
 INSHOL_establish_the_princely_council: "Fundar el Consejo de Principados"
 INSHOL_establish_the_princely_council_desc: "Los sultanes y rajás del archipiélago gozan de una lealtad que ninguna otra cámara de Batavia ha tenido jamás. Sus cortes son más antiguas que la Compañía y que la República que la sucedió. Contar con un consejo formal de principados les proporcionará a estos gobernantes un puesto de poder en esta nueva nación y vinculará su autoridad a la nuestra."
 INSHOL_nationalize_dutch_companies: "Nacionalizar las empresas neerlandesas"
 INSHOL_nationalize_dutch_companies_desc: "Si echamos la vista atrás, las grandes casas de comercio, las líneas de distribución, las empresas agrícolas y los bancos siempre han estado en manos de los neerlandeses, pero, a partir de ahora, dependerán de Indonesia. Restituiremos los consejos, retiraremos los carteles y estas islas por fin recuperarán el capital que se les ha estado arrebatando durante los últimos trescientos años."
 INSHOL_democracy: "Un Indonesia democrática"
 INSHOL_democracy_desc: "El Volksraad surgió como medida provisional, como un organismo asesor con competencias limitadas. Se creó para camuflar una falsa representación que no aportaba nada, pero ha ido un paso más allá. La cámara se convertirá en una asamblea legislativa cuyos miembros serán elegidos por el pueblo al que afirman representar y cuyas decisiones repercutirán en el gobierno que antes la controlaba."
 INSHOL_princely_authority: "Autoridad de principados"
 INSHOL_princely_authority_desc: "Siempre viene bien contar con un consejo de asesores, pero los sultanes que contribuyeron a la creación de esta nación aún pueden aportar más. El parlamento no se interpondrá en el camino de quienes quieran imponerse sobre los demás. Las antiguas cortes llevan mucho tiempo esperando a que se les vuelva a plantear esta cuestión."
 INSHOL_encourage_further_investment: "Fomentar más inversión"
 INSHOL_encourage_further_investment_desc: "De momento, gracias a los términos acordados en el Volksraad, la cuestión política queda resuelta, y el capital neerlandés ha tomado buena nota. Se bajarán los aranceles, se ampliarán las garantías, y las cámaras de comercio de Ámsterdam y Róterdam nos han asegurado que el archipiélago sigue dispuesto a comerciar. Lo que aportaba beneficios con el acuerdo anterior seguirá aportándolos con el nuevo."
 # <Joint Tree - ABDACOM>
 INSHOL_east_indies_artillery: "Fabricación de artillería de las Indias Orientales"
 INSHOL_east_indies_artillery_desc: "Abrir instalaciones de fabricación de artillería en Java nos permitirá depender menos del comercio exterior para fines militares."
 INSHOL_recall_gerardus_johannes_berenschot: "Convocar al general Berenschot"
 INSHOL_recall_gerardus_johannes_berenschot_desc: "Gerardus Johannes Berenschot es uno de los generales con más talento de la Mancomunidad. Se ha pasado la mayor parte de su vida en las Indias Orientales, pero ha vivido varios años en los Países Bajos. En estos tiempos tan difíciles, hemos de enviarlo a las Indias Orientales para que preste ayuda en la guerra."
 INSHOL_east_indies_cruiser_manufacturing: "Fabricación de cruceros de las Indias Orientales"
 INSHOL_east_indies_cruiser_manufacturing_desc: "Fabricar nuestros propios cruceros en lugar de encargárselos a los neerlandeses es el primer paso para contar con una armada de verdad, algo necesario dada la amenaza japonesa a la que nos enfrentamos."
 INSHOL_transfer_of_conrad_helfrich: "Enviar a Conrad Helfrich a las Indias"
 INSHOL_transfer_of_conrad_helfrich_desc: "Enviar al almirante Conrad Helfrich a las Indias mejorará en gran medida nuestra fuerza naval en el territorio."
 # <Joint Tree - Naval Program>
 INSHOL_naval_program: "Programa naval de los Países Bajos e Indonesia"
 INSHOL_naval_program_desc: "La armada de las Indias Orientales se encuentra muy por detrás de otras armadas, incluso de las coloniales. Colaborar en el desarrollo de esta nueva armada, con el fin de garantizar un progreso rápido, redunda en beneficio de todas las partes."
 INSHOL_naval_program_transfer_25_tt: "Transfiere el §Y25%§! de nuestras fuerzas navales a [INS.GetNameDef]."
 INSHOL_naval_program_transfer_25_2_tt: "§Y[HOL.GetFlag] [HOL.GetNameDefCap]§! traspasará el §Y25%§! de sus fuerzas navales a §Y[INS.GetNameDefCap]§!."
 INSHOL_naval_program_transfer_100_tt: "Transfiere §Rtoda nuestra armada§! a [INS.GetNameDef]."
 INSHOL_naval_program_transfer_100_2_tt: "§Y[HOL.GetFlag] [HOL.GetNameDefCap]§! transferirá su armada a §Y[INS.GetNameDefCap]§!."
 INSHOL_naval_program_rejected_tt: "Desbloquea el enfoque nacional §Y$INSHOL_naval_secondchance$§!."
 INSHOL_hybrid_navy: "Una armada híbrida"
 INSHOL_hybrid_navy_desc: "Nuestra armada no puede depender únicamente de la flota pacífica de [HOL.GetNameDef]. Hemos de comenzar a fabricar nuestros propios barcos o, de lo contrario, un simple error podría paralizar todo nuestro suministro naval."
 INSHOL_request_naval_control: "Escuadrón de las Indias Orientales"
 INSHOL_request_naval_control_desc: "[HOL.GetNameDefCap] ha caído y no está en condiciones de dirigir una armada entera. Hemos de asumir el control durante el resto de la guerra."
 INSHOL_naval_secondchance: "Plan naval de las Indias Orientales"
 INSHOL_naval_secondchance_desc: "Pese a que [HOL.GetNameDef] se ha negado a cedernos el control de la armada, la necesidad de defender el Pacífico sigue estando ahí, a menos que deseemos que nos dominen. Aunque es posible que no salgamos tan bien parados como si hubiesen aceptado nuestra propuesta, hallaremos una alternativa adecuada."
 # <Joint Tree - Netherlands in Exile>
 INSHOL_netherlands_in_exile: "Países Bajos en el exilio"
 INSHOL_netherlands_in_exile_desc: "La trágica caída de nuestro reino se ha hecho realidad. No podemos dejarnos llevar por el derrotismo. Hemos de aceptar lo sucedido y centrarnos en qué podemos recuperar."
 # INSHOL_relocate_prime_minister: "Relocate the Prime Minister to Java"
 INSHOL_relocate_our_generals: "Trasladar el ejército a Java"
 INSHOL_relocate_our_generals_desc: "Los generales exiliados, comandantes y soldados rezagados restantes han de ser trasladados a [1058.GetName] con absoluta prioridad, antes de que sea demasiado tarde."
 #INSHOL_relocate_our_soldiers: "Transfer Holdout Soldiers to Java"
 INSHOL_netherlands_indonesia_union: "Unión Neerlando-Indonesia"
 INSHOL_netherlands_indonesia_union_desc: "Muchos se ríen del concepto de un estado igualitario entre [HOL.GetNameDef] y [INS.GetNameDef], pero, dada la crisis en la que estamos sumidos, parece ser la única vía para aumentar nuestras posibilidades de conservar la soberanía."
 # <Sukarno Shared Branch - Resistance Buildup>
 INS_underground_revolution: "Revolución clandestina"
 INS_underground_revolution_desc: "Comenzaremos a planear una revolución desde las sombras. Iremos ampliando poco a poco el número de miembros y la actividad de la milicia hasta que estemos listos para atacar."
 INS_infiltrate_the_media: "Infiltrarse en los medios"
 INS_infiltrate_the_media_desc: "Nuestro movimiento ha conseguido que varios peces gordos de las organizaciones mediáticas de las Indias se unan a nosotros. Le sacaremos provecho a esto e implantaremos sutilmente un sentimiento prorrevolucionario en la ciudadanía."
 INS_infiltrate_the_army: "Infiltrarse en el ejército"
 INS_infiltrate_the_army_desc: "Muchos de nuestros miembros se alistaron en el KNIL, desde soldados rasos hasta altos mandos. Deberíamos recabar tantos secretos como sea posible mientras los nuestros ascienden a puestos de alto rango. Una vez que apretemos gatillo, sembraremos el caos en el KNIL."
 INS_privately_owned_military_industry: "Industria militar privada"
 INS_privately_owned_military_industry_desc: "Fundaremos varias empresas fantasma en el sector de la industria militar para asegurarnos de que mantenemos su control cuando haya estallado la revolución."
 INS_privately_owned_military_industry_tt: "Añade §G2§! §Yfábricas militares§! a tu CG."
 INS_instigate_chaos_sulawesi: "Instigar el caos en Célebes"
 INS_instigate_chaos_sulawesi_desc: "Cooperaremos con los nacionalistas de Célebes: organizaremos huelgas y disturbios y radicalizaremos a la población."
 INS_instigate_chaos_sulawesi_tt: "Una vez declaremos la independencia, obtendremos un §Gestado esencial§! en §Y[673.GetName]§! y en §Y[1056.GetName]§!. Seguirán siendo estados no esenciales de las Indias Orientales Neerlandesas."
 INS_instigate_chaos_medan: "Instigar el caos en Medan"
 INS_instigate_chaos_medan_desc: "Cooperaremos con los nacionalistas de Medan y Riau: organizaremos huelgas y disturbios y radicalizaremos a la población."
 INS_instigate_chaos_medan_tt: "Una vez declaremos la independencia, obtendremos un §Gestado esencial§! en §Y[1049.GetName]§!. Seguirá siendo un estado no esencial de las Indias Orientales Neerlandesas."
 INS_embezzlement_scheme_in_batavia: "Plan de desfalco en Batavia"
 INS_embezzlement_scheme_in_batavia_desc: "Tras declarar la independencia, iniciaremos un plan para trasladar nuestra producción de Batavia a un territorio republicano."
 INS_embezzlement_scheme_in_batavia_tt: "Tras declarar la independencia, la mitad de las fábricas de §Y[1058.GetName]§! se trasladarán a nuestros §Ycuarteles generales revolucionarios§!."
 INS_volksraad_rumors: "Rumores en el Volksraad"
 INS_volksraad_rumors_desc: "Con discreción, empezaremos a hablar de una revolución dentro del Volksraad. Si lo conseguimos, podremos convencer a los miembros indonesios de que se unan a nuestra causa."
 INS_volksraad_rumors_tt: "Tras declarar la independencia, se §Gconservarán§! todos los consejeros §Yindonesios§! del Volksraad."
 INS_railway_youth_force: "Cooperar con la Fuerza Juvenil Ferroviaria"
 INS_railway_youth_force_desc: "La Fuerza Juvenil Ferroviaria, cuyo nombre proviene de su estrategia de incautar vías férreas, es un grupo paramilitar islámico que opera principalmente en Java Central. Serían un aliado valioso, pero son muy enérgicos y buscan enfrascarse en combates. Se mostrarán descontentos con el gobierno si el alto el fuego dura demasiado."
 INS_sleeper_informant_network: "[GetInformantNetworkName]"
 INS_Sleeper_Informant_Network_name: "Red de informantes durmientes"
 INS_KNIL_Informant_Network_name: "Red de informantes del KNIL"
 INS_sleeper_informant_network_desc: "Crearemos una red de informantes integrada en el sistema administrativo del KNIL, lo que nos prevendrá acerca de los planes enemigos."
 INS_sleeper_informant_network_tt: "§RCuando se declara la independencia:§!\n"
 # <Sukarno Shared Branch - Peoples Security Army>
 INS_the_peoples_security_army: "El ejército del pueblo"
 INS_the_peoples_security_army_desc: "Nuestros miembros, mayormente jóvenes indonesios, están impacientes y con ganas de contribuir y luchar por nuestra independencia. Deberíamos crear unas fuerzas armadas revolucionarias y empezar a entrenar a nuestros futuros soldados."
 INS_commander_sudirman: "Ejército de Sudirman"
 INS_commander_sudirman_desc: "A pesar de ser una joven promesa, Sudirman ha demostrado tener mucho potencial y gozar de popularidad entre los miembros más jóvenes de la resistencia. Debería estar al frente del ejército del pueblo y llevarnos hasta la victoria."
 INS_commander_oerip: "Ejército de Oerip"
 INS_commander_oerip_desc: "Oerip lleva décadas sirviendo en el ejército y es el único indonesio que ha ascendido a un puesto de alto rango en el KNIL. Supera con creces a cualquier otro miembro en términos de conocimiento y experiencia. Debería estar al frente del ejército del pueblo y llevarnos hasta la victoria."
 INS_sudirmans_promotion: "Ascenso de Sudirman"
 INS_sudirmans_promotion_desc: "Sudirman ha demostrado poseer grandes habilidades de liderazgo y ha perpetrado varios ataques de los que ha salido victorioso. Es hora de concederle a nuestro comandante el título de general que tanto merece."
 INS_tkr_steal_general: "Captar a generales del KNIL"
 INS_tkr_steal_general_desc: "Si convencemos a los mandamases del ejército de las Indias Orientales de que se unan a nuestra causa, mejoraremos nuestro ejército a la vez que saboteamos el suyo."
 INS_tkr_supply: "Todo revolucionario ha de luchar"
 INS_tkr_supply_desc: "Garantizaremos que todos los miembros de nuestro movimiento reciban entrenamiento militar, sin excepciones."
 INS_tkr_professional_army: "Un ejército profesional"
 INS_tkr_professional_army_desc: "No hemos de volcar toda nuestra confianza en las milicias. Debemos fomentar la creación de un ejército republicano profesional para mantener el orden."
 INS_arm_the_revolutionaries: "Armar a los revolucionarios"
 INS_arm_the_revolutionaries_desc: "Hemos de empezar por los revolucionarios y nacionalistas ávidos de energía y dispuestos a darlo todo por Indonesia. Los entrenaremos y les daremos el equipo que necesitan para luchar por su país."
 INS_arm_the_youth: "Armar a la juventud"
 INS_arm_the_youth_desc: "Después de los revolucionarios, hemos de armar a la juventud enérgica y esperanzada que avivará la llama de la revolución. Hemos de garantizar que el mayor número de jóvenes indonesios posible recibe formación y equipo para combatir. Si la guerra llama a sus puertas, estarán listos para actuar."
 INS_arm_the_students: "Armar al estudiantado"
 INS_arm_the_students_desc: "Los estudiantes han asentado las bases de la revolución desde hace décadas y seguirán asumiendo su liderazgo de cara al futuro."
 INS_guerilla_industry: "Industria de guerrillas"
 INS_guerilla_industry_desc: "Desplegaremos nuestras fuerzas de guerrilla por todo el archipiélago para hacernos con el control de las fábricas, lo que nos permitirá fabricar armas nuevas para nuestras milicias."
 INS_indonesian_assault_doctrine: "La doctrina de asalto indonesia"
 INS_indonesian_assault_doctrine_desc: "La guerra no se reduce únicamente a los soldados. Un millón de hombres no es nada sin armas con las que luchar. Hemos de priorizar la adquisición de artillería de gran calidad para adentrarnos aún más en territorio enemigo."
 INS_tighter_tkr_integration: "Mayor integración entre el TKR y los lascares"
 INS_tighter_tkr_integration_desc: "El ejército del pueblo y las milicias no operan en conjunto, y la coordinación entre ellos es limitada, cosa que nos traerá cada vez más problemas conforme avance la guerra. Hemos de integrar las fuerzas armadas y las milicias en una organización unificada, a pesar de que los oficiales de esta última se muestren disconformes al respecto."
 INS_quality_over_quantity: "Calidad por encima de la cantidad"
 INS_quality_over_quantity_desc: "Un soldado bien entrenado, con una buena estrategia y un equipo moderno, vencerá a cinco estudiantes con pistolas. Hemos de dar prioridad a los soldados y fuerzas especiales bien armados y cualificados en vez de movilizar al mayor número posible."
 INS_add_militia_cap_1_tt: "El límite de división de §YLuchador por la libertad§! aumenta en §Y1§!.\n"
 INS_add_militia_cap_2_tt: "El límite de división de §YLuchador por la libertad§! aumenta en §Y2§!.\n"
 INS_add_militia_cap_3_tt: "El límite de división de §YLuchador por la libertad§! aumenta en §Y3§!.\n"
 INS_add_3_militia_unit_tt: "Crea tres unidades de §YLuchador por la libertad§!, que pueden emplearse en los §Yasaltos§! para aumentar la §Gpresencia de la milicia§! en los estados neerlandeses."
 INS_add_fully_trained_militia_unit_tt: "Crea una unidad de §YLuchador por la libertad§! entrenada.\n"
 # <Sukarno Shared Branch - Expand Resistance Membership>
 INS_expand_resistance_membership: "Acoger a más miembros en la resistencia"
 INS_expand_resistance_membership_desc: "Concentrar nuestro movimiento en una sola base nos llevará al fracaso. Llamaremos a filas a nuestros miembros para enviarlos como emisarios, lo que aumentará nuestra popularidad y control en varias regiones."
 # <Central Independence Branch - Militias>
 INS_deploy_the_kris: "Ejército popular indonesio de Célebes"
 INS_deploy_the_kris_desc: "El ejército popular indonesio de Célebes, conocido como KRIS por sus siglas en indonesio, es un grupo activo de milicias que conforma la mayoría de la presencia militar en Célebes y Manado. Debemos reclutarlos para que luchen junto al TKR."
 INS_assist_the_pemuda: "Ayudar a las juventudes"
 INS_assist_the_pemuda_desc: "Java está repleta de milicias estudiantiles. Si aunamos fuerzas con ellas y les brindamos ayuda militar en sus misiones contra los neerlandeses, quizá consigamos un valioso aliado."
 INS_mobilize_the_pemuda: "Movilizar a las juventudes"
 INS_mobilize_the_pemuda_desc: "Ahora que nos hemos ganado la confianza de los grupos de jóvenes más grandes, debemos empezar a movilizarlos para que se unan al TKR."
 INS_organize_jakarta_pemuda: "Organizar a las juventudes de Yakarta"
 INS_organize_jakarta_pemuda_desc: "En Java hay grupos de juventudes de todos los tamaños. Aunque hemos movilizado y reclutado a la mayoría, en Yakarta quedan muchos de menor tamaño que siguen actuando de forma independiente. Hemos de hablar y colaborar con ellos."
 INS_recognize_moestopos_batallion: "Reconocimiento del batallón de Moestopo"
 INS_recognize_moestopos_batallion_desc: "Un revolucionario conocido por el nombre de Moestopo se ha autoproclamado ministro de Defensa en funciones en Surabaya y ha asumido el mando de las milicias de la zona. Sus actos bien merecen un reconocimiento formal: hemos de ascenderlo a teniente general del TKR."
 INS_darul_islam_focus: "Darul Islam"
 INS_darul_islam_focus_desc: "El Hezbolá de Kartosoewirjo ha demostrado su valía en las colinas de Java Occidental y no podemos permitirnos dejar a unos luchadores así fuera de nuestras filas. Que sus soldados irregulares sirvan entre los nuestros, y que este hombre ostente el rango que se ha ganado. Los fieles harán valer su causa en la república muy pronto."
 # <Central Independence Branch - Navy>
 INS_just_a_fisherman: "Un simple pescador"
 INS_just_a_fisherman_desc: "Librar una guerra en un archipiélago sin una armada es una ardua tarea que no podemos prolongar mucho tiempo. Emplearemos una estrategia que quizá peque de ingenua: enviar a las milicias en barcos pesqueros para que se hagan pasar por pescadores en los puertos controlados por los neerlandeses."
 INS_a_cheap_navy: "Una armada barata"
 INS_a_cheap_navy_desc: "No disponemos del tiempo ni del dinero necesarios para construir una gran armada moderna. Hemos de apañárnoslas con lo que tenemos y sacarle provecho a lo que encontremos."
 INS_divert_army_funds_to_navy: "Desviar fondos del ejército a la armada"
 INS_divert_army_funds_to_navy_desc: "Indonesia es un archipiélago, y nuestra infantería no sirve de nada sin barcos que la transporten. Desviar fondos del TKR a nuestra nueva armada es un sacrificio que merecerá la pena."
 INS_indonesian_naval_doctrine: "Doctrina naval indonesia"
 INS_indonesian_naval_doctrine_desc: "Ahora que estamos construyendo una armada propia, es de recibo considerar la doctrina por la que lucharemos y entrenaremos. Debemos priorizar la creación y la adopción de una doctrina naval en cuanto sea posible."
 INS_domestic_shipbuilding: "Construcción nacional de buques"
 INS_domestic_shipbuilding_desc: "No podemos depender toda la vida de los barcos capturados o comprados, pues dentro de poco no quedarán más navíos neerlandeses de los que apoderarnos. Debemos empezar a construir los nuestros propios cuanto antes."
 INS_acquire_modern_blueprints: "Adquirir planos modernos"
 INS_acquire_modern_blueprints_desc: "Les compraremos planos a otros países y empresas privadas que usaremos para construir nuestra nueva armada."
 INS_reclaiming_the_dutch_navy: "Reclamando la armada de las Indias neerlandesas"
 INS_reclaiming_the_dutch_navy_desc: "Los neerlandeses han dejado una gran cantidad de barcos amarrados en puertos que ahora ocupamos nosotros. Debemos reclamarlos como nuestros ahora que podemos."
 INS_admiral_mas_pardi: "Almirante Mas Pardi"
 INS_admiral_mas_pardi_desc: "Cualquier armada que se precie necesita a un almirante al mando. Mas Pardi es el candidato perfecto."
 INS_akademi_angkatan_laut: "Construir la Akademi Angkatan Laut"
 INS_akademi_angkatan_laut_desc: "Construiremos una academia naval con instalaciones de investigación, mientras formamos a más ciudadanos para convertirse en ingenieros y almirantes."
 # <Central Independence Branch - Militia Logistics>
 INS_pki_militia_tt: "Tan Malaka tiene una milicia muy poderosa. Sin embargo, no solo luchan por Indonesia, sino también por el §Rcomunismo§! y los soviéticos. §RCon el tiempo, se opondrán con violencia a cualquier gobierno no comunista§!."
 INS_increase_laskar_funding_tt: "§WObtén§! 1§Y fábrica militar§! por cada exigencia concedida a una milicia (§G6§! máx.)."
 INS_subsidize_laskar_armament: "Subvencionar armamento de los lascares"
 INS_subsidize_laskar_armament_desc: "Las milicias que luchan con lanzas de bambú no van a sobrevivir mucho tiempo contra unidades debidamente armadas. Necesitamos priorizar la fabricación de más armas y munición para ellas."
 INS_loot_knil_weapons_caches: "Saquear alijos de armas del KNIL"
 INS_loot_knil_weapons_caches_desc: "El KNIL depositó bastantes alijos de armas antes de la revolución. Muchos de nuestros miembros formaban parte de él, por lo que quizá seamos capaces de encontrarlos y saquearlos."
 INS_utilize_tan_malakas_militia: "Utilizar la milicia de Tan Malaka"
 INS_utilize_tan_malakas_militia_desc: "La milicia roja de Tan Malaka quizá sea la milicia independiente más fuerte de toda Indonesia, y nos beneficiaría mucho que se unieran al TKR. Esto entraña sus riesgos, pues cederle tanta influencia a una milicia así de poderosa y con tan fuertes motivaciones políticas les facilitará hacerse ellos mismos con el poder."
 INS_increase_laskar_funding: "Aumentar el gasto de los lascares"
 INS_increase_laskar_funding_desc: "Nuestras milicias conforman la mayor parte de nuestras fuerzas. Necesitamos ser conscientes de ello y financiarlas como es debido, aunque no sean del todo leales a [INS.GetLeader]."
 INS_develop_a_functioning_airforce: "Desarrollar una fuerza aérea adecuada"
 INS_develop_a_functioning_airforce_desc: "La fuerza aérea supone un antes y un después en un ejército. Debemos priorizar la creación de una."
 # <Vice Presidential Edict - Intro>
 INS_political_stabilization: "Restaurar el orden"
 INS_political_stabilization_desc: "Nuestra nación se está volviendo cada vez más inestable. Si no reaccionamos pronto, estallará una guerra civil. Hemos de empezar a negociar con el Comité Nacional, el presidente y los líderes de la milicia para buscar una solución."
 INS_vice_presidential_edict: "Firmar el décimo edicto vicepresidencial"
 INS_vice_presidential_edict_desc: "El Comité Nacional exige casi de forma unánime un poder legislativo de verdad. Se le ha comunicado al presidente la petición de adoptar un sistema híbrido que establece que el Comité Nacional conformará un parlamento independiente y compartirá los poderes legislativos con él. La propuesta es tentadora, pero existe el riesgo de que el poder presidencial se vuelva insignificante."
 INS_local_cooperatives: "Establecer cooperativas locales"
 INS_local_cooperatives_desc: "No debemos crear un sistema capitalista como el de Occidente, pero tampoco debemos ignorar el beneficio económico que aporta la privatización. Permitiremos la creación de cooperativas locales, cuyo éxito traerá riqueza a sus propietarios. Sin embargo, el gobierno las supervisará y estará prohibido expandir el negocio fuera de sus localidades de procedencia."
 INS_local_unity: "Autonomía de principados parcial"
 INS_local_unity_desc: "Concederemos una autonomía parcial a los principados como medida temporal para disminuir las disputas internas en estos tiempos tan aciagos."
 INS_education_subsidies: "Subvenciones para la educación"
 INS_education_subsidies_desc: "Invertir en el futuro de la juventud es estrictamente necesario si queremos un estado próspero en términos económicos. Construiremos escuelas asequibles por toda la república."
 INS_land_reform: "Reforma agraria"
 INS_land_reform_desc: "Los Países Bajos poseían vastas extensiones de tierra antes de que declarásemos la independencia. Debemos distribuir estos terrenos a los indonesios que vayan a usarlos por un módico precio para impulsar el crecimiento económico."
 INS_dominion_of_atjeh: "El Dominio de Atjeh"
 INS_dominion_of_atjeh_desc: "El movimiento separatista de Atjeh es grande y va en aumento. No tenemos motivos para agravar la situación. Deberíamos negociar un compromiso para que sigan siendo parte de Indonesia, pero conserven parte de su autonomía."
 # <Vice Presidential Edict - Presidential Balance>
 INS_dissolve_national_party: "Disolver el partido nacional"
 INS_dissolve_national_party_desc: "El sistema híbrido se creó como solución para evitar el caos. No deberíamos permitir que el presidente ostente tanto poder de forma antidemocrática. El parlamento ha de destituirlo o jamás alcanzaremos la democracia plena."
 INS_womens_sufferage: "Sufragio femenino"
 INS_womens_sufferage_desc: "Permitir a las mujeres que voten nos traerá inestabilidad a corto plazo, pero es necesario para gozar de estabilidad y democracia a la larga."
 INS_women_in_military: "Mujeres en el ejército"
 INS_women_in_military_desc: "Permitir a las mujeres servir en el ejército es necesario para garantizar que nuestras fuerzas armadas sean tan poderosas como sea posible."
 INS_fair_election: "Unas elecciones justas"
 INS_fair_election_desc: "Ahora que se ha destituido al presidente y que ha terminado la revolución, por fin podemos celebrar las primeras elecciones justas y libres de la influencia autoritaria."
 # < Hybrid Politics >
 INS_continue_hybrid_politics: "Continuar con las políticas híbridas"
 INS_continue_hybrid_politics_desc: "Las políticas híbridas son un mal necesario. Si bien nuestro objetivo final es alcanzar la democracia plena, lo cierto es que Indonesia está todavía en pañales y es muy inestable para que el poder recaiga en manos del pueblo. El presidente y el parlamento seguirán moderándose mutuamente para garantizar que ninguno ostente demasiado poder."
 INS_guided_economy: "Economía guiada"
 INS_guided_economy_desc: "Supervisaremos la economía de Indonesia directamente para garantizar que mantengamos el control. Nacionalizaremos todos los bancos, así como los sectores del petróleo y la agricultura."
 INS_reform_education_system: "Educación ideológica obligatoria"
 INS_reform_education_system_desc: "La revolución ha demostrado que los estudiantes y jóvenes descontentos con el orden social siempre liderarán la rebelión. Por la seguridad del gobierno y de la nación, es preciso que en todas las escuelas se enseñen los fundamentos de la ideología de nuestro gobierno."
 INS_reform_education_system_2: "Reforma educativa"
 INS_reform_education_system_2_desc: "Si queremos que Indonesia se convierta en una nación próspera en el futuro, todos sus habitantes, hayan nacido donde hayan nacido, han de tener derecho a la educación."
 INS_three_year_plan: "El plan trienal"
 INS_three_year_plan_desc: "Podemos establecer un plan trienal para construir infraestructuras por todo el archipiélago y conectar las islas."
 INS_destroy_pacific_colonialism: "Destruir el colonialismo pacífico"
 INS_destroy_pacific_colonialism_desc: "Quizá la revolución haya acabado, pero aún quedan batallas por librar. Muchos siguen viviendo bajo el yugo de la tiranía colonial en nuestro país. No podemos quedarnos de brazos cruzados: hemos de actuar para liberarlos de las garras de sus gobernantes."
 INS_rapid_mobilization: "Movilización rápida"
 INS_rapid_mobilization_desc: "Toda nación fuerte que se precie dispone de un ejército que la protege. Si queremos convertirnos en una superpotencia regional capaz de defender nuestro territorio, hemos de empezar por fortalecer a nuestro ejército."
 INS_greater_indonesia: "Proclamar la Gran Indonesia"
 INS_greater_indonesia_desc: "Antaño, el antiguo imperio de Nusantara unificó el mundo malayo en una sola entidad, en un solo pueblo. Ahora que hemos liberado a Malasia de la tiranía colonial, debemos seguir el ejemplo de nuestros antepasados en Nusantara y agrupar el mundo malayo en una nación unida."
 # < State Religion >
 INS_secularism: "Secularismo"
 INS_secularism_desc: "En Indonesia conviven muchas religiones. Mezclar política y religión provocará disputas internas, por lo que debemos prohibir los partidos políticos religiosos."
 INS_integrate_sarekat_islam: "Integrar el Sarekat Islam"
 INS_integrate_sarekat_islam_desc: "Los grandes partidos políticos islámicos gozan de mucho apoyo popular, por lo que nos conviene integrarlos en el gobierno."
 # <Vice Presidential Edict - Sjahrir>
 INS_sjahrirs_continued_tenure: "Permanencia en el cargo de Sjahrir"
 INS_sjahrirs_continued_tenure_desc: "El primer ministro Sjahrir ha demostrado ser un gran líder: nos ha guiado a través de la revolución, ha mejorado nuestra economía y nos ha traído la democracia. Deberíamos volver a elegirlo primer ministro."
 INS_unity_in_diversity: "Unidad en la diversidad"
 INS_unity_in_diversity_desc: "Durante siglos, las palabras \"Unidad en la diversidad\" han reflejado el alma de nuestro archipiélago. Durante la revolución, esta idea se convirtió en un grito de guerra que recordaba a los indonesios que, a pesar de hablar varias lenguas y tener tradiciones diferentes, somos un solo pueblo. Deberíamos recoger esta frase en la constitución para que nuestra unidad perdure en las generaciones venideras."
 INS_the_timor_issue: "[INS_timor_issue_scripted_name]"
 INS_timor_issue_scripted_name_issue: "La cuestión de Timor"
 INS_timor_issue_scripted_name_attack: "Atacar Timor Oriental"
 INS_the_timor_issue_desc: "[INS_timor_issue_scripted_desc]"
 INS_timor_issue_scripted_desc_issue: "No cabe duda de que Timor Oriental es territorio legítimo de Indonesia. A pesar de que la revolución ha terminado, sigue estando bajo dominio colonial. Enviaremos un ultimátum a [721.OWNER.GetName] exigiéndole que nos ceda el territorio de inmediato."
 INS_timor_issue_scripted_desc_attack: "Sin lugar a dudas, Timor Oriental pertenece a Indonesia. Los rebeldes de la isla exigen la independencia, pero no representan al grueso de la población. Hemos de integrar los vestigios del colonialismo portugués en la república."
 INS_pledge_to_allies: "Compromiso con los Aliados"
 INS_pledge_to_allies_desc: "Dado el conflicto en auge a escala mundial, corremos el riesgo de que nos invadan. Aunque nuestra relación con los Aliados ha sido turbulenta, nos hemos consolidado como potencia democrática en el Pacífico y deberíamos aliarnos con las grandes potencias democráticas."
 INS_mixed_economy_system: "Sistema de economía mixta"
 INS_mixed_economy_system_desc: "Indonesia es un país singular y no prosperará bajo el capitalismo tradicional ni el comunismo. Deberíamos establecer un sistema de economía mixta que combine elementos de ambos."
 INS_social_democracy: "Socialdemocracia"
 INS_social_democracy_desc: "La economía [INS.GetAdjective] ha crecido en gran medida desde que se implementaron las políticas económicas de Sjahrir. Debemos declarar Indonesia como un estado socialdemócrata pleno y desarrollar políticas económicas futuras basadas en los principios de la socialdemocracia."
 # <Vice Presidential Edict - Sjarifuddin>
 INS_prime_minister_sjarifuddin: "Primer ministro Sjarifuddin"
 INS_prime_minister_sjarifuddin_desc: "Sjarifuddin es el mejor candidato para Indonesia, pues sus políticas moderadas permiten que comunistas y socialistas lleguen a un acuerdo."
 INS_concessions_to_communists: "Concesiones ante los comunistas"
 INS_concessions_to_communists_desc: "El PKI ocupa un gran número de escaños en el parlamento. Debemos ofrecer unos cuantos cargos ministeriales a sus líderes para garantizar la estabilidad."
 INS_sjarifuddin_focus_2: "Economía de exportación autogestionada"
 INS_sjarifuddin_focus_2_desc: "Ahora que somos una nación independiente, deberíamos revisar nuestro sistema económico de exportaciones y reorganizarlo de modo que no dependa de los Países Bajos. Aunque disponer de una economía basada en las exportaciones es peligroso, podemos conseguir que sea más fiable que en el pasado."
 # <Vice Presidential Edict - Hatta>
 INS_prime_minister_hatta: "Primer ministro Hatta"
 INS_prime_minister_hatta_desc: "Mohammad Hatta, pregonero de la revolución, ostentó el cargo de vicepresidente de Sukarno y era el más demócrata de los dos. Como primer ministro será idóneo, pues la mayoría de partidos políticos se mostrarán dispuestos a llegar a acuerdos con él."
 INS_hatta_focus_2: "Los siguientes pasos"
 INS_hatta_focus_2_desc: "La revolución ha terminado y, pese a que algunos políticos insisten en que ha de continuar, hemos de hacerles caso omiso, mirar hacia adelante y construir una Indonesia en la que las generaciones venideras puedan vivir prósperamente."
 INS_hatta_princely_advisors: "Integrar los principados"
 INS_hatta_princely_advisors_desc: "Hallamos unidad a través de la diversidad que nos caracteriza. Este es el principio que mueve a nuestra nación, pero el fin de la revolución ha puesto contra las cuerdas esta idea debido a que no compartimos una lucha común. Para evitar que los grupos minoritarios sientan animadversión y se subleven, deberíamos establecer un consejo adicional que permita a los gobernantes de los principados tener voz y voto en las políticas nacionales."
 INS_prime_minister_tt: "Se han celebrado las primeras elecciones generales de Indonesia"
 # < Guided Democracy >
 INS_guided_democracy: "Democracia guiada"
 INS_guided_democracy_desc: "Quizá la democracia sea ideal, pero cederle el poder al pueblo solo provocará el caos. Nombraremos presidente vitalicio a Sukarno, quien supervisará el parlamento democrático e intervendrá si la situación así lo requiere."
 INS_enact_militarism: "Promulgar el militarismo"
 INS_enact_militarism_desc: "Debemos aprender de [JAP.GetNameDefCap] y de sus políticas militares. Adoptar unos principios similares beneficiará a nuestro nuevo gobierno."
 INS_sukarnos_industrialization: "Potenciar la industria de Java"
 INS_sukarnos_industrialization_desc: "Las industrias de Java son la espina dorsal de nuestra economía y de nuestro ejército. Todos los caminos deben llevar a Roma."
 INS_sukarnos_industrialization2: "Todo hombre ha de contribuir"
 INS_sukarnos_industrialization2_desc: "El esfuerzo bélico es la prioridad número uno de esta nación y, por consiguiente, contribuir a él es la máxima prioridad de los indonesios. El lujo es el enemigo; la infraestructura industrial militar ha de crecer."
 INS_japanese_military_lessons: "Lecciones militares japonesas"
 INS_japanese_military_lessons_desc: "Debemos estudiar las doctrinas militares de Japón y adaptar a nuestro ejército en consecuencia."
 # < Support Tan Malaka's Coup>
 INS_support_tan_malakas_coup: "Apoyar el golpe de Estado de Tan Malaka"
 INS_support_tan_malakas_coup_desc: "Sukarno ha proclamado nuestra independencia, pero ha demostrado ser un hombre de medias tintas y concesiones diplomáticas. Tan Malaka y su Persatuan Perjuangan exigen lo que quiere el pueblo: la independencia total, sin negociaciones ni acuerdos. Si Sukarno no lucha como es debido por la revolución, esta deberá buscar un líder que sí se muestre dispuesto a ello."
 INS_minimum_program: "El programa mínimo"
 INS_minimum_program_desc: "El Persatuan Perjuangan ha expuesto sus exigencias: un gobierno popular, un ejército popular y la nacionalización de todas las plantaciones e industrias en manos extranjeras. Necesitamos hombres competentes para cumplir con este programa. Njono representa a los trabajadores y Setyadjit, a los intelectuales del partido. Juntos, conseguirán que la revolución llegue desde el suelo de las fábricas hasta los pasillos del gobierno."
 INS_agrarian_reform: "Reforma agraria"
 INS_agrarian_reform_desc: "Durante tres siglos, el territorio de Indonesia ha sustentado las plantaciones extranjeras. Los campesinos que las labraban no conocen otra cosa. Una revolución que no cambia esto no es revolución alguna. La tierra acabará en manos de quien la trabaja."
 INS_soviet_aid: "Ayuda soviética"
 INS_soviet_aid_desc: "La Unión Soviética ha dado el visto bueno a nuestra revolución y se muestra dispuesta a apoyarla. A pesar de las diferencias que nos separan de Moscú, no podemos rechazar lo que nos ofrecen. Debemos tomar las armas y avanzar."
 INS_pacific_revolution: "La revolución pacífica"
 INS_pacific_revolution_desc: "Los poderes coloniales no han abandonado toda Asia, únicamente Indonesia. El antiguo orden sigue vigente en territorios como Malasia y Filipinas, donde hay quien ansía derrocarlo. Gracias a nuestra revolución, tenemos la autoridad y la obligación de ayudar. Y así lo haremos."
 INS_purge_oppurtunists_tt: "Desbloquea §Y$INS_launch_revolution$§! en países con un §Y60%§! o más de apoyo comunista. Los países en los que instiguemos revoluciones se convertirán en §Ytíteres§! nuestros."
 INS_purge_oppurtunists: "Purgar a los oportunistas"
 INS_purge_oppurtunists_desc: "Musso se pasó veinte años en Moscú obedeciendo órdenes. Volvió con instrucciones por parte de los soviéticos bajo el brazo y un plan para convertir nuestra república en títere de la Comintern. No nos hemos librado de los neerlandeses para arrodillarnos ante otro gobernante extranjero. Hemos de acabar con los oportunistas dispuestos a vender nuestra revolución a Moscú. Los pueblos a los que liberemos pondrán la mirada en Yakarta, no en el Kremlin."
 INS_federation_of_aslia: "Federación de Aslia"
 INS_federation_of_aslia_desc: "Las naciones a las que hemos liberado no tienen por qué estar solas. Tan Malaka siempre ha soñado con algo que va más allá de una simple república: una federación que se extienda desde el continente hasta el Pacífico, unida contra las potencias coloniales que osen regresar. Les ofreceremos formar parte de nuestro Estado."
 INS_aslia_tt: "Permite anexionarse súbditos del §YPacífico§! y convertirlos en estados esenciales"
 INS_musso_ascends: "Musso asciende"
 INS_musso_ascends_tt: "Desbloquea §Y$INS_launch_revolution$§! en países con un §Y30%§! o más de apoyo comunista. Los países en los que instiguemos revoluciones seguirán siendo independientes."
 INS_musso_ascends_desc: "Tan Malaka es un soñador, y Musso consigue lo que los soñadores no pueden: el apoyo pleno de la Unión Soviética y la solidaridad del movimiento comunista internacional. Nuestra revolución no tiene por qué ser solitaria."
 INS_soviet_economic_integration: "Integración económica soviética"
 INS_soviet_economic_integration_desc: "La revolución nos ha traído libertad, pero solo con libertad no se erigen fábricas ni se alimenta a las masas. La Unión Soviética ofrece lo que ninguna otra potencia capitalista: expertos industriales, créditos para el desarrollo y comercio con unas condiciones libres del yugo colonial. Negarnos sería una necedad por nuestra parte."
 # <National Revolution - Reasserting Control>
 INSHOL_revolution_ongoing_tt: "La revolución indonesia está en marcha"
 INSHOL_reasserting_control: "Reafirmar el control de las Indias"
 INSHOL_reasserting_control_desc: "No podemos quedarnos de brazos cruzados mientras estos oportunistas intentan cargarse lo que llevamos siglos construyendo, a la vez que destruyen nuestras infraestructuras y radicalizan a la juventud. ¡Hemos de actuar!"
 INSHOL_request_british_support: "Solicitar ayuda a Gran Bretaña"
 INSHOL_request_british_support_desc: "[ENG.GetNameDefCap], como potencia colonial que es, empatizará con nuestra situación, sobre todo porque, si los revolucionarios logran su cometido, esto provocará un efecto dominó en Asia Oriental. Debemos solicitarles ayuda militar y económica."
 INS_eng_treaty_holside_tt: "§Y[ENG.GetNameDefCap]§! declarará oficialmente apoyarnos en el conflicto y brindarnos ayuda. Si nos alzamos con la victoria en la guerra, Borneo pasará a depender de §Y[ENG.GetNameDefCap]§!."
 INS_eng_treaty_engside_tt: "Nos aliaremos oficialmente con §Y[HOL.GetNameDefCap]§! en el conflicto de las Indias Orientales. Si §Y[HOL.GetNameDefCap]§! vence, el gobierno de Borneo recaerá sobre nosotros."
 INS_fra_treaty_holside_tt: "§Y[FRA.GetNameDefCap]§! declarará oficialmente apoyarnos en el conflicto y brindarnos ayuda. Si nos alzamos con la victoria en la guerra, el territorio nororiental de Sumatra pasará a depender de §Y[FRA.GetNameDefCap]§!."
 INS_fra_treaty_fraside_tt: "Nos aliaremos oficialmente con §Y[HOL.GetNameDefCap]§! en el conflicto de las Indias Orientales. Si §Y[HOL.GetNameDefCap]§! vence, el gobierno del territorio nororiental de Sumatra recaerá sobre nosotros."
 INSHOL_franco_dutch_accord: "Acuerdo franco-neerlandés"
 INSHOL_franco_dutch_accord_desc: "A pesar de que nuestros soldados están mejor equipados y organizados que las milicias republicanas, su superioridad numérica ha cambiado las tornas del conflicto y ahora llevamos las de perder. Para alzarnos con la victoria necesitamos apoyo externo, más del que muchos estarían dispuestos a proveernos. Quizá Francia acceda a intervenir si les ofrecemos territorio en las Indias para que expanda su presencia en el Pacífico."
 INSHOL_london_batavia_accord: "Acuerdo de Londres-Batavia"
 INSHOL_london_batavia_accord_desc: "A pesar de que nuestros soldados están mejor equipados y organizados que las milicias republicanas, su superioridad numérica ha cambiado las tornas del conflicto y ahora llevamos las de perder. Para alzarnos con la victoria necesitamos apoyo externo, más del que muchos estarían dispuestos a proveernos. Quizá [ENG.GetNameDefCap] esté interesado por su presencia en Malasia. Si les ofrecemos algo a cambio, es posible que acepten."
 INSHOL_australian_divisions: "Enviar a la infantería australiana a Java"
 INSHOL_australian_divisions_desc: "Tal y como estipula el Acuerdo de Londres-Batavia, Gran Bretaña ha de enviar divisiones adicionales a las Indias a través de Australia si así lo solicitamos. Dada la cercanía de esta última con las Indias, es el territorio ideal para albergar una base militar fuera de ellas."
 INSHOL_indian_divisions: "Divisiones militares indobritánicas"
 INSHOL_indian_divisions_desc: "Aunque es muy probable que Gran Bretaña se niegue a enviar a sus hombres a las Indias, convencerlos para que manden a divisiones indias es mucho más fácil, sobre todo dada su proximidad con Batavia."
 INSHOL_undermine_the_militias: "Menoscabar a las milicias"
 INSHOL_undermine_the_militias_desc: "Los medios exageran la gravedad de la situación: las milicias no son más que un grupo de jóvenes inconformistas intentando alcanzar lo inalcanzable. No necesitamos destinar nuestros recursos a detenerlos, sino resistir y aguardar a que se cansen."
 INSHOL_flag_will_fly_again: "La bandera ondeará una vez más"
 INSHOL_flag_will_fly_again_desc: "La bandera de los Países Bajos lleva siglos ondeando en las Indias y bajo ningún concepto permitiremos que se arríe. Si para conservar la joya colonial de la Corona tenemos que enviar tanques y bombarderos, que así sea."
 INSHOL_flag_will_fly_again_tt: "§YCuando termine la revolución, el espíritu se eliminará y se revertirán los cambios de reglas.§!"
 # <National Revolution - Escalation>
 INSHOL_mass_mobilization: "Movilización masiva"
 INSHOL_mass_mobilization_desc: "Sin un ejército bien equipado, no podemos ganar este conflicto ni acabar con la República. Hemos de rearmar a las Indias y desviar fondos de los sectores civiles al KNIL."
 INSHOL_batavia_storm_operation: "Estallido en Batavia"
 INSHOL_instigate_infighting: "Instigar las luchas internas en la República"
 INSHOL_ultimatum_to_republic: "Un ultimátum para la República"
 INSHOL_comite_rijkseenheid: "Comité Rijkseenheid"
 INSHOL_comite_rijkseenheid_desc: "Van a arriar la bandera en las Indias, y nadie piensa mover un dedo para impedirlo. No podemos permitirlo; hemos de convencer a la administración de las Indias de que el pueblo neerlandés quiere poner fin a la revolución."
 INSHOL_increase_esclation_placeholder: "Escalada rápida"
 INSHOL_increase_esclation_placeholder_desc: "Nuestras milicias han tomado el control de muchos puertos, ciudades y centros industriales de vital importancia. No podemos seguir esperando a que los neerlandeses reaccionen; lanzaremos una gran ofensiva militar por nuestra cuenta."
 INS_take_batavia_explination_tt: "Si conseguimos ocupar Java por completo, destruiremos el gobierno colonial desde dentro y §Gganaremos la guerra§!. Sin embargo, si no lo logramos en un plazo de §Y730 días§!, §Rpereceremos§!."
 INSHOL_linggadjati_agreement: "Negociación de los acuerdos por el alto el fuego"
 INSHOL_linggadjati_agreement_desc: "Nos ha costado trabajo invadir Java, y nuestra administración es cada vez más inestable. Hemos de emprender la retirada y adoptar una postura defensiva para no arriesgarnos a que la República entera caiga. Debemos negociar el alto el fuego con los Países Bajos, lo que nos permitirá reorganizar a nuestras fuerzas antes de volver a centrarnos en Java."
 INSHOL_increase_esclation_placeholder_tt: "Desbloquea una §Ydecisión§! para negociar el alto el fuego local y §Yampliar el tiempo límite§! para ocupar Java."
 # <National Revolution - Peace Negotiation>
 INSHOL_seek_foreign_help: "Buscar ayuda externa"
 INSHOL_seek_foreign_help_desc: "Que una nación joven y sin una economía consolidada intente ganar una guerra contra una potencia colonial muy industrializada es prácticamente imposible, y eso lo sabemos todos. Hemos de ponernos en contacto con otros países que apoyen nuestra causa para ver si están dispuestos a ayudarnos."
 INSHOL_renville_agreement: "El acuerdo sobre Renville"
 INSHOL_renville_agreement_desc: "La agresión sin precedentes ejecutada por los Países Bajos ha puesto el foco internacional sobre la revolución y, aun así, han seguido saltándose el alto el fuego en busca de una reacción por nuestra parte. Debemos intentar hablar con [USA.GetNameDef], pues, si los convencemos para que luchen por Indonesia, los Países Bajos no tendrán más remedio que recular."
 INSHOL_no_compromise: "Ni rendiciones ni medias tintas"
 INSHOL_no_compromise_desc: "La codicia de los neerlandeses, que les hizo invertir casi exclusivamente en Java ignorando el resto de las islas orientales, ha convertido a la isla en el talón de Aquiles de toda la colonia. ¡Esa será su perdición!"
 INSHOL_end_to_bloodshed: "Propuesta de los dos Estados"
 INSHOL_end_to_bloodshed_desc: "El conflicto se ha alargado más de lo necesario, hay poco progreso por ambas partes y cada día que pasa se pierden más vidas. Nadie quiere seguir prolongándolo. Va siendo hora de que nos sentemos en la mesa de negociación con los líderes neerlandeses."
 INSHOL_reorganize_colonies: "Reorganizar la colonia"
 INS_we_will_need_another_tt: "Como ya controlamos toda Java, también necesitaremos el control de un estado adicional."
 # Industry Branch - New
 INS_centralize_the_state: "Centralizar el Estado"
 INS_centralize_the_state_desc: "Desde Sumatra a Célebes, pasando por Borneo y Bangka, nuestros programas de desarrollo han hecho posible la construcción de carreteras, fábricas e instituciones en territorios en los que [1058.GetName] solo gobernaba sobre el papel. Estas regiones ya no son meras provincias lejanas, sino que forman parte de [INS.GetNameDefCap]."
 INS_centralize_the_state_1_tt: "Estados requeridos que son §Yesenciales§!:"
 INS_centralize_the_state_2_tt: "Estados requeridos que son §Yno esenciales§!:"
 INS_fate_of_de_javasche_bank: "[INS_fate_of_de_javasche_bank_scripted_name]"
 INS_fate_of_de_javasche_bank_scripted_name_colony: "El porvenir del De Javasche Bank"
 INS_fate_of_de_javasche_bank_scripted_name_independent: "El porvenir del Bank Indonesia"
 INS_fate_of_de_javasche_bank_desc: "[INS_fate_of_de_javasche_bank_scripted_desc]"
 INS_fate_of_de_javasche_bank_scripted_desc_colony: "El valor del florín de las Indias Orientales ha caído en picado desde que estalló la Gran Depresión, y el De Javasche Bank carece de las herramientas necesarias para frenar la caída. Hemos de decidir cómo estabilizar nuestra moneda antes de que la confianza de los inversores se disipe por completo."
 INS_fate_of_de_javasche_bank_scripted_desc_independent: "Hemos heredado una moneda en crisis. El antiguo florín colonial ya flaqueaba, y la transición a la rupia no ha ayudado a estabilizar los mercados. El Bank Indonesia necesita recibir directrices por parte del gobierno o nuestra economía sufrirá las consecuencias."
 INS_finish_the_bauxite_project: "Finaliza el proyecto Bangka"
 INS_finish_the_bauxite_project_desc: "Ahora que Bangka-Belitung cuenta con nuevas carreteras, redes ferroviarias y puertos operativos, los equipos de inspección han hallado depósitos de tungsteno y cromo que superan nuestras expectativas. Estas islas aportarán un gran beneficio a la república."
 INS_australian_contracts: "Contratos australianos"
 INS_australian_contracts_desc: "Contamos con reservas de caucho suficientes para suplir nuestras necesidades. Es más, nos sobran. Australia, ávida de materias primas para abastecer sus industrias, se nos presenta como un socio comercial afín. Firmar contratos a largo plazo con empresas australianas nos supondría recibir unos ingresos estables y ayudaría a afianzar nuestra presencia en la economía regional."
 INS_coopereate_with_chinese_businessmen: "Cooperar con los empresarios chinos"
 INS_coopereate_with_chinese_businessmen_desc: "Durante muchos años, la clase mercante pudiente y con contactos ha facilitado el comercio por todo el archipiélago. En lugar de obviar estas redes ya consolidadas, deberíamos colaborar con ellas. Su capital y conocimiento en materia comercial pueden venirnos muy bien para sacar la economía del estancamiento."
 INS_oil_decisions_unlock_tt: "Desbloquea nuevas §Y$INS_realign_supply_chains_cat$§! decisiones para vender §Ypetróleo§!."
 INS_negotiate_new_contracts_unlock_tt: "Desbloquea nuevas §Y$INS_realign_supply_chains_cat$§! decisiones."
 INS_realign_supply_chains_explain_tt: "Desbloquea §Y$INS_realign_supply_chains_cat$§! decisiones para vender recursos a las empresas privadas durante un periodo de dos años."
 INS_negotiate_new_contracts: "Negociar nuevos contratos"
 INS_negotiate_new_contracts_desc: "Nuestra creciente reputación como proveedores de confianza nos ha abierto puertas que antes se nos cerraban. Hay nuevos compradores interesados y deberíamos actuar con rapidez para conseguir que firmen acuerdos a largo plazo antes de que la competencia les ofrezca precios más bajos."
 INS_all_in_on_rubber: "Apostarlo todo al caucho"
 INS_all_in_on_rubber_desc: "El caucho es nuestra mejor baza, y pensamos sacarle partido. Destinaremos hasta la última hectárea de tierra de cultivo a su plantación y reorganizaremos nuestra maquinaria de exportación para transportarlo con mayor rapidez y a menor coste que cualquiera de la región."
 INS_more_market_resources: "Superar la Gran Depresión"
 INS_more_market_resources_desc: "El mundo se halla sumido en una crisis económica, pero las crisis traen consigo oportunidades para aquellos capaces de aprovecharlas. Colmar el mercado con materias primas a precios con los que nadie pueda competir nos garantizará que, para cuando el mundo se recupere, los productos indonesios ya poblarán todas las estanterías y almacenes."
 # <Industry Branch - Trade Policy>
 INS_recovering_from_the_great_depression: "Recuperándose de la Gran Depresión"
 INS_recovering_from_the_great_depression_desc: "La Gran Depresión ha tenido un efecto devastador en [INS.GetNameDef]. Como nuestra economía se basa en las exportaciones, el proteccionismo a nivel global nos ha perjudicado. Ahora que parece que el comercio se reactivará, debemos buscar nuevos mercados e intentar restablecer nuestras antiguas rutas comerciales."
 INS_first_come_first_serve: "Por orden de llegada"
 INS_first_come_first_serve_desc: "Aunque el proteccionismo de la Gran Depresión va a menos, el aumento de la producción y la sobrevaloración del florín ha menoscabado el mercado de exportación neerlandés, pues nuestros socios comerciales de Occidente han recurrido a Sudamérica para satisfacer su demanda. En lugar de ofrecerles otros acuerdos comerciales, podríamos aprovechar la oportunidad para abrirnos a nuevos mercados en Asia."
 INS_oil_export: "Más exportaciones de petróleo"
 INS_oil_export_desc: "Mejoraremos las infraestructuras petroleras en Sumatra y Kalimantan para conseguir acuerdos comerciales con nuestros nuevos socios."
 INS_increased_trade_with_japan: "Mejorar el comercio con Japón"
 INS_increased_trade_with_japan_desc: "[JAP.GetNameDefCap] ha demostrado ser un socio comercial muy valioso y no nos ha defraudado. Deberíamos negociar nuevos acuerdos comerciales para fortalecer la cooperación económica entre las dos naciones, lo que nos ayudará a desprendernos de los vestigios de la Gran Depresión. Es posible que nuestros aliados occidentales se muestren molestos al respecto, sobre todo los Países Bajos. Sin embargo, si queremos que nuestro destino esté en nuestras manos, hemos de forjar nuestros propios vínculos comerciales."
 INS_asian_trade_investments: "Inversiones comerciales en Asia"
 INS_asian_trade_investments_desc: "La devastación de la Gran Depresión ha sacado a colación lo mucho que dependíamos de nuestros socios comerciales de Occidente. Dado que nuestra economía se nutre principalmente de las exportaciones, es crucial que prosperemos y nos abramos a nuevos mercados en el Sudeste Asiático para garantizar así que no dependamos de ningún país a título individual."
 INS_asian_trade_investments_tt: "Cada §Y420§! días, la penalización de los recursos para la venta de la §YGran Depresión§! §Gmejorará§! un §Y5%§! hasta que desaparezcan los modificadores negativos."
 INS_declare_free_trade: "Declarar el libre comercio"
 INS_declare_free_trade_desc: "No deberíamos aliarnos únicamente con un país. Permitiremos que el mercado decida por [INS.GetNameDef]."
 INS_japanese_export_contracts: "Un contrato comercial para gobernarlos a todos"
 INS_japanese_export_contracts_desc: "Negociaremos un acuerdo comercial importante con [JAP.GetNameDef]: venderemos caucho en [1049.GetName] y [672.GetName]. Aunque el precio de mercado será bajo, esto nos garantizará que lo vendamos todo."
 INS_realign_supply_chains: "Reorganizar las cadenas de suministro"
 INS_realign_supply_chains_desc: "Aunque el proteccionismo de la Gran Depresión va a menos, el aumento de la producción y la sobrevaloración del florín ha menoscabado el mercado de exportación neerlandés, pues nuestros socios comerciales de Occidente han recurrido a Sudamérica para satisfacer su demanda. Hemos de dar un paso al frente y convencer a nuestros aliados de que vuelvan a comerciar con nosotros."
 INS_invite_foreign_companies: "Apoyar los proyectos petroleros estadounidenses"
 INS_invite_foreign_companies_desc: "Desde el año 1930, la empresa Standard Oil of California ha estado operando en nuestro país a través de su filial neerlandesa, la Nederlandsche Pacific Petroleum Maatschappij. Las inspecciones que han llevado a cabo en Riau se muestran prometedoras. Deberíamos brindarles apoyo en sus labores de exploración y producción, pues cualquier gran hallazgo aumentaría nuestros ingresos y alentaría al resto de empresas internacionales a invertir en nuestro país."
 INS_expand_sea_routes: "Ampliar las rutas marítimas"
 INS_expand_sea_routes_desc: "Nuestro país es rico en recursos naturales, pero la industria de extracción está demasiado especializada, y carecemos de las infraestructuras necesarias para extraer determinados minerales escasos, como el cromo y el tungsteno. Si queremos mejorar nuestra capacidad de producción militar, tendremos que importarlos de otra parte. Para sacarle el máximo partido a nuestra red comercial en expansión, necesitaremos aumentar la capacidad de nuestra flota mercante."
 INS_ship_contracts: "Conseguir contratos navales"
 INS_ship_contracts_desc: "Construir una armada es necesario para mantener nuestras rutas de comercio en caso de guerra. Podemos utilizar nuestras nuevas relaciones comerciales para obtener contratos navales."
 # <Industry Branch - Sumatra>
 INS_developing_sumatra: "Desarrollar Sumatra"
 INS_developing_sumatra_desc: "Sumatra es la isla con recursos más ricos, y sin embargo la infraestructura es tan pobre que una gran proporción de los recursos extraídos jamás llegarán a Batavia. El transporte depende de un mosaico de caminos de tierra y líneas ferroviarias desconectadas, totalmente insuficientes para respaldar nuestros planes para la isla. No podemos dejar que esto siga así."
 INS_sumatra_railway: "El ferrocarril de Sumatra"
 INS_sumatra_railway_desc: "Como parte de nuestros esfuerzos para desarrollar la infraestructura de Sumatra, deberíamos construir un gran ferrocarril que se extienda desde el norte de Atjeh hasta el puerto más al sur de Sumatra, que tiene una conexión muy rápida a Batavia por barco. De este modo, los recursos solo tendrán que ser transportados a la estación de tren más cercana, desde la que podremos trasladarlos a Batavia en cuestión de días."
 INS_develop_borneo: "Desarrollar Kalimantan"
 INS_develop_borneo_desc: "Kalimantan tiene una gran riqueza potencial, y sin embargo la isla apenas está desarrollada y su población está asolada por la pobreza. El transporte de carga depende en gran medida de los numerosos ríos y vías acuáticas de la isla, y todas las comunicaciones a largo alcance tienen el impedimento de la falta de electricidad. Si construimos tendido eléctrico y carreteras, podremos preparar el camino para inspeccionar el terreno y extraer recursos."
 INS_kalimantan_mic: "Industria militar de Kalimantan"
 INS_kalimantan_mic_desc: "Nuestros esfuerzos de desarrollo de infraestructura han dado sus frutos. Extender la electricidad y las comunicaciones nos ha puesto en contacto con comunidades que solían estar inaccesibles a la llamada del Gobierno. Podemos usar esta oportunidad para satisfacer nuestras necesidades de una mayor producción militar construyendo nuevas fábricas en la región, que llenaremos con esta nueva fuente de mano de obra."
 INS_pontianak_to_balikpapan: "Desde Pontianak a Tanjung Selor"
 INS_pontianak_to_balikpapan_desc: "Se ha debatido en profundidad la idea de construir un ferrocarril en Kalimantan, pero el terreno árido y generalmente sin explorar del centro de la isla lo convierte en una tarea difícil. La única solución es un ferrocarril en forma de U de costa a costa. No será barato, pero a la larga se amortizará solo."
 INS_develop_sulawesi: "Desarrollar Célebes"
 INS_develop_sulawesi_desc: "Célebes es el centro del archipiélago, y por tanto un emplazamiento estratégico importante. Deberíamos construir carreteras, tendido eléctrico y comunicaciones para garantizar que pueda usarse como centro militar en caso de guerra."
 # <Industry Branch - Bangka Project>
 INS_the_bangka_project: "El proyecto Bangka"
 INS_the_bangka_project_desc: "Las islas de Bangka-Belitung, pese a su pequeño tamaño, son una piedra angular de la economía indonesia debido a sus depósitos de bauxita. Debemos reconstruir carreteras, puertos y ferrocarriles en Bangka-Belitung para garantizar el acceso a todas las recompensas que nos ofrece la riqueza mineral de las islas."
 INS_aluminium_factory: "Fábrica de aluminio en Pangkalpinang"
 INS_aluminium_factory_desc: "Nuestra extracción de bauxita en bruto está creciendo, pero nuestra falta de producción nacional de aluminio está limitando nuestros beneficios. Como capital provincial de las islas de Bangka-Belitung, Pangkalpinang sería un lugar ideal para establecer nuestras propias fábricas. Hacerlo nos permitiría eliminar los intermediarios y maximizar su rentabilidad."
 INS_bauxite_export: "Apostar fuerte por la exportación de bauxita"
 INS_bauxite_export_desc: "Tras completar el proyecto Bangka tenemos tanta bauxita en bruto que no sabemos ni qué hacer con ella. Aunque resultaría difícil intentar venderla toda, podríamos ofrecer un precio más bajo que nadie en el mercado, lo que garantizaría vender hasta el último gramo. Debido a la inmensa cantidad de bauxita que podemos vender, eso seguiría ofreciendo un crecimiento proporcional de beneficios en comparación con nuestras exportaciones actuales."
 INS_tin_mining: "Inversión en la extracción de estaño"
 INS_tin_mining_desc: "La historia de la minería de estaño en las islas de Bangka-Belitung es anterior a la presencia europea en el archipiélago. No es de extrañar entonces que la industria del estaño de las islas vaya pidiendo una modernización. Renovar la capacidad de producción es una iniciativa costosa y nuestra industria existente del estaño no estará operativa por un tiempo mientras la reconstruimos. Sin embargo, tiene un potencial significativo para ofrecer beneficios a largo plazo."
 in_240_days_tt: "§YEn 240 días:§!\n"
 INS_tin_to_usa: "Vender estaño a [USA.GetNameDef]"
 INS_tin_to_usa_desc: "[USA.GetNameDefCap] tiene muchas corporaciones e instituciones gubernamentales que compran estaño. Ahora que hemos establecido operaciones mineras sólidas, tenemos la oportunidad de sacar muchos beneficios."
 INS_tin_to_japan: "Vender estaño a [JAP.GetNameDef]"
 INS_tin_to_japan_desc: "[JAP.GetNameDefCap] tiene muchos barcos que ahora están considerados obsoletos y sustituibles, pese a ser perfectos para la armada [INS.GetAdjective]. Deberíamos comprar estos barcos con el dinero de nuestra producción de estaño."
 INS_tin_to_japan_tt: "[JAP.GetNameDefCap] nos enviará §Y9§! destructores más antiguos."
 INS_new_bauxite_routes: "Nuevas rutas de bauxita"
 INS_new_bauxite_routes_desc: "Nuestra estrategia de ofrecer precios más baratos que el resto del mercado para aumentar nuestro volumen de exportaciones de bauxita ha tenido éxito. Sin embargo, no deberíamos detenernos ahí. Deberíamos seguir expandiendo nuestras redes comerciales, optimizar nuestras cadenas de suministro y buscar cualquier otra oportunidad de maximizar la rentabilidad."
 INS_bangka_bauxite_export_flag: "Ha completado el enfoque §Y$INS_bauxite_export$§!:"
 INS_not_industry: "Planear el futuro"
 INS_not_industry_desc: "Java es el corazón mismo de nuestra nación, hogar del grueso de nuestra población y la sede de nuestro gobierno. Antes de que podamos industrializar la isla en condiciones, debemos preparar el terreno. Estudiarlo, dividirlo en zonas y despejar emplazamientos concretos garantizará que cuando lleguen las fábricas, se construyan en el lugar donde más ayuden."
 INS_construction_focus: "Auge industrial"
 INS_construction_focus_desc: "El capital extranjero está entrando, los ingresos por exportaciones están subiendo y por primera vez en años hay realmente dinero para invertir en la industria nacional. Debemos aprovechar el momento y construir mientras las condiciones nos son favorables."
 # <Industry Branch - Java>
 INS_developing_java: "Ampliar las infraestructuras de Java"
 INS_developing_java_desc: "Java es con gran diferencia la isla más industrializada del archipiélago y la fuente de la mayoría de nuestra riqueza. Sin embargo, ciertas ciudades como Batavia se están quedando cada vez más abarrotadas debido al crecimiento de la población. Deberíamos expandir esas ciudades con nuevos hogares, áreas comerciales, tranvías, trenes y fábricas para apoyar el crecimiento de la población."
 INS_prioritize_sugar_economy: "Dar prioridad a la economía azucarera"
 INS_prioritize_sugar_economy_desc: "Deberíamos reducir el presupuesto gubernamental para el desarrollo industrial de Batavia. Ya está mucho más industrializada que cualquier otra ciudad del archipiélago. En vez de eso, deberíamos usar este dinero para establecer muchas plantaciones pequeñas de palma por todo el país. Estas plantaciones producirán azúcar de palma, que es un producto básico con una elevada demanda internacional."
 INS_all_cards_into_industry: "Todo a la industria"
 INS_all_cards_into_industry_desc: "La industrialización ha tenido un enorme impacto en la economía de [1058.GetName]. Si industrializamos toda la isla, con sus decenas de millones de ciudadanos, podríamos volvernos influyentes a escala global."
 INS_expand_batavia_technical_institute: "Expandir el Instituto de Tecnología de Batavia"
 INS_expand_batavia_technical_institute_desc: "Expandir el Instituto de Tecnología de Batavia permitirá ampliar el número de personas con estudios y aumentar la tasa de nuestro desarrollo tecnológico."
 INS_quinine_export: "Acuerdo de quinina más lucrativo"
 INS_quinine_export_desc: "La Oficina de Chinchona en Ámsterdam casi tiene el monopolio de las exportaciones de quinina, lo que resulta especialmente beneficioso, pues la quinina es muy demandada en todo el mundo como tratamiento para la malaria. La Oficina obtiene la mayoría de su quinina de las Indias Orientales. Pese a ello, recibimos una porción muy pequeña de los beneficios. Deberíamos usar nuestra producción de quinina como medio de presión para negociar un acuerdo más justo."
 INS_spend_profits_on_rural: "Gastar beneficios en el desarrollo rural"
 INS_spend_profits_on_rural_desc: "Tras cerrar nuestro nuevo acuerdo en referencia a la quinina, nos encontramos con una oportunidad de usar nuestros ingresos adicionales para desarrollar la infraestructura de transporte y comunicaciones en las zonas rurales, allanando el camino para un futuro desarrollo industrial."
 INS_spend_profits_on_urban: "Gastar beneficios en el desarrollo urbano"
 INS_spend_profits_on_urban_desc: "Tras cerrar nuestro nuevo acuerdo en referencia a la quinina, nos encontramos con una oportunidad de usar nuestros ingresos adicionales para expandir la industria de fabricación, que diversificará nuestra economía y reducirá nuestra dependencia de la exportación de materias primas."
 INS_spend_profits_on_military: "Gastar beneficios en el desarrollo militar"
 INS_spend_profits_on_military_desc: "Tras cerrar nuestro nuevo acuerdo en referencia a la quinina, nos encontramos con una oportunidad de mejorar nuestro ejército significativamente gastando nuestros ingresos adicionales en construir y mantener nuevas fábricas de armamento en Yogyakarta y Semarang."
 INS_end_to_bloodshed_tt: "La guerra terminará con nuevas fronteras trazadas basándose en la ocupación actual. Java, Sumatra y Borneo se §Yanexionarán§! al bando que tenga actualmente mayor control en la zona."
