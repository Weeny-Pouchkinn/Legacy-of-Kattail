 idea_SIA_weather_broadcasts: "Informes meteorológicos"
 idea_SIA_weather_broadcasts_desc: "Los informes meteorológicos permiten a nuestras fuerzas aéreas y navales conocer las condiciones climatológicas de antemano, lo que mejora su eficacia y reduce el riesgo de actuar cuando estas se presentan adversas."
 idea_SIA_seri_thai_contacts: "Contactos del Seri Thai"
 idea_SIA_seri_thai_contacts_desc: "Tener contactos en la red de resistencia del Seri Thai nos está resultando muy útil, pues ahora contamos con más luchadores avezados y hemos estrechado lazos con los Aliados."
 idea_SIA_secure_rubber_islands: "Tomar las islas del caucho"
 idea_SIA_joint_military_command: "Mando militar conjunto"
 idea_SIA_joint_military_command_desc: "La estructura de mando unificada ha mejorado la coordinación entre grupos y acelerado el desarrollo de los oficiales experimentados y la doctrina de combate."
