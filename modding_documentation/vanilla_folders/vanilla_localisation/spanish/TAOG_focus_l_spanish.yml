 ABDA_keep_trade_open_modifier_tt: "Modifica §Y$ABDA_supreme_command$§! en:\n§G+10%§! de eficacia de pantalla\n§G+10%§! de defensa de pantalla"
 ABDA_unified_naval_command_modifier_tt: "Modifica §Y$ABDA_supreme_command$§! en:\n§G+10%§! de ganancia de experiencia naval"
 ABDA_develop_naval_infrastructure_ast_tt: "[AST.GetName] recibe §Y2 astilleros§! en un territorio esencial."
 ABDA_develop_naval_infrastructure_ins_tt: "[INS.GetName] recibe §Y2 astilleros§! en un territorio esencial."
 ABDA_develop_naval_infrastructure_generic_tt: "Dependiendo de la pertenencia al §YABDACOM§!, [AST.GetName] y [INS.GetName] pueden recibir 2 astilleros cada uno en sus territorios esenciales."
 ABDA_expand_the_command_tt: "Extiende la pertenencia al ABDACOM a [SIA.GetName], [NZL.GetName] y [MAL.GetName] si están en nuestra facción, otorgándoles el modificador completo de §Y$ABDA_supreme_command$§! con su fuerza actual."
