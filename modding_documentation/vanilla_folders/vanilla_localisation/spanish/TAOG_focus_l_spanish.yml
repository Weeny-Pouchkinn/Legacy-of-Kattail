 ###   SIAM   ###
 ################
 SIA_the_khana_ratsadon: "El Khana Ratsadon"
 SIA_the_khana_ratsadon_desc: "El Partido del Pueblo puso fin al absolutismo y allanó el camino hacia un gobierno constitucional. Su legado ha quedado en entredicho, traicionado y manchado de sangre, pero sigue siendo la base sobre la que puede construirse un [SIA.GetName] moderno."
 SIA_the_khana_ratsadon_tt: "\nEl §YKhana Ratsadon§! pasa a estar activo.\n\nEl §YKhana Ratsadon§! es el principal partido de [ROOT.GetName], que está dividido en el §Yala militar§! y el §Yala civil§!.\n\nAl §Yala civil§! generalmente le gustan las políticas prodemocráticas centradas en las industrias civiles, mientras que al §Yala militar§! generalmente le gustan las políticas profascistas y la militarización de la industria.\n\nNuestras elecciones harán que les gustemos más o menos, dándonos distintas bonificaciones o penalizaciones.\nSi se vuelven rebeldes, pueden intentar dar un golpe de Estado.\n\nLos distintos estados de aprobación de un ala son §Yinsurrecta§!, §Yen oposición§!, §Yneutral§!, §Yapoyo leve§! y §Yapoyo total§!."
 SIA_shuffle_pridi_to_the_minister_of_interior: "Reforzar la posición del ala civil"
 SIA_shuffle_pridi_to_the_minister_of_interior_desc: "Si, en lugar de ministro de Asuntos Exteriores, nombramos a Pridi ministro del Interior, le será más fácil administrar los recursos del gobierno y poner coto a la influencia militar, que no hace sino crecer."
 SIA_shuffle_pridi_to_the_minister_of_interior_tt: "§Y$anti_fascist_raids$§! aumentará ahora la aprobación de las §Yalas civiles§! y reducirá la aprobación de las §Yalas militares§!."
 SIA_civil_nationalism: "Nacionalismo civil"
 SIA_civil_nationalism_desc: "Independientemente de su condición social, todo tailandés ha de saber que no debe lealtad a un gobierno o mandatario. Es su cometido, más bien, encarnar los valores de la libertad, la autonomía y la igualdad en todo momento, ocupe el poder quien lo ocupe."
 SIA_the_true_heirs_of_1932: "Los verdaderos legatarios de 1932"
 SIA_the_true_heirs_of_1932_desc: "El ejército es muy dado a presentar la Revolución de 1932 como un mérito exclusivamente propio, cuando en realidad la victoria fue de todo el pueblo. Tan solo hay que recordárselo a nuestras gentes, y de estas dimanará nuestra fuerza."
 SIA_thammasat_university: "Universidad Thammasat"
 SIA_thammasat_university_desc: "Debemos expandir y expandiremos la Universidad Thammasat, recién fundada, pues será esta institución la que allane el camino del progreso y la innovación en Tailandia."
 SIA_defenders_of_constitutional_liberty: "Defensores de la libertad constitucional"
 SIA_defenders_of_constitutional_liberty_desc: "Maestros, banqueros, enfermeros... Las clases medias formadas pueden movilizarse como un colectivo unido con el fin de defender su libertad si el estamento militar acabara por excederse."
 SIA_dominate_public_symbols: "Dominar la simbología pública"
 SIA_dominate_public_symbols_desc: "El ejército lleva ya demasiado tiempo apropiándose de símbolos públicos, erigiendo estatuas y declarando festivos con el solo fin de enaltecerse a sí mismo. Sobre nuestros hombros recae la posibilidad de revertir esta tendencia consolidando símbolos propios que exalten el derecho a la autodeterminación del pueblo y su victoria sobre la autocracia de antaño."
 SIA_civil_service_heroism: "Servicio civil heroico"
 SIA_civil_service_heroism_desc: "Es preciso infundir a todo ciudadano tailandés la responsabilidad de defender el Estado de derecho si cualquier poder, ya sea foráneo o patrio, tratara de adueñárselo. El día que alguien pretenda arrebatarnos nuestras libertades, necesitaremos el respaldo de un pueblo que se considere adalid de estas."
 SIA_spread_democratic_sentiment_in_universities: "Inculcar el pensamiento demócrata en las universidades"
 SIA_spread_democratic_sentiment_in_universities_desc: "El futuro de [SIA.GetName] está en manos de su claustro de académicos. Sus enseñanzas determinarán el porvenir de la nación y, si los académicos de hoy se saben portadores de una gran responsabilidad democrática, esta mañana se extenderá más allá de las aulas universitarias."
 SIA_sideline_disloyal_officers: "Apartar a los oficiales desleales"
 SIA_sideline_disloyal_officers_desc: "El cuerpo de oficiales del ejército no es un monolito. Sus filas están compuestas por hombres leales a sus antiguos patrones, facciones rivales o sus propias ambiciones por encima del gobierno. Con unos pequeños reajustes y un poco de presión administrativa, los destinaremos a puestos en los que no supongan amenaza alguna, mientras que a quienes hayan demostrado ser dignos de confianza se les conferirán las responsabilidades que merecen."
 SIA_sideline_disloyal_officers_tt: "Dos generales al azar adquirirán durante cuatro años el rasgo §YReasignado§!, que les impedirá otorgar bonificaciones.\nDos generales al azar que no posean el rasgo §YReasignado§! adquirirán un rasgo positivo extra, y sus atributos mejorarán."
 SIA_direct_funds_from_the_military_towards_development: "Destinar financiación militar al desarrollo nacional"
 SIA_direct_funds_from_the_military_towards_development_desc: "Aunque al estamento militar le indignará que parte de su financiación se desvíe a fines de desarrollo, serán ellos, y no nosotros, quienes tengan que explicar al público de qué manera les beneficiará exactamente privarse de esos fondos."
 SIA_as_the_eyes_turn_towards_southeast_asia: "Todas las miradas puestas en Asia"
 SIA_as_the_eyes_turn_towards_southeast_asia_desc: "El Sudeste Asiático ya no es un escenario lejano. Es la encrucijada del imperio, la revolución y la guerra. [SIA.GetName] debe decidir si será un peón en esta lucha o una potencia con sus propios designios."
 SIA_support_songsuradets_military_clique: "Apoyar a la camarilla militar de Songsuradet"
 SIA_support_songsuradets_military_clique_desc: "No todos los oficiales son enemigos de la nación. Songsuradet y sus partidarios ofrecen una alternativa militar disciplinada a los generales corruptos que llevaron a Siam al borde del precipicio. Con su apoyo, se podrá restablecer el orden sin dejar el Estado al borde del caos."
 SIA_support_songsuradets_military_clique_tt: "Si estalla una §Yguerra civil§!, Songsuradet nos respaldará aportándonos §Y3§! divisiones adicionales.\n§RSi fortalecemos a Songsuradet y luego intentamos arrestarlo mediante $SIA_the_songsuradet_rebellion$ podría resistirse.§!"
 SIA_the_royal_police_counterweight: "Policía real"
 SIA_the_royal_police_counterweight_desc: "La policía real funciona como una fuerza independiente que puede contribuir a pararle los pies a la oposición si esta trata de hacerse con el poder."
 SIA_the_royal_police_counterweight_tt: "Si estallara una §Yguerra civil§!, la policía real nos respaldará aportándonos §Y2§! división adicional."
 SIA_for_the_preservation_of_siamese_independence: "Consolidar control del ala militar"
 SIA_for_the_preservation_of_siamese_independence_desc: "A lo largo del siglo pasado, diversas potencias mundiales se ensañaron con la integridad territorial [SIA.GetAdjective], una tendencia que no manifiesta indicios de cambio en este siglo. Si queremos conservar las costumbres que nos definen, debemos obrar con decisión; de lo contrario, el nuestro acabará siendo un Estado maltratado, fragmentado y dependiente de la tiranía ajena."
 SIA_for_the_preservation_of_siamese_independence_tt: "§Y$anti_democratic_raids$§! aumentará ahora la aprobación de las §Yalas militares§! y reducirá la aprobación de las §Yalas civiles§!."
 SIA_the_peoples_day: "Día del Pueblo"
 SIA_the_peoples_day_desc: "En lugar de subrayar la contribución del ejército al derrocamiento de la antigua monarquía, convendría más hacer hincapié en el valor del mismo pueblo. Decretar un Día del Pueblo afianzará los cimientos de nuestra nación y acostumbrará a la ciudadanía a exigir el respeto que merece."
 SIA_hold_military_parades: "Celebrar desfiles militares"
 SIA_hold_military_parades_desc: "A fin de elevar la moral de las tropas, premiar la lealtad de nuestros mejores generales y recordar a la ciudadanía lo poderosas que son las fuerzas armadas [SIA.GetAdjective], organizaremos un soberbio desfile en las avenidas de Bangkok. ¡Los periódicos tendrán al fin algo digno que contar!"
 SIA_embed_technocrats_in_civilian_institutions: "Integrar a tecnócratas en instituciones civiles"
 SIA_embed_technocrats_in_civilian_institutions_desc: "Podemos engranar figuras tecnócratas en el aparato gubernamental con el fin de forjar alianzas. Además, esos tecnócratas representarían los intereses de la ciudadanía, ejerciendo así como un cortafuegos que delimite la influencia del ejército."
 SIA_military_academies_indoctrination: "Adoctrinamiento en academias militares"
 SIA_military_academies_indoctrination_desc: "Nuestras academias militares son el caldo de cultivo perfecto para la introducción de ideologías. No falta en ellas armamento, y los jóvenes cadetes son muy maleables en manos de sus instructores. Si nos ganamos a los instructores, serán nuestras también las juventudes. Un ejército fuerte y leal al gobierno es la base sobre la que se erige todo Estado poderoso, como lo será el nuestro."
 SIA_the_king_of_the_white_elephant: "El rey del elefante blanco"
 SIA_the_king_of_the_white_elephant_desc: "La recuperación de territorios perdidos ha provocado una histeria colectiva que amenaza con desmoronar por completo nuestra nación ante los ojos del mundo. Este fervor lo aplacaremos produciendo un largometraje antibelicista, el primer film tailandés rodado en inglés, que habrá de mostrar al mundo el verdadero rostro de [SIA.GetName]."
 SIA_the_king_of_the_white_elephant_tt: "Desbloquea la campaña de propaganda §Y$SIA_the_king_of_the_white_elephant$§! al completar el enfoque §Y$SIA_sala_chaloem_thai_movie_theater$§!, lo que otorga:\nEstabilidad semanal: §G+0,45%§! durante 180 días."
 SIA_drum_up_irredentism: "Instigar al irredentismo"
 SIA_drum_up_irredentism_desc: "No basta con asegurarnos el respaldo del ejército de cara a una posible guerra venidera; debemos ganarnos también a la opinión pública. Con poemas, películas y discursos, prepararemos a [SIA.GetName] para hacer frente a las potencias imperialistas que nos robaron esos territorios que nos pertenecen."
 SIA_sell_privy_purse_lands: "Vender tierras de la Corona"
 SIA_sell_privy_purse_lands_desc: "La casa real consta como propietaria de extensos territorios que ahora pertenecen al Estado. Estas tierras bien pueden servir para llenar las arcas, y algunas parcelas podrían venderse a un precio módico a oficiales selectos, asegurándonos así su lealtad."
 SIA_sell_privy_purse_lands_tt: "Transcurrido este espíritu, se hará público un escándalo de §Y[SIA_phraya_phahon.GetName]§! que te permitirá acceder a §Y$SIA_phibuns_premiership$§! sin tener que cumplir el requisito fascista."
 SIA_war_fervor: "Fervor bélico"
 SIA_war_fervor_desc: "Truenan los tambores anunciando el conflicto que se avecina. El pueblo aguarda ansioso, ha saltado ya la chispa y el fervor bélico roza ya su apogeo. Con la máxima prudencia, debemos canalizar esa vehemencia hacia una causa justa."
 SIA_war_fervor_tt: "El apoyo bélico crecerá sin parar hasta que declaremos la guerra a cualquier otro país, y entonces se eliminará el espíritu.\n\nSi el §Yapoyo bélico§! rebasa el §Y95%§! y pasa demasiado tiempo sin que se dé una declaración de guerra, dará comienzo una guerra civil.\nAl declarar la guerra:"
 SIA_the_midnight_meeting: "Encuentro a medianoche"
 SIA_the_midnight_meeting_tt: "[SIA_plaek_phibunsongkhram.GetName] tomará el poder en [SIA.GetNameDef], dirigiendo el gobierno. Debemos derrocarlo para restaurar la monarquía adecuadamente."
 SIA_the_midnight_meeting_desc: "El mariscal de campo Songsuradet observa que Phibun acumula cada vez más poder y le parece que llevará a un ajuste de cuentas. Si la monarquía y Songsuradet quieren sobrevivir, los monárquicos, los altos funcionarios y los civiles eminentes deberán reunirse en secreto y acordar la destitución de Phibun antes de que él actúe contra ellos primero."
 SIA_meet_with_king_prajadhipok: "Reunión con el rey Prajadhipok"
 SIA_meet_with_king_prajadhipok_desc: "Una conspiración que no cuenta con un rey solo es otra intriga militar. Si se reúnen con el rey Prajadhipok en el exilio, podremos amparar su causa bajo el paraguas de la legitimidad real y asegurar el beneplácito del único hombre cuyo regreso podría captar a los indecisos y dividir al régimen."
 SIA_prajadhipok_audience_with_churchill: "Audiencia de Prajadhipok con [ENG.GetLeader]"
 SIA_prajadhipok_audience_with_churchill_desc: "La presencia de Prajadhipok en [ENG.GetName] ofrece algo más que simplemente prestigio. Si convence a [ENG.GetLeader] de que un alzamiento lealista es bueno para los intereses británicos en Asia, puede que armas de Malaya acaben en manos de hombres que aún son fieles al trono."
 SIA_prajadhipok_audience_with_churchill_tt: "[ENG.GetName] nos proporcionará "
 SIA_prajadhipok_audience_with_churchill_tt2: "Al inicio de la guerra civil."
 SIA_facilitate_prajadhipoks_move_to_japan: "Facilitar el traslado de Prajadhipok a Japón"
 SIA_facilitate_prajadhipoks_move_to_japan_desc: "Gran Bretaña no es la única potencia que puede beneficiarse de la agitación de [ROOT.GetNameDef]. Al ocuparnos del traslado de Prajadhipok a Japón, es posible que obtengamos el favor de Tokio y quizá la garantía de que nos ofrecezcan divisiones en caso de que un alzamiento monárquico desencadene la guerra civil."
 SIA_facilitate_prajadhipoks_move_to_japan_tt: "3 divisiones de rangers de [JAP.GetNameDef] nos apoyarán durante la guerra civil."
 SIA_the_kings_gambit: "Gambito de rey"
 SIA_the_kings_gambit_desc: "Prajadhipok volverá a Bangkok contando totalmente con que el régimen lo pondrá bajo arresto. Ese acto proporcionará a los monárquicos la indignación, la legitimidad y la autoridad que necesitan para dejar a un lado las dudas y alzarse en su nombre. Una vez que apresen al rey exiliado, se dará la señal y comenzará la lucha por [ROOT.GetName]."
 SIA_the_kings_gambit_tt: "Nuestro apoyo dependerá de cuántas camarillas tengamos de nuestra parte."
 SIA_restore_order: "Restablecer el orden"
 SIA_restore_order_desc: "Hemos ganado la guerra civil, pero la victoria por sí sola no cierra las heridas de un reino. Hay que reconstruir los escombros, pacificar a la vieja guardia y reconstruir la administración para que [ROOT.GetName] emerja del desorden con la Corona afianzada y la vida pública retomando su curso."
 SIA_ananda_age_trigger_12: "El rey Ananda tiene al menos §Y12§! años (actualmente §Y[?var:SIA_anandas_age]§!). Su cumpleaños es el 20 de septiembre."
 SIA_ananda_age_trigger_15: "El rey Ananda tiene al menos §Y15§! años (actualmente §Y[?var:SIA_anandas_age]§!). Su cumpleaños es el 20 de septiembre."
 SIA_ananda_trait_tt: "Cuando Ananda ascienda al trono, obtendrá:"
 SIA_to_forge_a_king: "La forja de un rey"
 SIA_to_forge_a_king_desc: "El rey Ananda sigue viviendo su juventud en Suiza. Su inmadurez lo hace perfecto para que, si orientamos su formación adecuadamente, estemos a tiempo no solo de forjar a un testaferro con corona, sino también a un gobernante apropiado para el destino que pretendemos darle a [ROOT.GetNameDef]."
 SIA_to_forge_a_king_tt: "El futuro rey Ananda Mahidol aún es joven y estudia en [SWI.GetName]. Podemos influir en sus futuros estudios e intereses, garantizando que se convierta en un gran rey.\n\nCada año por su cumpleaños y hasta que cumpla los 15 podremos elegir algo que nos interese que estudie, que otorgará distintas bonificaciones cuando al fin ascienda al trono.\n\nSu cumpleaños es el 20 de septiembre y tiene §Y[?var:SIA_anandas_age]§! años."
 SIA_ascend_the_throne: "Ascenso al trono"
 SIA_ascend_the_throne_desc: "Los años de regencia no pueden continuar para siempre. Ananda ya tiene edad para asumir la carga del reinado sobre sus hombros, y su ascenso formal al trono permitirá que la monarquía restaurada pase de la tutela y las intrigas a un nuevo reinado legítimo."
 SIA_the_provincial_council_of_state: "Consejo Provincial de Estado"
 SIA_the_provincial_council_of_state_desc: "El conflicto deja la maquinaria del gobierno rota y con la autoridad en vilo. Hasta que el joven rey Ananda pueda gobernar en su propio nombre, un Consejo Provincial de Estado deberá servir como gobierno temporal y proclamar que los lealistas no luchen por ellos mismos, sino por la restauración de la monarquía legítima."
 SIA_the_regency_of_boworadet: "La regencia de Boworadej"
 SIA_the_regency_of_boworadet_desc: "El príncipe Boworadej ostenta el prestigio del antiguo orden y nadie puede poner en duda a quién le es leal. Al nombrarlo regente en nombre de Ananda, dejamos el Estado en manos conservadoras y dejamos claro que la restauración no se limitará a un mero cambio de ministros."
 SIA_the_sacred_hierarchy: "La jerarquía sacra"
 SIA_the_sacred_hierarchy_desc: "Boworadej sostiene que el reino es más fuerte cuando cada estamento conoce su lugar y la Corona se alza por encima de toda ambición temporal. La monarquía, la fe y la jerarquía intrínseca de [ROOT.GetNameDef] deben volver a ser tratadas como pilares sagrados más que reliquias con las que regatear."
 SIA_the_regency_of_songsuradet: "La regencia de Songsuradet"
 SIA_the_regency_of_songsuradet_desc: "Songsuradet no es un liberal, pero tampoco es ciego a las necesidades de un Estado moderno. Como regente, puede preservar la autoridad real a la vez que confía el futuro de [ROOT.GetNameDef] a la disciplina, la planificación y un programa de desarrollo nacional guiado militarmente."
 SIA_order_discipline_and_unity: "Orden, disciplina y unidad"
 SIA_order_discipline_and_unity_desc: "El caos de la política de facciones y la guerra civil casi ha destruido el reino. La respuesta de Songsuradet es simple: orden en el gobierno, disciplina en la sociedad y unidad en el propósito para que el reino pueda transformarse en un Estado más fuerte y más moderno."
 SIA_the_regency_of_rangsit: "La regencia de Rangsit"
 SIA_the_regency_of_rangsit_desc: "El príncipe Rangsit entiende que la monarquía solo podrá resistir si se reconcilia con el gobierno representativo. Su regencia ofrece una restauración real que es conservadora en su dignidad, pero democrática en su método y está preparada para darle a [ROOT.GetNameDef] un futuro parlamentario estable."
 SIA_constitutional_virtue: "Virtud constitucional"
 SIA_constitutional_virtue_desc: "Una monarquía que respeta la ley es más difícil de derrocar y más fácil de defender. Bajo la orientación de Rangsit, reviviremos el gobierno constitucional, limitaremos el poder arbitrario y enseñaremos a la nación que la Corona está más segura cuando se alza como guardiana de la libertad legítima."
 SIA_an_absolute_monarchy: "Monarquía absoluta"
 SIA_an_absolute_monarchy_desc: "El experimento de la monarquía limitada solo ha traído humillación, golpes de Estado y la usurpación de la autoridad real por oficiales ambiciosos. Si el trono quiere volver a inspirar lealtad una vez más, la Corona tendrá que recuperar sus prerrogativas plenas y gobernar sin subordinación a partidos o a un parlamento."
 SIA_a_constitutional_monarchy: "Monarquía constitucional"
 SIA_a_constitutional_monarchy_desc: "El trono no debe dominar el Estado para preservar el reino. Restaurando la monarquía en unos cimientos constitucionales duraderos, podemos establecer vínculos entre la Corona y el pueblo, y garantizar que la dignidad real coexista con un gobierno responsable."
 SIA_to_lay_the_bait: "Un señuelo"
 SIA_to_lay_the_bait_tt: "Filtraremos un plan económico falso para enemistarnos con el ejército.\nCuanto más retrasemos §Y$SIA_and_spring_the_trap$§!, mayor será la reacción negativa contra el ejército y más crecerá nuestro apoyo.\n\n$SIA_dem_event_count_cw_scale_tt$\n\nCada vez que el ejército critique la falsa llamada a filas nuestro apoyo en la guerra civil crecerá hasta un máximo del §Y75%§!. Se puede obtener un §Y25%§! de apoyo bélico adicional de nuestro apoyo democrático total (escalado de §Y0%-100%§!)."
 SIA_dem_event_count_cw_scale_tt: "§YApoyo previsto actual§!: §G[?var:SIA_dem_event_count_cw_scale|%]§!"
 SIA_to_lay_the_bait_desc: "El dosier amarillo pide una reforma económica, pero el ejército dirá que es una medida comunista. Si filtramos un primer borrador muy radical primero, podemos provocar su indignación y luego desacreditarlos cuando publiquemos la versión real más moderada."
 SIA_and_spring_the_trap: "Y se acciona la trampa"
 SIA_and_spring_the_trap_desc: "Los generales han mordido el anzuelo. Su indignación se ha convertido en rebelión, su rebelión ha dejado al descubierto sus ambiciones y el gobierno civil estaba preparado. Ahora se cierra la trampa y el futuro de [ROOT.GetName] lo decidirán los que son leales a la constitución."
 SIA_and_spring_the_trap_tt: "Si nuestro apoyo total supera el §Y80%§!, evitaremos una guerra civil y depondremos al ejército al instante."
 SIA_rebuild_the_war_torn_economy: "Reconstrucción económica de posguerra"
 SIA_rebuild_the_war_torn_economy_desc: "La guerra civil ha devastado las carreteras, fábricas, campos de arroz y rutas comerciales. La reconstrucción debe iniciarse de inmediato. Los salarios, el cereal, las vías ferroviarias y el crédito harán más por estabilizar [ROOT.GetName] que ningún discurso de Bangkok."
 SIA_end_military_grift: "El fin del fraude militar"
 SIA_end_military_grift_desc: "Durante demasiado tiempo, los presupuestos militares han hecho crecer fortunas privadas, redes clientelares y proyectos inútiles para ganar prestigio. La guerra ha destapado toda esa podredumbre. Debe investigarse cada contrato corrupto, cada unidad cuya existencia no es reconocida y cada cargamento robado, arrebatándoselos a la antigua camarilla."
 SIA_the_purge: "La purga"
 SIA_the_purge_desc: "La camarilla militar ha provocado un baño de sangre en la nación para no someterse al gobierno civil. No puede haber medias tintas con los traidores. Sus oficiales, colaboradores y simpatizantes deben ser eliminados del mando a todos los niveles para que no puedan volver a amenazar al Estado."
 SIA_achieve_foreign_legitimacy: "Lograr legitimidad en el extranjero"
 SIA_achieve_foreign_legitimacy_desc: "Las potencias extranjeras han observado nuestra crisis sin fiarse mucho, esperando a ver si Siam sucumbía a una junta militar o a la revolución. Debemos demostrar que el gobierno civil es estable, legítimo y capaz de defender el país."
 SIA_achieve_foreign_legitimacy_trigger: "La opinión de cualquier gran potencia sobre nosotros es superior a §Y75§!"
 SIA_countries_that_like_me_doctrine_tt: "§Y[?var:SIA_countries_that_like_me]§! bonificación/bonificaciones del §G50%§! de reducción de coste para: §YDoctrina terrestre§!."
 SIA_achieve_foreign_legitimacy_tt: "Gana §G[?var:SIA_achieve_foreign_legitimacy_base_stab_gain|%.0]§! de estabilidad por cada gran potencia que tenga una opinión de nosotros superior a §Y75§!.\n\nSi más de §Y3§! grandes potencias cumplen lo requerido, también ganaremos §Y1§! reducción de coste del §G50%§! en: §YDoctrina terrestre§! para cada gran potencia que lo cumpla por encima de ese límite.\n\nSi §Y6§! o más grandes potencias lo cumplen, ganaremos §G2§! §Yfábricas civiles§!."
 SIA_secure_the_state: "Asegurar el Estado"
 SIA_secure_the_state_desc: "Vencer en la guerra civil no garantiza la estabilidad. Los ferrocarriles, puertos, arsenales y centros de comunicaciones deben asegurarse antes de que los oficiales reaccionarios puedan reagruparse. Bangkok debe mantenerse en calma, conectada y bajo un firme control civil."
 SIA_expand_upon_the_dossier: "Ampliar el dosier"
 SIA_expand_upon_the_dossier_desc: "El dosier amarillo se escribió para un momento de fragilidad, y ese momento ha pasado. Con la camarilla militar derrotada, podemos dar un paso más: una reforma agraria más profunda, protección laboral más sólida y un Estado capaz de rehacer Siam de arriba abajo."
 SIA_military_oversight_bureau: "Departamento de inspección militar"
 SIA_military_oversight_bureau_desc: "No se puede permitir que el ejército vuelva a convertirse en un Estado dentro del Estado. Un departamento de inspección controlado por los civiles monitoreará los nombramientos, los presupuestos y la actividad política dentro de las fuerzas armadas, garantizando que los cuarteles respondan a Bangkok y no al revés."
 SIA_military_oversight_bureau_tt: "El §Ydepartamento de inspección militar§! investiga a generales cada cinco o nueve meses. Durante esos periodos, los generales afectados actúan con una eficiencia reducida por su temor al mayor escrutinio que sufren."
 SIA_the_yellow_dossier: "El dosier amarillo"
 SIA_the_yellow_dossier_desc: "El borrador radical falso ha cumplido su misión. Ahora se podrá implementar el verdadero dosier amarillo: una reforma comedida, la modernización económica y medidas políticas de protección diseñadas para romper el dominio militar sin someter a la nación al caos."
 SIA_achieve_domestic_legitimacy: "Lograr la legitimidad nacional"
 SIA_achieve_domestic_legitimacy_desc: "El gobierno ha sobrevivido por la fuerza de las armas, pero ahora debe ganar por la ley, la prosperidad y el orden. La confianza pública debe recuperarse, las medidas de emergencia deben justificarse y el pueblo debe ver que el gobierno civil ofrece algo más que la mera supervivencia."
 SIA_achieve_domestic_legitimacy_tt: "Se desmantelará el §Ysistema del Khana Ratsadon§!.\nEl §Yala militar§! se disolverá para siempre, por lo que dejará de existir.\n\nEl §Yala civil§! se transformará en §Y$idea_SIA_unwavering_civilian_support$§!."
 SIA_allies_integration: "Integración con los Aliados"
 SIA_allies_integration_desc: "Nuestras fuerzas deben aprender a luchar junto con las de los Aliados. Las estructuras de mando, las comunicaciones, los procedimientos de suministro y las normas de equipamiento deben armonizarse para que Siam pueda ser algo más que un socio simbólico."
 SIA_prepare_for_a_pacific_war: "Prepararse para una guerra en el Pacífico"
 SIA_prepare_for_a_pacific_war_desc: "Los imperios vuelven sus miradas hacia el Pacífico. Las ambiciones de Japón, las colonias europeas y la estrategia aliada apuntan a una tormenta en ciernes. Siam debe prepararse antes de que los primeros cañonazos alcancen nuestras costas."
 SIA_the_end_of_gunboat_diplomacy: "El fin de la diplomacia de cañonero"
 SIA_the_end_of_gunboat_diplomacy_desc: "Los buques de guerra extranjeros nunca más volverán a dictar sus términos desde la desembocadura del Chao Phraya. Siam debe estar en posesión de los cañones, los muelles, las minas y las defensas costeras necesarias para que cualquier amenaza contra Bangkok se convierta en un acto de locura."
 SIA_preemtive_strike: "Ataque preventivo"
 SIA_preemtive_strike_desc: "Esperar a que Japón elija la hora de la guerra sería una locura. Si el imperio pretende abrirse paso como un tifón por Asia, entonces [SIA.GetName] debe atacar antes de que sus ejércitos y flotas estén totalmente comprometidos en otro lugar."
 SIA_the_siamese_armada: "La armada [SIA.GetAdjective]"
 SIA_the_siamese_armada_desc: "Un [SIA.GetName] moderno requiere una flota moderna. Con nuevos barcos, tripulaciones entrenadas y una infraestructura naval ampliada, la armada [SIA.GetAdjective] se convertirá en una fuerza capaz de defender nuestras costas y proyectar nuestro poder más allá de ellas."
 SIA_asian_democratic_compact: "Conglomerado demócrata asiático"
 SIA_a_more_moderate_option: "Una opción más moderada"
 SIA_a_more_moderate_option_desc: "La reforma debe resistir, no apagarse en medio de una tormenta de oposición. Al mantener el dosier amarillo dentro de unos límites moderados, podremos aislar a los extremistas, calmar a las clases medias y asentar un orden civil que sobreviva a su primera victoria."
 SIA_asian_democratic_compact_desc: "Asia no puede depender para siempre de imperios lejanos ni de promesas de grandes potencias. Las naciones democráticas de la región deben mantenerse unidas, defenderse unas a otras y demostrar que la independencia y la libertad pueden sobrevivir en Asia."
 SIA_asian_democratic_compact_tt: "Desbloquea la capacidad de exigir la independencia de estados vasallos asiáticos, permitiendo que los invitemos a nuestra facción."
 SIA_asian_democratic_compact_modify: "Modifica §Y$SIA_asian_democratic_compact$§! en:"
 SIA_southeast_asia_joint_command: "Mando conjunto en el Sudeste Asiático"
 SIA_southeast_asia_joint_command_desc: "Nuestro conglomerado debe convertirse en algo más que una promesa diplomática. Un mando conjunto coordinará la estrategia, el suministro, la inteligencia y los planes de defensa de todo el Sudeste Asiático, convirtiendo ejércitos individuales en un escudo común."
 SIA_pan_asian_weapon_standardization: "Estandarización armamentística panasiática"
 SIA_pan_asian_weapon_standardization_desc: "Que cada aliado use fusiles, calibres, radios y vehículos distintos es una invitación al fracaso logístico. El armamento estandarizado y los planes de producción compartidos permitirán armar a nuestra coalición de forma más sólida, barata y rápida."
 SIA_united_against_aggression: "Unidos contra el agresor"
 SIA_united_against_aggression_desc: "Ningún miembro de nuestro conglomerado se quedará solo. Sin importar que la amenaza provenga del imperio, del fascismo, del militarismo o de vecinos oportunistas, las naciones de Asia responderán a ella unidas."
 SIA_the_hammers_that_strike: "Los martillos que percuten"
 SIA_the_hammers_that_strike_desc: "Nuestra alianza ya no es un grupo de estados pequeños que tratan de sobrevivir. Es un arma. Cada nación es un martillo, y juntos golpearemos a cualquier potencia que pretenda dominar Asia."
 SIA_mobilize_the_defenders_of_siam: "Movilizar a los defensores de Siam"
 SIA_mobilize_the_defenders_of_siam_desc: "El antiguo ejército falló a la nación, pero Siam sigue necesitando defensores. Habrá que organizar a voluntarios, oficiales leales, guardias provinciales y ciudadanos patrióticos para establecer una fuerza que salvaguarde la constitución ante enemigos externos e internos."
 SIA_join_the_allies: "Sumarse a los Aliados"
 SIA_join_the_allies_desc: "[ROOT.GetName] no puede mantener su aislamiento mientras el mundo se ve consumido por la guerra. Los Aliados ofrecen armas, reconocimiento y un lugar entre las naciones que se resisten a la agresión. Al unirse a ellas, vinculamos la supervivencia de Siam a una lucha más amplia por un mundo libre."
 SIA_the_malay_peninsular_defense_plan: "Plan malayo de defensa peninsular"
 SIA_the_malay_peninsular_defense_plan_desc: "Si la guerra llega al Sudeste Asiático, Malasia será uno de sus primeros campos de batalla. Contar con fortificaciones, depósitos de suministros y planes realizados conjuntamente con los británicos convertirá la península en un escudo contra la invasión."
 SIA_the_malay_peninsular_defense_plan_tt: "Construye un ferrocarril entre Bangkok y Singapur.\n\nCada punto de victoria en [MAL.GetName], Singapur, [724.GetName], [289.GetName] y [1076.GetName]:\nAñade §G2§! §Yfuertes costeros§!.\nAñade §G2§! §Yfuertes terrestres§!.\nCada uno de estos estados:\nAñade §G1§! §Yimpacto antiaéreo estático§!."
 SIA_join_the_united_front: "Sumarse al Frente Unido"
 SIA_join_the_united_front_desc: "China se desangra por la agresión [JAP.GetAdjective], pero sigue luchando. Al unirse al Frente Unido, [SIA.GetName] puede ayudar a convertir la guerra terrestre en la tumba de las ambiciones del imperio."
 SIA_a_land_war_in_asia_desc: "Esta guerra no se ganará a base de declaraciones. Los soldados de Siam deben marchar, combatir y resistir cruzando el difícil terreno asiático. Nuestro compromiso con el Frente Unido debe demostrarse actuando."
 SIA_death_to_the_communists: "Muerte a los comunistas"
 SIA_death_to_the_communists_desc: "La derrota de la camarilla militar no debe abrir la puerta a otra tiranía. Los agitadores comunistas creen que la crisis ha debilitado al Estado. Pronto descubrirán que la democracia civil no está indefensa."
 SIA_death_to_the_nationalists: "Muerte a los nacionalistas"
 SIA_death_to_the_nationalists_desc: "Japón ha tenido que retroceder, pero la cuestión del futuro de Asia sigue sin respuesta. El viejo orden nacionalista solo cambiará una jerarquía por otra. Si pensamos rehacer Asia, los comunistas deberán imponerse."
 SIA_a_new_dawn_over_asia: "Un nuevo amanecer en Asia"
 SIA_a_new_dawn_over_asia_desc: "El imperio japonés ha caído, y las fuerzas corruptas que buscaban heredar sus ruinas han sido detenidas. Por toda Asia, un nuevo amanecer se alza sobre las naciones decididas a crear un futuro libre de la dominación imperial."
 SIA_phibuns_premiership: "Toma de posesión de Phibun"
 SIA_phibuns_premiership_desc: "Conforme se acerca el fin del mandato del primer ministro [SIA_phraya_phahon.GetName], el sucesor al que el partido ha elegido, Plaek Phibunsongkhram, se prepara para asumir el liderazgo, acto que complacerá enormemente a nuestro ejército, pero sembrará desasosiego entre la población.\nConsideramos que solo hay una manera de avanzar en esta nueva era: ¡con gran convicción!"
 SIA_siamese_youth_movement: "Movimiento juvenil [THIS.GetAdjective]"
 SIA_siamese_youth_movement_desc: "La juventud adulta de [THIS.GetName] necesita caldearse como el acero sobre una fragua. Aprenderán a respetar al Estado, a defender la patria y pasarán a ser miembros valiosos de la sociedad tailandesa."
 SIA_territorial_defense_student: "Estudiantado de defensa territorial"
 SIA_territorial_defense_student_desc: "Para ampliar el movimiento juvenil, los candidatos más prometedores pueden ser trasladados a campos de entrenamiento de soldados noveles, donde prestarán ayuda en defensa de [SIA.GetNameDef]. Recibirán el entrenamiento militar pertinente y servirán como apoyo para el ejército."
 SIA_expand_domestic_arms_workshops: "Ampliación de talleres armamentísticos nacionales"
 SIA_expand_domestic_arms_workshops_desc: "Por patético que sea, nuestra capacidad para fabricar material bélico está muy por detrás de la de otros países desarrollados. Tenemos que centrarnos en la expansión de la producción militar en suelo patrio para garantizar que nuestras fuerzas reciban nuevo equipamiento con asiduidad."
 SIA_look_to_european_fascism: "Poner la mirada en el fascismo europeo"
 SIA_look_to_european_fascism_desc: "Tenemos la oportunidad de reformar este país. Libres de las ataduras del pasado, miraremos hacia adelante y tomaremos como ejemplo lo que está ocurriendo en Occidente. No cabe duda de que el viejo orden mundial se está desmantelando, y quienes se queden atrás sufrirán las consecuencias por falta de ideas de cara al futuro."
 SIA_the_songsuradet_rebellion: "La rebelión de Songsuradet"
 SIA_the_songsuradet_rebellion_desc: "Si se lo propusiera, el oficial superior Phraya Songsuradet sería una amenaza para el régimen actual. No podemos tolerar tal peligro y, como principal oponente de Phibun que es, ha de marcharse.\nDisponemos de una gran cantidad de material dañino que podemos emplear contra Songsuradet y sus partidarios, lo que nos ayudaría a consolidar nuestro poder y a eliminar a nuestros oponentes nacionales."
 SIA_the_songsuradet_rebellion_historical_tt: "El general Phraya Songsuradet será acusado de conspirar contra el Estado. Tanto él como su consejero §Y[SIA_rangsit_prayurasakdi.GetName]§! serán purgados.\n\nGanaremos\n"
 SIA_the_songsuradet_rebellion_historical_tt2: "Tras finalizar, obtendrás:"
 SIA_the_songsuradet_rebellion_historical_tt3: "durante §Y[?var:SIA_purged_military_timer]§! días(s)"
 SIA_the_songsuradet_rebellion_alt_tt: "Al general Phraya Songsuradet se le acusará de conspirar contra el Estado.\n\nSin embargo, dado que hemos fortalecido su colectivo militar, podría envalentonarse y negarse a comparecer, lo que desembocaría en un enfrentamiento o una posible guerra civil."
 SIA_sue_the_king_in_exile: "Demandar al rey en el exilio"
 SIA_sue_the_king_in_exile_desc: "Se rumorea que el rey exiliado ha huido a [ENG.GetNameDefCap] con una gran cantidad de objetos de valor bajo el brazo. Debemos recuperarlos y, si para ello hemos de demandarlo a él y a su esposa, que así sea."
 SIA_suspend_ordinary_legal_procedures: "Suspender los procedimientos legales ordinarios"
 SIA_suspend_ordinary_legal_procedures_desc: "La rebelión de Songsuradet nos brinda la oportunidad de promulgar reformas radicales en nombre de la seguridad nacional. Se anularán los controles y equilibrios que yacen en manos de las cortes y otros órganos políticos, lo que nos dará el margen de tiempo necesario para centralizar el poder."
 SIA_the_duty_of_the_thai_people_during_the_war_act: "El deber del pueblo tailandés durante el acto de guerra"
 SIA_the_duty_of_the_thai_people_during_the_war_act_desc: "$idea_SIA_cemented_control_3_desc$"
 SIA_recognize_manchukuo: "Reconocer Manchukuo"
 SIA_recognize_manchukuo_desc: "TODO_CM"
 SIA_press_censorship: "Censura de prensa"
 SIA_press_censorship_desc: "Una prensa libre corre el riesgo de socavar la estabilidad del Estado. Si bien la libertad ha de existir, hay que asegurarse de que en los medios se priorizan la voz y la voluntad del gobierno."
 SIA_department_of_publicity: "Departamento de publicidad"
 SIA_department_of_publicity_desc: "Es imprescindible que todo Estado disponga de una máquina propagandística, sobre todo uno como el nuestro, con ambiciones territoriales. Para lograrlo, hemos de financiar un departamento de publicidad."
 SIA_thai_cultural_mandates: "Mandatos culturales tailandeses"
 SIA_thai_cultural_mandates_desc: "Podemos alentar al pueblo tailandés y construir una cultura nacional fuerte mediante la promulgación de mandatos que fortalezcan la unidad del pueblo y forjen una identidad unificada."
 SIA_thai_cultural_mandates_tt: "Desbloquea decisiones para aplicar mandatos culturales, lo que otorga varias mejoras al coste del §Ypoder político§!. El primer y el segundo mandato son gratuitos."
 SIA_relocate_the_capital_to_phetchabun: "Trasladar la capital a Phetchabun"
 SIA_relocate_the_capital_to_phetchabun_desc: "¡El gobierno se ve amenazado! Como bien ha demostrado la historia, Bangkok es vulnerable contra los ataques navales y, aunque será una decisión impopular, hay que trasladar la capital al interior."
 SIA_relocate_the_capital_to_phetchabun_tt: "Traslada hasta §G3§! §Yfábricas militares§! de §Y[1076.GetName]§! a §Y[1077.GetName]§!.\nTraslada §G3§! §Yfábricas civiles§! de §Y[1076.GetName]§! a §Y[1077.GetName]§!.\nConstruye fuertes de nivel §G3§! alrededor de Phetchabun."
 SIA_relocate_the_capital_to_phetchabun_tt2: "Cuando las aguas se calmen - Ganancia de estabilidad base: §R-25%§!"
 SIA_radio_propaganda: "Propaganda por radio"
 SIA_radio_propaganda_desc: "Conforme [SIA.GetName] se electrifica, la radio va convirtiéndose en un elemento clave. Al igual que con la prensa, hemos de controlar qué se transmite."
 SIA_sala_chaloem_thai_movie_theater: "Cine Sala Chaloem Thai"
 SIA_sala_chaloem_thai_movie_theater_tt: "Desbloquea decisiones para hacer películas propagandísticas, lo que otorga varias mejoras, como:\n"
 SIA_sala_chaloem_thai_movie_theater_desc: "El cine es un medio nuevo en nuestro país, pero su potencial es innegable. Al igual que ocurre con la poesía, la literatura y la radio, puede conmover emocional e intelectualmente al pueblo llano y a la élite. Si recurrimos a él, fortaleceremos la determinación de la población para que [SIA.GetName] experimente un gran auge."
 SIA_pan_thaiism: "Movimiento pantailandés"
 SIA_pan_thaiism_desc: "No es suficiente con que [ROOT.GetName] exista; también necesita prosperar. El futuro del pueblo [ROOT.GetAdjective] no reside en resignarse a ser a un Estado de segunda, sino en participar en los asuntos de índole mundial. Primero, hay que convencer a la ciudadanía de que se posicione en contra de los imperialistas que nos arrebataron lo que era nuestro y recordarle lo que nos robaron."
 vichy_exist_trigger: "La §YFrancia de Vichy§! existe"
 vichy_exist_not_trigger: "La §YFrancia de Vichy§! no existe"
 SIA_retake_lost_british_states: "Recuperar los estados británicos perdidos"
 SIA_retake_lost_british_states_tt: "Desbloquea la capacidad de iniciar guerras limitadas contra los territorios británicos en §YBirmania§! y §YMalasia§!."
 INS_retake_lost_british_states_tt: "Desbloquea la capacidad de iniciar guerras limitadas contra los territorios británicos en §YMalasia§!."
 SIA_retake_lost_british_states_desc: "No solo los mandatarios [FRA.GetAdjective] dividieron nuestro gran reino, sino los [ENG.GetAdjective] también. Cegados por la ambición, aprovechaban la más mínima oportunidad para quedarse con parte del pastel. Ahora que tienen la mirada puesta en rivales más importantes, ha llegado la hora de actuar."
 SIA_recover_indochina: "Recuperar Indochina"
 SIA_recover_indochina_desc: "En el último siglo, nuestro país ha sido fragmentado por los mandatarios [FRA.GetAdjective], un gobierno antípoda sin potestad alguna para imponernos cómo actuar o vivir. Aun así, cañoneros y armas mediante, nos arrebataron lo que nos pertenecía. En una época en la que el poder [FRA.GetAdjective] se desvanece, el dominio será nuestro."
 SIA_recover_indochina_tt: "Desbloquea la capacidad de iniciar guerras limitadas contra los territorios de §YIndochina§!."
 SIA_demand_the_return_of_lost_territory: "Exigir la devolución del territorio perdido"
 SIA_demand_the_return_of_lost_territory_desc: "[FRA.GetNameDefCap] ha mostrado su punto débil como un tigre de papel que se aferra a la poca influencia que le queda. Tras la caída de sus fuerzas armadas, ya no puede proyectar el poderío que poseía antaño y no está en condiciones de oponerse a nuestras exigencias."
 SIA_demand_the_return_of_lost_territory_tt: "Les pediremos a los propietarios de §YIndochina§! y algunos territorios de §Y[MAL.GetName]§! que nos devuelvan §Y[1069.Getname]§!, §Y[1067.Getname]§!, §Y[741.Getname]§!, §Y[1068.Getname]§!, §Y[1061.Getname]§!, §Y[1064.Getname]§!, §Y[1065.Getname]§! y §Y[670.Getname]§!.\n\nFactores influyentes:\n-Fuerza de combate de al menos un 30% más que el propietario.\n-El propietario está en guerra con una gran potencia.\n-El propietario no forma parte de una facción.\n-El propietario es la §YFrancia de Vichy§!.\n-Formamos parte de una facción.\n-Le caemos mal al propietario."
 SIA_the_greater_thai_empire: "El Gran Imperio tailandés"
 SIA_the_greater_thai_empire_available_trigger: "§Y[ROOT.GetName]§! controla todos los estados indochinos.\nEl cumplimiento de los estados indochinos es superior al: §Y[?var:SIA_greater_thai_empire_compliance_requirement]%§!.\n\nAdemás, se requiere:"
 SIA_the_greater_thai_empire_desc: "La hora de nuestro ascenso está a la vuelta de la esquina. Hemos recuperado lo que antaño nos arrebataron y, ahora que el pueblo nos reconoce como autoridad de facto, hemos consolidado nuestra legitimidad como líderes lícitos de este renovado Gran Imperio tailandés."
 SIA_crack_down_of_foreign_merchants: "Acabar con los mercaderes extranjeros"
 SIA_crack_down_of_foreign_merchants_desc: "Los intereses externos siempre han influido en el comercio y creado vulnerabilidades que pueden afectar a la resiliencia nacional. Para salvaguardar la seguridad de la economía, hemos de ser capaces de controlar nuestro propio comercio y asegurarnos de que la prosperidad y la estabilidad se construyen sobre unos cimientos que nosotros controlamos."
 SIA_royal_palace_bureau_directive_no_1523: "Directriz n.º 1523 de la Oficina del Palacio Real"
 SIA_royal_palace_bureau_directive_no_1523_desc: "Con la escalada del nacionalismo en el país, hasta la Corona ha salido en apoyo del gobierno y ha pedido a los miembros del Palacio Real que donen el 10% de sus ingresos para comprar armamento actualizado."
 SIA_end_factionalism: "Fin del faccionalismo"
 SIA_end_factionalism_desc: "La brecha que separa a las alas militar y civil del Khana Ratsadon ha eclipsado todas y cada una de las decisiones que se han tomado desde la revolución. Si conseguimos vincular ambas facciones al gobierno, con el tiempo crearemos un partido popular unido, lo que nos permitirá superar el golpe de Estado."
 SIA_end_factionalism_available_tt: "Tanto el §Yala civil§! como el §Yala militar§! han brindado §Gapoyo absoluto§! durante §Y270§! días consecutivos."
 SIA_end_factionalism_tt: "La rivalidad entre las diferentes facciones del Khana Ratsadon ha llegado a su fin:\n   Las alas §Ycivil§! y §Ymilitar§! se han disuelto para conformar el §GPartido del Pueblo Unido§!.\n   Obtienes el espíritu §Y$idea_SIA_unified_khana_ratsadon$§!."
 SIA_turn_off_the_khana_ratsadon: "El Khana Ratsadon está inactivo"
 SIA_factionalism_overcome: "El faccionalismo es cosa del pasado"
 SIA_new_territories_administration: "Administración de nuevos territorios"
 SIA_new_territories_administration_tt: "Desbloquea decisiones para administrar territorios §Yindochinos§! con cumplimiento, industria y fortificaciones mejorados."
 SIA_new_territories_administration_desc: "Recuperar los territorios que perdimos no es más que el principio. Hemos de demostrarles a quienes allí habitan que somos mejor opción. Así pues, hemos emprendido un amplio proyecto para mejorar el nivel de vida de todo el mundo y garantizar que la ciudadanía se sienta en igualdad de condiciones en esta nueva gran [ROOT.GetName]."
 SIA_new_territories_administration_available_trigger: "Cualquier estado de §YIndochina§!\n está controlado por §Y[ROOT.GetName]§!"
 SIA_industrialization_drive: "Campaña de industrialización"
 SIA_industrialization_drive_desc: "Desde hace generaciones, la riqueza de [ROOT.GetName] ha dependido de arrozales y aldeas rurales. Sin embargo, al mundo moderno no le da forma el arado, sino la fábrica y la maquinaria. Si vamos a preservar nuestra independencia entre las grandes potencias, debemos transformar nuestro reino agrario en una nación industrial."
 SIA_industrialization_drive_trigger: "El §YKhana Ratsadon§! está en activo"
 SIA_asian_financial_compact: "Pacto financiero asiático"
 SIA_asian_financial_compact_desc: "El capital europeo sigue dominando gran parte del comercio asiático, dejando a nuestra economía expuesta a la presión extranjera. Al buscar acuerdos financieros más estrechos con nuestros vecinos, podemos ampliar nuestro acceso al crédito, a los mercados y a las inversiones sin renunciar a nuestra independencia."
 SIA_revision_of_unequal_treaties: "Revisión de tratados desiguales"
 SIA_revision_of_unequal_treaties_desc: "Los viejos acuerdos firmados en momentos de debilidad siguen otorgando a intereses extranjeros privilegios que ningún Estado moderno debería tolerar. Debemos revisar estos tratados desiguales y restaurar la autoridad total de [ROOT.GetNameDef] sobre su comercio, sus tribunales y sus concesiones."
 SIA_renegotiate_teak_control: "Renegociar el control de la teca"
 SIA_renegotiate_teak_control_desc: "Nuestros bosques del norte enriquecen a los beneficiarios de concesiones con muy pocos beneficios para el Estado. Al renegociar el control de la teca, podemos reclamar ingresos, regular la extracción y garantizar que la madera siamesa sirva al desarrollo siamés."
 SIA_a_fledgling_tobacco_industry: "Una industria del tabaco incipiente"
 SIA_a_fledgling_tobacco_industry_desc: "El tabaco sigue siendo un comercio menor, disperso y mal organizado. Con una protección modesta y una inversión cuidadosa, esta pequeña cosecha puede convertirse en una fuente fiable de ingresos por impuestos especiales, ingresos rurales y trabajo en las fábricas."
 SIA_a_fledgling_tobacco_industry_tt: "Estar en §Y$limited_exports$§! o §Y$closed_economy$§! nos proporcionará una §Yfábrica civil§! adicional."
 SIA_all_weather_roads: "Carreteras para todo tipo de clima"
 SIA_all_weather_roads_desc: "Demasiadas carreteras desaparecen con las lluvias, dejando provincias aisladas de la capital y de los mercados. Un red de carreteras preparadas para todo tipo de clima mantendrán unido al reino y permitirán el movimiento de soldados y mercancías durante todas las estaciones."
 SIA_the_bank_of_siam: "El banco de Siam"
 SIA_the_bank_of_siam_desc: "El crecimiento industrial no puede prosperar solo por las costumbres y el favor privado. Un banco nacional más fuerte proporcionará al Estado un mayor dominio sobre el crédito, la moneda y la circulación de capital."
 SIA_thai_rice_company: "Empresa arrocera de Tailandia"
 SIA_thai_rice_company_desc: "El arroz sigue siendo la base de [ROOT.GetName], y sin embargo gran parte de su comercio está fragmentado, y es arriesgado y vulnerable a la presión extranjera. Una compañía nacional del arroz permitiría al Estado guiar las exportaciones, estabilizar los precios y convertir la cosecha de nuestros arrozales en unos cimientos más firmes para la fortaleza nacional."
 SIA_uk_japan_focus_tt: "Permite elegir entre [ENG.GetNameDef] y [JAP.GetNameDef] con los siguientes efectos:\n\n§Y[ENG.GetFlag][ENG.GetNameDefCap]§!:"
 SIA_japan_option_tt: "§Y[JAP.GetFlag][JAP.GetNameDefCap]§!"
 SIA_send_bureaucrats_abroad: "Enviar burócratas al extranjero"
 SIA_send_bureaucrats_abroad_desc: "Otras naciones ya han construido los ministerios, escuelas y servicios técnicos que ahora requerimos. Al enviar al extranjero a funcionarios prometedores, podremos importar experiencia administrativa sin importar el mando extranjero."
 SIA_baht_stabilization_act: "Ley de estabilización del bat"
 SIA_baht_stabilization_act_desc: "Una economía moderna requiere una moneda en la que los comerciantes confíen y que los inversores acepten. Estabilizar el bat reducirá la incertidumbre en el comercio y dará a [ROOT.GetNameDef] una posición más sólida en el mercado internacional."
 SIA_siamese_development_cooperative: "Cooperativa de desarrollo de Siam"
 SIA_siamese_development_cooperative_desc: "El capital privado es cauteloso y el Estado no puede construirlo todo solo. Una cooperativa nacional de desarrollo permitirá que funcionarios, comerciantes y terratenientes acumulen recursos para proyectos que sirvan a la economía común."
 SIA_boon_rawd_brewery: "Cervecería Boon Rawd"
 SIA_boon_rawd_brewery_desc: "Una industria nacional de bebidas es algo más que una cuestión de consumo. Las empresas como Boon Rawd muestran que el capital, la maquinaria y la gestión siameses pueden crear una industria moderna en suelo siamés."
 SIA_national_savings_bond: "Bono de ahorro nacional"
 SIA_national_savings_bond_desc: "La riqueza de la nación no debe quedarse parada en cajas de caudales y ornamentos mientras dejan de construirse carreteras y fábricas. Los bonos de ahorro nacional convertirán la austeridad privada en inversión pública."
 SIA_national_savings_bond_tt: "Adquiere el espíritu de $SIA_national_savings_bond$, que va incrementando su fuerza de acuerdo con tu §Yley de reclutamiento§!. Cuanto más baja sea tu ley de reclutamiento, más fuertes serán sus efectos positivos y, al contrario, cuanto más alta, peor serán.\n\nAl ganar §Y$disarmed_nation$§!: "
 SIA_national_savings_bond_scraping_the_barrel: "Al ganar §Y$scraping_the_barrel$§!:"
 SIA_national_savings_bond_volunteer_only: "Al ganar §Y$volunteer_only$§!:"
 SIA_national_savings_bond_limited_conscription: "Al ganar §Y$limited_conscription$§!:"
 SIA_national_savings_bond_extensive_conscription: "Al ganar §Y$extensive_conscription$§!:"
 SIA_national_savings_bond_service_by_requirement: "Al ganar §Y$service_by_requirement$§!:"
 SIA_national_savings_bond_all_adult_serve: "Al ganar §Y$all_adults_serve$§!:"
 SIA_national_savings_bond_current: "Nuestra ley de movilización actual nos otorgaría:"
 SIA_deficit_spending: "Gasto deficitario"
 SIA_deficit_spending_desc: "La contabilidad ortodoxa no construirá una economía moderna a tiempo para ir al encuentro de un mundo peligroso. El Estado debe estar dispuesto a gastar por encima de sus ingresos actuales, usando las obras y la contratación pública para forzar el arranque del crecimiento industrial."
 SIA_deficit_spending_tt: "Tras agotarse el espíritu, obtiene: "
 SIA_acquire_light_tools: "Adquirir herramientas ligeras"
 SIA_acquire_light_tools_desc: "Antes de que podamos producir grandes máquinas, debemos dominar primero las herramientas más humildes de la industria. La importación de herramientas ligeras y equipo de taller permitirá que pequeñas fábricas y talleres de reparación se multipliquen por todo el territorio de [ROOT.GetName]."
 SIA_railway_and_port_extensions: "Ampliaciones de ferrocarril y puerto"
 SIA_railway_and_port_extensions_desc: "El arroz, la madera y el estaño son inútiles si no llegan al mercado. Extender el ferrocarril y expandir nuestros puertos atraerá las provincias al comercio nacional y conectará [ROOT.GetNameDef] con el resto del mundo."
 SIA_mechanization_of_agriculture: "Mecanización de la agricultura"
 SIA_mechanization_of_agriculture_desc: "Demasiada mano de obra permanece atada al cultivo tradicional, dejando pocos excedentes para la industria. Introduciendo herramientas y máquinas modernas en el campo podremos aumentar la producción y dejar a trabajadores libres para las fábricas."
 SIA_irrigation: "Irrigación"
 SIA_irrigation_desc: "La suerte del campesino siempre fluctúa con la inundación y la sequía. Un sistema de irrigación más amplio estabilizará las cosechas, expandirá la tierra cultivada y hará que el campo sea una base más firme para el desarrollo nacional."
 SIA_siam_cement_group: "Conglomerado [ROOT.GetName] Cement"
 SIA_siam_cement_group_desc: "El conglomerado [ROOT.GetName] Cement, fundado con el apoyo real, es una de las empresas industriales más importantes de [ROOT.GetNameDef]. Con la inversión adecuada y el respaldo del gobierno, la empresa puede pasar de abastecer a nivel nacional a convertirse en el pilar de nuestra capacidad industrial, lo que sentará las bases del futuro de la nación."
 SIA_chemical_imports: "Importaciones químicas"
 SIA_chemical_imports_desc: "Tanto la industria como la agricultura modernas dependen de componentes que aún no producimos en suficiente cantidad. Importar productos químicos nos abastecerá de fertilizantes, tintes y explosivos hasta que la industria nacional pueda asumir la tarea."
 SIA_chemical_imports_tt: "Añade §G+1§! §Yfábrica civil§! fuera del mapa si la opinión está por encima de §Y[?var:ROOT.SIA_chemical_imports_opinion_threshold]§! cuando se complete este enfoque."
 INS_chemical_imports_stolen_tt: "Añade §G[?var:ROOT.INS_guns_from_seek_help_focus]§! unidades de equipo de infantería si la opinión está por encima de §Y75§! cuando se complete este enfoque."
 SIA_foreign_currency_exchange: "Cambio de moneda extranjera"
 SIA_foreign_currency_exchange_desc: "La industrialización exige maquinaria, medicamentos y combustible extranjeros y, sin embargo, todo esto solo se puede comprar si la divisa está a la baja. Un sistema de cambio de divisas que deje una moneda fuerte y estable canalizará fondos extranjeros hacia las industrias más vitales para el Estado."
 SIA_farmers_into_the_city: "Agricultores en la ciudad"
 SIA_farmers_into_the_city_desc: "Una economía moderna no puede sostenerse solo con la mano de obra de los pueblos. Al ir expandiéndose la industria, el Estado debe fomentar una migración ordenada de los arrozales a las ciudades, donde se podrá formar una nueva fuerza laboral urbana."
 SIA_textile_mills: "Molinos textiles"
 SIA_textile_mills_desc: "El sector textil conforma una necesidad cotidiana y, sin embargo, la tela suele tejerse en el extranjero, desde donde nos la venden. Las fábricas textiles sustituirán a los bienes importados, darán empleo a la mano de obra urbana y le otorgará a [ROOT.GetNameDef] una de las industrias básicas de la vida moderna."
 SIA_public_credit: "Crédito público"
 SIA_public_credit_desc: "Comerciantes, productores y fabricantes están sufriendo restricciones por el escaso acceso al capital. Al ampliar el crédito público, el gobierno podrá prestar dinero en casos en los que la financiación privada brilla por su ausencia y fomentar el desarrollo de sectores descuidados."
 SIA_public_credit_trigger: "$idea_SIA_public_credit_debt$ lleva en activo como mínimo §Y180 días§!."
 SIA_a_modern_economy: "Una economía moderna"
 SIA_a_modern_economy_desc: "El antiguo orden agrario no desaparece en un día, pero ya no puede definir el futuro de [ROOT.GetNameDef]. Ahora que la infraestructura va tomando forma y van surgiendo bancos, escuelas y fábricas, se empieza a establecer una economía digna de una nación independiente moderna."
 SIA_reduction_of_agricultural_yield_taxes: "Reducción de impuestos al rendimiento agrícola"
 SIA_reduction_of_agricultural_yield_taxes_tt: "Reduce los §Ybienes de consumo§! de $idea_SIA_agricultural_tax_reduction$ en un §Y[?var:SIA_agricultural_tax_reduction_cg_decrease_rate|%]§! cada mes y aumenta la §Yestabilidad§! en un §Y[?var:SIA_agricultural_tax_reduction_stability_gain|%]§! cada mes, hasta que la penalización de los §Ybienes de consumo§! alcance el §Y0%§!.\n\nTras eliminar el espíritu, se obtiene:\n"
 SIA_reduction_of_agricultural_yield_taxes_desc: "No se le puede pedir al campesinado que alimente al reino, financie el Estado y soporte todas las penalidades sin ningún respiro. Al reducir los impuestos en la producción agrícola, dejaremos más excedentes en el campo, reforzaremos la lealtad entre los cultivadores y alentaremos una mayor producción de la tierra."
 SIA_fuel_oil_act: "Ley de petróleo"
 SIA_fuel_oil_act_desc: "El transporte, la industria y la defensa de hoy en día dependen del combustible, y sin embargo el acceso a este puede verse muy limitado en la guerra. Una ley relativa al petróleo hará que el Estado vigile con más firmeza su consumo, almacenamiento y distribución de emergencia para que no se derrochen suministros escasos."
 SIA_siam_electricity_company: "Compañía eléctrica de Siam"
 SIA_siam_electricity_company_desc: "Ninguna economía puede soportar las tensiones modernas sin fuentes de energía fiables. Al reforzar la Compañía eléctrica de Siam, podremos extender la generación, mejorar la coordinación y garantizar que los talleres, depósitos y ciudades permanezcan abastecidos incluso en la adversidad."
 SIA_revise_the_taxation_system: "Revisar el sistema de impuestos"
 SIA_revise_the_taxation_system_desc: "El marco recaudatorio actual no sirve adecuadamente a un Estado que se prepara para las penurias y la autosuficiencia. Un sistema mejorado recaudará impuestos de un modo más igualado, reducirá el desperdicio y dirigirá la carga de la defensa y el desarrollo nacional con mayor disciplina."
 SIA_census_the_hill_tribes: "Censar las tribus de las Colinas"
 SIA_census_the_hill_tribes_desc: "Las tierras altas aún no están dentro del alcance de la administración, la recaudación y el abastecimiento. Un censo adecuado ofrecerá al gobierno el conocimiento requerido para gobernar esas regiones de forma más eficaz, y para incorporar a sus gentes y sus recursos a un contexto más amplio de la nación."
 SIA_increase_rice_exports: "Aumentar las exportaciones de arroz"
 SIA_increase_rice_exports_desc: "El arroz es la fuente más segura de ingresos extranjeros con la que cuenta [ROOT.GetNameDef]. Al expandir las exportaciones mientras los mercados permanecen abiertos, podemos acumular reservas, financiar importaciones estratégicas y preparar la recaudación para los perturbadores momentos que estén por venir."
 SIA_pad_thai: "Pad thai"
 SIA_pad_thai_desc: "A una nación moderna no solo la sostienen ministerios y fábricas, sino los hábitos comunes que unen al pueblo. Al promover un plato nacional de arroz con ingredientes siameses, fomentamos el consumo nacional, apoyamos a nuestros granjeros y reducimos la dependencia de alimentos extranjeros en tiempos inciertos."
 SIA_rice_husk_steam_turbines: "Turbinas a vapor de cáscara de arroz"
 SIA_rice_husk_steam_turbines_desc: "La necesidad nos enseña a valorar lo que los extranjeros consideran desperdicios. Al quemar la cáscara de arroz para generar vapor, podemos obtener energía de nuestras propias cosechas y reducir nuestra dependencia del carbón importado y el petróleo."
 SIA_domestic_tin_smelters: "Fundiciones de estaño nacionales"
 SIA_domestic_tin_smelters_desc: "Ya no basta con extraer minerales de la tierra y mandarlos al extranjero. Al construir fundiciones de estaño nacionales, retenemos más valor de nuestros recursos en casa y conseguimos un metal industrial esencial tanto para el comercio como para la guerra."
 SIA_use_ships_as_generators: "Usar barcos como generadores"
 SIA_use_ships_as_generators_tt: "Colocar §Ybuques capitales§! de nuestra propiedad en §Ypuertos de estados esenciales§! nos dará una bonificación del §G-2%§! al consumo energético de las fábricas por cada §Ybuque capital§! hasta un total de §G-15%§!.\n\nLa salida del puerto de estos barcos reducirá la bonificación en esa cantidad, que se recuperará al volver a situar los barcos en el puerto."
 SIA_use_ships_as_generators_desc: "Hasta los buques más antiguos siguen pudiendo servir a la nación cuando ya no son aptos para la batalla o el comercio. Al anclar barcos como estaciones eléctricas flotantes, podemos proporcionar electricidad de emergencia a los puertos y la industria costera, a la vez que se preserva el tan valioso combustible y la infraestructura."
 SIA_diversity_foreign_reserves: "Reservas extranjeras diversas"
 SIA_diversity_foreign_reserves_desc: "Es peligroso para [ROOT.GetNameDef] depositar su seguridad financiera en la moneda o el crédito de una única potencia extranjera. Al diversificar nuestras reservas, reducimos el riesgo de conmociones externas y preservamos una mayor libertad de acción en el comercio y la diplomacia."
 SIA_diversity_foreign_reserves_tt: "Añade §G2§! §Yfábricas militares§! fuera del mapa adicionales al ir a la guerra.\nAñade la producción de §G8§! de acero en un estado esencial aleatorio al ir a la guerra."
 SIA_exclusivity_resource_contract: "Contratos de recursos exclusivos"
 SIA_exclusivity_resource_contract_desc: "Un único socio extranjero ofrece capital y compras garantizadas a cambio de acceso privilegiado a nuestros recursos. Un contrato exclusivo de esa magnitud puede acelerar el desarrollo, aunque somete una parte del futuro de [ROOT.GetNameDef] a los antojos de otra nación."
 SIA_maintain_resource_independence: "Mantener la independencia de recursos"
 SIA_maintain_resource_independence_desc: "Los contratos extranjeros pueden aportar beneficios rápidos, pero no tardan en provocar dependencia. Al mantener el control sobre nuestros recursos, preservamos la libertad de dirigirlos según las necesidades siamesas por encima de las exigencias extranjeras."
 SIA_kasetsart_university: "Universidad Kasetsart"
 SIA_kasetsart_university_desc: "Para que la agricultura sea más productiva, debe guiarse por la ciencia más que por la mera herencia. La Universidad Kasetsart formará agrónomos, veterinarios y expertos técnicos para modernizar la tierra."
 SIA_mahidol_university: "Universidad Mahidol"
 SIA_mahidol_university_desc: "Un Estado moderno requiere doctores, investigadores y administradores tanto como soldados e ingenieros. La Universidad Mahidol reforzará los estudios superiores y proporcionará las mentes formadas que se necesitan para la debida reforma nacional."
 SIA_silpakorn_university: "Universidad Silpakorn"
 SIA_silpakorn_university_desc: "TODO_CM"
 SIA_contingency_funds: "Fondos de contingencia"
 SIA_contingency_funds_desc: "La prosperidad en la paz es de poco valor si el Estado entra en una crisis sin preparación. Al reservar fondos de contingencia ahora, garantizaremos que el bloqueo, las deficiencias en las cosechas o la guerra repentina no detengan inmediatamente la maquinaria del gobierno."
 SIA_contingency_funds_tt: "Reuniremos un fondo de contingencia en tiempos de paz con el que conseguir una cantidad moderada de §Yfactor de bienes de consumo§!.\n\nDurante la guerra podemos liberar este fondo si así lo decidimos, obteniendo una gran bonificación en la producción.\nEl tiempo que dure el fondo dependerá de cuánto tiempo lo hayamos acumulado antes de liberarlo."
 SIA_prepare_for_the_next_blockade: "Preparación para el siguiente bloqueo"
 SIA_prepare_for_the_next_blockade_desc: "Si los mares se vuelven hostiles, [ROOT.GetNameDef] puede perder el acceso a los mercados, la maquinaria y el combustible. Por tanto, debemos prepararnos ahora para el nuevo bloqueo, estableciendo reservas, planes de emergencia y sustitutos antes de que la necesidad nos obligue a tomar medidas drásticas."
 SIA_domestic_arms_industry: "Industria armamentística nacional"
 SIA_domestic_arms_industry_desc: "Un reino que debe importar cada fusil y cartucho no puede considerarse seguro. Por modestos que sean sus inicios, una industria armamentística nacional permitirá a [ROOT.GetNameDef] armar a sus soldados desde sus propios talleres y resistir cuando fallen los suministros externos."
 SIA_war_material_substitutions: "Reemplazos de material bélico"
 SIA_war_material_substitutions_desc: "En tiempos de bloqueo, el material perfecto no es tan valioso como el material disponible. Debemos considerar la búsqueda de sustitutos para los metales, los productos químicos y los componentes importados para que la producción pueda continuar hasta cuando los bienes extranjeros ya no lleguen a nuestras costas."
 SIA_royal_thai_ordnance_factory: "Real Fábrica de Artillería tailandesa"
 SIA_royal_thai_ordnance_factory_desc: "Un Estado seguro requiere algo más que armas importadas y talleres de reparación dispersos. La Real Fábrica de Artillería tailandesa concentrará talento, maquinaria y supervisión bajo la Corona, ofreciendo a [ROOT.GetNameDef] un centro permanente para la fabricación de armas y municiones."
 SIA_built_to_withstand_every_flame: "Capaz de resistir cualquier llama"
 SIA_built_to_withstand_every_flame_desc: "La fábrica que se quema en una noche no puede servir a la nación por la mañana. Los almacenes, molinos y talleres deben construirse dispersos y con aislamiento ignífugo y protecciones de emergencia en mente para que el sabotaje, los bombardeos o los accidentes no detengan fácilmente la producción."
 SIA_the_army_of_siam: "El ejército de Siam"
 SIA_the_army_of_siam_desc: "La antigua estructura de nuestras fuerzas armadas ya no responde a las exigencias de esta época. Si [ROOT.GetName] piensa defender su soberanía y defender sus intereses en el extranjero, debemos establecer un nuevo ejército moderno que esté equipado, entrenado y organizado para las guerras que se están fraguando por todo el mundo."
 SIA_plan_for_a_short_war: "Planear una guerra breve"
 SIA_plan_for_a_short_war_desc: "Nuestros recursos son limitados y nuestros enemigos pueden ser numerosos. [ROOT.GetNameDefCap] no puede permitirse una larga contienda de desgaste. Si se llega a la guerra, esta debe ser rápida y decisiva, y llegar a término antes de que el enemigo pueda acumular fuerzas."
 SIA_intermediate_war_preparation: "Preparativos bélicos intermedios"
 SIA_intermediate_war_preparation_desc: "Es peligroso prepararse solo para una campaña relámpago, pero será un despilfarro organizarse exclusivamente para un enfrentamiento interminable. Una doctrina equilibrada permitirá que [ROOT.GetName] golpee vigorosamente sin perder la resistencia que se necesitará para enfrentarse a un enemigo más obstinado."
 SIA_prepare_for_a_long_war: "Prepararse para una guerra larga"
 SIA_prepare_for_a_long_war_desc: "Las guerras de las grandes potencias quizá se decidan en solo unos meses, pero las naciones más pequeñas a menudo se ven obligadas a sufrirlas durante años. Por tanto, debemos preparar el armamento, la industria y el transporte [ROOT.GetAdjective] para un largo y agotador conflicto en el que la paciencia y la resistencia importan tanto como el valor."
 SIA_specialized_warfare: "Guerra especializada"
 SIA_specialized_warfare_desc: "El terreno de nuestra región no favorece que haya un ejército uniforme. Las montañas, la jungla y las riberas exigen distintas habilidades. Entrenando tropas especializadas garantizaremos que [ROOT.GetNameDef] se enfrente al enemigo con la fuerza adecuada en cada campo."
 SIA_artillery_reigns_supreme: "Artillería suprema"
 SIA_artillery_reigns_supreme_desc: "La guerra moderna no se gana solo con espíritu. El cañón sigue siendo el rey del campo de batalla, destruyendo posiciones fortificadas, destrozando asaltos y allanando el camino a nuestra infantería. Si pretendemos triunfar, la potencia de fuego [ROOT.GetAdjective] debe ser abundante y precisa."
 SIA_yield_the_air_war: "Abandonar la guerra aérea"
 SIA_yield_the_air_war_desc: "No podemos esperar batirnos con las grandes potencias en los cielos en igualdad de condiciones. En vez de malgastar valiosos recursos en una competición que es improbable que ganemos, debemos reforzar nuestras defensas antiaéreas y privar a los aviones enemigos de la posibilidad de atacar a nuestros hombres y nuestras ciudades sin que les salga caro."
 SIA_the_thunder_at_the_gates: "El trueno a las puertas"
 SIA_the_thunder_at_the_gates_desc: "Hay fortalezas que los cañones corrientes no pueden destruir y ataques que deben anunciarse con una fuerza abrumadora. La artillería pesada, los cañones de asedio y los cañones ferroviarios le darán a [ROOT.GetNameDef] la fuerza para tumbar las puertas de cualquier enemigo que confunda nuestra contención con debilidad."
 SIA_night_time_training: "Entrenamiento nocturno"
 SIA_night_time_training_desc: "Los asaltos directos a plena luz del día invitan al desastre contra un enemigo preparado. Al entrenar a nuestros hombres para la infiltración, el movimiento y el ataque bajo la cobertura de la oscuridad, podemos tomar la iniciativa cuando el enemigo está ciego, confundido y menos preparado para hacernos frente."
 SIA_steel_arteries: "Arterias de acero"
 SIA_steel_arteries_desc: "Ningún ejército llega lejos sin trenes y carreteras que lo apoyen. Las arterias de acero de la nación deben reforzarse para poder llevar tropas, suministros y cañones rápidamente a todas las fronteras amenazadas. La seguridad militar y el desarrollo nacional van de la mano en este esfuerzo."
 SIA_prepare_northern_infrastructure_for_war: "Preparar la infraestructura del norte para la guerra"
 SIA_prepare_northern_infrastructure_for_war_desc: "Las rutas de acceso del norte serán vitales en cualquier disputa con Birmania y quienes la respaldan. Las carreteras, ferrocarriles y depósitos de esa región deben expandirse de inmediato para que las fuerzas [ROOT.GetAdjective] avancen o resistan allí sin demora."
 SIA_unconventional_tank_construction: "Construcción de tanques no convencionales"
 SIA_unconventional_tank_construction_desc: "No podemos igualar cada elemento de los programas de carros blindados de las grandes potencias. Si [ROOT.GetNameDef] pretende contar con tanques, debemos buscar métodos de construcción más baratos y adaptables, sacrificando la majestuosidad a cambio de la cantidad y la utilidad."
 SIA_conventional_tank_construction: "Construcción de tanques convencionales"
 SIA_conventional_tank_construction_desc: "Los carros blindados se han convertido en un arma establecida de la guerra moderna, y las soluciones improvisadas solo nos servirán hasta cierto punto. Por tanto, debemos establecer una industria adecuada de construcción de tanques basada en principios sólidos, diseños estandarizados y métodos de producción fiables dignos de un ejército moderno."
 SIA_reverse_engineer_allied_tanks: "Tanques aliados de ingeniería inversa"
 SIA_reverse_engineer_allied_tanks_desc: "Otros ya han asumido el precio de la experimentación. Los tanques capturados y las máquinas importadas se pueden desmontar, estudiar e imitar. Gracias al aprendizaje de diseños extranjeros, [ROOT.GetName] puede tomar un atajo para obtener su propia fuerza blindada."
 SIA_tankettes: "Tanquetas"
 SIA_tankettes_desc: "Al ser ligeras, baratas y fáciles de producir, quizá las tanquetas no decidan grandes batallas por sí solas, pero pueden servir para el reconocimiento, la guerra colonial y el apoyo a la infantería. Para una nación de medios modestos, estos vehículos blindados ofrecen una entrada práctica a la guerra mecanizada."
 SIA_jungle_armor: "Blindaje en la selva"
 SIA_jungle_armor_desc: "Las junglas de nuestra región no son un buen lugar para las pesadísimas máquinas diseñadas para las llanuras de Europa. Si queremos que a [ROOT.GetNameDef] le sean útiles los vehículos blindados, deben adaptarse a carriles estrechos, suelos pésimos y un clima opresivo, cambiando el peso por movilidad donde la jungla lo exija."
 SIA_mountain_tanks: "Tanques de montaña"
 SIA_mountain_tanks_desc: "Las escarpadas colinas y los pasos de montaña no pueden quedar solo para la infantería. Al fabricar vehículos blindados compactos adecuados para terrenos accidentados, quizá proporcionemos a nuestros ejércitos un medio de llevar potencia de fuego protegida a regiones en las que los tanques corrientes fracasarían."
 SIA_reluctant_submission: "Sumisión reacia"
 SIA_reluctant_submission_desc: "Si [ROOT.GetNameDef] se enfrenta a la invasión de un enemigo más fuerte, quizá llegue un momento en el que la resistencia frontal solo pueda llevar a la ruina. Doblegarse es amargo, pero a veces un gobierno debe ceder para evitar que la nación sea destruida a la espera de un momento más favorable."
 SIA_reluctant_submission_trigger: "Este enfoque se completará automáticamente si nos atacan y se elige la opción de §Ysumisión§! en el evento."
 SIA_reluctant_submission_tt: "Podremos firmar la paz con una gran potencia atacante. Sin embargo, esperarán que les imprimamos dinero.\nNuestro §Yfactor de fábricas de bienes de consumo§! aumentará en un §Y[?idea_SIA_printing_money_monthly_change|%]§! mensual, hasta un máximo de §Y[?idea_SIA_printing_money_monthly_change_max|%]§!.\n\nAdoptar el enfoque §Y$SIA_thai_rice_company$§! reducirá la tasa de aumento en un §G50%§!.\n\nAdoptar el enfoque §Y$SIA_demand_repatriation$§! eliminará la necesidad de imprimir dinero."
 SIA_seri_thai: "Seri Thai"
 SIA_seri_thai_desc: "La sumisión no significa la rendición del espíritu nacional. Bajo la superficie de la ocupación y el cumplimiento de las órdenes, puede organizarse una resistencia leal para preservar la causa de la independencia, reunir información y prepararse para el día en el que [ROOT.GetName] vuelva a alzarse."
 SIA_contact_the_south_east_asia_command: "Ponerse en contacto con el centro de mando para el Sudeste Asiático"
 SIA_contact_the_south_east_asia_command_desc: "Si la resistencia pretende ser algo más que gestos valientes, debe estar vinculada a una estrategia más amplia. Al establecer contacto con el mando aliado del Sudeste Asiático, los patriotas de [ROOT.GetName] podrían asegurarse conseguir orientación, suministros y una posición en el conflicto mayor."
 SIA_broadcast_weather_reports_to_the_allies: "Transmitir informes meteorológicos a los Aliados"
 SIA_broadcast_weather_reports_to_the_allies_desc: "En los cielos y mares de la región manda tanto el clima como las flotas y los ejércitos. Los informes fiables proporcionados por [ROOT.GetNameDef] pueden ayudar a los Aliados a trazar sus planes, defender sus operaciones de los ataques sorpresa y convertir a nuestra patria en un socio discreto pero valioso en su guerra."
 SIA_american_investment_aid: "Ayuda e inversión estadounidense"
 SIA_american_investment_aid_desc: "Estados Unidos posee una riqueza mucho más allá de la disponible en nuestra región. Si logramos la ayuda y la inversión estadounidense en nuestros esfuerzos clandestinos nacionales, [ROOT.GetNameDef] obtendrá los medios materiales necesarios para soportar las penurias y prepararse para la liberación."
 SIA_thai_students_in_the_oss: "Alumnado tailandés en la OSS"
 SIA_thai_students_in_the_oss_desc: "Se puede entrenar a una nueva generación de jóvenes patriotas en el extranjero en las artes del espionaje, el sabotaje y la guerra irregular. Al enviar a estudiantes tailandeses de confianza dentro de la órbita de la inteligencia aliada, prepararemos a servidores aptos para la guerra oculta que se avecina."
 SIA_prepare_to_drop: "Prepararse para caer"
 SIA_prepare_to_drop_desc: "Cuando llegue la hora de la liberación, quizá los Aliados pretendan descender sobre nuestra patria desde los cielos. Por tanto, debemos identificar lugares para aterrizar, preparar contactos y organizar redes de apoyo para poder recibir fuerzas aerotransportadas y dirigirlas al sitio donde más se las necesite."
 SIA_unseat_the_government: "Derrocar el gobierno"
 SIA_unseat_the_government_desc: "No podemos permitir que un régimen que ha sometido a [ROOT.GetNameDef] a la dominación extranjera dure para siempre. Mediante la resistencia, la intriga y una respuesta en el momento adecuado, podríamos eliminar a los que han puesto en peligro a la nación y restablecer un gobierno más digno de Siam."
 SIA_unseat_the_government_tt: "[ROOT.GetName] abandonará su facción actual y se cambiará de bando en la guerra para unirse a los §Yaliados§!.\n\nLos lealistas se alzarán contra este cambio y desencadenarán una guerra civil.\n\nSi nuestro apoyo combinado es §Ysuperior al 80%§!, derrocaremos al gobierno y evitaremos una guerra civil. Nuestro apoyo total es de un §Y5%§! por cada general persuadido, más nuestro apoyo democrático.\n\nEl apoyo de los generales que hemos persuadido es del §Y[?var:SIA_seri_thai_cw_scale|%]§!, y nuestro apoyo democrático es del §Y[?var:party_popularity@democratic|%]§!."
 SIA_choose_new_leader_tt: "Ahora que el antiguo régimen ha caído, los vencedores deben decidir quién estará al frente del nuevo gobierno."
 SIA_the_phayap_army: "El ejército del Phayap"
 SIA_the_phayap_army_desc: "Si nos aliamos con el invasor, a nuestros ejércitos se les dará un lugar en el nuevo orden de la guerra. Un mando de campo específico para las operaciones al oeste y al norte permitirá a [ROOT.GetName] avanzar junto a su poderoso socio y tratar de conseguir sus propios beneficios."
 SIA_securing_the_rubber_islands: "Tomar las islas de caucho"
 SIA_securing_the_rubber_islands_desc: "El caucho es la base de la guerra moderna, al resultar necesario para los neumáticos, los sellos e incontables instrumentos del conflicto mecanizado. Los territorios ricos en recursos que tenemos al sur presentan tanto una oportunidad como una necesidad. Deberíamos ponernos en marcha para hacernos con ellos antes de que se nos adelanten."
 SIA_breaking_the_burmese_line: "Doblegar el frente birmano"
 SIA_breaking_the_burmese_line_desc: "Birmania se alza como barrera entre nuestras ambiciones y las tierras de más allá. Para que las armas [ROOT.GetAdjective] demuestren su valía, hay que romper la línea enemiga mediante la determinación, la planificación y el uso concentrado de la fuerza."
 SIA_pacific_war: "Guerra del Pacífico"
 SIA_pacific_war_desc: "Ya no se puede tratar el conflicto de Asia Oriental como algo lejano. La guerra del Pacífico moldea el destino de todas las naciones de nuestra región y [ROOT.GetNameDef] debe decidir su lugar en ese conflicto, ya sea como seguidor, aliado o víctima."
 SIA_joint_asian_military_command: "Mando militar asiático conjunto"
 SIA_joint_asian_military_command_desc: "Nuestros esfuerzos serán más fuertes si se coordinan con los de nuestros socios regionales. Una estructura de mando conjunta promete una mayor eficiencia, una planificación más clara y una dirección común en campañas que de otro modo correrían el riesgo de dilapidarse por la rivalidad y la confusión."
 SIA_demand_repatriation: "Exigir la repatriación"
 SIA_demand_repatriation_desc: "Los que entraron en nuestra tierra bajo el pretexto de la necesidad han contraído una deuda con [ROOT.GetNameDef]. En cuanto nuestra suerte mejore, deberíamos exigir la devolución de lo que nos han quitado y presionar al invasor para que pague el precio de su intrusión."
 SIA_standing_our_ground: "Defender el territorio"
 SIA_standing_our_ground_desc: "Llega un punto en el que la retirada y la negociación solo ofrecen nuevas humillaciones. [ROOT.GetNameDefCap] debe mostrar que sigue poseyendo la voluntad de mantenerse firme, luchar y expulsar a los que creen que pueden dictar nuestro destino a punta de pistola."
 SIA_standing_our_ground_trigger: "Este enfoque se completará automáticamente si nos atacan y elegimos la opción de §Yresistencia§! en el evento."
 SIA_ask_for_the_release_of_american_commodities: "Pedir la liberación de mercancías estadounidenses"
 SIA_ask_for_the_release_of_american_commodities_desc: "Los almacenes, la maquinaria y los bienes estadounidenses pueden proporcionarnos el respiro que precisa nuestra nación. Mediante una diplomacia cuidadosa, podemos solicitar el acceso a esas ventajas, aliviando así la escasez y fortaleciendo la base material de nuestro esfuerzo bélico."
 SIA_japanese_fighters: "Cazas japoneses"
 SIA_japanese_fighters_desc: "Aunque nuestra industria aeronáutica sigue dejando mucho que desear, los aviones extranjeros pueden ayudar a fortalecerla. Los cazas japoneses en manos [ROOT.GetAdjective] pueden ofrecernos al menos cierta potencia aérea moderna, aunque sea dentro de los límites a los que nos somete nuestra debilidad industrial."
 SIA_get_off_our_shores: "Fuera de nuestras costas"
 SIA_get_off_our_shores_desc: "La presencia de tropas extranjeras en territorio de Siam es una afrenta que no puede aplacarse con excusas. Ya sea por la fuerza de las armas o por la presión de los acontecimientos sucedidos en el exterior, debemos insistir en que el invasor salga de nuestras fronteras y en devolver la dignidad a [ROOT.GetNameDef].\n\nSon cobardes, como todos los hombres crueles. A por ellos, saquémoslos de nuestras costas."
 SIA_singaporean_reinforcements: "Refuerzos de Singapur"
 SIA_singaporean_reinforcements_desc: "La contienda en Malasia y más allá va ligada a nuestra propia seguridad. Los refuerzos procedentes de los efectivos reunidos en torno a Singapur podrían endurecer nuestro frente, ampliar nuestra cooperación con los Aliados y unir este escenario bajo un propósito común."
 modify_SIA_directorate_of_aeronautical_engineering: "Modifica la §YDirectiva de Ingeniería Aeronáutica§! en:"
 SIA_aid_for_resources: "Ayuda a cambio de recursos"
 SIA_aid_for_resources_desc: "Nuestra nación posee recursos que las potencias extranjeras codician y carece de ciertas herramientas que estas pueden proporcionar. Un intercambio prudente de ayuda por materiales contribuirá al abastecimiento de [ROOT.GetNameDef] al tiempo que garantizará que nuestra riqueza contribuya a nuestra propia preservación."
 SIA_aid_for_resources_tt: "Pediremos a [JAP.GetNameDef] que se una a nuestra guerra, a cambio de que obtengan derechos sobre los recursos de caucho en §Y[724.GetName]§!."
 SIA_how_quickly_the_tables_turn: "Qué deprisa cambian las tornas"
 SIA_how_quickly_the_tables_turn_desc: "Los que en su momento consideraron a [ROOT.GetNameDef] una nación débil y sumisa podrían ver cómo la situación se invierte. La suerte en la guerra cambia de bando de manera súbita y debemos estar listos para aprovechar el momento en el que nuestros opresores flaqueen y las tornas se vuelvan finalmente en su contra."
 SIA_how_quickly_the_tables_turn_trigger: "Nos ha atacado una gran potencia y la hemos hecho capitular."
 SIA_royal_thai_navy: "Real Armada de Tailandia"
 SIA_royal_thai_navy_desc: "La defensa de [ROOT.GetNameDef] no termina en la línea de costa. Nuestras costas, ríos y comercio marítimo exigen una flota digna de un reino. Al reforzar la Real Armada de Tailandia garantizaremos que Siam siga siendo dueña de sus propias aguas."
 modify_royal_thai_navy: "Modifica §Y$idea_SIA_thai_royal_navy$§! en:"
 SIA_direct_army_fundings_towards_the_navy: "Financiación militar directa para la armada"
 SIA_direct_army_fundings_towards_the_navy_desc: "El ejército ha absorbido durante mucho tiempo la mayor parte del gasto militar y, sin embargo, las necesidades estratégicas de [ROOT.GetNameDef] se extienden más allá del continente. Al redirigir fondos hacia la flota, podremos empezar a corregir este desequilibrio y proteger los mares que amparan nuestro comercio y nuestra costa."
 SIA_thonburi_class_coastal_defense_ship: "Buque de defensa costera de clase Thonburi"
 SIA_thonburi_class_coastal_defense_ship_desc: "Una flota modesta puede hacer mucho daño si se diseña buscando favorecer las condiciones locales. La clase Thonburi ofrece a [ROOT.GetNameDef] un medio práctico de defensa costera, combinando una potencia de fuego respetable con una función adecuada para las aguas que más urgentemente debemos proteger."
 SIA_acquire_submarines: "Conseguir submarinos"
 SIA_acquire_submarines_desc: "Los submarinos ofrecen a una pequeña armada la posibilidad de hacer daño a enemigos más poderosos. Ocultos bajo las olas, pueden amenazar el tráfico marítimo, disuadir a flotas más fuertes y complicar cualquier plan hostil contra nuestras costas. [ROOT.GetNameDefCap] no debería descuidar un arma tan poderosa."
 SIA_submarine_day: "Día del submarino"
 SIA_submarine_day_desc: "La incorporación de la guerra submarina a nuestra flota merece reconocimiento público y entusiasmo nacional. Si celebramos el poderío de nuestros submarinos, podemos fomentar el reclutamiento, ganar prestigio y fijar la idea en el subconsciente colectivo de que Siam entra en una nueva era naval."
 SIA_the_thonburi_dockyard_project: "El proyecto de astillero de Thonburi"
 SIA_the_thonburi_dockyard_project_desc: "Una armada no puede sostenerse solo a base de buques importados. Si [ROOT.GetNameDef] pretende mantener y ampliar sus fuerzas marítimas, debe invertir en los astilleros, los talleres y la mano de obra que forman los auténticos cimientos del poder en las aguas."
 SIA_expand_the_slipways: "Expandir las gradas"
 SIA_expand_the_slipways_desc: "Nuestras instalaciones actuales son demasiado pequeñas para las ambiciones que se están fraguando. Al expandir las gradas, aumentaremos nuestra capacidad de construir y reparar navíos, permitiendo que la flota crezca en tamaño y disposición."
 SIA_a_new_drydock: "Un dique seco nuevo"
 SIA_a_new_drydock_desc: "Un mantenimiento naval en condiciones exige un dique seco moderno. Sin él, el mantenimiento de los barcos más grandes no deja de ser lento, ineficiente y dependiente del apoyo extranjero. Un nuevo dique seco le dará a [ROOT.GetNameDef] un control más firme de su propio futuro naval."
 SIA_install_heavy_cranes_and_power_plant: "Instalar grúas pesadas y centrales eléctricas"
 SIA_install_heavy_cranes_and_power_plant_desc: "La construcción naval no es meramente una cuestión de madera y acero, sino de maquinaria y energía. Contar con grúas pesadas y un suministro eléctrico fiable transformará nuestros astilleros, que pasarán de ser instalaciones toscas a instrumentos adecuados para la industria moderna."
 SIA_establish_the_foundry_and_machine_shop: "Establecer la fundición y el taller de reparación de maquinaria"
 SIA_establish_the_foundry_and_machine_shop_desc: "Una armada soberana requiere algo más que cascos montados con piezas importadas. Al fundar nuestra propia fundición y taller mecánico, reforzaremos el poderío industrial que permitirá a [ROOT.GetNameDef] fundir, dar forma y reparar en casa los componentes vitales de los buques de guerra."
 SIA_the_thonburi_arsenal: "El arsenal de Thonburi"
 SIA_the_thonburi_arsenal_desc: "Un astillero sin armamento sigue estando incompleto. Establecer un arsenal en Thonburi permitirá la fabricación y el almacenamiento de cañones navales, municiones y equipo relacionado, vinculando nuestra flota aún más a la industria nacional."
 SIA_focus_on_commercial_civilian_ships: "Centrarse en los barcos civiles mercantes"
 SIA_focus_on_commercial_civilian_ships_desc: "No todos los buques que se construyan deben estar destinados a la batalla. Los mercantes, los transportes y otros buques civiles forman el sistema circulatorio de la economía nacional. Al fomentar la construcción naval comercial, [ROOT.GetNameDef] fortalece tanto su prosperidad como su resistencia en tiempos de guerra."
 SIA_empower_the_coastguard: "Dar poder a la guardia costera"
 SIA_empower_the_coastguard_desc: "La flota no puede estar en todas partes al mismo tiempo, y es mejor que muchas tareas de la seguridad costera estén en manos de servicios más menos acuciantes. Una guardia costera reforzada protegerá nuestras pesquerías, vigilará nuestras costas y dejará libre a la armada para ocuparse de amenazas más graves."
 SIA_river_patrols: "Patrullas fluviales"
 SIA_river_patrols_desc: "Los ríos de [ROOT.GetNameDef] son carreteras, fronteras y fuentes de sustento al mismo tiempo. Las lanchas que patrullen esas aguas nos ayudarán a mantener el orden, prestar apoyo a las guarniciones locales y extender el alcance del Estado a regiones donde una capital lejana tardaría en actuar."
 SIA_sell_bangkok_dock_co: "Vender el astillero de Bangkok"
 SIA_sell_bangkok_dock_co_desc: "El capital privado puede lograr lo que la gestión estatal lleva a cabo con demasiada lentitud. Vender el astillero de Bangkok a alguien competente podría atraer inversiones, estimular la eficiencia y redirigir fondos públicos a necesidades militares más acuciantes."
 SIA_a_race_against_time: "Una carrera contra el tiempo"
 SIA_a_race_against_time_desc: "Nuestra armada está obsoleta, mal financiada y escasamente preparada para la guerra moderna. Los fondos deben redirigirse de inmediato a la construcción naval, la modernización de buques, la defensa costera y el entrenamiento naval. El tiempo corre más deprisa que nuestros astilleros."
 SIA_a_race_against_time_tt: "Tras agotarse el espíritu, obtendremos: "
 SIA_a_race_against_time_tt2: "durante §Y280§! días"
 #Tech
 the_thunder_at_our_gates_artillery: "El trueno a nuestras puertas"
 SIA_siamese_tankettes: "Tanquetas de Siam"
 SIA_siamese_tankettes_desc: "Nuestro ejército se ha familiarizado con su flota de tanquetas ligeras, lo que ha mejorado su fiabilidad y reducido el coste de mantenimiento en el campo de batalla."
 #Ideas
 idea_SIA_the_army_of_siam: "El ejército de Siam"
 idea_SIA_the_army_of_siam_tt: "Modifica §Y$idea_SIA_the_army_of_siam$§!:"
 idea_SIA_the_thunder_at_our_gates: "El trueno a nuestras puertas"
 idea_SIA_yielded_the_air_war: "Abandonar la guerra aérea"
 idea_SIA_yielded_the_air_war_desc: "Ahora que hemos cedido el control del espacio aéreo, estamos destinando esos recursos a las defensas antiaéreas en lugar de luchar por la superioridad aérea."
 idea_SIA_steel_arteries: "Arterias de acero"
 idea_SIA_unconventional_tank_construction: "Construcción de tanques no convencionales"
 idea_SIA_short_war: "Planificación de una guerra corta"
 idea_SIA_short_war_temp_buff: "Fervor por una guerra corta"
 idea_SIA_short_war_temp_debuff: "Agotamiento por una guerra corta"
 SIA_no_supply_grace_tt: " $MODIFIER_NO_SUPPLY_GRACE$ $RIGHT|+=1$ hora(s)"
