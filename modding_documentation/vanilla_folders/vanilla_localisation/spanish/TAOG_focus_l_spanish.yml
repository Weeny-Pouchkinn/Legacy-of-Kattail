 INSHOL_foundations_of_defense_desc: "$HOL_the_foundations_of_defense_desc$"
 INSHOL_investments_in_civ_railways_tt: "Si [HOL.GetFlag]§Y[HOL.GetName]§! completa el enfoque:\n         ([INS.GetFlag]§Y[INS.GetName]§!: Añade §Y£autonomy_texticon -250,00§!)\n   Si [INS.GetFlag]§Y[INS.GetName]§! completa el enfoque:\n         Añade §Y£autonomy_texticon 250,00§!"
 INSHOL_investments_in_civ_railways: "Inversión en ferrocarriles civiles"
 INSHOL_investments_in_civ_railways_desc: "Ganarte el apoyo de la gente de las Indias requiere invertir en infraestructura civil. Actualmente, nuestros ferrocarriles se usan sobre todo para el transporte de carga. Deberíamos comprar trenes de pasajeros para llevarlos por nuestros ferrocarriles preexistentes de Java y Sumatra."
 INSHOL_continue_exclusive_rights: "Derechos exclusivos del De Javasche Bank"
 INSHOL_continue_exclusive_rights_desc: "El florín de las Indias Orientales ha perdido casi todo su valor con la Gran Depresión y nuestro crecimiento económico se ha detenido. Podríamos intentar estabilizar el florín dando al Banco de Java los derechos exclusivos de impresión, que tuvo hasta 1922."
 INSHOL_peg_indies_guilder_to_dutch_guilder: "Ajustar el florín de las Indias al florín de los Países Bajos"
 INSHOL_peg_indies_guilder_to_dutch_guilder_desc: "El florín de las Indias Orientales ha perdido casi todo su valor con la Gran Depresión y nuestro crecimiento económico se ha detenido. La solución más fácil es ajustar el florín de las Indias al florín de los Países Bajos, una moneda mucho más estable. Esto también nos unirá más a nuestro gobernante."
 INSHOL_peg_indies_guilder_to_us_dollar: "Ajustar el florín de las Indias al dólar estadounidense"
 INSHOL_peg_indies_guilder_to_us_dollar_desc: "El florín de las Indias Orientales ha perdido casi todo su valor con la Gran Depresión y nuestro crecimiento económico se ha detenido. Aunque podríamos ajustar el florín de las Indias al florín de los Países Bajos, el dólar estadounidense es una moneda mucho más estable. Ajustar el florín al dólar también nos permite tener mayor independencia económica, haciendo que el autogobierno sea una meta mucho más alcanzable."
 indonesia_currency_pegged_to_dollar_modifier: "Florín de las Indias vinculado al dólar estadounidense"
 INS_direct_rule_tt: "Desbloquea la §Y$INS_direct_rule_occupation_law$§! ley de ocupación en los principados indonesios.\nEfectos:\n     §GAumenta§! las fábricas y recursos del estado.\n     §RReduce§! el crecimiento del cumplimiento.\n     §RAumenta§! el crecimiento de resistencia."
 INS_local_autonomy_tt: "Desbloquea la §Y$INS_local_autonomy_occupation_law$§! ley de ocupación en los principados indonesios.\nEfectos:\n     Ofrece §Ypequeñas§! mejoras generales.\n     §GAumenta§! el crecimiento de resistencia."
 INS_invest_in_batavian_education_req_tt: "Ha completado al menos §Y3§! misiones del Volksraad."
 INS_invest_in_batavian_education_req_2_tt: "Ha completado al menos §Y6§! misiones del Volksraad."
 INSHOL_eventual_autonomy_req_tt: "Ha completado al menos §Y4§! misiones del Volksraad."
 indonesia_volksraad_passed_12: "La bandera nacional indonesia goza ya de reconocimiento oficial"
 INS_stronghold_java_tt: "Cualquier estado indonesio: no está ocupado por [ROOT.GetFlag][ROOT.GetNameDefCap]."
 INSHOL_request_east_timor: "Exigir la devolución de Timor Oriental"
 INSHOL_request_east_timor_desc: "Portugal no tiene derecho a ocupar Timor. Es un vestigio de la historia colonial que no debemos seguir tolerando, dado que es territorio legítimamente indonesio. Exigiremos formalmente a Portugal que nos devuelvan Timor inmediatamente."
 INS_resist_occupation: "Resistir la ocupación"
 INS_resist_occupation_desc: "El enfado que sienten muchos indonesios contra los Países Bajos no puede llevarnos a caer en el fascismo. Debemos hacer todo lo que esté en nuestra mano para resistir la invasión japonesa y defender la patria."
 INS_local_resistance: "Resistencia local"
 INS_local_resistance_desc: "Estableceremos células de resistencia en territorio que no haya sido ocupado aún, garantizando que, si lo ocupan, estaremos preparados para retomarlo cuando sea el momento adecuado."
 INS_stronghold_java: "Java como baluarte"
 INS_stronghold_java_desc: "Las Indias son un inmenso archipiélago hogar de numerosos pueblos y terreno extremadamente inclemente. Intentar defender hasta la última isla, selva y montaña de un ejército mucho más grande que el nuestro garantiza el fracaso. Aunque no es fácil abandonar a nuestros compatriotas, la mejor opción para la nación en conjunto puede ser evacuar todas las islas excepto Java, lo que nos permitirá apostar todo nuestro ejército allí."
 INS_silence_nationalists: "Silenciar a los simpatizantes nacionalistas"
 INS_silence_nationalists_desc: "La invasión japonesa ha provocado que los movimientos nacionalistas revolucionarios empiecen a apoyar a los invasores japoneses debido a su enemigo compartido, los Países Bajos. La inestabilidad producida por la invasión ha hecho que estos movimientos aumenten a un ritmo nunca visto. Si no hacemos algo al respecto ya, no vamos a ser capaces de contenerlos."
 INS_east_indies_exile_government: "Gobierno en el exilio de las Indias Orientales"
 INS_east_indies_exile_government_desc: "Por desgracia, pese a nuestros esfuerzos, las Indias han caído, aunque no hay que perder la esperanza. Debemos seguir haciendo lo que podamos con los limitados recursos disponibles con los que contamos. Quizá hayamos perdido la batalla, pero no así la guerra."
 INS_establish_nefis: "Fundar el NEFIS"
 INS_establish_nefis_desc: "Crearemos el servicio de inteligencia en las Indias Orientales de los Países Bajos, que apostaremos en Australia. A través de él, realizaremos operaciones clandestinas para sabotear a las fuerzas de ocupación japonesas. Mediante cada pequeña victoria, nos acercaremos a nuestro retorno a la patria."
 INS_evacuate_soldiers_to_australia: "Evacuar soldados a Australia"
 INS_evacuate_soldiers_to_australia_desc: "Crearemos una base militar cerca de la base del NEFIS en el norte de Australia. Allí, apostaremos a los soldados del KNIL que han evitado ser capturados durante la ocupación, permitiéndonos seguir luchando."
 INS_australian_weapons: "Armas australianas"
 INS_australian_weapons_desc: "No es fácil realizar operaciones clandestinas y necesitaremos equipo apropiado para tener éxito. Podemos autorizar el uso de fábricas australianas y reconvertirlas para producir armas para el NEFIS."
 INS_defenders_of_homeland: "Defensores de la patria"
 INS_defenders_of_homeland_tt: "Este enfoque se completará automáticamente si los Defensores de la patria se establecen."
 INS_resist_occupation_tt: "Este enfoque se completará automáticamente si sufrimos una invasión y no nos rendimos."
 INS_defenders_of_homeland_desc: "El gobierno de las Indias ha caído y un nuevo régimen ha ocupado su lugar. Guiados por los nacionalistas y el gobierno japonés, crearemos un ejército nuevo superior al KNIL y ganaremos la guerra. Sin embargo, no se puede negar que esta alianza entre nacionalistas e imperialistas es frágil. ¿Durará la alianza o terminará con un baño de sangre?"
 INS_embrace_co_prosp_sphere: "Aceptar la Esfera de Coprosperidad"
 INS_embrace_co_prosp_sphere_desc: "Por fin hemos dado por terminado el dominio neerlandés. Aunque solo hemos reemplazado a un gobernante por otro, las promesas de prosperidad económica y panasianismo son muy tentadoras. Seguiremos apoyando a los japoneses en la guerra para garantizar que los Países Bajos no vuelvan a intentar conquistar Indonesia jamás."
 INS_seize_oppurtunity: "Aprovechar la oportunidad"
 INS_seize_oppurtunity_desc: "[JAP.GetNameDefCap] está perdiendo y su gobierno de ocupación es débil. Por primera vez en muchos siglos, tenemos una verdadera oportunidad de romper los grilletes de Indonesia para siempre, creando una nación independiente. Si no aprovechamos esta oportunidad para declarar la independencia ahora, ¿quién sabe cuánto pasará hasta tener otra?"
 INS_japanese_resource_infrastructure: "Financiar el esfuerzo bélico mayor"
 INS_japanese_resource_infrastructure_desc: "Darle el control de nuestra infraestructura de extracción de recursos a [JAP.GetNameDef] es un paso necesario para ganar la guerra, pues es de absoluta prioridad que las unidades [JAP.GetAdjective] permanezcan totalmente abastecidas en todo momento. [JAP.GetNameDefCap] también desarrollará nuestra infraestructura local para aumentar la eficiencia de las exportaciones de recursos."
 INS_japanese_army_training: "Reformar el ejército"
 INS_japanese_army_training_desc: "Tenemos mucho que aprender de nuestros señores [JAP.GetAdjective], y ahora que se ha disuelto el KNIL, deberíamos crear un nuevo ejército bajo el amparo del Ejército Imperial Japonés, listo para defender Indonesia de amenazas externas."
 INS_governor_general_de_jonge: "Gobernador general de Jonge"
 INS_governor_general_de_jonge_desc: "Bonifacius Cornelis de Jonge es conocido por gobernar con puño de hierro, oponiéndose a cualquier forma de nacionalismo e ignorando frecuentemente los deseos del Volksraad. Su gobierno de las Indias ha durado mucho tiempo y su experiencia se extiende hasta la Gran Guerra, en la que sirvió como ministro de la Guerra de las Indias."
 INS_governor_general_tjarda: "Gobernador general Tjarda"
 INS_tjarda_explain_tt: "El mandato de§YBonifacius Cornelis de Jonge§! ha llegado a su fin y §YAlidius Tjarda van Starkenborgh Stachouwer§! ha sido elegido para reemplazarlo como Gobernador en septiembre de 1936."
 INS_governor_general_tjarda_desc: "Alidius Tjarda van Starkenborgh Stachouwer tiene una visión ligeramente distinta para las Indias que su predecesor. Aunque sigue oponiéndose al nacionalismo, tiene políticas algo más liberales y muestra más predisposición a escuchar los deseos del Volksraad."
 INS_electrical_investments: "Inversiones eléctricas"
 INS_electrical_investments_desc: "Todas las naciones industrializadas europeas tienen una red eléctrica fuerte para apoyar su industria. Si queremos dejar de depender de las exportaciones de materiales y crear nuestra propia industria de fabricación como ellos, deberíamos construir una red eléctrica de alta capacidad por toda Java."
 INS_reduce_land_taxes: "Bajar los impuestos sobre la tierra"
 INS_reduce_land_taxes_desc: "Los elevados impuestos que gravan la propiedad de la tierra han dificultado que los indonesios nativos posean plantaciones y negocios. Aunque esto nos ha facilitado tener el monopolio sobre la industria del caucho, ha provocado problemas económicos en todo el país. Deberíamos considerar reducir estos impuestos a sus niveles anteriores, haciendo posible así que se pongan en marcha plantaciones de caucho más pequeñas en manos privadas."
 INS_invest_in_batavian_education: "Inversión en la educación de Batavia"
 INS_invest_in_batavian_education_desc: "El Volksraad ha dejado claro que la voluntad del pueblo de Indonesia es que la educación sea más accesible, pues en la actualidad solo pueden permitírsela principalmente los indonesios neerlandeses y la pequeña élite indonesia. Para cumplir la moción del Volksraad, deberíamos construir varias escuelas primarias y secundarias en Batavia y sus alrededores."
 INS_javanese_education_investments: "Inversiones en la educación de la población de Java"
 INS_javanese_education_investments_desc: "Además de nuestro proyecto en marcha para construir escuelas primarias y secundarias, podríamos construir una escuela universitaria y academias vocacionales especializadas, lo que hará que la educación superior sea mucho más accesible para las familias de clase media."
 INS_allow_local_autonomy: "Permitir la autonomía local"
 INS_allow_local_autonomy_desc: "El sistema de Vorstenlanden que otorga a los principados el autogobierno ha hecho que los movimientos nacionalistas sean mucho más fáciles de controlar y ha aumentado la estabilidad de la nación en conjunto. Deberíamos incrementar el nivel de autonomía otorgada a los principados aún más, permitiendo de esa manera que el gobierno se centre en cuestiones más importantes."
 INS_direct_rule: "Autogobierno"
 INS_direct_rule_desc: "El sistema de Vorstenlanden que otorga a los principados el autogobierno ha añadido una capa de dificultad a la administración, lo que implica la necesidad de burocracia adicional y más pérdida de tiempo. Es hora de abolir el sistema completamente en todo el archipiélago."
 INS_seize_oppurtunity_tt: "§Y[JAP.GetFlag][JAP.GetName]§! se ha visto obligado a retroceder y controla menos de §Y[?var:temp_states_plus_more]§! estados (número actual: §Y[?var:JAP.num_controlled_states]§!)."
 INS_seize_oppurtunity_refuse_warn_tt: "§RLa revolución nacional comenzará, lo que puede desembocar en una guerra contra [HOL.GetNameDef]§!."
 INS_economic_stabilization: "Estabilización económica"
 INS_economic_stabilization_desc: "La Gran Depresión y el proteccionismo mundial nos han dejado paralizados económicamente, y muchos indonesios que antes trabajaban en la industria de las materias primas se han visto abocados a engrosar la lista del paro. Debemos adoptar medidas drásticas y crear un programa laboral en el que a los ciudadanos sin empleo se les asigne uno."
 INS_restore_order_in_indies: "Restablecer el orden en las Indias"
 INS_restore_order_in_indies_desc: "El movimiento nacionalista en auge en estos momentos en las Indias ha desestabilizado varias regiones y podría acabar fuera de control si no lo detenemos. Nuestra principal prioridad debe ser restablecer el orden y la estabilidad."
 INS_detangle_supply_chains: "Desenmarañar las cadenas de suministro"
 INS_detangle_supply_chains_desc: "Nuestra economía de exportaciones requiere que los bienes pasen por decenas de intermediarios hasta llegar al fin a su destino, suponiendo a cada paso el cobro de una tasa o un impuesto, o reduciendo el margen de beneficios de algún modo. Deberíamos desenmarañar este sistema y controlar directamente la mayor parte de la cadena de suministro."
 INS_prioritize_industrial_growth: "Priorizar el crecimiento industrial"
 INS_prioritize_industrial_growth_desc: "Nuestra economía de exportaciones es demasiado volátil y nos ata a la colaboración del gobierno holandés. Deberíamos esforzarnos en crear una red de industria de fabricación por toda Batavia. Podríamos convertirnos en el país más industrializado del Pacífico."
 INS_closer_economic_ties_to_netherlands: "Lazos económicos más estrechos con los Países Bajos"
 INS_closer_economic_ties_to_netherlands_desc: "Tenemos mucho que aprender de nuestro gobernante, especialmente en lo económico. Si integrásemos más nuestra economía de exportaciones con los Países Bajos, podríamos utilizar su infraestructura y sus conexiones para garantizar acuerdos comerciales más lucrativos."
 INS_prioritize_dutch_companies: "Dar prioridad a las empresas neerlandesas"
 INS_prioritize_dutch_companies_desc: "Las empresas neerlandesas como Shell o Fokker llevan siendo la espina dorsal de nuestra economía desde hace siglos, estando nuestras exportaciones de materias primas fuertemente integradas con Shell. Esto ha traído riquezas significativas a las Indias, y deberíamos darles prioridad sobre negocios locales más pequeños para garantizar que nuestra cooperación mantenga su fuerza."
 INSHOL_java_factories: "Abrir fábricas de armas en Java"
 INSHOL_java_factories_desc: "Aunque sean básicas, es innegable que construir más fábricas de armas ayuda mucho a mejorar la fortaleza de un ejército. Como centro industrial de la colonia, Java es el emplazamiento obvio donde construirlas."
 INSHOL_license_dutch_weapon_blueprints: "Autorizar planos de armas neerlandesas"
 INSHOL_license_dutch_weapon_blueprints_desc: "En vez de investigar la construcción de todo un proceso de fabricación nacional y crear nuestros propios diseños tecnológicos, deberíamos cooperar con las empresas neerlandesas para comprar los planos de sus armas."
 INSHOL_bangka_production_lines: "Cadenas de producción de Bangka"
 INSHOL_bangka_production_lines_desc: "El desarrollo exponencial de la infraestructura de Bangka como resultado del proyecto Bangka ha convertido esta pequeña isla otrora insignificante en el lugar perfecto para nuevos proyectos industriales. Tenemos una oportunidad de reforzar el KNIL construyendo una nueva fábrica de armas en Bangka, que debido a la concentración de carreteras, ferrocarriles y puertos de la isla funcionará con más eficiencia que si la hubiéramos erigido en otro sitio."
 INSHOL_artillerie_inrichtingen: "Artillerie Inrichtingen"
 INSHOL_artillerie_inrichtingen_desc: "Artillerie Inrichtingen lleva fabricando artillería y otro tipo de armamento en los Países Bajos desde hace más de 250 años, y ha estado actuando en las Indias desde hace varias décadas. Expandir su capacidad de fabricación abriendo nuevas fábricas en esos territorios mejoraría significativamente el potencial del KNIL a la vez que reforzaría la economía de zonas con poca financiación creando nuevos empleos."
 INSHOL_ai_pyrotechnische: "Artillerie Inrichtingen Pyrotechnische"
 INSHOL_ai_pyrotechnische_desc: "Siguiendo con la expansión de las instalaciones de producción de Artillerie Inrichtingen en las Indias Orientales, sería conveniente financiar la creación de una división de la subsidiaria pirotécnica de Artillerie Inrichtingen en dicho territorio."
 INSHOL_bio_pharma: "Bio Pharma"
 INSHOL_bio_pharma_desc: "Expandir la industria farmacéutica de las Indias es el siguiente paso obvio para reformar el KNIL y garantizar que los soldados heridos reciban tratamiento adecuado y se recuperen de forma segura. El predominio de la quinina en las Indias hace que el coste de este proyecto sea sustancialmente más bajo de lo normal."
 INSHOL_develop_fighters: "Desarrollar nuevos cazas"
 INSHOL_develop_fighters_desc: "Enviaremos ingenieros de Batavia a Ámsterdam para estudiar la producción de cazas Fokker de primera mano, accediendo a los secretos de fabricación que con tanto celo guardan. Volverán con el conocimiento y las capacidades técnicas que se requieren para establecer una moderna industria nacional de cazas en las Indias."
 INSHOL_develop_bombers: "Desarrollar nuevos bombarderos"
 INSHOL_develop_bombers_desc: "Enviaremos ingenieros de Batavia a Ámsterdam para estudiar la producción de bombarderos Fokker de primera mano, accediendo a los secretos de fabricación que con tanto celo guardan. Volverán con el conocimiento y las capacidades técnicas que se requieren para establecer una moderna industria nacional de bombarderos en las Indias."
 INSHOL_bandung_aircraft_facility: "Instalaciones de fabricación de aeronaves de Bandung"
 INSHOL_bandung_aircraft_facility_desc: "Aunque los planos y los secretos de fabricación son valiosos, serán inútiles hasta que construyamos aviones con ellos. Abriremos nuevas instalaciones aeronáuticas en Bandung para cubrir las necesidades actuales del ML-KNIL."
 INSHOL_netherlands_indies_air_doctrine: "La doctrina aérea de los Países Bajos y las Indias Orientales"
 INSHOL_netherlands_indies_air_doctrine_desc: "Estudiaremos las fuerzas aéreas de naciones que se enfrentan a problemáticas similares a las nuestras, inspirándonos en su experiencia, adquirida a base de mucho esfuerzo, para dar forma a una doctrina que responda a las realidades de las Indias Orientales sin tener que repetir sus errores."
 INSHOL_manado_military_academy: "Academia Militar de Macasar"
 INSHOL_manado_military_academy_desc: "Establecer una academia militar fuera de Java ayudará a mitigar nuestra falta de mano de obra significativamente haciendo posible el reclutamiento en las islas orientales. Macasar, ubicado en el centro de las Indias Orientales, es el lugar perfecto."
 INSHOL_infantry_training_in_borneo: "Entrenamiento de infantería en Borneo"
 INSHOL_infantry_training_in_borneo_desc: "Las Indias Orientales se caracterizan por sus junglas densas, sus montañas agrestes y un terreno inclemente. Nuestros soldados, apostados en su mayoría en Java, apenas están preparados para luchar en estas condiciones. Debemos fomentar el entrenamiento militar más allá de Java y llevar a cabo un programa de prácticas en entornos más hostiles. Pocos lugares hay en la Tierra comparables a las junglas y montañas de Borneo, haciendo que sea la ubicación perfecta para entrenar comandos de primera categoría."
 INSHOL_knil_engineers: "Ingenieros del KNIL"
 INSHOL_knil_engineers_desc: "No debemos centrar todos nuestros esfuerzos en la infantería y la producción de fusiles, pues hay que tener en cuenta que la logística y las comunicaciones desempeñan un papel esencial a la hora de ganar batallas. Deberíamos entrenar a ingenieros y financiar las escuelas vocacionales de Batavia para garantizar que nuestro ejército no se vea limitado por una logística deficiente."
 INSHOL_work_with_oil_barons: "Cooperar con los magnates del petróleo"
 INSHOL_work_with_oil_barons_desc: "La Gran Depresión ha dejado expuesta y en un estado deprimente a nuestra economía, pues nos hemos dedicado exclusivamente a las exportaciones. Quizá haya llegado el momento de plantearse delegar algunas de las negociaciones comerciales en los magnates del petróleo de Sumatra para garantizar que el crudo se venda. Sin embargo, esto tendrá un coste, porque para que acepten este trato tendremos que vender el petróleo a precios muy por debajo de los de mercado."
 INSHOL_rubber_taxation: "Impuestos del caucho"
 INSHOL_rubber_taxation_desc: "Las inversiones y los conocimientos de los Países Bajos han transformado las plantaciones de caucho de las Indias Orientales en uno de los recursos más valiosos del imperio. Es justo que la Corona reclame la parte que le corresponde de la riqueza que ha creado. A pesar de las protestas por parte de ciertos políticos locales, la agitación en las provincias no puede dictar los intereses del imperio."
 INSHOL_padang_port: "Puerto internacional en Padang"
 INSHOL_padang_port_desc: "Los recursos producidos en Padang deben pasar primero por Java antes de alcanzar los mercados internacionales, dado que la región carece de instalaciones capaces de gestionar convoyes grandes. Este desvío innecesario constriñe nuestra cadena de suministro y limita el potencial económico de Sumatra. Al construir un gran puerto mercantil en Padang, evitaremos dar ese rodeo y aumentaremos la rentabilidad de las plantaciones de Padang."
 INSHOL_subsidize_bauxite: "Otorgar subvenciones a proyectos de bauxita"
 INSHOL_subsidize_bauxite_desc: "El proyecto actual en las Indias para modernizar las islas Bangka-Belitung, ricas en bauxita, es muy prometedor, y tiene un gran potencial para reportar beneficios a largo plazo. Deberíamos apoyar al gobierno de las Indias con subvenciones económicas para acelerar el proyecto."
 INSHOL_agricultural_subsidies: "Privatizar el sector agrícola"
 INSHOL_agricultural_subsidies_desc: "Al permitir que se establezcan granjas privadas de distintos tamaños, podemos impulsar el desarrollo de la infraestructura en regiones rurales con poca financiación a la vez que aumentamos los ingresos del gobierno. Para conseguirlo, crearemos un marco recaudatorio estructurado en el que todos los impuestos recaudados generados por estas granjas se envíen directamente a los Países Bajos en vez de pasar por las Indias."
 INSHOL_import_sugar: "Importar azúcar"
 INSHOL_import_sugar_desc: "Exigiremos que se controlen los precios en el creciente sector agrícola de las Indias para importar todo el azúcar de la nación de las plantaciones de las Indias, a precios que ningún otro gobierno puede igualar, y establecer así el monopolio del producto."
 INSHOL_import_lumber: "Importar madera"
 INSHOL_import_lumber_desc: "Exigiremos que se controlen los precios en el creciente sector agrícola de las Indias para importar toda la madera de la nación de las plantaciones de las Indias, a precios que ningún otro gobierno puede igualar, y establecer así el monopolio del producto."
 INSHOL_industrialized_colony: "La colonia industrializada"
 INS_no_peta_tt: "Indonesia no podrá cooperar con los invasores extranjeros."
 INSHOL_industrialized_colony_desc: "Las Indias Orientales, que fueron una humilde colonia, se han convertido en una de las regiones más industrializadas y ricas de toda Asia. Esto supone un hito crucial en la historia de los Países Bajos y, ya que estamos, de la humanidad. Nuestro esfuerzo ha dado resultado y seguiremos invirtiendo en el desarrollo de nuestra colonia para que los Países Bajos sean de nuevo considerados potencia mundial."
 INSHOL_economic_integration: "Integración económica"
 INSHOL_economic_integration_desc: "Las Indias Orientales Neerlandesas son la joya resplandeciente de nuestro imperio, tras asegurar su prosperidad mediante el firme liderazgo de la reina, el primer ministro y el gobernador general. No hay que poner en peligro esta estabilidad con temerarias llamadas a la independencia, que solo traerían desorden y decadencia. Debemos reforzar los lazos económicos entre los Países Bajos y las Indias aún más, garantizando que su estabilidad y su grandeza sigan prosperando."
 INSHOL_republic_of_indonesia: "La República de Indonesia"
 INSHOL_republic_of_indonesia_desc: "Cuando los Países Bajos aceptaron a regañadientes la Petición de Soetardjo, la legislación resultante vinculó la autodeterminación de Indonesia a una larga lista de condiciones para poder ser considerada económicamente autosuficiente. Pese a ello, estas condiciones ahora se han cumplido completamente gracias al empeño del pueblo indonesio, y los Países Bajos no tienen más remedio que aceptar nuestra declaración formal de independencia."
 INSHOL_propose_malay_unification: "Proponer la unificación malaya"
 INSHOL_propose_malay_unification_desc: "Indonesia es un archipiélago hogar de cientos de culturas, lenguas y etnias. Aunque algunas son similares, otras son notablemente distintas. Y, sin embargo, por las penurias compartidas del dominio colonial, hemos encontrado la unidad en una sola nación: Indonesia. Quizá deberíamos preguntarnos por qué esta unidad tendría que detenerse ahí, cuando al otro lado de los estrechos el pueblo malasio comparte con nosotros historia y aspiraciones."
 INSHOL_singapore_compromise: "El acuerdo de Singapur"
 INSHOL_singapore_compromise_desc: "Singapur es tierra indonesia en su historia y su cultura, y es natural que se incluya en una Indonesia unificada. Sin embargo, Gran Bretaña no está dispuesta a renunciar a la ciudad debido a su importancia estratégica y como base militar. Deberíamos proponer un acuerdo a través del cual Singapur entre en la unión a condición de que Gran Bretaña mantenga el derecho a apostar fuerzas en la isla."
 INSHOL_request_ceylon: "Solicitar la cesión de Ceilán"
 INSHOL_request_ceylon_desc: "La colonia británica de Ceilán comparte profundos vínculos culturales y lingüísticos con el mundo malayo en general. A medida que va creciendo la federación panmalaya de Maphilindo, lo normal es que esta isla también encuentre su lugar en la confederación."
 INSHOL_papua_referendum: "El referéndum de Papúa"
 INSHOL_papua_referendum_desc: "Hoy, la isla de Papúa está dividida entre Indonesia y Australia. Aunque nuestras inversiones y desarrollo han transformado nuestra mitad en una región próspera en crecimiento, el territorio administrado por Australia permanece abandonado y subdesarrollado. El futuro de la isla debería descansar en las manos de su pueblo, y por tanto exigimos un referéndum oficial sobre la unificación de Papúa."
 INSHOL_invite_phillipines: "Proponer Maphilindo"
 INSHOL_invite_phillipines_desc: "Los numerosos pueblos de nuestra unión hablan distintos idiomas y siguen distintas tradiciones; sin embargo, las raíces de todos ellos se remontan al mundo malayo. Deberíamos reformar nuestro estado conjunto como confederación panmalaya, invitando a las Filipinas como estado miembro. Lo que fue colonia insignificante ahora se alzará fuerte como potencia regional del Sudeste Asiático."
 INS_focus_time_reduce_usa_tt: "§Y$INS_realign_supply_chains$§! reducirá en 70 días el tiempo necesario para completar este enfoque."
 INS_focus_time_reduce_jap_tt: "§Y$INS_first_come_first_serve$§! reducirá en 70 días el tiempo necesario para completar este enfoque."
 INS_focus_time_reduce_fokker_tt: "§Y$INSHOL_east_indies_fokker_division$§! reducirá en 35 días el tiempo necesario para completar este enfoque."
 INS_focus_time_reduce_tjarda_tt: "§Y$INS_governor_general_tjarda$§! reducirá en 35 días el tiempo necesario para completar este enfoque."
 INS_focus_time_reduce_pki_tt: "§Y$INS_utilize_tan_malakas_militia$§! reducirá en 35 días el tiempo necesario para completar este enfoque."
