 AST_alp_popularity_decrease_5: "§Y$AST_ruling_party$§! (§Y$AST_alp$§!) Votos: §R-5,00%§!\n\n"
 AST_australian_military_forces: "Fuerzas militares australianas"
 AST_australian_military_forces_desc: "Templados por el fuego en la Gran Guerra, el ejército australiano demostró su temple en costas lejanas, manteniéndose firme en algunas de las campañas más brutales del conflicto. En los años que han pasado desde entonces, el ejército ha visto reducido su tamaño y ha sido reformado como fuerza defensiva, con la tarea principal de vigilar sus islas. Las lecciones que aprendió con sangre aún perduran, por si tuviera que volver a recurrir a ellas."
 AST_permanant_military_forces: "Fuerzas militares permanentes"
 AST_permanant_military_forces_desc: "La principal fuerza militar de Australia es la milicia encargada de defender el territorio continental. Sin embargo, en esta época de crecientes tensiones globales, es prudente establecer un cuadro de oficiales y soldados profesionales, muchos de los cuales adquirieron experiencia durante la Gran Guerra. Aunque inicialmente serviría como reserva, esta fuerza aportaría estabilidad y un nivel estandarizado de entrenamiento."
 AST_invoke_the_1903_defence_act: "Invocar la Ley de Defensa de 1903"
 AST_invoke_the_1903_defence_act_desc: "Tradicionalmente, Australia ha confiado en su milicia para la defensa nacional. Sin embargo, en épocas en las que haya alguna amenaza significativa, podemos invocar la Ley de Defensa de 1903. Esta ley nos permite reclutar a más mano de obra con fines defensivos."
 AST_lithgow_small_arms_factory: "Fábrica de armas ligeras de Lithgow"
 AST_lithgow_small_arms_factory_desc: "Establecida en 1912, la Fábrica de armas ligeras de Lithgow se creó para reducir la dependencia de las armas y equipos de fabricación británica en tiempos de guerra. Al haberse reavivado las tensiones mundiales, debemos ampliar la producción para satisfacer las crecientes necesidades de nuestras fuerzas armadas."
 AST_dingo_scout_car: "Vehículo de patrulla Dingo"
 AST_dingo_scout_car_desc: "Australia no tiene una gran tradición en cuanto al desarrollo de blindados, pero cada vez son más las voces entre nuestras fuerzas armadas las que piden que se refuerce ese ámbito. Por eso, deberíamos adoptar con mayor rigor los diseños de fabricación nacional, como el vehículo de reconocimiento Dingo."
 AST_volunteer_defence_corps_taog: "Cuerpos de defensa voluntarios"
 AST_volunteer_defence_corps_taog_desc: "Los cuerpos de defensa voluntarios se fundaron como una fuerza similar a la Guardia Nacional británica. Se trata de una milicia ciudadana no remunerada formada por hombres no aptos para el servicio regular. A pesar de esas limitaciones, su conocimiento del terreno de la zona sí que los hace idóneos para la guerra de guerrillas si ocurriese lo peor."
 AST_war_carriers: "Quienes llevan el peso de la guerra"
 AST_war_carriers_desc: "La logística gana guerras, y gran parte del terreno en el que opera Australia es poco apto para el transporte convencional, como los camiones o los trenes. En su lugar, debemos confiar en la mano de obra local, bien adaptada a las condiciones del terreno y familiarizada con las sendas ocultas y los atajos."
 AST_anzac_spirit: "Espíritu Anzac"
 AST_anzac_spirit_desc: "Los cuerpos del ejército australiano y neozelandés se ganaron una formidable reputación durante la Gran Guerra, pues aportaron un gran esfuerzo y vertieron mucha sangre en pos de la victoria del Imperio. Sus cualidades fueron evidentes para todos: resistencia, valor, ingenio y buen humor; combinadas con una natural capacidad para enfrentarse al peligro y las dificultades."
 AST_lee_enfield_no1_mark3: "Lee-Enfield N.º 1 Mk III*"
 AST_lee_enfield_no1_mark3_desc: "Ese pequeño asterisco importa: el Lee-Enfield N.º 1 Mk III* cuenta con modificaciones para tiempos de guerra que permiten una producción más rápida y barata. En cuanto la demanda supere incluso estos recortes, tendremos que adoptar un \"modelo distribuido\" en el que los componentes se produzcan en empresas más pequeñas y se ensamblen en Lithgow para aumentar la producción."
 AST_new_south_wales_government_railways: "Compañía del Ferrocarril Gubernamental de Nueva Gales del Sur"
 AST_new_south_wales_government_railways_desc: "Los talleres de la Compañía del Ferrocarril Gubernamental de Nueva Gales del Sur ofrecen una capacidad única: grandes componentes de acero fundidos en una sola pieza. Al ser una de las pocas naciones de la Mancomunidad capaz de producir cascos y torretas de tanque totalmente fundidos, deberíamos hacer buen uso de esta capacidad."
 AST_second_australian_imperial_force: "Segunda fuerza imperial australiana"
 AST_second_australian_imperial_force_desc: "Australia desplegó la primera fuerza imperial australiana durante la Gran Guerra; envió tropas al extranjero para luchar. Ahora que la guerra amenaza de nuevo con extenderse al mundo entero, deberíamos crear una segunda fuerza imperial para demostrar el poderío de Australia en el extranjero."
 AST_expeditionary_leader: "El §Ygeneral§! tendrá el rasgo §YLíder expedicionario§!, que mejora sus capacidades en el extranjero, pero limitará el número de divisiones a las que podrá dar órdenes."
 AST_expeditionary_leader_plural: "Los dos §Ygenerales§! tendrán el rasgo §YLíder expedicionario§!, que mejora sus capacidades en el extranjero, pero limitará el número de divisiones a las que podrán dar órdenes."
 AST_larrikinism: "Larrikinismo"
 AST_larrikinism_desc: "Definido como la cualidad de \"una persona basta, alborotadora pero de buen corazón\", el larrikinismo ha llegado a encarnar la cultura australiana: resistencia bruta, irreverencia ante la autoridad y desparpajo al desafiar al peligro. Durante la Gran Guerra, los soldados australianos se ganaron la reputación de afrontar las dificultades con entereza y tomárselo todo con calma."
 AST_diggers: "Diggers"
 AST_diggers_desc: "\"Cavad, cavad, cavad; hasta que estéis a salvo\" fue la orden que recibió el general William Birdwood cuando los cuerpos del ejército australiano y neozelandés desembarcaron en Galípoli, palabras que se convirtieron en sinónimo de la forma australiana de hacer la guerra. Sin embargo, el espíritu del Digger es más profundo y une a los soldados australianos y neozelandeses mediante la camaradería, ese vínculo duradero que surge al luchar junto a los camaradas y por ellos."
 AST_owen_gun: "Subfusil Owen"
 AST_owen_gun_desc: "El innovador subfusil Owen, de fabricación nacional, tiene reputación de ser robusto y fiable, igual que nuestros soldados. Mientras nuestras fuerzas combatan por todo el mundo, deberíamos fomentar el uso de esta arma; no solo como símbolo del ingenio y el diseño australianos, sino también de nuestro propio espíritu en la guerra."
 AST_department_of_supply_and_development_taog: "Departamento de Suministros y Desarrollo"
 AST_department_of_supply_and_development_taog_desc: "A medida que las exigencias de la guerra llevan a nuestros sistemas de producción y logística al límite, debemos centralizar nuestros esfuerzos en un organismo específico que se responsabilice de coordinarlos y mantenerlos."
 AST_sentinel_tank_development: "Desarrollo de tanques centinela"
 AST_sentinel_tank_development_desc: "Históricamente, hemos confiado en los diseños de tanques importados, incluso cuando los producíamos internamente. Deberíamos aprovechar las lecciones aprendidas sobre estas máquinas y, con cierta dosis de innovación australiana, desarrollar nuestro propio tanque, uno que se adapte a nuestras capacidades y recursos."
 AST_establish_training_camps: "Establecer campos de entrenamiento"
 AST_establish_training_camps_desc: "Al igual que en la Gran Guerra, se puede ordenar a la segunda fuerza imperial que combata en cualquier parte del mundo. Por lo tanto, debemos desarrollar programas integrales de entrenamiento que preparen a nuestros soldados para cualquier entorno, desde los desiertos del norte de África hasta las selvas del Pacífico Sur."
 AST_jungle_tanks_if_sentinel_tank_development: "Si hemos completado \"Desarrollo de tanques centinela\":"
 jungle_heavy_tanks: "Tanques pesados para la selva"
 AST_anti_malaria_campaign: "Campaña de lucha contra la malaria"
 AST_anti_malaria_campaign_desc: "Nuestras fuerzas pueden acudir a luchar en las selvas del Pacífico, donde les espera una amenaza más mortífera que las balas enemigas: la malaria. Debemos tomar medidas decisivas para proteger a nuestras tropas de este enemigo invisible."
 AST_defence_citizen_military_forces_act: "Ley de Fuerzas Militares Ciudadanas de Defensa"
 AST_defence_citizen_military_forces_act_desc: "Hasta ahora, solo se podía desplegar en el extranjero a los soldados profesionales voluntarios. A medida que el conflicto sigue agravándose, debemos establecer el marco jurídico que permita a las unidades milicianas servir en el extranjero si es necesario."
 AST_call_that_a_knife: "¡Sin problema!"
 AST_call_that_a_knife_desc: "\"Eso no es un cuchillo... ¡Esto es un cuchillo!\". Con un poco de chulería y humor se puede llegar muy lejos. Nuestros soldados se enfrentan al peligro con confianza, valentía y no poca fanfarronería."
 AST_army_inventions_directorate_taog: "Junta Directiva de Inventos Militares"
 AST_army_inventions_directorate_taog_desc: "Una de las pocas ventajas de la guerra, si es que puede llamarse así, es el rápido ritmo de la innovación tecnológica que impulsa la necesidad. Deberíamos crear una organización centralizada para desarrollar, perfeccionar y aprovechar estos avances."
 AST_yeramba: "Yeramba"
 AST_yeramba_desc: "Basándonos en el éxito de los vehículos desarrollados en Australia, como el Sentinel, hemos dado un paso más con el Yeramba, una nueva y poderosa incorporación a nuestro arsenal. Se trata de un cañón de 25 libras montado en el chasis de un tanque, lo que proporciona una potencia de fuego móvil y devastadora contra nuestros enemigos."
 AST_alice_springs: "Alice Springs"
 AST_alice_springs_desc: "El interior de Australia es grande..., muy grande. En su corazón se encuentra la pequeña ciudad de Alice Springs, que puede servir de eje logístico central para operaciones en toda Australia. Deberíamos desarrollarla y establecer una base del ejército para entrenar tropas y que estén preparadas para actuar en cualquier entorno."
 AST_australian_regular_army: "Ejército regular australiano"
 AST_australian_regular_army_desc: "Hemos aprendido numerosas lecciones, desde las playas de Galípoli hasta los desiertos del norte de África, las montañas de Grecia y las selvas del Sudeste Asiático. Esta dura experiencia ha forjado un ejército más flexible y adaptable que ningún otro."
 AST_no1_flying_training_school: "Escuela de entrenamiento de vuelo n.º 1"
 AST_no1_flying_training_school_desc: "Creada en 1921 al formarse la Real Fuerza Aérea Australiana, la Escuela de entrenamiento de vuelo se ha abierto y cerrado según ha ido fluctuando la demanda de personal aeronáutico. Debido al aumento de las tensiones mundiales, deberíamos reabrirla para formar a una nueva generación de pilotos y tripulaciones aéreas."
 AST_empire_air_training_scheme_taog: "Plan de entrenamiento aéreo imperial"
 AST_empire_air_training_scheme_taog_desc: "El Plan de Formación Aérea de la Mancomunidad Británica de Naciones ofrece importantes fondos económicos y conocimientos especializados a los países integrantes para que formen a un gran número de pilotos y tripulaciones aéreas. La competencia para acogerlo es feroz, liderada por Australia y Canadá como principales contendientes. Nosotros hemos presentado nuestra propia candidatura en el marco del plan de entrenamiento aéreo imperial."
 AST_volunteer_air_corps: "Cuerpo de Observadores Aéreos Voluntarios"
 AST_volunteer_air_corps_desc: "El espacio aéreo australiano es inmenso, va mucho más allá del alcance de las unidades oficiales. En su lugar, deberíamos confiar en los voluntarios de cada zona, que controlan miles de puestos de observación repartidos por todo el país, para vigilar nuestros cielos."
 AST_improved_ground_crews: "Equipos terrestres mejorados"
 AST_improved_ground_crews_desc: "Por cada piloto, hay todo un equipo de personal de tierra necesario para asegurar el correcto mantenimiento de las aeronaves, la coordinación de los vuelos y las operaciones en la base. Por no hablar de los navegantes, artilleros y bombarderos que los acompañan en el aire. Debemos establecer instalaciones de entrenamiento adecuadas para garantizar que nuestra fuerza aérea funcione con la máxima eficacia."
 AST_advanced_pilot_training: "Entrenamiento de pilotos avanzado"
 AST_advanced_pilot_training_desc: "A medida que las aeronaves se vuelven más complejas, rápidas y avanzadas, la destreza de nuestros pilotos debe mejorar de manera acorde para aprovechar al máximo estas tecnologías."
 AST_advanced_pilot_training_tt: "§G+10%§! de velocidad de adquisición de maestría para §Ydoctrinas aéreas§!."
 AST_commonwealth_aircraft_corporation_taog: "Corporación de aeronaves de la Mancomunidad"
 AST_commonwealth_aircraft_corporation_taog_desc: "Con el creciente interés en la guerra por el control de los cielos, debemos asegurarnos de no quedarnos atrás. Los civiles, con su entusiasmo por la innovación, ya han empezado a ver el potencial de la industria aeronáutica; si se les proporciona financiación para que empiecen, podemos fomentar y ampliar este sector emergente."
 AST_reestablish_central_flying_school: "Recuperar la escuela de vuelo central"
 AST_reestablish_central_flying_school_desc: "Otra de las escuelas de aviación de Australia, que opera junto a la Escuela de entrenamiento de vuelo n.º 1, ayudará a cubrir la creciente demanda de una fuerza aérea moderna. A medida que aumentan las tensiones, debemos asegurarnos de que nuestro personal cuenta con las instalaciones necesarias."
 AST_aerodrome_of_democracy_democracy: "Aeródromo de la democracia"
 AST_aerodrome_of_democracy_fascism: "Aeródromo de la dominación"
 AST_aerodrome_of_democracy_communism: "Aeródromo de la emancipación"
 AST_aerodrome_of_democracy_neutrality: "Aeródromo de la fuerza"
 AST_aerodrome_of_democracy: "[GET_AERODOME_NAME]"
 AST_aerodrome_of_democracy_desc: "Al haber alcanzado la culminación de la capacidad aeronáutica, la Fuerza Aérea Australiana se ha hecho merecedora del título de \"[GET_AERODOME_NAME]\". Nuestros aviadores libran combates aéreos por todo el planeta, y nuestros bombarderos proyectan una sombra mortífera sobre las industrias de nuestros enemigos."
 AST_government_aircraft_factories: "Fábricas de aviones gubernamentales"
 AST_government_aircraft_factories_desc: "Dada nuestra lejanía de Europa, no podemos confiar en las fuentes tradicionales de suministro de aviones en tiempos de guerra. Por lo tanto, es esencial que desarrollemos nuestras propias capacidades de fabricación nacional, que nos permitan producir los fuselajes y los motores de las aeronaves según nuestras propias especificaciones."
 AST_death_from_down_under_taog: "Muerte en Australia"
 AST_death_from_down_under_taog_desc: "Desde los confines del hemisferio sur, hemos forjado una fuerza aérea sin igual. Nuestros aviones se extienden por todo el planeta, atacan con precisión y fuerza devastadoras; dondequiera que se escondan nuestros enemigos, la muerte les llegará desde Australia."
 AST_ride_the_lightning: "A lomos del relámpago"
 AST_ride_the_lightning_desc: "Nuestros pilotos de caza, rápidos, agresivos e implacables, son la punta de lanza de nuestro poderío aéreo. A lomos del relámpago en la batalla, se hacen con el control de los cielos, interceptan aviones enemigos y garantizan que, dondequiera que acudan nuestras fuerzas, la superioridad aérea les pise los talones."
 AST_the_gathering_storm: "La tormenta inminente"
 AST_the_gathering_storm_desc: "Una tormenta se cierne en lontananza. Nuestra creciente fuerza aérea ejerce una presión cada vez mayor desde los cielos: ataca donde el enemigo es más débil y apoya nuestro avance. Lo que comienza como el rumor de un estruendo lejano pronto se convertirá en una implacable tempestad de destrucción."
 AST_hear_the_thunder: "Ahí se oye el trueno"
 AST_hear_the_thunder_desc: "¿Lo oyes, oyes ese tronar? Desde tierra firme, nuestros bombarderos estratégicos llevan el poder de Australia por todo el mundo. Cuando los cielos rujan y el suelo tiemble, nuestros enemigos sabrán que la tormenta ha llegado y, con ella, la destrucción."
 AST_department_of_aircraft_production: "Departamento de producción de aviones"
 AST_department_of_aircraft_production_desc: "La rápida expansión de la Real Fuerza Aérea Australiana ha tensionado de manera considerable nuestra capacidad de producción. Debemos ser más ambiciosos; ampliar y coordinar nuestra base industrial para satisfacer la demanda, y asegurarnos de que podemos oscurecer los cielos con nuestros aviones."
 AST_royal_australian_navy: "Armada Real Australiana"
 AST_royal_australian_navy_desc: "Formada tras la federación mediante la unión de las flotas coloniales, la Armada Real Australiana sirvió en casi todos los escenarios de la Gran Guerra. Desde entonces, se ha visto reducida por la escasez de fondos, pero con el aumento de las tensiones mundiales, es hora de que la flota vuelva a los mares."
 AST_coast_watchers: "Coastwatchers"
 AST_coast_watchers_desc: "Aunque la mayor parte de nuestras fuerzas permanecen concentradas en el continente, nuestros accesos septentrionales ofrecen una red vital de alerta temprana. Mediante el despliegue de agentes de inteligencia locales en estas islas periféricas, podemos detectar movimientos aéreos y navales enemigos mucho antes de que supongan una amenaza para las costas australianas."
 AST_marines: "Marines"
 AST_marines_desc: "Al ser la isla de mayor tamaño en medio de otras muchas, debemos asegurarnos de que poseemos las capacidades anfibias para enviar fuerzas más allá de nuestras costas. En caso de que tengamos que pasar de la defensa al ataque, esas fuerzas nos permitirán llevar a cabo operaciones eficaces de isla en isla."
 AST_naval_auxiliary_patrol_taog: "Patrulla auxiliar naval"
 AST_naval_auxiliary_patrol_taog_desc: "Al estar nuestras fuerzas profesionales centradas en otras lides, podemos recurrir a voluntarios locales que deseen salvaguardar nuestros puertos e instalaciones costeras. Su profundo conocimiento de las vías fluviales de cada lugar los hace inestimables, y nadie sospecharía que un pescador nativo está a nuestro servicio."
 AST_cockatoo_island_shipyards_taog: "Astilleros de la isla Cockatoo"
 AST_cockatoo_island_shipyards_taog_desc: "Los astilleros de la isla de Cockatoo han servido durante mucho tiempo de centro imperial de reparación y mantenimiento, en apoyo a las operaciones de la Marina Real en el extranjero. Al haberse convertido en piedra angular de la Armada Real Australiana, debemos ampliar su capacidad para satisfacer las crecientes demandas de nuestra flota y, así, mantener nuestra fuerza naval."
 AST_kangaroo_point_dry_dock_taog: "Dique seco de Kangaroo Point"
 AST_kangaroo_point_dry_dock_taog_desc: "Aunque Evans Deakin and Company es ante todo una empresa de ingeniería, ha identificado acertadamente la necesidad de ampliar la capacidad de construcción naval a medida que van aumentando las tensiones mundiales, y ha puesto sus miras en Kangaroo Point. Deberíamos facilitarles la adquisición de esos terrenos para apoyar el crecimiento continuado de nuestra flota."
 AST_scrap_iron_flotilla_taog: "Flotilla Chatarra"
 AST_scrap_iron_flotilla_taog_desc: "Aunque hay voces críticas que los rechazan por anticuados y amortizados, hemos reunido algunos de nuestros destructores más antiguos en una sola unidad. Si bien carecen del prestigio de los navíos modernos, esos barcos suponen un uso ingenioso de lo que ya poseemos."
 AST_cruising_for_a_bruising: "Jugando con fuego"
 AST_cruising_for_a_bruising_desc: "Nuestra armada lleva mucho tiempo haciendo un hábil uso de los cruceros, y es una tradición que merece la pena ampliar. Estos barcos, al ser rápidos, versátiles y contundentes, pronto se granjearán una buena reputación en todo el mundo. Cualquier enemigo que se cruce en su camino saldrá escaldado."
 AST_strike_from_down_under: "Atacar desde Australia"
 AST_strike_from_down_under_desc: "Bajo las olas navegan, sin ruido siempre llegan; tus barcos encontrarán y presa en ellos harán. No subestimes jamás a un submarino australiano, pues tu flota alcanzará y, aunque corra, será en vano. ¡Arrr!"
 AST_hmas_sydney: "HMAS Sydney"
 AST_hmas_sydney_desc: "La era de los acorazados ha terminado. El futuro del poder naval reside en los cielos que están por encima de la flota, y Australia no se quedará atrás. Tras pasar años reconstruyendo y modernizando nuestra armada, estamos listos para dar ese paso final, el de crear un portaaviones que definirá el poder marítimo australiano durante la próxima generación."
 AST_conscription_level_allowed_tt: "Voluntad política de más reclutamiento (busca el icono de mano de obra en los enfoques)"
 AST_conscription_level_allowed_limited_conscription_tt: "Desbloquea un nivel adicional de la §Yley de reclutamiento§!, que activará §YReclutamiento limitado§!."
 AST_conscription_level_allowed_extensive_conscription_tt: "Desbloquea un nivel adicional de la §Yley de reclutamiento§!, que activará §YReclutamiento amplio§!."
 AST_conscription_level_allowed_service_by_requirement_tt: "Desbloquea un nivel adicional de la §Yley de reclutamiento§!, que activará §YServicio obligatorio§!."
 AST_conscription_level_allowed_all_adults_serve_tt: "Desbloquea un nivel adicional de la §Yley de reclutamiento§!, que activará §YTodo adulto sirve§!."
 AST_conscription_level_allowed_scraping_the_barrel_tt: "Desbloquea un nivel adicional de la §Yley de reclutamiento§!, que activará §YReclutamiento de último recurso§!."
 AST_conscription_law_so_far: "[CONSCRIPTION_LAW_SO_FAR]"
 ############
 ### MISC ###
 ############
 add_random_stat_to_general_tt: "Añade un atributo de habilidad aleatorio adicional a este general."
 generic_unlock_industrial_concern_tt: "Disponible como compañía industrial:\n"
 NZL_rail_standardization_tt: "Se añaden a la reserva nacional §Y[?NZL_train_var]§! unidades de §Y$NZL_train_equipment_1$§!."
 NZL_ministry_of_public_works: "Ministerio de Obras Públicas"
 NZL_ministry_of_public_works_desc: "Mediante una planificación coordinada y una inversión disciplinada, las carreteras, los ferrocarriles y los sistemas eléctricos avanzarán de acuerdo con una estrategia nacional coherente, en lugar de un esfuerzo poco sistemático."
 NZL_abolish_the_railways_board: "Suprimir la Junta de Ferrocarriles"
 NZL_abolish_the_railways_board_desc: "La Junta de Ferrocarriles del gobierno ha resultado ineficaz a la hora de modernizar la red. Ha llegado el momento de suprimir esa aberración y devolver los ferrocarriles al control del ministerio."
 NZL_rail_standardization: "Normalización de la locomoción"
 NZL_rail_standardization_desc: "[ROOT.GetName] cuenta con una serie de talleres repartidos por todo el país que han fabricado locomotoras de diversa calidad. Para que el sistema ferroviario sea más eficiente, dictaremos que fabriquen una serie de locomotoras normalizadas, cada una especializada en un fin concreto."
 NZL_full_employment: "Trabajo a tiempo completo"
 NZL_full_employment_desc: "Gracias a las constantes obras públicas, la cuidadosa planificación y la expansión industrial sostenida en el tiempo, el desempleo ha dado paso por fin a las oportunidades. Los talleres parados durante los años de la recesión vuelven a estar activos, y la mano de obra de la nación se afana en hacer producir las empresas. Al haber restablecido la confianza y la estabilidad, no solo nos hemos recuperado, sino que nos hemos fortalecido para los retos que nos aguardan."
 NZL_direct_the_coal_industry: "Dirigir la industria del carbón"
 NZL_direct_the_coal_industry_desc: "Ya que el carbón es cada vez más vital para nuestros ferrocarriles, la industria y las centrales eléctricas, el gobierno debe intervenir para coordinar la producción y distribución de forma acorde al interés nacional."
 NZL_establish_the_ncb: "Creación de la Junta Nacional del Carbón"
 NZL_establish_the_ncb_desc: "Con la creación de una Junta Nacional del Carbón, podemos aglutinar las minas dispersas del país bajo una única dirección coordinada y garantizar un suministro estable de combustible para los ferrocarriles, la industria y la generación de energía. Esa supervisión central nos permitirá racionalizar la producción, mejorar la eficacia y garantizar que las necesidades estratégicas primen sobre el interés privado."
 NZL_electrification: "Aumentar la generación de energía"
 NZL_electrification_desc: "Al aprovechar nuestros ríos para aumentar la generación hidroeléctrica, podemos sentar las bases de una fuerza industrial duradera. La construcción de nuevas presas y trasvases aumentará la capacidad en todo el país y garantizará que las fábricas, los ferrocarriles y los puertos dispongan de la energía que necesitan."
 NZL_bureau_of_industry_taog: "$NZL_bureau_of_industry$"
 NZL_bureau_of_industry_taog_desc: "$NZL_bureau_of_industry_desc$"
 NZL_wairarapa_sheep_farms_taog: "$NZL_wairarapa_sheep_farms$"
 NZL_wairarapa_sheep_farms_taog_desc: "$NZL_wairarapa_sheep_farms_desc$"
 NZL_national_roads_board_taog: "$NZL_national_roads_board$"
 NZL_national_roads_board_taog_desc: "$NZL_national_roads_board_desc$"
 NZL_taranaki_oil_taog: "$NZL_taranaki_oil$"
 NZL_taranaki_oil_taog_desc: "$NZL_taranaki_oil_desc$"
 NZL_women_in_the_workforce: "Mujeres como mano de obra"
 NZL_women_in_the_workforce_desc: "A medida que aumenta la escasez de mano de obra, las mujeres están dando un paso al frente para desempeñar funciones vitales en las fábricas, las granjas y los servicios públicos para garantizar que la producción no decaiga por la presión de los tiempos de guerra. Ampliar las oportunidades de formación y empleo nos permitirá sostener la producción industrial a la vez que mantenemos la defensa nacional."
 NZL_restart_the_onekaka_ironworks: "Volver a arrancar la ferrería de Onekaka"
 NZL_restart_the_onekaka_ironworks_desc: "La ferrería de Onekaka, Onekaka Iron and Steel, representó en su día nuestra ambición de producir hierro y acero nacional para reducir la dependencia del suministro exterior. Con el fin de reactivar la economía y mejorar la seguridad nacional, se está hablando de volver a poner en marcha los hornos de Onekaka."
 NZL_new_zealand_steel_taog: "$NZL_new_zealand_steel$"
 NZL_new_zealand_steel_taog_desc: "$NZL_new_zealand_steel_desc$"
 NZL_scrap_metal_recycling: "Campaña de reciclaje"
 NZL_scrap_metal_recycling_desc: "Una economía con un alto grado de importaciones, como la nuestra, no puede permitirse despilfarrar recursos estratégicos. Para reforzar nuestra resistencia económica, crearemos instalaciones de reciclaje de chatarra que procesen y reutilicen metales y caucho."
 NZL_domestic_car_industry: "Invertir en plantas de montaje de vehículos"
 NZL_domestic_car_industry_desc: "La producción de vehículos en [ROOT.GetName] se ha visto siempre limitada al ensamblaje de piezas que los fabricantes extranjeros mandan para su montaje final. Con nuestra reciente inversión en la producción nacional de acero, es posible que nosotros mismos podamos empezar a fabricar componentes."
 NZL_department_of_scientific_and_industrial_research_taog: "$NZL_department_of_scientific_and_industrial_research$"
 NZL_department_of_scientific_and_industrial_research_taog_desc: "$NZL_department_of_scientific_and_industrial_research_desc$"
 NZL_project_seal_taog: "$NZL_project_seal$"
 NZL_project_seal_taog_desc: "$NZL_project_seal_desc$"
 NZL_industrial_conscription_taog: "$NZL_industrial_conscription$"
 NZL_think_big_taog: "$NZL_think_big$"
 NZL_industrial_conscription_taog_desc: "$NZL_industrial_conscription_desc$"
 NZL_think_big_taog_desc: "$NZL_think_big_desc$"
 NZL_expand_the_university_of_auckland_taog: "$NZL_expand_the_university_of_auckland$"
 NZL_expand_the_university_of_auckland_taog_desc: "$NZL_expand_the_university_of_auckland_desc$"
 NZL_national_broadcasting_service: "Servicio Nacional de Radiodifusión"
 NZL_national_broadcasting_service_desc: "Tras la interferencia en las elecciones de 1935 por parte del servicio de Correos y su supervisión de los servicios estatales de radiodifusión, parece obvio que debemos reformar la gestión de esa organización. También habría que invertir en la actualización de los equipos de radiodifusión que usa."
 NZL_support_allies_with_meat: "Utilizar la industria cárnica"
 NZL_support_allies_with_meat_desc: "A menudo, nuestros aliados en el Pacífico estiran al máximo sus líneas de suministro. Para reducir esa tensión y mantener alimentadas a sus tropas, empezaremos a suministrarles carne."
 NZL_support_allies_with_meat_tt: "Cada aliado recibirá §G1§! §Yfábrica civil fuera del mapa§!."
 AST_COMINWEALTH_FACTION: "Mancomunidad"
 AST_cominwealth_tech_sharing_tt: "Firmaremos un §Yacuerdo para compartir tecnología§! con todos los miembros de nuestra facción."
 AST_modify_offshore_advancements_spirit_tt: "Modifica §Y$AST_offshore_advancements_spirit$§! en:"
 AST_gain_claims_on_japan_tt: "Obtendremos derechos de ocupación sobre el §Yarchipiélago japonés§!."
 AST_ireland_anti_british_pact_offer_accept_tt: "Si aceptan:"
 AST_through_the_barricades_tt: "Si §Y[ENG.GetNameDef]§! tiene al menos un §Y10%§! de apoyo comunista, al comienzo de la guerra los estibadores de §Y[132.GetCapitalVictoryPointName]§! se alzarán para apoyarnos."
 AST_end_the_kingdom_ireland_join_tt: "Debido a que [IRE.GetName] ha firmado el pacto antibritánico, se unirán a la guerra como parte de nuestro bando en cuanto declaremos la guerra a [ENG.GetNameDef]."
 ###########################
 ##### FABDA BRANCH ########
 ###########################
 # Root
 ABDA_abdacom: "Fundar el ABDACOM"
 ABDA_abdacom_desc: "Ante el rápido avance de las potencias enemigas por el Sudeste Asiático y el Pacífico, las fuerzas aliadas de la región han de actuar en consonancia para detenerlas. Si establecemos un mando supremo conjunto, aunaremos recursos, coordinaremos a nuestras fuerzas navales y conformaremos un frente unificado contra el enemigo."
 # Tier 1 - country-locked
 ABDA_fortress_singapore: "Fortaleza de Singapur"
 ABDA_fortress_singapore_desc: "Singapur es el eje de nuestra estrategia defensiva en la región. Si reforzamos sus fortificaciones y hacemos acopio de fuerzas, ganaremos un tiempo esencial para que el ABDACOM actúe e impida al enemigo alzarse con la victoria con rapidez."
 ABDA_corps_expeditionnaire: "CEFEO"
 ABDA_corps_expeditionnaire_desc: "La Indochina francesa está situada en el flanco norte del perímetro defensivo del ABDACOM. Si enviamos al Corps Expéditionnaire Français en Extrême-Orient a realizar operaciones activas, [FRA.GetNameDef] aportará al mando conjunto una mano de obra vital y la experiencia de sus fuerzas coloniales."
 ABDA_maintain_strategic_flexibility: "Mantener la flexibilidad estratégica"
 ABDA_maintain_strategic_flexibility_desc: "Estados Unidos no debe concentrar todas sus fuerzas en una sola operación. Si gestionamos nuestra reserva estratégica como es debido, podremos disponer del poder militar e industrial estadounidense en la zona del Pacífico en la que más se necesite."
 # Tier 2
 ABDA_the_malay_barrier: "La barrera malaya"
 ABDA_the_malay_barrier_desc: "El archipiélago que se extiende desde Malasia hasta [INS.GetNonIdeologyName] conforma una barrera defensiva natural. Las fuerzas del ABDA han de sacarle partido a este accidente geográfico y establecer una defensa terrestre y naval coordinada para frenar el avance enemigo."
 ABDA_develop_naval_infrastructure: "Desarrollar infraestructuras navales"
 ABDA_develop_naval_infrastructure_desc: "Para mantener las operaciones navales en el Pacífico se necesitan bases, depósitos de combustible e instalaciones de reparación. Invertir en la infraestructura de nuestros puertos y fondeaderos aumentará el alcance y la resistencia de las fuerzas navales del ABDA."
 # Tier 3
 ABDA_unified_naval_command: "Mando naval unificado"
 ABDA_unified_naval_command_desc: "Ahora que se han establecido las defensas terrestres y la infraestructura, el ABDA puede concentrar todas las fuerzas navales bajo un solo mando unificado. Las señales estandarizadas, la inteligencia compartida y las rutas de patrulla coordinadas multiplicarán la eficacia de todas las embarcaciones de la zona."
 # Tier 4
 ABDA_ship_a_day_sinking_quotas: "Cuota diaria de hundimientos"
 ABDA_ship_a_day_sinking_quotas_desc: "Las líneas de suministro enemigas que se extienden por el Pacífico son su punto débil estratégico. Si instauramos cuotas de hundimiento agresivas y coordinadas para nuestras fuerzas submarinas y terrestres, el ABDACOM debilitará al enemigo en términos logísticos y lo obligará a adoptar una postura defensiva."
 ABDA_naval_procurement: "Adquisición naval"
 ABDA_naval_procurement_desc: "Hay que suplir de inmediato las pérdidas que hemos sufrido. Un programa de adquisiciones coordinado por parte del ABDACOM dará prioridad a los destructores, submarinos y patrulleros más adecuados para la cuestión del Pacífico, lo que garantizará que nuestra flota combinada esté a la altura de la expansión enemiga."
 ABDA_keep_trade_open: "Mantener abierto el comercio"
 ABDA_keep_trade_open_desc: "El caucho y el petróleo de [INS.GetNonIdeologyName] son esenciales para los Aliados en tiempos de guerra. El ABDACOM ha de proteger las vías marítimas que transportan estos recursos tan valiosos, proteger los convoyes de las garras enemigas y mantener el flujo de comercio hacia nuestras industrias."
 # Tier 5 - capstone
 ABDA_expand_the_command: "Ampliar el mando"
 ABDA_expand_the_command_desc: "El ABDACOM ha demostrado su valía, pero toca seguir avanzando: hay que permitir la inclusión de otras naciones aliadas de la región y fomentar la investigación y el intercambio de información para ir un paso por delante del enemigo."
 # Tooltips
 ABDA_basic_available_trigger_tt: "No está en guerra con ningún miembro del ABDACOM."
