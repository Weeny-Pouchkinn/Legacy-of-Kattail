 HOL_taog_guarantee_colonial_loyalty: "Garantizar la lealtad colonial"
 HOL_taog_guarantee_colonial_loyalty_desc: "El nacionalismo se extiende por las Indias, y es evidente que se está gestando otra revolución. Aunque apenas nos costó sofocar la que afrontamos en 1927, nuestras fuentes adelantan que en esta ocasión nos encontramos ante un bando revolucionario mucho más preparado. La solución podría pasar por hacer ciertas concesiones al movimiento nacionalista pacífico de Soetardjo, de manera que la ciudadanía entienda que esta causa da frutos y abandone en favor de esta los postulados revolucionarios."
 HOL_taog_guarantee_colonial_loyalty_tt: "§WGarantiza que no se producirá una revolución en [INS.GetNameDef].§!\n[INS.GetNameDefCap] intentará declarar su independencia pacíficamente. Esto se puede impedir completando el enfoque §Y$INSHOL_industrialized_colony$§!, para lo que será necesario destinar una gran inversión a la colonia."
