 ###### CZECHOSLOVAKIA ######
 CZE_sudeten_promise_mission: "La promesa de los Sudetes"
 CZE_sudeten_promise_mission_desc: "Al respaldar a los paramilitares de los Sudetes, les hemos prometido apoyarlos para que se separen de [CZE.GetName] y unirse a nosotros. Incumplir esta promesa conllevará una reacción política negativa."
