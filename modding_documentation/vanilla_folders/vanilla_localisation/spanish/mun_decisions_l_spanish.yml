 CZE_crisis_in_the_sudentenland_desc: "Los paramilitares de los Sudetes se han alzado en una guerra de partisanos contra nosotros. Los continuos enfrentamientos contra nuestras fuerzas han provocado el caos más absoluto. Hay que controlar la situación antes de que algún enemigo pueda sacarle provecho."
