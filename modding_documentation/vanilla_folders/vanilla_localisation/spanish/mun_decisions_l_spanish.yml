 CZE_embezzle_quatermaster_funds: "£BoP_left_texticon Malversación de fondos del intendente"
 CZE_embezzle_quatermaster_funds_desc: "A nuestros soldados no les falta de nada. Seguramente nadie se percataría ni le importaría si los fondos para nuestros barracones se destinaran a otra cosa."
 CZE_prioritize_export_contracts: "£BoP_left_texticon Priorizar los contratos de exportación"
 CZE_prioritize_export_contracts_desc: "Nuestra industria exportadora es lo que nos ha ayudado a salir de la Gran Depresión. ¿Por qué deberíamos cambiar su funcionamiento? Cualquier amenaza hacia nuestra nación carece de fundamento. La armada puede permitirse esperar."
 CZE_focus_on_export_designs: "£BoP_left_texticon Centrarse en exportar diseños"
 CZE_focus_on_export_designs_desc: "La armada es muy exigente con lo que espera de nuestros diseños. El mercado de exportaciones es más flexible y ayuda a financiar los diseños nacionales de la armada. En realidad, son ellos los que deberían darnos las gracias a nosotros por el dinero que les ahorramos en investigación y desarrollo. De nada, armada."
 CZE_bop_reservist_training: "£BoP_right_texticon Entrenamiento reservista"
 CZE_junior_officer_recruitment: "£BoP_right_texticon Esfuerzo de reclutamiento de oficiales subalternos"
 CZE_send_foreign_attaches: "£BoP_right_texticon Enviar agregados extranjeros"
 CZE_send_observers_to_the_italo_ethiopian_war: "£BoP_right_texticon Enviar observadores a Etiopía"
 CZE_send_observers_to_the_italo_ethiopian_war_bonus: "Enviar observadores a la guerra italo-etíope"
 CZE_send_observers_to_the_italo_ethiopian_war_desc: "Colar a individuos para que observen y establezcan contacto secundario con la gente involucrada en la guerra sobre el terreno nos proporcionaría información valiosa sobre la doctrina militar contemporánea. Quizá hasta nos brinde alguna que otra oportunidad."
 CZE_send_observers_to_the_italo_ethiopian_war_tt: "§Y$CZE_zbrojovka_brno_organization$§! preguntará acerca del contrabando de armas en §Y[ETH.GetName]§!."
 CZE_recruit_red_cross_veterans: "£BoP_right_texticon Reclutar veteranos de la Cruz Roja"
 CZE_warehouse_inspections: "£BoP_right_texticon Inspecciones de almacenes"
 CZE_warehouse_inspections_desc: "No sabrás si falta algo hasta que vayas a echar un vistazo."
 CZE_construction_telephone_stations: "£BoP_right_texticon Construir estaciones telefónicas"
 CZE_construction_telephone_stations_desc: "Construir estaciones telefónicas entre nuestros cuarteles mejorará la coordinación de los altos mandos."
 CZE_state_defense_loans: "£BoP_right_texticon Préstamo de defensa nacional"
 CZE_live_fire_exercise: "£BoP_right_texticon Operaciones incendiarias en directo"
 CZE_live_fire_exercise_desc: "No hay nada mejor que un día al aire libre."
 CZE_redirect_military_discretionary_spending: "£BoP_left_texticon Redirigir el gasto militar discrecional"
 CZE_redirect_military_discretionary_spending_desc: "Los fondos son discrecionales, y en nuestra mano está no gastarlos en asuntos militares."
