 CZE_a_divided_nation_category_2_tt: "Estado§YEfectos al seleccionar§!:\nDesbloquea decisiones §Y$CZE_a_divided_nation_category$§!, que §Yeliminan§! modificadores de estado negativos en nuestros §YEstados§! y reducen los modificadores negativos del §Y$CZE_a_divided_nation_dynamic_modifier$ espíritu nacional§! hasta que se §Yelimine§!."
 CZE_a_divided_nation_category_3_tt: "Desbloquea decisiones §Y$CZE_a_divided_nation_category$§!, que §Yeliminan§! modificadores de estado negativos en nuestros §YEstados§! y reducen los modificadores negativos del §Y$CZE_a_divided_nation_dynamic_modifier$ espíritu nacional§! hasta que se §Yelimine§!."
