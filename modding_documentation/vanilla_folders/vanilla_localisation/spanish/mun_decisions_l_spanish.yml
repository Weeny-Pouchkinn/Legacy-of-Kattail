 CZE_a_divided_nation_czech_states: "Medidas de educación en §Y[FROM.GetName]§!"
 CZE_a_divided_nation_czech_states_desc: "La falta de personal cualificado es un obstáculo para el rápido crecimiento de la industria en el centro de nuestro país. Hemos de invertir en programas para educar mejor a la población y que trabaje en nuestra industria en crecimiento."
 CZE_a_divided_nation_slovakia_states: "Inversión económica adicional en §Y[FROM.GetName]§!"
 CZE_a_divided_nation_slovakia_states_desc: "Los intentos de inversión previos no han logrado reducir la desigualdad de la industria en [FROM.GetName]. Se necesita más financiación para mejorar la situación."
