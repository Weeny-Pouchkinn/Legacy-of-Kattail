 CZE_a_divided_nation_category: "Una nación dividida"
 CZE_a_divided_nation_category_desc: "Existe un creciente resentimiento contra el gobierno por parte de varios movimientos nacionales que ya no puede ignorarse ni desestimarse. Solventar estos problemas detendrá a las fuerzas que intentan desestabilizar el país, al menos a corto plazo."
