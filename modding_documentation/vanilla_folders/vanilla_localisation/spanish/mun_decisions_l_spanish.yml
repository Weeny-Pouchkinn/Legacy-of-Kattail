 ###FORT DECISIONS###
 CZE_the_second_fortification_program_category: "Programas de fortificación"
 CZE_the_second_fortification_program_category_desc: "La frontera desfavorable de nuestros países pone en riesgo la seguridad nacional. Los países que nos rodean han dejado claro que tienen la intención de volver a delimitar nuestras fronteras en su favor. Si seguimos fortificándolas, los enemigos se lo pensarán dos veces antes de atacarnos."
 CZE_fate_of_the_ro: "Destino del Consejo de Fortificación"
 CZE_fate_of_the_ro_desc: "El Consejo de Fortificación se encarga de recaudar fondos para nuestros proyectos de fortificación. Si no les damos uso pronto, la gente empezará a preguntarse por qué los hemos recaudado."
 CZE_bop_army_bunker_maintenance: "Mantenimiento de fortificaciones"
 CZE_bop_army_bunker_maintenance_desc: "Mantener en buen estado y listas nuestras fortificaciones nos garantizará la confianza del ejército en ellas cuando sea necesario emplearlas."
 CZE_fortification_research: "Investigación de fortificaciones"
 CZE_fortification_research_desc: "La necesidad de fortificar nuestra frontera es patente, pero ¿cómo lo hacemos? Investigando hallaremos la respuesta a esta pregunta."
 CZE_fortification_research_tt: "Tiene el espíritu nacional §Y$CZE_directorate_of_fortification_works_no_gd_idea$§!"
 CZE_fortification_research_subtract_variable_tt: "Todas las decisiones de §Yprogramas de fortificación§! futuras tardarán §Y30§! días menos en §Ycompletarse§!"
 CZE_fortification_decision_inprogress: "Ya se está elaborando otro programa de fortificación"
 CZE_second_sudetenland_fortification_program: "Segundo programa de fortificación de los Sudetes"
 CZE_second_sudetenland_fortification_program_desc: "Los Sudetes, nuestra frontera montañosa con Alemania, es el lugar idóneo para fortificar las fronteras. Tras analizar la Línea Maginot francesa, podemos construir algo similar para nosotros."
 CZE_third_sudetenland_fortification_program: "Tercer programa de fortificación de los Sudetes"
 CZE_third_sudetenland_fortification_program_desc: "Los Sudetes ahora cuentan con una línea de defensa decente, pero eso se nos queda corto cuando nuestra supervivencia nacional está en juego."
 CZE_fourth_sudetenland_fortification_program: "Cuarto programa de fortificación de los Sudetes"
 CZE_fourth_sudetenland_fortification_program_desc: "Los Sudetes cuentan con un fuerte sistema de fortificaciones, pero aún hay que fortalecerlo más."
 CZE_fortify_the_crossroads_with_slo: "Fortificar los cruces"
 CZE_fortify_the_crossroads_with_slo_desc: "Cualquier sistema de fortificaciones puede sortearse. A modo de prevención, podemos construir puntos fuertes alrededor de las ciudades más importantes para que los enemigos que atraviesen nuestras líneas tengan dificultades a la hora de asediarlas."
 CZE_fortify_the_hungarian_border_with_73: "Fortificar la frontera húngara"
 CZE_fortify_the_hungarian_border_with_73_desc: "El irredentismo húngaro es una amenaza constante para nuestra nación. Construir un sistema de fortificaciones a lo largo de la frontera que compartimos ayudará a garantizar nuestra seguridad."
 CZE_fortify_the_polish_border_with_72: "Fortificar la frontera polaca"
 CZE_fortify_the_polish_border_with_72_desc: "La amenaza polaca no conoce límites, pero esperemos que las fronteras bien fortificadas los obliguen a buscar objetivos más fáciles."
 ###### ARMY READINESS BALANCE OF POWER ######
 CZE_bop_ready_for_anything: "£GFX_power_balance_texticon Listos para cualquier cosa"
 CZE_bop_ready_for_anything_tt: "No tiene el espíritu nacional "
