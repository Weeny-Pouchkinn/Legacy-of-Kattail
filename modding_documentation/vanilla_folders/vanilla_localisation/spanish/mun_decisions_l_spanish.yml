 CZE_central_european_federation_desc: "Es mucho más lo que tenemos en común con nuestros vecinos que lo que nos separa. Fundar una federación democrática podría ser nuestra única baza para mantener vivo el pluralismo en Europa central, ante quienes se alzan en su contra."
