 ### INS - Political Events
 INS_political_events.1.t: "Un nuevo gobernador general para [INS.GetNameDef]"
 INS_political_events.1.desc: "Tocan ya a su fin los cinco años de mandato de [INS.GetLeader], y es momento de nombrar a un líder apto que lo releve. La reina Guillermina aboga por Alidius Tjarda van Starkenborgh Stachouwer, que ya demostró su buen hacer como embajador extraordinario y ministro plenipotenciario."
 INS_political_events.1.a: "Hágase la voluntad de la reina."
 INS_political_events.1.b: "[INS.GetLeader] ha gobernado bien; que encabece otra legislatura."
 INS_political_events.2.t: "[FROM.GetName] exige la propiedad de [721.GetName]"
 INS_political_events.2.desc: "El nuevo gobierno republicano de lo que fueran las Indias ha declarado que el archipiélago entero les pertenece. En una comunicación oficial, [FROM.GetLeader] nos ha exigido que renunciemos a la posesión de [721.GetName] y, ante la negativa, amenazan con una intervención militar."
 INS_political_events.2.a: "De acuerdo. No vale la pena el altercado."
 INS_political_events.2.b: "¡Claro que no!"
 INS_political_events.3.t: "[FROM.GetName] cede [721.GetName]"
 INS_political_events.3.desc: "Tal y como esperábamos, [FROM.GetLeader] no ha tardado en doblegarse, y sus tropas ya están desalojando [721.GetName]. Las fuerzas del TKR han entrado en la región acompañadas de varios emisarios del gobierno. El mismo [INS.GetLeader] ha pronunciado un discurso en Dili para declarar el fin de la opresión colonial."
 INS_political_events.3.a: "¡Estupendo!"
 INS_political_events.4.t: "[FROM.GetName] se niega a entregar [721.GetName]"
 INS_political_events.4.desc: "La negociación con [FROM.GetName] no ha ido a buen puerto. Tan rotunda ha sido la negativa de [FROM.GetLeader] a desprenderse de [721.GetName], que ha puesto fin anticipado a la conferencia."
 INS_political_events.4.a: "Pues guerra será."
 INS_political_events.5.t: "Elecciones generales en Indonesia"
 INS_political_events.5.desc: "Hoy Indonesia vive una jornada histórica. Concluida oficialmente la revolución, el primer ministro [INS.GetLeader] ha convocado los primerísimos comicios democráticos libres de la historia de Indonesia. De su resultado depende por entero el porvenir de nuestra nación."
 INS_political_events.5.a: "Si hemos llegado hasta aquí ha sido gracias a Sutan Sjahrir. ¡Él nos llevará al mañana!"
 INS_political_events.5.b: "Amir Sjarifuddin es una opción moderada, el mejor candidato para no darnos al socialismo ni al nacionalismo."
 INS_political_events.5.c: "Mohammad Hatta inició la revolución y la completará."
 INS_political_events.6.t: "Los preparativos dan frutos"
 INS_political_events.6.desc: "Con la revolución ya en marcha, nuestros guerrilleros infiltrados en la administración de las Indias ya no tienen por qué operar en secreto y pueden llevar a cabo sus misiones de sabotaje antes de que los Países Bajos puedan reaccionar."
 INS_political_events.6.a: "Procuremos no perder la celeridad."
 INS_political_events.7.t: "La Petición de Soetardjo"
 INS_political_events.7.desc: "Soetardjo ha presentado ante el Volksraad una petición para que se celebre una mesa redonda con dignatarios neerlandeses e indonesios que debatan acerca de la voluntad independentista del pueblo indonesio. Al suscitar polémicas internas, la petición se ha remitido al gobernador general, encargado de aprobarla o desestimarla. Aunque el alegato de muchos consejeros es a favor de mantener el statu quo y vetar la petición, no se puede negar que los movimientos nacionalistas se van radicalizando y van cobrando fuerza a cada día que pasa. Si seguimos rechazando sus propuestas de resolución pacífica, no habrá de sorprendernos que los nacionalistas opten por alternativas violentas."
 INS_political_events.7.a: "Que comiencen las negociaciones, si así se evita una guerra civil."
 INS_political_events.7.b: "No vamos a renunciar a nuestra soberanía."
 INS_political_events.7.c: "¿Y si los nacionalistas llevaran parte de razón?"
 INS_political_events.8.t: "Ocupación [?event_target:INS_invasion_event_invader.GetAdjective] inminente"
 INS_political_events.8.desc: "Han llegado soldados de [?event_target:INS_invasion_event_invader.GetName] a [?event_target:INS_invasion_event_invaded_state.GetName]. Nuestros efectivos en la región, al verse en minoría aplastante, han recibido la orden de retirada total de [?event_target:INS_invasion_event_invaded_state.GetName]. Prosigue el avance de las fuerzas [?event_target:INS_invasion_event_invader.GetAdjective] por las Indias, y la posibilidad de evitar la ocupación se antoja cada vez más lejana."
 INS_political_events.8.a: "Los nacionalistas darán con sus huesos en el calabozo. ¡Defenderemos a muerte nuestra tierra!"
 INS_political_events.9.t: "El pueblo indonesio se declara independiente"
 INS_political_events.9.desc: "En tanto que se retiraban las fuerzas de [JAP.GetNameDef] de las Indias Orientales, enviamos efectivos a reinstaurar el gobierno colonial en Batavia. Sin embargo, estos se han encontrado con un panorama político muy distinto al de las Indias ocupadas. Antes de llegar nuestras tropas a Batavia, [INS.GetLeader] había firmado ya una declaración de independencia que enuncia la fundación de la República de Indonesia como una nación soberana, proclamación que goza de un clamoroso apoyo popular."
 INS_political_events.9.a: "¡Que acudan los tanques!"
 INS_political_events.9.b: "Esta es una causa perdida y no necesitamos más conflictos. Dediquémonos mejor a reconstruir nuestra patria."
 INS_political_events.11.t: "[HOL.GetNameDefCap] reconoce la soberanía indonesia"
 INS_political_events.11.desc: "Tras proclamar la independencia, nuestras milicias se movilizaron de inmediato para defender el territorio de la invasión neerlandesa que esperábamos. No obstante, y para estupor de muchos, [HOL.GetLeader] ha anunciado que no habrá asalto alguno ni voluntad de perpetuar conflictos, puesto que prima ante todo la reconstrucción de su patria."
 INS_political_events.11.a: "Una muy grata sorpresa."
 INS_political_events.12.t: "Acuerdos con los nacionalistas indonesios"
 INS_political_events.12.desc: "Nuestras tropas han desembarcado en [?event_target:INS_invasion_event_invaded_state.GetName], y ya es inminente la victoria en el frente indonesio. Queda ahora por determinar de qué manera vamos a ocupar el territorio. Si bien mediante ocupación directa accederíamos a los recursos que buscamos, el proceso sería caro y tortuoso. Hemos negociado con Sukarno, cabecilla revolucionario, un plan por el que Indonesia pasará a ser un Estado títere cuyos hilos manejaremos nosotros. Aplacaremos así a la población civil, y no nos supondrá tanto derroche como una ocupación total."
 INS_political_events.12.a: "Seguiremos haciendo pactos con Sukarno."
 INS_political_events.12.b: "No tenemos interés alguno en colaborar con sublevados."
 INS_political_events.13.t: "Ocupación [?event_target:INS_invasion_event_invader.GetAdjective] inminente"
 INS_political_events.13.desc: "Han llegado soldados de [?event_target:INS_invasion_event_invader.GetName] a [?event_target:INS_invasion_event_invaded_state.GetName]. Nuestros efectivos en la región, al verse en minoría aplastante, han recibido la orden de retirada total de [?event_target:INS_invasion_event_invaded_state.GetName]. Prosigue el avance de las fuerzas [?event_target:INS_invasion_event_invader.GetAdjective] por las Indias, y la posibilidad de evitar la ocupación se antoja cada vez más lejana. Además, nuestros espías han documentado una negociación entre [?event_target:INS_invasion_event_invader.GetLeader], Sukarno y otros dirigentes nacionalistas con el supuesto fin de crear un Estado títere indonesio que el mismo Sukarno gobernaría bajo servidumbre a la Esfera de Coprosperidad."
 INS_political_events.13.a: "Los nacionalistas darán con sus huesos en el calabozo. ¡Defenderemos a muerte nuestra tierra!"
 INS_political_events.13.b: "Es arriesgado, pero ¿será por esta vía por la que lograremos la independencia?"
 INS_peta_explain_tt: "Podremos aprovechar el caos de la ocupación para declarar la independencia total si [JAP.GetName] retrocede."
 INS_peta_explain_tt_jap: "§RPuede que [INS.GetName] se mantenga leal a nosotros, pero si empezamos a perder el control del territorio, quizá nos lancen un órdago y declaren la independencia§!."
 INS_political_events.14.t: "Líderes nacionalistas arrestados"
 INS_political_events.14.desc: "La policía militar neerlandesa ha detenido en Indonesia a Sukarno y a otros cabecillas revolucionarios antes de que pudiéramos instaurar el gobierno títere."
 INS_political_events.14.a: "Lástima perder así a un aliado que se las prometía valioso."
 INS_political_events.15.t: "Defensores de la patria"
 INS_political_events.15.desc: "Han concluido las negociaciones con Sukarno, y ya está en marcha el gobierno títere en Indonesia. Sirviéndose de sus contactos y de nuestra pujanza militar, Sukarno ha logrado desestabilizar al gobierno neerlandés y situarnos como soberanos de facto en el archipiélago."
 INS_political_events.15.a: "Además de recursos baratos, ahora poseemos un aliado valioso."
 INS_political_events.16.t: "[?event_target:INS_invasion_event_invader.GetName] ocupa las Indias"
 INS_political_events.16.desc: "Las fuerzas [?event_target:INS_invasion_event_invader.GetAdjective] presentes en las Indias han unido fuerzas con los nacionalistas indonesios para desestabilizar a nuestra administración colonial y hacerse así con el control de las Indias. Se han arriado las banderas neerlandesas para izar en su lugar indonesias, y la ciudadanía autóctona parece acoger de buen grado la ocupación [?event_target:INS_invasion_event_invader.GetAdjective]. Los pronósticos no auguran nada bueno para nuestro imperio colonial."
 INS_political_events.16.a: "Habrán ganado la batalla, pero no la guerra."
 INS_political_events.17.t: "[INS.GetName] declara la independencia"
 INS_political_events.17.desc: "El Cuartel General Imperial ha recibido noticias de Batavia. Sukarno y su camarilla, a quienes nosotros mismos dimos el poder para que gobernara las islas en nombre del Emperador, han proclamado la República [FROM.GetAdjective] como respuesta a nuestras constantes pérdidas territoriales, creyendo que estamos demasiado sobrepasados como para hacer nada al respecto."
 INS_political_events.17.a: "Por desgracia, puede que tengan razón."
 INS_political_events.18.t: "Tan Malaka vuelve a Indonesia"
 INS_political_events.18.desc: "Tan Malaka, el comunista indonesio que ha servido durante estos últimos años como asesor de confianza de nuestro gobierno, ha anunciado su marcha inmediata. Ahora que [INS.GetNameDef] es una república libre, tiene la intención de volver por fin al país del que salió convertido en fugitivo hace más de dos décadas. Nos agradece que le hayamos ofrecido asilo y la libertad para continuar con su trabajo, y solo dice que su patria lo reclama ahora."
 INS_political_events.18.a: "Le deseamos buena suerte."
 INS_political_events.19.t: "[HOL.GetName] convoca al almirante Helfrich"
 INS_political_events.19.desc: "Ha llegado a [1058.GetName] la noticia de que el almirante Conrad Helfrich, comandante de nuestras fuerzas navales y el oficial más capaz que tenemos en estas aguas, ha recibido la orden de volver a casa. La Haya aduce necesidades apremiantes en la metrópoli y da pocas explicaciones más. Su marcha deja el archipiélago poco defendido en un momento en que nuestra posición aquí está lejos de ser segura, y se dice que en la sala de oficiales de Surabaya están de un humor de perros."
 INS_political_events.19.a: "Un día sombrío para la flota."
 ### INS - Industrial Events
 INS_industrial_events.4.t: "Reasignación presupuestaria en [FROM.FROM.GetName]"
 INS_industrial_events.4.desc: "Con la clausura de las plantaciones de caucho en [FROM.FROM.GetName], ahora contamos con margen de presupuesto para otros proyectos industriales en la región."
 INS_industrial_events.4.a: "Perforaremos pozos petrolíferos en [FROM.FROM.GetName]."
 INS_industrial_events.4.b: "Deberíamos abrir una fundición de aluminio en [FROM.FROM.GetName]."
 INS_industrial_events.4.c: "Destinemos esos fondos a buscar recursos que no produzcamos con suficiencia."
 INS_industrial_events.4.d: "Podemos abrir minas de carbón en [FROM.FROM.GetName]."
 INS_industrial_events.5.t: "[INS_industrial_events_5_t_scripted]"
 INS_industrial_events_5_t_colonial: "El porvenir del De Javasche Bank"
 INS_industrial_events_5_t_independent: "El porvenir del Bank Indonesia"
 INS_industrial_events.5.desc: "[INS_industrial_events_5_desc_scripted]"
 INS_industrial_events_5_desc_colonial: "Las reservas del De Javasche Bank han caído a mínimos inéditos desde hacía una década. El florín neerlandés va comprando menos cada mes, y los dueños de plantaciones exigen que se les pague en la divisa local. Nuestros asesores financieros concuerdan en que no basta el banco de por sí para revertir esa tendencia bajista, pero discrepan de pleno en lo que respecta a la solución."
 INS_industrial_events_5_desc_independent: "Bank Indonesia informa que, tan solo en el último trimestre, la rupia ha perdido casi una quinta parte de su valor. Los mercaderes de arroz de Surabaya ya han empezado a rechazarla en favor de divisas extranjeras. Nuestro ministro de Economía sostiene que la moneda nacional aún tiene salvación, pero únicamente si se actúa con prontitud y diligencia."
 INS_industrial_events.5.a: "Más nos convendría tratar de fortalecer el florín que sustituirlo."
 INS_industrial_events.5.b: "Ajustaremos el florín de las Indias al florín de los Países Bajos."
 INS_industrial_events.5.c: "Ajustaremos el florín de las Indias al dólar estadounidense."
 INS_industrial_events.6.t: "Un acuerdo más lucrativo"
 INS_industrial_events.6.desc: "La Oficina de Chinchona acepta nuestras condiciones. Poca alternativa les quedaba, ya que la malaria está haciendo estragos en medio trópico y no se espera sucedáneo alguno de la quinina. El nuevo acuerdo nos garantiza una cuota mucho más sustanciosa de los beneficios por cada gramo de quinina que salga de nuestras costas. Ahora solo resta decidir a qué destinar este capital."
 INS_industrial_events.6.a: "Lo invertiremos en nuestras ciudades."
 INS_industrial_events.6.b: "En el desarrollo de las islas exteriores."
 INS_industrial_events.6.c: "Servirá para fortalecer nuestra industria militar."
 # Rubber shipment dispatched
 INS_industrial_events.28.t: "Cargamento de caucho enviado"
 INS_industrial_events.28.desc: "Los convoyes han cargado finalmente todo el caucho y han zarpado. Nuestros compradores recibirán lo que han pagado y nuestra contabilidad reflejará la compensación acordada en su debido momento. Durante los próximos dos años, el coste de esta transacción figurará en nuestros balances como recordatorio de lo que nos exige la Gran Depresión."
 INS_industrial_events.28.a: "Entendido."
 INS_industrial_events.28.b: "Hay que organizar otro cargamento."
 # Oil shipment dispatched
 INS_industrial_events.36.t: "Cargamento de petróleo enviado"
 INS_industrial_events.36.desc: "Los petroleros han partido de nuestras refinerías con las bodegas llenas rumbo a los puertos del comprador. Se ha acordado una compensación y se recibirá en su totalidad, aunque la carga de la venta pesará sobre nuestra economía durante los dos próximos años. Esos son los términos que nos ofrece el mundo en estos años de austeridad."
 INS_industrial_events.36.a: "Entendido."
 INS_industrial_events.36.b: "Hay que organizar otro cargamento."
 ### INS - Volksraad
 INS_volksraad_events.2.t: "[HOL.GetLeader] ha vetado la petición del Volksraad."
 INS_volksraad_events.2.desc: "[HOL.GetLeader] ha vetado la petición que gozaba de la aprobación de [INS.GetLeader] tras estudiarla, impidiendo que se pueda proceder a su aplicación por el momento."
 INS_volksraad_events.2.a: "Trataremos de intentarlo de nuevo en un futuro, con una petición que sí sea ratificada."
 # Generic/Reused
 INS_volksraad_events.10.t: "Moción en el Volksraad para dar cabida al idioma indonesio en las escuelas"
 INS_volksraad_events.10.desc: "[INS.GetLeader] ha aprobado en el Volksraad una petición que propugna la creación en [INS.GetNameDef] de escuelas y universidades donde las materias se impartan en indonesio. La moción se ha remitido a [HOL.GetLeader], que decidirá si dar o no su beneplácito."
 INS_volksraad_events.10.a: "El Volksraad cumple su propósito."
 INS_volksraad_events.10.b: "De ninguna manera. ¡Se veta la petición!"
 INS_volksraad_events.11.t: "Se implantará un sistema educativo de lengua indonesia."
 INS_volksraad_events.11.desc: "[HOL.GetLeader] ha firmado la petición, y esta ya es decreto oficial. Su implementación dará comienzo al poco de ultimar los pormenores."
 INS_volksraad_events.11.a: "El Volksraad cumple su propósito."
 # Individual laws
 INS_volksraad_events.20.t: "Moción en el Volksraad para dar cabida al idioma indonesio en el gobierno"
 INS_volksraad_events.20.desc: "Los cargos gubernamentales en las Indias Orientales, incluido el Volksraad, exigen todos el dominio del idioma neerlandés, lo que ha llevado a muchos miembros del Volksraad, especialmente a los representantes de las comunidades nativas, a cuestionar la validez de su democracia. Han elaborado una moción que insiste en que los cargos gubernamentales deben poder ocuparlos indonesiohablantes, siempre que sea posible."
 INS_volksraad_events.21.t: "¡Ya se habla indonesio en el gobierno!"
 INS_volksraad_events.21.desc: "[HOL.GetLeader] ha firmado la petición, y esta ya es decreto oficial. Su implementación dará comienzo al poco de ultimar los pormenores."
 INS_volksraad_events.30.t: "Moción en el Volksraad para suprimir el sistema de cuotas en la educación"
 INS_volksraad_events.30.desc: "[INS.GetLeader] ha aprobado en el Volksraad una petición para suprimir el sistema de cuotas en el ámbito educativo de [INS.GetNameDef], destinada a poner punto final al dilatado debate político con respecto a su implementación y justicia. La moción se ha remitido a [HOL.GetLeader], que decidirá si dar o no su beneplácito."
 INS_volksraad_events.31.t: "Se ha abolido el sistema de cuotas en la educación"
 INS_volksraad_events.31.desc: "[HOL.GetLeader] ha firmado la petición, y esta ya es decreto oficial. Su implementación dará comienzo al poco de ultimar los pormenores."
 INS_volksraad_events.40.t: "Moción en el Volksraad para reducir los gravámenes sobre la exportación de caucho"
 INS_volksraad_events.40.desc: "[INS.GetLeader] ha aprobado en el Volksraad una petición que aspira a recortar los onerosos impuestos sobre las plantaciones de caucho privadas. Si bien estas tasas han permitido al gobierno desarrollar un lucrativo monopolio cauchero, ese lucro se ha resentido en gran medida debido al proteccionismo internacional. [INS.GetLeader] ha declarado su escepticismo en materia de impuestos que, arguye, no llegan a compensar el perjuicio económico que causan."
 INS_volksraad_events.40.a: "A [INS.GetLeader] no le falta razón."
 INS_volksraad_events.40.b: "No vamos a tocar esos impuestos."
 INS_volksraad_events.41.t: "Se ha reducido el impuesto privado sobre las exportaciones de caucho"
 INS_volksraad_events.41.desc: "[HOL.GetLeader] ha firmado la petición, y esta ya es decreto oficial. Su implementación dará comienzo al poco de ultimar los pormenores."
 INS_volksraad_events.60.t: "Moción en el Volksraad para acabar con el techo de cristal que coarta a los oficiales indonesios"
 INS_volksraad_events.60.desc: "[INS.GetLeader] ha aprobado en el Volksraad una petición con la que se pretende desterrar la norma no escrita que limita el rango que pueden alcanzar los oficiales del Real Ejército de las Indias Orientales Neerlandesas (el KNIL, por su abreviatura holandesa) que no son neerlandeses, y hacer patente su eliminación ascendiendo a dichos oficiales cuyo rango no refleje la cuantía y calidad de sus logros. La moción se ha remitido a [HOL.GetLeader], que decidirá si dar o no su beneplácito."
 INS_volksraad_events.61.t: "Se elimina la restricción velada a los generales [INS.GetAdjective]"
 INS_volksraad_events.61.desc: "[HOL.GetLeader] ha firmado la petición, y esta ya es decreto oficial. Su implementación dará comienzo al poco de ultimar los pormenores."
 INS_volksraad_events.70.t: "Moción en el Volksraad para legalizar la exhibición pública de banderas e imágenes nacionalistas"
 INS_volksraad_events.70.desc: "[INS.GetLeader] ha aprobado en el Volksraad una petición orientada a eliminar las leyes que restringen la presencia de banderas e imágenes nacionalistas en espacios públicos de [INS.GetNameDef], con el objetivo principal de mitigar la radicalización nacionalista entre las juventudes. [INS.GetLeader] defiende la adopción de un planteamiento defensivo al respecto, que pasaría por cooperar con líderes nacionalistas pacíficos para erradicar los movimientos revolucionarios. La decisión, no obstante, nos corresponde a nosotros."
 INS_volksraad_events.71.t: "¡Ya no es ilegal ondear la bandera rojiblanca!"
 INS_volksraad_events.71.desc: "[HOL.GetLeader] ha firmado la petición, y esta ya es decreto oficial. Su implementación dará comienzo al poco de ultimar los pormenores."
 INS_volksraad_events.100.t: "Moción en el Volksraad para conferir becas de estudios a residentes no neerlandeses"
 INS_volksraad_events.100.desc: "[INS.GetLeader] ha aprobado en el Volksraad una petición por la que los residentes de [INS.GetNameDef] que no tengan nacionalidad neerlandesa podrían solicitar también becas de estudios. La moción se ha remitido a [HOL.GetLeader], que decidirá si dar o no su beneplácito."
 INS_volksraad_events.101.t: "Los ciudadanos [INS.GetAdjective] ya pueden solicitar becas de estudios"
 INS_volksraad_events.101.desc: "[HOL.GetLeader] ha firmado la petición, y esta ya es decreto oficial. Su implementación dará comienzo al poco de ultimar los pormenores."
 ### INS - Dutch Interaction Events
 INS_dutch_events.1.t: "[INS.GetNameDefCap] solicita el mando de nuestra armada"
 INS_dutch_events.1.desc: "A raíz de la caída de nuestra patria, [INS.GetNameDef] ha formulado una petición para que se les transfiera el control de nuestras fuerzas navales. Según arguye su administración, será más sencillo si [INS.GetNameDef] gestiona nuestros efectivos en estos tiempos inauditos."
 INS_dutch_events.1.a: "Si con ello nos fortalecemos, habrá que acceder."
 INS_dutch_events.1.b: "Nuestras naves tan solo acatan órdenes de La Haya."
 INS_dutch_events.2.t: "[HOL.GetNameDefCap] acepta la propuesta de ceder el control naval"
 INS_dutch_events.2.desc: "[HOL.GetNameDefCap] ha accedido a delegarnos el mando de nuestras fuerzas navales conjuntas, tal y como propusimos. La transición procede con plena fluidez, y los oficiales [HOL.GetAdjective] y [INS.GetAdjective] ya trabajan compenetrados para reafirmar nuestra presencia en el Pacífico."
 INS_dutch_events.2.a: "Juntos custodiaremos el Pacífico."
 INS_dutch_events.3.t: "[HOL.GetNameDefCap] rechaza la propuesta de ceder el control naval"
 INS_dutch_events.3.desc: "[HOL.GetNameDefCap] ha rechazado nuestra oferta de unificar el mando naval, según explican, por posibles dificultades logísticas y administrativas. Aunque desencantados, seguiremos colaborando en otros ámbitos del esfuerzo bélico."
 INS_dutch_events.3.a: "Ya idearemos otras maneras de fortalecer nuestra presencia naval."
 INS_dutch_events.4.t: "[HOL.GetNameDefCap] instaura el programa naval de [HOL.GetName]-[INS.GetName]"
 INS_dutch_events.4.desc: "[HOL.GetNameDefCap] ha anunciado la creación del programa naval de [HOL.GetName]-[INS.GetName], una iniciativa conjunta que tiene por objetivo reorganizar y expandir nuestras fuerzas marítimas. En un futuro próximo, el Pacífico contará con una red de defensa cimentada en la veteranía [HOL.GetAdjective] y los efectivos [INS.GetAdjective]."
 INS_dutch_events.4.a: "Un paso en firme hacia la supervivencia mutua."
 ### INS - Netherlands–Indonesia Union Events
 INS_union_events.1.t: "[HOL.GetNameDefCap] pide trasladar el gobierno a [1058.GetName]"
 INS_union_events.1.desc: "Puesto que su territorio patrio ha caído en manos del enemigo, [HOL.GetNameDef] nos comunica su intención de trasladar su gobierno y casa real a [1058.GetName]. Se escudan para ello en la necesidad, la continuidad y el imperativo moral de mantener vivo su reino donde aún ondea la bandera."
 INS_union_events.1.a: "La guerra continuará desde [1058.GetName]."
 INS_union_events.1.b: "Pero ¿qué se han creído? ¡Esto es un burdo intento de reafirmar su tiranía colonial!"
 INS_union_events.2.t: "[INS.GetNameDefCap] acepta la petición de traslado"
 INS_union_events.2.desc: "[INS.GetNameDefCap] accede a brindar refugio en [1058.GetName] a nuestro gobierno exiliado. Ya están en marcha los preparativos del traslado, y ambas administraciones se encuentran coordinando la integración de sus organigramas y personal de funcionariado. Juntos, seguiremos ondeando la bandera del reino desde Oriente."
 INS_union_events.2.a: "Conformaremos un frente unido contra nuestros enemigos comunes."
 INS_union_events.3.t: "[INS.GetNameDefCap] rechaza la petición de traslado"
 INS_union_events.3.desc: "[INS.GetNameDefCap] nos comunica sin miramientos su negativa a acogernos en [1058.GetName]. [INS.GetLeader] alega que no tenemos derecho a exigir semejante sacrificio cuando su nación apenas da abasto con los recursos que posee."
 INS_union_events.3.a: "Olvidan, al parecer, qué colores nos unen aún hoy."
 INS_union_events.4.t: "[HOL.GetNameDefCap] traslada sus fuerzas armadas a [1058.GetName]"
 INS_union_events.4.desc: "Van llegando los primeros transportes de la patria. Navíos abarrotados de oficiales, soldados y lo que queda de nuestros arsenales. No todos los convoyes han logrado llegar a puerto, como cabía esperar. Los que sí vertebrarán el grueso de nuestras fuerzas en [1058.GetName]."
 INS_union_events.4.a: "Algo es, lo justo para que la bandera siga ondeando."
 # INS proposed union
 INS_union_events.5.t: "[INS.GetNameDefCap] propone una unión política neerlandesa-indonesia"
 INS_union_events.5.desc: "Los vientos de la guerra no soplan a nuestro favor, eso ha quedado patente a ojos del mundo entero. Nuestro país ha caído y hemos tenido que desplazar a los territorios orientales nuestra base de operaciones. Ministros de [INS.GetName] nos han propuesto formar un Estado conjunto que, con la reina Guillermina a la cabeza, elevaría la cooperación a la máxima potencia. Aunque no parece ser plato de buen gusto para nadie, la propuesta bien podría ser lo que nos mantenga a flote."
 INS_union_events.5.a: "Es un riesgo que habrá que correr. ¡Que viva la reina!"
 INS_union_events.5.b: "No podemos aceptar."
 INS_union_events.6.t: "[HOL.GetNameDefCap] acepta la propuesta de unificación"
 INS_union_events.6.desc: "Tras un debate de urgencia en el seno del gabinete, [HOL.GetLeader] ha aprobado la propuesta [INS.GetAdjective]. La oficializa un decreto sucinto y privo de formalidades. En adelante y hasta que la guerra concluya, nuestros gobiernos ejercerán como uno solo, supeditado a la autoridad real."
 INS_union_events.6.a: "Un acuerdo histórico para ambas naciones."
 INS_union_events.7.t: "[HOL.GetNameDefCap] rehúsa la propuesta de unificación"
 INS_union_events.7.desc: "Los mandatarios de [HOL.GetNameDef] han rechazado el ofrecimiento de fusionar nuestras administraciones. Su mensaje es tajante: seguiremos cooperando, pero sin compartir la soberanía."
 INS_union_events.7.a: "Tampoco se las prometía muy viable el acuerdo."
 # HOL proposed union
 INS_union_events.8.t: "[HOL.GetNameDefCap] propone una unión política neerlandesa-indonesia"
 INS_union_events.8.desc: "Los vientos de la guerra no soplan a nuestro favor, eso ha quedado patente a ojos del mundo entero. [HOL.GetNameDef] ha caído y su base de operaciones se ha tenido que desplazar a los territorios orientales. Dignatarios [HOL.GetAdjective] nos han propuesto formar un Estado conjunto que, con la reina Guillermina a la cabeza, elevaría la cooperación a la máxima potencia. Aunque no parece ser plato de buen gusto para nadie, la propuesta bien podría ser lo que nos mantenga a flote."
 INS_union_events.8.a: "No hay alternativa."
 INS_union_events.8.b: "Esto no es sino un burdo intento de reafirmar su tiranía colonial."
 INS_union_events.9.t: "[INS.GetNameDefCap] acepta la propuesta de unificación"
 INS_union_events.9.desc: "[INS.GetNameDefCap] comunica su conformidad con nuestra propuesta. Habrá que ver lo factible que es a la larga, pero lo primordial ahora es el esfuerzo bélico."
 INS_union_events.9.a: "Si aspiramos a resistir, tendrá que ser unidos."
 INS_union_events.10.t: "[INS.GetNameDefCap] rehúsa la propuesta de unificación"
 INS_union_events.10.desc: "[INS.GetNameDefCap] ha desestimado el modelo conjunto que propusimos. El pueblo [INS.GetAdjective] y sus gobernantes no lo ven sostenible a largo plazo y entienden como una amenaza todo ofrecimiento de renunciar a su poder."
 INS_union_events.10.a: "Tampoco se las prometía muy viable el acuerdo."
 # Flags
 INS_exile_accepted_flag: "Acoge al gobierno exiliado de [HOL.GetNameDef]"
 INS_hey_btw_you_are_gonna_die_just_know_that_yeah_tt: "§REsto te supondrá el fin de la partida.§!"
 # Revolution events
 INS_revolution_events.1.t: "[HOL.GetNameDefCap] se moviliza para acabar con la República"
 INS_revolution_events.1.desc: "Como ya se presagiaba, el gobierno neerlandés ha reaccionado a nuestra proclama independentista enviando soldados a [1058.GetName] y difundiendo propaganda antirrepublicana a través de sus medios."
 INS_revolution_events.1.a: "Debemos actuar de inmediato."
 INS_revolution_events.2.t: "[HOL.GetNameDefCap] pide más ayuda"
 INS_revolution_events.2.desc: "[HOL.GetLeader] ha convocado una reunión de urgencia con nuestros dirigentes, a los que ha solicitado una mayor contribución a la reconquista de las Indias, instándonos a participar en el conflicto. [HOL.GetLeader] ha subrayado lo funesto de la situación, y las fuerzas neerlandesas no han logrado repeler a las milicias revolucionarias. [HOL.GetLeader] promete cedernos la región de Borneo si les brindamos nuestra ayuda."
 INS_revolution_events.2.a: "Lo haremos por Borneo, entonces."
 INS_revolution_events.2.b: "No nos interesa."
 INS_revolution_events.3.t: "[ENG.GetNameDefCap] acepta el Acuerdo de Londres-Batavia"
 INS_revolution_events.3.desc: "[ENG.GetNameDefCap] se presta a participar en el conflicto y enviará varias divisiones a combatir a Batavia. Aunque tendremos que renunciar a Borneo, las tornas al fin se vuelven a nuestro favor."
 INS_revolution_events.3.a: "Ante la necesidad, sacrificaremos Borneo de buen agrado."
 INS_revolution_events.4.t: "[ENG.GetNameDefCap] rechaza el Acuerdo de Londres-Batavia"
 INS_revolution_events.4.desc: "[ENG.GetNameDefCap] nos ha denegado la ayuda que pedíamos, a pesar de su carácter urgente y de la recompensa nada desdeñable. [ENG.GetLeader] ha declarado que, si bien la pervivencia de nuestro imperio colonial los beneficia, el riesgo de escalada bélica por causa de su intervención es desmedido, por lo que tendremos que ingeniárnoslas sin ellos."
 INS_revolution_events.4.a: "Los pronósticos no nos sonríen."
 INS_revolution_events.5.t: "[HOL.GetNameDefCap] nos pide ayuda"
 INS_revolution_events.5.desc: "La facción revolucionaria de las Indias Orientales Neerlandesas ha declarado su emancipación de [HOL.GetNameDef], ocupando diversas capitales en virtud de esa proclama. [HOL.GetLeader] ha contactado con nosotros urgentemente y nos solicita respaldo militar en tanto que preparan una invasión."
 INS_revolution_events.5.a: "Si triunfan los revolucionarios, nos arriesgamos a que cunda su ejemplo entre los ciudadanos de nuestras colonias."
 INS_revolution_events.5.b: "No nos interesa."
 INS_revolution_events.6.t: "[ENG.GetNameDefCap] nos ayudará"
 INS_revolution_events.6.desc: "[ENG.GetNameDefCap] se presta a enviar a [1058.GetName] divisiones de voluntarios y equipo a fin de ayudarnos a recuperar las Indias."
 INS_revolution_events.6.a: "Esto será pan comido."
 INS_revolution_events.7.t: "[ENG.GetNameDefCap] no nos ayuda"
 INS_revolution_events.7.desc: "[ENG.GetNameDefCap] nos ha negado su ayuda de cara a recuperar la soberanía en las Indias. Arguyen que el territorio no les incumbe, pese a su proximidad con el conflicto. Tendremos que rearmar al KNIL por nuestra cuenta."
 INS_revolution_events.7.a: "¡Esto es inaceptable!"
 INS_revolution_events.8.t: "Milicias revolucionarias conspiran en las Indias"
 INS_revolution_events.8.desc: "Nuestra policía colonial en las Indias Orientales ha arrestado e interrogado a varios miembros de un movimiento revolucionario incipiente en Indonesia. Al parecer, pretendían concentrar efectivos militares en la región con la finalidad de emprender desde allí una campaña independentista a escala nacional. A falta de pruebas fehacientes, cabe imaginar que preparaban una revolución armada."
 INS_revolution_events.8.a: "No les quitaremos ojo de encima."
 INS_revolution_events.9.t: "Declaración de Independencia de Indonesia"
 INS_revolution_events.9.desc: "Hoy [INS.GetLeader] ha pronunciado un discurso que proclama la fundación de la República de Indonesia independiente. Nuestra administración no la reconoce, pero ello no ha impedido a sus milicias ocupar el territorio, y nuestra policía poco puede hacer para mantenerse al mando en los territorios afectados. Si no gestionamos el asunto con mano izquierda, bien podría llevarnos a un conflicto armado."
 INS_revolution_events.9.a: "¡Inaceptable!"
 INS_revolution_events.9.b: "No vale la pena malgastar energía así. Si tanto quieren la independencia, que así sea."
 #INS_revolution_events.10.t: ""
 #INS_revolution_events.10.desc: ""
 #INS_revolution_events.10.a: ""
 INS_revolution_events.11.t: "Nuestras tropas en las Indias truncan la campaña de los milicianos"
 INS_revolution_events.11.desc: "Un contingente de milicianos republicanos ha emprendido una operación militar con el fin de ocupar [?event_target:INS_temp_occupied_state.GetName]. Nuestros valerosos combatientes de las Indias han logrado repeler a esas milicias y, gracias a ellos, no hemos perdido las riendas del territorio."
 INS_revolution_events.11.a: "Otra victoria para [HOL.GetNameDef]."
 INS_revolution_events.12.t: "Milicianos tratan de ocupar [?event_target:INS_temp_occupied_state.GetName]"
 INS_revolution_events.12.desc: "Un contingente de milicianos republicanos ha emprendido una operación militar con el fin de ocupar [?event_target:INS_temp_occupied_state.GetName]. No sin dificultad, nuestras tropas y policía han logrado mantenerlos a raya, pero la confrontación ha suscitado rechazo en [?event_target:INS_temp_occupied_state.GetName], donde gran parte de la ciudadanía manifiesta su apoyo a las milicias y se pronuncia en contra del gobierno [HOL.GetAdjective]."
 INS_revolution_events.12.a: "No permitiremos que el conflicto vaya a más."
 INS_revolution_events.14.t: "Milicianos ocupan [?event_target:INS_temp_occupied_state.GetName]"
 INS_revolution_events.14.desc: "A pesar del afán de nuestros soldados y nuestra policía colonial, las milicias republicanas han triunfado en su tentativa militar de ocupar [?event_target:INS_temp_occupied_state.GetName]. Nuestros efectivos se han visto obligados a desalojar la región, declarándose incapaces de gobernarla a causa de la oposición miliciana. Si permitimos este atropello a nuestra autoridad, corremos el riesgo de perder las magníficas colonias del imperio."
 INS_revolution_events.14.a: "¡Esto es intolerable!"
 INS_revolution_no_effect_tt: "Sin efectos"
 INS_revolution_events.19.t: "Se negocia la paz en las Indias"
 INS_revolution_events.19.desc: "Se ha convocado un encuentro de [HOL.GetLeader] con [INS.GetLeader] para discutir un posible acuerdo de paz. [INS.GetLeader] ha hecho presente su pesar ante la grave pérdida de vidas y propone que ambos Estados coexistan con las fronteras tal y como están demarcadas actualmente, con la salvedad de leves ajustes. Este acuerdo supondría el fin de las hostilidades."
 INS_revolution_events.19.a: "Solo podemos aceptar. Demasiados han perecido ya."
 INS_revolution_events.19.b: "¡Si tanto desean la paz, que se rindan!"
 INS_revolution_events.20.t: "¡[HOL.GetNameDefCap] acepta la propuesta de los dos Estados!"
 INS_revolution_events.20.desc: "[INS.GetLeader] regresa con buenas nuevas de su conferencia con [HOL.GetLeader]. Ambas partes han llegado a un acuerdo de coexistencia, y nos disponemos a desplazar nuestras tropas de conformidad con las fronteras delineadas en el pacto. Aunque a ninguno nos complace dejar desamparados a parte de nuestros hermanos indonesios, prima poner fin al conflicto."
 INS_revolution_events.20.a: "Al fin se dejará de derramar sangre."
 INS_revolution_events.21.t: "[HOL.GetNameDefCap] se niega a dejar de combatir"
 INS_revolution_events.21.desc: "La conferencia de [INS.GetLeader] y [HOL.GetLeader] no ha salido según lo esperado, y ambas partes han acabado con un notorio enfado y renunciando a toda voluntad conciliadora, por lo que se ha adelantado el fin de la reunión."
 INS_revolution_events.21.a: "¿Cuántos más tendrán que morir?"
 INS_revolution_events.22.t: "[HOL.GetNameDefCap] nos pide ayuda"
 INS_revolution_events.22.desc: "[HOL.GetLeader] ha citado a [FRA.GetLeader] en Ámsterdam para debatir acerca de la coyuntura en las Indias. En este encuentro, [HOL.GetLeader] ha expuesto el proceder de los revolucionarios, que han armado a sus milicianos a un ritmo inabarcable para el ejército neerlandés. Tanto, que hoy [HOL.GetNameDef] bien podría perder su hegemonía colonial. Por ello, y a fin de atajar el conflicto en sus territorios de ultramar, nos solicitan una alianza formal, en virtud de la cual enviaríamos divisiones a Batavia para ayudarlos a recuperar las Indias. A cambio, y una vez restablecido el orden, nos correspondería el territorio nororiental de Sumatra."
 INS_revolution_events.22.a: "Una operación muy costosa, aunque por Sumatra tal vez valga la pena."
 INS_revolution_events.22.b: "Es demasiado lo que nos piden."
 INS_revolution_events.23.t: "¡[FRA.GetNameDefCap] nos ayudará!"
 INS_revolution_events.23.desc: "[FRA.GetNameDefCap] se presta a auxiliarnos, y para ello ha enviado varias divisiones galas a Batavia que de inmediato se han sumado a nuestros esfuerzos."
 INS_revolution_events.23.a: "Ahora llevamos las de ganar."
 INS_revolution_events.24.t: "[FRA.GetNameDefCap] no nos ayuda"
 INS_revolution_events.24.desc: "Pese a la urgencia de nuestro ruego, [FRA.GetNameDefCap] se ha negado a ayudarnos a combatir la revolución. Si no aceleramos el rearme, el enemigo no tardará en aventajarnos con mucho en número."
 INS_revolution_events.24.a: "Los pronósticos no nos sonríen."
 INS_revolution_events.25.t: "Fin de la guerra en Indonesia"
 INS_revolution_events.25.desc: "Fuerzas [HOL.GetAdjective] han destruido las bases principales de la milicia, logrando así derrocar al gobierno republicano. Se ha aprisionado a sus élites y comandantes, y la administración colonial ya está retomando sus operaciones en los dominios correspondientes. Tal y como se nos prometió, el territorio acordado pasa a ser nuestro."
 INS_revolution_events.25.a: "¡Estupendo!"
 INS_revolution_events.26.t: "Fin de la guerra en Indonesia"
 INS_revolution_events.26.desc: "Las fuerzas [HOL.GetAdjective] y las milicias republicanas llevaban enzarzadas en este conflicto mucho más tiempo del esperado por ambas partes, y [HOL.GetLeader] ha convenido en firmar un acuerdo fundamentado en la coexistencia de ambos Estados. No obstante, puesto que no hemos faltado a nuestra palabra, recibiremos igualmente el territorio que se nos prometió."
 INS_revolution_events.26.a: "Curioso acontecimiento."
 INS_revolution_events.27.t: "Fin de la guerra en Indonesia"
 INS_revolution_events.27.desc: "El conflicto entre las fuerzas [HOL.GetAdjective] y las milicias republicanas se está arrastrando ya mucho más de lo esperado por ambas partes y, a pesar del empeño de [HOL.GetNameDef] y de nuestra contribución militar, la contienda lleva tiempo encallada a favor del bando republicano debido al número aplastante de milicianos y a sus tácticas de guerrilla. Tanto es así, que [HOL.GetLeader] ha firmado un acuerdo de paz que propugna la coexistencia de un Estado colonial y otro republicano. De su glorioso imperio en las Indias apenas quedan ya lamentables vestigios. [HOL.GetLeader] arguye que, puesto que el conflicto se ha saldado con una derrota, no puede entregarnos el territorio prometido a cambio de nuestra contribución militar."
 INS_revolution_events.27.a: "¡Pero qué disparate!"
 INS_revolution_events.28.t: "La caída de las Indias"
 INS_revolution_events.28.desc: "A pesar del cuantioso dispendio militar por parte de [HOL.GetNameDef], y aun con nuestras contribuciones directas al conflicto, poco puede hacer nuestra coalición ante la aplastante superioridad numérica de las milicias de las Indias. Estas han logrado ya ocupar todas las ciudades principales y derrocar a la administración neerlandesa, que se ha visto obligada a claudicar."
 INS_revolution_events.28.a: "¿Y el territorio que nos prometieron?"
 INS_revolution_events.29.t: "La caída de las Indias"
 INS_revolution_events.29.desc: "A pesar de nuestro ahínco, los revolucionarios de las Indias se han apoderado de nuestras ciudades principales y han desbaratado desde dentro la administración colonial. Nuestros generales están cautivos y han cortado las líneas de comunicación. No nos queda más remedio que reconocer la derrota."
 INS_revolution_events.29.a: "Una tragedia."
 INS_revolution_events.30.t: "[INS.GetLeader] propone acordar un alto el fuego local"
 INS_revolution_events.30.desc: "[INS.GetLeader] ha propuesto un alto el fuego acotado a [FROM.GetName] y, si accedemos, se compromete a retirar sus tropas de [FROM.GetName] y permitir que las nuestras reafirmen su control sobre el territorio. El acuerdo, no obstante, se daría a condición de que suspendamos por el momento nuestras operaciones militares, dejando así margen a los revolucionarios para maquinar su estrategia."
 INS_revolution_events.30.a: "Aceptamos."
 INS_revolution_events.30.b: "De ninguna manera. ¡Recuperaremos [FROM.GetName] por la fuerza!"
 INS_revolution_events.31.t: "[HOL.GetNameDefCap] acepta el alto el fuego en [FROM.GetName]"
 INS_revolution_events.31.desc: "La negociación del alto el fuego ha salido a pedir de boca, y [HOL.GetLeader] acepta nuestras condiciones. Hemos ordenado a los cabecillas de [FROM.GetName] la retirada inmediata de sus milicias."
 INS_revolution_events.31.a: "Esperemos que cumplan lo pactado."
 INS_revolution_events.32.t: "[HOL.GetNameDefCap] rechaza el alto el fuego"
 INS_revolution_events.32.desc: "La negociación del alto el fuego ha hecho aguas. [HOL.GetLeader] se niega a firmar el acuerdo y ha interrumpido las negociaciones cuando la avenencia entre ambos bandos aún quedaba lejos."
 INS_revolution_events.32.a: "¡Esto es inaceptable!"
 INS_revolution_events.33.t: "[INS.GetNameDefCap] solicita una mediación"
 INS_revolution_events.33.desc: "Los republicanos indonesios nos han hecho llegar una petición oficial de ayuda para negociar un acuerdo con los neerlandeses. Explican nuestros expertos en la región que la situación se ha agravado de forma drástica y, si las maniobras del ejército neerlandés continúan, los nacionalistas no tardarán en recurrir al amparo soviético. Los Países Bajos son un aliado muy valioso en Europa, pero sería de insensatos hacer caso omiso de la realidad geopolítica en el Sudeste Asiático. Si por nuestra pasividad Indonesia acaba cayendo presa del comunismo, acabaremos lamentando el error."
 INS_revolution_events.33.a: "Que acudan nuestros mediadores."
 INS_revolution_events.33.b: "No podemos dinamitar nuestra relación con los neerlandeses."
 INS_revolution_events.34.t: "[FROM.GetNameDefCap] se ofrece a interceder"
 INS_revolution_events.34.desc: "Washington se ha prestado a arbitrar la negociación entre nuestro gobierno y los neerlandeses. Ya han salido del continente americano los emisarios, y la primera propuesta será un alto el fuego. Se trata de una oportunidad sin precedentes: al involucrar a la primera potencia mundial en la negociación, los Países Bajos ya no podrán empantanarla ni recurrir a la fuerza con la misma facilidad. Ahora tenemos que mantenernos firmes y dejar en manos de los estadounidenses lo que mejor saben hacer."
 INS_revolution_events.34.a: "Esperemos que así los neerlandeses entren en razón."
 INS_revolution_events.35.t: "[USA.GetNameDefCap] hace oficial su mediación"
 INS_revolution_events.35.desc: "Estados Unidos ha tomado partido en la problemática indonesia. Desde Washington afirman que ejercen en calidad de mediadores neutrales, pero la trascendencia de su arbitraje es inequívoca. Si el conflicto no se resuelve de conformidad con sus intereses, no dudarán en presionarnos aprovechando los medios que poseen, que no son pocos. Urge extremar la sutileza en la negociación, pues no nos conviene echar por tierra la simpatía que nos profesa la superpotencia."
 INS_revolution_events.35.a: "Esto lo zanjaremos a nuestra manera."
 INS_revolution_events.36.t: "[FROM.GetNameDefCap] se abstiene de intervenir"
 INS_revolution_events.36.desc: "Estados Unidos ha rehusado nuestra propuesta de mediación. Washington opta por posicionarse a favor de sus aliados europeos en lugar de respaldar nuestra justa reivindicación de autonomía. Estamos solos. Un duro revés, sin duda, pero esta revolución no la iniciamos esperando que el opresor extranjero nos concediera la libertad sin más."
 INS_revolution_events.36.a: "Ganaremos esta guerra sin ellos."
 INS_revolution_events.37.t: "[USA.GetNameDefCap] lanza un ultimátum"
 INS_revolution_events.37.desc: "A Estados Unidos se le ha agotado la paciencia. Washington ha emitido un ultimátum por el que exige el cese inmediato de todas las operaciones militares en Indonesia y que se reconozca su soberanía nacional. La amenaza es prácticamente inequívoca: nuestra posición en la comunidad internacional caería en desgracia si llegáramos a tener un desencuentro público con la superpotencia, y en el plano económico sufriríamos un descalabro insalvable. Nuestros generales insisten en que la campaña aún no está perdida, pero ¿no saldrá más cara la victoria que la derrota?"
 INS_revolution_events.37.a: "No nos queda más remedio que ceder."
 INS_revolution_events.37.b: "Indonesia es nuestra y no renunciaremos a ella."
 INS_revolution_events.38.t: "Los Países Bajos dan el brazo a torcer"
 INS_revolution_events.38.desc: "Se acabó. El gobierno neerlandés ha acatado el ultimátum estadounidense y reconoce nuestra soberanía. Trescientos cincuenta años de tiranía colonial llegan a su fin hoy, y no solo por la sangre vertida, sino en la mesa de negociación y con el peso de la mayor potencia del mundo de nuestro lado. Nuestra es la República, de costa a costa y sin salvedades, por fin."
 INS_revolution_events.38.a: "¡Merdeka!"
 INS_revolution_events.39.t: "Negativa neerlandesa"
 INS_revolution_events.39.desc: "Contra todo pronóstico, los Países Bajos han repudiado el ultimátum de Estados Unidos. Sus generales estarán convencidos de que pueden ganar la guerra antes de que Washington tome cartas en el asunto, pero se equivocan. Ahora que contamos con el apoyo de la administración estadounidense, han cambiado por completo las tornas del conflicto. Que vengan si es lo que quieren, porque ya no luchamos solos."
 INS_revolution_events.39.a: "El mundo nos respalda."
 INS_revolution_events.40.t: "Los neerlandeses aceptan nuestras condiciones"
 INS_revolution_events.40.desc: "La Haya ha acatado el ultimátum; se van a retirar de Indonesia las fuerzas neerlandesas, y la soberanía quedará en manos de la República de Indonesia. El trance ha sido doloroso, pero el desenlace resulta satisfactorio. Nuestros intereses en el territorio están más seguros al amparo de una Indonesia independiente y estable que teniendo que avalar una empresa colonial que a los neerlandeses ya se les hacía insostenible."
 INS_revolution_events.40.a: "Se ha impuesto la sensatez."
 INS_revolution_events.41.t: "Los neerlandeses nos desafían"
 INS_revolution_events.41.desc: "La Haya ha desdeñado sin miramiento alguno nuestro ultimátum. Proseguirá su campaña militar en Indonesia, aun cuando esta contraviene de pleno las exigencias estadounidenses. Un error de cálculo, cuando menos, imprevisto por su parte. Los Países Bajos no pueden compaginar una guerra colonial en Asia y a su vez depender de la caridad estadounidense en Europa. Si tomamos medidas drásticas, será porque ellos nos obligan."
 INS_revolution_events.41.a: "De acuerdo, pues."
 INS_revolution_events.42.t: "Una tirada final de los dados"
 INS_revolution_events.42.desc: "Los informes de nuestros servicios de inteligencia en Batavia describen preparativos enemigos a una escala que nunca habíamos visto en los republicanos. Al parecer, están preparando una operación de desestabilización para asaltar Java y destruir toda nuestra infraestructura de comunicaciones, garantizando de facto su victoria. Sin embargo, esta operación es extremadamente arriesgada y exige que destinen a ella prácticamente todos sus recursos. Nuestros generales estiman que solo podrán mantener esta posición unos dos años y no podrán retirarse de ella con facilidad. Si los contenemos lo suficiente, podremos aplastar a su gobierno y su revolución como un tomate demasiado maduro."
 INS_revolution_events.42.a: "Así comienza la batalla final."
 INS_revolution_events.43.t: "Base de la milicia establecida en [FROM.GetName]."
 INS_revolution_events.43.desc: "Nuestras iniciativas en [FROM.GetName] han dado fruto, y los líderes de milicias locales confirman que todo está dispuesto para intervenir llegado el momento."
 INS_revolution_events.43.a: "No cejemos, pues, en nuestro empeño."
 # Chaos Events
 INS_chaos_events.1.t: "Batalla en Surabaya"
 INS_chaos_events.1.desc: "Tras la declaración de independencia, el poder se ha vuelto precario en Surabaya. Hoy, un colectivo de partidarios neerlandeses ha izado la antigua bandera colonial en lo alto del Hotel Yamato. Las juventudes locales han asaltado el edificio y retirado las banderas, izando en su lugar la rojiblanca indonesia. El incidente ha desembocado en un caótico altercado violento."
 INS_chaos_events.1.a: "¡Como debe ser!"
 INS_chaos_events.1.b: "Decretad un alto el fuego. No nos arriesgaremos a una escalada."
 INS_chaos_events.2.t: "Fusión de partidos socialistas"
 INS_chaos_events.2.desc: "Las dos formaciones socialistas de mayor calado en Indonesia, encabezadas por Amir Sjarifuddin y Sutan Sjahrir, han hecho oficial hoy su fusión: nace así un Partido Socialista de Indonesia más íntegro y que gozará de una influencia mayor. Tanta, que bien podría hacer que peligre nuestra administración."
 INS_chaos_events.2.a: "Habrá que permitirlo."
 INS_chaos_events.2.b: "No podemos perdernos en rencillas políticas ahora. ¡Se declara la ley marcial!"
 INS_chaos_events.3.t: "Atentado fallido contra Sukarno"
 INS_chaos_events.3.desc: "Hoy un soldado ha abierto fuego contra el automóvil de Sukarno. Por suerte, el líder revolucionario no se encontraba en el vehículo, aunque su chófer se encuentra herido de gravedad. Aunque el atentado no se haya consumado, no cabe duda de que no será el último, sea por parte de los militares neerlandeses como de la misma oposición indonesia."
 INS_chaos_events.3.a: "¡Hay que restablecer el orden!"
 INS_chaos_events.4.t: "Sukarno, asesinado"
 INS_chaos_events.4.desc: "Indonesia lamenta hoy una tragedia. Sukarno ha sufrido otro atentado, y esta vez se ha cobrado su vida. No podemos dejar que esto ocasione una crisis de sucesión; es preciso restablecer el orden cuanto antes, o la República se desmoronará."
 INS_chaos_events.4.a: "Que lo releve el vicepresidente Hatta."
 INS_chaos_events.4.b: "El Partido Socialista tomará el testigo."
 INS_chaos_events.4.c: "Queda abolida la República. ¡Tan Malaka nos llevará a la victoria!"
 # Loyalist Events
 INS_loyalist_events.1.t: "[INS.GetLeader] pide el traslado de Henri Winkelman"
 INS_loyalist_events.1.desc: "[INS.GetLeader] nos ha contactado para departir acerca de los conflictos que proliferan en el mundo y la compleja tesitura en la que se encuentra [INS.GetNameDef]. [INS.GetLeader] propone que Henri Winkelman, el que fuera comandante supremo del Real Ejército de las Indias Orientales Neerlandesas, sea trasladado a [INS.GetNameDef] a fin de garantizar la integridad de la colonia."
 INS_loyalist_events.1.a: "Dispondremos el traslado de inmediato."
 INS_loyalist_events.1.b: "A Henri Winkelman lo necesitamos en la madre patria."
 INS_loyalist_events.2.t: "[HOL.GetLeader] accede a trasladar a Henri Winkelman"
 INS_loyalist_events.2.desc: "[INS.GetLeader] ha regresado de su conferencia con [HOL.GetLeader] en [HOL.GetNameDef]. El encuentro ha dado buenos frutos: [HOL.GetLeader] ha reconocido la complejidad de las circunstancias y ha consentido el traslado inmediato de Winkelman, que ya se encuentra de camino a [1058.GetName], donde aguardará nuestras órdenes."
 INS_loyalist_events.2.a: "Nos será de gran ayuda."
 INS_loyalist_events.3.t: "[HOL.GetLeader] no autoriza el traslado de Henri Winkelman"
 INS_loyalist_events.3.desc: "[INS.GetLeader] ha regresado de su conferencia con [HOL.GetLeader] en [HOL.GetNameDef]. Lamentablemente, se ha optado por no trasladar a Henri Winkelman a las Indias. Tendremos que valernos sin él."
 INS_loyalist_events.3.a: "Hay que trazar otro plan cuanto antes."
 INS_henri_winkelman_tt: "Traslado de Henri Winkelman denegado"
 # MALAYA CHAIN - Independent Malaya
 INS_loyalist_events.4.t: "[FROM.GetNameDefCap] propone la unificación"
 INS_loyalist_events.4.desc: "Ha llegado a [ROOT.Capital.GetCapitalVictoryPointName] una delegación [FROM.GetAdjective] con una propuesta de unificación. La justifican con el patrimonio malayo que comparten nuestras gentes y recalcan que los confines entre nuestras naciones no los delinearon sus habitantes, sino los colonizadores europeos. Con arreglo a su propuesta, se disolverían los respectivos gobiernos para refundar un nuevo Estado plural."
 INS_loyalist_events.4.a: "Aceptamos la iniciativa."
 INS_loyalist_events.4.b: "Rechazamos la iniciativa."
 INS_loyalist_events.5.t: "[FROM.GetNameDefCap] acepta la unificación"
 INS_loyalist_events.5.desc: "Nuestros diplomáticos han regresado de [FROM.Capital.GetCapitalVictoryPointName] con muy buenas nuevas. El gobierno [FROM.GetAdjective] ha dado el visto bueno a nuestra propuesta, y sus funcionarios ya han puesto en marcha los preparativos para incorporar sus territorios a nuestra administración."
 INS_loyalist_events.5.a: "¡Juntos somos más fuertes!"
 INS_loyalist_events.6.t: "[FROM.GetNameDefCap] no acepta la unificación"
 INS_loyalist_events.6.desc: "Nuestros diplomáticos regresan de [FROM.Capital.GetCapitalVictoryPointName] con las manos vacías. El gobierno [FROM.GetAdjective] no se ha dignado siquiera a contemplar la propuesta de integración. Sin apenas recibir excusas más allá de la obligada formalidad de cortesía, nuestra delegación se ha visto instada a emprender el viaje de vuelta."
 INS_loyalist_events.6.a: "¡Peor para ellos!"
 # MALAYA CHAIN - Subject Malaya (Overlord receives)
 INS_loyalist_events.7.t: "[FROM.GetNameDefCap] exige un referéndum en [MAL.GetName]"
 INS_loyalist_events.7.desc: "[FROM.GetNameDefCap] ha manifestado su voluntad de celebrar un referéndum en [MAL.GetName] que ponga de relieve si el pueblo desea la unificación con su Estado. En un alarde de franqueza, su embajador ha asegurado que los malayos a ambos lados de la frontera se consideran una sola nación, por lo que el resultado del referéndum sería previsible. Si autorizamos la votación, podemos dar prácticamente por perdido el territorio de [MAL.GetName]."
 INS_loyalist_events.7.a: "Que decida el pueblo."
 INS_loyalist_events.7.b: "No tendrán nuestro consentimiento."
 # MALAYA CHAIN - Subject Malaya (MAL receives after overlord agrees)
 INS_loyalist_events.8.t: "[FROM.GetNameDefCap] aprueba el referéndum de unificación"
 INS_loyalist_events.8.desc: "Nuestros soberanos han dado permiso a [FROM.FROM.GetNameDef] para celebrar un referéndum en nuestro país. La afluencia de activistas [FROM.FROM.GetAdjective] no se ha hecho esperar, y se estima que los comicios se pongan en marcha este mismo mes. La pregunta que se formula a nuestro pueblo es muy sencilla: ¿deseamos unirnos a [FROM.FROM.GetNameDef] o permanecer como hasta hoy?"
 INS_loyalist_events.8.a: "Nos uniremos a ellos."
 INS_loyalist_events.8.b: "Preferimos seguir separados."
 # MALAYA CHAIN - Overlord informed of MAL's choice
 INS_loyalist_events.9.t: "[FROM.GetNameDefCap] vota contra la unificación"
 INS_loyalist_events.9.desc: "Ha terminado el referéndum en [FROM.GetName]. El pueblo [FROM.GetAdjective] se decanta por mantener la administración actual. Los activistas [FROM.FROM.GetAdjective] se han marchado."
 INS_loyalist_events.9.a: "Era de esperar."
 INS_loyalist_events.10.t: "[FROM.GetNameDefCap] vota a favor de la unificación"
 INS_loyalist_events.10.desc: "El referéndum en [FROM.GetName] se ha saldado con una amplia mayoría a favor de la unificación con [FROM.FROM.GetNameDef]. Nuestros mandatarios regionales ya adelantaban que este era el resultado esperado, y ahora estamos obligados a cumplir la voluntad popular."
 INS_loyalist_events.10.a: "Dimos nuestra palabra."
 # MALAYA CHAIN - INS receives result
 INS_loyalist_events.11.t: "Triunfa el referéndum malayo"
 INS_loyalist_events.11.desc: "El pueblo de [MAL.GetName] ha expresado su deseo de unirse a nuestra nación. El funcionariado [MAL.GetAdjective] colabora ya con nuestra administración para efectuar el traspaso de potestades. En adelante, habrá una frontera menos que segmente la esfera malaya."
 INS_loyalist_events.11.a: "Bienvenidos a la familia."
 INS_loyalist_events.12.t: "Se rechaza el proyecto de unificación malaya"
 INS_loyalist_events.12.desc: "Nuestra propuesta de coalición con [MAL.GetName] ha sido rechazada por parte del gobierno [MAL.GetAdjective], o quienes mueven los hilos de este. Volveremos a impulsarla llegado el momento oportuno."
 INS_loyalist_events.12.a: "Esto no caerá en el olvido."
 INS_loyalist_events.13.t: "[FROM.GetNameDefCap] propone un acuerdo por Singapur"
 INS_loyalist_events.13.desc: "El gobierno [FROM.GetAdjective] nos ha planteado una oferta que atañe a Singapur. Piden la soberanía de la isla, respaldada por su posición de influencia en el ecosistema malayo; a cambio, nos garantizarían acceso sin trabas a su puerto, instalaciones militares y los derechos de extracción de recursos de los que ya gozamos."
 INS_loyalist_events.13.a: "Un convenio justo."
 INS_loyalist_events.13.b: "Singapur no está en venta."
 INS_loyalist_events.14.t: "Acuerdo por Singapur aceptado"
 INS_loyalist_events.14.desc: "La propuesta ha recibido buena acogida. El gobierno de Singapur ahora es nuestro, mientras que sus antiguos soberanos gozarán de acceso comercial y militar a su puerto. Nuestra bandera ondea ahora en uno de los puertos más importantes de Asia."
 INS_loyalist_events.14.a: "Los estrechos nos pertenecen."
 INS_loyalist_events.15.t: "Acuerdo por Singapur rechazado"
 INS_loyalist_events.15.desc: "Nuestra propuesta no ha salido adelante. Los soberanos de Singapur no quieren desprenderse de la isla bajo ningún concepto. Aun ofreciéndoles poco menos que el control extraoficial absoluto, ha sido imposible satisfacerlos."
 INS_loyalist_events.15.a: "De acuerdo, pues."
 INS_loyalist_events.16.t: "[FROM.GetNameDefCap] solicita la cesión de Ceilán"
 INS_loyalist_events.16.desc: "El gobierno [FROM.GetAdjective] solicita por canales oficiales que se le confíe la jurisdicción de Ceilán. Sus diplomáticos fundamentan la iniciativa en los vínculos comerciales y étnicos que existen desde hace generaciones entre la isla y la esfera malaya. La petición apenas se sostiene, francamente, pero [FROM.GetNameDef] ha amasado ya poder suficiente como para desestimar sus alegatos."
 INS_loyalist_events.16.a: "Muy bien, que se la queden."
 INS_loyalist_events.16.b: "Ceilán seguirá siendo nuestra."
 INS_loyalist_events.17.t: "Ceilán cedida"
 INS_loyalist_events.17.desc: "Se ha efectuado la transferencia de Ceilán. Ya están camino de la isla nuestros funcionarios, y la transición se ha desarrollado sin incidencias. Ahora poseemos territorios estratégicos a ambos lados del estrecho."
 INS_loyalist_events.17.a: "Excelente."
 INS_loyalist_events.18.t: "Cesión de Ceilán denegada"
 INS_loyalist_events.18.desc: "Se ha rechazado nuestra propuesta de asumir el control de Ceilán. Sus soberanos no desean renunciar al territorio insular, y nuestros emisarios avisan de que toda insistencia será estéril."
 INS_loyalist_events.18.a: "Más adelante, tal vez."
 INS_loyalist_events.19.t: "[FROM.GetNameDefCap] exige un referéndum en Papúa"
 INS_loyalist_events.19.desc: "Desde [FROM.GetNameDefCap] se nos insta a permitir un referéndum en Papúa Oriental. Fundan su reivindicación en las diferencias manifiestas a ambos lados de la frontera. En el lado [FROM.GetAdjective] hay carreteras nuevas que cruzan la jungla, clínicas atendidas por sanitarios públicos y escuelas donde se imparten clases en el idioma autóctono. A nuestro lado, en cambio, el último gobernador apenas se dignó a pisar Puerto Moresby dos veces en tres años. En palabras del embajador [FROM.GetAdjective], \"poco más que añadir\"."
 INS_loyalist_events.19.a: "Que voten si tantas ganas tienen."
 INS_loyalist_events.19.b: "No lo vamos a consentir."
 INS_loyalist_events.20.t: "Se aprueba el referéndum de Papúa"
 INS_loyalist_events.20.desc: "Los australianos accedieron a celebrar el referéndum, y el resultado de este fue el mismo en todos y cada uno de los distritos de Papúa Oriental. Nuestro compromiso con la mitad occidental ha quedado patente inversión a inversión. Frente a tal realidad, de poco iba a servir la propaganda electoral."
 INS_loyalist_events.20.a: "Al fin, la isla ya no estará dividida."
 INS_loyalist_events.21.t: "Se rechaza el referéndum de Papúa"
 INS_loyalist_events.21.desc: "Los australianos se cierran en banda. Su gobernador de Puerto Moresby ha emitido un comunicado en el que tilda la propuesta de afrenta a la soberanía australiana. La opinión de los papúes, en cambio, no la contemplan."
 INS_loyalist_events.21.a: "No olvidaremos esto."
 INS_loyalist_events.22.t: "[FROM.GetNameDefCap] exige Timor Oriental"
 INS_loyalist_events.22.desc: "El gobierno [FROM.GetAdjective] se ha servido de canales oficiales para instarnos a entregarles Timor Oriental. Su embajador ha recalcado que nuestra guarnición en la colonia apenas supera los doscientos efectivos, y Lisboa lleva años sin apenas destinar recursos al territorio. Habida cuenta de estos hechos, nos pregunta con qué derecho acaparamos la región."
 INS_loyalist_events.22.a: "No vale la pena entrar en conflictos por esto."
 INS_loyalist_events.22.b: "Timor es y será nuestro."
 INS_loyalist_events.23.t: "Cesión de Timor Oriental"
 INS_loyalist_events.23.desc: "El gobierno de Timor Oriental ha ordenado el desalojo de su guarnición, y la administración colonial prepara también su marcha. La isla entera no tardará en responder a la autoridad [INS.GetAdjective]."
 INS_loyalist_events.23.a: "Como debe ser."
 INS_loyalist_events.24.t: "Nos niegan Timor Oriental"
 INS_loyalist_events.24.desc: "El gobernador colonial de Dili nos ha enviado una misiva de su puño y letra en la que impugna nuestra reivindicación e insiste en que en Timor Oriental no hay más soberanía que la de su administración. Nuestro Estado Mayor ya ha preparado planes de contingencia, por si el gabinete decidiera insistir."
 INS_loyalist_events.24.a: "Poned en marcha los preparativos."
 INS_loyalist_events.25.t: "[FROM.GetNameDefCap] propone la unificación"
 INS_loyalist_events.25.desc: "Hemos recibido a una delegación [FROM.GetAdjective] enviada para proponer la unificación de nuestras dos repúblicas. A tal fin, alegan que nuestras gentes comparten las mismas raíces austronesias, mucho más antiguas que los confines coloniales que nos separan, y que un Estado común que abarcase el archipiélago por entero se consolidaría enseguida como potencia preeminente en el Sudeste Asiático. Si aceptamos, nuestro gobierno se disolverá y se integrará en el suyo."
 INS_loyalist_events.25.a: "La aceptamos."
 INS_loyalist_events.25.b: "Esta república nos ha costado sudor y sangre."
 INS_loyalist_events.26.t: "[FROM.GetNameDefCap] acepta la unificación"
 INS_loyalist_events.26.desc: "El gobierno [FROM.GetAdjective] ha aceptado nuestra propuesta, y sus funcionarios ya se están coordinando con los nuestros para poner en marcha el proceso de integración. Nuestra nación ahora engloba el archipiélago malayo en toda su extensión: de Aceh a Luzón, y de Borneo a Mindanao."
 INS_loyalist_events.26.a: "Da comienzo una nueva era."
 INS_loyalist_events.27.t: "[FROM.GetNameDefCap] no acepta la unificación"
 INS_loyalist_events.27.desc: "El gobierno [FROM.GetAdjective] se ha negado. Están lamiéndose aún las heridas de la lucha por su independencia, y no son pocas, como para plantearse ceder su soberanía a otro Estado. La propuesta queda, pues, archivada hasta más ver."
 INS_loyalist_events.27.a: "Lástima."
 INS_loyalist_events.28.t: "[FROM.GetNameDefCap] pide un referéndum en [PHI.GetName]"
 INS_loyalist_events.28.desc: "[FROM.GetNameDefCap] ha solicitado por vía oficial que autoricemos un referéndum en [PHI.GetName] con respecto a la unificación. Sus diplomáticos se escudan para ello en la genealogía austronesia que comparten nuestros pueblos y en el carácter artificial de las fronteras coloniales que nos dividen. Si la votación sale adelante, cabe esperar que el resultado favorezca a [FROM.GetNameDef]."
 INS_loyalist_events.28.a: "El pueblo merece voz y voto."
 INS_loyalist_events.28.b: "Ni hablar."
 INS_loyalist_events.29.t: "Referéndum de unificación aprobado"
 INS_loyalist_events.29.desc: "[FROM.FROM.GetNameDefCap] ha propuesto que nuestra nación y la suya se unifiquen, ya que compartimos una misma ascendencia austronesia. Tras autorizar nuestros soberanos un referéndum a este respecto, empiezan ya a cruzar nuestras fronteras activistas [FROM.FROM.GetAdjective]. Del resultado dependerá si nuestra república se une a [FROM.FROM.GetNameDef] o continúa por su cauce actual."
 INS_loyalist_events.29.a: "Interesante propuesta."
 INS_loyalist_events.29.b: "Claro que no."
 INS_loyalist_events.30.t: "[FROM.GetNameDefCap] vota contra la unificación"
 INS_loyalist_events.30.desc: "Concluidos ya los recuentos, los activistas [FROM.FROM.GetAdjective] emprenden la marcha. El pueblo [FROM.GetAdjective] ha votado seguir su propio camino. Al parecer, la independencia aún goza de cierto valor en [FROM.Capital.GetCapitalVictoryPointName]."
 INS_loyalist_events.30.a: "Queda, pues, zanjada la cuestión."
 INS_loyalist_events.31.t: "[FROM.GetNameDefCap] vota a favor de la unificación"
 INS_loyalist_events.31.desc: "Han finalizado ya los recuentos. El pueblo [FROM.GetAdjective] prefiere a [FROM.FROM.GetNameDef] antes que a nosotros, y así lo atestigua un resultado nada reñido. Nuestros funcionarios han recibido ya la orden de efectuar el traspaso de poderes."
 INS_loyalist_events.31.a: "El pueblo ha hablado."
 INS_loyalist_events.32.t: "[PHI.GetNameDefCap] vota sí a la unificación"
 INS_loyalist_events.32.desc: "El referéndum [PHI.GetAdjective] se ha saldado a nuestro favor. Su gobierno acata el resultado y ha entablado ya contacto con nuestro Ministerio de Asuntos Exteriores a fin de efectuar el traspaso de poderes."
 INS_loyalist_events.32.a: "Al fin juntos."
 INS_loyalist_events.33.t: "[PHI.GetNameDefCap] vota no a la unificación"
 INS_loyalist_events.33.desc: "El gobierno [PHI.GetAdjective] se opone a nuestra propuesta de unificación. Su parlamento ha votado en contra sin siquiera detenerse a estudiarla. Les hemos ofrecido un lugar de honor en el seno de la nación más excelsa del Sudeste Asiático, y ellos nos escupen en la cara."
 INS_loyalist_events.33.a: "Un leve percance, nada más."
 INS_communist_events.6.t: "Agentes [FROM.GetAdjective] provocan disturbios en [ROOT.GetName]"
 INS_communist_events.6.desc: "Nuestros servicios de inteligencia confirman lo que hace tiempo sospechábamos. [FROM.GetNameDefCap] está llevando a cabo una campaña implacable de subversión en nuestro territorio nacional: financian agrupaciones radicales, distribuyen propaganda sediciosa y organizan huelgas de trabajadores. Poseen agentes integrados en los sindicatos y cooperativas rurales, e incluso tienen ya la desvergüenza de alentar al derrocamiento de nuestro gobierno. Poco más puede agravarse la situación; hemos de tomar medidas drásticas antes de que la insurgencia escape a todo control."
 INS_communist_events.6.a: "¡Es intolerable!"
 INS_communist_events.7.t: "Subversión comunista en [FROM.GetName]"
 INS_communist_events.7.desc: "Nos llegan de [FROM.FROM.GetName] noticias preocupantes. Agentes a las órdenes de [FROM.GetNameDef] llevan tiempo inculcando el pensamiento revolucionario entre la población local, aprovechando cierto descontento con nuestra administración para recabar apoyos a favor de un golpe de Estado comunista. Si no ponemos coto a este ultraje, los radicales podrían llegar a apoderarse por completo de [FROM.FROM.GetNameDef], y la plaga no tardaría en propagarse a otros territorios."
 INS_communist_events.7.a: "¡Hay que atajar este mal antes de que se extienda!"
 INS_communist_events.8.t: "Circula por [ROOT.GetName] propaganda [FROM.GetAdjective]"
 INS_communist_events.8.desc: "Por nuestras fábricas, universidades y mercados están circulando cada vez más octavillas y panfletos procedentes, a todas luces, [FROM.GetAdjective]. En ellos se presenta un retrato épico de la lucha de clases y se promete una supuesta libertad que solo puede llegar de la mano de la revolución. Se trata de propaganda burda, pero efectiva, y no parece que vaya a perder fuelle, ya que nuestra policía advierte de su buena acogida entre los segmentos más insatisfechos de la población."
 INS_communist_events.8.a: "¡Averiguad quién anda distribuyendo esa abyección!"
 ## Call for Revolution - Main Event (sent to target) ##
 INS_communist_events.1.t: "Revolución en [ROOT.GetName]"
 INS_communist_events.1.desc: "El descontento civil ha adquirido ya un cariz irremediable. Los meses de injerencias por parte [FROM.GetAdjective] han dado sus frutos, y el movimiento comunista en [ROOT.GetName] ya no se puede coartar por la vía diplomática. Las huelgan generales paralizan nuestras urbes, hay partisanos armados tomando provincias enteras, y el gobierno [FROM.GetAdjective] se ha volcado por completo en la causa revolucionaria. Nuestras fuerzas de seguridad no dan abasto, y su lealtad al régimen ya no está asegurada. Es hora de decidir si luchamos por la supervivencia del Estado o aceptamos lo inevitable antes de que corra más sangre."
 INS_communist_events.1.a: "Llamad a filas. Si sucumbimos, no será como mansas bestias."
 INS_communist_events.1.b: "Resistirnos solo traerá más miseria a nuestro pueblo."
 INS_communist_events.1.c: "Tal vez aún estemos a tiempo de meterlos en cintura si les ofrecemos parte del pastel."
 ## Civil War Chosen - sent to Indonesia ##
 INS_communist_events.2.t: "[FROM.GetNameDefCap] luchará"
 INS_communist_events.2.desc: "El gobierno de [FROM.GetName] no quiere dar el brazo a torcer y ha ordenado a sus fuerzas armadas reprimir por la fuerza el movimiento revolucionario. Nuestros camaradas ya se han movilizado y están tomando enclaves estratégicos. La contienda no será breve, pero el pueblo de [FROM.GetName] ha hecho patente su voluntad, y no vamos a permitir que se enfrente él solo al opresor."
 INS_communist_events.2.a: "La revolución prosigue."
 ## Surrender - sent to Indonesia ##
 INS_communist_events.3.t: "La caída de [FROM.GetNameDefCap]"
 INS_communist_events.3.desc: "El gobierno ya ilegítimo de [FROM.GetName] ha capitulado. Ante la fuerza arrolladora del movimiento revolucionario, y conscientes de que este contaba con el respaldo de [ROOT.GetNameDef], han comprendido que su única vía es la sumisión. El poder se ha puesto en manos del partido comunista local, y el nuevo gobierno no ha dudado en pedirnos asesoramiento. Otra nación que se zafa del yugo que le imponía el antiguo orden."
 INS_communist_events.3.a: "Gran victoria para los proletarios del mundo."
 ## Civil War in Subject - sent to overlord ##
 INS_communist_events.4.t: "Estalla una guerra civil en [FROM.GetName]"
 INS_communist_events.4.desc: "Revolucionarios comunistas, armados, organizados y con el respaldo de [FROM.FROM.GetNameDef] han llamado a la insurrección total en [FROM.GetName]. La administración colonial ha perdido el control de territorios extensos y, a falta de refuerzos, el gobernador se queja de lo exiguo de su guarnición, que es incapaz de imponer el orden."
 INS_communist_events.4.a: "Enviad al ejército. ¡[FROM.GetName] nos pertenece!"
 ## Subject Surrendered - sent to overlord ##
 INS_communist_events.5.t: "El comunismo se apodera de [FROM.GetName]"
 INS_communist_events.5.desc: "La administración de [FROM.GetName] se ha rendido a los sublevados comunistas sin luchar siquiera. El gobernador y sus funcionarios están detenidos, nuestra bandera ya no ondea, y el poder lo ha asumido un gobierno revolucionario autoproclamado. Esto es todo fruto de las maquinaciones de [FROM.FROM.GetNameDef] y sus agentes, que llevaban meses erosionando nuestra autoridad en la región. Lo que han hecho es poco menos que robar, y por ello no han de salir impunes."
 INS_communist_events.5.a: "¡Esto es un ultraje!"
 # Cooperate with Revolutionaries (sent to target)
 INS_communist_events.9.t: "Encuentros de funcionarios [FROM.GetAdjective] con disidentes"
 INS_communist_events.9.desc: "Nos informan que se ha visto en diversos puntos del país a agentes [FROM.GetAdjective] en compañía de agitadores y cabecillas de la militancia. Voceros del estudiantado que ayer se dedicaban a repartir octavillas en cualquier esquina ahora se codean a puerta cerrada con personas con acceso a documentos diplomáticos [FROM.GetAdjective]. Nuestra policía no alcanza a confiscar todas las publicaciones censuradas que se imprimen en masa, y las protestas que antes se disolvían la misma tarde que surgían ahora paralizan distritos enteros durante días. A cada día que pasa, los comunistas se vuelven más numerosos y organizados; si no intervenimos con celeridad, acabaremos perdiendo las riendas del poder."
 INS_communist_events.9.a: "¡Hay que acabar de una vez por todas con los agentes extranjeros!"
 # Spread Anti-Colonialist Sentiment (sent to subject target)
 INS_communist_events.10.t: "La retórica [FROM.GetAdjective] gana impulso"
 INS_communist_events.10.desc: "Están circulando panfletos [FROM.GetAdjective] por los cuarteles y sedes de la administración pública, y de poco han servido las órdenes de confiscarlos. Sus autores preconizan la emancipación, la épica liberación de un pueblo que se rebela contra el opresor colonial y se labra un destino propio. Sería más fácil sofocar el fervor que esta épica provoca en el pueblo si este no se identificase con ella. Incluso los funcionarios más leales han empezado a preguntarse, a media voz, si quienes lo gobernamos miramos realmente por el pueblo o, en cambio, servimos a la mano que nos da de comer."
 INS_communist_events.10.a: "Ante todo, cautela."
