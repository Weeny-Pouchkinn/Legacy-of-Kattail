 ### INS News
 taog_news.1.t: "Nace la Unión Neerlando-Indonesia"
 taog_news.1.desc: "La reina Guillermina compareció ayer en [1058.GetName] para anunciar de improviso la creación de un Estado conjunto neerlando-indonesio. Puesto que su patria se encuentra ocupada, y el gobierno [HOL.GetAdjective] en el exilio, la administración [INS.GetAdjective] se ha prestado a gobernar como un solo ente supeditado a la Corona. Funcionarios de las dos naciones presentan la decisión no como un capricho político prescindible, sino como una medida imperiosa destinada a salvaguardar la unidad del reino y su autoridad en ambos continentes."
 taog_news.1.a: "Curioso acontecimiento."
 taog_news.2.t: "Declaración de Independencia de Indonesia"
 taog_news.2.desc: "[INS.GetLeader], adalid de la revolución [INS.GetAdjective], ha dado hoy un discurso en Java en el que declaraba la independencia de la recién fundada República de Indonesia. [HOL.GetNameDef] no reconoce la soberanía del proyecto republicano, pero gran parte del territorio lo controlan ya de facto milicias indonesias."
 taog_news.2.a: "Esto podría desencadenar grandes cambios a escala global."
 ############
 ### SIAM ###
 ############
 siam.1.t: "[SIA_phraya_phahon.GetName], involucrado en un escándalo"
 siam.1.desc: "Se ha acusado a [SIA_phraya_phahon.GetName] de vender patrimonio de la Corona a miembros de la administración por debajo de su valor de mercado, un escándalo que ha mermado sobremanera su legitimidad a ojos de la Asamblea Popular. Todo apunta a que la era de [SIA_phraya_phahon.GetName] toca a su fin."
 siam.1.a: "¿Será hora de dar paso a otra figura prominente?"
 #Spmgsiradet rebellion historical
 siam.2.t: "Tercer atentado contra [SIA_plaek_phibunsongkhram.GetName]"
 siam.2.desc: "Un comunicado del corresponsal de Reuters en Bangkok informa que se ha tratado de envenenar al primer ministro de Siam, don Phibul Songgram, en lo que constituye ya el tercer atentado contra su vida en los últimos cuatro años.\nLa semana pasada, alega el mensaje, se emponzoñó la comida del primer ministro, provocando así un malestar pasajero a don Songgram, su esposa y su hija.\nEl Secretario de Asuntos Exteriores británico, Lord Halifax, ha dedicado una misiva a Songgram en la que se dice turbado por la cobarde agresión y aliviado de saber que esta se ha saldado sin víctimas graves." #https://trove.nla.gov.au/newspaper/article/47990695
 siam.2.a: "¿Quién habrá sido?"
 siam.3.t: "Phraya Songsuradet, desterrado"
 siam.3.desc: "Se ha acusado a Phraya Songsuradet de orquestar uno o más atentados contra [SIA_plaek_phibunsongkhram.GetName], además de instrumentar un golpe de Estado para derrocar a su gobierno. Las autoridades exigen la expulsión inmediata del país de Phraya Songsuradet y la retirada de todos sus galones y títulos, obligándolo así a dejar el ejército sin pensión.\nVoces críticas aseveran que se trata de una purga apenas disimulada que [SIA_plaek_phibunsongkhram.GetName] instiga con el fin de eliminar a su mayor rival. Esto, claro está, no son más que calumnias."
 siam.3.a: "Lamentable final."
 siam.4.t: "Detenidos partidarios de Songsuradet"
 siam.4.desc: "Esta madrugada, con la colaboración de la policía real tailandesa, el gobierno ha arrestado a cincuenta y un sospechosos y simpatizantes más; entre ellos se encuentran el príncipe Rangsit, Phraya Thepahatsadin y Phraya Udom Pongphensawad. Se les acusa de participar en la conspiración de Phraya Songsuradet en contra del Estado, y la ciudadanía se admira de saber que Rangsit, miembro de la familia real, deberá ir a juicio. Hay analistas que se preguntan si las represalias tomadas contra el príncipe tienen por objetivo subrayar a los miembros de la casa real aún presentes en [THIS.GetName] que toda deslealtad al régimen conllevará su castigo."
 siam.4.a: "La trama se va complicando."
 siam.5.t: "La Rebelión de los Dieciocho Cadáveres"
 siam.5.desc: "Phibul ha constituido un tribunal especial dedicado a juzgar a los cincuenta y un individuos implicados en la rebelión. Veinticinco de estos afrontarán cadenas perpetuas, y se preveía el fusilamiento de otros veintiuno. Sin embargo, se ha convenido en indultar por su trayectoria honorable a tres de estos últimos, entre quienes se cuentan el príncipe Rangsit y Phraya Thepahatsadin."
 siam.5.a: "Queda, pues, zanjado el asunto."
 #Songsuradet rebellion alternative
 siam.6.t: "La encrucijada de Songsuradet"
 siam.6.desc: "Se ha acusado a Phraya Songsuradet de orquestar uno o más atentados contra [SIA_plaek_phibunsongkhram.GetName], además de instrumentar un golpe de Estado para derrocar a su gobierno. Las autoridades exigen la dimisión y el destierro inmediato de Songsuradet.\nSin embargo, militares partidarios de Songsuradet han obstruido la detención del alto cargo, denunciando que esta obedece a motivos políticos. Tanto el gobierno como la camarilla de Songsuradet se niegan a dar el brazo a torcer, quedando estancado el proceso jurídico."
 siam.6.a: "No nos dejaremos amedrentar."
 siam.6.b: "La operación ha descarrilado. Tendremos que recular."
 siam.7.t: "Songsuradet pide apoyo a la armada"
 siam.7.desc: "Mientras prosigue el tenso enfrentamiento entre las fuerzas gubernamentales y la camarilla militar de Songsuradet, una investigación oficial ha alertado de que circulan rumores sobre la existencia de una nueva alianza entre la Marina Real y Songsuradet, forjada con el objetivo explícito de poner freno al autoritarismo de Phibun.\nY eso no es todo: empleados de la casa real informan de que se han agendado encuentros de príncipes de alto rango con representantes de Songsuradet, lo que acrecienta el temor a que la institución real tome partido en contra de la administración."
 siam.7.a: "¡Somos el gobierno y no nos dejaremos chantajear!"
 siam.7.b: "La problemática se nos va ya de las manos. Será mejor ceder."
 #alt-hist actual rebellion
 siam.8.t: "La rebelión de Songsuradet"
 siam.8.desc: "Ahora que cuenta con apoyos políticos y militares suficientes, la camarilla de Songsuradet, con el respaldo de la armada, ha logrado tomar grandes zonas de [THIS.GetName]. Esta madrugada se oían ecos de disparos en los suburbios de Bangkok, y el país entero parece haberse hecho ya a la idea de asistir a una guerra civil en toda regla entre el gobierno y Songsuradet."
 siam.8.a: "El gobierno ha de prevalecer."
 #alt-hist actual rebellion
 siam.9.t: "Fin de la rebelión de Songsuradet"
 siam.9.desc: "La rebelión hace aguas, Songsuradet se encuentra ya capturado y tan solo queda juzgarlo, aunque a estas alturas el juicio no es más que una mera formalidad. Queda comprobado que la conspiración no solo se daba en el seno del ejército y la armada, sino que se extendía también a la casa real, ya que se ha descubierto que el príncipe Rangsit apoyaba sin tapujos a los rebeldes. La purga en profundidad de toda disidencia ha pasado de ser opcional a imprescindible."
 siam.9.a: "La reconstrucción es ya impostergable."
 #Attack Indochina
 siam.10.t: "¡Victoria!"
 siam.10.desc: "El enemigo se bate en retirada, y el triunfo se antoja ya seguro. Nuestro dominio del territorio es incontestable, y las fuerzas imperialistas deben de estar temblando de miedo. ¿Cómo han podido perder? Habrá sido por designio de la divina providencia."
 siam.10.a: "¡Por [ROOT.GetName]!"
 siam.10.b: "Va todo viento en popa."
 siam.11.t: "Avance estratégico [FROM.GetAdjective]"
 siam.11.desc: "Contra todo pronóstico, el ejército [FROM.GetAdjective] ha aventajado a nuestras tropas y se ha apoderado de la región disputada. La ocupación va en grave menoscabo de nuestra autoridad y soberanía en la zona. De proseguir con la contienda, nos exponemos a una mayor erosión disciplinaria y de respeto a nuestras instituciones, pero desistir supondría poco menos que admitir el fiasco."
 siam.11.a: "Lo más prudente es retirarnos y minimizar pérdidas."
 siam.11.b: "¡No renunciaremos a nuestro derecho territorial!"
 siam.12.t: "[FROM.GetName] acepta la derrota"
 siam.12.desc: "Nuestra campaña ha triunfado. La resistencia enemiga se desmorona, y [FROM.GetName] ha hecho oficial la cesión del territorio en disputa con el fin de evitar mayores estragos. Esta victoria refrenda nuestra autoridad y nos garantiza cierta seguridad fronteriza... por ahora."
 siam.12.a: "Nuestra fuerza es indiscutible."
 siam.13.t: "[FROM.GetName] se niega a negociar"
 siam.13.desc: "[FROM.GetName] manifiesta su rechazo tajante a toda propuesta de concesión territorial, tildándolas de inaceptables. Su cúpula ha declarado que no ve más fin viable a este conflicto que la destrucción total de nuestro Estado."
 siam.13.a: "De acuerdo, pues."
 siam.14.t: "[FROM.GetNameDefCap] opta por la guerra abierta"
 siam.14.desc: "[FROM.GetNameDefCap] abandona toda voluntad de negociar. Su objetivo es inequívoco: conquistar y dominar por completo nuestra nación. No habrá tratado alguno que ponga fin a esta guerra, tan solo una victoria o un descalabro total."
 siam.14.a: "Ni rendiciones ni medias tintas."
 siam.15.t: "Se empantana la ofensiva [SIA.GetAdjective]"
 siam.15.desc: "El presuroso ataque de las fuerzas [SIA.GetAdjective] nos sorprendió con la guardia baja en un principio, pero a medida que se desarrolla el conflicto, sus carencias y debilidades logísticas van quedando de manifiesto. Lo que se auguraba como una campaña relámpago se ha tornado en un suplicio inabarcable para las huestes [SIA.GetAdjective]. Podríamos hacer gala de magnificencia y ofrecer concesiones, aunque no corresponde a nadie más que a nosotros decidir si la piedad nos beneficiará más que una victoria aplastante."
 siam.15.a: "Les plantearemos concesiones."
 siam.15.b: "Aspiramos a la victoria total, nada menos."
 siam.16.t: "Ofensiva estancada"
 siam.16.desc: "Nuestra ofensiva ha perdido inercia, y el verdadero problema es que nuestro enemigo lo sabe. Nos han hecho llegar un ultimátum: o claudicamos de inmediato y evitando más pérdidas, o la guerra continuará, y con ella el baño de sangre. La única referencia entre ambos desenlaces reside en el número de muertos que habrá que sepultar."
 siam.16.a: "Haya paz."
 siam.16.b: "¡Jamás nos rendiremos!"
 siam.17.t: "[FROM.GetName] no ceja"
 siam.17.desc: "Sin dejar margen alguno a la duda, [FROM.GetName] declara que antes prefiere ver su país envuelto en llamas que cedernos un gramo siquiera de tierra. La guerra continúa."
 siam.17.a: "Verán cumplido su deseo."
 siam.18.t: "¡[FROM.GetName] nos quiere ver capitular!"
 siam.18.desc: "Hemos interceptado comunicaciones del alto mando enemigo que confirman nuestros temores más graves: no habrá negociación de paz ni concesión alguna que lleve esta guerra a un fin juicioso. Exigen nada menos que la rendición absoluta de nuestra nación, lo que nos condenaría a una existencia de nuevo sometidos a la tiranía imperialista. Si es ese su objetivo, nuestra respuesta solo puede ser una: no desistiremos."
 siam.18.a: "¡[ROOT.GetNameDefCap] prevalece!"
 siam.19.t: "[SIA.GetName] exige la restitución de territorios"
 siam.19.desc: "Envalentonados por la ola nacionalista y nuestra aparente debilidad, quienes gobiernan [SIA.GetName] exigen que se les devuelvan los territorios que consideran esenciales para su Estado. Es evidente que están queriendo abarcar más de la cuenta, pero el territorio que reivindican como suyo no necesariamente merece una guerra en estos tiempos en que la situación internacional parece abocada al desastre."
 siam.19.a: "No vale la pena entrar en conflicto."
 siam.19.b: "¡Rayos!"
 siam.20.t: "[FROM.GetName] cede los territorios"
 siam.20.desc: "[FROM.GetName] ha decidido devolvernos nuestros territorios. Poca relevancia tiene si lo hacen porque reconocen nuestra soberanía sobre estos o porque otras potencias los han puesto en jaque. No es por ello menos justa nuestra causa."
 siam.20.a: "¡Gran día para nuestra nación!"
 siam.21.t: "[FROM.GetName] no cede los territorios"
 siam.21.desc: "[FROM.GetName] rechaza nuestra justa petición. Imperialistas como son, se aferran al siglo pasado como a un clavo ardiendo y son incapaces de reconocer que el momento de gloria de las que se dicen \"grandes naciones\" quedó ya atrás."
 siam.21.a: "Se lo vamos a dejar claro."
 SIA_sent_bureaucrats_to_us: "Nos han enviado a sus burócratas a que los formemos."
 SIA_tied_their_currency_to_ours: "Han vinculado su divisa a la nuestra."
 SIA_sent_started_cooperative_with_us: "Han empezado a cooperar con nosotros."
 siam.22.t: "Enviar burócratas de [SIA.GetName] a otros países"
 siam.22.desc: "Nuestros burócratas carecen de formación en economía moderna, una desventaja que lastra el desarrollo nacional. Por suerte, no son pocos los países con sistemas burocráticos modernos y estables donde podrían adquirir experiencia sin importar necesariamente su modelo de gobierno."
 siam.22.a: "Enviémoslos a [ENG.GetName]."
 siam.22.b: "Enviémoslos a [JAP.GetName]."
 siam.23.t: "Ley de estabilización del bat"
 siam.23.desc: "Para lograr la solidez comercial y económica que [ROOT.GetName] tiene por objetivo, el bat no puede seguir a la deriva. Como bien ponen de manifiesto nuestros funcionarios, la estabilidad monetaria requiere de un punto de apoyo externo inamovible, ligado a una divisa cuya vigencia histórica sirva de garantía a comerciantes, acreedores y socios. Nos hallamos ante una decisión que no solo es de carácter técnico, pues de ella dependerán nuestras tendencias comerciales, el cariz de nuestro desarrollo y la influencia extranjera sobre la economía [SIA.GetAdjective]."
 siam.23.a: "Lo vincularemos a la libra esterlina."
 siam.23.b: "Lo vincularemos al yen."
 siam.24.t: "Cooperativa de Desarrollo [SIA.GetAdjective]"
 siam.24.desc: "La Cooperativa de Desarrollo [SIA.GetAdjective] ha brindado al Estado una herramienta de fomento nacional que este aún no tenía, pero sigue faltando capital nacional que supla nuestras ambiciones. Sin financiación externa, las propuestas ferroviarias, industriales y eléctricas son inviables dentro de plazos realistas. Se nos plantean ahora dos posibilidades: con capital [ENG.GetAdjective], accederíamos a mercados ya asentados, empresas de gran recorrido y el prestigio financiero de Londres. En cambio, la inversión [JAP.GetAdjective] acarrearía una asociación industrial más profunda con una potencia asiática en ciernes deseosa de ampliar su influencia. En ambos casos veríamos acelerado el desarrollo, aunque este jamás irá exento de obligaciones."
 siam.24.a: "Recurramos a la inversión de [ENG.GetName]."
 siam.24.b: "Recurramos a la inversión de [JAP.GetName]."
 siam.25.t: "Fallece Prajadhipok"
 siam.25.desc: "Ha muerto el rey Prajadhipok. El monarca, cuyo nombre honraba el recuerdo de aquel antiguo orden que sobrevivió a años de exilio y turbulencias, trasciende los asuntos mundanos para quedar inmortalizado en la historia. A ojos de algunos, su defunción pone punto y final al malestar que arrastra el país desde que cayera la monarquía absoluta y, sin embargo, la causa que este rey llegó a encarnar no perece con él. El trono prevalece, la dinastía se perpetúa y ese afán por devolver a [ROOT.GetName] la dignidad y estabilidad debe continuar ahora de la mano del joven rey Ananda."
 siam.25.a: "Que Su Majestad nos guarde desde los cielos."
 siam.27.t: "La forja de un rey"
 siam.27.desc: "El rey Ananda reside en [SWI.GetName], apartado del reino que llegada la hora deberá encabezar. Esa distancia, no obstante, no tiene por qué eximirlo de nuestra influencia. Bastará con escoger a sus docentes, instruir a sus súbditos e inculcarle ciertos hábitos para adecuar su mente al futuro que deseamos para [ROOT.GetNameDef]. Que su regreso sea como soldado, como sabio o como algo más depende, y no poco, de los estudios que se le impongan hoy.\n\nY es que, ¿qué es en verdad un rey, sino una extensión de su mismo reino?"
 siam.27.a: "Se le infundirá la curiosidad intelectual."
 siam.27.b: "Que reciba formación en disciplinas militares."
 siam.27.c: "Administración y logística, esos han de ser sus intereses."
 siam.27.d: "La industria y el desarrollo vertebrarán su educación."
 siam.28.t: "La coronación del rey Ananda"
 siam.28.desc: "Los largos años de regencia tocan ya a su esperado final. En Bangkok, ante príncipes, monjes, ministros y funcionarios del Estado, Ananda asciende al trono por derecho propio y recibe los honores que todo rey Chakri merece. Estas ceremonias imponen continuidad donde hubo protestas, y orden sacro donde hubo conflicto. Para el reino, esta coronación no es una puesta en escena sin más, sino una declaración de que la corona prevalece, que no habrá exilio ni conflicto civil capaces de hundir este reino y que amanece una nueva era en [ROOT.GetNameDef]."
 siam.28.a: "Larga vida al rey."
 siam.29.t: "Estudios de tanques convencionales"
 siam.29.desc: "El tanque convencional sigue dominando a fecha de hoy el campo de batalla en todos sus aspectos. Aprendamos, pues, de los mejores para erigir una poderosa división de tanques."
 siam.29.a: "Aprenderemos de los alemanes."
 siam.29.b: "Aprenderemos de los estadounidenses."
 siam.29.c: "Aprenderemos de los británicos."
 siam.31.t: "Provisión de submarinos"
 siam.31.desc: "La expansión de la armada requiere de una reserva de submarinos, y debemos decidir de dónde sacar nuestras embarcaciones. Tanto [ENG.GetNameDef] como [JAP.GetNameDef] han hecho ofertas, pero la elección que hagamos tendrá implicaciones más allá de los astilleros."
 siam.31.a: "Los submarinos [ENG.GetAdjective] nos servirán."
 siam.31.b: "Construiremos nuestra reserva de submarinos en torno a los diseños [JAP.GetAdjective]."
 siam.32.t: "Provisión de barcos para la defensa costera"
 siam.32.desc: "Nuestras aguas costeras requieren buques de defensa competentes, por lo que debemos elegir a nuestro proveedor. Tanto [ENG.GetNameDef] como [JAP.GetNameDef] están preparados para cumplir con su cometido: la decisión influirá tanto en nuestra flota como en nuestras relaciones exteriores."
 siam.32.a: "Contaremos con buques [ENG.GetAdjective] para nuestra defensa costera."
 siam.32.b: "Contaremos con buques [JAP.GetAdjective] para nuestra defensa costera."
 siam.33.t: "Venta del astillero de Bangkok"
 siam.33.desc: "La venta del astillero de Bangkok ha concluido y el fruto de la misma ya ha engrosado las arcas del gobierno, que deberá decidir cuál es el mejor destino para estos fondos: aliviar la carga financiera de los ciudadanos de a pie, acelerar las ambiciosas mejoras técnicas de la nación o apuntalar la confianza en el futuro del país."
 siam.33.a: "Reduciremos la presión fiscal sobre nuestro pueblo."
 siam.33.b: "Destinaremos los fondos a la investigación naval."
 siam.33.c: "Utilizaremos el inesperado beneficio para apuntalar la nación."
 siam.34.t: "Exigencias [FROM.GetAdjective] en nuestras costas"
 siam.34.desc: "[ROOT.GetNameDef] soporta ahora un asedio blando a manos de fuerzas [FROM.GetAdjective], y sus diplomáticos hablan con el convencimiento de quienes dan ya por zanjada la cuestión. Prometen orden y estabilidad, bazas habituales del opresor con piel de cordero, ya que será obediencia lo que pretendan una vez aquí. Podemos someternos y mantener parte de nuestro Estado, si bien disminuido; adherirnos a su facción a fin de conservar cierta libertad de maniobra, o bien responder a esta presión con disidencia manifiesta y ordenar al invasor que abandone nuestras costas."
 siam.34.a: "Nos sumaremos a su facción para que nuestro gobierno siga en pie."
 siam.34.b: "Los queremos fuera de nuestras costas."
 siam.35.t: "[JAP.GetNameDefCap] exige que imprimamos más dinero"
 siam.35.desc: "[JAP.GetNameDefCap] ha dejado claras sus expectativas: debemos aumentar la oferta monetaria para atender sus demandas económicas. La carga recaerá sobre nuestro propio pueblo mediante el aumento de los precios, mientras que la industria [JAP.GetAdjective] se quedará con los beneficios. Tenemos poco margen para negarnos."
 siam.35.a: "Cumpliremos con las demandas de [JAP.GetNameDef]."
 siam.36.t: "[SIA.GetNameDefCap] exige el pago de la deuda"
 siam.36.desc: "[SIA.GetNameDefCap] nos ha exigido formalmente el pago de los gastos ocasionados por el acuerdo de emisión de dinero que les obligamos a llevar a cabo. El acuerdo nos vino bien, pero la factura ya ha vencido."
 siam.36.a: "Habrá que hacer frente a la deuda y comenzar a pagarla."
 siam.37.t: "[JAP.GetNameDefCap] se aviene a pagar nuestras deudas"
 siam.37.desc: "Tras nuestras peticiones, [JAP.GetNameDef] ha accedido a comenzar a reembolsar los costes económicos del acuerdo de impresión de dinero. Este pago no compensará por completo la carga impuesta a nuestro pueblo, pero supondrá cierto alivio para nuestro erario público."
 siam.37.a: "Es un acuerdo justo. Nuestra economía se recuperará."
 siam.38.t: "[SIA.GetName] pide una rendición digna"
 siam.38.desc: "El gobierno [SIA.GetAdjective] llama al diálogo entre nuestras naciones. Sus ministros admiten lo que nuestra artillería ya hacía constar: que en esta contienda la iniciativa la ostenta [ROOT.GetNameDef]. Podemos aceptar su rendición y obligarlos a obedecer, imponer la autoridad de nuestra facción y que su gobierno sirva a nuestra causa, o bien negarnos en rotundo a hacer concesiones y seguir con esta campaña hasta invadir Siam por completo."
 siam.38.a: "Aceptamos su rendición."
 siam.38.b: "No. Será la fuerza la que dictamine el fin del conflicto."
 siam.39.t: "El gobierno [FROM.GetAdjective] acepta nuestra rendición"
 siam.39.desc: "[FROM.GetLeader] ha decidido honrar nuestra capitulación. No irán a más los estragos en [ROOT.GetNameDef] por ahora, aunque será a costa de una dolorosa humillación. El ejército tiene ya órdenes de replegarse y el gobierno prevalecerá, aunque sojuzgado por una potencia mayor. Nuestro Estado sigue a flote, si bien sacrificamos por ello su orgullo y autonomía."
 siam.39.a: "Padeceremos cuanto sea necesario."
 siam.40.t: "El gobierno [FROM.GetAdjective] se niega a dialogar"
 siam.40.desc: "[FROM.GetLeader] ha hecho oídos sordos a toda instancia procedente de Bangkok. No hay sometimiento que le satisfaga, ni acuerdo aceptable. El enemigo pretende zanjar este conflicto mediante conquista total, por lo que la resistencia es la única opción viable para [ROOT.GetNameDef]. Si se niegan a convenir su salida de nuestras costas, habrá que expulsarlos por la fuerza."
 siam.40.a: "Lucharemos, entonces."
 siam.41.t: "[FROM.GetNameDefCap] envía funcionarios a estudiar nuestros métodos"
 siam.41.desc: "Una delegación de funcionarios [FROM.GetAdjective] ha llegado para observar y estudiar nuestras prácticas administrativas y de investigación. Parece que [FROM.GetNameDef] quiere modernizar su burocracia recurriendo a expertos extranjeros y ha elegido a [ROOT.GetNameDef] como modelo. La visita es un reconocimiento implícito de nuestros métodos y una oportunidad de estrechar lazos con otro gobierno."
 siam.41.a: "Damos la bienvenida a su delegación."
 siam.42.t: "[FROM.GetNameDefCap] vincula su moneda a la nuestra"
 siam.42.desc: "[FROM.GetNameDefCap] ha decidido vincular su moneda a la nuestra de manera oficial. Esa decisión acerca a [FROM.GetNameDef] a nuestra órbita económica y denota un signo de confianza en la estabilidad de nuestras instituciones financieras. El comercio entre nuestras naciones debería ser más predecible, y a los comerciantes [FROM.GetAdjective] les resultará más fácil hacer negocios con la nuestra."
 siam.42.a: "Un gran paso para nuestras relaciones comerciales."
 siam.43.t: "[FROM.GetNameDefCap] pide inversión en desarrollo"
 siam.43.desc: "[FROM.GetNameDefCap] ha cursado una invitación para que nuestros ingenieros y especialistas colaboren en el desarrollo de su nación. La cooperación ofrece a nuestras industrias un punto de apoyo en la región y refuerza los lazos económicos entre nuestros gobiernos. Se trata de una propuesta modesta, pero que puede reportar pingües beneficios con el tiempo."
 siam.43.a: "Siempre es un placer ayudar."
 siam.44.t: "[FROM.GetNameDefCap] ha formalizado un pedido de submarinos"
 siam.44.desc: "[FROM.GetNameDefCap] ha hecho un pedido de submarinos construidos según nuestros diseños. La venta representa un importante voto de confianza en nuestra industria naval y ampliará la influencia [FROM.GetAdjective] en las aguas del Sudeste Asiático."
 siam.44.a: "Un pedido muy bienvenido para nuestros astilleros."
 SIA_purchased_submarines_from_us: "Nos han comprado submarinos."
 siam.45.t: "[FROM.GetNameDefCap] propone una coalición"
 siam.45.desc: "Una delegación de [FROM.GetName] ha llegado con una propuesta de [FROM.GetLeader]. Sostienen que nuestras particulares alianzas persiguen ahora los mismos objetivos generales, pero que mantienen divididos a hombres, material e influencia diplomática entre mandos contrapuestos.\n\nAl combinar nuestras fuerzas con las suyas crearíamos un bloque más fuerte, capaz de coordinar la estrategia en un frente más amplio. Un acuerdo así fortalecería nuestra causa común, aunque también nos obligaría a aceptar la influencia [FROM.GetAdjective] sobre la futura dirección de la alianza."
 siam.45.a: "Se hace necesario un frente unido."
 siam.45.b: "Nuestra alianza sigue siendo nuestra."
 siam.46.t: "[FROM.GetNameDefCap] acepta la confluencia"
 siam.46.desc: "[FROM.GetLeader] ha aceptado nuestra propuesta de hacer confluir nuestras alianzas en una única coalición. Lo que antes eran mandos y canales diplomáticos separados se reunirán ahora en una sola estructura, lo que permitirá a nuestros gobiernos coordinar los planes de guerra, los acuerdos de suministro y la política exterior con mucha mayor claridad.\n\nEl acuerdo no está exento de complicaciones, pero ha prevalecido la necesidad de unidad."
 siam.46.a: "¡Juntos seremos fuertes!"
 siam.47.t: "[FROM.GetNameDefCap] rechaza la fusión"
 siam.47.desc: "[FROM.GetLeader] ha rechazado nuestra propuesta de unificar nuestras alianzas. Su gobierno afirma que la cooperación puede continuar cuando los intereses coincidan, pero que no situarán su alianza dentro de una coalición más amplia liderada desde [ROOT.Capital.GetCapitalVictoryPointName].\n\nPor ahora, la división entre nuestros bloques se mantiene. Debemos aspirar a conseguir nuestros objetivos sin dar por sentado su pleno compromiso."
 siam.47.a: "Entonces, continuemos en solitario."
 siam.48.t: "[SIA.GetName] pide la ayuda [JAP.GetAdjective]"
 siam.48.desc: "[SIA.GetNameDefCap] ha solicitado formalmente ayuda militar contra las fuerzas que invaden su país. A cambio, el gobierno [SIA.GetAdjective] está dispuesto a conceder a las empresas [JAP.GetAdjective] acceso privilegiado a recursos estratégicos, infraestructura y derechos comerciales.\n\nApoyar a [SIA.GetName] expandiría nuestra influencia en el Sudeste Asiático y permitiría hacernos con materiales valiosos para el Imperio, aunque podría enredarnos aún más en los conflictos regionales."
 siam.48.a: "Aceptamos su propuesta."
 siam.48.b: "[JAP.GetName] no puede dar recursos."
 siam.49.t: "[JAP.GetName] acepta nuestra petición"
 siam.49.desc: "[JAP.GetNameDefCap] ha aceptado apoyar a [ROOT.GetNameDef] en su conflicto. Pronto empezarán a llegar asesores, equipo y suministros [JAP.GetAdjective], y por otro lado se han realizado concesiones económicas a empresas [JAP.GetAdjective] tal como se establece en el acuerdo.\n\nAunque el gabinete celebra la supervivencia de la nación, muchos se preguntan para sus adentros a cuánta independencia se ha renunciado para obtener este apoyo."
 siam.49.a: "Hemos conseguido un aliado."
 SIA_japan_aid_request.4.t: "[JAP.GetName] rechaza nuestra petición"
 SIA_japan_aid_request.4.desc: "El gobierno de [JAP.GetNameDef] ha rechazado nuestra petición de ayuda militar. Tokio afirma que el Imperio no puede destinar soldados y material a nuestra lucha en este momento.\n\nSin ayuda extranjera, [ROOT.GetNameDef] debe depender ahora de su propia fuerza para sobrevivir a la invasión."
 SIA_japan_aid_request.4.a: "Entonces estamos solos."
 siam_adc.1.t: "[FROM.GetNameDefCap] exige la liberación de [?var:SIA_adc_demand_country_to_be_released.GetNameDef]"
 siam_adc.1.desc: "En un telegrama formal procedente de [FROM.GetNameDef], [FROM.GetLeader] condena nuestra ocupación sostenida de países asiáticos, tildándola de atentado inadmisible contra su derecho a la autodeterminación. En el mensaje se estipula que Asia no es un trofeo que se pueda repartir ni administrar al antojo de potencias extranjeras y se nos exige la retirada inmediata de fuerzas con el fin de reinstaurar un gobierno independiente en [?var:SIA_adc_demand_country_to_be_released.GetNameDef].\n\nEl mandato es inequívoco y [FROM.GetNameDef] espera que lo acatemos. De lo contrario, se interpretará nuestra negativa como un agravio deliberado a su nación."
 siam_adc.1.a: "Los liberaremos."
 siam_adc.1.b: "No cejaremos en nuestro empeño de ocupar esos territorios."
 siam_adc.2.t: "[FROM.GetNameDefCap] se ofrece a devolvernos la independencia"
 siam_adc.2.desc: "Tras aceptar [FROM.GetNameDef] las exigencias [SIA.GetAdjective] con respecto al porvenir de [ROOT.GetNameDef], [FROM.GetLeader] ahora nos plantea un dilema crucial: la administración invasora se dispone ya a retirarse y reconocer un gobierno [ROOT.GetAdjective] soberano, si es que optamos de nuevo por la autonomía.\n\nLa independencia conlleva dignidad y libertad de acción, pero recaerá sobre nosotros mismos la tarea de reconstruir el Estado sin el amparo de [FROM.GetNameDef]. Permanecer bajo su protección no es tan digno, pero sí más práctico, ya que nos podría evitar conflagraciones típicas de estos tiempos turbulentos."
 siam_adc.2.a: "La nuestra será una nación libre."
 siam_adc.2.b: "Permaneceremos al amparo [FROM.GetAdjective]."
 siam_adc.3.t: "[?var:SIA_tag_that_was_released_due_to_sia_pressure.GetName] acepta la independencia"
 siam_adc.3.desc: "El gobierno de [?var:SIA_tag_that_was_released_due_to_sia_pressure.GetNameDef] se decanta por la independencia. La administración invasora está ya en proceso de disolución, y [var:SIA_tag_that_was_released_due_to_sia_pressure.GetNameDef] se apresta a ocupar de nuevo su lugar entre las naciones soberanas del mundo."
 siam_adc.3.a: "¿Qué les deparará el futuro?"
 siam_adc.4.t: "[FROM.GetNameDefCap] rechaza la independencia"
 siam_adc.4.desc: "Aun ante la oportunidad de recuperar la libertad, el gobierno de [FROM.GetNameDef] ha preferido aplazar su independencia inmediata. Sus ministros alegan que el Estado no está preparado aún para hacerse cargo de una soberanía total, con los escollos que comporta, y prefiere atenerse al statu quo."
 siam_adc.4.a: "Se mantiene el acuerdo, pues."
 siam_adc.5.t: "[FROM.GetNameDefCap] rechaza nuestras exigencias"
 siam_adc.5.desc: "[FROM.GetName] ha subrayado que lo que exigimos es, cuando menos, irrisorio. Con un ejército tan exiguo como el nuestro, consideran que no estamos en condiciones de promover un cambio."
 siam_adc.5.a: "Habrá que sacarlos de su error."
 siam_dem_event_count: "El ejército planea una campaña de desprestigio dada nuestra pasividad"
 siam_dem.2.t: "El ejército discrepa"
 siam_dem.2.desc: "En una reunión privada de ministros y altos cargos militares, un portavoz del ejército ha condenado tajantemente la iniciativa del dosier amarillo. Acusa a sus autores de hacer promesas poco realistas en materia de gobernabilidad estatal, redistribución y compromiso social, a la vez que descuidan la disciplina, la propiedad y demás aspectos que irían en menoscabo de los oficiales militares y los sectores rurales. A su entender, [ROOT.GetNameDef] no se puede reinventar a través de teorías sin fundamento práctico en un mundo que se vuelve más peligroso a cada mes que pasa."
 siam_dem.2.a: "El ejército ha expresado su parecer."
 siam_dem.3.t: "Rechazo en público"
 siam_dem.3.desc: "El debate ha trascendido la sala de conferencias. Un periódico que, por todos es sabido, sirve al ejército de altavoz mediático ha estampado una crítica en firme del dosier amarillo, tachándola de ideología importada bajo una máscara de fraseología patriótica. Sus redactores advierten que la propuesta antepone los intereses de clase a la unidad nacional, dinamita la confianza en instituciones bien consolidadas e infunde expectativas contenciosas en el proletariado y el campesinado. Apenas llegada la tarde, el artículo se ha hecho eco ya en los cuarteles, despachos y salones de té, y lo que empezó siendo una controversia a puerta cerrada se ha tornado en una polémica pública."
 siam_dem.3.a: "El disenso se extiende."
 siam_dem.4.t: "Phibun condena el dosier"
 siam_dem.4.desc: "Phibun se ha sumado a la controversia con una rotundez que no deja lugar a ambigüedades. Ante partidarios y oficiales, ha reprochado al dosier amarillo su carácter comunista en esencia, por mucho que lo adornen sus defensores con palabrería. En su diatriba, explica que todo programa que favorezca al Estado sobre la propiedad, prometa una transformación social de gran calado e instigue a la sublevación de las clases bajas pretende inocular el veneno rojo en [ROOT.GetNameDef], aunque sea cambiándole el nombre."
 siam_dem.4.a: "Claridad no le ha faltado."
 siam_dem.5.t: "Debe formarse un gobierno"
 siam_dem.5.desc: "El antiguo régimen ha caído y el Seri Thai sale triunfante. Pero vencer y gobernar son cosas bien distintas, y la coalición que se formó contra Phibun está lejos de ponerse de acuerdo sobre quién debe sucederle. En los pasillos del poder se barajan tres nombres: Pridi Banomyong, que representa la consciencia de la resistencia; Khuang Aphaiwong, un hombre tan apacible que no ofende a nadie; y el general Phin Choonhavan, cuyos oficiales están a la espera de recibir lo que les corresponde. Quienquiera que elijamos ahora determinará cómo será la incipiente paz."
 siam_dem.5.a: "Pridi Banomyong será quien lidere. La resistencia se lo ha ganado."
 siam_dem.5.b: "Khuang Aphaiwong, una figura aceptada por todas las facciones."
 siam_dem.5.c: "El general Phin Choonhavan. El ejército ostentará su lugar."
 ###################
 #### AUSTRALIA ####
 ###################
 AST_election_events.1.t.a: "¡Victoria del PAU!"
 AST_election_events.1.t.b: "¡Victoria laborista!"
 AST_election_events.1.desc.a: "Ha finalizado el recuento de papeletas, y el Partido por una Australia Unida ha ganado estos comicios.\n\nEl PAU se someterá a un breve periodo de formación gubernamental y, a continuación, dedicará los próximos tres años a demostrar que la ciudadanía ha hecho bien en depositar su confianza en sus dignatarios."
 AST_election_events.1.desc.b: "Ha finalizado el recuento de papeletas, y el Partido Laborista Australiano ha ganado estos comicios.\n\nLos laboristas se someterán a un breve periodo de formación gubernamental y, a continuación, dedicarán los próximos tres años a demostrar que la ciudadanía ha hecho bien en depositar su confianza en sus dignatarios."
 AST_election_events.1.a: "El pueblo ha hablado."
 AST_election_events.2.t: "A medio camino de las elecciones federales"
 AST_election_events.2.desc: "El $AST_democratic_party_long$ ha dirigido [AST.GetName] desde 1931, sacando a la nación de la Gran Depresión y alejándola del sentir antidemocrático. Gracias a un liderazgo estable, a sus tendencias conservadoras y a su lealtad a Gran Bretaña, el PAU ha reforzado su apoyo y hace cada vez más probable otro mandato. Sin embargo, aún hay otro partido que tiene algo que decir al respecto.\n\nAun recuperándose de la moción de censura que le apartó del poder en 1931, el $AST_labor_party_long$ está empezando a recuperarse. Al haber quedado silenciadas las voces comunistas, la clase obrera busca ahora otra luz que la guíe. En su misión de representar a todos los ciudadanos, el PLA ha adoptado una perspectiva diferente sobre el imperialismo y la lealtad de Australia al Imperio. Las necesidades nacionales deben ser lo primero, y los intereses extranjeros ya no deben tener prioridad.\n\nQueda un año y medio para las próximas elecciones federales. Si el PAU pretende asegurarse otra victoria, sus dirigentes deberán acelerar las reformas para conservar el apoyo de la opinión pública. De lo contrario, la campaña del PLA podría volver a restablecer su prestigio."
 AST_election_events.2.a: "El PAU promulgará sus últimas reformas."
 AST_election_events.2.b: "Una gira de campaña por Australia aumentará los apoyos al PLA."
 AST_election_events.3.t: "$AST_election_season_cat$"
 AST_election_events.3.desc: "$AST_election_season_cat_desc$"
 AST_election_events.3.a: "Comienza."
 AST_diplomatic_events.1.t: "Pacto de no agresión con Australia"
 AST_diplomatic_events.1.desc: "A raíz de sus nuevos planteamientos diplomáticos, el gobierno australiano tiene interés en firmar pactos de no agresión con diversas naciones asiáticas selectas, y la nuestra es una. A nuestro criterio queda juzgar si esa intentona de evitar guerras pone de relieve lo rematadamente ilusos que son los oficiales australianos o si responde más bien a una candidez honorable.\n\n¿Deseamos firmar un pacto de no agresión con [AST.GetName]?"
 AST_diplomatic_events.1.a: "No, ni por asomo."
 AST_diplomatic_events.1.b: "Claro, firmamos."
 AST_diplomatic_events.2.t: "Reticencia al Acuerdo del Pacífico"
 AST_diplomatic_events.2.desc: "La delegación que enviamos a [FROM.GetNameDef] nos telegrafía la respuesta de la nación al pacto de no agresión que proponemos. Éramos ya conscientes de que la iniciativa se podía percibir como utópica, por lo que tampoco es que nos sorprenda la negativa de [FROM.GetLeader]."
 AST_diplomatic_events.2.a: "No se dirá, al menos, que nuestras intenciones no eran honorables."
 AST_diplomatic_events.3.t: "Larga vida al Acuerdo del Pacífico"
 AST_diplomatic_events.3.desc: "La delegación que enviamos a [FROM.GetNameDef] nos telegrafía la respuesta de la nación al pacto de no agresión que proponemos. Para nuestro gran regocijo, [FROM.GetLeader] agradece la iniciativa y accede a oficializar el acuerdo."
 AST_diplomatic_events.3.a: "¡Espléndido!"
 AST_diplomatic_events.4.t: "Australia se ofrece a gobernar Singapur"
 AST_diplomatic_events.4.desc: "No han sido pocas las ocasiones en que [AST.GetNameDefCap] ha puesto en tela de juicio la Estrategia Singapur y su practicidad. La administración australiana duda de que podamos acudir en ayuda de la isla si llegara a estallar la guerra en el Pacífico. Dejar la defensa naval en manos de [AST.GetName] supondría un desahogo para las fuerzas navales británicas, pero esa misma presión se trasladaría a las australianas.\n\n¿Es sensato confiar en que, bajo gestión australiana, nuestros súbditos y territorios en el Pacífico estarán mejor defendidos que si Singapur siguiera siendo nuestra?"
 AST_diplomatic_events.4.a: "Es sensato, sí."
 AST_diplomatic_events.4.b: "No vamos a renunciar a Singapur."
 AST_diplomatic_events.5.t: "Gran Bretaña accede"
 AST_diplomatic_events.5.desc: "El gobierno británico ha accedido a dejar Singapur bajo el control de Australia. Llega así a su fin la anticuada Estrategia Singapur, y la defensa de estas aguas correrá ahora de nuestra cuenta."
 AST_diplomatic_events.5.a: "¡La estrategia ahora es otra!"
 AST_diplomatic_events.5.a.tt: "§YSingapur§!:\n  Controlado por §YAustralia§!.\n  Es propiedad de §YAustralia§!.\n§YIsla de Navidad§!:\n  Controlada por §YAustralia§!.\n  Es propiedad de §YAustralia§!.\n§YIslas Cocos§!:\n  Controladas por §YAustralia§!.\n  Son propiedad de §YAustralia§!."
 AST_diplomatic_events.6.t: "Gran Bretaña rechaza nuestra petición"
 AST_diplomatic_events.6.desc: "Gran Bretaña se niega a ceder Singapur a la autoridad australiana. Prefieren conservar el statu quo."
 AST_diplomatic_events.6.a: "Más vale que la Estrategia Singapur dé resultado."
 AST_diplomatic_events.7.t: "[AST.GetName] nos pide ayuda"
 AST_diplomatic_events.7.desc: "A fin de fortalecer a sus ejércitos, [AST.GetNameDefCap] se servirá del equipo que envíen sus aliados, y su gobierno nos pide ayuda para gestionar el tráfico de dichas mercancías. ¿Podemos renunciar a algún que otro convoy de los que tanta falta hacen en [AST.GetName]?"
 AST_diplomatic_events.7.a: "Podemos."
 AST_diplomatic_events.7.b: "No podemos."
 AST_diplomatic_events.8.t: "[USA.GetName] se presta a contribuir"
 AST_diplomatic_events.8.desc: "[USA.GetNameDefCap] está dispuesta a cedernos varios convoyes que agilizarán la dotación de [AST.GetName]."
 AST_diplomatic_events.8.a: "¡Y bien útiles que serán!"
 AST_diplomatic_events.9.t: "[USA.GetName] nos transmite su negativa"
 AST_diplomatic_events.9.desc: "[USA.GetNameDefCap] no tiene convoyes que le sobren para contribuir al aprovisionamiento de [AST.GetName]."
 AST_diplomatic_events.9.a: "Tendremos que bastarnos de nuestros propios medios."
 AST_diplomatic_events.10.t: "Una alianza de cara a tiempos de guerra"
 AST_diplomatic_events.10.desc: "[AST.GetNameDefCap] tiene en gran estima su alianza con [USA.GetNameDef], y por ello pide ahora su formalización mediante una coalición internacional de protección mutua. Al unir fuerzas de esta manera, las naciones se auxiliarían mutuamente en conflictos presentes y futuros."
 AST_diplomatic_events.10.a: "Debemos aceptar."
 AST_diplomatic_events.10.b: "[USA.GetNameDefCap] será más fuerte si no nos lastran."
 AST_diplomatic_events.11.t: "Una alianza de cara a tiempos de guerra"
 AST_diplomatic_events.11.desc: "[USA.GetNameDefCap] ve la coalición con buenos ojos. Nace así esta nueva entidad, [AST.GetFactionName], en virtud de la cual [AST.GetName] y [USA.GetName] se comprometen a auxiliarse en conflictos presentes y futuros."
 AST_diplomatic_events.11.a: "Todo enemigo habrá de temernos."
 AST_diplomatic_events.12.t: "La alianza bélica no cuaja"
 AST_diplomatic_events.12.desc: "[USA.GetNameDefCap] declina nuestra propuesta de frente conjunto. En lo que a conflictos respecta, [AST.GetNameDefCap] y [USA.GetName] operarán de forma independiente."
 AST_diplomatic_events.12.a: "Nos tendremos que valer sin ellos."
 AST_diplomatic_events.13.t: "La cláusula sexta"
 AST_diplomatic_events.13.desc: "En pleno proceso mediante el cual las colonias australianas se unirían en una federación, Nueva Zelanda decidió mantenerse al margen. Sin embargo, la Constitución australiana sigue contemplándonos como uno de los posibles estados de la Mancomunidad y permite nuestra admisión.\n\n[AST.GetName] apela hoy a la necesidad de unir fuerzas dada la presente situación mundial, y pide por ello que [NZL.GetName] acepte el amparo de la autoridad australiana. ¿Deberíamos convocar un referéndum?"
 AST_diplomatic_events.13.a: "Así se hará."
 AST_diplomatic_events.13.a.tt: "Se celebrará un referéndum que podría desembocar en la §Ranexión§! de §Y[NZL.GetName]§!."
 AST_diplomatic_events.13.b: "¡Claro que no!"
 AST_diplomatic_events.14.t: "[NZL.GetNameDefCap] pasa a ser un estado australiano."
 AST_diplomatic_events.14.desc: "A resultas del referéndum, [NZL.GetName] se acoge a la cláusula sexta de la Constitución australiana. Como bien han votado los neozelandeses, sus territorios estarán más seguros bajo la protección del gobierno australiano, y por ello entrarán a formar parte de [AST.GetNameDef]."
 AST_diplomatic_events.14.a: "Australia se expande."
 AST_diplomatic_events.15.t: "El pueblo neozelandés se muestra reacio"
 AST_diplomatic_events.15.desc: "A resultas del referéndum, [NZL.GetName] ha decidido no acogerse a la cláusula sexta de la Constitución australiana. [NZL.GetNameDefCap] seguirá siendo una nación independiente."
 AST_diplomatic_events.15.a: "Y Australia no será por ello menos gloriosa."
 AST_diplomatic_events.16.t: "El gobierno de [NZL.GetNameDefCap] se resiste"
 AST_diplomatic_events.16.desc: "A pesar de la insistencia de sus vecinos, [NZL.GetName] se ha negado a decidir mediante referéndum si acogerse a la cláusula 6 de la Constitución australiana. [NZL.GetNameDefCap] seguirá siendo una nación independiente."
 AST_diplomatic_events.16.a: "Y Australia no es por ello menos gloriosa."
 AST_diplomatic_events.17.t: "Asociación con Australia"
 AST_diplomatic_events.17.desc: "El enemigo acecha ya al norte, y no tardaremos en encontrar a sus efectivos desplegados ante nuestras fronteras —o eso enfatizan los políticos australianos—. [AST.GetNameDefCap] nos propone formar un frente común, rindiendo el territorio de [INS.GetName] al control de Australia a poder ser, o al menos permitiendo el acceso a sus tropas."
 AST_diplomatic_events.17.a: "Aceptamos la intervención de las autoridades australianas."
 AST_diplomatic_events.17.a.tt: "§Y[INS.GetNameDefCap]§! se convertirá en §Ytítere§! de §Y[AST.GetNameDefCap]§!."
 AST_diplomatic_events.17.b: "Gozarán de acceso militar."
 AST_diplomatic_events.17.b.tt: "§Y[INS.GetNameDefCap]§! permitirá el §Yacceso militar§! de §Y[AST.GetNameDefCap]§!."
 AST_diplomatic_events.17.c: "No aceptamos bajo ningún concepto."
 AST_diplomatic_events.18.t: "[INS.GetNameDefCap] se somete a la propuesta australiana"
 AST_diplomatic_events.18.desc: "La administración de [INS.GetName] encuentra cabal nuestra petición. Esta unión beneficiará en gran medida las capacidades defensivas de ambas naciones."
 AST_diplomatic_events.18.a: "¡Fantástico!"
 AST_diplomatic_events.19.t: "Negativa de [INS.GetNameDefCap]"
 AST_diplomatic_events.19.desc: "El gobierno de [INS.GetName] rechaza la propuesta. Cada nación se tendrá que defender por sí sola."
 AST_diplomatic_events.19.a: "[AST.GetNameDefCap] no los necesita para salir indemne de cualquier conflicto."
 AST_diplomatic_events.20.t: "Comparecencia ante el gabinete de guerra británico"
 AST_diplomatic_events.20.desc: "[GET_AST_BWC_COUNT][ENG.GetNameDefCap] pide la asistencia del primer ministro australiano a su gabinete de guerra. Dada la desastrosa coyuntura global, en Gran Bretaña urge desarrollar estrategias en común con sus aliados y fomentar la cooperación.\n\nAustralia, no obstante, alberga cierto reparo. ¿Podemos prescindir de la atención del primer ministro mientras atiende a los desvelos británicos con tal de complacerlos?"
 AST_diplomatic_events.20.a: "[AST.GetLeader] partirá rumbo a Gran Bretaña."
 AST_diplomatic_events.20.b: "Lo necesitamos aquí."
 AST_bwc_count_2: "Por segunda vez, [ENG.GetLeader] solicita la presencia de [AST.GetLeader], pues sostiene que nuestra cooperación es lo que determinará el resultado del problema al que nos enfrentamos.\n\n"
 AST_bwc_count_3: "Una vez más, a [AST.GetLeader] se le solicita cruzar el océano para salvaguardar la cooperación de la Mancomunidad. Si dejamos claro nuestro propósito, ya sea colaborar con el resto de miembros u ocuparnos de nuestros propios asuntos, no recibiremos más peticiones de este tipo.\n\n"
 AST_bwc_accept_effect_tt: "§YEfectos tras aceptar asistir 3 veces:§!"
 AST_bwc_accept_tt: "Acepta asistir a §Y[?var:AST_bwc_accept]§!/§Y3§! veces."
 AST_diplomatic_events.22.t: "Contribuciones fructíferas en el gabinete de guerra británico"
 AST_diplomatic_events.22.desc: "A lo largo de este último año, el primer ministro australiano ha asistido con asiduidad al gabinete de guerra británico. Aunque esto a [AST.GetNameDef] le ha supuesto más de un sacrificio, nuestra nación se ve hoy fortalecida gracias a la cooperación militar con nuestros aliados británicos."
 AST_diplomatic_events.22.a: "El coste ha resultado provechoso al final."
 AST_diplomatic_events.23.t: "[ENG.GetLeader] ya no pretende la contribución de Australia a la guerra"
 AST_diplomatic_events.23.desc: "[ENG.GetNameDefCap] ha solicitado en diversas ocasiones la comparecencia del primer ministro australiano ante el gabinete de guerra británico. Sin embargo, y dadas nuestras constantes negativas, [ENG.GetLeader] ha desistido de convocarlo en lo sucesivo."
 AST_diplomatic_events.23.a: "Comprensible."
 AST_diplomatic_events.24.t: "El poder cambia de manos"
 AST_diplomatic_events.24.desc: "El primer ministro de Australia ha tenido una gran influencia en el esfuerzo bélico de la Mancomunidad Británica de Naciones. Durante sus visitas periódicas a Londres, Robert Menzies se ha ganado la confianza de los ministros británicos, mientras que la fe de estos en su propio primer ministro se ha desvanecido. Los ministros han presionado al líder de [ENG.GetNameDef] para que dimita y que así Menzies ocupe su lugar.\n\nAunque en [AST.GetName] pierdan a su primer ministro, cuentan con la lealtad eterna de su mandatario, custodiada por el compatriota australiano que ahora lleva las riendas de Gran Bretaña. La tierra de las antípodas quiere más autogobierno, y Robert Menzies será el primero en defender esa idea."
 AST_diplomatic_events.24.a: "Hay vientos de cambio."
 AST_diplomatic_events.25.t: "Bajo el gobierno de Camberra"
 AST_diplomatic_events.25.desc: "La tensión creciente entre los países del Pacífico es preocupante y, dado que Gran Bretaña está ocupada librando sus propias batallas, difícilmente podremos acudir al rescate de nuestros súbditos —o así lo afirma [AST.GetName]—.\n\nAbogan por reinstaurar una suerte de Mancomunidad Británica de Naciones, en virtud de la cual los Estados del Pacífico y el océano Índico se gestionarían directamente desde Camberra. ¿Damos nuestro beneplácito?"
 AST_diplomatic_events.25.a: "Lo damos. El Pacífico estará mejor defendido con un control centralizado."
 AST_diplomatic_events.25.b: "¡Qué disparate!"
 AST_diplomatic_events.26.t: "Mancomunidad del Pacífico"
 AST_diplomatic_events.26.desc: "[ENG.GetNameDefCap] concuerda: la región del Pacífico saldría beneficiada si su defensa la orquesta una autoridad central. Los territorios británicos del Pacífico quedan supeditados a nuestra autoridad."
 AST_diplomatic_events.26.a: "Las naciones del Pacífico unen fuerzas."
 AST_diplomatic_events.27.t: "Gran Bretaña se opone"
 AST_diplomatic_events.27.desc: "[ENG.GetNameDefCap] discrepa: centralizar la defensa no beneficiaría en nada a los territorios del Pacífico. Las posesiones británicas en la región seguirán supeditadas a su soberanía."
 AST_diplomatic_events.27.a: "Australia prevalecerá igualmente."
 AST_diplomatic_events.28.t: "[ENG.GetLeader] da un portazo"
 AST_diplomatic_events.28.desc: "El desencuentro telegráfico que nuestro primer ministro ha tenido con [ENG.GetLeader] apenas ha fortalecido a Australia, y además ha avivado cierto resentimiento hacia [AST.GetLeader] por parte de la administración británica, motivado por su vehemente hincapié en defensa de los intereses australianos."
 AST_diplomatic_events.28.a: "Australia tendrá que ser garante de su propia protección."
 AST_diplomatic_events.29.t: "Auxilio británico"
 AST_diplomatic_events.29.desc: "A la luz de la insistencia por parte de Australia para que [ENG.GetNameDef] entre en conflicto con [JAP.GetName], los dirigentes británicos nos han asegurado su apoyo en materia de construcción defensiva."
 AST_diplomatic_events.29.a: "Se agradece el respaldo, pero no servirá para evitar la guerra con Japón."
 AST_diplomatic_events.30.t: "Australia reivindica derechos sobre recursos"
 AST_diplomatic_events.30.desc: "Los agresores expansionistas tienen la mirada puesta en Indochina no solo por su territorio, sino también por los recursos que posee. Si las riquezas acaban en manos del enemigo, la guerra se prolongará. En cambio, si acaban en las de Australia, el conflicto podría llegar a su fin —o eso afirma con convicción el gobierno australiano—.\n\n¿Aceptamos cederles derechos sobre recursos de nuestro territorio?"
 AST_diplomatic_events.30.a: "Aceptamos."
 AST_diplomatic_events.30.b: "Esos recursos tampoco son propiedad de [AST.GetName]."
 AST_diplomatic_events.31.t: "[FROM.GetNameDefCap] cede a [AST.GetName] derechos sobre sus recursos"
 AST_diplomatic_events.31.desc: "Los agresores expansionistas tienen la mirada puesta en Indochina no solo por su territorio, sino también por los recursos que posee. Si las riquezas acaban en manos del enemigo, la guerra se prolongará. En cambio, si acaban en las de Australia, el conflicto podría llegar a su fin —o eso afirma con convicción el gobierno australiano—.\n\n[ROOT.OVERLORD.GetNameDefCap] ha aceptado la propuesta."
 AST_diplomatic_events.31.a: "Poco podemos hacer ya."
 AST_diplomatic_events.32.t: "[FROM.GetNameDefCap] cede derechos sobre sus recursos"
 AST_diplomatic_events.32.desc: "[FROM.GetNameDefCap] coincide en que los recursos de Indochina estarían mejor aprovechados por Australia; visto lo cual, nos concede derechos sobre tales recursos."
 AST_diplomatic_events.32.a: "Nos serán útiles, desde luego."
 AST_diplomatic_events.33.t: "[FROM.GetNameDefCap] se reserva los derechos sobre sus recursos"
 AST_diplomatic_events.33.desc: "En [FROM.GetNameDefCap] no creen que los recursos de Indochina estarían mejor aprovechados por Australia; visto lo cual, nos niega derecho alguno sobre tales recursos."
 AST_diplomatic_events.33.a: "Esperemos que no acaben en poder del enemigo."
 AST_diplomatic_events.34.t: "[AST.GetNameDefCap] propone un reparto territorial del Pacífico"
 AST_diplomatic_events.34.desc: "[AST.GetNameDefCap] nos propone un pacto que, aseguran, zanjaría posibles conflictos entre nuestras naciones antes de que llegaran a surgir siquiera. De repartirnos los territorios del Pacífico, podríamos planificar toda expansión venidera evitando interferencias y tiranteces."
 AST_diplomatic_events.34.a: "Parece un pacto razonable."
 AST_diplomatic_events.34.b: "[JAP.GetNameDefCap] no acepta que coarten su expansión"
 AST_diplomatic_events.35.t: "El Pacífico repartido"
 AST_diplomatic_events.35.desc: "[AST.GetNameDefCap] y [JAP.GetNameDefCap] han convenido mutuamente su expansión futura a otros territorios del Pacífico. Esperemos que el acuerdo sirva para evitar conflictos entre las dos potencias."
 AST_diplomatic_events.35.a: "¡No habrá de qué preocuparse!"
 AST_diplomatic_events.36.t: "No habrá reparto previo en el Pacífico"
 AST_diplomatic_events.36.desc: "[JAP.GetNameDefCap] se niega a convenir un reparto previo de los territorios del Pacífico. El gobierno nipón no consiente que se pongan trabas a su expansión."
 AST_diplomatic_events.36.a: "Tampoco Australia lo consentirá."
 AST_diplomatic_events.37.t: "Soberanía delegada"
 AST_diplomatic_events.37.desc: "Por motivos que desconocemos, [AST.GetName] ha nombrado a [JAP.GetNameDef] soberano de territorios que en un principio nos pertenecían a nosotros. Esto solo puede ser fruto de intrigas fatídicas, cuya verdad acabará por traslucir a ojos del mundo entero."
 AST_diplomatic_events.37.a: "A la vista está que no tenemos voz ni voto al respecto."
 AST_diplomatic_events.38.t: "El Pacto de Nauru"
 AST_diplomatic_events.38.desc: "Si, a resultas de la Gran Guerra, diversos territorios alemanes del Pacífico quedaron bajo control australiano, tal vez hoy exista la manera de recuperar uno de ellos: la isla de Nauru.\n\nLos valores de la fuerza política [AST.GetFascistParty] son afines a nuestros intereses, entre los que se cuenta la independencia total de [AST.GetName], aún sometida a los designios de [ENG.GetNameDef]. Puesto que el movimiento apenas tiene voz por el momento, sus representantes nos piden respaldo a fin de acelerar su desarrollo y, una vez ostenten el poder que ansían, se comprometen a devolvernos la isla de Nauru, siempre y cuando les garanticemos su independencia."
 AST_diplomatic_events.38.a: "¡Ese territorio volverá a ser nuestro!"
 AST_diplomatic_events.38.b: "Sus promesas vacías no son de recibo."
 AST_diplomatic_events.39.t: "[GER.GetNameDefCap] acepta el Pacto de Nauru"
 AST_diplomatic_events.39.desc: "[GER.GetNameDefCap] y la fuerza política [AST.GetFascistParty] han convenido un objetivo común: la independencia de [AST.GetName]. Dado que [AST.GetFascistParty] apenas posee poder político real por el momento, [GER.GetNameDef] contribuirá a catalizar su desarrollo, y cuando nuestra influencia sea ya incontestable, cumpliremos lo acordado."
 AST_diplomatic_events.39.a: "¡Espléndido!"
 AST_diplomatic_events.40.t: "El Pacto de Nauru hace aguas"
 AST_diplomatic_events.40.desc: "Alegando no poder dar por veraces promesas que aún no tienen visos de cumplirse, [GER.GetNameDef] se abstendrá de favorecer nuestro ascenso al poder. El Pacto de Nauru se desmorona sin haber llegado a materializarse siquiera, y en [AST.GetFascistParty] tendremos que valernos por nosotros mismos para cumplir esas ambiciones."
 AST_diplomatic_events.40.a: "[AST.GetFascistParty] se bastará sin necesidad de los alemanes."
 AST_diplomatic_events.41.t: "Nauru vuelve a manos alemanas"
 AST_diplomatic_events.41.desc: "Ahora que aferra el poder con ambas manos, la formación política [AST.GetFascistParty] no duda en cumplir lo prometido. Nauru vuelve a ser propiedad de [GER.GetNameDef], y ahora nos corresponde garantizar la independencia de Australia."
 AST_diplomatic_events.41.a: "Y así se hará."
 AST_diplomatic_events.42.t: "[AST.GetFascistParty] falta a su palabra"
 AST_diplomatic_events.42.desc: "Las promesas adolecen de un defecto crucial, y es que se pueden quebrantar. Ahora que al fin han llegado al poder, los dirigentes de la formación política [AST.GetFascistParty] han decidido que Nauru ya no está sobre la mesa de negociación y que, además, se harán con el resto de islas del Pacífico.\n\nEl Pacto de Nauru no nos ha devuelto esos territorios que fueron nuestros. Si queremos enmendarlo, tan solo podremos recurrir a la guerra."
 AST_diplomatic_events.42.a: "Habrá que ver si tal descaro acaba quedando impune."
 AST_diplomatic_events.43.t: "[AST.GetNameDefCap] desea controlar el Sudeste Asiático"
 AST_diplomatic_events.43.desc: "Habida cuenta de sus tendencias expansionistas hacia el norte, [AST.GetName] propone incrementar nuestra influencia conjunta en cuanto a la diplomacia y los conflictos del Sudeste Asiático. Si bien no lo formulan como una exigencia, [AST.GetLeader] da a entender que no consentirá una negativa."
 AST_diplomatic_events.43.a: "Tenemos otros asuntos que atender; tal vez sea lo mejor."
 AST_diplomatic_events.43.b: "La consientan o no, una negativa es lo que van a recibir."
 AST_diplomatic_events.44.t: "Cesión del Sudeste Asiático"
 AST_diplomatic_events.44.desc: "Haciendo gala de buen juicio, [ENG.GetNameDef] accede a transferirnos sus territorios en el Sudeste Asiático. Las fronteras australianas crecen, y con ellas nuestro poder en el mundo, que no tardará en rendirse a nuestra preeminencia."
 AST_diplomatic_events.44.a: "El futuro parece prometedor."
 AST_diplomatic_events.45.t: "No habrá cambios en el Sudeste Asiático"
 AST_diplomatic_events.45.desc: "[ENG.GetNameDefCap] nos ha negado la cesión de sus territorios en el Sudeste Asiático. No por ello vamos a desistir de controlar la región, ya que sus ventajas son palmarias; si la diplomacia no ha dado resultado, aún quedan otras vías para apoderarnos de ella."
 AST_diplomatic_events.45.a: "Así es."
 #AST_diplomatic_events.46.t was removed
 AST_diplomatic_events.47.t: "Cargas compartidas"
 AST_diplomatic_events.47.desc: "[AST.GetName], pese a haberse escindido de la Mancomunidad Británica de Naciones, ofrece cooperación militar a las naciones que la integran. A este respecto, [AST.GetName] afirma que delegar competencias en ellos beneficiaría a [ENG.GetNameDef], cuyo ejército apenas da abasto entre tantos frentes abiertos en distintas partes del mundo."
 AST_diplomatic_events.47.a: "Aceptamos."
 AST_diplomatic_events.47.b: "Nos las arreglaremos solos."
 AST_diplomatic_events.48.t: "Un pacto británico-australiano"
 AST_diplomatic_events.48.desc: "[ENG.GetNameDefCap] ha accedido a firmar un pacto de no agresión que sentará las bases de una futura cooperación militar."
 AST_diplomatic_events.48.a: "Todo un hito en nuestras relaciones."
 AST_diplomatic_events.49.t: "No habrá pacto"
 AST_diplomatic_events.49.desc: "[ENG.GetNameDefCap] ha rehusado a firmar un pacto de no agresión. Esto supone el fracaso del plan de cooperación militar que ambicionábamos para nuestras naciones. En materia de política exterior, tendremos que valernos por nosotros mismos."
 AST_diplomatic_events.49.a: "Así tendrá que ser."
 AST_diplomatic_events.50.t: "La guarnición australiana en el Pacífico"
 AST_diplomatic_events.50.desc: "Si bien al gobierno británico le interesa que el Sudeste Asiático y el Pacífico estén bien protegidos, se trata de una región muy distante del archipiélago británico, como bien argumenta [FROM.GetName]. A cambio de nuestro apoyo logístico, su gobierno se ofrece a administrar la defensa de la región, de manera que podríamos dedicar nuestros recursos a otros frentes."
 AST_diplomatic_events.50.a: "De buen grado recibiremos el apoyo de [FROM.GetName]."
 AST_diplomatic_events.50.b: "Tampoco está tan lejos."
 AST_diplomatic_events.51.t: "Guarnición de [ENG.GetNameDef] en el Pacífico"
 AST_diplomatic_events.51.desc: "[FROM.GetNameDefCap] coincide: es más recomendable que las aguas del Sudeste Asiático las defendamos nosotros. A cambio del combustible que nos suministran los británicos, [ROOT.GetName] destinará recursos a acrecentar su dominio naval en los mares que bañan las costas vecinas."
 AST_diplomatic_events.51.a: "Las aguas serán nuestras."
 AST_diplomatic_events.52.t: "Guarnición australiana en el Pacífico"
 AST_diplomatic_events.52.desc: "[FROM.GetNameDefCap] discrepa: no necesitan ayuda para defender las aguas del Sudeste Asiático. No obstante, ya sea con o sin el beneplácito de los británicos, [ROOT.GetName] destinará recursos a acrecentar su dominio naval en los mares que bañan las costas vecinas."
 AST_diplomatic_events.52.a: "Las aguas serán nuestras."
 AST_diplomatic_events.53.t: "Vichy fuera de África"
 AST_diplomatic_events.53.desc: "[AST.GetName] sospecha que entre los objetivos de [ENG.GetNameDef] se cuenta la caída de la Francia de Vichy o, en su defecto, su cooperación. En base a eso, su gobierno se ofrece a hostigar si es necesario a las colonias francesas en África, hasta que Vichy sucumba. Si bien es posible que la propuesta venga motivada por otros intereses, no se puede negar que nos beneficiaría contar con aliados en la región.\n\nSi damos el visto bueno, [AST.GetName] pondrá en marcha un diálogo con el régimen de Vichy y tratará de acordar la cesión pacífica de sus colonias, cuyo lugar lo ocupará una guarnición australiana."
 AST_diplomatic_events.53.a: "Su respaldo será bien recibido."
 AST_diplomatic_events.53.b: "Nos arriesgamos a que [AST.GetName] utilice ese poder en nuestra contra."
 AST_diplomatic_events.54.t: "Apoyo y gratitud"
 AST_diplomatic_events.54.desc: "[ENG.GetNameDefCap] coincide: la presencia de aliados en África sería de gran ayuda a la Mancomunidad.\n\nNos disponemos a dialogar con la Francia de Vichy con el fin de acordar la cesión pacífica de sus colonias, cuyo lugar lo ocupará una guarnición australiana."
 AST_diplomatic_events.54.a: "Procedamos, pues."
 AST_diplomatic_events.55.t: "Con permiso o sin él"
 AST_diplomatic_events.55.desc: "[ENG.GetNameDefCap] ha desestimado la asistencia de Australia en África, y sus gobernantes se dicen capaces de lidiar por sí solos con la Francia de Vichy. No acallará esto nuestra ambición, claro está.\n\nDe pasar a controlar los territorios africanos del régimen francés, Australia dejaría de ser una subordinada en la Mancomunidad Británica de Naciones para tratar a Gran Bretaña de tú a tú. Tenemos que hacernos con esos territorios pese a la reticencia de [ENG.GetNameDef], aunque tendrá que ser por la fuerza."
 AST_diplomatic_events.55.a: "Nuestros dominios crecerán."
 AST_diplomatic_events.56.t: "[AST.GetName] exige territorios africanos"
 AST_diplomatic_events.56.desc: "En representación de [ENG.GetNameDef], [AST.GetName] nos ha interpelado para exigir que les cedamos nuestros territorios en África.\n\n[ENG.GetNameDefCap] se ha propuesto incrementar su presencia en África; si no nos rendimos a la ocupación australiana, podemos dar por descontado que su próxima tentativa será armas en ristre."
 AST_diplomatic_events.56.a: "Entregaremos los territorios; todo sea por evitar conflictos."
 AST_diplomatic_events.56.b: "Pues con armas los esperaremos."
 AST_diplomatic_events.57.t: "Vichy cede sus territorios africanos"
 AST_diplomatic_events.57.desc: "La Francia de Vichy ha accedido a transferir sus territorios africanos a Australia, que procederá a ocupar la región con una guarnición."
 AST_diplomatic_events.57.a: "¡Seguiremos expandiéndonos por África!"
 AST_diplomatic_events.58.t: "Vichy niega sus territorios a [AST.GetName]"
 AST_diplomatic_events.58.desc: "La Francia de Vichy no nos quiere entregar esos territorios africanos. Sin embargo, lo nuestro no era una petición, sino una exigencia.\n\nNo vamos a renunciar a la región que osan negarnos, aunque haya que tomarlos por la fuerza."
 AST_diplomatic_events.58.a: "Ya sea por la paz o por las armas, [AST.GetName] se expandirá."
 #AST_diplomatic_events.59 was removed
 #AST_diplomatic_events.60 was removed
