 AST_diplomatic_events.62.t: "¿Un pacto antibritánico?"
 AST_diplomatic_events.62.desc: "Diplomáticos de [AST.GetName] nos han hecho llegar una propuesta curiosa: se trata de un pacto antibritánico, en virtud del cual se prestarían a arrebatarles Irlanda del Norte sin necesidad de intervención directa por nuestra parte.\nSi la campaña llegara a buen puerto, a cambio entraríamos a formar parte de su facción y los respaldaríamos en caso de conflicto armado con Gran Bretaña.\nUna unificación con el norte es tentadora cuando menos, pero debemos estudiar con sumo detenimiento si enemistarnos con nuestros vecinos nos hará más mal que bien y, sobre todo, si lograríamos alzarnos con la victoria en caso de conflagración, ya que de lo contrario Irlanda acabaría convertida en una colonia británica más."
 AST_diplomatic_events.62.a: "¡La unificación urge más que nunca! ¡Hay que firmar ese pacto!"
 AST_diplomatic_events.62.b: "El riesgo es desmedido."
 AST_diplomatic_events.63.t: "¡Irlanda nos rechaza!"
 AST_diplomatic_events.63.desc: "Irlanda se ha negado a firmar el pacto antibritánico."
 AST_diplomatic_events.63.a: "Irlanda merece seguir dividida."
 AST_diplomatic_events.64.t: "¡Irlanda acepta!"
 AST_diplomatic_events.64.desc: "Irlanda ha accedido a firmar el pacto antibritánico."
 AST_diplomatic_events.64.a: "¡Ponemos rumbo a Belfast!"
 AST_diplomatic_events.65.t: "[FROM.GetName] proporciona apoyo" ### Support for the Chinese Communists - Sends event from AST to PRC offering support
 AST_diplomatic_events.65.desc: "La creciente influencia del [FROM.GetCommunistParty] en [FROM.GetNameDef] empieza a dar sus frutos: sus representantes han atravesado China para informarnos de que se está movilizando un cuerpo de voluntarios [FROM.GetAdjective] en apoyo a nuestras fuerzas. Además, estos voluntarios traen equipo de repuesto para nuestras tropas."
 AST_diplomatic_events.65.a: "Es un buen comienzo para la cooperación con nuestros camaradas [FROM.GetAdjective]."
 #AST_diplomatic_events.65.b: "They should focus on their own revolution"
 AST_diplomatic_events.66.t: "[FROM.GetName] nos agradece el apoyo" ### Support for the Chinese Communists - They accept
 AST_diplomatic_events.66.desc: "Los representantes de [FROM.GetLeader] han comunicado su agradecimiento por el apoyo de nuestros voluntarios y por el material bélico proporcionado. La amplia experiencia [FROM.GetAdjective] en guerra civil garantiza que estos recursos se utilicen de manera efectiva."
 AST_diplomatic_events.66.a: "Es un gran avance."
 AST_diplomatic_events.67.t: "[FROM.GetName] nos agradece el apoyo" ### Support for the Chinese Communists - They accept
 AST_diplomatic_events.67.desc: "Los representantes de [FROM.GetLeader] han comunicado su agradecimiento por el apoyo de nuestros voluntarios y por el material bélico proporcionado. La amplia experiencia [FROM.GetAdjective] en guerra civil garantiza que estos recursos se utilicen de manera efectiva."
 AST_diplomatic_events.67.a: "Es un gran avance."
 AST_diplomatic_events.68.t: "Exigencias australianas"
 AST_diplomatic_events.68.desc: "Australia no quiere enfrentarse sola a su abrumador enemigo, [JAP.GetNameDef]. Nos presionan para que demos el primer paso y resolvamos el inminente conflicto lo antes posible."
 AST_diplomatic_events.68.a: "Es curioso cómo cambian las cosas."
 AST_diplomatic_events.69.t: "Juntos de nuevo"
 AST_diplomatic_events.69.desc: "El vínculo entre [ENG.GetNameDef] y [AST.GetName] está en entredicho, pero los últimos se han comprometido a potenciarlo hasta que vuelva a recuperar toda su fuerza. En [AST.GetName] cuentan con contactos y aliados dentro del gobierno británico hasta tal punto que sus líderes simplemente no pueden rechazarlos; las naciones pasarán a formar parte de la misma facción otra vez y, de nuevo, las islas británicas y las antípodas trabajarán juntas."
 AST_diplomatic_events.69.a: "Pues que así sea."
 AST_diplomatic_events.71.t: "Australia reclama las islas del Pacífico"
 AST_diplomatic_events.71.desc: "[AST.GetName] ha exigido el control de nuestras islas del Pacífico, afirmando que a [USA.GetNameDef] no le corresponde mandar en el oeste del Pacífico. Las islas pueden ser el precio pequeño que haya que pagar para aplacar la hostilidad australiana, pero habría que pasar por ello. ¿Nos arriesgaremos a provocar a una potencia fascista en alza, aunque tengamos ya las manos llenas?"
 AST_diplomatic_events.71.a: "No lo haremos."
 AST_diplomatic_events.71.b: "Las islas del Pacífico seguirán siendo nuestras."
 AST_diplomatic_events.72.t: "La transferencia de las islas del Pacífico de [USA.GetNameDef]"
 AST_diplomatic_events.72.desc: "Al tener ya las manos llenas, las islas del Pacífico fueron el pequeño precio que pagó [USA.GetNameDef] para calmar la hostilidad australiana. Las islas del Pacífico ahora son nuestras."
 AST_diplomatic_events.72.a: "Excelente."
 AST_diplomatic_events.73.t: "Negativa de [USA.GetNameDef]"
 AST_diplomatic_events.73.desc: "[USA.GetNameDefCap] se ha negado a entregarnos sus islas del Pacífico. Pese a nuestras exigencias y nuestra creciente influencia en el Pacífico, Washington sigue sin estar dispuesta a ceder su control sobre las islas."
 AST_diplomatic_events.73.a: "Las islas quizá no sean nuestras... por ahora."
 AST_diplomatic_events.74.t: "Exigencia australiana de que Filipinas pase a sus manos"
 AST_diplomatic_events.74.desc: "En su ambición por expandir sus territorios, [AST.GetName] ha exigido el control de [PHI.GetNameDef]. En caso de negarnos, [AST.GetName] amenaza con la guerra, considerando que es sencillamente inconcebible que [USA.GetNameDef] conserve territorios dentro de la esfera de influencia de [AST.GetName]."
 AST_diplomatic_events.74.a: "No podemos arriesgarnos a una guerra. Hay que satisfacer sus exigencias."
 AST_diplomatic_events.74.b: "¡Las Filipinas seguirán siendo nuestras!"
 AST_diplomatic_events.75.t: "La transferencia de [PHI.GetNameDef]"
 AST_diplomatic_events.75.desc: "Está claro que el ascenso de [AST.GetName] como potencia fascista empieza a brindarnos ciertos beneficios, ya que las naciones temen nuestra ira. [USA.GetNameDefCap] ha aceptado; [PHI.GetNameDef] es nuestra."
 AST_diplomatic_events.75.a: "Un nuevo orden emerge."
 AST_diplomatic_events.76.t: "Negativa de [USA.GetNameDef]"
 AST_diplomatic_events.76.desc: "[USA.GetNameDefCap] se ha negado a entregarnos [PHI.GetNameDef]. Pese a nuestras exigencias y nuestra creciente influencia en el Pacífico, Washington sigue sin estar dispuesta a ceder su control sobre el territorio."
 AST_diplomatic_events.76.a: "Esto supone la guerra."
 AST_diplomatic_events.78.t: "[AST.GetName] pide garantías frente al gigante"
 AST_diplomatic_events.78.desc: "[AST.GetNameDefCap] comparte con nosotros sus audaces objetivos:\n\n\"La sombra de [USA.GetNameDefCap] se cierne sobre nosotros, amenazando con interferir cada vez que nuestras acciones no se ajusten a sus intereses. Con una potencia mundial de tal magnitud entrometiéndose en los asuntos de Australia y Japón, el este de Asia nunca será nuestro de verdad. Por eso, [AST.GetName] entrará en guerra\".\n\nEl primer ministro [AST.GetLeader] ha dejado muy claras sus intenciones: [AST.GetName] tiene intención de enfrentarse a [USA.GetNameDef] y nos pide ayuda en caso de que los estadounidenses resulten demasiado poderosos para vencerlos por sí solos."
 AST_diplomatic_events.78.a: "Claro, firmemos."
 AST_diplomatic_events.78.b: "[JAP.GetNameDefCap] tiene asuntos internos que atender."
 AST_diplomatic_events.79.t: "[JAP.GetNameDefCap] da garantías a [AST.GetName]"
 AST_diplomatic_events.79.desc: "Está claro, y no solo para nosotros, que la injerencia de [USA.GetNameDef] en la diplomacia de Asia y Oceanía es indeseable e inaceptable. [JAP.GetNameDefCap] ha accedido a garantizar la seguridad de nuestra nación, lo que nos permite mantener en alto nuestro estandarte frente a los enemigos, sabiendo que un aliado acudirá en nuestra ayuda en caso de que los estadounidenses resulten demasiado poderosos como para vencerlos por nuestra cuenta."
 AST_diplomatic_events.79.a: "Marchamos hacia la guerra."
 AST_diplomatic_events.80.t: "[JAP.GetNameDefCap] se niega a darnos garantías"
 AST_diplomatic_events.80.desc: "La injerencia de [USA.GetNameDefCap] en la diplomacia de Asia y Oceanía es indeseable e inaceptable, pero parece que solo nosotros lo tenemos claro. [JAP.GetNameDefCap] se niega a ofrecernos garantías, lo que nos obliga a enfrentarnos a nuestros enemigos sin su apoyo."
 AST_diplomatic_events.80.a: "Y eso es lo que haremos."
 AST_diplomatic_events.81.t: "Un tierno símbolo de unidad"
 AST_diplomatic_events.81.desc: "El interés del primer ministro británico por los animales no ha pasado inadvertido para casi nadie, ya que su colección es bastante impresionante. Cualquier nueva incorporación a su variada familia de animales será sin duda bien recibida, pero aún más si se trata de una especie exótica.\n\nEl mismo [ENG.GetLeader] ha expresado su interés por el ornitorrinco australiano y, aunque actualmente su exportación está prohibida debido a los riesgos sanitarios que el transporte supone para el pequeño animal, tal vez valga la pena hacer una excepción.\n\n¿Deberíamos concederle ese deseo al primer ministro, como símbolo de unidad?"
 AST_diplomatic_events.81.a: "Llevémosle a [ENG.GetLeader] ese ornitorrinco."
 AST_diplomatic_events.81.b: "No haremos excepciones en nuestra prohibición a la exportación, ni por el primer ministro."
 AST_diplomatic_events.82.t: "Dolorosas noticias de [ENG.GetLeader]"
 AST_diplomatic_events.82.desc: "El transporte del ornitorrinco que zarpó del puerto de Melbourne hace seis semanas, con un completo terrario para ornitorrincos a bordo, ha llegado a [ENG.GetNameDef]. Sin embargo, la llegada del barco no fue motivo de alegría, ya que se descubrió que el animal había muerto. [ENG.GetLeader] lamenta la pérdida de su mascota, a la que incluso ya había puesto nombre mientras esperaba que llegara, pero afirma que los culpables de la muerte del animalito son sus enemigos. Al parecer, las explosiones de un ataque submarino asustaron al ornitorrinco hasta matarlo.\n\nSin embargo, el diario de a bordo del cuidador del ornitorrinco apunta a otra posible causa de la muerte: las temperaturas del agua y del aire del \"ornitorrincario\" superaban con creces los niveles adecuados.\n\nEn cualquier caso, el ornitorrinco de [ENG.GetLeader] ha muerto, así que el primer ministro británico seguirá sin tener uno."
 AST_diplomatic_events.82.a: "Sin duda, una triste noticia."
 AST_political_events.1.t: "Convocatoria de referéndum"
 AST_political_events.1.desc: "Son dos los ámbitos en los que, como gobierno, aspiramos a redoblar el control federal: la aviación y los mercados.\n\nEn lo que respecta a la aviación, lo ideal sería introducir una reforma constitucional que faculte al Parlamento de la Mancomunidad para promulgar leyes que regulen la navegación aérea y la industria aeroespacial.\n\nEn cuanto a la enmienda de mercados, tendría por objetivo impulsar la cooperación entre la Mancomunidad y sus Estados, que hoy por hoy se ve constreñida por impedimentos constitucionales.\n\n¿Por cuál de estas reformas deberíamos convocar un referéndum?"
 AST_political_events.1.a: "Por la aviación, para regular el tráfico aéreo en todo el territorio de [AST.GetName]."
 AST_political_events.1.a.tt: "Una vez aprobada la reforma:\nSe añade §YReforma de aviación aprobada§!, que otorga:\nVelocidad de investigación aérea: §G+15%§!\nVelocidad de construcción de §Ybases aéreas§!: §G+5,00%§!"
 AST_political_events.1.b: "Empecemos por coordinar los planes de comercialización agrícola a escala nacional."
 AST_political_events.1.b.tt: "Una vez aprobada la reforma:\nSe añade §YReforma de mercados aprobada§!, que otorga:\nFactor de fábricas de bienes de consumo: §Y-10,0%§!"
 AST_political_events.2.t: "Triunfa el referéndum"
 AST_political_events.2.desc.a: "El público ha aceptado que se promulgue nuestra reforma de la aviación. Dado que esta no existía cuando se redactó la Constitución australiana, es justo que el gobierno asuma al fin la autoridad sobre la navegación aérea, así como su regulación. En aras de la seguridad y la eficacia, a partir de ahora se promulgarán leyes nacionales uniformes en materia de aviación."
 AST_political_events.2.desc.b: "La opinión pública ha aceptado que se promulgue nuestra reforma de la comercialización. Al contar con el poder de regular los productos agrícolas y su comercialización, el gobierno podrá ahora estabilizar los mercados y mejorar la cooperación entre los estados. Los ingresos de los agricultores serán menos inestables, al igual que la economía nacional."
 AST_political_events.2.a: "¡El control federal irá a más!"
 AST_political_events.4.t: "El primer ministro sucumbe"
 AST_political_events.4.desc: "Los dirigentes de [AST.GetName] llevan mucho tiempo sometidos a la presión de los preparativos bélicos y, al final, esa tensión se ha cobrado su víctima más ilustre: el primer ministro ha fallecido de un infarto.\n\nDada la situación actual del mundo, su liderazgo se echará mucho de menos. No obstante, Australia debe seguir adelante con un nuevo líder al mando: [AST.GetLeader]."
 AST_political_events.4.a: "Es una tragedia nacional."
 AST_political_events.5.t: "Medidas drásticas en el gobierno australiano"
 AST_political_events.5.desc: "Ha surgido un colectivo de voces discordes y ávidas de polémica, el movimiento Australia First. El gobierno teme el posible cariz antidemocrático de sus intereses, por lo que ha tomado la decisión de someter al grupo y a sus integrantes a una estricta vigilancia. La intromisión de los demócratas reducirá su capacidad de organización y frenará la captación de nuevos miembros."
 AST_political_events.5.a: "Sus pretensiones acabarán saliendo a la luz."
 AST_political_events.6.t: "El sesquicentenario de 1938"
 AST_political_events.6.desc: "Hoy el país celebra el 150.º aniversario de la colonización de Australia con la espectacular Marcha Nacional Australiana. Mientras el desfile cruzaba las avenidas de Sídney esta mañana, en el Australia Hall tenía lugar una protesta.\n\nActivistas y colectivos a favor de los derechos de los aborígenes reivindicaban que en la jornada de hoy no solo rememoramos la colonización británica, sino que cabe también denunciar la discriminación constitucional de los pueblos aborígenes. Los manifestantes exigen nuevas leyes que garanticen la educación y la defensa de las poblaciones aborígenes, así como una nueva política por la que estos puedan adquirir la ciudadanía de pleno derecho."
 AST_political_events.6.a: "Será necesario tomar medidas."
 AST_political_events.7.t: "Presión imperial"
 AST_political_events.7.desc: "A juzgar por los últimos acontecimientos, es irrebatible ya que la política australiana está sufriendo cambios estructurales. [ENG.GetNameDefCap] ha tomado medidas para facilitar, en términos diplomáticos, que el proyecto de nación de [AST.GetName] siga siendo viable al amparo de la Mancomunidad. Con esta voluntad amistosa y pacífica, esperan asegurarse la lealtad continuada de su dominio."
 AST_political_events.7.a: "Por mucho empeño que pongan los británicos, [AST.GetName] y nadie más elegirá su camino."
 AST_political_events.8.t: "Se avecina la guerra"
 AST_political_events.8.desc: "$AST_war_is_coming_cat_desc$"
 AST_political_events.8.a: "Hemos de prepararnos."
 AST_political_events.9.t: "La disputa del Dalfram"
 AST_political_events.9.desc: "Lo que comenzó siendo una disputa por la carga de arrabio ha desatado un conflicto mucho mayor. En toda Australia se está dejando de trabajar como gesto de solidaridad, en un claro desafío tanto al gobierno como a la industria. A medida que se extienden las huelgas y aumentan las tensiones, la crisis se agrava y exige la dimisión de quienes ostentan el poder. Así pues, tras haber fracasado por completo a la hora de controlar la situación, el gobierno ha hecho precisamente eso: dejar vacante el puesto como partido gobernante; puesto que ahora ocupará el [AST.GetCommunistParty]."
 AST_political_events.9.a: "Claro que lo reclamaremos."
 AST_canberra_air_disaster_events.1.t: "Catástrofe aérea en Camberra"
 AST_canberra_air_disaster_events.1.desc: "Esta mañana se ha estrellado un avión Lockheed Hudson a las afueras de Camberra. Transportaba diez pasajeros, entre los que se encontraban el jefe del ejército y su equipo, que habían sido convocados a una asamblea del gabinete. Por desgracia, todos han perdido la vida.\n\nLa causa del accidente es un enigma: las condiciones meteorológicas eran ideales y a los mandos estaba el teniente de la aviación británica Robert Hitchcock, todo un veterano.\n\nSea como fuere, hoy nuestra nación está de luto, por no hablar de los parientes y allegados de las víctimas. Australia vuelve la mirada hacia sus líderes: ¿qué piensan hacer estos al respecto?"
 AST_canberra_air_disaster_events.1.a: "Una tragedia atroz."
 AST_canberra_air_disaster_events.1.a.tt: "Desbloquea §Ydecisiones de \"Confianza en el gabinete\"§! y una §Ymisión§! para salvar o cesar al gobierno actual."
 AST_canberra_air_disaster_events.2.t: "[AST.GetRulingParty] prevalece"
 AST_canberra_air_disaster_events.2.desc: "El gobierno actual ha sabido capear los tiempos convulsos que han sacudido Australia desde que aconteciera la catástrofe aérea de Camberra. Cual faro en la noche, [AST.GetRulingParty] ha demostrado su integridad y fuerza pese a las dificultades, granjeándose por ello la simpatía de la nación."
 AST_canberra_air_disaster_events.2.a: "El futuro se antoja esperanzador."
 AST_canberra_air_disaster_events.3.t: "Moción de censura"
 AST_canberra_air_disaster_events.3.desc: "Ha salido adelante una moción de censura que supone el último clavo en el ataúd de este gobierno, que a regañadientes entrega el testigo por fin a sus sucesores. Tras un periodo de inestabilidad política y desconfianza del electorado, Australia se dispone a hacer tabula rasa."
 AST_canberra_air_disaster_events.3.a: "El saneamiento que Australia necesita."
 AST_canberra_air_disaster_events.4.t: "El poder cambia de manos"
 AST_canberra_air_disaster_events.4.desc: "Tras una época marcada por la inestabilidad política y la desconfianza del electorado, llega el cambio a la cúpula de [AST.GetRulingParty]. Una mayoría ha votado la destitución del primer ministro, y el cargo lo ocupará su sucesor."
 AST_canberra_air_disaster_events.4.a: "Ojalá que Australia salga reforzada de este trance."
 AST_canberra_air_disaster_events.5.t: "Australia nos acusa"
 AST_canberra_air_disaster_events.5.desc: "En una conferencia de prensa, [AST.GetName] nos ha culpado de un accidente aéreo que se produjo en su territorio nacional y se saldó con la muerte de varios cargos políticos.\n\nSe trata de una acusación infundada, por supuesto, lo que agrava más si cabe la afrenta a nuestro honor."
 AST_canberra_air_disaster_events.5.a: "Semejante falsedad no merece mención por nuestra parte."
 AST_canberra_air_disaster_events.5.b: "El agravio no quedará impune."
 AST_canberra_air_disaster_events.6.t: "[JAP.GetNameDefCap] toma represalias"
 AST_canberra_air_disaster_events.6.desc: "Ultrajada por nuestra acusación, [JAP.GetNameDefCap] la interpreta como una agresión injustificada. [JAP.GetLeader] declara que esto se trata ya de un conflicto abierto, por lo que su nación está en derecho de invadir nuestros territorios."
 AST_canberra_air_disaster_events.6.a: "No vamos a echar más leña al fuego."
 AST_canberra_air_disaster_events.6.b: "Esto no puede quedar sin respuesta."
 INS_limited_war_events.1.t: "¡Aplastar a Malasia!"
 INS_limited_war_events.1.desc: "Las líneas enemigas se han roto y nuestros hombres avanzan sin oposición. Al otro lado del estrecho, el estado cliente de los británicos se desmorona bajo el peso de la ira popular. Los títeres de Londres pensaron que sus bayonetas los protegerían de la historia. Se equivocaron."
 INS_limited_war_events.1.a: "¡Merdeka!"
 INS_limited_war_events.1.b: "Es un día grande para la República."
 INS_limited_war_events.2.t: "Contragolpe [FROM.GetAdjective]"
 INS_limited_war_events.2.desc: "Lo que nos prometieron como un golpe rápido contra el régimen títere se ha malogrado. Las fuerzas [FROM.GetAdjective], reforzadas por sus amos imperiales, han expulsado a nuestros hombres del terreno en liza y ahora han ejercido la ocupación sobre este. La radio se hace eco de sus fanfarronadas a diario. Seguir adelante supone una mayor humillación, pero retirarse es rendirse a la evidencia de la derrota ante todo el archipiélago."
 INS_limited_war_events.2.a: "Retiraremos a las tropas y salvaremos lo que podamos."
 INS_limited_war_events.2.b: "¡No cederemos ante esos títeres!"
 INS_limited_war_events.3.t: "[FROM.GetName] se postra ante la República"
 INS_limited_war_events.3.desc: "Han llegado noticias de Kuala Lumpur. El gobierno títere, abandonado en el momento decisivo por sus amos londinenses, ha aceptado nuestras condiciones antes que ver sus ciudades en llamas. Las tierras en disputa son nuestras. La lección no pasará desapercibida para los demás estados clientes de la región."
 INS_limited_war_events.3.a: "Indonesia prevalece."
 INS_limited_war_events.4.t: "[FROM.GetName] rechaza nuestras condiciones"
 INS_limited_war_events.4.desc: "[FROM.GetName] nos ha tirado a la cara nuestra oferta. Los ministros títeres, leyendo un guion redactado en Whitehall, declaran que no se cederá ni un palmo de suelo y habrá que meter en cintura a la propia República antes de que callen las armas."
 INS_limited_war_events.4.a: "Pues que hablen las armas."
 INS_limited_war_events.5.t: "[FROM.GetNameDefCap] pide nuestra destrucción"
 INS_limited_war_events.5.desc: "[FROM.GetNameDefCap] ha descartado el último intento de una guerra calculada. Sus transmisiones hablan ahora abiertamente de desmembrar la República y repartir sus islas entre los antiguos amos coloniales. Este asunto no acabará de manera sosegada. O Indonesia queda en pie al final o todo lo contrario."
 INS_limited_war_events.5.a: "Nos mantendremos en pie o caeremos juntos."
 INS_limited_war_events.6.t: "El avance [FROM.GetAdjective] ha fracasado"
 INS_limited_war_events.6.desc: "El empuje [FROM.GetAdjective] nos pilló desprevenidos y durante una temporada nos temimos lo peor. Sin embargo, su ofensiva ha quedado empantanada. Sus hombres están cansados, sus frentes son extensos y las bravatas de Londres menguan con cada comunicado. La República aún puede mostrarse magnánima y ofrecer a esos títeres una forma de retirarse, aunque muchos dirían que una victoria clara sirve mejor a la causa que una victoria comedida."
 INS_limited_war_events.6.a: "Les haremos una propuesta de armisticio."
 INS_limited_war_events.6.b: "Sin piedad para con los títeres."
 INS_limited_war_events.7.t: "Nuestra ofensiva se detiene"
 INS_limited_war_events.7.desc: "Nuestro avance se ha estancado y, lo que es peor, el enemigo lo sabe. Ha llegado una propuesta desde el otro lado del estrecho: deponer las armas ahora y aceptar sus condiciones o ver cómo se alarga la lista de bajas para llegar al mismo resultado. Lo único que nos dan a elegir es el tamaño del funeral."
 INS_limited_war_events.7.a: "Mejor una mala paz que una guerra peor."
 INS_limited_war_events.7.b: "La República no se rinde."
 INS_limited_war_events.8.t: "[FROM.GetName] no se doblega"
 INS_limited_war_events.8.desc: "[FROM.GetName] ha respondido a nuestra oferta de manera desafiante. Sus ministros proclaman que prefieren quemar todos los kampong desde Penang hasta Johor a dar una sola concesión a la República. Así pues, la guerra continúa."
 INS_limited_war_events.8.a: "Pues muy bien."
 INS_limited_war_events.9.t: "¡[FROM.GetName] tiene intención de quebrar la República!"
 INS_limited_war_events.9.desc: "La intercepción de las transmisiones inalámbricas del mando enemigo ha confirmado lo peor. No habrá acuerdo ni paz mesurada ni repliegue a las líneas del frente anteriores. Los títeres y sus amos londinenses exigen la rendición total de la República, que Indonesia sea condenada a la ruina y sus islas sometidas al yugo imperialista del que las libramos. Ante esto, solo cabe hay una respuesta."
 INS_limited_war_events.9.a: "¡Indonesia prevalece!"
 ### AST - Union Control Events ###
 AST_union_control_events.1.t: "Agentes extranjeros en nuestros sindicatos"
 AST_union_control_events.1.desc: "Los servicios de inteligencia han puesto en conocimiento del gobierno un informe inquietante. Unos agentes comunistas australianos se han puesto en contacto con dirigentes sindicales locales para distribuir literatura radical y animar a los trabajadores a organizarse en frentes revolucionarios. El movimiento sigue siendo pequeño por el momento, pero los funcionarios de seguridad advierten que así es, precisamente, como empiezan estas cosas. Hay que tomar una decisión antes de que el movimiento arraigue."
 AST_union_control_events.1.a: "Hay que vigilarlos. Estaremos atentos y esperaremos."
 AST_union_control_events.4.t: "Infiltrados comunistas se apoderan de territorio [MAL.GetAdjective]"
 AST_union_control_events.4.desc: "El gobierno ha recibido un informe estremecedor. Una operación coordinada ha tomado uno de nuestros estados y lo ha declarado parte del gobierno revolucionario. La rapidez y la organización del asalto han suscitado algunas preguntas incómodas. Nuestros servicios de inteligencia sospechan que los insurgentes no actuaron solos y que puede que alguna intervención extranjera los haya guiado hasta nuestras costas. Los que escaparon al asalto no se han rendido. Se han reagrupado y han tomado las armas, decididos a recuperar lo que les arrebataron."
 AST_union_control_events.4.a: "Hemos de averiguar quién está detrás de esto. Esos insurgentes no lograrán mantener el territorio durante mucho tiempo."
 AST_union_control_events.4.a.tt: "Se han congregado milicias anticomunistas, decididas a resistir la ocupación comunista."
 AST_union_control_events.5.t: "El desastre [MAL.GetAdjective]"
 AST_union_control_events.5.desc: "La operación ha terminado en catástrofe. Nuestras tropas nunca tocaron tierra. Las rechazaron las patrullas leales y acabaron perdidas en el estrecho o capturadas antes de que pudieran establecer una posición. Los detalles son confusos, pero el resultado no. Peor aún, la prensa se ha enterado del asunto. El Parlamento se pregunta ahora qué hacían exactamente nuestras fuerzas en esas aguas. La respuesta pública ha sido de conmoción y vergüenza. Sean cuales sean los logros que esperábamos obtener para la revolución, tendremos que buscar otro camino."
 AST_union_control_events.5.a: "Un terrible revés. Debemos recurrir a otras vías para apoyar a nuestros camaradas."
 AST_union_control_events.3.t: "Estalla la revolución en [MAL.GetNonIdeologyName]"
 AST_union_control_events.3.desc: "Los trabajadores de [MAL.GetNonIdeologyName] se han alzado. Las células comunistas alimentadas durante nuestra larga campaña han tomado las armas por todo el país, pero, desde el terreno, el escenario es preocupante. Las fuerzas revolucionarias se han concentrado en las zonas equivocadas, apartadas del corazón de la península por el agua y la selva. Sin un punto de apoyo en la península, el gobierno se limitará a esperar y a aplacar la revolución antes de que pueda extenderse. Australia debe actuar de forma encubierta y rápida para desembarcar combatientes en la península y proporcionar a la revolución el sustrato que necesita para sobrevivir."
 AST_union_control_events.3.a: "El afán revolucionario no se puede quedar a las puertas de la victoria. Que cuenten con nuestro amparo."
 AST_union_control_events.2.t: "[AST.GetName] alienta a la insurrección en nuestras calles"
 AST_union_control_events.2.desc: "Han llegado a nuestras ciudades agentes del gobierno comunista australiano. Lejos de disimular, distribuyen panfletos a las puertas de nuestras fábricas, pronuncian discursos en las plazas públicas y tienden redes de solidaridad entre agentes australianos y grupos locales de radicales. Con una rapidez pasmosa, las redes ya existentes de influencia externa parecen haberse fortalecido. Se trata de una campaña orquestada, y recae ahora sobre el gobierno decidir cómo atajar el descontento popular antes de que se vuelva incontenible."
 AST_union_control_events.2.b: "Una noticia preocupante."
 ###########################
 ##### ABDACOM EVENTS ######
 ###########################
 ABDA_events.1.t: "Una invitación a un nuevo mando supremo"
 ABDA_events.1.desc: "[FROM.GetNameDef] ha establecido un mando conjunto supremo para el escenario del Pacífico y nos ha ofrecido una invitación a unirnos. La iniciativa, conocida como ABDACOM, busca agrupar las fuerzas de tierra, mar y aire de las naciones aliadas que operan en la región bajo una estructura de mando unificada. Ser miembro implica una coordinación más estrecha con [FROM.GetNameDef] y los demás socios que ya forman parte de la iniciativa. Debemos decidir si aceptar."
 ABDA_events.1.a: "Uniremos fuerzas."
 ABDA_events.1.b: "No podemos comprometernos en este momento."
 ABDA_events.2.t: "[FROM.GetName] se une al ABDACOM"
 ABDA_events.2.desc: "[FROM.GetNameDef] ha aceptado nuestra invitación a unirse al mando supremo del ABDACOM. Sus fuerzas ahora actuarán bajo la estructura de mando conjunto, reforzando nuestra posición en el escenario del Pacífico."
 ABDA_events.2.a: "Una evolución bien recibida."
 ABDA_events.3.t: "[FROM.GetName] rechaza unirse"
 ABDA_events.3.desc: "[FROM.GetNameDef] ha rechazado nuestra invitación a unirse al mando supremo del ABDACOM. Sus fuerzas no tomarán parte en el esfuerzo conjunto en este momento, aunque la puerta podría quedar abierta."
 ABDA_events.3.a: "Es desafortunado, pero tomamos nota."
 ABDA_events.5.t: "Una invitación para unirse al ABDACOM"
 ABDA_events.5.desc: "[FROM.GetNameDef] nos ha ofrecido una invitación a unirnos al mando de EE. UU., Gran Bretaña, Países Bajos y Australia. El ABDACOM ya se ha establecido como autoridad suprema coordinadora de las fuerzas aliadas en el escenario del Pacífico, uniendo los ejércitos y armadas de las principales potencias aliadas bajo un solo mando. Ser miembros introduciría nuestras fuerzas en la estructura unificada, con acceso a inteligencia compartida, una doctrina coordinada y todo el peso del apoyo aliado. Debemos decidir."
 ABDA_events.5.a: "Uniremos fuerzas."
 ABDA_events.5.b: "No podemos comprometernos en este momento."
 ABDA_events.4.t: "Las defensas de Singapur"
 ABDA_events.4.desc: "Al haberse designado Singapur como pieza clave del perímetro defensivo del ABDACOM, nuestros comandantes deben decidir de qué modo invertir en sus fortificaciones. Podemos dar prioridad a los accesos navales y defensas del puerto, reforzar los accesos terrestres ante un asalto por tierra o repartir nuestros recursos entre ambos. Cada opción determinará de qué forma se podrá defender Singapur cuando llegue el enemigo."
 ABDA_events.4.a: "Reforzad los accesos navales. La fortaleza de Singapur es su puerto."
 ABDA_events.4.b: "Fortificad el perímetro terrestre. La verdadera amenaza vendrá por tierra."
 ABDA_events.4.c: "Un enfoque equilibrado. Ninguna forma de ataque debe quedar sin defensa."
 ABDA_fortress_singapore_choice_tt: "Completar este enfoque presentará la elección de cómo fortificar Singapur."
 ABDA_faction_membership_requirement_tt: "Los miembros de la facción aptos podrán unirse."
