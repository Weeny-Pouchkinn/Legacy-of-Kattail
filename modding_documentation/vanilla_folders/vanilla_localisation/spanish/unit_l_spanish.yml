 rangers_support_desc: "Los rangers de reconocimiento son soldados de élite de primera línea que se especializan en la infiltración, las tareas de reconocimiento y el combate de contacto."
 ranger_battalion: "Rangers"
 ranger_battalion_desc: "Los rangers son especialistas destacados en el combate en terrenos frondosos y con mucha vegetación."
 rangers: "Especialistas en terreno agreste"
 rangers_desc: "Con la especialización en infiltración y reconocimiento táctico, potenciaremos el entrenamiento en entornos hostiles que reciben nuestros rangers."
 pioneer_support: "Pioneros"
 pioneer_support_desc: "Los pioneros son ingenieros con talento, expertos en consolidar cabezas de playa, proyectos generales de ingeniería y afianzar ganancias."
 marines_shore_parties: "Partidas costeras"
 marines_shore_parties_desc: "Las partidas costeras suelen abrir brecha en los desembarcos como grupos de ingenieros de combate especializados en establecer un punto de apoyo en pleno combate."
 marines_jungle_troops: "Especialistas en la selva"
 marines_jungle_troops_desc: "Estos marines, expertos en despejar terreno con mucha vegetación, destacan en operaciones ofensivas a gran escala y en la ingeniería en terreno agreste."
 marines_recon: "Régimen de entrenamiento extenuante"
 marines_recon_desc: "Nada puede preparar a un hombre para la guerra, pero nuestros instructores de combate procuran que solo los reclutas más curtidos lleguen donde realmente importa."
 marines_commandoes: "Comandos de la marina"
 marines_commandoes_desc: "Nuestros marines han demostrado su valía en operaciones prolongadas tras las líneas enemigas. Ya es hora de que cimentemos esta práctica en nuestra doctrina y organicemos las tropas con miras a la eficacia del ataque relámpago."
 marines_expeditionary: "Unidades expedicionarias"
 marines_expeditionary_desc: "Una mejora en la planificación y la logística interdisciplinaria beneficia los ataques coordinados. A medida que avanza nuestra filosofía doctrinal, nos vendrá bien aumentar el apoyo a estas fuerzas especiales."
 marines_expeditionary_blowtorch: "Soplete y sacacorchos"
 marines_expeditionary_blowtorch_desc: "La combinación perfecta de fuerzas navales, aéreas y terrestres puede conquistar cualquier objetivo. Este método de armas combinadas para la guerra ofensiva será una demostración de nuestra destreza logística."
 marines_expeditionary_support: "Fuerzas especiales expedicionarias"
 marines_expeditionary_support_desc: "A estas alturas, es imposible exagerar la importancia de la cooperación entre cuerpos. Dedicar logística de fuerzas especiales a nuestras operaciones nos convierte en una fuerza muy respetable."
 marines_commandos_demolition: "Expertos en demoliciones"
 marines_commandos_demolition_desc: "Podemos sacar mucho partido al arte de la demolición. Puede que el sabotaje sea una táctica sucia, pero su eficacia es innegable."
 marines_commandoes_mechanised: "Cuerpo de marines mecanizado"
 marines_commandoes_mechanised_desc: "La capacidad de consolidación tras un desembarco solo puede mejorarse equipando adecuadamente a nuestra vanguardia. Esto requiere un cambio en nuestra estrategia de producción y en nuestra doctrina."
 category_amphibious_tanks: "Blindados anfibios"
 SF_MARINES_exfiltration_effect_tt: "Los comandos de marines tienen la capacidad de salir desde cualquier provincia costera."
 SF_marine_demoliton_effect_TT: "Las divisiones de comandos de marines causarán §H1§! nivel de daño a todos los edificios estatales estratégicos tras cualquier invasión naval."
 marines_commandoes_mechanised_non_mtg: "Entrenamiento específico"
 marines_commandoes_mechanised_non_mtg_desc: "Vamos a mejorar nuestro grupo de élite de las fuerzas especiales, aunque sacrifiquemos sus aplicaciones más amplias."
 northern_territory_recon_support: "Unidad de reconocimiento del territorio del norte"
 northern_territory_recon_support_desc: "La unidad de reconocimiento del territorio del norte vigila las tierras más remotas e inhóspitas gracias a sus conocimientos de la zona y a su destreza para la vida en los montes."
 winter_logistics_support: "Compañía logística de invierno"
 winter_logistics_support_desc: "Proporcionará a la infantería el equipo adecuado para luchar en condiciones invernales."
 long_range_patrol_support: "Compañía de patrulla de largo alcance"
 long_range_patrol_support_desc: "Infantería de élite experta en misiones de reconocimiento y destrucción."
 category_cavalry: "Infantería montada"
 category_vehicle_infantry: "Infantería motorizada y mecanizada"
 category_special_forces_leg_infantry: "Infantería a pie de las fuerzas especiales"
 category_mobile_and_mobile_combat_sup: "Batallones móviles y apoyo en combate"
 category_support_artillery: "Artillería de apoyo"
 category_infantry_and_bicycle: "Infantería"
 category_tank_destroyers: "Cazacarros"
 category_self_propelled_artillery: "Artillería autopropulsada"
 category_self_propelled_anti_air: "Defensa antiaérea autopropulsada"
 category_helicopter_support_companies: "Compañías de apoyo de helicópteros"
 category_tank_destroyer_regimental_support: "Apoyo de regimiento de cazacarros"
 category_self_propelled_anti_air_regimental_support: "Apoyo de regimiento de defensa antiaérea autopropulsada"
 category_regimental_support_artillery: "Artillería de infantería y batería de cohetes"
 jungle_pioneers_support: "Compañía de formación selvática"
 sturmtruppe_battalion: "Batallón de Stosstruppen"
 sturmtruppe_battalion_desc: "Unidades de infantería de élite entrenadas y equipadas para operar como batallones de asalto incorporados a divisiones corrientes."
 assault_engineer: "Compañía de ingeniería de asalto"
 assault_engineer_desc: "Los ingenieros de asalto, especializados en atravesar posiciones fortificadas, combinan la experiencia con explosivos con la protección blindada para garantizar la movilidad y la fortificación incluso en los entornos más hostiles."
 armored_engineer: "Compañía de ingeniería blindada"
 armored_engineer_desc: "Vehículos versátiles equipados para construir fortificaciones, despejar obstáculos y aumentar la movilidad en el campo de batalla durante el combate."
 armored_maintenance: "Compañía de mantenimiento blindada"
 armored_maintenance_desc: "Vehículos especializados en recuperar y reparar tanques dañados y otras unidades blindadas directamente en el campo de batalla."
 armored_signal: "Compañía de transmisiones blindada"
 armored_signal_desc: "Vehículos especializados en la dirección y coordinación del combate, equipados con sistemas de comunicación avanzada para dirigir las operaciones desde el frente."
 motorized_military_police: "Policía militar motorizada"
 motorized_military_police_desc: "Vela por el orden y sofoca a la resistencia en territorios ocupados. Además, puede efectuar reconocimientos en zonas de combate activas."
 helicopter_recon: "Reconocimiento en helicóptero"
 helicopter_recon_desc: "Observadores con entrenamiento especial montados en helicópteros que pueden explorar rápidamente cualquier tipo de terreno y solicitar los ataques de precisión necesarios."
 helicopter_transport: "Helicópteros de transporte"
 helicopter_transport_desc: "Helicópteros con modificaciones en la capacidad de carga o con cables para elevar suministros que distribuyen equipo con rapidez en cualquier terreno."
 helicopter_field_hospital: "Helicóptero de evacuación médica"
 helicopter_field_hospital_desc: "¡Aviso a todo el personal! ¡Llegan helicópteros con heridos! Los helicópteros de evacuación médica retiran heridos del campo de batalla con mucha más rapidez que una ambulancia normal."
 helicopter_brigade: "Brigada de helicópteros"
 helicopter_brigade_desc: "Brigada de apoyo de helicópteros de uso general, capaz de proporcionar asistencia móvil flexible en diversas zonas."
 super_heavy_artillery: "Artillería superpesada"
 super_heavy_artillery_desc: "Una unidad especializada y equipada con obuses de gran calibre, diseñados para devastar las fortificaciones enemigas y las posiciones atrincheradas."
 self_propelled_super_heavy_artillery: "Artillería superpesada autopropulsada"
 self_propelled_super_heavy_artillery_desc: "Obuses de muchísimo calibre sobre chasis móviles que combinan una potencia de fuego devastadora con una movilidad mejorada para aplastar las defensas enemigas."
 super_heavy_railway_gun: "$super_heavy_railway_gun_equipment$"
 super_heavy_railway_gun_desc: "$super_heavy_railway_gun_equipment_desc$"
 land_cruiser: "Crucero terrestre"
 land_cruiser_desc: "Una máquina de guerra colosal dotada de armamento naval y el blindaje más pesado, aunque sumamente lenta y de altísimo consumo."
 strat_bomber_intercontinental: "Bombardero intercontinental"
