 mechanized_desc: "Transportes de infantería con un blindaje ligero."
 modern_armor: "Tanque moderno"
 modern_armor_desc: "Los tanques modernos se adaptan a casi cualquier situación en el campo de batalla. Sus potentes armas y su blindaje inclinado han dejado obsoletos los tanques especializados."
