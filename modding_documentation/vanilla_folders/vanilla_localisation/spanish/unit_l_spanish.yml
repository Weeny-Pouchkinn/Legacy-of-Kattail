 paratrooper: "Paracaidistas"
 paratrooper_desc: "Al incorporar tropas aerotransportadas, podemos entrar a la fuerza en zonas y situar tropas en lugares previamente inaccesibles, lo que abre nuevas posibilidades tácticas."
