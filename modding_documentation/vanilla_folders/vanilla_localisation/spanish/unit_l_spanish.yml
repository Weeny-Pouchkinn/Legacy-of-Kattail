 medium_tank_destroyer_brigade: "Cazacarros mediano"
 medium_tank_destroyer_brigade_desc: "Los cazacarros son tanques con un arma más grande de lo normal en una montura fija donde estaría la torreta. El chasis de los cazacarros medianos se inspira en el de los tanques medianos, lo que les confiere bastante movilidad y una potencia de fuego nada desdeñable."
