 marine_commando_desc: "Cada vez son más imprescindibles las tropas especializadas en asaltos anfibios. Atrás quedaron los métodos y el equipo improvisados ahora que nuestra infantería naval cuenta con lanchas de desembarco y hombres entrenados para ello."
 mountaineers: "Montañeros"
 mountaineers_desc: "El combate en cadenas montañosas expone a las tropas a muchos peligros, pero a veces resulta inevitable. Podemos minimizar riesgos proporcionando a nuestros soldados entrenamiento especializado para este entorno."
