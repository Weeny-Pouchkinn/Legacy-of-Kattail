l_spanish:
 ##CZECHOSLOVAKIA##
 MUN_czech_skoda_priority.t: "Škoda"
 MUN_czech_skoda_priority.d: "La empresa Škoda produce un amplio abanico de productos, desde artillería hasta tanques, trenes y cañones navales. Esto se traduce en una gran versatilidad al desviar recursos a donde hay mayor demanda, que ahora podemos dirigir parcialmente."
 MUN_czech_skoda_priority.1.a: "Interesante."
 MUN_czech.2.t.1: "Los paramilitares de los Sudetes piden ayuda"
 MUN_czech.2.t.2: "El Cuerpo Libre de los Sudetes pide ayuda"
 MUN_czech.2.t.3: "Las milicias obreras de los Sudetes piden ayuda"
 MUN_czech.2.d.1: "Ante las recientes noticias sobre nuestros planes para [CZE.GetName], muchos partidos políticos de los Sudetes han formado rápidamente grupos paramilitares por toda la región con la esperanza de socavar al gobierno [CZE.GetAdjective]. Ahora solicitan nuestro apoyo para realizar incursiones transfronterizas y cometer actos de sabotaje que contribuyan a nuestros propios esfuerzos contra [CZE.GetName]."
 MUN_czech.2.d.2: "Ante las recientes noticias sobre nuestros planes para [CZE.GetName], los partidos políticos de los Sudetes han movilizado rápidamente a sus paramilitares: el Cuerpo Libre de los Sudetes. Algunas unidades del Cuerpo Libre en todo el territorio de los Sudetes se han organizado y han empezado a atacar propiedades gubernamentales [CZE.GetAdjective] en los Sudetes. Ahora solicitan nuestro pleno apoyo para realizar incursiones transfronterizas y cometer actos de sabotaje contra [CZE.GetName]."
 MUN_czech.2.d.3: "Ante las recientes noticias sobre nuestros planes para [CZE.GetName], los partidos comunistas locales han movilizado rápidamente a las milicias obreras. Estas milicias se han organizado en unidades y han empezado a atacar propiedades gubernamentales [CZE.GetAdjective] en los Sudetes. Ahora solicitan nuestro pleno apoyo para realizar incursiones transfronterizas y cometer actos de sabotaje contra [CZE.GetName] y otros contrarrevolucionarios."
 MUN_czech.2.a: "Pues claro que ayudaremos."
 MUN_czech.2.b: "Tal vez no deberíamos darles alas."
 MUN_czech.3.t: "Actividad partisana en los Sudetes"
 MUN_czech.3.d: "Tras la reciente noticia de que [FROM.GetName] ha expresado su interés en anexionarse los Sudetes, los paramilitares de la región han empezado a librar una guerra partidista contra nosotros. Han empezado a atacar edificios gubernamentales y a socavar nuestras defensas en algunas zonas. Para mejorar nuestra situación militar en la zona, nos veremos obligados a lidiar con estos grupos paramilitares."
 MUN_czech.3.a: "¿Esto podría empeorar?"
 MUN_czech.4.t: "Crisis de confianza"
 MUN_czech.4.d: "La reciente noticia de la agresión militar contra nosotros ha conmocionado profundamente al gobierno. [CZE.GetLeader] ha perdido la fe en la capacidad de su gobierno para liderar el país durante esta crisis. Ha exigido que $CZE_jan_syrovy$ tome las riendas de la situación y dirija el país. $CZE_jan_syrovy$ ha dicho que se muestra reacio a liderar; sin embargo, ante esto, [CZE.GetLeader] le ha dicho que no tiene más opción que tomar el timón y guiarnos en esta época de crisis."
 MUN_czech.4.a: "Te necesitamos más que nunca."
 MUN_czech.4.b: "No debemos perder la cabeza."
 MUN_czech.5.t: "Fallece Tomáš Masaryk"
 MUN_czech.5.d: "Masaryk fue una figura estabilizadora en la política checoslovaca durante más de dos décadas. Cuando se creía que las coaliciones eran imposibles y los estancamientos políticos demasiado grandes para superarlos, Masaryk logró numerosos milagros políticos que ayudaron a fortalecer y convertir a Checoslovaquia en lo que es hoy. Su presencia se extrañará profundamente y se sentirá en todo el país."
 MUN_czech.5.a: "Un gigante político irremplazable."
 MUN_czech.7.t: "Reevaluando los compromisos de [CZE.GetNameDef]"
 MUN_czech.7.d: "Recientemente nos han llegado noticias de que [GER.GetNameDef] quiere anexionarse los Sudetes y estaría dispuesta a entrar en guerra con [CZE.GetNameDef] para conseguirlo. Actualmente tenemos un acuerdo defensivo con [CZE.GetNameDef], lo que significa que, si entran en guerra con [GER.GetNameDef], nos veríamos obligados a acudir en su ayuda. Si queremos evitar este desenlace, debemos rescindir inmediatamente nuestros acuerdos defensivos con [CZE.GetNameDef]."
 MUN_czech.7.a: "Respaldamos a nuestros amigos."
 MUN_czech.7.b: "No tendríamos nada que hacer contra [GER.GetNameDef]."
 MUN_czech.1001.t: "[FROM.GetNameDefCap] exige un corredor hacia [SOV.GetNameDef]"
 MUN_czech.1001.d: "Con la esperanza de coordinar acciones militares con [SOV.GetNameDef], [FROM.GetNameDef] ha exigido que les cedamos las regiones fronterizas de [89.GetName] y [91.GetName]."
 MUN_czech.1002.t: "[FROM.GetNameDefCap] exige influencia sobre la Liga Yugoslava"
 MUN_czech.1002.d: "Tras expandirse hacia el sur, [FROM.GetName] nos ha exigido algo un tanto inusual: no piden conquistar tierras, sino controlar la Liga de Defensa Yugoslava, lo que los convertiría en protectores y gobernantes de los países del norte de los Balcanes que son súbditos nuestros. Afirman que serían mejores protectores que nosotros, pero, como es lógico, eso podría ser una mera excusa."
 MUN_czech.1002.a: "A lo mejor llevan razón."
 MUN_czech.1002.b: "No, cuentan con nuestra protección."
 MUN_czech.1003.t: "[FROM.GetName] rechaza las exigencias"
 MUN_czech.1003.d: "A pesar de los argumentos convincentes de nuestros diplomáticos, [FROM.GetNameDef] se ha negado a ceder a nuestras exigencias."
 MUN_czech.1003.a: "No nos dejan elección."
 MUN_czech.1004.t: "[FROM.GetName] avanza contra Hungría"
 MUN_czech.1004.d: "[ROOT.capital.GetCapitalVictoryPointName] está al tanto del avance de las tropas [FROM.GetAdjective] hacia la frontera [HUN.GetAdjective]. Aunque el gobierno [HUN.GetAdjective] se pondrá en contacto con nosotros muy pronto, deberíamos ir pensando en cómo ayudar a [HUN.GetNameDef] y ganar así un posible aliado o en si preferimos dar carta blanca a los planes de [FROM.GetNameDef]."
 MUN_czech.1004.a: "Deberíamos proteger nuestros intereses."
 MUN_czech.1004.b: "Mantengámonos al margen."
 MUN_czech.1005.t: "[FROM.GetName] exige territorio costero"
 MUN_czech.1005.d: "Como [FROM.GetNameDef] sigue ampliando su territorio, sus representantes nos han exigido que les cedamos las tierras que antaño pertenecían a los nobles [FROM.GetAdjective]. Afirman que así tendrían acceso al Adriático, pero, al parecer, no les interesa lo que opinamos al respecto."
 MUN_czech.1006.t: "[FROM.GetName] propone una asociación"
 MUN_czech.1006.d: "[FROM.GetNameDef] nos ha propuesto firmar un tratado de defensa mutua con el propósito de disuadir a cualquier atacante con la fuerza conjunta de nuestros ejércitos. Por curioso que parezca, el tratado tiene una parte secreta en la que se expone la posible expansión de la influencia [ROOT.GetAdjective] y cómo [FROM.GetNameDef] podría ayudar."
 MUN_czech.1007.t: "[FROM.GetName] exige una alineación"
 MUN_czech.1007.d: "La desconfianza que existe entre nosotros y [FROM.GetNameDef] desde su fundación los ha llevado a exigir que nos aliemos con ellos para no sufrir una invasión. Por curioso que parezca, [FROM.GetNameDef] apela a nuestras ambiciones territoriales y promete que, a cambio de que dejemos de reclamar su territorio, nos ayudarán a obtener el resto de las tierras que anhelamos."
 MUN_czech.1007.b: "¡Hemos de conservar nuestra soberanía!"
 MUN_czech.1008.t: "[FROM.GetName] sugiere aliarse con [CZE_invited_country.GetName]"
 MUN_czech.1008.d: "Representantes de [FROM.GetNameDef], nuestro puente hacia Europa central, han propuesto ofrecer una alianza a [CZE_invited_country.GetName]."
 MUN_czech.1008.a: "Así no nos atacarán."
 MUN_czech.1008.b: "No se puede esperar que defendamos a toda Europa."
 MUN_czech.1009.t: "[FROM.GetName] nos invita a la [CZE.GetFactionName]"
 MUN_czech.1009.d: "Diplomáticos de [FROM.GetNameDef] nos han comunicado que nos recibirían con los brazos abiertos en su alianza. Sin embargo, nuestras reclamaciones territoriales han sido un punto de contención en las relaciones con [FROM.GetNameDef] en el pasado. Ahora hemos de decidir si queremos proseguir con esas reivindicaciones o centrarnos en establecer relaciones más amistosas."
 MUN_czech.1009.a: "¡Por nuestro nuevo aliado!"
 MUN_czech.1009.b: "Nos uniremos cuando cumplan con nuestras exigencias."
 MUN_czech.1009.c: "No nos interesa."
 MUN_czech.1010.t: "[FROM.GetName] nos invita a liderar la [CZE.GetFactionName]"
 MUN_czech.1010.d: "Tras intentar convertir los acuerdos de la Pequeña Entente en una auténtica alianza, el gobierno [FROM.GetNameDef] ha presentado una propuesta: quieren que lideremos esta nueva facción. Cederían el liderazgo y, a cambio, nos convertirían en un valioso protector. Se trata de un acuerdo que ampliaría nuestra influencia, pero potencialmente con naciones amenazadas."
 MUN_czech.1010.a: "Serían aliados valiosos."
 MUN_czech.1010.b: "Con proteger [ROOT.GetNameDef] ya tenemos bastante."
 MUN_czech.1011.t: "[FROM.GetName] propone un acuerdo de protección"
 MUN_czech.1011.d: "En un intento por desalentar las agresiones hacia [FROM.GetNameDef], sus diplomáticos nos han presentado el borrador de un tratado de defensa mutua. A cambio de nuestro apoyo, nos brindarían la misma protección, lo que llevaría a cualquier agresor a librar una guerra a dos bandas."
 MUN_czech.1011.a: "Vale la pena el riesgo."
 MUN_czech.1011.b: "Permanecer neutrales es más seguro."
 MUN_czech.1012.t: "[FROM.GetName] exige nuestra sumisión"
 MUN_czech.1012.d: "Alentados por su recién formada alianza, [FROM.GetNameDef] ha llegado con una serie de exigencias que conllevarían a la pérdida de nuestra soberanía. Como cuentan con el respaldo de [SOV.GetName] dado su interés en la región, hemos de decidir si podemos permitirnos negarnos."
 MUN_czech.1012.a: "Resistirnos conllevaría la pérdida de vidas [ROOT.GetAdjective]."
 MUN_czech.1012.b: "¡Muerte antes que deshonra!"
 MUN_czech.1013.t: "[FROM.GetName] ofrece una alianza condicional"
 MUN_czech.1013.d: "Tras una cuidadosa deliberación, el gobierno de [FROM.GetNameDef] ha anunciado que comparte la opinión de que una alianza sería ventajosa; sin embargo, también ha anunciado que no puede ignorar sus reivindicaciones territoriales. Por lo tanto, ha presentado la siguiente propuesta: se unirán a nuestra facción, pero solo si les cedemos el territorio que reclaman."
 MUN_czech.1013.a: "Un sacrificio que vale la pena hacer."
 MUN_czech.1013.b: "¡Intentamos proteger nuestro territorio!"
 MUN_czech.1014.t: "[FROM.GetName] solicita protección"
 MUN_czech.1014.d: "Varios diplomáticos influyentes de [FROM.GetNameDef] se han puesto en contacto con el ministro de exteriores para solicitar que consolidemos las vagas promesas de protección que firmamos en el tratado checoslovaco-soviético de 1935."
 MUN_czech.1014.a: "Quizá deberíamos intentar proteger a nuestro aliado."
 MUN_czech.1014.b: "Dejémoslo en promesas vagas."
 MUN_czech.1015.t: "[FROM.GetName] propone fusionar nuestras facciones"
 MUN_czech.1015.d: "Ahora que tenemos los mismos enemigos, [FROM.GetName] nos ha propuesto estrechar nuestra cooperación mediante la integración de nuestra facción en la suya."
 MUN_czech.1015.a: "Trabajar juntos salvaría vidas."
 MUN_czech.1015.b: "Nosotros debemos estar al mando."
 MUN_czech.1016.t: "[FROM.GetName] propone un pacto de no agresión"
 MUN_czech.1016.d: "Para retomar la conversación que quedó pendiente tras un cambio en los planes de política exterior, [FROM.GetNameDef] nos ha propuesto seguir negociando un pacto de no agresión."
 MUN_czech.1016.a: "Una frontera menos que proteger."
 MUN_czech.1016.b: "Esto obstaculizará nuestras ambiciones."
 MUN_czech.1017.t: "¿Invasión conjunta de [GER.GetNameDef]?"
 MUN_czech.1017.d: "[FROM.GetNameDef] ha compartido con las altas esferas de [ROOT.GetAdjective] sus planes secretos sobre invadir [GER.GetNameDef]. Tras demostrarnos lo comprometidos que están con la eliminación de la amenaza [GER.GetAdjective], han solicitado nuestra ayuda para derrotar juntos al poderoso ejército [GER.GetAdjective]."
 MUN_czech.1017.a: "Atacaremos [GER.GetNameDef] con ellos."
 MUN_czech.1017.b: "Esto es muy peligroso."
 MUN_czech.1018.t: "¿Luchar solos contra [GER.GetNameDef]?"
 MUN_czech.1018.t.2: "Invasión conjunta de [GER.GetNameDef]"
 MUN_czech.1018.d: "A pesar de nuestros mejores esfuerzos diplomáticos, no hemos podido reunir ningún apoyo extranjero para la invasión preventiva de [GER.GetName]; la pregunta ahora es si seguimos adelante con nuestros planes de ataque."
 MUN_czech.1018.d.FRA_POL: "Hemos recibido excelentes noticias de [FRA.GetNameDef] y [POL.GetNameDef]: nuestros diplomáticos nos informan de que ambos países se han comprometido a ayudarnos en la invasión de [GER.GetNameDef]."
 MUN_czech.1018.d.FRA: "Nuestros diplomáticos han regresado de [FRA.GetNameDef] con la gran noticia de que estarían dispuestos a participar en una invasión conjunta de [GER.GetNameDef]. Ahora debemos valorar si nuestras fuerzas combinadas serían suficientes para ello."
 MUN_czech.1018.d.POL: "Nuestros diplomáticos han regresado de [POL.GetNameDef] con la gran noticia de que estarían dispuestos a participar en una invasión conjunta de [GER.GetNameDef]. Ahora debemos valorar si nuestras fuerzas combinadas serían suficientes para ello."
 MUN_czech.1018.a: "Los pillaremos con la guardia baja."
 MUN_czech.1018.b: "Visto en retrospectiva, es demasiado arriesgado."
 MUN_czech.1019.t: "[FROM.GetName] exige [762.GetName]"
 MUN_czech.1019.d: "Los representantes [FROM.GetAdjective], que han manifestado el deseo de restaurar las anteriores fronteras bohemias y legitimar su control sobre [72.GetName], nos han dado un ultimátum y nos exigen que les cedamos [762.GetName]."
 MUN_czech.1019.a: "A lo mejor esto nos protege."
 MUN_czech.1020.t: "[FROM.GetName] ofrece una inversión condicional"
 MUN_czech.1020.a: "¡Una buena oferta!"
 MUN_czech.1020.b: "Esas condiciones son inaceptables."
 MUN_czech.1020.d: "Han llegado diplomáticos de [FROM.GetNameDef] con un acuerdo por el cual su nación invertiría en nuestra industria e infraestructura a cambio de un acuerdo sobre recursos. Esta decisión, tras inversiones fallidas en años anteriores, sugiere un esfuerzo renovado por mejorar nuestras relaciones."
 CZE_investment_effects_tt: "En §Y100 días§! obtendremos:\n§YInfraestructura§! en §Y3§! estados aleatorios.\n§YFábrica civil§! en §Y1§! estado aleatorio.\n"
 MUN_czech.1021.t: "¿El retorno de la unión aduanera de Austrohungría?"
 MUN_czech.1021.d: "[CZE.GetNameDefCap] nos ha presentado un borrador de acuerdo comercial entre las antiguas naciones austrohúngaras. Aunque satisfecho con su independencia, el nuevo gobierno [CZE.GetAdjective] parece especialmente dispuesto a restaurar los elementos beneficiosos de la nación austrohúngara."
 MUN_czech.1021.a: "Más comercio suena bien."
 MUN_czech.1021.b: "Debemos proteger a nuestros productores."
 MUN_czech.1022.t: "[CZE.GetName] se apodera de Silesia"
 MUN_czech.1022.d: "Tras un cruento combate en las montañas de [69.GetName] y antes de que las tropas contra las que se habían enfrentado pudieran recuperarse para oponer resistencia, las tropas [CZE.GetAdjective] han terminado abriéndose paso y controlando toda Silesia."
 MUN_czech.1022.a: "¡Hay que intervenir!"
 MUN_czech.1022.b: "No podemos permitirnos otro enemigo."
 MUN_czech.1022.c: "¡Una gran victoria!"
 MUN_czech.1023.t: "[CZE.GetName] comienza la lucha por Silesia"
 MUN_czech.1023.d: "Citando un razonamiento extraño sobre los reinos e imperios medievales, [FROM.GetNameDef] ha intensificado las escaramuzas fronterizas hasta convertirlas en una guerra limitada en un esfuerzo por establecer el control sobre Silesia [ROOT.GetAdjective]."
 MUN_czech.1023.a: "Preparad a las tropas."
 MUN_czech.1024.t: "[CZE.GetName] propone un acuerdo de paz"
 MUN_czech.1024.d: "Después de que los enfrentamientos fronterizos en Silesia diesen lugar a una guerra a gran escala, [FROM.GetNameDef] ha compartido su voluntad de poner fin al conflicto si se les cede la tierra que reclamaban."
 MUN_czech.1024.a: "Quizá deberíamos centrarnos en otros asuntos."
 MUN_czech.1024.b: "La situación sigue estando a nuestro favor."
 MUN_czech.1024.c: "¡No hay negociación que valga!"
 MUN_czech.1025.t: "Fin de la misión voluntaria española"
 MUN_czech.1025.d.1: "Las tropas [ROOT.GetAdjective] enviadas a [CZE_supported_spanish_faction.GetName] regresan a casa tras haberles ayudado a conseguir la victoria. Los combates han aportado nuevas perspectivas a nuestras tropas, especialmente a sus destacamentos médicos."
 MUN_czech.1025.d.2: "A pesar de la valiente lucha de las fuerzas [ROOT.GetAdjective] en la Guerra Civil Española, el bando al que apoyamos fue finalmente derrotado. A pesar de ello, nuestras tropas, y especialmente sus equipos médicos, aprendieron valiosas lecciones."
 MUN_czech.1025.a: "Esperemos no tener que poner en práctica estas lecciones en casa."
 MUN_czech.1026.t: "[FROM.GetName] rechaza la propuesta"
 MUN_czech.1026.a: "¡Peor para ellos!"
 MUN_czech.1026.b: "Una evolución preocupante."
 MUN_czech.1026.france_refuses_to_lead: "A pesar de que se le ofreció un puesto de liderazgo a [FROM.GetName] a cambio de unirse a nuestra alianza, ha decidido no hacerlo. Parece que [FROM.GetName] está intentando mantenerse neutral o está esperando el momento oportuno."
 MUN_czech.1026.sphere_of_influence: "Aunque los miembros del gobierno [FROM.GetAdjective] nos aseguraron que valoraban nuestra participación en [ROOT.GetFactionName], dijeron que ampliar nuestra influencia a los Balcanes sería ir demasiado lejos y podría asustar a posibles aliados."
 MUN_czech.1026.guarantee: "Nuestros diplomáticos informan de que, a pesar de sus esfuerzos, [FROM.GetNameDef] no ha aceptado nuestra propuesta de un acuerdo de defensa mutua. Parece que estiman que corremos más riesgo que ellos; ojalá se equivoquen."
 MUN_czech.1026.faction_merge: "A pesar de nuestros esfuerzos, nuestros diplomáticos y los [FROM.GetAdjective] no han podido llegar a un acuerdo para unificar [ROOT.GetFactionName] y [FROM.GetFactionName]."
 MUN_czech.1026.non_aggression: "A pesar de las garantías de sus intenciones pacíficas, los diplomáticos [FROM.GetAdjective] se han negado a firmar un pacto de no agresión con nuestra nación; habrá que ver por qué."
 MUN_czech.1026.trade_deal: "Alegando su deseo de permanecer económicamente independiente, [FROM.GetNameDef] ha rechazado nuestra propuesta de acuerdo comercial."
 MUN_czech.1026.faction_invite: "Aunque nuestros diplomáticos han comunicado los argumentos por los que [FROM.GetNameDef] se beneficiaría de forjar una alianza con nosotros, al final no han logrado convencerlos."
 MUN_czech.1026.weapons_sale: "A pesar de nuestra generosa oferta, [FROM.GetNameDef] ha decidido no comprarnos armas en este momento."
 MUN_czech.1026.unification: "A pesar de reconocer las ventajas que supondría una federación, [FROM.GetNameDef] ha optado por mantener a su gobierno en el exilio como el único gobierno legítimo de sus tierras."
 MUN_czech.1026.white_peace: "Nuestros representantes han regresado con malas noticias: a pesar de haber ocupado [66.GetName], el líder [FROM.GetAdjective] no está dispuesto a firmar ningún tratado de paz. Parece que tendremos que seguir conquistando territorios o esperar a que se cansen."
 MUN_czech.1027.t: "¿Establecer un acuerdo comercial entre los gobiernos [FROM.GetAdjective] y [ROOT.GetAdjective]?"
 MUN_czech.1027.d: "A pesar de nuestras diferencias ideológicas iniciales, [FROM.GetNameDef] ha apelado a nuestro pragmatismo al proponernos un acuerdo comercial. A cambio de que al gobierno [FROM.GetAdjective] se le permita extraer recursos en [202.GetName], nos proporcionarán las herramientas que tanto necesitamos para ampliar nuestra capacidad industrial."
 MUN_czech.1027.a: "Qué buen acuerdo."
 MUN_czech.1027.b: "Deberíamos negarles esos recursos."
 MUN_czech.1028.t: "Trabajos de fortificación demorados"
 MUN_czech.1028.d: "En el país, muchos se preguntan por qué el gobierno no ha continuado los proyectos de fortificación que inició a finales del año pasado. El gobierno había destinado fondos para proyectos adicionales de construcción de fuertes a través del Consejo de Fortificación. Ante la falta de avances en el programa, la gente exige que se continúe el proyecto o que se devuelvan los fondos. Si deseamos continuar con nuestros programas de fortificación, deberíamos retomarlos sin demora para que puedan finalizarse a tiempo."
 MUN_czech.1028.a: "¡No hay tiempo que perder!"
 CZE_no_time_to_lose_tt: "El margen de tiempo del que disponemos para completar nuestros proyectos de fortificación antes de que surja una amenaza es ahora muy reducido."
 MUN_czech.1029.t: "El proyecto de fortificación ha finalizado"
 MUN_czech.1029.d: "Nuestro proyecto de fortificación más reciente se ha completado y disponemos de recursos para iniciar otro nuevo. Nuestros ingenieros están listos para desplegarse en cualquier momento a otra ubicación para comenzar las obras de una nueva línea de fortificación."
 MUN_czech.1029.a: "Un trabajo excelente, caballeros."
 MUN_czech.1030.t: "[FROM.GetName] exige la integración"
 MUN_czech.1030.d: "[FROM.GetNameDefCap] ha exigido que formemos parte de su unión, pues tienen la intención de expandirla. Aunque han apelado a varios países de la región por diferentes motivos (el paneslavismo, el panbalcanismo y la historia común del Imperio austrohúngaro), este llamamiento viene con una clara amenaza implícita si nos negamos."
 MUN_czech.1030.a: "A lo mejor no está tan mal."
 MUN_czech.1030.b: "Qué poco convincente."
 MUN_czech.1031.t: "[FROM.GetName] propone una unión"
 MUN_czech.1031.d: "Aunque [ROOT.GetNameDef] capituló, el gobierno [FROM.GetAdjective] nos ha hecho una propuesta drástica que nos permitiría seguir luchando: incorporar lo que queda de nuestra nación a la suya."
 MUN_czech.1031.a: "Juntos podemos proteger mejor nuestras patrias."
 MUN_czech.1031.b: "Nuestras diferencias son demasiado grandes."
 MUN_czech.1032.t: "Superar la división"
 CZE_divide_nation_title_dynamic_sudentenland: "$MUN_czech.1032.t$ en los Sudetes"
 CZE_divide_nation_title_dynamic_czech_states: "$MUN_czech.1032.t$ con los trabajadores checos"
 CZE_divide_nation_title_dynamic_tesinko_poles: "$MUN_czech.1032.t$ en [72.GetName]"
 CZE_divide_nation_title_dynamic_slovakia_states: "$MUN_czech.1032.t$ en [SLO.GetNonIdeologyName]"
 CZE_divide_nation_title_dynamic_hungarian_states: "$MUN_czech.1032.t$ en [664.GetName]"
 CZE_divide_nation_title_dynamic_ukrainian_states: "$MUN_czech.1032.t$ en [73.GetName]"
 MUN_czech.1032.d: "Los recientes esfuerzos para resolver los problemas en [FROM.GetName] han logrado paliar la indignación contra el gobierno central, al menos por ahora. Nuestro gobierno ahora dispone de recursos para destinarlos a otros programas sociales o económicos que seguirán combatiendo los problemas que dividen a nuestro país."
 MUN_czech.1032.a: "Venga, otra vez."
 MUN_czech.1033.t: "El gobierno en el exilio [FROM.GetAdjective] solicita reconocimiento"
 MUN_czech.1033.d: "El gobierno en el exilio [FROM.GetAdjective], bajo el liderazgo de $CZE_edvard_benesh$, solicita que acojamos a su delegación mientras lucha por recuperar la soberanía de [CZE.GetNonIdeologyName]."
 MUN_czech.1033.a: "Otro aliado contra el gobierno [GER.GetAdjective]."
 MUN_czech.1033.b: "No tienen derecho."
 MUN_czech.1034.t: "Disturbios en Eslovaquia"
 MUN_czech.1034.d: "Como cedimos a los sentimientos nacionalistas de otros grupos, algunos miembros del Partido Popular Eslovaco han formado su propia fuerza paramilitar que ahora busca la independencia o, al menos, autonomía para Eslovaquia. Ahora nos preguntamos si debemos centrarnos en mantener una apariencia de unidad e impedir esto o si lo permitimos y nos centramos en las tierras que son leales al gobierno."
 MUN_czech.1034.a: "¡Enviad el ejército a Eslovaquia!"
 MUN_czech.1034.b: "Detenedlos, pero concededles cierta autonomía."
 MUN_czech.1034.c: "Tomar el control directo"
 MUN_czech.1034.c_tt: "§REstaremos a merced de la decisión de [GER.GetNameDef] sobre el destino de Checoslovaquia.§!"
 MUN_czech.1035.t: "[FROM.GetName] se ofrece a fabricar armas para nosotros"
 MUN_czech.1035.d: "Nuestra alianza integral con [CZE.GetNameDef] les ha permitido ofrecer un acuerdo único: nos fabricarán armas que actualmente producimos en el país; eso sí, por un precio. Esto, a su vez, nos permitirá centrarnos en otros sectores de nuestra industria."
 MUN_czech.1035.a: "Eso nos ahorrará muchos esfuerzos."
 MUN_czech.1035.b: "Nuestro ejército no puede depender del equipo extranjero."
 #MUN_czech.1036.t: "" #Event uses MUN_czech.1032.t
 MUN_czech.1036.d: "La Gran Depresión no ha beneficiado a nuestra nación ni económica ni políticamente. Muchos problemas económicos y políticos regionales nos aquejan, y parecen estar empeorando incluso ante nuestra milagrosa recuperación de la Gran Depresión. Debemos abordar estos problemas antes de que dividan aún más a nuestra nación."
 MUN_czech.1036.a: "Debemos sanar nuestra nación."
 CZE_divided_nation_event_onbroad_tt: "Se han desbloqueado §Ydecisiones§! que nos permiten §Yeliminar§! §Ymodificadores de estado§! negativos en nuestros estados esenciales.\n\nCompletar estas §Ydecisiones§! también reducirá los modificadores negativos sobre el §Y$CZE_a_divided_nation_dynamic_modifier$§! espíritu nacional hasta que se §Yelimine§!."
 MUN_czech.1037.t: "[GER.GetName] protege a [HUN.GetName]"
 MUN_czech.1037.d: "Tras constatar la evidente justificación de la guerra que se está gestando en nuestro país contra [HUN.GetNameDef], los representantes [GER.GetAdjective] han dejado claro que entrar en guerra contra el pueblo [HUN.GetAdjective] significaría entrar también en guerra con [GER.GetNameDef]. Nosotros decidimos si seguimos adelante o no."
 MUN_czech.1037.a: "Debemos cancelar nuestros planes"
 MUN_czech.1037.b: "Esto no cambia nada"
 MUN_czech.1038.t.1: "[FROM.GetName] nos ofrece las licencias de sus diseños de tanques"
 MUN_czech.1038.t.2: "[FROM.GetName] se ofrece a vender armas"
 MUN_czech.1038.t.3: "[FROM.GetName] se ofrece a vender artillería"
 MUN_czech.1038.t.4: "[FROM.GetName] se ofrece a vender tanques ligeros"
 MUN_czech.1038.t.5: "[FROM.GetName] se ofrece a vender cazas"
 MUN_czech.1038.d: "Representantes del gobierno [FROM.GetAdjective] y sus empresas armamentísticas se han puesto en contacto con nosotros para hacernos llegar una propuesta para la venta de armas. El precio parece bastante razonable y la oferta de [FROM.GetNameDef] incluye algunas armas muy modernas."
 MUN_czech.1038.a: "Parece un buen trato."
 MUN_czech.1039.t: "[RUT.getname] quiere un acuerdo de autonomía"
 MUN_czech.1039.d: "A raíz del acuerdo de autonomía que concedimos a [SLO.getname], $RUT_augustin_voloshyn$ ha preguntado si su región podría tener el mismo tipo de acuerdo de federalización con nosotros. Puede parecer descabellado, pero, dadas las circunstancias, tenemos que tomarnos en serio estas exigencias."
 MUN_czech.1039.a: "Ya veremos."
 MUN_czech.1040.t: "[CZE.getname] nos ofrece establecer un tratado de unión aduanera"
 MUN_czech.1040.d: "[CZE.getnameDEFCAP] ha retomado recientemente las conversaciones diplomáticas sobre una unión aduanera entre nuestras dos naciones. El acuerdo que están intentando alcanzar parece justo, pero podría incluir después otras exigencias para las que quizá no estemos preparados. Este tratado y lo que se está negociando parecen algo trivial y simbólico, por lo que no habría ningún inconveniente en firmarlo."
 MUN_czech.1040.a: "Parece inofensivo."
 MUN_czech.1040.b: "No se puede confiar en esto."
 MUN_czech.1041.t: "[FROM.getname] rechaza el tratado de unión aduanera"
 MUN_czech.1041.d: "Tras exponer algunas razones sobre cómo este tratado podría perturbar su economía, [From.getname] se ha negado a firmar el tratado de unión aduanera entre nuestras dos naciones. Dichas razones parecen excusas infundadas y sin base alguna."
 MUN_czech.1041.a: "Decepcionante."
 MUN_czech.1042.t: "[FROM.getname] acepta el tratado de unión aduanera"
 MUN_czech.1042.d: "Al considerar que el tratado es satisfactorio, [FROM.getname] ha aceptado sus términos. Con suerte, este será el primer paso hacia una relación más estrecha entre nuestras dos naciones."
 MUN_czech.1042.a: "Excelente."
 MUN_czech.1043.t: "[FROM.GetName] exige que nos unamos a su federación"
 MUN_czech.1043.d: "Aludiendo a los estrechos vínculos entre nuestras dos naciones y a los acontecimientos internacionales recientes, [FROM.getname] ha afirmado que estaríamos mejor bajo su protección que por nuestra cuenta. Parece una estratagema para ocupar nuestro territorio. ¿Qué deberíamos hacer?"
 MUN_czech.1043.a: "Aceptamos."
 MUN_czech.1043.b: "Es una idea pésima."
 MUN_czech.1044.t: "[FROM.getname] rechaza sumarse a la federación"
 MUN_czech.1044.d: "Considerando que estarían mejor por su cuenta que bajo nuestro mando, [FROM.getname] ha rechazado la oportunidad de unirse a nuestra federación. Esto supone un duro golpe para nuestro objetivo de fortalecer nuestra posición dentro de Europa. ¿Qué debemos hacer ahora, dado que [FROM.getname] no va a entrar en razón?"
 MUN_czech.1044.a: "Es una pena."
 MUN_czech.1044.b: "Tendremos que intentarlo por otros medios."
 MUN_czech.1045.t: "[FROM.getname] accede a unirse a la federación"
 MUN_czech.1045.d: "Al ver que estarían mejor protegidos bajo nuestro amparo que por sí mismos, [FROM.getname] ha tomado la sabia decisión de unirse a nuestra federación. Esto reforzará enormemente nuestra posición dentro de Europa."
 MUN_czech.1045.a: "Excelente."
 MUN_czech.1046.t: "Curando la división"
 MUN_czech.1046.d: "Tras haber afrontado numerosos problemas dentro de nuestro país, las tensiones internas parecen estar remitiendo. Tras completar numerosos programas económicos y sociales, parece que nuestro país está empezando a recuperarse."
 MUN_czech.1046.a: "Grandes noticias."
 #MUN_czech.1047 is hidden
 MUN_czech.1048.t: "[FROM.GetName] acepta nuestras exigencias"
 MUN_czech.1048.t2: "[FROM.GetName] acepta la propuesta"
 MUN_czech.1048.d: "Muy a su pesar, los funcionarios [FROM.GetAdjective] nos han informado de que tienen intención de ceder a nuestras exigencias territoriales. Las tropas [FROM.GetAdjective] ya se están retirando del territorio."
 MUN_czech.1048.d2: "Tras un largo debate, nuestros oficiales y los de [FROM.GetNameDef] han alcanzado un acuerdo acerca del nuevo papel de la economía [FROM.GetAdjective] como parte de nuestra unión, lo que traerá prosperidad a ambos pueblos."
 MUN_czech.1048.d3: "Nuestra propuesta de un pacto de no agresión ha sido recibida con entusiasmo por parte de los representantes [FROM.GetAdjective]. Parece que sus ambiciones recaen en otro lado en estos momentos."
 MUN_czech.1048.d4: "Dadas las graves amenazas que sufre, [FROM.GetNameDef] ha accedido a nuestras exigencias de alineamiento."
 MUN_czech.1048.d5: "Tras un largo debate, nuestros oficiales y los de [FROM.GetNameDef] han acordado que parte de nuestra industria militar se dedicará a fabricar equipo para ellos. A cambio, nosotros recibiremos bienes comerciales para nuestros mercados y producción."
 #MUN_czech.1049 is a faction joining event so largely reuses generic loc
 MUN_czech.1049.d: "El nuevo gobierno de [FROM.GetNameDef] se ha puesto en contacto con nosotros para proponernos una alianza. A pesar de su postura inicial antialemana, este nuevo gobierno militar parece haber adoptado una actitud pragmática y haber aceptado que sus antiguos socios internacionales no son fiables."
 MUN_czech.1050.d: "Nuestros diplomáticos han regresado de [FROM.GetNameDef] con la decepcionante noticia de que nuestra solicitud de unirnos a su alianza ha sido denegada. Aunque los motivos no están claros, ahora nos encontramos en una situación delicada al haber expuesto nuestras preocupaciones sobre nuestros aliados tradicionales sin haber conseguido ninguno nuevo."
 MUN_czech.1050.a: "Tal vez deberíamos ofrecerles unas condiciones más favorables."
 MUN_czech.1050.b: "Busquemos aliados mejores."
 MUN_czech.1051.t: "[FROM.GetName] solicita una esfera de influencia"
 MUN_czech.1051.d: "Nuestro nuevo aliado, [FROM.GetNameDef], ha manifestado su interés en expandir su influencia más allá de sus fronteras. En consecuencia, representantes [FROM.GetAdjective] han venido a solicitar permiso y apoyo para esta expansión, en la que se establecerá una frontera clara entre las zonas bajo la influencia [ROOT.GetAdjective] y [FROM.GetAdjective]."
 MUN_czech.1051.a: "Deberíamos fortalecer a nuestro aliado clave [FROM.GetAdjective]."
 MUN_czech.1052.t: "[FROM.GetName] solicita que permitamos el paso de las tropas [SOV.GetAdjective]"
 MUN_czech.1052.d: "Tras la firma de un nuevo acuerdo diplomático entre [FROM.GetNameDef] y [SOV.GetNameDef], [FROM.GetNameDef] confía en que [SOV.GetNameDef] los protegerá si estalla un conflicto. El único obstáculo es la falta de conexión terrestre entre ambos países. Por ende, los diplomáticos [FROM.GetAdjective] han solicitado a nuestro gobierno que permitamos a las tropas [SOV.GetAdjective] atravesar nuestro territorio para llegar a [FROM.GetNameDef] en caso de guerra."
 MUN_czech.1052.a: "Su lucha también nos protegerá a nosotros."
 MUN_czech.1053.t: "[FROM.GetName] nos presiona con exigencias [HUN.GetAdjective]"
 MUN_czech.1053.d: "Tras convertir [HUN.GetNameDef] en un estado cliente, [FROM.GetNameDef] nos exige que aceptemos el mismo destino. Nos amenazan con que, si nos negamos, aceptarán las reivindicaciones [HUN.GetAdjective] sobre el territorio [ROM.GetAdjective]. Hemos de elegir entre perder nuestra soberanía o comprometer nuestra integridad territorial de cara al futuro."
 CZE_cancel_anti_hungary_focus_tt: "Cancela el enfoque §Y$CZE_neutralize_the_hungarian_threat$§!"
 MUN_czech.1054.t: "¿Invasión conjunta de [LIT.GetName]?"
 MUN_czech.1054.d: "Como ya acordamos, [FROM.GetNameDef] ha presentado una propuesta que ayudaría a fortalecer nuestra nación. Para concretar más, unirnos a [LIT.GetNameDef] nos proporcionaría acceso a recursos adicionales y negaría al enemigo la posibilidad de atacarnos a través de [LIT.GetNameDef]."
 MUN_czech.1054.a: "Hemos de expandirnos para resistir a la expansión del prójimo."
 MUN_czech.1055.t: "Llegada de los voluntarios [SOV.GetAdjective]"
 MUN_czech.1055.d: "En un hito de logística aérea sin precedentes, [SOV.GetNameDef] ha recurrido a su fuerza aérea para desplegar varias divisiones de voluntarios en nuestro aeropuerto de [73.GetName] y brindarnos así apoyo bélico."
 MUN_czech.1056.t: "[FROM.GetName] exige [975.GetName]"
 MUN_czech.1056.d: "Tal y como se propuso en la Conferencia de Paz de París posterior a la Gran Guerra, [CZE.GetNameDef] ha compartido que, para garantizar la seguridad de la alianza, considera necesaria la creación de un corredor con [YUG.GetNameDef]. Para alcanzar ese objetivo, los líderes [FROM.GetAdjective] nos han enviado un ultimátum mediante el que nos exigen que les cedamos [975.GetName]."
 #THE FALL OF THE REPUBLIC EVENTS#
 MUN_the_fall_of_the_republic.1.t: "Estallido generalizado de protestas"
 MUN_the_fall_of_the_republic.1.d: "La reciente decisión de [ROOT.GetLeader] de ceder los Sudetes ha provocado un estallido de protestas en todo el país. Si bien los líderes políticos y militares querían evitar un derramamiento de sangre en lo que consideraban una resistencia inútil ante una situación imposible, muchos en todo el país sintieron que habían tomado la decisión equivocada. Algunos movimientos políticos están intentando aprovechar la agitación para lograr sus propios objetivos."
 MUN_the_fall_of_the_republic.1.a: "¡No teníamos elección!"
 MUN_the_fall_of_the_republic.2.t.1: "La caída de la Primera República"
 MUN_the_fall_of_the_republic.2.t.2: "Caos en el gobierno"
 MUN_the_fall_of_the_republic.2.d: "Tras la decisión del gobierno de ceder los Sudetes, una gran oleada de dimisiones de dirigentes subalternos del ejército y del gobierno ha azotado nuestro país. Según informan, algunas de estas personas han huido del país durante la noche. Hacen falta cambios importantes en el gobierno para frenar la fuga de funcionarios y restaurar la confianza en nuestra capacidad de liderazgo."
 MUN_the_fall_of_the_republic.2.a: "Necesitamos cambios radicales."
 MUN_the_fall_of_the_republic.2.b: "¡Debemos permanecer firmes!"
 MUN_the_fall_of_the_republic.3.t: "[RUT.GetName] solicita autonomía"
 MUN_the_fall_of_the_republic.3.d: "Ante el reciente caos político que ha azotado a nuestra nación, la pequeña región de los Cárpatos ucranianos desea una mayor autonomía de [9.GetCapitalVictoryPointName], argumentando antiguas diferencias entre la región y el resto de [ROOT.GetName]. Sin embargo, esta solicitud parece una muestra de que los líderes locales están aprovechando la oportunidad para empoderarse. Negar esta solicitud costaría mucho capital político en un momento en el que no tenemos nada que perder."
 MUN_the_fall_of_the_republic.3.a: "Claro, ¿por qué no?"
 MUN_the_fall_of_the_republic.3.b: "¡Claro que no!"
 MUN_the_fall_of_the_republic.3.c: "Que se vayan."
 MUN_the_fall_of_the_republic.4.t: "El destino de [RUT.GetName]"
 MUN_the_fall_of_the_republic.4.d: "Tras el reciente caos que azotó [CZE.GetName], la pequeña región de [RUT.GetName] ha quedado fuera de las fronteras de cualquier país. Esta pequeña región se proclama independiente y mantiene contactos diplomáticos con sus vecinos. Muchos en nuestro gobierno temen que una región fronteriza de tanta importancia estratégica caiga en manos de terceros. El ejército ha sugerido emitir un ultimátum a la región separatista para exigir su anexión inmediata."
 MUN_the_fall_of_the_republic.4.a: "¡Enviadles el ultimátum ahora mismo!"
 MUN_the_fall_of_the_republic.4.b: "Aunque sea arriesgado, vamos a esperar."
 MUN_the_fall_of_the_republic.5.t: "[FROM.GetName] exige nuestra anexión"
 MUN_the_fall_of_the_republic.5.d: "Tras nuestra independencia, era solo cuestión de tiempo que un país vecino intentara incorporarnos a su territorio. [FROM.GetName] parece ser el primero en hacerlo y exige nuestra rendición. ¿Qué hacemos?"
 MUN_the_fall_of_the_republic.5.a: "¡Lucharemos hasta que no quede nadie en pie!"
 MUN_the_fall_of_the_republic.5.b: "No tenemos más remedio que aceptar."
 MUN_the_fall_of_the_republic.6.t: "¡[FROM.GetName] rechaza nuestro ultimátum!"
 MUN_the_fall_of_the_republic.6.d: "En una acción sorpresiva, [FROM.GetName] ha rechazado nuestro ultimátum y, en su lugar, opta por la resistencia armada contra nosotros. No nos han dado más opción que invadirlos. Los planes de batalla y las rutas de ataque ya están formulados; solo tenemos que dar la orden de ataque."
 MUN_the_fall_of_the_republic.6.a: "Se lo advertimos."
 MUN_the_fall_of_the_republic.6.a_tt: "Esta operación no afectará a §Y$HUN_pal_teleki$§!, a menos que [RUT.GetNameDef] tenga aliados."
 MUN_the_fall_of_the_republic.6.b: "Esto podría ser contraproducente, es mejor esperar."
 MUN_the_fall_of_the_republic.7.t: "[FROM.GetName] cede a nuestras exigencias"
 MUN_the_fall_of_the_republic.7.d: "Para sorpresa de nadie, [FROM.getname] ha aceptado nuestras exigencias y se anexionará a nuestro país a cambio de unas condiciones triviales. La pequeña región no podía resistirse a una nación tan poderosa como la nuestra. Nuestra frontera norte ahora es más extensa que antes, y el gobierno está muy satisfecho con la fácil victoria obtenida."
 MUN_the_fall_of_the_republic.7.a: "Unas noticias excelentes."
 #BOP EVENTS#
 MUN_czech_bop.1.t: "La preparación de la armada"
 MUN_czech_bop.1.d: "Los esfuerzos de reforma de la primera mitad de la década están empezando a dar sus frutos. Actualmente, el ejército es uno de los más modernos de Europa. Sin embargo, se ha empezado a instalar cierta complacencia entre algunos políticos y jefes de muchos conglomerados industriales. Si queremos que nuestro ejército se mantenga en óptimas condiciones, debemos erradicar las posibles dudas sobre su capacidad de combate y luchar contra quienes intentan socavarla para su propio beneficio."
 MUN_czech_bop.1.a: "Estaremos preparados."
 MUN_czech_bop.2.t.1: "La amenaza del rearme alemán"
 MUN_czech_bop.2.t.2: "Expansión militar de los países vecinos"
 MUN_czech_bop.2.d.1: "La reciente remilitarización de Renania por parte de [GER.GetNameDefCap] ha asustado a algunos de nuestros líderes militares y políticos. Aunque muchos confían en las alianzas que ha forjado el país y en los preparativos que está realizando el ejército para hacer frente a la posible amenaza alemana, otros no confían tanto en que podamos resistir a cualquier amenaza [GER.GetAdjective]."
 MUN_czech_bop.2.d.2: "La reciente noticia de que algunos de nuestros vecinos han implementado programas para expandir considerablemente sus fuerzas armadas ha asustado a algunos de nuestros líderes militares y políticos. Muchos confían en las alianzas que ha forjado el país con otras naciones y en los preparativos que está realizando el ejército para hacer frente a cualquier amenaza extranjera. Sin embargo, algunos no confían tanto en que podamos resistir a una agresión extranjera."
 MUN_czech_bop.2.a: "Estaremos preparados."
 MUN_czech_bop.2.a_tt: "Por culpa de los esfuerzos de rearme de nuestros vecinos, entre las filas de nuestro ejército hay quien duda de nuestra capacidad para resistir una posible agresión. Hemos de tranquilizar al ejército con nuestros actos."
 MUN_czech_bop.3.t: "[CZE.GetName] ha enviado observadores a nuestro país"
 MUN_czech_bop.3.d: "[CZE.GetName] ha enviado personal a nuestro país para observar el conflicto en curso. Al mismo tiempo, uno de sus fabricantes de armas ligeras se ha puesto en contacto con algunos de nuestros diplomáticos por otros medios para preguntarnos si estaríamos interesados en comprarles producto. Esto implicaría tener que importar armas de contrabando a nuestro país debido a las restricciones impuestas."
 MUN_czech_bop.3.a: "Veamos a dónde nos lleva esto."
 MUN_czech_bop.3.b: "No podemos permitir que hagan algo más que observar."
 MUN_czech_bop_3_tt: "§Y[CZE.GetName]§! El fabricante de armas §Y$CZE_zbrojovka_brno_organization$§! podría intentar pasarnos armas de contrabando."
 MUN_czech_bop.4.t: "La conspiración de $CZE_zbrojovka_brno_organization$"
 MUN_czech_bop.4.d: "[ETH.getname] se ha puesto en contacto con los representantes del fabricante de armas $CZE_zbrojovka_brno_organization$ y está interesado en introducir nuestras armas de contrabando en el país. A pesar de las sanciones de la Sociedad de Naciones contra [ETH.GetNameDef], $CZE_zbrojovka_brno_organization$ querría seguir adelante con este plan. Infringir el mandato de la Sociedad de Naciones resultaría impopular a nivel internacional si nos descubren."
 MUN_czech_bop.4.a: "Adelante."
 MUN_czech_bop.4.b: "Esto no vale la pena por la posible reacción negativa."
 CZE_gun_smuggling_tt: "Introducir armas de contrabando en el país"
 CZE_we_got_caught_tt: "Han atrapado a §Y$CZE_zbrojovka_brno_organization$§!."
 CZE_we_dont_get_caught_tt: "No han atrapado a §Y$CZE_zbrojovka_brno_organization$§!."
 MUN_czech_bop.5.t: "$CZE_zbrojovka_brno_organization$ acepta el plan de contrabando"
 MUN_czech_bop.5.d: "Tras hablar con representantes del gobierno checo, $CZE_zbrojovka_brno_organization$ ha recibido una autorización secreta para iniciar el contrabando de una pequeña cantidad de armas ligeras al país. Su experiencia también estará disponible a través de nuestros canales alternativos."
 MUN_czech_bop.5.a: "Les daremos buen uso."
 MUN_czech_bop_5_tt: "Este §Yfabricante§! será §Reliminado§! tras el final de la guerra."
 ##SLOVAKIA##
 MUN_slovakia_little_war.1.t: "Victoria en [71.GetName]"
 MUN_slovakia_little_war.1.d: "Nuestro ejército demostró su valía en [71.GetName] derrotando a las fuerzas enemigas en la zona. Nuestros comandantes han obtenido información y lecciones muy valiosas de la batalla que podrán utilizar en el futuro."
 MUN_slovakia_little_war.1.a: "Un trabajo excelente."
 MUN_slovakia_little_war.2.t: "Derrota en [71.GetName]"
 MUN_slovakia_little_war.2.d: "A pesar de todos nuestros esfuerzos, nuestras fuerzas sufrieron una derrota en [71.GetName]. El hecho de no haber sido capaces de reunir a tiempo munición y equipamiento motorizado suficientes para el conflicto fue un factor determinante para nuestra derrota. Pese a este revés, los comandantes que participaron en la batalla han aprendido algunas lecciones muy importantes."
 MUN_slovakia_little_war.2.a: "Una actuación decepcionante."
 MUN_slovakia_little_war.3.t: "Incidente en la frontera de [71.Getname]"
 MUN_slovakia_little_war.3.d: "Incluso tras haber conseguido nuestro territorio en el $GER_first_vienna_award$, [HUN.GetNameDef] aún tiene intención de realizar más ajustes fronterizos con nosotros en [71.GetName]. Debemos afrontar este desafío con mano firme para demostrarles que no cederemos nuestro territorio sin luchar."
 MUN_slovakia_little_war.3.a: "¡¿Cómo se atreven?!"
 MUN_slovakia_little_war.4.t: "Punto muerto en [71.GetName]"
 MUN_slovakia_little_war.4.d: "A pesar de todos nuestros esfuerzos, nuestras fuerzas no lograron vencer en la escaramuza de [71.GetName]. El hecho de no haber sido capaces de reunir a tiempo munición y equipamiento motorizado suficientes para el conflicto fue un factor determinante para no poder lograr la victoria. Pese a este revés, los comandantes que participaron en la batalla han aprendido algunas lecciones muy importantes."
 MUN_slovakia_little_war.4.a: "Decepcionante."
 ##Exile##
 MUN_czech_exile.1.t: "Exiliados [CZE.GetAdjective] llegan a [ROOT.GetNameDef]"
 MUN_czech_exile.1.d: "Después de que [GER.GetNameDef] disolviese su país en los Acuerdos de Múnich, han llegado exiliados [CZE.GetAdjective] a muchos países, incluido el nuestro. Están dispuestos a tomar las armas para ayudarnos, con la esperanza de que algún día puedan liberar su país con nuestra ayuda."
 MUN_czech_exile.1.a: "Bienvenidos."
 ##NEWS EVENTS##
 MUN_czech.news.1.t: "La crisis de los Sudetes"
 MUN_czech.news.1.desc: "Los habitantes de los Sudetes han iniciado una revuelta armada contra [CZE.GetNameDef]. Han comenzado a llegar informes de que algunos paramilitares de los Sudetes han empezado a atacar comisarías y edificios gubernamentales en toda la región. Esto se ha desencadenado por las recientes noticias de que [FROM.GetName] pretende anexionársela.\n\nEstas revueltas parecen ser el preludio de un conflicto mayor entre [FROM.GetName] y [CZE.GetNameDef], un conflicto que ahora parece inevitable."
 MUN_czech.news.1.a: "Esto no augura nada bueno para Europa."
 MUN_czech.news.1.b: "El caos es una escalera."
 MUN_czech.news.1.c: "¡Prevaleceremos!"
 MUN_czech.news.1.d: "Ojalá que la diplomacia prevalezca."
 MUN_czech.news.2.t: "[FROM.GetNameDefCap] invade [RUT.GetNameDef]"
 MUN_czech.news.2.desc: "\nEn algún momento de la reciente cadena de acontecimientos posterior al caos político de [CZE.getname], la pequeña región de [RUT.getname] se quedó fuera de las fronteras de cualquier país. El pequeño estado separatista se declaró nación independiente y empezó a formar milicias para proteger su nueva condición de estado.\n\nDesde hace tiempo, [FROM.getnamedefcap] tenía la intención de invadir la región y ha aprovechado la oportunidad. Muchos consideran inevitable su victoria sobre [RUT.getname]."
 MUN_czech.news.2.a: "¿Que el Cárpato qué?"
 MUN_czech.news.2.b: "Esto será pan comido."
 MUN_czech.news.2.c: "¡Venid si os atrevéis!"
 MUN_slovakia.news.1.t: "Escaramuzas fronterizas en [71.GetName]"
 MUN_slovakia.news.1.desc: "A pesar de haber recuperado [664.GetName] como resultado del $GER_first_vienna_award$, [HUN.GetNameDef] sigue intentando llevar a cabo más ajustes en su frontera con [SLO.GetNameDef] en [71.GetName].\n\nEste conflicto podría ser una excusa para que [HUN.GetNameDef] ponga a prueba su poderío militar frente a un adversario mucho más débil. Es posible que el joven ejército de [SLO.GetNameDef] no esté preparado para afrontar el desafío que se le presenta."
 MUN_slovakia.news.1.a: "Como niños peleándose."
 MUN_slovakia.news.1.b: "Estamos preparados para la tarea."
