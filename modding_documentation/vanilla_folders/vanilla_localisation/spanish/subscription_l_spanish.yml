 THUNDER_AT_OUR_GATES: "El trueno a nuestras puertas"
 DLC_DESCRIPTION_dlc018: "Nuevos árboles de enfoques nacionales y eventos para Canadá, Australia, Nueva Zelanda, el Raj (India) y Sudáfrica. El comando de plan de batalla Punta de lanza permite controlar mejor los grandes cercos y perforar la línea enemiga."
 DLC_DESCRIPTION_dlc020: "Cuatro árboles de enfoques nuevos: vive la guerra desde la difícil perspectiva de Hungría, Rumanía, Checoslovaquia y Yugoslavia."
 DLC_DESCRIPTION_dlc022: "Árboles de enfoques modificados para Alemania y Japón: las dos grandes potencias del Eje ahora cuentan con caminos históricos alternativos, como la posibilidad de deponer a Hitler o instaurar el comunismo o la democracia en Japón."
 DLC_DESCRIPTION_dlc023: "Consigue nuevos diseños de barco, rasgos y habilidades para los almirantes y vehículos anfibios, usa minas navales para proteger tus mares y rutas marítimas y evitar peligros. Incluye árboles de enfoques nuevos para los Países Bajos, Reino Unido, México y Estados Unidos."
 DLC_DESCRIPTION_dlc028: "La Résistance incorpora agentes secretos, misiones de espionaje y nuevas opciones para los movimientos de resistencia. Envía a agentes a territorio enemigo para descifrar secretos del rival o prepara el terreno para tu invasión apuntalando colaboradores que ansíen el poder."
 DLC_DESCRIPTION_dlc031: "Incorpora árboles de enfoques nacionales especializados para las potencias menores del mar Negro y el Egeo. Bulgaria, Grecia y Turquía pueden trazar rutas históricas únicas y alternativas mientras resisten al esfuerzo de las grandes potencias por dominar las rutas marítimas estratégicas del Bósforo y los Dardanelos."
 DLC_DESCRIPTION_dlc034: "No Step Back añade más detalles para las diversas naciones del este de Europa, ofrece sistemas de juego únicos que reflejan la política soviética y muchas mejoras al aspecto militar del juego."
 DLC_DESCRIPTION_dlc036: "Erige un nuevo imperio, resiste a las agresiones de otras naciones o explora los límites de la neutralidad. By Blood Alone implementa nuevas alternativas históricas y nuevos cauces jugables para Italia, Etiopía y Suiza, así como otros cambios relevantes."
 DLC_DESCRIPTION_dlc038: "Escribe emocionantes historias nuevas para los países nórdicos mientras las grandes potencias de Europa se disputan el futuro del mundo. Nuevos árboles de enfoques nacionales para Finlandia, Suecia, Dinamarca y Noruega cobran gran importancia. Especializa tu industria armamentística para aumentar su eficiencia y vender su armamento en el nuevo mercado internacional."
 DLC_DESCRIPTION_dlc040: "Trial of Allegiance añade extensos árboles de enfoque para Brasil, Argentina, Chile, Uruguay y Paraguay. La estabilidad de todo un continente está en el filo de la navaja. Abre un nuevo frente en la guerra y corteja a los benefactores europeos con tu bien más preciado: tu lealtad."
 DLC_DESCRIPTION_dlc043: "Desarrolla prototipos tecnológicos y armamentísticos para desplegar contra tus enemigos. Asalta y destruye los centros de investigación, presas y monumentos de tus enemigos. Gracias a los árboles de enfoque nuevos y mejorados, podrás servirte del círculo de confianza de Alemania para lograr tus objetivos, recrear el imperio de los Habsburgo jugando como Austria o Hungría y explorar las dinámicas de Bélgica y su colonia, el Congo Belga."
 DLC_DESCRIPTION_dlc046: "Graveyard of Empires presenta árboles de enfoque únicos para Irán, el Raj, Irak y Afganistán. Limita la influencia de las entrometidas potencias extranjeras y resucita el orgullo caído de tu nación mientras te esfuerzas por dominar Oriente Medio y el sur de Asia."
 DLC_DESCRIPTION_dlc049: "Traza nuevos caminos en la historia de Japón, China y Filipinas en No Compromise, No Surrender, una expansión para Hearts of Iron IV. Obtén un mayor control sobre las facciones, forja nuevas doctrinas militares y decide el destino del Pacífico y otras regiones."
 DLC_DESCRIPTION_dlc051: "Recrea el Reino de Bohemia, forja una unión de Estados centroeuropeos, protégete con fortificaciones o crea una red de alianzas con Paz para nuestro tiempo, el nuevo árbol de enfoque para Checoslovaquia."
 DLC_DESCRIPTION_dlc052: "Toma las riendas del mando militar, despliega a tus generales en los distintos frentes y otorga medallas a tus capitanes navales más meritorios. Desbarata como Australia la invasión japonesa por todo el Sudeste Asiático, esculpe un nuevo imperio como Siam y decide si el porvenir de Indonesia se entretejerá con el de los Países Bajos."
