 AST_imperial_pressure_spirit: "Presión imperial"
 AST_imperial_pressure_spirit_desc: "Debido a los acontecimientos recientes, ya no puede negarse que la política australiana está tomando un rumbo inadecuado para una nación bajo el paraguas de la Mancomunidad Británica de Naciones. [ENG.GetNameDefCap] intentará guiar a nuestra nación de vuelta a su ruta preestablecida, pero pronto se le puede agotar la paciencia.\n\n§WSe eliminará en cuanto §Y[AST.GetName]§! no esté entre los súbditos de §Y[ENG.GetNameDef]§!§!."
