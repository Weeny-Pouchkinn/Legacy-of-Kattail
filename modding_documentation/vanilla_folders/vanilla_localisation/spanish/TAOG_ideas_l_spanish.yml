 AST_unratified_westminster_act_idea: "Ley de Westminster sin ratificar"
 AST_unratified_westminster_act_idea_desc: "El Estatuto de Westminster se aprobó en 1931, permitiendo a los dominios autónomos de [ENG.GetNameDef] aumentar su soberanía. Si lo ratificásemos, el parlamento británico perdería gran parte de su autoridad para legislar en nombre de [AST.GetName]."
