 idea_INS_volksraad: "El Volksraad"
 idea_INS_volksraad_desc: "El Volksraad es un consejo establecido por los Países Bajos en 1918 como parte del sistema de \"políticas éticas\" que pretendía crear una semidemocracia en la que varias minorías étnicas y culturas de todo el archipiélago pudieran estar representadas. Aunque en teoría es de naturaleza democrática, el gobernador general y la Corona neerlandesa tienen derecho de veto incondicional."
 INS_volksraad_custom_tt: "Te permite contratar §Yconsejeros del Volksraad§!.\nTe permite usar las §Ydecisiones del Volksraad§!."
 INS_great_depression: "La Gran Depresión"
 INS_great_depression_desc: "Aunque el impacto directo que la Gran Depresión ha tenido en las Indias Orientales ha sido pequeño, las políticas proteccionistas posteriores que los países han emprendido en todo el mundo han tenido efectos devastadores en la economía de estas, que depende de la exportación continua de materias primas como el caucho y el petróleo."
 INS_great_depression_tt: "Modifica §Y$INS_great_depression$§! en:"
 INS_dutch_east_indies: "Administración mal gestionada"
 INS_dutch_east_indies_desc: "Las Indias Orientales son un inmenso archipiélago que contiene cientos de culturas e idiomas distintos, lo que la convierte en una colonia considerablemente difícil de gestionar. Los distintos movimientos independentistas, las barreras culturales y los efectos económicos de la Gran Depresión no han ayudado, y la administración funciona de un modo muy poco eficaz. Las \"políticas éticas\" que se establecieron en 1918 intentaron mejorar la situación imponiendo regulaciones al trabajo y otorgando representación democrática a los grupos minoritarios, pero la Gran Depresión casi impidió por completo que se aplicasen."
 INS_dutch_east_indies_tt: "Modifica §Y$INS_dutch_east_indies$§! en:"
 INS_volksraad_tt: "Modifica §Y$INS_dutch_east_indies$§! en:"
 INS_royal_netherlands_east_indies_army_desc: "El Koninklijk Nederlands Indisch Leger (KNIL) es el vetusto ejército de las Indias Orientales, que opera al margen de los Países Bajos. El KNIL se compone de soldados europeos e indonesios, aunque las barreras culturales y lingüísticas entre las numerosas culturas del archipiélago y los Países Bajos hacen que el reclutamiento sea un proceso arduo y lento."
 idea_INS_netherlands_most_precious_jewel: "La joya más preciada de los Países Bajos"
 idea_INS_netherlands_most_precious_jewel_desc: "Las Indias Orientales Neerlandesas llevan siendo una colonia de los Países Bajos desde hace más o menos 350 años y la administración de la colonia está firmemente integrada en el gobierno neerlandés. Las Indias Orientales a menudo son llamadas \"la joya de la Corona neerlandesa\" y los Países Bajos no han mostrado ningún deseo de dejar de aferrarse a ella."
