 INS_revolutionaries_working_with_indonesians_idea: "Los revolucionarios trabajan junto con los indonesios"
 INS_revolutionaries_working_with_indonesians_idea_desc: "Algunos comunistas [ROOT.GetAdjective] han sido sorprendidos estableciendo contacto con dirigentes indonesios, y se sospecha que planean una revolución armada."
