 AST_singapore_strategy_idea: "Construcciones de defensa de Singapur"
 AST_singapore_strategy_idea_desc: "A petición de Australia, haremos un esfuerzo para mejorar las estructuras defensivas en Singapur. La Estrategia Singapur es un elemento central de la política de defensa del Pacífico, después de todo.\n\n§W§YAl eliminar§! (§YSingapur§!):\n Añade §G2§! §Ybases aéreas§!.\nAñade §G2§! §Ybases navales§!.\nAñade §G1§! §Yfuerte costero§!.§!\n"
