 idea_SIA_constitutional_virtue: "Virtud constitucional"
 idea_SIA_an_absolute_monarchy: "Monarquía absoluta"
 idea_SIA_an_absolute_monarchy_desc: "La autoridad política recae sobre la Corona. La palabra del rey es ley, cualquier atisbo de disidencia se ve reprimido y el prestigio real promueve las movilizaciones nacionales. El trono exige lealtad y, para conseguirla, se sirve del ejército."
 idea_SIA_a_constituional_monarchy: "Monarquía constitucional"
 idea_SIA_a_constituional_monarchy_desc: "Un marco constitucional marca los límites del poder real y consagra los derechos del pueblo. Dado que la corona se considera más un símbolo de unidad que una autoridad absoluta, el país gana estabilidad, se abre ante nuevas ideas y comparte las opiniones del mundo democrático."
 idea_SIA_restoring_order: "Restablecer el orden"
 idea_SIA_military_expansion_costs: "Costes de expansión militar"
 idea_SIA_a_modern_economy: "Una economía moderna"
 idea_SIA_death_to_communists: "Muerte a los comunistas"
 idea_SIA_death_to_communists_desc: "El fervor anticomunista se propaga entre nuestras filas, lo que otorga ventaja a nuestras fuerzas frente a los ejércitos comunistas de China."
 idea_SIA_death_to_nationalists: "Muerte a los nacionalistas"
 idea_SIA_death_to_nationalists_desc: "El sentimiento antinacionalista se propaga entre nuestras filas, lo que otorga ventaja a nuestras fuerzas frente a los ejércitos nacionalistas de China."
 idea_SIA_breaking_the_burmese_line: "Doblegar el frente birmano"
 idea_SIA_the_yellow_dossier: "El dosier amarillo"
 idea_SIA_the_yellow_dossier_desc: "Un informe confidencial acerca de la situación de la industria nacional nos ha obligado a hacer frente a grandes ineficiencias. Las reformas de obligada aplicación están dando frutos en nuestras fábricas, aunque los trastornos que ocasionan salen caros."
 idea_SIA_the_yellow_dossier_2: "$idea_SIA_the_yellow_dossier$"
 idea_SIA_the_yellow_dossier_2_desc: "$idea_SIA_the_yellow_dossier_desc$"
 idea_SIA_pacific_war_preparations: "Preparativos para la guerra en el Pacífico"
 idea_SIA_a_race_against_time: "Una carrera contra el tiempo"
 idea_SIA_overheated_economy: "Recalentamiento de la economía"
 idea_SIA_overheated_economy_desc: "La economía ha sobrepasado sus límites naturales. La demanda de los consumidores ha superado la capacidad de producción y el auge de la construcción se ha estancado mientras la situación se estabiliza."
 idea_SIA_ending_military_grift: "Poner fin al fraude militar"
 idea_SIA_the_military_oversight_bureau: "$SIA_military_oversight_bureau$"
 idea_SIA_the_military_oversight_bureau_desc: "El Departamento de inspección militar establece unos requisitos más estrictos para los nuevos comandantes y acelera el desarrollo de habilidades por parte del cuerpo de oficiales."
 idea_SIA_public_credit_debt: "Deuda pública"
 idea_SIA_public_credit_debt_desc: "Las obligaciones crediticias del Estado suponen el desgaste continuo de la economía, pues consumen unos recursos que, en otras circunstancias, se destinarían a la producción o a los bienes de consumo."
 idea_SIA_public_credit_debt_2: "Reembolso de $idea_SIA_public_credit_debt$"
 idea_SIA_public_credit_debt_2_desc: "$idea_SIA_public_credit_debt_desc$"
 idea_SIA_revision_of_unequal_treaties: "Revisión de tratados desiguales"
 idea_SIA_purged_military: "Purga militar"
 idea_SIA_purged_military_desc: "Tras la destitución de aquellos oficiales en los que no se puede confiar a nivel político, el ejército carece de líderes experimentados, cosa que dificulta la organización y el desarrollo del resto de tropas."
 SIA_khana_ratsadon_inlay_title: "Khana Ratsadon"
 SIA_civilian_wing_label: "Ala civil"
 SIA_military_wing_label: "Ala militar"
 SIA_wing_state_full_support: "§GApoyo total§!"
 SIA_wing_state_slight_support: "§GApoyo ligero§!"
 SIA_wing_state_neutral: "§YNeutral§!"
 SIA_wing_state_opposition: "§ROposición§!"
 SIA_wing_state_rebellious: "§RInsurrección§!"
 SIA_civilian_wing_history_tt: "La facción civil del Khana Ratsadon está liderada por administradores y tecnócratas progresistas, entre los que se encuentra §YPridi Phanomyong§!. Tras estudiar Derecho en Francia, Pridi regresó con el objetivo de instaurar una reforma agraria, un plan económico estatal y una democracia constitucional que empoderase a la gente de a pie.\n\nEl ala civil se declara abiertamente §Ga favor del desarrollo§! y de invertir en educación, infraestructuras e industria. Muestra escepticismo ante el elevado gasto militar y recelo ante el menor atisbo de que el país pueda convertirse en un régimen autoritario. La mejor forma de ganarse su apoyo es a través de políticas que modernicen el Estado y protejan el gobierno constitucional."
 SIA_military_wing_history_tt: "La facción militar del Khana Ratsadon está liderada por oficiales del ejército que se consideran los verdaderos protectores de la revolución. De entre sus filas, destaca la figura de §YPlaek Phibunsongkhram§!, un ambicioso coronel que cada vez siente más admiración por los movimientos nacionalistas de Europa.\n\nEl ala militar es §Gpartidaria del rearme§! y apoya la creación de un Estado fuerte y centralizado. Desconfía de las ideas económicas de Pridi, que tacha de extremadamente radicales, y no tolera que la ciudadanía interfiera en los asuntos de defensa. Para ganarse su lealtad, hay que invertir en el ejército y en políticas que impulsen la fortaleza nacional."
 idea_SIA_wing_promotion_disruption: "Realineamiento de facción"
 idea_SIA_wing_promotion_disruption_desc: "Apoyar abiertamente a un ala del Khana Ratsadon ha desestabilizado al gobierno. La facción despreciada por el mismo se muestra recelosa, las operaciones del ejército carecen de organización y la administración se ha visto debilitada. Esto no se solucionará hasta que se consolide el nuevo orden."
 idea_SIA_military_wing_unrest: "Sublevación del ala militar"
 idea_SIA_military_wing_unrest_desc: "A los oficiales se les ha vuelto a agotar la paciencia. El ala militar, indignada tras ser incapaz de alzarse con el poder, lleva a cabo saboteos, sufre deserciones y se niega rotundamente a cooperar. Hasta que no se someta a los disidentes, la capacidad de combate del ejército se verá mermada."
 idea_SIA_civilian_wing_unrest: "Sublevación del ala civil"
 idea_SIA_civilian_wing_unrest_desc: "La facción de Pridi ha vuelto a perder la esperanza en el gobierno. Tras fracasar en el que ha sido su segundo intento de alzarse con el poder, el ala civil ha optado por recurrir a las huelgas, obstaculizar la burocracia y sembrar discordia en las ciudades. Como consecuencia y hasta que la situación se estabilice, la economía se paralizará y el país carecerá de liderazgo."
 idea_SIA_unwavering_civilian_support: "Apoyo civil inquebrantable"
 idea_SIA_unwavering_civilian_support_desc: "Ahora que el ala militar se ha disuelto y se ha llegado a un acuerdo en términos de legitimidad, la administración civil carece de oposición. Los tecnócratas de Pridi, libres de la intrusión del ejército, se aventuran a gobernar con el entusiasmo del que no gozaba la coalición anterior."
 idea_SIA_unified_khana_ratsadon: "Partido del Pueblo Unido"
 idea_SIA_unified_khana_ratsadon_desc: "La rencilla entre soldados y civiles ha llegado a su fin. Ahora que ambas alas del Khana Ratsadon reman en la misma dirección, el gobierno puede actuar con una unanimidad de la que jamás ha gozado. Los militares, gobernantes e industrialistas ahora trabajan codo con codo."
