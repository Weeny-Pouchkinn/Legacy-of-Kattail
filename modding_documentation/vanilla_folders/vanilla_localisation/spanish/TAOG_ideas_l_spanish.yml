 # ABDACOM Supreme Command dynamic modifier
 ABDA_supreme_command: "Mando supremo del ABDACOM"
 ABDA_supreme_command_desc: "El mando de EE. UU., Gran Bretaña, Países Bajos y Australia ha establecido una doctrina naval unificada en los ejércitos de todos sus miembros. Al ir asentándose la alianza, la información compartida, las asignaciones coordinadas de patrullas y el apoyo logístico mutuo han ido mejorando de forma constante la eficacia en el combate de todas las flotas que navegan bajo el estandarte del ABDACOM."
