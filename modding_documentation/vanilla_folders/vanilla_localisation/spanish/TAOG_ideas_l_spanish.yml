 NZL_railways_board: "La Junta de Ferrocarriles Gubernamental"
 NZL_railways_board_desc: "La Junta de Ferrocarriles Gubernamental se creó en 1931 como resultado de la reestructuración del Departamento de Ferrocarriles, en un intento de separar la toma de decisiones de los departamentos del gobierno. Sin embargo, desde su creación apenas ha habido señales de mejora en la red ferroviaria. Aumentan las presiones para que el gobierno suprima la junta y recupere el control directo."
 NZL_great_depression: "La Gran Depresión"
 NZL_great_depression_desc: "El hundimiento de la economía mundial en 1929 afectó gravemente a la economía neozelandesa, sobre todo a la agrícola. Como los países compraban menos productos neozelandeses, muchas personas perdieron su trabajo, lo que redujo el poder adquisitivo de los consumidores y, a su vez, provocó el colapso de otras industrias. Los años de austeridad han generado en la nación el anhelo de un cambio de rumbo. "
 NZL_commonwealth_loyalty: "Lealtad a la Mancomunidad Británica de Naciones"
 NZL_commonwealth_loyalty_desc: "Nueva Zelanda sigue siendo un miembro comprometido de la Mancomunidad Británica de Naciones y observa al rey como el legítimo jefe del Estado. La economía neozelandesa también está muy integrada en el sistema económico imperial."
 NZL_national_coal_board_idea: "Junta Nacional del Carbón"
