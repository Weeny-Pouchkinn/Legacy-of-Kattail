 AST_anti_fascist_measures: "Medidas antifascistas"
 AST_anti_fascist_measures_desc: "El fascismo aún no ha clavado sus garras en Australia y las fuerzas democráticas quieren que así siga siendo. La Agencia de Investigación de la Mancomunidad vigilará y detendrá a todos los elementos sospechosos para evitar que aumente la influencia de ningún grupo fascista."
 ABDA_corps_expeditionnaire_spirit: "Corps Expéditionnaire"
 ABDA_corps_expeditionnaire_spirit_desc: "Las fuerzas francesas enviadas al escenario del Pacífico se han curtido sirviendo en las colonias y se han acostumbrado a actuar lejos de casa en condiciones difíciles. Su experiencia combatiendo en el Sudeste Asiático les brinda un conocimiento especial de las tácticas y el terreno de Japón, haciendo que sean una fuerza especialmente resistente cuando el enemigo trata de avanzar."
 ABDA_maintain_strategic_flexibility_spirit: "Flexibilidad estratégica"
 ABDA_maintain_strategic_flexibility_spirit_desc: "La producción industrial estadounidense se está orientando al escenario del Pacífico, acelerando la producción de los astilleros para sostener una flota capaz de proyectar su poder a lo largo de toda la extensión del océano. Al negarse a comprometerse en exceso con un único frente, los Estados Unidos aseguran que su fuerza naval pueda desplegarse allá donde la situación lo exija."
 AST_toe_the_line_spirit: "Acatar las normas"
 AST_toe_the_line_spirit_desc: "El Estado ha pedido sacrificio y la población ha respondido. Racionamiento, la ampliación de la jornada de trabajo y la reorientación de la producción civil hacia el esfuerzo nacional han liberado recursos que el gobierno no tenía otro medio de obtener. Es una solución austera que no resulta popular para todo el mundo."
