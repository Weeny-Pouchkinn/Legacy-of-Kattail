 AST_war_plan_japan: "Plan de guerra con Japón"
 AST_australian_culture_investments_idea: "Inversiones en la cultura australiana"
 AST_australian_culture_investments_idea_desc: "§W§YAl eliminar§!:\nAñade §YUn territorio propio§!, que otorga\nEstabilidad: §G+10,00%§!\nApoyo bélico: §G+10,00%§!.§!\n"
 AST_a_sense_of_place: "Un territorio propio"
 AST_a_sense_of_place_desc: "La identidad nacional es el vínculo que mantiene unido a un pueblo. Los australianos se han aglutinado bajo el paraguas de una cultura en auge, comprometidos a oponer resistencia frente a quien amenace sus fronteras."
 AST_a_sense_of_place_upgraded: "Sentimiento de pertenencia"
 AST_a_sense_of_place_upgraded_desc: "La identidad nacional que antes florecía discretamente ahora ha ganado rotundidad. Ya no se trata solo de orgullo por una tierra y un modo de vida: es la convicción de que Australia ya es algo valioso por lo que luchar, y que los hombres y mujeres que viven bajo la Cruz del Sur están preparados para hacerlo."
 AST_the_promise_of_nauru: "La promesa de Nauru"
 AST_the_promise_of_nauru_tt: "Efectos una vez que §Y[AST.GetName]§! completa el acuerdo:\n§YNauru§! pasa a ser propiedad y estar bajo el control de §Y[GER.GetName]§!.\n§Y[AST.GetName]§! queda libre.\n[GET_AST_NAURU_PACT_FACTION_EFFECT]"
