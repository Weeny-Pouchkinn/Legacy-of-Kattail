 ############
 idea_SIA_civilian_full_support: "Ala civil: §Gapoyo total§!"
 idea_SIA_civilian_full_support_desc: "El ala civil apoya firmemente al gobierno. Los administradores y los tecnócratas comparten su conocimiento, lo que impulsa el desarrollo."
 idea_SIA_civilian_slight_support: "Ala civil: apoyo leve"
 idea_SIA_civilian_slight_support_desc: "El ala civil apoya abiertamente las decisiones del gobierno. Su cooperación aporta beneficios modestos pero tangibles."
 idea_SIA_civilian_neutral: "Ala civil: neutral"
 idea_SIA_civilian_neutral_desc: "El ala civil no apoya ni se posiciona en contra del gobierno. La administración cumple con sus funciones, pero sin el respaldo de un alineamiento político de verdad."
 idea_SIA_civilian_opposition: "Ala civil: en oposición"
 idea_SIA_civilian_opposition_desc: "El ala civil se ha posicionado en contra del gobierno. Los funcionarios tardan en actuar y los presupuestos se asignan mal, cosa que paraliza el funcionamiento del estado."
 idea_SIA_civilian_rebellious: "Ala civil: §Rinsurrecta§!"
 idea_SIA_civilian_rebellious_desc: "El ala civil desafía abiertamente al gobierno. La inestabilidad se abre paso y la posibilidad de que se produzca una ruptura política es cada vez mayor."
 idea_SIA_military_full_support: "Ala militar: §Gapoyo total§!"
 idea_SIA_military_full_support_desc: "El ala militar respalda al gobierno. Los oficiales apoyan las campañas de reclutamiento y la fabricación de armamento, por lo que destinan los recursos del ejército a alcanzar los objetivos nacionales."
 idea_SIA_military_slight_support: "Ala militar: apoyo leve"
 idea_SIA_military_slight_support_desc: "El ala militar se muestra dispuesta a cooperar. Su apoyo mejora ligeramente el reclutamiento y la fabricación, aunque no se compromete por completo."
 idea_SIA_military_neutral: "Ala militar: neutral"
 idea_SIA_military_neutral_desc: "El ala militar no se posiciona. El ejército desempeña sus funciones sin oponer resistencia pero sin entusiasmo, a la espera de ver cómo se desarrollan los acontecimientos."
 idea_SIA_military_opposition: "Ala militar: en oposición"
 idea_SIA_military_opposition_desc: "El ala militar actúa contra el gobierno. Los oficiales sabotean las labores de producción, y el entusiasmo por la causa del gobierno se desvanece entre sus filas."
 idea_SIA_military_rebellious: "Ala militar: §Rinsurrecta§!"
 idea_SIA_military_rebellious_desc: "El ala militar está a punto de desafiar abiertamente al gobierno. Ha saboteado el reclutamiento, la fabricación de armas se resiente y se está fraguando el estallido de un golpe de Estado."
 idea_SIA_defenders_of_constitutional_liberty: "Defensores de la libertad constitucional"
 idea_SIA_civil_service_heroism_1: "Servicio civil heroico"
 idea_SIA_civil_service_heroism_1_desc: "La administración pública ha estado a la altura de las circunstancias. Su dedicación y pericia han acelerado las investigaciones y el desarrollo del país."
 idea_SIA_civil_service_heroism_2: "$idea_civil_service_heroism_1$"
 idea_SIA_civil_service_heroism_2_desc: "$idea_SIA_civil_service_heroism_1_desc$"
 idea_SIA_redirected_military_funds: "Financiación militar desviada"
 idea_SIA_thai_irredentism: "Irredentismo tailandés"
 idea_SIA_oss_special_forces_training: "Entrenamiento de fuerzas especiales de la OSS"
 idea_SIA_seized_japanese_funds: "Fondos japoneses embargados"
 idea_SIA_seized_japanese_funds_desc: "Ahora que el acuerdo con Japón se ha roto, los fondos y las reservas que han dejado atrás están a nuestra disposición; podemos aprovecharlos para impulsar un auge de la construcción y la producción industrial."
 idea_SIA_oss_special_forces_training_desc: "Nuestros agentes se han entrenado junto con la OSS en sabotaje, infiltración y operaciones aerotransportadas. Lo aprendido ha convertido a nuestras fuerzas especiales en un instrumento formidable."
 idea_SIA_sold_privy_purse_lands: "Tierras de la Corona vendidas"
 idea_SIA_sold_privy_purse_lands_desc: "La venta de los bienes de la casa real ha suministrado capital al Estado, lo que ha aliviado la presión económica y proporcionado recursos para la construcción."
 idea_SIA_war_fervor: "Fervor bélico"
 idea_SIA_bloodlusted_irredentism: "Irredentismo sangriento"
 idea_SIA_bloodlusted_irredentism_desc: "La ambición territorial ha evolucionado a algo más intenso. El ejército lucha con la convicción de quienes creen estar reclamando lo que les pertenece por derecho."
 idea_SIA_the_royal_police_counterweight: "La lealtad de la policía real"
 idea_SIA_civilian_technocrats_in_institutions: "Tecnócratas civiles"
 idea_SIA_civilian_technocrats_in_institutions_desc: "Los expertos civiles de las instituciones estatales clave han mejorado tanto la extracción de recursos como la eficacia de los nombramientos políticos."
 idea_SIA_yuvachon: "Yuvachon"
 idea_SIA_yuvachon_desc: "El movimiento Yuvachon instruye a la juventud en la disciplina militar con el objetivo de disponer de hombres bien entrenados y exaltar el sentimiento nacionalista."
 idea_SIA_yuvachon_2: "$idea_SIA_yuvachon$"
 idea_SIA_yuvachon_2_desc: "$idea_SIA_yuvachon_desc$"
 idea_SIA_rebuilding_the_war_torn_economy: "Recuperar una economía destrozada por la guerra"
 idea_SIA_specialist_marine_forces: "Fuerzas navales especialistas"
 idea_SIA_specialist_marine_forces_desc: "Se ha entrenado y equipado a un grupo de especialistas anfibios muy cualificados para realizar operaciones de incursión en costas."
 idea_SIA_rehabilitated_military: "Militares rehabilitados"
 idea_SIA_desperate_gambit: "Maniobra desesperada"
 idea_SIA_desperate_gambit_desc: "A lo mejor hay forma de salir del pozo en el que te has metido. ¡Trepa!"
 idea_SIA_purged_senior_military: "Purga militar superior"
 idea_SIA_purged_senior_military_desc: "Se ha destituido de sus puestos a los oficiales de alto rango que suponían una amenaza para el gobierno. La pérdida de unos comandantes tan avezados le ha pasado factura a la cohesión y al desarrollo profesional del ejército."
 idea_SIA_cemented_control: "Control consolidado"
 idea_SIA_cemented_control_desc: "El gobierno ha consolidado el control de las instituciones estatales. La oposición política ha quedado relegada al margen, y la maquinaria del poder se emplea ahora a favor del gobierno."
 idea_SIA_cemented_control_2: "Control atrincherado"
 idea_SIA_cemented_control_2_desc: "$idea_SIA_cemented_control_desc$"
 idea_SIA_cemented_control_3: "El deber de Tailandia durante el acto de guerra"
 idea_SIA_cemented_control_3_desc: "En caso de que una guerra amenace la soberanía de la Corona y su pueblo, todo tailandés respetado que se precie tiene el deber de resistir a la ocupación de cualquier forma, ya sea empleando armas o de otro modo."
 idea_SIA_suspend_ordinary_legal_procedures: "Procedimientos legales ordinarios suspendidos"
 idea_SIA_thai_cultural_mandates: "Mandatos culturales tailandeses"
 idea_SIA_military_humiliation: "Humillación militar"
 idea_SIA_death_defiant: "Desafiando a la muerte"
 idea_SIA_death_defiant_desc: "Ya estamos muertos. Ven a por lo que te corresponde, si es que puedes."
 idea_SIA_songsuradet_ascendant_0: "Descendiente de Songsuradet"
 idea_SIA_songsuradet_ascendant_0_desc: "Tras conseguir capear la ira del gobierno, Phraya Songsuradet ha consolidado su posición y ha ganado fuerza. Se ha convertido en una persona a la que la gente catalogaría de intocable, preeminente y demasiado afianzada como para deshacerse de ella.\nEs muy probable que interfiera en las políticas del gobierno y ralentice la toma de decisiones para asegurarse de que no vuelve a ser el objetivo de ninguna purga."
