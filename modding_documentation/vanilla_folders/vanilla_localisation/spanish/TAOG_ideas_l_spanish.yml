 AST_poor_population_growth: "Escaso crecimiento demográfico"
 AST_poor_population_growth_desc: "Cuando se produjo la Gran Depresión en 1929, las tasas de natalidad australianas descendieron drásticamente. Al verse esto unido a un descenso de la inmigración, el crecimiento demográfico ha pugnado por recuperarse desde entonces."
