 SIA_poster_no_text: ""
 SIA_poster_left_days_remaining_text: "Queda(n) §Y[?SIA_propaganda_left_days_remaining_flag:days_left|Y0]§! día(s)"
 SIA_poster_center_days_remaining_text: "Queda(n) §Y[?SIA_propaganda_center_days_remaining_flag:days_left|Y0]§! día(s)"
 SIA_poster_right_days_remaining_text: "Queda(n) §Y[?SIA_propaganda_right_days_remaining_flag:days_left|Y0]§! día(s)"
 SIA_propaganda_campaign_cooldown_tt: "Esta campaña volverá a estar disponible §Y[?constant:propaganda.SIA.default_propaganda_campaign_cooldown] días§! después de retirarla."
 SIA_public_credit_repayment: "Reembolso de créditos públicos"
 SIA_public_credit_repayment_tt: "Pagaremos toda nuestra deuda de créditos públicos de una sola vez, eliminándola por completo a costa de una gran penalización temporal a los §Ybienes de consumo§!."
 idea_SIA_deficit_spending: "Gasto deficitario"
 idea_SIA_deficit_spending_desc: "El gobierno dilapida sin control, contrayendo préstamos con los que financia un programa de construcción acelerada. El desarrollo industrial es palmario, pero luego habrá que pagar la cuenta."
 SIA_print_additional_money: "Imprimir más dinero"
 SIA_print_additional_money_tt: "Imprimiremos más dinero aún para Japón."
 SIA_appeal_to_industrialists: "Llamamiento a los industriales"
 SIA_implement_industrialists_reforms_countdown: "Implementación de reformas industriales"
 SIA_implement_industrialists_reforms_countdown_trigger: "Construir §Y2 fábricas civiles§! (excluyendo las obtenidas por los enfoques y el comercio)"
 SIA_appeal_to_industrialists_tt: "Obtendremos el apoyo de los industriales.\n\nNos ayudarán en la guerra civil, aportándonos más equipo. Sin embargo, esperarán que ampliemos nuestra base industrial y construyamos §Y2§! §Yfábricas civiles§! más a partir de las fábricas que tengamos al final de la guerra civil en un plazo de §Y720 días§! a partir de la toma del poder (excluyendo las fábricas obtenidas por enfoques o comercio).\n\nNo hacerlo supondrá un golpe a la §Yestabilidad§! y al §Yapoyo bélico§!.\n\nAl comenzar la guerra civil obtendremos: "
 SIA_seek_support_from_constitutional_monarchists: "Buscar el apoyo de los monárquicos constitucionales"
 SIA_implement_constitutionalist_reforms_countdown: "Implementar reformas industriales"
 SIA_seek_support_from_constitutional_monarchists_tt: "Obtendremos el apoyo de los monárquicos constitucionalistas.\n\nNos ayudarán en la guerra civil con más divisiones. Sin embargo, esperarán que sigamos siendo una monarquía constitucional, completando el enfoque §Y$SIA_a_constitutional_monarchy$§! en un plazo de §Y720 días§! a partir de la toma del poder.\n\nNo hacerlo supondrá un golpe a la §Yestabilidad§! y al §Yapoyo bélico§!."
 SIA_appeal_to_rural_people: "Llamamiento a la población rural"
 SIA_appeal_to_rural_people_tt: "Obtendremos el apoyo de la población rural.\n\nNos ayudarán en la guerra civil aportando milicias. Sin embargo, esperarán que aprobemos políticas agrarias beneficiosas a cambio, completando el enfoque §Y$SIA_mechanization_of_agriculture$§! o §Y$SIA_reduction_of_agricultural_yield_taxes$§! en un plazo de §Y720 días§! a partir de la toma del poder.\n\nNo hacerlo supondrá un golpe a la §Yestabilidad§! y al §Yapoyo bélico§!.\n\nAl comienzo de la guerra civil obtendremos: "
 SIA_implement_rural_reforms_countdown: "Implementación de reformas rurales"
 SIA_implement_absolutist_reforms_countdown: "Implementación de reformas absolutistas"
 SIA_seek_support_from_absolutists_monarchists: "Buscar el apoyo de los monárquicos absolutistas"
 SIA_seek_support_from_absolutists_monarchists_tt: "Obtendremos el apoyo de los monárquicos absolutistas.\n\nNos ayudarán en la guerra civil generando más divisiones. Sin embargo, esperarán que volvamos a la monarquía absolutista, completando el enfoque §Y$SIA_an_absolute_monarchy$§! en un plazo de §Y720 días§! a partir de la toma del poder.\n\nNo hacerlo supondrá un golpe a la §Yestabilidad§! y al §Yapoyo bélico§!."
 SIA_appeal_to_navy_clique: "Llamamiento a la camarilla de la armada"
 SIA_appeal_to_navy_clique_countdown: "Implementación de reformas en la armada"
 SIA_appeal_to_navy_clique_tt: "Obtendremos el apoyo de la camarilla de la armada.\n\nNos ayudarán en la guerra civil con toda nuestra armada y una división de infantes de marina. Sin embargo, esperarán que aprobemos políticas navales beneficiosas, completando el enfoque §Y$SIA_thonburi_class_coastal_defense_ship$§! en un plazo de §Y720 días§! a partir de la toma del poder.\n\nNo hacerlo supondrá un golpe a la §Yestabilidad§! y al §Yapoyo bélico§!.\n\nAl comenzar la guerra civil obtendremos:\n§YToda nuestra armada§!\nUna división de marines: la §YReal Infantería de Marina de Tailandia§!\nLa tecnología §YMarines§!"
 SIA_appeal_for_support_cat: "Llamamiento de apoyo"
 SIA_appeal_for_support_cat_desc: "Ningún movimiento político triunfa por sí solo. Monárquicos, constitucionalistas, soldados y civiles tienen en sus manos una fracción del país. Su apoyo hay que saber ganárselo, pues llegado el momento de actuar necesitaremos todo el respaldo posible."
 SIA_demand_independence: "Exigir para §Y[FROM.GetName]§! la independencia de §Y[FROM.OVERLORD.GetNameDef]§!"
 SIA_demand_independence_VIN: "Exigir la liberación de §Y[VIN.GetName]§!"
 SIA_demand_independence_VIN_tt: "Exigiremos a quienes subyugan [VIN.GetName] su liberación."
 SIA_demand_independence_LAO: "Exigir la liberación de §Y[LAO.GetName]§!"
 SIA_demand_independence_LAO_tt: "Exigiremos a quienes subyugan a [LAO.GetName] su liberación."
 SIA_demand_independence_CAM: "Exigir la liberación de §Y[CAM.GetName]§!"
 SIA_demand_independence_CAM_tt: "Exigiremos a quienes subyugan a [CAM.GetName] su liberación."
 SIA_invite_to_adc: "Invitar a §Y[FROM.GetName]§! a nuestra facción"
 SIA_asian_democratic_compact_cat: "Conglomerado demócrata asiático"
 SIA_asian_democratic_compact_cat_desc: "Todos los pueblos asiáticos tienen derecho a gobernarse sin injerencias externas. Como adalides de la autodeterminación en Asia, podemos presionar a las potencias coloniales para que liberen a las naciones que tienen secuestradas."
 SIA_khana_ratsadon_cat: "El Khana Ratsadon"
 SIA_khana_ratsadon_cat_desc: "El Khana Ratsadon, partido popular que puso fin a la monarquía absoluta, no es un ente monolítico. Sus alas militar y civil creen en futuros distintos para el país, y la tirantez entre ambas carcome cada decisión que toma el gobierno. Si no se complace a las dos facciones, la coalición no tardará en implosionar."
 SIA_army_navy_reform_cat: "Ejército y armada"
 SIA_army_navy_reform_cat_desc: "El ejército y la armada compiten por el mismo volumen limitado de recursos. Distribuir la financiación entre esas dos ramas es un ejercicio de funambulismo constante, y lo que recibe una, a la otra le falta."
 SIA_divert_army_funds_to_navy_toggle: "[SIA_GetDivertingArmyFundsToNavyTitle]"
 SIA_divert_army_funds_to_navy_toggle_tt: "[SIA_GetDivertingArmyFundsToNavyTitle]"
 SIA_divert_army_funds_to_navy_toggle_do: "Desviar fondos del ejército hacia la armada"
 SIA_divert_army_funds_to_navy_toggle_do_tt: "Desviaremos parte de nuestros fondos del ejército hacia la armada para acelerar su desarrollo."
 SIA_divert_army_funds_to_navy_toggle_undo: "Detener el desvío de fondos del ejército hacia la armada"
 SIA_divert_army_funds_to_navy_toggle_undo_tt: "Ya no desviaremos parte de los fondos del ejército hacia la armada."
 SIA_standing_our_ground_mission: "Mantenernos firmes"
 SIA_standing_our_ground_mission_tt: "Hemos de luchar por nuestra libertad."
 SIA_sway_generals_to_seri_thai_tt: "Los generales a los que hemos convencido para que se unan al Seri Thai se unirán a nosotros cuando comience la guerra civil, en lugar de sumarse a la revuelta lealista."
 SIA_sway_general_cw_scale_tt: "Aumenta nuestro apoyo en la guerra civil en un §Y5%§!\nSi el apoyo supera el §Y80%§!, se evita la guerra civil y tomamos el poder sin oposición."
 SIA_sway_luang_chawengsaksongkhram_to_seri_thai: "Persuadir a Luang Chawengsaksongkhram"
 SIA_sway_luang_chawengsaksongkhram_to_seri_thai_desc: "Convence a Luang Chawengsaksongkhram para que se una a la causa del Seri Thai. Si logramos persuadirlo, se pondrá de nuestro lado cuando comience la guerra civil."
 SIA_sway_aditya_dibabha_to_seri_thai: "Persuadir a Aditya Dibabha"
 SIA_sway_aditya_dibabha_to_seri_thai_desc: "Convence a Aditya Dibabha para que se una a la causa del Seri Thai. Si logramos persuadirlo, se pondrá de nuestro lado cuando comience la guerra civil."
 SIA_sway_mangkorn_phromyothi_to_seri_thai: "Persuadir a Mangkorn Phromyothi"
 SIA_sway_mangkorn_phromyothi_to_seri_thai_desc: "Convence a Mangkorn Phromyothi para que se una a la causa del Seri Thai. Si logramos persuadirlo, se pondrá de nuestro lado cuando comience la guerra civil."
 SIA_sway_luang_haansongkhram_to_seri_thai: "Persuadir a Luang Haansongkhram"
 SIA_sway_luang_haansongkhram_to_seri_thai_desc: "Convence a Luang Haansongkhram para que se una a la causa del Seri Thai. Si logramos persuadirlo, se pondrá de nuestro lado cuando comience la guerra civil."
 SIA_sway_charun_rattanakun_seriroengrit_to_seri_thai: "Persuadir a Charun Rattanakun Seriroengrit"
 SIA_sway_charun_rattanakun_seriroengrit_to_seri_thai_desc: "Convence a Charun Rattanakun Seriroengrit para que se una a la causa del Seri Thai. Si logramos persuadirlo, se pondrá de nuestro lado cuando comience la guerra civil."
 SIA_sway_phichit_kriangsakphichit_to_seri_thai: "Persuadir a Phichit Kriangsakphichit"
 SIA_sway_phichit_kriangsakphichit_to_seri_thai_desc: "Convence a Phichit Kriangsakphichit para que se una a la causa del Seri Thai. Si logramos persuadirlo, se pondrá de nuestro lado cuando comience la guerra civil."
 SIA_sway_jira_wichitsongkhram_to_seri_thai: "Persuadir a Jira Wichitsongkhram"
 SIA_sway_jira_wichitsongkhram_to_seri_thai_desc: "Convence a Jira Wichitsongkhram para que se una a la causa del Seri Thai. Si logramos persuadirlo, se pondrá de nuestro lado cuando comience la guerra civil."
 SIA_sway_phin_choonhavan_to_seri_thai: "Persuadir a Phin Choonhavan"
 SIA_sway_phin_choonhavan_to_seri_thai_desc: "Convence a Phin Choonhavan para que se una a la causa del Seri Thai. Si logramos persuadirlo, se pondrá de nuestro lado cuando comience la guerra civil."
 SIA_sway_tiang_sirikhan_to_seri_thai: "Persuadir a Tiang Sirikhan"
 SIA_sway_tiang_sirikhan_to_seri_thai_desc: "Convence a Tiang Sirikhan para que se una a la causa del Seri Thai. Si logramos persuadirlo, se pondrá de nuestro lado cuando comience la guerra civil."
 SIA_khana_ratsadon_dummy_military: "Riesgo de golpe militar"
 SIA_khana_ratsadon_dummy_military_tt: "Si nuestras políticas nos enemistan con el ejército, este pondrá en marcha un golpe de Estado. A fin de evitar una guerra civil, convendría no tener §Y$idea_SIA_military_rebellious$§! durante demasiado tiempo."
 SIA_khana_ratsadon_dummy_military_desc: "El ejército es una camarilla del partido Khana Ratsadon, con un poder nada desdeñable. Sus oficiales no aprobarán políticas que, a su juicio, atenten contra sus intereses, mientras que toda medida que contribuya a militarizar al país la respaldarán."
 SIA_khana_ratsadon_military_coup_mission: "¡El ejército pretende defenestrar al gobierno!"
 SIA_khana_ratsadon_military_coup_mission_desc: "El ejército entiende que las políticas de este gobierno atentan contra sus intereses. Salvo que se dé un acercamiento entre sus posturas, ya planean derrocar a esta administración."
 SIA_khana_ratsadon_dummy_civilian: "Riesgo de golpe civil"
 SIA_khana_ratsadon_dummy_civilian_tt: "Si nuestras políticas nos enemistan con el ala civil, esta pondrá en marcha un golpe de Estado. A fin de evitar una guerra civil, convendría no tener demasiado tiempo: §Y$idea_SIA_civilian_rebellious$§!."
 SIA_khana_ratsadon_dummy_civilian_desc: "El ala civil es una camarilla del partido Khana Ratsadon, con un poder nada desdeñable. Sus oficiales no aprobarán políticas que, a su juicio, atenten contra sus intereses, mientras que respaldarán toda medida que entiendan como democrática y a favor de la ciudadanía."
 SIA_khana_ratsadon_civilian_coup_mission: "¡El ala civil pretende defenestrar al gobierno!"
 SIA_khana_ratsadon_civilian_coup_mission_desc: "El ala civil entiende que las políticas de este gobierno atentan contra sus intereses. Salvo que se dé un acercamiento entre sus posturas, ya planean derrocar a esta administración."
 SIA_promote_civilian_wing: "Juicio del ala civil"
 SIA_promote_civilian_wing_desc: "Si el gobierno apoya públicamente las enmiendas presentadas por el ala civil en materia de reforma agraria, de las cortes y de la constitución, la facción de Pridi se mostrará agradecida. Pero este favoritismo no pasará desapercibido: estallará el descontento entre el cuerpo de oficiales y surgirán contratiempos en términos administrativos. Por desgracia, esta situación no mejorará hasta que las aguas se calmen."
 SIA_promote_military_wing: "Juicio del ala militar"
 SIA_promote_military_wing_desc: "Si aceptamos las exigencias de los oficiales y alabamos el vigor de las fuerzas armadas, la facción de Phibun se posicionará de nuestra parte. Sin embargo, este favoritismo no pasará desapercibido, pues esta reorganización provocará cambios en las operaciones militares y debilitará la administración, al menos hasta que la situación se estabilice. Nuestro cometido es evitar que el ala se involucre en una revuelta."
 SIA_cultivate_civilian_wing: "Impulsar el ala civil"
 SIA_cultivate_civilian_wing_desc: "La medida de la Directriz de la Oficina del Palacio Real nos ha brindado la oportunidad de establecer un vínculo con el ala civil. No hay lugar para favoritismos que puedan provocar reacciones adversas por su parte. Nuestro objetivo es granjearnos el favor de la facción Pridi poco a poco, concesión tras concesión. Tenemos un largo camino por delante, pero ninguna prisa por recorrerlo."
 SIA_cultivate_military_wing: "Impulsar el ala militar"
 SIA_cultivate_military_wing_desc: "La medida de la Directriz de la Oficina del Palacio Real nos ha brindado la oportunidad de establecer un vínculo con el ala militar. No hay lugar para favoritismos que puedan provocar reacciones adversas por su parte. Nuestro objetivo es granjearnos el favor del cuerpo de oficiales poco a poco, concesión tras concesión. Tenemos un largo camino por delante, pero ninguna prisa por recorrerlo."
 SIA_end_factionalism_mission: "Mantener unida la coalición"
 SIA_end_factionalism_mission_desc: "Ambas alas del Khana Ratsadon han mostrado su §Gapoyo§! al gobierno. Si conseguimos que dure §Y270§! días, las rivalidades entre ellas pasarán a formar parte del pasado. Si el entusiasmo de alguna de ellas flaquea, habremos de empezar de cero."
