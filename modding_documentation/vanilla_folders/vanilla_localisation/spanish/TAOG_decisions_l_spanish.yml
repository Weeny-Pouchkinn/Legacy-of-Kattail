 AST_request_resource_rights_in_indochina: "Solicitar derechos sobre los recursos de la Indochina francesa"
 AST_resource_request_ongoing_flag: "Solicitud de recursos §Yen curso§!"
 AST_australia_first_movement_cat: "Movimiento Australia First"
 AST_summons_to_australian_hall: "Convocatoria del Australian Hall"
 AST_summons_to_australian_hall_desc: "En nuestro empeño por hacer crecer [AST.GetFascistParty], debemos unir y movilizar a nuestros partidarios: el Australian Hall nos espera."
 AST_summons_to_australian_hall_upgrade: "$AST_summons_to_australian_hall$"
 AST_summons_to_australian_hall_upgrade_desc: "$AST_summons_to_australian_hall_desc$"
 AST_print_the_publicist: "Imprimir The Publicist"
 AST_print_the_publicist_desc: "The Publicist, el panfleto del movimiento Australia First, juega un papel importante a la hora de llegar a posibles simpatizantes. Al publicar otro número, podemos difundir nuestro mensaje."
 AST_print_the_publicist_upgrade: "$AST_print_the_publicist$"
 AST_print_the_publicist_upgrade_desc: "$AST_print_the_publicist_desc$"
 AST_call_on_fascists: "[GET_AST_CALL_ON_FASCISTS]"
 AST_call_on_fascists_desc: "Al ser un movimiento pequeño con pocos partidarios, Australia First no siempre cuenta con los recursos suficientes. Sin embargo, un grupo extranjero de ideas afines se ha mostrado dispuesto a financiar nuestras ambiciones; esto supone una solución que garantiza la continuidad de nuestro avance."
 AST_call_on_japanese_fascists: "Llamamiento a los fascistas japoneses"
 AST_call_on_foreign_fascists: "Llamamiento al fascismo internacional"
 AST_a_convenient_disaster: "Un desastre oportuno"
 AST_a_convenient_disaster_desc: "Por muy popular que llegue a ser Australia First, sus postulados ideológicos siempre suscitarán el rechazo de la bancada conservadora. Para que el partido consiga hacerse con el poder, puede que sea necesario llegar a algo más dramático que unas elecciones normales: algo que provoque la inestabilidad del gobierno.\n\nNuestro movimiento carece de medios para lograr algo así, pero el fascismo es una causa que trasciende nuestras fronteras. Si propician nuestro ascenso al poder, los fascistas de otros países podrán contar con [AST.GetName] en sus alianzas."
 AST_a_convenient_disaster_tt: "\nEste evento desestabilizará al gobierno actual, y a la larga §Y[AST.GetFascistParty]§! podrá hacerse con el poder."
 AST_a_convenient_disaster_flag: "La decisión §YUn desastre oportuno§! ha activado §YCatástrofe aérea en Camberra§!."
