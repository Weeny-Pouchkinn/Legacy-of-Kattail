 AST_communism_support_text: "[?party_popularity_100@communism|Y]% de apoyo comunista"
 AST_union_control_1_cat: "Control de los sindicatos"
 AST_union_control_1_cat_desc: "Nuestros sindicalistas han comenzado a movilizar a la población australiana para recabar apoyos en firme. La hoja de ruta consiste en involucrarnos en las legislaturas de cada Estado para ir consolidando feudos a favor de un gobierno comunista. Será necesario hacer un contundente alarde de poder político, y la maniobra bien podría desestabilizar a la nación.\n\nLos veteranos de la Nueva Guardia están al tanto de nuestros movimientos y, si el gobierno no logra reaccionar a tiempo o cunde la inestabilidad, un cisma podría fracturar la nación entera.\n\nApoyo al comunismo: [?party_popularity_100@communism|Y]§Y%§!\n\n§REstallará una guerra civil si la estabilidad baja del 40% o el tiempo de la revuelta de los veteranos si se agota.§!"
 AST_union_control_1_cat_name: "Selecciona dónde suscitar apoyos sindicales"
 AST_union_control_1_map_area_name: "Estados donde aún se puede influir"
 AST_nationalizing_cat: "Nacionalización"
 AST_union_control_2_cat: "Control de los sindicatos"
 AST_union_control_2_cat_desc: "Los obreros de [ROOT.GetNonIdeologyName] no derrocaron a sus opresores para ahora contemplar de brazos cruzados cómo las potencias imperiales subyugan aún hoy a nuestros camaradas. El avance transfronterizo del comunismo no es una aspiración ideológica sin más, sino más bien un imperativo estratégico. Tenemos que avivar las llamas de la revolución a través de los océanos para procurar esperanza y recursos a quienes desean zafarse del yugo imperialista. Y así lo haremos, hasta que el viejo orden ya no tenga dónde aferrarse."
 AST_union_control_2_foreign_cat: "Erradicar el comunismo"
 AST_union_control_tt: "Los sindicatos deben establecerse en los estados de toda Australia; sin embargo, los Veteranos de la Nueva Guardia trabajan para frenar la expansión del comunismo."
 AST_seize_local_leadership_in_state_major: "Aprovechar el liderazgo local en [FROM.GetName]"
 AST_seize_local_leadership_in_state_mid: "Aprovechar el liderazgo local en [FROM.GetName]"
 AST_seize_local_leadership_in_state_low: "Aprovechar el liderazgo local en [FROM.GetName]"
 AST_seize_local_leadership_in_queensland: "Aprovechar el liderazgo local en Queensland"
 AST_union_strike: "Organizar una huelga"
 AST_union_strike_desc: "Nuestros obreros han desertado de sus puestos de trabajo para exigir derechos y condiciones mejores. Estas protestas tienen por objeto presionar al gobierno para que instaure reformas que los contenten."
 AST_veterans_revolt: "Revuelta de los veteranos"
 AST_veterans_revolt_desc: "El ejército alberga a numerosos miembros anticomunistas, muchos de los cuales formaron parte anteriormente de grupos fascistas. Desprecian el comunismo y preferirían tomar las armas antes que verlo prosperar y llegar al poder.\nSi tardamos demasiado en llevar a cabo nuestra revolución, o si la situación se acaba tornando demasiado inestable, tomarán cartas en el asunto para impedirlo."
 AST_organize_in_nation: "Infiltración sindical en §Y[FROM.GetName]§!"
 AST_organize_in_nation_desc: "El movimiento proletario no entiende de fronteras. Si destinamos recursos a las redes de nuestros camaradas, podremos situar a mandatarios comunistas en las directivas sindicales de [FROM.GetName]. De esta manera, arraigará el apoyo a la revolución en el seno de la clase obrera."
 AST_civil_war_in_nation: "Instigar la revolución en §Y[FROM.GetNameDef]§!"
 AST_civil_war_in_nation_desc: "Llega por fin la hora de cosechar los frutos de aquellas semillas que sembramos. La doctrina comunista ha ido cobrando inercia en [FROM.GetName], y la revolución ha dejado ya de ser una lejana utopía. Con financiación, agitadores y una intervención en el momento oportuno, lograríamos convertir el descontento popular en insurrección armada, y [FROM.GetName] se hallará un paso más cerca de su soñada y merecida condición de Estado proletario."
 AST_take_it_to_foreign_streets: "Organizar una marcha internacional de solidaridad obrera"
 AST_take_it_to_foreign_streets_desc: "No existen fronteras que puedan poner coto al proletariado. Vamos a emprender una campaña coordinada a escala internacional: comunistas australianos se harán a las calles de todas las naciones donde gozamos de influencia consolidada. Esta maniobra dará alas a los movimientos locales, y la llama de la revolución arderá más viva que nunca."
 AST_take_it_to_foreign_streets_tt: "Prolonga 60 días la duración de Influencia comunista extranjera en todas las naciones donde nos hemos infiltrado."
 AST_raj_locked_tt: "No se puede abordar el Raj hasta que Nueva Zelanda, Malasia, Birmania, las Filipinas e Indonesia se hayan entregado en su totalidad a gobiernos comunistas."
 AST_supply_arms_to_nation: "Suministrar armas a §Y[FROM.GetName]§!"
 AST_supply_arms_to_nation_desc: "Suministraremos armas a nuestros camaradas."
 AST_strikes_tt: "Solo podrás completar §Y$AST_workers_educational_association$§!, §Y$AST_off_leash$§!, §Y$AST_a_national_housing_commission$§!, §Y$AST_guaranteed_employment$§! y §Y$AST_equal_pay$§! mientras haya una huelga en curso."
 AST_nationalization: "Comenzar nacionalización"
 AST_nationalizing_process_tt: "Habilita la decisión §YComenzar nacionalización§! y aplica §YNacionalización en curso§!. Es necesario para los enfoques que siguen y se elimina al completar §YLa Australia del pueblo§!. §R¡Los enfoques no seleccionados se bloquearán!§!"
 AST_nationalization_underway_tt: "§YNacionalización en curso§! \nRendimiento de fábrica: §R-30%§! \nProducción de los astilleros: §R-30%§!"
 AST_nationalizing_process_ends_tt: "§R¡Al adoptar este enfoque, se bloquearán todos los anteriores!§!"
 AST_union_infiltration_in_progress: "Infiltración sindical foránea en curso"
 AST_cw_operation_in_progress: "Instigando una revolución"
 AST_seize_local_control_tt: "Los comunistas se hacen con el control del estado, lo que garantiza que estarán de nuestra parte si estalla una guerra civil.\n"
