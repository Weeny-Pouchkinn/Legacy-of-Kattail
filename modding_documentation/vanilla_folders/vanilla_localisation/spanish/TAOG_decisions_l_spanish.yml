 AST_sufficient_funds_tt: "Fondos suficientes (alcanzados en §Y[?AST_insufficient_funds:days_left]§! días)."
 AST_sufficient_funds_tt_2: "§GObtén§! suficientes fondos."
 AST_lose_sufficient_funds_tt_100: "§RPierde§! suficientes fondos (durante §Y100§! días).\n"
 AST_lose_sufficient_funds_tt_50: "§RPierde§! suficientes fondos (durante §Y50§! días).\n"
 AST_insufficient_funds: "Fondos insuficientes"
 AST_afm_decisions_fascism_upgrade_tt: "\nAumenta el apoyo al fascismo diario ganado con §Ydecisiones del movimiento Australia First§!.\n\n"
 AST_afm_decisions_autonomy_upgrade_tt: "\nAumenta la autonomía ganada con §Ydecisiones del movimiento Australia First§!.\n\n"
 AST_vichy_out_of_africa_cat: "Vichy fuera de África"
 AST_demand_madagascar: "Exigir Madagascar"
 AST_demand_central_africa: "Exigir África Central"
 AST_demand_southwestern_territories: "Exigir territorios suroccidentales"
 AST_vichy_req_ongoing_flag: "Solicitud de territorio §Yen curso§!"
 AST_remove_vichy_out_of_africa_decisions: "\nElimina las decisiones de §YVichy fuera de África§!.\n"
 AST_big_business_pact_cat: "Pacto de grandes empresas"
 AST_big_business_request_ongoing_flag: "Solicitud de grandes empresas §Yen curso§!"
 AST_naval_expansion: "$NOR_alt_dem_naval_expansion$"
 AST_naval_expansion_desc: "A cambio de que el [ROOT.GetFascistParty] lleve a cabo políticas que les beneficien, las principales figuras empresariales han acordado invertir en reformas para la industria que se alineen con los objetivos del partido.\n\nEs necesario ampliar la flota para que [AST.GetName] tenga alguna posibilidad frente a enemigos de poder naval superior. Durante un tiempo limitado, todas las manos disponibles deberán estar en sus puestos en los astilleros, con el fin de garantizar el aumento de la producción de barcos."
 AST_factory_conversions: "Reconversión industrial"
 AST_factory_conversions_desc: "A cambio de que el [ROOT.GetFascistParty] lleve a cabo políticas que les beneficien, las principales figuras empresariales han acordado invertir en reformas de la industria que se alineen con los objetivos del partido.\n\nHay que dar prioridad a la industria de defensa, por lo que las fábricas australianas deben reconvertirse para apoyarla."
 AST_land_development: "Desarrollo de tierra"
 AST_land_development_desc: "A cambio de que el [ROOT.GetFascistParty] lleve a cabo políticas que les beneficien, las principales figuras empresariales han acordado invertir en reformas de la industria que se alineen con los objetivos del partido.\n\nEn [ROOT.GetName] hay demasiados territorios que siguen sin industrializar y subdesarrollados. Haciendo que esas regiones prosperen las haremos aptas para la construcción."
 AST_electrical_grid_expansions: "Ampliación de la red eléctrica"
 AST_electrical_grid_expansions_desc: "A cambio de que el [ROOT.GetFascistParty] lleve a cabo políticas que les beneficien, las principales figuras empresariales han acordado invertir en reformas de la industria que se alineen con los objetivos del partido.\n\nAl ampliar nuestra red eléctrica, fomentaremos la producción nacional de energía sin depender de las importaciones."
 AST_factory_investments: "Inversiones en fábricas"
 AST_factory_investments_desc: "A cambio de que el [ROOT.GetFascistParty] lleve a cabo políticas que les beneficien, las principales figuras empresariales han acordado invertir en reformas de la industria que se alineen con los objetivos del partido.\n\nSi queremos garantizar que tanto los suministros militares como los civiles sigan siendo suficientes en tiempos de conflicto, debemos ampliar nuestra capacidad industrial."
 AST_develop_port_kemla_steel_medium_decision: "Construcción del segundo alto horno de Port Kembla"
 AST_develop_port_kemla_steel_medium_decision_desc: "Port Kembla ha funcionado bien con un solo alto horno, pero la demanda ha crecido tanto que puede que queramos construir un segundo. Esto aproximadamente duplicará la producción de acero de la región."
 AST_prospect_pilbara_iron_decision: "Abrir la región de Pilbara a la minería"
 AST_prospect_pilbara_iron_decision_desc: "La región de Pilbara posee unas enormes reservas de mineral de hierro, entre las mayores del mundo. Sin embargo, en esta zona tan remota del país, la inversión necesaria para explotar este recurso sería enorme..., aunque también lo serían los beneficios."
 AST_scale_up_pilbara_mines_steel_decision: "Ampliar las minas de Pilbara"
 AST_scale_up_pilbara_mines_steel_decision_desc: "Ahora que la región de Pilbara se ha abierto a la minería a gran escala, es hora de que fluyan las inversiones."
 AST_pilbara_mining_tt: "La apertura de §Y$STATE_870$§! para nuevas prospecciones permitirá replicar la decisión de aumentar sin límites la producción de acero."
 AST_scale_up_middleback_mines_steel_decision_1: "Ampliar la mina de Iron Knob"
 AST_scale_up_middleback_mines_steel_decision_1_desc: "Aunque la mina de Iron Knob lleva un tiempo en activo, con la creciente demanda de mineral de hierro ha llegado el momento de ampliar nuestros esfuerzos en ella."
 AST_scale_up_middleback_mines_steel_decision_2: "Abrir la mina Iron Monarch"
 AST_scale_up_middleback_mines_steel_decision_2_desc: "La mina de Iron Knob no basta para cubrir nuestras necesidades. Por suerte, la cordillera Middleback es rica en hierro. Ya es hora de que abramos allí nuestra mina más grande hasta la fecha."
 AST_scale_up_middleback_mines_steel_decision_3: "Abrir la mina Iron Prince"
 AST_scale_up_middleback_mines_steel_decision_3_desc: "La demanda de metales en tiempos de guerra está en su punto álgido, pero la cordillera Middleback sigue siendo productiva."
 AST_expand_iron_mining_tt: "Disponer tanto de §Y$AST_exports_for_economic_recovery$§! como de §Y$AST_within_reach$§! permitirá explotar la región de Pilbara de §Y$STATE_870$§!, y liberar una fuente casi inagotable de §Yacero§!. Podemos usarlo para impulsar nuestra economía."
 AST_develop_port_kemla_steel_tt: "Esto nos permitirá tomar la decisión §YConstrucción del segundo alto horno de Port Kembla§!, que aumentará significativamente nuestra producción de §Yacero§!."
 AST_develop_middleback_tt: "Esto desbloqueará tres decisiones para desarrollar nuestra producción de §Yacero§! en §Y$STATE_519$§!."
 AST_expand_planned_extraction_pilbara_tt: "§Y$AST_planned_extraction$§! permitirá la explotación de la región de Pilbara, en §Y$STATE_870$§!, lo que dará acceso a una fuente casi inagotable de §Yacero§!. Podemos aprovechar eso para impulsar nuestra economía."
 AST_ireland_weapon_smuggling_cat: "Armar a los irlandeses"
 AST_smuggle_arms_to_ireland: "Contrabando de armas para Irlanda"
 AST_smuggle_arms_to_ireland_desc: "Debemos pertrechar a los irlandeses con las armas que necesitan para combatir a los británicos."
 AST_smuggle_arms_to_ireland_ongoing_flag: "Contrabando de armas §Yen curso§!"
 AST_smuggle_arms_to_northern_ireland: "Contrabando de armas para Irlanda del Norte"
 AST_smuggle_arms_to_northern_ireland_desc: "Si logramos que Irlanda del Norte disponga de armas suficientes y una conexión viable con Irlanda, los británicos no alcanzarán a impedir la unificación con el territorio irlandés."
 AST_northern_ireland_rises_up: "Insurrección en Irlanda del Norte"
 AST_specialize_on_jungle_combat: "Especializarse en maniobras en la selva"
 AST_specialize_on_desert_combat: "Especializarse en maniobras en el desierto"
 AST_switch_combat_specialization: "Cambiar de especialización de combate"
 AST_special_forces_cat: "Entrenamiento de fuerzas especiales"
 AST_you_can_switch_sf: "Podrás cambiar de especialización."
 AST_training_camps_specialization: "Nuestros campamentos de adiestramiento están preparados para brindar entrenamiento especializado a nuestras tropas, preparándolas así para ejercer un desempeño óptimo en escenarios diversos."
 # Formables
 AST_australasia_flag: "Se ha creado §YAustralasia§!"
 AST_australia_formables_category: "Australasia"
 AST_australia_formables_category_desc: "Aunque las raíces de [AST.GetName] siempre nos vincularán al lejano sur, hemos crecido tanto y llegado tan lejos que el resto del mundo ya no puede desestimar nuestras opiniones en lo que a asuntos mundiales se refiere. Nos hemos expandido, pero es posible que nos expandamos aún más, tal y como manifiesta el nuevo nombre con el que hemos bautizado a nuestra nación. Tras nacer del capullo de [AST.GetName], ahora batimos nuestras alas para que el mundo admire y reconozca los colores de esta nueva nación meridional, Australasia."
 AST_form_australasia: "Fundar Australasia"
