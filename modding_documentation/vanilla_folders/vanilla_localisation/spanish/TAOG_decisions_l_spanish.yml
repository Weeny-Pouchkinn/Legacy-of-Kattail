 SIA_PROPAGANDA_CAMPAIGN_TT_CENTER: "[SIA_GetPropagandaCampaignEffects_Center]"
 SIA_PROPAGANDA_CAMPAIGN_TT_RIGHT: "[SIA_GetPropagandaCampaignEffects_Right]"
 SIA_propaganda_campaign_locked_slot_tt: "This propaganda poster slot is currently locked. It can be unlocked by completing the following focus: TODO"
 SIA_propaganda_campaign_empty_slot_tt: "Este espacio para carteles de cine está §Gvacío§!. Se puede §Gactivar§! una nueva £SOV_propaganda_text_icon §Ycampaña de cine§!."
 SIA_poster_left_text: "[SIA_GetDaysRemainingLeft]"
