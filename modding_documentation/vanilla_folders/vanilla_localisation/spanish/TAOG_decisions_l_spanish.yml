 war_escalation_7_or_more_tt: "La intensificación es de al menos §Y7§!."
 war_escalation_8_or_more_tt: "La intensificación es de al menos §Y8§!."
 war_escalation_10_or_more_tt: "La intensificación es de §Y10§!."
 war_escalation_10_max_tt: "La intensificación está por debajo de §Y10§!."
 INS_no_raids_allowed_tt: "§W§RLos asaltos no estarán disponibles mientras esta decisión esté en activo.§!§!"
 INS_is_deescalating_tt: "No está haciendo ya una misión de desescalada"
 INS_escalate_the_conflict: "Intensificar el conflicto"
 INS_escalate_the_conflict_desc: "Organizaremos disturbios y escaramuzas contra las fuerzas enemigas para elevar la tensión e intensificar el conflicto, poniendo las bases para garantizar que actuaciones posteriores más severas se enfrenten a un menor escrutinio internacional."
 INS_escalate_the_conflict_HOL: "$INS_escalate_the_conflict$"
 INS_escalate_the_conflict_HOL_desc: "$INS_escalate_the_conflict_desc$"
 INS_deescalate_the_conflict: "Solicitar mediación internacional"
 INS_deescalate_the_conflict_2: "Ordenar un alto el fuego"
 INS_deescalate_the_conflict_desc: "Los neerlandeses no negociarán con nosotros de buena fe. Para ellos seguimos siendo rebeldes, un estorbo al que acallar más que una nación a tener en cuenta. Pero las grandes potencias del mundo son harina de otro costal, y La Haya no puede ignorarlas tan fácilmente. Pediremos a la comunidad internacional que actúe de mediadora y dejaremos que la presión internacional los convenza, ya que no quieren oír nuestra voz."
 INS_deescalate_the_conflict_2_desc: "Nuestros asaltos han cumplido su misión. La guarnición colonial conoce nuestro alcance y La Haya sabe que no nos amedrentan. Y sin embargo, cada ataque da a los Países Bajos más motivos para enviar más soldados y más barcos, y no estamos preparados para una guerra abierta. Daremos órdenes a nuestros comandantes de que no abran fuego. El siguiente golpe se producirá cuando nosotros lo digamos, no cuando los neerlandeses nos provoquen a ello."
 INS_renville_tt_HOL: "§W§Y[USA.GetFlag][USA.GetNameDefCap]§! nos dará un ultimátum. Si no nos rendimos y nos retiramos de Indonesia, nos §Rdeclararán la guerra§!.§!"
 INS_renville_wont_happen_neutral_tt: "El conflicto terminará antes de que concluyan las negociaciones estadounidenses y no podrán intervenir."
 INS_renville_explain_USA_tt: "Si el conflicto no se ha resuelto en §Y365 días§!:\n\n"
 INS_renville_timer_mission_republic: "Negociaciones del acuerdo de Renville pendientes"
 INS_renville_timer_mission_HOL: "$INS_renville_timer_mission_republic$"
 INS_national_revolution_peace_negotiation: "Negociar la retirada de [FROM.GetName]"
 indonesia_reduce_escalation_1_effect_tooltip_for_min_4: "Reduce en §G1§! la intensificación, hasta un mínimo de §Y4§!."
 INS_ongoing_influence_process: "No está estableciendo aún una base de la milicia"
 INS_current_revolution_strength_3_tt: "Este estado tiene actualmente una §Galta§! actividad miliciana."
 INS_current_revolution_strength_0_tt: "Este estado no tiene actividad miliciana actualmente."
 INS_has_spent_points_trigger_tt: "No se pueden establecer más bases de la milicia."
 INS_national_revolution_cat: "La revolución nacional indonesia"
 INS_national_revolution_cat_desc: "Tras 350 años de tiranía holandesa, hemos tomado cartas en el asunto y declarado la independencia. Los Países Bajos no reconocen nuestra autoridad, siguen gobernando las Indias Orientales como su colonia y nos tratan como criminales.\n\nDebemos seguir tomando el control de más regiones y ciudades importantes y derrocar al gobierno neerlandés desde dentro. Sin embargo, también debemos procurar no ser demasiado agresivos sin la debida planificación, ya que una escalada rápida por nuestra parte podría provocar una acción militar por su parte."
 INS_national_revolution_cat_map: "Instigar insurrecciones como señuelo"
 INS_national_revolution_dutch_cat: "Milicias revolucionarias en las Indias Orientales"
 INS_national_revolution_dutch_cat_desc: "Los revolucionarios de las Indias Orientales han declarado ilegalmente la independencia y han tomado el control de algunas regiones con fuerzas de la milicia. A pesar de nuestros esfuerzos, hemos sido incapaces de restablecer el control en dichas regiones debido al gran número de milicianos presentes.\n\nTenemos que detenerlos antes de que tomen el control de más ciudades y desestabilicen aún más la administración de las Indias Orientales. Aunque podría considerarse una medida extrema, la intervención de fuerzas militares puede ser necesaria si no cejan en su empeño."
 INS_HOL_revolution_not_going_well_tt: "§RSin Batavia no podemos gobernar las Indias Orientales, y no tendremos más remedio que negociar un armisticio con los revolucionarios.§!"
 INS_gradual_escalation_republic: "Escalada gradual"
 INS_gradual_escalation_HOL: "Escalada gradual"
 INS_gradual_escalation_republic_desc: "Las represalias neerlandesas se han recrudecido tras cada uno de nuestros asaltos, y sus patrullas se adentran en distritos que habían abandonado meses atrás. Nuestros comandantes informan de combates más encarnizados en lugares que ya se consideraban pacificados hace tiempo, y nuestras bajan crecen a un ritmo mayor que el del reclutamiento de sus sustitutos. El conflicto se ha extendido a provincias que estaban tranquilas el año pasado."
 INS_gradual_escalation_HOL_desc: "Los informes procedentes de nuestras residencias empeoran a cada semana que pasa. Los rebeldes atacan en distritos en los que creíamos que no actuaban, y el mando militar de Batavia presiona para que tomemos medidas más severas que cualquiera de las intentadas hasta ahora. En La Haya cada vez son menos los que aconsejan tener paciencia con cada reunión del gabinete."
 INS_national_revolution_republic_win_ins_tt: "Las milicias republicanas [INS.GetAdjective] reafirmarán su §Gcontrol de facto§! sobre la región, y el conflicto terminará en una §Gvictoria republicana§!."
 INS_national_revolution_republic_win_hol_tt: "Las milicias republicanas [INS.GetAdjective] reafirmarán su §Rcontrol de facto§! sobre la región, y el conflicto terminará en una §Rvictoria republicana§!."
 INS_national_revolution_dutch_cat_map: "Ver estados ocupados por la milicia"
 INS_take_batavia: "Tomar el control de Java"
 INS_take_batavia_desc: "La codicia de los neerlandeses, que les hizo invertir casi exclusivamente en Java ignorando el resto de las islas orientales, ha convertido a la isla en el talón de Aquiles de toda la colonia. ¡Esa será su perdición! Debemos asaltar Java y destruir las redes de comunicaciones y suministros neerlandesas; así, lograremos restringir la capacidad de operación de la administración de las Indias Orientales."
 INS_hold_batavia_HOL: "Mantener Java"
 INS_hold_batavia_HOL_desc: "Las fuerzas republicanas han iniciado una operación para reubicar a la mayoría de sus fuerzas en Java, en un intento de hacerse con el control de toda la isla. Debemos seguir resistiendo; el movimiento no carece de riesgo y nos ha dado la oportunidad de derrocar a su gobierno si fracasan."
 INS_militias_moestopo_mission: "Moestopo exige un ascenso por sus méritos"
 INS_militias_pki_uprising_mission: "Inevitable insurrección comunista"
 INS_pacific_revolution_cat: "Revolución pacífica"
 INS_instigate_in_country: "Instigar la revolución en [FROM.GetNameDef]"
 INS_instigate_in_country_desc: "Nuestra revolución no terminó cuando el último soldado colonial fue expulsado del territorio [ROOT.GetAdjective]. Los obreros y campesinos de [FROM.GetName] sufren bajo el mismo yugo del que nosotros nos hemos deshecho y, ahora, nos miran como prueba de que se puede vencer al opresor. Les enviaremos a nuestros agitadores, distribuiremos panfletos, financiaremos sus sindicatos y avivaremos la llama del descontento hasta que se den las condiciones para la revolución."
 INS_launch_revolution: "Llamamiento a la revolución"
 INS_launch_revolution_desc: "Las condiciones en [FROM.GetName] son propicias. Nuestros agentes informan de un creciente malestar en las fábricas y los campos, y las células locales del partido están preparadas para actuar. Ha llegado el momento de animar a los obreros y campesinos de [FROM.GetName] a que se alcen y se apoderen de lo que les pertenece por derecho."
 INS_anti_colonialist_bonus: "Extender el sentir anticolonialista en [FROM.GetNameDef]"
 INS_anti_colonialist_bonus_desc: "El pueblo de [FROM.GetName] trabaja incansable en pos de intereses que no son los suyos, sino los de un amo extranjero que solo busca sus propios beneficios. Les recordaremos que la sumisión es una elección y que sus amos no son tan fuertes como parecen."
 INS_revolutionary_sentiment: "Cooperar con revolucionarios [FROM.GetAdjective]"
 INS_revolutionary_sentiment_desc: "Hay quienes ya han emprendido la causa por su cuenta en el seno de [FROM.GetName]. Les falta organización y recursos, pero no convicción. Coordinándonos con estos grupos, podremos acelerar el colapso del orden existente, aunque la inestabilidad resultante haga que el país sea más difícil de gobernar a corto plazo."
 INS_arm_militias: "Armar a las milicias locales [FROM.GetAdjective]"
 INS_arm_militias_desc: "Los panfletos y los discursos solo harán que la revolución emerja solo hasta cierto punto. Cuando llegue el momento, nuestros camaradas de [FROM.GetName] tendrán que ser capaces de luchar. Los excedentes de armas y suministros deben ser enviados de contrabando a las milicias simpatizantes para que las fuerzas de la reacción se enfrenten a una población armada, no indefensa."
 INS_arm_militias_tt: "Si se desencadena una guerra civil, los comunistas empezarán con más divisiones."
 INS_propoganda_mission: "Extender el comunismo por [FROM.GetName]"
 INS_propoganda_mission_desc: "Se enviarán organizadores del partido por todo el territorio de [FROM.GetName] para establecer círculos de lectura, reclutar simpatizantes de entre los miembros de los sindicatos y llevar el mensaje de la revolución a los pueblos. Las semillas que plantemos hoy darán fruto muy pronto."
 INS_abandon_mission: "Abandonar la misión"
 INS_abandon_mission_desc: "Nuestros recursos no son ilimitados, y la lucha en [FROM.GetNameDef] exige más de lo que actualmente podemos dar. Retiraremos a nuestros agentes y reorientaremos nuestros esfuerzos hacia donde más se necesiten."
 INS_aslia_cat: "Unificación del Pacífico"
 INS_integrate_subject: "Integrar a [FROM.GetName]"
 INS_integrate_subject_in_progress: "Ya está integrando a un súbdito"
 INS_can_raid_here_HOL: "Estado asaltable"
 INS_can_raid_here_HOL_tt: "Este estado es un objetivo potencial de un asalto terrestre de la milicia por la República. Si tiene éxito, nos arrebatarán el estado. Para defender el estado de los asaltos, podemos:\n$success_modifier_INS_has_influence_mod_counterplay$\n$success_modifier_INS_defense_modifier_counterplay$\n$success_modifier_INS_naval_dominance_modifier_counterplay$\n- Aumentar la §Ysuperioridad aérea§!\n- Reducir la información de los enemigos\n- Reducir la resistencia en el estado"
 INS_war_escalation_text: "£generic_war_escalation_text_icon Nivel de escalada: §Y[?INS.INS_war_escalation_level]§!"
 INS_war_escalation_level_tt: "§YEscalada actual§!\n\nEl nivel de escalada aumenta con el tiempo, y también por las milicias §Yque ocupan nuevos estados§!, así como por las medidas que toma [HOL.GetNameDef] para combatir la actividad de esas milicias. Si la situación escala lo suficiente, puede convertirse en una §Rguerra total§!."
 INS_war_escalation_1_tt: "§Y[INS.GetName]§!: Desbloquea asaltos terrestres."
 INS_war_escalation_2_tt: "§Y[INS.GetName]§!: Desbloquea la decisión para ordenar un alto el fuego."
