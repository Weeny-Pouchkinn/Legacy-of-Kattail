 idea_AST_civil_war_on_their_own: "Por nuestra cuenta"
 idea_AST_civil_war_on_their_own_desc: "Debemos luchar solos en esta guerra."
 ast_foreign_communist_influence_idea: "Influencia comunista extranjera"
 ast_foreign_communist_influence_idea_desc: "¡Los comunistas de Australia están influyendo en nuestras políticas!"
 open_mae_moh_lignite_mine: "Abrir la mina de lignito de Mae Moh"
 SIA_release_contigency_funds: "Liberar los fondos de contingencia"
 SIA_release_contigency_funds_tt: "Modifica §Y$idea_SIA_contingency_funds$§! en\n"
 SIA_release_contigency_funds_tt2: "durante §Y[?var:SIA_contingency_funds]§! meses. Al final los fondos desaparecerán. Cuanto más tiempo reunamos fondos en tiempos de paz, más durarán en tiempos de guerra."
 has_released_contingency_funds: "Ha liberado fondos de contingencia"
 AST_election_approaching_cat: "Elecciones inminentes"
 AST_election_approaching_cat_desc: "El gobierno apenas ha tenido tiempo de alcanzar cierta estabilidad, pero se avecinan ya los próximos comicios. Los partidos demócratas se afanan en arañar apoyos a ultranza, pues los necesitarán todos para hacerse con la victoria cuando los centros electorales abran sus puertas y las urnas empiecen a llenarse de papeletas."
 AST_final_reforms_mission: "Reformas finales"
 AST_final_reforms_mission_desc: "Gracias a un liderazgo estable, a sus tendencias conservadoras y a su lealtad hacia Gran Bretaña, el PAU ha reforzado su apoyo y tiene más probabilidades de renovar mandato. Para seguir contando con el apoyo público, sus líderes han de implementar reformas cuanto antes.\n\n§YEfectos mientras esté en activo:§!\n§W(Enfoques §Ydemocráticos§!):\nel tiempo para completarlo se reduce en §Y7§! días§!."
 AST_final_reforms_effect_tt: "\nEfectos mientras §Y$AST_final_reforms_mission$§! esté en activo (§Y180§! días):"
 AST_labor_campaign_tour_mission: "Gira de campaña laborista"
 AST_labor_campaign_tour_mission_desc: "En su empeño por representar a todos los ciudadanos, el PLA ha adoptado una perspectiva diferente sobre el imperialismo y la lealtad de Australia al Imperio. Las necesidades nacionales deben ser lo primero: los intereses extranjeros no deben tener prioridad.\n\nPara que el mensaje les llegue tanto al partido gobernante como a los votantes, el PLA debe embarcarse en una gira de campaña por todo el país.\n\n§YEfectos mientras esté en activo:§!\n§WAumento diario de votos para el §YPLA§!: §G+0,05§!§!"
 AST_labor_campaign_tour_effect_tt: "\nEfectos mientras §Y$AST_labor_campaign_tour_mission$§! esté en activo (§Y180§! días):\nAumento diario de votos para el §YPLA§!: §G+0,05§!\n\nEfectos al cabo de §Y180§! días:"
 AST_election_season_cat: "Temporada electoral"
 AST_election_season_cat_desc: "En cuanto un gobierno toma posesión, ya está preparándose el siguiente para sustituirlo. A estas alturas, poco podemos hacer para persuadir al pueblo, aunque los partidos lo intentarán. Todavía no está todo perdido: el resultado se decidirá en las urnas."
 AST_election_countdown: "Cuenta atrás para las elecciones"
 AST_election_countdown_desc: "Estamos a días de que se abran los colegios electorales.\n\n§W$AST_expected_election_winner_tt$§!"
 AST_government_formation_period: "Periodo de formación del gobierno"
 AST_government_formation_period_desc: "Todos los partidos quieren el poder para implantar sus propias políticas, pero, si las circunstancias así lo requieren, quizá la opción más razonable sea la implantación de un gobierno de unidad nacional.\n\n§W§YEfectos mientras esté en activo:§!\n£GFX_trigger_yes $AST_election_recently_concluded$\n\nEs posible que el $AST_ruling_party$ forme un §Ygobierno de unidad nacional§!.\n\nCrea un §Ygobierno de unidad nacional§! en la ventana de elecciones democráticas, en el árbol de enfoque australiano.§!"
 AST_war_is_coming_cat: "Se avecina la guerra"
 AST_war_is_coming_cat_desc: "Las tensiones se recrudecen por momentos, y tanto los funcionarios como la ciudadanía australiana empiezan a vislumbrar una guerra que, por muy contrarios que sean a ella sus políticas o intereses, se antoja ya inevitable.\n\nDebemos convocar una asamblea del gabinete donde se formalicen los protocolos en caso de invasión. Antes, no obstante, tal vez resulte oportuno tomar medidas que no serán del agrado del gabinete."
 AST_seize_civilian_industry: "Decomisar la industria civil"
 AST_seize_civilian_industry_desc: "Los bienes de consumo son imprescindibles para nuestros ciudadanos y la economía, esa es una verdad monolítica, pero tampoco podemos hacer oídos sordos a los menesteres en tiempos de guerra. El conflicto es inminente; qué menos que estar preparados."
 AST_scorch_the_north: "Quemar las tierras del norte"
 AST_scorch_the_north_desc: "Si sospechamos que se producirá una invasión por el norte, existen medidas estratégicas para entorpecerla, aunque su drasticidad entraña un coste. Quemar las tierras septentrionales supondría un grave menoscabo a su desarrollo, pero tal vez sea necesario para frenar el avance del invasor."
 AST_scorch_the_north_tt: "§YEfectos tras la invasión naval de un Estado del norte:§!"
 AST_the_brisbane_line: "La línea de Brisbane"
 AST_the_brisbane_line_desc: "Cabe suponer que Australia carece de capacidad defensiva suficiente para poner coto a una agresión externa. Si adoptamos una política que concentre nuestros medios en proteger enclaves vitales en lugar de dispersar nuestros recursos por todo el territorio, nos será más fácil conservar bajo nuestro control las zonas de mayor desarrollo y población de [AST.GetName].\n\nAunque semejante política, sin duda, será objeto de rechazo para quienes no aceptan rendición alguna, la prioridad de este gobierno no puede ser otra que conducir a [AST.GetName] con sensatez y responsabilidad."
 AST_summon_the_cabinet_mission: "Llamar al gabinete"
 AST_summon_the_cabinet_mission_desc: "Que diplomáticos, funcionarios y teóricos acudan a Camberra, pues hay que abordar el tema de una posible invasión."
 AST_summon_the_cabinet_tt1: "\nEste evento alterará el gobierno actual, llevando potencialmente a su §Ycaída§!."
 AST_australian_accusations_modifier: "Australia nos acusa"
 AST_cabinet_trust_cat: "Confianza en el gabinete"
 AST_cabinet_trust_increase_tt: "\n§GAumenta§! la §Yconfianza en el gabinete§!.\n"
 AST_cabinet_trust_decrease_tt: "\n§RDisminuye§! la §Yconfianza en el gabinete§!.\n"
 AST_cabinet_trust_remove_tt: "§GElimina§! el §Yespíritu de confianza en el gabinete§!."
 AST_australian_comforts_fund: "£BoP_right_texticon  Australian Comforts Fund"
 AST_australian_comforts_fund_desc: "El gobierno honrará a una de las víctimas del accidente aéreo de Camberra invirtiendo en la asociación Australian Comforts Fund, con la que la esposa superviviente colaboraba de manera entusiasta.\n\nLa asociación pretende aliviar el tiempo que los soldados australianos pasan en el campo de batalla. Les envían vituallas que complementen sus raciones militares y botiquines personales y, así, el esfuerzo bélico se beneficiará también de la inversión."
 AST_eminent_successors: "£BoP_right_texticon  Sucesores eminentes"
 AST_eminent_successors_desc: "Algunas de las víctimas de la catástrofe aérea de Camberra eran funcionarios muy respetados. Aunque no hay forma de compensar su terrible destino, tal vez el nombramiento de algunos sucesores eminentes estabilizaría el gobierno y restablecería la confianza tanto del pueblo como de los ministros."
 AST_critics_to_shame: "£BoP_right_texticon  Críticos abyectos"
 AST_critics_to_shame_desc: "La catástrofe aérea de Camberra ha afectado a toda la nación y no ha dejado australiano sin enlutar. En momentos como este, siempre habrá quien intente aprovecharse. Desenmascararemos a los críticos más ruidosos por lo que realmente representan sus críticas: un intento de alterar el orden."
 AST_approach_the_independents: "£BoP_left_texticon  Acercamiento a los independientes"
 AST_approach_the_independents_desc: "El gobierno es inestable, ya que la fe en su capacidad para guiar a Australia a través de la reciente agitación se desvanece día a día. Si nos acercamos a los independientes, puede que los convenzamos de que un cambio de gobierno sería lo mejor."
 AST_a_sound_voice: "£BoP_left_texticon  Una voz resonante"
 AST_a_sound_voice_desc: "En este periodo de agitación política, una voz firme parece inspirar confianza entre los australianos. ¿Será acaso la del próximo líder de [AST.GetName]?"
 AST_challenge_government_narrative: "£BoP_left_texticon  Impugnar la narrativa del gobierno"
 AST_challenge_government_narrative_desc: "Los detalles compartidos por el gobierno en relación con el desastre aéreo de Camberra parecen inusuales, lo que inevitablemente lleva a especular con la posibilidad de que se haya ocultado alguna información. ¿Cómo pudo un experimentado oficial de la Real Fuerza Aérea Australiana estrellarse con su avión en condiciones de vuelo ideales? Hay que exigir respuestas al gobierno."
 AST_make_a_common_enemy: "Crear un enemigo común"
 AST_make_a_common_enemy_desc: "Las voces suspicaces se han multiplicado tras la pérdida de los funcionarios que perecieron en la catástrofe aérea de Camberra. Las insólitas circunstancias del accidente no son el único factor que alienta la sospecha de una implicación extranjera; al fin y al cabo, nada une más que un enemigo común."
 AST_make_a_common_enemy_tt: "§RPosibles efectos del evento:§!"
 AST_ensure_cabinet_loyalty: "Ganarnos la lealtad del gabinete"
 AST_ensure_cabinet_loyalty_desc: "La amenaza de una moción de censura no supondrá ningún peligro mientras la mayoría del gabinete vote a favor del gobierno en funciones. Garantizaremos la lealtad del gabinete."
 AST_castle_crumbling_mission: "Confianza en entredicho"
 AST_castle_crumbling_mission_desc: "Australia mira a sus dirigentes tras la trágica catástrofe aérea de Camberra. ¿Seguirá mereciendo el gobierno actual la confianza de la opinión pública, incluso tras la pérdida de miembros del gabinete, o sería mejor un cambio de liderazgo?"
 AST_castle_crumbling_mission_event_tt: "§YEfectos del evento:§!"
 AST_castle_crumbling_mission_complete_tt: "Completa la misión §YConfianza en entredicho§!."
 AST_cabinet_trust_complete_1_flag: "Ha tomado una decisión: §YCrear un enemigo común§!"
 AST_cabinet_trust_complete_2_flag: "Ha tomado una decisión: §YGarantizar la lealtad del gabinete§!"
 AST_cabinet_trust_complete_not_tt: "No ha adoptado el enfoque §YAustralia First§!."
 AST_canberra_air_disaster_flag: "$AST_canberra_air_disaster_events.1.t$"
 AST_war_angst_cat: "Desasosiego por la guerra"
 AST_deteriorating_prime_minister_nerves_mission: "Estrés del primer ministro en aumento"
 AST_deteriorating_prime_minister_nerves_desc: "[AST.GetLeader] está sufriendo la tensión de la inevitable guerra. Si no encuentra un cierto alivio pronto, puede que sus nervios no lo soporten."
 AST_australian_demands_cat: "Exigencias australianas"
 AST_aid_australian_military_construction: "Ayuda a la creación del ejército australiano"
 AST_aid_australian_military_construction_desc: "Gran Bretaña no está preparada para la guerra. Al ayudar a Australia con la creación de su ejército, podemos aliviar su impaciencia."
 AST_japanese_war_mission: "Guerra con Japón"
 AST_japanese_war_mission_desc: "Australia no quiere enfrentarse sola a su abrumador enemigo, [JAP.GetNameDef]. Nos presionan para que demos el primer paso y resolvamos el inminente conflicto lo antes posible."
 AST_resource_acquisition_cat: "Obtención de recursos"
 AST_request_resource_rights_in_indonesia: "Solicitar derechos sobre los recursos de [INS.GetNameDef]"
 AST_request_resource_rights_in_malaya: "Solicitar derechos sobre los recursos de [MAL.GetNameDef]"
