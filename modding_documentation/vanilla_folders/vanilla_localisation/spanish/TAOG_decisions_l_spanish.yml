l_spanish:
 HOL_recall_conrad_helfrich: "Retirar a Conrad Helfrich de las Indias"
 HOL_recall_conrad_helfrich_desc: "En estos tiempos acuciantes, la patria debe ser nuestra prioridad absoluta. Conrad Helfrich, el más loable de los almirantes de la Armada Real Holandesa, debe regresar a los Países Bajos de inmediato."
 INS_is_taking_volksraad: "Está aprobando una ley actualmente en el Volksraad"
 INS_volksraad_cat: "El Volksraad"
 INS_volksraad_cat_desc: "El Consejo del Pueblo, conocido en neerlandés como Volksraad, se creó en 1918 en un intento de llevar la democracia a las Indias Orientales, en el marco de la aplicación de las llamadas \"políticas éticas\". Los escaños están ocupados por funcionarios neerlandeses e indonesios, seleccionados por diversos medios. Mientras que los Países Bajos mantienen un derecho de veto incondicional, el Volksraad puede hacer llegar mociones y proyectos de ley al gobierno."
 INS_volksraad_allow_language_in_schools: "Permitir el idioma indonesio en las escuelas"
 INS_volksraad_allow_language_in_schools_desc: "El acceso a la enseñanza superior en las Indias Orientales se limita en gran medida a los neerlandeses y a las clases acomodadas de indonesios que hablan neerlandés, ya que es el único idioma en el que se imparte dicha enseñanza superior. Hay una moción en curso en el Volksraad, a la espera del voto del gobernador general, para abrir escuelas en el idioma indonesio."
 INS_volksraad_allow_language_in_government: "Permitir el idioma indonesio en el gobierno"
 INS_volksraad_allow_language_in_government_desc: "Los cargos gubernamentales en las Indias Orientales, incluido el Volksraad, exigen todos el dominio del idioma neerlandés, lo que ha llevado a muchos miembros del Volksraad, especialmente a los representantes de las comunidades nativas, a cuestionar la validez de su democracia. Han elaborado una moción que insiste en que los cargos gubernamentales deben poder ocuparlos indonesiohablantes, siempre que sea posible."
 INS_volksraad_remove_education_quotas: "Suprimir el sistema de cuotas en la educación"
 INS_volksraad_remove_education_quotas_desc: "El sistema educativo de las Indias Orientales funciona actualmente mediante unas cuotas educativas, según las cuales debe aceptarse un determinado número de estudiantes indonesios y un cierto número de estudiantes neerlandeses. Esto ha resultado controvertido en el Volksraad debido a la creencia común de que hay un sesgo injusto a favor de los neerlandeses. Aunque podríamos dejar que el Volksraad siguiera discutiendo durante años sobre cómo reformar el sistema, tal vez valdría la pena abolir el sistema de cuotas por completo."
 INS_volksraad_reduce_rubber_export_tax: "Reducción del impuesto privado a la exportación de caucho"
 INS_volksraad_reduce_rubber_export_tax_desc: "En la actualidad, las empresas privadas que exportan caucho están sujetas a impuestos muy elevados, lo que nos permite mantener el monopolio del mercado. Sin embargo, esto ha provocado un estancamiento económico en algunas regiones debido a que las plantaciones privadas no pueden funcionar. Se consideró que valía la pena en el momento de su aplicación, pero el proteccionismo internacional de la Gran Depresión ha hecho que nuestra economía de exportación de caucho sea mucho menos lucrativa. Puede que debamos considerar reducir el impuesto para estimular la economía."
 INS_volksraad_knil_rank_limit: "Aprobar leyes contra la discriminación en mandos militares"
 INS_volksraad_knil_rank_limit_desc: "Aunque no existe ninguna norma formal que impida a los indonesios ascender en el KNIL, sí hay una norma no escrita que lo prohíbe, lo que limita incluso a los militares con mejor rendimiento a no poder progresar más allá de la categoría de coronel. Varios partidos del Volksraad han estado presionando al gobierno para que reconozca los méritos de los oficiales indonesios de alto rendimiento."
 INS_volksraad_legalize_displaying_flag: "Legalizar la exhibición de la bandera rojiblanca"
 INS_volksraad_legalize_displaying_flag_desc: "Actualmente es ilegal exhibir en público la bandera roja y blanca de Indonesia debido a sus conexiones con organizaciones nacionalistas y anticolonialistas. Legalizar su exhibición sería a buen seguro una demostración de nuestra voluntad de cooperar y frenaría la progresiva radicalización de los nacionalistas en todo el archipiélago."
 INS_volksraad_education_subsidies_for_indonesians: "Subvenciones abiertas a la educación para no residentes en los Países Bajos"
 INS_volksraad_education_subsidies_for_indonesians_desc: "En el seno del Volksraad se ha mantenido un debate sobre las subvenciones y becas concedidas a los estudiantes neerlandeses residentes en las Indias Orientales. Varios representantes de las comunidades nativas en el Volksraad han defendido que este sistema debería ampliarse a todos los estudiantes, con independencia de su procedencia. Esto nos granjearía muy buena \"prensa\" entre la población, aunque no sería barato."
 INS_volksraad_indonesian_national_language: "Convertir el indonesio en la lengua nacional oficial"
 INS_volksraad_indonesian_national_language_desc: "El indonesio se ha convertido en una lengua común en muchas partes del archipiélago, lo que ha permitido salvar las distancias lingüísticas entre varias culturas. Ahora que el indonesio se ha aceptado en los ámbitos de la educación y la administración, muchos representantes del Volksraad han solicitado su reconocimiento legal como lengua oficial de la colonia, en igualdad de condiciones con el neerlandés."
 INS_volksraad_official_flag: "Oficializar la bandera indonesia"
 indonesia_volksraad_official_flag_effect_tt: "La rojiblanca pasará a ser nuestra bandera."
 INS_volksraad_official_flag_desc: "Las mociones del Volksraad a favor de la autonomía han acabado triunfando, y la región que hasta hace pocos años se conocía como las Indias Orientales Neerlandesas es ahora el Dominio de Indonesia. Nuestra bandera debería adaptarse para representar estos cambios."
 indonesia_volksraad_passed_6: "Ha aprobado leyes contra la discriminación en el ejército"
 INS_autonomy_indonesian_in_schools: "Idioma indonesio permitido en las escuelas"
 INS_autonomy_indonesian_in_govenment: "Idioma indonesio permitido en el gobierno"
 INS_autonomy_no_education_quotas: "Cuotas en la educación abolidas"
 INS_autonomy_reduced_rubber_tax: "Impuesto a la exportación de caucho reducido"
 INS_autonomy_knil_rank_limit: "Leyes contra la discriminación en el ejército aprobadas"
 INS_autonomy_flag_legalized: "Exhibición de la bandera rojiblanca legalizada"
 INS_autonomy_education_subsidies: "Subsidios de educación a disposición de los indonesios"
 INS_autonomy_national_language: "Idioma indonesio reconocido"
 INS_autonomy_official_flag: "Bandera indonesia en vigor"
 INS_move_capital_to_amsterdam: "Trasladar la capital a Ámsterdam"
 INS_move_capital_to_batavia: "Trasladar la capital a Batavia"
 INS_sukarno_is_dead: "Sukarno ha muerto"
 INS_atjeh_management: "Acción policial en Atjeh"
 INS_atjeh_management_2: "Incorporar Atjeh"
 INS_soetardjo_petition: "Petición de Soetardjo pendiente de aprobación"
 INS_soetardjo_petition_desc: "Se ha celebrado la mesa redonda convocada por Soetardjo, en la que se ha llegado a la conclusión de que [INS.GetNameDef] debe cumplir una serie de requisitos económicos que garanticen la autosuficiencia. Debemos demostrar un progreso claro hacia estos objetivos o, de lo contrario, [HOL.GetNameDef] acabará anulando la decisión para mantener el statu quo."
 INS_soetardjo_petition_refresh_tt: "Reactiva la misión: §YPetición de Soetardjo pendiente de aprobación§! con una duración de §Y120 días§!."
 INS_soetardjo_pending: "El Volksraad debate la petición de autonomía de Soetardjo"
 INS_soetardjo_pending_desc: "Soetardjo es un miembro del Volksraad conocido por liderar el movimiento nacionalista pacífico. Actualmente, está organizando una petición para que se conceda más autonomía a [INS.GetNameDef] y para que se organice una mesa redonda entre representantes holandeses e indonesios, con el fin de debatir el deseo de los indonesios de ser autónomos como parte de una mancomunidad holandesa. Esta petición se está debatiendo actualmente en el seno del Volksraad. Una vez concluidos estos debates, tendremos que decidir cómo responder, ya que las consecuencias de la petición son de gran trascendencia."
 INS_flag_legalized: "Es legal exhibir la bandera rojiblanca"
 INS_owned_states_at_game_start_tt: "Todos los estados indonesios"
 INS_win_condition_base_republic_warning: "Destruir las Indias Orientales"
 INS_win_condition_base_republic_warning_desc: "Debemos seguir luchando, reclutando civiles y asegurándonos de que la llama que arde dentro de cada alma indonesia siga ardiendo. Una vez que derroquemos a la administración indonesia, [HOL.GetNameDef] no tendrá más remedio que rendirse."
 INS_win_condition_base_republic_real: "Destruir las Indias Orientales"
 INS_win_condition_base_republic_real_desc: "Debemos seguir luchando, reclutando civiles y asegurándonos de que la llama que arde dentro de cada alma indonesia siga ardiendo. Una vez que derroquemos a la administración indonesia, [HOL.GetNameDef] no tendrá más remedio que rendirse."
 will_complete_when_conditions_met_tt: "Se seleccionará automáticamente una vez cumplidos los requisitos."
 INS_militias_cat: "Laskar Rakyat"
 INS_militias_basic_summon: "Movilizar a la población civil"
 INS_militias_basic_summon_desc: "Reclutaremos a adultos jóvenes y estudiantes entregados a la causa de la independencia de Indonesia para que se unan a las milicias armadas del TKR."
 INS_militias_kris_repayment: "Las milicias KRIS exigen inversiones en Célebes"
 INS_militias_di_mission: "El Darul Islam exige representación"
 INS_militias_jakarta_pemuda_mission: "Los jóvenes de Yakarta exigen una mejora de la educación"
 INS_militias_railway_pemuda_mission: "La Fuerza Juvenil Ferroviaria exige combatir"
 INS_revolution_planning_cat: "Revolución clandestina"
 INS_revolution_planning_hq: "Establecer el cuartel general revolucionario en [FROM.GetName]"
 INS_revolution_planning_hq_desc: "Estableceremos el cuartel general de nuestras milicias en [FROM.GetName]; funcionará como mando central para las bases de las milicias de todo el archipiélago. Nuestro cuartel general y su entorno tendrán prioridad en las misiones de infiltración y estarán bajo nuestro férreo control."
 INS_revolution_planning_hq_tt: "Ha construido como máximo §Y3§! cuarteles generales revolucionarios."
 INS_revolution_planning_hq_DONE: "Cuarteles generales revolucionarios"
 INS_revolution_planning_hq_DONE_desc: "Este es nuestro cuartel general revolucionario, al que responden nuestras milicias. Este estado estará bajo nuestro control en cuanto declaremos la independencia."
 INS_revolution_planning_hq_DONE_trigger_tt: "Solo se puede establecer un cuartel general."
 INS_revolution_planning_envoy_DONE_trigger_tt: "No se pueden establecer varias bases en el mismo estado."
 INS_revolution_planning_envoy_DONE: "Base de la milicia en [FROM.GetName]"
 INS_has_revolutionary_hq: "Ha establecido un cuartel general revolucionario"
 INS_revolution_planning_influence_state: "Establecer la base de la milicia en [FROM.GetName]"
 INS_revolution_planning_influence_state_desc: "Enviaremos milicias a [FROM.GetName] para establecer una base de la milicia, lo que garantizará que los revolucionarios locales puedan comunicarse con el cuartel general y les resulte más fácil ejecutar las operaciones cuando declaremos la independencia."
 INS_revolution_planning_cat_map_name: "Selecciona dónde quieres gestionar la actividad de la milicia."
 INS_state_revolution_hq_tt: "Nosotros controlaremos el estado cuando declaremos la independencia."
 INS_hq_warning: "§W§RInstalar aquí nuestro cuartel general es difícil y consumirá la mayor parte de nuestros recursos.§!§!"
 INS_revolution_points_remaining_tt: "Puede construir al menos §Y1§! base de la milicia más (actualmente quedan §Y[?INS_revolution_points_remaining]§!)."
 INS_revolution_planning_influence_state_points_notif_tt: "Podremos establecer una base de la milicia en §Y[?INS_starting_revolution_points_count]§! estados adicionales §Rno javaneses§!."
 INS_revolution_planning_influence_state_points_notif_tt_1: "Solo podremos establecer una base de la milicia en §Y1§! estado adicional §Rno javanés§!."
 INS_revolution_point_spend_tt: "Se establece una base de la milicia en [FROM.GetName]."
 INS_revolution_points_in_state_tt: "[FROM.GetName] no tiene aún ninguna base de la milicia."
 war_escalation_1_or_more_tt: "La intensificación es de al menos §Y1§!."
 war_escalation_2_or_more_tt: "La intensificación es de al menos §Y2§!."
 war_escalation_3_or_more_tt: "La intensificación es de al menos §Y3§!."
