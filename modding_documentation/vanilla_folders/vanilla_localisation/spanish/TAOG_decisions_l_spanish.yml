 SIA_war_fervor_cat: "Fervor bélico"
 SIA_war_fervor_cat_desc: "La sed de conflicto del pueblo es un arma de doble filo. Si no se controla como es debido, el fervor bélico se vierte contra el propio sistema: un gobierno que alienta a la guerra sin un objetivo claro se arriesga a ser el blanco de la misma ira que provoca."
 SIA_war_fervor_coup_dummy: "Fervor bélico en ebullición"
 SIA_war_fervor_coup_dummy_desc: "Si las ansias de guerra que tiene la población no se encauzan hacia un objetivo válido, tarde o temprano recaerán sobre nosotros."
 SIA_urge_restraint: "Instar a la moderación"
 SIA_war_fervor_coup: "Golpe de Estado inminente"
 SIA_modify_cultural_mandates: "Modifica $idea_SIA_thai_cultural_mandates$ en:"
 SIA_mandate_1: "Primer mandato"
 SIA_mandate_1_desc: "El país se llamará Tailandia, y tailandeses serán los habitantes de esta gran nación."
 SIA_mandate_1_tt: "§Y[THIS.GetName]§! pasará a conocerse como §Y$SIA_thailand$§!."
 SIA_mandate_2: "Segundo mandato"
 SIA_mandate_2_desc: "Los tailandeses no se involucrarán en empresa alguna sin antes detenerse a sopesar los beneficios y la seguridad de la nación.\n\nLos tailandeses jamás han de revelar a extranjeros información que puedan redundar en perjuicio de la nación. Tal acto se considerará traición nacional.\n\nLos tailandeses no ejercerán de agente ni portavoz de extranjeros sin antes ponderar el beneficio de la nación tailandesa, ni expresarán su parecer acerca de posturas foráneas en disputas internacionales. Tales actos se considerarán traición nacional.\n\nLos tailandeses no comprarán veladamente tierras en nombre de extranjeros si ello entraña riesgo para la nación. Tal acto se considerará traición nacional.\n\nCuando un tailandés traiciona a la nación, el pueblo tiene el deber de impedirlo con inmediatez y contundencia."
 SIA_mandate_3: "Tercer mandato"
 SIA_mandate_3_desc: "Quedan abolidos todos los gentilicios que poco o nada tienen que ver con la nacionalidad, por mucho que diversos colectivos los prefieran.\n\nSe aludirá al pueblo de Tailandia con el gentilicio \"tailandés\", sin subdivisiones que lo fragmenten."
 SIA_mandate_4: "Cuarto mandato"
 SIA_mandate_4_desc: "Al ver la bandera nacional izada o arriada, según mande la tradición gubernamental, oír la corneta o el silbido de salutación, o cuando se dé la orden de izar o arriar la bandera, esta ha de ser honrada en virtud de las leyes o tradiciones.\n\nCuando se entona el himno nacional, ya sea con fines oficiales o en ocasión de una ceremonia, los participantes y asistentes lo honrarán en virtud de las leyes o tradiciones.\n\nSi alguien no manifestase el respeto debido, se le ha de amonestar a fin de hacerle entender la importancia de honrar la bandera nacional, el himno nacional y el himno real."
 SIA_mandate_5: "Quinto mandato"
 SIA_mandate_5_desc: "El pueblo tailandés procurará en la medida de lo posible consumir únicamente alimentos derivados de productos tailandeses.\n\nEl pueblo tailandés procurará en la medida de lo posible vestir únicamente prendas derivadas de productos tailandeses.\n\nEl pueblo tailandés tratará de promover y contribuir a la labor agrícola, comercial, industrial y demás profesiones de sus compatriotas.\n\nEl pueblo tailandés procurará en la medida de lo posible usar y promover el uso de servicios públicos instaurados por el gobierno o el pueblo tailandés.\n\nEl pueblo tailandés que ejerza la agricultura, el comercio, la industria y demás profesiones amparadas por este mandato se comprometerá a mantener mínimos de calidad, mejorarla en la medida de lo posible y regirse por la honestidad."
 SIA_mandate_6: "Sexto mandato"
 SIA_mandate_6_desc: "El himno nacional no será otro que el compuesto por Phra Chenduriyang, tal y como se encuentra recogido en el Departamento de Bellas Artes.\n\nLa letra del himno nacional será la propuesta por el ejército."
 SIA_mandate_7: "Séptimo mandato"
 SIA_mandate_7_desc: "Todo ciudadano tailandés debe contribuir al proyecto nacional. Todo individuo capacitado físicamente deberá dedicarse a una profesión estable. Quien no ejerza una profesión estable es un lastre para la nación y no merece el respeto de sus compatriotas."
 SIA_mandate_8: "Octavo mandato"
 SIA_mandate_8_desc: "Se abreviará la letra del himno nacional, y los términos \"Siam\" y \"siamés\" quedan sustituidos por los términos \"Tailandia\" y \"tailandés\"."
 SIA_mandate_9: "Noveno mandato"
 SIA_mandate_9_desc: "El pueblo tailandés ensalzará, honrará y respetará el idioma tailandés, cuya habla no es menos que un privilegio.\n\nEstudiar el idioma nacional es el deber de todo buen ciudadano tailandés, y saberlo leer y escribir se considerará un mínimo indispensable. Será también el deber de la ciudadanía ayudar e impulsar el aprendizaje de todo compatriota que no hable tailandés o no sepa leerlo.\n\nPara el pueblo tailandés, el lugar de nacimiento, residencia o el acento de una región dada no será jamás un factor divisorio. Todos viviremos con la certeza de que todos los nacidos tailandeses compartimos la misma sangre y el mismo idioma, sin importar la región de procedencia y el acento de cada cual.\n\nEs el deber de todo tailandés manifestar una conducta ejemplar, así como acuciar y educar a quienes aún desconozcan sus deberes de buenos ciudadanos tailandeses."
 SIA_mandate_10: "Décimo mandato"
 SIA_mandate_10_desc: "Todo buen tailandés se presentará en ceremonias, encuentros y cualquier acontecimiento público dentro de los confines urbanos con una vestimenta apropiada. Entiéndase por inapropiado vestir tan solo ropa interior, llevar el pecho descubierto o envolverse tan solo con harapos.\n\nEntiéndase por vestimenta apropiada: uniformes, siempre y cuando la posición y la oportunidad lo faculten, indumentaria correcta según cánones internacionales y atuendos tradicionales."
 SIA_mandate_11: "Undécimo mandato"
 SIA_mandate_11_desc: "El pueblo tailandés dividirá su jornada en tres franjas: una para el trabajo, otra para actividades personales y la última para el descanso y el sueño. Este horario ha de ser racional e implantarse como rutina común.\n\nEl pueblo tailandés desempeñará sus actividades personales corrientes de la siguiente manera: las comidas serán no más de cuatro al día y se regirán por un horario determinado. Al sueño se dedicarán entre seis y ocho horas.\n\nTodo tailandés ejercerá su profesión con brío y sin rehuirla. El descanso a media jornada y el intervalo dedicado almorzar no excederán la hora de duración. Al concluir la jornada, se dedicará una hora como mínimo al deporte u otras actividades como la jardinería, el cuidado de animales o la forestación. Luego, tras asearse, tendrá lugar la cena.\n\nEl tiempo de ocio nocturno se destinará a ejercer labores necesarias, conversar con parientes y allegados, adquirir conocimientos a través de la radio o la lectura, u otras actividades artísticas y de ocio, según permitan las circunstancias."
 SIA_mandate_12: "Duodécimo mandato"
 SIA_mandate_12_desc: "En espacios y vías públicas, el buen ciudadano asistirá y protegerá a los niños, ancianos y discapacitados.\n\nQuien se ciña a la primera norma merecerá el respeto del pueblo tailandés."
 SIA_movie_theater_cat: "$SIA_sala_chaloem_thai_movie_theater$"
 SIA_movie_theater_cat_desc: "De las herramientas de un estado moderno, la gran pantalla es sin duda una de las más poderosas. Al proyectar según qué películas y orquestar campañas de propaganda, el gobierno es capaz de moldear la opinión pública, incentivar el patriotismo y acallar las voces disidentes."
 SIA_celebrating_the_constitution: "Celebrar la Constitución"
 SIA_the_revolution_of_24th_june: "La Revolución del 24 de Junio"
 SIA_suppressing_the_rebellion_of_1933: "Sofocar la Rebelión de 1933"
 SIA_the_king_of_krung_thon: "El rey de Krung Thon"
 SIA_blood_of_suphan: "Sangre de Suphan"
 SIA_thai_soldiers_blood: "Sangre de soldados tailandeses"
 SIA_undauntedly_love_nation: "La nación del amor impávido"
 #LIMITED WAR
 SIA_limited_war_cat: "Guerra limitada"
 SIA_limited_war_cat_desc: "Pretender triunfar en una guerra abierta contra las grandes potencias vecinas es poco menos que un despropósito. Por ahora. Si vamos ganando terreno político palmo a palmo mediante campañas estudiadas, erosionaremos su autoridad a la vez que desarrollamos nuestro poder nacional."
 SIA_start_limited_war_indochina: "Iniciar una guerra limitada en Indochina contra [FROM.GetName]"
 SIA_start_limited_war_indochina_tt_main: "Da comienzo una §Yguerra limitada§! contra §Y[FROM.GetName]§!.\nSi llegáramos a controlar todos los estados resaltados que pertenecen a §Y[FROM.GetName]§!, nos podríamos adueñar de ellos sin necesidad de una guerra a gran escala.\n§RPerder más del [?var:global.limited_war_surrender_threshold|%.0] de progreso de rendición nos hará perder la guerra limitada.§!\n\n§RAl perder la guerra limitada podríamos vernos obligados a devolver territorios previamente conquistados.§!"
 SIA_start_limited_war_rejoin_faction: "Abandonaremos temporalmente la facción actual y volveremos a unirnos una vez concluida la §Yguerra limitada§!."
 SIA_start_limited_war_can_join_faction: "Nos podremos unir a facciones de nuevo una vez concluida la §Yguerra limitada§!."
 is_not_engaged_in_a_limited_war: "No participa en una §Yguerra limitada§!"
 SIA_limited_war_indochina: "[SIA_GetLimitedWarTarget]"
 SIA_limited_war_indochina_desc: "Logra controlar todos los estados destacados para ganar la §Yguerra limitada§! sin necesidad de llegar a una guerra a gran escala como tal.\n§RPerder más del [?var:global.limited_war_surrender_threshold|%.0] de progreso de rendición nos hará perder la guerra limitada.§!"
 SIA_limited_war_indochina_target: "§YGuerra limitada§! contra §Y[?var:limited_war_target.GetName]§!"
 SIA_limited_war_indochina_no_target: "Guerra limitada fallida"
 SIA_start_limited_war_malaysia_burma: "Iniciar una guerra limitada contra [FROM.GetName]"
 SIA_new_territories_administration_cat: "Administración de nuevos territorios"
 SIA_new_territories_administration_cat_desc: "Conquistar territorios no es más que el comienzo de un largo andar. Será necesario destinar recursos a administrar, desarrollar y defender dichos territorios para que entren a formar parte integrante de la nación. De lo contrario, nunca dejarán de ser un lastre y presa fácil para su reconquista."
 SIA_finish_the_triangular_defense_network: "Completar la red triangular de defensa"
 SIA_finish_the_triangular_defense_network_desc: "Terminadas las dos fortalezas del norte y el sur, podemos combinarlas con la de Bangkok para componer una red triangular de defensa. Si una cayera, las otras la suplirán."
 has_built_fortress_saigon: "Fortaleza construida en Saigón"
 has_built_fortress_hanoi: "Fortaleza construida en Hanói"
 SIA_develop_phibunsongkhram: "Desarrollar [1067.GetName]"
 SIA_develop_southern_indochina: "Desarrollar el sur de Indochina"
 SIA_develop_northern_indochina: "Desarrollar el norte de Indochina"
 SIA_develop_northern_malaya: "Desarrollar Si Rat Malai"
 SIA_develop_eastern_burma: "Desarrollar Saharat Thai Doem"
 SIA_use_abandoned_french_tools: "Aprovechar el instrumental francés"
 SIA_use_abandoned_french_tools_desc: "Al abandonar los territorios ocupados, los franceses dejaron diversas herramientas pesadas que vendrán muy bien a nuestra causa."
 SIA_fortress_saigon: "Fortaleza de Saigón"
 SIA_fortress_saigon_desc: "Hanói será la escollera que proteja el norte de nuestro nuevo imperio. Con montañas al norte y el río Rojo enfrente, goza de una posición idónea para contener al posible invasor."
 SIA_fortress_hanoi: "Fortaleza de Hanói"
 SIA_fortress_hanoi_desc: "El sur del imperio lo protegerá Saigón, ciudad fortificada que servirá de guardiana a Bangkok y velará por la seguridad del golfo de [ROOT.GetName] frente al invasor."
 SIA_propaganda_poster_slot_available_tt: "Tiene un espacio para carteles de cine vacío."
