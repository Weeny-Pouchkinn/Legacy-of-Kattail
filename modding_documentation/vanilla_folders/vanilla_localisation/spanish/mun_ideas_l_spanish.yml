 CZE_sudetenland_paramilitaries_modifier: "Actividad paramilitar en los Sudetes"
 CZE_sudetenland_paramilitaries_modifier_desc: "Los partisanos y paramilitares de los Sudetes están diezmando nuestras fuerzas en esta región. Están atacando activamente a nuestras tropas y colaborando con nuestros enemigos."
