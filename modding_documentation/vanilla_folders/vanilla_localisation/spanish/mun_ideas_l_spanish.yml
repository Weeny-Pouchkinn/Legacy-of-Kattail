 #National Spirits
 CZE_taticek_of_czechoslovakia: "Tatíček Masaryk"
 CZE_taticek_of_czechoslovakia_desc: "Tomáš Masaryk, a menudo llamado \"Tatíček Masaryk\", que significa \"papá\" o \"padre\" (de la nación), ha sido uno de los pilares fundamentales de la nación checoslovaca desde su fundación. Cuando se creía que las coaliciones eran imposibles y los estancamientos políticos demasiado grandes para superarlos, Masaryk logró numerosos milagros políticos que ayudaron a fortalecer y convertir a Checoslovaquia en lo que es hoy. Incluso tras su jubilación, los líderes políticos se toman sus opiniones y sugerencias más como órdenes que como consejos."
 CZE_industrialists_veto: "Veto de los industrialistas"
 CZE_industrialists_veto_desc: "Los industriales ejercen una influencia considerable en la política del país, ya que están a la cabeza de muchos de los mayores conglomerados de [CZE.GetNameDef]. No se pueden ignorar sus cuitas en cuestiones de política económica, y la movilización económica es una de las medidas a las que se opondrían con más fiereza."
 CZE_agrarian_politics_1: "Políticas agrarias"
 CZE_agrarian_politics_1_desc: "A pesar de la naturaleza industrial de nuestro país, los agricultores y campesinos de las zonas rurales gozan de una influencia considerable en muchos partidos políticos. Sus opiniones suelen influir en las decisiones de la política económica y suponen un obstáculo constante para los avances industriales."
 CZE_directorate_of_fortification_works_no_gd_idea: "Dirección de Obras de Fortificación"
 CZE_directorate_of_fortification_works_no_gd_idea_desc: "El $CZE_directorate_of_fortification_works_no_gd_idea$, más conocido como el ROP, es la entidad administrativa encargada de supervisar los trabajos de fortificación en el país."
 CZE_czech_corporatism: "Corporativismo checo"
 CZE_broken_shield: "Escudo roto"
 CZE_redirected_fortification_council_funds: "Fondos de fortificación redirigidos"
 CZE_army_readiness_1: "Ejército poco preparado"
 CZE_army_readiness_1_desc: "La preparación de un ejército no se limita a los hombres y el equipo sobre el campo de batalla. Cuando hay que afrontar amenazas, es importante confiar en los preparativos y contar con el respaldo de los líderes políticos e industriales del país. Tener los medios para luchar es una cosa, pero la capacidad de hacerlo de manera eficaz es otra muy distinta."
 CZE_army_readiness_3: "Ejército preparado"
 CZE_army_readiness_3_desc: "La preparación de un ejército no se limita a los hombres y el equipo sobre el campo de batalla. Cuando hay que afrontar amenazas, es importante confiar en los preparativos y contar con el respaldo de los líderes políticos e industriales del país. Tener los medios para luchar es una cosa, pero la capacidad de hacerlo de manera eficaz es otra muy distinta."
 CZE_ready_for_anything_idea: "Listos para cualquier cosa"
 CZE_sudeten_german_quandary: "El dilema de los Sudetes"
 CZE_sudeten_german_quandary_desc: "Aunque la mayoría de los habitantes de los Sudetes lo único que quieren es una mayor autonomía bajo el actual gobierno, muchos partidos políticos de los Sudetes y sus seguidores podrían formar con rapidez una quinta columna a la espera de que otro estado alemán quiera anexionarse cualquier parte de la región."
 CZE_sudeten_german_quandary_modifier_tt: "§YEfecto pasivo§!:\nSi §Y[AUS.GetFlag][AUS.GetNonIdeologyName]§!, §Y[GER.GetFlag][GER.GetNonIdeologyName]§! o cualquier otro [BAY.GetFlag]§Ypaís germano§! con frontera con nosotros justifica o gana un §Robjetivo de guerra§! sobre nosotros mientras controlamos a §Y[69.GetName]§!, §Y[972.GetName]§! o §Y[74.GetName]§!:\n - (§YTodos los Estados de los Sudetes controlados§!):\n    Añade §Y$CZE_sudetenland_paramilitaries_modifier$§! que garantiza:\n       $MODIFIER_LOCAL_INTEL_TO_ENEMIES$: §R+10 %§!\n       $MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$: §R-10,0 %§!\n       $modifier_state_repair_speed_bunker_factor$: §R-10,00 %§!\n\n - Este §Yefecto§! solo puede ocurrir una vez"
 CZE_sudeten_challenge: "El desafío de los Sudetes"
 CZE_sudeten_challenge_desc: "La actividad reciente de los paramilitares de los Sudetes dentro de sus fronteras ha llevado a muchos miembros de la comunidad internacional a creer que las agresivas acciones que se están llevando a cabo contra nosotros están justificadas. Llevará tiempo convencer al mundo de lo contrario."
 CZE_sudeten_facde: "La farsa de los Sudetes"
 CZE_sudeten_facde_desc: "Al no haber apoyado a los paramilitares locales, ahora todo el mundo considera las justificaciones por nuestras acciones contra [CZE.GetName] una farsa."
