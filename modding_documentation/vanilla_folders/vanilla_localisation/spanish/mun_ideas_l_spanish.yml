 #Dynamic Modifiers National Spritits
 CZE_ceskoslovenska_armada_dynamic_modifier: "Československá Armáda"
 CZE_ceskoslovenska_armada_dynamic_modifier_desc: "La armada se formó a partir de las cenizas de las unidades checas austrohúngaras y los veteranos de la legión checoslovaca. El legado de ambos sigue influyendo en el funcionamiento de la armada."
 CZE_ceskoslovenske_letectvo_dynamic_modifier: "Československé Letectvo"
 CZE_ceskoslovenske_letectvo_dynamic_modifier_desc: "Puede que los aviones no siempre estén listos, pero nuestros pilotos sí lo están. Con posibles amenazas aéreas en todas las direcciones, debemos convertir el aire en nuestro mar. Cada piloto debe valer por tres."
 CZE_a_divided_nation_dynamic_modifier: "Nación dividida"
 CZE_a_divided_nation_dynamic_modifier_desc: "El Estado [CZE.GetAdjective] se ha mantenido como un Estado pluralista único en Europa Central que ha protegido a todos los que residen dentro de sus fronteras. Sin embargo, la Gran Depresión ha cambiado esta situación. Las dificultades económicas han provocado la aparición de resentimientos contra el gobierno por parte de diversos movimientos dentro del país que están dividiendo profundamente a la nación."
 CZE_skoda_works_dynamic_modifier: "Škoda"
 CZE_skoda_works_dynamic_modifier_desc: "La empresa Škoda abarca la producción, la construcción y las inversiones en todos los sectores de nuestra industria pesada. Su alcance no conoce fronteras dentro de nuestro país."
 CZE_ceskoslovenske_alecne_lodstvo_dynamic_modifier: "Československé válečné loďstvo"
 #Dynamic State Modifiers
 CZE_sudetenland_german_state_modifier: "Separatismo en los Sudetes"
 CZE_sudetenland_german_state_modifier_desc: "Las dificultades económicas de los últimos tiempos han afectado a la industria de los Sudetes, lo que ha provocado que los habitantes de la región culpen al gobierno de [ROOT.GetName] de sus recientes desgracias."
 CZE_tesinko_polish_state_modifier: "Separatismo polaco"
 CZE_czech_state_modifier: "Escasez de mano de obra cualificada checa"
 CZE_czech_state_modifier_desc: "El rápido desarrollo económico del siglo XX ha supuesto una gran carga para la población checa, mayoritariamente agraria. Es difícil cubrir los puestos de trabajo con mano de obra checa cualificada y especializada. Es necesario emprender acciones para ayudar a preparar a los jóvenes checos para las necesidades cambiantes de una economía moderna."
