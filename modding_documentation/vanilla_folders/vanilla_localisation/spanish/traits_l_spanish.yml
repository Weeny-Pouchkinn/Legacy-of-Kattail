 personal_agenda_von_hesse: "\n£GFX_power_balance_texticon §Y$personal_agenda$§!"
 losing_soverignty_threatened_tt: "§RSoberanía finlandesa amenazada§!: La pérdida de control sobre un estado esencial finlandés disminuirá la £GFX_power_balance_texticon §Yconfianza pública§!."
 FIN_personal_agenda_svinhufvud_tt: "§GErradicar el socialismo§!: Tener menos del §Y1%§! de apoyo a las ideologías $democratic$ y $communism$ aumentará la £GFX_power_balance_texticon §Yconfianza pública§!. \n - §RApoyo preocupante a los socialistas§!: Tener más del §Y9%§! de apoyo a las ideologías $democratic$ o $communism$ disminuirá la £GFX_power_balance_texticon §Yconfianza pública§!. \n - $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_kallio_tt: "§GErradicar el extremismo§!: Tener menos del §Y1%§! de apoyo a las ideologías $fascism$ y $communism$ aumentará la £GFX_power_balance_texticon §Yconfianza pública§!. \n - §RApoyo preocupante a los socialistas§!: Tener más del §Y9%§! de apoyo a las ideologías $fascism$ o $communism$ disminuirá la £GFX_power_balance_texticon §Yconfianza pública§!. \n - $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_ryti_tt: "§GSueño de la Gran Finlandia§!: la ocupación de estados esenciales finlandeses propiedad de un enemigo aumentará la £GFX_power_balance_texticon §Yconfianza pública§!. \n - §RApoyo preocupante a los socialistas§!: Tener más del §Y9%§! de apoyo a las ideologías $democratic$ o $communism$ disminuirá la £GFX_power_balance_texticon §Yconfianza pública§!. \n - $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_mannerheim_tt: "§GLíder fiable§!: Estar en guerra aumentará la £GFX_power_balance_texticon §Yconfianza pública§!. \n - §RRegente designado§!: Estar en paz disminuirá la £GFX_power_balance_texticon §Yconfianza pública§!."
 FIN_personal_agenda_paasikivi_tt: "§GConservador realista§!: Tener más del §Y95%§! de £GFX_stability_texticon $stability$ aumentará la £GFX_power_balance_texticon §Yconfianza pública§!. \n - §RResponsable§!: Tener menos del §Y60%§! de £GFX_stability_texticon $stability$ disminuirá la £GFX_power_balance_texticon §Yconfianza pública§!. \n - $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_annala_tt: "§GNación fuerte§!: Tener más de §Y300.000§! £GFX_manpower_texticon  $MANPOWER$ en el campo y menos del §Y5%§! de progreso de rendición estando en guerra aumentará la £GFX_power_balance_texticon §Yconfianza pública§!.\n - §RApoyo preocupante a los socialistas§!: Tener más del §Y9%§! de apoyo a las ideologías $democratic$ o $communism$ disminuirá la £GFX_power_balance_texticon §Yconfianza pública§!.\n - $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_tanner_tt: "§GNación unida§!: Controlar §YKarjala§! y todos los Estados en posesión mientras hay más del §Y95%§! de apoyo a la ideología $democratic$ aumentará la £GFX_power_balance_texticon §Yconfianza pública§!.\n - §RApoyo preocupante a los extremistas§!: Tener más del §Y9%§! de apoyo a las ideologías $fascism$ o $communism$ disminuirá la £GFX_power_balance_texticon §Yconfianza pública§!.\n - $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_aaltonen_tt: "§GCruzada antifascista§!: Tener más del §Y10%§! de participación en todas las guerras activas y menos del §Y5%§! de progreso de rendición estando en guerra contra un país fascista aumentará la £GFX_power_balance_texticon §Yconfianza pública§!.\n  - §RProletariado dividido§!: Tener menos del §Y80%§! de apoyo a la ideología $communism$ disminuirá la £GFX_power_balance_texticon §Yconfianza pública§!.\n  - $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_leino_tt: "§GFascismo europeo erradicado§!: Tener menos del §Y1%§! de apoyo a la ideología $fascism$ mientras Europa se mantiene libre de gobiernos fascistas aumentará la £GFX_power_balance_texticon §Yconfianza pública§!.\n  - §RProletariado dividido§!: Tener menos del §Y80%§! de apoyo a la ideología $communism$ disminuirá la £GFX_power_balance_texticon §Yconfianza pública§!.\n  - $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_kuusinen_tt: "§GUn sistema solar de organizaciones§!: Tener todos los §Yestados esenciales escandinavos§! y §Ybálticos§! controlados por Finlandia o un aliado aumentará la £GFX_power_balance_texticon §Yconfianza pública§!.\n  - §RCareliofineses olvidados§!: No controlar los Estados de §YKarjala§!, §YKola§!, §YOnega§! y §YOlonets§! disminuirá la £GFX_power_balance_texticon §Yconfianza pública§!.\n  - $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_von_hesse_tt: "§GSueño de la Gran Finlandia§!: la ocupación de estados esenciales finlandeses propiedad de un enemigo aumentará la £GFX_power_balance_texticon §Yconfianza pública§!. \n - §RApoyo preocupante a los socialistas§!: Tener más del §Y9%§! de apoyo a las ideologías $democratic$ o $communism$ disminuirá la £GFX_power_balance_texticon §Yconfianza pública§!. \n - $losing_soverignty_threatened_tt$"
