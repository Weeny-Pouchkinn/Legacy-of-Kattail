l_french:
 ##CZECHOSLOVAKIA##
 MUN_czech_skoda_priority.t: "Les usines Škoda"
 MUN_czech_skoda_priority.d: "Les usines Škoda produisent une large gamme de produits ; artillerie, chars, trains ou encore canons navals, leur polyvalence leur permet d'attribuer rapidement les ressources là où elles sont demandées. Nous possédons désormais notre mot à dire dans l'attribution de ces ressources."
 MUN_czech_skoda_priority.1.a: "Intéressant..."
 MUN_czech.2.t.1: "Les paramilitaires des Sudètes demandent de l'aide"
 MUN_czech.2.t.2: "Les corps libres des Sudètes demandent de l'aide"
 MUN_czech.2.t.3: "Les milices prolétaires des Sudètes demandent de l'aide"
 MUN_czech.2.d.1: "Depuis l'annonce de nos projets pour [CZE.GetLeLaLNP] [CZE.GetName], certains partis politiques des Sudètes ont formé leurs propres groupes paramilitaires dans le but de mettre à mal le gouvernement [CZE.GetAdjMS]. Ils nous demandent notre soutien dans l'exécution de raids et d'actes de sabotage sur le territoire qui devraient faciliter notre campagne contre les [CZE.GetHabitants]."
 MUN_czech.2.d.2: "Depuis l'annonce de nos projets pour [CZE.GetLeLaLNP] [CZE.GetName], les partis politiques des Sudètes ont formé les corps libres des Sudètes dans le but de mettre à mal le gouvernement [CZE.GetAdjMS]. Ils nous demandent notre soutien dans l'exécution de raids et d'actes de sabotage sur le territoire qui devraient faciliter notre campagne contre les [CZE.GetHabitants]."
 MUN_czech.2.d.3: "Depuis l'annonce de nos projets pour [CZE.GetLeLaLNP] [CZE.GetName], les partis politiques communistes sur place ont formé des milices prolétaires dans le but de mettre à mal le gouvernement [CZE.GetAdjMS]. Ils nous demandent notre soutien dans l'exécution de raids et d'actes de sabotage sur le territoire qui devraient faciliter notre campagne contre les [CZE.GetHabitants] et autres contre-révolutionnaires."
 MUN_czech.2.a: "C'est d'accord"
 MUN_czech.2.b: "Évitons de les légitimer"
 MUN_czech.3.t: "Actes partisans des Sudètes"
 MUN_czech.3.d: "En réponse au projet d'annexion [FROM.GetAdjMS] des Sudètes, des groupes paramilitaires issus de la région se sont lancés dans une guerre partisane contre notre gouvernement. Ils commencent à s'en prendre aux bâtiments officiels ainsi qu'à nos défenses. Si nous voulons reprendre l'avantage militaire dans ces zones, nous allons devoir neutraliser ces groupes de rebelles."
 MUN_czech.3.a: "Ça ne pouvait pas plus mal tourner"
 MUN_czech.4.t: "Crise de confiance"
 MUN_czech.4.d: "La nouvelle menace militaire envers notre nation a ébranlé tout le gouvernement. [CZE.GetLeader] n'a plus aucune confiance en son ministère et le pense incapable de gérer cette crise. Nous avons donc demandé à $CZE_jan_syrovy$ de remédier à la situation en lui offrant les pleins pouvoirs. Malgré sa réticence à accepter, $CZE_jan_syrovy$ s'est vu contraint d'endosser ce nouveau rôle, sur ordre de [CZE.GetLeader]."
 MUN_czech.4.a: "Nous avons besoin de lui"
 MUN_czech.4.b: "Gardons la tête froide"
 MUN_czech.5.t: "Mort de Tomáš Masaryk"
 MUN_czech.5.d: "Masaryk a été l'une des figures politiques les plus fiables du paysage tchécoslovaque durant pas moins de vingt ans. À l'époque où tout le monde pensait les coalitions inconcevables et les impasses politiques insurmontables, il a su, à maintes reprises, réaliser de véritables miracles pour renforcer la politique de la Tchécoslovaquie. La nation tout entière regrette amèrement sa disparition."
 MUN_czech.5.a: "C'était un géant de la politique"
 MUN_czech.7.t: "Revoir nos engagements envers [CZE.GetLeLaLNP] [CZE.GetName]"
 MUN_czech.7.d: "Nous venons d'apprendre que [GER.GetLeLaLNP] [GER.GetName] cherch[GER.GetEEntNP] à annexer les Sudètes, quitte à entrer en guerre contre [CZE.GetLeLaLNP] [CZE.GetName] pour y parvenir. Nous avons signé un accord de défense avec les [CZE.GetHabitants], ce qui signifie qu'en cas de conflit, nous serions enrôlés de force. Évitons cette déconvenue en nous retirant de cet accord avec [CZE.GetLeLaLNP] [CZE.GetName] au plus vite."
 MUN_czech.7.a: "Nous soutenons nos alliés"
 MUN_czech.7.b: "Les [GER.GetHabitants] vont nous anéantir !"
 MUN_czech.1001.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] exig[FROM.GetEEntNP]\nune voie vers [SOV.GetLeLaLNP] [SOV.GetName]"
 MUN_czech.1001.d: "\n[FROM.GetLeLaLNPCap] [FROM.GetName] souhait[FROM.GetEEntNP] obtenir les régions frontalières de [89.GetName] et de [91.GetName] afin de pouvoir coordonner des actions militaires avec [SOV.GetLeLaLNP] [SOV.GetName]."
 MUN_czech.1002.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] souhait[FROM.GetEEntNP]\nobtenir de l'influence sur la Ligue yougoslave"
 MUN_czech.1002.d: "Au sortir de [FROM.GetSaLeurNP] campagne d'expansion vers le sud, [FROM.GetLeLaLNP] [FROM.GetName] nous [FROM.GetAOntNP] adressé une requête très particulière : ce ne sont pas des terres qui sont demandées, mais le contrôle de la Ligue yougoslave. Les [FROM.GetHabitants] souhaitent devenir les suzerains des pays du nord des Balkans, des dépendances qui nous appartiennent. Selon eux, ils seraient de bien meilleurs protecteurs. Nous ne voyons dans ces paroles rien de plus que des prétextes."
 MUN_czech.1002.a: "Ils ont peut-être raison"
 MUN_czech.1002.b: "Non, ce sont nos dépendances !"
 MUN_czech.1003.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] rejett[FROM.GetEEntNP]\nnos demandes"
 MUN_czech.1003.d: "\nMalgré les arguments plus que convaincants de nos diplomates, [FROM.GetLeLaLNP] [FROM.GetName] refus[FROM.GetEEntNP] de céder à nos demandes."
 MUN_czech.1003.a: "Nous n'avons plus le choix"
 MUN_czech.1004.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] lanc[FROM.GetEEntNP]\nune offensive sur la Hongrie"
 MUN_czech.1004.d: "\nLa nouvelle vient d'arriver à [ROOT.Capital.GetCapitalVictoryPointName] : les troupes [FROM.GetAdjFP] s'avancent vers la frontière [HUN.GetAdjFS]. Nous allons sûrement recevoir une délégation [HUN.GetDuDelaDelNP] [HUN.GetName], alors commençons à réfléchir à l'idée de [HUN.GetLuiLeurNP] venir en aide pour obtenir un nouvel allié, ou bien à laisser [FROM.GetLeLaLNP] [FROM.GetName] poursuivre ses plans."
 MUN_czech.1004.a: "Protégeons nos intérêts !"
 MUN_czech.1004.b: "Ne nous mêlons pas à ça..."
 MUN_czech.1005.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] exig[FROM.GetEEntNP]\ndes littoraux"
 MUN_czech.1005.d: "\nDans [FROM.GetSaLeurNP] conquête effrénée, [FROM.GetLeLaLNP] [FROM.GetName] nous [FROM.GetAOntNP] envoyé un détachement diplomatique qui nous demande de [FROM.GetLuiLeurNP] céder des terres qui [FROM.GetLuiLeurNP] reviennent de droit et offrirait un accès direct à la mer Adriatique. Ils n'ont pas l'air de se soucier de notre avis."
 MUN_czech.1006.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] propos[FROM.GetEEntNP]\nun partenariat"
 MUN_czech.1006.d: "\nUne délégation [FROM.GetAdjFS] nous a contactés pour nous proposer un traité de défense mutuel, dissuadant ainsi toute tentative d'offensive sur nos nations. Nous avons découvert une section cachée dans le traité, stipulant un accroissement potentiel de l'influence [ROOT.GetAdjFS] que [FROM.GetLeLaLNP] [FROM.GetName] s'engag[FROM.GetEEntNP] à soutenir."
 MUN_czech.1007.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] exig[FROM.GetEEntNP]\nun alignement"
 MUN_czech.1007.d: "La méfiance entre notre nation et la nation [FROM.GetAdjFS] l'a contrainte à exiger que nous nous rangions de son côté, au risque de subir une invasion. Malgré les menaces, elle propose aussi de nous aider à obtenir les terres que nous convoitons, à l'exception des siennes."
 MUN_czech.1007.b: "Protégeons notre souveraineté !"
 MUN_czech.1008.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] propos[FROM.GetEEntNP]\nde s'allier [CZE_invited_country.GetAuAlaAlNP] [CZE_invited_country.GetName]"
 MUN_czech.1008.d: "\nDes représentants [FROM.GetDuDelaDelNP] [FROM.GetName], notre contact en Europe centrale, nous proposent d'élargir notre alliance en y invitant [CZE_invited_country.GetLeLaLNP] [CZE_invited_country.GetName]."
 MUN_czech.1008.a: "Plus personne n'osera nous provoquer"
 MUN_czech.1008.b: "Nous n'allons pas défendre toute l'Europe, non plus"
 MUN_czech.1009.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] nous invit[FROM.GetEEntNP]\ndans la faction [CZE.GetFactionName]"
 MUN_czech.1009.d: "\nDes diplomates [FROM.GetAdjMP] nous ont invités à rejoindre leur alliance. Pourtant, nos revendications territoriales sont un point de contention majeur avec [FROM.GetLeLaLNP] [FROM.GetName]. À nous de décider si nous poursuivons nos objectifs de conquête ou si nous préférons nous faire des alliés."
 MUN_czech.1009.a: "À nos nouveaux alliés !"
 MUN_czech.1009.b: "Nous accepterons une fois les terres à nous"
 MUN_czech.1009.c: "Cela ne nous intéresse pas"
 MUN_czech.1010.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] nous invit[FROM.GetEEntNP]\nà présider la faction [CZE.GetFactionName]"
 MUN_czech.1010.d: "Après une tentative de faire des accords de la Petite Entente une alliance, les [FROM.GetHabitants] ont une autre proposition : ils nous invitent à présider une nouvelle faction. Ils sont prêts à céder le contrôle en échange de la puissante protection de notre nation. Notre sphère est certaine de gagner du terrain, peut-être même avec des nations menacées."
 MUN_czech.1010.a: "Ce sont des alliés de choix"
 MUN_czech.1010.b: "Nous avons déjà assez à faire"
 MUN_czech.1011.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] propos[FROM.GetEEntNP]\nun accord de protection"
 MUN_czech.1011.d: "\nDes diplomates [FROM.GetAdjMP] nous proposent un traité de défense mutuel, afin d'éviter toute surprise entre nos deux nations. Nous nous engageons ainsi à ne pas attaquer [FROM.GetLeLaLNP] [FROM.GetName], contre un allié de plus en cas d'offensive à notre encontre."
 MUN_czech.1011.a: "Le jeu en vaut la chandelle"
 MUN_czech.1011.b: "Nous préférons rester neutres"
 MUN_czech.1012.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] exig[FROM.GetEEntNP]\nnotre soumission"
 MUN_czech.1012.d: "\nFort[FROM.GetXSNP] de [FROM.GetSaLeurNP] nouvelle alliance, [FROM.GetLeLaLNP] [FROM.GetName] nous [FROM.GetAOntNP] fait parvenir une série d'exigences qui nous ferait renoncer à notre souveraineté. Sachant que [SOV.GetLeLaLNP] [SOV.GetName] [SOV.GetAOntNP] exprimé son intérêt pour la région, nous ferions bien de réfléchir à deux fois avant de refuser."
 MUN_czech.1012.a: "Toute résistance serait futile"
 MUN_czech.1012.b: "Plutôt la mort que le déshonneur !"
 MUN_czech.1013.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] propos[FROM.GetEEntNP]\nune alliance conditionnelle"
 MUN_czech.1013.d: "\nAprès un long délibéré, le gouvernement [FROM.GetAdjMS] a annoncé qu'il souhaiterait former une alliance avec nous, néanmoins sans compromettre ses revendications territoriales. Voici donc sa proposition finale : [FROM.GetLeLaLNP] [FROM.GetName] accept[FROM.GetEEntNP] de rejoindre notre faction à condition de [FROM.GetLuiLeurNP] céder les territoires mentionnés."
 MUN_czech.1013.a: "Ça en vaut la peine"
 MUN_czech.1013.b: "Nous voulons justement protéger notre territoire !"
 MUN_czech.1014.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] recherch[FROM.GetEEntNP]\nune protection"
 MUN_czech.1014.d: "D'influents diplomates [FROM.GetAdjMP] se sont entretenus avec le ministre des Affaires étrangères pour faire appliquer les mesures de protection vaguement mentionnées dans le traité d'assistance mutuelle de 1935."
 MUN_czech.1014.a: "Nous devons protéger nos alliés"
 MUN_czech.1014.b: "Restons vagues, justement..."
 MUN_czech.1015.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] propos[FROM.GetEEntNP]\nla fusion de nos factions"
 MUN_czech.1015.d: "\nComme nous partageons les mêmes ennemis, [FROM.GetLeLaLNP] [FROM.GetName] nous propos[FROM.GetEEntNP] d'approfondir notre coopération en intégrant notre faction à [FROM.GetSaLeurNP] faction."
 MUN_czech.1015.a: "Nous pourrions sauver plus de vies"
 MUN_czech.1015.b: "Ne cédons pas le contrôle"
 MUN_czech.1016.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] propos[FROM.GetEEntNP]\nun pacte de non-agression"
 MUN_czech.1016.d: "\nReprenant des discussions passées à la trappe suite à un changement de politique étrangère, [FROM.GetLeLaLNP] [FROM.GetName] nous propos[FROM.GetEEntNP] de reprendre les négociations là où nous les avions laissées."
 MUN_czech.1016.a: "Une frontière de moins à protéger"
 MUN_czech.1016.b: "Nos ambitions en pâtiront"
 MUN_czech.1017.t: "Invasion conjointe [GER.GetDuDelaDelNP] [GER.GetName] ?"
 MUN_czech.1017.d: "Les [FROM.GetHabitants] se sont entretenus avec notre gouvernement au sujet d'un plan secret visant à envahir [GER.GetLeLaLNP] [GER.GetName]. Ils ne souhaitent qu'une chose : démanteler cette nation. C'est pourquoi avec notre aide, ils pourraient plus facilement provoquer la chute de l'invincible armée [GER.GetAdjFS]."
 MUN_czech.1017.a: "Nous attaquerons avec eux"
 MUN_czech.1017.b: "C'est bien trop dangereux !"
 MUN_czech.1018.t: "Lutter seuls contre [GER.GetLeLaLNP] [GER.GetName] ?"
 MUN_czech.1018.t.2: "Invasion conjointe [GER.GetDuDelaDelNP] [GER.GetName]"
 MUN_czech.1018.d: "Malgré tous nos efforts diplomatiques, nous n'avons obtenu aucun soutien de nations étrangères dans notre invasion préventive [GER.GetDuDelaDelNP] [GER.GetName]. Compte tenu de la situation, allons-nous tout de même poursuivre notre offensive ?"
 MUN_czech.1018.d.FRA_POL: "Nos diplomates rapportent de bonnes nouvelles [FRA.GetDuDelaDelNP] [FRA.GetName] et [POL.GetDuDelaDelNP] [POL.GetName] : les deux nations ont accepté de nous soutenir dans l'invasion [GER.GetDuDelaDelNP] [GER.GetName]."
 MUN_czech.1018.d.FRA: "Nos diplomates apportent de bonnes nouvelles [FRA.GetDuDelaDelNP] [FRA.GetName] : le gouvernement accepte de prendre part à une invasion conjointe [GER.GetDuDelaDelNP] [GER.GetName]. Mettons-nous au travail afin d'estimer si nos forces seraient suffisantes pour venir à bout de ce géant."
 MUN_czech.1018.d.POL: "Nos diplomates apportent de bonnes nouvelles [POL.GetDuDelaDelNP] [POL.GetName] : le gouvernement accepte de prendre part à une invasion conjointe [GER.GetDuDelaDelNP] [GER.GetName]. Mettons-nous au travail afin d'estimer si nos forces seraient suffisantes pour venir à bout de ce géant."
 MUN_czech.1018.a: "Ils ne verront rien venir"
 MUN_czech.1018.b: "Après réflexion, c'est trop risqué"
 MUN_czech.1019.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] exig[FROM.GetEEntNP]\n[762.GetName]"
 MUN_czech.1019.d: "\nDésireux de restaurer les frontières de la Bohême d'antan et de légitimer [FROM.GetSonLeurNP] occupation de la [72.GetName], [FROM.GetLeLaLNP] [FROM.GetName] nous [FROM.GetAOntNP] lancé un ultimatum exigeant le contrôle de [762.GetName]."
 MUN_czech.1019.a: "Si ça peut nous sauver..."
 MUN_czech.1020.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] propos[FROM.GetEEntNP]\nun investissement conditionnel"
 MUN_czech.1020.a: "C'est une affaire en or !"
 MUN_czech.1020.b: "Un marché inacceptable"
 MUN_czech.1020.d: "\nDes diplomates en provenance [FROM.GetDuDelaDelNP] [FROM.GetName] nous ont présenté un accord stipulant un investissement massif de leur gouvernement dans nos industries et nos infrastructures en échange d'un droit sur nos ressources. Sachant que cette offre fait suite à plusieurs plans d'investissement manqués au cours des dernières années, c'est bien la preuve d'un effort de renouer avec notre nation."
 CZE_investment_effects_tt: "Dans §Y100 jours§!, nous allons obtenir :\nUne §Yinfrastructure§! dans §Y3§! États aléatoires\nUne §Yusine civile§! dans §Y1§! État aléatoire\n"
 MUN_czech.1021.t: "Retour à l'union douanière austro-hongroise ?"
 MUN_czech.1021.d: "[CZE.GetLeLaLNPCap] [CZE.GetName] [CZE.GetAOntNP] proposé un projet d'accord commercial entre toutes les nations issues de l'Empire austro-hongrois. Non mécontent de son indépendance, le gouvernement [CZE.GetAdjMS] cherche malgré tout à retrouver les avantages qu'offrait le conglomérat déchu."
 MUN_czech.1021.a: "On ne refuse pas plus de commerce"
 MUN_czech.1021.b: "Préservons notre commerce intérieur"
 MUN_czech.1022.t: "[CZE.GetLeLaLNPCap] [CZE.GetName] s'empar[CZE.GetEEntNP]\nde la Silésie"
 MUN_czech.1022.d: "\nÀ l'issue d'une lutte acharnée sur les montagnes des [69.GetName], les troupes [CZE.GetAdjFP] ont arraché la victoire, prenant le contrôle de toute la Silésie. Malheureusement, les forces qu'elles ont repoussées se sont repliées et ont pu livrer une contrattaque."
 MUN_czech.1022.a: "Il faut intervenir !"
 MUN_czech.1022.b: "Évitons de nous faire un ennemi de plus"
 MUN_czech.1022.c: "C'est une grande victoire !"
 MUN_czech.1023.t: "[CZE.GetLeLaLNPCap] [CZE.GetName] lanc[CZE.GetEEntNP]\nles hostilités en Silésie"
 MUN_czech.1023.d: "\n[FROM.GetLeLaLNPCap] [FROM.GetName] [FROM.GetAOntNP] déclenché une série d'escarmouches à la frontière de la Silésie [ROOT.GetAdjFS] qui se transforment en une guerre. La nation aurait justifié ses actes en invoquant des raisons obscures remontant jusqu'au Moyen-Âge."
 MUN_czech.1023.a: "Aux armes !"
 MUN_czech.1024.t: "[CZE.GetLeLaLNPCap] [CZE.GetName] propos[CZE.GetEEntNP]\nun traité de paix"
 MUN_czech.1024.d: "\nMaintenant que les échauffourées aux frontières de la Silésie se sont transformées en une guerre totale, les [FROM.GetHabitants] sont prêts à mettre fin au conflit en échange du territoire qu'ils revendiquent."
 MUN_czech.1024.a: "Nous avons mieux à faire"
 MUN_czech.1024.b: "La situation est à notre avantage"
 MUN_czech.1024.c: "Nous ne sommes pas ouverts à la négociation !"
 MUN_czech.1025.t: "Fin des missions de volontaires espagnoles"
 MUN_czech.1025.d.1: "Les troupes [ROOT.GetAdjFP] envoyées soutenir la cause de [CZE_supported_spanish_faction.GetName] rentrent enfin au pays après une campagne couronnée de succès. Le conflit auquel elles ont participé leur a offert une expérience inestimable, notamment pour les détachements médicaux."
 MUN_czech.1025.d.2: "Malgré la lutte acharnée de nos forces [ROOT.GetAdjFP] durant la guerre civile espagnole, nous n'avons pas réussi à faire gagner le camp que nous soutenions. En revanche, nos troupes ont acquis une expérience militaire inestimable."
 MUN_czech.1025.a: "Espérons ne jamais nous en servir chez nous"
 MUN_czech.1026.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] refus[FROM.GetEEntNP]\nnotre proposition"
 MUN_czech.1026.a: "Tant pis pour eux"
 MUN_czech.1026.b: "La situation est inquiétante"
 MUN_czech.1026.france_refuses_to_lead: "Malgré la fonction de dirigeant au sein de notre alliance, [FROM.GetLeLaLNP] [FROM.GetName] [FROM.GetAOntNP] refusé de nous rejoindre. Est-ce pour conserver une neutralité mondiale ou pour fomenter autre chose ?"
 MUN_czech.1026.sphere_of_influence: "Malgré les propos rassurants du gouvernement [FROM.GetAdjMS], notre implication dans la faction [ROOT.GetFactionName] semble être mal vue ; étendre notre influence dans les Balkans risquerait de faire fuir de potentiels alliés."
 MUN_czech.1026.guarantee: "\nNos diplomates ont pourtant tout essayé, mais malheureusement, les [FROM.GetHabitants] refusent de signer un accord de défense. Selon eux, nous sommes bien plus menacés par les forces étrangères qu'ils le sont. Espérons qu'ils se trompent..."
 MUN_czech.1026.faction_merge: "\nNos diplomates ont pourtant tout essayé, mais malheureusement, ils n'ont pas su convaincre leurs homologues [FROM.GetAdjMP] d'unifier notre faction [ROOT.GetFactionName] et la leur, [FROM.GetFactionName]."
 MUN_czech.1026.non_aggression: "\nMalgré leurs beaux discours sur le pacifisme [FROM.GetDuDelaDelNP], les diplomates [FROM.GetAdjMP] ont refusé de signer notre pacte de non-agression. Nous ignorons encore les raisons de ce refus."
 MUN_czech.1026.trade_deal: "\nMotivés par le désir de préserver la souveraineté économique nationale, [FROM.GetLeLaLNP] [FROM.GetName] [FROM.GetAOntNP] refusé de signer notre accord commercial."
 MUN_czech.1026.faction_invite: "\nMalgré les arguments convaincants sur une alliance, nos diplomates n'ont pas su faire entendre raison [FROM.GetAuAlaAlNP] [FROM.GetName]."
 MUN_czech.1026.weapons_sale: "\nMalgré notre offre plus que généreuse, [FROM.GetLeLaLNP] [FROM.GetName] ne compt[FROM.GetEEntNP] pas acheter d'armes auprès de nos manufactures."
 MUN_czech.1026.unification: "\nMalgré tous les avantages qu'une fédération pourrait apporter, [FROM.GetLeLaLNP] [FROM.GetName] [FROM.GetAOntNP] préféré conserver la souveraineté de [FROM.GetSonLeurNP] gouvernement en exil."
 MUN_czech.1026.white_peace: "Nos émissaires rapportent une bien triste nouvelle : malgré notre occupation de la [66.GetName], le gouvernement [FROM.GetAdjMS] refuse catégoriquement de signer un traité de paix. Nous allons donc devoir poursuivre nos efforts de guerre dans l'espoir de le faire flancher."
 MUN_czech.1027.t: "Fonder un accord commercial [FROM.GetName]-[ROOT.GetName]"
 MUN_czech.1027.d: "Malgré nos différences idéologiques, [FROM.GetLeLaLNP] [FROM.GetName] souhait[FROM.GetEEntNP] conclure un accord commercial. En échange d'une autorisation d'extraction de ressources de [202.GetName], les [FROM.GetHabitants] nous fourniront les machines-outils dont nous avons besoin pour développer notre capacité industrielle."
 MUN_czech.1027.a: "Un accord en or !"
 MUN_czech.1027.b: "Ils n'auront pas ces ressources"
 MUN_czech.1028.t: "Construction de fortifications retardée"
 MUN_czech.1028.d: "De nombreuses voix s'élèvent dans le pays pour chercher à comprendre pourquoi le gouvernement a stoppé les travaux de fortifications lancés depuis l'an dernier. Malgré l'allocation d'un budget pour l'édification de projets via le Conseil des fortifications, aucun progrès n'a été fait depuis. Les citoyens commencent à demander la reprise franche du projet ou, s'il n'avance pas, que le gouvernement restitue les fonds alloués. Si nous tenons à atteindre nos objectifs, il faut se retrousser les manches et relancer les chantiers au plus vite."
 MUN_czech.1028.a: "Pas de temps à perdre !"
 CZE_no_time_to_lose_tt: "Il ne nous reste plus beaucoup de temps pour achever un projet de fortification avant l'arrivée d'une nouvelle menace."
 MUN_czech.1029.t: "Projet de fortification achevé"
 MUN_czech.1029.d: "Notre tout dernier projet de fortification vient de toucher au but ; des ressources sont disponibles pour lancer un nouveau chantier. Nos ingénieurs sont prêts à se rendre sur place dès qu'ils recevront les plans de la nouvelle ligne de défense."
 MUN_czech.1029.a: "Excellent travail !"
 MUN_czech.1030.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] exig[FROM.GetEEntNP]\nnotre intégration"
 MUN_czech.1030.d: "\nLes [FROM.GetHabitants] cherchent à nous inclure dans leur vaste union expansionniste. Ils font appel à divers mouvements extranationaux pour séduire les pays : panslavisme, pro-Balkans, ou encore héritage de l'Empire austro-hongrois. Mais l'argument principal pour les rejoindre reste les menaces à peine déguisées en cas de refus."
 MUN_czech.1030.a: "Quelle bonne idée"
 MUN_czech.1030.b: "Nous ne sommes pas convaincus"
 MUN_czech.1031.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] propos[FROM.GetEEntNP]\nune union"
 MUN_czech.1031.d: "Malgré notre capitulation, le gouvernement [FROM.GetAdjMS] nous propose une issue inattendue : s'unir à son pays pour poursuivre le combat !"
 MUN_czech.1031.a: "Ensemble, nous protégerons nos terres"
 MUN_czech.1031.b: "Nous n'avons pas les mêmes valeurs"
 MUN_czech.1032.t: "Surmonter les divergences"
 CZE_divide_nation_title_dynamic_sudentenland: "$MUN_czech.1032.t$ avec les Sudètes"
 CZE_divide_nation_title_dynamic_czech_states: "$MUN_czech.1032.t$ avec les ouvriers tchèques"
 CZE_divide_nation_title_dynamic_tesinko_poles: "$MUN_czech.1032.t$ en [72.GetName]"
 CZE_divide_nation_title_dynamic_slovakia_states: "$MUN_czech.1032.t$ [SLO.GetAuEnANP] [SLO.GetNonIdeologyName]"
 CZE_divide_nation_title_dynamic_hungarian_states: "$MUN_czech.1032.t$ en [664.GetName]"
 CZE_divide_nation_title_dynamic_ukrainian_states: "$MUN_czech.1032.t$ en [73.GetName]"
 MUN_czech.1032.d: "La volonté de soulager les problèmes [FROM.GetAuEnANP] [FROM.GetName] a apaisé la colère contre le gouvernement central, du moins pour le moment. Nous avons désormais le champ libre pour nous consacrer à des mesures sociales ou économiques afin de réparer les cassures qui déchirent notre pays."
 MUN_czech.1032.a: "Poursuivons nos efforts"
 MUN_czech.1033.t: "Le gouvernement en exil [FROM.GetAdjMS]\nen quête de reconnaissance"
 MUN_czech.1033.d: "\nLe gouvernement en exil [FROM.GetAdjMS], dirigé par $CZE_edvard_benesh$, nous a demandé d'accueillir sa délégation pour les aider à retrouver la souveraineté [CZE.GetDuDelaDelNP] [CZE.GetNonIdeologyName]."
 MUN_czech.1033.a: "Un nouvel allié contre les [GER.GetHabitants]"
 MUN_czech.1033.b: "Ils n'ont aucune légitimité"
 MUN_czech.1034.t: "Agitation en Slovaquie"
 MUN_czech.1034.d: "Depuis notre affiliation à l'idéologie nationaliste de groupes divers, les membres du Parti populaire slovaque ont formé leur force paramilitaire dans le but de déclarer l'indépendance du pays, ou du moins son autonomie. Reste à savoir si nous tentons de sauver les apparences en interdisant cette force armée, ou si nous les laissons faire pour nous concentrer sur les territoires fidèles au gouvernement."
 MUN_czech.1034.a: "Envoyons l'armée !"
 MUN_czech.1034.b: "Arrêtons-les, mais offrons-leur l'autonomie"
 MUN_czech.1034.c: "Prenons le contrôle"
 MUN_czech.1034.c_tt: "§RNous serons à la merci de la décision [GER.GetAdjFS] pour ce qui est de l'avenir de la Tchécoslovaquie.§!"
 MUN_czech.1035.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] propos[FROM.GetEEntNP]\nla fabrication de nos armes"
 MUN_czech.1035.d: "\nDans le cadre de notre partenariat total avec [CZE.GetLeLaLNP] [CZE.GetName], [CZE.GetSonLeurNP] gouvernement propose un accord inédit : il s'engage à produire notre armement, moyennant une certaine somme, évidemment. Décharger nos industries de ce fardeau nous permettrait de les réassigner à d'autres secteurs."
 MUN_czech.1035.a: "Voilà qui nous faciliterait la vie"
 MUN_czech.1035.b: "Notre armée ne dépendra pas du matériel étranger"
 #MUN_czech.1036.t: "" #Event uses MUN_czech.1032.t
 MUN_czech.1036.d: "La Grande Dépression n'a épargné ni l'économie ni la politique de notre nation. Nous sommes d'ailleurs toujours accablés par ses répercussions dans certaines régions, et certaines situations semblent empirer, malgré notre redressement miraculeux. Nous devons prendre ces problèmes à bras le corps et y remédier avant qu'ils ne déchirent définitivement notre pays."
 MUN_czech.1036.a: "Il faut guérir la nation"
 CZE_divided_nation_event_onbroad_tt: "Donne accès aux §Ydécisions§! permettant de §Yretirer§! les §Ymodificateurs d'État§! négatifs de nos États nationaux\n\nAchever ces §Ydécisions§! réduira les modificateurs d'État négatifs sur l'esprit national §Y$CZE_a_divided_nation_dynamic_modifier$§! jusqu'à ce qu'il soit §Yretiré§!"
 MUN_czech.1037.t: "[GER.GetLeLaLNPCap] [GER.GetName] protèg[GER.GetEEntNP] [HUN.GetLeLaLNP] [HUN.GetName]"
 MUN_czech.1037.d: "En réponse à nos déclarations belliqueuses envers [HUN.GetLeLaLNP] [HUN.GetName], les dirigeants [GER.GetAdjMP] ont déclaré que toute agression envers ce pays provoquerait des représailles intenses [GER.GetDuDelaDelNP] [GER.GetName]. À nous de décider si nous oserons mettre nos menaces à exécution."
 MUN_czech.1037.a: "Annulons tout !"
 MUN_czech.1037.b: "Nous irons jusqu'au bout"
 MUN_czech.1038.t.1: "[FROM.GetLeLaLNPCap] [FROM.GetName] propos[FROM.GetEEntNP]\nses modèles de chars sous licence"
 MUN_czech.1038.t.2: "[FROM.GetLeLaLNPCap] [FROM.GetName] propos[FROM.GetEEntNP]\ndes canons à vendre"
 MUN_czech.1038.t.3: "[FROM.GetLeLaLNPCap] [FROM.GetName] propos[FROM.GetEEntNP]\nde l'artillerie à vendre"
 MUN_czech.1038.t.4: "[FROM.GetLeLaLNPCap] [FROM.GetName] propos[FROM.GetEEntNP]\ndes chars légers à vendre"
 MUN_czech.1038.t.5: "[FROM.GetLeLaLNPCap] [FROM.GetName] propos[FROM.GetEEntNP]\ndes chasseurs à vendre"
 MUN_czech.1038.d: "Des représentants du gouvernement [FROM.GetAdjMS], accompagnés des principales sociétés d'armement du pays, nous proposent un marché. Les tarifs sont corrects, et les modèles sont très modernes."
 MUN_czech.1038.a: "Une offre avantageuse"
 MUN_czech.1039.t: "[RUT.GetLeLaLNPCap] [RUT.GetName] souhait[RUT.GetEEntNP]\nun accord d'autonomie"
 MUN_czech.1039.d: "\nQuelque temps après la signature de l'accord d'autonomie avec [SLO.GetLeLaLNP] [SLO.GetName], $RUT_augustin_voloshyn$ nous a contactés pour obtenir le même accord. Cette demande paraît absolument saugrenue, mais compte tenu des circonstances, ce n'est peut-être pas une plaisanterie."
 MUN_czech.1039.a: "Nous allons voir cela"
 MUN_czech.1040.t: "[CZE.GetLeLaLNPCap] [CZE.GetName] nous propos[CZE.GetEEntNP]\nun traité d'union douanière"
 MUN_czech.1040.d: "\nLes [CZE.GetHabitants] ont rouvert les négociations concernant une union douanière avec notre nation. Le marché semble équitable, mais nous ne sommes pas à l'abri d'autres clauses qu'ils pourraient nous imposer plus tard. Ce traité semble en apparence bien inoffensif, mais l'est-il vraiment en réalité ?"
 MUN_czech.1040.a: "Ce n'est qu'un bout de papier"
 MUN_czech.1040.b: "Méfions-nous..."
 MUN_czech.1041.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] déclin[FROM.GetEEntNP]\nle traité d'union douanière"
 MUN_czech.1041.d: "\nLe gouvernement [FROM.GetAdjMS] a refusé de signer notre traité, prétextant un risque de déstabilisation économique. Ce ne sont que de piètres excuses pour refuser une union douanière très avantageuse."
 MUN_czech.1041.a: "C'est dommage"
 MUN_czech.1042.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] accept[FROM.GetEEntNP]\nle traité d'union douanière"
 MUN_czech.1042.d: "\nConsidérant notre traité plus équitable, le gouvernement [FROM.GetAdjMS] a accepté de le signer. Espérons que ce traité soit le premier d'une collaboration très fructueuse entre nos nations."
 MUN_czech.1042.a: "Excellent !"
 MUN_czech.1043.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] exig[FROM.GetEEntNP]\nnotre entrée dans la fédération"
 MUN_czech.1043.d: "\nDepuis le rapprochement de nos deux nations, et compte tenu de la situation mondiale, le gouvernement [FROM.GetAdjMS] considère que nous ferions mieux de nous placer sous sa protection. Ces bonnes intentions semblent cacher une occupation de notre territoire. Que faire ?"
 MUN_czech.1043.a: "Nous acceptons"
 MUN_czech.1043.b: "C'est une plaisanterie !"
 MUN_czech.1044.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] refus[FROM.GetEEntNP]\nde rejoindre la fédération"
 MUN_czech.1044.d: "\nLes [FROM.GetHabitants] ont refusé de rejoindre notre fédération, affirmant qu'ils s'en sortent très bien seuls. C'est un sérieux contretemps qui retarde nos objectifs sur la scène européenne. Comment leur faire entendre raison ?"
 MUN_czech.1044.a: "C'est bien dommage..."
 MUN_czech.1044.b: "Nous avons d'autres options"
 MUN_czech.1045.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] accept[FROM.GetEEntNP]\nde rejoindre la fédération"
 MUN_czech.1045.d: "\nLes [FROM.GetHabitants] ont très vite compris que notre offre leur apportait une protection inestimable, aussi ont-ils signé sur-le-champ. C'est une étape de plus vers notre domination de l'Europe."
 MUN_czech.1045.a: "Excellent !"
 MUN_czech.1046.t: "Effacer les divergences"
 MUN_czech.1046.d: "La majorité des crises de notre pays ont été solutionnées et ça se voit : les tensions s'amenuisent, l'économie et la société se relèvent peu à peu... La nation guérit."
 MUN_czech.1046.a: "Excellente nouvelle"
 #MUN_czech.1047 is hidden
 MUN_czech.1048.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] accept[FROM.GetEEntNP]\nnos exigences"
 MUN_czech.1048.t2: "[FROM.GetLeLaLNPCap] [FROM.GetName] accept[FROM.GetEEntNP]\nnotre proposition"
 MUN_czech.1048.d: "\nLes dirigeants [FROM.GetAdjMP] ont accepté, à contrecœur, de céder le territoire que nous avons exigé. Leurs troupes sont déjà en train de plier bagage."
 MUN_czech.1048.d2: "Après de longues négociations, nos représentants sont parvenus à trouver un accord avec les [FROM.GetHabitants]. Leur économie jouera désormais un rôle clé au sein de notre union. C'est une décision porteuse de prospérité pour toutes les parties impliquées."
 MUN_czech.1048.d3: "Notre proposition de pacte de non-agression a été accueillie avec enthousiasme par les représentants [FROM.GetAdjMP]. De toute évidence, ils n'avaient pas en tête de nous attaquer."
 MUN_czech.1048.d4: "Les [FROM.GetHabitants] sont assaillis de toutes parts ; c'est pourquoi ils ont accepté de se plier à nos exigences."
 MUN_czech.1048.d5: "Après de longues négociations, nos représentants sont parvenus à trouver un accord avec les [FROM.GetHabitants]. Notre industrie militaire va lancer la production de masse de matériel pour leur compte. En échange, nous obtiendrons des biens de consommation pour notre économie."
 #MUN_czech.1049 is a faction joining event so largely reuses generic loc
 MUN_czech.1049.d: "\nLe nouveau gouvernement militaire [FROM.GetAdjMS] nous a proposé une alliance. Malgré son opinion majoritairement antiallemande, il a su faire preuve de clairvoyance et s'est détourné de ses partenaires de l'époque, trop imprévisibles."
 MUN_czech.1050.d: "\nNos diplomates envoyés [FROM.GetAuEnANP] [FROM.GetName] sont de retour avec une mauvaise nouvelle : l'alliance a été rejetée. Les raisons de ce refus ne sont pas claires, néanmoins nous sommes dans une situation délicate : nous avons fait part de nos inquiétudes envers nos alliés historiques sans pour autant en avoir trouvé d'autres."
 MUN_czech.1050.a: "Rendons l'accord plus alléchant"
 MUN_czech.1050.b: "Nous trouverons des alliés ailleurs"
 MUN_czech.1051.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] étend[FROM.GetXEntNP]\nla sphère d'influence"
 MUN_czech.1051.d: "\nNos nouveaux alliés [FROM.GetAdjMP] souhaitent étendre leur influence par-delà leurs frontières. Des diplomates [FROM.GetDuDelaDelNP] [FROM.GetName] sont venus nous convaincre de soutenir leur projet et d'établir des limites tangibles entre l'influence [ROOT.GetAdjFS] et l'influence [FROM.GetAdjFS]."
 MUN_czech.1051.a: "Offrons notre soutien à nos alliés"
 MUN_czech.1052.t: "Les [FROM.GetHabitants] souhaitent ouvrir un passage pour les troupes [SOV.GetAdjFP]"
 MUN_czech.1052.d: "À la suite de leur accord diplomatique, les [FROM.GetHabitants] et les [SOV.GetHabitants] s'assurent une protection mutuelle. Cependant, les deux nations ne possédant pas de frontière commune, des diplomates [FROM.GetAdjMP] nous ont demandé le libre passage des troupes [SOV.GetAdjMP] sur notre territoire en cas de conflit."
 MUN_czech.1052.a: "Nous pourrions aussi bénéficier de leur protection"
 MUN_czech.1053.t: "Pression [FROM.GetAdjFS] sur les revendications [HUN.GetAdjFP]"
 MUN_czech.1053.d: "Depuis la conversion [HUN.GetDuDelaDelNP] [HUN.GetName] en État client, les [FROM.GetHabitants] attendent que nous acceptions le même sort. Si nous refusons, ils soutiendront les [HUN.GetHabitants] dans leurs revendications [ROM.GetAdjFP]. Nous voilà face à un dilemme : perdre notre souveraineté ou estropier notre intégrité territoriale."
 CZE_cancel_anti_hungary_focus_tt: "Annule la priorité §Y$CZE_neutralize_the_hungarian_threat$§!"
 MUN_czech.1054.t: "Invasion conjointe [LIT.GetDuDelaDelNP] [LIT.GetName] ?"
 MUN_czech.1054.d: "Comme convenu, les [FROM.GetHabitants] nous ont présenté une proposition qui renforcerait grandement notre nation. Une unification forcée avec [LIT.GetLeLaLNP] [LIT.GetName] nous offrirait un accès privilégié à des ressources supplémentaires et une position de force contre toute tentative d'invasion ennemie."
 MUN_czech.1054.a: "Il faut envahir pour ne pas être envahis"
 MUN_czech.1055.t: "Arrivée de volontaires [SOV.GetAdjMS]"
 MUN_czech.1055.d: "Les [SOV.GetHabitants] ont mené une opération aérienne de grande envergure durant laquelle ils ont réussi à déployer plusieurs divisions de volontaires à l'aéroport de [73.GetName] pour nous assister dans notre effort de guerre."
 MUN_czech.1056.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] exig[FROM.GetEEntNP] le [975.GetName]"
 MUN_czech.1056.d: "Les [CZE.GetHabitants] ont exigé l'obtention d'un corridor de sécurité entre leurs terres et celles [YUG.GetDuDelaDelNP] [YUG.GetName], le même qui avait été proposé durant la conférence de paix de Paris après la Grande Guerre. Afin que ce projet voie le jour, des représentants [FROM.GetAdjMP] attendent que nous leur cédions le [975.GetName]."
 #THE FALL OF THE REPUBLIC EVENTS#
 MUN_the_fall_of_the_republic.1.t: "Protestations généralisées"
 MUN_the_fall_of_the_republic.1.d: "La récente décision de [ROOT.GetLeader] visant à céder les Sudètes a provoqué une vague de protestations à travers le pays. Le gouvernement et le haut commandement ont pensé éviter un massacre inutile dans un conflit perdu d'avance en offrant ce territoire, mais la majorité de nos citoyens pense qu'ils se trompent. Certains partis politiques ont d'ailleurs profité du tumulte pour se mettre au-devant de la scène."
 MUN_the_fall_of_the_republic.1.a: "Nous n'avions pas le choix"
 MUN_the_fall_of_the_republic.2.t.1: "La chute de la première république"
 MUN_the_fall_of_the_republic.2.t.2: "Chaos au sein du gouvernement"
 MUN_the_fall_of_the_republic.2.d: "Depuis l'annonce du gouvernement décrétant la scission des Sudètes, de nombreux haut placés dans l'armée et le gouvernement ont remis leur démission avant de quitter le pays. Notre gouvernement a sérieusement besoin d'un remaniement pour stopper cette fuite de personnalités et retrouver la confiance du peuple."
 MUN_the_fall_of_the_republic.2.a: "Un changement radical est nécessaire"
 MUN_the_fall_of_the_republic.2.b: "Ne changeons rien !"
 MUN_the_fall_of_the_republic.3.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] souhait[FROM.GetEEntNP]\nl'autonomie"
 MUN_the_fall_of_the_republic.3.d: "\nÀ la suite du chambardement politique qu'a subi le pays, la petite région d'Ukraine subcarpatique souhaite gagner son autonomie de [9.GetCapitalVictoryPointName], principalement en raison des divergences culturelles avec le reste [ROOT.GetDuDelaDelNP] [ROOT.GetName]. Cette requête ressemble plutôt à une tentative à peine déguisée des petits seigneurs locaux de gagner de l'influence. Néanmoins, refuser nous coûterait un effort politique que nous ne pouvons guère nous permettre en ce moment."
 MUN_the_fall_of_the_republic.3.a: "Eh bien, pourquoi pas ?"
 MUN_the_fall_of_the_republic.3.b: "C'est hors de question !"
 MUN_the_fall_of_the_republic.3.c: "Laissons-les"
 MUN_the_fall_of_the_republic.4.t: "Le sort [RUT.GetDuDelaDelNP] [RUT.GetName]"
 MUN_the_fall_of_the_republic.4.d: "Au lendemain du chaos qui a ravagé la politique [CZE.GetAdjFS], la petite région [RUT.GetDuDelaDelNP] [RUT.GetName] se trouve désormais hors de toute frontière nationale. Elle s'est ainsi déclarée comme un pays indépendant et a déjà envoyé des diplomates en mission chez ses voisins. La majorité de notre gouvernement craint que ce territoire stratégiquement capital ne tombe entre de mauvaises mains. L'armée propose d'adresser un ultimatum à [RUT.GetLeLaLNP] [RUT.GetName] pour l'annexer de nouveau."
 MUN_the_fall_of_the_republic.4.a: "Envoyons l'ultimatum dans l'heure !"
 MUN_the_fall_of_the_republic.4.b: "C'est risqué... Attendons..."
 MUN_the_fall_of_the_republic.5.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] exig[FROM.GetEEntNP]\nnotre annexion"
 MUN_the_fall_of_the_republic.5.d: "\nCe n'était qu'une question de temps avant de recevoir un ultimatum d'un pays voisin exigeant notre annexion. [FROM.GetLeLaLNPCap] [FROM.GetName] n'aur[FROM.GetAOntNP] décidément pas perdu de temps à ordonner notre reddition. Que faisons-nous ?"
 MUN_the_fall_of_the_republic.5.a: "Nous nous battrons jusqu'au bout !"
 MUN_the_fall_of_the_republic.5.b: "Nous n'avons d'autre choix qu'accepter..."
 MUN_the_fall_of_the_republic.6.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] rejett[FROM.GetEEntNP]\nnotre ultimatum"
 MUN_the_fall_of_the_republic.6.d: "\nContre toute attente, [FROM.GetLeLaLNP] [FROM.GetName] [FROM.GetAOntNP] rejeté notre ultimatum et se prépar[FROM.GetEEntNP] à un conflit armé contre nous. Nous n'avons d'autre choix que d'envahir le territoire. Nous avons déjà en main les plans de bataille ainsi que les itinéraires d'attaque. Il ne reste plus qu'à donner l'ordre."
 MUN_the_fall_of_the_republic.6.a: "Ils auront été prévenus"
 MUN_the_fall_of_the_republic.6.a_tt: "Cette opération n'affectera pas §Y$HUN_pal_teleki$§!, à moins que les [RUT.GetHabitants] aient des alliés"
 MUN_the_fall_of_the_republic.6.b: "Attendons, nous pourrions le regretter"
 MUN_the_fall_of_the_republic.7.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] cèd[FROM.GetEEntNP]\nà nos exigences"
 MUN_the_fall_of_the_republic.7.d: "\nSans surprise, les [FROM.GetHabitants] ont plié face à nos exigences : ils sont prêts à entamer l'annexion de leur pays sans broncher. La région n'avait de toute façon aucune chance de résister à la puissance de notre nation. Notre frontière nord n'a jamais été aussi bien protégée. Cette victoire éclair n'a pas manqué de solliciter l'admiration du gouvernement."
 MUN_the_fall_of_the_republic.7.a: "Très bonne nouvelle !"
 #BOP EVENTS#
 MUN_czech_bop.1.t: "Une Armada opérationnelle"
 MUN_czech_bop.1.d: "La campagne de réformes du début de la décennie commence à porter ses fruits : notre armée est désormais l'une des plus modernes de toute l'Europe. Cependant, certains politiciens et magnats industriels font preuve d'une fatuité un peu trop arrogante. Nous devons faire taire les doutes au plus vite et prouver aux sceptiques que l'armée est capable de combattre toutes les menaces qui se dresseront sur notre route."
 MUN_czech_bop.1.a: "Nous serons prêts"
 MUN_czech_bop.2.t.1: "La menace du réarmement allemand"
 MUN_czech_bop.2.t.2: "Expansion militaire sur les pays voisins"
 MUN_czech_bop.2.d.1: "La remilitarisation récente de la Rhénanie par les [GER.GetHabitants] a frappé d'effroi bon nombre de nos dirigeants politiques et militaires. La majorité pense néanmoins que les alliances forgées et les préparations de l'armée devraient suffire à défendre le pays en cas d'offensive. En revanche, quelques dubitatifs laissent entendre que nous ne ferions pas le poids face à la menace [GER.GetAdjFS]."
 MUN_czech_bop.2.d.2: "Les programmes d'expansion militaire récemment signés par nos voisins ont frappé d'effroi bon nombre de nos dirigeants politiques et militaires. La majorité pense néanmoins que les alliances forgées et les préparations de l'armée devraient suffire à défendre le pays en cas d'offensive. En revanche, quelques dubitatifs laissent entendre que nous ne ferions pas le poids face à la menace qu'ils représentent."
 MUN_czech_bop.2.a: "Nous serons prêts"
 MUN_czech_bop.2.a_tt: "Témoins de la campagne de réarmement de nos voisins, certaines voix dans l'armée ont exprimé leurs doutes quant à notre capacité de combattre une éventuelle agression. Faisons taire les sceptiques en lançant un plan d'action."
 MUN_czech_bop.3.t: "[CZE.GetLeLaLNPCap] [CZE.GetName] missionn[CZE.GetEEntNP]\ndes observateurs dans notre pays"
 MUN_czech_bop.3.d: "\nLes [CZE.GetHabitants] ont envoyé sur notre territoire des individus chargés d'observer le conflit en cours. Dans le même temps, l'un de leurs fabricants d'armes légères a contacté nos diplomates par des canaux officieux pour nous proposer d'acquérir de l'armement. La transaction prendrait bien évidemment la forme d'un trafic clandestin en raison des restrictions que nous impose la scène internationale."
 MUN_czech_bop.3.a: "Voyons où cela nous mène"
 MUN_czech_bop.3.b: "Ils se contenteront de toucher avec les yeux"
 MUN_czech_bop_3_tt: "L'armurier §Y[CZE.GetAdjMS]§!, §Y$CZE_zbrojovka_brno_organization$§!, pourrait accepter de nous distribuer clandestinement des armes"
 MUN_czech_bop.4.t: "Le plan de $CZE_zbrojovka_brno_organization$"
 MUN_czech_bop.4.d: "Les [ETH.GetHabitants] ont contacté les représentants de $CZE_zbrojovka_brno_organization$, la manufacture d'armes. Ils souhaitent acheminer clandestinement notre armement sur leur territoire. Malgré les sanctions imposées par la Société des Nations [ETH.GetAuAlaAlNP] [ETH.GetName], $CZE_zbrojovka_brno_organization$ est prêt à accéder à leur requête. Violer les mesures de la Société des Nations nous attirerait les foudres des puissances mondiales si elles venaient à l'apprendre."
 MUN_czech_bop.4.a: "Nous acceptons"
 MUN_czech_bop.4.b: "Les risques sont trop grands"
 CZE_gun_smuggling_tt: "Trafic clandestin d'armes dans le pays"
 CZE_we_got_caught_tt: "§Y$CZE_zbrojovka_brno_organization$§! a été repéré"
 CZE_we_dont_get_caught_tt: "§Y$CZE_zbrojovka_brno_organization$§! n'a pas été repéré"
 MUN_czech_bop.5.t: "$CZE_zbrojovka_brno_organization$ accepte l'opération clandestine"
 MUN_czech_bop.5.d: "À l'issue de son entretien officieux avec le gouvernement [CZE.GetAdjMS], $CZE_zbrojovka_brno_organization$ a obtenu le feu vert secret pour lancer les transactions clandestines d'armes légères sur le territoire. Il nous offre également son expertise via des canaux de communication détournés."
 MUN_czech_bop.5.a: "Nous en ferons bon usage"
 MUN_czech_bop_5_tt: "Cette §Ymanufacture§! sera §Rretirée§! à la fin de la guerre"
 ##SLOVAKIA##
 MUN_slovakia_little_war.1.t: "Victoire en [71.getname]"
 MUN_slovakia_little_war.1.d: "Notre armée a brillé lors de l'affrontement contre les forces ennemies de la [71.getname]. Nos commandants ont obtenu de précieux renseignements et emmagasiné une expérience inestimable de cette bataille."
 MUN_slovakia_little_war.1.a: "Beau travail !"
 MUN_slovakia_little_war.2.t: "Défaite en [71.getname]"
 MUN_slovakia_little_war.2.d: "Malheureusement, nos forces n'ont pas remporté la victoire en [71.getname]. Le manque de munitions et d'équipement motorisé a fait défaut à l'armée. Malgré cette défaite, nos commandants ont su tirer les leçons de cette bataille."
 MUN_slovakia_little_war.2.a: "C'est bien dommage"
 MUN_slovakia_little_war.3.t: "Escarmouche frontalière en [71.GetName]"
 MUN_slovakia_little_war.3.d: "Pourtant gagnants dans le $GER_first_vienna_award$, les [HUN.GetHabitants] cherchent encore à grappiller quelques territoires frontaliers de la [71.getname]. Faisons preuve de force et de détermination, afin de leur faire comprendre que nous ne nous laisserons pas faire."
 MUN_slovakia_little_war.3.a: "Quel affront !"
 MUN_slovakia_little_war.4.t: "Impasse en [71.getname]"
 MUN_slovakia_little_war.4.d: "Malheureusement, nos forces n'ont pas remporté la victoire en [71.getname]. Le manque de munitions et d'équipement motorisé a fait défaut à l'armée. Malgré cette impasse, nos commandants ont su tirer les leçons de cette bataille."
 MUN_slovakia_little_war.4.a: "Quelle déception !"
 ##Exile##
 MUN_czech_exile.1.t: "Les exilés [CZE.GetAdjMP] arrivent [ROOT.GetAuEnANP] [ROOT.GetName]"
 MUN_czech_exile.1.d: "La dissolution [GER.GetDuDelaDelNP] [GER.GetName] après la conférence de Munich a provoqué l'arrivée d'exilés [CZE.GetAdjMP] dans plusieurs pays, le nôtre y compris. Ils sont prêts à prendre les armes pour nous aider, dans l'espoir de pouvoir un jour libérer leur pays à nos côtés."
 MUN_czech_exile.1.a: "Qu'ils soient les bienvenus"
 ##NEWS EVENTS##
 MUN_czech.news.1.t: "La crise des Sudètes"
 MUN_czech.news.1.desc: "Les habitants des Sudètes ont déclenché une révolte armée contre le gouvernement [CZE.GetAdjMS]. D'après nos signalements, des paramilitaires ont pris d'assaut les commissariats et les bâtiments officiels de la région. Ce soulèvement vient en réponse à l'annonce de l'annexion [FROM.GetAdjFS].\n\nCes révoltes annoncent certainement un conflit bien plus large entre [FROM.GetLeLaLNP] [FROM.GetName] et [CZE.GetLeLaLNP] [CZE.GetName], un conflit désormais inévitable."
 MUN_czech.news.1.a: "Cela n'augure de rien de bon pour l'Europe"
 MUN_czech.news.1.b: "Le chaos est une échelle"
 MUN_czech.news.1.c: "Nous vaincrons !"
 MUN_czech.news.1.d: "La diplomatie vaincra"
 MUN_czech.news.2.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] envahi[FROM.GetTSsentNP]\n[RUT.GetLeLaLNP] [RUT.GetName]"
 MUN_czech.news.2.desc: "\nDans le grand chamboulement politique qui a ébranlé [CZE.GetLeLaLNP] [CZE.GetName], la petite région [RUT.GetDuDelaDelNP] [RUT.GetName] s'est détachée de tout territoire national. L'État sécessionniste s'est déclaré indépendant avant de former des milices pour protéger ses nouvelles frontières.\n\n[FROM.GetLeLaLNPCap] [FROM.GetName] lorgn[FROM.GetEEntNP] depuis longtemps sur la région, aussi une opération d'invasion a été lancée dans la foulée pour subjuguer le jeune pays. Cette victoire éclair n'a surpris aucun observateur ou géopoliticien."
 MUN_czech.news.2.a: "La Subcarpa-quoi ?"
 MUN_czech.news.2.b: "C'est gagné d'avance"
 MUN_czech.news.2.c: "Qu'ils viennent s'ils l'osent !"
 MUN_slovakia.news.1.t: "Escarmouches frontalières en [71.getname]"
 MUN_slovakia.news.1.desc: "Pourtant bénéficiaires de la [664.Getname] grâce au $GER_first_vienna_award$, les [HUN.GetHabitants] cherchent encore à grappiller quelques territoires frontaliers de la [71.Getname].\n\nCe conflit est [HUN.GetAuAlaAlNP] [HUN.GetName] le prétexte idéal pour mettre au banc d'essai [HUN.GetSonLeurNP] armée contre une force toute récente et relativement faible."
 MUN_slovakia.news.1.a: "Ce sont des chamailleries"
 MUN_slovakia.news.1.b: "Nous sommes parés"
