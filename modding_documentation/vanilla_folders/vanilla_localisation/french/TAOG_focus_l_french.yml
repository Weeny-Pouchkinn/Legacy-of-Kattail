 AST_alp_popularity_increase_5: "§Y$AST_ruling_party$§! (§Y$AST_alp$§!) Voix : §G+5%§!\n\n"
 AST_uap_popularity_decrease_5: "§Y$AST_ruling_party$§! (§Y$AST_uap$§!) Voix : §R-5%§!\n\n"
 AST_alp_popularity_decrease_5: "§Y$AST_ruling_party$§! (§Y$AST_alp$§!) Voix : §R-5%§!\n\n"
 AST_australian_military_forces: "Forces militaires australiennes"
 AST_australian_military_forces_desc: "Mise à l'épreuve durant la Grande Guerre, l'armée australienne a prouvé sa détermination sur les plages étrangères, tenant bon lors de l'une des campagnes les plus brutales de tout le conflit. Depuis cette époque, son contingent a été revu à la baisse pour devenir une force défensive chargée de protéger nos îles. Mais une telle expérience ne s'oublie pas : nos hommes sont prêts à servir de nouveau."
 AST_permanant_military_forces: "Forces militaires permanentes"
 AST_permanant_military_forces_desc: "La première force militaire australienne est la milice, chargée de protéger le continent. Cependant, en cette période de tensions mondiales croissantes, nous ferions bien de former une équipe d'officiers et soldats professionnels qui auront principalement fait leurs armes durant la Grande Guerre. Même si elle sera d'abord créée en capacité de réserve, cette force apportera à notre pays une certaine stabilité ainsi qu'un niveau de formation homogène."
 AST_invoke_the_1903_defence_act: "Invoquer le Defense Act de 1903"
 AST_invoke_the_1903_defence_act_desc: "Traditionnellement, l'Australie s'appuie sur sa milice pour assurer la défense nationale. Toutefois, en cas de menace importante, nous pouvons invoquer le Defense Act de 1903 de façon à faire appel à une main-d'œuvre supplémentaire pour nous protéger."
 AST_lithgow_small_arms_factory: "Manufacture d'armes légères de Lithgow"
 AST_lithgow_small_arms_factory_desc: "Créée en 1912, la manufacture d'armes légères de Lithgow avait pour but de réduire la dépendance aux armes et équipements britanniques en temps de guerre. Les tensions mondiales étant de nouveau exacerbées, nous devrions accroître la production de façon à répondre aux besoins croissants de nos forces armées."
 AST_dingo_scout_car: "Daimler Dingo"
 AST_dingo_scout_car_desc: "Traditionnellement, le développement de véhicules blindés n'est pas la spécialité de l'Australie, mais la demande de nos forces armées est de plus en plus forte dans ce domaine. Par conséquent, nous devons adopter de façon plus rigoureuse les modèles que nous fabriquons sur le plan national, comme le Daimler Dingo."
 AST_volunteer_defence_corps_taog: "Volunteer Defence Corps"
 AST_volunteer_defence_corps_taog_desc: "Fondé comme une force comparable à la Home Guard britannique, le Volunteer Defence Corps est une milice de citoyens bénévoles composée de membres inéligibles au service classique. Malgré tout, leur connaissance du terrain leur donnera un avantage majeur si le pire se produit, en cas de guérilla."
 AST_war_carriers: "Porteurs humains"
 AST_war_carriers_desc: "Durant la guerre, la logistique peut se révéler décisive. La majeure partie du territoire d'Australie est peu pourvue en transports conventionnels, comme les camions ou les trains. Nous devons donc nous appuyer davantage sur la main-d'œuvre locale, parfaitement adaptée à son environnement et maîtrisant ses cachettes et raccourcis sur le bout des doigts."
 AST_anzac_spirit: "L'esprit de l'ANZAC"
 AST_anzac_spirit_desc: "Durant la Grande Guerre, les escadrons australiens et néo-zélandais ont acquis une réputation d'excellence, ne ménageant pas leurs efforts ni le sang de l'ennemi dans leur lutte pour la victoire au nom de l'Empire. Ils faisaient preuve d'une bravoure tranquille face au danger et à l'adversité, mais aussi de nombreuses qualités que chacun admirait, parmi lesquelles l'endurance, le courage, l'ingéniosité ou encore la bonne humeur."
 AST_lee_enfield_no1_mark3: "Lee-Enfield N°1 Mk III*"
 AST_lee_enfield_no1_mark3_desc: "L'étoile a son importance ! Le Lee-Enfield N°1 Mk III* a été spécifiquement modifié pour assurer une production plus rapide et moins onéreuse. Toutefois, la demande dépassant toujours la vitesse de fabrication, nous devons désormais adopter une nouvelle stratégie consistant à faire produire les composants par de petites entreprises, avant de procéder à l'assemblage à Lithgow."
 AST_new_south_wales_government_railways: "Chemins de fer du gouvernement de la Nouvelle-Galles-du-Sud"
 AST_new_south_wales_government_railways_desc: "Les ateliers des Chemins de fer du gouvernement de la Nouvelle-Galles-du-Sud offrent une capacité unique : des composants de grande taille sont manufacturés en une seule pièce d'acier. En tant que rare nation du Commonwealth à avoir la possibilité de produire des coques moulées pour chars et tourelles, nous ferions bien de tirer profit de cet avantage."
 AST_second_australian_imperial_force: "Seconde force impériale australienne"
 AST_second_australian_imperial_force_desc: "Durant la Grande Guerre, l'Australie a déployé sa Première force impériale australienne, envoyant des troupes combattre à l'étranger. La guerre menaçant une nouvelle fois de submerger le monde entier, nous devrions réunir une Seconde force impériale australienne pour prouver de quoi l'Australie est capable."
 AST_expeditionary_leader: "Le §Ygénéral§! va recevoir le trait §YChef expéditionnaire§!, améliorant ses capacités outre-mer, mais limitant le nombre de divisions qu'il peut commander."
 AST_expeditionary_leader_plural: "Les deux §Ygénéraux§! vont recevoir le trait §YChef expéditionnaire§!, améliorant leurs capacités outre-mer, mais limitant le nombre de divisions qu'ils peuvent commander."
 AST_larrikinism: "Larrikin"
 AST_larrikinism_desc: "Désignant à l'origine une personne inculte, tapageuse, mais de bon cœur, le terme de « larrikin » incarne aujourd'hui la culture australienne caractérisée par l'anticonformisme, l'irrévérence et la bravoure tranquille face au danger. Durant la Grande Guerre, les soldats australiens ont acquis la réputation de rester calmes et résilients, quelles que fussent les situations d'adversité auxquelles ils étaient confrontés."
 AST_diggers: "Diggers"
 AST_diggers_desc: "Lorsque les troupes de l'ANZAC sont arrivées à Gallipoli, le général William Birdwood a reçu l'ordre de creuser jusqu'à trouver la sécurité (« Dig, dig, dig, until you are safe »). Cet esprit de « digger » résume aujourd'hui l'approche guerrière de l'Australie, mais constitue aussi un lien de camaraderie entre Australiens et Néo-Zélandais qui combattent côte à côte, au nom de leurs frères d'armes."
 AST_owen_gun: "Fusil mitrailleur Owen"
 AST_owen_gun_desc: "Le fusil mitrailleur Owen a acquis une réputation de fiabilité robuste, tout comme nos soldats. Alors que nos forces combattent dans le monde entier, nous devrions voir cette arme non seulement comme le symbole de l'ingéniosité australienne, mais aussi comme celui de notre esprit guerrier."
 AST_department_of_supply_and_development_taog: "Department of Supply and Development"
 AST_department_of_supply_and_development_taog_desc: "Alors que les besoins de la guerre repoussent les limites de nos systèmes logistiques et de production, il nous faut désormais centraliser nos efforts au sein d'un service dédié chargé de leur coordination."
 AST_sentinel_tank_development: "Développement de chars Sentinel"
 AST_sentinel_tank_development_desc: "Historiquement, nous avons toujours utilisé des modèles de chars importés, même lorsque nous les produisions dans notre propre pays. Nous devrions nous appuyer sur les compétences obtenues grâce à ces engins en y ajoutant une touche d'innovation australienne pour développer nos propres chars, conçus sur mesure selon nos capacités et nos ressources."
 AST_establish_training_camps: "Ouverture de camps d'entraînement"
 AST_establish_training_camps_desc: "Comme lors de la Grande Guerre, la Seconde force impériale peut être appelée pour combattre n'importe où dans le monde. Par conséquent, nous devons développer de vastes programmes d'entraînement afin de préparer nos soldats à tous les environnements, des déserts d'Afrique du Nord, aux jungles du Pacifique sud."
 AST_jungle_tanks_if_sentinel_tank_development: "Si nous avons terminé « Développement de chars Sentinel » :"
 jungle_heavy_tanks: "Chars lourds destinés à la jungle"
 AST_anti_malaria_campaign: "Campagne anti-malaria"
 AST_anti_malaria_campaign_desc: "Nos forces pourront être appelées à se battre dans les jungles du Pacifique, où les attend une menace plus mortelle que les canons ennemis : la malaria. Nous devons entreprendre des actions décisives pour protéger nos troupes de ce péril invisible."
 AST_defence_citizen_military_forces_act: "Acte de défense des forces militaires citoyennes"
 AST_defence_citizen_military_forces_act_desc: "Jusqu'à présent, seuls les soldats professionnels volontaires pouvaient être déployés à l'étranger. Alors que le conflit poursuit son escalade, nous devons établir un cadre légal pour permettre, si nécessaire, à notre milice de rejoindre elle aussi le combat à l'international."
 AST_call_that_a_knife: "Pas de lézard !"
 AST_call_that_a_knife_desc: "« Ça, c'est un couteau, fils ! » Un peu d'humour et de bravade peuvent aider à alléger bien des situations. Face au danger, nos soldats se montrent sûrs d'eux, pleins de cran, avec un soupçon de fanfaronnade."
 AST_army_inventions_directorate_taog: "Directorat des inventions militaires"
 AST_army_inventions_directorate_taog_desc: "On ne peut pas dire que la guerre ait beaucoup d'avantages, si ce n'est peut-être l'indispensable rapidité des avancées technologiques. Nous devrions créer une organisation centralisée visant à développer, perfectionner et exploiter ces percées."
 AST_yeramba: "Yeramba"
 AST_yeramba_desc: "En nous appuyant sur le succès des véhicules développés en Australie, comme le Sentinel, nous sommes passés à la vitesse supérieure par l'ajout du Yeramba à notre arsenal. Ce canon 25-pounder monté sur un châssis de char offre une puissance de feu mobile et dévastatrice contre nos ennemis."
 AST_alice_springs: "Alice Springs"
 AST_alice_springs_desc: "L'Outback est vaste... très vaste. En son centre se situe la petite ville d'Alice Springs, qui pourra servir de centre logistique pour les opérations australiennes. Nous devrions y établir une base de l'armée pour assurer la formation des troupes et les préparer à combattre dans n'importe quel environnement."
 AST_australian_regular_army: "Armée régulière australienne"
 AST_australian_regular_army_desc: "Des plages de Gallipoli aux déserts d'Afrique du Nord, en passant par les montagnes grecques et les jungles d'Asie du Sud-Est, nous avons beaucoup appris sur les différents terrains. Cette expérience durement acquise a forgé une armée parmi les plus adaptables du monde."
 AST_no1_flying_training_school: "Flying Training School No. 1"
 AST_no1_flying_training_school_desc: "Créée en 1921 avec la formation de la Force aérienne royale australienne, la Flying Training School a connu plusieurs épisodes d'ouverture et de fermeture au gré des fluctuations de la demande en personnel aérien. Avec l'augmentation des tensions mondiales, nous devrions la rouvrir de façon à entraîner une nouvelle génération de pilotes et équipages aériens."
 AST_empire_air_training_scheme_taog: "Programme d'entraînement aérien de l'empire"
 AST_empire_air_training_scheme_taog_desc: "Le Plan d'entraînement aérien du Commonwealth britannique se propose d'offrir un financement et une expertise majeurs à l'une des nations du Commonwealth pour lui permettre d'entraîner un grand nombre de pilotes et d'équipages aériens. La concurrence pour bénéficier de ce plan est féroce, avec pour favoris l'Australie et le Canada. Nous avons nous aussi soumis notre candidature dans le cadre du Programme d'entraînement aérien de l'empire."
 AST_volunteer_air_corps: "Volunteer Air Observers Corps"
 AST_volunteer_air_corps_desc: "L'espace aérien australien est vaste, dépassant largement la capacité de contrôle de ses seuls officiers professionnels. Pour maintenir une surveillance efficace du ciel, nous devrions plutôt faire en sorte que des bénévoles de chaque région tiennent les milliers de postes d'observation disséminés dans tout le pays."
 AST_improved_ground_crews: "Équipages de maintenance améliorés"
 AST_improved_ground_crews_desc: "Pour chaque pilote, une équipe entière travaille au sol de façon à assurer l'entretien de l'appareil, la coordination des vols et les activités de base. Sans oublier les navigateurs, artilleurs et bombardiers qui les accompagnent dans les airs. Nous devrions fonder un établissement destiné à l'entraînement de notre force aérienne pour lui permettre de fonctionner avec une efficacité maximale."
 AST_advanced_pilot_training: "Formation de pilotes avancée"
 AST_advanced_pilot_training_desc: "Au fur et à mesure des progrès en matière de complexité, rapidité et perfectionnement de nos avions, les pilotes doivent eux aussi améliorer leurs compétences pour exploiter au mieux ces nouvelles technologies."
 AST_advanced_pilot_training_tt: "Vitesse de gain de maîtrise §G+10%§! pour les §Ydoctrines aériennes§!"
 AST_commonwealth_aircraft_corporation_taog: "Commonwealth Aircraft Corporation"
 AST_commonwealth_aircraft_corporation_taog_desc: "La guerre aérienne se développant de plus en plus, nous devons nous assurer de ne pas nous laisser distancer dans ce domaine. Certains civils enthousiastes ou autres pionniers ont déjà perçu le potentiel de l'industrie aéronautique. Offrons-leur un financement initial de façon à favoriser l'expansion de ce secteur émergent."
 AST_reestablish_central_flying_school: "Rouvrir la Central Flying School"
 AST_reestablish_central_flying_school_desc: "Outre la Flying Training School No. 1, il existe en Australie une autre école de pilotage appelée la Central Flying School. Cette dernière pourra contribuer à répondre aux besoins croissants d'une force aérienne moderne. Alors que les tensions s'intensifient, nous devons nous assurer que notre personnel dispose des infrastructures dont il a besoin."
 AST_aerodrome_of_democracy_democracy: "L'aérodrome de la démocratie"
 AST_aerodrome_of_democracy_fascism: "L'aérodrome de la domination"
 AST_aerodrome_of_democracy_communism: "L'aérodrome de l'émancipation"
 AST_aerodrome_of_democracy_neutrality: "L'aérodrome de la puissance"
 AST_aerodrome_of_democracy: "[GET_AERODOME_NAME]"
 AST_aerodrome_of_democracy_desc: "Ses capacités aéronautiques ayant atteint des niveaux d'avant-garde, l'armée de l'air australienne a mérité le titre de « [GET_AERODOME_NAME] ». Nos pilotes combattent à travers le monde entier, tandis que nos bombardiers font peser une menace constante sur les industries de nos ennemis."
 AST_government_aircraft_factories: "Usines d'aviation gouvernementales"
 AST_government_aircraft_factories_desc: "Nous nous trouvons bien loin de l'Europe. En temps de guerre, il paraîtrait donc imprudent de nous appuyer sur nos sources habituelles d'approvisionnement aérien. Nous devons absolument développer nos propres capacités de fabrication nationales afin de produire des moteurs et structures aériennes selon nos critères."
 AST_death_from_down_under_taog: "Bons baisers du pays des kangourous"
 AST_death_from_down_under_taog_desc: "Depuis les confins de l'hémisphère sud, nous avons développé une force aérienne sans égal. Dotée d'une portée mondiale, elle frappe avec précision et une puissance dévastatrice. Peu importe où se cachent nos ennemis, ils ne pourront pas échapper à un destin fatal venu du pays des kangourous."
 AST_ride_the_lightning: "Chevauchée foudroyante"
 AST_ride_the_lightning_desc: "Rapides, féroces et implacables, nos pilotes de chasse sont le fer de lance de notre puissance aérienne. Ils prennent le contrôle des cieux pour intercepter les appareils ennemis et leur régler leur compte une bonne fois pour toutes. Partout où nos forces aériennes passent, nos ennemis trépassent."
 AST_the_gathering_storm: "La tempête s'annonce"
 AST_the_gathering_storm_desc: "Une tempête se forme à l'horizon. Notre force aérienne fait peser une menace croissante sur les cieux, frappant les points faibles de l'ennemi et soutenant nos avancées terrestres. Ce qui a commencé comme un lointain grondement se transformera bientôt en une tempête incroyablement destructrice."
 AST_hear_the_thunder: "Coup de tonnerre"
 AST_hear_the_thunder_desc: "Entendez-vous le tonnerre ? Depuis le pays des kangourous, nos bombardiers stratégiques font régner la puissance australienne sur le monde entier. Lorsque les cieux rugiront et que le sol se mettra à trembler, nos ennemis n'auront plus aucun doute : l'orage arrive, semant la destruction dans son sillage."
 AST_department_of_aircraft_production: "Département de production aéronautique"
 AST_department_of_aircraft_production_desc: "L'expansion rapide de la Force aérienne royale australienne a soumis notre capacité de production à une pression majeure. Nous devons revoir nos ambitions à la hausse en étendant et en coordonnant notre base industrielle pour répondre à la demande. Bientôt, nos avions seront tellement nombreux que les cieux disparaîtront derrière eux."
 AST_royal_australian_navy: "Royal Australian Navy"
 AST_royal_australian_navy_desc: "Formée par l'union des flottes coloniales, la Royal Australian Navy a combattu sur presque tous les fronts depuis la Grande Guerre, avant de se réduire comme peau de chagrin à cause de la diminution de ses financements. Avec l'accroissement des tensions mondiales, il est temps pour la flotte de reprendre du service."
 AST_coast_watchers: "Les Observateurs côtiers"
 AST_coast_watchers_desc: "Bien que la plupart de nos forces continuent de se concentrer sur le continent, l'adoption d'une nouvelle approche de surveillance par le nord nous offrirait un réseau d'avertissement précoce. En déployant des agents de renseignements locaux dans les îles périphériques, nous détecterons les mouvements aériens et maritimes de nos ennemis bien avant qu'ils ne menacent les côtes australiennes."
 AST_marines: "Les Marines"
 AST_marines_desc: "En tant qu'île la plus étendue de son archipel, nous devons nous assurer de posséder les capacités amphibies nous permettant de projeter notre puissance au-delà de nos côtes. En effet, si nous devons passer de la défense à l'attaque, ces forces permettront de relier efficacement les différentes îles."
 AST_naval_auxiliary_patrol_taog: "Patrouille auxiliaire navale"
 AST_naval_auxiliary_patrol_taog_desc: "Nos forces professionnelles étant déjà accaparées sur d'autres fronts, nous pouvons nous tourner vers des habitants de la région enthousiastes pour protéger nos ports et infrastructures côtières. Leur connaissance approfondie des cours d'eau régionaux rend leur contribution inestimable. De plus, personne ne soupçonnerait un pêcheur du coin d'être à notre service."
 AST_cockatoo_island_shipyards_taog: "Chantiers navals de l'île Cockatoo"
 AST_cockatoo_island_shipyards_taog_desc: "Depuis bien longtemps, les chantiers navals de l'île Cockatoo servent de repaire impérial et de centre d'entretien soutenant les opérations à l'étranger de la Royal Navy. Alors qu'ils constituent désormais un pilier de la Royal Australian Navy, nous devons étendre leurs capacités pour répondre aux demandes croissantes de notre flotte, mais aussi épauler nos forces navales."
 AST_kangaroo_point_dry_dock_taog: "Chantier naval de Kangaroo Point"
 AST_kangaroo_point_dry_dock_taog_desc: "Bien qu'Evans Deakin & Company soit principalement une société d'ingénierie, elle a su identifier la nécessité d'augmenter les capacités de construction navale face à la montée des tensions mondiales, jetant son dévolu sur Kangaroo Point. À nous de lui faciliter l'acquisition de ce terrain afin de soutenir le développement de notre flotte."
 AST_scrap_iron_flotilla_taog: "La Flottille de ferraille"
 AST_scrap_iron_flotilla_taog_desc: "Bien que les détracteurs les considèrent comme obsolètes et usés, plusieurs de nos anciens destroyers ont été rassemblés dans une même formation. Même s'ils n'ont pas le même prestige que les navires modernes, ils démontrent toute l'utilisation astucieuse des moyens en notre possession."
 AST_cruising_for_a_bruising: "Patrouille violente"
 AST_cruising_for_a_bruising_desc: "Notre marine utilise des croiseurs depuis longtemps, une tradition qui mérite d'être perpétuée. Rapides, polyvalents et puissants, ces navires se forgeront bientôt une réputation internationale : chaque ennemi qui se mettra en travers de leur chemin s'exposera à de sérieux dégâts."
 AST_strike_from_down_under: "La frappe australienne"
 AST_strike_from_down_under_desc: "Ils glissent sous les vagues sans un bruit et pilleront tous les navires sur leur passage. Si vous les voyez, un conseil : fuyez !"
 AST_hmas_sydney: "Le HMAS Sydney"
 AST_hmas_sydney_desc: "Le cuirassé appartient au passé. La puissance navale de demain se trouve dans les airs et l'Australie compte bien suivre le mouvement. Après avoir passé des années à restructurer et moderniser notre marine, nous allons enfin achever notre objectif : la création d'un porte-avions qui incarnera fièrement la puissance maritime australienne pour les années à venir."
 AST_conscription_level_allowed_tt: "Volonté politique pour une conscription augmentée (priorités avec l'icône de main-d'œuvre)"
 AST_conscription_level_allowed_limited_conscription_tt: "Déverrouille un niveau supplémentaire de la §Ylégislation sur la conscription§!, permettant le §Yservice court§!"
 AST_conscription_level_allowed_extensive_conscription_tt: "Déverrouille un niveau supplémentaire de la §Ylégislation sur la conscription§!, permettant le §Yservice obligatoire§!"
 AST_conscription_level_allowed_service_by_requirement_tt: "Déverrouille un niveau supplémentaire de la §Ylégislation sur la conscription§!, permettant la §Ymobilisation générale§!"
 AST_conscription_level_allowed_all_adults_serve_tt: "Déverrouille un niveau supplémentaire de la §Ylégislation sur la conscription§!, permettant le §Yservice de tous les adultes§!"
 AST_conscription_level_allowed_scraping_the_barrel_tt: "Déverrouille un niveau supplémentaire de la §Ylégislation sur la conscription§!, permettant de faire les §Yfonds de tiroir§!"
 AST_conscription_law_so_far: "[CONSCRIPTION_LAW_SO_FAR]"
