 ABDA_ship_a_day_modifier_tt: "Modifie §Y$ABDA_supreme_command$§! ainsi :\n Attaque des sous-marins §G+10%§!\n Défense des sous-marins §G+10%§!"
 ABDA_keep_trade_open_modifier_tt: "Modifie §Y$ABDA_supreme_command$§! ainsi :\n Efficacité de l'escorte §G+10%§!\n Défense de l'escorte §G+10%§!"
 ABDA_unified_naval_command_modifier_tt: "Modifie §Y$ABDA_supreme_command$§! ainsi :\n Gain d'expérience du navire §G+10%§!"
 ABDA_develop_naval_infrastructure_ast_tt: "Pour [AST.GetLeLaLNP] [AST.GetName] : §Y2 chantiers navals§! sur un territoire national."
 ABDA_develop_naval_infrastructure_ins_tt: "Pour [INS.GetLeLaLNP] [INS.GetName] : §Y2 chantiers navals§! sur un territoire national."
 ABDA_develop_naval_infrastructure_generic_tt: "[AST.GetLeLaLNPCap] [AST.GetName] et [INS.GetLeLaLNP] [INS.GetName] peuvent recevoir 2 chantiers navals sur leurs territoires nationaux, selon leur adhésion à l'§YABDACOM§!."
 ABDA_expand_the_command_tt: "Étend l'adhésion à l'ABDACOM [SIA.GetAuAlaAlNP] [SIA.GetName], [NZL.GetAuAlaAlNP] [NZL.GetName] et [MAL.GetAuAlaAlNP] [MAL.GetName] si ces pays sont dans notre faction, ce qui leur octroie le modificateur actuel §Y$ABDA_supreme_command$§!."
 ABDA_naval_procurement_ins_ships_tt: "Pour [INS.GetLeLaLNP] [INS.GetName] : §Y6 destroyers de classe Clemson§! issus de flottes [USA.GetAdjFP] réformées."
 ABDA_naval_procurement_hol_ships_tt: "Pour [HOL.GetLeLaLNP] [HOL.GetName] : §Y6 destroyers de classe Clemson§! issus de flottes [USA.GetAdjFP] réformées."
 ABDA_naval_procurement_ast_ships_tt: "Pour [AST.GetLeLaLNP] [AST.GetName] : §Y6 destroyers de classe Clemson§! issus de flottes [USA.GetAdjFP] réformées."
 ABDA_naval_procurement_generic_tt: "[AST.GetLeLaLNPCap] [AST.GetName], [HOL.GetLeLaLNP] [HOL.GetName] et [INS.GetLeLaLNP] [INS.GetName] peuvent chacun recevoir §Y6 destroyers de classe Clemson§! issus de flottes [USA.GetAdjFP] réformées, selon leur adhésion à l'§YABDACOM§!."
