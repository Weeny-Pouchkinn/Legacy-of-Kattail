l_french:
 INS_nationalize_companies_tt: "Tous les groupes militaro-industriels et les groupes industriels vont être nationalisés et rebaptisés."
 available_focus_tt: "Priorité(s) §Gdisponible(s)§! :\n"
 INS_is_union_tt: "A formé l'Union néerlando-indonésienne"
 INS_is_union_tt_NOT: "N'a pas formé l'Union néerlando-indonésienne"
 INS_denounce_soetardjo: "Dénoncer Soetardjo"
 INS_denounce_soetardjo_tt: "Nous allons lancer une révolution clandestine : l'objectif est d'infiltrer le gouvernement en établissant des cellules de guérilléros sur tout l'archipel. Une fois prêts, nous lancerons une guérilla contre les Néerlandais, pour gagner notre indépendance."
 INS_soetardjo_petition_debate_done_tt: "Le débat au Volksraad sur la motion d'autonomie de Soetardjo vient de se conclure"
 INS_tkr_tt: "Modifie §YLa TKR§! ainsi :"
 INS_commander_sudirman_tt: "§YSudirman§!([INS.GetFlag]) est promu au rang de §Ymaréchal§!"
 INS_the_declaration_of_independence: "La déclaration d'indépendance"
 INS_the_declaration_of_independence_desc: "Ne prenons pas le risque d'attendre, battons le fer tant qu'il est chaud ! Envoyons nos milices capturer les ports, les villes et les centres industriels le plus vite possible pour ne pas laisser le temps aux autorités néerlandaises de réagir. Enchaînons ensuite en déclarant l'indépendance du pays et la création de la République d'Indonésie."
 INS_the_declaration_of_independence_tt: "Nous allons déclarer notre §Yindépendance§!. Chaque État dans lequel nous avons établi une §Ybase de la milice§! ou un §Yquartier général§! nous reviendra, tandis que le reste reviendra aux [HOL.GetHabitants].\n\nLes [HOL.GetHabitants] ne reconnaîtront pas notre souveraineté, déclenchant un conflit qui pourrait se transformer en une §Rguerre§!.\n\nDonne accès au raid terrestre qui permet de prendre le contrôle d'États."
 INSHOL_the_declaration_of_independence: "La Révolution nationale"
 INS_laskar_rakjat: "Laskar Rakyat"
 INS_laskar_rakjat_desc: "La révolution est portée par des milices de toutes tailles disséminées à travers l'Indonésie. La victoire sera assurée seulement si nous coordonnons efficacement ces milices. Mais tâchons de le faire intelligemment : instituer des pouvoirs à des groupes liés à nos opposants politiques pourrait se retourner contre nous."
 INS_militia_tt: "Crée un nouveau modèle de division, la milice des §Yrésistants§!, et donne accès aux décisions pour la gérer."
 INS_militia_warning_tt: "Les milices sont des groupes §Ysemi-autonomes§! de résistants qui se battront pour nous, moyennant une compensation. §RSi nous ne satisfaisons pas leur rémunération, la stabilité sera fortement réduite !§!"
 INS_usa_tanks_opinion_mod: "Achat de nos chars"
 INS_republic_add_generals_tt: "(§Y$INS_sudirman$§!([INS.GetFlag]), §Y$INS_soengkono$§!([INS.GetFlag]), §Y$INS_supriyadi$§!([INS.GetFlag]), §Y$INS_djatikoesoemo$§!([INS.GetFlag]), §Y$INS_maludin_simbolan$§!([INS.GetFlag])) devient général."
 INS_big_militia_presence_tt: "Sera sous le contrôle de nos milices lorsque nous déclarerons l'indépendance"
 INS_prepare_raiding_bases: "Préparer les bases de raid"
 INS_prepare_raiding_bases_desc: "Nous allons établir des bunkers clandestins à travers l'archipel grâce à notre réseau d'espions. Une fois la révolution en marche, nous pourrons frapper efficacement sur tout le territoire."
 # <Joint Tree - Central Milestones>
 INSHOL_dutch_east_indies: "Indes néerlandaises"
 INSHOL_dutch_east_indies_desc: "Il y a près de 500 ans, la colonie voyait le jour. À travers les époques, elle a su se réinventer. Dans un monde en constante évolution, nos actions définiront la nature des relations néerlando-indonésiennes pour les décennies à venir."
 INSHOL_the_war_in_europe: "La guerre en Europe"
 INSHOL_the_war_in_europe_desc: "Le conflit européen empirant de jour en jour, les Pays-Bas ont dû rejoindre la guerre. Nous ne devrions pas compter sur eux pour assurer notre protection. C'est le moment de prouver de quoi nous sommes capables face à l'envahisseur."
 # <Joint Tree - Military Equipment Contracts>
 INSHOL_military_equipment_contracts: "Contrats de matériel militaire"
 INSHOL_military_equipment_contracts_desc: "Les Indes sont un archipel très vaste abritant des dizaines de millions de citoyens, mais très loin de posséder la capacité industrielle nécessaire pour se défendre. En revanche, nous avons pléthore de ressources à échanger avec les nations du monde entier : signons des contrats commerciaux avec de grandes démocraties pour assurer notre protection tacite."
 INSHOL_hawk_75a7: "Le Hawk 75a-7"
 INSHOL_hawk_75a7_desc: "Le chasseur américain Hawk 75a-7 est un avion pensé pour les Indes : accessible et puissant. Signons un contrat avec son constructeur pour doter notre armée de l'air d'une nouvelle puissance."
 INSHOL_purchase_american_tanks: "Acheter des chars américains"
 INSHOL_purchase_american_tanks_desc: "Les Indes n'ont peut-être pas l'industrie adéquate pour fabriquer leurs chars, mais elles possèdent les fonds pour les acheter aux États-Unis grâce à son export de caoutchouc."
 INSHOL_purchase_british_artillery: "Acheter de l'artillerie [ENG.GetAdjFS]"
 INSHOL_purchase_british_artillery_desc: "Sous-traitons la fabrication de notre artillerie au Royaume-Uni pour nous concentrer sur d'autres équipements."
 INSHOL_produce_own_goods: "Production de biens domestiques"
 INSHOL_produce_own_goods_desc: "Les accords commerciaux lucratifs ne manquent pas, néanmoins, ne laissons pas de côté nos propres lignes de production et notre industrie militaire. Finançons les entreprises domestiques pour limiter notre dépendance aux importations."
 # <Joint Tree - East Indies Investments>
 INSHOL_east_indies_investments: "Investissements dans les Indes"
 INSHOL_east_indies_investments_desc: "Un bon suzerain se doit d'investir pour contribuer au développement économique de ses colonies, à l'instar des Indes : les colons en profiteront à court terme, et nous en bénéficierons sur le long terme."
 INSHOL_east_indies_student_exchange: "Programme d'échange étudiant des Indes"
 INSHOL_east_indies_student_exchange_desc: "En donnant aux étudiants indonésiens l'occasion de découvrir nos universités néerlandaises, nous pourrions dynamiser l'économie des deux territoires."
 INSHOL_east_indies_fokker_division: "Former la division Fokker des Indes"
 INSHOL_east_indies_fokker_division_desc: "Fokker produit tellement d'appareils pour l'armée de l'air des Indes qu'il serait plus rentable de fonder une succursale dédiée à ce corps militaire."
 INSHOL_expand_shell: "Agrandir les infrastructures de Shell"
 INSHOL_expand_shell_desc: "Shell s'installe de plus en plus dans le paysage économique du pays. Si nous voulons rentabiliser la capacité d'exportation de cette compagnie, nous ferions mieux de développer notre infrastructure pétrolière."
 INSHOL_increase_funding_for_tix: "Accroître le financement du projet T.IX"
 INSHOL_increase_funding_for_tix_desc: "Les ingénieurs de Fokker travaillent sur un nouveau bombardier bi-moteur qui viendra remplacer les modèles obsolètes qu'utilise encore l'armée de l'air des Indes. Les fonds accordés à ce projet sont quasi inexistants, et à moins d'investir massivement, il ne verra sûrement pas le jour avant plusieurs années."
 INSHOL_reduce_land_ownership_taxes: "Réduire l'impôt foncier"
 INSHOL_reduce_land_ownership_taxes_desc: "Réduisons les taxes imposées aux propriétaires fonciers indonésiens afin d'encourager le développement des fermes et autres entreprises."
 INSHOL_coffee_plantations: "Plantations de café"
 INSHOL_coffee_plantations_desc: "Essayons d'acquérir autant de terres que possible sur les îles orientales pour y fonder des plantations de café."
 INSHOL_overallwagen: "Overvalwagen"
 INSHOL_overallwagen_desc: "Les chars ne correspondent pas à l'armée des Indes. Non seulement nous n'avons pas les capacités industrielles pour les fabriquer, mais la nature des sols les rend très difficilement utilisables. Nous ferions plutôt mieux de mettre au point des véhicules blindés."
 INSHOL_indonesian_cheap_labor: "Main-d'œuvre indonésienne bon marché"
 INSHOL_indonesian_cheap_labor_desc: "$CONGO_cheap_labor_desc$" #LL: stealing this to save time, hope you don't mind!
 INSHOL_eastern_development_fund: "Fonds de développement des îles orientales"
 INSHOL_eastern_development_fund_desc: "Nous dédions bien trop de fonds à Java et Sumatra, au grand dam du reste des colonies. Tâchons de développer des infrastructures sur les îles de l'est pour faciliter leur industrialisation."
 INSHOL_increase_rubber_taxes: "Augmenter les taxes sur le caoutchouc"
 INSHOL_increase_rubber_taxes_desc: "Les grandes compagnies de caoutchouc s'enrichissent sur le dos des Indes en exportant ses ressources à prix d'or. Nous méritons aussi de profiter de ces transactions : augmentons les taxes."
 INSHOL_reform_knil: "Réformer la KNIL"
 INSHOL_reform_knil_desc: "Depuis que les Indes ont achevé leur conquête de tout l'archipel, l'armée royale des Indes néerlandaises n'a pas évolué, principalement en raison d'un manque de fonds. Alors que les tensions s'élèvent dans le monde entier, il serait prudent de réarmer les Indes au plus vite."
 INSHOL_fund_ml_knil: "Financer la ML-KNIL"
 INSHOL_fund_ml_knil_desc: "Si nous souhaitons tenir tête aux grandes armées de ce monde, il nous faut impérativement une armée de l'air forte, faute de quoi nous serons bien trop faibles."
 INSHOL_bandung_aircraft_facility_tt: "§YJava occidental :§!\n    Ajoute §G1§! emplacement de construction et §G1§! §Yusine militaire§! par priorité accomplie"
 INSHOL_rangers: "Rangers"
 INSHOL_rangers_desc: "Les Indes représentent un vaste archipel constitué d'environnements très variés. Formons des rangers à ces conditions particulières pour défendre au mieux nos terres."
 INSHOL_mountaineers: "Infanterie de montagne"
 INSHOL_mountaineers_desc: "Formons une infanterie de montagne capable de se battre sur les reliefs les plus hostiles de notre archipel."
 INSHOL_elevate_elite_infantry: "Poster des Speciale Troepen"
 INSHOL_elevate_elite_infantry_desc: "Les stratégies de la Grande Guerre sont d'un ancien temps : il faut désormais s'adapter aux nouvelles technologies pour rester à la pointe. Formons des divisions d'infanterie d'élite capables de se défendre dans toutes sortes d'environnements."
 INSHOL_modernize_knil: "Moderniser la KNIL"
 INSHOL_modernize_knil_desc: "Nous allons mettre à l'étude de nouvelles doctrines pour l'armée royale afin de toujours garder une longueur d'avance sur l'ennemi."
 INSHOL_transfer_of_henri_winkelman: "Transfert de Henri Winkelman"
 INSHOL_transfer_of_henri_winkelman_desc: "Henri Winkelman a servi au sein de la KNIL durant de nombreuses années. De toute évidence, les Indes ont de nouveau besoin de lui. Organisons son transfert officiel de ce pas."
 INSHOL_eastern_conscription: "Lever les corps auxiliaires"
 INSHOL_eastern_conscription_desc: "Java et Madura comptent de nombreux corps auxiliaires indigènes sous le contrôle de régents locaux. Étant donnée la situation actuelle, nous pourrions essayer de conclure un accord avec ces chefs tribaux pour intégrer leurs divisions au sein de nos armées."
 INSHOL_establish_vk_knil: "Fonder la VK-KNIL"
 INSHOL_establish_vk_knil_desc: "Nous allons fonder un corps de femmes volontaires pour la KNIL. Leur contribution jouera un rôle clé dans l'optimisation de notre logistique et nos communications."
 INSHOL_emergency_dockyard_construction: "Construction d'un chantier naval d'urgence"
 INSHOL_emergency_dockyard_construction_desc: "La menace d'une invasion navale n'a jamais été aussi tangible. Renforçons nos défenses maritimes en priorité."
 INSHOL_emergency_powers_gov_general: "Pouvoirs d'urgence au gouverneur général"
 INSHOL_emergency_powers_gov_general_desc: "La guerre nous pousse à prendre des décisions difficiles sur le vif, ce qui est impossible si chaque décision pour les Indes doit d'abord passer par les Pays-Bas. Octroyons à [INS.GetLeader] les pouvoirs d'urgence, afin qu'il puisse agir en temps voulu."
 INSHOL_emergency_naval_purchases: "Acquisition de navires d'urgence"
 INSHOL_emergency_naval_purchases_desc: "Nos littoraux sont bien trop exposés. Il faut agir vite : constituons une marine puissante avant de nous faire envahir. Achetons des navires à crédit auprès de compagnies privées et rééquipons-les pour en faire des destroyers."
 INSHOL_east_indies_navy: "Marine des Indes orientales"
 INSHOL_east_indies_navy_desc: "Les [INS.GetHabitants] n'ont pas de marine à proprement parler, ce qui oblige les Pays-Bas à protéger leur colonie. Compte tenu des tensions croissantes en Europe comme en Asie, cette situation ne peut plus durer. Nous devons entamer la création d'une marine [INS.GetAdjFS]."
 INSHOL_marines: "Marines"
 INSHOL_marines_desc: "Établissons un corps de marines des Indes sous la houlette du corps naval nouvellement formé. Ils iront se former sur les navires néerlandais."
 INSHOL_domestic_ship_production: "Production intérieure de navires"
 INSHOL_domestic_ship_production_desc: "Si nous voulons une marine forte et fière face à nos voisins, nous allons devoir mettre les bouchées doubles dans la production de navires."
 INSHOL_destroyers: "Destroyers"
 INSHOL_destroyers_desc: "Nos navires de guerre sont bien trop imposants pour les atolls et les criques de l'archipel ; sans escorte, ils se feront prendre au piège. Dessinons des destroyers modernes afin de dominer les mers et protéger nos voies maritimes."
 INSHOL_cruisers: "Croiseurs"
 INSHOL_cruisers_desc: "Une flotte sans cuirassés doit savoir compter sur ses croiseurs. Une puissante escadrille de ces appareils permettrait à notre marine de patrouiller sur de longues distances, d'île en île, afin de repousser efficacement toute tentative de raid sur nos voies maritimes."
 INSHOL_submarines: "Sous-marins"
 INSHOL_submarines_desc: "Les détroits multiples des Indes orientales sont de véritables guets-apens, où des sous-marins bon marché sont capables de couler des bâtiments hors de prix. Équipons-nous de ces appareils ingénieux pour frapper l'ennemi avant même qu'il ne puisse nous repérer."
 INSHOL_outsourced_navy: "Sous-traiter la production aux sociétés"
 INSHOL_outsourced_navy_desc: "Le budget colonial n'est pas illimité et les dépenses sont déjà conséquentes, c'est pourquoi nous ne pouvons pas accorder plus de fonds à la marine. En revanche, nous pouvons mandater des sociétés pour qu'elles gèrent la production à notre place."
 INSHOL_divert_civilian_to_navy: "Attribuer le budget civil et militaire à la marine"
 INSHOL_divert_civilian_to_navy_desc: "À en juger la situation mondiale préoccupante, le risque d'invasion navale n'a jamais été aussi grand. L'heure n'est pas aux économies : réattribuons les fonds de tous les secteurs gouvernementaux à la marine."
 INS_netherlands_can_remove_autonomy_tt_50: "\nSi [HOL.GetFlag] [HOL.GetLeLaLNP] §Y[HOL.GetName]§! achève cette priorité en premier :\n    ([INS.GetFlag]§Y[INS.GetName]§!) : ajoute §Y-50 £autonomy_texticon§!"
 INS_netherlands_can_remove_autonomy_tt_75: "\nSi [HOL.GetFlag] [HOL.GetLeLaLNP] §Y[HOL.GetName]§! achève cette priorité en premier :\n    ([INS.GetFlag]§Y[INS.GetName]§!) : ajoute §Y-75 £autonomy_texticon§!"
 INS_netherlands_can_remove_autonomy_tt_100: "\nSi [HOL.GetFlag] [HOL.GetLeLaLNP] §Y[HOL.GetName]§! achève cette priorité en premier :\n    ([INS.GetFlag]§Y[INS.GetName]§!) : ajoute §Y-100 £autonomy_texticon§!"
 INS_netherlands_can_remove_autonomy_tt_150: "\nSi [HOL.GetFlag] [HOL.GetLeLaLNP] §Y[HOL.GetName]§! achève cette priorité en premier :\n    ([INS.GetFlag]§Y[INS.GetName]§!) : ajoute §Y-150 £autonomy_texticon§!"
 INS_netherlands_can_remove_autonomy_tt_200: "\nSi [HOL.GetFlag] [HOL.GetLeLaLNP] §Y[HOL.GetName]§! achève cette priorité en premier :\n    ([INS.GetFlag]§Y[INS.GetName]§!) : ajoute §Y-200 £autonomy_texticon§!"
 INS_netherlands_can_remove_autonomy_tt_250: "\nSi [HOL.GetFlag] [HOL.GetLeLaLNP] §Y[HOL.GetName]§! achève cette priorité en premier :\n    ([INS.GetFlag]§Y[INS.GetName]§!) : ajoute §Y-250 £autonomy_texticon§!"
 INSHOL_begin_negotiations_soetardjo: "Ouvrir les négociations avec Soetardjo"
 INSHOL_begin_negotiations_soetardjo_desc: "La motion d'autonomie de Soetardjo a du potentiel : elle propose un compromis entre les nationalistes et les loyalistes. Tentons d'ouvrir les négociations avec son parti."
 INSHOL_urge_gov_veto: "Obtenir le véto du gouverneur"
 INSHOL_urge_gov_veto_desc: "La motion Soetardjo est un traquenard tendu par les nationalistes, et le gouvernement des Indes tombe dans le panneau. Implorons le gouverneur général d'apposer son véto sur-le-champ avant de perdre notre colonie."
 INSHOL_eventual_autonomy: "Accepter une autonomie conditionnelle"
 INSHOL_eventual_autonomy_desc: "L'Indonésie crie son désir d'indépendance, et elle ne semble pas s'en détourner. Acceptons d'octroyer l'autonomie aux Indes, à condition qu'elles se prouvent capables de subvenir à leurs besoins et de préserver les idéaux démocratiques."
 INSHOL_autonomous_dominion: "La motion Soetardjo de [GetYear]"
 INSHOL_autonomous_dominion_desc: "Les Indonésiens sont tellement déterminés à obtenir leur indépendance qu'ils ont réussi à satisfaire les conditions « d'autonomie » imposées par les Pays-Bas pour valider la motion Soetardjo. En ce jour, nous déclarons donc notre indépendance totale et inconditionnelle de la couronne néerlandaise."
 INS_cannot_become_independent_tt: "§W§Y[INS.GetFlag] Les [INS.GetHabitants]§! §Rne pourront plus devenir indépendants§! sans l'intervention d'une puissance étrangère.§!"
 INSHOL_sideline_the_volksraad: "Écarter le Volksraad"
 INSHOL_sideline_the_volksraad_desc: "La motion Soetardjo enfreint manifestement l'article 1 de la constitution néerlandaise, sans parler du trouble qu'elle provoquerait au sein de l'administration des Indes. Elle doit être interdite."
 INSHOL_prioritize_dutch_profits: "Privilégier les profits néerlandais"
 INSHOL_prioritize_dutch_profits_desc: "Nous œuvrerons à la croissance des revenus pour la mère patrie. Après tout, sa stabilité économique assure la stabilité de tout le royaume."
 INSHOL_development_loans_netherlands: "Crédit au développement des Pays-Bas"
 INSHOL_development_loans_netherlands_desc: "Nous pouvons emprunter auprès de compagnies néerlandaises pour dynamiser notre campagne d'industrialisation. Bien évidemment, nous négocierons le taux d'intérêt par notre statut de colonie en développement, mais nous devrons quand même rembourser la somme."
 INSHOL_request_economic_dev_subsidy: "Demander des subventions de développement économique"
 INSHOL_request_economic_dev_subsidy_desc: "Nous avons prouvé aux yeux de notre suzerain notre rentabilité en tant que colonie. Tâchons de lui rappeler lorsque nous lui demanderons des subventions au développement industriel."
 INSHOL_loyalty_to_crown: "Loyauté à la Couronne"
 INSHOL_loyalty_to_crown_desc: "Les Indes possèdent mille visages, mais celui qu'elles arborent en tout temps, c'est le visage de leur loyauté envers les Pays-Bas. La reine Wilhelmine nous mènera à la victoire. Ne laissons pas le nationalisme déchirer 500 ans d'histoire. Réaffirmons notre fidélité à la Couronne."
 INS_loans_timer: "\nDans §Y365§! jours :"
 INS_expand_batavia_med_school_tt: "§Y$INS_dutch_east_indies$§! : Le modificateur de vitesse de recherche est d'au moins §G1%§!"
 INS_subsidize_local_business: "Subventionner les sociétés locales"
 INS_subsidize_local_business_desc: "Proposons des subventions aux sociétés locales afin de stimuler la croissance économique de tout le pays."
 INSHOL_education_reforms: "Réformes de l'Éducation"
 INSHOL_education_reforms_desc: "La majorité de la population des Indes n'a pas accès à une éducation digne de ce nom : très peu ont fréquenté un collège. Si nous tenons à ce que ce territoire devienne un jour un État industrialisé, il faut offrir une éducation adéquate à nos citoyens."
 INS_expand_batavia_med_school: "Développer l'école de médecine de Batavia"
 INS_expand_batavia_med_school_desc: "Bâtissons de nouveaux bâtiments sur le campus et engageons de nouveaux professeurs pour rendre l'éducation encore plus accessible, un point essentiel à la croissance économique."
 INS_prepare_for_policy_shift: "Planifier un revirement politique"
 INS_prepare_for_policy_shift_desc: "Le paysage politique des Indes s'est métamorphosé sous la lumière des idéaux nationalistes. Nos mesures actuelles sont clairement dépassées. Tentons de restructurer notre gouvernement tout entier."
 INS_reallocate_rubber_industry_funding: "Réinvestir les fonds de l'industrie du caoutchouc"
 INS_reallocate_rubber_industry_funding_desc: "Notre dépendance à l'industrie du caoutchouc a eu de désastreuses répercussions sur notre économie. Diversifions nos sources de revenus en prospectant pour de nouvelles ressources, en ouvrant des mines et des usines. Cette décision nous coûtera cher, alors il faudra réduire le budget des plantations de caoutchouc par la même occasion."
 INS_reallocate_rubber_industry_funding_tt: "Donne accès à la décision de §Ysupprimer le caoutchouc d'un État§! pour le remplacer par de petites quantités de plusieurs §Yautres ressources§!"
 INSHOL_nationalist_coallition: "Une coalition nationaliste"
 INSHOL_nationalist_coallition_desc: "Le Volksraad est entravé par les chaînes de la docilité. Le temps des motions et des ajournements est révolu. Une coalition de membres nationalistes de la chambre exige l'indépendance inconditionnelle. Les voix vont de nouveau s'élever à travers le pays, des voix que les Néerlandais pensaient avoir tues depuis bien longtemps."
 INSHOL_volksraad_compromises: "Les concessions du Volksraad"
 INSHOL_volksraad_compromises_desc: "Les réformes du « Conseil du peuple » ont permis de grandes avancées pour notre pays, alors poursuivons nos efforts ; le Volksraad demeure à la tâche pour trouver toujours plus de compromis avec La Haye, misant sur une autonomie progressive et pacifique plutôt qu'une rupture violente. L'avenir au sein du Commonwealth néerlandais semble bien plus avantageux sur le long terme."
 INSHOL_establish_the_princely_council: "Fonder le Conseil princier"
 INSHOL_establish_the_princely_council_desc: "Les sultans et les rajas de l'archipel inspirent une loyauté qu'aucun conseil de Batavia n'a jamais su égaler. Leurs cours existaient bien avant la Compagnie ou la République. Fondons un conseil officiel regroupant toutes ces figures royales afin de leur offrir une place à la tête de notre nation et profiter de leur autorité."
 INSHOL_nationalize_dutch_companies: "Nationaliser les entreprises néerlandaises"
 INSHOL_nationalize_dutch_companies_desc: "Les grandes entreprises de négoce, les compagnies maritimes, les groupements de plantations et les banques portent tous l'identité néerlandaise, une situation qui ne peut plus durer ; désormais, elles adopteront l'identité indonésienne. Remanions les conseils de direction, changeons les noms et investissons enfin tout le capital qu'ils extorquaient dans nos îles."
 INSHOL_democracy: "Une Indonésie démocratique"
 INSHOL_democracy_desc: "Le Volksraad a connu des débuts timides, un cabinet d'apparat pour prétendre à la représentation des peuples autochtones. Mais depuis, il a su développer tout son potentiel. Le conseil va être remanié pour devenir une législature formelle, composée de membres élus par le peuple qu'il représente afin de prendre les meilleures décisions pour la nation."
 INSHOL_princely_authority: "Autorité princière"
 INSHOL_princely_authority_desc: "La formation d'un conseil royal était judicieuse, mais les sultans ayant contribué à la naissance de cette nation ont encore un rôle à jouer ; le parlement ne sera pas une entrave à l'expression totale de ses peuples. Les cours ancestrales devront désormais s'en assurer."
 INSHOL_encourage_further_investment: "Encourager les investissements"
 INSHOL_encourage_further_investment_desc: "Le Volksraad a convenu d'une résolution de la situation politique et le capital néerlandais en a pris bonne note : avec une réduction des taxes et l'extension des garanties, les chambres du commerce d'Amsterdam et de Rotterdam sont désormais assurées que l'archipel demeure ouvert au commerce. Toutes les mannes financières sous l'ancienne administration restent rentables sous la nouvelle."
 # <Joint Tree - ABDACOM>
 INSHOL_east_indies_artillery: "Fabrique d'artillerie des Indes"
 INSHOL_east_indies_artillery_desc: "L'ouverture d'usines d'artillerie à Java réduira notre dépendance à l'armement étranger."
 INSHOL_recall_gerardus_johannes_berenschot: "Rappeler le général Berenschot"
 INSHOL_recall_gerardus_johannes_berenschot_desc: "Gerardus Johannes Berenschot est l'un des généraux les plus doués de tout le Commonwealth. Il a passé la majeure partie de sa carrière dans les Indes avant de rejoindre les Pays-Bas. Mais nous avons à nouveau besoin de lui pour relancer notre effort de guerre."
 INSHOL_east_indies_cruiser_manufacturing: "Fabrique de croiseurs des Indes"
 INSHOL_east_indies_cruiser_manufacturing_desc: "La fabrication domestique des croiseurs nous permet à la fois de nous émanciper des Néerlandais tout en formant une véritable marine, une campagne indispensable face à la menace japonaise."
 INSHOL_transfer_of_conrad_helfrich: "Transférer Conrad Helfrich aux Indes"
 INSHOL_transfer_of_conrad_helfrich_desc: "Le transfert de l'amiral Conrad Helfrich vers les Indes va rehausser l'efficacité de nos flottes."
 # <Joint Tree - Naval Program>
 INSHOL_naval_program: "Programme naval néerlando-indonésien"
 INSHOL_naval_program_desc: "La marine des Indes orientales est loin de rivaliser avec les flottes étrangères, et même avec les flottes d'autres colonies. Il serait judicieux d'investir dans le développement naval du territoire afin d'accélérer les choses."
 INSHOL_naval_program_transfer_25_tt: "Transfère §Y25%§! de nos forces navales [INS.GetAuAlaAlNP] [INS.GetName]"
 INSHOL_naval_program_transfer_25_2_tt: "[HOL.GetFlag] Les §Y[HOL.GetHabitants]§! vont transférer §Y25%§! de leurs forces navales [INS.GetAuAlaAlNP] §Y[INS.GetName]§!"
 INSHOL_naval_program_transfer_100_tt: "Transfère §Rl'intégralité de notre marine§! [INS.GetAuAlaAlNP] [INS.GetName]"
 INSHOL_naval_program_transfer_100_2_tt: "[HOL.GetFlag] Les §Y[HOL.GetHabitants]§! vont transférer la totalité de leurs forces navales [INS.GetAuAlaAlNP] §Y[INS.GetName]§!"
 INSHOL_naval_program_rejected_tt: "Donne accès à la priorité nationale §Y$INSHOL_naval_secondchance$§!"
 INSHOL_hybrid_navy: "Une marine hybride"
 INSHOL_hybrid_navy_desc: "Notre marine ne peut pas simplement compter sur la flotte [HOL.GetAdjFS] ; il faut lancer l'assemblage de nos propres navires avant qu'une erreur logistique ne vienne enrayer nos forces."
 INSHOL_request_naval_control: "Escadrille des Indes orientales"
 INSHOL_request_naval_control_desc: "[HOL.GetLeLaLNPCap] [HOL.GetName] [HOL.GetAOntNP] disparu. Plus personne ne peut assurer le commandement de [HOL.GetSaLeurNP] marine. Prenons-en le contrôle jusqu'à la fin de la guerre."
 INSHOL_naval_secondchance: "L'alternative navale"
 INSHOL_naval_secondchance_desc: "Les [HOL.GetHabitants] ont refusé de nous céder le commandement de leur marine, pour autant nous devons nous défendre si nous ne voulons pas nous retrouver envahis. La situation aurait été beaucoup plus simple s'ils avaient accepté, mais nous allons devoir trouver une autre alternative."
 # <Joint Tree - Netherlands in Exile>
 INSHOL_netherlands_in_exile: "Les Pays-Bas en exil"
 INSHOL_netherlands_in_exile_desc: "La disparition tragique de notre royaume a bel et bien eu lieu. Pour autant, ne nous laissons pas aller au défaitisme. Faisons notre deuil et tentons de sauver ce que nous pouvons."
 # INSHOL_relocate_prime_minister: "Relocate the Prime Minister to Java"
 INSHOL_relocate_our_generals: "Délocaliser notre armée à Java"
 INSHOL_relocate_our_generals_desc: "Que tous les généraux et commandants ayant pu fuir mènent leurs hommes à [1058.GetName] au plus vite, avant qu'il ne soit trop tard."
 #INSHOL_relocate_our_soldiers: "Transfer Holdout Soldiers to Java"
 INSHOL_netherlands_indonesia_union: "Union néerlando-indonésienne"
 INSHOL_netherlands_indonesia_union_desc: "L'idée d'une union égalitaire entre [HOL.GetLeLaLNP] [HOL.GetName] et [INS.GetLeLaLNP] [INS.GetName] peut sembler ridicule, mais étant donné la tragédie qui frappe notre nation, c'est peut-être notre seule chance de préserver notre souveraineté."
 # <Sukarno Shared Branch - Resistance Buildup>
 INS_underground_revolution: "Révolution clandestine"
 INS_underground_revolution_desc: "Nous allons organiser une révolution dans le plus grand secret, tentant de recruter autant de partisans que possible avant de passer à l'acte."
 INS_infiltrate_the_media: "Infiltrer les médias"
 INS_infiltrate_the_media_desc: "Notre mouvement s'est assuré de ranger dans notre camp des membres hauts placés des plus grandes organisations médiatiques des Indes. Usons de ces nouveaux partisans en diffusant l'opinion pro-révolutionnaire parmi les citoyens."
 INS_infiltrate_the_army: "Infiltrer l'armée"
 INS_infiltrate_the_army_desc: "Une grande partie de nos partisans sont engagés dans la KNIL, et ce, à tous les échelons. Laissons traîner des oreilles afin de recueillir autant de secrets que possible et hissons nos membres à des postes hauts placés. Lorsque nous passerons à l'acte, la KNIL sera plongée dans le chaos."
 INS_privately_owned_military_industry: "Industrie militaire privée"
 INS_privately_owned_military_industry_desc: "Créons plusieurs sociétés-écrans dans l'industrie militaire afin de conserver le contrôle de ce secteur dans le plus grand secret jusqu'à la révolution."
 INS_privately_owned_military_industry_tt: "Ajoute §G2§! §Yusines militaires§! dans votre QG"
 INS_instigate_chaos_sulawesi: "Provoquer le chaos à Sulawesi"
 INS_instigate_chaos_sulawesi_desc: "Nous allons coopérer avec les nationalistes de Sulawesi pour organiser des grèves et des révoltes, radicalisant peu à peu la population."
 INS_instigate_chaos_sulawesi_tt: "Une fois l'indépendance déclarée, §Y[673.GetName]§! et §Y[1056.GetName]§! deviendront des §GÉtats nationaux§!. Ils resteront tels quels pour les Indes néerlandaises."
 INS_instigate_chaos_medan: "Provoquer le chaos à Medan"
 INS_instigate_chaos_medan_desc: "Nous allons coopérer avec les nationalistes de Medan et Riouw pour organiser des grèves et des révoltes, radicalisant peu à peu la population."
 INS_instigate_chaos_medan_tt: "Une fois l'indépendance déclarée, §Y[1049.GetName]§! deviendra un §GÉtat national§!. Il restera tel quel pour les Indes néerlandaises."
 INS_embezzlement_scheme_in_batavia: "Détournement de fonds à Batavia"
 INS_embezzlement_scheme_in_batavia_desc: "Une fois l'indépendance déclarée, nous ferons en sorte de délocaliser la production de Batavia en territoire républicain."
 INS_embezzlement_scheme_in_batavia_tt: "Une fois l'indépendance déclarée, la moitié des usines de §Y[1058.GetName]§! seront délocalisées vers notre §Yquartier général révolutionnaire§!."
 INS_volksraad_rumors: "Rumeurs au Volksraad"
 INS_volksraad_rumors_desc: "Nous allons subrepticement faire allusion à la révolution au sein du Volksraad. Si nous nous montrons habiles, nous pourrions convaincre les membres indonésiens de se joindre à la cause."
 INS_volksraad_rumors_tt: "Tous les membres §Yindonésiens§! du Volksraad seront §Gconservés§! une fois l'indépendance déclarée."
 INS_railway_youth_force: "Coopérer avec l'AMKA"
 INS_railway_youth_force_desc: "L'Angkatan Muda Kereta Api, ou AMKA, le groupe des jeunes défenseurs des chemins de fer, pourraient s'avérer être un allié de choix en plein cœur de Java, mais ses partisans ont le sang chaud et cherchent à se battre. Si le cessez-le-feu perdure, ils risquent de se retourner contre le gouvernement."
 INS_sleeper_informant_network: "[GetInformantNetworkName]"
 INS_Sleeper_Informant_Network_name: "Réseau d'informateurs dormant"
 INS_KNIL_Informant_Network_name: "Réseau d'informateurs de la KNIL"
 INS_sleeper_informant_network_desc: "Nous allons créer un réseau d'informateurs au sein de l'administration de la KNIL afin de connaître au plus tôt les plans de l'ennemi."
 INS_sleeper_informant_network_tt: "§RLorsque l'indépendance est déclarée :§!\n"
 # <Sukarno Shared Branch - Peoples Security Army>
 INS_the_peoples_security_army: "La TKR"
 INS_the_peoples_security_army_desc: "Nos membres s'impatientent : ces jeunes Indonésiens veulent partir au combat pour l'indépendance. Levons une force armée révolutionnaire et formons dès maintenant nos futurs soldats."
 INS_commander_sudirman: "L'armée de Sudirman"
 INS_commander_sudirman_desc: "Malgré son jeune âge, Sudirman a fait preuve d'un grand potentiel et demeure une figure influente auprès des plus jeunes recrues. Qu'il mène la TKR et notre mouvement à la victoire."
 INS_commander_oerip: "L'armée d'Oerip"
 INS_commander_oerip_desc: "Après ses dizaines d'années à servir l'armée, Oerip a été le premier Indonésien à être promu major au sein de la KNIL. Son expérience et son savoir sont sans égal. Qu'il mène la TKR et notre mouvement à la victoire."
 INS_sudirmans_promotion: "Promotion de Sudirman"
 INS_sudirmans_promotion_desc: "Sudirman s'est avéré être un excellent meneur de nations doublé d'un chef stratégique vaillant. Rendons à César ce qui est à César et offrons à notre commandant le titre bien mérité de général."
 INS_tkr_steal_general: "Débaucher des généraux de la KNIL"
 INS_tkr_steal_general_desc: "Si nous parvenons à convaincre des membres haut placés de l'armée des Indes néerlandaises à rejoindre notre cause, nous ferons d'une pierre deux coups : renforcer notre armée tout en torpillant la leur."
 INS_tkr_supply: "Former tous les révolutionnaires"
 INS_tkr_supply_desc: "Nous allons fournir à tous nos membres une formation militaire basique afin qu'ils puissent prendre les armes le moment venu."
 INS_tkr_professional_army: "Une armée professionnelle"
 INS_tkr_professional_army_desc: "Il serait sot de compter uniquement sur les milices : établissons notre propre armée républicaine afin de préserver l'ordre."
 INS_arm_the_revolutionaries: "Armer les révolutionnaires"
 INS_arm_the_revolutionaries_desc: "Commençons par équiper les révolutionnaires et les nationalistes, les plus déterminés à en découdre pour l'indépendance de l'Indonésie. Chacun d'entre eux suivra également une formation pour apprendre à défendre efficacement le pays."
 INS_arm_the_youth: "Armer la jeunesse"
 INS_arm_the_youth_desc: "Après les révolutionnaires, il faut armer la jeunesse. Cette nouvelle génération portera le succès de la révolution grâce à son énergie et son idéalisme débordants. Formons un maximum de jeunes Indonésiens au combat. Lorsque le combat viendra frapper à leurs portes, ils seront prêts."
 INS_arm_the_students: "Armer les étudiants"
 INS_arm_the_students_desc: "La révolution repose sur les mouvements étudiants depuis le début. Tâchons de perpétuer cette vérité."
 INS_guerilla_industry: "Industrie de guérilla"
 INS_guerilla_industry_desc: "Envoyons nos guérilléros capturer les usines à travers l'archipel afin de produire de l'armement pour nos milices."
 INS_indonesian_assault_doctrine: "La doctrine d'assaut indonésienne"
 INS_indonesian_assault_doctrine_desc: "Les soldats ne sont pas l'unique facteur à prendre en compte pour une guerre. À quoi bon mobiliser un million d'hommes s'ils n'ont pas d'armes pour se battre ? Tâchons de nous procurer de l'artillerie de qualité pour avancer en territoire ennemi."
 INS_tighter_tkr_integration: "Intégration avancée TKR-Laskar"
 INS_tighter_tkr_integration_desc: "Les diverses milices du pays ne coopèrent pas avec la TKR, limitant la coordination des opérations. Cette situation risque de provoquer davantage de problèmes au fil du conflit. Il faut trouver un moyen d'unifier l'armée et les milices sous une seule et même organisation, quitte à subir les protestations des chefs de milice."
 INS_quality_over_quantity: "La qualité avant la quantité"
 INS_quality_over_quantity_desc: "Un soldat bien entraîné avec une stratégie solide et un équipement moderne peut éliminer à lui seul cinq troufions à pistolet. Privilégions la formation avancée de nos hommes et le matériel de qualité plutôt que de mobiliser un maximum d'individus."
 INS_add_militia_cap_1_tt: "La limite de divisions de §Ycombattants de la liberté§! augmente de §Y1§!.\n"
 INS_add_militia_cap_2_tt: "La limite de divisions de §Ycombattants de la liberté§! augmente de §Y2§!.\n"
 INS_add_militia_cap_3_tt: "La limite de divisions de §Ycombattants de la liberté§! augmente de §Y3§!.\n"
 INS_add_3_militia_unit_tt: "Crée trois unités de §Ycombattants de la liberté§!, à déployer lors de §Yraids§! pour augmenter la §Gprésence de la milice§! dans les États néerlandais."
 INS_add_fully_trained_militia_unit_tt: "Crée une unité de §Ycombattants de la liberté§! entraînée.\n"
 # <Sukarno Shared Branch - Expand Resistance Membership>
 INS_expand_resistance_membership: "Développer la résistance"
 INS_expand_resistance_membership_desc: "Concentrer tout notre mouvement auprès d'une base unique ne nous mènera pas à la victoire. Déployons des milices dans diverses régions afin d'y accroître notre popularité et notre autorité."
 # <Central Independence Branch - Militias>
 INS_deploy_the_kris: "Le service indonésien de Sulawesi"
 INS_deploy_the_kris_desc: "Le service indonésien de Sulawesi, ou le KRIS, est un groupement de la majorité des milices de Sulawesi et Manado. Recrutons-le afin qu'il se batte aux côtés de la TKR."
 INS_assist_the_pemuda: "Soutenir le Pancasila"
 INS_assist_the_pemuda_desc: "Java compte de nombreuses milices d'étudiants, appelées les Jeunes Pancasila. Unir nos forces avec elle nous offrirait un allié de choix contre les Néerlandais."
 INS_mobilize_the_pemuda: "Mobiliser le Pancasila"
 INS_mobilize_the_pemuda_desc: "Les Jeunes Pancasila font désormais partie de notre camp. Il est temps de les mobiliser afin de les intégrer à la TKR."
 INS_organize_jakarta_pemuda: "Organiser les Jeunes Pancasila de Jakarta"
 INS_organize_jakarta_pemuda_desc: "Java compte de nombreux groupes de Jeunes Pancasila. La majorité d'entre eux ont rejoint nos rangs, néanmoins des dizaines de groupes minoritaires de Jakarta restent indépendants. Tentons d'établir une collaboration entre nous."
 INS_recognize_moestopos_batallion: "Reconnaître le bataillon de Moestopo"
 INS_recognize_moestopos_batallion_desc: "Un révolutionnaire du nom de Moestopo, à la tête des milices de Surabaya, s'est autoproclamé le « Ministre de la Défense en chef ». Ses exploits méritent d'être applaudis : octroyons-lui une promotion de major général au sein de la TKR."
 INS_darul_islam_focus: "Darul Islam"
 INS_darul_islam_focus_desc: "Le parti de Kartosoewirjo s'est montré redoutable dans les collines du Java occidental. Nous aurions tort de ne pas prendre ces combattants sous notre aile. Incluons des hommes ordinaires au sein de l'armée de métier et rendons les lauriers à ceux qui les méritent ; les fidèles ont leur place dans la république."
 # <Central Independence Branch - Navy>
 INS_just_a_fisherman: "La pêche à la liberté"
 INS_just_a_fisherman_desc: "Sans marine digne de ce nom, mener une guerre dans un archipel est loin d'être aisé. Tentons le tout pour le tout avec une stratégie singulière : envoyons des milices sur des bateaux de pêche afin d'approcher furtivement les ports sous contrôle néerlandais."
 INS_a_cheap_navy: "Une marine de fortune"
 INS_a_cheap_navy_desc: "Nous n'avons ni le temps ni l'argent de former une marine moderne. Nous allons devoir faire avec ce que nous avons pour créer un semblant de flotte."
 INS_divert_army_funds_to_navy: "Rediriger les fonds militaires vers la marine"
 INS_divert_army_funds_to_navy_desc: "L'Indonésie étant un archipel, notre infanterie doit impérativement posséder des navires pour circuler efficacement. Nous allons devoir sacrifier le budget de la TKR pour financer notre nouvelle marine."
 INS_indonesian_naval_doctrine: "Doctrine navale indonésienne"
 INS_indonesian_naval_doctrine_desc: "Avec la formation de notre marine, nous devons également prendre en compte la doctrine à adopter. Essayons de l'établir le plus tôt possible afin de garantir son efficacité."
 INS_domestic_shipbuilding: "Chantiers navals domestiques"
 INS_domestic_shipbuilding_desc: "Les navires achetés à l'étranger ou capturés ne devraient pas constituer la majorité de notre flotte. Délaissons les cuirassés néerlandais et commençons à assembler nos propres navires."
 INS_acquire_modern_blueprints: "Acquérir des plans modernes"
 INS_acquire_modern_blueprints_desc: "Nous allons nous procurer des plans auprès de nations étrangères et d'entreprises privées pour bâtir notre marine."
 INS_reclaiming_the_dutch_navy: "Reprendre la marine royale néerlandaise"
 INS_reclaiming_the_dutch_navy_desc: "Les Néerlandais ont abandonné de nombreux navires dans les ports que nous avons conquis. Récupérons tous les bâtiments tant que personne ne vient les réclamer."
 INS_admiral_mas_pardi: "Amiral Mas Pardi"
 INS_admiral_mas_pardi_desc: "Une marine compétente se doit d'avoir un amiral compétent à sa tête : Mas Pardi est le candidat idéal."
 INS_akademi_angkatan_laut: "Fonder l'Akademi Angkatan Laut"
 INS_akademi_angkatan_laut_desc: "Nous allons fonder l'académie navale d'Indonésie : elle abritera nos recherches navales et formera les recrues à l'ingénierie et l'amirauté."
 # <Central Independence Branch - Militia Logistics>
 INS_pki_militia_tt: "Tan Malaka possède une milice très puissante, mais en plus de se battre pour l'indépendance de l'Indonésie, il se bat également pour l'avènement du §Rcommunisme§!. §RCe n'est qu'une question de temps avant qu'il s'oppose à toutes les autres formes de gouvernement§!."
 INS_increase_laskar_funding_tt: "§WOctroie §!1§Y usine militaire§! pour toute exigence accordée à une milice (§G6§! maximum)"
 INS_subsidize_laskar_armament: "Financer l'armement des Laskar"
 INS_subsidize_laskar_armament_desc: "Les milices armées de lances en bambou ne feront pas long feu devant des unités modernes. Augmentons la production d'armement et de munitions pour les équiper."
 INS_loot_knil_weapons_caches: "Piller les caches d'armes de la KNIL"
 INS_loot_knil_weapons_caches_desc: "Avant la révolution, la KNIL a installé de nombreuses caches d'armement. Maintenant que d'anciens membres de l'armée royale nous ont rejoints, nous pourrions peut-être en retrouver une partie."
 INS_utilize_tan_malakas_militia: "Se servir de la milice de Tan Malaka"
 INS_utilize_tan_malakas_militia_desc: "La milice rouge de Tan Malaka est de loin l'une des plus puissantes de toute l'Indonésie. La rattacher à la TKR nous offrirait un avantage considérable, mais ce ne sera pas sans risques : octroyer autant d'influence à un groupe aussi important pourrait leur faciliter la tâche s'ils décident un jour de prendre le pouvoir."
 INS_increase_laskar_funding: "Augmenter le financement des Laskar"
 INS_increase_laskar_funding_desc: "Les milices représentent la majorité de nos forces. C'est un fait que nous devons prendre en compte, même si leur loyauté envers [INS.GetLeader] n'est pas certaine."
 INS_develop_a_functioning_airforce: "Développer l'armée de l'air"
 INS_develop_a_functioning_airforce_desc: "La force aérienne est un corps indispensable à toute armée. Il est temps de créer la nôtre."
 # <Vice Presidential Edict - Intro>
 INS_political_stabilization: "Restaurer l'ordre"
 INS_political_stabilization_desc: "L'instabilité ébrèche notre nation de jour en jour. Si nous restons les bras croisés, une guerre civile éclatera à coup sûr. Ouvrons les discussions entre le comité national, le président et les chefs de milice pour tenter de trouver une solution."
 INS_vice_presidential_edict: "Signer le décret vice-présidentiel n° X"
 INS_vice_presidential_edict_desc: "Le comité national a demandé à l'unanimité l'obtention d'un pouvoir législatif. Il a été soumis au président une motion proposant un régime hybride dans lequel le comité national deviendrait un Parlement indépendant, partageant les pouvoirs législatifs avec le président. La proposition est intéressante, mais elle pourrait retirer au président tous ses pouvoirs."
 INS_local_cooperatives: "Fonder des coopératives locales"
 INS_local_cooperatives_desc: "Détournons-nous du modèle capitaliste occidental sans fermer la porte à un système de privatisation, très avantageux économiquement. Mettons en place la création de coopératives locales qui octroieront des bénéfices à leurs propriétaires. Elles devront néanmoins rendre des comptes au gouvernement et n'auront pas le droit de se développer au-delà de leur région."
 INS_local_unity: "Autonomie princière partielle"
 INS_local_unity_desc: "Accordons une autonomie partielle aux États princiers afin d'apaiser les tensions internes."
 INS_education_subsidies: "Bourses d'études"
 INS_education_subsidies_desc: "Investir dans l'avenir de la nation, c'est-à-dire la jeunesse, est indispensable à notre santé économique. Bâtissons des écoles publiques dans toute la république."
 INS_land_reform: "Réforme foncière"
 INS_land_reform_desc: "Avant l'indépendance, les Pays-Bas possédaient de vastes propriétés terrestres en nombre. Redistribuons ces terrains aux Indonésiens à bon prix afin qu'ils relancent l'économie."
 INS_dominion_of_atjeh: "Le Dominion d'Atjeh"
 INS_dominion_of_atjeh_desc: "Le mouvement séparatiste d'Atjeh ne cesse de grandir. Inutile d'aggraver la situation pour le moment, il serait plus judicieux de négocier un compromis en leur cédant une partie de l'Indonésie où ils pourraient conserver leur autonomie."
 # <Vice Presidential Edict - Presidential Balance>
 INS_dissolve_national_party: "Dissoudre le parti national"
 INS_dissolve_national_party_desc: "Le régime hybride a été mis au point pour éviter la déchéance du pays, mais il est temps de retirer tout ce pouvoir au président, au nom de la démocratie. Le Parlement doit prononcer sa destitution avant qu'il n'aille trop loin."
 INS_womens_sufferage: "Droit de vote des femmes"
 INS_womens_sufferage_desc: "Promulguer le droit de vote des femmes risque de provoquer une instabilité à court terme, mais c'est pour mieux servir la démocratie sur le long terme."
 INS_women_in_military: "Les femmes dans l'armée"
 INS_women_in_military_desc: "Autoriser les femmes dans l'armée est le meilleur moyen de venir grossir nos rangs."
 INS_fair_election: "Des élections justes"
 INS_fair_election_desc: "Maintenant que le président a été destitué et que la révolution est achevée, nous allons enfin pouvoir tenir notre première élection libre de toute influence autoritariste."
 # < Hybrid Politics >
 INS_continue_hybrid_politics: "Poursuivre le régime hybride"
 INS_continue_hybrid_politics_desc: "Ce système est un mal pour un bien. L'Indonésie est une nation naissante dont le peuple n'est pas encore prêt à détenir le pouvoir démocratique. Le président et le Parlement vont donc poursuivre cette modération réciproque pour s'assurer qu'aucun des deux corps n'accumule trop de pouvoirs."
 INS_guided_economy: "Économie guidée"
 INS_guided_economy_desc: "Nous allons superviser l'économie de l'Indonésie afin d'en préserver le contrôle. Nationalisons les banques, l'industrie agricole ainsi que le secteur du pétrole."
 INS_reform_education_system: "Éducation idéologique obligatoire"
 INS_reform_education_system_desc: "Si la révolution a bien prouvé une chose, c'est que la jeunesse est toujours prête à mener le mouvement. Pour la sécurité du gouvernement et de toute la nation, nous allons imposer un cursus inculquant l'idéologie de l'administration."
 INS_reform_education_system_2: "Réforme du système éducatif"
 INS_reform_education_system_2_desc: "Pour garantir la prospérité de l'Indonésie dans un avenir proche, tous les citoyens devront avoir accès à l'éducation."
 INS_three_year_plan: "Plan triennal"
 INS_three_year_plan_desc: "Établissons un plan triennal pour construire des infrastructures sur tout l'archipel et ainsi relier les îles."
 INS_destroy_pacific_colonialism: "Éradiquer le colonialisme du Pacifique"
 INS_destroy_pacific_colonialism_desc: "Nous avons achevé notre révolution, mais la lutte, elle, continue. D'innombrables peuples vivent toujours sous la tyrannie coloniale. Nous n'allons quand même pas rester les bras croisés ! Il faut agir et les libérer de leurs carcans !"
 INS_rapid_mobilization: "Mobilisation rapide"
 INS_rapid_mobilization_desc: "Toutes les puissances mondiales détiennent une armée imposante. Si nous tenons à devenir la superpuissance de notre région, il faut renforcer notre armée dès maintenant."
 INS_greater_indonesia: "Proclamer la Grande Indonésie"
 INS_greater_indonesia_desc: "L'empire antique de Nusantara avait réussi à unir toute la Malaisie sous une seule et même bannière. Comme nous avons libéré cette nation du joug colonial, nous devrions prendre exemple sur nos ancêtres et reformer une seule nation unie."
 # < State Religion >
 INS_secularism: "Laïcité"
 INS_secularism_desc: "L'Indonésie accueille de nombreuses religions, mais la spiritualité ne fait jamais bon ménage avec la politique. Interdisons les partis politiques religieux."
 INS_integrate_sarekat_islam: "Intégrer le Sarekat Islam"
 INS_integrate_sarekat_islam_desc: "Les partis politiques islamiques sont très populaires. Nous ferions mieux de les intégrer au sein du gouvernement."
 # <Vice Presidential Edict - Sjahrir>
 INS_sjahrirs_continued_tenure: "Sjahrir renouvelle son mandat"
 INS_sjahrirs_continued_tenure_desc: "Le Premier ministre Sjahrir a prouvé qu'il était capable de guider le peuple durant la révolution, mais aussi après, en redressant l'économie et en instaurant une démocratie pérenne. Il devrait renouveler son mandat."
 INS_unity_in_diversity: "L'unité dans la diversité"
 INS_unity_in_diversity_desc: "Durant des siècles, l'unité dans la diversité a défini l'état d'esprit de notre archipel. Durant la révolution, cette idée est devenue notre cri de ralliement, rappelant à tous les Indonésiens que, malgré nos différences linguistiques et culturelles, nous sommes un seul et même peuple. Inscrivons cette devise dans notre constitution afin de préserver notre unité."
 INS_the_timor_issue: "[INS_timor_issue_scripted_name]"
 INS_timor_issue_scripted_name_issue: "La question du Timor"
 INS_timor_issue_scripted_name_attack: "Attaquer le Timor oriental"
 INS_the_timor_issue_desc: "[INS_timor_issue_scripted_desc]"
 INS_timor_issue_scripted_desc_issue: "Le Timor oriental est un territoire indonésien, c'est certain. Pourtant, malgré la révolution, il est toujours détenu par des forces coloniales. Adressons un ultimatum aux [721.OWNER.GetHabitants] : qu'ils nous cèdent le Timor oriental, ou bien ils connaîtront notre fureur."
 INS_timor_issue_scripted_desc_attack: "Le Timor oriental est un territoire indonésien, c'est indéniable. Même si quelques rebelles proclament une prétendue indépendance, ce n'est pas l'avis de la population générale. Intégrons les vestiges du colonialisme portugais au sein de la république."
 INS_pledge_to_allies: "S'engager auprès des Alliés"
 INS_pledge_to_allies_desc: "Le conflit mondial nous place sous la menace grandissante d'une invasion. Nous n'avons pas toujours été d'accord avec les Alliés, mais en tant que nation démocratique du Pacifique, nous pourrions peut-être tenter de nous ranger dans leur camp."
 INS_mixed_economy_system: "Économie mixte"
 INS_mixed_economy_system_desc: "L'Indonésie est un pays singulier qui ne peut prospérer ni sous l'égide du capitalisme ni du communisme. Établissons une économie mixte, empruntant à la fois au capitalisme et au communisme."
 INS_social_democracy: "Social-démocratie"
 INS_social_democracy_desc: "L'économie [INS.GetAdjFS] s'est largement développée depuis l'implémentation des mesures économiques de Sjahrir. Déclarons dès que possible l'Indonésie comme un État social-démocratique, et établissons davantage de mesures basées sur cet idéal."
 # <Vice Presidential Edict - Sjarifuddin>
 INS_prime_minister_sjarifuddin: "M. le Premier ministre Sjarifuddin"
 INS_prime_minister_sjarifuddin_desc: "Sjarifuddin est le candidat rêvé pour l'Indonésie : ses mesures modérées offrent un terrain de compromis entre les communistes et les socialistes."
 INS_concessions_to_communists: "Concessions aux communistes"
 INS_concessions_to_communists_desc: "Le PKI occupe un certain nombre de sièges au Parlement. Offrons des postes ministériels aux dirigeants de ce parti pour préserver la stabilité."
 INS_sjarifuddin_focus_2: "Économie d'export autogérée"
 INS_sjarifuddin_focus_2_desc: "Maintenant que nous sommes indépendants, nous allons remanier notre système d'exportation afin d'y exclure les Néerlandais. Une économie d'export peut s'avérer dangereuse, mais nous ferons tout pour la rendre plus fiable que jamais."
 # <Vice Presidential Edict - Hatta>
 INS_prime_minister_hatta: "Le Premier ministre Hatta"
 INS_prime_minister_hatta_desc: "Mohammad Hatta, l'instigateur de la révolution, était le vice-président de Soekarno, la voie démocratique durant ce gouvernement. Il pourrait faire un excellent Premier ministre, un homme de compromis avec les nombreux partis politiques du pays."
 INS_hatta_focus_2: "La prochaine étape"
 INS_hatta_focus_2_desc: "La révolution est derrière nous, pourtant, certaines figures politiques se battent pour qu'elle persiste, à tort. Essayons plutôt de nous tourner vers l'après, la reconstruction de l'Indonésie et la prospérité pour les générations à venir."
 INS_hatta_princely_advisors: "Intégrer les États princiers"
 INS_hatta_princely_advisors_desc: "Notre nation tout entière est fondée sur l'idée de l'unité dans la diversité, néanmoins la révolution a quelque peu entaché cet idéal, car la lutte n'était pas universelle. Apaisons tout de suite la rancœur et la colère de certaines minorités en formant un conseil d'États princiers, offrant à leurs dirigeants l'occasion d'exprimer leur voix démocratiquement."
 INS_prime_minister_tt: "Les premières élections indonésiennes ont eu lieu"
 # < Guided Democracy >
 INS_guided_democracy: "Démocratie guidée"
 INS_guided_democracy_desc: "Nous aspirons toujours à la démocratie, mais le peuple n'est pas encore prêt à assumer une telle responsabilité. Nous allons nommer Soekarno comme président à vie : il supervisera le Parlement et aura l'autorité d'intervenir en cas de besoin."
 INS_enact_militarism: "Promulguer le militarisme"
 INS_enact_militarism_desc: "Inspirons-nous des [JAP.GetHabitants] et de leurs mesures militaristes. Adoptons des principes similaires pour satisfaire notre gouvernement."
 INS_sukarnos_industrialization: "Prioriser l'industrie javanaise"
 INS_sukarnos_industrialization_desc: "Les industries de Java sont le fondement de notre économie et notre armée. Préservons cet atout."
 INS_sukarnos_industrialization2: "La contribution de chacun"
 INS_sukarnos_industrialization2_desc: "L'effort de guerre est la priorité absolue de la nation, et donc la priorité absolue de tous les Indonésiens. L'opulence est notre ennemi. L'industrie militaire est notre salut."
 INS_japanese_military_lessons: "Les leçons de l'armée japonaise"
 INS_japanese_military_lessons_desc: "Étudions les doctrines militaires du Japon et calquons notre armée à leur image."
 # < Support Tan Malaka's Coup>
 INS_support_tan_malakas_coup: "Soutenir le coup d'État de Tan Malaka"
 INS_support_tan_malakas_coup_desc: "Après avoir déclaré notre indépendance, Soekarno s'est avéré être un homme de concessions et de demi-mesure. Tan Malaka et sa milice souhaitent la même chose que le peuple : une indépendance totale, sans négociation ni compromis. Si Soekarno refuse de mener la révolution jusqu'au bout, alors nous trouverons quelqu'un d'autre prêt à le faire."
 INS_minimum_program: "Le programme minimum"
 INS_minimum_program_desc: "La milice de Tan Malaka a formulé ses exigences : un gouvernement populaire, une armée populaire et la nationalisation de toutes les plantations et industries étrangères. Il va nous falloir des hommes compétents pour mener à bien ce programme. Njono représentera les prolétaires, Setyadjit les intellectuels. Ensemble, ils organiseront la révolution, des ateliers d'usine jusqu'aux chambres du gouvernement."
 INS_agrarian_reform: "Réformes agraires"
 INS_agrarian_reform_desc: "Durant près de trois siècles, les terres d'Indonésie ont été exploitées par les étrangers, tout comme les populations paysannes. Si notre révolution ne change rien à cette situation, alors elle ne vaut rien. La terre revient de droit à ceux qui la travaillent."
 INS_soviet_aid: "Aide soviétique"
 INS_soviet_aid_desc: "L'Union soviétique a eu vent de notre révolution et nous propose leur soutien. Au diable les divergences entre notre programme et celui de Moscou, leur aide est plus que bienvenue. Prenons les armes et poursuivons la lutte !"
 INS_pacific_revolution: "La révolution du Pacifique"
 INS_pacific_revolution_desc: "Les puissances coloniales ont peut-être quitté l'Indonésie, mais pas le reste de l'Asie. Leur tyrannie gouverne aujourd'hui encore des pays voisins, comme la Malaisie ou les Philippines, écrasant des populations en détresse. Notre révolution nous octroie le droit et le devoir de les libérer."
 INS_purge_oppurtunists_tt: "Permet §Y$INS_launch_revolution$§! dans des pays possédant au moins §Y60%§! de soutien au communisme. Les pays ciblés deviendront nos §Yfantoches§!."
 INS_purge_oppurtunists: "Purger les opportunistes"
 INS_purge_oppurtunists_desc: "Musso a passé près de vingt ans à Moscou pour obéir aux ordres, et le revoilà au nom des Soviétiques pour tenter de faire de notre république libre un État fantoche à la solde du Komintern. Nous n'avons pas chassé les Néerlandais pour courber l'échine devant une autre puissance mondiale. Il faut faire fuir tous ces opportunistes qui tentent de vendre notre révolution au plus offrant. Nous servons Jakarta, pas le Kremlin."
 INS_federation_of_aslia: "La fédération d'Aslia"
 INS_federation_of_aslia_desc: "Que les nations libérées se rassurent, elles ne seront pas livrées à elles-mêmes. Tan Malaka nourrit depuis longtemps une entité au-delà de la simple république : une fédération des territoires du Pacifique, unie contre la menace colonialiste. Nous invitons toutes ces nations à nous rejoindre."
 INS_aslia_tt: "Permet d'annexer les dépendances du §YPacifique§! et de faire de leurs États des États nationaux"
 INS_musso_ascends: "Musso accède au pouvoir"
 INS_musso_ascends_tt: "Permet §Y$INS_launch_revolution$§! dans des pays possédant au moins §Y30%§! de soutien au communisme. Les pays ciblés resteront indépendants."
 INS_musso_ascends_desc: "Tan Malaka est un idéaliste, Musso, lui, est un homme d'action soutenu par toute l'Union soviétique et la solidarité mondiale du mouvement communiste ! Nous ne sommes pas seuls !"
 INS_soviet_economic_integration: "Intégration économique soviétique"
 INS_soviet_economic_integration_desc: "La révolution nous a offert la liberté, mais ça ne suffit pas pour construire des usines et nourrir le peuple. L'Union soviétique propose ce qu'aucune puissance capitaliste n'acceptera de nous offrir : une expertise industrielle, des fonds de développement et des accords commerciaux avantageux. Nous aurions tort de refuser."
 # <National Revolution - Reasserting Control>
 INSHOL_revolution_ongoing_tt: "Révolution indonésienne en cours"
 INSHOL_reasserting_control: "Réaffirmer le contrôle des Indes"
 INSHOL_reasserting_control_desc: "Nous n'allons quand même pas rester les bras croisés pendant que ces agitateurs tentent de détruire la stabilité et la modernité que nous avons bâties de nos propres mains. Il faut agir !"
 INSHOL_request_british_support: "Demander le soutien des Britanniques"
 INSHOL_request_british_support_desc: "Demandons l'aide économique et militaire des [ENG.GetHabitants] : ils sont à la tête d'une puissance coloniale similaire à la nôtre, ils comprendront notre situation. De plus, si les révolutionnaires arrivent à leurs fins, ils pourraient mettre le feu aux poudres dans toute l'Asie orientale."
 INS_eng_treaty_holside_tt: "Les §Y[ENG.GetHabitants]§! vont rejoindre notre camp et nous fournir une aide capitale. En cas de victoire, ils pourront prétendre à prendre le contrôle de Bornéo."
 INS_eng_treaty_engside_tt: "Nous allons officiellement soutenir les §Y[HOL.GetHabitants]§! dans le conflit des Indes orientales. S'ils sortent vainqueurs, nous pourrons demander le contrôle de Bornéo."
 INS_fra_treaty_holside_tt: "Les §Y[FRA.GetHabitants]§! vont rejoindre notre camp et nous fournir une aide capitale. En cas de victoire, ils pourront prétendre à prendre le contrôle de Sumatra."
 INS_fra_treaty_fraside_tt: "Nous allons officiellement soutenir les §Y[HOL.GetHabitants]§! dans le conflit des Indes orientales. S'ils sortent vainqueurs, nous pourrons demander le contrôle de Sumatra."
 INSHOL_franco_dutch_accord: "Accord franco-néerlandais"
 INSHOL_franco_dutch_accord_desc: "Nos soldats ont beau être organisés en une armée moderne et bien équipée, les milices républicaines sont bien trop nombreuses. Si nous voulons atteindre la victoire, il nous faut du soutien étranger... beaucoup de soutien. Par chance, les [FRA.GetHabitants] sont prêts à nous fournir cette aide, à condition de leur céder un territoire spécifique au cœur du Pacifique."
 INSHOL_london_batavia_accord: "Accord de Londres-Batavia"
 INSHOL_london_batavia_accord_desc: "Nos soldats ont beau être organisés en une armée moderne et bien équipée, les milices républicaines sont bien trop nombreuses. Si nous voulons atteindre la victoire, il nous faut du soutien étranger... beaucoup de soutien. Par chance, les [ENG.GetHabitants] sont prêts à nous fournir cette aide, à condition de leur céder un territoire spécifique au cœur du Pacifique."
 INSHOL_australian_divisions: "Envoyer l'infanterie australienne sur Java"
 INSHOL_australian_divisions_desc: "Conformément à l'accord de Londres-Batavia, la Grande-Bretagne est tenue d'envoyer des divisions aux Indes par l'Australie, un territoire à la fois hors de la zone de conflit, mais aussi très proche, idéal pour établir une base militaire."
 INSHOL_indian_divisions: "Les divisions de l'armée indienne britannique"
 INSHOL_indian_divisions_desc: "Il y a très peu de chances que la Grande-Bretagne envoie ses hommes aux Indes. Demandons-leur plutôt d'envoyer des divisions indiennes : de la chair à canon beaucoup plus proche de Batavia."
 INSHOL_undermine_the_militias: "Affaiblir les milices"
 INSHOL_undermine_the_militias_desc: "Les médias tombent dans le mélodrame : non, les milices ne sont pas hors de contrôle, ce ne sont que des voyous qui frappent au hasard. Inutile de dépenser des sommes folles et d'envoyer nos hommes au casse-pipe, il suffit de tenir le cap et d'attendre qu'elles se fatiguent toutes seules."
 INSHOL_flag_will_fly_again: "L'étendard flottera de nouveau"
 INSHOL_flag_will_fly_again_desc: "Le drapeau néerlandais surplombe les Indes depuis des siècles, en aucun cas nous laisserons quiconque l'abaisser. Si nous devons envoyer les chars et les bombardiers pour préserver notre joyau colonial, alors nous le ferons !"
 INSHOL_flag_will_fly_again_tt: "§YÀ la fin de la révolution, l'esprit sera retiré et le changement de dirigeant annulé§!"
 # <National Revolution - Escalation>
 INSHOL_mass_mobilization: "Mobilisation de masse"
 INSHOL_mass_mobilization_desc: "Sans une armée bien équipée, nous n'avons aucune chance d'écraser la république. Envoyons de nouveau des armes aux Indes et réinvestissons le budget civil dans la KNIL."
 INSHOL_batavia_storm_operation: "Prendre Batavia d'assaut"
 INSHOL_instigate_infighting: "Semer le trouble au sein de la république"
 INSHOL_ultimatum_to_republic: "Un ultimatum à la république"
 INSHOL_comite_rijkseenheid: "Comité Rijkseenheid"
 INSHOL_comite_rijkseenheid_desc: "Les Indes sont en train d'abaisser notre drapeau sans que personne n'intervienne. C'est inacceptable ! Convainquons l'administration que les Néerlandais ne souhaitent qu'une chose : que quelqu'un mette fin à cette révolution."
 INSHOL_increase_esclation_placeholder: "Escalade rapide"
 INSHOL_increase_esclation_placeholder_desc: "Nos milices ont pris le contrôle de nos ports les plus importants, de nos villes capitales et de tous nos centres industriels. Nous ne pouvons plus attendre l'intervention des Pays-Bas ; lançons notre propre offensive militaire !"
 INS_take_batavia_explination_tt: "Si nous parvenons à occuper la totalité de Java dans les §Y730 jours§! qui viennent, nous annihilerons le gouvernement colonial et §Gremporterons la guerre§!. Sinon, nous §Rdisparaîtrons§!."
 INSHOL_linggadjati_agreement: "Négociations de cessez-le-feu"
 INSHOL_linggadjati_agreement_desc: "L'invasion de Java s'est avérée difficile, notre administration tangue... Replions-nous et adoptons une posture défensive afin de préserver la république. Négocions des cessez-le-feu dans diverses régions avec les Pays-Bas afin de prendre le temps de réorganiser nos forces et de retenter notre chance sur Java."
 INSHOL_increase_esclation_placeholder_tt: "Donne accès à la §Ydécision§! permettant de négocier des cessez-le-feu locaux et d'§Yaugmenter le délai§! pour occuper Java."
 # <National Revolution - Peace Negotiation>
 INSHOL_seek_foreign_help: "Chercher du soutien à l'étranger"
 INSHOL_seek_foreign_help_desc: "Lorsqu'on est une nation naissante, sans économie établie, renverser une puissance coloniale industrialiste s'avère être une mission impossible. Contactons d'autres pays qui seraient enclins à soutenir notre cause et demandons-leur de l'aide."
 INSHOL_renville_agreement: "L'accord du Renville"
 INSHOL_renville_agreement_desc: "L'agression inouïe des Pays-Bas à notre encontre, et les violations répétées des cessez-le-feu signés entre nous, ont attiré l'attention de la scène internationale. Contactons les [USA.GetHabitants] afin qu'ils prennent notre partie : avec un allié aussi éminent dans notre camp, les Néerlandais seront obligés d'abdiquer."
 INSHOL_no_compromise: "Pas de quartiers, pas de pitié"
 INSHOL_no_compromise_desc: "La cupidité des Néerlandais va provoquer leur défaite dans cette guerre : eux qui ont investi exclusivement dans Java, délaissant les îles de l'est et le reste de l'archipel, ont ainsi créé une cible à abattre."
 INSHOL_end_to_bloodshed: "La solution à deux États"
 INSHOL_end_to_bloodshed_desc: "Ce conflit s'éternise, et aucun camp ne semble prendre l'ascendant sur l'autre. Nous sacrifions des vies, jour après jour, alors que personne ne souhaite prolonger le massacre. Il est temps de s'asseoir à la table des négociations avec les Néerlandais."
 INSHOL_reorganize_colonies: "Réorganiser la colonie"
 INS_we_will_need_another_tt: "Nous devons contrôler un État supplémentaire en plus de la totalité des États de Java."
 # Industry Branch - New
 INS_centralize_the_state: "Centraliser l'État"
 INS_centralize_the_state_desc: "De Sumatra à Sulawesi et de Bornéo à Bangka, nos programmes de développement ont permis la création de routes, d'usines et d'institutions sur des territoires qui semblaient presque étrangers à [1058.GetName]. Ces régions ne sont plus de vulgaires provinces éloignées, elles font partie [INS.GetDuDelaDelNP] [INS.GetName]."
 INS_centralize_the_state_1_tt: "États §Ynationaux§! nécessaires :"
 INS_centralize_the_state_2_tt: "États §Ynon nationaux§! nécessaires :"
 INS_fate_of_de_javasche_bank: "[INS_fate_of_de_javasche_bank_scripted_name]"
 INS_fate_of_de_javasche_bank_scripted_name_colony: "Le sort de la De Javasche Bank"
 INS_fate_of_de_javasche_bank_scripted_name_independent: "Le sort de la Banque d'Indonésie"
 INS_fate_of_de_javasche_bank_desc: "[INS_fate_of_de_javasche_bank_scripted_desc]"
 INS_fate_of_de_javasche_bank_scripted_desc_colony: "La De Javasche Bank demeure impuissante face à la chute libre du florin des Indes depuis le début de la Grande Dépression. Il faut trouver un moyen de stabiliser notre devise avant que les derniers investisseurs décident de fuir."
 INS_fate_of_de_javasche_bank_scripted_desc_independent: "Nous avons hérité d'une monnaie au plus bas : le florin colonial n'a jamais été très puissant, mais la transition vers la roupie n'a pas aidé à redresser la barre. La Banque d'Indonésie attend que le gouvernement lui dicte la marche à suivre, faute de quoi notre économie risque de ne pas faire long feu..."
 INS_finish_the_bauxite_project: "Achever le projet Bangka"
 INS_finish_the_bauxite_project_desc: "Grâce aux nouvelles routes, aux ports et aux chemins de fer qui gracient Bangka Belitung, des prospecteurs ont localisé des veines de tungstène et de chrome en très grande quantité, bien au-delà de nos estimations initiales. Ces îles n'ont pas fini de montrer toute leur valeur à la république."
 INS_australian_contracts: "Contrats australiens"
 INS_australian_contracts_desc: "Nos réserves de caoutchouc dépassent largement nos besoins domestiques. L'Australie est une nation à la recherche de matières premières pour alimenter son industrie gigantesque, c'est donc le partenaire commercial tout trouvé. Signons des contrats à long terme avec les entreprises australiennes pour nous assurer une rentrée d'argent continue et une place privilégiée dans l'économie régionale."
 INS_coopereate_with_chinese_businessmen: "Coopérer avec les entrepreneurs chinois"
 INS_coopereate_with_chinese_businessmen_desc: "Le commerce au sein de l'archipel ne date pas d'hier : marchands et colporteurs ont toujours été légion, formant une classe à part entière au sein de la société. Gageons de coopérer avec eux pour profiter de leurs réseaux ainsi que leur expertise dans le métier : notre économie en a grandement besoin."
 INS_oil_decisions_unlock_tt: "Donne accès aux nouvelles décisions §Y$INS_realign_supply_chains_cat$§! permettant de vendre du §Ypétrole§!"
 INS_negotiate_new_contracts_unlock_tt: "Donne accès aux nouvelles décisions §Y$INS_realign_supply_chains_cat$§!"
 INS_realign_supply_chains_explain_tt: "Donne accès aux décisions §Y$INS_realign_supply_chains_cat$§! permettant de vendre des ressources à des entreprises privées sous contrat de 2 ans"
 INS_negotiate_new_contracts: "Négocier de nouveaux contrats"
 INS_negotiate_new_contracts_desc: "Notre réputation grandissante de fournisseur fiable nous a ouvert des portes : les acheteurs se bousculent ! Faisons-leur signer des accords à long terme dès que possible, avant qu'un concurrent ne nous coupe l'herbe sous le pied."
 INS_all_in_on_rubber: "Tout miser sur le caoutchouc"
 INS_all_in_on_rubber_desc: "Le caoutchouc est notre atout majeur, et nous comptons bien tout miser sur lui : nous allons convertir le moindre mètre carré de terre arable à la culture de cette matière première, puis restructurer notre industrie d'export pour faciliter sa circulation et ainsi surpasser tous les autres producteurs de la région."
 INS_more_market_resources: "Vaincre la Grande Dépression"
 INS_more_market_resources_desc: "Pendant que le monde est empêtré dans une crise économique sans précédent, certains saisissent l'opportunité qui passe à bras le corps. Nous allons inonder les marchés internationaux de nos produits à bas prix afin que les entrepôts de tous les continents puissent proposer la qualité indonésienne lorsque les populations retrouveront du pouvoir d'achat."
 # <Industry Branch - Trade Policy>
 INS_recovering_from_the_great_depression: "Se relever après la Grande Dépression"
 INS_recovering_from_the_great_depression_desc: "La Grande Dépression a provoqué des effets dévastateurs sur [INS.GetLeLaLNP] [INS.GetName]. Le protectionnisme déployé à travers le globe a immobilisé notre économie basée sur l'export. À l'aube d'une réouverture des marchés mondiaux, nous allons devoir prospecter de nouveaux marchés tout en rétablissant nos anciennes routes commerciales."
 INS_first_come_first_serve: "Premier arrivé, premier servi"
 INS_first_come_first_serve_desc: "Alors que le protectionnisme provoqué par la Grande Dépression se retire lentement, la surproduction et la dévaluation du florin auront presque eu raison de notre marché d'exportation, puisque nos partenaires commerciaux occidentaux se tournent désormais vers l'Amérique du Sud pour se fournir en matières premières. Tournons, nous aussi, le dos sur nos accords commerciaux et tentons d'investir les marchés naissants d'Asie."
 INS_oil_export: "Augmenter les exports de pétrole"
 INS_oil_export_desc: "Nous allons améliorer les infrastructures pétrolières de Sumatra et Kalimantan afin d'assurer des accords commerciaux avec nos nouveaux partenaires."
 INS_increased_trade_with_japan: "Intensifier les échanges avec le Japon"
 INS_increased_trade_with_japan_desc: "Les [JAP.GetHabitants] sont, somme toute, des partenaires commerciaux fiables. Négocions de nouveaux accords afin d'approfondir la coopération économique entre nos nations et nous sortir conjointement de la Grande Dépression. Cette décision pourrait froisser nos alliés occidentaux, notamment les Pays-Bas, mais nous décidons pour nous-mêmes désormais, et nous sommes les mieux placés pour savoir quel accord commercial est le plus bénéfique."
 INS_asian_trade_investments: "Investissements dans le commerce d'Asie"
 INS_asian_trade_investments_desc: "Les ravages de la Grande Dépression ont mis en évidence notre dépendance extrême sur nos partenaires commerciaux occidentaux. Comme nous vivons sur une économie d'export, il est primordial de prospecter de nouveaux marchés ici, en Asie du Sud-Est, afin de diversifier nos revenus et éviter de tout miser sur une seule nation."
 INS_asian_trade_investments_tt: "Tous les §Y420§! jours, la pénalité de la §YGrande Dépression§! sur les ressources pour l'export sera §Gréduite§! de §Y5%§!, jusqu'à épuisement du modificateur négatif."
 INS_declare_free_trade: "Décréter le libre-échange"
 INS_declare_free_trade_desc: "Ne nous fions pas seulement à un seul pays, donnons les moyens au marché de prendre organiquement les meilleures décisions économiques pour [INS.GetLeLaLNP] [INS.GetName]."
 INS_japanese_export_contracts: "Un accord commercial en or"
 INS_japanese_export_contracts_desc: "Négocions un accord commercial majeur avec les [JAP.GetHabitants] stipulant la vente de tout notre caoutchouc de [1049.GetName] et du [672.GetName] à très bas prix. La marge plus basse sera compensée par l'immense volume vendu."
 INS_realign_supply_chains: "Réorienter les chaînes d'approvisionnement"
 INS_realign_supply_chains_desc: "Alors que le protectionnisme provoqué par la Grande Dépression se retire lentement, la surproduction et la dévaluation du florin auront presque eu raison de notre marché d'exportation, puisque nos partenaires commerciaux occidentaux se tournent désormais vers l'Amérique du Sud pour se fournir en matières premières. Trouvons les mots pour les convaincre de refaire affaire avec nous."
 INS_invite_foreign_companies: "Soutenir les prospections pétrolières américaines"
 INS_invite_foreign_companies_desc: "Depuis 1930, Standard Oil California est implantée sur notre territoire grâce à leur succursale néerlandaise, la Nederlandsche Pacific Petroleum Maatschappij. Leurs prospections à Riouw sont prometteuses : essayons de soutenir leurs opérations, car la découverte d'un bon filon nous assurerait une rentrée conséquente d'argent, en plus d'une affluence d'investisseurs étrangers à la recherche d'une autre prospection prometteuse."
 INS_expand_sea_routes: "Développer les voies maritimes"
 INS_expand_sea_routes_desc: "Notre pays regorge de ressources naturelles, mais notre industrie d'exploitation est bien trop spécialisée et pas assez développée pour extraire certains métaux, comme le chrome ou le tungstène. Le meilleur moyen d'améliorer nos capacités de production militaire serait de les importer. Développons totalement notre réseau commercial en augmentant la capacité de nos flottes marchandes."
 INS_ship_contracts: "Obtenir des contrats sur des navires"
 INS_ship_contracts_desc: "La formation d'une marine est indispensable au maintien de nos routes commerciales en cas de guerre. Usons de nos nouvelles relations commerciales pour obtenir des contrats navals."
 # <Industry Branch - Sumatra>
 INS_developing_sumatra: "Développer Sumatra"
 INS_developing_sumatra_desc: "De tout l'archipel, c'est de loin Sumatra qui renferme le plus de ressources naturelles, pourtant les infrastructures sont tellement arriérées qu'une bonne portion de la production n'atteint jamais Batavia. La majorité des routes sont en terre battue et les lignes ferroviaires sont vétustes et éparses. Notre projet pour l'île aura besoin de bien plus. Il faut faire quelque chose !"
 INS_sumatra_railway: "Les chemins de fer de Sumatra"
 INS_sumatra_railway_desc: "Dans le cadre de notre campagne de modernisation des infrastructures de Sumatra, nous allons construire une ligne de chemin de fer partant du nord d'Atjeh et s'étendant jusqu'au port méridional de Sumatra qui relie l'île à Batavia en très peu de temps. Ainsi, les ressources n'auront qu'à être acheminées à la gare la plus proche pour un aller simple jusqu'à Batavia, le tout en seulement quelques jours."
 INS_develop_borneo: "Développer Kalimantan"
 INS_develop_borneo_desc: "Kalimantan a beaucoup de potentiel, seulement l'île est très peu développée, sa population vivant dans la misère. Les marchandises transitent principalement par les cours d'eau et les rivières, très nombreuses, mais les communications sont limitées par le manque d'électrification. Érigeons des lignes électriques et des routes afin de préparer l'île à la prospection et l'extraction de ressources."
 INS_kalimantan_mic: "L'industrie militaire de Kalimantan"
 INS_kalimantan_mic_desc: "Notre campagne de développement du Kalimantan a porté ses fruits : l'électrification a permis de rapprocher du gouvernement des communautés jusqu'alors en marge de notre société. Profitons de cette main-d'œuvre nouvellement trouvée pour répondre à notre besoin de production militaire et construisons des usines dans la région ; les ouvriers sont déjà sur place !"
 INS_pontianak_to_balikpapan: "De Pontianak à Tanjung Selor"
 INS_pontianak_to_balikpapan_desc: "L'idée d'une voie ferrée sur Kalimantan n'est pas un projet récent, mais les débats persistent sur la région centrale, largement inexplorée et très accidentée. La solution la plus viable reste de construire une ligne en croissant, le long du littoral. Ça ne sera pas donné, mais nous aurons très bientôt un retour sur investissement."
 INS_develop_sulawesi: "Développer Sulawesi"
 INS_develop_sulawesi_desc: "Sulawesi trône au centre de l'archipel, c'est donc une île naturellement stratégique. Faisons-y construire des routes, installons l'électricité et tous les moyens de communication modernes pour s'en servir de quartier général militaire en cas de guerre."
 # <Industry Branch - Bangka Project>
 INS_the_bangka_project: "Le projet Bangka"
 INS_the_bangka_project_desc: "Les îles Bangka Belitung sont peut-être étriquées, mais elles jouent un rôle majeur dans l'économie indonésienne en raison de leurs gisements de bauxite. Construisons des routes, des ports et des chemins de fer pour exploiter au maximum ses minerais."
 INS_aluminium_factory: "Usine d'aluminium de Pangkalpinang"
 INS_aluminium_factory_desc: "Notre exploitation de la bauxite est florissante, mais nous n'avons pas les infrastructures domestiques pour raffiner l'aluminium, ce qui limite nos profits. Nous pourrions construire nos premières usines à Pangkalpinang, la capitale provinciale des îles Bangka Belitung, afin de limiter les intermédiaires et optimiser nos bénéfices."
 INS_bauxite_export: "Intensifier l'export de bauxite"
 INS_bauxite_export_desc: "L'achèvement du projet Bangka a permis l'extraction de quantités astronomiques de bauxite. Il sera sûrement très compliqué de tout vendre, à moins de proposer notre produit en dessous des prix du marché, défiant toute concurrence. Nos bénéfices seront réduits, certes, mais vu la quantité de minerai que nous devons écouler, nous profiterions tout de même d'une très belle rentrée d'argent."
 INS_tin_mining: "Investir dans l'extraction d'étain"
 INS_tin_mining_desc: "L'extraction d'étain sur les îles Bangka Belitung a débuté bien avant l'arrivée des Européens sur l'archipel, ce qui explique la vétusté des infrastructures pour cette industrie en particulier. Optimiser les capacités de production mettra à l'arrêt notre chaîne d'approvisionnement en plus de nous coûter cher, mais les bénéfices à long terme sont loin d'être négligeables."
 in_240_days_tt: "§YDans 240 jours :§!\n"
 INS_tin_to_usa: "Vendre de l'étain aux [USA.GetHabitants]"
 INS_tin_to_usa_desc: "Les entreprises et les institutions gouvernementales [USA.GetAdjFP] sont très friandes d'étain. Nos infrastructures désormais modernisées, nous avons l'occasion d'engranger de très gros bénéfices."
 INS_tin_to_japan: "Vendre de l'étain aux [JAP.GetHabitants]"
 INS_tin_to_japan_desc: "Les [JAP.GetHabitants] possèdent tout un cimetière de navires qu'ils considèrent obsolète, des navires qui conviendraient parfaitement à notre marine. Acquérons quelques bâtiments en échange de cargaisons d'étain."
 INS_tin_to_japan_tt: "Les [JAP.GetHabitants] vont nous envoyer §Y9§! destroyers"
 INS_new_bauxite_routes: "Les nouvelles routes de la bauxite"
 INS_new_bauxite_routes_desc: "Notre stratégie de casser les prix de la bauxite pour écouler nos stocks a très bien fonctionné, nous engrangeant de généreux bénéfices au passage. Mais pourquoi nous arrêter là ? Poursuivons notre prospection de marchés, optimisons nos chaînes d'approvisionnement et mettons tout en œuvre pour maximiser nos revenus."
 INS_bangka_bauxite_export_flag: "A adopté la priorité §Y$INS_bauxite_export$§! :"
 INS_not_industry: "Préparer l'avenir"
 INS_not_industry_desc: "Java représente le cœur de notre nation, abritant la majorité de la population ainsi que le siège du gouvernement. Avant de lancer les grands projets d'industrialisation, nous devons d'abord préparer le terrain. Prospectons les sols, attribuons les secteurs et dégageons les lieux encombrés pour optimiser au maximum la disposition de nos usines."
 INS_construction_focus: "Boom industriel"
 INS_construction_focus_desc: "Le capital étranger afflue généreusement, les revenus à l'export grimpent en flèche, mais surtout, pour la première fois depuis des années, nous avons des fonds réels à investir dans l'industrie domestique. Profitons-en et construisons ce que nous avions en tête."
 # <Industry Branch - Java>
 INS_developing_java: "Agrandir les infrastructures javanaises"
 INS_developing_java_desc: "Java est sans conteste l'île la plus moderne de tout l'archipel et la source principale du produit intérieur brut. Néanmoins, certaines villes majeures, à l'instar de Batavia, connaissent un pic de croissance démographique qu'elles ne parviennent pas à satisfaire. Construisons de nouveaux logements, des zones commerciales, des usines, et toutes les commodités pour répondre à cette augmentation."
 INS_prioritize_sugar_economy: "Privilégier le marché du sucre"
 INS_prioritize_sugar_economy_desc: "Il est temps de limiter le budget alloué au développement industriel de Batavia qui est de loin la ville la plus industrialisée de tout l'archipel. Réinvestissons plutôt les fonds dans la création de petites plantations de palmiers à travers tout le pays, afin de produire du sucre de palme, une commodité très demandée dans le monde entier."
 INS_all_cards_into_industry: "Tout miser sur l'industrie"
 INS_all_cards_into_industry_desc: "L'industrialisation a provoqué des répercussions formidables sur l'économie de [1058.GetName]. Si nous élargissons ce procédé à l'échelle de l'île entière, avec ses dizaines de millions de citoyens, nous pourrions nous offrir une nouvelle place de choix sur la scène internationale."
 INS_expand_batavia_technical_institute: "Développer l'institut technologique de Batavia"
 INS_expand_batavia_technical_institute_desc: "L'institut technologique de Batavia gagnerait à être agrandi, afin d'accueillir plus d'étudiants, former plus de scientifiques et donc accélérer notre développement technologique."
 INS_quinine_export: "Accord supérieur sur la quinine"
 INS_quinine_export_desc: "Le Kinabureau d'Amsterdam est pratiquement à la tête d'un monopole sur la quinine, un marché très juteux, puisque ce produit est l'unique traitement contre la malaria. Il se fournit principalement dans les Indes orientales, pourtant, nous ne percevons qu'une maigre part des bénéfices. Frappons du poing sur la table : nous produisons la matière première, alors nous méritons un accord plus équitable."
 INS_spend_profits_on_rural: "Investir dans le développement rural"
 INS_spend_profits_on_rural_desc: "Notre nouvel accord sur la quinine nous offre de nouvelles possibilités d'investissements. Nous souhaitons depuis quelque temps développer les infrastructures des zones rurales afin d'étendre encore plus notre industrie sur le territoire."
 INS_spend_profits_on_urban: "Investir dans le développement urbain"
 INS_spend_profits_on_urban_desc: "Notre nouvel accord sur la quinine nous offre de nouvelles possibilités d'investissements. Nous souhaitons depuis quelque temps développer l'industrie de fabrication à Batavia afin de diversifier notre économie et limiter notre dépendance à l'export."
 INS_spend_profits_on_military: "Investir dans le développement militaire"
 INS_spend_profits_on_military_desc: "Notre nouvel accord sur la quinine nous offre de nouvelles possibilités d'investissements. Nous souhaitons depuis quelque temps bâtir et rénover les usines d'armement de Yogyakarta et Semarang afin de renforcer nos capacités militaires."
 INS_end_to_bloodshed_tt: "La guerre prendra fin, de nouvelles frontières seront tracées selon les occupations actuelles. Java, Sumatra et Bornéo seront §Yannexées§! par le camp y possédant le plus de contrôle."
 HOL_british_light_support: "[ENG.GetLeLaLNPCap] [ENG.GetName] accepte de contribuer à la révolution"
