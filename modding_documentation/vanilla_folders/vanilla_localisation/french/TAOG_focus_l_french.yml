 idea_SIA_land_war_in_asia: "Guerre terrestre d'Asie"
 # Alternative Communist Focus
 SIA_the_peoples_war_in_asia: "La guerre populaire d'Asie"
 SIA_the_peoples_war_in_asia_desc: "La lutte contre l'impérialisme [JAP.GetAdjMS] n'est pas un vulgaire concours entre États : c'est une guerre commune où les prolétaires, les paysans et les soldats se battent côte à côte pour éradiquer la domination étrangère. Main dans la main avec les forces communistes de Chine, les [ROOT.GetHabitants] prennent part à une guerre inédite, la guerre populaire d'Asie."
 SIA_peoples_war_in_asia_idea: "Guerre populaire d'Asie"
 SIA_peoples_war_in_asia_idea_desc: "Parfois, l'armée de métier ne suffit pas à remporter une guerre : des comités locaux, des guides de partisans et des colonnes de ravitaillement paysan prennent désormais part à la guerre de terrain. Chaque village devient ainsi un dépôt, chaque route une embuscade et chaque retraite une occasion de réprimer toujours plus l'ennemi."
 # Alternative Nationalist Focus
 SIA_national_defense_in_asia: "Défense nationale d'Asie"
 SIA_national_defense_in_asia_desc: "La défense de l'Asie nécessite une discipline et une hiérarchie exemplaire, ainsi qu'un but stratégique commun. En nous associant au gouvernement nationaliste de Chine, nous rejoignons une coalition décidée à stopper l'expansion [JAP.GetAdjFS] grâce à des armées de métier et un commandement coordonné."
 SIA_national_defense_in_asia_tt: "[ROOT.GetLeLaLNPCap] §Y[ROOT.GetFlag] [ROOT.GetName]§! s'align[ROOT.GetEEntNP] avec les forces nationalistes du Front uni.\nAjoute §Y$SIA_national_defense_in_asia_idea$§!, ce qui octroie :\n $MODIFIER_ARMY_ORG_FACTOR$ : §G+5%§!\n $MODIFIER_PLANNING_SPEED$ : §G+10%§!\n $MODIFIER_MAX_PLANNING$ : §G+10%§!\n $MODIFIERS_ARMY_DEFENCE_FACTOR$ : §G+5%§!"
 SIA_stronger_together: "Plus forts ensemble"
 SIA_stronger_together_desc: "La guerre a réduit les vagues promesses et les alliances parallèles à de vulgaires obstacles. Si nous tenons à prendre les rênes de l'Asie, nous devons convaincre nos partenaires de rejoindre notre faction et de déléguer toute autorité à la nôtre."
 idea_SIA_national_defense_in_asia: "Défense nationale d'Asie"
 SIA_directorate_of_aeronautical_engineering_desc: "La protection de l'espace aérien [ROOT.GetAdjMS] ne peut pas être assurée uniquement par nos pilotes : il nous faut des ingénieurs, des inspecteurs, des ateliers, le tout chapeauté par un commandement centralisé capable de transformer nos acquisitions étrangères en appareils opérationnels. C'est pourquoi nous allons fonder le directoire d'ingénierie aéronautique."
 idea_SIA_aeronautical_engineering_directorate: "Directoire d'ingénierie aéronautique"
 SIA_standardize_aircraft_maintenance: "Maintenance aérienne standardisée"
 SIA_standardize_aircraft_maintenance_desc: "Nos avions proviennent d'un peu partout, tout comme leurs pièces, leurs outils et leurs méthodes d'entretien. Si nous rassemblons les procédures de maintenance sous le directoire, nous optimiserions toute la chaîne aéronautique, décuplant ainsi nos effectifs et réduisant les erreurs à l'atelier."
 SIA_expand_aircraft_workshops: "Développer les ateliers d'aviation"
 SIA_expand_aircraft_workshops_desc: "Le directorat ne peut se contenter de bureaux et de paperasse. Ouvrons des ateliers, installons des machines et formons des mécaniciens pour réparer nos avions chez nous et produire les pièces d'usure sans dépendre des livraisons étrangères."
 SIA_license_modern_airframes: "Obtenir une licence pour les cellules modernes"
 SIA_license_modern_airframes_desc: "Notre nation n'est pas encore capable de développer ses propres avions. Nous pouvons en revanche demander une licence pour des modèles étrangers afin que le directoire puisse les adapter à notre environnement."
 SIA_tropical_air_operations: "Opérations aériennes tropicales"
 SIA_tropical_air_operations_desc: "La chaleur, l'humidité, les moussons et le terrain sont des paramètres à prendre en compte pour nos avions et leurs pilotes. Le directoire compte adapter les moteurs, le programme de maintenance et la formation des aviateurs à ces conditions particulières afin de rendre notre armée de l'air bien plus fiable dans les cieux d'Asie du Sud-Est."
 ##########
 #### AUSTRALIA ####
 ###################
 effects_of_event_tt: "\n§YConséquences de l'événement§! :"
 AST_war_is_coming: "La guerre approche"
 AST_war_is_coming_desc: "Depuis bientôt trente ans, nous enchaînons épreuve après épreuve, pourtant un défi ultime semble désormais pointer à l'horizon, un défi à quitte ou double pour la démocratie australienne. Même si personne ne veut l'entendre, Billy Hughes, ancien Premier ministre, le sait et le déclare haut et fort : la guerre approche."
 AST_war_is_coming_tt: "\nDonne accès aux §Yélections démocratiques§!"
 AST_war_is_coming_uap_advisors_tt: "(§Y$AST_billy_hughes$§!) :"
 AST_war_is_coming_alp_advisors_tt: "(§Y$AST_james_scullin$§!) :"
 AST_war_is_coming_decrease_advisors_tt: "(§Y$AST_maurice_blackburn$§!) :"
 AST_war_is_coming_advisors_tt: "\nModifier le conseiller politique ainsi :"
 AST_advance_pacific_initiatives: "Approfondir les initiatives du Pacifique"
 AST_advance_pacific_initiatives_desc: "Grâce aux pactes de non-agression que nous avons réussi à conclure, nos relations avec nos voisins asiatiques se sont améliorées. Nous continuerons de tirer profit de ces relations et ferons appel à de nouveaux alliés pour contribuer à notre développement industriel."
 AST_advance_pacific_initiatives_tt: "\nConcluez un pacte de non-agression avec :"
 AST_advance_pacific_initiatives_jap_tt: " §Y[JAP.GetLeLaLNP] [JAP.GetName]§! pour ajouter §G2§! §Ychantiers navals§! hors-carte aux effets."
 AST_advance_pacific_initiatives_ins_tt: " §Y[INS.GetLeLaLNP] [INS.GetName]§! pour ajouter §G1§! §Yraffinerie de brut synthétique§! hors-carte aux effets."
 AST_advance_pacific_initiatives_chi_tt: " §Y[CHI.GetLeLaLNP] [CHI.GetName]§! pour ajouter §G2§! §Yusines civiles§! hors-carte aux effets."
 AST_advance_pacific_initiatives_jap_2_tt: "[JAP.GetLeLaLNPCap] §Y[JAP.GetName]§! offr[JAP.GetEEntNP] :"
 AST_advance_pacific_initiatives_ins_2_tt: "[INS.GetLeLaLNPCap] §Y[INS.GetName]§! offr[INS.GetEEntNP] :"
 AST_advance_pacific_initiatives_chi_2_tt: "[CHI.GetLeLaLNPCap] §Y[CHI.GetName]§! offr[CHI.GetEEntNP] :"
 AST_advance_pacific_initiatives_2_tt: "\nLes bâtiments seront supprimés en cas de guerre avec une nation associée."
 AST_pacific_initiatives_modifier: "Initiatives diplomatiques"
 AST_domestic_industry: "Industrie domestique"
 AST_domestic_industry_desc: "Il serait irresponsable de compter sur l'industrie des Alliés en cas de guerre. Développons nos propres industries afin de nous préparer au mieux à l'inévitable."
 AST_a_democratic_bulwark: "Un rempart démocratique"
 AST_a_democratic_bulwark_desc: "Pour tenir tête au fascisme et au communisme, nous devons placer la démocratie au cœur de nos vies. Le gouvernement va adopter une politique de mesures proactives afin de représenter au mieux nos concitoyens au sein des organes gouvernementaux et permettre aux acteurs politiques d'exprimer leur désaccord au sein de partis démocratiques sans avoir besoin d'adhérer à des idéologies dangereuses."
 AST_the_pacific_pact: "Le pacte du Pacifique"
 AST_the_pacific_pact_desc: "Les initiatives du Pacifique avancées par Lyons en 1934 ont permis de nouer des liens entre l'Australie et les principales nations asiatiques, éliminant par la même occasion notre dépendance à l'administration britannique. Notre objectif principal dans nos efforts diplomatiques serait de nous assurer la non-agression des pays asiatiques envers notre nation. C'est un défi de taille, mais le jeu en vaut la chandelle."
 AST_a_collapsing_league_of_nations: "Au lendemain de la Société des Nations"
 AST_a_collapsing_league_of_nations_desc: "La Société des Nations s'effondre. C'était une initiative pleine de bonnes intentions, mais elle s'était fixé des objectifs surréalistes. Une politique moralisante devient vite des paroles en l'air, surtout lorsqu'aucune force armée n'intervient auprès des coupables. Amorçons notre réarmement."
 AST_department_of_munitions: "Département des munitions"
 AST_department_of_munitions_desc: "Si nous voulons approvisionner convenablement nos hommes postés au front, il faut décupler notre production de munitions. Établissons un département des munitions afin de superviser au mieux la fabrication de nos moyens de défense."
 AST_call_for_a_referendum: "Organiser un référendum"
 AST_call_for_a_referendum_desc: "Pour accroître le contrôle du gouvernement fédéral, il nous faut d'abord l'accord des électeurs. Il nous faut donc organiser un référendum."
 AST_rural_concessions: "Concessions rurales"
 AST_rural_concessions_desc: "Les représentants des régions rurales ne rassemblent jamais assez de voix pour espérer siéger au gouvernement, mais en laissant leur influence toucher la politique australienne, nous pourrions dénicher de nouveaux soutiens pour le gouvernement en place."
 AST_rural_concessions_tt: "\nL'§Y$AST_country_party_influence_uap$§! augmente le nombre de voix en faveur du parti au pouvoir lorsque cette priorité est achevée."
 AST_solidarity_by_the_empire: "Cohésion avec l'Empire"
 AST_solidarity_by_the_empire_desc: "L'Empire britannique a toujours été à nos côtés, dans les bons comme les mauvais moments. Gardons cet allié proche de nous pour collaborer lors des conflits futurs."
 AST_solidarity_by_the_empire_modifier: "Cohésion avec l'Empire"
 AST_wool_agreement: "Accords sur la laine"
 AST_wool_agreement_desc: "La laine étant l'un des principaux exports de l'Australie, nous devons en faire plus qu'une simple marchandise : elle doit rapprocher les nations. La Grande-Bretagne cherche à se procurer tout notre stock, car elle compte s'en servir pour concevoir les uniformes des soldats et négocier avec des puissances en déficit de laine. Nous allons accéder à sa requête."
 AST_australian_war_cabinet: "Le cabinet de guerre australien"
 AST_australian_war_cabinet_desc: "Depuis le temps que le Royaume-Uni nous le demande, nous allons former un cabinet de guerre. Ainsi, nous pourrons coordonner nos stratégies plus efficacement au nom de la sécurité nationale."
 AST_singapore_strategy: "La stratégie de Singapour"
 AST_singapore_strategy_desc: "La stratégie de Singapour est un élément central dans la politique de défense australienne. Sachant que la base maritime de la Royal Navy est localisée à Singapour, il est primordial de protéger cette ville à tout prix. Persuadons les Britanniques d'y bâtir de nouvelles défenses, tout en renforçant nous-mêmes les capacités navales australiennes."
 AST_singapore_strategy_tt: "Après §Y180§! jours (§YSingapour§!) :\n Ajoute §G2§! §Ybases aériennes§!.\n Ajoute §G2§! §Ybases navales§!.\n Ajoute §G1§! §Yfort côtier§!."
 AST_british_war_cabinet: "Cabinet de guerre britannique"
 AST_british_war_cabinet_desc: "La guerre est là. Le Royaume-Uni a formé son cabinet de guerre afin de coordonner l'effort de guerre des Alliés. Ils nous ont invités à partager notre vision de la situation. Le Premier ministre est déjà en route pour représenter au mieux les intérêts australiens."
 potential_consequence_tt: "§YConséquence potentielle§! :\n"
 AST_british_pacific_fleet: "Flotte britannique du Pacifique"
 AST_british_pacific_fleet_desc: "La présence britannique au cœur du Pacifique est indispensable comme force de dissuasion, mais aussi d'intervention contre les vaisseaux ennemis qui cherchent à étendre leur domination navale au sud. Maintenant que nous faisons partie de la faction [Root.GetFactionName], nous allons mettre en place un commandement conjoint afin de protéger nos littoraux."
 AST_all_dressed_up: "Tenue réglementaire"
 AST_all_dressed_up_desc: "Si les Australiens doivent combattre les guerres des Britanniques, alors ils seront approvisionnés par leurs usines."
 AST_overseas_loyalties: "Loyauté outremer"
 AST_overseas_loyalties_desc: "Nous poursuivrons nos contributions aux guerres d'outre-mer, prouvant une fois de plus qu'aucun territoire n'est étranger aux Australiens. Nous ne subissons pas les guerres : nous les combattons."
 AST_the_ultimate_overseas_duty: "La décision d'outre-mer"
 AST_the_ultimate_overseas_duty_desc: "Le manquement du Premier ministre britannique à ses responsabilités a été tellement scandaleux que tout son ministère a perdu confiance en lui. Menzies, quant à lui, a marqué les esprits lors de ses interventions au cabinet de guerre britannique. Certains commencent même à suggérer qu'il devrait remplacer le Premier ministre. S'il prend les rênes du Commonwealth, nous pourrions placer [AST.GetLeLaLNP] [AST.GetName] au premier plan."
 AST_the_ultimate_overseas_duty_tt: "\nSi §Y$AST_robert_menzies$§! prend la tête [ENG.GetDuDelaDelNP] §Y[ENG.GetName]§!, nous pourrions devenir un §Y$autonomy_associated_dominion$§! durant la priorité §Y$AST_a_change_of_authority$§!."
 AST_pleading_britain: "Exorer la Grande-Bretagne"
 AST_pleading_britain_desc: "La guerre est à nos portes, et elle nous emplit de crainte. Malgré l'héroïsme des troupes de l'ANZAC ou des Diggers, les capacités militaires du pays ne tiendraient pas le front bien longtemps sans l'aide des [ENG.GetHabitants]. Le Premier ministre va contacter très bientôt [ENG.GetLeader] pour organiser une rencontre."
 AST_bound_once_more: "Resserrement des liens"
 AST_bound_once_more_desc: "Nos chemins se séparent, mais bientôt, ils se retrouveront. Les [ENG.GetHabitants] et les [AST.GetHabitants] vivent un véritable bouleversement national, et la distance qui se creuse entre nous n'est, à nos yeux, qu'une illusion passagère. Nous redeviendrons alliés, et ensemble, nous surmonterons les obstacles du progrès."
 AST_eng_to_ast_faction_tt: "[ENG.GetLeLaLNP] §Y[ENG.GetName]§! et [ENG.GetSesLeursNP] dépendances vont rejoindre la faction §Y[AST.GetFactionName]§!."
 AST_faction_leader_tt: "Prend la tête de la faction §Y[AST.GetFactionName]§!"
 AST_eng_as_faction_leader_tt: "\n([ENG.GetFlag]§Y[ENG.GetName]§!) $AST_faction_leader_tt$."
 AST_australian_command: "Commandement australien"
 AST_australian_command_desc: "La défense et l'intégrité de l'Australie est une priorité, même pour les [ENG.GetHabitants]. C'est pourquoi un remaniement du commandement conjoint est prévu. En assignant davantage de troupes britanniques sous le commandement australien, nous pourrons mieux développer l'effort de guerre."
 AST_taking_the_helm: "Prendre les devants"
 AST_taking_the_helm_desc: "Notre influence s'étend toujours plus sur l'Asie du Sud-Est, et nos capacités navales doivent se développer en conséquence. Investissons durablement dans la Royal Australian Navy afin d'asseoir notre domination sur les mers orientales."
 AST_eastern_focus: "Priorité à l'Est"
 AST_eastern_focus_desc: "Si les guerres britanniques ne se déroulent jamais sans les Australiens, alors l'inverse est aussi vrai. Nous sommes sous la menace d'une invasion japonaise depuis bien trop longtemps, aussi nous n'attendrons pas les bras croisés qu'ils se décident à nous jeter la première pierre ; nous allons montrer au Japon de quel bois les Australiens se chauffent, tandis que le Royaume-Uni nous prouve sa loyauté en nous suivant jusqu'au bout d'une guerre."
 AST_eastern_focus_tt: "\nLa mission permettra [ENG.GetAuAlaAlNP] §Y[ENG.GetName]§! de déclarer immédiatement la guerre [JAP.GetAuAlaAlNP] §Y[JAP.GetName]§!, et de [ENG.GetLeLaFNP] contraindre à le faire après 180 jours. §Y[ENG.GetLeLaLNPCap] [ENG.GetName]§! peu[ENG.GetTVentNP] repousser la date d'achèvement de la mission en finançant la construction de défenses australiennes."
 AST_holding_the_battlefield: "La chair à canon"
 AST_holding_the_battlefield_desc: "Nombreux sont les Australiens tombés au combat pour une cause servant davantage le Royaume-Uni que notre propre pays. C'est pourquoi nous exigeons davantage d'influence lors des conférences de paix [ENG.GetAdjFP]. Dans le cas contraire, notre sacrifice altruiste pourrait cesser."
 AST_holding_the_battlefield_tt: "§YRéduction§! du coût des actions §Yassujettir§! et §Yprendre des État§! lors des conférences de paix avec les §Y[ENG.GetHabitants]§!."
 AST_a_change_of_authority: "Changement d'autorité"
 AST_a_change_of_authority_desc: "L'Australie, autrefois une dépendance docile, est aujourd'hui une nation fière et affirmée ; demain, elle deviendra une véritable puissance mondiale. À la tête de la faction [AST.GetFactionName], nous serons respectés de nos alliés et redoutés par nos ennemis. L'Australie saura se montrer à la hauteur."
 AST_a_change_of_authority_tt: " [ROOT.GetLeLaLNPCap] §Y[ROOT.GetName]§! peu[ROOT.GetTVentNP] désormais déclarer la guerre.\n [ROOT.GetLeLaLNPCap] §Y[ROOT.GetName]§! peu[ROOT.GetTVentNP] désormais refuser un appel aux armes.\n [ROOT.GetLeLaLNPCap] §Y[ROOT.GetName]§! ne transfèr[ROOT.GetEEntNP] plus [ROOT.GetSonLeurNP] score de paix à un pays suzerain."
 AST_reinforcements: "Renforts"
 AST_reinforcements_desc: "Préparons les vastes étendues du nord du pays, principalement vierges, en y bâtissant des infrastructures défensives et des bases aériennes."
 AST_weekly_stability_tt: " Stabilité hebdomadaire : §G+1%§!"
 AST_ending_overseas_conscription: "Mettre fin à la conscription d'outre-mer"
 AST_ending_overseas_conscription_desc: "Que nos soldats quittent sur-le-champ les littoraux étrangers ; leur pays a besoin d'eux."
 AST_unlocking_conscription_1903_tt: "Nécessaire pour déverrouiller la §Ylégislation sur la conscription§!."
 AST_unlocking_further_conscription_tt: "Pour §YService obligatoire§! ou §YMobilisation générale§!, nous aurons également besoin de l'une des priorités suivantes ; §Y$AST_british_pact$§! (fasciste), §Y$AST_refuse_british_wars$§! (fasciste), §Y$AST_toe_the_line$§! (fasciste), §Y$AST_from_picket_line_to_front_line$§! (communiste) ou §Y$AST_part_with_colonizer$§! (communiste)."
 AST_unlocking_conscription_tt: "Si nous possédons §Y$AST_invoke_the_1903_defence_act$§!, nous déverrouillons toutes les §Ylégislations§! restantes."
 AST_an_uncle_for_father_figure: "L'oncle Sam comme figure paternelle"
 AST_an_uncle_for_father_figure_desc: "Nous manquons d'armement moderne. Faisons appel aux [USA.GetHabitants] pour qu'ils ravitaillent nos troupes."
 AST_seven_million_britishers: "Sept millions de Britanniques"
 AST_seven_million_britishers_desc: "Même si [ENG.GetLeader] montre une certaine réticence à formuler la moindre promesse, nous avons foi en son engagement envers notre pays lorsque la situation sera critique. Après tout, nous ne sommes que sept millions de Britanniques."
 AST_seven_million_britishers_reinforcements_tt: "\n§YSi la priorité $AST_reinforcements$ n'est pas achevée§! :"
 AST_seven_million_britishers_conscription_tt: "\n§YSi la priorité $AST_ending_overseas_conscription$ n'est pas achevée§! :"
 AST_seven_million_britishers_uncle_tt: "\n§YSi la priorité $AST_an_uncle_for_father_figure$ n'est pas achevée§! :"
 AST_we_endured: "La résilience d'un peuple"
 AST_we_endured_desc: "L'optique d'un conflit imminent nous a tous bouleversés de prime abord, mais nous avons su concrétiser cette urgence en développant nos moyens de défense. Nous avons fait preuve de résilience, et nous en ferons encore preuve jusqu'à notre but ultime : remporter la guerre."
 AST_under_the_rule_of_canberra: "Sous la gouverne de Canberra"
 AST_under_the_rule_of_canberra_desc: "Les tensions croissantes entre les nations du Pacifique sont inquiétantes. De plus, le Royaume-Uni est empêtré dans ses batailles, ce qui entrave toute assistance de leur part. Nous pourrions tenter de reproduire le Commonwealth britannique au sein de l'océan Indien et Pacifique, avec Canberra à sa tête pour unifier tous les pays de la région, et tout ça, sans l'aide des [ENG.GetHabitants]."
 AST_its_fight_work_or_perish: "Combattre, travailler ou périr"
 AST_its_fight_work_or_perish_desc: "La guerre est là. Il ne reste plus qu'une chose à faire : la remporter !"
 AST_no_foreign_battlefields: "Pas de guerre à l'étranger"
 AST_no_foreign_battlefields_desc: "Il a fallu attendre un certain temps mais enfin, le gouvernement refusera désormais de contraindre le moindre citoyen à servir une guerre se déroulant en dehors des frontières."
 AST_no_foreign_battlefields_modifier: "Pas de guerre à l'étranger"
 AST_platypus_modifier: "Ornithorynque offert"
 AST_aerial_defense: "Défense aérienne"
 AST_aerial_defense_desc: "Certes, nous n'avons pas les moyens de former une flotte de navires aussi vaste que les grandes puissances mondiales. En revanche, nous pouvons tout à fait créer une flotte aérienne aussi conséquente que celle de nos ennemis potentiels."
 AST_ratify_westminster_adoption_act: "Ratifier la loi d'adoption de Westminster"
 AST_ratify_westminster_adoption_act_desc: "Malgré la controverse qu'un changement de politique de longue date pourrait causer, nous avons attendu assez longtemps pour ratifier la loi d'adoption du statut de Westminster. Il est temps de choisir nos propres batailles."
 AST_ratify_westminster_adoption_act_tt: "£GFX_trigger_no Peut décliner un appel aux armes"
 AST_administer_the_mandate: "Diriger le mandat"
 AST_administer_the_mandate_desc: "Nous avons administré la Nouvelle-Guinée par mandat de la Société des Nations depuis 1920. Quant à la Papouasie, elle demeure un territoire externe [AST.GetDuDelaDelNP] [AST.GetName] depuis la création de la fédération. C'est pourquoi l'est de la Papouasie-Nouvelle-Guinée à nos États nationaux est une addition toute trouvée. La Société des Nations n'étant plus là, c'est l'occasion rêvée pour fonder notre nouvelle organisation fédérale."
 AST_a_rational_request: "Une requête raisonnable"
 AST_a_rational_request_desc: "La stratégie de Singapour est fiable en théorie... en théorie seulement. Plusieurs voix, notamment celle de Henry Wynter, avaient raison : en cas de guerre dans le Pacifique, le Royaume-Uni sera occupé très rapidement, et donc attendre son aide n'a aucun sens. Alors, nous avons décidé de demander le contrôle de Singapour afin de défendre nous-mêmes nos océans."
 add_trait_to_theorist_tt: "Ajouter le trait à §YThéoricien§! :"
 AST_volunteers: "Volontaires"
 AST_volunteers_desc: "Avoir le choix, voilà tout ce qui compte. Le choix de refuser un appel aux armes ne signifie pas que nous les refuserons tous. Les Australiens décideront eux-mêmes des causes qui mériteront de se battre, que ce soit sur leur territoire ou à l'étranger."
 AST_until_the_tide_of_battle_swings: "Contre vents et marées"
 AST_until_the_tide_of_battle_swings_desc: "Nous allons faire très bientôt une déclaration publique soulignant clairement que nous ne fermerons plus les yeux sur les menaces qui rôdent à nos portes. Nous refusons de voir la situation dans le Pacifique passer au second plan d'un conflit mondialisé ; l'Australie se prépare à l'invasion sur-le-champ."
 AST_walls_and_whispers: "Des murs et des murmures"
 AST_walls_and_whispers_desc: "Des murs impénétrables et une oreille attentive sont essentiels pour garantir la sécurité de la nation. Nous allons agir pour améliorer et renforcer les défenses terrestres et côtières sur l'ensemble de nos terres, et pour y établir le siège des services de renseignement."
 AST_united_states_as_our_keystone: "La clé de voûte américaine"
 AST_united_states_as_our_keystone_desc: "Nous avons conscience des difficultés que traverse le Royaume-Uni. Diviser ses forces peut coûter très cher, mais sans l'Australie, les Britanniques survivraient. Nous refusons d'attendre notre sort les bras croisés, aussi nous allons mettre au point un plan de sauvegarde, en collaboration avec les États-Unis."
 AST_liberty_loans: "Obligations pour la liberté"
 AST_liberty_loans_desc: "Ben Chifley, l'un des trésoriers les plus doués de toute la nation, a prouvé à maintes reprises qu'il sait gérer une économie en temps de guerre. Ses dernières recommandations visent à persuader les citoyens à investir leur épargne dans des obligations de guerre."
 AST_inevitably_independent: "Une indépendance inéluctable"
 AST_inevitably_independent_desc: "Même si le United Australia Party porte la citoyenneté britannique en haute estime, l'indifférence [ENG.GetAdjFS] à l'égard des intérêts australiens a facilité notre décision de déclarer l'indépendance du pays afin de gérer au mieux nos défenses. Maintenant que le service outremer pour les guerres britanniques n'est plus une contrainte, même les anti-loyalistes acceptent de rentrer dans le rang. Une conscription plus importante signifie aussi une résistance moindre."
 AST_bring_on_the_giant: "L'appel du géant"
 AST_bring_on_the_giant_desc: "Aujourd'hui, nous formons une nation unie et autonome. Notre pugnacité sera bientôt mise à l'épreuve, tandis que de l'autre côté du Pacifique, les idéaux semblent converger vers les nôtres. Nous pourrions profiter de l'industrie militaire de pointe [USA.GetAdjFS] s'ils acceptaient de fournir le matériel nécessaire à nos troupes."
 AST_bring_on_the_giant_tt: "  Si les §Y[USA.GetHabitants]§! acceptent :\n §Y+50§! unités de §Yconvoi§! ajoutées à la réserve nationale."
 AST_allied_after_all: "Alliés malgré tout"
 AST_allied_after_all_desc: "L'indépendance de l'Australie était un besoin vital pour notre peuple, mais la collaboration avec notre ancien suzerain ne s'arrêtera pas pour autant. Nous restons loyaux envers les [ENG.GetHabitants], comme nous l'avons toujours fait, mais désormais, nous sommes sur un pied d'égalité au sein de la faction."
 AST_the_pacific_resistance: "La résistance du Pacifique"
 AST_the_pacific_resistance_desc: "L'indépendance australienne est enfin une réalité. Dans ce même élan, nous prenons du recul vis-à-vis de l'effort de guerre britannique. En nous rapprochant plutôt des [USA.GetHabitants], nous pourrons mettre en place des stratégies conjointes qui placent notre pays au centre des priorités tout en conservant un contrôle total sur notre industrie de la défense."
 AST_the_pacific_resistance_tt1: "L'§YAustralie§! rejoint la faction §Y[USA.GetFactionName]§!."
 AST_the_pacific_resistance_tt2: "Les §Y[USA.GetHabitants]§! rejoignent la faction §YRésistance pacifique§!."
 AST_conscription_at_last: "Une conscription nécessaire"
 AST_conscription_at_last_desc: "L'indépendance est un statut grisant, car nous sommes seuls maîtres de nos défenses. Malheureusement, avec la guerre qui approche, c'est à nous qu'il revient de prendre les décisions difficiles, mais nous n'avons pas le choix : imposons la conscription obligatoire."
 AST_equal_training: "Formation égalitaire"
 AST_equal_training_desc: "La coopération avec les Alliés ne s'apprend pas en un jour ; c'est une logistique périlleuse et exigeante. L'Australie se propose pour organiser des camps de formation conjointe pour les membres de la faction [ROOT.GetFactionName], afin que chaque soldat bénéficie d'une instruction rigoureuse et standardisée."
 AST_a_northern_barrier: "Le rempart septentrional"
 AST_a_northern_barrier_desc: "L'ennemi viendra par le nord, là où se trouvent plusieurs petites nations qui ne pourront rien face à sa puissance, et il pourra les anéantir à sa guise avant de venir nous frapper. Mais si nous unissons nos forces avec les [INS.GetHabitants], nous pourrions former un rempart capable de le stopper net."
 AST_demand_resources: "Exiger des ressources"
 AST_demand_resources_desc: "Ces maudits expansionnistes se jettent sur l'Indochine non seulement pour se déchirer ses terres, mais aussi ses ressources. S'ils parviennent à mettre la main dessus, la guerre ne fera que perdurer. En revanche, si nous nous en emparons, nous pourrions y mettre un terme au plus vite. Demandons le contrôle total de ces richesses, et si leurs propriétaires refusent d'obtempérer, c'est qu'ils ne valent pas mieux que l'ennemi."
 AST_demand_resources_tt: "Donne accès aux décisions §Y$AST_resource_acquisition_cat$§! permettant de demander un pourcentage des ressources aux nations d'Asie du Sud-Est."
 AST_reclaim_the_lost_territory: "Reconquérir le territoire perdu"
 AST_reclaim_the_lost_territory_desc: "Lors de la formation de la fédération d'Australie, la Nouvelle-Zélande a décidé de ne pas y participer. Pourtant, la Constitution a toujours désigné ce territoire comme un État potentiel du Commonwealth australien, validant de facto son éventuelle admission. Essayons de rappeler à nos voisins cette aubaine, étant donné la situation mondiale précaire."
 AST_reclaim_the_lost_territory_tt: "([NZL.GetFlag]§Y[NZL.GetName]§!) Transfère toutes les forces aériennes, navales et terrestres [AST.GetAuAlaAlNP] §Y[AST.GetName]§!"
 AST_australia_first: "Australia First"
 AST_australia_first_desc: "Le Centre Party n'aura pas su porter son idéologie d'extrême droite bien loin, puisqu'il a été dissout en 1935. En revanche, un nouveau courant semble émerger, se basant notamment sur les idées de l'entrepreneur et activiste William John Miles. Cependant, si aucune action n'est entreprise pour perpétuer cette tendance, elle risque de péricliter aussi vite qu'elle a surgi. Nous devons agir sans attendre."
 AST_pankhurst_walsh: "Adela Pankhurst Walsh"
 AST_pankhurst_walsh_desc: "Lors de la création officielle du mouvement Australia First, nous nommerons Adela Pankhurst Walsh au poste de présidente du parti. La fondatrice de la guilde féministe d'Australie prône l'importance des liens avec la Grande-Bretagne et la valeur inestimable de la citoyenneté britannique. Ces valeurs s'inscrivent d'ailleurs dans nos principes fondateurs."
 AST_stephensen: "P.R. Stephensen"
 AST_stephensen_desc: "Lors de la création officielle du mouvement Australia First, nous nommerons P.R. Stephensen au poste de président du parti. Conseiller proche de William John Miles, Stephensen partage les principes isolationnistes et nationalistes de son mentor. C'est d'ailleurs sur ceux-ci que notre mouvement compte s'inspirer pour rédiger sa constitution : l'indépendance de la Grande-Bretagne et l'unification de la culture australienne."
 AST_stephensen_tt: "\nLe choix du président pour le §Ymouvement Australia First§! octroiera des actions différentes."
 AST_a_growing_womens_guild: "La ligue des femmes"
 AST_a_growing_womens_guild_desc: "Depuis sa création en 1928, la guilde féministe d'Australie préconise la coopération industrielle pour contrer les difficultés économiques nationales. Pour le bien de la nation, les citoyens doivent soutenir leur gouvernement, et non œuvrer à son encontre. Avec Pankhurst Walsh à la tête d'Australia First, nous pourrons utiliser ce mouvement politique pour diffuser le message à plus large échelle."
 AST_realize_the_value_of_british_citizenship: "La valeur de la citoyenneté britannique"
 AST_realize_the_value_of_british_citizenship_desc: "Depuis longtemps, la suzeraineté [ENG.GetAdjFS] [AST.GetAuEnANP] [AST.GetName] offre à notre nation à la fois un bouclier protecteur et une lumière pour nous guider. Nous avons vu le jour par la Grande-Bretagne et nous lui resterons dévoués. Du moins, tant que nous y trouvons notre compte."
 AST_the_bolsheviks_counterforce: "La contrattaque bolchévique"
 AST_the_bolsheviks_counterforce_desc: "Depuis des décennies, le service de renseignements mène des enquêtes sur les activités des groupes subversifs. Son travail visant à éliminer les menaces gauchistes nous est extrêmement précieux, et ce n'est pas parce que les adversaires d'Australia First veulent s'opposer à notre expansion qu'il faut le négliger. Nous allons faire notre possible pour nous frayer une place parmi les renseignements australiens afin de nous assurer que la véritable menace envers la sécurité nationale continue de passer en priorité."
 AST_public_meetings_tt: "Donne accès aux décisions §YMouvement Australia First§! permettant de mobiliser les membres et accroître le soutien au fascisme."
 AST_rile_up_veterans: "Rallier les vétérans"
 AST_rile_up_veterans_desc: "Au début de la Grande Dépression, les vétérans de la Grande Guerre ont joint en masse les groupes paramilitaires d'extrême droite afin de contrer le communisme. Ces groupes n'existent plus aujourd'hui, mais leurs membres, eux, sont toujours parmi nous. Australia First se fera un plaisir de les assimiler, de façon à perpétuer le flambeau de l'anti-communisme."
 AST_eureka_stockade_monument_rally: "Meeting au monument de la bataille d'Eureka"
 AST_eureka_stockade_monument_rally_desc: "En 1854, durant la bataille d'Eureka, les chercheurs d'or australiens se sont vaillamment opposés aux forces coloniales à cause du prix des permis d'exploitation et du montant des impôts. Le mécontentement à l'égard de la suzeraineté britannique était manifeste à l'époque, et il l'est tout autant aujourd'hui. Nous nous rassemblerons donc au pied de ce monument pour plaider la sécession avec la Grande-Bretagne."
 AST_australian_pivot_modifier: "Basculement australien"
 AST_well-being_of_the_community: "Pour le bien de la communauté"
 AST_well-being_of_the_community_desc: "La population australienne devrait tenir en haute estime les idéaux chrétiens familiaux. Toutefois, étant donné les faibles taux de natalité relevés au cours des dernières années, ces valeurs ne semblent pas suffisamment respectées. Pour le bien de la communauté, nous devons lancer une campagne promouvant les familles nombreuses."
 AST_covert_networks: "Réseaux clandestins"
 AST_covert_networks_desc: "Grâce au rôle joué par Australia First au sein du service de renseignements, nous allons tout faire pour établir une coopération avec les mouvements [ENG.GetAdjMP] qui partagent nos idées. Notre alliance avec notre suzerain pourrait nous être une nouvelle fois utile en nous permettant de nouer une alliance idéologique et d'étendre du même coup nos capacités d'espionnage."
 AST_refuse_british_wars: "Refuser les batailles britanniques"
 AST_refuse_british_wars_desc: "La campagne de Gallipoli de la Grande Guerre a prouvé que les [ENG.GetHabitants] traitent nos forces expéditionnaires comme de la vulgaire chair à canon. L'idée d'une nouvelle campagne effraie notre nation tout entière. Les Australiens refusent de sacrifier leurs vies pour l'intérêt britannique, contraignant ainsi le commandement à agir. C'est pourquoi le Statut de Westminster a été proposé."
 AST_walls_like_uluru: "Des remparts Uluruesques"
 AST_walls_like_uluru_desc: "L'Australie est un pays-continent, et, pour protéger un pays aussi vaste sans l'aide de l'Empire britannique, nous devons ériger nos défenses. Renforçons nos littoraux et fortifions nos ports pour dissuader l'ennemi de venir nous envahir."
 AST_at_the_gates: "À nos portes"
 AST_at_the_gates_desc: "Le monde se précipite vers une guerre ; l'Australie doit se tenir prête. Accélérons la cadence dans nos usines et nos chantiers navals. Il ne s'agit plus de préparer la défense d'un allié ou d'un suzerain, mais de préserver notre survie."
 AST_the_guild_for_the_war_effort: "La guilde de l'effort de guerre"
 AST_the_guild_for_the_war_effort_desc: "La guilde féministe d'Australie a été fondée dans l'unique but de servir la couronne, mais nous réorientons aujourd'hui tous ses efforts et son grand réseau au service de l'effort de guerre, des hôpitaux et des chaînes d'approvisionnement du pays."
 AST_for_the_southern_cross: "Pour la Croix du Sud"
 AST_for_the_southern_cross_desc: "La Croix du Sud ne survole pas la Grande-Bretagne : elle survole notre territoire. L'identité australienne est véridique, authentique et valeureuse. Nous construisons une fierté nationale à notre image, loin des vulgaires calques de Londres ou des institutions étrangères. Notre fierté a grandi ici, sur ce sol, sous ces étoiles."
 AST_through_the_gates: "Les portes franchies"
 AST_through_the_gates_desc: "Les préparatifs à la guerre s'accélèrent. Le programme de défense nationale est alimenté par toute l'industrie du pays. Des sites sortent de terre à un rythme effréné, notre production s'envole et la production civile cède progressivement sa place à la nécessité militaire."
 AST_toe_the_line: "Rentrer dans le rang"
 AST_toe_the_line_desc: "Le confort qu'ont connu les Australiens durant nos années de prospérité est amené à disparaître. Place au rationnement, aux heures supplémentaires et à la conscription. C'est le seul moyen de sauvegarder notre indépendance. Ceux qui sont prêts à servir auront la nation tout entière en admiration. Les autres seront mis au banc de la société."
 AST_crush_the_gates: "Enfoncer les portes"
 AST_crush_the_gates_desc: "La transition est terminée : l'industrie australienne est totalement dédiée à l'effort de guerre, la production exclusivement au service de la défense nationale et la dissuasion. Peu importe les menaces, l'Australie saura les affronter sans vaciller."
 AST_national_defense: "Défense de la nation"
 AST_national_defense_desc: "Grâce à des investissements judicieux et un axe national, l'Australie a bâti une industrie capable d'assurer sa propre défense. Les usines et les chantiers navals sont sous la tutelle de l'État qui veille à ce qu'ils opèrent non pas pour la croissance, mais pour répondre aux besoins de la nation."
 modify_AST_national_defense_tt: "Modifie §Y$AST_national_defense$§! ainsi :"
 AST_nauru_pact: "Pacte de Nauru"
 AST_nauru_pact_desc: "Nous ne sommes même pas encore à la tête du pays, notre indépendance semble donc encore lointaine. Cependant, l'autonomie australienne n'est pas seulement dans notre intérêt. En échange de la garantie de notre souveraineté par [GER.GetLeLaLNP] [GER.GetName] en cas de résistance britannique au mouvement Australia First ou à la sécession du Commonwealth, nous leur rendrons l'une de leurs îles du Pacifique, Nauru, dès notre arrivée au pouvoir."
 AST_australian_culture_investments: "Investissements dans la culture australienne"
 AST_australian_culture_investments_desc: "Avec son essai sur la culture australienne intitulé « The Foundations of Culture in Australia », Stephensen a influencé la formation du mouvement littéraire Jindyworobak en affirmant une chose : notre culture est une priorité. Le gouvernement semble mépriser les artistes et écrivains, mais ce n'est pas notre cas. En mobilisant les soutiens du Jindyworobak et d'Australia First, nous ferons en sorte de stimuler le développement culturel."
 AST_australian_culture_investments_tt: "\nAprès §Y365§! jours :"
 AST_australia_first_party_focus: "Australia First Party"
 AST_australia_first_party_focus_desc: "Les membres du mouvement Australia First sont tellement nombreux aujourd'hui qu'il est devenu une force politique indéniable. Il est temps de présenter au pays notre parti nouvellement formé : l'Australia First Party."
 AST_australia_first_party_req_tt: "L'§YAustralia First Party§! a été créé."
 AST_in_from_the_cold: "Retour d'exil"
 AST_in_from_the_cold_desc: "Australia First et ses partisans n'ont plus besoin de se dissimuler. Les sévices infligés à notre nation durant des décennies par les gouvernements passés sont enfin exposés au grand public. De nouvelles voix émergent pour une nouvelle politique."
 AST_absorb_the_uap: "Absorber l'UAP"
 AST_absorb_the_uap_desc: "L'United Australia Party est ancré dans une idéologie libérale, néanmoins ses aspirations politiques sont de droite. Avec l'accession au pouvoir de notre nouveau parti, l'UAP va se retrouver plus ou moins contraint de soutenir la cause du gouvernement actuel. Nous allons contacter ses membres les plus éminents pour les recruter au sein de l'Australia First Party."
 AST_big_business_pact: "Pacte des grandes entreprises"
 AST_big_business_pact_desc: "Comme l'Australia First Party s'engage à protéger les industries domestiques, c'est tout naturellement que les grands directeurs d'entreprises soutiennent notre cause. Ils s'engagent par ailleurs à appuyer tous nos objectifs politiques et militaires à condition de promulguer des mesures bénéfiques à leurs résultats."
 AST_big_business_pact_tt: "\nDonne accès aux décisions §YPacte des grandes entreprises§! permettant d'affecter les objectifs industriels et de construction."
 AST_autarky: "Autarcie"
 AST_autarky_desc: "Soutenir le commerce étranger serait inconscient, surtout en temps de crise. Il faut plutôt privilégier les industries australiennes. Limitons drastiquement notre législation commerciale afin de protéger l'économie intérieure et assurer l'autonomie du pays."
 AST_energy_independence: "Indépendance énergétique"
 AST_energy_independence_desc: "Soutenir le commerce étranger serait inconscient, surtout en temps de crise. Il faut assurer notre indépendance énergétique pour préserver notre souveraineté. Investissons dans des raffineries pour promouvoir l'énergie domestique."
 remove_2_offsite_dockyard: "Retire §R2§! §Ychantiers navals§! hors-carte."
 AST_british_pact: "Pacte britannique"
 AST_british_pact_desc: "Malgré notre sécession avec le Commonwealth britannique, il est dans l'intérêt des [AST.GetHabitants] de poursuivre la coopération avec leur mère patrie. Étant donné les difficultés [ENG.GetDuDelaDelNP] [ENG.GetName] dans le monde entier, notre offre de coopération militaire devrait être très appréciée."
 AST_naurus_return_to_german_hands: "Retour de Nauru aux [GER.GetHabitants]"
 AST_naurus_return_to_german_hands_desc: "Maintenant que le parti Australia First est à la tête du pays, nous allons pouvoir tenir notre promesse concernant Nauru, et nos alliés allemands vont également honorer leur part du marché. Les [AST.GetHabitants] vont enfin être libérés des chaînes du Commonwealth et la Grande-Bretagne n'aura plus son mot à dire sur notre politique."
 AST_naurus_return_to_german_hands_tt: "Le §Ypacte de Nauru§! devient actif."
 AST_naurus_return_to_german_hands_tt_2: "Le §Ypacte de Nauru§! est actif."
 AST_the_winner_takes_it_all: "Malheur aux vaincus"
 AST_the_winner_takes_it_all_desc: "Il y a quelque temps, le sacrifice de l'île de Nauru au nom de la coopération avec l'Allemagne nous semblait raisonnable, mais ce n'est plus le cas aujourd'hui. Nous avons démontré l'étendue de nos capacités et nous comptons bien nous en servir pour étendre notre hégémonie sur les îles Salomon et la Nouvelle-Zélande, même si cela doit rendre notre trahison du pacte de Nauru encore plus cruelle. Après tout, les îles Salomon constituent elles aussi un territoire allemand qui sera perdu au bénéfice de l'Australie."
 AST_resist_western_intruders: "Résister à l'envahisseur occidental"
 AST_resist_western_intruders_desc: "Les nations occidentales ont la fâcheuse tendance à s'immiscer dans les affaires du Pacifique ; c'est intolérable ! Plutôt que d'attendre qu'elles débarquent sur nos plages, nous irons débarquer sur les leurs, prouvant une bonne fois pour toutes que notre nation ne se soumet devant personne."
 AST_invasion_preparation_tt: "Durée de préparation des invasions navales : §G-20%§!"
 AST_naval_invasion_penalty_tt: "Pénalité de débarquement : §G-20%§!"
 AST_expand_the_fort: "Agrandir le fort"
 AST_expand_the_fort_desc: "Le Pacifique Ouest n'est pas le terrain de jeu des [USA.GetHabitants]. Ces îles qu'ils ont revendiquées appartiennent aux pays d'Asie orientale. Notre nation étant la puissance majeure de la région, nous nous assurerons qu'elles nous reviennent."
 AST_integrate_the_fort: "Intégrer le fort"
 AST_integrate_the_fort_desc: "Nous avons administré la Nouvelle-Guinée par mandat de la Société des Nations depuis 1920. Quant à la Papouasie, elle demeure un territoire externe [AST.GetDuDelaDelNP] [AST.GetName] depuis la création de la fédération. C'est pourquoi l'est de la Papouasie-Nouvelle-Guinée à nos États nationaux est une addition toute trouvée. C'est la prochaine étape dans l'unification de la culture australienne."
 AST_defying_american_interference: "Opposition à l'ingérence américaine"
 AST_defying_american_interference_desc: "La menace [USA.GetAdjFS] plane au-dessus de nos têtes, s'apprêtant à intervenir à la moindre incartade de notre part. Le poids d'une telle puissance mondiale sur les épaules [PHI.GetDuDelaDelNP] [PHI.GetName] divise les nations d'Asie de l'Est et empêche la formation d'une identité régionale. Nous, les [AST.GetHabitants], refusons de laisser ce pays tomber aux mains d'étrangers."
 AST_the_pacific_garrison: "La garnison du Pacifique"
 AST_the_pacific_garrison_desc: "Bien que la protection de l'Asie du Sud-Est et du Pacifique soit dans l'intérêt des Britanniques, cette région se trouve bien loin de leurs îles. En échange de leur aide au ravitaillement, nous leur proposerons d'assurer la défense du territoire, afin de leur permettre de se consacrer à d'autres points stratégiques."
 AST_vichy_out_of_africa: "Chasser Vichy d'Afrique"
 AST_vichy_out_of_africa_desc: "Obtenir la chute ou la coopération de la France de Vichy est l'un des objectifs principaux [ENG.GetDuDelaDelNP] [ENG.GetName]. En gage de bonne volonté, [AST.GetLeLaLNPCap] [AST.GetName] v[AST.GetAOntNP] tâcher de participer en soumettant les colonies françaises en Afrique."
 AST_vichy_out_of_africa_tt1: "Ajoute des revendications sur les territoires de la §YFrance de Vichy§! en §YAfrique§! via la priorité §YChasser Vichy d'Afrique§!.\n"
 AST_vichy_out_of_africa_tt2: "Ajoute des revendications sur les territoires de la §YFrance de Vichy§! en §YAfrique§! via les décisions §YChasser Vichy d'Afrique§!.\n"
 AST_vichy_africa_claim_flag: "Les revendications [AST.GetFlag]§Y[AST.GetAdjFP]§! envers tous les territoires de la §YFrance de Vichy§! en §YAfrique§! sont ajoutées à §YLa fin des ingérences§!."
 AST_vichy_claim_tt: "Les revendications [AST.GetFlag]§Y[AST.GetAdjFP]§! sont ajoutées à §YLa fin des ingérences§!."
 vichy_in_africa_trigger: "§YFrance de Vichy§! : n'importe quel État sous contrôle :\n    est en §YAfrique§!"
 vichy_wargoal: "Alloue le but de guerre §YAnnexer§! contre la §YFrance de Vichy§!."
 AST_britain_supplying_ships: "Les navires britanniques"
 AST_britain_supplying_ships_desc: "La protection des côtes des alliés britanniques n'est pas une mince affaire et il est désormais évident que la flotte [ROOT.GetAdjFS] va devoir être étendue. Il paraîtrait bien normal que les [ENG.GetHabitants] nous fournissent des navires."
 AST_hand_in_glove: "Main dans la main"
 AST_hand_in_glove_desc: "Notre expansion vers le nord renforcera l'influence australienne sur les affaires de l'Asie du Sud-Est. Les [ENG.GetHabitants] comprendront sans peine qu'il est judicieux de nous céder le contrôle de leurs territoires dans la région, puisque nous avons déjà prouvé que nous étions capables de sauvegarder leurs intérêts en plus des nôtres."
 AST_claim_french_indochina: "Revendiquer l'Indochine française"
 AST_claim_french_indochina_desc: "Le destin de la France étant toujours indéterminé, il en va de même pour ses colonies. D'autres nations tenteront peut-être de s'emparer de l'Indochine française, mais nous ne les laisserons pas faire."
 AST_undeniably_ours: "Ce qui nous appartient"
 AST_undeniably_ours_desc: "Peu importe ce que nous offre la diplomatie, ce ne sera jamais suffisant. Dans son état de fragilité actuel, ce qui sert de frontières à la France de Vichy ne joue qu'un rôle purement théorique. Nous serions idiots de renoncer à nous emparer de l'intégralité de ses territoires. La guerre est désormais inévitable."
 AST_done_meddling: "La fin des ingérences"
 AST_done_meddling_desc: "Loyale à la mère patrie, la nation [AST.GetAdjFS] continue de se battre au nom [ENG.GetDuDelaDelNP] [ENG.GetName]. En revanche, notre peuple est serviable, mais pas servile ; si les [AST.GetHabitants] doivent se battre pour les [ENG.GetHabitants], alors les [ENG.GetHabitants] peuvent aussi se battre pour les [AST.GetHabitants]."
 AST_northern_advancement: "Progrès au nord"
 AST_northern_advancement_desc: "L'Australie ne demande qu'à ce qu'on la laisse tranquille, mais nous n'aurons jamais la paix tant que nous ne serons pas considérés comme une menace. Nous avons beaucoup en commun avec les [INS.GetHabitants] : victimes de l'ingérence européenne tenace. Revendiquons ce territoire pour envoyer un message clair au monde : laissez les nations du Pacifique tranquilles."
 AST_soothing_australian_fears: "Apaiser les craintes australiennes"
 AST_soothing_australian_fears_desc: "Certains membres du gouvernement sont persuadés qu'une coopération australo-japonaise est possible, contrairement à l'opinion publique. Après toutes ces années passées à craindre une invasion, l'idée de coopérer avec un ennemi potentiel semble difficile à accepter. Nous allons apaiser les craintes de nos concitoyens... en nous préparant à la guerre."
 AST_soothing_australian_fears_tt: "\nAprès §Y180§! jours :"
 AST_dividing_the_pacific: "Le Pacifique divisé"
 AST_dividing_the_pacific_desc: "Australia First prône des relations pacifiques avec les [JAP.GetHabitants], voyant dans cette nation un potentiel allié, et non plus une menace comme la majorité des citoyens [AST.GetAdjMP]. Nous sommes une puissance majeure en devenir, les [JAP.GetHabitants] en sont conscients ; c'est pourquoi nous devrions régler tous nos différends avant qu'ils ne se manifestent pour avancer."
 AST_dividing_the_pacific_ast_gain_tt: "[GET_AST_DIVIDING_THE_PACIFIC_AST_GAIN]"
 AST_dividing_the_pacific_jap_gain_tt: "[GET_AST_DIVIDING_THE_PACIFIC_JAP_GAIN]"
 AST_dividing_the_pacific_tt1: "§GNous obtenons§! :"
 AST_dividing_the_pacific_tt2: "§RIls obtiennent§! :"
 AST_dividing_the_pacific_tt3: "(§Y[AST.GetName]§!) transfert des territoires suivants :"
 AST_against_war_and_fascism: "Contre la guerre et le fascisme"
 AST_against_war_and_fascism_desc: "Le Movement Against War and Fascism est la branche australienne de l'effort international soutenu par le Komintern pour mobiliser les ouvriers contre les forces réactionnaires. Bien qu'il ait perdu de son influence au cours des dernières années, il nous incombe de lui redonner un nouvel élan."
 AST_world_peace: "Une paix mondiale"
 AST_world_peace_desc: "Le Movement Against War and Fascism, opposé à la guerre et au fascisme, est à pied d'œuvre pour publier son magazine « World Peace », révélant les machinations du fascisme en Allemagne, en Italie, mais aussi en Espagne durant la guerre civile. Scandalisés par le contenu de ses articles, les volontaires ont hâte de rejoindre le combat contre le fascisme."
 AST_red_fred: "« Red Fred »"
 AST_red_fred_desc: "Surnommé « Red Fred », Fred Paterson a d'abord pris de l'importance au sein du mouvement communiste en se présentant comme candidat au poste de maire de Brisbane, en 1934. Malgré sa cuisante défaite, ses ambitions sont restées intactes et il souhaite désormais devenir conseiller municipal de Townsville. Avec notre appui, il pourrait devenir le premier communiste élu comme représentant public."
 AST_workers_defence_corps_sparks_anew: "Le renouveau du Workers Defence Corps"
 AST_workers_defence_corps_sparks_anew_desc: "À l'origine, le Workers Defence Corps a été formé pour défendre les grèves et manifestations. Du fait de l'augmentation des agressions commises par des groupes comme la New Guard, il reprend du service pour protéger les ouvriers réclamant plus de droits et un accès équitable aux différentes opportunités."
 AST_a_controversial_recruitment: "Un recrutement controversé"
 AST_a_controversial_recruitment_desc: "Maurice Blackburn est un avocat socialiste bien connu pour avoir défendu les droits des travailleurs lors d'affaires judiciaires les opposant à des employeurs oppressifs. Membre du Labor Party, il a fait l'objet de suspicions en raison de ses liens avec le Movement Against War and Fascism, plus radical."
 AST_from_picket_line_to_front_line: "De la grève à la guerre"
 AST_from_picket_line_to_front_line_desc: "Alors que les tactiques d'intimidation des opposants à la libération de la classe ouvrière se font plus agressives, nos propres défenses se doivent aussi d'évoluer. À chaque incident, la détermination des travailleurs ne fait que se renforcer, et ils sont de plus en plus nombreux à rejoindre le Defence Corps."
 AST_pig_iron_protests: "Manifestations pour la fonte brute"
 AST_pig_iron_protests_desc: "Nos dockers s'opposent à la vente de fonte brute aux pays belliqueux. De manière générale, les Australiens voient d'un mauvais œil la collaboration avec des pays qui s'en prennent aux civils et refusent de leur céder le moindre équipement : et nous sommes d'accord. Grève générale !"
 AST_part_with_colonizer: "Faire sécession des colonialistes"
 AST_part_with_colonizer_desc: "Les racines de nos luttes remontent à l'Empire britannique et au système capitaliste qu'il nous a imposé à distance. Nous en avons assez. Aujourd'hui, alors que la Grande-Bretagne se consacre aux crises qui éclatent dans sa région du monde, le moment est venu pour nous de reprendre notre destin en main et de choisir notre propre voie en tant que nation libre et indépendante."
 AST_take_it_to_the_streets: "Descendre dans la rue"
 AST_take_it_to_the_streets_desc: "La grève constitue l'un des outils les plus puissants à notre disposition pour contraindre la société au changement, et nous devons y avoir recours face à un système conçu pour l'exploitation. Il est temps pour nous de reprendre les moyens de production. Travailleuses et travailleurs d'Australie, unissons-nous !"
 AST_workers_educational_association: "Workers' Educational Association"
 AST_workers_educational_association_desc: "La Workers' Educational Association est une organisation internationale fondée pour rendre l'éducation accessible aux classes ouvrières. Nous devons prendre en main notre propre récit, car la véritable égalité des chances commence à l'école."
 AST_off_leash: "En roue libre"
 AST_off_leash_desc: "Les dockers sont le pilier de l'action syndicale du pays. L'Australie est une île de la taille d'un continent, ce qui explique que le travail maritime joue un rôle aussi crucial dans notre économie. Oublions un peu le costard-cravate et laissons libre cours aux vieux loups de mer de l'industrie."
 AST_a_national_housing_commission: "Une commission nationale du logement"
 AST_a_national_housing_commission_desc: "Ce n'est pas nouveau, le logement est un sujet controversé. Tout le monde mérite d'avoir un toit au-dessus de la tête, et pourtant, trop souvent, ce besoin élémentaire est utilisé contre les travailleurs du fait de son coût prohibitif, représentant une forme d'oppression économique. Ça suffit. Nous allons exiger un logement pour chaque être humain."
 AST_guaranteed_employment: "Des emplois garantis"
 AST_guaranteed_employment_desc: "Le socialisme est trop souvent ridiculisé à coup d'accusations de paresse ou de dépendance formulées contre ceux qui sont dans le besoin. Cela doit cesser. Tout ce que nous souhaitons, c'est l'équité au travail et un salaire juste qui nous permette de faire vivre nos familles décemment."
 AST_equal_pay: "Salaires égaux"
 AST_equal_pay_desc: "Il est faux de penser que ceux qui possèdent les moyens de production sont plus méritants que ceux qui travaillent dur pour les faire fonctionner. Les propriétaires et les industriels n'ont pas un métier plus difficile et ils ne sont pas plus qualifiés par nature. L'égalisation des salaires permettra de partager les fruits du travail de façon plus équitable à travers la société."
 AST_all_for_one_one_for_all: "Un pour tous, tous pour un"
 AST_all_for_one_one_for_all_desc: "« Un pour tous et tout pour moi ! », voilà qui fut longtemps le cri de ralliement de la bourgeoisie. Leur avidité les poussant à en vouloir toujours plus et à partager toujours moins. La promesse du ruissellement des richesses est un mensonge. Elle doit être répartie équitablement, par tous et pour tous."
 AST_abolition_of_private_property: "Abolition de la propriété privée"
 AST_abolition_of_private_property_desc: "L'industrie a le sang des travailleurs sur les mains. Nous devons mettre un terme à la brutalité de l'accumulation des richesses et abolir entièrement la propriété privée. Tout devra être partagé, de chacun selon ses moyens à chacun selon ses besoins."
 AST_centralized_production: "Production centralisée"
 AST_centralized_production_desc: "Les forces du marché sont chaotiques et inégales. Si nous voulons construire une société véritablement équitable, l'État doit assumer un rôle central afin de déterminer ce qui est produit, où et par qui. Notre bureaucratie tient des registres précis et se trouve en position idéale pour fixer des quotas de production."
 AST_public_institutions: "Institutions publiques"
 AST_public_institutions_desc: "De nombreux services sont essentiels au fonctionnement de la société : de la santé au logement, en passant par la garde d'enfants et le transport. L'État doit les mettre à disposition de façon universelle, en assurant leur accès à tous, sans restrictions. Affranchis de l'impératif de générer des profits privés, ces systèmes pourront fonctionner de façon efficace en répondant aux besoins de la population tout entière."
 AST_planned_extraction: "Exploitation planifiée"
 AST_planned_extraction_desc: "Nous avons de la chance de posséder une terre aussi riche en ressources. Nous devons faire en sorte que sa richesse soit extraite de façon systématique et dirigée vers les secteurs qui en ont le plus besoin."
 AST_maritime_commission: "$USA_maritime_commission$"
 AST_maritime_commission_desc: "$USA_maritime_commission_desc$"
 AST_state_research_funding: "Financement national pour la recherche"
 AST_state_research_funding_desc: "Pour optimiser l'efficacité de nos institutions de recherche, l'État doit être la principale source de financement, orientant ses efforts selon les besoins les plus impérieux et garantissant le contrôle strict de l'information. Après tout, nous ne pouvons pas prendre le risque de laisser de fausses idées perturber nos citoyens."
 AST_graziers_to_industry: "Des paysans à l'industrie"
 AST_graziers_to_industry_desc: "Durant la Grande Dépression, les travailleurs ont déserté nos villes pour chercher la stabilité dans les campagnes. À présent que nous avons pris le contrôle des moyens de production, nous pourrons les faire revenir vers l'industrie. Il suffit de leur faire comprendre quels sont les besoins de notre nation : que la sueur de l'homme alimente les fourneaux de l'industrie."
 AST_free_school_policy: "Politique de l'école gratuite"
 AST_free_school_policy_desc: "Pour façonner le citoyen modèle, nous devons également orienter ses idées. Du berceau à l'université, l'État décidera de ce qui doit être enseigné aux enfants. De cette façon, les générations futures comprendront l'importance de l'idéologie socialiste, mais aussi les dangers du libre marché... et de la libre pensée."
 AST_free_healthcare_policy: "Politique d'accès gratuit à la santé"
 AST_free_healthcare_policy_desc: "Notre peuple mérite d'être exempt de maladies et de blessures. En cas d'accident de la vie, nul ne doit se retrouver réduit à la pauvreté, comme c'est le cas dans d'autres sociétés. Nous offrirons un accès universel à la santé, aux hôpitaux et aux médecins. En effet, un peuple en bonne santé est un peuple productif."
 AST_the_publics_australia: "L'Australie publique"
 AST_the_publics_australia_desc: "Nous avons renversé le vieux monde et bâti une nation qui bénéficie au plus grand nombre, et non à une minorité. L'industrie, le travail et les ressources sont désormais au service du peuple tout entier. Voilà à quoi ressemble l'Australie publique : un pays d'égalité, d'union, un pays indestructible."
 # 'Cominwealth' over 'Commonwealth' is intentional
 AST_the_australian_commonwealth: "Le Kominwealth australien"
 AST_the_australian_commonwealth_desc: "La Grande-Bretagne détenait le pouvoir sur l'ensemble du Commonwealth, mais sa perspective était corrompue par les intérêts capitalistes. Nous assumerons désormais ce rôle de chef de file et guiderons les nations vers une utopie socialiste partagée."
 AST_union_control_commonwealth: "Donne accès aux décisions §YContrôle des syndicats§!.\nPermet l'infiltration communiste de la Nouvelle-Zélande, la Malaisie, la Birmanie et l'Inde."
 AST_a_comrade_emancipated: "L'émancipation d'un camarade"
 AST_a_comrade_emancipated_desc: "Dans le monde, de nombreuses nations restent contraintes par les chaînes du capitalisme, leur peuple se voyant refusé la véritable liberté. En tant qu'État socialiste libre, il est de notre devoir de les aider à s'émanciper. Prolétaires de tous les pays, unissez-vous. Ensemble, nous vous débarrasserons de vos chaînes."
 AST_union_control_local: "Donne accès aux décisions §YContrôle des syndicats§!.\nPermet l'infiltration communiste de l'Indonésie et des Philippines."
 AST_comintern: "Intégrer le Komintern"
 AST_comintern_desc: "Bien qu'elle se soit parfois éloignée des véritables principes marxistes, l'Union soviétique reste le porte-drapeau de l'internationale des ouvriers. En rejoignant le Komintern, nous pourrons unir nos efforts pour porter le flambeau du socialisme dans le monde entier."
 AST_comintern_tt: "Si les §Y[AST.GetHabitants]§! dirigent une faction, elle viendra se greffer au Komintern. Sinon, les §Y[AST.GetHabitants]§! vont rejoindre le Komintern tels quels."
 AST_for_greater_good: "Pour l'intérêt général"
 AST_for_greater_good_desc: "Notre idéal de révolution mondiale nécessite du sang et des sacrifices. Dans trop de pays, la flamme du socialisme vacille. Nous devons répondre à l'appel et envoyer notre soutien pour éviter qu'elle ne s'éteigne pour de bon. Après tout, nous faisons tout cela dans l'intérêt général."
 AST_make_common_cause: "Cause commune"
 AST_make_common_cause_desc: "Sous notre commandement, le Commonwealth a commencé à prospérer, guidé par les phares du socialisme dans les ténèbres de l'oppression capitaliste. En cet instant décisif, nous devons nous assurer que rien ne s'oppose à notre volonté. Marchons ensemble vers de meilleurs lendemains."
 AST_the_red_pacific: "Le Pacifique rouge"
 AST_the_red_pacific_desc: "Le Pacifique doit refléter l'image de la révolution. À travers les îles et les côtes de notre région, nous devons soutenir l'essor des gouvernements socialistes et nous assurer que le drapeau rouge flotte sur tous les rivages."
 AST_the_irish_anti-britain_pact: "Le pacte irlandais anti-britannique"
 AST_the_irish_anti-britain_pact_desc: "Depuis trop longtemps, la Grande-Bretagne est un bastion du capitalisme, protégé par son insularité et sa puissance navale. En incitant à la révolte parmi les dockers d'Irlande et d'Irlande du Nord, nous parviendrons à percer ses défenses et à ouvrir une voie à travers la mer d'Irlande, par laquelle nos forces pourront s'insinuer."
 AST_stretch_the_fleet: "Étirer la flotte"
 AST_stretch_the_fleet_desc: "La Grande-Bretagne continue d'incarner le bastion du capitalisme, protégée par une flotte puissante. Il est temps d'accroître nos propres capacités navales pour lui déclarer la guerre et prouver au monde laquelle de nos deux îles est supérieure à l'autre."
 AST_chinese_relations: "Relations chinoises"
 AST_chinese_relations_desc: "Nos camarades chinois sont engagés dans une véritable lutte pour leur survie. Nous avons les moyens de les aider, mais nous devons agir vite avant qu'ils ne soient débordés par les forces impérialistes déployées contre eux."
 AST_westward_battles: "Les batailles occidentales"
 AST_westward_battles_desc: "Les forces fascistes dominent l'occident, menaçant jusqu'à notre survie elle-même. En coopération avec le Komintern, nous devons leur faire face et affronter ceux qui voudraient détruire l'utopie ouvrière que nous nous efforçons de construire."
 AST_strongholds: "Les bastions"
 AST_strongholds_desc: "Pour asseoir notre position dans cette nouvelle bataille, nous devons soutenir nos camarades irlandais contre le cœur impérial du capitalisme. La lutte qu'ils ont menée pour l'indépendance nous offre un exemple précieux à l'heure où nous nous préparons ensemble pour la prochaine étape du conflit mondial."
 AST_out_of_the_den: "Hors de la tanière"
 AST_out_of_the_den_desc: "Nombreux sont les Irlandais continuant de nourrir un profond ressentiment contre le règne britannique. Nous devrions faire montre de notre puissance pour les pousser à sortir de leur cachette et rejoindre notre cause contre un ennemi commun."
 AST_end_the_kingdom: "La fin du royaume"
 AST_end_the_kingdom_desc: "Le moment est venu de frapper le capitalisme impérialiste en plein cœur. La libération des ouvriers de l'Empire britannique tout entier est à notre portée. Nous allons mettre un terme à la monarchie, mettre un terme au royaume, mettre un terme à l'oppression. Ouvriers du Commonwealth, unissez-vous !"
 AST_red_solidarity: "La solidarité rouge"
 AST_red_solidarity_desc: "En Chine, la lutte continue de faire rage alors que des millions de personnes souffrent et perdent la vie. Leur cause est la nôtre et nous ne pouvons pas rester les bras croisés. Nous avons les moyens d'intervenir, d'alléger leur fardeau et de nous assurer que la flamme de la révolution continue de brûler."
 AST_red_solidarity_tt: "Les §Y[AST.GetHabitants]§! rejoignent la guerre [PRC.GetDuDelaDelNP] §Y[PRC.GetName]§! contre les §Y[CHI.GetHabitants]§!. La faction mineure absorbera l'autre, ou les §Y[AST.GetHabitants]§! rejoindront la guerre directement en cas d'alliance."
 AST_free_the_colonies: "Libérer les colonies"
 AST_free_the_colonies_desc: "L'Empire britannique est en proie aux flammes de la révolte. Les colonies deviendront des nations libres. Camarades, levez-vous ! Libérez-vous de vos chaînes et rejoignez la révolution !"
 AST_free_the_colonies_tt: "Les §Y[AST.GetHabitants]§! font de toutes les anciennes colonies britanniques sous leur autorité des États fantoches."
 AST_battle_of_the_ocean: "La bataille pour l'océan"
 AST_battle_of_the_ocean_desc: "Le commerce mondial utilise les océans comme des autoroutes. Il est temps pour nous d'engager le combat pour le Pacifique et de contrecarrer le système qu'il alimente. L'eau se teintera de rouge, mêlant à la fois le sang des capitalistes corrompus et celui des héros de la révolution."
 AST_borderless_solidarity: "Solidarité sans frontières"
 AST_borderless_solidarity_desc: "La solidarité unit les travailleurs du monde entier. Nulle frontière ne peut nous diviser, nulle nation ne peut agir seule. Partout où la lutte fait rage, nous répondrons à l'appel et nous nous dresserons côte à côte dans le combat pour la libération."
 AST_an_equal_union: "Une union égalitaire"
 AST_an_equal_union_desc: "Bien que le drapeau de la révolution soit entre nos mains, tous ceux qui nous rejoignent sont nos égaux. Dans cette union, les ressources, le travail et les idées se partagent librement afin de forger un avenir prospère pour tous, dans lequel aucune nation n'est au-dessus des autres."
 AST_expanding_influence: "Une influence croissante"
 AST_expanding_influence_desc: "À nos yeux, il est éloquent de constater que nos idées sont du bon côté de l'Histoire. La promesse d'un paradis ouvrier n'est pas un rêve, mais une réalité en cours de construction. Nous pouvons partager notre vision en invitant les autres à bâtir avec nous cet avenir commun."
 AST_public_works: "Travaux publics"
 AST_public_works_desc: "La Grande Dépression a fortement impacté l'économie australienne. Lançons un programme de travaux publics afin de créer de l'emploi et relancer la consommation."
 AST_lang_plan: "Le plan de Lang"
 AST_lang_plan_desc: "Jack Lang s'est imposé sur la scène politico-économique en affirmant refuser de rembourser nos dettes étrangères, préférant réinvestir ce capital dans des initiatives publiques favorisant la croissance intérieure. Après tout, nos créditeurs ne pourront pas y faire grand-chose."
 AST_exports_for_economic_recovery: "Reprise économique par les exports"
 AST_exports_for_economic_recovery_desc: "Les opposants aux idées de Lang proposent de se servir de notre dette étrangère et des marchés mondiaux pour encourager les investissements sur notre territoire, prônant ainsi une économie d'export afin de dynamiser la production domestique, l'emploi et la consommation."
 AST_the_phosphate_commision: "La « Phosphate commission »"
 AST_the_phosphate_commision_desc: "Au sortir de la Grande Guerre, Nauru a été placé sous la tutelle conjointe de l'Australie, la Nouvelle-Zélande et la Grande-Bretagne. En 1919, les droits de vente du phosphate issu de l'île ont été remis à ces tuteurs, avec l'Australie à sa tête. Profitons de notre position privilégiée pour influencer les prix du marché et nous assurer des taux avantageux pour notre marché intérieur."
 AST_goods_standard: "Des normes exemplaires"
 AST_goods_standard_desc: "La théorie économique de Jack Lang repose principalement sur l'abolition de l'étalon-or en Australie afin qu'il soit remplacé par « l'étalon-biens », liant directement la production monétaire à la production de biens. C'est une façon de s'assurer que le flux de capital est lié directement à la productivité intérieure plutôt qu'à des facteurs extérieurs."
 AST_standard_gauge_line_to_darwin: "Rails standardisés jusqu'à Darwin"
 AST_standard_gauge_line_to_darwin_desc: "Nos territoires du nord n'ont jamais été correctement reliés au reste de la nation. Dans le cadre de notre programme de travaux publics destiné à relancer l'économie, nous allons construire un chemin de fer desservant nos villes du sud jusqu'au nord du pays."
 AST_lang_is_right: "Le bon point de Lang"
 AST_lang_is_right_desc: "Finalement, Lang avait raison ! En mettant de côté nos créditeurs étrangers pour exploiter pleinement notre système bancaire, nous sommes parvenus à générer des fonds satisfaisants. Nous allons pouvoir les réinjecter dans l'économie intérieure afin de stimuler les investissements et la croissance."
 AST_within_reach: "À portée"
 AST_within_reach_desc: "L'Australie est une terre qui regorge de ressources. En creusant un peu plus loin, nous découvrirons des trésors incroyables. Le développement de notre infrastructure va rendre tous nos sites d'exploitation beaucoup plus accessibles, même la mine perdue au milieu du désert. Nous sommes à l'aube d'une ère prospère pour l'Australie, placée sous le signe de l'extraction minière."
 AST_a_domestic_supply_chain: "Une chaîne d'approvisionnement domestique"
 AST_a_domestic_supply_chain_desc: "Notre investissement dans l'économie intérieure a eu pour effet secondaire le développement d'un système de production particulièrement efficace. Maintenant que toutes les étapes de production se font sur notre territoire, nous sommes quasiment imperméables aux fluctuations étrangères."
 AST_broken_hill_propietary_company: "Broken Hill Proprietary Company"
 AST_broken_hill_propietary_company_desc: "La Broken Hill Proprietary Company, ou BHP, est l'une des principales sociétés d'extraction de toute l'Australie, dominant tout le paysage industriel du pays. Depuis l'explosion de la demande de matières premières, elle s'attend à une croissance encore plus fulgurante."
 AST_radium_hill: "Radium Hill"
 AST_radium_hill_desc: "Nous avons découvert de l'uranium dans le sud du pays ; la mine de Radium Hill n'attend qu'à être agrandie. Nous avons à peine exploré tout le potentiel qu'offrent ces technologies émergentes, néanmoins l'ère atomique semble sur le point de naître. Tâchons de ne pas manquer notre entrée dans cette nouvelle époque."
 AST_industrial_expansion: "Expansion industrielle"
 AST_industrial_expansion_desc: "La Grande Dépression a déstabilisé notre économie pendant près d'une décennie. Aujourd'hui, nous avons les moyens politiques d'agir. Lançons une grande campagne de développement industriel : créons des emplois, augmentons la demande en ressources et produisons plus pour notre marché."
 AST_income_tax_assessment_act: "Acte d'évaluation des taxes sur les importations"
 AST_income_tax_assessment_act_desc: "Notre système d'imposition est un véritable parcours du combattant pour le profane qui cherche à y trouver du sens, obligeant le gouvernement à passer derrière chaque contribuable. Modernisons les conditions afin d'optimiser la collecte."
 AST_council_for_scientific_and_industrial_research: "Commonwealth Scientific and Industrial Research Organisation"
 AST_council_for_scientific_and_industrial_research_desc: "À la suite de la conférence impériale de 1923, nous avions renforcé le conseil scientifique pour la recherche industrielle afin d'élargir le fondement économique des colonies et dominions. Ses avantages ont été considérables, mais il est temps de réorienter ce conseil pour le développement de la manufacture et de l'industrie secondaire."
 AST_bring_home_the_farmers: "Rapatrier les agriculteurs"
 AST_bring_home_the_farmers_desc: "La Grande Dépression a entraîné un véritable exode urbain, nos citoyens abandonnant les villes à la recherche d'un emploi dans l'agriculture. Maintenant que la situation s'améliore, nous devons encourager la population à regagner les grandes agglomérations pour relancer les usines."
 AST_reverse_wage_cuts: "Annuler les réductions salariales"
 AST_reverse_wage_cuts_desc: "Nous avions implémenté une série de réductions salariales afin de laisser nos entreprises respirer. À l'heure où l'économie semble reprendre des forces, nous devrions faire machine arrière. Augmentons les salaires pour offrir plus de pouvoir d'achat, et ainsi accroître la consommation."
 AST_the_manpower_directorate: "Le Manpower Directorate"
 AST_the_manpower_directorate_desc: "Notre économie est devenue une machine complexe : nous sommes menacés par une crise de la main-d'œuvre. Mettons en place un directorat chargé d'assigner les bonnes personnes avec les bonnes compétences aux bons postes au bon moment."
 AST_recovery: "La reconstruction"
 AST_recovery_desc: "Aujourd'hui, notre produit intérieur brut a dépassé pour la première fois le niveau qu'il atteignait avant la Grande Dépression. C'est un moment historique, promettant de belles heures à venir pour notre économie. Nous entrons dans une ère de croissance débridée. Profitons désormais de notre prospérité retrouvée."
 AST_devalued_currency: "Une devise dévaluée"
 AST_devalued_currency_desc: "Le meilleur moyen d'augmenter l'exportation est d'affaiblir notre monnaie : les devises étrangères seront logiquement plus fortes, ce qui permettra aux acheteurs d'acquérir plus de marchandises, nous rendant par la même occasion plus compétitifs. Le revers de la médaille, c'est que les importations étrangères seront plus onéreuses..."
 AST_reverse_industry_tariffs: "Faire machine arrière sur les taxes industrielles"
 AST_reverse_industry_tariffs_desc: "Autrefois, des taxes protégeaient nos industries domestiques de la concurrence étrangère. Aujourd'hui, elles ne font que perpétuer des guerres commerciales et des représailles tarifaires sur nos exportations. Levons ces barrières et encourageons plutôt une baisse des taxes pour relancer le commerce."
 AST_foreign_competition: "Concurrence étrangère"
 AST_foreign_competition_desc: "La concurrence est le moteur du commerce : elle encourage l'innovation et l'efficacité, chassant la fatuité. Le monde est impitoyable, c'est pourquoi nous devons nous montrer encore plus impitoyables que lui en ouvrant les vannes de la concurrence internationale."
 AST_expanding_into_new_markets: "Atteindre de nouveaux marchés"
 AST_expanding_into_new_markets_desc: "Il y a un avantage net à s'appuyer sur les marchés étrangers plutôt que sur le marché intérieur : ils sont beaucoup plus vastes et toujours en réinvention. Prouvons la supériorité des biens australiens et l'efficacité de nos pratiques commerciales."
 AST_populate_or_perish: "Peupler le continent"
 AST_populate_or_perish_desc: "Lorsque la Grande Dépression a frappé, le taux de natalité a amorcé un rapide déclin dont il ne s'est toujours pas remis. Pour favoriser la croissance de notre pays, nous allons créer un Département fédéral de l'immigration visant à mener et superviser un nouveau programme d'immigration."
 AST_recruitment_drive: "Campagne de recrutement"
 AST_recruitment_drive_desc: "Les gouvernements précédents, de par leur faiblesse et leur dépendance excessive à la Grande-Bretagne, ont provoqué la négligence prolongée des forces armées australiennes. Cela ne peut plus continuer. Nous allons lancer une campagne de recrutement au sein de la Force de défense australienne."
 AST_new_deal: "New Deal"
 AST_new_deal_desc: "La manifestation qui a eu lieu lors du 150e sesquicentenaire [AST.GetAdjMS] ne laisse aucun doute : le statut des citoyens indigènes doit être réévalué. À la demande des militants en faveur des droits aborigènes, nous allons organiser une rencontre visant à accorder, à terme, la pleine citoyenneté aux peuples indigènes."
 AST_the_1938_sesquicentenary_flag: "L'événement du §Ysesquicentenaire de 1938§! a joué un rôle majeur."
 AST_the_1938_sesquicentenary_tt: "La priorité §YNew Deal§! de la §Ybranche Peupler le continent§! devient disponible."
 AST_repeal_immigration_restrictions: "Annuler les restrictions militaires"
 AST_repeal_immigration_restrictions_desc: "Le Département de l'immigration se retrouve limité par des lois désuètes déterminant qui peut ou non immigrer [AST.GetAuEnANP] [AST.GetName]. Malgré le risque de controverse, nous allons abroger ces lois pour les remplacer par un système de quotas nous permettant de contrôler les flux migratoires."
 AST_womens_armed_services: "Service féminin de l'armée"
 AST_womens_armed_services_desc: "Malgré une opposition féroce, nous allons mener à bien la création d'un service féminin au sein de l'armée. Hommes ou femmes, toute aide est la bienvenue pour participer à défendre [AST.GetLeLaLNP] [AST.GetName] contre ses agresseurs. Pour encourager au recrutement, le choix des responsables de nos forces revêt la plus grande importance."
 AST_northern_territory_reconnaissance_unit: "Unité de reconnaissance du territoire du Nord"
 AST_northern_territory_reconnaissance_unit_desc: "Le lieutenant d'aviation et anthropologue Donald Thomson a plaidé en faveur de l'inclusion de la population aborigène dans les services armés [AST.GetAdjMP], et il va enfin être entendu. Nous allons demander personnellement à Thomson de rassembler des hommes possédant une connaissance minutieuse du bush pour former une unité de reconnaissance chargée de surveiller même les terres les plus isolées et inhospitalières."
 AST_northern_territory_reconnaissance_unit_tt: "Déverrouille la compagnie de soutien §YUnité de reconnaissance du territoire du Nord§!"
 AST_torres_strait_battalion: "Bataillon du détroit de Torrès"
 AST_torres_strait_battalion_desc: "La gestion des efforts de la compagnie du détroit de Torrès en garnison a été honorable, mais ses hommes ont le potentiel d'accomplir bien plus. Originaire des îles situées au nord [AST.GetDuDelaDelNP] [AST.GetName], l'unité possède une connaissance précise du détroit de Torrès. Nous allons entraîner ces hommes pour en faire des Marines et lancer un appel pour que d'autres volontaires les rejoignent et forment un bataillon avec eux."
 AST_department_of_aboriginal_affairs: "Département des Affaires aborigènes"
 AST_department_of_aboriginal_affairs_desc: "Nous allons appliquer la proposition des groupes militants en faveur des droits des Aborigènes en créant un nouveau Département des Affaires aborigènes. Un comité d'héritage aborigène y siégera et aura pour objectif de garantir l'accès de la population indigène à une alimentation et une assistance médicale correctes."
 AST_immediate_rights: "Droits immédiats"
 AST_immediate_rights_desc: "La fédération ne régulera plus aucun groupe de population [AST.GetAdjMS] et chacun recevra les mêmes droits civils, quel que soit son héritage. En rédigeant notre propre loi sur la citoyenneté, nous souhaitons tirer un trait sur l'idée que notre population se compose uniquement de sujets britanniques. Les droits australiens ne seront plus soumis à aucune condition."
 AST_diverse_army: "Une armée diversifiée"
 AST_diverse_army_desc: "Défendre son pays n'est pas seulement un privilège, c'est aussi un droit. Tout Australien volontaire doit être en mesure de s'engager, et tout soldat ambitieux doit avoir la possibilité de gravir les échelons."
