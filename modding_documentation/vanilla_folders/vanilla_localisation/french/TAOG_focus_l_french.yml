 idea_SIA_weather_broadcasts_desc: "Nos forces aériennes et navales ont besoin de bulletins météo réguliers afin de connaître au mieux les conditions dans lesquelles elles doivent opérer pour limiter au maximum les risques en cas d'intempéries."
 idea_SIA_seri_thai_contacts: "Contacts dans les Forces thaïlandaises libres"
 idea_SIA_seri_thai_contacts_desc: "Nos contacts au sein des Forces thaïlandaises libres ne nous ont pas déçus ; nous avons des combattants de chocs à nos ordres et un rapport privilégié avec les Alliés."
