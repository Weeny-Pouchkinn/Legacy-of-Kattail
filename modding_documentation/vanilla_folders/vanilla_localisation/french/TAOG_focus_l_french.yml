 AST_election_campaign_pp_cost_hidden_idea: "Campagne électorale"
 AST_uap_election_campaign_tt: "§YCampagne électorale de l'UAP§!\n§LMobilise la classe moyenne, les entrepreneurs et les loyalistes impériaux ; l'United Australia Party va lancer une campagne politique.§!\n\n§YConséquences :§!\nCoût quotidien en poids politique : §R+1§!\nAugmentation quotidienne des votes pour l'§YUAP§! : §G+0,05%§!"
 AST_alp_election_campaign_tt: "§YCampagne électorale de l'ALP§!\n§LMobilise le prolétariat, les syndicats et les réformistes nationalistes ; l'Australian Labour Party va lancer une campagne politique.§!\n\n§YConséquences :§!\nCoût quotidien en poids politique : §R+1§!\nAugmentation quotidienne des votes pour l'§YALP§! : §G+0,05%§!"
 AST_uap_win_count_trigger_tt: "L'§YUAP§! compte au moins $COUNT|Y$ victoires aux élections."
 AST_alp_win_count_trigger_tt: "L'§YALP§! compte au moins $COUNT|Y$ victoires aux élections."
 AST_natunity_desc: "§YGouvernement d'union nationale§!\n§LC'est dans les situations les plus critiques que les luttes insignifiantes provoquent des raz-de-marée. Nos voisins enchaînent les conflits. Même si les besoins domestiques restent notre priorité, il faut savoir reconnaître le moment où la menace de l'extermination devient trop grande. Les partis démocratiques [AST.GetAdjMP] doivent mettre leurs différends de côté pour s'unir face au danger.§!"
 AST_uap_becomes_ruling_party: "Nouveau parti au pouvoir : le §YUnited Australia Party§!."
 AST_alp_becomes_ruling_party: "Nouveau parti au pouvoir : l'§YAustralian Labour Party§!."
 AST_increased_focuses_become_available: "Les priorités indiquées seront §Gdisponibles§!."
 effect_tt: "\n§YConséquences :§!"
 AST_natunity_becomes_ruling_party: "\nLe [GET_AST_RULING_PARTY] va inviter le [GET_AST_NON_RULING_PARTY] à rejoindre un gouvernement d'union nationale.\n\nLe [GET_AST_NON_RULING_PARTY] obtient §Y1§! victoire électorale\n\n"
 AST_natunity_effect_update_tt: "La liste des priorités va se mettre à jour en fonction du §Yparti d'opposition§! et de ses groupes de priorités déverrouillés."
 AST_uap_popularity_increase_10: "§Y$AST_ruling_party$§! (§Y$AST_uap$§!) Voix : §G+10%§!"
 AST_alp_popularity_increase_10: "§Y$AST_ruling_party$§! (§Y$AST_alp$§!) Voix : §G+10%§!"
 AST_uap_popularity_decrease_10: "§Y$AST_ruling_party$§! (§Y$AST_uap$§!) Voix : §R-10%§!"
 AST_alp_popularity_decrease_10: "§Y$AST_ruling_party$§! (§Y$AST_alp$§!) Voix : §R-10%§!"
