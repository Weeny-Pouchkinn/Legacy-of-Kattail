 HOL_the_east_indies_war_machine_taog: "$HOL_the_east_indies_war_machine$"
 HOL_the_east_indies_war_machine_taog_desc: "$HOL_the_east_indies_war_machine_desc$"
 HOL_prepare_for_our_return_taog: "$HOL_prepare_for_our_return$"
 HOL_prepare_for_our_return_taog_desc: "$HOL_prepare_for_our_return_desc$"
 HOL_liberation_taog: "$HOL_liberation$"
 HOL_liberation_taog_desc: "$HOL_liberation_desc$"
 HOL_curtail_colonial_autonomy_taog: "$HOL_curtail_colonial_autonomy$"
 HOL_curtail_colonial_autonomy_taog_desc: "$HOL_curtail_colonial_autonomy_desc$"
 HOL_taog_guarantee_colonial_loyalty: "Garantir la loyauté coloniale"
 HOL_taog_guarantee_colonial_loyalty_desc: "La montée du nationalisme dans les Indes est le signe qu'une autre révolution se profile. Si nous avions facilement réprimé celle de 1927, il semblerait que ce groupe de révolutionnaires soit bien mieux préparé. Peut-être que si nous accordons certaines concessions au mouvement nationaliste pacifique de Soetardjo, nous pourrions détourner l'attention des civils loin de la révolution pour la diriger vers Soetardjo ?"
 HOL_taog_guarantee_colonial_loyalty_tt: "§WEmpêche toute révolution [INS.GetAdjFS].§!\nLes [INS.GetHabitants] essaieront de déclarer leur indépendance pacifiquement. Pour les en empêcher, il faut achever la priorité §Y$INSHOL_industrialized_colony$§!, ce qui nécessite un investissement conséquent dans la colonie."
 ################
 ###   SIAM   ###
 ################
 SIA_the_khana_ratsadon: "Le Khana Ratsadon"
 SIA_the_khana_ratsadon_desc: "Le Parti populaire a mis un terme à l'absolutisme et ouvert la voie à un gouvernement constitutionnel. Son héritage a été contesté, bafoué et traîné dans la boue, mais il n'en reste pas moins le fondement à partir duquel [SIA.GetLeLaLNP] [SIA.GetName] pourr[SIA.GetAOntNP] bâtir sa modernité."
 SIA_the_khana_ratsadon_tt: "\nLe §YKhana Ratsadon§! va devenir actif.\n\nIl s'agit du §Yparti à la tête§! [ROOT.GetDuDelaDelNP] [ROOT.GetName]. Il se divise en deux départements : le §Ydépartement militaire§! et le §Ydépartement civil§!.\n\nLe §Ydépartement civil§! a tendance à se tourner vers des mesures démocratiques et l'industrie civile, tandis que le §Ydépartement militaire§! préfère les mesures fascistes de l'industrie militaire.\n\nNos décisions contenteront un département et frustreront l'autre, octroyant au passage des avantages et malus.\nS'il se rebelle, il pourrait tenter un coup d'État.\n\nIl existe cinq niveaux d'approbation : §Yrévolté§!, §Yen opposition§!, §Yneutre§!, §Ysoutien modéré§! et §Ysoutien total§!"
 SIA_shuffle_pridi_to_the_minister_of_interior: "Renforcer la prise de parti du département civil"
 SIA_shuffle_pridi_to_the_minister_of_interior_desc: "En retirant Pridi du poste de ministre des Affaires étrangères pour lui assigner le ministère de l'Intérieur, il pourra plus aisément contrôler les allocations des ressources nationales et ralentir l'influence néfaste de l'armée."
 SIA_shuffle_pridi_to_the_minister_of_interior_tt: "Les §Y$anti_fascist_raids$§! vont améliorer l'approbation du §Ydépartement civil§! et dégrader celle du §Ydépartement militaire§!"
 SIA_civil_nationalism: "Nationalisme civil"
 SIA_civil_nationalism_desc: "Les Thaïlandais de tous horizons doivent comprendre une chose : leur loyauté n'appartient pas au gouvernement, ou à une personnalité, elle appartient à des valeurs. La liberté et l'égalité sont bien plus importantes que le détenteur du pouvoir actuel."
 SIA_the_true_heirs_of_1932: "Les héritiers de 1932"
 SIA_the_true_heirs_of_1932_desc: "L'armée dépeint la révolution de 1932 comme leur plus grand exploit, alors que ce soulèvement est avant tout un exploit du peuple. Il suffit de le rappeler à la population pour nous doter de toute sa force."
 SIA_thammasat_university: "Université Thammasat"
 SIA_thammasat_university_desc: "Thammasat est une université nouvelle. En tant que telle, elle se doit de développer toutes ses capacités pour faire naître une ère nouvelle sur l'innovation thaïlandaise."
 SIA_defenders_of_constitutional_liberty: "Les défenseurs de la liberté constitutionnelle"
 SIA_defenders_of_constitutional_liberty_desc: "Professeurs, banquiers, infirmières... La classe moyenne peut et doit être mobilisée pour défendre nos libertés, au cas où l'armée irait trop loin."
 SIA_dominate_public_symbols: "Domination des symboles publics"
 SIA_dominate_public_symbols_desc: "L'armée domine depuis très longtemps les symboles publics : statues, fêtes nationales à sa gloire... Il faut contrer cette marée propagandiste en établissant des symboles à l'effigie de la lutte populaire, le droit du peuple au libre arbitre et notre victoire sur l'autocratie archaïque."
 SIA_civil_service_heroism: "Les héros de la fonction publique"
 SIA_civil_service_heroism_desc: "Il faut inculquer aux Thaïlandais l'importance de l'état de droit, et le devoir de le protéger face aux ennemis de l'extérieur comme de l'intérieur. Le peuple doit être capable de nous venir en aide en cas d'invasion, et il doit représenter au jour le jour les valeurs de notre nation."
 SIA_spread_democratic_sentiment_in_universities: "Propager l'opinion démocratique dans les universités"
 SIA_spread_democratic_sentiment_in_universities_desc: "Les universités forment les esprits de demain, les esprits qui gouverneront [SIA.GetLeLaLNP] [SIA.GetName]. Ce qu'elles enseignent aujourd'hui aura des répercussions formidables dans un avenir proche. En inculquant les valeurs démocratiques aux étudiants, nous pourrons peut-être le porter jusqu'aux futurs gouvernements."
 SIA_sideline_disloyal_officers: "Écarter les officiers déloyaux"
 SIA_sideline_disloyal_officers_desc: "Le corps militaire des officiers rassemble des individus qui vouent encore allégeance à des dirigeants évincés, des factions rivales ou bien leurs intérêts personnels, au détriment de la loyauté envers le gouvernement. Débarrassons-nous de ces menaces à coups de mutations et de pression administrative et offrons à nos éléments les plus fidèles de hautes fonctions bien méritées."
 SIA_sideline_disloyal_officers_tt: "Deux généraux aléatoires vont recevoir le trait §YRéaffecté§! pendant 4 ans, qui les empêchera de distribuer des bonus.\nDeux généraux aléatoires qui ne possèdent pas le trait §YRéaffecté§! vont recevoir des stats supplémentaires ainsi qu'un trait positif."
 SIA_direct_funds_from_the_military_towards_development: "Réorienter les fonds de l'armée vers le développement"
 SIA_direct_funds_from_the_military_towards_development_desc: "L'armée risque de voir rouge lorsqu'elle apprendra qu'on lui coupe les vivres, néanmoins elle devra expliquer auprès de la population pourquoi cette réorientation de fonds leur bénéficiera davantage ainsi."
 SIA_as_the_eyes_turn_towards_southeast_asia: "Le regard tourné vers l'Asie"
 SIA_as_the_eyes_turn_towards_southeast_asia_desc: "Tiraillée entre l'empire, la révolution et la guerre, l'Asie du Sud-Est n'est plus si éloignée. [SIA.GetLeLaLNPCap] [SIA.GetName] devr[SIA.GetAOntNP] décider entre être un pion au milieu de ce conflit, ou une puissance capable d'afficher ses propres ambitions."
 SIA_support_songsuradets_military_clique: "Soutenir la clique militaire de Songsuradet"
 SIA_support_songsuradets_military_clique_desc: "Tous les officiers ne sont pas des ennemis de la nation. Songsuradet et ses fidèles proposent une alternative militaire disciplinée aux généraux corrompus qui ont conduit le Siam à sa perte. Avec leur soutien, l'ordre pourra être rétabli sans que l'État sombre dans le chaos."
 SIA_support_songsuradets_military_clique_tt: "En cas de §Yguerre civile§!, Songsuradet sera de notre côté, nous octroyant §Y3§! divisions supplémentaires\n§RSi nous soutenons Songsuradet, mais que nous tentons ensuite de l'arrêter avec $SIA_the_songsuradet_rebellion$, il risque de s'y opposer.§!"
 SIA_the_royal_police_counterweight: "La police royale"
 SIA_the_royal_police_counterweight_desc: "La police royale est une force indépendante qui pourrait intervenir contre notre opposition en cas de tentative de coup d'État."
 SIA_the_royal_police_counterweight_tt: "En cas de §Yguerre civile§!, la police royale sera de notre côté, nous octroyant §Y2§! division supplémentaire"
 SIA_for_the_preservation_of_siamese_independence: "Renforcer le contrôle du département militaire"
 SIA_for_the_preservation_of_siamese_independence_desc: "Le siècle dernier a été marqué par le déchirement du territoire [SIA.GetAdjMS] aux mains des grandes puissances. Ce siècle nouveau semble emprunter la même voie. Si nous tenons à préserver notre mode de vie et ne pas terminer en État fantoche écartelé entre plusieurs nations impérialistes, nous devons agir, et vite."
 SIA_for_the_preservation_of_siamese_independence_tt: "Les §Y$anti_democratic_raids$§! vont améliorer l'approbation du §Ydépartement militaire§! et dégrader celle du §Ydépartement civil§!"
 SIA_the_peoples_day: "Le jour du peuple"
 SIA_the_peoples_day_desc: "Au lieu de mettre toujours plus sur le devant de la scène le renversement de la monarchie par l'armée, prions les louanges du peuple. En nommant une fête nationale du peuple, nos citoyens se rassemblent en célébrant le pays."
 SIA_hold_military_parades: "Organiser un défilé militaire"
 SIA_hold_military_parades_desc: "Nous allons organiser une parade grandiose dans les rues de Bangkok pour mettre à l'honneur nos généraux, remonter le moral des troupes et rappeler à nos citoyens toute la puissance des forces armées [SIA.GetAdjFP]. Pour une fois que les journaux auront quelque chose d'intéressant à raconter !"
 SIA_embed_technocrats_in_civilian_institutions: "Implanter les technocrates dans les institutions civiles"
 SIA_embed_technocrats_in_civilian_institutions_desc: "Formons des alliances avec les technocrates au sein du gouvernement, afin de les infiltrer au sein de l'armée et d'affaiblir son influence."
 SIA_military_academies_indoctrination: "Endoctrinement dans les écoles militaires"
 SIA_military_academies_indoctrination_desc: "Nos écoles militaires sont l'endroit idéal pour propager notre idéologie. Les jeunes recrues sont très influençables face à leurs instructeurs – de plus, elles savent se battre. Si nous parvenons à nous allier aux instructeurs, nous pourrons nous mettre tous les futurs soldats du pays dans la poche. Une armée puissante au service du peuple, voilà qui devrait forger un État éminent."
 SIA_the_king_of_the_white_elephant: "Le Roi à l'éléphant blanc"
 SIA_the_king_of_the_white_elephant_desc: "La folie pousse des puissances à vouloir reconquérir des territoires perdus au prix de notre nation. Le monde entier observe... Pour apaiser les esprits, nous allons produire un film contre la guerre, le tout premier film thaïlandais filmé en anglais, pour montrer aux yeux de tous qui nous sommes vraiment."
 SIA_the_king_of_the_white_elephant_tt: "Donne accès à la campagne de propagande §Y$SIA_the_king_of_the_white_elephant$§! à l'achèvement de la priorité §Y$SIA_sala_chaloem_thai_movie_theater$§!, ce qui octroie :\nStabilité hebdomadaire : §G+0,45%§! pendant 180 jours"
 SIA_drum_up_irredentism: "Provoquer l'irrédentisme"
 SIA_drum_up_irredentism_desc: "Obtenir le soutien de l'armée en cas de guerre est une bonne chose, mais pour l'emporter, il nous faut également le soutien du peuple. Produisons des poèmes, des films, des discours qui dénoncent les actes abjects que les puissances impérialistes ont commis sur les [SIA.GetHabitants] et leur nation."
 SIA_sell_privy_purse_lands: "Vendre des terrains royaux privés"
 SIA_sell_privy_purse_lands_desc: "La famille royale possède de vastes propriétés terrestres qui sont désormais sous notre contrôle. Vendre ces domaines nous assurerait une belle rentrée d'argent. Nous pourrions justement proposer des prix très avantageux à certains officiers pour nous assurer leur loyauté."
 SIA_sell_privy_purse_lands_tt: "À l'expiration de l'esprit, §Y[SIA_phraya_phahon.GetName]§! sera au cœur d'un scandale, nous évitant ainsi l'obligation du fascisme pour §Y$SIA_phibuns_premiership$§!"
 SIA_war_fervor: "Ferveur militaire"
 SIA_war_fervor_desc: "Les tambours battent déjà en prévision du prochain conflit. Le peuple est enthousiaste, il met le feu aux poudres, et la ferveur militaire atteindra bientôt son apogée. Tâchons de canaliser cette exaltation vers une cause juste."
 SIA_war_fervor_tt: "Le soutien à la guerre va augmenter sans cesse jusqu'à ce que nous déclarions la guerre à un autre pays ; l'esprit sera alors retiré.\n\nSi le §Ysoutien à la guerre§! demeure au-delà de §Y95%§! sans déclaration de guerre, une guerre civile éclatera.\nLorsque la guerre est déclarée :"
 SIA_the_midnight_meeting: "L'entretien nocturne"
 SIA_the_midnight_meeting_tt: "[SIA_plaek_phibunsongkhram.GetName] va prendre le pouvoir [SIA.GetAuEnANP] [SIA.GetName]. Il faudra l'éjecter si nous voulons rétablir la monarchie."
 SIA_the_midnight_meeting_desc: "En observant Phibun lever une force redoutable, le maréchal Songsuradet y a vu des représailles. Pour préserver la monarchie, les royalistes, les officiers en chef et les notables civils doivent se réunir dans le plus grand secret et trouver un moyen d'évincer Phibun avant qu'il n'ait le temps de passer à l'acte."
 SIA_meet_with_king_prajadhipok: "Rencontrer le roi Prajadhipok"
 SIA_meet_with_king_prajadhipok_desc: "Qu'est-ce qu'une conspiration sans l'implication du roi, sinon qu'un vulgaire complot militaire ? Rencontrons le roi en exil, Prajadhipok, pour nicher notre cause au sein de la cause royaliste et obtenir le soutien du seul homme capable de rallier les plus sceptiques et diviser le régime."
 SIA_prajadhipok_audience_with_churchill: "La rencontre Prajadhipok-[ENG.GetLeader]"
 SIA_prajadhipok_audience_with_churchill_desc: "La présence de Prajadhipok [ENG.GetAuEnANP] [ENG.GetName] n'est pas une simple visite de courtoisie ; convainquons [ENG.GetLeader] qu'une campagne royaliste servirait les intérêts britanniques en Asie pour tenter d'obtenir l'armement malais et un net avantage dans notre cause."
 SIA_prajadhipok_audience_with_churchill_tt: "Les [ENG.GetHabitants] vont nous fournir "
 SIA_prajadhipok_audience_with_churchill_tt2: "Au début de la guerre civile."
 SIA_facilitate_prajadhipoks_move_to_japan: "Faciliter le déplacement de Prajadhipok au Japon"
 SIA_facilitate_prajadhipoks_move_to_japan_desc: "La Grande-Bretagne n'est pas la seule puissance qui aurait à gagner du chaos [ROOT.GetAdjMS] : une visite de Prajadhipok à Tokyo pourrait nous décrocher quelques divisions japonaises qui nous seraient fort utiles en cas de guerre civile."
 SIA_facilitate_prajadhipoks_move_to_japan_tt: "3 divisions de rangers [JAP.GetAdjMP] vont nous rejoindre lors de la guerre civile."
 SIA_the_kings_gambit: "Le gambit du roi"
 SIA_the_kings_gambit_desc: "Prajadhipok est en route pour Bangkok, où il sera très certainement appréhendé par le régime. Cette arrestation sera le prétexte idéal pour que les royalistes s'indignent et agissent légitimement au nom du roi. Dès lors que le roi en exil sera mis aux fers, le signal sera donné, et la lutte pour [ROOT.GetLeLaLNP] [ROOT.GetName] pourra commencer."
 SIA_the_kings_gambit_tt: "Notre soutien dépend du nombre de cliques dans notre camp."
 SIA_restore_order: "Restaurer l'ordre"
 SIA_restore_order_desc: "La guerre civile est remportée, mais la victoire ne suffit pas à restaurer un royaume. Déblayons les ruines, apaisons la vieille garde et restructurons l'administration pour refaire [ROOT.GetDuDelaDelNP] [ROOT.GetName] une monarchie souveraine et présentable."
 SIA_ananda_age_trigger_12: "Le roi Ananda a au moins §Y12§! ans (âge actuel : §Y[?var:SIA_anandas_age]§! ; son anniversaire tombe le 20 septembre)"
 SIA_ananda_age_trigger_15: "Le roi Ananda a au moins §Y15§! ans (âge actuel : §Y[?var:SIA_anandas_age]§! ; son anniversaire tombe le 20 septembre)"
 SIA_ananda_trait_tt: "Lorsqu'Anada accèdera au trône, il obtiendra : "
 SIA_to_forge_a_king: "De l'art de former un roi"
 SIA_to_forge_a_king_desc: "Le roi Ananda demeure en Suisse, encore trop jeune pour diriger, mais assez grand pour assimiler les préceptes d'un grand monarque. Choisissons judicieusement son cursus pour forger un roi digne de notre grande nation."
 SIA_to_forge_a_king_tt: "Le jeune roi en devenir, Ananda Mahidol, se trouve actuellement [SWI.GetAuEnANP] [SWI.GetName], où on lui enseigne la voie des monarques. Nous pouvons décider ses sujets d'étude afin d'en faire un roi idéal.\n\nTous les ans, le jour de son anniversaire et jusqu'à ses 15 ans révolus, nous pourrons choisir son cursus qui octroiera des avantages spécifiques lorsqu'il accèdera au pouvoir.\n\nIl a actuellement §Y[?var:SIA_anandas_age]§! ans, et son anniversaire est le 20 septembre."
 SIA_ascend_the_throne: "Accéder au trône"
 SIA_ascend_the_throne_desc: "La régence ne peut pas durer éternellement. Ananda est désormais en âge d'assumer la gouvernance du royaume. Son ascension officielle au pouvoir nous permettra enfin de légitimer notre monarchie restaurée et de faire taire les quolibets."
 SIA_the_provincial_council_of_state: "Les États provinciaux"
 SIA_the_provincial_council_of_state_desc: "Les dissensions entravent les rouages du gouvernement et affaiblissent son autorité. Tant que le roi Ananda n'est pas en âge de gouverner, nous allons mettre en place un conseil d'États provinciaux qui sera chargé d'affirmer que les royalistes ne mènent pas un combat égoïste, mais un combat pour restaurer une monarchie juste et légitime."
 SIA_the_regency_of_boworadet: "La régence de Boworadet"
 SIA_the_regency_of_boworadet_desc: "Le prince Boworadet porte le prestige de l'ancien ordre et sa loyauté envers la couronne sur son uniforme. Nommons-le régent d'Ananda pour nous assurer une gouvernance conservatrice et envoyer un message clair : la restauration ne se contentera pas d'une chaise musicale ministérielle."
 SIA_the_sacred_hierarchy: "Une hiérarchie sacrée"
 SIA_the_sacred_hierarchy_desc: "D'après Boworadet, le royaume est toujours plus fort lorsque chacun reste à sa place et que la couronne dépasse toute ambition. La monarchie, la foi et la hiérarchie [ROOT.GetAdjFS] naturelle sont les fondements sacrés de notre nation, pas des reliques de l'ancien temps dont il faut se débarrasser."
 SIA_the_regency_of_songsuradet: "La régence de Songsuradet"
 SIA_the_regency_of_songsuradet_desc: "Songsuradet n'est pas un libéral, néanmoins il sait répondre aux besoins d'un État contemporain. En tant que régent, il peut s'investir dans un programme de développement national axé sur le secteur militaire sans impacter l'image de la couronne."
 SIA_order_discipline_and_unity: "Ordre, discipline et unité"
 SIA_order_discipline_and_unity_desc: "Le chaos provoqué par la politique et la guerre civile ont failli anéantir le royaume. La réponse de Songsuradet est sans équivoque : l'ordre au sein du gouvernement, la discipline au sein de la société et l'unité au sein du royaume, afin que la nation entre dans la modernité avec assurance."
 SIA_the_regency_of_rangsit: "La régence de Rangsit"
 SIA_the_regency_of_rangsit_desc: "Le prince Rangsit sait bien que la survie de la monarchie ne tient qu'aux rapports qu'elle entretient avec les membres du gouvernement. Sa régence propose une restauration à la fois conservatrice dans l'image, mais démocratique dans l'approche. Il saura garantir un avenir parlementaire [ROOT.GetAdjMS]."
 SIA_constitutional_virtue: "La vertu constitutionnelle"
 SIA_constitutional_virtue_desc: "Une monarchie respectant les lois est une monarchie presque impossible à renverser. Grâce aux conseils avisés du prince Rangsit, nous allons rétablir le gouvernement constitutionnel, limiter le pouvoir arbitraire et inculquer à la population que la couronne est garante de la liberté."
 SIA_an_absolute_monarchy: "Monarchie absolue"
 SIA_an_absolute_monarchy_desc: "La monarchie limitée n'a engendré que l'humiliation, des coups d'État et l'usurpation de l'autorité royale par des officiers aux dents longues. La couronne doit retrouver ses prérogatives et son autorité, libérée de toute subordination, avant que la famille royale monte à nouveau sur le trône."
 SIA_a_constitutional_monarchy: "Monarchie constitutionnelle"
 SIA_a_constitutional_monarchy_desc: "Le trône n'a pas besoin de dominer l'État pour protéger le royaume ; il suffit de restaurer la monarchie sous des auspices constitutionnels pour réconcilier couronne et peuple, mais surtout s'assurer que la dignité royale peut cohabiter avec un gouvernement responsable."
 SIA_to_lay_the_bait: "Lancer l'appât"
 SIA_to_lay_the_bait_tt: "Nous dévoilerons un faux plan économique pour provoquer l'armée.\nPlus nous attendrons pour §Ytirer l'hameçon§!, plus la réaction sera virulente envers l'armée, et plus notre soutien sera important.\n\n$SIA_dem_event_count_cw_scale_tt$\n\nÀ chaque fois que l'armée critiquera le faux rapport, notre soutien à la guerre civile augmentera, jusqu'à un maximum de §Y75%§!. Un soutien supplémentaire à la guerre civile de §Y25%§! pourra être obtenu à partir de notre soutien total à la démocratie (sur une échelle de §Y0% à 100%§!)"
 SIA_dem_event_count_cw_scale_tt: "§YSoutien actuel prévu§! : §G[?var:SIA_dem_event_count_cw_scale|%]§!"
 SIA_to_lay_the_bait_desc: "Le dossier jaune prévoit une réforme économique, que l'armée qualifiera de communiste. En dévoilant un faux plan radical, nous pourrons susciter son indignation avant de la discréditer quand la vraie version, plus édulcorée, sera publiée."
 SIA_and_spring_the_trap: "Tirer l'hameçon"
 SIA_and_spring_the_trap_desc: "Les généraux ont mordu à l'hameçon. Leur indignation s'est muée en révolte, révélant ainsi leurs ambitions. Le gouvernement civil était prêt à refermer le piège sur eux. Désormais, l'avenir [ROOT.GetDuDelaDelNP] [ROOT.GetName] dépendra de ceux qui resteront fidèles à la constitution."
 SIA_and_spring_the_trap_tt: "Si notre soutien total est supérieur à §Y80%§!, nous éviterons une guerre civile et destituerons l'armée instantanément."
 SIA_rebuild_the_war_torn_economy: "Rebâtir l'économie brisée"
 SIA_rebuild_the_war_torn_economy_desc: "La guerre civile a ravagé les routes, les usines, les rizières et les axes commerciaux. La reconstruction doit commencer sans attendre. Les salaires, les céréales, les voies ferrées et les crédits permettront mieux de stabiliser [ROOT.GetLeLaLNP] [ROOT.GetName] que n'importe quel discours de Bangkok."
 SIA_end_military_grift: "Mettre un terme aux abus de l'armée"
 SIA_end_military_grift_desc: "Depuis trop longtemps, les budgets militaires servent à enrichir des fortunes privées, des réseaux de favoritisme et des projets aussi prestigieux qu'inutiles. La guerre a révélé tout cela au grand jour. Chaque contrat illégal, chaque unité fantôme, et chaque cargaison volée feront l'objet d'une enquête et seront retirés à l'ancienne clique."
 SIA_the_purge: "La purge"
 SIA_the_purge_desc: "La clique militaire a préféré plonger la nation dans le sang plutôt que de se soumettre à un gouvernement civil. Il ne peut y avoir aucun compromis avec les traîtres. Les officiers, les collaborateurs et les sympathisants devront être démis de leurs fonctions avant qu'ils ne menacent à nouveau l'État."
 SIA_achieve_foreign_legitimacy: "Acquérir une légitimité internationale"
 SIA_achieve_foreign_legitimacy_desc: "Les puissances étrangères ont observé notre crise avec méfiance, attendant de voir si le Siam allait tomber entre les mains d'une junte militaire ou d'une révolution. Nous devons prouver que le gouvernement civil est stable, légitime, et capable de défendre le pays."
 SIA_achieve_foreign_legitimacy_trigger: "Une grande puissance a une opinion de nous supérieure à §Y75§!"
 SIA_countries_that_like_me_doctrine_tt: "§Y[?var:SIA_countries_that_like_me]x§! §G50%§! de réduction sur le coût de §YDoctrine terrestre§!"
 SIA_achieve_foreign_legitimacy_tt: "Gagne §G[?var:SIA_achieve_foreign_legitimacy_base_stab_gain|%.0]§! de stabilité pour chaque grande puissance ayant une opinion de nous supérieure à §Y75§!\n\nSi plus de §Y3§! grandes puissances sont dans ce cas de figure, nous obtiendrons également §Yune réduction unique§! de §G50%§! sur les §Ydoctrines terrestres§! pour chaque puissance mondiale en excès.\n\nSi §Y6§! puissances mondiales ou plus sont dans ce cas de figure, nous obtiendrons §G2§! §Yusines civiles§!."
 SIA_secure_the_state: "Protéger l'État"
 SIA_secure_the_state_desc: "Une victoire dans la guerre civile n'est pas forcément synonyme de stabilité. Les chemins de fer, les ports, les arsenaux et les centres de communications devront être sécurisés avant que les officiers réactionnaires puissent se regrouper. Bangkok doit garder son calme et rester sous le contrôle du gouvernement civil."
 SIA_expand_upon_the_dossier: "S'appuyer sur le Dossier"
 SIA_expand_upon_the_dossier_desc: "Le dossier jaune a été rédigé au cours d'une période difficile, qui est à présent derrière nous. Maintenant que nous sommes débarrassés de la clique militaire, à nous d'aller encore plus loin avec une réforme foncière approfondie, une meilleure protection des travailleurs, et un État capable de reconstruire le Siam de zéro."
 SIA_military_oversight_bureau: "Bureau de surveillance militaire"
 SIA_military_oversight_bureau_desc: "Nous ne pouvons pas laisser l'armée redevenir un État dans l'État. Un bureau de surveillance civil gardera un œil sur les nominations, les budgets et l'activité politique au sein des forces armées, tout en veillant à ce que les casernes obéissent à Bangkok, et non l'inverse."
 SIA_military_oversight_bureau_tt: "Le §Ybureau de surveillance militaire§! enquête sur les généraux tous les 5 à 9 mois. Au cours de ces périodes, les généraux concernés agiront moins efficacement, craignant d'être sous surveillance."
 SIA_the_yellow_dossier: "Le dossier jaune"
 SIA_the_yellow_dossier_desc: "Le faux plan radical a fonctionné à merveille. Le vrai dossier jaune peut désormais entrer en vigueur : des réformes mesurées, une modernisation économique, et des garanties politiques visant à mettre un terme à la domination militaire sans plonger la nation dans le chaos."
 SIA_achieve_domestic_legitimacy: "Acquérir une légitimité nationale"
 SIA_achieve_domestic_legitimacy_desc: "Le gouvernement a tenu bon par la force, mais il doit désormais s'imposer par la loi, le pain et l'ordre. Nous devons restaurer la confiance du peuple et prendre des mesures d'urgence justifiées, afin de montrer que le gouvernement civil offre bien plus qu'une simple survie."
 SIA_achieve_domestic_legitimacy_tt: "Le système du §YKhana Ratsadon§! va être aboli.\nLe §Ydépartement militaire§! va être dissout, ce qui va supprimer son esprit national.\n\nLe §Ydépartement civil§! va être remanié en : §Y$idea_SIA_unwavering_civilian_support$§!."
 SIA_allies_integration: "Intégration des Alliés"
 SIA_allies_integration_desc: "Nos forces doivent apprendre à combattre aux côtés des Alliés. Les structures de commandement, les communications, les procédures de ravitaillement, et les normes concernant le matériel doivent être harmonisées pour que le Siam ne soit pas qu'un simple allié symbolique."
 SIA_prepare_for_a_pacific_war: "Planifier une guerre dans le Pacifique"
 SIA_prepare_for_a_pacific_war_desc: "Les empires ont les yeux rivés sur le Pacifique. Les ambitions du Japon, les colonies d'Europe, et la stratégie des Alliés annoncent une tempête imminente. Le Siam doit se tenir prêt avant que les premiers coups de feu n'éclatent sur nos côtes."
 SIA_the_end_of_gunboat_diplomacy: "La fin de la diplomatie de la canonnière"
 SIA_the_end_of_gunboat_diplomacy_desc: "Plus jamais des navires de guerre étrangers n'imposeront leurs conditions depuis l'embouchure du Chao Phraya. Le Siam doit posséder les canons, les quais, les mines, et les défenses côtières nécessaires pour que toute menace à l'encontre de Bangkok soit considérée comme de la pure folie."
 SIA_preemtive_strike: "Frappe préventive"
 SIA_preemtive_strike_desc: "Il serait stupide d'attendre que le Japon décide de l'heure de la guerre. Si l'empire a l'intention de déferler sur l'Asie, alors [SIA.GetLeLaLNP] [SIA.GetName] devr[SIA.GetAOntNP] frapper avant que [SIA.GetSesLeursNP] troupes et [SIA.GetSesLeursNP] flottes ne soient mobilisées ailleurs."
 SIA_the_siamese_armada: "L'armada [SIA.GetAdjFS]"
 SIA_the_siamese_armada_desc: "[SIA.GetLeLaLNPCap] [SIA.GetName] moderne[SIA.GetXSNP] [SIA.GetAOntNP] besoin d'une flotte moderne. Avec de nouveaux navires, des troupes entraînées, et des infrastructures navales avancées, l'armada [SIA.GetAdjFS] s'imposera comme une force capable de défendre nos côtes et de projeter notre puissance bien au-delà."
 SIA_asian_democratic_compact: "Le contrat démocratique asiatique"
 SIA_a_more_moderate_option: "Une option plus modérée"
 SIA_a_more_moderate_option_desc: "La réforme doit persister, et non s'éteindre face à l'opposition. En maintenant le dossier jaune dans les limites du raisonnable, nous pourrons isoler les extrémistes, apaiser les classes moyennes, et bâtir un ordre civil qui perdurera après sa première victoire."
 SIA_asian_democratic_compact_desc: "L'Asie ne pourra pas toujours compter sur les promesses des grandes puissances et des empires lointains. Les nations démocratiques de la région devront rester unies, se défendre mutuellement, et démontrer que l'indépendance et la liberté ont leur place en Asie."
 SIA_asian_democratic_compact_tt: "Permet d'exiger l'indépendance des États dépendants asiatiques, et nous permet de les inviter à rejoindre notre faction."
 SIA_asian_democratic_compact_modify: "Modifie §Y$SIA_asian_democratic_compact$§! ainsi :"
 SIA_southeast_asia_joint_command: "Commandement conjoint d'Asie du Sud-Est"
 SIA_southeast_asia_joint_command_desc: "Notre accord doit devenir plus qu'une simple promesse diplomatique. Un commandement conjoint sera chargé de coordonner la stratégie, le ravitaillement, le renseignement, et la planification de la défense dans toute l'Asie du Sud-Est, afin de transformer ces différentes armées en un bouclier commun."
 SIA_pan_asian_weapon_standardization: "Homogénéisation de l'armement panasiatique"
 SIA_pan_asian_weapon_standardization_desc: "Quand des alliés utilisent des fusils, des calibres, des radios et des véhicules différents, nous nous exposons à des problèmes logistiques. Une homogénéisation des armes et des plans de production communs rendront notre coalition plus forte, moins coûteuse, et plus rapide à armer."
 SIA_united_against_aggression: "Unis contre l'agresseur"
 SIA_united_against_aggression_desc: "Notre accord ne laissera aucun membre pour compte. Que la menace vienne de l'empire, du fascisme, du militarisme ou de voisins opportunistes, les nations d'Asie y feront face ensemble."
 SIA_the_hammers_that_strike: "Les battements des marteaux"
 SIA_the_hammers_that_strike_desc: "Notre alliance ne se résume plus à un simple regroupement de petits États dans un but de survie. C'est une arme. Chaque nation est un marteau, et ensemble, nous le lèverons face à toutes les puissances qui chercheront à régner sur l'Asie."
 SIA_mobilize_the_defenders_of_siam: "Mobiliser les défenseurs du Siam"
 SIA_mobilize_the_defenders_of_siam_desc: "L'ancienne armée ne s'est pas montrée à la hauteur, mais le Siam a encore besoin de défenseurs. Nous devons regrouper les volontaires, les fidèles officiers, les gardes provinciaux, et les citoyens patriotes au sein d'une force chargée de protéger la constitution des ennemis, d'où qu'ils viennent."
 SIA_join_the_allies: "Rejoindre les Alliés"
 SIA_join_the_allies_desc: "En ces temps de guerre, [ROOT.GetLeLaLNP] [ROOT.GetName] ne peu[ROOT.GetTVentNP] pas se contenter de rester dans [ROOT.GetSonLeurNP] coin. Les Alliés offrent des armes, une reconnaissance, et une place parmi les nations résistantes. En nous joignant à eux, nous lions la survie du Siam à la lutte pour un monde plus libre."
 SIA_the_malay_peninsular_defense_plan: "Le plan de défense de la péninsule malaise"
 SIA_the_malay_peninsular_defense_plan_desc: "Si la guerre éclate en Asie du Sud-Est, la Malaisie sera l'un de ses premiers champs de bataille. Ses fortifications, ses dépôts de ravitaillement, et sa planification conjointe avec les Britanniques feront de la péninsule un rempart contre les invasions."
 SIA_the_malay_peninsular_defense_plan_tt: "Construit un chemin de fer entre Bangkok et Singapour.\n\nChaque point de victoire [MAL.GetAuEnANP] [MAL.GetName], à Singapour, au [724.GetName], au [289.GetName] et dans l'[1076.GetName]\nAjoute §G2§! §Yforts côtiers§!\nAjoute §G2§! §Yforts terrestres§!\nChacun de ces États :\nAjoute §G1§! §YDCA statique§!"
 SIA_join_the_united_front: "Rejoindre le Front uni"
 SIA_join_the_united_front_desc: "La Chine souffre suite aux attaques [JAP.GetAdjFP], mais elle ne baisse pas les bras. En rejoignant le Front uni, [SIA.GetLeLaLNP] [SIA.GetName] pourr[SIA.GetAOntNP] enterrer ses ambitions impérialistes."
 SIA_a_land_war_in_asia_desc: "La guerre ne se gagnera pas avec de belles déclarations. Les soldats siamois devront combattre et souffrir sur les terrains difficiles d'Asie. Notre engagement envers le Front uni devra se mesurer en actions concrètes."
 SIA_death_to_the_communists: "Mort aux communistes"
 SIA_death_to_the_communists_desc: "La défaite de la clique militaire ne doit pas ouvrir la porte à une nouvelle forme de tyrannie. Les militants communistes pensent que la crise a affaibli l'État. Nous allons leur montrer que la démocratie civile n'est pas sans défense."
 SIA_death_to_the_nationalists: "Mort aux nationalistes"
 SIA_death_to_the_nationalists_desc: "Le Japon a été repoussé, mais la question de l'avenir de l'Asie demeure. L'ancien ordre nationaliste ne fera que remplacer une hiérarchie par une autre. Si nous devons reconstruire l'Asie, ce sera avec les communistes."
 SIA_a_new_dawn_over_asia: "Une nouvelle ère en Asie"
 SIA_a_new_dawn_over_asia_desc: "L'empire japonais s'est effondré, et les forces corrompues qui cherchaient à hériter de ses ruines ont été mises à l'écart. Partout en Asie, une nouvelle ère s'ouvre pour les nations qui sont déterminées à construire leur avenir loin de toute domination impériale."
 SIA_phibuns_premiership: "Le ministère de Phibuns"
 SIA_phibuns_premiership_desc: "Alors que [SIA_phraya_phahon.GetName] devra très bientôt quitter le ministère, Plaek Phibunsongkhram, son successeur, se tient déjà prêt à prendre sa place. Ce changement de dirigeant va ravir l'armée, mais décevoir le peuple.\nIl n'y a plus qu'une façon d'avancer pour nous, désormais : avec détermination !"
 SIA_siamese_youth_movement: "Jeunesses [THIS.GetAdjFP]"
 SIA_siamese_youth_movement_desc: "Les jeunes [THIS.GetHabitants] brûlent d'une passion aussi ardente que le fer rouge. Il faut leur apprendre à respecter l'État, défendre la patrie et devenir des citoyens modèles de la société thaïlandaise."
 SIA_territorial_defense_student: "Étudiants de la défense territoriale"
 SIA_territorial_defense_student_desc: "Les meilleurs éléments des jeunesses [SIA.GetAdjFP] devraient être invités dans nos camps d'entraînement militaires juniors. Ils pourront contribuer ainsi à la défense de la nation après avoir reçu une instruction militaire digne de ce nom."
 SIA_expand_domestic_arms_workshops: "Développer les ateliers d'armement domestiques"
 SIA_expand_domestic_arms_workshops_desc: "Nos capacités de production militaire sur notre sol sont ridicules, très en retard sur les pays développés. Nous devons développer de notre mieux nos moyens de fabrication afin de fournir à nos troupes tout l'équipement dont elles auront besoin."
 SIA_look_to_european_fascism: "S'intéresser au fascisme européen"
 SIA_look_to_european_fascism_desc: "Nous avons l'occasion unique de réformer notre pays, le libérer de son passé pour lui offrir un avenir radieux, comme celui qui attend les puissances occidentales. Ce n'est un secret pour personne : l'ordre mondial de naguère n'est plus. L'heure est à la modernisation et au progrès. La nation qui manquera de s'y appliquer en subira les conséquences."
 SIA_the_songsuradet_rebellion: "La rébellion de Songsuradet"
 SIA_the_songsuradet_rebellion_desc: "L'officier en chef, Phraya Songsuradet, pourrait s'avérer être une véritable menace pour le régime en place. Il est hors de question de le laisser agir impunément ; il faut à tout prix neutraliser cet opposant politique à Phibun.\nNous pourrions très certainement trouver des éléments à charge contre Songsuradet et ses partisans. Nous ferions ainsi d'une pierre deux coups : écarter nos adversaires tout en consolidant notre autorité."
 SIA_the_songsuradet_rebellion_historical_tt: "Le général Phraya Songsuradet va être accusé de conspiration envers l'État. Lui, ainsi que ses conseillers [SIA_phraya_thephatsadin.GetName] et §Y[SIA_rangsit_prayurasakdi.GetName]§!, vont être purgés.\n\nNous allons recevoir :\n"
 SIA_the_songsuradet_rebellion_historical_tt2: "À la fin du délai, gain de : "
 SIA_the_songsuradet_rebellion_historical_tt3: "pendant §Y[?var:SIA_purged_military_timer]§! jour(s)"
 SIA_the_songsuradet_rebellion_alt_tt: "Le général Phraya Songsuradet va être accusé de conspiration envers l'État.\n\nNéanmoins, comme nous avons renforcé sa clique militaire, il pourrait refuser de se présenter à la cour, ce qui entraînerait une impasse, voire une guerre civile."
 SIA_sue_the_king_in_exile: "Poursuivre le roi en exil"
 SIA_sue_the_king_in_exile_desc: "Le roi en exil est accusé d'avoir emporté avec lui des actifs capitaux. Nous devons les récupérer, quitte à les traîner, lui et son épouse, devant les tribunaux."
 SIA_suspend_ordinary_legal_procedures: "Suspendre les procédures légales ordinaires"
 SIA_suspend_ordinary_legal_procedures_desc: "La rébellion de Songsuradet est l'excuse toute trouvée pour promulguer des réformes radicales au nom de la sécurité nationale. Nous pourrions suspendre le jeu des pouvoirs arbitré par la justice et les autres organes politiques pour centraliser le pouvoir comme nous le souhaitons."
 SIA_the_duty_of_the_thai_people_during_the_war_act: "L'acte sur le devoir des Thaïlandais en temps de guerre"
 SIA_the_duty_of_the_thai_people_during_the_war_act_desc: "$idea_SIA_cemented_control_3_desc$"
 SIA_recognize_manchukuo: "Reconnaître le Mandchoukouo"
 SIA_recognize_manchukuo_desc: "TODO_CM"
 SIA_press_censorship: "Censure de la presse"
 SIA_press_censorship_desc: "Une presse libre est un danger à la stabilité de l'État. Inutile de la museler totalement, mais il faut surtout que l'opinion et la volonté du gouvernement soient la priorité des médias."
 SIA_department_of_publicity: "Département de la publicité"
 SIA_department_of_publicity_desc: "La propagande est l'outil indispensable à tout État, notamment un État aux ambitions territoriales comme le nôtre. Finançons un département de la publicité pour arriver à nos fins."
 SIA_thai_cultural_mandates: "Décrets culturels thaïlandais"
 SIA_thai_cultural_mandates_desc: "Exaltons le peuple thaïlandais à bâtir une riche culture nationale grâce à la publication de décrets qui renforceront l'unité populaire et l'identité patriotique."
 SIA_thai_cultural_mandates_tt: "Donne accès aux décisions permettant de promulguer des décrets culturels offrant des bonus en échange de §Ypoids politique§!. Le Premier décret ainsi que le suivant sont gratuits."
 SIA_relocate_the_capital_to_phetchabun: "Transférer la capitale à Phetchabun"
 SIA_relocate_the_capital_to_phetchabun_desc: "Le gouvernement est menacé ! Si l'histoire nous a bien enseigné une chose, c'est que Bangkok est hautement vulnérable aux attaques navales. Ce ne sera pas notre décision la plus populaire, mais il faut relocaliser la capitale plus loin dans les terres."
 SIA_relocate_the_capital_to_phetchabun_tt: "Relocalise jusqu'à §G3§! §Yusines militaires§! de §Yl'[1076.GetName]§! vers le §Y[1077.GetName]§!\nRelocalise §G3§! §Yusines civiles§! de l'§Y[1076.GetName]§! vers §Yle [1077.GetName]§!\nConstruit des fortifications de niveau §G3§! autour de Phetchabun"
 SIA_relocate_the_capital_to_phetchabun_tt2: "À l'expiration de l'esprit, Stabilité de base : §R-25%§!"
 SIA_radio_propaganda: "Propagande radiodiffusée"
 SIA_radio_propaganda_desc: "Depuis l'électrification [SIA.GetDuDelaDelNP] [SIA.GetName], la radio a connu une popularité fulgurante. Nous devons contrôler toutes les émissions qui en sortent, à l'instar des colonnes qui paraissent dans la presse."
 SIA_sala_chaloem_thai_movie_theater: "Cinéma Sala Chaloem Thai"
 SIA_sala_chaloem_thai_movie_theater_tt: "Donne accès aux décisions permettant de produire des films de propagande, octroyant des bonus. Par exemple :\n"
 SIA_sala_chaloem_thai_movie_theater_desc: "Les films sont une nouveauté dans notre pays, mais leur potentiel est évident : tout comme les poèmes, les romans ou la radio avant eux, ils sont capables de toucher en plein cœur les élites comme les prolétaires. Mettons à profit ce média inédit pour renforcer le patriotisme des [SIA.GetHabitants]."
 SIA_pan_thaiism: "Pan-thaïsme"
 SIA_pan_thaiism_desc: "Notre nation ne se contentera pas seulement de survivre ; elle veut prospérer ! L'avenir des [ROOT.GetHabitants] s'inscrit sur la scène mondiale, non pas comme pays du tiers-monde, mais comme acteur majeur. Nous devons avant tout éveiller les cœurs et les esprits du peuple afin qu'il s'oppose aux impérialistes qui nous ont privés de nos richesses."
 vichy_exist_trigger: "La §YFrance de Vichy§! existe"
 vichy_exist_not_trigger: "La §YFrance de Vichy§! n'existe pas"
 SIA_retake_lost_british_states: "Reconquérir les États britanniques"
 SIA_retake_lost_british_states_tt: "Permet de lancer des guerres limitées sur les territoires britanniques de §YBirmanie§! et de §YMalaisie§!"
 INS_retake_lost_british_states_tt: "Permet de lancer des guerres limitées sur les territoires britanniques de §YMalaisie§!"
 SIA_retake_lost_british_states_desc: "En plus des [FRA.GetHabitants], les [ENG.GetHabitants] ne se sont pas gênés pour déchirer notre illustre royaume. Leur avidité de jadis est aujourd'hui remplacée par la crainte de rivaux supérieurs. C'est le moment de passer à l'action."
 SIA_recover_indochina: "Reconquérir l'Indochine"
 SIA_recover_indochina_desc: "Au siècle dernier, les [FRA.GetHabitants] se sont affairés à morceler notre pays, un peuple originaire de l'autre côté du monde, qui n'a absolument aucun droit de dicter notre conduite, et qui, pourtant, s'est accaparé nos territoires à grand renfort de canons. Mais en ce siècle nouveau, les [FRA.GetHabitants] ne sont plus la puissance qu'ils étaient. En ce siècle nouveau, nous sommes la puissance !"
 SIA_recover_indochina_tt: "Permet de lancer des guerres limitées sur les territoires de l'§YIndochine§!"
 SIA_demand_the_return_of_lost_territory: "Exiger la rétrocession des terres perdues"
 SIA_demand_the_return_of_lost_territory_desc: "Les [FRA.GetHabitants] ont montré leur main ; ils n'ont plus ni la puissance ni l'influence nécessaires pour conserver le contrôle de nos territoires. Ils ne sont pas en mesure de négocier nos demandes."
 SIA_demand_the_return_of_lost_territory_tt: "Nous allons demander aux propriétaires de l'§YIndochine§! et d'une partie [MAL.GetDuDelaDelNP] §Y[MAL.GetName]§! de nous céder les États suivants : §Y[1069.Getname]§!, §Y[1067.Getname]§!, §Y[741.Getname]§!, §Y[1068.Getname]§!, §Y[1061.Getname]§!, §Y[1064.Getname]§!, §Y[1065.Getname]§! et§Y[670.Getname]§!.\n\nFacteurs :\n-Puissance de combat supérieure de 30% par rapport à celle des propriétaires\n-Les propriétaires sont en guerre avec une grande puissance\n-Les propriétaires ne sont pas dans une faction\n-Les propriétaires sont la §YFrance de Vichy§!\n-Nous sommes dans une faction\n-Les propriétaires ne nous apprécient pas"
 SIA_the_greater_thai_empire: "Le Grand Empire thaïlandais"
 SIA_the_greater_thai_empire_available_trigger: "[ROOT.GetLeLaLNPCap] §Y[ROOT.GetName]§! contrôl[ROOT.GetEEntNP] tous les États de l'Indochine\nTous ces États possèdent un accommodement supérieur à §Y[?var:SIA_greater_thai_empire_compliance_requirement]%§!\n\nNécessite également : "
 SIA_the_greater_thai_empire_desc: "L'heure de notre avènement a sonné. Tout ce qui nous avait été retiré nous est enfin revenu et le peuple reconnaît à juste titre notre autorité sur le territoire. Ainsi donc, nous sommes désormais les dirigeants légitimes du Grand Empire thaïlandais."
 SIA_crack_down_of_foreign_merchants: "Réprimer les commerçants étrangers"
 SIA_crack_down_of_foreign_merchants_desc: "Le commerce intérieur est depuis longtemps influencé par des intérêts étrangers, ce qui a tendance à fragiliser notre économie nationale. Assurer notre sécurité financière commence par le contrôle de notre commerce. C'est le seul moyen de garantir notre prospérité et notre stabilité."
 SIA_royal_palace_bureau_directive_no_1523: "Directive du palais royal n°1523"
 SIA_royal_palace_bureau_directive_no_1523_desc: "Même la Couronne rejoint désormais l'engouement pour le nationalisme dans le pays ; elle demande à ce que chaque membre du palais royal cède 10% de ses revenus pour la modernisation de l'arsenal national."
 SIA_end_factionalism: "Fin du factionnalisme"
 SIA_end_factionalism_desc: "Les divergences d'opinions entre le département civil et militaire du Khana Ratsadon ne font que ralentir nos progrès depuis la révolution. Si nous parvenons à ranger ces deux factions derrière le gouvernement pendant un certain temps, nous pourrions alors les unifier en un parti unique, nous débarrassant par la même occasion de la menace d'un coup d'État."
 SIA_end_factionalism_available_tt: "Le §Ydépartement civil§! et le §Ydépartement militaire§! sont au §GSoutien total§! pour §Y270§! jours consécutifs"
 SIA_end_factionalism_tt: "La rivalité entre les factions du Khana Ratsadon est terminée :\n   Les départements §Ycivil§! et §Ymilitaire§! sont devenus le §GParti populaire uni§!\n   Gain de l'esprit national §Y$idea_SIA_unified_khana_ratsadon$§!"
 SIA_turn_off_the_khana_ratsadon: "Désactivation du Khana Ratsadon"
 SIA_factionalism_overcome: "Factionnalisme aboli"
 SIA_new_territories_administration: "Administration des nouveaux territoires"
 SIA_new_territories_administration_tt: "Donne accès aux décisions permettant de diriger les territoires de l'§YIndochine§!, augmentant leur accommodement, leur industrie et leurs fortifications."
 SIA_new_territories_administration_desc: "Reprendre le contrôle de nos territoires perdus n'est que le début. Il faut désormais prouver à ceux qui les habitent que nous serons bien meilleurs que les dirigeants précédents. Déployons un programme exhaustif pour augmenter le niveau de vie de tous les citoyens afin qu'ils retrouvent le seuil d'égalité qui nous tient tant à cœur dans le pays."
 SIA_new_territories_administration_available_trigger: "N'importe quel État de l'§YIndochine§!\n   Sous le contrôle de : §Y[ROOT.GetName]§!"
 SIA_industrialization_drive: "Campagne d'industrialisation"
 SIA_industrialization_drive_desc: "Depuis des générations, l'unique richesse produite par les villages ruraux [ROOT.GetAdjMP] provient des rizières. Le monde de demain ne se cultive pas dans les champs ; il se manufacture dans les usines. Si nous tenons à préserver notre indépendance parmi les grandes puissances mondiales, nous devons faire de notre royaume agraire une nation industrielle."
 SIA_industrialization_drive_trigger: "Le §YKhana Ratsadon§! est actif"
 SIA_asian_financial_compact: "Le contrat financier asiatique"
 SIA_asian_financial_compact_desc: "Le capital européen continue d'inonder le marché asiatique, plaçant notre économie à la merci des puissances étrangères. Mettons en place des arrangements financiers avec nos voisins afin d'élargir nos options de crédits et d'investissements tout en conservant notre indépendance."
 SIA_revision_of_unequal_treaties: "Revoir les traités inégaux"
 SIA_revision_of_unequal_treaties_desc: "Les accords du siècle dernier ont été signés sous la contrainte, accordant aujourd'hui encore des privilèges intolérables aux nations étrangères. Il est temps d'abroger ces traités unilatéraux et de rétablir l'autorité [ROOT.GetAdjFS] sur notre commerce, notre système judiciaire et nos concessions."
 SIA_renegotiate_teak_control: "Renégocier le contrôle du teck"
 SIA_renegotiate_teak_control_desc: "Nos forêts du nord enrichissent des propriétaires privés, sans rien donner à l'État. Renégocions le contrôle du teck afin d'en tirer un revenu fixe, de réguler sa production, mais surtout d'allouer en priorité le bois [ROOT.GetAdjMS] au développement [ROOT.GetAdjMS]."
 SIA_a_fledgling_tobacco_industry: "Une industrie du tabac naissante"
 SIA_a_fledgling_tobacco_industry_desc: "Le tabac est un marché secondaire, très désorganisé et sporadique. En implémentant une protection basique et quelques investissements judicieux, nous pourrions en faire une véritable source de revenus, à la ville comme à la campagne."
 SIA_a_fledgling_tobacco_industry_tt: "Nous obtiendrons une §Yusine civile§! supplémentaire si nous possédons §Y$limited_exports$§! ou §Y$closed_economy$§!"
 SIA_all_weather_roads: "Routes en bitume"
 SIA_all_weather_roads_desc: "Aux premières fortes pluies, des dizaines de routes deviennent impraticables, isolant des provinces entières de la capitale et du commerce. Installons tout un réseau routier en bitume pour unir le royaume et permettre une circulation aisée en toute saison."
 SIA_the_bank_of_siam: "La banque du Siam"
 SIA_the_bank_of_siam_desc: "La croissance industrielle ne peut pas subsister sur des douanes ou des faveurs privées. L'État a besoin d'une Banque Nationale forte, un instrument qui lui permettrait de contrôler la circulation des crédits, de la monnaie et des finances en général."
 SIA_thai_rice_company: "Compagnie du riz thaïlandais"
 SIA_thai_rice_company_desc: "Le riz a toujours été le fondement de la culture [ROOT.GetAdjFS], mais son commerce est beaucoup trop sporadique, spéculatif et vulnérable aux pressions étrangères. Fondons une compagnie nationale du riz afin de confier à l'État son exportation et son prix. Faisons de nos rizières une force nationale !"
 SIA_uk_japan_focus_tt: "Permet de choisir entre [ENG.GetLeLaLNP] [ENG.GetName] et [JAP.GetLeLaLNP] [JAP.GetName] avec les effets suivants :\n\n§Y[ENG.GetFlag][ENG.GetName]§! :"
 SIA_japan_option_tt: "§Y[JAP.GetFlag][JAP.GetName]§!"
 SIA_send_bureaucrats_abroad: "Envoyer des bureaucrates à l'étranger"
 SIA_send_bureaucrats_abroad_desc: "Des ministères, des écoles, des services... tout ceci existe déjà à l'étranger. Envoyons nos bureaucrates dans les nations exemplaires afin d'importer toute cette expérience administrative."
 SIA_baht_stabilization_act: "Acte de stabilisation du baht"
 SIA_baht_stabilization_act_desc: "Une économie moderne demande une monnaie stable qui inspire confiance aux investisseurs. Stabiliser le baht apaisera les incertitudes commerciales et nous offrira une place de choix sur le marché international."
 SIA_siamese_development_cooperative: "Coopérative siamoise du développement"
 SIA_siamese_development_cooperative_desc: "Le capital privé est sur la réserve, mais l'État n'a pas les fonds pour aller de l'avant. Établissons une coopérative nationale du développement afin de mettre en commun les fonds des officiers, des négociants et des propriétaires fonciers pour réaliser des projets visant à améliorer l'économie."
 SIA_boon_rawd_brewery: "La brasserie Boon Rawd"
 SIA_boon_rawd_brewery_desc: "Une brasserie [ROOT.GetAdjFS] n'est pas qu'une simple fabrique de boisson. À l'instar de Boon Rawd, elle prouve que le capital national est capable de créer une industrie moderne."
 SIA_national_savings_bond: "Bon d'épargne nationale"
 SIA_national_savings_bond_desc: "La richesse d'une nation ne devrait pas moisir dans des coffres-forts lorsqu'il y a des routes et des usines à construire. En créant le bon d'épargne national, nous transformons les bas de laine des citoyens en investissement public."
 SIA_national_savings_bond_tt: "Donne l'esprit $SIA_national_savings_bond$, qui sera proportionnel à notre §Ylégislation sur la conscription§!. Plus elle est basse, plus les avantages seront conséquents, et vice-versa.\n\nAvec §Y$disarmed_nation$§!, nous obtenons :"
 SIA_national_savings_bond_scraping_the_barrel: "Avec §Y$scraping_the_barrel$§!, nous obtenons :"
 SIA_national_savings_bond_volunteer_only: "Avec §Y$volunteer_only$§!, nous obtenons :"
 SIA_national_savings_bond_limited_conscription: "Avec §Y$limited_conscription$§!, nous obtenons :"
 SIA_national_savings_bond_extensive_conscription: "Avec §Y$extensive_conscription$§!, nous obtenons :"
 SIA_national_savings_bond_service_by_requirement: "Avec §Y$service_by_requirement$§!, nous obtenons :"
 SIA_national_savings_bond_all_adult_serve: "Avec §Y$all_adults_serve$§!, nous obtenons :"
 SIA_national_savings_bond_current: "Notre législation actuelle nous octroierait : "
 SIA_deficit_spending: "Déficit budgétaire"
 SIA_deficit_spending_desc: "Une comptabilité ordinaire ne nous suffira pas à ériger une économie moderne avant que le monde hostile nous engloutisse. L'État va devoir dépenser plus qu'il ne gagne, investissant dans les travaux publics et l'approvisionnement pour amorcer la croissance industrielle."
 SIA_deficit_spending_tt: "À l'expiration de l'esprit, nous obtenons :"
 SIA_acquire_light_tools: "Acquérir des outils légers"
 SIA_acquire_light_tools_desc: "Avant de produire de grandes machines, commençons par maîtriser les bases de l'industrie. Importons des outils légers et tout l'attirail nécessaire à un atelier pour démultiplier les usines à travers tout le territoire [ROOT.GetAdjMS]."
 SIA_railway_and_port_extensions: "Agrandissement des ports et des chemins de fer"
 SIA_railway_and_port_extensions_desc: "Le riz, le bois ou encore l'étain ne sont d'aucune valeur s'ils ne peuvent pas atteindre les marchés. Développons les voies ferrées et agrandissons nos ports afin d'ouvrir les provinces au commerce national, mais surtout international."
 SIA_mechanization_of_agriculture: "Mécanisation de l'agriculture"
 SIA_mechanization_of_agriculture_desc: "La majorité des ouvriers sont encore coincés dans les champs, laissant peu de main-d'œuvre libre pour l'industrie. Introduisons de l'outillage moderne dans nos fermes afin d'accroître les récoltes et de libérer des mains pour les usines."
 SIA_irrigation: "Irrigation"
 SIA_irrigation_desc: "La fortune d'un paysan monte et descend au rythme des crues et des sécheresses. Avec un système d'irrigation avancé, les récoltes seront toujours assurées et les terres arables plus nombreuses. Nos campagnes deviendront un pilier du développement national."
 SIA_siam_cement_group: "Cimenterie [ROOT.GetAdjFS]"
 SIA_siam_cement_group_desc: "Ayant vu le jour grâce au parrainage royal, la cimenterie [ROOT.GetAdjFS] figure aujourd'hui parmi les compagnies les plus éminentes de la nation. Si le gouvernement y apportait son soutien financier, nous pourrions faire de cette société domestique la clé de voûte de notre industrie et bâtir, littéralement, un avenir solide pour le pays."
 SIA_chemical_imports: "Importations d'engrais"
 SIA_chemical_imports_desc: "L'agriculture moderne et l'industrie ont besoin de composés que nous ne pouvons pas encore produire en quantité suffisante. Importons nos engrais, nos médicaments, nos teintures et autres adjuvants tant que nous ne pourrons pas assurer leur production."
 SIA_chemical_imports_tt: "Ajoute §G1§! §Yusine civile§! hors carte si l'opinion est supérieure à §Y[?var:ROOT.SIA_chemical_imports_opinion_threshold]§! à l'achèvement de cette priorité."
 INS_chemical_imports_stolen_tt: "Ajoute §G[?var:ROOT.INS_guns_from_seek_help_focus]§! unités de matériel d'infanterie si l'opinion est supérieure à §Y75§! à l'achèvement de cette priorité."
 SIA_foreign_currency_exchange: "Échange de devises étrangères"
 SIA_foreign_currency_exchange_desc: "L'industrialisation exige de la machinerie, des médicaments et du carburant étrangers. Malheureusement, nos fonds ne sont pas suffisants. Mettons en place un système d'échange de devises afin d'orienter les fonds étrangers vers les industries capitales pour l'État."
 SIA_farmers_into_the_city: "Des paysans dans la ville"
 SIA_farmers_into_the_city_desc: "Une économie moderne ne peut pas reposer uniquement sur des villageois. L'industrialisation a besoin de main-d'œuvre, ainsi le gouvernement doit encourager l'exode rural pour peupler nos villes."
 SIA_textile_mills: "Usines textiles"
 SIA_textile_mills_desc: "Le tissu est plus qu'une commodité : c'est une nécessité. Pourtant, nous importons la majorité de nos stocks. Ouvrons des usines textiles grâce à la main-d'œuvre rurale, afin que la nation [ROOT.GetAdjFS] se dote d'une des industries basiques modernes."
 SIA_public_credit: "Dette publique"
 SIA_public_credit_desc: "Les négociants, les agriculteurs et les industriels sont très souvent limités par l'accès au capital. Étendons la dette publique : le gouvernement doit investir là où les fonds privés hésitent afin d'encourager le développement de secteurs négligés."
 SIA_public_credit_trigger: "$idea_SIA_public_credit_debt$ est active depuis au moins §Y180 jours§!"
 SIA_a_modern_economy: "Une économie moderne"
 SIA_a_modern_economy_desc: "La société agraire ne peut pas disparaître en un jour, néanmoins il faut s'en détourner progressivement, pour l'avenir [ROOT.GetAdjMS]. Les banques, les écoles, les usines et les infrastructures dominent désormais le paysage économique, comme toute nation moderne qui se respecte."
 SIA_reduction_of_agricultural_yield_taxes: "Réduction de l'impôt aux revenus agricoles"
 SIA_reduction_of_agricultural_yield_taxes_tt: "Réduit les §Ybiens de consommation§! de $idea_SIA_agricultural_tax_reduction$ de §Y[?var:SIA_agricultural_tax_reduction_cg_decrease_rate|%]§! chaque mois, et augmente la §Ystabilité§! de §Y[?var:SIA_agricultural_tax_reduction_stability_gain|%]§! chaque mois jusqu'à ce que le malus des §Ybiens de consommation§! atteigne §Y0%§!\n\nLorsque l'esprit national est retiré, gain de :\n"
 SIA_reduction_of_agricultural_yield_taxes_desc: "On ne peut pas demander à la paysannerie de nourrir le royaume, contribuer à la richesse de l'État et tenir le cap en toutes circonstances. Réduisons l'impôt sur les revenus agricoles afin d'offrir une marge de manœuvre aux zones rurales, mais surtout renforcer l'approbation de la couronne à la campagne et encourager un accroissement de la production."
 SIA_fuel_oil_act: "Acte sur le fioul"
 SIA_fuel_oil_act_desc: "De nos jours, le transport, l'industrie, mais aussi la défense, dépendent du carburant, pourtant il reste difficile de s'en procurer. Un acte sur le fioul pourrait recentrer la gestion de cette ressource sous l'État afin de limiter les gaspillages."
 SIA_siam_electricity_company: "Compagnie d'électricité du Siam"
 SIA_siam_electricity_company_desc: "Aucune économie moderne ne peut tenir la cadence sans l'énergie du futur. Soutenons du mieux possible la compagnie d'électricité du Siam pour développer la production et la distribution de courant dans toutes les villes et tous les ateliers de la nation."
 SIA_revise_the_taxation_system: "Réviser le système d'imposition"
 SIA_revise_the_taxation_system_desc: "Le système d'imposition actuel n'a pas été pensé pour préparer l'État aux épreuves qui l'attendent. Une modernisation des formalités rendrait la collecte plus équitable, plus efficiente et plus ordonnée pour la nation."
 SIA_census_the_hill_tribes: "Recenser les tribus des collines"
 SIA_census_the_hill_tribes_desc: "Les hautes terres sont hors d'atteinte de l'administration, des impôts et de toutes les commodités modernes. Un recensement aiderait le gouvernement à mieux comprendre ces régions pour les gérer efficacement et inclurait ses populations dans la nation."
 SIA_increase_rice_exports: "Augmenter l'exportation de riz"
 SIA_increase_rice_exports_desc: "Le riz demeure notre source de revenus étrangers la plus fiable. Développons les exportations tant que le marché est en demande, puis construisons des réserves pour financer des importations stratégiques et préparer la trésorerie aux menaces qui approchent."
 SIA_pad_thai: "Pad thaï"
 SIA_pad_thai_desc: "Les usines et les ministères mènent les nations modernes vers le progrès, mais ce sont les coutumes qui unissent les citoyens. Mettons en avant ce plat à base de nouilles de riz et d'ingrédients du terroir siamois, afin de soutenir nos producteurs nationaux et limiter notre dépendance aux aliments importés."
 SIA_rice_husk_steam_turbines: "Turbines à vapeur à balle de riz"
 SIA_rice_husk_steam_turbines_desc: "Les étrangers y voient peut-être un déchet, mais nous, en ces temps de grande nécessité, nous y trouvons un trésor ; les balles de riz sont un combustible idéal pour alimenter nos machines à vapeur, ce qui nous permettra de réduire nos importations de charbon ou de pétrole."
 SIA_domestic_tin_smelters: "Fonderies d'étain domestiques"
 SIA_domestic_tin_smelters_desc: "Ne nous contentons plus de simplement extraire les minerais et de les expédier tels quels à l'étranger ; ouvrons des fonderies d'étain pour donner une valeur ajoutée à notre production et conserver une partie de ce métal indispensable au commerce et à la guerre."
 SIA_use_ships_as_generators: "Navires générateurs"
 SIA_use_ships_as_generators_tt: "Placer nos §Ynavires capitaux§! dans des §Yports d'États nationaux§! nous octroie un avantage de §G-2%§! de consommation d'énergie d'usine par §Ynavire capital§!, pour un maximum de §G-15%§!.\n\nSi ces navires quittent le port, leur avantage sera perdu. Dès qu'un autre navire capital entre dans ces ports, l'avantage est retrouvé."
 SIA_use_ships_as_generators_desc: "Même les bâtiments vétustes peuvent encore servir la nation ; faisons-en des centrales électriques flottantes afin de fournir un courant d'urgence aux ports et aux industries côtières tout en ménageant nos réserves de carburant et notre infrastructure."
 SIA_diversity_foreign_reserves: "Diversifier le portefeuille de devises étrangères"
 SIA_diversity_foreign_reserves_desc: "Il serait irresponsable de miser toutes nos économies sur une seule devise étrangère. Diversifions notre portefeuille pour limiter les pertes de capitale et nous offrir une meilleure marge de manœuvre, au commerce comme en diplomatie."
 SIA_diversity_foreign_reserves_tt: "Ajoute §G2§! §Yusines militaires§! hors carte supplémentaires en cas de guerre.\nAjoute §G8§! unités de production d'acier dans un État national aléatoire en cas de guerre."
 SIA_exclusivity_resource_contract: "Contrat de ressources exclusif"
 SIA_exclusivity_resource_contract_desc: "Un unique partenaire étranger permet un capital stable ainsi que des achats garantis en échange d'un accès privilégié à nos ressources. Un tel contrat dynamisera à coup sûr notre développement, même si nous mettons toute notre confiance entre les mains d'une seule nation."
 SIA_maintain_resource_independence: "Préserver l'indépendance sur les ressources"
 SIA_maintain_resource_independence_desc: "Les contrats étrangers représentent une rentrée de fonds immédiate, mais elle se fait au prix de notre souveraineté. Gardons la main sur nos ressources ; c'est à nous de décider avec qui nous les échangerons, pas aux puissances étrangères."
 SIA_kasetsart_university: "Université Kasetsart"
 SIA_kasetsart_university_desc: "Si nous voulons optimiser l'agriculture, il faut que la science s'en mêle. L'université Kasetsart formera des agronomes, des vétérinaires et des experts mécaniques pour moderniser nos campagnes."
 SIA_mahidol_university: "Université Mahidol"
 SIA_mahidol_university_desc: "Un État moderne doit se doter de docteurs, de chercheurs et d'administrateurs. L'université Mahidol saura former les têtes pensantes de demain qui guideront nos réformes nationales."
 SIA_silpakorn_university: "Université Silpakorn"
 SIA_silpakorn_university_desc: "TODO_CM"
 SIA_contingency_funds: "Fonds de prévoyance"
 SIA_contingency_funds_desc: "La prospérité en temps de paix ne vaut rien si l'État n'est pas préparé à faire face à la moindre crise. Mettons de côté un fonds de prévoyance : en cas de blocus, de mauvaises récoltes ou de guerre subite, nous pourrons continuer d'avancer sereinement."
 SIA_contingency_funds_tt: "Nous allons épargner un fonds de prévoyance en temps de paix. Durant ce temps, nous obtiendrons un §Yfacteur de biens de consommation§! modéré.\n\nEn temps de guerre, nous pourrons avoir recours à ce fonds, ce qui nous octroiera un avantage de production conséquent.\nCe fonds durera plus ou moins longtemps en fonction de la période d'épargne."
 SIA_prepare_for_the_next_blockade: "Préparation du prochain blocus"
 SIA_prepare_for_the_next_blockade_desc: "Si un jour nous ne pouvons plus emprunter la mer, nous serons totalement coupés des marchés, des imports et du carburant. Préparons-nous dès maintenant à un éventuel blocus : faisons des réserves, élaborons des plans d'urgence et mettons au point des substituts."
 SIA_domestic_arms_industry: "Industrie intérieure de l'armement"
 SIA_domestic_arms_industry_desc: "Un royaume qui importe la totalité de ses fusils et obus est un royaume menacé. Une industrie de l'armement domestique, même balbutiante, gagera notre sécurité nationale et assurera le fonctionnement de notre armée lorsque les chaînes d'approvisionnement étrangères s'interrompront."
 SIA_war_material_substitutions: "Substitution de matériaux"
 SIA_war_material_substitutions_desc: "En temps de blocus, le matériau idéal est le matériau auquel nous avons accès. Trouvons des substituts aux différents métaux, aux composés chimiques et autres produits importés afin de garantir le fonctionnement de notre société, même lorsque nous serons coupés du monde."
 SIA_royal_thai_ordnance_factory: "Usine d'armement de l'armée royale"
 SIA_royal_thai_ordnance_factory_desc: "Un État sécurisé ne peut pas se contenter d'armes importées et de quelques ateliers de fortune. Les fabriques d'armement réunissent les compétences, la machinerie et la supervision nécessaires à une production militaire de masse sur notre territoire, le tout sous la supervision de la couronne."
 SIA_built_to_withstand_every_flame: "À l'épreuve du feu"
 SIA_built_to_withstand_every_flame_desc: "L'usine ravagée par les flammes dans la nuit ne peut servir la nation au matin. Construisons nos entrepôts, nos ateliers et nos usines de manière dispersée avec des normes anti-incendie. De ce fait, toute tentative de sabotage ou de bombardement sera quasiment inefficace."
 SIA_the_army_of_siam: "L'armée du Siam"
 SIA_the_army_of_siam_desc: "L'ancienne organisation de nos forces armées ne répond plus aux exigences de notre époque. Si [ROOT.GetLeLaLNP] [ROOT.GetName] veu[ROOT.GetTLentNP] défendre [ROOT.GetSaLeurNP] souveraineté et faire valoir [ROOT.GetSesLeursNP] intérêts à l'étranger, nous devons former une nouvelle armée moderne, équipée, entraînée et organisée pour les guerres qui se dessinent aux quatre coins du monde."
 SIA_plan_for_a_short_war: "Planifier une guerre éclair"
 SIA_plan_for_a_short_war_desc: "Nos ressources sont limitées et nos ennemis trop nombreux. [ROOT.GetLeLaLNPCap] [ROOT.GetName] ne peu[ROOT.GetTVentNP] pas se permettre une guerre d'usure. Si la guerre doit éclater, elle doit être rapide et finie avant que l'ennemi ne puisse rassembler ses forces."
 SIA_intermediate_war_preparation: "Planifier une guerre intermédiaire"
 SIA_intermediate_war_preparation_desc: "Il serait dangereux de se préparer uniquement pour une guerre éclair, mais ce serait tout aussi déraisonnable de ne se préparer qu'à un conflit sans fin. Une approche équilibrée permettra [ROOT.GetAuAlaAlNP] [ROOT.GetName] de frapper avec force, tout en gardant l'endurance nécessaire pour faire face à un ennemi plus coriace."
 SIA_prepare_for_a_long_war: "Planifier une longue guerre"
 SIA_prepare_for_a_long_war_desc: "Les grandes puissances sont capables de décider de l'issue d'une guerre en l'espace de quelques mois, mais les pays moins forts se retrouvent souvent englués dans des conflits pour de longues années. Par conséquent, nous devons préparer l'armée, l'industrie et les transports [ROOT.GetAdjMP] à une campagne longue et éprouvante dans laquelle la patience et la résilience sont aussi importantes que le courage."
 SIA_specialized_warfare: "Guerre de spécialités"
 SIA_specialized_warfare_desc: "Le terrain de notre région n'est pas favorable à une armée uniforme. Les montagnes, la jungle et les cours d'eau exigent des compétences différentes. En formant des troupes spécialisées, nous pourrons veiller à ce que [ROOT.GetLeLaLNP] [ROOT.GetName] dispos[ROOT.GetEEntNP] d'une force adaptée en toutes circonstances."
 SIA_artillery_reigns_supreme: "Supériorité de l'artillerie"
 SIA_artillery_reigns_supreme_desc: "Aujourd'hui, le courage ne suffit plus à remporter des batailles. Le canon règne encore et toujours sur le champ de bataille, idéal pour briser les points de résistance, contrer les assauts et ouvrir la voie à l'infanterie. Si nous voulons gagner, la puissance de feu [ROOT.GetAdjFS] doit être aussi dominante que précise."
 SIA_yield_the_air_war: "Intensifier la guerre aérienne"
 SIA_yield_the_air_war_desc: "Nous ne pouvons pas espérer rivaliser avec les grandes puissances dans les airs. Plutôt que de gaspiller de précieuses ressources dans une bataille perdue d'avance, nous devrions renforcer nos défenses anti-aériennes et empêcher les avions ennemis de s'en prendre à nos hommes et à nos villes en toute impunité."
 SIA_the_thunder_at_the_gates: "L'orage gronde à nos portes"
 SIA_the_thunder_at_the_gates_desc: "Il existe des forteresses que les canons ordinaires ne peuvent ébranler, et qui nécessitent une impressionnante force de frappe. L'artillerie lourde, les engins de siège et les canons sur voie ferrée donneront [ROOT.GetAuAlaAlNP] [ROOT.GetName] la puissance nécessaire pour enfoncer les portes des ennemis qui feront l'erreur de [ROOT.GetLeLaFNP] sous-estimer."
 SIA_night_time_training: "Entraînement nocturne"
 SIA_night_time_training_desc: "Les assauts inconsidérés en plein jour sont du pain béni pour un ennemi bien préparé. En formant nos hommes aux tactiques d'infiltration, de déplacement et d'attaque dans l'obscurité, nous pourrons prendre l'initiative quand l'ennemi sera désorienté et moins à même de riposter."
 SIA_steel_arteries: "Artères d'acier"
 SIA_steel_arteries_desc: "Aucune armée ne peut aller bien loin sans voies ferrées ni routes pour l'approvisionner. Nous devons renforcer les artères d'acier de la nation, afin que les troupes, les ravitaillements et les canons puissent être acheminés rapidement vers les frontières menacées. La sécurité militaire et le développement national vont de pair."
 SIA_prepare_northern_infrastructure_for_war: "Préparer les infrastructures du Nord à la guerre"
 SIA_prepare_northern_infrastructure_for_war_desc: "Les approches par le nord seront essentielles lors des affrontements avec la Birmanie et ses soutiens. Nous devrons développer les routes, les voies ferrées et les dépôts de cette région, afin de permettre aux forces [ROOT.GetAdjFP] de progresser ou de résister sans tarder."
 SIA_unconventional_tank_construction: "Construction de chars non conventionnelle"
 SIA_unconventional_tank_construction_desc: "Nous ne pouvons pas imiter en tout point les programmes d'armement des grandes puissances. Si [ROOT.GetLeLaLNP] [ROOT.GetName] veu[ROOT.GetTLentNP] déployer des chars, nous devons adopter des méthodes de construction moins coûteuses et plus adaptées, afin de privilégier la quantité et l'utilité au détriment de la grandeur."
 SIA_conventional_tank_construction: "Construction de chars conventionnelle"
 SIA_conventional_tank_construction_desc: "Les blindés sont devenus indispensables dans les conflits modernes, et nos solutions de fortune ne nous mèneront pas bien loin. Par conséquent, nous devrions mettre en place une industrie spécialisée basée sur des principes solides, des modèles standardisés et des méthodes de production fiables et dignes d'une armée moderne."
 SIA_reverse_engineer_allied_tanks: "Rétro-ingénierie des chars alliés"
 SIA_reverse_engineer_allied_tanks_desc: "D'autres ont déjà payé les frais de l'expérimentation. Les chars capturés et les machines importées peuvent être démontés, étudiés et imités. En s'inspirant des modèles étrangers, [ROOT.GetLeLaLNP] [ROOT.GetName] pourr[ROOT.GetAOntNP] concevoir [ROOT.GetSonLeurNP] propre corps de blindés."
 SIA_tankettes: "Chenillettes"
 SIA_tankettes_desc: "Légères, bon marché et faciles à produire, les chenillettes ne peuvent peut-être pas décider à elles seules de l'issue des combats, mais elles peuvent servir à des missions de reconnaissance, de guerre coloniale et de soutien à l'infanterie. Pour une nation aux moyens modestes, ces petits véhicules blindés offrent une approche concrète de la guerre mécanisée."
 SIA_jungle_armor: "Blindage jungle"
 SIA_jungle_armor_desc: "Les jungles de notre région ne sont pas adaptées aux énormes machines conçues pour les plaines d'Europe. Si [ROOT.GetLeLaLNP] [ROOT.GetName] veu[ROOT.GetTLentNP] s'équiper de blindés, ceux-ci devront être adaptés aux sentiers étroits, aux terrains difficiles et aux climats hostiles, privilégiant ainsi la mobilité au poids."
 SIA_mountain_tanks: "Chars de montagne"
 SIA_mountain_tanks_desc: "L'infanterie ne peut pas s'occuper seule des collines escarpées et des cols de montagne. En développant des véhicules blindés compacts adaptés aux terrains accidentés, nous pourrons permettre à nos armées d'acheminer leur puissance de feu vers des régions normalement inaccessibles aux chars de combat."
 SIA_reluctant_submission: "Soumission réticente"
 SIA_reluctant_submission_desc: "Si [ROOT.GetLeLaLNP] [ROOT.GetName] doi[ROOT.GetTVentNP] faire face à l'invasion d'un ennemi plus puissant, il peut arriver que toute résistance soit totalement futile. Ce n'est jamais facile de se soumettre, mais il est parfois préférable pour un gouvernement de s'incliner pour préserver la nation de la destruction et attendre des conditions plus favorables."
 SIA_reluctant_submission_trigger: "Cette priorité sera automatiquement atteinte si nous sommes attaqués et que nous choisissons l'option §YSoumission§!."
 SIA_reluctant_submission_tt: "Nous allons pacifier une puissance mondiale hostile, à condition de lui imprimer de l'argent.\nNotre §Yfacteur d'usines de biens de consommation§! va augmenter de §Y[?idea_SIA_printing_money_monthly_change|%]§! par mois, pour un maximum de §Y[?idea_SIA_printing_money_monthly_change_max|%]§!.\n\nAdopter la priorité §Y$SIA_thai_rice_company$§! réduira ce taux de §G50%§!.\n\nAdopter la priorité §Y$SIA_demand_repatriation$§! annule la demande d'impression monétaire."
 SIA_seri_thai: "Forces thaïlandaises libres"
 SIA_seri_thai_desc: "Se soumettre ne signifie pas nécessairement abandonner l'esprit national. Derrière l'occupation et la soumission, un mouvement clandestin peut se mettre en place pour défendre la cause de l'indépendance, recueillir des renseignements et préparer le moment où [ROOT.GetLeLaLNP] [ROOT.GetName] se relèver[ROOT.GetAOntNP]."
 SIA_contact_the_south_east_asia_command: "Contacter le commandement de l'Asie du Sud-Est"
 SIA_contact_the_south_east_asia_command_desc: "Pour que la résistance ne se résume pas à des actes de bravoure, elle doit s'inscrire dans une stratégie plus large. En établissant le contact avec le commandement des Alliés en Asie du Sud-Est, les patriotes [ROOT.GetDuDelaDelNP] [ROOT.GetName] trouveront du soutien, des ravitaillements et une place dans la lutte mondiale."
 SIA_broadcast_weather_reports_to_the_allies: "Transmettre des bulletins météo aux alliés"
 SIA_broadcast_weather_reports_to_the_allies_desc: "Les cieux et les mers de la région sont autant régis par les conditions météorologiques que par les armées et les flottes. Grâce à [ROOT.GetSesLeursNP] rapports fiables, [ROOT.GetLeLaLNP] [ROOT.GetName] pourr[ROOT.GetAOntNP] aider les Alliés dans leur planification, protéger leurs opérations de toute mauvaise surprise, et faire de notre pays un allié discret mais précieux dans cette guerre."
 SIA_american_investment_aid: "Aide d'investissement américain"
 SIA_american_investment_aid_desc: "Les États-Unis possèdent bien plus de richesses que ce que l'on peut trouver dans notre propre région. Si nous parvenons à obtenir leur aide dans nos opérations clandestines et nationales, [ROOT.GetLeLaLNP] [ROOT.GetName] aur[ROOT.GetAOntNP] les moyens matériels pour surmonter les difficultés et se préparer à la libération."
 SIA_thai_students_in_the_oss: "Inclure des étudiants thaïlandais dans l'OSS"
 SIA_thai_students_in_the_oss_desc: "Une nouvelle génération de jeunes patriotes peut être formée aux méthodes d'espionnage, de sabotage et de guerre irrégulière. En envoyant des étudiants thaïlandais de confiance dans les services de renseignement alliés, nous formerons des personnes compétentes pour la guerre secrète à venir."
 SIA_prepare_to_drop: "Préparation au chambardement"
 SIA_prepare_to_drop_desc: "Quand viendra l'heure de la libération, les Alliés voudront peut-être arriver par le ciel. Par conséquent, nous devons apprendre à identifier les terrains d'atterrissage, préparer des contacts et organiser des réseaux de soutien pour accueillir et rediriger les forces aéroportées là où elles seront les plus utiles."
 SIA_unseat_the_government: "Faire tomber le gouvernement"
 SIA_unseat_the_government_desc: "Nous ne pouvons pas tolérer plus longtemps un régime qui a soumis [ROOT.GetLeLaLNP] [ROOT.GetName] à une domination étrangère. Par le biais de la résistance, de manigances et d'actions opportunes, nous pourrons nous débarrasser de ceux qui ont compromis l'avenir de la nation et restaurer un gouvernement plus digne du Siam."
 SIA_unseat_the_government_tt: "Les [ROOT.GetHabitants] vont quitter leur faction pour changer de camp et rejoindre les §YAlliés§!.\n\nLes loyalistes vont s'opposer à ce changement et menacer de déclencher une guerre civile.\n\nSi notre soutien est §Ysupérieur à 80%§!, nous renverserons le gouvernement sans déclencher de guerre civile. Pour chaque général converti, nous engrangeons §Y5%§! de soutien, en plus de notre soutien démocratique.\n\nNotre général converti nous octroie §Y[?var:SIA_seri_thai_cw_scale|%]§! de soutien, et notre soutien démocratique est de §Y[?var:party_popularity@democratic|%]§!"
 SIA_choose_new_leader_tt: "Maintenant que l'ancien régime est renversé, il faut nommer une figure qui assurera la direction du gouvernement."
 SIA_the_phayap_army: "L'armée Phayap"
 SIA_the_phayap_army_desc: "Si nous choisissons le parti de l'envahisseur, alors nos armées devront jouer un rôle dans le nouvel ordre de la guerre. Un poste de commandement chargé des opérations menées à l'ouest et au nord permettra [ROOT.GetAuAlaAlNP] [ROOT.GetName] d'avancer aux côtés de [ROOT.GetSonLeurNP] puissant allié et de poursuivre [ROOT.GetSesLeursNP] propres objectifs."
 SIA_securing_the_rubber_islands: "Protéger les îles caoutchouc"
 SIA_securing_the_rubber_islands_desc: "Le caoutchouc est essentiel dans la guerre moderne, puisqu'on en trouve dans les pneus, les joints d'étanchéité et bon nombre d'éléments d'un conflit mécanisé. Par conséquent, les territoires au sud de notre pays, qui en sont riches, représentent à la fois une opportunité et une nécessité. Nous devrions les sécuriser avant qu'ils ne nous échappent."
 SIA_breaking_the_burmese_line: "Briser la ligne birmane"
 SIA_breaking_the_burmese_line_desc: "La Birmanie constitue une barrière entre nos ambitions et les terres au-delà. Pour faire leurs preuves, les armées [ROOT.GetAdjFP] devront percer les lignes ennemies grâce à une détermination inébranlable, une planification rigoureuse et un usage concentré de la force."
 SIA_pacific_war: "La guerre du Pacifique"
 SIA_pacific_war_desc: "Le conflit en Asie de l'Est se rapproche à grands pas. La guerre du Pacifique déterminera le destin de toutes les nations de notre région, et [ROOT.GetLeLaLNP] [ROOT.GetName] devr[ROOT.GetAOntNP] décider de la place qu'[Root.GetIlElleNP] occuper[ROOT.GetAOntNP] dans ce conflit : suiveur, allié ou victime."
 SIA_joint_asian_military_command: "Commandement conjoint de l'armée asiatique"
 SIA_joint_asian_military_command_desc: "Nos efforts seront davantage récompensés si nous les coordonnons avec ceux de nos partenaires régionaux. Un commandement conjoint est l'assurance d'une plus grande efficacité, d'une meilleure planification et d'une orientation commune pour les campagnes qui risqueraient sans cela d'être affaiblies par la rivalité et la confusion."
 SIA_demand_repatriation: "Demande de rapatriement"
 SIA_demand_repatriation_desc: "Ceux qui sont entrés dans notre pays en prétextant être dans le besoin ont une dette envers [ROOT.GetLeLaLNP] [ROOT.GetName]. Quand notre situation sera meilleure, nous exigerons la restitution de ce qui nous a été pris et nous ferons pression sur l'occupant pour rembourser les coûts liés à son intrusion."
 SIA_standing_our_ground: "Tenir bon"
 SIA_standing_our_ground_desc: "Il arrive un moment où le repli et la négociation ne font que renforcer l'humiliation. [ROOT.GetLeLaLNPCap] [ROOT.GetName] devr[ROOT.GetAOntNP] montrer qu'[ROOT.GetIlElleNP] a toujours la volonté de se battre et de repousser ceux qui prétendent pouvoir dicter notre destin avec le doigt sur la gâchette."
 SIA_standing_our_ground_trigger: "Cette priorité sera automatiquement atteinte si nous sommes attaqués et que nous choisissons l'option §YRésistance§!."
 SIA_ask_for_the_release_of_american_commodities: "Demander la libération des produits américains"
 SIA_ask_for_the_release_of_american_commodities_desc: "Les magasins, les machines et les produits américains donneront à notre nation la bouffée d'oxygène dont elle a besoin. Une diplomatie subtile nous permettra de demander cette aide afin de pallier les pénuries et de renforcer notre base matérielle dans le cadre de l'effort de guerre."
 SIA_japanese_fighters: "Chasseurs japonais"
 SIA_japanese_fighters_desc: "Bien que notre industrie aéronautique reste légère, les avions étrangers pourront nous aider dans ce domaine. Grâce aux chasseurs japonais, les [ROOT.GetHabitants] auront au moins une idée de la puissance aérienne moderne, même dans les limites imposées par les faiblesses de notre industrie."
 SIA_get_off_our_shores: "Hors de nos littoraux !"
 SIA_get_off_our_shores_desc: "La présence de troupes étrangères sur le sol siamois est un affront inexcusable. Que ce soit par la force ou sous la pression des événements à l'étranger, nous devons insister pour que l'envahisseur quitte notre littoral et restaurer la dignité [ROOT.GetDuDelaDelNP] [ROOT.GetName].\n\nCe sont des lâches, comme tous les hommes cruels. Et maintenant, déguerpissez de nos côtes."
 SIA_singaporean_reinforcements: "Renforts de Singapour"
 SIA_singaporean_reinforcements_desc: "Les conflits en Malaisie et au-delà sont indissociables de notre propre sécurité. Les renforts provenant des forces réunies autour de Singapour pourraient consolider nos lignes, élargir notre coopération avec les Alliés et nous rassembler autour d'un objectif commun."
 modify_SIA_directorate_of_aeronautical_engineering: "Modifie §YDirectoire d'ingénierie aéronautique§! ainsi :"
 SIA_aid_for_resources: "Aide en ressources"
 SIA_aid_for_resources_desc: "Notre nation dispose de ressources que les puissances étrangères désirent, mais manque d'outils pour les exploiter. Un échange réciproque d'aide contre du matériel garantira l'approvisionnement [ROOT.GetDuDelaDelNP] [ROOT.GetName], tout en veillant à ce que nos richesses contribuent à notre propre préservation."
 SIA_aid_for_resources_tt: "Nous allons demander aux [JAP.GetHabitants] de rejoindre la guerre en leur proposant en échange des droits sur le caoutchouc du §Y[724.GetName]§!"
 SIA_how_quickly_the_tables_turn: "Revirement de situation"
 SIA_how_quickly_the_tables_turn_desc: "Ceux qui considéraient autrefois [ROOT.GetLeLaLNP] [ROOT.GetName] comme une nation faible et soumise pourraient voir la situation s'inverser radicalement. La chance peut vite basculer en temps de guerre, et nous devons nous tenir prêts à saisir la moindre opportunité lorsque nos oppresseurs montrent des signes de faiblesse."
 SIA_how_quickly_the_tables_turn_trigger: "Nous avons été attaqués par un major qui a fini par capituler."
 SIA_royal_thai_navy: "Marine royale thaïlandaise"
 SIA_royal_thai_navy_desc: "La défense [ROOT.GetDuDelaDelNP] [ROOT.GetName] ne s'arrête pas au littoral. Nos côtes, nos fleuves et nos échanges maritimes exigent une flotte digne du royaume. En renforçant la Marine royale thaïlandaise, nous nous assurerons que le Siam reste maître de ses propres eaux."
 modify_royal_thai_navy: "Modifie §Y$idea_SIA_thai_royal_navy$§! ainsi :"
 SIA_direct_army_fundings_towards_the_navy: "Réorienter le financement de l'armée pour la marine"
 SIA_direct_army_fundings_towards_the_navy_desc: "L'armée s'est longtemps octroyé la part du lion dans les dépenses militaires, mais les besoins stratégiques [ROOT.GetDuDelaDelNP] [ROOT.GetName] ne se limitent pas au continent. En allouant des fonds à la marine, nous pourrons commencer à corriger ce déséquilibre et à protéger les mers qui abritent notre commerce et nos côtes."
 SIA_thonburi_class_coastal_defense_ship: "Bâtiment de défense littorale classe Thonburi"
 SIA_thonburi_class_coastal_defense_ship_desc: "Une flotte modeste peut toujours se montrer redoutable en s'adaptant aux conditions locales. La classe Thonburi offre [ROOT.GetAuAlaAlNP] [ROOT.GetName] un moyen de défense côtière efficace, combinant une puissance de feu respectable à un rôle adapté aux mers que nous devons protéger de toute urgence."
 SIA_acquire_submarines: "Acquérir des sous-marins"
 SIA_acquire_submarines_desc: "Les sous-marins permettent aux petites marines de frapper fort. Cachés sous les vagues, ils peuvent menacer les transports maritimes, dissuader des flottes plus importantes et compliquer toute manœuvre hostile contre nos côtes. C'est un atout non négligeable pour [ROOT.GetLeLaLNP] [ROOT.GetName]."
 SIA_submarine_day: "La journée du sous-marin"
 SIA_submarine_day_desc: "L'introduction de la guerre sous-marine dans notre flotte mérite la reconnaissance et l'enthousiasme de la nation. En célébrant cette branche de la marine, nous pourrons encourager le recrutement, rehausser le prestige et faire comprendre au peuple que le Siam entre dans une nouvelle ère navale."
 SIA_the_thonburi_dockyard_project: "Le projet de chantier naval de Thonburi"
 SIA_the_thonburi_dockyard_project_desc: "Une marine ne peut pas se contenter de coques importées. Si [ROOT.GetLeLaLNP] [ROOT.GetName] veu[ROOT.GetTLentNP] conserver et développer [ROOT.GetSesLeursNP] forces maritimes, [ROOT.GetIlElleNP] doi[ROOT.GetTVentNP] investir dans des chantiers navals, des ateliers et de la main-d'œuvre."
 SIA_expand_the_slipways: "Agrandir les cales sèches"
 SIA_expand_the_slipways_desc: "Nos installations actuelles sont trop étroites pour nos ambitions. En agrandissant les cales sèches, nous augmenterons notre capacité à construire et réparer des navires, renforçant ainsi l'ensemble de notre flotte."
 SIA_a_new_drydock: "Une nouvelle forme de radoub"
 SIA_a_new_drydock_desc: "Une maintenance navale approfondie nécessite un radoub moderne. Sans cela, l'entretien des plus grands navires sera lent, inefficace et dépendant d'une assistance étrangère. Une nouvelle forme de radoub donnera [ROOT.GetAuAlaAlNP] [ROOT.GetName] plus de maîtrise sur l'avenir de [ROOT.GetSaLeurNP] flotte."
 SIA_install_heavy_cranes_and_power_plant: "Construire des grues et des centrales"
 SIA_install_heavy_cranes_and_power_plant_desc: "La construction navale n'est pas qu'une question de bois et d'acier, mais aussi de machinerie et d'énergie. De grandes grues et une alimentation électrique fiable transformeront nos chantiers en véritables rouages de l'industrie moderne."
 SIA_establish_the_foundry_and_machine_shop: "Fonder la fonderie & machinerie"
 SIA_establish_the_foundry_and_machine_shop_desc: "Une marine souveraine requiert bien plus que des coques assemblées à partir de pièces importées. En fondant notre propre fonderie et notre machinerie, nous renforcerons les nerfs industriels qui permettront [ROOT.GetAuAlaAlNP] [ROOT.GetName] de fabriquer, façonner et réparer les éléments essentiels des navires de guerre."
 SIA_the_thonburi_arsenal: "L'arsenal de Thonburi"
 SIA_the_thonburi_arsenal_desc: "Un chantier naval digne de ce nom se doit d'avoir un arsenal. À Thonburi, cela permettra la fabrication et le stockage de canons navals, de munitions et d'équipements, rapprochant ainsi notre flotte de notre industrie nationale."
 SIA_focus_on_commercial_civilian_ships: "Priorité aux navires civils commerciaux"
 SIA_focus_on_commercial_civilian_ships_desc: "Tous les navires ne sont pas destinés au combat. Les navires marchands, les navires de transport et autres navires civils constituent le système circulatoire de l'économie nationale. En encourageant la construction navale marchande, [ROOT.GetLeLaLNP] [ROOT.GetName] favoriser[ROOT.GetAOntNP] à la fois [ROOT.GetSaLeurNP] prospérité et [ROOT.GetSaLeurNP] résilience en temps de guerre."
 SIA_empower_the_coastguard: "Renforcer les gardes-côtes"
 SIA_empower_the_coastguard_desc: "La flotte ne peut pas être partout à la fois, et des services plus légers sont plus à même de se charger de certaines missions de sécurité du littoral. Renforcer nos gardes-côtes permettra de protéger nos zones de pêche, de surveiller nos côtes et de libérer la flotte pour s'occuper de menaces plus importantes."
 SIA_river_patrols: "Patrouilles fluviales"
 SIA_river_patrols_desc: "Les fleuves [ROOT.GetDuDelaDelNP] [ROOT.GetName] sont à la fois des routes, des frontières et des axes vitaux. Les appareils de patrouille nous aideront à maintenir l'ordre, soutenir les garnisons locales et étendre la portée de l'État dans les régions où il serait trop long d'intervenir."
 SIA_sell_bangkok_dock_co: "Vendre la Bangkok Dock Company"
 SIA_sell_bangkok_dock_co_desc: "Le capital privé peut accomplir ce que l'administration de l'État accomplit trop lentement. En vendant la Bangkok Dock Company à des personnes compétentes, nous pourrons attirer les investissements, stimuler l'efficacité et rediriger les fonds publics vers des besoins militaires plus urgents."
 SIA_a_race_against_time: "Une course contre la montre"
 SIA_a_race_against_time_desc: "Notre marine est obsolète, sous-financée, et inadaptée à la guerre moderne. Les fonds devront être redirigés immédiatement vers la construction navale, la remise en état, la défense côtière et l'entraînement naval. L'horloge tourne plus vite que nos chantiers navals."
 SIA_a_race_against_time_tt: "À l'expiration de l'esprit, nous obtiendrons :"
 SIA_a_race_against_time_tt2: "pendant §Y280§! jours"
 #Tech
 the_thunder_at_our_gates_artillery: "L'orage gronde à nos portes"
 SIA_siamese_tankettes: "Chenillettes siamoises"
 SIA_siamese_tankettes_desc: "Notre armée s'est habituée à sa flotte de chenillettes légères. Elle sait désormais les entretenir convenablement sur le terrain, réduisant les coûts de maintenance."
 #Ideas
 idea_SIA_the_army_of_siam: "L'armée du Siam"
 idea_SIA_the_army_of_siam_tt: "Modifie §Y$idea_SIA_the_army_of_siam$§! ainsi :"
 idea_SIA_the_thunder_at_our_gates: "L'orage gronde à nos portes"
 idea_SIA_yielded_the_air_war: "Guerre aérienne intensifiée"
 idea_SIA_yielded_the_air_war_desc: "Sachant que nous sommes largement dépassés dans la course à la supériorité aérienne, nous ferions mieux d'investir dans la défense anti-aérienne."
 idea_SIA_steel_arteries: "Artères d'acier"
 idea_SIA_unconventional_tank_construction: "Construction de chars non conventionnelle"
 idea_SIA_short_war: "Planification de guerre éclair"
 idea_SIA_short_war_temp_buff: "Ferveur de guerre éclair"
 idea_SIA_short_war_temp_debuff: "Épuisement de guerre éclair"
 SIA_no_supply_grace_tt: " $MODIFIER_NO_SUPPLY_GRACE$ $RIGHT|+=1$ h"
 idea_SIA_standing_our_ground_mission_temp_buff: "Tenir bon"
 idea_SIA_german_tank_studies: "Étude des chars allemands"
 idea_SIA_german_tank_studies_desc: "Nos officiers ont étudié consciencieusement les doctrines et les modèles des blindés étrangers. Ils vont pouvoir injecter toutes ces connaissances dans le développement de nos propres véhicules."
 idea_SIA_american_tank_studies: "Étude des chars américains"
