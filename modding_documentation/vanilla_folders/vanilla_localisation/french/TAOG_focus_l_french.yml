 INS_revolution_ended_tt: "La Révolution nationale a pris fin"
 # <Empower the Volksraad>
 INS_the_jewel_in_the_crown: "Le joyau de la Couronne"
 INS_the_jewel_in_the_crown_desc: "Les Indes orientales sont un véritable joyau de la couronne coloniale néerlandaise, et comme tout bijou, nous y tenons. Nous portons notre voix jusqu'à La Haye grâce au Volksraad."
 INSHOL_java: "$HOL_java$"
 INSHOL_java_desc: "$HOL_java_desc$"
 INSHOL_sumatra: "$HOL_sumatra$"
 INSHOL_sumatra_desc: "$HOL_sumatra_desc$"
 INSHOL_borneo_and_the_grote_oost: "$HOL_borneo_and_the_grote_oost$"
 INSHOL_borneo_and_the_grote_oost_desc: "$HOL_borneo_and_the_grote_oost_desc$"
 INSHOL_foundations_of_defense: "$HOL_the_foundations_of_defense$"
 INSHOL_foundations_of_defense_desc: "$HOL_the_foundations_of_defense_desc$"
 INSHOL_investments_in_civ_railways_tt: "Si [HOL.GetFlag] [HOL.GetLeLaLNP] §Y[HOL.GetName]§! achèv[HOL.GetEEntNP] la priorité :\n         ([INS.GetFlag]§Y[INS.GetName]§! : retire §Y-250£autonomy_texticon§!)\n   Si [INS.GetFlag] [INS.GetLeLaLNP] §Y[INS.GetName]§! achèv[INS.GetEEntNP] la priorité :\n         ajoute §Y250£autonomy_texticon§!"
 INSHOL_investments_in_civ_railways: "Investir dans les chemins de fer civils"
 INSHOL_investments_in_civ_railways_desc: "Pour bénéficier du soutien de la population, il faut investir dans des infrastructures qui lui sont destinées. Nos voies ferrées sont réservées au transport de marchandises, mais en acquérant quelques trains de voyageurs, nous pourrions offrir un nouveau moyen de locomotion sur Java et Sumatra."
 INSHOL_continue_exclusive_rights: "Droits exclusifs pour la De Javasche Bank"
 INSHOL_continue_exclusive_rights_desc: "Le florin des Indes a perdu toute sa valeur durant la Grande Dépression, stoppant net notre croissance économique. Essayons de stabiliser cette monnaie en octroyant à la De Javasche Bank les droits exclusifs d'impression des billets."
 INSHOL_peg_indies_guilder_to_dutch_guilder: "Indexer le florin des Indes sur le florin néerlandais"
 INSHOL_peg_indies_guilder_to_dutch_guilder_desc: "Le florin des Indes a perdu toute sa valeur durant la Grande Dépression, stoppant net notre croissance économique. La solution tout indiquée serait d'indexer notre monnaie au florin néerlandais, une monnaie bien plus fiable, ce qui ne manquera pas de renforcer nos liens avec notre suzerain."
 INSHOL_peg_indies_guilder_to_us_dollar: "Indexer le florin des Indes sur le dollar américain"
 INSHOL_peg_indies_guilder_to_us_dollar_desc: "Le florin des Indes a perdu toute sa valeur durant la Grande Dépression, stoppant net notre croissance économique. Nous pourrions indexer notre monnaie sur le florin néerlandais, mais le dollar américain est bien plus stable. C'est aussi un moyen détourné de nous émanciper économiquement de notre suzerain et de nous préparer à l'autonomie totale..."
 indonesia_currency_pegged_to_dollar_modifier: "Florin des Indes indexé sur le dollar américain"
 INS_direct_rule_tt: "Donne accès à la politique d'occupation §Y$INS_direct_rule_occupation_law$§! sur les États princiers indonésiens.\nEffets :\n     §GAugmente§! les ressources et les usines de l'État\n     §RDiminue§! le développement de l'accommodement\n     §RAugmente§! le développement de la résistance"
 INS_local_autonomy_tt: "Donne accès à la politique d'occupation §Y$INS_local_autonomy_occupation_law$§! sur les États princiers indonésiens.\nEffets :\n     Octroie un §Yléger§! avantage général\n     §GAugmente§! le développement de l'accommodement"
 INS_invest_in_batavian_education_req_tt: "A réussi au moins §Y3§! missions du Volksraad"
 INS_invest_in_batavian_education_req_2_tt: "A réussi au moins §Y6§! missions du Volksraad"
 INSHOL_eventual_autonomy_req_tt: "A réussi au moins §Y4§! missions du Volksraad"
 indonesia_volksraad_passed_12: "Le drapeau national de l'Indonésie est désormais officiellement reconnu."
 INS_stronghold_java_tt: "N'importe quel État indonésien : non occupé par [ROOT.GetFlag] [ROOT.GetLeLaLNP] [ROOT.GetName]"
 INSHOL_request_east_timor: "Exiger la rétrocession du Timor oriental"
 INSHOL_request_east_timor_desc: "Les Portugais n'ont rien à faire au Timor : leur présence n'est qu'un vestige indésirable du passé colonial de la région, et ce territoire revient légitimement à l'Indonésie. Nous allons officiellement exiger le retour du Timor sous notre contrôle."
 INS_resist_occupation: "Résister à l'occupation"
 INS_resist_occupation_desc: "La colère des Indonésiens contre les Pays-Bas ne doit pas pour autant nous jeter dans la gueule du fascisme. Résistons jusqu'au bout pour empêcher les Japonais d'envahir notre patrie."
 INS_local_resistance: "Résistance locale"
 INS_local_resistance_desc: "Nous allons établir des cellules de résistance dans des territoires encore libres, de façon à ce que nous ayons les moyens de nous défendre contre l'envahisseur en cas d'occupation."
 INS_stronghold_java: "Les bastions de Java"
 INS_stronghold_java_desc: "Les Indes sont un vaste archipel abritant de nombreux peuples et offrant un relief impitoyable. Défendre toutes ces îles, ces jungles et ces montagnes contre une armée supérieure à la nôtre est impossible. C'est une décision difficile, mais nous allons rappeler tous nos soldats sur l'île de Java, afin de concentrer nos forces en un seul et même endroit. Nous n'abandonnons pas les autres îles, nous agissons pour le bien de la nation."
 INS_silence_nationalists: "Réprimer les militants nationalistes"
 INS_silence_nationalists_desc: "Depuis l'invasion japonaise, des mouvements nationalistes se sont mis à soutenir l'intrusion, car les deux camps vouent une haine commune aux Pays-Bas. L'instabilité générale n'a fait que dynamiser la popularité de ces mouvements. Si nous n'agissons pas très bientôt, nous risquons de perdre totalement le contrôle."
 INS_east_indies_exile_government: "Gouvernement des Indes orientales en exil"
 INS_east_indies_exile_government_desc: "Malheureusement, les Indes ont été renversées. Néanmoins, l'heure n'est pas à l'apitoiement. Poursuivons nos efforts, malgré nos maigres ressources. La bataille est perdue, mais la guerre n'est pas encore jouée."
 INS_establish_nefis: "Fonder le NEFIS"
 INS_establish_nefis_desc: "Nous allons établir le NEFIS, ou le service de renseignements des Indes néerlandaises, en collaboration avec les forces alliées, en Australie. Nous pourrons mener des opérations de sabotage clandestin sur les forces d'occupation japonaise. Chacune de ces petites victoires nous rapprochera de la reconquête."
 INS_evacuate_soldiers_to_australia: "Évacuer les soldats vers l'Australie"
 INS_evacuate_soldiers_to_australia_desc: "Nous allons construire une base militaire près du QG de NEFIS, au nord de l'Australie. Nous y affecterons les soldats de la KNIL ayant échappé à l'occupant, afin de nous regrouper et de répliquer."
 INS_australian_weapons: "Armement australien"
 INS_australian_weapons_desc: "Les opérations clandestines sont complexes, il nous faut du matériel pour les mener à bien. Acquérons des usines australiennes sous licence afin de produire de l'armement pour le NEFIS."
 INS_defenders_of_homeland: "Les défenseurs de la patrie"
 INS_defenders_of_homeland_tt: "Cette priorité sera automatiquement atteinte si l'armée des Défenseurs de la patrie a été formée."
 INS_resist_occupation_tt: "Cette priorité sera automatiquement atteinte si nous sommes envahis et que nous ne capitulons pas."
 INS_defenders_of_homeland_desc: "Le gouvernement des Indes n'est plus, remplacé par un nouveau régime. Sous cette direction copilotée par les nationalistes et le gouvernement japonais, nous allons créer une armée supérieure à la KNIL pour remporter la guerre. Il faut tout de même reconnaître que l'alliance entre nationalistes et impérialistes est fragile. Combien de temps durera-t-elle ?"
 INS_embrace_co_prosp_sphere: "Intégrer la Sphère de coprospérité"
 INS_embrace_co_prosp_sphere_desc: "L'autorité néerlandaise est enfin abolie. Certes, nous sommes passés d'un suzerain à un autre, mais pour une prospérité économique et un panasiatisme prometteur. Contribuons à l'effort de guerre japonais afin de chasser pour de bon les Néerlandais d'Indonésie."
 INS_seize_oppurtunity: "Une occasion en or"
 INS_seize_oppurtunity_desc: "Les [JAP.GetHabitants] sont en train de perdre la Grande Guerre, et leur gouvernement d'occupation ne vaut rien. Pour la première fois depuis des siècles, nous avons l'opportunité de briser les chaînes qui entravent l'Indonésie. Si nous ne saisissons pas cette occasion en or tout de suite, nous n'aurons peut-être plus jamais la chance d'y parvenir."
 INS_japanese_resource_infrastructure: "Financer l'effort de la Grande Guerre"
 INS_japanese_resource_infrastructure_desc: "Céder le contrôle de nos infrastructures d'extraction de ressources aux [JAP.GetHabitants] est la clé de la victoire. Sans ces matières premières, leurs soldats manqueraient de matériel. En échange, le gouvernement [JAP.GetAdjMS] va développer nos infrastructures afin d'accroître l'efficacité de nos industries."
 INS_japanese_army_training: "Réformer l'armée"
 INS_japanese_army_training_desc: "Nos suzerains [JAP.GetAdjMP] ont beaucoup à nous apprendre. Maintenant que la KNIL est en déroute, nous allons former une nouvelle armée instruite par l'armée impériale elle-même afin de préparer le pays à toute menace extérieure."
 INS_governor_general_de_jonge: "Gouverneur général de Jonge"
 INS_governor_general_de_jonge_desc: "Bonifacius Cornelis de Jonge a la réputation d'un gouverneur inflexible, s'opposant à toute forme de nationalisme et ignorant le plus clair du temps le Volksraad. Son mandat aux Indes aura duré de nombreuses années, accumulant une solide expérience depuis la Grande Guerre, à l'époque où il était ministre de la Guerre des Indes."
 INS_governor_general_tjarda: "Gouverneur général Tjarda"
 INS_tjarda_explain_tt: "Le mandat de §YBonifacius Cornelis de Jonge§! touche à sa fin ; §YAlidius Tjarda van Starkenborgh Stachouwer§! a été nommé gouverneur intérimaire en septembre 1936."
 INS_governor_general_tjarda_desc: "Alidius Tjarda van Starkenborgh Stachouwer imagine l'avenir des Indes différemment de son prédécesseur. Bien qu'il demeure lui aussi opposé au nationalisme, il accueille des mesures beaucoup plus libérales et n'hésite pas à dialoguer avec le Volksraad."
 INS_electrical_investments: "Investissements dans l'électricité"
 INS_electrical_investments_desc: "L'entièreté des nations européennes industrialisées a déployé un réseau électrique de qualité sur leur territoire. Si nous souhaitons passer d'une économie d'export à une économie de manufacture, il nous faut la même capacité d'électrification sur toute l'île de Java."
 INS_reduce_land_taxes: "Réduire les impôts fonciers"
 INS_reduce_land_taxes_desc: "Les impôts fonciers sont faramineux, rendant difficile l'accès à la propriété pour les Indonésiens. Nous avons pu jusque-là maintenir un monopole formidable sur l'industrie du caoutchouc, mais, aujourd'hui, cette situation provoque des couacs économiques sur le pays. Réduisons ces impôts afin de permettre la création de plus petites plantations."
 INS_invest_in_batavian_education: "Investir dans l'éducation à Batavia"
 INS_invest_in_batavian_education_desc: "Le Volksraad l'a répété à maintes reprises : le peuple indonésien souhaite l'accès libre à l'éducation. Seuls les Néerlando-indonésiens ou l'élite indonésienne peuvent se permettre un cursus scolaire. Tâchons de suivre les recommandations du conseil en faisant construire des écoles primaires et secondaires à Batavia et ses alentours."
 INS_javanese_education_investments: "Investir dans l'éducation sur Java"
 INS_javanese_education_investments_desc: "Notre projet de construction d'écoles primaires et secondaires est brillant, mais nous pourrions également fonder une université publique et quelques écoles supérieures pour rendre la totalité de l'éducation vraiment accessible à la classe moyenne."
 INS_allow_local_autonomy: "Autoriser l'autonomie locale"
 INS_allow_local_autonomy_desc: "Le système des Vorstenlanden permet l'autogouvernance des États princiers et une surveillance rapprochée des mouvements nationalistes, octroyant à la nation une stabilité retrouvée. Élargissons le niveau d'autonomie accordée à ces États princiers, afin que le gouvernement puisse se recentrer sur les questions essentielles."
 INS_direct_rule: "Administration directe"
 INS_direct_rule_desc: "Le système des Vorstenlanden permettant l'autogouvernance des États princiers a complexifié l'administration, doublé les postes et impacté l'efficacité des institutions gouvernementales. Il est temps d'abolir ce casse-tête et d'imposer tout simplement une administration directe sur tout l'archipel."
 INS_seize_oppurtunity_tt: "[JAP.GetLeLaLNPCap] §Y[JAP.GetFlag][JAP.GetName]§! [JAP.GetAOntNP] perdu du terrain, contrôlant désormais moins de §Y[?var:temp_states_plus_more]§! États (actuellement : §Y[?var:JAP.num_controlled_states]§!)."
 INS_seize_oppurtunity_refuse_warn_tt: "§RLa révolution nationale va être lancée, ce qui risque de déclencher une guerre contre [HOL.GetLeLaLNP] [HOL.GetName]§!."
 INS_economic_stabilization: "Stabilisation économique"
 INS_economic_stabilization_desc: "La Grande Dépression et le protectionnisme mondialisé ont considérablement affaibli notre économie : une grande partie des Indonésiens ayant travaillé dans l'industrie d'exploitation sont aujourd'hui au chômage. Prenons le taureau par les cornes, créons un programme de plein emploi grâce auquel nous offrirons à tous les inactifs un travail."
 INS_restore_order_in_indies: "Restaurer l'ordre dans les Indes"
 INS_restore_order_in_indies_desc: "Le mouvement nationaliste a le vent en poupe dans les Indes, il n'a d'ailleurs pas manqué de déstabiliser certaines régions. Si nous ne faisons rien, c'est la porte ouverte à toutes les fenêtres. Rétablissons l'ordre sur l'archipel."
 INS_detangle_supply_chains: "Dégraisser les chaînes d'approvisionnement"
 INS_detangle_supply_chains_desc: "Notre économie d'export est actuellement divisée entre d'innombrables intermédiaires, par lesquels transitent les marchandises avant d'atteindre leur destination. Chaque intermédiaire facture ses honoraires, une taxe ou toute autre excuse pour se remplir les poches. Dégraissons ce capharnaüm et prenons le contrôle des chaînes d'approvisionnement."
 INS_prioritize_industrial_growth: "Accélérer la croissance industrielle"
 INS_prioritize_industrial_growth_desc: "Notre économie d'export fluctue chaque jour et se repose beaucoup trop sur les Néerlandais. Mettons en place une industrie de manufacture en construisant une série d'usines à Batavia. Tentons de devenir le pays le plus industrialisé de tout le Pacifique."
 INS_closer_economic_ties_to_netherlands: "Se rapprocher économiquement des Pays-Bas"
 INS_closer_economic_ties_to_netherlands_desc: "Nous avons beaucoup à apprendre de nos suzerains, notamment d'un point de vue économique. En acceptant une intégration avancée de notre économie d'export avec les Pays-Bas, nous pourrions tirer profit de leurs infrastructures et leurs contacts pour signer des accords commerciaux plus avantageux."
 INS_prioritize_dutch_companies: "Privilégier les entreprises néerlandaises"
 INS_prioritize_dutch_companies_desc: "Les entreprises néerlandaises, comme Shell ou Fokker, sont le fer de lance de notre économie depuis bien longtemps. Notre économie d'export est d'ailleurs très largement soutenue par Shell. Ce partenariat a apporté la fortune aux Indes. Privilégions ces grandes entreprises pour assurer la bonne santé de notre économie et de notre coopération."
 INSHOL_java_factories: "Ouvrir des usines d'armement sur Java"
 INSHOL_java_factories_desc: "Pour améliorer la puissance de notre armée, nous pouvons tout simplement construire davantage d'usines d'armement sur le territoire. Nous avons pensé à Java, puisqu'il s'agit de l'île la plus industrialisée de l'archipel."
 INSHOL_license_dutch_weapon_blueprints: "Acheter des plans d'armement néerlandais"
 INSHOL_license_dutch_weapon_blueprints_desc: "Au lieu d'investir des sommes folles dans la mise en place d'une manufacture domestique et d'un département de recherche, nous ferions mieux de coopérer avec les entreprises néerlandaises et d'acheter leurs plans d'armement."
 INSHOL_bangka_production_lines: "Lignes de production de Bangka"
 INSHOL_bangka_production_lines_desc: "Le développement exponentiel des infrastructures de Bangka est à attribuer au projet Bangka : il a transformé une île insignifiante en un site idéal pour nos programmes industriels novateurs. Nous avons l'occasion rêvée de renforcer la KNIL en mettant sur pied une usine d'armement ici, sur Bangka. Ses réseaux routier, ferré et maritime ont été pensés pour optimiser tout le processus de manufacture."
 INSHOL_artillerie_inrichtingen: "Artillerie-Inrichtingen"
 INSHOL_artillerie_inrichtingen_desc: "Artillerie-Inrichtingen est une manufacture d'artillerie et d'armement divers qui a vu le jour aux Pays-Bas il y a plus de 250 ans. Installée depuis quelques années dans les Indes, il serait judicieux d'élargir son champ d'action en ouvrant d'autres sites de fabrication dans l'archipel, notamment pour renforcer les capacités de la KNIL. Cette opportunité ne manquera pas également de dynamiser l'économie de zones appauvries grâce à la création d'emplois."
 INSHOL_ai_pyrotechnische: "Artillerie Inrichtingen Pyrotechnische"
 INSHOL_ai_pyrotechnische_desc: "Nous inscrivant dans la démarche d'expansion des capacités de production d'Artillerie-Inrichtingen au cœur des Indes orientales, nous allons financer la création d'une branche dédiée à la pyrotechnie."
 INSHOL_bio_pharma: "Biopharmacie"
 INSHOL_bio_pharma_desc: "Pour reformer la KNIL efficacement, nous devons développer l'industrie pharmaceutique, afin d'offrir aux soldats blessés les soins nécessaires à un prompt rétablissement. Par chance, l'abondance de quinine dans les Indes va drastiquement réduire les coûts de cette modernisation."
 INSHOL_develop_fighters: "Développer de nouveaux chasseurs"
 INSHOL_develop_fighters_desc: "Envoyons des ingénieurs de Batavia à Amsterdam pour qu'ils étudient les chasseurs produits par Fokker et obtiennent l'accès à leurs secrets de fabrication jalousement gardés. Ils nous reviendront avec l'expertise nécessaire à la formation d'une industrie d'aviation dans les Indes."
 INSHOL_develop_bombers: "Développer de nouveaux bombardiers"
 INSHOL_develop_bombers_desc: "Envoyons des ingénieurs de Batavia à Amsterdam pour qu'ils étudient les bombardiers produits par Fokker et obtiennent l'accès à leurs secrets de fabrication jalousement gardés. Ils nous reviendront avec l'expertise nécessaire à la formation d'une industrie d'aviation dans les Indes."
 INSHOL_bandung_aircraft_facility: "Manufacture d'avions de Bandung"
 INSHOL_bandung_aircraft_facility_desc: "Posséder des plans et des secrets industriels, c'est bien ; s'en servir pour construire des avions, c'est mieux. Ouvrons des usines d'aviation à Bandung pour répondre aux besoins de la ML-KNIL."
 INSHOL_netherlands_indies_air_doctrine: "La doctrine aérienne néerlando-indonésienne"
 INSHOL_netherlands_indies_air_doctrine_desc: "Étudions les forces aériennes des nations dans une situation similaire à la nôtre et tirons les leçons de leurs décisions et leur expérience pour élaborer une doctrine répondant aux réalités des Indes orientales, en tâchant de ne pas répéter les mêmes erreurs qu'auparavant."
 INSHOL_manado_military_academy: "Académie militaire de Macassar"
 INSHOL_manado_military_academy_desc: "La fondation d'une académie militaire hors de Java permettra de répondre à notre pénurie d'hommes en mettant en place une conscription dans les îles orientales. Macassar est l'endroit idéal pour réaliser ce projet."
 INSHOL_infantry_training_in_borneo: "Formation d'infanterie à Bornéo"
 INSHOL_infantry_training_in_borneo_desc: "Les Indes orientales sont caractérisées par leurs jungles denses, leurs montagnes escarpées et ses reliefs sauvages. Nos soldats sont principalement issus de Java, de fait, ils connaissent très peu ces terrains hostiles. Délocalisons une partie de leur entraînement de Java et menons des exercices là où la topographie les mettra à rude épreuve. Difficile de faire plus inhospitalier que Bornéo : c'est là que nous les enverrons."
 INSHOL_knil_engineers: "Corps des ingénieurs"
 INSHOL_knil_engineers_desc: "Ne focalisons pas tous nos efforts sur la formation de l'infanterie ou d'armement : il nous faut également penser à la logistique et la communication, des facteurs déterminants pour remporter des guerres. Formons des ingénieurs en finançant les écoles spécialisées à Batavia. Il ne manquerait plus que notre puissante armée soit desservie par une logistique bancale."
 INSHOL_work_with_oil_barons: "Coopérer avec les barons du pétrole"
 INSHOL_work_with_oil_barons_desc: "La Grande Dépression a fait des ravages dans notre économie d'export. Il est peut-être temps de déléguer certaines négociations commerciales aux barons du pétrole de Sumatra afin d'écouler nos stocks. Nous devrons cependant voir notre marge de bénéfices à la baisse, puisqu'il faudra vendre le pétrole en dessous des prix du marché."
 INSHOL_rubber_taxation: "Taxe sur le caoutchouc"
 INSHOL_rubber_taxation_desc: "Grâce aux investissements néerlandais, les plantations de caoutchouc des Indes sont devenues l'une des principales sources de revenus de l'Empire. Il est donc naturel que la couronne exige sa part des bénéfices. Les politiciens locaux s'indignent, mais nous n'allons pas laisser les reproches d'indigènes dicter la conduite de l'Empire."
 INSHOL_padang_port: "Port international de Padang"
 INSHOL_padang_port_desc: "Les ressources produites à Padang doivent d'abord passer par Java avant d'atteindre les marchés internationaux, car c'est le seul port de l'archipel capable d'expédier des convois importants. Ce détour ralentit considérablement notre chaîne d'approvisionnement ainsi que le potentiel économique de Sumatra. Construisons un port international à Padang afin d'accroître nos profits."
 INSHOL_subsidize_bauxite: "Financer les projets de bauxite"
 INSHOL_subsidize_bauxite_desc: "L'un des objectifs des Indes consiste à moderniser les îles de Bangka Belitung pour y optimiser l'extraction de bauxite. Ce projet s'annonce très prometteur, alors nous devrions soutenir financièrement le gouvernement colonial pour accélérer les travaux."
 INSHOL_agricultural_subsidies: "Privatiser le secteur agricole"
 INSHOL_agricultural_subsidies_desc: "Autorisons la création de fermes privatisées afin d'accélérer le développement des infrastructures dans les régions rurales délaissées, mais aussi d'augmenter les recettes du gouvernement. Mettons en place un système d'imposition qui sera reversé directement aux Pays-Bas, sans passer par les caisses des Indes."
 INSHOL_import_sugar: "Importer du sucre"
 INSHOL_import_sugar_desc: "Nous allons imposer un contrôle tarifaire dans le secteur agricole florissant des Indes, dans le but d'importer tout le sucre produit par nos plantations à des prix défiant toute concurrence. Nous aurons alors le monopole du sucre."
 INSHOL_import_lumber: "Importer du bois"
 INSHOL_import_lumber_desc: "Nous allons imposer un contrôle tarifaire dans le secteur agricole florissant des Indes, dans le but d'importer tout le bois produit par nos plantations à des prix défiant toute concurrence. Nous aurons alors le monopole du bois."
 INSHOL_industrialized_colony: "Une colonie industrialisée"
 INS_no_peta_tt: "L'Indonésie ne pourra pas coopérer avec l'envahisseur."
 INSHOL_industrialized_colony_desc: "Les Indes orientales n'étaient jusqu'alors qu'une modeste colonie ; aujourd'hui, elles sont l'une des régions les plus riches et les plus industrialisées d'Asie. Ceci marque un tournant fondamental dans l'histoire des Pays-Bas, mais aussi de toute l'humanité. Nos efforts ont porté leurs fruits. Poursuivons les investissements pour développer notre colonie et rétablir notre nation au premier plan de la scène internationale."
 INSHOL_economic_integration: "Intégration économique"
 INSHOL_economic_integration_desc: "Les Indes néerlandaises sont le joyau de l'Empire. On doit leur prospérité à notre reine bien-aimée, notre Premier ministre ainsi que le gouverneur général. Il faut préserver cette stabilité à tout prix de ces agitateurs qui crient à l'indépendance, une indépendance qui ne provoquerait que le chaos et la déchéance. Lions l'économie des Indes à celle des Pays-Bas, pour un essor commun et florissant."
 INSHOL_republic_of_indonesia: "La République d'Indonésie"
 INSHOL_republic_of_indonesia_desc: "Lorsque les Pays-Bas ont accepté, à contrecœur, la motion Soetardjo, l'indépendance de l'Indonésie était soumise à une très longue liste de conditions qui certifiait son autosuffisance. Envers et contre tout, nous avons réussi à satisfaire l'ensemble de ces conditions grâce à la détermination du peuple indonésien. Les Néerlandais n'ont d'autre choix que de reconnaître officiellement notre déclaration d'indépendance."
 INSHOL_propose_malay_unification: "Proposer l'unification malaise"
 INSHOL_propose_malay_unification_desc: "L'Indonésie est un archipel accueillant des centaines de cultures, langues et ethnies. Certaines sont très proches, tandis que d'autres sont largement divergentes. Pourtant, ligués contre l'oppression coloniale, nous avons trouvé l'unité sous une seule et unique nation indonésienne. Pourquoi nous arrêter là ? Pourquoi ne pas partager également notre nation avec les populations de Malaisie ?"
 INSHOL_singapore_compromise: "Le compromis de Singapour"
 INSHOL_singapore_compromise_desc: "Singapour est un territoire indonésien, tant par la culture que par l'histoire commune, c'est pourquoi il mérite de rejoindre notre nation. Seulement, la Grande-Bretagne refuse de nous le céder, car il représente une importance stratégique à ses yeux. Élaborons un compromis, statuant que Singapour intègre notre union, mais que la Grande-Bretagne peut conserver le droit d'y affecter des contingents militaires."
 INSHOL_request_ceylon: "Exiger le transfert de Ceylan"
 INSHOL_request_ceylon_desc: "La colonie britannique de Ceylan partage des liens culturels et linguistiques indéniables avec l'ethnie malaise. À l'heure où la fédération pan-malaise de Maphilindo est en plein essor, nous devrions intégrer cette île au sein de notre union."
 INSHOL_papua_referendum: "Le référendum de Papouasie"
 INSHOL_papua_referendum_desc: "Aujourd'hui, l'île de Papouasie est divisée entre l'Indonésie et l'Australie. Nos investissements ont fait de notre moitié une région riche et prospère, tandis que la partie australienne a été cruellement négligée. L'avenir de l'île demeure entre les mains de sa population, c'est pourquoi nous demandons la tenue d'un référendum pour l'unification de la Papouasie."
 INSHOL_invite_phillipines: "Fonder Maphilindo"
 INSHOL_invite_phillipines_desc: "Les innombrables peuples de notre union parlent d'innombrables langues et perpétuent leurs traditions, mais tous possèdent des origines malaises. Transformons notre union en une confédération pan-malaise et invitons-y les Philippines comme État membre. Nous ne sommes plus des colonies éparses et sans défense ; nous sommes la plus grande puissance régionale de l'Asie du Sud-Est."
 INS_focus_time_reduce_usa_tt: "§Y$INS_realign_supply_chains$§! va réduire le temps nécessaire pour cette priorité de 70 jours"
 INS_focus_time_reduce_jap_tt: "§Y$INS_first_come_first_serve$§! va réduire le temps nécessaire pour cette priorité de 70 jours"
