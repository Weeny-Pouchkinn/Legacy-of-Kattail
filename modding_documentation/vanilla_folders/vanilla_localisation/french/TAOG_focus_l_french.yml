 ### MISC ###
 ############
 add_random_stat_to_general_tt: "Ajoute une compétence aléatoire supplémentaire à ce général"
 generic_unlock_industrial_concern_tt: "Groupe industriel disponible : \n"
 NZL_rail_standardization_tt: "§Y[?NZL_train_var]§! unités de §Y$NZL_train_equipment_1$§! sont ajoutées aux réserves."
 NZL_ministry_of_public_works: "Ministère des Travaux publics"
 NZL_ministry_of_public_works_desc: "Grâce à une planification coordonnée et des investissements disciplinés, les projets routiers, ferroviaires et énergétiques avanceront en suivant une stratégie nationale cohérente plutôt que par des efforts isolés."
 NZL_abolish_the_railways_board: "Abolir la Commission des chemins de fer"
 NZL_abolish_the_railways_board_desc: "La Commission des chemins de fer de l'État a échoué dans la modernisation du réseau. Le moment est venu pour nous d'abolir cette aberration et de remettre les chemins de fer sous contrôle ministériel."
 NZL_rail_standardization: "Standardisation des locomotives"
 NZL_rail_standardization_desc: "[ROOT.GetLeLaLNPCap] [ROOT.GetName] [ROOT.GetAOntNP] un certain nombre d'ateliers à travers le pays ayant produit des locomotives de qualité variable. Afin de rendre le réseau ferré plus efficace, nous établirons plusieurs modèles de locomotives standard à produire, chacun étant réservé à un usage spécifique. "
 NZL_full_employment: "Plein emploi"
 NZL_full_employment_desc: "Grâce aux travaux publics, à une planification méticuleuse et à une expansion industrielle continue, le chômage a enfin disparu au profit de nouvelles opportunités. Les ateliers abandonnés datant de la crise ont rouvert leurs portes, et la main-d'œuvre de la nation est pleinement mobilisée dans des entreprises productives. Après avoir retrouvé la confiance et la stabilité, nous sommes non seulement sortis de cette mauvaise passe, mais nous nous sommes aussi renforcés pour mieux relever les défis à venir."
 NZL_direct_the_coal_industry: "Diriger l'industrie charbonnière"
 NZL_direct_the_coal_industry_desc: "Alors que le charbon joue un rôle de plus en plus important pour nos chemins de fer, notre industrie et nos centrales électriques, il est dans l'intérêt de la nation que le gouvernement en coordonne la production et la distribution."
 NZL_establish_the_ncb: "Fonder la Commission nationale du charbon"
 NZL_establish_the_ncb_desc: "En fondant une Commission nationale du charbon, nous pourrons superviser les mines aux quatre coins du pays et assurer un approvisionnement stable en combustible pour les chemins de fer, l'industrie et la production d'énergie. Une supervision centralisée nous permettra de rationaliser la production, d'améliorer l'efficacité et de veiller à ce que les besoins stratégiques passent avant les intérêts privés."
 NZL_electrification: "Développer la production d'énergie"
 NZL_electrification_desc: "En exploitant nos cours d'eau et en développant notre production hydroélectrique, nous pourrons poser les bases d'une puissance industrielle durable. De nouveaux barrages et des installations de transmission augmenteront notre capacité dans tout le pays, garantissant ainsi que les usines, les chemins de fer et les ports disposent de l'énergie dont ils ont besoin."
 NZL_bureau_of_industry_taog: "$NZL_bureau_of_industry$"
 NZL_bureau_of_industry_taog_desc: "$NZL_bureau_of_industry_desc$"
 NZL_wairarapa_sheep_farms_taog: "$NZL_wairarapa_sheep_farms$"
 NZL_wairarapa_sheep_farms_taog_desc: "$NZL_wairarapa_sheep_farms_desc$"
 NZL_national_roads_board_taog: "$NZL_national_roads_board$"
 NZL_national_roads_board_taog_desc: "$NZL_national_roads_board_desc$"
 NZL_taranaki_oil_taog: "$NZL_taranaki_oil$"
 NZL_taranaki_oil_taog_desc: "$NZL_taranaki_oil_desc$"
 NZL_women_in_the_workforce: "Main-d'œuvre féminine"
 NZL_women_in_the_workforce_desc: "Face à la pénurie de main-d'œuvre, les femmes se portent volontaires pour occuper des postes essentiels dans les usines, les fermes et les services publics, veillant ainsi à ce que la production ne baisse pas en temps de guerre. L'élargissement des possibilités d'emploi et de formation nous permettra de maintenir la production industrielle, tout en assurant la défense du pays."
 NZL_restart_the_onekaka_ironworks: "Relancer l'usine sidérurgique d'Onekaka"
 NZL_restart_the_onekaka_ironworks_desc: "L'usine sidérurgique d'Onekaka reflétait autrefois notre ambition de produire du fer et de l'acier dans notre pays, afin de réduire notre dépendance aux importations étrangères. Pour relancer l'économie et renforcer la sécurité nationale, nous avons eu l'idée de relancer les hauts fourneaux d'Onekaka."
 NZL_new_zealand_steel_taog: "$NZL_new_zealand_steel$"
 NZL_new_zealand_steel_taog_desc: "$NZL_new_zealand_steel_desc$"
 NZL_scrap_metal_recycling: "Campagne de recyclage"
 NZL_scrap_metal_recycling_desc: "Une économie dépendante des importations comme la nôtre ne peut pas se permettre de gaspiller des ressources stratégiques. Afin de renforcer notre résilience économique, nous mettrons en place des installations de recyclage des déchets permettant de traiter et de réutiliser les métaux et le caoutchouc."
 NZL_domestic_car_industry: "Investir dans les usines de montage de véhicules"
 NZL_domestic_car_industry_desc: "La production de véhicules [ROOT.GetAuEnANP] [ROOT.GetName] se limite à l'assemblage de pièces fabriquées à l'étranger avant d'être expédiées ici pour la fabrication finale. Grâce à nos récents investissements dans la production nationale d'acier, nous pourrions être en mesure de lancer nous-mêmes la fabrication de ces composants."
 NZL_department_of_scientific_and_industrial_research_taog: "$NZL_department_of_scientific_and_industrial_research$"
 NZL_department_of_scientific_and_industrial_research_taog_desc: "$NZL_department_of_scientific_and_industrial_research_desc$"
 NZL_project_seal_taog: "$NZL_project_seal$"
 NZL_project_seal_taog_desc: "$NZL_project_seal_desc$"
 NZL_industrial_conscription_taog: "$NZL_industrial_conscription$"
 NZL_think_big_taog: "$NZL_think_big$"
 NZL_industrial_conscription_taog_desc: "$NZL_industrial_conscription_desc$"
 NZL_think_big_taog_desc: "$NZL_think_big_desc$"
 NZL_expand_the_university_of_auckland_taog: "$NZL_expand_the_university_of_auckland$"
 NZL_expand_the_university_of_auckland_taog_desc: "$NZL_expand_the_university_of_auckland_desc$"
 NZL_national_broadcasting_service: "Service de radiodiffusion national"
 NZL_national_broadcasting_service_desc: "Suite à l'ingérence du bureau de poste dans les élections de 1935 et à sa supervision des services de radiodiffusion nationaux, il nous semble évident que nous devons réformer la gestion de cette organisation. Nous devrions également investir dans la modernisation de son matériel de diffusion."
 NZL_support_allies_with_meat: "Utiliser l'industrie de la viande"
 NZL_support_allies_with_meat_desc: "Nos alliés dans le Pacifique repoussent souvent les limites de leurs lignes de ravitaillement. Afin de réduire ce phénomène et d'assurer l'approvisionnement des troupes, nous allons commencer à leur fournir de la viande."
 NZL_support_allies_with_meat_tt: "Chaque allié va bénéficier de §G1§! §Yusine civile hors carte§!"
 AST_COMINWEALTH_FACTION: "Kominwealth"
 AST_cominwealth_tech_sharing_tt: "Nous allons contracter un accord de §Ypartage technologique§! avec tous les membres de notre faction."
 AST_modify_offshore_advancements_spirit_tt: "Modifie §Y$AST_offshore_advancements_spirit$§! ainsi :"
 AST_gain_claims_on_japan_tt: "Nous obtiendrons des revendications sur les §Yîles japonaises§!"
 AST_ireland_anti_british_pact_offer_accept_tt: "Si cela est accepté :"
 AST_through_the_barricades_tt: "Si [ENG.GetLeLaLNP] §Y[ENG.GetName]§! [ENG.GetAOntNP] au moins §Y10%§! de soutien au communisme, alors les dockers de §Y[132.GetCapitalVictoryPointName]§! se soulèveront au début de la guerre pour nous soutenir !"
 AST_end_the_kingdom_ireland_join_tt: "Puisque [IRE.GetLeLaLNP] [IRE.GetName] [IRE.GetAOntNP] signé le pacte anti-britannique, [IRE.GetIlElleNP] entrer[IRE.GetAOntNP] en guerre à nos côtés si nous déclarons la guerre [ENG.GetAuAlaAlNP] [ENG.GetName]."
 ###########################
 ##### FABDA BRANCH ########
 ###########################
 # Root
 ABDA_abdacom: "Fonder l'ABDACOM"
 ABDA_abdacom_desc: "L'ennemi progresse rapidement en Asie du Sud-Est et sur le Pacifique ; les Alliés doivent agir si nous souhaitons les repousser. Établissons un commandement suprême dans lequel nous mettrons en commun nos ressources afin de coordonner nos flottes et de faire face à l'ennemi d'un seul front."
 # Tier 1 - country-locked
 ABDA_fortress_singapore: "La forteresse Singapour"
 ABDA_fortress_singapore_desc: "Singapour est la clé de voûte de toute notre stratégie de défense de la région, alors il serait prudent de renforcer ses remparts et d'augmenter les garnisons. Nous éviterions ainsi une capture surprise de l'ennemi et aurons tout loisir de mettre en place l'ABDACOM."
 ABDA_corps_expeditionnaire: "CEFEO"
 ABDA_corps_expeditionnaire_desc: "L'Indochine française se trouve à la frontière nord du périmètre de défense de l'ABDACOM. Mettons le Corps expéditionnaire français en Extrême-Orient à contribution, afin de profiter des effectifs et de l'expérience de cette force coloniale."
 ABDA_maintain_strategic_flexibility: "Préserver une souplesse stratégique"
 ABDA_maintain_strategic_flexibility_desc: "Les États-Unis ne devraient pas s'investir entièrement sur un seul théâtre d'opérations. Usons prudemment de nos réserves stratégiques, afin que nos alliés ne contribuent qu'à un certain niveau sur le Pacifique."
 # Tier 2
 ABDA_the_malay_barrier: "Le barrage malais"
 ABDA_the_malay_barrier_desc: "Nous voyons dans la ceinture d'îles s'étendant de Malaisie jusqu'[INS.GetAuAlaAlNP] [INS.GetNonIdeologyName] une défense naturelle. Tirons profit de cette topographie unique en coordonnant un barrage naval et terrestre qui ralentira à coup sûr la progression ennemie."
 ABDA_develop_naval_infrastructure: "Développer les infrastructures navales"
 ABDA_develop_naval_infrastructure_desc: "Les opérations navales du Pacifique ont les mêmes besoins que les opérations d'ailleurs : des bases, des dépôts de carburant et des ateliers de réparation. Investissons dans nos infrastructures afin d'améliorer les performances des flottes de l'ABDACOM."
 # Tier 3
 ABDA_unified_naval_command: "Commandement naval unifié"
 ABDA_unified_naval_command_desc: "Maintenant que nos défenses terrestres sont bien desservies par nos infrastructures, l'ABDACOM va entamer une phase d'unification maritime. Désormais, toutes nos forces navales partagent la même signalisation, les mêmes renseignements et les mêmes patrouilles."
 # Tier 4
 ABDA_ship_a_day_sinking_quotas: "Quotas de naufrages"
 ABDA_ship_a_day_sinking_quotas_desc: "Nous avons découvert le point faible de l'ennemi : ses lignes de ravitaillement qui traversent le Pacifique. Imposons à nos sous-marins et nos unités de surface un quota de naufrages : l'ennemi se retrouvera sans ressources, ce qui le poussera dans ses retranchements."
 ABDA_naval_procurement: "Achats maritimes"
 ABDA_naval_procurement_desc: "Les pertes que nous avons subies ont besoin d'être remplacées de toute urgence. Le programme d'acquisition de l'ABDACOM vise à obtenir en priorité des destroyers, des sous-marins et des navires de patrouille, des vaisseaux qui se prêtent au théâtre du Pacifique. Notre flotte combinée pourra à coup sûr contrer l'expansion ennemie."
 ABDA_keep_trade_open: "Maintenir le commerce"
 ABDA_keep_trade_open_desc: "Le caoutchouc et le pétrole [INS.GetAdjMP] sont indispensables à l'effort de guerre allié. L'ABDACOM doit faire tout son possible pour protéger les convois qui acheminent ces ressources. Le commerce doit continuer quoi qu'il arrive."
 # Tier 5 - capstone
 ABDA_expand_the_command: "Développer le commandement"
 ABDA_expand_the_command_desc: "L'ABDACOM a dépassé toutes nos espérances. Tâchons de développer ce commandement en offrant un siège à toutes les nations alliées de la région, puis en approfondissant le partage scientifique et de renseignements pour garder une longueur d'avance sur l'ennemi."
 # Tooltips
 ABDA_basic_available_trigger_tt: "N'est pas en guerre contre un membre de l'ABDACOM"
 ABDA_spirit_tooltip: "Modifie le §Ycommandement suprême de l'ABDACOM§! ainsi :"
 abdacom_member: "Membre de l'ABDACOM"
