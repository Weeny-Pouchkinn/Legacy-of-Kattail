 RAJ_BLITZKRIEG_DESC: "Joyau de l'Empire britannique, le Raj des Indes est un mélange étrange de puissance et de faiblesse impériales. Une élite minoritaire de fonctionnaires britanniques gouverne des centaines de millions de sujets. C'est là qu'a été recrutée cette armée indienne qui s'est battue avec courage lors de la Grande Guerre.\n$tab_dec$Les leaders indigènes espéraient que les sacrifices consentis alors aideraient l'Inde à accéder à l'indépendance – en vain jusqu'à présent. Et alors qu'une nouvelle guerre menace, nombreux sont ceux qui pensent que le moment est venu de retrouver la liberté... quels que soient les moyens utilisés."
 CZE_GATHERING_STORM_DESC: "Au cours de la Grande Guerre, les troupes tchèques ont combattu au sein de l'Entente dans toute l'Europe, avec pour but de faire reconnaître leur pays. Ce fut un succès, et la Tchécoslovaquie naquit des cendres de l'Empire austro-hongrois.\n$tab_dec$Depuis lors, la Tchécoslovaquie a formé l'alliance de la « Petite Entente » avec la Yougoslavie et la Roumanie, afin de s'opposer aux tentatives hongroises de restauration de l'Autriche-Hongrie. Mais le paysage politique européen évolue très rapidement du fait de la renaissance de la puissance allemande..."
 HUN_GATHERING_STORM_DESC: "Représentant l'une des deux moitiés de l'Empire austro-hongrois, la Hongrie a été traitée en ennemie vaincue par l'Entente au sortir de la Grande Guerre. Par le traité du Trianon, le pays a perdu presque les deux tiers de ses territoires, des millions de Hongrois se retrouvant alors hors des frontières, et son économie était ruinée. Des restrictions draconiennes concernant son réarmement étaient censées assurer qu'elle ne menacerait plus la paix en Europe.\n$tab_dec$Mais avec les changements politiques sur la scène européenne, le moment est venu de corriger les erreurs du passé et de restaurer la gloire ancienne de la nation."
 ROM_GATHERING_STORM_DESC: "La Roumanie s'est trouvée du côté des vainqueurs lors de la Grande Guerre, et a donc bénéficié de gains territoriaux et démographiques – tous n'étant pas d'origine roumaine. Pour se protéger du revanchisme des pays contraints de céder des territoires, la Roumanie a créé un réseau d'alliances dans tous les Balkans. Ces dernières années, toutefois, le pays s'est surtout intéressé aux questions intérieures, et le gouvernement du roi Carol II a laissé ses alliances se distendre.\n$tab_dec$Alors que la situation politique européenne évolue rapidement, la Roumanie risque de se retrouver seule. Et sans défense."
 HUN_BLITZKRIEG_DESC: "Représentant l'une des deux moitiés de l'Empire austro-hongrois, la Hongrie a été traitée en ennemie vaincue par l'Entente au sortir de la Grande Guerre. Par le traité du Trianon, le pays a perdu presque les deux tiers de ses territoires, des millions de Hongrois se retrouvant alors hors des frontières, et son économie était ruinée. Des restrictions draconiennes concernant son réarmement étaient censées assurer qu'elle ne menacerait plus la paix en Europe.\n$tab_dec$Mais avec les changements politiques sur la scène européenne, le moment est venu de corriger les erreurs du passé et de restaurer la gloire ancienne de la nation."
 ROM_BLITZKRIEG_DESC: "La Roumanie s'est trouvée du côté des vainqueurs lors de la Grande Guerre, et a donc bénéficié de gains territoriaux et démographiques – tous n'étant pas d'origine roumaine. Pour se protéger du revanchisme des pays contraints de céder des territoires, la Roumanie a créé un réseau d'alliances dans tous les Balkans. Ces dernières années, toutefois, le pays s'est surtout intéressé aux questions intérieures, et le gouvernement du roi Carol II a laissé ses alliances se distendre.\n$tab_dec$Alors que la situation politique européenne évolue rapidement, la Roumanie risque de se retrouver seule. Et sans défense."
 YUG_GATHERING_STORM_DESC: "La Yougoslavie est née de l'union de l'État des Slovènes, Croates et Serbes avec l'ancien royaume indépendant de Serbie, en 1922.\n$tab_dec$Au départ, la Yougoslavie a intégré la Petite Entente et le Pacte balkanique afin d'assurer son indépendance ; mais l'assassinat récent du roi Alexandre, en plus des tensions suscitées par les nationalistes à l'intérieur et par l'Italie et l'Allemagne à l'extérieur, causent des troubles et obligent à une réévaluation de sa posture politique et stratégique."
 YUG_BLITZKRIEG_DESC: "La Yougoslavie est née de l'union du royaume des Serbes, Croates et Slovènes avec l'ancien royaume indépendant de Serbie, en 1922.\n$tab_dec$Au départ, la Yougoslavie a intégré la Petite Entente et le Pacte balkanique afin d'assurer son indépendance ; mais les tensions suscitées par les nationalistes à l'intérieur et par l'Italie et l'Allemagne à l'extérieur, causent des troubles et obligent à une réévaluation de sa posture politique et stratégique."
 CHI_GATHERING_STORM_DESC: "Après la révolution qui a vu le dernier empereur Qing être déposé, la jeune république chinoise a dû lutter pour survivre. Les seigneurs de la guerre contrôlent une bonne partie des régions périphériques. Au cœur du pays, les communistes ont établi leurs bases dans une vallée reculée. Et, juste de l'autre côté des frontières, les Japonais ont établi un gouvernement fantoche dirigé par le dernier empereur pour tenter de réunir l'ensemble du pays sous son autorité.\n$tab_dec$Face à ces nombreux ennemis, le gouvernement de Chiang Kaï-chek va devoir faire des choix difficiles s'il veut survivre et gouverner la Chine."
 PRC_GATHERING_STORM_DESC: "Il y a de cela deux ans, le Parti communiste chinois a failli être totalement annihilé. Pour survivre, il s'est lancé dans un voyage épique, qui sera appelé la Longue Marche. Seule une partie de l'armée a survécu aux rigueurs du périple, et avec une industrie peu développée il n'a guère de perspectives de victoire dans la guerre civile chinoise.\n$tab_dec$Mais, avec le temps, la population pourrait être attirée par la cause communiste, de nouvelles armées pourraient être levées, de nouvelles régions tomber sous son contrôle et, lorsque le moment sera venu, la lutte révolutionnaire sera relancée – jusqu'à la victoire finale."
 CHI_BLITZKRIEG_DESC: "Après deux années de guerre contre les Japonais, les armées de Chiang Kaï-chek se sont épuisées à tenter de stopper leur avancée. L'ennemi a envahi les régions les plus riches du pays. Les démocraties occidentales n'ont fourni qu'un soutien minime, et les communistes sont réticents à affronter l'ennemi en bataille rangée.\n$tab_dec$La guerre menaçant de tourner à la catastrophe, il semble que le pire est à venir. Mais alors que l'invasion des Japonais est ralentie par l'immensité du pays, il se peut qu'ils tournent les yeux dans d'autres directions. De nouvelles alliances pourraient alors faire évoluer les choses..."
 PRC_BLITZKRIEG_DESC: "Confrontés à une invasion japonaise de grande ampleur, nationalistes et communistes ont établi une trêve précaire. Les deux camps sont conscients que le Front uni ne durera pas.\n$tab_dec$Les régions communistes autour de Yan'an sont désormais sur la ligne de front face au Japon. Les communistes doivent gérer avec une grande précaution leurs maigres ressources s'ils veulent survivre. Toute perte dans la lutte contre le Japon sera ressentie deux fois plus durement lorsque viendra le moment d'affronter les nationalistes, et c'est peut-être là-dessus que compte le gouvernement de Chiang Kaï-chek..."
 MAN_GATHERING_STORM_DESC: "Chassé du trône de l'Empire du Milieu à six ans, Puyi, le dernier empereur de Chine, guette le bon moment. Si son ancien pays est déchiré par la guerre civile, il s'est trouvé de nouveaux alliés avec les Japonais.\n$tab_dec$Pour Puyi, l'établissement de l'empire du Mandchoukouo en 1932 n'a été que la première étape dans sa quête pour reprendre son héritage ancestral. Pour le moment, il dépend de l'armée japonaise pour gouverner ; mais peut-être une occasion se présentera-t-elle pour rejeter les fers de la servitude et lui permettre de devenir celui qu'il devrait être par droit de naissance..."
 MAN_BLITZKRIEG_DESC: "Chassé du trône de l'Empire du Milieu à six ans, Puyi, le dernier empereur de Chine, guette le bon moment. Si son ancien pays est déchiré par la guerre civile, il s'est trouvé de nouveaux alliés avec les Japonais.\n$tab_dec$Pour Puyi, l'établissement de l'empire du Mandchoukouo en 1932 n'a été que la première étape dans sa quête pour reprendre son héritage ancestral. Pour le moment, il dépend de l'armée japonaise pour gouverner ; mais peut-être une occasion se présentera-t-elle pour rejeter les fers de la servitude et lui permettre de devenir celui qu'il devrait être par droit de naissance..."
 MAN_TSR_GATHERING_STORM_DESC: "L'empire de Mandchourie repose sur des fondations instables ; les Japonais l'ont fondé en 1932 pour légitimer leur autorité sur le territoire, ils ont alors nommé Puyi à sa tête en raison de sa docilité.\n\nAujourd'hui, on s'interroge sur la capacité de l'empereur à rester en retrait pendant que l'association Concordia et l'armée japonaise contrôlent l'État. Va-t-il tenter de reprendre en main son empire pour le perdre dans la foulée au profit de hors-la-loi qui veulent également s'en emparer ?"
 MAN_TSR_BLITZKRIEG_DESC: "Mandchoukouo, un État arraché du nord de la Chine par l'armée japonaise et gouverné par un empereur fantoche, fait désormais partie de la Sphère de coprospérité de la Grande Asie orientale. Reste à savoir si l'empire va demeurer propriété de l'association Concordia ou si l'empereur Puyi va réussir à en reprendre le contrôle."
 WARLORDS_GATHERING_STORM_DESC: "La faiblesse du gouvernement central pourrait permettre à un homme suffisamment ambitieux de s'élever au pouvoir. En périphérie du pays, des chefs provinciaux ont établi leurs propres fiefs, où ils n'ont que faire des ordres du gouvernement.\n$tab_dec$La guerre se rapproche, et chacun de ces seigneurs de la guerre est confronté à un même choix : la collaboration avec le gouvernement central, ou une alliance avec les communistes. L'une comme l'autre option pourraient leur permettre d'avoir leur place à la table des négociations, mais il reste aussi une troisième possibilité : s'emparer de la Chine pour eux-mêmes."
 WARLORDS_BLITZKRIEG_DESC: "La guerre avec le Japon a contraint les seigneurs de la guerre chinois à choisir un camp. Mais il ne fait aucun doute que ces alliances de circonstance ne dureront pas.\n$tab_dec$Le jour viendra où elles n'auront plus aucune utilité. Dès lors, chaque homme ambitieux et suffisamment impitoyable pour tenter de s'emparer du pouvoir en Chine pourra se relancer à nouveau dans le grand jeu."
 MEXICO_GATHERING_STORM_DESC: "Après le renversement du dictateur Porfirio Díaz, le Mexique sort de deux décennies de guerres civiles. Centralisateurs contre régionalistes, paysans et socialistes alliés contre les propriétaires d'haciendas, et luttes à propos du rôle de l'État et de l'Église, toutes ces luttes issues en droite ligne du siècle des Lumières ont dévasté le pays.\n$tab_dec$Le gouvernement séculariste est persuadé d'avoir remporté tous ces combats, mais il règne sur des ruines. Et rien ne dit que, lorsque le Mexique aura été reconstruit, ce ne sera pas un autre vainqueur qui l'aura finalement emporté."
 MEXICO_BLITZKRIEG_DESC: "Le gouvernement de Lázaro Cárdenas s'est avéré être une force de changements sociaux plus puissante que celui du président Plutarco Elías Calles, désormais exilé aux États-Unis. La situation économique est stabilisée, les compagnies pétrolières étrangères placées sous contrôle de l'État, et le gouvernement mexicain peut commencer à regarder de l'autre côté des frontières.\n$tab_dec$Les États-Unis ont des ennemis sur de nombreux fronts, et pardonneront très certainement la nationalisation de la Standard Oil. Mais peut-être ces ennemis seraient-ils des alliés plus avantageux encore ?"
 NETHERLANDS_GATHERING_STORM_DESC: "Le gouvernement néerlandais voit avec inquiétude les tensions s'aggraver sur la scène internationale. L'économie chancelante, l'important mouvement pacifiste et la certitude que la neutralité sauvera le pays (au point de détourner de lui d'éventuels alliés) empêchent toute préparation défensive.\n$tab_dec$Mais les Pays-Bas sont aussi la porte du commerce européen, aussi Britanniques et Allemands souhaitent-ils « coopérer » avec eux pour contrecarrer leurs adversaires, et pourraient considérer tout refus comme un acte d'hostilité. Peut-être un repli sur les colonies sera-t-il la seule façon de résister à une invasion ?"
 NETHERLANDS_BLITZKRIEG_DESC: "La guerre entre le Reich et les autres grandes puissances européennes semble inévitable, et si les Pays-Bas continuent de professer leur neutralité, leurs dirigeants commencent à élaborer des plans en secret avec leurs voisins du sud pour faire face aux hostilités à venir.\n$tab_dec$L'armée est mobilisée, et le travail de préparation des lignes de défense s'est accru afin que le pays soit aussi prêt que possible à se défendre contre toute atteinte à sa souveraineté. Et, en cas d'échec, il reste toujours les colonies..."
 SPAIN_GATHERING_STORM_DESC: "Au cours de ses cinq années, la fragile Seconde République espagnole a déjà fait face à des grèves, un pronunciamento et un grave soulèvement révolutionnaire. Si elle a survécu, la société espagnole continue de se complaire dans une polarisation politique et les violences entre anarchistes, communistes et phalangistes.\n$tab_dec$Les deux partis espèrent la victoire lors des élections de 1936 à venir, mais il est peu probable que la victoire d'un camp sur l'autre ramène la stabilité. Et alors que les violences ne cessent pas, les militaires attendent et font leurs propres projets..."
 SPAIN_BLITZKRIEG_DESC: "La guerre civile qui a dévasté le pays ces trois dernières années est enfin terminée. Sous l'autorité de Franco, les vainqueurs doivent désormais garantir le rétablissement du pays, l'élimination des dernières poches de résistance et la guérison des blessures nées du conflit.\n$tab_dec$Le temps n'est pas illimité, malgré tout, car le monde continue de marcher tout droit vers ce qui sera assurément une guerre plus grande et plus sanglante que jamais auparavant. Si l'Espagne veut résister à la tempête, sans parler de profiter de l'occasion, l'industrie et l'armée doivent être préparées."
 PORTUGAL_GATHERING_STORM_DESC: "Depuis l'arrivée au pouvoir de Salazar, en 1932, le Portugal est progressivement sorti de la période d'instabilité de la Première République. L'autonomie financière et l'indépendance politique par rapport aux grandes puissances ont amené la création de l'Estado Novo, qui a permis le développement industriel et la modernisation de l'armée.\n$tab_dec$Maintenant, le Portugal doit décider de son avenir. L'instabilité politique et sociale s'aggrave dans l'Espagne voisine, et les tensions internationales ne font qu'empirer de jour en jour..."
 PORTUGAL_BLITZKRIEG_DESC: "Le gouvernement conservateur de Salazar a permis au Portugal de rester neutre lors de la guerre civile espagnole, tout en soutenant activement les nationalistes pour assurer la victoire sur les communistes et les anarchistes.\n$tab_dec$La péninsule Ibérique a enfin retrouvé la stabilité, aussi est-il temps maintenant de regarder hors des frontières pour trouver des alliés et évaluer le rôle que le Portugal sera appelé à jouer dans un nouveau conflit mondial, désormais inévitable."
 LIT_GATHERING_STORM_DESC: "Alors que la Pologne cherche toujours à inclure la Lituanie dans une nouvelle République commune, que les Soviets refusent de reconnaître le droit à l'autodétermination et que les nazis sont de plus en plus menaçants dans le territoire de Memel, un vétéran de la guerre d'indépendance a juré de préserver la stabilité et l'indépendance du pays. Avec les ressources limitées dont il dispose, Antanas Smetona dirige un régime instable, tandis que les Loups de fer fascistes rôdent dans les campagnes, enragés par l'emprisonnement de leur chef Augustinas Voldemaras. La guerre menace, et la Lituanie doit défendre son peuple, quel que soit le prix à payer."
 LIT_BLITZKRIEG_DESC: "La scène est en place. Antanas Smetona s'est imposé à la tête d'une dictature et les rêves de restauration d'une République lituanienne sont devenus inaccessibles. Un accord a été trouvé avec les Soviets pour restituer Vilnius à la Lituanie lors du partage de la Pologne. Mais Smetona peut-il faire confiance à Staline et à sa sanglante machine de guerre pour respecter la souveraineté lituanienne ?"
 LAT_GATHERING_STORM_DESC: "Cela fait deux ans que le coup d'État de mai a plongé la Lettonie dans l'instabilité. Kârlis Ulmanis, autrefois Premier ministre, est désormais dictateur, et les démocrates s'opposent à ses attaques contre les libertés. L'organisation fasciste de la Pêrkonkrusts est agitée depuis l'arrestation de son meneur, Gustavs Celmiņš, et si la dictature ne met pas fin très vite à l'agitation le pays risque de sombrer dans la guerre civile.\n$tab_dec$Face aux menaces à l'est et à l'ouest, la Lettonie marche sur un fil et risque bien de disparaître."
 LAT_BLITZKRIEG_DESC: "La dépendance au commerce avec les Soviétiques dans laquelle se trouve la Lettonie s'est retournée contre la dictature. L'URSS et le Reich allemand ont fini par montrer les dents, et Ulmanis est menacé. Une mobilisation rapide est indispensable pour sauver l'indépendance du pays, sinon la dictature se trouvera contrainte de se tourner vers les Soviétiques pour quémander leur aide..."
 EST_GATHERING_STORM_DESC: "Face à la menace communiste à l'est et nazie au sud, Konstantin Päts et l'Isamaaliit se sont assurés d'un contrôle total sur le pays afin d'assurer son avenir. Des vétérans de la guerre d'indépendance se sont organisés au sein du mouvement vaps : des populistes nationalistes qui cherchent à reprendre le contrôle du pays.\n$tab_dec$L'avenir de l'Estonie est donc incertain. Päts parviendra-t-il à maintenir la paix et à imposer l'Ère du silence, ou les vapsid prendront-ils le pouvoir pour réorganiser l'État selon leurs idées ?"
 EST_BLITZKRIEG_DESC: "L'Estonie est piégée entre le péril rouge à l'est et la mer, et ne reçoit aucune aide de la part de ses alliés d'autrefois. Si la capitulation paraît inévitable, les Estoniens peuvent toujours chercher à résister, soit en supportant le joug soviétique, soit en intégrant la résistance combattant depuis les forêts."
 BUL_GATHERING_STORM_DESC: "Depuis la guerre d'indépendance et le rejet du traité de San Stefano de 1878 par les démocraties occidentales, la Bulgarie a connu de nombreux conflits et trahisons dans les Balkans. Au rang des puissances centrales vaincues lors de la Grande Guerre, elle a subi des pertes territoriales, et le traité de Neuilly lui a imposé des restrictions économiques et militaires sévères.\n$tab_dec$Mais avec les changements radicaux, aussi bien politiques que sociaux, qui surviennent en Europe, l'heure semble venue pour les Bulgares de définir leur propre voie et de trouver leur place dans les Balkans."
 BUL_BLITZKRIEG_DESC: "Au cours de ces dernières années, le tsar Boris III a consolidé son pouvoir, en dissolvant l'organisation complotiste du Zveno et en rapprochant le pays de l'Allemagne. Les dernières négociations avec les pays des Balkans ont vu le Royaume-Uni lever les restrictions militaires imposées après la Grande Guerre, dans l'espoir d'éviter que la Bulgarie n'intègre l'Axe.\n$tab_dec$Boris cherche donc maintenant à reprendre les territoires perdus par le passé, sans pour autant déclencher de conflits. Mais avec les tensions de plus en plus marquées en Europe, reste à voir s'il y parviendra..."
 GRE_GATHERING_STORM_DESC: "La Grèce est un pays en crise. Les royalistes et républicains se sont livré une lutte acharnée pour diriger le pays, qui s'est traduite par l'abolition de la IInde République hellénique en 1935. Le roi, un autocrate étranger, reste pourtant très clivant, et son avenir est pour le moins incertain.\n$tab_dec$La Grèce ainsi retenue par ses divisions internes, une Bulgarie revanchiste et déterminée à envenimer la situation au nord, tandis que l'ennemie de toujours, la Turquie, devenue tout récemment une alliée, subit une véritable métamorphose. Quant à ce monstre qui s'agite sur l'autre rive de l'Adriatique..."
 GRE_BLITZKRIEG_DESC: "Sous l'autorité implacable du dictateur Ioánnis Metaxás, la stabilité a été restaurée en Grèce. Le Plan quadriennal a permis un développement rapide de l'industrie grecque en quelques années, et la dette nationale, si elle reste élevée, semble plus facile à gérer.\n$tab_dec$Malheureusement, un gouvernement fort et le succès des politiques économiques ne préservent pas la nation de tout. Un conflit long et terrible menace, et en dépit de la volonté inflexible de Metaxás que la Grèce conserve sa neutralité quelles que soient les circonstances, il n'aura peut-être pas son mot à dire sur la question..."
 TUR_GATHERING_STORM_DESC: "La République de Turquie est née sur les décombres de l'Empire ottoman. L'indépendance a été arrachée en 1923 en versant le sang et au terme d'un conflit âpre. Si cette guerre était juste, le peuple turc continue d'en payer le prix.\n$tab_dec$Les conservateurs religieux contrôlent l'arrière-pays et s'opposent par tous les moyens possibles aux efforts de modernisation, tandis que les nationalistes kurdes suscitent des troubles dans l'Est. Le président Atatürk, adulé, doit soit parvenir à unir le pays, soit transmettre le pouvoir à quelqu'un qui le pourra. Et cela doit se faire vite, car déjà l'Europe est prise de soubresauts..."
 TUR_BLITZKRIEG_DESC: "Mustafa Kemal Atatürk est mort. La Turquie est une nation en deuil, gouvernée désormais par İsmet İnönü, un homme d'État estimé. Mais il a hérité d'un pays en proie à des divisions rendues plus visibles encore par la disparition du Père des Turcs.\n$tab_dec$Et, outre les inquiétudes liées à la situation intérieure, İnönü doit aussi faire face à la perspective de la guerre en Europe, qui risque d'être plus destructrice encore que la Grande Guerre. Atatürk a souvent insisté sur sa maxime « Paix intérieure, paix dans le monde ». İnönü pourra-t-il rester fidèle à cet esprit dans l'époque agitée qui s'annonce ?"
 ETH_GATHERING_STORM_DESC: "L'histoire de l'Éthiopie, tout comme sa dynastie impériale, remonte à des siècles. Si Haïlé Sélassié a modernisé le pays à marche forcée, cette modernisation a été interrompue par l'agression italienne, pour la seconde fois en 40 ans. L'heure est grave, mais si l'empire reste uni il est en mesure d'arrêter l'envahisseur cette fois encore.\n$tab_dec$L'Éthiopie, seul pays d'Afrique de l'Est ayant échappé à la colonisation européenne, pourra-t-elle préserver son indépendance ?"
 AFA_GATHERING_STORM_DESC: "Les Afars vivent depuis longtemps dans le désert Danakil, qui s'étend vers l'ouest depuis Djibouti, à l'est de l'Éthiopie. Cependant, l'influence de l'Italie s'est récemment étendue sur tout le pays, Mohamed Yayyo préférant Benito Mussolini à Haïlé Sélassié. \n\nAlors que la seconde guerre italo-éthiopienne fait rage, une décision doit être prise dans les plus brefs délais : l'avenir des Afars sera-t-il lié à celui de l'Italie, ou devra-t-il au contraire s'en affranchir ?"
 FIN_GATHERING_STORM_DESC: "La Finlande est un pays jeune, ayant arraché son indépendance à la Russie en 1917 seulement, au prix d'une guerre sanglante. Les blessures du conflit sont toujours bien visibles, et la coalition au gouvernement a encore du mal à fonctionner sans heurt.\n$tab_dec$L'URSS semble pour sa part lorgner les territoires finlandais proches de Léningrad. Or, le pays n'est pas préparé à un conflit, malgré sa longue histoire de valeur et de détermination militaires, et la loyauté de ses troupes.\n$tab_dec$Les tensions s'aggravent, et la guerre menace. L'avenir du pays est donc en jeu..."
 FIN_BLITZKRIEG_DESC: "Les tensions entre l'URSS et l'Allemagne nazie ne cessent de s'aggraver, et la Finlande se trouve prise entre les deux puissances. Les négociations avec Moscou ont été rompues, et le gouvernement doit faire des choix difficiles pour protéger la souveraineté nationale.\n$tab_dec$Il a été tenté d'améliorer les défenses, mais l'Armée de terre est encore sous-équipée, tandis qu'Armée de l'air et Marine ne sont qu'embryonnaires. Malgré tout, l'orgueil national des Finlandais, leur courage et leur opiniâtreté devraient jouer un grand rôle pour protéger l'indépendance du pays."
 SWE_GATHERING_STORM_DESC: "Même si elle est restée neutre lors de la Grande Guerre, la Suède a beaucoup souffert du blocus imposé par les Britanniques à l'Allemagne. Or, les tensions s'aggravent à nouveau en Europe, et les Suédois s'inquiètent de devoir souffrir d'un nouveau conflit entre grandes puissances.\n$tab_dec$Et, pendant ce temps, les sociaux-démocrates doivent trouver un équilibre délicat entre un État-providence qui permettrait d'améliorer le sort de la population, et la formation d'une armée de dissuasion crédible, capable de préserver une neutralité suédoise remontant à plus d'un siècle."
 SWE_BLITZKRIEG_DESC: "Les roulements de tambour d'un nouveau conflit roulent plus fort de jour en jour, à mesure que l'Allemagne grignote petit à petit les frontières des pays voisins. Or, cette puissance militariste dépend du minerai de fer suédois, aussi la crainte se fait-elle chaque jour plus vive que les ambitions territoriales des nazis se portent au-delà de la Baltique, en Scandinavie.\n$tab_dec$Anticipant la menace, l'armée suédoise a commencé à réarmer et se moderniser, pouvant s'appuyer pour cela sur une industrie de l'armement naissante. Reste à voir, cependant, si le pays pourra prévenir une invasion par la seule dissuasion..."
 NOR_GATHERING_STORM_DESC: "Depuis qu'elle a obtenu son indépendance de la Suède en 1905, la Norvège connaît des difficultés pour trouver un équilibre politique, et en fait qu'entrevoir la stabilité politique et économique après la crise des années 1930.\n$tab_dec$Mais ses voisins au sud s'agitent, et la guerre paraît menacer, la poussant à trouver un moyen de préserver sa fragile indépendance. Le gouvernement Nygaardsvold a fait le pari de la neutralité et du désarmement pour paraître ne menacer aucune grande puissance européenne, mais la validité de cette approche reste encore à prouver..."
 NOR_BLITZKRIEG_DESC: "Alors que le IIIe Reich gagne en puissance et s'étend, les militants fascistes norvégiens semblent décidés à tirer parti d'une possible invasion allemande pour prendre le pouvoir en collaborant avec l'ennemi.\n$tab_dec$Vidkun Quisling, larbin sans scrupule du NSDAP, semble conspirer pour s'imposer au pouvoir avec son parti, le Nasjonal Samling. Il est temps donc de lancer les préparatifs pour la guerre à venir, et pour les Norvégiens de se rassembler pour se prémunir des dangers tapis dans l'ombre – aussi bien à l'intérieur qu'à extérieur des frontières. "
 DEN_GATHERING_STORM_DESC: "Une fois encore, les tensions montent en Europe. Or, l'armée danoise est faible, et la Grande Dépression est destructrice pour l'économie.\n$tab_dec$Le Danemark doit donc trouver le moyen de réduire le chômage et les mouvements politiques extrémistes de plus en plus puissants, tout en réexaminant la politique passée de neutralité et d'apaisement.\n$tab_dec$Aujourd'hui le Danemark est toujours maître de son destin, mais pour combien de temps encore ?"
 DEN_BLITZKRIEG_DESC: "Le Danemark se trouve dans une situation précaire. Son armée est négligée et ne dispose pas des financements nécessaires, la priorité ayant jusqu'à présent été d'apaiser l'Allemagne voisine.\n$tab_dec$L'apaisement, pourtant, n'a pas empêché le Reich d'accroître sa puissance en Europe, ou de revendiquer des territoires extérieurs à ses frontières.\n$tab_dec$Le Danemark peut-il aujourd'hui encore se fier à ses principes de neutralité qui l'ont préservé des horreurs de la Grande Guerre ?"
 ICE_GATHERING_STORM_DESC: "L'histoire de l'Islande a toujours été mêlée à l'exploration et l'isolationnisme. Devenue danoise lorsque leur ancien propriétaire, la Norvège, fut contraint de rejoindre l'alliance avec la Suède en 1814, ce n'est qu'en 1919 qu'elle deviendra enfin État souverain.\n\nLa Grande Dépression n'a pas épargné ce pays éloigné, et les conflits mondiaux semblent se rapprocher jour après jour. Il est peut-être temps de se séparer du Danemark pour changer de camp."
 ICE_BLITZKRIEG_DESC: "Depuis les exigences formulées publiquement par l'Allemagne, tout indique que la situation en Europe est sur le point d'imploser et que le Danemark sera tôt ou tard pris pour cible.\n\nAinsi, l'avenir de l'Islande ne tient plus qu'à un fil. Cette nation insulaire va devoir chercher de l'aide auprès des Américains si elle tient à rester à l'écart de ce conflit inévitable."
 BRA_GATHERING_STORM_DESC: "La Grande Dépression a ruiné l'économie brésilienne, bien trop dépendante des exportations. Les années suivantes ont été marquées par des bouleversements politiques toujours plus importants ; des coalitions militaires, prolétaires et politiques ayant renversé l'oligarchie qui dirigeait le pays pour la remplacer par une constitution démocratique trop fragile.\n\nDernièrement, c’est Getúlio Vargas qui est revenu au premier plan de la scène politique brésilienne en empêchant un coup d'État communiste et en déclarant l’état d'urgence. Il reste à voir si la démocratie sera restaurée ou si Vargas conduira le pays dans une direction plus autoritaire."
 BRA_BLITZKRIEG_DESC: "Getúlio Vargas a pris le contrôle du gouvernement en suspendant tout processus démocratique. Son emprise sur le pouvoir étant assurée pour l'instant, le dirigeant brésilien s'intéresse désormais aux affaires étrangères. La guerre en Europe semble inévitable et le gouvernement redoute particulièrement une incursion argentine sur le territoire brésilien. Il ne reste qu’un rapprochement avec les États-Unis qui puisse assurer l'avenir du Brésil."
 ARG_GATHERING_STORM_DESC: "En 1930, le cabinet de Hipólito Yrigoyen a été renversé par le premier coup d'État militaire depuis l'adoption de la Constitution argentine, marquant le début de ce qui plus tard fut nommé la décennie infâme. L'Argentine doit faire face à un monde totalement bouleversé, dans lequel les grandes puissances menacent la paix fragile qui subsiste depuis la fin de la Grande Guerre.\n\nMais quelle menace est à redouter le plus ? Le cataclysme qui ravage l’Europe ? Ses propres voisins ? Ou bien les Européens eux-mêmes ? L'Argentine doit tenir bon si elle tient à s’imposer sur la scène mondiale."
 ARG_BLITZKRIEG_DESC: "Suite aux élections les plus frauduleuses de l'histoire de l'Argentine, la Concordancia maintient son hégémonie au sein du gouvernement et c’est Roberto María Ortiz qui dirige désormais le pays en tant que président.\n\nCependant, la nation doit se préparer à un déchirement inévitable, puisque les tensions montent entre les deux plus proches alliés européens de l'Argentine. De plus, le mécontentement chez les militaires ne faiblit pas, tout comme leur paranoïa, constamment alimentée par leur rival du nord, toujours endormi. L'Argentine se trouve à la croisée des chemins et va devoir réfléchir soigneusement à ses actes."
 CHL_GATHERING_STORM_DESC: "À la suite du krach de Wall Street, les États-Unis ont cessé d'importer du cuivre et du nitrate du Chili, principale source de revenus du pays. Le Chili est ainsi devenu le pays d'Amérique du Sud le plus touché par la crise économique. De plus, l'instabilité politique, qui n'a fait que s'aggraver avec la dépression, n'a toujours pas été résolue.\n\nAlors que le mandat d'Arturo Alessandri touche à sa fin, le mouvement fasciste gagne de l'ampleur et le pays n'oublie pas les coups d'État de la décennie passée, ni même la République socialiste du Chili de 1932."
 CHL_BLITZKRIEG_DESC: "Suite à la tentative de coup d'État déjouée de Jorge González von Marées et de ses compagnons Nacistas, Arturo Alessandri a présenté sa démission et Pedro Aguirre Cerda a repris sa place de président du Chili. Cependant, la menace militaire plane toujours, le général Ariosto Herrera et ses partisans vont très probablement tenter leur propre coup d'État.\n\nUne guerre se profile également à l'horizon, comme en attestent les tensions croissantes en Europe et en Asie, mais aussi en Amazonie, tout proche du cœur du Chili."
 PAR_GATHERING_STORM_DESC: "Malgré sa récente victoire contre la Bolivie lors de la guerre du Chaco, le pays est économiquement à bout de souffle et fortement militarisé. Ayala, président impopulaire et incapable de maîtriser la situation, est, avec son bras droit José Félix Estigarribia, à l'origine de la guerre.\n\nDerrière Rafael Franco et le mouvement socialiste fébrériste, l'armée semble prête à tout pour renverser le gouvernement."
 PAR_BLITZKRIEG_DESC: "Après le coup d'État fébrériste qui a permis de renverser le gouvernement libéral d'Ayala, beaucoup se tournent vers Rafael Franco pour venger la nation de ses nombreuses humiliations et frapper à nouveau la Bolivie, bien que cela semble peu probable. \n\nCertains officiers complotent déjà pour le renverser et le remplacer par Higinio Morínigo, avec l'aide de l'organisation paramilitaire Guión Rojo, afin de se rapprocher des forces de l'Axe."
 URG_GATHERING_STORM_DESC: "Suite au coup d'État uruguayen de 1933, le président Gabriel Terra a renversé son propre gouvernement, dissous le parlement, affaibli les pouvoirs constitutionnels, et imposé un régime de plus en plus autoritaire. Jusqu'ici, l'Uruguay avait été l'une des démocraties les plus progressistes d'Amérique latine, sous la houlette de José Batlle y Ordóñez et grâce à une doctrine libérale baptisée « batllisme ».\n\nLa dette extérieure n'a pas arrangé la situation politique du pays, et la République orientale se retrouve aujourd'hui engluée dans une dictature qui ne saurait durer éternellement."
 URG_BLITZKRIEG_DESC: "L'ancien dictateur Gabriel Terra a récemment cédé le pouvoir à son beau-frère, Alfredo Baldomir, également membre du Parti colorado, mais plus libéral et pro-Alliés. Sous sa direction, il semble que la nation se destine à nouveau à emprunter la voie d'une démocratie libérale, en aidant les grandes puissances à faire respecter le droit international."
 AUS_GATHERING_STORM_DESC: "L'Autriche traverse actuellement une période de tensions, encore bouleversée par le « suicide parlementaire » de 1933 suivi par l'assassinat du chancelier Engelbert Dollfuss. Limité par le traité de Saint-Germain-En-Laye et en proie à une crise économique, le gouvernement du chancelier Schuschnigg va devoir prendre des décisions cruciales. Si l'Allemagne tente une invasion, devra-t-il l'accepter, se battre jusqu'à la mort, ou bien ressusciter l'Empire d'antan ?"
 AFG_GATHERING_STORM_DESC: "Sous le règne du roi Zahir Shah et de ses oncles, l'Afghanistan entre dans une ère de stabilité relative. Mais sous la surface du royaume intemporel, la colère et de la méfiance continuent d'agiter les profondeurs. Malgré son exil actuel, certains espèrent la modernisation radicale prônée par Amanullah Khan, convaincus qu'il prépare son retour sur le trône. D'autres encore estiment que les changements amorcés à pas comptés par Zahir Shah sont déjà bien trop rapides, et souhaitent un retour aux traditions. Mais alors que le monde qui l'entoure est en proie au tourment, peut-être le peuple afghan saura-t-il s'unir pour tirer avantage de la situation."
 AFG_BLITZKRIEG_DESC: "Tandis que le roi Zahir Shah s'adapte peu à peu à son nouveau rôle, les défis qui se présentent devant lui se font de plus en plus pressants. En effet, la Grande-Bretagne, l'Allemagne et l'Union soviétique se disputent le royaume stratégique, alternant investissements et menaces d'intervention. Par ailleurs, des perturbateurs traversent les frontières avec le Raj, provoquant une agitation de part et d'autre. Mais alors que la guerre secoue à nouveau le monde, une question centrale tourmente la région : que fera l'Afghanistan ?"
 BEL_GATHERING_STORM_DESC: "La Belgique a subi des traumatismes profonds durant la Grande Guerre ; des ruines parsèment aujourd'hui encore de vastes régions de la nation, et des blessures psychologiques hantent toujours son peuple. L'avenir démocratique est bouleversé, notamment à cause des multiples accusations de corruption par des États fascistes.\n\nÀ l'échelle mondiale, la Belgique marche sur des œufs. Tiraillée d'un côté par des obligations imposées par le traité des auteurs de cette destruction, puis de l'autre par la vulnérabilité de ses terres face aux nouvelles menaces."
 BEL_BLITZKRIEG_DESC: "L'incertitude assaille toujours la Belgique, une incertitude incomparable à celle qui chamboule le monde entier à l'heure actuelle. Néanmoins la modernisation et l'expansion de son armée ont été menées à bien, et elle bénéficie désormais de fortifications aussi impressionnantes de celles de la ligne Maginot.\n\nLe gouvernement belge a délaissé ses anciennes alliances pour déclarer une neutralité absolue, mais il s'est tout de même assuré de conclure quelques accords officieux en cas d'attaque. Il surveille les armées voisines qui grandissent à vue d'œil."
 COG_GATHERING_STORM_DESC: "Encore meurtri par l'État libre du Congo et le roi Léopold II, le Congo belge s'est pourtant émancipé de ce passé trouble. Cependant, le gouvernement colonial exploite toujours la main-d'œuvre dans les mines et la ségrégation demeure bien présente, s'assurant ainsi que les autochtones ne puissent pas accéder à une éducation adéquate. Mais il reste une lueur d'espoir.\n\nLes ambitions coloniales italiennes n'ont pas faibli, et Force publique, qui s'est illustré durant la Grande Guerre, se prépare de nouveau à protéger le territoire, avec des pierres et des bâtons s'il le faut."
 COG_BLITZKRIEG_DESC: "Maintenant que la conquête de l'Abyssinie par les Italiens est terminée et que le Reich allemand s'approprie toujours plus de territoires en Europe, la situation s'annonce plus que délicate. Les ambitions coloniales italiennes s'étendent désormais au-delà de l'Afrique de l'Est, peut-être bien jusqu'à nos territoires. Hitler, de son côté, s'imagine déjà annexer la Belgique métropolitaine dans son plan de domination européenne.\n\nLa guerre viendra bientôt frapper à nos portes, à moins que nous prenions les armes les premiers..."
 PER_GATHERING_STORM_DESC: "Anciennement connue comme la Perse, la grande nation d'Iran se retrouve prise en étau entre plusieurs géants colériques. Resté neutre, l'Iran profite de l'aide du Reich allemand pour se moderniser rapidement, sous l'œil méfiant de la Grande-Bretagne et l'Union soviétique, ses anciens partenaires. En effet, malgré le risque majeur d'invasion, Reza Chah Pahlavi refuse de laisser ces deux nations empiéter sur la souveraineté iranienne.\n\nLa neutralité de l'Iran sera-t-elle respectée ? Sommes-nous prêts à protéger notre patrie contre les envahisseurs ? En l'absence de solution évidente, il est peut-être temps de s'inspirer de notre passé afin de raviver l'esprit de l'Empire perse d'autrefois..."
 IRQ_GATHERING_STORM_DESC: "Sous le règne du roi Fayçal Ier, puis de son fils, le roi Ghazi, l'Irak s'efforce de négocier les répercussions tumultueuses de la Première Guerre mondiale sous mandat britannique. La monarchie hachémite s'évertue à trouver un équilibre entre modernisation et nationalisme, mais parmi le peuple, le mécontentement gronde. Les chefs de tribus locaux rejettent l'autorité centrale et les élites urbaines réclament une plus grande indépendance vis-à-vis de l'influence britannique. De plus, les sentiments panarabes se heurtent aux identités ethniques et religieuses diverses de l'Irak, ce qui fragilise son unité. À l'heure où le monde s'apprête à basculer dans un nouveau conflit de masse, le pays oscille entre renforcement et révolte, face à un avenir aussi incertain que riche en opportunités."
 IRQ_BLITZKRIEG_DESC: "Ces dernières années, l'Irak s'est retrouvé en proie à une période d'agitation grandissante. Mené par Bakr Sidqi, le coup d'État de 1936 a fait voler en éclats l'autorité fragile de la monarchie hachémite, créant un dangereux précédent d'interférence militaire au cœur de la politique. Les tensions s'accentuent entre les chefs de tribu résistant à la centralisation, les réformateurs en quête de modernisation et l'armée enhardie par son nouveau pouvoir. Le nationalisme panarabe est en hausse, défiant l'influence britannique et nourrissant les rêves d'unité régionale. Dans un monde sombrant peu à peu dans l'instabilité, l'Irak se trouve à un moment charnière où il devra relever les défis d'un avenir incertain et d'un peuple divisé."
 PER_BLITZKRIEG_DESC: "L'Iran se retrouve confronté à un avenir tumultueux et incertain. Reza Chah Pahlavi observe avec inquiétude la guerre qui éclate en Europe, tandis que son pays se retrouve pris en tenaille entre deux acteurs majeurs semblant prêts à rejoindre le conflit.\n\nLa souveraineté de l'Iran pourrait bien se retrouver compromise si ses ressources éveillent les convoitises. Le gouvernement du Chah doit se préparer à repousser toute tentative d'invasion. Mais saura-t-il se mobiliser à temps ?"
 PHI_GATHERING_STORM_DESC: "En 1935, les États-Unis ont accepté une indépendance pacifique des Philippines sur une période de 10 ans. La nation est encore aux prémices de cette transition, mais elle prend peu à peu en main son destin.\n\nGardera-t-elle des liens amicaux avec le géant américain, ou ira-t-elle trouver un soutien extérieur pour accélérer le processus de libération ? Ce jeune pays aspire à un avenir prospère, mais gare aux vautours qui tournoient déjà au-dessus de sa tête..."
 SIA_BLITZKRIEG_DESC: "Depuis sa prise de pouvoir à la fin de l'année 1938, le Premier ministre Phibunsongkhram a remodelé le Siam à son image. Le pays a adopté un nouveau nom, la Thaïlande, ainsi qu'un nouveau credo : discipline militaire, nationalisme pan-thaï, et ambition territoriale pour les peuples de langue thaï qui se trouvent encore sous domination coloniale française et britannique.\n\nAlors que la guerre est aux portes de l'Europe et que le Japon ne cesse d'avancer en Chine, l'armée de Phibun se renforce de jour en jour. Ses ambitions ne sont un secret pour personne. La seule question est de savoir de quel côté se rangera la Thaïlande le moment venu."
 PHI_BLITZKRIEG_DESC: "Pour le moment les États-Unis ont tenu parole ; ils aident du mieux qu'ils peuvent les Philippines à accéder à l'indépendance.\n\nPendant ce temps, la guerre fait rage entre la Chine et le Japon. La nation insulaire retient son souffle, craignant que les aspirations impérialistes de ses puissants voisins ne viennent éradiquer ses efforts de liberté.\n\nLes renforts américains sont déjà présents sur le territoire, mais il est peut-être déjà trop tard. Les Japonais sont déjà sur le sentier de la conquête."
 SIA_GATHERING_STORM_DESC: "Quatre années ont passé depuis que le Khana Ratsadon a mis fin à des siècles de monarchie absolue. Le Siam fait ses premiers pas en tant qu'État constitutionnel, mais l'unité commence déjà à se fissurer : les réformistes civils rêvent de démocratie, tandis que l'armée exige force, discipline, et expansionnisme pan-thaï.\n\nCerné par les puissances coloniales françaises et britanniques, et devant la percée du Japon au nord, le Siam doit faire preuve de prudence. La tempête qui s'annonce pourrait contraindre cette jeune nation à choisir son camp... ou à trouver un moyen de survivre sans en choisir aucun."
 INS_GATHERING_STORM_DESC: "Pendant plus de trois siècles, les Indes néerlandaises ont représenté le fleuron de l'empire colonial néerlandais. Son vaste archipel, ses nombreux dialectes et ses cultures multiples vivaient en harmonie sous l'administration coloniale fermement installée.\n\nMais ces derniers temps, l'emprise de La Haye s'épuise jour après jour. Lassée des abus, la population se tourne désormais vers les nationalistes, ligués sous divers mouvements possédant chacun une vision très tranchée de l'avenir de l'Indonésie. Parviendront-ils à mettre de côté leurs divergences pour s'unir et changer le destin des Indes ?"
 INS_BLITZKRIEG_DESC: "Il y a trois ans de cela, Soetardjo et ses partisans ont demandé à La Haye d'organiser une conférence sur l'autonomie gouvernementale d'ici une dizaine d'années. La réponse leur est parvenue en novembre dernier : c'était un refus catégorique.\n\nLa réprimande avait réussi là où des années de mobilisation avaient échoué. En mai, huit des plus grandes organisations nationalistes ont mis de côté leurs différends pour s'unir au sein d'une même fédération et réclamer d'une seule voix la création d'un Parlement indonésien. L'administration coloniale a répondu comme elle l'a toujours fait, mais le Japon continue son avancée vers le sud à travers la Chine, et les Indes sont bien loin de La Haye."
