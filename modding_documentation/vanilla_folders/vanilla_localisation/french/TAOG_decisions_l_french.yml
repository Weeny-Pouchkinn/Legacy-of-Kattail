 INS_no_raids_allowed_tt: "§W§RLes raids vont être indisponibles tant que cette décision sera active.§!§!"
 INS_is_deescalating_tt: "N'est pas en cours de mission de désescalade"
 INS_escalate_the_conflict: "Aggraver le conflit"
 INS_escalate_the_conflict_desc: "Nous allons organiser des émeutes et des échauffourées avec les forces ennemies afin d'aggraver la tension et permettre à nos prochaines opérations plus sérieuses d'être ignorées par la scène internationale."
 INS_escalate_the_conflict_HOL: "$INS_escalate_the_conflict$"
 INS_escalate_the_conflict_HOL_desc: "$INS_escalate_the_conflict_desc$"
 INS_deescalate_the_conflict: "Demander une médiation internationale"
 INS_deescalate_the_conflict_2: "Ordonner un cessez-le-feu"
 INS_deescalate_the_conflict_desc: "Les Néerlandais sont loin de se montrer honnêtes dans les négociations. Ils nous considèrent toujours comme une bande de révoltés, une nuisance, et non pas comme la nation naissante que nous sommes. Les autres grandes puissances mondiales, elles, ont un tout autre point de vue, et La Haye ne pourra pas balayer leur opinion aussi facilement. Faisons appel à la communauté internationale afin qu'elle se penche sur notre cas et qu'elle nous soutienne dans notre cause."
 INS_deescalate_the_conflict_2_desc: "Nos raids ont provoqué les conséquences attendues. La garnison coloniale et La Haye savent désormais de quoi nous sommes capables. Cependant, chaque échauffourée est aux Néerlandais un prétexte pour mobiliser toujours plus de troupes et de navires. Nous ne pouvons pas assumer une guerre ouverte. Il faut ordonner à nos commandants de cesser le feu. Nous donnerons le signal pour la prochaine offensive, pas les Néerlandais."
 INS_renville_tt_HOL: "[USA.GetLeLaLNPCap] §W§Y[USA.GetFlag][USA.GetName]§! v[USA.GetAOntNP] nous lancer un ultimatum : si nous ne capitulons pas et restons en Indonésie, la §Rguerre sera déclarée§!.§!"
 INS_renville_wont_happen_neutral_tt: "Le conflit prendra fin avant l'achèvement des négociations américaines ; ils ne pourront pas intervenir."
 INS_renville_explain_USA_tt: "Si le conflit n'est pas résolu dans §Y365 jours§! :\n\n"
 INS_renville_timer_mission_republic: "Accord du Renville en cours"
 INS_renville_timer_mission_HOL: "$INS_renville_timer_mission_republic$"
 INS_national_revolution_peace_negotiation: "Négocier le retrait [FROM.GetAdjMS]"
 indonesia_reduce_escalation_1_effect_tooltip_for_min_4: "Réduit l'aggravation de §G1§! jusqu'à un minimum de §Y4§!."
 INS_ongoing_influence_process: "N'est pas déjà en train d'établir une base de milice"
 INS_current_revolution_strength_3_tt: "Cet État possède une activité de milice §Gélevée§!"
 INS_current_revolution_strength_0_tt: "Cet État ne possède aucune activité de milice"
 INS_has_spent_points_trigger_tt: "Impossible d'établir d'autres bases de milice"
 INS_national_revolution_cat: "Révolution nationale indonésienne"
 INS_national_revolution_cat_desc: "Après 350 ans de tyrannie néerlandaise, nous avons décidé de prendre en main notre destin en déclarant notre indépendance. Les Pays-Bas refusent de reconnaître notre souveraineté, préférant gouverner les Indes comme une colonie peuplée de criminels.\n\nNous devons poursuivre nos efforts et nous emparer d'autant de régions et de villes que possible pour faire imploser le gouvernement néerlandais. Néanmoins, tâchons de modérer notre rage et de planifier rigoureusement notre plan d'action : une escalade trop brutale du conflit pourrait contraindre les Néerlandais à faire appel à l'armée."
 INS_national_revolution_cat_map: "Lancer de faux soulèvements"
 INS_national_revolution_dutch_cat: "Milices révolutionnaires dans les Indes"
 INS_national_revolution_dutch_cat_desc: "Les révolutionnaires des Indes orientales viennent de déclarer leur indépendance en toute illégalité, après s'être emparés de nos régions à l'aide de milices. Malgré tous nos efforts, nous n'avons pas pu reprendre le contrôle des territoires capturés, car les forces d'opposition sont bien trop nombreuses.\n\nIl faut les arrêter avant qu'ils ne poursuivent leur conquête au point de déstabiliser l'administration coloniale tout entière. C'est peut-être radical, mais s'ils continuent ainsi, nous n'aurons pas d'autre choix que de faire appel à l'armée."
 INS_HOL_revolution_not_going_well_tt: "§RSi nous perdons Batavia, nous ne pourrons plus gouverner les Indes ; nous serons contraints de négocier la paix avec les révolutionnaires.§!"
 INS_gradual_escalation_republic: "Aggravation progressive"
 INS_gradual_escalation_HOL: "Aggravation progressive"
 INS_gradual_escalation_republic_desc: "Chacun de nos raids provoque des représailles néerlandaises toujours plus virulentes. Leurs patrouilles interviennent de nouveau dans des secteurs qu'elles avaient abandonnés et les combats ont repris dans des régions que l'on croyait gagnées. Nos pertes dépassent notre taux de recrutement. Le chaos semble s'instaurer une fois encore."
 INS_gradual_escalation_HOL_desc: "Les rapports sont désastreux : les rebelles se mettent à frapper dans des quartiers où ne nous les attendions pas, et le commandement militaire de Batavia exigent la mise en place de mesures radicales. Les partisans de la modération se font également de plus en plus rares à La Haye."
 INS_national_revolution_republic_win_ins_tt: "Les milices républicaines [INS.GetAdjFP] vont prendre §Gde facto le contrôle§! sur la région et le conflit prendra fin sur une §Gvictoire républicaine§!"
 INS_national_revolution_republic_win_hol_tt: "Les milices républicaines [INS.GetAdjFP] vont prendre §Rde facto le contrôle§! sur la région et le conflit prendra fin sur une §Rvictoire républicaine§!"
 INS_national_revolution_dutch_cat_map: "Afficher les États occupés par les milices"
 INS_take_batavia: "S'emparer de Java"
 INS_take_batavia_desc: "La cupidité des Néerlandais va provoquer leur défaite dans cette guerre : eux qui ont investi exclusivement dans Java, délaissant les îles de l'est et le reste de l'archipel, ont ainsi créé une cible à abattre. Si nous parvenons à la prendre d'assaut et à détruire les communications et les ravitaillements néerlandais, nous paralyserons leur administration et mettrons rapidement un terme au conflit."
 INS_hold_batavia_HOL: "Tenir Java"
 INS_hold_batavia_HOL_desc: "Les forces républicaines ont lancé l'opération visant à réaffecter la majeure partie de leurs forces sur Java dans le but de prendre le contrôle de la totalité de l'île. Nous devons tenir bon. Leur opération n'est pas sans risque, et c'est l'occasion de renverser leur ordre."
 INS_militias_moestopo_mission: "Moestopo demande une promotion"
 INS_militias_pki_uprising_mission: "Soulèvement communiste inéluctable"
 INS_pacific_revolution_cat: "Révolution du Pacifique"
 INS_instigate_in_country: "Inciter les [FROM.GetHabitants] à la révolution"
 INS_instigate_in_country_desc: "Même si tous les soldats coloniaux ont été chassés de notre pays, notre révolution n'a pas à s'éteindre ; les prolétaires et les paysans [FROM.GetAdjMP] subissent à l'heure actuelle la même tyrannie que nous venons d'anéantir. Ils se tournent vers nous, emplis d'espoir, sachant que l'oppresseur n'est plus invincible. Déployons nos agitateurs parmi eux, distribuons des pamphlets et finançons leurs syndicats pour éveiller la haine jusqu'à créer un terrain propice à la révolution !"
 INS_launch_revolution: "Lancer l'appel à la révolution"
 INS_launch_revolution_desc: "La situation [FROM.GetAuEnANP] [FROM.GetName] est idéale pour une révolution. Nos agents confirment l'agitation omniprésente dans les usines et les fermes, ainsi que les cellules locales prêtes à agir. Il est temps de rallier le prolétariat [FROM.GetAdjMS] et de l'aider à reprendre ses droits."
 INS_anti_colonialist_bonus: "Propager l'opinion anticolonialiste [FROM.GetAuEnANP] [FROM.GetName]"
 INS_anti_colonialist_bonus_desc: "Le peuple [FROM.GetAdjMS] se saigne au travail pour enrichir un suzerain étranger, des intérêts qui ne nous bénéficient nullement. Rappelons-lui que la soumission est un choix et que ce maître omnipotent n'est pas aussi puissant qu'il y paraît."
 INS_revolutionary_sentiment: "Coopérer avec les révolutionnaires [FROM.GetAdjMP]"
 INS_revolutionary_sentiment_desc: "Certains [FROM.GetHabitants] ont déjà pris la cause à bras le corps et la défendent bec et ongles, mais malgré leur détermination sans faille, ils manquent d'organisation et de moyens. Collaborons avec ces groupes pour accélérer la chute de l'ordre établi, même si l'instabilité qui en découle provoquera une paralysie nationale à court terme."
 INS_arm_militias: "Armer les milices [FROM.GetAdjMP] locales"
 INS_arm_militias_desc: "Les pamphlets et les discours ne suffisent pas à rendre une révolution victorieuse. Lorsque le temps sera venu, nos camarades [FROM.GetAdjMP] devront prendre les armes. Nous acheminerons clandestinement des armes et du matériel aux milices combattantes, afin de surprendre les forces d'oppression et de gagner l'avantage face à elles."
 INS_arm_militias_tt: "En cas de guerre civile, les communistes posséderont des divisions supplémentaires"
 INS_propoganda_mission: "Propager le communisme à travers [FROM.GetLeLaLNP] [FROM.GetName]"
 INS_propoganda_mission_desc: "Nous allons déployer des chefs de parti sur le territoire [FROM.GetAdjMS] afin d'établir des clubs de lecture, recruter des partisans dans les syndicats et porter le concept de révolution aux villages. Les graines que nous semons aujourd'hui porteront bientôt leurs fruits."
 INS_abandon_mission: "Abandonner la mission"
 INS_abandon_mission_desc: "Nos ressources ne sont pas inépuisables. La lutte [FROM.GetAuEnANP] [FROM.GetName] dépasse nos capacités. Nous allons donc rappeler nos agents et réorienter nos efforts là où nous en avons le plus besoin."
 INS_aslia_cat: "L'unification du Pacifique"
 INS_integrate_subject: "Intégrer [FROM.GetLeLaLNP] [FROM.GetName]"
 INS_integrate_subject_in_progress: "Est déjà en train d'intégrer une dépendance"
 INS_can_raid_here_HOL: "Cible potentielle"
 INS_can_raid_here_HOL_tt: "Cet État peut être visé par un raid terrestre de la milice républicaine. En cas de réussite, nous perdrons cet État. Pour défendre nos possessions contre les raids, nous pouvons :\n$success_modifier_INS_has_influence_mod_counterplay$\n$success_modifier_INS_defense_modifier_counterplay$\n$success_modifier_INS_naval_dominance_modifier_counterplay$\n- Augmente la §Ysupériorité aérienne§!\n- Réduit les renseignements de l'ennemi\n- Réduit la résistance dans l'État"
 INS_war_escalation_text: "£generic_war_escalation_text_icon Aggravation de la guerre : §Y[?INS.INS_war_escalation_level]§!"
 INS_war_escalation_level_tt: "§YAggravation actuelle§!\n\nLe niveau augmente au fil du temps, en fonction des milices §Yoccupant de nouveaux États§! et aussi en fonction des répliques [HOL.GetAdjMP] pour stopper ces dernières. Si la situation atteint un seuil trop élevé, elle peut se transformer en une §Rguerre totale§!."
 INS_war_escalation_1_tt: "§Y[INS.GetName]§! : déverrouille les raids terrestres"
