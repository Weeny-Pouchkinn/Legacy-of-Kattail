 AST_communism_support_text: "[?party_popularity_100@communism|Y]% de soutien au communisme"
 AST_union_control_1_cat: "Contrôle des syndicats"
 AST_union_control_1_cat_desc: "Les membres des syndicats ont commencé à mobiliser le soutien de la population d'Australie. Nous pouvons infiltrer la législation de chaque État afin d'obtenir du soutien en faveur d'un gouvernement communiste. Cela coûtera énormément de pouvoir politique et menacera de déstabiliser la nation. \n\nLes vétérans de la New Guard surveillent le moindre de nos mouvements, et si le gouvernement ne réagit pas à temps, ou si la nation devient trop instable, ce conflit pourrait littéralement déchirer le pays tout entier.\n\nSoutien au communisme : [?party_popularity_100@communism|Y]§Y%§!\n\n§RUne guerre civile éclatera si la stabilité est inférieure à 40%, ou si la révolte des vétérans expire.§!"
 AST_union_control_1_cat_name: "Choisissez où mobiliser les syndicats pour qu'ils vous soutiennent"
 AST_union_control_1_map_area_name: "États pouvant encore être influencés"
 AST_nationalizing_cat: "Nationalisation"
 AST_union_control_2_cat: "Contrôle des syndicats"
 AST_union_control_2_cat_desc: "Les travailleurs [ROOT.GetDuDelaDelNP] [ROOT.GetNonIdeologyName] n'ont pas renversé leurs oppresseurs pour que les puissances impériales continuent d'asservir nos camarades d'outre-mer. La propagation du communisme au-delà de nos frontières n'est pas seulement un but idéologique, c'est une nécessité stratégique. Nous devons attiser les flammes de la révolution à travers les océans, afin de donner de l'espoir et des ressources à ceux qui souhaitent se libérer du joug de l'impérialisme, jusqu'à ce que l'ancien ordre ne puisse plus se maintenir."
 AST_union_control_2_foreign_cat: "Réprimer le communisme"
 AST_union_control_tt: "Les syndicats doivent se développer à travers toute l'Australie, se battant contre les vétérans de la New Guard qui cherchent à stopper le communisme."
 AST_seize_local_leadership_in_state_major: "Prendre le contrôle dans la région de [FROM.GetName]"
 AST_seize_local_leadership_in_state_mid: "Prendre le contrôle dans la région de [FROM.GetName]"
 AST_seize_local_leadership_in_state_low: "Prendre le contrôle dans la région de [FROM.GetName]"
 AST_seize_local_leadership_in_queensland: "Prendre le contrôle du Queensland"
 AST_union_strike: "Organiser une grève"
 AST_union_strike_desc: "Nos travailleurs ont quitté leur lieu de travail pour réclamer de meilleures conditions et davantage de droits. Ils souhaitent ainsi faire pression sur le gouvernement en vue de nouvelles réformes."
 AST_veterans_revolt: "La révolte des vétérans"
 AST_veterans_revolt_desc: "L'armée compte dans ses rangs de nombreux anticommunistes qui appartenaient autrefois à des groupes fascistes. Ils portent en horreur les Rouges et n'ont pas peur de prendre les armes.\nSi nous tardons à mener la révolution, ou si la stabilité atteint un niveau critique, ils n'hésiteront pas à s'organiser pour empêcher notre montée au pouvoir."
 AST_organize_in_nation: "Infiltrer les syndicats [FROM.GetAuEnANP] §Y[FROM.GetName]§!"
 AST_organize_in_nation_desc: "Le mouvement ouvrier ne connaît aucune frontière. En orientant nos ressources vers les réseaux de nos camarades, nous pourrons implanter des militants communistes au sein des syndicats [FROM.GetDuDelaDelNP] [FROM.GetName], afin de renforcer le soutien populaire en faveur de la révolution au sein de la classe ouvrière."
 AST_civil_war_in_nation: "Inciter les §Y[FROM.GetHabitants]§! à la révolution"
 AST_civil_war_in_nation_desc: "Les graines que nous avons semées sont prêtes à porter leurs fruits. [FROM.GetAuEnANPCap] [FROM.GetName], le soutien au communisme a atteint un point où la révolution est à notre portée. Avec des fonds, des agitateurs, et une offensive soigneusement planifiée, nous pourrons transformer la grogne populaire en un soulèvement armé, rapprochant un peu plus [FROM.GetLeLaLNP] [FROM.GetName] de l'État ouvrier."
 AST_take_it_to_foreign_streets: "Organiser une marche de solidarité pour les travailleurs internationaux"
 AST_take_it_to_foreign_streets_desc: "Les travailleurs n'ont pas de frontière. Nous allons lancer une campagne internationale coordonnée en envoyant des militants communistes australiens dans les rues de tous les pays où notre influence s'est déjà imposée, afin de redynamiser les mouvements locaux et d'entretenir les flammes de la révolution."
 AST_take_it_to_foreign_streets_tt: "Prolonge de 60 jours la durée de l'influence du communisme étranger dans tous les pays actuellement infiltrés."
 AST_raj_locked_tt: "Le Raj ne peut pas être pris pour cible tant que la Nouvelle-Zélande, la Malaisie, la Birmanie, les Philippines et l'Indonésie ne sont pas tombées sous le joug communiste."
 AST_supply_arms_to_nation: "Fournir des armes aux §Y[FROM.GetHabitants]§!"
 AST_supply_arms_to_nation_desc: "Nous allons fournir des armes à nos camarades."
 AST_strikes_tt: "Il est possible d'achever §Y$AST_workers_educational_association$§!, §Y$AST_off_leash$§!, §Y$AST_a_national_housing_commission$§!, §Y$AST_guaranteed_employment$§! et §Y$AST_equal_pay$§! seulement si une grève est en cours."
 AST_nationalization: "Lancer la nationalisation"
 AST_nationalizing_process_tt: "Permet la décision §YLancer la nationalisation§!, qui entraîne §YNationalisation en cours§!. Cette décision est nécessaire aux priorités suivantes ; elle est retirée une fois §YL'Australie publique§! achevée. §RToutes les autres priorités seront ensuite indisponibles.§!"
 AST_nationalization_underway_tt: "§YNationalisation en cours§! \nProduction des usines : §R-30%§! \nProduction des chantiers navals : §R-30%§!"
 AST_nationalizing_process_ends_tt: "§REn choisissant cette priorité, vous rendrez inaccessibles toutes les priorités ci-dessus !§!"
