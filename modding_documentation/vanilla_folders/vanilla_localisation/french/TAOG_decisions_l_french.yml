 SIA_release_contigency_funds: "Libérer le fonds de prévoyance"
 SIA_release_contigency_funds_tt: "Modifie §Y$idea_SIA_contingency_funds$§! ainsi :\n"
 SIA_release_contigency_funds_tt2: "pendant §Y[?var:SIA_contingency_funds]§! mois. Les fonds disparaîtront à la fin de la période. Plus nous accumulons de fonds en temps de paix, plus ils dureront longtemps en temps de guerre."
 has_released_contingency_funds: "A libéré le fonds de prévoyance"
 AST_election_approaching_cat: "À l'approche des élections"
 AST_election_approaching_cat_desc: "À peine le gouvernement est-il formé que les prochaines élections approchent déjà. Les partis démocratiques s'affairent pour obtenir du soutien, dans l'espoir que cela suffira à leur assurer la victoire lorsque les bureaux de vote ouvriront et que les urnes se rempliront de bulletins."
 AST_final_reforms_mission: "Réformes finales"
 AST_final_reforms_mission_desc: "Par sa stabilité, ses idéaux conservateurs, et sa loyauté envers la Grande-Bretagne, l'UAP a renforcé son soutien et jeté les bases d'un nouveau mandat. Afin de conserver le soutien de la population, ses dirigeants devront accélérer les réformes.\n\n§YEffets durant l'activation :§!\n§W(Priorités §Ydémocratiques§!) :\nRéduction du délai de réalisation de §Y7§! jours§!"
 AST_final_reforms_effect_tt: "\nEffets tant que §Y$AST_final_reforms_mission$§! est active (§Y180§! jours) :"
 AST_labor_campaign_tour_mission: "Campagne du Labor party"
 AST_labor_campaign_tour_mission_desc: "Dans une démarche de représentation collective citoyenne, l'ALP a décidé de s'opposer à l'impérialisme et de rejeter la loyauté australienne envers l'Empire, plaçant les besoins domestiques au centre des préoccupations nationales au détriment des intérêts étrangers.\n\nAfin de transmettre cette nouvelle prise de position à l'électorat et au parti au pouvoir, l'ALP se lance dans une campagne à travers tout le pays.\n\n§YEffets durant l'activation :§!\n§WVoix quotidiennes pour l'§YALP§! : §G+0,05§!§!"
 AST_labor_campaign_tour_effect_tt: "\nEffets tant que §Y$AST_labor_campaign_tour_mission$§! est active (§Y180§! jours) :\nVoix quotidiennes pour §Yl'ALP§! : §G+0,05§!\n\nEffets dans §Y180§! jours :"
 AST_election_season_cat: "Période électorale"
 AST_election_season_cat_desc: "À peine le gouvernement en place parvient-il à prendre ses marques qu'un nouveau le remplace. Difficile de faire pencher l'opinion publique en sa faveur si près du jour fatidique, même si certains partis tenteront le tout pour le tout jusqu'au dernier moment. Rien n'est joué tant que les urnes ne sont pas ouvertes."
 AST_election_countdown: "Approche des élections"
 AST_election_countdown_desc: "Plus que quelques jours avant l'ouverture des bureaux de vote.\n\n§W$AST_expected_election_winner_tt$§!"
 AST_government_formation_period: "Période de formation du gouvernement"
 AST_government_formation_period_desc: "Tous les partis en lice rêvent de façonner librement leurs mesures, mais il se pourrait qu'un gouvernement d'union nationale s'avère nécessaire.\n\n§W§YEffets durant l'activation :§!\n£GFX_trigger_yes $AST_election_recently_concluded$\n\nLe $AST_ruling_party$ peut former un §Ygouvernement d'union nationale§!.\n\nPour former un §Ygouvernement d'union nationale§!, ouvrir la fenêtre des Élections démocratiques depuis l'arbre des priorités de l'Australie.§!"
 AST_war_is_coming_cat: "La guerre approche"
 AST_war_is_coming_cat_desc: "La tension monte, à tel point que les citoyens comme les dirigeants australiens commencent à comprendre que la guerre est inéluctable, même si cela va à l'encontre de leurs politiques et de leurs intérêts.\n\nNous devons réunir le cabinet de toute urgence pour décider de la procédure à suivre en cas d'invasion. Mais avant toute chose, il faudrait peut-être prendre des mesures qui ne plairont pas forcément à l'ensemble du cabinet."
 AST_seize_civilian_industry: "Contrôler l'industrie civile"
 AST_seize_civilian_industry_desc: "Si les biens de consommation sont une nécessité pour nos citoyens comme pour l'économie, il est évident que ces besoins se font plus pressants encore en temps de guerre. Nous devons nous tenir prêts quand la guerre éclatera."
 AST_scorch_the_north: "Brûler le nord"
 AST_scorch_the_north_desc: "Dans le cas d'une invasion par le nord, il existe des moyens d'empêcher une telle avancée, même si cela a un coût. Une politique de la terre brûlée freinerait à coup sûr le développement de nos États du nord, mais c'est peut-être la meilleure solution pour repousser nos agresseurs."
 AST_scorch_the_north_tt: "§YConséquences lors de l'invasion d'un État du nord :§!"
 AST_the_brisbane_line: "La ligne de Brisbane"
 AST_the_brisbane_line_desc: "Les moyens de défense australiens ne seront peut-être pas suffisants pour repousser complètement une agression étrangère. En adoptant une politique de défense renforcée de nos territoires essentiels uniquement, plutôt qu'une défense insuffisante partout, nous pourrons veiller à ce que les zones les plus développées et les plus peuplées [AST.GetDuDelaDelNP] [AST.GetName] restent sous notre contrôle.\n\nSi une telle politique va à l'encontre de ceux qui refusent toute forme de reddition, le gouvernement se doit de guider [AST.GetLeLaLNP] [AST.GetName] sur une voie raisonnable."
 AST_summon_the_cabinet_mission: "Convoquer le cabinet"
 AST_summon_the_cabinet_mission_desc: "Les diplomates, les hauts fonctionnaires et les plus éminents théoriciens sont conviés à Canberra pour discuter d'une éventuelle invasion."
 AST_summon_the_cabinet_tt1: "\nCet événement va perturber le gouvernement en place, allant peut-être même jusqu'à le §Yrenverser§!."
 AST_australian_accusations_modifier: "Accusations [AST.GetAdjFP]"
 AST_cabinet_trust_cat: "Confiance du cabinet"
 AST_cabinet_trust_increase_tt: "\n§GAugmente§! la §Yconfiance du cabinet§!\n"
 AST_cabinet_trust_decrease_tt: "\n§RRéduit§! la §Yconfiance du cabinet§!\n"
 AST_cabinet_trust_remove_tt: "§GRetire§! les §Yesprits nationaux confiance du cabinet§!"
 AST_australian_comforts_fund: "£BoP_right_texticon  Australian Comforts Fund"
 AST_australian_comforts_fund_desc: "Le gouvernement rendra hommage à la mémoire des victimes du crash de Canberra en investissant dans le fonds de soutien australien, un groupe de volontaires qui contribuent au bien-être des troupes.\n\nIls distribuent des commodités de toutes sortes aux soldats déployés afin de rendre leur quotidien plus agréable. C'est un excellent moyen de contribuer indirectement à l'effort de guerre !"
 AST_eminent_successors: "£BoP_right_texticon  Successeurs éminents"
 AST_eminent_successors_desc: "Parmi les victimes du crash de Canberra se trouvaient des membres très hauts placés du gouvernement. Malheureusement, nous ne pouvons pas les ramener à la vie, alors nous devrions songer à leurs remplaçants, des figures politiques éminentes qui pourraient stabiliser l'administration et restaurer la confiance des citoyens et des ministres."
 AST_critics_to_shame: "£BoP_right_texticon  Dénoncer les détracteurs"
 AST_critics_to_shame_desc: "Le crash de Canberra a bouleversé la nation tout entière, unissant tous les Australiens dans le deuil. Forcément, certains cherchent à récupérer politiquement ce drame. Mais nous n'aurons pas peur de révéler les véritables intentions des critiques aux yeux du public : une piètre tentative de semer le trouble."
 AST_approach_the_independents: "£BoP_left_texticon  Approcher les indépendants"
 AST_approach_the_independents_desc: "L'instabilité du gouvernement est de plus en plus flagrante, jour après jour. Établissons le contact avec les politiciens indépendants et tentons de les convaincre qu'un changement de cap au sein du gouvernement pourrait être bénéfique."
 AST_a_sound_voice: "£BoP_left_texticon  La voix de la raison"
 AST_a_sound_voice_desc: "Alors que la situation politique n'a jamais été aussi instable, une voix semble apaiser tous les camps. Serait-ce la voix du prochain dirigeant [AST.GetDuDelaDelNP] [AST.GetName] ?"
 AST_challenge_government_narrative: "£BoP_left_texticon  Remettre en question le discours du gouvernement"
 AST_challenge_government_narrative_desc: "Les explications données par le gouvernement concernant l'affaire du crash de Canberra sont bancales ; certains sont convaincus que des détails ont été tus. Comment un pilote expérimenté de la RAAF a-t-il pu s'écraser sans aucune condition dégradante ? Le gouvernement nous doit des réponses !"
 AST_make_a_common_enemy: "L'ennemi commun idéal"
 AST_make_a_common_enemy_desc: "Les voix de la dissension se multiplient depuis la perte tragique des membres du gouvernement dans le crash de Canberra. Les circonstances mystérieuses de l'accident sont l'un des nombreux arguments qui viennent appuyer la thèse d'une implication étrangère. Après tout, un ennemi commun peut unir les pires adversaires."
 AST_make_a_common_enemy_tt: "§RConséquences possibles de l'événement :§!"
 AST_ensure_cabinet_loyalty: "Un cabinet loyal"
 AST_ensure_cabinet_loyalty_desc: "La menace de la motion de censure est inexistante tant que la majorité du cabinet vote en faveur du gouvernement en place. Assurons-nous que le cabinet soit toujours de notre côté."
 AST_castle_crumbling_mission: "Château branlant"
 AST_castle_crumbling_mission_desc: "Au lendemain du crash de Canberra, l'Australie observe attentivement les réactions de ses dirigeants. Le gouvernement en place conservera-t-il la confiance publique malgré la perte de ses membres dans l'accident ? Ou ne vaudrait-il mieux pas un changement d'administration ?"
 AST_castle_crumbling_mission_event_tt: "§YConséquences de l'événement :§!"
 AST_castle_crumbling_mission_complete_tt: "Terminer la mission §YChâteau branlant§!"
 AST_cabinet_trust_complete_1_flag: "A pris la décision : §YL'ennemi commun idéal§!"
 AST_cabinet_trust_complete_2_flag: "A pris la décision : §YUn cabinet loyal§!"
 AST_cabinet_trust_complete_not_tt: "N'a pas choisi la priorité §YAustralia First§!"
 AST_canberra_air_disaster_flag: "$AST_canberra_air_disaster_events.1.t$"
 AST_war_angst_cat: "Crainte de la guerre"
 AST_deteriorating_prime_minister_nerves_mission: "Pression insoutenable sur le Premier ministre"
 AST_deteriorating_prime_minister_nerves_desc: "[AST.GetLeader] est en train de céder sous la pression de la guerre. Si rien n'est fait pour alléger son fardeau, notre Premier ministre risque de craquer..."
 AST_australian_demands_cat: "Exigences australiennes"
 AST_aid_australian_military_construction: "Contribuer aux constructions militaires australiennes"
 AST_aid_australian_military_construction_desc: "La Grande-Bretagne n'est pas prête à partir en guerre. Aidons l'Australie à achever ses constructions militaires pour nous laisser un peu de répit."
 AST_japanese_war_mission: "Guerre japonaise"
 AST_japanese_war_mission_desc: "L'Australie ne tient pas à affronter seule la puissance redoutable qu'est [JAP.GetLeLaLNP] [JAP.GetName]. C'est pourquoi ils nous demandent d'intervenir pour mettre fin au conflit le plus vite possible."
 AST_resource_acquisition_cat: "Acquisition des ressources"
 AST_request_resource_rights_in_indonesia: "Demander des droits sur les ressources [INS.GetAdjFP]"
 AST_request_resource_rights_in_malaya: "Demander des droits sur les ressources [MAL.GetAdjFP]"
