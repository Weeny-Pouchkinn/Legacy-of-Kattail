 SIA_poster_left_days_remaining_text: "§Y[?SIA_propaganda_left_days_remaining_flag:days_left|Y0]§! jours restants"
 SIA_poster_center_days_remaining_text: "§Y[?SIA_propaganda_center_days_remaining_flag:days_left|Y0]§! jours restants"
 SIA_poster_right_days_remaining_text: "§Y[?SIA_propaganda_right_days_remaining_flag:days_left|Y0]§! jours restants"
 SIA_propaganda_campaign_cooldown_tt: "Cette campagne sera de nouveau disponible §Y[?constant:propaganda.SIA.default_propaganda_campaign_cooldown] jours§! après son retrait."
 SIA_public_credit_repayment: "Remboursement de la dette publique"
 SIA_public_credit_repayment_tt: "Nous allons rembourser entièrement notre dette publique afin de nous libérer de tout crédit, même si les §Ybiens de consommation§! seront fortement impactés durant un certain temps."
 idea_SIA_deficit_spending: "Déficit budgétaire"
 idea_SIA_deficit_spending_desc: "Le gouvernement vit au-dessus de ses moyens, en allouant les fonds empruntés à un programme de construction accéléré. Les profits industriels sont bien réels, mais les factures arrivent à échéance."
 SIA_print_additional_money: "Imprimer plus d'argent"
 SIA_print_additional_money_tt: "Nous imprimerons encore plus d'argent pour le Japon."
 SIA_appeal_to_industrialists: "En appeler aux industriels"
 SIA_implement_industrialists_reforms_countdown: "Adopter des réformes industrialistes"
 SIA_implement_industrialists_reforms_countdown_trigger: "Construire §Y2 usines civiles§! (sans compter les usines obtenues par les priorités et le commerce)"
 SIA_appeal_to_industrialists_tt: "Nous allons bénéficier du soutien des industriels.\n\nIls nous aideront durant la guerre civile en nous fournissant du matériel supplémentaire, mais ils attendront en retour le développement de la base industrielle du pays ; nous devrons construire §Y2§! §Yusines civiles§! supplémentaires dans les §Y720 jours§! suivant la fin de la guerre civile et notre accession au pouvoir (sans compter les usines obtenues par les priorités ou le commerce).\n\nEn cas d'échec, la §Ystabilité§! et le §Ysoutien à la guerre§! seront impactés.\n\nLorsque la guerre civile éclatera, nous obtiendrons :"
 SIA_seek_support_from_constitutional_monarchists: "Demander le soutien des monarchistes constitutionnels"
 SIA_implement_constitutionalist_reforms_countdown: "Adopter des réformes constitutionalistes"
 SIA_seek_support_from_constitutional_monarchists_tt: "Nous allons bénéficier du soutien des monarchistes constitutionnels.\n\nIls nous aideront durant la guerre civile en nous fournissant des divisions supplémentaires, mais ils attendront en retour le maintien de la monarchie constitutionnelle ; nous devrons achever la priorité §Y$SIA_a_constitutional_monarchy$§! dans les §Y720 jours§! suivant notre accession au pouvoir.\n\nEn cas d'échec, la §Ystabilité§! et le §Ysoutien à la guerre§! seront impactés."
 SIA_appeal_to_rural_people: "En appeler aux populations rurales"
 SIA_appeal_to_rural_people_tt: "Nous allons bénéficier du soutien des populations rurales.\n\nElles nous aideront durant la guerre civile en nous fournissant des milices, mais elles attendront en retour la promulgation de mesures agricoles ; nous devrons achever la priorité §Y$SIA_mechanization_of_agriculture$§! ou §Y$SIA_reduction_of_agricultural_yield_taxes$§! dans les §Y720 jours§! suivant notre accession au pouvoir.\n\nEn cas d'échec, la §Ystabilité§! et le §Ysoutien à la guerre§! seront impactés.\n\nLorsque la guerre civile éclatera, nous obtiendrons :"
 SIA_implement_rural_reforms_countdown: "Adopter des réformes rurales"
 SIA_implement_absolutist_reforms_countdown: "Adopter des réformes absolutistes"
 SIA_seek_support_from_absolutists_monarchists: "Demander le soutien des monarchistes absolutistes"
 SIA_seek_support_from_absolutists_monarchists_tt: "Nous allons bénéficier du soutien des monarchistes absolutistes.\n\nIls nous aideront durant la guerre civile en nous fournissant des divisions supplémentaires, mais ils attendront en retour la restauration de la monarchie absolue ; nous devrons achever la priorité §Y$SIA_an_absolute_monarchy$§! dans les §Y720 jours§! suivant notre accession au pouvoir.\n\nEn cas d'échec, la §Ystabilité§! et le §Ysoutien à la guerre§! seront impactés."
 SIA_appeal_to_navy_clique: "En appeler à la clique navale"
 SIA_appeal_to_navy_clique_countdown: "Adopter des réformes navales"
 SIA_appeal_to_navy_clique_tt: "Nous allons bénéficier du soutien de la clique navale.\n\nElle nous aidera durant la guerre civile en nous fournissant une division marine, mais elle attendra en retour la promulgation de mesures navales ; nous devrons achever la priorité §Y$SIA_thonburi_class_coastal_defense_ship$§! dans les §Y720 jours§! suivant notre accession au pouvoir.\n\nEn cas d'échec, la §Ystabilité§! et le §Ysoutien à la guerre§! seront impactés.\n\nLorsque la guerre civile éclatera, nous obtiendrons :\n§YNotre marine tout entière§!\nLa division de marines du §Ycorps royal de la marine thaïlandaise§!\nLa technologie §YMarines§!"
 SIA_appeal_for_support_cat: "Demander du soutien"
 SIA_appeal_for_support_cat_desc: "Aucun mouvement politique ne peut gagner seul. Les monarchistes, les constitutionnalistes, les soldats et les civils exercent chacun une influence sur une partie du pays. Nous devons cultiver leur soutien si nous voulons avoir la force nécessaire pour agir le moment venu."
 SIA_demand_independence: "Demande d'indépendance pour [FROM.GetLeLaLNP] §Y[FROM.GetName]§! de la part [FROM.OVERLORD.GetDuDelaDelNP] §Y[FROM.OVERLORD.GetName]§!"
 SIA_demand_independence_VIN: "Demande de libération [VIN.GetDuDelaDelNP] §Y[VIN.GetName]§!"
 SIA_demand_independence_VIN_tt: "Nous demanderons que les pays contrôlant [VIN.GetLeLaLNP] [VIN.GetName] [VIN.GetLeLaFNP] libèrent"
 SIA_demand_independence_LAO: "Demande de libération [LAO.GetDuDelaDelNP] §Y[LAO.GetName]§!"
 SIA_demand_independence_LAO_tt: "Nous demanderons que les pays contrôlant [LAO.GetLeLaLNP] [LAO.GetName] [LAO.GetLeLaFNP] libèrent"
 SIA_demand_independence_CAM: "Demande de libération [CAM.GetDuDelaDelNP] §Y[CAM.GetName]§!"
 SIA_demand_independence_CAM_tt: "Nous demanderons que les pays contrôlant [CAM.GetLeLaLNP] [CAM.GetName] [CAM.GetLeLaFNP] libèrent"
 SIA_invite_to_adc: "Inviter [FROM.GetLeLaLNP] §Y[FROM.GetName]§! dans notre faction"
 SIA_asian_democratic_compact_cat: "Le contrat démocratique asiatique"
 SIA_asian_democratic_compact_cat_desc: "Les peuples d'Asie ont le droit de se gouverner eux-mêmes. En tant que modèle de l'autodétermination asiatique, nous pouvons faire pression sur les puissances coloniales pour qu'elles libèrent les pays qu'elles occupent."
 SIA_khana_ratsadon_cat: "Le Khana Ratsadon"
 SIA_khana_ratsadon_cat_desc: "Le Khana Ratsadon, le Parti populaire qui a mis fin à la monarchie absolue, n'est pas un monolithe. Ses branches militaires et civiles ont chacune leur propre vision pour le pays, et la tension qui règne entre elles refait surface à chaque prise de décision. Si les deux factions n'y trouvent pas leur compte, la coalition risque de se désagréger."
 SIA_army_navy_reform_cat: "Armée de terre et marine"
 SIA_army_navy_reform_cat_desc: "L'armée de terre et la marine se partagent le même ensemble limité de ressources. Allouer des fonds à l'une ou l'autre est un équilibre constant, chaque redistribution entraînant des conséquences sur la préparation de l'une ou de l'autre."
 SIA_divert_army_funds_to_navy_toggle: "[SIA_GetDivertingArmyFundsToNavyTitle]"
 SIA_divert_army_funds_to_navy_toggle_tt: "[SIA_GetDivertingArmyFundsToNavyTT]"
 SIA_divert_army_funds_to_navy_toggle_do: "Rediriger les fonds militaires vers la marine"
 SIA_divert_army_funds_to_navy_toggle_do_tt: "Nous allons réorienter les fonds destinés à l'armée de terre au profit de la marine afin d'accélérer son développement."
 SIA_divert_army_funds_to_navy_toggle_undo: "Stopper le transfert de fonds militaires vers la marine"
 SIA_divert_army_funds_to_navy_toggle_undo_tt: "Nous allons cesser de réorienter les fonds destinés à l'armée de terre au profit de la marine."
 SIA_standing_our_ground_mission: "Tenir bon"
 SIA_standing_our_ground_mission_tt: "Nous devons nous battre pour notre liberté."
 SIA_sway_generals_to_seri_thai_tt: "Les généraux rangés du côté des forces thaïlandaises libres vont nous rejoindre au début de la guerre civile, délaissant la révolte loyaliste."
 SIA_sway_general_cw_scale_tt: "Augmente notre soutien à la guerre civile de §Y5%§!\nSi le soutien est supérieur à §Y80%§!, nous nous emparerons du pouvoir sans guerre civile"
 SIA_sway_luang_chawengsaksongkhram_to_seri_thai: "Convaincre Luang Chawengsaksongkhram"
 SIA_sway_luang_chawengsaksongkhram_to_seri_thai_desc: "Ralliez Luang Chawengsaksongkhram à la cause des forces thaïlandaises libres. En cas de réussite, il nous rejoindra au début de la guerre civile."
 SIA_sway_aditya_dibabha_to_seri_thai: "Convaincre Aditya Dibabha"
 SIA_sway_aditya_dibabha_to_seri_thai_desc: "Ralliez Aditya Dibabha à la cause des forces thaïlandaises libres. En cas de réussite, il nous rejoindra au début de la guerre civile."
 SIA_sway_mangkorn_phromyothi_to_seri_thai: "Convaincre Mangkorn Phromyothi"
 SIA_sway_mangkorn_phromyothi_to_seri_thai_desc: "Ralliez Mangkorn Phromyothi à la cause des forces thaïlandaises libres. En cas de réussite, il nous rejoindra au début de la guerre civile."
 SIA_sway_luang_haansongkhram_to_seri_thai: "Convaincre Luang Haansongkhram"
 SIA_sway_luang_haansongkhram_to_seri_thai_desc: "Ralliez Luang Haansongkhram à la cause des forces thaïlandaises libres. En cas de réussite, il nous rejoindra au début de la guerre civile."
 SIA_sway_charun_rattanakun_seriroengrit_to_seri_thai: "Convaincre Charun Rattanakun Seriroengrit"
 SIA_sway_charun_rattanakun_seriroengrit_to_seri_thai_desc: "Ralliez Charun Rattanakun Seriroengrit à la cause des forces thaïlandaises libres. En cas de réussite, il nous rejoindra au début de la guerre civile."
 SIA_sway_phichit_kriangsakphichit_to_seri_thai: "Convaincre Phichit Kriangsakphichit"
 SIA_sway_phichit_kriangsakphichit_to_seri_thai_desc: "Ralliez Phichit Kriangsakphichit à la cause des forces thaïlandaises libres. En cas de réussite, il nous rejoindra au début de la guerre civile."
 SIA_sway_jira_wichitsongkhram_to_seri_thai: "Convaincre Jira Wichitsongkhram"
 SIA_sway_jira_wichitsongkhram_to_seri_thai_desc: "Ralliez Jira Wichitsongkhram à la cause des forces thaïlandaises libres. En cas de réussite, il nous rejoindra au début de la guerre civile."
 SIA_sway_phin_choonhavan_to_seri_thai: "Convaincre Phin Choonhavan"
 SIA_sway_phin_choonhavan_to_seri_thai_desc: "Ralliez Phin Choonhavan à la cause des forces thaïlandaises libres. En cas de réussite, il nous rejoindra au début de la guerre civile."
 SIA_sway_tiang_sirikhan_to_seri_thai: "Convaincre Tiang Sirikhan"
 SIA_sway_tiang_sirikhan_to_seri_thai_desc: "Ralliez Tiang Sirikhan à la cause des forces thaïlandaises libres. En cas de réussite, il nous rejoindra au début de la guerre civile."
 SIA_khana_ratsadon_dummy_military: "Risque de coup d'État militaire"
 SIA_khana_ratsadon_dummy_military_tt: "L'armée lancera un coup d'État si nous la provoquons trop. Si nous voulons éviter une guerre civile, nous ne devons pas avoir §Y$idea_SIA_military_rebellious$§! trop longtemps."
 SIA_khana_ratsadon_dummy_military_desc: "L'armée est un groupe puissant issu du Khana Ratsadon. Elle désapprouvera toute politique qu'elle jugera contraire à ses intérêts, mais approuvera tout ce qui favorisera la militarisation du pays."
 SIA_khana_ratsadon_military_coup_mission: "L'armée prévoit de renverser le gouvernement !"
 SIA_khana_ratsadon_military_coup_mission_desc: "L'armée estime que les politiques actuelles du gouvernement représentent une menace pour ses intérêts. Elle envisage sérieusement de renverser le gouvernement si sa cote de popularité ne remonte pas."
 SIA_khana_ratsadon_dummy_civilian: "Risque de coup d'État civil"
 SIA_khana_ratsadon_dummy_civilian_tt: "Le département civil lancera un coup d'État si nous le provoquons trop. Si nous voulons éviter une guerre civile, nous ne devons pas avoir §Y$idea_SIA_civilian_rebellious$§! trop longtemps."
 SIA_khana_ratsadon_dummy_civilian_desc: "Le département civil est un groupe puissant issu du Khana Ratsadon. Il désapprouvera toute politique qu'il jugera contraire à ses intérêts, mais approuvera tout ce qui est favorable à la démocratie."
 SIA_khana_ratsadon_civilian_coup_mission: "Le département civil prévoit de renverser le gouvernement !"
 SIA_khana_ratsadon_civilian_coup_mission_desc: "Le département civil estime que les politiques actuelles du gouvernement représentent une menace pour ses intérêts. Il envisage sérieusement de renverser le gouvernement si sa cote de popularité ne remonte pas."
 SIA_promote_civilian_wing: "Favoriser le département civil"
 SIA_promote_civilian_wing_desc: "Si le gouvernement offre un soutien total au programme du département civil, de ses réformes agraires, au système judiciaire et même à la constitution, nous décrocherons la gratitude de Pridi et sa faction. En revanche, un tel favoritisme ne passera pas inaperçu : les officiers militaires nous en voudront forcément, nous le faisant payer en enrayant le bon fonctionnement de l'administration."
 SIA_promote_military_wing: "Favoriser le département militaire"
 SIA_promote_military_wing_desc: "Si le gouvernement offre un soutien total au département militaire, dans le développement et la démonstration de la puissance de l'armée notamment, nous décrocherons la gratitude de Phibun et sa faction. En revanche, un tel favoritisme ne passera pas inaperçu : la routine des soldats sera perturbée et les fonctionnaires nous le feront payer en enrayant le bon fonctionnement de l'administration. À ne déclencher que pour empêcher le département de céder à la révolte."
 SIA_cultivate_civilian_wing: "Amadouer le département civil"
 SIA_cultivate_civilian_wing_desc: "La réputation engrangée grâce à la directive du palais royal va nous permettre de nous attirer doucement, mais sûrement, les faveurs du département civil. Le favoritisme sera dissimulé sous la lenteur du procédé, ce qui nous évitera les foudres de l'armée. C'est un jeu de patience, mais un jeu qui en vaut la chandelle."
 SIA_cultivate_military_wing: "Amadouer le département militaire"
 SIA_cultivate_military_wing_desc: "La réputation engrangée grâce à la directive du palais royal va nous permettre de nous attirer doucement, mais sûrement, les faveurs du département militaire. Le favoritisme sera dissimulé sous la lenteur du procédé, ce qui nous évitera les foudres des fonctionnaires. C'est un jeu de patience, mais un jeu qui en vaut la chandelle."
 SIA_end_factionalism_mission: "Garder la coalition unie"
 SIA_end_factionalism_mission_desc: "Les deux départements du Khana Ratsadon soutiennent corps et âme le gouvernement. Si nous parvenons à conserver leur §Gsoutien total§! pendant §Y270§! jours consécutifs, nous pourrons enterrer leur rivalité une fois pour toutes. Mais si jamais l'enthousiasme de l'un ou de l'autre s'estompe, nous devrons repartir de zéro."
