l_french:
 HOL_recall_conrad_helfrich: "Rappeler Conrad Helfrich des Indes"
 HOL_recall_conrad_helfrich_desc: "En ces temps difficiles, la patrie doit passer au premier plan. Conrad Helfrich, en sa qualité de meilleur amiral de la Marine royale néerlandaise, doit rentrer aux Pays-Bas."
 INS_is_taking_volksraad: "Est en train de voter une loi au Volksraad"
 INS_volksraad_cat: "Le Volksraad"
 INS_volksraad_cat_desc: "Le Volksraad, le Conseil populaire en néerlandais, a été fondé en 1918 dans le cadre de la « politique éthique » qui avait pour but de répandre la démocratie dans les Indes orientales. Néerlandais et Indonésiens y siègent après avoir été nommés d'une façon ou d'une autre. Ce corps législatif peut promulguer diverses motions et lois, mais les Pays-Bas se réservent tout de même un droit de véto à chaque projet."
 INS_volksraad_allow_language_in_schools: "Autoriser l'indonésien à l'école"
 INS_volksraad_allow_language_in_schools_desc: "L'accès à l'enseignement supérieur dans les Indes est réservé aux Néerlandais de souche et aux quelques Indonésiens suffisamment aisés pour avoir appris la langue, car on n'y parle que le néerlandais. Une motion vient d'être proposée au Volksraad pour l'ouverture d'écoles dispensant des cours en indonésien. Le gouverneur général ne s'est pas encore exprimé sur la question."
 INS_volksraad_allow_language_in_government: "Autoriser l'indonésien au gouvernement"
 INS_volksraad_allow_language_in_government_desc: "L'accès aux postes gouvernementaux des Indes exige de parler couramment le néerlandais, y compris au sein du Volksraad. Cette condition remet en question la valeur démocratique de ces institutions. À ce titre, les représentants des communautés indigènes œuvrent pour que ces postes soient également offerts à des locuteurs indonésiens lorsque c'est possible."
 INS_volksraad_remove_education_quotas: "Abolir le système de quota éducationnel"
 INS_volksraad_remove_education_quotas_desc: "Le système éducatif des Indes orientales repose sur l'emploi de quotas éducationnels, ce qui signifie qu'un certain pourcentage d'étudiants indonésiens doit être admis dans les écoles contre un certain pourcentage d'étudiants néerlandais. Cette situation a longuement été débattue au Volksraad, car elle privilégierait les étudiants néerlandais. Nous pourrions débattre encore longtemps sur cette affaire, ou alors nous pourrions abolir ce système archaïque."
 INS_volksraad_reduce_rubber_export_tax: "Réduire la taxe d'exportation du caoutchouc"
 INS_volksraad_reduce_rubber_export_tax_desc: "À l'heure actuelle, les producteurs privés de caoutchouc doivent s'acquitter d'une taxe très élevée pour exporter leurs produits, ce qui nous laisse le champ libre pour générer d'immenses bénéfices dans ce secteur. Mais cet impôt provoque une stagnation économique dans certaines régions. C'était une décision très rentable à l'époque, mais le protectionnisme de la Grande Dépression n'a pas aidé notre industrie du caoutchouc. Nous pourrions réduire la taxe afin de relancer l'économie."
 INS_volksraad_knil_rank_limit: "Adopter des lois antidiscriminatoires pour les grades militaires"
 INS_volksraad_knil_rank_limit_desc: "Aucune règle écrite ne limite en vérité les autochtones à accéder aux postes hauts placés de la KNIL, néanmoins une règle implicite semble régner, interdisant d'atteindre un rang supérieur à celui de colonel, même les plus doués d'entre eux. De nombreuses voix du Volksraad font pression sur le gouvernement afin de laisser les officiers indonésiens progresser librement au sein de l'armée."
 INS_volksraad_legalize_displaying_flag: "Légaliser l'exhibition du drapeau rouge et blanc"
 INS_volksraad_legalize_displaying_flag_desc: "Il est actuellement interdit de brandir le drapeau indonésien rouge et blanc en raison de ses liens avec les organisations nationalistes et anticolonialistes. Légaliser ce symbole prouverait à tous notre volonté de créer le dialogue tout en ralentissant la radicalisation qui se propage sur tout l'archipel."
 INS_volksraad_education_subsidies_for_indonesians: "Autoriser l'accès aux bourses d'études aux étudiants non néerlandais"
 INS_volksraad_education_subsidies_for_indonesians_desc: "Un débat anime le Volksraad depuis plusieurs semaines, portant sur les bourses accordées aux étudiants néerlandais dans les Indes orientales. Les représentants des communautés autochtones s'accordent à dire que ces aides devraient également profiter aux autres élèves, peu importe leurs origines. Ce serait un excellent moyen de nous faire bien voir auprès de la population locale, mais c'est une motion qui va nous coûter cher..."
 INS_volksraad_indonesian_national_language: "Ajouter l'indonésien aux langues nationales"
 INS_volksraad_indonesian_national_language_desc: "L'indonésien est très couramment parlé à travers tout l'archipel, car il réunit les langues régionales et donc les multiples cultures du territoire. Sachant qu'il est déjà accepté au sein de l'éducation et du gouvernement, une majorité de représentants du Volksraad considèrent qu'il serait naturel d'en faire une langue nationale, partageant ainsi le même statut que le néerlandais."
 INS_volksraad_official_flag: "Officialiser le drapeau indonésien"
 indonesia_volksraad_official_flag_effect_tt: "Nous opterons pour le drapeau rouge et blanc."
 INS_volksraad_official_flag_desc: "Les motions du Volksraad encourageant l'autonomie ont toutes été acceptées ; ce qui s'appelait jusqu'alors Indes néerlandaises orientales est désormais connu sous le nom du Dominion d'Indonésie. Changeons de drapeau afin d'entériner une bonne fois pour toutes notre libération."
 indonesia_volksraad_passed_6: "A adopté des lois antidiscriminatoires au sein de l'armée"
 INS_autonomy_indonesian_in_schools: "Langue indonésienne autorisée à l'école"
 INS_autonomy_indonesian_in_govenment: "Langue indonésienne autorisée au gouvernement"
 INS_autonomy_no_education_quotas: "Abolition des quotas dans l'éducation"
 INS_autonomy_reduced_rubber_tax: "Réduction de la taxe d'exportation du caoutchouc"
 INS_autonomy_knil_rank_limit: "Lois antidiscriminatoires adoptées au sein de l'armée"
 INS_autonomy_flag_legalized: "Légalisation de l'exhibition du drapeau rouge et blanc"
 INS_autonomy_education_subsidies: "Bourses d'études disponibles pour les Indonésiens"
 INS_autonomy_national_language: "Reconnaissance de la langue indonésienne"
 INS_autonomy_official_flag: "Utilisation du drapeau indonésien"
 INS_move_capital_to_amsterdam: "Transférer la capitale à Amsterdam"
 INS_move_capital_to_batavia: "Transférer la capitale à Batavia"
 INS_sukarno_is_dead: "Soekarno est mort"
 INS_atjeh_management: "Opération policière à Atjeh"
 INS_atjeh_management_2: "Intégrer Atjeh"
 INS_soetardjo_petition: "Attente de validation de la motion Soetardjo"
 INS_soetardjo_petition_desc: "À l'issue de la conférence organisée par Soetardjo, il a été décrété que [INS.GetLeLaLNP] [INS.GetName] doi[INS.GetTVentNP] satisfaire plusieurs objectifs économiques afin d'assurer [INS.GetSonLeurNP] autonomie. Tâchons de redoubler d'efforts pour les concrétiser, car en cas d'échec, les [HOL.GetHabitants] ne manqueront pas de s'interposer pour préserver le statu quo."
 INS_soetardjo_petition_refresh_tt: "Réactive la mission : §YAttente de validation de la motion Soetardjo§! pendant §Y120 jours§!."
 INS_soetardjo_pending: "Débat au Volksraad pour la motion Soetardjo sur l'autonomie"
 INS_soetardjo_pending_desc: "Soetardjo, un membre du Volksraad à la tête du mouvement nationaliste modéré, a soumis une motion demandant plus d'autonomie pour le territoire [INS.GetAdjMS]. Une conférence a donc été organisée entre les représentants néerlandais et indonésiens pour discuter de l'intégration de la dépendance au sein du Commonwealth néerlandais. Le Volksraad débat actuellement sur la question. À la fin des délibérés viendra notre tour de donner notre avis : les conséquences possibles de cette motion ne sont pas à prendre à la légère."
 INS_flag_legalized: "Le drapeau rouge et blanc légalisé"
 INS_owned_states_at_game_start_tt: "Tous les États indonésiens"
 INS_win_condition_base_republic_warning: "Anéantir les Indes orientales"
 INS_win_condition_base_republic_warning_desc: "Le combat continue : recrutons davantage de civils et attisons les braises de la révolte dans toute l'Indonésie. Une fois l'administration des Indes renversée, les [HOL.GetHabitants] n'auront pas d'autres choix que de se rendre."
 INS_win_condition_base_republic_real: "Anéantir les Indes orientales"
 INS_win_condition_base_republic_real_desc: "Le combat continue : recrutons davantage de civils et attisons les braises de la révolte dans toute l'Indonésie. Une fois l'administration des Indes renversée, les [HOL.GetHabitants] n'auront pas d'autres choix que de se rendre."
 will_complete_when_conditions_met_tt: "Ceci sera automatiquement sélectionné lorsque toutes les conditions seront remplies."
 INS_militias_cat: "Laskar Rakyat"
 INS_militias_basic_summon: "Mobiliser les civils"
 INS_militias_basic_summon_desc: "Grossissons les rangs des milices armées de la TKR en recrutant de jeunes adultes et des étudiants aspirant à l'indépendance de l'Indonésie."
 INS_militias_kris_repayment: "Les milices du KRIS veulent des investissements au Sulawesi"
 INS_militias_di_mission: "Le Darul Islam souhaite une représentation"
 INS_militias_jakarta_pemuda_mission: "Le Pancasila de Jakarta veut une meilleure éducation"
 INS_militias_railway_pemuda_mission: "L'AMKA veut se battre"
 INS_revolution_planning_cat: "Révolution clandestine"
 INS_revolution_planning_hq: "Établir un QG révolutionnaire [FROM.GetAuEnANP] [FROM.GetName]"
 INS_revolution_planning_hq_desc: "Nous allons fonder le quartier général de notre milice sur le territoire [FROM.GetAdjMS]. D'ici, nous coordonnerons toutes les autres bases de l'archipel. Nous placerons en priorité les missions d'infiltration sur les régions alentour afin d'affirmer notre contrôle."
 INS_revolution_planning_hq_tt: "A construit moins de §Y3§! quartiers généraux révolutionnaires"
 INS_revolution_planning_hq_DONE: "Quartier général révolutionnaire"
 INS_revolution_planning_hq_DONE_desc: "Voici notre QG révolutionnaire, le centre névralgique de nos milices. Lorsque nous déclarerons notre indépendance, cet État sera sous notre contrôle."
 INS_revolution_planning_hq_DONE_trigger_tt: "Ne peut établir qu'un seul QG"
 INS_revolution_planning_envoy_DONE_trigger_tt: "Impossible d'établir plusieurs bases dans le même État"
 INS_revolution_planning_envoy_DONE: "Base de la milice [FROM.GetAuEnANP] [FROM.GetName]"
 INS_has_revolutionary_hq: "A établi un QG révolutionnaire"
 INS_revolution_planning_influence_state: "Établir une base de la milice [FROM.GetAuEnANP] [FROM.GetName]"
 INS_revolution_planning_influence_state_desc: "Nous allons envoyer des milices dans les territoires [FROM.GetAdjMP] afin d'y établir une base, facilitant ainsi les communications entre le QG et les révolutionnaires sur place. Les opérations seront menées bien plus efficacement lorsque nous déclarerons l'indépendance."
 INS_revolution_planning_cat_map_name: "Choisir où gérer l'activité de la milice"
 INS_state_revolution_hq_tt: "Cet État sera sous notre contrôle lorsque nous déclarerons l'indépendance"
 INS_hq_warning: "§W§RPlacer notre QG ici compliquera les opérations et s'avérera coûteux.§!§!"
 INS_revolution_points_remaining_tt: "Peut construire au moins §Y1§! base de milice supplémentaire (encore §Y[?INS_revolution_points_remaining]§! restante(s))"
 INS_revolution_planning_influence_state_points_notif_tt: "Nous pourrons établir une base de milice dans §Y[?INS_starting_revolution_points_count]§! États §Rnon javanais§! supplémentaires"
 INS_revolution_planning_influence_state_points_notif_tt_1: "Nous pourrons seulement établir une base de milice dans §Y1§! État §Rnon javanais§! supplémentaire"
 INS_revolution_point_spend_tt: "Une base de la milice a été établie [FROM.GetAuEnANP] [FROM.GetName]"
 INS_revolution_points_in_state_tt: "Pas de base de milice [FROM.GetAuEnANP] [FROM.GetName]"
