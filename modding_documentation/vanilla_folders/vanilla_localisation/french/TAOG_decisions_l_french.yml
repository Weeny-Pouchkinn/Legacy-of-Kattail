 ############
 SIA_war_fervor_cat: "Ferveur militaire"
 SIA_war_fervor_cat_desc: "La soif de conflit de la population doit être surveillée de près. Sinon, la ferveur militaire risque de se retourner contre le pays. En effet, un gouvernement qui attise l'esprit martial sans le canaliser risque d'en devenir la prochaine cible."
 SIA_war_fervor_coup_dummy: "Ferveur militaire débordante"
 SIA_war_fervor_coup_dummy_desc: "Si l'enthousiasme populaire pour la guerre continue de s'amplifier sans aucune action militaire, il finira par se retourner contre nous."
 SIA_urge_restraint: "Inciter à la modération"
 SIA_war_fervor_coup: "Coup d'État imminent"
 SIA_modify_cultural_mandates: "Modifie $idea_SIA_thai_cultural_mandates$ ainsi :"
 SIA_mandate_1: "Premier décret"
 SIA_mandate_1_desc: "Le pays, le peuple et sa nationalité sont dorénavant nommés Thaïlande."
 SIA_mandate_1_tt: "§Y[THIS.GetName]§! va prendre pour nom §Y$SIA_thailand$§!."
 SIA_mandate_2: "Deuxième décret"
 SIA_mandate_2_desc: "Les Thaïlandais doivent avant tout considérer les bénéfices et la sécurité de la nation avant de s'engager dans une entreprise commerciale.\n\nLes Thaïlandais ne doivent jamais révéler des informations capitales à des étrangers ; cet acte est considéré comme haute trahison.\n\nLes Thaïlandais ne doivent jamais endosser le rôle de porte-parole des étrangers sans considérer les bénéfices pour la nation, ils ne doivent jamais exprimer d'opinion ou prendre le parti des étrangers opposés à la nation ; cet acte est considéré comme haute trahison.\n\nLes Thaïlandais ne doivent jamais acquérir de terres pour le compte d'étrangers si la transaction peut mettre en péril la nation ; cet acte est considéré comme haute trahison.\n\nLorsqu'un individu a trahi la nation, les Thaïlandais ont pour devoir d'y mettre un terme au plus vite."
 SIA_mandate_3: "Troisième décret"
 SIA_mandate_3_desc: "Il est interdit de désigner les Thaïlandais par des qualificatifs indiquant leurs origines géographiques ou religieuses.\n\nDorénavant, les Thaïlandais désignent tous les citoyens de notre nation, sans discernement."
 SIA_mandate_4: "Quatrième décret"
 SIA_mandate_4_desc: "Lorsque le drapeau national est levé ou baissé, lors du sifflet ou du clairon indiquant le salut, lors du signal donné pour lever ou baisser le drapeau – les Thaïlandais doivent saluer le drapeau conformément à nos coutumes.\n\nLorsque l'hymne national est joué, officiellement ou officieusement lors de cérémonies, tous les participants doivent saluer l'hymne conformément à nos coutumes.\n\nLorsqu'un individu ne salue pas le drapeau ou l'hymne comme convenu, les Thaïlandais doivent le réprimander afin de lui faire comprendre l'importance d'observer ce respect."
 SIA_mandate_5: "Cinquième décret"
 SIA_mandate_5_desc: "Les Thaïlandais doivent consommer des produits alimentaires d'origine thaïlandaise autant que possible.\n\nLes Thaïlandais doivent porter des vêtements d'origine thaïlandaise autant que possible.\n\nLes Thaïlandais doivent soutenir les efforts agricoles, commerciaux, industriels, ainsi que toutes les autres entreprises menées par leurs compatriotes.\n\nLes Thaïlandais doivent utiliser autant que possible les fournisseurs d'énergie nationaux ou originaires de Thaïlande.\n\nLes Thaïlandais entreprenant un effort agricole, commercial, industriel ou tout autre effort soutenu par ce décret doivent tout mettre en œuvre pour proposer une qualité toujours meilleure et gérer leur entreprise avec intégrité."
 SIA_mandate_6: "Sixième décret"
 SIA_mandate_6_desc: "La musique de l'hymne national sera composée par Phra Chenduriyang et consignée au Département des Beaux-Arts.\n\nLes paroles seront produites par l'armée."
 SIA_mandate_7: "Septième décret"
 SIA_mandate_7_desc: "Les Thaïlandais doivent contribuer à l'édification de la nation. Chaque individu bien portant doit poursuivre une carrière stable. Les sans-emploi n'apportent rien à la nation et ne méritent pas le respect des Thaïlandais."
 SIA_mandate_8: "Huitième décret"
 SIA_mandate_8_desc: "Les paroles de l'hymne royal seront réduites ; les mentions du Siam seront remplacées par la Thaïlande."
 SIA_mandate_9: "Neuvième décret"
 SIA_mandate_9_desc: "Les Thaïlandais doivent honorer et glorifier le thaïlandais, et le pratiquer comme un privilège.\n\nLes Thaïlandais ont pour devoir d'étudier la langue nationale et d'être capables de la lire et l'écrire ; ils doivent également venir en aide aux citoyens qui ne sont pas encore dotés de ces facultés.\n\nLes Thaïlandais ne font pas du lieu de naissance ou de résidence ni de l'accent régional, un marqueur de division. Il doit être considéré que tous les citoyens nés sur le territoire de la Thaïlande sont égaux entre eux.\n\nLes Thaïlandais ont pour devoir de se conduire comme bons citoyens et d'inciter ceux qui n'exercent pas ce devoir convenablement à devenir à leur tour des citoyens exemplaires de la nation thaïlandaise."
 SIA_mandate_10: "Dixième décret"
 SIA_mandate_10_desc: "Les Thaïlandais ne doivent pas se présenter dans des lieux publics sans porter une tenue convenable. Les tenues inappropriées incluent le port du sarong, l'unique port de sous-vêtements, ou encore le torse nu.\n\nLes tenues convenables incluent les uniformes (dans la limite du rang), la mode de bonne société internationale, la mode de bonne société traditionnelle."
 SIA_mandate_11: "Onzième décret"
 SIA_mandate_11_desc: "Les Thaïlandais doivent diviser leur temps en trois parts égales : le travail, la vie privée et le repos. Elles doivent être réalisées de manière logique et programmée jusqu'à en faire une habitude.\n\nLes Thaïlandais doivent réaliser quotidiennement les activités suivantes : manger quatre repas à des horaires réguliers et dormir entre 6 et 8 heures.\n\nAu travail, les Thaïlandais doivent réaliser leurs tâches sans les éluder. La pause-déjeuner du midi ne doit pas excéder l'heure. À la fin d'une journée de travail, les Thaïlandais doivent faire de l'exercice, ou toute autre activité indiquée (jardinage, soins des animaux, etc.) pendant au moins une heure. Ensuite, ils doivent prendre une douche et dîner.\n\nLes Thaïlandais passent leur temps libre en soirée pour accomplir les tâches ménagères, discuter avec des amis ou de la famille, se cultiver en écoutant la radio, en lisant un livre ou grâce à toute autre forme d'art disponible."
 SIA_mandate_12: "Douzième décret"
 SIA_mandate_12_desc: "Dans les lieux publics, les Thaïlandais ont pour devoir de protéger et porter secours aux enfants, aux personnes âgées et aux personnes en situation de handicap.\n\nLe respect du peuple thaïlandais tout entier revient de droit à celui ou celle qui suit ce décret."
 SIA_movie_theater_cat: "$SIA_sala_chaloem_thai_movie_theater$"
 SIA_movie_theater_cat_desc: "Le grand écran fait partie des outils les plus puissants de l'État moderne. En choisissant soigneusement ses films et ses campagnes de propagande, le gouvernement peut façonner l'opinion publique, attiser le patriotisme, et étouffer les voix dissidentes."
 SIA_celebrating_the_constitution: "Célébrer la constitution"
 SIA_the_revolution_of_24th_june: "La Révolution siamoise de 1932"
 SIA_suppressing_the_rebellion_of_1933: "Réprimer la rébellion de 1933"
 SIA_the_king_of_krung_thon: "Le roi de Krung Thon"
 SIA_blood_of_suphan: "Le sang de Suphan"
 SIA_thai_soldiers_blood: "Le sang des soldats thaïlandais"
 SIA_undauntedly_love_nation: "Nation vénérable"
 #LIMITED WAR
 SIA_limited_war_cat: "Guerre limitée"
 SIA_limited_war_cat_desc: "Nous ne pouvons pas espérer rivaliser avec les grandes puissances de la région lors d'une guerre ouverte. Du moins, pas encore. En appuyant nos revendications petit à petit, par le biais de campagnes soigneusement ciblées, nous rognons progressivement leur position, tout en continuant de nous renforcer."
 SIA_start_limited_war_indochina: "Lancer une guerre limitée en Indochine contre [FROM.GetLeLaLNP] [FROM.GetName]"
 SIA_start_limited_war_indochina_tt_main: "Déclare une §Yguerre limitée§! contre [FROM.GetLeLaLNP] §Y[FROM.GetName]§!.\nSi nous parvenons à contrôler tous les États en surbrillance appartenant aux §Y[FROM.GetHabitants]§!, nous pourrons nous les approprier sans provoquer une guerre totale.\n§RPerdre plus de [?var:global.limited_war_surrender_threshold|%.0] de capitulation nous fera perdre la guerre§!\n\n§REn cas de défaite, nous serons peut-être contraints de rendre des territoires conquis§!"
 SIA_start_limited_war_rejoin_faction: "Nous allons quitter temporairement notre faction avant de la rejoindre de nouveau à la fin de la §Yguerre limitée§!."
 SIA_start_limited_war_can_join_faction: "Nous pourrons rejoindre une faction à la fin de la §Yguerre limitée§!."
 is_not_engaged_in_a_limited_war: "N'est pas en §Yguerre limitée§!"
 SIA_limited_war_indochina: "[SIA_GetLimitedWarTarget]"
 SIA_limited_war_indochina_desc: "Prenons le contrôle de tous les États en surbrillance pour remporter la §Yguerre limitée§! et nous les approprier sans provoquer une guerre totale.\n§RPerdre plus de [?var:global.limited_war_surrender_threshold|%.0] de capitulation nous fera perdre la guerre limitée.§!"
 SIA_limited_war_indochina_target: "En §Yguerre limitée§! contre : §Y[?var:limited_war_target.GetName]§!"
 SIA_limited_war_indochina_no_target: "Échec de la guerre limitée"
 SIA_start_limited_war_malaysia_burma: "Lancer une guerre limitée contre [FROM.GetLeLaLNP] [FROM.GetName]"
 SIA_new_territories_administration_cat: "Administration des nouveaux territoires"
 SIA_new_territories_administration_cat_desc: "La conquête n'est que le commencement. Les territoires dont nous nous sommes emparés doivent être administrés, développés et protégés s'ils veulent faire partie intégrante de la nation, plutôt que d'être un fardeau qui invite à la reconquête."
 SIA_finish_the_triangular_defense_network: "Achever le réseau de défense triangulaire"
 SIA_finish_the_triangular_defense_network_desc: "Maintenant que les forteresses du Nord et du Sud sont érigées, il ne reste plus qu'à les relier à Bangkok pour dresser notre réseau de défense triangulaire. Si jamais l'un des trois pôles venait à tomber, les deux autres assureraient notre protection."
 has_built_fortress_saigon: "A bâti la forteresse de Saïgon"
 has_built_fortress_hanoi: "A bâti la forteresse de Hanoï"
 SIA_develop_phibunsongkhram: "Développer [1067.GetName]"
 SIA_develop_southern_indochina: "Développer le sud de l'Indochine"
 SIA_develop_northern_indochina: "Développer le nord de l'Indochine"
 SIA_develop_northern_malaya: "Développer Si Rat Malai"
 SIA_develop_eastern_burma: "Développer Saharat Thai Doem"
 SIA_use_abandoned_french_tools: "Utiliser l'outillage français abandonné"
 SIA_use_abandoned_french_tools_desc: "Les Français ont laissé plusieurs machines dans nos territoires. Récupérons-les !"
 SIA_fortress_saigon: "Forteresse de Saïgon"
 SIA_fortress_saigon_desc: "Le nord de notre nouvel empire sera protégé par Hanoï. Les montagnes et le fleuve rouge formeront des remparts naturels qui repousseront l'envahisseur."
 SIA_fortress_hanoi: "Forteresse de Hanoï"
 SIA_fortress_hanoi_desc: "Le sud de l'empire sera protégé par Saïgon. Cette ville fortifiée veillera sur Bangkok et toute la baie du Golfe [ROOT.GetDuDelaDelNP] [ROOT.GetName]."
