 AST_request_resource_rights_in_indochina: "Demander des droits sur les ressources d'Indochine française"
 AST_resource_request_ongoing_flag: "Demande de ressources §Yen cours§!"
 AST_australia_first_movement_cat: "Mouvement Australia First"
 AST_summons_to_australian_hall: "Convocation à l'Australian Hall"
 AST_summons_to_australian_hall_desc: "Dans le cadre du développement du parti [AST.GetFascistParty], il nous faut rallier nos partisans. Tous à l'Australian Hall !"
 AST_summons_to_australian_hall_upgrade: "$AST_summons_to_australian_hall$"
 AST_summons_to_australian_hall_upgrade_desc: "$AST_summons_to_australian_hall_desc$"
 AST_print_the_publicist: "Imprimer The Publicist"
 AST_print_the_publicist_desc: "The Publicist – le bulletin d'information officiel d'Australia First – cherche à atteindre un maximum d'individus pour convertir de nouveaux partisans. Imprimons un nouveau numéro pour étendre notre influence."
 AST_print_the_publicist_upgrade: "$AST_print_the_publicist$"
 AST_print_the_publicist_upgrade_desc: "$AST_print_the_publicist_desc$"
 AST_call_on_fascists: "[GET_AST_CALL_ON_FASCISTS]"
 AST_call_on_fascists_desc: "Australia First est un modeste mouvement, avec peu de partisans, ainsi certaines fins de mois sont compliquées. Par chance, un groupe étranger partageant nos idéaux est prêt à mettre la main au portefeuille pour assurer notre campagne."
 AST_call_on_japanese_fascists: "Faire appel aux fascistes japonais"
 AST_call_on_foreign_fascists: "Faire appel aux fascistes étrangers"
 AST_a_convenient_disaster: "Une catastrophe opportune"
 AST_a_convenient_disaster_desc: "Quelle que soit la cote de popularité d'Australia First, les conservateurs s'opposeront toujours à son idéologie. Si le parti souhaite vraiment accéder au pouvoir, de simples élections ne suffiront pas ; il faut provoquer un véritable chambardement au gouvernement.\n\nNotre mouvement n'a pas la capacité d'y parvenir seul, mais ce n'est pas le cas de notre soutien fasciste étranger. En nous aidant à accéder au pouvoir, les fascistes étrangers pourront compter sur [AST.GetLeLaLNP] [AST.GetName]."
 AST_a_convenient_disaster_tt: "\nCet événement va perturber le gouvernement en place, permettant ainsi au parti §Y[AST.GetFascistParty]§! de devenir le parti au pouvoir."
 AST_a_convenient_disaster_flag: "Le §YCrash de Canberra§! a été déclenché via la décision : §YUne catastrophe opportune§!."
 AST_insufficient_funds_mission: "$AST_insufficient_funds$"
 AST_sufficient_funds_tt: "Fonds suffisants (atteint dans §Y[?AST_insufficient_funds:days_left]§! jours)"
 AST_sufficient_funds_tt_2: "§GObtient§! des fonds suffisants"
 AST_lose_sufficient_funds_tt_100: "§RPerd§! des fonds suffisants (pendant §Y100§! jours)\n"
 AST_lose_sufficient_funds_tt_50: "§RPerd§! des fonds suffisants (pendant §Y50§! jours)\n"
 AST_insufficient_funds: "Fonds insuffisants"
 AST_afm_decisions_fascism_upgrade_tt: "\nAugmente le gain de soutien quotidien au fascisme obtenu grâce aux §Ydécisions du mouvement Australia First§!.\n\n"
 AST_afm_decisions_autonomy_upgrade_tt: "\nAugmente le gain d'autonomie obtenu grâce aux §Ydécisions du mouvement Australia First§!.\n\n"
 AST_vichy_out_of_africa_cat: "Chasser Vichy d'Afrique"
 AST_demand_madagascar: "Exiger Madagascar"
 AST_demand_central_africa: "Exiger l'Afrique centrale"
 AST_demand_southwestern_territories: "Exiger les territoires du sud-ouest"
 AST_vichy_req_ongoing_flag: "Demande de territoires §Yen cours§!"
 AST_remove_vichy_out_of_africa_decisions: "\nRetire les décisions §YChasser Vichy d'Afrique§!.\n"
 AST_big_business_pact_cat: "Pacte des grandes entreprises"
 AST_big_business_request_ongoing_flag: "Demande des grandes entreprises §Yen cours§!"
 AST_naval_expansion: "$NOR_alt_dem_naval_expansion$"
 AST_naval_expansion_desc: "Des hommes d'affaires éminents ont accepté d'investir dans des réformes industrielles en accord avec les idéaux du parti [ROOT.GetFascistParty], à condition que ce dernier promulgue des mesures à leur avantage.\n\nIl faut développer la flotte [AST.GetAdjFS] si nous voulons espérer faire le poids face aux grandes puissances navales. Toute la main-d'œuvre va être redirigée vers les chantiers navals pendant un certain temps afin d'accélérer la production de navires."
 AST_factory_conversions: "Conversions d'usines"
 AST_factory_conversions_desc: "Des hommes d'affaires éminents ont accepté d'investir dans des réformes industrielles en accord avec les idéaux du parti [ROOT.GetFascistParty], à condition que ce dernier promulgue des mesures à leur avantage.\n\nNotre industrie militaire doit prendre la priorité sur les autres, c'est pourquoi il faut convertir les usines australiennes."
 AST_land_development: "Développement du territoire"
 AST_land_development_desc: "Des hommes d'affaires éminents ont accepté d'investir dans des réformes industrielles en accord avec les idéaux du parti [ROOT.GetFascistParty], à condition que ce dernier promulgue des mesures à leur avantage.\n\nNos terres sont sous-développées industriellement. Développons les régions rurales pour bâtir l'avenir."
 AST_electrical_grid_expansions: "Développement du réseau électrique"
 AST_electrical_grid_expansions_desc: "Des hommes d'affaires éminents ont accepté d'investir dans des réformes industrielles en accord avec les idéaux du parti [ROOT.GetFascistParty], à condition que ce dernier promulgue des mesures à leur avantage.\n\nDéveloppons notre réseau électrique pour accroître notre production énergétique domestique et nous passer des importations."
 AST_factory_investments: "Investissements industriels"
 AST_factory_investments_desc: "Des hommes d'affaires éminents ont accepté d'investir dans des réformes industrielles en accord avec les idéaux du parti [ROOT.GetFascistParty], à condition que ce dernier promulgue des mesures à leur avantage.\n\nPour assurer un flux constant de biens militaires et civils en temps de guerre, il faut développer notre capacité industrielle."
 AST_develop_port_kemla_steel_medium_decision: "Construire un second haut-fourneau à Port Kembla"
 AST_develop_port_kemla_steel_medium_decision_desc: "La productivité de Port Kembla avec un seul haut-fourneau est déjà très satisfaisante, mais la demande a grimpé en flèche ces derniers temps, tant et si bien que nous avons pour projet d'en construire un second. Nous pourrons ainsi doubler la production d'acier de la région."
 AST_prospect_pilbara_iron_decision: "Ouvrir Pilbara à la prospection"
 AST_prospect_pilbara_iron_decision_desc: "La région de Pilbara renferme d'immenses réserves de fer, les plus importantes au monde. Seulement, cette zone reculée exige des investissements colossaux pour être exploitée... Enfin, les bénéfices en valent sûrement le prix."
 AST_scale_up_pilbara_mines_steel_decision: "Agrandir les mines de Pilbara"
 AST_scale_up_pilbara_mines_steel_decision_desc: "Maintenant que la région de Pilbara est ouverte à la prospection minière, il faut faire venir les gros investisseurs !"
 AST_pilbara_mining_tt: "Ouvrir davantage le §Y$STATE_870$§! à la prospection permettra d'augmenter la production d'acier autant de fois que souhaité."
 AST_scale_up_middleback_mines_steel_decision_1: "Développer la mine d'Iron Knob"
 AST_scale_up_middleback_mines_steel_decision_1_desc: "La mine d'Iron Knob ne date pas d'hier, et avec la demande en fer toujours plus grande, il est temps de la développer."
 AST_scale_up_middleback_mines_steel_decision_2: "Ouvrir la mine d'Iron Monarch"
 AST_scale_up_middleback_mines_steel_decision_2_desc: "La mine d'Iron Knob ne parvient pas à répondre à la demande. Par chance, la chaîne montagneuse de Middleback est truffée de fer : nous allons ouvrir la plus grande mine du territoire !"
 AST_scale_up_middleback_mines_steel_decision_3: "Ouvrir la mine d'Iron Prince"
 AST_scale_up_middleback_mines_steel_decision_3_desc: "La demande en métaux a explosé depuis le début de la guerre. Heureusement, Middleback est une source intarissable."
 AST_expand_iron_mining_tt: "Posséder §Y$AST_exports_for_economic_recovery$§! et §Y$AST_within_reach$§! permet l'exploitation de la région de Pilbara du §Y$STATE_870$§!, offrant l'accès à une source intarissable d'§Yacier§!. Usons de cette aubaine pour relancer l'économie."
 AST_develop_port_kemla_steel_tt: "Permet la décision §YConstruire un second haut-fourneau à Port Kembla§!, ce qui augmentera considérablement notre production d'§Yacier§!."
 AST_develop_middleback_tt: "Donne accès à trois décisions permettant de développer notre production d'§Yacier§! en §Y$STATE_519$§!"
 AST_expand_planned_extraction_pilbara_tt: "§Y$AST_planned_extraction$§! permet l'exploitation de la région de Pilbara du §Y$STATE_870$§!, offrant l'accès à une source intarissable d'§Yacier§!. Usons de cette aubaine pour relancer l'économie."
 AST_ireland_weapon_smuggling_cat: "Armer les Irlandais"
 AST_smuggle_arms_to_ireland: "Contrebande d'armes en Irlande"
 AST_smuggle_arms_to_ireland_desc: "Nous devons donner aux Irlandais les armes dont ils auront besoin pour combattre les Anglais."
 AST_smuggle_arms_to_ireland_ongoing_flag: "Contrebande d'armes §Yen cours§!"
 AST_smuggle_arms_to_northern_ireland: "Contrebande d'armes en Irlande du Nord"
 AST_smuggle_arms_to_northern_ireland_desc: "Si nous parvenons à fournir assez d'armes à l'Irlande du Nord et à établir des liens assez solides avec l'Irlande, alors nous pourrons faire en sorte qu'elle s'unisse à l'Irlande avant que les Britanniques n'aient le temps d'intervenir."
 AST_northern_ireland_rises_up: "Soulèvement en Irlande du Nord"
 AST_specialize_on_jungle_combat: "Focalisation sur les combats dans la jungle"
 AST_specialize_on_desert_combat: "Focalisation sur les combats dans le désert"
 AST_switch_combat_specialization: "Changer de spécialisation au combat"
 AST_special_forces_cat: "Entraînement des forces spéciales"
 AST_you_can_switch_sf: "Vous pourrez changer de spécialisation."
 AST_training_camps_specialization: "Nos camps d'entraînement garantissent un entraînement spécialisé à nos troupes, afin de les rendre plus efficaces sur différents terrains."
 # Formables
 AST_australasia_flag: "L'§YAustralasie§! a été formée"
 AST_australia_formables_category: "L'Australasie"
 AST_australia_formables_category_desc: "Les racines [AST.GetDuDelaDelNP] [AST.GetName] nous lieront pour toujours aux terres du Sud, pour autant nous sommes désormais un peuple dont l'avis compte sur la scène internationale. Nous avons grandi, toujours et encore. C'est pourquoi notre nation doit adopter un nouveau nom, un titre qui reflète cette croissance. [AST.GetLeLaLNPCap] [AST.GetName] n'était qu'un cocon. Nous émergeons aujourd'hui de notre chrysalide et déployons nos ailes et notre nouveau nom : l'Australasie."
 AST_form_australasia: "Former l'Australasie"
 AST_form_australasia_malenesia_required_states_tt: "Contrôle tous les États de §YMélanésie§!."
 AST_form_australasia_new_zealand_required_states_tt: "Contrôle tous les États [NZL.GetDuDelaDelNP] §Y[NZL.GetNonIdeologyName]§!."
 AST_form_australasia_malenesia_core_states_tt: "Tous les États de §YMélanésie§! deviennent des États nationaux."
