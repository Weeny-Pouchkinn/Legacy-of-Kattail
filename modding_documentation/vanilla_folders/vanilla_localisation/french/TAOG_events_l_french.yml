 ### INS - Political Events
 INS_political_events.1.t: "Le nouveau gouverneur général [INS.GetDuDelaDelNP] [INS.GetName]"
 INS_political_events.1.desc: "Le mandat quinquennal de [INS.GetLeader] touche à sa fin, aussi nous devons trouver un successeur digne de ce poste. La reine Wilhelmine recommande personnellement Alidius Tjarda van Starkenborgh Stachouwer, une figure qui a déjà fait ses preuves aux postes d'ambassadeur extraordinaire et de ministre plénipotentiaire."
 INS_political_events.1.a: "Si tel est le souhait de la reine"
 INS_political_events.1.b: "[INS.GetLeader] fait du bon travail : il mérite un autre mandat"
 INS_political_events.2.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] exig[FROM.GetEEntNP] le [721.GetName]"
 INS_political_events.2.desc: "Le nouveau gouvernement républicain en place dans les Indes vient de déclarer l'archipel tout entier sous son contrôle. Dans la foulée, [FROM.GetLeader] nous a fait parvenir une lettre officielle exigeant la cession du [721.GetName], faute de quoi une intervention militaire sera ordonnée."
 INS_political_events.2.a: "Ça n'en vaut pas la peine"
 INS_political_events.2.b: "C'est hors de question !"
 INS_political_events.3.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] accept[FROM.GetEEntNP] de céder le [721.GetName]"
 INS_political_events.3.desc: "[FROM.GetLeader] a cédé à notre ultimatum, comme nous nous y attendions ; ses troupes quittent le [721.GetName] en ce moment même. Les troupes de la TKR investissent déjà la région, escortées par des émissaires gouvernementaux. [INS.GetLeader] a scellé cet événement historique d'un discours proclamé à Dili, déclarant la libération des influences coloniales."
 INS_political_events.3.a: "Merveilleux !"
 INS_political_events.4.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] refus[FROM.GetEEntNP] de céder le [721.GetName]"
 INS_political_events.4.desc: "Les négociations avec les [FROM.GetHabitants] ne se sont pas déroulées comme prévu : après avoir catégoriquement refusé de céder le [721.GetName], [FROM.GetLeader] a quitté les lieux en trombe."
 INS_political_events.4.a: "Alors, c'est la guerre !"
 INS_political_events.5.t: "Les élections indonésiennes"
 INS_political_events.5.desc: "Aujourd'hui, l'Indonésie franchit un cap : au lendemain de la révolution, le Premier ministre, [INS.GetLeader], a annoncé les toutes premières élections démocratiques libres indonésiennes. L'issue de ce vote marquera les esprits pour les générations à venir."
 INS_political_events.5.a: "Soetan Sjahrir doit continuer de guider le pays"
 INS_political_events.5.b: "Amir Sjarifuddin est le compromis entre socialistes et nationalistes"
 INS_political_events.5.c: "Mohammad Hatta a lancé la révolution, c'est lui qui l'achèvera"
 INS_political_events.6.t: "Rétributions"
 INS_political_events.6.desc: "Maintenant que la révolution bat son plein, nos guérilléros infiltrés dans l'administration des Indes peuvent lutter au grand jour : qu'ils déploient leurs missions de sabotage au plus vite, avant même que les Néerlandais aient le temps de réagir."
 INS_political_events.6.a: "Ne perdons pas un instant !"
 INS_political_events.7.t: "La motion Soetardjo"
 INS_political_events.7.desc: "Les négociations sur la motion du Volksraad emmenée par Soetardjo viennent de se terminer. La mesure, formulant la volonté des Indonésiens à jouir d'une plus grande autonomie, est désormais entre les mains du gouverneur général, qui donnera ou non son accord. Certains conseillers insistent pour que cette motion soit rejetée, néanmoins il faut reconnaître que les mouvements nationalistes prennent de l'ampleur et se montrent de plus en plus radicaux. À force de refuser systématiquement toutes leurs demandes pacifiques, les nationalistes finiront par se tourner vers des méthodes plus violentes."
 INS_political_events.7.a: "Évitons une guerre civile : négocions !"
 INS_political_events.7.b: "Rien ne changera, un point c'est tout !"
 INS_political_events.7.c: "Les nationalistes ont peut-être raison"
 INS_political_events.8.t: "Occupation [?event_target:INS_invasion_event_invader.GetAdjFS] imminente"
 INS_political_events.8.desc: "Des soldats [?event_target:INS_invasion_event_invader.GetAdjMP] ont pris d'assaut [?event_target:INS_invasion_event_invaded_state.GetLeLaLNP] [?event_target:INS_invasion_event_invaded_state.GetName]. Nos forces, totalement dépassées, ont reçu l'ordre d'évacuer totalement la région. Les [?event_target:INS_invasion_event_invader.GetHabitants] poursuivent leur percée dans les Indes ; l'occupation semble désormais inévitable."
 INS_political_events.8.a: "Arrêtons les nationalistes, défendons nos terres !"
 INS_political_events.9.t: "Déclaration d'indépendance indonésienne"
 INS_political_events.9.desc: "Alors que les troupes [JAP.GetAdjFP] se retirent graduellement des Indes orientales, nos soldats se sont rendus à Batavia pour rétablir le gouvernement colonial. À leur grande surprise, le paysage politique de la région a totalement changé. C'est en entrant dans la ville qu'ils ont découvert que [INS.GetLeader] a signé une déclaration d'indépendance proclamant la République d'Indonésie comme une nation souveraine, sous la clameur de la foule réunie en masse !"
 INS_political_events.9.a: "Envoyons les chars !"
 INS_political_events.9.b: "Évitons le conflit : nous devons rebâtir la nation"
 INS_political_events.11.t: "Les [HOL.GetHabitants] reconnaissent la souveraineté de l'Indonésie"
 INS_political_events.11.desc: "Au moment de la déclaration d'indépendance, nos milices se sont immédiatement postées aux frontières du pays pour empêcher l'invasion néerlandaise. Finalement, à la surprise générale, [HOL.GetLeader] a affirmé qu'aucune action armée n'aura lieu, préférant focaliser ses ressources sur la reconstruction de la patrie [HOL.GetAdjFS]."
 INS_political_events.11.a: "On ne s'y attendait pas"
 INS_political_events.12.t: "Entretien avec les nationalistes indonésiens"
 INS_political_events.12.desc: "Nos troupes ont investi les terres [?event_target:INS_invasion_event_invaded_state.GetAdjFP] ; la victoire est imminente. En attendant ce jour glorieux, tâchons d'organiser l'occupation de l'Indonésie. Une occupation totale permettrait l'obtention de toutes les ressources que nous convoitons, néanmoins l'opération sera coûteuse et difficile. Nous allons plutôt opter pour un pacte avec Soekarno, un révolutionnaire qui guidera la nation sous l'égide de son parti, mais qui sera en réalité sous notre contrôle. Ainsi, les Indonésiens ne feront pas de vagues, et l'occupation nous demandera beaucoup moins d'efforts et de moyens."
 INS_political_events.12.a: "Poursuivons les négociations avec ce Soekarno"
 INS_political_events.12.b: "Nous ne collaborons pas avec les révolutionnaires"
 INS_political_events.13.t: "Occupation [?event_target:INS_invasion_event_invader.GetAdjFS] imminente"
 INS_political_events.13.desc: "Des soldats [?event_target:INS_invasion_event_invader.GetAdjMP] ont pris d'assaut [?event_target:INS_invasion_event_invaded_state.GetLeLaLNP] [?event_target:INS_invasion_event_invaded_state.GetName]. Nos forces, totalement dépassées, ont reçu l'ordre d'évacuer totalement la région. Les [?event_target:INS_invasion_event_invader.GetHabitants] poursuivent leur percée dans les Indes ; l'occupation semble désormais inévitable. D'autre part, nos espions affirment avoir surpris [?event_target:INS_invasion_event_invader.GetLeader] en pleines négociations avec Soekarno et des chefs de file nationalistes, dans le but de former un État fantoche indonésien sous le joug de la Sphère de coprospérité."
 INS_political_events.13.a: "Arrêtons les nationalistes, défendons nos terres !"
 INS_political_events.13.b: "C'est peut-être notre meilleure chance d'obtenir l'indépendance"
 INS_peta_explain_tt: "Nous pourrons profiter du chaos de l'occupation pour déclarer notre indépendance si [JAP.GetLeLaLNP] [JAP.GetName] [JAP.GetEstSontNP] repoussé[JAP.GetXENP]."
 INS_peta_explain_tt_jap: "§R[INS.GetLeLaLNPCap] [INS.GetName] [INS.GetAOntNP] beau être un pays loyal, si nous commençons à perdre le contrôle des territoires, il ne faudra pas s'étonner de voir les [INS.GetHabitants] déclarer leur indépendance§!."
 INS_political_events.14.t: "Arrestation des chefs de file nationalistes"
 INS_political_events.14.desc: "La police militaire néerlandaise a appréhendé Soekarno et les chefs de file révolutionnaires avant la mise en place de l'État fantoche en Indonésie."
 INS_political_events.14.a: "Dommage, c'était une bonne idée"
 INS_political_events.15.t: "Les défenseurs de la patrie"
 INS_political_events.15.desc: "Les négociations avec Soekarno étant enfin conclues, le régime fantoche indonésien s'installe progressivement. Notre collaborateur a fait appel à ses contacts pour aider notre armée à déstabiliser le gouvernement néerlandais et s'emparer dans le même temps de l'archipel."
 INS_political_events.15.a: "En plus des ressources, nous gagnons un allié !"
 INS_political_events.16.t: "Occupation [?event_target:INS_invasion_event_invader.GetAdjFS] des Indes"
 INS_political_events.16.desc: "Les forces [?event_target:INS_invasion_event_invader.GetAdjFP] stationnées dans les Indes se sont alliées aux nationalistes indonésiens pour déstabiliser notre administration coloniale et prendre le contrôle du territoire. Des étendards indonésiens ont remplacé les drapeaux néerlandais ; la population locale semble accueillir à bras ouverts l'envahisseur [?event_target:INS_invasion_event_invader.GetAdjMS]. Voilà qui entache sérieusement l'image de notre empire colonial."
 INS_political_events.16.a: "Ils ne s'en sortiront pas si facilement"
 INS_political_events.17.t: "[INS.GetLeLaLNPCap] [INS.GetName] déclar[INS.GetEEntNP] [INS.GetSonLeurNP] indépendance"
 INS_political_events.17.desc: "Le quartier général impérial a reçu quelques nouvelles en provenance de Batavia. Soekarno et sa clique, que nous avons nous-mêmes mis à la tête des îles au nom de l'empereur, ont proclamé la République [FROM.GetAdjFS] en réponse à nos nombreuses pertes territoriales, estimant que nous n'avions plus les ressources nécessaires pour agir."
 INS_political_events.17.a: "C'est bien possible, malheureusement"
 INS_political_events.18.t: "Retour de Tan Malaka en Indonésie"
 INS_political_events.18.desc: "Tan Malaka, le communiste indonésien qui a officié ces dernières années comme fidèle conseiller de notre gouvernement, a annoncé son départ immédiat. Puisque [INS.GetLeLaLNP] [INS.GetName] [INS.GetEstSontNP] maintenant une république indépendante, il envisage de rentrer enfin dans le pays qu'il a quitté en tant que fugitif il y a plus de vingt ans. Il nous remercie de l'avoir accueilli et de lui avoir permis de continuer à travailler, mais il soutient que l'heure est venue de retourner dans son pays natal."
 INS_political_events.18.a: "Nous lui souhaitons bon retour et bonne continuation"
 INS_political_events.19.t: "[HOL.GetLeLaLNPCap] [HOL.GetName] rappell[HOL.GetEEntNP] l'amiral Helfrich"
 INS_political_events.19.desc: "Nous avons appris à [1058.GetName] que l'amiral Conrad Helfrich, commandant de nos forces navales et officier le plus compétent de notre état-major, a reçu l'ordre de rentrer dans son pays. La Haye invoque des besoins urgents dans la métropole, sans plus d'explications. Son départ affecte considérablement les défenses de l'archipel à un moment où notre position est loin d'être assurée, sans parler du moral des troupes dans le carré des officiers de Surabaya."
 INS_political_events.19.a: "C'est un jour sombre pour la flotte"
 ### INS - Industrial Events
 INS_industrial_events.4.t: "Réallocation budgétaire [FROM.FROM.GetAdjFS]"
 INS_industrial_events.4.desc: "La fermeture des plantations de caoutchouc [FROM.FROM.GetAuEnANP] [FROM.FROM.GetName] libère un budget conséquent à réinvestir dans des projets industriels."
 INS_industrial_events.4.a: "Creusons-y des puits à pétrole"
 INS_industrial_events.4.b: "Ouvrons-y une fonderie à aluminium"
 INS_industrial_events.4.c: "Prospectons pour des ressources qui nous manquent"
 INS_industrial_events.4.d: "Ouvrons-y des mines de charbon"
 INS_industrial_events.5.t: "[INS_industrial_events_5_t_scripted]"
 INS_industrial_events_5_t_colonial: "Le sort de la De Javasche Bank"
 INS_industrial_events_5_t_independent: "Le sort de la Banque d'Indonésie"
 INS_industrial_events.5.desc: "[INS_industrial_events_5_desc_scripted]"
 INS_industrial_events_5_desc_colonial: "Les réserves de la De Javasche Bank n'ont jamais été aussi basses en dix ans. Le florin dégringole jour après jour, et les propriétaires des plantations exigent d'être payés en devises étrangères. D'après nos conseillers économiques, la banque ne pourra pas se relever seule d'un tel déclin. Pour autant, aucun ne semble être d'accord sur la solution."
 INS_industrial_events_5_desc_independent: "D'après la Banque d'Indonésie, la roupie a perdu près d'un cinquième de sa valeur en moins d'un trimestre. Les marchands de riz de Surabaya refusent désormais notre devise, préférant les monnaies étrangères. Le ministre des Finances assure qu'il est encore possible de sauver la roupie, mais il faut agir vite et sans hésitation."
 INS_industrial_events.5.a: "Renforçons le florin plutôt que de le remplacer"
 INS_industrial_events.5.b: "Indexons le florin des Indes sur le florin néerlandais"
 INS_industrial_events.5.c: "Indexons le florin des Indes sur le dollar américain"
 INS_industrial_events.6.t: "Un accord bien profitable"
 INS_industrial_events.6.desc: "Le Kinabureau accepte notre marché. Sachant que la malaria dévaste la majorité des tropiques et qu'aucun substitut à la quinine n'a encore été trouvé, il n'avait de toute façon pas le choix. Cet accord nous confère désormais une marge beaucoup plus généreuse sur les bénéfices engendrés par l'exportation de notre quinine. Reste à savoir où réinvestir toute cette fortune."
 INS_industrial_events.6.a: "Réinvestissons dans nos villes"
 INS_industrial_events.6.b: "Développons les îles extérieures"
 INS_industrial_events.6.c: "Renforçons notre industrie militaire"
 # Rubber shipment dispatched
 INS_industrial_events.28.t: "Départ d'une cargaison de caoutchouc"
 INS_industrial_events.28.desc: "Le navire a chargé la dernière palette de caoutchouc avant de prendre la mer. Nos acheteurs auront ce qui leur a été promis, et nous recevrons très bientôt la maigre somme convenue. Nous nous souviendrons de cette transaction comme d'un dû que nous exige impassiblement la dépression."
 INS_industrial_events.28.a: "Très bien"
 INS_industrial_events.28.b: "Organisons un nouveau convoi"
 # Oil shipment dispatched
 INS_industrial_events.36.t: "Départ d'une cargaison de pétrole"
 INS_industrial_events.36.desc: "Les pétroliers viennent de quitter nos raffineries pour réaliser leurs livraisons aux ports prévus. Nos acheteurs auront ce qui leur a été promis, et nous recevrons très bientôt la maigre somme convenue. Ainsi va le monde en ces temps de récession."
 INS_industrial_events.36.a: "Très bien"
 INS_industrial_events.36.b: "Organisons un nouveau convoi"
 ### INS - Volksraad
 INS_volksraad_events.2.t: "[HOL.GetLeader] interdit la motion du Volksraad"
 INS_volksraad_events.2.desc: "Malgré l'approbation de [INS.GetLeader], [HOL.GetLeader] a apposé son véto sur la promulgation de la motion du Volksraad. Nous ne pouvons donc rien faire de plus..."
 INS_volksraad_events.2.a: "Réessayons plus tard"
 # Generic/Reused
 INS_volksraad_events.10.t: "Motion du Volksraad autorisant l'indonésien à l'école"
 INS_volksraad_events.10.desc: "[INS.GetLeader] a approuvé la motion du Volksraad visant à ouvrir sur le territoire des écoles et des universités dispensant des cours en indonésien. Le projet a été transmis au bureau de [HOL.GetLeader] afin d'obtenir également son feu vert."
 INS_volksraad_events.10.a: "Le Volksraad fait du bon travail"
 INS_volksraad_events.10.b: "Hors de question !"
 INS_volksraad_events.11.t: "L'indonésien autorisé à l'école"
 INS_volksraad_events.11.desc: "La motion vient d'être validée par [HOL.GetLeader] ! Sa promulgation devrait avoir lieu d'ici quelques jours, dès que les derniers détails seront réglés."
 INS_volksraad_events.11.a: "Le Volksraad fait du bon travail"
 # Individual laws
 INS_volksraad_events.20.t: "Motion du Volksraad autorisant l'indonésien au gouvernement"
 INS_volksraad_events.20.desc: "L'accès aux postes gouvernementaux des Indes exige de parler couramment le néerlandais, y compris au sein du Volksraad. Cette condition remet en question la valeur démocratique de ces institutions. À ce titre, les représentants des communautés indigènes œuvrent pour que ces postes soient également offerts à des locuteurs indonésiens lorsque c'est possible."
 INS_volksraad_events.21.t: "L'indonésien autorisé au sein du gouvernement"
 INS_volksraad_events.21.desc: "La motion vient d'être validée par [HOL.GetLeader] ! Sa promulgation devrait avoir lieu d'ici quelques jours, dès que les derniers détails seront réglés."
 INS_volksraad_events.30.t: "Motion du Volksraad abolissant le système de quota éducationnel"
 INS_volksraad_events.30.desc: "[INS.GetLeader] a approuvé la motion du Volksraad visant à abolir le système de quotas au sein de l'éducation [INS.GetAdjFS], mettant un terme aux inégalités. Le projet a été transmis au bureau de [HOL.GetLeader] afin d'obtenir également son feu vert."
 INS_volksraad_events.31.t: "Abolition du système de quota éducationnel"
 INS_volksraad_events.31.desc: "La motion vient d'être validée par [HOL.GetLeader] ! Sa promulgation devrait avoir lieu d'ici quelques jours, dès que les derniers détails seront réglés."
 INS_volksraad_events.40.t: "Motion du Volksraad réduisant la taxe d'exportation du caoutchouc"
 INS_volksraad_events.40.desc: "[INS.GetLeader] a approuvé la motion du Volksraad visant à réduire la taxe imposée aux plantations de caoutchouc privées. Cet impôt a permis au gouvernement de jouir d'un monopole très lucratif sur ce matériau durant de nombreuses années. Cependant, depuis la généralisation du protectionnisme à travers le monde, ce monopole est en perte de vitesse. D'après [INS.GetLeader], cette taxe provoque aujourd'hui plus de mal que de bien."
 INS_volksraad_events.40.a: "[INS.GetLeader] a raison"
 INS_volksraad_events.40.b: "Nous n'abolirons pas la taxe"
 INS_volksraad_events.41.t: "Réduction de la taxe d'exportation du caoutchouc"
 INS_volksraad_events.41.desc: "La motion vient d'être validée par [HOL.GetLeader] ! Sa promulgation devrait avoir lieu d'ici quelques jours, dès que les derniers détails seront réglés."
 INS_volksraad_events.60.t: "Motion du Volksraad pour lever le plafond de verre sur les officiers indonésiens"
 INS_volksraad_events.60.desc: "[INS.GetLeader] a approuvé la motion du Volksraad visant à supprimer la limite implicite sur les postes que peuvent occuper des officiers non néerlandais au sein de la KNIL et à promouvoir ceux qui sont restés attachés à des postes inférieurs à leur rang. Le projet a été transmis au bureau de [HOL.GetLeader] afin d'obtenir également son feu vert."
 INS_volksraad_events.61.t: "Fin du plafond de verre pour les généraux [INS.GetAdjMP]"
 INS_volksraad_events.61.desc: "La motion vient d'être validée par [HOL.GetLeader] ! Sa promulgation devrait avoir lieu d'ici quelques jours, dès que les derniers détails seront réglés."
 INS_volksraad_events.70.t: "Motion du Volksraad pour légaliser l'exhibition publique d'imagerie nationaliste"
 INS_volksraad_events.70.desc: "[INS.GetLeader] a approuvé la motion du Volksraad visant à autoriser l'affichage de drapeaux et imagerie nationalistes dans les lieux publics [INS.GetAdjMP], dans l'espoir de limiter la radicalisation de nombreux jeunes nationalistes. [INS.GetLeader] affirme que nous devons prendre des mesures préventives en coopérant avec les chefs de file modérés tout en évinçant les mouvements révolutionnaires. L'issue de la situation dépendra de nous dans tous les cas."
 INS_volksraad_events.71.t: "Le drapeau rouge et blanc se dresse fièrement !"
 INS_volksraad_events.71.desc: "La motion vient d'être validée par [HOL.GetLeader] ! Sa promulgation devrait avoir lieu d'ici quelques jours, dès que les derniers détails seront réglés."
 INS_volksraad_events.100.t: "Motion du Volksraad pour autoriser l'accès aux bourses d'études aux étudiants non néerlandais"
 INS_volksraad_events.100.desc: "[INS.GetLeader] a approuvé la motion du Volksraad visant à autoriser l'accès aux bourses pour les étudiants [INS.GetAdjMP]. Le projet a été transmis au bureau de [HOL.GetLeader] afin d'obtenir également son feu vert."
 INS_volksraad_events.101.t: "Bourses d'études ouvertes à tous"
 INS_volksraad_events.101.desc: "La motion vient d'être validée par [HOL.GetLeader] ! Sa promulgation devrait avoir lieu d'ici quelques jours, dès que les derniers détails seront réglés."
 ### INS - Dutch Interaction Events
 INS_dutch_events.1.t: "[INS.GetLeLaLNPCap] [INS.GetName] souhait[INS.GetEEntNP] commander notre marine"
 INS_dutch_events.1.desc: "Au lendemain de la perte de notre mère patrie, les [INS.GetHabitants] ont proposé de prendre le contrôle de nos forces navales présentes sur le territoire. Selon eux, une centralisation du commandement faciliterait la coordination, un atout indéniable en cette période trouble."
 INS_dutch_events.1.a: "Si c'est pour la bonne cause, acceptons"
 INS_dutch_events.1.b: "Nos navires resteront fidèles à La Haye"
 INS_dutch_events.2.t: "[HOL.GetLeLaLNPCap] [HOL.GetName] accept[HOL.GetEEntNP] notre proposition"
 INS_dutch_events.2.desc: "Les [HOL.GetHabitants] ont accepté de nous céder le commandement de leurs forces navales. La passation a débuté sans encombre pour le moment : les officiers [HOL.GetAdjMP] et [INS.GetAdjMP] travaillent main dans la main pour renforcer notre position dans le Pacifique."
 INS_dutch_events.2.a: "Nous dominerons le Pacifique ensemble"
 INS_dutch_events.3.t: "[HOL.GetLeLaLNPCap] [HOL.GetName] refus[HOL.GetEEntNP] notre proposition"
 INS_dutch_events.3.desc: "Les [HOL.GetHabitants] ont rejeté l'idée de nous céder le commandement de leurs forces navales pour une marine unifiée, prétextant des difficultés logistiques et administratives. C'est une déception qui ne nous empêchera pas de collaborer en ces temps de guerre pour autant."
 INS_dutch_events.3.a: "Nous renforcerons notre marine autrement"
 INS_dutch_events.4.t: "[HOL.GetLeLaLNPCap] [HOL.GetName] fond[HOL.GetEEntNP] le programme naval [HOL.GetAdjMS]-[INS.GetAdjMS]"
 INS_dutch_events.4.desc: "Les [HOL.GetHabitants] viennent d'annoncer la mise en place du programme naval [HOL.GetAdjMS]-[INS.GetAdjMS], une entreprise conjointe visant à restructurer et développer nos forces maritimes. L'expertise [HOL.GetAdjFS] couplée à la main-d'œuvre [INS.GetAdjFS] est la rencontre parfaite pour bâtir un nouveau réseau de défense dans le Pacifique."
 INS_dutch_events.4.a: "Nous garantissons notre survie"
 ### INS - Netherlands–Indonesia Union Events
 INS_union_events.1.t: "[HOL.GetLeLaLNPCap] [HOL.GetName] souhait[HOL.GetEEntNP] installer son gouvernement à [1058.GetName]"
 INS_union_events.1.desc: "Comme leur mère patrie a été perdue, les [HOL.GetHabitants] nous ont annoncé qu'ils avaient choisi [1058.GetName] pour y accueillir leur gouvernement et leur famille royale. Cette décision assurerait la survie de leur royaume, là où leur nation défend toujours un territoire."
 INS_union_events.1.a: "La guerre se poursuivra à [1058.GetName]"
 INS_union_events.1.b: "Jamais de la vie ! Ils cherchent à reformer les colonies !"
 INS_union_events.2.t: "[INS.GetLeLaLNPCap] [INS.GetName] accept[INS.GetEEntNP] la migration du gouvernement"
 INS_union_events.2.desc: "Les [INS.GetHabitants] ont accepté d'accueillir notre gouvernement en exil à [1058.GetName]. La relocalisation est déjà en cours et les administrations sont en train de trouver des moyens d'intégrer les divers cabinets et tout le personnel. Ensemble, nous gardons la flamme du royaume ardente depuis l'Orient."
 INS_union_events.2.a: "Nous sommes un front uni face à l'ennemi"
 INS_union_events.3.t: "[INS.GetLeLaLNPCap] [INS.GetName] refus[INS.GetEEntNP] la migration du gouvernement"
 INS_union_events.3.desc: "Les [INS.GetHabitants] ont tout simplement refusé d'accueillir notre gouvernement à [1058.GetName]. [INS.GetLeader] a ajouté qu'il était impossible pour une nation autant sous tension que la leur de satisfaire une telle demande."
 INS_union_events.3.a: "Ils ont donc oublié notre passé commun"
 INS_union_events.4.t: "[HOL.GetLeLaLNPCap] [HOL.GetName] réaffect[HOL.GetEEntNP] son armée à [1058.GetName]"
 INS_union_events.4.desc: "Les premiers convois viennent de terminer leur périple depuis la mère patrie. Des navires remplis d'officiers, de soldats et de ce qui reste de notre arsenal. Malheureusement, certains bâtiments n'ont pas atteint leur destination ; il fallait s'y attendre. Ce qui parviendra jusqu'ici, à [1058.GetName], formera la fondation de notre armée."
 INS_union_events.4.a: "Tant que le drapeau flotte dans le ciel !"
 # INS proposed union
 INS_union_events.5.t: "[INS.GetLeLaLNPCap] [INS.GetName] propos[INS.GetEEntNP] l'union néerlando-indonésienne"
 INS_union_events.5.desc: "Ce n'est un secret pour personne : l'issue de la guerre ne penche pas en notre faveur. Notre pays capturé, nous avons dû nous retrancher en Orient. Les ministres [INS.GetAdjMP] viennent justement de nous proposer la fondation d'une union conjointe, menée par la reine Wilhelmine, une union centrée sur la coopération totale. C'est une proposition qui n'enchante absolument personne, mais c'est peut-être l'unique moyen de nous en sortir."
 INS_union_events.5.a: "Prenons le risque : vive la reine !"
 INS_union_events.5.b: "Impossible d'accepter"
 INS_union_events.6.t: "[HOL.GetLeLaLNPCap] [HOL.GetName] accept[HOL.GetEEntNP] l'unification"
 INS_union_events.6.desc: "À la suite d'un débat exceptionnel au sein du cabinet, [HOL.GetLeader] a finalement accepté la proposition [INS.GetAdjFS]. Le décret a été très vite expédié, mais à partir d'aujourd'hui, nos gouvernements agiront d'un seul corps, et ce jusqu'à la fin de la guerre."
 INS_union_events.6.a: "Un accord historique pour tous !"
 INS_union_events.7.t: "[HOL.GetLeLaLNPCap] [HOL.GetName] refus[HOL.GetEEntNP] l'unification"
 INS_union_events.7.desc: "Le conseil [HOL.GetAdjMS] vient de rejeter l'idée d'une unification entre nos nations. Même s'ils refusent catégoriquement de brader leur souveraineté, les [HOL.GetHabitants] souhaitent tout de même poursuivre la coopération."
 INS_union_events.7.a: "Ça n'aurait jamais pu marcher"
 # HOL proposed union
 INS_union_events.8.t: "[HOL.GetLeLaLNPCap] [HOL.GetName] propos[HOL.GetEEntNP] l'union néerlando-indonésienne"
 INS_union_events.8.desc: "Ce n'est un secret pour personne : l'issue de la guerre ne penche pas en notre faveur. Après la capture de leur mère patrie, les [HOL.GetHabitants] ont dû se retrancher en Orient. Les ministres [HOL.GetAdjMP] viennent justement de nous proposer la fondation d'une union conjointe, menée par la reine Wilhelmine, une union centrée sur la coopération totale. C'est une proposition qui n'enchante absolument personne, mais c'est peut-être l'unique moyen de nous en sortir."
 INS_union_events.8.a: "S'il le faut, acceptons"
 INS_union_events.8.b: "Ils cherchent à reformer les colonies !"
 INS_union_events.9.t: "[INS.GetLeLaLNPCap] [INS.GetName] accept[INS.GetEEntNP] l'unification"
 INS_union_events.9.desc: "Les [INS.GetHabitants] ont accepté l'unification. L'avenir n'a jamais été aussi incertain, mais ce qui est sûr, c'est que l'effort de guerre ne pourra être accompli que par la coopération."
 INS_union_events.9.a: "L'entraide sera notre salut"
 INS_union_events.10.t: "[INS.GetLeLaLNPCap] [INS.GetName] refus[INS.GetEEntNP] l'unification"
 INS_union_events.10.desc: "Les [INS.GetHabitants] ont refusé l'unification, ne voyant absolument pas la réalisation d'une telle entreprise. Ils ne veulent pas non plus céder leur souveraineté."
 INS_union_events.10.a: "Ça n'aurait jamais pu marcher"
 # Flags
 INS_exile_accepted_flag: "Abrite le gouvernement [HOL.GetAdjMS] en exil"
 INS_hey_btw_you_are_gonna_die_just_know_that_yeah_tt: "§RCeci mettra fin à la partie.§!"
 # Revolution events
 INS_revolution_events.1.t: "[HOL.GetLeLaLNPCap] [HOL.GetName] intervien[HOL.GetTNentNP] pour réprimer la République"
 INS_revolution_events.1.desc: "Sans surprise, le gouvernement néerlandais compte endiguer notre déclaration d'indépendance en mobilisant des troupes sur [1058.GetName] et en propageant de la propagande antirépublicaine."
 INS_revolution_events.1.a: "Il faut agir vite"
 INS_revolution_events.2.t: "[HOL.GetLeLaLNPCap] [HOL.GetName] demand[HOL.GetEEntNP] de l'aide"
 INS_revolution_events.2.desc: "À l'occasion d'un entretien d'urgence avec nos chefs de file, [HOL.GetLeader] a demandé notre assistance dans la reconquête des Indes, jusqu'à notre intervention directe. La situation est pour le moins critique, et les forces néerlandaises sont incapables de réprimer les milices révolutionnaires. [HOL.GetLeader] nous a promis Bornéo si nous lui venons en aide."
 INS_revolution_events.2.a: "Nous acceptons, pour Bornéo !"
 INS_revolution_events.2.b: "Cela ne nous intéresse pas"
 INS_revolution_events.3.t: "[ENG.GetLeLaLNPCap] [ENG.GetName] accept[ENG.GetEEntNP] l'accord de Londres-Batavia"
 INS_revolution_events.3.desc: "Les [ENG.GetHabitants] ont accepté de rejoindre le conflit ouvert : plusieurs de leurs divisions sont déjà en route pour Batavia. Nous devrons leur céder Bornéo, mais c'est peu cher payé pour renverser le cours de la guerre à notre avantage."
 INS_revolution_events.3.a: "Bornéo est un sacrifice nécessaire"
 INS_revolution_events.4.t: "[ENG.GetLeLaLNPCap] [ENG.GetName] refus[ENG.GetEEntNP] l'accord de Londres-Batavia"
 INS_revolution_events.4.desc: "Les [ENG.GetHabitants] ont refusé d'intervenir dans le conflit ouvert, malgré l'urgence de la situation et des termes plus qu'avantageux à leur compte. [ENG.GetLeader] aimerait préserver l'empire colonial, néanmoins le risque d'escalade mondiale est bien trop important. Nous allons devoir faire face à cette menace seuls."
 INS_revolution_events.4.a: "C'est mal parti..."
 INS_revolution_events.5.t: "Les [HOL.GetHabitants] demandent notre aide"
 INS_revolution_events.5.desc: "Après avoir investi toutes les villes capitales, les révolutionnaires des Indes néerlandaises viennent de déclarer l'indépendance de leur territoire. [HOL.GetLeader] nous a contactés en urgence pour demander notre assistance militaire dans le cadre d'une invasion."
 INS_revolution_events.5.a: "Les révolutionnaires victorieux se propagent... Arrêtons-les !"
 INS_revolution_events.5.b: "Cela ne nous intéresse pas"
 INS_revolution_events.6.t: "[ENG.GetLeLaLNPCap] [ENG.GetName] accept[ENG.GetEEntNP] de nous aider"
 INS_revolution_events.6.desc: "Les [ENG.GetHabitants] acceptent de nous envoyer des troupes de volontaires ainsi que du matériel à [1058.GetName], afin de tenter de reprendre le contrôle des Indes."
 INS_revolution_events.6.a: "C'est gagné d'avance"
 INS_revolution_events.7.t: "[ENG.GetLeLaLNPCap] [ENG.GetName] refus[ENG.GetEEntNP] de nous aider"
 INS_revolution_events.7.desc: "Les [ENG.GetHabitants] refusent de nous aider à regagner le contrôle des Indes, déclarant que cette affaire ne les regarde aucunement, malgré leur proximité avec le conflit. Nous allons devoir réarmer la KNIL par nos propres moyens."
 INS_revolution_events.7.a: "C'est inacceptable !"
 INS_revolution_events.8.t: "Milices révolutionnaires à l'œuvre dans les Indes"
 INS_revolution_events.8.desc: "Notre police coloniale des Indes orientales a arrêté et placé en garde à vue plusieurs membres d'un mouvement révolutionnaire nouveau en Indonésie. Leur objectif semble être la mise en place d'une présence militaire afin de lancer une campagne d'indépendance nationale. Difficile de l'affirmer à l'heure actuelle, mais il pourrait s'agir d'une révolution armée."
 INS_revolution_events.8.a: "Surveillons tout ceci de près..."
 INS_revolution_events.9.t: "Déclaration d'indépendance de l'Indonésie"
 INS_revolution_events.9.desc: "Dans un discours prononcé cet après-midi à Java, [INS.GetLeader] a déclaré l'indépendance de la République d'Indonésie. Nous ne reconnaissons en aucun cas cette entité, néanmoins leurs milices ont déjà investi le territoire, notre police n'étant pas de taille à contrer cette occupation massive. Si nous n'agissons pas sérieusement, nous risquons une guerre ouverte !"
 INS_revolution_events.9.a: "C'est parfaitement inacceptable !"
 INS_revolution_events.9.b: "S'ils veulent l'indépendance, qu'ils la prennent !"
 #INS_revolution_events.10.t: ""
 #INS_revolution_events.10.desc: ""
 #INS_revolution_events.10.a: ""
 INS_revolution_events.11.t: "Les forces militaires des Indes contrent la campagne de la milice"
 INS_revolution_events.11.desc: "Une milice républicaine a lancé une opération d'occupation [?event_target:INS_temp_occupied_state.GetAdjFS]. Nous sommes fiers d'annoncer que nos valeureux soldats des Indes ont réussi à repousser les forces ennemies et à conserver le contrôle total de la région."
 INS_revolution_events.11.a: "Une victoire de plus pour notre camp !"
 INS_revolution_events.12.t: "Tentatives d'occupation [?event_target:INS_temp_occupied_state.GetAdjFS] des milices"
 INS_revolution_events.12.desc: "Une milice républicaine a lancé une opération d'occupation [?event_target:INS_temp_occupied_state.GetAdjFS]. Notre police, épaulée par nos soldats, a réussi à reprendre la main sur la situation, mais le mécontentement gronde dans la région ; nombreux sont les civils en faveur des milices. Ils n'ont même plus peur de le déclarer haut et fort, voire même de critiquer ouvertement le gouvernement [HOL.GetAdjMS]."
 INS_revolution_events.12.a: "Ne laissons pas la situation empirer"
 INS_revolution_events.14.t: "Occupation [?event_target:INS_temp_occupied_state.GetAdjFS] des milices"
 INS_revolution_events.14.desc: "Malgré toute la bonne volonté de notre police et des soldats, les milices républicaines ont réussi leur opération militaire. Elles occupent désormais les territoires [?event_target:INS_temp_occupied_state.GetAdjMP]. Nos forces ont été contraintes d'évacuer la région. Si nous laissons faire ces milices, nous risquons tout simplement de perdre notre colonie."
 INS_revolution_events.14.a: "C'est un scandale !"
 INS_revolution_no_effect_tt: "Aucun effet"
 INS_revolution_events.19.t: "Négociations de paix dans les Indes"
 INS_revolution_events.19.desc: "[HOL.GetLeader] a été convié à une rencontre avec [INS.GetLeader] dans le but de négocier un éventuel traité de paix. [INS.GetLeader] a déclaré que le sang avait déjà bien trop coulé, proposant une solution à deux États, avec les frontières actuelles, hormis quelques légers ajustements, et l'instauration de la paix au plus vite."
 INS_revolution_events.19.a: "Acceptons, les pertes sont trop lourdes"
 INS_revolution_events.19.b: "Nous avons une autre idée pour la paix : votre reddition !"
 INS_revolution_events.20.t: "[HOL.GetLeLaLNPCap] [HOL.GetName] accept[HOL.GetEEntNP] la solution à deux États"
 INS_revolution_events.20.desc: "[INS.GetLeader] ne revient pas les mains vides de son entretien avec [HOL.GetLeader] : il a été convenu d'une solution à deux États. Nos troupes sont déjà en cours de relocalisation, en accord avec les nouvelles frontières. La perte de nos compatriotes indonésiens nous peine profondément, mais l'arrêt des combats est la meilleure chose qui puisse nous arriver à tous."
 INS_revolution_events.20.a: "Le massacre s'arrête enfin"
 INS_revolution_events.21.t: "Les [HOL.GetHabitants] refusent de cesser les combats"
 INS_revolution_events.21.desc: "L'entretien entre [INS.GetLeader] et [HOL.GetLeader] n'a pas été très fructueux. Montrant toujours plus de frustration, les deux partis ont refusé de faire la moindre concession, coupant court aux négociations."
 INS_revolution_events.21.a: "Ce massacre ne finira donc jamais"
 INS_revolution_events.22.t: "Les [HOL.GetHabitants] demandent notre aide"
 INS_revolution_events.22.desc: "[HOL.GetLeader] a demandé une entrevue avec [FRA.GetLeader] à Amsterdam afin de discuter de la situation dans les Indes, notamment des milices armées par les révolutionnaires qui commencent à tenir tête à l'armée néerlandaise. À l'heure actuelle, les [HOL.GetHabitants] risquent de perdre leur hégémonie coloniale. C'est pourquoi [HOL.GetLeader] nous a demandé de rejoindre le conflit dans leur camp en envoyant des divisions à Batavia afin de reprendre possession de la région. En échange de nos services, nous gagnerions le contrôle de Sumatra."
 INS_revolution_events.22.a: "Nous ne regarderons pas la dépense pour Sumatra !"
 INS_revolution_events.22.b: "Nous n'avons pas les moyens"
 INS_revolution_events.23.t: "[FRA.GetLeLaLNPCap] [FRA.GetName] accept[FRA.GetEEntNP] de nous aider"
 INS_revolution_events.23.desc: "Les [FRA.GetHabitants] ont accepté de nous prêter main-forte : les divisions [FRA.GetAdjFP] sont déjà en route pour Batavia."
 INS_revolution_events.23.a: "Voilà qui inversera le cours de la guerre"
 INS_revolution_events.24.t: "[FRA.GetLeLaLNPCap] [FRA.GetName] refus[FRA.GetEEntNP] de nous aider"
 INS_revolution_events.24.desc: "Les [FRA.GetHabitants] ont refusé de nous prêter main-forte contre la révolution. La situation est critique, nous devons trouver d'autres solutions et vite, sinon nous ne ferons pas le poids."
 INS_revolution_events.24.a: "C'est mal parti..."
 INS_revolution_events.25.t: "Fin de la guerre en Indonésie"
 INS_revolution_events.25.desc: "Les forces [HOL.GetAdjFP] ont détruit les bases principales de la milice et renversé le gouvernement républicain. Les élites et les commandants ont été mis aux fers et le gouvernement des Indes reprend ses fonctions dans les territoires libérés. Comme nous avons tenu notre engagement, les [HOL.GetHabitants] nous cèdent les territoires convenus."
 INS_revolution_events.25.a: "Merveilleux !"
 INS_revolution_events.26.t: "Fin de la guerre en Indonésie"
 INS_revolution_events.26.desc: "Les forces [HOL.GetAdjFP] et les milices républicaines se sont engagées dans une guerre qui a perduré bien plus longtemps que quiconque l'imaginait. [HOL.GetLeader] souhaite y mettre un terme en signant un traité de paix établissant une solution à deux États. Néanmoins, comme nous avons également tenu notre engagement, [HOL.GetLeader] nous cède tout de même les territoires qui nous avaient été promis."
 INS_revolution_events.26.a: "Très intéressant..."
 INS_revolution_events.27.t: "Fin de la guerre en Indonésie"
 INS_revolution_events.27.desc: "Les forces [HOL.GetAdjFP] et les milices républicaines se sont engagées dans une guerre qui a perduré bien plus longtemps que quiconque l'imaginait. Malgré nos efforts conjoints avec les [HOL.GetHabitants], les milices ont brillé dans des situations de guérillas, octroyant l'avantage aux républicains. [HOL.GetLeader] souhaite y mettre un terme en signant un traité de paix établissant une solution à deux États. Les Indes ne sont plus que l'ombre de ce qu'elles étaient. De plus, comme les [HOL.GetHabitants] ont perdu la guerre, [HOL.GetLeader] ne pourra malheureusement pas nous céder les territoires qui nous avaient été promis, malgré notre engagement sur le conflit."
 INS_revolution_events.27.a: "C'est un scandale !"
 INS_revolution_events.28.t: "La chute des Indes"
 INS_revolution_events.28.desc: "Malgré les dépenses militaires [HOL.GetAdjFP] faramineuses et notre engagement dans le conflit, les milices sont parvenues à nous submerger et à prendre le contrôle des Indes. L'administration [HOL.GetAdjFS] a été dissoute et le gouvernement contraint de capituler."
 INS_revolution_events.28.a: "Et nos territoires, alors ?"
 INS_revolution_events.29.t: "La chute des Indes"
 INS_revolution_events.29.desc: "Malgré nos efforts considérables, les révolutionnaires dans les Indes sont parvenus à prendre le contrôle des villes majeures et à renverser le gouvernement colonial. Nos généraux ont été faits prisonniers et toutes les lignes de communication sont coupées. Il faut se rendre à l'évidence : nous avons perdu."
 INS_revolution_events.29.a: "Quelle tragédie !"
 INS_revolution_events.30.t: "[INS.GetLeader] propose un cessez-le-feu"
 INS_revolution_events.30.desc: "[INS.GetLeader] a proposé la signature d'un cessez-le-feu [FROM.GetAuEnANP] [FROM.GetName], promettant également le retrait de ses troupes pour que nous puissions reprendre le contrôle de la région. La seule condition est de retarder nos opérations militaires majeures, afin que les révolutionnaires aient le temps de se regrouper."
 INS_revolution_events.30.a: "C'est d'accord"
 INS_revolution_events.30.b: "Non, nous reprendrons [FROM.GetLeLaLNP] [FROM.GetName] par la force !"
 INS_revolution_events.31.t: "[HOL.GetLeLaLNPCap] [HOL.GetName] accept[HOL.GetEEntNP] le cessez-le-feu"
 INS_revolution_events.31.desc: "Les négociations se sont bien déroulées, puisque [HOL.GetLeader] a accepté le cessez-le-feu et nos conditions. Nous avons donné l'ordre à nos commandants déployés [FROM.GetAuEnANP] [FROM.GetName] de se retirer sur-le-champ."
 INS_revolution_events.31.a: "Espérons qu'ils tiennent parole..."
 INS_revolution_events.32.t: "[HOL.GetLeLaLNPCap] [HOL.GetName] refus[HOL.GetEEntNP] le cessez-le-feu"
 INS_revolution_events.32.desc: "La médiation a tourné vinaigre : [HOL.GetLeader] a refusé de signer le cessez-le-feu, quittant la table des négociations avant même de trouver un compromis."
 INS_revolution_events.32.a: "C'est inacceptable !"
 INS_revolution_events.33.t: "[INS.GetLeLaLNPCap] [INS.GetName] demand[INS.GetEEntNP] une médiation"
 INS_revolution_events.33.desc: "Les Indonésiens républicains ont fait appel à nos talents de médiation pour trouver un compromis avec les Néerlandais. D'après nos conseillers étudiant la région, la situation empire de jour en jour, et les opérations militaires néerlandaises risquent de pousser les nationalistes dans les bras des Soviétiques. Les Pays-Bas sont un allié de choix sur la scène européenne, mais la géopolitique de l'Asie du Sud-Est risque d'avoir des répercussions considérables sur le monde entier. Si l'Indonésie devient communiste, notre passivité en sera la seule responsable."
 INS_revolution_events.33.a: "Dépêchons les médiateurs"
 INS_revolution_events.33.b: "N'entachons pas nos relations avec les Néerlandais"
 INS_revolution_events.34.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] accept[FROM.GetEEntNP] de servir de médiateur"
 INS_revolution_events.34.desc: "Washington a accepté de jouer les médiateurs entre notre gouvernement et les Néerlandais. Les émissaires sont déjà en route pour proposer un cessez-le-feu. C'est une occasion inespérée de trouver une solution durable au conflit : les Néerlandais seront moins enclins à rejeter nos propositions ou à se montrer menaçants si une puissance majeure arbitre les échanges. Ne vacillons pas à la table des négociations et laissons faire les Américains."
 INS_revolution_events.34.a: "Espérons que les Néerlandais se montrent raisonnables"
 INS_revolution_events.35.t: "[USA.GetLeLaLNPCap] [USA.GetName] jou[USA.GetEEntNP] les médiateurs"
 INS_revolution_events.35.desc: "Les Américains s'invitent en territoire indonésien pour jouer les médiateurs. Bien qu'ils promettent de se montrer impartiaux, nous savons qu'ils ont des intérêts à défendre. Si nous ne parvenons pas à trouver une issue qui leur convienne, ils n'hésiteront pas à faire pression pour nous faire craquer. Nos négociateurs devront marcher sur des œufs : la sympathie américaine est une denrée rare qu'il serait idiot de gâcher."
 INS_revolution_events.35.a: "Nous trouverons une solution"
 INS_revolution_events.36.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] refus[FROM.GetEEntNP] d'intervenir"
 INS_revolution_events.36.desc: "Les Américains ont refusé de jouer les médiateurs dans notre conflit. Dans cette prise de décision, Washington prouve très clairement qu'il préfère soutenir ses alliés européens plutôt que notre lutte pour l'autodétermination. Nous sommes seuls face au monde. C'est un constat amer, mais la révolution ne s'attendait pas à une aide étrangère."
 INS_revolution_events.36.a: "Nous l'emporterons sans eux"
 INS_revolution_events.37.t: "Ultimatum [USA.GetAdjMS]"
 INS_revolution_events.37.desc: "Les Américains perdent patience : ils viennent de lancer un ultimatum, exigeant la fin immédiate de toutes les opérations militaires en Indonésie, ainsi que la reconnaissance de la souveraineté indonésienne. Les conséquences en cas de refus s'annoncent sévères. Si jamais nous tombons en disgrâce de Washington, nous risquons notre place sur la scène mondiale et une crise économique sans précédent. Nos généraux assurent de leur côté que la guerre peut encore être remportée, mais à quel prix ?"
 INS_revolution_events.37.a: "Pas le choix, courbons l'échine"
 INS_revolution_events.37.b: "Nous ne céderons pas, l'Indonésie est à nous !"
 INS_revolution_events.38.t: "Les Néerlandais cèdent"
 INS_revolution_events.38.desc: "C'est fini ! Le gouvernement néerlandais a plié face à l'ultimatum américain : la République d'Indonésie est désormais officiellement reconnue. Après trois cent cinquante ans d'asservissement, le règne colonial prend fin sur le champ de bataille, mais surtout à la table des négociations, avec le soutien de l'une des plus grandes puissances mondiales. Nous pouvons enfin vivre libres !"
 INS_revolution_events.38.a: "Merdeka !"
 INS_revolution_events.39.t: "Les Néerlandais s'obstinent"
 INS_revolution_events.39.desc: "Contre toute attente, les Néerlandais ont rejeté l'ultimatum américain. Leurs généraux pensent encore pouvoir remporter la guerre avant l'intervention de Washington. Ils se bercent d'illusions, bien évidemment, car maintenant que les Américains sont ralliés à notre cause, l'équilibre des pouvoirs a drastiquement basculé en notre faveur. Alors qu'ils s'entêtent avec leurs rêves colonialistes : nous ne sommes plus seuls, désormais."
 INS_revolution_events.39.a: "Le monde entier nous soutient !"
 INS_revolution_events.40.t: "Les Néerlandais acceptent nos conditions"
 INS_revolution_events.40.desc: "La Haye vient de se plier à notre ultimatum. Les forces néerlandaises se retirent d'Indonésie pour laisser la république prendre pleinement possession des territoires et de sa souveraineté. Cette issue heureuse vient conclure un épisode tout à fait tragique. Nos intérêts seront bien mieux protégés dorénavant par une Indonésie indépendante, plutôt qu'une colonie néerlandaise mal gérée."
 INS_revolution_events.40.a: "Tout est bien qui finit bien"
 INS_revolution_events.41.t: "Les Néerlandais s'obstinent"
 INS_revolution_events.41.desc: "La Haye vient de jeter notre ultimatum à la poubelle. Les forces néerlandaises poursuivent donc leurs opérations en Indonésie, malgré nos avertissements. Si les Néerlandais pensent pouvoir mener une guerre coloniale en Asie tout en bénéficiant de l'aide américaine en Europe, ils se fourvoient lourdement. Ils l'auront voulu !"
 INS_revolution_events.41.a: "Très bien"
 INS_revolution_events.42.t: "Quitte ou double"
 INS_revolution_events.42.desc: "Nos services de renseignement en poste à Batavia nous signalent un mouvement ennemi d'une ampleur inédite : les républicains préparent une opération de déstabilisation, avec pour but la prise de Java et la destruction de tous nos systèmes de communication. Si leur plan réussit, nous serons vaincus, seulement c'est un plan très risqué, puisqu'il nécessite un investissement colossal de leur part ; la majorité de leurs ressources, à vrai dire. Nos généraux estiment que l'ennemi ne pourrait pas tenir le front ainsi plus de deux ans. Si nous parvenons à le retenir suffisamment longtemps, nous pourrons alors écraser leur gouvernement et leur révolution d'un seul revers."
 INS_revolution_events.42.a: "C'est la dernière ligne droite !"
 INS_revolution_events.43.t: "Fondation d'une base de la milice [FROM.GetAuEnANP] [FROM.GetName]"
 INS_revolution_events.43.desc: "Nos efforts [FROM.GetAuEnANP] [FROM.GetName] commencent à payer : la milice locale est désormais prête à agir dès que le moment sera venu."
 INS_revolution_events.43.a: "Continuons comme ça"
 # Chaos Events
 INS_chaos_events.1.t: "La bataille de Surabaya"
 INS_chaos_events.1.desc: "Depuis la déclaration d'indépendance, Surabaya se montre de plus en plus instable. Aujourd'hui, un groupe de loyalistes néerlandais ont levé le drapeau colonial sur l'ancien hôtel Yamato. Les Jeunes Pancasila ont rapidement investi le bâtiment pour retirer l'étendard et le remplacer par le drapeau rouge et blanc. L'incident a ensuite éclaté en une escarmouche sanglante."
 INS_chaos_events.1.a: "Ils ont bien fait !"
 INS_chaos_events.1.b: "Ordonnons un cessez-le-feu"
 INS_chaos_events.2.t: "Fusion des partis socialistes"
 INS_chaos_events.2.desc: "Les deux plus grands partis socialistes d'Indonésie, l'un mené par Amir Sjarifuddin et l'autre par Sutan Sjahrir, ont annoncé aujourd'hui leur unification. Cette décision va donner de l'importance, mais surtout de l'influence à ce mouvement politique. Notre administration a du souci à se faire."
 INS_chaos_events.2.a: "Laissons-les faire"
 INS_chaos_events.2.b: "Arrêtons-les. Déclarons la loi martiale !"
 INS_chaos_events.3.t: "Échec d'une tentative d'assassinat contre Soekarno"
 INS_chaos_events.3.desc: "Aujourd'hui, un soldat néerlandais a tenté d'assassiner Soekarno en ouvrant le feu sur son automobile. Par chance, Soekarno ne se trouvait pas dans le véhicule à ce moment-là, mais son chauffeur est dans un état critique. Cette tentative a peut-être échoué, mais il y en aura sûrement d'autres, de soldats néerlandais comme de l'opposition politique."
 INS_chaos_events.3.a: "Il faut rétablir l'ordre !"
 INS_chaos_events.4.t: "Assassinat de Soekarno"
 INS_chaos_events.4.desc: "L'Indonésie est aujourd'hui marquée du sceau de l'infamie : Soekarno a été victime d'une nouvelle tentative d'assassinat. Ne laissons pas une crise s'installer. Il faut lui trouver un successeur au plus vite pour empêcher la chute de la république."
 INS_chaos_events.4.a: "Le vice-président Hatta va prendre la suite"
 INS_chaos_events.4.b: "Le parti socialiste va prendre la suite"
 INS_chaos_events.4.c: "Abolissons la république : Tan Malaka nous guide, désormais !"
 # Loyalist Events
 INS_loyalist_events.1.t: "[INS.GetLeader] demande le transfert de Henri Winkelman"
 INS_loyalist_events.1.desc: "[INS.GetLeader] a souhaité s'entretenir avec nous pour nous rappeler la situation critique mondiale et la position précaire dans laquelle se trouv[INS.GetEEntNP] [INS.GetLeLaLNP] [INS.GetName]. C'est pourquoi il a été demandé le transfert de Henri Winkelman, ancien commandant de l'armée royale des Indes néerlandaises, sur le territoire [INS.GetAdjMS], afin d'assurer la sécurité de la colonie."
 INS_loyalist_events.1.a: "Il partira dans le prochain avion"
 INS_loyalist_events.1.b: "Nous avons besoin de lui ici"
 INS_loyalist_events.2.t: "[HOL.GetLeader] accepte le transfert d'Henri Winkelman"
 INS_loyalist_events.2.desc: "[INS.GetLeader] a réussi à convaincre [HOL.GetLeader] de nous envoyer Henri Winkelman pour sécuriser le territoire ! Ce dernier est déjà en route vers [1058.GetName]. Une fois arrivé, il ne restera plus qu'à l'affecter là où nous avons besoin de lui."
 INS_loyalist_events.2.a: "Il nous sera d'une aide précieuse"
 INS_loyalist_events.3.t: "[HOL.GetLeader] refuse le transfert d'Henri Winkelman"
 INS_loyalist_events.3.desc: "[INS.GetLeader] n'a pas réussi à convaincre [HOL.GetLeader] de nous envoyer Henri Winkelman. Les Indes devront se défendre sans lui."
 INS_loyalist_events.3.a: "Trouvons une autre solution, et vite !"
 INS_henri_winkelman_tt: "Refus du transfert de Henri Winkelman"
 # MALAYA CHAIN - Independent Malaya
 INS_loyalist_events.4.t: "Les [FROM.GetHabitants]\nproposent une unification"
 INS_loyalist_events.4.desc: "Une délégation [FROM.GetAdjFS] s'est présentée à [ROOT.Capital.GetCapitalVictoryPointName] pour proposer une unification. De leur point de vue, nos peuples partagent un héritage malais riche qui dépasse les frontières qu'ont tracées les administrations coloniales. Le projet abolirait nos gouvernements respectifs pour ne former qu'un État unifié sous une même bannière et une même culture."
 INS_loyalist_events.4.a: "Nous acceptons"
 INS_loyalist_events.4.b: "Nous allons devoir refuser"
 INS_loyalist_events.5.t: "[FROM.GetLeLaLNPCap] [FROM.GetName]\naccept[FROM.GetEEntNP] l'unification"
 INS_loyalist_events.5.desc: "Nos diplomates sont repartis de [FROM.Capital.GetCapitalVictoryPointName] avec une très bonne nouvelle : le gouvernement [FROM.GetAdjMS] a accepté notre proposition ! Les fonctionnaires des deux nations sont déjà à la tâche pour que la transition se passe du mieux possible."
 INS_loyalist_events.5.a: "À nous tous, nous serons plus forts !"
 INS_loyalist_events.6.t: "[FROM.GetLeLaLNPCap] [FROM.GetName]\nrefus[FROM.GetEEntNP] l'unification"
 INS_loyalist_events.6.desc: "Nos diplomates n'ont pas obtenu ce que nous souhaitions à [FROM.Capital.GetCapitalVictoryPointName]. Le gouvernement [FROM.GetAdjMS] ne semble pas enclin à accepter notre proposition. Les raisons de ce refus manquent de clarté, néanmoins nous sommes rentrés les mains vides de cette rencontre."
 INS_loyalist_events.6.a: "Tant pis pour eux"
 # MALAYA CHAIN - Subject Malaya (Overlord receives)
 INS_loyalist_events.7.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] demand[FROM.GetEEntNP] un référendum [MAL.GetAuEnANP] [MAL.GetName]"
 INS_loyalist_events.7.desc: "Les [FROM.GetHabitants] ont demandé la mise en place d'un référendum [MAL.GetAuEnANP] [MAL.GetName] pour trancher sur le projet d'unification avec leur État. Leur ambassadeur n'y est pas allé par quatre chemins, affirmant que les Malais, d'un côté de la frontière comme de l'autre, se considèrent une seule et même nation. Autoriser un tel vote nous ferait perdre très certainement [MAL.GetLeLaLNP] [MAL.GetName]."
 INS_loyalist_events.7.a: "C'est au peuple d'en décider"
 INS_loyalist_events.7.b: "C'est hors de question !"
 # MALAYA CHAIN - Subject Malaya (MAL receives after overlord agrees)
 INS_loyalist_events.8.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] approuv[FROM.GetEEntNP] le référendum"
 INS_loyalist_events.8.desc: "Notre suzerain a autorisé l'organisation d'un référendum sur notre territoire au nom des [FROM.FROM.GetHabitants]. Leurs militants ont déjà investi nos rues pour faire pencher le scrutin qui aura lieu avant la fin du mois. La question posée à nos citoyens est très simple : souhaitent-ils rejoindre [FROM.FROM.GetLeLaLNP] [FROM.FROM.GetName], ou préfèrent-ils que rien ne change ?"
 INS_loyalist_events.8.a: "Rejoignons-les"
 INS_loyalist_events.8.b: "Nous sommes très bien ainsi !"
 # MALAYA CHAIN - Overlord informed of MAL's choice
 INS_loyalist_events.9.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] vot[FROM.GetEEntNP] contre l'unification"
 INS_loyalist_events.9.desc: "Les bureaux de vote pour le référendum [FROM.GetAdjMS] sont clos, les bulletins ont été comptés : les [FROM.GetHabitants] ont choisi de demeurer sous notre administration. Les militants [FROM.FROM.GetAdjMP] sont rentrés chez eux."
 INS_loyalist_events.9.a: "Mais on le savait déjà..."
 INS_loyalist_events.10.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] vot[FROM.GetEEntNP] pour l'unification"
 INS_loyalist_events.10.desc: "Les bureaux de vote pour le référendum [FROM.GetAdjMS] sont clos, les bulletins ont été comptés : les [FROM.GetHabitants] ont accepté l'unification avec les [FROM.FROM.GetHabitants]. D'après nos fonctionnaires dans la région, un tel résultat est plus que logique."
 INS_loyalist_events.10.a: "Nous avions donné notre parole"
 # MALAYA CHAIN - INS receives result
 INS_loyalist_events.11.t: "Succès du référendum malais"
 INS_loyalist_events.11.desc: "Le peuple [MAL.GetAdjMS] a voté pour rejoindre notre nation. Les fonctionnaires [MAL.GetAdjMP] sont déjà en train de mettre en place le transfert de gouvernement avec notre administration. Le territoire [MAL.GetAdjMS] se reconstruit petit à petit."
 INS_loyalist_events.11.a: "C'est une victoire !"
 INS_loyalist_events.12.t: "Échec du référendum malais"
 INS_loyalist_events.12.desc: "Notre projet d'unification avec les [MAL.GetHabitants] vient d'être rejeté. Le gouvernement [MAL.GetAdjMS], ou plutôt ceux qui le contrôlent ont refusé de réaliser cette entreprise. Nous soumettrons de nouveau cette idée sous d'autres circonstances."
 INS_loyalist_events.12.a: "Nous nous en souviendrons"
 INS_loyalist_events.13.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] propos[FROM.GetEEntNP] un compromis sur Singapour"
 INS_loyalist_events.13.desc: "Le gouvernement [FROM.GetAdjMS] vient de nous soumettre une proposition au sujet de Singapour : il souhaite obtenir le contrôle de l'île, car elle fait partie du territoire malais, selon lui. En échange, il nous laisserait l'accès libre au port, aux infrastructures militaires ainsi qu'aux moyens d'extraction de ressources actuellement en place."
 INS_loyalist_events.13.a: "Un marché équitable"
 INS_loyalist_events.13.b: "Singapour n'est pas à vendre !"
 INS_loyalist_events.14.t: "Compromis sur Singapour accepté"
 INS_loyalist_events.14.desc: "Notre proposition vient d'être acceptée ! Singapour nous appartient désormais, à la condition de laisser l'accès militaire et commercial à ses anciens propriétaires. Notre drapeau domine désormais l'un des ports les plus puissants d'Asie."
 INS_loyalist_events.14.a: "À nous les détroits !"
 INS_loyalist_events.15.t: "Compromis sur Singapour rejeté"
 INS_loyalist_events.15.desc: "Notre proposition vient d'être refusée. Les propriétaires de Singapour refusent catégoriquement de céder ce territoire, malgré notre offre plus que généreuse."
 INS_loyalist_events.15.a: "Très bien"
 INS_loyalist_events.16.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] demand[FROM.GetEEntNP] le transfert de Ceylan"
 INS_loyalist_events.16.desc: "Le gouvernement [FROM.GetAdjMS] a formulé la demande officielle du transfert de Ceylan. Leurs diplomates justifient la requête par les liens ethniques et commerciaux durables entre l'île et le territoire malais. Cette revendication ne tient très franchement pas debout, mais les [FROM.GetHabitants] sont devenus un acteur assez puissant pour mériter qu'on se penche sur la question."
 INS_loyalist_events.16.a: "Qu'ils prennent l'île"
 INS_loyalist_events.16.b: "Ceylan est à nous, un point c'est tout !"
 INS_loyalist_events.17.t: "Transfert de Ceylan"
 INS_loyalist_events.17.desc: "Le transfert de Ceylan est acté. Notre administration est en train d'affecter des fonctionnaires sur l'île, et les dernières formalités de cession se concluent en ce moment même. Nous possédons désormais des places fortes des deux côtés du détroit."
 INS_loyalist_events.17.a: "Formidable !"
 INS_loyalist_events.18.t: "Transfert de Ceylan refusé"
 INS_loyalist_events.18.desc: "Notre proposition de transfert de Ceylan n'a pas abouti. Ses propriétaires actuels n'ont pas l'intention de s'en séparer. D'après nos diplomates, toute tentative de négociation s'est soldée par un échec."
 INS_loyalist_events.18.a: "Une autre fois, peut-être..."
 INS_loyalist_events.19.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] demand[FROM.GetEEntNP] un référendum en Papouasie"
 INS_loyalist_events.19.desc: "Les [FROM.GetHabitants] ont demandé la tenue d'un référendum en Papouasie de l'Est. L'ambassadeur a justifié cette requête par un constat très simple : du côté [FROM.GetAdjMS], des routes traversent la jungle, des cliniques abritent des chirurgiens qualifiés et des écoles enseignent les dialectes locaux. De notre côté, le dernier gouverneur en poste s'est rendu à Port Moresby deux fois en l'espace de trois ans."
 INS_loyalist_events.19.a: "Qu'ils votent si ça leur chante"
 INS_loyalist_events.19.b: "C'est hors de question !"
 INS_loyalist_events.20.t: "Approbation du référendum de Papouasie"
 INS_loyalist_events.20.desc: "Les Australiens ont accepté la tenue du référendum, et ce dernier a été sans appel : dans tous les districts de Papouasie de l'Est, il a été voté de rejoindre notre nation. Les investissements réalisés au sein de nos frontières ont été plus éloquents que la meilleure des campagnes électorales."
 INS_loyalist_events.20.a: "Enfin, l'île réunifiée !"
 INS_loyalist_events.21.t: "Interdiction du référendum de Papouasie"
 INS_loyalist_events.21.desc: "Les Australiens ont refusé la tenue du référendum. Le gouverneur en poste à Port Moresby a par ailleurs déclaré qu'une telle requête était un affront à la souveraineté australienne. Naturellement, le peuple papou n'a pas été consulté..."
 INS_loyalist_events.21.a: "Nous nous en souviendrons..."
 INS_loyalist_events.22.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] exig[FROM.GetEEntNP] le Timor oriental"
 INS_loyalist_events.22.desc: "Le gouvernement [FROM.GetAdjMS] exige de nous la cession immédiate du Timor oriental. Leur ambassadeur a intelligemment pointé notre faible garnison en poste, ainsi que les maigres dotations qu'a alloué Lisbonne ces dernières années au territoire, avant de conclure par une question : pourquoi tant s'accrocher au Timor ?"
 INS_loyalist_events.22.a: "Acceptons, ça n'en vaut pas la peine"
 INS_loyalist_events.22.b: "Le Timor est à nous, point final !"
 INS_loyalist_events.23.t: "Cession du Timor oriental"
 INS_loyalist_events.23.desc: "Les propriétaires du Timor oriental ont ordonné le retrait de leurs troupes et la fermeture de leur administration coloniale. L'île tout entière sera très bientôt sous notre autorité."
 INS_loyalist_events.23.a: "Il était temps"
 INS_loyalist_events.24.t: "Cession du Timor oriental refusée"
 INS_loyalist_events.24.desc: "Le gouverneur colonial en poste à Dili a adressé une lettre de sa plume à notre gouvernement pour rejeter notre demande, affirmant que le Timor oriental demeurera sous son autorité. L'État-major a déjà devisé un plan de contingence, au cas où nous souhaitions réitérer notre requête..."
 INS_loyalist_events.24.a: "Lançons les préparatifs"
 INS_loyalist_events.25.t: "Les [FROM.GetHabitants]\nproposent une unification"
 INS_loyalist_events.25.desc: "Une délégation [FROM.GetAdjMS] s'est présentée à nous dans le but d'unifier nos républiques. Ils avancent l'argument de nos origines austronésiennes communes, bien plus fortes que les frontières coloniales qui nous séparent. Un État unique englobant la totalité de l'archipel serait un véritable acteur majeur sur la scène d'Asie du Sud-Est. Accepter reviendrait à dissoudre notre gouvernement pour être intégré au leur."
 INS_loyalist_events.25.a: "Nous donnons notre accord"
 INS_loyalist_events.25.b: "Nous n'abandonnerons pas notre république"
 INS_loyalist_events.26.t: "[FROM.GetLeLaLNPCap] [FROM.GetName]\naccept[FROM.GetEEntNP] l'unification"
 INS_loyalist_events.26.desc: "Le gouvernement [FROM.GetAdjMS] vient d'accepter notre proposition. Nos fonctionnaires respectifs sont déjà à l'œuvre pour mettre en place le processus d'intégration. Notre nation enveloppe désormais l'entièreté de l'archipel malais, de Luçon à Aceh et de Bornéo à Mindanao."
 INS_loyalist_events.26.a: "Une nouvelle ère commence"
 INS_loyalist_events.27.t: "[FROM.GetLeLaLNPCap] [FROM.GetName]\nrefus[FROM.GetEEntNP] l'unification"
 INS_loyalist_events.27.desc: "Le gouvernement [FROM.GetAdjMS] a refusé notre proposition. La lutte pour l'indépendance des [FROM.GetHabitants] est aujourd'hui encore marquée dans les esprits : ils ne sont pas prêts à l'abandonner. Nous n'avons pas insisté."
 INS_loyalist_events.27.a: "C'est fort dommage"
 INS_loyalist_events.28.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] demand[FROM.GetEEntNP] un référendum [PHI.GetAuEnANP] [PHI.GetName]"
 INS_loyalist_events.28.desc: "Les [FROM.GetHabitants] ont demandé la tenue d'un référendum [PHI.GetAuEnANP] [PHI.GetName] pour trancher sur une éventuelle unification. Leurs diplomates avancent les origines austronésiennes qui unissent les deux peuples et les frontières arbitraires issues du colonialisme qui les séparent. Si le vote a bien lieu, l'unification sera sûrement choisie."
 INS_loyalist_events.28.a: "Laissons le peuple se prononcer"
 INS_loyalist_events.28.b: "C'est hors de question"
 INS_loyalist_events.29.t: "Référendum d'unification approuvé"
 INS_loyalist_events.29.desc: "Les [FROM.FROM.GetHabitants] ont proposé l'unification de nos deux nations qui partagent le même héritage austronésien. Notre suzerain a approuvé la tenue d'un référendum pour trancher la question. Les militants [FROM.FROM.GetAdjMP] ont déjà investi notre territoire pour faire campagne. L'issue de ce vote décidera de l'avenir de notre république : rejoindra-t-elle [FROM.FROM.GetLeLaLNP] [FROM.FROM.GetName] ?"
 INS_loyalist_events.29.a: "Ce serait une excellente chose !"
 INS_loyalist_events.29.b: "Jamais !"
 INS_loyalist_events.30.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] vot[FROM.GetEEntNP] contre l'unification"
 INS_loyalist_events.30.desc: "Les bulletins sont comptés, les militants ont remballé leurs affiches et leurs porte-voix. Le peuple [FROM.GetAdjMS] a choisi de conserver son indépendance. Il faut croire que sa souveraineté compte à ses yeux."
 INS_loyalist_events.30.a: "Voilà une affaire réglée"
 INS_loyalist_events.31.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] vot[FROM.GetEEntNP] pour l'unification"
 INS_loyalist_events.31.desc: "Les bulletins ont été comptés : le peuple [FROM.GetAdjMS] a choisi en masse de rejoindre les [FROM.FROM.GetHabitants]. Nos fonctionnaires sont en train de lancer la procédure d'unification en ce moment même."
 INS_loyalist_events.31.a: "Les [FROM.GetHabitants] se sont exprimés"
 INS_loyalist_events.32.t: "[PHI.GetLeLaLNPCap] [PHI.GetName] vot[PHI.GetEEntNP] pour l'unification"
 INS_loyalist_events.32.desc: "Le référendum [PHI.GetAdjMS] a validé notre proposition ! Maintenant que le gouvernement a validé les résultats, nous allons pouvoir mettre en relation nos ministères des Affaires étrangères pour réaliser le transfert."
 INS_loyalist_events.32.a: "Enfin réunis !"
 INS_loyalist_events.33.t: "[PHI.GetLeLaLNPCap] [PHI.GetName] refus[PHI.GetEEntNP] l'unification"
 INS_loyalist_events.33.desc: "Le gouvernement [PHI.GetAdjMS] a refusé notre proposition d'unification. Le Parlement a rejeté la motion sans même lire toutes les modalités. Nous avons offert aux [PHI.GetHabitants] une place de choix au sein de la plus glorieuse nation d'Asie du Sud-Est, et ils l'ont tout simplement jetée aux oubliettes."
 INS_loyalist_events.33.a: "Ce n'est qu'un contretemps"
 INS_communist_events.6.t: "Agitation de la part d'agents [FROM.GetAdjMP] sur notre sol"
 INS_communist_events.6.desc: "Nos services de renseignement viennent de confirmer nos doutes : les [FROM.GetHabitants] mènent actuellement des campagnes de subversion sur notre territoire. Financement de cellules radicalisées, distribution de pamphlets séditieux, piquets de grève parmi les prolétaires... Leurs agents se sont infiltrés partout, dans les syndicats, comme les coopératives agricoles, cherchant à renverser le gouvernement. La situation est plus que critique. Nous devons agir au plus vite si nous voulons éviter la dégringolade."
 INS_communist_events.6.a: "C'est intolérable !"
 INS_communist_events.7.t: "Subversion communiste [FROM.GetAuEnANP] [FROM.GetName]"
 INS_communist_events.7.desc: "Nous avons eu vent de signalements inquiétants [FROM.FROM.GetAuEnANP] [FROM.FROM.GetName]. Des agents à la solde [FROM.GetDuDelaDelNP] [FROM.GetName] encouragent la révolution au sein de la population, accusant le gouvernement d'être à l'origine des injustices de telle ou telle communauté afin de préparer un coup d'État communiste. Si nous ne faisons rien, ce pays pourrait très vite tomber aux mains des radicaux et sa corruption se propagerait alors dans nos autres possessions."
 INS_communist_events.7.a: "Intervenons avant qu'il ne soit trop tard"
 INS_communist_events.8.t: "Propagande [FROM.GetAdjFS] en circulation [ROOT.GetAuEnANP] [ROOT.GetName]"
 INS_communist_events.8.desc: "On retrouve de plus en plus de pamphlets d'origine [FROM.GetAdjFS] dans nos usines, nos marchés et nos universités. Ils promettent monts et merveille au petit peuple par le biais d'une révolution armée. D'après les rapports de police, ce discours trouve preneur parmi la population. C'est un média de piètre qualité, mais de toute évidence, il n'en reste pas moins très efficace et se propage à une vitesse folle."
 INS_communist_events.8.a: "Trouvons les responsables !"
 ## Call for Revolution - Main Event (sent to target) ##
 INS_communist_events.1.t: "Révolution [ROOT.GetAuEnANP] [ROOT.GetName]"
 INS_communist_events.1.desc: "La situation vient de franchir un point de non-retour. Après des mois d'acharnement [FROM.GetAdjMS], le mouvement communiste est devenu hors de contrôle sur notre sol. Les grèves générales paralysent le pays tout entier, des milices armées se sont emparées de certaines provinces et le gouvernement [FROM.GetAdjMS] soutient ouvertement les révolutionnaires. Nos forces ont énormément à faire, de plus leur loyauté est lourdement remise en question. Il faut choisir : allons-nous défendre bec et ongles l'État, ou allons-nous céder face à la pression immense et éviter une boucherie ?"
 INS_communist_events.1.a: "Mobilisons l'armée ! On ne va pas se laisser faire !"
 INS_communist_events.1.b: "À quoi bon lutter contre notre peuple ?"
 INS_communist_events.1.c: "Invitons-les à notre table pour apaiser la situation"
 ## Civil War Chosen - sent to Indonesia ##
 INS_communist_events.2.t: "Les [FROM.GetHabitants] se préparent à la guerre civile"
 INS_communist_events.2.desc: "Le gouvernement [FROM.GetAdjMS] refuse de céder à la pression. L'armée a été mobilisée pour tenter de réprimer la révolution. Nos camarades ont déjà mis la main sur des places fortes et des lieux clés. La lutte s'annonce longue et difficile, mais les [FROM.GetHabitants] ont fait leur choix, et nous comptons bien les soutenir dans leur combat."
 INS_communist_events.2.a: "Vive la Révolution !"
 ## Surrender - sent to Indonesia ##
 INS_communist_events.3.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] capitul[FROM.GetEEntNP]"
 INS_communist_events.3.desc: "Le gouvernement [FROM.GetAdjMS] vient de hisser le drapeau blanc. Submergé par l'ampleur du mouvement révolutionnaire, il n'a eu d'autre choix que de rendre les armes. Le parti communiste local a pris les rênes du pays en attendant que le nouveau gouvernement prenne ses repères. Naturellement, ce dernier se tourne vers nous pour que nous les guidions vers un avenir prospère. Une nation de plus libérée du joug tyrannique."
 INS_communist_events.3.a: "Nouvelle victoire pour le prolétariat !"
 ## Civil War in Subject - sent to overlord ##
 INS_communist_events.4.t: "Guerre civile [FROM.GetAuEnANP] [FROM.GetName]"
 INS_communist_events.4.desc: "Les révolutionnaires communistes, soutenus par les [FROM.FROM.GetHabitants], ont lancé une insurrection sur notre territoire [FROM.GetAdjMS]. L'administration coloniale a totalement perdu le contrôle. La garnison locale n'est pas en mesure de stopper cette guerre civile sans renforts."
 INS_communist_events.4.a: "Envoyons des troupes !"
 ## Subject Surrendered - sent to overlord ##
 INS_communist_events.5.t: "Les communistes capturent [FROM.GetLeLaLNP] [FROM.GetName]"
 INS_communist_events.5.desc: "L'administration [FROM.GetAdjFS] vient de capituler face aux communistes sans même répliquer militairement. Le gouverneur et son cabinet sont en détention, notre drapeau a été mis en berne et un gouvernement révolutionnaire a pris le contrôle du territoire. Toute cette supercherie est l'œuvre des [FROM.FROM.GetHabitants] : ils ont cherché à discréditer notre autorité pendant des mois. C'est un vol pur et simple qui ne restera pas impuni."
 INS_communist_events.5.a: "C'est un scandale !"
 # Cooperate with Revolutionaries (sent to target)
 INS_communist_events.9.t: "Des officiers [FROM.GetAdjMP] conspirent avec les dissidents"
 INS_communist_events.9.desc: "Des agents [FROM.GetAdjMP] ont été surpris en compagnie de chefs de file révolutionnaires et d'agitateurs notoires. Les étudiants d'hier qui distribuaient des pamphlets dans la rue s'entretiennent aujourd'hui à huis clos avec des diplomates [FROM.GetAdjMP]. Pour chaque ouvrage proscrit confisqué par la police, deux autres sont distribués. Les manifestations d'hier, dissipées en une après-midi, bloquent aujourd'hui des quartiers tout entiers pendant des jours. Les communistes savent désormais coordonner des groupes de militants importants. Si nous ne faisons rien, nous risquons une perte de contrôle total."
 INS_communist_events.9.a: "Neutralisons ces agents étrangers au plus vite !"
 # Spread Anti-Colonialist Sentiment (sent to subject target)
 INS_communist_events.10.t: "Le discours [FROM.GetAdjMS] séduit la population"
 INS_communist_events.10.desc: "Les pamphlets [FROM.GetAdjMP] circulent désormais dans les casernes et les services administratifs. Malgré les opérations de confiscation, rien ne semble arrêter ce gain de popularité massif. Ces ouvrages parlent d'une nation libre, de peuples qui ont chassé leurs oppresseurs coloniaux pour bâtir un avenir radieux. Il serait plus facile de ridiculiser ces écrits s'ils n'étaient pas aussi pertinents. Certains officiers loyaux jusqu'alors commencent même à se demander, sous la barbe, si la situation actuelle ne sert pas plutôt les intérêts de nos maîtres que ceux de la population."
 INS_communist_events.10.a: "Restons sur nos gardes"
