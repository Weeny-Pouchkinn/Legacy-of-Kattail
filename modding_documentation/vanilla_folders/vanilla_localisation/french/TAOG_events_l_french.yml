 ### INS News
 taog_news.1.t: "La naissance de l'Union néerlando-indonésienne"
 taog_news.1.desc: "Dans un discours prononcé hier par la reine Wilhelmine à [1058.GetName], nous avons appris avec surprise la création d'une Union néerlando-indonésienne. Puisque leur mère patrie est actuellement sous l'occupation, le gouvernement [HOL.GetAdjMS] en exil et l'administration [INS.GetAdjFS] ont signé un accord pour guider la Couronne main dans la main. Les instances dirigeantes des deux nations ont qualifié cette décision de nécessaire, une bouteille à la mer dans l'espoir de préserver l'autorité et l'unité du royaume qui couvre deux continents."
 taog_news.1.a: "Très intéressant..."
 taog_news.2.t: "La déclaration d'indépendance de l'Indonésie"
 taog_news.2.desc: "[INS.GetLeader], un chef révolutionnaire [INS.GetAdjMS], a tenu un discours à Java ce matin, déclarant l'indépendance de la toute première République d'Indonésie. Les [HOL.GetHabitants] ne reconnaissent évidemment pas cette souveraineté nouvelle, néanmoins les milices républicaines se sont déjà emparées d'une grande partie des territoires."
 taog_news.2.a: "C'est peut-être le début d'une mouvance inédite"
 ############
 ### SIAM ###
 ############
 siam.1.t: "[SIA_phraya_phahon.GetName] impliqué dans un scandale"
 siam.1.desc: "[SIA_phraya_phahon.GetName] est soupçonné d'avoir cédé les propriétés de la Couronne à des officiers bien en dessous des prix du marché. Ce scandale a vivement émoussé sa légitimité au sein de l'Assemblée populaire : son influence s'est totalement envolée."
 siam.1.a: "Il est temps que quelqu'un d'autre le remplace"
 #Spmgsiradet rebellion historical
 siam.2.t: "Troisième tentative d'assassinat de [SIA_plaek_phibunsongkhram.GetName]"
 siam.2.desc: "Le correspondant à Bangkok pour Reuters vient de nous signaler qu'une troisième tentative d'assassinat envers le Premier ministre du Siam, M. Phibunsongkhram, vient d'être déjouée.\nOn aurait mélangé du poison à son repas, ce qui a non seulement affecté l'homme d'État, mais aussi sa femme et sa fille.\nLe Secrétaire aux Affaires étrangères britanniques, Lord Halifax, décrie vivement cet acte lâche et horrible, mais se réjouit que M. Phibunsongkhram ait réussi à s'en sortir." #https://trove.nla.gov.au/newspaper/article/47990695
 siam.2.a: "Qui a bien pu commettre un tel crime ?"
 siam.3.t: "Phraya Songsuradet exilé"
 siam.3.desc: "Phraya Songsuradet est soupçonné d'avoir orchestré une, voire plusieurs tentatives d'assassinat envers [SIA_plaek_phibunsongkhram.GetName], ainsi qu'un coup d'État contre le gouvernement. Il a donc été décidé qu'on lui retire son commandement, son rang et ses titres, qu'il quitte l'armée sans aucune réversion et le pays sans ménagement.\nDes voix s'élèvent contre cet exil forcé, pointant là une purge politique à peine déguisée de [SIA_plaek_phibunsongkhram.GetName] pour chasser son rival, mais sans preuve, ces accusations relèvent de la calomnie."
 siam.3.a: "Une bien triste fin"
 siam.4.t: "Arrestation des partisans de Songsuradet"
 siam.4.desc: "Très tôt dans la matinée, le gouvernement a dépêché la police royale thaïlandaise pour organiser l'arrestation de 51 suspects supplémentaires, notamment Phraya Thepahatsadin et Phraya Udom Pongphensawad. Ils sont tous accusés d'avoir participé aux complots orchestrés par Phraya Songsuradet à l'encontre de l'État. Fait inédit dans cette affaire, un membre de la famille royale est inculpé : le prince Rangsit. Certains analystes se demandent si son incarcération ne servirait pas à envoyer un message clair à la royauté encore présente sur le territoire..."
 siam.4.a: "L'affaire se corse"
 siam.5.t: "La rébellion des 18 cadavres"
 siam.5.desc: "Phibun a mis en place un tribunal exceptionnel pour juger les 51 suspects impliqués dans la rébellion : à l'issue du procès, 25 ont été condamnés à la prison à perpétuité, et 21 à la mort par exécution. Des condamnés à mort, trois ont été graciés pour conduite honorable, notamment le prince Rangsit et Phraya Thepahatsadin."
 siam.5.a: "L'affaire est close"
 #Songsuradet rebellion alternative
 siam.6.t: "L'impasse de Songsuradet"
 siam.6.desc: "Phraya Songsuradet est soupçonné d'avoir orchestré une, voire plusieurs tentatives d'assassinat envers [SIA_plaek_phibunsongkhram.GetName], ainsi qu'un coup d'État contre le gouvernement. Il a donc été demandé qu'on lui retire son commandement, son rang et ses titres, qu'il quitte l'armée sans aucune réversion et le pays sans ménagement.\nToutefois, des membres de l'armée, dévoués à Songsuradet, ont empêché son arrestation, accusant clairement le gouvernement de manigancer une purge. Les deux camps se tiennent tête, refusant de céder. Nous sommes dans une impasse."
 siam.6.a: "Nous ne faiblirons pas"
 siam.6.b: "C'est allé trop loin, faisons machine arrière"
 siam.7.t: "Songsuradet cherche du soutien dans la marine"
 siam.7.desc: "Tandis que l'impasse entre le gouvernement et la clique militaire de Songsuradet persiste, la rumeur court qu'une alliance entre la marine royale et Songsuradet aurait déjà été signée, dans le but de contrecarrer l'autoritarisme de Phibunsongkhram.\nDe plus, nos contacts au sein de la famille royale nous confirment que des agents de Songsuradet se sont récemment entretenus avec des princes. Tout porte à croire que la dynastie princière sera le prochain allié de l'opposition."
 siam.7.a: "Nous ne céderons pas au chantage !"
 siam.7.b: "C'est allé trop loin, faisons machine arrière"
 #alt-hist actual rebellion
 siam.8.t: "La rébellion de Songsuradet"
 siam.8.desc: "Maintenant qu'elle possède le soutien politique et militaire qu'elle recherchait, la clique militaire de Songsuradet s'est emparée de vastes régions du pays avec l'aide de la marine. Des coups de feu ont retenti très tôt ce matin dans la banlieue de Bangkok. La nation tout entière s'apprête à basculer dans une guerre civile sans précédent, avec d'un côté le gouvernement et de l'autre Songsuradet."
 siam.8.a: "Le gouvernement doit tenir bon !"
 #alt-hist actual rebellion
 siam.9.t: "La fin de la rébellion de Songsuradet"
 siam.9.desc: "Maintenant que Songsuradet est derrière les barreaux, la rébellion est morte. L'heure du procès approche, mais tout le monde en connaît déjà l'issue : le complot entre armée et marine a été révélé au grand jour, tout comme celui de la famille royale, puisque le prince Rangsit s'est même ouvertement déclaré en faveur des rebelles. La purge catégorique de tous les dissidents n'est plus une possibilité ; c'est une nécessité."
 siam.9.a: "L'heure est à la reconstruction"
 #Attack Indochina
 siam.10.t: "Victoire !"
 siam.10.desc: "L'ennemi fuit face à notre écrasante victoire ! Maintenant que nous contrôlons le territoire, les forces impérialistes sont totalement désemparées. Elles peinent à accepter leur défaite, pourtant, elle était inévitable au regard de notre providence toute puissante."
 siam.10.a: "Vive [ROOT.GetLeLaLNP] [ROOT.GetName] !"
 siam.10.b: "Tout se passe comme prévu"
 siam.11.t: "Percée stratégique [FROM.GetAdjFS]"
 siam.11.desc: "L'armée [FROM.GetAdjFS] a créé la surprise en contournant nos troupes pour s'emparer de la région. Son occupation a largement fragilisé notre autorité et remis en question nos revendications sur ces terres. Poursuivre le conflit risque d'aggraver la situation, mais céder le territoire reviendrait à reconnaître notre manquement."
 siam.11.a: "Limitons les dégâts, retirons-nous tout de suite"
 siam.11.b: "Ne renonçons pas !"
 siam.12.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] concèd[FROM.GetEEntNP] la défaite"
 siam.12.desc: "Notre campagne est une réussite ! L'opposition [FROM.GetAdjFS] s'est écroulée, nous cédant par la même occasion le contrôle de la région. Cette victoire renforce notre légitimité ainsi que nos frontières... du moins, pour le moment."
 siam.12.a: "Nous sommes une puissance redoutable !"
 siam.13.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] refus[FROM.GetEEntNP] un accord"
 siam.13.desc: "Les [FROM.GetHabitants] ont rejeté toutes les tentatives de concessions territoriales, les jugeant irrecevables, avant de déclarer qu'ils comptent mettre un terme à ce conflit en annihilant totalement notre État."
 siam.13.a: "Très bien"
 siam.14.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] déclar[FROM.GetEEntNP] la guerre"
 siam.14.desc: "Les [FROM.GetHabitants] tombent les masques. Après avoir rejeté en bloc les négociations, ils laissent paraître leurs véritables intentions : l'annihilation totale de notre nation. Cette guerre ne se terminera pas par un traité, mais par l'éradication pure et simple d'un peuple."
 siam.14.a: "Pas de quartier, pas de pitié !"
 siam.15.t: "L'assaut [SIA.GetAdjMS] faiblit"
 siam.15.desc: "L'offensive fulgurante des forces [SIA.GetFP] nous aura clairement déstabilisés, avouons-le, néanmoins, leur progression ralentit de jour en jour, exposant aux yeux du monde leurs faiblesses. Alors que les [SIA.GetHabitants] s'attendaient à une campagne éclair, les voilà engoncés dans une guerre interminable. Nous pouvons faire preuve de clémence en leur offrant une issue via des traités, ou alors nous pouvons renverser la vapeur et achever une victoire totale."
 siam.15.a: "Proposons un compromis"
 siam.15.b: "Victoire totale, voilà qui sonne bien"
 siam.16.t: "Assaut en perte de vitesse"
 siam.16.desc: "Notre offensive faiblit, certes, mais le plus dommageable, c'est que l'ennemi soit au courant ! Il vient justement de nous faire parvenir un ultimatum : nous pouvons nous rendre et limiter les pertes, ou poursuivre les combats qui se concluront inévitablement par un massacre. À nous de choisir le nombre de corps à rapatrier."
 siam.16.a: "Acceptons la paix"
 siam.16.b: "Jamais nous n'abdiquerons !"
 siam.17.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] refus[FROM.GetEEntNP] de capituler"
 siam.17.desc: "Les [FROM.GetHabitants] nous ont clairement fait comprendre qu'ils préféraient encore mettre leur pays à feu et à sang plutôt que de nous céder le moindre centimètre carré. La guerre va donc continuer."
 siam.17.a: "Si c'est ce qu'ils souhaitent..."
 siam.18.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] cherch[FROM.GetEEntNP] à nous anéantir"
 siam.18.desc: "Notre plus grande crainte se concrétise finalement. D'après les dernières communications interceptées de l'état-major ennemi, il n'y a aucun projet de négociation ou de concession pour mettre fin à la guerre. Les [FROM.GetHabitants] cherchent simplement à faire capituler notre nation afin de nous emprisonner sous le joug d'une énième force impérialiste. Eh bien, si c'est notre reddition qu'ils veulent, ils vont être déçus."
 siam.18.a: "Nous braverons les menaces !"
 siam.19.t: "[SIA.GetLeLaLNPCap] [SIA.GetName] exig[SIA.GetEEntNP] des territoires"
 siam.19.desc: "Encouragés par leur nationalisme exponentiel et notre absence dans la région, les [SIA.GetHabitants] exigent le contrôle de certains territoires qu'ils considèrent comme historiquement liés à leur nation. Leurs revendications sont ridicules, car ils n'ont pas la force nécessaire pour les assumer, néanmoins ce sont des terres qui ne valent pas la peine de sacrifier nos ressources, étant donné la situation mondiale précaire."
 siam.19.a: "Ça ne vaut pas le coup"
 siam.19.b: "C'est hors de question !"
 siam.20.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] accept[FROM.GetEEntNP] de céder les territoires"
 siam.20.desc: "Les [FROM.GetHabitants] ont accepté de rendre nos territoires. Ont-ils cédé parce qu'ils reconnaissent enfin notre souveraineté, ou est-ce à cause de facteurs extérieurs ? Peu importe ! Notre cause est légitime et juste."
 siam.20.a: "Excellente nouvelle !"
 siam.21.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] refus[FROM.GetEEntNP] de céder les territoires"
 siam.21.desc: "Les [FROM.GetHabitants] refusent de rendre nos territoires. Ces chiens impérialistes gardent la mainmise sur nos régions dans l'espoir de raviver leur gloire passée, alors que leur prestige s'est déjà émoussé depuis un bon moment."
 siam.21.a: "Nous allons leur montrer !"
 SIA_sent_bureaucrats_to_us: "A envoyé des fonctionnaires chez nous"
 SIA_tied_their_currency_to_ours: "A indexé sa monnaie sur la nôtre"
 SIA_sent_started_cooperative_with_us: "A lancé une coopérative du développement avec nous"
 siam.22.t: "Envoi de bureaucrates [SIA.GetAdjMP] à l'étranger"
 siam.22.desc: "Nos bureaucrates ne possèdent pas les compétences nécessaires à la gestion d'une économie moderne. Heureusement, de nombreux pays maîtrisent les subtilités de la bureaucratie de demain. Il nous suffit d'envoyer notre personnel en formation dans l'une de ces nations pour y cueillir les connaissances sans emporter leur idéologie."
 siam.22.a: "Envoyons-les [ENG.GetAuEnANP] [ENG.GetName]"
 siam.22.b: "Envoyons-les [JAP.GetAuEnANP] [JAP.GetName]"
 siam.23.t: "L'Acte de stabilisation du baht"
 siam.23.desc: "Si notre nation souhaite bâtir une économie fiable, il faut trouver un moyen de maîtriser le baht. Nos dirigeants affirment que notre stabilité monétaire serait garantie par l'indexation à une devise forte et répandue. Notre décision est loin d'être triviale : elle façonnera l'avenir tout entier de notre commerce, notre développement économique et l'influence étrangère qui reposera sur le système financier [SIA.GetAdjMS]."
 siam.23.a: "Indexons-nous à la livre sterling"
 siam.23.b: "Indexons-nous au yen"
 siam.24.t: "La coopérative de développement [SIA.GetAdjMS]"
 siam.24.desc: "La coopérative de développement [SIA.GetAdjMS] est un nouvel outil de l'État permettant l'évolution du pays, mais l'ambition dépasse aujourd'hui encore la recette nationale. Les chemins de fer, les usines et les réseaux d'électricité ne poussent que s'ils sont généreusement arrosés d'investissements. Ces fonds, nous devons aller les chercher à l'étranger, ce qui nous place devant un choix cornélien : allons-nous solliciter les [ENG.GetHabitants], qui nous offriraient l'accès à des marchés lucratifs, des entreprises expérimentées et le prestige de Londres, ou solliciterons-nous les [JAP.GetHabitants], la puissance asiatique émergente qui nous prendrait sous son aile ? Dans tous les cas, nous devrons offrir quelque chose en retour."
 siam.24.a: "Sollicitons l'investissement [ENG.GetAdjMS]"
 siam.24.b: "Sollicitons l'investissement [JAP.GetAdjMS]"
 siam.25.t: "Mort de Prajadhipok"
 siam.25.desc: "Le roi Prajadhipok s'est éteint. Son nom rejoint ceux des plus grands hommes de notre histoire. Certains considèrent sa mort comme le chapitre final d'une lutte difficile qui a débuté à l'abolition du règne absolu, en revanche, la cause qu'il a incarnée tout au long de son existence ne s'éteint pas avec lui. Le trône est éternel, tout comme la dynastie. Nous poursuivrons la restauration de la gloire nationale grâce au jeune roi Ananda."
 siam.25.a: "Sa Majesté est une légende, désormais"
 siam.27.t: "De l'art de former un roi"
 siam.27.desc: "Le roi Ananda se trouve toujours [SWI.GetAuEnANP] [SWI.GetName], à des milliers de kilomètres de son royaume. Mais la distance ne nous empêchera pas de forger son éducation. Nous lui choisirons ses instituteurs, nous lui inculquerons les valeurs indispensables à son rang afin qu'il accède au trône avec la mentalité adéquate à l'avenir [ROOT.GetAdjMS]. Ce qu'il assimile aujourd'hui décidera du roi que nous obtiendrons d'ici quelque temps : un soldat, un érudit, autre chose ?\n\nAprès tout, qu'est-ce qu'un roi, sinon que l'extension de son propre pays ?"
 siam.27.a: "Qu'il devienne un érudit"
 siam.27.b: "Qu'il devienne un militaire"
 siam.27.c: "Qu'il étudie l'administration"
 siam.27.d: "Qu'il étudie l'industrie"
 siam.28.t: "Le couronnement du roi Ananda"
 siam.28.desc: "La régence va prendre fin. Ici, à Bangkok, devant les princes, les moines, les ministres et les officiers de l'État, Ananda accède enfin au trône en grande pompe, comme c'est la coutume pour un régent de la dynastie Chakri. Les célébrations balayent les soulèvements et les querelles pour imposer la continuité et l'ordre sacré. Ce couronnement n'est pas seulement une parade, c'est une preuve que la couronne existe toujours et que le royaume, malgré les exils et les conflits, persiste."
 siam.28.a: "Longue vie au roi !"
 siam.29.t: "Étude des chars classiques"
 siam.29.desc: "Les chars classiques règnent encore et toujours sur le champ de bataille, c'est pourquoi nous devons nous inspirer des meilleurs dans ce domaine pour constituer un redoutable corps de chars."
 siam.29.a: "Inspirons-nous des Allemands"
 siam.29.b: "Inspirons-nous des Américains"
 siam.29.c: "Inspirons-nous des Britanniques"
 siam.31.t: "Acquisition de sous-marins"
 siam.31.desc: "Le développement de la marine passe par le déploiement d'une flotte de sous-marins. Pour cela, nous devons décider où nous procurer ces navires. [ENG.GetLeLaLNPCap] [ENG.GetName] et [JAP.GetLeLaLNP] [JAP.GetName] nous ont déposé leurs offres, mais notre choix dépasse largement le cadre des chantiers navals."
 siam.31.a: "Les navires [ENG.GetAdjMP] seront parfaits pour nous"
 siam.31.b: "Nous développerons une flotte de sous-marins inspirés des modèles [JAP.GetAdjMP]"
 siam.32.t: "Acquisition de navires de défense côtière"
 siam.32.desc: "Nous avons besoin de navires de défense efficaces pour nos côtes. Pour cela, nous devons choisir un fournisseur. [ENG.GetLeLaLNPCap] [ENG.GetName] et [JAP.GetLeLaLNP] [JAP.GetName] pourraient occuper ce rôle, mais nous devons garder à l'esprit que cette décision façonnera à la fois notre flotte et nos relations internationales."
 siam.32.a: "Nous nous inspirerons des navires [ENG.GetAdjMP] pour la défense de nos côtes"
 siam.32.b: "Nous nous inspirerons des navires [JAP.GetAdjMP] pour notre flotte de défense côtière"
 siam.33.t: "La vente de la Bangkok Dock Company"
 siam.33.desc: "La vente de la Bangkok Dock Company a été réalisée, et les recettes encaissées. Le gouvernement doit décider comment allouer au mieux ces fonds : alléger la charge financière des citoyens ordinaires, accélérer la réalisation des ambitions techniques du pays, ou renforcer la confiance dans l'avenir de la nation."
 siam.33.a: "Allégez la charge fiscale des citoyens"
 siam.33.b: "Allouez les fonds à la recherche navale"
 siam.33.c: "Utilisez cette rentrée d'argent pour rassurer la population"
 siam.34.t: "Exigences [FROM.GetDuDelaDelNP] [FROM.GetName] sur nos rivages"
 siam.34.desc: "Les forces [FROM.GetAdjFP] font désormais pression sur [ROOT.GetLeLaLNP] [ROOT.GetName], et leurs diplomates s'expriment avec l'assurance de ceux qui pensent que la question est déjà réglée. Ils nous servent le discours habituel sur l'ordre et la stabilité, alors qu'ils ne cherchent qu'à nous soumettre. Nous pouvons obtempérer et préserver l'État sous une forme amoindrie, nous rallier à leur faction dans l'espoir de conserver une certaine marge de manœuvre, ou répondre à cette pression avec un air de défi et repousser l'envahisseur loin de nos côtes."
 siam.34.a: "Nous rallierons leur faction pour préserver notre État"
 siam.34.b: "Dites-leur de quitter notre littoral"
 siam.35.t: "[JAP.GetLeLaLNPCap] [JAP.GetName] exig[JAP.GetEEntNP] d'imprimer plus d'argent"
 siam.35.desc: "[JAP.GetLeLaLNPCap] [JAP.GetName] nous [JAP.GetAOntNP] clairement fait part de [JAP.GetSesLeursNP] attentes : nous devons augmenter la masse monétaire pour répondre à [JAP.GetSesLeursNP] besoins économiques. La charge retombera sur notre population à cause de la hausse des prix, tandis que l'industrie [JAP.GetAdjFS] en récoltera les bénéfices. Nous n'avons guère le choix."
 siam.35.a: "Plions-nous aux exigences [JAP.GetDuDelaDelNP] [JAP.GetName]"
 siam.36.t: "[SIA.GetLeLaLNPCap] [SIA.GetName] exig[SIA.GetEEntNP] un remboursement de la dette"
 siam.36.desc: "[SIA.GetLeLaLNPCap] [SIA.GetName] nous [SIA.GetAOntNP] formellement demandé de rembourser les frais liés au processus de création monétaire que nous [SIA.GetLuiLeurNP] avons imposé. Cette opération nous a bien été utile, mais l'heure est venue d'en payer le prix."
 siam.36.a: "Honorez la dette et commencez le remboursement"
 siam.37.t: "[JAP.GetLeLaLNPCap] [JAP.GetName] accept[JAP.GetEEntNP] de rembourser nos dettes"
 siam.37.desc: "Après nos exigences, [JAP.GetLeLaLNP] [JAP.GetName] [JAP.GetAOntNP] accepté de commencer à rembourser les frais liés au processus de création monétaire. L'indemnisation ne suffira pas à compenser la charge qui pèse sur notre population, mais elle aura le mérite de soulager un peu nos finances."
 siam.37.a: "Une solution équitable qui permettra de relancer notre économie"
 siam.38.t: "[SIA.GetLeLaLNPCap] [SIA.GetName] cherch[SIA.GetEEntNP] à définir [SIA.GetSesLeursNP] conditions"
 siam.38.desc: "Le gouvernement [SIA.GetAdjMS] nous a présenté ses conditions. Ses ministres admettent désormais ce que nos armes ont déjà démontré, à savoir que [ROOT.GetLeLaLNP] [ROOT.GetName] possèd[ROOT.GetEEntNP] l'initiative dans ce conflit. Nous pouvons accepter leur reddition et les réduire à l'obéissance, les rallier à notre faction afin que leur gouvernement serve notre cause, ou rejeter toute forme de compromis et poursuivre la campagne jusqu'à ce que le Siam soit totalement envahi."
 siam.38.a: "Acceptons leur reddition"
 siam.38.b: "Nous userons de la force pour mettre un terme à tout cela"
 siam.39.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] accept[FROM.GetEEntNP] notre reddition"
 siam.39.desc: "[FROM.GetLeader] a choisi d'accepter notre soumission. Pour le moment, [ROOT.GetLeLaLNP] [ROOT.GetName] échapp[ROOT.GetEEntNP] à la dévastation, mais pas à l'humiliation. L'armée a reçu l'ordre de se retirer, et le gouvernement reste en place uniquement grâce à la tolérance d'une puissance supérieure. Nous préservons l'État, mais au prix de notre fierté et de notre liberté d'action."
 siam.39.a: "Nous sommes résolus à subir"
 siam.40.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] rejett[FROM.GetEEntNP] notre offre"
 siam.40.desc: "[FROM.GetLeader] a refusé toute proposition venant de Bangkok. Aucune soumission n'est jugée suffisante et aucun compromis acceptable. L'ennemi compte régler la question par une conquête totale uniquement. Il ne reste plus d'autre choix [ROOT.GetAuAlaAlNP] [ROOT.GetName] que la résistance. Si l'armée refuse de quitter nos côtes par le biais d'un accord, nous les y obligerons par la force."
 siam.40.a: "Si c'est la guerre qu'ils veulent, ils l'auront"
 siam.41.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] envoi[FROM.GetEEntNP] des représentants pour étudier nos méthodes"
 siam.41.desc: "Une délégation de représentants [FROM.GetAdjMP] est arrivée pour observer et étudier nos processus administratifs et nos pratiques de recherche. [FROM.GetLeLaLNPCap] [FROM.GetName] sembl[FROM.GetEEntNP] vouloir moderniser [FROM.GetSonLeurNP] système bureaucratique en s'inspirant des modèles étrangers, et [FROM.GetAOntNP] jeté [FROM.GetSonLeurNP] dévolu sur [ROOT.GetLeLaLNP] [ROOT.GetName]. Cette visite constitue une reconnaissance implicite de nos méthodes, et l'occasion d'entretenir de bonnes relations avec un autre gouvernement."
 siam.41.a: "Nous accueillerons leur délégation"
 siam.42.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] index[FROM.GetEEntNP] [FROM.GetSaLeurNP] monnaie sur la nôtre"
 siam.42.desc: "[FROM.GetLeLaLNPCap] [FROM.GetName] [FROM.GetAOntNP] formellement décidé d'indexer [FROM.GetSaLeurNP] monnaie sur la nôtre. Cette décision rapproche [FROM.GetLeLaLNP] [FROM.GetName] de notre sphère économique et constitue une marque de confiance dans la stabilité de nos institutions financières. Les échanges entre nos pays devraient devenir plus prévisibles, et le commerce avec les marchands [FROM.GetAdjMP] s'en trouvera grandement facilité."
 siam.42.a: "Une évolution encourageante pour nos relations commerciales"
 siam.43.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] demand[FROM.GetEEntNP] d'investir dans le développement"
 siam.43.desc: "[FROM.GetLeLaLNPCap] [FROM.GetName] [FROM.GetAOntNP] invité nos ingénieurs et spécialistes à contribuer au développement de [FROM.GetSaLeurNP] nation. La coopérative offre à nos industries un point d'ancrage dans la région et renforce les liens économiques entre nos gouvernements. Il s'agit d'une proposition modeste, mais qui pourrait rapporter gros à long terme."
 siam.43.a: "Nous sommes ravis de pouvoir aider"
 siam.44.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] command[FROM.GetEEntNP] des sous-marins"
 siam.44.desc: "[FROM.GetLeLaLNPCap] [FROM.GetName] [FROM.GetAOntNP] commandé des sous-marins basés sur nos modèles. Cette transaction constitue une marque de confiance envers notre industrie navale et étend l'influence [FROM.GetDuDelaDelNP] [FROM.GetName] dans les mers d'Asie du Sud-Est."
 siam.44.a: "C'est une commande opportune pour nos chantiers navals"
 SIA_purchased_submarines_from_us: "Nous a acheté des sous-marins"
 siam.45.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] propos[FROM.GetEEntNP] une fusion d'alliances"
 siam.45.desc: "Une délégation est arrivée [FROM.GetDuDelaDelNP] [FROM.GetName] avec une proposition de [FROM.GetLeader]. [FROM.GetLeLaLNPCap] [FROM.GetName] affirm[FROM.GetEEntNP] que nos alliances poursuivent désormais les mêmes objectifs principaux, mais déplor[FROM.GetEEntNP] que les effectifs, le matériel et l'influence diplomatique soient répartis entre des commandements rivaux.\n\nEn unissant nos forces aux leurs, nous pourrions former un bloc puissant capable de coordonner les opérations sur un front plus large. Un tel rapprochement soutiendrait notre cause commune, même si nous serions forcés d'accepter l'influence [FROM.GetDuDelaDelNP] [FROM.GetName] sur l'évolution future de l'alliance."
 siam.45.a: "Un front uni est nécessaire"
 siam.45.b: "Notre alliance n'appartient qu'à nous"
 siam.46.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] accept[FROM.GetEEntNP] la fusion"
 siam.46.desc: "[FROM.GetLeader] a accepté notre proposition visant à fusionner nos alliances en une seule et même coalition. Nos voies diplomatiques et nos commandements distincts sont désormais regroupés au sein d'une structure unique, permettant ainsi à nos gouvernements de coordonner les plans de guerre, les opérations de ravitaillement et la politique étrangère avec une plus grande clarté.\n\nCet accord n'est pas sans complications, mais la nécessité de l'unité était plus importante."
 siam.46.a: "L'union fait la force"
 siam.47.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] refus[FROM.GetEEntNP]\nla fusion"
 siam.47.desc: "[FROM.GetLeader] a rejeté notre proposition visant à fusionner nos alliances. Le gouvernement [FROM.GetDuDelaDelNP] [FROM.GetName] affirme que la coopération pourra se poursuivre lorsque nos intérêts convergeront, mais qu'il ne placera pas son alliance au sein d'une coalition plus large orchestrée depuis [ROOT.Capital.GetCapitalVictoryPointName].\n\nPour l'heure, la division persiste entre nos camps. Nous devrons poursuivre nos objectifs sans compter sur l'engagement [FROM.GetDuDelaDelNP] [FROM.GetName]."
 siam.47.a: "Dans ce cas, nous continuerons seuls"
 siam.48.t: "Les [SIA.GetHabitants] demandent de l'aide [JAP.GetAdjFS]"
 siam.48.desc: "Les [SIA.GetHabitants] ont lancé un appel à l'aide face aux troupes armées qui envahissent leur pays. En guise de compensation, le gouvernement [SIA.GetAdjMS] est prêt à accorder aux entreprises [JAP.GetAdjFP] un accès privilégié aux ressources, aux infrastructures et aux droits commerciaux de sa nation.\n\nIntervenir en faveur [SIA.GetDuDelaDelNP] [SIA.GetName] renforcerait considérablement notre influence en Asie du Sud-Est en plus de nous octroyer des ressources de premier choix. En revanche, notre ingérence pourrait aussi nous jouer des tours."
 siam.48.a: "Acceptons"
 siam.48.b: "Nous n'avons pas les moyens"
 siam.49.t: "Les [JAP.GetHabitants] répondent à notre appel à l'aide"
 siam.49.desc: "Les [JAP.GetHabitants] ont accepté de soutenir notre nation à travers cette crise. Des conseillers [JAP.GetAdjMP], ainsi que du matériel et du ravitaillement, sont déjà en route vers notre territoire. Comme convenu, nous avons immédiatement offert les concessions économiques aux entreprises [JAP.GetAdjFP].\n\nLe gouvernement se félicite, car le pays devrait être sauvé, mais à quel prix ? Parviendrons-nous à regagner notre souveraineté par la suite ?"
 siam.49.a: "Nous avons un nouvel allié"
 SIA_japan_aid_request.4.t: "Les [JAP.GetHabitants] ne répondent pas à notre appel à l'aide"
 SIA_japan_aid_request.4.desc: "Le gouvernement [JAP.GetAdjMS] a refusé de nous fournir une aide militaire. D'après Tokyo, l'Empire n'a pas les moyens matériels ou humains de nous prêter main-forte.\n\nNotre pays va devoir puiser au plus profond de sa volonté si nous tenons à survivre à l'invasion sans assistance étrangère."
 SIA_japan_aid_request.4.a: "Nous sommes seuls"
 siam_adc.1.t: "Les [FROM.GetHabitants] exigent la libération [?var:SIA_adc_demand_country_to_be_released.GetDuDelaDelNP] [?var:SIA_adc_demand_country_to_be_released.GetName]"
 siam_adc.1.desc: "Une missive officielle est arrivée en provenance [FROM.GetDuDelaDelNP] [FROM.GetName], dans laquelle [FROM.GetLeader] qualifie notre occupation des pays asiatiques comme une atteinte intolérable à leur droit à l'autodétermination. La lettre souligne que l'Asie n'est pas un trophée que l'on peut se partager ou administrer selon le bon vouloir des puissances étrangères, et exige que nous retirions immédiatement nos forces et que nous restaurions un gouvernement indépendant [?var:SIA_adc_demand_country_to_be_released.GetAuEnANP] [?var:SIA_adc_demand_country_to_be_released.GetName].\n\nCette exigence ne laisse aucune place au doute, et tout refus de notre part sera considéré comme un outrage à la nation [FROM.GetAdjFS]."
 siam_adc.1.a: "Nous les libérerons"
 siam_adc.1.b: "Ils resteront sous notre occupation"
 siam_adc.2.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] propos[FROM.GetEEntNP] de restaurer notre indépendance"
 siam_adc.2.desc: "Maintenant que [FROM.GetLeLaLNP] [FROM.GetName] [FROM.GetAOntNP] accepté les exigences [SIA.GetDuDelaDelNP] [SIA.GetName] concernant l'avenir [ROOT.GetDuDelaDelNP] [ROOT.GetName], [FROM.GetLeader] nous pose désormais l'ultime question. Si nous décidions de faire à nouveau cavalier seul, les forces d'occupation seraient déjà prêtes à se retirer et à reconnaître un gouvernement [ROOT.GetAdjMS] souverain.\n\nL'indépendance nous garantit dignité et liberté d'action, mais elle nous laisse aussi dans l'obligation de reconstruire l'État sans l'aide [FROM.GetDuDelaDelNP] [FROM.GetName]. Rester sous leur protection constitue une solution plus humble, mais qui pourrait épargner au pays de nouveaux incidents en ces temps difficiles."
 siam_adc.2.a: "Nous resterons une nation libre"
 siam_adc.2.b: "Nous resterons sous protection [FROM.GetAdjFP]"
 siam_adc.3.t: "[?var:SIA_tag_that_was_released_due_to_sia_pressure.GetLeLaLNPCap] [?var:SIA_tag_that_was_released_due_to_sia_pressure.GetName] accept[?var:SIA_tag_that_was_released_due_to_sia_pressure.GetEEntNP] l'indépendance"
 siam_adc.3.desc: "Le gouvernement [?var:SIA_tag_that_was_released_due_to_sia_pressure.GetDuDelaDelNP] [?var:SIA_tag_that_was_released_due_to_sia_pressure.GetName] a choisi l'indépendance. L'administration occupante devant être dissoute, [?var:SIA_tag_that_was_released_due_to_sia_pressure.GetLeLaLNP] [var:SIA_tag_that_was_released_due_to_sia_pressure.GetName] se prépar[?var:SIA_tag_that_was_released_due_to_sia_pressure.GetEEntNP] à reprendre [?var:SIA_tag_that_was_released_due_to_sia_pressure.GetSaLeurNP] place parmi les nations souveraines du monde."
 siam_adc.3.a: "Que leur réserve l'avenir ?"
 siam_adc.4.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] refus[FROM.GetEEntNP] l'indépendance"
 siam_adc.4.desc: "Malgré la liberté qui [FROM.GetLuiLeurNP] était promise, [FROM.GetLeLaLNP] [FROM.GetName] [FROM.GetAOntNP] refusé d'obtenir l'indépendance immédiate. [FROM.GetSesLeursNPCap] ministres affirment que l'État n'est pas encore prêt à endosser les responsabilités d'une pleine souveraineté et qu'il préfère maintenir le statu quo pour le moment."
 siam_adc.4.a: "Dans ce cas, l'arrangement se poursuit"
 siam_adc.5.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] refus[FROM.GetEEntNP] nos exigences"
 siam_adc.5.desc: "[FROM.GetLeLaLNPCap] [FROM.GetName] nous [FROM.GetAOntNP] clairement fait savoir que nos exigences étaient, au mieux, tout à fait ridicules. Notre faible puissance militaire ne nous permettrait pas de remettre en cause le statu quo."
 siam_adc.5.a: "Nous allons leur montrer"
 siam_dem_event_count: "Plus nous attendrons, plus l'armée préparera une campagne de diffamation"
 siam_dem.2.t: "Objection de l'armée"
 siam_dem.2.desc: "Au cours d'une réunion privée entre ministres et officiers supérieurs, un représentant militaire a vivement critiqué la proposition du \"dossier jaune\". Il affirme que ses auteurs s'expriment trop librement sur la direction de l'État, la redistribution et les obligations sociales ; et n'accordent que trop peu d'importance à la discipline, la propriété et les responsabilités qui incomberaient au corps des officiers et aux campagnes. De son point de vue, il n'est pas possible de reconstruire [ROOT.GetLeLaLNP] [ROOT.GetName] à partir de simples théories, alors que le monde devient chaque jour de plus en plus dangereux."
 siam_dem.2.a: "L'armée a exprimé son point de vue"
 siam_dem.3.t: "Une controverse publique"
 siam_dem.3.desc: "Le débat s'était poursuivi en dehors de la salle de réunion. Un journal considéré par beaucoup comme un porte-parole de l'armée avait dénoncé à son tour le dossier jaune, qu'il présentait comme un programme étranger déguisé dans un langage patriotique. Ses rédacteurs arguaient que cette proposition plaçait les revendications de classes au-dessus de l'unité nationale, inspirait la méfiance envers les institutions établies, et suscitait des attentes dangereuses chez les travailleurs et les paysans. Dès l'après-midi, l'article était commenté dans les casernes, les bureaux et les salons de thé, et ce qui n'était au départ qu'un conflit interne avait désormais donné lieu à une controverse publique."
 siam_dem.3.a: "Les critiques pleuvent"
 siam_dem.4.t: "Phibun dénonce le Dossier"
 siam_dem.4.desc: "Phibun est intervenu dans le conflit avec une détermination à toute épreuve. Devant partisans et officiers, il condamne le dossier jaune qu'il qualifie de communiste dans le fond, quel que soit le langage utilisé par ses adeptes. Il affirme qu'un programme qui place l'État au-dessus de la propriété, promet une profonde transformation sociale et suscite l'agitation au sein des classes populaires, ne fait que répandre le poison [ROOT.GetAuEnANP] [ROOT.GetName] sous une autre forme."
 siam_dem.4.a: "Il ne laisse aucune place au doute"
 siam_dem.5.t: "Un gouvernement à tout prix"
 siam_dem.5.desc: "L'ancien régime n'est plus que l'ombre de ce qu'il était. Les forces thaïlandaises libres s'en sont assurées. Néanmoins, le gouvernement que nous souhaitons est loin d'être en place, car la coalition soutenant Phibun ne parvient pas à se mettre d'accord. Trois noms ressortent parmi les discussions : Pridi Banomyong, l'incarnation de la résistance, Khuang Aphaiwong, un conciliateur né, et le général Phin Choonhavan, poussé par les officiers. Notre choix déterminera le destin du pays pour les années à venir."
 siam_dem.5.a: "Pridi Banomyong le mérite"
 siam_dem.5.b: "Khuang Aphaiwong plaira à tous"
 siam_dem.5.c: "Le général Phin Choonhavan apaisera l'armée"
 ###################
 #### AUSTRALIA ####
 ###################
 AST_election_events.1.t.a: "Victoire de l'UAP !"
 AST_election_events.1.t.b: "Victoire de l'ALP !"
 AST_election_events.1.desc.a: "Le scrutin a été comptabilisé : le United Australia Party a remporté les élections !\n\nAprès une courte période de constitution gouvernementale, l'UAP disposera de trois années pour prouver à l'électorat qu'il a eu raison de voter pour lui."
 AST_election_events.1.desc.b: "Le scrutin a été comptabilisé : le Australian Labour Party a remporté les élections !\n\nAprès une courte période de constitution gouvernementale, l'ALP disposera de trois années pour prouver à l'électorat qu'il a eu raison de voter pour lui."
 AST_election_events.1.a: "Le peuple a parlé !"
 AST_election_events.2.t: "À mi-chemin des élections fédérales"
 AST_election_events.2.desc: "À la tête [AST.GetDuDelaDelNP] [AST.GetName] depuis 1931, le $AST_democratic_party_long$ a aidé le pays à sortir de la Grande Dépression et à s'éloigner des idées antidémocratiques. Par sa stabilité, ses idéaux conservateurs, et sa loyauté envers la Grande-Bretagne, l'UAP a renforcé son soutien et jeté les bases d'un nouveau mandat. Toutefois, un autre parti n'a pas encore dit son dernier mot.\n\nRécupérant encore de la motion de défiance qui l'avait écarté du pouvoir en 1931, le $AST_labor_party_long$ commence à retrouver de l'allant. Les voix communistes étant réduites au silence, la classe ouvrière se cherche un nouveau phare. Se donnant pour mission de représenter tous les citoyens, l'ALP a adopté une approche différente de l'impérialisme et de la loyauté de l'Australie envers l'Empire. Les besoins du pays doivent passer en priorité, reléguant les intérêts étrangers au second plan.\n\nLes prochaines élections fédérales auront lieu dans un an et demi. Si l'UAP veut s'adjuger une nouvelle victoire, ses dirigeants devront accélérer les réformes pour conserver le soutien de la population. Sinon, la campagne de l'ALP pourrait bien lui permettre de revenir sur le devant de la scène."
 AST_election_events.2.a: "L'UAP devra appliquer ses dernières réformes"
 AST_election_events.2.b: "Une tournée électorale à travers l'Australie devrait renforcer la cote de popularité de l'ALP"
 AST_election_events.3.t: "$AST_election_season_cat$"
 AST_election_events.3.desc: "$AST_election_season_cat_desc$"
 AST_election_events.3.a: "C'est parti"
 AST_diplomatic_events.1.t: "Pacte de non-agression australien"
 AST_diplomatic_events.1.desc: "Dans le cadre de sa campagne diplomatique, le gouvernement australien cherche à conclure des pactes de non-agression avec certaines nations asiatiques, dont la nôtre. Cette requête prouve soit que l'administration australienne est totalement hors-sol, soit qu'elle est très honorable.\n\nAcceptons-nous ce pacte ?"
 AST_diplomatic_events.1.a: "Bien sûr que non"
 AST_diplomatic_events.1.b: "Oui, signons ce pacte"
 AST_diplomatic_events.2.t: "Refus du pacte de non-agression"
 AST_diplomatic_events.2.desc: "La délégation envoyée [FROM.GetAuEnANP] [FROM.GetName] s'est vu refuser la signature du pacte de non-agression. Nous savions que cette demande impliquait des retombées considérables, aussi ce refus ne nous étonne pas."
 AST_diplomatic_events.2.a: "Ça valait la peine d'essayer"
 AST_diplomatic_events.3.t: "Pacte du pacifique signé"
 AST_diplomatic_events.3.desc: "La délégation envoyée [FROM.GetAuEnANP] [FROM.GetName] s'est vu accepter la signature du pacte de non-agression. [FROM.GetLeader] salue notre initiative de paix."
 AST_diplomatic_events.3.a: "Formidable !"
 AST_diplomatic_events.4.t: "L'Australie demande Singapour"
 AST_diplomatic_events.4.desc: "Les Australiens ont depuis longtemps remis en question l'infaillibilité de la stratégie de Singapour : d'après eux, notre intervention en cas de guerre dans le Pacifique est plus qu'incertaine. C'est pourquoi ils souhaitent obtenir le contrôle de ce territoire. Ce transfert déchargerait les Britanniques, mais imposerait une charge supplémentaire aux Australiens.\n\nPensons-nous vraiment que leur céder Singapour sécuriserait davantage nos dépendances du Pacifique ?"
 AST_diplomatic_events.4.a: "Oui, très bonne idée !"
 AST_diplomatic_events.4.b: "Non, Singapour est à nous"
 AST_diplomatic_events.5.t: "La Grande-Bretagne accepte notre demande"
 AST_diplomatic_events.5.desc: "La Grande-Bretagne accepte le transfert de Singapour sous notre autorité, mettant fin à la stratégie de Singapour obsolète. Nous voilà maîtres de nos propres défenses."
 AST_diplomatic_events.5.a: "Voilà qui rebat les cartes"
 AST_diplomatic_events.5.a.tt: "§YSingapour§! :\n  Sous contrôle de l'§YAustralie§!.\n  Appartient à l'§YAustralie§!.\n§YÎle Christmas§! :\n  Sous contrôle de l'§YAustralie§!.\n  Appartient à l'§YAustralie§!.\n§YÎles Cocos§! :\n  Sous contrôle de l'§YAustralie§!.\n  Appartient à l'§YAustralie§!."
 AST_diplomatic_events.6.t: "La Grande-Bretagne rejette notre demande"
 AST_diplomatic_events.6.desc: "La Grande-Bretagne refuse de transférer Singapour sous notre autorité. La situation demeurera ainsi."
 AST_diplomatic_events.6.a: "Espérons que leur stratégie soit payante"
 AST_diplomatic_events.7.t: "Les [AST.GetHabitants] demandent notre aide"
 AST_diplomatic_events.7.desc: "Les [AST.GetHabitants] souhaitent acquérir du matériel de leurs alliés pour contribuer à leur effort de guerre. Ils ont besoin de notre aide pour organiser l'acheminement des marchandises. Avons-nous des convois à leur prêter ?"
 AST_diplomatic_events.7.a: "Bien sûr"
 AST_diplomatic_events.7.b: "Non, aucun"
 AST_diplomatic_events.8.t: "Les [USA.GetHabitants] acceptent de nous aider"
 AST_diplomatic_events.8.desc: "Les [USA.GetHabitants] ont accepté de nous fournir quelques convois afin de contribuer au ravitaillement du pays."
 AST_diplomatic_events.8.a: "C'est fort aimable de leur part !"
 AST_diplomatic_events.9.t: "Les [USA.GetHabitants] refusent de nous aider"
 AST_diplomatic_events.9.desc: "Les [USA.GetHabitants] n'ont aucun convoi à nous prêter pour contribuer au ravitaillement du pays."
 AST_diplomatic_events.9.a: "Nous devrons nous débrouiller seuls"
 AST_diplomatic_events.10.t: "Une alliance de guerre"
 AST_diplomatic_events.10.desc: "Les [AST.GetHabitants] portent en haute estime [USA.GetLeLaLNP] [USA.GetName]. C'est pourquoi ils souhaiteraient former avec nous une coalition internationale de guerre. En unissant nos forces, nous pourrions nous entraider dans les conflits à venir."
 AST_diplomatic_events.10.a: "C'est vrai, acceptons !"
 AST_diplomatic_events.10.b: "Nous nous portons mieux sans eux"
 AST_diplomatic_events.11.t: "Une alliance de guerre"
 AST_diplomatic_events.11.desc: "Les [USA.GetHabitants] ont accepté d'unir nos forces. En tant que membres de la faction [AST.GetFactionName], les [AST.GetHabitants] et les [USA.GetHabitants] se jurent assistance dans tous les conflits à venir."
 AST_diplomatic_events.11.a: "Nos ennemis n'auront aucune chance"
 AST_diplomatic_events.12.t: "Une alliance impossible"
 AST_diplomatic_events.12.desc: "Les [USA.GetHabitants] ont refusé d'unir nos forces. Les [AST.GetHabitants] et les [USA.GetHabitants] se défendrons donc chacun de leur côté."
 AST_diplomatic_events.12.a: "Nous ferons cavalier seul"
 AST_diplomatic_events.13.t: "Clause n°6"
 AST_diplomatic_events.13.desc: "Lors de la formation de la fédération d'Australie, [NZL.GetLeLaLNP] [NZL.GetName] [NZL.GetAOntNP] décidé de ne pas y participer. Pourtant, la Constitution a toujours désigné ce territoire comme un État potentiel du Commonwealth [AST.GetAdjMS], validant de facto son éventuelle admission.\n\nConsidérant la crise mondiale, les [AST.GetHabitants] appellent à l'unité, et demandent donc [NZL.GetAuAlaAlNP] [NZL.GetName] de se soumettre à leur autorité. Allons-nous tenir un référendum pour trancher sur la question ?"
 AST_diplomatic_events.13.a: "Organisons le référendum"
 AST_diplomatic_events.13.a.tt: "Un référendum aura lieu, résultant peut-être sur l'§Rannexion§! [NZL.GetDuDelaDelNP] §Y[NZL.GetName]§!"
 AST_diplomatic_events.13.b: "C'est hors de question !"
 AST_diplomatic_events.14.t: "[NZL.GetLeLaLNPCap] [NZL.GetName] devien[NZL.GetTNentNP] un État [AST.GetAdjMS]"
 AST_diplomatic_events.14.desc: "À l'issue du référendum, les [NZL.GetHabitants] ont décidé de faire appel à la clause n°6 de la constitution [AST.GetAdjFS]. Ils ont donc accepté de confier la protection de leurs terres aux [AST.GetHabitants] en devenant le tout dernier État."
 AST_diplomatic_events.14.a: "Nous grandissons encore !"
 AST_diplomatic_events.15.t: "La population [NZL.GetAdjFS] s'oppose"
 AST_diplomatic_events.15.desc: "À l'issue du référendum, les [NZL.GetHabitants] ont décidé de faire appel à la clause n°6 de la constitution [AST.GetAdjFS]. Malheureusement, ils demeureront une nation indépendante."
 AST_diplomatic_events.15.a: "Rien ne change"
 AST_diplomatic_events.16.t: "L'administration [NZL.GetAdjFS] s'oppose"
 AST_diplomatic_events.16.desc: "Malgré la pressions [AST.GetAdjFS], les [NZL.GetHabitants] ont décidé de ne pas tenir de référendum sur l'assimilation de leur pays. Malheureusement, ils demeureront une nation indépendante."
 AST_diplomatic_events.16.a: "Rien ne change"
 AST_diplomatic_events.17.t: "Partenariat [AST.GetAdjMS]"
 AST_diplomatic_events.17.desc: "L'ennemi nous vient du nord. Ce n'est plus qu'une question de temps avant qu'il n'arrive à nos portes. Du moins, c'est ce que nous disent les dirigeants australiens. Pour faire face à cette menace, les [AST.GetHabitants] nous proposent donc de former un front uni en assimilant notre pays sous leur autorité, ou, faute de mieux, de leur octroyer l'accès militaire sur notre sol."
 AST_diplomatic_events.17.a: "C'est d'accord, rejoignons-les"
 AST_diplomatic_events.17.a.tt: "[INS.GetLeLaLNPCap] §Y[INS.GetName]§! v[INS.GetAOntNP] devenir un §YÉtat fantoche§! [AST.GetDuDelaDelNP] §Y[AST.GetName]§!"
 AST_diplomatic_events.17.b: "Octroyons uniquement l'accès militaire"
 AST_diplomatic_events.17.b.tt: "[INS.GetLeLaLNPCap] §Y[INS.GetName]§! v[INS.GetAOntNP] octroyer l'§Yaccès militaire§! [AST.GetAuAlaAlNP] §Y[AST.GetName]§!"
 AST_diplomatic_events.17.c: "Ils n'auront rien"
 AST_diplomatic_events.18.t: "[INS.GetLeLaLNPCap] [INS.GetName] accept[INS.GetEEntNP] notre demande"
 AST_diplomatic_events.18.desc: "Les [INS.GetHabitants] acceptent de rejoindre notre nation. Cette coopération va accroître considérablement nos capacités de défense."
 AST_diplomatic_events.18.a: "Formidable !"
 AST_diplomatic_events.19.t: "[INS.GetLeLaLNPCap] [INS.GetName] refus[INS.GetEEntNP] notre demande"
 AST_diplomatic_events.19.desc: "Les [INS.GetHabitants] refusent de rejoindre notre nation. Nous devrons donc assurer notre défense chacun de notre côté."
 AST_diplomatic_events.19.a: "Nous nous en sortirons sans eux"
 AST_diplomatic_events.20.t: "Convocation au Cabinet de guerre britannique"
 AST_diplomatic_events.20.desc: "[GET_AST_BWC_COUNT]Les [ENG.GetHabitants] ont convoqué le Premier ministre [AST.GetAdjMS] au Cabinet de guerre britannique. La situation mondiale ayant atteint un seuil critique, ils cherchent à établir des plans d'action et une coopération militaire avec leurs alliés.\n\nCependant, nous avons d'autres priorités. Avons-nous le temps d'envoyer le Premier ministre à cette réunion ?"
 AST_diplomatic_events.20.a: "Qu'il s'y rende au plus vite"
 AST_diplomatic_events.20.b: "Nous avons besoin de lui ici"
 AST_bwc_count_2: "C'est la seconde fois que [ENG.GetLeader] demande la présence de [AST.GetLeader], car une coopération étroite entre nos deux nations est la seule garantie de leur survie.\n\n"
 AST_bwc_count_3: "Une fois de plus, on demande à [AST.GetLeader] de traverser les océans pour superviser la coopération du Commonwealth. L'insistance semble s'effacer, cependant : notre réponse gagera de notre engagement futur dans les affaires communes ou de notre isolationnisme.\n\n"
 AST_bwc_accept_effect_tt: "§YConséquences pour avoir accepté l'invitation 3 fois :§!"
 AST_bwc_accept_tt: "Accepter l'invitation §Y[?var:AST_bwc_accept]§!/§Y3§! fois"
 AST_diplomatic_events.22.t: "Cabinet de guerre britannique productif"
 AST_diplomatic_events.22.desc: "Le Premier ministre [AST.GetAdjMS] assiste régulièrement au Cabinet de guerre britannique depuis un peu plus d'un an. La nation a dû prendre son mal en patience sur certaines affaires, mais nous avons grandement bénéficié de la coopération militaire avec les [ENG.GetHabitants]."
 AST_diplomatic_events.22.a: "Ça en valait la peine"
 AST_diplomatic_events.23.t: "[ENG.GetLeader] se détourne des [AST.GetHabitants]"
 AST_diplomatic_events.23.desc: "Après toutes ces invitations envoyées au Premier ministre à rejoindre le Cabinet de guerre britannique retournées d'un refus, [ENG.GetLeader] ne souhaite plus réitérer la convocation."
 AST_diplomatic_events.23.a: "C'est compréhensible"
 AST_diplomatic_events.24.t: "Changement de dirigeant"
 AST_diplomatic_events.24.desc: "Le Premier ministre [AST.GetAdjMS] a porté une influence majeure sur l'effort de guerre du Commonwealth britannique. Au cours de ses visites à Londres, Robert Menzies a gagné la confiance des ministres d'outre-Manche, au détriment de l'intégrité de leur propre Premier ministre. Ces derniers demandent désormais que Menzies prenne sa place au sein du cabinet [ENG.GetAdjMS].\n\nMême si [AST.GetLeLaLNP] [AST.GetName] perd[AST.GetXEntNP] [AST.GetSonLeurNP] Premier ministre, le pays s'assure ainsi la loyauté éternelle de son suzerain en plaçant un citoyen australien à la tête du gouvernement britannique. L'Australie souhaite davantage de pouvoir, et Robert Menzies est le mieux placé pour le lui accorder."
 AST_diplomatic_events.24.a: "Le vent tourne"
 AST_diplomatic_events.25.t: "Sous la gouverne de Canberra"
 AST_diplomatic_events.25.desc: "Les tensions croissantes entre les nations du Pacifique sont inquiétantes. D'après [AST.GetLeLaLNP] [AST.GetName], la Grande-Bretagne est empêtrée dans ses batailles, ce qui entrave toute assistance de leur part.\n\nLes [AST.GetHabitants] cherchent à reproduire le Commonwealth britannique au sein de l'océan Indien et Pacifique, avec Canberra à sa tête pour unifier tous les pays de la région. Qu'en disons-nous ?"
 AST_diplomatic_events.25.a: "Acceptons : la région s'en retrouvera renforcée"
 AST_diplomatic_events.25.b: "C'est hors de question !"
 AST_diplomatic_events.26.t: "Le Commonwealth du Pacifique"
 AST_diplomatic_events.26.desc: "Les [ENG.GetHabitants] ont accepté que le Pacifique soit unifié sous notre contrôle. Tous les territoires leur appartenant ont été placés sous notre autorité."
 AST_diplomatic_events.26.a: "Les nations du Pacifique sont enfin unies !"
 AST_diplomatic_events.27.t: "[ENG.GetLeLaLNPCap] [ENG.GetName] rejett[ENG.GetEEntNP] notre demande"
 AST_diplomatic_events.27.desc: "Les [ENG.GetHabitants] ont refusé que le Pacifique soit unifié sous notre contrôle. Tous les territoires leur appartenant demeureront sous leur autorité."
 AST_diplomatic_events.27.a: "Qu'importe, nous subsisterons"
 AST_diplomatic_events.28.t: "[ENG.GetLeader] coupe les ponts"
 AST_diplomatic_events.28.desc: "Le différend entre [AST.GetLeader] et [ENG.GetLeader] nous a rapporté un maigre renfort ainsi qu'une rancœur renouvelée envers notre Premier ministre."
 AST_diplomatic_events.28.a: "Nous allons devoir nous défendre seuls"
 AST_diplomatic_events.29.t: "Les [ENG.GetHabitants] nous viennent en aide"
 AST_diplomatic_events.29.desc: "En réponse à l'insistance [AST.GetAdjFS] sur le projet d'une guerre contre [JAP.GetLeLaLNP] [JAP.GetName], les [ENG.GetHabitants] ont accepté de soutenir notre campagne de travaux sur les infrastructures défensives."
 AST_diplomatic_events.29.a: "Nous apprécions le coup de main, mais ça n'empêchera pas la guerre"
 AST_diplomatic_events.30.t: "L'Australie demande des droits sur les ressources"
 AST_diplomatic_events.30.desc: "Ces maudits expansionnistes se jettent sur l'Indochine non seulement pour se déchirer ses terres, mais aussi ses ressources. D'après l'Australie, s'ils parviennent à mettre la main dessus, la guerre ne fera que perdurer. En revanche, si les Australiens s'en emparent, ils pourraient y mettre un terme au plus vite.\n\nAcceptons-nous de leur céder des droits ?"
 AST_diplomatic_events.30.a: "Oui, acceptons"
 AST_diplomatic_events.30.b: "Ces ressources ne leur appartiennent pas !"
 AST_diplomatic_events.31.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] accord[FROM.GetEEntNP] des droits d'exploitation aux [AST.GetHabitants]"
 AST_diplomatic_events.31.desc: "Ces maudits expansionnistes se jettent sur l'Indochine non seulement pour se déchirer ses terres, mais aussi ses ressources. D'après l'Australie, s'ils parviennent à mettre la main dessus, la guerre ne fera que perdurer. En revanche, si les Australiens s'en emparent, ils pourraient y mettre un terme au plus vite.\n\nLes [ROOT.OVERLORD.GetHabitants] ont décidé d'accepter."
 AST_diplomatic_events.31.a: "Nous ne pouvons rien y faire"
 AST_diplomatic_events.32.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] nous accord[FROM.GetEEntNP] des droits d'exploitation"
 AST_diplomatic_events.32.desc: "Les [FROM.GetHabitants] ont accepté de céder les ressources de l'Indochine aux mains de l'Australie."
 AST_diplomatic_events.32.a: "Nous en ferons bon usage"
 AST_diplomatic_events.33.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] refus[FROM.GetEEntNP] de nous céder des droits d'exploitation"
 AST_diplomatic_events.33.desc: "Les [FROM.GetHabitants] ont refusé de céder les ressources de l'Indochine aux mains de l'Australie."
 AST_diplomatic_events.33.a: "Espérons que l'ennemi ne s'en empare pas"
 AST_diplomatic_events.34.t: "[AST.GetLeLaLNPCap] [AST.GetName] demand[AST.GetEEntNP] la division des territoires du Pacifique"
 AST_diplomatic_events.34.desc: "Les [AST.GetHabitants] nous proposent un pacte qui permettrait de faire taire tous les différends entre nos nations avant même qu'ils ne se manifestent : en divisant le Pacifique à nous deux, nous pourrons planifier notre expansion sans craindre une interférence de l'autre."
 AST_diplomatic_events.34.a: "Voilà qui semble juste"
 AST_diplomatic_events.34.b: "Nous irons là où nous voulons !"
 AST_diplomatic_events.35.t: "Division du Pacifique"
 AST_diplomatic_events.35.desc: "Les [AST.GetHabitants] et les [JAP.GetHabitants] ont signé un pacte divisant les territoires du Pacifique en deux parties, afin que chaque nation puisse planifier son expansion sans craindre d'interférence de l'autre."
 AST_diplomatic_events.35.a: "Voilà qui est réglé"
 AST_diplomatic_events.36.t: "Tous les coups sont permis au Pacifique"
 AST_diplomatic_events.36.desc: "Les [JAP.GetHabitants] ont refusé de diviser les territoires du Pacifique entre nos deux nations, préférant conquérir comme bon leur semble."
 AST_diplomatic_events.36.a: "Eh bien, nous en ferons autant !"
 AST_diplomatic_events.37.t: "Transfert de suzeraineté"
 AST_diplomatic_events.37.desc: "Les [AST.GetHabitants] ont décidé de nulle part de céder le contrôle de nos terres aux [JAP.GetHabitants]. Ce revirement soudain cache une bien triste affaire qui sera très certainement bientôt révélée au grand jour."
 AST_diplomatic_events.37.a: "Et bien sûr, nous n'avons pas notre mot à dire"
 AST_diplomatic_events.38.t: "Le pacte de Nauru"
 AST_diplomatic_events.38.desc: "À l'issue de la Première Guerre mondiale, les territoires allemands du Pacifique ont été confiés aux [AST.GetHabitants]. Néanmoins, il existe peut-être un moyen d'en récupérer un : l'île de Nauru.\n\nLe parti [AST.GetFascistParty] cherche à se rapprocher de notre gouvernement afin d'accomplir son objectif : séparer son pays des [ENG.GetHabitants]. En raison de l'influence limitée du mouvement, ses représentants demandent notre soutien pour accélérer son développement. Une fois qu'ils seront au pouvoir, ils assurent qu'ils nous rendront le contrôle de Nauru, à condition que nous leur garantissions l'indépendance."
 AST_diplomatic_events.38.a: "Notre territoire nous sera rendu !"
 AST_diplomatic_events.38.b: "Non, ce ne sont que des paroles en l'air"
 AST_diplomatic_events.39.t: "[GER.GetLeLaLNPCap] [GER.GetName] accept[GER.GetEEntNP] le pacte de Nauru"
 AST_diplomatic_events.39.desc: "[GER.GetLeLaLNPCap] [GER.GetName] et le parti [AST.GetFascistParty] s'accordent sur un objectif commun : l'indépendance [AST.GetDuDelaDelNP] [AST.GetName]. En raison de l'influence politique limitée du parti [AST.GetFascistParty], [GER.GetLeLaLNP] [GER.GetName] apportera une contribution financière afin d'accélérer son développement et, lorsque notre influence ne sera plus limitée, l'accord pourra entrer en vigueur."
 AST_diplomatic_events.39.a: "Formidable !"
 AST_diplomatic_events.40.t: "Échec du pacte de Nauru"
 AST_diplomatic_events.40.desc: "Les [GER.GetHabitants] refusent de s'engager sur de simples promesses. Le pacte de Nauru n'aura pas eu l'opportunité d'exister. Les ambitions du parti [AST.GetFascistParty] reposent donc uniquement sur nos épaules."
 AST_diplomatic_events.40.a: "Nous y arriverons sans leur aide"
 AST_diplomatic_events.41.t: "Retour de Nauru aux [GER.GetHabitants]"
 AST_diplomatic_events.41.desc: "Enfin au pouvoir, le parti [AST.GetFascistParty] tient parole et rend officiellement le contrôle de Nauru aux [GER.GetHabitants]. Quant à nous, nous garantissons l'indépendance de l'Australie."
 AST_diplomatic_events.41.a: "Nous le ferons"
 AST_diplomatic_events.42.t: "Le parti [AST.GetFascistParty] se dédit"
 AST_diplomatic_events.42.desc: "Le problème, avec les promesses, c'est qu'on peut très facilement ne pas les tenir. Malgré son ascension fulgurante à la tête du pays, le parti [AST.GetFascistParty] a décidé de conserver Nauru, mais aussi de s'emparer des autres îles du Pacifique.\n\nNos anciens territoires du Pacifique ne nous appartiendront pas plus qu'avant la signature du pacte de Nauru, et si nous voulons qu'il en soit autrement, ce sera la guerre."
 AST_diplomatic_events.42.a: "Gare aux conséquences..."
 AST_diplomatic_events.43.t: "[AST.GetLeLaLNPCap] [AST.GetName] demand[AST.GetEEntNP] l'Asie du Sud-Est"
 AST_diplomatic_events.43.desc: "[AST.GetLeLaLNPCap] [AST.GetName] affirm[AST.GetEEntNP] que nous pourrons nous servir de [AST.GetSonLeurNP] expansion vers le nord pour renforcer notre influence commune sur la diplomatie et les conflits en Asie du Sud-Est. S'il ne s'agit pas d'une exigence proprement dite, [AST.GetLeader] nous a bien fait comprendre qu'aucun refus ne serait toléré."
 AST_diplomatic_events.43.a: "Ce sera sans doute pour le mieux"
 AST_diplomatic_events.43.b: "Et pourtant, c'est un refus que nous lui opposerons"
 AST_diplomatic_events.44.t: "Un transfert d'Asie du Sud-Est"
 AST_diplomatic_events.44.desc: "[ENG.GetLeLaLNPCap] [ENG.GetName] [ENG.GetAOntNP] sagement accepté de nous céder [ENG.GetSesLeursNP] territoires d'Asie du Sud-Est. Notre influence s'étend à l'image des frontières australiennes, et ce n'est qu'une question de temps avant que le monde ne nous appartienne."
 AST_diplomatic_events.44.a: "L'avenir s'annonce radieux"
 AST_diplomatic_events.45.t: "L'Asie du Sud-Est restera telle qu'elle est"
 AST_diplomatic_events.45.desc: "[ENG.GetLeLaLNPCap] [ENG.GetName] [ENG.GetAOntNP] refusé de nous céder [ENG.GetSesLeursNP] territoires d'Asie du Sud-Est. Toutefois, il est évident que le contrôle de cette région représente un certain intérêt, et même si nous ne l'obtenons pas sur simple demande, il n'est pas exclu qu'elle finisse par nous appartenir un jour."
 AST_diplomatic_events.45.a: "C'est tout à fait possible, en effet"
 #AST_diplomatic_events.46.t was removed
 AST_diplomatic_events.47.t: "Partage des tâches"
 AST_diplomatic_events.47.desc: "Malgré [AST.GetSaLeurNP] récente sortie du Commonwealth britannique, [AST.GetLeLaLNP] [AST.GetName] propos[AST.GetEEntNP] une coopération militaire. [AST.GetLeLaLNPCap] affirm[AST.GetEEntNP] qu'un partage des tâches bénéficierait [ENG.GetAuAlaAlNP] [ENG.GetName], étant donné [ENG.GetSaLeurNP] présence aux quatre coins du globe."
 AST_diplomatic_events.47.a: "C'est d'accord"
 AST_diplomatic_events.47.b: "Nous allons nous débrouiller autrement"
 AST_diplomatic_events.48.t: "Le pacte anglo-australien"
 AST_diplomatic_events.48.desc: "[ENG.GetLeLaLNPCap] [ENG.GetName] [ENG.GetAOntNP] accepté de signer un pacte de non-agression, posant ainsi les bases d'une coopération militaire."
 AST_diplomatic_events.48.a: "Cela marque le début d'un nouveau chapitre dans nos relations"
 AST_diplomatic_events.49.t: "Pacte non signé"
 AST_diplomatic_events.49.desc: "[ENG.GetLeLaLNPCap] [ENG.GetName] [ENG.GetAOntNP] refusé de signer un pacte de non-agression, anéantissant ainsi tout espoir de coopération militaire entre nos deux nations. Nous devons continuer en agissant seuls."
 AST_diplomatic_events.49.a: "C'est ce que nous ferons"
 AST_diplomatic_events.50.t: "La garnison australienne du Pacifique"
 AST_diplomatic_events.50.desc: "Bien que la protection de l'Asie du Sud-Est et du Pacifique soit dans l'intérêt des Britanniques, cette région se trouve bien loin de leurs îles, ce que [FROM.GetLeLaLNP] [FROM.GetName] [FROM.GetAOntNP] bien compris. En échange de notre aide au ravitaillement, [FROM.GetIlElleNP] nous proposer[From.GetAOntNP] d'assurer la défense du territoire, afin de nous permettre de nous consacrer à d'autres points stratégiques."
 AST_diplomatic_events.50.a: "Toute aide [FROM.GetDuDelaDelNP] [FROM.GetName] sera la bienvenue"
 AST_diplomatic_events.50.b: "La région est suffisamment proche"
 AST_diplomatic_events.51.t: "La garnison [ENG.GetAdjFS] du Pacifique"
 AST_diplomatic_events.51.desc: "[FROM.GetLeLaLNPCap] [FROM.GetName] accept[FROM.GetEEntNP] : nous nous chargerons de la protection des mers d'Asie du Sud-Est. En échange de livraisons de carburant par les Britanniques, [ROOT.GetLeLaLNP] [ROOT.GetName] s'efforcer[ROOT.GetAOntNP] de renforcer [ROOT.GetSaLeurNP] domination navale dans les eaux voisines."
 AST_diplomatic_events.51.a: "Ces eaux nous appartiennent"
 AST_diplomatic_events.52.t: "La propre garnison australienne du Pacifique"
 AST_diplomatic_events.52.desc: "[FROM.GetLeLaLNPCap] [FROM.GetName] refus[FROM.GetEEntNP] que nous nous chargions de la protection des mers d'Asie du Sud-Est. Toutefois, avec ou sans soutien de la part des Britanniques, [ROOT.GetLeLaLNP] [ROOT.GetName] s'efforcer[ROOT.GetAOntNP] de renforcer [ROOT.GetSaLeurNP] domination navale dans les eaux voisines."
 AST_diplomatic_events.52.a: "Ces eaux nous appartiennent"
 AST_diplomatic_events.53.t: "Chasser Vichy d'Afrique"
 AST_diplomatic_events.53.desc: "[AST.GetLeLaLNPCap] [AST.GetName] soupçonn[AST.GetEEntNP] que la chute ou la coopération de la France de Vichy soit l'un des principaux objectifs [ENG.GetDuDelaDelNP] [ENG.GetName], et [AST.GetAOntNP] donc proposé de poursuivre les colonies africaines françaises jusqu'à ce que Vichy se soumette. Même si cette proposition cache peut-être quelque chose, il est évident qu'une présence alliée renforcée dans la région nous serait bénéfique.\n\nSi nous donnons notre accord, [AST.GetLeLaLNP] [AST.GetName] entamer[AST.GetAOntNP] les négociations avec la France de Vichy, afin d'obtenir un transfert pacifique de ses colonies et l'établissement d'une garnison australienne."
 AST_diplomatic_events.53.a: "Leur aide sera la bienvenue"
 AST_diplomatic_events.53.b: "Le risque que [AST.GetLeLaLNP] [AST.GetName] s'en serv[AST.GetEEntNP] contre nous est trop grand"
 AST_diplomatic_events.54.t: "À leur secours"
 AST_diplomatic_events.54.desc: "[ENG.GetLeLaLNPCap] [ENG.GetName] accept[ENG.GetEEntNP] : une présence alliée renforcée en Afrique sera bénéfique pour le Commonwealth.\n\nNous entamerons les négociations avec la France de Vichy, afin d'obtenir un transfert pacifique de ses colonies et l'établissement d'une garnison australienne."
 AST_diplomatic_events.54.a: "Nous le ferons"
 AST_diplomatic_events.55.t: "Avec ou sans autorisation"
 AST_diplomatic_events.55.desc: "[ENG.GetLeLaLNPCap] [ENG.GetName] refus[ENG.GetEEntNP] toute aide australienne en Afrique, préférant s'occuper de la France de Vichy de [ENG.GetSonLeurNP] côté. Toutefois, cela ne suffira pas à nous détourner de nos ambitions.\n\nUn contrôle australien sur les territoires africains de la France de Vichy ferait de nous un membre à part entière du Commonwealth britannique, et non un simple subordonné. Nous devons continuer en dépit de la volonté [ENG.GetDuDelaDelNP] [ENG.GetName], même si nous devons user de la force."
 AST_diplomatic_events.55.a: "Nous nous développerons"
 AST_diplomatic_events.56.t: "[AST.GetLeLaLNPCap] [AST.GetName] exig[AST.GetEEntNP] des territoires africains"
 AST_diplomatic_events.56.desc: "Au nom [ENG.GetDuDelaDelNP] [ENG.GetName], [AST.GetLeLaLNP] [AST.GetName] frapp[AST.GetEEntNP] à notre porte pour exiger le transfert de territoires africains.\n\nLes [ENG.GetHabitants] sont déterminés à étendre leur contrôle en Afrique et, si nous refusons de nous soumettre à l'occupation australienne, ils reviendront frapper à notre porte... mais armés."
 AST_diplomatic_events.56.a: "Afin d'éviter tout conflit, nous autoriserons le transfert des territoires"
 AST_diplomatic_events.56.b: "Qu'ils reviennent armés, dans ce cas"
 AST_diplomatic_events.57.t: "Vichy transfère des territoires africains"
 AST_diplomatic_events.57.desc: "La France de Vichy a accepté de transférer les territoires africains demandés, permettant ainsi à une garnison australienne de prendre le contrôle de la région."
 AST_diplomatic_events.57.a: "Notre projet d'expansion en Afrique continue !"
 AST_diplomatic_events.58.t: "Vichy refuse d'accorder des territoires [AST.GetAuAlaAlNP] [AST.GetName]"
 AST_diplomatic_events.58.desc: "La France de Vichy refuse de nous céder des territoires africains. Malheureusement pour eux, ce n'était pas une simple demande, mais plutôt une exigence de notre part.\n\nNous nous emparerons de la région qu'ils nous ont refusée, même si nous devons user de la force."
 AST_diplomatic_events.58.a: "Pacifiquement ou non, [AST.GetLeLaLNP] [AST.GetName] poursuivr[AST.GetAOntNP] [AST.GetSonLeurNP] expansion"
 #AST_diplomatic_events.59 was removed
 #AST_diplomatic_events.60 was removed
 #AST_diplomatic_events.61 was removed
 AST_diplomatic_events.62.t: "Un pacte anti-britannique ?"
 AST_diplomatic_events.62.desc: "Des diplomates [AST.GetAdjMP] nous ont proposé la mise en place d'un pacte anti-britannique. Cela impliquerait qu'ils nous aident à reprendre l'Irlande du Nord aux Anglais, sans que nous ayons à intervenir directement.\nEn échange, s'ils réussissent, nous rallierions leur faction afin de leur prêter main-forte en cas de guerre contre la Grande-Bretagne, si celle-ci venait à éclater.\nSi l'idée d'une unification avec le nord est tentante, nous devons bien évaluer si nous sommes réellement en position de nous mettre à dos un voisin plus puissant, et plus important encore, si nous sommes en mesure de sortir victorieux d'un tel conflit, de peur que l'Irlande ne redevienne une simple colonie britannique."
 AST_diplomatic_events.62.a: "L'unification ne peut pas attendre ! Signez le pacte !"
 AST_diplomatic_events.62.b: "C'est trop dangereux"
 AST_diplomatic_events.63.t: "L'Irlande refuse !"
 AST_diplomatic_events.63.desc: "L'Irlande a refusé de signer le pacte anti-britannique."
 AST_diplomatic_events.63.a: "Que l'Irlande reste divisée, dans ce cas"
 AST_diplomatic_events.64.t: "L'Irlande accepte !"
 AST_diplomatic_events.64.desc: "L'Irlande a accepté de signer le pacte anti-britannique."
 AST_diplomatic_events.64.a: "En route pour Belfast !"
 AST_diplomatic_events.65.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] apport[FROM.GetEEntNP] [FROM.GetSonLeurNP] soutien" ### Support for the Chinese Communists - Sends event from AST to PRC offering support
 AST_diplomatic_events.65.desc: "[FROM.GetAuEnANPCap] [FROM.GetName], l'influence grandissante du parti [FROM.GetCommunistParty] commence à porter ses fruits : ses représentants ont traversé la Chine pour nous informer qu'une force volontaire [FROM.GetAdjFS] se mobilise pour soutenir nos troupes et leur fournir des équipements."
 AST_diplomatic_events.65.a: "C'est un début de coopération prometteur avec nos camarades [FROM.GetAdjMP]"
 #AST_diplomatic_events.65.b: "They should focus on their own revolution"
 AST_diplomatic_events.66.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] nous remerci[FROM.GetEEntNP]\npour notre soutien" ### Support for the Chinese Communists - They accept
 AST_diplomatic_events.66.desc: "Les représentants de [FROM.GetLeader] nous transmettent ses remerciements pour notre soutien et nos équipements militaires. Ayant longuement traversé une guerre civile, [FROM.GetLeLaLNP] [FROM.GetName] ser[FROM.GetAOntNP] en mesure de mettre ces ressources à profit de manière efficace."
 AST_diplomatic_events.66.a: "C'est une première étape importante"
 AST_diplomatic_events.67.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] nous remerci[FROM.GetEEntNP]\npour notre soutien" ### Support for the Chinese Communists - They accept
 AST_diplomatic_events.67.desc: "Les représentants de [FROM.GetLeader] nous transmettent ses remerciements pour notre soutien et nos équipements militaires. Ayant longuement traversé une guerre civile, [FROM.GetLeLaLNP] [FROM.GetName] ser[FROM.GetAOntNP] en mesure de mettre ces ressources à profit de manière efficace."
 AST_diplomatic_events.67.a: "C'est une première étape importante"
 AST_diplomatic_events.68.t: "Exigences australiennes"
 AST_diplomatic_events.68.desc: "L'Australie ne tient pas à affronter seule la puissance redoutable qu'est [JAP.GetLeLaLNP] [JAP.GetName]. C'est pourquoi ils nous demandent d'intervenir pour mettre fin au conflit le plus vite possible."
 AST_diplomatic_events.68.a: "On dirait que les rôles sont inversés"
 AST_diplomatic_events.69.t: "Resserrement des liens"
 AST_diplomatic_events.69.desc: "Si le lien entre [ENG.GetLeLaLNP] [ENG.GetName] et [AST.GetLeLaLNP] [AST.GetName] est mis à l'épreuve, [AST.GetLeLaLNP] [AST.GetName] s'engag[AST.GetEEntNP] toutefois à le resserrer du mieux possible, grâce à [AST.GetSesLeursNP] relations et [AST.GetSesLeursNP] alliés au sein du gouvernement britannique, à tel point que ses dirigeants ne peuvent tout simplement rien [AST.GetLuiLeurNP] refuser. Les nations rejoindront à nouveau la même faction, et une fois encore, les Îles et l'Australie pourront travailler main dans la main."
 AST_diplomatic_events.69.a: "Qu'il en soit ainsi"
 AST_diplomatic_events.71.t: "[AST.GetLeLaLNPCap] [AST.GetName] demand[AST.GetEEntNP] les îles du Pacifique"
 AST_diplomatic_events.71.desc: "[AST.GetLeLaLNPCap] [AST.GetName] [AST.GetAOntNP] demandé le contrôle des îles du Pacifique, considérant que notre nation n'a aucun droit d'administrer ces territoires. Ces îles semblent insignifiantes, mais elles pourraient jouer un rôle capital à l'avenir. Néanmoins, rejeter la requête d'une puissance fasciste émergente pourrait nous attirer ses foudres."
 AST_diplomatic_events.71.a: "Acceptons leur demande"
 AST_diplomatic_events.71.b: "Nous gardons ces îles !"
 AST_diplomatic_events.72.t: "Transfert des îles [USA.GetAdjFP] du Pacifique"
 AST_diplomatic_events.72.desc: "Les [USA.GetHabitants] sont déjà sur tous les fronts ; celui du Pacifique s'est avéré être celui de trop, puisqu'ils nous cèdent sans discuter le contrôle de leurs territoires dans la région."
 AST_diplomatic_events.72.a: "Formidable !"
 AST_diplomatic_events.73.t: "Les [USA.GetHabitants] refusent de céder les îles"
 AST_diplomatic_events.73.desc: "Les [USA.GetHabitants] ne démordent pas et s'accrochent aux îles du Pacifique, et ce malgré notre influence immuable dans la région et notre demande formelle de transfert. Washington s'obstine une fois de plus."
 AST_diplomatic_events.73.a: "Nous aurons ces îles en temps voulu..."
 AST_diplomatic_events.74.t: "[AST.GetLeLaLNPCap] [AST.GetName] demand[AST.GetEEntNP] [PHI.GetLeLaLNP] [PHI.GetName]"
 AST_diplomatic_events.74.desc: "Déterminés à étendre leur territoire, les [AST.GetHabitants] ont exigé le contrôle [PHI.GetDuDelaDelNP] [PHI.GetName]. Selon eux, il est intolérable que notre nation puisse détenir un seul centimètre carré de terre sous leur sphère d'influence. Une menace de guerre a même été avancée en cas de refus."
 AST_diplomatic_events.74.a: "Évitons une guerre : acceptons"
 AST_diplomatic_events.74.b: "Ce territoire est à nous !"
 AST_diplomatic_events.75.t: "Transfert [PHI.GetDuDelaDelNP] [PHI.GetName]"
 AST_diplomatic_events.75.desc: "De toute évidence, l'avènement de la puissance fasciste [AST.GetAdjFS] a ses avantages : les nations commencent à nous craindre ! Pour preuve, les [USA.GetHabitants] ont accepté de nous céder [PHI.GetLeLaLNP] [PHI.GetName]."
 AST_diplomatic_events.75.a: "C'est le début d'un nouvel ordre !"
 AST_diplomatic_events.76.t: "Les [USA.GetHabitants] refusent"
 AST_diplomatic_events.76.desc: "Les [USA.GetHabitants] n'en démordent pas et s'accrochent [PHI.GetAuAlaAlNP] [PHI.GetName], malgré notre influence immuable dans la région et notre demande formelle de transfert. Washington s'obstine une fois de plus."
 AST_diplomatic_events.76.a: "C'est la guerre !"
 AST_diplomatic_events.78.t: "Les [AST.GetHabitants] demandent des garanties"
 AST_diplomatic_events.78.desc: "Les [AST.GetHabitants] sont dans la même situation que nous.\n\nLa menace [USA.GetAdjFS] plane au-dessus de nos têtes, s'apprêtant à intervenir à la moindre incartade de notre part. Le poids d'une telle puissance mondiale sur les épaules [JAP.GetDuDelaDelNP] [JAP.GetName] et [AST.GetDuDelaDelNP] [AST.GetName] divise les nations d'Asie de l'Est et empêche la formation d'une identité régionale. C'est pourquoi ils sont prêts à partir en guerre.\n\nLe Premier ministre [AST.GetLeader] a été très clair : sa nation compte attaquer de front [USA.GetLeLaLNP] [USA.GetName], mais pas sans notre aide."
 AST_diplomatic_events.78.a: "Nous les soutiendrons"
 AST_diplomatic_events.78.b: "Nous avons d'autres priorités"
 AST_diplomatic_events.79.t: "Les [JAP.GetHabitants] soutiennent [AST.GetLeLaLNP] [AST.GetName]"
 AST_diplomatic_events.79.desc: "Tout le monde s'accorde à dire que l'ingérence [USA.GetAdjFS] en Asie et Océanie est devenue absolument intolérable. Les [JAP.GetHabitants] ont par ailleurs accepté de soutenir notre nation dans notre campagne contre la tyrannie de cette grande puissance. Si jamais notre ennemi s'avère insurmontable, nous aurons donc un allié de choix pour nous venir en aide."
 AST_diplomatic_events.79.a: "À la guerre !"
 AST_diplomatic_events.80.t: "[JAP.GetLeLaLNPCap] [JAP.GetName] refus[JAP.GetEEntNP] de nous soutenir"
 AST_diplomatic_events.80.desc: "L'ingérence [USA.GetAdjFS] en Asie et Océanie est devenue absolument intolérable, mais nous sommes visiblement les seuls de cet avis : les [JAP.GetHabitants] refusent de nous soutenir dans notre campagne d'opposition. Nous devrons affronter nos ennemis sans leur aide."
 AST_diplomatic_events.80.a: "Ainsi soit-il"
 AST_diplomatic_events.81.t: "Un gage d'unité"
 AST_diplomatic_events.81.desc: "L'immense intérêt qu'exprime le Premier ministre britannique pour le règne animal n'est un secret pour personne. Il possède d'ailleurs une collection impressionnante de spécimens en tout genre. Pourquoi ne pas lui offrir un nouvel animal, exotique cette fois ?\n\n[ENG.GetLeader] a déjà mentionné sa curiosité pour l'ornithorynque australien. Son exportation est actuellement interdite, car le transport pourrait lui être fatal, mais nous pourrions faire une exception.\n\nAllons-nous offrir un ornithorynque au Premier ministre, en gage d'unité ?"
 AST_diplomatic_events.81.a: "Offrons-lui l'animal"
 AST_diplomatic_events.81.b: "Non, l'interdiction existe pour une bonne raison"
 AST_diplomatic_events.82.t: "Triste nouvelle pour [ENG.GetLeader]"
 AST_diplomatic_events.82.desc: "L'ornithorynque parti du port de Melbourne il y a six semaines vient d'arriver à destination. Malheureusement, les réjouissances ont été de courte durée, puisque les [ENG.GetHabitants] ont appris que l'animal n'avait pas survécu au voyage. [ENG.GetLeader] est déchiré par cette nouvelle : il lui avait déjà trouvé un nom (le sien) en attendant son arrivée. Il dénonce l'ennemi comme responsable de sa disparition, puisque les détonations d'une attaque de sous-marin auraient effrayé l'ornithorynque qui serait mort de peur.\n\nLe journal de bord du navire indique cependant une autre cause plus plausible : la température de l'eau et de l'air du vivarium où séjournait la créature était bien trop élevée.\n\nQuoi qu'il en soit, [ENG.GetLeader] l'ornithorynque est mort, et le Premier ministre britannique reste le cœur vide."
 AST_diplomatic_events.82.a: "C'est une bien triste nouvelle"
 AST_political_events.1.t: "Organiser un référendum"
 AST_political_events.1.desc: "Notre gouvernement cherche à développer le contrôle fédéral dans deux domaines respectifs : l'aviation et le commerce.\n\nEn ce qui concerne l'aviation, nous souhaitons amender la Constitution afin de conférer au Parlement le pouvoir de légiférer sur les questions de navigation aérienne et les appareils qui les empruntent.\n\nPour ce qui est du commerce, l'amendement vise à autoriser la coopération entre le Commonwealth et les États au sein de la sphère commerciale, ce qui est actuellement anticonstitutionnel.\n\nPour quelle réforme allons-nous organiser un référendum ?"
 AST_political_events.1.a: "L'aviation, pour réguler la navigation aérienne au dessus de [AST.GetLeLaLNP] [AST.GetName]"
 AST_political_events.1.a.tt: "Une fois la réforme adoptée :\n Ajoute §YRéforme de l'aviation adoptée§!, qui octroie :\n Vitesse de recherche aérienne : §G+15%§!\n Vitesse de construction des §Ybases aériennes§! : §G+5%§!"
 AST_political_events.1.b: "Le commerce, pour coordonner les programmes de commercialisation agricole à l'échelle nationale"
 AST_political_events.1.b.tt: "Une fois la réforme adoptée :\n Ajoute §YRéforme du commerce adoptée§!, qui octroie :\n Facteur d'usines de biens de consommation : §Y-10%§!"
 AST_political_events.2.t: "Succès du référendum"
 AST_political_events.2.desc.a: "La population a accepté la mise en œuvre de notre réforme de l'aviation. Puisque l'aviation n'existait pas encore à l'époque où la Constitution de l'Australie a été écrite, il est tout à fait normal que le gouvernement se charge de la réglementation et de la navigation aérienne. Pour des raisons de sécurité et d'efficacité, une législation nationale uniforme relative à l'aviation sera mise en place."
 AST_political_events.2.desc.b: "La population a accepté la mise en œuvre de notre réforme de la commercialisation. Grâce à son pouvoir lui permettant de réglementer les produits agricoles et leur commercialisation, le gouvernement sera désormais en mesure de stabiliser les marchés et d'améliorer la coopération entre les États. Les revenus des agriculteurs seront plus stables, tout comme l'économie du pays."
 AST_political_events.2.a: "Élargissons le contrôle fédéral !"
 AST_political_events.4.t: "Disparition du Premier ministre"
 AST_political_events.4.desc: "Toute la pression des questions de la guerre a finalement eu raison du pauvre cœur de notre Premier ministre qui a succombé à un infarctus.\n\nSa sagesse va nous manquer, surtout au vu de la situation mondiale actuelle, néanmoins, le pays doit continuer d'avancer sous l'autorité d'un nouveau dirigeant : [AST.GetLeader]."
 AST_political_events.4.a: "C'est un deuil national"
 AST_political_events.5.t: "Inquiétudes au gouvernement australien"
 AST_political_events.5.desc: "Un groupe de dissidents politiques vient de se faire connaître : le mouvement Australia First. Le gouvernement, craignant qu'il dissimule des intentions antidémocratiques, a fait placer le mouvement tout entier, ainsi que ses membres, sous surveillance. L'ingérence des démocrates réduira notre capacité à nous organiser, et freinera le recrutement de nouveaux membres."
 AST_political_events.5.a: "Surveillons-les de près..."
 AST_political_events.6.t: "Le sesquicentenaire de 1938"
 AST_political_events.6.desc: "Plus tôt dans la journée, tandis que se déroulait la cérémonie pour le sesquicentenaire de 1938 et que le défilé pour la nation australienne traversait les rues de Sydney, une manifestation était organisée à l'Australian Hall.\n\nDes associations et des militants en faveur des droits des Aborigènes étaient rassemblés pour rappeler à tous que ce 150e anniversaire marquait non seulement le début de la colonisation britannique, mais aussi la discrimination constitutionnelle des peuples aborigènes. Les militants exigeaient de nouvelles lois sur l'éducation et les soins des peuples autochtones, ainsi qu'une nouvelle politique permettant aux indigènes d'être élevés au rang de citoyens à part entière."
 AST_political_events.6.a: "Nous devons prendre des mesures"
 AST_political_events.7.t: "Pression impériale"
 AST_political_events.7.desc: "Suite aux récents événements, la vie politique en Australie vit de toute évidence de grands bouleversements. [ENG.GetLeLaLNPCap] [ENG.GetName] [ENG.GetAOntNP] pris des mesures diplomatiques pour s'assurer que [AST.GetLeLaLNP] [AST.GetName] rest[AST.GetEEntNP] sur une voie adaptée à [AST.GetSaLeurNP] position de nation membre du Commonwealth, dans l'espoir que cette incitation pacifique suffise à garantir la loyauté de son dominion."
 AST_political_events.7.a: "Malgré les tentatives de la Grande-Bretagne, [AST.GetLeLaLNP] [AST.GetName] décider[AST.GetAOntNP] de [AST.GetSonLeurNP] destin"
 AST_political_events.8.t: "La guerre approche"
 AST_political_events.8.desc: "$AST_war_is_coming_cat_desc$"
 AST_political_events.8.a: "Nous devons nous tenir prêts"
 AST_political_events.9.t: "Le conflit du Dalfram"
 AST_political_events.9.desc: "Ce qui a commencé par une querelle autour du chargement de la fonte brute a provoqué une déflagration bien plus vaste. Les ouvriers de toute l'Australie se sont mis en grève par solidarité, défiant à la fois le gouvernement et l'industrie. Alors que les tensions sont croissantes, la crise s'aggrave et menace d'entraîner la démission des dirigeants. N'ayant pas réussi à contrôler la situation, le gouvernement n'a pas d'autre choix que de laisser le [AST.GetCommunistParty] au pouvoir."
 AST_political_events.9.a: "Et nous n'allons pas nous faire prier"
 AST_canberra_air_disaster_events.1.t: "Le crash de Canberra"
 AST_canberra_air_disaster_events.1.desc: "Ce matin, un avion Lockheed Hudson s'est écrasé aux abords de Canberra. À son bord, dix personnes ont perdu la vie, y compris le chef de l'armée de terre et son personnel, en route pour une réunion du cabinet.\n\nDifficile pour l'heure de savoir ce qui a provoqué l'accident : la météo était idéale et le pilote de l'appareil n'était autre que le lieutenant Robert Hitchcock, un officier décoré de la RAAF.\n\nQuoi qu'il en soit, c'est un bien triste jour pour la nation tout entière, sans parler des familles et des proches des victimes. L'Australie se tourne désormais vers ses dirigeants. Quelle sera leur réaction ?"
 AST_canberra_air_disaster_events.1.a: "C'est une véritable tragédie"
 AST_canberra_air_disaster_events.1.a.tt: "Donne accès aux décisions de §YConfiance du cabinet§!, ainsi qu'à la §Ymission§! permettant de préserver ou supprimer le gouvernement en place"
 AST_canberra_air_disaster_events.2.t: "Le parti [AST.GetRulingParty] tient bon"
 AST_canberra_air_disaster_events.2.desc: "Le gouvernement en place est parvenu à traverser avec brio la crise nationale engendrée par le crash de Canberra. Le parti [AST.GetRulingParty], à l'instar d'un phare dans la nuit, a fait preuve de force et de stabilité, ce qui n'a pas manqué de susciter l'admiration de la nation."
 AST_canberra_air_disaster_events.2.a: "Un avenir radieux nous attend"
 AST_canberra_air_disaster_events.3.t: "Motion de censure"
 AST_canberra_air_disaster_events.3.desc: "La motion de censure ayant été votée, le gouvernement en place va devoir être remplacé, que ça lui plaise ou non. L'Australie est prête à laisser cette période d'instabilité politique derrière elle pour repartir de zéro."
 AST_canberra_air_disaster_events.3.a: "Vite, un changement de parti !"
 AST_canberra_air_disaster_events.4.t: "Changement de dirigeant"
 AST_canberra_air_disaster_events.4.desc: "Au lendemain d'une période politique instable, c'est le parti [AST.GetRulingParty] qui prend les rênes du pouvoir. Le Premier ministre a également été appelé à quitter ses fonctions pour laisser la place à son successeur."
 AST_canberra_air_disaster_events.4.a: "Pour des lendemains chantants"
 AST_canberra_air_disaster_events.5.t: "Accusations [AST.GetAdjFP]"
 AST_canberra_air_disaster_events.5.desc: "Lors d'une conférence de presse, le gouvernement [AST.GetAdjMS] a accusé notre nation d'être responsable du crash aérien survenu sur leur territoire ayant entraîné la mort de plusieurs membres politiques.\n\nCes accusations sont bien évidemment fausses, ce qui ne fait qu'accroître l'impertinence de cette attaque."
 AST_canberra_air_disaster_events.5.a: "Ne répondons pas, ça n'en vaut pas la peine"
 AST_canberra_air_disaster_events.5.b: "Nous n'en resterons pas là !"
 AST_canberra_air_disaster_events.6.t: "[JAP.GetLeLaLNPCap] [JAP.GetName] ripost[JAP.GetEEntNP]"
 AST_canberra_air_disaster_events.6.desc: "Les [JAP.GetHabitants] n'ont pas apprécié les accusations que nous avons proférées à leur encontre, allant jusqu'à les considérer comme une agression physique. En réponse à cela, [JAP.GetLeader] a proclamé que l'invasion de nos terres était un juste châtiment."
 AST_canberra_air_disaster_events.6.a: "N'aggravons pas la situation davantage"
 AST_canberra_air_disaster_events.6.b: "Nous ne pouvons pas rester les bras croisés"
 INS_limited_war_events.1.t: "Écrasez la Malaisie !"
 INS_limited_war_events.1.desc: "Les lignes ennemies ont cédé, et nos hommes avancent sans rencontrer aucune résistance. De l'autre côté du détroit, l'État client britannique plie sous le poids de la colère populaire. Les États fantoches de Londres pensaient que leurs baïonnettes les protégeraient de l'histoire. Ils avaient tort."
 INS_limited_war_events.1.a: "Merdeka !"
 INS_limited_war_events.1.b: "C'est une belle journée pour la République"
 INS_limited_war_events.2.t: "Riposte [FROM.GetAdjFS]"
 INS_limited_war_events.2.desc: "Ce qui devait être une frappe décisive contre le régime fantoche a échoué. Les forces [FROM.GetAdjFP], soutenues par leurs commanditaires impériaux, ont repoussé nos hommes hors du territoire contesté qu'elles occupent désormais. Chaque jour, la radio diffuse leurs fanfaronnades. Si nous continuons, nous risquons de nouvelles humiliations ; mais si nous nous replions, nous reconnaissons notre défaite devant tout l'archipel."
 INS_limited_war_events.2.a: "Replions-nous et sauvons ce que nous pouvons encore sauver"
 INS_limited_war_events.2.b: "Nous ne céderons rien au régime fantoche"
 INS_limited_war_events.3.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] s'inclin[FROM.GetEEntNP] devant la République"
 INS_limited_war_events.3.desc: "Nous avons eu des nouvelles de Kuala Lumpur. Le gouvernement fantoche, abandonné au pire moment par ses maîtres londoniens, a préféré accepter nos conditions plutôt que de voir ses villes réduites en cendres. Les territoires contestés nous appartiennent. Les autres États clients de la région retiendront la leçon."
 INS_limited_war_events.3.a: "L'Indonésie gagne en puissance"
 INS_limited_war_events.4.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] rejett[FROM.GetEEntNP] nos conditions"
 INS_limited_war_events.4.desc: "[FROM.GetLeLaLNPCap] [FROM.GetName] [FROM.GetAOntNP] rejeté notre offre. Les ministres fantoches, lisant un texte en provenance de Whitehall, déclarent qu'aucun mètre carré de terre ne sera cédé et que la République devra se mettre à genoux avant que les canons ne cessent."
 INS_limited_war_events.4.a: "Laissons les canons parler"
 INS_limited_war_events.5.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] appell[FROM.GetEEntNP] à notre destruction"
 INS_limited_war_events.5.desc: "[FROM.GetLeLaLNPCap] [FROM.GetName] [FROM.GetAOntNP] rejeté toute idée de guerre modérée en criant sur tous les toits qu'il fallait démembrer la république et répartir ses îles entre les anciens maîtres coloniaux. Il n'y aura pas d'issue pacifique à cette crise. Soit l'Indonésie s'en sortira, soit elle disparaîtra."
 INS_limited_war_events.5.a: "Nous survivrons ou nous échouerons ensemble"
 INS_limited_war_events.6.t: "La progression [FROM.GetAdjFS] ralentit"
 INS_limited_war_events.6.desc: "L'espace d'un instant, nous avons craint le pire quand la poussée [FROM.GetDuDelaDelNP] [FROM.GetName] nous a pris par surprise. Mais c'était avant que leur progression ne ralentisse, que leurs hommes ne fatiguent et que les fanfaronnades de Londres ne diminuent à chaque communiqué. Mais la République peut encore être magnanime et offrir aux fantoches un moyen de se tirer de cette affaire, même si beaucoup diraient qu'une victoire totale servirait mieux la cause qu'une victoire modérée."
 INS_limited_war_events.6.a: "Proposez-leur nos conditions"
 INS_limited_war_events.6.b: "Pas de pitié pour les fantoches"
 INS_limited_war_events.7.t: "Une offensive à l'arrêt"
 INS_limited_war_events.7.desc: "Notre avancée a été freinée, et le pire dans tout ça, c'est que l'ennemi est au courant. Une exigence nous est parvenue depuis l'autre côté du détroit : déposer les armes et accepter leurs conditions, ou regarder la liste des victimes s'allonger pour en arriver au même résultat. Le seul choix que nous ayons, c'est l'ampleur de nos funérailles."
 INS_limited_war_events.7.a: "Mieux vaut une paix fragile qu'une guerre sans fin"
 INS_limited_war_events.7.b: "La République ne capitulera pas"
 INS_limited_war_events.8.t: "[From.GetLeLaLNPCap] [From.GetName]\nrefus[From.GetEEntNP] de céder"
 INS_limited_war_events.8.desc: "[FROM.GetLeLaLNPCap] [FROM.GetName] [FROM.GetAOntNP] répondu à notre offre par la provocation. [FROM.GetSesLeursNPCap] ministres affirment qu'ils préféreraient voir tous les kampongs de Penang à Johor réduits en cendres plutôt que d'accorder la moindre concession à la République. La guerre continue."
 INS_limited_war_events.8.a: "Qu'il en soit ainsi"
 INS_limited_war_events.9.t: "[FROM.GetLeLaLNPCap] [FROM.GetName] veu[FROM.GetTLentNP] détruire la République !"
 INS_limited_war_events.9.desc: "Les messages radio ennemis que nous avons interceptés ont confirmé nos craintes. Il n'y aura ni compromis ni paix relative ni retour aux positions que nous occupions. Les fantoches et leurs maîtres londoniens exigent la reddition totale de la République, que l'Indonésie soit mise au pilori et que ses îles soient remises au joug impérialiste auquel nous les avons arrachées. Il ne peut y avoir qu'une seule réponse à cela."
 INS_limited_war_events.9.a: "L'Indonésie tient bon !"
 ### AST - Union Control Events ###
 AST_union_control_events.1.t: "Des agents étrangers dans nos syndicats"
 AST_union_control_events.1.desc: "Les services de renseignement ont attiré l'attention du gouvernement sur un rapport déroutant. Des agents communistes australiens ont pris contact avec des dirigeants syndicaux sur place, distribué des tracts radicaux et encouragé les travailleurs à s'organiser sur la base de principes révolutionnaires. Le mouvement n'en est encore qu'à ses balbutiements, mais selon les services de sécurité, c'est précisément de cette façon que les insurrections commencent. Il faut prendre une décision, et vite."
 AST_union_control_events.1.a: "Gardez un œil sur eux"
 AST_union_control_events.4.t: "Des infiltrés communistes s'emparent du territoire [MAL.GetAdjMS]"
 AST_union_control_events.4.desc: "Un rapport alarmant a été remis au gouvernement, selon lequel l'un de nos États aurait été capturé au cours d'une opération coordonnée, avant d'être rattaché au gouvernement révolutionnaire. La vitesse et l'organisation de l'assaut ont soulevé des questions délicates : nos services de renseignement doutent que les insurgés aient agi seuls, et pensent que des étrangers les auraient conduits jusqu'à nos côtes. Ceux qui ont échappé à cette prise de pouvoir ne se sont pas rendus. Ils se sont regroupés et ont repris les armes, déterminés à récupérer ce qui leur appartient."
 AST_union_control_events.4.a: "Découvrez qui se cache derrière cela. Ces insurgés ne tiendront pas longtemps !"
 AST_union_control_events.4.a.tt: "Des milices anticommunistes se sont rassemblées pour résister à l'occupation communiste."
 AST_union_control_events.5.t: "Le désastre [MAL.GetAdjMS]"
 AST_union_control_events.5.desc: "L'opération a tourné à la catastrophe. Nos troupes n'ont jamais atteint le rivage. Elles ont été repoussées par des patrouilles loyalistes, ont disparu dans le détroit, ou ont été capturées avant même de pouvoir se positionner. Les détails restent troubles, mais l'issue est claire. Pire encore, la presse a eu vent de toute cette histoire. Au Parlement, la question est de savoir ce que faisaient nos troupes dans ces eaux. La population en reste aussi stupéfaite qu'indignée. Quels que soient les bénéfices que nous voulions en tirer pour la révolution, nous devrons trouver un autre moyen de les obtenir."
 AST_union_control_events.5.a: "C'est un terrible revers. Nous devons envisager d'autres possibilités pour soutenir nos camarades."
 AST_union_control_events.3.t: "La révolution éclate [MAL.GetAuEnANP] [MAL.GetNonIdeologyName]"
 AST_union_control_events.3.desc: "Les travailleurs [MAL.GetDuDelaDelNP] [MAL.GetNonIdeologyName] se sont soulevés. Les cellules communistes que nous avons développées tout au long de notre campagne ont pris les armes dans tout le pays, mais la situation sur le terrain est déroutante. Les forces révolutionnaires se sont concentrées dans les mauvaises zones, séparées du cœur de la péninsule par l'eau et la jungle. Sans un point d'ancrage sur le continent, la révolution risque de s'essouffler avant même de se propager. L'Australie doit agir discrètement et rapidement pour envoyer des hommes sur la péninsule et donner à la révolution les moyens de la faire survivre."
 AST_union_control_events.3.a: "Nous ne laisserons pas la révolution mourir sur la plage. Établissez un point d'ancrage"
 AST_union_control_events.2.t: "Des agitateurs soutenus par les [AST.GetHabitants] dans nos rues"
 AST_union_control_events.2.desc: "Des agents du gouvernement communiste australien sont arrivés dans nos villes. Ils ne se cachent pas, distribuent des tracts aux portes des usines, s'expriment sur les places publiques, et établissent des réseaux de solidarité entre militants australiens et groupes radicaux locaux. Les réseaux existants d'influence étrangère semblent avoir retrouvé un second souffle. Il s'agit d'une campagne coordonnée, et le gouvernement doit décider de la manière d'y répondre avant que la grogne populaire ne devienne hors de contrôle."
 AST_union_control_events.2.b: "Tout cela est parfaitement inquiétant..."
 ###########################
 ##### ABDACOM EVENTS ######
 ###########################
 ABDA_events.1.t: "Invitation à un nouveau commandement suprême"
 ABDA_events.1.desc: "Les [FROM.GetHabitants] nous invitent à rejoindre le commandement suprême qu'ils ont établi sur le théâtre du Pacifique. L'initiative, intitulée ABDACOM, a pour but de mutualiser les forces navales, aériennes et terrestres des nations alliées de la région sous une structure unique. Rejoindre ce commandement nous offrirait une meilleure coordination avec [FROM.GetLeLaLNP] [FROM.GetName] et les autres participants. Allons-nous accepter ?"
 ABDA_events.1.a: "Unissons-nous !"
 ABDA_events.1.b: "Nous ne pouvons pas nous engager"
 ABDA_events.2.t: "Les [FROM.GetHabitants] rejoignent l'ABDACOM"
 ABDA_events.2.desc: "L'ABDACOM compte désormais un nouveau membre : [FROM.GetLeLaLNP] [FROM.GetName]. Les forces de cette nation rejoignent le commandement suprême, ce qui ne manquera pas de renforcer notre position dans le Pacifique."
 ABDA_events.2.a: "Bienvenue !"
 ABDA_events.3.t: "Les [FROM.GetHabitants] rejettent l'invitation à l'ABDACOM"
 ABDA_events.3.desc: "L'ABDACOM devra composer sans [FROM.GetLeLaLNP] [FROM.GetName] et se passer des forces de cette nation. Néanmoins, l'invitation reste toujours valable."
 ABDA_events.3.a: "Quel dommage !"
 ABDA_events.5.t: "Invitation à l'ABDACOM"
 ABDA_events.5.desc: "Les [FROM.GetHabitants] nous invitent à rejoindre l'ABDACOM, un commandement suprême unique rassemblant toutes les forces alliées. Il a pour but de coordonner les forces navales, aériennes et terrestres de différentes nations afin de résister plus efficacement à l'envahisseur. En joignant cette structure inédite, nous cèderons le contrôle de nos forces, en échange de renseignements de premier choix, d'une doctrine universelle et un soutien inébranlable des Alliés. Qu'allons-nous répondre ?"
 ABDA_events.5.a: "Unissons-nous !"
 ABDA_events.5.b: "Nous ne pouvons pas nous engager"
 ABDA_events.4.t: "Les défenses de Singapour"
 ABDA_events.4.desc: "Singapour est la clé de voûte du système de défense de l'ABDACOM, aussi il serait judicieux d'investir dans ses fortifications. Nous pouvons privilégier les défenses portuaires pour contrer l'approche navale, renforcer les lignes côtières pour éviter un assaut terrestre, ou bien investir simultanément dans ces deux stratégies. Quoi que nous fassions, notre décision influencera l'issue du prochain assaut ennemi."
 ABDA_events.4.a: "Renforçons les ports. C'est là que réside la force de Singapour."
 ABDA_events.4.b: "Fortifions le périmètre côté terre. C'est là que la menace plane."
 ABDA_events.4.c: "Développons les deux stratégies. Ne rien laisser sans défense."
 ABDA_fortress_singapore_choice_tt: "L'achèvement de cette priorité va permettre de choisir les défenses de Singapour."
 ABDA_faction_membership_requirement_tt: "Les membres de faction éligibles vont être invités"
