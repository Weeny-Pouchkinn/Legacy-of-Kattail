 #Dynamic Modifiers National Spritits
 CZE_ceskoslovenska_armada_dynamic_modifier: "Československá armáda"
 CZE_ceskoslovenska_armada_dynamic_modifier_desc: "L'armée tchécoslovaque a été bâtie sur les cendres de l'Empire austro-hongrois et des vétérans des Légions tchécoslovaques. Elle s'inspire aujourd'hui encore des codes de conduite des deux entités."
 CZE_ceskoslovenske_letectvo_dynamic_modifier: "Československé letectvo"
 CZE_ceskoslovenske_letectvo_dynamic_modifier_desc: "Les avions ne sont pas toujours prêts, mais nos pilotes, eux, le sont. Les menaces jaillissent de toute part, et nous devons faire des cieux notre champ d'excellence. Chaque pilote doit en valoir trois."
 CZE_a_divided_nation_dynamic_modifier: "Nation désunie"
 CZE_a_divided_nation_dynamic_modifier_desc: "La nation [CZE.GetAdjFS] subsiste comme le dernier État pluraliste d'Europe centrale, protégeant tous ces citoyens des menaces extérieures. Malheureusement, la Grande Dépression a rebattu les cartes ; la crise économique a éveillé un ressentiment chez plusieurs partis envers le gouvernement, formant ainsi une cassure au sein du pays."
 CZE_skoda_works_dynamic_modifier: "Les usines Škoda"
 CZE_skoda_works_dynamic_modifier_desc: "La société Škoda traite dans la production, la construction et l'investissement de tous les secteurs de l'industrie lourde. Elle est toute puissante au sein de notre territoire."
 CZE_ceskoslovenske_alecne_lodstvo_dynamic_modifier: "Československé válečné loďstvo"
 #Dynamic State Modifiers
 CZE_sudetenland_german_state_modifier: "Séparatisme des Sudètes"
 CZE_sudetenland_german_state_modifier_desc: "La crise économique a décimé le secteur industriel des Sudètes. Les populations touchées par ce drame ont accusé le gouvernement [ROOT.GetAdjMS] d'être à l'origine de leur malheur."
 CZE_tesinko_polish_state_modifier: "Séparatisme polonais"
 CZE_czech_state_modifier: "Pénurie d'ouvriers qualifiés"
 CZE_czech_state_modifier_desc: "Le XXe siècle a apporté un développement économique éclair qui a impacté une population majoritairement agraire. Il est difficile aujourd'hui de trouver des ouvriers tchèques qualifiés. Nous devons mettre en place tout un programme pour faciliter l'accès à l'éducation aux jeunes d'aujourd'hui, afin qu'ils deviennent les ouvriers de demain."
 CZE_slovakia_state_modifier: "Développement économique disparate"
 CZE_hungarian_state_modifier: "Séparatisme hongrois"
 CZE_ukrainian_state_modifier: "Développement économique disparate"
