 CZE_first_sudetenland_fortification_program: "Premier programme de fortification des Sudètes"
 CZE_first_sudetenland_fortification_program_GD: "Premier programme de fortification des Sudètes"
 CZE_sudetenland_paramilitaries_modifier: "Activité paramilitaire des Sudètes"
 CZE_sudetenland_paramilitaries_modifier_desc: "Les partisans et paramilitaires des Sudètes sapent l'autorité de nos troupes dans cette région. Ils multiplient les embuscades et pactisent avec nos ennemis."
 CZE_nationalist_protests: "Manifestations nationalistes"
 CZE_rut_comprise_agreement_modifier: "Accord d'autonomie d'Ukraine subcarpatique" #Can't use [RUT.Getname] in the context this is used in
 CZE_improve_cross_border_rail_connections_modifier: "Correspondances ferroviaires internationales en rénovation"
 #National Spirits
 CZE_taticek_of_czechoslovakia: "Tatíček Masaryk"
 CZE_taticek_of_czechoslovakia_desc: "Tomáš Masaryk, affectueusement surnommé « Tatíček Masaryk », signifiant le père de la nation, est la clé de voûte de la nation tchécoslovaque depuis sa fondation. À l'époque où tout le monde pensait les coalitions inconcevables et les impasses politiques insurmontables, il a su, à maintes reprises, réaliser de véritables miracles pour renforcer la politique de la Tchécoslovaquie. Même retiré du monde politique, son opinion et ses suggestions sont suivies à la lettre par la classe politique."
 CZE_industrialists_veto: "Veto des industriels"
 CZE_industrialists_veto_desc: "Les industriels détiennent une influence considérable sur la politique du pays, possédant la majorité des conglomérats nationaux. Il est difficile d'ignorer leurs opinions sur les questions économiques, et surtout la pression qu'ils exercent pour empêcher la mobilisation."
 CZE_agrarian_politics_1: "Politique agraire"
 CZE_agrarian_politics_1_desc: "Notre nation est de nature industrieuse, mais les agriculteurs possèdent tout de même une influence notable au sein de nombreux partis politiques. Leur opinion oriente la plupart du temps les mesures économiques qui seront adoptées, et donc s'opposent à toutes celles qui favorisent l'industrie."
 CZE_directorate_of_fortification_works_no_gd_idea: "La direction des travaux de fortifications"
 CZE_directorate_of_fortification_works_no_gd_idea_desc: "$CZE_directorate_of_fortification_works_no_gd_idea$, plus connue sous l'acronyme DTF, est l'entité chargée de superviser les projets de fortifications à travers le pays."
 CZE_czech_corporatism: "Corporatisme tchèque"
 CZE_broken_shield: "Bouclier brisé"
 CZE_redirected_fortification_council_funds: "Budget du Conseil des fortifications réorienté"
 CZE_army_readiness_1: "Armée non préparée"
 CZE_army_readiness_1_desc: "La préparation d'une armée ne se résume pas seulement aux soldats et au matériel que l'on possède. Il faut également organiser soigneusement les préparatifs et s'assurer du soutien des classes politique et industrielle du pays. Détenir les moyens de se battre est une chose, pouvoir se battre en est une autre."
 CZE_army_readiness_3: "Armée préparée"
 CZE_army_readiness_3_desc: "La préparation d'une armée ne se résume pas seulement aux soldats et au matériel que l'on possède. Il faut également organiser soigneusement les préparatifs et s'assurer du soutien des classes politique et industrielle du pays. Détenir les moyens de se battre est une chose, pouvoir se battre en est une autre."
 CZE_ready_for_anything_idea: "Préparés à tout"
 CZE_sudeten_german_quandary: "Le dilemme des Sudètes"
 CZE_sudeten_german_quandary_desc: "La majorité de la population des Sudètes n'aspire qu'à une chose : plus d'autonomie. Les partis politiques sont prêts à retourner leur veste si le gouvernement [GER.GetAdjMS] décide d'annexer leur territoire."
 CZE_sudeten_german_quandary_modifier_tt: "§YEffet passif§! :\nSi [AUS.GetFlag] [AUS.GetLeLaLNP] §Y[AUS.GetNonIdeologyName]§!, [GER.GetFlag] [GER.GetLeLaLNP] §Y[GER.GetNonIdeologyName]§!, ou tout autre pays [BAY.GetFlag] §Yallemand§! limitrophe à notre territoire obtient ou justifie un §Rbut de guerre§! à notre encontre et que nous contrôlons soit les §Y[69.GetName]§!, les §Y[972.GetName]§! ou les §Y[74.GetName]§! :\n -§YTous les États des Sudètes sous notre contrôle§! :\n    Ajoute §Y$CZE_sudetenland_paramilitaries_modifier$§!, qui octroie :\n       $MODIFIER_LOCAL_INTEL_TO_ENEMIES$ : §R+10%§!\n       $MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$ : §R-10%§!\n       $modifier_state_repair_speed_bunker_factor$ : §R-10%§!\n\n- Cet §Yeffet§! ne peut se produire qu'une fois"
 CZE_sudeten_challenge: "Le défi des Sudètes"
 CZE_sudeten_challenge_desc: "La communauté internationale a jugé les derniers agissements hostiles des paramilitaires des Sudètes à notre encontre comme justifiés. La convaincre du contraire s'annonce très compliqué."
 CZE_sudeten_facde: "La façade des Sudètes"
 CZE_sudeten_facde_desc: "Comme nous ne soutenons pas les paramilitaires locaux, le monde entier pense que nos justifications pour les actes commis à l'encontre [CZE.GetDuDelaDelNP] [CZE.GetName] ne sont qu'une supercherie."
