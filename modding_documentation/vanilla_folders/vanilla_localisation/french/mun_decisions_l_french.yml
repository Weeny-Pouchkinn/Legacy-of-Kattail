 CZE_form_the_european_federation: "Fonder la Fédération européenne"
 CZE_central_european_federation_desc: "Nous partageons plus de points communs que de différences avec nos voisins. Une fédération démocratique pourrait sauvegarder le pluralisme politique en Europe centrale des nombreuses menaces qui cherchent à lui nuire."
 CZE_form_the_european_federation_HUN_tt: "Les États hongrois deviennent des États nationaux"
