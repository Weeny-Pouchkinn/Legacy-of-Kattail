 CZE_sudeten_promise_mission: "La promesse des Sudètes"
 CZE_sudeten_promise_mission_desc: "En soutenant les paramilitaires des Sudètes, nous soutenons leur sécession du gouvernement [CZE.GetAdjMS] pour nous rejoindre. Revenir sur notre décision provoquerait un tollé politique."
 CZE_recall_zdenko_hudecek: "Rappeler §Y$CZE_zdenko_hudecek$§!"
 CZE_a_divided_nation_category: "Une nation divisée"
 CZE_a_divided_nation_category_desc: "La colère envers le gouvernement ne fait que monter au sein des multiples partis du pays. Elle ne peut plus être ignorée. Trouver des solutions à leurs griefs pourrait apaiser les individus qui cherchent à déchirer la nation, du moins temporairement."
 CZE_a_divided_nation_category_tt: "Sélectionne la décision §Y$CZE_a_divided_nation_bridge_the_divide_fake$§!"
 CZE_a_divided_nation_category_2_tt: "§YEffets si sélectionnée§! :\nDonne accès à la décision §Y$CZE_a_divided_nation_category$§!, qui §Yretire§! les modificateurs d'État négatifs de nos §YÉtats§! et réduit les modificateurs d'État négatifs sur l'§Yesprit national $CZE_a_divided_nation_dynamic_modifier$§! jusqu'à ce qu'il soit §Yretiré§!"
 CZE_a_divided_nation_category_3_tt: "Donne accès à la décision §Y$CZE_a_divided_nation_category$§!, qui §Yretire§! les modificateurs d'État négatifs de nos §YÉtats§! et réduit les modificateurs d'État négatifs sur l'§Yesprit national $CZE_a_divided_nation_dynamic_modifier$§! jusqu'à ce qu'il soit §Yretiré§!"
