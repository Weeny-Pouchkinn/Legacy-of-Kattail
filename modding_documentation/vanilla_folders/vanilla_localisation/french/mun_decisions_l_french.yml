 CZE_bop_car_rationing: "£BoP_right_texticon Rationnement automobile"
 CZE_embezzle_quatermaster_funds: "£BoP_left_texticon Détourner le budget des timoniers"
 CZE_embezzle_quatermaster_funds_desc: "Nos soldats n'ont pas à se plaindre. Ils ont déjà tellement d'avantages que personne ne remarquera l'absence de fonds pour leurs casernes."
 CZE_prioritize_export_contracts: "£BoP_left_texticon Favoriser les contrats à l'export"
 CZE_prioritize_export_contracts_desc: "L'industrie d'exportation a été notre planche de salut pour échapper à la Grande Dépression. Pourquoi ne pas compter sur elle aujourd'hui encore ? N'écoutons pas les sceptiques qui parlent des menaces pesant sur notre nation. L'armada pourra bien attendre quelques mois de plus."
 CZE_focus_on_export_designs: "£BoP_left_texticon Favoriser l'exportation de modèles"
 CZE_focus_on_export_designs_desc: "L'armada se montre très difficile en ce qui concerne nos modèles. Le marché de l'export est bien plus satisfait de nos productions ; de plus, il nous aide en retour à financer des modèles domestiques justement pour l'armada. En réalité, elle devrait nous remercier pour toutes les économies que nous l'aidons à réaliser en développement. De rien !"
 CZE_bop_reservist_training: "£BoP_right_texticon Entraînement pour réservistes"
 CZE_junior_officer_recruitment: "£BoP_right_texticon Campagne de recrutement de sous-officiers"
 CZE_send_foreign_attaches: "£BoP_right_texticon Envoyer des attachés étrangers"
 CZE_send_observers_to_the_italo_ethiopian_war: "£BoP_right_texticon Envoyer des observateurs en Éthiopie"
 CZE_send_observers_to_the_italo_ethiopian_war_bonus: "Envoyer des observateurs à la guerre italo-éthiopienne"
 CZE_send_observers_to_the_italo_ethiopian_war_desc: "Missionnons quelques individus pour entrer en contact avec les combattants en première ligne, afin de revoir efficacement notre doctrine militaire. Et qui sait : nous y trouverons peut-être bien d'autres opportunités ?"
 CZE_send_observers_to_the_italo_ethiopian_war_tt: "§Y$CZE_zbrojovka_brno_organization$§! va s'intéresser au trafic clandestin d'armement [ETH.GetAuEnANP] §Y[ETH.GetName]§!"
 CZE_recruit_red_cross_veterans: "£BoP_right_texticon Recruter des vétérans de la Croix-Rouge"
 CZE_warehouse_inspections: "£BoP_right_texticon Inspections d'entrepôts"
 CZE_warehouse_inspections_desc: "Le seul moyen de savoir s'il manque quelque chose, c'est d'aller vérifier."
 CZE_construction_telephone_stations: "£BoP_right_texticon Construire des stations téléphoniques"
 CZE_construction_telephone_stations_desc: "L'établissement de stations téléphoniques entre nos différents quartiers généraux permettra une meilleure coordination de l'état-major."
 CZE_state_defense_loans: "£BoP_right_texticon Prêt de défense de l'État"
 CZE_live_fire_exercise: "£BoP_right_texticon Entraînement au tir"
 CZE_live_fire_exercise_desc: "Rien ne vaut une bonne journée sur le champ de tir."
 CZE_redirect_military_discretionary_spending: "£BoP_left_texticon Réorienter les dépenses militaires discrétionnaires"
 CZE_redirect_military_discretionary_spending_desc: "Ce que nous faisons des fonds discrétionnaires reste à notre discrétion."
