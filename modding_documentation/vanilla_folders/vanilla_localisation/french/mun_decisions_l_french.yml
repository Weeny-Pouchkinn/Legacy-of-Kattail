 CZE_crisis_in_the_sudentenland_desc: "Les paramilitaires des Sudètes ont lancé une véritable guerre contre nous. De nombreux affrontements avec nos troupes ont été signalés : la situation dégénère rapidement. Il faut à tout prix rétablir l'ordre et le contrôle avant que l'un de nos ennemis ne profite de ce chaos."
