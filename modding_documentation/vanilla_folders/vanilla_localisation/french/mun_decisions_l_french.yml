 ###FORT DECISIONS###
 CZE_the_second_fortification_program_category: "Programmes de fortifications"
 CZE_the_second_fortification_program_category_desc: "Notre frontière est une véritable préoccupation nationale vis-à-vis de notre sécurité. Toutes les nations limitrophes ont clairement exprimé leur volonté de s'emparer d'une partie de notre territoire. Poursuivons la fortification de notre frontière, à tel point qu'elles réfléchissent à deux fois avant de s'en prendre à nous."
 CZE_fate_of_the_ro: "Le destin du Conseil des fortifications"
 CZE_fate_of_the_ro_desc: "Le Conseil des fortifications est chargé de constituer le budget relatif aux projets de fortifications. Si nous n'injectons pas cet argent rapidement dans un chantier, le peuple risque de pointer du doigt cette somme conséquente comme un véritable gâchis."
 CZE_bop_army_bunker_maintenance: "Campagne d'entretien des fortifications"
 CZE_bop_army_bunker_maintenance_desc: "Des fortifications opérationnelles et bien entretenues sont indispensables à leur bon fonctionnement. L'armée sait qu'elle peut compter sur elles."
 CZE_fortification_research: "Recherches en fortifications"
 CZE_fortification_research_desc: "Il est évident que nos frontières ont besoin d'être renforcées, mais comment ? La recherche nous aidera à trouver les réponses."
 CZE_fortification_research_tt: "A l'esprit national §Y$CZE_directorate_of_fortification_works_no_gd_idea$§!"
 CZE_fortification_research_subtract_variable_tt: "Toutes les prochaines décisions des §YProgrammes de fortifications§! vont être §Yachevées§! en §Y30§! jours de moins"
 CZE_fortification_decision_inprogress: "Autre programme de fortification déjà en cours"
 CZE_second_sudetenland_fortification_program: "Second programme de fortification des Sudètes"
 CZE_second_sudetenland_fortification_program_desc: "Les Sudètes, cette région montagneuse à la frontière avec l'Allemagne, sont le lieu idéal pour établir des fortifications frontalières. Nous pensons même pouvoir bâtir une ligne Maginot de notre cru."
 CZE_third_sudetenland_fortification_program: "Troisième programme de fortification des Sudètes"
 CZE_third_sudetenland_fortification_program_desc: "Les Sudètes disposent désormais d'une ligne de défense correcte, mais nous ne nous contenterons pas de la moyenne pour assurer la survie du pays."
 CZE_fourth_sudetenland_fortification_program: "Quatrième programme de fortification des Sudètes"
 CZE_fourth_sudetenland_fortification_program_desc: "Les Sudètes disposent désormais d'un système de défense élaboré, mais elles pourraient l'être plus encore !"
 CZE_fortify_the_crossroads_with_slo: "Fortifier les carrefours"
 CZE_fortify_the_crossroads_with_slo_desc: "Tout système de fortification peut être brisé. Pour nous prémunir face à cette éventualité, nous pourrions construire des points fortifiés autour de nos villes majeures, de façon à éviter la capture aisée par un ennemi qui parviendrait à franchir nos lignes de défense."
 CZE_fortify_the_hungarian_border_with_73: "Fortifier la frontière hongroise"
 CZE_fortify_the_hungarian_border_with_73_desc: "L'irrédentisme hongrois est une menace constante pour le pays, aussi un système de fortification à la frontière contribuerait-il à assurer notre protection."
 CZE_fortify_the_polish_border_with_72: "Fortifier la frontière polonaise"
 CZE_fortify_the_polish_border_with_72_desc: "Les agressions de la Pologne ne connaissent aucune limite. Espérons qu'une frontière bien fortifiée l'obligera à considérer des cibles plus faciles à abattre."
 ###### ARMY READINESS BALANCE OF POWER ######
 CZE_bop_ready_for_anything: "£GFX_power_balance_texticon Préparés à tout"
 CZE_bop_ready_for_anything_tt: "N'a pas l'esprit national "
