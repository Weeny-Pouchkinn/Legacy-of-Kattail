 CZE_autonomous_sentiment_desc: "S'allier au bloc autonome présente son lot d'inconvénients, notamment celui d'honorer l'engagement d'offrir suffisamment d'autonomie [SLO.GetAuAlaAlNP] [SLO.GetName]. D'autres régions vont sûrement se mettre à réclamer les mêmes revendications."
