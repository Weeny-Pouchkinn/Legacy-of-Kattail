 CZE_a_divided_nation_czech_states: "Efforts d'éducation [FROM.GetAuEnANP] §Y[FROM.GetName]§!"
 CZE_a_divided_nation_czech_states_desc: "Le manque de personnel qualifié est un frein majeur dans la croissance industrielle de notre pays. Investissons dans la mise en place de meilleurs parcours scolaires pour intégrer notre peuple à l'évolution nationale."
 CZE_a_divided_nation_slovakia_states: "Investissements supplémentaires [FROM.GetAuEnANP] §Y[FROM.GetName]§!"
 CZE_a_divided_nation_slovakia_states_desc: "Les récents investissements n'ont pas été suffisants pour égaliser les domaines industriels [FROM.GetDuDelaDelNP] [FROM.GetName]. Si nous voulons stabiliser la situation, il faudra investir davantage."
