 INS_anti_colonialist_sentiment_idea_desc: "Les révolutionnaires indonésiens sont actifs dans notre pays, notamment en diffusant leur propagande, ce qui renforce le sentiment anticolonial."
 INS_revolutionaries_working_with_indonesians_idea: "Rapprochement entre révolutionnaires et Indonésiens"
 INS_revolutionaries_working_with_indonesians_idea_desc: "Des communistes [ROOT.GetAdjMP] ont été surpris en train de communiquer avec des dirigeants indonésiens et sont soupçonnés de fomenter une révolution armée."
