 # ABDACOM Supreme Command dynamic modifier
 ABDA_supreme_command: "Commandement suprême de l'ABDACOM"
 ABDA_supreme_command_desc: "Les commandements américains, britanniques, néerlandais et australiens ont établi une doctrine navale commune à toutes les flottes. Dans le cadre de la coopération continue, cette initiative intensifie les échanges de renseignements, la coordination des patrouilles ainsi que la logistique globale, le tout améliorant concrètement l'efficacité des marines affiliées à l'ABDACOM."
