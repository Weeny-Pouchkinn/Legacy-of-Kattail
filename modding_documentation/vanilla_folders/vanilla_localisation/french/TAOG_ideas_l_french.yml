 AST_anti_fascist_measures: "Mesures antifascistes"
 AST_anti_fascist_measures_desc: "Le fascisme n'a pas encore déversé son venin en Australie, et les puissances démocratiques comptent bien l'en empêcher. Le service de renseignements du Commonwealth va mettre sous surveillance tous ses partisans et procéder à des arrestations pour éviter que cette idéologie gagne en popularité."
 ABDA_corps_expeditionnaire_spirit: "Corps expéditionnaire"
 ABDA_corps_expeditionnaire_spirit_desc: "Les forces françaises engagées sur le théâtre du Pacifique ont servi dans les colonies, habituées à mener des opérations en milieu hostile à des kilomètres de la base. Leur expérience en Asie du Sud-Est leur confère un avantage certain face aux tactiques japonaises, assurant leur détermination face à l'ennemi."
 ABDA_maintain_strategic_flexibility_spirit: "Souplesse stratégique"
 ABDA_maintain_strategic_flexibility_spirit_desc: "La production industrielle américaine dessert principalement le théâtre du Pacifique ; les chantiers navals tournent à plein régime pour développer une flotte capable de dominer l'immensité de l'océan. Détachée de tous les fronts principaux, Washington peut ainsi intervenir rapidement en masse partout où il le faut."
 AST_toe_the_line_spirit: "Rentrer dans le rang"
 AST_toe_the_line_spirit_desc: "Grâce au rationnement, aux heures supplémentaires et au sacrifice de la production civile envers l'effort national, le gouvernement a pu débloquer des ressources qu'il n'aurait pas pu obtenir autrement. Le compromis est pour le moins austère et très impopulaire, mais la population se plie à la récession."
