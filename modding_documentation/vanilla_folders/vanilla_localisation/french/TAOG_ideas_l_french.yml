 idea_INS_volksraad: "Le Volksraad"
 idea_INS_volksraad_desc: "Le Volksraad est un conseil fondé par les Pays-Bas en 1918 dans le cadre de la « politique éthique » visant à mettre en place une démocratie partielle incluant diverses minorités ethniques et culturelles de l'archipel. Sa nature démocratique est principalement théorique, puisque le gouverneur général et la couronne néerlandaise possèdent tous deux un droit de véto inconditionnel."
 INS_volksraad_custom_tt: "Permet de recruter des §Yconseillers du Volksraad§!\nPermet de choisir des §Ydécisions du Volksraad§!"
 INS_great_depression: "La Grande Dépression"
 INS_great_depression_desc: "La Grande Dépression n'a pas provoqué de ravages dans les Indes, mais les mesures protectionnistes mondiales qui en ont découlé ont décimé notre économie basée sur l'export de matières premières, comme le caoutchouc ou le pétrole."
 INS_great_depression_tt: "Modifie §Y$INS_great_depression$§! ainsi :"
 INS_dutch_east_indies: "Administration désorganisée"
 INS_dutch_east_indies_desc: "Les Indes orientales rassemblent un archipel de centaines d'îles avec autant de cultures et de langues, ce qui rend son administration très complexe, sans parler des mouvements indépendantistes, des barrières culturelles et des retombées de la Grande Dépression qui n'ont fait que nous rendre la tâche encore plus difficile. La « politique éthique » mise en place en 1918 a bien essayé d'arranger la situation en imposant des règles de travail éthiques et en octroyant une représentation démocratique aux minorités, mais la crise économique ne nous a pas permis d'implémenter ces mesures."
 INS_dutch_east_indies_tt: "Modifie §Y$INS_dutch_east_indies$§! ainsi :"
 INS_volksraad_tt: "Modifie §Y$INS_dutch_east_indies$§! ainsi :"
 INS_royal_netherlands_east_indies_army_desc: "La Koninklijk Nederlands Indisch Leger, ou KNIL, est l'armée royale des Indes néerlandaises, indépendante des Pays-Bas. Elle est constituée de soldats d'origine européenne, mais aussi indonésienne. Seulement, la barrière linguistique et culturelle entre les Pays-Bas et les multiples ethnies de l'archipel rendent le recrutement difficile."
 idea_INS_netherlands_most_precious_jewel: "Le joyau de la couronne néerlandaise"
 idea_INS_netherlands_most_precious_jewel_desc: "La colonie des Indes néerlandaises appartient aux Pays-Bas depuis bientôt 350 ans. Son administration possède des liens forts avec le gouvernement néerlandais, à tel point qu'on surnomme souvent ce territoire « le joyau de la couronne néerlandaise ». Et comme tout joyau digne de ce nom, ladite couronne n'a nullement l'intention de s'en séparer."
 INS_netherlands_most_precious_jewel_tt: "£GFX_trigger_no Peut augmenter l'autonomie à indépendant"
