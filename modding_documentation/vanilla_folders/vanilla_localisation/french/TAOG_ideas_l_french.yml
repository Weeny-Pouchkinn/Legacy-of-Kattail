 idea_SIA_debt_repayment: "Remboursement de la dette"
 idea_SIA_debt_repayment_desc: "Les conséquences du déficit budgétaire se font ressentir : les revenus sont redirigés vers les créanciers et les projets de construction sont au ralenti à cause des taux d'usures qui ne sont plus favorables."
 idea_SIA_an_unceasy_alliance: "Une alliance fragile"
 idea_SIA_an_unceasy_alliance_desc: "L'alliance tient bon, mais pour combien de temps encore ? Les doutes au sein du gouvernement ramènent peu à peu la nation vers une ligne directrice neutre."
