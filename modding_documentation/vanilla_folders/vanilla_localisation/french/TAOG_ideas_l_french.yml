 AST_war_plan_japan: "Plan de guerre Japon"
 AST_australian_culture_investments_idea: "Investissements dans la culture australienne"
 AST_australian_culture_investments_idea_desc: "§W§YUne fois retirée§! :\nAjoute §YUn lieu commun§!, qui octroie\nStabilité : §G+10%§!\nSoutien à la guerre : §G+10%§!.§!\n"
 AST_a_sense_of_place: "Un lieu commun"
 AST_a_sense_of_place_desc: "L'identité nationale est le liant qui unit un peuple. Une culture prospère pousse à une unification destinée à opposer tout ceux qui viendraient la menacer."
 AST_a_sense_of_place_upgraded: "Un lieu commun"
 AST_a_sense_of_place_upgraded_desc: "L'identité nationale qui fleurissait paisiblement jusqu'alors, vient de s'endurcir subitement. La fierté ne réside plus simplement dans la terre et le mode de vie : dorénavant, l'Australie défendra ce qu'elle a bâti. Les hommes et les femmes rassemblées sous la Croix du Sud en font le serment."
 AST_the_promise_of_nauru: "La promesse de Nauru"
 AST_the_promise_of_nauru_tt: "Conséquences une fois que [AST.GetLeLaLNP] §Y[AST.GetName]§! sign[AST.GetEEntNP] l'accord :\n§YNauru§! revient sous le contrôle §Y[GER.GetAdjMS]§!\n[AST.GetLeLaLNPCap] §Y[AST.GetName]§! obtien[AST.GetTNentNP] l'indépendance\n[GET_AST_NAURU_PACT_FACTION_EFFECT]"
 AST_nauru_pact_guarantee_tt: "Garantit l'indépendance [AST.GetDuDelaDelNP] §Y[AST.GetName]§!"
 AST_nauru_pact_faction_tt: "Les §Y[AST.GetHabitants]§! rejoignent §Y[GER.GetFactionName]§!"
 AST_poor_population_growth: "Faible croissance démographique"
 AST_poor_population_growth_desc: "Au moment de la Grande Dépression en 1929, le taux de natalité a fortement chuté en Australie. Combinée à une baisse de l'immigration, la croissance démographique peine depuis à se redresser."
