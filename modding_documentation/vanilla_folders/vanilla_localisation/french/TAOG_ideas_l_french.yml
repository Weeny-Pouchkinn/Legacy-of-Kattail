 ### SIAM ###
 ############
 idea_SIA_civilian_full_support: "Département civil : §Gsoutien total§!"
 idea_SIA_civilian_full_support_desc: "Le département civil soutient corps et âme le gouvernement. Administrateurs et technocrates partagent leurs savoirs pour faire avancer le développement."
 idea_SIA_civilian_slight_support: "Département civil : soutien modéré"
 idea_SIA_civilian_slight_support_desc: "Le département civil soutient la ligne directrice du gouvernement. Sa coopération apporte des avantages non négligeables."
 idea_SIA_civilian_neutral: "Département civil : neutre"
 idea_SIA_civilian_neutral_desc: "Le département civil semble indifférent au gouvernement. L'administration fonctionne comme espéré, sans sentiment d'affinité politique."
 idea_SIA_civilian_opposition: "Département civil : en opposition"
 idea_SIA_civilian_opposition_desc: "Le département civil est en désaccord avec le gouvernement. Les fonctionnaires travaillent à contrecœur, les budgets sont refusés... la machine administrative est en pleine déroute."
 idea_SIA_civilian_rebellious: "Département civil : §Rrévolté§!"
 idea_SIA_civilian_rebellious_desc: "Le département civil est en rupture avec le gouvernement. L'instabilité gronde et la menace d'une action violente grandit de jour en jour."
 idea_SIA_military_full_support: "Département militaire : §Gsoutien total§!"
 idea_SIA_military_full_support_desc: "Le département militaire soutient corps et âme le gouvernement. Les officiers chapeautent la conscription et la production d'armement pour atteindre les objectifs nationaux en matière de sécurité."
 idea_SIA_military_slight_support: "Département militaire : soutien modéré"
 idea_SIA_military_slight_support_desc: "Le département militaire soutient la ligne directrice du gouvernement. Il supervise convenablement la conscription et la production, mais des efforts restent à faire."
 idea_SIA_military_neutral: "Département militaire : neutre"
 idea_SIA_military_neutral_desc: "Le département militaire semble indifférent au gouvernement. L'armée accomplit son devoir sans montrer ni enthousiasme ni contestation. Elle semble dans l'expectative."
 idea_SIA_military_opposition: "Département militaire : en opposition"
 idea_SIA_military_opposition_desc: "Le département militaire est en désaccord avec le gouvernement. Les officiers sabordent la production et font fuir les recrues."
 idea_SIA_military_rebellious: "Département militaire : §Rrévolté§!"
 idea_SIA_military_rebellious_desc: "Le département militaire est en rupture avec le gouvernement. La conscription est inexistante, la production d'armement à l'arrêt et la menace d'un coup d'État plus grande que jamais."
 idea_SIA_defenders_of_constitutional_liberty: "Les défenseurs de la liberté constitutionnelle"
 idea_SIA_civil_service_heroism_1: "Les héros de la fonction publique"
 idea_SIA_civil_service_heroism_1_desc: "La fonction publique a su se montrer plus qu'utile : son soutien accélère lentement, mais sûrement la recherche et le développement."
 idea_SIA_civil_service_heroism_2: "$idea_civil_service_heroism_1$"
 idea_SIA_civil_service_heroism_2_desc: "$idea_SIA_civil_service_heroism_1_desc$"
 idea_SIA_redirected_military_funds: "Fonds militaires réorientés"
 idea_SIA_thai_irredentism: "Irrédentisme thaïlandais"
 idea_SIA_oss_special_forces_training: "Entraînement des forces spéciales de l'OSS"
 idea_SIA_seized_japanese_funds: "Saisie des fonds japonais"
 idea_SIA_seized_japanese_funds_desc: "Maintenant que l'accord avec les Japonais est rompu, nous avons saisi les fonds et les réserves qu'ils nous ont laissés. Ils vont servir à l'industrialisation et la construction du pays."
 idea_SIA_oss_special_forces_training_desc: "Nos agents se sont entraînés aux opérations de sabotage, d'infiltration et aéroportée aux côtés de l'OSS. Cette expérience inestimable devrait faire de nos forces spéciales un instrument exceptionnel."
 idea_SIA_sold_privy_purse_lands: "Terrains royaux privés vendus"
 idea_SIA_sold_privy_purse_lands_desc: "La vente des propriétés foncières de la couronne a produit un capital conséquent pour le compte de l'État. Nous allons pouvoir respirer économiquement et lancer des constructions."
 idea_SIA_war_fervor: "Ferveur militaire"
 idea_SIA_bloodlusted_irredentism: "Irrédentisme sanguinaire"
 idea_SIA_bloodlusted_irredentism_desc: "L'ambition territoriale s'est transformée en une volonté plus tenace encore : l'armée se bat désormais comme si elle libérait des territoires sous le joug d'un ennemi redoutable."
 idea_SIA_the_royal_police_counterweight: "Allégeance de la police royale"
 idea_SIA_civilian_technocrats_in_institutions: "Technocrates civils"
 idea_SIA_civilian_technocrats_in_institutions_desc: "L'assignation d'experts civils à des institutions clés de l'État a amélioré l'extraction de ressources et l'efficacité des réunions politiques."
 idea_SIA_yuvachon: "Yuvachon"
 idea_SIA_yuvachon_desc: "Le Yuvachon forme la jeunesse avec la discipline intransigeante de l'armée, produisant ainsi des effectifs opérants et endoctrinés."
 idea_SIA_yuvachon_2: "$idea_SIA_yuvachon$"
 idea_SIA_yuvachon_2_desc: "$idea_SIA_yuvachon_desc$"
 idea_SIA_rebuilding_the_war_torn_economy: "Rétablir l'économie d'après-guerre"
 idea_SIA_specialist_marine_forces: "Forces spéciales de marine"
 idea_SIA_specialist_marine_forces_desc: "Nous avons formé et équipé des spécialistes amphibiens à assigner aux opérations d'assaut côtier."
 idea_SIA_rehabilitated_military: "Réhabilitation des militaires"
 idea_SIA_desperate_gambit: "Tout pour le tout"
 idea_SIA_desperate_gambit_desc: "Lorsqu'il n'y a plus aucune solution pour se sortir du trou, il ne nous reste plus qu'à grimper !"
 idea_SIA_purged_senior_military: "Officiers de l'armée purgés"
 idea_SIA_purged_senior_military_desc: "Nous avons limogé les officiers supérieurs considérés comme une menace au gouvernement. La perte de ces hommes d'expérience a chamboulé la cohésion de l'armée et mis en péril son développement."
 idea_SIA_cemented_control: "Contrôle renforcé"
 idea_SIA_cemented_control_desc: "Le gouvernement a renforcé son contrôle sur les institutions de l'État. L'opposition politique maintenant évincée, il devient l'unique détenteur du pouvoir."
 idea_SIA_cemented_control_2: "Contrôle entériné"
 idea_SIA_cemented_control_2_desc: "$idea_SIA_cemented_control_desc$"
 idea_SIA_cemented_control_3: "Acte pour les Thaïlandais en temps de guerre"
 idea_SIA_cemented_control_3_desc: "En cas de guerre portant atteinte à la souveraineté de la Couronne ou du peuple, tous les Thaïlandais ont pour devoir de résister à l'occupation par tous les moyens possibles, jusqu'à prendre les armes s'il le faut."
 idea_SIA_suspend_ordinary_legal_procedures: "Procédures légales ordinaires suspendues"
 idea_SIA_thai_cultural_mandates: "Décrets culturels thaïlandais"
 idea_SIA_military_humiliation: "Humiliation militaire"
 idea_SIA_death_defiant: "Trompe-la-mort"
 idea_SIA_death_defiant_desc: "Nous sommes déjà morts, de toute façon. Alors, ne retenez pas vos coups."
 idea_SIA_songsuradet_ascendant_0: "L'ascension de Songsuradet"
 idea_SIA_songsuradet_ascendant_0_desc: "Maintenant qu'il a réussi à tempérer la rogne du gouvernement, Phraya Songsuradet est devenu ce qu'on pourrait appeler un intouchable, une personnalité de premier plan qu'il est désormais impossible d'évincer.\nPour éviter toute tentative de purge future, il va très certainement s'immiscer dans la politique du gouvernement en freinant toutes les prises de décision des quatre fers."
 idea_SIA_songsuradet_ascendant_1: "$idea_SIA_songsuradet_ascendant_0$"
 idea_SIA_songsuradet_ascendant_1_desc: "$idea_SIA_songsuradet_ascendant_0_desc$"
 idea_SIA_rebuilding_after_civil_war: "Rebâtir après la guerre civile"
 idea_SIA_rebuilding_after_civil_war_desc: ""
 idea_SIA_anti_burmese_sentiment: "Opinion anti-birmane"
 idea_SIA_sued_king_prajadhipok: "Le roi Prajadhipok attaqué en justice"
 idea_SIA_pan_thaiism: "Pan-thaïsme"
 idea_SIA_pan_thaiism_desc: "L'idéologie du pan-thaïsme prône l'unification des peuples thaïlandais sous un seul État. Ce postulat motive la nation à accepter l'expansion et préserve le moral des citoyens lors d'action offensive."
