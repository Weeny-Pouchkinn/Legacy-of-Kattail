 NZL_railways_board: "La Commission des chemins de fer de l'État"
 NZL_railways_board_desc: "La Commission des chemins de fer de l'État a été créée en 1931 dans le cadre d'une restructuration du service des chemins de fer, dans le but de séparer le processus décisionnel des services du gouvernement. Toutefois, seuls quelques signes d'amélioration ont été constatés depuis la mise en place du réseau ferroviaire. La pression s'accentue pour que le gouvernement abolisse cette Commission et reprenne le contrôle des opérations."
 NZL_great_depression: "La Grande Dépression"
 NZL_great_depression_desc: "L'effondrement de l'économie mondiale survenu en 1929 a frappé de plein fouet l'économie majoritairement agricole de Nouvelle-Zélande. Maintenant que les pays achètent moins de produits venant de Nouvelle-Zélande, beaucoup se sont retrouvés sans emploi, ce qui a réduit le pouvoir d'achat des consommateurs et entraîné l'effondrement d'autres industries. Après des années d'austérité, la nation aspire à un changement de direction. "
 NZL_commonwealth_loyalty: "Loyauté envers le Commonwealth britannique"
 NZL_commonwealth_loyalty_desc: "La Nouvelle-Zélande reste un membre engagé du Commonwealth britannique et considère toujours le roi comme le chef d'État légitime. L'économie de la Nouvelle-Zélande s'intègre pleinement dans le système économique impérial."
