 INS_bangka_bauxite_export: "Export de bauxite de Bangka"
 INS_bangka_bauxite_export_desc: "Les îles de Bangka Belitung possèdent une très grande part de la bauxite mondiale, l'ingrédient de base pour composer l'aluminium. Nous pourrions éventuellement mettre en place une production d'aluminium domestique, mais la quantité de matière première est si colossale que la vendre à l'état brut devrait nous rendre très riches."
