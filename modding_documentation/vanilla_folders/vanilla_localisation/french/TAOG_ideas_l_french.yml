 AST_imperial_pressure_spirit: "Pression impériale"
 AST_imperial_pressure_spirit_desc: "Au vu des derniers événements, tout le monde s'accorde à dire que la politique australienne a pris un tournant inacceptable pour une nation sous l'égide du Commonwealth britannique. Les [ENG.GetHabitants] sont prêts à nous laisser l'occasion d'arranger la situation, mais leur patience ne sera pas éternelle.\n\n§WS'annule si [AST.GetLeLaLNP] §Y[AST.GetName]§! [AST.GetNestNesontNP] pas un sujet [ENG.GetDuDelaDelNP] §Y[ENG.GetName]§!§!"
