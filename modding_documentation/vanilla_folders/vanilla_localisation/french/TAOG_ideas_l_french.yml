 AST_singapore_strategy_idea_desc: "À la demande de l'Australie, nous allons renforcer les défenses de Singapour. C'est bien naturel, car l'entièreté du plan de défense du Pacifique repose sur la stratégie du même nom.\n\n§W§YUne fois retirée§! (§YSingapour§!) :\n Ajoute §G2§! §Ybases aériennes§!.\n Ajoute §G2§! §Ybases navales§!.\n Ajoute §G1§! §Yfort côtier§!.§!\n"
