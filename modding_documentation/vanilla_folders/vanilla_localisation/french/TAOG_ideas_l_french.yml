 idea_SIA_bank_of_siam: "Banque de Siam"
 idea_SIA_bank_of_siam_desc: "La banque du Siam est le fondement financier de l'État, orientant les investissements et gérant les politiques économiques du pays pour soutenir l'expansion industrielle."
 idea_SIA_bank_of_siam_2: "$idea_SIA_bank_of_siam$"
 idea_SIA_bank_of_siam_2_desc: "$idea_SIA_bank_of_siam_desc$"
 idea_SIA_boon_rawd_brewery: "Brasserie Boon Rawd"
 idea_SIA_boon_rawd_brewery_desc: "La brasserie Boon Rawd est devenue un véritable symbole de l'industrie domestique. Son succès attire les investissements de toutes parts."
