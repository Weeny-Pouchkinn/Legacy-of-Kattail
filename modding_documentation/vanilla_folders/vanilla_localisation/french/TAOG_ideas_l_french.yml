 idea_SIA_constitutional_virtue: "La vertu constitutionnelle"
 idea_SIA_an_absolute_monarchy: "Monarchie absolue"
 idea_SIA_an_absolute_monarchy_desc: "La couronne est seule détentrice de l'autorité politique. La parole du roi est évangile, l'opposition est balayée et le prestige royal motive la mobilisation nationale. Depuis le trône, tout est décidé, y compris l'action militaire."
 idea_SIA_a_constituional_monarchy: "Monarchie constitutionnelle"
 idea_SIA_a_constituional_monarchy_desc: "Le cadre constitutionnel définit clairement les limites de l'autorité royale, préservant les droits du peuple. La couronne est un symbole fédérateur plutôt qu'une figure d'autorité absolue, ce qui permet à la nation une meilleure stabilité, plus d'innovation et surtout plus d'affinités avec le monde démocratique."
 idea_SIA_restoring_order: "Restauration de l'ordre"
 idea_SIA_military_expansion_costs: "Coûts d'expansion militaire"
 idea_SIA_a_modern_economy: "Une économie moderne"
 idea_SIA_death_to_communists: "Mort aux communistes"
 idea_SIA_death_to_communists_desc: "La ferveur anti-communiste a gagné nos rangs, motivant nos troupes à se montrer plus féroces face à l'armée rouge de Chine."
 idea_SIA_death_to_nationalists: "Mort aux nationalistes"
 idea_SIA_death_to_nationalists_desc: "La ferveur anti-nationaliste a gagné nos rangs, motivant nos troupes à se montrer plus féroces face à l'armée de Chine."
 idea_SIA_breaking_the_burmese_line: "Briser la ligne birmane"
 idea_SIA_the_yellow_dossier: "Le Dossier jaune"
 idea_SIA_the_yellow_dossier_desc: "D'après un rapport national, l'industrie domestique souffrait d'une inefficacité généralisée. Depuis la promulgation de ses réformes, nos usines sont bien plus opérationnelles. En revanche, cette réforme a un prix."
 idea_SIA_the_yellow_dossier_2: "$idea_SIA_the_yellow_dossier$"
 idea_SIA_the_yellow_dossier_2_desc: "$idea_SIA_the_yellow_dossier_desc$"
 idea_SIA_pacific_war_preparations: "Préparations à la guerre du Pacifique"
 idea_SIA_a_race_against_time: "Une course contre la montre"
 idea_SIA_overheated_economy: "Économie en surchauffe"
 idea_SIA_overheated_economy_desc: "L'économie a atteint ses limites. La demande a dépassé notre capacité à produire l'offre. La construction est donc momentanément à l'arrêt, le temps que les choses rentrent dans l'ordre."
 idea_SIA_ending_military_grift: "Fin des abus de l'armée"
 idea_SIA_the_military_oversight_bureau: "$SIA_military_oversight_bureau$"
 idea_SIA_the_military_oversight_bureau_desc: "Le bureau de surveillance militaire impose des critères toujours plus élevés pour les commandants, accélérant le développement de l'expertise au sein du corps d'officiers."
 idea_SIA_public_credit_debt: "Dette publique"
 idea_SIA_public_credit_debt_desc: "Les obligations de l'État mettent à mal l'économie. Nous pourrions réinvestir ces ressources dans la production et la consommation civile."
 idea_SIA_public_credit_debt_2: "Remboursement de la dette publique"
 idea_SIA_public_credit_debt_2_desc: "$idea_SIA_public_credit_debt_desc$"
 idea_SIA_revision_of_unequal_treaties: "Revoir les traités inégaux"
 idea_SIA_purged_military: "Armée purgée"
 idea_SIA_purged_military_desc: "Le retrait des officiers jugés instables politiquement a privé l'armée d'une expertise conséquente. Son organisation et son développement s'en retrouvent forcément impactés."
 SIA_khana_ratsadon_inlay_title: "Khana Ratsadon"
 SIA_civilian_wing_label: "Département civil"
 SIA_military_wing_label: "Département militaire"
 SIA_wing_state_full_support: "§GSoutien total§!"
 SIA_wing_state_slight_support: "§GSoutien modéré§!"
 SIA_wing_state_neutral: "§YNeutre§!"
 SIA_wing_state_opposition: "§REn opposition§!"
 SIA_wing_state_rebellious: "§RRévolté§!"
 SIA_civilian_wing_history_tt: "La faction civile du Khana Ratsadon est menée par des administrateurs et technocrates progressistes, dont le plus éminent n'est autre que §YPridi Phanomyong§!. Formé au droit en France, il est rentré au pays avec l'intention de réformer la politique foncière et l'économie nationale grâce à une démocratie constitutionnelle qui donnerait le pouvoir au peuple.\n\nLe département civil est majoritairement §Gpro-développement§!, privilégiant l'éducation, les infrastructures et l'industrie. Il rejette en général les budgets militaires importants et les régimes autoritaires. Pour obtenir son soutien, promulguez des mesures modernes qui préservent le gouvernement constitutionnel."
 SIA_military_wing_history_tt: "La faction militaire du Khana Ratsadon est menée par des officiers qui se considèrent comme les véritables gardiens de la révolution. Leur figure principale est incarnée par §YPlaek Phibunsongkhram§!, un colonel très intéressé par les mouvements nationalistes d'Europe.\n\nLe département militaire est §Gpro-réarmement§! et prône un État centralisé strict. Il rejette les mesures économiques de Pridi, considérées radicales, et a horreur que le département civil se mêle des affaires de la défense. Pour obtenir son soutien, investissez massivement dans l'armée et promulguez des mesures qui amplifient l'autorité nationale."
 idea_SIA_wing_promotion_disruption: "Réalignement de faction"
 idea_SIA_wing_promotion_disruption_desc: "Soutenir haut et fort un seul département du Khana Ratsadon va en coûter au gouvernement ; la faction délaissée affiche clairement son mécontentement, tandis que l'armée et l'administration sont au point mort. La situation ne s'arrangera pas tant que le nouvel arrangement ne sera pas acté."
 idea_SIA_military_wing_unrest: "Révolte du département militaire"
 idea_SIA_military_wing_unrest_desc: "Les officiers ont perdu patience, une fois de plus. Après l'échec de sa prise de pouvoir, le département militaire exprime son opposition par des actes de sabotage et de désertion. L'armée ne vaut plus rien tant que les responsables ne seront pas interpellés."
 idea_SIA_civilian_wing_unrest: "Révolte du département civil"
 idea_SIA_civilian_wing_unrest_desc: "La faction de Pridi se désolidarise du gouvernement : maintenant que ses chances de reprendre le pouvoir disparaissent à nouveau, le département civil reprend les grèves, l'obstruction administrative et les manifestations en ville. Tant que les humeurs ne se seront pas tempérées, l'économie nationale tournera au ralenti."
 idea_SIA_unwavering_civilian_support: "Soutien civil indéfectible"
 idea_SIA_unwavering_civilian_support_desc: "Maintenant que le département militaire est dissout, la faction civile détient à elle seule la légitimité de gouverner. Les technocrates de Pridi ont désormais le champ libre d'administrer le pays comme bon leur semble, avec un zèle redoublé dont l'ancienne coalition n'aurait jamais été capable."
 idea_SIA_unified_khana_ratsadon: "Parti populaire uni"
 idea_SIA_unified_khana_ratsadon_desc: "La lutte continuelle entre armée et administration va enfin disparaître : les deux départements du Khana Ratsadon regardent désormais dans la même direction. Le gouvernement peut à présent œuvrer sans entrave, une situation inédite dans notre pays. Pour la première fois, soldats, fonctionnaires et industriels coopèrent main dans la main."
