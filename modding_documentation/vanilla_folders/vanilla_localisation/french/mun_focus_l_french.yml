l_french:
 #Shortcuts
 CZE_military_path_shortcut: "Forces armées"
 CZE_economic_path_shortcut: "Économie"
 CZE_diplomacy_path_shortcut: "Diplomatie"
 CZE_fort_path_shortcut: "Campagnes de fortifications"
 CZE_skoda_priority_shortcut_name: "Priorité de Škoda"
 CZE_political_path_shortcut: "Politique"
 # Č does show when scrolling through focuses, but not in the detailed focus view title (does work in the description though)
 CZE_coalition_building: "Consolider la coalition"
 CZE_coalition_building_desc: "La coalition qui a vu le jour au lendemain des élections doit travailler de concert avec ses membres pour devenir parfaitement opérationnelle. Depuis la démission du Premier ministre Jan Malypetr, elle doit à tout prix trouver le soutien nécessaire à sa stabilité."
 CZE_merge_the_paramilitaries: "Fusionner les groupes paramilitaires"
 CZE_merge_the_paramilitaries_desc: "Nos paramilitaires sont éparpillés aux quatre coins du territoire, divisés dans des groupes divers. Si nous voulons nous en servir comme d'une véritable force armée, il faut les contraindre à fusionner."
 CZE_integrated_paramilitaries: "Intégrer les paramilitaires"
 CZE_integrated_paramilitaries_desc: "N'en déplaise à l'armée, nous devons intégrer les groupes paramilitaires au corps de métier. Ainsi, nous aurons un contingent bien plus important en cas de besoin."
 CZE_wielding_the_hammer: "Porteurs du maillet"
 CZE_wielding_the_hammer_desc: "Profitons de notre majorité écrasante à l'Assemblée nationale pour accélérer la promulgation des lois. Il faut impérativement mettre de l'ordre dans notre système législatif."
 CZE_emergency_measures: "Mesures d'urgence"
 CZE_emergency_measures_desc: "Déployons des mesures d'urgence pour traiter efficacement les nombreuses crises qui paralysent notre nation ; profitons-en également pour nous autoriser la surveillance rapprochée des individus opposés idéologiquement au gouvernement. Nous serons ainsi mieux équipés pour affronter les défis qui attendent notre nation."
 CZE_king_of_the_castle: "Le roi en son Château"
 CZE_king_of_the_castle_desc: "Tout le monde sait désormais qui dirige véritablement notre gouvernement. À l'heure où l'incertitude règne en maître, arrêtons les faux-semblants et laissons le champ libre à $CZE_edvard_benesh$. Il en va de notre sécurité nationale."
 CZE_closer_ties_with_the_moderate_germany_parties: "Mobiliser les partis modérés des Sudètes"
 CZE_closer_ties_with_the_moderate_germany_parties_desc: "Certains partis dans les Sudètes sont prêts à collaborer avec notre coalition et le gouvernement. Employons-les pour forger ces liens."
 CZE_complete_reconciliation: "La grande réconciliation"
 CZE_complete_reconciliation_desc: "Nous avons œuvré pour bâtir les ponts de la confiance. L'heure est désormais à la réconciliation."
 CZE_complete_reconciliation_cooldown_flag: "A atteint la priorité §Y$CZE_closer_ties_with_the_moderate_germany_parties$§!"
 CZE_complete_reconciliation_cooldown_flag_tt: "Actuellement, [?CZE_complete_reconciliation_cooldown_flag:days|Y0] jours"
 CZE_bastion_of_liberty: "Le bastion de la liberté"
 CZE_bastion_of_liberty_desc: "Nous sommes l'un des rares pays européens ayant conservé son pluralisme à l'est du Rhin. Tâchons de le rappeler au monde entier."
 CZE_standing_against_the_storm: "Unis face à la tempête"
 CZE_standing_against_the_storm_desc: "Malgré nos lacunes et nos faiblesses, nous saurons faire face à tous les défis que nous imposera l'avenir : unis face à la tempête !"
 CZE_truth_prevails: "La vérité vaincra"
 CZE_truth_prevails_desc: "Malgré les tâches insurmontables et les missions impossibles, nous n'oublions pas notre devise nationale : « La vérité vaincra ! » C'est tout ce qu'il nous faut pour surmonter tous les obstacles."
 CZE_negotiations_with_the_autonomous_bloc: "Négociations avec l'alliance du bloc autonome"
 CZE_negotiations_with_the_autonomous_bloc_desc: "Si nous voulons former une coalition capable d'éloigner le pouvoir de Benes et de son armée de larbins à l'Assemblée nationale, nous devons nous allier au bloc autonome. Néanmoins, obtenir leur soutien risque de nous coûter cher."
 CZE_slovakia_autonomy_agreement: "Accord d'autonomie pour la Slovaquie"
 CZE_slovakia_autonomy_agreement_desc: "Le bloc autonome est prêt à collaborer avec nous, à condition de signer un accord d'autonomie avec notre gouvernement. C'est un lourd tribut, mais un tribut bien moins cher que celui d'affronter la situation politique par nous-mêmes."
 CZE_slovakia_autonomy_agreement_tt: "[RUT.GetLeLaLNPCap] §Y[RUT.GetName]§! va vouloir le même accord que [SLO.GetLeLaLNP] §Y[SLO.GetName]§!"
 CZE_slovakia_autonomy_agreement_2_tt: "$CZE_the_autonomous_bloc_demands$ seront retardées de §Y35 jours§! aussitôt cette priorité choisie."
 CZE_topple_the_king: "Renverser le roi"
 CZE_topple_the_king_desc: "L'influence qu'exerce $CZE_edvard_benesh$ sur notre gouvernement est insoutenable. Son pouvoir excède allègrement son poste de président, notamment à cause de son armée de loyalistes au parlement. Par chance, la situation est idéale pour lui soutirer le contrôle."
 CZE_comprise_with_the_carpathians: "Compromis avec les Carpates"
 CZE_comprise_with_the_carpathians_desc: "La région de la Ruthénie cherche à mettre en place une fédéralisation semblable à celle que nous avons accordée [SLO.GetAuAlaAlNP] [SLO.GetName]. Si nous acceptons, nous perdrons la majorité de notre influence dans la région, mais aussi en [9.GetName]. Peut-être pourrions-nous négocier avec eux pour trouver un terrain d'entente ?"
 CZE_the_rut_demands_add_35_CZE_comprise_with_the_carpathians_tt: "$CZE_the_rut_demands$ seront retardées de §Y35 jours§! aussitôt cette priorité choisie."
 CZE_cut_carpathia_loose: "Abandonner les Carpates"
 CZE_cut_carpathia_loose_desc: "Depuis le passage de la Slovaquie sous État fédéral, la région de la Ruthénie cherche à obtenir le même accord. C'est de la folie, malheureusement, nous possédons très peu d'arguments pour les convaincre de rester sous notre contrôle. Nous ferions mieux finalement de céder à leur demande."
 CZE_compromise_with_the_veteran_agrarian: "Compromis avec les anciens agriculteurs"
 CZE_compromise_with_the_veteran_agrarian_desc: "L'union agraire d'antan nous empêche de tisser des liens durables avec l'électorat urbain. Nous devons trouver des compromis pour arriver à aller de l'avant."
 CZE_reorient_the_broad_coalition: "Réorienter la grande coalition"
 CZE_reorient_the_broad_coalition_desc: "La grande coalition est à la tête de notre gouvernement depuis plusieurs années, mais les nombreux partis politiques qui la composent rendent la prise de décision très complexe. Il est grand temps de redéfinir la politique interne de ses ministres."
 CZE_leverage_sokol: "Le Mouvement Sokol"
 CZE_leverage_sokol_desc: "Le Sokol est un mouvement majeur inscrit depuis des décennies dans la structure nationale. En ces temps incertains, nous pouvons faire appel à cette institution pour fournir une formation paramilitaire et amorcer une campagne de recrutement pour l'armée."
 CZE_urbanist_policies: "Mesures urbanistes"
 CZE_deepend_ties_with_the_trademans: "Resserrer les liens avec les commerçants"
 CZE_deepend_ties_with_the_trademans_desc: "Le parti des artisans est l'un des mouvements plus populaires parmi l'électorat urbain de classe moyenne. Collaborons avec eux pour gagner le soutien des villes tout en conservant nos rapports avec les populations rurales."
 CZE_apart_but_togather: "Unis dans la division"
 CZE_apart_but_togather_desc: "Nos régions n'ont jamais été aussi autonomes, mais nous n'avons jamais été aussi puissants qu'aujourd'hui. Nous sommes prêts à tout affronter !"
 CZE_contact_henlein: "Contacter Henlein"
 CZE_contact_henlein_desc: "$CZE_konrad_henlein$ a toujours été l'épine au pied du gouvernement. Néanmoins, étant donné les circonstances internationales, il serait sage d'entamer une collaboration."
 CZE_contact_henlein_cooldown_flag: "A atteint la priorité §Y$CZE_no_compromise_with_the_sdp$§!"
 CZE_contact_henlein_cooldown_flag_tt: "Actuellement, [?CZE_contact_henlein_cooldown_flag:days|Y0] jours"
 CZE_contact_henlein_focus_warning_tt: "Si nous atteignons la priorité §Y$CZE_no_compromise_with_the_sdp$§!, cette §Ypriorité nationale§! ne sera pas disponible avant §Y350§! jours"
 CZE_contact_henlein_focus_order_warning_tt: "Si nous atteignons la priorité §Y$CZE_no_compromise_with_the_sdp$§! après avoir atteint cette §Ypriorité nationale§!, §Y$CZE_konrad_henlein$§! ne sera plus disponible"
 CZE_no_compromise_with_the_sdp: "Poursuivre le blocus du SdP"
 CZE_no_compromise_with_the_sdp_desc: "Le SdP n'a rien à offrir à notre coalition. Il ne cherche qu'à attiser la tension politique en critiquant toutes les décisions du gouvernement. Tâchons de les priver de toute coalition, pour le bien du pays."
 CZE_no_compromise_with_the_sdp_cooldown_flag: "A atteint la priorité §Y$CZE_contact_henlein$§!"
 CZE_no_compromise_with_the_sdp_cooldown_flag_tt: "Actuellement, [?CZE_no_compromise_with_the_sdp_cooldown_flag:days|Y0] jours"
 CZE_no_compromise_with_the_sdp_focus_warning_tt: "Si nous atteignons la priorité §Y$CZE_contact_henlein$§!, cette §Ypriorité nationale§! ne sera pas disponible avant §Y350§! jours"
 # CZE_economic_integration: "Economic Integration"
 # CZE_economic_integration_desc: "Why stop at a customs union? Economic integration will further grow our economies and ensure our future is an affluent one for all members."
 CZE_form_a_federation: "Fonder une fédération"
 CZE_form_a_federation_desc: "Une fédération en Europe centrale n'est plus une utopie irréaliste comme autrefois. En unissant nos nations, nous pouvons devenir ce géant démocratique capable de résister aux assauts du monde entier !"
 CZE_bend_the_bars: "$ITA_bend_the_bars$"
 CZE_bend_the_bars_desc: "$GER_european_confederation_desc$"
 CZE_reassure_the_army: "Rassurer l'armée"
 CZE_reassure_the_army_desc: "L'armée s'inquiète des récentes décisions et mesures gouvernementales. Allons les rassurer en leur confirmant notre engagement envers les troupes, et au diable ce qu'en dit le gouvernement."
 CZE_outreach_to_the_western_powers: "Approfondir les liens avec les puissances occidentales"
 CZE_outreach_to_the_western_powers_desc: "Les démocraties occidentales nous garantissent leur soutien, mais si nous voulons nous en assurer, nous ferions mieux de renforcer nos relations."
 CZE_demand_guarantees: "Exiger des garanties plus durables"
 CZE_demand_guarantees_desc: "Malgré nos multiples traités et alliances, nous devons nous assurer que nos partenaires ne nous laisseront pas tomber au moment fatidique. Des garanties ne suffisent pas : il nous faut plus."
 CZE_guardian_of_central_europe: "Le rempart de l'Europe centrale"
 CZE_guardian_of_central_europe_desc: "Nous sommes désormais en mesure de sauvegarder la démocratie en Europe centrale. Nous serons les gardiens des nations les plus faibles face aux menaces du fascisme et du communisme."
 CZE_central_european_faction: "Les suzerains d'Europe centrale"
 CZE_central_european_faction_desc: "Malgré notre désir de nous éloigner de la diplomatie en renforçant notre nation, tâchons de ne pas outrepasser notre influence. En revanche, tournons le regard vers nos voisins."
 CZE_strike_at_the_heart_of_bolshevism: "[THIS.GetAntiSovietFocusName]"
 CZE_strike_at_the_heart_of_bolshevism_1: "Frapper le cœur du bolchévisme"
 CZE_strike_at_the_heart_of_bolshevism_2: "Protéger le front est"
 CZE_strike_at_the_heart_of_bolshevism_desc: "L'expansion [SOV.GetDuDelaDelNP] [SOV.GetName] est une menace à l'Europe tout entière, mais aussi à notre nation. Nous devons ériger un rempart pour stopper sa progression."
 CZE_destroy_the_fascist_threats: "Neutraliser les menaces fascistes"
 CZE_destroy_the_fascist_threats_desc: "[CZE_get_fascist_threats_desc]"
 CZE_destroy_the_fascist_threats_desc_enemy_ger: "Ce n'est un secret pour personne, la plus grande menace à la paix européenne n'est autre que [GER.GetLeLaLNP] [GER.GetName]. Il faut stopper cette nation au plus vite, et si personne n'est prêt à s'y engager, nous le ferons."
 CZE_destroy_the_fascist_threats_desc_backup: "Il faut à tout prix empêcher nos voisins de poursuivre un idéal expansionniste, au risque que leur soif de conquête se retourne contre nous."
 CZE_peace_on_our_time: "Peace for Our Time"
 CZE_peace_on_our_time_desc: "Depuis toujours, nous sommes relégués au second plan de la scène européenne, mais aujourd'hui, les choses vont changer ! Nous avons les moyens de tenir tête aux plus grandes puissances et d'imposer à notre tour la guerre ou la paix."
 CZE_reach_out_for_military_assistance: "Demander un soutien militaire"
 CZE_free_tuka: "Libérer $CZE_vojtech_tuka$"
 CZE_free_tuka_desc: "$CZE_vojtech_tuka$ arrive au terme de sa peine de prison. Au lieu de trouver une excuse pour la prolonger, nous ferions mieux de le libérer afin qu'il vienne collaborer pour le gouvernement. Il vaut mieux qu'il travaille pour nous, et non contre nous."
 CZE_grow_the_anglo_czechoslovak_prague_credit_bank: "La banque anglo-tchécoslovaque"
 CZE_grow_the_anglo_czechoslovak_prague_credit_bank_desc: "La banque anglo-tchécoslovaque est l'un des moteurs principaux de notre industrie. Sans ses financements, nous n'aurions jamais pu développer notre commerce d'export tel qu'il est aujourd'hui. Nous pourrions développer davantage cette institution en fondant des filiales à New York et en renforçant notre amitié avec les [ENG.GetHabitants]. Ce serait aussi un moyen d'offrir [ENG.GetAuAlaAlNP] [ENG.GetName] la distinction d'avoir soutenu notre État."
 CZE_feeding_the_alligator: "Nourrir les crocodiles"
 CZE_feeding_the_alligator_desc: "Les objectifs fixés par [GER.GetLeLaLNP] [GER.GetName] sur les Sudètes menacent l'existence même de notre nation. Si nous cédons à [GER.GetSesLeursNP] demandes, nous aurons assurément la paix, n'est-ce pas ?"
 CZE_complete_capitulation: "Capitulation totale"
 CZE_complete_capitulation_desc: "Nous n'avons pas le choix : il faut capituler. La tempête à l'horizon s'annonce bien trop violente pour nous. Tentons de négocier un accord avec les [GER.GetHabitants] tant qu'il est encore temps. Nous arriverons peut-être à conserver une once d'autonomie sous leur coupe."
 CZE_stabilize_the_protectorate: "Stabiliser le protectorat"
 CZE_stabilize_the_protectorate_desc: "Notre protectorat est plongé dans un véritable chaos. Mettons tout en œuvre pour convaincre nos concitoyens que nous sommes restés un gouvernement décisionnel capable d'assurer les besoins de ses administrés."
 CZE_stabilize_the_protectorate_unretire_henlein_tt: "Rappelle au devoir §Y$CZE_konrad_henlein$§! [ROOT.GetAuEnANP] §Y[ROOT.GetName]§!"
 CZE_full_faith_in_hacha: "Confiance aveugle en Hácha"
 CZE_full_faith_in_hacha_desc: "$CZE_emil_hacha$ est bien plus populaire et respecté aux yeux de notre population qu'$CZE_emanuel_moravec$. Son travail laisse peut-être à désirer, mais il est une véritable vedette."
 CZE_moravecs_bohemia: "La Bohême de Moravec"
 CZE_moravecs_bohemia_desc: "On raconte qu'$CZE_emil_hacha$ cherche à discréditer notre nouveau gouvernement. Si nous souhaitons un jour nous développer, nous devons trouver un dirigeant plus en accord avec l'idéologie de nos suzerains."
 CZE_form_the_government_army: "Former l'Armée gouvernementale"
 CZE_form_the_government_army_desc: "Mettons toutes les chances de réussite nationale de notre côté en érigeant une nouvelle armée libérée des défauts de son ancêtre, et trouvons un dirigeant en accord avec les idées du gouvernement."
 CZE_forced_administration_of_companies: "Administration obligatoire des sociétés"
 CZE_forced_administration_of_companies_desc: "À cause d'omissions flagrantes, certaines sociétés ne sont toujours pas sous notre contrôle. Il est temps de les contraindre à suivre le mouvement."
 CZE_revisit_custom_union_talks: "Revoir l'union douanière"
 CZE_revisit_custom_union_talks_desc: "Lors de l'établissement de l'union douanière, certaines négociations se sont déroulées à merveille, tandis que d'autres ont tourné au vinaigre. Nous ferions bien de reprendre ces négociations ratées afin de renforcer l'union."
 CZE_revisit_custom_union_talks_tt: "Nous pourrons convaincre cette nation de nous rejoindre §Yautrement§!"
 CZE_revisit_custom_union_talks_2_tt: "Ce pays sera beaucoup plus enclin à rejoindre notre fédération"
 CZE_reintegrate_cross_border_rail_connections: "Améliorer les correspondances ferroviaires internationales"
 CZE_reintegrate_cross_border_rail_connections_desc: "Un réseau ferré interconnecté de qualité est un moyen avéré de resserrer les liens avec nos voisins, surtout si nous comptons par la suite établir un partenariat économique."
 CZE_reintegrate_cross_border_rail_connections_flag: "Correspondances ferroviaires internationales rénovées"
 CZE_vonapo_20: "VONAPO 20"
 CZE_vonapo_20_desc: "Nous ne sommes pas les seuls à remarquer la menace grandissante que représent[GER.GetEEntNP] [GER.GetLeLaLNP] [GER.GetName]. C'est pourquoi nous avons signé une coopération avec les [SOV.GetHabitants] pour collecter des renseignements afin de mieux contrecarrer les agissements [GER.GetAdjMP]."
 CZE_increase_funding_from_moscow: "Obtenir plus de fonds de [SOV.capital.GetCapitalVictoryPointName]"
 CZE_increase_funding_from_moscow_desc: "Le parti [ROOT.GetCommunistParty] possède si peu de moyens qu'il paie le loyer de son Q.G. avec les salaires des représentants. Si nous voulons nous développer, propager notre idéologie et nos pamphlets, et recruter de nouveaux membres, il nous faut plus de fonds."
 CZE_zdenek_fierlinger_tt: "Nommer §Y$CZE_zdenek_fierlinger$§! conseiller"
 CZE_expand_the_communist_press: "Agrandir les presses communistes"
 CZE_expand_the_communist_press_desc: "Notre journal, le Rudé právo, a pour vocation d'informer la population qui ne lit pas les journaux ordinaires. Pour accomplir son devoir, il lui faut juste un petit coup de pouce financier."
 CZE_anti_rearmament_propaganda: "Propagande anti-réarmement"
 CZE_anti_rearmament_propaganda_desc: "La chute du gouvernement fasciste [GER.GetAdjMS], notre principal adversaire, prouve bien que nous avions raison de lutter contre la remilitarisation débridée."
 CZE_anti_democratic_propaganda: "Propagande antidémocratique"
 CZE_anti_democratic_propaganda_desc: "Solliciter le soutien autour de notre parti passe d'abord par l'énumération de tous les défauts des précédents gouvernements de la République avant de prouver comment nous pouvons faire mieux."
 CZE_form_workers_brigades: "Former la milice prolétaire"
 CZE_form_workers_brigades_desc: "Les ouvriers que nous libérons doivent également se préparer à se défendre. Ce ne sont pas des soldats de métier, mais ils sont assez expérimentés dans leur domaine pour rejoindre nos rangs comme spécialistes."
 CZE_kohler_faction: "La faction Köhler"
 CZE_kohler_faction_desc: "La faction de Bruno Köhler cherche à destituer la classe bourgeoise afin de former un État tchécoslovaque communiste et prospère."
 CZE_gottwald_faction: "La faction Gottwald"
 CZE_gottwald_faction_desc: "D'une loyauté moscovite à toute épreuve, la faction Staliniste de Klement Gottwald cherche à modeler l'État tchécoslovaque à l'image de l'URSS."
 CZE_zapotocky_faction: "La faction Zápotocký"
 CZE_zapotocky_faction_desc: "Bohumir Šmeral et Antonin Zápotocký, les fondateurs originels du parti communiste, envisageaient une ligne idéologique bien plus modérée que celle imposée par Klement Gottwald. Retrouvons ces idéaux fondamentaux qui seront certainement bien plus populaires auprès des [CZE.GetHabitants]."
 CZE_ally_with_moderate_socialists: "Coopérer avec les socialistes modérés"
 CZE_ally_with_moderate_socialists_desc: "Certains pays sont diamétralement opposés à [SOV.GetLeader], et le parti communiste local peine à convaincre aux urnes. La coopération avec des partis plus modérés pourrait être la clé d'une popularité retrouvée."
 CZE_democracies_willing_to_join_faction_tt: "§YDes nations démocratiques seront plus favorables à rejoindre notre faction communiste§!"
 CZE_limited_cooperation: "Coopération limitée avec [SOV.GetLeader]"
 CZE_limited_cooperation_desc: "Malgré nos oppositions idéologiques et les critiques qui nous sont adressées dans leurs journaux, [SOV.GetLeLaLNP] [SOV.GetName] et [SOV.GetSonLeurNP] peuple savent que nous sommes un partenaire commercial à ne pas négliger."
 CZE_denounce_stalinism: "Dénoncer le Stalinisme"
 CZE_denounce_stalinism_desc: "La réputation du communisme demeurera pour toujours entachée par les injustices commises par Staline. Il est de notre devoir de libérer les peuples opprimés par ce genre de régimes."
 CZE_country_leader_has_ideology_stalinism_tt: "Le dirigeant du pays prône l'idéologie : §Y$stalinism$§!"
 CZE_cooperate_with_tito: "Coopérer avec Tito"
 CZE_cooperate_with_tito_desc: "[YUG.GetLeLaLNPCap] [YUG.GetName] tent[YUG.GetEEntNP] d'appliquer une version pragmatique du communisme, tout comme nous, afin d'unir plusieurs populations sous la bannière rouge. Nous devrions coopérer face à de tels défis, aussi bien sur le plan militaire que politique."
 CZE_reduce_divided_nation_cost_tt: "Réduit le coût et la durée de la majorité des décisions d'§YUne nation divisée§!"
 CZE_balkan_union: "Agrandir l'union"
 CZE_balkan_union_desc: "Même si la majorité des nations de la région ont adopté le communisme, nous ne pouvons pas nous protéger contre les grandes puissances sans former une coopération solide. Créons une union pour rester forts face aux menaces."
 CZE_cooperation_with_the_ussr: "Coopérer avec [SOV.GetLeader]"
 CZE_cooperation_with_the_ussr_desc: "Notre parti est conscient des nombreux défauts que présente le système de collectivisation [SOV.GetDuDelaDelNP] [SOV.GetName], même ses plus grands défenseurs. Quand bien même, amorcer une coopération nous permettrait d'analyser précisément où se sont produits les manquements et les réussites afin de produire une version améliorée pour [ROOT.GetLeLaLNP] [ROOT.GetName]."
 CZE_exchange_military_expertise: "Partager l'expertise militaire"
 CZE_exchange_military_expertise_desc: "À l'instar de toutes les autres puissances dotées d'une grande armée, [SOV.GetLeLaLNPCap] [SOV.GetName] [SOV.GetEstSontNP] rompu[SOV.GetXENP] à de nombreuses stratégies et tactiques diverses. Nous devrions proposer un partage de connaissances pour renforcer davantage nos nations."
 CZE_pressure_romania: "Faire pression sur [ROM.GetLeLaLNP] [ROM.GetName]"
 CZE_pressure_romania_desc: "[ROM.GetLeLaLNPCap] [ROM.GetName] pourrai[ROM.GetTEntNP] poser un sérieux problème si [ROM.GetSonLeurNP] gouvernement venait à s'aligner sur les idéaux de nos ennemis. Il pourrait nuire à nos rapports avec [SOV.GetLeLaLNP] [SOV.GetName], ou fournir du pétrole à nos adversaires. Nous pourrions le contraindre à s'aligner sur notre idéologie en fronçant un peu les sourcils."
 CZE_facility_in_state_tt: "S'il n'y a aucun autre §Ybâtiment d'expérimentation§! à $STATE|Y$, nous obtenons §G1§! $FACILITY_TYPE|Y$ à $STATE|Y$"
 CZE_spread_the_revolution: "Propager la Révolution"
 CZE_spread_the_revolution_desc: "Maintenant que la révolution [ROOT.GetAdjFS] est couronnée de succès, nous devons encourager les prolétaires du monde entier à se battre pour leur liberté. Nous pouvons d'ailleurs les soutenir dans leur lutte."
 CZE_agrarian_reform: "Rétablir l'office des terres"
 CZE_agrarian_reform_desc: "Récemment fermé, l'office des terres était chargé de répartir principalement les terres agricoles. Réformons cette institution drastiquement."
 CZE_realign_the_church: "Athéisme d'État"
 CZE_realign_the_church_desc: "La religion divise depuis trop longtemps le peuple [CZE.GetAdjMS]. Chassons son influence néfaste des questions gouvernementales, comme l'éducation et la politique, et repartons sur des bases saines pour bâtir notre société."
 CZE_create_a_secret_police_branch: "Créer une police secrète"
 CZE_create_a_secret_police_branch_desc: "La stabilité est assurée en repoussant les menaces extérieures, mais aussi et surtout intérieures. La population mettra du temps à s'habituer à ce nouveau système encore très récent, mais il est indispensable."
 CZE_promote_urbanization: "$ARG_promote_urbanization$"
 CZE_promote_urbanization_desc: "Maintenant que les fermes communales sont sur pied, il ne reste plus qu'à lancer des campagnes pour attirer la population rurale aux villes et y accroître la productivité."
 CZE_confiscate_church_lands: "Confisquer les propriétés de l'Église"
 CZE_confiscate_church_lands_desc: "L'Église possède bien trop de terres et de capital pour son rôle. Redistribuons ses propriétés pour le bien de la nation, comme celles des agriculteurs."
 CZE_change_the_narrative: "Réécrire l'histoire"
 CZE_change_the_narrative_desc: "L'Église ne s'est jamais exprimée en faveur de notre révolution, mais faire en sorte qu'elle nous soutienne aujourd'hui nous aiderait beaucoup à bâtir la confiance nécessaire au nouveau régime."
 CZE_the_second_fortification_program: "Lancer le second programme de fortification"
 CZE_the_second_fortification_program_desc: "Le premier programme a permis, avant tout, de jeter les bases des défenses futures qui devront suivre rapidement. Nous allons lancer au plus vite le second programme et développer davantage les lignes de fortifications ; il en va de la sécurité nationale."
 CZE_redirect_the_fortification_councils_funds: "Réorienter le budget du Conseil des fortifications"
 CZE_redirect_the_fortification_councils_funds_desc: "Ces programmes de fortifications impactent lourdement notre budget. Les sommes colossales investies pourraient servir à financer d'autres programmes. Et puis, l'armée a déjà bien assez de défenses comme ça."
 CZE_jachymov_uranium_mine: "Mines d'uranium de Jáchymov"
 CZE_jachymov_uranium_mine_desc: "Les mines de Jáchymov produisent depuis longtemps de l'uranium et d'autres minerais. Jusqu'alors, l'uranium présentait peu d'intérêt, mais aujourd'hui, avec les percées dans le domaine de la physique, tout a changé."
 CZE_skoda_internal_competition: "Encourager la concurrence interne"
 CZE_skoda_internal_competition_desc: "Il peut s'avérer difficile de motiver durablement le personnel d'une entreprise aussi vaste que Škoda. Lancer une concurrence interne aidera à stimuler les performances des employés sur tous nos sites."
 CZE_skoda_max_optimization_tt: "Le palier d'optimisation maximal pour la §Ypriorité de Škoda§! passera à 7"
 CZE_skoda_increase_cooperation: "Renforcer la coopération chez Škoda"
 CZE_skoda_increase_cooperation_desc: "Dans le but d'optimiser nos performances, nous devons ouvrir la coopération interusine. Nous pourrons également proposer le partage d'expertise pour encore plus d'efficacité."
 CZE_skoda_fast_optimization_tt: "Taux auquel le £GFX_prod_eff_cap palier d'optimisation de la §Ypriorité de Škoda§! augmente au fil du temps jusqu'au palier maximum : §G+100%§!"
 CZE_master_of_armaments: "Maîtres de l'armement"
 CZE_master_of_armaments_desc: "Les usines Škoda représentent le plus grand fabricant d'armes de notre pays depuis l'époque de l'Empire austro-hongrois. Leur expertise et leur maîtrise font d'eux un conglomérat industriel hors pair. Elles sont sans conteste les maîtres de l'armement."
 CZE_only_the_best_is_good_enough: "Le meilleur, tout simplement"
 CZE_only_the_best_is_good_enough_desc: "Les usines Škoda ont toujours privilégié le labeur et l'innovation. Comme le résume si bien le slogan de nos fondateurs : « Pour nos clients, le meilleur, tout simplement ». Tâchons de faire honneur à ces paroles dans cette époque charnière."
 CZE_an_industrial_legacy: "L'héritage industriel"
 CZE_an_industrial_legacy_desc: "Maintenant que l'industrie nationale atteint des sommets jusqu'alors impensables, nous pouvons honorer notre héritage industriel. Désormais, nous sommes une puissance industrielle sans pareil."
 CZE_powerhouse_of_europe: "Le moteur européen"
 CZE_powerhouse_of_europe_desc: "Le monde entier nous envie nos capacités industrielles. Faisons en sorte que notre secteur énergétique soit assez efficace pour les satisfaire."
 CZE_supply_fighters_for_allies: "Fournir des chasseurs aux alliés"
 CZE_supply_fighters_for_allies_desc: "Les [FRA.GetHabitants] et les [ENG.GetHabitants] craignent que les avions [GER.GetAdjMP] viennent à bout de leurs défenses en un clin d'œil et ravagent leurs agglomérations rapidement. Venons renforcer leur force aérienne avec quelques appareils bien pensés pour chasser leurs soucis et conserver leur ciel dénué de tout avion [GER.GetAdjMS]."
 CZE_allies_more_likely_to_defend_us_tt: "§YLes Alliés seront plus susceptibles de nous soutenir contre l'expansionnisme allemand envers les Sudètes.§!"
 CZE_allies_more_likely_to_defend_us_2_tt: "§YLes Alliés seront bien plus susceptibles de nous soutenir contre l'expansionnisme allemand envers les Sudètes.§!"
 CZE_allies_more_likely_to_defend_us_3_tt: "§YLes Alliés seront un peu plus susceptibles de nous soutenir contre l'expansionnisme allemand envers les Sudètes.§!"
 CZE_establish_the_state_defense_guard: "Fonder la garde de défense d'État"
 CZE_german_nonagressionpact: "Le pacte Haushofer-Krofta"
 CZE_german_nonagressionpact_desc: "Alors que les négociations pour un pacte de non-agression avec [GER.GetLeLaLNP] [GER.GetName] allaient bon train, les prémices d'une instabilité [SOV.GetAdjFS] et de nouveaux plans d'expansionnisme ont stoppé net les discussions. [GER.GetLeLaLNPCap] [GER.GetName] [GER.GetEstSontNP] occupé[GER.GetXENP] sur un autre front, pourtant, nous devons conclure ces accords au plus vite !"
 CZE_revive_the_czechoslovak_legion_dynamic: "[CZE_revive_the_czechoslovak_legion]"
 CZE_revive_the_czechoslovak_legion_default: "Restaurer les légions tchécoslovaques"
 CZE_revive_the_czechoslovak_legion_communist: "Fonder un organisme de volontaires"
 CZE_revive_the_czechoslovak_legion_dynamic_desc: "Une fois de plus, le monde fait face à un grand chambardement ; les valeureux soldats [ROOT.GetDuDelaDelNP] [ROOT.GetName] sont prêts à défendre la patrie. Seulement, comme par le passé, la défense du territoire se fera à l'étranger. Il nous faut des guerriers prêts à quitter leur pays pour le protéger."
 CZE_revive_the_czechoslovak_legion_nsb_tt: "§Y$CZE_legacy_of_the_czechoslovak_legion_army_spirit$§! va passer d'§Yesprit militaire§! à §Yesprit national§!"
 CZE_state_sponsored_recruitment_for_spain: "Recrutements pour l'Espagne approuvés par l'État"
 CZE_state_sponsored_recruitment_for_spain_desc: "Encourageons les braves volontaires [ROOT.GetAdjMP] à quitter la patrie pour soutenir le camp qui correspond le mieux à notre idéologie. Leur intervention pourrait faire basculer l'issue de la guerre, et nous pourrions découvrir les dernières avancées en matière de conflit armé."
 CZE_support_spain_reward_tt: "§YEffets si une faction espagnole soutenue par nos volontaires l'emporte ou perd :§!"
 CZE_profit_off_the_spanish_civil_war: "Tirer profit de la guerre civile espagnole"
 CZE_profit_off_the_spanish_civil_war_desc: "La guerre civile espagnole devient une guerre par procuration pour les grandes puissances. Il serait inconscient de mettre en danger nos troupes pour un conflit qui ne nous regarde pas. En revanche, c'est l'occasion idéale pour faire recette avec notre industrie de l'armement ; essayons de vendre des armes aux deux camps."
 CZE_skoda_sell_weapons_to_SPR_tt: "Donne accès aux décisions : §YVendre clandestinement des armes aux factions espagnoles§!"
 CZE_placate_benes_faction: "Céder à la faction de Beneš"
 CZE_placate_benes_faction_desc: "$CZE_milan_hodza$ doit se rendre à l'évidence : son mandat de ministre des Affaires étrangères a tourné au fiasco. $CZE_edvard_benesh$ se tient prêt à intervenir avec ses soutiens du monde agraire pour promouvoir $CZE_milan_hodza$ au poste de Premier ministre, à condition qu'il accepte d'abandonner celui des Affaires étrangères."
 CZE_claim_lands_of_the_bohemian_crown: "Revendiquer les terres de la couronne de Bohême"
 CZE_claim_lands_of_the_bohemian_crown_desc: "Notre nation a côtoyé au fil des siècles de nombreux empires. Nos frontières ont été repoussées et avancées au fil des conflits, jamais au gré de nos citoyens. Aujourd'hui, nous remédions à cette injustice."
 CZE_demand_katowice: "Exiger [762.GetName]"
 CZE_demand_katowice_desc: "Obtenir [762.GetName] signifierait, en plus de la restauration de nos frontières originelles, la révocation des revendications [POL.GetAdjFP] envers la [72.GetName]."
 CZE_fight_over_silesia: "La lutte pour la Silésie"
 CZE_fight_over_silesia_desc: "Même si la Silésie nous revient de droit, mieux vaut éviter une guerre ouverte contre [66.owner.GetLeLaLNP] [66.owner.GetNameDef]. Nous allons plutôt exhiber notre puissance durant une impressionnante escarmouche à la frontière ; nous pourrons peut-être ainsi obtenir le territoire sans grandes pertes."
 CZE_dismantle_poland: "Démanteler [POL.GetLeLaLNP] [POL.GetNonIdeologyName]"
 CZE_dismantle_poland_desc: "Le pot aux roses a été découvert : [POL.GetLeLaLNP] [POL.GetName] [POL.GetEstSontNP] incapable[POL.GetXSNP] de défendre qui que ce soit, pas même [POL.GetSonLeurNP] propre territoire. Agissons avant qu'il ne soit trop tard."
 CZE_proclaim_the_restoration_of_bohemia: "Proclamer la restauration du Royaume de Bohême"
 CZE_proclaim_the_restoration_of_bohemia_desc: "Maintenant que nos frontières originelles nous appartiennent de nouveau, célébrons notre héritage et intégrons nos terres au royaume !"
 CZE_integrate_lost_territories: "Intégrer les territoires perdus"
 CZE_integrate_lost_territories_desc: "Les terres historiques du Royaume de Bohême s'étendaient autrefois de la mer Baltique jusqu'à l'Adriatique. Revivons la belle époque en intégrant nos nouveaux territoires."
 CZE_deepen_ties_with_puppet_kingdoms: "Renforcer les liens avec les royaumes fantoches"
 CZE_deepen_ties_with_puppet_kingdoms_desc: "Rien ne nous empêche d'élargir davantage notre imposante sphère d'influence, surtout si nous cherchons à tirer profit de ces nations qui partagent les mêmes idéaux."
 CZE_poland_alliance_monarchist: "Accord avec les [POL.GetHabitants]"
 CZE_poland_alliance_monarchist_desc: "$CZE_ally_poland_desc$"
 CZE_a_strong_poland: "Une puissance [POL.GetAdjFS] incoercible"
 CZE_a_strong_poland_desc: "Avec l'une des armées les plus puissantes d'Europe de l'Est, [POL.GetLeLaLNP] [POL.GetName] se présent[POL.GetEEntNP] comme un allié potentiel de choix."
 CZE_mend_balkan_relations: "Améliorer les relations dans les Balkans"
 CZE_facilitate_a_strong_hungary: "S'allier [HUN.GetAuAlaAlNP] [HUN.GetName]"
 CZE_facilitate_a_strong_hungary_desc: "Depuis son indépendance, nous entretenons des rapports tendus avec [HUN.GetLeLaLNP] [HUN.GetName]. À l'annonce d'un conflit imminent sur le continent, nous devrions tenter de rallier ce pays à notre camp."
 CZE_subjegate_romania: "Faire pression sur [ROM.GetLeLaLNP] [ROM.GetName] avec les revendications [HUN.GetAdjFP]"
 CZE_subjegate_romania_desc: "Les revendications formulées par notre fantoche [HUN.GetAdjMS] pourraient jouer en notre faveur face aux [ROM.GetHabitants]. Laissons entendre que nous n'avons nullement l'intention de stopper [HUN.GetLeLaLNP] [HUN.GetName] de partir à la conquête de ces territoires ; [ROM.GetLeLaLNP] [ROM.GetName] accepter[ROM.GetAOntNP] à coup sûr de rejoindre notre camp."
 CZE_demanded_overlordship_HUN: "Hongrie assujettie"
 CZE_demanded_overlordship_ROM: "Roumanie assujettie"
 CZE_integrate_hungary: "Intégrer les anciens territoires de l'Autriche"
 CZE_integrate_hungary_desc: "Avec notre sphère d'influence imposante, l'intégration d'un pays aussi puissant que [HUN.GetLeLaLNP] [HUN.GetName], ainsi que d'autres territoires, nous permettrait de restaurer les frontières de l'Empire austro-hongrois, mais cette fois avec [ROOT.GetLeLaLNP] [ROOT.GetName] à sa tête."
 CZE_subjegate_serbia: "Assujettir [YUG.GetLeLaLNP] [YUG.GetName]"
 CZE_subjegate_serbia_desc: "[YUG.GetLeLaLNPCap] [YUG.GetName] [YUG.GetNestNesontNP] plus que l'ombre de ce qu'[YUG.GetIlElleNP] étai[YUG.GetTEntNP]. Ce pays n'est plus un État tampon capable de défendre notre frontière sud. Après l'intégration de la Slovénie, il est temps de penser à intégrer cette nation."
 CZE_strike_the_eastern_threat: "Neutraliser la menace de l'Est"
 CZE_strike_the_eastern_threat_desc: "Ces hypocrites de [SOV.GetHabitants] justifient leurs ambitions impériales en ridiculisant notre gouvernement. Cette nation est une menace existentielle pour [CZE.GetLeLaLNP] [CZE.GetName] qui doit être éradiquée."
 CZE_assist_austria: "Protéger [AUS.GetLeLaLNP] [AUS.GetName]"
 CZE_assist_austria_desc: "Notre sécurité nationale repose sur la neutralité [AUS.GetDuDelaDelNP] [AUS.GetName] face aux conflits actuels. La frontière que nous partageons avec ce pays est la plus vulnérable de toutes, et son économie serait un atout majeur pour l'ennemi qui s'en emparerait. Il ne faut pas que ça se produise !"
 CZE_return_to_democracy: "Restaurer la démocratie"
 CZE_return_to_democracy_desc: "Maintenant que notre territoire est protégé, la population se rend compte qu'une dictature militaire n'apporte rien à notre développement. Il est temps d'organiser des élections pour rendre le pouvoir à une administration civile et démocratique."
 CZE_cooperate_with_the_allies: "Coopérer avec les Alliés"
 CZE_cooperate_with_the_allies_desc: "La stabilité regagne peu à peu la région. C'est le moment idéal pour renouer avec nos alliés de l'époque."
 CZE_eliminate_austrian_defeatists: "Vaincre les défaitistes [AUS.GetAdjMP]"
 CZE_eliminate_austrian_defeatists_desc: "[AUS.GetLeLaLNPCap] [AUS.GetName] n'[AUS.GetAOntNP] plus ni la volonté ni la force de défendre la nation. Il faut intervenir au plus vite avant que nos ennemis en profitent."
 CZE_the_legacy_of_ottokar: "L'héritage d'Ottokar"
 CZE_the_legacy_of_ottokar_desc: "Le fameux roi Ottokar II a développé le royaume de Bohême de l'Autriche jusqu'à l'Adriatique grâce à l'approbation des nobles autrichiens. Faisons une fois de plus appel à ce peuple, nobles et prolétaires, pour bâtir un empire."
 CZE_demand_the_istrian_peninsula: "Exiger la baie d'Istrie"
 CZE_demand_the_istrian_peninsula_desc: "L'enclave terrestre [ROOT.GetDuDelaDelNP] [ROOT.GetName] entrave notre commerce et notre influence. Refusons de soumettre notre économie aux caprices des nations voisines et demandons plutôt un accès direct à la mer Adriatique."
 CZE_demand_slovenia: "Exiger la Slovénie"
 CZE_demand_slovenia_desc: "La Slovénie était autrefois l'une des régions principales de l'Empire autrichien. Étant donné que ce dernier nous appartient, il n'est que naturel de reconquérir ces terres une fois de plus."
 CZE_demand_overlordship_of_yugoslav_league: "Exiger le contrôle de la ligue [YUG.GetDuDelaDelNP] [YUG.GetName]"
 CZE_demand_overlordship_of_yugoslav_league_desc: "Une certaine autonomie à l'échelle locale est parfois nécessaire dans une nation pluriethnique, mais [YUG.GetLeLaLNP] [YUG.GetName] doi[YUG.GetTVentNP] se rendre à l'évidence : [YUG.GetSonLeurNP] alliance n'est plus capable de se défendre. Il faut nous laisser intervenir."
 CZE_expand_the_rome_protocols: "Étendre les protocoles de Rome"
 CZE_expand_the_rome_protocols_desc: "Notre nouveau gouvernement trouve davantage de similitudes avec le gouvernement de [ITA.capital.GetCapitalVictoryPointName] que celui de [GER.capital.GetCapitalVictoryPointName]. L'Autriche étant un point de contention majeur entre les deux, nous devrions rejoindre les protocoles de Rome afin de prouver [ITA.GetAuAlaAlNP] [ITA.GetName] qu'une alliance avec les [GER.GetHabitants] serait inutile."
 CZE_prague_protocols: "Les protocoles de Prague"
 CZE_soviet_alliance: "Étendre le traité de l'alliance de 1935"
 CZE_soviet_alliance_desc: "Le traité en vigueur signé avec [SOV.GetLeLaLNP] [SOV.GetName] présente trop d'ambiguïtés qui ne garantissent pas [SOV.GetSonLeurNP] intervention en cas d'attaque. Contactons-les pour revoir l'accord et garantir pour de bon notre sécurité."
 CZE_airlift_soviet_support: "Soutien aéroporté [SOV.GetAdjMS]"
 CZE_airlift_soviet_support_desc: "Le manque de frontières partagées avec nos alliés [SOV.GetDuDelaDelNP] [SOV.GetName] nous a poussés à l'innovation : nous allons acheminer des troupes [SOV.GetAdjFP] par voie aérienne. C'est une opération de transport d'envergure inédite, mais c'est aussi un moyen ingénieux d'éviter toute intrusion sur le territoire d'un pays voisin."
 CZE_unlocks_volunteer_transport_raid_tt: "Donne accès au §Yraid§! :\nRelais aérien des volontaires soviétiques en §Y[73.GetName]§!"
 CZE_intervene_in_the_ussr: "Intervenir dans la guerre civile [SOV.GetAdjFS]"
 CZE_intervene_in_the_ussr_desc: "Une fois encore, l'agitation gagne [SOV.GetLeLaLNP] [SOV.GetName]. La famille royale, que nous soutenions par le passé, est partie pour de bon, ce qui présage de grandes choses pour l'avènement d'un gouvernement plus ouvert à nos idéaux."
 CZE_forgive_trading_debts: "Annuler les dettes"
 CZE_forgive_trading_debts_desc: "L'instabilité économique et la Grande Dépression ont criblé certains de nos alliés de dettes colossales à notre égard qu'ils peinent à rembourser, entachant par la même occasion nos relations. Le gouvernement pourrait fermer les yeux sur ces sommes dues et compenser les entreprises créditrices pour satisfaire tout le monde."
 CZE_improve_balkan_trade_relations: "Améliorer les relations commerciales avec les Balkans"
 CZE_improve_balkan_trade_relations_desc: "Notre plus grand atout pour trouver des alliés dans les Balkans reste notre économie. Prouvons-leur notre bonne foi en dépensant des ressources pour resserrer les liens entre nos nations."
 CZE_ally_austria: "S'allier [AUS.GetAuAlaAlNP] [AUS.GetName]"
 CZE_ally_austria_desc: "Le gouvernement [AUS.GetAdjMS] devrait considérer un partenariat avec notre nation, surtout depuis qu'il a failli être détourné par ces misérables nazis il y a quelques années."
 CZE_demand_the_czech_corridor: "Exiger le corridor tchèque"
 CZE_demand_the_czech_corridor_desc: "À l'heure où la Petite Entente se transforme en une véritable alliance, il nous faut songer au déploiement des troupes entre nous et nos alliés, une opération complexe et risquée en temps de guerre. Remettons sur la table l'idée d'un territoire reliant nos frontières avec celles [YUG.GetDuDelaDelNP] [YUG.GetName], comme au sortir de la Grande Guerre, afin de sécuriser notre souveraineté et notre commerce."
 CZE_ally_hungary: "S'allier [HUN.GetAuAlaAlNP] [HUN.GetName]"
 CZE_ally_hungary_desc: "Malgré les conflits qui nous opposent depuis notre indépendance, la [HUN.GetNonIdeologyName] et nous, nous devrions en faire des alliés de choix."
 CZE_ally_yugoslavia: "S'allier [YUG.GetAuAlaAlNP] [YUG.GetName]"
 CZE_ally_yugoslavia_desc: "Les [YUG.GetHabitants] peinent à redresser leur économie ces derniers temps, mais leurs ressources et leur emplacement stratégiques ne sont pas à délaisser."
 CZE_protect_neutrality: "Préserver la neutralité"
 CZE_protect_neutrality_desc: "Si la Première Guerre mondiale a bien prouvé une chose, c'est que la neutralité ne peut pas sauver une nation prise pour cible. En revanche, si nous protégeons ces pays neutres, nous forçons l'ennemi à se battre sur deux fronts au lieu de poursuivre la tactique du diviser pour mieux régner."
 CZE_if_cooperate_with_moderate_socialists_completed_tt: "Effets si la priorité §YCoopérer avec les socialistes modérés§! est atteinte :"
 CZE_mutual_protection_agreement_with_switzerland: "Accord de protection avec [SWI.GetLeLaLNP] [SWI.GetNonIdeologyName]"
 CZE_mutual_protection_agreement_with_switzerland_desc: "Nous travaillons de concert avec [SWI.GetLeLaLNP] [SWI.GetName] pour empêcher toute invasion de nos territoires sans infliger une perte conséquente à nos ennemis. Notre coopération va permettre non seulement de former une armée capable de nous défendre, mais également capable de riposter."
 CZE_exchange_technology: "Recherches conjointes"
 CZE_exchange_technology_desc: "Malgré une abondance de ressources naturelles, les Balkans ne possèdent pas de colonies rentables ou d'industrie à la pointe, comme les grandes puissances. C'est pourquoi nous proposons une collaboration scientifique."
 CZE_demand_corridor_to_ussr: "Exiger une voie vers [SOV.GetLeLaLNP] [SOV.GetName]"
 CZE_demand_corridor_to_ussr_desc: "Si [POL.GetLeLaLNP] [POL.GetName] refus[POL.GetEEntNP] de coopérer, nous allons devoir employer la manière forte pour nous octroyer cette voie vers les [SOV.GetHabitants]."
 CZE_ally_poland: "S'allier [POL.GetAuAlaAlNP] [POL.GetName]"
 CZE_ally_poland_desc: "La guerre soviéto-polonaise résonne encore dans les esprits, et la menace de l'ouest grandit de jour en jour ; c'est pour ces raisons que [POL.GetLeLaLNP] [POL.GetName] cherch[POL.GetEEntNP], comme nous, à assurer [POL.GetSaLeurNP] sécurité. Il faut convaincre cette nation que la neutralité ne les protègera pas, mais qu'une alliance avec nous le pourrait."
 CZE_realize_the_polish_czechoslovak_confederation: "Fonder une confédération"
 CZE_realize_the_polish_czechoslovak_confederation_desc: "Malgré tous [POL.GetSesLeursNP] efforts, [POL.GetLeLaLNP] [POL.GetName] [POL.GetAOntNP] été vaincue. Alors que [POL.GetSonLeurNP] gouvernement est en exil, nous avons pensé à former une union avec lui ; en l'associant au nôtre, nous offrirons un nouvel espoir au peuple [POL.GetAdjMS] de libérer notre patrie."
 CZE_integrate_western_ukrainians: "Intégrer les Ukrainiens occidentaux"
 CZE_integrate_western_ukrainians_desc: "Les Ukrainiens [CZE.GetDuDelaDelNP] [CZE.GetName] ont eu le droit à de nombreuses aides et une autonomie confortable. Peut-être est-il temps d'intégrer nos nouvelles conquêtes à la province ukrainienne ?"
 CZE_ally_russia: "S'allier [SOV.GetAuAlaAlNP] [SOV.GetNonIdeologyName]"
 CZE_ally_russia_desc: "Le nouveau gouvernement [SOV.GetAdjMS] partage les mêmes idéaux que nous, alors pourquoi ne pas revoir l'accord bancal que nous avions signé avec les instances dirigeantes précédentes ?"
 CZE_claim_ukraine: "Fonder le gouvernement allié d'Ukraine"
 CZE_claim_ukraine_desc: "L'Ukraine fait partie intégrante [SOV.GetDuDelaDelNP] [SOV.GetName]. Emparons-nous de ce territoire afin qu'il agisse comme État tampon."
 CZE_strengthen_the_little_entente: "Formaliser la Petite Entente"
 CZE_strengthen_the_little_entente_desc: "Même si son but premier consiste à serrer la bride [HUN.GetAuAlaAlNP] [HUN.GetName], la Petite Entente pourrait très bien constituer une alliance sérieuse dotée d'une armée considérable."
 CZE_seek_french_leadership: "Solliciter la gouvernance [FRA.GetAdjFS]"
 CZE_seek_french_leadership_desc: "[FRA.GetLeLaLNPCap] [FRA.GetName] [FRA.GetAOntNP] le potentiel pour être un atout formidable à notre alliance, même si nous devons en céder la gouvernance."
 CZE_increase_food_and_resource_imports: "Accroître les importations de ressources et alimentaires"
 CZE_increase_food_and_resource_imports_desc: "Nos nouveaux alliés possèdent une imposante industrie agraire, ce qui allège la pression de la production sur la nôtre. Nous pouvons importer des ressources à moindres frais tout en faisant fructifier leur économie."
 CZE_double_down_on_heavy_industry: "Renforcer l'industrie lourde"
 CZE_double_down_on_heavy_industry_desc: "Les derniers accords signés avec nos alliés vont ouvrir la voie à nos industries les plus compétitives, comme celle de l'armement. Nous pourrons même vendre notre surproduction."
 CZE_neutralize_the_hungarian_threat: "Neutraliser la menace [HUN.GetAdjFS]"
 CZE_neutralize_the_hungarian_threat_desc: "[HUN.GetLeLaLNPCap] [HUN.GetName] [HUN.GetEstSontNP] un obstacle au commerce avec des alliés potentiels au sud. Si ce pays venait à se ranger du côté de nos ennemis, nous devrons revoir tous les plans de l'armée pour nous défendre, et ce malgré le traité de Trianon."
 CZE_cancel_anti_hungary_focus: "Marche arrière suite à l'intervention [GER.GetAdjFS]"
 CZE_ally_romania: "S'allier [ROM.GetAuAlaAlNP] [ROM.GetName]"
 CZE_ally_romania_desc: "[ROM.GetLeLaLNPCap] [ROM.GetName] [ROM.GetEstSontNP] l'une des nations les plus autosuffisantes de la région, qu'il s'agisse de nourriture ou même de pétrole. Ramenons-la dans notre camp, afin de faciliter l'échange de ressources, mais surtout pour éviter qu'elle ne tombe entre de mauvaises mains."
 CZE_divide_germany: "Diviser [GER.GetLeLaLNP] [GER.GetName]"
 CZE_divide_germany_desc: "Nous n'arriverons pas à contrer la menace [GER.GetAdjFS] seuls ; il nous faut des alliés tout aussi préoccupés par cet expansionnisme débridé et prêts à frapper les premiers."
 CZE_if_FRA_ally_tt: "Effets si la §YFrance est monarchiste§! et alignée à aucun camp :"
 CZE_if_POL_ally_tt: "Effets si la priorité §YUne puissance [POL.GetAdjFS] incoercible§! a été achevée avec l'obtention des garanties [POL.GetAdjFP] :"
 CZE_revolutionary_brigades: "Fonder les brigades révolutionnaires"
 CZE_revolutionary_brigades_desc: "Les révolutionnaires ayant acquis une expérience au combat en se battant pour [ROOT.GetLeLaLNP] [ROOT.GetName] devraient être intégrés à l'armée de métier."
 CZE_recruit_communist_exiles: "Recruter les communistes exilés"
 CZE_recruit_communist_exiles_desc: "[ROOT.capital.GetCapitalVictoryPointName] a toujours été un refuge pour les révolutionnaires en exil. Notre gouvernement pourrait mettre ces bonnes âmes à profit."
 CZE_destabilize_potential_adversaries: "Déstabiliser les ennemis potentiels"
 CZE_destabilize_potential_adversaries_desc: "Les communistes en exil qui ont rejoint notre combat connaissent bien mieux leur patrie que le plus expérimenté de nos espions. Tirons avantage de ces mines de renseignements pour mettre au point la libération de leur pays."
 CZE_nationalize_key_industries: "Nationaliser les banques et les mines"
 CZE_nationalize_key_industries_desc: "Les mines produisent les ressources nécessaires à nos industries pour fabriquer des armes de guerre. En ces temps incertains, il vaut mieux confier la gestion de ces ressources au gouvernement plutôt qu'aux financiers et aux industriels."
 CZE_rehabilitate_the_army: "Réhabiliter l'armée"
 CZE_rehabilitate_the_army_desc: "La majorité des généraux de l'armée [CZE.GetAdjFS] sont des vétérans des Légions tchécoslovaques, célèbre pour avoir combattu les Soviétiques durant la guerre civile. Tâchons de nous assurer qu'ils vouent tous une loyauté sans faille à notre nouveau gouvernement."
 CZE_unlock_civil_war_army_generals_tt: "Récupérer les commandants perdus durant la guerre civile"
 CZE_recruit_ideologically_aligned_generals: "Recruter des généraux fiables"
 CZE_recruit_ideologically_aligned_generals_desc: "Remanions nos programmes d'entraînement pour attirer de nouvelles recrues qui saisissent parfaitement les nouvelles valeurs de l'armée."
 CZE_recruit_communist_generic_general_tt: "Permet de recruter un général communiste"
 CZE_purge_two_random_commanders_tt: "Deux commandants aléatoires vont être limogés"
 CZE_czechoslovak_union: "L'Union tchécoslovaque"
 CZE_czechoslovak_union_desc: "Il faut renforcer l'autonomie locale [CZE.GetAuEnANP] [CZE.GetName], afin d'offrir au système communiste une plus grande marge de manœuvre."
 CZE_continue_industrial_relocation_schemes: "Poursuivre les projets de délocalisation de l'arsenal"
 CZE_continue_industrial_relocation_schemes_desc: "Au nom de la sécurité nationale, nous devons délocaliser la totalité de nos usines vulnérables vers des zones bien mieux protégées des attaques aériennes ou autres. Nous devons éviter la perte de nos industries capitales."
 CZE_continue_industrial_relocation_schemes_tt: "Retire §Y1 usine militaire§!"
 CZE_continue_industrial_relocation_schemes_2_tt: "§RLes usines vont devoir être reconstruites !§!"
 CZE_establish_a_armament_factory_in_uhersky_brod: "Fonder la Česká zbrojovka Uherský Brod"
 CZE_establish_a_armament_factory_in_uhersky_brod_desc: "L'usine Uherský Brod est une usine d'armement spécialisée dans la fabrication d'armes automatiques pour l'infanterie et l'aviation. Nous comptons en faire un des plus grands sites au monde."
 CZE_appeal_to_the_castle: "Séduire le château"
 CZE_appeal_to_the_castle_desc: "Le « Château » est le surnom donné au vaste réseau des plus influentes organisations de Tchécoslovaquie. Ce groupe de présidents exerce une influence remarquable qui dépasse leurs pouvoirs constitutionnels. Obtenir le soutien de ce conglomérat serait un tremplin formidable vers la tête du pays."
 CZE_petition_the_nobles: "Demander le soutien des nobles"
 CZE_petition_the_nobles_desc: "La classe noble [ROOT.GetAdjFS] ne possède plus de titres officiels, en revanche, elle a conservé son influence au sein de notre société. Leur soutien nous octroierait la légitimité et les ressources nécessaires pour atteindre nos objectifs."
 CZE_unify_the_fascist_parties: "Unifier les partis fascistes"
 CZE_unify_the_fascist_parties_desc: "Le visage du fascisme [ROOT.GetAdjMS] est morcelé, entaché par des partis d'un tel extrémisme qu'ils ne pourront jamais obtenir le moindre soutien. Au nom de la sûreté nationale, nous devons unifier ces partis et créer une vision du pays qui rassemblerait plus que les extrémistes."
 CZE_pro_rearmament_propaganda: "Propagande proréarmement"
 CZE_pro_rearmament_propaganda_desc: "L'idée d'un gouvernement centralisé doit être présentée en contraste à la situation mondiale extrêmement précaire. C'est le meilleur moyen de pousser la population à soutenir nos projets, notamment celui de renforcer l'armée au besoin."
 CZE_align_nationalist_parties: "S'aligner aux partis nationalistes [CZE.GetAdjMP]"
 CZE_align_nationalist_parties_desc: "Notre objectif est de convaincre tous les [ROOT.GetHabitants] de nous soutenir, et pour y arriver, nous devons nous allier aux partis nationalistes qui sont les plus influents sur la scène politique du pays. Grâce à eux, nous obtiendrons le soutien que nous cherchons."
 CZE_align_slovak_catholics: "S'aligner aux catholiques slovaques"
 CZE_align_slovak_catholics_desc: "Les partis nationalistes et catholiques se partagent la majorité de l'opinion en Slovaquie. S'allier aux nationalistes nous demanderait de lourdes concessions, tandis que les catholiques pourraient nous rejoindre sans trop d'efforts."
 CZE_jozef_tiso_tt: "Nommer §Y$CZE_jozef_tiso$§! conseiller"
 CZE_align_catholic_parties: "S'aligner au ČSL"
 CZE_align_catholic_parties_desc: "Le parti populaire tchécoslovaque et les autres partis catholiques constituaient la base de soutien traditionnelle du système monarchique à l'époque de l'Empire austro-hongrois. Tentons de leur restituer ce rôle déterminant."
 CZE_restore_the_monarchy: "Restaurer la monarchie"
 CZE_restore_the_monarchy_desc: "Maintenant que nous possédons le soutien nécessaire à la fondation de notre nouveau système, il est temps de le présenter au peuple. Nous nommerons $CZE_karel_schwarzenberg$ monarque, une figure qui plaît à la fois aux monarchistes de la première heure et aux nouveaux partisans, puisqu'il est [ROOT.GetAdjMS] et non [AUS.GetAdjMS], comme tous les autres monarques qui nous ont été imposés jusqu'ici."
 CZE_semi_constitutional_monarchy: "Un système semi-constitutionnel"
 CZE_semi_constitutional_monarchy_desc: "Le nouveau monarque désormais appointé, nous allons revoir la constitution. Certains sont favorables à la centralisation du pouvoir pour éviter toute querelle interne, néanmoins le roi ne pourra pas tout superviser. Nous allons donc plutôt conserver le système actuel pour administrer le pays, tandis que le roi, lui, guidera le peuple."
 CZE_restore_noble_titles: "Restaurer les titres de noblesse"
 CZE_restore_noble_titles_desc: "La république les avait fait disparaître, mais nous comptons récompenser l'élite de sa coopération en restaurant les titres de noblesse. Nous pourrons également décerner des titres honorifiques aux vétérans, par exemple, qui ont donné leur vie à la nation [ROOT.GetAdjFS]."
 CZE_restore_the_austro_hungarian_customs_union: "Restaurer l'union douanière de l'empire"
 CZE_restore_the_austro_hungarian_customs_union_desc: "L'Empire austro-hongrois avait l'avantage indéniable d'avoir mis en place de nombreuses barrières commerciales pour protéger notre industrie. Restaurons cette initiative : elle ne manquera pas de convaincre les autres pays de nous rejoindre."
 CZE_customs_union: "Union douanière"
 CZE_catholic_focus: "Favoriser les catholiques"
 CZE_catholic_focus_desc: "Les hussites sont une population [ROOT.GetAdjFS] historique, néanmoins, une grande partie du peuple demeure catholique. Concentrons-nous sur ces derniers en leur octroyant un rôle plus important au sein de la société."
 CZE_hussite_legacy: "L'héritage hussite"
 CZE_hussite_legacy_desc: "En plus de promouvoir un Christianisme plus protestant, les hussites ont également fait preuve d'une grande tolérance à l'égard des autres courants de pensée, contrairement aux tyrans qui s'y sont violemment opposés."
 CZE_align_with_germany: "S'aligner aux [GER.GetHabitants]"
 CZE_align_with_germany_desc: "Le nouveau gouvernement [GER.GetAdjMS] n'est sûrement pas moins expansionniste que son prédécesseur, mais il se montrerait sûrement plus réfléchi quant au choix de ses alliances et de ses adversaires. Tâchons de nous inclure dans le premier groupe."
 CZE_rally_against_germany: "S'opposer [GER.GetAuAlaAlNP] [GER.GetNonIdeologyName]"
 CZE_rally_against_germany_desc: "Les Tchécoslovaques ont vaillamment combattu pour leur indépendance, mais aujourd'hui, nous appelons tous les peuples à la protéger."
 CZE_integrate_sudeten_germans: "Intégrer les Sudètes"
 CZE_integrate_sudeten_germans_desc: "Les divisions qui déchirent les populations des Sudètes ne font pas avancer les choses. Trouvons la source du problème et tentons de l'éradiquer. Nous neutraliserons par la même occasion toute figure indépendantiste qui oserait prétendre que nous ne les traitons pas correctement."
 CZE_cooperate_with_the_sdp: "Coopérer avec le SdP"
 CZE_cooperate_with_the_sdp_desc: "Il se montre peut-être comme une présence indésirable, mais le SdP pourrait se ranger à nos côtés si nous parvenons à l'en convaincre. Peut-être qu'en lui proposant un siège au sein de la coalition..."
 CZE_revive_the_december_bloc: "Faire renaître le Bloc de décembre"
 CZE_revive_the_december_bloc_desc: "Le Bloc de décembre était un groupement de partis de droite, divers-droite et fascistes qui se sont opposés à l'élection d'Edvard Benes comme président. Relançons ce mouvement pour offrir une alternative au gouvernement en place."
 CZE_revert_1926_anti_military_laws: "Abroger les lois antimilitaires de 1927"
 CZE_revert_1926_anti_military_laws_desc: "Suite à la tentative de coup d'État de $CZE_radola_gajda$, l'armée et la gendarmerie ont perdu leur droit de vote ainsi que certains privilèges. Étant donné la situation complexe dans laquelle se trouve l'armée actuellement, nous devrions alléger son fardeau en supprimant ces restrictions et en lui tendant la main pour repartir sur de bonnes bases."
 CZE_bop_to_fascism_support_tt: "Ajoute un tiers du montant de la §Y$CZE_bop_army_readiness$§! au soutien au fascisme :"
 CZE_power_to_the_military: "Le pouvoir à l'armée"
 CZE_power_to_the_military_desc: "Il est évident que nous ne regardons pas à la dépense lorsqu'il s'agit de la défense nationale. Nous devons faire comprendre aux figures d'État en place que l'armée requiert toutes ces ressources pour être opérationnelle. Le meilleur moyen d'y arriver reste de former un gouvernement militaire."
 CZE_militarize_the_associations: "Militariser les associations"
 CZE_militarize_the_associations_desc: "Les nombreuses associations [CZE.GetAdjFP] pourraient contribuer à la défense nationale en inculquant les compétences attendues d'un soldat, et ce avant même la mobilisation générale."
 CZE_aggressive_foreign_policy: "Politique étrangère agressive"
 CZE_aggressive_foreign_policy_desc: "Le temps des pactes fragiles est révolu ; désormais nous agissons à notre compte pour assurer notre sécurité, quitte à réaliser de lourds sacrifices."
 CZE_work_with_germany: "Collaborer avec [GER.GetLeLaLNP] [GER.GetName]"
 CZE_work_with_germany_desc: "Maintenant que la question des Sudètes est réglée, nous pourrions peut-être amorcer des discussions pour convaincre les [GER.GetHabitants] que nous sommes des alliés fiables."
 CZE_control_the_associations: "Contrôler les associations"
 CZE_control_the_associations_desc: "[CZE.GetLeLaLNPCap] [CZE.GetNonIdeologyName] [CZE.GetEstSontNP] un pays très attaché à ses associations : association du travail, de loisir ou sportive... Si nous parvenons à contrôler ces associations, nous contrôlons virtuellement toute la société."
 CZE_diversify_bata: "Diversifier Bata"
 CZE_diversify_bata_desc: "L'immense société de biens de consommation Bata pourrait nous aider à optimiser notre chaîne d'approvisionnement, en fournissant des matériaux indispensables à la production et difficiles à se procurer, par exemple."
 CZE_devaluate_the_koruna: "Dévaluer la couronne"
 CZE_devaluate_the_koruna_desc: "Une monnaie forte est un parti-pris risqué pour un pays qui dépend principalement de l'exportation. Affaiblir notre couronne provoquera quelques désagréments, mais ce sera une décision payante à long terme."
 CZE_continue_the_central_bohemia_plan: "Projet pour la Bohême centrale"
 CZE_continue_the_central_bohemia_plan_desc: "Notre projet d'expansion des zones industrielles au cœur du pays est une priorité qui nous apporterait de nombreux avantages économiques. Bâtir nos usines loin des frontières est un choix judicieux du point de vue sécuritaire."
 CZE_balance_industrial_invevestments: "Équilibrer le développement industriel national"
 CZE_balance_industrial_invevestments_desc: "C'est en laissant des régions entières sous-développées autour de la [9.GetName] et de la [75.GetName] que le pays a connu une fracture sociale durant ces dix dernières années. Aidons ces territoires à rattraper leur retard industriel pour apaiser les tensions."
 CZE_expand_prf_science_facilities: "Développer l'infrastructure de la Faculté des Sciences"
 CZE_expand_prf_science_facilities_desc: "Les bâtiments de la Faculté des Sciences regorgent d'étudiants qui n'attendent que de participer à un projet de grande envergure. Développons les infrastructures et proposons une collaboration avec le gouvernement pour les aider à atteindre leurs rêves et améliorer la recherche."
 CZE_raise_more_industrial_funds: "Lever davantage de fonds industriels"
 CZE_raise_more_industrial_funds_desc: "Depuis l'époque de l'Empire austro-hongrois, l'industrie est la priorité de notre nation. Attribuons-lui un budget à la hauteur de ce statut pour assurer sa prospérité dans une Europe divisée."
 CZE_skoda_priority_focus_info_tt: "Certaines §Ypriorités nationales§! nécessitent une £GFX_CZE_skoda_text_icon §Ypriorité de Škoda§! spécifique pour être atteintes ; elles portent une icône indiquant le niveau de £GFX_CZE_skoda_text_icon §Ypriorité de Škoda§! requis."
 CZE_joint_stock_schemes: "Systèmes de sociétés par actions"
 CZE_joint_stock_schemes_desc: "Les systèmes de sociétés par actions sont une source de revenus sûre lorsque les financements ordinaires viennent à manquer. Poursuivons cette méthode pour doper notre économie."
 CZE_the_slovak_arrow: "La flèche slovaque"
 CZE_the_slovak_arrow_desc: "Développer un train à grande vitesse entre nos deux capitales offrirait au pays une nouvelle fierté nationale, à condition de rénover la totalité de notre réseau ferroviaire."
 CZE_finish_double_tracking_efforts: "Travaux de double voie"
 CZE_finish_double_tracking_efforts_desc: "En transformant toutes nos lignes secondaires en double voie, nous pourrons littéralement doubler le trafic ferroviaire et ainsi relier nos villes mineures au réseau national."
 CZE_realize_motorway_proposals: "Adopter un projet d'autoroute"
 CZE_realize_motorway_proposals_desc: "Nous avons reçu plusieurs projets d'autoroute ; la plupart d'entre eux permettraient d'optimiser le réseau routier du territoire. Penchons-nous sur la question et choisissons un projet à réaliser."
 CZE_build_additional_rail_stations: "Construire de nouvelles gares"
 CZE_build_additional_rail_stations_desc: "Certaines gares ferroviaires sont trop vétustes ou modestes pour gérer l'augmentation du trafic qu'apporte notre réseau flambant neuf. Nous pourrions les rénover et en construire de nouvelles pour fluidifier le transport de marchandises et de civils."
 CZE_build_additional_rail_stations_focus_cost_tt: "Entreprendre §Y$CZE_devaluate_the_koruna$§! réduit le temps requis pour cette priorité à §G35§! jours"
 CZE_grow_ckd_secondary_facilities: "Bâtiments secondaires de ČKD"
 CZE_grow_ckd_secondary_facilities_desc: "ČKD possède plusieurs usines secondaires qui produisent d'importantes marchandises, comme des générateurs électriques. Développons ces sites pour faciliter la croissance de notre industrie lourde."
 CZE_bolster_domestic_construction: "Dynamiser le secteur du bâtiment"
 CZE_bolster_domestic_construction_desc: "La construction domestique est un secteur en croissance depuis notre indépendance à l'issue de la Grande Guerre. Attribuons des subventions aux entrepreneurs intermédiaires pour encourager cette tendance."
 CZE_invest_in_vhht: "Investir dans VHHT"
 CZE_invest_in_vhht_desc: "VHHT est une entreprise englobant de nombreuses aciéries nationales. En investissant dans leurs projets, nous rendons service à toute la filière métallurgique du pays."
 CZE_expand_vitkovice_ironworks: "Développer la ferronnerie de Vítkovice"
 CZE_expand_vitkovice_ironworks_desc: "La ferronnerie de Vítkovice produit quasiment la totalité du fer des [74.GetName]. Développons davantage cette entreprise pour optimiser sa production."
 CZE_expand_central_bohemian_mines: "Développer les mines de Bohême centrale"
 CZE_expand_central_bohemian_mines_desc: "Les mines au cœur de notre territoire sont la clé de notre sécurité énergétique. Développons-les dès que possible."
 CZE_increase_bauxite_imports: "Accroître les importations de bauxite"
 CZE_increase_bauxite_imports_desc: "Notre pays manque d'aluminium naturel, mais grâce à des procédés chimiques, nous pouvons en produire artificiellement, à condition d'acheter de la bauxite en quantité. C'est une solution formidable pour éviter les pénuries."
 CZE_merge_the_oil_companies: "Fusionner les compagnies pétrolières"
 CZE_merge_the_oil_companies_desc: "Nos compagnies pétrolières sont loin de ressembler aux multinationales de certains pays : ce ne sont rien de plus que des entrepôts miteux bâtis autour de petits puits. Si nous les regroupons sous une même entité étatique, nous optimiserons à coup sûr la production de pétrole."
 CZE_expand_trinec_ironworks: "Aciérie de Třinec"
 CZE_expand_trinec_ironworks_desc: "L'aciérie de Třinec est l'un des fleurons de l'industrie de la [71.getname]. Investissons davantage dans cette institution pour récupérer de généreux dividendes."
 CZE_consolidate_mining_operations: "Consolider les opérations minières"
 CZE_consolidate_mining_operations_desc: "Le secteur minier pourrait être bien mieux optimisé si les multiples administrations se réunissaient en une seule entité. La prospection et les opérations seraient plus efficaces ainsi."
 CZE_expand_praga: "Signer des contrats avec Praga"
 CZE_expand_praga_desc: "Praga produit depuis plusieurs années de nombreux composants utiles à l'industrie militaire. Quoi de plus naturel que de les récompenser en signant quelques contrats et ainsi contribuer à leur croissance ?"
 CZE_shrink_educational_disparities: "Combler les inégalités d'accès à l'éducation"
 CZE_shrink_educational_disparities_desc: "Nos régions rurales ne jouissent pas du parcours éducatif proposé aux populations urbaines. Effaçons ces disparités en déployant des programmes pour développer l'éducation dans ces zones."
 CZE_kickstart_rapid_rearmanent: "Amorcer un réarmement rapide"
 CZE_kickstart_rapid_rearmanent_desc: "Certains politiciens et entrepreneurs affirment que c'est une mauvaise idée, mais nous devons lancer notre réarmement sur-le-champ. Les pays qui nous entourent ne s'en privent pas, bien au contraire. Alors, préparons l'armée tant qu'il est encore temps."
 CZE_keep_focus_on_weapon_exports: "Privilégier les exportations d'armement"
 CZE_keep_focus_on_weapon_exports_desc: "Notre secteur d'exportation d'armement est en grande partie la raison pour laquelle nous avons échappé à la Grande Dépression. Il serait idiot de tenter de le changer de quelque manière que ce soit. Continuons ainsi pour le moment. Nous ne craignons rien."
 CZE_force_the_industrialists_hand: "Forcer la main des industriels"
 CZE_force_the_industrialists_hand_desc: "Les conglomérats d'industriels nous empêchent activement d'amorcer notre réarmement, mais à partir de maintenant, nous prendrons les décisions à leur place, pour le bien de la nation."
 CZE_embrace_corporatism: "Adopter le corporatisme"
 CZE_embrace_corporatism_desc: "Une négociation est possible avec les industriels : ils pourraient nous aider au réarmement à condition d'accéder à leurs requêtes. Ils méritent bien quelques allègements à leur compte, pour le bien de la nation."
 CZE_expand_existing_armory_plants: "Agrandir les usines d'armement"
 CZE_expand_existing_armory_plants_desc: "Délocaliser nos usines d'armement serait bien trop coûteux, avec un retour sur investissement négligeable. En revanche, agrandir nos sites existants serait plus rapide, plus économique et nous permettrait d'obtenir une production et une recherche accrues. Certes, elles se trouvent dans des régions plus vulnérables à l'ennemi, mais les gains à court terme sont considérables."
 CZE_expand_skoda_offices: "Agrandir les bureaux de Škoda"
 CZE_expand_skoda_offices_desc: "Nos bureaux nationaux sont la clé des ventes d'armement. Pour nous ouvrir les portes du commerce international, il faut s'installer dans de nouveaux territoires."
 CZE_skoda_office_unlock_tt: "Donne accès à la décision : §YConstruire un bureau de vente d'armement§!"
 CZE_complete_the_power_grid: "Déployer le réseau électrique"
 CZE_complete_the_power_grid_desc: "Certaines régions rurales ne profitent pas totalement du réseau électrique. En conséquence, les retards de développement s'accumulent et ralentissent le pays."
 CZE_build_the_slapy_reservoir: "Ériger le barrage de Slapy"
 CZE_build_the_slapy_reservoir_desc: "Un barrage près de Slapy produirait une quantité remarquable d'électricité tout en redynamisant économiquement la région. L'énergie produite pourrait être partiellement réinvestie sur place pour relancer l'industrie."
 CZE_diversify_refinery_processes: "Diversifier les procédés de raffinage"
 CZE_diversify_refinery_processes_desc: "Grâce à nos puits, nous sommes capables de produire une large gamme de produits dérivés du pétrole. Malheureusement, nous ne possédons pas le savoir-faire pour fabriquer ces éléments. Investissons dans la recherche pour concrétiser ce rêve."
 CZE_enlarge_smaller_wells: "Agrandir les petits puits"
 CZE_enlarge_smaller_wells_desc: "Même s'ils sont petits, nos puits de pétrole ne produisent pas la quantité qu'ils pourraient s'ils étaient parfaitement optimisés. Prenons le temps et l'argent nécessaires à leur rénovation."
 CZE_develop_sudetenland_resources: "Développer les ressources des Sudètes"
 CZE_develop_sudetenland_resources_desc: "Les Sudètes possèdent de nombreux gisements inexploités. Il serait dommage de ne pas investir les ressources nécessaires à leur exploitation."
 CZE_grow_tatras_capabilities: "Étendre les capacités de Tatra"
 CZE_grow_tatras_capabilities_desc: "Le département de chars compacts de Tatra a mis au point de nouveaux modèles. Offrons-leur les ressources qu'ils demandent pour soutenir leurs percées technologiques en matière de blindage."
 CZE_bailout_moser: "Renflouer Moser"
 CZE_bailout_moser_desc: "La cristallerie Moser a été frappée de plein fouet par la Grande Dépression. Il faut renflouer ses caisses et rouvrir les usines en liquidation pour rendre au peuple son travail."
 CZE_merge_skodas_consumer_good_plants: "Fusionner les usines de biens Škoda"
 CZE_merge_skodas_consumer_good_plants_desc: "Škoda possède de nombreuses usines produisant des biens de consommation, mais la plupart agissent indépendamment du groupe. En centralisant l'administration de ces dernières, nous améliorerons la production, ce qui ne sera que bénéfique pour Škoda."
 CZE_giant_of_central_europe_industry: "Le géant de l'industrie"
 CZE_giant_of_central_europe_industry_desc: "Nous avons atteint des sommets jusque là insoupçonnés ; nous sommes désormais les titans industriels de l'Europe !"
 CZE_continue_armed_force_reform: "Poursuivre les réformes des forces armées"
 CZE_continue_armed_force_reform_desc: "La modernisation de nos armées ne fait que commencer. Suivons le calendrier que nous nous sommes imposé et réassignons les régions sous l'administration de quartiers généraux de province. Nous en tirerons une meilleure coordination en cas d'offensive."
 CZE_air_force_officer_recruitment: "Recrutement d'officiers de l'armée de l'air"
 CZE_air_force_officer_recruitment_desc: "Les aérodromes de tout le pays se sont associés à l'école d'officiers de réserve de l'armée de l'air pour proposer des cours de vol et des exercices de tir, afin de former les officiers de demain."
 CZE_national_defense_act: "L'acte de défense nationale"
 CZE_national_defense_act_desc: "Cet acte de défense regroupe un ensemble de mesures, militaires ou non, visant à contrer toute menace à la souveraineté, l'intégrité et l'unité de notre nation, sous la supervision rapprochée du Conseil suprême de défense nationale."
 CZE_car_and_oil_rationing: "Rationnement automobile et pétrolier"
 CZE_car_and_oil_rationing_desc: "Rationner les véhicules motorisés et instaurer leur réquisition libre nous permet de focaliser la production d'automobiles et de carburant pour l'armée."
 CZE_expand_airfield_capacity: "Accroître la capacité des aérodromes"
 CZE_expand_airfield_capacity_desc: "Le 3e département d'aviation déploie de nouveaux aérodromes et hangars afin d'abriter et entretenir notre flotte aérienne, ainsi que des dortoirs pour les récentes escadrilles et autres personnels."
 CZE_trust_in_old_guard: "Écouter les vétérans"
 CZE_trust_in_old_guard_desc: "Les exploits aériens réalisés par les vétérans de la Grande Guerre serviront d'exemple à la nouvelle génération. Les anciens sont la sagesse dont nous avons besoin pour demain."
 CZE_expand_the_aero_clubs: "Développer les clubs d'aviation"
 CZE_expand_the_aero_clubs_desc: "Ces clubs nous ont aidés à recruter la nouvelle génération de pilotes du pays. Développons-les davantage."
 CZE_invest_in_the_smaller_air_plants: "Investir dans les usines modestes"
 CZE_invest_in_the_smaller_air_plants_desc: "Investir dans les plus petits fabricants d'avions provoquera naturellement une concurrence avec les sociétés plus grandes. Néanmoins, ils pourraient nous aider à répondre à notre demande croissante."
 CZE_continue_avia_expansion: "Poursuivre l'expansion d'Avia"
 CZE_continue_avia_expansion_desc: "Un investissement chez Avia est tout ce qui manque pour les aider à renforcer leurs capacités de production. Nous aurions ainsi toutes les cellules aériennes dont nous avons besoin."
 CZE_increase_military_aeronautical_institute_funding: "Augmenter le budget aéronautique de l'armée"
 CZE_increase_military_aeronautical_institute_funding_desc: "Agrandissons les bâtiments dédiés à la recherche aérospatiale pour obtenir un regard neuf sur l'aérodynamique et nos modèles d'avions."
 CZE_air_training_abroad: "Formation de l'armée de l'air à l'étranger"
 CZE_air_training_abroad_desc: "Envoyons nos aspirants de l'armée de l'air en formation dans des pays alliés afin d'élargir leurs horizons et accumuler une expérience unique qui sera bien utile lorsqu'ils nous reviendront."
 CZE_establish_air_defense_zones: "Établir des zones de défense aérienne"
 CZE_establish_air_defense_zones_desc: "Assignons nos nouvelles batteries anti-aériennes à des emplacements stratégiques pour établir des zones de défense aérienne. Restons à proximité des nœuds de communication et des usines pour optimiser notre précision."
 CZE_establish_air_defense_zones_enable_tt: "Établit des §Yzones de défense aérienne§!"
 CZE_establish_air_defense_zones_tt: "Chances de toucher de la DCA statique : §G+10%§!"
 CZE_the_air_is_our_sea: "Notre océan est dans le ciel"
 CZE_the_air_is_our_sea_desc: "Notre formation de pilotage sans égal fait de nos pilotes le fleuron de l'aviation européenne. « Nous n'avons ni ports ni navires, car notre océan est dans le ciel. »"
 CZE_bring_kramer_and_lobel_under_state_control: "Nationaliser Kramer & Löbl"
 CZE_bring_kramer_and_lobel_under_state_control_desc: "Transférer Kramer & Löbl sous l'administration du gouvernement est la garantie d'une innovation scientifique continue ainsi que la production d'éléments électriques et radiophoniques dans les délais impartis."
 CZE_second_to_none: "Inégalables"
 CZE_second_to_none_desc: "Les modèles de nos avions sont de plus en plus innovants. Encore quelques efforts de développement et nos appareils seront inégalables dans le monde entier !"
 CZE_diversify_airframe_production: "Diversifier la production de cellules"
 CZE_diversify_airframe_production_desc: "Nous ne pouvons pas seulement compter sur nos chasseurs pour dominer les cieux : il nous faut de nouveaux modèles, aux cellules plus larges, pour accomplir des missions secondaires."
 CZE_projekt_l_52: "Projekt L-52"
 CZE_projekt_l_52_desc: "Le moteur à réaction est le futur de la guerre aérienne, mais pour le moment, la technologie en est encore à ses balbutiements. Prenons le temps de développer un projet et une cellule autour de cette innovation pour garder une longueur d'avance."
 CZE_fund_vladimir_mandl_research: "Financer le projet de Vladimir Mandl"
 CZE_fund_vladimir_mandl_research_desc: "Un avocat du nom de $CZE_vladimir_mandl$ se passionne par la technologie du moteur à réaction. Si nous lui octroyons des fonds pour mener à bien ses recherches et qu'il réalise une percée inédite, nous serions les premiers à profiter de ses découvertes."
 CZE_mobilize_the_reserves: "Mobiliser les réservistes"
 CZE_mobilize_the_reserves_desc: "La situation empire à la frontière. Mobilisons nos réservistes ainsi que nos spécialistes militaires pour mettre au point un plan d'action."
 CZE_three_kings: "Trois rois"
 CZE_three_kings_desc: "Soutenons nos groupes de résistance par les canaux officiels afin de décupler leurs moyens d'offensive. C'est également un bon moyen d'aider l'armée sur le terrain."
 CZE_form_the_state_defense_guard: "Fonder la garde de défense d'État"
 CZE_form_the_state_defense_guard_desc: "Cette organisation sera chargée de protéger nos vastes frontières. Elle sera composée d'individus issus de formations militaires, elle pourra donc intervenir directement en cas de tentative d'intrusion sur le territoire."
 CZE_expand_the_horska_divisions: "Développer la Horská divize"
 CZE_expand_the_horska_divisions_desc: "Notre pays est principalement constitué de vallons et de plateaux, c'est pourquoi il nous faut des bataillons formés spécialement au combat en montagne et autres terrains difficiles."
 CZE_develop_horska_artillery: "Développer l'artillerie Horská"
 CZE_develop_horska_artillery_desc: "Réformons l'artillerie : elle doit devenir légère et portable. C'est l'unique moyen pour la faire accéder aux terrains montagneux de la région."
 CZE_develop_horska_artillery_tech_tt: "Permet l'§Yartillerie Horská§!\n§YArtillerie (montagnes)§!\n  Attaque : §G+10%§!\n  Mouvement : §G+10%§!\n§YArtillerie (collines) :§!\n  Attaque : §G+10%§!\n  Mouvement : §G+10%§!"
 CZE_bribery_investigations: "Enquête pour corruption"
 CZE_bribery_investigations_desc: "Nous avons reçu un courrier anonyme dénonçant le traitement de faveur accordé à certains soldats. D'après les arguments avancés, il semblerait que quelques surintendants se laissent soudoyer. Mettons un terme à cette plaisanterie avant qu'elle ne provoque des dégâts irréversibles au sein de l'armée."
 CZE_bribery_investigations_remove_effect_tt: "Cet esprit national sera retiré lorsque la priorité §Y$CZE_bribery_investigations$§! aura été adoptée."
 CZE_opl_exercises: "Exercices anti-aériens"
 CZE_opl_exercises_desc: "Ces exercices mettent les recrues en situation réelle pour leur apprendre à manœuvrer. C'est un excellent moyen d'améliorer leur coordination et donc la sécurité et la mobilité générale des troupes."
 CZE_rapid_response_divisions: "Division rapide"
 CZE_rapid_response_divisions_desc: "Les armées étrangères ont mis en évidence l'importance d'une unité mobile capable de se repositionner avant l'ennemi. Tentons de mettre au point un prototype pour étudier nos options."
 CZE_redouble_tank_development_efforts: "Intensifier la campagne de développement de chars"
 CZE_redouble_tank_development_efforts_desc: "Notre modèle de char léger est loin d'être parfait, surtout comparé aux autres blindés d'Europe. Redoublons d'efforts pour mettre à jour notre véhicule."
 CZE_rearmed_and_retooled: "Nouvelle version"
 CZE_rearmed_and_retooled_desc: "Notre char lourd ne demande qu'à être modernisé. Explorons les possibilités jusqu'à trouver la version idéale pour notre armée."
 CZE_establish_the_fall_backlines: "Établir les lignes de repli"
 CZE_establish_the_fall_backlines_desc: "Soyons réalistes : notre défense n'est pas infaillible. Il y a un risque qu'elle soit percée à un endroit ou un autre. Si ce scénario se produit un jour, nous devons avoir pensé aux lignes de repli pour éviter une défaite totale."
 CZE_establish_the_fall_backlines_masterful_delay_tactic_tt: "\nPermet la tactique §Y$tactic_masterful_delay$§!"
 CZE_anti_tank_development: "Développement de canon antichar"
 CZE_anti_tank_development_desc: "Avec toutes ces armées qui se dotent de forces blindées, nous devons prendre les devants et améliorer nos canons antichars. Neutraliser les chars ennemis peut faire toute la différence entre une offensive ratée et une défaite totale."
 CZE_anti_tank_development_tech_tt: "Permet les §Yaméliorations antichar§!\nPerforation d'§Yartillerie§! : §G+5%§!\nPerforation d'§Yartillerie d'appui§! : §G+5%§!\nPerforation §Yantichar§! : §G+5%§!\nPerforation d'§Yantichar d'appui§! : §G+5%§!"
 CZE_recon_in_force: "Reconnaissance en force"
 CZE_recon_in_force_tech_tt: "Permet la §Yreconnaissance en force§!\nPV de §Yreconnaissance§! : §G+5§!\nReconnaissance : §G+10%§!"
 CZE_recon_in_force_desc: "Envoyer nos agents de reconnaissance à la rencontre de l'ennemi pour évaluer ses défenses est un moyen formidable d'obtenir des renseignements."
 CZE_integrate_fortification_engineers: "Intégrer les ingénieurs en fortifications"
 CZE_integrate_fortification_engineers_desc: "Lorsque nos ingénieurs militaires ne sont pas chargés d'ériger des fortifications statiques, nous devons pouvoir les assigner au front afin de consolider notre position. Ce coup de main serait bienvenu pour les forces en première ligne qui peinent parfois à mettre en place des structures défensives durables."
 CZE_integrate_fortification_engineers_tech_tt: "Permet l'§Yintégration des ingénieurs en fortification§!\n§YCie du génie§! :\nRetranchement §G+10%§!\nDéfense §Y(Fort)§! §G+10%§!"
 CZE_concealment_efforts: "Développer la furtivité"
 CZE_concealment_efforts_desc: "La généralisation des attaques au sol et des avions de reconnaissance rend absolument indispensables le camouflage et autres tactiques de furtivité. Attardons-nous à rendre nos troupes aussi invisibles que possible."
 CZE_concealment_efforts_tech_tt: "Permet les §Yfilets tactiques améliorés§!\n§YInfanterie non motorisée (Forêt)§!\nDéfense : §G+10%§!"
 CZE_elevate_the_vsv: "Ériger l'école militaire"
 CZE_elevate_the_vsv_desc: "On ne confie pas à n'importe qui le cerveau de l'armée : l'état-major requiert les esprits les plus brillants de la nation, tant sur le plan physique que mental. Nous recherchons des individus doués, fiables, diplomatiques et de caractère."
 CZE_continue_with_snejdareks_plan_dynamic: "[CZE_continue_with_snejdareks_plan]"
 CZE_continue_with_snejdareks_plan_default: "Poursuivre le plan de Šnejdárek"
 CZE_continue_with_snejdareks_plan_no_snejdareks: "Poursuivre le plan de défense statique"
 CZE_continue_with_snejdareks_plan_dynamic_desc: "Un réseau de défenses fiables empêche toute intrusion ennemie surprise. Il fournit la protection nécessaire à l'établissement d'une base solide capable de passer de la défensive à l'offensive."
 CZE_go_with_vojcechovskys_plan_dynamic: "[CZE_go_with_vojcechovskys_plan]"
 CZE_go_with_vojcechovskys_plan_default: "Suivre le plan de Luža"
 CZE_go_with_vojcechovskys_plan_no_luza: "Doctrines de défense active"
 CZE_go_with_vojcechovskys_plan_dynamic_desc: "Le problème avec les défenses statiques est leur manque de mobilité. Une fois percées, elles n'ont plus aucune utilité, défensive comme offensive."
 CZE_improve_the_current_officer_pool: "Améliorer notre équipe d'officiers"
 CZE_improve_the_current_officer_pool_desc: "Nous comptons promouvoir les recrues qui nous ont prouvé leur capacité à soutenir l'armée, car c'est grâce à elles que la communication est possible entre les hautes instances et chaque unité."
 CZE_elevate_slovak_officers: "Ériger les officiers slovaques"
 CZE_elevate_slovak_officers_desc: "Nous comptons mettre les Slovaques au-devant de la scène afin de leur offrir une meilleure représentation parmi nos rangs. Les prérequis seront réduits pour les candidats issus des territoires slovaques. C'est une façon de renforcer la cohésion au sein de l'armée."
 CZE_promote_moravec_writings: "Promouvoir les écrits de Moravec"
 CZE_promote_moravec_writings_desc: "Même si certains de ses travaux ont provoqué des réactions fondamentalement contradictoires, son tout dernier essai, intitulé « De l'importance militaire de notre État en Europe centrale » a fait l'objet de nombreux encensements dans la presse européenne. Encourageons-le à poursuivre son œuvre sur la défense intérieure et l'histoire militaire."
 CZE_lessons_of_war: "Les leçons de la guerre"
 CZE_lessons_of_war_desc: "Maintenant que nous avons accumulé de l'expérience de combat aux côtés d'un partenaire, tâchons de la mettre à profit pour améliorer notre état-major. Rien ne vaut le savoir durement acquis sur le terrain."
 CZE_lessons_of_war_i_had_war_with_major_flag: "A été en guerre contre une grande puissance"
 CZE_for_the_homeland: "Pour la patrie"
 CZE_for_the_homeland_desc: "Notre armée se tient prête à affronter les défis qui se dressent devant elle et à défendre avec ferveur la patrie. Rien ne lui fait peur."
 CZE_the_lions_roar: "Le rugissement du lion"
 CZE_the_lions_roar_desc: "Le symbole du lion tchécoslovaque représente toutes les qualités de notre armée : bravoure, puissance et héroïsme. Bientôt, le monde entier entendra parler de ses exploits."
 CZE_diversify_our_specialists: "Diversifier nos spécialistes"
 CZE_diversify_our_specialists_desc: "Nous devons nous constituer un panel de spécialistes des troupes Horská plus variés : la guerre ne se déroule pas seulement en montagne, après tout."
 CZE_merge_the_financial_and_state_guard: "Fusionner les gardes de défense d'État et financière"
 CZE_merge_the_financial_and_state_guard_desc: "Depuis la formation de la garde de défense d'État, nous n'avons plus besoin de la garde financière. Incorporons-la à la première pour gonfler ses rangs."
 CZE_merge_the_financial_and_state_guard_tt: "Permet d'§Yintégrer la garde financière§!\nPV de la §Ypolice militaire§! : §G+5§!"
 CZE_logistics_beyond_the_sudetes: "Par-delà les Sudètes"
 CZE_logistics_beyond_the_sudetes_desc: "Si nous voulons mener nos opérations militaires au-delà des Sudètes, nous devons maîtriser la logistique longue distance ; ça n'a rien à voir avec les petits trajets réalisés sur notre territoire."
 CZE_logistics_beyond_the_sudetes_tt: "Permet les §Ylivraisons de ravitaillement améliorées§!\n§YCompagnie logistique§! : Ravitaillement nécessaire : §G-10%§!"
 CZE_expand_the_river_monitor_fleet: "Développer la flotte de monitors"
 CZE_expand_the_river_monitor_fleet_desc: "Nous possédons la plus vaste flotte de monitors d'Europe. Elle soutient activement nos troupes depuis les fleuves lors de défenses terrestres. Nous devons poursuivre son développement pour aider encore plus l'armée."
 CZE_the_tvp_project: "Le projet TVP"
 CZE_the_tvp_project_desc: "L'armée vient de proposer un projet de TVP domestique ; la fabrication de chars de combat génériques sur notre territoire. Certains fabricants, habitués à la production de chars, se sont montrés intéressés par le projet."
 CZE_expand_the_land_department_of_vtu: "Développer le département terrestre du VTÚ"
 CZE_expand_the_land_department_of_vtu_desc: "En agrandissant le département terrestre du VTÚ, l'institut militaire technique, nous lui offrons la possibilité d'acquérir plus de machines et d'ouvrir de nouveaux laboratoires pour accélérer ses recherches qui donneront naissance à du matériel de pointe."
 CZE_department_two_expansion: "Département n°2"
 CZE_department_two_expansion_desc: "Notre section de renseignements, le Département n°2, a demandé plus de ressources afin de mieux préserver la sécurité nationale des espions ennemis. C'est aussi un moyen de développer des secteurs spécifiques de l'agence."
 CZE_military_intelligence: "Secteur du renseignement militaire"
 CZE_military_intelligence_desc: "Le renseignement militaire est le secteur capital de toute agence de renseignements. Investir dans celui-ci est la garantie de fonds habilement dépensés."
 CZE_air_intelligence: "Secteur du renseignement aérien"
 CZE_air_intelligence_desc: "La victoire tient parfois à la précision des renseignements que l'on détient ; connaître exactement le nombre d'avions dans la flotte ennemie est capital lorsqu'on réalise une offensive."
 CZE_within_the_eagles_nest: "Dans le nid de vipères"
 CZE_within_the_eagles_nest_desc: "L'armée profiterait grandement d'une division d'informateurs et de saboteurs. Avec l'aide appuyée du Département n°2, nous pourrions développer un véritable réseau d'espions dans des localités clés."
 CZE_restart_naval_gun_production: "Relancer la production d'armement naval"
 CZE_restart_naval_gun_production_desc: "Les usines Škoda étaient autrefois le plus grand concepteur et producteur d'armement naval de tout l'Empire austro-hongrois. En relançant la production, nous éveillerons de nouveau une ferveur oubliée autour de notre fierté navale."
 CZE_restart_naval_gun_production_tt: "La §Ypriorité navale de Škoda§! devient §Yactive§!"
 CZE_reform_the_naval_detachment: "Reconstituer le détachement naval"
 CZE_reform_the_naval_detachment_desc: "Le détachement naval a récemment été incorporé à l'armée, mais avec la tournure que prennent les événements, il est peut-être plus sage de le reconstituer tel qu'il était."
 CZE_build_2_dockyards_when_we_have_coast_tt: "Ajoute §G2§! §Ychantiers navals§! dans un §YÉtat littoral§! contrôlé aléatoire"
 CZE_skoda_naval_yards: "Chantiers navals de Škoda"
 CZE_skoda_naval_yards_desc: "La mer nous tend de nouveau les bras. Relançons les industries navales du temps de l'Empire austro-hongrois avec l'expertise qui subsiste au sein de nos frontières. Nous devons avant tout remettre en état les chantiers navals."
 CZE_build_3_dockyards_when_we_have_coast_tt: "Ajoute §G3§! §Ychantiers navals§! dans un §YÉtat littoral§! contrôlé aléatoire"
 CZE_legacy_of_the_kriegsmarine: "L'héritage de la Kriegsmarine"
 CZE_legacy_of_the_kriegsmarine_desc: "Hier encore, nous avons aidé à construire d'imposants cuirassés. Espérons ne rien avoir oublié. Nous allons ressusciter l'héritage de la Kriegsmarine austro-hongroise."
 CZE_build_off_old_ganz_danubius_designs: "S'inspirer des modèles de Ganz Danubius"
 CZE_build_off_old_ganz_danubius_designs_desc: "Les modèles d'époque dessinés par Ganz Danubius, de la Compagnie Ganz, serviront de base à l'élaboration de nouveaux croiseurs. En cherchant bien, nous retrouvons peut-être même les auteurs de ces plans."
 CZE_modernize_trieste_designs: "Moderniser le modèle du Trieste"
 CZE_modernize_trieste_designs_desc: "Ces vieux plans de la marine austro-hongroise sont une mine d'or pour mieux comprendre les cuirassés et apprendre à les construire."
 CZE_leverage_gunboat_experience: "S'inspirer des canonnières"
 CZE_leverage_gunboat_experience_desc: "Nos savoirs sur les modèles de canonnières nous seront utiles pour bâtir des destroyers. Notre expertise va aider à accélérer le processus de conception."
 CZE_revive_kraljevica_designs: "Ressortir les modèles de Kraljevica"
 CZE_revive_kraljevica_designs_desc: "Avec nos connaissances sur les canonnières et les anciens modèles de Kraljevica, nous allons pouvoir retrouver des destroyers dans notre nation."
 CZE_wolfs_of_bohemia: "La meute de Bohême"
 CZE_wolfs_of_bohemia_desc: "Notre nation n'a pas totalement oublié l'art de bâtir des sous-marins. Avec un petit effort, nous aurons très bientôt des meutes à nos couleurs."
 CZE_raider_lineage: "Le raid dans le sang"
 CZE_raider_lineage_desc: "Nos officiers vétérans ayant servi sous la marine austro-hongroise ont connu l'époque des raids. Rétablissons ces savoirs oubliés."
 CZE_a_modern_navy: "Une marine moderne"
 CZE_a_modern_navy_desc: "Nos technologies navales ont fait de grands progrès. Nous avons enfin une marine digne de ce nom !"
 CZE_build_1_dockyards_when_we_have_coast_tt: "Ajoute §G1§! §Ychantier naval§! dans un §YÉtat littoral§! contrôlé aléatoire"
 CZE_naval_aviation: "Aviation navale"
 CZE_naval_aviation_desc: "Les porte-avions sont l'avenir de la marine. Investissons au plus vite dans ces domaines innovants."
 CZE_across_the_atlantic: "Au-delà de l'Atlantique"
 CZE_across_the_atlantic_desc: "Toute marine digne de ce nom doit être capable de traverser les océans. Prouvons au monde entier que la nôtre peut couvrir des distances remarquables."
 CZE_joint_equipment_designs: "Modèles de matériel communs"
 CZE_joint_equipment_designs_desc: "[GER.GetLeLaLNPCap] [GER.GetName] et nous-mêmes produisons les meilleurs chars et avions au monde, nos modèles respectifs ayant quelques particularités. Nous pourrions amorcer un programme d'échange technologique pour renforcer davantage nos capacités."
 CZE_negotiate_sphere_of_influence: "Négocier la sphère d'influence"
 CZE_negotiate_sphere_of_influence_desc: "Les ressources militaires [ROOT.GetDuDelaDelNP] [ROOT.GetName] sont un apport formidable à l'alliance [GER.GetAdjFS], c'est un fait. Nous demandons simplement quelques territoires en échange de notre contribution."
 CZE_set_up_polish_puppet_state: "Faire du sud [POL.GetDuDelaDelNP] [POL.GetName] un fantoche"
 CZE_set_up_polish_puppet_state_desc: "Les [GER.GetHabitants] cherchent à faire de la Pologne un État fantoche, alors pourquoi ne pas faire pareil de notre côté."
 CZE_usurp_the_mantle: "Usurper le titre"
 CZE_usurp_the_mantle_desc: "Notre beau royaume s'étend de la Baltique à l'Adriatique et régit les terres d'Autriche, puissance régionale historique. Grâce à lui, nous pouvons nous proclamer dignes successeurs du Saint-Empire romain germanique."
 CZE_austro_hungary_puppets: "Chaque §Ydépendance§! visée par les prérequis d'une priorité"
 CZE_decrease_autonomy_tier: "Chaque dépendance (§Y$autonomy_dominion$§! ou §Y$autonomy_puppet$§!) perdra un degré d'autonomie."
 #Exile Focus
 CZE_prepare_for_exile: "Préparer l'exil"
 CZE_prepare_for_exile_desc: "L'État devrait aider dans le plus grand secret la fuite à l'étranger de nos dirigeants politiques afin d'établir un gouvernement en exil."
 CZE_joins_government_in_exile_tt: "Nous rejoindrons le §Ygouvernement en exil§!"
 CZE_infiltrate_collaborationist_organizations: "Infiltrer les collaborationnistes"
 CZE_administrative_chaos_tt: "Conséquences pour le §YReichskommissariat§! si §Y$CZE_enter_exile$§! est atteint :"
 CZE_infiltrate_collaborationist_organizations_desc: "Il est difficile de croire que des [ROOT.GetHabitants] puissent soutenir activement le gouvernement en exil, mais c'est exactement ce qu'il nous faut pour tout connaître de leurs agissements."
 CZE_enter_exile: "Partir en exil"
 CZE_enter_exile_desc: "Nos alliés potentiels commencent à se battre contre le crocodile [GER.GetAdjMS]. C'est le moment pour notre gouvernement de se préparer à regagner sa souveraineté."
 CZE_refused_exile: "A refusé d'accueillir [ROOT.GetLeLaLNP] [ROOT.GetName]"
 CZE_contact_the_czech_and_slovak_legion: "Contacter les Légions tchèques et slovaques"
 CZE_contact_the_czech_and_slovak_legion_desc: "De vaillants [ROOT.GetHabitants] ont fui vers [POL.GetLeLaLNP] [POL.GetName] et [FRA.GetLeLaLNP] [FRA.GetName] pour poursuivre le combat au nom de la liberté [CZE.GetDuDelaDelNP] [CZE.GetName]. Contactons ces groupes de résistants pour coordonner leurs actions."
 CZE_skoda_priority_shortcut_finder: "Priorité de Škoda"
 CZE_skoda_priority_shortcut_finder_desc: "Il s'agit de la priorité actuelle de Škoda"
 #Decision unlock TT
 CZE_decision_unlock: "Donne accès à la décision : "
 CZE_demand_regime_change_tt: "$CZE_decision_unlock$§YExiger un changement de régime dans le pays§!"
 CZE_propose_unification_tt: "$CZE_decision_unlock$§YInviter le pays dans l'Union tchécoslovaque§!"
 CZE_integrate_nation_tt: "$CZE_decision_unlock$§YIntégrer le pays§!"
