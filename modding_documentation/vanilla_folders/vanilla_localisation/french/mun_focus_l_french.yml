 #Germany
 GER_integrate_czech_manufacturers: "Intégrer les manufactures tchèques"
 GER_integrate_czech_manufacturers_desc: "L'industrie de Bohême regorge d'expertise et de ressources qui combleraient notre économie. La puissance industrielle des manufactures serait également un bonus non négligeable à notre industrie de l'armement. Il faut les intégrer à nos lignes de production au plus vite."
 GER_integrate_czech_manufacturers_no_aat_tt: "§YEntreprises de conception§! §Gdisponibles§! :\n§Y$CZE_skoda_works_german_organization$§!, §Y$CZE_bohmische_mahrische_maschinenfabrik_ag_german_organization$§!, §Y$CZE_zlin_aircraft_organization$§! et §Y$CZE_ceska_zbrojovka_uhersky_brod_organization$§!"
 CZE_unlocks_sokolov_raid_pfot_tt: "Donne accès aux §Yraids de parachutistes§! sur §YFalknov§!"
