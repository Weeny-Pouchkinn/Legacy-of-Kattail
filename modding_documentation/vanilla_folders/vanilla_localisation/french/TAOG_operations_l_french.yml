l_french:
 operation_rescue_general: "Sauvetage du commandant capturé"
 operation_rescue_general_desc: "§LL'un de nos commandants a été capturé par l'ennemi. Nous devons mener une opération de sauvetage pour lui venir en aide.§!"
 free_general_free_in_transit: "Libération durant le transport"
 free_general_free_in_transit_desc: "Nous avons appris le transfert imminent de notre agent, c'est l'occasion pour nous de l'intercepter et de tendre une embuscade durant le transport."
 free_general_assault_holding_area: "Zone de détention pour l'assaut"
 free_general_assault_holding_area_desc: "L'ennemi détient notre commandant dans un lieu sûr que nos agents sont parvenus à repérer. Nous allons préparer un assaut pour lui venir en aide."
 free_general_disguise_and_extract: "Distraction et extraction"
 free_general_disguise_and_extract_desc: "Grâce à leur ingéniosité, nos agents aideront le commandant en détention à passer incognito, ce qui leur permettra de tromper les ravisseurs et de revenir en territoire allié."
