 emperor_fascism: "Fascisme impérial"
 emperor_fascism_desc: "Le fascisme impérial, ou « fascisme hiérarchique », est une forme d'ultranationalisme qui supprime la voix des masses. Le pouvoir est détenu par des bureaucrates militaires et aristocrates, qui eux-mêmes vouent un culte à l'empereur, la figure divine et infaillible de la nation."
 japan_militarism_ideology: "Militarisme"
 japan_militarism_ideology_desc: "Le militarisme est une idéologie qui prône un contrôle uniquement nominatif au dirigeant de la nation, agissant plutôt comme un fantoche de l'armée. C'est lui qui promulgue le programme militaire, avec pour seul but un expansionnisme débridé."
 buddhist_socialism: "Socialisme bouddhiste"
 buddhist_socialism_desc: "Le socialisme bouddhiste, aussi appelé socialisme naturel ou dhammique, est une idéologie politique qui défend le socialisme en s'appuyant sur les principes du bouddhisme. En effet, ces mouvements cherchent tous deux à mettre fin à la souffrance par l'analyse et la suppression de ses causes concrètes. De plus, ils cherchent également à atteindre la transformation de la conscience personnelle afin de mettre fin à l'aliénation et l'égoïsme humains."
