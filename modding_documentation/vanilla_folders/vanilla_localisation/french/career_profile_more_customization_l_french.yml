 CAREER_PROFILE_RACE_FOR_THE_BOMB_SILVER: "La fin de 1944"
 CAREER_PROFILE_RACE_FOR_THE_BOMB_BRONZE: "La fin de 1945"
 CAREER_PROFILE_KNOWLEDGE_IS_POWER_GOLD: "$VALUE|0H$ scientifique de niveau 5"
 CAREER_PROFILE_KNOWLEDGE_IS_POWER_SILVER: "$VALUE|0H$ scientifiques de niveau 4"
 CAREER_PROFILE_KNOWLEDGE_IS_POWER_BRONZE: "$VALUE|0H$ scientifiques de niveau 3"
 CAREER_PROFILE_GRAND_STRATEGIKON_BRONZE: "4 doctrines secondaires maîtrisées"
