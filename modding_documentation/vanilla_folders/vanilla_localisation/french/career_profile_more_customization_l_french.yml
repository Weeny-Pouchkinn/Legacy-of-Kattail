 CAREER_PROFILE_POLISH_MY_HQ_BRONZE: "1 000£GFX_production_cost"
 CAREER_PROFILE_POLISH_MY_HQ_SILVER: "2 250£GFX_production_cost"
 CAREER_PROFILE_POLISH_MY_HQ_GOLD: "4 500£GFX_production_cost"
 CAREER_PROFILE_DIRTY_MATH_BRONZE: "12 niveaux"
 CAREER_PROFILE_DIRTY_MATH_SILVER: "42 niveaux"
 CAREER_PROFILE_DIRTY_MATH_GOLD: "67 niveaux"
 #Ribbons
 CAREER_PROFILE_SYNTHETIC_SECURITY: "Sécurité de synthèse"
 CAREER_PROFILE_SYNTHETIC_SECURITY_DESCRIPTION: "Disposer d'au moins 30 unités de caoutchouc artificiel (raffineries de brut synthétique)."
 CAREER_PROFILE_SYNTHETIC_SECURITY_QUOTE: "Si les femmes qui travaillent dans les usines s'arrêtaient vingt minutes, les Alliés perdraient la guerre.\n\n(Joseph Joffre, pendant la Première Guerre mondiale)"
 CAREER_PROFILE_RUBBER_BARON: "Baron du caoutchouc"
 CAREER_PROFILE_RUBBER_BARON_DESCRIPTION: "Disposer d'au moins 1000 unités de caoutchouc tout en ayant une économie fermée."
 CAREER_PROFILE_RUBBER_BARON_QUOTE: "La prise de contrôle des principales zones productrices de caoutchouc en Extrême-Orient en 1942 a réduit de 90% les sources d'approvisionnement de la production mondiale de caoutchouc naturel.\n\n(Southern Economic Journal, janvier 1947)"
 CAREER_PROFILE_THE_TRUCK_WILL_ALWAYS_GET_THROUGH: "Les camions passeront toujours"
 CAREER_PROFILE_THE_TRUCK_WILL_ALWAYS_GET_THROUGH_DESCRIPTION: "Disposer d'au moins 5000 camions ravitaillant les armées."
 CAREER_PROFILE_THE_TRUCK_WILL_ALWAYS_GET_THROUGH_QUOTE: "Ils disaient que les bombardiers passeraient toujours. Mais les camions étaient déjà là.\n\n(Inconnu)"
 CAREER_PROFILE_MARE_NOSTRUM: "Mare nostrum"
 CAREER_PROFILE_MARE_NOSTRUM_DESCRIPTION: "Disposer de la domination navale dans les six principales régions maritimes de la Méditerranée, dont au moins une est contestée."
 CAREER_PROFILE_MARE_NOSTRUM_QUOTE: "Quand j'ai perdu mon fusil, l'Armée m'a fait payer 85 dollars. C'est pour ça que dans la Navy le capitaine préfère couler avec son navire.\n\n(Dick Gregory)"
 CAREER_PROFILE_BLITZ_THIS: "Effet de fronde"
 CAREER_PROFILE_BLITZ_THIS_DESCRIPTION: "Choisir la défense élastique comme tactique favorite d'un général, d'un maréchal ou du pays."
 CAREER_PROFILE_BLITZ_THIS_QUOTE: "Il suffit de faire revenir les lignes, comme un archer qui tire sur son arc. Puis de relâcher.\n\n(Inconnu)"
 CAREER_PROFILE_SCORCHED_EARTH: "Terre brûlée"
 CAREER_PROFILE_SCORCHED_EARTH_DESCRIPTION: "Détruire les chemins de fer grâce au mécanisme de terre brûlée pour ralentir l'avancée de l'ennemi."
 CAREER_PROFILE_SCORCHED_EARTH_QUOTE: "L'ennemi ne doit pas mettre la main sur le moindre moteur, le moindre wagon, la moindre livre de blé ou le moindre litre de fioul.\n\n(Staline, discours radiodiffusé, 3 juillet 1941)"
 CAREER_PROFILE_RULED_BY_FURNITURE: "Fauteuil vide"
 CAREER_PROFILE_RULED_BY_FURNITURE_DESCRIPTION: "N’avoir aucun personnage ou ensemble de personnages représenté graphiquement à la tête du pays."
 CAREER_PROFILE_RULED_BY_FURNITURE_QUOTE: "Le tracas c'est comme un fauteuil à bascule : ça donne quelque chose à faire mais ça ne mène nulle part.\n\n(Ancien proverbe anglais)"
 CAREER_PROFILE_THE_THOUSAND_YEAR_BOND: "Bond de mille ans"
 CAREER_PROFILE_THE_THOUSAND_YEAR_BOND_DESCRIPTION: "Déployer sur le terrain 100 bataillons de cavalerie ou de chamellerie."
 CAREER_PROFILE_THE_THOUSAND_YEAR_BOND_QUOTE: "Pour être une bonne monture, un cheval doit être un peu fou. Et son cavalier doit l'être complètement.\n\n(Steven Pressfield)"
 CAREER_PROFILE_ROCKETS_REIGN: "Fuséomanie"
 CAREER_PROFILE_ROCKETS_REIGN_DESCRIPTION: "Construire plus de 10 sites de lancement de fusées."
 CAREER_PROFILE_ROCKETS_REIGN_QUOTE: "La fusée a parfaitement fonctionné, mais a atterri sur la mauvaise planète.\n\n(Wernher von Braun)"
 CAREER_PROFILE_STEEL_AT_HIGH_SPEED: "Acier rapide"
 CAREER_PROFILE_STEEL_AT_HIGH_SPEED_DESCRIPTION: "Déployer plus de 4000 chars ayant une vitesse maximale supérieure à 12 km/h."
 CAREER_PROFILE_STEEL_AT_HIGH_SPEED_QUOTE: "Si tout paraît être sous contrôle, c'est que vous n'avancez pas assez vite\n\n(Mario Andretti)"
 CAREER_PROFILE_ORCHESTRA_OF_BOOM: "Concert explosif"
 CAREER_PROFILE_ORCHESTRA_OF_BOOM_DESCRIPTION: "Déployer une division comprenant au moins un bataillon anti-aérien, un d'artillerie, un de lance-roquettes et un anti-char, soutenue par une compagnie de transmission."
 CAREER_PROFILE_ORCHESTRA_OF_BOOM_QUOTE: "C'était un véritable crescendo de bruits, si continus qu'ils se mêlaient et fusionnaient en un seul rugissement écrasant, celui d'un train dans un tunnel amplifié encore un million de fois.\n\n(Arnold D. Harvey)"
 CAREER_PROFILE_TASK_FAILED_SUCCESSFULLY: "Réussite de l'échec de mission"
 CAREER_PROFILE_TASK_FAILED_SUCCESSFULLY_DESCRIPTION: "Échouez à un raid ayant 80% ou plus de chances de succès."
 CAREER_PROFILE_TASK_FAILED_SUCCESSFULLY_QUOTE: "« Le raid doit être considéré comme une reconnaissance par la force... Il nous fallait obtenir toutes les informations nécessaires avant de lancer les opérations à une échelle bien plus vaste... »\n\n- Winston Churchill, à propos de l'assaut de Dieppe, le 8 septembre 1942"
 CAREER_PROFILE_PUNCH_IT: "Frappez !"
 CAREER_PROFILE_PUNCH_IT_DESCRIPTION: "Accomplissez un raid contre un site nucléaire alors qu'au moins l'un de ses États voisins est sous votre contrôle."
 CAREER_PROFILE_PUNCH_IT_QUOTE: "« Pour le bien de la vie de la nation, il était nécessaire de restaurer la volonté de mourir de l'armée. »\n\n - Alexandre Kerenski, à propos de l'offensive de juin"
 CAREER_PROFILE_PLAN_L: "Plan L"
 CAREER_PROFILE_PLAN_L_DESCRIPTION: "En commençant comme pays enclavé, réalisez 2 projets spéciaux navals, construisez 10 destroyers, 5 croiseurs, 2 cuirassés et 1 porte-avions."
 CAREER_PROFILE_PLAN_L_QUOTE: "« Il faut trois ans à la marine pour construire un navire. Il faudra trois siècles pour construire une nouvelle tradition. L'évacuation se poursuivra. »\n\n - Andrew Cunningham, à propos de l'évacuation de la Crète"
 CAREER_PROFILE_SWEETENER_HEXADECAGON: "Hexadécagone"
 CAREER_PROFILE_SWEETENER_HEXADECAGON_DESCRIPTION: "Menez des recherches sur 16 technologies débloquées lors de projets spéciaux."
 CAREER_PROFILE_SWEETENER_HEXADECAGON_QUOTE: "« Quand j'ai terminé ces calculs, nous avons songé qu'il était possible qu'ils déclenchent une réaction en chaîne qui détruirait le monde entier »\n\n - Robert Oppenheimer, Oppenheimer"
 CAREER_PROFILE_ISLAND_HOPPER: "D'île en île"
 CAREER_PROFILE_ISLAND_HOPPER_DESCRIPTION: "Prendre le contrôle de 10 sites stratégiques."
 CAREER_PROFILE_ISLAND_HOPPER_QUOTE: "« Tu veux vivre ?! Reste pas sur la plage ! »\n\n(John Basilone, L'Enfer du Pacifique)"
 CAREER_PROFILE_IM_THE_CAPTAIN_NOW: "C'est moi le capitaine maintenant"
 CAREER_PROFILE_IM_THE_CAPTAIN_NOW_DESCRIPTION: "Diriger une faction en tant que nation mineure."
 CAREER_PROFILE_IM_THE_CAPTAIN_NOW_QUOTE: "« Regarde-moi. C'est moi le capitaine maintenant. »\n\n(Muse, Capitaine Phillips)"
 CAREER_PROFILE_THREE_MUSKETEERS: "Les Trois Mousquetaires"
 CAREER_PROFILE_THREE_MUSKETEERS_DESCRIPTION: "Établir trois théâtres de faction supervisés par vos officiers."
 CAREER_PROFILE_THREE_MUSKETEERS_QUOTE: "« Tous pour un, un pour tous ; c'est notre devise. »\n\n(Alexandre Dumas)"
 CAREER_PROFILE_THE_MORE_THE_MERRIER: "Plus on est de fous, plus on rit"
 CAREER_PROFILE_THE_MORE_THE_MERRIER_DESCRIPTION: "Avoir un bonus de partage des recherches de faction de 30%."
 CAREER_PROFILE_THE_MORE_THE_MERRIER_QUOTE: "« Nul homme n'est une île, complète en elle-même ; chaque homme est un morceau du continent, une part de l'ensemble. »\n\n(John Donne)"
 CAREER_PROFILE_IM_HERE_TO_RESCUE_YOU: "Je viens vous sauver !"
 CAREER_PROFILE_IM_HERE_TO_RESCUE_YOU_DESCRIPTION: "Réussir un raid pour sauver un commandant en détention."
 CAREER_PROFILE_IM_HERE_TO_RESCUE_YOU_QUOTE: "« Navrés, nous avons un peu de retard. »\n\n(Lord Lovat)"
 CAREER_PROFILE_DEJA_VU: "Déjà-vu"
 CAREER_PROFILE_DEJA_VU_DESCRIPTION: "Réussir une mission d'espionnage pour sauver un commandant en détention."
 CAREER_PROFILE_DEJA_VU_QUOTE: "« Lorsque j'ai mentionné à nouveau une mission de secours, nous sommes partis à l'action. »\n\n(Major Lapham)"
 CAREER_PROFILE_THE_MORE_THINGS_CHANGES: "Plus ça change et plus c'est la même chose"
 CAREER_PROFILE_THE_MORE_THINGS_CHANGES_DESCRIPTION: "Maîtriser complètement 2 doctrines secondaires des forces spéciales."
 CAREER_PROFILE_THE_MORE_THINGS_CHANGES_QUOTE: "« Nous étions accessoires, notre survie n'était qu'un bonus. »\n\n(Major General Colin Gubbins)"
 CAREER_PROFILE_FULLY_DECKED_OUT: "Tout compris"
 CAREER_PROFILE_FULLY_DECKED_OUT_DESCRIPTION: "Former et déployer une division composée de 5 unités de soutien divisionnaires et de 5 unités de soutien régimentaires."
 CAREER_PROFILE_FULLY_DECKED_OUT_QUOTE: "« En cas de doute, passez à l'attaque. »\n\n(George Patton)"
 #Statistics
 CAREER_PROFILE_AIRSPACE_SUPERIORITY_RATING_LABEL: "Proportion de supériorité aérienne contestée"
 CAREER_PROFILE_CIVILIAN_FACTORIES_BUILT_LABEL: "Usines civiles construites"
 CAREER_PROFILE_MILITARY_FACTORIES_BUILT_LABEL: "Usines militaires construites"
