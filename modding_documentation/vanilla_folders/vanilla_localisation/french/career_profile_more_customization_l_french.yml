 #Medals
 CAREER_PROFILE_MODERN_VERDUN: "Verdun moderne"
 CAREER_PROFILE_MODERN_VERDUN_DESCRIPTION: "Livrer une bataille sans interruption pendant un certain nombre de jours."
 CAREER_PROFILE_NEVERMINE_ME_MEDAL: "Mine de rien"
 CAREER_PROFILE_NEVERMINE_ME_MEDAL_DESCRIPTION: "Placer plus de 500 mines dans un certain nombre de régions maritimes."
 CAREER_PROFILE_QUALITY_OVER_QUANTITY: "Qualité plus que quantité"
 CAREER_PROFILE_QUALITY_OVER_QUANTITY_DESCRIPTION: "Avoir une proportion de pertes positive après avoir infligé au moins un million de pertes à l'ennemi."
 CAREER_PROFILE_BRAINS_AND_BRUTE_FORCE_MEDAL: "Cerveau et force brute"
 CAREER_PROFILE_BRAINS_AND_BRUTE_FORCE_MEDAL_DESCRIPTION: "Déchiffrer un certain nombre de codes."
 CAREER_PROFILE_I_AM_INEVITABLE: "Je suis inévitable"
 CAREER_PROFILE_I_AM_INEVITABLE_DESCRIPTION: "Gagner au moins une province par semaine pendant un certain nombre de semaines."
 CAREER_PROFILE_FINESSE_IS_FASTER: "La finesse est plus rapide"
 CAREER_PROFILE_FINESSE_IS_FASTER_DESCRIPTION: "Tout en décryptant un code, avoir une opération « Capturer le code » permettant de réduire le temps de décryptage d’un certain nombre de jours."
 CAREER_PROFILE_CARGO_EMBARGO: "S'embarquer dans les embargos"
 CAREER_PROFILE_CARGO_EMBARGO_DESCRIPTION: "Imposer l'embargo à un certain nombre de pays."
 CAREER_PROFILE_PRODUCTION_IS_POWER: "La production fait la force"
 CAREER_PROFILE_PRODUCTION_IS_POWER_DESCRIPTION: "Construire un certain nombre de nouvelles usines civiles ou militaires."
 CAREER_PROFILE_ENGINEERING_BEHEMOTH_MEDAL: "Colosse d'ingénierie"
 CAREER_PROFILE_ENGINEERING_BEHEMOTH_MEDAL_DESCRIPTION: "Concevoir un char avec un certain seuil de blindage et en déployer au moins 1000 sur le terrain."
 CAREER_PROFILE_CASTLES_IN_THE_AIR_MEDAL: "Forteresses volantes"
 CAREER_PROFILE_CASTLES_IN_THE_AIR_MEDAL_DESCRIPTION: "Concevoir un avion ayant un certain seuil de défense aérienne et en déployer au moins une escadrille complète (soit 100 appareils)."
 CAREER_PROFILE_EXPERIMENTAL_SCIENCE_MASTERY: "Maîtrise de la science expérimentale"
 CAREER_PROFILE_EXPERIMENTAL_SCIENCE_MASTERY_DESCRIPTION: "Avant la fin de 1945, terminez la quantité suivante de projets spéciaux."
 CAREER_PROFILE_RACE_FOR_THE_BOMB: "Course à la bombe"
 CAREER_PROFILE_RACE_FOR_THE_BOMB_DESCRIPTION: "Menez à bien un raid nucléaire avant"
 CAREER_PROFILE_KNOWLEDGE_IS_POWER: "Le savoir, c'est le pouvoir"
 CAREER_PROFILE_KNOWLEDGE_IS_POWER_DESCRIPTION: "Ayez au moins la quantité suivante de scientifiques de talent"
 CAREER_PROFILE_GRAND_STRATEGIKON_MEDAL: "Grand Strategikon"
 CAREER_PROFILE_GRAND_STRATEGIKON_MEDAL_DESCRIPTION: "Maîtriser un certain nombre de doctrines secondaires."
 CAREER_PROFILE_PACTWEAVER_MEDAL: "Tissage de pactes"
 CAREER_PROFILE_PACTWEAVER_MEDAL_DESCRIPTION: "Atteindre un certain pourcentage d'achèvement du manifeste de faction."
 CAREER_PROFILE_OVERACHIEVER_MEDAL: "Toujours plus"
 CAREER_PROFILE_OVERACHIEVER_MEDAL_DESCRIPTION: "Atteindre un certain nombre d'objectifs de faction à long terme."
 CAREER_PROFILE_BOATS_UP_MEDAL: "Haut gradé"
 CAREER_PROFILE_BOATS_UP_MEDAL_DESCRIPTION: "Promouvoir un capitaine de navire au rang d'amiral, et atteindre le niveau de compétence suivant."
 CAREER_PROFILE_POLISH_MY_HQ_MEDAL: "QG des chefs"
 CAREER_PROFILE_POLISH_MY_HQ_MEDAL_DESCRIPTION: "Déployer un QG militaire qui a un coût de production d'au moins"
 CAREER_PROFILE_DIRTY_MATH_MEDAL: "Problème de math"
 CAREER_PROFILE_DIRTY_MATH_MEDAL_DESCRIPTION: "Capturer des commandants ennemis dont la somme des niveaux de compétence est au moins égale au nombre suivant."
 #New Medals TTs
