 DLC_DESCRIPTION_dlc018: "Nouveaux arbres de priorités nationaux et événements pour le Canada, l'Australie, la Nouvelle-Zélande, le Raj (Inde) et l'Afrique du Sud. Le plan de bataille en fer-de-lance permet offre un plus grand contrôle sur les encerclements majeurs et pour percer les lignes ennemies."
 DLC_DESCRIPTION_dlc020: "Quatre nouveaux arbres de priorités nationaux : revivez la guerre dans la situation complexe de la Hongrie, de la Roumanie, de la Tchécoslovaquie et de la Yougoslavie."
 DLC_DESCRIPTION_dlc022: "Arbres de priorités nationaux retravaillés pour l'Allemagne et le Japon, deux puissances majeures de l'Axe disposant désormais de branches alternatives, dont la possibilité de déposer Hitler ou d'installer le communisme ou la démocratie au Japon."
 DLC_DESCRIPTION_dlc023: "Profitez de nouveaux modèles de navires, de traits et de compétences pour les amiraux, de véhicules amphibies, et pour détourner le danger mouillez des mines navales qui protégeront les côtes et routes maritimes. Comprend de nouveaux arbres de priorités pour les Pays-Bas, le Royaume-Uni, le Mexique et les États-Unis."
 DLC_DESCRIPTION_dlc028: "La Résistance fait entrer dans le jeu les agents secrets, les missions d'espionnage et offre de nouvelles options pour les mouvements de résistance. Envoyez vos agents en territoire hostile pour déchiffrer les secrets de l'ennemi ou préparez le terrain avant l'invasion en recrutant des collaborateurs qui seront heureux de participer à l'exercice du pouvoir."
 DLC_DESCRIPTION_dlc031: "Ajoute des arbres de priorités nationaux pour les puissances mineures autour de la mer Noire et de l'Égée. Bulgarie, Grèce et Turquie peuvent désormais explorer des branches historiques et alternatives uniques afin de résister aux tentatives des puissances majeures de dominer les couloirs maritimes stratégiques du Bosphore et des Dardanelles."
 DLC_DESCRIPTION_dlc034: "No Step Back détaille davantage de nombreux pays d'Europe de l'Est, ajoute des mécanismes de jeu uniques pour refléter la scène politique soviétique, et améliore grandement les aspects militaires du jeu."
 DLC_DESCRIPTION_dlc036: "Construisez un nouvel empire, résistez aux agressions étrangères ou explorez les limites de la neutralité. By Blood Alone ajoute et multiplie les options d'histoire alternative et de gameplay pour l'Italie, l'Éthiopie et la Suisse, ainsi que de nombreux autres changements importants."
 DLC_DESCRIPTION_dlc038: "Réécrivez l'histoire des nations nordiques dans la guerre qui a chamboulé toute l'Europe. Explorez les arbres des priorités de la Finlande, de la Suède, du Danemark ou encore de la Norvège. Spécialisez vos industries de l'armement pour produire efficacement et revendre vos marchandises sur le tout nouveau marché international en pleine expansion."
 DLC_DESCRIPTION_dlc040: "Trial of Allegiance ajoute des arbres de priorités pour le Brésil, l'Argentine, le Chili, l'Uruguay et le Paraguay. La stabilité de tout le continent ne tient qu'à un fil. Abordez la guerre d'une nouvelle façon en courtisant des bienfaiteurs européens avec votre atout le plus précieux : votre allégeance."
 DLC_DESCRIPTION_dlc043: "Développez des prototypes novateurs de technologies et d'armes en tout genre pour anéantir vos ennemis. Menez des raids sur vos adversaires pour détruire leurs bâtiments de recherche, leurs barrages ou autres points d'intérêts. Découvrez les nouveaux arbres des priorités ; en Allemagne, pour atteindre vos objectifs à l'aide du Cercle intime, en Autriche ou en Hongrie pour restaurer l'empire des Habsbourg, ou encore en Belgique pour établir une alliance harmonieuse avec sa colonie, le Congo belge."
 DLC_DESCRIPTION_dlc046: "Graveyard of Empires présente des arbres de priorités uniques en Iran, au Raj, en Irak et en Afghanistan. Coupez court à l'ingérence des puissances extérieures et restaurez la fierté perdue de votre nation tandis que vous tentez d'asseoir votre domination sur le Moyen-Orient et l'Asie du Sud."
 DLC_DESCRIPTION_dlc049: "Forgez de nouvelles voies pour le Japon, la Chine et les Philippines dans No Compromise, No Surrender, la toute dernière extension de Hearts of Iron IV. Découvrez une nouvelle dimension pour les factions, promulguez des doctrines militaires inédites et dominez l'océan Pacifique."
 DLC_DESCRIPTION_dlc051: "Reformez le Royaume de Bohême, rassemblez les États d'Europe centrale sous une union toute puissante, érigez des fortifications redoutables et organisez un réseau d'alliés durables grâce au nouvel arbre des priorités de la Tchécoslovaquie disponible dans Peace for Our Time."
 DLC_DESCRIPTION_dlc052: "Prenez le commandement en envoyant vos généraux sur le front et remettez des médailles à vos capitaines de navire les plus méritants. Repoussez l'invasion japonaise en Asie du Sud-Est avec l'Australie ; bâtissez un nouvel empire avec le Siam ; et décidez de l'avenir de l'Indonésie, avec ou sans administration néerlandaise."
