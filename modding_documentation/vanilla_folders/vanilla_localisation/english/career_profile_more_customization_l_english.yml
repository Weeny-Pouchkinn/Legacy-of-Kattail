 # Ribbons
 CAREER_PROFILE_SYNTHETIC_SECURITY: "Synthetic Security"
 CAREER_PROFILE_SYNTHETIC_SECURITY_DESCRIPTION: "Gain over 30 units of rubber from artificial sources (synthetic refineries)."
 CAREER_PROFILE_SYNTHETIC_SECURITY_QUOTE: ""If the women in the factories stopped work for 20 minutes, the allies would lose the war."\n\n- French Field Marshal and Commander in Chief Joseph Joffre, WW1."
 CAREER_PROFILE_RUBBER_BARON: "Rubber Baron"
 CAREER_PROFILE_RUBBER_BARON_DESCRIPTION: "Control at least 1000 units of Rubber and have a Closed Economy."
 CAREER_PROFILE_RUBBER_BARON_QUOTE: ""...capture of the principal rubber producing areas of the Far East in 1942 eliminated the sources of 90 percent of the world's natural rubber production."\n\n- The Southern Economic Journal, January 1947"
 CAREER_PROFILE_THE_TRUCK_WILL_ALWAYS_GET_THROUGH: "The truck will always get through"
 CAREER_PROFILE_THE_TRUCK_WILL_ALWAYS_GET_THROUGH_DESCRIPTION: "Have over 5000 supply trucks deliver supply to armies."
 CAREER_PROFILE_THE_TRUCK_WILL_ALWAYS_GET_THROUGH_QUOTE: ""They said that the bomber would always get through. But the trucks were already there."\n\n- Unknown"
 CAREER_PROFILE_MARE_NOSTRUM: "Mare Nostrum"
 CAREER_PROFILE_MARE_NOSTRUM_DESCRIPTION: "Gain Naval Dominance in the six main sea-regions of the Mediterranean Sea, of which at least one is contested."
 CAREER_PROFILE_MARE_NOSTRUM_QUOTE: ""When I lost my rifle, the Army charged me 85 dollars. That is why in the Navy the Captain goes down with the ship."\n\n- Dick Gregory"
 CAREER_PROFILE_BLITZ_THIS: "Blitz this..."
 CAREER_PROFILE_BLITZ_THIS_DESCRIPTION: "Choose elastic defense as preferred strategy on a general, field marshal, or country."
 CAREER_PROFILE_BLITZ_THIS_QUOTE: ""Pull back the lines like an archer drawing a bow, then release."\n\n- Unknown"
 CAREER_PROFILE_SCORCHED_EARTH: "Scorched Earth"
 CAREER_PROFILE_SCORCHED_EARTH_DESCRIPTION: "Detonate railways using the "Scorched Earth" feature to slow down enemy advances."
 CAREER_PROFILE_SCORCHED_EARTH_QUOTE: ""..the enemy must not be left a single engine, a single railway car, not a single pound of grain or gallon of fuel."\n\n- Joseph Stalin, radio address, July 3, 1941"
 CAREER_PROFILE_RULED_BY_FURNITURE: "Ruled by Furniture!"
 CAREER_PROFILE_RULED_BY_FURNITURE_DESCRIPTION: "Have no single person or set of people depicted to be in charge of your nation."
 CAREER_PROFILE_RULED_BY_FURNITURE_QUOTE: ""Worrying is like a rocking chair, it gives you something to do, but it gets you nowhere."\n\n- Old English proverb"
 CAREER_PROFILE_THE_THOUSAND_YEAR_BOND: "The Thousand Year Bond"
 CAREER_PROFILE_THE_THOUSAND_YEAR_BOND_DESCRIPTION: "Deploy one hundred cavalry or camelry battalions."
 CAREER_PROFILE_THE_THOUSAND_YEAR_BOND_QUOTE: ""A horse must be a bit mad to be a good cavalry mount, and its rider must be completely so."\n\n- Steven Pressfield"
 CAREER_PROFILE_ROCKETS_REIGN: "Rockets Reign"
 CAREER_PROFILE_ROCKETS_REIGN_DESCRIPTION: "Build more than 10 rocket sites."
 CAREER_PROFILE_ROCKETS_REIGN_QUOTE: ""The rocket worked perfectly except for landing on the wrong planet."\n\n- Wernher Von Braun"
 CAREER_PROFILE_STEEL_AT_HIGH_SPEED: "Steel at High Speed"
 CAREER_PROFILE_STEEL_AT_HIGH_SPEED_DESCRIPTION: "Deploy over 4000 tanks with a Max Speed over 12km/h."
 CAREER_PROFILE_STEEL_AT_HIGH_SPEED_QUOTE: ""If everything seems under control, you're not going fast enough."\n\n- Mario Andretti"
 CAREER_PROFILE_ORCHESTRA_OF_BOOM: "Orchestra of Boom"
 CAREER_PROFILE_ORCHESTRA_OF_BOOM_DESCRIPTION: "Deploy a division containing at least one battalion of "Anti-Air", "Artillery", "Rocket Artillery" and "Anti-Tank", supported by a signal company."
 CAREER_PROFILE_ORCHESTRA_OF_BOOM_QUOTE: "\n"A veritable crescendo of sounds, so continuous as to merge and blend into a single annihilating roar, the roar of a train in a tunnel magnified a millionfold."\n\n- Arnold D. Harvey"
 CAREER_PROFILE_TASK_FAILED_SUCCESSFULLY: "Task Failed Successfully"
 CAREER_PROFILE_TASK_FAILED_SUCCESSFULLY_DESCRIPTION: "Fail a raid while having 80% success chance or higher."
 CAREER_PROFILE_TASK_FAILED_SUCCESSFULLY_QUOTE: ""The raid must be considered as a reconnaissance in force... We had to get all the information necessary before launching operations on a much larger scale..."\n\n- Winston Churchill, on Dieppe Raid, September 8, 1942"
 CAREER_PROFILE_PUNCH_IT: "Punch It!"
 CAREER_PROFILE_PUNCH_IT_DESCRIPTION: "Successfully raid a nuclear facility, while controlling at least one state neighboring the facility"
 CAREER_PROFILE_PUNCH_IT_QUOTE: ""For the sake of the nations life it was necessary to restore the army's will to die"\n\n - Alexander Kerensky on the June Offensive"
 CAREER_PROFILE_PLAN_L: "Plan L"
 CAREER_PROFILE_PLAN_L_DESCRIPTION: "Starting as a landlocked country, complete 2 naval special projects, build 10 destroyers, 5 cruisers, 2 battleships and 1 carrier."
 CAREER_PROFILE_PLAN_L_QUOTE: ""It takes the Navy three years to build a ship. It will take three hundred years to build a new tradition. The evacuation will continue."\n\n - Andrew Cunningham, on evacuation of Crete"
 CAREER_PROFILE_SWEETENER_HEXADECAGON: "Sweetener Hexadecagon"
 CAREER_PROFILE_SWEETENER_HEXADECAGON_DESCRIPTION: "Research 16 Technologies unlocked by Special Projects"
 CAREER_PROFILE_SWEETENER_HEXADECAGON_QUOTE: ""When I came to you with those calculations, we thought we might start a chain reaction that might destroy the entire world."\n\n - Robert Oppenheimer, Oppenheimer"
 CAREER_PROFILE_ISLAND_HOPPER: "Island Hopper"
 CAREER_PROFILE_ISLAND_HOPPER_DESCRIPTION: "Take control of 10 Strategic Locations"
 CAREER_PROFILE_ISLAND_HOPPER_QUOTE: ""You wanna live?! Get off the beach"\n\n - John Basilone, The Pacific"
 CAREER_PROFILE_IM_THE_CAPTAIN_NOW: "I'm the Captain Now"
 CAREER_PROFILE_IM_THE_CAPTAIN_NOW_DESCRIPTION: "As a minor nation, take over leadership of a faction"
 CAREER_PROFILE_IM_THE_CAPTAIN_NOW_QUOTE: ""Look at me, I'm the captain now."\n\n - Muse, Captain Philips"
 CAREER_PROFILE_THREE_MUSKETEERS: "The Three Musketeers"
 CAREER_PROFILE_THREE_MUSKETEERS_DESCRIPTION: "Establish three faction theaters that are manned by your officers"
 CAREER_PROFILE_THREE_MUSKETEERS_QUOTE: ""All for one and one for all, united we stand divided we fall."\n\n - Alexander Dumas" 
 CAREER_PROFILE_THE_MORE_THE_MERRIER: "The More the Merrier"
 CAREER_PROFILE_THE_MORE_THE_MERRIER_DESCRIPTION: "Have a faction research sharing bonus of 30%"
 CAREER_PROFILE_THE_MORE_THE_MERRIER_QUOTE: ""No man is an island, entire of itself, every man is a piece of the continent, a part of the main." \n\n - John Donne"
 CAREER_PROFILE_IM_HERE_TO_RESCUE_YOU: "I'm Here to Rescue You!"
 CAREER_PROFILE_IM_HERE_TO_RESCUE_YOU_DESCRIPTION: "Successfully use a Raid to rescue your captured Commander"
 CAREER_PROFILE_IM_HERE_TO_RESCUE_YOU_QUOTE: ""I'm sorry we're a few minutes late." \n\n - Lord Lovat"
 CAREER_PROFILE_DEJA_VU: "Déjà Vu"
 CAREER_PROFILE_DEJA_VU_DESCRIPTION: "Successfully use Spy Operation to rescue your captured Commander"
 CAREER_PROFILE_DEJA_VU_QUOTE: ""I raised the question [of a rescue] again. This time it prompted action." \n\n - Major Lapham"
 CAREER_PROFILE_THE_MORE_THINGS_CHANGES: "The More Things Change, The More They Stay the Same"
 CAREER_PROFILE_THE_MORE_THINGS_CHANGES_DESCRIPTION: "Fully Master 2 Special Forces Subdoctrines"
 CAREER_PROFILE_THE_MORE_THINGS_CHANGES_QUOTE: ""We were expendable. We were a bonus, that's all." \n\n - Major General Colin Gubbins"
 CAREER_PROFILE_FULLY_DECKED_OUT: "Fully Decked Out"
 CAREER_PROFILE_FULLY_DECKED_OUT_DESCRIPTION: "Design and Deploy a Division that has 5 Divisional Support Units and 5 Regimental Support Units"
 CAREER_PROFILE_FULLY_DECKED_OUT_QUOTE: ""In case of doubt, attack" \n\n - George Patton"
