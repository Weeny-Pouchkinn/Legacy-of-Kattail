l_english:
operation_rescue_general: "Rescue Captured Commander"
operation_rescue_general_desc: "§LOne of our Commanders has been taken by the enemy and is being held captive. We must mount an operation to rescue them.§!"
free_general_free_in_transit: "Free During Transit"
free_general_free_in_transit_desc: "Our operatives have identified an impending transfer of the asset, and will plan an opportunity to intercept and ambush the transit en route."
free_general_assault_holding_area: "Assault Holding Area"
free_general_assault_holding_area_desc: "The enemy is holding our Commander in a secure location, which has been found by our operatives. They will prepare a daring assault in order to break out the captive."
free_general_disguise_and_extract: "Disguise & Extract"
free_general_disguise_and_extract_desc: "Using expert cunning our operatives will help the captured Commander in creating a disguise, allowing them to trick their captors and escape to friendly territory"
