  idea_SIA_weather_broadcasts: "Weather Broadcasts"
  idea_SIA_weather_broadcasts_desc: "Regular weather broadcasts give our air and naval forces a clearer picture of conditions, improving their effectiveness and reducing the risks of operating in poor weather."
  idea_SIA_seri_thai_contacts: "Seri Thai Contacts"
  idea_SIA_seri_thai_contacts_desc: "Contacts with the Seri Thai resistance network are proving their worth, bringing in experienced fighters and strengthening ties with the Allies."
