  ###   SIAM   ###
  ################
  SIA_the_khana_ratsadon: "The Khana Ratsadon"
  SIA_the_khana_ratsadon_desc: "The People's Party ended absolutism and opened the path to constitutional government. Its legacy has been contested, betrayed, and bloodied, but it remains the foundation upon which a modern [SIA.GetName] can be built."
  SIA_the_khana_ratsadon_tt: "\nThe §YKhana Ratsadon§! becomes active.\n\nThe §YKhana Ratsadon§! is the leading party in [ROOT.GetName], which is divided into the §YArmy Wing§! and the §YCivilian Wing§!.\n\nThe §YCivilian Wing§! generally likes pro-democracy policies with a focus on civilian industries, whereas the §YMilitary Wing§! generally likes pro-fascist policies and militarization of industry.\n\nOur choices will lead them to either like us more or less, giving different bonuses or maluses.\nShould they become rebellious they might try to launch a coup.\n\nThe different approval states are §YRebellious§!, §YIn Opposition§!, §YNeutral§!, §YSlight Support§! and §YFull Support§!"
  SIA_shuffle_pridi_to_the_minister_of_interior: "Strengthening the Civilian Wing Position"
  SIA_shuffle_pridi_to_the_minister_of_interior_desc: "By shuffling Pridi to the position of Minister of Interior rather than Minister of Foreign Affairs, he could more effectively control the allocation of government resources and serve as a brake on encroaching military influence."
  SIA_shuffle_pridi_to_the_minister_of_interior_tt: "§Y$anti_fascist_raids$§! will now increase the §YCivilian wings§! approval, and reduce the §YMilitary wings§! approval"
  SIA_civil_nationalism: "Civil Nationalism"
  SIA_civil_nationalism_desc: "Every Thai, regardless of status should know that their loyalty should not be to one government, or one person, but rather to uphold the values of liberty, freedom and equality, no matter who currently sits upon the throne of power."
  SIA_the_true_heirs_of_1932: "The True Heirs of 1932"
  SIA_the_true_heirs_of_1932_desc: "The military likes to frame the revolution of 1932 as their sole achievement, brushing away the fact that it was a victory for the people. The people only need to be reminded of that fact, and from them we will gather strength."
  SIA_thammasat_university: "Thammasat University"
  SIA_thammasat_university_desc: "Thammasat as a newly established university could, and should, be expanded upon to pave way for a new age of Thai innovation."
  SIA_defenders_of_constitutional_liberty: "Defenders of Constitutional Liberty"
  SIA_defenders_of_constitutional_liberty_desc: "Teachers, Bankers, Nurses - the educated middle strata can be galvanized and mobilized to defend liberty should the military wing go too far."
  SIA_dominate_public_symbols: "Dominate Public Symbols"
  SIA_dominate_public_symbols_desc: "The Military Wing has long dominated public symbols, erecting statues and declaring public holidays celebrating itself. We need to counter this by establishing symbols of our own, celebrating the People's right to self determination, and victory over the autocracy of old."
  SIA_civil_service_heroism: "Civil Service Heroism"
  SIA_civil_service_heroism_desc: "Every Thai must be instilled with an inherent duty to protect the rule of law, should any power, foreign or domestic, try and seize that power for themselves. Not only do we need the support of the people should someone try and take our liberties away, but we need the people act as standard bearers themselves."
  SIA_spread_democratic_sentiment_in_universities: "Spread Democratic Sentiment in Universities"
  SIA_spread_democratic_sentiment_in_universities_desc: "Academics harbor within them the future direction of [SIA.GetName]. What they learn today will echo into the future, and by ingraining the scholars of today with a strong sense of democratic duty we might spread it beyond the confines of the scholarly halls."
  SIA_sideline_disloyal_officers: "Sideline Disloyal Officers"
  SIA_sideline_disloyal_officers_desc: "The army officer corps is not a monolith. Within its ranks sit men whose loyalties belong to former patrons, rival factions, or their own ambitions rather than to the government. With careful reassignments and administrative pressure, these figures can be moved to postings where they pose no threat, while those who have demonstrated their reliability are given the responsibilities they deserve."
  SIA_sideline_disloyal_officers_tt: "Two random generals will get the §YReassigned§! trait for 4 years, causing them to not give bonuses.\nTwo random generals that does not have the §YReassigned§! trait will get extra stats and an extra positive trait."
  SIA_direct_funds_from_the_military_towards_development: "Direct Funds from the Military Towards Development"
  SIA_direct_funds_from_the_military_towards_development_desc: "Although the Military Wing will be displeased that its funding is being redirected toward development, it will be their responsibility, not ours, to explain to the public why this lack of investment is ultimately beneficial to them."

  SIA_as_the_eyes_turn_towards_southeast_asia: "As The Eyes Turn Towards Asia"
  SIA_as_the_eyes_turn_towards_southeast_asia_desc: "Southeast Asia is no longer a distant theater. It is the crossroads of empire, revolution, and war. [SIA.GetName] must decide whether it will be a pawn in this struggle or a power with its own designs."
  SIA_support_songsuradets_military_clique: "Support Songsuradets Military Clique"
  SIA_support_songsuradets_military_clique_desc: "Not every officer is an enemy of the nation. Songsuradet and his loyalists offer a disciplined military alternative to the corrupt generals who brought Siam to the brink. With their support, order can be restored without surrendering the state to chaos."
  SIA_support_songsuradets_military_clique_tt: "Should a §YCivil War§! break out Songsuradet will support us, granting §Y3§! extra divisions\n§RIf we strengthen Songsuradet and then try to apprehend him via $SIA_the_songsuradet_rebellion$ he might resist.§!"
  SIA_the_royal_police_counterweight: "The Royal Police"
  SIA_the_royal_police_counterweight_desc: "The Royal Police acts as an independent force and can be leveraged against our opposition should they try and seize power for themselves."
  SIA_the_royal_police_counterweight_tt: "Should a §YCivil War§! break out the Royal Police will support us, granting §Y2§! extra divisions"
  SIA_for_the_preservation_of_siamese_independence: "Consolidate Military Wing Control"
  SIA_for_the_preservation_of_siamese_independence_desc: "The last century has seen the powers of the world encroaching on the [SIA.GetAdjective] territorial integrity, and this century seems to be no different. We must act decisively if we are to preserve our way of life, lest we be left a rump state, crippled, divided, and torn apart."
  SIA_for_the_preservation_of_siamese_independence_tt: "§Y$anti_democratic_raids$§! will now increase the §YMilitary Wings§! approval, and reduce the §YCivilian wings§! approval"
  SIA_the_peoples_day: "The Peoples Day"
  SIA_the_peoples_day_desc: "Rather than placing further emphasis on the military's role in overthrowing the old monarchy, we should elevate the role of the people themselves. Establishing a People's Day will galvanize the nation, and teach our citizens to expect nothing less."
  SIA_hold_military_parades: "Hold Military Parades"
  SIA_hold_military_parades_desc: "To bolster military morale, reward our loyal generals, and remind our citizens of the might of the [SIA.GetAdjective] armed forces, we shall hold a grand parade through Bangkok. Let the newspapers have something worth printing!"
  SIA_embed_technocrats_in_civilian_institutions: "Embed Technocrats in Civilian Institutions"
  SIA_embed_technocrats_in_civilian_institutions_desc: "We can form alliances with technocrats in the government, using them as an extension of the civilian wing's arm to reach further and counter the military's influence."
  SIA_military_academies_indoctrination: "Military Academies Indoctrination"
  SIA_military_academies_indoctrination_desc: "Our military academies are the ideal targets for ideological training. They are well armed, and young cadets are easily influenced by their instructors. Win over the instructors, and you win over the military youth. A strong military, loyal to the ruling class, is the foundation of any powerful state, and powerful we will be."
  SIA_the_king_of_the_white_elephant: "The King of the White Elephant"
  SIA_the_king_of_the_white_elephant_desc: "Hysteria over reclaiming lost territories threatens to sweep the nation away, and the world is watching. To temper this zeal, we will produce an anti-war film, the first Thai movie shot in English, to show the world the true face of [SIA.GetName]."
  SIA_the_king_of_the_white_elephant_tt: "Unlocks the Propaganda Campaign §Y$SIA_the_king_of_the_white_elephant$§! when completing the §Y$SIA_sala_chaloem_thai_movie_theater$§! focus which yields:\nWeekly Stability: §G+0.45%§! for 180 day(s)"
  SIA_drum_up_irredentism: "Drum Up Irredentism"
  SIA_drum_up_irredentism_desc: "It is not enough to secure the military's support for a future war, we must also win the backing of the population at large. Through poems, films, and speeches, we will prepare [SIA.GetName] for a reckoning with the imperialist powers that stole our historic lands."
  SIA_sell_privy_purse_lands: "Sell Privy Purse Lands"
  SIA_sell_privy_purse_lands_desc: "The royal family holds vast tracts of land that are now under our control. These estates could significantly bolster our coffers, and portions can be sold at favorable prices to select officers to secure their loyalty."
  SIA_sell_privy_purse_lands_tt: "When the spirit expires §Y[SIA_phraya_phahon.GetName]§! will be embroiled in a scandal, allowing you to bypass the fascism requirement for §Y$SIA_phibuns_premiership$§!"
  SIA_war_fervor: "War Fervor"
  SIA_war_fervor_desc: "Drums sound in anticipation of the coming conflict. The people are primed, the match has been struck, and war fervor will soon reach its zenith. We must take care to direct this energy towards a worthy cause."
  SIA_war_fervor_tt: "War Support will increase permanently until we declare war on any other country, upon which the spirit will be removed.\n\nShould §YWar Support§! remain above §Y95%§! without a war declaration for too long a civil war will start.\nUpon war declaration: "
  SIA_the_midnight_meeting: "The Midnight Meeting"
  SIA_the_midnight_meeting_tt: "[SIA_plaek_phibunsongkhram.GetName] will seize power in [SIA.GetNameDef], leading the government. We will need to unseat him to restore the Monarchy proper."
  SIA_the_midnight_meeting_desc: "Field Marshal Songsuradet watches Phibun gather ever greater power and sees in it the promise of a reckoning. If the monarchy and Songsuradet are to survive then the royalists, senior officers, and civil notables must meet in secrecy and agree upon the removal of Phibun before he moves against them first."
  SIA_meet_with_king_prajadhipok: "Meet with King Prajadhipok"
  SIA_meet_with_king_prajadhipok_desc: "A conspiracy without a King is only another military intrigue. By meeting King Prajadhipok in exile, we can place their cause beneath the mantle of royal legitimacy and secure the blessing of the one man whose return may rally the hesitant and divide the regime."
  SIA_prajadhipok_audience_with_churchill: "Prajadhipok Audience with [ENG.GetLeader]"
  SIA_prajadhipok_audience_with_churchill_desc: "Prajadhipok's presence in [ENG.GetName] offers more than prestige alone. If he can convince [ENG.GetLeader] that a loyalist rising serves British interests in Asia, then weapons from Malaya may yet find their way into the hands of men still faithful to the throne."
  SIA_prajadhipok_audience_with_churchill_tt: "[ENG.GetName] will provide us with "
  SIA_prajadhipok_audience_with_churchill_tt2: "Upon the start of the civil war."
  SIA_facilitate_prajadhipoks_move_to_japan: "Facilitate Prajadhipoks Move to Japan"
  SIA_facilitate_prajadhipoks_move_to_japan_desc: "Britain is not the only power that may profit from turmoil in [ROOT.GetNameDef]. By arranging Prajadhipok's passage to Japan, we may secure Tokyo's favor and perhaps even an assurance that divisions will be made available should a royalist rising descend into civil war."
  SIA_facilitate_prajadhipoks_move_to_japan_tt: "3 Ranger Divisions from [JAP.GetNameDef] will support us during the civil war."
  SIA_the_kings_gambit: "The Kings Gambit"
  SIA_the_kings_gambit_desc: "Prajadhipok is to return to Bangkok in full expectation that the regime will place him under arrest. That act will furnish the royalists with the outrage, legitimacy and authority they require to cast aside hesitation and rise in his name. Once the exiled king is seized, the signal will be given and the struggle for [ROOT.GetName] will begin."
  SIA_the_kings_gambit_tt: "Our Support will depend on how many cliques we have on our side."
  SIA_restore_order: "Restore Order"
  SIA_restore_order_desc: "The civil war is won, but victory alone does not heal a kingdom. Rubble must be rebuilt, the old guard pacified and the administration rebuilt, so that [ROOT.GetName] may emerge from disorder with the Crown secure and public life returned to its proper course."
  SIA_ananda_age_trigger_12: "King Ananda is at least §Y12§! years old (Currently §Y[?var:SIA_anandas_age]§!). His Birthday is the 20th of September"
  SIA_ananda_age_trigger_15: "King Ananda is at least §Y15§! years old (Currently §Y[?var:SIA_anandas_age]§!). His Birthday is the 20th of September"
  SIA_ananda_trait_tt: "When Ananda ascends the throne he will get: "
  SIA_to_forge_a_king: "To Forge a King"
  SIA_to_forge_a_king_desc: "King Ananda remains far away in Switzerland, young enough that his mind and character are still being shaped. If we guide his studies carefully, we may yet forge not merely a crowned figurehead, but a ruler suited to the destiny we intend for [ROOT.GetNameDef]."
  SIA_to_forge_a_king_tt: "The Future King, Ananda Mahidol is currently young and studying in [SWI.GetName]. We can influence his future studies and interests, ensuring that he becomes a great king.\n\nEvery year, on his birthday, until he is 15, we will we will be able to pick an interest for him to study, which will grant different bonuses when he eventually ascends the throne.\n\nHis Birthdate is the 20th of September and his age is §Y[?var:SIA_anandas_age]§!"
  SIA_ascend_the_throne: "Ascend the Throne"
  SIA_ascend_the_throne_desc: "The years of regency cannot continue forever. Ananda is now of age to take up the burden of kingship himself, and his formal ascent to the throne will allow the restored monarchy to pass from guardianship and intrigue into a new and legitimate reign."
  SIA_the_provincial_council_of_state: "The Provincial Council of State"
  SIA_the_provincial_council_of_state_desc: "The fighting leaves the machinery of government broken and authority uncertain. Until the young King Ananda can rule in his own name, a Provincial Council of State must serve as the temporary government and proclaim that the loyalists fight not for themselves, but for the restoration of lawful monarchy."
  SIA_the_regency_of_boworadet: "The Regency of Boworadej"
  SIA_the_regency_of_boworadet_desc: "Prince Boworadej carries the prestige of the old order and none can doubt where his loyalties lie. By appointing him Regent in Ananda's name, we place the state in conservative hands and make clear that the restoration is to be more than a mere change of ministers."
  SIA_the_sacred_hierarchy: "The Sacred Hierarchy"
  SIA_the_sacred_hierarchy_desc: "Boworadej holds that the kingdom is strongest when every estate knows its place and the Crown stands above all temporal ambition. The monarchy, the faith and the natural hierarchy of [ROOT.GetNameDef] must again be treated as sacred pillars rather than relics to be bargained away."
  SIA_the_regency_of_songsuradet: "The Regency of Songsuradet"
  SIA_the_regency_of_songsuradet_desc: "Songsuradet is no liberal, but neither is he blind to the needs of a modern state. As Regent he can preserve royal authority while entrusting the future of [ROOT.GetNameDef] to discipline, planning and a military guided program of national development."
  SIA_order_discipline_and_unity: "Order Discipline and Unity"
  SIA_order_discipline_and_unity_desc: "The chaos of factional politics and civil war has nearly destroyed the realm. Songsuradet's answer is plain: order in government, discipline in society and unity in purpose, so that the kingdom may be remade into a stronger and more modern state."
  SIA_the_regency_of_rangsit: "The Regency of Rangsit"
  SIA_the_regency_of_rangsit_desc: "Prince Rangsit understands that the monarchy can endure only by reconciling itself with representative government. His regency offers a royal restoration that is conservative in dignity, but democratic in method and prepared to give [ROOT.GetNameDef] a stable parliamentary future."
  SIA_constitutional_virtue: "Constitutional Virtue"
  SIA_constitutional_virtue_desc: "A monarchy that respects law is harder to overthrow and easier to defend. Under Rangsit's guidance, we shall revive constitutional government, restrain arbitrary power and teach the nation that the Crown is most secure when it stands as guardian of lawful liberty."
  SIA_an_absolute_monarchy: "An Absolute Monarchy"
  SIA_an_absolute_monarchy_desc: "The experiment of limited monarchy has brought only humiliation, coups and the usurpation of royal authority by ambitious officers. If the throne is to command loyalty once more, then the Crown must recover its full prerogatives and rule without subordination to parties or parliament."
  SIA_a_constitutional_monarchy: "A Constitutional Monarchy"
  SIA_a_constitutional_monarchy_desc: "The throne need not dominate the state to preserve the kingdom. By restoring the monarchy within a durable constitutional settlement, we can bind Crown and people together and ensure that royal dignity coexists with responsible government."
  SIA_to_lay_the_bait: "To Lay the Bait"
  SIA_to_lay_the_bait_tt: "We will leak a fabricated economic plan to antagonize the military.\nThe longer we delay §Y$SIA_and_spring_the_trap$§!, the greater the backlash against the military and the stronger our support will grow.\n\n$SIA_dem_event_count_cw_scale_tt$\n\nEvery time the military criticizes the fake draft our support in the civil war will increase, up to a max of §Y75%§! civil war support. An additional §Y25%§! civil war support can be gained from our total democratic support (scaled from §Y0%-100%§!)"
  SIA_dem_event_count_cw_scale_tt: "§YCurrent Predicted support§!: §G[?var:SIA_dem_event_count_cw_scale|%]§!"
  SIA_to_lay_the_bait_desc: "The Yellow Dossier calls for economic reform, but the military will call it communist. By leaking a forged radical draft first, we can provoke their outrage, then discredit them when the real, milder version is released."
  SIA_and_spring_the_trap: "And Spring the Trap"
  SIA_and_spring_the_trap_desc: "The generals have taken the bait. Their outrage has become rebellion, their rebellion has exposed their ambitions, and the civilian government was ready. Now the trap closes, and the future of [ROOT.GetName] will be decided by those loyal to the constitution."
  SIA_and_spring_the_trap_tt: "If our total support is over §Y80%§! we will avoid a civil war and depose the military instantly."
  SIA_rebuild_the_war_torn_economy: "Rebuild the War Torn Economy"
  SIA_rebuild_the_war_torn_economy_desc: "The civil war has torn through roads, factories, rice fields, and trade routes. Reconstruction must begin at once. Wages, grain, rails, and credit will do more to stabilize [ROOT.GetName] than any speech from Bangkok."
  SIA_end_military_grift: "End Military Grift"
  SIA_end_military_grift_desc: "For too long, military budgets have fed private fortunes, patronage networks, and useless prestige projects. The war has exposed the rot. Every corrupt contract, ghost unit, and stolen shipment must be investigated and stripped from the old clique."
  SIA_the_purge: "The Purge"
  SIA_the_purge_desc: "The military clique has drenched the nation in blood rather than submit to civilian rule. There can be no compromise with traitors. Officers, collaborators, and sympathizers must be removed from every command before they can threaten the state again."
  SIA_achieve_foreign_legitimacy: "Achieve Foreign Legitimacy"
  SIA_achieve_foreign_legitimacy_desc: "Foreign powers have watched our crisis with suspicion, waiting to see whether Siam would collapse into junta rule or revolution. We must prove that the civilian government is stable, lawful, and capable of defending the country."
  SIA_achieve_foreign_legitimacy_trigger: "Any Major Power has more than §Y75§! Opinion of us"
  SIA_countries_that_like_me_doctrine_tt: "§Y[?var:SIA_countries_that_like_me]x§! §G50%§! Cost Reduction for: §YLand Doctrine§!"
  SIA_achieve_foreign_legitimacy_tt: "Gain §G[?var:SIA_achieve_foreign_legitimacy_base_stab_gain|%.0]§! stability for every major country that has more than §Y75§! opinion of us.\n\nIf more than §Y3§! major countries qualify, we will also gain §Y1x§! §G50%§! Cost Reduction for: §YLand Doctrine§! for every qualifying major country beyond that limit.\n\nIf §Y6§! or more major countries qualify, we will gain §G+2§! §YCivilian Factories§!."
  SIA_secure_the_state: "Secure the State"
  SIA_secure_the_state_desc: "Victory in the civil war does not mean stability. Railways, ports, arsenals, and communications hubs must be secured before reactionary officers can regroup. Bangkok must remain calm, connected, and firmly under civilian control."
  SIA_expand_upon_the_dossier: "Expand Upon the Dossier"
  SIA_expand_upon_the_dossier_desc: "The Yellow Dossier was written for a fragile moment. That moment has passed. With the military clique defeated, we can go further: deeper land reform, stronger labor protections, and a state capable of reshaping Siam from the ground up."
  SIA_military_oversight_bureau: "Military Oversight Bureau"
  SIA_military_oversight_bureau_desc: "The army cannot be allowed to become a state within the state again. A civilian-led oversight bureau will monitor appointments, budgets, and political activity within the armed forces, ensuring that the barracks answer to Bangkok, not the other way around."
  SIA_military_oversight_bureau_tt: "The §YMOB§! conducts investigations into generals every 5-9 months. During these periods, affected generals operate with reduced efficiency, wary of increased scrutiny."
  SIA_the_yellow_dossier: "The Yellow Dossier"
  SIA_the_yellow_dossier_desc: "The forged radical draft has done its work. Now the true Yellow Dossier can be implemented: measured reform, economic modernization, and political safeguards designed to break military dominance without handing the nation to chaos."
  SIA_achieve_domestic_legitimacy: "Achieve Domestic Legitimacy"
  SIA_achieve_domestic_legitimacy_desc: "The government has survived by force of arms, but it must now win by law, bread, and order. Public confidence must be restored, emergency measures must be justified, and the people must see that civilian rule offers more than merely survival."
  SIA_achieve_domestic_legitimacy_tt: "The §YKhana Ratsadon System§! will be disabled.\nThe §YMilitary Wing§! will be permanently dissolved, removing its spirit entirely.\n\nThe §YCivilian Wing§! will be permanently reorganized into §Y$idea_SIA_unwavering_civilian_support$§!."
  SIA_allies_integration: "Allies Integration"
  SIA_allies_integration_desc: "Our forces must learn to fight alongside the Allies. Command structures, communications, supply procedures, and equipment standards must be brought into line before Siam can become more than a symbolic partner."
  SIA_prepare_for_a_pacific_war: "Prepare for a Pacific War"
  SIA_prepare_for_a_pacific_war_desc: "The eyes of empires are turning toward the Pacific. Japan's ambitions, European colonies, and Allied strategy all point to a coming storm. Siam must prepare before the first shots reach our shores."
  SIA_the_end_of_gunboat_diplomacy: "The End of Gunboat Diplomacy"
  SIA_the_end_of_gunboat_diplomacy_desc: "Never again will foreign warships dictate terms from the mouth of the Chao Phraya. Siam must possess the guns, docks, mines, and coastal defenses needed to make any threat against Bangkok an act of madness."
  SIA_preemtive_strike: "Preemptive Strike"
  SIA_preemtive_strike_desc: "Waiting for Japan to choose the hour of war would be folly. If the empire intends to tear through Asia, then [SIA.GetName] must strike before its armies and fleets are fully committed elsewhere."
  SIA_the_siamese_armada: "The [SIA.GetAdjective] Armada"
  SIA_the_siamese_armada_desc: "A modern [SIA.GetName] requires a modern fleet. With new ships, trained crews, and expanded naval infrastructure, the [SIA.GetAdjective] Armada will become a force capable of defending our coasts and projecting power beyond them."
  SIA_asian_democratic_compact: "Asian Democratic Compact"
  SIA_a_more_moderate_option: "A More Moderate Option"
  SIA_a_more_moderate_option_desc: "Reform must endure, not burn itself out in a storm of opposition. By keeping the Yellow Dossier within moderate bounds, we can isolate extremists, calm the middle classes, and build a civilian order that survives its first victory."
  SIA_asian_democratic_compact_desc: "Asia cannot rely forever on distant empires or great-power promises. The democratic nations of the region must stand together, defend one another, and prove that independence and liberty can survive in Asia."
  SIA_asian_democratic_compact_tt: "Unlocks the ability to demand independence for Asian subject states, and allows us to invite them into our faction."
  SIA_asian_democratic_compact_modify: "Modifies §Y$SIA_asian_democratic_compact$§! by:"
  SIA_southeast_asia_joint_command: "Southeast Asia Joint Command"
  SIA_southeast_asia_joint_command_desc: "Our compact must become more than a diplomatic promise. A joint command will coordinate strategy, supply, intelligence, and defense planning across Southeast Asia, turning separate armies into a common shield."
  SIA_pan_asian_weapon_standardization: "Pan Asian Weapon Standardization"
  SIA_pan_asian_weapon_standardization_desc: "Every ally using different rifles, calibers, radios, and vehicles is an invitation to logistical failure. Standardized weapons and shared production plans will make our coalition stronger, cheaper, and faster to arm."
  SIA_united_against_aggression: "United Against Aggression"
  SIA_united_against_aggression_desc: "No member of our compact shall stand alone. Whether the threat comes from empire, fascism, militarism, or opportunist neighbors, the nations of Asia will answer together."
  SIA_the_hammers_that_strike: "The Hammers That Strike"
  SIA_the_hammers_that_strike_desc: "Our alliance is no longer a collection of small states hoping to survive. It is a weapon. Each nation is a hammer, and together we will strike against any power that seeks to dominate Asia."
  SIA_mobilize_the_defenders_of_siam: "Mobilize the Defenders of Siam"
  SIA_mobilize_the_defenders_of_siam_desc: "The old military failed the nation, but Siam still needs defenders. Volunteers, loyal officers, provincial guards, and patriotic citizens must be organized into a force that protects the constitution from enemies within and without."
  SIA_join_the_allies: "Join the Allies"
  SIA_join_the_allies_desc: "[ROOT.GetName] cannot stand alone while the world is consumed by war. The Allies offer weapons, recognition, and a place among nations resisting aggression. By joining them, we bind Siam's survival to the wider struggle for a free world."
  SIA_the_malay_peninsular_defense_plan: "The Malay Peninsular Defense Plan"
  SIA_the_malay_peninsular_defense_plan_desc: "If war comes to Southeast Asia, Malaya will be one of its first battlegrounds. Fortifications, supply depots, and joint planning with the British will turn the peninsula into a shield against invasion."
  SIA_the_malay_peninsular_defense_plan_tt: "Builds a railway between Bangkok and Singapore.\n\nEvery Victory Points in [MAL.GetName], Singapore, [724.GetName], [289.GetName] and [1076.GetName]\nAdd §G2§! §YCostal Fort§!\nAdd §G2§! §YLand Fort§!\nEach of these states:\nAdd §G1§! §YStatic Anti Air§!"
  SIA_join_the_united_front: "Join the United Front"
  SIA_join_the_united_front_desc: "China bleeds under [JAP.GetAdjective] aggression, yet it still fights. By joining the United Front, [SIA.GetName] can help turn the war on land into a graveyard for imperial ambition."
  SIA_a_land_war_in_asia_desc: "The war will not be won by declarations alone. Siamese soldiers must march, fight, and endure across the difficult terrain of Asia. Our commitment to the United Front must be measured in action."
  SIA_death_to_the_communists: "Death to the Communists"
  SIA_death_to_the_communists_desc: "The defeat of the military clique must not open the door to another tyranny. Communist agitators believe the crisis has weakened the state. They will soon learn that civilian democracy is not defenseless."
  SIA_death_to_the_nationalists: "Death to the Nationalists"
  SIA_death_to_the_nationalists_desc: "Japan has been driven back, but the question of Asia's future remains. The old nationalist order will only replace one hierarchy with another. If Asia is to be remade, the communists must prevail."
  SIA_a_new_dawn_over_asia: "A New Dawn Over Asia"
  SIA_a_new_dawn_over_asia_desc: "The Japanese empire has fallen, and the corrupt forces that sought to inherit its ruins have been cast aside. Across Asia, a new dawn rises over nations determined to build their future free from imperial domination."
  SIA_phibuns_premiership: "Phibuns Premiership"
  SIA_phibuns_premiership_desc: "As [SIA_phraya_phahon.GetName]s premiership comes to an end the party's chosen successor Plaek Phibunsongkhram stands ready to assume power. This will greatly please the military's standing with us, but make the civilian wing rear with angst.\nFor us there is only one way forward in this new age; with great conviction!"
  SIA_siamese_youth_movement: "[THIS.GetAdjective] Youth Movement"
  SIA_siamese_youth_movement_desc: "The young adults of [THIS.GetName] needs to be tempered, like steel over a hot flame. They will learn to respect the state, how to defend the motherland and become valuable members of Thai Society."
  SIA_territorial_defense_student: "Territorial Defense Student"
  SIA_territorial_defense_student_desc: "Expanding on the youth moment, the most promising candidates can be moved to junior soldier training camps, where they will aid in the defense of [SIA.GetNameDef]. They will receive proper military training and act as an additional tool the army can use."
  SIA_expand_domestic_arms_workshops: "Expand Domestic Arms Workshops"
  SIA_expand_domestic_arms_workshops_desc: "Our domestic capability to produce war material is pathetically behind other developed countries. We need to focus on the expansion of military production on home soil to make sure that our forces are constantly given new equipment."
  SIA_look_to_european_fascism: "Look to European Fascism"
  SIA_look_to_european_fascism_desc: "We have the opportunity to reform this country, unshackled by the past we shall look towards a new future, inspired by what is happening in the West. It is clear that the old world-order is being dismantled, and those who are left behind will suffer the consequences for their lack of vision."
  SIA_the_songsuradet_rebellion: "The Songsuradet Rebellion"
  SIA_the_songsuradet_rebellion_desc: "The senior officer Phraya Songsuradet is a threat to the present regime, should he wish to be. This danger to the regime cannot stand, and as the prime opponent to Phibun he must go.\nThere is undoubtedly ample damaging material that can be used against Songsuradet and his supporters, which would help consolidate our power and eliminate our domestic opponents."
  SIA_the_songsuradet_rebellion_historical_tt: "The General Phraya Songsuradet will be accused of conspiring against the state. He and the advisor §Y[SIA_rangsit_prayurasakdi.GetName]§! will be purged.\n\nWe will gain\n"
  SIA_the_songsuradet_rebellion_historical_tt2: "After it times out gain: "
  SIA_the_songsuradet_rebellion_historical_tt3: "for §Y[?var:SIA_purged_military_timer]§! day(s)"
  SIA_the_songsuradet_rebellion_alt_tt: "The General Phraya Songsuradet will be accused of conspiring against the state.\n\nHowever since we strengthened his military clique he might be emboldened and refuse the summons, leading to a standoff or potentially a civil war."
  SIA_sue_the_king_in_exile: "Sue the King in Exile"
  SIA_sue_the_king_in_exile_desc: "The king-in-exile is rumored to have taken quite a lot of valuables with him to [ENG.GetNameDefCap]. We should get them back, and if suing him and his spouse to achieve that then so be it."
  SIA_suspend_ordinary_legal_procedures: "Suspend Ordinary Legal Procedures"
  SIA_suspend_ordinary_legal_procedures_desc: "The Songsuradet Rebellion provides us with the opportunity to enact sweeping reforms in the name of national security. The checks and balances that are held by the courts and other political organs will be neutered, giving us the time needed to centralize power."
  SIA_the_duty_of_the_thai_people_during_the_war_act: "The Duty of the Thai People During War Act"
  SIA_the_duty_of_the_thai_people_during_the_war_act_desc: "$idea_SIA_cemented_control_3_desc$"
  SIA_recognize_manchukuo: "Recognize Manchukuo"
  SIA_recognize_manchukuo_desc: "TODO_CM"
  SIA_press_censorship: "Press Censorship"
  SIA_press_censorship_desc: "A free press risks undermining the stability of the state. While some leeway must exist we need to make sure that the government's voice and will is prioritized in the media."
  SIA_department_of_publicity: "Department of Publicity"
  SIA_department_of_publicity_desc: "A propaganda machine is imperative for any state, especially one such as ours with territorial ambitions. Funding a department of publicity will allow us to achieve this."
  SIA_thai_cultural_mandates: "Thai Cultural Mandates"
  SIA_thai_cultural_mandates_desc: "We can galvanize the Thai people and build a strong national culture by issuing mandates, strengthening the people's unity, and forging a unified identity."
  SIA_thai_cultural_mandates_tt: "Unlocks decisions to enact cultural mandates, giving various boosts for the cost of §YPolitical Power§!. Mandate One and the first other Mandate is free."
  SIA_relocate_the_capital_to_phetchabun: "Relocate the Capital to Phetchabun"
  SIA_relocate_the_capital_to_phetchabun_desc: "The Government is threatened! As history has proven, Bangkok is vulnerable against naval attacks and although it will certainly be an unpopular decision, moving the capital further inland is a decision that must be made."
  SIA_relocate_the_capital_to_phetchabun_tt: "Relocates up to §G3§! §YMilitary Factories§! from §Y[1076.GetName]§! to §Y[1077.GetName]§!\nRelocates §G3§! §YCivilian Factories§! from §Y[1076.GetName]§! to §Y[1077.GetName]§!\nBuilds Level §G3§! Forts around Petchabun"
  SIA_relocate_the_capital_to_phetchabun_tt2: "Upon the spirits timeout - Gain Base Stability: §R-25%§!"
  SIA_radio_propaganda: "Radio Propaganda"
  SIA_radio_propaganda_desc: "Radio is becoming a mainstay as [SIA.GetName] electrifies, and just as we should have a grip on the press we need to have a grip on what gets broadcasted."
  SIA_sala_chaloem_thai_movie_theater: "Sala Chaloem Thai Movie Theater"
  SIA_sala_chaloem_thai_movie_theater_tt: "Unlocks decisions to make propaganda movies, giving various boosts. For example:\n"
  SIA_sala_chaloem_thai_movie_theater_desc: "Movies are a new medium in our country, but its potential is bare for all to see. Just as with poems, books and radio it can fill the hearts and minds of commoner and elite. Using this medium we can strengthen the citizens resolve to see a great [SIA.GetName] rise."
  SIA_pan_thaiism: "Pan-Thaiism"
  SIA_pan_thaiism_desc: "It is not only enough for [ROOT.GetName] to live, but it needs to thrive. The future of the [ROOT.GetAdjective] people lies not in merely being resigned as a third-rate state but an active player in world affairs. First the people's hearts and minds must be galvanized against the imperialists that took away what once was ours, and remind people about what was taken from us."
  vichy_exist_trigger: "§YVichy France§! Exists"
  vichy_exist_not_trigger: "§YVichy France§! Exists Not"
  SIA_retake_lost_british_states: "Retake Lost British States"
  SIA_retake_lost_british_states_tt: "Unlocks the ability to launch limited wars against British territories in §YBurma§! and §YMalaysia§!"
  INS_retake_lost_british_states_tt: "Unlocks the ability to launch limited wars against British territories in §YMalaysia§!"
  SIA_retake_lost_british_states_desc: "It was not only the [FRA.GetAdjective] who divided our great kingdom, but also the [ENG.GetAdjective] who, driven by ambition, also seized every opportunity to claim their share. As their attention is fixed on greater rivals the moment has come for us to act."
  SIA_recover_indochina: "Recover Indochina"
  SIA_recover_indochina_desc: "The last century saw our country being fragmented by the [FRA.GetAdjective], a government across the world who has no business telling us what to do or how to live, and yet with gunboats and arms they took what was ours. In this century the power of the [FRA.GetAdjecive] is fading; this century is ours."
  SIA_recover_indochina_tt: "Unlocks the ability to launch limited wars against §YIndochina§! territories"
  SIA_demand_the_return_of_lost_territory: "Demand the Return of Lost Territory"
  SIA_demand_the_return_of_lost_territory_desc: "[FRA.GetNameDefCap] has shown its weakness, little more than a paper tiger clinging on to whatever fading influence it still has. With the collapse of its armed forced it can no longer project the strength it once had and are in no position to oppose our demands."
  SIA_demand_the_return_of_lost_territory_tt: "We will ask owners of §YIndochina§! and parts of §Y[MAL.GetName]§! to return §Y[1069.Getname]§!, §Y[1067.Getname]§!, §Y[741.Getname]§!, §Y[1068.Getname]§!, §Y[1061.Getname]§!, §Y[1064.Getname]§!, §Y[1065.Getname]§! and §Y[670.Getname]§! to us.\n\nInfluencing factors:\n-Fighting Strength of at least 30% compared to the owner\n-Owner is at war with a major\n-Owner is not in a faction\n-Owner is §YVichy France§!\n-We are in a faction\n-The owner dislikes us"
  SIA_the_greater_thai_empire: "The Greater Thai Empire"
  SIA_the_greater_thai_empire_available_trigger: "§Y[ROOT.GetName]§! controls every Indochinese State\nEvery Indochinese states compliance is more than: §Y[?var:SIA_greater_thai_empire_compliance_requirement]%§!\n\nAdditionally requires: "
  SIA_the_greater_thai_empire_desc: "The hour of our ascension is at hand. What was once taken has been restored, and with the people recognizing us as the de facto authority, we have firmly established our legitimacy as the rightful leaders of this renewed Great Thai Empire."
  SIA_crack_down_of_foreign_merchants: "Crack Down of Foreign Merchants"
  SIA_crack_down_of_foreign_merchants_desc: "Trade has long been shaped by external interests, creating vulnerabilities that may affect our national resilience. To safeguard our economic security we must be able to control our own trade, ensuring that prosperity and stability are built on a foundation we control ourselves."
  SIA_royal_palace_bureau_directive_no_1523: "Royal Palace Bureau Directive No 1523"
  SIA_royal_palace_bureau_directive_no_1523_desc: "With the surge of nationalism in the country even the crown has come out in support of the government, asking every member of the Royal Palace to donate 10% of their income to buy updated weaponry."
  SIA_end_factionalism: "End Factionalism"
  SIA_end_factionalism_desc: "The rift between the military and civilian wings of the Khana Ratsadon has shadowed every decision since the revolution. If we can keep both factions firmly behind the government long enough, we can at last fuse them into a single, united People's Party and lay the specter of the coup to rest for good."
  SIA_end_factionalism_available_tt: "Both the §YCivilian Wing§! and the §YMilitary Wing§! have been at §GFull Support§! for §Y270§! consecutive days."
  SIA_end_factionalism_tt: "The factional rivalry within the Khana Ratsadon is laid to rest:\n   The §YCivilian§! and §YMilitary§! wings are dissolved into a §Gunited People's Party§!\n   Gain the spirit §Y$idea_SIA_unified_khana_ratsadon$§!"
  SIA_turn_off_the_khana_ratsadon: "The Khana Ratsadon deactivated"

  SIA_factionalism_overcome: "Factionalism is overcome"
  SIA_new_territories_administration: "New Territories Administration"
  SIA_new_territories_administration_tt: "Unlocks decisions to administer §YIndochinese§! territories, giving increased compliance, industry and fortifications."
  SIA_new_territories_administration_desc: "Reclaiming our lost territories is only the beginning. We must demonstrate to those who live there that we are the a better choice. A comprehensive programme will be undertaken to elevate living standards for all, ensuring that every citizen feels equal within this new greater [ROOT.GetName]."
  SIA_new_territories_administration_available_trigger: "Any State in §YIndochina§!\n   Is Controlled By §Y[ROOT.GetName]§!"
  SIA_industrialization_drive: "Industrialization Drive"
  SIA_industrialization_drive_desc: "For generations, the wealth of [ROOT.GetName] has rested in rice fields and rural villages. Yet the modern world is shaped not by the plow but by the factory and the machine. If we are to preserve our independence among the great powers, we must transform our agrarian kingdom into an industrial nation."
  SIA_industrialization_drive_trigger: "The §YKhana Ratsadon§! is active"
  SIA_asian_financial_compact: "Asian Financial Compact"
  SIA_asian_financial_compact_desc: "European capital still dominates much of Asian trade, leaving our economy exposed to foreign pressure. By seeking closer financial arrangements with our neighbors, we can widen our access to credit, markets and investment without surrendering our independence."
  SIA_revision_of_unequal_treaties: "Revision of Unequal Treaties"
  SIA_revision_of_unequal_treaties_desc: "Old agreements signed from weakness still grant foreign interests privileges that no modern state should tolerate. We must revise these unequal treaties and restore [ROOT.GetNameDef]'s full authority over its commerce, courts and concessions."
  SIA_renegotiate_teak_control: "Renegotiate Teak Control"
  SIA_renegotiate_teak_control_desc: "Our northern forests enrich concessionaires while too little returns to the state. By renegotiating teak control, we can reclaim revenue, regulate extraction and ensure Siamese timber serves Siamese development."
  SIA_a_fledgling_tobacco_industry: "A Fledgling Tobacco Industry"
  SIA_a_fledgling_tobacco_industry_desc: "Tobacco remains a minor trade, scattered and poorly organized. With modest protection and careful investment, this small crop can become a dependable source of excise revenue, rural income and factory work."
  SIA_a_fledgling_tobacco_industry_tt: "Being on §Y$limited_exports$§! or §Y$closed_economy$§! will yield us an extra §YCivilian Factory§!"
  SIA_all_weather_roads: "All Weather Roads"
  SIA_all_weather_roads_desc: "Too many roads vanish with the rains, leaving provinces cut off from the capital and markets. A network of all weather roads will bind the kingdom together and allow goods and soldiers to move in every season."
  SIA_the_bank_of_siam: "The Bank of Siam"
  SIA_the_bank_of_siam_desc: "Industrial growth cannot proceed on custom and private favor alone. A stronger national bank will give the state greater command over credit, currency and the circulation of capital."
  SIA_thai_rice_company: "Thai Rice Company"
  SIA_thai_rice_company_desc: "Rice remains the lifeblood of [ROOT.GetName], yet too much of its trade is fragmented, speculative and vulnerable to foreign pressure. A national rice company will allow the state to guide exports, stabilize prices and turn the harvest of our paddies into a firmer foundation for national strength."
  SIA_uk_japan_focus_tt: "Which allows picking between [ENG.GetNameDef] and [JAP.GetNameDef] with the following effects:\n\n§Y[ENG.GetFlag][ENG.GetNameDefCap]§!:"
  SIA_japan_option_tt: "§Y[JAP.GetFlag][JAP.GetNameDefCap]§!"
  SIA_send_bureaucrats_abroad: "Send Bureaucrats Abroad"
  SIA_send_bureaucrats_abroad_desc: "Other nations have already built the ministries, schools and technical services that we now require. By sending promising officials abroad, we can import administrative experience without importing foreign rule."
  SIA_baht_stabilization_act: "Baht Stabilization Act"
  SIA_baht_stabilization_act_desc: "A modern economy requires a currency that merchants trust and investors accept. Stabilizing the baht will reduce uncertainty in trade and give [ROOT.GetNameDef] firmer footing in the international market."
  SIA_siamese_development_cooperative: "Siamese Development Cooperative"
  SIA_siamese_development_cooperative_desc: "Private capital is cautious and the state cannot build everything alone. A national development cooperative will allow officials, merchants and landholders to pool resources for projects that serve the common economy."
  SIA_boon_rawd_brewery: "Boon Rawd Brewery"
  SIA_boon_rawd_brewery_desc: "A domestic brewing industry is more than a matter of consumption. Enterprises such as Boon Rawd show that Siamese capital, machinery and management can create modern industry on Siamese soil."
  SIA_national_savings_bond: "National Savings Bond"
  SIA_national_savings_bond_desc: "The wealth of the nation must not lie idle in strongboxes and ornaments while roads and factories go unbuilt. A national savings bond will turn private thrift into public investment."
  SIA_national_savings_bond_tt: "Gains the $SIA_national_savings_bond$ Spirit, which scales in strength depending on your §YConscription Law§!. The lower your conscription law is the stronger the positive effects are, whereas the higher it is the worse it gets.\n\nAt §Y$disarmed_nation$§! gain: "
  SIA_national_savings_bond_scraping_the_barrel: "At §Y$scraping_the_barrel$§! gain:"
  SIA_national_savings_bond_volunteer_only: "At §Y$volunteer_only$§! gain:"
  SIA_national_savings_bond_limited_conscription: "At §Y$limited_conscription$§! gain:"
  SIA_national_savings_bond_extensive_conscription: "At §Y$extensive_conscription$§! gain:"
  SIA_national_savings_bond_service_by_requirement: "At §Y$service_by_requirement$§! gain:"
  SIA_national_savings_bond_all_adult_serve: "At §Y$all_adults_serve$§! gain:"
  SIA_national_savings_bond_current: "Our current mobilization law would grant us: "
  SIA_deficit_spending: "Deficit Spending"
  SIA_deficit_spending_desc: "Orthodox bookkeeping will not build a modern economy in time to meet a dangerous world. The state must be willing to spend ahead of current revenues, using public works and procurement to force industrial growth into motion."
  SIA_deficit_spending_tt: "After the spirit times out gain: "
  SIA_acquire_light_tools: "Acquire Light Tools"
  SIA_acquire_light_tools_desc: "Before we can produce great machines, we must first master the humble implements of industry. Imports of light tools and workshop equipment will allow small factories and repair shops to multiply across [ROOT.GetName]."
  SIA_railway_and_port_extensions: "Railway and Port Extensions"
  SIA_railway_and_port_extensions_desc: "Rice, timber and tin are worthless if they cannot reach the market. Extending the railways and expanding our ports will draw the provinces into national commerce and connect [ROOT.GetNameDef] to the wider world."
  SIA_mechanization_of_agriculture: "Mechanization of Agriculture"
  SIA_mechanization_of_agriculture_desc: "Too much labor remains tied to traditional cultivation, yielding little surplus for industry. By introducing modern tools and machines to the countryside, we can raise output and release hands for the factories."
  SIA_irrigation: "Irrigation"
  SIA_irrigation_desc: "The fortunes of the peasant still rise and fall with flood and drought. A broader irrigation system will steady harvests, expand cultivated land and make the countryside a firmer base for national development."
  SIA_siam_cement_group: "[ROOT.GetName] Cement Group"
  SIA_siam_cement_group_desc: "Founded under royal patronage, the [ROOT.GetName] Cement Group stands as one of [ROOT.GetNameDef]'s most significant industrial enterprises. With targeted investment and government backing, the company can be transformed from a domestic supplier into a cornerstone of our broader industrial capacity — laying the foundations, quite literally, for the nation's future."
  SIA_chemical_imports: "Chemical Imports"
  SIA_chemical_imports_desc: "Modern farming and industry alike depend on compounds that we do not yet produce in sufficient quantity. Importing chemicals will supply fertilizers, medicines, dyes and explosives until domestic industry can take up the task."
  SIA_chemical_imports_tt: "Add §G+1§! offmap §YCivilian Factory§! if opinion is above §Y[?var:ROOT.SIA_chemical_imports_opinion_threshold]§! when this focus is completed."

  INS_chemical_imports_stolen_tt: "Add §G[?var:ROOT.INS_guns_from_seek_help_focus]§! units of Infantry Equipment if opinion is above §Y75§! when this focus is completed."

  SIA_foreign_currency_exchange: "Foreign Currency Exchange"
  SIA_foreign_currency_exchange_desc: "Industrialization demands foreign machinery, medicine and fuel, yet these can only be bought with scarce exchange. A controlled currency exchange system will direct foreign funds toward the industries most vital to the state."
  SIA_farmers_into_the_city: "Farmers into the City"
  SIA_farmers_into_the_city_desc: "A modern economy cannot be sustained by village labor alone. As industry expands, the state must encourage orderly migration from the paddies to the towns, where a new urban workforce can be formed."
  SIA_textile_mills: "Textile Mills"
  SIA_textile_mills_desc: "Cloth is a daily necessity, yet too much of it is woven abroad and sold back to us. Textile mills will replace imported goods, employ urban labor and give [ROOT.GetNameDef] one of the basic industries of modern life."
  SIA_public_credit: "Public Credit"
  SIA_public_credit_desc: "Merchants, growers and manufacturers alike are constrained by limited access to capital. By expanding public credit, the government can lend where private finance hesitates and push development into neglected sectors."
  SIA_public_credit_trigger: "$idea_SIA_public_credit_debt$ has been active for at least §Y180 day(s)§!"
  SIA_a_modern_economy: "A Modern Economy"
  SIA_a_modern_economy_desc: "The old agrarian order does not disappear in a day, but it can no longer define the future of [ROOT.GetNameDef]. With banks, schools, factories and infrastructure now taking shape, we are beginning to build an economy worthy of an independent modern nation."
  SIA_reduction_of_agricultural_yield_taxes: "Reduction of Agricultural Yield Taxes"
  SIA_reduction_of_agricultural_yield_taxes_tt: "Reduces the §YConsumer Goods§! from $idea_SIA_agricultural_tax_reduction$ by §Y[?var:SIA_agricultural_tax_reduction_cg_decrease_rate|%]§! every month, and increases §YStability§! by §Y[?var:SIA_agricultural_tax_reduction_stability_gain|%]§! every month, until the §YConsumer Goods§! malus reaches §Y0%§!\n\nWhen the spirit is removed gain:\n"
  SIA_reduction_of_agricultural_yield_taxes_desc: "The peasantry cannot be asked to feed the kingdom, finance the state and endure every hardship without relief. By reducing taxes on agricultural yield, we leave more surplus in the countryside, strengthen loyalty among the cultivators and encourage greater production from the land."
  SIA_fuel_oil_act: "Fuel Oil Act"
  SIA_fuel_oil_act_desc: "Modern transport, industry and defense all depend upon fuel, yet access to it may be strangled in war. A fuel oil act will place consumption, storage and emergency allocation under firmer state oversight so that scarce supplies are not squandered."
  SIA_siam_electricity_company: "Siam Electricity Company"
  SIA_siam_electricity_company_desc: "No economy can endure modern strain without dependable power. By strengthening the Siam Electricity Company, we can extend generation, improve coordination and ensure that workshops, depots and cities remain supplied even in adversity."
  SIA_revise_the_taxation_system: "Revise the Taxation System"
  SIA_revise_the_taxation_system_desc: "The present tax structure does not adequately serve a state preparing for hardship and self-reliance. A revised system will collect revenue more evenly, reduce waste and direct the burden of national defense and development with greater discipline."
  SIA_census_the_hill_tribes: "Census the Hill Tribes"
  SIA_census_the_hill_tribes_desc: "The uplands remain beyond the full reach of administration, taxation and supply. A proper census will give the government the knowledge required to govern these regions more effectively and draw their people and resources into the wider life of the nation."
  SIA_increase_rice_exports: "Increase Rice Exports"
  SIA_increase_rice_exports_desc: "Rice is the surest source of foreign income available to [ROOT.GetNameDef]. By expanding exports while markets remain open, we can build reserves, finance strategic imports and prepare the treasury for the disruptions that may yet come."
  SIA_pad_thai: "Pad Thai"
  SIA_pad_thai_desc: "A modern nation is sustained not only by ministries and factories, but by common habits that bind the people together. By promoting a national rice dish drawn from Siamese ingredients, we encourage domestic consumption, support our farmers and reduce reliance on foreign foods in uncertain times."
  SIA_rice_husk_steam_turbines: "Rice Husk Steam Turbines"
  SIA_rice_husk_steam_turbines_desc: "What the foreigner sees as waste, necessity teaches us to value. By burning rice husks for steam generation, we can draw power from our own harvests and reduce our dependence on imported coal and oil."
  SIA_domestic_tin_smelters: "Domestic Tin Smelters"
  SIA_domestic_tin_smelters_desc: "It is no longer enough merely to dig ore from the soil and ship it abroad. By building domestic tin smelters, we retain more of the value of our resources at home and secure an industrial metal essential to both commerce and war."
  SIA_use_ships_as_generators: "Use Ships as Generators"
  SIA_use_ships_as_generators_tt: "Placing §YCapital Ships§! owned by us in §YCore State Ports§! will give us a §G-2%§! bonus to Factory Energy Consumption per §YCapital Ship§!, up to a total of §G-15%§!.\n\nThese ships leaving port will reduce the bonus by as much, and can be regained by placing the ships in port once more."
  SIA_use_ships_as_generators_desc: "Even older vessels may still serve the nation when they are no longer fit for battle or trade. By mooring ships as floating power stations, we can provide emergency electricity to ports and coastal industry while preserving precious fuel and infrastructure."
  SIA_diversity_foreign_reserves: "Diversify Foreign Reserves"
  SIA_diversity_foreign_reserves_desc: "It is dangerous for [ROOT.GetNameDef] to place its financial safety in the currency or credit of any single foreign power. By diversifying our reserves, we reduce the risk of external shocks and preserve greater freedom of action in trade and diplomacy."
  SIA_diversity_foreign_reserves_tt: "Add an additional §G2§! offmap §YMilitary Factory§! when going to war.\nAdd Production §G8§! Steel in a random core state when going to war."
  SIA_exclusivity_resource_contract: "Exclusivity Resource Contract"
  SIA_exclusivity_resource_contract_desc: "A single foreign partner offers capital and guaranteed purchases in exchange for privileged access to our resources. Such an exclusive contract may quicken development, though it ties one part of [ROOT.GetNameDef]'s future to another nation's appetite."
  SIA_maintain_resource_independence: "Maintain Resource Independence"
  SIA_maintain_resource_independence_desc: "Foreign contracts may bring quick profits, but dependence follows closely behind. By maintaining control over our resources, we preserve the freedom to direct them according to Siamese needs rather than foreign demands."
  SIA_kasetsart_university: "Kasetsart University"
  SIA_kasetsart_university_desc: "If agriculture is to become more productive, it must be guided by science rather than inheritance alone. Kasetsart University will train agronomists, veterinarians and technical experts for the modernization of the land."
  SIA_mahidol_university: "Mahidol University"
  SIA_mahidol_university_desc: "A modern state requires doctors, researchers and administrators as surely as it requires soldiers and engineers. Mahidol University will strengthen higher learning and provide the trained minds needed for national reform."
  SIA_silpakorn_university: "Silpakorn University"
  SIA_silpakorn_university_desc: "TODO_CM"
  SIA_contingency_funds: "Contingency Funds"
  SIA_contingency_funds_desc: "Prosperity in peace is of little value if the state enters crisis unprepared. By setting aside contingency funds now, we ensure that blockade, crop failure or sudden war will not immediately bring the machinery of government to a halt."
  SIA_contingency_funds_tt: "We will gather a contingency fund during peace time. While gathering this fund we will gain a moderate amount of §Yconsumer goods factor§!.\n\nDuring war we can release this fund should we choose, gaining a large production bonus.\nHow long the fund lasts depends on how long we have gathered the fund before releasing it."
  SIA_prepare_for_the_next_blockade: "Prepare for the Next Blockade"
  SIA_prepare_for_the_next_blockade_desc: "Should the seas become hostile, [ROOT.GetNameDef] may find itself cut off from markets, machinery and fuel. We must therefore prepare now for the next blockade, building stockpiles, emergency plans and substitutes before necessity forces our hand."
  SIA_domestic_arms_industry: "Domestic Arms Industry"
  SIA_domestic_arms_industry_desc: "A kingdom that must import every rifle and shell cannot call itself secure. However modest its beginnings, a domestic arms industry will allow [ROOT.GetNameDef] to arm its soldiers from its own workshops and endure when foreign supplies fail."
  SIA_war_material_substitutions: "War Material Substitutions"
  SIA_war_material_substitutions_desc: "In time of blockade, the perfect material is less valuable than the available one. We must study substitutes for metals, chemicals and imported components so that production may continue even when foreign goods no longer reach our shores."
  SIA_royal_thai_ordnance_factory: "Royal Thai Ordnance Factory"
  SIA_royal_thai_ordnance_factory_desc: "A secure state requires more than imported weapons and scattered repair shops. The Royal Thai Ordnance Factory will concentrate skill, machinery and supervision under the crown, giving [ROOT.GetNameDef] a permanent center for the manufacture of arms and ammunition."
  SIA_built_to_withstand_every_flame: "Built to Withstand Every Flame"
  SIA_built_to_withstand_every_flame_desc: "The factory that burns in one night cannot serve the nation in the morning. Our storehouses, mills and workshops must be built with dispersal, fireproofing and emergency protection in mind so that sabotage, bombing or accident cannot so easily cripple production."
  SIA_the_army_of_siam: "The Army of Siam"
  SIA_the_army_of_siam_desc: "The old structure of our armed forces no longer answers the demands of the age. If [ROOT.GetName] is to defend its sovereignty and assert its interests abroad, we must build a new modern army, equipped, trained and organized for the wars now taking shape across the world."
  SIA_plan_for_a_short_war: "Plan for a Short War"
  SIA_plan_for_a_short_war_desc: "Our resources are limited and our enemies may be many. [ROOT.GetNameDefCap] cannot afford a long contest of attrition. If war comes, it must be swift, decisive and brought to a conclusion before the enemy can gather strength."
  SIA_intermediate_war_preparation: "Intermediate War Preparation"
  SIA_intermediate_war_preparation_desc: "It is dangerous to prepare only for a lightning campaign, yet wasteful to organize entirely for endless struggle. A balanced doctrine will allow [ROOT.GetName] to strike with vigor while retaining the endurance needed to face a more stubborn foe."
  SIA_prepare_for_a_long_war: "Prepare for a Long War"
  SIA_prepare_for_a_long_war_desc: "The great powers may decide wars in months, but lesser nations are often forced to endure them for years. We must therefore prepare [ROOT.GetAdjective] arms, industry and transport for a long grinding conflict in which patience and resilience matter as much as courage."
  SIA_specialized_warfare: "Specialized Warfare"
  SIA_specialized_warfare_desc: "The terrain of our region does not favor a uniform army. Mountains, jungle and riverlands each demand different skills. By cultivating specialized troops, we can ensure that [ROOT.GetNameDef] meets the enemy with the proper force in every field."
  SIA_artillery_reigns_supreme: "Artillery Reigns Supreme"
  SIA_artillery_reigns_supreme_desc: "Modern battle is not won by spirit alone. The gun remains the king of the battlefield, breaking strongpoints, shattering assaults and paving the way for our infantry. If we are to triumph, [ROOT.GetAdjective] firepower must be made both plentiful and precise."
  SIA_yield_the_air_war: "Yield the Air War"
  SIA_yield_the_air_war_desc: "We cannot hope to challenge the great powers in the skies on equal terms. Rather than squander precious resources in a contest we are unlikely to win, we shall strengthen our anti-air defenses and deny enemy aircraft the freedom to strike our men and cities without cost."
  SIA_the_thunder_at_the_gates: "The Thunder at the Gates"
  SIA_the_thunder_at_the_gates_desc: "There are fortresses that ordinary guns cannot break and attacks that must be announced with overwhelming force. Heavy artillery, siege guns and railway pieces will give [ROOT.GetNameDef] the power to batter down the gates of any enemy who mistakes our restraint for weakness."
  SIA_night_time_training: "Night Time Training"
  SIA_night_time_training_desc: "Bold assaults in broad daylight invite disaster against a prepared foe. By training our men for infiltration, movement and attack under cover of darkness, we may seize the initiative when the enemy is blind, confused and least prepared to answer us."
  SIA_steel_arteries: "Steel Arteries"
  SIA_steel_arteries_desc: "No army marches far without rails and roads to sustain it. The steel arteries of the nation must be strengthened so that troops, supplies and guns may be carried swiftly to every threatened frontier. In this work, military security and national development go hand in hand."
  SIA_prepare_northern_infrastructure_for_war: "Prepare Northern Infrastructure for War"
  SIA_prepare_northern_infrastructure_for_war_desc: "The northern approaches will become vital in any contest with Burma and those who stand behind it. Roads, railways and depots in that region must be expanded at once, so that [ROOT.GetAdjective] forces may advance or resist there without delay."
  SIA_unconventional_tank_construction: "Unconventional Tank Construction"
  SIA_unconventional_tank_construction_desc: "We cannot imitate the armored programs of the great powers piece for piece. If [ROOT.GetNameDef] is to field tanks at all, we must pursue cheaper and more adaptable methods of construction, sacrificing grandeur in favor of numbers and utility."
  SIA_conventional_tank_construction: "Conventional Tank Construction"
  SIA_conventional_tank_construction_desc: "Armor has become an accepted arm of modern war, and makeshift solutions will only carry us so far. We should therefore establish a proper tank industry based on sound principles, standard designs and reliable production methods worthy of a modern army."
  SIA_reverse_engineer_allied_tanks: "Reverse Engineer Allied Tanks"
  SIA_reverse_engineer_allied_tanks_desc: "Others have already borne the expense of experimentation. Captured tanks and imported machines can be stripped apart, studied and imitated. By learning from foreign designs, [ROOT.GetName] may shorten the path toward its own armored force."
  SIA_tankettes: "Tankettes"
  SIA_tankettes_desc: "Light, cheap and simple to produce, tankettes may not decide great battles on their own, but they can still serve scouting, colonial warfare and infantry support. For a nation of modest means, such small armored vehicles offer a practical entrance into mechanized war."
  SIA_jungle_armor: "Jungle Armor"
  SIA_jungle_armor_desc: "The jungles of our region are no place for ponderous machines designed for the plains of Europe. If armor is to serve [ROOT.GetNameDef], it must be adapted for narrow tracks, poor ground and oppressive climate, trading weight for mobility where the jungle demands it."
  SIA_mountain_tanks: "Mountain Tanks"
  SIA_mountain_tanks_desc: "Rugged hills and mountain passes cannot simply be left to infantry alone. By pursuing compact armored vehicles suited for broken terrain, we may give our armies a means to bring protected firepower into regions where ordinary tanks would fail."
  SIA_reluctant_submission: "Reluctant Submission"
  SIA_reluctant_submission_desc: "Should [ROOT.GetNameDef] face invasion by a stronger foe, there may come a moment when open resistance promises only ruin. To bend is bitter, yet sometimes a government must yield to preserve the nation from destruction and await a more favorable hour."
  SIA_reluctant_submission_trigger: "This focus will automatically complete if we are attacked and pick the §YSubmission§! option in the event."
  SIA_reluctant_submission_tt: "We will be able to peace out an attacking major country. However they will expect us to print money for them.\nOur §YConsumer Goods Factories factor§! will increase by §Y[?idea_SIA_printing_money_monthly_change|%]§! monthly, to a max of §Y[?idea_SIA_printing_money_monthly_change_max|%]§!.\n\nTaking the focus §Y$SIA_thai_rice_company$§! will reduce the increase rate by §G50%§!\n\nTaking the focus §Y$SIA_demand_repatriation$§! will remove the need to print money."
  SIA_seri_thai: "Seri Thai"
  SIA_seri_thai_desc: "Submission need not mean surrender of the national spirit. Beneath the surface of occupation and compliance, a loyal underground can be organized to preserve the cause of independence, gather intelligence and prepare the day when [ROOT.GetName] rises again."
  SIA_contact_the_south_east_asia_command: "Contact the South East Asia Command"
  SIA_contact_the_south_east_asia_command_desc: "If resistance is to amount to more than brave gestures, it must be tied to a wider strategy. By establishing contact with the Allied command in Southeast Asia, the patriots of [ROOT.GetName] may secure guidance, supplies and a place in the greater struggle."
  SIA_broadcast_weather_reports_to_the_allies: "Broadcast Weather Reports to the Allies"
  SIA_broadcast_weather_reports_to_the_allies_desc: "The skies and seas of the region are governed as much by weather as by fleets and armies. Reliable reports from [ROOT.GetNameDef] can aid Allied planning, shield their operations from surprise and make our homeland a silent but valuable partner in their war."
  SIA_american_investment_aid: "American Investment Aid"
  SIA_american_investment_aid_desc: "The United States possesses wealth beyond anything available in our own region. If we can secure American aid and investment for our clandestine and national efforts, [ROOT.GetNameDef] will gain the material means to endure hardship and prepare for liberation."
  SIA_thai_students_in_the_oss: "Thai Students in the OSS"
  SIA_thai_students_in_the_oss_desc: "A new generation of patriotic youth can be trained abroad in the arts of espionage, sabotage and irregular warfare. By sending trusted Thai students into the orbit of Allied intelligence, we shall prepare able servants for the hidden war ahead."
  SIA_prepare_to_drop: "Prepare to Drop"
  SIA_prepare_to_drop_desc: "When the hour of liberation comes, the Allies may seek to descend upon our homeland from the sky. We must therefore identify landing grounds, prepare contacts and organize support networks so that airborne forces can be received and directed where they are most needed."
  SIA_unseat_the_government: "Unseat the Government"
  SIA_unseat_the_government_desc: "A regime that has bound [ROOT.GetNameDef] to foreign domination cannot be allowed to endure forever. Through resistance, intrigue and timely action, we may remove those who have compromised the nation and restore a government more worthy of Siam."
  SIA_unseat_the_government_tt: "[ROOT.GetName] will leave its current faction and switch sides in the war, joining the §YAllies§!.\n\nLoyalists will rise up against the change, sparking a civil war.\n\nIf our combined support is §Ymore than 80%§! we will oust the government and avoid a civil war. Our total support is §Y5%§! for each swayed general, in addition to our democratic support.\n\nOur support from our swayed generals is §Y[?var:SIA_seri_thai_cw_scale|%]§! and our democratic support is §Y[?var:party_popularity@democratic|%]§!"
  SIA_choose_new_leader_tt: "With the old regime broken, the victors must choose who will head the new government."
  SIA_the_phayap_army: "The Phayap Army"
  SIA_the_phayap_army_desc: "If we cast our lot with the invader, then our armies must be given a place in the new order of war. A dedicated field command for operations to the west and north will allow [ROOT.GetName] to advance alongside its powerful partner and pursue gains of its own."
  SIA_securing_the_rubber_islands: "Securing the Rubber Islands"
  SIA_securing_the_rubber_islands_desc: "Rubber is the lifeblood of modern war, feeding tires, seals and countless instruments of mechanized conflict. The resource-rich territories to our south present both an opportunity and a necessity. We should move to secure them before others do."
  SIA_breaking_the_burmese_line: "Breaking the Burmese Line"
  SIA_breaking_the_burmese_line_desc: "Burma stands as a barrier between our ambitions and the lands beyond. If [ROOT.GetAdjective] arms are to prove their worth, the enemy line there must be broken by determination, planning and the concentrated use of force."
  SIA_pacific_war: "Pacific War"
  SIA_pacific_war_desc: "The conflict in East Asia can no longer be treated as distant. The war in the Pacific is shaping the fate of all nations in our region, and [ROOT.GetNameDef] must decide its place in that struggle, whether as follower, partner or victim."
  SIA_joint_asian_military_command: "Joint Asian Military Command"
  SIA_joint_asian_military_command_desc: "Our efforts will be stronger if coordinated with those of our regional partners. A joint command structure promises greater efficiency, clearer planning and a common direction for campaigns that otherwise risk being squandered through rivalry and confusion."
  SIA_demand_repatriation: "Demand Repatriation"
  SIA_demand_repatriation_desc: "Those who entered our land under the pretense of necessity have incurred a debt to [ROOT.GetNameDef]. Once our fortunes improve, we should demand the return of what has been taken and press the occupier to repay the cost of its intrusion."
  SIA_standing_our_ground: "Standing Our Ground"
  SIA_standing_our_ground_desc: "There comes a point when retreat and negotiation offer only further humiliation. [ROOT.GetNameDefCap] must show that it still possesses the will to stand, to fight and to drive out those who presume they may dictate our fate at gunpoint."
  SIA_standing_our_ground_trigger: "This focus will automatically complete if we are attacked and pick the §YResistance§! option in the event."
  SIA_ask_for_the_release_of_american_commodities: "Ask for the Release of American Commodities"
  SIA_ask_for_the_release_of_american_commodities_desc: "American stores, machinery and goods may provide the breathing room our nation needs. Through careful diplomacy we can request the release of such commodities, easing shortages and strengthening the material basis of our war effort."
  SIA_japanese_fighters: "Japanese Fighters"
  SIA_japanese_fighters_desc: "Though our own aviation industry remains slight, foreign aircraft can help fill the gap. Japanese fighters in [ROOT.GetAdjective] hands would at least give us a measure of modern air power, even if only within limits set by our industrial weakness."
  SIA_get_off_our_shores: "Get Off Our Shores"
  SIA_get_off_our_shores_desc: "The presence of foreign troops on Siamese soil is an affront that cannot be softened by excuses. Whether by force of arms or by pressure from events abroad, we must insist that the invader leave our shores and restore the dignity of [ROOT.GetNameDef].\n\nThey are cowards, like all cruel men. Now, get off our shores."
  SIA_singaporean_reinforcements: "Singaporean Reinforcements"
  SIA_singaporean_reinforcements_desc: "The struggle in Malaya and beyond is inseparable from our own security. Reinforcements drawn from the forces gathering around Singapore could stiffen our line, widen our cooperation with the Allies and bind the theater together under common purpose."
  modify_SIA_directorate_of_aeronautical_engineering: "Modifies §YDirectorate of Aeronautical Engineering§! by:"
  SIA_aid_for_resources: "Aid for Resources"
  SIA_aid_for_resources_desc: "Our nation has resources that foreign powers desire and lacks certain tools that they can provide. A prudent exchange of aid for materials will help keep [ROOT.GetNameDef] supplied while ensuring our wealth contributes to our own preservation."
  SIA_aid_for_resources_tt: "We will ask [JAP.GetNameDef] to join our war, against them getting resource rights for rubber in §Y[724.GetName]§!"
  SIA_how_quickly_the_tables_turn: "How Quickly the Tables Turn"
  SIA_how_quickly_the_tables_turn_desc: "Those who once treated [ROOT.GetNameDef] as weak and compliant may yet find the balance reversed. Fortune in war turns rapidly, and we must be ready to seize the moment when our oppressors falter and the tables are at last turned against them."
  SIA_how_quickly_the_tables_turn_trigger: "We have been attacked by a major and capitulated said major."
  SIA_royal_thai_navy: "Royal Thai Navy"
  SIA_royal_thai_navy_desc: "The defense of [ROOT.GetNameDef] does not end at the shoreline. Our coasts, rivers and maritime trade demand a fleet worthy of the kingdom. By strengthening the Royal Thai Navy, we shall ensure that Siam remains master of its own waters."
  modify_royal_thai_navy: "Modifies §Y$idea_SIA_thai_royal_navy$§! by:"
  SIA_direct_army_fundings_towards_the_navy: "Direct Army Fundings Towards the Navy"
  SIA_direct_army_fundings_towards_the_navy_desc: "The army has long consumed the lion's share of military expenditure, yet the strategic needs of [ROOT.GetNameDef] are not purely continental. By shifting funds toward the fleet, we can begin correcting this imbalance and secure the seas that shelter our commerce and coast."
  SIA_thonburi_class_coastal_defense_ship: "Thonburi Class Coastal Defense Ship"
  SIA_thonburi_class_coastal_defense_ship_desc: "A modest fleet may still wield sharp teeth if properly designed for local conditions. The Thonburi class offers [ROOT.GetNameDef] a practical means of coastal defense, combining respectable firepower with a role suited to the waters we most urgently need to protect."
  SIA_acquire_submarines: "Acquire Submarines"
  SIA_acquire_submarines_desc: "Submarines offer a small navy the chance to strike above its weight. Hidden beneath the waves, they can threaten shipping, deter stronger fleets and complicate any hostile design against our coast. [ROOT.GetNameDefCap] should not neglect such a weapon."
  SIA_submarine_day: "Submarine Day"
  SIA_submarine_day_desc: "The introduction of undersea warfare into our fleet deserves public recognition and national enthusiasm. By celebrating the submarine arm, we can encourage recruitment, raise prestige and fix the idea in the public mind that Siam is entering a new naval age."
  SIA_the_thonburi_dockyard_project: "The Thonburi Dockyard Project"
  SIA_the_thonburi_dockyard_project_desc: "A navy cannot be sustained by imported hulls alone. If [ROOT.GetNameDef] is to maintain and expand its maritime forces, it must invest in the dockyards, workshops and labor that form the true foundation of sea power."
  SIA_expand_the_slipways: "Expand the Slipways"
  SIA_expand_the_slipways_desc: "Our current facilities are too cramped for the ambitions now taking shape. By enlarging the slipways, we shall increase our capacity to build and repair vessels, allowing the fleet to grow in size and readiness."
  SIA_a_new_drydock: "A New Drydock"
  SIA_a_new_drydock_desc: "Serious naval maintenance demands a modern drydock. Without one, the upkeep of larger ships remains slow, inefficient and dependent on foreign assistance. A new drydock will give [ROOT.GetNameDef] a firmer grip over its own naval future."
  SIA_install_heavy_cranes_and_power_plant: "Install Heavy Cranes and Power Plant"
  SIA_install_heavy_cranes_and_power_plant_desc: "Shipbuilding is not merely a matter of timber and steel, but of machinery and energy. Heavy cranes and reliable electrical supply will transform our yards from crude facilities into proper instruments of modern industry."
  SIA_establish_the_foundry_and_machine_shop: "Establish the Foundry and Machine Shop"
  SIA_establish_the_foundry_and_machine_shop_desc: "A sovereign navy requires more than hulls assembled from imported parts. By founding our own foundry and machine shop, we will strengthen the industrial sinews that allow [ROOT.GetNameDef] to cast, shape and repair the vital components of warships at home."
  SIA_the_thonburi_arsenal: "The Thonburi Arsenal"
  SIA_the_thonburi_arsenal_desc: "A dockyard without armament remains incomplete. The establishment of an arsenal at Thonburi will permit the manufacture and storage of naval guns, ammunition and related equipment, binding our fleet more closely to national industry."
  SIA_focus_on_commercial_civilian_ships: "Focus on Commercial Civilian Ships"
  SIA_focus_on_commercial_civilian_ships_desc: "Not every keel laid must be intended for battle. Merchantmen, transports and other civilian vessels form the circulatory system of the national economy. By fostering commercial shipbuilding, [ROOT.GetNameDef] strengthens both prosperity and wartime resilience."
  SIA_empower_the_coastguard: "Empower the Coastguard"
  SIA_empower_the_coastguard_desc: "The fleet cannot be everywhere at once, and many tasks of coastal security are better handled by lighter services. A strengthened coastguard will protect our fisheries, police our shores and free the navy to attend to graver threats."
  SIA_river_patrols: "River Patrols"
  SIA_river_patrols_desc: "The rivers of [ROOT.GetNameDef] are roads, frontiers and lifelines at once. Patrol craft on these waters will help us enforce order, support local garrisons and extend the reach of the state into regions where a distant capital is otherwise slow to act."
  SIA_sell_bangkok_dock_co: "Sell Bangkok Dock Co"
  SIA_sell_bangkok_dock_co_desc: "Private capital may accomplish what state management performs too slowly. By selling Bangkok Dock Company into capable hands, we may attract investment, stimulate efficiency and redirect public funds toward more pressing military needs."
  SIA_a_race_against_time: "A Race Against Time"
  SIA_a_race_against_time_desc: "Our navy is outdated, underfunded, and unprepared for modern war. Funds must be redirected immediately into shipbuilding, refits, coastal defense, and naval training. The clock is running faster than our dockyards."
  SIA_a_race_against_time_tt: "After the spirit times we will gain: "
  SIA_a_race_against_time_tt2: "for §Y280§! day(s)"
