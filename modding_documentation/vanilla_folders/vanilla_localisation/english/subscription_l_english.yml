 DLC_DESCRIPTION_dlc018: "New national focus trees and events for Canada, Australia, New Zealand, The Raj (India), and South Africa. A Spearhead battleplan command allowing more control over grand encirclements and punching through enemy lines."
 DLC_DESCRIPTION_dlc020: "Four New Focus Trees: Experience the war from the difficult perspectives of Hungary, Romania, Czechoslovakia, and Yugoslavia."
 DLC_DESCRIPTION_dlc022: "Modified Focus Trees for Germany and Japan: Two major Axis powers now have alternate history paths, including the chance to depose Hitler or install Communism or Democracy in Japan."
 DLC_DESCRIPTION_dlc023: "Get new ship designs, traits, and skills for admirals, amphibious vehicles, use naval mines to protects your seas and ship routes to avoid dangers. Includes new focus trees for The Netherlands, United Kingdom, Mexico and USA."
 DLC_DESCRIPTION_dlc028: "La Résistance adds secret agents, espionage missions, and new options for resistance movements. Send agents into dangerous territory to decipher enemy secrets or prepare the ground for your invasion by propping up collaborators who will be happy for any taste of power."
 DLC_DESCRIPTION_dlc031: "Adds dedicated national focus trees to the minor powers around the Black Sea and the Aegean. Bulgaria, Greece and Turkey can each chart unique historical and alternate history paths as they resist efforts by the major powers to dominate the strategic sea-lanes of the Bosporus and Dardanelles."
 DLC_DESCRIPTION_dlc034: "No Step Back adds greater detail for many nations in Eastern Europe, unique game systems to reflect Soviet politics, and many improvements to the military aspect of the game."
 DLC_DESCRIPTION_dlc036: "Build a new empire, resist foreign aggression or explore the limits of neutrality. By Blood Alone adds new alternate history options and gameplay variety for Italy, Ethiopia and Switzerland, as well as other significant changes."
 DLC_DESCRIPTION_dlc038: "Write thrilling new histories of the Nordic countries as the major powers of Europe fight for the future of the world. New National Focus trees for Finland, Sweden, Denmark and Norway take center stage. Specialize your arms industry to emphasize efficiency and then sell these weapons on the new International Market."
 DLC_DESCRIPTION_dlc040: "Trial of Allegiance adds extensive focus trees for Brazil, Argentina, Chile, Uruguay and Paraguay. The stability of an entire continent balances on a knife-edge. Open a new front in the war as you court European benefactors with your most precious commodity: your allegiance."
 DLC_DESCRIPTION_dlc043: "Develop prototype technology and weapons to deploy against your enemies. Execute raids to destroy your enemies research facilities, dams and landmarks. New and updated focus trees allow you to use the Inner Circle of Germany to reach your goals, recreate the Habsburg empire as Austria or Hungary, and explore the dynamics of Belgium and its colony the Belgian Congo."
 DLC_DESCRIPTION_dlc046: "Graveyard of Empires introduces unique focus trees to Iran, the Raj, Iraq and Afghanistan. Curtail the influence of meddling external powers and resurrect the fallen pride of your nation as you strive to dominate the Middle-East and South Asia."
 DLC_DESCRIPTION_dlc049: "Mould new paths in history for Japan, China and the Philippines in No Compromise, No Surrender, an Expansion for Hearts of Iron IV. Seize a greater depth of control over factions, forge new military doctrines and decide the fate of the Pacific and beyond."
 DLC_DESCRIPTION_dlc051: "Recreate the Kingdom of Bohemia, form a union of Central European states, protect yourself with fortifications or form a network of allies with Peace for Our Time's new focus tree for Czechoslovakia."
 DLC_DESCRIPTION_dlc052: "Step into the heart of command by deploying your generals to the front lines and give medals to your most successful ship captains. Roll back the Japanese invasion across south east asia as Australia; carve out a new empire as Siam; and decide on the future of Indonesia, with or without Dutch rule."