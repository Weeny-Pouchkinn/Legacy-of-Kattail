  idea_SIA_a_race_against_time: "A Race Against Time"
  idea_SIA_overheated_economy: "Overheated Economy"
  idea_SIA_overheated_economy_desc: "The economy has been pushed beyond its natural limits. Consumer demand has outstripped capacity and the construction boom has stalled while things cool down."
  idea_SIA_ending_military_grift: "Ending Military Grift"
  idea_SIA_the_military_oversight_bureau: "$SIA_military_oversight_bureau$"
  idea_SIA_the_military_oversight_bureau_desc: "The Military Oversight Bureau sets higher standards for new commanders and accelerates the development of expertise across the officer corps."
  idea_SIA_public_credit_debt: "Public Credit Debt"
  idea_SIA_public_credit_debt_desc: "The state's credit obligations are a constant drain on the economy, consuming resources that would otherwise flow into production and civilian goods."
  idea_SIA_public_credit_debt_2: "$idea_SIA_public_credit_debt$ Repayment"
