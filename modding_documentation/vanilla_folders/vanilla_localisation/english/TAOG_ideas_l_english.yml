  INS_bangka_bauxite_export_desc: "The islands of Bangka and Belitung are home to a large chunk of the worlds bauxite, which is the primary ingredient in aluminium. While we could invest in aluminium production ourselves, the sheer quantity of bauxite produced makes selling it raw in bulk a viable strategy."
