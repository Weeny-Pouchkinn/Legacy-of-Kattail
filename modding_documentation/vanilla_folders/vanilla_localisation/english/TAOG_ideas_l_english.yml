  idea_SIA_pan_thaiism: "Pan-Thaiism"
  idea_SIA_pan_thaiism_desc: "The ideology of Pan-Thaiism holds that all peoples of Thai heritage should be united under one state. It drives the nation toward expansion, sustaining morale through offensive action."
