  idea_SIA_debt_repayment: "Debt Repayment"
  idea_SIA_debt_repayment_desc: "The costs of the deficit spending programme are being felt. Revenue is being diverted toward creditors, and the construction pace that borrowing once enabled can no longer be sustained."
  idea_SIA_an_unceasy_alliance: "An Uneasy Alliance"
  idea_SIA_an_unceasy_alliance_desc: "The alliance holds, but the strains are beginning to show. Doubts within the government are quietly pulling the nation toward a more neutral course."
  idea_SIA_rural_support: "Rural Support"
  idea_SIA_the_sacred_hierarchy: "The Sacred Hierarchy"
  idea_SIA_order_discipline_and_unity: "Order, Discipline and Unity"
  idea_SIA_constitutional_virtue: "Constitutional Virtue"
  idea_SIA_an_absolute_monarchy: "An Absolute Monarchy"
  idea_SIA_an_absolute_monarchy_desc: "All political authority rests with the crown. The king's word is law, dissent is suppressed, and the full weight of royal prestige is thrown behind national mobilisation. The throne commands loyalty, and the army is its instrument."
  idea_SIA_a_constituional_monarchy: "A Constitutional Monarchy"
  idea_SIA_a_constituional_monarchy_desc: "A constitutional framework defines the limits of royal power and enshrines the rights of the people. With the crown as a unifying symbol rather than an absolute authority, the nation grows more stable, more open to new ideas, and more aligned with the democratic world."
  idea_SIA_restoring_order: "Restoring Order"
  idea_SIA_military_expansion_costs: "Military Expansion Costs" 
  idea_SIA_a_modern_economy: "A Modern Economy"
  idea_SIA_death_to_communists: "Death to the Communists"
  idea_SIA_death_to_communists_desc: "Anti-communist fervour runs through the ranks, giving our forces an edge against the communist armies of China."
  idea_SIA_death_to_nationalists: "Death to the Nationalists"
  idea_SIA_death_to_nationalists_desc: "Anti-nationalist sentiment runs through the ranks, giving our forces an edge against the nationalist armies of China."
  
  idea_SIA_breaking_the_burmese_line: "Breaking the Burmese Line"
  idea_SIA_the_yellow_dossier: "The Yellow Dossier"
  idea_SIA_the_yellow_dossier_desc: "A classified report on the state of domestic industry has forced a reckoning with deep-seated inefficiencies. The reforms it demands are bearing fruit in our factories, though the disruption they bring is not without cost."
  idea_SIA_the_yellow_dossier_2: "$idea_SIA_the_yellow_dossier$"
  idea_SIA_the_yellow_dossier_2_desc: "$idea_SIA_the_yellow_dossier_desc$"
