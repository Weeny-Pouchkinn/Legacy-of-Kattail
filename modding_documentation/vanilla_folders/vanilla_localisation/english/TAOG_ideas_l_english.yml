  ############
  ### SIAM ###
  ############

  idea_SIA_civilian_full_support: "Civilian Wing: §GFull Support§!"
  idea_SIA_civilian_full_support_desc: "The civilian wing stands firmly behind the government. Administrators and technocrats lend their expertise, driving development forward."
  idea_SIA_civilian_slight_support: "Civilian Wing: Slight Support"
  idea_SIA_civilian_slight_support_desc: "The civilian wing broadly supports the government's direction. Their cooperation brings modest but tangible benefits."
  idea_SIA_civilian_neutral: "Civilian Wing: Neutral"
  idea_SIA_civilian_neutral_desc: "The civilian wing neither aids nor obstructs the government. The administration functions, but without the drive of genuine political alignment."
  idea_SIA_civilian_opposition: "Civilian Wing: In Opposition"
  idea_SIA_civilian_opposition_desc: "The civilian wing has turned against the government. Officials drag their feet and budgets are misallocated, grinding the machinery of state."
  idea_SIA_civilian_rebellious: "Civilian Wing: §RRebellious§!"
  idea_SIA_civilian_rebellious_desc: "The civilian wing is in open defiance. Instability spreads and the threat of a political rupture grows with each passing day."
  idea_SIA_military_full_support: "Military Wing: §GFull Support§!"
  idea_SIA_military_full_support_desc: "The military wing stands firmly behind the government. Officers back recruitment drives and arms production, channelling the army's resources toward national goals."
  idea_SIA_military_slight_support: "Military Wing: Slight Support"
  idea_SIA_military_slight_support_desc: "The military wing is broadly cooperative. Their support brings modest improvements to recruitment and production, though without full commitment."
  idea_SIA_military_neutral: "Military Wing: Neutral"
  idea_SIA_military_neutral_desc: "The military wing has taken no position. The army performs its duties without enthusiasm or resistance, waiting to see how things develop."
  idea_SIA_military_opposition: "Military Wing: In Opposition"
  idea_SIA_military_opposition_desc: "The military wing works against the government. Officers undermine production efforts and enthusiasm for the government's cause drains from the ranks."
  idea_SIA_military_rebellious: "Military Wing: §RRebellious§!"
  idea_SIA_military_rebellious_desc: "The military wing is on the verge of open defiance. Conscription is sabotaged, arms production suffers, and the spectre of a coup looms."
  idea_SIA_defenders_of_constitutional_liberty: "Defenders of Constitutional Liberty"
  idea_SIA_civil_service_heroism_1: "Civil Service Heroism"
  idea_SIA_civil_service_heroism_1_desc: "The civil service has risen to the occasion, its dedication and expertise quietly accelerating the pace of research and state development."
  idea_SIA_civil_service_heroism_2: "$idea_civil_service_heroism_1$"
  idea_SIA_civil_service_heroism_2_desc: "$idea_SIA_civil_service_heroism_1_desc$"
  idea_SIA_redirected_military_funds: "Redirected Military Funds"
  idea_SIA_thai_irredentism: "Thai Irredentism"
  idea_SIA_oss_special_forces_training: "OSS Special Forces Training"
  idea_SIA_seized_japanese_funds: "Seized Japanese Funds"
  idea_SIA_seized_japanese_funds_desc: "With the Japanese arrangement broken, the funds and stockpiles they left behind are ours to put to work, fuelling a surge in construction and industrial output."
  idea_SIA_oss_special_forces_training_desc: "Our agents have trained alongside the OSS in sabotage, infiltration and airborne operations. The lessons learned have sharpened our special forces into a formidable instrument."
  idea_SIA_sold_privy_purse_lands: "Sold Privy Purse Lands"
  idea_SIA_sold_privy_purse_lands_desc: "The sale of the royal household's land holdings has injected capital into the state, easing economic pressures and freeing up resources for construction."
  idea_SIA_war_fervor: "War Fervor"
  idea_SIA_bloodlusted_irredentism: "Blood-lusted Irredentism"
  idea_SIA_bloodlusted_irredentism_desc: "Territorial ambition has curdled into something fiercer. The army fights with the conviction of those who believe they are reclaiming what is rightfully theirs."
  idea_SIA_the_royal_police_counterweight: "The Royal Police Allegiance"
  idea_SIA_civilian_technocrats_in_institutions: "Civilian Technocrats"
  idea_SIA_civilian_technocrats_in_institutions_desc: "Civilian experts placed within key state institutions have improved both resource extraction and the efficiency of political appointments."
  idea_SIA_yuvachon: "Yuvachon"
  idea_SIA_yuvachon_desc: "The Yuvachon movement drills the nation's youth in military discipline, building a pool of trained manpower and stoking nationalist sentiment."
  idea_SIA_yuvachon_2: "$idea_SIA_yuvachon$"
  idea_SIA_yuvachon_2_desc: "$idea_SIA_yuvachon_desc$"
  idea_SIA_rebuilding_the_war_torn_economy: "Rebuilding the War-Torn Economy"
  idea_SIA_specialist_marine_forces: "Specialist Marine Forces"
  idea_SIA_specialist_marine_forces_desc: "A cadre of dedicated amphibious specialists has been trained and equipped for coastal assault operations."
  idea_SIA_rehabilitated_military: "Rehabilitated Military"
  idea_SIA_desperate_gambit: "Desperate Gambit"
  idea_SIA_desperate_gambit_desc: "Maybe there is way out of this hole you've found yourself in, climb!"
  idea_SIA_purged_senior_military: "Purged Senior Military"
  idea_SIA_purged_senior_military_desc: "Senior officers deemed a threat to the government have been removed from their posts. The loss of experienced commanders has left its mark on the army's cohesion and professional development."
  idea_SIA_cemented_control: "Cemented Control"
  idea_SIA_cemented_control_desc: "The government has consolidated its grip on the institutions of state. Political opposition has been sidelined and the machinery of power now turns reliably in the government's favour."
  idea_SIA_cemented_control_2: "Entrenched Control"
  idea_SIA_cemented_control_2_desc: "$idea_SIA_cemented_control_desc$"
  idea_SIA_cemented_control_3: "Thai Duty During War Act"
  idea_SIA_cemented_control_3_desc: "It is every Thai's duty, that in case of a war that threatens the sovereignty of the crown, and its people, that every respectable Thai must resist occupation by whatever mean possible, be it by means of arms or otherwise."
  idea_SIA_suspend_ordinary_legal_procedures: "Suspended Ordinary Legal Procedures"
  idea_SIA_thai_cultural_mandates: "Thai Cultural Mandates"
  idea_SIA_military_humiliation: "Military Humiliation"
  idea_SIA_death_defiant: "Death Defiant"
  idea_SIA_death_defiant_desc: "We are already dead. Come take your due, if you can"
  idea_SIA_songsuradet_ascendant_0: "Songsuradet Ascendant"
  idea_SIA_songsuradet_ascendant_0_desc: "Having successfully weathered the ire of the government, Phraya Songsuradet has solidified his base and come out stronger for it. He is now what people would call untouchable, too high-profile and entrenched to get rid of.\nHe will most likely interfere with government policies, slowing down decision making to ensure he isn't the target of a purge again."
  idea_SIA_songsuradet_ascendant_1: "$idea_SIA_songsuradet_ascendant_0$"
  idea_SIA_songsuradet_ascendant_1_desc: "$idea_SIA_songsuradet_ascendant_0_desc$" 
