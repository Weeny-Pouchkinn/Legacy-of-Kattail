  SIA_wing_state_opposition: "§RIn Opposition§!"
  SIA_wing_state_rebellious: "§RRebellious§!"
  SIA_civilian_wing_history_tt: "The civilian faction of the Khana Ratsadon is led by progressive administrators and technocrats, foremost among them §YPridi Phanomyong§!. Having studied law in France, Pridi returned with ambitions for land reform, state economic planning, and a constitutional democracy that would genuinely empower ordinary people.\n\nThe civilian wing is broadly §Gpro-development§!, favouring investment in education, infrastructure, and industry. They are sceptical of heavy military spending and wary of any drift toward strongman rule. Their support is most easily won through policies that modernise the state and protect constitutional government."
  SIA_military_wing_history_tt: "The military faction of the Khana Ratsadon is dominated by army officers who see themselves as the true guardians of the revolution. Their most ambitious figure is §YPlaek Phibunsongkhram§!, a colonel whose admiration for the nationalist movements of Europe grows with each passing year.\n\nThe military wing is §Gpro-rearmament§! and drawn to a strong, centralised state. They are suspicious of Pridi's economic ideas, which they consider dangerously radical, and have little patience for civilian interference in defence matters. Their loyalty is most easily secured through military investment and policies that project national strength."
  idea_SIA_wing_promotion_disruption: "Factional Realignment"
  idea_SIA_wing_promotion_disruption_desc: "Openly favoring one wing of the Khana Ratsadon has thrown the government off balance. The slighted faction drags its feet, the army's routine is in disarray, and ordinary administration suffers until the new arrangement beds in."
  idea_SIA_military_wing_unrest: "Military Wing in Revolt"
  idea_SIA_military_wing_unrest_desc: "The officers' patience has run out once more. Having failed to seize power outright, the military wing now vents its fury through sabotage, desertions, and a flat refusal to cooperate. The army's fighting strength crumbles until the malcontents are brought to heel."
  idea_SIA_civilian_wing_unrest: "Civilian Wing in Revolt"
  idea_SIA_civilian_wing_unrest_desc: "Pridi's faction has lost faith in the government again. Denied a second chance at power, the civilian wing turns to strikes, bureaucratic obstruction, and agitation in the cities. The economy seizes up and the country grows ungovernable until tempers cool."
  idea_SIA_unwavering_civilian_support: "Unwavering Civilian Support"
  idea_SIA_unwavering_civilian_support_desc: "With the military wing dissolved and the question of legitimacy settled, the civilian administration stands unchallenged. Freed from the army's meddling, Pridi's technocrats throw themselves into the work of governing with a zeal the old coalition could never have mustered."
  idea_SIA_unified_khana_ratsadon: "United People's Party"
  idea_SIA_unified_khana_ratsadon_desc: "The old quarrel between soldiers and civilians is finished. With both wings of the Khana Ratsadon pulling in the same direction at last, the government can act with a unity of purpose it has never known. Soldiers, administrators, and industrialists now work as one."


