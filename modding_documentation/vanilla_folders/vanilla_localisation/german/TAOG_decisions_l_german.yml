 AST_communism_support_text: "[?party_popularity_100@communism|Y]% Kommunistenunterstützung"
 AST_union_control_1_cat: "Gewerkschaftskontrolle"
 AST_union_control_1_cat_desc: "Die Gewerkschaften haben begonnen, die australische Bevölkerung zu mobilisieren. Wir können in die Gesetzgebung der einzelnen Staaten eingreifen und von innen heraus Unterstützung für eine kommunistisch geführte Regierung aufbauen. Dies wird jedoch einen erheblichen Verlust an politischer Macht nach sich ziehen und die Stabilität des Landes gefährden.\n\nDie Veteranen der New Guard beobachten unsere Schritte sehr genau, und sollte die Regierung nicht rechtzeitig handeln oder sollte sich die Stabilität des Landes verschlechtern, könnte dieser Konflikt die Nation vollständig zerreißen.\n\nKommunistische Unterstützung: [?party_popularity_100@communism|Y]§Y%§!\n\n§RSollte die Stabilität auf unter 40% fallen oder der Aufstand der Veteranen ablaufen, bricht ein Bürgerkrieg aus.§!"
 AST_union_control_1_cat_name: "Auswählen, wo Gewerkschaften Unterstützung erhalten sollen"
 AST_union_control_1_map_area_name: "Staaten, auf die noch Einfluss genommen werden kann"
 AST_nationalizing_cat: "Verstaatlichung"
 AST_union_control_2_cat: "Gewerkschaftskontrolle"
 AST_union_control_2_cat_desc: "Die [ROOT.GetAdjective]e Arbeiterschaft stürzte ihre Unterdrücker nicht, um tatenlos zusehen zu müssen, wie die imperialistischen Mächte unsere Genossen in Übersee weiterhin in Ketten halten. Den Kommunismus über unsere Grenzen hinaus zu verbreiten, ist nicht bloß ein ideologisches Ziel, sondern eine strategische Notwendigkeit. Wir müssen die Flammen der Revolution über die Ozeane tragen und jedem Hoffnung und Unterstützung zukommen lassen, der das Joch des Imperialismus abschütteln will, bis die alte Ordnung keinen Halt mehr hat."
 AST_union_control_2_foreign_cat: "Kommunismus unterdrücken"
 AST_union_control_tt: "Es ist wichtig, dass sich die Gewerkschaften in ganz Australien etablieren, doch die Veteranen der „New Guard“ sind bestrebt, die Ausbreitung des Kommunismus zu unterbinden."
 AST_seize_local_leadership_in_state_major: "Lokale Führung über [FROM.GetName] übernehmen"
 AST_seize_local_leadership_in_state_mid: "Lokale Führung über [FROM.GetName] übernehmen"
 AST_seize_local_leadership_in_state_low: "Lokale Führung über [FROM.GetName] übernehmen"
 AST_seize_local_leadership_in_queensland: "Lokale Führung über Queensland übernehmen"
 AST_union_strike: "Streiks organisieren"
 AST_union_strike_desc: "Die Arbeiter verlassen ihre Arbeitsplätze und fordern bessere Arbeitsbedingungen und mehr Rechte, um Druck auf die Regierung auszuüben, neue Reformen einzuführen."
 AST_veterans_revolt: "Aufstand der Veteranen"
 AST_veterans_revolt_desc: "Die Armee ist voller Antikommunisten, von denen viele früher faschistischen Gruppierungen angehörten. Sie verachten den Kommunismus und würden lieber zu den Waffen greifen, als ihn an die Macht kommen zu lassen.\nWenn wir mit unserer Revolution zu lange warten oder die Stabilität zu stark abfällt, werden sie die Sache selbst in die Hand nehmen und den Umsturz gänzlich verhindern."
 AST_organize_in_nation: "§Y[FROM.GetAdjective]e§! Gewerkschaften infiltrieren"
 AST_organize_in_nation_desc: "Die Arbeiterbewegung kennt keine Grenzen. Indem wir Ressourcen in die Netzwerke Gleichdenkender lenken, verankern wir kommunistische Ideale in den [FROM.GetAdjective]en Gewerkschaften und bauen so von innen heraus Unterstützung für die Revolution in der Arbeiterklasse auf."
 AST_civil_war_in_nation: "Revolution in §Y[FROM.GetName]§! entfachen"
 AST_civil_war_in_nation_desc: "Die Saat, die wir ausbrachten, beginnt nun, Früchte zu tragen. Die Unterstützung für den Kommunismus ist in [FROM.GetName] so weit gewachsen, dass eine offene Revolution in greifbarer Nähe ist. Mit finanzieller Unterstützung, Propaganda und einem sorgfältig abgestimmten Vorstoß verwandeln wir die Unzufriedenheit in der Bevölkerung in einen bewaffneten Aufstand und bringen [FROM.GetName] dem Arbeiterstaat, den es verdient, einen Schritt näher."
 AST_take_it_to_foreign_streets: "Internationalen Solidaritätsmarsch der Arbeiter organisieren"
 AST_take_it_to_foreign_streets_desc: "Für Arbeiter gibt es keine Grenzen. Wir müssen zu einer koordinierten internationalen Kampagne aufrufen und australische kommunistische Aktivisten in die Straßen aller Länder entsenden, auf die wir bereits Einfluss nehmen, um die lokalen Arbeiterbewegungen dazu zu bringen, die Flamme der Revolution weiterzutragen."
 AST_take_it_to_foreign_streets_tt: "Dies verlängert die Dauer des kommunistischen Einflusses in allen derzeit unterwanderten Ländern um 60 Tage."
 AST_raj_locked_tt: "Der Raj kann erst ein Ziel werden, wenn Neuseeland, Malaya, Burma, die Philippinen und Indonesien kommunistisch sind."
 AST_supply_arms_to_nation: "§Y[FROM.GetName]§! mit Waffen versorgen"
 AST_supply_arms_to_nation_desc: "Wir versorgen unsere Kameraden mit Waffen."
 AST_strikes_tt: "Wir können §Y$AST_workers_educational_association$§!, §Y$AST_off_leash$§!, §Y$AST_a_national_housing_commission$§!, §Y$AST_guaranteed_employment$§! und §Y$AST_equal_pay$§! nur während eines Streiks abschließen."
 AST_nationalization: "Verstaatlichung beginnen"
 AST_nationalizing_process_tt: "Aktiviert die Entscheidung §YVerstaatlichung beginnen§!, die §YVerstaatlichung im Gange§! auslöst. Dies ist eine Voraussetzung für die unten gelisteten Schwerpunkte und wird bei Abschluss von §YAustralien gehört dem Volk§! entfernt. §RNicht ausgewählte Schwerpunkte werden anschließend gesperrt.§!"
 AST_nationalization_underway_tt: "§YVerstaatlichung im Gange§! \nFabrikleistung: §R-30%§! \nWerftleistung: §R-30%§!"
 AST_nationalizing_process_ends_tt: "§RDie Annahme dieses Schwerpunkts sperrt alle oben genannten Schwerpunkte!§!"
 AST_union_infiltration_in_progress: "Unterwanderung ausländischer Gewerkschaften im Gange"
 AST_cw_operation_in_progress: "Stiftet derzeit zu einer Revolution an"
 AST_seize_local_control_tt: "Kommunisten übernehmen die Kontrolle über den Staat, wodurch sichergestellt ist, dass er im Fall eines Bürgerkriegs auf unserer Seite steht.\n"
 AST_peace_out_all_wars_tt: "[THIS.GetName] verlässt alle laufenden Kriege."
 AST_foreign_overlord_reclaim_foothold_in_target_mission: "Erneut eine Basis in [FROM.GetName] schaffen"
 AST_foreign_overlord_reclaim_foothold_in_target_mission_tt: "Wenn wir oder [?FROM.AST_communist_civil_war_enemy_country.GetName] KEINE Provinz von [FROM.GetName] kontrollieren:"
