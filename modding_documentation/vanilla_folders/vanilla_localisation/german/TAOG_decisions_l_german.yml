 SIA_public_credit_repayment: "Staatskredit zurückzahlen"
 SIA_public_credit_repayment_tt: "Wir zahlen unseren gesamten Staatskredit auf einen Schlag zurück und tilgen so alle Schulden auf Kosten eines vorübergehend höheren §YKonsumgütermalus§!."
 idea_SIA_deficit_spending: "Defizitausgaben"
 idea_SIA_deficit_spending_desc: "Die Regierung gibt mehr aus, als sie sich leisten kann, und nimmt Schulden auf, um Bauvorhaben zu beschleunigen. Die wirtschaftlichen Vorteile sind greifbar, doch irgendwann wird die Rechnung fällig."
 SIA_print_additional_money: "Zusätzliches Geld drucken"
 SIA_print_additional_money_tt: "Wir drucken noch mehr Geld für Japan."
 SIA_appeal_to_industrialists: "An die Industriellen appellieren"
 SIA_implement_industrialists_reforms_countdown: "Reformen der Industriellen einführen"
 SIA_implement_industrialists_reforms_countdown_trigger: "Baut §Y2 Zivilfabriken§! (ausgenommen sind Fabriken, die durch Schwerpunkte und Handel gewonnen wurden)"
 SIA_appeal_to_industrialists_tt: "Wir erhalten die Unterstützung der Industriellen.\n\nSie helfen uns im Bürgerkrieg, indem sie uns zusätzliche Ausrüstung geben. Sie verlangen dafür jedoch, dass wir innerhalb von §Y720 Tagen§! nach Ende des Bürgerkriegs und unserer Machtübernahme unsere industrielle Basis durch den Bau §Y2§! zusätzlicher §YZivilfabriken§! erweitern (ausgenommen sind Fabriken, die durch Schwerpunkte und Handel gewonnen wurden). \n\nSollten wir scheitern, wirkt sich dies negativ auf unsere §YStabilität§! und unsere §YKriegsunterstützung§! aus\n\nBei Ausbruch des Bürgerkriegs erhalten wir: "
 SIA_seek_support_from_constitutional_monarchists: "Konstitutionelle Monarchisten um Unterstützung bitten"
 SIA_implement_constitutionalist_reforms_countdown: "Konstitutionelle Reformen einführen"
 SIA_seek_support_from_constitutional_monarchists_tt: "Wir erhalten die Unterstützung der konstitutionellen Monarchisten.\n\nSie helfen uns im Bürgerkrieg, indem sie uns zusätzliche Divisionen geben. Sie verlangen dafür jedoch, dass wir eine konstitutionelle Monarchie bleiben, indem wir innerhalb von §Y720 Tagen§! nach unserer Machtübernahme den Schwerpunkt §Y$SIA_a_constitutional_monarchy$§! abschließen.\n\nSollten wir scheitern, wirkt sich dies negativ auf unsere §YStabilität§! und unsere §YKriegsunterstützung§! aus"
 SIA_appeal_to_rural_people: "An die Landbevölkerung wenden"
 SIA_appeal_to_rural_people_tt: "Wir erhalten die Unterstützung der Landbevölkerung.\n\nSie hilft uns im Bürgerkrieg, indem sie Milizen aufstellt. Sie verlangt dafür jedoch, dass wir innerhalb von §Y720 Tagen§! nach unserer Machtübernahme vorteilhafte Landwirtschaftsreformen erlassen, indem wir entweder den Schwerpunkt §Y$SIA_mechanization_of_agriculture$§! oder §Y$SIA_reduction_of_agricultural_yield_taxes$§! abschließen.\n\nSollten wir scheitern, wirkt sich dies negativ auf unsere §YStabilität§! und unsere §YKriegsunterstützung§! aus\n\nBei Ausbruch des Bürgerkriegs erhalten wir: "
 SIA_implement_rural_reforms_countdown: "Landwirtschaftsreformen erlassen"
 SIA_implement_absolutist_reforms_countdown: "Absolutistische Reformen erlassen"
 SIA_seek_support_from_absolutists_monarchists: "Absolutistische Monarchisten um Unterstützung bitten"
 SIA_seek_support_from_absolutists_monarchists_tt: "Wir erhalten die Unterstützung der absolutistischen Monarchisten.\n\nSie helfen uns im Bürgerkrieg, indem sie uns zusätzliche Divisionen geben. Sie verlangen dafür jedoch, dass wir eine absolute Monarchie bleiben, indem wir innerhalb von §Y720 Tagen§! nach unserer Machtübernahme den Schwerpunkt §Y$SIA_an_absolute_monarchy$§! abschließen.\n\nSollten wir scheitern, wirkt sich dies negativ auf unsere §YStabilität§! und unsere §YKriegsunterstützung§! aus"
 SIA_appeal_to_navy_clique: "An die Marine appellieren"
 SIA_appeal_to_navy_clique_countdown: "Marinereformen erlassen"
 SIA_appeal_to_navy_clique_tt: "Wir erhalten die Unterstützung der Marine.\n\nSie hilft uns im Bürgerkrieg, indem sie uns unsere gesamte Marine und Marinedivisionen zur Verfügung stellt. Sie verlangt dafür jedoch, dass wir innerhalb von §Y720 Tagen§! nach unserer Machtübernahme vorteilhafte Marinereformen erlassen, indem wir den Schwerpunkt §Y$SIA_thonburi_class_coastal_defense_ship$§! abschließen.\n\nSollten wir scheitern, wirkt sich dies negativ auf unsere §YStabilität§! und unsere §YKriegsunterstützung§! aus\n\nBei Ausbruch des Bürgerkriegs erhalten wir:\n§YUnsere gesamte Marine§!\nDie Marinedivision §YRoyal Thai Marine Corps§!\nDie Technologie §YMarineinfanterie§!"
 SIA_appeal_for_support_cat: "Um Unterstützung bitten"
 SIA_appeal_for_support_cat_desc: "Keine politische Bewegung hat ohne Unterstützung Erfolg. Monarchisten, Verfechter der konstitutionellen Monarchie, Soldaten und Zivilisten haben jeweils Einfluss auf andere Teile des Landes. Wenn wir ihre Unterstützung wollen, müssen wir unsere Beziehungen zu ihnen sorgfältig pflegen."
 SIA_demand_independence: "Unabhängigkeit von §Y[FROM.GetName]§! von §Y[FROM.OVERLORD.GetName]§! fordern"
