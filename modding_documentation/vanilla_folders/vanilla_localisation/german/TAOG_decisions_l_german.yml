 #LIMITED WAR
 SIA_limited_war_cat: "Begrenzter Krieg"
 SIA_limited_war_cat_desc: "Wir können nicht darauf hoffen, die Großmächte der Region in einem offenen Krieg zu besiegen - noch nicht. Indem wir unsere Ansprüche Stück für Stück verfolgen, schwächen wir jedoch die Position dieser Großmächte, wohingegen unsere eigene immer weiter gestärkt wird."
 SIA_start_limited_war_indochina: "Beginnt einen begrenzten Krieg gegen [FROM.GetName] in Indochina"
 SIA_start_limited_war_indochina_tt_main: "Beginnt einen §Ybegrenzten Krieg§! gegen §Y[FROM.GetName]§!.\nIndem wir alle hervorgehobenen Staaten kontrollieren, die §Y[FROM.GetName]§! gehören, können wir diese übernehmen, ohne den Krieg zu einem totalen Krieg eskalieren zu lassen.\n§RMehr als [?var:global.limited_war_surrender_threshold|%.0] Kapitulationsfortschritt zu verlieren, führt dazu, dass wir den begrenzten Krieg verlieren§!\n\n§RDen begrenzten Krieg zu verlieren, kann dazu führen, dass wir zuvor eroberte Territorien zurückgeben müssen§!"
 SIA_start_limited_war_rejoin_faction: "Wir verlassen vorübergehend unser derzeitiges Bündnis und treten ihm nach dem Ende des §Ybegrenzten Krieges§! wieder bei."
 SIA_start_limited_war_can_join_faction: "Wir können Bündnissen nach Ende des §Ybegrenzten Krieges§! wieder beitreten"
 is_not_engaged_in_a_limited_war: "Führt keinen §Ybegrenzten Krieg§!"
 SIA_limited_war_indochina: "[SIA_GetLimitedWarTarget]"
 SIA_limited_war_indochina_desc: "Wir müssen die Kontrolle über die hervorgehobenen Staaten übernehmen, um den §Ybegrenzten Krieg§! zu gewinnen und sie zu beanspruchen, ohne dass der Krieg zu einem totalen Krieg eskaliert.\n§RMehr als [?var:global.limited_war_surrender_threshold|%.0] Kapitulationsfortschritt zu verlieren, führt dazu, dass wir den begrenzten Krieg verlieren§!"
 SIA_limited_war_indochina_target: "§YBegrenzter Krieg§! gegen §Y[?var:limited_war_target.GetName]§!"
 SIA_limited_war_indochina_no_target: "Begrenzter Krieg gescheitert"
 SIA_start_limited_war_malaysia_burma: "Begrenzten Krieg gegen [FROM.GetName] beginnen"
 SIA_new_territories_administration_cat: "Verwaltung neuer Territorien"
 SIA_new_territories_administration_cat_desc: "Die Eroberung ist erst der Anfang. Die von uns eingenommenen Territorien müssen verwaltet, entwickelt und verteidigt werden, wenn sie zu einem dauerhaften Teil der Nation werden sollen und nicht zu einer Belastung, die eine Rückeroberung provoziert."
 SIA_finish_the_triangular_defense_network: "Das Verteidigungsdreieck fertigstellen"
 SIA_finish_the_triangular_defense_network_desc: "Mit der Fertigstellung der beiden Festungen im Norden und Süden können wir diese nun zusammen mit Bangkok zu einem Verteidigungsdreieck ausbauen. Sollte eine Festung fallen, bleiben die anderen weiter einsatzfähig."
