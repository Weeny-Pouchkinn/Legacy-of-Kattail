 INS_war_escalation_level_tt: "§YDerzeitige Eskalation§!\n\nDie Eskalationsstufe erhöht sich zum einen mit der Zeit und zum anderen durch Milizen, die §Yneue Staaten besetzen§!, sowie durch [HOL.GetAdjective]e Maßnahmen zur Bekämpfung der Milizenaktivität. Ist die Eskalationsstufe hoch genug, kann sich die Situation zu einem §Rtotalen Krieg§! entwickeln."
