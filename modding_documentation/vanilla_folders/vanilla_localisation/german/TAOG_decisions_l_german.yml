l_german:
 HOL_recall_conrad_helfrich: "Conrad Helfrich aus Niederländisch-Indien zurückbeordern"
 HOL_recall_conrad_helfrich_desc: "In diesen schwierigen Zeiten müssen wir unser Heimatland über alles andere stellen. Conrad Helfrich, der beste Admiral der Königlich-Niederländischen Marine, muss in die Niederlande zurückkehren."
 INS_is_taking_volksraad: "Verabschiedet derzeit ein Gesetz im Volksraad"
 INS_volksraad_cat: "Der Volksraad"
 INS_volksraad_cat_desc: "Der Volksrat, auf Niederländisch „Volksraad“ genannt, wurde 1918 als Versuch gegründet, in Niederländisch-Indien im Rahmen der „Ethischen Politik“ eine Demokratie einzuführen. Die Sitze sind sowohl von niederländischen als auch indonesischen Vertretern besetzt, die auf unterschiedliche Weise ausgewählt werden. Obschon die Niederlande ein uneingeschränktes Vetorecht hat, kann der Volksraad Anträge und Gesetzesentwürfe an die Regierung weiterleiten."
 INS_volksraad_allow_language_in_schools: "Indonesische Sprache in Schulen erlauben"
 INS_volksraad_allow_language_in_schools_desc: "Der Zugang zu höherer Bildung in Niederländisch-Indien ist weitgehend auf die niederländische Bevölkerung und wohlhabendere Indonesier beschränkt, die Niederländisch sprechen, da dies die einzige Sprache ist, in der an Hochschulen unterrichtet wird. Ein im Volksraad vorgelegter Antrag zur Einrichtung indonesischsprachiger Schulen wartet derzeit auf die Zustimmung des Generalgouverneurs."
 INS_volksraad_allow_language_in_government: "Indonesische Sprache in der Regierung erlauben"
 INS_volksraad_allow_language_in_government_desc: "Für Regierungsämter in Niederländisch-Indien, einschließlich einer Mitgliedschaft im Volksraad, sind fließende Niederländischkenntnisse erforderlich, was dazu führte, dass viele im Volksraad, insbesondere Vertreter der einheimischen Gemeinschaften, die Legitimität der Demokratie infrage stellen. Sie legten einen Antrag vor, mit dem sie fordern, dass Regierungsämter vorrangig mit Personen besetzt werden sollten, die Indonesisch sprechen."
 INS_volksraad_remove_education_quotas: "Das Bildungsquotensystem abschaffen"
 INS_volksraad_remove_education_quotas_desc: "Das Bildungssystem in Niederländisch-Indien ist derzeit auf einer Bildungsquote aufgebaut, aufgrund derer eine bestimmte Anzahl indonesischer Schüler sowie eine bestimmte Anzahl niederländischer Schüler aufgenommen werden müssen. Manche im Volksraad sind der Ansicht, das System begünstige die Niederländer in unfairer Weise. Der Volksraad kann entweder noch jahrelang darüber streiten, auf welche Weise das System reformiert werden soll, doch wäre es nicht vielleicht sinnvoll, das Quotensystem komplett abzuschaffen?"
 INS_volksraad_reduce_rubber_export_tax: "Exportsteuer auf den privaten Kautschukhandel senken"
 INS_volksraad_reduce_rubber_export_tax_desc: "Derzeit wird nicht-staatlichen Exporten von Kautschuk eine extrem hohe Steuer auferlegt, wodurch wir ein Monopol auf dem Markt aufrechterhalten. Dies führte jedoch in einigen Regionen zu wirtschaftlicher Stagnation, da private Plantagen aufgrund der hohen Kosten nicht länger betrieben werden können. Zum Zeitpunkt der Einführung wurde dies als sinnvoll erachtet, doch der internationale Protektionismus infolge der Weltwirtschaftskrise resultierte darin, dass unsere Kautschuk-Exporte weit weniger lukrativ sind. Wir sollten in Erwägung ziehen, die Steuer zu senken, um die Wirtschaft anzukurbeln."
 INS_volksraad_knil_rank_limit: "Antidiskriminierungsgesetze für militärische Dienstgrade verabschieden"
 INS_volksraad_knil_rank_limit_desc: "Es ist zwar nicht formell niedergeschrieben, dass Indonesier innerhalb der KNIL nicht aufsteigen dürfen, doch es gibt eine ungeschriebene Regel, die dies untersagt, sodass selbst die fähigsten Offiziere nicht über den Rang eines Obersts hinaus aufsteigen können. Mehrere Gruppierungen im Volksraad üben nun Druck auf die Regierung aus, um die Leistungen der besonders verdienstvollen indonesischen Offiziere anzuerkennen."
 INS_volksraad_legalize_displaying_flag: "Die rot-weiße Flagge legalisieren"
 INS_volksraad_legalize_displaying_flag_desc: "Aufgrund der Verbindung zu nationalistischen, antikolonialen Gruppierungen ist es derzeit verboten, die rot-weiße Flagge von „Indonesien“ in der Öffentlichkeit zu zeigen. Dies zu legalisieren, würde unsere Kooperationsbereitschaft zeigen und dazu beitragen, die fortschreitende Radikalisierung von Nationalisten im gesamten Archipel zu stoppen."
 INS_volksraad_education_subsidies_for_indonesians: "Bildungszuschüsse für Nicht-Niederländer"
 INS_volksraad_education_subsidies_for_indonesians_desc: "Im Volksrat diskutiert man seit einiger Zeit über Zuschüsse und Stipendien, die niederländischen Studenten in Niederländisch-Indien gewährt werden. Mehrere Vertreter der einheimischen Gemeinschaften im Volksraad argumentieren, dieses System sollte auf alle Studenten ausgeweitet werden, unabhängig von ihrer Herkunft. Dies würde uns viel Wohlwollen bei der Bevölkerung einbringen, wäre jedoch nicht billig."
 INS_volksraad_indonesian_national_language: "Indonesisch zur offiziellen Amtssprache erklären"
 INS_volksraad_indonesian_national_language_desc: "Die indonesische Sprache entwickelte sich in vielen Teilen des Archipels zu einer gemeinsamen Sprache und überbrückt so die sprachliche Kluft zwischen den Kulturen. Da Indonesisch nun im Bildungswesen und in staatlichen Ämtern zugelassen ist, setzen sich viele Vertreter des Volksraads dafür ein, dass sie auch als rechtliche Amtssprache der Kolonie anerkannt wird und damit denselben Status wie Niederländisch erhält."
 INS_volksraad_official_flag: "Die indonesische Flagge offiziell anerkennen"
 indonesia_volksraad_official_flag_effect_tt: "Unsere Flagge wird zur rot-weißen-Flagge geändert."
 INS_volksraad_official_flag_desc: "Die durch den Volksraad vorangetriebene Autonomie war letztlich erfolgreich, und was noch vor wenigen Jahren als Niederländisch-Indien bekannt war, ist nun das Dominion Indonesien. Unsere Flagge muss entsprechend angepasst werden."
 indonesia_volksraad_passed_6: "Hat Antidiskriminierungsgesetze für das Militär erlassen"
 INS_autonomy_indonesian_in_schools: "Indonesische Sprache in Schulen erlaubt"
 INS_autonomy_indonesian_in_govenment: "Indonesische Sprache in der Regierung erlaubt"
 INS_autonomy_no_education_quotas: "Bildungsquote abgeschafft"
 INS_autonomy_reduced_rubber_tax: "Exportsteuer auf Kautschuk reduziert"
 INS_autonomy_knil_rank_limit: "Antidiskriminierungsgesetze für das Militär erlassen"
 INS_autonomy_flag_legalized: "Zeigen der rot-weißen Flagge legalisiert"
 INS_autonomy_education_subsidies: "Bildungssubventionen für Indonesier verfügbar"
 INS_autonomy_national_language: "Indonesische Sprache wird anerkannt"
 INS_autonomy_official_flag: "Indonesische Flagge wird genutzt"
 INS_move_capital_to_amsterdam: "Hauptstadt nach Amsterdam verlegen"
 INS_move_capital_to_batavia: "Hauptstadt nach Batavia verlegen"
