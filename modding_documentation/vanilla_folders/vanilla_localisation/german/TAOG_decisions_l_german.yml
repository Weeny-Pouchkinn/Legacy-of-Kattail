 AST_summons_to_australian_hall: "In der Australian Hall versammeln"
 AST_summons_to_australian_hall_desc: "Um die [AST.GetFascistParty] zu stärken und zu vergrößern, müssen wir unsere Anhänger sammeln und mobilisieren: Die Australian Hall wartet auf uns."
 AST_summons_to_australian_hall_upgrade: "$AST_summons_to_australian_hall$"
 AST_summons_to_australian_hall_upgrade_desc: "$AST_summons_to_australian_hall_desc$"
 AST_print_the_publicist: "Den Publicist drucken"
 AST_print_the_publicist_desc: "Der Publicist, die Zeitschrift von Australia First, spielt eine wichtige Rolle dabei, potenzielle Unterstützer zu erreichen. Durch die Veröffentlichung einer weiteren Ausgabe können wir unsere Botschaft weiter verbreiten."
 AST_print_the_publicist_upgrade: "$AST_print_the_publicist$"
 AST_print_the_publicist_upgrade_desc: "$AST_print_the_publicist_desc$"
 AST_call_on_fascists: "[GET_AST_CALL_ON_FASCISTS]"
 AST_call_on_fascists_desc: "Da das Australia First Movement noch recht klein ist, verfügt es nur über begrenzte finanzielle Mittel. Gleichgesinnte Gruppen aus dem Ausland signalisierten jedoch ihre Bereitschaft, unsere Vorhaben finanziell zu unterstützen, und boten damit eine Lösung an, die unseren weiteren Vormarsch sicherstellt."
 AST_call_on_japanese_fascists: "Mit japanischen Faschisten zusammenarbeiten"
 AST_call_on_foreign_fascists: "Mit anderen Faschisten zusammenarbeiten"
 AST_a_convenient_disaster: "Ein vorteilhafter Unfall"
 AST_a_convenient_disaster_desc: "Wie beliebt Australia First auch immer werden wird: Konservative Stimmen lehnen die Ideologie dieser Bewegung nach wie vor ab. Damit Australia First an die Macht kommen kann, ist unter Umständen etwas Dramatischeres vonnöten als reguläre Wahlen – etwas, was die Regierung in Aufruhr versetzt.\n\nUnsere Bewegung ist nicht in der Lage, ein solches Ereignis selbst herbeizuführen, doch unsere faschistischen Unterstützer im Ausland könnten es. Wenn sie unseren Aufstieg zur Macht unterstützen, werden sie in [AST.GetName] einen Verbündeten finden."
 AST_a_convenient_disaster_tt: "\nDieses Ereignis wird die amtierende Regierung destabilisieren und letztlich dazu führen, dass die §Y[AST.GetFascistParty]§! zur Regierungspartei wird."
 AST_a_convenient_disaster_flag: "Der §YFlugzeugabsturz in Canberra§! wurde durch die Entscheidung §YEin vorteilhafter Unfall§! ausgelöst."
