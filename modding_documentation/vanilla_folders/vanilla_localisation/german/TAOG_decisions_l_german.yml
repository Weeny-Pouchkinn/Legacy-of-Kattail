 INS_can_raid_here_HOL_tt: "Dieser Staat bietet ein mögliches Ziel für einen Landüberfall durch die Miliz der Republik. Bei Erfolg verlieren wir den Staat. Um den Staat vor möglichen Überfällen zu schützen, können wir:\n$success_modifier_INS_has_influence_mod_counterplay$\n$success_modifier_INS_defense_modifier_counterplay$\n$success_modifier_INS_naval_dominance_modifier_counterplay$\n- Die §YLuftüberlegenheit§! erhöhen\n- Die Geheiminformationsbeschaffung unserer Feinde stören\n- Den Widerstand im Staat senken"
