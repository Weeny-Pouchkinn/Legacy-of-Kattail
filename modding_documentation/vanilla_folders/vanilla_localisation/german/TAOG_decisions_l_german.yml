 SIA_demand_independence_CAM: "Freilassung von §Y[CAM.GetName]§! fordern"
 SIA_demand_independence_CAM_tt: "Wir fordern den derzeitigen Besitzer auf, [CAM.GetName] freizulassen"
 SIA_invite_to_adc: "§Y[FROM.GetName]§! in unser Bündnis einladen"
 SIA_asian_democratic_compact_cat: "Asiatischer Demokratischer Pakt"
 SIA_asian_democratic_compact_cat_desc: "Die Völker Asiens haben das Recht, sich selbst zu regieren. Als Verfechter eines unabhängigen Asiens üben wir Druck auf die Kolonialmächte aus, damit sie die von ihnen besetzten Nationen freigeben."
 SIA_khana_ratsadon_cat: "Die Khana Ratsadon"
 SIA_khana_ratsadon_cat_desc: "Die Khana Ratsadon, die Volkspartei, die der absoluten Monarchie ein Ende setzte, ist kein monolithisches Gebilde. Ihr militärischer und ihr ziviler Flügel verfolgen jeweils eine eigene Vision für das Land, und bei jeder getroffenen Entscheidung sind die Spannungen zwischen ihnen spürbar. Wir müssen dafür sorgen, dass beide Fraktionen zufrieden sind, damit die fragile Koalition nicht gänzlich zerbricht."
 SIA_army_navy_reform_cat: "Armee und Marine"
 SIA_army_navy_reform_cat_desc: "Die Armee und die Marine konkurrieren um dieselben begrenzten Ressourcen, und es ist ein ständiger Balanceakt, die verfügbaren Mittel zwischen ihnen zu verteilen, da jede Umverteilung Auswirkungen auf die Einsatzbereitschaft der jeweils anderen Seite hat."
 SIA_divert_army_funds_to_navy_toggle: "[SIA_GetDivertingArmyFundsToNavyTitle]"
 SIA_divert_army_funds_to_navy_toggle_tt: "[SIA_GetDivertingArmyFundsToNavyTT]"
 SIA_divert_army_funds_to_navy_toggle_do: "Armeegelder an die Marine umleiten"
 SIA_divert_army_funds_to_navy_toggle_do_tt: "Wir werden einen Teil unserer finanziellen Mittel für unsere Armee an die Marine umleiten, um deren Ausbau zu beschleunigen."
 SIA_divert_army_funds_to_navy_toggle_undo: "Armeegelder nicht mehr an die Marine umleiten"
 SIA_divert_army_funds_to_navy_toggle_undo_tt: "Wir leiten nicht länger einen Teil unserer finanziellen Mittel für unsere Armee an die Marine um."
 SIA_standing_our_ground_mission: "Standhaft bleiben"
 SIA_standing_our_ground_mission_tt: "Wir müssen für unsere Freiheit kämpfen."
 SIA_sway_generals_to_seri_thai_tt: "Jene Generäle, die wir auf die Seite der Seri Thai gezogen haben, schließen sich uns statt den Loyalisten an, wenn der Bürgerkrieg ausbricht."
 SIA_sway_general_cw_scale_tt: "Erhöht unsere Unterstützung im Bürgerkrieg um §Y5%§!\nWenn die Unterstützung bei über §Y80%§! liegt, bricht KEIN Bürgerkrieg aus und wir reißen ungehindert die Macht an uns"
 SIA_sway_luang_chawengsaksongkhram_to_seri_thai: "Luang Chawengsaksongkhram beeinflussen"
 SIA_sway_luang_chawengsaksongkhram_to_seri_thai_desc: "Wir versuchen, Luang Chawengsaksongkhram für die Seri Thai zu gewinnen. Dies führt dazu, dass er sich uns bei Ausbruch eines Bürgerkriegs anschließen wird."
 SIA_sway_aditya_dibabha_to_seri_thai: "Aditya Dibabha beeinflussen"
 SIA_sway_aditya_dibabha_to_seri_thai_desc: "Wir versuchen, Aditya Dibabha für die Seri Thai zu gewinnen. Dies führt dazu, dass er sich uns bei Ausbruch eines Bürgerkriegs anschließen wird."
 SIA_sway_mangkorn_phromyothi_to_seri_thai: "Mangkorn Phromyothi beeinflussen"
 SIA_sway_mangkorn_phromyothi_to_seri_thai_desc: "Wir versuchen, Mangkorn Phromyothi für die Seri Thai zu gewinnen. Dies führt dazu, dass er sich uns bei Ausbruch eines Bürgerkriegs anschließen wird."
 SIA_sway_luang_haansongkhram_to_seri_thai: "Luang Haansongkhram beeinflussen"
 SIA_sway_luang_haansongkhram_to_seri_thai_desc: "Wir versuchen, Luang Haansongkhram für die Seri Thai zu gewinnen. Dies führt dazu, dass er sich uns bei Ausbruch eines Bürgerkriegs anschließen wird."
 SIA_sway_charun_rattanakun_seriroengrit_to_seri_thai: "Charun Rattanakun Seriroengrit beeinflussen"
 SIA_sway_charun_rattanakun_seriroengrit_to_seri_thai_desc: "Wir versuchen, Charun Rattanakun Seriroengrit für die Seri Thai zu gewinnen. Dies führt dazu, dass er sich uns bei Ausbruch eines Bürgerkriegs anschließen wird."
 SIA_sway_phichit_kriangsakphichit_to_seri_thai: "Phichit Kriangsakphichit beeinflussen"
 SIA_sway_phichit_kriangsakphichit_to_seri_thai_desc: "Wir versuchen, Phichit Kriangsakphichit für die Seri Thai zu gewinnen. Dies führt dazu, dass er sich uns bei Ausbruch eines Bürgerkriegs anschließen wird."
 SIA_sway_jira_wichitsongkhram_to_seri_thai: "Jira Wichitsongkhram beeinflussen"
 SIA_sway_jira_wichitsongkhram_to_seri_thai_desc: "Wir versuchen, Jira Wichitsongkhram für die Seri Thai zu gewinnen. Dies führt dazu, dass er sich uns bei Ausbruch eines Bürgerkriegs anschließen wird."
 SIA_sway_phin_choonhavan_to_seri_thai: "Phin Choonhavan beeinflussen"
 SIA_sway_phin_choonhavan_to_seri_thai_desc: "Wir versuchen, Phin Choonhavan für die Seri Thai zu gewinnen. Dies führt dazu, dass er sich uns bei Ausbruch eines Bürgerkriegs anschließen wird."
 SIA_sway_tiang_sirikhan_to_seri_thai: "Tiang Sirikhan beeinflussen"
 SIA_sway_tiang_sirikhan_to_seri_thai_desc: "Wir versuchen, Tiang Sirikhann für die Seri Thai zu gewinnen. Dies führt dazu, dass er sich uns bei Ausbruch eines Bürgerkriegs anschließen wird."
 SIA_khana_ratsadon_dummy_military: "Risiko eines Militärputsches"
 SIA_khana_ratsadon_dummy_military_tt: "Das Militär wird einen Staatsstreich anzetteln, wenn wir es zu sehr verärgern. Um einen Bürgerkrieg zu vermeiden, sollten wir §Y$idea_SIA_military_rebellious$§! nicht zu lange aktiv haben."
 SIA_khana_ratsadon_dummy_military_desc: "Das Militär ist eine mächtige Clique der Khana-Ratsadon-Partei. Es wird keine politischen Maßnahmen gutheißen, die seinen Interessen zuwiderlaufen, wohl aber solche, die der Militarisierung des Landes dienen."
 SIA_khana_ratsadon_military_coup_mission: "Das Militär plant, die Regierung zu stürzen!"
 SIA_khana_ratsadon_military_coup_mission_desc: "Das Militär betrachtet die derzeitige Politik der Regierung als Bedrohung. Es plant aktiv, die Regierung zu stürzen, sollte sich diese nicht anders positionieren."
 SIA_khana_ratsadon_dummy_civilian: "Risiko eines Staatsstreichs des Zivilflügels"
 SIA_khana_ratsadon_dummy_civilian_tt: "Der Zivilflügel wird einen Staatsstreich anzetteln, wenn wir ihn zu sehr verärgern. Um einen Bürgerkrieg zu vermeiden, sollten wir §Y$idea_SIA_civilian_rebellious$§! nicht zu lange aktiv haben."
 SIA_khana_ratsadon_dummy_civilian_desc: "Der Zivilflügel ist eine mächtige Clique der Khana-Ratsadon-Partei. Er wird keine politischen Maßnahmen gutheißen, die seinen Interessen zuwiderlaufen, wohl aber solche, die pro-demokratisch und pro-zivil sind."
 SIA_khana_ratsadon_civilian_coup_mission: "Der Zivilflügel plant, die Regierung zu stürzen!"
 SIA_khana_ratsadon_civilian_coup_mission_desc: "Der Zivilflügel betrachtet die derzeitige Politik der Regierung als Bedrohung. Er plant aktiv, die Regierung zu stürzen, sollte sich diese nicht anders positionieren."
 SIA_promote_civilian_wing: "Den Zivilflügel direkt bevorzugen"
 SIA_promote_civilian_wing_desc: "Indem sich die Regierung voll und ganz hinter die Agenda des Zivilflügel in Bezug auf Landreformen, das Rechtswesen und die Verfassung stellt, sichern wir uns die Dankbarkeit von Pridis Fraktion. Eine solche Bevorzugung wird bei dem Militärflügel jedoch nicht unbemerkt bleiben. Einerseits werden wir die Offiziere verärgern und andererseits wird uns die Unordnung in der Verwaltung teuer zu stehen kommen, bis sich die Lage wieder beruhigt hat."
 SIA_promote_military_wing: "Den Militärflügel direkt bevorzugen"
 SIA_promote_military_wing_desc: "Indem wir den Forderungen der Offiziere nachgeben und die Stärke der Streitkräfte zur Schau stellen, sichern wir uns die Gunst von Phibuns Fraktion. Eine solche Bevorzugung wird beim Zivilflügel jedoch nicht unbemerkt bleiben. Die Neuausrichtung bringt den Alltag der Armee durcheinander, und unsere Verwaltung wird beeinträchtigt, bis sich die Lage wieder beruhigt hat. Es ist eine grobe Kelle, die nur dazu taugt, die Truppe von einer Revolte abzuhalten."
 SIA_cultivate_civilian_wing: "Beziehungen zum Zivilflügel pflegen"
 SIA_cultivate_civilian_wing_desc: "Die Stellung, die wir uns durch die Direktive des Büros des Königshauses sicherten, erlaubt uns eine vorsichtige Annäherung an den Zivilflügel. Durch diese allmähliche Annäherung rufen wir keine Gegenreaktion von Seiten des Militärflügels hervor und können Pridis Fraktion nach und nach für uns gewinnen, indem wir ihr ein Zugeständnis nach dem anderen machen. Es ist ein langer Weg, aber wir können ihn so weit gehen, wie wir wollen."
 SIA_cultivate_military_wing: "Beziehungen zum Militärflügel pflegen"
 SIA_cultivate_military_wing_desc: "Die Stellung, die wir uns durch die Direktive des Büros des Königshauses sicherten, erlaubt uns eine vorsichtige Annäherung an den Militärflügel. Durch diese allmähliche Annäherung rufen wir keine Gegenreaktion von Seiten des Zivilflügels hervor und können das Offizierskorps nach und nach für uns gewinnen, indem wir ihm ein Zugeständnis nach dem anderen machen. Es ist ein langer Weg, aber wir können ihn so weit gehen, wie wir wollen."
 SIA_end_factionalism_mission: "Die Koalition zusammenhalten"
 SIA_end_factionalism_mission_desc: "Beide Flügel der Khana Ratsadon stehen voll hinter der Regierung. Sollten es uns gelingen, §Y270§! Tage lang ihre §Gvolle Unterstützung§! zu erhalten, können wir die zwischen ihnen herrschende Rivalität ein für alle Mal beenden. Sollte diese Unterstützung jedoch bei einem der beiden Flügel ins Wanken geraten, müssen wir von vorn beginnen."
