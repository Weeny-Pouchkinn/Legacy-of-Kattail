 INS_no_raids_allowed_tt: "§W§RSolange diese Entscheidung aktiv ist, können keine Überfälle durchgeführt werden.§!§!"
 INS_is_deescalating_tt: "Führt derzeit keine Deeskalationsmission durch"
 INS_escalate_the_conflict: "Konflikt eskalieren"
 INS_escalate_the_conflict_desc: "Wir organisieren Aufstände und Scharmützel mit den feindlichen Truppen, um die Spannungen und die Eskalationsstufe zu erhöhen. Dies führt dazu, dass spätere Maßnahmen auf weniger internationalen Widerstand treffen."
 INS_escalate_the_conflict_HOL: "$INS_escalate_the_conflict$"
 INS_escalate_the_conflict_HOL_desc: "$INS_escalate_the_conflict_desc$"
 INS_deescalate_the_conflict: "Um Vermittlung bitten"
 INS_deescalate_the_conflict_2: "Waffenstillstand anordnen"
 INS_deescalate_the_conflict_desc: "Die Niederländer werden nicht im Guten mit uns verhandeln. Für sie sind wir Rebellen, ein Ärgernis, das es zu unterdrücken gilt, und keine Nation, mit der man zusammenarbeiten könnte. Doch die Großmächte der Welt sind anderer Meinung und Den Haag kann ihre Meinung nicht so leicht abtun. Wir werden die internationale Gemeinschaft um Vermittlung bitten und darauf setzen, dass äußerer Druck das schafft, was wir mit unserer eigenen Stimme nicht erreichen können."
 INS_deescalate_the_conflict_2_desc: "Unsere Überfälle zeigen Wirkung. Die Kolonialgarnison weiß nun, wozu wir imstande sind, und in Den Haag ist man sich bewusst, dass wir uns nicht einschüchtern lassen. Jeder Angriff gibt den Niederlanden jedoch einen neuen Vorwand, weitere Männer und Schiffe für einen Krieg zu entsenden, für den wir noch nicht bereit sind. Wir müssen unsere Kommandanten anweisen, das Feuer einzustellen. Der nächste Schlag erfolgt, wenn wir es anordnen, und nicht, wenn die Niederländer uns dazu provozieren."
 INS_renville_tt_HOL: "§W§Y[USA.GetFlag][USA.GetNameDefCap]§! verhängen ein Ultimatum gegen uns. Wenn wir uns nicht aus Indonesien zurückziehen und nachgeben, werden sie uns den §RKrieg erklären§!.§!"
 INS_renville_wont_happen_neutral_tt: "Der Konflikt wird beendet sein, bevor die amerikanischen Verhandlungen abgeschlossen sind. Die Amerikaner werden nicht mehr eingreifen können."
 INS_renville_explain_USA_tt: "Sollte der Konflikt nicht innerhalb von §Y365 Tagen§! beigelegt sein:\n\n"
 INS_renville_timer_mission_republic: "Renville-Verhandlungen ausstehend"
 INS_renville_timer_mission_HOL: "$INS_renville_timer_mission_republic$"
 INS_national_revolution_peace_negotiation: "Rückzug von [FROM.GetName] aushandeln"
 indonesia_reduce_escalation_1_effect_tooltip_for_min_4: "Reduziert die Eskalation um §G1§! bis zu einem Minimum von §Y4§!."
 INS_ongoing_influence_process: "Richtet nicht bereits einen Milizenstützpunkt ein"
 INS_current_revolution_strength_3_tt: "Dieser Staat hat derzeit eine §Ghohe§! Milizenaktivität"
 INS_current_revolution_strength_0_tt: "Dieser Staat hat derzeit keine Milizenaktivität"
 INS_has_spent_points_trigger_tt: "Kann keine weiteren Milizenstützpunkte errichten"
 INS_national_revolution_cat: "Indonesische Revolution"
 INS_national_revolution_cat_desc: "Nach 350 Jahren niederländischer Tyrannei nahmen wir die Dinge selbst in die Hand und erklärten unsere Unabhängigkeit. Die Niederlande erkennen unsere Autorität jedoch nicht an und herrschen weiterhin über Niederländisch-Indien als ihre Kolonie und behandeln uns dabei wie Verbrecher.\n\nWir müssen unsere Kontrolle über weitere Regionen und wichtige Städte ausweiten und die niederländische Regierung von innen heraus stürzen. Wir sollten jedoch darauf achten, nicht zu aggressiv vorzugehen, da eine schnelle Eskalation unsererseits militärische Maßnahmen der Niederlande provozieren könnte."
 INS_national_revolution_cat_map: "Aufstände antäuschen"
 INS_national_revolution_dutch_cat: "Revolutionäre Milizen in Niederländisch-Indien"
 INS_national_revolution_dutch_cat_desc: "Revolutionäre in Niederländisch-Indien erklärten ohne unsere Einwilligung die Unabhängigkeit und übernahmen mit ihren Milizen die Kontrolle über Teile des Landes. Aufgrund der schieren Anzahl der dort stationierten Milizen gelang es uns bislang nicht, die Kontrolle über diese Territorien zurückzuerlangen.\n\nWir müssen sie aufhalten, bevor sie die Kontrolle über weitere Städte übernehmen und die Verwaltung von Niederländisch-Indien komplett destabilisieren. Ein militärischer Einsatz mag zwar eine extreme Maßnahme sein, könnte aber nötig werden, falls sich die Lage verschlechtert."
 INS_HOL_revolution_not_going_well_tt: "§ROhne Batavia können wir Niederländisch-Indien nicht verwalten und uns bleibt keine andere Wahl, als einen Frieden mit den Revolutionären auszuhandeln.§!"
 INS_gradual_escalation_republic: "Allmähliche Eskalation"
 INS_gradual_escalation_HOL: "Allmähliche Eskalation"
 INS_gradual_escalation_republic_desc: "Die niederländischen Repressalien sind nach jedem unserer Überfälle härter geworden, und ihre Patrouillen dringen in Gebiete vor, die sie schon vor Monaten aufgegeben hatten. Unsere Kommandanten berichten von heftigeren Kämpfen an Orten, die längst als gesichert galten, und unsere Verluste steigen schneller, als die Rekrutierer neue Truppen anwerben können. Der Konflikt weitet sich auf Provinzen aus, in denen es im letzten Jahr noch ruhig war."
 INS_gradual_escalation_HOL_desc: "Die Berichte werden von Woche zu Woche düsterer. Die Rebellen greifen Gebiete an, in denen wir sie bisher nicht vermutet hatten, und das Militärkommando in Batavia drängt auf Maßnahmen, die härter als alles sind, was bisher versucht wurde. In Den Haag nimmt indessen die Zahl jener ab, die in Kabinettssitzungen einst zur Geduld mahnten."
 INS_national_revolution_republic_win_ins_tt: "[INS.GetAdjective]-republikanische Milizen übernehmen §Gde facto die Kontrolle§! über die Region und der Konflikt endet mit dem §GSieg der Republikaner§!."
 INS_national_revolution_republic_win_hol_tt: "[INS.GetAdjective]-republikanische Milizen übernehmen §Rde facto die Kontrolle§! über die Region und der Konflikt endet mit dem §RSieg der Republikaner§!."
 INS_national_revolution_dutch_cat_map: "Von Milizen besetzte Staaten"
 INS_take_batavia: "Kontrolle über Java übernehmen"
 INS_take_batavia_desc: "Die Gier der Niederländer führte dazu, dass sie fast ausschließlich in Java investierten und die östlichen Inseln weitgehend ignorierten, wodurch Java zur Achillesferse der gesamten Kolonie wurde. Das wird ihr Untergang sein! Wir müssen mit unseren Truppen nach Java vorstoßen und die niederländischen Kommunikations- und Versorgungsnetze zerstören, damit die Verwaltung von Niederländisch-Indien nicht länger handlungsfähig ist."
 INS_hold_batavia_HOL: "Java halten"
 INS_hold_batavia_HOL_desc: "Die republikanischen Truppen haben damit begonnen, einen Großteil ihrer Streitkräfte nach Java zu verlegen, um die Kontrolle über die gesamte Insel zu übernehmen. Wir müssen ihnen weiterhin Widerstand leisten. Ihr Einsatz ist riskant und eröffnet uns eine Möglichkeit, ihre Bewegung ein für alle Mal zu vernichten."
 INS_militias_moestopo_mission: "Moestopo fordert Beförderung für seine Verdienste"
 INS_militias_pki_uprising_mission: "Kommunistischer Aufstand unvermeidlich"
 INS_pacific_revolution_cat: "Pazifikrevolution"
 INS_instigate_in_country: "Revolution in [FROM.GetName] entfachen"
 INS_instigate_in_country_desc: "Unsere Revolution endete nicht mit der Vertreibung des letzten Kolonialsoldaten von [ROOT.GetAdjective]em Boden. Die Arbeiter und Bauern von [FROM.GetName] leiden noch immer unter dem Joch, dass wir bereits abwarfen, und sehen uns nun als Vorbild dafür an, dass ihre Unterdrücker besiegbar sind. Wir müssen unsere revolutionären Führer entsenden, Flugblätter verteilen, ihre Gewerkschaften finanziell unterstützen und die Flamme der Unzufriedenheit schüren, um erneut eine Revolution auszurufen!"
 INS_launch_revolution: "Revolution ausrufen"
 INS_launch_revolution_desc: "In [FROM.GetName] herrschen optimale Bedingungen für eine Revolution. Unsere Spione berichten von wachsenden Unruhen in den Fabriken und auf den Feldern, und lokale Zellen sind zum Handeln bereit. Es ist an der Zeit, die Arbeiter und Bauern von [FROM.GetName] dazu aufzurufen, sich zu erheben und sich das zu nehmen, was rechtmäßig ihnen gehört!"
 INS_anti_colonialist_bonus: "Antikolonialistische Stimmung in [FROM.GetName] schüren"
 INS_anti_colonialist_bonus_desc: "Das Volk von [FROM.GetName] schuftet sich für einen fremden Herrn zu Tode und wird dazu gezwungen, Interessen zu dienen, die nicht seine eigenen sind. Wir werden es daran erinnern, dass Unterwerfung eine Entscheidung ist und dass seine Herren nicht so stark sind, wie sie vorgeben."
 INS_revolutionary_sentiment: "Mit [FROM.GetAdjective]en Revolutionären zusammenarbeiten"
 INS_revolutionary_sentiment_desc: "In [FROM.GetName] gibt es einige, die sich bereits aus eigener Initiative für die Sache einsetzen. Es mangelt ihnen zwar an Organisation und Ressourcen, aber nicht an Überzeugung. Indem wir mit diesen Gruppen zusammenarbeiten, beschleunigen wir den Zusammenbruch der bestehenden Ordnung. Die daraus resultierende Instabilität erschwert die Regierungsführung kurzfristig, doch das ist es wert."
 INS_arm_militias: "Lokale [FROM.GetAdjective]e Milizen bewaffnen"
 INS_arm_militias_desc: "Flugblätter und Reden bringen die Revolution nur bis zu einem gewissen Punkt voran. Wenn der Moment kommt, müssen unsere Genossen in [FROM.GetName] kampfbereit sein. Wir müssen Waffen und Vorräte zu sympathisierenden Milizen schmuggeln, damit die reaktionären Truppen einer bewaffneten Bevölkerung anstelle einer wehrlosen gegenüberstehen."
 INS_arm_militias_tt: "Wenn ein Bürgerkrieg ausbricht, beginnen die Kommunisten mit zusätzlichen Divisionen."
 INS_propoganda_mission: "Den Kommunismus in [FROM.GetName] verbreiten"
 INS_propoganda_mission_desc: "Wir müssen unsere Parteiorganisatoren nach [FROM.GetName] schicken, um Lesezirkel zu gründen, Mitglieder in den Gewerkschaften für unsere Sache anzuwerben und die Botschaft der Revolution in die Dörfer zu tragen. Die Samen, die wir heute säen, werden schon bald Früchte tragen."
 INS_abandon_mission: "Die Mission aufgeben"
