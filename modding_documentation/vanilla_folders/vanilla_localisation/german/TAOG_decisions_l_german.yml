 INS_atjeh_management: "Polizeieinsatz in Atjeh"
 INS_atjeh_management_2: "Atjeh integrieren"
 INS_soetardjo_petition: "Die Soetardjo-Petition wartet auf Genehmigung"
 INS_soetardjo_petition_desc: "Die von Soetardjo einberufene Rundtischkonferenz ergab, dass [INS.GetNameDef] eine Reihe wirtschaftlicher Voraussetzungen erfüllen muss, um sich selbst versorgen zu können. Sollten wir nicht deutliche Fortschritte bei der Erreichung dieser Ziele nachweisen, wird [HOL.GetNameDef] den Status quo aufrechterhalten. "
 INS_soetardjo_petition_refresh_tt: "Reaktiviert die Mission: §YDie Soetardjo-Petition wartet auf Genehmigung§! für eine Dauer von §Y120 Tagen§!."
 INS_soetardjo_pending: "Volksraad diskutiert über Soetardjo-Petition für mehr Autonomie"
 INS_soetardjo_pending_desc: "Soetardjo, ein Mitglied des Volksraads und Anführer der friedlichen nationalistischen Bewegung, legte dem Volksraad eine Petition vor, in der er fordert, dass [INS.GetName] mehr Autonomie erhält und eine Rundtischkonferenz zwischen niederländischen und indonesischen Vertretern einberufen wird, um den Wunsch der Indonesier nach Autonomie als Teil eines niederländischen Commonwealth zu erörtern. Diese Petition wird derzeit im Volksraad diskutiert. Im Anschluss müssen wir entscheiden, wie wir darauf reagieren, da die Folgen weitreichend sind."
 INS_flag_legalized: "Die rot-weiße Flagge darf gezeigt werden"
 INS_owned_states_at_game_start_tt: "Alle indonesischen Staaten"
 INS_win_condition_base_republic_warning: "Niederländisch-Indien auflösen"
 INS_win_condition_base_republic_warning_desc: "Wir müssen weiterkämpfen, Zivilisten für unsere Sache rekrutieren und ein Feuer in der indonesischen Seele entfachen. Sobald wir die Verwaltung von Niederländisch-Indien gestürzt haben, bleibt [HOL.GetNameDef] keine andere Wahl, als zu kapitulieren."
 INS_win_condition_base_republic_real: "Niederländisch-Indien auflösen"
 INS_win_condition_base_republic_real_desc: "Wir müssen weiterkämpfen, Zivilisten für unsere Sache rekrutieren und ein Feuer in der indonesischen Seele entfachen. Sobald wird die Verwaltung von Niederländisch-Indien gestürzt haben, bleibt [HOL.GetNameDef] keine andere Wahl, als zu kapitulieren."
 will_complete_when_conditions_met_tt: "Dies wird automatisch ausgewählt, sobald die Voraussetzungen erfüllt sind."
 INS_militias_cat: "Laskar Rakyat"
 INS_militias_basic_summon: "Zivilisten mobilisieren"
 INS_militias_basic_summon_desc: "Wir rekrutieren junge Erwachsene und Studenten, die sich leidenschaftlich für die Unabhängigkeit Indonesiens einsetzen, als bewaffnete Miliz für die TKR."
 INS_militias_kris_repayment: "KRIS-Miliz fordert Investitionen in Sulawesi"
 INS_militias_di_mission: "Darul Islam fordert Repräsentation"
 INS_militias_jakarta_pemuda_mission: "Die Jugend Jakartas fordert bessere Bildungsbedingungen"
 INS_militias_railway_pemuda_mission: "Der Eisenbahn-Jugendkorps will kämpfen"
 INS_revolution_planning_cat: "Untergrundrevolution"
 INS_revolution_planning_hq: "Revolutionäres HQ in [FROM.GetName] errichten"
 INS_revolution_planning_hq_desc: "Wir errichten unser Milizenhauptquartier in [FROM.GetName]. Es wird unseren Milizen als Kommandozentrale auf dem gesamten Archipel dienen. Unser Hauptquartier und das umliegende Territorium werden bei Infiltrationsmissionen Vorrang haben, damit sie fest unter unserer Kontrolle stehen."
 INS_revolution_planning_hq_tt: "Hat maximal §Y3§! revolutionäre Hauptquartiere errichtet"
 INS_revolution_planning_hq_DONE: "Revolutionäre Hauptquartiere"
 INS_revolution_planning_hq_DONE_desc: "Dies ist unser revolutionäres Hauptquartier, von dem aus wir die Milizen koordinieren. Sobald wir die Unabhängigkeit erklären, erhalten wir die Kontrolle über diesen Staat."
 INS_revolution_planning_hq_DONE_trigger_tt: "Kann nur ein HQ errichten"
 INS_revolution_planning_envoy_DONE_trigger_tt: "Kann nicht mehrere Basen im selben Staat errichten"
 INS_revolution_planning_envoy_DONE: "Milizenstützpunkt in [FROM.GetName]"
 INS_has_revolutionary_hq: "Hat ein revolutionäres HQ errichtet"
 INS_revolution_planning_influence_state: "Milizenstützpunkt in [FROM.GetName] errichten"
 INS_revolution_planning_influence_state_desc: "Wir entsenden Milizen nach [FROM.GetName], um dort einen Milizenstützpunkt zu errichten. Dies erlaubt es den Revolutionären vor Ort, mit dem HQ zu kommunizieren, und erleichtert ihre Einsätze, sobald wir die Unabhängigkeit erklärt haben."
 INS_revolution_planning_cat_map_name: "Auswählen, wo wir die Milizenaktivität verwalten wollen"
 INS_state_revolution_hq_tt: "Der Staat geht in unsere Kontrolle über, sobald wir die Unabhängigkeit erklären"
 INS_hq_warning: "§W§RUnser Hauptquartier hier zu errichten, ist schwierig und wird den Großteil unserer Ressourcen beanspruchen.§!§!"
 INS_revolution_points_remaining_tt: "Kann mindestens §Y1§! weiteren Milizenstützpunkt errichten (derzeit §Y[?INS_revolution_points_remaining]§! übrig)"
 INS_revolution_planning_influence_state_points_notif_tt: "Wir können Milizenstützpunkte in §Y[?INS_starting_revolution_points_count]§! weiteren Staaten §Raußerhalb von Java§! errichten."
 INS_revolution_planning_influence_state_points_notif_tt_1: "Wir können Milizenstützpunkt nur in §Y1§! weiteren Staat §Raußerhalb von Java§! errichten."
