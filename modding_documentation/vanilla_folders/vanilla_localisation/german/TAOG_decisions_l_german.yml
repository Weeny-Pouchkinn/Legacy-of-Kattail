 ast_support_for_comrades_idea: "Unterstützung für unsere Genossen"
 ast_support_for_comrades_idea_desc: "Wir unterstützen unsere Genossen."
 ast_support_for_comrades_idea_improved: "$ast_support_for_comrades_idea$"
 ast_support_for_comrades_idea_improved_desc: "$ast_support_for_comrades_idea$"
 idea_AST_civil_war_on_their_own: "Auf uns allein gestellt"
 idea_AST_civil_war_on_their_own_desc: "Wir sind in diesem Krieg auf uns allein gestellt."
 ast_foreign_communist_influence_idea: "Fremder Kommunisteneinfluss"
 ast_foreign_communist_influence_idea_desc: "Australische Kommunisten beeinflussen uns!"
 open_mae_moh_lignite_mine: "Ein Braunkohlebergwerk in Mae Moh eröffnen"
 SIA_release_contigency_funds: "Notfallfonds freigeben"
 SIA_release_contigency_funds_tt: "Modifiziert §Y$idea_SIA_contingency_funds$§! um:\n"
 SIA_release_contigency_funds_tt2: "für §Y[?var:SIA_contingency_funds]§! Monate. Am Ende werden die Mittel aufgebraucht sein. Je länger wir in Friedenszeiten Mittel ansammeln, desto länger reichen diese in Kriegszeiten."
 has_released_contingency_funds: "Hat Notfallfonds freigegeben"
 AST_election_approaching_cat: "Bevorstehende Wahlen"
 AST_election_approaching_cat_desc: "Kaum hat sich eine Regierung etabliert, stehen schon wieder die nächsten Wahlen an. Die demokratischen Parteien bemühen sich mit allen Mitteln darum, eine größere Wählerschaft für sich zu gewinnen und den Sieg zu erringen, sobald die Wahllokale öffnen und sich die Wahlurnen mit Stimmen füllen."
 AST_final_reforms_mission: "Abschließende Reformen"
 AST_final_reforms_mission_desc: "Dank ihrer stabilen Führung, ihrer konservativen Ausrichtung und ihrer Loyalität gegenüber Großbritannien konnte die UAP eine größere Wählerschaft für sich gewinnen und die Aussicht auf eine weitere Amtszeit deutlich verbessern. Damit das Volk auch weiter hinter der UAP steht, müssen die Reformen beschleunigt werden.\n\n§YAuswirkungen, wenn aktiv:§!\n§W(§YDemokratische§! Schwerpunkte):\nAbschlusszeit wird um §Y7§! Tage verringert§!"
 AST_final_reforms_effect_tt: "\nAuswirkungen, wenn §Y$AST_final_reforms_mission$§! aktiv ist (§Y180§! Tage):"
 AST_labor_campaign_tour_mission: "Wahlkampf bei der Arbeiterschaft"
 AST_labor_campaign_tour_mission_desc: "In ihrem Bestreben, alle Bürger zu vertreten, nimmt die ALP eine andere Sichtweise auf den Imperialismus und Australiens Loyalität gegenüber dem Empire ein. Australische Bedürfnisse müssen oberste Priorität haben und fremde Interessen sollten nicht länger Vorrang besitzen.\n\nUm sowohl die derzeitige Regierungspartei als auch die Wähler zu erreichen, wird die ALP einen landesweiten Wahlkampf beginnen.\n\n§YAuswirkungen, wenn aktiv:§!\n§WTägliche Stimmen für die §YALP§!: §G+0.05§!§!"
 AST_labor_campaign_tour_effect_tt: "\nAuswirkungen, wenn §Y$AST_labor_campaign_tour_mission$§! aktiv ist (§Y180§! Tage):\nTägliche Stimmen für die §YALP§!: §G+0.05§!\n\nAuswirkungen in §Y180§! Tagen:"
 AST_election_season_cat: "Wahlkampf"
 AST_election_season_cat_desc: "Kaum hat sich eine Regierung etabliert, bereitet sich schon die nächste darauf vor, ihren Platz einzunehmen. Zu diesem Zeitpunkt wird sich die Wählerschaft kaum noch beeinflussen lassen, doch das wird die Parteien nicht davon abhalten, es dennoch zu versuchen. Es ist erst vorbei, wenn es vorbei ist, und dieser Tag kommt erst mit der Wahlurne."
 AST_election_countdown: "Bevorstehende Wahl"
 AST_election_countdown_desc: "Es verbleiben nur noch wenige Tage, bis die Wahllokale öffnen.\n\n§W$AST_expected_election_winner_tt$§!"
 AST_government_formation_period: "Regierungsbildungsphase"
 AST_government_formation_period_desc: "Jede Partei möchte genug Macht haben, um ihre eigene Politik durchsetzen zu können, doch bestimmte Umstände erfordern gelegentlich, dass eine Nationale Einheitsregierung gebildet werden muss.\n\n§W§YAuswirkungen, wenn aktiv:§!\n£GFX_trigger_yes $AST_election_recently_concluded$\n\nDie $AST_ruling_party$ kann eine §YNationale Einheitsregierung§! bilden.\n\nDie §YNationale Einheitsregierung§! kann im Menü der demokratischen Wahlen gebildet werden, das im australischen Schwerpunktbaum zu finden ist.§!"
 AST_war_is_coming_cat: "Es droht Krieg"
 AST_war_is_coming_cat_desc: "Die Spannungen nehmen immer weiter zu, und sowohl australische Regierungsvertreter als auch die Bevölkerung beginnen zu begreifen, dass ein Krieg möglicherweise unvermeidbar ist, ganz gleich, wie sehr ihre Politik oder ihre Interessen das Gegenteil wünschen.\n\nWir müssen eine Kabinettssitzung einberufen, um über das Vorgehen im Fall einer Invasion zu sprechen. Doch bevor wir dies tun, könnte es sinnvoll sein, Maßnahmen zu ergreifen, denen das gesamte Kabinett möglicherweise nicht zustimmen würde."
 AST_seize_civilian_industry: "Zivilindustrie beschlagnahmen"
 AST_seize_civilian_industry_desc: "Konsumgüter sind zwar sowohl für unsere Bevölkerung als auch für die Wirtschaft unverzichtbar, doch es lässt sich nicht leugnen, dass sich die Prioritäten in Kriegszeiten verlagern. Ein Krieg steht bevor, und wir müssen vorbereitet sein, wenn er kommt."
 AST_scorch_the_north: "Verbrannte Erde im Norden"
 AST_scorch_the_north_desc: "Sollten wir eine Invasion aus dem Norden befürchten, gibt es Möglichkeiten, einen Vorstoß des Feindes zu verhindern, auch wenn dies einen hohen Preis haben wird. Eine Politik der verbrannten Erde würde die Entwicklung unserer nördlichen Staaten erheblich zurückwerfen, doch es könnte nötig sein, um die Angreifer in Schach zu halten."
 AST_scorch_the_north_tt: "§YAuswirkungen, wenn ein nördlicher Staat vom Meer aus angegriffen wird:§!"
 AST_the_brisbane_line: "Britische Linie"
 AST_the_brisbane_line_desc: "Die Verteidigungsfähigkeiten Australiens reichen möglicherweise nicht aus, um einen Angriff vollständig abzuwehren. Indem wir den Schwerpunkt auf die Verteidigung wichtiger Territorien legen und gar nicht erst versuchen, das ganze Land zu schützen, stellen wir sicher, dass die am stärksten entwickelten und am dichtesten besiedelten Teile von [AST.GetName] unter unserer Kontrolle bleiben.\n\nEine solche Politik wird zweifellos auf Widerstand bei denjenigen stoßen, die jegliche Form von Zugeständnissen ablehnen. Es liegt in der Verantwortung der Regierung, [AST.GetName] in eine vernünfige Richtung zu lenken."
 AST_summon_the_cabinet_mission: "Das Kabinett versammeln"
 AST_summon_the_cabinet_mission_desc: "Wir müssen Diplomaten, Beamte und Theoretiker nach Canberra einladen, um uns auf eine mögliche Invasion vorzubereiten."
 AST_summon_the_cabinet_tt1: "\nDieses Ereignis wird die amtierende Regierung destabilisieren und kann zu ihrem §YZusammenbruch§! führen."
 AST_australian_accusations_modifier: "Australische Anschuldigungen"
 AST_cabinet_trust_cat: "Kabinettsvertrauen"
 AST_cabinet_trust_increase_tt: "\n§GErhöht§! das §YKabinettsvertrauen§!\n"
 AST_cabinet_trust_decrease_tt: "\n§RVerringert§! das §YKabinettsvertrauen§!\n"
 AST_cabinet_trust_remove_tt: "§GEntfernt§! den Nationalgeist §YKabinettsvertrauen§!"
 AST_australian_comforts_fund: "£BoP_right_texticon  Australian Comforts Fund"
 AST_australian_comforts_fund_desc: "Die Regierung ehrt die Opfer des Flugzeugabsturzes von Canberra, indem sie in den „Australian Comforts Fund“ investiert, für den sich die hinterbliebene Ehefrau eines der Opfer mit großem Engagement einsetzt.\n\nDer Fonds soll den australischen Soldaten den Einsatz durch die Zusendung von Gegenständen erleichtern, die ihre Armeeverpflegung und ihre persönliche Ausrüstung ergänzen. Alles in allem kommt die Investition also auch den Kriegsbemühungen zugute."
 AST_eminent_successors: "£BoP_right_texticon  Unmittelbare Nachfolger"
 AST_eminent_successors_desc: "Einige der Opfer des Flugzeugunglücks von Canberra waren hoch angesehene Regierungsbeamte. Auch wenn es keine Möglichkeit gibt, ihr tragisches Schicksal rückgängig zu machen, könnte die Ernennung ihrer Nachfolger die Regierung stabilisieren und sowohl das Vertrauen der Öffentlichkeit als auch der Minister wiederherstellen."
 AST_critics_to_shame: "£BoP_right_texticon  Kritiker in die Schranken weisen"
 AST_critics_to_shame_desc: "Das Flugzeugunglück von Canberra erschütterte die gesamte Nation und ganz Australien trauert. In Zeiten wie diesen gibt es immer wieder Menschen, die versuchen, die Situation auszunutzen. Wir müssen die lautesten Kritiker als das entlarven, was ihre Kritik wirklich ist: ein Versuch, die öffentliche Ordnung zu stören."
 AST_approach_the_independents: "£BoP_left_texticon  Mit den Unabhängigen zusammenarbeiten"
 AST_approach_the_independents_desc: "Das Vertrauen in die Fähigkeiten der Regierung, Australien durch die jüngsten Unruhen zu führen, schwindet täglich weiter, was das Land destabilisiert. Vielleicht ließen sich die unabhängigen Abgeordneten davon überzeugen, dass ein Regierungswechsel im Interesse des Landes läge."
 AST_a_sound_voice: "£BoP_left_texticon  Eine klare Stimme"
 AST_a_sound_voice_desc: "In dieser Zeit politischer Unruhen scheint eine selbstbewusste Stimme das Vertrauen der australischen Bevölkerung für sich gewonnen zu haben. Könnte diese Stimme der nächste [AST.GetAdjective]e Regierungschef sein?"
 AST_challenge_government_narrative: "£BoP_left_texticon  Regierungsnarrativ infrage stellen"
 AST_challenge_government_narrative_desc: "Die von der Regierung veröffentlichten Details zum Flugzeugabsturz von Canberra sind kaum glaubwürdig, was unweigerlich zu Spekulationen führt, dass möglicherweise Informationen zurückgehalten werden. Wie konnte ein erfahrener Offizier der RAAF sein Flugzeug unter idealen Flugbedingungen zum Absturz bringen? Von der Regierung müssen Antworten kommen."
 AST_make_a_common_enemy: "Ein gemeinsamer Feind"
 AST_make_a_common_enemy_desc: "Seit dem Tod der beim Flugzeugunglück von Canberra ums Leben gekommenen Regierungsbeamten mehren sich die misstrauischen Stimmen. Nicht nur die ungewöhnlichen Umstände des Absturzes schüren den Verdacht einer ausländischen Beteiligung – immerhin eint nichts stärker als ein gemeinsamer Feind."
 AST_make_a_common_enemy_tt: "§RMögliche Auswirkungen des Ereignisses:§!"
 AST_ensure_cabinet_loyalty: "Loyalität des Kabinetts sichern"
 AST_ensure_cabinet_loyalty_desc: "Die Androhung eines Misstrauensvotums stellt keine Gefahr dar, solange die Mehrheit des Kabinetts für die amtierende Regierung stimmt. Wir müssen sicherstellen, dass das Kabinett auf unserer Seite steht."
 AST_castle_crumbling_mission: "Die Burg zerfällt"
 AST_castle_crumbling_mission_desc: "Infolge des tragischen Flugzeugabsturzes von Canberra richtet Australien seinen Blick auf seine politischen Führer. Besitzt die amtierende Regierung auch nach dem Verlust solch wichtiger Kabinettsmitglieder weiterhin das Vertrauen der Öffentlichkeit? Oder wäre ein Führungswechsel angebracht?"
