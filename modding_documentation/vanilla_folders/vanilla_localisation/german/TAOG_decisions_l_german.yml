 SIA_use_abandoned_french_tools: "Aufgegebene Werkzeuge der Franzosen nutzen"
 SIA_use_abandoned_french_tools_desc: "Die Franzosen ließen schweres Gerät in unseren besetzten Gebieten zurück. Wir sollten es für unsere eigenen Zwecke nutzen."
 SIA_fortress_saigon: "Festung Saigon"
 SIA_fortress_saigon_desc: "Der Norden unseres neuen Reichs wird von Hanoi geschützt werden. Dank der Berge im Norden und dem Roten Fluss davor befindet es sich in der perfekten Lage, um jeden Angreifer abzuwehren."
 SIA_fortress_hanoi: "Festung Hanoi"
 SIA_fortress_hanoi_desc: "Der Süden unseres Reichs wird von Saigon geschützt werden. Diese Festungsstadt wird Bangkok und den Golf von [ROOT.GetName] vor möglichen Invasoren bewahren."
