 AST_big_business_request_ongoing_flag: "Abkommen mit Großkonzernen §Yim Gange§!"
 AST_naval_expansion: "$NOR_alt_dem_naval_expansion$"
 AST_naval_expansion_desc: "Im Tausch dafür, dass die [ROOT.GetFascistParty] eine Politik verfolgt, die ihnen zugutekommt, erklärten sich führende Wirtschaftsvertreter bereit, in Industriereformen zu investieren, die mit den Zielen der Partei im Einklang stehen.\n\nDie Flotte muss ausgebaut werden, wenn [AST.GetNameDef] gegen einen Feind mit einer überlegenen Seemacht eine Chance haben soll. Für begrenzte Zeit müssen in den Werften alle Mann an Deck sein, damit mehr Schiffe vom Stapel laufen."
 AST_factory_conversions: "Fabrikumbauten"
 AST_factory_conversions_desc: "Dafür, dass die [ROOT.GetFascistParty] eine Politik verfolgt, die ihnen zugutekommt, erklärten sich führende Wirtschaftsvertreter bereit, in Industriereformen zu investieren, die mit den Zielen der Partei im Einklang stehen.\n\nDie Verteidigungsindustrie muss Vorrang erhalten und australische Fabriken müssen umgebaut werden, um die Partei zu unterstützen."
 AST_land_development: "Landentwicklung"
 AST_land_development_desc: "Dafür, dass die [ROOT.GetFascistParty] eine Politik verfolgt, die ihnen zugutekommt, erklärten sich führende Wirtschaftsvertreter bereit, in Industriereformen zu investieren, die mit den Zielen der Partei im Einklang stehen.\n\nEin zu großer Teil von [ROOT.GetName] ist unterentwickelt und besitzt nur eine spärliche Industrie. Indem wir die Infrastruktur dieser Regionen ausbauen, machen wir sie für potenzielle Bauvorhaben lukrativer."
 AST_electrical_grid_expansions: "Ausbau des Stromnetzes"
 AST_electrical_grid_expansions_desc: "Dafür, dass die [ROOT.GetFascistParty] eine Politik verfolgt, die ihnen zugutekommt, erklärten sich führende Wirtschaftsvertreter bereit, in Industriereformen zu investieren, die mit den Zielen der Partei im Einklang stehen.\n\nDurch den Ausbau unseres Stromnetzes fördern wir die heimische Energieerzeugung und machen uns unabhängiger von Importen."
 AST_factory_investments: "Fabrikinvestitionen"
 AST_factory_investments_desc: "Dafür, dass die [ROOT.GetFascistParty] eine Politik verfolgt, die ihnen zugutekommt, erklärten sich führende Wirtschaftsvertreter bereit, in Industriereformen zu investieren, die mit den Zielen der Partei im Einklang stehen.\n\nUm sicherzustellen, dass während eines potenziellen Krieges sowohl ausreichend Militär- als auch Zivilgüter vorhanden sind, müssen wir unsere industriellen Kapazitäten ausbauen."
 AST_develop_port_kemla_steel_medium_decision: "Zweiten Hochofen in Port Kembla errichten"
 AST_develop_port_kemla_steel_medium_decision_desc: "Port Kembla leistete uns mit seinem Hochofen bisher gute Dienste, doch die Nachfrage stieg derart stark, dass wir möglicherweise einen zweiten bauen sollten. Dies würde die Stahlproduktion der Region in etwa verdoppeln."
 AST_prospect_pilbara_iron_decision: "Pilbara für den Bergbau öffnen"
 AST_prospect_pilbara_iron_decision_desc: "Die Region Pilbara verfügt über die größten Eisenerzvorkommen der Welt. Es sind jedoch ernorme Investitionen vonnöten, um diesen extrem abgelegenen Teil des Landes zu erschließen ... Ebenso enorm wären jedoch auch die Gewinne."
 AST_scale_up_pilbara_mines_steel_decision: "Die Minen von Pilbara vergrößern"
 AST_scale_up_pilbara_mines_steel_decision_desc: "Da die Region Pilbara nun für den großflächigen Bergbau bereit ist, ist es an der Zeit, die Investitionen fließen zu lassen!"
 AST_pilbara_mining_tt: "§Y$STATE_870$§! für den weiteren Bergbau zu öffnen, schaltet wiederholbare Entscheidungen frei, um die Stahlproduktion unbegrenzt zu erhöhen."
 AST_scale_up_middleback_mines_steel_decision_1: "Die Iron-Knob-Mine ausbauen"
 AST_scale_up_middleback_mines_steel_decision_1_desc: "Die Mine in Iron Knob versorgt uns bereits seit einiger Zeit mit Eisenerz, und angesichts der wachsenden Nachfrage ist es an der Zeit, sie auszubauen."
 AST_scale_up_middleback_mines_steel_decision_2: "Die Iron-Monarch-Mine eröffnen"
 AST_scale_up_middleback_mines_steel_decision_2_desc: "Die Iron-Knob-Mine allein kann unseren Bedarf nicht decken. Glücklicherweise sind die Middleback Mountains reich an Eisenerz. Es ist an der Zeit, unsere bisher größte Mine dort zu eröffnen!"
 AST_scale_up_middleback_mines_steel_decision_3: "Die Iron-Prince-Mine eröffnen"
 AST_scale_up_middleback_mines_steel_decision_3_desc: "Der Bedarf an Metallen ist in Kriegszeiten so hoch wie nie zuvor, und die Middleback Mountains versorgen uns mit allem, was wir brauchen."
 AST_expand_iron_mining_tt: "Sowohl §Y$AST_exports_for_economic_recovery$§! als auch §Y$AST_within_reach$§! zu haben, öffnet die Region Pilbara in §Y$STATE_870$§! für den Bergbau, wodurch wir eine beinahe unerschöpfliche Quelle an §YStahl§! erhalten. Wir können dies nutzen, um unsere Industrie anzukurbeln."
 AST_develop_port_kemla_steel_tt: "Dies erlaubt es uns, die Entscheidung §YZweiten Hochofen in Port Kemla errichten§! auszuwählen, die unsere §YStahlproduktion§! erheblich steigert."
 AST_develop_middleback_tt: "Dies schaltet drei Entscheidungen zur Entwicklung unserer §YStahlproduktion§! in §Y$STATE_519$§! frei"
 AST_expand_planned_extraction_pilbara_tt: "§Y$AST_planned_extraction$§! zu haben, öffnet die Region Pilbara in §Y$STATE_870$§! für den Bergbau, wodurch wir eine beinahe unerschöpfliche Quelle an §YStahl§! erhalten. Wir können dies nutzen, um unsere Industrie anzukurbeln."
 AST_ireland_weapon_smuggling_cat: "Die Iren bewaffnen"
 AST_smuggle_arms_to_ireland: "Waffen nach Irland schmuggeln"
 AST_smuggle_arms_to_ireland_desc: "Wir müssen die Iren bewaffnen, damit sie gegen die Briten kämpfen können."
 AST_smuggle_arms_to_ireland_ongoing_flag: "Waffenschmuggel §Yim Gange§!"
 AST_smuggle_arms_to_northern_ireland: "Waffen nach Nordirland schmuggeln"
 AST_smuggle_arms_to_northern_ireland_desc: "Wenn es uns gelingt, Nordirland ausreichend mit Waffen zu versorgen und die Verbindungen zu Irland zu stärken, ist es vielleicht möglich, dass sich Irland vereinigt, bevor die Briten die Gelegenheit haben, einzugreifen."
 AST_northern_ireland_rises_up: "Aufstand in Nordirland"
 AST_specialize_on_jungle_combat: "Auf Dschungelkämpfe spezialisieren"
 AST_specialize_on_desert_combat: "Auf Wüstenkämpfe spezialisieren"
 AST_switch_combat_specialization: "Kampfspezialisierung wechseln"
 AST_special_forces_cat: "Spezialeinheiten ausbilden"
 AST_you_can_switch_sf: "Wir können die Spezialisierung wechseln."
 AST_training_camps_specialization: "Unsere Trainingslager sind bereit, unsere Truppen einer terrainspezifischen Ausbildung zu unterziehen, damit sie in den unterschiedlichsten Einsatzgebieten agieren können."
 # Formables
 AST_australasia_flag: "§YAustralasien§! wurde gegründet"
 AST_australia_formables_category: "Australasien"
 AST_australia_formables_category_desc: "Unsere Wurzeln werden uns stets an den fernen Süden und Australien binden, doch unsere Arme reichen weit, und andere können unsere Sicht auf das Weltgeschehen nicht mehr so leicht unter den Teppich kehren. Wir sind stark gewachsen und ein neuer Name für unsere Nation soll dies deutlich machen. Wir streifen den Kokon namens [AST.GetName] ab und breiten unsere Flügel aus, damit der Rest der Welt sie bewundern und anerkennen kann. Unsere Farben und Muster verleihen der neuen Nation des Südens ihren Namen: Australasien."
