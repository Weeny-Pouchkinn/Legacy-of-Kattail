 AST_deteriorating_prime_minister_nerves_desc: "[AST.GetLeader] ist dem Druck des unvermeidlich bevorstehenden Krieges nichts gewachsen. Wenn er sich nicht bald beruhigt, könnte er einen Nervenzusammenbruch erleiden."
 AST_australian_demands_cat: "Australische Forderungen"
 AST_aid_australian_military_construction: "Militärische Bauprojekte in Australien unterstützen"
 AST_aid_australian_military_construction_desc: "Großbritannien ist für einen Krieg nicht bereit. Indem wir Australien beim Bau von Militäranlagen unterstützen, mildern wir vielleicht seine Ungeduld."
 AST_japanese_war_mission: "Japanischer Krieg"
 AST_japanese_war_mission_desc: "Australien will seinem übermächtigen Feind, [JAP.GetName], nicht allein gegenübertreten. Man drängt uns, den ersten Schritt zu unternehmen und den drohenden Konflikt schnellstmöglich beizulegen."
