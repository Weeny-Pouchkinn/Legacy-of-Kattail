 SIA_war_fervor_cat: "Kriegseifer"
 SIA_war_fervor_cat_desc: "Die Streitlust des Volkes muss sorgfältig gesteuert werden. Bleibt sie unkontrolliert, richtet sich der Kriegseifer gegen das eigene Land, denn eine Regierung, die das Volk zum Kämpfen aufruft, ohne ihm eine Richtung zu geben, läuft Gefahr, sein nächstes Ziel zu werden."
 SIA_war_fervor_coup_dummy: "Kriegseifer kocht über"
 SIA_war_fervor_coup_dummy_desc: "Wenn die Kriegsbereitschaft der Menschen überkocht, ohne dass sie ein Ventil findet, wird sie unweigerlich gegen uns gerichtet werden."
 SIA_urge_restraint: "Zur Zurückhaltung aufrufen"
 SIA_war_fervor_coup: "Unmittelbarer Putsch"
 SIA_modify_cultural_mandates: "Modifiziert $idea_SIA_thai_cultural_mandates$ um:"
 SIA_mandate_1: "Erstes Mandat"
 SIA_mandate_1_desc: "Das Land, das Volk und die Nationalität sollen Thai heißen."
 SIA_mandate_1_tt: "§Y[THIS.GetNameDefCap]§! wird fortan §Y$SIA_thailand$§! genannt"
 SIA_mandate_2: "Zweites Mandat"
 SIA_mandate_2_desc: "Thailänder dürfen keine Geschäfte tätigen, ohne vorher den Nutzen und die Sicherheit der Nation zu berücksichtigen.\n\nThailänder dürfen Fremden niemals etwas preisgeben, was dem Ansehen des Landes schaden könnte. Solche Handlungen stellen einen Verrat an der Nation dar.\n\nThailänder dürfen nicht als Vertreter oder Sprecher für Fremde auftreten, ohne die Interessen der thailändischen Nation zu berücksichtigen. Außerdem dürfen sie in internationalen Streitigkeiten keine Meinung äußern oder Partei für Fremde ergreifen. Solche Handlungen stellen einen Verrat an der Nation dar.\n\nThailänder dürfen nicht heimlich Land im Namen von Fremden erwerben, wenn dies die Nation gefährdet. Solche Handlungen stellen einen Verrat an der Nation dar.\n\nWenn eine Person Verrat an der Nation begangen hat, liegt es in der Pflicht eines jeden Thailänders, dem schnell Einhalt zu gebieten."
 SIA_mandate_3: "Drittes Mandat"
 SIA_mandate_3_desc: "Es ist zu unterlassen, das thailändische Volk in einer Weise zu bezeichnen, die vom Namen der Nationalität abweicht oder den Vorlieben einzelner Gruppen entspricht.\n\nDer Name „Thailänder“ ist für das gesamte thailändische Volk zu nutzen, ohne es weiter zu unterteilen."
 SIA_mandate_4: "Viertes Mandat"
 SIA_mandate_4_desc: "Wenn die Nationalflagge gemäß den Vorschriften der Regierung gehisst oder eingeholt wird oder wenn der Klang des Saluts (durch Horn oder Pfeife) ertönt oder wenn das Zeichen zum Hissen oder Einholen der Flagge gegeben wird, ist der Flagge gemäß den Vorschriften die Ehre zu erweisen.\n\nWenn die Nationalhymne erklingt, sei es zu offiziellen Zwecken oder im Rahmen einer Zeremonie, ist der Hymne von allen Anwesenden gemäß den Vorschriften die Ehre zu erweisen.\n\nWird beobachtet, dass eine Person keinen angemessenen Respekt erweist, ist sie entsprechend zu ermahnen, damit sie die Bedeutung der Ehrung der Nationalflagge, der Nationalhymne und der Königshymne erkennt."
 SIA_mandate_5: "Fünftes Mandat"
 SIA_mandate_5_desc: "Jeder Thailänder soll sich darum bemühen, nur Lebensmittel aus thailändischer Herstellung zu konsumieren.\n\nJeder Thailänder soll sich darum bemühen, nur Kleidung aus thailändischer Produktion zu tragen.\n\nJeder Thailänder soll die landwirtschaftlichen, gewerblichen, industriellen und sonstigen beruflichen Bemühungen seiner Landsleute unterstützen.\n\nJeder Thailänder soll die öffentlichen Einrichtungen, die von der Regierung oder von Thailändern gegründet wurden, nutzen und unterstützen.\n\nJeder Thailänder, der in der Landwirtschaft, im Handel, in der Industrie oder einem anderen Beruf tätig ist, der durch dieses Mandat abgedeckt wird, muss sich darum bemühen, übliche Maßstäbe einzuhalten, die Qualität zu verbessern und sein Geschäft ehrlich zu führen."
 SIA_mandate_6: "Sechstes Mandat"
 SIA_mandate_6_desc: "Die Melodie der Nationalhymne stammt aus der Feder von Phra Chenduriyang und ist in den Archiven des Ministeriums für Bildende Künste hinterlegt.\n\nDer Text der Nationalhymne wird von der Armee eingereicht."
 SIA_mandate_7: "Siebtes Mandat"
 SIA_mandate_7_desc: "Jeder Thailänder muss zum Aufbau der Nation beitragen. Jeder körperlich gesunde Mensch muss einer festen Arbeit nachgehen. Wer keiner Arbeit nachgeht, hat für die Nation keinen Nutzen und verdient keinen Respekt seitens des thailändischen Volks."
 SIA_mandate_8: "Achtes Mandat"
 SIA_mandate_8_desc: "Der Text der Königshymne wird verkürzt und das Wort „Siam“ durch das Wort „Thai“ ersetzt."
 SIA_mandate_9: "Neuntes Mandat"
 SIA_mandate_9_desc: "Jeder Thailänder muss die thailändische Sprache preisen, ehren und respektieren und sich geehrt fühlen, sie zu sprechen.\n\nJeder Thailänder muss es als Pflicht eines guten Bürgers betrachten, die Landessprache zu erlernen und sie zumindest lesen und schreiben zu können. Jeder Thailänder muss es als seine Pflicht betrachten, jeden Bürger dabei zu unterstützen, die thailändische Sprache in Wort und Schrift zu erlernen.\n\nDer Geburtsort, der Wohnort oder der regionale Akzent dürfen nicht als Zeichen der Spaltung betrachtet werden. Jeder Thailänder muss davon überzeugt sein, dass alle, die als Thailänder geboren wurden, dasselbe thailändische Blut haben und dieselbe thailändische Sprache sprechen. Der Geburtsort oder der Akzent spielen keine Rolle.\n\nJeder Thailänder hat sich so zu verhalten, wie es von einem guten thailändischen Staatsbürger erwartet wird, und diejenigen, die ihre Pflichten als gute Bürger der thailändischen Nation noch nicht kennen oder verstehen, anzuleiten."
 SIA_mandate_10: "Zehntes Mandat"
 SIA_mandate_10_desc: "Ein Thailänder sollte bei öffentlichen Versammlungen, an öffentlichen Orten oder innerhalb der Stadtgrenzen niemals ohne angemessene Kleidung auftreten. Als unangemessene Kleidung gelten das Tragen von ausschließlich Unterwäsche, fehlende Oberbekleidung oder das Tragen eines Wickeltuchs.\n\nZur angemessenen Kleidung zählen Uniformen, sofern es die Position und der Anlass zulassen; anständige Kleidung im internationalen Stil; sowie anständige traditionelle Kleidung."
 SIA_mandate_11: "Elftes Mandat"
 SIA_mandate_11_desc: "Thailänder sollten ihre Zeit in drei Teile aufteilen: einen für die Arbeit, einen für persönliche Betätigungen und einen für Ruhe und Schlaf. Dies sollte ordentlich und nach einem Zeitplan erfolgen, bis es zur Gewohnheit wird.\n\nThailänder sollten ihre persönliche Zeit wie folgt nutzen: zu festgelegten Zeiten essen (nicht mehr als vier Mahlzeiten täglich), etwa sechs bis acht Stunden schlafen.\n\nThailänder sollten ihre Arbeitspflichten gewissenhaft erfüllen, ohne sich entmutigen zu lassen oder sich vor der Arbeit zu drücken. Die Mittagspause und das Mittagessen sollten nicht länger als eine Stunde dauern. Am Ende des Arbeitstages sollte sich ein Thailänder mindestens eine Stunde lang sportlich betätigen oder anderen Aktivitäten wie Gartenarbeit, der Pflege von Haustieren oder dem Pflanzen von Bäumen nachgehen. Nach dem Duschen sollte zu Abend gegessen werden.\n\nThailänder sollten ihre Freizeit am Abend nutzen, um notwendige Arbeiten zu erledigen, sich mit Familie und Freunden zu unterhalten, sich durch das Hören von Radionachrichten oder Lesen Wissen aneignen oder anderen Unterhaltungs- oder Kunstaktivitäten nachgehen, sofern es die Umstände erlauben."
 SIA_mandate_12: "Zwölftes Mandat"
 SIA_mandate_12_desc: "An öffentlichen Orten oder auf Straßen sollte Kindern, älteren Menschen oder Behinderten geholfen werden.\n\nWer Punkt 1 befolgt, gilt als kultivierte Person, die den Respekt des thailändischen Volkes verdient."
 SIA_movie_theater_cat: "$SIA_sala_chaloem_thai_movie_theater$"
 SIA_movie_theater_cat_desc: "Die Kinoleinwand gehört zu den mächtigsten Instrumenten des modernen Staates. Durch sorgfältig ausgewählte Filme und Propagandakampagnen beeinflusst die Regierung die öffentliche Meinung, schürt den Patriotismus und übertönt abweichende Stimmen."
