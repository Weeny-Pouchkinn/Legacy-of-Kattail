l_german:
 ##CZECHOSLOVAKIA##
 MUN_czech_skoda_priority.t: "Die Škoda-Werke"
 MUN_czech_skoda_priority.d: "Die Škoda-Werke produzieren eine große Auswahl verschiedener Produkte, angefangen von Artillerie über Panzer bis hin zu Zügen und Marinegeschützen. Dies macht sie äußerst flexibel, da Ressourcen dorthin verlagert werden können, wo die Nachfrage am höchsten ist - und wir können die Richtung nun teilweise steuern."
 MUN_czech_skoda_priority.1.a: "Interessant."
 MUN_czech.2.t.1: "Paramilitärs aus dem Sudetenland bitten um Hilfe"
 MUN_czech.2.t.2: "Das Freikorps aus dem Sudetenland bittet um Hilfe"
 MUN_czech.2.t.3: "Sudetische Arbeitermilizen bitten um Hilfe"
 MUN_czech.2.d.1: "Nachdem sich die Nachricht über unsere Pläne für [CZE.getname] verbreitet hatte, begannen viele Parteien des Sudetenlands rasch, Milizen aufzustellen, um die [CZE.GetAdjective]e Regierung zu untergraben. Sie bitten nun um unsere Unterstützung bei der Durchführung grenzüberschreitender Angriffe und Sabotageeinsätze, die ihrer Aussage nach unsere eigenen Bemühungen gegen [CZE.getname] vorantreiben werden."
 MUN_czech.2.d.2: "Nachdem sich die Nachricht über unsere Pläne für [CZE.getname] verbreitet hatte, begannen viele Parteien des Sudetenlands rasch damit, ihre Miliz zu mobilisieren: das sogenannte \"Sudenteutsche Freikorps\". Mehrere Freikorpszweige haben Einheiten im ganzen Sudetenland aufgestellt und dort [CZE.GetAdjective]es Regierungseigentum angegriffen. Sie bitten nun um unsere volle Unterstützung bei der Durchführung grenzüberschreitender Angriffe und Sabotageeinsätze gegen [CZE.getname]."
 MUN_czech.2.d.3: "Nachdem sich die Nachricht über unsere Pläne für [CZE.getname] verbreitet hatte, begannen die lokalen kommunistischen Parteien rasch damit, Arbeitermilizen aufzustellen und [CZE.GetAdjective]es Regierungseigentum im Sudetenland anzugreifen. Sie bitten nun um unsere volle Unterstützung bei der Durchführung grenzüberschreitender Angriffe und Sabotageeinsätze gegen [CZE.getname] und andere Gegenrevolutionäre."
 MUN_czech.2.a: "Natürlich helfen wir."
 MUN_czech.2.b: "Es wäre vielleicht besser, sie nicht weiter zu befähigen."
 MUN_czech.3.t: "Partisanenaktivität im Sudetenland"
 MUN_czech.3.d: "Nachdem sich die Nachricht verbreitet hatte, dass [FROM.GetNameDef] ein Interesse an der Annektierung des Sudetenlands bekundet hat, begannen Milizen, unsere Truppen in Partisanenkämpfe zu verwickeln. Sie besetzen Regierungsgebäude und haben sogar bereits einige Verteidigungsanlagen sabotiert. Wenn wir die Kontrolle über dieses Gebiet behalten wollen, sind wir gezwungen, gegen diese paramilitärischen Gruppen vorzugehen."
 MUN_czech.3.a: "Noch schlimmer wird das sicher nicht werden."
 MUN_czech.4.t: "Vertrauenskrise"
 MUN_czech.4.d: "Die jüngsten Nachrichten einer militärischen Aggression gegen uns haben die Regierung in ihren Grundfesten erschüttert. Dies geht sogar so weit, dass [CZE.GetLeader] jegliches Vertrauen in die Fähigkeit seiner Regierung, das Land durch diese Krise zu führen, verloren hat. Er hat gefordert, dass $CZE_jan_syrovy$ das Kommando übernimmt und das Land anführt. $CZE_jan_syrovy$ hat erklärt, er werde die Führung nur widerstrebend übernehmen, habe aber angesichts der Bitte von [CZE.GetLeader] keine andere Wahl, als uns durch diese Krise zu lenken."
 MUN_czech.4.a: "Wir brauchen diesen Menschen mehr denn je."
 MUN_czech.4.b: "Wir sollten nichts überstürzen."
 MUN_czech.5.t: "Tomáš Masaryk ist tot"
 MUN_czech.5.d: "Masaryk verlieh der tschechoslowakischen Politik über zwei Jahrzehnte hinweg Stabilität. In einer Zeit, in der Koalitionen unmöglich und politische Pattsituationen als unüberwindbar galten, gelang es Masaryk immer wieder, politische Wunder zu vollbringen, die die Tschechoslowakei stärkten und zu dem zu machten, was sie heute ist. Sein Fehlen wird im gesamten Land spürbar sein."
 MUN_czech.5.a: "Ein politischer Riese, der durch niemanden ersetzt werden kann."
 MUN_czech.7.t: "Loyalität gegenüber [CZE.getname] überdenken"
 MUN_czech.7.d: "Uns erreichte kürzlich die Nachricht, dass [GER.getnamedef] den Wunsch hegt, das Sudetenland zu annektieren und sogar bereit wäre, mit [CZE.getname] in den Krieg zu ziehen, um dieses Ziel zu erreichen. Wir haben derzeit ein Verteidigungsabkommen mit der [CZE.GetAdjective]en Regierung, was bedeuten würde, dass wir ihr im Fall eines Krieges gegen [GER.getname] zu Hilfe kommen müssten. Wenn wir dieses Ergebnis vermeiden wollen, müssen wir unser Abkommen unverzüglich auflösen."
 MUN_czech.7.a: "Wir stehen an der Seite unserer Freunde."
 MUN_czech.7.b: "Wir haben keine Chance gegen [GER.getname]."
 MUN_czech.1001.t: "[FROM.GetNameDefCap] fordert einen Korridor nach [SOV.GetName]"
 MUN_czech.1001.d: "In der Hoffnung, Militäreinsätze mit [SOV.GetAdjective]en Regimen koordinieren zu können, hat [FROM.GetNameDef] gefordert, dass wir die Grenzregionen [89.GetName] und [91.GetName] abtreten."
 MUN_czech.1002.t: "[FROM.GetNameDefCap] fordert Kontrolle über die jugoslawische Liga"
 MUN_czech.1002.d: "Nach der südlichen Expansion kommt [FROM.GetName] mit einer ungewöhnlichen Bitte zu uns. Man fordert nicht mehr die Aneignung von Land, sondern die Kontrolle über die Jugoslawische Verteidigungsliga. Damit wäre diese Nation Beschützerin und Herrin der Länder des Nordbalkans, die derzeit unsere Untertanen sind. Sie behauptet, eine fähigere Beschützerin sein zu können als wir, doch das könnte natürlich auch nur ein Vorwand sein."
 MUN_czech.1002.a: "Vielleicht haben sie ja recht."
 MUN_czech.1002.b: "Nein, diese Länder stehen unter unserem Schutz!"
 MUN_czech.1003.t: "[FROM.GetNameDefCap] weist Forderungen zurück"
 MUN_czech.1003.d: "Trotzt der überzeugenden Argumente unserer Diplomaten hat sich [FROM.GetNameDef] geweigert, unseren Forderungen nachzukommen."
 MUN_czech.1003.a: "Sie lassen uns keine andere Wahl."
 MUN_czech.1004.t: "[FROM.GetNameDefCap] stellt sich gegen Ungarn"
 MUN_czech.1004.d: "[ROOT.Capital.GetCapitalVictoryPointName] erreicht die Kunde vom Vormarsch [FROM.GetAdjective]er Truppen in Richtung der [HUN.GetAdjective]en Grenze. Obwohl sich [HUN.GetNameDef] zweifelsohne bald bei uns melden wird, sollten wir uns bereits jetzt überlegen, ob wir dieser Nation helfen und potenzielle Verbündete gewinnen wollen oder ob wir es [FROM.GetName] gestatten sollten, den jetzigen Plan weiter zu verfolgen."
 MUN_czech.1004.a: "Wir sollten unsere Interessen schützen."
 MUN_czech.1004.b: "Halten wir uns aus der Sache heraus."
 MUN_czech.1005.t: "[FROM.GetNameDefCap] fordert Küstenterritorien"
 MUN_czech.1005.d: "[FROM.GetNameDefCap] erweitert stetig seine Grenzen, und Gesandte dieser Nation fordern nun, dass wir Land an [FROM.GetAdjective]e Adlige abtreten, das ihnen einst gehörte. Angeblich dient dies dazu, einen potenziellen Zugang zur Adria zu gewähren, und scheinbar ist unsere Meinung zu diesem Thema nicht sonderlich relevant."
 MUN_czech.1006.t: "[FROM.GetNameDefCap] schlägt Partnerschaft vor"
 MUN_czech.1006.d: "[FROM.GetNameDefCap] tritt mit dem Vorschlag eines beiderseitigen Verteidigungspakts an uns heran, der potenzielle Angreifer durch die vereinte Macht unserer Armeen abschrecken soll. Interessanterweise weist dieser Vertrag allerdings einen geheimen Teil auf, der den möglichen Ausbau des [ROOT.GetAdjective]en Einflusses beschreibt und wie [FROM.GetNameDef] dabei helfen könnte."
 MUN_czech.1007.t: "[FROM.GetNameDefCap] fordert Angleichung"
 MUN_czech.1007.d: "Das Misstrauen zwischen uns und [FROM.GetName] seit der Gründung dieses Staates führt nun dazu, dass man unter Androhung einer Invasion unsere Angleichung fordert. Interessanterweise spricht [FROM.GetNameDef] auch unsere territorialen Ambitionen an und sichert zu, uns beim Erlangen der anderen Länder zu helfen, auf die wir Anspruch erheben, solange wir dafür unsere Ansprüche auf die [FROM.GetAdjective]en Gebiete aufgeben."
 MUN_czech.1007.b: "Wir müssen unsere Souveränität wahren!"
 MUN_czech.1008.t: "[FROM.GetNameDefCap] schlägt Bündnis mit [CZE_invited_country.GetName] vor"
 MUN_czech.1008.d: "[FROM.GetAdjective]e Würdenträger, unsere Brücke nach Zentraleuropa, haben vorgeschlagen, unser Bündnis durch die Einladung von [CZE_invited_country.GetName] zu vergrößern."
 MUN_czech.1008.a: "Eine weitere Abschreckung gegen Angriffe auf uns."
 MUN_czech.1008.b: "Man kann von uns nicht erwarten, ganz Europa zu verteidigen."
 MUN_czech.1009.t: "[FROM.GetNameDefCap] lädt uns in das Bündnis \"[CZE.GetFactionName]\" ein"
 MUN_czech.1009.d: "Diplomaten aus [FROM.GetNameDef] teilen uns mit, dass wir in ihrer Allianz willkommen wären. Allerdings waren in der Vergangenheit unsere territorialen Ansprüche ein Punkt, der unsere Beziehungen zu [FROM.GetName] belastete. Wir müssen nun entscheiden, ob wir weiter auf diesen Ansprüchen beharren oder uns darauf konzentrieren, freundlichere Beziehungen zu etablieren."
 MUN_czech.1009.a: "Auf unseren neuen Verbündeten!"
 MUN_czech.1009.b: "Wir werden beitreten, sobald unsere Ansprüche anerkannt wurden."
 MUN_czech.1009.c: "Wir sind nicht interessiert."
 MUN_czech.1010.t: "[FROM.GetNameDefCap] lädt uns ein, das Bündnis \"[CZE.GetFactionName]\" anzuführen"
 MUN_czech.1010.d: "Nach den kürzlichen Versuchen, die Vereinbarungen der Kleinen Entente in ein echtes Bündnis umzuwandeln, unterbreitete [FROM.GetNameDef] einen Vorschlag: Man will, dass wir dieses neue Bündnis anführen. Man würde die eigene Führungsrolle abgeben und im Gegenzug einen wertvollen Beschützer in uns gewinnen. Diese Abmachung würde unseren Einflussbereich erheblich erweitern, wenn auch möglicherweise bei Nationen, die sich einer Bedrohung ausgesetzt sehen."
 MUN_czech.1010.a: "Sie wären wertvolle Verbündete."
 MUN_czech.1010.b: "Es reicht aus, [ROOT.GetName] zu beschützen."
 MUN_czech.1011.t: "[FROM.GetNameDefCap] schlägt Schutzvereinbarung vor"
 MUN_czech.1011.d: "Im Zuge ihrer Bestrebungen, Aggressionen gegen [FROM.GetName] zu verhindern, wenden die Diplomaten des Landes sich mit dem Entwurf eines beiderseitigen Verteidigungsbündnisses an uns. Für unsere Unterstützung bieten sie uns ebenfalls Schutz, was jeden Aggressor in einen Zwei-Fronten-Krieg zwingen würde."
 MUN_czech.1011.a: "Das ist das Risiko wert."
 MUN_czech.1011.b: "Neutralität ist sicherer."
 MUN_czech.1012.t: "[FROM.GetNameDefCap] fordert unsere Unterwerfung"
 MUN_czech.1012.d: "Ermutigt durch ihre neu gegründete Allianz unterbreitet [FROM.GetNameDef] uns eine Reihe von Forderungen, die den Verlust unserer Souveränität bedeuten würden. Da [SOV.GetName] Interessen in der Region hat, könnten wir auf Unterstützung von dieser Seite zählen. Wir müssen uns nun entscheiden, ob wir es uns leisten können, die Forderung abzulehnen."
 MUN_czech.1012.a: "Ein Widerstand würde [ROOT.GetAdjective]e Leben vergeuden."
 MUN_czech.1012.b: "Tod vor Schande!"
 MUN_czech.1013.t: "[FROM.GetNameDefCap] schlägt bedingtes Bündnis vor"
 MUN_czech.1013.d: "Nach reiflicher Überlegung hat die [FROM.GetAdjective]e Regierung kundgetan, dass sie die Ansicht teile, dass ein Bündnis vorteilhaft wäre. Sie gab jedoch auch zu verstehen, dass territoriale Ansprüche nicht außer Acht gelassen werden können, weshalb ein neuer Vorschlag unterbreitet wurde: Sie wird sich unserem Bündnis anschließen, sofern wir die von ihnen beanspruchten Territorien abtreten."
 MUN_czech.1013.a: "Ein Opfer, das es wert ist, gebracht zu werden."
 MUN_czech.1013.b: "Wir versuchen damit doch, unsere Territorien zu schützen!"
 MUN_czech.1014.t: "[FROM.GetNameDefCap] bittet um Schutz"
 MUN_czech.1014.d: "Einflussreiche Diplomaten aus [FROM.GetName] wandten sich an den Außenminister mit der Bitte, die vagen Schutzversprechungen zu konkretisieren, die im sojwetisch-tschechoslowakischen Beistandsvertrag beschrieben stehen."
 MUN_czech.1014.a: "Vielleicht sollten wir versuchen, unseren Verbündeten zu beschützen."
 MUN_czech.1014.b: "Belassen wir es bei vagen Versprechungen."
 MUN_czech.1015.t: "[FROM.GetNameDefCap] schlägt Bündniszusammenlegung vor"
 MUN_czech.1015.d: "Da wir dieselben Feinde haben, schlägt [FROM.GetName] uns vor, unsere Zusammenarbeit zu vertiefen, indem wir unser Bündnis in das [FROM.GetAdjective]e integrieren."
 MUN_czech.1015.a: "Ein koordiniertes Vorgehen könnte Leben retten."
 MUN_czech.1015.b: "Wir müssen uns die Kontrolle bewahren."
 MUN_czech.1016.t: "[FROM.GetNameDefCap] schlägt Nichtangriffspakt vor"
 MUN_czech.1016.d: "Basierend auf bisherigen Gesprächen, die man nach einer Änderung der außenpolitischen Pläne abbrach, schlägt [FROM.GetNameDef] vor, weiter über einen Nichtangriffspakt zu verhandeln."
 MUN_czech.1016.a: "Eine Grenze weniger, die wir beschützen müssen."
 MUN_czech.1016.b: "Das würde unseren Ambitionen nur im Weg stehen."
 MUN_czech.1017.t: "Eine gemeinsame Invasion von [GER.GetName]?"
 MUN_czech.1017.d: "[FROM.GetNameDefCap] legte der [ROOT.GetAdjective]en Führungsriege Geheimpläne für eine Invasion von [GER.GetName] vor. Nachdem man unter Beweis stellte, wie sehr man dem Kampf gegen die [GER.GetAdjective]e Bedrohung verschrieben ist, bat man uns, dabei zu helfen, die mächtige [GER.GetAdjective]e Armee gemeinsam zu bezwingen."
 MUN_czech.1017.a: "Wir werden [GER.GetName] gemeinsam mit ihnen angreifen."
 MUN_czech.1017.b: "Das ist deutlich zu gefährlich."
 MUN_czech.1018.t: "Allein gegen [GER.GetName] kämpfen?"
 MUN_czech.1018.t.2: "Eine gemeinsame Invasion von [GER.GetName]"
 MUN_czech.1018.d: "Trotz all unserer diplomatischen Bemühungen konnten wir uns keine Unterstützung für eine präventive Invasion von [GER.GetName] sichern. Die Frage ist nun, ob wir unsere Angriffspläne überhaupt weiterverfolgen sollen."
 MUN_czech.1018.d.FRA_POL: "Unsere Diplomaten sind mit der großartigen Neuigkeit zurückgekehrt, dass uns sowohl [FRA.GetNameDef] als auch [POL.GetNameDef] bei der Invasion von [GER.GetName] unterstützen werden."
 MUN_czech.1018.d.FRA: "Unsere Diplomaten sind mit der großartigen Neuigkeit aus [FRA.GetName] zurückgekehrt, dass man uns bei der gemeinsamen Invasion von [GER.GetName] zur Seite stehen wird. Wir müssen nur abwägen, ob unsere gebündelte Kraft ausreicht."
 MUN_czech.1018.d.POL: "Unsere Diplomaten sind mit der großartigen Neuigkeit aus [POL.GetName] zurückgekehrt, dass man uns bei der gemeinsamen Invasion von [GER.GetName] zur Seite stehen wird. Wir müssen nur abwägen, ob unsere gebündelte Kraft ausreicht."
 MUN_czech.1018.a: "Sie werden uns nicht kommen sehen!"
 MUN_czech.1018.b: "Rückblickend betrachtet ist das viel zu riskant."
 MUN_czech.1019.t: "[FROM.GetNameDefCap] fordert [762.GetName]"
 MUN_czech.1019.d: "Da man wünscht, die bisherigen böhmischen Grenzen wiederherzustellen und die Kontrolle über [72.GetName] zu legitimieren, stellen [FROM.GetAdjective]e Gesandte uns ein Ultimatum, [762.GetName] abzutreten."
 MUN_czech.1019.a: "Vielleicht sind wir dann ja in Sicherheit."
 MUN_czech.1020.t: "[FROM.GetNameDefCap] bietet bedingte Investitionen an"
 MUN_czech.1020.a: "Ein hervorragender Handel!"
 MUN_czech.1020.b: "Diese Bedingungen sind inakzeptabel."
 MUN_czech.1020.d: "[FROM.GetAdjective]e Diplomaten sind eingetroffen, um uns den Vorschlag zu unterbreiten, dass ihr Land in unsere Industrie und Infrastruktur investiert. Im Gegenzug möchten sie ein Rohstoffabkommen aushandeln. Dieser Schritt, der nach all den gescheiterten Investitionen der letzten Jahre kommt, deutet darauf hin, dass man erneut versucht, die Beziehungen zwischen unseren Ländern zu verbessern."
 CZE_investment_effects_tt: "In §Y100 Tagen§! erhalten wir Folgendes:\n§YInfrastruktur§! in §Y3§! zufälligen Staaten.\n§YEine Zivilfabrik§! in §Y1§! zufälligen Staat.\n"
 MUN_czech.1021.t: "Rückkehr zur deutsch-österreichischen Zollunion?"
 MUN_czech.1021.d: "[CZE.GetNameDefCap] ist mit einem Entwurf an uns herangetreten, der ein Handelsabkommen zwischen den ehemaligen österreichisch-ungarischen Nationen vorsieht. Obwohl sie mit der eigenen Unabhängigkeit zufrieden ist, scheint die neue [CZE.GetAdjective]e Regierung besonders daran interessiert zu sein, die positiven Elemente der österreichisch-ungarischen Nation wiederherzustellen."
 MUN_czech.1021.a: "Eine Ausweitung des Handels klingt vielversprechend."
 MUN_czech.1021.b: "Wir müssen unsere inländischen Produzenten schützen."
 MUN_czech.1022.t: "[CZE.GetNameDefCap] besetzt Schlesien"
 MUN_czech.1022.d: "Nach erbitterten Gefechten in der Bergregion von [69.GetName] konnten [CZE.GetAdjective]e Truppen einen Durchbruch erzielen und die Kontrolle über ganz Schlesien erringen, noch ehe die Streitkräfte, die sie bezwungen hatten, sich ausreichend erholen konnten, um ernsthaft Widerstand zu leisten."
 MUN_czech.1022.a: "Wir müssen eingreifen."
 MUN_czech.1022.b: "Wir können uns keinen weiteren Feind leisten."
 MUN_czech.1022.c: "Ein glorreicher Sieg!"
 MUN_czech.1023.t: "[CZE.GetNameDefCap] beginnt den Kampf um Schlesien"
 MUN_czech.1023.d: "Unter Berufung auf eine seltsame Argumentation unter Zuhilfenahme mittelalterlicher König- und Kaiserreiche hat [FROM.GetNameDef] die Grenzkämpfe zu einem begrenzten Krieg eskalieren lassen, um die Kontrolle über das [ROOT.GetAdjective]e Schlesien zu übernehmen."
 MUN_czech.1023.a: "Macht die Truppen bereit."
 MUN_czech.1024.t: "[CZE.GetNameDefCap] schlägt Frieden vor"
 MUN_czech.1024.d: "Nachdem die Grenzscharmützel in Schlesien zu einem ausgewachsenen Krieg ausgeufert sind, deutet [FROM.GetNameDef] nun Bereitschaft an, den Konflikt zu beenden, sofern wir das eingeforderte Land abtreten."
 MUN_czech.1024.a: "Vielleicht sollten wir uns auf andere Bereiche konzentrieren."
 MUN_czech.1024.b: "Die Lage ist nach wie vor günstig für uns."
 MUN_czech.1024.c: "Das steht nicht zur Debatte!"
 MUN_czech.1025.t: "Ende der spanischen Freiwilligenmission"
 MUN_czech.1025.d.1: "Die [ROOT.GetAdjective]en Truppen, die wir nach [CZE_supported_spanish_faction.GetName] schickten, sind nach dem Sieg zurückgekehrt. Die Kämpfe brachten unseren Truppen wertvolle Erfahrung, besonders den Sanitätseinheiten."
 MUN_czech.1025.d.2: "Die [ROOT.GetAdjective]en Truppen haben tapfer im spanischen Bürgerkrieg gekämpft, doch letzten Endes wurde jene Seite, die wir unterstützten, besiegt. Ungeachtet dessen gewannen unsere Truppen und besonders die Sanitätseinheiten wertvolle Erfahrung."
 MUN_czech.1025.a: "Hoffen wir, dass wir diese Erfahrung niemals in der Heimat nutzen müssen."
 MUN_czech.1026.t: "[FROM.GetNameDefCap] lehnt Vorschlag ab"
 MUN_czech.1026.a: "Sie schaden sich damit nur selbst!"
 MUN_czech.1026.b: "Eine besorgniserregende Entwicklung."
 MUN_czech.1026.france_refuses_to_lead: "Obwohl wir [FROM.GetName] anboten, eine Führungsposition in unserem Bündnis zu übernehmen, entschloss man sich dazu, diese abzulehnen. Offenbar möchte [FROM.GetNameDef] neutral bleiben - oder aber man spielt auf Zeit."
 MUN_czech.1026.sphere_of_influence: "Die [FROM.GetAdjective]e Regierung sicherte uns zwar zu, dass man unsere Teilnahme an ihrem Bündnis „[ROOT.GetFactionName]“ schätzt, doch eine Ausweitung unseres Einflusses auf den Balkan ginge zu weit und könne potenzielle Verbündete abschrecken."
 MUN_czech.1026.guarantee: "Unsere Diplomaten berichten, dass trotz all ihrer Anmstrengungen, [FROM.GetName] von einem Verteidigungsabkommen zu überzeugen, selbiges abgelehnt wurde. Offenbar glaubt man dort, dass wir eher vor einem Angriff stehen als sie. Hoffen wir, dass sie falsch liegen."
 MUN_czech.1026.faction_merge: "Trotz all unserer Bemühungen konnten sich unsere und die [FROM.GetAdjective]en Diplomaten nicht auf ein Abkommen einigen, um unser Bündnis ([ROOT.GetFactionName]) mit ihrem ([FROM.GetFactionName]) zu vereinen."
 MUN_czech.1026.non_aggression: "Obwohl man uns zusichert, friedliche Absichten zu hegen, lehnten die [FROM.GetAdjective]en Diplomaten es ab, einen Nichtangriffspakt mit unserem Land zu unterschreiben. Der genaur Grund bleibt abzuwarten."
 MUN_czech.1026.trade_deal: "Da man wirtschaftlich unabhängig bleiben möchte, hat [FROM.GetNameDef] abgelehnt, ein Handelsabkommen zu schließen."
 MUN_czech.1026.faction_invite: "Obwohl unsere Diplomaten alle Argumente offenlegten, warum [FROM.GetNameDef] von einem Bündnis mit uns profitieren würde, gelang es ihnen letztlich nicht, die Gegenseite von unserer Politik zu überzeugen."
 MUN_czech.1026.weapons_sale: "Ungeachtet unseres großzügigen Angebots hat [FROM.GetNameDef] sich entschlossen, derzeit keine Waffen von uns zu kaufen."
 MUN_czech.1026.unification: "Obwohl man die Vorteile einer Föderation durchaus anerkennt, hat [FROM.GetNameDef] sich entschlossen, die Regierung im Exil als einzig legitime Regierung der eigenen Lande beizubehalten."
 MUN_czech.1026.white_peace: "Unsere Abgesandten kehrten heute mit der traurigen Nachricht zurück, dass die [FROM.GetAdjective]e Führung trotz unserer Besetzung von [66.GetName] nicht bereit ist, einen Frieden auszuhandeln. Wir müssen den Feldzug also entweder fortsetzen und weitere Gebiete erobern oder aber darauf warten, dass man des Krieges überdrüssig wird."
 MUN_czech.1027.t: "[FROM.GetAdjective]-[ROOT.GetAdjective]es Handelsabkommen aushandeln?"
 MUN_czech.1027.d: "Trotz anfänglicher ideologischer Differenzen appelliert [FROM.GetNameDef] an unseren Pragmatismus: Die Nation schlägt uns ein Handelsabkommen vor. Als Gegenleistung dafür, dass [FROM.GetName] Ressourcen in [202.GetName] gewinnen darf, stellt man uns die Maschinenwerkzeuge zur Verfügung, die wir so dringend für den Ausbau unserer Industriekapazität benötigen."
 MUN_czech.1027.a: "Ein verdammt gutes Geschäft."
 MUN_czech.1027.b: "Wir sollten ihnen diese Ressourcen verwehren."
 MUN_czech.1028.t: "Verzögerte Befestigungsbemühungen"
 MUN_czech.1028.d: "Viele fragen sich, warum die Regierung die Ende letzten Jahres begonnenen Befestigungsprojekte nicht fortgeführt hat. Die Regierung hatte über den Befestigungsrat Mittel für zusätzliche Festungsbauprojekte bereitgestellt. Da keinerlei Fortschritte zu verzeichnen sind, fordert das Volk nun, dass das Projekt entweder fortgesetzt wird oder die Mittel zurückgezahlt werden. Sollten wir am Befestigungsprogramm festhalten wollen, dürfen wir keine Zeit verlieren. Wir müssen das Projekt schnellstens wieder aufnehmen, damit die Befestigungen rechtzeitig fertiggestellt werden können."
 MUN_czech.1028.a: "Wir haben keine Zeit zu verlieren!"
 CZE_no_time_to_lose_tt: "Unser Zeitfester, unsere Befestigungsprojekte vor dem Einmarsch eines Feindes zu vollenden, ist jetzt sehr klein geworden"
 MUN_czech.1029.t: "Befestigungsprojekt abgeschlossen"
 MUN_czech.1029.d: "Unser Befestigungsprojekt ist endlich abgeschlossen, und wir haben noch genügend Ressourcen übrig, um ein weiteres Projekt zu beginnen. Unsere Ingenieure stehen bereit und können jederzeit mit den Vorarbeiten für eine neue Befestigungslinie beginnen."
 MUN_czech.1029.a: "Ausgezeichnete Arbeit, meine Herren."
 MUN_czech.1030.t: "[FROM.GetNameDefCap] fordert die Integration"
 MUN_czech.1030.d: "[FROM.GetNameDefCap] verlangt, dass wir Teil der eigenen Union werden, die man ausbauen möchte. Obwohl man verschiedene Länder der Region aus diversen Gründen anspricht - sei es nun Panslawismus, Panbalkanismus oder eine gemeinsame Geschichte im Österreich-Ungarischen Reich -, schwingt stets auch eine deutliche Drohung für den Fall mit, dass wir ablehnen."
 MUN_czech.1030.a: "Vielleicht wäre das ja gar nicht so schlecht."
 MUN_czech.1030.b: "Nicht sonderlich überzeugend."
 MUN_czech.1031.t: "[FROM.GetNameDefCap] schlägt Vereinigung vor"
 MUN_czech.1031.d: "Obwohl [ROOT.GetNameDef] kapituliert hat, unterbreitete uns die [FROM.GetAdjective]e Regierung einen drastischen Vorschlag, der uns das Weiterkämpfen ermöglichen würde: Wir sollen den Rest unserer Nation mit der ihren vereinen."
 MUN_czech.1031.a: "Gemeinsam können wir besser unsere Heimatlande beschützen."
 MUN_czech.1031.b: "Unsere Differenzen sind zu groß."
 MUN_czech.1032.t: "Die Kluft überbrücken"
 CZE_divide_nation_title_dynamic_sudentenland: "Die Kluft im Sudetenland überbrücken"
 CZE_divide_nation_title_dynamic_czech_states: "Die Kluft mit tschechischen Arbeitern überbrücken"
 CZE_divide_nation_title_dynamic_tesinko_poles: "Die Kluft in [72.GetName] überbrücken"
 CZE_divide_nation_title_dynamic_slovakia_states: "Die Kluft in [SLO.GetNonIdeologyName] überbrücken"
 CZE_divide_nation_title_dynamic_hungarian_states: "Die Kluft in [664.GetName] überbrücken"
 CZE_divide_nation_title_dynamic_ukrainian_states: "Die Kluft in [73.GetName] überbrücken"
 MUN_czech.1032.d: "Unsere jüngsten Versuche, die Wut gegen die Zentralregierung in [FROM.getname] zu mindern, waren erfolgreich - zumindest vorläufig. Wir können unsere Ressourcen nun für andere soziale oder wirtschaftliche Programme nutzen und so auch andere Probleme lösen, die unser Land spalten."
 MUN_czech.1032.a: "Gehen wir es an."
 MUN_czech.1033.t: "Die [FROM.GetAdjective]e Exil-Regierung bittet um Anerkennung"
 MUN_czech.1033.d: "Die sich unter $CZE_edvard_benesh$ im Exil befindliche [FROM.GetAdjective]e Regierung hat darum gebeten, dass wir sie aufnehmen, solange sie darum kämpft, die Souveränität über [CZE.GetNonIdeologyName] wiederzuerlangen."
 MUN_czech.1033.a: "Ein weiterer Verbündeter gegen die [GER.GetAdjective]e Bedrohung."
 MUN_czech.1033.b: "Sie ist nicht legitim."
 MUN_czech.1034.t: "Unruhe in der Slowakei"
 MUN_czech.1034.d: "Da wir die nationalistischen Bestrebungen anderer legitimierten, haben Mitglieder der Slowakischen Volkspartei ihre eigene paramilitärische Truppe gebildet, um ihre Unabhängigkeit oder zumindest Autonomie für die Slowakei anzustreben. Wir müssen nun entscheiden, ob wir uns darauf konzentrieren sollen, den Anschein von Einheit aufrechtzuerhalten, oder aber ihre Abspaltung zulassen und uns auf Gebiete konzentrieren, die der derzeitigen Regierung gegenüber treu sind."
 MUN_czech.1034.a: "Entsendet die Armee in die Slowakei!"
 MUN_czech.1034.b: "Verhaftet ihre Anführer, aber gebt dem Volk etwas Autonomie."
 MUN_czech.1034.c: "Übernehmen wir die direkte Kontrolle."
 MUN_czech.1034.c_tt: "§RWir müssen uns der Entscheidung von [GER.GetName] fügen.§!"
 MUN_czech.1035.t: "[FROM.GetNameDefCap] bietet an, Waffen für uns herzustellen"
 MUN_czech.1035.d: "Unsere enge Partnerschaft mit [CZE.GetName] hat zu einem einzigartigen Vorschlag geführt: Man will gegen eine Gebühr jene Waffen für uns herstellen, die wir derzeit im Inland produzieren, und im Gegenzug könnten wir unsere Wirtschaft auf andere Sektoren konzentrieren."
 MUN_czech.1035.a: "Das würde weniger Doppelarbeit bedeuten."
 MUN_czech.1035.b: "Wir dürfen unsere Armee nicht von fremder Ausrüstung abhängig machen."
 #MUN_czech.1036.t: "" #Event uses MUN_czech.1032.t
 MUN_czech.1036.d: "Die Weltwirtschaftskrise hat unserer Nation weder wirtschaftlich noch politisch einen Gefallen getan. Wir werden noch immer von zahlreichen wirtschaftlichen und politischen Problemen geplagt, die nur noch schlimmer zu werden scheinen, obwohl wir uns allmählich von der Wirtschaftskrise erholen. Wir müssen diese Probleme angehen, bevor sie unsere Nation weiter spalten."
 MUN_czech.1036.a: "Wir müssen unsere Nation heilen."
 CZE_divided_nation_event_onbroad_tt: "Schaltet §YEntscheidungen§! frei, die es uns erlauben, die §Ynegativen Staatsmodifikatoren§! in unseren Kernstaaten zu §Yentfernen§!.\n\nDiese §YEntscheidungen§! abzuschließen, wird außerdem die negativen Modifikatoren unseres Nationalgeists „§Y$CZE_a_divided_nation_dynamic_modifier$§!“ mindern, bis er §Yentfernt§! wird"
 MUN_czech.1037.t: "[GER.GetName] beschützt [HUN.GetName]"
 MUN_czech.1037.d: "Nachdem ihnen aufgefallen war, wie offensichtlich unser Land einen Krieg gegen [HUN.GetName] rechtfertigt, haben [GER.GetAdjective]e Gesandte klar gemacht, dass eine Kriegserklärung gegen den [HUN.GetAdjective]en Staat auch Krieg gegen [GER.GetName] bedeuten würde. Nun liegt es an uns, wie es weitergeht."
 MUN_czech.1037.a: "Wir müssen unsere Pläne abbrechen."
 MUN_czech.1037.b: "Das ändert gar nichts."
 MUN_czech.1038.t.1: "[FROM.GetName] bietet Lizenzierung seiner Panzerpläne an"
 MUN_czech.1038.t.2: "[FROM.GetName] bietet Verkauf von Geschützen an"
 MUN_czech.1038.t.3: "[FROM.GetName] bietet Verkauf von Artillerie an"
 MUN_czech.1038.t.4: "[FROM.GetName] bietet Verkauf von Leichten Panzern an"
 MUN_czech.1038.t.5: "[FROM.GetName] bietet Verkauf von Jägern an"
 MUN_czech.1038.d: "Vertreter der [FROM.GetAdjective]en Regierung und ihrer Rüstungsunternehmen wandten sich mit dem Vorschlag an uns, uns Waffen zu verkaufen. Der Preis scheint ziemlich normal zu sein, und [FROM.GetNameDef] bietet sogar Waffen an, die recht modern sind."
 MUN_czech.1038.a: "Das klingt nach einem guten Geschäft."
 MUN_czech.1039.t: "[RUT.getname] möchte Autonomieabkommen"
 MUN_czech.1039.d: "Angesichts des Autonomieabkommens, das wir [SLO.GetName] gewährten, möchte $RUT_augustin_voloshyn$ gern dasselbe Föderalisierungsabkommen für seine Region mit uns. Dies scheint absurd, doch angesichts der Umstände müssen wir diese Forderungen ernst nehmen."
 MUN_czech.1039.a: "Das werden wir noch sehen."
 MUN_czech.1040.t: "[CZE.GetName] bietet uns ein Zollunion-Abkommen an"
 MUN_czech.1040.d: "[CZE.GetNameDefCap] nahm vor Kurzem die diplomatischen Gespräche bezüglich einer Zollunion zwischen unseren beiden Nationen wieder auf. Das vorgeschlagene Abkommen scheint gerecht, aber es könnte später noch andere Forderungen beinhalten, auf die wir möglicherweise nicht vorbereitet sind. Dieses Abkommen und die Handelswaren wirken trivial und symbolisch. Von daher kann es nicht schaden, es zu unterzeichnen."
 MUN_czech.1040.a: "Scheint harmlos."
 MUN_czech.1040.b: "Dieser Sache darf man nicht trauen."
 MUN_czech.1041.t: "[FROM.GetName] lehnt Zollunion-Abkommen ab"
 MUN_czech.1041.d: "Unter dem Vorwand irgendeines Grundes, warum dieses Abkommen der eigenen Wirtschaft schaden könnte, lehnt [FROM.GetName] ab, das Zollunion-Abkommen zwischen unseren beiden Nationen zu unterzeichnen. Diese Gründe scheinen völlig realitätsfremde Ausreden zu sein."
 MUN_czech.1041.a: "Enttäuschend."
 MUN_czech.1042.t: "[FROM.Getname] stimmt dem Zollunion-Abkommen zu"
 MUN_czech.1042.d: "Da [FROM.GetName] erkennt, dass das Abkommen zufriedenstellend ist, stimmt man den Bedingungen zu. Hoffentlich ist dies der erste Schritt hin zu engeren Beziehungen zwischen unseren beiden Nationen."
 MUN_czech.1042.a: "Ausgezeichnet."
 MUN_czech.1043.t: "[FROM.getname] fordert unseren Föderationsbeitritt"
 MUN_czech.1043.d: "Mit Verweis auf die engeren Beziehungen zwischen unseren beiden Nationen und den aktuellen Entwicklungen weltweit meinte [FROM.GetName], wir täten besser daran, [FROM.GetAdjective]en Schutz zu genießen, als ganz allein dazustehen. Dies scheint einfach nur ein Plan zu sein, unser Territorium zu besetzen. Wie sollen wir vorgehen?"
 MUN_czech.1043.a: "Wir willigen ein."
 MUN_czech.1043.b: "Eine grauenhafte Idee."
 MUN_czech.1044.t: "[FROM.getname] lehnt den Beitritt zur Föderation ab"
 MUN_czech.1044.d: "[FROM.getname] ist der Meinung, allein besser zurechtzukommen als unter unserer Führung, und man lehnt den Beitritt zu unserer Föderation ab. Ein harter Schlag für unsere Pläne, unsere Position in Europa zu stärken. Was sollen wir nun unternehmen, da [FROM.getname] wohl nicht zu Sinnen kommen wird?"
 MUN_czech.1044.a: "Jammerschade."
 MUN_czech.1044.b: "Wir müssen es auf andere Weise versuchen."
 MUN_czech.1045.t: "[FROM.Getname] erklärt sich bereit, der Föderation beizutreten"
 MUN_czech.1045.d: "[FROM.Getname] sieht ein, dass man unter uns besser geschützt ist als allein, und man traf die weise Entscheidung, unserer Föderation beizutreten. Dies wird unsere Position in Europa enorm stärken."
 MUN_czech.1045.a: "Ausgezeichnet."
 MUN_czech.1046.t: "Die Wunden heilen"
 MUN_czech.1046.d: "Nachdem wir so viele Probleme in unserem Land angegangen sind, scheinen die Spannungen in unserer Nation nun abzunehmen. Die zahlreichen wirtschaftlichen und sozialen Programme tragen dazu bei, dass unser Land jetzt heilt."
 MUN_czech.1046.a: "Das sind großartige Neuigkeiten!"
 #MUN_czech.1047 is hidden
 MUN_czech.1048.t: "[FROM.GetName] nimmt Forderungen an"
 MUN_czech.1048.t2: "[FROM.GetName] stimmt unserem Vorschlag zu"
 MUN_czech.1048.d: "Widerwillig setzen [FROM.GetAdjective]e Vertreter uns davon in Kenntnis, dass sie unseren territorialen Forderungen nachkommen werden. Bereits jetzt ziehen sich die [FROM.GetAdjective]en Truppen aus dem Gebiet zurück."
 MUN_czech.1048.d2: "Nach langwierigen Gesprächen konnten wir uns mit [FROM.GetName] einigen, welche Rolle die [FROM.GetAdjective]e Wirtschaft als Teil unserer Union spielen wird. Diese Vereinbarung wird uns beiden Wohlstand bringen."
 MUN_czech.1048.d3: "Unser vorgeschlagener Nichtangriffspakt traf bei den [FROM.GetAdjective]en Vertretern unmittelbar auf Zustimmung. Es scheint, als läge ihr Schwerpunkt derzeit auf anderen Regionen."
 MUN_czech.1048.d4: "Da man ernsthaft bedroht wird, beschloss [FROM.GetNameDef], unserer Forderung nach Angleichung zuzustimmen."
 MUN_czech.1048.d5: "Nach langatmigen Verhandlungen trafen unsere eigenen und die [FROM.GetAdjective]en Diplomaten erfolgreich eine Vereinbarung, wonach ein Teil unserer Rüstungsindustrie für die Herstellung von Ausrüstung für ihre Kriegsbemühungen genutzt werden soll. Im Gegenzug erhalten wir Handelsgüter für unsere Märkte und unsere Produktion."
 #MUN_czech.1049 is a faction joining event so largely reuses generic loc
 MUN_czech.1049.d: "Die neue Regierung von [FROM.GetName] schlägt uns eine Allianz vor. Trotz der ursprünglich anti-deutschen Haltung der neuen Militärregierung handelt man offenbar pragmatisch, da klar wurde, dass die bisherigen internationalen Partner unzuverlässig sind."
 MUN_czech.1050.d: "Unsere Diplomaten kehrten aus [FROM.GetName] zurück mit der enttäuschenden Kunde, dass unsere Bitte, der Allianz beitreten zu dürfen, abgelehnt wurde. Die Gründe dafür sind unklar, aber wir befinden uns nun in der schwierigen Lage, unsere Zweifel bezüglich unserer traditionellen Verbündeten kundgetan zu haben, ohne dass wir einen neuen gewonnen hätten."
 MUN_czech.1050.a: "Vielleicht sollten wir ihnen günstigere Bedingungen anbieten."
 MUN_czech.1050.b: "Suchen wir uns bessere Verbündete."
 MUN_czech.1051.t: "[FROM.GetNameDefCap] möchte die Interessensphäre vergrößern"
 MUN_czech.1051.d: "Unser neuer Verbündeter, [FROM.GetNameDef], äußerte den Wunsch, den eigenen Einfluss über die eigenen Grenzen hinaus ausweiten zu dürfen. Man bat uns nun, dieses Vorhaben zu genehmigen und zu unterstützen und klare Grenzen zwischen dem [ROOT.GetAdjective]en und dem [FROM.GetAdjective]en Einfluss zu ziehen."
 MUN_czech.1051.a: "Wir sollten unseren wichtigsten [FROM.GetAdjective]en Verbündeten stärken."
 MUN_czech.1052.t: "[FROM.GetNameDefCap] fordert Durchmarschrechte für [SOV.GetAdjective]e Truppen"
 MUN_czech.1052.d: "Dank der kürzlich geschlossenen Vereinbarung zwischen [FROM.GetName] und [SOV.GetName] ist [FROM.GetNameDef] zuversichtlich, dass [SOV.GetNameDef] im Fall eines Konflikts schützend eingreifen wird. Das einzige Hindernis ist die fehlende Landverbindung, weshalb sich [FROM.GetAdjective]e Diplomaten an unsere Regierung wandten, um Durchmarschrechte für [SOV.GetAdjective]e Truppen durch unser Territorium auszuhandeln, sollte [FROM.GetNameDef] in den Krieg ziehen müssen."
 MUN_czech.1052.a: "Ihr Kampf wird auch uns schützen."
 MUN_czech.1053.t: "[FROM.GetNameDefCap] setzt uns mit [HUN.GetAdjective]en Ansprüchen unter Druck"
 MUN_czech.1053.d: "Nachdem [HUN.GetNameDef] in einen Klientelstaat umgewandelt wurde, fordert [FROM.GetNameDef] nun Gleiches von uns. Man droht damit, bei einer Weigerung die [HUN.GetAdjective]en Ansprüche auf [ROM.GetAdjective]es Territorium zu unterstützen. Wir müssen also entscheiden, ob wir unsere Souveränität oder unsere territoriale Integrität aufgeben ..."
 CZE_cancel_anti_hungary_focus_tt: "Bricht Schwerpunkt §Y$CZE_neutralize_the_hungarian_threat$§! ab"
 MUN_czech.1054.t: "Gemeinsame Invasion nach [LIT.GetName]?"
 MUN_czech.1054.d: "Wie zuvor vereinbart ist [FROM.GetNameDef] mit einem Vorschlag an uns herangetreten, der unsere Nation stärken wird: Durch die erzwungene Vereinigung mit [LIT.GetName] würden wir Zugang zu zusätzlichen Ressourcen erhalten und dem Feind die Möglichkeit nehmen, uns unerwartet von dieser Seite aus anzugreifen."
 MUN_czech.1054.a: "Wir müssen expandieren, um der Expansion anderer zuvorzukommen."
 MUN_czech.1055.t: "[SOV.GetAdjective]e Freiwillige sind eingetroffen"
 MUN_czech.1055.d: "In einer beispiellosen logistischen Meisterleitung ist es der [SOV.GetAdjective]en Luftwaffe gelungen, mehrere Freiwilligen-Divisionen zu unserem Luftstützpunkt in [73.GetName] zu bringen, um unsere dortigen Kriegsbemühungen zu unterstützen."
 MUN_czech.1056.t: "[FROM.GetNameDefCap] fordert [975.GetName]"
 MUN_czech.1056.d: "Genau wie einst auf der Pariser Friedenskonferenz nach dem Ersten Weltkrieg vorgeschlagen, erklärte [CZE.GetNameDef], dass ein Korridor zu den Verbündeten in [YUG.GetName] für die Sicherheit des Bündnisses notwendig sei. Zur Durchsetzung dieses Ziels wurde uns von den [FROM.GetAdjective]en Abgesandten das Ultimatum gestellt, [975.GetName] abzutreten."
 #THE FALL OF THE REPUBLIC EVENTS#
 MUN_the_fall_of_the_republic.1.t: "Groß angelegte Proteste"
 MUN_the_fall_of_the_republic.1.d: "Die jüngste Entscheidung von [ROOT.GetLeader], das Sudetenland aufzugeben, hat zu zahlreichen Protesten im ganzen Land geführt. Da [ROOT.GetLeader] Widerstand angesichts der aussichtslosen Lage für sinnlos hielt, wollte er mit diesem Schritt unnötiges Blutvergießen vermeiden. Viele Menschen im ganzen Land sind jedoch der Meinung, dies sei die falsche Entscheidung, und einige Bewegungen versuchen nun, die Unruhen zu nutzen, um ihre eigenen Agenden voranzutreiben."
 MUN_the_fall_of_the_republic.1.a: "Wir hatten keine andere Wahl!"
 MUN_the_fall_of_the_republic.2.t.1: "Untergang der ersten Republik"
 MUN_the_fall_of_the_republic.2.t.2: "Unruhen innerhalb der Regierung"
 MUN_the_fall_of_the_republic.2.d: "Nachdem sich die Regierung dazu entschieden hatte, das Sudetenland abzutreten, kam es zu einer großen Welle von Rücktritten, besonders bei jungen Führungskräften in der Armee und der Regierung. Einige von ihnen sollen sogar über Nacht aus dem Land geflohen sein. Große Reformen werden nötig sein, um den Aderlass an Beamten zu stoppen und das Vertrauen in unsere Führung wiederherzustellen."
 MUN_the_fall_of_the_republic.2.a: "Wir benötigen eine radikale Veränderung."
 MUN_the_fall_of_the_republic.2.b: "Wir müssen den Kurs beibehalten!"
 MUN_the_fall_of_the_republic.3.t: "[RUT.GetNameDefCap] bittet um mehr Autonomie"
 MUN_the_fall_of_the_republic.3.d: "Angesichts der politischen Unruhen, die unser Land derzeit plagen, wünscht die kleine Region der Karpatenukraine mehr Autonomie von [9.GetCapitalVictoryPointName] zu erhalten. Sie begründet dies damit, dass es schon immer Differenzen zwischen ihr und dem Rest von [ROOT.getname] gegeben habe. Der wahre Grund scheint jedoch eher daran zu liegen, dass lokale Politiker die Gelegenheit nutzen wollen, um ihre Macht zu festigen. Ihren Antrag abzulehnen, würde unserer Regierung viel abverlangen, und wir haben derzeit eigentlich kaum die nötigen Kapazitäten dafür."
 MUN_the_fall_of_the_republic.3.a: "Sicher. Warum auch nicht?"
 MUN_the_fall_of_the_republic.3.b: "Auf gar keinen Fall!"
 MUN_the_fall_of_the_republic.3.c: "Lassen wir sie frei."
 MUN_the_fall_of_the_republic.4.t: "Das Schicksal von [RUT.getname]"
 MUN_the_fall_of_the_republic.4.d: "Nach dem jüngsten Chaos in [CZE.getname] liegt die kleine Region [RUT.getname] nicht länger innerhalb der Grenzen irgendeines Landes. Die Region gibt an, ein unabhängiges Land zu sein, und hat bereits damit begonnen, sich diplomatisch an ihre Nachbarn anzunähern. Viele innerhalb unserer Regierung sind besorgt, dass eine strategisch derart wichtige Region an unserer Grenze in die Hände unserer Feinde fallen könnte. Die Armee hat vorgeschlagen, der Region unverzüglich ein Ultimatum zu stellen und ihre Annexion zu fordern."
 MUN_the_fall_of_the_republic.4.a: "Unterbreitet das Ultimatum!"
 MUN_the_fall_of_the_republic.4.b: "Das könnte riskant sein. Warten wir lieber ab."
 MUN_the_fall_of_the_republic.5.t: "[FROM.getname] fordert unsere Annektierung!"
 MUN_the_fall_of_the_republic.5.d: "Nach unserer Unabhängigkeitserklärung war es nur eine Frage der Zeit, bis eines unserer Nachbarländer versucht, unser Territorium zu schlucken. [FROM.GetNameDefCap] scheint als Erstes zu diesem Entschluss gekommen zu sein und fordert unsere Kapitulation. Wie sollen wir darauf reagieren?"
 MUN_the_fall_of_the_republic.5.a: "Wir kämpfen bis zum letzten Mann!"
 MUN_the_fall_of_the_republic.5.b: "Uns bleibt keine andere Wahl, als zu akzeptieren."
 MUN_the_fall_of_the_republic.6.t: "[FROM.GetNameDefCap] lehnt unser Ultimatum ab!"
 MUN_the_fall_of_the_republic.6.d: "[FROM.GetNameDefCap] hat unser Ultimatum unerwarteterweise abgelehnt und ist bereit, bewaffneten Widerstand zu leisten. Wir haben keine andere Wahl, als einzumarschieren. Die Schlachtpläne und Angriffswege wurden bereits ausgearbeitet, und wir müssen nur noch den Befehl zum Angriff geben."
 MUN_the_fall_of_the_republic.6.a: "Wir haben sie gewarnt."
 MUN_the_fall_of_the_republic.6.a_tt: "Vorausgesetzt [RUT.GetNameDef] hat keine Verbündeten, hat diese Operation keine Auswirkungen auf §Y$HUN_pal_teleki$§!"
 MUN_the_fall_of_the_republic.6.b: "Das könnte nach hinten losgehen. Wir sollten besser abwarten."
 MUN_the_fall_of_the_republic.7.t: "[FROM.GetNameDefCap] gibt unseren Forderungen nach"
 MUN_the_fall_of_the_republic.7.d: "Wenig überraschend hat [FROM.GetNameDef] unsere Forderungen akzeptiert und ist bereit, für ein paar triviale Zugeständnisse von unserem Land annektiert zu werden. Die kleine Region hatte nie eine Chance, sich einer so mächtigen Nation wie unserer zu widersetzen. Unsere Nordgrenze ist nun besser geschützt als zuvor, und unsere Regierung zeigt sich ob dieses einfachen Siegs äußerst zufrieden."
 MUN_the_fall_of_the_republic.7.a: "Das sind hervorragende Neuigkeiten."
 #BOP EVENTS#
 MUN_czech_bop.1.t: "Bereitschaft der Armáda"
 MUN_czech_bop.1.d: "Unsere Reformbemühungen in der ersten Hälfte des Jahrzehnts tragen langsam Früchte und unsere Armee gehört mittlerweile zu den modernsten in ganz Europa. Dennoch hat sich bei einigen Politikern und den Leitern vieler Industriekonzerne eine gewisse Selbstzufriedenheit breitgemacht. Wenn unsere Armee weiterhin einsatzbereit bleiben soll, müssen wir gegen mögliche Zweifel an ihrer Kampfkraft vorgehen und jene bekämpfen, die sie aus persönlicher Profitgier untergraben wollen."
 MUN_czech_bop.1.a: "Wir werden bereit sein."
 MUN_czech_bop.2.t.1: "Bedrohung einer deutschen Wiederbewaffnung"
 MUN_czech_bop.2.t.2: "Nachbarländer expandieren militärisch"
 MUN_czech_bop.2.d.1: "Die kürzliche Remilitarisierung des Rheinlands durch [GER.getname] hat sowohl unsere militärische als auch unsere politische Führung stark verängstigt. Viele vertrauen zwar in die Bündnisse, die unser Land geschlossen hat, sowie in die derzeitigen Vorbereitungen zur Mobilisierung unserer Armee, doch es gibt auch vereinzelte Stimmen, die weniger zuversichtlich sind, dass wir uns gegen die [GER.GetAdjective]e Bedrohung behaupten können."
 MUN_czech_bop.2.d.2: "Die Nachricht, dass einige unserer Nachbarn damit begonnen haben, ihr Militär aufzustocken, hat sowohl unsere militärische als auch unsere politische Führung stark verängstigt. Viele vertrauen zwar in die Bündnisse, die unser Land geschlossen hat, sowie in die derzeitigen Vorbereitungen zur Mobilisierung unserer Armee, doch es gibt auch vereinzelte Stimmen, die weniger zuversichtlich sind, dass wir uns gegen eine Aggression unserer Nachbarn ausreichend zur Wehr setzen können."
 MUN_czech_bop.2.a: "Wir werden vorbereitet sein."
 MUN_czech_bop.2.a_tt: "Die Aufrüstung unserer Nachbarn ließ innerhalb unserer Armee Zweifel aufkommen, ob wir einem möglichen Angriff standhalten können. Wir müssen die Armee durch Taten beruhigen."
 MUN_czech_bop.3.t: "[CZE.GetNameDefCap] hat Beobachter in unser Land entsandt"
 MUN_czech_bop.3.d: "[CZE.GetNameDefCap] schickte kürzlich eine Gesandtschaft in unser Land, um den anhaltenden Konflikt zu beobachten. Gleichzeitig hat einer ihrer Handfeuerwaffenproduzenten über indirekte Kanäle Kontakt zu einigen unserer Diplomaten aufgenommen und angefragt, ob wir daran interessiert wären, Handfeuerwaffen von ihnen zu kaufen. Aufgrund der uns auferlegten Beschränkungen würde dies bedeuten, dass wir die Waffen in unser Land schmuggeln müssten."
 MUN_czech_bop.3.a: "Mal sehen, wohin das führt."
 MUN_czech_bop.3.b: "Wir müssen verhindern, dass sie mehr tun, als nur zu beobachten."
 MUN_czech_bop_3_tt: "Der §Y[CZE.GetAdjektive]§! Waffenproduzent §Y$CZE_zbrojovka_brno_organization$§! könnte versuchen, Waffen in unser Land zu schmuggeln"
 MUN_czech_bop.4.t: "Der Plan der $CZE_zbrojovka_brno_organization$"
 MUN_czech_bop.4.d: "[ETH.GetNameDefCap] hat Kontakt zu Vertretern des Handfeuerwaffenherstellers $CZE_zbrojovka_brno_organization$ aufgenommen und ist daran interessiert, Waffen in das Land zu schmuggeln. Trotz der Sanktionen durch den Völkerbund gegen [ETH.GetName] erklärt sich auch $CZE_zbrojovka_brno_organization$ einverstanden. Gegen das Mandat des Völkerbunds zu verstoßen und erwischt zu werden, würde uns auf der internationalen Bühne wenig Freunde machen."
 MUN_czech_bop.4.a: "Tun wir es."
 MUN_czech_bop.4.b: "Das ist die möglichen Konsequenzen nicht wert."
 CZE_gun_smuggling_tt: "Schmuggelt Waffen in unser Land"
 CZE_we_got_caught_tt: "§Y$CZE_zbrojovka_brno_organization$§! wird erwischt"
 CZE_we_dont_get_caught_tt: "§Y$CZE_zbrojovka_brno_organization$§! wird nicht erwischt"
 MUN_czech_bop.5.t: "$CZE_zbrojovka_brno_organization$ stimmt Waffenschmuggel zu"
 MUN_czech_bop.5.d: "Nach Gesprächen mit Vertretern der tschechischen Regierung wurde der $CZE_zbrojovka_brno_organization$ insgeheim das Okay gegeben, kleine Mengen an Handfeuerwaffen in unser Land zu schmuggeln. Ihre Fachkenntnisse in diesem Bereich werden uns ebenfalls durch unsere Hinterzimmerkontakte zur Verfügung stehen."
 MUN_czech_bop.5.a: "Wir werden sie gut zu nutzen wissen."
 MUN_czech_bop_5_tt: "Dieser §YHersteller§! wird §Rentfernt§!, wenn der Krieg endet"
 ##SLOVAKIA##
 MUN_slovakia_little_war.1.t: "Sieg in [71.Getname]"
 MUN_slovakia_little_war.1.d: "Unsere Armee schlug sich in [71.Getname] gut und konnte alle feindlichen Streitkräfte im Gebiet besiegen. Unsere Kommandanten gewannen aus dieser Schlacht ebenfalls wertvolle Informationen, die sie in Zukunft nutzen können."
 MUN_slovakia_little_war.1.a: "Ausgezeichnete Arbeit."
 MUN_slovakia_little_war.2.t: "Niederlage in [71.Getname]"
 MUN_slovakia_little_war.2.d: "Obwohl wir alles in unserer Macht Stehende versuchten, wurden unsere Streitkräfte in [71.Getname] besiegt. Die Unfähigkeit, rechtzeitig vor dem Konflikt genügend Munition und motorisierte Ausrüstung zu beschaffen, war ein entscheidender Faktor für unsere Niederlage. Trotz dieses Rückschlags konnten die an der Schlacht beteiligten Kommandanten wertvolle Erfahrung sammeln."
 MUN_slovakia_little_war.2.a: "Eine enttäuschende Leistung."
 MUN_slovakia_little_war.3.t: "Zusammenstoß an der Grenze in [71.Getname]"
 MUN_slovakia_little_war.3.d: "Selbst nachdem sie unsere Territorien in $GER_first_vienna_award$ übernommen haben, versucht [HUN.getnamedef], weitere Grenzanpassungen mit uns in [71.getname] vorzunehmen. Wir müssen uns dieser Herausforderung entgegenstellen und zeigen, dass wir unser Land nicht kampflos aufgeben."
 MUN_slovakia_little_war.3.a: "Wie können sie es wagen?!"
 MUN_slovakia_little_war.4.t: "Pattsituation in [71.Getname]"
 MUN_slovakia_little_war.4.d: "Obwohl wir alles in unserer Macht Stehende versuchten, konnten wir die Kämpfe in [71.Getname] nicht gewinnen. Die Unfähigkeit, rechtzeitig vor dem Konflikt genügend Munition und motorisierte Ausrüstung zu beschaffen, war ein entscheidender Faktor für unsere Unfähigkeit, einen Sieg zu erringen. Trotz dieses Rückschlags konnten die an der Schlacht beteiligten Kommandanten wertvolle Erfahrung sammeln."
 MUN_slovakia_little_war.4.a: "Enttäuschend."
 ##Exile##
 MUN_czech_exile.1.t: "[CZE.GetAdjective]e Exilanten treffen in [ROOT.GetName] ein"
 MUN_czech_exile.1.d: "Nach der Auflösung ihres Staates im Zuge der Münchner Konferenz durch [GER.GetName] sind viele ehemalige [CZE.GetAdjective]e Staatsbürger geflohen und auch in unserem Land eingetroffen. Sie sind bereit, zu den Waffen zu greifen, um uns zu unterstützen und ihr Land eines Tages mit unserer Hilfe zu befreien."
 MUN_czech_exile.1.a: "Willkommen."
 ##NEWS EVENTS##
 MUN_czech.news.1.t: "Die Sudetenkrise"
 MUN_czech.news.1.desc: "Die Menschen des Sudetenlands haben zu den Waffen gegriffen, um gegen die [CZE.GetAdjective]e Führung zu rebellieren, und es gibt Berichte, wonach sudetische Milizen Polizeistationen und Regierungsgebäude in der gesamten Region angreifen. Dies ist als Folge darauf geschehen, dass [FROM.getname] ankündigte, die Region annektieren zu wollen.\n\nDie Aufstände wirken wie der Auftakt zu einem größeren Konflikt zwischen [FROM.getname] und [CZE.GetNameDef], der nun unvermeidlich scheint."
 MUN_czech.news.1.a: "Das verheißt für Europa nichts Gutes!"
 MUN_czech.news.1.b: "Chaos ist eine Leiter."
 MUN_czech.news.1.c: "Wir werden siegen!"
 MUN_czech.news.1.d: "Hoffentlich wird die Diplomatie siegen."
 MUN_czech.news.2.t: "[FROM.GetNameDefCap] fällt in [ROOT.GetName] ein"
 MUN_czech.news.2.desc: "\nIrgendetwas in der jüngsten Kette von Ereignissen während des politischen Chaos in [CZE.getname] führte dazu, dass die kleine Region [RUT.getname] nicht länger innerhalb der Grenzen irgendeines Landes liegt, woraufhin der winzige Staat seine Unabhängigkeit erklärte und begann, Milizen zur Sicherung der neuen Grenzen aufzustellen.\n\n[FROM.GetNameDefCap] hegte bereits seit Langem Pläne für die Region und packte die Gelegenheit beim Schopf, um den kleinen abtrünnigen Staat zu erobern. Ihr Sieg über [RUT.getname] scheint für viele Beobachter bereits eine ausgemachte Sache zu sein."
 MUN_czech.news.2.a: "Karpaten was?"
 MUN_czech.news.2.b: "Das wird leicht sein."
 MUN_czech.news.2.c: "Kommt, wenn ihr euch traut!"
 MUN_slovakia.news.1.t: "Grenzscharmützel in [71.Getname]"
 MUN_slovakia.news.1.desc: "Obwohl wir in Folge des Ersten Wiener Schiedsspruchs [664.Getname] zurückerlangten, versucht [HUN.getnamedef], weitere Grenzanpassungen mit [SLO.getname] in [71.Getname] anzustreben.\n\nDieser Konflikt scheint nur ein Vorwand für [HUN.getname] zu sein, um herauszufinden, wie stark die eigene Armee gegen einen viel schwächeren Feind ist. Die junge Streitmacht von [SLO.getname] ist möglicherweise noch nicht bereit, sich solch einer Herausforderung zu stellen."
 MUN_slovakia.news.1.a: "Wie zankende Kinder ..."
 MUN_slovakia.news.1.b: "Wir sind dieser Herausforderung gewachsen."
