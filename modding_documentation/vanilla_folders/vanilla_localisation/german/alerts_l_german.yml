 LOW_SUPPLIES_TIPS: "Wir können eine der folgenden Maßnahmen ergreifen, um die Situation zu verbessern:\n – Einheiten umverteilen oder neue zuweisen, um den lokalen Verbrauch zu reduzieren\n\n – Infrastruktur ausbauen und sicherstellen, dass es keine Engpässe von der Hauptstadt aus gibt\n\n - Wenn wir genügend LKWs besitzen, können wir Verkehrsknoten in der Region motorisieren, was die Nachschubgrenze und Reichweite erhöht\n\nFalls der Nachschub über Wasser erfolgt, ist auch Folgendes möglich:\n – Marinestützpunkte in den Ausgangs- und Zielprovinzen ausbauen\n\n – Sicherstellen, dass ausreichend Konvois vorhanden sind\n\n – Sicherstellen, dass Konvois mittels der Marinemission \"Konvoi-Eskorte\" entlang der Route Geleitschutz haben. Die Liefereffizienz kann sich verringern, wenn Konvois versenkt werden."
