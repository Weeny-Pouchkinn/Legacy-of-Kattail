 ### MISC ###
 ############
 add_random_stat_to_general_tt: "Gibt einem General einen zufälligen Fähigkeitspunkt"
 generic_unlock_industrial_concern_tt: "Verfügbar als Industriekonzern:\n"
 NZL_rail_standardization_tt: "§Y[?NZL_train_var]§! Einheiten §Y$NZL_train_equipment_1$§! werden dem nationalen Lagerbestand hinzugefügt."
 NZL_ministry_of_public_works: "Ministerium für öffentliche Arbeiten"
 NZL_ministry_of_public_works_desc: "Durch koordinierte Planung und gezielte Investitionen können Straßen-, Eisenbahn- und Energieprojekte im Rahmen einer kohärenten nationalen Strategie vorangetrieben und nicht nur punktuell umgesetzt werden."
 NZL_abolish_the_railways_board: "Die Eisenbahnbehörde abschaffen"
 NZL_abolish_the_railways_board_desc: "Die staatliche Eisenbahnbehörde versagte bei der Modernisierung des Netzes. Es ist an der Zeit, dass wir die Eisenbahnen wieder unter die Kontrolle des Ministeriums stellen."
 NZL_rail_standardization: "Standardisierte Lokomotiven"
 NZL_rail_standardization_desc: "[ROOT.GetNameDefCap] verfügt landesweit über eine Reihe von Fabriken, die Lokomotiven unterschiedlicher Qualität herstellen. Um die Effizienz des Eisenbahnsystem zu erhöhen, müssen wir Standards für Lokomotiven einführen, die jeweils einem bestimmten Zweck gewidmet sind und an die sich diese Hersteller halten können."
 NZL_full_employment: "Vollbeschäftigung"
 NZL_full_employment_desc: "Dank nachhaltiger öffentlicher Bauprojekte, sorgfältiger Planung und stetiger industrieller Expansion sank die Arbeitslosigkeit beinahe vollständig auf null. Fabriken, die man während der Krise stilllegte, sind wieder in Betrieb und die Arbeiter voll in produktive Prozesse eingebunden. Wir stellten das Vertrauen und die Stabilität wieder her und stärkten uns für die vor uns liegenden Herausforderungen."
 NZL_direct_the_coal_industry: "Der Kohleindustrie die Richtung vorgeben"
 NZL_direct_the_coal_industry_desc: "Da Kohle für unsere Eisenbahnen, die Industrie und die Kraftwerke immer wichtiger wird, muss die Regierung im nationalen Interesse dafür sorgen, dass man den Abbau und die Verteilung streng koordiniert."
 NZL_establish_the_ncb: "Neuer staatlicher Kohleausschuss"
 NZL_establish_the_ncb_desc: "Durch die Gründung eines staatlichen Kohleausschusses koordinieren wir die über das Land verstreuten Bergwerke unter einer einzigen Leitung und stellen sicher, dass Eisenbahnen, Industrie und Stromerzeugung stets genug Brennstoff haben. Diese zentrale Aufsichtsbehörde gewährleistet außerdem, dass die Produktionskapazitäten optimiert werden und strategische Einsatzzwecke Vorrang vor privaten Interessen haben."
 NZL_electrification: "Ausbau der Stromerzeugung"
 NZL_electrification_desc: "Durch die Nutzung unserer Flüsse und den Ausbau der Wasserkraft schaffen wir die Grundlagen für eine nachhaltige Industrie. Neue Staudämme und Stromleitungen erhöhen landesweit die Kapazitäten und stellen sicher, dass Fabriken, Eisenbahnen und Häfen stets mit der benötigten Energie versorgt werden."
 NZL_bureau_of_industry_taog: "$NZL_bureau_of_industry$"
 NZL_bureau_of_industry_taog_desc: "$NZL_bureau_of_industry_desc$"
 NZL_wairarapa_sheep_farms_taog: "$NZL_wairarapa_sheep_farms$"
 NZL_wairarapa_sheep_farms_taog_desc: "$NZL_wairarapa_sheep_farms_desc$"
 NZL_national_roads_board_taog: "$NZL_national_roads_board$"
 NZL_national_roads_board_taog_desc: "$NZL_national_roads_board_desc$"
 NZL_taranaki_oil_taog: "$NZL_taranaki_oil$"
 NZL_taranaki_oil_taog_desc: "$NZL_taranaki_oil_desc$"
 NZL_women_in_the_workforce: "Frauen in der Arbeiterschaft"
 NZL_women_in_the_workforce_desc: "Angesichts des zunehmenden Arbeitskräftemangels übernehmen oft Frauen wichtige Aufgaben in Fabriken, der Landwirtschaft und im öffentlichen Dienst und sorgen dafür, dass die Produktion trotz des Krieges nicht zusammenbricht. Durch den Ausbau von Ausbildungs- und Beschäftigungsmöglichkeiten erhalten wir die industrielle Produktion aufrecht und verteidigen gleichzeitig das Land."
 NZL_restart_the_onekaka_ironworks: "Die Onekaka-Eisenhütte wiedereröffnen"
 NZL_restart_the_onekaka_ironworks_desc: "Die Eisenhütte in Onekaka stand einst für unser Bestreben, Eisen und Stahl im eigenen Land zu produzieren, um die Abhängigkeit von Importen aus dem Ausland zu verringern. Um die Wirtschaft wieder anzukurbeln und zum Schutz der nationalen Sicherheit schlug man vor, die Hochöfen von Onekaka wieder in Betrieb zu nehmen."
 NZL_new_zealand_steel_taog: "$NZL_new_zealand_steel$"
 NZL_new_zealand_steel_taog_desc: "$NZL_new_zealand_steel_desc$"
 NZL_scrap_metal_recycling: "Recycling-Kampagne"
 NZL_scrap_metal_recycling_desc: "Eine von Importen abhängige Wirtschaft wie unsere kann es sich nicht leisten, strategische Ressourcen zu verschwenden. Um wirtschaftlich unabhängiger zu werden, müssen wir Schrottrecyclinganlagen errichten und Metalle und Gummi aufbereiten und wiederverwenden."
 NZL_domestic_car_industry: "In Fahrzeugmontagewerke investieren"
 NZL_domestic_car_industry_desc: "Die Produktion von Fahrzeugen in [ROOT.GetName] beschränkte sich bislang auf die Montage von Bauteilen ausländischer Hersteller, die man zur Endfertigung hierher lieferte. Dank unserer jüngsten Investitionen in die heimische Stahlproduktion sind wir nun in der Lage, diese Komponenten selbst herzustellen."
 NZL_department_of_scientific_and_industrial_research_taog: "$NZL_department_of_scientific_and_industrial_research$"
 NZL_department_of_scientific_and_industrial_research_taog_desc: "$NZL_department_of_scientific_and_industrial_research_desc$"
 NZL_project_seal_taog: "$NZL_project_seal$"
 NZL_project_seal_taog_desc: "$NZL_project_seal_desc$"
 NZL_industrial_conscription_taog: "$NZL_industrial_conscription$"
 NZL_think_big_taog: "$NZL_think_big$"
 NZL_industrial_conscription_taog_desc: "$NZL_industrial_conscription_desc$"
 NZL_think_big_taog_desc: "$NZL_think_big_desc$"
 NZL_expand_the_university_of_auckland_taog: "$NZL_expand_the_university_of_auckland$"
 NZL_expand_the_university_of_auckland_taog_desc: "$NZL_expand_the_university_of_auckland_desc$"
 NZL_national_broadcasting_service: "Staatlicher Rundfunk"
 NZL_national_broadcasting_service_desc: "Nach der Einflussname des Postamts auf die Wahlen von 1935 sowie seiner Kontrolle über die staatlichen Rundfunkdienste scheint eine Reform nötig zu sein. Zudem sollten wir in die Modernisierung der genutzten Rundfunksysteme investieren."
 NZL_support_allies_with_meat: "Fleischindustrie"
 NZL_support_allies_with_meat_desc: "Unsere Verbündeten im Pazifikraum strapazieren ihre Versorgungswege oft bis an ihre Grenzen. Wir werden sie mit Fleisch beliefern, um diese Belastung zu verringern und sicherzustellen, dass ihre Truppen stets mit Vorräten versorgt sind."
 NZL_support_allies_with_meat_tt: "Jeder Verbündete erhält §G1§! §YZivilfabrik abseits der Karte§!"
 AST_COMINWEALTH_FACTION: "Commonwealth"
 AST_cominwealth_tech_sharing_tt: "Wir werden ein §YAbkommen zum Teilen von Technologien§! mit allen Mitgliedern unseres Bündnisses eingehen."
 AST_modify_offshore_advancements_spirit_tt: "Modifiziert §Y$AST_offshore_advancements_spirit$§! um:"
 AST_gain_claims_on_japan_tt: "Wir erhalten Ansprüche auf die §Yjapanischen Hauptinseln§!"
 AST_ireland_anti_british_pact_offer_accept_tt: "Wenn sie annehmen:"
 AST_through_the_barricades_tt: "Wenn §Y[ENG.GetNameDef]§! mindestens §Y10%§! Unterstützung für den Kommunismus hat, werden sich bei Ausbruch des Krieges die Hafenarbeiter von §Y[132.GetCapitalVictoryPointName]§! erheben, um uns zu unterstützen."
 AST_end_the_kingdom_ireland_join_tt: "Da [IRE.GetNameDef] das antibritische Abkommen unterzeichnete, schließt sich [IRE.GetNameDef] uns bei einer Kriegserklärung gegen [ENG.GetName] an."
