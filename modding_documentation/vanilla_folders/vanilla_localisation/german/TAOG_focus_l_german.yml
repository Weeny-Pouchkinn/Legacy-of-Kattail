 ##### FABDA BRANCH ########
 ###########################
 # Root
 ABDA_abdacom: "Die ABDACOM gründen"
 ABDA_abdacom_desc: "Aufgrund des schnellen Vormarschs feindlicher Mächte in Südostasien und im Pazifikraum müssen die alliierten Streitkräfte in der Region geschlossen vorgehen, um sie aufzuhalten. Durch die Einrichtung eines gemeinsamen Oberkommandos bündeln wir unsere Ressourcen, koordinieren unsere Seestreitkräfte und bieten dem Feind eine geeinte Front."
 # Tier 1 - country-locked
 ABDA_fortress_singapore: "Festung Singapur"
 ABDA_fortress_singapore_desc: "Singapur ist der Dreh- und Angelpunkt unserer Verteidigungsstrategie in der Region. Indem wir die dortigen Befestigungsanlagen verstärken und eine starke Garnison stationieren, verschaffen wir den Bemühungen des ABDACOM die nötige Zeit und verwehren dem Feind einen schnellen strategischen Sieg."
 ABDA_corps_expeditionnaire: "CEFEO"
 ABDA_corps_expeditionnaire_desc: "Französisch-Indochina liegt an der Nordflanke des ABDACOM. Durch die Teilnahme des Expéditionnaire Français en Extrême-Orient an aktiven Einsätzen stellt [FRA.GetNameDef] dem gemeinsamen Kommando wichtiges Personal und die Erfahrung seiner Kolonialstreitkräfte zur Verfügung."
 ABDA_maintain_strategic_flexibility: "Strategische Flexibilität"
 ABDA_maintain_strategic_flexibility_desc: "Die Vereinigten Staaten sollten ihre eigenen Streitkräfte nicht zu stark auf einen einzelnen Einsatzraum konzentrieren. Durch den Einsatz unserer strategischen Reserve stellen wir sicher, dass die industrielle und militärische Macht der USA überall dort zum Einsatz kommt, wo sie im Pazifikraum am dringendsten benötigt wird."
 # Tier 2
 ABDA_the_malay_barrier: "Malaiische Barriere"
 ABDA_the_malay_barrier_desc: "Die Inselkette, die sich von Malaya durch [INS.GetNonIdeologyName] erstreckt, fungiert als natürliche Verteidigung. Die Streitkräfte der ABDA müssen die geografischen Gegebenheiten nutzen und eine koordinierte See- und Landverteidigung aufbauen, die den Vormarsch des Feindes verlangsamt."
 ABDA_develop_naval_infrastructure: "Marineinfrastruktur aufbauen"
 ABDA_develop_naval_infrastructure_desc: "Für nachhaltige Marineeinsätze im Pazifik sind Stützpunkte, Treibstoffdepots und Reparaturmöglichkeiten erforderlich. Indem wir in die Infrastruktur unserer Häfen und Ankerplätze investieren, steigern wir die Reichweite und Durchhaltefähigkeit der ABDA-Kriegsflotte deutlich."
 # Tier 3
 ABDA_unified_naval_command: "Einheitliches Flottenkommando"
 ABDA_unified_naval_command_desc: "Da der Aufbau von Landverteidigungsanlagen und Infrastruktur beendet ist, kann die ABDA nun die gesamte Kriegsflotte unter einem einheitlichen Kommando vereinen. Standardisierte Signale, der Austausch von Geheimdienstinformationen und koordinierte Patrouillenrouten vervielfachen die Schlagkraft jedes einzelnen Schiffes im Einsatzgebiet."
 # Tier 4
 ABDA_ship_a_day_sinking_quotas: "Ein-Schiff-pro-Tag-Versenkungsquote"
 ABDA_ship_a_day_sinking_quotas_desc: "Die sich über den gesamten Pazifik erstreckenden Versorgungslinien des Feindes sind dessen strategische Schwachstelle. Durch die Festlegung ehrgeiziger Versenkungsquoten für unsere U-Boot- und Überwasserstreitkräfte kann das ABDACOM den Feind logistisch ausbluten lassen und ihn in die Defensive drängen."
 ABDA_naval_procurement: "Marinebeschaffungen"
 ABDA_naval_procurement_desc: "Die erlittenen Verluste müssen dringend ersetzt werden. Ein koordiniertes Beschaffungsprogramm der ABDACOM legt den Schwerpunkt auf Zerstörer, U-Boote und Patrouillenschiffe, da diese für den Pazifikraum am besten geeignet sind. Dies stellt sicher, dass sich unsere Flotte der Expansion des Feindes entgegenstellen kann."
 ABDA_keep_trade_open: "Offener Handel"
 ABDA_keep_trade_open_desc: "Das Kautschuk und das Öl, die man in [INS.GetNonIdeologyName] gewinnt, sind für den Kriegsbeitrag unerlässlich. Die ABDACOM muss die Seewege sichern, über die diese lebenswichtigen Ressourcen transportiert werden, Konvois vor feindlichen Angriffen schützen und den Warenfluss zu unseren Industrien aufrechterhalten."
 # Tier 5 - capstone
 ABDA_expand_the_command: "Kommandostrukturen erweitern"
 ABDA_expand_the_command_desc: "Die ABDACOM hat bewiesen, wie wertvoll sie für den Schutz von Südostasien ist. Wir müssen auf diesem Fundament aufbauen, die Mitgliedschaft auf andere verbündete Staaten in der Region ausweiten und unseren Austausch in den Bereichen Forschung und Nachrichtendienst vertiefen, um dem Feind immer einen Schritt voraus zu sein."
 # Tooltips
 ABDA_basic_available_trigger_tt: "Befindet sich nicht im Krieg mit einem Mitglied der ABDACOM"
 ABDA_spirit_tooltip: "Modifiziert §YABDA-Oberkommando§! um:"
 abdacom_member: "Mitglied der ABDACOM"
 ABDA_malay_barrier_modifier_tt: "Modifiziert §Y$ABDA_supreme_command$§! um:\n §G+15%§! Reparaturgeschwindigkeit\n §G+10%§! Konvoieskorte-Effizienz"
 ABDA_ship_a_day_modifier_tt: "Modifiziert §Y$ABDA_supreme_command$§! um:\n §G+10%§! U-Boot-Angriff\n §G+10%§! U-Boot-Verteidigung"
 ABDA_keep_trade_open_modifier_tt: "Modifiziert §Y$ABDA_supreme_command$§! um:\n §G+10%§! Schutzeffizienz\n §G+10%§! Geleitschiffverteidigung"
 ABDA_unified_naval_command_modifier_tt: "Modifiziert §Y$ABDA_supreme_command$§! um:\n §G+10%§! Erfahrung (Schiffe)"
 ABDA_develop_naval_infrastructure_ast_tt: "[AST.GetNameDefCap] erhält §Y2 Werften§! in einem Kernterritorium."
 ABDA_develop_naval_infrastructure_ins_tt: "[INS.GetNameDefCap] erhält §Y2 Werften§! in einem Kernterritorium."
 ABDA_develop_naval_infrastructure_generic_tt: "Abhängig von der Mitgliedschaft in der §YABDACOM§! erhalten [AST.GetNameDef] und [INS.GetNameDef] 2 Werften in Kernterritorium."
 ABDA_expand_the_command_tt: "Erweitert die ABDACOM-Mitgliedschaft auf [SIA.GetName], [NZL.GetName] und [MAL.GetName], wenn sich diese in unserem Bündnis befinden. Dies gibt ihnen auch alle Vorteile des Modifikators §Y$ABDA_supreme_command$§! mit der derzeitigen Stärke"
 ABDA_naval_procurement_ins_ships_tt: "[INS.GetNameDefCap] erhält §Y6 Zerstörer der Clemson-Klasse§! von den [USA.GetAdjective]en stillgelegten Flotten."
 ABDA_naval_procurement_hol_ships_tt: "[HOL.GetNameDefCap] erhält §Y6 Zerstörer der Clemson-Klasse§! von den [USA.GetAdjective]en stillgelegten Flotten."
 ABDA_naval_procurement_ast_ships_tt: "[AST.GetNameDefCap] erhält §Y6 Zerstörer der Clemson-Klasse§! von den [USA.GetAdjective]en stillgelegten Flotten."
 ABDA_naval_procurement_generic_tt: "Abhängig von der Mitgliedschaft in der §YABDACOM§! erhalten [INS.GetNameDef], [HOL.GetNameDef] und [AST.GetNameDef] §Y6 Zerstörer der Clemson-Klasse§! von den [USA.GetAdjective]en stillgelegten Flotten."
