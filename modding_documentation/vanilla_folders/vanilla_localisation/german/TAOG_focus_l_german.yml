 SIA_a_land_war_in_asia: "Landkrieg in Asien"
 idea_SIA_land_war_in_asia: "Landkrieg in Asien"
 # Alternative Communist Focus
 SIA_the_peoples_war_in_asia: "Krieg des Volkes in Asien"
 SIA_the_peoples_war_in_asia_desc: "Der Kampf gegen den [JAP.GetAdjective]en Imperialismus ist nicht bloß ein Konflikt zwischen Staaten. Es ist ein Krieg der Arbeiter, Bauern und Soldaten gegen die Fremdherrschaft. Indem sich [ROOT.GetNameDef] auf die Seite der kommunistischen Kräfte in China stellt, verpflichten wir uns zu einem umfassenden Krieg des Volkes in ganz Asien."
 SIA_peoples_war_in_asia_idea: "Krieg des Volkes in Asien"
 SIA_peoples_war_in_asia_idea_desc: "Ein Krieg wird nicht nur durch reguläre Truppen geführt. Lokale Komitees, Partisanenführer und Bauernkolonnen unterstützen die Armee auf dem Schlachtfeld. Jedes Dorf ist ein Depot, jede Straße ein möglicher Hinterhalt und jeder Rückzug eine Gelegenheit, den Feind tiefer ins Landesinnere zu locken."
 # Alternative Nationalist Focus
 SIA_national_defense_in_asia: "Nationale Verteidigung Asiens"
 SIA_national_defense_in_asia_desc: "Für die Verteidigung Asiens bedarf es Disziplin, einer geordneten Hierarchie und eines gemeinsamen strategischen Ziels. Indem wir uns mit der nationalistischen Regierung Chinas zusammentun, tritt [ROOT.GetNameDef] einer Koalition bei, die imstande ist, sich der [JAP.GetAdjective]en Expansion durch organisierte Truppen und eine koordinierte Führung zu widersetzen."
 SIA_national_defense_in_asia_tt: "§Y[ROOT.GetNameWithFlag]§! schließt sich den nationalistischen Truppen in der Einheitsfront an.\nFügt §Y$SIA_national_defense_in_asia_idea$§! hinzu, was folgende Auswirkungen hat:\n $MODIFIER_ARMY_ORG_FACTOR$: §G+5%§!\n $MODIFIER_PLANNING_SPEED$: §G+10%§!\n $MODIFIER_MAX_PLANNING$: §G+10%§!\n $MODIFIERS_ARMY_DEFENCE_FACTOR$: §G+5%§!"
 SIA_stronger_together: "Gemeinsam stärker"
 SIA_stronger_together_desc: "Der Krieg machte ferne Versprechen und parallele Bündnisse zu kaum mehr als Hindernissen. Wenn [ROOT.GetNameDef] den zukünftigen Kurs Asiens bestimmen will, müssen wir unsere Partner bitten, sich unserem Bündnis anzuschließen und im bevorstehenden Kampf eine einheitliche Führung anzuerkennen."
 idea_SIA_national_defense_in_asia: "Nationale Verteidigung Asiens"
 SIA_directorate_of_aeronautical_engineering_desc: "Die Zukunft der [ROOT.GetAdjective]en Luftfahrt liegt nicht allein in gut ausgebildeten Piloten. Man braucht auch Ingenieure, Inspektoren, Werkstätten und eine zentrale Behörde, um die von unseren Handelspartnern erworbene Flugzeuge in einsatzfähige Maschinen zu verwandeln. Die Direktion für Luftfahrttechnik bildet die Grundlage für diese Bemühungen."
 idea_SIA_aeronautical_engineering_directorate: "Direktion für Luftfahrttechnik"
 SIA_standardize_aircraft_maintenance: "Flugzeugwartung standardisieren"
 SIA_standardize_aircraft_maintenance_desc: "Wir beziehen unsere Flugzeuge aus verschiedensten Quellen, was dazu führt, dass wir für jedes von ihnen andere Ersatzteile, Werkzeuge und Reparaturabläufe benötigen. Indem wir Standards einführen, kann [ROOT.GetNameDef] mehr Flugzeuge gleichzeitig in der Luft halten und Ausfälle durch ineffiziente Arbeitsabläufe am Boden verringern."
 SIA_expand_aircraft_workshops: "Flugzeugfabriken ausbauen"
 SIA_expand_aircraft_workshops_desc: "Die Direktion braucht mehr als nur Büroräume und Inspektionsunterlagen. Dank neuer Fabrikhallen, Maschinen und geschulter Mechaniker können beschädigte Flugzeuge im Inland repariert und einfache Bauteile selbst hergestellt werden, ohne auf Lieferungen von unseren Handelspartnern warten zu müssen."
 SIA_license_modern_airframes: "Moderne Flugzeugzellen lizensieren"
 SIA_license_modern_airframes_desc: "[ROOT.GetNameDefCap] verfügt nicht über die nötigen Mittel, jedes Flugzeug selbst zu entwerfen. Es wäre daher ratsam, Lizenzen bei anderen Nationen zu erwerben, ihre Bauweise zu untersuchen und sie unter Aufsicht der Direktion an unsere Gegebenheiten, Flugplätze und unseren Bedarf anzupassen."
 SIA_tropical_air_operations: "Flugeinsätze in den Tropen"
 SIA_tropical_air_operations_desc: "Hitze, Feuchtigkeit, monsunartige Regenfälle und schwierige Einsatzbedingungen stellen besondere Anforderungen an Flugzeuge und deren Besatzungen. Durch die Anpassung von Triebwerken, Wartungsplänen und Einsatzrichtlinien erhöht die Direktion die Zuverlässigkeit unserer Luftwaffe in Südostasien."
 ##########
 #### AUSTRALIA ####
 ###################
 effects_of_event_tt: "\n§YAuswirkungen des Ereignisses§!:"
 AST_war_is_coming: "Es droht Krieg"
 AST_war_is_coming_desc: "In den letzten drei Jahrzehnten standen wir unzähligen Herausforderungen gegenüber, und eine weitere scheint sich anzubahnen, die die Standhaftigkeit der australischen Demokratie ein für alle Mal auf die Probe stellen wird. Der ehemalige Premierminister Billy Hughes äußert sich sehr deutlich zu diesem Thema, und es wäre unverantwortlich von uns, seine Behauptungen zu ignorieren. Ob es uns gefällt oder nicht: Ein Krieg steht bevor."
 AST_war_is_coming_tt: "\nSchaltet §Ydemokratische Wahlen§! frei"
 AST_war_is_coming_uap_advisors_tt: "(§Y$AST_billy_hughes$§!):"
 AST_war_is_coming_alp_advisors_tt: "(§Y$AST_james_scullin$§!):"
 AST_war_is_coming_decrease_advisors_tt: "(§Y$AST_maurice_blackburn$§!):"
 AST_war_is_coming_advisors_tt: "\nModifiziert politische Berater:"
 AST_advance_pacific_initiatives: "Die Pazifik-Initiative fortführen"
 AST_advance_pacific_initiatives_desc: "Dank der von uns geschlossenen Nichtangriffspakte verbesserten sich unsere Beziehungen zu unseren asiatischen Nachbarn stark. Wir müssen diese Beziehungen weiter ausbauen und unsere neuen Verbündeten bitten, unsere industrielle Entwicklung zu unterstützen."
 AST_advance_pacific_initiatives_tt: "\nSchließt einen Nichtangriffspakt mit:"
 AST_advance_pacific_initiatives_jap_tt: " §Y[JAP.GetName]§!, um §G2§! §YWerften§! außerhalb der Karte zu den Effekten hinzuzufügen."
 AST_advance_pacific_initiatives_ins_tt: " §Y[INS.GetName]§!, um §G1§! §YSynthetische Raffinerie§! außerhalb der Karte zu den Effekten hinzuzufügen."
 AST_advance_pacific_initiatives_chi_tt: " §Y[CHI.GetName]§!, um §G2§! §YZivilfabriken§! außerhalb der Karte zu den Effekten hinzuzufügen."
 AST_advance_pacific_initiatives_jap_2_tt: "§Y[JAP.GetName]§! gibt:"
 AST_advance_pacific_initiatives_ins_2_tt: "§Y[INS.GetName]§! gibt:"
 AST_advance_pacific_initiatives_chi_2_tt: "§Y[CHI.GetName]§! gibt:"
 AST_advance_pacific_initiatives_2_tt: "\nDie Gebäude werden entfernt, wenn wir uns im Krieg mit der Nation befinden."
 AST_pacific_initiatives_modifier: "Diplomatische Initivative"
 AST_domestic_industry: "Inländische Industrie"
 AST_domestic_industry_desc: "Wir können uns nicht darauf verlassen, dass uns die Rüstungsindustrie unserer Verbündeten auch in Kriegszeiten versorgt. Wir müssen unsere eigene Industrie ausbauen, damit wir auf alles vorbereitet sind, was da kommen mag."
 AST_a_democratic_bulwark: "Bollwerk der Demokratie"
 AST_a_democratic_bulwark_desc: "Um faschistischen und kommunistischen Bedrohungen etwas entgegensetzen, muss die Demokratie eine Vorreiterrolle in unserer Gesellschaft übernehmen. Wir müssen eine proaktive Politik betreiben und sicherstellen, dass unsere Bevölkerung in unserem neuen Regierungsapparat vertreten ist und sich unzufriedene Politiker verschiedenen demokratischen Parteien anschließen, statt sich in anderen Ideologien zu radikalisieren."
 AST_the_pacific_pact: "Der Pazifikpakt"
 AST_the_pacific_pact_desc: "Lyons' Pazifik-Initiative stellte 1934 den Kontakt zwischen Australien und wichtigen asiatischen Nationen her, wodurch wir nicht länger auf Großbritannien angewiesen waren, um unsere Interessen zu vertreten. Wenn wir eben diese Beziehungen nun dafür nutzen könnten, dass andere asiatische Mächte Australien nicht angreifen, hätte unsere Diplomatie Früchte getragen. Das mag ein anspruchsvolles Unterfangen sein, aber es lohnt sich."
 AST_a_collapsing_league_of_nations: "Zusammenbruch des Völkerbunds"
 AST_a_collapsing_league_of_nations_desc: "Der Völkerbund, eine gut gemeinte Initiative, die leider auf unrealistischen Hoffnungen beruhte, ist dabei, zusammenzufallen. Eine Sanktionspolitik wird nur zu leicht zu einer Politik leerer Gesten und dies umso mehr, wenn es keine Truppen gibt, um widerspenstige Nationen in Schach zu halten. Unsere Wiederaufrüstung muss beginnen."
 AST_department_of_munitions: "Rüstungsministerium"
 AST_department_of_munitions_desc: "Damit unsere Soldaten an der Front stets über die nötige Bewaffnung verfügen, muss die Munitionsproduktion beschleunigt werden. Durch die Einrichtung eines Ministeriums für Munition stellen wir sicher, dass die Produktion von Verteidigungsmitteln stets im Vordergrund steht."
 AST_call_for_a_referendum: "Referendum fordern"
 AST_call_for_a_referendum_desc: "Wir möchten die Kontrolle der Regierung verstärken, benötigen jedoch zunächst die Zustimmung der Wähler. Durch die Einberufung eines Referendums holen wir uns die nötige Zustimmung ein."
 AST_rural_concessions: "Zugeständnisse für die Landespartei"
 AST_rural_concessions_desc: "Die Vertreter der Landespartei erhalten viel zu wenige Stimmen, um jemals allein zu regieren. Wenn wir jedoch ihren Einfluss auf die australische Politik begrüßen, könnten wir als derzeitige Regierungspartei zusätzliche Unterstützung gewinnen."
 AST_rural_concessions_tt: "\nDer §Y$AST_country_party_influence_uap$§! erhöht die Wählerstimmen für die Partei, die bei Abschluss des Schwerpunkts an der Macht ist."
 AST_solidarity_by_the_empire: "Solidarität mit dem Empire"
 AST_solidarity_by_the_empire_desc: "Bis zu diesem Zeitpunkt führte uns das Britische Empire durch Krieg wie Frieden. Wir sollten seinen Rat auch weiterhin in Anspruch nehmen und bei der Vorbereitung auf mögliche Konflikte zusammenarbeiten."
 AST_solidarity_by_the_empire_modifier: "Solidarität mit dem Empire"
 AST_wool_agreement: "Wollabkommen"
 AST_wool_agreement_desc: "Wolle gehört zu den wichtigsten Handelsgütern Australiens, und ihr Export spült nicht nur reichlich Geld in unsere Kassen, sondern verbessert auch die Beziehungen zu den Importländern. Großbritannien verlangt jedoch die gesamte Menge unserer Wollproduktion von uns, um seine Soldaten mit Uniformen auszustatten und sie in Verhandlungen mit Ländern einzusetzen, die selbst nicht über ausreichende Wollvorräte verfügen. Wir müssen uns den Forderungen Großbritanniens beugen."
 AST_australian_war_cabinet: "Australisches Kriegskabinett"
 AST_australian_war_cabinet_desc: "Auf Ersuchen des Vereinigten Königreichs müssen wir unser eigenes Kriegskabinett einrichten. Dies wird eine effektive und strategische Entscheidungsfindung gewährleisten und es uns erlauben, uns ausschließlich auf die nationale Sicherheit zu konzentrieren."
 AST_singapore_strategy: "Singapur-Strategie"
 AST_singapore_strategy_desc: "Die Singapur-Strategie ist ein zentraler Bestandteil der australischen Verteidigungspolitik und Singapur selbst als Stützpunkt für die im Pazifik stationierten Schiffe der Royal Navy unerlässlich. Wir müssen die Briten davon überzeugen, zusätzliche Verteidigungsanlagen zu errichten, während wir selbst die Fähigkeiten der australischen Marine ausbauen."
 AST_singapore_strategy_tt: "Nach §Y180§! Tagen (§YSingapur§!):\n Erhält §G2§! §YLuftstützpunkte§!.\n Erhält §G2§! §YMarinestützpunkte§!.\n Erhält §G1§! §YKüstenbefestigung§!."
 AST_british_war_cabinet: "Britisches Kriegskabinett"
 AST_british_war_cabinet_desc: "Es ist Krieg ausgebrochen, und das Vereinigte Königreich bildete ein Kriegskabinett, um die Kriegsbemühungen der Alliierten zu koordinieren. Es forderte uns auf, ebenfalls unsere Meinung zu äußern, und so bricht der Premierminister auf, um die Interessen Australiens zu vertreten."
 potential_consequence_tt: "§YMögliche Folgen§!:\n"
 AST_british_pacific_fleet: "Britische Pazifikflotte"
 AST_british_pacific_fleet_desc: "Es ist von entscheidender Bedeutung für uns, dass die britische Flotte im Pazifik präsent ist, um feindliche Schiffe abzuschrecken und abzuwehren. Als Teil des Bündnisses „[Root.GetFactionName]“ ergreifen wir Maßnahmen zur Einrichtung einer gemeinsamen Kommandostruktur, um unsere Küstengewässer zu schützen."
 AST_all_dressed_up: "Volle Montur"
 AST_all_dressed_up_desc: "Wenn australische Soldaten in britischen Kriegen kämpfen, sollen sie von britischen Fabriken ausgerüstet werden."
 AST_overseas_loyalties: "Loyale Kontakte in Übersee"
 AST_overseas_loyalties_desc: "Wir werden weiterhin unseren Beitrag zu Kriegen in Übersee leisten und erneut beweisen, dass auf die australischen Soldaten Verlass ist. Kriege passieren nicht einfach – wir machen sie möglich."
 AST_the_ultimate_overseas_duty: "Ultimativer Auslandseinsatz"
 AST_the_ultimate_overseas_duty_desc: "Der britische Premierminister vernachlässigte seine Aufgaben derart, dass die anderen Minister jegliches Vertrauen in seine Führung verloren haben. Menzies hinterließ bei seinen Besuchen im britischen Kriegskabinett einen äußerst starken Eindruck, und manche sind der Ansicht, er könnte für Großbritannien die bessere Option sein. Sollte er die Zügel des Commonwealth übernehmen, können wir die Loyalität von Menzies gegenüber [AST.GetName] nutzen, um Einfluss zu erhalten."
 AST_the_ultimate_overseas_duty_tt: "\nWenn §Y$AST_robert_menzies$§! die Führung über die §Y[ENG.GetAdjective]e§! Regierung übernimmt, können wir mit dem Schwerpunkt §Y$AST_a_change_of_authority$§! ein §Y$autonomy_associated_dominion$§! werden."
 AST_pleading_britain: "Großbritannien um Hilfe bitten"
 AST_pleading_britain_desc: "Der Krieg wird mit Sicherheit auch an unsere Tür klopfen, und wir zittern vor Angst. Bei allem gebührenden Respekt vor unserem Anzac-Geist und dem Ruf als Goldschürfer werden die Kriegskapazitäten ohne die Hilfe von [ENG.GetName] nur allzu schnell erschöpft sein. Der Premierminister muss [ENG.GetLeader] baldmöglichst ein Telegramm zukommen lassen."
 AST_bound_once_more: "Das Band erneuern"
 AST_bound_once_more_desc: "Unsere Wege mögen auseinandergelaufen sein, doch nun werden sie wieder zusammengeführt. Sowohl [ENG.GetNameDef] als auch [AST.GetNameDef] durchlaufen derzeit einen nationalen Wandel, und die Distanz, die dadurch entstand, ist lediglich ein unbeabsichtigter Nebeneffekt, zumindest von unserer Seite aus. Wir müssen unser Band erneuern und jene Hindernisse, die durch diesen Wandel entstanden, gemeinsam überwinden."
 AST_eng_to_ast_faction_tt: "§Y[ENG.GetNameDef]§! und alle [ENG.GetAdjective]en Untertanen treten dem Bündnis §Y[AST.GetFactionName]§! bei."
 AST_faction_leader_tt: "Wird der Anführer des Bündnisses §Y[AST.GetFactionName]§!"
 AST_eng_as_faction_leader_tt: "\n([ENG.GetFlag]§Y[ENG.GetName]§!): $AST_faction_leader_tt$."
 AST_australian_command: "Australisches Kommando"
 AST_australian_command_desc: "Da selbst [ENG.GetName] bewusst wurde, wie wichtig es ist, für die Sicherheit Australiens zu sorgen, schlug man vor, unsere gemeinsamen Streitkräfte umzustrukturieren. Wenn mehr britische Truppen unter australischem Kommando stehen, können wir viel leichter einen Kriegsbeitrag leisten."
 AST_taking_the_helm: "Das Ruder übernehmen"
 AST_taking_the_helm_desc: "Da unser Einfluss in Südostasien immer weiter wächst, brauchen wir eine starke Marine, um diesen Einfluss zu verteidigen. Wir treiben den weiteren Ausbau der Royal Australian Navy voran und behaupten unsere Kontrolle über die östlichen Meere."
 AST_eastern_focus: "Östlicher Schwerpunkt"
 AST_eastern_focus_desc: "Wenn britische Kriege australische Kriege sind, dann sind australische Kriege auch britische Kriege. Eine japanische Invasion steht seit Langem unbestreitbar bevor und wir werden die derzeitige Passivität nicht länger akzeptieren. Wir müssen Japan zeigen, was australische Entschlossenheit bedeutet, während uns Großbritannien mit der kühnsten Erklärung überhaupt seine Loyalität beweisen kann: einer Kriegserklärung."
 AST_eastern_focus_tt: "\nDiese Mission erlaubt es §Y[ENG.GetName]§!, §Y[JAP.GetName]§! unmittelbar den Krieg zu erklären, und wird es dazu zwingen, falls es dies nicht innerhalb von 180 Tagen selbst tut. §Y[ENG.GetNameDefCap]§! kann den Abschluss der Mission durch die Finanzierung australischer Verteidigungsprojekte herauszögern."
 AST_holding_the_battlefield: "Das Schlachtfeld halten"
 AST_holding_the_battlefield_desc: "Viele australische Soldaten sind in Übersee gefallen, nur damit man ihre Leistungen als britische Erfolge wertete. Australien muss mehr Einfluss am Verhandlungstisch neben [ENG.GetName] bei Friedenskonferenzen fordern oder sich andernfalls aus den Kriegen dieser Nation heraushalten."
 AST_holding_the_battlefield_tt: "§YVerringert die Kosten§! für die Diplomatieaktion §YZur Marionette machen§! und §YStaat übernehmen§! bei Friedenskonferenzen mit §Y[ENG.GetName]§!."
 AST_a_change_of_authority: "Autoritätswechsel"
 AST_a_change_of_authority_desc: "Australien entwickelte sich von einem unterwürfigen Untertan zu einer angesehenen und selbstbewussten Nation, und alles, was noch bleibt, ist, unseren Platz unter den Weltmächten einzunehmen. Als Anführer des Bündnisses [AST.GetFactionName] werden wir von Freunden respektiert und von Feinden gefürchtet. Wir werden uns eingraben und die Stellung halten und dafür sorgen, dass Australien standhaft bleibt."
 AST_a_change_of_authority_tt: " §Y[ROOT.GetNameDefCap]§! kann jetzt Kriege erklären.\n §Y[ROOT.GetNameDefCap]§! kann jetzt einen Waffenruf ablehnen\n §Y[ROOT.GetNameDefCap]§! überträgt nicht länger Friedenspunkte an den Suzerän."
 AST_reinforcements: "Verstärkung"
 AST_reinforcements_desc: "Wir müssen die weitgehend unterentwickelten nördlichen Territorien mit Verteidigungsanlagen und Luftwaffenstützpunkten aufrüsten."
 AST_weekly_stability_tt: " Wöchentliche Stabilität: §G+1.00%§!"
 AST_ending_overseas_conscription: "Auslandseinsätze beenden"
 AST_ending_overseas_conscription_desc: "Unsere Soldaten müssen sich unverzüglich von den fremden Küsten zurückziehen. Wir brauchen sie hier!"
 AST_unlocking_conscription_1903_tt: "Wird benötigt, um §YWehrpflichtgesetze§! freizuschalten."
 AST_unlocking_further_conscription_tt: "Für §YUmfangreiche Wehrpflicht§! oder §YNach Bedarf§! müssen zusätzlich folgende Schwerpunkte abgeschlossen sein: §Y$AST_british_pact$§! (Faschistisch), §Y$AST_refuse_british_wars$§! (Faschistisch), §Y$AST_toe_the_line$§! (Faschistisch), §Y$AST_from_picket_line_to_front_line$§! (Kommunistisch) oder §Y$AST_part_with_colonizer$§! (Kommunistisch)."
 AST_unlocking_conscription_tt: "Mit §Y$AST_invoke_the_1903_defence_act$§! werden alle übrigen §YWehrpflichtgesetze§! freigeschaltet."
 AST_an_uncle_for_father_figure: "Ein Onkel als Vaterfigur"
 AST_an_uncle_for_father_figure_desc: "Da uns moderne Waffen fehlen, müssen wir die [USA.GetAdjective]e Regierung um Lieferungen bitten."
 AST_seven_million_britishers: "Sieben Millionen Briten"
 AST_seven_million_britishers_desc: "Obwohl [ENG.GetLeader] uns nichts versprechen konnte, vertrauen wir darauf, dass er und Großbritannien sich für [AST.GetName] einsetzen werden, wenn es darauf ankommt. Schließlich sind wir sieben Millionen Briten."
 AST_seven_million_britishers_reinforcements_tt: "\n§YWenn „$AST_reinforcements$“ NICHT abgeschlossen wurde§!:"
 AST_seven_million_britishers_conscription_tt: "\n§YWenn „$AST_ending_overseas_conscription$“ NICHT abgeschlossen wurde§!:"
 AST_seven_million_britishers_uncle_tt: "\n§YWenn „$AST_an_uncle_for_father_figure$“ NICHT abgeschlossen wurde§!:"
 AST_we_endured: "Wir hielten durch"
 AST_we_endured_desc: "Zu wissen, dass uns ein Krieg bevorstehen könnte, mag zunächst überwältigend gewesen sein, doch wir nutzten diese Tatsache, um in aller Schnelle unsere Verteidigungsanlagen auszubauen. Wir hielten durch und wir werden weiter bestehen und uns dem ultimativen Ziel verpflichten: den Krieg zu gewinnen."
 AST_under_the_rule_of_canberra: "Unter der Herrschaft von Canberra"
 AST_under_the_rule_of_canberra_desc: "Die zunehmenden Spannungen zwischen den Pazifikstaaten sind besorgniserregend. Da Großbritannien eigene Konflikte auszutragen hat, scheint es unwahrscheinlich, dass man uns zu Hilfe kommen kann. Indem wir das Britische Commonwealth so umgestalten, dass sich die Staaten des Pazifiks und des Indischen Ozeans direkt von Canberra aus verwalten, könnten wir uns vielleicht als gemeinsame Front vereinen – auch ohne [ENG.GetName]."
 AST_its_fight_work_or_perish: "Kämpfen, arbeiten oder untergehen"
 AST_its_fight_work_or_perish_desc: "Wir befinden uns im Krieg, und nur eines bleibt: zu beweisen, dass wir dafür bereit sind."
 AST_no_foreign_battlefields: "Keine fremden Schlachtfelder"
 AST_no_foreign_battlefields_desc: "Es dauerte lange, aber endlich erklärte die Regierung, dass kein Bürger zum Dienst auf fremden Schlachtfeldern gezwungen werden darf."
 AST_no_foreign_battlefields_modifier: "Keine fremden Schlachtfelder"
 AST_platypus_modifier: "Geschenktes Schnabeltier"
 AST_aerial_defense: "Gegen Angriffe aus der Luft verteidigen"
 AST_aerial_defense_desc: "Wir können uns eine Marine, die der einer Weltmacht ebenbürtig ist, nicht leisten, doch es besteht zumindest die Möglichkeit, eine Luftflotte zu unterhalten, die jeder anderen, die man gegen uns einsetzen könnte, ebenbürtig ist."
 AST_ratify_westminster_adoption_act: "Den Westminster Adoption Act ratifizieren"
 AST_ratify_westminster_adoption_act_desc: "Ungeachtet der Kontroversen, die eine Änderung der langjährigen Politlinie auslösen könnte, ist es längst überfällig, dass wir den Westminster Adoption Act ratifizieren. Wir müssen selbst entscheiden können, welche Kriege wir führen wollen."
 AST_ratify_westminster_adoption_act_tt: "£GFX_trigger_no Kann Kriegsbeitritt ablehnen"
 AST_administer_the_mandate: "Das Mandat verwalten"
 AST_administer_the_mandate_desc: "Da Neuguinea seit 1920 unter einem Mandat des Völkerbundes regiert wurde und Papua fast seit der Gründung der Föderation ein Außengebiet von [AST.GetName] war, wäre der östliche Teil Papua-Neuguineas eine natürliche Ergänzung für die [AST.GetAdjective]en Kerngebiete. Durch die Auflösung des Völkerbunds bietet sich die Möglichkeit für eine derartige föderale Neuordnung."
 AST_a_rational_request: "Eine vernünftige Forderung"
 AST_a_rational_request_desc: "Die Singapur-Strategie ist theoretisch haltbar, aber eben nur theoretisch. Henry Wynter und andere kritische Stimmen hatten die ganze Zeit recht: Großbritannien wird höchstwahrscheinlich auf seinem eigenen Kontinent beschäftigt sein, falls ein Pazifikkrieg ausbricht, und eine Strategie, die auf britischer Hilfe basiert, wird daher nicht funktionieren. Wir müssen die Kontrolle über Singapur fordern, damit wir uns selbst um die Verteidigung unserer Meere kümmern können."
 add_trait_to_theorist_tt: "Fügt der Eigenschaft §YTheoretiker§! Folgendes hinzu:"
 AST_volunteers: "Freiwillige"
 AST_volunteers_desc: "Entscheidend ist, dass man die Wahl hat. Einen Waffenruf abzulehnen, bedeutet nicht, dass Australien dies immer tun wird. Die Australier haben jedes Recht, für das Richtige zu kämpfen, sowohl auf ihrem eigenen als auch auf fremdem Boden."
 AST_until_the_tide_of_battle_swings: "Bis sich das Blatt wendet"
 AST_until_the_tide_of_battle_swings_desc: "Wir müssen eine öffentliche Erklärung abgeben und allen klarmachen, dass wir die Bedrohung in unserer Nachbarschaft nicht länger ignorieren können. Wir lehnen es entschieden ab, eine Politik zu akzeptieren, die den Konflikt im Pazifik nur als untergeordneten Teil des größeren Krieges betrachtet. Australien muss sich unverzüglich auf eine Invasion vorbereiten."
 AST_walls_and_whispers: "Starke Wälle und Gewisper"
 AST_walls_and_whispers_desc: "Unüberwindbare Wälle in Verbindung mit einem guten Gespür für die derzeitige Lage sind eine Notwendigkeit, um die nationale Sicherheit zu wahren. Wir sollen Maßnahmen ergreifen, um die Land- und Küstenverteidigung in unserem gesamten Staatsgebiet zu verbessern, und eine Geheimdienstzentrale einrichten."
 AST_united_states_as_our_keystone: "Die Vereinigten Staaten als Grundpfeiler"
 AST_united_states_as_our_keystone_desc: "Wir kennen die Probleme, mit denen das Vereinigte Königreich konfrontiert ist. Wir wissen um die Gefahren einer Dezentralisierung der Macht, und wir wissen auch, dass Australien gehen kann und Großbritannien dennoch standhalten wird. Wir sind entschlossen, Australien nicht aufzugeben, und werden all unsere Energie darauf verwenden, einen Plan auszuarbeiten, der vorrangig auf den Vereinigten Staaten basiert."
 AST_liberty_loans: "Kriegsanleihen"
 AST_liberty_loans_desc: "Aufgrund seiner Erfahrung als Finanzminister – manche würden behaupten, er ist der beste, den das Land je hatte – bewies Ben Chifley, die Wirtschaft auch in Zeites eines Krieges verwalten zu können. Auf seine Empfehlung hin werden wir das Volk dazu ermutigen, überschüssiges persönliches Einkommen zu sparen und in Kriegsanleihen zu investieren."
 AST_inevitably_independent: "Unvermeidliche Unabhängigkeit"
 AST_inevitably_independent_desc: "Obwohl die United Australia Party die britische Staatsbürgerschaft stets schätzte, zwang uns die britische Gleichgültigkeit dazu, die Unabhängigkeit zu erklären und unserer eigenen Verteidigung Vorrang einzuräumen. Da wir nicht länger in britischen Kriegen im Ausland kämpfen müssen, neigen sogar antiloyalistische Bewegungen eher dazu, einer umfassenderen Wehrpflicht zuzustimmen."
 AST_bring_on_the_giant: "Mit dem Riesen anlegen"
 AST_bring_on_the_giant_desc: "Als geeinte und unabhängige Nation werden wir sicher schon bald auf die Probe gestellt werden. Die andere Seite des Pazifiks teilt unsere Interessen, und [USA.GetNameDef] verfügt über eine gut ausgebaute Militärindustrie und könnte sowohl sich selbst versorgen als auch Australien einen großen Dienst erweisen und einen Teil der Vorräte an unsere Truppen vermieten."
 AST_bring_on_the_giant_tt: "  Wenn §Y[USA.GetNameDef]§! zustimmt:\n Fügt dem Lager §Y+50§! §YKonvois§! hinzu."
 AST_allied_after_all: "Letztlich doch verbündet"
 AST_allied_after_all_desc: "Obwohl die Unabhängigkeit Australiens eine Notwendigkeit war, werden wir auch weiterhin mit unseren ehemaligen Herren zusammenarbeiten. Wir werden das Bündnis „[ENG.GetFactionName]“ auch in Zukunft unterstützen, aber können nun größeren Einfluss nehmen."
 AST_the_pacific_resistance: "Pazifikwiderstand"
 AST_the_pacific_resistance_desc: "Australien hat endlich die Unabhängigkeit erlangt, und es ist an der Zeit, dass wir uns auch von den britischen Kriegsanstrengungen lösen. Indem wir ein [USA.GetAdjective]es Bündnis anstreben, können wir gemeinsame Kommandostrategien entwickeln, die die Interessen Australiens vertreten, während wir gleichzeitig die vollständige Kontrolle über unsere eigene Verteidigungsindustrie und deren Ausbau übernehmen."
 AST_the_pacific_resistance_tt1: "§YAustralien§! tritt dem Bündnis §Y[USA.GetFactionName]§! bei."
 AST_the_pacific_resistance_tt2: "§Y[USA.GetNameDefCap]§! tritt dem §YPazifischen Widerstand§! bei."
 AST_conscription_at_last: "Wehrpflicht eingeführt"
 AST_conscription_at_last_desc: "Die Unabhängigkeit schmeckt nur zu süß, wenn man erkennt, dass man selbst darüber entscheiden kann, der eigenen Verteidigung Vorrang einzuräumen. Doch diese Macht bringt auch große Verantwortung mit sich. Wir sollten die Wehrpflicht nicht leichtfertig ausweiten, aber da wir uns im Krieg befinden, ist genau dies nötig geworden."
 AST_equal_training: "Gleiche Ausbildung"
 AST_equal_training_desc: "Wir müssen die Zusammenarbeit mit unseren Verbündeten verbessern und dürfen sie nicht einfach als selbstverständlich ansehen. Australien muss die Initiative ergreifen, gemeinsame Trainingslager für unser Bündnis „[ROOT.GetFactionName]“ organisieren und sicherstellen, dass alle Soldaten eine gleichermaßen strenge Ausbildung erhalten."
 AST_a_northern_barrier: "Nordbarriere"
 AST_a_northern_barrier_desc: "Der Feind wird aus dem Norden kommen und kleinere, unvorbereitete Nationen angreifen, bevor er schließlich vor unserer Haustür steht. Indem wir uns mit unseren [INS.GetAdjective]en Nachbarn zusammenschließen und eine gemeinsame Front im Norden bilden, haben wir vielleicht eine Chance, ihn aufzuhalten."
 AST_demand_resources: "Ressourcen fordern"
 AST_demand_resources_desc: "Expansionistische Aggressoren haben es auf Indochina abgesehen und das nicht nur wegen des Territoriums, sondern auch wegen der Ressourcen. Sollten diese Reichtümer in die Hände des Feindes fallen, wird dies den Krieg nur verlängern. In unseren Händen hingegen könnten sie dazu beitragen, ihn zu beenden. Wir müssen die Kontrolle über diese Ressourcen fordern, und wenn ihre Besitzer uns die Kooperation verweigern, sind sie nicht besser als der Feind."
 AST_demand_resources_tt: "Schaltet die Entscheidungen §Y$AST_resource_acquisition_cat$§! frei, um einen Teil der Ressourcen von südostasiatischen Nationen zu fordern"
 AST_reclaim_the_lost_territory: "Verlorene Territorien zurückerobern"
 AST_reclaim_the_lost_territory_desc: "Als sich die australischen Kolonien zu einer Föderation vereinten, entschied sich Neuseeland letztlich gegen eine Teilnahme. Seitdem definiert die Verfassung Neuseeland jedoch weiterhin als einen potenziellen Staat des Australischen Commonwealth und lässt dessen Beitritt zu. Wir müssen unseren östlichen Nachbarn klarmachen, dass die aktuelle Weltlage Einheit erfordert."
 AST_reclaim_the_lost_territory_tt: "([NZL.GetFlag]§Y[NZL.GetName]§!) Überträgt alle Land-, Marine- und Lufttruppen an §Y[AST.GetName]§!"
 AST_australia_first: "Australien zuerst"
 AST_australia_first_desc: "Der rechtsextreme Druck der Zentrumspartei war nur von kurzer Dauer und endete mit ihrer Auflösung im Jahr 1935. Eine neue Bewegung gewinnt jedoch immer mehr Unterstützung, die auf den Ideen des Unternehmers und politischen Aktivisten William John Miles basiert. Tun wir allerdings nichts, um diese Stimmung auch richtig zu mobilisieren, könnte sie ebenso schnell wieder abflauen, wie sie entstanden ist. Wir müssen diese Gelegenheit nutzen!"
 AST_pankhurst_walsh: "Adela Pankhurst Walsh"
 AST_pankhurst_walsh_desc: "Bei der offiziellen Gründung des Australia First Movement sollten wir Adela Pankhurst Walsh zur Vorsitzenden wählen. Als Gründerin der Australischen Frauenvereinigung des Empires setzte sich Pankhurst Walsh – unter Aufrechterhaltung enger Verbindungen zur in London ansässigen Frauenvereinigung – für den Wert der britischen Staatsbürgerschaft ein. Dies soll auch zum Kernprinzip unserer Bewegung werden, um die Verbindung zu Großbritannien aufrechtzuerhalten."
 AST_stephensen: "P. R. Stephensen"
 AST_stephensen_desc: "Im Rahmen der offiziellen Gründung des Australia First Movement werden wir P. R. Stephensen zum Vorsitzenden ernennen. Als Berater von William John Miles teilt Stephensen die isolationistischen und nationalistischen Ansichten seines Mentors. Dies wurde zu zwei Kernprinzipien unserer Satzung formuliert, um die Unabhängigkeit von Großbritannien und die Vereinigung der australischen Kultur sicherzustellen."
 AST_stephensen_tt: "\nDie Wahl des Präsidenten des §YAustralien First Movement§! wirkt sich auf mögliche künftige Aktionen aus."
 AST_a_growing_womens_guild: "Eine wachsende Frauenvereinigung"
 AST_a_growing_womens_guild_desc: "Seit der Gründung im Jahr 1928 setzt sich die australische Frauenvereinigung des Empires für die industrielle Zusammenarbeit ein, um wirtschaftlichen Krisen entgegenzuwirken. Zum Wohl der Nation müssen die Bürger ihre Regierung unterstützen und dürfen sich nicht gegen sie stellen. Mit Pankhurst Walsh als Präsidentin von Australia First können wir diese Botschaft weiter verbreiten."
 AST_realize_the_value_of_british_citizenship: "Die britische Staatsbürgerschaft nutzen"
 AST_realize_the_value_of_british_citizenship_desc: "Die [ENG.GetAdjective]e Herrschaft über [AST.GetName] diente unserem Land lange nicht nur als Schild, sondern bot ihm auch Führung. Wir kamen aus Großbritannien, und Großbritannien wird in uns auch weiterhin erhalten bleiben – solange es uns auch weiterhin von Nutzen ist."
 AST_the_bolsheviks_counterforce: "Die Bolschewiken als Gegenkraft"
 AST_the_bolsheviks_counterforce_desc: "Unsere Ermittlungsabteilung führt seit Jahrzehnten Untersuchungen zu den Aktivitäten verfassungsfeindlicher Gruppen durch. Ihre Arbeit zur Bekämpfung linker Bedrohungen sollte nicht vernachlässigt werden, nur weil die Opposition gegen Australia First stattdessen unser Wachstum hemmen will. Wir müssen uns darum bemühen, Schlüsselpositionen innerhalb des australischen Geheimdienstes zu erlangen, und dafür sorgen, dass einer tatsächlichen Bedrohung für die nationale Sicherheit Vorrang eingeräumt wird."
 AST_public_meetings_tt: "Schaltet die Entscheidungen §YAustralia First Movement§! frei, um Mitglieder zu mobilisieren und Unterstützung für den Faschismus zu sammeln."
 AST_rile_up_veterans: "Veteranen anstacheln"
 AST_rile_up_veterans_desc: "Zu Beginn der Weltwirtschaftskrise schlossen sich Veteranen des Ersten Weltkriegs in rechtsextremen paramilitärischen Gruppen zusammen, um dem Aufstieg des Kommunismus entgegenzuwirken. Auch wenn sich diese Gruppen inzwischen auflösten, sind ihre ehemaligen Mitglieder nicht verschwunden. Australia First wird sie aufnehmen und die Fackel des Antikommunismus weitergereicht."
 AST_eureka_stockade_monument_rally: "Am Eureka Stockade-Monument versammeln"
 AST_eureka_stockade_monument_rally_desc: "Im Jahr 1854, während der Schlacht an der Eureka Stockade, kämpften australische Goldgräber erbittert gegen die Kolonialbesetzung, da sie die Kosten für Bergbaulizenzen und die Besteuerung von Goldminen als zu hoch empfanden. Die Unzufriedenheit mit der britischen Kolonialherrschaft war damals wie heute nur zu offensichtlich. Wir müssen uns am Denkmal der Schlacht versammeln und für die Loslösung von Großbritannien demonstrieren."
 AST_australian_pivot_modifier: "Australische Kehrtwende"
 AST_well-being_of_the_community: "Wohlbefinden der Gesellschaft"
 AST_well-being_of_the_community_desc: "Die christlichen Werte in Bezug auf die Familie und darauf, wie man sein Leben führen sollte, sollten von der australischen Bevölkerung eine hohe Wertschätzung erfahren. Angesichts der niedrigen Geburtenraten der letzten Jahre wurden diese Werte nicht ausreichend gefördert. Zum Wohl der Gemeinschaft müssen wir das Familienleben fördern."
 AST_covert_networks: "Geheime Netzwerke"
 AST_covert_networks_desc: "Da Australia First nun auch in der Ermittlungsabteilung tätig ist, streben wir eine grenzüberschreitende Zusammenarbeit mit gleichgesinnten Bewegungen in [ENG.GetName] an. Unser Bündnis mit unseren ehemaligen Kolonialherren könnte uns diesbezüglich helfen, ideologisch gleichgesinnte Verbündete heimlich zu erreichen."
 AST_refuse_british_wars: "Keinen britischen Kriegen beitreten"
 AST_refuse_british_wars_desc: "Die schiere Menge an Australiern, die bei der Schlacht von Gallipoli im Ersten Weltkrieg ihr Leben verloren, zeigt, mit welcher Rücksichtslosigkeit [ENG.GetNameDef] unsere Expeditionsstreitkräfte behandelt, was den Gedanken an einen weiteren Auslandseinsatz völlig undenkbar macht. Die Australier fordern, dass sie unter britischem Kommando nie wieder ihr Blut vergießen müssen, und zwingen die Regierung damit zum Handeln. Das Statut von Westminster muss ratifiziert werden."
 AST_walls_like_uluru: "Mauern wie Uluru"
 AST_walls_like_uluru_desc: "Australien hat einen ganzen Kontinent nur für sich. Wenn wir ohne den Schutz des Empires auskommen wollen, müssen wir unsere Verteidigung ausbauen, die Küstenlinie befestigen, die Häfen sichern und die Seewege zu einer Gefahr für jeden machen, der unser Land für leichte Beute hält."
 AST_at_the_gates: "Vor den Toren"
 AST_at_the_gates_desc: "Die Welt steuert auf einen Krieg zu, und es liegt in unserer Verantwortung, dass Australien darauf vorbereitet ist, indem wir die Produktionsquoten unserer Fabriken und Werften erhöhen. Dies ist keine Vorbereitung auf einen fremden Konflikt, sondern die Vorbereitung auf unser eigenes Überleben."
 AST_the_guild_for_the_war_effort: "Bewegung für den Kriegsbeitrag"
 AST_the_guild_for_the_war_effort_desc: "Die Australian Women's Guild of Empire gründete sich einst, um der Krone zu dienen, doch ihr Zweck wurde völlig neu ausgerichtet. Das riesige Netzwerk, das sie aufbaute, wird seine Energie fortan in die Kriegsindustrie, die Krankenhäuser und die Versorgungsketten eines autarken Australiens lenken."
 AST_for_the_southern_cross: "Für das Kreuz des Südens"
 AST_for_the_southern_cross_desc: "Das Kreuz des Südens weht nicht über Großbritannien. Es weht über uns. Die australische Identität ist etwas Greifbares, das wir mit viel Mühe und Schweiß zum Leben erweckten, und sie ist es wert, verteidigt zu werden. Wir schufen einen neuen Nationalstolz, der nicht von London übernommen oder von fernen Institutionen definiert wurde, sondern hier gewachsen ist, aus diesem Boden, unter diesen Sternen."
 AST_through_the_gates: "Durch die Tore"
 AST_through_the_gates_desc: "Die Vorbereitungszeit ist der Dinglichkeit gewichen. Das nationale Verteidigungsprogramm wurde ausgeweitet und nutzt die gesamten Kapazitäten der australischen Industrie. Neben bestehenden Fabriken errichtet man weitere und korrigiert die Produktionsziele nach oben. Die Grenze zwischen ziviler Produktion und Militärbedarf wird stillschweigend aufgehoben."
 AST_toe_the_line: "Linientreue"
 AST_toe_the_line_desc: "Die Annehmlichkeiten, an die sich die Australier in den Jahren des Wohlstands gewöhnten, müssen vorerst zurückgestellt werden. Rationierung, längere Arbeitszeiten und der Militärdienst sind der Preis für die Unabhängigkeit. Wer diesem Ruf folgt, findet eine Nation vor, die darauf vorbereitet ist, an seiner Seite zu stehen. Der Staat wird jedoch wenig Geduld mit denen haben, die glauben, es läge in der Verantwortung anderer, Opfer zu bringen."
 AST_crush_the_gates: "Die Tore aufbrechen"
 AST_crush_the_gates_desc: "Die Aufrüstung ist abgeschlossen. Die australische Industrie arbeitet auf Hochtouren und die Produktionskapazitäten sind vollständig auf die Verteidigung und die Machtprojektion ausgerichtet. Welcher Sturm auch immer aufziehen mag: Australien begegnet ihm nicht als zurückschreckendes Dominion, das sich erst noch mühsam zur Mobilisierung aufrafft, sondern stellt sich ihm mit voller Kraft entgegen."
 AST_national_defense: "Landesverteidigung"
 AST_national_defense_desc: "Dank gezielter Investitionen und staatlicher Interventionen schuf Australien eine industrielle Basis, die in der Lage ist, die eigene Verteidigung zu gewährleisten. Fabriken und Werften arbeiten unter staatlicher Aufsicht, und ihre Produktion ist nicht auf Gewinne, sondern auf die Bedürfnissen der Nation ausgelegt."
 modify_AST_national_defense_tt: "Modifiziert §Y$AST_national_defense$§! um:"
 AST_nauru_pact: "Nauru-Abkommen"
 AST_nauru_pact_desc: "Da das erste Hindernis - die Machtübernahme - noch vor uns liegt, scheint die Frage der Unabhängigkeit noch in weiter Ferne, doch es gibt auch andere, die Interesse an einer australischen Autonomie haben. Im Gegenzug für eine Garantie von [GER.GetName], uns im Fall eines britischen Widerstands gegen Australia First oder eines späteren Austritts aus dem Commonwealth Schutz zu bieten, werden wir den Deutschen nach unserer Machtübernahme eine ihrer verlorenen Pazifikinseln zurückgeben: Nauru."
 AST_australian_culture_investments: "Australische Kulturinvestitionen"
 AST_australian_culture_investments_desc: "Mit seinem literarischen Werk „Die kulturellen Grundlagen Australiens“ prägte Stephensen die Entstehung der literarischen Jindyworobak-Bewegung maßgeblich mit und machte eines deutlich: Die australische Kultur muss Vorrang haben. Die Regierung scheint den Wert von Künstlern und Schriftstellern völlig zu vernachlässigen, doch wir tun dies nicht. Indem wir sowohl die Anhänger von Jindyworobak als auch die von Australia First mobilisieren, treiben wir die kulturelle Entwicklung voran."
 AST_australian_culture_investments_tt: "\nNach §Y365§! Tagen:"
 AST_australia_first_party_focus: "Australia First Party"
 AST_australia_first_party_focus_desc: "Die Mitgliederzahlen von Australia First sind so stark gestiegen, dass eine Machtübernahme nicht mehr aufzuhalten ist. Es ist an der Zeit, dass die australische Öffentlichkeit diese neue, lautstärkste nationalistische Stimme willkommen heißt."
 AST_australia_first_party_req_tt: "Die §YAustralia First Party§! wurde gegründet."
 AST_in_from_the_cold: "Aus der Kälte"
 AST_in_from_the_cold_desc: "Australia First und seine Anhänger müssen sich nicht länger verstecken. Die Misshandlung, die unser Land unter einer langen Reihe früherer Regierungen erdulden musste, wurden endlich ans Licht gebracht. Es ist an der Zeit, dass neue Stimmen Gehör finden."
 AST_absorb_the_uap: "Die UAP absorbieren"
 AST_absorb_the_uap_desc: "Obwohl die United Australia Party stets liberal blieb, ist sie keine Partei der Mitte, sondern tendiert nach rechts. Da eine neue politische Partei an der Macht ist, haben die Mitglieder der UAP kaum eine andere Wahl, als die derzeitige Regierung zu unterstützen. Wir müssen die einflussreichsten Mitglieder für die Australia First Party gewinnen."
 AST_big_business_pact: "Abkommen mit Großkonzernen"
 AST_big_business_pact_desc: "Durch ihr Ziel, die heimische Industrie zu schützen, findet die Australia First Party bei führenden Wirtschaftsvertretern großen Anklang. Für eine Politik, die ihre Gewinne steigert, werden sie im Gegenzug unsere politischen und militärischen Ziele unterstützen."
 AST_big_business_pact_tt: "\nSchaltet die Entscheidungen §YAbkommen mit Großkonzernen§! frei, um Ziele für die Industrie und Bauvorhaben zugänglich zu machen."
 AST_autarky: "Autarkie"
 AST_autarky_desc: "Sich zu sehr auf den Außenhandel zu verlassen, ist riskant, insbesondere in Zeiten eines Konflikts. Wir müssen die australische Industrie priorisieren und dürfen sie nicht durch Importe verdrängen. Nur durch eine Verschärfung der Handelsgesetze schützen wir die heimische Wirtschaft und stellen sicher, dass Australien sich selbst versorgen kann."
 AST_energy_independence: "Energieunabhängigkeit"
 AST_energy_independence_desc: "Sich zu sehr auf den Außenhandel zu verlassen, ist riskant, insbesondere in Zeiten eines Konflikts. Energieunabhängigkeit ist unerlässlich, damit Australien auch in einer schwierigen Zeit funktionsfähig bleibt. Durch Investitionen in Raffinerien fördern wir die heimische Energieerzeugung."
 remove_2_offsite_dockyard: "Entfernt §R2§! §YSchiffswerften§! außerhalb der Karte"
 AST_british_pact: "Britisches Abkommen"
 AST_british_pact_desc: "Trotz unseres kürzlichen Austritts aus dem Britischen Commonwealth liegt es im Interesse von [AST.GetName], weiterhin mit seinem ehemaligen Mutterland zusammenzuarbeiten. Angesichts der Tatsache, dass [ENG.GetNameDef] weltweit an vielen Fronten kämpft, sollte unsere Bereitschaft, durch militärische Zusammenarbeit einen Teil der Lasten zu tragen, gewürdigt werden."
 AST_naurus_return_to_german_hands: "Nauru kehrt in deutsche Hände zurück"
 AST_naurus_return_to_german_hands_desc: "Da Australia First die Zügel der Nation nun fest in Händen hält, ist es an der Zeit, das Versprechen in Bezug auf Nauru einzulösen und dafür zu sorgen, dass die Deutschen ihren Teil der Abmachung ebenfalls einhalten. [AST.GetNameDefCap] wird sich endlich von den Ketten des Commonwealth befreien und den Briten dabei kein Mitspracherecht lassen."
 AST_naurus_return_to_german_hands_tt: "Das §YNauru-Abkommen§! wird aktiv."
 AST_naurus_return_to_german_hands_tt_2: "Das §YNauru-Abkommen§! ist aktiv."
 AST_the_winner_takes_it_all: "Dem Sieger gehört alles"
 AST_the_winner_takes_it_all_desc: "Auch wenn es einst vernünftig erschien, die Insel Nauru für eine deutsche Zusammenarbeit zu opfern, ist dies heute nicht mehr der Fall. Da wir unsere Stärke unter Beweis stellten, streben wir eine Expansion auf die Salomonen und nach Neuseeland an, auch wenn Ersteres unseren Verrat am Nauru-Abkommen nur noch verschlimmert. Die Salomonen werden ein weiteres deutsches Territorium sein, das in australische Hände fällt."
 AST_resist_western_intruders: "Widerstand gegen ein Eindringen aus dem Westen"
 AST_resist_western_intruders_desc: "Die westlichen Nationen scheinen sich nur zu gern in die Angelegenheiten des Pazifiks einzumischen, doch damit ist jetzt Schluss. Bevor sie unsere Küsten erreichen, werden wir ihre erreichen - und damit beweisen, dass [AST.GetNameDef] keine Nation ist, die sich Forderungen beugt."
 AST_invasion_preparation_tt: "Vorbereitungszeit für Invasionen: §G-20.0%§!"
 AST_naval_invasion_penalty_tt: "Invasionsmalus: §G-20.0%§!"
 AST_expand_the_fort: "Befestigungen ausbauen"
 AST_expand_the_fort_desc: "Der Westpazifik gehört nicht der [USA.GetAdjective]en Regierung. Die von den Amerikanern beanspruchten Inseln gehören einer ostasiatischen Nation, und da der australische Einfluss immer weiter wächst, werden wir diejenigen sein, die sie beanspruchen."
 AST_integrate_the_fort: "Die Festung integrieren"
 AST_integrate_the_fort_desc: "Da Neuguinea seit 1920 unter einem Mandat des Völkerbundes regiert wurde und Papua fast seit der Gründung der Föderation ein Außengebiet von [AST.GetName] war, wäre der östliche Teil Papua-Neuguineas eine natürliche Ergänzung für die [AST.GetAdjective]en Kerngebiete. Als Teil unserer Bemühungen, die australische Kultur zu vereinen, wären diese Territorien der nächste Schritt."
 AST_defying_american_interference: "Der amerikanischen Einmischung widersetzen"
 AST_defying_american_interference_desc: "[USA.GetNameDefCap] wirft einen riesigen Schatten und droht, einzugreifen, sobald unser Handeln nicht mit den eigenen Interessen übereinstimmt. Solange eine Weltmacht dieser Größenordnung [PHI.GetName] mit eiserner Faust kontrolliert, werden die ostasiatischen Nationen niemals wirklich zu Ostasien gehören. [AST.GetNameDefCap] wird sich keiner fremden Macht beugen. Die Philippinen gehören uns!"
 AST_the_pacific_garrison: "Pazifikgarnison"
 AST_the_pacific_garrison_desc: "Obwohl der Schutz Südostasiens und des Pazifikraums im Interesse Großbritanniens liegt, ist die Region weit von den Britischen Inseln entfernt. Als Gegenleistung für ihre Unterstützung bei der Versorgung bieten wir an, die Verteidigung des Gebiets zu übernehmen, damit [ENG.GetNameDef] seine Aufmerksamkeit auf andere Fronten richten kann."
 AST_vichy_out_of_africa: "Vichy-Afrika"
 AST_vichy_out_of_africa_desc: "[ENG.GetNameDefCap] machte es sich zum Ziel, Vichy-Frankreich entweder zu stürzen oder mit ihm zusammenzuarbeiten. Als Geste des guten Willens wird sich [AST.GetNameDef] diesen Zielen anschließen und die französischen Kolonien in Afrika zur Unterwerfung zwingen."
 AST_vichy_out_of_africa_tt1: "Der Schwerpunkt §YVichy-Afrika§! fügt Ansprüche auf Territorien von §YVichy-Frankreich§! in §YAfrika§! hinzu.\n"
 AST_vichy_out_of_africa_tt2: "Die Entscheidungen §YVichy-Afrika§! fügen Ansprüche auf Territorien von §YVichy-Frankreich§! in §YAfrika§! hinzu.\n"
 AST_vichy_africa_claim_flag: "Ansprüche von [AST.GetFlag]§Y[AST.GetName]§! auf alle Territorien von §YVichy-Frankreich§! auf §YAfrika§! werden „§YSchluss mit der Einmischung§!“ hinzugefügt."
 AST_vichy_claim_tt: "Ansprüche von [AST.GetFlag]§Y[AST.GetName]§! werden „§YSchluss mit der Einmischung§!“ hinzugefügt."
 vichy_in_africa_trigger: "§YVichy-Frankreich§!: Beliebiger kontrollierter Staat:\n    Ist in §YAfrika§!"
 vichy_wargoal: "Erhält das Kriegsziel §YAnnektierung§! gegen §YVichy-Frankreich§!"
 AST_britain_supplying_ships: "Britische Schiffe"
 AST_britain_supplying_ships_desc: "Aufgrund der Last, die die Verteidigung der Küsten britischer Verbündeter mit sich bringt, wurde deutlich, dass man die [ROOT.GetAdjective]e Flotte ausbauen muss. [ENG.GetNameDefCap] muss diese Schiffe zur Verfügung stellen."
 AST_hand_in_glove: "Hand in Hand"
 AST_hand_in_glove_desc: "Eine Expansion nach Norden stärkt den Einfluss Australiens auf die Diplomatie und die Konflikte in Südostasien. Wir bewiesen bereits, dass wir in der Lage sind, sowohl die britischen als auch unsere eigenen Interessen zu wahren. [ENG.GetNameDefCap] sieht sicher ein, dass die Überseegebiete in unseren Händen besser aufgehoben wären."
 AST_claim_french_indochina: "Anspruch auf Französisch-Indochina"
 AST_claim_french_indochina_desc: "Da das Schicksal Frankreichs ungewiss bleibt, steht auch das Schicksal der französischen Kolonien noch nicht fest. Andere Nationen könnten versuchen, ihre gierigen Finger nach Französisch-Indochina auszustrecken, doch wir werden schneller sein."
 AST_undeniably_ours: "Unbestreitbar unser"
 AST_undeniably_ours_desc: "Was auch immer wir durch Diplomatie erreichen können: Sie wird nicht all unsere Ziele erfüllen. In ihrem derzeitigen Zustand sind die Grenzen Vichy-Frankreichs lediglich Empfehlungen, und es wäre höchst unklug, auf die Gelegenheit zu verzichten, ihr Land vollständig zu besetzen. Es ist Zeit, Krieg zu führen!"
 AST_done_meddling: "Schluss mit der Einmischung"
 AST_done_meddling_desc: "[AST.GetNameDefCap] war seinem Kolonialherren stets treu ergeben und kämpft weiterhin mit hoch erhobenem Haupt für das britische Volk. Auf Australier ist zwar Verlass, doch das heißt nicht, dass man sie als selbstverständlich betrachten sollte. Solange [AST.GetNameDef] für [ENG.GetName] kämpft, wird [ENG.GetNameDef] auch für [AST.GetName] kämpfen."
 AST_northern_advancement: "Nördlicher Vorstoß"
 AST_northern_advancement_desc: "Auch wenn sich Australien lieber um seine eigenen politischen Angelegenheiten kümmern würde, können wir nicht erwarten, in Ruhe gelassen zu werden, wenn wir für andere keine Bedrohung darstellen. [INS.GetNameDefCap] teilt das gleiche Schicksal wie wir und fiel den europäischen Eindringlingen zum Opfer, die nicht wieder gehen wollen. Indem wir unseren eigenen Anspruch auf das Territorium geltend machen, senden wir ein klares Signal: Die Pazifikstaaten sollen in Ruhe gelassen werden."
 AST_soothing_australian_fears: "Australische Ängste beruhigen"
 AST_soothing_australian_fears_desc: "Auch wenn einige Regierungsvertreter an die Möglichkeit einer Zusammenarbeit zwischen Australien und Japan glauben, sieht die australische Öffentlichkeit das anders. Nachdem man so lange eine japanische Invasion befürchtete, ist der Gedanke, mit eben diesem potenziellen Aggressor zusammenzuarbeiten, für die meisten kaum nachzuvollziehen. Wir werden ihre Ängste beruhigen, indem wir uns genau diesen von ihnen befürchteten Krieg vorbereiten."
 AST_soothing_australian_fears_tt: "\nNach §Y180§! Tagen:"
 AST_dividing_the_pacific: "Aufteilung des Pazifiks"
 AST_dividing_the_pacific_desc: "Australia First strebt einen Frieden mit [JAP.GetName] an und definiert diese Nation anders als die meisten australischen Bürger als potenziellen Verbündeten im Pazifik statt als lauernde Bedrohung. Da [AST.GetNameDef] seine Macht immer weiter ausbaut, ist es nur vernünftig, dass [JAP.GetNameDef] dem zustimmt und mögliche Konflikte zwischen unseren beiden Ländern beigelegt werden, bevor sie überhaupt entstehen können."
 AST_dividing_the_pacific_ast_gain_tt: "[GET_AST_DIVIDING_THE_PACIFIC_AST_GAIN]"
 AST_dividing_the_pacific_jap_gain_tt: "[GET_AST_DIVIDING_THE_PACIFIC_JAP_GAIN]"
 AST_dividing_the_pacific_tt1: "§GWir erhalten§!:"
 AST_dividing_the_pacific_tt2: "§RSie erhalten§!:"
 AST_dividing_the_pacific_tt3: "§Y[AST.GetNameDefCap]§! übergibt die folgenden kontrollierten Territorien:"
 AST_against_war_and_fascism: "Gegen Krieg und Faschismus"
 AST_against_war_and_fascism_desc: "Die Bewegung gegen Krieg und Faschismus ist der australische Zweig einer von der Komintern geförderten internationalen Initiative zur Mobilisierung der Arbeiter. Sie mag in den letzten Jahren an Schwung verloren haben, doch wir werden ihr Banner wieder hochhalten."
 AST_world_peace: "Weltfrieden"
 AST_world_peace_desc: "Die Bewegung gegen Krieg und Faschismus brachte eine Zeitschrift mit dem Titel „Weltfrieden“ heraus, die die Gräueltaten der Faschisten in Deutschland und Italien insbesondere während des Spanischen Bürgerkriegs aufdeckte. Dies führte dazu, dass sich Freiwillige mit großem Eifer dem Kampf gegen den Faschismus anschließen wollen."
 AST_red_fred: "Der rote Fred"
 AST_red_fred_desc: "Fred Paterson, auch „Red Fred“ genannt, erlangte erstmals 1934 als Kandidat für das Amt des Bürgermeisters von Brisbane in der kommunistischen Bewegung Bekanntheit, bei der er jedoch eine deutliche Niederlage erlitt. Seine Ambitionen sind jedoch ungebrochen, und nun kandidiert er für das Amt eines Stadtrats in Townsville. Mit unserer Unterstützung könnte er der erste Kommunist werden, der in ein öffentliches Amt gewählt wird."
 AST_workers_defence_corps_sparks_anew: "Wiederaufleben des Workers Defence Corps"
 AST_workers_defence_corps_sparks_anew_desc: "Das Workers Defence Corps wurde ursprünglich gegründet, um Streikpostenketten und Streiks zu verteidigen. Angesichts der zunehmenden Aggressionen durch Gruppen wie die New Guard dient es erneut als Schutzschild für diejenigen, die für bessere Rechte und Chancen einstehen."
 AST_a_controversial_recruitment: "Umstrittene Rekrutierung"
 AST_a_controversial_recruitment_desc: "Maurice Blackburn ist ein bekannter sozialistischer Anwalt, der die Rechte der Arbeitnehmer in Rechtsstreitigkeiten gegen unterdrückerische Arbeitgeber verteidigt. Als Mitglied der Labor-Partei wird seine Loyalität wegen seiner Verbindungen zur radikaleren Bewegung gegen Krieg und Faschismus infrage gestellt."
 AST_from_picket_line_to_front_line: "Von Streikposten zur Front"
 AST_from_picket_line_to_front_line_desc: "Da die Einschüchterungstaktiken der Opposition zur Befreiung der Arbeiterklasse immer aggressiver werden, müssen wir unsere eigene Verteidigung entsprechend weiterentwickeln. Jeder Zwischenfall stärkt die Entschlossenheit der Arbeiter, und immer mehr wollen dem Defence Corps beitreten."
 AST_pig_iron_protests: "Roheisen-Proteste"
 AST_pig_iron_protests_desc: "Unsere Hafenarbeiter sind oft nicht einer Meinung mit der Regierung, insbesondere dahingehend, was den Verkauf von Roheisen an kriegführende Länder betrifft. Die Australier haben kein Interesse daran, sich an der Aggression anderer zu beteiligen oder Ausrüstung bereitzustellen, die gegen unschuldige Zivilisten eingesetzt werden könnte, und daher solle es auch [AST.GetNameDef] nicht. Wir müssen zum Streik aufrufen."
 AST_part_with_colonizer: "Von den Kolonisierern losssagen"
 AST_part_with_colonizer_desc: "Die Wurzel all unserer Probleme liegt im Britischen Empire und dem kapitalistischen System, das es uns aufzwang. Doch damit ist nun Schluss! Da Großbritannien im eigenen Land einer Krise gegenübersteht, ist jetzt die Zeit gekommen, unser Schicksal selbst in die Hand zu nehmen und unseren eigenen Weg als freie und unabhängige Nation zu beschreiten."
 AST_take_it_to_the_streets: "Auf die Straße gehen"
 AST_take_it_to_the_streets_desc: "Der Arbeitskampf ist eines der stärksten Mittel, um Veränderungen in der Gesellschaft zu erzwingen, und wir müssen ihn gegen ein System richten, das allein der Ausbeutung dient. Es ist an der Zeit, die Produktionsmittel wieder in die eigenen Hände zu nehmen. Arbeiter Australiens, vereinigt euch!"
 AST_workers_educational_association: "Workers Educational Association"
 AST_workers_educational_association_desc: "Die Workers Educational Association ist eine internationale Organisation, die sich dafür einsetzt, Bildung für alle Arbeiter zugänglich zu machen. Wir sollten unseren eigenen Ortsverband gründen, da echte Chancengleichheit im Klassenzimmer beginnt."
 AST_off_leash: "Ohne Leine"
 AST_off_leash_desc: "Die Hafenarbeiter bilden das Rückgrat der Gewerkschaftsbewegung in Australien. Da wir auf einer Insel von der Größe eines Kontinents leben, ist es kaum verwunderlich, dass der Schiffbau eine derart wichtige Rolle für unsere Wirtschaft spielt. Es ist an der Zeit, die alten Seebären der Branche von der Leine zu lassen."
 AST_a_national_housing_commission: "Staatliche Wohnungskommission"
 AST_a_national_housing_commission_desc: "Das Thema Wohnen ist seit Langem ein umstrittenes Thema. Jeder hat ein Recht auf ein Dach über dem Kopf, doch oft wird dieses Grundbedürfnis missbraucht, um Arbeiter wirtschaftlich zu unterdrücken. Damit ist jetzt Schluss! Wir fordern einen fairen Zugang zu Wohnraum für alle."
 AST_guaranteed_employment: "Garantierte Beschäftigung"
 AST_guaranteed_employment_desc: "Der Sozialismus geht oft mit Vorwürfen der Faulheit oder der Abhängigkeit in Richtung von Bedürftigen einher. Das muss enden. Wir wollen nichts weiter als eine faire Chance auf Arbeit und einen gerechten Lohn, von dem wir unsere Familien ernähren können."
 AST_equal_pay: "Gleicher Lohn"
 AST_equal_pay_desc: "Es ist ein hartnäckiger Irrglaube, dass diejenigen, die die Produktionsmittel besitzen, mehr verdient hätten als jene, die für sie arbeiten. Eigentümer und Geschäftsführer arbeiten nicht härter, und sie sind auch nicht von Natur aus qualifizierter. Durch eine Angleichung der Löhne lassen sich die Früchte der Arbeit gerechter in der Gesellschaft verteilen."
 AST_all_for_one_one_for_all: "Alle für einen und einer für alle"
 AST_all_for_one_one_for_all_desc: "„Alle für einen und mehr für mich!“ ist seit Langem der Schlachtruf der Bourgeoisie, deren Gier immer größer wird, wobei sie gleichzeitig immer weniger zurückgibt. Das Versprechen, dass der Reichtum nach unten fließen wird, ist eine Lüge. Er muss gerecht verteilt werden, von allen und für alle."
 AST_abolition_of_private_property: "Privatbesitz abschaffen"
 AST_abolition_of_private_property_desc: "Die Räder der Industrie werden mit dem Blut der Arbeiter geschmiert. Wir müssen der Brutalität der Geldanhäufung ein Ende setzen und Privateigentum vollständig abschaffen. Alles muss geteilt werden: Jeder nach seinen Fähigkeiten, jedem nach seinen Bedürfnissen."
 AST_centralized_production: "Zentralisierte Produktion"
 AST_centralized_production_desc: "Die Märkte sind chaotisch und ungerecht. Wenn wir eine wirklich gerechte Gesellschaft aufbauen wollen, muss der Staat eine zentrale Rolle übernehmen und bestimmen, wer was wo produzieren darf. Unsere Verwaltung führt akribisch Buch und ist am besten in der Lage, Produktionsquoten festzulegen."
 AST_public_institutions: "Öffentliche Institutionen"
 AST_public_institutions_desc: "Die Gesellschaft benötigt grundlegende Dienstleistungen, um zu funktionieren. Dies fängt bei der Gesundheitsversorgung an, geht über den Wohnungsbau bis hin zur Kinderbetreuung und zum Verkehrswesen. Der Staat muss diese Dienstleistungen für alle bereitstellen und gewährleisten, dass alle uneingeschränkten Zugang zu ihnen haben. Da keine Gewinne erzielt werden müssen, können diese Systeme effizient arbeiten und den Bedürfnissen der gesamten Bevölkerung gerecht werden."
 AST_planned_extraction: "Planabbau"
 AST_planned_extraction_desc: "Wir haben Glück, in einem Land zu leben, das so reich an Ressourcen ist. Wir müssen dafür sorgen, dass dieser Reichtum systematisch erschlossen wird und jenen Industriezweigen zugutekommt, die ihn am dringendsten brauchen."
 AST_maritime_commission: "$USA_maritime_commission$"
 AST_maritime_commission_desc: "$USA_maritime_commission_desc$"
 AST_state_research_funding: "Staatliche Forschungsfinanzierung"
 AST_state_research_funding_desc: "Um die Effizienz der Forschung zu maximieren, muss der Staat zur wichtigsten Finanzierungsquelle werden, um Mittel dorthin zu lenken, wo man sie am dringendsten braucht, und dafür sorgen, dass der Informationsfluss streng kontrolliert wird. Schließlich können wir nicht riskieren, dass unsere Bevölkerung durch falsche Vorstellungen verunsichert wird."
 AST_graziers_to_industry: "Vom Viehzüchter zur Industrie"
 AST_graziers_to_industry_desc: "Während der Weltwirtschaftskrise wurden unsere Städte entvölkert, da die Arbeiter auf dem Land nach Stabilität suchten. Da wir nun die Produktionsmittel kontrollieren, können wir sie wieder in die Industrie zurückholen. Wir müssen ihnen die Notwendigkeit vor Augen führen, dass die Hochöfen zum Wohl der Nation mit ihrem Schweiß befeuert werden müssen."
 AST_free_school_policy: "Kostenlose Schulen"
 AST_free_school_policy_desc: "Um den Idealbürger formen zu können, müssen wir zunächst seine Ideale formen. Von der Wiege bis zur Universität wird der Staat bestimmen, was man unseren Kindern beibringt. So stellen wir sicher, dass künftige Generationen die Bedeutung der sozialistischen Ideale und die Gefahren des freien Marktes verstehen ... und auch die des freien Denkens."
 AST_free_healthcare_policy: "Kostenlose Gesundheitsversorgung"
 AST_free_healthcare_policy_desc: "Wenn unsere Bevölkerung krank wird oder sich verletzt, darf sie durch dieses Unglück nicht in die Armut getrieben werden, wie es in anderen Gesellschaften der Fall ist. Wir müssen dafür sorgen, dass jeder Zugang zum Gesundheitswesen, zu Krankenhäusern und zu Ärzten hat, denn nur ein gesundes Volk ist ein produktives Volk."
 AST_the_publics_australia: "Australien gehört dem Volk"
 AST_the_publics_australia_desc: "Wir ließen die alte Ordnung hinter uns und schufen eine Nation, die für alle einsteht und nicht nur für die wenigen. Industrie, Arbeit und Ressourcen dienen dem gesamten Volk. Das ist das Australien des Volkes: gleich, geeint und unerschütterlich."
 # 'Cominwealth' over 'Commonwealth' is intentional
 AST_the_australian_commonwealth: "Australisches Commonwealth"
 AST_the_australian_commonwealth_desc: "Großbritannien beanspruchte einst die Führungsrolle im Commonwealth für sich, doch seine Vision wurde durch seine kapitalistischen Interessen korrumpiert. Wir werden diese Rolle übernehmen und die Nationen in eine gemeinsame sozialistische Utopie führen."
 AST_union_control_commonwealth: "Schaltet die Entscheidungen §YGewerkschaftskontrolle§! frei.\nErlaubt die kommunistische Infiltration von Neuseeland, Malaysia, Burma und schließlich Indien."
 AST_a_comrade_emancipated: "Gleichberechtigte Genossen"
 AST_a_comrade_emancipated_desc: "Weltweit sind viele Nationen noch immer von den Fesseln des Kapitalismus gefangen, und ihren Völkern wird die wahre Freiheit verwehrt. Als freier sozialistischer Staat ist es unsere Pflicht, ihnen dabei zu helfen, sich zu befreien. Arbeiter aller Länder, vereinigt euch! Gemeinsam werden wir diese Fesseln abwerfen."
 AST_union_control_local: "Schaltet die Entscheidungen §YGewerkschaftskontrolle§! frei.\nErlaubt die kommunistische Infiltration von Indonesien und den Philippinen."
 AST_comintern: "Komintern beitreten"
 AST_comintern_desc: "Auch wenn sie zeitweise von den wahren marxistischen Prinzipien abwich, ist die Sowjetunion weiterhin der Bannerträger der Arbeiterinternationale. Durch den Beitritt zur Komintern bündeln wir unsere Kräfte und tragen die Fackel des Sozialismus in die ganze Welt."
 AST_comintern_tt: "Wenn §Y[AST.GetNameDef]§! ein Bündnis anführt, verschmilzt dieses mit der Komintern. Andernfalls wird §Y[AST.GetNameDef]§! der Komintern allein beitreten."
 AST_for_greater_good: "Für das Gemeinwohl"
 AST_for_greater_good_desc: "Unsere Vision einer Weltrevolution erfordert Blut und Opfer. An zu vielen Orten flackert die Fackel des Sozialismus. Wir müssen ihrem Ruf folgen und sie unterstützen, damit sie nicht erlischt. Schließlich dient dies dem Gemeinwohl."
 AST_make_common_cause: "Gemeinsame Sache machen"
 AST_make_common_cause_desc: "Unter unserer Führung konnte das Commonwealth gedeihen und befreite sich geleitet vom Licht des Sozialismus aus der Dunkelheit der kapitalistischen Unterdrückung. Wir müssen dafür sorgen, dass dieser Wille nicht gebrochen wird und wir gemeinsam auf eine bessere Zukunft zusteuern."
 AST_the_red_pacific: "Roter Pazifik"
 AST_the_red_pacific_desc: "Der Pazifik muss nach dem Vorbild der Revolution umgestaltet werden. Überall auf den Inseln und an den Küsten werden wir den Aufstieg sozialistischer Regierungen unterstützen und dafür sorgen, dass allerorten die rote Flagge weht."
 AST_the_irish_anti-britain_pact: "Antibritisches Abkommen mit Irland"
 AST_the_irish_anti-britain_pact_desc: "Großbritannien ist schon viel zu lange eine Hochburg des Kapitalismus und wird durch seine Insellage und seine Seemacht geschützt. Indem wir Unruhen unter den Hafenarbeitern in Irland und Nordirland schüren, durchbrechen wir die Verteidigungslinien und ebnen unseren Truppen einen Weg über die Irische See."
 AST_stretch_the_fleet: "Die Flotte vergrößern"
 AST_stretch_the_fleet_desc: "Großbritannien gilt nach wie vor als Hochburg des Kapitalismus und wird von einer mächtigen Flotte geschützt. Es ist an der Zeit, dass wir unsere eigene Seemacht ausbauen, den Kampf zu den Briten tragen und der Welt zeigen, welche Insel größer ist."
 AST_chinese_relations: "Beziehungen zu China"
 AST_chinese_relations_desc: "Unsere Genossen in China kämpfen um ihr nacktes Überleben. Wir haben die Mittel, ihnen zu helfen, müssen aber rasch handeln, bevor sie von den Imperialisten ausgelöscht werden."
 AST_westward_battles: "Kämpfe im Westen"
 AST_westward_battles_desc: "Die Faschisten beherrschen den Westen und gefährden die Grundfesten unseres Überlebens. Da wir uns mit der Komintern verbündeten, können wir den Kampf zu ihnen tragen und dafür sorgen, dass sie nicht jene Arbeiterutopie zerstören können, die wir gerade aufbauen."
 AST_strongholds: "Festungen"
 AST_strongholds_desc: "Um unsere Position auf diesem neuen Kriegsschauplatz zu festigen, müssen wir unsere irischen Genossen im Kampf gegen das imperiale Herz des Kapitalismus unterstützen. Ihr früherer Unabhängigkeitskampf bietet wertvolle Lektionen, die wir für die nächste Phase des globalen Konflikts anwenden können."
 AST_out_of_the_den: "Raus aus der Höhle"
 AST_out_of_the_den_desc: "Viele Iren hegen nach wie vor einen tiefen Groll gegenüber der britischen Herrschaft. Es ist an der Zeit, sie aus den Schatten zu holen und sie für unsere Sache im Kampf gegen einen gemeinsamen Feind zu gewinnen."
 AST_end_the_kingdom: "Ende des Königreichs"
 AST_end_the_kingdom_desc: "Die Zeit ist endlich gekommen. Wir werden den imperialistischen Kapitalismus an seiner verfaulten Wurzel ausreißen. Die Befreiung der Arbeiter im gesamten Britischen Empire steht kurz bevor. Tod der Monarchie! Tod dem Königreich! Tod der Unterdrückung! Arbeiter des Commonwealth, vereinigt euch!"
 AST_red_solidarity: "Rote Solidarität"
 AST_red_solidarity_desc: "Der Krieg in China tobt weiter, und Millionen Menschen leiden und sterben. Wir dürfen nicht tatenlos zusehen und müssen ihren Kampf zu unserem Kampf machen. Wir müssen die Last mit ihnen teilen und dafür sorgen, dass die Flamme der Revolution niemals erlischt."
 AST_red_solidarity_tt: "§Y[AST.GetNameDefCap]§! tritt dem Krieg von §Y[PRC.GetName]§! gegen§Y[CHI.GetName]§! bei. Das kleinere Bündnis absorbiert das größere oder §Y[AST.GetNameDef]§! tritt dem Krieg direkt bei, falls beide bereits verbündet sind."
 AST_free_the_colonies: "Die Kolonien befreien"
 AST_free_the_colonies_desc: "Die Flamme der Revolution lodert im zerfallenden Britischen Empire. Die Kolonien werden keine Kolonien mehr sein, sondern freie Nationen. Erhebt euch, Genossen! Werft eure Fesseln ab und schließt euch der Revolution an!"
 AST_free_the_colonies_tt: "§Y[AST.GetNameDefCap]§! stuft alle ehemaligen britischen Kolonien unter seiner Kontrolle zu integrierten Marionettenstaaten zurück."
 AST_battle_of_the_ocean: "Schlacht auf dem Ozean"
 AST_battle_of_the_ocean_desc: "Die Ozeane sind die Lebensadern des globalen Handels. Es ist an der Zeit, den Kampf in den Pazifik zu tragen und jenes System zu zerstören, das er am Leben erhält. Wir werden die Meere mit dem Blut korrupter Kapitalisten und Helden der Revolution gleichermaßen rot färben."
 AST_borderless_solidarity: "Grenzenlose Solidarität"
 AST_borderless_solidarity_desc: "Solidarität ist das Wort, das die Arbeiter der Welt miteinander verbindet. Keine Grenze vermag uns zu trennen und keine Nation kann für sich allein bestehen. Wo immer ein Konflikt entflammt, folgen wir dem Ruf und stehen gemeinsam im weltweiten Kampf für die Befreiung ein."
 AST_an_equal_union: "Union der Gleichheit"
 AST_an_equal_union_desc: "Auch wenn wir diejenigen sind, die das Banner der Revolution tragen, sind alle, die sich uns anschließen, Gleichberechtigte. In dieser Gemeinschaft werden Ressourcen, Arbeitskraft und Ideen frei geteilt, um eine Zukunft zu schaffen, in der der Wohlstand allen gehört und keine Nation über einer anderen steht."
 AST_expanding_influence: "Erweiterter Einfluss"
 AST_expanding_influence_desc: "Wir stehen auf der richtigen Seite der Geschichte und unsere Ideale sprechen für sich. Das Versprechen eines Arbeiterparadieses ist nicht länger nur ein Traum, sondern eine wahr gewordene Realität, die langsam Gestalt annimmt. Wir können diese Vision nach außen tragen und andere einladen, zusammen mit uns an einer gemeinsamen Zukunft zu arbeiten."
 AST_public_works: "Öffentliche Bauvorhaben"
 AST_public_works_desc: "Die Weltwirtschaftskrise brachte die australische Wirtschaft in eine schwierige Lage. Wir müssen eine Reihe öffentlicher Bauprogramme auf den Weg bringen, um Menschen wieder in Arbeit zu bringen und den Konsum anzukurbeln."
 AST_lang_plan: "Lang-Plan"
 AST_lang_plan_desc: "Jack Lang ist durch seine nachdrückliche Weigerung, ausländische Schuldverpflichtungen zu begleichen und diese Mittel stattdessen in öffentliche Initiativen zur Ankurbelung des Binnenwachstums zu stecken, in den Vordergrund der Wirtschaftspolitik gerückt. Schließlich lässt sich aus einem Stein kein Blut pressen."
 AST_exports_for_economic_recovery: "Exporte für den wirtschaftlichen Aufschwung"
 AST_exports_for_economic_recovery_desc: "Die Widersacher von Lang schlagen vor, ausländische Märkte und Kredite zu nutzen, um Investitionen und Verkäufe im Ausland zu fördern, und auf eine exportorientierte Wirtschaft zu setzen, um die inländische Produktion, die Beschäftigung und letztlich die Konsumausgaben anzukurbeln."
 AST_the_phosphate_commision: "Die Phosphatkommission"
 AST_the_phosphate_commision_desc: "Nach dem Ersten Weltkrieg wurde Nauru unter die gemeinsame Treuhandschaft von Australien, Neuseeland und dem Vereinigten Königreich gestellt. Im Jahr 1919 übertrug man die Rechte an allen Phosphatverkäufen auf der Insel an diese Treuhänder unter der Führung Australiens. Dank unserer Position können wir die Preisgestaltung beeinflussen und wettbewerbsfähige Preise für unseren heimischen Markt sichern."
 AST_goods_standard: "Güterstandards"
 AST_goods_standard_desc: "Eine der zentralen Kernaussagen von Jack Langs Wirtschaftstheorie ist die Abschaffung des Goldstandards in Australien und dessen Ersatz durch einen Warenstandard, der die Geldmenge an die tatsächlich produzierte Warenmenge koppelt. Dadurch wird gewährleistet, dass der Kapitalfluss direkt an die inländische Produktivität gebunden ist und nicht von externen Faktoren abhängt."
 AST_standard_gauge_line_to_darwin: "Normalspur nach Darwin"
 AST_standard_gauge_line_to_darwin_desc: "Die Infrastruktur in unsere nördlichen Territorien ist nur dürftig ausgebaut. Im Rahmen eines umfassenderen Programms für öffentliche Bauvorhaben sollten wir eine Eisenbahnstrecke bauen, die unsere südlichen Städte mit dem Norden verbindet und so Geld zurück in die Wirtschaft spült."
 AST_lang_is_right: "Lang ist im Recht"
 AST_lang_is_right_desc: "Wie sich herausstellte, hatte Lang recht! Unsere Weigerung, ausländischen Kreditgebern Vorrang einzuräumen und stattdessen unser eigenes Bankensystem aggressiver zu nutzen, setzte erhebliche finanzielle Mittel frei. Diese können nun in die Binnenwirtschaft fließen, wo sie dringend benötigte Investitionen ermöglichen und das Wachstum ankurbeln."
 AST_within_reach: "Innerhalb der Reichweite"
 AST_within_reach_desc: "So nah und doch so fern. Australien verfügt über enorme Bodenschätze, und wenn wir nur ein wenig tiefer graben, liegen unermessliche Reichtümer direkt unter unseren Füßen. Durch den Ausbau unserer Infrastruktur wurden sogar abgelegene Minen erreichbar. Australien tritt in eine neue Ära des Wohlstands ein, getragen vom Reichtum unserer Bodenschätze."
 AST_a_domestic_supply_chain: "Einheimische Lieferkette"
 AST_a_domestic_supply_chain_desc: "Dank unserem Fokus auf der Binnenwirtschaft entstand ein außerordentlich widerstandsfähiges Produktionssystem. Da alle Produktionsstufen im Inland abgewickelt werden, sind wir weitgehend vor internationalen Krisen geschützt."
 AST_broken_hill_propietary_company: "Broken Hill Proprietary Company"
 AST_broken_hill_propietary_company_desc: "Die Broken Hill Proprietary Company ist einer der führenden Bergbau- und Stahlproduzenten Australiens. Das von den Einheimischen als „The Big Australian“ (der große Australier) bezeichnete Unternehmen dominiert die Branche bereits seit geraumer Zeit. Da die Nachfrage nach Rohstoffen unermesslich stark anstieg, ist das Unternehmen für ein noch rascheres Wachstum bestens aufgestellt."
 AST_radium_hill: "Radium Hill"
 AST_radium_hill_desc: "Im Süden Australiens wurde Uran entdeckt, und die Radium-Hill-Mine birgt das beste Potenzial für einen Ausbau. Auch wenn wir die Möglichkeiten dieser neuen Technologien noch nicht vollständig erschlossen haben, stehen wir bereits an der Schwelle zum Atomzeitalter - und dieses Vorkommen könnte unser Einstieg sein."
 AST_industrial_expansion: "Industrielle Expansion"
 AST_industrial_expansion_desc: "Die Weltwirtschaftskrise beeinträchtigte die Wirtschaftsleistung unseres Landes über weite Teile des vergangenen Jahrzehnts hinweg stark. Da unsere Politik endlich gewillt ist, Maßnahmen zu ergreifen, sollten wir diesen Willen mutig in den Ausbau unserer industriellen Basis lenken. Dies wird Arbeitsplätze schaffen, die Nachfrage nach Ressourcen steigern und mehr Güter für den Markt produzieren."
 AST_income_tax_assessment_act: "Einkommensteuergesetz"
 AST_income_tax_assessment_act_desc: "Unser Steuersystem ist in einem schlechten Zustand und für die Bevölkerung nur schwer verständlich, was eine strenge staatliche Aufsicht erfordert, die wir uns kaum leisten können. Durch eine Überarbeitung und Straffung der entsprechenden Bestimmungen gestalten wir die Steuererhebung deutlich effizienter."
 AST_council_for_scientific_and_industrial_research: "Rat für wissenschaftliche und industrielle Forschung"
 AST_council_for_scientific_and_industrial_research_desc: "Der Rat für wissenschaftliche und industrielle Forschung wurde im Anschluss an die Reichskonferenz von 1923 stark gefördert, um die wirtschaftliche Basis der verschiedenen Kolonien und Dominions zu stärken. So bedeutsam sein bisheriger Beitrag auch gewesen sein mag: Dieses Gremium muss eine neue Ausrichtung erhalten und sich auf weiterverarbeitende Industrien konzentrieren."
 AST_bring_home_the_farmers: "Die Bauern nach Hause bringen"
 AST_bring_home_the_farmers_desc: "Während der Weltwirtschaftskrise ging die Bevölkerungszahl in unseren Großstädten stark zurück, weil Arbeiter auf der Suche nach Arbeit in der Landwirtschaft aufs Land zogen. Da sich die Lage allmählich verbessert, sollten wir Anreize für eine Rückkehr in die Städte schaffen, damit wir die Fabriken wieder in Betrieb nehmen und die Produktion wieder anlaufen lassen können."
 AST_reverse_wage_cuts: "Lohnkürzungen rückgängig machen"
 AST_reverse_wage_cuts_desc: "Um Unternehmen wettbewerbsfähig zu machen, wurde in allen Wirtschaftsbereichen eine Reihe von Lohnkürzungen vorgenommen. Da sich der Markt langsam erholt, sollten wir diese umkehren. Steigende Löhne führen zu einer höheren Kaufkraft und tragen dazu bei, den Konsum und das Wirtschaftswachstum anzukurbeln."
 AST_the_manpower_directorate: "Direktion für den Einsatz von Arbeitskraft"
 AST_the_manpower_directorate_desc: "Angesichts der zunehmenden Komplexität unserer Wirtschaft stehen wir vor der Herausforderung, woher wir all die nötige Arbeitskraft beschaffen sollen. Diese Direktion stellt sicher, dass die richtigen Personen mit den richtigen Qualifikationen zum richtigen Zeitpunkt in die richtigen Positionen vermittelt werden."
 AST_recovery: "Aufschwung"
 AST_recovery_desc: "Zum ersten Mal ist unser Bruttoinlandsprodukt so stark wie vor der Weltwirtschaftskrise. Das ist ein Anlass zum Feiern! Unsere Wirtschaft befindet sich im Aufwärtstrend und wächst immer weiter. Es ist an der Zeit, die Früchte unseres wiedergewonnenen Wohlstands zu ernten."
 AST_devalued_currency: "Entwertete Währung"
 AST_devalued_currency_desc: "Eine der wirksamsten Methoden zur Steigerung der Exporte ist eine schwächere Währung. Wenn ausländische Käufer mehr unserer Waren erwerben können, weil ihr Geld einen höheren Wert hat, werden wir international wettbewerbsfähiger. Dies ist jedoch ein zweischneidiges Schwert, da auch Importe aus anderen Ländern teurer werden."
 AST_reverse_industry_tariffs: "Industriezölle rückgängig machen"
 AST_reverse_industry_tariffs_desc: "In der Vergangenheit setzten wir Zölle ein, um unsere heimische Industrie vor ausländischer Konkurrenz zu schützen. Dies führte jedoch zu Handelskriegen und Vergeltungszöllen gegen unsere eigenen Exporte, wodurch die Preise stiegen. Wir sollten die Handelsbeschränkungen abbauen und darauf hinarbeiten den Handel zu fördern."
 AST_foreign_competition: "Ausländische Wettbewerber"
 AST_foreign_competition_desc: "Wettbewerb ist gut fürs Geschäft, da er zum einen die Innovation und die Effizienz fördert und zum anderen Selbstzufriedenheit unterbindet. Da auf den Märkten ein harter Konkurrenzkampf herrscht, müssen wir dafür sorgen, dass wir eine starke Position einnehmen und keinen Beschränkungen unterliegen."
 AST_expanding_into_new_markets: "In neue Märkte ausbreiten"
 AST_expanding_into_new_markets_desc: "Der Vorteil, sich mehr auf ausländische Märkte als auf den heimischen Markt zu konzentrieren, liegt auf der Hand. Der globale Markt ist riesig. Es gibt immer neue Märkte, und wir müssen nur unseren Wettbewerbsvorteil finden und die Überlegenheit australischer Waren und Geschäftspraktiken unter Beweis stellen."
 AST_populate_or_perish: "Bevölkern oder untergehen"
 AST_populate_or_perish_desc: "Während der Weltwirtschaftskrise gingen die Geburtenraten rapide zurück und erholten sich seitdem nur mühsam wieder. Im Interesse einer nachhaltigen innenpolitischen Entwicklung bauen wir ein Bundesministerium für Migration auf, das unser neues Einwanderungsprogramm überwacht."
 AST_recruitment_drive: "Rekrutierungskampagne"
 AST_recruitment_drive_desc: "Der schwache Wille früherer Regierungen sowie deren übermäßige Abhängigkeit von Großbritannien führten dazu, dass das australische Militär lange Zeit vernachlässigt wurde. Doch damit ist nun Schluss. Wir rufen eine Kampagne ins Leben, um mehr Rekruten für die australischen Verteidigungstruppen zu finden."
 AST_new_deal: "Neue Abkommen"
 AST_new_deal_desc: "Die Proteste anlässlich des 150-jährigen Jubiläums seit der Kolonisierung von [AST.GetName] machten deutlich, dass unsere Gesetze in Bezug auf die indigene Bevölkerung überdacht werden müssen. Wir werden uns mit den Aktivisten treffen, die sich für die Rechte der Aborigines einsetzen, um gemeinsam einen Weg zur vollen Staatsbürgerschaft für indigene Völker auszuarbeiten."
 AST_the_1938_sesquicentenary_flag: "Das Ereignis §YDas 150-jährige Jubiläum von 1938§! ist eingetreten"
 AST_the_1938_sesquicentenary_tt: "Der Schwerpunkt §YNeue Abkommen§! im Zweig §YBevölkern oder untergehen§! wird verfügbar."
 AST_repeal_immigration_restrictions: "Migrationsbeschränkungen aufheben"
 AST_repeal_immigration_restrictions_desc: "Die Einwanderungsbehörde ist an veraltete Gesetze gebunden, die beschränken, wer nach [AST.GetName] einwandern darf. Auch auf die Gefahr hin, eine Kontroverse auszulösen, müssen diese Gesetze aufgehoben und durch ein Quotensystem ersetzt werden, das den Zustrom neuer Einwanderer steuert."
 AST_womens_armed_services: "Militärdienst für Frauen"
 AST_womens_armed_services_desc: "Trotz heftigem Widerstand wird die Aufstellung einer Frauenstreitkraft vorangetrieben. Jede helfende Hand ist willkommen, wenn es der Verteidigung von [AST.GetName] dient, unabhängig vom Geschlecht. Um die Rekrutierung und Ausbildung voranzutreiben, ist die Auswahl eines militärischen Führungsstabs für diesen Militärzweig von größter Wichtigkeit."
 AST_northern_territory_reconnaissance_unit: "Aufklärungseinheit für die Northern Territories"
 AST_northern_territory_reconnaissance_unit_desc: "Donald Thomson, Hauptmann der Luftwaffe und Anthropologe, setzte sich für die Einberufung der Aborigines ein. Wir werden Thomson persönlich damit beauftragen, eine Aufklärungseinheit zusammenzustellen, die ortskundig ist und im Busch überleben kann, um selbst unsere entlegensten und unwirtlichsten Territorien zu überwachen."
 AST_northern_territory_reconnaissance_unit_tt: "Schaltet die Unterstützungskompanie §YAufklärungseinheit für die Northern Territories§! frei."
 AST_torres_strait_battalion: "Ein Bataillon für die Torres-Straße"
 AST_torres_strait_battalion_desc: "Die Torres-Straßen-Kompanie leistete als Garnison gute Dienste, doch in ihr steckt noch viel mehr Potenzial. Da ihre Mitglieder hauptsächlich von den Inseln vor der [AST.GetAdjective]en Nordküste stammen, verfügt die Einheit über umfassende Kenntnisse der Torres-Straße. Wir müssen die Kompanie zu Marines ausbilden und weitere Freiwillige anwerben, um ein Bataillon aufzustellen."
 AST_department_of_aboriginal_affairs: "Amt für die Angelegenheiten der Eingeborenen"
 AST_department_of_aboriginal_affairs_desc: "Wir werden den Vorschlag der Aktivsten für mehr Rechte für Ureinwohner umsetzen und ein neues Ministerium einrichten, das sich um die Angelegenheiten der Aborigines kümmert. Das Ministerium wird von einem Ausschuss an Eingeborenen beraten werden und hat das Ziel, der indigenen Bevölkerung Zugang zu ausreichend Nahrung und medizinischer Versorgung zu geben."
 AST_immediate_rights: "Sofortige Rechte"
 AST_immediate_rights_desc: "Keine Bevölkerungsgruppe innerhalb von [AST.GetName] sollte von der Regierung Sonderrechte erhalten und kein ethnischer Hintergrund darf die Gewährung von Bürgerrechten einschränken. Durch die Verabschiedung eines eigenen Staatsbürgerschaftsgesetzes und der Abkehr von der Vorstellung, dass unsere Bevölkerung lediglich aus britischen Untertanen besteht, werden die Rechte der Australier nicht länger an Bedingungen geknüpft sein."
 AST_diverse_army: "Vielseitige Armee"
 AST_diverse_army_desc: "Die Verteidigung des eigenen Landes ist nicht nur ein Privileg, sondern ein Anrecht. Jeder Australier sollte sich zum Militärdienst melden können, und jeder ehrgeizige Soldat soll die Möglichkeit haben, im Dienstgrad aufzusteigen."
