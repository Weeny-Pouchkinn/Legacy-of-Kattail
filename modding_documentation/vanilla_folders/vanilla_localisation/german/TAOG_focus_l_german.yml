 INS_the_jewel_in_the_crown: "Das Juwel in der Krone"
 INS_the_jewel_in_the_crown_desc: "Niederländisch-Indien ist das funkelndste Juwel in der niederländischen Kolonialkrone, und wir wollen, dass dies auch so bleibt. Durch den Volksraad wird unser Wort nach Den Haag getragen."
 INSHOL_java: "$HOL_java$"
