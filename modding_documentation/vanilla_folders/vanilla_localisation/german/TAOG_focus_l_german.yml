 AST_uap_election_campaign_tt: "§YWahlkampf der UAP§!\n§LDie United Australia Party wird die Mittelschicht, Unternehmer und Getreue des Empires mobilisieren.§!\n\n§YAuswirkungen:§!\nPolitische Machtkosten pro Tag: §R1.00§!\nTägliche Erhöhung an §YUAP§!-Stimmen: §G+0.05%§!"
 AST_alp_election_campaign_tt: "§YWahlkampf der ALP§!\n§LDie Australian Labor Party wird die Arbeiterklasse, Gewerkschaftsmitglieder und auf das Inland ausgerichtete Reformbefürworter mobilisieren.§!\n\n§YAuswirkungen:§!\nPolitische Machtkosten pro Tag: §R1.00§!\nTägliche Erhöhung an §YALP§!-Stimmen: §G+0.05%§!"
 AST_uap_win_count_trigger_tt: "Die §YUAP§! hat mindestens $COUNT|Y$ Wahlsiege."
 AST_alp_win_count_trigger_tt: "Die §YALP§! hat mindestens $COUNT|Y$ Wahlsiege."
 AST_natunity_desc: "§YNationale Einheitsregierung§!\n§LIn Krisenzeiten weichen kleinere Konflikte zugunsten größerer. Die Nationen um uns herum stehen immer neuen Konflikten gegenüber, und so dringend innenpolitische Themen auch sein mögen, verblasst diese Dringlichkeit, wenn die Gefahr von Blutvergießen immer näherrückt. Die [AST.GetAdjective]en demokratischen Parteien müssen ihre Meinungsverschiedenheiten beiseitelegen und der Welt geeint entgegentreten.§!"
 AST_uap_becomes_ruling_party: "Die §YUnited Australia Party§! wird zur Regierungspartei."
 AST_alp_becomes_ruling_party: "Die §YAustralian Labor Party§! wird zur Regierungspartei."
 AST_increased_focuses_become_available: "Die aufgelisteten Schwerpunkte werden §Gverfügbar§!."
 effect_tt: "\n§YAuswirkungen§!:"
 AST_natunity_becomes_ruling_party: "\nDie [GET_AST_RULING_PARTY] lädt die [GET_AST_NON_RULING_PARTY] zu einer Nationalen Einheitsregierung ein.\n\nDie [GET_AST_NON_RULING_PARTY] erhält §Y1§! Wahlsieg\n\n"
 AST_natunity_effect_update_tt: "Die Schwerpunktliste wird basierend auf der derzeitigen §YOppositionspartei§! und deren bereits freigeschalteten Schwerpunktgruppen aktualisiert."
