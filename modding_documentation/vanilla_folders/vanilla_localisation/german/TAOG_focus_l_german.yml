 INSHOL_foundations_of_defense: "$HOL_the_foundations_of_defense$"
 INSHOL_foundations_of_defense_desc: "$HOL_the_foundations_of_defense_desc$"
 INSHOL_investments_in_civ_railways_tt: "Wenn [HOL.GetFlag]§Y[HOL.GetNameDef]§! den Schwerpunkt abschließt:\n         ([INS.GetFlag]§Y[INS.GetName]§!: Erhält §Y£autonomy_texticon -250.00§!)\n   Wenn [INS.GetFlag]§Y[INS.GetNameDef]§! den Schwerpunkt abschließt:\n         Erhält §Y£autonomy_texticon 250.00§!"
 INSHOL_investments_in_civ_railways: "In die zivile Eisenbahn investieren"
 INSHOL_investments_in_civ_railways_desc: "Um die Unterstützung der Bevölkerung in Niederländisch-Indien zu gewinnen, müssen wir in die zivile Infrastruktur investieren. Derzeit werden unsere Eisenbahnen hauptsächlich für den Güterverkehr genutzt. Wir sollten Personenzüge einsetzen, die auf unseren bestehenden Eisenbahnstrecken auf Java und Sumatra verkehren."
 INSHOL_continue_exclusive_rights: "Exklusivrechte für die De Javasche Bank"
 INSHOL_continue_exclusive_rights_desc: "Der Indische Gulden verlor durch die Weltwirtschaftskrise den Großteil seines Werts, und unser Wirtschaftswachstum ist zum Stillstand gekommen. Wir könnten versuchen, den Gulden zu stabilisieren, indem wir der Bank von Java wieder exklusive Münzprägerechte gewähren, die sie schon einmal bis 1922 hatte."
 INSHOL_peg_indies_guilder_to_dutch_guilder: "Indischen Gulden an den Niederländischen Gulden binden"
 INSHOL_peg_indies_guilder_to_dutch_guilder_desc: "Der Indische Gulden verlor durch die Weltwirtschaftskrise den Großteil seines Werts, und unser Wirtschaftswachstum ist zum Stillstand gekommen. Am einfachsten wäre es, den Indischen Gulden an den Niederländischen Gulden zu binden, der eine weitaus stabilere Währung ist. Dies wird uns außerdem enger an unseren Suzerän binden."
 INSHOL_peg_indies_guilder_to_us_dollar: "Indischen Gulden an den US-Dollar binden"
 INSHOL_peg_indies_guilder_to_us_dollar_desc: "Der Indische Gulden verlor durch die Weltwirtschaftskrise den Großteil seines Werts, und unser Wirtschaftswachstum ist zum Stillstand gekommen. Zwar könnten wir den Indischen Gulden an den Niederländischen Gulden koppeln, doch der US-Dollar ist eine weitaus stabilere Währung. Indem wir den Gulden an den Dollar binden, sind wir wirtschaftlich unabhängiger, was die Selbstverwaltung zu einem leichter erreichbaren Ziel macht."
 indonesia_currency_pegged_to_dollar_modifier: "Indische Gulden an US-Dollar gekoppelt"
 INS_direct_rule_tt: "Schaltet das Besatzungsrecht §Y$INS_direct_rule_occupation_law$§! in indonesischen Fürstenstaaten frei.\nAuswirkungen:\n     §GErhöht§! die Fabriken und Ressourcen im Staat\n     §RVerringert§! das Gehorsamswachstum\n     §RErhöht§! das Widerstandswachstum"
 INS_local_autonomy_tt: "Schaltet das Besatzungsrecht §Y$INS_local_autonomy_occupation_law$§! in indonesischen Fürstenstaaten frei.\nAuswirkungen:\n     Gibt §Ykleinere§! Boni in mehreren Bereichen\n     §GErhöht§! das Gehorsamswachstum"
 INS_invest_in_batavian_education_req_tt: "Hat mindestens §Y3§! Volksraad-Missionen erfolgreich abgeschlossen"
 INS_invest_in_batavian_education_req_2_tt: "Hat mindestens §Y6§! Volksraad-Missionen erfolgreich abgeschlossen"
 INSHOL_eventual_autonomy_req_tt: "Hat mindestens §Y4§! Volksraad-Missionen erfolgreich abgeschlossen"
 indonesia_volksraad_passed_12: "Die Nationalflagge Indoesiens wurde offiziell anerkannt"
 INS_stronghold_java_tt: "Beliebiger indonesischer Staat: Wird nicht von [ROOT.GetFlag][ROOT.GetName] besetzt"
 INSHOL_request_east_timor: "Rückgabe von Osttimor fordern"
 INSHOL_request_east_timor_desc: "Portugal hat kein Recht, Timor zu besetzen. Timor ist ein Überbleibsel der Kolonialgeschichte, das wir nicht länger hinnehmen dürfen. Timor gehört rechtmäßig zum indonesischen Hoheitsgebiet, und wir werden Portugal offiziell darum bitten, uns Timor unverzüglich zurückzugeben."
 INS_resist_occupation: "Gegen die Besatzung wehren"
 INS_resist_occupation_desc: "Die Wut, die viele Indonesier gegenüber den Niederlanden empfinden, darf nicht dazu führen, dass wir dem Faschismus verfallen. Wir müssen alles in unserer Macht Stehende tun, um der japanischen Invasion Widerstand zu leisten und das Mutterland zu verteidigen."
 INS_local_resistance: "Lokaler Widerstand"
 INS_local_resistance_desc: "Indem wir Widerstandszellen in Territorien aufbauen, die noch nicht besetzt wurden, stellen wir sicher, dass wir im Fall einer Besetzung darauf vorbereitet sind, sie zurückzuerobern."
 INS_stronghold_java: "Festung Java"
 INS_stronghold_java_desc: "Indonesien ist ein riesiges Archipel, das von vielen Völkern bewohnt wird und sich durch das extrem raue Terrain auszeichnet. Der Versuch, jede einzelne Insel, jeden Dschungel und jeden Berg gegen eine Armee zu verteidigen, die weitaus größer ist als die unsere, ist von vornherein zum Scheitern verurteilt. Es ist nicht leicht, unser Volk im Stich zu lassen, doch alle Inseln mit Ausnahme von Java zu evakuieren und unsere gesamte Armee dort zu stationieren, könnte der beste Schritt für die Nation als Ganzes sein."
 INS_silence_nationalists: "Die Sympathisanten der Nationalisten zum Schweigen bringen"
 INS_silence_nationalists_desc: "Die japanische Invasion brachte die revolutionäre Nationalistenbewegung aufgrund ihres gemeinsamen Feindes, den Niederlanden, dazu, die Invasion zu unterstützen. Die durch die Invasion verursachte Instabilität beschleunigt dies nur noch weiter. Wenn wir nicht schnellstens etwas dagegen unternehmen, könnte die Situation völlig außer Kontrolle geraten."
 INS_east_indies_exile_government: "Exilregierung in Niederländisch-Indien"
 INS_east_indies_exile_government_desc: "Niederländisch-Indien ist trotz all unserer Bemühungen gefallen. Wir dürfen die Hoffnung jedoch nicht aufgeben. Wir müssen mit den begrenzten Mitteln, die uns noch zur Verfügung stehen, weitermachen. Wir haben vielleicht die Schlacht verloren, aber den Krieg noch nicht."
 INS_establish_nefis: "NEFIS gründen"
 INS_establish_nefis_desc: "Wir müssen gemeinsam mit den Alliierten in Australien einen Militärnachrichtendienst für Niederländisch-Indien aufbauen. Dies erlaubt es uns, verdecke Operationen durchzuführen, um die japanischen Besatzungstruppen zu sabotieren. Mit jedem kleinen Sieg kommen wir unserer Rückkehr in die Heimat ein Stück näher."
 INS_evacuate_soldiers_to_australia: "Soldaten nach Australien evakuieren"
 INS_evacuate_soldiers_to_australia_desc: "Wir müssen einen Militärstützpunkt in der Nähe der NEFIS-Basis im nördlichen Australien bauen, um dort die KNIL-Soldaten zu stationieren, die der Gefangennahme während der Besatzung entkommen konnten. Dies erlaubt es uns, weiterzukämpfen."
 INS_australian_weapons: "Australische Waffen"
 INS_australian_weapons_desc: "Es ist nicht einfach, Geheimoperationen durchzuführen, und wir benötigen die richtige Ausrüstung, damit sie den von uns gewünschten Ausgang nehmen. Wir könnten australische Fabriken lizenzieren und sie so umbauen, dass sie Waffen für die NEFIS bauen."
 INS_defenders_of_homeland: "Verteidiger des Heimatlands"
 INS_defenders_of_homeland_tt: "Dieser Schwerpunkt wird automatisch abgeschlossen, sobald die „Verteidiger des Vaterlandes“ gegründet werden."
 INS_resist_occupation_tt: "Dieser Schwerpunkt wird automatisch abgeschlossen, sobald wir angegriffen werden und nicht kapitulieren."
 INS_defenders_of_homeland_desc: "Die Regierung von Niederländisch-Indien ist gefallen und ein neues Regime hat die Macht übernommen. Angeführt von den Nationalisten und der japanischen Regierung werden wir eine neue Armee aufstellen, die der KNIL weit überlegen ist, und den Krieg gewinnen. Es ist jedoch nicht abzustreiten, dass dieses Bündnis zwischen Nationalisten und Imperialisten nur allzu instabil ist. Wird das Bündnis überdauern oder wird es in einem Blutbad enden?"
 INS_embrace_co_prosp_sphere: "Der Wohlstandssphäre beitreten"
 INS_embrace_co_prosp_sphere_desc: "Wir setzten der niederländischen Herrschaft endlich ein Ende, und auch wenn wir lediglich einen Herrscher durch einen anderen ersetzten, sind die Versprechen von wirtschaftlichem Wohlstand und Panasiatismus sehr verlockend. Wir unterstützen weiterhin die japanischen Kriegsbemühungen, um sicherzustellen, dass die Niederlande niemals nach Indonesien zurückkehren."
 INS_seize_oppurtunity: "Die Gelegenheit nutzen"
 INS_seize_oppurtunity_desc: "[JAP.GetNameDefCap] verliert, und die Besatzungsregierung ist schwach. Zum ersten Mal seit vielen Jahrhunderten haben wir eine echte Chance, die Ketten, die Indonesien so lange unterdrückten, ein für alle Mal zu sprengen und eine unabhängige Nation aufzubauen. Wenn wir diese Gelegenheit nicht nutzen, um unsere Unabhängigkeit zu erklären, ist nicht abzusehen, wie lange es dauern wird, bis sich die nächste bietet."
 INS_japanese_resource_infrastructure: "Den Kriegsbeitrag vorantreiben"
 INS_japanese_resource_infrastructure_desc: "Dass [JAP.GetNameDef] von uns die Kontrolle über unsere Ressourceninfrastruktur erhält, ist ein notwendiger Schritt, um den Krieg zu gewinnen, da es von größter Wichtigkeit ist, dass das [JAP.GetAdjective]e Militär jederzeit voll versorgt ist. [JAP.GetNameDefCap] wird gleichzeitig unsere lokale Infrastruktur ausbauen, um die Effizienz der Ressourcenexporte zu steigern."
 INS_japanese_army_training: "Die Armee reformieren"
 INS_japanese_army_training_desc: "Wir haben eine Menge von unseren [JAP.GetAdjective]en Herren zu lernen, und da die KNIL aufgelöst wurde, sollten wir eine neue Armee nach dem Vorbild der IJA aufbauen, die bereit ist, Indonesien vor äußeren Bedrohungen zu verteidigen."
 INS_governor_general_de_jonge: "Generalgouverneur de Jonge"
 INS_governor_general_de_jonge_desc: "Bonifacius Cornelis de Jonge ist dafür bekannt, mit eiserner Faust zu herrschen. Er lehnt jede Form des Nationalismus ab und ignoriert häufig die Wünsche des Volksraad. Er gebietet bereits seit langer Zeit über Niederländisch-Indien, und seine Erfahrung reicht bis in den Ersten Weltkrieg zurück, als er als Kriegsminister für Niederländisch-Indien fungierte."
 INS_governor_general_tjarda: "Generalgouverneur Tjarda"
 INS_tjarda_explain_tt: "Die Amtszeit von §YBonifacius Cornelis de Jonge§! ist vorüber und §YAlidius Tjarda van Starkenborgh Stachouwer§! wurde im September 1936 zum Ersatzgouverneur ernannt."
 INS_governor_general_tjarda_desc: "Alidius Tjarda van Starkenborgh Stachouwer hat eine etwas andere Vorstellung von Niederländisch-Indien als sein Vorgänger. Er lehnt den Nationalismus zwar ebenfalls ab, verfolgt jedoch eine etwas liberalere Politik und ist eher bereit, auf die Wünsche des Volksraad einzugehen."
 INS_electrical_investments: "In die Strominfrastruktur investieren"
 INS_electrical_investments_desc: "Jede industrialisierte europäische Großmacht verfügt über ein starkes Stromnetz, das die Industrie unterstützt. Wenn wir nicht mehr auf Rohstoffexporte angewiesen sein und eine eigene Industrie aufbauen wollen, sollten wir ihnen nacheifern und ein Stromnetz schaffen, das sich über ganz Java erstreckt."
 INS_reduce_land_taxes: "Grundsteuern senken"
 INS_reduce_land_taxes_desc: "Die hohen Steuern auf Grundbesitz machten es einheimischen Indonesiern schwer, Plantagen und Unternehmen zu besitzen. Dies erlaubte uns zwar, ein Monopol auf Kautschuk zu erlangen, doch für den Rest des Landes bedeutete es nicht als wirtschaftliche Probleme. Wir sollten diese Steuern senken, damit auch kleinere Kautschukplantagen betrieben werden können, die sich in privater Hand befinden."
 INS_invest_in_batavian_education: "In die Bildung Batavias investieren"
 INS_invest_in_batavian_education_desc: "Der Volksraad machte klar, dass es der Wunsch des indonesischen Volks ist, Bildung zugänglicher zu machen, da sich Bildung derzeit hauptsächlich niederländische Indonesier und die indonesische Elite leisten können. Um dem Antrag des Volksrats nachzukommen, sollten wir mehrere Grund- und weiterführende Schulen in und um Batavia herum bauen."
 INS_javanese_education_investments: "Japanische Bildungsinvestitionen"
 INS_javanese_education_investments_desc: "Zusätzlich zum Bau neuer Grund- und weiterführender Schulen könnten wir eine Volkshochschule und spezialisierte Berufsschulen errichten, um der Mittelschicht den Zugang zu Bildung wesentlich zu erleichtern."
 INS_allow_local_autonomy: "Lokale Autonomie gewähren"
 INS_allow_local_autonomy_desc: "Das Vorstenlanden-System, das den Fürstentümern die Selbstverwaltung gewährt, führte dazu, dass nationalistische Bewegungen kaum Unterstützung finden, und stärkte die Stabilität der Nation insgesamt. Wir sollten den Fürstentümern noch mehr Autonomie einräumen, damit sich die Regierung auf wichtigere Angelegenheiten konzentrieren kann."
 INS_direct_rule: "Direkte Herrschaft"
 INS_direct_rule_desc: "Das Vorstenlanden-System, das den Fürstentümern die Selbstverwaltung gewährt, erschwerte die Verwaltung nur und verursachte zusätzlichen bürokratischen Aufwand. Es ist an der Zeit, das System komplett abzuschaffen und die direkte Herrschaft über den gesamten Archipel durchzusetzen."
 INS_seize_oppurtunity_tt: "§Y[JAP.GetFlag][JAP.GetNameDefCap]§! wurde zurückgedrängt und kontrolliert weniger als §Y[?var:temp_states_plus_more]§! Staaten. (Derzeit: §Y[?var:JAP.num_controlled_states]§!)"
 INS_seize_oppurtunity_refuse_warn_tt: "§REine nationale Revolution wird ausbrechen, die zu einem Krieg mit [HOL.GetName] führen kann§!."
 INS_economic_stabilization: "Stabilisierung der Wirtschaft"
 INS_economic_stabilization_desc: "Die Weltwirtschaftskrise und der weltweite Protektionismus ließen unsere Wirtschaft geschwächt zurück, und viele Indonesier, die einst in der Rohstoffindustrie tätig waren, verloren ihre Arbeit. Wir müssen drastische Maßnahmen ergreifen und ein Arbeitsprogramm schaffen, durch das Bürgern ohne Arbeit welche zugewiesen wird."
 INS_restore_order_in_indies: "Die Ordnung wiederherstellen"
 INS_restore_order_in_indies_desc: "Die aufkeimende nationalistische Bewegung in Niederländisch-Indien destabilisierte bereits mehrere Regionen und könnte außer Kontrolle geraten, wenn wir sie nicht aufhalten. Wir müssen die Ordnung wiederherstellen und Stabilität zu unserer obersten Priorität machen."
 INS_detangle_supply_chains: "Die Lieferketten entwirren"
 INS_detangle_supply_chains_desc: "In unserer Exportwirtschaft müssen Waren Dutzende von Zwischenhändlern durchlaufen, bis sie endlich ihren Bestimmungsort erreichen, und jedes Mal fallen Gebühren, Steuern oder andere Gründe an, die dazu führen, dass sich diese Zwischenhändler einen kleinen Anteil abschöpfen. Wir müssen dieses Durcheinander entwirren und den Großteil der Lieferkette direkt kontrollieren."
 INS_prioritize_industrial_growth: "Industrielles Wachstum priorisieren"
 INS_prioritize_industrial_growth_desc: "Unsere Exportwirtschaft ist zu fragil und zwingt uns, weiterhin mit den Niederlanden zusammenzuarbeiten. Wir müssen eine eigene Industrie aufbauen, indem wir flächendeckend in Batavia Fabriken errichten. Nur dann können wir zur führenden Industrienation im Pazifik aufsteigen."
 INS_closer_economic_ties_to_netherlands: "Engere Wirtschaftsbeziehungen zu den Niederlanden"
 INS_closer_economic_ties_to_netherlands_desc: "Wir können noch viel von den Niederlanden lernen, vor allem in wirtschaftlicher Hinsicht. Indem wir unsere Exportwirtschaft stärker mit den Niederlanden integrieren, könnten wir deren Infrastruktur und Verbindungen nutzen, um lukrativere Handelsabkommen abzuschließen."
 INS_prioritize_dutch_companies: "Niederländische Unternehmen priorisieren"
 INS_prioritize_dutch_companies_desc: "Niederländische Unternehmen wie Shell und Fokker tragen seit Jahrhunderten unsere Wirtschaft, und besonders Shell ist stark in unsere Rohstoffexporte eingebunden, was Niederländisch-Indien erheblichen Wohlstand einbrachte. Damit diese Kooperation auch weiterhin fortbesteht, sollten wir diese Unternehmen kleineren lokalen Firmen gegenüber vorziehen."
 INSHOL_java_factories: "Waffenfabriken auf Java bauen"
 INSHOL_java_factories_desc: "Auch wenn es sich oberflächlich betrachtet um eine einfache Maßnahme handelt, lässt sich nicht leugnen, dass der Bau weiterer Waffenfabriken wesentlich zur Stärkung einer Armee beiträgt. Als industrielles Zentrum der Kolonie ist Java ein naheliegender Standort für deren Errichtung."
 INSHOL_license_dutch_weapon_blueprints: "Niederländische Waffenblaupausen lizenzieren"
 INSHOL_license_dutch_weapon_blueprints_desc: "Anstatt in den Aufbau eines kompletten heimischen Fertigungsprozesses zu investieren und eigene technische Entwürfe zu entwickeln, sollten wir mit niederländischen Unternehmen zusammenarbeiten und deren Waffenbaupläne erwerben."
 INSHOL_bangka_production_lines: "Neue Produktionsanlagen in Bangka"
 INSHOL_bangka_production_lines_desc: "Der rasante Ausbau der Infrastruktur von Bangka im Zuge des Bangka-Projekts machte die einst winzige, weitgehend unbedeutende Insel zum idealen Standort für neue Industrievorhaben. Wir besitzen die Möglichkeit, die KNIL zu stärken, indem wir auf Bangka eine neue Waffenfabrik bauen. Diese wird dort dank der Straßen, der Eisenbahn und der Häfen effizienter arbeiten als andernorts."
 INSHOL_artillerie_inrichtingen: "Artillerie Inrichtingen"
 INSHOL_artillerie_inrichtingen_desc: "Artillerie Inrichtingen stellt seit über 250 Jahren in den Niederlanden Artillerie und andere Waffen her und ist seit mehreren Jahrzehnten in Indien tätig. Eine Erweiterung der Produktionskapazitäten durch die Eröffnung neuer Produktionsstätten in Indien würde die Leistungsfähigkeit der KNIL erheblich verbessern und gleichzeitig die Wirtschaft unterfinanzierter Gebiete durch die Schaffung neuer Arbeitsplätze stärken."
 INSHOL_ai_pyrotechnische: "Artillerie Inrichtingen Pyrotechnische"
 INSHOL_ai_pyrotechnische_desc: "Im Rahmen unseres Vorhabens zur Erweiterung von Produktionsanlagen von Artillerie Inrichtingen in Niederländisch-Indien sollten wir die Gründung einer dortigen Niederlassung der pyrotechnischen Tochtergesellschaft von Artillerie Inrichtingen finanzieren."
 INSHOL_bio_pharma: "Arzneimittelindustrie"
 INSHOL_bio_pharma_desc: "Der Ausbau der Arzneimittelindustrie in Niederländisch-Indien ist der naheliegendste nächste Schritt zur Reformierung der KNIL. Er stellt sicher, dass verwundete Soldaten eine angemessene Behandlung erhalten und sich für den nächsten Einsatz erholen können. Da Chinin in Niederländisch-Indien reichlich vorhanden ist, fallen die Kosten für dieses Projekt deutlich geringer aus."
 INSHOL_develop_fighters: "Neue Jäger entwickeln"
 INSHOL_develop_fighters_desc: "Wir müssen Ingenieure aus Batavia nach Amsterdam entsenden, damit sie sich vor Ort ein Bild von der Jagdflugzeugproduktion bei Fokker machen können und Zugang zu streng gehüteten Fertigungsgeheimnissen erhalten. Wenn sie anschließend zurückkehren, werden sie das nötige technische Wissen haben, das für eine moderne Jagdflugzeugindustrie in Niederländisch-Indien erforderlich ist."
 INSHOL_develop_bombers: "Neue Bomber entwickeln"
 INSHOL_develop_bombers_desc: "Wir müssen Ingenieure aus Batavia nach Amsterdam entsenden, damit sie sich vor Ort ein Bild von der Bomberproduktion bei Fokker machen können und Zugang zu streng gehüteten Fertigungsgeheimnissen erhalten. Wenn sie anschließend zurückkehren, werden sie das nötige technische Wissen haben, das für eine moderne Bomberindustrie in Niederländisch-Indien erforderlich ist."
 INSHOL_bandung_aircraft_facility: "Flugzeugwerk Bandung"
 INSHOL_bandung_aircraft_facility_desc: "Blaupausen und Fertigungsgeheimnisse sind nur nützlich, wenn wir auch Flugzeuge mit ihnen bauen. Wir müssen neue Flugzeugwerke in Bandung bauen, um die Bedürfnisse der ML-KNIL zu erfüllen."
 INSHOL_netherlands_indies_air_doctrine: "Eine Luftdoktrin für Niederländisch-Indien"
 INSHOL_netherlands_indies_air_doctrine_desc: "Wir werden die Luftwaffe anderer Nationen studieren, die vor ähnlichen Herausforderungen stehen wie wir, und auf deren hart erkämpfte Erfahrungen zurückgreifen, um eine Doktrin auszuarbeiten, die zu Niederländisch-Indien passt, ohne diese historischen Fehler zu wiederholen."
 INSHOL_manado_military_academy: "Militärakademie Makassar"
 INSHOL_manado_military_academy_desc: "Eine Militärakademie außerhalb von Java zu gründen, vergrößert unsere Mannstärke erheblich, da dadurch die Wehrpflicht auch auf den östlichen Inseln umsetzbar wird. Makassar, das etwa in der Mitte von Niederländisch-Indien liegt, ist der perfekte Ort dafür."
 INSHOL_infantry_training_in_borneo: "Infanterieausbildung in Borneo"
 INSHOL_infantry_training_in_borneo_desc: "Ostindien ist von dichten Dschungeln, zerklüfteten Bergen und unwegsamem Terrain geprägt. Unsere hauptsächlich auf Java stationierten Soldaten sind auf einen Kampf unter diesen Bedingungen völlig unvorbereitet. Wir müssen die militärische Ausbildung über Java hinaus ausweiten und Übungen in raueren Umgebungen durchführen. Nur wenige Orte auf der Welt können es mit den Dschungeln und Bergen Borneos aufnehmen, was die Insel zum perfekten Ort für die Ausbildung von Rangern macht."
 INSHOL_knil_engineers: "Geniekorps"
 INSHOL_knil_engineers_desc: "Wir dürfen uns nicht voll und ganz auf die Produktion von Infanterie und Gewehren konzentrieren, sondern müssen bedenken, dass Logistik und Kommunikation eine entscheidende Rolle beim Gewinnen von Schlachten spielen. Wir sollten Pioniere ausbilden und batavische Berufsschulen finanziell unterstützen, um sicherzustellen, dass unsere Armee nicht durch mangelhafte Logistik behindert wird."
 INSHOL_work_with_oil_barons: "Mit den Ölbaronen zusammenarbeiten"
 INSHOL_work_with_oil_barons_desc: "Die Weltwirtschaftskrise setzte unserer Exportwirtschaft schwer zu. Es könnte sinnvoll sein, einen Teil der Verhandlungen über den Ölverkauf an die Ölbarone in Sumatra auszulagern, damit diese sicherstellen, dass das Öl auch verkauft wird. Dies wird jedoch seinen Preis haben, denn um ihre Zustimmung zu erlangen, werden wir das Öl zu erheblich unter dem Marktpreis liegenden Konditionen verkaufen müssen."
 INSHOL_rubber_taxation: "Kautschukbesteuerung"
 INSHOL_rubber_taxation_desc: "Niederländische Investitionen und Fachkenntnis machten die Kautschukplantagen in Niederländisch-Indien zu einem der wertvollsten Vermögenswerte des Reichs. Es ist nur gerecht, dass die Krone ihren rechtmäßigen Anteil an dem von ihr geschaffenen Reichtum einfordert. Auch wenn einige lokale Politiker protestieren mögen, dürfen die Interessen des Reichs nicht von provinziellen Unruhen bestimmt werden."
 INSHOL_padang_port: "Handelshafen Padang"
 INSHOL_padang_port_desc: "Rohstoffe aus Padang müssen zunächst nach Java transportiert werden, bevor sie die Weltmärkte erreichen können, da es der Region an der nötigen Infrastruktur mangelt, um große Transportkonvois abzufertigen. Dieser unnötige Umweg belastet unsere Lieferkette und schränkt das wirtschaftliche Potenzial Sumatras ein. Durch den Bau eines großen Frachthafens in Padang beseitigen wir diesen Umweg und steigern so die Rentabilität der Plantagen."
 INSHOL_subsidize_bauxite: "Bauxit-Projekte subventionieren"
 INSHOL_subsidize_bauxite_desc: "Das derzeit in Indonesien durchgeführte Projekt zur Modernisierung der bauxitreichen Bangka-Belitung-Inseln ist sehr vielversprechend und das Potenzial für langfristige Gewinne hoch. Wir müssen die indonesische Regierung finanziell unterstützen, um das Projekt voranzutreiben."
 INSHOL_agricultural_subsidies: "Den landwirtschaftlichen Sektor privatisieren"
 INSHOL_agricultural_subsidies_desc: "Indem wir die Gründung privater landwirtschaftlicher Betriebe unterschiedlicher Größe erlauben, beschleunigen wir den Ausbau der Infrastruktur in unterfinanzierten ländlichen Regionen und generieren gleichzeitig Einnahmen für den Staat. Dafür muss jedoch zuerst ein Steuerrahmen geschaffen werden, durch den alle von diesen Betrieben erzielten Steuereinnahmen direkt an die Niederlande abgeführt werden, anstatt zunächst über Niederländisch-Indien zu laufen."
 INSHOL_import_sugar: "Zucker importieren"
 INSHOL_import_sugar_desc: "Wir müssen für den wachsenden Agrarsektor von Niederländisch-Indien Preisregulierungen einführen, um den gesamten Zuckerbedarf der Nation mit Plantagen aus Niederländisch-Indien zu decken und das zu Preisen, mit denen keine andere Regierung konkurrieren kann. Wir müssen ein Monopol auf Zucker aufbauen!"
 INSHOL_import_lumber: "Holz importieren"
 INSHOL_import_lumber_desc: "Wir müssen für den wachsenden Agrarsektor von Niederländisch-Indien Preisregulierungen einführen, um den gesamten Holzbedarf der Nation durch Niederländisch-Indien zu decken und das zu Preisen, mit denen keine andere Regierung konkurrieren kann. Wir müssen ein Monopol auf Holz aufbauen!"
 INSHOL_industrialized_colony: "Industrialisierte Kolonie"
 INS_no_peta_tt: "Indonesien ist nicht in der Lage, mit ausländischen Angreifern zusammenzuarbeiten."
 INSHOL_industrialized_colony_desc: "Niederländisch-Indien, einst eine bescheidene Kolonie, entwickelte sich zu einer der am stärksten industrialisierten und wohlhabendsten Regionen Asiens. Dies ist ein Meilenstein in der Geschichte der Niederlande und der Menschheit. Unsere Bemühungen trugen Früchte. Indem wir weiter in die Entwicklung unserer Kolonie investieren, wird die Niederlande wieder zu einer Weltmacht aufsteigen."
 INSHOL_economic_integration: "Wirtschaftliche Integration"
 INSHOL_economic_integration_desc: "Niederländisch-Indien ist das strahlende Juwel unseres Reichs, und der Wohlstand der Kolonie wird durch die beständige Führung der Königin, des Premierministers und des Generalgouverneurs gesichert. Wir dürfen nicht zulassen, dass diese Stabilität durch die unüberlegte Forderung nach Unabhängigkeit gefährdet wird, da dies nur Unordnung und Niedergang mit sich brächte. Wir müssen die Volkswirtschaften der Niederlande und die von Niederländisch-Indien noch enger miteinander verflechten und so für anhaltende Stabilität und Wachstum sorgen."
 INSHOL_republic_of_indonesia: "Republik Indonesien"
 INSHOL_republic_of_indonesia_desc: "Als die Niederlande der Soetardjo-Petition widerwillig zustimmten, wurde die Unabhängigkeit Indonesiens an eine lange Liste von Bedingungen geknüpft, die erfüllt sein müssen, um als wirtschaftlich selbstständig zu gelten. Dank der Entschlossenheit des indonesischen Volks sind diese Bedingungen inzwischen vollständig erfüllt und den Niederlanden bleibt nichts anderes übrig, als unsere formelle Unabhängigkeitserklärung anzuerkennen."
 INSHOL_propose_malay_unification: "Malaiische Vereinigung vorschlagen"
 INSHOL_propose_malay_unification_desc: "Im indonesischen Archipel sind Hunderte von Kulturen, Sprachen und Volksgruppen beheimatet. Manche von ihnen ähneln sich stark, wohingegen andere große Unterschiede aufweisen. Durch den gemeinsamen Kampf gegen die Kolonialherrschaft fanden wir jedoch ein gemeinsames Ziel: ein unabhängiges Indonesien. Vielleicht sollten wir uns fragen, warum diese Einheit hier enden muss, wo doch jenseits der Meerenge die Menschen in Malaya weitgehend dieselbe Geschichte und dieselben Bestrebungen teilen wie wir?"
 INSHOL_singapore_compromise: "Singapurkompromiss"
 INSHOL_singapore_compromise_desc: "Singapur gehört historisch und kulturell gesehen zu Indonesien, und es ist daher nur natürlich, dass es in ein vereintes Indonesien aufgenommen wird. Großbritannien ist jedoch nicht bereit, Singapur aufzugeben, da es von strategischer Bedeutung ist und als Militärstützpunkt gebraucht wird. Wir sollten den Briten einen Kompromiss vorschlagen, wonach Singapur der Union unter der Bedingung beitritt, dass Großbritannien weiterhin Truppen auf der Insel stationieren darf."
 INSHOL_request_ceylon: "Übergabe von Ceylon fordern"
 INSHOL_request_ceylon_desc: "Die britische Kolonie Ceylon ist kulturell und sprachlich eng mit der malaiischen Welt verbunden. Mit dem Wachstum der pan-malaiischen Föderation Maphilindo erscheint es nur folgerichtig, dass auch diese Insel ihren Platz in der Konföderation einnimmt."
 INSHOL_papua_referendum: "Referendum in Papua"
 INSHOL_papua_referendum_desc: "Die Insel Papua ist zwischen Indonesien und Australien aufgeteilt. Während die von uns getätigten Investitionen und Entwicklungsmaßnahmen unsere Hälfte der Insel in eine wachsende und wohlhabende Region verwandelten, wurde das von Australien verwaltete Territorium weitgehend vernachlässigt und ist unterentwickelt. Die Zukunft der Insel sollte in den Händen ihrer Bevölkerung liegen. Wir müssen ein offizielles Referendum über die Vereinigung Papuas fordern!"
 INSHOL_invite_phillipines: "Gründung von Maphillindo vorschlagen"
 INSHOL_invite_phillipines_desc: "Unsere Union setzt sich aus unterschiedlichen Völkern zusammen, die verschiedene Sprachen sprechen und unterschiedliche Traditionen pflegen, doch fast alle haben ihre Wurzeln in der malaiischen Welt. Wir müssen unseren losen Staatenbund zu einer panmalaiischen Konföderation reformieren und die Philippinen als Mitgliedstaat einladen. Was einst mehrere unbedeutende Kolonien waren, wird sich als Regionalmacht von Südostasien erheben."
 INS_focus_time_reduce_usa_tt: "§Y$INS_realign_supply_chains$§! reduziert die erforderliche Zeit für diesen Schwerpunkt um 70 Tage."
 INS_focus_time_reduce_jap_tt: "§Y$INS_first_come_first_serve$§! reduziert die erforderliche Zeit für diesen Schwerpunkt um 70 Tage."
 INS_focus_time_reduce_fokker_tt: "§Y$INSHOL_east_indies_fokker_division$§! reduziert die erforderliche Zeit für diesen Schwerpunkt um 35 Tage."
 INS_focus_time_reduce_tjarda_tt: "§Y$INS_governor_general_tjarda$§! reduziert die erforderliche Zeit für diesen Schwerpunkt um 35 Tage."
 INS_focus_time_reduce_pki_tt: "§Y$INS_utilize_tan_malakas_militia$§! reduziert die erforderliche Zeit für diesen Schwerpunkt um 35 Tage."
