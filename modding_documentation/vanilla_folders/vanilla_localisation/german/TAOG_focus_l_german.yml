l_german:
 INS_nationalize_companies_tt: "Alle militärisch-industriellen Organisationen und Industriekonzerne werden verstaatlicht und erhalten neue Namen."
 available_focus_tt: "§GVerfügbare§! Schwerpunkte:\n"
 INS_is_union_tt: "Gründete die Niederländisch-Indonesische Union"
 INS_is_union_tt_NOT: "Gründete NICHT die Niederländisch-Indonesische Union"
 INS_denounce_soetardjo: "Soetardjo denunzieren"
 INS_denounce_soetardjo_tt: "Wir beginnen mit der Planung einer Untergrundrevolution, um die Regierung zu unterwandern und Guerillazellen auf dem gesamten Archipel aufzubauen. Sobald die nötigen Vorbereitungen getroffen sind, werden wir einen Guerillakrieg für die Unabhängigkeit gegen die Niederlande beginnen."
 INS_soetardjo_petition_debate_done_tt: "Die Debatte im Volksraad bezüglich Soetardjos Antrag für mehr Autonomie ist beendet"
 INS_tkr_tt: "Modifiziert §YVolkssicherheitsarmee§! um:"
 INS_commander_sudirman_tt: "§YSudirman§!([INS.GetFlag]) wird zum §YFeldmarschall§! befördert"
 INS_the_declaration_of_independence: "Unabhängigkeitserklärung"
 INS_the_declaration_of_independence_desc: "Wir können es nicht riskieren, noch länger zu warten. Wir müssen das Eisen schmieden, solange es heiß ist und unsere Milizen entsenden, um Häfen, Städte und Industriezentren schnellstmöglich unter unsere Kontrolle zu bringen, damit den niederländischen Behörden keine Zeit zum Reagieren bleibt. Im Anschluss erklären wir die Unabhängigkeit und rufen die Republik Indonesien aus."
 INS_the_declaration_of_independence_tt: "Wir rufen unsere §YUnabhängigkeit§! aus. Jeder Staat, in dem wir einen §YMilizenstützpunkt§! oder ein §YHauptquartier§! errichtet haben, fällt unter unsere Kontrolle. Alle anderen Staaten bleiben bei [HOL.GetName]\n\n[HOL.GetNameDefCap] erkennt unsere Souveränität nicht an und es wird zu einem kleineren Konflikt kommen. Dieser kann zu einem §RKrieg§! eskalieren.\n\nSchaltet Landüberfälle frei, um Staaten zu übernehmen."
 INSHOL_the_declaration_of_independence: "Die Nationale Revolution"
 INS_laskar_rakjat: "Laskar Rakyat"
 INS_laskar_rakjat_desc: "Die Revolution setzt sich aus vielen verschiedenen Milizen in ganz Indonesien zusammen, einige kleiner, andere größer. Die Koordination dieser Milizen ist ein wichtiger Schritt, um den Sieg zu erringen. Wir müssen jedoch behutsam vorgehen, da die Stärkung von Milizen, die Verbindungen zu unseren politischen Rivalen besitzen, katastrophale Folgen haben könnte."
 INS_militia_tt: "Erschafft die neue Miliz-Divisionsvorlage §YFreiheitskämpfer§! und schaltet Entscheidungen für sie frei."
 INS_militia_warning_tt: "Milizen sind §Yhalbautonome§! Gruppen von Freiheitskämpfern. Sie kämpfen für uns, doch diese Hilfe ist nicht umsonst. Sie erwarten eine Entschädigung für ihre Hilfe. §RIhren Forderungen nicht nachzukommen, verringert die Stabilität!§!"
 INS_usa_tanks_opinion_mod: "Kaufte unsere Panzer"
 INS_republic_add_generals_tt: "(§Y$INS_sudirman$§!([INS.GetFlag]), §Y$INS_soengkono$§!([INS.GetFlag]), §Y$INS_supriyadi$§!([INS.GetFlag]), §Y$INS_djatikoesoemo$§!([INS.GetFlag]) und §Y$INS_maludin_simbolan$§!([INS.GetFlag])) werden Generäle."
 INS_big_militia_presence_tt: "Wird nach der Unabhängigkeitserklärung von unseren Milizen kontrolliert werden."
 INS_prepare_raiding_bases: "Überfallbasen vorbereiten"
 INS_prepare_raiding_bases_desc: "Wir nutzen unser Spionagenetzwerk, um insgeheim im gesamten Archipel Bunker zu errichten, die uns bei der bevorstehenden Revolution stärken werden."
 # <Joint Tree - Central Milestones>
 INSHOL_dutch_east_indies: "Niederländisch-Indien"
 INSHOL_dutch_east_indies_desc: "Die Kolonie wurde vor fast 500 Jahren gegründet und nahm seither viele Formen an. Die Welt verändert sich in rasantem Tempo, und unser heutiges Handeln wird die künftigen niederländisch-indonesischen Beziehungen prägen."
 INSHOL_the_war_in_europe: "Krieg in Europa"
 INSHOL_the_war_in_europe_desc: "Der Konflikt in Europa eskaliert immer weiter, und auch die Niederlande befinden sich nun im Krieg. Wir können uns nicht länger darauf verlassen, dass sie uns schützen. Wir müssen auf eigenen Beinen stehen, um nicht Gefahr zu laufen, von fremden Mächten überrannt zu werden."
 # <Joint Tree - Military Equipment Contracts>
 INSHOL_military_equipment_contracts: "Militärausrüstungsverträge"
 INSHOL_military_equipment_contracts_desc: "Indonesien ist ein riesiger Archipel mit mehreren Millionen Einwohnern. Wir sind noch weit davon entfernt, über die industriellen Kapazitäten zu verfügen, die für unsere Verteidigung nötig wären. Was wir jedoch zur Genüge haben, sind Ressourcen, um weltweit Handelsabkommen zu sichern. Durch den Abschluss von Verträgen mit Demokratien auf der ganzen Welt lässt sich unser Problem lösen."
 INSHOL_hawk_75a7: "Hawk 75a-7"
 INSHOL_hawk_75a7_desc: "Das amerikanische Jagdflugzeug Hawk 75A-7 ist ideal für die Gegebenheiten in Niederländisch-Indien geeignet und dazu noch preiswert und leistungsstark. Wir sollten eine Vereinbarung mit dem Hersteller treffen, um die dringend nötigen Verbesserungen an unserer Luftwaffe vorzunehmen."
 INSHOL_purchase_american_tanks: "Amerikanische Panzer kaufen"
 INSHOL_purchase_american_tanks_desc: "Da es Niederländisch-Indien an der für den Panzerbau erforderlichen Industrie fehlt, müssen wir uns anderweitig umsehen. Wir können Panzer direkt aus den Vereinigten Staaten beziehen, finanziert durch die Kautschukindustrie von Niederländisch-Indien."
 INSHOL_purchase_british_artillery: "Britische Artillerie kaufen"
 INSHOL_purchase_british_artillery_desc: "Wir können unsere Artillerieproduktion nach Großbritannien auslagern, um Kapazitäten für andere Ausrüstung zu schaffen."
 INSHOL_produce_own_goods: "Eigene Waren herstellen"
 INSHOL_produce_own_goods_desc: "Wir besitzen zwar die Mittel, zahlreiche lukrative Handelsabkommen abzuschließen, doch wir sollten auch unsere eigenen Produktionsanlagen und unsere Rüstungsindustrie nicht vernachlässigen. Wir müssen diese Unternehmen subventionieren, damit wir weniger abhängig von Importen aus dem Ausland sind."
 # <Joint Tree - East Indies Investments>
 INSHOL_east_indies_investments: "Investitionen in Niederländisch-Indien"
 INSHOL_east_indies_investments_desc: "Eine gute Kolonialmacht investiert in die Entwicklung ihrer Kolonien. Investitionen in Niederländisch-Indien sind in unserem besten Interesse und kommen der Bevölkerung der Kolonie zugute."
 INSHOL_east_indies_student_exchange: "Studentenaustauschprogramm"
 INSHOL_east_indies_student_exchange_desc: "Ein System zu schaffen, das es Indonesiern erlaubt, in die Niederlande zu ziehen, um an unseren Universitäten zu studieren, kann sowohl für die niederländische als auch für die indonesische Wirtschaft einen erheblichen Gewinn darstellen."
 INSHOL_east_indies_fokker_division: "Fokker-Division für Niederländisch-Indien"
 INSHOL_east_indies_fokker_division_desc: "Fokker erhält von der Luftwaffe Niederländisch-Indiens so viele Aufträge, dass es sich lohnen könnte, eine eigene Tochtergesellschaft zu gründen."
 INSHOL_expand_shell: "Shells Infrastruktur ausbauen"
 INSHOL_expand_shell_desc: "Shell gewinnt in unserer Wirtschaft zunehmend an Bedeutung. Wir müssen die Ölinfrastruktur in Niederländisch-Indien ausbauen, um mit der Exportkapazität von Shell Schritt zu halten."
 INSHOL_increase_funding_for_tix: "Finanzierung für die T.IX-Flugzeuge aufstocken"
 INSHOL_increase_funding_for_tix_desc: "Die Ingenieure bei Fokker entwickeln einen neuen zweimotorigen Bomber, der die veralteten Modelle der niederländisch-indischen Luftwaffe ersetzen soll. Dem Projekt wurde derzeit jedoch nur ein sehr geringes Budget zugewiesen, und es dauert wahrscheinlich noch sehr lange, bis die Flugzeuge einsatzbereit sind. Wir sollten die Mittel aufstocken, um den Fortschritt zu beschleunigen."
 INSHOL_reduce_land_ownership_taxes: "Grundbesitzsteuern senken"
 INSHOL_reduce_land_ownership_taxes_desc: "Wir müssen die Steuern für indonesische Grundbesitzer senken, um die Entwicklung landwirtschaftlicher Betriebe und Unternehmen zu fördern."
 INSHOL_coffee_plantations: "Kaffeeplantagen"
 INSHOL_coffee_plantations_desc: "Wir müssen mehr Land für den Staat auf den östlichen Inseln erwerben, da es ideal für den Anbau von Kaffee geeignet ist."
 INSHOL_overallwagen: "Overvalwagen"
 INSHOL_overallwagen_desc: "Panzer sind nicht unbedingt die Lösung. Uns fehlen einerseits die industriellen Kapazitäten, die für ihre Herstellung erforderlich sind, und aufgrund des unwegsamen Geländes sind sie nur für wenige Einsätze wirklich geeignet. Wir sollten stattdessen in den Bau von Panzerwagen investieren, um diese Lücke zu schließen."
 INSHOL_indonesian_cheap_labor: "Günstige Arbeitskräfte aus Indonesien"
 INSHOL_indonesian_cheap_labor_desc: "$CONGO_cheap_labor_desc$" #LL: stealing this to save time, hope you don't mind!
 INSHOL_eastern_development_fund: "Entwicklungsfonds für die östlichen Inseln"
 INSHOL_eastern_development_fund_desc: "Wir konzentrieren uns zu sehr auf Investitionen in Java und Sumatra und vernachlässigen dabei den Großteil der Kolonie. Wir müssen die Infrastruktur im Osten ausbauen, um eine künftige Industrialisierung zu ermöglichen."
 INSHOL_increase_rubber_taxes: "Kautschuksteuer erhöhen"
 INSHOL_increase_rubber_taxes_desc: "Viele Kautschukunternehmen in Niederländisch-Indien häufen durch die Ausbeutung der kolonialen Ressourcen immensen Reichtum an. Es ist nur gerecht, dass wir diese Unternehmen höher besteuern."
 INSHOL_reform_knil: "Die KNIL reformieren"
 INSHOL_reform_knil_desc: "Seit Niederländisch-Indien das gesamte Archipel übernahm, wurden der Königlichen Niederländisch-Indischen Armee kaum noch Gelder zugewiesen. Angesichts der weltweiten Spannungen sollten wir schnellstmöglich mit der Wiederaufrüstung beginnen."
 INSHOL_fund_ml_knil: "Die ML-KNIL finanzieren"
 INSHOL_fund_ml_knil_desc: "Wenn unsere Armee mit den restlichen Armeen der Welt Schritt halten soll, müssen wir eine eigene Luftwaffe aufbauen. Es nicht zu tun, würde uns in eine sehr unvorteilhafte Position versetzen."
 INSHOL_bandung_aircraft_facility_tt: "§YWestjava:§!\n    Erhält §G1§! Bauplatz und §G1§! §YMilitärfabrik§! für jeden abgeschlossenen vorausgegangenen Schwerpunkt."
 INSHOL_rangers: "Ranger"
 INSHOL_rangers_desc: "Indonesien ist ein riesiger Archipel mit einer vielfältigen Landschaft. Wir müssen in die Ausbildung von Rangern investieren, die für den Einsatz in dieser rauen Umgebung bestens gerüstet sind."
 INSHOL_mountaineers: "Gebirgsjäger"
 INSHOL_mountaineers_desc: "Wir sollten uns auf die Ausbildung von Gebirgsjägern konzentrieren, die bestens darin bewandert sind, in der rauen Umgebung unseres Archipels zu kämpfen."
 INSHOL_elevate_elite_infantry: "Depot Speciale Troepen"
 INSHOL_elevate_elite_infantry_desc: "Wir können uns nicht ewig auf ausgedehnte Kriegspläne verlassen. Wir müssen uns an neue Technologien anpassen und sicherstellen, dass wir nicht ins Hintertreffen geraten. Durch die Rekrutierung weiterer Elite-Infanteriedivisionen sind wir bestens darauf vorbereitet, in den unterschiedlichsten Umgebungen zu kämpfen."
 INSHOL_modernize_knil: "Die KNIL modernisieren"
 INSHOL_modernize_knil_desc: "Wir müssen neue Strategien und Doktrinen für die Armee von Niederländisch-Indien ausarbeiten, um sicherzustellen, dass wir stets einen Vorsprung vor unseren Feinden haben."
 INSHOL_transfer_of_henri_winkelman: "Henri Winkelman überstellen"
 INSHOL_transfer_of_henri_winkelman_desc: "Henri Winkelman war viele Jahre lang in der KNIL tätig. Heute braucht ihn Niederländisch-Indien erneut, und wir sollten seine offizielle Versetzung veranlassen."
 INSHOL_eastern_conscription: "Einen Hilfstrupp aufstellen"
 INSHOL_eastern_conscription_desc: "Auf Java und Madura gibt es mehrere einheimische Hilfstruppen, die von lokalen Machthabern befehligt werden. Da wir in schwierigen Zeiten leben, sollten wir ein Abkommen darüber schließen, um diese Einheiten unter unsere Befehlsgewalt zu stellen."
 INSHOL_establish_vk_knil: "Die VK-KNIL gründen"
 INSHOL_establish_vk_knil_desc: "Wir müssen ein Freiwilligenkorps für Frauen innerhalb der KNIL gründen. Ihr Einsatz wird entscheidend dazu beitragen, unsere Logistik und Kommunikation zu verbessern."
 INSHOL_emergency_dockyard_construction: "Werften für den Notfall bauen"
 INSHOL_emergency_dockyard_construction_desc: "Die Gefahr einer Invasion vom Meer aus ist nicht zu unterschätzen. Wir müssen unserer Marineverteidigung höchste Priorität einräumen."
 INSHOL_emergency_powers_gov_general: "Notbefugnisse für den Kolonialgeneral"
 INSHOL_emergency_powers_gov_general_desc: "Der andauernde Krieg erfordert, dass schwierige Entscheidungen unverzüglich getroffen werden müssen. Dies ist jedoch nicht möglich, wenn alle Entscheidungen in Niederländisch-Indien zuvor von den Niederlanden abzusegnen sind. [INS.GetLeader] muss Notbefugnisse erhalten, damit er ohne Verzögerung handeln kann."
 INSHOL_emergency_naval_purchases: "Schiffe für den Notfall kaufen"
 INSHOL_emergency_naval_purchases_desc: "Unsere Küsten sind nicht sicher und nur unzureichend geschützt, und die Zeit drängt. Wir müssen unsere Marinepräsenz verstärken, wenn wir überleben wollen. Mithilfe von Krediten werden wir Schiffe von privaten Unternehmen kaufen und sie zu Zerstörern umbauen."
 INSHOL_east_indies_navy: "Ostindien-Flotte"
 INSHOL_east_indies_navy_desc: "[INS.GetNameDefCap] besitzt keine offizielle Marine, weshalb die Niederlande mit dem Schutz der Kolonie betraut sind. Angesichts der wachsenden Spannungen in Europa und Asien können wir dies jedoch nicht mehr länger garantieren. Wir müssen eine eigene [INS.GetAdjective]e Marine aufbauen."
 INSHOL_marines: "Marineinfanterie"
 INSHOL_marines_desc: "Wir sollten innerhalb der Strukturen der Marine eine Marineinfanterie aufbauen und Marinesoldaten zur Ausbildung auf niederländische Schiffe schicken."
 INSHOL_domestic_ship_production: "Inländische Schiffsproduktion"
 INSHOL_domestic_ship_production_desc: "Wenn unsere Marine unseren Nachbarn die Stirn bieten soll, müssen wir damit beginnen, die Schiffsproduktion im Inland hochzufahren."
 INSHOL_destroyers: "Zerstörer"
 INSHOL_destroyers_desc: "Unsere schwereren Kriegsschiffe sind für die engen Gewässer des Archipels nur mäßig geeignet und brauchen Begleitschiffe, die ihnen Deckung geben. Durch den Bau moderner Zerstörer ist die [ROOT.GetAdjective]e Marine in der Lage, die Schifffahrtswege zu sichern und Torpedoboote aus der Meerenge zu vertreiben."
 INSHOL_cruisers: "Kreuzer"
 INSHOL_cruisers_desc: "Eine Flotte ohne Schlachtschiffe muss sich auf ihre Kreuzer verlassen können. Durch den Aufbau einer starken Kreuzerflotte erhält die [ROOT.GetAdjective]e Marine einen robusten Kern, der in der Lage ist, die weiten Strecken zwischen den Inseln zu patrouillieren und jedem Angreifer entgegenzutreten, der in unsere Gewässer eindringt."
 INSHOL_submarines: "U-Boote"
 INSHOL_submarines_desc: "Die Meerengen Ostindiens eignen sich hervorragend für Hinterhalte, und ein U-Boot kostet weit weniger als das Kriegsschiff, das es auf den Grund schickt. Eine starke U-Boot-Flotte erlaubt es der [ROOT.GetAdjective]en Marine, die Seewege zu kontrollieren und feindliche Schiffe anzugreifen, ohne sich jemals zeigen zu müssen."
 INSHOL_outsourced_navy: "Produktion an Unternehmen auslagern"
 INSHOL_outsourced_navy_desc: "Unsere Ausgaben sind ohnehin schon hoch genug, und wir können nicht noch weitere Mittel aus dem Kolonialhaushalt an die Marine umleiten. Wir müssen Unternehmen dafür bezahlen, die Produktion für uns zu übernehmen."
 INSHOL_divert_civilian_to_navy: "Zivil- und Armee-Gelder an die Marine umleiten"
 INSHOL_divert_civilian_to_navy_desc: "Angesichts der derzeitigen Weltlage ist das Risiko einer Invasion über das Meer größer denn je. Wir können es uns nicht leisten, sparsam zu sein. Wir müssen Mittel aus allen Bereichen der Regierung zugunsten der Marine umschichten."
 INS_netherlands_can_remove_autonomy_tt_50: "\nWenn [HOL.GetFlag]§Y[HOL.GetNameDef]§! diesen Schwerpunkt zuerst abschließt:\n    ([INS.GetFlag]§Y[INS.GetName]§!): Erhält §Y£autonomy_texticon -50.00§!"
 INS_netherlands_can_remove_autonomy_tt_75: "\nWenn [HOL.GetFlag]§Y[HOL.GetNameDef]§! diesen Schwerpunkt zuerst abschließt:\n    ([INS.GetFlag]§Y[INS.GetName]§!): Erhält §Y£autonomy_texticon -75.00§!"
 INS_netherlands_can_remove_autonomy_tt_100: "\nWenn [HOL.GetFlag]§Y[HOL.GetNameDef]§! diesen Schwerpunkt zuerst abschließt:\n    ([INS.GetFlag]§Y[INS.GetName]§!): Erhält §Y£autonomy_texticon -100.00§!"
 INS_netherlands_can_remove_autonomy_tt_150: "\nWenn [HOL.GetFlag]§Y[HOL.GetNameDef]§! diesen Schwerpunkt zuerst abschließt:\n    ([INS.GetFlag]§Y[INS.GetName]§!): Erhält §Y£autonomy_texticon -150.00§!"
 INS_netherlands_can_remove_autonomy_tt_200: "\nWenn [HOL.GetFlag]§Y[HOL.GetNameDef]§! diesen Schwerpunkt zuerst abschließt:\n    ([INS.GetFlag]§Y[INS.GetName]§!): Erhält §Y£autonomy_texticon -200.00§!"
 INS_netherlands_can_remove_autonomy_tt_250: "\nWenn [HOL.GetFlag]§Y[HOL.GetNameDef]§! diesen Schwerpunkt zuerst abschließt:\n    ([INS.GetFlag]§Y[INS.GetName]§!): Erhält §Y£autonomy_texticon -250.00§!"
 INSHOL_begin_negotiations_soetardjo: "Mit Soetardjo verhandeln"
 INSHOL_begin_negotiations_soetardjo_desc: "Soetardjos Petition für mehr Autonomie ist vielversprechend und bietet uns die Möglichkeit, einen Kompromiss zwischen den Nationalisten und den Loyalisten zu finden. Wir sollten offizielle Verhandlungen mit seiner Partei aufnehmen."
 INSHOL_urge_gov_veto: "Gouverneursveto fordern"
 INSHOL_urge_gov_veto_desc: "Die Soetardjo-Petition ist ein von den Nationalisten geschmiedetes Komplott, auf das die Regierung von Niederländisch-Indien hereinfiel. Wir müssen den Generalgouverneur dazu anhalten, ein Veto einzulegen, damit wir die Kolonie nicht verlieren."
 INSHOL_eventual_autonomy: "Späterer Autonomie zustimmen"
 INSHOL_eventual_autonomy_desc: "Der Wunsch Indonesiens nach Unabhängigkeit ist stark und lässt nicht nach. Wir werden einer späteren Autonomie für Indonesien zustimmen, jedoch erst, wenn die Kolonie bewiesen hat, dass sie sich selbst tragen kann und weiterhin an den demokratischen Idealen festhält."
 INSHOL_autonomous_dominion: "Die Soetardjo-Petition von [GetYear]"
 INSHOL_autonomous_dominion_desc: "Trotz der unrealistischen Definition von ‚Eigenständigkeit‘, die die Niederlande als Voraussetzung für die Gültigkeit der Soetardjo-Petition festgelegt hatten, war der indonesische Wille zur Unabhängigkeit stark genug, die Anforderungen zu erfüllen. Entsprechend der Vereinbarung erhalten wir unsere vollständige und bedingungslose Unabhängigkeit von der niederländischen Krone."
 INS_cannot_become_independent_tt: "§W§Y[INS.GetFlag][INS.GetNameDefCap]§! kann ohne fremde Intervention §Rniemals selbst mehr die Unabhängigkeit§! anstreben.§!"
 INSHOL_sideline_the_volksraad: "Den Volksraad übergehen"
 INSHOL_sideline_the_volksraad_desc: "Die von Soetardjo eingereichte Petition verstößt eindeutig gegen Artikel 1 der niederländischen Verfassung und wird der Verwaltung in Niederländisch-Indien nur Schwierigkeiten bereiten. Die Petition muss abgelehnt werden."
 INSHOL_prioritize_dutch_profits: "Niederländische Gewinne priorisieren"
 INSHOL_prioritize_dutch_profits_desc: "Wir richten unsere Anstrengungen darauf aus, die Gewinne für unser Heimatland zu steigern. Seine wirtschaftliche Stabilität liegt im Interesse des gesamten Königreichs."
 INSHOL_development_loans_netherlands: "Entwicklungskredite aus den Niederlanden"
 INSHOL_development_loans_netherlands_desc: "Wir können Kredite bei niederländischen Unternehmen aufnehmen, um unsere Industrialisierung voranzutreiben. Wir können dabei zwar unsere Stellung als Kolonie nutzen, um uns einen niedrigen Zinssatz zu sichern, aber trotzdem müssen wir Zinsen zahlen."
 INSHOL_request_economic_dev_subsidy: "Um wirtschaftliche Entwicklungssubventionen bitten"
 INSHOL_request_economic_dev_subsidy_desc: "Wir bewiesen unserem Suzerän, dass wir eine profitable Kolonie sind. Wir können das als Verhandlungsargument nutzen, um Subventionen für die industrielle Entwicklung zu erhalten."
 INSHOL_loyalty_to_crown: "Loyalität gegenüber der Krone"
 INSHOL_loyalty_to_crown_desc: "Niederländisch-Indien ist vieles, aber vor allem sind wir eine treue niederländische Kolonie. Königin Wilhelmina wird uns zum Sieg führen. Wir dürfen nicht zulassen, dass der Nationalismus fast 500 Jahre Geschichte zunichtemacht. Wir müssen weiterhin unsere uneingeschränkte Treue zur Krone bekräftigen."
 INS_loans_timer: "\nIn §Y365§! Tagen:"
 INS_expand_batavia_med_school_tt: "§Y$INS_dutch_east_indies$§!: Forschungsgeschwindigkeit beträgt mindestens §G1.00%§!."
 INS_subsidize_local_business: "Lokale Unternehmen subventionieren"
 INS_subsidize_local_business_desc: "Wir müssen lokale Unternehmen subventionieren, um das Wirtschaftswachstum anzukurbeln und unsere Wirtschaft langfristig zu stärken."
 INSHOL_education_reforms: "Bildungsreformen"
 INSHOL_education_reforms_desc: "Viele Bewohner von Niederländisch-Indien haben keinen Zugang zu Bildung, und nur wenige verfügen über einen Abschluss einer weiterführenden Schule. Wenn Niederländisch-Indien jemals zu einem wohlhabenden Industriestaat werden soll, müssen wir dafür sorgen, dass die Bevölkerung angemessenen Zugang zu Bildung erhält."
 INS_expand_batavia_med_school: "Die Hochschule für Medizin von Batavia vergrößern"
 INS_expand_batavia_med_school_desc: "Indem wir den Campus der medizinischen Hochschule in Batavia erweitern und mehr Professoren einstellen, verbessern wir den Zugang zu höherer Bildung erheblich, was für unser langfristiges Wirtschaftswachstum von entscheidender Bedeutung ist."
 INS_prepare_for_policy_shift: "Politikwechsel vorbereiten"
 INS_prepare_for_policy_shift_desc: "Die politische Landschaft in Niederländisch-Indien wurde durch das nationale Erwachen der letzten Jahrzehnte stark mitgeprägt, doch unsere derzeitige Regierung spiegelt das nicht wider. Wir sollten erwägen, einige Änderungen an unserer Regierungsstruktur vorzunehmen."
 INS_reallocate_rubber_industry_funding: "Gelder für die Kautschukindustrie umleiten"
 INS_reallocate_rubber_industry_funding_desc: "Unsere starke Abhängigkeit vom Kautschukexport zeigt verheerende Auswirkungen auf unsere Wirtschaft. Wir müssen uns diversifizieren, indem wir neue Rohstoffvorkommen erschließen und im gesamten Archipel neue Bergwerke und Fabriken eröffnen. Um die nötigen finanziellen Mittel dafür aufzutreiben, müssen wir die Finanzierung von Kautschukplantagen kürzen."
 INS_reallocate_rubber_industry_funding_tt: "Schaltet eine Entscheidung frei, um §YKautschuk aus einem Staat zu entfernen§! und es durch kleineren Mengen einer §Yanderen Ressource§! zu ersetzen."
 INSHOL_nationalist_coallition: "Eine nationalistische Koalition"
 INSHOL_nationalist_coallition_desc: "Der Volksraad sprach viel zu lange mit nur einer Stimme - einer Stimme, die viel zu leise war. Die Zeit der Petitionen und geduldigen Aufschübe ist vorbei. Eine Koalition nationalistischer Abgeordneter wird ihre Differenzen beiseitelegen und die bedingungslose Unabhängigkeit fordern. Auch ältere Stimmen von außerhalb des Volksraads - Männer, von denen die Niederlande glaubte, sie längst aus der Politik vertrieben zu haben - werden ebenfalls wieder aufgenommen."
 INSHOL_volksraad_compromises: "Kompromisse im Volksraad"
 INSHOL_volksraad_compromises_desc: "Die Reformen des Volksraads brachten uns hierher, und es besteht kein Grund, den derzeitigen Kurs aufzugeben. Der Volksraad wird seine Arbeit fortsetzen und Zugeständnisse mit Den Haag aushandeln, um die Selbstverwaltung durch Geduld anstelle eines offenen Bruchs zu erreichen. Eine Zukunft innerhalb eines niederländischen Commonwealth verspricht uns eine bessere Zukunft, um die wir außerhalb dieses Bündnisses erbittert kämpfen müssten."
 INSHOL_establish_the_princely_council: "Den Fürstenrat einsetzen"
 INSHOL_establish_the_princely_council_desc: "Die Sultane und Rajas des Archipels genießen eine Loyalität, die keine Versammlung in Batavia jemals erreichen könnte. Ihre Höfe sind älter als die Kompanie und älter als die Republik, die ihr nachfolgte. Ein formeller Rat der Fürstenhäuser räumt diesen Herrschern einen Platz am Tisch unserer neuen Nation ein."
 INSHOL_nationalize_dutch_companies: "Niederländische Unternehmen verstaatlichen"
 INSHOL_nationalize_dutch_companies_desc: "Die großen Handelshäuser, die Reedereien, die Plantagen und die Banken trugen, solange wir uns erinnern können, niederländische Namen. Von heute an sollen sie indonesische Namen tragen. Die Vorstände werden neu besetzt, die Schilder abgenommen und das Kapital, das drei Jahrhunderte lang von diesen Inseln abgeschöpft wurde, wird endlich in die Inseln selbst investiert werden können."
 INSHOL_democracy: "Demokratisches Indonesien"
 INSHOL_democracy_desc: "Der Volksraad wurde als halbherzige Maßnahme gegründet, um ein beratendes Gremium mit begrenzten Befugnissen zu haben, das den Anschein von Repräsentation erweckt, ohne über die nötigen Mittel zu verfügen, wirklich etwas zu ändern. Wir gestalten den Volksraad zu einem echten Parlament um, dessen Mitglieder von jenem Volk gewählt werden, das es zu vertreten vorgibt, und deren Beschlüsse für die Regierung, die sie einst an der kurzen Leine hielt, bindend sind."
 INSHOL_princely_authority: "Autorität der Fürsten"
 INSHOL_princely_authority_desc: "Ein beratendes Gremium ist an sich eine gute Sache, doch die Sultane, die dieser Nation ihren Namen verliehen, könnten noch mehr beitragen. Das Parlament wird sich jenen nicht in den Weg stellen, die einen der Ihren über alle anderen erheben wollen. Die alten Höfe warteten lange darauf, dass ihnen diese Frage erneut gestellt wird."
 INSHOL_encourage_further_investment: "Zu weiteren Investitionen ermutigen"
 INSHOL_encourage_further_investment_desc: "Die im Volksraad erzielte Einigung klärte die politische Lage vorerst, und die niederländischen Investoren nahmen dies zur Kenntnis. Die Zölle wurden gesenkt, Garantien verlängert und den Handelskammern in Amsterdam und Rotterdam wurde versichert, dass der Archipel für den Handel offen bleibt. Was unter der alten Regelung rentabel war, wird auch unter der neuen rentabel sein."
 # <Joint Tree - ABDACOM>
 INSHOL_east_indies_artillery: "Ostindische Artillerie"
 INSHOL_east_indies_artillery_desc: "Durch die Eröffnung von Artilleriefabriken auf Java sind wir weniger auf Importe angewiesen."
 INSHOL_recall_gerardus_johannes_berenschot: "General Berenschot zurückbeordern"
 INSHOL_recall_gerardus_johannes_berenschot_desc: "Gerardus Johannes Berenschot ist einer der erfahrensten Generäle im Commonwealth. Er verbrachte den Großteil seiner Laufbahn in Niederländisch-Indien, war jedoch auch mehrere Jahre in den Niederlanden tätig. Die derzeitige Lage erfordert, dass wir ihn nach Niederländisch-Indien zurückrufen, damit er uns im Krieg unterstützt."
 INSHOL_east_indies_cruiser_manufacturing: "Ostindische Kreuzer"
 INSHOL_east_indies_cruiser_manufacturing_desc: "Die Herstellung unserer eigenen Kreuzer ist der erste Schritt für den Aufbau einer richtigen Marine. Wir dürfen uns nicht länger von den Niederlanden abhängig machen, um der japanischen Bedrohung entgegenzuwirken."
 INSHOL_transfer_of_conrad_helfrich: "Conrad Helfrich nach Niederländisch-Indien verlegen"
 INSHOL_transfer_of_conrad_helfrich_desc: "Admiral Conrad Helfrich nach Niederländisch-Indien zu verlegen, verbessert die Marinepräsenz entscheidend."
 # <Joint Tree - Naval Program>
 INSHOL_naval_program: "Niederländisch-Indonesisches Marineprogramm"
 INSHOL_naval_program_desc: "Die ostindische Marine liegt weit hinter den Kriegsflotten anderer zurück und ist selbst anderen Kolonialflotten unterlegen. Es liegt im Interesse aller Beteiligten, dass wir in den Aufbau einer neuen Marine investieren, um rasche Fortschritte zu gewährleisten."
 INSHOL_naval_program_transfer_25_tt: "§Y25%§! unserer Marine wird an [INS.GetName] übertragen."
 INSHOL_naval_program_transfer_25_2_tt: "§Y[HOL.GetFlag] [HOL.GetNameDefCap]§! überträgt §Y25%§! der eigenen Marine an §Y[INS.GetName]§!."
 INSHOL_naval_program_transfer_100_tt: "Wir übertragen §Runsere gesamte Marine§! an [INS.GetName]."
 INSHOL_naval_program_transfer_100_2_tt: "§Y[HOL.GetFlag] [HOL.GetNameDefCap]§! überträgt die gesamte Marine an §Y[INS.GetName]§!."
 INSHOL_naval_program_rejected_tt: "Schaltet den Schwerpunkt §Y$INSHOL_naval_secondchance$§! frei."
 INSHOL_hybrid_navy: "Eine kombinierte Flotte"
 INSHOL_hybrid_navy_desc: "Unsere Marine kann sich nicht allein auf die [HOL.GetAdjective]e Pazifikflotte verlassen. Wir müssen damit beginnen, unsere eigenen Schiffe zu bauen, da ansonsten ein einziger Fehler unsere gesamte Versorgung auf See unterbrechen kann."
 INSHOL_request_naval_control: "Ostindien-Squadron"
 INSHOL_request_naval_control_desc: "[HOL.GetNameDefCap] ist gefallen und nicht mehr in der Lage, die Marine zu koordinieren. Wir sollten für den Rest des Krieges die Kontrolle übernommen."
 INSHOL_naval_secondchance: "Ostindisches Marineprogramm"
 INSHOL_naval_secondchance_desc: "[HOL.GetNameDefCap] weigerte sich zwar, die Kontrolle über die Marine abzutreten, doch wir müssen den Pazifik dennoch irgendwie verteidigen, wenn wir nicht erobert werden wollen. Hätten man unserem Vorschlag zugestimmt, wäre es besser, aber wir werden dennoch eine brauchbare Alternative finden."
 # <Joint Tree - Netherlands in Exile>
 INSHOL_netherlands_in_exile: "Niederländisches Exil"
 INSHOL_netherlands_in_exile_desc: "Der tragische Untergang unseres Königreichs wurde nunmehr Wirklichkeit. Doch wir dürfen nicht in Defätismus verfallen. Wir müssen das Geschehene akzeptieren und unseren Blick darauf richten, was noch zu retten ist."
 # INSHOL_relocate_prime_minister: "Relocate the Prime Minister to Java"
 INSHOL_relocate_our_generals: "Die Armee nach Java verlegen"
 INSHOL_relocate_our_generals_desc: "Die verbleibenden Generäle, Kommandanten und Soldaten, die sich noch im Exil aufhalten, müssen schnellstens nach [1058.GetName] gebracht werden, bevor es zu spät ist."
 #INSHOL_relocate_our_soldiers: "Transfer Holdout Soldiers to Java"
 INSHOL_netherlands_indonesia_union: "Niederländisch-Indonesische Union"
 INSHOL_netherlands_indonesia_union_desc: "Die Vorstellung einer gleichberechtigten Union zwischen [HOL.GetName] und [INS.GetName] erscheint zunächst lächerlich, doch in Anbetracht der Krise, in der wir uns befinden, könnte es die einzige Möglichkeit sein, um unsere Souveränität zu bewahren."
 # <Sukarno Shared Branch - Resistance Buildup>
 INS_underground_revolution: "Untergrundrevolution"
 INS_underground_revolution_desc: "Wir müssen mit der Planung einer Revolution beginnen und die Mitgliederzahlen und Milizenaktivität schrittweise erhöhen, bis wir bereit zum Zuschlagen sind."
 INS_infiltrate_the_media: "Die Medien infiltrieren"
 INS_infiltrate_the_media_desc: "Wir konnten mehrere hochrangige Angestellte der Medien für unsere Bewegung in Niederländisch-Indien gewinnen. Wir können dies zu unserem Vorteil nutzen, um in den Köpfen der Bürger auf subtile Weise eine pro-revolutionäre Stimmung zu schüren."
 INS_infiltrate_the_army: "Die Armee infiltrieren"
 INS_infiltrate_the_army_desc: "Viele unserer Mitglieder sind Soldaten in der KNIL, aber auch ein paar höhere Ämter schlossen sich uns an. Wir müssen sie so viele Geheimnisse wie möglich für uns sammeln lassen und gleichzeitig unsere eigenen Leute in hohe Positionen einschleusen. Sobald wir den Auslöser betätigen, können wir die KNIL von innen heraus destabilisieren."
 INS_privately_owned_military_industry: "Private Militärindustrie"
 INS_privately_owned_military_industry_desc: "Wir müssen mehrere Scheinfirmen im militärisch-industriellen Sektor gründen, um sicherzustellen, dass wir die Kontrolle über die Rüstungsindustrie behalten, sobald die Revolution beginnt."
 INS_privately_owned_military_industry_tt: "Fügt unserem HQ §G2§! §YMilitärfabriken§! hinzu"
 INS_instigate_chaos_sulawesi: "Chaos auf Sulawesi verursachen"
 INS_instigate_chaos_sulawesi_desc: "Wir müssen mit lokalen Nationalisten auf Sulawesi zusammenarbeiten, um Streiks und Unruhen zu organisieren und die Bevölkerung zu radikalisieren."
 INS_instigate_chaos_sulawesi_tt: "Wenn wir die Unabhängigkeit erklären, erhalten wir einen §GKern§! auf §Y[673.GetName]§! und §Y[1056.GetName]§!. Niederländisch-Indien wird weiterhin keinen Kern darauf haben."
 INS_instigate_chaos_medan: "Chaos in Medan verursachen"
 INS_instigate_chaos_medan_desc: "Wir arbeiten mit lokalen Nationalisten in Medan und Riau zusammen, um Streiks und Unruhen zu organisieren und die Bevölkerung zu radikalisieren."
 INS_instigate_chaos_medan_tt: "Wenn wir die Unabhängigkeit erklären, erhalten wir einen §GKern§! auf §Y[1049.GetName]§!. Niederländisch-Indien wird weiterhin keinen Kern darauf haben."
 INS_embezzlement_scheme_in_batavia: "Veruntreuungsplan in Batavia"
 INS_embezzlement_scheme_in_batavia_desc: "Wir arbeiten einen Plan aus, um unsere Produktion nach der Unabhängigkeitserklärung von Batavia in republikanisches Territorium zu verlegen."
 INS_embezzlement_scheme_in_batavia_tt: "Wenn wir die Unabhängigkeit erklären, werden die Hälfte der Fabriken in §Y[1058.GetName]§! zu unserem §YRevolutionären Hauptquartier§! umverlegt."
 INS_volksraad_rumors: "Gerüchte im Volksraad"
 INS_volksraad_rumors_desc: "Wir stoßen im Volksrat diskret Diskussionen über die Revolution an, um die indonesischen Mitglieder des Volksraad davon zu überzeugen, sich unserer Sache anzuschließen."
 INS_volksraad_rumors_tt: "Wenn wir die Unabhängigkeit erklären, §Gbehalten§! wir alle §Yindonesischen§! Berater des Volksraad."
 INS_railway_youth_force: "Mit dem Eisenbahn-Jugendkorps zusammenarbeiten"
 INS_railway_youth_force_desc: "Das Eisenbahn-Jugendkorps ist eine islamistische Jugendmiliz, die vor allem in Zentraljava aktiv ist und ihren Namen ihrer Strategie verdankt, Eisenbahnstrecken zu besetzen. Sie wäre eine wertvolle Verbündete, ist jedoch sehr energisch und will in den Kampf ziehen. Wenn wir uns zu lange an einen Waffenstillstand halten, wird sie unzufrieden mit der Regierung werden."
 INS_sleeper_informant_network: "[GetInformantNetworkName]"
 INS_Sleeper_Informant_Network_name: "Schläfer-Informantennetzwerk"
 INS_KNIL_Informant_Network_name: "KNIL-Informantennetzwerk"
 INS_sleeper_informant_network_desc: "Wir müssen ein Informantennetzwerk aufbauen, das sich durch den gesamten Verwaltungsapparat der KNIL zieht und uns frühzeitig vor gegen uns gerichteten Plänen warnt."
 INS_sleeper_informant_network_tt: "§RWenn die Unabhängigkeit erklärt wird:§!\n"
 # <Sukarno Shared Branch - Peoples Security Army>
 INS_the_peoples_security_army: "Volkssicherheitsarmee"
 INS_the_peoples_security_army_desc: "Unsere Mitglieder, überwiegend junge Indonesier, werden ungeduldig und können es kaum erwarten, selbst einen Beitrag zu leisten und für unsere Unabhängigkeit zu kämpfen. Wir müssen einen Revolutionstrupp aufstellen und mit der Ausbildung unserer zukünftigen Soldaten beginnen."
 INS_commander_sudirman: "Sudirmans Armee"
 INS_commander_sudirman_desc: "Sudirman stieg ungeachtet seines jungen Alters rasch in den Rängen auf. Er besitzt beträchtliches Potenzial und erfreut sich insbesondere unter den jüngeren Mitgliedern des Widerstands großer Beliebtheit. Er wird der Volkssicherheitsarmee den Weg weisen und uns zum Sieg führen."
 INS_commander_oerip: "Oerips Armee"
 INS_commander_oerip_desc: "Oerip diente jahrzehntelang in der Armee und ist der einzige Indonesier, der jemals innerhalb der KNIL zum Major befördert wurde. Sein Wissen und seine Erfahrung werden der Volkssicherheitsarmee den Weg weisen und uns zum Sieg führen."
 INS_sudirmans_promotion: "Sudirmans Beförderung"
 INS_sudirmans_promotion_desc: "Sudirman bewies große Führungsqualitäten und führte mehrere erfolgreiche Angriffe an. Es ist an der Zeit, dass wir die Verdienste dieses Kommandanten würdigen, indem wir ihm den Titel eines Generals verleihen."
 INS_tkr_steal_general: "Generäle der KNIL abwerben"
 INS_tkr_steal_general_desc: "Wenn es uns gelingt, hochrangige Mitglieder der Niederländisch-Indischen Armee für unsere Sache zu gewinnen, stärken wir damit zum einen unsere eigene Armee und können zum anderen gleichzeitig ihre Armee schwächen."
 INS_tkr_supply: "Jeder Revolutionär muss kämpfen können"
 INS_tkr_supply_desc: "Wir müssen dafür sorgen, dass jedes Mitglied unserer Bewegung ausnahmslos eine militärische Ausbildung erhält."
 INS_tkr_professional_army: "Professionelle Armee"
 INS_tkr_professional_army_desc: "Wir sollten uns nicht allein auf Milizen verlassen. Nur durch den Aufbau einer professionellen republikanischen Armee erhalten wir die Ordnung aufrecht."
 INS_arm_the_revolutionaries: "Bewaffnung der Revolutionäre"
 INS_arm_the_revolutionaries_desc: "Wir müssen die Revolutionäre und Nationalisten mobilisieren, die voller Tatendrang bereit sind, alles für Indonesien zu opfern, indem wir ihnen die Ausbildung und die Ausrüstung zur Verfügung stellen, die sie brauchen, um für ihr Land zu kämpfen."
 INS_arm_the_youth: "Bewaffnung der Jugend"
 INS_arm_the_youth_desc: "Neben den Revolutionären müssen wir auch die Jugend bewaffnen. Sie ist voller Energie und Hoffnung und wird die Fackel der Revolution weitertragen. Wir müssen dafür sorgen, dass möglichst viele junge Indonesier für den Kampf ausgebildet und ausgerüstet werden. Wenn die Kämpfe ihre Heimat erreichen, werden sie zum Handeln bereit sein."
 INS_arm_the_students: "Bewaffnung der Studenten"
 INS_arm_the_students_desc: "Die Studierenden legten schon vor Jahrzehnten den Grundstein für diese Revolution, und sie werden sie auch weiterhin vorantreiben."
 INS_guerilla_industry: "Guerilla-Industrie"
 INS_guerilla_industry_desc: "Wir müssen unsere Guerillatruppen im gesamten Archipel damit beauftragen, Fabriken unter unsere Kontrolle zu bringen, damit wir neue Waffen herstellen und unsere Milizen damit ausrüsten können."
 INS_indonesian_assault_doctrine: "Indonesische Angriffsdoktrin"
 INS_indonesian_assault_doctrine_desc: "Ein Krieg kann nicht nur mit Soldaten gewonnen werden. Eine Million Männer nützen nichts, wenn sie keine Waffen haben, mit denen sie kämpfen können. Wir müssen uns eine hochwertige Artillerie beschaffen, um tiefer in das vom Feind kontrollierte Territorium vorzudringen."
 INS_tighter_tkr_integration: "Die TKR-Laskar enger integrieren"
 INS_tighter_tkr_integration_desc: "Die Volkssicherheitsarmee und die verschiedenen Milizen agieren nicht als eine Einheit, und ihre Zusammenarbeit ist begrenzt. Dies wird im weiteren Verlauf des Krieges nur zu immer mehr Problemen führen. Es it unerlässlich, dass wir die Armee und die Milizen in einer einheitlichen Organisation zusammenführen, auch wenn dies unvermeidlich zu Einwänden seitens der Milizoffiziere führen wird."
 INS_quality_over_quantity: "Qualität vor Quantität"
 INS_quality_over_quantity_desc: "Ein gut ausgebildeter Soldat mit einer durchdachten Strategie und moderner Ausrüstung ist fünf Studenten mit Pistolen überlegen. Wir müssen gut ausgerüsteten Soldaten und Spezialeinheiten Vorrang geben, anstatt einfach möglichst viele Kämpfer zu mobilisieren."
 INS_add_militia_cap_1_tt: "Die Obergrenze für §YFreiheitskämpfer§!-Divisionen wird um §Y1§! erhöht.\n"
 INS_add_militia_cap_2_tt: "Die Obergrenze für §YFreiheitskämpfer§!-Divisionen wird um §Y2§! erhöht.\n"
 INS_add_militia_cap_3_tt: "Die Obergrenze für §YFreiheitskämpfer§!-Divisionen wird um §Y3§! erhöht.\n"
 INS_add_3_militia_unit_tt: "Erschafft drei §YFreiheitskämpfer§!-Einheiten, die sich für §YÜberfälle§! nutzen lassen, welche die §GMilizenpräsenz§! in niederländischen Staaten erhöhen."
 INS_add_fully_trained_militia_unit_tt: "Erschafft eine ausgebildete §YFreiheitskämpfer§!-Einheit.\n"
 # <Sukarno Shared Branch - Expand Resistance Membership>
 INS_expand_resistance_membership: "Den Widerstand vergrößern"
 INS_expand_resistance_membership_desc: "Wenn wir mit unserer gesamten Bewegung auf ein Pferd setzen, ist sie unweigerlich zum Scheitern verurteilt. Wir müssen den Widerstand in Miliztruppen einteilen und diese damit beauftragen, unseren Einfluss in verschiedenen Regionen zu stärken, um weitere Mitglieder anzuwerben."
 # <Central Independence Branch - Militias>
 INS_deploy_the_kris: "Indonesischer Volksdienst von Sulawesi"
 INS_deploy_the_kris_desc: "Die KRIS (indonesisch für Indonesischer Volksdienst von Sulawesi) sind die größte Miliz auf Sulawesi und in Manado. Wir sollten sie rekrutieren, damit sie offiziell an der Seite der TKR kämpfen."
 INS_assist_the_pemuda: "Die Pemuda unterstützen"
 INS_assist_the_pemuda_desc: "In Java organisierten sich die Studenten in Pemuda-Milizen. Indem wir uns mit ihnen verbünden und sie bei ihren Einsätzen gegen die Niederländer unterstützen, sichern wir uns womöglich einen nützlichen Verbündeten."
 INS_mobilize_the_pemuda: "Die Pemuda mobilisieren"
 INS_mobilize_the_pemuda_desc: "Nachdem wir nun das Vertrauen der größten Pemuda-Gruppen gewannen, sollten wir damit beginnen, Pläne zu schmieden, um sie für die TKR zu mobilisieren."
 INS_organize_jakarta_pemuda: "Die Kakarte-Permuda organisieren"
 INS_organize_jakarta_pemuda_desc: "Auf Java gibt es unzählige Permuda-Gruppen von verschiedener Größe. Wir haben die größten von ihnen bereits mobilisiert und rekrutiert, doch es gibt noch viele kleinere, besonders in Jakarta, die unabhängig von uns agieren. Wir müssen Kontakt zu ihnen herstellen und mit ihnen zusammenarbeiten."
 INS_recognize_moestopos_batallion: "Moestopos Bataillon anerkennen"
 INS_recognize_moestopos_batallion_desc: "Ein Revolutionär, der auf den Namen Moestopo hört, ernannte sich selbst zum „amtierenden Verteidigungsminister“ in Surabaya und kontrolliert die dortigen Milizen. Seine Bemühungen sollten offiziell anerkannt werden, indem wir ihn zum Generalmajor der TKR befördern."
 INS_darul_islam_focus: "Darul Islam"
 INS_darul_islam_focus_desc: "Kartosoewirjos Hizbullah bewährte sich in den Bergen West-Javas, und wir können es uns nicht leisten, Soldaten wie ihn aus unseren Reihen auszuschließen. Seine Freischärler sollen neben unseren eigenen Truppen kämpfen, und der Mann selbst sollte den Rang tragen, den er sich verdient hat. Die Getreuen werden ihre Anliegen in der Republik schon bald vorbringen."
 # <Central Independence Branch - Navy>
 INS_just_a_fisherman: "Nur ein Fischer"
 INS_just_a_fisherman_desc: "Ohne Schiffe einen Krieg in einem Archipel zu führen, ist schwierig, und wir können solch einen Krieg nicht noch länger führen. Wir können jedoch eine möglicherweise naive Strategie nutzen, bei der wir Milizen als Fischer getarnt auf Fischerbooten in die von den Niederlanden kontrollierten Häfen schicken."
 INS_a_cheap_navy: "Eine günstige Marine"
 INS_a_cheap_navy_desc: "Wir haben weder die Zeit noch das Geld, um eine große moderne Marine aufzubauen. Wir müssen mit dem zurechtkommen, was wir haben, und alles nutzen, was wir finden."
 INS_divert_army_funds_to_navy: "Armeegelder an die Marine umleiten"
 INS_divert_army_funds_to_navy_desc: "Indonesien ist ein Archipel, und eine Infanterie ist nichts ohne Schiffe, die sie von einer Insel zur nächsten transportieren können. Es ist ein lohnendes Opfer, finanzielle Mittel von der TKR zu unserer neuen Marine umzuleiten."
 INS_indonesian_naval_doctrine: "Indonesische Marinedoktrin"
 INS_indonesian_naval_doctrine_desc: "Da wir dabei sind, eine eigene Marine aufzubauen, ist es wichtig, uns Gedanken über die Doktrin zu machen, nach der wir kämpfen und drillen werden. Wir müssen der Ausarbeitung und Einführung einer Marinedoktrin höchste Priorität einräumen."
 INS_domestic_shipbuilding: "Eigene Schiffe bauen"
 INS_domestic_shipbuilding_desc: "Wir können uns nicht ewig darauf verlassen, Schiffe von den Niederländern zu erbeuten, da es schon bald keine niederländischen Schiffe mehr geben wird, die wir erbeuten könnten. Wir sollten damit beginnen, unsere eigenen Schiffe zu bauen."
 INS_acquire_modern_blueprints: "Moderne Blaupausen erwerben"
 INS_acquire_modern_blueprints_desc: "Wir müssen Blaupausen von anderen Ländern und privaten Unternehmen kaufen, um unsere neue Marine zu bauen."
 INS_reclaiming_the_dutch_navy: "Die einstige Marine von Niederländisch-Indien nutzen"
 INS_reclaiming_the_dutch_navy_desc: "Die Niederländer ließen viele Schiffe in den Häfen zurück, die wir nun besetzen. Wir sollten diese Schiffe übernehmen, solange wir die Möglichkeit dazu haben."
 INS_admiral_mas_pardi: "Admiral Mas Pardi"
 INS_admiral_mas_pardi_desc: "Jede gute Marine benötigt einen Admiral, der sie anführt. Mas Pardi ist die offensichtliche Wahl."
 INS_akademi_angkatan_laut: "Die Akademi Angkatan Laut errichten"
 INS_akademi_angkatan_laut_desc: "Wir müssen eine Marineakademie mit Einrichtungen für die Marineforschung schaffen und gleichzeitig mehr Bürger zu Ingenieuren und Admiralen ausbilden."
 # <Central Independence Branch - Militia Logistics>
 INS_pki_militia_tt: "Tan Malaka befehligt eine starke Miliz, doch sie kämpft nicht nur für Indonesien, sondern auch für den §RKommunismus§! und die Sowjets. §RSie wird sich jeder nichtkommunistischen Regierung gewaltsam widersetzen.§!"
 INS_increase_laskar_funding_tt: "§WErhält§! 1§Y Militärfabrik§! für jede erfüllte Forderung einer Miliz (maximal §G6§!)"
 INS_subsidize_laskar_armament: "Bewaffnung der Laskar subventionieren"
 INS_subsidize_laskar_armament_desc: "Milizen, die mit Bambusspeeren kämpfen, können gegen schwer bewaffnete Einheiten nicht lange bestehen. Wir müssen die Herstellung von Waffen und Munition für diese Milizen priorisieren."
 INS_loot_knil_weapons_caches: "Waffenverstecke der KNIL plündern"
 INS_loot_knil_weapons_caches_desc: "Es gibt zahlreiche Waffenverstecke, die die KNIL vor der Revolution anlegte. Viele unserer Mitglieder sind ehemalige Angehörige der KNIL, und sie könnten uns dabei helfen, die Verstecke aufzuspüren und zu plündern."
 INS_utilize_tan_malakas_militia: "Tan Malakas Miliz nutzen"
 INS_utilize_tan_malakas_militia_desc: "Die Rote Miliz von Tan Malaka ist die wohl stärkste unabhängig agierende Miliz in ganz Indonesien, und es wäre ein enormer Gewinn für uns, sie in die TKR einzubinden. Dies wäre jedoch nicht gänzlich ohne Risiken. Wenn man einer mächtigen Miliz mit starken politischen Motiven so viel Einfluss einräumt, wird es für sie viel einfacher, die Macht an sich zu reißen."
 INS_increase_laskar_funding: "Finanzierung der Laskar erhöhen"
 INS_increase_laskar_funding_desc: "Unsere Milizen machen den Großteil unserer Streitkräfte aus. Wir müssen sie entsprechend finanzieren, auch wenn sie [INS.GetLeader] nicht uneingeschränkt treu ergeben sind."
 INS_develop_a_functioning_airforce: "Eine richtige Luftwaffe aufbauen"
 INS_develop_a_functioning_airforce_desc: "Eine Luftwaffe hat erheblichen Einfluss auf die Armee. Wir sollten der Schaffung einer richtigen Luftwaffe deshalb Priorität einräumen."
 # <Vice Presidential Edict - Intro>
 INS_political_stabilization: "Die Ordnung wiederherstellen"
 INS_political_stabilization_desc: "Unsere Nation wird von Tag zu Tag instabiler. Wenn wir nicht bald reagieren, ist ein Bürgerkrieg so gut wie unvermeidlich. Wir müssen Verhandlungen zwischen dem Nationalkomitee, dem Präsidenten und den Anführern der Milizen aufnehmen, um eine Lösung zu finden."
 INS_vice_presidential_edict: "Das Dekret des Vizepräsidenten unterzeichnen"
 INS_vice_presidential_edict_desc: "Das Nationalkomitee forderte fast einstimmig die Gesetzgebungsgewalt. Dem Präsidenten wurde eine Petition überreicht, in der man ein gemischtes System vorschlägt, bei dem das Nationalkomitee zu einem unabhängigen Parlament wird, das sich die Gesetzgebungsgewalt mit dem Präsidenten teilt. Das Angebot ist verlockend, doch es besteht die Gefahr, dass die Macht des Präsidenten anschließend kaum noch Bedeutung besitzt."
 INS_local_cooperatives: "Lokale Genossenschaften erlauben"
 INS_local_cooperatives_desc: "Wir müssen darauf achten, dass wir kein kapitalistisches System nach westlichem Vorbild schaffen, doch wir sollten zumindest die wirtschaftlichen Vorteile der Privatisierung nutzen. Dies können wir umsetzen, indem wir lokale Genossenschaften zulassen, die ihren jeweiligen Eigentümern Wohlstand bringen. Sie werden nicht von der Regierung beaufsichtigt, dürfen aber auch nicht über ihren Zuständigkeitsbereich hinaus expandieren."
 INS_local_unity: "Teilautonomie der Fürsten"
 INS_local_unity_desc: "Wir gewähren den Fürstenstaaten teilweise Autonomie, um in diesen ohnehin schon turbulenten Zeiten die innere Stabilität zu wahren."
 INS_education_subsidies: "Bildungssubventionen"
 INS_education_subsidies_desc: "Es ist unerlässlich, dass wir in die Jugend unseres Landes investieren, wenn wir jemals wirtschaftlich erfolgreich sein wollen. Wir müssen in der ganzen Republik Schulen zu erschwinglichen Preisen errichten."
 INS_land_reform: "Landreform"
 INS_land_reform_desc: "Die Niederlande besaßen vor unserer Unabhängigkeitserklärung große Ländereien. Wir sollten dieses Land zu niedrigen Preisen an Indonesier vergeben, die es nutzen wollen, um das Wirtschaftswachstum anzukurbeln."
 INS_dominion_of_atjeh: "Das Dominion Atjeh"
 INS_dominion_of_atjeh_desc: "Die Separatistenbewegung in Atjeh ist riesig und wächst immer weiter. Es besteht jedoch kein Anlass, die Lage eskalieren zu lassen. Wir sollten eine Kompromisslösung anstreben, in der Atjeh ein Teil Indonesiens bleibt, jedoch weitgehende Autonomie erhält."
 # <Vice Presidential Edict - Presidential Balance>
 INS_dissolve_national_party: "Die Nationalistische Partei auflösen"
 INS_dissolve_national_party_desc: "Das hybride System wurde als notwendiger Kompromiss geschaffen, um Chaos zu vermeiden. Wir dürfen nicht zulassen, dass der Präsident auf undemokratische Weise so viel Macht innehat. Der Präsident muss vom Parlament abgesetzt werden, damit wir zu einer wahren Demokratie werden können."
 INS_womens_sufferage: "Frauenwahlrecht"
 INS_womens_sufferage_desc: "Frauen das Wahlrecht einzuräumen, wird kurzfristig für Instabilität sorgen, langfristig jedoch die Demokratie stärken."
 INS_women_in_military: "Frauen beim Militär"
 INS_women_in_military_desc: "Frauen zu erlauben, im Militär zu dienen, ist ein notwendiger Schritt, damit unsere Truppen so stark wie möglich sind."
 INS_fair_election: "Faire Wahlen"
 INS_fair_election_desc: "Da der Präsident abgesetzt und die Revolution beendet ist, können wir endlich die ersten wirklich fairen Wahlen abhalten, frei vom Einfluss des Autoritarismus."
 # < Hybrid Politics >
 INS_continue_hybrid_politics: "Die hybride Politik beibehalten"
 INS_continue_hybrid_politics_desc: "Die hybride Politik ist ein notwendiges Übel. Auch wenn das endgültige Ziel eine echte Demokratie ist, ist Indonesien noch viel zu jung und instabil, als dass die gesamte Macht dem Volk übertragen werden könnte. Der Präsident und das Parlament werden sich weiterhin gegenseitig in Schach halten und so sicherstellen, dass keines der beiden Organe zu mächtig wird."
 INS_guided_economy: "Gelenkte Wirtschaft"
 INS_guided_economy_desc: "Wir überwachen die Wirtschaft Indonesiens direkt, um sicherzustellen, dass wir die Kontrolle behalten. Alle Banken sowie der Öl- und der Agrarsektor werden verstaatlicht."
 INS_reform_education_system: "Verpflichtende ideologische Erziehung"
 INS_reform_education_system_desc: "Die Revolution war der Beweis, dass Studenten und junge Erwachsene, die mit der gesellschaftlichen Ordnung unzufrieden sind, stets eine Rebellion anführen werden. Zum Schutz unserer Regierung und unserer Nation müssen wir verlangen, dass die Schulen im Einklang mit der Ideologie unserer Regierung unterrichten."
 INS_reform_education_system_2: "Bildungsreform"
 INS_reform_education_system_2_desc: "Wenn Indonesien in Zukunft eine wohlhabende Nation werden soll, müssen alle Indonesier, unabhängig ihres Geburtsorts, Bildung genießen können."
 INS_three_year_plan: "Dreijahresplan"
 INS_three_year_plan_desc: "Wir können einen Dreijahresplan aufstellen, um die Infrastruktur im gesamten Archipel auszubauen und die Inseln miteinander zu verbinden."
 INS_destroy_pacific_colonialism: "Den Pazifikkolonialismus zerstören"
 INS_destroy_pacific_colonialism_desc: "Die Revolution mag zu Ende sein, aber es gibt noch immer Schlachten, die es zu schlagen gilt. Noch immer leben viel zu viele Menschen unter der Tyrannei des Kolonialismus direkt vor unserer Haustür. Wir können nicht tatenlos zusehen. Wir müssen entschlossen handeln und sie befreien!"
 INS_rapid_mobilization: "Schnelle Mobilisierung"
 INS_rapid_mobilization_desc: "Jede starke Nation stützt sich auf eine starke Armee. Wenn wir zu einer Regionalmacht aufsteigen wollen, die in der Lage ist, sich zu behaupten, müssen wir damit beginnen, unsere Armee zu vergrößern."
 INS_greater_indonesia: "Großindonesien ausrufen"
 INS_greater_indonesia_desc: "Das alte Reich Nusantara einte einst die malaiische Welt. Da wir Malaya von der kolonialen Tyrannei befreiten, sollten wir es unseren Vorfahren in Nusantara gleichtun und die gesamte malaiische Welt erneut zu einer einzigen Nation vereinen."
 # < State Religion >
 INS_secularism: "Säkularismus"
 INS_secularism_desc: "Indonesien ist die Heimat vieler Religionen. Die Religion mit der Politik zu vermischen, sorgt jedoch nur für Chaos, weshalb wir religiöse Parteien verbieten müssen."
 INS_integrate_sarekat_islam: "Die Sarekat Islam integrieren"
 INS_integrate_sarekat_islam_desc: "Die großen islamischen Parteien genießen viel Unterstützung. Es liegt in unserem besten Interesse, sie in die Regierung zu integrieren."
 # <Vice Presidential Edict - Sjahrir>
 INS_sjahrirs_continued_tenure: "Weitere Amtszeit für Sjahrir"
 INS_sjahrirs_continued_tenure_desc: "Premierminister Sjahrir bewies sich als großer Anführer, indem er uns durch die Revolution führte, für den wirtschaftlichen Aufschwung sorgte und die Demokratie zementierte. Wir sollten ihn erneut zum Premierminister wählen."
 INS_unity_in_diversity: "Einheit in der Vielfalt"
 INS_unity_in_diversity_desc: "Die Worte „Einheit in der Vielfalt“ beschreiben bereits seit Jahrhunderten den Geist unseres Archipels. Während der Revolution wurde dieser Gedanke zu einem Schlachtruf, der die Indonesier daran erinnerte, dass wir, obwohl wir viele Sprachen sprechen und unterschiedlichen Traditionen folgen, noch immer ein Volk sind, das zusammensteht. Wir müssen diesen Satz in unserer Verfassung verankern, damit unsere Einheit für künftige Generationen bewahrt bleibt."
 INS_the_timor_issue: "[INS_timor_issue_scripted_name]"
 INS_timor_issue_scripted_name_issue: "Die Timorfrage"
 INS_timor_issue_scripted_name_attack: "Osttimor angreifen"
 INS_the_timor_issue_desc: "[INS_timor_issue_scripted_desc]"
 INS_timor_issue_scripted_desc_issue: "Osttimor ist rechtmäßig ein Territorium von Indonesien, und obwohl die Revolution beendet ist, steht es noch immer unter Kolonialherrschaft. Wir müssen gegen [721.OWNER.GetName] ein Ultimatum verhängen und die sofortige Übergabe von Osttimor fordern."
 INS_timor_issue_scripted_desc_attack: "Osttimor ist rechtmäßiges indonesisches Territorium. Die Rebellen auf der Insel beanspruchen die Unabhängigkeit, doch sie sprechen ganz klar nicht im Namen der Gesamtbevölkerung. Die Überreste des portugiesischen Kolonialismus müssen in die Republik eingegliedert werden."
 INS_pledge_to_allies: "Den Alliierten anschließen"
 INS_pledge_to_allies_desc: "Wir laufen Gefahr, im Zuge der weltweit eskalierenden Konflikte selbst angegriffen zu werden. Auch wenn unsere Beziehungen zu den Alliierten angespannt sind, haben wir uns als demokratische Macht im Pazifik etabliert und sollten uns den großen demokratischen Mächten anschließen."
 INS_mixed_economy_system: "Gemischtes Wirtschaftssystem"
 INS_mixed_economy_system_desc: "Indonesien ist ein einzigartiges Land und wird unter dem traditionellen Kapitalismus oder Kommunismus nicht gedeihen. Wir müssen ein gemischtes Wirtschaftssystem einführen, das sowohl Elemente des Kapitalismus als auch des Kommunismus enthält."
 INS_social_democracy: "Sozialdemokratie"
 INS_social_democracy_desc: "Die [INS.GetAdjective]e Wirtschaft wuchs seit den Wirtschaftsreformen von Sjahrir massiv. Wir müssen Indonesien zu einer vollständigen Sozialdemokratie erklären und die künftige Wirtschaftspolitik auf den Prinzipien der Sozialdemokratie gründen."
 # <Vice Presidential Edict - Sjarifuddin>
 INS_prime_minister_sjarifuddin: "Premierminister Sjarifuddin"
 INS_prime_minister_sjarifuddin_desc: "Sjarifuddin ist der beste Kandidat für Indonesien, da seine moderate Politik einen guten Mittelweg zwischen Kommunismus und Sozialismus beschreitet."
 INS_concessions_to_communists: "Zugeständnisse gegenüber den Kommunisten"
 INS_concessions_to_communists_desc: "Die PKI verfügt über eine beträchtliche Anzahl von Sitzen im Parlament. Wir sollten der Führung der PKI einige Ministerposten übertragen, um die Stabilität zu gewährleisten."
 INS_sjarifuddin_focus_2: "Selbstverwaltete Exportwirtschaft"
 INS_sjarifuddin_focus_2_desc: "Im Zuge unserer Unabhängigkeit müssen wir unser exportorientiertes Wirtschaftssystem so überdenken und umgestalten, dass es niederländische Gewinne nicht länger berücksichtigt. Auch wenn eine exportorientierte Wirtschaft nach wie vor Risiken birgt, können wir sie zumindest stabiler gestalten, als es in den vergangenen Jahren der Fall war."
 # <Vice Presidential Edict - Hatta>
 INS_prime_minister_hatta: "Premierminister Hatta"
 INS_prime_minister_hatta_desc: "Mohammad Hatta, auch als der „Verkünder der Revolution“ bekannt, war der Vizepräsident von Sukarno und galt allgemein als der demokratischere der beiden. Die meisten politischen Parteien könnten vermutlich dazu gebracht werden, ihn als Premierminister anzuerkennen."
 INS_hatta_focus_2: "Die nächsten Schritte"
 INS_hatta_focus_2_desc: "Die Revolution war erfolgreich, und auch wenn einige Politiker darauf bestehen, dass die Revolution weitergehen muss, müssen ihre Stimmen ignoriert werden. Wir sollten stattdessen nach vorn blicken und in die Entwicklung von Indonesien investieren, damit künftige Generationen in Wohlstand leben können."
 INS_hatta_princely_advisors: "Die Fürsten integrieren"
 INS_hatta_princely_advisors_desc: "In unserer Vielfalt finden wir Einigkeit. Wir bauten unsere Nation auf diesem Grundsatz auf, doch das Ende der Revolution stellte diese Idee auf eine harte Probe, da wir keine gemeinsamen Ziele mehr verfolgten. Um zu verhindern, dass Minderheiten uns gegenüber feindselig eingestellt sind und Aufstände beginnen, sollten wir einen Rat einrichten, in dem die Herrscher der lokalen Fürstenstaaten direkten Einfluss auf die nationale Politik nehmen können."
 INS_prime_minister_tt: "Die ersten indonesischen Parlamentswahlen wurden abgehalten"
 # < Guided Democracy >
 INS_guided_democracy: "Gelenkte Demokratie"
 INS_guided_democracy_desc: "Die Demokratie mag zwar als Ideal erscheinen, doch die Macht jetzt an das Volk abzugeben, würde nur im Chaos enden. Wir müssen Sukarno zum Präsidenten auf Lebenszeit ernennen, damit er das demokratische Parlament beaufsichtigen und bei Bedarf eingreifen kann."
 INS_enact_militarism: "Den Militarismus einführen"
 INS_enact_militarism_desc: "Wir sollten von [JAP.GetName] und seiner Militärpolitik lernen. Die Übernahme ähnlicher Prinzipien wird unserer neuen Regierung sehr zugutekommen."
 INS_sukarnos_industrialization: "Die Industrie Javas ermächtigen"
 INS_sukarnos_industrialization_desc: "Die Industrie Javas ist das Rückgrat unserer Wirtschaft und unseres Militärs. Alle Straßen müssen nach Rom oder in unserem Fall Java führen!"
 INS_sukarnos_industrialization2: "Jeder muss seinen Teil beitragen"
 INS_sukarnos_industrialization2_desc: "Die Kriegsbeitrag hat für unser Land oberste Priorität, und daher muss es auch oberste Priorität jedes Indonesiers sein, seinen Beitrag dazu zu leisten. Luxus ist der Feind. Der militärisch-industrielle Komplex muss wachsen."
 INS_japanese_military_lessons: "Japanische Militärlektionen"
 INS_japanese_military_lessons_desc: "Wir sollten die Militärdoktrinen Japans studieren und unsere eigene Armee entsprechend ausbilden."
 # < Support Tan Malaka's Coup>
 INS_support_tan_malakas_coup: "Tan Malakas Putsch unterstützen"
 INS_support_tan_malakas_coup_desc: "Sukarno erklärte zwar unsere Unabhängigkeit, doch er ist nur halbherzig bei der Sache und macht zu viele diplomatische Zugeständnisse. Tan Malaka und seine „Persatuan Perjuangan“ fordern das, was das Volk fordert: hundertprozentige Unabhängigkeit, keine Verhandlungen, keine Kompromisse. Wenn Sukarno nicht voll und ganz für die Revolution kämpft, muss die Revolution einen Führer finden, der dies tut."
 INS_minimum_program: "Das Minimalprogramm"
 INS_minimum_program_desc: "Die Persatuan Perjuangan legte ihre Forderungen dar: eine Volksregierung, eine Volksarmee und die Verstaatlichung aller Plantagen und Industriebetriebe in ausländischem Besitz. Wir brauchen fähige Männer, um dieses Programm voranzutreiben. Njono spricht für die Arbeiter, Setyadjit für die Intellektuellen der Partei. Gemeinsam werden sie dafür sorgen, dass die Revolution von der Fabrikhalle bis in die Regierungsgebäude organisiert wird."
 INS_agrarian_reform: "Agrarreform"
 INS_agrarian_reform_desc: "Seit drei Jahrhunderten versorgt das Land Indonesien die Plantagen Fremder. Die Bauern, die es bewirtschafteten, kannten kaum etwas anderes. Eine Revolution, die daran nichts ändert, ist keine Revolution. Wir müssen dafür sorgen, dass das Land denen zufällt, die es bebauen."
 INS_soviet_aid: "Sowjetische Unterstützung"
 INS_soviet_aid_desc: "Die Sowjetunion erkannte unsere Revolution an und ist bereit, sie mit Waffen zu versorgen. Welche Unterschiede unser Programm auch immer von dem in Moskau trennen mag: Wir können es uns nicht leisten, das Angebot abzulehnen. Wir sollten die Waffen annehmen und weitermachen."
 INS_pacific_revolution: "Pazifikrevolution"
 INS_pacific_revolution_desc: "Die Kolonialmächte zogen sich nicht aus Asien zurück, sondern nur aus Indonesien. In Ländern wie Malaya und den Philippinen herrscht nach wie vor die alte Ordnung, und in jedem dieser Länder gibt es Männer und Frauen, die sie stürzen wollen. Unsere Revolution verpflichtet uns dazu, ihnen beizustehen. Wir müssen!"
 INS_purge_oppurtunists_tt: "Schaltet §Y$INS_launch_revolution$§! in Ländern mit mindestens §Y60%§! Kommunistenunterstützung frei. Länder, die durch uns eine Revolution beginnen, werden zu unseren §YMarionettenstaaten§!."
 INS_purge_oppurtunists: "Die Opportunisten entlarven"
 INS_purge_oppurtunists_desc: "Musso verbrachte zwanzig Jahre in Moskau, nur um zu lernen, Befehle entgegenzunehmen. Er kehrte mit sowjetischen Anweisungen und dem Plan zurück, unsere Republik zu einer Marionette der Komintern zu machen. Wir befreiten uns nicht von den Niederländern, nur um vor jemand anderem niederzuknien. Die Opportunisten, die unsere Revolution an Moskau verkaufen wollen, müssen entlarvt werden. Die Völker, die wir befreien, sollten ihren Blick auf Jakarta und nicht auf den Kreml richten!"
 INS_federation_of_aslia: "Asiatische Föderation"
 INS_federation_of_aslia_desc: "Die von uns befreiten Nationen sind nicht auf sich allein gestellt. Tan Malaka hatte stets etwas Größeres als nur eine Republik im Sinn: eine Föderation, die vom Festland bis zum Pazifik reicht und sich gegen jede Kolonialmacht behaupten wird, die es wagen sollte, zurückzukehren. Wir müssen den anderen Nationen eine Vollmitgliedschaft in unserem Staat anbieten."
 INS_aslia_tt: "Erlaubt das Erstellen von Kernen und die Annektierung §Ypazifischer§! Untertanen"
 INS_musso_ascends: "Musso erhebt sich"
 INS_musso_ascends_tt: "Schaltet §Y$INS_launch_revolution$§! in Ländern mit mindestens §Y30%§! Kommunistenunterstützung frei. Länder, die durch uns eine Revolution beginnen, bleiben unabhängig."
 INS_musso_ascends_desc: "Tan Malaka ist ein Träumer. Musso bringt das mit, was Träumer nicht haben: die uneingeschränkte Unterstützung der Sowjetunion und die Solidarität der internationalen kommunistischen Bewegung. Wir sind bei unserer Revolution nicht allein."
 INS_soviet_economic_integration: "Sowjetische Wirtschaftsintegration"
 INS_soviet_economic_integration_desc: "Die Revolution brachte uns unsere Freiheit, doch Freiheit allein baut keine Fabriken und ernährt nicht die Massen. Die Sowjetunion bietet uns etwas, was uns keine kapitalistische Macht bieten kann: industrielles Fachwissen, Entwicklungskredite und Handel zu Bedingungen, die nicht mit kolonialen Abhängigkeiten verbunden sind. Wir wären töricht, abzulehnen."
 # <National Revolution - Reasserting Control>
 INSHOL_revolution_ongoing_tt: "Indonesische Revolution ist im Gange"
 INSHOL_reasserting_control: "Kontrolle über Niederländisch-Indien zurückgewinnen"
 INSHOL_reasserting_control_desc: "Wir können nicht tatenlos zusehen, wie diese Opportunisten versuchen, das zu zerstören, was wir über Jahrhunderte hinweg aufbauten, indem sie unsere Infrastruktur ruinieren und die Jugend radikalisieren. Wir müssen handeln!"
 INSHOL_request_british_support: "Um britische Unterstützung bitten"
 INSHOL_request_british_support_desc: "Da [ENG.GetNameDef] ebenfalls eine Kolonialmacht wie wir ist, wird man wahrscheinlich Verständnis für unsere Lage aufbringen, zumal ein Erfolg der Revolutionäre einen Dominoeffekt in Ostasien auslösen könnte. Wir sollten die Briten um wirtschaftliche und militärische Unterstützung bitten."
 INS_eng_treaty_holside_tt: "§Y[ENG.GetNameDefCap]§! stellt sich für die Dauer des Konflikts offiziell auf unsere Seite und wird umfangreiche Hilfe leisten. Wenn der Krieg in einem Sieg endet, erhält §Y[ENG.GetNameDef]§! Borneo."
 INS_eng_treaty_engside_tt: "Wir stellen uns für die Dauer des Konflikts in Niederländisch-Indien offiziell auf die Seite von §Y[HOL.GetName]§!. Wenn §Y[HOL.GetNameDefCap]§! gewinnt, erhalten wir Borneo."
 INS_fra_treaty_holside_tt: "§Y[FRA.GetNameDefCap]§! stellt sich für die Dauer des Konflikts offiziell auf unsere Seite und wird umfangreiche Hilfe leisten. Wenn der Krieg in einem Sieg endet, erhält §Y[FRA.GetNameDef]§! den Nordosten von Sumatra."
 INS_fra_treaty_fraside_tt: "Wir stellen uns für die Dauer des Konflikts in Niederländisch-Indien offiziell auf die Seite von §Y[HOL.GetName]§!. Wenn §Y[HOL.GetNameDefCap]§! gewinnt, erhalten wir den Nordosten von Sumatra."
 INSHOL_franco_dutch_accord: "Französisch-niederländisches Abkommen"
 INSHOL_franco_dutch_accord_desc: "Auch wenn unsere Soldaten besser ausgerüstet und organisiert sind als die republikanischen Milizen, verläuft der Konflikt aufgrund ihrer zahlenmäßigen Überlegenheit zu ihren Gunsten. Für einen Sieg benötigen wir Unterstützung von außen, und zwar mehr, als die meisten zu leisten bereit wären. Frankreich könnte zu einer Intervention geneigt sein, wenn wir im Gegenzug Territorium in Niederländisch-Indien anbieten."
 INSHOL_london_batavia_accord: "London-Batavia-Abkommen"
 INSHOL_london_batavia_accord_desc: "Auch wenn unsere Soldaten besser ausgerüstet und organisiert sind als die republikanischen Milizen, verläuft der Konflikt aufgrund ihrer zahlenmäßigen Überlegenheit zu ihren Gunsten. Für einen Sieg benötigen wir Unterstützung von außen, und zwar mehr, als die meisten zu leisten bereit wären. [ENG.GetNameDefCap] ist bereits in Malaya präsent und könnte Interesse an einem solchen Abkommen haben. Vielleicht stimmt man zu, wenn wir im Gegenzug etwas anbieten?"
 INSHOL_australian_divisions: "Australische Infanterie nach Java entsenden"
 INSHOL_australian_divisions_desc: "Nach dem London-Batavia-Abkommen ist Großbritannien verpflichtet, zusätzliche Divisionen über Australien nach Indien zu entsenden. Australien ist aufgrund der Nähe zu Niederländisch-Indien der ideale Militärstützpunkt außerhalb Niederländisch-Indiens selbst."
 INSHOL_indian_divisions: "Britisch-indische Armeedivisionen"
 INSHOL_indian_divisions_desc: "Großbritannien wird höchstwahrscheinlich nicht bereit sein, eigene Truppen nach Indien zu entsenden, doch vielleicht ist es bereit, indische Divisionen zu entsenden, insbesondere aufgrund der Nähe zu Batavia."
 INSHOL_undermine_the_militias: "Die Milizen untergraben"
 INSHOL_undermine_the_militias_desc: "Die Medien übertreiben, wie ernst die Lage tatsächlich ist. Bei den Milizen handelt es sich nur um eine Gruppe von jungen Leuten, die nach etwas Unerreichbarem greifen. Es ist nicht nötig, sämtliche Kräfte zu ihrer Bekämpfung abzuziehen. Wir sollten vielmehr die Stellung halten und darauf warten, dass sie müde werden."
 INSHOL_flag_will_fly_again: "Die Flagge wird erneut wehen"
 INSHOL_flag_will_fly_again_desc: "Die niederländische Flagge weht seit Jahrhunderten über Niederländisch-Indien, und wir lassen unter keinen Umständen lzu, dass sie eingeholt wird. Wenn es nötig sein sollte, Panzer und Bomber einzusetzen, um unser Kronjuwel unter unseren Kolonien zu halten, dann werden wir sie einsetzen!"
 INSHOL_flag_will_fly_again_tt: "§YSobald die Revolution endet, wird der Nationalgeist entfernt und die Änderungen werden rückgängig gemacht.§!"
 # <National Revolution - Escalation>
 INSHOL_mass_mobilization: "Massenmobilmachung"
 INSHOL_mass_mobilization_desc: "Ohne eine gut ausgerüstete Armee können wir diesen Konflikt nicht gewinnen und die Republik nicht besiegen. Wir müssen Niederländisch-Indien wieder aufrüsten und Mittel aus zivilen Bereichen an die KNIL umleiten."
 INSHOL_batavia_storm_operation: "Batavia stürmen"
 INSHOL_instigate_infighting: "Einen inneren Konflikt in der Republik schüren"
 INSHOL_ultimatum_to_republic: "Ein Ultimatum für die Republik"
 INSHOL_comite_rijkseenheid: "Comité Rijkseenheid"
 INSHOL_comite_rijkseenheid_desc: "In Niederländisch-Indien wird die Flagge eingeholt, und die Menschen sehen einfach tatenlos zu. Wir müssen die Verwaltung von Niederländisch-Indien davon überzeugen, dass das niederländische Volk will, dass die Revolution beendet wird!"
 INSHOL_increase_esclation_placeholder: "Schnelle Eskalation"
 INSHOL_increase_esclation_placeholder_desc: "Unsere Milizen übernahmen die Kontrolle über viele wichtige Häfen, Städte und Industriezentren. Wir warten nicht länger darauf, dass die Niederlande handeln, sondern leiten selbst eine groß angelegte Militäroffensive ein!"
 INS_take_batavia_explination_tt: "Wenn wir ganz Java besetzten, können wir die Kolonialregierung von innen heraus zerstören und §Ggewinnen den Krieg§!. Sollten wir das jedoch nicht innerhalb von §Y730 Tagen§! schaffen, werden wir §Runtergehen§!."
 INSHOL_linggadjati_agreement: "Einen Waffenstillstand aushandeln"
 INSHOL_linggadjati_agreement_desc: "Die Invasion Javas verläuft schleppend, und unsere Führung wird zunehmend infrage gestellt. Wir sollten uns zurückziehen und uns auf die Verteidigung konzentrieren, damit nicht die gesamte Republik dem Untergang geweiht ist. Ein begrenzter Waffenstillstand mit den Niederlanden wird es uns erlauben, unsere Streitkräfte neu zu formieren, bevor wir uns wieder auf Java konzentrieren."
 INSHOL_increase_esclation_placeholder_tt: "Schaltet eine §YEntscheidung§! frei, die es uns erlaubt, einen lokalen Waffenstillstand auszuhandeln, und §Yverlängert die Zeit§! zur Besetzung von Java."
 # <National Revolution - Peace Negotiation>
 INSHOL_seek_foreign_help: "Unterstützung aus dem Ausland erbitten"
 INSHOL_seek_foreign_help_desc: "Es ist kein Geheimnis, dass es nahezu unmöglich ist, als neu gegründete Nation ohne etablierte Wirtschaft einen Krieg gegen eine hochindustrialisierte Kolonialmacht zu gewinnen. Wir müssen uns an andere Länder wenden und prüfen, ob sie dazu bereit wären, uns zu unterstützen."
 INSHOL_renville_agreement: "Das Abkommen von Renville"
 INSHOL_renville_agreement_desc: "Die beispiellose Aggression der Niederlande lenkte internationale Aufmerksamkeit auf die Revolution, und dennoch verstoßen die Niederlande weiterhin gegen Waffenstillstände und provozieren uns zu einer Reaktion. Wir müssen uns an die [USA.GetAdjective]e Regierung wenden und sie davon überzeugen, sich für Indonesien einzusetzen Die Niederlande werden keine andere Wahl haben, als nachzugeben."
 INSHOL_no_compromise: "Keine Kompromisse, keine Kapitulation"
 INSHOL_no_compromise_desc: "Die Gier der Niederländer führte dazu, dass sie fast ausschließlich in Java investierten und die östlichen Inseln weitgehend ignorierten, wodurch Java zur Achillesferse der gesamten Kolonie wurde. Das wird ihr Untergang sein!"
 INSHOL_end_to_bloodshed: "Zweistaatenlösung"
 INSHOL_end_to_bloodshed_desc: "Dieser Konflikt dauert schon viel zu lange an, ohne dass es in irgendeiner Richtung nennenswerte Fortschritte gibt, und es kommen nur jeden Tag weitere Menschen ums Leben. Niemand möchte, dass dies so weitergeht. Es ist an der Zeit, dass wir uns mit den niederländischen Regierungsvertretern an den Verhandlungstisch setzen."
 INSHOL_reorganize_colonies: "Die Kolonie umstrukturieren"
 INS_we_will_need_another_tt: "Da wir bereits ganz Java kontrollieren, müssen wir einen zusätzlichen Staat neben Java kontrollieren."
 # Industry Branch - New
 INS_centralize_the_state: "Den Staat zentralisieren"
 INS_centralize_the_state_desc: "Von Sumatra bis Sulawesi und von Borneo bis Bangka schuf unser Entwicklungsprogramm Straßen, Fabriken und Institutionen in Territorien, die [1058.GetName] einst nur dem Namen nach verwaltete. Diese Regionen sind keine abgelegenen Provinzen mehr. Sie sind [INS.GetAdjective]."
 INS_centralize_the_state_1_tt: "Notwendige Staaten, die ein §YKern§! sind:"
 INS_centralize_the_state_2_tt: "Notwendige Staaten, die KEIN §YKern§! sind:"
 INS_fate_of_de_javasche_bank: "[INS_fate_of_de_javasche_bank_scripted_name]"
 INS_fate_of_de_javasche_bank_scripted_name_colony: "Die Zukunft der De Javasche Bank"
 INS_fate_of_de_javasche_bank_scripted_name_independent: "Die Zukunft der Bank Indonesia"
 INS_fate_of_de_javasche_bank_desc: "[INS_fate_of_de_javasche_bank_scripted_desc]"
 INS_fate_of_de_javasche_bank_scripted_desc_colony: "Der Indische Gulden ist seit der Weltwirtschaftskrise im freien Fall, und die De Javasche Bank besitzt nicht die nötigen Mittel, den Verfall aufzuhalten. Wir müssen entscheiden, wie wir die Währung stabilisieren, bevor das, was vom Vertrauen der Anleger noch übrig ist, vollständig verschwindet."
 INS_fate_of_de_javasche_bank_scripted_desc_independent: "Wir erbten eine Währung, die sich in einer Krise befand. Der alte Kolonialgulden war bereits schwach, und der Übergang zur Rupiah trug nicht sonderlich dazu bei, die Märkte zu beruhigen. Die Bank Indonesia braucht klare Vorgaben von der Regierung. Sonst wird unsere junge Wirtschaft darunter leiden."
 INS_finish_the_bauxite_project: "Das Bangka-Projekt abschließen"
 INS_finish_the_bauxite_project_desc: "Dank neuer Straßen, Häfen und Eisenbahnen ist Bangka-Belitung nun ideal für den Abbau von Ressourcen geeignet, und unsere Vermessungsteams fanden Vorkommen an Wolfram und Chrom, die unsere ursprünglichen Erwartungen weit übertreffen. Welchen Wert diese Inseln für die Republik haben, ist noch nicht abzuschätzen."
 INS_australian_contracts: "Australische Verträge"
 INS_australian_contracts_desc: "Unsere Kautschukreserven liegen weit über unserem heimischen Bedarf. Da Australien stets auf der Suche nach Rohstoffen für seine eigene Industrie ist, bietet es sich als natürlicher Handelspartner an. Der Abschluss langfristiger Verträge mit australischen Unternehmen würde uns stabile Einnahmen sichern und unsere Position in der regionalen Wirtschaft stärken."
 INS_coopereate_with_chinese_businessmen: "Mit chinesischen Unternehmern zusammenarbeiten"
 INS_coopereate_with_chinese_businessmen_desc: "Die wohlhabende und gut vernetzte Kaufmannsschicht trug seit jeher den Handel im Archipel. Anstatt diese etablierten Netzwerke zu umgehen, sollten wir mit ihnen zusammenarbeiten. Ihr Kapital und ihr Wissen könnten sich als unschätzbar wertvoll erweisen, um unsere Wirtschaft aus der derzeitigen Krise herauszuführen."
 INS_oil_decisions_unlock_tt: "Schaltet neue Entscheidungen für die Kategorie §Y$INS_realign_supply_chains_cat$§! frei, mit denen §YÖl§! verkauft werden kann."
 INS_negotiate_new_contracts_unlock_tt: "Schaltet neue Entscheidungen für die Kategorie §Y$INS_realign_supply_chains_cat$§! frei."
 INS_realign_supply_chains_explain_tt: "Schaltet neue Entscheidungen für die Kategorie §Y$INS_realign_supply_chains_cat$§! frei, um Ressourcen mit einem zweijährigen Leih-Pacht-Abkommen an private Unternehmen zu verkaufen."
 INS_negotiate_new_contracts: "Neue Verträge aushandeln"
 INS_negotiate_new_contracts_desc: "Unser Ruf als zuverlässiger Lieferant öffnete uns Türen, die uns zuvor verschlossen waren. Neue Abnehmer zeigen Interesse, und wir sollten rasch handeln, um sie an uns zu binden, bevor unsere Konkurrenten uns mit günstigeren Angeboten ausstechen können."
 INS_all_in_on_rubber: "Alles auf Kautschuk setzen"
 INS_all_in_on_rubber_desc: "Kautschuk ist unser Trumpf, und wir müssen ihn ausspielen. Jeder verfügbare Hektar muss für den Kautschukanbau genutzt werden und die Lieferketten sind so zu organisieren, dass wir das Produkt schneller und kostengünstiger transportieren können als jeder andere in der Region."
 INS_more_market_resources: "Die Weltwirtschaftskrise überwinden"
 INS_more_market_resources_desc: "Die Welt wurde von der Weltwirtschaftskrise schwer getroffen, doch Krisen bieten auch Chancen für jene, die mutig genug sind, sie zu ergreifen. Indem wir den Markt mit unseren Waren zu Preisen überschwemmen, die kein Konkurrent unterbieten kann, sorgen wir dafür, dass sich indonesische Waren bereits in jedem Regal und jedem Lager befinden, wenn sich die Märkte wieder öffnen."
 # <Industry Branch - Trade Policy>
 INS_recovering_from_the_great_depression: "Von der Weltwirtschaftskrise erholen"
 INS_recovering_from_the_great_depression_desc: "Die Weltwirtschaftskrise hatte verheerende Auswirkungen auf [INS.GetName]. Unsere Wirtschaft ist überwiegend auf dem Export aufgebaut, weshalb uns der weltweite Protektionismus schwer schadete. Da der globale Handel langsam wieder in Schwung kommt, sollten wir uns darauf konzentrieren, neue Märkte zu erschließen, und daran arbeiten, unsere alten Handelswege wiederaufzubauen."
 INS_first_come_first_serve: "Wer zuerst kommt, mahlt zuerst"
 INS_first_come_first_serve_desc: "Der Protektionismus, der sich in Folge der Weltwirtschaftskrise bildete, lässt langsam nach, doch die gesteigerte Produktion und ein überbewerteter Gulden schwächten den niederländischen Exportmarkt stark, da unsere alten Handelspartner im Westen sich nun Südamerika zuwandten, um ihren Bedarf zu decken. Anstatt ihnen hinterherzulaufen und neue Handelsabkommen mit ihnen zu schließen, sollten wir dies als Gelegenheit nutzen, um in den aufkeimenden asiatischen Markt vorzudringen."
 INS_oil_export: "Erhöhte Ölexporte"
 INS_oil_export_desc: "Wir müssen die Ölinfrastruktur in Sumatra und Kalimantan ausbauen, um lukrative Handelsabkommen mit unseren Handelspartnern abzuschließen."
 INS_increased_trade_with_japan: "Handel mit Japan ausweiten"
 INS_increased_trade_with_japan_desc: "[JAP.GetNameDefCap] wurde zu einem wertvollen Handelspartner und ließ uns nicht im Stich. Wir müssen neue Handelsabkommen aushandeln, um die wirtschaftliche Zusammenarbeit zwischen unseren beiden Nationen zu fördern und die Nachwirkungen der Weltwirtschaftskrise hinter uns zu lassen. Dies wird vermutlich unsere Verbündeten im Westen verärgern, insbesondere die Niederlande, doch wenn wir jemals selbst über unser Schicksal bestimmen wollen, müssen wir unsere eigenen Handelsbeziehungen sichern."
 INS_asian_trade_investments: "Asiatische Handelsinvestitionen"
 INS_asian_trade_investments_desc: "Die verheerenden Auswirkungen der Weltwirtschaftskrise führten uns vor Augen, wie stark wir uns bisher auf unsere langjährigen Handelspartner im Westen verließen. Da unsere Wirtschaft in erster Linie auf dem Export basiert, ist es heute wichtiger denn je, dass wir neue Märkte in Südostasien erschließen und diese ausbauen, damit unsere Wirtschaft nicht erneut von einem einzelnen Land abhängig ist."
 INS_asian_trade_investments_tt: "Alle §Y420§! Tage wird sich der Marktmalus auf Ressourcen durch die §YWeltwirtschaftskrise§! um §Y5%§! §Gverbessern§!, bis die negativen Modifikatoren vollständig verschwunden sind."
 INS_declare_free_trade: "Den Freihandel fördern"
 INS_declare_free_trade_desc: "Wir sollten nicht nur mit einem einzigen Land Handel treiben, sondern es dem Markt erlauben, die beste Entscheidung für [INS.GetName] zu treffen."
 INS_japanese_export_contracts: "Ein Handelsabkommen, das über allen anderen steht"
 INS_japanese_export_contracts_desc: "Wir müssen ein umfassendes Handelsabkommen mit der [JAP.GetAdjective]en Regierung ausarbeiten und ihr den gesamten Kautschukvorrat aus [1049.GetName] und [672.GetName] verkaufen. Auch wenn dies bedeutet, dass wir den Kautschuk zu einem sehr günstigen Preis veräußern müssen, haben wir zumindest die Gewissheit, das alles davon verkauft werden wird."
 INS_realign_supply_chains: "Die Lieferketten anpassen"
 INS_realign_supply_chains_desc: "Der Protektionismus, der sich in Folge der Weltwirtschaftskrise bildete, lässt langsam nach, doch die gesteigerte Produktion und ein überbewerteter Gulden schwächten den niederländischen Exportmarkt stark, da unsere alten Handelspartner im Westen sich nun Südamerika zuwandten, um ihren Bedarf zu decken. Wir müssen Maßnahmen ergreifen, um unsere Verbündeten davon zu überzeugen, wieder mit uns zu handeln."
 INS_invite_foreign_companies: "Amerikanische Ölkonzerne unterstützen"
 INS_invite_foreign_companies_desc: "Seit 1930 ist Standard Oil California über seine niederländische Tochtergesellschaft, die Pacific Petroleum Maatschappij, in unserem Land tätig. Ihre Bodenvermessung in Riau war vielversprechend, und wir sollten sie nach besten Kräften unterstützen. Die Entdeckung eines großen Bodenschatzes würde sowohl unsere Einnahmen steigern als auch andere internationale Unternehmen dazu ermutigen, in unserem Land zu investieren."
 INS_expand_sea_routes: "Die Seerouten erweitern"
 INS_expand_sea_routes_desc: "Unser Land ist reich an Bodenschätzen, doch unsere Rohstoffindustrie ist zu stark spezialisiert und es fehlt uns an der notwendigen Infrastruktur, um bestimmte seltene Mineralien wie Chrom und Wolfram abzubauen. Um unsere Produktionskapazitäten im Bereich der Militärausrüstung zu verbessern, müssen wir diese Rohstoffe aus anderen Ländern importieren, doch dazu müssen wir zunächst die Kapazität unserer Handelsflotte erhöhen."
 INS_ship_contracts: "Schiffsverträge sichern"
 INS_ship_contracts_desc: "Der Bau einer Marine ist nötig, um im Fall eines Krieges unsere Handelsrouten zu sichern. Wir können unsere neuen Handelspartnerschaften nutzen, um an Marineverträge zu gelangen."
 # <Industry Branch - Sumatra>
 INS_developing_sumatra: "Sumatra entwickeln"
 INS_developing_sumatra_desc: "Sumatra ist die ressourcenreichste Insel des Archipels, doch die Infrastruktur ist so schlecht, dass ein Großteil der geförderten Rohstoffe gar nicht erst nach Batavia gelangt. Für den Transport wird ein Flickwerk aus unbefestigten Straßen und nicht miteinander verbundenen Eisenbahnstrecken genutzt, was für unsere Pläne für die Insel völlig unzureichend ist. Wir müssen etwas unternehmen."
 INS_sumatra_railway: "Eine Eisenbahn für Sumatra"
 INS_sumatra_railway_desc: "Im Rahmen unserer fortlaufenden Bemühungen, die Infrastruktur Sumatras auszubauen, sollten wir eine große Eisenbahnstrecke anlegen, die vom Norden Atjehs bis zum südlichsten Hafen Sumatras führt und von dort aus eine schnelle Schiffsverbindung nach Batavia bietet. Dadurch müssen wir Ressourcen nur bis zum nächsten Bahnhof transportieren, von wo aus sie innerhalb weniger Tage nach Batavia befördert werden."
 INS_develop_borneo: "Kalimantan entwickeln"
 INS_develop_borneo_desc: "Kalimantan birgt enormes Potenzial, doch die Insel ist nur sehr spärlich erschlossen und die Bevölkerung leidet Armut. Der Warentransport stützt sich stark auf die Flüsse und Wasserwege der Insel, und jegliche Fernkommunikation ist wegen der unzureichenden Stromversorgung beinahe unmöglich. Durch den Bau von Stromleitungen und Straßen schaffen wir die Grundlage für die spätere Bodenvermessung und den Ressourcenabbau."
 INS_kalimantan_mic: "Militärindustrie Kalimantan"
 INS_kalimantan_mic_desc: "Unsere Investitionen in die Entwicklung der Infrastruktur in Kalimantan machten sich bezahlt. Der leichte Zugang zu Strom und Kommunikation brachte uns in Kontakt mit Gemeinschaften, über die unsere Regierung bislang keine Kontrolle ausübte. Wir können diese Gelegenheit nutzen, um unsere Militärproduktion durch den Bau neuer Fabriken in der Region zu steigern, in denen wir anschließend diese günstigen Arbeitskräfte beschäftigen."
 INS_pontianak_to_balikpapan: "Von Pontianak nach Tanjung Selor"
 INS_pontianak_to_balikpapan_desc: "Die Idee, eine Eisenbahn in Kalimantan zu bauen, wurde weitreichend diskutiert, doch das raue, weitgehend unerforschte Terrain im Zentrum der Insel macht dieses Unterfangen zu einem Mammutprojekt. Die einzige Lösung liegt in einer U-förmigen Eisenbahnstrecke von Küste zu Küste. Dies wird nicht günstig, doch langfristig wird es sich bezahlt machen."
 INS_develop_sulawesi: "Sulawesi entwickeln"
 INS_develop_sulawesi_desc: "Sulawesi ist der Mittelpunkt des Archipels und besitzt damit einen wichtigen strategischen Wert. Wir müssen Straßen bauen und eine Energie- und Kommunikationsinfrastruktur schaffen, damit wir die Insel im Fall eines Krieges als Militärbasis nutzen können."
 # <Industry Branch - Bangka Project>
 INS_the_bangka_project: "Das Bangka-Projekt"
 INS_the_bangka_project_desc: "Die Bangka-Belitung-Inseln sind zwar klein, aufgrund ihrer Bauxitvorkommen jedoch extrem wichtig für die indonesische Wirtschaft. Wir müssen auf Bangka-Belitung Straßen, Häfen und Eisenbahnstrecken bauen, um sicherzustellen, dass wir die reichen Mineralienvorkommen in vollem Umfang nutzen."
 INS_aluminium_factory: "Aluminiumfabrik Pangkalpinang"
 INS_aluminium_factory_desc: "Der Abbau von Rohbauxit nimmt zu, doch die fehlende Aluminiumproduktion schränkt unsere Gewinne ein. Als Provinzhauptstadt der Bangkal-Belitung-Inseln wäre Pangkalpinang ein idealer Standort für solche Fabriken und würde es uns erlauben, Zwischenhändler zu umgehen und unsere Erträge zu maximieren."
 INS_bauxite_export: "Noch mehr auf Bauxit-Exporte setzen"
 INS_bauxite_export_desc: "Durch das Bangka-Projekt verfügen wir nun über mehr Rohbauxit, als wir verwerten können. Da es schwierig werden könnte, die gesamte Menge zu verkaufen, sollten wir unser Bauxit zu einem deutlich niedrigeren Preis anbieten als jeder andere auf dem Markt. Angesichts der schieren Menge an Bauxit, die wir verkaufen können, würde dies im Vergleich zu unseren derzeitigen Exporten dennoch zu einem proportionalen Gewinnwachstum führen."
 INS_tin_mining: "In den Zinnabbau investieren"
 INS_tin_mining_desc: "Die Geschichte des Zinnabbaus auf den Bangka-Belitung-Inseln reicht bis in die Zeit vor der europäischen Besiedlung des Archipels zurück. Alles, was wir machen müssen, ist, die vorhandene Zinnindustrie auf den Inseln zu modernisieren. Dies wird ein kostspieliges Unterfangen und unsere bestehende Zinnindustrie wird während des Umbaus für einige Zeit nicht betriebsbereit sein, doch langfristig erhöht es unsere Gewinne immens."
 in_240_days_tt: "§YIn 240 Tagen:§!\n"
 INS_tin_to_usa: "Zinn an [USA.GetName] verkaufen"
 INS_tin_to_usa_desc: "[USA.GetNameDefCap] besitzt zahlreiche Unternehmen und staatliche Einrichtungen, die Zinn kaufen. Da wir in den letzten stark in unsere Minen investierten, bietet sich die Chance, hier große Gewinne zu erzielen."
 INS_tin_to_japan: "Zinn an [JAP.GetName] verkaufen"
 INS_tin_to_japan_desc: "[JAP.GetNameDefCap] verfügt über viele Schiffe, die man selbst als veraltet ansieht und ersetzt hat, aber ideal zur [INS.GetAdjective]en Marine passen würden. Wir sollten diese Schiffe durch die Erlöse aus unserer Zinnproduktion erwerben."
 INS_tin_to_japan_tt: "[JAP.GetNameDefCap] übergibt uns §Y9§! ältere Zerstörer."
 INS_new_bauxite_routes: "Neue Bauxitrouten"
 INS_new_bauxite_routes_desc: "Unsere Strategie, die Marktpreise zu unterbieten, um unser Exportvolumen an Bauxit zu steigern, war ein voller Erfolg und wir konnten unseren Gesamtumsatz deutlich steigern. Wir dürfen uns jedoch nicht auf diesem Erfolg ausruhen. Wir müssen unser Handelsnetzwerk weiter ausbauen, unsere Lieferketten optimieren und nach weiteren Möglichkeiten suchen, um unsere Gewinne zu maximieren."
 INS_bangka_bauxite_export_flag: "Hat den Schwerpunkt §Y$INS_bauxite_export$§! abgeschlossen"
 INS_not_industry: "Plan für die Zukunft"
 INS_not_industry_desc: "Java ist das pulsierende Herz unserer Nation, Heimat eines Großteils unserer Bevölkerung und Sitz unserer Regierung. Bevor wir die Insel ernsthaft industrialisieren können, müssen wir zunächst die Voraussetzungen dafür schaffen: Landvermessungen, Flächennutzungspläne und die Freigabe von Baugrundstücken gewährleisten, dass die Fabriken, wenn sie kommen, dort errichtet werden, wo sie den größten Nutzen bringen."
 INS_construction_focus: "Industrieller Aufschwung"
 INS_construction_focus_desc: "Ausländisches Kapital fließt ins Land, die Exporteinnahmen steigen, und zum ersten Mal seit Jahren steht echtes Geld zur Verfügung, das man in die heimische Industrie investieren kann. Wir müssen die Gunst der Stunde nutzen und so viele Bauvorhaben wie möglich realisieren."
 # <Industry Branch - Java>
 INS_developing_java: "Infrastruktur auf Java erweitern"
 INS_developing_java_desc: "Java ist die mit Abstand am stärksten industrialisierte Insel des Archipels und erwirtschaftet den Großteil unseres Wohlstands. Städte wie Batavia leiden jedoch zunehmend unter dem Bevölkerungswachstum. Wir sollten diese Städte durch den Bau neuer Wohnungen, Gewerbegebiete, Straßenbahnen, Züge und Fabriken erweitern, um die wachsende Einwohnerzahl zu bewältigen."
 INS_prioritize_sugar_economy: "Die Zuckerwirtschaft priorisieren"
 INS_prioritize_sugar_economy_desc: "Wir sollten die staatlichen Mittel kürzen, die noch immer in die industrielle Entwicklung Batavias fließen. Die Stadt ist bereits weitaus stärker industrialisiert als jede andere Stadt im Archipel. Stattdessen sollten wir dieses Geld dafür aufwenden, im ganzen Land zahlreiche kleinere Palmenplantagen anzulegen. Diese Plantagen werden Palmzucker produzieren, einen Rohstoff, der international sehr gefragt ist."
 INS_all_cards_into_industry: "Alles auf die Industrie setzen"
 INS_all_cards_into_industry_desc: "Die Industrialisierung hatte massive Auswirkungen auf die Wirtschaft von [1058.GetName]. Wenn wir die gesamte Insel mit ihren Millionen Einwohnern industrialisieren, könnten wir weltweit Einfluss gewinnen."
 INS_expand_batavia_technical_institute: "Die technische Hochschule von Batavia erweitern"
 INS_expand_batavia_technical_institute_desc: "Indem wir die technische Hochschule von Batavia erweitern, können wir mehr Studenten aufnehmen und unsere technologische Entwicklung beschleunigen."
 INS_quinine_export: "Lukrativeres Chinin-Abkommen"
 INS_quinine_export_desc: "Das Cinchona-Büro in Amsterdam besitzt nahezu ein Monopol auf den Export von Chinin, was besonders profitabel ist, da Chinin weltweit als Malariamedikament sehr gefragt ist. Obwohl das Büro den Großteil des Chinins aus Niederländisch-Indien bezieht, erhalten wir nur einen sehr geringen Anteil an den Gewinnen. Wir sollten unsere Chinin-Produktion als Druckmittel nutzen, um eine gerechtere Übereinkunft zu treffen."
 INS_spend_profits_on_rural: "Gewinne in die Landentwicklung stecken"
 INS_spend_profits_on_rural_desc: "Mit dem Abschluss unseres neuen Chinin-Abkommens haben wir nun die Möglichkeit, unsere zusätzlichen Einnahmen für den Ausbau der Verkehrs- und Kommunikationsinfrastruktur in den ländlichen Gebieten zu nutzen und damit den Weg für die künftige industrielle Entwicklung zu ebnen."
 INS_spend_profits_on_urban: "Gewinne in die Stadtentwicklung stecken"
 INS_spend_profits_on_urban_desc: "Mit dem Abschluss unseres neuen Chinin-Abkommens haben wir nun die Möglichkeit, unsere zusätzlichen Einnahmen für den Ausbau der batavischen Industrie zu nutzen, um unsere Wirtschaft zu diversifizieren und unsere Abhängigkeit vom Rohstoffexport zu verringern."
 INS_spend_profits_on_military: "Gewinne in die Militärentwicklung stecken"
 INS_spend_profits_on_military_desc: "Mit dem Abschluss unseres neuen Chinin-Abkommens haben wir nun die Möglichkeit, unsere zusätzlichen Einnahmen in unser Militär zu investieren und neue Waffenfabriken in Yogyakarta und Semarang zu bauen."
 INS_end_to_bloodshed_tt: "Der Krieg endet, und eine neue Grenze wird basierend auf der derzeitigen Besetzung gezogen. Java, Sumatra und Borneo werden von der Seite §Yannektiert§!, die derzeit die höchste Kontrolle in dem Gebiet hat."
