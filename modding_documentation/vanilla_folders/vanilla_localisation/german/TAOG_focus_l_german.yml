 ###   SIAM   ###
 ################
 SIA_the_khana_ratsadon: "Die Khana Ratsadon"
 SIA_the_khana_ratsadon_desc: "Die Volkspartei beendete den Absolutismus und ebnete den Weg für eine konstitutionelle Regierung. Ihr Vermächtnis wurde seitdem verraten und mit Blut besudelt, doch das Fundament, auf dem eine moderne [SIA.GetAdjective]e Regierung aufgebaut werden kann, besteht."
 SIA_the_khana_ratsadon_tt: "\nDie §YKhana Ratsadon§! wird aktiv.\n\nDie §YKhana Ratsadon§! ist die führende Partei in [ROOT.GetName] und in den §YArmeeflügel§! und den §YZivilflügel§! aufgeteilt.\n\nDer §YZivilflügel§! befürwortet im Allgemeinen eine demokratiefreundlichere Politik mit einem Schwerpunkt auf der Zivilindustrie, wohingegen sich der §YMilitärflügel§! für eine faschistischere Politik und die Militarisierung der Industrie einsetzt.\n\nUnsere Entscheidungen haben Einfluss darauf, ob sie uns mehr oder weniger mögen, und geben uns verschiedene Boni oder Mali.\nSollten sie rebellieren, könnten sie einen Staatsstreich wagen.\n\nDie Zustimmungsstufen sind §YRebellisch§!, §YDagegen§!, §YNeutral§!, §Yleichte Unterstützung§! und §Yvolle Unterstützung§!"
 SIA_shuffle_pridi_to_the_minister_of_interior: "Die Position des Zivilflügels stärken"
 SIA_shuffle_pridi_to_the_minister_of_interior_desc: "Indem Pridi vom Außenminister zum Innenminister ernannt wird, kann er die Verteilung der staatlichen Ressourcen effektiver kontrollieren und den zunehmenden Einfluss des Militärs bremsen."
 SIA_shuffle_pridi_to_the_minister_of_interior_tt: "§Y$anti_fascist_raids$§! erhöhen jetzt die Zustimmung des §YZivilflügels§! und reduzieren die Zustimmung des §YMilitärflügels§!"
 SIA_civil_nationalism: "Ziviler Nationalismus"
 SIA_civil_nationalism_desc: "Jeder Thailänder, unabhängig von seinem Status, sollte seine Loyalität nicht einer Regierung oder einer Person schenken, sondern vielmehr der Wahrung von Werten wie Freiheit, Unabhängigkeit und Gleichheit, unabhängig davon, wer gerade an der Macht ist."
 SIA_the_true_heirs_of_1932: "Die wahren Erben von 1932"
 SIA_the_true_heirs_of_1932_desc: "Das Militär stellt die Revolution von 1932 gern als seine alleinige Errungenschaft dar und verschweigt dabei, dass es sich um einen Sieg des Volkes handelte. Das Volk muss an diese Tatsache erinnert werden, um Kraft daraus zu schöpfen."
 SIA_thammasat_university: "Thammasat-Universität"
 SIA_thammasat_university_desc: "Die neu gegründete Universität in Thammasat könnte und sollte ausgebaut werden, um den Weg für ein neues Zeitalter der thailändischen Innovation zu ebnen."
 SIA_defenders_of_constitutional_liberty: "Schutz der verfassungsmäßigen Freiheit"
 SIA_defenders_of_constitutional_liberty_desc: "Lehrer, Bankangestellte, Krankenschwestern: Die gebildete Mittelschicht muss mobilisiert werden, um die Freiheit zu schützen, wenn das Militär zu weit geht."
 SIA_dominate_public_symbols: "Öffentliche Symbole verbreiten"
 SIA_dominate_public_symbols_desc: "Der militärische Flügel dominierte lange die öffentlichen Symbole und errichtete Denkmäler und rief Feiertage aus, um sich selbst zu feiern. Wir müssen dem entgegenwirken, indem wir unsere eigenen Symbole schaffen, das Recht des Volkes auf Selbstbestimmung fördern und den Sieg über die alte Autokratie feiern."
 SIA_civil_service_heroism: "Helden des öffentlichen Dienstes"
 SIA_civil_service_heroism_desc: "Jedem Thailänder muss vermittelt werden, dass er die Pflicht hat, die Rechtsstaatlichkeit zu schützen, sollte irgendeine Macht versuchen, ob nun aus dem Inland oder aus dem Ausland, die Herrschaft an sich zu reißen. Sollte jemand danach trachten, uns unsere Freiheit zu nehmen, brauchen wir nicht nur die Unterstützung des Volkes, sondern das Volk selbst muss zum Bannerträger werden."
 SIA_spread_democratic_sentiment_in_universities: "Demokratisches Verständnis an Universitäten verbreiten"
 SIA_spread_democratic_sentiment_in_universities_desc: "Unsere Wissenschaftler werden darüber bestimmen, in welche Richtung sich [SIA.GetName] entwickelt. Was sie heute lernen, wird sich in der Zukunft widerspiegeln. Den Wissenschaftlern von heute ein starkes demokratisches Pflichtbewusstsein zu vermitteln, erlaubte es uns, die Demokratie über die akademischen Hallen hinaus zu verbreiten."
 SIA_sideline_disloyal_officers: "Illoyale Offiziere aus Schlüsselpositionen entfernen"
 SIA_sideline_disloyal_officers_desc: "Das Offizierskorps der Armee ist kein Monolith. In seinen Reihen befinden sich Männer, deren Loyalität eher ehemaligen Geldgebern, rivalisierenden Fraktionen oder ihren eigenen Ambitionen gilt als der Regierung. Mittels gezielter Versetzungen und administrativem Druck lassen sich diese Offiziere in Positionen versetzen, wo sie keine Gefahr mehr darstellen, während jene, die ihre Loyalität bewiesen haben, mit den Aufgaben betraut werden können, die sie verdienen."
 SIA_sideline_disloyal_officers_tt: "Zwei zufällige Generäle erhalten für 4 Jahre die Eigenschaft §YVersetzt§!, was dazu führt, dass sie keine Boni geben.\nZwei zufällige Generäle, die NICHT die Eigenschaft §YVersetzt§! besitzen, erhalten zusätzliche Werte und eine zusätzliche Eigenschaft."
 SIA_direct_funds_from_the_military_towards_development: "Gelder des Militärs in die Entwicklung umleiten"
 SIA_direct_funds_from_the_military_towards_development_desc: "Auch wenn der Militärflügel nicht besonders glücklich damit sein wird, dass seine Gelder für Entwicklungsprojekte genutzt werden, liegt es in seiner Verantwortung und nicht in unserer, der Öffentlichkeit zu erklären, warum dieser Mangel an Investitionen letztlich für sie von Vorteil ist."
 SIA_as_the_eyes_turn_towards_southeast_asia: "Alle Blicke richten sich auf Asien"
 SIA_as_the_eyes_turn_towards_southeast_asia_desc: "Südostasien ist kein ferner Kriegsschauplatz mehr. Es ist ein Schmelztiegel von Großreichen, Revolutionen und Krieg. [SIA.GetNameDefCap] muss entscheiden, ob es in diesen Konflikten die Schachfigur anderer sein will oder aber eigene Ziele anstrebt."
 SIA_support_songsuradets_military_clique: "Songsuradets Militärclique unterstützen"
 SIA_support_songsuradets_military_clique_desc: "Nicht jeder Offizier ist ein Feind der Nation. Songsuradet und seine Getreuen bieten eine disziplinierte militärische Alternative zu den korrupten Generälen, die Siam an den Abgrund brachten. Mit ihrer Unterstützung lässt sich die Ordnung wiederherstellen, ohne den Staat dem Chaos zu überlassen."
 SIA_support_songsuradets_military_clique_tt: "Sollte ein §YBürgerkrieg§! ausbrechen, wird uns Songsuradet unterstützen, wodurch wir §Y3§! zusätzliche Divisionen erhalten\n§RWenn wir Songsuradet zunächst stärken und anschließend im Zuge der Songsuradet-Rebellion festnehmen wollen, könnte er versuchen, sich zu widersetzen.§!"
 SIA_the_royal_police_counterweight: "Die Königliche Polizei"
 SIA_the_royal_police_counterweight_desc: "Die Königliche Polizei agiert als unabhängige Kraft und kann gegen die Opposition eingesetzt werden, sollte diese versuchen, die Macht an sich zu reißen."
 SIA_the_royal_police_counterweight_tt: "Sollte ein §YBürgerkrieg§! ausbrechen, wird uns die Königliche Polizei unterstützen, wodurch wir §Y2§! zusätzliche Division erhalten"
 SIA_for_the_preservation_of_siamese_independence: "Die Kontrolle des militärischen Flügels stärken"
 SIA_for_the_preservation_of_siamese_independence_desc: "Im letzten Jahrhundert verletzten die Großmächte mehr als nur einmal unsere territoriale Integrität, und dieses Jahrhundert scheint nicht anders zu sein. Wir müssen entschlossen handeln, wenn wir unsere Lebensweise bewahren wollen, damit wir nicht zu einem Staat werden, der gelähmt, gespalten und zerrissen ist."
 SIA_for_the_preservation_of_siamese_independence_tt: "§Y$anti_democratic_raids$§! erhöhen jetzt die Zustimmung des §YMilitärflügels§! und reduzieren die Zustimmung des §YZivilflügels§!"
 SIA_the_peoples_day: "Volksfeiertag"
 SIA_the_peoples_day_desc: "Anstatt die Rolle des Militärs beim Sturz der alten Monarchie weiter zu betonen, sollten wir die Rolle des Volkes hervorheben. Die Einführung eines Volksfeiertags mobilisiert das Volk für unsere Sache und bringt ihm bei, auch nichts weniger zu erwarten."
 SIA_hold_military_parades: "Militärparaden abhalten"
 SIA_hold_military_parades_desc: "Wir werden eine große Parade in Bangkok abhalten, um die Moral unseres Militärs zu stärken, unsere treuen Generäle zu belohnen und unsere Bürger an die Macht der [SIA.GetAdjective]en Armee zu erinnern. Dies wird auch den Zeitungen etwas geben, was es wert ist, gedruckt zu werden!"
 SIA_embed_technocrats_in_civilian_institutions: "Technokraten in zivile Institutionen einbinden"
 SIA_embed_technocrats_in_civilian_institutions_desc: "Wir können Bündnisse mit Technokraten in der Regierung bilden und sie als verlängerten Arm des zivilen Flügels nutzen, um dem Einfluss des Militärs entgegenzuwirken und insgesamt mehr zu erreichen."
 SIA_military_academies_indoctrination: "Indoktrinierung an Militärakademien"
 SIA_military_academies_indoctrination_desc: "Unsere Militärakademien sind der ideale Ort für eine Indoktrinierung, da sie über die dafür nötigen Mittel verfügen und sich junge Kadetten leicht von ihren Ausbildern beeinflussen lassen. Wer die Ausbilder auf seine Seite zieht, zieht auch die militärische Jugend auf seine Seite. Ein starkes Militär, das der Regierung treu ergeben ist, bildet die Grundlage eines jedes mächtigen Staates, und wir werden ein solch mächtiger Staat sein."
 SIA_the_king_of_the_white_elephant: "König der weißen Elefanten"
 SIA_the_king_of_the_white_elephant_desc: "Die Hysterie um die Rückeroberung verlorener Gebiete droht, die Nation zu überwältigen, und die Welt schaut gebannt zu. Wir müssen einen Antikriegsfilm produzieren, den ersten thailändischen Film, der in englischer Sprache gedreht wird, um der Welt das wahre [SIA.GetName] zu zeigen."
 SIA_the_king_of_the_white_elephant_tt: "Schaltet bei Abschluss des Schwerpunkts §Y$SIA_sala_chaloem_thai_movie_theater$§! die Propaganda-Kampagne §Y$SIA_the_king_of_the_white_elephant$§! frei, die Folgendes gibt:\nWöchentliche Stabilität: §G+0.45%§! für 180 Tage"
 SIA_drum_up_irredentism: "Mit dem Irredentismus werben"
 SIA_drum_up_irredentism_desc: "Es reicht nicht aus, uns einfach nur die Unterstützung des Militärs für einen zukünftigen Krieg zu sichern. Wir müssen auch die Unterstützung der breiten Bevölkerung für unsere Sache gewinnen. Mit Gedichten, Filmen und Reden bereiten wir [SIA.GetName] darauf vor, mit den Imperialisten abzurechnen, die uns unseres Landes beraubt haben."
 SIA_sell_privy_purse_lands: "Land im Privatbesitz verkaufen"
 SIA_sell_privy_purse_lands_desc: "Die riesigen Ländereien der einstigen Königsfamilie stehen nun unter unserer Kontrolle. Wir könnten sie nutzen, um unsere Kassen zu füllen, und Teile davon könnten zu günstigen Preisen an ausgewählte Offiziere verkauft werden, um uns deren Loyalität zu sichern."
 SIA_sell_privy_purse_lands_tt: "Bei Auslaufen des Nationalgeistes wird §Y[SIA_phraya_phahon.GetName]§! in einen Skandal verwickelt, wodurch die Faschismus-Anforderungen für §Y$SIA_phibuns_premiership$§! umgangen werden können."
 SIA_war_fervor: "Kriegseifer"
 SIA_war_fervor_desc: "Die Kriegstrommeln erklingen in Erwartung des bevorstehenden Konflikts. Die Menschen sind bereit, die Lunte ist gezündet, und die Zustimmung für den bevorstehenden Krieg wird schon bald ihren Höhepunkt erreichen. Wir müssen sicherstellen, dass wir all diese Energie für eine gute Sache einsetzen."
 SIA_war_fervor_tt: "Die Kriegsunterstützung wird dauerhaft erhöht, bis wir einem anderen Land eine Kriegserklärung aussprechen, woraufhin der Nationalgeist entfernt wird.\n\nSollte die §YKriegsunterstützung§! für eine zu lange Zeit ohne Kriegserklärung bei über §Y95%§! liegen, bricht ein Bürgerkrieg aus.\nBei Kriegserklärung: "
 SIA_the_midnight_meeting: "Das Mitternachtstreffen"
 SIA_the_midnight_meeting_tt: "[SIA_plaek_phibunsongkhram.GetName] übernimmt die Macht in [SIA.GetName] und wird die Regierung anführen. Wir müssen ihn absetzen, wenn wir die Monarchie wiederherstellen wollen."
 SIA_the_midnight_meeting_desc: "Feldmarschall Songsuradet beobachtet den stetigen Machtzuwachs Phibuns mit großer Besorgnis. Wenn die Monarchie und Songsuradet fortbestehen sollen, müssen sich Royalisten, hohe Offiziere sowie zivile Würdenträger im Geheimen versammeln und eine Übereinkunft über die Absetzung von Phibun treffen, bevor dieser seinerseits gegen sie vorgeht."
 SIA_meet_with_king_prajadhipok: "Mit König Prajadhipok treffen"
 SIA_meet_with_king_prajadhipok_desc: "Eine Verschwörung ohne König ist nichts als eine weitere militärische Intrige. Indem wir uns mit dem im Exil befindlichen König Prajadhipok treffen, verleihen wir ihrem Anliegen königliche Legitimität und sichern uns den Segen des einzigen Mannes, dessen Rückkehr die Zögernden hinter sich vereinen und das Regime spalten könnte."
 SIA_prajadhipok_audience_with_churchill: "Prajadhipoks Audienz bei [ENG.GetLeader]"
 SIA_prajadhipok_audience_with_churchill_desc: "Prajadhipoks Aufenthalt in [ENG.GetName] kann neben Prestige noch einen größeren Nutzen haben. Sollte es ihm gelingen, [ENG.GetLeader] davon zu überzeugen, dass ein Aufstand der Loyalisten den britischen Interessen in Asien dient, könnten Waffen aus Malaya doch noch in die Hände derer gelangen, die der Krone treu ergeben sind."
 SIA_prajadhipok_audience_with_churchill_tt: "[ENG.GetNameDefCap] versorgt uns mit"
 SIA_prajadhipok_audience_with_churchill_tt2: "Bei Ausbruch des Bürgerkriegs."
 SIA_facilitate_prajadhipoks_move_to_japan: "Prajadhipoks Japanbesuch nutzen"
 SIA_facilitate_prajadhipoks_move_to_japan_desc: "Großbritannien ist nicht die einzige Macht, die von Unruhen in [ROOT.GetName] profitieren würde. Prajadhipok muss nach Japan reisen und uns die Gunst Tokios sichern und vielleicht sogar die Zusicherung erhalten, dass Truppen zur Verfügung gestellt werden, sollte ein Aufstand der Royalisten in einen Bürgerkrieg ausarten."
 SIA_facilitate_prajadhipoks_move_to_japan_tt: "3 Ranger-Divisionen aus [JAP.GetName] werden uns während des Bürgerkriegs unterstürzen."
 SIA_the_kings_gambit: "Königsgambit"
 SIA_the_kings_gambit_desc: "Prajadhipok kehrt mit der Erwartung nach Bangkok zurück, dass ihn das Regime verhaften wird. Dies wird den Royalisten, die noch zögern, den nötigen Anlass geben, sich in seinem Namen zu erheben. Sobald der im Exil lebende König festgenommen wurde, wird das Signal gegeben und der Kampf um [ROOT.GetName] beginnt."
 SIA_the_kings_gambit_tt: "Unsere Unterstützung hängt davon ab, wie viele der Cliquen wir auf unserer Seite haben."
 SIA_restore_order: "Wiederherstellen der Ordnung"
 SIA_restore_order_desc: "Der Bürgerkrieg ist gewonnen, aber ein Sieg allein heilt kein Königreich. Trümmer müssen wiederaufgebaut, die alte Garde befrieden und die Verwaltung neu strukturiert werden, damit [ROOT.GetNameDef] aus dem Chaos emporsteigt, die Krone gesichert ist und das öffentliche Leben wieder in seine geordneten Bahnen zurückfindet."
 SIA_ananda_age_trigger_12: "König Ananda ist mindestens §Y12§! Jahre alt (derzeit §Y[?var:SIA_anandas_age]§!). Sein Geburtstag ist der 20. September"
 SIA_ananda_age_trigger_15: "König Ananda ist mindestens §Y15§! Jahre alt (derzeit §Y[?var:SIA_anandas_age]§!). Sein Geburtstag ist der 20. September"
 SIA_ananda_trait_tt: "Wenn Ananda den Thron besteigt, erhält er:"
 SIA_to_forge_a_king: "Machtübernahme des Königs"
 SIA_to_forge_a_king_desc: "König Ananda befindet sich derzeit fern des Throns in der Schweiz und ist aufgrund seines jungen Alters noch in der Entwicklung. Indem wir seine Ausbildung in die von uns gewünschten Bahnen lenken, wird er nach seiner Thronbesteigung nicht nur eine Symbolfigur sein, sondern ein Herrscher, der unseren Vorstellungen für [ROOT.GetName] entspricht."
 SIA_to_forge_a_king_tt: "Der zukünftige König Ananda Mahidol ist noch jung und lebt derzeit in der [SWI.GetName]. Wir können Einfluss auf seine Ausbildung und seine Interessen nehmen und dafür sorgen, dass er eines Tages zu einem großen König heranwächst.\n\nJedes Jahr, an seinem Geburtstag, bis er 15 Jahre alt ist, können wir ein Interessengebiet wählen, dem er sich widmen soll. Diese Gebiete geben unterschiedliche Boni, wenn er letzten Endes den Thron besteigt.\n\nSein Geburtstag ist der 20. September, und er ist derzeit §Y[?var:SIA_anandas_age]§! Jahre alt"
 SIA_ascend_the_throne: "Thronbesteigung"
 SIA_ascend_the_throne_desc: "Die Regentschaft kann nicht ewig bestehen. Ananda ist nun alt genug, um die Last des Königtums selbst zu tragen, und seine offizielle Thronbesteigung wird es der Monarchie erlauben, sich von der Vormundschaft und den Intrigen zu lösen und in eine neue, legitime Regierungszeit überzugehen."
 SIA_the_provincial_council_of_state: "Provinzrat des Staates"
 SIA_the_provincial_council_of_state_desc: "Die Kämpfe legen den Regierungsapparat lahm und untergraben die Autorität. Bis der junge König Ananda in eigenem Namen regieren kann, muss ein Provinzrat als Übergangsregierung fungieren und dafür sorgen, dass die Loyalisten nicht für sich selbst, sondern für die Wiederherstellung der rechtmäßigen Monarchie kämpfen."
 SIA_the_regency_of_boworadet: "Die Regentschaft von Boworadet"
 SIA_the_regency_of_boworadet_desc: "Prinz Boworadet verkörpert die alte Ordnung, und niemand wird je daran zweifeln, wem seine Treue gilt. Indem wir ihn im Namen Anandas zum Regenten ernennen, legen wir die Staatsgeschäfte in konservative Hände und verdeutlichen, dass die Wiederherstellung der Monarchie mehr ist als nur ein einfacher Ministerwechsel."
 SIA_the_sacred_hierarchy: "Heilige Hierarchie"
 SIA_the_sacred_hierarchy_desc: "Boworadet vertritt die Ansicht, dass das Königreich am stärksten ist, wenn jeder Stand seinen Platz kennt und die Krone über allen weltlichen Ambitionen steht. Die Monarchie, der Glaube und die natürliche Hierarchie von [ROOT.GetName] müssen wieder als Säulen des Landes betrachtet werden und nicht als Relikte, über die man verhandeln kann."
 SIA_the_regency_of_songsuradet: "Songsuradets Regentschaft"
 SIA_the_regency_of_songsuradet_desc: "Songsuradet ist kein Liberaler, doch er ist auch nicht blind für die Bedürfnisse eines modernen Staates. Als Regent kann er die königliche Autorität wahren und gleichzeitig die Zukunft von [ROOT.GetName] Disziplin, Planung und einem vom Militär geleiteten Programm der nationalen Entwicklung anvertrauen."
 SIA_order_discipline_and_unity: "Disziplin und Einheit anordnen"
 SIA_order_discipline_and_unity_desc: "Die chaotische Parteipolitik und der Bürgerkrieg haben das Königreich fast zerstört. Songsuradets Antwort ist klar: Ordnung in der Regierung, Disziplin in der Gesellschaft und Einigkeit in den Zielen, damit das Königreich zu einem stärkeren und moderneren Staat umgestaltet werden kann."
 SIA_the_regency_of_rangsit: "Rangsits Regentschaft"
 SIA_the_regency_of_rangsit_desc: "Prinz Rangsit versteht, dass die Monarchie nur überdauern wird, wenn sie mit der Volksvertretung zusammenarbeitet. Seine Regentschaft verspricht, die alte Monarchie wiederherzustellen, die in ihrer Würde konservativ, in ihrer Vorgehensweise jedoch demokratisch ist und [ROOT.GetName] in eine stabile parlamentarische Zukunft lenken wird."
 SIA_constitutional_virtue: "Konstitutionelle Tugenden"
 SIA_constitutional_virtue_desc: "Eine Monarchie, die das Recht achtet, ist schwerer zu stürzen und leichter zu verteidigen. Unter Rangsits Führung werden wir die konstitutionelle Regierung wiederherstellen, die Willkür, die Macht oft begleitet, einschränken und dem Volk vermitteln, dass die Krone am sichersten ist, wenn sie als Hüterin der rechtmäßigen Freiheit auftritt."
 SIA_an_absolute_monarchy: "Absolute Monarchie"
 SIA_an_absolute_monarchy_desc: "Das Experiment der begrenzten Monarchie hatte nur Demütigungen, Staatsstreiche und die Untergrabung der königlichen Macht durch ehrgeizige Offiziere zur Folge. Wenn der Thron seine Autorität wahren soll, muss die Krone ihre alten Privilegien zurückerhalten und darf nicht Parteien oder einem Parlament untergeordnet sein."
 SIA_a_constitutional_monarchy: "Konstitutionelle Monarchie"
 SIA_a_constitutional_monarchy_desc: "Der Thron muss nicht die alleinige Staatsgewalt sein, um das Königreich zu erhalten. Durch die Wiederherstellung der Monarchie im Rahmen einer tragfähigen Verfassungsordnung können wir Krone und Volk miteinander verbinden und sicherstellen, dass die königliche Würde und eine verantwortungsvolle Regierungsführung nebeneinander bestehen."
 SIA_to_lay_the_bait: "Köder auslegen"
 SIA_to_lay_the_bait_tt: "Wir lassen einen erfundenen Wirtschaftsplan durchsickern, um das Militär zu erzürnen.\nJe länger wir mit §Y$SIA_and_spring_the_trap$§! warten, desto größer wird der Widerstand gegen das Militär anwachsen und desto stärker wird unsere Unterstützung ausfallen.\n\n$SIA_dem_event_count_cw_scale_tt$\n\nJedes Mal, wenn das Militär unseren Scheinentwurf kritisiert, wird unsere Unterstützung im Bürgerkrieg zunehmen (maximal §Y75%§!). Durch die demokratische Unterstützung (skaliert von §Y0%-100%§!) können wir zusätzlich §Y25%§! Unterstützung für den Bürgerkrieg gewinnen"
 SIA_dem_event_count_cw_scale_tt: "§YDerzeit erwartete Unterstützung§!: §G[?var:SIA_dem_event_count_cw_scale|%]§!"
 SIA_to_lay_the_bait_desc: "Das gelbe Dossier fordert Wirtschaftsreformen, doch das Militär wird diese als kommunistisch abtun. Indem wir zunächst einen gefälschten, radikalen Entwurf an die Öffentlichkeit bringen, können wir das Militär verärgern und es anschließend diskreditieren, sobald die echte, gemäßigtere Fassung veröffentlicht wird."
 SIA_and_spring_the_trap: "Und die Falle zuschnappen lassen"
 SIA_and_spring_the_trap_desc: "Die Generäle schluckten den Köder. Ihre Empörung führte zu einer Rebellion, und diese Rebellion offenbarte ihre Ambitionen. Da die Zivilregierung darauf vorbereitet war, konnte die Falle zuschnappen. Über die Zukunft von [ROOT.GetName] werden nun diejenigen entscheiden, die der Verfassung treu ergeben sind."
 SIA_and_spring_the_trap_tt: "Wenn unsere Gesamtunterstützung bei über §Y80%§! liegt, verhindern wir einen Bürgerkrieg und können das Militär unverzüglich absetzen."
 SIA_rebuild_the_war_torn_economy: "Die vom Krieg zerrissene Wirtschaft wiederaufbauen"
 SIA_rebuild_the_war_torn_economy_desc: "Der Bürgerkrieg zerstörte Straßen, Fabriken, Reisfelder und Handelswege. Der Wiederaufbau muss unverzüglich beginnen. Löhne, Getreide, Eisenbahnschienen und Kredite werden mehr zur Stabilisierung von [ROOT.GetName] beitragen als jede Rede aus Bangkok."
 SIA_end_military_grift: "Korruption des Militärs ein Ende setzen"
 SIA_end_military_grift_desc: "Zu lange schon nährte der Militärhaushalt private Vermögen, die Vetternwirtschaft und nutzlose Prestigeprojekte. Der Krieg offenbarte diese Fäulnis. Jeder korrupte Vertrag, jedes gar nicht existierende Regiment und jede gestohlene Lieferung muss untersucht und der alten Militärclique angelastet werden."
 SIA_the_purge: "Die Säuberung"
 SIA_the_purge_desc: "Die Militärclique tränkte das Land mit Blut, anstatt sich der Zivilherrschaft zu unterwerfen. Mit Verrätern kann man keine Kompromisse treffen. Offiziere, Kollaborateure und Sympathisanten müssen aus allen Kommandopositionen entfernt werden, bevor sie sich erneut zu einer Bedrohung für den Staat entwickeln."
 SIA_achieve_foreign_legitimacy: "Internationale Legitimität erlangen"
 SIA_achieve_foreign_legitimacy_desc: "Andere beobachteten unsere Krise und warteten ab, ob Siam unter eine Militärdiktatur oder in eine Revolution hineingerät. Wir müssen beweisen, dass die Zivilregierung stabil und rechtsstaatlich ist und die Mittel hat, das Land zu verteidigen."
 SIA_achieve_foreign_legitimacy_trigger: "Eine beliebige Großmacht hat mehr als §Y75§! Meinung gegenüber uns"
 SIA_countries_that_like_me_doctrine_tt: "§Y[?var:SIA_countries_that_like_me]x§! §G50%§! Kostenreduktion für: §YLanddoktrin§!"
 SIA_achieve_foreign_legitimacy_tt: "Erhält §G[?var:SIA_achieve_foreign_legitimacy_base_stab_gain|%.0]§! Stabilität für jede Großmacht mit mindestens §Y75§! Meinung gegenüber uns.\n\nWenn mehr als §Y3§! Großmächte eine solch hohe Meinung haben, erhalten wir zusätzlich §Y1x§! §G50%§! Kostenreduktion für: §YLanddoktrine§! für jede Großmacht über diesem Schwellwert.\n\nWenn §Y6§! oder mehr Großmächte diese Meinung haben, erhalten wir §G+2§! §YZivilfabriken§!."
 SIA_secure_the_state: "Sicherung des Staats"
 SIA_secure_the_state_desc: "Ein Sieg im Bürgerkrieg bedeutet noch lange keine Stabilität. Eisenbahnstrecken, Häfen, Waffendepots und Verkehrsknotenpunkte müssen gesichert werden, bevor sich reaktionäre Offiziere neu formieren können. Bangkok muss gut vernetzt bleiben und fest unter ziviler Kontrolle stehen."
 SIA_expand_upon_the_dossier: "Auf dem Dossier aufbauen"
 SIA_expand_upon_the_dossier_desc: "Das gelbe Dossier wurde in einem Moment der Schwäche verfasst. Dieser Moment ist nun vorbei. Da die Militärclique besiegt ist, können wir den nächsten Schritt gehen und tiefgreifendere Landreformen erlassen, uns stärker für den Arbeitnehmerschutz einsetzen und einen Staat aufbauen, der in der Lage ist, Siam von Grund auf neu zu gestalten."
 SIA_military_oversight_bureau: "Büro für militärische Aufsicht"
 SIA_military_oversight_bureau_desc: "Wir dürfen nicht zulassen, dass die Armee erneut zu einem Staat im Staat wird. Eine zivile Aufsichtsbehörde wird Ernennungen, Budgets und politische Aktivitäten innerhalb der Streitkräfte überwachen und sicherstellen, dass die Kasernen Bangkok Rechenschaft ablegen und nicht umgekehrt."
 SIA_military_oversight_bureau_tt: "Das §YBüro für militärische Aufsicht§! überprüft die Generäle alle 5 bis 9 Monate. In diesen Zeiträumen arbeiten die betroffenen Generäle mit verminderter Effizienz, da sie sich der verstärkten Kontrolle bewusst sind."
 SIA_the_yellow_dossier: "Das gelbe Dossier"
 SIA_the_yellow_dossier_desc: "Dieser radikale Entwurf war ein voller Erfolg. Nun kann das eigentliche gelbe Dossier umgesetzt werden: maßvolle Reformen, wirtschaftliche Modernisierung und politische Sicherheitsvorkehrungen, die darauf abzielen, die militärische Vorherrschaft zu brechen, ohne das Land ins Chaos zu stürzen."
 SIA_achieve_domestic_legitimacy: "Regionale Legitimität erlangen"
 SIA_achieve_domestic_legitimacy_desc: "Die Regierung behauptete sich mit Waffengewalt, doch nun muss sie durch Recht, Brot und Ordnung überzeugen. Man muss das Vertrauen der Bevölkerung wiederherstellen und Notfallmaßnahmen rechtlich absichern. Die Menschen müssen erkennen, dass eine Zivilregierung mehr zu bieten hat als bloßes Überleben."
 SIA_achieve_domestic_legitimacy_tt: "Das §YKhana-Ratsadon-System§! wird deaktiviert.\nDer §YMilitärflügel§! wird dauerhaft aufgelöst, wodurch auch der Nationalgeist entfernt wird.\n\nDer §YZivilflügel§! wird dauerhaft umstrukturiert und zum Nationalgeist §Y$idea_SIA_unwavering_civilian_support$§!."
 SIA_allies_integration: "Integration in die Alliierten"
 SIA_allies_integration_desc: "Unsere Streitkräfte müssen lernen, Seite an Seite mit den Alliierten zu kämpfen. Kommandostrukturen, Kommunikationswege, Versorgungsabläufe und Ausrüstungsstandards müssen erst angeglichen werden, bevor Siam mehr als nur ein symbolischer Partner sein kann."
 SIA_prepare_for_a_pacific_war: "Auf einen Pazifikkrieg vorbereiten"
 SIA_prepare_for_a_pacific_war_desc: "Die Großmächte richten ihren Blick auf den Pazifik. Japans Ambitionen, die europäischen Kolonien und die Strategie der Alliierten deuten allesamt auf einen herannahenden Sturm hin. Siam muss sich wappnen, bevor die ersten Schüsse auch unsere Küsten erreichen."
 SIA_the_end_of_gunboat_diplomacy: "Ende der Kanonenbootdiplomatie"
 SIA_the_end_of_gunboat_diplomacy_desc: "Wir werden nie wieder zulassen, dass uns feindliche Kriegsschiffe von der Mündung des Chao Phraya aus Bedingungen diktieren. Siam muss über Geschütze, Docks, Minen und Küstenbefestigungen verfügen, damit jeder Angriff auf Bangkok zu einem Akt des Wahnsinns wird."
 SIA_preemtive_strike: "Präventivschlag"
 SIA_preemtive_strike_desc: "Es wäre töricht, darauf zu warten, dass Japan den Zeitpunkt für den Krieg bestimmt. Falls das Kaiserreich vorhat, Asien zu überrollen, muss [SIA.GetName] zuschlagen, bevor die japanischen Armeen und Flotten ihre Heimatgewässer verlassen können."
 SIA_the_siamese_armada: "[SIA.GetAdjective]e Armada"
 SIA_the_siamese_armada_desc: "Ein modernes [SIA.GetName] braucht eine moderne Flotte. Dank neuer Schiffe, gut ausgebildeter Besatzungen und der ausgeweiteten Infrastruktur kann die [SIA.GetAdjective]e Armada endlich unsere Küsten verteidigen und ihre Macht über diese hinaus projizieren."
 SIA_asian_democratic_compact: "Asiatischer Demokratischer Pakt"
 SIA_a_more_moderate_option: "Gemäßigtere Alternative"
 SIA_a_more_moderate_option_desc: "Reformen müssen Bestand haben und dürfen nicht einfach durch die kleinste Opposition verpuffen. Indem wir das gelbe Dossier gemäßigt formulieren, isolieren wir Extremisten, beruhigen die Mittelschicht und bauen eine zivile Ordnung auf, die auch nach dem ersten Sieg noch Bestand hat."
 SIA_asian_democratic_compact_desc: "Asien kann sich nicht ewig auf die Versprechen von Großmächten oder anderen Nationen verlassen, die viel zu weit weg sind. Die demokratischen Nationen der Region müssen zusammenstehen, um sich gegenseitig zu verteidigen und zu beweisen, dass Unabhängigkeit und Freiheit in Asien Bestand haben können."
 SIA_asian_democratic_compact_tt: "Schaltet die Option frei, die Freilassung asiatischer Untertanen zu fordern, und erlaubt es uns, diese in unser Bündnis aufzunehmen."
 SIA_asian_democratic_compact_modify: "Modifiziert §Y$SIA_asian_democratic_compact$§! um:"
 SIA_southeast_asia_joint_command: "Gemeinsame Kommandostruktur für Südostasien"
 SIA_southeast_asia_joint_command_desc: "Unser Zusammenschluss muss mehr sein als nur ein diplomatisches Versprechen. Ein gemeinsames Kommando wird Strategie, Versorgung, Nachrichtendienst und Verteidigungsplanung in ganz Südostasien koordinieren und so die einzelnen Armeen zu einem gemeinsamen Schild machen."
 SIA_pan_asian_weapon_standardization: "Panasiatische Waffenstandards"
 SIA_pan_asian_weapon_standardization_desc: "Wenn jeder unserer Verbündeten unterschiedliche Gewehre, Kaliber, Funkgeräte und Fahrzeuge einsetzt, führt das unweigerlich zu Problemen. Standardisierte Waffen und gemeinsame Produktionspläne stärken unsere Koalition, senken die Kosten und beschleunigen die Bewaffnung."
 SIA_united_against_aggression: "Vereintes Auftreten gegen die Aggressoren"
 SIA_united_against_aggression_desc: "Kein Mitglied unseres Bündnisses wird sich allein behaupten müssen. Ob die Bedrohung nun von einem fernen Land, vom Faschismus, vom Militarismus oder von opportunistischen Nachbarn ausgeht: Die Nationen Asiens werden gemeinsam darauf reagieren."
 SIA_the_hammers_that_strike: "Zuschlagen wie ein Hammer"
 SIA_the_hammers_that_strike_desc: "Unser Bündnis ist nicht länger nur ein Zusammenschluss kleinerer Staaten, die auf ein Überleben hoffen. Es ist eine Waffe. Jede Nation ist ein Hammer, und gemeinsam werden wir jene bekämpfen, die über Asien herrschen wollen."
 SIA_mobilize_the_defenders_of_siam: "Die Verteidiger von Siam mobilisieren"
 SIA_mobilize_the_defenders_of_siam_desc: "Das einstige Militär ließ die Nation im Stich, doch Siam braucht nach wie vor Verteidiger. Freiwillige, loyale Offiziere, Schutztruppen und patriotische Bürger müssen zu einer Streitmacht organisiert werden, die die Verfassung vor Feinden von innen und außen schützt."
 SIA_join_the_allies: "Den Alliierten anschließen"
 SIA_join_the_allies_desc: "[ROOT.GetNameDefCap] wird sich nicht allein behaupten können, während die Welt vom Krieg heimgesucht wird. Die Alliierten bieten Waffen, Anerkennung und einen Platz unter den Nationen, die sich der Aggression widersetzen. Indem wir uns ihnen anschließen, verbinden wir das Überleben Siams mit dem übergeordneten Kampf für eine freie Welt."
 SIA_the_malay_peninsular_defense_plan: "Verteidigungsplan für die Malaiische Halbinsel"
 SIA_the_malay_peninsular_defense_plan_desc: "Sollte es in Südostasien zum Krieg kommen, wird Malaya einer der ersten Kriegsschauplätze sein. Befestigungsanlagen, Versorgungsdepots und eine gemeinsame Planung mit den Briten machen die Halbinsel zu einem Schild gegen mögliche Angriffe."
 SIA_the_malay_peninsular_defense_plan_tt: "Errichtet eine Eisenbahnverbindung zwischen Bangkok und Singapur.\n\nJeder Siegpunkt in [MAL.GetName], Singapur, [724.GetName], [289.GetName] und [1076.GetName]:\nErhält §G2§! §YKüstenverteidigungen§!\nErhält §G2§! §YLandbefestigungen§!\nJeder dieser Staaten:\nErhält§G1§! §Ystatische Flugabwehr§!"
 SIA_join_the_united_front: "Der Einheitsfront anschließen"
 SIA_join_the_united_front_desc: "China blutet unter der [JAP.GetAdjective]en Aggression, doch es kämpft weiter. Indem wir der Einheitsfront beitreten, trägt [SIA.GetName] dazu bei, den Landkrieg zu einem Friedhof für imperiale Ambitionen zu machen."
 SIA_a_land_war_in_asia_desc: "Der Krieg ist nicht allein durch Absichtserklärungen zu gewinnen. Die siamesischen Soldaten müssen durch das schwierige Gelände Asiens marschieren, kämpfen und durchhalten. Unser Einsatz für die Einheitsfront muss sich in Taten zeigen."
 SIA_death_to_the_communists: "Tod den Kommunisten"
 SIA_death_to_the_communists_desc: "Die Niederlage der Militärclique darf nicht dazu führen, dass einer neuen Tyrannei die Tür geöffnet wird. Kommunistische Agitatoren glauben, die Krise habe den Staat geschwächt, doch sie werden schon bald feststellen, dass die Zivildemokratie nicht wehrlos ist."
 SIA_death_to_the_nationalists: "Tod den Nationalisten"
 SIA_death_to_the_nationalists_desc: "Japan wurde zurückgedrängt, doch die Frage nach der Zukunft Asiens bleibt offen. Die alte nationalistische Ordnung ersetzt lediglich die eine Hierarchie durch eine andere. Wenn Asien eine Erneuerung erfahren soll, müssen die Kommunisten siegen."
 SIA_a_new_dawn_over_asia: "Ein neuer Anfang für Asien"
 SIA_a_new_dawn_over_asia_desc: "Das japanische Kaiserreich ist gefallen, und auch die korrupten Mächte, die es für sich beanspruchen wollten, gibt es nicht mehr. In ganz Asien bricht ein neuer Morgen über Nationen an, die entschlossen sind, ihre Zukunft frei von imperialer Herrschaft zu gestalten."
 SIA_phibuns_premiership: "Phibuns Amtszeit als Premierminister"
 SIA_phibuns_premiership_desc: "Die Amtszeit von [SIA_phraya_phahon.GetName] als Premierminister neigt sich dem Ende zu und Plaek Phibunsongkhram steht als von der Partei gewählter Nachfolger bereit, die Macht zu übernehmen. Dieser Übergang sichert uns die Gunst des Militärs, wird aber den zivilen Flügel verärgern.\n\nFür uns gibt es in diesem neuen Zeitalter nur einen Weg nach vorn: mit großer Überzeugung!"
 SIA_siamese_youth_movement: "[THIS.GetAdjective]e Jugendbewegung"
 SIA_siamese_youth_movement_desc: "Die jungen Erwachsenen von [THIS.GetName] müssen wie Stahl über einer heißen Flamme gehärtet werden. Sie müssen lernen, den Staat zu respektieren und ihr Vaterland zu verteidigen und wertvolle Mitglieder der thailändischen Gesellschaft zu werden."
 SIA_territorial_defense_student: "Studenten der Territorialverteidigung"
 SIA_territorial_defense_student_desc: "Wir sollten das Jugendprogramm erweitern und die vielversprechendsten Kandidaten in Ausbildungslager für Soldaten verlegen, wo sie zur Verteidigung von [SIA.GetName] beitragen können. Nur so erhalten sie eine angemessene militärische Ausbildung und können gleichzeitig der Armee als weiteres Werkzeug dienen."
 SIA_expand_domestic_arms_workshops: "Ausbau der heimischen Rüstungsindustrie"
 SIA_expand_domestic_arms_workshops_desc: "Unsere Produktionskapazität für Kriegsmaterial liegt erbärmlich hinter der anderer Industrieländer zurück. Wir müssen die Produktion von Kriegsgerät im eigenen Land ankurbeln und sicherstellen, dass unsere Streitkräfte stets mit neuer Ausrüstung versorgt werden."
 SIA_look_to_european_fascism: "An den europäischen Faschismus angleichen"
 SIA_look_to_european_fascism_desc: "Wir haben uns von den Fesseln unserer Vergangenheit befreit und besitzen nun die Möglichkeit, das Land zu reformieren. Wir blicken auf eine neue Zukunft, inspiriert von den Entwicklungen im Westen. Es ist offensichtlich, dass die alte Weltordnung dem Untergang geweiht ist und diejenigen, die zurückbleiben, unter den Folgen ihrer mangelnden Weitsicht leiden werden."
 SIA_the_songsuradet_rebellion: "Die Songsuradet-Rebellion"
 SIA_the_songsuradet_rebellion_desc: "Der hochrangige Offizier Phraya Songsuradet ist der Hauptgegner von Phibun und stellt eine Bedrohung für das derzeitige Regime dar. Wir müssen etwas unternehmen und ihn verschwinden lassen.\n\nEs gibt genügend belastendes Material, das gegen Songsuradet und seine Anhängerschaft verwendet werden könnte und dazu beitragen würde, unsere Macht zu festigen und unsere innenpolitischen Gegner auszuschalten."
 SIA_the_songsuradet_rebellion_historical_tt: "General Phraya Songsuradet wird beschuldigt, sich gegen den Staat verschworen zu haben. Er sowie der Berater §Y[SIA_rangsit_prayurasakdi.GetName]§! werden ihrer Ämter enthoben.\n\nWir erhalten außerdem:\n"
 SIA_the_songsuradet_rebellion_historical_tt2: "Wenn die Zeit abläuft, erhalten wir:"
 SIA_the_songsuradet_rebellion_historical_tt3: "für §Y[?var:SIA_purged_military_timer]§! Tag(e)"
 SIA_the_songsuradet_rebellion_alt_tt: "General Phraya Songsuradet wird beschuldigt, sich gegen den Staat verschworen zu haben.\n\nDa wir seine Militärclique stärkten, könnte er sich jedoch ermutigt fühlen, die Aufforderung abzulehnen, was zu einer Pattsituation oder möglicherweise einem Bürgerkrieg führen wird."
 SIA_sue_the_king_in_exile: "Den Exilantenkönig anklagen"
 SIA_sue_the_king_in_exile_desc: "Es gibt Gerüchte, der Exilantenkönig habe unzählige Wertgegenstände mit nach [ENG.GetName] genommen. Wir müssen sie zurückbringen, und wenn wir ihn und seine Frau dafür verklagen müssen, dann sei dem eben so."
 SIA_suspend_ordinary_legal_procedures: "Die ordnungsgemäße Rechtsprechung aussetzen"
 SIA_suspend_ordinary_legal_procedures_desc: "Die Songsuradet-Rebellion bietet uns die einmalige Gelegenheit, im Namen der nationalen Sicherheit umfassende Reformen durchzusetzen. Wir können auch die Kontrollmechanismen der Gerichte und anderer politischer Organe vorübergehend aussetzen, um unsere Macht zu zentralisieren."
 SIA_the_duty_of_the_thai_people_during_the_war_act: "Gesetz zu den Pflichten des thailändischen Volkes während eines Krieges"
 SIA_the_duty_of_the_thai_people_during_the_war_act_desc: "$idea_SIA_cemented_control_3_desc$"
 SIA_recognize_manchukuo: "Manchukuo anerkennen"
 SIA_recognize_manchukuo_desc: "TODO_CM"
 SIA_press_censorship: "Die Presse zensieren"
 SIA_press_censorship_desc: "Eine freie Presse kann nur allzu leicht die Stabilität des Staates gefährden. Die Presse muss zwar einen bestimmten Spielraum besitzen, doch wir müssen auch sicherstellen, dass die Stimme und der Wille der Regierung in den Medien Vorrang haben."
 SIA_department_of_publicity: "Abteilung für Öffentlichkeitsarbeit"
 SIA_department_of_publicity_desc: "Jeder Staat benötigt eine Propagandamaschine, insbesondere einer, der solch starke territorialen Ambitionen hegt wie wir. Die Finanzierung einer Abteilung für Öffentlichkeitsarbeit ermöglicht uns dies."
 SIA_thai_cultural_mandates: "Thailändische Kulturmandate"
 SIA_thai_cultural_mandates_desc: "Wir können das thailändische Volk mobilisieren und eine starke nationale Kultur aufbauen, indem wir Mandate erteilen, die die Einheit des Volkes stärken und eine einheitliche Identität schaffen."
 SIA_thai_cultural_mandates_tt: "Schaltet Entscheidungen zum Erlassen von Kulturmandaten frei, die verschiedene Boni bringen und §YPolitische Macht§! kosten. Das Erste Mandat sowie ein weiteres Mandat können kostenlos erteilt werden."
 SIA_relocate_the_capital_to_phetchabun: "Die Hauptstadt nach Phetchabun verlegen"
 SIA_relocate_the_capital_to_phetchabun_desc: "Die Regierung steht einer Bedrohung gegenüber! Wie die Geschichte zeigt, ist Bangkok anfällig für Angriffe vom Meer aus. Es mag eine unbeliebte Entscheidung sein, doch die Hauptstadt muss weiter ins Landesinnere verlegt werden."
 SIA_relocate_the_capital_to_phetchabun_tt: "Verlegt bis zu §G3§! §YMilitärfabriken§! von §Y[1076.GetName]§! nach §Y[1077.GetName]§!\nVerlegt §G3§! §YZivilfabriken§! von §Y[1076.GetName]§! nach §Y[1077.GetName]§!\nErrichtet eine Befestigung der Stufe §G3§! um Petchabun"
 SIA_relocate_the_capital_to_phetchabun_tt2: "Wenn der Nationalgeist abläuft: §R-25%§! Grundstabilität"
 SIA_radio_propaganda: "Radio-Propaganda"
 SIA_radio_propaganda_desc: "Durch die Elektrifizierung von [SIA.GetName] ist das Radio zu einer Alltäglichkeit geworden. Wir kontrollieren bereits die Presse und müssen nun auch dafür sorgen, dass wir kontrollieren, was im Radio übertragen wird."
 SIA_sala_chaloem_thai_movie_theater: "Das Filmtheater Sala Chaloem Thai"
 SIA_sala_chaloem_thai_movie_theater_tt: "Schaltet Entscheidungen zur Produktion von Propagandafilmen frei, die verschiedene Boni geben. Beispiele hierfür sind:\n"
 SIA_sala_chaloem_thai_movie_theater_desc: "Filme sind in unserem Land ein neues Medium, aber ihr Potenzial ist für alle offensichtlich. Genau wie Gedichte, Bücher und das Radio können sie die Herzen und die Köpfe der einfachen Bevölkerung sowie die der Elite mit neuen Ideen und Ansichten füllen. Das Medium des bewegten Bildes erlaubt es uns, unsere Bürger dazu zu ermutigen, für den Aufstieg eines großen [SIA.GetAdjective]en Staates zu kämpfen."
 SIA_pan_thaiism: "Panthaiismus"
 SIA_pan_thaiism_desc: "Es reicht nicht aus, dass [ROOT.GetNameDef] nur existiert, sondern diese Nation muss auch gedeihen. Die Zukunft des [ROOT.GetAdjective]en Volkes liegt nicht in einem drittklassigen Staat, der nichts zu sagen hat, sondern in einem Land, das aktiv auf der Weltbühne mitmischt. Zunächst müssen wir die Menschen daran erinnern, was uns die Imperialisten einst raubten, und sie für unsere Sache mobilisieren."
 vichy_exist_trigger: "§YVichy-Frankreich§! existiert"
 vichy_exist_not_trigger: "§YVichy-Frankreich§! existiert NICHT"
 SIA_retake_lost_british_states: "Verlorene britische Staaten zurückfordern"
 SIA_retake_lost_british_states_tt: "Schaltet die Fähigkeit frei, begrenzte Kriege gegen britische Territorien in §YBurma§! und §YMalaysia§! zu beginnen"
 INS_retake_lost_british_states_tt: "Schaltet die Fähigkeit frei, begrenzte Kriege gegen britische Territorien in §YMalaysia§! zu beginnen"
 SIA_retake_lost_british_states_desc: "Nicht nur [FRA.GetNameDef] sorgte für die Spaltung unseres einst großen Königreichs, sondern auch [ENG.GetNameDef]. Getrieben von Ehrgeiz nutzte man ebenfalls jede Gelegenheit, um einen Teil des Landes zu beanspruchen. Da ihre Aufmerksamkeit nun auf größere Rivalen gerichtet ist, ist für uns endlich der Moment zum Handeln gekommen."
 SIA_recover_indochina: "Indochina zurückfordern"
 SIA_recover_indochina_desc: "[FRA.GetNameDefCap], ein Land, das sich auf der anderen Seite der Welt befindet und uns nicht vorzuschreiben hat, was wir tun oder wie wir leben sollen, spaltete unser Land im Lauf des letzten Jahrhunderts. Mit Kanonenbooten und Waffen nahm man sich das, was uns gehörte. In diesem Jahrhundert nimmt die [FRA.GetAdjecive]e Macht jedoch immer weiter ab. Dieses Jahrhundert gehört uns!"
 SIA_recover_indochina_tt: "Schaltet die Fähigkeit frei, begrenzte Kriege gegen Territorien in §YIndochina§! zu beginnen"
 SIA_demand_the_return_of_lost_territory: "Rückgabe verlorener Territorien fordern"
 SIA_demand_the_return_of_lost_territory_desc: "[FRA.GetNameDefCap] ist schwach und kaum mehr als ein Papiertiger, der sich an den letzten Rest seines schwindenden Einflusses klammert. Ob des Niedergangs des französischen Militärs kann diese Nation nicht mehr jene Stärke in unsere Region der Welt projizieren, die sie einst besaß, und sie befindet sich nicht mehr in der Position, sich unseren Forderungen zu widersetzen."
 SIA_demand_the_return_of_lost_territory_tt: "Wir fordern die Besitzer von §YIndochina§! und Teilen von §Y[MAL.GetName]§! auf, uns §Y[1069.Getname]§!, §Y[1067.Getname]§!, §Y[741.Getname]§!, §Y[1068.Getname]§!, §Y[1061.Getname]§!, §Y[1064.Getname]§!, §Y[1065.Getname]§! und §Y[670.Getname]§! zurückzugeben.\n\nFaktoren, die die Akzeptanz beeinflussen:\n- Kampfstärke von mindestens 30% im Vergleich zum Besitzer\n- Besitzer befindet sich im Krieg mit einer Großmacht\n- Besitzer ist in keinem Bündnis\n- Besitzer ist §YVichy-Frankreich§!\n- Wir sind in einem Bündnis\n- Besitzer mag uns nicht"
 SIA_the_greater_thai_empire: "Großthailändisches Reich"
 SIA_the_greater_thai_empire_available_trigger: "§Y[ROOT.GetNameDefCap]§! kontrolliert jeden Staat in Indochina\nGehorsam jeden Staates in Indochina ist höher als: §Y[?var:SIA_greater_thai_empire_compliance_requirement]%§!\n\nBenötigt außerdem: "
 SIA_the_greater_thai_empire_desc: "Die Stunde unseres Aufstiegs ist endlich gekommen! Wir holten uns zurück, was uns einst genommen worden war, und das Volk erkennt unsere Legitimität als rechtmäßige Führer dieses erneuerten Großthailändischen Reiches an."
 SIA_crack_down_of_foreign_merchants: "Gegen Händler aus dem Ausland vorgehen"
 SIA_crack_down_of_foreign_merchants_desc: "Der Handel ist bereits seit einiger Zeit von externen Interessen geprägt, die unsere nationale Widerstandsfähigkeit beeinträchtigen könnten. Damit unsere Wirtschaft auf einem stabilen Fundament steht, müssen wir in der Lage sein, den Handel selbst zu kontrollieren, und sicherstellen, dass Wohlstand und Stabilität auf einer Grundlage beruhen, die wir kontrollieren können."
 SIA_royal_palace_bureau_directive_no_1523: "Direktive Nr. 1523 des Büros des Königshauses"
 SIA_royal_palace_bureau_directive_no_1523_desc: "Angesichts des zunehmenden Nationalismus im Land stellte sich sogar die Krone hinter die Regierung und forderte alle Mitglieder des Königshauses auf, 10% ihres Einkommens für die Anschaffung moderner Waffen zu spenden."
 SIA_end_factionalism: "Die Fraktionsbildung beenden"
 SIA_end_factionalism_desc: "Die Kluft zwischen dem militärischen und dem zivilen Flügel der Khana Ratsadon blockierte seit der Revolution jede Entscheidung der Regierung. Wir müssen dafür sorgen, dass beide Fraktionen für eine längere Zeit hinter der Regierung stehen, um sie zu einer geeinten Volkspartei zu verschmelzen und das Damoklesschwert eines Staatsstreichs ein für alle Mal zu beseitigen."
 SIA_end_factionalism_available_tt: "Sowohl der §YZivilflügel§! als auch der §YMilitärflügel§! waren §Y270§! aufeinanderfolgende Tage auf §GVolle Unterstützung§!."
 SIA_end_factionalism_tt: "Die fraktionsbedingte Rivalität innerhalb der Khana Ratsadon ist beendet.\n   Der §YZivil-§! und der §YMilitärflügel§! wurden in der §GVereinten Volkspartei§! zusammengelegt\n   Wir erhalten den Nationalgeist §Y$idea_SIA_unified_khana_ratsadon$§!"
 SIA_turn_off_the_khana_ratsadon: "Die Khana Ratsadon ist deaktiviert"
 SIA_factionalism_overcome: "Die Fraktionsbildung wurde überwunden"
 SIA_new_territories_administration: "Verwaltung neuer Territorien"
 SIA_new_territories_administration_tt: "Schaltet Entscheidungen zur Verwaltung von Territorien in §YIndochina§! frei und verbessert dort Gehorsam, Industrie und Befestigungen."
 SIA_new_territories_administration_desc: "Die Rückeroberung unserer verlorenen Territorien ist nur der Anfang. Wir müssen den dort lebenden Menschen zeigen, dass wir die bessere Wahl sind. Ein umfassendes Programm zur Verbesserung des Lebensstandards sorgt dafür, dass sich jeder Bürger in unserem neuen, größeren [ROOT.GetName] gleichberechtigt fühlt."
 SIA_new_territories_administration_available_trigger: "Jeder Staat in §YIndochina§!\n   Wird von §Y[ROOT.GetName]§! kontrolliert"
 SIA_industrialization_drive: "Industrialisierungsbewegung"
 SIA_industrialization_drive_desc: "Seit Generationen beruht der Reichtum von [ROOT.GetName] auf Reisfeldern und ländlichen Siedlungen. Doch die moderne Welt wird nicht durch den Pflug, sondern durch Fabriken und Maschinen bestimmt. Wenn wir unsere Unabhängigkeit gegenüber den Großmächten bewahren wollen, müssen wir unser Agrarreich in eine Industrienation überführen."
 SIA_industrialization_drive_trigger: "Die §YKhana Ratsadon§! ist aktiv"
 SIA_asian_financial_compact: "Asiatisches Finanzabkommen"
 SIA_asian_financial_compact_desc: "Europäisches Kapital dominiert nach wie vor einen Großteil des asiatischen Handels, was unsere Wirtschaft von anderen abhängig macht. Durch engere finanzielle Vereinbarungen mit unseren Nachbarn erweitern wir unseren Zugang zu Krediten, Märkten und Investitionen, ohne unsere Unabhängigkeit aufzugeben."
 SIA_revision_of_unequal_treaties: "Ungleiche Verträge überarbeiten"
 SIA_revision_of_unequal_treaties_desc: "Alte Verträge, die aus einer schwachen Position heraus unterzeichnet wurden, priorisierten fremde Interessen, die kein moderner Staat dulden sollte. Wir müssen diese ungleichen Verträge revidieren und [ROOT.GetName] wieder die volle Kontrolle über den Handel, die Gerichtsbarkeit und alle Konzessionen zurückgeben."
 SIA_renegotiate_teak_control: "Kontrolle über Teakholz neu verhandeln"
 SIA_renegotiate_teak_control_desc: "Unsere nördlichen Wälder bereichern andere, während zu wenig Geld in die Staatskasse fließt. Indem wir die Verträge über Teakholz neu aushandeln, sichern wir uns neue Einnahmen, regulieren die Abholzung und sorgen dafür, dass siamesisches Holz für siamesische Entwicklungsprojekte genutzt wird."
 SIA_a_fledgling_tobacco_industry: "Tabakindustrie in den Kinderschuhen"
 SIA_a_fledgling_tobacco_industry_desc: "Der Tabakanbau ist nach wie vor nur ein unbedeutender Wirtschaftszweig. Mit einigen Investitionen kann diese kleine Kulturpflanze jedoch zu einer verlässlichen Quelle für Steuereinahmen und Arbeitsplätze in Fabriken werden."
 SIA_a_fledgling_tobacco_industry_tt: "§Y$limited_exports$§! oder §Y$closed_economy$§! geben uns eine zusätzliche §YZivilfabrik§!"
 SIA_all_weather_roads: "Allwetterstraßen"
 SIA_all_weather_roads_desc: "Zu viele Straßen werden bei Regen unpassierbar, wodurch ganze Provinzen von der Hauptstadt und den Märkten abgeschnitten sind. Ein Netz aus Allwetterstraßen hält das Königreich zusammen und gewährleistet zu jeder Jahreszeit, dass Waren und Soldaten sicher transportiert werden können."
 SIA_the_bank_of_siam: "Die Bank von Siam"
 SIA_the_bank_of_siam_desc: "Das industrielle Wachstum kann nicht allein auf Gewohnheiten und persönlichen Gefallen beruhen. Eine stärkere Nationalbank verschafft dem Staat mehr Einfluss auf das Kreditwesen, die Währung und den Kapitalverkehr."
 SIA_thai_rice_company: "Thailändische Reisgesellschaft"
 SIA_thai_rice_company_desc: "Reis ist noch immer das Fundament, auf dem die [ROOT.GetAdjective]e Wirtschaft aufgebaut ist, und dennoch ist ein zu großer Teil des Handels nicht zentralisiert, spekulativ und anfällig für Druck von außen. Durch die Gründung einer staatlichen Reisgesellschaft können die Exporte kontrolliert, die Preise stabilisiert und die Ernte unserer Reisfelder zu einer solideren Grundlage für die nationale Stärke umgewandelt werden."
 SIA_uk_japan_focus_tt: "Dies erlaubt es uns, zwischen [ENG.GetName] und [JAP.GetName] zu wählen, was folgende Auswirkungen hat:\n\n§Y[ENG.GetFlag][ENG.GetNameDefCap]§!:"
 SIA_japan_option_tt: "§Y[JAP.GetFlag][JAP.GetNameDefCap]§!"
 SIA_send_bureaucrats_abroad: "Bürokraten ins Ausland schicken"
 SIA_send_bureaucrats_abroad_desc: "Andere Nationen bauten bereits Ministerien, Schulen und einen Verwaltungsappar auf, wie wir sie nun brauchen. Indem wir vielversprechende Beamte ins Ausland entsenden, importieren wir Verwaltungserfahrung, ohne dabei eine Fremdherrschaft einzuführen."
 SIA_baht_stabilization_act: "Gesetz zur Stabilisierung des Baht"
 SIA_baht_stabilization_act_desc: "Eine moderne Wirtschaft benötigt eine Währung, der Händler vertrauen und die Investoren akzeptieren. Den Baht zu stabilisieren, verringert die Unsicherheit im Handel und verschafft [ROOT.GetName] eine solidere Position auf dem Weltmarkt."
 SIA_siamese_development_cooperative: "Siamesische Entwicklungskooperative"
 SIA_siamese_development_cooperative_desc: "Private Investoren sind zögerlich und der Staat kann nicht alles allein bewerkstelligen. Eine nationale Entwicklungskooperative erlaubt es Beamten, Händlern und Grundbesitzern, ihre Ressourcen zu bündeln, um Projekte zu fördern, die der Gesamtwirtschaft dienlich sind."
 SIA_boon_rawd_brewery: "Brauerei Boon Rawd"
 SIA_boon_rawd_brewery_desc: "Eine einheimische Bierbrauindustrie ist mehr als nur eine Frage des Konsums. Unternehmen wie Boon Rawd zeigen, dass siamesisches Kapital, Maschinen und eine sachkundige Führung imstande sind, auf siamesischem Boden eine moderne Industrie hervorzubringen."
 SIA_national_savings_bond: "Staatsanleihen"
 SIA_national_savings_bond_desc: "Der Reichtum der Nation darf nicht ungenutzt in Tresoren und Schmuckstücken schlummern, während Bauprojekte für Straßen und Fabriken nicht verwirklicht werden. Eine Staatsanleihe wird private Ersparnisse in öffentliche Investitionen umwandeln."
 SIA_national_savings_bond_tt: "Erhält den Nationalgeist „$SIA_national_savings_bond$“ der abgängig vom §YWehrpflichtgesetz§! in der Stärke skaliert wird. Je niedriger das Wehrpflichtgesetz ist, desto stärker sind die positiven Auswirkungen, wohingegen ein höheres Wehrpflichtgesetz dazu führt, dass die Boni geringer ausfallen.\n\n§Y$disarmed_nation$§! gibt: "
 SIA_national_savings_bond_scraping_the_barrel: "§Y$scraping_the_barrel$§! gibt:"
 SIA_national_savings_bond_volunteer_only: "§Y$volunteer_only$§! gibt:"
 SIA_national_savings_bond_limited_conscription: "§Y$limited_conscription$§! gibt:"
 SIA_national_savings_bond_extensive_conscription: "§Y$extensive_conscription$§! gibt:"
 SIA_national_savings_bond_service_by_requirement: "§Y$service_by_requirement$§! gibt:"
 SIA_national_savings_bond_all_adult_serve: "§Y$all_adults_serve$§! gibt:"
 SIA_national_savings_bond_current: "Unser derzeitiges Mobilmachungsgesetz würde uns Folgendes geben:"
 SIA_deficit_spending: "Defizitausgaben"
 SIA_deficit_spending_desc: "Ein starrer Haushalt wird es nicht rechtzeitig schaffen, eine moderne Wirtschaft aufzubauen, die für das Überleben in diesen schwierigen Zeiten unerlässlich ist. Der Staat muss bereit sein, über die aktuellen Einnahmen hinaus Ausgaben zu tätigen und durch öffentliche Arbeiten sowie staatliche Aufträge das industrielle Wachstum ankurbeln."
 SIA_deficit_spending_tt: "Wenn der Nationalgeist abläuft:"
 SIA_acquire_light_tools: "Leichte Werkzeuge erwerben"
 SIA_acquire_light_tools_desc: "Bevor wir schwere Maschinen herstellen können, müssen wir zuerst die einfachen Werkzeuge der Industrie beherrschen. Durch den Import leichter Werkzeuge und Werkstattausrüstung entstehen in ganz [ROOT.GetName] kleinere Fabriken und Reparaturbetriebe."
 SIA_railway_and_port_extensions: "Eisenbahn- und Hafenausbau"
 SIA_railway_and_port_extensions_desc: "Reis, Holz und Zinn haben keinen Wert, wenn sie die Märkte nicht erreichen. Durch den Ausbau der Eisenbahn und der Häfen binden wir unsere Provinzen an den nationalen Handel und [ROOT.GetName] an den Welthandel an."
 SIA_mechanization_of_agriculture: "Mechanisierung der Landwirtschaft"
 SIA_mechanization_of_agriculture_desc: "Ein zu großer Teil der Bevölkerung arbeitet noch immer in der traditionellen Landwirtschaft, wodurch nur wenig Kapazitäten für die Industrie frei sind. Durch die Einfuhr moderner Werkzeuge und Maschinen für die Landwirtschaft steigern wir den Ertrag und setzen gleichzeitig Arbeitskräfte für die Fabriken frei."
 SIA_irrigation: "Bewässerung"
 SIA_irrigation_desc: "Die Erträge der Bauern hängen nach wie vor von Überschwemmungen und Dürren ab. Der Bau eines umfassenden Bewässerungssystems stabilisiert die Ernten, vergrößert die Anbauflächen und schafft im ländlichen Raum die Grundlage für ein nationales Entwicklungsprogramm."
 SIA_siam_cement_group: "[ROOT.GetAdjective]e Zementgesellschaft"
 SIA_siam_cement_group_desc: "Die unter königlicher Schirmherrschaft gegründete [ROOT.GetAdjective]e Zementgesellschaft ist eines der wichtigsten [ROOT.GetAdjective]en Industrieunternehmen. Durch gezielte Investitionen und staatliche Förderung lässt sich das Unternehmen zu einem Eckpfeiler unserer gesamten Industrie entwickeln, was buchstäblich den Grundstein für die Zukunft unseres Landes legt."
 SIA_chemical_imports: "Chemieimporte"
 SIA_chemical_imports_desc: "Die moderne Landwirtschaft und die Industrie sind gleichermaßen auf Verbundstoffe angewiesen, die wir noch nicht in ausreichender Menge herstellen. Durch den Import von Chemikalien lassen sich Düngemittel, Medikamente, Farbstoffe und Sprengstoffe herstellen, bis die heimische Industrie diese Aufgabe übernehmen kann."
 SIA_chemical_imports_tt: "Fügt §G+1§! §YZivilfabrik§! außerhalb der Karte hinzu, wenn die Meinung bei Abschluss dieses Schwerpunkts über §Y[?var:ROOT.SIA_chemical_imports_opinion_threshold]§! liegt."
 INS_chemical_imports_stolen_tt: "Fügt §G[?var:ROOT.INS_guns_from_seek_help_focus]§! Einheit(en) Infanterie-Ausrüstung hinzu, wenn die Meinung bei Abschluss dieses Schwerpunkts bei über §Y75§! liegt."
 SIA_foreign_currency_exchange: "Fremdwährungsumtausch"
 SIA_foreign_currency_exchange_desc: "Für die Industrialisierung werden Maschinen, Medikamente und Brennstoffe benötigt, die wir aus dem Ausland beziehen müssen, doch diese können nur mit Fremdwährung erworben werden. Durch einen kontrollierten Fremdwährungsumtausch lassen sich ausländische Gelder in die für den Staat wichtigsten Industriezweige lenken."
 SIA_farmers_into_the_city: "Bauern in die Städte"
 SIA_farmers_into_the_city_desc: "Eine moderne Wirtschaft kann nicht allein durch Arbeitskräfte aus den Dörfern aufrechterhalten werden. Mit dem Wachstum der Industrie muss der Staat eine geordnete Migration von den Reisfeldern in die Städte fördern, wo sich eine neue städtische Erwerbsbevölkerung bilden kann."
 SIA_textile_mills: "Textilmühlen"
 SIA_textile_mills_desc: "Textilien sind Artikel des täglichen Bedarfs, doch ein Großteil davon wird im Ausland gewebt und an uns zurückverkauft. Durch den Bau von Textilfabriken ersetzen wir importierte Waren, beschäftigen städtische Arbeitskräfte und bauen in [ROOT.GetName] eine Schlüsselindustrie des modernen Lebens auf."
 SIA_public_credit: "Staatskredit"
 SIA_public_credit_desc: "Händler, Erzeuger und Hersteller sind gleichermaßen durch Kapital beschränkt. Die Vergabe von Staatskrediten wird es der Regierung erlauben, Kredite dort zu vergeben, wo private Geldgeber zögern, und die Entwicklung in vernachlässigte Sektoren vorantreiben."
 SIA_public_credit_trigger: "$idea_SIA_public_credit_debt$ war mindestens §Y180 Tage§! aktiv"
 SIA_a_modern_economy: "Moderne Wirtschaft"
 SIA_a_modern_economy_desc: "Die alte Agrarordnung verschwindet nicht von heute auf morgen, doch sie bestimmt nicht länger die Zukunft von [ROOT.GetName]. Dank neuer Banken, Schulen, Fabriken und dem Ausbau der Infrastruktur entsteht mehr und mehr eine Wirtschaft, die einer unabhängigen, modernen Nation würdig ist."
 SIA_reduction_of_agricultural_yield_taxes: "Agrarertragssteuern senken"
 SIA_reduction_of_agricultural_yield_taxes_tt: "Reduziert die §YKonsumgüter§! durch $idea_SIA_agricultural_tax_reduction$ monatlich um §Y[?var:SIA_agricultural_tax_reduction_cg_decrease_rate|%]§! und erhöht die §YStabilität§! monatlich um §Y[?var:SIA_agricultural_tax_reduction_stability_gain|%]§!, bis der §YKonsumgütermalus§! §Y0%§! erreicht\n\nWenn der Nationalgeist erneut entfernt wird:\n"
 SIA_reduction_of_agricultural_yield_taxes_desc: "Wir können von den Bauern nicht verlangen, dass sie das Königreich ernähren und den Staat finanzieren und alle Entbehrungen allein tragen müssen. Indem wir die Steuern auf landwirtschaftliche Erträge senken, bleibt ein größerer Teil des Geldes auf dem Land. Dies sichert uns einerseits die Loyalität der Bauern und ermutigt sie gleichzeitig dazu, die Produktion zu erhöhen."
 SIA_fuel_oil_act: "Heizölgesetz"
 SIA_fuel_oil_act_desc: "Die Transportwirtschaft, die Industrie und die Verteidigung sind alle auf Brennstoffe angewiesen, doch ein Krieg kann uns nur zu leicht davon abschneiden. Ein Heizölgesetz unterstellt den Verbrauch, die Lagerung und die Zuteilung in Notfällen einer strengeren staatlichen Aufsicht, damit knappe Vorräte nicht verschwendet werden."
 SIA_siam_electricity_company: "Siamesisches Elektrizitätsunternehmen"
 SIA_siam_electricity_company_desc: "Keine noch so große Volkswirtschaft kann den Anforderungen der heutigen Zeit ohne zuverlässige Stromversorgung standhalten. Indem wir die Siamesischen Elektrizitätsunternehmen fördern, weiten wir die Stromerzeugung aus, verbessern die Koordination und stellen sicher, dass Werkstätten, Depots und Städte auch in schwierigen Zeiten mit Strom versorgt bleiben."
 SIA_revise_the_taxation_system: "Das Besteuerungssystem überarbeiten"
 SIA_revise_the_taxation_system_desc: "Das derzeitige Steuersystem kann den Anforderungen eines Staates, der sich auf schwierige Zeiten vorbereitet und auf Eigenständigkeit setzt, nicht standhalten. Wir müssen das System überarbeiten, Einnahmen gleichmäßiger verteilen, Verschwendung reduzieren und die Last der Landesverteidigung und der Entwicklung aufteilen."
 SIA_census_the_hill_tribes: "Volkszählung bei den Bergvölkern"
 SIA_census_the_hill_tribes_desc: "Die Bergregionen entziehen sich nach wie vor unserer Verwaltung und damit auch der Besteuerung und der Versorgung. Eine Volkszählung liefert der Regierung die notwendigen Erkenntnisse, um diese Regionen effektiver zu verwalten und ihre Bevölkerung sowie ihre Ressourcen in die Nation einzubinden."
 SIA_increase_rice_exports: "Reisexporte erhöhen"
 SIA_increase_rice_exports_desc: "Reis ist die sicherste Einnahmequelle für [ROOT.GetName]. Wir sollten die Exporte ausweiten, solange die Märkte noch offen sind, um uns eine Währungsreserve aufzubauen, strategische Importe zu finanzieren und die Staatskasse auf mögliche Krisen vorzubereiten."
 SIA_pad_thai: "Phat Thai"
 SIA_pad_thai_desc: "Eine moderne Nation lebt nicht nur von Ministerien und Fabriken, sondern auch von gemeinsamen Gewohnheiten, die die Menschen miteinander verbinden. Indem wir ein nationales Reisgericht fördern, das nur aus siamesischen Zutaten besteht, kurbeln wir den Konsum an, unterstützen die Bauern und verringern in unsicheren Zeiten die Abhängigkeit von Lebensmitteln aus dem Ausland."
 SIA_rice_husk_steam_turbines: "Mit Reishülsen betriebene Dampfturbinen"
 SIA_rice_husk_steam_turbines_desc: "Was andere als Abfall betrachten, lernten wir durch reine Notwendigkeit schätzen. Indem wir Reishülsen zur Dampferzeugung verbrennen, gewinnen wir Energie aus unserer eigenen Ernte und verringern unsere Abhängigkeit von importierter Kohle und Öl."
 SIA_domestic_tin_smelters: "Eigene Zinnschmelzen"
 SIA_domestic_tin_smelters_desc: "Es reicht nicht aus, Erz lediglich aus dem Boden zu holen und ins Ausland zu verschiffen. Durch den Bau von Zinnschmelzen behalten wir einen erheblich größeren Teil des Wertes unserer Ressourcen im eigenen Land und sichern gleichzeitig unserer Industrie wertvolle Metalle, die sowohl für den Handel als auch für den Krieg unverzichtbar sind."
 SIA_use_ships_as_generators: "Schiffe als Generatoren nutzen"
 SIA_use_ships_as_generators_tt: "Durch das Stationieren unserer eigenen §YGroßkampfschiffe§! in §YHäfen§!, die ein §YKernstaat§! von uns sind, erhalten wir §G-2%§! Bonus auf den Energieverbrauch (Fabriken) je §YGroßkampfschiff§! (maximal §G-15%§!).\n\nSobald diese Schiffe den Hafen verlassen, reduziert sich der Bonus entsprechend, und sie erneut im Hafen ankern zu lassen, gewährt den Bonus im Umkehrschluss wieder."
 SIA_use_ships_as_generators_desc: "Selbst ältere Schiffe, die nicht mehr für den Einsatz im Krieg oder für den Handel geeignet sind, können der Nation noch immer dienen. Indem wir Schiffe als schwimmende Kraftwerke vor Anker legen, versorgen wir Häfen und die Küstenindustrie mit Notstrom und schonen gleichzeitig wertvolle Brennstoffe und Infrastruktur."
 SIA_diversity_foreign_reserves: "Währungsreserve diversifizieren"
 SIA_diversity_foreign_reserves_desc: "Es ist gefährlich für [ROOT.GetName], die finanzielle Sicherheit der Währung oder die eigene Kreditwürdigkeit von einer einzelnen ausländischen Macht abhängig zu machen. Durch die Diversifizierung unserer Reserven verringern wir das Risiko und knüpfen gleichzeitig für den Handel und die Diplomatie neue Kontakte."
 SIA_diversity_foreign_reserves_tt: "Fügt in Kriegszeiten zusätzlich §G2§! §YMilitärfabriken§! abseits der Karte hinzu.\nFügt einem zufälligen Kernstaat in Kriegszeiten eine Produktion von §G8§! Stahl hinzu."
 SIA_exclusivity_resource_contract: "Exklusives Ressourcenabkommen"
 SIA_exclusivity_resource_contract_desc: "Ein einzelner ausländischer Partner kann uns Kapital und Abnahmegarantien im Tausch für privilegierten Zugang zu unseren Ressourcen bieten. Ein solcher Exklusivvertrag mag zwar die Entwicklung beschleunigen, bindet [ROOT.GetName] jedoch an die Interessen eines anderen Landes."
 SIA_maintain_resource_independence: "Ressourcenunabhängigkeit bewahren"
 SIA_maintain_resource_independence_desc: "Exklusivverträge mit anderen Ländern bringen uns zwar schnelle Gewinne ein, machen uns aber auch abhängig von diesen Nationen. Indem wir die Kontrolle über unsere Ressourcen behalten, bewahren wir uns die Freiheit, sie für die Bedürfnisse Siams zu nutzen und nicht für die Forderungen anderer."
 SIA_kasetsart_university: "Universität Kasetsart"
 SIA_kasetsart_university_desc: "Wenn die Landwirtschaft produktiver werden soll, sollte sie sich eher an wissenschaftlichen Erkenntnissen als überlieferten Traditionen orientieren. Die Universität Kasetsart bildet Agrarwissenschaftler, Tierärzte und technische Experten für eine moderne Landwirtschaft aus."
 SIA_mahidol_university: "Universität Mahidol"
 SIA_mahidol_university_desc: "Ein moderner Staat braucht Ärzte, Forscher und Verwaltungsfachleute ebenso wie Soldaten und Ingenieure. Die Universität Mahidol unterstützt die Hochschulbildung und bringt die für Reformen benötigten Fachkräfte hervor."
 SIA_silpakorn_university: "Universität Silpakorn"
 SIA_silpakorn_university_desc: "TODO_CM"
 SIA_contingency_funds: "Notfallfonds"
 SIA_contingency_funds_desc: "Wohlstand in Friedenszeiten ist wenig wert, wenn der Staat unvorbereitet in eine Krise gerät. Indem wir jetzt Geld für Notfälle zurücklegen, stellen wir sicher, dass eine Blockade, eine Missernte oder ein plötzlicher Krieg den Staatsapparat nicht sofort zum Erliegen bringen."
 SIA_contingency_funds_tt: "Wir werden in Friedenszeiten einen Notfallfonds anlegen. Während des Aufbaus dieses Fonds erhalten wir einen moderaten Betrag an §YKonsumgüterfaktor§!.\n\nWährend eines Krieges können wir diesen Fond nutzen, um einen großen Produktionsbonus zu erhalten.\nWie lange der Fonds hält, hängt davon ab, wie lange eingezahlt wurde."
 SIA_prepare_for_the_next_blockade: "Auf die nächste Blockade vorbereiten"
 SIA_prepare_for_the_next_blockade_desc: "Da wir vom Meer abhängig sind, könnte ein Krieg dazu führen, dass [ROOT.GetNameDef] von Märkten, Maschinen und Treibstoff abgeschnitten wird. Wir müssen uns schon jetzt auf die nächste Blockade vorbereiten, indem wir Vorräte anlegen, Notfallpläne erstellen und Ersatzlösungen finden, bevor uns die Not dazu zwingt."
 SIA_domestic_arms_industry: "Eigene Rüstungsindustrie"
 SIA_domestic_arms_industry_desc: "Ein Königreich, das jedes Gewehr und jede Granate importieren muss, ist nicht sicher. Wie bescheiden der Anfang auch sein mag: Eine heimische Rüstungsindustrie wird es [ROOT.GetName] erlauben, Soldaten durch eigene Werkstätten auszurüsten, selbst wenn Lieferungen aus dem Ausland ausbleiben."
 SIA_war_material_substitutions: "Alternatives Kriegsmaterial"
 SIA_war_material_substitutions_desc: "Während einer Blockade ist selbst noch so perfektes Material weniger wert als das, was gerade verfügbar ist. Wir müssen nach Ersatzstoffen für Metalle, Chemikalien und importierte Bauteile suchen, damit die Produktion auch dann weiterlaufen kann, wenn Waren nicht länger unsere Küsten erreichen."
 SIA_royal_thai_ordnance_factory: "Königliche Waffenfabrik"
 SIA_royal_thai_ordnance_factory_desc: "Damit der Staat sicher ist, bedarf es mehr als nur importierter Waffen und vereinzelter Reparaturwerkstätten. Die Königliche Waffenfabrik Thailands wird das nötige Wissen und die Maschinen unter die Aufsicht der Krone stellen und [ROOT.GetName] dauerhaft zu einem Waffen- und Munitionshersteller machen."
 SIA_built_to_withstand_every_flame: "Gebaut, um jeder Flamme standzuhalten"
 SIA_built_to_withstand_every_flame_desc: "Eine Fabrik, die in einer Nacht niederbrennt, kann am nächsten Morgen nicht mehr für das Land arbeiten. Unsere Lagerhäuser, Mühlen und Werkstätten müssen unter Berücksichtigung des Standorts, des Brandschutzes und der Notfallprävention gebaut werden, damit Sabotage, Bombenangriffe oder Unfälle nicht so leicht die Produktion lahmlegen können."
 SIA_the_army_of_siam: "Die Armee von Siam"
 SIA_the_army_of_siam_desc: "Die Struktur unserer Streitkräfte ist veraltet und entspricht nicht mehr den Anforderungen der heutigen Zeit. Wenn [ROOT.GetNameDef] seine Souveränität verteidigen und seine Interessen im Ausland durchsetzen möchte, müssen wir eine neue, moderne Armee aufbauen, die für die Kriege, die sich derzeit weltweit abzeichnen, gerüstet, ausgebildet und organisiert ist."
 SIA_plan_for_a_short_war: "Auf einen kurzen Krieg vorbereiten"
 SIA_plan_for_a_short_war_desc: "Unsere Ressourcen sind begrenzt und unsere Feinde zahlreich. [ROOT.GetNameDefCap] kann sich keinen langwierigen Zermürbungskrieg leisten. Sollte es zum Krieg kommen, muss er rasch und entschlossen geführt werden und enden, ehe der Feind wieder zu Kräften kommen kann."
 SIA_intermediate_war_preparation: "Auf einen mittellangen Krieg vorbereiten"
 SIA_intermediate_war_preparation_desc: "Es ist gefährlich, sich nur auf einen Blitzkrieg vorzubereiten, aber auch verschwenderisch, sich ausschließlich auf einen langwierigen Kampf einzustellen. Eine ausgeglichene Doktrin erlaubt es [ROOT.GetName], mit Nachdruck zuzuschlagen und gleichzeitig jene Ausdauer bewahren, die man braucht, um einem hartnäckigeren Feind die Stirn zu bieten."
 SIA_prepare_for_a_long_war: "Auf einen langen Krieg vorbereiten"
 SIA_prepare_for_a_long_war_desc: "Großmächte können Kriege innerhalb weniger Monate entscheiden, doch kleinere Nationen sind oft gezwungen, sie über Jahre hinweg zu erdulden. Wir müssen die [ROOT.GetAdjective]e Rüstungsindustrie und die Logistik deshalb auf einen langwierigen, zermürbenden Kampf vorbereiten, in dem Geduld und Durchhaltevermögen ebenso wichtig sind wie Tapferkeit."
 SIA_specialized_warfare: "Spezialisierte Kriegsführung"
 SIA_specialized_warfare_desc: "Das Terrain um uns herum ist für eine richtige Armee nicht geeignet. Berge, Dschungel und Flusslandschaften erfordern jeweils unterschiedliche Fähigkeiten. Durch den Aufbau spezialisierter Truppen stellen wir sicher, dass [ROOT.GetNameDef] dem Feind mit angemessener Stärke begegnet, ungeachtet des Terrains."
 SIA_artillery_reigns_supreme: "Unangefochtene Herrschaft der Artillerie"
 SIA_artillery_reigns_supreme_desc: "Moderne Schlachten werden nicht allein durch Kampfgeist gewonnen. Die Artillerie ist und bleibt die Königin des Schlachtfelds: Sie durchbricht Stellungen, schlägt Angriffe in die Flucht und ebnet unserer Infanterie den Weg. Wenn wir triumphieren wollen, muss die [ROOT.GetAdjective]e Feuerkraft durchschlagskräftig und präzise sein."
 SIA_yield_the_air_war: "Den Luftkrieg aufgeben"
 SIA_yield_the_air_war_desc: "Wir werden es nicht schaffen, die Großmächte in der Luft herauszufordern. Anstatt wertvolle Ressourcen in einem Kampf zu verschwenden, den wir wahrscheinlich nicht gewinnen werden, sollten wir unsere Luftabwehr verstärken und feindlichen Flugzeugen die Möglichkeit nehmen, unsere Soldaten und Städte ungestraft anzugreifen."
 SIA_the_thunder_at_the_gates: "Der Donner vor den Toren"
 SIA_the_thunder_at_the_gates_desc: "Es gibt Festungen, die mit gewöhnlichen Geschützen nicht einzunehmen sind, und Angriffe, die mit überwältigender Feuerkraft durchgeführt werden müssen. Schwere Artillerie, Belagerungsgeschütze und Eisenbahnkanonen werden [ROOT.GetName] dazu ermächtigen, die Tore eines jeden Feindes einzureißen, der unsere Zurückhaltung mit Schwäche verwechselt."
 SIA_night_time_training: "Ausbildung bei Nacht"
 SIA_night_time_training_desc: "Angriffe am helllichten Tag gegen einen gut vorbereiteten Feind sind unweigerlich zum Scheitern verurteilt. Indem wir unsere Männer darin ausbilden, den Feind im Schutz der Dunkelheit zu infiltrieren und anzugreifen, können wir unseren Gegner in einem Moment erwischen, an dem er am verwundbarsten und nicht darauf vorbereitet ist, uns etwas entgegenzusetzen."
 SIA_steel_arteries: "Arterien aus Stahl"
 SIA_steel_arteries_desc: "Keine Armee kann weit vorrücken, ohne dass sie per Schiene oder Straße versorgt wird. Die stählernen Lebensadern der Nation müssen ausgebaut werden, um Truppen, Nachschub und Waffen schnell an jede bedrohte Grenze zu transportieren. Bei dieser Aufgabe gehen militärische Sicherheit und nationale Entwicklung Hand in Hand."
 SIA_prepare_northern_infrastructure_for_war: "Nördliche Infrastruktur auf einen Krieg vorbereiten"
 SIA_prepare_northern_infrastructure_for_war_desc: "Der Norden wird in jedem Konflikt mit Burma und dessen Verbündeten eine entscheidende Rolle spielen. Straßen, Eisenbahnstrecken und Depots in dieser Region müssen unverzüglich ausgebaut werden, damit die [ROOT.GetAdjective]en Streitkräfte ohne Verzögerung vorrücken oder Widerstand leisten können."
 SIA_unconventional_tank_construction: "Unkonventionelle Panzerkonstruktion"
 SIA_unconventional_tank_construction_desc: "Wir können die Panzer der Großmächte nicht eins zu eins nachbauen. Damit [ROOT.GetNameDef] Panzer einsetzen kann, müssen wir kostengünstigere und flexiblere Bauweisen verfolgen und dabei auf imposante Entwürfe zugunsten reiner Stückzahlen und nüchterner Zweckmäßigkeit verzichten."
 SIA_conventional_tank_construction: "Konventionelle Panzerkonstruktion"
 SIA_conventional_tank_construction_desc: "Panzer sind aus der modernen Kriegsführung nicht mehr wegzudenken, und unsere Behelfslösungen werden uns nur ein Stück weit bringen. Wir sollten eine moderne Panzerindustrie aufbauen, die auf soliden Grundsätzen, Standardkonstruktionen und zuverlässigen Fertigungsmethoden basiert."
 SIA_reverse_engineer_allied_tanks: "Panzer der Alliierten nachbauen"
 SIA_reverse_engineer_allied_tanks_desc: "Andere trugen bereits die Kosten für die Erprobung von Panzern. Erbeutete Panzer und importierte Maschinen lassen sich zerlegen, untersuchen und nachbauen. Indem wir von den Konstruktionen anderer lernen, verkürzt [ROOT.GetNameDef] den Weg zu einem eigenen Panzerkorps."
 SIA_tankettes: "Tanketten"
 SIA_tankettes_desc: "Tanketten sind leicht, kostengünstig und einfach herzustellen. Sie entscheiden zwar keine großen Schlachten, lassen sich aber dennoch zur Aufklärung, in der Kolonialkriegsführung und zur Unterstützung der Infanterie einsetzen. Für eine Nation, die nicht über unbegrenzte Mittel verfügt, bieten solche kleinen gepanzerten Fahrzeuge einen praktischen Einstieg in die mechanisierte Kriegsführung."
 SIA_jungle_armor: "Dschungelpanzerung"
 SIA_jungle_armor_desc: "In den Dschungeln unserer Region kann man keine schweren Maschinen einsetzen, die für die flachen Ebenen Europas konzipiert wurden. Wenn [ROOT.GetNameDef] einen Panzertrupp aufbauen will, müssen diese kleinspurig sowie an einen schlechten Untergrund und ein drückendes Klima angepasst sein und dort, wo es der Dschungel erfordert, Gewicht zugunsten von Mobilität opfern können."
 SIA_mountain_tanks: "Gebirgspanzer"
 SIA_mountain_tanks_desc: "Unwegsames Gelände und Gebirgspässe kann man nicht allein der Infanterie überlassen. Durch kleinere Panzerfahrzeuge, die für einen Einsatz in unwegsamen Gelände entworfen wurden, geben wir unseren Streitkräften die Möglichkeit, gepanzerte Feuerkraft in Gebieten einzusetzen, in denen gewöhnliche Panzer versagen würden."
 SIA_reluctant_submission: "Widerwillige Unterwerfung"
 SIA_reluctant_submission_desc: "Sollte [ROOT.GetNameDef] von einem stärkeren Feind angegriffen werden, könnte es einen Moment geben, in dem offener Widerstand nur zu unserem Untergang führt. Nachzugeben mag bitter sein, doch manchmal muss eine Regierung dies tun, um die Nation vor dem sicheren Untergang zu bewahren. Solange wir überleben, können wir auf einen günstigeren Zeitpunkt warten."
 SIA_reluctant_submission_trigger: "Dieser Schwerpunkt wird automatisch abgeschlossen, wenn wir angegriffen werden und bei dem Ereignis die Option der §YUnterwerfung§! wählen."
 SIA_reluctant_submission_tt: "Wir sind in der Lage, mit einer angreifenden Großmacht Frieden zu schließen. Diese wird jedoch von uns erwarten, dass wir Geld für sie drucken.\nUnser §YKonsumgüterfabrikenfaktor§! erhöht sich monatlich um §Y[?idea_SIA_printing_money_monthly_change|%]§! bis zu einem Maximum von §Y[?idea_SIA_printing_money_monthly_change_max|%]§!.\n\nDer Schwerpunkt §Y$SIA_thai_rice_company$§! verringert diese Erhöhung um §G50%§!\n\nDer Schwerpunkt §Y$SIA_demand_repatriation$§! entfernt die Notwendigkeit, Geld zu drucken."
 SIA_seri_thai: "Seri Thai"
 SIA_seri_thai_desc: "Unterwerfung muss nicht zwangsläufig den Verlust des Nationalgeistes bedeuten. Selbst unter einer Besatzung und der damit einhergehenden Unterwerfung lässt sich ein Untergrund organisieren, der für die Unabhängigkeit kämpft, Informationen sammelt und jenen Tag vorbereitet, an dem sich [ROOT.GetNameDef] erneut erhebt."
 SIA_contact_the_south_east_asia_command: "Kontakt zum Südostasiatischen Kommando"
 SIA_contact_the_south_east_asia_command_desc: "Wenn Widerstand mehr sein soll als nur eine leere Geste, muss er in eine umfassendere Strategie eingebunden sein. Indem wir Kontakt zu den Alliierten in Südostasien aufnehmen, sichern sich die [ROOT.GetAdjective]en Patrioten Führung und Versorgung und nehmen eine Rolle im größeren Konflikt ein."
 SIA_broadcast_weather_reports_to_the_allies: "Wettervorhersagen an die Alliierten weiterleiten"
 SIA_broadcast_weather_reports_to_the_allies_desc: "Der Himmel und die Meere der Region werden ebenso sehr vom Wetter bestimmt wie von Flotten und Armeen. Zuverlässige Berichte aus [ROOT.GetName] unterstützen die Planung der Alliierten, schützen ihre Einsätze vor Überraschungen und machen unser Heimatland zu einem stillen, aber wertvollen Partner in ihrem Krieg."
 SIA_american_investment_aid: "Amerikanische Investitionen"
 SIA_american_investment_aid_desc: "Die Vereinigten Staaten verfügen über mehr Reichtum als unsere gesamte Region zusammen. Sollte es uns gelingen, uns amerikanische Unterstützung und Investitionen für unsere geheimen, nationalen Bemühungen zu sichern, verfügt [ROOT.GetNameDef] über die materiellen Mitte, um einen Befreiungskrieg zu überstehen."
 SIA_thai_students_in_the_oss: "Thailändische Studenten im OSS"
 SIA_thai_students_in_the_oss_desc: "Die nächste Generation von Patrioten kann im Ausland in den Künsten der Spionage, Sabotage und irregulären Kriegsführung ausgebildet werden. Indem wir vertrauenswürdige thailändische Studenten in das Umfeld der alliierten Geheimdienste einbinden, sind wir bestens auf den bevorstehenden Schattenkrieg vorbereitet."
 SIA_prepare_to_drop: "Auf den Absprung vorbereiten"
 SIA_prepare_to_drop_desc: "Wenn die Zeit gekommen ist, für unsere Befreiung zu kämpfen, könnten die Alliierten versuchen, aus der Luft in unser Heimatland vorzudringen. Wir müssen dafür Landeplätze ausmachen, Kontakte knüpfen und Unterstützungsnetzwerke aufbauen, die Luftlandetruppen aufnehmen und dorthin leiten, wo man sie am dringendsten braucht."
 SIA_unseat_the_government: "Die Regierung stürzen"
 SIA_unseat_the_government_desc: "Ein Regime, das [ROOT.GetName] der Fremdherrschaft unterwarf, darf nicht bestehen bleiben. Indem wir Widerstand leisten, Intrigen schmieden und rechtzeitig handeln, entmachten wir diejenigen, die die Nation kompromittierten, und eine Regierung aufbauen, die eines starken Siams würdig ist."
 SIA_unseat_the_government_tt: "[ROOT.GetName] verlässt das derzeitige Bündnis und wechselt die Seiten im Krieg, um sich den §YAlliierten§! anzuschließen.\n\nDie Loyalisten lehnen sich gegen diesen Seitenwechsel auf und rufen zu einem Bürgerkrieg auf.\n\nWenn unsere Unterstützung bei insgesamt §Ymehr als 80%§! liegt, stürzen wir die Regierung, ohne dass ein Bürgerkrieg ausbricht. Unsere Unterstützung erhöht sich um §Y5%§! für jeden beeinflussten General, zuzüglich der demokratischen Unterstützung.\n\nUnsere Unterstützung durch beeinflusste Generäle liegt bei §Y[?var:SIA_seri_thai_cw_scale|%]§! und unsere demokratische Unterstützung bei §Y[?var:party_popularity@democratic|%]§!"
 SIA_choose_new_leader_tt: "Da die alte Regierung gestürzt wurde, muss der Sieger nun entscheiden, wer die neue Regierung anführen wird."
 SIA_the_phayap_army: "Die Phayap-Armee"
 SIA_the_phayap_army_desc: "Wenn wir auf der Seite des Angreifers stehen wollen, müssen unsere Streitkräfte unweigerlich einen Platz in der neuen Kriegsordnung erhalten. Ein eigenes Feldkommando für Einsätze im Westen und Norden aufzubauen, erlaubt es dem [ROOT.GetAdjective]en Militär, an der Seite unserer mächtigen Verbündeten vorzurücken und eigene Eroberungen anzustreben."
 SIA_securing_the_rubber_islands: "Die Kautschukinseln sichern"
 SIA_securing_the_rubber_islands_desc: "Kautschuk ist das Lebenselixier der modernen Kriegsführung und dient als Rohstoff für Reifen, Dichtungen und unzählige andere Werkzeuge der mechanisierten Kriegsführung. Die ressourcenreichen Regionen könnten für die bevorstehenden Konflikte besonders wichtig werden, weshalb wir uns darum bemühen sollten, sie zu sichern, bevor es andere tun."
 SIA_breaking_the_burmese_line: "Die burmesische Linie durchbrechen"
 SIA_breaking_the_burmese_line_desc: "Burma steht zwischen unseren Ambitionen und den Ländern, die wir erobern wollen. Die [ROOT.GetAdjective]en Streitkräfte müssen ihren Wert beweisen und die burmesische Linie durch Entschlossenheit, Planung und den gezielten Einsatz von Gewalt durchbrechen."
 SIA_pacific_war: "Pazifikkrieg"
 SIA_pacific_war_desc: "Wir können den Konflikt in Ostasien nicht länger als etwas weit Entferntes betrachten. Der Krieg im Pazifik bestimmt über das Schicksal aller Nationen in unserer Region, und [ROOT.GetNameDef] muss sich entscheiden, auf welcher Seite des Konflikts wir stehen wollen: als Mitläufer, Verbündeter oder Opfer."
 SIA_joint_asian_military_command: "Asiatisches Militärkommando"
 SIA_joint_asian_military_command_desc: "Unsere Bemühungen zeigen eine größere Wirkung, wenn sie mit denen unserer regionalen Partner abgestimmt sind. Eine gemeinsame Kommandostruktur verspricht mehr Effizienz, eine klarere Planung und eine einheitliche Ausrichtung von Maßnahmen, die andernfalls durch Rivalitäten und Verwirrung zunichtegemacht werden könnten."
 SIA_demand_repatriation: "Rückführung fordern"
 SIA_demand_repatriation_desc: "Diejenigen, die unter dem Vorwand der Notwendigkeit in unser Land kamen, stehen bei [ROOT.GetName] in der Schuld. Sobald sich unsere Lage verbessert, sollten wir die Rückgabe dessen einfordern, was uns gestohlen wurde, und die Besatzer dazu drängen, die Kosten zu tragen."
 SIA_standing_our_ground: "Standhaft bleiben"
 SIA_standing_our_ground_desc: "Es kommt ein Punkt, an dem Rückzug und Verhandlungen nur noch weitere Demütigungen mit sich bringen. [ROOT.GetNameDefCap] muss allen klarmachen, dass wir noch immer den Willen besitzen, zu kämpfen und jene zu vertreiben, die sich anmaßen, unser Schicksal mit Waffengewalt bestimmen zu wollen."
 SIA_standing_our_ground_trigger: "Dieser Schwerpunkt wird automatisch abgeschlossen, wenn wir angegriffen werden und bei dem Ereignis die Option des §YWiderstands§! wählen."
 SIA_ask_for_the_release_of_american_commodities: "Freigabe amerikanischer Rohstoffe fordern"
 SIA_ask_for_the_release_of_american_commodities_desc: "Amerikanische Vorräte, Maschinen und andere Waren könnten uns den nötigen Spielraum verschaffen, den wir brauchen. Durch umsichtiges diplomatisches Taktieren erwirken wir die Freigabe solcher Güter, was Versorgungsengpässe mildert und die materielle Grundlage unserer Kriegsanstrengungen stärkt."
 SIA_japanese_fighters: "Japanische Jäger"
 SIA_japanese_fighters_desc: "Unsere eigene Luftwaffe ist nach wie vor eher klein, und ausländische Flugzeuge könnten dazu beitragen, diese Lücke zu schließen. Japanische Kampfflugzeuge würden uns zumindest ein gewisses Maß an Modernität verschaffen, wenn auch nur innerhalb der Grenzen, die uns unsere industrielle Schwäche setzt."
 SIA_get_off_our_shores: "Runter von unseren Küsten"
 SIA_get_off_our_shores_desc: "Die Anwesenheit fremder Truppen auf siamesischem Boden ist ein Affront, der durch keinerlei Ausreden abzumildern ist. Ob durch Waffengewalt oder den Druck anderer: Wir müssen darauf bestehen, dass die Eindringlinge unser Land verlassen, um die [ROOT.GetAdjective]e Würde wiederherzustellen.\n\nIhr seid Feiglinge wie alle grausamen Menschen. Und jetzt verschwindet aus unserem Land!"
 SIA_singaporean_reinforcements: "Verstärkung aus Singapur"
 SIA_singaporean_reinforcements_desc: "Die Konflikte in Malaya und der unmittelbaren Umgebung sind untrennbar mit unserer eigenen Sicherheit verknüpft. Indem wir die Truppen, die sich rund um Singapur versammeln zur Verstärkung nutzen, stärken wir unsere Verteidigungslinie, weiten unsere Zusammenarbeit mit den Alliierten aus und vereinen den gesamten Kriegsschauplatz unter einem gemeinsamen Ziel."
 modify_SIA_directorate_of_aeronautical_engineering: "Modifiziert §YDirektorat für Luftfahrttechnik§! um:"
 SIA_aid_for_resources: "Unterstützung gegen Ressourcen"
 SIA_aid_for_resources_desc: "Unser Land verfügt über Ressourcen, die von fremden Mächten begehrt werden, und es fehlt uns an bestimmten Werkzeugen, die sie bereitstellen könnten. Durch einen Tausch sorgen wir dafür, dass die [ROOT.GetAdjective]en Vorratslager stets gut gefüllt sind, und stellen gleichzeitig sicher, dass unser Reichtum zu unserem eigenen Fortbestand beiträgt."
 SIA_aid_for_resources_tt: "Wir bitten [JAP.GetName] im Tausch für Ressourcenrechte für Kautschuk in §Y[724.GetName]§! darum, unserem Krieg beizutreten"
 SIA_how_quickly_the_tables_turn: "So schnell wendet sich das Blatt"
 SIA_how_quickly_the_tables_turn_desc: "Diejenigen, die [ROOT.GetName] einst für schwach und unterwürfig hielten, werden schon sehr bald feststellen, dass sich das Blatt gewendet hat. Wir müssen bereit sein, jede Schwächer unserer Unterdrücker zu nutzen, um die Oberhand zu gewinnen."
 SIA_how_quickly_the_tables_turn_trigger: "Wir wurden von einer Großmacht angegriffen und zwangen diese Großmacht zur Kapitulation."
 SIA_royal_thai_navy: "Königliche Marine"
 SIA_royal_thai_navy_desc: "Die Verteidigung von [ROOT.GetName] endet nicht an der Küste. Zum Schutz dieser Küsten und Flüsse und für den Handel übers Meer brauchen wir eine Flotte, die unseres großen Königreichs würdig ist. Indem wir die Königlich Thailändische Marine stärken, stellen wir sicher, dass Siam die Hoheit über seine Gewässer behält."
 modify_royal_thai_navy: "Modifiziert §Y$idea_SIA_thai_royal_navy$§! um:"
 SIA_direct_army_fundings_towards_the_navy: "Gelder der Armee in die Marine umleiten"
 SIA_direct_army_fundings_towards_the_navy_desc: "Die Armee beansprucht bereits seit Langem den Löwenanteil der Militärausgaben, doch die [ROOT.GetAdjective]e Strategie ist nicht rein kontinentaler Natur. Indem wir Mittel in die Marine umleiten, korrigieren wir dieses Ungleichgewicht und sichern die Meere, die unserem Handel und unseren Küsten Schutz bieten."
 SIA_thonburi_class_coastal_defense_ship: "Küstenverteidigungsschiffe der Thonburi-Klasse"
 SIA_thonburi_class_coastal_defense_ship_desc: "Selbst eine bescheidene Flotte kann eine ernst zu nehmende Bedrohung darstellen, wenn sie richtig auf die örtlichen Gegebenheiten zugeschnitten ist. Die Thonburi-Klasse bietet der [ROOT.GetAdjective]en Marine ein praktisches Mittel, um die Küsten zu verteidigen, da sie eine beachtliche Feuerkraft besitzt und ideal für unsere Gewässer geeignet ist."
 SIA_acquire_submarines: "U-Boote erwerben"
 SIA_acquire_submarines_desc: "U-Boote bieten einer kleinen Marine die Möglichkeit, selbst größere Überwasserflotten zu bekämpfen. Verborgen unter den Wellen greifen sie Konvois an, schrecken stärkere Flotten ab und erschweren mögliche Angriffe des Feindes auf unsere Küste. [ROOT.GetNameDefCap] sollte diese Art von Waffe nicht vernachlässigen."
 SIA_submarine_day: "Nationaler U-Boot-Tag"
 SIA_submarine_day_desc: "Die Einführung von U-Booten in unsere Kriegspläne verdient öffentliche Anerkennung und landesweite Begeisterung. Indem wir die U-Boot-Flotte würdigen, fördern wir die Rekrutierung, steigern ihr Ansehen und verankern in der Öffentlichkeit die Vorstellung, dass für die siamesische Marine ein neues Zeitalter beginnt."
 SIA_the_thonburi_dockyard_project: "Das Werftprojekt Thonburi"
 SIA_the_thonburi_dockyard_project_desc: "Eine Marine kann sich nicht ausschließlich auf den Import von Schiffen verlassen. Wenn [ROOT.GetNameDef] die eigenen Marinestreitkräfte ausbauen will, müssen wir in Werften, Werkstätten und Arbeitskräfte investieren, die das eigentliche Fundament einer wahren Seemacht bilden."
 SIA_expand_the_slipways: "Die Bootsrampen vergrößern"
 SIA_expand_the_slipways_desc: "Unsere derzeitige Marinestruktur ist für unsere Ambitionen viel zu klein. Durch die Vergrößerung der Bootsrampen steigern wir unsere Kapazitäten für den Bau und die Reparatur von Schiffen, wodurch unsere Flotte leichter vergrößert werden und länger einsatzbereit sein kann."
 SIA_a_new_drydock: "Ein neues Trockendock"
 SIA_a_new_drydock_desc: "Um unsere Marineflotte angemessen zu warten, ist ein modernes Trockendock unerlässlich. Ohne ein solches ist die Instandhaltung größerer Schiffe langsam, ineffizient und von der Hilfe anderer abhängig. Ein neues Trockendock verleiht [ROOT.GetName] mehr Einfluss auf die Zukunft der eigenen Marine."
 SIA_install_heavy_cranes_and_power_plant: "Schwere Kräne und ein Kraftwerk bauen"
 SIA_install_heavy_cranes_and_power_plant_desc: "Beim Schiffbau braucht man nicht nur Holz und Stahl, sondern auch Maschinen und Energie. Schwere Kräne und eine zuverlässige Stromversorgung verwandeln unsere kleinen Werften in eine vollwertige und moderne Industrie."
 SIA_establish_the_foundry_and_machine_shop: "Gießerei und Maschinenwerkstatt gründen"
 SIA_establish_the_foundry_and_machine_shop_desc: "Eine unabhängige Marine braucht mehr als nur aus importierten Teilen zusammengesetzte Schiffsrümpfe. Durch den Aufbau einer eigenen Gießerei und Maschinenwerkstatt stärken wir unsere industrielle Basis und können notwendige Komponenten von Kriegsschiffen im eigenen Land gießen, fertigen und reparieren."
 SIA_the_thonburi_arsenal: "Das Thonburi-Arsenal"
 SIA_the_thonburi_arsenal_desc: "Eine Werft, die nicht in der Lage ist, Kriegsgerät herzustellen, erfüllt nicht unsere derzeitigen Anforderungen. Die Errichtung eines Arsenals in Thonburi erlaubt es uns, Schiffsgeschütze, Munition und zugehörige Ausrüstung zu fertigen und zu lagern und unsere Marine stärker an die heimische Industrie binden."
 SIA_focus_on_commercial_civilian_ships: "Auf kommerzielle Zivilschiffe konzentrieren"
 SIA_focus_on_commercial_civilian_ships_desc: "Nicht jeder Kiel muss für einen Krieg bestimmt sein. Handelsschiffe, Transportschiffe und andere Zivilschiffe halten die Volkswirtschaft am Laufen. Indem wir den Bau von Handelsschiffen fördern, fördern wir zugleich sowohl den Wohlstand als auch die Widerstandsfähigkeit in Kriegszeiten."
 SIA_empower_the_coastguard: "Die Küstenwache ermächtigen"
 SIA_empower_the_coastguard_desc: "Unsere Flotte kann nicht überall gleichzeitig sein, und viele Aufgaben des Küstenschutzes lassen sich besser von kleineren Einheiten bewältigen. Durch eine erhöhte Präsenz der Küstenwache schützen wir unsere Fischereien, sorgen an unseren Küsten für Ordnung und entlasten die Marine, damit sie sich größeren Bedrohungen widmen kann."
 SIA_river_patrols: "Flusspatrouillen"
 SIA_river_patrols_desc: "Die Flüsse von [ROOT.GetName] dienen uns als Straße, Grenze und Lebensader. Patrouillenboote werden in diesen Gewässern für Ordnung sorgen, die lokalen Garnisonen unterstützen und den Einfluss des Staates auf Regionen ausweiten, wo die Verwaltung wegen der Entfernung der Hauptstadt sonst viel zu lange braucht."
 SIA_sell_bangkok_dock_co: "Das Werftunternehmen Bangkok verkaufen"
 SIA_sell_bangkok_dock_co_desc: "Privates Kapital schafft dort Möglichkeiten, wo die staatliche Verwaltung zu langsam ist. Indem wir das Werftunternehmen Bangkok an kompetente Investoren verkaufen, setzen wir öffentliche Mittel für dringlichere militärische Bedürfnisse ein."
 SIA_a_race_against_time: "Wettlauf gegen die Zeit"
 SIA_a_race_against_time_desc: "Unsere Marine ist veraltet, unterfinanziert und auf eine moderne Kriegsführung nicht vorbereitet. Wir müssen unverzüglich Mittel für den Schiffbau, die Modernisierung, die Küstenverteidigung und die Ausbildung der Marine bereitstellen. Die Uhr tickt schneller, als unsere Werften arbeiten können."
 SIA_a_race_against_time_tt: "Wenn der Nationalgeist abläuft, erhalten wir: "
 SIA_a_race_against_time_tt2: "für §Y280§! Tag(e)"
 #Tech
 the_thunder_at_our_gates_artillery: "Der Donner vor unseren Toren"
 SIA_siamese_tankettes: "Siamesische Tanketten"
 SIA_siamese_tankettes_desc: "Unsere Armee machte sich mit ihrer Flotte leichter Tanketten vertraut, wodurch sich ihre Zuverlässigkeit verbesserte und sich die Kosten für ihren Einsatz senken ließen."
 #Ideas
 idea_SIA_the_army_of_siam: "Die Armee von Siam"
 idea_SIA_the_army_of_siam_tt: "Modifiziert §Y$idea_SIA_the_army_of_siam$§!:"
 idea_SIA_the_thunder_at_our_gates: "Der Donner vor unseren Toren"
 idea_SIA_yielded_the_air_war: "Gab den Luftkrieg auf"
 idea_SIA_yielded_the_air_war_desc: "Da wir die Kontrolle über den Luftraum aufgaben, können wir die Ressourcen nun für die Luftabwehr einsetzen, anstatt direkt um die Luftüberlegenheit zu wetteifern."
 idea_SIA_steel_arteries: "Adern aus Stahl"
 idea_SIA_unconventional_tank_construction: "Unkonventionelle Panzerkonstruktion"
 idea_SIA_short_war: "Kurze Kriegsplanung"
 idea_SIA_short_war_temp_buff: "Kurzer Kriegseifer"
 idea_SIA_short_war_temp_debuff: "Kurze Kriegsmüdigkeit"
 SIA_no_supply_grace_tt: " $MODIFIER_NO_SUPPLY_GRACE$ $RIGHT|+=1$ Stunde(n)"
 idea_SIA_standing_our_ground_mission_temp_buff: "Standhaft bleiben"
 idea_SIA_german_tank_studies: "Deutsche Panzerstudien"
 idea_SIA_german_tank_studies_desc: "Unsere Offiziere befassten sich intensiv mit den Doktrinen und der Konstruktion von Panzertruppen anderer Länder und erwarben dabei technisches Wissen, das direkt in die Entwicklung unserer eigenen Panzertruppen einfließen kann."
 idea_SIA_american_tank_studies: "Amerikanische Panzerstudien"
 idea_SIA_american_tank_studies_desc: "$idea_SIA_german_tank_studies_desc$"
 idea_SIA_british_tank_studies: "Britische Panzerstudien"
 idea_SIA_british_tank_studies_desc: "$idea_SIA_german_tank_studies_desc$"
 jungle_tanks_tt: "Erlaubt den Bau von §YDschungelpanzern§!\n§YAlle Panzerdivisionen (Dschungel)§!:\nAngriff: §G+15%§!\nBewegung: §G+15%§!"
 jungle_heavy_tanks_tt: "Erlaubt den Bau von §YSchweren Dschungelpanzern§!\n§YAlle schweren, überschweren und modernen Panzerdivisionen (Dschungel)§!:\nAngriff: §G+15%§!\nBewegung: §G+15%§!"
 #Factions
 SIA_increase_military_approval_tt: "Erhöht die Zustimmung des §YMilitärflügels§! um einen §Gkleinen Betrag§!"
 SIA_increase_military_approval_2_tt: "Erhöht die Zustimmung des §YMilitärflügels§! um einen §Gmittleren Betrag§!"
