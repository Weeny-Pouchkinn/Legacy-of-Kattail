 idea_SIA_weather_broadcasts: "Wettervorhersage"
 idea_SIA_weather_broadcasts_desc: "Regelmäßige Wetterberichte geben unseren Luft- und Seestreitkräften einen besseren Überblick über die Wetterlage, was ihre Einsatzfähigkeit verbessert und die Risiken durch schlechtes Wetter minimiert."
 idea_SIA_seri_thai_contacts: "Verträge mit den Seri Thai"
 idea_SIA_seri_thai_contacts_desc: "Unsere Kontakte zum Widerstandsnetzwerk der Seri Thai erwiesen sich als äußerst wertvoll und erlaubten es uns, erfahrene Soldaten für unsere Reihen zu rekrutieren und die Beziehungen zu den Alliierten zu stärken."
 idea_SIA_secure_rubber_islands: "Sicherung der Kautschukinseln"
 idea_SIA_joint_military_command: "Gemeinsames Militärkommando"
 idea_SIA_joint_military_command_desc: "Eine einheitliche Kommandostruktur verbessert die Zusammenarbeit der Teilstreitkräfte, beschleunigt den Erfahrungsgewinn erfahrener Offiziere und treibt die Entwicklung neuer Militärdoktrinen voran."
