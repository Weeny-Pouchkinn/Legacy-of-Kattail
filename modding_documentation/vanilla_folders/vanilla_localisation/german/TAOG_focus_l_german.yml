 HOL_curtail_colonial_autonomy_taog_desc: "$HOL_curtail_colonial_autonomy_desc$"
 HOL_taog_guarantee_colonial_loyalty: "Kolonialtreue garantieren"
 HOL_taog_guarantee_colonial_loyalty_desc: "Der Nationalismus gewinnt in Niederländisch-Indien immer mehr Zuspruch, und es zeichnet sich deutlich ab, dass eine weitere Revolution kurz bevorsteht. Während die Revolution von 1927 mühelos niedergeschlagen werden konnte, sind unsere Quellen der Ansicht, dass wir es diesmal mit einer weitaus besser vorbereiteten Gruppe von Revolutionären zu tun haben könnten. Vielleicht sollten wir der friedlichen nationalistischen Bewegung der Soetardjos ein paar Zugeständnisse machen, um die Aufmerksamkeit der Zivilbevölkerung von der Revolution auf Soetardjo zu lenken?"
 HOL_taog_guarantee_colonial_loyalty_tt: "§WDies garantiert, dass es in [INS.GetName] zu keiner Revolution kommt.§!\n[INS.GetNameDefCap] versucht, auf friedlichem Weg die Unabhängigkeit zu erklären. Dies kann durch den Abschluss des Schwerpunkts §Y$INSHOL_industrialized_colony$§! verhindert werden, der erhebliche Investitionen in die Kolonie erfordert."
