 AST_australian_military_forces: "Australisches Militär"
 AST_australian_military_forces_desc: "Das australische Militär wurde im Ersten Weltkrieg stark auf die Probe gestellt, bewies seinen Mut in fernen Ländern und hielt in einigen der brutalsten Feldzüge des Konflikts stand. In den Jahren danach wurde die Armee verkleinert und zu einer Verteidigungsstreitmacht umgestaltet, deren Hauptaufgabe seither der Schutz der Heimatinseln ist. Die hart erarbeiteten Lektionen der Vergangenheit wurden jedoch nicht vergessen und können jederzeit wieder abgerufen werden."
 AST_permanant_military_forces: "Dauerhaftes Militär"
 AST_permanant_military_forces_desc: "Australiens wichtigste Streitkraft ist die Miliz, weil sie die Aufgabe hat, unser Festland zu verteidigen. Da die weltweiten Spannungen immer weiter zunehmen, könnte es jedoch ratsam sein, eine richtige Armee aufzubauen, die aus Offizieren und Soldaten besteht, von denen viele im Ersten Weltkrieg Erfahrungen sammelten. Auch wenn diese Truppe zunächst nur eine Reservefunktion haben sollte, böte sie Beständigkeit und ein einheitliches Ausbildungsniveau."
 AST_invoke_the_1903_defence_act: "Auf das Verteidigungsabkommen von 1903 berufen"
 AST_invoke_the_1903_defence_act_desc: "Australien stützte sich in der Vergangenheit bei der Landesverteidigung schon immer auf seine Miliz. Sollten wir einer richtigen Bedrohung gegenüberstehen, können wir jedoch das Verteidigungsgesetz von 1903 in Kraft setzen. Dies erlaubt es uns, zu Verteidigungszwecken zusätzliche Truppen einzuberufen."
 AST_lithgow_small_arms_factory: "Lithgow-Handfeuerwaffenfabrik"
 AST_lithgow_small_arms_factory_desc: "Die Lithgow-Handfeuerwaffenfabrik wurde 1912 gegründet, um im Kriegsfall die Abhängigkeit von in Großbritannien hergestellten Waffen und Ausrüstung zu verringern. Da die weltweiten Spannungen erneut zunehmen, sollten wir die Produktionsmittel ausweiten, um den wachsenden Bedarf unserer Streitkräfte zu decken."
 AST_dingo_scout_car: "Späherwagen Dingo"
 AST_dingo_scout_car_desc: "Australien hat zwar keine lange Tradition in der Entwicklung von Panzerfahrzeugen, doch unsere Streitkräfte fordern zunehmend Verstärkung in diesem Bereich. Wir sollten unsere eigenen Entwicklungen wie den Späherwagen Dingo rigoroser vorantreiben und annehmen."
 AST_volunteer_defence_corps_taog: "Freiwilliges Verteidigungskorps"
 AST_volunteer_defence_corps_taog_desc: "Das Freiwillige Verteidigungskorps ist eine ehrenamtliche Bürgermiliz, die am ehesten mit der britischen Home Guard vergleichbar ist, und sie setzt sich aus Personen zusammen, die für den regulären Militärdienst nicht geeignet sind. Aufgrund ihrer Ortskenntnis sind sie trotz dieser Einschränkungen bestens für den Guerillakrieg geeignet, sollte der schlimmste Fall eintreten."
 AST_war_carriers: "Lastenträger"
 AST_war_carriers_desc: "Die Logistik entscheidet über den Ausgang von Kriegen, und ein Großteil des Terrains, in dem Australien operiert, eignet sich nur schlecht für konventionelle Transportmittel wie Lastwagen oder Züge. Wir sollten uns stattdessen auf die Einheimischen verlassen, die sich an die Bedingungen angepasst haben und die versteckten Wege und Abkürzungen kennen."
 AST_anzac_spirit: "ANZAC-Geist"
 AST_anzac_spirit_desc: "Das australische und neuseeländische Armeekorps erlangte im Ersten Weltkrieg einen hervorragenden Ruf und vergoss viel Blut für einen Sieg des Empires. Zu seinen Tugenden gehörten Ausdauer, Mut, Einfallsreichtum und gute Laune, gepaart mit Gelassenheit im Angesicht von Gefahren."
 AST_lee_enfield_no1_mark3: "Lee-Enfield No.1 Mk III*"
 AST_lee_enfield_no1_mark3_desc: "Das Sternchen ist von entscheidender Bedeutung. Lee-Enfield No.1 Mk III* steht für kriegsbedingte Modifikationen, die eine schnellere und kostengünstigere Produktion ermöglichen. Da die Nachfrage jedoch inzwischen selbst diese Produktionssteigerungen übertrifft, müssen wir Komponenten von kleineren Firmen herstellen und in Lithgow zusammenbauen lassen, um die Produktionsleistung zu steigern."
 AST_new_south_wales_government_railways: "New South Wales Government Railways"
 AST_new_south_wales_government_railways_desc: "Die Fabriken der New South Wales Government Railways (Staatseisenbahn von New South Wales) verfügen über eine einzigartige Fertigungsmöglichkeit: große Stahlbauteile, die man als ein Stück gießt. Als eines der wenigen Länder des Commonwealth, das vollständig gegossene Panzerwannen und Türme herstellen kann, sollten wir diese Kapazität sinnvoll nutzen."
 AST_second_australian_imperial_force: "Zweite Australische Freiwilligenarmee"
 AST_second_australian_imperial_force_desc: "Australien entsandte während des Ersten Weltkriegs die Erste Australische Freiwilligenarmee ins Ausland. Da erneut ein globaler Krieg bevorsteht, sollten wir eine Zweite Australische Freiwilligenarmee aufstellen, um Australiens Stärke im Ausland zu demonstrieren."
 AST_expeditionary_leader: "Der §YGeneral§! hat die Eigenschaft §YLeiter der Expeditionsstreitkräfte§!. Diese verbessert seine Fähigkeiten in Übersee, begrenzt jedoch die Anzahl an Divisionen, die er befehligen kann."
 AST_expeditionary_leader_plural: "Beide §YGeneräle§! haben die Eigenschaft §YLeiter der Expeditionsstreitkräfte§!. Diese verbessert ihre Fähigkeiten in Übersee, begrenzt jedoch die Anzahl an Divisionen, die sie befehligen können."
 AST_larrikinism: "Larrikinismus"
 AST_larrikinism_desc: "Der Begriff „Larrikin“ bezeichnet einen ungehobelten, wilden, aber gutherzigen Menschen und ist zum Inbegriff der australischen Kultur geworden: schroffe Ausdauer, Respektlosigkeit gegenüber der Autorität und ein gut gelaunter Trotz im Angesicht der Gefahr. Australische Soldaten erwarben sich im Ersten Weltkrieg den Ruf, Entbehrungen mit Widerstandskraft zu begegnen und alles gelassen hinzunehmen."
 AST_diggers: "Goldschürfer"
 AST_diggers_desc: "„Grabt, grabt, grabt, bis ihr in Sicherheit seid“, lautete der Befehl an General William Birdwood, als die ANZAC-Truppen in Gallipoli landeten. Diese Worte wurden schließlich zum Inbegriff der australischen Kampfweise. Doch der Geist der „Goldschürfer“ reicht tiefer und verbindet australische und neuseeländische Soldaten durch „Mateship“: jenes unerschütterliche Band, wenn man Seite an Seite und für seine Kameraden kämpft."
 AST_owen_gun: "Owen-Maschinenpistole"
 AST_owen_gun_desc: "Die innovative, im eigenen Land entwickelte Owen-Maschinenpistole ist äußerst zuverlässig, ganz wie unsere Soldaten. Da unsere Streitkräfte weltweit im Einsatz sind, sollten wir diese Waffe nicht nur als Symbol des australischen Erfindungsreichtums betrachten, sondern als Ausdruck unseres Kampfgeistes."
 AST_department_of_supply_and_development_taog: "Abteilung für Versorgung und Entwicklung"
 AST_department_of_supply_and_development_taog_desc: "Der Krieg bringt unsere Produktion und Logistik an ihre Grenzen. Wir müssen unsere Bemühungen zentralisieren und eine Abteilung einrichten, die für die Koordinierung und Aufrechterhaltung zuständig ist."
 AST_sentinel_tank_development: "Sentinel-Panzer entwickeln"
 AST_sentinel_tank_development_desc: "In der Vergangenheit verließen wir uns auf importierte Panzerbaupläne, auch wenn die Produktion dann im eigenen Land stattfand. Wir sollten diese Erfahrung und den australischen Innovationsgeist nutzen, um einen eigenen Panzer zu entwickeln, der auf unsere Bedürfnisse und Ressourcen zugeschnitten ist."
 AST_establish_training_camps: "Trainingslager einrichten"
 AST_establish_training_camps_desc: "Wie schon im Ersten Weltkrieg kann die Zweite Australische Freiwilligenarmee überall auf der Welt zum Einsatz kommen. Wir müssen ein umfassende Ausbildungsprogramm entwickeln, das unsere Soldaten auf jede Umgebung vorbereitet, angefangen von den Wüsten Nordafrikas bis zu den Dschungeln des Südpazifiks."
 AST_jungle_tanks_if_sentinel_tank_development: "Wenn wir „Sentinel-Panzer entwickeln“ abgeschlossen haben:"
 jungle_heavy_tanks: "Schwere Panzer für den Dschungel"
 AST_anti_malaria_campaign: "Malariabekämpfung"
 AST_anti_malaria_campaign_desc: "Es könnte passieren, dass unsere Truppen in den Dschungeln des Pazifiks kämpfen müssen, wo eine Bedrohung auf sie wartet, die tödlicher ist als feindliche Kugeln: Malaria. Wir müssen Maßnahmen ergreifen, um unsere Truppen vor diesem unsichtbaren Feind zu schützen."
 AST_defence_citizen_military_forces_act: "Bürgerwehrgesetz"
 AST_defence_citizen_military_forces_act_desc: "Bislang konnten nur freiwillige Berufssoldaten im Ausland eingesetzt werden. Angesichts der fortschreitenden Eskalation des Konflikts müssen wir die rechtlichen Rahmenbedingungen schaffen, damit Milizeinheiten bei Bedarf ebenfalls im Ausland eingesetzt werden können."
 AST_call_that_a_knife: "Keine Sorge!"
 AST_call_that_a_knife_desc: "„Das ist kein Messer ... DAS ist ein Messer!“ Etwas draufgängerische Gelassenheit und Humor wirken oft Wunder. Unsere Soldaten begegnen der Gefahr mit Zuversicht, Zähigkeit und einer gehörigen Portion Selbstsicherheit."
 AST_army_inventions_directorate_taog: "Abteilung für Armeeinnovation"
 AST_army_inventions_directorate_taog_desc: "Einer der wenigen Vorteile des Krieges, wenn man das überhaupt so nennen kann, ist das rasante Tempo, mit dem technologische Innovation aus der Not heraus entsteht. Wir sollten eine zentrale Organisation gründen, die diese Durchbrüche bündelt, verfeinert und nutzbar macht."
 AST_yeramba: "Yeramba"
 AST_yeramba_desc: "Wir bauten auf dem Erfolg australischer Fahrzeuge wie dem Sentinel auf und schufen mit der Yeramba eine durchschlagskräftige Neuheit für unser Arsenal. Diese auf einem Panzerchassis montierte 25-Pfünder-Panzerartillerie bietet eine mobile, vernichtende Feuerkraft gegen unsere Feinde."
 AST_alice_springs: "Alice Springs"
 AST_alice_springs_desc: "Das Outback ist groß - richtig groß. Im Herzen des Outbacks liegt die Kleinstadt Alice Springs, die als zentraler logistischer Knotenpunkt für Einsätze in ganz Australien dienen könnte. Wir sollten die Stadt ausbauen und einen Militärstützpunkt errichten, in dem wir unsere Truppen auf alle äußeren Bedingungen vorbereiten können."
 AST_australian_regular_army: "Australisches Berufsheer"
 AST_australian_regular_army_desc: "Wir lernten an den Stränden von Gallipoli, in den Wüsten Nordafrikas, in den Bergen Griechenlands und in den Dschungeln Südostasiens viel. Diese hart erkämpfte Erfahrung brachte eine Streitmacht hervor, die flexibler und anpassungsfähiger ist als jede andere."
 AST_no1_flying_training_school: "No. 1 Flying Training School"
 AST_no1_flying_training_school_desc: "Die Flugschule wurde 1921 zusammen mit der Gründung der Royal Australian Air Force ins Leben gerufen und im Lauf der Zeit immer wieder neu eröffnet und geschlossen, wenn es Bedarf an neuen Piloten gab. Da die globalen Spannungen immer weiter wachsen, sollten wir sie wieder eröffnen und eine neue Generation von Piloten ausbilden."
 AST_empire_air_training_scheme_taog: "Luftwaffenausbildungsplan des Empire"
 AST_empire_air_training_scheme_taog_desc: "Der Luftwaffenausbildungsplan des Empires bietet einem Mitglied des Commonwealth umfangreiche finanzielle Mittel und die nötige Erfahrung zur Ausbildung einer großen Anzahl von Piloten. Der Wettbewerb um die Ausrichtung dieses Programms ist hart, doch Australien und Kanada gehören zu den führenden Anwärtern. Wir reichten im Rahmen des Luftwaffenausbildungsplans des Empires unsere eigene Bewerbung ein."
 AST_volunteer_air_corps: "Volunteer Air Observer Corps"
 AST_volunteer_air_corps_desc: "Der australische Luftraum ist so riesig, dass ihn unsere eigenen Einheiten nicht abdecken können. Wir sollten uns daher auf lokale Freiwillige verlassen, die Tausende von Beobachtungsposten besetzen können, die über das ganze Land verteilt sind."
 AST_improved_ground_crews: "Verbesserte Bodentruppen"
 AST_improved_ground_crews_desc: "Hinter jedem Piloten steht ein riesiges Team von Bodenpersonal, das für die ordnungsgemäße Wartung der Flugzeuge, die Flugkoordination und den Stützpunktbetrieb verantwortlich ist, ganz zu schweigen von den Navigatoren, Bordschützen und Bombenschützen, die sie in der Luft begleiten. Wir müssen angemessene Ausbildungsmöglichkeiten schaffen, um sicherzustellen, dass unsere Luftwaffe mit maximaler Effizienz operiert."
 AST_advanced_pilot_training: "Verbesserte Pilotenausbildung"
 AST_advanced_pilot_training_desc: "Da Flugzeuge immer komplexer, schneller und fortschrittlicher werden, müssen sich auch die Fähigkeiten unserer Piloten entsprechend verbessern, um die neuen Technologien voll zu nutzen."
 AST_advanced_pilot_training_tt: "§G+10%§! Meisterschaftserhalt für §YLuftdoktrinen§!."
 AST_commonwealth_aircraft_corporation_taog: "Commonwealth Aircraft Corporation"
 AST_commonwealth_aircraft_corporation_taog_desc: "Das Interesse am Kampf um die Lufthoheit nimmt einen immer höheren Stellenwert ein, und wir müssen sicherstellen, dass wir nicht den Anschluss verlieren. Zivilisten, die sich für die Luftfahrt begeistern, und Erfinder haben das Potenzial der Luftfahrtindustrie bereits erkannt. Indem wir ihnen das nötige Startkapital zur Verfügung stellen, fördern wir diesen aufstrebenden Sektor und bauen ihn aus."
 AST_reestablish_central_flying_school: "Zentrale Flugschulen wiedereröffnen"
 AST_reestablish_central_flying_school_desc: "Indem wir neben der „No. 1 Flying Training School“ eine weitere Flugschule, die „Central Flying School“, aufbauen, werden wir den wachsenden Anforderungen einer modernen Luftwaffe gerecht. Da die weltweiten Spannungen immer weiter wachsen, müssen wir sicherstellen, dass unsere Luftwaffe über die erforderlichen Einrichtungen verfügt."
 AST_aerodrome_of_democracy_democracy: "Flugplatz der Demokratie"
 AST_aerodrome_of_democracy_fascism: "Flugplatz der Vorherrschaft"
 AST_aerodrome_of_democracy_communism: "Flugplatz der Gleichberechtigung"
 AST_aerodrome_of_democracy_neutrality: "Flugplatz der Stärke"
 AST_aerodrome_of_democracy: "[GET_AERODOME_NAME]"
 AST_aerodrome_of_democracy_desc: "Die australische Luftwaffe steht an der Spitze der Luftfahrttechnik und verdiente sich damit den Titel „[GET_AERODOME_NAME]“. Unsere Piloten liefern sich weltweit Luftkämpfe, während unsere Bomber einen tödlichen Schatten auf die Industrie unserer Feinde werfen."
 AST_government_aircraft_factories: "Staatliche Flugzeugfabriken"
 AST_government_aircraft_factories_desc: "Aufgrund unserer Entfernung zu Europa können wir uns in Kriegszeiten nicht darauf verlassen, unsere Flugzeuge von den Europäern zu beziehen. Es ist unerlässlich, dass wir eigene Produktionskapazitäten im Inland aufbauen, um Flugzeugzellen und Triebwerke nach unseren eigenen Vorgaben herzustellen."
 AST_death_from_down_under_taog: "Tod aus Down Under"
 AST_death_from_down_under_taog_desc: "Aus den entlegensten Winkeln der südlichen Hemisphäre bauten wir eine Luftwaffe auf, die ihresgleichen sucht. Unsere Flugzeuge sind weltweit im Einsatz und zeichnen sich besonders durch ihre Präzision und ihre Durchschlagskraft aus. Wo auch immer sich unsere Feinde verstecken mögen: Ihr Tod wird aus Down Under kommen."
 AST_ride_the_lightning: "Schnell wie der Blitz"
 AST_ride_the_lightning_desc: "Unsere Kampfpiloten bilden die Speerspitze unserer Luftstreitkräfte: Sie sind schnell, entschlossen und unerbittlich. Mit rasender Geschwindigkeit stürzen sie sich in die Schlacht, sichern uns die Lufthoheit, fangen feindliche Flugzeuge ab und sorgen dafür, dass unsere Streitkräfte jederzeit und überall Unterstützung aus der Luft erhalten."
 AST_the_gathering_storm: "Aufziehender Sturm"
 AST_the_gathering_storm_desc: "Am Horizont braut sich ein Sturm zusammen. Unsere Luftwaffe übt immer mehr Druck aus, kann den Feind dort treffen, wo er am verwundbarsten ist, und unterstützt unseren Vormarsch. Was als fernes Grollen beginnt, entlädt sich bereits nach nur kurzer Zeit als unerbittlicher Sturm der Zerstörung über unseren Feinden."
 AST_hear_the_thunder: "Sie bringen den Donner"
 AST_hear_the_thunder_desc: "Can you hear, can you hear the thunder? Von Down Under aus projizieren unsere strategischen Bomber die Macht Australiens in alle Welt. Wenn der Himmel dröhnt und der Boden bebt, werden unsere Feinde wissen, dass der Sturm gekommen ist und dass er ihnen die Vernichtung bringt."
 AST_department_of_aircraft_production: "Abteilung für den Flugzeugbau"
 AST_department_of_aircraft_production_desc: "Der rasche Ausbau der Royal Australian Air Force belastete unsere Produktionskapazitäten erheblich. Wir müssen ehrgeiziger denken und unsere industrielle Basis ausbauen, um der Nachfrage gerecht zu werden. Nur so stellen wir sicher, dass unsere Flugzeuge den Himmel verdunkeln."
 AST_royal_australian_navy: "Royal Australian Navy"
 AST_royal_australian_navy_desc: "Die Royal Australian Navy, die nach der Staatsgründung durch den Zusammenschluss der Kolonialflotten entstand, war im Ersten Weltkrieg auf fast allen Kriegsschauplätzen im Einsatz. Aufgrund knapper Finanzmittel musste sie jedoch stark verkleinert werden. Da die weltweiten Spannungen immer weiter wachsen, ist es an der Zeit, dass die Flotte wieder auf die Meere zurückkehrt."
 AST_coast_watchers: "Küstenbeobachter"
 AST_coast_watchers_desc: "Während sich der Großteil unserer Streitkräfte weiterhin auf das Festland konzentriert, bilden unsere nördlichen Zugänge ein wichtiges Frühwarnnetzwerk. Indem wir auf diesen abgelegenen Inseln einen lokalen Geheimdienst errichten, spüren wir feindliche Luft- und Seestreitkräfte auf, lange bevor sie die australische Küste bedrohen."
 AST_marines: "Marineinfanterie"
 AST_marines_desc: "Als größte Insel in einem Meer von Inseln müssen wir sicherstellen, dass unsere amphibischen Fähigkeiten gut genug sind, um unsere Macht über unsere Küsten hinaus zu projizieren. Sollten wir von der Verteidigung in die Offensive wechseln müssen, werden unsere Streitkräfte um Insel-zu-Insel-Einsätze nicht herumkommen."
 AST_naval_auxiliary_patrol_taog: "Marinehilfspatrouille"
 AST_naval_auxiliary_patrol_taog_desc: "Wenn unsere Marine anderweitig beschäftigt ist, müssen wir uns auf engagierte Freiwillige vor Ort verlassen, um unsere Häfen und Küstenanlagen zu schützen. Dank ihrer genauen Kenntnis der örtlichen Gewässer sind sie von unschätzbarem Wert, und niemand würde je vermuten, dass ein lokaler Fischer in unseren Diensten steht."
 AST_cockatoo_island_shipyards_taog: "Werften auf den Cockatoo Islands"
 AST_cockatoo_island_shipyards_taog_desc: "Die Werften auf den Cockatoo Islands dienen dem Empire bereits seit Langem als zentrales Reparatur- und Wartungszentrum und unterstützen die Einsätze der Royal Navy im Ausland. Als Eckpfeiler der Royal Australian Navy müssen wir ihre Kapazitäten ausbauen, um den wachsenden Anforderungen unserer Flotte gerecht zu werden."
 AST_kangaroo_point_dry_dock_taog: "Trockendock Kangaroo Point"
 AST_kangaroo_point_dry_dock_taog_desc: "Auch wenn es sich bei Evans Deakin and Company in erster Linie um ein Ingenieursbüro handelt, erkannte das Unternehmen angesichts der zunehmenden globalen Spannungen zutreffend, dass weitere Schiffbaukapazitäten benötigt werden und Kangaroo Point ein geeigneter Standort dafür wäre. Wir sollten diesem Unternehmen die Übernahme des Grundstücks erleichtern, um das weitere Wachstum unserer Flotte voranzutreiben."
 AST_scrap_iron_flotilla_taog: "Scrap Iron Flotilla"
 AST_scrap_iron_flotilla_taog_desc: "Auch wenn Kritiker sie oft als veraltet und schrottreif abtun, ließen sich einige unserer älteren Zerstörer zu einer einheitlichen Formation zusammenfassen. Ihnen mag das Prestige einer modernen Flotte fehlen, doch diese Schiffe können für eine findige Nutzung dessen stehen, was wir bereits besitzen."
 AST_cruising_for_a_bruising: "Auf Kollisionskurs"
 AST_cruising_for_a_bruising_desc: "Kreuzer werden von unserer Marine bereits seit Langem geschickt eingesetzt, und diese Tradition ist es wert, dass man sie fortführt. Unsere Kreuzer sind schnell, vielseitig und schlagkräftig und werden sich bald schon weltweit einen Namen machen. Jeder Feind, der ihnen in die Quere kommt, hat eine harte Lektion zu lernen."
 AST_strike_from_down_under: "Von Down Under aus angreifen"
 AST_strike_from_down_under_desc: "Unter den Wellen gleiten sie leise dahin, und wenn sie sie finden, sind deine Schiffe dahin. Hast du schon von ihnen gehört, von den U-Booten aus Down Under? Flieh besser schnell, denn sonst nehmen sie dich auseinander. Yee-aaah!"
 AST_hmas_sydney: "HMAS Sydney"
 AST_hmas_sydney_desc: "Das Zeitalter der Schlachtschiffe ist vorbei. Die Zukunft der Meere liegt in der Luft darüber, und Australien muss dafür sorgen, nicht zurückzufallen. Wir haben unsere Marine wiederaufgebaut und modernisiert und sind endlich bereit, den letzten Schritt zu gehen: einen Flugzeugträger zu bekommen, der die australische Marine für die nächsten Generationen prägen wird."
 AST_conscription_level_allowed_tt: "Politischer Wille für eine erweiterte Wehrpflicht (Mannstärke-Symbol an Schwerpunkten)"
 AST_conscription_level_allowed_limited_conscription_tt: "Schaltet eine zusätzliche Stufe im §YWehrpflichtgesetz§! frei, die eine §Ybegrenzte§! Wehrpflicht erlaubt"
 AST_conscription_level_allowed_extensive_conscription_tt: "Schaltet eine zusätzliche Stufe im §YWehrpflichtgesetz§! frei, die eine §Yumfangreiche§! Wehrpflicht erlaubt"
 AST_conscription_level_allowed_service_by_requirement_tt: "Schaltet eine zusätzliche Stufe im §YWehrpflichtgesetz§! frei, die eine Wehrpflicht §Ynach Bedarf§! erlaubt"
 AST_conscription_level_allowed_all_adults_serve_tt: "Schaltet eine zusätzliche Stufe im §YWehrpflichtgesetz§! frei, die eine Wehrpflicht für §Yalle Erwachsenen§! erlaubt"
 AST_conscription_level_allowed_scraping_the_barrel_tt: "Schaltet eine zusätzliche Stufe im §YWehrpflichtgesetz§! frei, die §YLetztes Aufgebot§! erlaubt"
 AST_conscription_law_so_far: "[CONSCRIPTION_LAW_SO_FAR]"
