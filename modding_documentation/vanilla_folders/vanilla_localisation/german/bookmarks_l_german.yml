 RAJ_BLITZKRIEG_DESC: "Britisch-Indien ist das Kronjuwel des Empires, eine seltsame Kombination aus imperialer Macht und imperialer Machtlosigkeit. Eine winzige Elite britischer Beamter herrscht über einen riesigen Subkontinent mit hunderten Millionen Untertanen. Aus deren Reihen rekrutiert sich die Indische Armee, die im Ersten Weltkrieg tapfer gekämpft hat.\n\nIndische Anführer hatten gehofft, dass die Opfer des letzten Krieges ihrem Land helfen würden, die Unabhängigkeit von Großbritannien zu erlangen, doch bisher war diese Hoffnung vergebens. Nun, da ein neuer Krieg droht, glauben viele, die Zeit sei gekommen, sich diese Freiheit zu nehmen – mit allen Mitteln."
 CZE_GATHERING_STORM_DESC: "Im Ersten Weltkrieg haben tschechische Truppen in ganz Europa an der Seite der Entente gekämpft, um Anerkennung für ihre Nation zu gewinnen. Ihre Bemühungen waren erfolgreich und die Tschechoslowakei erhob sich aus der Asche des österreichisch-ungarischen Reichs. \n\nSeit ihrer explosiven Geburt als Staat hat die Tschechoslowakei die \"Kleine Entente\" mit Jugoslawien und Rumänien gebildet, um Ungarns Bemühungen zu unterdrücken, das österreichisch-ungarische Reich wiederherzustellen. Doch Deutschland erstarkt zusehends und die politische Landschaft Europas verändert sich rasant."
 HUN_GATHERING_STORM_DESC: "Ungarn, die eine Hälfte des einstigen österreichisch-ungarischen Reichs, wurde von der siegreichen Entente nach dem Ersten Weltkrieg als besiegter Feind behandelt. Im Vertrag von Trianon verlor das Land fast zwei Drittel seines Territoriums. Millionen von ethnischen Ungarn lebten plötzlich außerhalb der Grenzen ihres Heimatlandes, dessen Wirtschaft am Boden war. Strenge Einschränkungen bei der Wiederbewaffnung sollten sicherstellen, dass Ungarn nie wieder den Frieden in Europa bedrohen konnte. \n\nDoch das politische Klima in Europa hat sich verändert. Vielleicht ist es an der Zeit, die Ungerechtigkeiten zu beheben und den einstigen Glanz der Nation wiederherzustellen."
 ROM_GATHERING_STORM_DESC: "Rumänien stand auf der Siegerseite des Ersten Weltkriegs und gewann dadurch neues Territorium und neue Bürger ... von denen jedoch nicht alle Rumänen waren. Um sich gegen die Rachegelüste der Länder zu schützen, die Gebiet abtreten mussten, hat Rumänien ein Netz von Bündnissen auf dem gesamten Balkan aufgebaut. In jüngsten Jahren hat sich das Land jedoch fast ausschließlich mit inneren Angelegenheiten beschäftigt. Die Regierung von König Karl II. hat diese Bündnisse einschlafen lassen. \n\nDie politische Lage in Europa verändert sich, und Rumänien könnte plötzlich ganz allein dastehen ... allein und verwundbar."
 HUN_BLITZKRIEG_DESC: "Ungarn, die eine Hälfte des einstigen österreichisch-ungarischen Reichs, wurde von der siegreichen Entente nach dem Ersten Weltkrieg als besiegter Feind behandelt. Im Vertrag von Trianon verlor das Land fast zwei Drittel seines Territoriums. Millionen von ethnischen Ungarn lebten plötzlich außerhalb der Grenzen ihres Heimatlandes, dessen Wirtschaft am Boden war. Strenge Einschränkungen bei der Wiederbewaffnung sollten sicherstellen, dass Ungarn nie wieder den Frieden in Europa bedrohen konnte. \n\nDoch das politische Klima in Europa hat sich verändert. Vielleicht ist es an der Zeit, die Ungerechtigkeiten zu beheben und den einstigen Glanz der Nation wiederherzustellen."
 ROM_BLITZKRIEG_DESC: "Rumänien stand auf der Siegerseite des Ersten Weltkriegs und gewann dadurch neues Territorium und neue Bürger ... von denen jedoch nicht alle Rumänen waren. Um sich gegen die Rachegelüste der Länder zu schützen, die Gebiet abtreten mussten, hat Rumänien ein Netz von Bündnissen auf dem gesamten Balkan aufgebaut. In jüngsten Jahren hat sich das Land jedoch fast ausschließlich mit inneren Angelegenheiten beschäftigt. Die Regierung von König Karl II. hat diese Bündnisse einschlafen lassen. \n\nDie politische Lage in Europa verändert sich, und Rumänien könnte plötzlich ganz allein dastehen ... allein und verwundbar."
 YUG_GATHERING_STORM_DESC: "Jugoslawien wurde geboren, nachdem der neue Staat der Serben, Kroaten und Slowenen sich 1922 mit dem zuvor unabhängigen Königreich Serbien zusammenschloss. Ursprünglich trat Jugoslawien sowohl der Kleinen Entente als auch der Balkanentente bei, um seine Unabhängigkeit zu sichern. Wachsender innerer Druck durch Nationalisten und äußerer Druck durch Italien und Deutschland haben jedoch für gewaltige Umwälzungen gesorgt ... Jugoslawien überdenkt seine politische und strategische Position."
 YUG_BLITZKRIEG_DESC: "Jugoslawien wurde geboren, nachdem das neue Königreich der Serben, Kroaten und Slowenen sich 1922 mit dem zuvor unabhängigen Königreich Serbien zusammenschloss. Ursprünglich trat Jugoslawien sowohl der Kleinen Entente als auch der Balkanentente bei, um seine Unabhängigkeit zu sichern. Wachsender innerer Druck durch Nationalisten und äußerer Druck durch Italien und Deutschland haben jedoch für gewaltige Umwälzungen gesorgt ... Jugoslawien überdenkt seine politische und strategische Position."
 CHI_GATHERING_STORM_DESC: "Nach der Revolution, bei der die letzten Qing-Kaiser abgesetzt wurden, muss die junge Chinesische Republik ums Überleben kämpfen. Kriegsherren herrschen über die meisten Randgebiete des Landes. Im Herzen der Nation haben die Kommunisten sich in einem entlegenen Gebirgstal eine Basis eingerichtet. Unmittelbar hinter der Grenze haben die Japaner eine Marionettenregierung unter dem letzten Chinesischen Kaiser eingerichtet und wollen das Land unter seiner Führung wiedervereinen.\n\nVon unzähligen Feinden bedroht muss die Regierung von Chiang Kai-Shek schwierige Entscheidungen treffen, wenn sie überleben und alleine über China herrschen will."
 PRC_GATHERING_STORM_DESC: "Vor gerade einmal zwei Jahren stand die Kommunistische Partei Chinas vor der völligen Ausrottung. Um zu überleben, begab sie sich auf eine epische Reise, die als der Lange Marsch in die Geschichte eingehen sollte. Nur ein Bruchteil der Armee überlebte diesen gnadenlosen Marsch, zudem gibt es keine nennenswerte Industrie. Die Erfolgsaussichten im Chinesischen Bürgerkrieg sind daher äußerst gering.\n\nMit der Zeit kann aber vielleicht die Bevölkerung für die kommunistische Sache gewonnen werden, neue Armeen können ausgehoben werden, neue Basen errichtet ... und wenn die Zeit reif ist, wird der revolutionäre Kampf wieder erneuert werden. Erneuert und gewonnen!"
 CHI_BLITZKRIEG_DESC: "Die Armeen von Chiang Kai-Shek haben sich im Krieg gegen die Japaner zwei Jahre lang aufgerieben und konnten den Angriff dennoch nicht aufhalten. Der Feind hat die reichsten Gebiete des Landes überrannt. Die westlichen Demokratien haben kaum Hilfe angeboten und die Kommunisten scheinen nicht gewillt, dem Feind im offenen Kampf gegenüberzutreten.\n\nDer Krieg droht sich noch weiter auszubreiten, das Schlimmste steht wohl noch bevor. Doch da der japanische Vormarsch durch die schiere Größe des Landes verlangsamt wird, richten sie ihre Blicke vielleicht in andere Richtungen. Neue Bündnisse könnten das Blatt noch wenden ..."
 PRC_BLITZKRIEG_DESC: "Mit einem gnadenlosen Angriff der Japaner konfrontiert sind die Nationalisten und die Kommunisten einen widerwilligen Waffenstillstand eingegangen. Beide Seiten wissen genau, dass diese Vereinte Front nicht von Dauer sein kann. Die kommunistische Basis in Yan‘an bildet nun die Front im Krieg gegen die Japaner.\n\nDie Kommunisten müssen gut mit ihren Ressourcen wirtschaften, wenn sie überleben wollen. Verluste im Kampf gegen Japan werden doppelt zu spüren sein, wenn die Zeit für den Krieg gegen die Nationalisten gekommen ist. Vielleicht zählt die Regierung von Chiang Kai-Shek genau darauf ..."
 MAN_GATHERING_STORM_DESC: "Seit er mit sechs Jahren vom Drachenthron gestoßen wurde, wartet Puyi, der letzte chinesische Kaiser, geduldig ab. Sein ehemaliges Reich hat sich im chinesischen Bürgerkrieg zwar selbst zerfetzt, doch Puyi hat in Japan neue Verbündete gefunden.\n\nFür Puyi war die Gründung des Reichs Mandschukuo im Jahr 1932 nur der erste Schritt auf dem Weg, sein Erbrecht zurückzuerobern. Vorerst ist er auf die japanische Armee angewiesen, um seine Herrschaft aufrechtzuerhalten, doch mit der Zeit ergibt sich vielleicht eine Gelegenheit, die Fesseln der Knechtschaft abzuwerfen und seine Bestimmung zu verwirklichen ..."
 MAN_BLITZKRIEG_DESC: "Seit er mit sechs Jahren vom Drachenthron gestoßen wurde, wartet Puyi, der letzte chinesische Kaiser, geduldig ab. Sein ehemaliges Reich hat sich im chinesischen Bürgerkrieg zwar selbst zerfetzt, doch Puyi hat in Japan neue Verbündete gefunden.\n\nFür Puyi war die Gründung des Reichs Mandschukuo im Jahr 1932 nur der erste Schritt auf dem Weg, sein Erbrecht zurückzuerobern. Vorerst ist er auf die japanische Armee angewiesen, um seine Herrschaft aufrechtzuerhalten, doch mit der Zeit ergibt sich vielleicht eine Gelegenheit, die Fesseln der Knechtschaft abzuwerfen und seine Bestimmung zu verwirklichen ..."
 MAN_TSR_GATHERING_STORM_DESC: "Das Kaiserreich der Mandschurei steht auf wackeligen Beinen. Es wurde 1932 gegründet, um die Herrschaft Japans über die Mandschurei zu legitimieren, und man entschied sich dafür, Puyi zum Kaiser des neuen Staates zu ernennen.\n\nDoch wird Puyi weiterhin im Hintergrund agieren, während der Eintrachtverband und die japanische Armee über das Land herrschen? Oder aber wird er versuchen, seine Macht zu festigen, und dabei möglicherweise gegen die Banditen verlieren, die ebenfalls danach streben?"
 MAN_TSR_BLITZKRIEG_DESC: "Mandschukuo, ein einst von der japanischen Armee aus dem Norden Chinas herausgelöstes Restgebiet, das sich durch die Ernennung von Puyi zum Kaiser an jeden Strohhalm der Legitimität klammerte, wurde vollständig in die Großostasiatische Wohlstandssphäre integriert. Die Frage ist nun, ob der Staat in den Händen des Eintrachtverbands bleiben wird oder ob Puyi seine Macht festigen kann."
 WARLORDS_GATHERING_STORM_DESC: "Die Schwäche der Zentralregierung könnte sich noch als Gelegenheit für einen ausreichend ehrgeizigen Mann erweisen, an die Macht zu kommen. Örtliche Anführer in den Randgebieten des Landes haben eigene kleine Lehnsgüter aufgebaut und schweren sich wenig um die Befehle der Zentralregierung. \n\nEin Krieg droht am Horizont, und jeder dieser Kriegsherren steht vor einer schweren Entscheidung – soll er mit der Zentralregierung zusammenarbeiten oder ein Bündnis mit den Kommunisten eingehen? Beide Optionen versprechen einen Sitz am Tisch der Macht, aber es gibt auch noch eine dritte Möglichkeit ... sich ganz China allein unter den Nagel zu reißen."
 WARLORDS_BLITZKRIEG_DESC: "Der Krieg gegen Japan hat die chinesischen Kriegsherren gezwungen, eine Seite zu wählen. Zweifellos wird dieses Bündnis jedoch nicht lange Bestand haben. Eines Tages verliert es seinen Nutzen – und dann ist das Spiel wieder für jeden Mann eröffnet, der ehrgeizig und skrupellos genug ist, sich um den Titel des Herrschers über China zu bewerben."
 MEXICO_GATHERING_STORM_DESC: "Nach dem Sturz des Despoten Porfirio Díaz herrschte in Mexiko zwei Jahrzehnte lang Bürgerkrieg. Zentralisten kämpften gegen Regionalisten, Bauern und Sozialisten lehnten sich gegen die Hacienda-Besitzer auf und aus den Annalen der Aufklärung gingen Dispute über das Verhältnis zwischen Staat und Religion hervor. In Mexiko herrschte das pure Chaos.\n\nDie weltliche Regierung beharrt darauf, diese Schlachten gewonnen zu haben, doch sie sitzt auf einem Thron aus Schutt. Nach dem Wiederaufbau Mexikos kristallisiert sich vielleicht ein anderer Sieger heraus."
 MEXICO_BLITZKRIEG_DESC: "Die Regierung von Lázaro Cárdenas hat sich als stärkere Kraft des positiven gesellschaftlichen Wandels erwiesen als die seines Vorgängers Präsident Plutarco Calles, der nun ins Exil nach Amerika verbannt wurde. Nachdem die wirtschaftliche Lage stabilisiert wurde und die ausländischen Ölunternehmen unter die Aufsicht des Staates gestellt wurden, kann die mexikanische Regierung den Blick nach außen richten. Amerika ist an vielen Fronten mit Feinden konfrontiert und wird die Verstaatlichung von Standard Oil vermutlich verzeihen. Doch es könnte noch lukrativer sein, sich mit diesen Feinden anzufreunden ..."
 NETHERLANDS_GATHERING_STORM_DESC: "Die niederländische Regierung beobachtet die wachsenden globalen Spannungen mit großer Besorgnis. Die Konjunktur in den Niederlanden lahmt, es gibt eine starke Friedensbewegung und das Land ist derart entschlossen, seine Neutralität zu wahren, dass es sogar potenzielle Verbündete vertreibt – kurz, die Niederländer können keine vernünftige Verteidigung vorbereiten.\n\nGleichzeitig aber sind die Niederlande ein wichtiger Zugangspunkt für den Handel auf dem Kontinent, weshalb sowohl die Briten als auch die Deutschen auf eine „Kooperation“ mit den Niederlanden aus sind. Lehnen diese ab, könnte das Feindseligkeiten auslösen. Ein Rückzug in die Kolonien ist vielleicht die einzige Möglichkeit, eine solche Invasion zu vermeiden ..."
 NETHERLANDS_BLITZKRIEG_DESC: "Ein Krieg zwischen Deutschland und den anderen europäischen Großmächten scheint unausweichlich. Und obwohl die Niederlande erneut alles auf die Karte ihrer Neutralität setzen, überlegt die Regierung, mit den Nachbarn im Süden geheime Stabspläne für mögliche Feindseligkeiten vorzubereiten.\n\nDie Armee wurde mobilisiert und die Arbeiten an der niederländischen Verteidigungslinie wurden intensiviert, um das Land möglichst gut darauf vorzubereiten, sich gegen eine Verletzung seiner Souveränität zu verteidigen. Sollte das fehlschlagen, gibt es immer noch die Kolonien ..."
 SPAIN_GATHERING_STORM_DESC: "In den ersten fünf Jahren ihres Bestehens musste die junge Zweite Spanische Republik bereits Streiks, einen versuchten Militärputsch und einen großen revolutionären Aufstand durchstehen. Sie hat diese Herausforderungen zu überlebt, doch die spanische Gesellschaft leidet weiterhin stark unter der politischen Polarisierung und der Gewalt zwischen Anarchisten, Kommunisten und Falangisten.\n\nBeide Seiten setzen große Hoffnungen in die bevorstehenden Wahl 1936, es ist jedoch unwahrscheinlich, dass ein Sieg einer der beiden Seiten wirklich Stabilität bringen würde. Und während die Gewalt sich fortsetzt, lauert das Militär und schmiedet Pläne ..."
 SPAIN_BLITZKRIEG_DESC: "Der Bürgerkrieg, der das Land in den letzten drei Jahren verwüstet hat, ist endlich beendet. Unter der Führung Francos müssen die Sieger nun für den Wiederaufbau Spaniens sorgen, den verbleibenden Widerstand ausrotten und die durch den Krieg hervorgerufenen oder verstärkten Spaltungen kitten.\n\nDafür bleibt ihnen jedoch nicht viel Zeit, denn die Welt als Ganzes steuert weiterhin unweigerlich auf einen gewiss noch viel größeren und blutigeren Krieg hin. Wenn Spanien in diesem kommenden Konflikt nicht nur seine Stellung behaupten, sondern auch die sich bietenden Chancen nutzen will, muss es unverzüglich seine Industrie und sein Militär entsprechend vorbereiten."
 PORTUGAL_GATHERING_STORM_DESC: "Seit Salazar 1932 an die Macht gekommen ist, hat Portugal die instabile Periode der Ersten Republik hinter sich gelassen. Seine Vision eines starken portugiesischen Staates, der finanziell autonom und politisch unabhängig von den Großmächten ist, hat zur Gründung des Estado Novo geführt. Dadurch wurden die Grundlagen für den Ausbau der portugiesischen Industrie und die Modernisierung der Armee gelegt. \n\nJetzt muss Portugal entscheiden, wie es in die Zukunft schreitet, während im benachbarten Spanien die politische und gesellschaftliche Instabilität immer weiter zunimmt und die internationalen Spannungen sich hoffnungslos verschärfen ..."
 PORTUGAL_BLITZKRIEG_DESC: "Die konservative und nationalistische Regierung von Salazar hat es Portugal erlaubt, im Spanischen Bürgerkrieg neutral zu bleiben und gleichzeitig aktiv die Nationalisten zu unterstützen und so die Niederlage der Kommunisten und Anarchisten sicherzustellen. \n\nNachdem auf der iberischen Halbinsel nun endlich Stabilität herrscht, ist es an der Zeit, im Ausland nach potenziellen Verbündeten zu suchen und zu überlegen, welche Rolle Portugal im wohl unvermeidlichen Weltkonflikt spielen soll."
 LIT_GATHERING_STORM_DESC: "Polen giert danach, Litauen in einer neuen Union zu fesseln; die Sowjets erkennen Litauens Recht auf Selbstbestimmung nicht an; und im Memelland wird die Gefahr durch die Nazis immer größer. All diese Faktoren haben dazu geführt, dass ein Veteran aus dem Unabhängigkeitskrieg sich zum Verteidiger der Stabilität und Unabhängigkeit der litauischen Nation erklärt hat. Antanas Smetona verfügt jedoch nur über begrenzte Ressourcen, sein Regime ist daher sehr instabil. Der faschistische Kampfbund „Eiserner Wolf“ streift durch die ländlichen Gegenden, erzürnt ob der Verhaftung seines Anführers Augustinas Voldemares. Ein Krieg naht, und Litauen muss alles tun, um sein Volk zu verteidigen. Koste es, was es wolle."
 LIT_BLITZKRIEG_DESC: "Die Bühne ist bereitet. Antanas Smetona hat sich zum Diktator aufgeschwungen. Der Traum, eine Litauische Republik wiederherzustellen, ist außer Reichweite. Mit den Sowjets wurde vereinbart, dass Vilnius wieder an Litauen übergeht, wenn Polen aufgeteilt wird. Aber inwieweit kann Smetona Stalin und seiner gierigen Kriegsmaschine vertrauen, die litauische Souveränität wirklich zu ehren?"
 LAT_GATHERING_STORM_DESC: "Seit dem Maiputsch sind zwei Jahre vergangen, und Lettland befindet sich weiterhin in einem höchst ungewissen Zustand. Kārlis Ulmanis, der einst als Lettlands Premierminister diente, geriert sich nun als Diktator. Befürworter der Demokratie äußern scharfe Kritik an diesem Angriff auf die lettische Freiheit. Das faschistische Donnerkreuz, auf Lettisch Pērkonkrust genannt, wurde durch die Verhaftung seines Anführers Gustav Celmiņš aufgestachelt. Wenn die Diktatur diese Gefahr nicht schnell auslöscht, droht in Lettland ein Bürgerkrieg.\n\nLettland liegt eingekesselt zwischen der Gefahr im Osten und der im Westen und muss einen Drahtseilakt zwischen Sieg und Auslöschung bewältigen."
 LAT_BLITZKRIEG_DESC: "Viel zu lange hat Lettland sich vom sowjetischen Handel abhängig gemacht. Nun muss die Diktatur den Preis dafür bezahlen. Die Sowjetunion und das Deutsche Reich haben ihre Zähne gezeigt und sitzen Ulmanis im Nacken. Eine schnelle Mobilmachung ist nötig, wenn die lettische Unabhängigkeit gewährt werden soll. Es sei denn, die Diktatur zieht es vor, in die Knie zu gehen und die Sowjets um Gnade anzuflehen ..."
 EST_GATHERING_STORM_DESC: "Angesichts der kommunistischen Gefahr im Osten und der faschistischen im Süden haben Konstantin Päts und die Isamaaliit die vollständige Kontrolle über die Nation an sich gerissen, um die Zukunft Estlands zu sichern. Eine Gruppe von Veteranen aus dem estnischen Unabhängigkeitskrieg hat sich zum Estnischen Bund der Freiheitskämpfer zusammengeschlossen, auf Estnisch kurz \"Vaps\": Rechte Populisten mit dem Ziel, den Neutralen die Kontrolle über das Land zu entreißen.\n\nDie Zukunft Estlands bleibt ungewiss. Gelingt es Päts, den Frieden zu wahren und eine Ära des Schweigens einzuläuten, oder übernehmen die Freiheitskämpfer die Kontrolle und gründen einen neuen estnischen Staat?"
 EST_BLITZKRIEG_DESC: "Estland ist gefangen zwischen der Roten Gefahr im Osten und der See - und steht zu allem Überfluss ohne die Hilfe seiner früheren Verbündeten da. Die Kapitulation scheint unvermeidlich, doch die estnische Nation könnte überleben. Entweder als Sklave der UdSSR oder als Widerstandsbewegung, die aus den Wäldern heraus kämpft."
 BUL_GATHERING_STORM_DESC: "Seit dem Befreiungskrieg von 1878 und der Ablehnung des Friedens von San Stefano durch die westlichen Demokratien hat Bulgarien eine lange Geschichte des Konflikts und Verrats auf dem Balkan durchlebt. Als besiegtes Mitglied der Mittelmächte im Ersten Weltkrieg musste Bulgarien große Gebietsverluste hinnehmen, und wurde durch den Vertrag von Neuilly-sur-Seine mit strengen wirtschaftlichen Sanktionen und Militärbeschränkungen belegt. \n\nAngesichts der politischen und gesellschaftlichen Veränderungen in Europa ist es nun aber an der Zeit, dass Bulgarien seinen Pfad selbst wählt und seinen rechtmäßigen Platz auf dem Balkan findet."
 BUL_BLITZKRIEG_DESC: "In den letzten Jahren hat Zar Boris seine Macht konsolidiert, die verschwörerische Organisation Zveno aufgelöst und die bulgarische Außenpolitik an Deutschland ausgerichtet. In den jüngsten Verhandlungen mit den Balkannachbarn hat Großbritannien die Militärbeschränkungen aufgehoben, mit denen das Land nach dem Ersten Weltkrieg belegt wurde. Die Briten hoffen, dadurch zu verhindern, dass Bulgarien sich den Achsenmächten annähert. \nNun will der Zar die in der Vergangenheit verlorenen Territorien zurückgewinnen, ohne das Land in einen neuen Konflikt zu ziehen. Angesichts der wachsenden internationalen Spannungen in Europa bleibt jedoch abzuwarten, was die Zukunft für Bulgarien bringen wird ..."
 GRE_GATHERING_STORM_DESC: "Griechenland ist eine Nation in der Krise. Royalisten und Republikaner streiten erbittert um die Seele des Landes, was 1935 zur Abschaffung der Zweiten Hellenischen Republik führte. Der König, ein ausländischer Autokrat, spaltet das Land weiterhin, seine Zukunft ist ungewiss. \n\nGriechenland war von innenpolitischen Streitereien abgelenkt, weshalb das bösartige und revanchistische Bulgarien im Norden erstarken konnte, während im Osten der langjährige Feind und neue Verbündete Griechenlands, die Türkei, eine politische Metamorphose durchmacht. Ganz zu schweigen von dem Ungeheuer, das auf der anderen Seite der Adria gerade erwacht ..."
 GRE_BLITZKRIEG_DESC: "Unter der starken Hand des Diktators Ioannis Metaxas wurde in Griechenland die Stabilität wiederhergestellt. Dank des Vierjahresplans konnte Griechenlands industrielle Basis in den letzten Jahren gewaltig wachsen, und die Schulden des Landes sind zwar weiterhin exorbitant hoch, es erscheint nun aber erstmals möglich, sie in den Griff zu bekommen. \n\nLeider könnten die starke Regierung und die vernünftige Wirtschaftspolitik aber umsonst sein, die Nation schwebt in größter Gefahr. Ein großer, schrecklicher Krieg droht der Welt, und trotz Metaxas' Beteuerungen, dass Griechenland in einem solchen Konflikt seine Neutralität wahren werde, liegt die Entscheidung letztlich vielleicht nicht bei ihm ..."
 TUR_GATHERING_STORM_DESC: "Aus der Asche des Osmanischen Reichs wurde die Türkische Republik geboren. Die türkische Unabhängigkeit wurde 1923 durch Blut und Patronen errungen, und auch wenn der Kampf rechtschaffen war, leidet das türkische Volk noch heute unter den hohen Kosten. \n\nReligiöse Konservative haben das Hinterland im Griff und widersetzen sich vehement den landesweiten Modernisierungsbemühungen, während im Osten des Landes kurdische Nationalisten Chaos säen. Der lionisierte Präsident Mustafa Kemal Atatürk muss das Land vereinen oder die Zügel an ein Staatsoberhaupt abgeben, das dazu fähig ist. Und zwar schnell, denn in Europa braut sich eine Krise zusammen ..."
 TUR_BLITZKRIEG_DESC: "Der Vater der Türken, Mustafa Kemal Atatürk, ist gestorben. Die Türkei trauert. Neues Staatsoberhaupt ist der angesehene Staatsmann İsmet İnönü. Er erbt ein zersplittertes Land, dessen Spaltungen durch den Tod des wegweisenden Führers Atatürk nur umso deutlich zu Tage treten. \n\nNeben den innenpolitischen Herausforderungen sieht sich İnönü aber auch noch mit einem drohenden Krieg in Europa konfrontiert, der noch verheerender sein könnte als der Erste Weltkrieg es war. Atatürk betonte immer wieder den Leitsaz \"Frieden im Lande und Frieden auf der Welt\". Kann İnönü in diesen turbulenten Zeiten wirklich den Frieden wahren?"
 ETH_GATHERING_STORM_DESC: "Die Geschichte Äthiopiens und die der kaiserlichen Dynastie reicht Jahrhunderte zurück. Obgleich Haile Selassie große Fortschritte bei der Modernisierung des Reiches machte, wurde dieser Prozess unterbrochen, als Äthiopien zum zweiten Mal innerhalb von 40 Jahren von Italien angegriffen wurde. Die Lage ist düster, doch wenn das Reich an einem Strang zieht, kann es die Invasoren womöglich erneut aufhalten.\n\nWenn Äthiopien unabhängig bleiben soll, muss ganz Ostafrika ein für alle Mal vom Joch der europäischen Herrschaft befreit werden."
 AFA_GATHERING_STORM_DESC: "Das Volk der Afar lebt seit Langem in den Weiten der Danakil-Wüste, die sich von Dschibuti im Osten bis nach Äthiopien im Westen erstrecken. In jüngster Zeit gewann Italien jedoch zunehmend Einfluss in der Region, was Mohammed Yayyo dazu veranlasste, Benito Mussolini gegenüber Haile Selassie zu bevorzugen.\n\nDa der zweite italienisch-äthiopische Krieg in vollem Gange ist, muss in naher Zukunft eine Entscheidung getroffen werden: Liegt die Zukunft der Afar bei Italien oder sollen sie ihre Unabhängigkeit bewahren?"
 FIN_GATHERING_STORM_DESC: "Finnland ist ein junges Land, das nach einem blutigen Bürgerkrieg im Jahr 1917 seine Unabhängigkeit von Russland erlangte. Die Narben des Krieges sind noch frisch, und die Koalitionsregierung, die über das Land herrscht, tut sich noch immer schwer damit, zusammenzuarbeiten. Die Sowjetunion erhebt Ansprüche auf Territorien rund um Leningrad, und Finnland ist auf einen möglichen Konflikt schlecht vorbereitet, kann jedoch auf eine lange Geschichte militärischer Tapferkeit und Entschlossenheit zurückblicken und die Soldaten sind ihrem Land gegenüber äußerst loyal.\n\nAngesichts der zunehmenden Spannungen und eines drohenden Konflikts steht die Zukunft Finnlands auf dem Spiel."
 FIN_BLITZKRIEG_DESC: "Finnland liegt zwischen der Sowjetunion und Nazi-Deutschland, und die Spannungen zwischen den beiden Mächten nehmen zu. Die Verhandlungen mit der Sowjetunion sind gescheitert und die finnische Regierung steht nun vor der schwierigen Entscheidung, wie sie die Souveränität ihres Landes schützen soll.\n\nEs wurden Anstrengungen unternommen, um die finnische Verteidigung zu stärken, doch die Armee ist immer noch schlecht ausgerüstet und eine Luftwaffe oder Marine praktisch nicht existent. Trotzdem sind die Finnen aufgrund ihres ausgeprägten Nationalstolzes und ihrer militärischen Tapferkeit fest entschlossen, ihre Unabhängigkeit zu verteidigen."
 SWE_GATHERING_STORM_DESC: "Obwohl Schweden im Ersten Weltkrieg neutral blieb, litt die Bevölkerung wegen der britischen Blockadeversuche gegen Deutschland stark. In Zeiten, in denen die Spannungen auf dem Kontinent zunehmen, befürchtet das schwedische Volk, dass es erneut gezwungen sein wird, unter den Großmächten zu leiden.\n\nDie Sozialdemokraten versuchen derzeit, ein Gleichgewicht zu erzeugen - zwischen der Errichtung eines Wohlfahrtsstaates, der die leidende Bevölkerung unterstützt, und der Schaffung einer glaubwürdigen militärischen Abschreckung, die die jahrhundertealte Verpflichtung der Nation zur Neutralität aufrechterhalten kann."
 SWE_BLITZKRIEG_DESC: "Die Anzeichen für einen neuen Weltkrieg werden von Tag zu Tag sichtbarer, während Deutschland immer weiter die Grenzen seiner Nachbarn auf die Probe stellt. Da die militärische Großmacht vom schwedischen Eisenerz abhängig ist, wächst die Befürchtung, dass sich ihre territorialen Ambitionen bald schon über das Baltikum hinaus bis nach Skandinavien erstrecken könnten.\n\nIn Anbetracht einer solchen Bedrohung hat das schwedische Militär damit begonnen, aufzurüsten und zu modernisieren - dank der aufblühenden Rüstungsindustrie des Landes. Es bleibt nur abzuwarten, ob das Land in der Lage ist, eine Invasion abzuwehren."
 NOR_GATHERING_STORM_DESC: "Seit es im Jahr 1905 seine Unabhängigkeit von Schweden erhielt, hat Norwegen darum gekämpft, politisch Fuß zu fassen, und erst jetzt gibt es Anzeichen für politische Stabilität im Land. Es war ein langer Weg, sich von den harten Dreißigern zu erholen.\n\nDa Norwegens südliche Nachbarn immer mehr in Konflikte geraten, scheint ein Krieg näher denn je, und Norwegen muss einen Weg finden, seine fragile Unabhängigkeit zu bewahren. Das Kabinett Nygaardsvold setzt auf Neutralität und Abrüstung, um gegenüber den europäischen Großmächten so harmlos wie möglich zu erscheinen, doch ob dieser Ansatz ausreichen wird, bleibt abzuwarten."
 NOR_BLITZKRIEG_DESC: "Während das Dritte Reich immer mehr an Macht und Größe gewinnt, planen die faschistischen Elemente in Norwegen, eine mögliche deutsche Invasion auszunutzen, um die Kontrolle über das Land zu übernehmen und mit dem Feind zu kollaborieren.\n\nVidkun Quisling, ein skrupelloser Lakai der Nazi-Partei, scheint einen Plan ausgearbeitet zu haben, um die Macht für sich und seine Partei Nasjonal Samling zu übernehmen. Es ist an der Zeit, schleunigst die nötigen Vorbereitungen zu treffen, um Norwegen zusammenzuhalten und alle Gefahren abzuwehren, die innen wie außen lauern."
 DEN_GATHERING_STORM_DESC: "In Zeiten, in denen die Spannungen in Europa wieder zunehmen, sieht sich Dänemark mit einem schwachen Militär und einer immer noch von der Weltwirtschaftskrise gezeichneten Wirtschaft konfrontiert.\n\nDie Dänen müssen einen Weg finden, um die hohe Arbeitslosigkeit und die wachsenden extremistischen Randbewegungen zu bekämpfen, und gleichzeitig die Vorzüge der Neutralitäts- und Beschwichtigungspolitik neu bewerten.\n\nDänemark ist nach wie vor Herr seines eigenen Schicksals, doch es bleibt abzuwarten, wie lange noch."
 DEN_BLITZKRIEG_DESC: "Dänemark befindet sich in einer heiklen Lage: Das Militär wurde vernachlässigt und musste Jahr für Jahr Haushaltskürzungen hinnehmen, um den viel größeren und stärkeren Nachbarn Deutschland zu beschwichtigen.\n\nDiese Beschwichtigungsversuche haben das Deutsche Reich jedoch nicht daran gehindert, seine Macht in Europa zu konsolidieren und Ansprüche auf andere Nationen zu erheben. Dänemark muss sich nun auf seine Neutralitätserklärung verlassen, die es vor dem verheerenden Ersten Weltkrieg bewahrt hatte."
 ICE_GATHERING_STORM_DESC: "Island blickt auf eine lange Geschichte der Isolation und Erkundung zurück. Als Norwegen im Jahr 1814 zu einem Juniorpartner von Schweden wurde, wurde Dänemark der neue Besitzer von Island, das schließlich im Jahr 1919 die Selbstverwaltung erhielt.\n\nDie Weltwirtschaftskrise zog Island sehr in Mitleidenschaft, und angesichts des sich abzeichnenden Konflikts ist es vielleicht an der Zeit, das sinkende Schiff zu verlassen und die Beziehungen zu den Dänen ein für alle Mal zu beenden."
 ICE_BLITZKRIEG_DESC: "Mit den jüngsten Forderungen Deutschlands wird immer deutlicher, dass die Lage in Europa unhaltbar und ein Angriff auf Dänemark wohl unvermeidlich ist.\n\nVor diesem Hintergrund steht auch die Zukunft Islands auf der Kippe, und es wird wahrscheinlich den Schutz der Amerikaner suchen müssen, wenn es sich aus dem vor uns liegenden Konflikt heraushalten will."
 BRA_GATHERING_STORM_DESC: "Die Weltwirtschaftskrise ruinierte die brasilianische Wirtschaft, die zu stark von Exporten abhängig war. In den Jahren danach kam es verstärkt zu politischen Unruhen, da eine Koalition aus Militär, Arbeitern und Politikern die Oligarchie, die das Land regierte, stürzte und durch eine fragile demokratische Verfassung ersetzte.\n\nGetúlio Vargas verhalf sich selbst an die Spitze der brasilianischen Politik, indem er einen kommunistischen Putsch vereitelte und den Notstand ausrief. Es bleibt abzuwarten, ob die Demokratie wiederhergestellt oder aber Vargas das Land in eine autoritärere Richtung lenken wird."
 BRA_BLITZKRIEG_DESC: "Getúlio Vargas hat die Kontrolle über die Regierung übernommen und die Demokratie ausgesetzt. Das brasilianische Staatsoberhaupt hat die Macht an sich gerissen und sich internationalen Angelegenheiten zugewandt. Ein Krieg in Europa scheint unvermeidlich, und die Paranoia hinsichtlich einer argentinischen Invasion auf brasilianisches Territorium wächst immer weiter. Es besteht jedoch die Hoffnung, dass eine Annäherung an die Vereinigten Staaten dazu beitragen könnte, Brasiliens Zukunft zu sichern."
 ARG_GATHERING_STORM_DESC: "Im Jahr 1930 wurde das Kabinett von Hipólito Yrigoyen durch den ersten Militärputsch seit der Verabschiedung der argentinischen Verfassung gestürzt, was das sogenannte „berüchtigte Jahrzehnt“ einläutete. Argentinien muss sich in einer Welt zurechtfinden, in der Großmächte jenen fragilen Frieden bedrohen, der seit dem Ende des Ersten Weltkriegs aufrechterhalten worden ist.\n\nDoch was ist die größere Bedrohung? Der aufkommende Sturm in Europa? Die eigenen Nachbarn? Die eigene Militärregierung? Argentinien wird sich behaupten und seinen Platz in der Welt festigen müssen."
 ARG_BLITZKRIEG_DESC: "Nach dem größten Wahlbetrug in der argentinischen Geschichte hält die Concordancia weiterhin die Mehrheit in der Regierung und Roberto María Ortiz regiert das Land als Präsident.\n\nAngesichts der Spannungen, die zwischen den beiden engsten Freunden Argentiniens in Europa immer weiter zunehmen, muss sich das Land nun jedoch darauf vorbereiten, unweigerlich zwischen den Fronten zu stehen. Darüber hinaus wächst die Unzufriedenheit des Militärs, und die Paranoia hinsichtlich des schlummernden Rivalen im Norden wird ständig geschürt. Argentinien steht vor einer wichtigen Entscheidung und sollte genau abwägen, auf wessen Seite es steht."
 CHL_GATHERING_STORM_DESC: "Infolge des Börsenkrachs an der Wall Street stellte die USA die Einfuhr von Kupfer und Nitrat aus Chile ein und brachte das Land damit um seine Haupteinnahmequelle. Dies führte dazu, dass Chile die am stärksten von der Weltwirtschaftskrise betroffene Nation Südamerikas war, und für die politische Instabilität, die sich mit der Krise noch verschlimmerte, wurde bis heute noch keine Lösung gefunden.\n\nDie Amtszeit von Arturo Alessandri neigt sich dem Ende entgegen, die faschistische Bewegung ist auf dem Vormarsch und die Bevölkerung erinnert sich lebhaft an die zahlreichen Putschversuche des vorangegangenen Jahrzehnts und die Sozialistische Republik Chile von 1932."
 CHL_BLITZKRIEG_DESC: "Der kürzliche Putschversuch von Jorge González von Marées und den Nacistas konnte niedergeschlagen werden, Arturo Alessandri ist zurückgetreten und Pedro Aguirre Cerda wurde zum neuen Präsidenten von Chile gewählt. Die Bedrohung, die das Militär darstellt, ist jedoch nach wie vor groß, und es scheint, dass General Ariosto Herrera und seine Anhänger in naher Zukunft selbst versuchen könnten, die Macht an sich zu reißen.\n\nAls wäre dies nicht schon schlimm genug, zeichnet sich am Horizont ein Krieg ab, denn die Spannungen nehmen nicht nur in Europa und Asien zu, sondern auch im Amazonasgebiet und damit nahe dem chilenischen Kernland."
 PAR_GATHERING_STORM_DESC: "Obwohl das Land als Sieger aus dem blutigen Chaco-Krieg gegen Bolivien hervorging, ist es wirtschaftlich am Ende, stark militarisiert und wegen der Unbeliebtheit von Ayala nicht in der Lage, die Situation unter Kontrolle zu bringen, da dieser zusammen mit seiner rechten Hand José Félix Estigarribia dafür verantwortlich gemacht wird, dass es überhaupt zu diesem Krieg kam.\n\nAls wäre dies nicht schon schlimm genug, versammelte sich Militär hinter Rafael Franco und der sozialistischen Feberista-Bewegung, um die Regierung zu stürzen."
 PAR_BLITZKRIEG_DESC: "Der Putschversuch der Feberista-Bewegung war erfolgreich, und Ayala und seine liberalen Anhänger konnten gestürzt werden. Viele legen nun ihre Hoffnungen auf Rafael Franco, der die zahlreichen Demütigungen des Landes rächen und erneut gegen Bolivien vorgehen soll, auch wenn dies kaum Erfolg haben wird.\n\nManche Offiziere schmieden bereits Pläne, ihn mit Hilfe der faschistischen paramilitärischen Organisation „Guión Rojo“ zu stürzen und durch Higinio Morinigo zu ersetzen, um engere Beziehungen zu den Achsenmächten anzustreben."
 URG_GATHERING_STORM_DESC: "In einem als „uruguayischer Selbstputsch von 1933“ bezeichneten Schritt stürzte Präsident Gabriel Terra seine eigene Regierung, löste das Parlament auf, schwächte die verfassungsmäßigen Kontrollmechanismen und regierte zunehmend autoritär. Bis zu diesem Zeitpunkt war Uruguay unter José Batlle y Ordóñez und einer liberalen Doktrin namens „Batllismo“ eine der fortschrittlichsten Demokratien Lateinamerikas.\n\nDie Verschuldung verbesserte die politische Lage nicht gerade, und die Republik Östlich des Uruguay befindet sich nun inmitten einer Diktatur, die nicht ewig andauern kann."
 URG_BLITZKRIEG_DESC: "Der ehemalige Diktator Gabriel Terra übergab kürzlich die Macht an seinen Schwager Alfredo Baldomir, der ebenfalls der Colorado-Partei angehört. Da dieser liberaler und den Alliierten wohlgesonnen ist, könnte das Land erneut den Weg der liberalen Demokratie einschlagen und die Großmächte bei der Wahrung des internationalen Rechts und der internationalen Ordnung unterstützen."
 AUS_GATHERING_STORM_DESC: "Österreich ist von der „Selbstauflösung des Parlaments“ im Jahr 1934 und der anschließenden Ermordung von Bundeskanzler Engelbert Dolfuss noch immer sichtlich erschüttert. Da sie weiterhin an den Staatsvertrag von Saint-Germain-En-Laye gebunden sind und sich inmitten einer Wirtschaftskrise befinden, steht die österreichische Führung unter Bundeskanzler Schuschnigg vor einer Entscheidung monumentalen Ausmaßes. Soll sie ihr Schicksal akzeptieren, wenn Deutschland sie holen kommt? Soll sie sich bis zuletzt wehren, diplomatisch oder militärisch? Oder soll Österreich auf die Vergangenheit blicken und das Reich werden, das es einst war?"
 AFG_GATHERING_STORM_DESC: "Unter der Herrschaft von König Zahir Schah und dessen Onkeln genießt Afghanistan eine Zeit der relativen Stabilität. Doch unter der Oberfläche des zeitlosen Königreichs kochen auch Wut und Misstrauen hoch. Manche hoffen auf eine radikale Modernisierung des Staates, wie sie der im Exil lebende Amanullah Khan anstrebt, von dem einige glauben, er könne sogar eine Rückkehr auf den Thron planen. Andere wiederum sind der Meinung, das quälend langsame Tempo des Wandels unter Zahir Schah sei noch immer zu schnell und die Nation müsse zu ihren traditionellen Wurzeln zurückkehren. Da die Welt um es herum immer instabiler wird, könnte das Volk Afghanistans die Chance nutzen, um die Lage zu seinem Vorteil zu nutzen."
 AFG_BLITZKRIEG_DESC: "König Zahir Schah wächst immer mehr in seine Rolle hinein, doch die Herausforderungen an seine Herrschaft werden zunehmend größer. Britannien, Deutschland und die Sowjetunion kämpfen um Einfluss auf das strategisch gelegene Königreich und bringen sowohl Investitionen als auch die Androhung einer Invasion mit. In der Zwischenzeit überqueren Aufwiegler die Grenze zum Raj und schüren Unruhen auf beiden Seiten. Während die Welt erneut im Krieg versinkt, stellt sich in der Region die Frage, was Afghanistan tun wird."
 BEL_GATHERING_STORM_DESC: "Belgien ist noch immer stark vom Ersten Weltkrieg gezeichnet: Große Teile des Landes liegen in Trümmern und die zurückgelassenen Wunden innerhalb des Volkes reichen tief. Auch die Zukunft als Demokratie wird infrage gestellt, da die derzeitige Regierung von verschiedenen faschistischen Gruppierungen der Korruption bezichtigt wird.\n\nAuf internationaler Ebene bewegt sich Belgien auf einem schmalen Grat zwischen den vertraglichen Verpflichtungen gegenüber denjenigen, die das Land in ein Schlachtfeld verwandelt haben, und der Sorge um seine Sicherheit in einer zunehmend unruhigen Welt."
 BEL_BLITZKRIEG_DESC: "Belgien ist innenpolitisch instabil, aber das ist nichts im Vergleich zu der Instabilität, die derzeit auf der Weltbühne herrscht. Das belgische Militär wurde modernisiert und ausgebaut, wobei man den mächtigen Festungsanlagen, die sogar mit den französischen Maginot-Festungen wetteifern können, große Aufmerksamkeit schenkte.\n\nDie belgische Regierung hat ihre Bündnisse aufgegeben und absolute Neutralität erklärt, was jedoch nicht verhindert hat, dass für den Fall eines Angriffs Hinterzimmerabsprachen getroffen wurden. Belgien beobachtet den zunehmenden Militarismus seines Nachbarn mit großer Sorge."
 COG_GATHERING_STORM_DESC: "Der Belgisch-Kongo ist noch immer vom ehemaligen Freistaat Kongo und der Herrschaft von König Leopold II. gezeichnet, hat sich seit dieser Zeit aber gut weiterentwickelt. Die Kolonialregierung setzt zwar nach wie vor günstige Arbeitskräfte in den Minen ein und es gibt eine unsichtbare Decke, die dafür sorgt, dass die Mehrheit der Einwohner keine höhere Bildung erlangt, doch nicht alles ist düster.\n\nDa die kolonialen Ambitionen Italiens immer größer werden und sich die Force Publique im Ersten Weltkrieg bewährt hat, macht sie sich erneut bereit, zur Verteidigung des Staates in den Kampf zu ziehen - auch wenn sie dafür vermutlich nicht ausreichend gerüstet sein wird."
 COG_BLITZKRIEG_DESC: "Da die italienische Eroberung Abessiniens abgeschlossen und das Deutsche Reich auf einem Eroberungsfeldzug in Europa ist, könnte sich auch für uns eine Gefahr anbahnen. Italiens koloniale Ambitionen enden nicht in Ostafrika und könnten in naher Zukunft auch unsere Unabhängigkeit bedrohen. Hitler hingegen könnte versuchen, unsere belgischen Herren anzugreifen, um eine Hegemonie über den europäischen Kontinent zu erlangen.\n\nDer Krieg könnte schon bald vor unserer eigenen Haustür ausgetragen werden, wenn wir ihn nicht vorher zu ihnen bringen ..."
 PER_GATHERING_STORM_DESC: "Die große Nation Iran, die früher auch als Persien bekannt war, befindet sich im Kreuzfeuer von Giganten. Während sich der neutrale Iran mit Hilfe des Deutschen Reiches rasant modernisiert, blicken die ehemaligen Verbündeten in Großbritannien und der Sowjetunion mit Misstrauen auf das Land. Reza Schah Pahlavi weigert sich, diese beiden Nationen in die iranische Souveränität eingreifen zu lassen, selbst auf die Gefahr hin, dass es zu einer Invasion kommt.\n\nWird die Neutralität des Iran respektiert werden? Sind wir bereit, unsere Heimat vor böswilligen Invasoren zu beschützen? Wenn all unsere Pläne scheitern, ist es dann an der Zeit, uns auf unsere Vergangenheit zu besinnen und den Geist des alten Persischen Reichs wiederaufleben zu lassen?"
 IRQ_GATHERING_STORM_DESC: "Unter der Herrschaft von König Faisal I. und später dessen Sohn König Ghazi durchlebte der Irak im Nachgang des Ersten Weltkriegs als britisches Mandatsgebiet turbulente Zeiten. Die Haschimiten-Monarchie strebt danach, ein Gleichgewicht zwischen Modernisierung und Nationalismus aufrechtzuerhalten, doch unter der Oberfläche brodelt Unzufriedenheit. Stammesführer lehnen die Zentralverwaltung ab, während die städtische Elite auf eine größere Unabhängigkeit vom britischen Einfluss drängt. Die panarabistische Stimmung stößt auf die verschiedenen ethnischen und religiösen Identitäten des Irak und macht die Region zu einer fragilen Einheit. Während die Welt auf einen weiteren großen Konflikt zusteuert, steht der Irak zwischen Konsolidierung und Umwälzung. Seine Zukunft ist ungewiss, aber voller Möglichkeiten."
 IRQ_BLITZKRIEG_DESC: "Der Irak befand sich in den letzten Jahren in einer Phase zunehmender Unruhen. Der von Bakr Sidqi geführte Putschversuch im Jahr 1936 hat die zerbrechliche Autorität der Haschimiten-Monarchie zerschmettert und einen gefährlichen Präzedenzfall für ein Eingreifen des Militärs geschaffen. Im Inneren kommt es oft zu Spannungen zwischen den Stammesführern, die sich der Zentralisierung widersetzen, den Reformern, die auf Modernisierung drängen, und dem ruhelosen Militär, das durch seine neu gewonnene Macht ermutigt wurde. Der panarabische Nationalismus ist auf dem Vormarsch und fordert den britischen Einfluss heraus, indem er den Traum von einer regionalen Einheit propagiert. Während die Welt immer instabiler wird, steht der Irak an einem Scheideweg. Seine Zukunft ist ungewiss und das Volk gespalten."
 PER_BLITZKRIEG_DESC: "Dem Iran steht eine turbulente und ungewisse Zukunft bevor. Mit Beginn des Krieges in Europa steht Reza Schah Pahlavi zwischen zwei wichtigen Akteuren, die ein Interesse daran zu haben scheinen, sich in den Konflikt einzumischen.\n\nDie Souveränität des Iran könnte gefährdet sein, falls die Großmächte seine Ressourcen wollen, und die Regierung des Schahs muss sich auf eine potenzielle Invasion vorbereiten. Die Frage ist nur: Wird der Iran in der Lage sein, sich rechtzeitig zu mobilisieren?"
 PHI_GATHERING_STORM_DESC: "1935 stimmten die Vereinigten Staaten endlich einem friedlichen Übergang zur Unabhängigkeit über einen Zeitraum von zehn Jahren zu. Die Philippinen befinden sich noch am Anfang dieses Prozesses, übernehmen jedoch zunehmend die Kontrolle über ihr eigenes Schicksal.\n\nWerden sie die Beziehungen zu den USA aufrechterhalten oder die Unterstützung anderer suchen, um den Unabhängigkeitsprozess zu beschleunigen? Den Philippinen steht eine wohlhabende Zukunft bevor, doch die Haie kreisen bereits um diese junge Nation."
 SIA_BLITZKRIEG_DESC: "Seit der Machtübernahme Ende 1938 gestaltete Premierminister Phibunsongkhram Siam nach seinen eigenen Vorstellungen um. Das Land hat einen neuen Namen - Thailand - und folgt einem neuen Leitbild aus militärischer Disziplin, pan-thailändischem Nationalismus und territorialen Ambitionen gegenüber den thailändischsprachigen Völker, die noch unter französischer und britischer Kolonialherrschaft stehen.\n\nWährend Europa auf einen Krieg zusteuert und Japan immer größere Teile Chinas übernimmt, wird Phibuns Armee von Tag zu Tag stärker. Seine Ambitionen sind kein Geheimnis. Die Frage ist nur, auf wessen Seite sich Thailand stellen wird, wenn der Zeitpunkt gekommen ist."
 PHI_BLITZKRIEG_DESC: "Die Vereinigten Staaten hielten bisher ihr Wort und unterstützten die Philippinen auf ihrem Weg zur Unabhängigkeit.\n\nUnterdessen brach zwischen China und Japan ein Krieg aus, und die Inselnation beobachtet die imperialistischen Bestrebungen ihres nördlichen Nachbarn mit großer Sorge.\n\nDie amerikanische Verstärkung ist eingetroffen, um die Verteidigung zu unterstützen, aber wird das ausreichen? Japan könnte diese Möglichkeit für einen Angriff nutzen."
 SIA_GATHERING_STORM_DESC: "Es sind gerade einmal vier Jahre vergangen, seit Khana Ratsadon die absolute Monarchie abschaffte, die zuvor jahrhundertelang bestand. Siam geht seine ersten Schritte als Rechtsstaat, doch die Einheit beginnt bereits zu bröckeln: Zivile Reformer träumen von Demokratie, während das Militär Stärke, Disziplin und eine pan-thailändische Expansion anstrebt.\n\nDa Siam zwischen der britischen und der französischen Kolonialmacht eingekeilt ist und Japan immer stärker wird und nach Norden vorrückt, muss Siam seinen Kurs für die Zukunft mit Bedacht wählen. Der aufziehende Sturm könnte diese junge Nation dazu zwingen, sich für eine Seite zu entscheiden, oder aber einen Weg zu finden, ohne ein Bündnis zu überleben."
 INS_GATHERING_STORM_DESC: "Seit mehr als drei Jahrhunderten ist Niederländisch-Indien ein Juwel in der Krone des niederländischen Kolonialreichs. Der riesige Archipel aus Inseln, Sprachen und Kulturen wird allein durch die Kolonialverwaltung zusammengehalten, die über sie herrscht.\n\nDer Einfluss von Den Haag schwindet jedoch täglich. Die Bevölkerung ist der Ausbeutung überdrüssig und steht einer nationalistischen Bewegung zunehmend aufgeschlossen gegenüber. Doch diese Bewegungen sind gespalten, und jede vertritt eine widersprüchliche Vision für Indonesien. Sollte es ihnen gelingen, ihre Differenzen beizulegen und mit geeinter Stimme zu sprechen, könnten sie maßgeblich über das Schicksal von Niederländisch-Indien entscheiden."
 INS_BLITZKRIEG_DESC: "Vor drei Jahren beantragten Soetardjo und seine Mitunterzeichner in Den Haag, innerhalb von zehn Jahren eine Konferenz bezüglich ihrer Selbstverwaltung einzuberufen. Im vergangenen November traf die Antwort ein und es handelte sich um ein Nein.\n\nDiese Zurechtweisung bewirkte das, was jahrelange Propaganda zuvor nicht vermocht hatte. Im Mai legten acht der größten nationalistischen Organisationen ihre Streitigkeiten beiseite und schlossen sich zusammen, um mit einer Stimme ein indonesisches Parlament zu fordern. Die Kolonialverwaltung reagiert wie immer, doch Japan dringt im Süden immer weiter nach China vor, während die Indischen Inseln weit von Den Haag entfernt sind."
