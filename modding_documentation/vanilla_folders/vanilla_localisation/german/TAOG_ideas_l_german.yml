 ABDA_supreme_command: "ABDACOM-Oberkommando"
 ABDA_supreme_command_desc: "Das amerikanisch-britisch-niederländisch-australische Oberkommando legte eine einheitliche Marine-Doktrin für alle Mitgliedsnationen fest. Der gemeinsame Informationsaustausch, die koordinierten Patrouilleneinsätze und die logistische Unterstützung erhöhen die Kampfkraft jeder Flotte, die unter der Flagge der ABDACOM segelt."
