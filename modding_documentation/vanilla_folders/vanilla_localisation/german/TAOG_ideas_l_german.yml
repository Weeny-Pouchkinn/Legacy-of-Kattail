 AST_imperial_pressure_spirit_desc: "Angesichts der jüngsten Ereignisse lässt sich nicht länger leugnen, dass sich die australische Politik in eine Richtung bewegt, die für eine Nation, die zum Britischen Commonwealth gehört, ungeeignet ist. [ENG.GetNameDefCap] wird versuchen, unser Land wieder auf den gewünschten Kurs zurückzuführen, wofür man möglicherweise nicht viel Geduld aufbringen wird.\n\n§WWird entfernt, sobald §Y[AST.GetNameDef]§! kein §Y[ENG.GetAdjective]er Untertan§! mehr ist§!"
