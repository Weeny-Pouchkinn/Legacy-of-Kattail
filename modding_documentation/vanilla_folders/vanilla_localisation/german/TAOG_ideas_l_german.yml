 NZL_railways_board: "Staatliche Eisenbahnbehörde"
 NZL_railways_board_desc: "Der Staatliche Eisenbahnbehörde wurde 1931 im Zuge der Umstrukturierung des Eisenbahnministeriums gegründet, um die Entscheidungsfindung von den Ministerien zu entkoppeln. Seit der Gründung wurde das Eisenbahnnetz jedoch kaum verbessert. Der Druck auf die Regierung wächst, die Behörde aufzulösen und wieder die direkte Kontrolle zu übernehmen."
 NZL_great_depression: "Weltwirtschaftskrise"
 NZL_great_depression_desc: "Der Zusammenbruch der Weltwirtschaft im Jahr 1929 traf das überwiegend landwirtschaftlich geprägte Neuseeland sehr hart. Da andere Länder weniger Produkte aus Neuseeland kauften, verloren viele ihre Arbeit, was die Kaufkraft der Bevölkerung schwächte und wiederum zum Zusammenbruch anderer Wirtschaftszweige führte. Nach Jahren der Sparpolitik sehnt sich die Nation nun nach einem Kurswechsel. "
 NZL_commonwealth_loyalty: "Loyalität zum Britischen Commonwealth"
 NZL_commonwealth_loyalty_desc: "Neuseeland bleibt ein Mitglied des Britischen Commonwealth und erkennt den König weiterhin als rechtmäßiges Staatsoberhaupt an. Auch die neuseeländische Wirtschaft ist eng in das übergeordnete Wirtschaftssystem des Empires eingebunden."
