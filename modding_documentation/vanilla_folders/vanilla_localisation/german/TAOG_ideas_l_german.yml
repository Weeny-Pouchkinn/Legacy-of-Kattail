 idea_INS_volksraad: "Der Volksraad"
 idea_INS_volksraad_desc: "Der Volksraad wurde 1918 von den Niederlanden im Rahmen der „Ethischen Politik“ eingerichtet. Dieser Rat sollte eine Halbdemokratie schaffen, in der verschiedene ethnische Minderheiten und Kulturen aus dem gesamten Archipel vertreten sein können. Obwohl er theoretisch demokratischer Natur ist, verfügen der Generalgouverneur und die niederländische Krone über ein uneingeschränktes Vetorecht."
 INS_volksraad_custom_tt: "Erlaubt die Rekrutierung von §YVolksraad-Beratern§!\nAktiviert die §YVolksraad-Entscheidungen§!"
 INS_great_depression: "Die Weltwirtschaftskrise"
 INS_great_depression_desc: "Auch wenn die direkten Auswirkungen der Weltwirtschaftskrise auf Niederländisch-Indien gering ausfielen, brach die Wirtschaft durch die Protektionismuspolitik anderer Länder dennoch ein, da Niederländisch-Indien auf den Export von Rohstoffen wie Kautschuk und Öl angewiesen war."
 INS_great_depression_tt: "Modifiziert §Y$INS_great_depression$§! um:"
 INS_dutch_east_indies: "Misswirtschaft"
 INS_dutch_east_indies_desc: "Ostasien ist ein riesiger Archipel mit Hunderten unterschiedlicher Kulturen und Sprachen, was die Verwaltung dieser Kolonie erschwert. Die verschiedenen Unabhängigkeitsbewegungen, kulturelle Barrieren und wirtschaftlichen Probleme nach der Weltwirtschaftskrise zusammen mit der ineffizienten Verwaltung tragen dazu nur weiter bei. Die 1918 eingeführte „Ethische Politik“ sollte die Situation durch die Einführung ethischer Arbeitsvorschriften und einer demokratischen Vertretung für Minderheiten verbessern, doch aufgrund der Weltwirtschaftskrise war sie größtenteils unwirksam."
 INS_dutch_east_indies_tt: "Modifiziert §Y$INS_dutch_east_indies$§! um:"
 INS_volksraad_tt: "Modifiziert §Y$INS_dutch_east_indies$§! um:"
 INS_royal_netherlands_east_indies_army_desc: "Die „Koninklijk Nederlands Indisch Leger“ (KNIL) ist die traditionelle Armee von Niederländisch-Indien und operiert weitgehend unabhängig von den Niederlanden. Die KNIL setzt sich sowohl aus europäischen als auch indonesischen Soldaten zusammen, doch die kulturellen und sprachlichen Barrieren zwischen den vielen Kulturen des Archipels und den Niederlanden machen die Rekrutierung zu einem schwierigen und langwierigen Prozess."
 idea_INS_netherlands_most_precious_jewel: "Das wertvollste Juwel der Niederlande"
 idea_INS_netherlands_most_precious_jewel_desc: "Niederländisch-Indien ist seit rund 350 Jahren eine Kolonie der Niederlande und die Verwaltung der Kolonie eng mit der niederländischen Regierung verflochten. Niederländisch-Indien wird oft als „das Juwel in der niederländischen Krone“ bezeichnet, und die Niederlande zeigen keinerlei Absicht, ihren Griff um dieses kostbare Kleinod zu lockern."
 INS_netherlands_most_precious_jewel_tt: "£GFX_trigger_no Kann die Autonomie zur Befreiung erhöhen"
