 idea_SIA_bank_of_siam: "Bank von Siam"
 idea_SIA_bank_of_siam_desc: "Die Bank von Siam fungiert als finanzielles Rückgrat des Staates. Sie lenkt unsere Kapitalinvestitionen und fördert die industrielle Expansion."
 idea_SIA_bank_of_siam_2: "$idea_SIA_bank_of_siam$"
 idea_SIA_bank_of_siam_2_desc: "$idea_SIA_bank_of_siam_desc$"
 idea_SIA_boon_rawd_brewery: "Brauerei Boon Rawd"
 idea_SIA_boon_rawd_brewery_desc: "Die Brauerei Boon Rawd entwickelte sich zu einem Symbol für das heimische Unternehmertum, und ihr wirtschaftlicher Erfolg verschafft jenen, die sie unterstützen, Ansehen und politischen Einfluss."
