 AST_singapore_strategy_idea_desc: "Auf Bitte Australiens hin werden wir die Verteidigungsfähigkeiten von Singapur verbessern. Die Singapur-Strategie ist eine Schlüsselkomponente für die pazifische Verteidigungspolitik.\n\n§W§YBei Entfernung§! (§YSingapur§!):\n Erhält §G2§! §YLuftstützpunkte§!.\n Erhält §G2§! §YMarinestützpunkte§!.\n Erhält §G1§! §YKüstenbefestigung§!.§!\n"
