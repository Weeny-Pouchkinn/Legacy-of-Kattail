 AST_war_plan_japan: "Kriegsplan Japan"
 AST_australian_culture_investments_idea: "Australische Kulturinvestitionen"
 AST_australian_culture_investments_idea_desc: "§W§YBei Entfernung§!:\nErhält §YEin Gefühl der Zugehörigkeit§!, was Folgendes gibt\nStabilität: §G+10.00%§!\nKriegsunterstützung: §G+10.00%§!.§!\n"
 AST_a_sense_of_place: "Ein Gefühl der Zugehörigkeit"
 AST_a_sense_of_place_desc: "Die nationale Identität ist das Band, das ein Volk zusammenhält. Die Australier haben sich unter einer aufblühenden Kultur vereint und sind entschlossen, sich gemeinsam jedem entgegenzustellen, der ihre Grenzen bedrohen könnte."
 AST_a_sense_of_place_upgraded: "Ein Gefühl der Zugehörigkeit"
 AST_a_sense_of_place_upgraded_desc: "Die nationale Identität, die einst still und leise erblühte, wurde deutlich grimmiger. Es geht nicht mehr nur um den Stolz auf ein Land und eine Lebensweise, sondern um die Überzeugung, dass es sich lohnt, um das zu kämpfen, was Australien sich aufgebaut hat, und dass die Männer und Frauen, die unter dem Kreuz des Südens leben, dazu bereit sind."
 AST_the_promise_of_nauru: "Versprochene Übergabe von Nauru"
 AST_the_promise_of_nauru_tt: "Auswirkungen, sobald §Y[AST.GetNameDef]§! das Abkommen finalisiert:\n§YNauru§! geht in den Besitz von §Y[GER.GetName]§! über\n[AST.GetNameDefCap] wird unabhängig\n[GET_AST_NAURU_PACT_FACTION_EFFECT]"
