 idea_SIA_irrigation: "Bewässerung"
 idea_SIA_debt_repayment: "Rückzahlung von Schulden"
 idea_SIA_debt_repayment_desc: "Die Kosten des Schuldenrückzahlungsprogramms sind spürbar. Die Einnahmen fließen an die Gläubiger. und Bauvorhaben, die einst durch die Kreditaufnahme möglich waren, dauern länger oder sind gar nicht mehr durchführbar."
 idea_SIA_an_unceasy_alliance: "Unsicheres Bündnis"
 idea_SIA_an_unceasy_alliance_desc: "Das Bündnis hält zwar noch, doch die Spannungen wachsen immer weiter. Zweifel innerhalb der Regierung lenken das Land still und leise auf einen neutraleren Kurs."
 idea_SIA_rural_support: "Ländliche Unterstützung"
 idea_SIA_the_sacred_hierarchy: "Heilige Hierarchie"
 idea_SIA_order_discipline_and_unity: "Ordnung, Disziplin und Einheit"
 idea_SIA_constitutional_virtue: "Konstitutionelle Tugenden"
 idea_SIA_an_absolute_monarchy: "Absolute Monarchie"
 idea_SIA_an_absolute_monarchy_desc: "Die gesamte politische Macht liegt bei der Krone. Das Wort des Königs ist Gesetz, und abweichende Meinungen werden unterdrückt. Die Krone nutzt ihr gesamtes Ansehen, um das Land zu mobilisieren. Der Thron verlangt Loyalität, und die Armee ist sein Instrument."
 idea_SIA_a_constituional_monarchy: "Konstitutionelle Monarchie"
 idea_SIA_a_constituional_monarchy_desc: "Ein verfassungsrechtlicher Rahmen beschränkt den Einfluss des Königshauses und verankert die Rechte des Volkes. Die Krone ist nur ein Symbol der Einigkeit, verfügt aber nicht über die absolute Macht, was die Nation stabilisiert, offener für neue Ideen macht und es ihr erlaubt, sich der demokratischen Welt anzunähern."
 idea_SIA_restoring_order: "Wiederherstellung der Ordnung"
 idea_SIA_military_expansion_costs: "Kosten für die Erweiterung des Militärs"
 idea_SIA_a_modern_economy: "Moderne Wirtschaft"
 idea_SIA_death_to_communists: "Tod den Kommunisten"
 idea_SIA_death_to_communists_desc: "In unseren Reihen herrscht eine antikommunistische Stimmung, was unseren Streitkräften einen Vorteil gegenüber den kommunistischen Armeen Chinas verschafft."
 idea_SIA_death_to_nationalists: "Tod den Nationalisten"
 idea_SIA_death_to_nationalists_desc: "In unseren Reihen herrscht eine antinationalistische Stimmung, was unseren Streitkräften einen Vorteil gegenüber den nationalistischen Armeen Chinas verschafft."
 idea_SIA_breaking_the_burmese_line: "Durchbrechen der burmesischen Linie"
 idea_SIA_the_yellow_dossier: "Das gelbe Dossier"
 idea_SIA_the_yellow_dossier_desc: "Ein vertraulicher Bericht zur heimischen Industrie führte dazu, dass sich die Regierung mit tief verwurzelten Ineffizienzen auseinandersetzen musste. Die geforderten Reformen tragen in unseren Fabriken langsam Früchte, auch wenn die damit verbundenen Umbrüche ihren Preis haben."
 idea_SIA_the_yellow_dossier_2: "$idea_SIA_the_yellow_dossier$"
 idea_SIA_the_yellow_dossier_2_desc: "$idea_SIA_the_yellow_dossier_desc$"
 idea_SIA_pacific_war_preparations: "Vorbereitungen auf einen Pazifikkrieg"
 idea_SIA_a_race_against_time: "Wettlauf gegen die Zeit"
 idea_SIA_overheated_economy: "Überhitzte Wirtschaft"
 idea_SIA_overheated_economy_desc: "Die Wirtschaft wurde über ihre natürlichen Grenzen hinaus belastet. Die Nachfrage übersteigt das Angebot, und Bauprojekte sind ins Stocken geraten, bis sich die Lage beruhigt."
 idea_SIA_ending_military_grift: "Bekämpfung von Korruption innerhalb des Militärs"
 idea_SIA_the_military_oversight_bureau: "$SIA_military_oversight_bureau$"
 idea_SIA_the_military_oversight_bureau_desc: "Das Büro für militärische Aufsicht hat für neue Kommandanten höhere Maßstäbe eingeführt, um die Kompetenz des gesamten Offizierskorps weiterzuentwickeln."
 idea_SIA_public_credit_debt: "Staatsschulden"
 idea_SIA_public_credit_debt_desc: "Die Staatsschulden und deren Rückzahlung belasten die Wirtschaft und binden Ressourcen, die andernfalls in die Produktion fließen könnten."
 idea_SIA_public_credit_debt_2: "Rückzahlung von Staatsschulden"
 idea_SIA_public_credit_debt_2_desc: "$idea_SIA_public_credit_debt_desc$"
 idea_SIA_revision_of_unequal_treaties: "Überarbeitung ungleicher Verträge"
 idea_SIA_purged_military: "Gesäubertes Militär"
 idea_SIA_purged_military_desc: "Die Entlassung von Offizieren, die als politisch unzuverlässig galten, führte dazu, dass es dem Militär an erfahrenen Anführern mangelt, was die Organisation und Entwicklung der Truppen beeinträchtigt."
 SIA_khana_ratsadon_inlay_title: "Khana Ratsadon"
 SIA_civilian_wing_label: "Zivilflügel"
 SIA_military_wing_label: "Militärflügel"
 SIA_wing_state_full_support: "§GVolle Unterstützung§!"
 SIA_wing_state_slight_support: "§GGeringe Unterstützung§!"
 SIA_wing_state_neutral: "§YNeutral§!"
 SIA_wing_state_opposition: "§RDagegen§!"
 SIA_wing_state_rebellious: "§RRebellisch§!"
 SIA_civilian_wing_history_tt: "Der Zivilflügel der Khana Ratsadon wird von progressiven Verwaltern und Technokraten angeführt, allen voran §YPridi Phanomyong§!. Nach seinem Jurastudium in Frankreich kehrte Pridi mit dem Ziel zurück, Landreformen durchzusetzen, die staatliche Wirtschaftsplanung umzugestalten und eine konstitutionelle Demokratie einzuführen, die dem einfachen Volk ein Mitbestimmungsrecht einräumt.\n\nDer Zivilflügel setzt sich §Gfür die Entwicklung§! ein und befürwortet Investitionen in die Bildung, Infrastruktur und Industrie. Er steht hohen Militärausgaben skeptisch gegenüber und widersetzt sich offen einem politischen Wandel, der zur Herrschaft eines Einzelnen führen würde. Seine Unterstützung lässt sich am ehesten durch Maßnahmen gewinnen, die den Staat modernisieren und die verfassungsmäßige Ordnung schützen."
 SIA_military_wing_history_tt: "Der Militärflügel der Khana Ratsadon wird von Armeeoffizieren beherrscht, die sich als die wahren Hüter der Revolution verstehen. §YPlaek Phibunsongkhram§!, ein Oberst dessen Bewunderung für die nationalistischen Bewegungen Europas von Jahr zu Jahr wächst, gehört zu den ambitioniertesten Persönlichkeiten.\n\nDer Militärflügel setzt sich §Gfür die Wiederbewaffnung§! und einen starken, zentralisierten Staat ein. Er steht Pridis wirtschaftlichen Ideen misstrauisch gegenüber und sieht diese als gefährlich radikal an. Weiterhin missbilligt er die Einmischung des Zivilflügels in die Verteidigung des Landes. Seine Loyalität lässt sich am ehesten durch Investitionen in das Militär und eine Politik sichern, die nationale Stärke demonstriert."
 idea_SIA_wing_promotion_disruption: "Neuausrichtung der Fraktion"
 idea_SIA_wing_promotion_disruption_desc: "Die offene Bevorzugung eines Flügels der Khana Ratsadon brachte die Regierung aus dem Gleichgewicht. Die benachteiligte Fraktion legt ihre Arbeit nieder, der Tagesablauf der Armee ist durcheinander und die Verwaltung ist überlastet, bis sich die neue Ordnung eingespielt hat."
 idea_SIA_military_wing_unrest: "Militärflügel in offener Revolte"
 idea_SIA_military_wing_unrest_desc: "Die Geduld der Offiziere ist erneut am Ende. Da es dem Militärflügel nicht gelang, die Macht an sich zu reißen, lässt er seiner Wut nun durch Sabotage, Fahnenflucht und eine völlige Verweigerung der Zusammenarbeit freien Lauf. Die Kampfkraft der Armee nimmt merklich ab, bis die Unzufriedenheit abklingt."
 idea_SIA_civilian_wing_unrest: "Zivilflügel in offener Revolte"
 idea_SIA_civilian_wing_unrest_desc: "Pridis Fraktion verlor erneut den Glauben an die Regierung. Da ihr eine zweite Chance auf die Macht verwehrt blieb, rief der Zivilflügel zu Streiks und bürokratischen Blockaden in den Städten auf. Die Wirtschaft kam zum Erliegen, und das Land ist unregierbar, bis sich die Gemüter wieder beruhigen."
 idea_SIA_unwavering_civilian_support: "Ungebrochene Unterstützung durch den Zivilflügel"
 idea_SIA_unwavering_civilian_support_desc: "Da der Militärflügel aufgelöst und die Frage der Legitimität geklärt wurde, hält die Zivilverwaltung unangefochten die Macht inne. Pridis Technokraten stürzen sich bereits mit einem Eifer in die Regierungsarbeit, den die alte Koalition niemals hätte aufbringen können."
 idea_SIA_unified_khana_ratsadon: "Vereinte Volkspartei"
 idea_SIA_unified_khana_ratsadon_desc: "Der Streit zwischen dem Zivil- und dem Militärflügel wurde endlich beigelegt. Da die Khana Ratsadon nun an einem Strang zieht, kann die Regierung mit einer bisher nie da gewesenen Einigkeit handeln. Soldaten, Verwaltungsbeamte und Industrielle arbeiten Hand in Hand."
