 AST_anti_fascist_measures: "Antifaschistische Maßnahmen"
 AST_anti_fascist_measures_desc: "Der Faschismus hat in Australien noch nicht Fuß gefasst, und die Verfechter der demokratischen Werte wollen, dass dies auch so bleibt. Die Ermittlungsabteilung des Commonwealth wird alle verdächtigen Personen überwachen und festnehmen, um zu verhindern, dass faschistische Gruppen an Einfluss gewinnen."
 ABDA_corps_expeditionnaire_spirit: "Corps Expéditionnaire"
 ABDA_corps_expeditionnaire_spirit_desc: "Die im Pazifikraum stationierten französischen Truppen dienten der Kolonie lange Zeit und sind daran gewöhnt, fern der Heimat unter schwierigen Bedingungen zu operieren. Dank ihrer Kampferfahrung in Südostasien verfügen sie über ein besonderes Gespür für die japanischen Taktiken und das Terrain, was sie zu einer widerstandsfähigen Streitmacht macht, sobald der Feind vorrückt."
 ABDA_maintain_strategic_flexibility_spirit: "Strategische Flexibilität"
 ABDA_maintain_strategic_flexibility_spirit_desc: "Die amerikanische Industrie ist auf den pazifischen Kriegsschauplatz ausgerichtet. Besonders die Werftproduktion wird beschleunigt, um eine Flotte aufrechtzuerhalten, die ihre Macht über die gesamte Breite des Ozeans hinweg projiziert. Indem die Vereinigten Staaten es vermeiden, sich zu sehr auf eine einzelne Front zu konzentrieren, stellen sie sicher, dass ihre Marine überall dort zum Einsatz kommt, wo es die Lage erfordert."
 AST_toe_the_line_spirit: "Linientreue"
 AST_toe_the_line_spirit_desc: "Der Staat rief zur Selbstaufopferung auf, und die Bevölkerung folgte diesem Aufruf. Durch Rationierung, längere Arbeitszeiten und die Umstellung der Zivilproduktion auf die Kriegswirtschaft wurden Ressourcen freigesetzt, die die Regierung auf andere Weise nicht hätte beschaffen können. Diese Regelung stößt jedoch nicht bei allen auf Zustimmung."
