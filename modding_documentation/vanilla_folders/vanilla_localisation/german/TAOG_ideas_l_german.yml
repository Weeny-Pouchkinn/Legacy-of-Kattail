 AST_poor_population_growth: "Geringes Bevölkerungswachstum"
 AST_poor_population_growth_desc: "Nach der Weltwirtschaftskrise von 1929 nahm die Geburtenrate in Australien drastisch ab. Dies in Verbindung mit dem Rückgang an neuen Einwanderern ließ die Bevölkerung seitdem stark schrumpfen."
