 ### SIAM ###
 ############
 idea_SIA_civilian_full_support: "Zivilflügel: §GVolle Unterstützung§!"
 idea_SIA_civilian_full_support_desc: "Der Zivilflügel steht gänzlich hinter der Regierung. Die Verwaltung und andere Technokraten nutzen ihre Erfahrung, um die Entwicklung voranzutreiben."
 idea_SIA_civilian_slight_support: "Zivilflügel: Geringe Unterstützung"
 idea_SIA_civilian_slight_support_desc: "Der Zivilflügel steht weitgehend hinter der Regierung. Ihre Zusammenarbeit bringt spärliche, aber spürbare Vorteile mit sich."
 idea_SIA_civilian_neutral: "Zivilflügel: Neutral"
 idea_SIA_civilian_neutral_desc: "Der Zivilflügel unterstützt die Regierung weder noch behindert er sie. Die Verwaltung funktioniert, jedoch ohne eine echte politische Richtung zu haben."
 idea_SIA_civilian_opposition: "Zivilflügel: Dagegen"
 idea_SIA_civilian_opposition_desc: "Der Zivilflügel stellt sich gegen die Regierung. Beamte stellen sich quer, und Mittel werden falsch zugewiesen, was den Staatsapparat lahmlegt."
 idea_SIA_civilian_rebellious: "Zivilflügel: §RRebellisch§!"
 idea_SIA_civilian_rebellious_desc: "Der Zivilflügel befindet sich in einer offenen Rebellion. Die Instabilität nimmt zu, und die Gefahr eines politischen Bruchs wächst von Tag zu Tag."
 idea_SIA_military_full_support: "Militärflügel: §GVolle Unterstützung§!"
 idea_SIA_military_full_support_desc: "Der Militärflügel steht gänzlich hinter der Regierung. Die Offiziere unterstützen Rekrutierungskampagnen, und die Rüstungsindustrie richtet die Ressourcen der Armee auf nationale Ziele aus."
 idea_SIA_military_slight_support: "Militärflügel: Geringe Unterstützung"
 idea_SIA_military_slight_support_desc: "Der Militärflügel ist weitgehend kooperativ. Seine Unterstützung führt zu leichten Verbesserungen bei der Rekrutierung und der Produktion, jedoch ohne sich voll und ganz der Sache zu verschreiben."
 idea_SIA_military_neutral: "Militärflügel: Neutral"
 idea_SIA_military_neutral_desc: "Der Militärflügel stellt sich auf keine Seite. Die Armee erfüllt ihre Aufgaben mit wenig Begeisterung, aber ohne Widerstand und wartet ab, wie sich die Lage entwickelt."
 idea_SIA_military_opposition: "Militärflügel: Dagegen"
 idea_SIA_military_opposition_desc: "Der Militärflügel arbeitet gegen die Regierung. Offiziere behindern die Produktion, und die Ziele der Regierung haben immer weniger Bedeutung in ihren Reihen."
 idea_SIA_military_rebellious: "Militärflügel: §RRebellisch§!"
 idea_SIA_military_rebellious_desc: "Der Militärflügel steht kurz vor der Rebellion. Die Einberufungsmaßnahmen werden offen sabotiert, die Rüstungsproduktion leidet und das Land steht kurz vor einem Militärputsch."
 idea_SIA_defenders_of_constitutional_liberty: "Schutz der verfassungsmäßigen Freiheit"
 idea_SIA_civil_service_heroism_1: "Helden des öffentlichen Dienstes"
 idea_SIA_civil_service_heroism_1_desc: "Der öffentliche Dienst nutzt seine Erfahrung, um Forschung und Entwicklung voranzutreiben."
 idea_SIA_civil_service_heroism_2: "$idea_civil_service_heroism_1$"
 idea_SIA_civil_service_heroism_2_desc: "$idea_SIA_civil_service_heroism_1_desc$"
 idea_SIA_redirected_military_funds: "Umverteilter Verteidigungshaushalt"
 idea_SIA_thai_irredentism: "Thailändischer Irredentismus"
 idea_SIA_oss_special_forces_training: "OSS-Ausbildung für Spezialeinheiten"
 idea_SIA_seized_japanese_funds: "Beschlagnahmung japanischer Gelder"
 idea_SIA_seized_japanese_funds_desc: "Da die Verhandlungen mit Japan gescheitert sind, nutzen wir die von ihnen zurückgelassenen Gelder und Vorräte nun, um unser Bauwesen und unsere Industrie anzukurbeln."
 idea_SIA_oss_special_forces_training_desc: "Unsere Agenten wurden gemeinsam mit den Spezialeinheiten der OSS in Sabotage, Infiltration und Luftlandeeinsätzen ausgebildet. Die gewonnenen Erkenntnisse machen sie zu einem gefürchteten Instrument in unserem Arsenal."
 idea_SIA_sold_privy_purse_lands: "Verkaufte Land im Privatbesitz"
 idea_SIA_sold_privy_purse_lands_desc: "Der Verkauf von Ländereien des Königshauses füllte die Staatskasse, was den wirtschaftlichen Druck verringerte und Mittel für Bauvorhaben freisetzte."
 idea_SIA_war_fervor: "Kriegseifer"
 idea_SIA_bloodlusted_irredentism: "Blutdürstiger Irredentismus"
 idea_SIA_bloodlusted_irredentism_desc: "Der territoriale Ehrgeiz der Armee entwickelte sich zu offenem Fanatismus. Die Truppen kämpfen in dem Glauben, das zurückzuerobern, was rechtmäßig uns gehört."
 idea_SIA_the_royal_police_counterweight: "Loyalität der königlichen Polizei"
 idea_SIA_civilian_technocrats_in_institutions: "Zivile Technokraten"
 idea_SIA_civilian_technocrats_in_institutions_desc: "Der Einsatz ziviler Experten in wichtigen staatlichen Institutionen verbesserte sowohl die Rohstoffgewinnung als auch die Effizienz bei politischen Ernennungen."
 idea_SIA_yuvachon: "Yuvachon"
 idea_SIA_yuvachon_desc: "Die Yuvachon-Bewegung bringt der Jugend militärische Disziplin bei, erhöht die Anzahl ausgebildeter Rekruten und schürt nationalistische Gefühle."
 idea_SIA_yuvachon_2: "$idea_SIA_yuvachon$"
 idea_SIA_yuvachon_2_desc: "$idea_SIA_yuvachon_desc$"
 idea_SIA_rebuilding_the_war_torn_economy: "Wiederaufbau der kriegsgeplagten Wirtschaft"
 idea_SIA_specialist_marine_forces: "Spezialeinheiten der Marine"
 idea_SIA_specialist_marine_forces_desc: "Diese Spezialisten wurden für die amphibische Kriegsführung ausgebildet und eignen sich hervorragend für Küstenangriffe."
 idea_SIA_rehabilitated_military: "Rehabilitiertes Militär"
 idea_SIA_desperate_gambit: "Verzweifelter Schachzug"
 idea_SIA_desperate_gambit_desc: "Vielleicht gibt es einen Weg aus diesem Loch, in dem du dich befindest. Kletter heraus!"
 idea_SIA_purged_senior_military: "Entließ hochrangige Militärangehörige"
 idea_SIA_purged_senior_military_desc: "Hochrangige Offiziere, die eine Bedrohung für die Regierung darstellten, wurden ihres Amtes enthoben. Der Verlust dieser erfahrenen Kommandanten beeinträchtigt den Zusammenhalt und die Ausbildung der Truppen."
 idea_SIA_cemented_control: "Gefestigte Kontrolle"
 idea_SIA_cemented_control_desc: "Die Regierung festigte ihren Einfluss auf die staatlichen Institutionen. Die politische Opposition wurde an den Rand gedrängt, und die Staatsmaschinerie arbeitet zugunsten der derzeitigen Regierung."
 idea_SIA_cemented_control_2: "Verankerte Kontrolle"
 idea_SIA_cemented_control_2_desc: "$idea_SIA_cemented_control_desc$"
 idea_SIA_cemented_control_3: "Thailändisches Gesetz zum Dienst während eines Krieges"
 idea_SIA_cemented_control_3_desc: "Es liegt in der Pflicht jeden ehrbaren Thailänders, im Fall eines Krieges, der die Souveränität der Krone und des Volkes bedroht, der Besetzung mit allen Mitteln Widerstand zu leisten, sei es mit Waffengewalt oder auf andere Weise."
 idea_SIA_suspend_ordinary_legal_procedures: "Setzte die ordnungsgemäße Rechtsprechung aus"
 idea_SIA_thai_cultural_mandates: "Thailändische Kulturmandate"
 idea_SIA_military_humiliation: "Militärische Erniedrigung"
 idea_SIA_death_defiant: "Dem Tod getrotzt"
 idea_SIA_death_defiant_desc: "Wir sind bereits tot. Komm und hol dir, was dir zusteht, wenn du kannst."
 idea_SIA_songsuradet_ascendant_0: "Songsuradet-Abkömmling"
 idea_SIA_songsuradet_ascendant_0_desc: "Nachdem er dem Zorn der Regierung erfolgreich trotzte, festigte Phraya Songsuradet seine Position und wurde noch einflussreicher. Er ist nun das, was man als „unantastbar“ bezeichnen würde: zu bekannt und zu fest etabliert, um ihn loszuwerden.\n\nEr wird sich höchstwahrscheinlich in die Politik der Regierung einmischen und Entscheidungsprozesse verlangsamen, um sicherzustellen, dass er nicht erneut Ziel einer Säuberungsaktion wird."
 idea_SIA_songsuradet_ascendant_1: "$idea_SIA_songsuradet_ascendant_0$"
 idea_SIA_songsuradet_ascendant_1_desc: "$idea_SIA_songsuradet_ascendant_0_desc$"
 idea_SIA_rebuilding_after_civil_war: "Wiederaufbau nach dem Bürgerkrieg"
