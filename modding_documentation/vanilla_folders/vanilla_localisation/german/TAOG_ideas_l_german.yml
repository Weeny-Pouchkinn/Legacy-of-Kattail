 idea_SIA_sued_king_prajadhipok: "Verklagte König Prajadhipok"
 idea_SIA_pan_thaiism: "Panthaiismus"
 idea_SIA_pan_thaiism_desc: "Die Ideologie des Panthaiismus besagt, dass alle Völker thailändischer Herkunft unter einem Staat vereint sein sollten. Sie treibt die Nation zur Expansion an und stärkt die Moral durch offensive Maßnahmen."
