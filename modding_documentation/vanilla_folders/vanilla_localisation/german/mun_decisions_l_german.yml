 ###FORT DECISIONS###
 CZE_the_second_fortification_program_category: "Befestigungsprogramme"
 CZE_the_second_fortification_program_category_desc: "Unsere mehr als ungünstige Landesgrenze ist ein großes Problem für die nationale Sicherheit. Unsere Nachbarn haben mehr als nur einmal deutlich gemacht, dass sie vorhaben, unsere Grenzen zu ihren Gunsten neu zu ziehen. Weitere Befestigungen entlang unserer Grenzen zu errichten, wird jeden potenziellen Feind dazu bringen, es sich zweimal zu überlegen, ob er uns angreift."
 CZE_fate_of_the_ro: "Die Zukunft des Befestigungsrats"
 CZE_fate_of_the_ro_desc: "Der Befestigungsrat ist dafür zuständig, finanzielle Mittel für unser Befestigungsprogramm zu beschaffen. Wenn diese Mittel nicht bald für etwas verwendet werden, wird unser Volk anfangen, Fragen darüber zu stellen, warum man sie überhaupt beschaffte."
 CZE_bop_army_bunker_maintenance: "Aufwand für Instandhaltung der Festungen"
 CZE_bop_army_bunker_maintenance_desc: "Indem wir dafür sorgen, dass unsere Befestigungsanlagen instandgehalten werden und einsatzbereit sind, kann die Armee darauf vertrauen, dass sie im Bedarfsfall bemannbar sind."
 CZE_fortification_research: "Befestigungsforschung"
 CZE_fortification_research_desc: "Es ist klar, dass eine Notwendigkeit besteht, unsere Grenze zu sichern, doch die Frage ist: Wie? Die Forschung wird uns helfen, diese Frage zu beantworten."
 CZE_fortification_research_tt: "Besitzt den Nationalgeist §Y$CZE_directorate_of_fortification_works_no_gd_idea$§!"
 CZE_fortification_research_subtract_variable_tt: "Alle zukünftigen Entscheidungen bezüglich §YBefestigungsprogrammen§! werden §Y30§! Tage weniger benötigen, bis sie §Yabgeschlossen§! sind"
 CZE_fortification_decision_inprogress: "Arbeitet bereits an einem anderen Befestigungsprogramm"
 CZE_second_sudetenland_fortification_program: "Zweites Befestigungsprogramm des Sudetenlands"
 CZE_second_sudetenland_fortification_program_desc: "Das Sudetenland, unsere Gebirgsgrenze zu Deutschland, ist der perfekte Standort für Grenzbefestigungen. Da wir die französische Maginot-Linie studiert haben, können wir selbst eine ähnliche Linie bauen."
 CZE_third_sudetenland_fortification_program: "Drittes Befestigungsprogramm des Sudetenlands"
 CZE_third_sudetenland_fortification_program_desc: "Das Sudetenland besitzt nun eine ordentliche Verteidigungslinie ... aber ordentlich reicht nicht, wenn das Überleben unserer Nation auf dem Spiel steht."
 CZE_fourth_sudetenland_fortification_program: "Viertes Befestigungsprogramm des Sudetenlands"
 CZE_fourth_sudetenland_fortification_program_desc: "Das Sudetenland besitzt eine starke Befestigungslinie, aber sie könnte noch stärker sein!"
 CZE_fortify_the_crossroads_with_slo: "Die Kreuzungen befestigen"
 CZE_fortify_the_crossroads_with_slo_desc: "Jedes Befestigungssystem kann durchbrochen werden. Um uns gegen diese Eventualität zu schützen, können wir um unsere wichtigsten Städte herum Stellungen errichten. Sollte ein Feind unsere Linien durchbrechen, wird dadurch verhindert, dass er unsere Städte mühelos einnimmt."
 CZE_fortify_the_hungarian_border_with_73: "Die ungarische Grenze befestigen"
 CZE_fortify_the_hungarian_border_with_73_desc: "Der ungarische Irredentismus ist eine ständige Gefahr für unsere Nation. Befestigungsanlagen entlang unserer gemeinsamen Grenze würden helfen, unsere Sicherheit zu gewährleisten."
 CZE_fortify_the_polish_border_with_72: "Die polnische Grenze befestigen"
 CZE_fortify_the_polish_border_with_72_desc: "Die polnische Aggression ist hemmungslos. Eine stark befestigte Grenze würde jedoch hoffentlich dazu führen, dass sich die Polen ein einfacheres Ziel suchen."
 ###### ARMY READINESS BALANCE OF POWER ######
 CZE_bop_ready_for_anything: "£GFX_power_balance_texticon Auf alles vorbereitet"
 CZE_bop_ready_for_anything_tt: "Hat NICHT den Nationalgeist"
 CZE_bop_no_divided_nation_tt: "Hat NICHT den Nationalgeist „§Y$CZE_a_divided_nation_dynamic_modifier$§!“"
 CZE_bop_no_agrarians_tt: "$CZE_bop_ready_for_anything_tt$§Y$CZE_agrarian_politics_1$§!"
