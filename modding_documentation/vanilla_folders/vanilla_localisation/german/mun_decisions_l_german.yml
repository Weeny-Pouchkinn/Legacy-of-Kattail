 CZE_embezzle_quatermaster_funds: "£BoP_left_texticon Finanzielle Mittel des Quartiermeisters veruntreuen"
 CZE_embezzle_quatermaster_funds_desc: "Unsere Soldaten sind bereits gut versorgt. Bestimmt würde niemand merken, wenn ein Teil der für unsere Kasernen bestimmten Mittel anderweitig Verwendung fände."
 CZE_prioritize_export_contracts: "£BoP_left_texticon Exportverträge priorisieren"
 CZE_prioritize_export_contracts_desc: "Es war unsere Exportindustrie, die es uns ermöglichte, die Weltwirtschaftskrise zu überstehen. Warum sollten wir das jetzt ändern? Jede Bedrohung für unser Land wird ohnehin übertrieben dargestellt. Unsere Armáda kann es sich leisten, abzuwarten."
 CZE_focus_on_export_designs: "£BoP_left_texticon Auf den Export von Bauplänen konzentrieren"
 CZE_focus_on_export_designs_desc: "Unsere Armáda hat sehr hohe Anforderungen, wenn es um neues Kriegsgerät geht. Der Exportmarkt ist etwas nachsichtiger und unterstützt auch die Finanzierung von Plänen für den heimischen Markt. Eigentlich sollte die Armáda uns also dankbar sein, dass wir so viel Geld für Forschung und Entwicklung sparen. Gern geschehen, Armáda."
 CZE_bop_reservist_training: "£BoP_right_texticon Reservisten ausbilden"
 CZE_junior_officer_recruitment: "£BoP_right_texticon Hauptleute rekrutieren"
 CZE_send_foreign_attaches: "£BoP_right_texticon Attachés ins Ausland entsenden"
 CZE_send_observers_to_the_italo_ethiopian_war: "£BoP_right_texticon Beobachter nach Äthiopien entsenden"
 CZE_send_observers_to_the_italo_ethiopian_war_bonus: "Beobachter zum Italienisch-Äthiopischen Krieg entsenden"
 CZE_send_observers_to_the_italo_ethiopian_war_desc: "Indem wir Personen zu Beobachtungszwecken in Kriege einschleusen und sekundäre Kontakte zu Personen knüpfen, die an den Kämpfen vor Ort beteiligt sind, erhalten wir wertvolle Einblicke in die aktuellsten Militärdoktrinen. Es könnte auch weitere Möglichkeiten eröffnen."
 CZE_send_observers_to_the_italo_ethiopian_war_tt: "Die §Y$CZE_zbrojovka_brno_organization$§! wird Nachforschungen über den Schmuggel von Waffen nach §Y[ETH.getname]§! anstellen"
 CZE_recruit_red_cross_veterans: "£BoP_right_texticon Veteranen des Roten Kreuzes rekrutieren"
 CZE_warehouse_inspections: "£BoP_right_texticon Lagerhallen inspizieren"
 CZE_warehouse_inspections_desc: "Man weiß nicht, was fehlt, bis man nicht nachgesehen hat."
 CZE_construction_telephone_stations: "£BoP_right_texticon Telefonstationen errichten"
 CZE_construction_telephone_stations_desc: "Telefonstationen zwischen unseren Hauptquartieren zu errichten, verbessert die Koordinationsfähigkeiten unseres Oberkommandos erheblich."
 CZE_state_defense_loans: "£BoP_right_texticon Staatliches Verteidigungsdarlehen"
 CZE_live_fire_exercise: "£BoP_right_texticon Übung mit scharfer Munition"
 CZE_live_fire_exercise_desc: "Die Erfahrung, die man durch einen Tag auf dem Schießstand macht, ist unersetzlich."
 CZE_redirect_military_discretionary_spending: "£BoP_left_texticon Ermessensausgaben des Militärs umleiten"
 CZE_redirect_military_discretionary_spending_desc: "Die Mittel können nach Ermessen genutzt werden, und es liegt in unserem Ermessen, sie nicht für das Militär auszugeben."
 CZE_seize_rail_lines: "£BoP_right_texticon Eisenbahnlinien übernehmen"
 CZE_field_exercises: "£BoP_right_texticon Feldübungen"
 CZE_field_exercises_desc: "Nichts ist wertvoller als eine Ausbildung an der Front."
