 CZE_central_european_federation_desc: "Uns verbindet mehr mit unseren Nachbarn, als uns voneinander trennt. Die Gründung einer demokratischen Föderation könnte das Einzige sein, das den Pluralismus in Zentraleuropa angesichts der zahlreichen Elemente, die ihn bedrohen, am Leben erhält."
