 CZE_autonomous_sentiment: "Autonome Bewegung"
 CZE_autonomous_sentiment_desc: "Unser Bündnis mit dem autonomen Block hat uns einige Nachteile eingebracht. Einer davon ist, dass man einen gewissen Grad an Autonomie für [SLO.getname] fordert. Andere Teile unseres Landes könnten eine ähnliche Behandlung wünschen."
