 CZE_a_divided_nation_sudentenland_germans_cooperate: "Die Industrie in §Y[FROM.GETNAME]§! retten"
 CZE_a_divided_nation_sudentenland_germans_cooperate_desc: "Indem wir die lokale Industrie in [FROM.Getname] retten, gewinnen wir rasch unsere politische Unterstützung bei der örtlichen Bevölkerung zurück."
 CZE_a_divided_nation_tesinko_poles: "Integrationsbemühungen in §Y[FROM.getname]§!"
 CZE_a_divided_nation_czech_states: "Bildungsbemühungen in §Y[FROM.getname]§!"
 CZE_a_divided_nation_czech_states_desc: "Der Mangel an Fachkräften behindert das schnelle Wachstum der Industrie im Zentrum unseres Landes. Wir müssen in Programme investieren, die unsere Bevölkerung besser auf die Arbeit in unserer wachsenden Industrie vorbereitet."
 CZE_a_divided_nation_slovakia_states: "Zusätzliche Wirtschaftsinvestitionen in §Y[FROM.getname]§!"
 CZE_a_divided_nation_slovakia_states_desc: "Die bisherigen Investitionen in die Wirtschaft von [FROM.GETNAME] haben nicht ausgereicht, um die Ungleichheit zu überwinden. Weitere Investitionen sind notwendig, um die Situation zu verbessern."
