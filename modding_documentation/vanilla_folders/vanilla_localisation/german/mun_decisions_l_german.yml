 ###### CZECHOSLOVAKIA ######
 CZE_sudeten_promise_mission: "Das sudetische Versprechen"
 CZE_sudeten_promise_mission_desc: "Wir haben versprochen, dem Sudetenland dabei zu helfen, sich von [CZE.GETNAME] loszulösen, indem wir Milizen im Land unterstützen. Sollten wir dieses Versprechen nicht einhalten, würde dies unweigerlich zu einem politischen Rückschlag führen."
 CZE_recall_zdenko_hudecek: "§Y$CZE_zdenko_hudecek$§! zurückrufen"
 CZE_a_divided_nation_category: "Eine gespaltene Nation"
 CZE_a_divided_nation_category_desc: "Seitens verschiedener Bewegungen innerhalb des Landes, die nicht länger ignoriert oder abgetan werden wollen, wächst der Unmut gegenüber der Regierung. Nur wenn wir uns mit dem Problem befassen, können wir die Kräfte schwächen, die das Land zu spalten versuchen. Zumindest für die nahe Zukunft."
 CZE_a_divided_nation_category_tt: "Die Entscheidung „§Y$CZE_a_divided_nation_bridge_the_divide_fake$§!“ wird ausgewählt"
 CZE_a_divided_nation_category_2_tt: "§YAuswirkungen bei Auswahl§!:\nDie Entscheidungen der Kategorie „§Y$CZE_a_divided_nation_category$§!“ werden freigeschaltet, die negative Modifikatoren in unseren §YStaaten§! §Yentfernen§! und gleichzeitig die negativen Modifikatoren des Nationalgeists „§Y$CZE_a_divided_nation_dynamic_modifier$§!“ verringern, bis dieser §Yentfernt§! wird"
 CZE_a_divided_nation_category_3_tt: "Die Entscheidungen der Kategorie „§Y$CZE_a_divided_nation_category$§!“ werden freigeschaltet, die negative Modifikatoren in unseren §YStaaten§! §Yentfernen§! und gleichzeitig die negativen Modifikatoren des Nationalgeists „§Y$CZE_a_divided_nation_dynamic_modifier$§!“ verringern, bis dieser §Yentfernt§! wird"
 CZE_a_divided_nation_fake_category: "Eine gespaltene Nation"
 CZE_a_divided_nation_fake_category_desc: "Seitens verschiedener Bewegungen innerhalb des Landes, die nicht länger ignoriert oder abgetan werden wollen, wächst der Unmut gegenüber der Regierung. Nur wenn wir uns mit dem Problem befassen, können wir die Kräfte schwächen, die das Land zu spalten versuchen. Zumindest für die nahe Zukunft."
 CZE_a_divided_nation_on_map: "Diese Staaten haben Probleme, um die wir uns kümmern müssen"
 CZE_a_divided_nation_bridge_the_divide_fake: "Die Kluft überbrücken"
