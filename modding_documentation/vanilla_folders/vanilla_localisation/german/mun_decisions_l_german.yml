 CZE_crisis_in_the_sudentenland: "Die Sudetenkrise"
 CZE_crisis_in_the_sudentenland_desc: "Im Sudetenland haben Paramilitärs zu den Waffen gegriffen, um einen Partisanenkrieg gegen uns zu führen. Die anhaltenden Kämpfe mit unseren Streitkräften verursachen überall im Land Chaos. Wir müssen die Situation unter Kontrolle bringen, bevor irgendein Feind diese Lage ausnutzen kann."
