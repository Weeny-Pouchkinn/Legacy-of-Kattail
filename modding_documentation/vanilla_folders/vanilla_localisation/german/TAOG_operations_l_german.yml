l_german:
 operation_rescue_general: "Gefangenen Kommandanten retten"
 operation_rescue_general_desc: "§LEiner unserer Kommandanten wurde vom Feind gefangen genommen. Wir müssen einen Rettungseinsatz durchführen.§!"
 free_general_free_in_transit: "Während des Transports befreien"
 free_general_free_in_transit_desc: "Unsere Spione machten eine bevorstehende Übergabe des Ziels aus und erarbeiten einen Plan, um den Transport unterwegs abzufangen und anzugreifen."
 free_general_assault_holding_area: "Gefängniskomplex angreifen"
 free_general_assault_holding_area_desc: "Der Feind hält unseren Kommandanten an einem sicheren Ort gefangen, und unsere Spione konnten diesen Ort ausfindig machen. Sie bereiten einen Angriff vor, um den Gefangenen zu befreien."
 free_general_disguise_and_extract: "Tarnung & Extraktion"
 free_general_disguise_and_extract_desc: "Mit großer Raffinesse verschaffen unsere Spione dem gefangenen Kommandanten eine Verkleidung, die es ihm erlaubt, seine Bewacher zu täuschen und in befreundetes Gebiet zu entkommen."
