 #National Spirits
 CZE_taticek_of_czechoslovakia: "Tatíček Masaryk"
 CZE_taticek_of_czechoslovakia_desc: "Tomáš Masaryk, oft „Tatíček Masaryk“ genannt, was so viel wie „Vater“ (der Nation) bedeutet, ist seit der Gründung der tschechoslowakischen Nation einer ihrer Grundpfeiler. In einer Zeit, in der Koalitionen unmöglich und politische Pattsituationen als unüberwindbar galten, gelang es Masaryk immer wieder, politische Wunder zu vollbringen, die die Tschechoslowakei stärkten. Selbst im Ruhestand werden seine Ansichten und Vorschläge an die politische Führung mehr als Befehl und weniger wie ein Ratschlag aufgefasst."
 CZE_industrialists_veto: "Veto der Industriellen"
 CZE_industrialists_veto_desc: "Die Industriellen üben erheblichen Einfluss auf die Politik des Landes aus, da sie an der Spitze der größten [CZE.GetAdjective]en Konzerne stehen. Ihre Anliegen können in wirtschaftspolitischen Fragen nicht ignoriert werden, und eine wirtschaftliche Mobilisierung gehört zu jenen Maßnahmen, gegen die sie sich am vehementesten wehren werden."
 CZE_agrarian_politics_1: "Agrarpolitik"
 CZE_agrarian_politics_1_desc: "Auch wenn unser Land in der heutigen Zeit einen starken industriellen Charakter hat, besitzen Landwirte und Bauern in vielen politischen Parteien noch immer erheblichen Einfluss. Ihre Meinung beeinflusst oft wirtschaftspolitische Entscheidungen und stellt ein ständiges politisches Hindernis für weitere industrielle Fortschritte dar."
 CZE_directorate_of_fortification_works_no_gd_idea: "Direktion für Befestigungsanlagen"
 CZE_directorate_of_fortification_works_no_gd_idea_desc: "Die $CZE_directorate_of_fortification_works_no_gd_idea$, besser bekannt als ROP, verwaltet und überwacht alle Befestigungsbemühungen im Land."
 CZE_czech_corporatism: "Tschechischer Korporatismus"
 CZE_broken_shield: "Zerbrochener Schild"
 CZE_redirected_fortification_council_funds: "Leitete Mittel aus dem Befestigungsrat um"
 CZE_army_readiness_1: "Unvorbereitete Armee"
 CZE_army_readiness_1_desc: "Die Einsatzbereitschaft einer Armee hängt nicht nur von den Soldaten und der Ausrüstung ab. Wenn man sich Bedrohungen stellen muss, ist es wichtig, Vertrauen in die eigene Vorbereitung zu haben und von der politischen und wirtschaftlichen Führung des Landes unterstützt zu werden. Über die Mittel zum Kämpfen zu verfügen, ist eine Sache, die Fähigkeit, dies effektiv zu tun, eine andere."
 CZE_army_readiness_3: "Vorbereitete Armee"
 CZE_army_readiness_3_desc: "Die Einsatzbereitschaft einer Armee hängt nicht nur von den Soldaten und der Ausrüstung ab. Wenn man sich Bedrohungen stellen muss, ist es wichtig, Vertrauen in die eigene Vorbereitung zu haben und von der politischen und wirtschaftlichen Führung des Landes unterstützt zu werden. Über die Mittel zum Kämpfen zu verfügen, ist eine Sache, die Fähigkeit, dies effektiv zu tun, eine andere."
 CZE_ready_for_anything_idea: "Auf alles vorbereitet"
 CZE_sudeten_german_quandary: "Das Sudetenlanddilemma"
 CZE_sudeten_german_quandary_desc: "Während die Mehrheit der im Sudetenland lebenden Menschen schlicht mehr Autonomie unter der derzeitigen Regierung fordert, könnten die sudetischen Parteien und ihre Anhänger rasch zu einer fünften Kolonne werden, sollte ein deutscher Staat versuchen, einen Teil der Region zu annektieren."
 CZE_sudeten_german_quandary_modifier_tt: "§YPassive Auswirkungen§!:\nWenn §Y[AUS.GetFlag][AUS.GetNonIdeologyName]§!, §Y[GER.GetFlag][GER.GetNonIdeologyName]§! oder ein anderes [BAY.GetFlag]§Ydeutsches Land§! mit einer Grenze zu uns ein §RKriegsziel§! gegen uns erhält, während wir §Y[69.GetName]§!, §Y[972.GetName]§! oder §Y[74.GetName]§! kontrollieren:\n - (§YAlle kontrollierten Staaten im Sudetenland§!):\n    Erhalten „§Y$CZE_sudetenland_paramilitaries_modifier$§!“, was folgende Auswirkungen hat:\n       $MODIFIER_LOCAL_INTEL_TO_ENEMIES$: §R+10%§!\n       $MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$: §R-10.0%§!\n       $modifier_state_repair_speed_bunker_factor$: §R-10.00%§!\n\n - Diese §YAuswirkungen§! können nur einmal auftreten"
 CZE_sudeten_challenge: "Die sudetische Herausforderung"
 CZE_sudeten_challenge_desc: "Die jüngsten Aktivitäten von Milizen im Sudetenland haben viele auf internationaler Ebene davon überzeugt, dass aggressive Maßnahmen gegen uns gerechtfertigt sind! Es wird Zeit brauchen, um die Welt vom Gegenteil zu überzeugen."
 CZE_sudeten_facde: "Die sudetische Fassade"
 CZE_sudeten_facde_desc: "Da wir lokale Milizen nicht unterstützen, werden unsere Maßnahmen gegen [CZE.getname] vom Rest der Welt nur als Fassade angesehen."
