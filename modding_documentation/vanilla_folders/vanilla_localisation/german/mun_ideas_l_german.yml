 CZE_walter_co_desc: "„Walter & Co.“ ist eine informelle Kurzbezeichnung, die sich aus dem vollständigen Namen des Unternehmens ableitet: „Walter Aktiengesellschaft, Automobil- und Flugzeugmotorenfabrik“."
