 CZE_anglo_czechoslovak_bank: "Anglo-Tschechoslowakische Kreditbank Prag"
 CZE_anglo_czechoslovak_bank_desc: "Die im Jahr 1930 aus einer Fusion dreier anderer Geldinstitute mit Sitz in Prag entstandene Kreditbank ist die derzeit zweitgrößte Bank des Landes."
 CZE_praga_aviation: "$CZE_praga_aviation_organization$"
 #Dynamic Modifiers National Spritits
 CZE_ceskoslovenska_armada_dynamic_modifier: "Československá Armáda"
 CZE_ceskoslovenska_armada_dynamic_modifier_desc: "Die Armáda setzt sich als Armee aus den Überresten der tschechischen Einheiten Österreich-Ungarns sowie den Veteranen der Tschechoslowakischen Legionen zusammen. Das Vermächtnis dieser beiden Truppenverbände beeinflusst noch immer die Art und Weise, wie die Armáda geführt wird."
 CZE_ceskoslovenske_letectvo_dynamic_modifier: "Československé Letectvo"
 CZE_ceskoslovenske_letectvo_dynamic_modifier_desc: "Die Flugzeuge mögen nicht immer einsatzbereit sein, doch unsere Piloten sind es. Angesichts möglicher Bedrohungen von allen Seiten müssen wir unseren Luftraum zu unserem Meer machen. Jeder einzelne Pilot muss so viel zählen wie drei."
 CZE_a_divided_nation_dynamic_modifier: "Geteilte Nation"
 CZE_a_divided_nation_dynamic_modifier_desc: "Die [CZE.GetAdjective]e Nation musste sich als pluralistischer Staat in der Mitte Europas schon immer allein behaupten. Die Weltwirtschaftskrise hat dies jedoch geändert. Die wirtschaftliche Not hat dazu geführt, dass verschiedene Bewegungen innerhalb des Landes die Regierung immer mehr ablehnen - und diese Ablehnung hat zu einer tiefen Spaltung geführt."
 CZE_skoda_works_dynamic_modifier: "Škoda-Werke"
 CZE_skoda_works_dynamic_modifier_desc: "Das Unternehmen Škoda übt Einfluss auf die Produktion, geplante Bauvorhaben und Investitionen in allen Bereichen unserer Schwerindustrie auf. Sein Einfluss kennt innerhalb unseres Landes keine Grenzen."
 CZE_ceskoslovenske_alecne_lodstvo_dynamic_modifier: "Československé válečné loďstvo"
 #Dynamic State Modifiers
 CZE_sudetenland_german_state_modifier: "Sudetischer Separatismus"
 CZE_sudetenland_german_state_modifier_desc: "Die Wirtschaftskrise hat die Industrie im Sudetenland schwer getroffen, und die in der Region lebenden Menschen geben nun der [ROOT.GetAdjective]en Regierung die Schuld dafür."
 CZE_tesinko_polish_state_modifier: "Polnischer Separatismus"
 CZE_czech_state_modifier: "Mangel an fähigen tschechischen Arbeitern"
 CZE_czech_state_modifier_desc: "Die rasche Industrialisierung des 20. Jahrhunderts hat die überwiegend landwirtschaftlich geprägte tschechische Bevölkerung stark in Mitleidenschaft gezogen, und es ist oft schwierig, offene Stellen mit qualifizierten tschechischen Arbeitskräften zu besetzen. Wir müssen unsere jüngste Generation auf die sich verändernden Anforderungen einer modernen Wirtschaft vorbereiten."
