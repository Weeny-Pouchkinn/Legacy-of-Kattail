 PEACE_FOR_OUR_TIME: "Peace for Our Time"
 THUNDER_AT_OUR_GATES: "Thunder at Our Gates"
 DLC_DESCRIPTION_dlc018: "Neue Nationaler-Schwerpunkt-Bäume und Ereignisse für Kanada, Australien, Neuseeland, das Raj (Indien) und Südafrika. Ein Speerspitze-Schlachtplan, der mehr Kontrolle über große Einkesselungen und das Durchbrechen feindlicher Linien bietet."
 DLC_DESCRIPTION_dlc020: "Vier neue Nationaler-Schwerpunkt-Bäume: Erleben Sie den Krieg aus den unterschiedlichen Blickwinkeln von Ungarn, Rumänien, der Tschechoslowakei und Jugoslawien."
 DLC_DESCRIPTION_dlc022: "Modifizierte Schwerpunkt-Bäume für Deutschland und Japan: Für zwei zentrale Achsenmächte gibt es jetzt alternative Geschichtspfade, darunter auch die Chance, Hitler abzusetzen oder den Kommunismus oder die Demokratie in Japan zu installieren."
 DLC_DESCRIPTION_dlc023: "Erhalten Sie neue Schiffsmuster, Admiralseigenschaften und -fähigkeiten, Amphibienfahrzeuge und Seeminen. Sichern Sie Ihre Hoheitsgewässer und Schiffsrouten gegen Gefahren ab. Enthält neue Schwerpunkt-Bäume für die Niederlande, Großbritannien, Mexiko und die USA."
 DLC_DESCRIPTION_dlc028: "La Résistance führt Geheimagenten, Spionagemissionen und neue Optionen für Widerstandsbewegungen ein. Schicken Sie Agenten in gefährliches Gebiet, um feindliche Geheimnisse zu entschlüsseln oder den Boden für Ihre Invasion vorzubereiten, indem Sie machthungrige Kollaborateure unterstützen."
 DLC_DESCRIPTION_dlc031: "Ergänzt dedizierte Nationaler-Schwerpunkt-Bäume für die kleineren Mächte am Schwarzen Meer und der Ägäis. Bulgarien, Griechenland und die Türkei können jeweils einzigartige historische und alternative Pfade einschlagen, während sie den Bemühungen der Großmächte trotzen, die strategischen Seewege am Bosporus und bei den Dardanellen zu dominieren."
 DLC_DESCRIPTION_dlc034: "No Step Back sorgt für einen höheren Detailgrad bei vielen osteuropäischen Nationen, ergänzt einzigartige Spielsysteme, welche die sowjetische Politik widerspiegeln, und bietet zahlreiche Verbesserungen der militärischen Aspekte des Spiels."
 DLC_DESCRIPTION_dlc036: "Errichten Sie ein neues Großreich, wehren Sie sich gegen fremde Aggressoren oder erkunden Sie die Grenzen der Neutralität. „By Blood Alone“ fügt Italien, Äthiopien und der Schweiz neue alternative Geschichtsstränge und Spielvarianten hinzu und enthält viele weitere Änderungen an Spielsystemen."
 DLC_DESCRIPTION_dlc038: "Schreiben Sie mit den nordischen Ländern Geschichte, indem Sie mit den Großmächten Europas um die Zukunft der Welt kämpfen. Die neuen nationalen Fokusbäume für Finnland, Schweden, Dänemark und Norwegen stehen dabei im Mittelpunkt. Spezialisieren Sie Ihre Rüstungsindustrie, um die Effizienz zu erhöhen, und verkaufen Sie die produzierten Waffen anschließend auf dem neuen internationalen Markt."
 DLC_DESCRIPTION_dlc040: "Trial of Allegiance fügt dem Spiel umfangreiche Schwerpunktbäume für Brasilien, Argentinien, Chile, Uruguay und Paraguay hinzu. Die Stabilität eines ganzen Kontinents steht auf Messers Schneide. Öffnen Sie eine neue Front im Krieg, während Sie Ihre europäischen Wohltäter mit Ihrem wertvollsten Gut umwerben: ihrer Loyalität."
 DLC_DESCRIPTION_dlc043: "Entwickelt Prototyp-Technologien und Waffen und setzt diese gegen eure Feinde ein. Führt Überfälle auf ihre Forschungsstandorte, Dämme und Wahrzeichen aus und zerstört sie. Nutzt die neuen und aktualisierten Schwerpunktbäume, um den Inneren Kreis Deutschlands für eure Ziele zu nutzen, das Habsburger-Reich als Österreich oder Ungarn wiederaufzubauen oder die Vielseitigkeit Belgiens und seiner Kolonie Belgisch-Kongo zu erleben."
 DLC_DESCRIPTION_dlc046: "„Graveyard of Empires“ gibt dem Iran, Raj, Irak und Afghanistan einzigartige Schwerpunktbäume. Mindert den Einfluss externer Mächte auf die Region und lasst den gefallenen Stolz Eurer Nation wiederaufleben, während Ihr danach strebt, den Nahen Osten und Südasien zu beherrschen."
 DLC_DESCRIPTION_dlc049: "Beschreitet in „No Compromise, No Surrender“, einer Erweiterung für Hearts of Iron IV, neue Wege in der Geschichte Japans, Chinas und der Philippinen. Erlangt noch mehr Kontrolle über die Fraktionen, entwickelt neue Militärdoktrinen und entscheidet über das Schicksal des Pazifiks und darüber hinaus."
 DLC_DESCRIPTION_dlc051: "Baut das alte Königreich Böhmen wieder auf, bildet eine Union der mitteleuropäischen Staaten, errichtet Befestigungsanlagen, um das Land zu verteidigen, oder schmiedet mit dem Schwerpunktbaum für die Tschechoslowakei ein Netzwerk aus Verbündeten in „Peace for Our Time“."
 DLC_DESCRIPTION_dlc052: "Übernehmt das Oberkommando, indem Ihr Eure Generäle an die Front entsendet und Eure erfolgreichsten Schiffskapitäne mit Medaillen auszeichnet. Wehrt als Australien die japanische Invasion in Südostasien ab; errichtet als Siam ein neues Kaiserreich und bestimmt über die Zukunft Indonesiens, ganz egal, ob mit oder ohne niederländische Herrschaft."
