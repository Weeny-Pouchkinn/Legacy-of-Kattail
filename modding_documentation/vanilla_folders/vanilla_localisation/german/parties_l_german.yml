 emperor_fascism: "Kaiserlicher Faschismus"
 emperor_fascism_desc: "Der Kaiserliche Faschismus, der meist als „Faschismus von oben“ bezeichnet wird, ist eine Form des Ultranationalismus, in der die Massen kein Mitspracherecht haben. Die Herrschaft liegt in den Händen des Militärs und der aristokratischen Verwaltung, die den Kaiser des Landes - einen Monarchen, der als unfehlbare göttliche Figur angesehen wird - mit großer Ehrfurcht behandeln."
 japan_militarism_ideology: "Militarismus"
 japan_militarism_ideology_desc: "Der Militarismus ist eine Ideologie, in der der Staatschef nur nominell die Kontrolle ausübt. Er ist weniger Politiker, sondern vielmehr eine Marionette des Militärs und treibt dessen Agenda einer raschen Expansionspolitik voran."
 buddhist_socialism: "Buddhistischer Sozialismus"
 buddhist_socialism_desc: "Der buddhistische Sozialismus, auch dhammischer oder Natursozialismus genannt, ist eine politische Ideologie, die einen Sozialismus anpreist, welcher auf den Prinzipien des Buddhismus beruht. Buddhismus und Sozialismus streben danach, das Leid zu beenden, indem sein Wesen analysiert und seine Hauptursachen in der Praxis entfernt werden. Beide streben zudem nach einer Transformation des persönlichen Bewusstseins, um der menschlichen Entfremdung und Selbstsucht ein Ende zu setzen."
