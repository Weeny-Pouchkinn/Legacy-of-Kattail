 seawolf: "Seewolf"
 seawolf_desc: "Der Seewolf ist besonders geschickt bei Konvoiüberfällen."
 superior_tactician: "Überragender Taktiker"
 superior_tactician_desc: "Ein Meister für Flottenpositionierung."
 old_guard: "Alte Garde"
 old_guard_desc: "Wenn auch nicht der brillanteste Offizier, so sorgt er kaum für Ärger."
 old_guard_navy: "Alte Garde"
 old_guard_navy_desc: "Wenn auch nicht der brillanteste Offizier, so sorgt er zumindest kaum für Ärger."
 trickster: "Schlitzohr"
 trickster_desc: "Das Unvorhergesehene im Kampf zu tun, kann Ihnen einen großen Vorteil verschaffen."
 logistics_wizard: "Logistikgenie"
 logistics_wizard_desc: "Der Nachschub ist weder zu spät, noch zu früh; er kommt genau dann an, wann ich will."
 defensive_doctrine: "Defensivdoktrin"
 defensive_doctrine_desc: "Besonders geschickt im Verteidigungskampf."
 offensive_doctrine: "Offensivdoktrin"
 offensive_doctrine_desc: "Stärker auf die Offensive ausgerichtet als die meisten anderen."
 winter_specialist: "Winterspezialist"
 winter_specialist_desc: "Besitzt ein intuitives Verständnis für die Schwierigkeiten des Kampfes unter kalten Bedingungen."
 trait_engineer: "Pionier"
 trait_engineer_desc: "Erfahren bei Flussüberquerungen und beim Bau von Feldbefestigungen."
 fortress_buster: "Festungsknacker"
 fortress_buster_desc: "Der Angriff auf eine Befestigung schreckt diesen Offizier nicht ab."
 panzer_leader: "Panzerkommandant"
 panzer_leader_desc: "Ein Naturtalent bei der Handhabung von Panzern und mechanisierten Streitkräften."
 commando: "Kommando"
 commando_desc: "Geschickt bei amphibischen Operationen, Luftangriffen und bei kaltem Wetter - der Kommando ist ein Mann mit vielen Talenten."
 fast_planner: "Schneller Planer"
 fast_planner_desc: "Kennt alle Abkürzungen, wenn es darum geht, sich für die Schlacht zu rüsten - Effizienz ist der Schlüssel!"
 thorough_planner: "Gründlicher Planer"
 thorough_planner_desc: "Ein strategisches Genie. Der gut durchdachte Plan ist auf lange Sicht der stärkste Plan."
 organisational_leader: "Organisator"
 organisational_leader_desc: "Kennt jeden Trick, um schneller als jeder andere Verstärkung zu beschaffen."
 inspirational_leader: "Charismatisch"
 inspirational_leader_desc: "Der geborene Anführer. Wer einem mächtigen Anführer folgt, der ist bereit, sich seinen größten Ängsten zu stellen."
 desert_fox: "Wüstenfuchs"
 desert_fox_desc: "Fühlt sich beim Kampf in der Wüste pudelwohl."
 swamp_fox: "Sumpffuchs"
 swamp_fox_desc: "Auch wenn er etwas durchnässt ist, so kennt der Sumpffuchs doch seinen Weg durch Sümpfe und Moore."
 trait_mountaineer: "Gebirgsjäger"
 trait_mountaineer_desc: "Ein ausgezeichneter Kletterer und geschickt in der Gebirgskriegsführung."
 hill_fighter: "Hügelkämpfer"
 hill_fighter_desc: "Zeichnet sich im Kampf in hügeligem Gelände aus."
 jungle_rat: "Dschungelratte"
 jungle_rat_desc: "Lässt sich nicht von Nagetieren ungewöhnlicher Größe abschrecken und ist erfahren in der Dschungelkriegsführung."
 ranger: "Waldjäger"
 ranger_desc: "Waldjäger gehen voran. Vor allem, was den Kampf in Waldgebieten betrifft."
 urban_assault_specialist: "Häuserkampf-Spezialist"
 urban_assault_specialist_desc: "Ein Experte im Häuserkampf und für Chaos in den Straßen."
 blockade_runner: "Blockadebrecher"
 blockade_runner_desc: "Fähig, sich schnell aus Seegefechten zu lösen."
 spotter: "Aufklärer"
 spotter_desc: "Der Aufklärer achtet besonders darauf, feindliche Schiffe im Auge zu behalten."
 fly_swatter: "Fliegenfänger"
 fly_swatter_desc: "Der Fliegenfänger ist sich der Gefahr bewusst, die Flugzeuge selbst für unsere mächtigsten Schiffe darstellen, und erledigt alles, was fliegt."
 ironside: "Ironside"
 ironside_desc: "Entschlossen, unsere Heimatgewässer mit den mächtigsten Schiffen zu verteidigen, die unsere Marine aufbringen kann."
 air_controller: "Fluglotse"
 air_controller_desc: "Als Experte in dem noch jungen Bereich der Marineluftfahrt ist der Fluglotse die naheliegendste Wahl zum Befehligen von Flugzeugträgern."
 naval_invader: "Invasor"
 naval_invader_desc: "Ein Experte bei der Durchführung von Flotteninvasionen. Der perfekte Kerl, um eine Invasion eines feindlichen Strandes vorzubereiten und sie auszuführen."
 bearer_of_artillery: "Artillerieträger"
 bearer_of_artillery_desc: "Lass niemals eine Kiste fallen!"
