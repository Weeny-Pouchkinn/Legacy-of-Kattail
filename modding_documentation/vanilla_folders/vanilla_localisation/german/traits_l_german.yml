 FIN_personal_agenda_svinhufvud_tt: "§GSozialismus abschaffen§!: Weniger als §Y1%§! Unterstützung für demokratische und kommunistische Ideologien zu haben, erhöht das £GFX_power_balance_texticon §Yöffentliche Vertrauen§!.\n  - §RBezüglich der Unterstützung für Sozialisten§!: Mehr als §Y9%§! Unterstützung für demokratische und kommunistische Ideologien haben, reduziert das £GFX_power_balance_texticon §Yöffentliche Vertrauen§!.\n  - $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_kallio_tt: "§GExtremisten beseitigen§!: Weniger als §Y1%§! Unterstützung für faschistische und kommunistische Ideologien zu haben, erhöht das £GFX_power_balance_texticon §Yöffentliche Vertrauen§!.\n  - §RBezüglich der Unterstützung für Extremisten§!: Mehr als §Y9%§! Unterstützung für faschistische und kommunistische Ideologien haben, reduziert das £GFX_power_balance_texticon §Yöffentliche Vertrauen§!.\n  - $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_ryti_tt: "§GTraum von Großfinnland§!: Finnische Kernstaaten zu besetzen, die sich im Besitz eines Feindes befinden, erhöht das £GFX_power_balance_texticon §Yöffentliche Vertrauen§!.\n  - §RBezüglich der Unterstützung für die Sozialisten§!: Mehr als §Y9%§! Unterstützung für demokratische und kommunistische Ideologien haben, reduziert das £GFX_power_balance_texticon §Yöffentliche Vertrauen§!.\n  - $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_mannerheim_tt: "§GVerlässliches Staatsoberhaupt§!: Sich im Krieg zu befinden, erhöht das £GFX_power_balance_texticon §Yöffentliche Vertrauen§!.\n  - §RErnannter Regent§!: Im Frieden zu sein, verringert das £GFX_power_balance_texticon §Yöffentliche Vertrauen§!."
 FIN_personal_agenda_paasikivi_tt: "§GKonservativer Realismus§!: Mehr als §Y95%§! £GFX_stability_texticon $stability$ zu haben, erhöht das £GFX_power_balance_texticon §Yöffentliche Vertrauen§!.\n  - §RInterim§!: Weniger als §Y60%§! £GFX_stability_texticon $stability$ zu haben, reduziert das £GFX_power_balance_texticon §Yöffentliche Vertrauen§!.\n  - $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_annala_tt: "§GStarke Nation§!: Mehr als §Y300.000§! £GFX_manpower_texticon $MANPOWER$ auf dem Feld und weniger als §Y5%§! Kapitulationsfortschritt in einem Krieg zu haben, erhöht das £GFX_power_balance_texticon §Yöffentliche Vertrauen§!.\n- §RBezüglich der Unterstützung für Sozialisten§!: Mehr als §Y9%§! Unterstützung für demokratische und kommunistische Ideologien zu haben, reduziert das £GFX_power_balance_texticon §Yöffentliche Vertrauen§!.\n- $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_tanner_tt: "§GVereinte Nation§!: §YKarjala§! und jeden im Besitz befindlichen Staat zu kontrollieren, während die demokratische Ideologie mehr als §Y95%§! Unterstützung hat, erhöht das £GFX_power_balance_texticon §Yöffentliche Vertrauen§!.\n- §RBezüglich der Unterstützung für Extremisten§!: Mehr als §Y9%§! Unterstützung für faschistische und kommunistische Ideologien zu haben, reduziert das £GFX_power_balance_texticon §Yöffentliche Vertrauen§!.\n- $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_aaltonen_tt: "§GAntifaschistischer Kreuzzug§!: Mehr als §Y10%§! Kriegsbeitrag in allen aktiven Kriegen und weniger als §Y5%§! Kapitulationsfortschritt in einem Krieg gegen ein faschistisches Land zu haben, erhöht das £GFX_power_balance_texticon §Yöffentliche Vertrauen§!.\n - §RGeteiltes Proletariat§!: Weniger als §Y80%§! Unterstützung für die kommunistische Ideologie zu haben, reduziert das £GFX_power_balance_texticon §Yöffentliche Vertrauen§!.\n - $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_leino_tt: "§GAuslöschung des europäischen Faschismus§!: Weniger als §Y1%§! Unterstützung für die faschistische Ideologie zu haben, während Europa frei von faschistischen Regierungen ist, erhöht das £GFX_power_balance_texticon §Yöffentliche Vertrauen§!.\n- §RGeteiltes Proletariat§!: Weniger als §Y80%§! Unterstützung für die kommunistische Ideologie zu haben, reduziert das £GFX_power_balance_texticon §Yöffentliche Vertrauen§!.\n- $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_kuusinen_tt: "§GVielzahl von Organisationen§!: Wenn alle §Yskandinavischen§! und §Ybaltischen§! Kernstaaten von Finnland oder einem Verbündeten gehalten werden, erhöht sich das £GFX_power_balance_texticon §Yöffentliche Vertrauen§!.\n- §RVergessenes finnisch-karelisches Volk§!: §YKarjala§!, §YKola§!, §YOnega§! und §YOlonets§! nicht zu kontrollieren, reduziert das £GFX_power_balance_texticon §Yöffentliche Vertrauen§!.\n- $losing_soverignty_threatened_tt$"
