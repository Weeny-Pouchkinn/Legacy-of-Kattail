l_german:
 #Shortcuts
 CZE_military_path_shortcut: "Streitkräfte"
 CZE_economic_path_shortcut: "Wirtschaft"
 CZE_diplomacy_path_shortcut: "Diplomatie"
 CZE_fort_path_shortcut: "Befestigungen"
 CZE_skoda_priority_shortcut_name: "Škoda-Priorität"
 CZE_political_path_shortcut: "Politik"
 # Č does show when scrolling through focuses, but not in the detailed focus view title (does work in the description though)
 CZE_coalition_building: "Koalitionsbildung"
 CZE_coalition_building_desc: "Die nach den Wahlen entstandene Koalition muss eine größere Einigkeit unter ihren Mitgliedern anstreben, wenn sie effektiv arbeiten soll. Der kürzliche Rücktritt von Jan Malypetr als Premierminister erhöhte den Druck auf die Große Koalition, ihre Unterstützung zu festigen, nur umso mehr."
 CZE_merge_the_paramilitaries: "Die paramilitärischen Gruppen zusammenlegen"
 CZE_merge_the_paramilitaries_desc: "Es gibt unzählige verschiedene paramilitärische Gruppierungen in unserem Land. Wenn wir sie jemals militärisch einsetzen wollen, müssen wir sie zwingen, sich zusammenzuschließen."
 CZE_integrated_paramilitaries: "Paramilitärische Gruppen integrieren"
 CZE_integrated_paramilitaries_desc: "Das Militär mag diese Idee zwar nicht besonders gutheißen, doch wir stärken unsere Reserve, wenn wir die paramilitärischen Gruppen in unser Militär integrieren."
 CZE_wielding_the_hammer: "Den Hammer schwingen"
 CZE_wielding_the_hammer_desc: "Wir können unsere Zweidrittelmehrheit in der Nationalversammlung nutzen, um den Gesetzgebungsprozess zu beschleunigen. Es ist unerlässlich, dass wir das Chaos innerhalb unserer Legislative beseitigen."
 CZE_emergency_measures: "Notmaßnahmen"
 CZE_emergency_measures_desc: "Indem wir Notmaßnahmen ergreifen, um die zahlreichen Krisen unseres Landes zu bewältigen, und gleichzeitig einige dieser Maßnahmen nutzen, um jene genauer im Auge zu behalten, die unserer Regierung gegenüber ideologisch unzuverlässig sein könnten, können wir die vor uns liegenden Herausforderungen besser bewältigen."
 CZE_king_of_the_castle: "König des Schlosses"
 CZE_king_of_the_castle_desc: "Wir alle wissen, wer in unserer Regierung wirklich das Sagen hat. In dieser Zeit der Unsicherheit müssen wir aufhören, etwas vorzugeben, und zulassen, dass $CZE_edvard_benesh$ eine direktere Rolle übernimmt. Die Sicherheit unseres Landes hängt davon ab."
 CZE_closer_ties_with_the_moderate_germany_parties: "Die gemäßigten Parteien des Sudetenlands versammeln"
 CZE_closer_ties_with_the_moderate_germany_parties_desc: "Einige Parteien des Sudetenlands sind bereit, mit unserer Koalition zusammenzuarbeiten. Wir sollten unsere Beziehungen zu ihnen vertiefen."
 CZE_complete_reconciliation: "Vollständige Versöhnung"
 CZE_complete_reconciliation_desc: "Wir haben uns immer wieder darum bemüht, Vertrauen aufzubauen, und es ist endlich an der Zeit, uns mit unseren Landsleuten zu versöhnen."
 CZE_complete_reconciliation_cooldown_flag: "Hat den Schwerpunkt „§Y$CZE_closer_ties_with_the_moderate_germany_parties$§!“ abgeschlossen"
 CZE_complete_reconciliation_cooldown_flag_tt: "Übrige Tage: [?CZE_complete_reconciliation_cooldown_flag:days|Y0]"
 CZE_bastion_of_liberty: "Bastion der Freiheit"
 CZE_bastion_of_liberty_desc: "Wir haben uns in diesem Jahrzehnt als eines der wenigen wirklich pluralistischen Länder in Europa östlich des Rheins bewiesen. Lasst uns dafür sorgen, dass die Menschen das nicht vergessen."
 CZE_standing_against_the_storm: "Dem Sturm trotzen"
 CZE_standing_against_the_storm_desc: "Trotz unserer Unzulänglichkeiten und der möglicherweise mangelhaften Vorbereitung werden wir uns jeder Herausforderung stellen und dem kommenden Sturm trotzen."
 CZE_truth_prevails: "Die Wahrheit siegt"
 CZE_truth_prevails_desc: "Selbst im Anblick großer Widrigkeiten und unmöglicher Aufgaben glaubt unser Volk fest daran, dass unser Landesmotto „Die Wahrheit siegt“ am Ende wahr werden wird. Suche die Wahrheit, höre die Wahrheit, und sie wird siegen."
 CZE_negotiations_with_the_autonomous_bloc: "Verhandlungen mit dem autonomen Block"
 CZE_negotiations_with_the_autonomous_bloc_desc: "Wenn wir eine Koalition bilden wollen, die Benes' Legion von Lakaien in der Nationalversammlung keine Macht einräumen muss, müssen wir mit dem autonomen Block zusammenarbeiten. Es könnte uns jedoch einiges kosten, seine uneingeschränkte Unterstützung zu gewinnen."
 CZE_slovakia_autonomy_agreement: "Slowakisches Autonomieabkommen"
 CZE_slovakia_autonomy_agreement_desc: "Damit die autonomen Blöcke mit unserer Koalition zusammenarbeiten, mussten wir ein Autonomieabkommen unterzeichnen. Das ist zwar ein hoher Preis, aber unserer Verpflichtung nicht nachzukommen, wäre weitaus schlimmer."
 CZE_slovakia_autonomy_agreement_tt: "§Y[RUT.getname]§! wird dieselben Zugeständnisse fordern, die wir §Y[SLO.getname]§! gewährten!"
 CZE_slovakia_autonomy_agreement_2_tt: "Wenn dieser Schwerpunkt ausgewählt wird, wird „$CZE_the_autonomous_bloc_demands$“ um §Y35 Tage§! verzögert."
 CZE_topple_the_king: "Den König stürzen"
 CZE_topple_the_king_desc: "Der Einfluss, den $CZE_edvard_benesh$ auf unsere Regierung ausübt, ist erdrückend und seine Macht ist größer, als es seine Position als Präsident normalerweise zulassen würde, da er über eine große Anzahl loyaler Anhänger im Parlament verfügt. Die Bedingungen sind derzeit günstig für uns, weshalb wir die Gelegenheit nutzen könnten, um seinen Einfluss in der Horní Komora abzuschwächen."
 CZE_comprise_with_the_carpathians: "Einen Kompromiss mit den Karpaten eingehen"
 CZE_comprise_with_the_carpathians_desc: "Die Region Ruthenien strebt ein ähnliches Föderationsabkommen an wie das, das wir mit [SLO.getname] trafen. Dies würde jedoch unsere Position in der Region und in [9.getname] erheblich schwächen. Einen Kompromiss mit der Region auszuarbeiten, ist besser, als ihren Forderungen vollständig nachzugeben."
 CZE_the_rut_demands_add_35_CZE_comprise_with_the_carpathians_tt: "Wenn dieser Schwerpunkt ausgewählt wird, wird „$CZE_the_rut_demands$“ um §Y35 Tage§! verzögert."
 CZE_cut_carpathia_loose: "Die Karpaten loslassen"
 CZE_cut_carpathia_loose_desc: "Da die Slowakei nun zu einem Bundesstaat gemacht wurde, hofft die Region Ruthenien ein ähnliches Abkommen aushandeln zu können. Auch wenn dieser Vorschlag auf den ersten Blick unvernünftig erscheint, wäre es schwierig, sie zu kontrollieren, wenn die Slowakei nicht unter unserer direkten Kontrolle stünde. Vielleicht sollten wir ihren Forderungen einfach nachgeben?"
 CZE_compromise_with_the_veteran_agrarian: "Einen Kompromiss mit den Veteranen der Agrarpartei eingehen"
 CZE_compromise_with_the_veteran_agrarian_desc: "Die alte Garde der Agrarpartei behindert das Wachstum unserer städtischen Wählerschaft. Wir müssen Kompromisse mit ihr eingehen, um das zu erreichen, was wir wollen."
 CZE_reorient_the_broad_coalition: "Die breite Koalition neu ausrichten"
 CZE_reorient_the_broad_coalition_desc: "Die breite Koalition stellt bereits seit vielen Jahren die Regierung. Die unzähligen politischen Parteien, aus denen sie zusammengesetzt ist, haben die Koalition in letzter Zeit jedoch etwas schwerfällig gemacht. Eine Neuausrichtung der Politik und der Politik ihrer Minister ist längst überfällig."
 CZE_leverage_sokol: "Die Sokol-Bewegung"
 CZE_leverage_sokol_desc: "Die Sokol-Bewegung ist seit Jahrzehnten eine wichtige Organisation in unserem Land, und besonders in Krisenzeiten können wir sie nutzen, um Rekruten für unsere Armee zu gewinnen und ihnen eine paramilitärische Ausbildung zu geben."
 CZE_urbanist_policies: "Urbanistenpolitik"
 CZE_deepend_ties_with_the_trademans: "Verbindungen zur Handelspartei vertiefen"
 CZE_deepend_ties_with_the_trademans_desc: "Die Handelspartei ist bei den Wählern der städtischen Mittelschicht beliebt. Indem wir sie stärken und mit ihr zusammenarbeiten, punkten wir bei den städtischen Wählern, ohne unsere Wählerbasis auf dem Land zu vegraulen."
 CZE_apart_but_togather: "Getrennt, aber dennoch zusammen"
 CZE_apart_but_togather_desc: "Unsere Regionen haben heute mehr Autonomie als je zuvor, aber wir sind auch stärker als je zuvor. Wir sind bereit, uns jeder Herausforderung zu stellen."
 CZE_contact_henlein: "Kontakt zu Henlein aufbauen"
 CZE_contact_henlein_desc: "$CZE_konrad_henlein$ ist unserer Regierung bereits seit Jahren ein Dorn im Auge. Angesichts der jüngsten Ereignisse auf internationaler Ebene könnte es nun jedoch nötig sein, den Dialog mit ihm aufzunehmen."
 CZE_contact_henlein_cooldown_flag: "Hat den Schwerpunkt „§Y$CZE_no_compromise_with_the_sdp$§!“ abgeschlossen"
 CZE_contact_henlein_cooldown_flag_tt: "Übrige Tage: [?CZE_contact_henlein_cooldown_flag:days|Y0]"
 CZE_contact_henlein_focus_warning_tt: "Sobald wir „§Y$CZE_no_compromise_with_the_sdp$§!“ abschließen, müssen wir §Y350 Tage§! warten, bevor wir diesen §YNationalen Schwerpunkt§! annehmen können"
 CZE_contact_henlein_focus_order_warning_tt: "Wenn wir „§Y$CZE_no_compromise_with_the_sdp$§!“ nach dem Abschluss dieses §YNationalen Schwerpunkts§! abschließen, wird §Y$CZE_konrad_henlein$§! in den Ruhestand treten"
 CZE_no_compromise_with_the_sdp: "Die SdP weiterhin ausschließen"
 CZE_no_compromise_with_the_sdp_desc: "Die SdP hat unserer Koalition nichts zu bieten. Sie versucht lediglich, politische Spannungen zu schüren und die Maßnahmen unserer Regierung zu diskreditieren. Im Namen einer guten Regierungsführung sollte sie weiterhin von jeder Koalitionsbildung ausgeschlossen bleiben."
 CZE_no_compromise_with_the_sdp_cooldown_flag: "Hat den Schwerpunkt „§Y$CZE_contact_henlein$§!“ abgeschlossen"
 CZE_no_compromise_with_the_sdp_cooldown_flag_tt: "Übrige Tage: [?CZE_no_compromise_with_the_sdp_cooldown_flag:days|Y0]"
 CZE_no_compromise_with_the_sdp_focus_warning_tt: "Sobald wir „§Y$CZE_contact_henlein$§!“ abschließen, müssen wir §Y350 Tage§! warten, bevor wir diesen §YNationalen Schwerpunkt§! annehmen können"
 # CZE_economic_integration: "Economic Integration"
 # CZE_economic_integration_desc: "Why stop at a customs union? Economic integration will further grow our economies and ensure our future is an affluent one for all members."
 CZE_form_a_federation: "Eine Föderation gründen"
 CZE_form_a_federation_desc: "Der Traum einer mitteleuropäischen Föderation ist nicht mehr unerreichbar. Wir sind in der Position, eine solche Föderation zu gründen und zu einem Giganten der Demokratie zu werden, der die Macht besitzt, sich selbst den Großmächten zu widersetzen."
 CZE_bend_the_bars: "$ITA_bend_the_bars$"
 CZE_bend_the_bars_desc: "$GER_european_confederation_desc$"
 CZE_reassure_the_army: "Die Armee besänftigen"
 CZE_reassure_the_army_desc: "Die Armee ist wegen einiger unserer jüngsten Entscheidungen und der Politik der Regierung nervös. Es ist an der Zeit, ihr zu versichern, dass wir ihr zur Seite stehen, ganz egal, was die Regierung sagt oder tut."
 CZE_outreach_to_the_western_powers: "Weiter an die Westmächte annähern"
 CZE_outreach_to_the_western_powers_desc: "Die westlichen Demokratien sagen, sie unterstützen uns, doch wir müssen sicherstellen, dass ihren Worten auch Taten folgen, wenn es darauf ankommt."
 CZE_demand_guarantees: "Stärkere Garantien fordern"
 CZE_demand_guarantees_desc: "Auch wenn wir Verträge und Bündnisse haben, müssen wir dennoch sicherstellen, dass uns unsere Partner in einer Zeit der Not nicht im Stich lassen, nur weil es für sie einfacher ist. Wir brauchen etwas Stärkeres als eine Garantie."
 CZE_guardian_of_central_europe: "Beschützer von Mitteleuropa"
 CZE_guardian_of_central_europe_desc: "Wir befinden uns nun in der Position, uns zum Beschützer der demokratischen Werte im Zentrum Europas zu erklären. Wir können Nationen verteidigen, die sich nicht selbst verteidigen können, und dafür sorgen, dass die Demokratie stark bleibt."
 CZE_central_european_faction: "Suzeränität über Mitteleuropa"
 CZE_central_european_faction_desc: "Wir konzentrieren uns zwar darauf, selbst stark zu sein, anstatt uns auf diplomatische Partner zu verlassen, doch es ist auch entscheidend, dass wir unseren Einfluss nicht überstrapazieren. Es könnte an der Zeit sein, unseren Blick nach außen zu richten."
 CZE_strike_at_the_heart_of_bolshevism: "[THIS.GetAntiSovietFocusName]"
 CZE_strike_at_the_heart_of_bolshevism_1: "Das Herz des Bolschewismus angreifen"
 CZE_strike_at_the_heart_of_bolshevism_2: "Die Ostflanke sichern"
 CZE_strike_at_the_heart_of_bolshevism_desc: "[SOV.GetNameDefCap] breitet sich aus, und dies ist eine existenzielle Bedrohung für Europa und unser Land. Wir müssen zu einem Bollwerk gegen diese Bewegung werden."
 CZE_destroy_the_fascist_threats: "Die faschistische Bedrohung beseitigen"
 CZE_destroy_the_fascist_threats_desc: "[CZE_get_fascist_threats_desc]"
 CZE_destroy_the_fascist_threats_desc_enemy_ger: "Wir alle wissen, wer die größte Bedrohung für Frieden in Europa darstellt. [GER.getnamedefCAP] muss aufgehalten werden, und das lieber früher als später. Und wenn sich niemand dazu bereit erklärt, können wir sehr wohl derjenige sein, der diese Aufgabe übernimmt."
 CZE_destroy_the_fascist_threats_desc_backup: "Zu unserer eigenen Sicherheit müssen wir sicherstellen, dass unsere Nachbarländer keiner expansionistischen Rhetorik folgen, die sich früher oder später gegen uns richten könnte."
 CZE_peace_on_our_time: "Frieden in unserer Zeit"
 CZE_peace_on_our_time_desc: "Wir haben auf europäischer Ebene in internationalen Beziehungen viel zu lange eine untergeordnete Rolle gespielt. Doch das wird sich jetzt ändern! Wir stehen auf eigenen Beinen und können unsere Bedingungen stellen. Sei es durch Krieg oder Frieden."
 CZE_reach_out_for_military_assistance: "Um militärische Unterstützung bitten"
 CZE_free_tuka: "$CZE_vojtech_tuka$ befreien"
 CZE_free_tuka_desc: "Die Gefängnisstrafe von $CZE_vojtech_tuka$ ist verbüßt, und anstatt einen Vorwand zu erfinden, um seine Strafe zu verlängern, könnten wir ihn termingerecht freilassen und ihn in unserer Regierung einsetzen. Es ist besser, ihn für uns arbeiten zu lassen, als dass er gegen uns vorgeht."
 CZE_grow_the_anglo_czechoslovak_prague_credit_bank: "Die Anglo-Tschechoslowakische Bank"
 CZE_grow_the_anglo_czechoslovak_prague_credit_bank_desc: "Die Anglo-Tschechoslowakische Bank ist eine der wichtigsten Triebfedern unserer Industrie. Ohne ihre Mittel wären wir nicht in der Lage, das große Exportgeschäft nachhaltig zu betreiben, das wir aktuell haben. Wenn wir neue Filialen in New York gründen und die Verbindungen zu [ENG.GetName] vertiefen würden, könnte die Bank noch größer werden, als sie es ohnehin schon ist. Zudem hätte [ENG.GetName] dann Interesse an unserem fortwährenden Bestand als Staat."
 CZE_feeding_the_alligator: "Das Krokodil füttern"
 CZE_feeding_the_alligator_desc: "Die Pläne, die [GER.GetName] für das Sudetenland hat, bedrohen die Existenz unserer Nation. Wenn wir den Deutschen geben, was sie wollen, lassen sie uns vermutlich in Frieden. Oder nicht?"
 CZE_complete_capitulation: "Vollständige Kapitulation"
 CZE_complete_capitulation_desc: "Was bleibt uns übrig, als nachzugeben? Wir können dem Sturm nicht trotzen, der sich am Horizont zusammenbraut. Wenn wir eine Vereinbarung mit [GER.GetName] schließen, solange wir noch ansatzweise Argumente haben, lassen uns die Deutschen vielleicht noch ein wenig Unabhängigkeit unter ihrem Joch."
 CZE_stabilize_the_protectorate: "Das Protektorat stabilisieren"
 CZE_stabilize_the_protectorate_desc: "Das Protektorat ist alles andere als stabil. Wir müssen daran arbeiten, unsere Bevölkerung davon zu überzeugen, dass wir eine legitime Regierung sind und uns um ihre Bedürfnisse kümmern können."
 CZE_stabilize_the_protectorate_unretire_henlein_tt: "Holt §Y$CZE_konrad_henlein$§! aus §Y[ROOT.GetName]§! wieder aus dem Ruhestand."
 CZE_full_faith_in_hacha: "Vollstes Vertrauen in Hácha"
 CZE_full_faith_in_hacha_desc: "$CZE_emil_hacha$ genießt bei unserer Bevölkerung deutlich mehr Beliebtheit und Respekt als $CZE_emanuel_moravec$. Seine Arbeit mag suspekt sein, aber man kann eine beliebtere Galionsfigur nicht einfach ersetzen."
 CZE_moravecs_bohemia: "Moravecs Böhmen"
 CZE_moravecs_bohemia_desc: "Gerüchte grassieren, dass $CZE_emil_hacha$ versucht, unsere neue Regierung zu untergraben. Wenn wir unter unseren aktuellen Bedingungen Erfolg haben und wachsen wollen, brauchen wir eine Führung, die mehr der Ideologie unserer Herren entspricht."
 CZE_form_the_government_army: "Die Regierungsarmee gründen"
 CZE_form_the_government_army_desc: "Wenn unser Land Erfolg haben soll, müssen wir eine neue Armee ins Leben rufen, die nicht die Mängel der alten übernimmt. Sie muss eine Führung haben, die politisch mit ihrer Regierung übereinstimmt."
 CZE_forced_administration_of_companies: "Zwangsverwaltung von Unternehmen"
 CZE_forced_administration_of_companies_desc: "Trotz massiver Aufsucht agieren einige Unternehmen nach wie vor außerhalb unserer Kontrolle. Es ist an der Zeit, dass wir sie in unsere Verwaltung zwingen."
 CZE_revisit_custom_union_talks: "Zollunion-Gespräche neu aufnehmen"
 CZE_revisit_custom_union_talks_desc: "Die Zollunion-Gespräche sind mit einigen unserer Nachbarn deutlich schlechter gelaufen als mit anderen. Es ist an der Zeit, sie neu aufzunehmen und ein weiteres Mal zu versuchen, eine Zollunion zwischen unseren Ländern ins Leben zu rufen."
 CZE_revisit_custom_union_talks_tt: "Wir werden sie auf §Yandere Weise§! überzeugen können, sich uns anzuschließen."
 CZE_revisit_custom_union_talks_2_tt: "Die Wahrscheinlichkeit steigt, dass sie unsere Forderungen annehmen werden, sich unserer Föderation anzuschließen"
 CZE_reintegrate_cross_border_rail_connections: "Grenzüberschreitende Bahnverbindungen verbessern"
 CZE_reintegrate_cross_border_rail_connections_desc: "Das Verbessern der Bahnverbindungen zwischen uns und unseren Nachbarn wäre eine gute Gelegenheit, in ihrer Gunst zu steigen. Dies gilt umso mehr, wenn wir die wirtschaftlichen Verbindungen zwischen uns und ihnen ausbauen möchten."
 CZE_reintegrate_cross_border_rail_connections_flag: "Grenzüberschreitende Bahnverbindungen wurden verbessert"
 CZE_vonapo_20: "VONAPO 20"
 CZE_vonapo_20_desc: "Nicht nur wir erkennen die zunehmende Gefahr durch [GER.GetName]. Daher wurde ein Plan formuliert, in Zusammenarbeit mit [SOV.GetName] Informationen zu dieser Gefahr zu sammeln, damit wir die [GER.GetAdjective]en Ambitionen besser vereiteln können."
 CZE_increase_funding_from_moscow: "Finanzierung durch [SOV.capital.GetCapitalVictoryPointName] erhöhen"
 CZE_increase_funding_from_moscow_desc: "Die [Root.GetCommunistParty] ist derart unterfinanziert, dass sie ihre Miete derzeit von den Gehältern ihrer Abgeordneten bezahlt. Wenn wir wachsen wollen, müssen wir [SOV.GetName] um mehr Mittel bitten, mit denen wir unsere Zeitung in Umlauf bringen und mehr Mitglieder rekrutieren können."
 CZE_zdenek_fierlinger_tt: "Berater §Y$CZE_zdenek_fierlinger$§! ernennen"
 CZE_expand_the_communist_press: "Die kommunistische Presse ausbauen"
 CZE_expand_the_communist_press_desc: "Unsere Zeitung „Rotes Gesetz“ könnte als Informationsmittel für jene dienen, die derzeit noch keine Zeitung lesen. Sie bräuchte dazu nur etwas mehr Geld."
 CZE_anti_rearmament_propaganda: "Anti-Wiederbewaffnungs-Propaganda"
 CZE_anti_rearmament_propaganda_desc: "Durch den Sturz der faschistischen Regierung unseres Hauptfeindes [GER.GetNonIdeologyName] können wir mit Stolz behaupten, mit unserem Standpunkt bezüglich der militärischen Aufrüstung von Anfang an recht gehabt zu haben."
 CZE_anti_democratic_propaganda: "Antidemokratische Propaganda"
 CZE_anti_democratic_propaganda_desc: "Wenn wir Unterstützung für unsere Partei generieren möchten, müssen wir die Fehler der letzten Regierungen der Republik betonen und zeigen, wie wir mit der Situation besser umgegangen wären."
 CZE_form_workers_brigades: "Arbeitermiliz gründen"
 CZE_form_workers_brigades_desc: "Die Arbeiter, die wir befreien, müssen bereit sein, am Kampf teilzunehmen. Auch wenn sie keine ausgebildeten Soldaten sind, können sie dennoch je nach ihrem Beruf als Spezialisten agieren."
 CZE_kohler_faction: "Die Köhler-Fraktion"
 CZE_kohler_faction_desc: "Die Fraktion von Bruno Köhler ist der Ansicht, dass ein gewaltsamer Sturz der Bourgeoisie nötig ist, um einen erfolgreichen kommunistischen tschechoslowakischen Staat gründen zu können."
 CZE_gottwald_faction: "Die Gottwald-Fraktion"
 CZE_gottwald_faction_desc: "Die stalinistische Fraktion von Klement Gottwald, die Moskau absolut treu ergeben ist, verfolgt eine Vision von einem tschechoslowakischen Staat nach dem Vorbild der UdSSR."
 CZE_zapotocky_faction: "Die Zápotocký-Fraktion"
 CZE_zapotocky_faction_desc: "Die Gründer der kommunistischen Partei, Bohumir Šmeral und Antonin Zápotocký, stellten sich eine gemäßigtere Politik vor als die, die Klement Gottwald der Partei aufgezwungen hat. Wir müssen zu diesen Wurzeln zurückkehren, um wirklich alle [CZE.GetAdjective]en Völker anzusprechen."
 CZE_ally_with_moderate_socialists: "Mit gemäßigten Sozialisten zusammenarbeiten"
 CZE_ally_with_moderate_socialists_desc: "Möglicherweise haben nicht alle Länder einen Wahlerfolg des Kommunismus oder Liebe zu [SOV.GetLeader]. Daher sollten wir in Erwägung ziehen, mit gemäßigteren Bewegungen zusammenzuarbeiten."
 CZE_democracies_willing_to_join_faction_tt: "§YDemokratische Nationen werden eher bereit sein, unserem kommunistischen Bündnis beizutreten§!"
 CZE_limited_cooperation: "Begrenzte Zusammenarbeit mit [SOV.GetLeader]"
 CZE_limited_cooperation_desc: "Obschon es ideologische Differenzen gibt, könnte [SOV.GetNameDef] unseren Wert als Partner anerkennen und pragmatische Vereinbarungen eingehen, selbst wenn man uns in den eigenen Zeitungen verunglimpft."
 CZE_denounce_stalinism: "Den Stalinismus denunzieren"
 CZE_denounce_stalinism_desc: "Der Ruf des Kommunismus wird auf ewig befleckt sein von den Ungerechtigkeiten Stalins. Es ist an der Zeit, dass wir militärische Maßnahmen ergreifen, um das Volk unter Regimes wie dem seinen zu befreien."
 CZE_country_leader_has_ideology_stalinism_tt: "Staatsoberhaupt hat die Ideologie §Y$stalinism$§!"
 CZE_cooperate_with_tito: "Mit Tito zusammenarbeiten"
 CZE_cooperate_with_tito_desc: "[YUG.GetNameDefCap] versucht sich wie wir an einer pragmatischen Version des Kommunismus und versucht ebenfalls wie wir, die verschiedensten Leute unter dem roten Banner zu vereinen. Bei diesen Herausforderungen sollten wir auf militärischer und politischer Ebene zusammenarbeiten."
 CZE_reduce_divided_nation_cost_tt: "Verringert Kosten und Dauer der meisten Entscheidungen der Kategorie „§YEine gespaltene Nation§!“."
 CZE_balkan_union: "Die Union erweitern"
 CZE_balkan_union_desc: "Obwohl mehr Nationen in der Region nun den Kommunismus akzeptieren, können wir uns ohne starke Zusammenarbeit nicht gegen die Großmächte schützen. Eine Union wäre der effektivste Weg, dies zu erreichen."
 CZE_cooperation_with_the_ussr: "Zusammenarbeit mit [SOV.GetLeader]"
 CZE_cooperation_with_the_ussr_desc: "Selbst die eifrigsten Befürworter von [SOV.GetName] in der Parteiführung sind sich nach dem Besuch des Landes der Mängel der dortigen Kollektivierung mehr als bewusst. Dennoch würde eine Zusammenarbeit auf dem Gebiet der Kollektivierung bedeuten, dass wir sorgfältig untersuchen können, was schiefgelaufen ist und was funktioniert hat - und wie wir die Ergebnisse am besten für [ROOT.GetName] nutzen."
 CZE_exchange_military_expertise: "Austausch militärischen Fachwissens"
 CZE_exchange_military_expertise_desc: "[SOV.GetNameDefCap] hat wie die meisten Mächte mit bedeutsamer Armee mit militärischen Taktiken und Strategien experimentiert. Wir sollten diese Nation bitten, ihr Wissen mit uns zu teilen, und wir können ihr im Gegenzug das unsere zukommen lassen."
 CZE_pressure_romania: "Rumänien unter Druck setzen"
 CZE_pressure_romania_desc: "[ROM.GetNameDefCap] könnte eine erhebliche Gefahr darstellen, wenn das Land sich mit unseren Feinden verbündet, und möglicherweise unsere Verbindung zu [SOV.GetName] stört oder unsere Feinde mit wertvollem Öl versorgt. Mit [SOV.GetAdjective]er Unterstützung sind wir gefährlich genug, um sie potenziell ohne einen Krieg auf Linie zu bringen."
 CZE_facility_in_state_tt: "Wenn es keine anderen §YExperimentellen Standorte§! in $STATE|Y$ gibt, erhalten wir §G1§! $FACILITY_TYPE|Y$ in $STATE|Y$"
 CZE_spread_the_revolution: "Die Revolution verbreiten"
 CZE_spread_the_revolution_desc: "Nach der erfolgreichen Revolution in [ROOT.GetName] sollten wir nun das Proletariat im Ausland ermutigen, für seine Freiheit zu kämpfen. Dieses Unterfangen können wir unterstützen."
 CZE_agrarian_reform: "Die Landbehörde wieder ins Leben rufen"
 CZE_agrarian_reform_desc: "Die kürzlich aufgelöste Landbehörde war verantwortlich für die Umverteilung hauptsächlich landwirtschaftlich genutzter Flächen. Es ist an der Zeit, diese Institution für drastischere Maßnahmen zu reformieren."
 CZE_realign_the_church: "Staatlicher Atheismus"
 CZE_realign_the_church_desc: "Die Religion ist seit viel zu langer Zeit ein Element, das die [CZE.GetAdjective]en Völker spaltet. Wir müssen ihren Einfluss auf staatliche Angelegenheiten wie Bildung und die Nachrichten mindern und eine Gesellschaft schaffen, die besser zusammenhält."
 CZE_create_a_secret_police_branch: "Einen Ableger der Geheimpolizei einrichten"
 CZE_create_a_secret_police_branch_desc: "Um Stabilität zu gewährleisten, müssen wir uns gegen Feinde von innen und von außen verteidigen, da es dauern wird, bis die Bevölkerung sich an das neue System gewöhnt - zudem dieses erst noch perfektioniert werden muss."
 CZE_promote_urbanization: "$ARG_promote_urbanization$"
 CZE_promote_urbanization_desc: "Durch den erfolgreichen Aufbau von Genossenschaftsbetrieben können wir nun ein Programm schaffen, um einen Teil der Landbevölkerung in die Städte zu holen und dort die Produktivität zu steigern."
 CZE_confiscate_church_lands: "Kirchlichen Grundbesitz beschlagnahmen"
 CZE_confiscate_church_lands_desc: "Die Kirche kontrolliert weit mehr Land und Reichtum, als sie für ihre Zwecke braucht. Wir müssen einen Teil dieser Ländereien umverteilen, wie wir es auch bei den Bauern taten."
 CZE_change_the_narrative: "Das Narrativ ändern"
 CZE_change_the_narrative_desc: "Obwohl die Kirche unsere Revolution bisher nicht unterstützt, könnte es eine wichtige Rolle beim Schaffen von Unterstützung für das neue Regime spielen, wenn wir unsere Werte an die ihren anpassen."
 CZE_the_second_fortification_program: "Das zweite Befestigungsprogramm beginnen"
 CZE_the_second_fortification_program_desc: "Das erste Befestigungsprogramm legte das Fundament für den Aufbau einer Verteidigung. Um der Zukunft unserer Nation willen müssen wir das zweite Befestigungsprogramm schnellstmöglich beginnen und unsere Linien ausbauen und weiterentwickeln."
 CZE_redirect_the_fortification_councils_funds: "Mittel aus dem Befestigungsrat umleiten"
 CZE_redirect_the_fortification_councils_funds_desc: "Diese Befestigungsprogramme sind eine enorme Belastung für unsere Wirtschaft. Die Mittel wären besser bei der Finanzierung verschiedener Programme aufgehoben. Die Armee braucht ohnehin nicht noch mehr Verteidigungsanlagen - sie hat schon mehr als genug."
 CZE_jachymov_uranium_mine: "Uranmine Jáchymov"
 CZE_jachymov_uranium_mine_desc: "Die Minen in Jáchymov dienen schon lange als Quelle für Uran und andere Erze. Allerdings hatten wir vor den aktuellen Entwicklungen im Bereich der Physik kaum Verwendung für Uran."
 CZE_skoda_internal_competition: "Internen Wettbewerb fördern"
 CZE_skoda_internal_competition_desc: "Innerhalb eines so großen Unternehmens wie Škoda ist es schwierig, alle stets auf Höchstleistung arbeiten zu lassen. Wenn wir den internen Wettbewerb fördern, erhöhen wir die Mitarbeiterleistung in unseren Fabriken."
 CZE_skoda_max_optimization_tt: "Die höchstmögliche Optimierungsstufe für den §YŠkoda-Schwerpunkt§! wird auf 7 erhöht"
 CZE_skoda_increase_cooperation: "Zusammenarbeit innerhalb von Škoda verbessern"
 CZE_skoda_increase_cooperation_desc: "Wenn wir besser werden wollen, könnten wir unsere Leistung erhöhen, indem wir die Zusammenarbeit zwischen den Fabriken intensivieren. Dies könnte auch dazu führen, dass Fachwissen zwischen unseren Standorten geteilt wird."
 CZE_skoda_fast_optimization_tt: " Rate, mit der sich die £GFX_prod_eff_cap Optimierungsstufe des §YŠkoda-Schwerpunkts§! mit der Zeit bis zur Maximalstufe erhöht: §G+100%§!"
 CZE_master_of_armaments: "Meister der Rüstungsindustrie"
 CZE_master_of_armaments_desc: "Die Škoda-Werke sind seit den Tagen der österreichisch-ungarischen Monarchie der größte Waffenhersteller innerhalb unserer Landesgrenzen. Die Erfahrung und das Wissen dieses Unternehmens sind unter den Industriekonzernen unseres Landes unübertroffen. Es ist an der Zeit, dass wir ihm den Titel „Meister der Rüstungsindustrie“ verleihen."
 CZE_only_the_best_is_good_enough: "Nur das Beste ist gut genug."
 CZE_only_the_best_is_good_enough_desc: "Die Škoda-Werke förderten schon immer eine starke Arbeitsmoral und regten zur Innovation an. Unsere Gründer hielten sich stets an das Motto: „Nur das Beste ist gut genug für unsere Kunden!“ Dieses Motto gilt heute mehr denn je."
 CZE_an_industrial_legacy: "Industrielles Vermächtnis"
 CZE_an_industrial_legacy_desc: "Die Industrie unseres Landes hat eine Produktionsleistung entwickelt, die zuvor unmöglich erschien. Wir können nun endlich unser industrielles Erbe antreten. Wir sind die unübertroffene Industriemacht Europas."
 CZE_powerhouse_of_europe: "Machtzentrum Europas"
 CZE_powerhouse_of_europe_desc: "Die ganze Welt beneidet uns um unsere Industrie. Wir müssen nur sicherstellen, dass wir stets genug Energie haben."
 CZE_supply_fighters_for_allies: "Alliierte mit Jagdflugzeugen versorgen"
 CZE_supply_fighters_for_allies_desc: "Die [FRA.GetAdjective]e und die [ENG.GetAdjective]e Regierung sind sehr besorgt darüber, dass [GER.GetAdjective]e Flugzeuge kurzen Prozess mit ihren Verteidigungsanlagen machen und sich ihren Städten zuwenden könnten, wenn es zu einem Konflikt käme. Daher könnten wir ihre Luftwaffe stärken, um ihnen ein wenig Vertrauen in ihre Fähigkeit zu schenken, der [GER.GetAdjective]en Expansion die Stirn zu bieten, ohne übermäßig Verluste zu erleiden."
 CZE_allies_more_likely_to_defend_us_tt: "§YHöhere Wahrscheinlichkeit, dass die Alliierten uns gegen den deutschen Expansionismus im Sudetenland unterstützen§!"
 CZE_allies_more_likely_to_defend_us_2_tt: "§YBedeutend höhere Wahrscheinlichkeit, dass die Alliierten uns gegen den deutschen Expansionismus im Sudetenland unterstützen§!"
 CZE_allies_more_likely_to_defend_us_3_tt: "§YEtwas höhere Wahrscheinlichkeit, dass die Alliierten uns gegen den deutschen Expansionismus im Sudetenland unterstützen§!"
 CZE_establish_the_state_defense_guard: "Die Staatsgarde gründen"
 CZE_german_nonagressionpact: "Haushofer-Krofta-Pakt"
 CZE_german_nonagressionpact_desc: "Verhandlungen bezüglich eines Nichtangriffspakts mit [GER.GetName] liefen schon eine Weile. Jedoch sind sie angesichts von Zeichen von Instabilität in [SOV.GetName] und neuer expansionistischer Pläne zum Erliegen gekommen. Da [GER.GetNameDef] derzeit mit anderen Feinden beschäftigt ist, müssen wir versuchen, diese Pläne wiederaufzunehmen."
 CZE_revive_the_czechoslovak_legion_dynamic: "[CZE_revive_the_czechoslovak_legion]"
 CZE_revive_the_czechoslovak_legion_default: "Die Tschechoslowakische Legion wiederaufbauen"
 CZE_revive_the_czechoslovak_legion_communist: "Freiwilligenorganisation ins Leben rufen"
 CZE_revive_the_czechoslovak_legion_dynamic_desc: "Einmal mehr braut sich Unfrieden in der Welt zusammen, und die tapferen Soldaten von [ROOT.GetName] stehen bereit, ihr Vaterland zu verteidigen. Doch wie die Vergangenheit bewies, müssen unsere Truppen ihr Heimatland mitunter im Ausland verteidigen, und so müssen wir einmal mehr jene finden, die bereit sind, ihr Zuhause zu verlassen, eben um es zu beschützen."
 CZE_revive_the_czechoslovak_legion_nsb_tt: "„§Y$CZE_legacy_of_the_czechoslovak_legion_army_spirit$§! “ wird von einem §YNationalgeist der Armee§! zu einem §Yallgemeinen Nationalgeist§! umgewandelt"
 CZE_state_sponsored_recruitment_for_spain: "Staatlich geförderte Rekrutierung für Spanien"
 CZE_state_sponsored_recruitment_for_spain_desc: "Da es einen neuen Konflikt gibt, bei dem sein Einschreiten eine entscheidende Rolle spielen könnte, sollten wir das erfahrene Freiwilligenkorps von [ROOT.GetName] ermutigen, sich jener Seite anzuschließen, die am ehesten unserer Politik entspricht. Vielleicht lernen wir dabei sogar etwas über Fortschritte in der Kriegsführung im letzten Jahrzehnt."
 CZE_support_spain_reward_tt: "§YEffekte, falls eine spanische Fraktion Freiwillige von uns hat, wenn sie gewinnt oder verliert:§!"
 CZE_profit_off_the_spanish_civil_war: "Vom Spanischen Bürgerkrieg profitieren"
 CZE_profit_off_the_spanish_civil_war_desc: "Der Spanische Bürgerkrieg wird immer mehr zu einem Stellvertreterkrieg der Großmächte. Wir dürfen das Leben unserer tapferen Truppen nicht für einen solchen Konflikt riskieren. Er ist jedoch die perfekte Gelegenheit, den Aufbau unserer Industrie zu finanzieren, indem wir Waffen verkaufen - vielleicht sogar an beide Seiten."
 CZE_skoda_sell_weapons_to_SPR_tt: "Schaltet die Entscheidungskategorie „§YInsgeheim Waffen an [FROM.GetName] verkaufen§!“ frei"
 CZE_placate_benes_faction: "Der Beneš-Fraktion nachgeben"
 CZE_placate_benes_faction_desc: "$CZE_milan_hodza$ muss sich der Tatsache stellen, dass er als Außenminister kläglich versagt hat. $CZE_edvard_benesh$ ist bereit, mit seinen Unterstützern innerhalb der Agrianer die Position von $CZE_milan_hodza$ als Premierminister zu stärken, solange er sein Amt als Außenminister aufgibt."
 CZE_claim_lands_of_the_bohemian_crown: "Land der Krone von Böhmen fordern"
 CZE_claim_lands_of_the_bohemian_crown_desc: "Da unsere Nation in den vergangenen Jahrhunderten ein Teil des Grenzlandes verschiedener Großreiche war, wurden unsere Grenzen basierend auf Konflikten verschoben, nicht nach dem Willen der Bewohner. Nun ist es an der Zeit, diese Verschiebungen zu korrigieren."
 CZE_demand_katowice: "[762.GetName] fordern"
 CZE_demand_katowice_desc: "Wenn wir die Kontrolle über [762.GetName] erlangten, könnten wir nicht nur unsere ehemaligen Grenzen wiederherstellen, sondern auch den [POL.GetAdjective]en Anspruch auf [72.GetName] schwächen."
 CZE_fight_over_silesia: "Um Schlesien kämpfen"
 CZE_fight_over_silesia_desc: "Schlesien mag rechtmäßig [ROOT.GetAdjective]es Land sein, aber ein offener Krieg gegen [66.owner.GetName] wäre nicht wünschenswert. Daher müssen wir unsere Stärke mit einem großen Grenzgefecht demonstrieren. Wenn [66.owner.GetNameDef] nicht bereit ist, Schlesien zu verteidigen, könnten wir so das Land ohne einen ausgewachsenen Krieg gewinnen."
 CZE_dismantle_poland: "[POL.GetNonIdeologyName] abbauen"
 CZE_dismantle_poland_desc: "Da nun offenkundig ist, dass [POL.GetNameDef] sich nicht verteidigen kann, kann das Land auch keinen zuverlässigen Pufferstaat gegen unsere Feinde abgeben. Wir sollten daher versuchen, unseren eigenen Staat zu stärken."
 CZE_proclaim_the_restoration_of_bohemia: "Wiederherstellung des Königreichs Böhmen verkünden"
 CZE_proclaim_the_restoration_of_bohemia_desc: "Unsere alten Grenzen sind wiederhergestellt, und nun können wir unser Erbe antreten und uns darauf konzentrieren, unsere neuen Lande zu integrieren."
 CZE_integrate_lost_territories: "Verlorene Territorien integrieren"
 CZE_integrate_lost_territories_desc: "Die historischen Lande des Königreichs Böhmen erstrecken sich von der Ostsee bis zur Adria. Es ist an der Zeit, diese Geschichte wiederaufleben zu lassen und unsere neuen Besitztümer zu integrieren."
 CZE_deepen_ties_with_puppet_kingdoms: "Verbindungen zu Marionettenstaaten vertiefen"
 CZE_deepen_ties_with_puppet_kingdoms_desc: "Obwohl wir nun eine klare Interessensphäre haben, müssen wir unseren eigenen Einfluss noch vergrößern, um optimal von diesen zugehörigen Nationen zu profitieren."
 CZE_poland_alliance_monarchist: "Abkommen mit [POL.GetNonIdeologyName]"
 CZE_poland_alliance_monarchist_desc: "$CZE_ally_poland_desc$"
 CZE_a_strong_poland: "Ein starkes [POL.GetNonIdeologyName]"
 CZE_a_strong_poland_desc: "[POL.GetNameDefCap] verfügt über eine der stärksten Armee Osteuropas und hat das Zeug zum wertvollen Verbündeten."
 CZE_mend_balkan_relations: "Beziehungen auf dem Balkan wiederherstellen"
 CZE_facilitate_a_strong_hungary: "Ein starkes Ungarn ermöglichen"
 CZE_facilitate_a_strong_hungary_desc: "Seit das Land die Unabhängigkeit erlangte, pflegt [HUN.GetNameDef] eine unstete Beziehung zu uns. Da jedoch ein Konflikt aufzieht, könnten wir uns vielleicht mit dieser Nation verbünden."
 CZE_subjegate_romania: "Rumänien unter Druck setzen mit [HUN.GetAdjective]en Ansprüchen"
 CZE_subjegate_romania_desc: "Die Ansprüche unserer [HUN.GetAdjective]en Marionette sind ein nützliches Werkzeug gegen [ROM.GetName]. Wenn wir drohen, [HUN.GetName] seine Ansprüche auf [ROM.GetAdjective]es Territorium durchsetzen zu lassen - und das mit unserer Unterstützung -, könnten wir vielleicht die Angleichung von [ROM.GetName] fordern."
 CZE_demanded_overlordship_HUN: "Unterworfenes Ungarn"
 CZE_demanded_overlordship_ROM: "Unterworfenes Rumänien"
 CZE_integrate_hungary: "Ehemalige österreichische Territorien integrieren"
 CZE_integrate_hungary_desc: "Da wir eine erhebliche Interessensphäre etablierten, könnten wir durch eine Integration des neu erweiterten [HUN.GetName] und anderer Territorien die Grenzen von Österreich-Ungarn wiederherstellen, aber unter [ROOT.GetAdjective]er Führung."
 CZE_subjegate_serbia: "[YUG.GetName] unterwerfen"
 CZE_subjegate_serbia_desc: "Das nun geschwächte [YUG.GetName] kann unsere Südflanke nicht mehr als effektiver Pufferstaat verteidigen. Nach der Integration Sloweniens sollten wir nun nach weiterer Expansion streben."
 CZE_strike_the_eastern_threat: "Gegen die östliche Bedrohung vorgehen"
 CZE_strike_the_eastern_threat_desc: "Die scheinheilige Nation namens [SOV.GetName], die die eigenen Großmachtambitionen durch Kritik an unserer Regierung rechtfertigt, stellt eine existenzielle Bedrohung für [CZE.GetName] dar und muss eliminiert werden."
 CZE_assist_austria: "[AUS.GetName] beschützen"
 CZE_assist_austria_desc: "[AUS.GetName] aus Konflikten herauszuhalten, ist essenziell für unsere nationale Sicherheit. Die [AUS.GetAdjective]e Grenze ist eine der Schwachstellen unserer Verteidigung. Die Wirtschaft unseres Nachbarn wäre außerdem ein wertvolles Gut für unsere Feinde. Das können wir nicht zulassen."
 CZE_return_to_democracy: "Rückkehr zur Demokratie"
 CZE_return_to_democracy_desc: "Da unsere Heimat nun geschützt ist, wird der Bevölkerung zunehmend klar, dass eine Militärdiktatur nicht länger produktiv ist. Es ist daher an der Zeit, Wahlen abzuhalten und die Macht einer demokratischen, zivil geführten Regierung zurückzugeben."
 CZE_cooperate_with_the_allies: "Mit den Alliierten zusammenarbeiten"
 CZE_cooperate_with_the_allies_desc: "Die Region ist nun stabiler als zuvor, und wir sollten uns bemühen, die Beziehungen zu unseren traditionellen Verbündeten zu verbessern."
 CZE_eliminate_austrian_defeatists: "[AUS.GetAdjective]e Defätisten besiegen"
 CZE_eliminate_austrian_defeatists_desc: "[AUS.GetNameDefCap] ist nicht länger bereit, seinen Staat zu verteidigen. Wir müssen einschreiten, bevor unsere Feinde vor unserer Tür stehen."
 CZE_the_legacy_of_ottokar: "Ottokars Vermächtnis"
 CZE_the_legacy_of_ottokar_desc: "Der legendäre König Ottokar II. erweiterte das böhmische Reich mit Genehmigung des österreichischen Adels nach Österreich und bis zur Adriaküste. Wir müssen uns einmal mehr an die Österreicher wenden, Adlige wie Gemeine."
 CZE_demand_the_istrian_peninsula: "Die Istrische Halbinsel fordern"
 CZE_demand_the_istrian_peninsula_desc: "Der mangelnde Zugang zum Meer ist für den Handel und den Einfluss von [ROOT.GetName] bereits seit einiger Zeit ein großes Hindernis. Wir dürfen nicht zulassen, dass unsere Wirtschaft weiterhin von unseren Nachbarn abhängig ist. Wir müssen Zugang zur Adria fordern."
 CZE_demand_slovenia: "Slowenien fordern"
 CZE_demand_slovenia_desc: "Slowenien war einst ein edler Teil des Kaisertums Österreich, und da wir nun die Kontrolle über den Kern dieses Großreichs erlangt haben, müssen wir danach streben, unser Territorium einmal mehr zurückzuholen."
 CZE_demand_overlordship_of_yugoslav_league: "Herrschaft über das [YUG.GetAdjective]e Bündnis fordern"
 CZE_demand_overlordship_of_yugoslav_league_desc: "Obwohl wir so gut wie [YUG.GetName] wissen, dass lokale Autonomie in einer multiethnischen Nation mitunter erforderlich ist, ist ihre Allianz nun zu schwach, um sich zu verteidigen. Wir müssen dafür sorgen, dass [YUG.GetNameDef] das erkennt und uns ein Eingreifen gestattet."
 CZE_expand_the_rome_protocols: "Die Römer Protokolle erweitern"
 CZE_expand_the_rome_protocols_desc: "Unsere neue Regierung passt deutlich besser zu der in [ITA.capital.GetCapitalVictoryPointName] als zu der in [GER.capital.GetCapitalVictoryPointName]. Da es Meinungsverschiedenheiten zwischen diesen beiden Staaten bezüglich Österreich gibt, könnte [ITA.GetNameDef] durch Beitritt zu den Römer Protokollen das Selbstvertrauen gewinnen, das es braucht, um auf dem derzeitigen Kurs zu bleiben und sich nicht [GER.GetName] zuzuwenden."
 CZE_prague_protocols: "Die Prager Protokolle"
 CZE_soviet_alliance: "Das Allianzabkommen von 1935 erweitern"
 CZE_soviet_alliance_desc: "Das aktuelle Allianzabkommen mit der [SOV.GetAdjective]en Führung ist viel zu schwammig formuliert. Wir können uns nicht sicher sein, ob sie uns wirklich beisteht, wenn wir angegriffen werden. Daher müssen wir sie um einen neuen Vertrag bitten, wenn wir unsere Sicherheit garantieren möchten."
 CZE_airlift_soviet_support: "Sowjetische Unterstützung per Luftbrücke"
 CZE_airlift_soviet_support_desc: "Da wir keine Grenze zu unserem [SOV.GetAdjective]en Verbündeten haben, könnten wir ja [SOV.GetAdjective]e Truppen auf dem Luftweg zu uns bringen. Ein Transportunterfangen dieses Ausmaßes gab es noch nie, doch so müssten [SOV.GetAdjective]e Truppen nicht das Territorium unserer Nachbarn betreten - zumindest nicht auf dem Landweg."
 CZE_unlocks_volunteer_transport_raid_tt: "Neue §YÜberfallkategorie§!:\nLuftbrücke für sowjetische Freiwillige nach §Y[73.GetName]§!"
 CZE_intervene_in_the_ussr: "In den [SOV.GetAdjective]en Bürgerkrieg eingreifen"
 CZE_intervene_in_the_ussr_desc: "Einmal mehr gibt es Unruhen auf [SOV.GetAdjective]em Gebiet, und obwohl die alte Herrscherfamilie, die wir einst unterstützten, nicht mehr zurückkehren wird, können wir die Möglichkeit auf eine freundlichere Regierung nicht ignorieren."
 CZE_forgive_trading_debts: "Handelsschulden erlassen"
 CZE_forgive_trading_debts_desc: "Wirtschaftliche Instabilität und die Weltwirtschaftskrise haben dafür gesorgt, dass einige mögliche Verbündete uns gegenüber Schulden haben, die sie wohl nur schwer zurückzahlen können. Dies belastet unsere Beziehungen. Die Regierung könnte diese Schulden erlassen und die lokalen Unternehmen entschädigen, die davon betroffen wären."
 CZE_improve_balkan_trade_relations: "Handelsbeziehungen mit dem Balkan verbessern"
 CZE_improve_balkan_trade_relations_desc: "Unser größter Aktivposten beim Anwerben möglicher Verbündeter auf dem Balkan ist unsere Wirtschaft. Wir sollten zeigen, dass wir bereit sind, Ressourcen in das Verbessern der wirtschaftlichen Lage möglicher Verbündeter zu investieren."
 CZE_ally_austria: "Ein Bündnis eingehen mit [AUS.GetName]"
 CZE_ally_austria_desc: "Nachdem seine Regierung vor wenigen Jahren beinahe von Nazi-Schlägern gestürzt wurde, sollte [AUS.GetName] langsam die möglichen Vorteile einer Zusammenarbeit mit [ROOT.GetName] verstehen."
 CZE_demand_the_czech_corridor: "Den tschechischen Korridor fordern"
 CZE_demand_the_czech_corridor_desc: "Während wir die Kleine Entente zu einem echten Bündnis ausbauen, wird immer deutlicher, dass die Verlegung von Truppen zu unseren Verbündeten oder die Aufnahme ihrer Truppen im Fall eines Konflikts sehr schwierig werden könnte. Ein Landstreifen, der unser Land mit [YUG.GetName] verbindet, wie er einst nach dem Ersten Weltkrieg vorgeschlagen wurde, könnte unsere Sicherheit verbessern und unsere Handelswege schützen."
 CZE_ally_hungary: "Ein Bündnis eingehen mit [HUN.GetName]"
 CZE_ally_hungary_desc: "Ungeachtet der Konflikte, die seit der Geburt von [CZE.GetNonIdeologyName] unsere Beziehungen zu [HUN.GetNonIdeologyName] belasten, zeigt diese Nation doch in letzter Zeit Potenzial als wertvolle Verbündete."
 CZE_ally_yugoslavia: "Ein Bündnis eingehen mit [YUG.GetName]"
 CZE_ally_yugoslavia_desc: "[YUG.GetNameDefCap] mag in letzter Zeit Probleme mit seiner Wirtschaft haben, doch die strategischen Ressourcen und die günstige Position des Landes dürfen nicht übersehen werden."
 CZE_protect_neutrality: "Neutralität schützen"
 CZE_protect_neutrality_desc: "Der Erste Weltkrieg machte klar, dass man nicht neutral bleiben kann, wenn man im Fadenkreuz seiner Feinde ist. Wenn wir diese Nationen beschützen, zwingen wir unsere Feinde bei ihrer Expansion in einen Zweifrontenkrieg, anstatt sie nach Belieben Eroberungen durchführen zu lassen."
 CZE_if_cooperate_with_moderate_socialists_completed_tt: "Effekte, wenn „§YMit gemäßigten Sozialisten zusammenarbeiten§!“ abgeschlossen wurde:"
 CZE_mutual_protection_agreement_with_switzerland: "Schutzabkommen mit [SWI.GetNonIdeologyName]"
 CZE_mutual_protection_agreement_with_switzerland_desc: "Sowohl wir als auch [SWI.GetNameDef] arbeiten auf eine Situation hin, bei der eine Invasion unserer Lande ohne nicht hinnehmbare Verluste unmöglich wäre. Wenn wir zusammenarbeiten, könnten wir eine Armee ins Feld führen, die zahlenmäßig nicht nur Verteidigungsarbeit leisten, sondern auch entschiedene Gegenangriffe durchführen könnte."
 CZE_exchange_technology: "In der Forschung zusammenarbeiten"
 CZE_exchange_technology_desc: "Trotz eines Übermaßes an natürlichen Rohstoffen fehlen dem Balkan die rentablen Kolonien sowie die fortschrittliche Industrie der Großmächte. Daher ist es entscheidend, dass wir in der Forschung zusammenarbeiten, damit wir uns auf unsere jeweiligen Spezialgebiete konzentrieren können."
 CZE_demand_corridor_to_ussr: "Einen Korridor in [SOV.GetAdjective]e Gebiete fordern"
 CZE_demand_corridor_to_ussr_desc: "Wenn [POL.GetNameDef] nicht mit uns zusammenarbeiten möchte, müssen wir ernsthafte Aktionen ergreifen, um uns Zugang zu unseren [SOV.GetAdjective]en Verbündeten zu verschaffen."
 CZE_ally_poland: "Ein Bündnis eingehen mit [POL.GetName]"
 CZE_ally_poland_desc: "[POL.GetNameDefCap] hat den Polnisch-Sowjetischen Krieg noch in Erinnerung und eine wachsende Bedrohung im Westen. Daher sucht das Land ähnlich wie wir nach Sicherheit. Wir müssen die [POL.GetAdjective]e Regierung davon überzeugen, dass Neutralität sie nicht retten wird und sie sich mit uns zusammentun sollte."
 CZE_realize_the_polish_czechoslovak_confederation: "Eine Konföderation umsetzen"
 CZE_realize_the_polish_czechoslovak_confederation_desc: "Obwohl das Land sich tapfer wehrte, wurde [POL.GetNameDef] besiegt, und da die Regierung nun im Exil ist, regen sich Stimmen, die ein Bündnis mit uns anstreben. Wenn wir ihre Regierung und die unsere zusammenlegen, könnten wir das [POL.GetAdjective]e Volk in diesen neuen Staat holen und gemeinsam versuchen, unser kollektives Heimatland zu befreien."
 CZE_integrate_western_ukrainians: "Westliche Ukrainer integrieren"
 CZE_integrate_western_ukrainians_desc: "Den Ukrainern von [CZE.GetName] wurden erhebliche Unterstützung und Autonomie angeboten. Nun können wir versuchen, die neu gewonnenen Länder in unsere ukrainische Provinz zu integrieren."
 CZE_ally_russia: "Ein Bündnis eingehen mit [SOV.GetNonIdeologyName]"
 CZE_ally_russia_desc: "Da die Regierung von [SOV.GetName] besser zu der unseren passt, könnten wir versuchen, jenes vage Abkommen auszubauen, das wir mit der vorherigen Regierung geschlossen hatten."
 CZE_claim_ukraine: "Eine wohlgesonnene ukrainische Regierung einsetzen"
 CZE_claim_ukraine_desc: "Die Ukraine ist ein wichtiger Teil der [SOV.GetAdjective]en Gebiete. Wenn wir sie uns einverleiben, könnten wir einen mächtigen Pufferstaat gründen."
 CZE_strengthen_the_little_entente: "Die kleine Entente formalisieren"
 CZE_strengthen_the_little_entente_desc: "Die derzeit hauptsächlich auf das Eindämmen von [HUN.GetNonIdeologyName] konzentrierte Kleine Entente hat das Potenzial, eine ernsthafte Allianz mit erheblicher Armee zu werden."
 CZE_seek_french_leadership: "[FRA.GetAdjective]e Führung suchen"
 CZE_seek_french_leadership_desc: "Obwohl wir die Initiative zur Gründung dieser Allianz ergriffen haben, ist es eindeutig, dass die Armee von [FRA.GetNonIdeologyName] eine große Unterstützung jeder Allianz wäre, selbst wenn man dafür die Führung abtreten müsste."
 CZE_increase_food_and_resource_imports: "Einfuhr von Nahrung und Ressourcen steigern"
 CZE_increase_food_and_resource_imports_desc: "Da unsere Verbündeten über eine starke landwirtschaftliche Industrie verfügen, ist es nun weniger dringlich, unsere eigene zu subventionieren. Wenn wir Ressourcen billig importieren, sparen wir Geld und wir stärken gleichzeitig die Wirtschaft unserer Verbündeten."
 CZE_double_down_on_heavy_industry: "Die Schwerindustrie noch mehr stärken"
 CZE_double_down_on_heavy_industry_desc: "Dank der neuen Abmachungen mit unseren Verbündeten können wir uns auf die Industrien konzentrieren, die am wettbewerbsfähigsten sind, beispielsweise auf unsere Rüstungsindustrie. Überschüssige Waren können dann verkauft werden."
 CZE_neutralize_the_hungarian_threat: "Die [HUN.GetAdjective]e Gefahr eliminieren"
 CZE_neutralize_the_hungarian_threat_desc: "[HUN.GetNameDefCap] behindert unseren Handel mit potenziellen Verbündeten im Süden, und wenn das Land sich mit unseren Feinden zusammentut, könnte es einen möglicherweise entscheidenden Teil unserer Armee binden, und zwar trotz des Vertrags von Trianon."
 CZE_cancel_anti_hungary_focus: "Machte nach dem [GER.GetAdjective]en Einschreiten einen Rückzieher"
 CZE_ally_romania: "Ein Bündnis eingehen mit [ROM.GetName]"
 CZE_ally_romania_desc: "[ROM.GetNameDefCap] sticht als eine der autarkeren Nationen der Region hervor und produziert Nahrung und wertvolles Öl. Wenn wir das Land auf unsere Seite ziehen könnten, könnten wir nicht nur besser Rohstoffe miteinander austauschen, sondern gleichzeitig unseren Feinde die Ressourcen verwehren, die sie brauchen, um gegen uns Krieg zu führen."
 CZE_divide_germany: "Deutschland spalten"
 CZE_divide_germany_desc: "Der Gefahr durch [GER.GetName] ist allein schwer beizukommen, weshalb wir uns Verbündete suchen sollten, die ähnlich besorgt sind ob der [GER.GetAdjective]en Expansion und die den Willen haben, präventiv vorzugehen."
 CZE_if_FRA_ally_tt: "Effekte, wenn §YFrankreich monarchistisch ist§! und nicht bereits mit jemand anderem verbündet:"
 CZE_if_POL_ally_tt: "Effekte, wenn „§YEin starkes Polen§!“ erfolgreich abgeschlossen wurde und zu einer Garantie von [POL.GetNonIdeologyName] führte:"
 CZE_revolutionary_brigades: "Revolutionsbrigaden ins Leben rufen"
 CZE_revolutionary_brigades_desc: "Unsere Revolutionäre, die Erfahrung im Kampf für [ROOT.GetName] gesammelt haben, sollten weiter in die Armee integriert werden."
 CZE_recruit_communist_exiles: "Kommunistische Exilanten rekrutieren"
 CZE_recruit_communist_exiles_desc: "[ROOT.Capital.GetCapitalVictoryPointName] ist seit Langem ein sicherer Hafen für Revolutionäre im Exil. Unsere neue Regierung könnte diese Personen nutzen."
 CZE_destabilize_potential_adversaries: "Potenzielle Gegner destabilisieren"
 CZE_destabilize_potential_adversaries_desc: "Die exilierten Kommunisten, mit denen wir zusammenarbeiten, weisen ein Verständnis ihres Heimatlandes auf, mit dem nicht einmal unsere Spione mithalten können. Wir müssen dieses Wissen umfassend nutzen, wenn wir unsere Strategie zur Befreiung ihrer Heimat festlegen."
 CZE_nationalize_key_industries: "Die Banken und Minen verstaatlichen"
 CZE_nationalize_key_industries_desc: "Die Minen versorgen uns mit den Rohstoffen, aus denen unsere Industrie die Waffen des Krieges schmiedet. Am besten überlässt man es der Regierung, sicherzustellen, dass diese Versorgung mit Material in Krisenzeiten funktioniert, und nicht den Finanziers und Industriellen."
 CZE_rehabilitate_the_army: "Die Armee rehabilitieren"
 CZE_rehabilitate_the_army_desc: "Die meisten Generäle der [CZE.GetAdjective]en Armee sind Veteranen der Tschechoslowakischen Legion, die sich durch ihren Kampf gegen die Sowjets im Bürgerkrieg auszeichnete. Wir müssen dafür sorgen, dass sie der neuen [CZE.GetAdjective]en Regierung gegenüber loyal sind."
 CZE_unlock_civil_war_army_generals_tt: "Im Bürgerkrieg verlorene Kommandanten zurückgewinnen"
 CZE_recruit_ideologically_aligned_generals: "Ideologisch zuverlässige Generäle rekrutieren"
 CZE_recruit_ideologically_aligned_generals_desc: "Es ist an der Zeit, dass wir unsere Ausbildungsprogramme anpassen und unsere Armee mit neuen Kandidaten bereichern, die die neuen Werte der Armee verstehen."
 CZE_recruit_communist_generic_general_tt: "Erhält einen kommunistischen General"
 CZE_purge_two_random_commanders_tt: "Zwei zufällige Kommandanten werden gesäubert"
 CZE_czechoslovak_union: "Tschechoslowakische Union"
 CZE_czechoslovak_union_desc: "Die lokale Autonomie in [CZE.GetName] muss erhöht werden, damit man das kommunistische System den Umständen vor Ort anpassen kann."
 CZE_continue_industrial_relocation_schemes: "Pläne zur Verlegung der Arsenale fortsetzen"
 CZE_continue_industrial_relocation_schemes_desc: "Zugunsten unserer nationalen Sicherheit müssen wir weiter unsere verwundbaren Fabriken in Bereiche verlegen, an denen sie besser vor Luft- und Bodenangriffen geschützt sind. Wir dürfen nicht riskieren, dass eine derart wichtige Industrie in Gefahr gerät."
 CZE_continue_industrial_relocation_schemes_tt: "Entfernt §Y1 Militärfabrik§!"
 CZE_continue_industrial_relocation_schemes_2_tt: "§RDie Fabriken müssen neu gebaut werden§!"
 CZE_establish_a_armament_factory_in_uhersky_brod: "Die Rüstungsfabrik Uherský Brod bauen"
 CZE_establish_a_armament_factory_in_uhersky_brod_desc: "Die Fabrik Uherský Brod ist eine Rüstungsfabrik, die sich auf die Herstellung und Planung automatischer Waffen für Infanterie und Flugzeuge spezialisiert hat. Wir haben vor, sie zur weltweit fortschrittlichsten Fabrik ihrer Art zu machen."
 CZE_appeal_to_the_castle: "An die Burg appellieren"
 CZE_appeal_to_the_castle_desc: "In der Tschechoslowakei meint die „Burg“ jenes umfassende Netzwerk einflussreicher Organisationen und Personen, das ihre Präsidenten unterstützt. Durch diese Macht können die Präsidenten ihrerseits mehr Einfluss ausüben, als es ihre begrenzten Verfassungsrechte eigentlich nahelegen. Wenn wir diese Gruppe um Unterstützung bitten, könnte uns dies einer Führungsposition näherbringen."
 CZE_petition_the_nobles: "Die Adligen um Hilfe bitten"
 CZE_petition_the_nobles_desc: "Die Adelsschicht von [ROOT.GetName] mag keine anerkannten Titel mehr tragen, ist aber nach wie vor ein einflussreicher Teil der [ROOT.GetAdjective]en Gesellschaft. Ihre Unterstützung könnte uns die Legitimität und die Ressourcen bringen, die wir brauchen, um weiter voranzukommen."
 CZE_unify_the_fascist_parties: "Die faschistischen Parteien vereinen"
 CZE_unify_the_fascist_parties_desc: "Die Landschaft der faschistischen Parteien ist gespalten. Ihre Ausrichtungen sind derart extrem, dass sie nie wesentliche Unterstützung gewinnen werden. Zur Verteidigung der Nation ist es erforderlich, dass diese Parteien sich zusammenschließen und für eine Vision der Tschechoslowakei sorgen, die nicht nur Extremisten anspricht."
 CZE_pro_rearmament_propaganda: "Propaganda für die Wiederbewaffnung"
 CZE_pro_rearmament_propaganda_desc: "Wenn wir die Unterstützung für eine zentralisiertere Regierung erhöhen möchten, müssen wir betonen, wie zerbrechlich die Lage in der Welt um uns herum ist. So können wir die Bevölkerung wenn nötig auch motivieren, Pläne zur Verstärkung der Armee zu unterstützen."
 CZE_align_nationalist_parties: "Tschechische nationalistische Parteien zu Verbündeten machen"
 CZE_align_nationalist_parties_desc: "Obwohl wir versuchen sollten, alle [ROOT.GetAdjective]en Bürger anzusprechen, sind die traditionellen tschechischen Nationalisten unbestritten die einflussreichsten Parteien auf der politischen Bühne, und mit ihnen können wir am einfachsten Unterstützung sammeln."
 CZE_align_slovak_catholics: "Slowakische Katholiken zu Verbündeten machen"
 CZE_align_slovak_catholics_desc: "Katholische und nationalistische Parteien genießen derzeit enorme Unterstützung in der Slowakei. Sich den Nationalisten zu nähern, wäre schwierig, wenn wir keine erheblichen Eingeständnisse machen wollen, aber wir könnten die katholischen Elemente für uns gewinnen."
 CZE_jozef_tiso_tt: "Berater §Y$CZE_jozef_tiso$§! ernennen"
 CZE_align_catholic_parties: "Die ČSL zu Verbündeten machen"
 CZE_align_catholic_parties_desc: "Die ČSL und andere katholische Parteien waren die traditionelle Unterstützerbasis für das monarchistische System des österreich-ungarischen Reichs. Es ist an der Zeit, dass wir sie wieder zurück in diese Position bitten."
 CZE_restore_the_monarchy: "Die Monarchie wiederherstellen"
 CZE_restore_the_monarchy_desc: "Da die Unterstützung für ein neues System nun steht, ist es an der Zeit, dass wir die ausgearbeitete Idee dem Volk vorstellen. Mit $CZE_karel_schwarzenberg$ als auserkorenem Monarchen sprechen wir sowohl die alten Unterstützer der Monarchie als auch neue an, da der designierte Monarch ein [ROOT.GetAdjective]er ist, kein [AUS.GetAdjective]er aus dem Ausland, wie uns zuvor einer vorgesetzt wurde."
 CZE_semi_constitutional_monarchy: "Ein semi-konstitutionelles System"
 CZE_semi_constitutional_monarchy_desc: "Da nun ein Monarch gewählt wurde, ist es an der Zeit, die Verfassung anzupassen. Manche sind dafür, die Macht zu zentralisieren, um internen Zwist in diesen schweren Zeiten zu vermeiden, aber es ist auch klar, dass der Monarch nicht alles allein schaffen kann. Daher wäre es vielleicht am besten, das aktuelle System als Unterstützung bei der Regierung des Landes beizubehalten und zeitgleich einen Monarchen zu haben, der das Land führt."
 CZE_restore_noble_titles: "Adelstitel wiederherstellen"
 CZE_restore_noble_titles_desc: "Zur Gründung der Republik wurden die Adelstitel aberkannt, und nun ist es an der Zeit, den Adel für seine Hilfe zu unterstützen, indem wir seine Titel wiederherstellen. So können wir auch Ehrentitel an Helden wie Offiziersveteranen verleihen, die mehrmals für den [ROOT.GetAdjective]en Staat gekämpft haben."
 CZE_restore_the_austro_hungarian_customs_union: "Die Zollunion des Reichs wiederherstellen"
 CZE_restore_the_austro_hungarian_customs_union_desc: "Einer der unbestreitbaren Vorteile des österreich-ungarischen Reichs waren die gesenkten Handelsbarrieren für unsere Industrie. Wenn wir diese Union wieder ins Leben rufen könnten, könnten wir die ehemaligen Teilnehmerstaaten erneut ins unsere Sphäre holen."
 CZE_customs_union: "Zollunion"
 CZE_catholic_focus: "Katholischer Schwerpunkt"
 CZE_catholic_focus_desc: "Obwohl die Hussiten ein berühmter Teil der [ROOT.GetAdjective]en Geschichte waren, hängen viele noch immer dem katholischen Glauben an. Diese Leute sollten wir ansprechen, indem wir ihre Rolle in der Gesellschaft stärker betonen."
 CZE_hussite_legacy: "Hussitisches Vermächtnis"
 CZE_hussite_legacy_desc: "Die Hussiten förderten nicht nur ein eher protestantisches Christentum, sondern sie standen auch für Toleranz gegenüber Andersdenkenden in dieser Sache - anders als die Tyrannen, die sie in Kriegen bekämpften."
 CZE_align_with_germany: "[GER.GetNonIdeologyName] als Verbündeten gewinnen"
 CZE_align_with_germany_desc: "Die neue Regierung in [GER.GetName] ist vielleicht nicht zwingenderweise weniger expansionistisch, aber vielleicht ist sie ja bereit, pragmatischer darin zu sein, mit wem sie paktiert und wen sie denunziert. Wir sollten versuchen, zu Ersteren zu gehören."
 CZE_rally_against_germany: "Zum Kampf gegen [GER.GetNonIdeologyName] aufrufen"
 CZE_rally_against_germany_desc: "Die Tschechoslowaken kämpften tapfer für ihre Unabhängigkeit, und wir müssen nun alle Menschen dazu aufrufen, diese Unabhängigkeit zu schützen."
 CZE_integrate_sudeten_germans: "Sudetenland integrieren"
 CZE_integrate_sudeten_germans_desc: "Die Spaltung im Volk des Sudetenlandes hilft niemandem. Wir müssen versuchen, seinen Sorgen auf den Grund zu gehen, und uns den Problemen stellen. Dies allein könnte Unterstützer der Unabhängigkeit entwaffnen, da man ihnen die Vorwürfe von wegen einer schlechten Behandlung des Volkes nicht mehr abnähme."
 CZE_cooperate_with_the_sdp: "Mit der SdP zusammenarbeiten"
 CZE_cooperate_with_the_sdp_desc: "Obwohl sie derzeit eine destabilisierende Kraft darstellt, könnte die SdP auf Linie gebracht werden, wenn wir sie angemessen motivieren, beispielsweise mit einer Aufnahme in die herrschende Koalition."
 CZE_revive_the_december_bloc: "Den Dezemberblock wieder ins Leben rufen"
 CZE_revive_the_december_bloc_desc: "Der Dezemberblock aus Faschisten, Minderheiten und Rechtsparteien, die sich dagegen auflehnten, dass Edvard Benes zum Präsidenten ernannt wurde, sollte als Alternative zur aktuellen Regierung wieder ins Leben gerufen werden."
 CZE_revert_1926_anti_military_laws: "Aufhebung der Anti-Militär-Gesetze von 1927"
 CZE_revert_1926_anti_military_laws_desc: "Nach einem versuchten Staatsstreich durch $CZE_radola_gajda$ verloren Armee und Gendarmerie ihr Wahlrecht sowie bestimmte andere Privilegien. Angesichts der wichtigen Stellung der Armee in diesen harten Zeiten ist es nur gerecht, diese Einschränkungen aufzuheben und die Spaltung zwischen Armee und Politik zu kitten."
 CZE_bop_to_fascism_support_tt: "Fügt ein Drittel des Wertes von §Y$CZE_bop_army_readiness$§! zur Faschismus-Unterstützung hinzu:"
 CZE_power_to_the_military: "Macht für das Militär"
 CZE_power_to_the_military_desc: "Wir dürfen eindeutig keine Ausgaben für die Verteidigung der Nation scheuen. Daher ist es entscheidend, dass die Machthabenden verstehen, was das Militär braucht, und dies erreicht man am besten durch eine Militärregierung."
 CZE_militarize_the_associations: "Die Verbände militarisieren"
 CZE_militarize_the_associations_desc: "Die zahlreichen Verbände von [CZE.GetName] könnten zur Verteidigung der Nation beitragen, indem sie Fähigkeiten vermitteln, die wichtig für Soldaten sind - und dies bevor die Bevölkerung mobilgemacht wird."
 CZE_aggressive_foreign_policy: "Aggressive Außenpolitik"
 CZE_aggressive_foreign_policy_desc: "Wir sind es leid, zerbrechlichen Pakten zu vertrauen. Wir müssen entschieden vorgehen, um unsere Sicherheit zu schützen, selbst wenn dies ernsthafte Opfer erfordert."
 CZE_work_with_germany: "Mit [GER.GetNameDef] zusammenarbeiten"
 CZE_work_with_germany_desc: "Da die Sudetenfrage nun geregelt ist, könnte [GER.GetNameDef] vielleicht erkennen, wie wertvoll [ROOT.GetNameDef] als Verbündeter sein könnte."
 CZE_control_the_associations: "Die Verbände kontrollieren"
 CZE_control_the_associations_desc: "In [CZE.GetNonIdeologyName] gibt es zahlreiche Organisationen von Berufsverbänden bis hin zu Freizeit- oder Sportvereinen. Wenn wir diese kontrollieren, kontrollieren wir einen Großteil der Gesellschaft."
 CZE_diversify_bata: "Bat'a diversifizieren"
 CZE_diversify_bata_desc: "Wir könnten die Ressourcenlieferketten des großen Konsumgüterunternehmens Bat'a zu unserem Vorteil nutzen. Das Unternehmen kann uns besonders dabei helfen, wichtige Materialien zu beschaffen, die sonst nur schwer zu bekommen sind."
 CZE_devaluate_the_koruna: "Die Krone abwerten"
 CZE_devaluate_the_koruna_desc: "Eine starke Währung zu haben, kann für ein Land gefährlich sein, dessen Wirtschaft größtenteils von Exporten abhängt. Unsere Währung zu schwächen, könnte kurzfristig schmerzhaft sein, doch auf lange Sicht wird es uns nutzen."
 CZE_continue_the_central_bohemia_plan: "Ein Plan für Mittelböhmen"
 CZE_continue_the_central_bohemia_plan_desc: "Wenn wir unseren Plan fortsetzen, die Industriegebiete im Zentrum unseres Landes zu erweitern, könnten wir die Skaleneffekte nutzen. Außerdem wäre es hinsichtlich der nationalen Sicherheit empfehlenswert, unsere Industrie fernab unserer Grenzen zu expandieren."
 CZE_balance_industrial_invevestments: "Industrielle Entwicklung ins Gleichgewicht bringen"
 CZE_balance_industrial_invevestments_desc: "Einer der Gründe, warum unser Land zu Beginn des Jahrzehnts gespalten wurde, war, dass wir Bereiche außerhalb von [9.getname] und [75.getname] unterentwickelt ließen. Wenn wir den äußeren Bereich unseres Landes aufbauen, mindern wir den Abstand der industriellen Entwicklung der beiden Gebiete."
 CZE_expand_prf_science_facilities: "Die Wissenschaftsstandorte von PrF erweitern"
 CZE_expand_prf_science_facilities_desc: "Die Wissenschaftsstandorte von PrF sind voll mit hellen Köpfen, die nur darauf warten, an etwas Größerem arbeiten zu dürfen, als sie es derzeit tun. Wenn wir die Abteilung erweitern und sie mit der Regierung zusammenarbeiten lassen, würde dies unserer Forschung guttun."
 CZE_raise_more_industrial_funds: "Mehr Mittel für die Industrie aufbringen"
 CZE_raise_more_industrial_funds_desc: "Seit der Zeit Österreich-Ungarns ist die Industrie das Herz unserer Nation. Wenn wir ihr grundlegende Finanzierung und Mittel zukommen lassen, wird sie in diesem geplagten Europa weiterhin gedeihen."
 CZE_skoda_priority_focus_info_tt: "Einige §YNationale Schwerpunkte§! erfordern, dass wir eine gewisse £GFX_CZE_skoda_text_icon §YŠkoda-Priorität§! haben, um sie abzuschließen. Diese Schwerpunkte sind mit einem Symbol markiert, das zu der erforderlichen £GFX_CZE_skoda_text_icon §YŠkoda-Priorität§! passt."
 CZE_joint_stock_schemes: "Aktiengesellschaften"
 CZE_joint_stock_schemes_desc: "Aktiengesellschaften sind eine Quelle wirtschaftlichen Wachstums, wenn uns traditionelle Quellen für Mittel fehlen. Wenn wir diese Taktiken weiterhin nutzen, setzen wir unser Wirtschaftswachstum fort."
 CZE_the_slovak_arrow: "Der slowakische Pfeil"
 CZE_the_slovak_arrow_desc: "Wenn wir eine schnelle Bahnverbindung zwischen unseren beiden größten Städten schaffen, wäre dies ein erheblicher Grund für Nationalstolz. Außerdem wäre es ein guter Vorwand für die Verbesserung des Schienennetzes."
 CZE_finish_double_tracking_efforts: "Doppelte Beschienung"
 CZE_finish_double_tracking_efforts_desc: "Wenn wir die doppelte Beschienung unserer wichtigeren sekundären Schienenverbindungen abschließen, können wir mehr Verkehr über diese Strecken schicken. Dadurch wären einige unserer Städte aus der zweiten Reihe besser angebunden."
 CZE_realize_motorway_proposals: "Vorschläge für Schnellstraßen umsetzen"
 CZE_realize_motorway_proposals_desc: "Unserer Regierung wurden Vorschläge für Schnellstraßen vorgelegt, die die Straßenverbindungen innerhalb unserer Grenzen enorm verbessern würden. Wir sollten diese Vorschläge umsetzen."
 CZE_build_additional_rail_stations: "Zusätzliche Bahnhöfe bauen"
 CZE_build_additional_rail_stations_desc: "Dank unseres neu entwickelten Schienennetzes sind einige unserer vorhandenen Bahnhöfe nun überfordert mit dem erhöhten Verkehrsaufkommen. Wenn wir sie ausbauen, könnten wir deutlich besser mehr Menschen und Güter an jene Orte bringen, an denen sie gebraucht werden."
 CZE_build_additional_rail_stations_focus_cost_tt: "§Y$CZE_devaluate_the_koruna$§! anzunehmen, reduziert die Zeit für diesen Schwerpunkt auf §G35§! Tage"
 CZE_grow_ckd_secondary_facilities: "Sekundäre Standorte für die CKD"
 CZE_grow_ckd_secondary_facilities_desc: "CKD hat viele sekundäre Standorte, die wichtige industrielle Produkte wie Stromgeneratoren herstellen. Wenn wir diese Fabriken ausbauen, fördern wir das Wachstum unserer Schwerindustrie."
 CZE_bolster_domestic_construction: "Inländisches Bauwesen fördern"
 CZE_bolster_domestic_construction_desc: "Unser inländischer Bausektor wächst stetig, seit wir nach dem Ende des Ersten Weltkriegs unabhängig wurden. Wenn wir den mittelgroßen Bauunternehmen Geld zukommen lassen, könnten zusätzliche Investitionen dieses Wachstum weiter beflügeln."
 CZE_invest_in_vhht: "In VHHT investieren"
 CZE_invest_in_vhht_desc: "VHHT ist ein Unternehmen, das zahlreiche metallverarbeitende Fabriken unterschiedlicher Art in unserem Land betreibt. Wenn wir in diese investieren und sie ausbauen, verbessern wir am Ende viele Bereiche unserer Metallproduktion."
 CZE_expand_vitkovice_ironworks: "Witkowitzer Eisenwerke ausbauen"
 CZE_expand_vitkovice_ironworks_desc: "Die Witkowitzer Eisenwerke sind ein wichtiger Lieferant von Eisen in [74.getname]. Wenn wir sie ausbauen, steigert dies die Produktion des Werks erheblich."
 CZE_expand_central_bohemian_mines: "Zentralböhmische Minen ausbauen"
 CZE_expand_central_bohemian_mines_desc: "Die Minen im Zentrum unseres Landes sind für den Energiesektor von größter Bedeutung. Wir müssen sie schnellstmöglich ausbauen."
 CZE_increase_bauxite_imports: "Einfuhr von Bauxit steigern"
 CZE_increase_bauxite_imports_desc: "Unser Land mag nicht viel Aluminium haben, doch durch bestimmte Veredelungsprozesse und einen höheren Import von Bauxit können wir eine kleine Menge der Ressource im Inland herstellen. So könnten wir etwaige Ressourcenknappheiten lindern."
 CZE_merge_the_oil_companies: "Die Ölunternehmen zusammenlegen"
 CZE_merge_the_oil_companies_desc: "Unsere Ölunternehmen haben diese Bezeichnung kaum verdient. Sie sind kleine Betriebe, die um ein paar Förderstellen herum gebaut wurden. Wenn wir alle Unternehmen zusammenlegen und unter staatliche Kontrolle stellen, können wir für unsere Ölindustrie mit weniger mehr erreichen."
 CZE_expand_trinec_ironworks: "Trinec Stahlwerke"
 CZE_expand_trinec_ironworks_desc: "Die Třinec Stahlwerke sind seit ihrer Gründung ein Titan der Industrie in [72.getname]. Wenn wir weiter in sie investieren, könnte sich dies gewaltig durch eine erhöhte Ressourcenproduktion bezahlt machen."
 CZE_consolidate_mining_operations: "Bergbauoperationen konsolidieren"
 CZE_consolidate_mining_operations_desc: "Unsere Bergbauoperationen ließen sich optimieren, wenn wir die Verwaltung dieser Unternehmen aus Effizienzgründen zusammenlegen würden. So könnten sie sich in Sachen Forschung und Aktivität auf die Erweiterung bereits vorhandener Minen konzentrieren, damit diese effektiver werden."
 CZE_expand_praga: "Praga-Verträge"
 CZE_expand_praga_desc: "Praga stellt schon seit Jahren verschiedene Komponenten für unsere Militärindustrie her. Es ist nur logisch, sie mit zusätzlichen Verträgen zu belohnen, damit sie noch weiter wachsen."
 CZE_shrink_educational_disparities: "Bildungsunterschiede abbauen"
 CZE_shrink_educational_disparities_desc: "Unseren ländlichen Gegenden mangelt es an der Bildung, die ihren städtischen Gegenstücken geboten wird. Wir müssen diese Unterschiede mit großen Bildungsprogrammen bekämpfen, die sich um diese Gebiete kümmern."
 CZE_kickstart_rapid_rearmanent: "Schnelle Wiederbewaffnung anstoßen"
 CZE_kickstart_rapid_rearmanent_desc: "Zahlreiche Politiker und Geschäftsleute finden die Entscheidung grässlich, aber wir müssen nun mit der Wiederbewaffnung beginnen. Die Länder um uns herum rüsten nicht ab, sondern tun genau das Gegenteil, und das ist ein offenes Geheimnis. Wir müssen unsere Armee vorbereiten, solange uns noch Zeit bleibt."
 CZE_keep_focus_on_weapon_exports: "Weiter auf Rüstungsexporte konzentrieren"
 CZE_keep_focus_on_weapon_exports_desc: "Unsere große Rüstungsexport-Industrie hat uns aus unserer wirtschaftlichen Depression geholt. Uns davon abzuwenden, könnte sich politisch und ökonomisch als gefährlich erweisen. Den Kurs zu halten, ist derzeit die beste Entscheidung. Die angeblichen Gefahren für uns sind ohnehin übertrieben."
 CZE_force_the_industrialists_hand: "Die Industriellen zum Handeln zwingen"
 CZE_force_the_industrialists_hand_desc: "Die Industriellen und Konglomerate behindern unsere Wiederbewaffnung schon zu lange. Es ist an der Zeit, dass wir für sie entscheiden - zum Wohl der Nation."
 CZE_embrace_corporatism: "Den Korporatismus fördern"
 CZE_embrace_corporatism_desc: "Wir könnten mit den Industriellen verhandeln. Vielleicht sind sie ja bereit, unsere Wiederbewaffnung zu unterstützen, wenn wir einige ihrer Bedingungen annehmen. Ein paar Änderungen an unserer Politik sind mehr als angemessen und auch in unserem Interesse."
 CZE_expand_existing_armory_plants: "Vorhandene Arsenalwerke ausbauen"
 CZE_expand_existing_armory_plants_desc: "Die Verlegung unserer vorhandenen Arsenalstandorte könnte sich als kostspielig mit wenig langfristigen Vorteilen erweisen. Der Ausbau unserer vorhandenen Werke könnte hingegen die Produktion sowie die Forschung und Entwicklung an diesen aktuellen Standorten steigern - selbst wenn dies das Risiko mitbringt, dass sie an Orten stehen, die einfacher von potenziellen Feinden angegriffen werden können."
 CZE_expand_skoda_offices: "Die Büros von Škoda ausbauen"
 CZE_expand_skoda_offices_desc: "Unsere internationalen Büros treiben den Export unserer Rüstungsgüter voran. Es wäre nur vernünftig, sie mit neuen Standorten auszubauen."
 CZE_skoda_office_unlock_tt: "Schaltet Entscheidung frei: §YRüstungsvertrieb-Büro bauen§!"
 CZE_complete_the_power_grid: "Das Stromnetz vollenden"
 CZE_complete_the_power_grid_desc: "Das Stromnetz in unseren ländlichen Gegenden benötigt Zuwendung. Es ist hinter den Rest des Landes zurückgefallen und behindert weitere wirtschaftliche Fortschritte."
 CZE_build_the_slapy_reservoir: "Den Stausee Slapy bauen"
 CZE_build_the_slapy_reservoir_desc: "Wenn wir einen Staudamm bei Slapy bauen, erzeugen wir mehr Strom und sorgen für mehr wirtschaftliche Chancen in der Gegend. Durch den zusätzlichen Strom würde unsere Industrie in der Region beachtlich wachsen."
 CZE_diversify_refinery_processes: "Veredelungsprozesse diversifizieren"
 CZE_diversify_refinery_processes_desc: "Unsere Bohrlöcher könnten eine breite Palette an Öl-Nebenprodukten herstellen. Das einzige Problem dabei ist, dass uns das Fachwissen dazu fehlt. Wenn wir Forschungszeit investieren, könnten wir herausfinden, wie dieser Traum wahr werden kann."
 CZE_enlarge_smaller_wells: "Kleinere Bohrlöcher vergrößern"
 CZE_enlarge_smaller_wells_desc: "Trotz ihrer geringen Größe könnten unsere kleineren Bohrlöchern deutlich mehr als jene winzige Menge Öl fördern, die sie derzeit produzieren. Wir müssten dafür nur die nötige Zeit investieren."
 CZE_develop_sudetenland_resources: "Ressourcen im Sudetenland entwickeln"
 CZE_develop_sudetenland_resources_desc: "Im Sudetenland gibt es eine Menge Rohstoffvorkommen, die wir derzeit nicht abbauen. Es wäre ein Fehler, nicht in den Bau weiterer Bergwerke in diesem Gebiet zu investieren."
 CZE_grow_tatras_capabilities: "Tatras Kapazitäten ausbauen"
 CZE_grow_tatras_capabilities_desc: "Tatras derzeit noch kleine Panzerabteilung verfügt über einige innovative Produktentwürfe. Wenn wir ihnen zusätzliche Ressourcen zukommen lassen, können sie weiter Fortschritte bei der Entwicklung von Panzerfahrzeugen machen."
 CZE_bailout_moser: "Moser retten"
 CZE_bailout_moser_desc: "Moser ist im Zuge der Weltwirtschaftskrise in schlechte Zeiten geschlittert. Ihre Industrien müssen gerettet, ihre Standorte wieder geöffnet und die entlassenen Mitarbeiter wieder beschäftigt werden."
 CZE_merge_skodas_consumer_good_plants: "Škodas Konsumgüterfabriken zusammenlegen"
 CZE_merge_skodas_consumer_good_plants_desc: "Škoda hat viele kleine Konsumgüterfabriken in seinem Portfolio, die nicht zentralisiert sind. Wenn wir sie zusammenlegen, könnte dies die Produktion in vielen Bereichen dieser Standorte optimieren. Es könnte sich auch für Škoda allgemein positiv auswirken."
 CZE_giant_of_central_europe_industry: "Industrieriese"
 CZE_giant_of_central_europe_industry_desc: "Bisher nie erträumte Höhen. Wir sind nun ein Industrieriese Europas!"
 CZE_continue_armed_force_reform: "Reform der Streitkräfte fortsetzen"
 CZE_continue_armed_force_reform_desc: "Wenn wir unsere Streitkräfte weiter nach Plan modernisieren und Militärregionen unseren Provinz-Hauptquartieren zuweisen, erreichen wir in möglichen Konflikten eine bessere Koordination."
 CZE_air_force_officer_recruitment: "Rekrutierung von Luftwaffenoffizieren"
 CZE_air_force_officer_recruitment_desc: "Luftsportverbände in den Staaten bedienen in Zusammenarbeit mit der Reserveoffiziersschule der Luftwaffe die kritische Nachfrage nach Reserveoffizieren, indem sie Flugkurse and Manöver mit scharfer Munition anbieten."
 CZE_national_defense_act: "Nationales Verteidigungsgesetz"
 CZE_national_defense_act_desc: "Dieses Verteidigungsgesetz umfasst alle Maßnahmen, ob militärischer oder anderweitiger Natur, die Bedrohungen für oder Angriffen auf die Souveränität, Integrität, Einheit und Sicherheit unserer Nation entgegenwirken, unter Aufsicht des Obersten Rates für Nationale Verteidigung (NROS)."
 CZE_car_and_oil_rationing: "Rationierung von Kraftfahrzeugen und Öl"
 CZE_car_and_oil_rationing_desc: "Wenn wir private Kraftfahrzeuge rationieren und sie nach Bedarf beschlagnahmen, bündeln wir unsere Ressourcen bezüglich Automobilproduktion und Petroleum auf unseren militärischen Bedarf."
 CZE_expand_airfield_capacity: "Flugplatzkapazität erhöhen"
 CZE_expand_airfield_capacity_desc: "Die Dritte Luftfahrtabteilung plant neue Aerodrome und Hangare, die unsere Flugzeuge angemessen betreiben, unterbringen und reparieren können, sowie Unterkünfte für unsere kürzlich in Dienst gesetzten Geschwader samt Bodenpersonal."
 CZE_trust_in_old_guard: "Vertrauen in die Alte Garde"
 CZE_trust_in_old_guard_desc: "Das Können und die Erfahrung im Bereich der Fliegerei werden von den Veteranen des Ersten Weltkriegs, in die wir volles Vertrauen setzen, an die nächste Generation weitergegeben."
 CZE_expand_the_aero_clubs: "Die Luftsportvereine ausbauen"
 CZE_expand_the_aero_clubs_desc: "Die Luftsportvereine haben sich als nützlich erwiesen, indem sie unserem Land einen stetigen Zufluss an talentierten Piloten bieten. Wir sollten sie weiter ausbauen."
 CZE_invest_in_the_smaller_air_plants: "In kleinere Flugzeugfabriken investieren"
 CZE_invest_in_the_smaller_air_plants_desc: "Wenn wir in neue und kleinere Flugzeughersteller investieren, würde dies dringend nötige Konkurrenz für unsere etablierten Firmen bedeuten und sie könnten uns über die gesamte Breite unseres Produktionsbedarfs unterstützen."
 CZE_continue_avia_expansion: "Avia-Expansion fortsetzen"
 CZE_continue_avia_expansion_desc: "Wenn wir in Avia investieren, bekommen sie jene zusätzlichen Geräte, die sie zur Verbesserung ihrer Produktionskapazität benötigen. So könnten sie eine höhere Effizienz bei der Produktion von Flugzeugzellen erreichen, nach denen eine enorme Nachfrage besteht."
 CZE_increase_military_aeronautical_institute_funding: "Finanzierung für militärische Luftfahrtforschung"
 CZE_increase_military_aeronautical_institute_funding_desc: "Wenn wir zusätzliche Standorte für die Gesellschaft für Luftfahrtforschung und Erprobung (VZLÚ) errichten, erhalten wir mehr Wissen über die Aerodynamik, was unsere Flugzeugentwürfe weiter voranbringen und optimieren sollte."
 CZE_air_training_abroad: "Flugausbildung im Ausland"
 CZE_air_training_abroad_desc: "Wenn wir Auszubildende in die Luftwaffe von Nationen schicken, die uns freundlich gesonnen sind, erhalten wir wertvolles Wissen durch neue Perspektiven und praktische Erfahrung, sobald sie wieder in ihren Dienst zurückkehren."
 CZE_establish_air_defense_zones: "Luftverteidigungszonen einrichten"
 CZE_establish_air_defense_zones_desc: "Wir könnten unsere neuen Flugabwehrgeschütze an entscheidenden Punkten und Fabriken stationieren und Luftverteidigungszonen einrichten, die über Kommunikationsknoten auf Territorialebene miteinander kommunizieren. So könnten wir unsere Flugabwehrpräzision optimieren."
 CZE_establish_air_defense_zones_enable_tt: "Richtet §YLuftverteidigungszonen§! ein"
 CZE_establish_air_defense_zones_tt: "Statische-Luftabwehr-Trefferchancefaktor: §G+10%§!"
 CZE_the_air_is_our_sea: "Die Luft ist unsere See"
 CZE_the_air_is_our_sea_desc: "Dank systematischer Flugausbildung sind unsere Piloten dazu in der Lage, tapfer und selbstbewusst zu fliegen: „Wir haben weder Meereshäfen noch Schiffe auf dem Meer. Die Luft ist unsere See.“"
 CZE_bring_kramer_and_lobel_under_state_control: "Kramer & Löbl unter staatliche Kontrolle bringen"
 CZE_bring_kramer_and_lobel_under_state_control_desc: "Wenn wir Kramer & Löbl verstaatlichen, könnten wir eine fortwährende Forschung sowie eine rechtzeitige Lieferung wichtiger elektrischer Vorräte und Funkutensilien garantieren."
 CZE_second_to_none: "Ohnegleichen"
 CZE_second_to_none_desc: "Die Entwürfe unserer Luftfahrtindustrie werden jeden Tag besser. Wenn wir weiter forschen, werden unsere Modelle weltweit ihresgleichen suchen."
 CZE_diversify_airframe_production: "Flugzeugzellen-Produktion diversifizieren"
 CZE_diversify_airframe_production_desc: "Wir dürfen uns nicht einfach darauf verlassen, dass Jäger am Himmel schon alles richten werden. Andere Flugzeuge und Flugzeugzellen werden benötigt, um andere Missionsarten durchführen zu können."
 CZE_projekt_l_52: "Projekt L 52"
 CZE_projekt_l_52_desc: "Das Düsentriebwerk ist die Zukunft des Militärflugzeugs. Derzeit steckt die Technologie jedoch noch in den Kinderschuhen. Wenn wir uns allerdings die Zeit nehmen, ein entsprechendes Projekt ins Leben zu rufen, könnten wir eine Nasenlänge vor unseren Konkurrenten bleiben."
 CZE_fund_vladimir_mandl_research: "Vladimir Mandls Forschung finanzieren"
 CZE_fund_vladimir_mandl_research_desc: "Ein Anwalt namens $CZE_vladimir_mandl$ ist fasziniert von der Idee der Raketentechnologie. Wenn wir mit ihm zusammenarbeiten und ihm die Ressourcen geben, damit er seine Forschung in eine tatsächlich anwendbare Technologie umsetzt, könnten wir von dieser Partnerschaft enorm profitieren."
 CZE_mobilize_the_reserves: "Die Reserven mobilisieren"
 CZE_mobilize_the_reserves_desc: "Die Spannungen an unseren Grenzen nehmen zu. Wir müssen alle Reservisten und im Vorfeld auserkorene Militärspezialisten gemäß unserer Mobilisierungskarten einberufen."
 CZE_three_kings: "Drei Könige"
 CZE_three_kings_desc: "Wenn wir unsere Widerstandsgruppen in offizieller Kapazität unterstützen, können sie der Armee deutlich mehr Schaden zufügen. Außerdem könnte dies unserer Armee auch im Feld nutzen."
 CZE_form_the_state_defense_guard: "Die Staatsgarde gründen"
 CZE_form_the_state_defense_guard_desc: "Wenn wir die SOS ins Leben rufen, haben wir eine Organisation, die unsere lang gezogenen Grenzen schützen kann. Da die Mitglieder der Garde militärisch organisiert und ausgebildet sind, dienen sie als erste Verteidigungsreihe gegen jede Grenzüberschreitung."
 CZE_expand_the_horska_divisions: "Die Horská Divize erweitern"
 CZE_expand_the_horska_divisions_desc: "Da unser Land größtenteils aus niedrigen Hügeln und Plateaus besteht, sind unsere Soldaten, die speziell für den Gebirgskrieg ausgebildet sind, entscheidend in diesem schwierigen Gelände."
 CZE_develop_horska_artillery: "Horské Dělostřelectvo entwickeln"
 CZE_develop_horska_artillery_desc: "Wenn wir unsere derzeitige Artillerie leicht und zerlegbar herstellen, sorgen wir dafür, dass unsere Truppen in bergigem und hügligem Gelände ausreichend Feuerkraft haben."
 CZE_develop_horska_artillery_tech_tt: "Ermöglicht §YHorská-Artillerie§!\n§YArtillerie (Gebirge)§!\n    Angriff: §G+10%§!\n    Bewegung: §G+10%§!\n§YArtillerie (Hügel)§!\n    Angriff: §G+10%§!\n    Bewegung: §G+10%§!"
 CZE_bribery_investigations: "Ermittlungen wegen Bestechung"
 CZE_bribery_investigations_desc: "Uns erreichte ein anonymer Brief bezüglich der Verpflegung und Behandlung von Soldaten. Es gibt einige Beweise über unziemliches Verhaltung gewisser Quartiermeister-Offiziere. Wir müssen dem ein Ende setzen, bevor unser Militär noch größeren Schaden nimmt."
 CZE_bribery_investigations_remove_effect_tt: "Dieser Nationalgeist wird bei Abschluss des Schwerpunkts „§Y$CZE_bribery_investigations$§!“ entfernt."
 CZE_opl_exercises: "OPL-Manöver"
 CZE_opl_exercises_desc: "Wenn wir Flugabwehr-(OPL)-Manöver durchführen, könnte unsere Armee üben, mit mehr Koordination und Selbstschutz vorzugehen, was die allgemeine Bewegung und Sicherheit der Truppe verbessern würde."
 CZE_rapid_response_divisions: "Division Schnelle Kräfte"
 CZE_rapid_response_divisions_desc: "Das ausländische Militär hat gezeigt, wie wichtig eine mobile Einheit ist, die schneller verlegen kann als der Feind. Das Potenzial ist gewaltig. Wir könnten ähnliche Einheiten zu Testzwecken aufstellen."
 CZE_redouble_tank_development_efforts: "Panzerentwicklung zusätzlich fördern"
 CZE_redouble_tank_development_efforts_desc: "Unser aktueller Entwurf für leichte Panzerfahrzeuge ist verbesserungsfähig verglichen mit dem der Panzer anderer europäischer Länder. Wir müssen noch mehr investieren, um sicherzugehen, dass wir auf Augenhöhe sind."
 CZE_rearmed_and_retooled: "Wiederbewaffnet und modernisiert"
 CZE_rearmed_and_retooled_desc: "Unser derzeitiges Chassis für schwerere Panzer sollte modernisiert werden. Bei der künftigen Erweiterung unseres Panzerkorps sollten wir uns darauf konzentrieren."
 CZE_establish_the_fall_backlines: "Rückzugslinien definieren"
 CZE_establish_the_fall_backlines_desc: "Wir müssen realistisch sein: Unsere Verteidigung wird an einigen Stellen durchbrochen werden. Für diesen Fall kann die Existenz vorhandener Rückzugslinien den Unterschied zwischen Sieg und Niederlage bedeuten."
 CZE_establish_the_fall_backlines_masterful_delay_tactic_tt: "\nNeue Taktik: §Y$tactic_masterful_delay$§!"
 CZE_anti_tank_development: "Panzerabwehr ins Feld führen"
 CZE_anti_tank_development_desc: "Immer mehr Armeen setzen immer größere Panzerfahrzeuge ein, sodass Verbesserungen unserer Panzerabwehrgeschütze ein Muss sind. Wenn wir mit Feldgeschützen Panzer bekämpfen können, macht dies den Unterschied dabei aus, unserem Feind Einhalt zu gebieten."
 CZE_anti_tank_development_tech_tt: "Ermöglicht §YPanzerabwehr-Verbesserungen§!\n§YArtillerie§!-Durchschlagskraft: §G+5%§!\n§YUnterstützungs-Artillerie§!-Durchschlagskraft: §G+5%§!\n§YPanzerabwehr§!-Durchschlagskraft: §G+5%§!\n§YUnterstützungs-Panzerabwehr§!-Durchschlagskraft: §G+5%§!"
 CZE_recon_in_force: "Massive Aufklärung"
 CZE_recon_in_force_tech_tt: "Ermöglicht §YMassive Aufklärung§! \n§YAufklärungseinheit§!: LP: §G+5§!\nAufklärung: §G+10.0%§!"
 CZE_recon_in_force_desc: "Ein Feindkontakt unserer Aufklärer beim Auskundschaften der gegnerischen Verteidigung ist von unschätzbarem Wert für die Informationsbeschaffung."
 CZE_integrate_fortification_engineers: "Befestigungsexperten integrieren"
 CZE_integrate_fortification_engineers_desc: "Wenn unsere Experten für Armeebefestigungen nicht gerade damit beschäftigt sind, Befestigungsanlagen zu bauen, könnten wir sie an die Front verlegen. So könnten unsere Truppen an der Front bessere temporäre Verteidigungsstrukturen errichten."
 CZE_integrate_fortification_engineers_tech_tt: "Ermöglicht §YIntegrierte Befestigungsexperten§!\n§YPionier-Einheit§!:\nVerschanzung §G+10.00%§!.\n§Y(Befestigung)§!\n Verteidigung §G+10.0%§!"
 CZE_concealment_efforts: "Tarnmaßnahmen"
 CZE_concealment_efforts_desc: "Da immer mehr Bodenangriffs- und Aufklärungsflugzeuge zum Einsatz kommen, sind Tarnnetze und andere Tarnmaßnahmen zur Notwendigkeit geworden. Wir müssen noch mehr dafür sorgen, dass unsere Truppen im Feld gut getarnt sind."
 CZE_concealment_efforts_tech_tt: "Ermöglicht §YVerbesserte Tarnnetze§! \n§YInfanterie (Wald)§!\n Verteidigung: §G+10%§!"
 CZE_elevate_the_vsv: "Die Kriegsuniversität privilegieren"
 CZE_elevate_the_vsv_desc: "Das Gehirn des Militärs zu sein, ist eine enorme nationale und staatliche Verantwortung. Daher sind für den Dienst im Generalstab Offiziere mit der bestmöglichen beruflichen Ausbildung sowie hohen Anforderungen an Zuverlässigkeit, Selbstkontrolle, Taktgefühl und Charakter erforderlich."
 CZE_continue_with_snejdareks_plan_dynamic: "[CZE_continue_with_snejdareks_plan]"
 CZE_continue_with_snejdareks_plan_default: "Šnejdáreks Plan fortsetzen"
 CZE_continue_with_snejdareks_plan_no_snejdareks: "Den statischen Verteidigungsplan fortsetzen"
 CZE_continue_with_snejdareks_plan_dynamic_desc: "Das Vorhandensein eines wirksamen Verteidigungsnetzwerks verhindert unerwartetes Eindringen feindlicher Truppen. Es bietet Schutz und schafft eine starke Basis für den Übergang von strategischer Defensive zu Offensive."
 CZE_go_with_vojcechovskys_plan_dynamic: "[CZE_go_with_vojcechovskys_plan]"
 CZE_go_with_vojcechovskys_plan_default: "Lužas Plan umsetzen"
 CZE_go_with_vojcechovskys_plan_no_luza: "Doktrin der aktiven Verteidigung"
 CZE_go_with_vojcechovskys_plan_dynamic_desc: "Der Nachteil von statischen Verteidigungsanlagen ist, dass man sie nicht bewegen kann. Sobald sie durchbrochen sind, lassen sie sich nicht mehr zu offensiven Zwecken nutzen. Sie bleiben als Ruinen am ursprünglichen Ort zurück."
 CZE_improve_the_current_officer_pool: "Die derzeitige Offiziersriege verbessern"
 CZE_improve_the_current_officer_pool_desc: "Wir werden Personal befördern, das sich als fähig erwiesen hat, das Rückgrat unserer Armee zu bilden. Wir brauchen solche Leute dringend für leitende und koordinierende Rollen zwischen dem Oberbefehl und lokalen Einheiten."
 CZE_elevate_slovak_officers: "Slowakische Offiziere privilegieren"
 CZE_elevate_slovak_officers_desc: "Wir konzentrieren uns darauf, Slowaken zu privilegieren, damit sie häufiger in unseren Reihen vertreten sind. Wenn wir die Anforderungen an Bewerber aus den slowakischen Bezirken senken, sorgen wir künftig für besseren Zusammenhalt innerhalb der Armee."
 CZE_promote_moravec_writings: "Moravecs Schriften fördern"
 CZE_promote_moravec_writings_desc: "Obwohl Moravecs Werke „Soldaten und Zeit“ und „Verteidigung des Staates“ auf äußerst geteilte Reaktionen stießen, wurde seine kürzlich veröffentlichte Schrift „Die militärische Bedeutung unseres Staates in Zentraleuropa“ in der Tagespresse von ganz Europa besprochen. Wir müssen ihn ermutigen, seine Arbeit als eindeutiger Experte auf den Gebieten Verteidigungspolitik und Militärgeschichte fortzusetzen."
 CZE_lessons_of_war: "Lektionen des Krieges"
 CZE_lessons_of_war_desc: "Da wir nun Kampferfahrung gegen einen Zeitgenossen gesammelt haben, können wir diese Lektionen umsetzen. Das in echten Gefechten innerhalb der Armee Gelernte ist durch nichts zu ersetzen."
 CZE_lessons_of_war_i_had_war_with_major_flag: "Befand sich in einem Krieg mit einer Großmacht"
 CZE_for_the_homeland: "Für das Heimatland"
 CZE_for_the_homeland_desc: "Da unser Militär bestens auf die vor uns liegenden Herausforderungen vorbereitet ist, können wir nun mit Sicherheit sagen, dass wir bereit sind, unser Heimatland zu verteidigen. Wir sind jeder Aufgabe gewachsen."
 CZE_the_lions_roar: "Brüllender Löwe"
 CZE_the_lions_roar_desc: "Der tschechoslowakische Löwe symbolisiert die besten Eigenschaften unserer Armee: Mut, Kraft und Heldentum. Jeder wird den Kampgeist unserer Streitkräfte kennenlernen."
 CZE_diversify_our_specialists: "Unsere Spezialisten diversifizieren"
 CZE_diversify_our_specialists_desc: "Wir müssen unsere Spezialisten diversifizieren, die hinter den Horska-Truppen stehen. Der Krieg findet nicht nur in den Bergen und Hügeln statt."
 CZE_merge_the_financial_and_state_guard: "Finanz- und Staatsgarde zusammenlegen"
 CZE_merge_the_financial_and_state_guard_desc: "Mit der Gründung der Staatsgarde wurde die Finanzgarde überflüssig. Wenn wir sie mit der Staatsgarde zusammenlegen, würde dies unsere SOS-Zahlen schnell erhöhen."
 CZE_merge_the_financial_and_state_guard_tt: "Ermöglicht §YIntegrierte Finanzgarde§! \n§YMilitärpolizei§!: LP: §G+5§!"
 CZE_logistics_beyond_the_sudetes: "Logistik jenseits der Sudeten"
 CZE_logistics_beyond_the_sudetes_desc: "Wenn wir die Operationen außerhalb der sudetischen Berge bekämpfen wollen, müssen wir uns informieren, wie Logistik über lange Strecken funktioniert. Diese ist nämlich deutlich anspruchsvoller anders als die Logistik unserer Heimatzone."
 CZE_logistics_beyond_the_sudetes_tt: "Ermöglicht §YVerbesserte Nachschublieferungen§!\n§YLogistikkompanie§!: Nachschubbedarf: §G-10%§!"
 CZE_expand_the_river_monitor_fleet: "Die Flussüberwachungsflotte ausbauen"
 CZE_expand_the_river_monitor_fleet_desc: "Unsere Flussüberwachungsflotte gehört zu den größten Europas und unterstützt unsere Armee bei der Verteidigung von Binnengebieten. Wenn wir sie erweitern, könnte sie ihre Aufgabe deutlich besser erfüllen."
 CZE_the_tvp_project: "Das TVP-Projekt"
 CZE_the_tvp_project_desc: "Unsere Armee schlägt ein Kampfpanzer-(TVP)-Programm vor, im Zuge dessen unser Land einen eigenen Panzer entwickeln soll. Einige unserer Hersteller, die umfangreiche Erfahrung bei der Panzerproduktion haben, zeigen Interesse an unserem Projekt."
 CZE_expand_the_land_department_of_vtu: "Die Landabteilung von VTÚ erweitern"
 CZE_expand_the_land_department_of_vtu_desc: "Wenn wir die Landabteilung des Militärtechnischen Instituts (VTÚ) erweitern, könnte sie zusätzliche Geräte und Versuchsgelände erhalten und so ihre Forschung für unsere künftige Ausrüstung intensivieren."
 CZE_department_two_expansion: "Abteilung Zwei"
 CZE_department_two_expansion_desc: "Unser Geheimdienst, Abteilung 2, braucht mehr Ressourcen, damit er uns besser vor feindlichen Spionen beschützen kann. Dies könnte auch zur Vergrößerung bestimmter Flügel innerhalb der Abteilung führen."
 CZE_military_intelligence: "Flügel des militärischen Nachrichtendiensts"
 CZE_military_intelligence_desc: "Der militärische Nachrichtendienst ist einer der wichtigsten Teile eines Geheimdienstes. Wenn wir hier mehr Ressourcen investieren, könnte sich dies bezahlt machen."
 CZE_air_intelligence: "Flügel der Luftwaffenspionage"
 CZE_air_intelligence_desc: "Zu wissen, wie viele Flugzeuge eine feindliche Luftwaffe hat, gehört zu den wichtigsten Faktoren für einen siegreichen Luftkrieg. Wir brauchen Informationen über die Luftstreitkräfte des Feindes, wenn wir ihn in diesem Bereich angreifen wollen."
 CZE_within_the_eagles_nest: "Im Nest des Adlers"
 CZE_within_the_eagles_nest_desc: "Eine Armee von Informanten und Saboteuren direkt vor unserer Haustür zu haben, wäre ein gewaltiger Vorteil für unsere Armee. Mithilfe von Abteilung 2 könnten unsere Spionagenetzwerke an diesen Orten zu gewaltiger Größe anwachsen."
 CZE_restart_naval_gun_production: "Marinegeschützproduktion wiederaufnehmen"
 CZE_restart_naval_gun_production_desc: "Die Škoda-Werke waren einst der größte Entwickler und Hersteller von Marinegeschützen im Kaiserreich Österreich-Ungarn. Wenn wir die Produktion wiederaufnehmen, könnten sich Gelegenheiten beim Wiederaufbau der heimischen Marineproduktion auftun."
 CZE_restart_naval_gun_production_tt: "§YŠkoda-Priorität§! Marineschwerpunkt wird §Yaktiv§!"
 CZE_reform_the_naval_detachment: "Die Marineabteilung reformieren"
 CZE_reform_the_naval_detachment_desc: "Die Marineabteilung wurde kürzlich aufgelöst, da es vorteilhafter war, sie ins Heer zu integrieren. Die aktuellen Vorkommnisse machen deutlich, dass wir sie besser reformieren sollten."
 CZE_build_2_dockyards_when_we_have_coast_tt: "Baut sofort §G2§! §YSchiffswerften§! in einem zufälligen §YKüstenstaat§!, sofern wir einen kontrollieren"
 CZE_skoda_naval_yards: "Škoda-Marinewerften"
 CZE_skoda_naval_yards_desc: "Da wir nun einmal mehr Zugang zum Meer besitzen, können wir die alten Marineindustrien des Kaiserreichs Österreich-Ungarn mit dem Fachwissen, das wir noch innerhalb unserer Grenzen haben, wieder hochfahren. Die erneute Inbetriebnahme inländischer Werften sollte oberste Priorität haben."
 CZE_build_3_dockyards_when_we_have_coast_tt: "Baut sofort §G3§! §YSchiffswerften§! in einem zufälligen §YKüstenstaat§!, sofern wir einen kontrollieren"
 CZE_legacy_of_the_kriegsmarine: "Das Vermächtnis der Kriegsmarine"
 CZE_legacy_of_the_kriegsmarine_desc: "Wir haben erst kürzlich noch große Schlachtschiffe gebaut, und so schnell verlernt man das nicht. Dies ist das Vermächtnis der Fabriken, die beim Bau der österreich-ungarischen Kriegsmarine halfen."
 CZE_build_off_old_ganz_danubius_designs: "An alten Entwürfen von Ganz Danubius orientieren"
 CZE_build_off_old_ganz_danubius_designs_desc: "Wieder aufgetauchte Entwürfe von Ganz Danubius könnten sich auch heute noch als nützlich beim Bau neuer Schiffe der Kreuzerklasse erweisen. In unserem Reich gibt es nach wie vor Leute, die sich mit diesen Bauplänen auskennen."
 CZE_modernize_trieste_designs: "Triest-Entwürfe modernisieren"
 CZE_modernize_trieste_designs_desc: "Wenn wir alte Entwürfe der österreich-ungarischen Marine für kleinere Schlachtschiffe verwenden, erhalten wir mehr Wissen darüber, wie man diese Schiffsklasse baut."
 CZE_leverage_gunboat_experience: "Erfahrung mit Kanonenbooten nutzen"
 CZE_leverage_gunboat_experience_desc: "Unsere Erfahrung in der Kanonenboot-Entwicklung lässt sich für die Herstellung von Zerstörern nutzen. Unser aktuelles Fachwissen würde uns beim Beschleunigen des Entwicklungsvorgangs helfen."
 CZE_revive_kraljevica_designs: "Kraljevica-Entwürfe wiederverwenden"
 CZE_revive_kraljevica_designs_desc: "Wenn wir unser Wissen über Kanonenboote einbringen und alte Kraljevica-Entwürfe studieren, können wir diese Zerstörerklasse für unsere Nation einsetzen."
 CZE_wolfs_of_bohemia: "Die Wölfe Böhmens"
 CZE_wolfs_of_bohemia_desc: "Angesichts der Erfahrung mit U-Booten, die es nach wie vor innerhalb unserer Grenzen gibt, wäre es nicht sonderlich schwierig, selbst Wolfsrudel herzustellen."
 CZE_raider_lineage: "Marinetradition"
 CZE_raider_lineage_desc: "Dank unserer Offiziere, die in der österreichisch-ungarischen Marine dienten, besitzt unser Land eine lange Tradition in der Marinekriegsführung. Wir sollten diese Erfahrung nutzen."
 CZE_a_modern_navy: "Moderne Marine"
 CZE_a_modern_navy_desc: "Nach unseren unzähligen Fortschritten in der Marinetechnologie können wir endlich von uns behaupten, eine moderne und starke Marine zu haben."
 CZE_build_1_dockyards_when_we_have_coast_tt: "Baut sofort §G1§! §YSchiffswerft§! in einem zufälligen §YKüstenstaat§!, sofern wir einen kontrollieren"
 CZE_naval_aviation: "Marineflieger"
 CZE_naval_aviation_desc: "Flugzeugträger und die auf ihnen stationierten Flugzeuge scheinen die Zukunft der Seekriegsführung zu sein. Wir müssen Ressourcen in diese neuen Bereiche investieren."
 CZE_across_the_atlantic: "Überquerung des Atlantiks"
 CZE_across_the_atlantic_desc: "Eine Marine muss den Ozean überqueren können, um effektiv zu sein. Wir müssen dafür sorgen, dass unsere Marine große Entfernungen zurücklegen kann."
 CZE_joint_equipment_designs: "Gemeinsame Ausrüstungsentwicklung"
 CZE_joint_equipment_designs_desc: "[ROOT.GetNameDefCap] und [GER.GetNameDef] bilden die Speerspitze der Panzer- und Flugzeugentwicklung. Jedes Land hat seine eigenen Spezialitäten, und wir sollten Informationen teilen, damit wir uns weiter auf unsere Stärken konzentrieren können."
 CZE_negotiate_sphere_of_influence: "Interessensphäre verhandeln"
 CZE_negotiate_sphere_of_influence_desc: "Die militärischen Ressourcen von [ROOT.GetName] sind unbestritten von großem Wert für die [GER.GetAdjective]e Allianz. Es ist nur gerecht, dass wir im Gegenzug territoriale Zugewinne einfordern."
 CZE_set_up_polish_puppet_state: "Den südlichen [POL.GetAdjective]en Marionettenstaat ins Leben rufen"
 CZE_set_up_polish_puppet_state_desc: "Da [GER.GetNameDef] daran interessiert ist, einen Marionettenstaat in Polen ins Leben zu rufen, sollten wir selbstredend dasselbe versuchen."
 CZE_usurp_the_mantle: "Den Mantel übernehmen"
 CZE_usurp_the_mantle_desc: "Da sich unser Königreich von der Ostsee bis zur Adria erstreckt und wir über die historischen Territorien der Regionalmacht Österreich herrschen, können wir uns nun als rechtmäßige Nachfolger des Heiligen Römischen Reichs bezeichnen."
 CZE_austro_hungary_puppets: "Jeder §YUntertan§!, der Ziel der Schwerpunktbedingung ist"
 CZE_decrease_autonomy_tier: "Jedes §Y$autonomy_dominion$§! und jede §Y$autonomy_puppet$§! verliert eine Stufe Autonomie."
 #Exile Focus
 CZE_prepare_for_exile: "Auf das Exil vorbereiten"
 CZE_prepare_for_exile_desc: "Der Staat sollte insgeheim die Bemühungen unserer politischen Führung unterstützen, ins Ausland zu fliehen, um eine Exilregierung zu bilden."
 CZE_joins_government_in_exile_tt: "Tritt der §YExilregierung§! bei"
 CZE_infiltrate_collaborationist_organizations: "Kollaborateure infiltrieren"
 CZE_administrative_chaos_tt: "Auswirkungen auf das §YReichskommissariat§!, wenn „§Y$CZE_enter_exile$§!“ abgeschlossen wird:"
 CZE_infiltrate_collaborationist_organizations_desc: "[ROOT.GetAdjective]e Loyalisten, die der Exilregierung treu ergeben sind, in Führungspositionen kollaborativer Organisationen einzuschleusen, mag seltsam klingen, doch sie sind ideal dazu geeignet, diese Organisationen zu untergraben und uns über ihre Aktivitäten auf dem Laufenden zu halten."
 CZE_enter_exile: "Ins Exil gehen"
 CZE_enter_exile_desc: "Da potenzielle Verbündete nun endlich gegen den [GER.GetAdjective]en Alligator kämpfen, kann unsere Regierung Vorbereitungen für die Wiedererlangung unserer Souveränität treffen."
 CZE_refused_exile: "Weigerte sich, die [ROOT.GetAdjective]e Regierung aufzunehmen"
 CZE_contact_the_czech_and_slovak_legion: "Kontakt zur tschechischen und slowakischen Legion herstellen"
 CZE_contact_the_czech_and_slovak_legion_desc: "Tapfere [ROOT.GetAdjective]e Bürger sind nach [POL.GetName] und [FRA.GetName] geflohen, um den Kampf für die [CZE.GetAdjective]e Freiheit fortzusetzen. Wir sollten sie kontaktieren und sie koordinieren."
 CZE_skoda_priority_shortcut_finder: "Škoda-Priorität"
 CZE_skoda_priority_shortcut_finder_desc: "Dies ist die aktuelle Priorität von Škoda"
 #Decision unlock TT
 CZE_decision_unlock: "Neue Entscheidung: "
 CZE_demand_regime_change_tt: "$CZE_decision_unlock$§YRegimewechsel im Land fordern§!"
 CZE_propose_unification_tt: "$CZE_decision_unlock$§YLand in die Tschechoslowakische Union einladen§!"
 CZE_integrate_nation_tt: "$CZE_decision_unlock$§YLand integrieren§!"
 ###############################################
 #Germany
 GER_integrate_czech_manufacturers: "Tschechische Hersteller integrieren"
 GER_integrate_czech_manufacturers_desc: "Die böhmische Industrie ist eine Goldgrube, was Fertigungskompetenz und industrielle Ressourcen für unsere Wirtschaft anbelangt. Die zusätzlichen Kapazitäten, die Hersteller aus Böhmen mitbringen, würden unserer Rüstungsindustrie einen enormen Schub verleihen. Es ist nur sinnvoll, sie in unsere Produktionsanlagen zu integrieren."
 GER_integrate_czech_manufacturers_no_aat_tt: "§GVerfügbar§! als §YKonstruktionsbüros§!:\n§Y$CZE_skoda_works_german_organization$§!, §Y$CZE_bohmische_mahrische_maschinenfabrik_ag_german_organization$§!, §Y$CZE_zlin_aircraft_organization$§! und §Y$CZE_ceska_zbrojovka_uhersky_brod_organization$§!"
 CZE_unlocks_sokolov_raid_pfot_tt: "Schaltet den §YFallschirmjäger-Überfall§! auf §YFalkenau§! frei"
