 ### INS - Political Events
 INS_political_events.1.t: "Ein neuer Generalgouverneur für [INS.GetName]"
 INS_political_events.1.desc: "Die fünfjährige Amtszeit von [INS.GetLeader] neigt sich ihrem Ende zu, und wir müssen einen fähigen Anführer auswählen, um seinen Platz einzunehmen. Königin Wilhelmina schlug Alidius Tjarda van Starkenborgh Stachouwer vor, da er bereits Erfahrung als Botschafter und bevollmächtigter Minister sammelte."
 INS_political_events.1.a: "So die Königin es wünscht."
 INS_political_events.1.b: "[INS.GetLeader] leistete gute Arbeit. Er sollte eine weitere Amtszeit bekommen."
 INS_political_events.2.t: "[FROM.GetNameDefCap] fordert [721.GetName]"
 INS_political_events.2.desc: "Die neue republikanische Regierung von ehemals Niederländisch-Indien erklärte den gesamten Archipel zu einem Teil ihres neuen Territoriums. [FROM.GetLeader] forderte uns auf, [721.GetName] zu übergeben, und droht für den Fall einer Ablehnung unsererseits mit militärischen Maßnahmen."
 INS_political_events.2.a: "In Ordnung. Dafür lohnt es sich nicht, einen Konflikt zu provozieren."
 INS_political_events.2.b: "Kommt nicht infrage!"
 INS_political_events.3.t: "[FROM.GetNamDefCap] stimmt Übergabe von [721.GetName] zu"
 INS_political_events.3.desc: "Wie erwartet kam [FROM.GetLeader] unserer Forderung nach und hat bereits begonnen, die Truppen aus [721.GetName] abzuziehen. Die TKR traf schon mit mehreren Abgesandten der neuen Regierung in der Region ein, um sie zu sichern. [INS.GetLeader] hielt persönlich eine Rede in Dili und erklärte die Unabhängigkeit vom Einfluss der Kolonialmächte."
 INS_political_events.3.a: "Wunderbar!"
 INS_political_events.4.t: "[FROM.GetNameDefCap] verweigert die Übergabe von [721.GetName]"
 INS_political_events.4.desc: "Die Verhandlungen mit [FROM.GetName] verliefen nicht wie erwartet. [FROM.GetLeader] weigerte sich, [721.GetName] aufzugeben, und beendete das Treffen vorzeitig."
 INS_political_events.4.a: "Dann wird es Krieg geben."
 INS_political_events.5.t: "Indonesische Parlamentswahl"
 INS_political_events.5.desc: "Der heutige Tag markiert einen historischen Meilenstein für Indonesien. Da die Revolution nun offiziell für beendet erklärt wurde, kündigte Premierminister [INS.GetLeader] an, dass Indonesien seine ersten freien und demokratischen Wahlen abhalten wird. Das Ergebnis dieser Wahlen wird weitreichende Auswirkungen auf die Zukunft Indonesiens haben."
 INS_political_events.5.a: "Sutan Sjahrir führte unser Land bisher gut und sollte es auch weiterhin tun."
 INS_political_events.5.b: "Amir Sjarifuddin ist ein guter Kompromiss zwischen Sozialisten und Nationalisten."
 INS_political_events.5.c: "Mohammad Hatta hat die Revolution begonnen und wird sie auch zum Abschluss bringen."
 INS_political_events.6.t: "Unsere Vorbereitungen zeigen Wirkung"
 INS_political_events.6.desc: "Die Revolution ist in vollem Gange, und unsere Guerillakämpfer, die die Verwaltung der Niederländischen Ostindien-Kompanie unterwanderten, müssen nicht länger im Verborgenen agieren. Sie können ihre Sabotageaktionen durchführen, noch ehe die Niederlande Zeit hat, darauf zu reagieren."
 INS_political_events.6.a: "Wir müssen weiter rasch handeln."
 INS_political_events.7.t: "Die Soetardjo-Petition"
 INS_political_events.7.desc: "Die von Soetardjo eingebrachte Petition im Volksraad durchlief die internen Beratungen und liegt nun dem Generalgouverneur zur Entscheidung vor. In der Petition wird die Einberufung einer Konferenz zwischen niederländischen und indonesischen Vertretern gefordert, um den wachsenden Wunsch nach Autonomie zu besprechen. Obwohl viele fordern, dass der Status quo beibehalten werden muss und die Petition abgelehnt werden sollte, lässt sich nicht leugnen, dass die nationalistische Bewegung immer stärker und radikaler wird. Wenn wir solch friedliche Autonomieforderungen weiterhin zurückweisen, könnten die Nationalisten zu gewaltsameren Mitteln greifen."
 INS_political_events.7.a: "Wir müssen uns an den Verhandlungstisch setzen, um einen Bürgerkrieg zu verhindern."
 INS_political_events.7.b: "Der Status quo muss beibehalten werden."
 INS_political_events.7.c: "Vielleicht haben die Nationalisten nicht ganz unrecht?"
 INS_political_events.8.t: "[?event_target:INS_invasion_event_invader.GetAdjective]e Besetzung steht bevor"
 INS_political_events.8.desc: "Soldaten aus [?event_target:INS_invasion_event_invader.GetName] trafen in [?event_target:INS_invasion_event_invaded_state.GetName] ein. Da unsere Soldaten zahlenmäßig stark unterlegen waren, befahl man ihnen, [?event_target:INS_invasion_event_invaded_state.GetName] vollständig zu evakuieren. Die [?event_target:INS_invasion_event_invader.GetAdjective]en Truppen rücken in Niederländisch-Indien immer weiter vor, und unsere Chancen, eine Besetzung zu vermeiden, stehen schlecht."
 INS_political_events.8.a: "Verhaftet alle Nationalisten. Wir verteidigen unsere Heimat bis zum Tod!"
 INS_political_events.9.t: "Indonesien erklärt die Unabhängigkeit"
 INS_political_events.9.desc: "Nachdem [JAP.GetNameDef] die eigenen Truppen aus Ostindien abgezogen hatte, entsandten wir augenblicklich Soldaten nach Batavia, um die Kolonialregierung wiederaufzubauen. Bei ihrer Ankunft mussten unsere Soldaten jedoch feststellen, dass sich die politische Lage in Niederländisch-Indien seit der Besetzung stark verändert hatte. Noch ehe unsere Truppen Batavia erreichten, hatte [INS.GetLeader] bereits eine Unabhängigkeitserklärung unterzeichnet und die Republik Indonesien zum unabhängigen Staat erklärt - mit überwältigender Unterstützung der Bevölkerung."
 INS_political_events.9.a: "Schickt Panzer!"
 INS_political_events.9.b: "Weitere Kämpfe sind nicht das, was wir wollen. Bauen wir unsere eigene Heimat wieder auf."
 INS_political_events.11.t: "[HOL.GetNameDefCap] erkennt die Souveränität von Indonesien an"
 INS_political_events.11.desc: "Unmittelbar nach der Unabhängigkeitserklärung bereiteten sich unsere Milizen darauf vor, unser neues Territorium gegen die von uns erwartete niederländische Invasion zu verteidigen. Zur Überraschung vieler kündigte [HOL.GetLeader] jedoch an, dass er keine Invasion anordnen werde, sondern sich stattdessen auf den Wiederaufbau des niederländischen Kernlandes konzentrieren und weitere Konflikte vorerst vermeiden wolle."
 INS_political_events.11.a: "Eine willkommene Überraschung."
 INS_political_events.12.t: "Treffen mit indonesischen Nationalisten"
 INS_political_events.12.desc: "Unsere Truppen sind in [?event_target:INS_invasion_event_invaded_state.GetName] angekommen und ein Sieg an der indonesischen Front steht unmittelbar bevor. Wir müssen nur noch entscheiden, wie wir bei der Besetzung Indonesiens vorgehen wollen. Eine direkte Besetzung würde uns zwar die Ressourcen liefern, die wir brauchen, wäre aber auch entsprechend teuer und schwierig. Wir verhandelten mit Sukarno, einem führenden Revolutionär, und arbeiteten einen Plan aus: Wir werden einen indonesischen Marionettenstaat errichten, der zwar teilweise von Sukarno geführt wird, aber unter unserem Kommando steht. Dies wird die indonesische Bevölkerung beruhigen und wesentlich kostengünstiger sein als eine vollständige Besetzung."
 INS_political_events.12.a: "Wir sollten auch weiterhin mit Sukarno verhandeln."
 INS_political_events.12.b: "Wir sind an einer Zusammenarbeit mit Revolutionären nicht interessiert."
 INS_political_events.13.t: "[?event_target:INS_invasion_event_invader.GetAdjective]e Besetzung steht bevor"
 INS_political_events.13.desc: "Soldaten aus [?event_target:INS_invasion_event_invader.GetName] trafen in [?event_target:INS_invasion_event_invaded_state.GetName] ein. Da unsere Soldaten zahlenmäßig stark unterlegen waren, befahl man ihnen, [?event_target:INS_invasion_event_invaded_state.GetName] vollständig zu evakuieren. Die [?event_target:INS_invasion_event_invader.GetAdjective]en Truppen rücken in Niederländisch-Indien immer weiter vor, und unsere Chancen, eine Besetzung zu vermeiden, stehen schlecht. Als wäre das nicht schon schlimm genug, berichten unsere Spione, dass [?event_target:INS_invasion_event_invader.GetLeader] bei Verhandlungen mit Sukarno und anderen nationalistischen Führern gesehen wurde. Ihr Ziel ist es offenbar, einen indonesischen Marionettenstaat unter der Führung von Sukarno im Rahmen der „Wohlstandssphäre“ zu errichten."
 INS_political_events.13.a: "Verhaftet alle Nationalisten. Wir verteidigen unsere Heimat bis zum Tod!"
 INS_political_events.13.b: "Es ist gefährlich, aber vielleicht ist das unsere einzige Möglichkeit, unabhängig zu werden?"
 INS_peta_explain_tt: "Wir können das Chaos nutzen, dass die Besatzung mit sich bringt, und die totale Unabhängigkeit erklären, wenn [JAP.GetNameDef] zurückgedrängt wird."
 INS_peta_explain_tt_jap: "§R[INS.GetNameDefCap] mag uns zwar treu ergeben sein, aber wenn wir die Kontrolle über unser Territorium verlieren, könnte man unseren Täuschungsversuch durchschauen und die Unabhängigkeit erklären.§!"
 INS_political_events.14.t: "Anführer der Nationalisten verhaftet"
 INS_political_events.14.desc: "Sukarno und mehrere andere führende Revolutionäre aus Indonesien wurden von der niederländischen Militärpolizei festgenommen, noch bevor wir das Marionettenregime etablieren konnten."
 INS_political_events.14.a: "Schade. Er wäre ein wertvoller Verbündeter gewesen."
 INS_political_events.15.t: "Verteidiger des Vaterlands"
 INS_political_events.15.desc: "Die Verhandlungen mit Sukarno sind abgeschlossen und das Marionettenregime in Indonesien nimmt langsam, aber sicher Gestalt an. Sukarno konnte seine Verbindungen und unsere militärische Präsenz in der Region nutzen, um die niederländische Regierung zu destabilisieren und die faktische Kontrolle über den Archipel übernehmen."
 INS_political_events.15.a: "Wir haben nicht nur günstige Ressourcen, sondern auch einen Verbündeten gewonnen."
 INS_political_events.16.t: "[?event_target:INS_invasion_event_invader.GetAdjective]e Besetzung von Niederländisch-Indien"
 INS_political_events.16.desc: "Die [?event_target:INS_invasion_event_invader.GetAdjective]en Truppen in Niederländisch-Indien taten sich mit indonesischen Nationalisten zusammen, um unsere Kolonialverwaltung zu destabilisieren. Sie besetzten Niederländisch-Indien vollständig. Die niederländischen Flaggen wurden durch indonesische ersetzt, und die einheimische Bevölkerung scheint der [?event_target:INS_invasion_event_invader.GetAdjective]en Besatzung wohlwollender gegenüber zu sein. Für unsere Kolonialreich sieht es nicht gut aus."
 INS_political_events.16.a: "Sie mögen eine Schlacht gewonnen haben, aber noch lange nicht den Krieg."
 INS_political_events.17.t: "[INS.GetNameDefCap] erklärt die Unabhängigkeit"
 INS_political_events.17.desc: "Das große kaiserliche Hauptquartier erreichte die Nachricht, dass Sukarno und seine Clique, die wir selbst eingesetzt hatten, um die Inseln im Namen des Kaisers zu regieren, als Reaktion auf unsere wiederholten Gebietsverluste die Unabhängigkeit der [FROM.GetAdjective]en Republik ausriefen. Offenbar gehen sie davon aus, dass unser Militär andernorts benötigt wird und wir keine Truppen entbehren können, um das alles zu verhindern."
 INS_political_events.17.a: "Bedauerlicherweise könnten sie damit recht haben."
 INS_political_events.18.t: "Tan Malaka kehrt nach Indonesien zurück"
 INS_political_events.18.desc: "Tan Malaka, ein indonesischer Kommunist, der unserer Regierung in den vergangenen Jahren als Berater zur Seite stand, kündigte seinen sofortigen Rücktritt an. Da [INS.GetNameDef] nun eine freie Republik ist, will er nun endlich in das Land zurückkehren, aus dem er vor über zwei Jahrzehnten fliehen musste. Er dankt uns für das ihm gewährte Asyl und die Freiheit, seine Arbeit fortzusetzen, und gibt an, dass er in seiner Heimat benötigt würde."
 INS_political_events.18.a: "Wir wünschen ihm viel Glück."
 INS_political_events.19.t: "[HOL.GetNameDefCap] beordert Admiral Helfrich zurück"
 INS_political_events.19.desc: "[1058.GetName] wurde heute mitgeteilt, dass Admiral Conrad Helfrich, Befehlshaber unserer Seestreitkräfte und der fähigste Offizier, den wir in diesen Gewässern haben, nach Hause zurückbeordert wurde. Den Haag gibt an, seine Dienste dringend zu benötigen. Seine Abreise kommt in einem Moment, in dem unsere Position im Archipel alles andere als gesichert ist, und in der Offiziersmesse in Surabaya soll die Stimmung angespannt sein."
 INS_political_events.19.a: "Ein herber Verlust für die Flotte."
 ### INS - Industrial Events
 INS_industrial_events.4.t: "Haushaltsumverteilung in [FROM.FROM.GetName]"
 INS_industrial_events.4.desc: "Durch die Schließung von Kautschuk-Plantagen in [FROM.FROM.GetName] erschlossen wir Gelder für neue industielle Projekte in der Region."
 INS_industrial_events.4.a: "Erschließen wir ein paar Ölquellen in [FROM.FROM.GetName]."
 INS_industrial_events.4.b: "Wir sollten eine Aluminiumschmelze in [FROM.FROM.GetName] eröffnen."
 INS_industrial_events.4.c: "Wir sollten nach Ressourcen suchen, von denen wir selbst zu wenig haben."
 INS_industrial_events.4.d: "Wir könnten ein Kohlebergwerk in [FROM.FROM.GetName] errichten."
 INS_industrial_events.5.t: "[INS_industrial_events_5_t_scripted]"
 INS_industrial_events_5_t_colonial: "Die Zukunft der De Javasche Bank"
 INS_industrial_events_5_t_independent: "Die Zukunft der Bank Indonesia"
 INS_industrial_events.5.desc: "[INS_industrial_events_5_desc_scripted]"
 INS_industrial_events_5_desc_colonial: "Die Reserven der De Javasche Bank sind auf den niedrigsten Stand seit zehn Jahren gesunken. Der Gulden verliert von Monat zu Monat an Kaufkraft, und die Plantagenbesitzer verlangen Zahlungen in Fremdwährung. Unsere Finanzberater sind sich einig, dass die Bank diese Krise nicht allein bewältigen kann, doch hinsichtlich der Maßnahmen gehen ihre Meinungen weit auseinander."
 INS_industrial_events_5_desc_independent: "Die Bank Indonesia berichtet, dass die Rupiah allein im letzten Quartal fast ein Fünftel ihres Wertes verlor. Händler in Surabaya lehnen sie mittlerweile vollkommen ab und bevorzugen ausländische Banknoten. Unser Finanzminister betont, die Währung ließe sich retten - allerdings nur, wenn wir entschlossen und rasch handeln."
 INS_industrial_events.5.a: "Wir sollten versuchen, den Gulden zu stärken, anstatt ihn zu ersetzen."
 INS_industrial_events.5.b: "Wir müssen den Indischen Gulden an den Niederländischen Gulden binden."
 INS_industrial_events.5.c: "Wir müssen den Indischen Gulden an den US-Dollar binden."
 INS_industrial_events.6.t: "Eine lukrativere Vereinbarung"
 INS_industrial_events.6.desc: "Das Kina-Büro akzeptierte unsere Bedingungen. Da die Hälfte der Tropen von Malaria heimgesucht wurde und es keinen Ersatz für Chinin gibt, blieb kaum eine andere Wahl. Die neue Vereinbarung garantiert uns einen deutlich größeren Anteil an den Gewinnen aus jedem Gramm Chinin, das unser Land verlässt. Die Frage ist nur, wohin wir diesen unerwarteten Gewinn lenken sollen."
 INS_industrial_events.6.a: "Investieren wir das Geld in unsere Städte."
 INS_industrial_events.6.b: "Wir müssen die Inseln entwickeln."
 INS_industrial_events.6.c: "Wir müssen unsere Militärindustrie stärken."
 # Rubber shipment dispatched
 INS_industrial_events.28.t: "Kautschuklieferung versandt"
 INS_industrial_events.28.desc: "Die Konvois verluden die restliche Kautschukladung und stachen in See. Die Käufer werden das erhalten, wofür sie bezahlt haben, und die vereinbarte Vergütung wird zu gegebener Zeit in unseren Büchern verbucht. In den nächsten zwei Jahren werden die Kosten dieser Transaktion in unseren Bilanzen stehen und eine Mahnung daran sein, was uns die Weltwirtschaftskrise abverlangt."
 INS_industrial_events.28.a: "Zur Kenntnis genommen."
 INS_industrial_events.28.b: "Arrangiert eine weitere Lieferung."
 # Oil shipment dispatched
 INS_industrial_events.36.t: "Öllieferung versandt"
 INS_industrial_events.36.desc: "Die Öltanker verließen unsere Raffinerien und steuern bereits die Häfen der Käufer an. Die Vergütung dafür wird in voller Höhe ausgezahlt werden, doch der Verkauf wird unsere Wirtschaft noch zwei Jahre lang belasten. Das sind die Bedingungen, die uns die Welt in diesen unsicheren Jahren vorschreibt."
 INS_industrial_events.36.a: "Zur Kenntnis genommen."
 INS_industrial_events.36.b: "Arrangiert eine weitere Lieferung."
 ### INS - Volksraad
 INS_volksraad_events.2.t: "[HOL.GetLeader] legte Veto gegen die Petition im Volksraad ein"
 INS_volksraad_events.2.desc: "Die Petition wurde zwar von [INS.GetLeader] akzeptiert, [HOL.GetLeader] legte jedoch nach genauerer Überprüfung ein Veto ein, weshalb wir die Umsetzung zum jetzigen Zeitpunkt nicht fortsetzen können."
 INS_volksraad_events.2.a: "Vielleicht können wir es in Zukunft noch einmal versuchen."
 # Generic/Reused
 INS_volksraad_events.10.t: "Antrag im Volksraad bezüglich der Zulassung der indonesischen Sprache an Schulen"
 INS_volksraad_events.10.desc: "[INS.GetLeader] stimmte einer Petition im Volksraad zu, laut der Schulen und Universitäten die indonesische Sprache in [INS.GetName] unterrichten sollen. Die Petition wurde bereits [HOL.GetLeader] vorgelegt, der sie nur noch final absegnen muss."
 INS_volksraad_events.10.a: "Der Volksraad erfüllt seinen Zweck."
 INS_volksraad_events.10.b: "Auf keinen Fall. Wir legen ein Veto ein!"
 INS_volksraad_events.11.t: "Es wird in indonesischer Sprache unterrichtet."
 INS_volksraad_events.11.desc: "Die Petition wurde von [HOL.GetLeader] unterzeichnet und ist nun rechtskräftig. Sobald die letzten Einzelheiten geklärt sind, wird ihre Umsetzung beginnen."
 INS_volksraad_events.11.a: "Der Volksraad erfüllt seinen Zweck."
 # Individual laws
 INS_volksraad_events.20.t: "Antrag im Volksraad bezüglich der Zulassung der indonesischen Sprache innerhalb der Regierung"
 INS_volksraad_events.20.desc: "Für Regierungsämter in Niederländisch-Indien, einschließlich einer Mitgliedschaft im Volksraad, sind fließende Niederländischkenntnisse erforderlich, was dazu führte, dass viele im Volksraad, insbesondere Vertreter der einheimischen Gemeinschaften, die Legitimität der Demokratie infrage stellen. Sie legten einen Antrag vor, mit dem sie fordern, dass Regierungsämter vorrangig mit Personen besetzt werden sollten, die Indonesisch sprechen."
 INS_volksraad_events.21.t: "Die indonesische Sprache darf jetzt innerhalb der Regierung genutzt werden!"
 INS_volksraad_events.21.desc: "Die Petition wurde von [HOL.GetLeader] unterzeichnet und ist nun rechtskräftig. Sobald die letzten Einzelheiten geklärt sind, wird ihre Umsetzung beginnen."
 INS_volksraad_events.30.t: "Antrag im Volksraad bezüglich der Abschaffung des Bildungsquotensystems"
 INS_volksraad_events.30.desc: "[INS.GetLeader] stimmte einer Petition im Volksraad zu, mit der das Bildungsquotensystem in [INS.GetName] abgeschafft werden soll, um die langwierigen Auseinandersetzungen im Volksraad über dessen Umsetzung und Fairness zu beenden. Die Petition wurde bereits [HOL.GetLeader] vorgelegt, der sie nur noch final absegnen muss."
 INS_volksraad_events.31.t: "Das Bildungsquotensystem wurde abgeschafft"
 INS_volksraad_events.31.desc: "Die Petition wurde von [HOL.GetLeader] unterzeichnet und ist nun rechtskräftig. Sobald die letzten Einzelheiten geklärt sind, wird ihre Umsetzung beginnen."
 INS_volksraad_events.40.t: "Antrag im Volksraad bezüglich verringerter Exportsteuern auf Kautschuk"
 INS_volksraad_events.40.desc: "[INS.GetLeader] unterzeichnete eine Volksraad-Petition, um die hohen Steuern auf private Kautschukplantagen zu senken. Diese Steuern erlaubten es der Regierung in der Vergangenheit, ein sehr lukratives Monopol auf Kautschuk aufrechtzuerhalten. Aufgrund des internationalen Protektionismus ist dieses System jedoch mittlerweile weit weniger rentabel. [INS.GetLeader] ist der Ansicht, dass die Steuern nicht länger die von ihnen verursachten wirtschaftlichen Folgen rechtfertigen."
 INS_volksraad_events.40.a: "[INS.GetLeader] hat nicht ganz unrecht."
 INS_volksraad_events.40.b: "Die Steuern bleiben."
 INS_volksraad_events.41.t: "Die Steuer auf Kautschukexporte wurde reduziert"
 INS_volksraad_events.41.desc: "Die Petition wurde von [HOL.GetLeader] unterzeichnet und ist nun rechtskräftig. Sobald die letzten Einzelheiten geklärt sind, wird ihre Umsetzung beginnen."
 INS_volksraad_events.60.t: "Antrag im Volksraad zur Aufhebung der Rangbegrenzung für indonesische Offiziere"
 INS_volksraad_events.60.desc: "[INS.GetLeader] stimmte einem Antrag im Volksraad zu, die ungeschriebene Regel aufzuheben, den Rang zu begrenzen, den nicht-niederländische Offiziere innerhalb der KNIL bekleiden dürfen. Dies erlaubt die Beförderung indonesischer Offiziere, deren Rang angesichts ihrer Leistungen als zu niedrig angesehen wird. Die Petition wurde bereits [HOL.GetLeader] vorgelegt, der sie nur noch final absegnen muss."
 INS_volksraad_events.61.t: "Die unsichtbare Obergrenze für den Rang [INS.GetAdjective]er Generäle wurde aufgehoben"
 INS_volksraad_events.61.desc: "Die Petition wurde von [HOL.GetLeader] unterzeichnet und ist nun rechtskräftig. Sobald die letzten Einzelheiten geklärt sind, wird ihre Umsetzung beginnen."
 INS_volksraad_events.70.t: "Antrag im Volksraad zur Legalisierung von nationalistischen Flaggen und Symbolen in der Öffentlichkeit"
 INS_volksraad_events.70.desc: "[INS.GetLeader] stimmte einem Antrag im Volksraad zu, die Beschränkungen für das Zeigen der Nationalflagge und anderer nationalistischen Symbole im öffentlichen Raum aufzuheben, vor allem um der Radikalisierung vieler junger Nationalisten entgegenzuwirken. [INS.GetLeader] hofft, dass wir in dieser Frage eine defensive Haltung einnehmen und mit einer friedlichen nationalistischen Führung zusammenarbeiten, während wir gleichzeitig unsere revolutionären Bewegungen festigen. Die endgültige Entscheidung liegt jedoch letztlich bei uns."
 INS_volksraad_events.71.t: "Die rot-weiße Flagge darf wieder gezeigt werden!"
 INS_volksraad_events.71.desc: "Die Petition wurde von [HOL.GetLeader] unterzeichnet und ist nun rechtskräftig. Sobald die letzten Einzelheiten geklärt sind, wird ihre Umsetzung beginnen."
 INS_volksraad_events.100.t: "Antrag im Volksraad bezüglich Bildungszuschüssen für Nicht-Niederländer"
 INS_volksraad_events.100.desc: "[INS.GetLeader] stimmte einer Petition im Volksraad zu, laut der sich nicht-niederländische Staatsbürger in [INS.GetName] für Bildungszuschüsse bewerben können. Die Petition wurde bereits [HOL.GetLeader] vorgelegt, der sie nur noch final absegnen muss."
 INS_volksraad_events.101.t: "[INS.GetAdjective]e Bürger können sich jetzt für Bildungszuschüsse bewerben"
 INS_volksraad_events.101.desc: "Die Petition wurde von [HOL.GetLeader] unterzeichnet und ist nun rechtskräftig. Sobald die letzten Einzelheiten geklärt sind, wird ihre Umsetzung beginnen."
 ### INS - Dutch Interaction Events
 INS_dutch_events.1.t: "[INS.GetNameDef] fordert Befehlsgewalt über unsere Marine"
 INS_dutch_events.1.desc: "Nach dem Verlust unseres Heimatlandes bat [INS.GetNameDef] darum, dass wir die Befehlsgewalt über unsere Marinetruppen abtreten. Man argumentiert, eine einheitliche Leitung werde in dieser bislang beispiellosen Zeit eine bessere Koordination ermöglichen."
 INS_dutch_events.1.a: "Wenn es der Sache dient, müssen wir uns fügen."
 INS_dutch_events.1.b: "Unsere Schiffe unterstehen ausschließlich Den Haag."
 INS_dutch_events.2.t: "[HOL.GetNameDefCap] akzeptiert unseren Marinebefehlsvorschlag"
 INS_dutch_events.2.desc: "[HOL.GetNameDefCap] stimmte unserem Vorschlag zu, die Befehlsgewalt über die Seestreitkräfte abzutreten. Der Übergang verlief reibungslos, und sowohl die [HOL.GetAdjective]en als auch [INS.GetAdjective]en Offiziere arbeiten nun Seite an Seite, um unsere Position im Pazifik zu stärken."
 INS_dutch_events.2.a: "Gemeinsam werden wir den Pazifik halten können."
 INS_dutch_events.3.t: "[HOL.GetNameDefCap] lehnt unseren Marinebefehlsvorschlag ab"
 INS_dutch_events.3.desc: "[HOL.GetNameDefCap] lehnte unseren Vorschlag für ein gemeinsames Marinekommando unter Verweis auf logistische und administrative Bedenken ab. Dies ist zwar ein herber Rückschlag, doch wir müssen nach vorn blicken und unsere Zusammenarbeit im Rahmen der Kriegsanstrengungen über andere Kanäle fortsetzen."
 INS_dutch_events.3.a: "Wir finden schon einen anderen Weg, um unseren Marineeinfluss zu festigen."
 INS_dutch_events.4.t: "[HOL.GetNameDefCap] ruft das [HOL.GetName]-[INS.GetName]e Marineprogramm ins Leben"
 INS_dutch_events.4.desc: "[HOL.GetNameDefCap] gab die Schaffung des [HOL.GetName]-[INS.GetName]en Marineprogramms bekannt, eine gemeinsame Initiative zur Umstrukturierung und zum Ausbau unserer Seestreitkräfte. Die [HOL.GetAdjective]e Erfahrung gebündelt mit der [INS.GetAdjective]en Mannstärke werden das Rückgrat eines neuen Verteidigungsnetzwerks im Pazifik bilden."
 INS_dutch_events.4.a: "Ein wichtiger Schritt für unser gemeinsames Überleben."
 ### INS - Netherlands–Indonesia Union Events
 INS_union_events.1.t: "[HOL.GetNameDefCap] bat darum, die Regierung nach [1058.GetName] verlegen zu dürfen"
 INS_union_events.1.desc: "Da das eigene Heimatland verloren ist, setzte uns [HOL.GetNameDef] darüber in Kenntnis, dass ihre Regierung und die Königsfamilie nach [1058.GetName] umverlegt werden sollen. Man betont den Gedanken der Kontinuität und die Pflicht, das Königreich dort am Leben zu erhalten, wo die Flagge noch weht."
 INS_union_events.1.a: "Der Krieg wird von [1058.GetName] aus fortgeführt."
 INS_union_events.1.b: "Für wen halten die sich? Das ist doch nur ein Versuch, die koloniale Vorherrschaft wiederherzustellen!"
 INS_union_events.2.t: "[INS.GetNameDefCap] stimmt Umverlegungsvorschlag zu"
 INS_union_events.2.desc: "[INS.GetNameDefCap] stimmte zu, unsere Exilregierung in [1058.GetName] aufzunehmen. Die Vorbereitungen für die Umverlegung laufen bereits, und beide Verwaltungen koordinieren die Zusammenlegung der Büros und des Personals. Gemeinsam werden wir die Fackel des Königreichs vom Osten aus weitertragen."
 INS_union_events.2.a: "Eine vereinte Front gegen einen gemeinsamen Feind."
 INS_union_events.3.t: "[INS.GetNameDefCap] lehnt Umverlegungsvorschlag ab"
 INS_union_events.3.desc: "[INS.GetNameDefCap] lehnte unsere Bitte ab, unsere Regierung nach [1058.GetName] verlegen zu dürfen. [INS.GetLeader] gab an, dass wir kein Recht hätten, ein solches Maß an Hilfe zu verlangen, da man ohnehin schon völlig überlastet sei."
 INS_union_events.3.a: "Offenbar haben sie vergessen, unter wessen Banner wir noch immer vereint sind."
 INS_union_events.4.t: "[HOL.GetNameDefCap] verlegt Streitkräfte nach [1058.GetName]"
 INS_union_events.4.desc: "Die ersten Transporte aus der Heimat sind eingetroffen. Schiffe, vollgepackt mit Offizieren, Soldaten und den Überresten des Waffenarsenals. Wie erwartet erreichten einige Konvois den Hafen nicht. Die, die Überfahrt überleben, werden das Rückgrat unserer neuen Streitkräfte in [1058.GetName] bilden."
 INS_union_events.4.a: "Genug, um die Flagge hochzuhalten."
 # INS proposed union
 INS_union_events.5.t: "[INS.GetNameDefCap] schlägt Niederlande-Indonesien-Union vor"
 INS_union_events.5.desc: "Der ganzen Welt ist klar, dass der Krieg nicht zu unseren Gunsten verläuft. Unser Land ist gefallen und unsere Operationsbasis musste in den Osten verlegt werden. [INS.GetAdjective]e Minister unterbreiteten uns deshalb einen Vorschlag: einen gemeinsamen Unionsstaat unter der Führung von Königin Wilhelmina, um eine möglichst umfassende Zusammenarbeit zu gewährleisten. Auch wenn offenbar niemand von diesem Vorschlag übermäßig begeistert ist, könnte er unser Schlüssel zum Überleben sein."
 INS_union_events.5.a: "Dieses Risiko müssen wir eingehen. Lang lebe die Königin!"
 INS_union_events.5.b: "Das liegt nicht in unserem Interesse."
 INS_union_events.6.t: "[HOL.GetNameDef] stimmt Unionsvorschlag zu"
 INS_union_events.6.desc: "Nach einer Dringlichkeitsdebatte im Kabinett stimmte [HOL.GetLeader] dem [INS.GetAdjective]en Unionsvorschlag zu. Das Dekret fällt kurz aus und verzichtet auf jegliches Zeremoniell. Unsere Regierungen werden fortan bis zum Kriegsende unter der Krone als Einheit geführt."
 INS_union_events.6.a: "Ein historisches Abkommen für beide Nationen."
 INS_union_events.7.t: "[HOL.GetNameDefCap] lehnt Unionsvorschlag ab"
 INS_union_events.7.desc: "Das [HOL.GetAdjective]e Kabinett lehnte unseren Vorschlag einer gemeinsamen Union ab. Ihre Botschaft ist eindeutig: Die Zusammenarbeit wird fortgesetzt, doch die Souveränität nicht geteilt."
 INS_union_events.7.a: "Es hätte sowieso nicht funktioniert."
 # HOL proposed union
 INS_union_events.8.t: "[HOL.GetNameDefCap] schlägt Niederlande-Indonesien-Union vor"
 INS_union_events.8.desc: "Der ganzen Welt ist klar, dass der Krieg nicht zu unseren Gunsten verläuft. [HOL.GetNameDefCap] ist gefallen, und die Operationsbasis dieser Nation musste in den Osten verlegt werden. Die [HOL.GetAdjective]e Führung unterbreitete uns deshalb einen Vorschlag: einen gemeinsamen Unionsstaat unter der Führung von Königin Wilhelmina, um eine möglichst umfassende Zusammenarbeit zu gewährleisten. Auch wenn offenbar niemand von diesem Vorschlag übermäßig begeistert ist, könnte er unser Schlüssel zum Überleben sein."
 INS_union_events.8.a: "Es muss getan werden."
 INS_union_events.8.b: "Das ist doch nur ein Versuch, die koloniale Vorherrschaft wiederherzustellen!"
 INS_union_events.9.t: "[INS.GetNameDefCap] stimmt Unionsvorschlag zu"
 INS_union_events.9.desc: "[INS.GetNameDefCap] stimmte unserem Vorschlag zu. Es ist ungewiss, in welche Richtung sich diese Union entwickelt, doch zumindest können wir uns weiter auf den Krieg konzentrieren."
 INS_union_events.9.a: "Wenn wir durchhalten wollen, müssen wir es gemeinsam tun."
 INS_union_events.10.t: "[INS.GetNameDefCap] lehnt Unionsvorschlag ab"
 INS_union_events.10.desc: "[INS.GetNameDefCap] lehnte unseren Unionsvorschlag ab. Das [INS.GetAdjective]e Volk und seine Führung glauben nicht, dass dies langfristig funktioniert, und lehnen jeden Vorschlag ab, ihre Macht aufzugeben."
 INS_union_events.10.a: "Es hätte sowieso nicht funktioniert."
 # Flags
 INS_exile_accepted_flag: "Beherbergt die [HOL.GetAdjective]e Exilregierung"
 INS_hey_btw_you_are_gonna_die_just_know_that_yeah_tt: "§RHierdurch endet das Spiel für uns.§!"
 # Revolution events
 INS_revolution_events.1.t: "[HOL.GetNameDefCap] plant, die Republik zu zerschlagen"
 INS_revolution_events.1.desc: "Wie erwartet reagierte die niederländische Regierung auf unsere Forderung nach Unabhängigkeit, indem sie Soldaten nach [1058.GetName] entsandte und über die Medien antirepublikanische Propaganda verbreitete."
 INS_revolution_events.1.a: "Wir müssen rasch handeln."
 INS_revolution_events.2.t: "[HOL.GetNameDefCap] bittet um zusätzliche Unterstützung"
 INS_revolution_events.2.desc: "[HOL.GetLeader] berief eine Krisensitzung mit unserer Führung ein. Man bittet darum, dass wir weitere Hilfe bei der Rückeroberung von Niederländisch-Indien leisten und uns direkt an dem Konflikt beteiligen. [HOL.GetLeader] erklärte, die Lage sei ernst und die niederländischen Streitkräfte wären nicht in der Lage, die revolutionären Milizen aufzuhalten. [HOL.GetLeader] versprach, uns Borneo zu überlassen, sollten wir diese Sache unterstützen."
 INS_revolution_events.2.a: "Wir tun es für Borneo."
 INS_revolution_events.2.b: "Wir sind nicht interessiert."
 INS_revolution_events.3.t: "[ENG.GetNameDefCap] stimmt London-Batavia-Abkommen zu"
 INS_revolution_events.3.desc: "[ENG.GetNameDefCap] stimmte zu, dem Konflikt beizutreten, und entsandte bereits mehrere Divisionen zur Unterstützung nach Batavia. Auch wenn wir Borneo aufgeben müssen, verschiebt dies das Kräfteverhältnis deutlich zu unseren Gunsten."
 INS_revolution_events.3.a: "Borneo ist ein notwendiges Opfer."
 INS_revolution_events.4.t: "[ENG.GetNameDefCap] lehnt London-Batavia-Abkommen ab"
 INS_revolution_events.4.desc: "[ENG.GetNameDefCap] weigerte sich trotzt der Dringlichkeit und der von uns angebotenen Belohnung, den Konflikt noch weiter zu unterstützen. [ENG.GetLeader] erklärte, es liege zwar in ihrem besten Interesse, unser Kolonialreich zu erhalten, das Risiko einer weltweiten Eskalation nach ihrer Beteiligung jedoch zu hoch sei und wir diese Angelegenheit selbst regeln müssten."
 INS_revolution_events.4.a: "Es sieht nicht gut für uns aus."
 INS_revolution_events.5.t: "[HOL.GetNameDefCap] bittet um Hilfe"
 INS_revolution_events.5.desc: "Die revolutionären Truppen in Niederländisch-Indien erklärten die Unabhängigkeit von [HOL.GetName] und besetzten mehrere Städte. [HOL.GetLeader] wandte sich infolgedessen mit Nachdruck an uns und bat um militärische Unterstützung, während man eine Invasion vorbereitet."
 INS_revolution_events.5.a: "Sollten die Revolutionäre gewinnen, könnte dies unsere Kolonien inspirieren, es ihnen gleichzutun."
 INS_revolution_events.5.b: "Wir sind nicht interessiert."
 INS_revolution_events.6.t: "[ENG.GetNameDefCap] willigt ein, uns zu helfen"
 INS_revolution_events.6.desc: "[ENG.GetNameDefCap] wird Freiwillige und Ausrüstung nach [1058.GetName] schicken, um uns bei unseren Bemühungen zu unterstützen, die Kontrolle über Niederländisch-Indien wiederzuerlangen."
 INS_revolution_events.6.a: "Das wird leicht sein."
 INS_revolution_events.7.t: "[ENG.GetNameDefCap] weigert sich, uns zu helfen"
 INS_revolution_events.7.desc: "[ENG.GetNameDefCap] weigerte sich, uns dabei zu helfen, die Kontrolle über Niederländisch-Indien wiederzuerlangen. Man besteht darauf, dass Niederländisch-Indien nicht in den eigenen Zuständigkeitsbereich falle. Wir werden die KNIL mit eigenen Mitteln wiederaufrüsten müssen."
 INS_revolution_events.7.a: "Das ist inakzeptabel!"
 INS_revolution_events.8.t: "Revolutionäre Milizen schmieden Pläne in Niederländisch-Indien"
 INS_revolution_events.8.desc: "Unsere Kolonialpolizei in Ostindien nahm mehrere Mitglieder einer revolutionären Bewegung in Indonesien fest und verhörte sie. Offenbar versuchten sie, sich zu bewaffnen, um die Unabhängigkeit anzustreben. Es kann noch nicht mit Sicherheit gesagt werden, doch möglicherweise planen sie eine bewaffnete Revolution."
 INS_revolution_events.8.a: "Wir müssen genaustens beobachten, wie sich das entwickelt."
 INS_revolution_events.9.t: "Indonesische Unabhängigkeitserklärung"
 INS_revolution_events.9.desc: "[INS.GetLeader] hielt heute auf Java eine Rede, um die Unabhängigkeit der neu gegründeten Republik Indonesien zu verkünden. Wir erkennen diese neue Republik selbstverständlich nicht an, doch ihre Milizen haben das Territorium besetzt und unsere Kolonialpolizei ist nicht in der Lage, die Kontrolle aufrechtzuhalten. Wenn wir die Lage dort nicht ernst nehmen, könnte ein totaler Krieg ausbrechen."
 INS_revolution_events.9.a: "Inakzeptabel!"
 INS_revolution_events.9.b: "Das ist den Aufwand nicht wert. Sie können ihre Unabhängigkeit haben."
 #INS_revolution_events.10.t: ""
 #INS_revolution_events.10.desc: ""
 #INS_revolution_events.10.a: ""
 INS_revolution_events.11.t: "Kolonialpolizei stoppt Milizen erfolgreich"
 INS_revolution_events.11.desc: "Obwohl es die republikanischen Milizen kurzzeitig schafften, [?event_target:INS_temp_occupied_state.GetName] zu besetzen, waren unsere tapferen Soldaten in Niederländisch-Indien in der Lage, sie zurückzudrängen und die vollständige Kontrolle über die Region wiederherzustellen."
 INS_revolution_events.11.a: "Ein weiterer Sieg für [HOL.GetName]"
 INS_revolution_events.12.t: "Versuch der Milizen, [?event_target:INS_temp_occupied_state.GetName] zu besetzen"
 INS_revolution_events.12.desc: "Eine Gruppe republikanischer Milizen versuchte, [?event_target:INS_temp_occupied_state.GetName] zu besetzen. Unsere Polizei und Soldaten schafften es zwar, die Lage unter Kontrolle zu bringen, doch immer mehr Zivilisten unterstützen die Miliz und sprechen sich öffentlich gegen die [HOL.GetAdjective]e Regierung aus."
 INS_revolution_events.12.a: "Wir dürfen nicht zulassen, dass dies weiter eskaliert."
 INS_revolution_events.14.t: "Milizen besetzen [?event_target:INS_temp_occupied_state.GetName]"
 INS_revolution_events.14.desc: "Trotz aller Bemühungen seitens unserer Kolonialpolizei und unserer Soldaten gelang es den republikanischen Milizen, [?event_target:INS_temp_occupied_state.GetName] zu besetzen. Unsere Truppen musste sich zurückziehen und sahen sich wegen des heftigen Widerstands der Milizen gezwungen, die Regierungsunfähigkeit zu erklären. Wenn wir uns weiterhin von den Milizen herumschubsen lassen, laufen wir Gefahr, unsere Kolonie für immer zu verlieren."
 INS_revolution_events.14.a: "Das ist unerhört!"
 INS_revolution_no_effect_tt: "Keine Auswirkungen"
 INS_revolution_events.19.t: "Friedensverhandlungen in Niederländisch-Indien"
 INS_revolution_events.19.desc: "[INS.GetLeader] und [INS.GetLeader] trafen sich, um einen möglichen Frieden auszuhandeln. [INS.GetLeader] gab an, dass bereits viel zu viele ihr Leben verloren, und schlug eine Zweistaatenlösung vor, bei der die Grenzen - mit geringfügigen Anpassungen - so bleiben, wie sie derzeit sind, um die Kämpfe endgültig zu beenden."
 INS_revolution_events.19.a: "Wir müssen akzeptieren. Es gab schon zu viele Tote."
 INS_revolution_events.19.b: "Wenn sie so dringend Frieden wollen, sollen sie kapitulieren."
 INS_revolution_events.20.t: "[HOL.GetNameDefCap] stimmt Zweistaatenlösung zu"
 INS_revolution_events.20.desc: "[INS.GetLeader] kehrte mit guten Nachrichten von dem Treffen mit [HOL.GetLeader] zurück. Beide Seiten stimmten einer Zweistaatenlösung zu und wir werden unsere Truppen entsprechend der neuen Grenzen unverzüglich verlegen. Auch wenn niemand glücklich darüber ist, dass wir einige unserer indonesischen Mitbürger zurücklassen mussten, wird zumindest kein weiteres Blut vergossen."
 INS_revolution_events.20.a: "Das Blutvergießen nimmt endlich ein Ende."
 INS_revolution_events.21.t: "[HOL.GetNameDefCap] stellt Kämpfe nicht ein"
 INS_revolution_events.21.desc: "Das Treffen zwischen [INS.GetLeader] und [HOL.GetLeader] verlief nicht nach Plan. Beide Seiten waren sichtlich verärgert und weigerten sich, Kompromisse einzugehen, wodurch das Treffen vorzeitig endete."
 INS_revolution_events.21.a: "Wie viele Leben müssen noch geopfert werden?"
 INS_revolution_events.22.t: "[HOL.GetNameDefCap] bittet um Hilfe"
 INS_revolution_events.22.desc: "[HOL.GetLeader] lud [FRA.GetLeader] zu einem Treffen in Amsterdam ein, um über die derzeitige Lage von Niederländisch-Indien zu sprechen. Während des Treffens erklärte [HOL.GetLeader], dass sich die Milizen schneller bewaffnen als angenommen und ihnen die niederländischen Truppen schon bald nichts mehr entgegensetzen zu haben, was dazu führen wird, dass [HOL.GetNameDef] die Hegemonie über die Kolonie verlieren könnte. [HOL.GetLeader.GetHeShe] bat darum, dass wir uns dem Konflikt offiziell auf der Seite der Niederlande anschließen und Divisionen nach Batavia entsenden, um Niederländisch-Indien zurückzuerobern. Im Gegenzug versprach man uns den Nordosten Sumatras, sobald die Ordnung wiederhergestellt wurde."
 INS_revolution_events.22.a: "Es wird zwar kostspielig sein, doch Sumatra könnte es wert sein."
 INS_revolution_events.22.b: "Sie bitten uns um zu viel."
 INS_revolution_events.23.t: "[FRA.GetNameDefCap] willigt ein, uns zu helfen"
 INS_revolution_events.23.desc: "[FRA.GetNameDefCap] kam unserem Hilferuf nach und entsandte eine Reihe französischer Divisionen nach Batavia, um unsere Bemühungen zu unterstützen, die Ordnung aufrechtzuerhalten."
 INS_revolution_events.23.a: "Das Blatt wendete sich zu unseren Gunsten."
 INS_revolution_events.24.t: "[FRA.GetNameDefCap] verweigert die Hilfe"
 INS_revolution_events.24.desc: "[FRA.GetNameDefCap] weigerte sich trotz der von uns ausgedrückten Dringlichkeit, uns mit der Revolution zu helfen. Wir müssen unverzüglich mit der Wiederaufrüstung beginnen, da wir ansonsten schon bald zahlenmäßig unterlegen sein werden."
 INS_revolution_events.24.a: "Es sieht nicht gut für uns aus."
 INS_revolution_events.25.t: "Das Ende des Krieges in Indonesien"
 INS_revolution_events.25.desc: "Die [HOL.GetAdjective]en Truppen zerstörten die wichtigsten Stützpunkte der Milizen und stürzten die republikanische Regierung. Die Führung und die Befehlshaber der Republikaner wurden verhaftet, und die Regierung von Niederländisch-Indien hat bereits begonnen, die ehemaligen Territorien der Republik wieder in die Verwaltung einzugliedern. Wie versprochen wurde uns das vereinbarte Territorium übertragen."
 INS_revolution_events.25.a: "Wunderbar!"
 INS_revolution_events.26.t: "Das Ende des Krieges in Indonesien"
 INS_revolution_events.26.desc: "Die Kämpfe zwischen den [HOL.GetAdjective]en Truppen und den republikanischen Milizen halten schon viel länger an, als beide Seiten erwartet hatten, und [HOL.GetLeader] stimmte zu, einen Frieden zu unterzeichnen, der eine Zweistaatenlösung vorsieht. Da wir unseren Teil der Vereinbarung einhielten, bestätigte [HOL.GetLeader], dass wir das versprochene Territorium dennoch erhalten werden."
 INS_revolution_events.26.a: "Eine spannende Entwicklung."
 INS_revolution_events.27.t: "Das Ende des Krieges in Indonesien"
 INS_revolution_events.27.desc: "Die Kämpfe zwischen den [HOL.GetAdjective]en Truppen und den republikanischen Milizen halten schon viel länger an, als beide Seiten erwartet hatten, und trotz aller Bemühungen seitens [HOL.GetName] und unserer eigenen Einmischung führte die schiere Anzahl an Milizen und Guerillakämpfern dazu, dass der Konflikt in eine Pattsituation geraten ist, die stark zugunsten der Republikaner ausfällt. [HOL.GetLeader] verkündete deshalb heute, dass ein Friedensvertrag mit der Republik unterzeichnet wurde, der eine Zweistaatenlösung zugunsten der Republik vorsieht. Was von Niederländisch-Indien übrig ist, ist nur ein Schatten seines einstigen Ruhms. Da der Konflikt in einer Niederlage endete, gab [HOL.GetLeader] an, dass man nicht in der Lage sei, uns das versprochene Territorium zu übertragen."
 INS_revolution_events.27.a: "Das ist doch Wahnsinn!"
 INS_revolution_events.28.t: "Verlust von Niederländisch-Indien"
 INS_revolution_events.28.desc: "Trotz der hohen [HOL.GetAdjective]en Militärpräsenz und unserer eigenen direkten Beteiligung an dem Konflikt gelang es der republikanischen Miliz in Niederländisch-Indien, unsere Streitkräfte zu überwältigen, alle größeren Städte zu besetzen, die niederländische Verwaltung zu stürzen und eine Kapitulation zu erzwingen."
 INS_revolution_events.28.a: "Aber uns wurden Gebiete versprochen!"
 INS_revolution_events.29.t: "Verlust von Niederländisch-Indien"
 INS_revolution_events.29.desc: "Trotz all unserer Bemühungen übernahmen die Revolutionäre in Niederländisch-Indien die Kontrolle über unsere größeren Städte und vernichteten die Zentralregierung von innen heraus. Unsere Generäle wurden gefangen genommen und unser Kommunikationsnetzwerk wurde unterbrochen. Uns bleibt nichts anderes übrig, als unsere Niederlage einzugestehen."
 INS_revolution_events.29.a: "Was für eine Tragödie."
 INS_revolution_events.30.t: "[INS.GetLeader] schlägt Waffenstillstand vor"
 INS_revolution_events.30.desc: "[INS.GetLeader] schlug einen Waffenstillstand in [FROM.GetName] vor und versprach, seine Truppen aus [FROM.GetName] zurückzuziehen, damit unsere eigenen Truppen die Kontrolle über die Region festigen können. Wir müssten im Gegenzug jedoch unsere größeren Militäroperationen vorübergehend aussetzen und würden den Revolutionären Zeit für ihre Planung geben."
 INS_revolution_events.30.a: "Die Bedingungen klingen akzeptabel. Wir stimmen zu."
 INS_revolution_events.30.b: "Niemals. Wir holen uns [FROM.GetName] nötigenfalls mit Gewalt zurück!"
 INS_revolution_events.31.t: "[HOL.GetNameDefCap] stimmt Waffenstillstand in [FROM.GetName] zu"
 INS_revolution_events.31.desc: "Die Verhandlungen verliefen gut und [HOL.GetLeader] stimmte einem Waffenstillstand zu. Wir forderten unsere Milizanführer in [FROM.GetName] bereits dazu auf, ihre Truppen unverzüglich zurückzuziehen."
 INS_revolution_events.31.a: "Hoffentlich halten sie ihren Teil der Vereinbarung ein."
 INS_revolution_events.32.t: "[HOL.GetNameDefCap] lehnt Waffenstillstand ab"
 INS_revolution_events.32.desc: "Die Verhandlungen verliefen nicht wie erwartet. [HOL.GetLeader] weigerte sich, einen Waffenstillstand zu unterzeichnen und beendete die Verhandlungen frühzeitig, ohne einen Kompromiss zu finden."
 INS_revolution_events.32.a: "Das ist inakzeptabel!"
 INS_revolution_events.33.t: "[INS.GetNameDefCap] bittet um Vermittlung eines Friedens"
 INS_revolution_events.33.desc: "Die indonesischen Republikaner baten uns offiziell um Unterstützung bei der Aushandlung einer Einigung mit den Niederlanden. Unsere Berater vor Ort berichten, dass sich die Lage rapide verschlechtert und eine fortgesetzte niederländische Militärpräsenz dazu führen könnte, die Nationalisten in die Arme der Sowjets zu treiben. Die Niederlande sind ein geschätzter Verbündeter in Europa, doch wir dürfen die politische Realität in Südostasien nicht außer Acht lassen. Sollte Indonesien an den Kommunismus fallen, weil wir tatenlos dabei zusahen, wäre dies unser eigenes Versagen."
 INS_revolution_events.33.a: "Entsendet die Vermittler."
 INS_revolution_events.33.b: "Wir dürfen unsere Beziehungen zu den Niederlanden nicht aufs Spiel setzen."
 INS_revolution_events.34.t: "[FROM.GetNameDefCap] stimmt Vermittlung eines Friedens zu"
 INS_revolution_events.34.desc: "Washington erklärte sich bereit, zwischen unserer Regierung und den Niederlanden zu vermitteln. Amerikanische Gesandte sind bereits unterwegs, um einen offiziellen Waffenstillstand auszuhandeln. Da die weltweit führende Macht die Verhandlungen unterstützt, wird es den Niederlanden weitaus schwerer fallen, Letztere hinauszuzögern oder militärisch gegen uns vorzugehen. Wir müssen am Verhandlungstisch standhaft bleiben und die Amerikaner das tun lassen, was sie am besten können."
 INS_revolution_events.34.a: "Hoffentlich können die Niederländer zur Vernunft gebracht werden."
 INS_revolution_events.35.t: "[USA.GetNameDefCap] erklären sich zur Vermittlung bereit"
 INS_revolution_events.35.desc: "Die Amerikaner schalteten sich in die Indonesienfrage ein. Washington gibt vor, als neutraler Vermittler zu handeln, doch die Implikationen sind eindeutig: Sollten wir diesen Konflikt nicht zu ihrer Zufriedenheit lösen, werden sie ihren beträchtlichen Einfluss gegen uns einsetzen. Unsere Unterhändler müssen mit äußerster Vorsicht vorgehen. Wir können es uns nicht leisten, den guten Willen der Amerikaner zu verspielen."
 INS_revolution_events.35.a: "Wir lassen uns die Bedingungen nicht diktieren."
 INS_revolution_events.36.t: "[FROM.GetNameDefCap] lehnt Einmischung ab"
 INS_revolution_events.36.desc: "Die Amerikaner lehnten unsere Bitte auf Vermittlung eines Friedens ab. Washington beschloss, an der Seite seiner europäischen Verbündeten zu stehen, anstatt unseren Kampf um Selbstbestimmung zu unterstützen. Wir sind auf uns allein gestellt. Das ist zwar ein herber Schlag, aber die Revolution wurde sowieso nie auf dem Fundament gebaut, dass andere uns unsere Freiheit schenken würden."
 INS_revolution_events.36.a: "Wir gewinnen diesen Krieg auch ohne sie."
 INS_revolution_events.37.t: "[USA.GetNameDefCap] stellen ein Ultimatum"
 INS_revolution_events.37.desc: "Die Amerikaner verloren die Geduld und Washington stellte uns ein Ultimatum: Man forderte uns auf, mit sofortiger Wirkung alle Militäroperationen in Indonesien einzustellen und die indonesische Souveränität anzuerkennen. Die Botschaft ist eindeutig: Eine Weigerung wird Konsequenzen haben. Unser Ansehen in der internationalen Gemeinschaft würde einen öffentlichen Bruch mit den Amerikanern nicht überstehen, und unsere Wirtschaft könnte die Folgen nicht verkraften. Unsere Generäle beharren darauf, dass der Feldzug noch gewonnen werden kann, doch zu welchem Preis?"
 INS_revolution_events.37.a: "Wir haben keine andere Wahl, als uns zu fügen."
 INS_revolution_events.37.b: "Indonesien gehört uns. Wir werden nicht nachgeben."
 INS_revolution_events.38.t: "Die Niederlande geben nach"
 INS_revolution_events.38.desc: "Es ist endlich vorbei. Die niederländische Regierung kam dem amerikanischen Ultimatum nach und erkannte unsere Souveränität an. Dreihundertfünfzig Jahre Kolonialherrschaft wurden nicht auf dem Schlachtfeld, sondern am Verhandlungstisch beendet, getragen vom Gewicht der größten Weltmacht. Die Republik gehört endlich ganz und gar uns."
 INS_revolution_events.38.a: "Merdeka!"
 INS_revolution_events.39.t: "Die Niederlande lehnen ab"
 INS_revolution_events.39.desc: "Entgegen aller Erwartungen lehnten die Niederlande das amerikanische Ultimatum ab. Ihre Generäle müssen glauben, sie könnten diesen Krieg gewinnen, bevor Washington etwas unternehmen kann. Doch sie irren sich! Da die Amerikaner nun offen für unsere Sache eintreten, hat sich das Kräfteverhältnis verschoben. Sollen sie nur kommen. Wir kämpfen nicht mehr allein."
 INS_revolution_events.39.a: "Die Welt steht an unserer Seite."
 INS_revolution_events.40.t: "Die Niederlande stimmen unseren Bedingungen zu"
 INS_revolution_events.40.desc: "Den Haag kam unserem Ultimatum nach. Die niederländischen Truppen wurden aus Indonesien abgezogen und die Souveränität über die Territorien wurde an die Republik Indonesien übertragen. Dies ist ein zufriedenstellender Abschluss einer bedauerlich langen Zeit voller Blutvergießen. Unseren Interesse in der Region können durch ein stabiles, unabhängiges Indonesien weit besser aufrechterhalten werden als durch ein koloniales Unterfangen, das die Niederländer nicht länger leisten konnten."
 INS_revolution_events.40.a: "Ein zufriedenstellendes Ergebnis."
 INS_revolution_events.41.t: "Die Niederlande trotzen uns"
 INS_revolution_events.41.desc: "Den Haag lehnte unser Ultimatum entschlossen ab. Die niederländischen Truppen setzen ihre Operationen in Indonesien unter offener Missachtung amerikanischer Forderungen fort. Doch das ist eine ungeheure Fehleinschätzung ihrerseits. Die Niederlande können nicht gleichzeitig einen Kolonialkrieg in Asien führen und sich in Europa auf amerikanische Hilfe verlassen. Sie haben uns zum Handeln gezwungen."
 INS_revolution_events.41.a: "Nun gut ..."
 INS_revolution_events.42.t: "Ein letzter Würfelwurf"
 INS_revolution_events.42.desc: "Die Berichte unseres Nachrichtendiensts in Batavia beschreiben Vorbereitungspläne, wie wir sie von den Republikanern noch nie zuvor sahen. Offenbar planen sie, das Land zu destabilisieren, Java zu stürmen und unsere gesamte Kommunikationsinfrastruktur zu zerstören, was ihnen praktisch den Sieg sichern würde. Dieser Plan ist jedoch äußerst riskant und erfordert, dass sie fast alle ihre Ressourcen dafür aufbringen. Unsere Generäle gehen davon aus, dass sie diese Position nur etwa zwei Jahre lang halten und sich nicht ohne größere Verluste zurückziehen können. Sollten wir sie lang genug aufhalten, zermalmen wir ihre Regierung und ihre Revolution wie eine überreife Tomate."
 INS_revolution_events.42.a: "Und so beginnt die entscheidende Schlacht."
 INS_revolution_events.43.t: "Milizenstützpunkt in [FROM.GetName] wurde errichtet"
 INS_revolution_events.43.desc: "Unsere Bemühungen in [FROM.GetName] waren erfolgreich. Die lokalen Milizenanführer bestätigten, dass sie bereitstehen, wenn die Zeit gekommen ist."
 INS_revolution_events.43.a: "Wir müssen unsere Bemühungen ausweiten."
 # Chaos Events
 INS_chaos_events.1.t: "Die Schlacht von Surabaya"
 INS_chaos_events.1.desc: "Nach der Unabhängigkeitserklärung ist das Machtgefüge in Surabaya instabil geworden. Heute hisste eine Gruppe niederländischer Loyalisten die alte Kolonialflagge auf dem Dach des ehemaligen Hotels Yamato. Die Jugend der Pemuda-Bewegung stürmte daraufhin das Gebäude, entfernte die Flagge und hisste stattdessen die rot-weiße Flagge Indonesiens. In der Folge kam es zu gewaltsamen Auseinandersetzungen."
 INS_chaos_events.1.a: "Das ist auch genau richtig!"
 INS_chaos_events.1.b: "Ordnet eine Waffenruhe an. Wir können es uns nicht leisten, dass die Lage eskaliert."
 INS_chaos_events.2.t: "Zusammenlegung sozialistischer Parteien"
 INS_chaos_events.2.desc: "Die beiden größten sozialistischen Parteien in Indonesien gaben unter der Führung von Amir Sjarifuddin und Sutan Sjahrir heute ihren Zusammenschluss als Vereinigte Sozialistische Partei Indonesiens bekannt. Durch diesen Zusammenschluss wächst ihr politischer Einfluss erheblich und könnte eine Gefahr für unsere derzeitige Regierung darstellen."
 INS_chaos_events.2.a: "Lassen wir es zu."
 INS_chaos_events.2.b: "Jetzt ist nicht die Zeit für Politik. Verhängt den Ausnahmezustand!"
 INS_chaos_events.3.t: "Gescheiterter Mordanschlag auf Sukarno"
 INS_chaos_events.3.desc: "Heute schoss ein niederländischer Soldat auf Sukarnos Auto. Glücklicherweise befand sich Sukarno nicht im Fahrzeug, doch sein Chauffeur wurde schwer verletzt. Auch wenn dieses Attentat erfolglos blieb, ist klar, dass es nicht das letzte sein wird, sei es durch niederländische Soldaten oder die indonesische Opposition."
 INS_chaos_events.3.a: "Wir müssen die Ordnung wiederherstellen!"
 INS_chaos_events.4.t: "Attentat auf Sukarno"
 INS_chaos_events.4.desc: "Heute ist ein tragischer Tag für Indonesien. Sukarno wurde erneut Opfer eines Attentats - diesmal eines erfolgreichen. Wir dürfen nicht zulassen, dass daraus eine Nachfolgekrise entsteht. Die Ordnung muss schnellstens wiederhergestellt werden, bevor die Republik vollkommen zusammenbricht."
 INS_chaos_events.4.a: "Vizepräsident Hatta wird übernehmen."
 INS_chaos_events.4.b: "Die sozialistische Partei wird übernehmen."
 INS_chaos_events.4.c: "Geben wir die Republik auf. Tan Malaka wird uns zum Sieg führen!"
 # Loyalist Events
 INS_loyalist_events.1.t: "[INS.GetLeader] bittet um Überstellung von Henri Winkelman"
 INS_loyalist_events.1.desc: "[INS.GetLeader] wandte sich wegen der anhaltenden weltweiten Konflikte und der gefährlichen Lage, in der sich [INS.GetNameDef] befindet, an uns. [INS.GetLeader] schlug vor, Henri Winkelman, den ehemaligen Befehlshaber der Königlich Niederländischen Armee, offiziell nach [INS.GetName] zurückzubeordern, um die Sicherheit der Kolonie zu gewährleisten."
 INS_loyalist_events.1.a: "Wir müssen seine sofortige Verlegung veranlassen."
 INS_loyalist_events.1.b: "Henri Winkelman wird in der Heimat benötigt."
 INS_loyalist_events.2.t: "[HOL.GetLeader] stimmt Verlegung von Henri Winkelman zu"
 INS_loyalist_events.2.desc: "[INS.GetLeader] kehrte mit guten Neuigkeiten von dem Treffen mit [HOL.GetLeader] aus [HOL.GetName] zurück. [HOL.GetLeader] erkennt den Ernst der Lage und stimmte der Verlegung von Henri Winkelman zu. Henri Winkelman ist bereits auf dem Weg nach [1058.GetName], wo er auf weitere Befehle von uns warten wird."
 INS_loyalist_events.2.a: "Das wird sehr hilfreich sein."
 INS_loyalist_events.3.t: "[HOL.GetLeader] verweigert Verlegung von Henri Winkelman"
 INS_loyalist_events.3.desc: "[INS.GetLeader] kehrte mit schlechten Neuigkeiten von dem Treffen mit [HOL.GetLeader] aus [HOL.GetName] zurück. Bedauerlicherweise ist man nicht gewillt, Henri Winkelman nach Niederländisch-Indien zu verlegen. Wir werden unsere Verteidigung ohne ihn planen müssen."
 INS_loyalist_events.3.a: "Wir müssen schleunigst einen anderen Plan ausarbeiten."
 INS_henri_winkelman_tt: "Verlegung von Henri Winkelman abgelehnt"
 # MALAYA CHAIN - Independent Malaya
 INS_loyalist_events.4.t: "[FROM.GetNameDefCap] schlägt eine Vereinigung vor"
 INS_loyalist_events.4.desc: "Eine [FROM.GetAdjective]e Delegation kam heute in [ROOT.Capital.GetCapitalVictoryPointName] an und schlägt eine Vereinigung. Sie verweist auf unser gemeinsames malaiisches Erbe und dass die Grenzen zwischen unseren Nationen von europäischen Kolonialverwaltern gezogen wurden und nicht von den Völkern, die diese Territorien bewohnen. Der Vorschlag sieht vor, dass beide Regierungen aufgelöst und zu einem einzigen Staat reformiert werden."
 INS_loyalist_events.4.a: "Wir stimmen zu."
 INS_loyalist_events.4.b: "Wir müssen ablehnen."
 INS_loyalist_events.5.t: "[FROM.GetNameDefCap] akzeptiert die Vereinigung"
 INS_loyalist_events.5.desc: "Unsere Diplomaten kehrten mit hervorragenden Neuigkeiten aus [FROM.Capital.GetCapitalVictoryPointName] zurück. Die [FROM.GetAdjective]e Regierung stimmte unserem Vorschlag zu, und ihre Beamten unternahmen bereits die nötigen Vorbereitungen für die Integration ihrer Territorien in unsere Verwaltung."
 INS_loyalist_events.5.a: "Gemeinsam sind wir stärker!"
 INS_loyalist_events.6.t: "[FROM.GetNameDefCap] lehnt Vereinigung ab"
 INS_loyalist_events.6.desc: "Unsere Diplomaten kehrten mit leeren Händen aus [FROM.Capital.GetCapitalVictoryPointName] zurück. Die [FROM.GetAdjective]e Regierung war nicht bereit, den Vorschlag auch nur ansatzweise in Betracht zu ziehen. Sie gab nur spärliche Gründe dafür an, und unsere Delegation wurde mit kaum mehr als belanglosen Formalitäten heimgeschickt."
 INS_loyalist_events.6.a: "Sie schaden sich damit nur selbst!"
 # MALAYA CHAIN - Subject Malaya (Overlord receives)
 INS_loyalist_events.7.t: "[FROM.GetNameDefCap] fordert Referendum in [MAL.GetName]"
 INS_loyalist_events.7.desc: "[FROM.GetNameDefCap] forderte auf offiziellem Wege, dass wir es [MAL.GetName] erlauben, ein Referendum über eine mögliche Vereinigung mit ihrem Staat abzuhalten. Ihr Botschafter sprach offen über den wahrscheinlichen Ausgang und erklärte, die malaysische Bevölkerung auf beiden Seiten der Grenze betrachte sich als eine Nation. Eine Abstimmung zuzulassen, würde mit hoher Wahrscheinlichkeit bedeuten, [MAL.GetName] zu verlieren."
 INS_loyalist_events.7.a: "Das Volk soll entscheiden."
 INS_loyalist_events.7.b: "Das lassen wir nicht zu."
 # MALAYA CHAIN - Subject Malaya (MAL receives after overlord agrees)
 INS_loyalist_events.8.t: "[FROM.GetNameDefCap] stimmt Vereinigungsreferendum zu"
 INS_loyalist_events.8.desc: "Unser Suzerän erlaubte es [FROM.FROM.GetName], ein Referendum in unserem Land abzuhalten. [FROM.FROM.GetAdjective]e Wahlkampfhelfer sind bereits in großer Zahl eingetroffen und die Abstimmung soll innerhalb des kommenden Monats beginnen. Die Frage, die unserem Volk gestellt wird, lautet schlicht: Ist [FROM.FROM.GetNameDef] eine Nation, der wir uns anschließen wollen, oder soll alles bleiben, wie es ist?"
 INS_loyalist_events.8.a: "Wir schließen uns ihr an."
 INS_loyalist_events.8.b: "Alles soll besser so bleiben, wie es ist."
 # MALAYA CHAIN - Overlord informed of MAL's choice
 INS_loyalist_events.9.t: "[FROM.GetNameDefCap] stimmt gegen Vereinigung"
 INS_loyalist_events.9.desc: "Das Referendum von [FROM.GetName] kam zu einem Ergebnis. Das [FROM.GetAdjective]e Volk stimmte dafür, unter unserer Verwaltung zu bleiben. Die [FROM.FROM.GetAdjective]en Wahlkampfhelfer sind bereits abgereist."
 INS_loyalist_events.9.a: "Wie erwartet."
 INS_loyalist_events.10.t: "[FROM.GetNameDefCap] stimmt für Vereinigung"
 INS_loyalist_events.10.desc: "Bei dem Referendum in [FROM.GetName] stimmte eine klare Mehrheit zugunsten einer Vereinigung mit [FROM.FROM.GetName]. Unsere Wahlkampfhelfer in der Region berichten, dieses Ergebnis entspreche den Prognosen. Wir müssen es respektieren."
 INS_loyalist_events.10.a: "Wir haben unser Wort gegeben."
 # MALAYA CHAIN - INS receives result
 INS_loyalist_events.11.t: "Malaiisches Referendum erfolgreich"
 INS_loyalist_events.11.desc: "Das [MAL.GetAdjective]e Volk stimmte für eine Vereinigung mit unserer Nation. Die [MAL.GetAdjective]e Verwaltung arbeitet mit unserer zusammen, um die Machtübergabe vorzubereiten. Mit dieser Vereinigung wird es eine Grenze weniger auf der Karte der malaiischen Welt geben."
 INS_loyalist_events.11.a: "Willkommen daheim."
 INS_loyalist_events.12.t: "Malaiische Vereinigung abgelehnt"
 INS_loyalist_events.12.desc: "Unser Vorschlag für eine Vereinigung mit [MAL.GetName] wurde abgelehnt. Die [MAL.GetAdjective]e Regierung oder eine übergeordnete Instanz sprach sich dagegen aus. Wir werden uns zu einem günstigeren Zeitpunkt erneut mit dieser Angelegenheit befassen müssen."
 INS_loyalist_events.12.a: "Das werden wir nicht vergessen."
 INS_loyalist_events.13.t: "[FROM.GetNameDefCap] schlägt Kompromiss für Singapur vor"
 INS_loyalist_events.13.desc: "Die [FROM.GetAdjective]e Regierung unterbreitete uns einen Vorschlag bezüglich Singapur. Sie fordert die Souveränität über die Insel und begründet dies mit deren Stellung innerhalb der malaiischen Welt. Im Gegenzug ist sie bereit, uns weiterhin Zugang zum Hafen, zu den militärischen Einrichtungen sowie alle derzeit geltenden Rechte zur Rohstoffgewinnung zu garantieren."
 INS_loyalist_events.13.a: "Eine faire Regelung."
 INS_loyalist_events.13.b: "Singapur steht nicht zum Verkauf!"
 INS_loyalist_events.14.t: "Singapurkompromiss akzeptiert"
 INS_loyalist_events.14.desc: "Der Vertrag wurde unterzeichnet. Singapur wurde unter unsere Kontrolle gestellt, während die bisherigen Besitzer ihren kommerziellen und militärischen Zugang zum Hafen behalten. Unsere Flagge weht nun über einem der wichtigsten Häfen Asiens."
 INS_loyalist_events.14.a: "Die Meerenge wird jetzt von uns kontrolliert!"
 INS_loyalist_events.15.t: "Singapurkompromiss abgelehnt"
 INS_loyalist_events.15.desc: "Unser Vorschlag wurde abgelehnt. Die Machthaber in Singapur sind unter keinen Umständen bereit, die Insel abzutreten. Wir boten ihnen alles außer ihrer Souveränität an, doch offenbar reichte das nicht aus."
 INS_loyalist_events.15.a: "Nun gut ..."
 INS_loyalist_events.16.t: "[FROM.GetNameDefCap] bittet um Übergabe von Ceylon"
 INS_loyalist_events.16.desc: "Die [FROM.GetAdjective]e Regierung bat formell um die Übergabe von Ceylon. Ihre Diplomaten verweisen dabei auf die langjährigen Handelsverbindungen und die ethnische Ähnlichkeit zwischen der Insel und der malaiischen Welt. Diese Behauptungen sind zwar recht weit hergeholt, doch [FROM.GetNameDef] ist mittlerweile so mächtig geworden, dass solche Forderungen ernsthaft abzuwägen sind."
 INS_loyalist_events.16.a: "In Ordnung. Sie sollen Ceylon haben."
 INS_loyalist_events.16.b: "Ceylon wird unter unserer Kontrolle bleiben."
 INS_loyalist_events.17.t: "Ceylon übergeben"
 INS_loyalist_events.17.desc: "Die Übergabe von Ceylon ist abgeschlossen. Unsere Verwaltung hat begonnen, die Insel in ihre Strukturen zu integrieren, und die Übergabe verläuft bislang reibungslos. Wir sind nun auf beiden Seiten der Meerenge präsent."
 INS_loyalist_events.17.a: "Ausgezeichnet."
 INS_loyalist_events.18.t: "Übergabe von Ceylon abgelehnt"
 INS_loyalist_events.18.desc: "Unsere Forderung, Ceylon zu übergeben, stieß auf taube Ohren. Die derzeitigen Machthaber hegen offenbar nicht die Absicht, die Insel aufzugeben, und unsere Diplomaten berichten, weitere Gespräche zu diesem Thema wären zwecklos."
 INS_loyalist_events.18.a: "Vielleicht ein anderes Mal ..."
 INS_loyalist_events.19.t: "[FROM.GetNameDefCap] fordert Referendum in Papua"
 INS_loyalist_events.19.desc: "[FROM.GetNameDefCap] forderte, dass wir ein Referendum in Ostpapua genehmigen. Auf der [FROM.GetAdjective]en Seite der Grenze gibt es neue Straßen, die durch den Dschungel führen, Kliniken mit staatlichen Ärzten und Schulen, an denen in den lokalen Sprachen unterrichtet wird. Auf unserer Seite hat der letzte Gouverneur Port Moresby in drei Jahren zweimal besucht. Mehr musste der [FROM.GetAdjective]e Botschafter dazu nicht sagen."
 INS_loyalist_events.19.a: "Erlaubt es ihnen, Wahlen abzuhalten."
 INS_loyalist_events.19.b: "Wir werden das nicht zulassen."
 INS_loyalist_events.20.t: "Referendum in Papua genehmigt"
 INS_loyalist_events.20.desc: "Die Australier stimmten der Durchführung des Referendums zu, und jeder Bezirk in Ostpapua kam zum selben Ergebnis: Unsere Investitionen in die westliche Hälfte der Insel sprachen eine deutlichere Sprache, als jedes Wahlplakat dies hätte tun können."
 INS_loyalist_events.20.a: "Die Insel ist endlich wieder vereint."
 INS_loyalist_events.21.t: "Referendum in Papua abgelehnt"
 INS_loyalist_events.21.desc: "Die Australier lehnten ein Referendum ab. Ihr Gouverneur in Port Moresby erklärte, diese Forderung stelle einen Affront gegen die australische Souveränität dar. Das papuanische Volk selbst wurde nicht konsultiert."
 INS_loyalist_events.21.a: "Wir werden das nicht vergessen ..."
 INS_loyalist_events.22.t: "[FROM.GetNameDefCap] fordert Osttimor"
 INS_loyalist_events.22.desc: "Die [FROM.GetAdjective]e Regierung stellte einen formellen Antrag zur Übergabe von Osttimor. Ihr Botschafter wies darauf hin, dass unsere Garnison dort weniger als zweihundert Mann zählt und dass Lissabon seit Jahren so gut wie nichts mehr investierte. Abschließend stellte er die Frage, woran wir uns da eigentlich festhalten wollen."
 INS_loyalist_events.22.a: "Das ist es nicht wert, dafür in den Krieg zu ziehen ..."
 INS_loyalist_events.22.b: "Timor gehört uns, und das wird auch so bleiben."
 INS_loyalist_events.23.t: "Osttimor aufgegeben"
 INS_loyalist_events.23.desc: "Die ehemaligen Machthaber von Osttimor haben begonnen, ihre Garnison abzuziehen und die Kolonialverwaltung aufzulösen. Die gesamte Insel wird schon bald unter [INS.GetAdjective]er Kontrolle stehen."
 INS_loyalist_events.23.a: "Wie es sich gehört."
 INS_loyalist_events.24.t: "Forderung für Osttimor abgelehnt"
 INS_loyalist_events.24.desc: "Der Kolonialgouverneur in Dili wies unsere Forderung in einem persönlichen Schreiben zurück und bestand darauf, dass Osttimor weiterhin Hoheitsgebiet seiner Regierung bleibt. Unser Generalstab arbeitete bereits einen Notfallplan aus, falls das Kabinett die Angelegenheit weiterverfolgen möchte."
 INS_loyalist_events.24.a: "Beginnt mit den Vorbereitungen."
 INS_loyalist_events.25.t: "[FROM.GetNameDefCap] schlägt eine Vereinigung vor"
 INS_loyalist_events.25.desc: "Eine [FROM.GetAdjective]e Delegation traf heute ein, um die Vereinigung unserer beiden Republiken vorzuschlagen. Man argumentiert, unsere Völker hätten gemeinsame austronesische Wurzeln, die weit älter sind als die kolonialen Grenzen, die uns trennen, und dass ein einziger Staat, der sich über den gesamten Archipel erstreckt, zur führenden Macht in Südostasien aufsteigen könnte. Der Vereinigung zuzustimmen, würde bedeuten, unsere derzeitige Regierung aufzulösen und in die ihre zu integrieren."
 INS_loyalist_events.25.a: "Wir willigen ein."
 INS_loyalist_events.25.b: "Wir haben zu hart für diese Republik kämpfen müssen."
 INS_loyalist_events.26.t: "[FROM.GetNameDefCap] akzeptiert die Vereinigung"
 INS_loyalist_events.26.desc: "Die [FROM.GetAdjective]e Regierung nahm unseren Vorschlag an. Ihre Verwaltung stimmt sich bereits mit unserer ab, um den Integrationsprozess in die Wege zu leiten. Unsere neue Nation erstreckt sich nun von Aceh bis Luzon und von Borneo bis Mindanao und nimmt die gesamte Breite des malaiischen Archipels ein."
 INS_loyalist_events.26.a: "Eine neue Ära ist angebrochen!"
 INS_loyalist_events.27.t: "[FROM.GetNameDefCap] lehnt Vereinigung ab"
 INS_loyalist_events.27.desc: "Die [FROM.GetAdjective]e Regierung lehnte eine Vereinigung ab. Ihr Unabhängigkeitskampf ist noch zu frisch und war zu kostspielig, als dass sie ihre Souveränität an einen anderen Staat abtreten würde. Der Vorschlag wurde vorerst auf Eis gelegt."
 INS_loyalist_events.27.a: "Ein Jammer."
 INS_loyalist_events.28.t: "[FROM.GetNameDefCap] fordert Referendum in [PHI.GetName]"
 INS_loyalist_events.28.desc: "[FROM.GetNameDefCap] bat offiziell darum, dass wir in [PHI.GetName] ein Referendum zur Frage der Wiedervereinigung zulassen. Ihre Diplomaten betonen die gemeinsamen austronesischen Wurzeln der beiden Völker und die Grenzen, die die Kolonialmächte künstlich schufen. Sollte die Abstimmung stattfinden, dürfte das Ergebnis eines werden, das [FROM.GetNameDef] gefällt."
 INS_loyalist_events.28.a: "Das Volk sollte in dieser Entscheidung mitreden dürfen."
 INS_loyalist_events.28.b: "Kommt nicht in Frage."
 INS_loyalist_events.29.t: "Vereinigungsreferendum zugestimmt"
 INS_loyalist_events.29.desc: "[FROM.FROM.GetNameDefCap] schlug eine Vereinigung unserer beiden Nationen auf der Grundlage unseres gemeinsamen austronesischen Erbes vor. Unser Suzerän erlaubte ein Referendum, und die [FROM.FROM.GetAdjective]en Wahlhelfer sind bereits eingetroffen. Das Ergebnis wird darüber entscheiden, ob sich unsere Republik [FROM.FROM.GetName] anschließt oder unter den derzeitigen Bedingungen weiterbesteht."
 INS_loyalist_events.29.a: "Ein interessanter Vorschlag."
 INS_loyalist_events.29.b: "Kommt gar nicht infrage."
 INS_loyalist_events.30.t: "[FROM.GetNameDefCap] stimmt gegen Vereinigung"
 INS_loyalist_events.30.desc: "Die Stimmen sind ausgezählt und die [FROM.FROM.GetAdjective]en Wahlhelfer wieder in ihre Heimat zurückgekehrt. Das [FROM.GetAdjective]e Volk stimmte für den Verbleib. Unabhängigkeit scheint für [FROM.Capital.GetCapitalVictoryPointName] noch immer eine wichtige Rolle zu spielen."
 INS_loyalist_events.30.a: "Das war's dann."
 INS_loyalist_events.31.t: "[FROM.GetNameDefCap] stimmt für Vereinigung"
 INS_loyalist_events.31.desc: "Die Stimmen sind ausgezählt. Das [FROM.GetAdjective]e Volk stimmte mit eindeutiger Mehrheit für [FROM.FROM.GetName] und damit gegen uns. Unsere Verwaltung wurde bereits damit beauftragt, die Übergabe vorzubereiten."
 INS_loyalist_events.31.a: "Das Volk hat gesprochen"
 INS_loyalist_events.32.t: "[PHI.GetNameDefCap] stimmt für Vereinigung"
 INS_loyalist_events.32.desc: "Das [PHI.GetAdjective]e Referendum ging zu unseren Gunsten aus. Die derzeitige Regierung akzeptierte das Ergebnis und nahm bereits Kontakt zu unserem Außenministerium auf, um die Machtübergabe zu koordinieren."
 INS_loyalist_events.32.a: "Wir sind endlich wieder vereint!"
 INS_loyalist_events.33.t: "[PHI.GetNameDefCap] stimmt gegen Vereinigung"
 INS_loyalist_events.33.desc: "Die [PHI.GetAdjective]e Regierung lehnte unseren Vorschlag für eine Vereinigung ab. Das Parlament wies den Vorschlag zurück, ohne ihn auch nur richtig durchgelesen zu haben. Wir boten ihnen einen Platz in der größten Nation Südostasiens an, und sie haben darauf gespuckt."
 INS_loyalist_events.33.a: "Ein kleiner Rückschlag, weiter nichts."
 INS_communist_events.6.t: "[FROM.GetAdjective]e Spione stiften Unruhe in [ROOT.GetName]"
 INS_communist_events.6.desc: "Unser Geheimdienst bestätigte, was wir schon lange vermutet hatten: [FROM.GetAdjective]e Spione agieren innerhalb unserer Grenzen, untergraben unsere Führung, finanzieren radikale Zellen, verbreiten aufrührerische Flugblätter und organisieren Streiks unter den Arbeitern. Agenten unterwandern die Gewerkschaften und Genossenschaften und rufen die Bevölkerung offen dazu auf, unsere Regierung zu stürzen. Die Lage hat einen kritischen Punkt erreicht. Wir müssen entschlossen handeln, bevor sie vollkommen außer Kontrolle gerät."
 INS_communist_events.6.a: "Wir müssen etwas unternehmen!"
 INS_communist_events.7.t: "[FROM.GetNameDefCap] von Kommunisten unterwandert"
 INS_communist_events.7.desc: "Uns erreichten beunruhigende Berichte aus [FROM.FROM.GetName]: Offenbar schüren [FROM.GetAdjective]e Spione eine revolutionäre Stimmungen in der lokalen Bevölkerung und nutzen die Unzufriedenheit mit unserer Verwaltung aus, um Unterstützung für eine kommunistische Machtübernahme zu gewinnen. Sollten wir nicht schleunigst etwas unternehmen, könnten wir [FROM.FROM.GetName] vollständig an die Radikalen verlieren, und diese Fäulnis könnte sich durchaus auch auf unsere anderen Besitztümer ausweiten."
 INS_communist_events.7.a: "Wir müssen dem ein Ende setzen, bevor es sich weiter ausbreitet!"
 INS_communist_events.8.t: "[FROM.GetAdjective]e Propaganda in [ROOT.GetName]"
 INS_communist_events.8.desc: "In unseren Fabriken, auf unseren Märkten und an unseren Universitäten tauchen immer häufiger Flugblätter und aufwieglerische Broschüren [FROM.GetAdjective]er Herkunft auf. Sie predigen den Klassenkampf und versprechen, nur eine Revolution könne alle befreien. Unsere Polizei berichtet, dass diese Aussagen unter den Unzufriedenen auf offene Ohren stoßen. Das Material ist schlicht gehalten, aber wirkungsvoll, und es scheint sich immer schneller unter der Bevölkerung auszubreiten."
 INS_communist_events.8.a: "Findet heraus, wer diesen Schmutz verbreitet!"
 ## Call for Revolution - Main Event (sent to target) ##
 INS_communist_events.1.t: "Revolution in [ROOT.GetName]"
 INS_communist_events.1.desc: "Die Lage hat sich derart zugespitzt, dass es kein Zurück mehr gibt. Die monatelange [FROM.GetAdjective]e Propaganda nahm die Bevölkerung für sich ein, und die kommunistische Bewegung in [ROOT.GetName] lässt sich nicht mehr länger mit herkömmlichen Mitteln eindämmen. Generalstreiks legen die Städte lahm, bewaffnete Partisanen kontrollieren ganze Provinzen, und die [FROM.GetAdjective]e Regierung unterstützt die Revolutionäre. Unsere Schutztruppen sind zahlenmäßig unterlegen und ihre Treue ist nicht länger gesichert. Wir müssen jetzt entscheiden, ob wir für das Überleben des Staates kämpfen oder das Unvermeidliche akzeptieren, ehe noch mehr Blut vergossen wird."
 INS_communist_events.1.a: "Versammelt die Armee. Wir geben uns nicht kampflos geschlagen."
 INS_communist_events.1.b: "Jeder weitere Widerstand wird unser Volk nur noch weiter von uns abwenden."
 INS_communist_events.1.c: "Vielleicht sollten wir ihnen einen Platz am Tisch anbieten, um die Lage unter Kontrolle zu bringen."
 ## Civil War Chosen - sent to Indonesia ##
 INS_communist_events.2.t: "[FROM.GetNameDefCap] entscheidet sich für einen Kampf"
 INS_communist_events.2.desc: "Die [FROM.GetAdjective]e Regierung weigert sich, nachzugeben, und wies ihre Truppen an, die Revolution gewaltsam niederzuschlagen. Unsere Genossen bezogen bereits Stellung und erobern wichtige Stützpunkte. Es wird ein langer Kampf sein, doch das [FROM.GetAdjective]e Volk hat seine Entscheidung getroffen, und wir werden dafür sorgen, dass es nicht allein dasteht."
 INS_communist_events.2.a: "Die Revolution marschiert weiter."
 ## Surrender - sent to Indonesia ##
 INS_communist_events.3.t: "[FROM.GetNameDefCap] ist gefallen"
 INS_communist_events.3.desc: "Die ehemalige Regierung in [FROM.GetName] hat kapituliert. Aufgrund des schieren Ausmaßes der revolutionären Bewegung und der Tatsache, dass [ROOT.GetNameDef] diese unterstützt, sah sie sich gezwungen, nachzugeben. Die kommunistische Partei übernahm die Macht, und die neue Regierung wandte sich bereits an uns und bat um Unterstützung. Eine weitere Nation wurde aus dem Würgegriff der alten Ordnung befreit."
 INS_communist_events.3.a: "Ein großer Sieg für das arbeitende Volk."
 ## Civil War in Subject - sent to overlord ##
 INS_communist_events.4.t: "Bürgerkrieg in [FROM.GetName]"
 INS_communist_events.4.desc: "Kommunistische Revolutionäre erhoben sich dank der Unterstützung von [FROM.FROM.GetName] in [FROM.GetName]. Die Kolonialverwaltung verlor die Kontrolle über weite Teile des Landes, und der Gouverneur berichtet, die örtliche Garnison könne die Ordnung ohne Verstärkung nicht wiederherstellen."
 INS_communist_events.4.a: "Schickt Truppen. [FROM.GetNameDefCap] gehört uns!"
 ## Subject Surrendered - sent to overlord ##
 INS_communist_events.5.t: "[FROM.GetNameDefCap] geht an die Kommunisten"
 INS_communist_events.5.desc: "Die Verwaltung in [FROM.GetName] ergab sich den Kommunisten kampflos. Unser Kolonialgouverneur wurde verhaftet und unsere Flagge eingeholt. Anstelle unserer Kolonialverwaltung rief man eine Revolutionsregierung aus. All dies wurde von [FROM.FROM.GetName] inszeniert, die seit Monaten daran arbeiten, unsere Autorität zu untergraben. Man kann also sagen, dass es Diebstahl war, und wir werden dies nicht einfach so hinnehmen."
 INS_communist_events.5.a: "Das ist ja unerhört!"
 # Cooperate with Revolutionaries (sent to target)
 INS_communist_events.9.t: "[FROM.GetAdjective]e Offiziere wurden bei einem Treffen mit Abtrünnigen beobachtet"
 INS_communist_events.9.desc: "[FROM.GetAdjective]e Agenten wurden im ganzen Land in Gesellschaft bekannter Aufwiegler und radikaler Anführer gesichtet. Studentenorganisatoren, die einst an Straßenecken Flugblätter verteilten, halten nun hinter verschlossenen Türen Treffen mit Männern ab, die [FROM.GetAdjective]e Diplomatenpapiere bei sich tragen. Verbotene Publikationen werden schneller gedruckt, als die Polizei sie beschlagnahmen kann, und Proteste, die einst an einem Nachmittag im Sande verliefen, legen nun ganze Stadtteile tagelang lahm. Die Kommunisten organisieren sich von Tag zu Tag in größeren Gruppen, und wenn wir nicht rasch handeln, könnten wir die Kontrolle verlieren."
 INS_communist_events.9.a: "Wir müssen ihre Spione unverzüglich ausfindig machen!"
 # Spread Anti-Colonialist Sentiment (sent to subject target)
 INS_communist_events.10.t: "[FROM.GetAdjective]e Rhetorik findet zunehmend Anklang"
 INS_communist_events.10.desc: "[FROM.GetAdjective]e Flugblätter zirkulieren in den Kasernen und im öffentlichen Dienst, und die Beschlagnahmungsmaßnahmen tragen wenig dazu bei, diese Flut einzudämmen. In den Pamphleten ist die Rede von befreiten Nationen: von Völkern, die sich ihrer Kolonialherren entledigten und etwas Eigenes aufbauten. Wäre da nicht etwas Wahres dran, wäre es leichter, diese Propaganda zu unterdrücken. Selbst die treuesten Verwalter beginnen, sich zu fragen, ob unsere derzeitige Ordnung unserem Volk dient oder lediglich unseren Herren."
 INS_communist_events.10.a: "Wir müssen vorsichtig vorgehen."
