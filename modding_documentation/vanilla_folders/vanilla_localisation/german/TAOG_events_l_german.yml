 ### INS News
 taog_news.1.t: "Die Anfänge der Niederländisch-Indonesischen Union"
 taog_news.1.desc: "Königin Wilhelmina gab gestern in [1058.GetName] unerwarteterweise die Gründung eines niederländisch-indonesischen Unionsstaates bekannt. Angesichts der Besetzung ihres Heimatlandes einigten sich die [HOL.GetAdjective]e Exilregierung und die [INS.GetAdjective]e Verwaltung darauf, als eine Einheit unter der Krone zu regieren. Beamte beider Länder bezeichnen diesen Schritt als notwendige Maßnahme und nicht als freie Entscheidung. Es ist ein verzweifelter Versuch, die Einheit und Autorität des Königreichs auf zwei Kontinenten zu bewahren."
 taog_news.1.a: "Eine spannende Entwicklung."
 taog_news.2.t: "Indonesische Unabhängigkeitserklärung"
 taog_news.2.desc: "Der [INS.GetAdjective]e Revolutionär [INS.GetLeader] erklärte heute in einer öffentlichen Rede die Unabhängigkeit der neuen Republik Indonesien. [HOL.GetNameDefCap] machte zwar klar, die Souveränität dieser neuen Republik nicht zu akzeptieren, doch die republikanische Miliz hat die Kontrolle über das Territorium bereits gefestigt."
 taog_news.2.a: "Dies könnte zu einer großen Veränderung auf der Welt führen."
 ############
 ### SIAM ###
 ############
 siam.1.t: "[SIA_phraya_phahon.GetName] in Skandal verwickelt"
 siam.1.desc: "[SIA_phraya_phahon.GetName] wurde beschuldigt, Besitz der Krone an Beamte zu Preisen weit unterhalb des Marktwerts verkauft zu haben. Dieser Skandal schwächte [SIA_phraya_phahon.GetHerHis]e Legitimität in der Volksversammlung erheblich und schadete [SIA_phraya_phahon.GetHerHis]em Einfluss insgesamt."
 siam.1.a: "Vielleicht macht dies den Weg für jemand anderen frei?"
 #Spmgsiradet rebellion historical
 siam.2.t: "Dritter Mordanschlag auf [SIA_plaek_phibunsongkhram.GetName]"
 siam.2.desc: "Ein Reuters-Korrespondent in Bangkok enthüllte, dass es innerhalb von vier Jahren einen dritten Mordversuch auf den Premierminister von Siam Phibul Songgram gab, diesmal durch Gift.\n\nDem Bericht zufolge wurde das Gift während der letzen Woche in Mahlzeiten gemischt, wodurch Herr Songgram, seine Frau und seine Tochter vorübergehend ins Krankenhaus mussten.\n\nDer britische Außenminister Lord Halifax drückte in einer Botschaft an Herrn Songgram seine Besorgnis über einen solch feigen Anschlag auf das Leben des Premierministers sowie seine Freude über dessen Genesung aus." #https://trove.nla.gov.au/newspaper/article/47990695
 siam.2.a: "Wer würde so etwas nur tun?"
 siam.3.t: "Phraya Songsuradet ins Exil verbannt"
 siam.3.desc: "Phraya Songsuradet wurde beschuldigt, der Drahtzieher hinter einem oder mehreren Attentaten auf [SIA_plaek_phibunsongkhram.GetName] zu sein und einen Staatsstreich gegen die Regierung geplant zu haben. Es ist der Wille der Regierung, dass Songsuradet seines Kommandos enthoben wird, all seine Ränge und Titel aberkannt werden und er ohne Pension aus dem Militärdienst entlassen und des Landes verwiesen wird.\n\nKritiker behaupten, es handle sich hierbei um ein kaum verschleiertes Manöver von [SIA_plaek_phibunsongkhram.GetName], seinen erbittertsten Rivalen loszuwerden, doch das ist ganz klar Verleumdung."
 siam.3.a: "Welch trauriges Ende."
 siam.4.t: "Sympathisanten von Songsuradet verhaftet"
 siam.4.desc: "In den frühen Morgenstunden nahm die Regierung mit Hilfe der thailändischen Polizei 51 Verdächtige und Sympathisanten von Songsuradet fest, darunter Prinz Rangsit, Phraya Thepahatsadin und Phraya Udom Pongphensawad. Ihnen wird vorgeworfen, sich mit Phraya Songsuradet gegen den Staat verschworen zu haben. Rangsit, ein Mitglied der Königsfamilie, soll sogar vor Gericht gestellt werden. Manche Kritiker behaupten, der Prinz sei gezielt ins Visier genommen worden, um dem in [THIS.GetName] verbliebenen Adel eine klare Botschaft zu senden: Bleibt auf Linie oder geht unter."
 siam.4.a: "Die Lage spitzt sich zu."
 siam.5.t: "Rebellion der 18 Leichen"
 siam.5.desc: "In Phibul wurde ein Sondergericht einberufen, um jene 51 Personen zu verurteilen, die an der Rebellion beteiligt waren. 25 von ihnen wurden zu lebenslanger Haft und 21 zum Tod durch Erschießen verurteilt. Von den 21 sollen drei jedoch aufgrund ihrer ehrenhaften Vergangenheit begnadigt werden, unter anderem Prinz Rangsit und Phraya Thepahatsadin."
 siam.5.a: "Damit wäre diese Sache geklärt."
 #Songsuradet rebellion alternative
 siam.6.t: "Pattsituation in der Songsuradet-Rebellion"
 siam.6.desc: "Phraya Songsuradet wurde beschuldigt, der Drahtzieher hinter einem oder mehreren Attentaten auf [SIA_plaek_phibunsongkhram.GetName] zu sein und einen Staatsstreich gegen die Regierung geplant zu haben. Es ist der Wille der Regierung, dass Songsuradet seines Kommandos enthoben und ins Exil verbannt wird.\n\nSeine Verhaftung wurde jedoch von Militärangehörigen verhindert, die Songsuradet treu ergeben sind und die Verhaftung als politisch motiviert verurteilten. Die Regierung und Songsuradets Anhängerschaft befinden sich nun in einer Pattsituation, da keine der beiden Seiten nachgibt."
 siam.6.a: "Wir werden nicht nachgeben."
 siam.6.b: "Das ist nach hinten losgegangen. Wir sollten nachgeben."
 siam.7.t: "Songsuradet sucht Unterstützung innerhalb der Marine"
 siam.7.desc: "Während die angespannte Pattsituation zwischen den Regierungstruppen und der Anhängerschaft von Songsuradet weiter anhält, haben Ermittler der Regierung Gerüchte aufgeschnappt, wonach sich die Königliche Marine mit Songsuradet zusammengeschlossen hat, um Phibuns zunehmendem Autoritarismus entgegenzuwirken.\n\nAls sei das nicht schlimm genug, berichten einige Mitarbeiter des Königshauses, dass sich Songsuradets Vertraute mit hochrangigen Prinzen getroffen haben, was die Befürchtung verstärkt, dass sich auch die Königsfamilie der Opposition anschließen könnte."
 siam.7.a: "Wir sind die Regierung. Wir lassen uns nicht erpressen!"
 siam.7.b: "Das gerät außer Kontrolle. Wir sollten nachgeben."
 #alt-hist actual rebellion
 siam.8.t: "Die Songsuradet-Rebellion"
 siam.8.desc: "Nachdem sie sich sowohl politisch als auch militärisch genügend Unterstützung gesichert hatte, brachte die Songsuradet-Fraktion in Zusammenarbeit mit der Marine große Teile von [THIS.GetName] unter ihre Kontrolle. In den frühen Morgenstunden kam es in den Vororten von Bangkok zu Schusswechseln. Das Land scheint auf einen Bürgerkrieg zwischen der Regierung und Songsuradet zuzusteuern."
 siam.8.a: "Die Regierung muss überleben."
 #alt-hist actual rebellion
 siam.9.t: "Das Ende der Songsuradet-Rebellion"
 siam.9.desc: "Die Rebellen wurden zerschlagen und Songsuradet gefangen genommen. Alles, was bleibt, ist, ihnen den Prozess zu machen, was jedoch eine reine Formalität ist. Es wurde nicht nur augedeckt, dass es innerhalb der Armee und Marine Mitverschwörer gab, sondern auch im Königshaus, wo Prinz Rangsit offen die Rebellen unterstützte. Eine gründliche Säuberung ist eine Notwendigkeit ohne Alternative."
 siam.9.a: "Zeit, das Land wiederaufzubauen."
 #Attack Indochina
 siam.10.t: "Sieg!"
 siam.10.desc: "Der Feind befindet sich auf dem Rückzug und unser Sieg scheint sicher. Da das Territorium fest unter unserer Kontrolle steht, erzittern die alten imperialistischen Kräfte vor Angst. Wie konnten sie nur verlieren? Es ist offensichtlich ein Zeichen göttlicher Vorsehung!"
 siam.10.a: "Für [ROOT.GetName]!"
 siam.10.b: "Eigentlich läuft es ganz gut."
 siam.11.t: "[FROM.GetAdjective]er strategischer Durchbruch"
 siam.11.desc: "Entgegen aller Erwartungen schaffte es das [FROM.GetAdjective]e Militär, unsere Truppen zu überlisten und die Kontrolle über die umkämpfte Region zu übernehmen. Ihre Besetzung schwächte unsere Autorität und ließ Zweifel an unserem Anspruch auf das Gebiert aufkommen. Eine Fortsetzung des Konflikts birgt die Gefahr weiterer Illoyalität, doch die Aufgabe des Territoriums käme einem öffentlichen Eingeständnis des Scheiterns gleich."
 siam.11.a: "Wir sollten unsere Verluste begrenzen und uns zurückziehen."
 siam.11.b: "Wir geben unseren Anspruch nicht auf!"
 siam.12.t: "[FROM.GetNameDefCap] akzeptiert die Niederlage"
 siam.12.desc: "Unser Plan war ein voller Erfolg. Der feindliche Widerstand hat abgenommen und [FROM.GetNameDef] offiziell die Kontrolle über die umstrittenen Gebiete zurückgegeben, um weitere Zerstörungen zu verhindern. Dieser Sieg stärkt unsere Position und sichert unsere Grenzen – zumindest vorerst."
 siam.12.a: "Unsere Stärke ist unbestreitbar."
 siam.13.t: "[FROM.GetNameDefCap] lehnt jede Einigung ab"
 siam.13.desc: "[FROM.GetNameDefCap] lehnte sämtliche Vorschläge ab, die territoriale Zugeständnisse beinhalten. Die Führungsebene machte klar, dass nur die Zerstörung unseres Staates zu einem Ende des Konflikts führen wird."
 siam.13.a: "So sei es."
 siam.14.t: "[FROM.GetNameDefCap] ruft zum totalen Krieg auf"
 siam.14.desc: "[FROM.GetNameDefCap] gab sämtliche Vorwände auf, zu Verhandlungen bereit zu sein. Die eigentliche Absicht ist nun klar: die vollständige Eroberung und Annexion unserer Nation. Dieser Krieg wird nicht durch Verträge entschieden werden, sondern durch einen totalen Sieg oder unsere Auslöschung."
 siam.14.a: "Keine Kompromisse, keine Kapitulation."
 siam.15.t: "Der [SIA.GetAdjective]e Angriff ist zum Stillstand gekommen"
 siam.15.desc: "Der rasche [SIA.GetAdjective]en Streitkräfte mag uns überrascht haben, aber da ihr Vormarsch zunehmend ins Stocken gerät, ist ihre Schwachstelle nur zu offensichtlich. Was als Blitzkrieg gedacht war, ist für das [SIA.GetAdjective]e Militär zu einem Zermürbungskrieg geworden. Wir könnten großmütig sein und ihm durch Zugeständnisse einen Ausweg bieten, doch die Entscheidung liegt bei uns. Wird uns Gnade mehr bringen als ein vollständiger Sieg?"
 siam.15.a: "Bieten wir einen Ausweg an."
 siam.15.b: "Nur ein totaler Sieg ist ein akzeptabler Ausgang."
 siam.16.t: "Offensive zum Stillstand gekommen"
 siam.16.desc: "Unsere Offensive ist ins Stocken geraten, doch das ist nicht das eigentliche Problem. Es liegt vielmehr darin, dass unser Feind das weiß. Er stellte uns ein Ultimatum: Entweder wir kapitulieren mit minimalen Verlusten oder wir setzen den Krieg mit noch mehr Blutvergießen fort. Der einzige Unterschied besteht darin, wie viele Tote wir begraben müssen."
 siam.16.a: "Schließen wir Frieden."
 siam.16.b: "Wir werden niemals kapitulieren!"
 siam.17.t: "[FROM.GetNameDefCap] gibt nicht nach"
 siam.17.desc: "[FROM.GetNameDefCap] machte unmissverständlich klar, dass man lieber das gesamte Land in Flammen aufgehen lässt, als uns auch nur einen einzigen Zentimeter davon zu überlassen. Der Krieg geht weiter."
 siam.17.a: "Dieser Wunsch soll in Erfüllung gehen."
 siam.18.t: "[FROM.GetNameDefCap] fordert unsere Kapitulation!"
 siam.18.desc: "Eine abgefangene Nachricht des feindlichen Oberkommandos bestätigte unsere schlimmsten Befürchtungen: Es wird weder Verhandlungen noch Zugeständnisse geben, um diesen Krieg zu einem vernünftigen Ende zu führen. Man verlangt nichts weniger als die totale Kapitulation von uns und verdammt uns damit dazu, unter der Herrschaft eines weiteren Imperialisten zu leben. Wenn das ihr Ziel ist, haben wir nur eine Antwort: Wir werden niemals aufgeben."
 siam.18.a: "[ROOT.GetNameDefCap] bleibt standhaft!"
 siam.19.t: "[SIA.GetNameDefCap] fordert Rückgabe von Territorien"
 siam.19.desc: "[SIA.GetNameDefCap] forderte aufgrund des wachsenden Nationalismus und unserer vermeintlichen Schwäche die Rückgabe von Territorien, die man als Kernland betrachtet. Man fordert damit etwas, was weit über das hinausgeht, was einem eigentlich zustehen würde, doch andererseits lohnt es sich angesichts der derzeitigen Weltlage nicht unbedingt, um die beanspruchten Territorien zu kämpfen."
 siam.19.a: "Das lohnt den Kampf nicht."
 siam.19.b: "Die haben den Verstand verloren!"
 siam.20.t: "[FROM.GetNameDefCap] übergibt Territorien"
 siam.20.desc: "[FROM.GetNameDefCap] beschloss, uns unsere Territorien zurückzugeben. Ob man damit unsere Souveränität anerkennt oder lediglich dem Druck anderer Akteure nachgibt, ist irrelevant. Unsere Sache bleibt gerecht."
 siam.20.a: "Ein großer Tag!"
 siam.21.t: "[FROM.GetNameDefCap] lehnt Übergabe von Territorien ab"
 siam.21.desc: "[FROM.GetNameDefCap] lehnte unsere Forderung ab. Diese Imperialisten klammern sich mit aller Kraft an das letzte Jahrhundert und können sich nicht eingestehen, dass die Zeit ihrer sogenannten „großen Nationen“ abgelaufen ist."
 siam.21.a: "Wir werden es ihnen vor Augen führen."
 SIA_sent_bureaucrats_to_us: "Bildet Staatsbeamte bei uns aus"
 SIA_tied_their_currency_to_ours: "Band ihre Währung an unsere"
 SIA_sent_started_cooperative_with_us: "Begann eine Entwicklungskooperation mit uns"
 siam.22.t: "[SIA.GetAdjective]e Bürokraten ins Ausland entsenden"
 siam.22.desc: "Unsere Bürokraten sind für eine moderne Wirtschaft ungeeignet, da sie nicht über die nötige Ausbildung verfügen, um das Wachstum voranzutreiben. Glücklicherweise gibt es zahlreiche Länder mit einer modernen Verwaltung. Wir sollten unsere Bürokraten in diese Länder entsenden, damit sie dort Erfahrung sammeln, ohne gleichzeitig den dortigen Regierungsstil übernehmen zu müssen."
 siam.22.a: "Schicken wir sie nach [ENG.GetName]."
 siam.22.b: "[JAP.GetNameDefCap] ist eine gute Wahl."
 siam.23.t: "Gesetz zur Stabilisierung des Baht"
 siam.23.desc: "Der Baht muss fest verankert werden, damit Handel und Finanzwesen in [ROOT.GetName] stabil bleiben. Unsere Bürokraten argumentieren, die Währungsstabilität erfordere einen festen externen Anker, der an eine Währung mit ausreichendem Gewicht gebunden ist, um Kaufleute, Gläubiger und ausländische Partner zu beruhigen. Die Entscheidung, vor der wir stehen, ist nicht rein technischer Natur. Sie wird unser Handeln, unsere Entwicklung und den Grad an fremdem Einfluss bestimmen, der sich auf die [SIA.GetAdjective]e Wirtschaft auswirkt."
 siam.23.a: "Binden wir unsere Währung an das Pfund Sterling."
 siam.23.b: "Binden wir unsere Währung an den Yen."
 siam.24.t: "[SIA.GetAdjective]e Entwicklungskooperative"
 siam.24.desc: "Die [SIA.GetAdjective]e Entwicklungskooperative gab dem Staat ein neues Instrument zur nationalen Förderung an die Hand, doch der Ehrgeiz der Regierung übersteigt bei Weitem das verfügbare Kapital. Eisenbahnen, Werkstätten und Elektrizitätswerke benötigen finanzielle Unterstützung von außen, um sie schnellstmöglich fertigzustellen. Dafür stehen uns zwei Wege offen: Englische Investitionen bieten Zugang zu etablierten Märkten, erfahrenen Unternehmen und dem finanziellen Ansehen Londons. Japanische Investitionen versprechen eine engere industrielle Partnerschaft mit einer aufstrebenden asiatischen Macht, die danach trachtet, ihren Einfluss auszuweiten. Beide Wege beschleunigen unsere Entwicklung, doch keiner davon ist gänzlich ohne Verpflichtungen."
 siam.24.a: "Wir bitten um [ENG.GetAdjective]e Investitionen."
 siam.24.b: "Wir bitten um [JAP.GetAdjective]e Investitionen."
 siam.25.t: "Der Tod von Prajadhipok"
 siam.25.desc: "König Prajadhipok ist tot. Der ehemalige König, dessen Name die Erinnerung an die alte Ordnung über Jahre des Exils und der Umwälzungen bewahrte, zieht sich somit aus den Angelegenheiten der Menschen zurück und geht in die Geschichte ein. Für manche schließt sein Tod das letzte Kapitel eines Kampfes, der mit dem Ende der absoluten Herrschaft begann. Doch die Sache, für die er stand, stirbt nicht mit ihm. Der Thron bleibt bestehen, die Dynastie existiert weiter und die wiedergewonnene Würde und Stabilität in [ROOT.GetName] müssen nun vom jungen König Ananda verteidigt werden."
 siam.25.a: "Möge Seine Majestät in den Himmel aufsteigen."
 siam.27.t: "Einen König formen"
 siam.27.desc: "König Ananda hält sich derzeit in der [SWI.GetName] auf, fernab von jenem Königreich, das er eines Tages regieren wird. Trotz dieser Entfernung kann er sich jedoch nicht unserem Einfluss entziehen. Wir können einen Lehrer für ihn auswählen, um bestimmte Fächer in den Vordergrund zu stellen, und Gewohnheiten fördern, die ihn auf jene Zukunft ausrichten, die wir für [ROOT.GetName] anstreben. Ob er als Soldat, Gelehrter oder in einer noch bedeutenderen Rolle zurückkehrt, hängt nicht zuletzt davon ab, welche Anleitung er jetzt erfährt.\n\nWas ist ein König, wenn nicht die Verkörperung seines Landes?"
 siam.27.a: "Er sollte sich der Wissenschaft widmen."
 siam.27.b: "Wir brauchen einen militärischen Anführer."
 siam.27.c: "Die Verwaltung und Versorgung des Landes genießen oberste Priorität."
 siam.27.d: "Vermitteln wir ihm Kenntnisse über Industrie und Entwicklung."
 siam.28.t: "Die Krönung von König Ananda"
 siam.28.desc: "Die langen Jahre der Regentschaft neigen sich ihrem Ende zu. In Bangkok besteigt Ananda vor Prinzen, Mönchen, Ministern und Staatsbeamten kraft des ihm vererbten Rechts den Thron und empfängt damit jene Ehren, die einem König aus dem Hause Chakri zustehen. Die Zeremonien stehen für Kontinuität, wo zuvor Umwälzungen herrschten, und eine heilige Ordnung, wo zuvor Streit regierte. Für das Königreich ist diese Krönung nicht bloß ein Festakt, sondern eine Erklärung, dass die Krone fortbesteht und dass [ROOT.GetNameDef] durch Exil und Bürgerkrieg nicht gespalten werden kann."
 siam.28.a: "Lang lebe der König."
 siam.29.t: "Herkömmliche Panzer studieren"
 siam.29.desc: "Herkömmliche Panzer sind nach wie vor die Könige auf dem Schlachtfeld. Wir sollten daher von den Besten lernen und ein schlagkräftiges Panzerkorps aufbauen."
 siam.29.a: "Wir lernen von den Deutschen."
 siam.29.b: "Wir lernen von den Amerikanern."
 siam.29.c: "Wir lernen von den Briten."
 siam.31.t: "Beschaffung von U-Booten"
 siam.31.desc: "Für die Vergrößerung der Flotte werden dringend U-Boote benötigt, und wir müssen nun entscheiden, woher wir diese beziehen wollen. Sowohl [ENG.GetNameDef] als auch [JAP.GetNameDef] legten uns ein Angebot vor, doch die Entscheidung wird Auswirkungen haben, die über die Werft allein hinausreichen."
 siam.31.a: "[ENG.GetAdjective]e Schiffe werden uns gute Dienste leisten."
 siam.31.b: "Wir werden unsere U-Boot-Flotte auf [JAP.GetAdjective]en Entwürfen aufbauen."
 siam.32.t: "Beschaffung von Küstenverteidigungsschiffen"
 siam.32.desc: "Zur Verteidigung unserer Küstengewässer werden leistungsfähige Schiffe benötigt, und wir müssen einen Lieferanten auswählen. [ENG.GetNameDefCap] und [JAP.GetNameDef] stehen für eine Lieferung bereit, doch die Entscheidung wird sowohl unsere Flotte als auch unsere diplomatischen Beziehungen prägen."
 siam.32.a: "Wir vertrauen auf [ENG.GetAdjective]e Schiffe für unsere Küstenverteidigung."
 siam.32.b: "Wir vertrauen auf [JAP.GetAdjective]e Schiffe für unsere Küstenflotte."
 siam.33.t: "Verkauf des Werftunternehmens Bangkok"
 siam.33.desc: "Der Verkauf des Werftunternehmens Bangkok wurde erfolgreich abgewickelt, und der Erlös befindet sich bereits in der Staatskasse. Die Regierung muss nun entscheiden, wofür man diese Mittel am besten einsetzen sollte. Zur Auswahl steht eine Entlastung der Bürger, eine Beschleunigung des technologischen Fortschritts oder eine Stärkung des Vertrauens in die Zukunft des Landes."
 siam.33.a: "Wir müssen die Steuerlast senken."
 siam.33.b: "In der Flottenforschung sind die Gelder gut aufgehoben."
 siam.33.c: "Nutzen wir die Erlöse, um die Nation zu beruhigen."
 siam.34.t: "[FROM.GetNameDefCap] fordert unsere Küsten"
 siam.34.desc: "Die [FROM.GetAdjective]en Truppen üben Druck auf [ROOT.GetName] aus, und ihre Diplomaten sprechen mit der Zuversicht von Männern, die glauben, die Sache sei bereits entschieden. Sie reden von Ordnung und Stabilität, doch was sie in Wahrheit anstreben, ist Gehorsam. Wir können uns fügen und den Staat in geschwächter Form erhalten, uns ihrem Bündnis anschließen, um vielleicht etwas Handlungsfreiheit zu bewahren, oder uns dem Druck offen entgegenstellen und die Eindringlinge von unseren Küsten vertreiben."
 siam.34.a: "Schließen wir uns ihrem Bündnis an, um unsere Herrschaft zu bewahren."
 siam.34.b: "Wir müssen sie von unseren Küsten vertreiben."
 siam.35.t: "[JAP.GetNameDefCap] fordert, dass wir mehr Geld drucken"
 siam.35.desc: "[JAP.GetNameDefCap] brachte klar zum Ausdruck, welche Erwartungen man an uns hat: Wir sollen mehr Geld drucken, um ihren wirtschaftlichen Anforderungen zu entsprechen. Die Belastung wird unsere eigene Bevölkerung in Form von höheren Preisen treffen, während die japanische Industrie davon profitiert. Wir haben jedoch kaum eine andere Wahl, als dem nachzukommen."
 siam.35.a: "Wir kommen der [JAP.GetAdjective]en Forderung nach."
 siam.36.t: "[SIA.GetNameDefCap] fordert Rückzahlung von Staatsschulden"
 siam.36.desc: "[SIA.GetNameDefCap] forderte offiziell, dass wir die Kosten erstatten, die durch den Gelddruck entstanden, zu dem wir sie gezwungen hatten. Die Maßnahme kurbelte unsere Wirtschaft an, doch nun müssen wir die Rechnung begleichen."
 siam.36.a: "Wir werden mit der Rückzahlung beginnen."
 siam.37.t: "[JAP.GetNameDefCap] stimmt Schuldenrückzahlung zu"
 siam.37.desc: "[JAP.GetNameDefCap] stimmte unserer Forderung zu, die wirtschaftlichen Kosten für den Gelddruck zurückzuzahlen. Dies wird die Last, die unsere Bevölkerung tragen musste, zwar nicht vollständig beseitigen, aber zumindest wird es den Staatshaushalt etwas entlasten."
 siam.37.a: "Unsere Wirtschaft wird sich erholen."
 siam.38.t: "[SIA.GetNameDefCap] bittet um Frieden"
 siam.38.desc: "Die [SIA.GetAdjective]e Regierung wandte sich an uns, um Bedingungen für einen Frieden auszuhandeln. Ihre Minister räumen damit sein, was unsere Waffen bereits bewiesen: [ROOT.GetNameDefCap] hat in diesem Konflikt die Oberhand. Wir können ihre Kapitulation annehmen und sie zum Gehorsam zwingen, sie an unser Bündnis binden, damit ihre Regierung unserer übergeordneten Sache dient, oder jeden Kompromiss ablehnen und den Krieg fortsetzen, bis Siam vollständig erobert ist."
 siam.38.a: "Wir akzeptieren ihre Kapitulation."
 siam.38.b: "Nein, wir werden das gewaltsam regeln."
 siam.39.t: "Die [FROM.GetAdjective]e Regierung akzeptiert unsere Kapitulation"
 siam.39.desc: "[FROM.GetLeader] stimmte unserer Unterwerfung zu. Für den Augenblick bleibt [ROOT.GetName] weitere Verwüstung erspart, auch wenn dies nicht gänzlich ohne Demütigung einherging. Der Armee wurde befohlen, sich zurückzuziehen, und die Regierung bleibt im Amt. Wir bewahren den Staat, doch der Preis waren unser Stolz und unsere Handlungsfreiheit."
 siam.39.a: "Wir werden durchhalten."
 siam.40.t: "Die [FROM.GetAdjective]e Regierung lehnt unser Angebot ab"
 siam.40.desc: "[FROM.GetLeader] wies jedes Friedensangebot aus Bangkok zurück. Keine Bedingung scheint ausreichend zu sein und kein Kompromiss akzeptabel. Der Feind beabsichtigt, den Konflikt durch eine vollständige Eroberung zu regeln. Für [ROOT.GetName] besteht keine andere Möglichkeit mehr, als Widerstand zu leisten. Wenn sie unsere Küsten nicht freiwillig verlassen, müssen sie mit Gewalt vertrieben werden."
 siam.40.a: "Dann werden wir eben kämpfen."
 siam.41.t: "[FROM.GetNameDefCap] entsendet Beamte, um unsere Methoden zu studieren"
 siam.41.desc: "Eine Delegation [FROM.GetAdjective]er Beamter traf heute ein, um unsere Verwaltung und Forschung zu studieren. [FROM.GetNameDefCap] scheint entschlossen, die eigene Verwaltung zu modernisieren, und beschloss deshalb, die [ROOT.GetName] als Vorbild zu nehmen. Der Besuch ist eine stillschweigende Anerkennung unserer Methoden und bietet eine gute Gelegenheit, mit einer anderen Regierung wohlwollende Beziehungen zu pflegen."
 siam.41.a: "Wir begrüßen ihre Delegation."
 siam.42.t: "[FROM.GetNameDefCap] bindet die eigene Währung an unsere"
 siam.42.desc: "[FROM.GetNameDefCap] beschloss offiziell, die eigene Währung an unsere zu binden. Diese Entscheidung bringt [FROM.GetName] näher an unsere Wirtschaftssphäre und zeugt von dem Vertrauen, das man in die Stabilität unserer Währung besitzt. Infolgedessen sollte auch der Handel zwischen unseren beiden Nationen berechenbarer werden und [FROM.GetAdjective]e Händler werden es einfacher haben, Geschäfte an unseren Märkten zu tätigen."
 siam.42.a: "Eine erfreuliche Entwicklung für unsere Handelsbeziehungen."
 siam.43.t: "[FROM.GetNameDefCap] bittet um Entwicklungsinvestitionen"
 siam.43.desc: "[FROM.GetNameDefCap] lud unsere Ingenieure und Fachkräfte ein, an der Entwicklung des Landes mitzuwirken. Diese Zusammenarbeit verschafft unseren Unternehmen Zugang zu dieser Region und stärkt die wirtschaftlichen Beziehungen zwischen unseren Regierungen. Der eher unscheinbare Vorschlag könnte im Lauf der Zeit beträchtliche Vorteile mit sich bringen."
 siam.43.a: "Wir helfen gern."
 siam.44.t: "[FROM.GetNameDefCap] bestellt U-Boote"
 siam.44.desc: "[FROM.GetNameDefCap] bestellte U-Boote, die auf unseren Entwürfen basieren sollen. Dieser Kauf ist ein Vertrauensbeweis für unsere Marineindustrie und erweitert den [FROM.GetAdjective]en Einfluss auf die südostasiatischen Meere."
 siam.44.a: "Ein willkommener Auftrag für unsere Werften."
 SIA_purchased_submarines_from_us: "Kaufte U-Boote von uns"
 siam.45.t: "[FROM.GetNameDefCap] schläft Bündniszusammenlegung vor"
 siam.45.desc: "Eine Delegation aus [FROM.GetName] traf heute mit einem Vorschlag von [FROM.GetLeader] ein. Man gibt an, dass unsere getrennten Bündnisse mittlerweile dieselben übergeordneten Ziele verfolgen, während Personal, Material und diplomatischer Einfluss unnötigerweise aufgeteilt sind.\n\nDurch einen Zusammenschluss könnten wir einen einheitlichen Block schaffen, der unsere Strategie auf einer breiteren Front koordiniert. Eine solche Vereinbarung würde unsere gemeinsamen Ziele stärken, aber auch dazu führen, dass wir akzeptieren, dass der [FROM.GetAdjective]e Einfluss auf die künftige Ausrichtung des Bündnisses wachsen wird."
 siam.45.a: "Eine Einheitsfront ist eine Notwendigkeit."
 siam.45.b: "Unser Bündnis bleibt unser eigenes."
 siam.46.t: "[FROM.GetNameDefCap] stimmt Zusammenlegung zu"
 siam.46.desc: "[FROM.GetLeader] akzeptierte unseren Vorschlag, unsere Bündnisse in einer gemeinsamen Koalition zu verschmelzen. Wo einst zwei getrennte Kommandostrukturen und diplomatische Kanäle existierten, gibt es jetzt eine einheitliche Struktur, wodurch sich Kriegspläne, Versorgungsvereinbarungen und Außenpolitik mit weitaus größerer Effizienz koordinieren lassen.\n\nDie Vereinbarung ist nicht ganz unproblematisch, doch die Notwendigkeit der Einigkeit setzte sich durch."
 siam.46.a: "Gemeinsam sind wir stärker!"
 siam.47.t: "[FROM.GetNameDefCap] lehnt die Zusammenlegung ab"
 siam.47.desc: "[FROM.GetLeader] lehnte unseren Vorschlag einer Bündniszusammenlegung ab. Man gab an, die Zusammenarbeit könne dort fortgesetzt werden, wo sich unsere Interessen decken. Man werde das eigene Bündnis jedoch nicht in eine breitere Koalition einbinden, die von [ROOT.Capital.GetCapitalVictoryPointName] aus angeführt wird.\n\nVorerst bleibt die Kluft zwischen unseren Blöcken wohl bestehen. Wir müssen unsere Ziele weiter allein verfolgen."
 siam.47.a: "Dann machen wir allein weiter."
 siam.48.t: "[SIA.GetNameDefCap] bat um [JAP.GetAdjective]e Unterstützung"
 siam.48.desc: "[SIA.GetNameDefCap] bat über offizielle Kanäle um militärische Unterstützung gegen die einfallenden Truppen. Im Gegenzug erklärte sich die [SIA.GetAdjective]e Regierung bereit, [JAP.GetAdjective]en Firmen vorrangigen Zugang zu strategischen Ressourcen, Infrastruktur und Handelsrechten zu geben.\n\n[SIA.GetName] zu unterstützen, würde unseren Einfluss auf Südostasien ausweiten und dem Kaiserreich wertvolle Ressourcen sichern. Es würde uns aber auch in die regionalen Konflikte hineinziehen."
 siam.48.a: "Eine vorteilhafte Vereinbarung."
 siam.48.b: "[JAP.GetNameDefCap] kann die dafür nötigen Ressourcen derzeit nicht entbehren."
 siam.49.t: "[JAP.GetNameDefCap] akzeptierte unsere Bitte"
 siam.49.desc: "[JAP.GetNameDefCap] stimmte zu, [ROOT.GetName] im laufenden Konflikt zu unterstützen. [ROOT.GetNameDefCap]e Berater, Ausrüstung und Nachschub werden schon bald eintreffen. Im Gegenzug machen wir [JAP.GetAdjective]en Unternehmen gemäß der Vereinbarung wirtschaftliche Zugeständnisse.\n\nWährend die Regierung das Überleben der Nation feiert, fragen sich viele insgeheim, wie viel Unabhängigkeit für diese Hilfe aufgegeben werden musste."
 siam.49.a: "Wir haben einen wertvollen Verbündeten gewonnen."
 SIA_japan_aid_request.4.t: "[JAP.GetNameDefCap] lehnte unsere Bitte ab"
 SIA_japan_aid_request.4.desc: "Die [JAP.GetAdjective]e Regierung lehnte es ab, uns militärische Unterstützung zukommen zu lassen. Tokio begründet dies damit, dass man derzeit keine Männer oder Material für solch einen Konflikt bereitstellen könne.\n\nOhne Unterstützung ist [ROOT.GetNameDef] bei der bevorstehenden Invasion auf sich allein gestellt."
 SIA_japan_aid_request.4.a: "Wir sind auf uns allein gestellt."
 siam_adc.1.t: "[FROM.GetNameDefCap] fordert die Freilassung von [?var:SIA_adc_demand_country_to_be_released.GetName]"
 siam_adc.1.desc: "In einem offiziellen Schreiben aus [FROM.GetName] verurteilte [FROM.GetLeader] unsere anhaltende Besetzung asiatischer Länder als Verstoß gegen deren Recht auf Selbstbestimmung. In der Botschaft heißt es weiter, Asien sei kein Preis, der nach Belieben von fremden Mächten aufgeteilt oder verwaltet werden könne und dass wir unsere Truppen unverzüglich abziehen sollen, damit sich eine unabhängige [?var:SIA_adc_demand_country_to_be_released.GetAdjective]e Regierung bilden kann.\n\nDie Forderung lässt keinen Raum für Missverständnisse. [FROM.GetNameDefCap] erwartet, dass wir uns fügen, und wird eine Weigerung als Beleidigung der eigenen Nation ansehen."
 siam_adc.1.a: "Wir werden sie freilassen."
 siam_adc.1.b: "Wir werden die Besatzung fortsetzen."
 siam_adc.2.t: "[FROM.GetNameDefCap] bietet an, unsere Unabhängigkeit wiederherzustellen"
 siam_adc.2.desc: "Nach der [FROM.GetAdjective]en Akzeptanz der [SIA.GetAdjective]en Forderungen bezüglich der Zukunft von [ROOT.GetName] stellte uns [FROM.GetLeader] nun vor die entscheidende Frage: Die Besatzungstruppen sind bereit, sich zurückzuziehen und eine souveräne [ROOT.GetAdjective]e Regierung anzuerkennen, sollten wir uns entscheiden, wieder auf eigenen Beinen stehen zu wollen.\n\nUnabhängigkeit gibt uns unsere Würde und Handlungsfreiheit wieder, doch sie lässt unseren Staat auch ohne [FROM.GetAdjective]e Garantien zurück. Weiter unter ihrem Schutz zu bleiben, könnte dem Land in diesen unsicheren Zeiten weitere Unruhen ersparen."
 siam_adc.2.a: "Wir sind eine freie Nation."
 siam_adc.2.b: "Wir bleiben unter [FROM.GetAdjective]em Schutz."
 siam_adc.3.t: "[?var:SIA_tag_that_was_released_due_to_sia_pressure.GetNameDefCap] akzeptiert die Unabhängigkeit"
 siam_adc.3.desc: "Die [?var:SIA_tag_that_was_released_due_to_sia_pressure.GetAdjective]e Regierung entschied sich für die Unabhängigkeit. Die Besatzungsverwaltung wird bereits aufgelöst und [var:SIA_tag_that_was_released_due_to_sia_pressure.GetNameDef] bereitet sich darauf vor, wieder einen Platz unter den souveränen Nationen der Welt einzunehmen."
 siam_adc.3.a: "Was wird die Zukunft für sie bereithalten?"
 siam_adc.4.t: "[FROM.GetNameDefCap] lehnt die Unabhängigkeit ab"
 siam_adc.4.desc: "Trotz der Aussicht, die Freiheit zu erlangen, lehnte die [FROM.GetAdjective]e Regierung eine sofortige Unabhängigkeit ab. Die Minister argumentieren, der Staat sei noch nicht bereit, die Lasten der vollen Souveränität zu tragen, und man ziehe es vor, vorerst den Status quo beizubehalten."
 siam_adc.4.a: "Dann bleibt das derzeitige Arrangement bestehen."
 siam_adc.5.t: "[FROM.GetNameDefCap] lehnt unsere Forderungen ab"
 siam_adc.5.desc: "[FROM.GetNameDefCap] machte klar, dass unsere Forderungen lächerlich sind. Man führt unsere schwache Armee als Beweis dafür an, dass wir nicht in der Lage seien, den Status quo infrage zu stellen."
 siam_adc.5.a: "Dann werden wir es ihnen eben beweisen."
 siam_dem_event_count: "Je länger wir warten, desto größer wird die Verleumdungskampagne des Militärs"
 siam_dem.2.t: "Die Armee erhebt Einspruch"
 siam_dem.2.desc: "Bei einem privaten Treffen von Ministern und hochrangigen Offizieren äußerte ein Vertreter des Militärs scharfe Kritik am Vorschlag des gelben Dossiers. Er argumentiert, dessen Verfasser spreche zu ausführlich über staatliche Lenkung, Umverteilung und soziale Verpflichtungen, während er Disziplin, Eigentum und die Belastungen, die auf das Offizierskorps und den ländlichen Raum zukämen, zu wenig berücksichtige. Seiner Ansicht nach ist [ROOT.GetNameDef] nicht durch Theorien wiederherzustellen, die auf einem Stück Papier entworfen wurden, während sich die weltweite Lage von Monat zu Monat zuspitzt."
 siam_dem.2.a: "Die Armee hat ihren Standpunkt dargelegt."
 siam_dem.3.t: "Öffentliche Zurechtweisung"
 siam_dem.3.desc: "Der interne Streit ließ die Mauern des Ausschusssaals hinter sich. Eine Zeitung, die weithin als Sprachrohr des Militärs gilt, verurteilte das gelbe Dossier in aller Öffentlichkeit und stellte es als ein in patriotische Sprache gekleidetes Konzept von Fremden dar. Die Verfasser warnen davor, der Vorschlag stelle die Interessen einzelner Klassen über die nationale Einheit, schwäche das Vertrauen in etablierte Institutionen und schüre gefährliche Erwartungen unter Arbeitern und Bauern. Am Nachmittag wird der Artikel in Kasernen, Büros und Teehäusern gleichermaßen zitiert, und was zuvor ein innerer Disput war, wuchs mittlerweile zu einer öffentlichen Kontroverse heran."
 siam_dem.3.a: "Die Kritiker werden immer zahlreicher."
 siam_dem.4.t: "Phibun verurteilt das Dossier"
 siam_dem.4.desc: "Phibun mischte sich offen und entschlossen in den Streit ein. In einer Rede vor Anhängern und Offizieren verurteilte er das gelbe Dossier als im Kern kommunistisch, ganz gleich, welche Sprache seine Verteidiger auch immer bevorzugen mögen. Er erklärte, jedes Programm, das den Staat über das Eigentum stellt, verheiße einen umfassenden gesellschaftlichen Wandel, schüre Unruhe unter den unteren Schichten und trage das rote Gift unter einem anderen Namen nach [ROOT.GetName]."
 siam_dem.4.a: "Er lässt keine Zweifel offen."
 siam_dem.5.t: "Es muss eine Regierung gebildet werden"
 siam_dem.5.desc: "Das alte Regime wurde gestürzt und die Seri Thai stehen als Sieger da. Doch ein Sieg bedeutet nicht zwangsläufig, dass man auch Macht besitzt. Die Koalition, die sich gegen Phibun zusammenschloss, ist sich noch lange nicht einig darüber, wer seine Nachfolge antreten soll. Drei Namen sind als mögliche Kandidaten gefallen: Pridi Banomyong, das Gewissen des Widerstands; Khuang Aphaiwong, ein Mann, der so gemäßigt ist, dass er niemanden vor den Kopf stößt; und General Phin Choonhavan, dessen Offiziere ihren gerechten Lohn erwarten. Wen wir jetzt an die Macht bringen, wird den kommenden Frieden prägen."
 siam_dem.5.a: "Pridi Banomyong wird uns anführen. Der Widerstand hat es sich verdient."
 siam_dem.5.b: "Khuang Aphaiwong ist ein Gesicht, das alle Parteien akzeptieren können."
 siam_dem.5.c: "General Phin Choonhavan, damit die Armee ihren rechtmäßigen Platz bekommt."
 ###################
 #### AUSTRALIA ####
 ###################
 AST_election_events.1.t.a: "Sieg der UAP!"
 AST_election_events.1.t.b: "Sieg der ALP!"
 AST_election_events.1.desc.a: "Die Stimmen wurden ausgezählt, und die United Australia Party hat die Wahlen gewonnen.\n\nDie UAP muss zunächst eine Regierung bilden, bevor sie in den nächsten drei Jahren beweisen kann, dass das Vertrauen der Bürger in sie gerechtfertigt war."
 AST_election_events.1.desc.b: "Die Stimmen wurden ausgezählt, und die Australian Labor Party hat die Wahlen gewonnen.\n\nDie ALP muss zunächst eine Regierung bilden, bevor sie in den nächsten drei Jahren beweisen kann, dass das Vertrauen der Bürger in sie gerechtfertigt war."
 AST_election_events.1.a: "Das Volk hat gesprochen"
 AST_election_events.2.t: "Auf halbem Weg zur Parlamentswahl"
 AST_election_events.2.desc: "Die $AST_democratic_party_long$ führte [AST.GetName] seit 1931 an und die Nation aus der Weltwirtschaftskrise und der antidemokratischen Stimmung heraus. Dank ihrer entschlossenen Führung, ihrer konservativen Ausrichtung und ihrer Loyalität gegenüber Großbritannien konnte die UAP ihre Unterstützung festigen, was eine weitere Amtszeit immer wahrscheinlicher macht. Doch auch eine weitere Partei könnte die Macht übernehmen:\n\nDie $AST_labor_party_long$, die sich noch immer von dem Misstrauensvotum erholt, das sie 1931 ihrer Macht beraubte, gewinnt allmählich wieder an Schwung. Da die kommunistischen Stimmen zum Schweigen gebracht wurden, sucht die Arbeiterklasse nach einem neuen Leitbild. In ihrem Bestreben, alle Bürger zu vertreten, vertritt die ALP eine andere Sichtweise auf den Imperialismus und Australiens Loyalität gegenüber dem Empire. Sie priorisiert die eigenen Bedürfnisse und will ausländischen Interessen nicht länger Vorrang einräumen.\n\nBis zu den nächsten Parlamentswahlen dauert es noch anderthalb Jahre. Wenn die UAP einen weiteren Sieg erringen will, muss sie Reformen vorantreiben und sich die Unterstützung der Bevölkerung sichern. Andernfalls könnte es der ALP durch ihren geschickten Wahlkampf gelingen, ihr einstiges Ansehen zurückzugewinnen."
 AST_election_events.2.a: "Die UAP wird ihre letzten Reformen umsetzen."
 AST_election_events.2.b: "Eine Wahlkampftour durch Australien wird der ALP die nötige Unterstützung bringen."
 AST_election_events.3.t: "$AST_election_season_cat$"
 AST_election_events.3.desc: "$AST_election_season_cat_desc$"
 AST_election_events.3.a: "Es beginnt."
 AST_diplomatic_events.1.t: "Australischer Nichtangriffspakt"
 AST_diplomatic_events.1.desc: "Im Rahmen ihrer jüngsten diplomatischen Bemühungen strebt die australische Regierung Nichtangriffsabkommen mit einigen ausgewählten asiatischen Staaten an, zu denen auch wir gehören. Ob dieser Versuch, einen Krieg zu vermeiden, die australischen Regierungsvertreter als realitätsfern erscheinen oder sie in ehrenhafter Unschuld dastehen lässt, wird unsere Reaktion mitbestimmen.\n\nSollen wir einen Nichtangriffspakt mit [AST.GetName] unterschreiben?"
 AST_diplomatic_events.1.a: "Ganz klar: Nein."
 AST_diplomatic_events.1.b: "Unterschreiben wir ihn."
 AST_diplomatic_events.2.t: "Widerstand gegen den Pazifikpakt"
 AST_diplomatic_events.2.desc: "Die Delegation, die wir nach [FROM.GetName] entsandten, übermittelte die Reaktion auf unseren Vorschlag für einen Nichtangriffspakt per Telegramm. Wir waren uns der Kühnheit der Initiative von Anfang an bewusst, und deshalb ist die Ablehnung von [FROM.GetLeader] auch kaum eine Überraschung."
 AST_diplomatic_events.2.a: "Es war den Versuch wert."
 AST_diplomatic_events.3.t: "Lang lebe der Pazifikpakt"
 AST_diplomatic_events.3.desc: "Die Delegation, die wir nach [FROM.GetName] entsandten, übermittelte die Reaktion auf unseren Vorschlag für einen Nichtangriffspakt per Telegramm. Es ist erfreulich, nun zu hören, dass [FROM.GetLeader] unsere Initiative zu schätzen wusste und sich bereit erklärte, sie zu unterstützen."
 AST_diplomatic_events.3.a: "Hervorragend!"
 AST_diplomatic_events.4.t: "Australien bittet um die Übergabe von Singapur"
 AST_diplomatic_events.4.desc: "[AST.GetNameDefCap] stellt die Singapur-Strategie bereits seit langer Zeit in Frage, und laut australischen Regierungsvertretern ist es ungewiss, ob wir im Fall eines Pazifikkriegs in der Lage wären, ihnen zu Hilfe zu kommen. Unsere maritime Pflicht im Pazifik an [AST.GetName] zu übertragen, würde zwar die Last von unseren britischen Schultern nehmen, Erstere aber stattdessen auf die australischen Schultern verlagern.\n\nKönnen wir darauf vertrauen, dass eine erhöhe australische Kontrolle unsere Untertanen und Territorien in diesem Gebiet in eine bessere Position versetzt, als wenn Singapur weiterhin von uns kontrolliert wird?"
 AST_diplomatic_events.4.a: "Ja, darauf können wir vertrauen."
 AST_diplomatic_events.4.b: "Singapur muss weiter von uns kontrolliert werden."
 AST_diplomatic_events.5.t: "Großbritannien stimmt unserer Bitte zu"
 AST_diplomatic_events.5.desc: "Großbritannien stimmte zu, Singapur an Australien zu übergeben. Dies beendet endlich die veraltete Singapur-Strategie, und wir können uns wieder selbst um unsere Verteidigung kümmern."
 AST_diplomatic_events.5.a: "Die Strategie wurde umgeschrieben!"
 AST_diplomatic_events.5.a.tt: "§YSingapur§!:\n  Wird von §YAustralien§! kontrolliert.\n  Befindet sich im Besitz von §YAustralien§!.\n§YWeihnachtsinsel§!:\n  Wird von §YAustralien§! kontrolliert.\n  Befindet sich im Besitz von §YAustralien§!.\n§YKokosinseln§!:\n  Wird von §YAustralien§! kontrolliert.\n  Befindet sich im Besitz von §YAustralien§!."
 AST_diplomatic_events.6.t: "Großbritannien lehnte unsere Bitte ab"
 AST_diplomatic_events.6.desc: "Großbritannien weigerte sich, Singapur unter die Kontrolle von Australien zu stellen. Der Status quo wird aufrechterhalten."
 AST_diplomatic_events.6.a: "Die Singapur-Strategie muss irgendwie funktionieren ..."
 AST_diplomatic_events.7.t: "[AST.GetNameDefCap] bittet um Unterstützung"
 AST_diplomatic_events.7.desc: "[AST.GetNameDefCap] bat seine Verbündeten um Ausrüstung für den eigenen Kriegsbeitrag und fragt bei uns nach Unterstützung bei der Abwicklung der erforderlichen Lieferungen. Können wir ein paar Konvois erübrigen, damit [AST.GetNameDef] sie für den Krieg nutzen kann?"
 AST_diplomatic_events.7.a: "Wir haben ein paar übrig."
 AST_diplomatic_events.7.b: "Können wir nicht."
 AST_diplomatic_events.8.t: "[USA.GetNameDefCap] kommen unserer Bitte nach"
 AST_diplomatic_events.8.desc: "[USA.GetNameDefCap] stimmten zu, ein paar Konvois bereitzustellen, um die [AST.GetAdjective]en Versorgungsbemühungen zu unterstützen."
 AST_diplomatic_events.8.a: "Sie werden für uns von großem Nutzen sein."
 AST_diplomatic_events.9.t: "[USA.GetNameDefCap] lehnten unsere Bitte ab"
 AST_diplomatic_events.9.desc: "[USA.GetNameDefCap] können keine Konvois für die [AST.GetAdjective]en Versorgungsbemühungen entbehren."
 AST_diplomatic_events.9.a: "Wir müssen die Logistik irgendwie selbst organisieren."
 AST_diplomatic_events.10.t: "Ein Bündnis in Kriegszeiten"
 AST_diplomatic_events.10.desc: "[AST.GetNameDefCap] schätzt die [USA.GetAdjective]e Partnerschaft sehr und bat nun darum, dass sie als gemeinsame internationale Kriegskoalition formalisiert wird. Durch die Zusammenarbeit könnten sich unsere beiden Länder in gegenwärtigen und zukünftigen Konflikten gegenseitig unterstützen."
 AST_diplomatic_events.10.a: "Wir stimmen zu."
 AST_diplomatic_events.10.b: "[USA.GetNameDefCap] werden ohne sie stärker sein."
 AST_diplomatic_events.11.t: "Ein Bündnis in Kriegszeiten"
 AST_diplomatic_events.11.desc: "[USA.GetNameDefCap] stimmten dem Bündnis zu. Als Mitglieder des Bündnisses „[AST.GetFactionName]“ werden sich [AST.GetNameDef] und [USA.GetNameDef] fortan in allen gegenwärtigen und zukünftigen Konflikten gegenseitig unterstützen."
 AST_diplomatic_events.11.a: "Unsere Feinde werden uns fürchten."
 AST_diplomatic_events.12.t: "Bündnis in Kriegszeiten abgelehnt"
 AST_diplomatic_events.12.desc: "[USA.GetNameDefCap] lehnten unseren Vorschlag, unsere Kräfte zu bündeln, ab. [AST.GetNameDefCap] und [USA.GetNameDef] werden in ihrem jeweiligen Kriegsbeitrag weiterhin gespalten bleiben."
 AST_diplomatic_events.12.a: "Wir müssen ohne sie auskommen."
 AST_diplomatic_events.13.t: "Artikel 6"
 AST_diplomatic_events.13.desc: "Als sich die australischen Kolonien zu einer Föderation vereinten, entschied sich Neuseeland dagegen. Dennoch definiert die australische Verfassung uns seither als einen potenziellen Staat des Commonwealth und erlaubt ausdrücklich unsere Aufnahme.\n\n[AST.GetNameDefCap] behauptet, die gegenwärtige weltpolitische Lage erfordere Einheit, und bat darum, [NZL.GetName] unter australische Kontrolle zu stellen. Sollen wir in dieser Angelegenheit ein Referendum abhalten?"
 AST_diplomatic_events.13.a: "Halten wir es ab."
 AST_diplomatic_events.13.a.tt: "Es wird ein Referendum abgehalten, was potenziell zur §RAnnektierung§! von §Y[NZL.GetName]§! führen wird"
 AST_diplomatic_events.13.b: "Kommt nicht infrage!"
 AST_diplomatic_events.14.t: "[NZL.GetNameDefCap] wird zu einem australischen Staat"
 AST_diplomatic_events.14.desc: "Bei dem kürzlich abgehaltenen Referendum beschloss [NZL.GetNameDef], sich auf Artikel 6 der australischen Verfassung zu berufen. Die Mehrheit der Neuseeländer war sich einig, dass ihr Land unter australischer Verwaltung sicherer ist, und stimmte deshalb dafür, [AST.GetName] beizutreten."
 AST_diplomatic_events.14.a: "Australien expandiert."
 AST_diplomatic_events.15.t: "Die neuseeländische Bevölkerung leistet Widerstand"
 AST_diplomatic_events.15.desc: "Bei dem kürzlich abgehaltenen Referendum beschloss [NZL.GetNameDef], sich nicht auf Artikel 6 der australischen Verfassung zu berufen. [NZL.GetNameDefCap] bleibt eine unabhängige Nation."
 AST_diplomatic_events.15.a: "Australien bleibt, wie es ist."
 AST_diplomatic_events.16.t: "Die [NZL.GetAdjective]e Verwaltung leistet Widerstand"
 AST_diplomatic_events.16.desc: "Trotz australischen Drucks beschloss [NZL.GetNameDef], kein Referendum abzuhalten, um Artikel 6 der australischen Verfassung durchzusetzen. [NZL.GetNameDefCap] bleibt eine unabhängige Nation."
 AST_diplomatic_events.16.a: "Australien bleibt, wie es ist."
 AST_diplomatic_events.17.t: "Australische Partnerschaft"
 AST_diplomatic_events.17.desc: "Der Feind rückt aus dem Norden an, und es ist nur eine Frage der Zeit, bis er auch vor unserer Haustür steht - so behaupten es zumindest australische Regierungsvertreter. [AST.GetNameDefCap] schlägt deshalb vor, dass wir uns zusammenschließen, um eine gemeinsame Front zu bilden, vorzugsweise indem [INS.GetNameDef] unter australische Hoheitsgewalt gestellt wird oder zumindest indem wir ihren Streitkräften Zugang gewähren."
 AST_diplomatic_events.17.a: "Wir unterstellen uns der australischen Autorität."
 AST_diplomatic_events.17.a.tt: "§Y[INS.GetNameDefCap]§! wird ein §YMarionettenstaat§! von §Y[AST.GetName]§!."
 AST_diplomatic_events.17.b: "Wir geben ihnen eine Durchmarschgenehmigung."
 AST_diplomatic_events.17.b.tt: "§Y[INS.GetNameDefCap]§! gewährt §Y[AST.GetName]§! eine §YDurchmarschgenehmigung§!."
 AST_diplomatic_events.17.c: "Wir stimmen keinem von beiden zu."
 AST_diplomatic_events.18.t: "[INS.GetNameDefCap] kommt australischer Bitte nach"
 AST_diplomatic_events.18.desc: "[INS.GetName] stimmte unserer Bitte zu. Unsere Partnerschaft wird die Verteidigungsfähigkeiten unserer beider Länder erheblich verbessern."
 AST_diplomatic_events.18.a: "Fantastisch!"
 AST_diplomatic_events.19.t: "[INS.GetNameDefCap] lehnt ab"
 AST_diplomatic_events.19.desc: "[INS.GetName] lehnte unsere Bitte ab. Wir werden uns selbst um unsere Verteidigung kümmern müssen."
 AST_diplomatic_events.19.a: "[AST.GetNameDefCap] wird die vor uns liegenden Konflikte auch ohne sie überstehen."
 AST_diplomatic_events.20.t: "Einladung zum britischen Kriegskabinett"
 AST_diplomatic_events.20.desc: "[GET_AST_BWC_COUNT][ENG.GetNameDefCap] lud den australischen Premierminister zum britischen Kriegskabinett ein. Aufgrund der weltweiten Spannungen sah sich Großbritannien dazu veranlasst, eine gemeinsame Strategie mit seinen Verbündeten auszuarbeiten und eine verstärkte Zusammenarbeit zu verfolgen.\n\nAustralien plagen jedoch seine eigenen Sorgen. Können wir etwas von der Zeit des Premierministers opfern, um den Briten einen Gefallen zu tun?"
 AST_diplomatic_events.20.a: "[AST.GetLeader] wird nach Großbritannien reisen."
 AST_diplomatic_events.20.b: "Wir brauchen ihn hier."
 AST_bwc_count_2: "[ENG.GetLeader] bat [AST.GetLeader] zum zweiten Mal um Teilnahme und betonte, dass unsere enge Zusammenarbeit über den Ausgang unseres gemeinsamen Kampfes entscheiden werde.\n\n"
 AST_bwc_count_3: "[AST.GetLeader] wurde erneut darum gebeten, das Meer zu überqueren, um die Zusammenarbeit im Commonwealth aufrechtzuerhalten. Es ist jedoch nicht damit zu rechnen, dass noch viele weitere derartige Anfragen gestellt werden, solange wir deutlich machen, ob unsere Interessen derselben Sache gelten oder wir uns lieber um unsere eigenen Angelegenheiten kümmern.\n\n"
 AST_bwc_accept_effect_tt: "§YAuswirkungen, wenn wir die Einladung 3-mal akzeptieren:§!"
 AST_bwc_accept_tt: "Die Einladung wurde §Y[?var:AST_bwc_accept]§!/§Y3§!-Mal akzeptiert"
 AST_diplomatic_events.22.t: "Erfolgreicher Beitrag zum britischen Kriegskabinett"
 AST_diplomatic_events.22.desc: "Im letzten Jahr nahm der Premierminister mehrmals am britischen Kriegskabinett teil. Dies führte zwar das eine oder andere Mal dazu, dass [AST.GetNameDef] den Preis dafür zahlen musste, doch unsere Nation steht durch die Zusammenarbeit mit Großbritannien nun stärker da."
 AST_diplomatic_events.22.a: "Der Preis war es am Ende wert."
 AST_diplomatic_events.23.t: "[ENG.GetLeader] ist nicht länger auf den australischen Kriegbeitrag angewiesen"
 AST_diplomatic_events.23.desc: "[ENG.GetNameDefCap] lud den australischen Premierminister mehrmals zum britischen Kriegskabinett ein, doch nach wiederholten Absagen sah [ENG.GetLeader] keinen Grund mehr, dies auch weiterhin zu tun."
 AST_diplomatic_events.23.a: "Verständlich."
 AST_diplomatic_events.24.t: "Ein Wechsel in der Führung"
 AST_diplomatic_events.24.desc: "Der australische Premierminister beeinflusste die Kriegsanstrengungen des Britischen Commonwealth maßgeblich. Bei seinen regelmäßigen Besuchen in London konnte Robert Menzies das Vertrauen der britischen Minister gewinnen, wohingegen deren Vertrauen in ihren eigenen Premierminister immer weiter schwand. Die Minister drängen die [ENG.GetAdjective]e Führung nun zum Rücktritt und fordern, dass Menzies seinen Platz einnimmt.\n\nSelbst wenn [AST.GetNameDef] den Premierminister verlieren sollte, gewinnen wir die ewige Treue unserer Kolonialherren, die nun von einem australischen Landsmann angeführt werden. Down Under strebt nach mehr Einfluss und Robert Menzies ist der Erste, der sich dafür einsetzt."
 AST_diplomatic_events.24.a: "Das Blatt wendet sich."
 AST_diplomatic_events.25.t: "Unter der Herrschaft von Canberra"
 AST_diplomatic_events.25.desc: "Die wachsenden Spannungen zwischen den Pazifikstaaten sind besorgniserregend. Da Großbritannien eigene Konflikte auszutragen hat, scheint es unwahrscheinlich, dass wir unseren Untertanen zu Hilfe kommen können. Zumindest behauptet das [AST.GetName].\n\nMan fordert, das Britische Commonwealth so umzugestalten, dass die Staaten des Pazifiks und des Indischen Ozeans direkt von Canberra aus verwaltet werden. Willigen wir ein?"
 AST_diplomatic_events.25.a: "Das tun wir. Der Pazifikraum ist unter einer zentralen Kontrollinstanz stärker."
 AST_diplomatic_events.25.b: "Auf keinen Fall!"
 AST_diplomatic_events.26.t: "Commonwealth des Pazifiks"
 AST_diplomatic_events.26.desc: "[ENG.GetNameDefCap] stimmt zu: Der Pazifikraum ist unter einer zentralen Kontrollinstanz stärker. Die britischen Territorien im Pazifik wurden bereits unserer Verwaltung unterstellt."
 AST_diplomatic_events.26.a: "Die Nationen des Pazifiks bündeln ihre Kräfte."
 AST_diplomatic_events.27.t: "Großbritannien lehnt ab"
 AST_diplomatic_events.27.desc: "[ENG.GetNameDefCap] lehnt ab: Der Pazifikraum wird nicht unter einer zentralen Kontrollinstanz stärker sein. Die britischen Territorien im Pazifik werden unter britischer Kontrolle bleiben."
 AST_diplomatic_events.27.a: "Australien wird dennoch standhaft bleiben."
 AST_diplomatic_events.28.t: "[ENG.GetLeader] beendete die Gespräche"
 AST_diplomatic_events.28.desc: "Der telegrafische Streit des Premierministers mit [ENG.GetLeader] brachte Australien kaum Unterstützung, verstärkte jedoch den Unmut der Briten gegenüber [AST.GetLeader], der sich für die Interessen Australiens einsetzte."
 AST_diplomatic_events.28.a: "Australien muss sich selbst um die Verteidigung kümmern."
 AST_diplomatic_events.29.t: "Großbritannien kommt uns zu Hilfe"
 AST_diplomatic_events.29.desc: "[ENG.GetNameDefCap] gab dem Druck seitens Australien nach und stimmte zu, unsere Bemühungen zum Aufbau von Verteidigungsanlagen zu unterstützen, um gegen den bevorstehenden Konflikt mit [JAP.GetName] gewappnet zu sein."
 AST_diplomatic_events.29.a: "Ihre Hilfe ist willkommen, wird aber einen Krieg mit Japan nicht verhindern."
 AST_diplomatic_events.30.t: "Australien bittet um Ressourcenrechte"
 AST_diplomatic_events.30.desc: "Expansionistische Aggressoren haben es auf Indochina abgesehen - und das nicht nur wegen des Territoriums, sondern auch wegen der Ressourcen. Sollten diese Reichtümer in die Hände des Feindes fallen, wird dies den Krieg nur verlängern, wohingegen sie in australischen Händen dazu beitragen könnten, ihn zu beenden - so behauptet es zumindest die australische Regierung.\n\nSollen wir den Australiern Ressourcenrechte in unserem Territorium gewähren?"
 AST_diplomatic_events.30.a: "Wir geben ihnen die Rechte."
 AST_diplomatic_events.30.b: "Die Ressourcen gehören auch nicht [AST.GetName]."
 AST_diplomatic_events.31.t: "[FROM.GetNameDefCap] gewährt [AST.GetName] Ressourcenrechte"
 AST_diplomatic_events.31.desc: "Expansionistische Aggressoren haben es auf Indochina abgesehen - und das nicht nur wegen des Territoriums, sondern auch wegen der Ressourcen. Sollten diese Reichtümer in die Hände des Feindes fallen, wird dies den Krieg nur verlängern, wohingegen sie in australischen Händen dazu beitragen könnten, ihn zu beenden - so behauptet es zumindest die australische Regierung.\n\n[ROOT.OVERLORD.GetNameDefCap] stimmte der Bitte zu."
 AST_diplomatic_events.31.a: "Das liegt außerhalb unserer Kontrolle."
 AST_diplomatic_events.32.t: "[FROM.GetNameDefCap] gewährt Ressourcenrechte"
 AST_diplomatic_events.32.desc: "[FROM.GetNameDefCap] stimmte zu, dass die Ressourcen Indochinas in australischen Händen sicherer sind, und gewährte uns Ressourcenrechte."
 AST_diplomatic_events.32.a: "Sie werden für uns von großem Nutzen sein."
 AST_diplomatic_events.33.t: "[FROM.GetNameDefCap] lehnt Vergabe von Ressourcenrechten ab"
 AST_diplomatic_events.33.desc: "[FROM.GetNameDefCap] ist offenbar nicht der Meinung, dass die Ressourcen Indochinas in australischen Händen sicherer sind. Man hat uns die Ressourcenrechte verwehrt."
 AST_diplomatic_events.33.a: "Hoffen wir, dass sie nicht in die Hände unserer Feinde fallen."
 AST_diplomatic_events.34.t: "[AST.GetNameDefCap] bittet um Aufteilung der Pazifikterritorien"
 AST_diplomatic_events.34.desc: "[AST.GetNameDefCap] schlug einen Pakt vor, der potenzielle Konflikte zwischen unseren beiden Nationen beilegen würde, bevor sie überhaupt entstehen können. Indem wir die Territorien im Pazifik unter uns aufteilen, können wir künftige Expansionen planen, ohne eine Einmischung des jeweils anderen befürchten zu müssen."
 AST_diplomatic_events.34.a: "Ein Pakt klingt vernünftig."
 AST_diplomatic_events.34.b: "[JAP.GetNameDefCap] wird nach eigenem Ermessen expandieren."
 AST_diplomatic_events.35.t: "Der Pazifik wurde aufgeteilt"
 AST_diplomatic_events.35.desc: "[AST.GetNameDefCap] und [JAP.GetNameDef] einigten sich, in welche Pazifikterritorien ihr jeweiliges Land expandieren darf. Hoffen wir, dass dies einen möglichen Konflikt zwischen uns in Zukunft verhindert."
 AST_diplomatic_events.35.a: "Eine Einigung wurde erzielt!"
 AST_diplomatic_events.36.t: "Keine Einigung über Pazifikterritorien"
 AST_diplomatic_events.36.desc: "[JAP.GetNameDefCap] lehnte es ab, den Pazifik unter unseren Nationen aufzuteilen. Die japanische Regierung wird nach eigenem Ermessen expandieren."
 AST_diplomatic_events.36.a: "Das wird auch Australien tun."
 AST_diplomatic_events.37.t: "Übertragung der Suzeränität"
 AST_diplomatic_events.37.desc: "Aus uns unbekannten Gründen beschloss [AST.GetNameDef], die Kontrolle über unser Land an [JAP.GetName] zu übertragen. Hinter den Kulissen brodelt etwas Unheilvolles, und es ist nur eine Frage der Zeit, bis die Welt erfährt, was es damit auf sich hat."
 AST_diplomatic_events.37.a: "Offensichtlich haben wir in dieser Angelegenheit kein Mitspracherecht."
 AST_diplomatic_events.38.t: "Das Nauru-Abkommen"
 AST_diplomatic_events.38.desc: "Infolge des Ersten Weltkriegs wurden mehrere deutsche Territorien im Pazifik unter australische Kontrolle gestellt, doch nun gibt es möglicherweise einen Weg, eines von ihnen zurückzugewinnen: die Insel Nauru.\n\nDie [AST.GetFascistParty] folgt Werten, die mit unseren Interessen übereinstimmen, darunter die vollständige Trennung von [ENG.GetName]. Da die Bewegung derzeit nur über begrenzten Einfluss verfügt, baten uns ihre Anführer um Unterstützung dabei, das Wachstum der Bewegung zu fördern. Sobald sie die Macht übernommen haben, so versichern sie, werde man uns die Kontrolle über die Insel Nauru zurückzugeben - unter der Voraussetzung, dass wir ihe Unabhängigkeit unterstützen."
 AST_diplomatic_events.38.a: "Wir werden dafür sorgen, dass wir unser Territorium zurückerhalten!"
 AST_diplomatic_events.38.b: "Wir können solch einen Schritt nicht für leere Versprechen eingehen."
 AST_diplomatic_events.39.t: "[GER.GetNameDefCap] stimmt Nauru-Abkommen zu"
 AST_diplomatic_events.39.desc: "[GER.GetNameDefCap] und die [AST.GetFascistParty] einigten sich auf ein gemeinsames Ziel: [AST.GetNameDefCap] soll unabhängig werden. Da die [AST.GetFascistParty] derzeit jedoch nur über begrenzten politischen Einfluss verfügt, wird [GER.GetNameDef] das Wachstum der Bewegung finanziell unterstützen. Sobald wir schließlich an der Macht sind, soll der Rest der Vereinbarung vollständig umgesetzt werden."
 AST_diplomatic_events.39.a: "Hervorragend!"
 AST_diplomatic_events.40.t: "Das Nauru-Abkommen scheitert"
 AST_diplomatic_events.40.desc: "Da man nicht gewillt ist, sich auf Versprechen einzulassen, die noch nicht erfüllt werden können, lehnte [GER.GetNameDef] ab, unseren Aufstieg an die Macht zu unterstützen. Der Nauru-Pakt endet, noch ehe er überhaupt begann, und die ambitionierten Ziele der [AST.GetFascistParty] ruhen allein auf unseren eigenen Schultern."
 AST_diplomatic_events.40.a: "Die [AST.GetFascistParty] wird auch ohne deutsche Unterstützung weitermachen."
 AST_diplomatic_events.41.t: "Nauru kehrt in deutsche Hände zurück"
 AST_diplomatic_events.41.desc: "Die [AST.GetFascistParty] übernahm die Macht und hielt ihren Teil der Abmachung ein. Nauru wurde an [GER.GetName] zurückgegeben, und wir werden die Unabhängigkeit Australiens garantieren."
 AST_diplomatic_events.41.a: "Das werden wir auch."
 AST_diplomatic_events.42.t: "Die [AST.GetFascistParty] bricht ihr Versprechen"
 AST_diplomatic_events.42.desc: "Versprechen haben einen entscheidenden Nachteil: Sie können gebrochen werden. Da die [AST.GetFascistParty] nun an der Macht ist, beschlossen ihre Anführer, dass ihnen nicht nur Nauru zusteht, sondern auch andere Pazifikinseln.\n\nUnsere ehemaligen Pazifikterritorien gehören uns heute genauso wenig wie vor der Unterzeichnung des Nauru-Abkommens, und wenn wir etwas daran ändern wollen, muss es Krieg geben."
 AST_diplomatic_events.42.a: "Die Zukunft wird zeigen, welche Folgen das haben wird."
 AST_diplomatic_events.43.t: "[AST.GetNameDefCap] fordert Südostasien"
 AST_diplomatic_events.43.desc: "[AST.GetNameDefCap] argumentierte, man kömne durch eine Expansion nach Norden unseren gemeinsamen Einfluss auf die Diplomatie und Konflikte in Südostasien verstärken. Es ist zwar keine direkte Forderung, aber [AST.GetLeader] machte deutlich, dass man eine Ablehnung nicht akzeptieren werde."
 AST_diplomatic_events.43.a: "Da wir derzeit anderen Plänen nachgehen, wird es wohl das Beste sein."
 AST_diplomatic_events.43.b: "Eine Ablehnung ist dennoch das Einzige, was sie erhalten werden."
 AST_diplomatic_events.44.t: "Übergabe von Südostasien"
 AST_diplomatic_events.44.desc: "[ENG.GetNameDefCap] stimmte klugerweise zu, uns die Territorien in Südostasien zu übergeben. Mit der Expansion der australischen Grenzen wächst auch unser Einfluss, weshalb es nur eine Frage der Zeit ist, bis uns die Welt zu Füßen liegt."
 AST_diplomatic_events.44.a: "Uns erwartet eine strahlende Zukunft."
 AST_diplomatic_events.45.t: "Südostasien bleibt, wie es ist"
 AST_diplomatic_events.45.desc: "[ENG.GetNameDefCap] verweigerte die Übergabe der südostasiatischen Territorien an uns. Der Wunsch, die Region weiter zu beherrschen, wurde klar ersichtlich, und auch wenn man nicht auf uns hörte, können wir noch immer dafür sorgen, dass die Region in unseren Besitz übergeht."
 AST_diplomatic_events.45.a: "Das wird sie eines Tages."
 #AST_diplomatic_events.46.t was removed
 AST_diplomatic_events.47.t: "Teilung der Lasten"
 AST_diplomatic_events.47.desc: "Trotz des kürzlichen Austritts aus dem Britischen Commonwealth ist [AST.GetNameDef] weiterhin für eine militärische Zusammenarbeit offen. [AST.GetNameDefCap] behauptet, es sei auch zum Vorteil von [ENG.GetName], die Last zu teilen, wenn man bedenke, wie gering der [ENG.GetAdjective]e Einfluss aufgrund der riesigen Größe in einigen Teilen der Welt ist."
 AST_diplomatic_events.47.a: "Wir akzeptieren."
 AST_diplomatic_events.47.b: "Wir kommen schon allein zurecht."
 AST_diplomatic_events.48.t: "Abkommen zwischen Großbritannien und Australien"
 AST_diplomatic_events.48.desc: "[ENG.GetNameDefCap] stimmte zu, einen Nichtangriffspakt zu unterzeichnen und damit die Grundlage für eine weitere militärische Zusammenarbeit zu schaffen."
 AST_diplomatic_events.48.a: "Ein neues Kapitel in unseren Beziehungen."
 AST_diplomatic_events.49.t: "Abkommen nicht unterzeichnet"
 AST_diplomatic_events.49.desc: "[ENG.GetNameDefCap] weigerte sich, einen Nichtangriffspakt zu unterzeichnen. Unsere Bemühungen, die militärische Zusammenarbeit zwischen unseren beiden Nationen zu fördern, ist gescheitert. Wir müssen allein weitermachen."
 AST_diplomatic_events.49.a: "Das müssen wir."
 AST_diplomatic_events.50.t: "Die australische Pazifikgarnison"
 AST_diplomatic_events.50.desc: "Obwohl der Schutz Südostasiens und des Pazifikraums im Interesse Großbritanniens liegt, ist die Region weit von den Britischen Inseln entfernt, und das hat auch [FROM.GetNameDef] begriffen. Als Gegenleistung für unsere Unterstützung bei der Versorgung bot man uns nun an, die Verteidigung des Gebiets zu übernehmen, damit wir unsere Aufmerksamkeit auf andere Orte richten können."
 AST_diplomatic_events.50.a: "Wir heißen die [FROM.GetAdjective]e Unterstützung willkommen."
 AST_diplomatic_events.50.b: "Die Region liegt nah genug."
 AST_diplomatic_events.51.t: "[ENG.GetAdjective]e Pazifikgarnison"
 AST_diplomatic_events.51.desc: "[FROM.GetNameDefCap] stimmte zu, dass die südostasiatischen Meere von uns beschützt werden sollten. Im Tausch für britische Treibstofflieferungen wird [ROOT.GetNameDef] die maritime Vorherrschaft in unseren angrenzenden Gewässern ausbauen."
 AST_diplomatic_events.51.a: "Die Meere gehören uns."
 AST_diplomatic_events.52.t: "Australiens eigene Pazifikgarnison"
 AST_diplomatic_events.52.desc: "[FROM.GetNameDefCap] lehnte ab. Offenbar benötigt man keine Hilfe bei der Verteidigung der südostasiatischen Meere. Ganz egal, ob mit oder ohne Unterstützung: [ROOT.GetNameDef] wird alles dafür geben, die maritime Vorherrschaft in den angrenzenden Gewässern auszubauen."
 AST_diplomatic_events.52.a: "Die Meere gehören uns."
 AST_diplomatic_events.53.t: "Vichy-Afrika"
 AST_diplomatic_events.53.desc: "[AST.GetNameDefCap] vermutet, dass der Sturz von oder eine Zusammenarbeit mit Vichy-Frankreich zu den Hauptzielen von [ENG.GetName] zählt, und bot deshalb an, sich dem Plan anzuschließen und die französischen Kolonien in Afrika dazu zu bringen, sich von Vichy-Frankreich loszusagen. Auch wenn hinter dem Vorschlag möglicherweise eine verborgene Absicht steckt, steht außer Frage, dass eine verstärkte Präsenz der Alliierten in der Region für uns von Vorteil wäre.\n\nSollten wir den Plan unterstützen, wird [AST.GetNameDef] Gespräche mit dem Vichy-Regime aufnehmen, um eine friedliche Übergabe der Kolonien und die Stationierung einer australischen Garnison zu erreichen."
 AST_diplomatic_events.53.a: "Wir freuen uns über ihre Unterstützung."
 AST_diplomatic_events.53.b: "Das Risiko, dass sich [AST.GetNameDef] gegen uns stellt, ist zu groß."
 AST_diplomatic_events.54.t: "Unterstützung zugesichert"
 AST_diplomatic_events.54.desc: "[ENG.GetNameDefCap] stimmte zu, dass eine erhöhte Präsenz der Alliierten in Afrika dem Commonwealth zugutekäme.\n\nWir nehmen Gespräche mit dem Vichy-Regime auf, um eine friedliche Übergabe der Kolonien und die Stationierung einer australischen Garnison zu erreichen."
 AST_diplomatic_events.54.a: "Das werden wir."
 AST_diplomatic_events.55.t: "Mit Erlaubnis oder ohne"
 AST_diplomatic_events.55.desc: "[ENG.GetNameDefCap] benötigt offenbar keine australische Hilfe in Afrika und wird die Angelegenheit mit Vichy-Frankreich selbst regeln. Wir geben unsere Ambitionen dennoch nicht so leicht auf.\n\nWenn Australien die Kontrolle über die afrikanischen Territorien von Vichy-Frankreich übernähme, würde uns das zu einem gleichberechtigten Partner des Britischen Commonwealth machen anstatt zu dessen Untergebenen. Wir müssen dieses Ziel trotz [ENG.GetAdjective]er Ablehnung weiterverfolgen, auch wenn dies mit gewaltsamen Mitteln geschehen muss."
 AST_diplomatic_events.55.a: "Wir werden expandieren."
 AST_diplomatic_events.56.t: "[AST.GetNameDefCap] fordert afrikanische Territorien"
 AST_diplomatic_events.56.desc: "Im Namen von [ENG.GetName] forderte [AST.GetNameDef] die Abtretung afrikanischer Territorien.\n\n[ENG.GetNameDefCap] ist entschlossen, den eigenen Einfluss in Afrika auszuweiten. Sollten wir uns der australischen Besatzung nicht beugen, werden sie bewaffnet zurückkehren."
 AST_diplomatic_events.56.a: "Um einen Konflikt zu vermeiden, müssen wir die Territorien übergeben."
 AST_diplomatic_events.56.b: "Dann müssen sie wohl bewaffnet zurückkommen."
 AST_diplomatic_events.57.t: "Vichy übergibt afrikanische Territorien"
 AST_diplomatic_events.57.desc: "Vichy-Frankreich stimmte zu, die geforderten afrikanischen Territorien abzutreten und einer australischen Garnison zu gestatten, die Kontrolle über die Region zu übernehmen."
 AST_diplomatic_events.57.a: "Wir werden noch tiefer nach Afrika expandieren!"
 AST_diplomatic_events.58.t: "Vichy verweigert [AST.GetName] Territorium"
 AST_diplomatic_events.58.desc: "Vichy-Frankreich verweigerte die Übergabe afrikanischer Territorien an uns. Offenbar drückten wir uns nicht klar genug aus. Es handelte sich nicht um eine Bitte, sondern um eine Forderung.\n\nWir werden das Territorium zurückerobern, das uns vorenthalten wurde, auch wenn wir zu gewaltsamen Mitteln greifen müssen."
 AST_diplomatic_events.58.a: "Friedlich oder nicht: [AST.GetNameDefCap] wird expandieren."
 #AST_diplomatic_events.59 was removed
 #AST_diplomatic_events.60 was removed
 #AST_diplomatic_events.61 was removed
 AST_diplomatic_events.62.t: "Antibritisches Abkommen?"
 AST_diplomatic_events.62.desc: "[AST.GetAdjective]e Diplomaten unterbreiteten uns das Angebot, ein antibritisches Abkommen zu unterzeichnen. Im Rahmen dieses Abkommens würden sie uns dabei helfen, Nordirland von den Engländern zurückzuerobern, ohne dass wir direkt eingreifen müssten.\n\nSollten sie Erfolg haben, würden wir uns im Gegenzug ihrem Bündnis anschließen und ihnen in einem künftigen Krieg gegen Großbritannien zur Seite stehen.\n\nAuch wenn eine Vereinigung mit dem Norden verlockend ist, müssen wir sorgfältig abwägen, ob wir es uns leisten können, unseren mächtigeren Nachbarn derart zu verärgern, und vor allem, ob wir im Fall eines Konflikts als Sieger hervorgingen und nicht ganz Irland erneut zu einer britischen Kolonie würde."
 AST_diplomatic_events.62.a: "Die Wiedervereinigung kann nicht warten! Unterzeichnen wir das Abkommen!"
 AST_diplomatic_events.62.b: "Das ist viel zu gefährlich."
 AST_diplomatic_events.63.t: "Irland lehnt ab"
 AST_diplomatic_events.63.desc: "Irland weigerte sich, ein antibritisches Abkommen zu unterzeichnen."
 AST_diplomatic_events.63.a: "Dann wird Irland auch weiterhin gespalten sein."
 AST_diplomatic_events.64.t: "Irland akzeptiert"
 AST_diplomatic_events.64.desc: "Irland stimmte zu, das antibritische Abkommen zu unterzeichnen."
 AST_diplomatic_events.64.a: "Auf nach Belfast!"
 AST_diplomatic_events.65.t: "[FROM.GetNameDefCap] bietet Unterstützung" ### Support for the Chinese Communists - Sends event from AST to PRC offering support
 AST_diplomatic_events.65.desc: "Der wachsende Einfluss der [FROM.GetCommunistParty] in [FROM.GetName] trägt endlich Früchte: Wir wurden darüber informiert, dass sich ein [FROM.GetAdjective]er Freiwilligentrupp mobilisiert hat, um unsere Streitkräfte zu unterstützen. Darüber hinaus bringen diese Freiwilligen Ersatzausrüstung mit, die unseren eigenen Truppen zugutekommen wird."
 AST_diplomatic_events.65.a: "Dies ist ein guter Anfang für eine Zusammenarbeit."
 #AST_diplomatic_events.65.b: "They should focus on their own revolution"
 AST_diplomatic_events.66.t: "[FROM.GetNameDefCap] dankt uns für die Unterstützung" ### Support for the Chinese Communists - They accept
 AST_diplomatic_events.66.desc: "Die Abgesandten von [FROM.GetLeader] brachten ihren Dank für die Unterstützung durch unsere Freiwilligen und das bereitgestellte Kriegsmaterial zum Ausdruck. Die weitreichende Erfahrung, die [FROM.GetNameDef] im Bürgerkrieg sammelte, führt hoffentlich dazu, dass sich diese Ressourcen effektiv nutzen lassen."
 AST_diplomatic_events.66.a: "Ein guter erster Schritt."
 AST_diplomatic_events.67.t: "[FROM.GetNameDefCap] dankt uns für die Unterstützung" ### Support for the Chinese Communists - They accept
 AST_diplomatic_events.67.desc: "Die Abgesandten von [FROM.GetLeader] brachten ihren Dank für die Unterstützung durch unsere Freiwilligen und das bereitgestellte Kriegsmaterial zum Ausdruck. Die weitreichende Erfahrung, die [FROM.GetNameDef] im Bürgerkrieg sammelte, führt hoffentlich dazu, dass sich diese Ressourcen effektiv nutzen lassen."
 AST_diplomatic_events.67.a: "Ein guter erster Schritt."
 AST_diplomatic_events.68.t: "Australische Forderungen"
 AST_diplomatic_events.68.desc: "Australien will seinem übermächtigen Feind, [JAP.GetName], nicht allein gegenübertreten. Man drängt uns, den ersten Schritt zu unternehmen und den drohenden Konflikt schnellstmöglich beizulegen."
 AST_diplomatic_events.68.a: "Wie sich das Blatt gewendet hat."
 AST_diplomatic_events.69.t: "Das Band erneuern"
 AST_diplomatic_events.69.desc: "Das Band zwischen [ENG.GetName] und [AST.GetName] wird auf die Probe gestellt, doch letztere Nation ist entschlossen, die einstige Stärke zurückzugewinnen. [AST.GetNameDefCap] verfügt über derart weitreichende Verbindungen und Verbündete innerhalb der britischen Regierung, dass man nicht so einfach weghören kann. Unsere Nationen werden erneut demselben Bündnis angehören und die Inseln und das Down Under erneut zusammenarbeiten."
 AST_diplomatic_events.69.a: "So sei es."
 AST_diplomatic_events.71.t: "Australien fordert Übergabe der Pazifikinseln"
 AST_diplomatic_events.71.desc: "[AST.GetNameDefCap] fordert die Kontrolle über die Pazifikinseln. Man behauptet, der Westpazifik falle nicht unter die Befehlsgewalt der [USA.GetAdjective]en Regierung. Die Inseln mögen ein geringer Preis sein, um die Feindseligkeit der Australier zu besänftigen, aber sie werden dennoch einen Verlust darstellen. Sollen wir es wirklich riskieren, eine aufstrebende faschistische Regionalmacht zu verärgern, wenn wir bereits an anderen Fronten zu kämpfen haben?"
 AST_diplomatic_events.71.a: "Wir sollten sie nicht verärgern."
 AST_diplomatic_events.71.b: "Die Pazifikinseln gehören uns."
 AST_diplomatic_events.72.t: "Übergabe der [USA.GetAdjective]en Pazifikinseln"
 AST_diplomatic_events.72.desc: "Da die [USA.GetAdjective]e Region bereits an anderen Fronten zu kämpfen hat, sah man die Pazifikinseln offenbar als geringen Preis an, um die australische Feindseligkeit zu beschwichtigen. Die Pazifikinseln gehören nun uns."
 AST_diplomatic_events.72.a: "Ausgezeichnet."
 AST_diplomatic_events.73.t: "[USA.GetNameDefCap] lehnt ab"
 AST_diplomatic_events.73.desc: "[USA.GetNameDefCap] weigerte sich, die Pazifikinseln an uns abzutreten. Trotz unserer Forderung und unseres wachsenden Einflusses im Pazifik ist Washington offenbar nicht gewillt, die Kontrolle an uns abzugeben."
 AST_diplomatic_events.73.a: "Im Moment mögen uns die Inseln zwar noch nicht gehören ..."
 AST_diplomatic_events.74.t: "Australien fordert Übergabe der Philippinen"
 AST_diplomatic_events.74.desc: "In dem Bestreben, das eigene Territorium zu erweitern, forderte [AST.GetNameDef] die Kontrolle über [PHI.GetName]. Sollten wir uns weigern, droht [AST.GetNameDef] mit Krieg und begründet dies damit, dass es schlichtweg undenkbar sei, dass [USA.GetName] Territorien innerhalb der [AST.GetAdjective]en Einflusssphäre halte."
 AST_diplomatic_events.74.a: "Wir können keinen Krieg riskieren. Kommen wir der Forderung nach."
 AST_diplomatic_events.74.b: "Die Philippinen gehören uns!"
 AST_diplomatic_events.75.t: "Übergabe von [PHI.GetName]"
 AST_diplomatic_events.75.desc: "Es ist offensichtlich, dass der [AST.GetAdjective]e Aufstieg als faschistische Regionalmacht gerechtfertigt war, wenn uns andere Nationen so sehr fürchten. [USA.GetNameDefCap] stimmte zu, [PHI.GetName] an uns zu übergeben."
 AST_diplomatic_events.75.a: "Eine neue Ordnung entsteht."
 AST_diplomatic_events.76.t: "[USA.GetNameDefCap] lehnt ab"
 AST_diplomatic_events.76.desc: "[USA.GetNameDefCap] weigerte sich, [PHI.GetName] an uns abzutreten. Trotz unserer Forderung und unseres wachsenden Einflusses im Pazifik ist Washington offenbar nicht gewillt, die Kontrolle an uns abzugeben."
 AST_diplomatic_events.76.a: "Das bedeutet Krieg!"
 AST_diplomatic_events.78.t: "[AST.GetNameDefCap] bittet um Garantie gegen den Riesen"
 AST_diplomatic_events.78.desc: "[AST.GetNameDefCap] teilte uns seine ehrgeizigen Ziele mit.\n\n[USA.GetNameDefCap] wirft einen riesigen Schatten und droht mit einem Eingreifen, sobald unser Handeln nicht mit den eigenen Interessen übereinstimmt. Solange sich eine Weltmacht dieser Größenordnung in die Angelegenheiten von Australien und Japan einmischt, wird uns Ostasien niemals wirklich gehören. [AST.GetNameDefCap] muss in den Krieg ziehen!\n\nPremierminister [AST.GetLeader] machte seine Absichten klar: [AST.GetNameDefCap] plant, sich mit dem [USA.GetAdjective]en Riesen anzulegen, und bittet um Hilfe, falls dieser sich als zu mächtig erweisen sollte."
 AST_diplomatic_events.78.a: "Sie haben unsere Garantie."
 AST_diplomatic_events.78.b: "[JAP.GetNameDefCap] muss sich um seine eigenen Angelegenheiten kümmern."
 AST_diplomatic_events.79.t: "[JAP.GetNameDefCap] spricht eine Garantie für [AST.GetName] aus"
 AST_diplomatic_events.79.desc: "Es ist nicht nur uns klar, dass die [USA.GetAdjective]e Einmischung in die asiatische und ozeanische Diplomatie nicht gewünscht und inakzeptabel ist. [JAP.GetNameDefCap] stimmte zu, uns eine Garantie auszusprechen. Wir können damit unser Banner gegen unsere Feinde erheben, in dem Wissen, dass uns ein Verbündeter zu Hilfe kommen wird, sollte sich die Übermacht der Amerikaner als zu groß erweisen."
 AST_diplomatic_events.79.a: "Wir marschieren in den Krieg."
 AST_diplomatic_events.80.t: "[JAP.GetNameDefCap] gibt uns keine Garantie"
 AST_diplomatic_events.80.desc: "Die [USA.GetAdjective]e Einmischung in die asiatische und ozeanische Diplomatie ist nicht gewünscht und inakzeptabel, doch offenbar ist das nur uns klar. [JAP.GetNameDefCap] weigerte sich, uns eine Garantie auszusprechen, und zwingt uns praktisch dazu, es ohne sie mit unseren gemeinsamen Feinden aufzunehmen."
 AST_diplomatic_events.80.a: "Und das werden wir auch."
 AST_diplomatic_events.81.t: "Ein bezauberndes Symbol der Einheit"
 AST_diplomatic_events.81.desc: "Das Interesse des britischen Premierministers an Tieren ist kaum jemandem entgangen, und seine Sammlung ist ziemlich beeindruckend. Jeder Neuzugang wird gewiss geschätzt, aber ein exotischer Neuzugang umso mehr.\n\n[ENG.GetLeader] höchstpersönlich bekundete Interesse am australischen Schnabeltier, und obwohl dessen Export derzeit aufgrund der Gesundheitsrisiken verboten ist, könnte es sich lohnen, eine Ausnahme zu machen.\n\nSollen wir dem Wunsch des Premierministers als Zeichen der Einheit entsprechen?"
 AST_diplomatic_events.81.a: "[ENG.GetLeader] soll sein Schnabeltier bekommen."
 AST_diplomatic_events.81.b: "Das Ausfuhrverbot darf nicht aufgehoben werden, nicht einmal für den Premierminister."
 AST_diplomatic_events.82.t: "Ein beunruhigender Bericht von [ENG.GetLeader]"
 AST_diplomatic_events.82.desc: "Das Schiff, das vor sechs Wochen mit einem kompletten Gehege für ein Schnabeltier an Bord aus dem Hafen von Melbourne ausgelaufen war, erreichte heute das [ENG.GetAdjective]e Festland. Die Ankunft des Schiffes bot jedoch keinen Anlass zur Freude, da das Tier bei der Überfahrt verstorben war. [ENG.GetLeader] trauert um den Verlust seines Haustiers, das er in freudiger Erwartung sogar nach sich selbst benannt hatte, und macht seine Feinde für dessen Tod verantwortlich. Er gibt an, die Explosionen eines U-Boot-Angriffs hätten das Schnabeltier zu Tode erschreckt.\n\nDas Logbuch des Schnabeltier-Pflegers deutet jedoch auf eine andere wahrscheinliche Todesursache hin: Die Wasser- und Lufttemperaturen des Schnabeltiergeheges an Bord des Schiffs lagen weit über den zulässigen Grenzwerten.\n\nWas auch immer vorgefallen sein mag: [ENG.GetLeader], das Schnabeltier, ist tot, und der britische Premierminister bleibt weiterhin schnabeltierlos."
 AST_diplomatic_events.82.a: "Das sind in der Tat traurige Neuigkeiten."
 AST_political_events.1.t: "Referendum fordern"
 AST_political_events.1.desc: "Es gibt zwei Bereiche, in denen wir als Regierung eine stärkere Kontrolle anstreben: Luftfahrt und Absatzwirtschaft.\n\nIm Bereich der Luftfahrt muss die Verfassung so geändert werden, dass das Parlament des Commonwealth dazu befugt ist, Gesetze in Bezug auf die Luftfahrt und Luftfahrzeuge zu erlassen.\n\nIm Bereich der Absatzwirtschaft soll eine Zusammenarbeit zwischen dem Commonwealth und den Staaten gefördert werden, die derzeit verfassungsrechtlich nicht möglich ist.\n\nFür welchen Bereich sollen wir ein Referendum abhalten?"
 AST_political_events.1.a: "Die Luftfahrt, damit wir den Luftraum über [AST.GetName] sichern können."
 AST_political_events.1.a.tt: "Sobald die Reform verabschiedet wird:\n Erhält §YLuftfahrtreform verabschiedet§!, was folgende Auswirkungen hat:\n Luft-Forschungstempo: §G+15%§!\n Baugeschwindigkeit §Y(Luftstützpunkte)§!: §G+5.00%§!"
 AST_political_events.1.b: "Die Absatzwirtschaft zur Koordinierung landesweiter Vermarktungsprogramme für landwirtschaftliche Erzeugnisse."
 AST_political_events.1.b.tt: "Sobald die Reform verabschiedet wird:\n Erhält §YAbsatzwirtschaftsreform verabschiedet§!, was folgende Auswirkungen hat:\n Konsumgüterfabrikenfaktor: §Y-10.0%§!"
 AST_political_events.2.t: "Referendum erfolgreich"
 AST_political_events.2.desc.a: "Das Volk stimmte der Umsetzung unserer Luftfahrtreform zu. Da es zum Zeitpunkt der Ausarbeitung der australischen Verfassung noch keine Flugzeuge gab, ist es nur angemessen, dass die Regierung nun endlich die Verantwortung für die Sicherung und Regulierung des Flugverkehrs übernimmt."
 AST_political_events.2.desc.b: "Das Volk stimmte der Umsetzung unserer Absatzwirtschaftsreform zu. Da die Regierung nun dazu befugt ist, landwirtschaftliche Erzeugnisse zu regulieren und zu vermarkten, konnten sich die Märkte stabilisieren und die verschiedenen Staaten ihre Zusammenarbeit vertiefen. Die Einnahmen der Landwirte werden stabiler, ebenso wie die Volkswirtschaft."
 AST_political_events.2.a: "Die Kontrolle durch den Bund muss ausgeweitet werden!"
 AST_political_events.4.t: "Der Premierminister ist verstorben"
 AST_political_events.4.desc: "Die [AST.GetAdjective]e Führung steht bereits seit längerer Zeit wegen der Kriegsvorbereitungen unter Druck, und nun forderte die Belastung ihr schwerstes Opfer: Der Premierminister verstarb an einem Herzinfarkt.\n\nAngesichts der aktuellen Weltlage werden wir seine Führungsstärke schmerzlich vermissen. Dennoch wird Australien weitermachen, mit einem neuen Anführer an der Spitze: [AST.GetLeader]."
 AST_political_events.4.a: "Das ist eine nationale Tragödie."
 AST_political_events.5.t: "Die australische Regierung greift hart durch"
 AST_political_events.5.desc: "Unter dem Namen „Australia First“ bildete sich eine Bewegung, die sich offen gegen die derzeitige politische Richtung des Landes stellt. Die Regierung befürchtet, dass ihre Absichten möglicherweise nicht ganz demokratisch sind, und beschloss, die Gruppe sowie ihre Mitglieder unter Beobachtung zu stellen. Die Einmischung der Demokraten hindert uns daran, uns zu organisieren und neue Mitglieder anzuwerben."
 AST_political_events.5.a: "Nur die Zeit wird zeigen, worum es bei dieser Bewegung wirklich geht."
 AST_political_events.6.t: "Das 150-jährige Jubiläum von 1938"
 AST_political_events.6.desc: "Heute Vormittag, während die Feierlichkeiten zum 150-jährigen Jubiläum der Erstbesiedlung Australiens stattfanden und der Festzug „Australiens Weg zur nationalen Selbstbestimmung“ durch die Hauptstraßen Sydneys zog, fand vor der Australia Hall eine Protestkundgebung statt.\n\nAktivisten, die sich für die Rechte der Ureinwohner einsetzen, versammelten sich, um darauf aufmerksam zu machen, dass der 150. Jahrestag nicht nur den Beginn der britischen Kolonialisierung markierte, sondern auch die verfassungsmäßige Diskriminierung der Ureinwohner. Die Aktivisten fordern neue Gesetze, die sicherstellen, dass die Ureinwohner Bildung erhalten können und geschützt werden, sowie eine neue Politik, um die indigenen Völkern in den Status vollwertiger Bürger zu erheben."
 AST_political_events.6.a: "Wir müssen Maßnahmen ergreifen."
 AST_political_events.7.t: "Druck durch das Königshaus"
 AST_political_events.7.desc: "Angesichts der jüngsten Entwicklung lässt sich nicht mehr leugnen, dass sich die australische Politik im Wandel befindet. [ENG.GetNameDefCap] unternahm diplomatische Schritte, um sicherzustellen, dass [AST.GetNameDef] auf einem Kurs bleibt, der einer Nation unter dem Commonwealth angemessen ist. Man hofft, ein sanfter Anstoß in die richtige Richtung reicht aus, um die Loyalität ihres Dominions zu bewahren."
 AST_political_events.7.a: "Trotz der britischen Bemühungen wird [AST.GetNameDef] einen eigenen Weg einschlagen."
 AST_political_events.8.t: "Es droht Krieg"
 AST_political_events.8.desc: "$AST_war_is_coming_cat_desc$"
 AST_political_events.8.a: "Wir müssen uns vorbereiten."
 AST_political_events.9.t: "Der Dalfram-Arbeiterkonflikt"
 AST_political_events.9.desc: "Was als Streit um die Verladung von Roheisen begann, entwickelte sich zu etwas weitaus Größerem. Überall in Australien legen Arbeiter aus Solidarität die Arbeit nieder und widersetzen sich damit sowohl der Regierung als auch der Industrie. Da sich die Streiks immer weiter ausbreiten und die Spannungen beständig wachsen, wurde die derzeitige Regierungsführung zum Rücktritt aufgefordert, und da sie es nicht schaffte, die Lage unter Kontrolle zu bringen, tat sie genau das und überließ es der [AST.GetCommunistParty], den Posten der Regierungspartei für sich zu beanspruchen."
 AST_political_events.9.a: "Und wir werden ihn beanspruchen."
 AST_canberra_air_disaster_events.1.t: "Flugzeugabsturz in Canberra"
 AST_canberra_air_disaster_events.1.desc: "Heute Vormittag stürzte eine Lockheed Hudson bei dem Landeanflug auf Canberra ab. Unter den zehn Personen an Bord befanden sich der Stabschef der Armee und seine Mitarbeiter, die auf dem Weg zu einer Kabinettssitzung waren. Sie alle kamen zusammen mit der Flugbesatzung auf tragische Weise ums Leben.\n\nDie Ursache für den Absturz ist ungewiss. Die Wetterbedingungen waren ideal für einen Flug, und das Flugzeug wurde von dem erfahrenen RAAF-Offizier Robert Hitchcock gesteuert.\n\nDies ist ein schrecklicher Tag für die ganze Nation - nicht zuletzt für die Familien und Freunde der Opfer. Ganz Australien richtet den Blick nun auf seine politischen Führer. Wie werden sie reagieren?"
 AST_canberra_air_disaster_events.1.a: "Ein schrecklich tragisches Ereignis."
 AST_canberra_air_disaster_events.1.a.tt: "Schaltet die Entscheidungen §YKabinettsvertrauen§! und eine §YMission§! frei, um die amtierende Regierung zu retten oder abzusetzen."
 AST_canberra_air_disaster_events.2.t: "Die [AST.GetRulingParty] setzte sich durch"
 AST_canberra_air_disaster_events.2.desc: "Die amtierende Regierung führte Australien erfolgreich durch eine Zeit der Unruhe, die auf die Flugzeugkatastrophe von Canberra folgte. Die [AST.GetRulingParty] stellte in diesen schwierigen Zeiten ihre Zuverlässigkeit und Stärke unter Beweis und sicherte sich damit letztlich die Unterstützung der Bevölkerung."
 AST_canberra_air_disaster_events.2.a: "Blicken wir in die Zukunft."
 AST_canberra_air_disaster_events.3.t: "Misstrauensvotum"
 AST_canberra_air_disaster_events.3.desc: "Das Misstrauensvotum war erfolgreich, und die amtierende Regierung übergab die Zügel widerwillig an ihre Nachfolger. Nach einer langen Zeit der politischen Instabilität und des öffentlichen Misstrauens ist Australien endlich bereit für einen Neuanfang."
 AST_canberra_air_disaster_events.3.a: "Eine neue Führung kommt Australien zu Hilfe."
 AST_canberra_air_disaster_events.4.t: "Führungswechsel"
 AST_canberra_air_disaster_events.4.desc: "Nach einer langen Zeit der politischen Instabilität und des öffentlichen Misstrauens wechselte die [AST.GetRulingParty] die Führung aus. Mit großer Mehrheit wurde für den Rücktritt des amtierenden Premierministers gestimmt, und sein Nachfolger hat bereits begonnen, das Vertrauen wiederherzustellen."
 AST_canberra_air_disaster_events.4.a: "Hoffentlich ebnet dies den Weg für Australien."
 AST_canberra_air_disaster_events.5.t: "Australische Anschuldigungen"
 AST_canberra_air_disaster_events.5.desc: "Die [AST.GetAdjective]e Führung bezichtigte uns in einer öffentlichen Pressekonferenz, für einen kürzlich auf australischem Boden verunglückten Flugzeugabsturz verantwortlich zu sein, bei dem mehrere Politiker ums Leben kamen.\n\nDie Vorwürfe sind natürlich völlig haltlos und lassen die Respektlosigkeit dadurch nur umso bösartiger erscheinen."
 AST_canberra_air_disaster_events.5.a: "Die Behauptungen sind falsch. Wir müssen nichts unternehmen."
 AST_canberra_air_disaster_events.5.b: "Das werden wir nicht so einfach auf uns sitzen lassen."
 AST_canberra_air_disaster_events.6.t: "[JAP.GetNameDefCap] übt Vergeltung"
 AST_canberra_air_disaster_events.6.desc: "[JAP.GetNameDefCap] wies die Vorwürfe entschieden zurück und wertete sie als ersten Akt der Aggression. [JAP.GetLeader] ließ die Angelegenheit eskalieren und erklärt, es sei das gute Recht der Japaner, in unser Land einzumarschieren."
 AST_canberra_air_disaster_events.6.a: "Wir sollten die Spannungen nicht weiter verschärfen."
 AST_canberra_air_disaster_events.6.b: "Das darf nicht unbeantwortet bleiben."
 INS_limited_war_events.1.t: "Malaya muss vernichtet werden!"
 INS_limited_war_events.1.desc: "Die feindlichen Linien sind durchbrochen, und unsere Truppen können ungehindert vorrücken. Auf der anderen Seite der Meerenge bricht der britische Vasallenstaat unter der Last des Widerstands zusammen. Die Marionetten Londons glaubten, ihre Bajonette würden sie vor der Geschichte schützen, doch sie lagen falsch."
 INS_limited_war_events.1.a: "Merdeka!"
 INS_limited_war_events.1.b: "Ein guter Tag für die Republik."
 INS_limited_war_events.2.t: "[FROM.GetAdjective]er Gegenschlag"
 INS_limited_war_events.2.desc: "Was ein entschiedener Schlag gegen das Marionettenregime sein sollte, ist gescheitert. Den [FROM.GetAdjective]en Truppen gelang es dank ihrer imperialen Geldgeber, uns aus dem umkämpften Gebiet zu vertreiben und es zu besetzen. Tag für Tag übermittelt der Rundfunk ihr Triumphgebaren. Ein erneuter Vorstoß könnte in einer weiteren Demütigung enden, doch ein Rückzug käme einem Eingeständnis der Niederlage vor dem gesamten Archipel gleich."
 INS_limited_war_events.2.a: "Ziehen wir uns zurück, um das zu retten, was wir noch haben."
 INS_limited_war_events.2.b: "Wir werden nicht nachgeben!"
 INS_limited_war_events.3.t: "[FROM.GetNameDefCap] beugt sich der Republik"
 INS_limited_war_events.3.desc: "Uns erreichten Neuigkeiten aus Kuala Lumpur: Die Marionettenregierung, die in der entscheidenden Stunde von ihren Herren in London im Stich gelassen wurde, akzeptierte unsere Bedingungen, anstatt dabei zuzusehen, wie ihre Städte in Flammen aufgehen. Die umstrittenen Territorien gehören nun uns. Dies wird auch bei den übrigen Vasallenstaaten nicht unbemerkt bleiben."
 INS_limited_war_events.3.a: "Indonesien erhebt sich."
 INS_limited_war_events.4.t: "[FROM.GetNameDefCap] lehnt unsere Bedingungen ab"
 INS_limited_war_events.4.desc: "[FROM.GetNameDefCap] wies unser Angebot entschieden zurück. Die Marionettenminister, die aus einem in der Whitehall verfassten Skript vorlasen, erklärten, dass kein Zentimeter Boden aufgegeben werde und dass die Republik selbst in die Knie gezwungen werden müsse, bevor die Waffen schweigen."
 INS_limited_war_events.4.a: "Die Waffen werden für sich sprechen."
 INS_limited_war_events.5.t: "[FROM.GetNameDefCap] wünscht unseren Untergang"
 INS_limited_war_events.5.desc: "[FROM.GetNameDefCap] legte den letzten Anschein eines begrenzten Krieges ab. In Rundfunkübertragungen spricht man nun offen davon, die Republik zu zerschlagen und die Inseln unter den alten Kolonialmächten aufzuteilen. Diese Angelegenheit wird kein friedliches Ende nehmen. Entweder steht Indonesien am Ende dieses Konflikts noch oder es steht gar nicht mehr."
 INS_limited_war_events.5.a: "Wir bleiben standhaft oder gehen gemeinsam unter."
 INS_limited_war_events.6.t: "Der [FROM.GetAdjective]e Vormarsch gerät ins Stocken"
 INS_limited_war_events.6.desc: "Der [FROM.GetAdjective]e Vormarsch traf uns völlig unvorbereitet, und eine Zeit lang befürchteten wir das Schlimmste. Doch der Vormarsch ist ins Stocken geraten. Ihre Truppen sind erschöpft, ihre Front ist riesig und das Gerede aus London verliert mit jeder Mitteilung an Nachdruck. Die Republik könnte sich großmütig zeigen und den Marionetten einen Ausweg bieten, auch wenn viele sagen würden, dass ein entscheidender Sieg der Sache besser diene als ein maßvoller."
 INS_limited_war_events.6.a: "Diktieren wir ihnen unsere Bedingungen."
 INS_limited_war_events.6.b: "Keine Gnade für Marionettenstaaten."
 INS_limited_war_events.7.t: "Unsere Offensive kommt zum Stillstand"
 INS_limited_war_events.7.desc: "Unser Vormarsch ist ins Stocken geraten. Schlimmer noch: Unser Feind weiß davon und ließ uns von jenseits der Meerenge eine Forderung zukommen. Wir sollen die Waffen niederlegen und seine Bedingungen akzeptieren oder dabei zusehen, wie die Todeszahlen in die Höhe schnellen, ohne dass sich am Ergebnis etwas ändert. Die einzige Wahl, die wir haben, ist, darüber zu entscheiden, wie groß die Beerdigung sein soll."
 INS_limited_war_events.7.a: "Lieber ein demütigender Frieden als ein noch schlimmerer Krieg."
 INS_limited_war_events.7.b: "Die Republik wird niemals kapitulieren."
 INS_limited_war_events.8.t: "[FROM.GetNameDefCap] beugt sich nicht"
 INS_limited_war_events.8.desc: "[FROM.GetNameDefCap] antwortete mit einer Trotzhaltung auf unser Angebot, und ihre Minister verkündeten, dass sie lieber dabei zusehen, wie jedes Kampong von Penang bis Johor in Schutt und Asche gelegt wird, als der Republik auch nur das geringste Zugeständnis zu machen. Der Krieg geht weiter."
 INS_limited_war_events.8.a: "Dann sei es so."
 INS_limited_war_events.9.t: "[FROM.GetNameDefCap] will die Republik zerstören!"
 INS_limited_war_events.9.desc: "Abgefangene Funkmeldungen des feindlichen Oberkommandos bestätigten unsere schlimmsten Befürchtungen: Es wird keine Einigung geben, keinen begrenzten Frieden, keine Rückkehr zu den Fronten, die wir zuvor hielten. Die Marionetten und ihre Herren in London fordern die bedingungslose Kapitulation der Republik. Indonesien soll gebrochen und seine Inseln an den imperialistischen Stiefel zurückgegeben werden. Es gibt nur eine mögliche Antwort darauf ..."
 INS_limited_war_events.9.a: "Indonesien wird standhaft bleiben!"
 ### AST - Union Control Events ###
 AST_union_control_events.1.t: "Spione in unseren Gewerkschaften"
 AST_union_control_events.1.desc: "Wir erhielten eine erschreckende Nachricht von unserem Geheimdienst. Australische kommunistische Aktivisten nahmen Kontakt zu lokalen Gewerkschaftsführern auf, verteilten radikale Flugblätter und ermutigten Arbeiter dazu, sich nach revolutionären Prinzipien zu organisieren. Die Bewegung ist derzeit noch klein, doch die Staatssicherheit warnt davor, dass eine Revolution genau so beginnt. Wir müssen eine Entscheidung treffen, bevor die Situation außer Kontrolle gerät."
 AST_union_control_events.1.a: "Behaltet sie im Auge. Wir beobachten die Lage und warten ab."
 AST_union_control_events.4.t: "Kommunistische Infiltratoren übernehmen [MAL.GetAdjective]es Territorium"
 AST_union_control_events.4.desc: "Der Regierung liegt eine schockierende Nachricht vor: Einer unserer Staaten wurde eingenommen und zum Teil der Revolutionsregierung erklärt. Da der Angriff schnell und koordiniert vonstatten ging, wirft dies einige beunruhigende Fragen auf. Unser Geheimdienst vermutet, dass die Aufständischen nicht allein handelten und eine fremde Macht sie möglicherweise zu unseren Küsten führte. Diejenigen, die noch vor der Übernahme fliehen konnten, werden jedoch nicht kapitulieren. Sie haben sich neu formiert und zu den Waffen gegriffen, um das zurückzuerobern, was man ihnen raubte."
 AST_union_control_events.4.a: "Findet heraus, wer dahinter steckt. Sie werden diese Stellung nicht halten können."
 AST_union_control_events.4.a.tt: "Die antikommunistischen Milizen schlossen sich zusammen, um der kommunistischen Besatzung Widerstand zu leisten."
 AST_union_control_events.5.t: "Die [MAL.GetAdjective]e Katastrophe"
 AST_union_control_events.5.desc: "Der Einsatz war eine totale Katastrophe. Unsere Truppen schafften es nicht einmal ans Land. Sie wurden von Patrouillen der Loyalisten zurückgedrängt und sind entweder in der Meerenge verschollen oder wurden gefangen genommen. Die Einzelheiten sind unklar, das Ergebnis jedoch nicht. Als wäre das nicht schon schlimm genug, bekam die Presse auch noch Wind von dieser Angelegenheit. Im Parlament wurde die Frage gestellt, was genau unsere Truppen in diesen Gewässern zu suchen hatten, und die Öffentlichkeit reagierte mit Entsetzen auf unseren Vormarsch. Was auch immer wir für die Revolution zu gewinnen hofften: Wir werden nun einen anderen Weg einschlagen müssen."
 AST_union_control_events.5.a: "Ein schrecklicher Rückschlag. Wir müssen einen anderen Weg finden, um unsere Genossen zu unterstützen."
 AST_union_control_events.3.t: "In [MAL.GetNonIdeologyName] ist die Revolution ausgebrochen"
 AST_union_control_events.3.desc: "Die [MAL.GetAdjective]en Arbeiter haben sich erhoben, und kommunistische Zellen, die wir im Lauf der Jahre im ganzen Land aufbauten, verteilen Waffen. Die Lage vor Ort ist jedoch besorgniserregend. Die Revolutionäre versammelten sich in den falschen Territorien und sind durch Wasser und Dschungel vom Kern der Halbinsel abgeschnitten. Ohne einen Brückenkopf auf dem Festland wird die Regierung einfach abwarten und die Revolution aushungern, bevor sie sich weiter ausbreiten kann. Australien muss schnell und im Verborgenen handeln. Wir müssen Soldaten auf der Halbinsel absetzen, um der Revolution den nötigen Boden zu verschaffen, den sie zum Überleben braucht."
 AST_union_control_events.3.a: "Wir dürfen nicht zulassen, dass die Revolution bereits bei der Landung scheitert."
 AST_union_control_events.2.t: "[AST.GetNameDefCap] unterstützt Aufwiegler auf unseren Straßen"
 AST_union_control_events.2.desc: "Agenten der australischen kommunistischen Regierung sind in unseren Städten eingetroffen. Sie verteilen offen Flugblätter an unseren Fabriken und halten Reden an öffentlichen Plätzen, um Verbindungen zu lokalen radikalen Gruppen aufzubauen. Es handelt sich um eine koordinierte Kampagne, und die Regierung muss entscheiden, wie sie darauf reagieren will, bevor die Unzufriedenheit in der Bevölkerung zu einem Problem wird."
 AST_union_control_events.2.b: "Eine beunruhigende Entwicklung."
 ###########################
 ##### ABDACOM EVENTS ######
 ###########################
 ABDA_events.1.t: "Einladung zu einem neuen Oberkommando"
 ABDA_events.1.desc: "[FROM.GetNameDefCap] schuf ein gemeinsames Oberkommando für den Pazifkschauplatz und lud uns ein, diesem beizutreten. Die als ABDACOM bezeichnete Initiative hat zum Ziel, die Marine-, Luft- und Bodentruppen aller Nationen, die in der Region operieren, unter einer einheitlichen Befehlsstruktur zu vereinen. Eine Mitgliedschaft würde eine engere Zusammenarbeit mit der [FROM.GetAdjective]en Regierung und den anderen Partnern bedeuten, die sich bereits dazu verpflichteten. Wir müssen entscheiden, ob wir das Angebot annehmen."
 ABDA_events.1.a: "Wir stehen Seite an Seite."
 ABDA_events.1.b: "Wir können uns angesichts der derzeitigen Lage nicht dazu verpflichten."
 ABDA_events.2.t: "[FROM.GetNameDefCap] tritt ABDACOM bei"
 ABDA_events.2.desc: "[FROM.GetNameDefCap] akzeptierte unsere Einladung zum Oberkommando der ABDACOM. Ihre Truppen operieren nun unter der gemeinsamen Befehlsstruktur und stärken damit unsere Position auf dem Pazifkschauplatz."
 ABDA_events.2.a: "Eine willkommene Entwicklung."
 ABDA_events.3.t: "[FROM.GetNameDefCap] lehnt Beitritt ab"
 ABDA_events.3.desc: "[FROM.GetNameDefCap] lehnte einen Beitritt zum Oberkommando der ABDACOM ab. Ihre Truppen werden sich nicht unseren gemeinsamen Bemühungen anschließen, aber die Tür ist stets für sie geöffnet."
 ABDA_events.3.a: "Bedauerlich, aber zur Kenntnis genommen."
 ABDA_events.5.t: "Einladung zur ABDACOM"
 ABDA_events.5.desc: "[FROM.GetNameDefCap] lud uns ein, uns dem amerikanisch-britisch-niederländisch-australischen Kommando anzuschließen. ABDACOM etablierte sich bereits als Oberkommando für die alliierten Streitkräfte im Pazifikraum und vereint die Marine- und Heereskräfte der wichtigsten Alliierten unter einem Kommando. Eine Mitgliedschaft würde unsere Streitkräfte in diese einheitliche Struktur einbinden und uns Zugang zu gemeinsamen Geheimdienstinformationen, einer koordinierten Doktrin und der vollen Unterstützung der Alliierten verschaffen. Wir müssen eine Entscheidung treffen."
 ABDA_events.5.a: "Wir stehen Seite an Seite."
 ABDA_events.5.b: "Wir können uns angesichts der derzeitigen Lage nicht dazu verpflichten."
 ABDA_events.4.t: "Die Verteidigung Singapurs"
 ABDA_events.4.desc: "Da Singapur als Dreh- und Angelpunkt des Verteidigungsperimeters der ABDACOM vorgesehen ist, müssen unsere Befehlshaber entscheiden, in welche Befestigungen wir investieren sollen. Wir können den Schwerpunkt auf das Meer und die Hafenverteidigungen legen, die landseitigen Zugänge befestigen oder unsere Ressourcen aufteilen. Jede dieser Entscheidungen bestimmt mit darüber, wie Singapur im Fall eines Angriffs verteidigt wird."
 ABDA_events.4.a: "Singapurs Stärke liegt im Hafen. Bereiten wir uns auf einen Angriff vom Meer aus vor."
 ABDA_events.4.b: "Wir müssen die landseitigen Zugänge befestigen, über die die wahre Bedrohung einmarschieren wird."
 ABDA_events.4.c: "Ein ausgewogener Ansatz wird nichts unverteidigt lassen."
 ABDA_fortress_singapore_choice_tt: "Diesen Schwerpunkt abzuschließen, wird uns vor die Wahl stellen, wie Singapur befestigt werden soll."
 ABDA_faction_membership_requirement_tt: "Gültige Bündnismitglieder erhalten eine Einladung, ebenfalls beizutreten."
