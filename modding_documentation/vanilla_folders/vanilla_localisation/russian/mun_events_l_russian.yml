l_russian:
 ##CZECHOSLOVAKIA##
 MUN_czech_skoda_priority.t: "«Шкода»"
 MUN_czech_skoda_priority.d: "Компания «Шкода» производит широкий спектр продукции от артиллерии до танков, поездов и корабельных орудий. Это позволило сделать производство гибким и получить возможность перераспределять ресурсы в зависимости от спроса, который мы теперь можем частично регулировать."
 MUN_czech_skoda_priority.1.a: "Любопытно"
 MUN_czech.2.t.1: "Судетские военизированные группы обращаются за помощью"
 MUN_czech.2.t.2: "Судетский добровольческий корпус обращается за помощью"
 MUN_czech.2.t.3: "Судетское рабочее ополчение обращается за помощью"
 MUN_czech.2.d.1: "В свете недавних новостей о наших планах на [CZE.GetNameRuAcc] многие судетские политические партии быстро сформировали военизированные группы в разных уголках Судет в надежде подорвать авторитет [CZE.GetAdjRuLower]их властей. Теперь эти формирования обращаются к нам за поддержкой в проведении пограничных рейдов и актов саботажа, чтобы помочь нам противостоять [CZE.GetNameRuDat]."
 MUN_czech.2.d.2: "В свете недавних новостей о наших планах на [CZE.GetNameRuAcc] судетские политические партии быстро мобилизовали вооруженное формирование — Судетский добровольческий корпус. Собравшись в группы, его бойцы начали атаковать объекты, находящиеся в собственности [CZE.GetAdjRuLower]их властей в Судетах. Теперь они обращаются к нам за помощью в проведении пограничных рейдов и актов саботажа против [CZE.GetNameRuGen]."
 MUN_czech.2.d.3: "В свете недавних новостей о наших планах на [CZE.GetNameRuAcc] местные коммунистические партии быстро мобилизовали рабочее ополчение. Собравшись в группы, ополченцы начали атаковать объекты, находящиеся в собственности [CZE.GetAdjRuLower]их властей в Судетах. Теперь они обращаются к нам за помощью в проведении пограничных рейдов и актов саботажа против [CZE.GetNameRuGen] и других контрреволюционеров."
 MUN_czech.2.a: "Конечно, мы поможем"
 MUN_czech.2.b: "Вероятно, лучше им не содействовать"
 MUN_czech.3.t: "Судетское партизанское движение"
 MUN_czech.3.d: "После появления новостей о намерении [FROM.GetNameRuGen] аннексировать Судетскую область судетские вооруженные формирования развернули против нас партизанскую войну, начали атаковать правительственные здания и разрушать укрепления в некоторых регионах. Нам необходимо разобраться с ополченцами, чтобы улучшить наше положение."
 MUN_czech.3.a: "Может ли быть еще хуже?"
 MUN_czech.4.t: "Кризис доверия"
 MUN_czech.4.d: "Недавние новости о военной агрессии против нас стали серьезным ударом для властей. [CZE.GetLeader] сомневается, что сможет вывести страну из затруднительного положения. Он потребовал, чтобы $CZE_jan_syrovy$ взял ситуацию под контроль и возглавил правительство. $CZE_jan_syrovy$ в свою очередь заявил, что у него нет желания соглашаться, на что [CZE.GetLeader] ответил, что у того нет иного выбора, кроме как взять на себя управление и вывести страну из кризиса."
 MUN_czech.4.a: "Вы нужны нам как никогда."
 MUN_czech.4.b: "Нельзя терять голову."
 MUN_czech.5.t: "Кончина Томаша Масарика"
 MUN_czech.5.d: "Масарик был стабилизирующей фигурой в политике Чехословакии на протяжении более двух десятилетий. Когда в появление коалиций и выход из политических тупиков почти никто не верил, Масарик раз за разом совершал политические чудеса, помогая укрепить Чехословакию и сделать ее такой, какой мы видим ее сегодня. Его смерть станет большой потерей для всей страны."
 MUN_czech.5.a: "Незаменимый политический гигант."
 MUN_czech.7.t: "Пересмотр поддержки [CZE.GetNameRuGen]"
 MUN_czech.7.d: "Недавно до нас дошли известия о том, что [GER.GetNameDef] жела[GER.GetNameEndRuPresentEtYut] аннексировать Судеты и даже рассматрива[GER.GetNameEndRuPresentEtYut] возможность войны с [CZE.GetNameRuInst] ради достижения этой цели. В настоящий момент между нами и [CZE.GetNameRuInst] заключен оборонительный пакт, а это значит, что в случае войны с [GER.GetNameRuInst] мы должны будем оказать помощь. Если мы хотим избежать подобной ситуации, нужно немедленно расторгнуть договор с [CZE.GetNameRuInst]."
 MUN_czech.7.a: "Мы поддержим наших друзей."
 MUN_czech.7.b: "Против [GER.GetNameRuGen] у нас нет ни шанса!"
 MUN_czech.1001.t: "[FROM.GetNameDefCap] требу[FROM.GetNameEndRuPresentEtYut] открыть коридор в [SOV.GetNameRuAcc]"
 MUN_czech.1001.d: "В надежде скоординировать военные действия [FROM.GetNameDef] требу[FROM.GetNameEndRuPresentEtYut] уступить [SOV.GetNameRuDat] пограничные регионы [89.GetName] и [91.GetName]."
 MUN_czech.1002.t: "[FROM.GetNameDefCap] собира[FROM.GetNameEndRuPresentEtYut]ся расширить свое влияние на югославскую лигу"
 MUN_czech.1002.d: "После своего продвижения на юг [FROM.GetName] выдвинул[FROM.GetNameRuEndPast] необычное требование: вместо передачи земли им нужен контроль над Югославской лигой обороны, что сделает эту страну сюзереном северных балканских стран, ныне являющихся нашими субъектами. [FROM.GetName] утвержда[FROM.GetNameEndRuPresentEtYut], что буд[FROM.GetNameEndRuPresentEtUt] лучшим покровителем, чем мы, но это может быть лишь поводом."
 MUN_czech.1002.a: "Возможно, они правы."
 MUN_czech.1002.b: "Нет, эти страны под нашей защитой!"
 MUN_czech.1003.t: "[FROM.GetName] отверга[FROM.GetNameEndRuPresentEtYut] требования"
 MUN_czech.1003.d: "Несмотря на убедительные аргументы наших дипломатов, [FROM.GetNameDef] отказыва[FROM.GetNameEndRuPresentEtYut]ся уступать нашим требованиям."
 MUN_czech.1003.a: "Они не оставляют нам выбора"
 MUN_czech.1004.t: "[FROM.GetName] выступа[FROM.GetNameEndRuPresentEtYut] против Венгрии"
 MUN_czech.1004.d: "[ROOT.capital.GetCapitalVictoryPointName] встречает дурные вести: [FROM.GetAdjRuLower]ие войска движутся к [HUN.GetAdjRuLower]ой границе. Несомненно, [HUN.GetAdjRuLower]ие власти скоро с нами свяжутся, но мы должны заранее решить, стоит ли помочь [HUN.GetNameRuDat] и получить потенциального союзника или позволить [FROM.GetNameRuDat] осуществлять свои планы."
 MUN_czech.1004.a: "Мы должны защищать свои интересы."
 MUN_czech.1004.b: "Не стоит вмешиваться."
 MUN_czech.1005.t: "[FROM.GetName] требу[FROM.GetNameEndRuPresentEtYut] прибрежную территорию"
 MUN_czech.1005.d: "[FROM.GetNameDef] постепенно расширя[FROM.GetNameEndRuPresentEtYut]ся, и представители страны прибыли к нам с требованием передать земли, которыми когда-то владела [FROM.GetAdjRuLower]ая знать. По их словам, эти земли позволят им получить выход к Адриатическому морю. Наше мнение по вопросу никого не волнует."
 MUN_czech.1006.t: "[FROM.GetName] предлага[FROM.GetNameEndRuPresentEtYut] партнерство"
 MUN_czech.1006.d: "[FROM.GetNameDef] предлага[FROM.GetNameEndRuPresentEtYut] нам договор о взаимной защите, чтобы совокупная мощь наших армий отвадила любого захватчика. Отдельный интерес вызывает секретная часть соглашения, где оговорено потенциальное расширение [ROOT.GetAdjRuLower]ого влияния и возможная помощь со стороны [FROM.GetNameRuGen]."
 MUN_czech.1007.t: "[FROM.GetName] требу[FROM.GetNameEndRuPresentEtYut] согласования"
 MUN_czech.1007.d: "Недоверие между нами и [FROM.GetNameRuInst], существовавшее со времен основания этой страны, привело к тому, что их власти требуют от нас поддержать их под угрозой вторжения. Что интересно, [FROM.GetNameDef] тоже обраща[FROM.GetNameEndRuPresentEtYut]ся к нашим территориальным амбициям, обещая помощь в получении интересующих нас земель, если мы откажемся от притязаний на их территории."
 MUN_czech.1007.b: "Мы должны сохранить суверенитет!"
 MUN_czech.1008.t: "[FROM.GetName] предлага[FROM.GetNameEndRuPresentEtYut] заключить союз с государством [CZE_invited_country.GetName]"
 MUN_czech.1008.d: "Представители [FROM.GetNameRuGen], мостика между нами и Центральной Европой, предложили нам заключить союз с государством [CZE_invited_country.GetName]."
 MUN_czech.1008.a: "Усилить сдерживание от нападения на нас"
 MUN_czech.1008.b: "Нельзя позволить им верить, что мы сможем защитить всю Европу"
 MUN_czech.1009.t: "[FROM.GetName] приглаша[FROM.GetNameEndRuPresentEtYut] нас в альянс [CZE.GetFactionName]"
 MUN_czech.1009.d: "Дипломаты из [FROM.GetNameRuGen] сообщили, что нас будут рады видеть в их альянсе. Однако, в прошлом наши территориальные претензии накаляли отношения с [FROM.GetNameRuInst]. Мы должны решить, настаивать на этих претензиях или отказаться в угоду дружеским отношениям."
 MUN_czech.1009.a: "За наших новых союзников!"
 MUN_czech.1009.b: "Мы примкнем после признания наших претензий."
 MUN_czech.1009.c: "Нам это не интересно."
 MUN_czech.1010.t: "[FROM.GetName] предлага[FROM.GetNameEndRuPresentEtYut] нам возглавить альянс [CZE.GetFactionName]"
 MUN_czech.1010.d: "После недавних попыток превратить соглашения Малой Антанты в полноценный союз [FROM.GetName] предложил[FROM.GetNameRuEndPast] нам возглавить новый альянс. Они согласны уступить нам лидерство, чтобы получить в нашем лице ценного защитника. Это соглашение позволит нам расширить сферу влияния, правда, вполне вероятно, за счет находящихся под угрозой стран."
 MUN_czech.1010.a: "Они могли бы стать ценными союзниками"
 MUN_czech.1010.b: "Нам хватает [ROOT.GetNameRuGen]"
 MUN_czech.1011.t: "[FROM.GetName] предлага[FROM.GetNameEndRuPresentEtYut] заключить соглашение о защите"
 MUN_czech.1011.d: "Пытаясь предотвратить любую агрессию в отношении [FROM.GetNameRuGen], дипломаты этой страны предложили нам черновой вариант договора о взаимной защите. В обмен на нашу поддержку они согласны защищать нас, в результате чего любой агрессор столкнется с войной на два фронта."
 MUN_czech.1011.a: "Оправданный риск."
 MUN_czech.1011.b: "Нейтралитет безопаснее."
 MUN_czech.1012.t: "[FROM.GetName] требу[FROM.GetNameEndRuPresentEtYut] нашего подчинения"
 MUN_czech.1012.d: "Осмелев на фоне нового альянса, [FROM.GetNameDef] выдвинул[FROM.GetNameRuEndPast] ряд требований, сопоставимых для нас с отказом от суверенитета. Учитывая поддержку [SOV.GetNameRuGen] и интересы в данном регионе, нам необходимо решить, можем ли мы позволить себе этот отказ."
 MUN_czech.1012.a: "Сопротивление приведет к напрасной потере [ROOT.GetAdjRuLower]их жизней."
 MUN_czech.1012.b: "Смерть превыше бесчестия!"
 MUN_czech.1013.t: "[FROM.GetName] предлага[FROM.GetNameEndRuPresentEtYut] заключить условный союз"
 MUN_czech.1013.d: "После обстоятельного обсуждения власти [FROM.GetNameRuGen] объявили, что тоже считают наш союз потенциально выгодным, но не могут отказаться от своих территориальных претензий. Поэтому они выдвигают нам следующее условие: они станут новым членом альянса, но только в том случае, если мы уступим им запрашиваемые территории."
 MUN_czech.1013.a: "Это справедливый обмен"
 MUN_czech.1013.b: "Мы пытаемся защитить свои территории!"
 MUN_czech.1014.t: "[FROM.GetName] запрашива[FROM.GetNameEndRuPresentEtYut] защиту"
 MUN_czech.1014.d: "Влиятельные дипломаты из [FROM.GetNameRuGen] обратились к министру иностранных дел с просьбой формализовать размытые обещания защиты, обозначенные в Чехословацко-советском договоре 1935 года."
 MUN_czech.1014.a: "Возможно, стоит попробовать защитить наших союзников."
 MUN_czech.1014.b: "Обойдемся размытыми обещаниями."
 MUN_czech.1015.t: "[FROM.GetName] предлага[FROM.GetNameEndRuPresentEtYut] объединить наши альянсы"
 MUN_czech.1015.d: "Поскольку теперь у нас общие враги, [FROM.GetName] предлага[FROM.GetNameEndRuPresentEtYut] углубить наше сотрудничество, интегрировав наш альянс в их."
 MUN_czech.1015.a: "Координированные усилия помогут спасти жизни."
 MUN_czech.1015.b: "Руководить должны мы."
 MUN_czech.1016.t: "[FROM.GetName] предлага[FROM.GetNameEndRuPresentEtYut] заключить пакт о ненападении"
 MUN_czech.1016.d: "Продолжая переговоры, ранее отмененные из-за изменений во внешней политике, [FROM.GetNameDef] предложил[FROM.GetNameRuEndPast] вернуться к обсуждению пакта о ненападении."
 MUN_czech.1016.a: "Хотя бы об этой границе не придется беспокоиться."
 MUN_czech.1016.b: "Это помешает нашим амбициям."
 MUN_czech.1017.t: "Осуществить совместное вторжение в [GER.GetNameRuAcc]?"
 MUN_czech.1017.d: "[FROM.GetNameDef] представил[FROM.GetNameRuEndPast] [ROOT.GetAdjRuLower]ому руководству секретные планы вторжения в [GER.GetNameRuAcc]. Продемонстрировав свои намерения покончить с [GER.GetAdjRuLower]ой угрозой, они просят нашей помощи, чтобы совместными усилиями подавить могучую [GER.GetAdjRuLower]ую армию."
 MUN_czech.1017.a: "Мы атакуем [GER.GetNameRuGen] вместе."
 MUN_czech.1017.b: "Это слишком опасно."
 MUN_czech.1018.t: "Сражаться в одиночку против [GER.GetNameRuGen]?"
 MUN_czech.1018.t.2: "Совместное вторжение в [GER.GetNameRuAcc]"
 MUN_czech.1018.d: "Несмотря на все дипломатические усилия, нам не удалось заручиться поддержкой других стран по вопросу превентивного нападения на [GER.GetNameRuAcc]. Теперь нужно решить, откажемся ли мы, учитывая новые обстоятельства, от наших планов."
 MUN_czech.1018.d.FRA_POL: "Отличные новости из [FRA.GetNameRuGen] и [POL.GetNameRuGen]: наши дипломаты сообщают, что обе эти страны пообещали поддержать наше вторжение в [GER.GetNameRuAcc]."
 MUN_czech.1018.d.FRA: "Наши дипломаты вернулись из [FRA.GetNameRuGen] с великолепными новостями: эта страна готова поддержать нас в совместном вторжении в [GER.GetNameRuAcc]. Теперь мы должны оценить, хватит ли наших объединенных сил."
 MUN_czech.1018.d.POL: "Наши дипломаты вернулись из [POL.GetNameRuGen] с великолепными новостями: эта страна готова поддержать нас в совместном вторжении в [GER.GetNameRuAcc]. Теперь мы должны оценить, хватит ли наших объединенных сил."
 MUN_czech.1018.a: "Они даже понять ничего не успеют."
 MUN_czech.1018.b: "Но если подумать, это слишком рискованно."
 MUN_czech.1019.t: "[FROM.GetName] требу[FROM.GetNameEndRuPresentEtYut] регион [762.GetName]"
 MUN_czech.1019.d: "Ссылаясь на стремление восстановить старые границы Богемии и узаконить контроль над регионом [72.GetName], [FROM.GetAdjRuLower]ие представители выдвинули нам ультиматум с требованием передать регион [762.GetName]."
 MUN_czech.1019.a: "Возможно, это нас спасет."
 MUN_czech.1020.t: "[FROM.GetName] предлага[FROM.GetNameEndRuPresentEtYut] условные инвестиции"
 MUN_czech.1020.a: "Это выгодное предложение!"
 MUN_czech.1020.b: "Эти условия неприемлемы."
 MUN_czech.1020.d: "Прибывшие из [FROM.GetNameRuGen] дипломаты предлагают нам соглашение, по условиям которого их государство будет инвестировать в нашу промышленность и инфраструктуру в обмен на ресурсы. После неудачных инвестиций прошлых лет этот шаг явно представляет собой новую попытку улучшить отношения между странами."
 CZE_investment_effects_tt: "Через §Y100 дней§! мы получим:\n– §Yинфраструктуру§! в §Y3§! случайных регионах;\n– §Yфабрику§! в §Y1§! случайном регионе.\n"
 MUN_czech.1021.t: "Возвращение австро-венгерского таможенного союза?"
 MUN_czech.1021.d: "[CZE.GetNameDefCap] представила нам проект торгового соглашения между странами, располагающимися на территории бывшей Австро-Венгрии. [CZE.GetAdjective]ие власти, хоть и довольны обретенной независимостью, всё же были бы рады вернуть преимущества, которые давала Австро-Венгерская империя."
 MUN_czech.1021.a: "Развитие торговых отношений нам на руку"
 MUN_czech.1021.b: "Мы должны защищать отечественных производителей"
 MUN_czech.1022.t: "[CZE.GetName] захватывает Силезию"
 MUN_czech.1022.d: "После ожесточенных боев в горах региона [69.GetName] [CZE.GetAdjRuLower]ая армия сумела прорвать линию фронта и установить контроль над всей Силезией, прежде чем противостоявшие ей войска смогли восстановиться достаточно, чтобы оказать хоть сколько-нибудь значительное сопротивление."
 MUN_czech.1022.a: "Мы должны вмешаться"
 MUN_czech.1022.b: "Нам не нужен новый враг"
 MUN_czech.1022.c: "Большая победа!"
 MUN_czech.1023.t: "[CZE.GetName] начинает борьбу за Силезию"
 MUN_czech.1023.d: "Ссылаясь на странные рассуждения о средневековых королевствах и империях, [FROM.GetNameDef] превраща[FROM.GetNameEndRuPresentEtYut] пограничные стычки в полноценный локальный конфликт, пытаясь установить контроль над [ROOT.GetAdjRuLower]ой Силезией."
 MUN_czech.1023.a: "Подготовить войска"
 MUN_czech.1024.t: "[CZE.GetName] предлагает заключить перемирие"
 MUN_czech.1024.d: "После того, как пограничные стычки в Силезии переросли в полномасштабную войну, [FROM.GetNameDef] выказал[FROM.GetNameRuEndPast] желание завершить конфликт на условиях передачи требуемых земель."
 MUN_czech.1024.a: "Возможно, стоит сосредоточиться на других землях."
 MUN_czech.1024.b: "Ситуация всё еще складывается в нашу пользу."
 MUN_czech.1024.c: "Это не обсуждается!"
 MUN_czech.1025.t: "Завершение кампании испанских добровольцев"
 MUN_czech.1025.d.1: "[CZE_supported_spanish_faction.GetName] прощается с [ROOT.GetAdjRuLower]ими войсками, которые внесли свой вклад в победу. Участие в конфликте принесло нашей армии, и в первую очередь военным медикам, новые знания и навыки."
 MUN_czech.1025.d.2: "Несмотря на доблесть и бесстрашие, проявленные [ROOT.GetAdjRuLower]ими войсками в Испанской гражданской войне, наша сторона потерпела поражение. Тем не менее наша армия, и в первую очередь военные медики, получила ценный опыт."
 MUN_czech.1025.a: "Будем надеяться, что эти навыки нам не пригодятся"
 MUN_czech.1026.t: "[FROM.GetName] отверга[FROM.GetNameEndRuPresentEtYut] предложение"
 MUN_czech.1026.a: "Им же хуже"
 MUN_czech.1026.b: "Тревожное развитие событий"
 MUN_czech.1026.france_refuses_to_lead: "Хотя [FROM.GetAdjRuLower]ому правительству была предложена главенствующая роль в нашем альянсе, они отклонили наше предложение. Похоже, они пытаются сохранить нейтралитет или выиграть время."
 MUN_czech.1026.sphere_of_influence: "Хотя члены [FROM.GetAdjRuLower]ого правительства заверили нас, что ценят нашу роль в альянсе «[ROOT.GetFactionName]», они также заявили, что дальнейшее расширение нашего влияния на Балканах недопустимо, так как может отпугнуть потенциальных союзников."
 MUN_czech.1026.guarantee: "Несмотря на усилия наших дипломатов, [FROM.GetNameDef] отказыва[FROM.GetNameEndRuPresentEtYut]ся заключать с нами соглашение о взаимной обороне. Судя по всему, они считают, что мы находимся в большей опасности, чем они. Будем надеяться, что они ошибаются."
 MUN_czech.1026.faction_merge: "Несмотря на все усилия, нашим и [FROM.GetAdjRuLower]им дипломатам не удалось договориться, поэтому [ROOT.GetFactionName] и [FROM.GetFactionName] пока не могут быть объединены."
 MUN_czech.1026.non_aggression: "[FROM.GetAdjective]ие дипломаты отказались заключать с нами пакт о ненападении, хотя всячески заверяли, что у них исключительно мирные намерения. О причинах этого решения мы, вероятно, узнаем позже."
 MUN_czech.1026.trade_deal: "Ссылаясь на стремление сохранить экономическую независимость, [FROM.GetNameDef] отказыва[FROM.GetNameEndRuPresentEtYut]ся заключать с нами торговый договор."
 MUN_czech.1026.faction_invite: "Несмотря на то, что наши дипломаты привели аргументы в пользу союза [FROM.GetNameRuGen] с нами, переговоры завершились неудачей."
 MUN_czech.1026.weapons_sale: "Несмотря на наше щедрое предложение, [FROM.GetNameDef] решил[FROM.GetNameRuEndPast] пока не покупать у нас оружие."
 MUN_czech.1026.unification: "Признавая преимущества федерации, [FROM.GetNameDef] все же решил[FROM.GetNameRuEndPast] оставить свое правительство в изгнании единственным легитимным."
 MUN_czech.1026.white_peace: "Сегодня наши представители вернулись с печальными известиями: хотя мы захватили регион [66.GetName], руководство [FROM.GetNameRuGen] не желает подписывать мирный договор. Похоже, нам придется либо продолжить завоевание, либо попытаться их измотать."
 MUN_czech.1027.t: "Заключить [FROM.GetAdjRuLower]о-[ROOT.GetAdjRuLower]ое торговое соглашение?"
 MUN_czech.1027.d: "Несмотря на ранние идеологические разногласия, [FROM.GetNameDef] воззвал[FROM.GetNameRuEndPast] к нашему прагматизму, предложив торговое соглашение. [FROM.GetAdjective]ая промышленность сможет добывать ресурсы в регионе [202.GetName], а взамен мы получим механизмы и станки, необходимые нам для развития промышленности."
 MUN_czech.1027.a: "Чертовски выгодная сделка."
 MUN_czech.1027.b: "Не стоит давать им доступ к этим ресурсам."
 MUN_czech.1028.t: "Откладывание строительства укреплений"
 MUN_czech.1028.d: "Люди интересуются, почему государство приостановило проекты по строительству укреплений, запущенные в конце прошлого года. Правительство выделило средства на дополнительные проекты при участии Совета по фортификации. Поскольку никакого прогресса в реализации программы не предвидится, народ требует возобновить работы или вернуть выделенные средства. Если мы хотим продолжить строительство укреплений, нам не стоит это откладывать, иначе мы не уложимся в срок."
 MUN_czech.1028.a: "Больше не будем откладывать!"
 CZE_no_time_to_lose_tt: "Угроза приближается. Остаётся всё меньше времени, чтобы завершить строительство укреплений."
 MUN_czech.1029.t: "Проект по строительству укреплений завершен"
 MUN_czech.1029.d: "Мы завершили начатый недавно проект по строительству укреплений, и у нас остались ресурсы на новый проект. Наши инженеры готовы в любой момент развернуть работы по укреплению другого участка."
 MUN_czech.1029.a: "Отличная работа, господа"
 MUN_czech.1030.t: "[FROM.GetName] требу[FROM.GetNameEndRuPresentEtYut] интеграции"
 MUN_czech.1030.d: "[FROM.GetNameDefCap] потребовал[FROM.GetNameRuEndPast] от нас стать частью их расширяющегося союза. Хотя они обратились к разным странам региона, ссылаясь на разные причины, будь то панславянизм, панбалканизм или общая история в составе Австро-Венгерской империи, в предложении явно чувствуется угроза на тот случай, если мы посмеем отказать."
 MUN_czech.1030.a: "Возможно, это не такая уж плохая идея."
 MUN_czech.1030.b: "Не слишком-то убедительно."
 MUN_czech.1031.t: "[FROM.GetName] предлага[FROM.GetNameEndRuPresentEtYut] союз"
 MUN_czech.1031.d: "Хотя [ROOT.GetNameDef] капитулировал[ROOT.GetNameRuEndPast], [FROM.GetAdjRuLower]ое правительство обратилось к нам с радикальным предложением, которое позволит нам продолжить сражаться: объединить остатки нашей нации с их страной."
 MUN_czech.1031.a: "Вместе мы сможем лучше защитить нашу родину."
 MUN_czech.1031.b: "Наши различия слишком велики."
 MUN_czech.1032.t: "Предотвращение раскола"
 CZE_divide_nation_title_dynamic_sudentenland: "$MUN_czech.1032.t$ в Судетской области"
 CZE_divide_nation_title_dynamic_czech_states: "$MUN_czech.1032.t$ с чешскими рабочими"
 CZE_divide_nation_title_dynamic_tesinko_poles: "$MUN_czech.1032.t$ в регионе [72.GetName]"
 CZE_divide_nation_title_dynamic_slovakia_states: "$MUN_czech.1032.t$ с государством [SLO.GetNonIdeologyName]"
 CZE_divide_nation_title_dynamic_hungarian_states: "$MUN_czech.1032.t$ в регионе [664.GetName]"
 CZE_divide_nation_title_dynamic_ukrainian_states: "$MUN_czech.1032.t$ в регионе [73.GetName]"
 MUN_czech.1032.d: "Недавние попытки решить проблемы в [FROM.GetNameRuPrep] оказались успешными и позволили снизить недовольство действиями центрального правительства, по крайней мере, на какое-то время. Благодаря этому наше государство высвободило ресурсы, которые теперь можно использовать в рамках других социальных или экономических программ, чтобы заняться вопросами, раскалывающими наше общество."
 MUN_czech.1032.a: "Этим мы и займемся"
 MUN_czech.1033.t: "[FROM.GetAdjective]ое государство в изгнании требует признания"
 MUN_czech.1033.d: "[FROM.GetAdjective]ое государство в изгнании, которое возглавляет $CZE_edvard_benesh$, просит нас принять их делегацию. Они хотят, чтобы [CZE.GetNonIdeologyName] восстановила суверенитет."
 MUN_czech.1033.a: "Новый союзник в борьбе против [GER.GetNameRuGen]"
 MUN_czech.1033.b: "Это нелегитимное правительство"
 MUN_czech.1034.t: "Волнения в Словакии"
 MUN_czech.1034.d: "Поскольку мы уступили националистическим настроениям других групп, члены Словацкой народной партии создали собственные военизированные формирования, которые стремятся добиться независимости или хотя бы автономии Словакии. Теперь встал вопрос, стоит ли пытаться сохранить видимость единства и предотвратить это, или наоборот, дать им желаемое и сосредоточиться на землях, верных правительству."
 MUN_czech.1034.a: "Отправить в Словакию армию!"
 MUN_czech.1034.b: "Сдержать, но предоставить некоторую автономию"
 MUN_czech.1034.c: "Установить прямой контроль"
 MUN_czech.1034.c_tt: "§RНам придется смириться с решением [GER.GetNameRuGen] о судьбе Чехословакии.§!"
 MUN_czech.1035.t: "[FROM.GetName] предлага[FROM.GetNameEndRuPresentEtYut] производить для нас оружие"
 MUN_czech.1035.d: "Наш партнер [CZE.GetNameDef] предлагает уникальную сделку: они могут производить оружие, которое мы изготавливаем сейчас сами, и продавать его нам. В этом случае мы сможем сосредоточиться на других отраслях промышленности."
 MUN_czech.1035.a: "Это позволит не дублировать усилия"
 MUN_czech.1035.b: "Наша армия не должна зависеть от иностранного снаряжения"
 #MUN_czech.1036.t: "" #Event uses MUN_czech.1032.t
 MUN_czech.1036.d: "Великая депрессия не принесла нашей стране ничего хорошего ни в экономическом, ни в политическом плане. Мы тонем в огромном количестве региональных экономических и политических проблем, которые, судя по всему, будут только усугубляться, несмотря на наше фантастическое восстановление после кризиса. Нам необходимо решить эти проблемы, пока они еще сильнее не разобщили наш народ."
 MUN_czech.1036.a: "Нужно возродить нашу страну"
 CZE_divided_nation_event_onbroad_tt: "Получен доступ к §Yрешениям§!, которые позволят нам §Yудалять§! негативные §Yмодификаторы§! со своих национальных территорий.\n\nЗавершение этих §Yрешений§! также будет ослаблять негативные модификаторы национального духа §Y«$CZE_a_divided_nation_dynamic_modifier$»§! до его §Yудаления§!."
 MUN_czech.1037.t: "[GER.GetName] защища[GER.GetNameEndRuPresentEtYut] [HUN.GetNameRuAcc]"
 MUN_czech.1037.d: "Заметив наши очевидные попытки оправдать войну против [HUN.GetNameRuGen], [GER.GetAdjRuLower]ие представители ясно дали понять, что война с [HUN.GetNameRuInst] приведет и к войне с [GER.GetNameRuInst]. Продолжать или нет — решение за нами."
 MUN_czech.1037.a: "Мы должны отказаться от своих планов."
 MUN_czech.1037.b: "Это ничего не меняет."
 MUN_czech.1038.t.1: "[FROM.GetName] предлага[FROM.GetNameEndRuPresentEtYut] предоставить лицензии на проекты своих танков"
 MUN_czech.1038.t.2: "[FROM.GetName] предлага[FROM.GetNameEndRuPresentEtYut] продать орудия"
 MUN_czech.1038.t.3: "[FROM.GetName] предлага[FROM.GetNameEndRuPresentEtYut] продать артиллерию"
 MUN_czech.1038.t.4: "[FROM.GetName] предлага[FROM.GetNameEndRuPresentEtYut] продать легкие танки"
 MUN_czech.1038.t.5: "[FROM.GetName] предлага[FROM.GetNameEndRuPresentEtYut] продать истребители"
 MUN_czech.1038.d: "Представители [FROM.GetAdjRuLower]ого правительства и оружейных компаний обратились к нам с предложением по продаже оружия. Цены вполне разумны, к тому же [FROM.GetAdjRuLower]ое оружие отвечает требованиям времени."
 MUN_czech.1038.a: "Неплохая сделка"
 MUN_czech.1039.t: "[RUT.GetName] жела[RUT.GetNameEndRuPresentEtUt] соглашение об автономии"
 MUN_czech.1039.d: "В свете нашего соглашения о [SLO.GetAdjRuLower]ой автономии $RUT_augustin_voloshyn$ задался вопросом, может ли его родной регион в какой-либо форме заключить с нами соглашение о федерализации. Звучит нелепо, но в сложившихся обстоятельствах нужно серьезно отнестись к этим требованиям."
 MUN_czech.1039.a: "Посмотрим."
 MUN_czech.1040.t: "[CZE.GetName] предлага[CZE.GetNameEndRuPresentEtYut] учредить таможенный союз"
 MUN_czech.1040.d: "[CZE.GetNameDefCap] недавно возобновил[CZE.GetNameRuEndPast] переговоры о таможенном союзе между нашими странами. Предложение выглядит справедливым, но в будущем в него могут войти новые требования, к которым мы не готовы. Само соглашение и уступки с нашей стороны выглядят незначительными и символическими, и его подписание нам не навредит."
 MUN_czech.1040.a: "Выглядит безобидно."
 MUN_czech.1040.b: "Им нельзя доверять."
 MUN_czech.1041.t: "[FROM.GetName] отклоня[FROM.GetNameEndRuPresentEtYut] договор о таможенном союзе"
 MUN_czech.1041.d: "Ссылаясь на негативные последствия для экономики, [FROM.GetName] не пожелал[FROM.GetNameRuEndPast] подписывать соглашение о таможенном союзе между нашими странами. Это выглядит как ничем не обоснованные оправдания."
 MUN_czech.1041.a: "Досадно."
 MUN_czech.1042.t: "[FROM.GetName] соглаша[FROM.GetNameEndRuPresentEtYut]ся заключить договор о таможенном союзе"
 MUN_czech.1042.d: "[FROM.GetName] счита[FROM.GetNameEndRuPresentEtYut] договор удовлетворительным, принимая его условия. Будем надеяться, это станет первым шагом к сближению наших наций."
 MUN_czech.1042.a: "Превосходно."
 MUN_czech.1043.t: "[FROM.GetName] требу[FROM.GetNameEndRuPresentEtYut] вступить в федерацию"
 MUN_czech.1043.d: "Ссылаясь на близкие отношениях наших стран и ситуацию в мире, [FROM.GetName] заявил[FROM.GetNameRuEndPast], что нам будет лучше под их покровительством. Это выглядит как оправдание для оккупации наших земель. Что нам делать?"
 MUN_czech.1043.a: "Мы согласны."
 MUN_czech.1043.b: "Отвратительная идея."
 MUN_czech.1044.t: "[FROM.GetName] отказыва[FROM.GetNameEndRuPresentEtYut]ся вступить в федерацию"
 MUN_czech.1044.d: "[FROM.GetName] отклонил[FROM.GetNameRuEndPast] возможность стать частью нашей федерации, сочтя, что одним им будет лучше, чем под нашей защитой. Это серьезно подорвало наше стремление усилить положение в Европе. И что нам делать теперь, если [FROM.GetName] не передума[FROM.GetNameEndRuPresentEtYut]?"
 MUN_czech.1044.a: "Очень жаль."
 MUN_czech.1044.b: "Мы должны попробовать иные методы."
 MUN_czech.1045.t: "[FROM.GetName] соглаша[FROM.GetNameEndRuPresentEtYut]ся вступить в федерацию"
 MUN_czech.1045.d: "[FROM.GetName] принял[FROM.GetNameRuEndPast] разумное решение вступить в нашу федерацию, сочтя, что под нашим покровительством им будет безопаснее. Это значительно усилит наше положение в Европе."
 MUN_czech.1045.a: "Превосходно."
 MUN_czech.1046.t: "Устранение разногласий"
 MUN_czech.1046.d: "Мы решили многие проблемы нашей страны, что привело к снижению напряженности. Завершение ряда экономических и социальных программ положило начало исцелению страны."
 MUN_czech.1046.a: "Отличная новость!"
 #MUN_czech.1047 is hidden
 MUN_czech.1048.t: "[FROM.GetName] соглаша[FROM.GetNameEndRuPresentEtYut]ся на наши требования"
 MUN_czech.1048.t2: "[FROM.GetName] принима[FROM.GetNameEndRuPresentEtYut] предложение"
 MUN_czech.1048.d: "[FROM.GetAdjective]ие представители неохотно сообщили нам, что намереваются уступить нашим территориальным требованиям. [FROM.GetAdjective]ие войска уже покидают территорию."
 MUN_czech.1048.d2: "После продолжительных обсуждений наши представители и представители [FROM.GetNameRuGen] успешно договорились о новой роли [FROM.GetAdjRuLower]ой экономики в нашем союзе. Это соглашение, безусловно, принесет процветание гражданам обоих государств."
 MUN_czech.1048.d3: "Представители [FROM.GetNameRuGen] с энтузиазмом восприняли наше предложение заключить пакт о ненападении. Похоже, их амбиции сейчас сосредоточены на чем-то другом."
 MUN_czech.1048.d4: "Столкнувшись с серьезной угрозой, [FROM.GetNameDef] принима[FROM.GetNameEndRuPresentEtYut] наше предложение следовать общим курсом."
 MUN_czech.1048.d5: "После продолжительных обсуждений наши представители и представители [FROM.GetNameRuGen] достигли соглашения, по которому часть нашей военной промышленности будет в исключительном порядке производить для них снаряжение. Взамен мы будем получать товары для наших рынков и производства."
 #MUN_czech.1049 is a faction joining event so largely reuses generic loc
 MUN_czech.1049.d: "Новое правительство [FROM.GetNameRuGen] обратилось к нам с предложением союза. Хотя изначально их новое военное правительство придерживалось антинемецких взглядов, оно оказалось достаточно прагматичным и признало ненадежность своих предыдущих международных партнеров."
 MUN_czech.1050.d: "Наши дипломаты вернулись из [FROM.GetNameRuGen] с разочаровывающими новостями. Наше предложение о вступлении в альянс было отклонено. Хотя причины неясны, мы оказались в непростом положении, ведь мы уже высказали сомнения в наших традиционных союзниках, но не сумели найти новых."
 MUN_czech.1050.a: "Тогда, возможно, стоит предложить более выгодные условия."
 MUN_czech.1050.b: "Поищем союзников получше."
 MUN_czech.1051.t: "[FROM.GetName] требу[FROM.GetNameEndRuPresentEtYut] свою сферу влияния"
 MUN_czech.1051.d: "Наши новые [FROM.GetAdjRuLower]ие союзники выразили желание расширить свое влияние за пределы своих границ. Естественно, [FROM.GetAdjRuLower]ие представители прибыли к нам, надеясь получить разрешение и поддержку экспансии, а также желая четко разграничить [ROOT.GetAdjRuLower]ую и [FROM.GetAdjRuEnd]ую сферы влияния."
 MUN_czech.1051.a: "Мы должны укрепить ключевого [FROM.GetAdjRuLower]ого союзника."
 MUN_czech.1052.t: "[FROM.GetName] обраща[FROM.GetNameEndRuPresentEtUt]ся с просьбой предоставить проход [SOV.GetAdjRuLower]им войскам"
 MUN_czech.1052.d: "После заключения нового дипломатического соглашения между [FROM.GetNameRuInst] и [SOV.GetNameRuInst] [FROM.GetNameDef] рассчитыва[FROM.GetNameEndRuPresentEtUt], что в случае конфликта [SOV.GetNameDef] прид[SOV.GetNameEndRuPresentEtUt] на помощь. Единственная проблема — отсутствие сухопутного сообщения между двумя государствами, поэтому [FROM.GetAdjRuLower]ие дипломаты обратились к нашему правительству с просьбой разрешить проход [SOV.GetAdjRuLower]их войск через нашу территорию к [FROM.GetNameRuDat] при возникновении конфликта."
 MUN_czech.1052.a: "В случае конфликта они защитят и нас"
 MUN_czech.1053.t: "[FROM.GetName] оказыва[FROM.GetNameEndRuPresentEtYut] на нас давление, используя [HUN.GetAdjRuLower]ие притязания"
 MUN_czech.1053.d: "Превратив [HUN.GetNameRuGen] в вассальное государство, [FROM.GetNameDef] теперь требу[FROM.GetNameEndRuPresentEtYut], чтобы мы смирились с той же участью. Они угрожают, что в случае отказа поддержат претензии [HUN.GetNameRuGen] на [ROM.GetAdjRuLower]ую территорию. Теперь нам приходится выбирать между потерей суверенитета и потенциальной угрозой территориальной целостности."
 CZE_cancel_anti_hungary_focus_tt: "Отменяет фокус §Y«$CZE_neutralize_the_hungarian_threat$»§!"
 MUN_czech.1054.t: "Совместное вторжение в [LIT.GetNameRuAcc]?"
 MUN_czech.1054.d: "Как было согласовано ранее, [FROM.GetNameDef] представил[FROM.GetNameRuEndPast] предложение, которое поможет укрепить нашу страну. А именно, путем насильственного объединения с [LIT.GetNameRuInst] мы получим доступ к дополнительным ресурсам и лишим противника возможности атаковать нас с территории [LIT.GetNameRuGen]."
 MUN_czech.1054.a: "Нам нужно расшириться, чтобы помешать экспансии других"
 MUN_czech.1055.t: "Прибыли [SOV.GetAdjRuLower]ие добровольцы"
 MUN_czech.1055.d: "Продемонстрировав чудеса воздушной логистики, [SOV.GetNameDef] перебросил[SOV.GetNameRuEndPast] несколько дивизий своих добровольцев в наш аэропорт в регионе [73.GetName] для помощи в наших военных действиях."
 MUN_czech.1056.t: "[FROM.GetName] требует регион [975.GetName]"
 MUN_czech.1056.d: "Как и прежде, на Парижской мирной конференции после Великой войны [CZE.GetNameDef] заявил[CZE.GetNameRuEndPast], что в интересах безопасности [CZE.GetAdjRuLower]о-[YUG.GetAdjRuLower]ого союза необходим наземный коридор между этими двумя странами. В связи с этим представители [FROM.GetNameRuGen] выдвинули нам ультиматум с требованием отказа от региона [975.GetName]."
 #THE FALL OF THE REPUBLIC EVENTS#
 MUN_the_fall_of_the_republic.1.t: "Начало массовых протестов"
 MUN_the_fall_of_the_republic.1.d: "Из-за того, что [ROOT.GetLeader] принимает решение сдать Судетскую область, по стране прокатилась волна протестов. Хотя политическое и военное руководство хотело избежать кровопролития в ходе бессмысленного, по их мнению, сопротивления, многим это решение показалось неправильным. Теперь некоторые политические движения пытаются воспользоваться волнениями для достижения собственных целей."
 MUN_the_fall_of_the_republic.1.a: "У нас не было выбора!"
 MUN_the_fall_of_the_republic.2.t.1: "Падение Первой республики"
 MUN_the_fall_of_the_republic.2.t.2: "Хаос в правительстве"
 MUN_the_fall_of_the_republic.2.d: "После того как власти приняли решение о сдаче Судетской области, страну захлестнула волна заявлений об отставке среди сотрудников младшего звена в армии и правительстве. По имеющимся данным, некоторые из этих людей в одночасье покинули страну. Нам необходимо произвести серьезные изменения, чтобы остановить поток уезжающих чиновников и вернуть людям веру в нашу способность управлять страной."
 MUN_the_fall_of_the_republic.2.a: "Нам нужны радикальные перемены."
 MUN_the_fall_of_the_republic.2.b: "Мы должны придерживаться прежнего курса!"
 MUN_the_fall_of_the_republic.3.t: "[RUT.getname] просит автономии"
 MUN_the_fall_of_the_republic.3.d: "В связи с недавним политическим хаосом, постигшим нашу страну, небольшая область Карпатская Украина захотела стать более независимым от региона [9.GetCapitalVictoryPointName], сославшись на давние разногласия с [ROOT.GetNameRuInst]. Однако это решение похоже на попытку местных лидеров получить больше власти. Отказав им, мы можем утратить весомую часть политического капитала, которого у нас и так немного."
 MUN_the_fall_of_the_republic.3.a: "Конечно, почему бы и нет?"
 MUN_the_fall_of_the_republic.3.b: "Ни в коем случае!"
 MUN_the_fall_of_the_republic.3.c: "Пусть идут на все четыре стороны."
 MUN_the_fall_of_the_republic.4.t: "Судьба [RUT.GetNameRuGen]"
 MUN_the_fall_of_the_republic.4.d: "В результате недавнего хаоса, постигшего [CZE.GetNameRuAcc], небольшой регион [RUT.getname] оказался за пределами границ всех существующих государств. Теперь эта область провозгласила себя независимым государством и пытается установить дипломатические контакты с соседями. Многие представители нашего правительства боятся, что этот стратегически важный регион у нашей границы окажется в чужих руках. Армия предлагает выдвинуть отколовшейся области ультиматум и объявить о немедленной аннексии этой территории."
 MUN_the_fall_of_the_republic.4.a: "Немедленно направить ультиматум!"
 MUN_the_fall_of_the_republic.4.b: "Это рискованно, нужно немного подождать."
 MUN_the_fall_of_the_republic.5.t: "[FROM.getname] требу[FROM.GetNameEndRuPresentEtYut] аннексии нашей территории!"
 MUN_the_fall_of_the_republic.5.d: "После того как мы добились независимости, стоило ожидать, что в один прекрасный момент какая-нибудь соседняя страна решит нас к себе присоединить. Опередив остальных соседей, [FROM.getname] требу[FROM.GetNameEndRuPresentEtYut], чтобы мы сдались. Как нам поступить?"
 MUN_the_fall_of_the_republic.5.a: "Мы будем сражаться до последней капли крови!"
 MUN_the_fall_of_the_republic.5.b: "У нас нет выбора, надо соглашаться."
 MUN_the_fall_of_the_republic.6.t: "[FROM.getname] отверга[FROM.GetNameEndRuPresentEtYut] наш ультиматум!"
 MUN_the_fall_of_the_republic.6.d: "Удивительно, но [FROM.getname] отверга[FROM.GetNameEndRuPresentEtYut] наш ультиматум и готовится оказать нам вооруженное сопротивление. Таким образом? они вынуждают нас начать вторжение. Планы сражений и маршруты наступления готовы — осталось только отдать приказ о нападении."
 MUN_the_fall_of_the_republic.6.a: "Мы их предупреждали."
 MUN_the_fall_of_the_republic.6.a_tt: "Если у [RUT.GetNameRuGen] нет союзников, эта операция не затронет деятеля §Y$HUN_pal_teleki$§!"
 MUN_the_fall_of_the_republic.6.b: "Это может выйти нам боком, лучше воздержаться."
 MUN_the_fall_of_the_republic.7.t: "[FROM.getname] уступа[FROM.GetNameEndRuPresentEtYut] нашим требованиям"
 MUN_the_fall_of_the_republic.7.d: "[FROM.GetName] ожидаемо принима[FROM.GetNameEndRuPresentEtYut] наши требования и соглаша[FROM.GetNameEndRuPresentEtYut]ся присоединиться к нам на вполне тривиальных условиях. Этот крошечный регион в любом случае не смог бы выстоять против такой могущественной державы, как наша. В результате северная граница нашего государства немного сдвинулась, а власти празднуют легкую победу."
 MUN_the_fall_of_the_republic.7.a: "Прекрасные новости."
 #BOP EVENTS#
 MUN_czech_bop.1.t: "Готовность армады"
 MUN_czech_bop.1.d: "Реформы, проведенные в первой половине десятилетия, начинают приносить свои плоды. Наша армия стала одной из самых современных в Европе. Однако среди некоторых политиков и руководителей многих промышленных конгломератов стало распространяться чувство удовлетворенности. Если мы хотим, чтобы наша армия оставалась на пике готовности, нам нужно бороться с любыми возможными сомнениями в ее боеспособности, а также с теми, кто хочет подорвать ее авторитет ради своей выгоды."
 MUN_czech_bop.1.a: "Мы будем готовы."
 MUN_czech_bop.2.t.1: "Угроза перевооружения Германии"
 MUN_czech_bop.2.t.2: "Наращивание военных сил в соседних странах"
 MUN_czech_bop.2.d.1: "Недавно [GER.getnameDEFcap] провела ремилитаризацию Рейнской области, и это событие напугало некоторых наших военных и политических лидеров. Многие надеются на союзы, которые заключило наше правительство, и готовность армии защитить страну от возможных угроз со стороны Германии. При этом далеко не все уверены, что мы действительно сможем противостоять [GER.GetAdjRuLower]ому вторжению."
 MUN_czech_bop.2.d.2: "Недавние новости о том, что некоторые наши соседи развернули программы по усиленному наращиванию военных сил, напугали некоторых военных и политических лидеров. Многие надеются на союзы, которые наше правительство заключило с другими странами, и подготовку армии к защите страны от угроз извне. При этом далеко не все уверены, что мы действительно сможем отразить иностранную агрессию в случае необходимости."
 MUN_czech_bop.2.a: "Мы будем готовы."
 MUN_czech_bop.2.a_tt: "Усилия соседей по перевооружению заставили некоторых бойцов нашей армии усомниться в том, что мы сможем противостоять возможной агрессии. Необходимо развеять эти сомнения."
 MUN_czech_bop.3.t: "[CZE.getname] отправляет к нам наблюдателей"
 MUN_czech_bop.3.d: "Недавно [CZE.getname] отправила к нам наблюдателей для изучения продолжающегося конфликта. В это же время к нашим дипломатам втайне обратился один из мелких [CZE.GetAdjRuLower]их производителей оружия с вопросом, заинтересованы ли мы в закупке стрелкового оружия. Поскольку на нашу страну наложены санкции, согласие будет означать незаконный ввоз оружия."
 MUN_czech_bop.3.a: "Посмотрим, к чему это приведет."
 MUN_czech_bop.3.b: "Мы не можем позволить им стать чем-то большим, чем наблюдателями."
 MUN_czech_bop_3_tt: "Производитель оружия из §Y[CZE.GetNameRuGen]§! под названием §Y$CZE_zbrojovka_brno_organization$§! может попытаться организовать для нас контрабанду оружия."
 MUN_czech_bop.4.t: "$CZE_zbrojovka_brno_organization$ предлагает сделку"
 MUN_czech_bop.4.d: "[ETH.GetName] обращается к представителям оружейного завода, которым управляет $CZE_zbrojovka_brno_organization$, проявив интерес к закупке оружия. По всей видимости, $CZE_zbrojovka_brno_organization$ хочет продавать оружие в обход санкций, наложенных Лигой Наций на [ETH.GetNameRuAcc]. Если мы нарушим мандат Лиги Наций и об этом узнают, наше решение осудят многие страны."
 MUN_czech_bop.4.a: "Сделаем это"
 MUN_czech_bop.4.b: "Возможная негативная реакция того не стоит"
 CZE_gun_smuggling_tt: "Контрабанда оружия в страну"
 CZE_we_got_caught_tt: "Компания §Y$CZE_zbrojovka_brno_organization$§! поймана с поличным."
 CZE_we_dont_get_caught_tt: "Компания §Y$CZE_zbrojovka_brno_organization$§! не поймана."
 MUN_czech_bop.5.t: "$CZE_zbrojovka_brno_organization$ соглашается на контрабанду"
 MUN_czech_bop.5.d: "После переговоров с представителями чешского правительства организация $CZE_zbrojovka_brno_organization$ получила разрешение на контрабанду небольшого количества стрелкового оружия. Кроме того, теперь мы можем связываться с ними по резервным каналам и получать ценную информацию."
 MUN_czech_bop.5.a: "Нам это пригодится."
 MUN_czech_bop_5_tt: "Этот §Yпроизводитель§! будет §Rудалён§! после окончания войны."
 ##SLOVAKIA##
 MUN_slovakia_little_war.1.t: "Победа в регионе [71.Getname]"
 MUN_slovakia_little_war.1.d: "Наша армия хорошо проявила себя в регионе [71.Getname], разбив присутствовавшие в нем вражеские силы. Наши командиры извлекли из сражения бесценную информацию и опыт и могут воспользоваться ими в будущем."
 MUN_slovakia_little_war.1.a: "Молодцы."
 MUN_slovakia_little_war.2.t: "Поражение в регионе [71.Getname]"
 MUN_slovakia_little_war.2.d: "Несмотря на все усилия, наши войска потерпели поражение в регионе [71.Getname]. Неспособность своевременно накопить достаточное количество боеприпасов и техники стала главной причиной. Но наши командиры, участвовавшие в сражении, сумели извлечь важные уроки даже из поражения."
 MUN_slovakia_little_war.2.a: "Весьма досадно."
 MUN_slovakia_little_war.3.t: "Пограничная стычка в регионе [71.Getname]"
 MUN_slovakia_little_war.3.d: "Даже получив наши территории по договору $GER_first_vienna_award$, [HUN.GetNameDef] всё еще требу[HUN.GetNameEndRuPresentEtYut] пересмотра границ в регионе [71.GetName]. Мы должны дать мощный ответ и показать, что не уступим земли без боя."
 MUN_slovakia_little_war.3.a: "Как они смеют!"
 MUN_slovakia_little_war.4.t: "Ничья в регионе [71.Getname]"
 MUN_slovakia_little_war.4.d: "Несмотря на все усилия, наши войска не сумели выиграть стычку в регионе [71.Getname]. Неспособность своевременно накопить достаточное количество боеприпасов и техники стала главной причиной. Но наши командиры, участвовавшие в сражении, извлекли важные уроки, даже не сумев достичь победы."
 MUN_slovakia_little_war.4.a: "Весьма досадно."
 ##Exile##
 MUN_czech_exile.1.t: "[CZE.GetAdjective]ие изгнанники прибывают в [ROOT.GetNameRuAcc]"
 MUN_czech_exile.1.d: "После ликвидации [CZE.GetNameRuGen] [GER.GetNameRuInst] по итогам Мюнхенской конференции [CZE.GetAdjRuLower]ие изгнанники были вынуждены бежать в другие страны, и часть из них прибыла к нам. Они готовы взяться за оружие и сражаться на нашей стороне в надежде, что с нашей помощью когда-нибудь смогут освободить свою страну."
 MUN_czech_exile.1.a: "Добро пожаловать."
 ##NEWS EVENTS##
 MUN_czech.news.1.t: "Судетский кризис"
 MUN_czech.news.1.desc: "Жители Судетской области начали вооруженное восстание против [CZE.GetNameRuGen]. Сообщается, что судетские военизированные группы стали совершать налеты на полицейские участки и правительственные здания в разных частях региона. Так судетский народ реагирует на желание [FROM.GetNameRuGen] аннексировать регион.\n\nНет практически никаких сомнений в том, что эти события приведут к разгоранию конфликта между [FROM.GetNameRuInst] и [CZE.GetNameRuInst]."
 MUN_czech.news.1.a: "Европе это не предвещает ничего хорошего."
 MUN_czech.news.1.b: "Хаос — это лестница."
 MUN_czech.news.1.c: "Мы победим!"
 MUN_czech.news.1.d: "Будем надеяться на торжество дипломатии."
 MUN_czech.news.2.t: "[FROM.GetNameDefCap] вторга[FROM.GetNameEndRuPresentEtYut]ся в [RUT.GetNameRuAcc]"
 MUN_czech.news.2.desc: "\nИз-за политического хаоса в [CZE.GetNameRuPrep] небольшой регион [RUT.GetName] оказался за пределами границ всех существующих государств. Вскоре отделившийся регион объявил себя независимым государством и стал формировать ополчение, чтобы защитить новый статус.\n\nПоскольку держава [FROM.GetNameDefCap] давно положила глаз на этот регион, она тут же воспользовалась появившейся возможностью и напала на отколовшуюся область. Многие наблюдатели уверены, что [RUT.GetNameRuAcc] ждет поражение."
 MUN_czech.news.2.a: "Карпатская... Что?"
 MUN_czech.news.2.b: "Это будет легко."
 MUN_czech.news.2.c: "Пусть только попробуют!"
 MUN_slovakia.news.1.t: "Пограничные стычки в регионе [71.Getname]"
 MUN_slovakia.news.1.desc: "Даже получив регион [664.Getname] по договору $GER_first_vienna_award$, [HUN.GetNameDef] всё еще требу[HUN.GetNameEndRuPresentEtYut] дальнейшего пересмотра [SLO.GetAdjRuLower]ой границы в регионе [71.GetName].\n\nПохоже, [HUN.GetNameRuDat] просто нужен повод проверить свою армию в бою с заведомо более слабым противником. Вряд ли молодая [SLO.GetAdjRuLower]ая армия готова к такому испытанию."
 MUN_slovakia.news.1.a: "Ну как дети малые."
 MUN_slovakia.news.1.b: "Мы готовы к этому."
