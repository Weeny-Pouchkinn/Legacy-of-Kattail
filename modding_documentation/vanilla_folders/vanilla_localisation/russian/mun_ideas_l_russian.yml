 CZE_skoda_plzen_tank_destroyer: "Бронетехника «Шкода» в Пльзени"
 CZE_walter_co_desc: "Walter Co — это всего лишь неформальное сокращение длинного и громоздкого названия «Акционерное общество Вальтера по производству автомобильных и авиационных двигателей»."
