 #Dynamic Modifiers National Spritits
 CZE_ceskoslovenska_armada_dynamic_modifier: "Чехословацкая армия"
 CZE_ceskoslovenska_armada_dynamic_modifier_desc: "Эта армия, словно феникс, восстала из пепла чешских дивизий Австро-Венгрии и легендарного Чехословацкого легиона. Их традиции в ней по-прежнему сильны."
 CZE_ceskoslovenske_letectvo_dynamic_modifier: "Чехословацкие ВВС"
 CZE_ceskoslovenske_letectvo_dynamic_modifier_desc: "Может, самолётов у нас и немного, зато пилоты всегда готовы к вылету. Враги угрожают со всех сторон, поэтому небо станет нашим морем, а каждый лётчик будет стоить в бою трёх вражеских."
 CZE_a_divided_nation_dynamic_modifier: "Расколотая нация"
 CZE_a_divided_nation_dynamic_modifier_desc: "Долгое время [CZE.GetAdjRuLower]ое государство выделялось среди стран Центральной Европы своим плюрализмом: оно защищало интересы всех своих жителей. Однако после Великой депрессии всё изменилось. Экономические трудности вызвали рост недовольства правительством среди разных групп населения, что в конечном итоге привело к расколу нации."
 CZE_skoda_works_dynamic_modifier: "Заводы «Шкоды»"
 CZE_skoda_works_dynamic_modifier_desc: "Компания «Шкода» занимается производством, финансированием и конструкторскими работами во всех отраслях тяжёлой промышленности. В нашей стране она обладает практически неограниченным влиянием."
 CZE_ceskoslovenske_alecne_lodstvo_dynamic_modifier: "Дунайская флотилия"
 #Dynamic State Modifiers
 CZE_sudetenland_german_state_modifier: "Судетский сепаратизм"
 CZE_sudetenland_german_state_modifier_desc: "Недавние экономические проблемы сильно ударили по судетской промышленности. Теперь жители региона обвиняют в своих несчастьях правительство [ROOT.GetNameRuGen]."
 CZE_tesinko_polish_state_modifier: "Польский сепаратизм"
 CZE_czech_state_modifier: "Дефицит квалифицированных чешских рабочих"
 CZE_czech_state_modifier_desc: "Чехия с её преимущественно сельским населением с трудом поспевает за стремительными темпами экономического роста. Для новых рабочих мест попросту не хватает квалифицированных кадров. Мы должны подготовить чешскую молодёжь к переменам, необходимым для современной экономики."
