 CZE_sudetenland_paramilitaries_modifier: "Судетские вооружённые формирования"
 CZE_sudetenland_paramilitaries_modifier_desc: "Судетские партизаны и боевики открыто выступают против нас в этом регионе. Они нападают на подразделения нашей армии и помогают нашим врагам."
