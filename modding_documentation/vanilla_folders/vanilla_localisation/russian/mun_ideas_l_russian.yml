 CZE_anglo_czechoslovak_bank: "Англо-чехословацкий и пражский кредитный банк"
 CZE_anglo_czechoslovak_bank_desc: "Появился в 1930 году в результате слияния трёх пражских банков. На сегодняшний день является вторым крупнейшим банком в стране."
