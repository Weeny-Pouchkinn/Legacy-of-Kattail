 #National Spirits
 CZE_taticek_of_czechoslovakia: "«Папочка» Масарик"
 CZE_taticek_of_czechoslovakia_desc: "Томаш Масарик, которого нередко называют отцом нации, а то и попросту папочкой («татичек» по-чешски), более двух десятилетий оставался стабилизирующей фигурой в политике Чехословакии. Когда в появление коалиций и выход из политического тупика почти никто не верил, Масарик раз за разом совершал чудеса, помогая укрепить Чехословакию и сделать ее такой, какой мы видим ее сегодня. Даже сейчас, находясь на заслуженном отдыхе, он дает властям страны ценные советы, которые воспринимаются как руководство к действию."
 CZE_industrialists_veto: "Вето промышленников"
 CZE_industrialists_veto_desc: "Промышленники оказывают значительное влияние на политику страны, ведь они возглавляют многие из крупнейших конгломератов [CZE.GetNameRuGen]. С ними приходится считаться в вопросах экономической политики, и экономическая мобилизация вызовет крайне ожесточенное сопротивление с их стороны."
 CZE_agrarian_politics_1: "Аграрная политика"
 CZE_agrarian_politics_1_desc: "Хотя наша страна является преимущественно индустриальной, фермеры и сельские жители обладают заметным весом во многих её политических партиях. Их настроения часто влияют на решения в области экономики, тормозя дальнейшее развитие промышленности."
 CZE_directorate_of_fortification_works_no_gd_idea: "Управление фортификационных работ"
 CZE_directorate_of_fortification_works_no_gd_idea_desc: "$CZE_directorate_of_fortification_works_no_gd_idea$, более известное как ROP, осуществляет надзор за всеми работами по строительству оборонительных сооружений в стране."
 CZE_czech_corporatism: "Чешский корпоративизм"
 CZE_broken_shield: "Разбитый щит"
 CZE_redirected_fortification_council_funds: "Перенаправление средств Совета по фортификациям"
 CZE_army_readiness_1: "Неподготовленная армия"
 CZE_army_readiness_1_desc: "Армия — это не только солдаты и снаряжение для них. При отражении угрозы извне важна и уверенность в своих силах, и поддержка политических и промышленных лидеров страны. Иметь оружие недостаточно, нужна ещё способность его эффективно применять."
 CZE_army_readiness_3: "Подготовленная армия"
 CZE_army_readiness_3_desc: "Армия — это не только солдаты и снаряжение для них. При отражении угрозы извне важна и уверенность в своих силах, и поддержка политических и промышленных лидеров страны. Иметь оружие недостаточно, нужна ещё способность его эффективно применять."
 CZE_ready_for_anything_idea: "Готовность ко всему"
 CZE_sudeten_german_quandary: "Судетская дилемма"
 CZE_sudeten_german_quandary_desc: "Хотя большинство судетских жителей хотят всего лишь большей автономии при сохранении действующего правительства, многочисленные судетские партии и их сторонники могут легко превратиться в пятую колонну, если какое-нибудь германское государство решит аннексировать часть региона."
 CZE_sudeten_german_quandary_modifier_tt: "§YПассивный эффект§!:\nЕсли §Y[AUS.GetFlag][AUS.GetNonIdeologyName]§!, §Y[GER.GetFlag][GER.GetNonIdeologyName]§! или любое [BAY.GetFlag]§Yнемецкое государство§!, граничащее с нами, оправдает или получит §Rцель войны§! против нас, когда §Y[69.GetName]§!, §Y[972.GetName]§! или §Y[74.GetName]§! под нашим контролем:\n — (§YВсе подконтрольные судетские регионы§!):\n    Добавление модификатора §Y«$CZE_sudetenland_paramilitaries_modifier$»§!, дающего:\n       $MODIFIER_LOCAL_INTEL_TO_ENEMIES$: §R+10%§!\n       $MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$: §R-10,0%§!\n       $modifier_state_repair_speed_bunker_factor$: §R-10,00%§!\n\n — Этот §Yэффект§! может сработать только один раз"
 CZE_sudeten_challenge: "Судетская проблема"
 CZE_sudeten_challenge_desc: "Из-за недавних действий вооружённых формирований в Судетах многие мировые державы пришли к выводу, что нынешняя агрессия против нашей страны полностью оправдана! Чтобы убедить их в обратном, нам потребуется время."
 CZE_sudeten_facde: "Судетский предлог"
 CZE_sudeten_facde_desc: "Поскольку судетские вооружённые формирования не получили поддержки, наши оправдания действий против [CZE.GetNameRuGen] в глазах мировой общественности выглядят лишь предлогом."
