 AST_singapore_strategy_idea: "Работы по укреплению Сингапура"
 AST_singapore_strategy_idea_desc: "По просьбе Австралии мы постараемся укрепить оборону Сингапура, поскольку сингапурская стратегия — один из важнейших элементов оборонной политики Тихоокеанского региона.\n\n§W§YПри удалении§! (§YСингапур§!):\n Добавляются §G2§! §Yавиабазы§!.\n Добавляются §G2§! §Yморские базы§!.\n Добавляется §G1§! §Yбереговое укрепление§!.§!\n"
