 ABDA_supreme_command: "Верховное командование ABDACOM"
 ABDA_supreme_command_desc: "Командование американскими, британскими, голландскими и австралийскими вооружёнными силами выработало общую военную доктрину для всех своих флотов. Альянс становится более сплочённым, а общие разведданные, скоординированные патрули и взаимная поддержка логистики постепенно повышают боевую эффективность всех флотов под знаменем ABDACOM."
