 AST_poor_population_growth: "Низкая рождаемость"
 AST_poor_population_growth_desc: "С наступлением Великой депрессии в 1929 году в Астралии резко упала рождаемость. Вкупе со снижением количества иммигрантов эти экономические проблемы ввергли страну в тяжелый демографический кризис, из которого она не вышла до сих пор."
