 AST_unratified_westminster_act_idea: "Отказ ратифицировать Вестминстерский статут"
 AST_unratified_westminster_act_idea_desc: "Принятый в 1931 году Вестминстерский статут подтвердил суверенитет самоуправляемых доминионов [ENG.GetNameRuGen]. Если мы ратифицируем этот акт, британский парламент почти не сможет принимать действующие на [AST.GetNameRuAcc] законы."
 AST_australian_war_cabinet_idea: "Австралийский кабинет военного времени"
 AST_australian_war_cabinet_idea_tt: "\nВо время войны модификатор §Y«$AST_australian_war_cabinet_idea$»§! изменится на:\n §Y2§! §Yвоенных завода§! вне карты"
