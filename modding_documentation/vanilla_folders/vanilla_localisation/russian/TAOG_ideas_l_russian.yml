 idea_SIA_pan_thaiism_2_desc: "$idea_SIA_pan_thaiism_desc$"
 idea_SIA_unity_propaganda: "Пропаганда объединения"
 idea_SIA_royal_palace_bureau_directive_no_1523: "Директива Бюро королевского дворца №1523"
 idea_SIA_foreign_diplomatic_relationships: "Внешние дипломатические отношения"
 modify_idea_SIA_foreign_diplomatic_relationships: "§Y«$idea_SIA_foreign_diplomatic_relationships$»§! изменится на:"
 idea_SIA_bank_of_siam: "Банк Сиама"
 idea_SIA_bank_of_siam_desc: "Банк Сиама — финансовая опора государства. Он распоряжается вложениями капитала и проводит кредитно-денежную политику в поддержку развития промышленности."
 idea_SIA_bank_of_siam_2: "$idea_SIA_bank_of_siam$"
 idea_SIA_bank_of_siam_2_desc: "$idea_SIA_bank_of_siam_desc$"
 idea_SIA_boon_rawd_brewery: "Пивоварня Boon Rawd"
 idea_SIA_boon_rawd_brewery_desc: "Пивоварня Boon Rawd — один из самых знаменитых и финансово успешных отечественных производителей. Поборникам его интересов обеспечены кредит доверия и политический капитал."
 idea_SIA_siam_cement_group: "Цементная группа [ROOT.GetNameRuGen]"
 idea_SIA_thai_rice_company: "Тайская рисовая компания"
 idea_SIA_agricultural_tax_reduction: "Понижение сельскохозяйственного налога"
 idea_SIA_agrarian_economical_policy: "Аграрная экономическая политика"
 idea_SIA_contingency_funds: "Резервный фонд"
 idea_SIA_agrarian_economical_policy_modify: "§Y«$idea_SIA_agrarian_economical_policy$»§! изменится на:"
 idea_SIA_farmers_moving_to_bangkok_good: "Переезд фермеров в Бангкок"
 idea_SIA_farmers_moving_to_bangkok_bad: "$idea_SIA_farmers_moving_to_bangkok_good$"
 idea_SIA_irrigation: "Ирригация"
 idea_SIA_debt_repayment: "Возврат долга"
 idea_SIA_debt_repayment_desc: "Дефицит бюджета начинает ощутимо давить на экономику. Вся выручка идёт на выплаты кредиторам, а поддерживать прежние темпы строительства, возможные лишь благодаря займам, теперь невозможно."
 idea_SIA_an_unceasy_alliance: "Ненадежный союз"
 idea_SIA_an_unceasy_alliance_desc: "Союз ещё не распался, однако уже начинает трещать по швам. Охватившие правительство сомнения — это ниточки, которые постепенно тянут страну к нейтралитету."
 idea_SIA_rural_support: "Поддержка сёл"
 idea_SIA_the_sacred_hierarchy: "Священная иерархия"
 idea_SIA_order_discipline_and_unity: "Порядок, дисциплина и единство"
 idea_SIA_constitutional_virtue: "Конституционное достоинство"
 idea_SIA_an_absolute_monarchy: "Абсолютная монархия"
 idea_SIA_an_absolute_monarchy_desc: "Вся политическая власть принадлежит исключительно короне. Слово короля — закон, инакомыслие строго подавляется, и даже мобилизация в стране проходит во имя короны. Беззаветную верность престол обеспечивает себе с помощью армии."
 idea_SIA_a_constituional_monarchy: "Конституционная монархия"
 idea_SIA_a_constituional_monarchy_desc: "Конституционная система ограничивает королевскую власть и закрепляет права народа. Корона при таком строе — не абсолютная власть, а скорее объединяющий символ. В стране растёт стабильность, народ охотнее принимает новые идеи и больше симпатизирует идеалам демократии."
 idea_SIA_restoring_order: "Восстановление порядка"
 idea_SIA_military_expansion_costs: "Затраты на расширение армии"
 idea_SIA_a_modern_economy: "Современная экономика"
 idea_SIA_death_to_communists: "Смерть коммунистам"
 idea_SIA_death_to_communists_desc: "В рядах армии преобладают антикоммунистические настроения, которые облегчают нашу борьбу с коммунистическими войсками Китая."
 idea_SIA_death_to_nationalists: "Смерть националистам"
 idea_SIA_death_to_nationalists_desc: "В рядах армии преобладают антинационалистические настроения, которые облегчают нашу борьбу с националистическими войсками Китая."
 idea_SIA_breaking_the_burmese_line: "Прорыв Бирманской линии"
 idea_SIA_the_yellow_dossier: "Желтое досье"
 idea_SIA_the_yellow_dossier_desc: "Засекреченный доклад о состоянии промышленности в стране обратил наше внимание на недостатки системы, которые уже глубоко укоренились. Плоды предлагаемых в докладе реформ сегодня видны на примере заводов, хотя цена воплощения этих предложений в жизнь относительно высока."
 idea_SIA_the_yellow_dossier_2: "$idea_SIA_the_yellow_dossier$"
 idea_SIA_the_yellow_dossier_2_desc: "$idea_SIA_the_yellow_dossier_desc$"
 idea_SIA_pacific_war_preparations: "Подготовка к войне в Тихом океане"
 idea_SIA_a_race_against_time: "Гонка со временем"
 idea_SIA_overheated_economy: "Перегретая экономика"
 idea_SIA_overheated_economy_desc: "Экономика вышла далеко за пределы своих возможностей. Потребительский спрос обогнал предложение, а взрывной рост строительства остановился на время охлаждения экономики."
 idea_SIA_ending_military_grift: "Предотвращение растрат среди военных"
 idea_SIA_the_military_oversight_bureau: "$SIA_military_oversight_bureau$"
 idea_SIA_the_military_oversight_bureau_desc: "Бюро военного надзора требует от новых командиров соответствовать строгим стандартам и ускоряет развитие опытных кадров для офицерского корпуса."
 idea_SIA_public_credit_debt: "Долг по государственному кредиту"
 idea_SIA_public_credit_debt_desc: "Задолженности по кредиту — одна из основных статей государственных расходов. На оплату долгов уходят ресурсы, которые можно было бы пустить на развитие производства и товары гражданского назначения."
 idea_SIA_public_credit_debt_2: "Выплата долга по государственному кредиту"
 idea_SIA_public_credit_debt_2_desc: "$idea_SIA_public_credit_debt_desc$"
 idea_SIA_revision_of_unequal_treaties: "Пересмотр неравных договоров"
 idea_SIA_purged_military: "Чистка среди военных"
 idea_SIA_purged_military_desc: "После устранения политически ненадёжных офицеров в войсках стало не хватать опытных командиров, что плохо влияет на организацию и подготовку оставшегося личного состава."
 SIA_khana_ratsadon_inlay_title: "Народная партия"
 SIA_civilian_wing_label: "Гражданское крыло"
 SIA_military_wing_label: "Военное крыло"
 SIA_wing_state_full_support: "§GПолная поддержка§!"
 SIA_wing_state_slight_support: "§GНезначительная поддержка§!"
 SIA_wing_state_neutral: "§YНейтралитет§!"
 SIA_wing_state_opposition: "§RОппозиция§!"
 SIA_wing_state_rebellious: "§RМятеж§!"
 SIA_civilian_wing_history_tt: "Гражданскую фракцию Народной партии возглавляют прогрессивные управленцы и технократы. Самый выдающийся её деятель — §YПриди Паномионг§!. Этот реформатор, изучавший юриспруденцию во Франции, стремится провести на родине земельную реформу, ввести государственное планирование экономики и установить конституционно-демократический строй, что пойдёт на пользу простому народу.\n\nГражданское крыло в основном поддерживает §Gразвитие§! и инвестиции в образование, инфраструктуру и промышленность. Оно не одобряет большие расходы на армию и опасается уклона в авторитаризм. Чтобы заручиться его поддержкой, нужно принимать политики, которые способствуют модернизации государства и защите конституционной формы правления."
 SIA_military_wing_history_tt: "Военную фракцию Народной партии возглавляют офицеры, которые считают себя истинными стражами революции. Самый целеустремленный её деятель — §YПлек Пибунсонгкрам§!. Этот полковник открыто восхищается националистическими движениями Европы.\n\nВоенное крыло выступает §Gза перевооружение§! и желает видеть государство сильным и централизованным. Оно с подозрением относится к экономическим идеям Приди (военные считают их слишком безрассудными и радикальными), а также не терпит, когда гражданские лица вмешиваются в вопросы обороны. Чтобы заручиться его поддержкой, нужно инвестировать в армию и принимать политики, которые способствуют демонстрации национальной мощи."
 idea_SIA_wing_promotion_disruption: "Фракционные перестановки"
 idea_SIA_wing_promotion_disruption_desc: "Открытая поддержка одного из крыльев Народной партии нарушила баланс в правительстве. Обделённая фракция саботирует принятие решений, привычный армейский уклад нарушен, госаппарат будет парализован, пока новый порядок не укоренится."
 idea_SIA_military_wing_unrest: "Восстание военного крыла"
 idea_SIA_military_wing_unrest_desc: "Терпение офицеров вновь иссякло. Не сумев напрямую захватить власть, военное крыло теперь выплёскивает ярость через саботаж, дезертирство и прямой отказ подчиняться. Боеспособность армии будет падать, пока недовольных не прижмут к ногтю."
 idea_SIA_civilian_wing_unrest: "Восстание гражданского крыла"
 idea_SIA_civilian_wing_unrest_desc: "Фракция Приди снова потеряла веру в правительство. Лишённое второго шанса получить власть, гражданское крыло принялось организовывать забастовки, ставить бюрократические препоны и развернуло агитацию в городах. Сложившаяся ситуация будет тормозить экономику и мешать управлению страной, пока страсти не улягутся."
 idea_SIA_unwavering_civilian_support: "Непоколебимая гражданская поддержка"
 idea_SIA_unwavering_civilian_support_desc: "Военное крыло распущено, вопрос легитимности разрешён, и соперников у гражданской администрации не осталось. Технократы Приди, свободные от вмешательства армии, берутся за работу с решительностью, которой от старой коалиции невозможно было ожидать."
 idea_SIA_unified_khana_ratsadon: "Объединённая народная партия"
 idea_SIA_unified_khana_ratsadon_desc: "С прежними распрями между военными и гражданскими покончено. Теперь, когда оба крыла Народной партии наконец движутся в одном направлении, правительство способно действовать с невиданной прежде сплочённостью. Военные, чиновники и промышленники отныне работают как единое целое."
