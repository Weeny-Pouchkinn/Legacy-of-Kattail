 ############
 idea_SIA_civilian_full_support: "Гражданское крыло: §Gполная поддержка§!"
 idea_SIA_civilian_full_support_desc: "Гражданское крыло целиком и полностью поддерживает правительство. Управляющие и технократы охотно делятся своим опытом и ведут страну к новым вершинам."
 idea_SIA_civilian_slight_support: "Гражданское крыло: незначительная поддержка"
 idea_SIA_civilian_slight_support_desc: "Гражданское крыло в целом поддерживает курс правительства. Результаты этой поддержки скромны, но всё же ощутимы."
 idea_SIA_civilian_neutral: "Гражданское крыло: нейтралитет"
 idea_SIA_civilian_neutral_desc: "Гражданское крыло не помогает, но и не мешает правительству. В администрации ощущается нехватка задора, свойственного политическим идеологиям."
 idea_SIA_civilian_opposition: "Гражданское крыло: оппозиция"
 idea_SIA_civilian_opposition_desc: "Гражданское крыло противодействует правительству. Чиновники работают неохотно, а бюджетные средства используются не по назначению. Государственная машина функционирует с трудом."
 idea_SIA_civilian_rebellious: "Гражданское крыло: §Rмятеж§!"
 idea_SIA_civilian_rebellious_desc: "Гражданское крыло перешло к открытому неповиновению. В стране растёт нестабильность, а угроза политического раскола с каждым днём ощущается всё сильнее."
 idea_SIA_military_full_support: "Военное крыло: §Gполная поддержка§!"
 idea_SIA_military_full_support_desc: "Военное крыло целиком и полностью поддерживает правительство. Вербовка и производство оружия ведутся с помощью офицеров, государственные цели достигаются благодаря ресурсам армии."
 idea_SIA_military_slight_support: "Военное крыло: незначительная поддержка"
 idea_SIA_military_slight_support_desc: "Военное крыло в целом соглашается сотрудничать. Благодаря его поддержке несколько выросли масштабы вербовки и производства, хотя потолок не достигнут."
 idea_SIA_military_neutral: "Военное крыло: нейтралитет"
 idea_SIA_military_neutral_desc: "Военное крыло не занимает какую-либо позицию. Солдаты выполняют свой долг без энтузиазма, но при этом не ослушиваются приказов. Армия держит руку на пульсе."
 idea_SIA_military_opposition: "Военное крыло: оппозиция"
 idea_SIA_military_opposition_desc: "Военное крыло противодействует правительству. Офицеры мешают производству, а солдаты постепенно разочаровываются в правительственном курсе."
 idea_SIA_military_rebellious: "Военное крыло: §Rмятеж§!"
 idea_SIA_military_rebellious_desc: "Военное крыло готово перейти к открытому неповиновению. Офицеры саботируют призыв, производство оружия страдает, а по стране бродит призрак государственного переворота."
 idea_SIA_defenders_of_constitutional_liberty: "Защитники конституционных свобод"
 idea_SIA_civil_service_heroism_1: "Героизм чиновников"
 idea_SIA_civil_service_heroism_1_desc: "Чиновничий аппарат показал себя с наилучшей стороны: благодаря самоотдаче и опыту государственных служащих развитие науки и страны в целом идёт быстрее, чем прежде."
 idea_SIA_civil_service_heroism_2: "$idea_civil_service_heroism_1$"
 idea_SIA_civil_service_heroism_2_desc: "$idea_SIA_civil_service_heroism_1_desc$"
 idea_SIA_redirected_military_funds: "Перенаправление военных средств"
 idea_SIA_thai_irredentism: "Тайский ирредентизм"
 idea_SIA_oss_special_forces_training: "Подготовка спецназа УСС"
 idea_SIA_seized_japanese_funds: "Конфискованные японские средства"
 idea_SIA_seized_japanese_funds_desc: "После разрыва отношений с японцами оставленные ими средства и материальные запасы переходят в наше распоряжение, и теперь их можно направить на расширение строительства и промышленного производства."
 idea_SIA_oss_special_forces_training_desc: "Под руководством специалистов УСС наши агенты обучились искусству саботажа, тайного внедрения и воздушно-десантных операций. Полученные навыки превратили наши спецслужбы в грозную силу."
 idea_SIA_sold_privy_purse_lands: "Продажа земель короны"
 idea_SIA_sold_privy_purse_lands_desc: "Продажа королевских земель обеспечила приток капитала в казну, облегчила экономическое бремя и высвободила ресурсы, необходимые для строительства."
 idea_SIA_war_fervor: "Военный пыл"
 idea_SIA_bloodlusted_irredentism: "Кровожадный ирредентизм"
 idea_SIA_bloodlusted_irredentism_desc: "Территориальные притязания принесли свои кровавые плоды: солдаты сражаются так, будто искренне уверены, что возвращают отобранную захватчиком родную землю."
 idea_SIA_the_royal_police_counterweight: "Верность Королевской полиции"
 idea_SIA_civilian_technocrats_in_institutions: "Гражданские технократы"
 idea_SIA_civilian_technocrats_in_institutions_desc: "Благодаря гражданским экспертам в важнейших государственных институтах нам удалось нарастить добычу ресурсов и обеспечить чиновничий аппарат умелыми кадрами."
 idea_SIA_yuvachon: "Ювачон"
 idea_SIA_yuvachon_desc: "Молодёжь, воспитанная движением «Ювачон» в суровых армейских традициях, — не только будущие солдаты, но и носители националистической идеологии."
 idea_SIA_yuvachon_2: "$idea_SIA_yuvachon$"
 idea_SIA_yuvachon_2_desc: "$idea_SIA_yuvachon_desc$"
 idea_SIA_rebuilding_the_war_torn_economy: "Возрождение послевоенной экономики"
 idea_SIA_specialist_marine_forces: "Военно-морской десант специального назначения"
 idea_SIA_specialist_marine_forces_desc: "Специально обученные морские десантники — незаменимая сила в наступательных операциях на побережье."
 idea_SIA_rehabilitated_military: "Восстановление военной мощи"
 idea_SIA_desperate_gambit: "Отчаянный гамбит"
 idea_SIA_desperate_gambit_desc: "Карабкайся! Может быть, из этой ямы есть выход!"
 idea_SIA_purged_senior_military: "Чистка командного состава"
 idea_SIA_purged_senior_military_desc: "Признанные угрозой для государства старшие офицеры лишились своих должностей. От этого пострадали слаженность и профессионализм армии, которая осталась без опытных командиров."
 idea_SIA_cemented_control: "Железный контроль"
 idea_SIA_cemented_control_desc: "Правительство держит государственные институты железной хваткой. Политическая оппозиция отстранена от дел; шестерёнки государственной машины вращаются так, как угодно властям."
 idea_SIA_cemented_control_2: "Укрепление контроля"
 idea_SIA_cemented_control_2_desc: "$idea_SIA_cemented_control_desc$"
 idea_SIA_cemented_control_3: "Воинский долг тайца"
 idea_SIA_cemented_control_3_desc: "В случае войны, угрожающей суверенитету королевства и его народа, каждый достойный таец обязан сопротивляться оккупации любыми доступными средствами, будь то оружие или нечто иное."
 idea_SIA_suspend_ordinary_legal_procedures: "Отмена ординарных судебных процедур"
 idea_SIA_thai_cultural_mandates: "Тайские культурные наказы"
 idea_SIA_military_humiliation: "Военное унижение"
 idea_SIA_death_defiant: "Вопреки смерти"
 idea_SIA_death_defiant_desc: "Мы уже мертвы. Исполняй свой долг, пока можешь."
 idea_SIA_songsuradet_ascendant_0: "Возвышение Сонгсурадета"
 idea_SIA_songsuradet_ascendant_0_desc: "Не испугавшись гнева правительства, Пья Сонгсурадет сплотил своих сторонников и обрел еще большее влияние. Теперь его называют неуязвимым: он слишком прочно закрепился во власти, чтобы от него можно было избавиться.\nСкорее всего, он будет вмешиваться в государственную политику, замедляя принятие решений, чтобы снова не попасть под чистку."
 idea_SIA_songsuradet_ascendant_1: "$idea_SIA_songsuradet_ascendant_0$"
 idea_SIA_songsuradet_ascendant_1_desc: "$idea_SIA_songsuradet_ascendant_0_desc$"
