 AST_australian_culture_investments_idea_desc: "§W§YПри удалении§!:\nДобавляется §Y«Чувство принадлежности»§!. Эффекты:\nСтабильность: §G+10,00%§!\nПоддержка войны: §G+10,00%§!.§!\n"
 AST_a_sense_of_place: "Чувство принадлежности"
 AST_a_sense_of_place_desc: "Национальное самосознание — сила, скрепляющая народ. Процветающая культура объединила всех австралийцев, и сегодня они готовы дать отпор любому, кто посягнет на их границы."
 AST_a_sense_of_place_upgraded: "Чувство принадлежности"
 AST_a_sense_of_place_upgraded_desc: "Раньше национальная идентичность просто тихо расцветала, но теперь у неё появились зубы. Теперь это не просто гордость за родную землю и образ жизни — это убеждённость в том, что Австралия создала нечто, за что стоит сражаться. Мужчины и женщины, живущие под Южным Крестом, готовы дать бой."
