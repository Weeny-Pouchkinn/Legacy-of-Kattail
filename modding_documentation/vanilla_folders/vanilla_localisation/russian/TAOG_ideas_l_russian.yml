 AST_anti_fascist_measures: "Антифашистские меры"
 AST_anti_fascist_measures_desc: "Фашизм еще не успел впиться когтями в Австралию — на радость сторонникам демократии, не желающим видеть эту чуму. Следственная комиссия Союза будет наблюдать за подозрительными лицами и своевременно их задерживать, чтобы не дать фашистским группировкам набрать влияние."
 ABDA_corps_expeditionnaire_spirit: "Экспедиционный корпус"
 ABDA_corps_expeditionnaire_spirit_desc: "Французские войска, направленные в Тихий океан, закалены службой в колониях и привыкли действовать вдали от дома в тяжёлых условиях. Благодаря опыту войны в Юго-Восточной Азии они хорошо знают местность и японскую тактику, что обеспечивает им надёжную защиту от вражеского натиска."
 ABDA_maintain_strategic_flexibility_spirit: "Стратегическая гибкость"
 ABDA_maintain_strategic_flexibility_spirit_desc: "Продукция американской промышленности направлена в Тихий океан, верфи работают в усиленном режиме, чтобы поддерживать флот, способный демонстрировать силу на бескрайних просторах океана. США отказались направить все усилия на какой-то один фронт и создали себе условия, при которых мощь их флота может быть направлена туда, где необходима в данный момент."
 AST_toe_the_line_spirit: "Политический курс"
 AST_toe_the_line_spirit_desc: "Государство объяснило необходимость пойти на жертвы, и народ взял на себя этот подвиг. Выдача продуктов по карточкам, увеличенные рабочие часы и перенаправление гражданской промышленности в интересах страны привели к тому, что правительство получило ранее недоступные ресурсы. Это суровые и непопулярные меры."
