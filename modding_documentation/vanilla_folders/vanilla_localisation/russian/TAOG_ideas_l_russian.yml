 NZL_railways_board: "Управление государственных железных дорог"
 NZL_railways_board_desc: "Управление государственных железных дорог было создано в 1931 году в рамках реструктуризации Министерства железных дорог. Предполагалось, что отделение этой организации от правительства позволит повысить ее эффективность, однако на практике ей так и не удалось модернизировать железнодорожную сеть. Ввиду этого многие призывают правительство упразднить Управление и снова взять железные дороги под свой контроль."
 NZL_great_depression: "Великая депрессия"
 NZL_great_depression_desc: "Мировой кризис 1929 года нанес огромный ущерб Новой Зеландии, чья экономика главным образом основывалась на сельском хозяйстве. Поскольку спрос на новозеландские продукты резко упал, многие фермеры остались без работы, а падение их покупательной способности привело к развалу остальных отраслей экономики. После нескольких лет жизни в таких тяжелых условиях народ начал требовать серьезных перемен."
 NZL_commonwealth_loyalty: "Верность Британскому Содружеству"
 NZL_commonwealth_loyalty_desc: "Новая Зеландия остается приверженным участником Содружества и признает британского монарха своим законным главой. При этом новозеландская экономика плотно интегрирована в общую экономическую систему империи."
 NZL_national_coal_board_idea: "Национальное управление угледобычи"
