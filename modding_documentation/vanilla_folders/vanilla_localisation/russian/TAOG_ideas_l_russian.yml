 idea_INS_volksraad: "Фольксраад"
 idea_INS_volksraad_desc: "В 1918 году в рамках «политики этичности» Нидерланды учредили фольксраад — совет, в который входят представители населяющих архипелаг этнических меньшинств и культур. В теории этот орган демократичен, однако на практике генерал-губернатор и голландская корона обладают безусловным правом вето."
 INS_volksraad_custom_tt: "Можно нанимать §Yсоветников фольксраада§!\nМожно использовать §Yрешения фольксраада§!"
 INS_great_depression: "Великая депрессия"
 INS_great_depression_desc: "Хотя сама по себе Великая депрессия практически не затронула Ост-Индию, введенные другими странами протекционистские меры оказали разрушительный эффект на экономику колонии, которая сильно зависит от экспорта каучука, нефти и прочего сырья."
 INS_great_depression_tt: "§Y«$INS_great_depression$»§! изменится на:"
 INS_dutch_east_indies: "Некомпетентная администрация"
 INS_dutch_east_indies_desc: "Ост-Индия — обширный архипелаг, заселенный сотнями непохожих друг на друга народов и потому требующий особого подхода к управлению. Ситуация осложняется движениями за независимость, культурными барьерами и последствиями Великой депрессии, поэтому неудивительно, что колониальные власти с большим трудом справляются со своими задачами. Принятая в 1918 году «политика этичности» направлена именно на борьбу с трудностями: принятие достойного трудового законодательства и представление интересов меньшинств. К сожалению, из-за Великой депрессии эта политика пока малоэффективна."
 INS_dutch_east_indies_tt: "§Y«$INS_dutch_east_indies$»§! изменится на:"
 INS_volksraad_tt: "§Y«$INS_dutch_east_indies$»§! изменится на:"
 INS_royal_netherlands_east_indies_army_desc: "Koninklijk Nederlands Indisch Leger (KNIL), или же Королевская голландская ост-индская армия (КГОИА), — традиционные вооруженные силы Голландской Ост-Индии, действующие независимо от Нидерландов. В их рядах служат и европейские, и индонезийские солдаты, хотя набор в армию значительно осложняется культурными и языковыми барьерами между жителями архипелага."
 idea_INS_netherlands_most_precious_jewel: "Главная ценность Нидерландов"
 idea_INS_netherlands_most_precious_jewel_desc: "За последние 350 лет узы, связывающие власти Голландской Ост-Индии и правительство Нидерландов, стали по-настоящему крепкими. Ост-Индию нередко называют самой яркой жемчужиной голландской короны, и сама корона не готова расставаться со своим главным достоянием."
 INS_netherlands_most_precious_jewel_tt: "£GFX_trigger_no Уровень автономии можно поднять до «Свободного»"
