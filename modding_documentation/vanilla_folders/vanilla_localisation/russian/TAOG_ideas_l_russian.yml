 idea_SIA_rebuilding_after_civil_war_desc: ""
 idea_SIA_anti_burmese_sentiment: "Антибирманские настроения"
 idea_SIA_sued_king_prajadhipok: "Суд короля Прачадипока"
 idea_SIA_pan_thaiism: "Пантаизм"
 idea_SIA_pan_thaiism_desc: "Основа идеологии пантаизма — объединение всех тайских народов вокруг одного государства. Пантаизм призывает к экспансии, а боевой дух народа растёт в наступлениях."
