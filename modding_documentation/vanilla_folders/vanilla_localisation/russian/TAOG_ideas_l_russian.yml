 AST_all_dressed_up_idea_tt: "§Y2§! §Yвоенных завода§! вне карты"
 AST_no_foreign_battlefields_idea_1: "Отказ от участия в зарубежных войнах"
 AST_voluntary_foreign_service_idea: "Добровольная служба за рубежом"
 AST_liberty_loans_idea: "Займы свободы"
 AST_faction_training_initiative_idea_1: "Программа подготовки войск"
 AST_faction_training_initiative_idea_1_desc: "Программа совместной подготовки войск Тихоокеанского сопротивления гарантирует, что солдаты всех стран, входящих в эту фракцию, пройдут стандартизированное военное обучение."
 AST_faction_training_initiative_idea_1_tt: "\nЭффекты духа удвоятся, если в альянсе §Y[AST.GetFactionName]§! будет более §Y4§! участников"
 AST_faction_training_initiative_idea_2: "Программа подготовки войск"
 AST_faction_training_initiative_idea_2_desc: "Программа совместной подготовки войск Тихоокеанского сопротивления гарантирует, что солдаты всех стран, входящих в эту фракцию, пройдут стандартизированное военное обучение."
 AST_faction_training_initiative_idea_2_tt: "\nЭффекты духа будут снижены вдвое, если в альянсе §Y[AST.GetFactionName]§! будет менее §Y5§! участников"
