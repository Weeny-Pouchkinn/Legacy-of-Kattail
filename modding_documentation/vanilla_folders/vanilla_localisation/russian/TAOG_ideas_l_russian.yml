 INS_bangka_bauxite_export: "Экспорт бокситов с Банки"
 INS_bangka_bauxite_export_desc: "На островах Банка и Белитунг сосредоточена значительная доля мировых запасов бокситов — руды, необходимой для производства алюминия. Мы могли бы вложить средства в алюминиевую промышленность, однако залежи бокситов здесь настолько велики, что массовая продажа сырья окажется выгоднее."
