l_russian:
 #Shortcuts
 CZE_military_path_shortcut: "Вооруженные силы"
 CZE_economic_path_shortcut: "Экономика"
 CZE_diplomacy_path_shortcut: "Дипломатия"
 CZE_fort_path_shortcut: "Строительство укреплений"
 CZE_skoda_priority_shortcut_name: "Приоритет «Шкоды»"
 CZE_political_path_shortcut: "Политика"
 # Č does show when scrolling through focuses, but not in the detailed focus view title (does work in the description though)
 CZE_coalition_building: "Создание коалиции"
 CZE_coalition_building_desc: "Коалиция, образовавшаяся в результате выборов, должна добиться единства среди участников, чтобы действовать эффективно. Недавняя отставка Яна Малипетра с поста премьер-министра оказала дополнительное давление на широкую коалицию и усилила необходимость консолидировать поддержку."
 CZE_merge_the_paramilitaries: "Объединение военизированных групп"
 CZE_merge_the_paramilitaries_desc: "Наши вооруженные формирования разделились на несколько групп. Чтобы появилась возможность использовать боевиков в военных целях, сперва нужно заставить их объединиться."
 CZE_integrated_paramilitaries: "Интегрировать вооруженные формирования"
 CZE_integrated_paramilitaries_desc: "Даже если военные не оценят идею интегрировать военизированные группы в армию, это решение позволит нам увеличить резервы, когда это будет необходимо."
 CZE_wielding_the_hammer: "Бразды правления"
 CZE_wielding_the_hammer_desc: "Мы можем значительно ускорить процесс законотворчества за счет нашего большинства в Национальном собрании. Сейчас крайне важно привести наш законодательный институт в порядок."
 CZE_emergency_measures: "Экстренные меры"
 CZE_emergency_measures_desc: "Необходимо принять экстренные меры для разрешения многочисленных кризисов, угрожающих нашему народу, и одновременно усилить надзор за идеологически неблагонадежными элементами. Таким образом мы будем готовы достойно встретить грядущие испытания."
 CZE_king_of_the_castle: "Король Замка"
 CZE_king_of_the_castle_desc: "Все мы знаем, кто является главой нашего государства. В наше нестабильное время стоит отбросить любые сомнения: $CZE_edvard_benesh$ должен получить больше власти. От этого зависит безопасность нашей страны."
 CZE_closer_ties_with_the_moderate_germany_parties: "Сближение с умеренными судетскими партиями"
 CZE_closer_ties_with_the_moderate_germany_parties_desc: "Некоторые судетские партии хотят сотрудничать с нашей коалицией и налаживать контакты с правительством. Давайте укрепим эти связи."
 CZE_complete_reconciliation: "Полное примирение"
 CZE_complete_reconciliation_desc: "Мы приложили много усилий, чтобы сформировать доверие. Пора примириться с нашими соотечественниками."
 CZE_complete_reconciliation_cooldown_flag: "Выполнен фокус «§Y$CZE_closer_ties_with_the_moderate_germany_parties$§!»"
 CZE_complete_reconciliation_cooldown_flag_tt: "В настоящее время: [?CZE_complete_reconciliation_cooldown_flag:days|Y0]"
 CZE_bastion_of_liberty: "Бастион свободы"
 CZE_bastion_of_liberty_desc: "В этом десятилетии мы стали одной из немногих по-настоящему плюралистических стран в Европе к востоку от Рейна. Давайте сделаем всё, чтобы люди этого не забыли."
 CZE_standing_against_the_storm: "Наперекор буре"
 CZE_standing_against_the_storm_desc: "Несмотря на наши недостатки и возможную неподготовленность, мы встретим любое испытание и выдержим надвигающуюся бурю."
 CZE_truth_prevails: "Истина торжествует"
 CZE_truth_prevails_desc: "Перед лицом невероятных испытаний и непосильных задач наша страна не забывает, что в конце концов наш девиз, «Истина торжествует», обернется реальностью. Стремитесь к истине, услышьте истину, и она восторжествует."
 CZE_negotiations_with_the_autonomous_bloc: "Переговоры с Автономным блоком"
 CZE_negotiations_with_the_autonomous_bloc_desc: "Чтобы создать коалицию, которая не передаст власть бесчисленным прихвостням Бенеша в Национальном собрании, нам придется сотрудничать с Автономным блоком, однако его безоговорочная поддержка дорого нам обойдется."
 CZE_slovakia_autonomy_agreement: "Соглашение об автономии Словакии"
 CZE_slovakia_autonomy_agreement_desc: "Автономные блоки согласны работать с нашей коалицией, если наше правительство согласится на предоставление автономии. Цена высока, но если мы не выполним свою часть сделки, последствия будут еще хуже."
 CZE_slovakia_autonomy_agreement_tt: "§Y[RUT.GetName]§! захоч[FROM.GetNameEndRuPresentEtUt] соглашение об автономии, аналогичное тому, что заключили мы и §Y[SLO.getname]§!!"
 CZE_slovakia_autonomy_agreement_2_tt: "При выборе этого фокуса $CZE_the_autonomous_bloc_demands$ будут отложены на §Y35 дней§!."
 CZE_topple_the_king: "Свержение короля"
 CZE_topple_the_king_desc: "Наше правительство страдает от удушающего влияния Эдварда Бенеша. Благодаря многочисленным лоялистам в парламенте у него больше полномочий, чем у президента. Но сейчас обстоятельства сложились очень удачно, и мы сможем значительно снизить его влияние в верхней палате."
 CZE_comprise_with_the_carpathians: "Компромисс с карпатцами"
 CZE_comprise_with_the_carpathians_desc: "Карпатская Русь начинает требовать заключение соглашения о федерализации, схожее с тем, что мы заключили с [SLO.GetNameRuInst]. Это значительно ослабит наши позиции во всём регионе в целом и особенно в регионе [9.GetName]. Разумнее будет заключить с ними сделку, но не удовлетворять их требования полностью."
 CZE_the_rut_demands_add_35_CZE_comprise_with_the_carpathians_tt: "При выборе этого фокуса $CZE_the_rut_demands$ будут отложены на §Y35 дней§!."
 CZE_cut_carpathia_loose: "Освобождение Карпатии"
 CZE_cut_carpathia_loose_desc: "На фоне выделения Словакии в субъект федерации Карпатская Русь надеется добиться схожего соглашения. Несмотря на нецелесообразность подобных мер, без прямого контроля над Словакией нам будет сложно поставить Русь на место. Возможно, стоит просто уступить требованиям."
 CZE_compromise_with_the_veteran_agrarian: "Компромисс с ветеранами-аграриями"
 CZE_compromise_with_the_veteran_agrarian_desc: "Старая гвардия аграриев мешает нам налаживать отношения с растущим городским электоратом. Для достижения своих целей нам придется пойти на компромисс."
 CZE_reorient_the_broad_coalition: "Перестройка широкой коалиции"
 CZE_reorient_the_broad_coalition_desc: "Многие годы правительство возглавляла широкая коалиция. В последнее время многочисленные партии, входящие в ее состав, превратили коалицию в неповоротливого монстра. Давно пора пересмотреть политику коалиции и принцип участия в ней министров."
 CZE_leverage_sokol: "Сокольское движение"
 CZE_leverage_sokol_desc: "Сокольское движение уже не первое десятилетие играет важную роль в нашей стране. В период кризиса мы при необходимости можем использовать его для обучения военизированных формирований и рекрутов для армии."
 CZE_urbanist_policies: "Политика урбанизма"
 CZE_deepend_ties_with_the_trademans: "Укрепить связи с торговцами"
 CZE_deepend_ties_with_the_trademans_desc: "Торговая партия популярна среди городских избирателей среднего класса. Благодаря поддержке и сотрудничеству с ней мы сможем наладить связи с городским электоратом, не отворачиваясь от нашей сельской электоральной базы."
 CZE_apart_but_togather: "Разделены, но едины"
 CZE_apart_but_togather_desc: "У наших регионов сейчас наибольшая автономия в истории страны, и в то же время как нация мы стали сильнее, чем когда-либо. Мы готовы ко всему."
 CZE_contact_henlein: "Связаться с Генлейном"
 CZE_contact_henlein_desc: "$CZE_konrad_henlein$ не первый год не дает покоя нашему правительству. Но, возможно, в свете недавних событий на международной арене пришло время для диалога с ним."
 CZE_contact_henlein_cooldown_flag: "Выполнен фокус §Y$CZE_no_compromise_with_the_sdp$§!"
 CZE_contact_henlein_cooldown_flag_tt: "В настоящее время: [?CZE_contact_henlein_cooldown_flag:days|Y0]"
 CZE_contact_henlein_focus_warning_tt: "Если мы выполним фокус §Y$CZE_no_compromise_with_the_sdp$§!, нам придется подождать §Y350§! дней прежде чем выбирать этот §Yнациональный фокус§!."
 CZE_contact_henlein_focus_order_warning_tt: "Если мы выполним фокус §Y$CZE_no_compromise_with_the_sdp$§! после завершения этого §Yнационального фокуса§!, §Y$CZE_konrad_henlein$§! отправится в отставку."
 CZE_no_compromise_with_the_sdp: "Продолжить блокировать СнП"
 CZE_no_compromise_with_the_sdp_desc: "СнП нечего предложить нашей коалиции. Они лишь подогревают политическую напряженность и стараются опорочить действия нашего правительства. Во имя эффективного управления нужно и дальше не позволять этой партии войти в какую-либо коалицию."
 CZE_no_compromise_with_the_sdp_cooldown_flag: "Выполнен фокус §Y$CZE_contact_henlein$§!"
 CZE_no_compromise_with_the_sdp_cooldown_flag_tt: "В настоящее время: [?CZE_no_compromise_with_the_sdp_cooldown_flag:days|Y0]"
 CZE_no_compromise_with_the_sdp_focus_warning_tt: "Если мы выполним фокус §Y$CZE_contact_henlein$§!, нам придется подождать §Y350§! дней, прежде чем выбирать этот §Yнациональный фокус§!."
 # CZE_economic_integration: "Economic Integration"
 # CZE_economic_integration_desc: "Why stop at a customs union? Economic integration will further grow our economies and ensure our future is an affluent one for all members."
 CZE_form_a_federation: "Создание федерации"
 CZE_form_a_federation_desc: "Мечта о центрально-европейской федерации перестала быть недосягаемой. Мы можем создать ее, стать оплотом демократии и получить возможность самостоятельно противостоять великим державам!"
 CZE_bend_the_bars: "$ITA_bend_the_bars$"
 CZE_bend_the_bars_desc: "$GER_european_confederation_desc$"
 CZE_reassure_the_army: "Успокоить армию"
 CZE_reassure_the_army_desc: "Недавние решения и политические программы правительства вызывают беспокойство в рядах армии. Пора успокоить военных и заверить в нашей поддержке независимо от высказываний и действий правительства."
 CZE_outreach_to_the_western_powers: "Дальнейшие контакты с западными державами"
 CZE_outreach_to_the_western_powers_desc: "Западные демократии уверяют нас в своей поддержке, но мы должны расширять контакты с ними, чтобы в решающий момент они не отказались от своих обещаний."
 CZE_demand_guarantees: "Потребовать более надежные гарантии"
 CZE_demand_guarantees_desc: "Несмотря на договоры и альянсы, нам необходимо удостовериться, что партнеры не бросят нас в час нужды лишь потому, что им так проще. Нам нужны надежные гарантии."
 CZE_guardian_of_central_europe: "Страж Центральной Европы"
 CZE_guardian_of_central_europe_desc: "Наше положение позволяет нам стать хранителями демократии в Центральной Европе. Мы можем стать защитниками стран, не способных постоять за себя, и обеспечить победу демократии."
 CZE_central_european_faction: "Властитель Центральной Европы"
 CZE_central_european_faction_desc: "Хоть мы и сделали упор внутреннее развитие, не слишком полагаясь на дипломатию, влиянием нужно распоряжаться с умом. Возможно, пора обратить взгляд на мир вокруг."
 CZE_strike_at_the_heart_of_bolshevism: "[THIS.GetAntiSovietFocusName]"
 CZE_strike_at_the_heart_of_bolshevism_1: "Удар в сердце большевизма"
 CZE_strike_at_the_heart_of_bolshevism_2: "Защитить восточный фланг"
 CZE_strike_at_the_heart_of_bolshevism_desc: "Расширение [SOV.GetNameRuGen] угрожает существованию Европы и нашей нации. Мы должны стать бастионом на их пути."
 CZE_destroy_the_fascist_threats: "Уничтожить фашистскую угрозу"
 CZE_destroy_the_fascist_threats_desc: "[CZE_get_fascist_threats_desc]"
 CZE_destroy_the_fascist_threats_desc_enemy_ger: "Мы все знаем, кто является главной угрозой для мира в Европе. [GER.GetNameRuAcc] необходимо остановить, и как можно скорее. Возможно, это придется сделать нам, раз никто больше не решается."
 CZE_destroy_the_fascist_threats_desc_backup: "Для нашей безопасности крайне важно, чтобы соседние страны перестали поддерживать экспансионистские настроения, которые рано или поздно могут быть направлены и на нас."
 CZE_peace_on_our_time: "Мир для нашего поколения"
 CZE_peace_on_our_time_desc: "Слишком долго мы прозябали на задворках европейских международных отношений. Довольно! Мы твердо стоим на ногах и способны выдвигать собственные требования. В мире и на войне."
 CZE_reach_out_for_military_assistance: "Обратиться за военной помощью"
 CZE_free_tuka: "Освободить Войтеха Туку"
 CZE_free_tuka_desc: "Войтех Тука отсидел свой срок, и вместо того, чтобы выдумывать поводы оставить его в заключении, мы могли бы своевременно освободить его и найти ему место в правительстве. Пусть лучше он работает на нас, чем против нас."
 CZE_grow_the_anglo_czechoslovak_prague_credit_bank: "Англо-чехословацкий банк"
 CZE_grow_the_anglo_czechoslovak_prague_credit_bank_desc: "Англо-чешский кредитный банк был одним из основных двигателей нашей промышленности. Без его средств мы не сумели бы добиться столь внушительных успехов в экспорте. Открытие новых филиалов в Нью-Йорке и укрепление связей с [ENG.GetNameRuInst] поспособствует дальнейшему развитию банка. Кроме того, у [ENG.GetNameRuGen] появится заинтересованность в сохранении нашего государства."
 CZE_feeding_the_alligator: "Корм для крокодила"
 CZE_feeding_the_alligator_desc: "Планы [GER.GetNameRuGen] на Судеты угрожают самому существованию нашей нации. Если дать им то, что они хотят, они оставят нас в покое. Так ведь?"
 CZE_complete_capitulation: "Полная капитуляция"
 CZE_complete_capitulation_desc: "Что мы можем сделать, кроме как сдаться? У нас нет сил противиться надвигающейся буре. Возможно, если мы заключим сделку с [GER.GetNameRuInst], пока у нас еще есть возможность поторговаться, мы сохраним подобие независимости под их игом."
 CZE_stabilize_the_protectorate: "Стабилизировать протекторат"
 CZE_stabilize_the_protectorate_desc: "Протекторат далек от стабильности. Нужно постараться убедить наше население в том, что мы легитимное правительство, заботящееся о его нуждах."
 CZE_stabilize_the_protectorate_unretire_henlein_tt: "Возвращает §YКонрада Генлейна§! из отставки в §Y[ROOT.GetNameRuPrep]§!."
 CZE_full_faith_in_hacha: "Полная вера в Гаху"
 CZE_full_faith_in_hacha_desc: "Эмиль Гаха пользуется куда большей популярностью у народа, чем Эммануэль Моравец. Его действия вызывают вопросы, но сместить более популярного лидера не получится."
 CZE_moravecs_bohemia: "Богемия Моравеца"
 CZE_moravecs_bohemia_desc: "Поговаривают, что Эмиль Гаха ведёт подрывную деятельность против нового правительства. Если мы хотим добиться успеха и процветания, нам потребуется руководство, полностью принимающее идеологию нашего сюзерена."
 CZE_form_the_government_army: "Сформировать правительственную армию"
 CZE_form_the_government_army_desc: "Ради будущих успехов страны необходимо сформировать новую армию, избавленную от недостатков старой. Ее руководство должно разделять взгляды правительства."
 CZE_forced_administration_of_companies: "Принудительное управление компаниями"
 CZE_forced_administration_of_companies_desc: "Несмотря на значительный надзор, некоторые компании до сих пор нам неподконтрольны. Пора насильственно подчинить их нашей администрации."
 CZE_revisit_custom_union_talks: "Повторные переговоры о таможенном союзе"
 CZE_revisit_custom_union_talks_desc: "Не со всеми соседями нам удалось договориться о таможенном союзе. Пришло время снова пригласить их в наш таможенный союз."
 CZE_revisit_custom_union_talks_tt: "Мы всё равно сможем убедить их присоединиться к нам иными §Yметодами§!."
 CZE_revisit_custom_union_talks_2_tt: "Они более охотно примут наши требования о вступлении в федерацию."
 CZE_reintegrate_cross_border_rail_connections: "Улучшить международные железные дороги"
 CZE_reintegrate_cross_border_rail_connections_desc: "Развитие железных дорог, связывающих нас с соседями, поможет добиться их благосклонности. В особенности если мы рассчитываем укрепить экономические связи."
 CZE_reintegrate_cross_border_rail_connections_flag: "Международные железные дороги улучшены"
 CZE_vonapo_20: "ВОНАПО-20"
 CZE_vonapo_20_desc: "Не только мы видим растущую угрозу [GER.GetNameRuGen], и это позволило подготовить план сотрудничества с [SOV.GetNameRuInst] в сборе разведданных, которые помогут нам подорвать [GER.GetAdjRuLower]ие амбиции."
 CZE_increase_funding_from_moscow: "Дополнительные средства из города [SOV.capital.GetCapitalVictoryPointName]"
 CZE_increase_funding_from_moscow_desc: "[ROOT.GetCommunistParty] испытывает настолько острую нехватку средств, что оплачивает аренду помещений из зарплаты своих представителей. Для дальнейшего роста нужно попросить [SOV.GetNameRuAcc] о дополнительном финансировании, и тогда мы сможем распространять свою газету и привлечь новых членов."
 CZE_zdenek_fierlinger_tt: "Назначить советника по имени §Y$CZE_zdenek_fierlinger$§!"
 CZE_expand_the_communist_press: "Расширение коммунистической прессы"
 CZE_expand_the_communist_press_desc: "Наша газета «Красное право» может стать источником сведений для тех, кто сейчас не читает газет. Нужно лишь увеличить финансирование."
 CZE_anti_rearmament_propaganda: "Пропаганда против перевооружения"
 CZE_anti_rearmament_propaganda_desc: "После падения фашистского правительства наш главный противник, [GER.GetNonIdeologyName], повержен, а значит, мы теперь с уверенностью можем заявить, что с самого начала были правы, когда выступали против наращивания вооруженных сил."
 CZE_anti_democratic_propaganda: "Пропаганда против демократии"
 CZE_anti_democratic_propaganda_desc: "Чтобы усилить поддержку нашей партии, необходимо подчеркнуть неудачи предыдущих правительств республики и показать, как мы можем улучшить ситуацию."
 CZE_form_workers_brigades: "Создать рабочее ополчение"
 CZE_form_workers_brigades_desc: "Освобожденные нами рабочие должны быть готовы принять участие в борьбе. Пусть и не обученные военной службе, они смогут внести вклад соразмерно своей профессии."
 CZE_kohler_faction: "Фракция Кёлера"
 CZE_kohler_faction_desc: "Фракция Бруно Клера считает, что для построения успешного коммунистического чехословацкого государства необходимо насильственное свержение буржуазии."
 CZE_gottwald_faction: "Фракция Готвальда"
 CZE_gottwald_faction_desc: "Безоговорочно верная Москве сталинистская фракция Клемента Готвальда стремится перестроить Чехословацкое государство по образу СССР."
 CZE_zapotocky_faction: "Фракция Запотоцкого"
 CZE_zapotocky_faction_desc: "Основатели коммунистической партии Богумир Шмераль и Антонин Запотоцкий были приверженцами более умеренной политики по сравнению с той, что навязал партии Клемент Готвальд. Чтобы покорить сердца всего [CZE.GetAdjRuLower]ого народа, мы должны вернуться к корням."
 CZE_ally_with_moderate_socialists: "Сотрудничать с умеренными социалистами"
 CZE_ally_with_moderate_socialists_desc: "Не во всех странах на выборах победили коммунисты, и не везде [SOV.GetLeader] пользуется популярностью, а потому не стоит избегать сотрудничества с более умеренными движениями."
 CZE_democracies_willing_to_join_faction_tt: "§YДемократические нации будут более охотно вступать в наш коммунистический альянс.§!"
 CZE_limited_cooperation: "[SOV.GetLeader] и ограниченное сотрудничество"
 CZE_limited_cooperation_desc: "Несмотря на идеологические различия, даже [SOV.GetNameDef] мо[SOV.GetNameSuffixRuDzhetGut] признать ценность сотрудничества с нами и заключить прагматичные сделки, продолжая при этом поносить нас в газетах."
 CZE_denounce_stalinism: "Осудить сталинизм"
 CZE_denounce_stalinism_desc: "Преступления Сталина навсегда опорочили коммунизм. Пришло время принять военные меры, чтобы освободить людей, страдающих под пятой схожих режимов."
 CZE_country_leader_has_ideology_stalinism_tt: "Лидер государства исповедует идеологию «§Y$stalinism$§!»"
 CZE_cooperate_with_tito: "Сотрудничать с Тито"
 CZE_cooperate_with_tito_desc: "Как и мы, [YUG.GetNameDefCap] пыта[YUG.GetNameEndRuPresentEtYut]ся реализовать прагматичную версию коммунизма и объединить разные народы под красным знаменем. Перед лицом общих испытаний нам стоит договориться о военном и политическом сотрудничестве."
 CZE_reduce_divided_nation_cost_tt: "Снижает стоимость и длительность большинства решений «§YРазделенная нация§!»."
 CZE_balkan_union: "Расширить союз"
 CZE_balkan_union_desc: "Хотя всё больше стран нашего региона отдает предпочтение коммунизму, мы не сможем защититься от крупных держав без тесного сотрудничества. Союз станет лучшим способом добиться этого."
 CZE_cooperation_with_the_ussr: "[SOV.GetLeader] и сотрудничество"
 CZE_cooperation_with_the_ussr_desc: "Даже самые рьяные сторонники [SOV.GetNameRuGen] в руководстве партии признали недостатки коллективизации после посещения этой страны. И все же сотрудничество, связанное с коллективизацией, позволит нам проанализировать плюсы и минусы этой политики и найти лучший способ ее проведения в [ROOT.GetNameRuPrep]."
 CZE_exchange_military_expertise: "Обмен военным опытом"
 CZE_exchange_military_expertise_desc: "[SOV.GetNameDefCap], как и большинство стран, обладающих мощной армией, экспериментировал[SOV.GetNameRuEndPast] с тактикой. Мы могли бы попросить их поделиться знаниями и технологиями, а взамен предоставить им наши разработки."
 CZE_pressure_romania: "Давление на Румынию"
 CZE_pressure_romania_desc: "Объединившись с нашими противниками, [ROM.GetNameDefCap] мо[ROM.GetNameSuffixRuDzhetGut] стать значительной угрозой и подорвать наши связи с [SOV.GetNameRuInst] или начать поставлять нефть нашим врагам. Пользуясь [SOV.GetAdjRuLower]ой поддержкой, мы, скорее всего, заставим их присоединиться к нам, не вступая в войну."
 CZE_facility_in_state_tt: "Если в регионе $STATE|Y$ нет других §Yэкспериментальных комплексов§!, мы получим §G1§! $FACILITY_TYPE|Y$ в регионе $STATE|Y$."
 CZE_spread_the_revolution: "Распространение революции"
 CZE_spread_the_revolution_desc: "После успеха революции в [ROOT.GetNameRuPrep] мы должны подтолкнуть пролетариат в других странах подняться на борьбу за свободу — борьбу, которую мы можем поддержать."
 CZE_agrarian_reform: "Восстановить земельное управление"
 CZE_agrarian_reform_desc: "Недавно расформированное земельное управление отвечало за распределение преимущественно сельскохозяйственных земель. Пришло время реформировать институт, чтобы принять решительные меры."
 CZE_realign_the_church: "Государственный атеизм"
 CZE_realign_the_church_desc: "Слишком долго религия разделяла [CZE.GetAdjRuLower]ий народ. Необходимо снизить ее влияние на ключевые сферы — образование и прессу — и создать более сплоченное общество."
 CZE_create_a_secret_police_branch: "Создать ответвление тайной полиции"
 CZE_create_a_secret_police_branch_desc: "В интересах стабильности мы должны защитить себя от внешних и внутренних врагов. Населению пора привыкать к новой системе, особенно пока она все еще дорабатывается."
 CZE_promote_urbanization: "$ARG_promote_urbanization$"
 CZE_promote_urbanization_desc: "Создав эффективную систему колхозов, мы теперь можем начать программу по привлечению некоторой части сельского населения в города, чтобы нарастить производство и там."
 CZE_confiscate_church_lands: "Конфисковать земли церкви"
 CZE_confiscate_church_lands_desc: "Церковь контролирует куда больше земель и богатств, чем ей необходимо. Мы должны перераспределить часть этих земель, как мы уже поступили в отношении светских землевладельцев."
 CZE_change_the_narrative: "Пересмотр идей"
 CZE_change_the_narrative_desc: "Хотя сейчас церковь не поддерживает нашу революцию, приведение ее идей в соответствие с нашими может сыграть важную роль в обеспечении поддержки нового режима."
 CZE_the_second_fortification_program: "Начать вторую программу фортификации"
 CZE_the_second_fortification_program_desc: "Первая программа фортификации заложила основы обороны, и мы не должны останавливаться на достигнутом. Ради будущего нашей нации мы должны как можно скорее начать вторую программу фортификации, чтобы расширить и укрепить оборонительные рубежи."
 CZE_redirect_the_fortification_councils_funds: "Перенаправить средства совета по фортификациям"
 CZE_redirect_the_fortification_councils_funds_desc: "Программы фортификации выкачивают ресурсы из нашей экономики. Куда лучше будет направить эти средства на иные программы. Армии всё равно не нужны дополнительные укрепления, их и так хватает."
 CZE_jachymov_uranium_mine: "Урановая шахта в Яхимове"
 CZE_jachymov_uranium_mine_desc: "Шахты Яхимова давно уже служат источником урана и прочих руд, но у урана было мало применений. Недавние достижения в области физики изменили это."
 CZE_skoda_internal_competition: "Поддержать внутреннее соперничество"
 CZE_skoda_internal_competition_desc: "В крупных компаниях, таких как «Шкода», сложно следить за тем, чтобы все выкладывались по полной. Поощрение внутреннего соперничества поможет значительно повысить эффективность рабочих наших заводов."
 CZE_skoda_max_optimization_tt: "Максимальный уровень оптимизации по §Yфокусу «Шкоды»§! увеличится до 7."
 CZE_skoda_increase_cooperation: "Укрепить сотрудничество со «Шкодой»"
 CZE_skoda_increase_cooperation_desc: "В погоне за улучшением мы можем повысить эффективность, увеличив сотрудничество между предприятиями. Это также может привести к обмену опытом между заводами."
 CZE_skoda_fast_optimization_tt: " Скорость роста £GFX_prod_eff_capуровня оптимизации §Yфокуса «Шкоды»§! в сторону максимального уровня: §G+100,0%§!"
 CZE_master_of_armaments: "Мастер вооружений"
 CZE_master_of_armaments_desc: "Со времен Австро-Венгерской империи Škoda Works была крупнейшим производителем вооружения на нашей территории. Их мастерство и опыт не знают себе равных среди промышленных компаний нашей страны. Пришло время наградить их титулом мастера вооружений."
 CZE_only_the_best_is_good_enough: "Сгодится только лучшее"
 CZE_only_the_best_is_good_enough_desc: "Škoda Works всегда руководствовалась строгой рабочей этикой и духом инноваций. Наши основатели следовали лозунгу: «Только лучшее для наших клиентов!». В последнее время этот лозунг правдив как никогда."
 CZE_an_industrial_legacy: "Промышленное наследие"
 CZE_an_industrial_legacy_desc: "Добившись немыслимого ранее промышленного развития страны, мы наконец-то можем заявить о своем промышленном наследии. Мы — промышленная сверхдержава."
 CZE_powerhouse_of_europe: "Промышленный гигант Европы"
 CZE_powerhouse_of_europe_desc: "Нашей промышленности завидуют во всем мире. Осталось только позаботиться о том, чтобы наша энергетика могла удовлетворять все нужды производства."
 CZE_supply_fighters_for_allies: "Поставка истребителей союзникам"
 CZE_supply_fighters_for_allies_desc: "[FRA.GetAdjective]ое и [ENG.GetAdjRuLower]ое правительства сильно опасаются, что в случае начала конфликта [GER.GetAdjRuLower]ие самолеты быстро разобьют их оборону и нацелятся на города. Усилив их авиацию, мы придадим им уверенности в своих возможностях сдержать [GER.GetAdjRuLower]ую экспансию без существенных потерь."
 CZE_allies_more_likely_to_defend_us_tt: "§YСоюзники с большей вероятностью поддержат нас в борьбе с немецкой экспансией в Судетской области.§!"
 CZE_allies_more_likely_to_defend_us_2_tt: "§YСоюзники с гораздо большей вероятностью поддержат нас в борьбе с немецкой экспансией в Судетской области.§!"
 CZE_allies_more_likely_to_defend_us_3_tt: "§YСоюзники с чуть большей вероятностью поддержат нас в борьбе с немецкой экспансией в Судетской области.§!"
 CZE_establish_the_state_defense_guard: "Учредить Государственную стражу"
 CZE_german_nonagressionpact: "Пакт Хаусхофера-Крофты"
 CZE_german_nonagressionpact_desc: "Переговоры с [GER.GetNameRuInst] по поводу пакта о ненападении шли довольно давно, но после появления признаков нестабильности в [SOV.GetNameRuPrep] и новых экспансионистских планов они прекратились. Сейчас внимание [GER.GetNameRuGen] отвлечено на других врагов, и у нас есть возможность возобновить переговоры."
 CZE_revive_the_czechoslovak_legion_dynamic: "[CZE_revive_the_czechoslovak_legion]"
 CZE_revive_the_czechoslovak_legion_default: "Восстановить Чехословацкий легион"
 CZE_revive_the_czechoslovak_legion_communist: "Основать добровольческую организацию"
 CZE_revive_the_czechoslovak_legion_dynamic_desc: "В мире вновь неспокойно, и отважные солдаты [ROOT.GetNameRuGen] готовы защищать отечество. Но история показала, что порой для защиты родины войска вынуждены сражаться за границей, и мы вновь должны найти тех, кто согласится покинуть родной дом, чтобы его защитить."
 CZE_revive_the_czechoslovak_legion_nsb_tt: "§Y$CZE_legacy_of_the_czechoslovak_legion_army_spirit$§! превратится из §Yдуха армии§! в §Yнациональный дух§!."
 CZE_state_sponsored_recruitment_for_spain: "Государственная программа вербовки для Испании"
 CZE_state_sponsored_recruitment_for_spain_desc: "В мире разгорелись новые конфликты, вмешательство в которые могло бы сыграть важную роль для нас. И мы должны поощрить закаленных воинов [ROOT.GetNameRuGen] поддержать сторону, которая больше других соответствует нашим взглядам. Не исключено, что в процессе нам удастся познакомиться с достижениями в военном деле за последнее десятилетие."
 CZE_support_spain_reward_tt: "§YЭффекты в случае победы или поражения испанской фракции, получившей от нас добровольцев:§!"
 CZE_profit_off_the_spanish_civil_war: "Заработать на Гражданской войне в Испании"
 CZE_profit_off_the_spanish_civil_war_desc: "Гражданская война в Испании превратилась в прокси-войну между великими державами. Нам не стоит рисковать жизнями наших отважных солдат и вмешиваться в этот конфликт. С другой стороны, это отличная возможность профинансировать развитие нашей промышленности за счет продажи оружия, возможно, даже обеим сторонам сразу."
 CZE_skoda_sell_weapons_to_SPR_tt: "Открывает решения: «§YТайная продажа оружия испанской фракции§!»"
 CZE_placate_benes_faction: "Уступить фракции Бенеша"
 CZE_placate_benes_faction_desc: "Милану Годже нужно смириться с тем, что его последний срок на посту министра иностранных дел привел к катастрофе. Эдвард Бенеш со своими сторонниками из партии аграриев готов поддержать Милана Годжу как премьер-министра при условии, что он сложит с себя полномочия министра иностранных дел."
 CZE_claim_lands_of_the_bohemian_crown: "Притязания на земли богемской короны"
 CZE_claim_lands_of_the_bohemian_crown_desc: "Поскольку последние несколько столетий наша страна была пограничьем различных империй, наши границы менялись в результате конфликтов, а не по воле местного населения. Пришло время исправить это."
 CZE_demand_katowice: "Потребовать регион [762.GetName]"
 CZE_demand_katowice_desc: "Контроль над регионом [762.GetName] не только будет означать восстановление наших старых границ, но и ослабит [POL.GetAdjRuLower]ие притязания на регион [72.GetName]."
 CZE_fight_over_silesia: "Битва за Силезию"
 CZE_fight_over_silesia_desc: "Хотя Силезия считается законной [ROOT.GetAdjRuLower]ой территорией, мы предпочли бы избежать полноценной войны с [66.owner.GetNameRuInst]. В связи с этим мы должны показать свою силу и устроить серьезную стычку на границе — так мы можем получить регион без полномасштабной войны, если [66.owner.GetNameDef] пожела[66.owner.GetNameEndRuPresentEtYut] воевать за Силезию."
 CZE_dismantle_poland: "Уничтожение государства [POL.GetNonIdeologyName]"
 CZE_dismantle_poland_desc: "[POL.GetNameDef] наглядно продемонстрировал[POL.GetNameRuEndPast] неспособность защитить себя, а следовательно, и неспособность играть роль буферного государства между нами и нашими врагами. Мы должны воспользоваться этим случаем, чтобы укрепить наше государство."
 CZE_proclaim_the_restoration_of_bohemia: "Объявить о восстановлении королевства Богемия"
 CZE_proclaim_the_restoration_of_bohemia_desc: "Восстановив исторические границы, мы можем возродить наше наследие и заняться интеграцией новых земель."
 CZE_integrate_lost_territories: "Интегрировать ранее утраченные территории"
 CZE_integrate_lost_territories_desc: "Исторические земли королевства Богемия простираются от Балтийского моря до Адриатического. Самое время вспомнить эту часть нашей истории и интегрировать наши новые владения."
 CZE_deepen_ties_with_puppet_kingdoms: "Укрепить связи с марионеточными королевствами"
 CZE_deepen_ties_with_puppet_kingdoms_desc: "Теперь у нас есть обозначенная сфера влияния, и воздействие на неё необходимо усилить, чтобы извлечь максимум выгоды из союза с этими государствами."
 CZE_poland_alliance_monarchist: "Соглашение с государством [POL.GetNonIdeologyName]"
 CZE_poland_alliance_monarchist_desc: "$CZE_ally_poland_desc$"
 CZE_a_strong_poland: "Сильное государство [POL.GetNonIdeologyName]"
 CZE_a_strong_poland_desc: "[POL.GetNameDef] располага[POL.GetNameEndRuPresentEtYut] одной из сильнейших армий в Восточной Европе и мо[POL.GetNameSuffixRuDzhetGut] стать ценным союзником."
 CZE_mend_balkan_relations: "Улучшить отношения на Балканах"
 CZE_facilitate_a_strong_hungary: "Содействовать усилению Венгрии"
 CZE_facilitate_a_strong_hungary_desc: "Наши отношения с [HUN.GetNameRuInst] были крайне шаткими с момента обретения этим государством независимости. Но в свете назревающего конфликта у нас есть шанс найти общий язык."
 CZE_subjegate_romania: "Давление на Румынию с учетом [HUN.GetAdjRuLower]их притязаний"
 CZE_subjegate_romania_desc: "Притязания нашей [HUN.GetAdjRuLower]ой марионетки — полезный инструмент в отношениях с [ROM.GetNameRuInst]. Если мы пригрозим им, что позволим [HUN.GetNameRuDat] продавить свои претензии на [ROM.GetAdjRuLower]ие земли и поможем захватить их, у нас будет возможность подчинить себе [ROM.GetNameRuAcc]."
 CZE_demanded_overlordship_HUN: "Покоренная Венгрия"
 CZE_demanded_overlordship_ROM: "Покоренная Румыния"
 CZE_integrate_hungary: "Интегрировать бывшие австрийские территории"
 CZE_integrate_hungary_desc: "Теперь, когда мы значительную расширили свою сферу влияния, интеграция недавно увеличившегося в размерах государства [HUN.GetName] и прочих территорий позволит нам восстановить границы Австро-Венгрии под [ROOT.GetAdjRuLower]им руководством."
 CZE_subjegate_serbia: "Подчинить [YUG.GetNameRuAcc]"
 CZE_subjegate_serbia_desc: "Ослабев, [YUG.GetName] больше не мо[YUG.GetNameSuffixRuDzhetGut] служить эффективным буфером для защиты нашего южного фланга, и после интеграции Словении нам придется продолжить экспансию."
 CZE_strike_the_eastern_threat: "Устранить угрозу с востока"
 CZE_strike_the_eastern_threat_desc: "Лицемеры из [SOV.GetNameRuGen] оправдывают свои имперские амбиции, критикуя наше правительство. Это экзистенциальная угроза для [CZE.GetNameRuGen], и с ней необходимо покончить."
 CZE_assist_austria: "Защитить [AUS.GetNameRuAcc]"
 CZE_assist_austria_desc: "Защита [AUS.GetNameRuGen] от любых конфликтов — вопрос национальной безопасности для нас. [AUS.GetAdjective]ая граница является одной из наиболее уязвимых. К тому же, экономический потенциал этой страны может сыграть на руку нашим противникам, и мы не можем этого допустить."
 CZE_return_to_democracy: "Вернуться к демократии"
 CZE_return_to_democracy_desc: "Нашей стране больше ничего не угрожает, и население всё яснее понимает, что военная диктатура себя изжила. Пришло время провести выборы и вернуть власть демократической гражданской администрации."
 CZE_cooperate_with_the_allies: "Сотрудничать с Союзниками"
 CZE_cooperate_with_the_allies_desc: "Регион стал более стабильным, и нам следует восстановить связи с нашими традиционными союзниками."
 CZE_eliminate_austrian_defeatists: "Победить [AUS.GetAdjRuLower]их пораженцев"
 CZE_eliminate_austrian_defeatists_desc: "Поскольку [AUS.GetNameDefCap] не жела[AUS.GetNameEndRuPresentEtYut] защищать свои земли, мы должны вмешаться сейчас, пока враги не оказались у нас на пороге."
 CZE_the_legacy_of_ottokar: "Наследие Отакара"
 CZE_the_legacy_of_ottokar_desc: "Легендарный король Отакар II расширил владения Богемии, присоединив земли Австрии, и с одобрения австрийской знати дошел до Адриатического моря. Мы должны вновь обратиться к австрийцам, знатным и не очень."
 CZE_demand_the_istrian_peninsula: "Потребовать Истрию"
 CZE_demand_the_istrian_peninsula_desc: "[ROOT.GetNameDefCap] не име[ROOT.GetNameEndRuPresentEtYut] выхода к морю, и это долгое время ограничивало нас в торговле и влиянии. Нельзя, чтобы наша экономика зависела от соседних стран. Необходимо потребовать доступ к Адриатическому морю."
 CZE_demand_slovenia: "Потребовать Словению"
 CZE_demand_slovenia_desc: "В прошлом Словения была важной частью Австрийской империи. Раз мы установили контроль над сердцем этой империи, нужно попытаться вернуть и эти земли."
 CZE_demand_overlordship_of_yugoslav_league: "Потребовать верховенства в [YUG.GetAdjRuLower]ой лиге"
 CZE_demand_overlordship_of_yugoslav_league_desc: "Хотя мы не хуже [YUG.GetNameRuGen] знаем, что в многонациональных государствах порой не обойтись без локальных автономий, их союз слишком слаб, чтобы защитить себя. Мы должны убедить [YUG.GetNameRuAcc] признать это и позволить нам вмешаться."
 CZE_expand_the_rome_protocols: "Расширение Римских протоколов"
 CZE_expand_the_rome_protocols_desc: "[ITA.capital.GetCapitalVictoryPointName] куда ближе нашему новому правительству, чем [GER.capital.GetCapitalVictoryPointName]. В свете разногласий между ними по поводу Австрии наша поддержка Римских протоколов может придать [ITA.GetNameRuDat] уверенности следовать выбранным путем и отказаться от поддержки [GER.GetNameRuAcc]."
 CZE_prague_protocols: "Пражские протоколы"
 CZE_soviet_alliance: "Расширить союзный договор 1935 года"
 CZE_soviet_alliance_desc: "Действующий союз с [SOV.GetNameRuInst] слишком эфемерен и не гарантирует их вмешательства в случае нападения на нас. Мы должны предложить новое соглашение, если хотим получить гарантию нашей безопасности."
 CZE_airlift_soviet_support: "Доставка советских войск по воздуху"
 CZE_airlift_soviet_support_desc: "Отсутствие границы с нашими [SOV.GetAdjRuLower]ими союзниками привело к появлению свежей идеи о доставке [SOV.GetAdjRuLower]их войск по воздуху. Столь масштабная переброска ранее никогда не осуществлялась, но если ее осуществить, [SOV.GetAdjRuLower]им войскам не придется пересекать границу с нашими соседями. По крайней мере, по земле."
 CZE_unlocks_volunteer_transport_raid_tt: "Открывает §Yналет§!:\nвоздушная переброска советских добровольцев в регион §Y[73.GetName]§!"
 CZE_intervene_in_the_ussr: "Вмешаться в [SOV.GetAdjRuLower]ую гражданскую войну"
 CZE_intervene_in_the_ussr_desc: "В [SOV.GetNameRuPrep] вновь неспокойно, и хотя возвращения старой правящей семьи, которую мы когда-то поддерживали, не предвидится, не стоит игнорировать возможность установить более дружественное правительство."
 CZE_forgive_trading_debts: "Простить торговые долги"
 CZE_forgive_trading_debts_desc: "Из-за экономической нестабильности и Великой депрессии некоторые из наших потенциальных союзников задолжали нам крупные суммы, которые они не в состоянии выплатить. Это усложняет наши отношения с ними. Правительство могло бы списать долги и выплатить компенсации нашим компаниям, которые пострадают от такого решения."
 CZE_improve_balkan_trade_relations: "Улучшить торговые отношения на Балканах"
 CZE_improve_balkan_trade_relations_desc: "Наша экономика является главным козырем в борьбе за союзников на Балканах. Мы должны показать готовность тратить ресурсы, чтобы улучшить экономическое положение потенциальных союзников."
 CZE_ally_austria: "Союз с [AUS.GetNameRuInst]"
 CZE_ally_austria_desc: "После того как нацисты несколько лет назад свергли правительство [AUS.GetNameRuGen], это государство должно было осознать преимущества сотрудничества с [ROOT.GetNameRuInst]."
 CZE_demand_the_czech_corridor: "Потребовать создать Чешско-югославский коридор"
 CZE_demand_the_czech_corridor_desc: "По мере превращения Малой Антанты в полноценный союз становится всё очевиднее, что переброска подкреплений от нас к нашим союзникам (или наоборот) в случае конфликта будет крайне затруднена. Еще после Великой войны мы предлагали создать наземный коридор между нами и [YUG.GetNameRuInst] в интересах безопасности и защиты торговли."
 CZE_ally_hungary: "Союз с [HUN.GetNameRuInst]"
 CZE_ally_hungary_desc: "Несмотря на конфликты между государствами [HUN.GetNonIdeologyName] и [CZE.GetNonIdeologyName], продолжавшиеся с момента их основания, у нас появился шанс заключить взаимовыгодный союз."
 CZE_ally_yugoslavia: "Союз с [YUG.GetNameRuInst]"
 CZE_ally_yugoslavia_desc: "В последнее время [YUG.GetNameDefCap] страда[YUG.GetNameEndRuPresentEtYut] от экономических неурядиц, но стратегические ресурсы и выгодное расположение этой страны недооценивать нельзя."
 CZE_protect_neutrality: "Защитить нейтралитет"
 CZE_protect_neutrality_desc: "Первая Мировая война ясно дала понять, что сохранять нейтралитет под прицелом вражеских орудий невозможно. Защита этих стран вынудит врага вести войну на два фронта и не позволит разделять и властвовать."
 CZE_if_cooperate_with_moderate_socialists_completed_tt: "Эффекты, если выполнен фокус «§YСотрудничать с умеренными социалистами§!»:"
 CZE_mutual_protection_agreement_with_switzerland: "Соглашение об обороне с государством [SWI.GetNonIdeologyName]"
 CZE_mutual_protection_agreement_with_switzerland_desc: "И мы, и [SWI.GetNameDef] стремимся создать ситуацию, в которой вторжение на наши земли было бы невозможно без катастрофических потерь. Благодаря нашему сотрудничеству мы сможем выставить достаточно многочисленную армию не только для обороны, но и для решительного контрнаступления."
 CZE_exchange_technology: "Сотрудничество в исследованиях"
 CZE_exchange_technology_desc: "Несмотря на обилие природных ресурсов, у балканских государств нет доходных колоний или развитой промышленности, как у великих держав. Поэтому жизненно необходимо проводить совместные исследования, чтобы каждая из наших стран могла сконцентрироваться на своих сильных сторонах."
 CZE_demand_corridor_to_ussr: "Потребовать коридор до [SOV.GetNameRuGen]"
 CZE_demand_corridor_to_ussr_desc: "Если [POL.GetNameDef] откаж[POL.GetNameEndRuPresentEtUt]ся сотрудничать, нам придется прибегнуть к более решительным мерам, чтобы получить доступ к нашим [SOV.GetAdjRuLower]им союзникам."
 CZE_ally_poland: "Союз с [POL.GetNameRuInst]"
 CZE_ally_poland_desc: "Память о Советско-польской войне еще жива, и в свете растущей угрозы на западе положение [POL.GetNameRuGen] схоже с нашим. Мы должны убедить [POL.GetAdjRuLower]ие власти, что нейтралитет их не спасет и будет лучше примкнуть к нам."
 CZE_realize_the_polish_czechoslovak_confederation: "Создание конфедерации"
 CZE_realize_the_polish_czechoslovak_confederation_desc: "Несмотря на доблестное сопротивление, [POL.GetNameDef] потерпел[POL.GetNameRuEndPast] поражение. Правительство оказалось в изгнании и задумалось о союзе с нами. Объединив усилия наших правительств, мы сможем собрать [POL.GetAdjRuLower]ое население под знаменами нового государства и предпринять совместные усилия по освобождению нашего общего родного дома."
 CZE_integrate_western_ukrainians: "Интегрировать западных украинцев"
 CZE_integrate_western_ukrainians_desc: "Мы предложили [CZE.GetAdjRuLower]им украинцам помощь и автономию и теперь можем попытаться интегрировать новые земли в нашу украинскую провинцию."
 CZE_ally_russia: "Союз с государством [SOV.GetNonIdeologyName]"
 CZE_ally_russia_desc: "Сейчас, когда взгляды правительства [SOV.GetNameRuGen] стали ближе к нашим, мы можем попытаться изменить соглашение, ранее заключённое с их прежним правительством, на более конкретное и масштабное."
 CZE_claim_ukraine: "Установить дружественное украинское правительство"
 CZE_claim_ukraine_desc: "Украина является важной частью [SOV.GetNameRuGen], и ее захват позволит нам создать сильное буферное государство."
 CZE_strengthen_the_little_entente: "Формализовать Малую Антанту"
 CZE_strengthen_the_little_entente_desc: "Малая Антанта в первую очередь нацелена на сдерживание государства [HUN.GetNonIdeologyName], однако у нее есть потенциал, чтобы стать серьезным альянсом с внушительной армией."
 CZE_seek_french_leadership: "Обратиться за [FRA.GetAdjRuLower]им руководством"
 CZE_seek_french_leadership_desc: "Хотя инициатива по созданию альянса исходила от нас, [FRA.GetNonIdeologyName] значительно усилит любой альянс своей армией. Ради этого стоит даже уступить лидерство."
 CZE_increase_food_and_resource_imports: "Нарастить импорт продовольствия и ресурсов"
 CZE_increase_food_and_resource_imports_desc: "Поскольку у наших новых союзников сильный сельскохозяйственный сектор, нам не обязательно субсидировать собственный. Импорт дешевых ресурсов позволит нам сэкономить средства и укрепит экономику наших союзников."
 CZE_double_down_on_heavy_industry: "Сделать упор на тяжелую промышленность"
 CZE_double_down_on_heavy_industry_desc: "Новые соглашения с нашими союзниками позволят нам сосредоточиться на наиболее конкурентоспособных отраслях промышленности — например, на военной. Излишки можно будет продать."
 CZE_neutralize_the_hungarian_threat: "Нейтрализовать [HUN.GetAdjRuLower]ую угрозу"
 CZE_neutralize_the_hungarian_threat_desc: "[HUN.GetNameDefCap] — препятствие на пути торговли с потенциальными союзниками на юге, и если эта страна объединится с нашими врагами, она сможет отвлечь значительную часть нашей армии даже с учетом последствий Трианонского договора."
 CZE_cancel_anti_hungary_focus: "Отступили после [POL.GetAdjRuLower]ого вмешательства"
 CZE_ally_romania: "Союз с [ROM.GetNameRuInst]"
 CZE_ally_romania_desc: "[ROM.GetNameDefCap] — одна из немногих самодостаточных стран в регионе, способных обеспечивать себя продовольствием и драгоценной нефтью. Сотрудничество не только даст нам доступ к ресурсам друг друга, но и помешает нашим врагам воспользоваться сырьем, необходимым для войны с нами."
 CZE_divide_germany: "Разделить Германию"
 CZE_divide_germany_desc: "Угрозе [GER.GetNameRuGen] трудно противостоять в одиночку. Мы должны искать союзников, которых также тревожит [GER.GetAdjRuLower]ая экспансия и которые готовы действовать на упреждение."
 CZE_if_FRA_ally_tt: "Эффекты, если §YФранция монархистская§! и не имеет других союзников:"
 CZE_if_POL_ally_tt: "Эффекты при успешном выполнении фокуса «§YСильная Польша§!» и получении гарантий от государства [POL.GetNonIdeologyName]:"
 CZE_revolutionary_brigades: "Учредить революционные бригады"
 CZE_revolutionary_brigades_desc: "Наших революционеров, набравшихся опыта в сражениях за [ROOT.GetNameRuAcc], необходимо интегрировать в регулярную армию."
 CZE_recruit_communist_exiles: "Завербовать изгнанных коммунистов"
 CZE_recruit_communist_exiles_desc: "Город [ROOT.Capital.GetCapitalVictoryPointName] издавна был прибежищем революционеров в изгнании, и наше новое правительство могло бы воспользоваться этим."
 CZE_destabilize_potential_adversaries: "Дестабилизировать потенциальных врагов"
 CZE_destabilize_potential_adversaries_desc: "Изгнанные коммунисты, с которыми мы сотрудничаем, понимают свои родные страны куда лучше, чем самые умелые шпионы, и мы должны воспользоваться этими знаниями, когда будем разрабатывать стратегию по освобождению их родины."
 CZE_nationalize_key_industries: "Национализация банков и шахт"
 CZE_nationalize_key_industries_desc: "Шахты предоставляют сырье, необходимое нашей промышленности для изготовления оружия. Во времена кризиса поставки сырья лучше оставить в руках правительства, а не финансистов и промышленников."
 CZE_rehabilitate_the_army: "Реабилитация армии"
 CZE_rehabilitate_the_army_desc: "Большинство генералов [CZE.GetAdjRuLower]ой армии — ветераны Чехословацкого корпуса, сражавшегося против большевиков в ходе Гражданской войны. Необходимо обеспечить их верность новому [CZE.GetAdjRuLower]ому правительству."
 CZE_unlock_civil_war_army_generals_tt: "Вернуть командиров, оставивших нас во время гражданской войны"
 CZE_recruit_ideologically_aligned_generals: "Завербовать идеологически надежных генералов"
 CZE_recruit_ideologically_aligned_generals_desc: "Пришло время скорректировать наши программы подготовки и пополнить армию кандидатами, которые разделяют наши новые ценности."
 CZE_recruit_communist_generic_general_tt: "Дает генерала-коммуниста."
 CZE_purge_two_random_commanders_tt: "Два случайных командира будут подвергнуты чистке."
 CZE_czechoslovak_union: "Чехословацкий союз"
 CZE_czechoslovak_union_desc: "Необходимо расширить местную автономию в [CZE.GetNameRuPrep] — это позволит адаптировать коммунистическую систему к местным условиям."
 CZE_continue_industrial_relocation_schemes: "Продолжить схемы по переносу арсеналов"
 CZE_continue_industrial_relocation_schemes_desc: "В интересах национальной безопасности мы должны продолжить перенос наиболее уязвимых предприятий в области, где они будут лучше защищены от воздушных и наземных атак. Нельзя допустить, чтобы такая критически важная промышленность пострадала."
 CZE_continue_industrial_relocation_schemes_tt: "Удалить §Y1 военный завод§!."
 CZE_continue_industrial_relocation_schemes_2_tt: "§RЗаводы придется построить заново.§!"
 CZE_establish_a_armament_factory_in_uhersky_brod: "Построить военный завод в городе Угерски-Брод"
 CZE_establish_a_armament_factory_in_uhersky_brod_desc: "Военный завод в городе Угерски-Брод специализируется на разработке и производстве автоматического оружия для пехоты и самолетов. Мы планируем сделать его самым передовым предприятием своего типа в мире."
 CZE_appeal_to_the_castle: "Воззвать к замку"
 CZE_appeal_to_the_castle_desc: "Замком в Чехословакии принято называть обширную сеть влиятельных организаций и людей, поддерживающих президентов. В свою очередь, подобная власть позволяет президентам оказывать куда большее влияние, чем подразумевают их ограниченные конституционные права. Обращение к этой группе за поддержкой поможет нам взять руководство страной в свои руки."
 CZE_petition_the_nobles: "Обратиться к знати"
 CZE_petition_the_nobles_desc: "Аристократия [ROOT.GetNameRuGen], пусть и лишённая официальных титулов, по-прежнему остаётся влиятельной частью [ROOT.GetAdjRuLower]ого общества, Их поддержка обеспечит нам необходимую легитимацию и доступ к ресурсам для дальнейшей мобилизации сторонников."
 CZE_unify_the_fascist_parties: "Объединить фашистские партии"
 CZE_unify_the_fascist_parties_desc: "Фашистские партии разрознены и настолько радикальны, что не могут рассчитывать на значительную поддержку населения. Ради блага нации необходимо, чтобы эти партии объединились и создали для Чехословакии образ будущего, привлекательный не только для радикалов."
 CZE_pro_rearmament_propaganda: "Пропаганда перевооружения"
 CZE_pro_rearmament_propaganda_desc: "Чтобы усилить поддержку более централизованного правительства, мы должны подчеркнуть, насколько нестабильна ситуация в мире. Заодно это поможет мотивировать население на то, чтобы поддержать планы по усилению армии."
 CZE_align_nationalist_parties: "Сотрудничество с чешскими националистами"
 CZE_align_nationalist_parties_desc: "Хотя мы пытались привлечь на свою сторону все [ROOT.GetAdjRuLower]ое население, сложно отрицать, что наибольшим влиянием на политической арене обладают традиционные чешские националистические партии и именно с их помощью нам будет проще всего набрать сторонников."
 CZE_align_slovak_catholics: "Сотрудничество со словацкими католиками"
 CZE_align_slovak_catholics_desc: "Католические и националистические партии пользуются большой поддержкой в Словакии. Нам вряд ли удастся наладить отношения с националистами без существенных уступок, но мы могли бы привлечь на свою сторону католиков."
 CZE_jozef_tiso_tt: "Назначить советника по имени §Y$CZE_jozef_tiso$§!"
 CZE_align_catholic_parties: "Сотрудничество с ЧНП"
 CZE_align_catholic_parties_desc: "ЧНП и другие католические партии традиционно служили опорой монархистам при австро-венгерской монархии. Нужно постараться вернуть им эту роль."
 CZE_restore_the_monarchy: "Восстановить монархию"
 CZE_restore_the_monarchy_desc: "Теперь, когда мы создали новую систему, пора предложить народу и новую доработанную концепцию. $CZE_karel_schwarzenberg$ в качестве избранного монарха понравится как старым приверженцам монархии, так и новым, поскольку он, в отличие от предыдущего монарха, имеет [ROOT.GetAdjRuLower]ое, а не иностранное ([AUS.GetAdjRuLower]ое) происхождение."
 CZE_semi_constitutional_monarchy: "Полуконституционная система"
 CZE_semi_constitutional_monarchy_desc: "С избранием монарха пришло время изменить конституцию. Хотя некоторые выступают за централизацию власти, чтобы избежать внутренней борьбы в эти непростые времена, очевидно, что монарх не может лично заниматься всеми вопросами. Поэтому лучше всего будет частично сохранить существующую систему, чтобы она помогала управлять страной, тогда как монарх будет задавать направление развития."
 CZE_restore_noble_titles: "Восстановить дворянские титулы"
 CZE_restore_noble_titles_desc: "При основании республики титулы были упразднены, но теперь пришло время вознаградить знать за сотрудничество, восстановив их. Это позволит нам даровать почетные титулы героям, например ветеранам, сражавшимся за [ROOT.GetAdjective]ое государство."
 CZE_restore_the_austro_hungarian_customs_union: "Восстановить таможенный союз империи"
 CZE_restore_the_austro_hungarian_customs_union_desc: "Одним из неопровержимых преимуществ Австро-Венгерской империи были незначительные торговые барьеры для нашей промышленности. Восстановление этого таможенного союза станет первым шагом по включению бывших частей империи в нашу сферу влияния."
 CZE_customs_union: "Таможенный союз"
 CZE_catholic_focus: "Ставка на католиков"
 CZE_catholic_focus_desc: "Гуситское наследие — важный элемент [ROOT.GetAdjRuLower]ой истории, однако католическая вера всё еще широко распространена. Мы можем опереться на это, расширив влияние католической общины в общественной структуре."
 CZE_hussite_legacy: "Наследие гуситов"
 CZE_hussite_legacy_desc: "Гуситы не только выступали за близкий к протестантизму вариант христианства, но и были на редкость терпимы к другим мнениям по этому вопросу, в отличие от преследовавших их тиранов."
 CZE_align_with_germany: "Сотрудничество с государством [GER.GetNonIdeologyName]"
 CZE_align_with_germany_desc: "Хотя новое правительство [GER.GetNameRuGen], возможно, не откажется от экспансионистских устремлений, оно, вероятно, будет более прагматичным в вопросах внешнеполитических альянсов и публичных обвинений. Нам следует приложить усилия, чтобы оказаться среди тех, с кем они готовы сотрудничать."
 CZE_rally_against_germany: "Единство против государства [GER.GetNonIdeologyName]"
 CZE_rally_against_germany_desc: "Чехословаки храбро сражались за независимость, и теперь мы должны поднять весь народ на защиту этой независимости."
 CZE_integrate_sudeten_germans: "Интегрировать Судеты"
 CZE_integrate_sudeten_germans_desc: "Разобщенность среди жителей Судетов вредит всем. Мы должны отреагировать на проблемы этих людей и постараться их решить. Одно только это может обезоружить любых сторонников независимости, поскольку их заявлениям о притеснениях будет сложно поверить."
 CZE_cooperate_with_the_sdp: "Сотрудничать с СнП"
 CZE_cooperate_with_the_sdp_desc: "Сейчас СнП выступает как фактор дестабилизации, но при правильном подходе эта партия может прислушаться к нам. Например, если включить ее в правящую коалицию."
 CZE_revive_the_december_bloc: "Восстановить Декабрьский блок"
 CZE_revive_the_december_bloc_desc: "Декабрьский блок фашистских, миноритарных и правых партий, недовольных президентством Эдварда Бенеша, необходимо восстановить, чтобы создать альтернативу действующему правительству."
 CZE_revert_1926_anti_military_laws: "Отменить антивоенные законы 1927 года"
 CZE_revert_1926_anti_military_laws_desc: "После попытки переворота, предпринятой Радолой Гайдой, армия и жандармерия потеряли право голоса и ряд других привилегий. Но поскольку в наше непростое время армия играет важнейшую роль, будет справедливо снять эти ограничения и устранить раскол между армией и политиками."
 CZE_bop_to_fascism_support_tt: "Добавить треть значения §Y$CZE_bop_army_readiness$§! к поддержке фашизма:"
 CZE_power_to_the_military: "Власть военным"
 CZE_power_to_the_military_desc: "Совершенно очевидно, что на обороне страны экономить нельзя, поэтому важно, чтобы власть предержащие понимали потребности армии. Лучшим способом добиться этого будет организация военного правительства."
 CZE_militarize_the_associations: "Милитаризация объединений"
 CZE_militarize_the_associations_desc: "Многочисленные объединения [CZE.GetNameRuGen] могут способствовать обороне нации, обучая население необходимым для солдат навыкам еще до мобилизации."
 CZE_aggressive_foreign_policy: "Агрессивная внешняя политика"
 CZE_aggressive_foreign_policy_desc: "Прошло время хрупких пактов, основанных на доверии. Мы должны действовать решительно, чтобы обеспечить свою безопасность, даже если для этого потребуется пойти на значительные жертвы."
 CZE_work_with_germany: "Работа с [GER.GetNameRuInst]"
 CZE_work_with_germany_desc: "Судетский вопрос решен, и, возможно, теперь [GER.GetNameDef] призна[GER.GetNameEndRuPresentEtYut] ценность [ROOT.GetNameRuGen] как союзника."
 CZE_control_the_associations: "Контролировать объединения"
 CZE_control_the_associations_desc: "В государстве [CZE.GetNonIdeologyName] действует огромное количество организаций — от профессиональных сообществ до спортивных союзов. Кто контролирует их — тот контролирует общество."
 CZE_diversify_bata: "Диверсификация Bat'a"
 CZE_diversify_bata_desc: "Bat'a — крупнейший производитель потребительских товаров, и мы можем воспользоваться этим ради поставок ресурсов. Эта компания может помочь нам, обеспечив ключевыми ресурсами, которые было бы трудно заполучить самостоятельно."
 CZE_devaluate_the_koruna: "Девальвация кроны"
 CZE_devaluate_the_koruna_desc: "Твердая национальная валюта создает опасную экономическую ситуацию для страны, которая в значительной степени полагается на экспорт. Ослабление валюты будет болезненным в краткосрочной перспективе, но оправдает себя в долгосрочной."
 CZE_continue_the_central_bohemia_plan: "План для Центральной Богемии"
 CZE_continue_the_central_bohemia_plan_desc: "Продолжение наших планов по расширению промышленных зон в сердце страны позволит нам воспользоваться эффектом масштаба в производстве. Развитие промышленности вдали от границ также имеет смысл с точки зрения национальной безопасности."
 CZE_balance_industrial_invevestments: "Сбалансировать промышленное развитие"
 CZE_balance_industrial_invevestments_desc: "Недостаточное развитие земель за пределами регионов [9.GetName] и [75.GetName] — одна из причин раскола в стране в начале десятилетия. Укрепление областей на периферии страны позволит сократить разрыв в промышленном развитии между ними."
 CZE_expand_prf_science_facilities: "Расширить научные корпуса ПрФ"
 CZE_expand_prf_science_facilities_desc: "Научные корпуса ПрФ заполнены одаренными людьми, которые только и ждут возможности заняться чем-то более масштабным. Расширение подразделений и их сотрудничество с правительством станет неплохим началом в развитии наших исследований."
 CZE_raise_more_industrial_funds: "Собрать дополнительные средства на промышленность"
 CZE_raise_more_industrial_funds_desc: "Со времен Австро-Венгрии и по сей день промышленность была и остается сердцем нашей нации. Если мы выделим на нее достаточные средства, наша страна продолжит процветать посреди бушующей Европы."
 CZE_skoda_priority_focus_info_tt: "Для выполнения некоторых §Yнациональных фокусов§! нам придется сосредоточиться на конкретном фокусе £GFX_CZE_skoda_text_icon §Yприоритета Škoda§!. Эти фокусы отмечены небольшим значком, соответствующим требуемому £GFX_CZE_skoda_text_icon §Yприоритету Škoda§!."
 CZE_joint_stock_schemes: "Акционерные схемы"
 CZE_joint_stock_schemes_desc: "Акционерные схемы всегда способствовали экономическому росту там, где не справлялись традиционные источники финансирования. Дальнейшее использование этой тактики поддержит развитие нашей экономики."
 CZE_the_slovak_arrow: "Словацкая стрела"
 CZE_the_slovak_arrow_desc: "Установление быстрого железнодорожного сообщения между двумя нашими крупнейшими городами станет важным источником национальной гордости. Кроме того, это даст нам повод для развития железнодорожной инфраструктуры."
 CZE_finish_double_tracking_efforts: "Прокладка двупутных магистралей"
 CZE_finish_double_tracking_efforts_desc: "Завершение прокладки двухпутки на ключевых второстепенных направлениях повысит их пропускную способность. Это позволит нам лучше связать между собой ряд малых городов."
 CZE_realize_motorway_proposals: "Реализовать предложения по автомагистралям"
 CZE_realize_motorway_proposals_desc: "Некоторые проекты по прокладке автомагистралей, предложенные нашему правительству, позволят значительно улучшить дорожную сеть нашей страны. Мы должны принять эти предложения и воплотить их в жизнь."
 CZE_build_additional_rail_stations: "Построить дополнительные железнодорожные станции"
 CZE_build_additional_rail_stations_desc: "На фоне быстрого развития железнодорожной инфраструктуры некоторые существующие станции не способны справиться с возросшим потоком. Их модернизация позволит перевозить гораздо больше товаров и людей."
 CZE_build_additional_rail_stations_focus_cost_tt: "При выборе фокуса §Y«$CZE_devaluate_the_koruna$»§! время его выполнения сокращается до §G35§! дней."
 CZE_grow_ckd_secondary_facilities: "Дополнительные заводы ЧКД"
 CZE_grow_ckd_secondary_facilities_desc: "ЧКД владеет множеством мелких предприятий, производящих важную промышленную продукцию — например, электрогенераторы. Расширение этих заводов поспособствует развитию нашей тяжелой промышленности."
 CZE_bolster_domestic_construction: "Поддержать жилищное строительство"
 CZE_bolster_domestic_construction_desc: "С того момента, как мы обрели независимость по итогам Великой войны, наш строительный сектор постепенно развивался. Дополнительные инвестиции в строительных подрядчиков среднего звена поспособствуют его дальнейшему росту."
 CZE_invest_in_vhht: "Инвестировать в VHHT"
 CZE_invest_in_vhht_desc: "VHHT — это компания, владеющая множеством различных металлургических предприятий в нашей стране. Инвестиции в компанию и ее расширение позволят нам улучшить многие отрасли металлургии."
 CZE_expand_vitkovice_ironworks: "Расширить металлургический завод в Витковице"
 CZE_expand_vitkovice_ironworks_desc: "Металлургический завод в Витковице является важным поставщиком чугуна и стали в регионе [74.GetName]. Его расширение позволит нам значительно нарастить выпуск продукции."
 CZE_expand_central_bohemian_mines: "Расширение шахт в Центральной Богемии"
 CZE_expand_central_bohemian_mines_desc: "Шахты в центре нашей страны чрезвычайно важны для энергетической безопасности. Мы должны как можно скорее заняться их разработкой."
 CZE_increase_bauxite_imports: "Нарастить импорт бокситов"
 CZE_increase_bauxite_imports_desc: "Наша страна не богата алюминием, но с помощью процессов очистки и наращивания импорта бокситов мы сможем производить у себя небольшое количество этого ресурса. Это позволит нам справиться с дефицитом."
 CZE_merge_the_oil_companies: "Объединить нефтяные компании"
 CZE_merge_the_oil_companies_desc: "Наши нефтяные компании едва ли заслуживают такого названия. Это небольшие корпорации, выстроенные вокруг немногочисленных скважин. Объединив эти компании и установив над ними правительственный надзор, мы сможем более эффективно использовать нашу скромную нефтяную отрасль."
 CZE_expand_trinec_ironworks: "Тршинецкий металлургический завод"
 CZE_expand_trinec_ironworks_desc: "Сталелитейный завод в Тршинеце был титаном промышленности региона [72.GetName] с самого основания. Дальнейшие инвестиции принесут нам дивиденды в виде увеличения количества ресурсов."
 CZE_consolidate_mining_operations: "Объединить горнодобывающие предприятия"
 CZE_consolidate_mining_operations_desc: "Наши горнодобывающие предприятия можно оптимизировать, если объединить их для большей эффективности. Это поспособствует исследованиям и поможет расширить имеющиеся шахты."
 CZE_expand_praga: "Контракты «Праги»"
 CZE_expand_praga_desc: "Уже много лет «Прага» поставляет различные детали для нашей военной промышленности. Будет логично вознаградить эти усилия дополнительными контрактами, которые поспособствуют росту предприятия."
 CZE_shrink_educational_disparities: "Сократить разрыв в образовании"
 CZE_shrink_educational_disparities_desc: "В наших сельских областях нет такого широкого доступа к образованию, как в городах. Нужно постепенно устранять этот разрыв с помощью крупных образовательных программ, нацеленных на подобные области."
 CZE_kickstart_rapid_rearmanent: "Начать быстрое перевооружение"
 CZE_kickstart_rapid_rearmanent_desc: "Многие политики и предприниматели могут не согласиться с таким решением, но мы должны начать перевооружение прямо сейчас. Окружающие нас страны не просто не разоружаются — они заняты прямо противоположным, и это ни для кого не секрет. Нам нужно готовить свою армию, пока еще есть время."
 CZE_keep_focus_on_weapon_exports: "Сохранить упор на экспорт оружия"
 CZE_keep_focus_on_weapon_exports_desc: "Наши крупные экспортеры оружия позволили нам выйти из экономической депрессии. Изменение экспортных приоритетов сопряжено с политическими и экономическими рисками, и сейчас нам лучше сохранять текущий курс. Тем более что потенциальные внешние угрозы преувеличены."
 CZE_force_the_industrialists_hand: "Принудить промышленников"
 CZE_force_the_industrialists_hand_desc: "Промышленники и конгломераты слишком долго препятствовали эффективному перевооружению. Пришло время принять решение за них ради благополучия нации."
 CZE_embrace_corporatism: "Перейти к корпоративизму"
 CZE_embrace_corporatism_desc: "Мы могли бы договориться с промышленниками и заручиться их поддержкой для перевооружения. Нужно лишь согласиться с некоторыми из их требований. Будет разумно провести ряд выгодных для них реформ, которые послужат и нашим интересам."
 CZE_expand_existing_armory_plants: "Развитие имеющихся оружейных заводов"
 CZE_expand_existing_armory_plants_desc: "Перенос части оружейных заводов на новые территории связан с большими затратами, которые едва ли окупятся даже в долгосрочной перспективе. А вот увеличение производственных и научно-исследовательских мощностей имеющихся предприятий, напротив, могло бы принести нам немалую пользу, несмотря на то, что места, где они находятся, более уязвимы для атак вероятных противников."
 CZE_expand_skoda_offices: "Расширение представительств «Шкоды»"
 CZE_expand_skoda_offices_desc: "Наши международные представительства помогают развивать торговлю оружием. Было бы разумно открыть еще несколько подобных контор в новых регионах."
 CZE_skoda_office_unlock_tt: "Открывает решение: §Yсоздать конторы по продаже оружия§!"
 CZE_complete_the_power_grid: "Завершение строительства электросети"
 CZE_complete_the_power_grid_desc: "Сельские регионы нашей страны нуждаются в электрификации. Низкий уровень развития местных электросетей тормозит рост нашей экономики."
 CZE_build_the_slapy_reservoir: "Строительство Слапского водохранилища"
 CZE_build_the_slapy_reservoir_desc: "Построив ГЭС рядом с городом Слапы, мы можем улучшить экономику этого региона. Улучшение энергоснабжения существенно ускорит рост местной промышленности."
 CZE_diversify_refinery_processes: "Диверсификация переработки нефти"
 CZE_diversify_refinery_processes_desc: "Из добываемой нами нефти можно производить немало полезных побочных продуктов, но мы, к сожалению, не владеем соответствующими технологиями. Потратив время на их исследование, мы сможем создать развитую нефтеперерабатывающую индустрию."
 CZE_enlarge_smaller_wells: "Развитие небольших скважин"
 CZE_enlarge_smaller_wells_desc: "Хотя наши скважины невелики, из них можно было бы добывать гораздо больше нефти, чем сейчас. Надо только потратить время на исследование соответствующих технологий."
 CZE_develop_sudetenland_resources: "Разработка судетских ресурсов"
 CZE_develop_sudetenland_resources_desc: "Судеты богаты полезными ископаемыми, но мы их практически не добываем. Было бы разумно вложить средства в строительство новых шахт в этом регионе."
 CZE_grow_tatras_capabilities: "Расширение завода «Татра»"
 CZE_grow_tatras_capabilities_desc: "В компании «Татра» есть подразделение, занимающееся танками. Оно невелико, но у него есть весьма перспективные разработки. Если мы выделим дополнительные средства, эта компания может добиться значительного прогресса в создании бронетехники."
 CZE_bailout_moser: "Спасение компании «Мозер»"
 CZE_bailout_moser_desc: "Из-за Великой депрессии компания «Мозер» переживает тяжёлые времена. Нам стоит оказать ей поддержку и спасти от банкротства, чтобы вновь открыть заводы и трудоустроить сокращённых рабочих."
 CZE_merge_skodas_consumer_good_plants: "Объединение заводов потребительских товаров «Шкоды»"
 CZE_merge_skodas_consumer_good_plants_desc: "Компании «Шкода» принадлежит множество мелких заводов потребительских товаров, не имеющих центрального управления. Если мы оптимизируем их работу, это будет полезно не только для отдельных предприятий, но и для компании в целом."
 CZE_giant_of_central_europe_industry: "Промышленный гигант"
 CZE_giant_of_central_europe_industry_desc: "Эта вершина когда-то казалась недостижимой. Мы стали промышленным гигантом Европы!"
 CZE_continue_armed_force_reform: "Продолжение реформы вооружённых сил"
 CZE_continue_armed_force_reform_desc: "Продолжив модернизацию вооружённых сил согласно заранее составленному плану и создав военные округа со штабами в регионах, мы лучше подготовимся к любым потенциальным конфликтам."
 CZE_air_force_officer_recruitment: "Подготовка офицеров ВВС"
 CZE_air_force_officer_recruitment_desc: "Аэроклубы, работающие при поддержке Школы офицеров резерва ВВС, обеспечат необходимую базу для лётной и боевой подготовки резервистов."
 CZE_national_defense_act: "Закон о национальной обороне"
 CZE_national_defense_act_desc: "Этот нормативный акт регулирует все виды военных и иных действий, доступных Высшему совету государственной обороны для противодействия любым угрозам суверенитету, территориальной целостности, единству и безопасности нашего государства."
 CZE_car_and_oil_rationing: "Нормирование автотранспорта и топлива"
 CZE_car_and_oil_rationing_desc: "Ограничение использования частного автотранспорта и возможность реквизировать его по мере надобности позволит нам переориентировать автомобилестроительную и топливную промышленность на военные нужды."
 CZE_expand_airfield_capacity: "Расширение инфраструктуры ВВС"
 CZE_expand_airfield_capacity_desc: "Третий департамент авиации подготовил план строительства новых аэродромов с ангарами для хранения и ремонта авиатехники, а также казармами для проживания лётного и наземного персонала."
 CZE_trust_in_old_guard: "Опыт старой гвардии"
 CZE_trust_in_old_guard_desc: "Ветераны Великой войны, заслужившие наше полное доверие, будут передавать своё лётное мастерство и опыт новому поколению пилотов."
 CZE_expand_the_aero_clubs: "Развитие сети аэроклубов"
 CZE_expand_the_aero_clubs_desc: "Мы уже убедились, что аэроклубы способны обеспечивать стабильный приток талантливых пилотов в наши ВВС. Нам следует продолжить развитие их сети."
 CZE_invest_in_the_smaller_air_plants: "Инвестиции в небольшие авиазаводы"
 CZE_invest_in_the_smaller_air_plants_desc: "При должной финансовой поддержке небольшие авиазаводы способны составить здоровую конкуренцию крупным фирмам и помочь удовлетворить наши растущие требования к производству."
 CZE_continue_avia_expansion: "Расширение компании «Авиа»"
 CZE_continue_avia_expansion_desc: "Вложив средства в компанию «Авиа», мы позволим ей приобрести дополнительное оборудование и повысить эффективность производства столь необходимых нам самолетов."
 CZE_increase_military_aeronautical_institute_funding: "Увеличение финансирования авиационной науки"
 CZE_increase_military_aeronautical_institute_funding_desc: "Дополнительные сооружения для Авиационного научно-исследовательского и испытательного института позволят нашим учёным расширить познания в аэродинамике, чтобы и дальше улучшать конструкцию самолетов."
 CZE_air_training_abroad: "Обучение пилотов за границей"
 CZE_air_training_abroad_desc: "Обучаясь в авиационных учебных заведениях дружественных стран, наши курсанты смогут получить разностороннюю подготовку и ценный опыт, который пригодится им после возвращения на службу."
 CZE_establish_air_defense_zones: "Обозначение зон ПВО"
 CZE_establish_air_defense_zones_desc: "Чтобы повысить эффективность противовоздушной обороны, мы можем разместить новые зенитные батареи в стратегических точках и обозначить зоны ПВО с координацией на территориальном уровне."
 CZE_establish_air_defense_zones_enable_tt: "Открывает доступ к §Yзонам ПВО§!"
 CZE_establish_air_defense_zones_tt: "Статический коэффициент вероятности попадания ПВО: §G+10%§!"
 CZE_the_air_is_our_sea: "Небо — это наши моря"
 CZE_the_air_is_our_sea_desc: "Систематическое обучение лётному мастерству делает наших пилотов храбрыми и уверенными в себе. «У нас нет ни океанских портов, ни океанских судов. Небо — это наши моря»."
 CZE_bring_kramer_and_lobel_under_state_control: "Национализация Kramer & Löbl"
 CZE_bring_kramer_and_lobel_under_state_control_desc: "Национализировав компанию Kramer & Löbl, мы обеспечим разработку и своевременные поставки необходимых электрических приборов и радиооборудования."
 CZE_second_to_none: "Мировой лидер"
 CZE_second_to_none_desc: "Наши авиастроители непрерывно совершенствуют конструкцию своих самолётов. Продолжив исследования, мы станем мировым лидером в этой отрасли!"
 CZE_diversify_airframe_production: "Диверсификация авиастроения"
 CZE_diversify_airframe_production_desc: "Для решения различных задач в воздухе одних истребителей недостаточно. Нам нужны самолёты других типов и размеров."
 CZE_projekt_l_52: "Проект L-52"
 CZE_projekt_l_52_desc: "Будущее военной авиации за реактивными двигателями. Сейчас эта технология довольно сыра, но это не мешает нам заранее разработать проект самолета под такой двигатель, что позволит нам опередить время."
 CZE_fund_vladimir_mandl_research: "Финансирование работы Владимира Мандла"
 CZE_fund_vladimir_mandl_research_desc: "Адвокат $CZE_vladimir_mandl$ увлечён идеями ракетостроения. Взяв его на службу и выделив ресурсы, необходимые для практического воплощения его идей, мы сможем получить немалую выгоду."
 CZE_mobilize_the_reserves: "Мобилизация резервов"
 CZE_mobilize_the_reserves_desc: "Напряженность на границе растёт. Пора призвать резервистов и заранее отобранных военных специалистов в соответствии с нашим планом мобилизации."
 CZE_three_kings: "Три короля"
 CZE_three_kings_desc: "Официально поддержав местные группы сопротивления, мы значительно повысим их боеспособность. Это принесёт пользу и нашей регулярной армии."
 CZE_form_the_state_defense_guard: "Создание Государственной стражи"
 CZE_form_the_state_defense_guard_desc: "Мы можем основать Государственную стражу — специальную службу для охраны протяжённых границ нашей державы. Поскольку она будет военизированной, её сотрудники смогут стать первой линией обороны в случае вторжения из-за рубежа."
 CZE_expand_the_horska_divisions: "Расширение горнопехотных войск"
 CZE_expand_the_horska_divisions_desc: "Большую часть нашей территории составляют низкие горы и плато, поэтому солдаты со специальной горной подготовкой могут сыграть решающую роль в её обороне."
 CZE_develop_horska_artillery: "Разработка горной артиллерии"
 CZE_develop_horska_artillery_desc: "Модифицировав имеющиеся артиллерийские орудия так, чтобы они стали лёгкими и разборными, мы обеспечим достаточную огневую мощь нашим войскам, действующим в горной и холмистой местности."
 CZE_develop_horska_artillery_tech_tt: "Открывает доступ к §Yгорной артиллерии§!\n§YАртиллерия (горы)§!\n  Атака: §G+10%§!\n  Передвижение: §G+10%§!\n§YАртиллерия (холмы)§!\n  Атака: §G+10%§!\n  Передвижение: §G+10%§!"
 CZE_bribery_investigations: "Расследование коррупции"
 CZE_bribery_investigations_desc: "Мы получили анонимное письмо, посвящённое проблемам с питанием и снабжением солдат. Содержащаяся в нём информация указывает на нарушения со стороны конкретных квартирмейстеров. Мы должны положить конец коррупции, пока она не нанесла ещё больший ущерб нашей обороноспособности."
 CZE_bribery_investigations_remove_effect_tt: "Этот национальный дух будет убран по завершении фокуса «§Y$CZE_bribery_investigations$§!»"
 CZE_opl_exercises: "Учения ПВО"
 CZE_opl_exercises_desc: "Учения по противовоздушной обороне позволят нашей армии отработать манёвры, направленные на координацию действий и сохранение личного состава. Это повысит общую мобильность и защищённость подразделений."
 CZE_rapid_response_divisions: "Мобильная дивизия"
 CZE_rapid_response_divisions_desc: "Иностранные армии демонстрируют преимущества мобильных подразделений, способных менять позиции быстрее противника. Нам тоже следует создать такие подразделения и оценить их эффективность."
 CZE_redouble_tank_development_efforts: "Улучшенная разработка танков"
 CZE_redouble_tank_development_efforts_desc: "Наш текущий образец легкого танка уступает аналогам из других европейских стран. Нам надо удвоить усилия по разработке, чтобы ликвидировать отставание."
 CZE_rearmed_and_retooled: "Модернизация и перевооружение"
 CZE_rearmed_and_retooled_desc: "Нашу нынешнюю модель тяжёлого танка можно улучшить. Мы должны продолжить разработку этого направления для развития наших бронетанковых войск."
 CZE_establish_the_fall_backlines: "Подготовка рубежей для отступления"
 CZE_establish_the_fall_backlines_desc: "Будем реалистами: любая оборона может быть прорвана. Наличие заранее подготовленных рубежей, на которые могут отступить войска, сыграет в этом случае решающую роль."
 CZE_establish_the_fall_backlines_masterful_delay_tactic_tt: "\nОткрывает доступ к тактике: §Y$tactic_masterful_delay$§!"
 CZE_anti_tank_development: "Разработка противотанковых орудий"
 CZE_anti_tank_development_desc: "Увеличение количества бронетехники в армиях многих стран вынуждает нас задуматься об улучшении противотанковых орудий. Без полевой артиллерии, способной противостоять танкам, наши линии обороны будут уязвимы."
 CZE_anti_tank_development_tech_tt: "Открывает доступ к §Yмодернизации ПТО§!\n§YАртиллерия§! Бронебойность: §G+5%§!\n§YПоддержка артиллерии§! Бронебойность: §G+5%§!\n§YПТО§! Бронебойность: §G+5%§!\n§YПоддержка ПТО§! Бронебойность: §G+5%§!"
 CZE_recon_in_force: "Разведка боем"
 CZE_recon_in_force_tech_tt: "Открывает доступ к §Yразведке боем§! \n§YРазведчики§!: ОЗ: §G+5§!\nРазведка: §G+10.0%§!."
 CZE_recon_in_force_desc: "Контакты разведки с врагом в то время, когда вы ищете слабые места в его обороне, — это лучший способ получить бесценные разведданные."
 CZE_integrate_fortification_engineers: "Интеграция строителей укреплений"
 CZE_integrate_fortification_engineers_desc: "Когда наши строительные части не заняты возведением капитальных защитных сооружений, мы можем быстро перебрасывать их на фронт, чтобы они помогали передовым войскам возводить там временные укрепления."
 CZE_integrate_fortification_engineers_tech_tt: "Открывает доступ к §Yинтегрированным строителям укреплений§!\n§YСтроительная рота§!:\nУкрепленность §G+10.00%§!.\n§Y(Укрепление)§!\n Оборона §G+10.0%§!"
 CZE_concealment_efforts: "Тактика маскировки"
 CZE_concealment_efforts_desc: "Распространение штурмовой и разведывательной авиации сделало камуфляжные сети и другие средства маскировки жизненно необходимыми. Нам следует уделить особое внимание тому, чтобы позиции наших войск были надежно скрыты."
 CZE_concealment_efforts_tech_tt: "Открывает доступ к §Yулучшенным камуфляжным сетям§! \n§YОбычная пехота (лес)§!\n Оборона: §G+10%§!"
 CZE_elevate_the_vsv: "Престиж военной академии"
 CZE_elevate_the_vsv_desc: "Быть мозгом армии — значит нести огромную ответственность перед народом и государством. Генеральному штабу нужны офицеры с безупречной профессиональной подготовкой, которые отличаются надёжностью, самоконтролем, сильным характером и здравым смыслом."
 CZE_continue_with_snejdareks_plan_dynamic: "[CZE_continue_with_snejdareks_plan]"
 CZE_continue_with_snejdareks_plan_default: "Продолжение плана Шнейдарека"
 CZE_continue_with_snejdareks_plan_no_snejdareks: "Продолжение плана статичной обороны"
 CZE_continue_with_snejdareks_plan_dynamic_desc: "Эффективная сеть оборонительных сооружений делает невозможным внезапное вторжение противника. Она обеспечивает защиту и создаёт базу для перехода от стратегической обороны к наступлению."
 CZE_go_with_vojcechovskys_plan_dynamic: "[CZE_go_with_vojcechovskys_plan]"
 CZE_go_with_vojcechovskys_plan_default: "Переход к плану Лужи"
 CZE_go_with_vojcechovskys_plan_no_luza: "Доктрина активной обороны"
 CZE_go_with_vojcechovskys_plan_dynamic_desc: "Главный недостаток долговременных укреплений заключается в их стационарности. Прорванная линия обороны становится непригодной для дальнейшего использования в наступательных целях."
 CZE_improve_the_current_officer_pool: "Улучшение офицерского состава"
 CZE_improve_the_current_officer_pool_desc: "Мы будем продвигать по службе самых способных и дисциплинированных офицеров. Осуществляя контроль и координацию на уровне между верховным командованием и фронтовыми частями, они станут важным звеном в командной цепочке нашей армии."
 CZE_elevate_slovak_officers: "Продвижение словацких офицеров"
 CZE_elevate_slovak_officers_desc: "Мы снизим некоторые требования к офицерам словацкого происхождения и будем отдавать им предпочтение при продвижении по службе, чтобы увеличить их численность и повысить сплочённость нашей армии."
 CZE_promote_moravec_writings: "Поддержка творчества Моравеца"
 CZE_promote_moravec_writings_desc: "Хотя такие работы Эммануэля Моравца, как «Солдаты и время» и «Оборона государства», вызвали крайне противоречивую реакцию, его последняя публикация «Военные возможности в Центральной Европе и абиссинская война» обсуждается в крупнейших европейских газетах. Мы должны поддержать этого замечательного эксперта по вопросам оборонной политики и военной истории."
 CZE_lessons_of_war: "Уроки войны"
 CZE_lessons_of_war_desc: "Никакие учения не могут заменить уроков настоящей войны. Теперь у нас есть опыт боевых действий против равного по силе противника, и его можно использовать для повышения эффективности нашего верховного командования."
 CZE_lessons_of_war_i_had_war_with_major_flag: "Воевали с крупной державой"
 CZE_for_the_homeland: "За Родину"
 CZE_for_the_homeland_desc: "Наша армия всецело готова к предстоящему испытанию, и теперь мы можем с уверенностью сказать, что готовы защищать родные земли. Мы готовы ко всему."
 CZE_the_lions_roar: "Львиный рык"
 CZE_the_lions_roar_desc: "Символ чехословацкого льва отражает лучшие качества нашей армии. Отвагу, силу и героизм в их наивысшем проявлении. Несравненный дух наших войск известен всем."
 CZE_diversify_our_specialists: "Диверсификация специальных подразделений"
 CZE_diversify_our_specialists_desc: "Помимо горных войск, нам нужны специалисты по ведению боя в других ландшафтных и климатических условиях. В конце концов, воюют не только среди гор и холмов."
 CZE_merge_the_financial_and_state_guard: "Объединение Государственной и Финансовой стражи"
 CZE_merge_the_financial_and_state_guard_desc: "После создания Государственной стражи такие службы, как Финансовая стража, утратили своё значение. Объединив её с Государственной стражей, мы сможем быстро нарастить численность последней."
 CZE_merge_the_financial_and_state_guard_tt: "Открывает доступ к §Yинтегрированным частям Финансовой стражи§! \n§YВоенная полиция§!: ОЗ: §G+5§!."
 CZE_logistics_beyond_the_sudetes: "Логистика за Судетами"
 CZE_logistics_beyond_the_sudetes_desc: "Если мы планируем вести боевые действия за пределами Судетских гор, нам надо освоить принципы дальней логистики. Они заметно отличаются от того, к чему мы привыкли у себя дома."
 CZE_logistics_beyond_the_sudetes_tt: "Открывает доступ к §Yулучшенным складам снабжения§!\n§YРота обеспечения§!: Расход припасов: §G-10%§!"
 CZE_expand_the_river_monitor_fleet: "Расширение речной флотилии мониторов"
 CZE_expand_the_river_monitor_fleet_desc: "Наша речная флотилия мониторов является одной из крупнейших в Европе и играет важную роль в обороне внутренних территорий страны. Если мы добавим в неё новые корабли, она станет ещё эффективнее."
 CZE_the_tvp_project: "Проект основного танка"
 CZE_the_tvp_project_desc: "Наша армия предложила разработать основной боевой танк (TVP) нашей собственной конструкции. Некоторые компании, имеющие богатый опыт производства бронетехники, уже проявили интерес к этом проекту."
 CZE_expand_the_land_department_of_vtu: "Расширение сухопутного отделения ВТИ"
 CZE_expand_the_land_department_of_vtu_desc: "Предоставив сухопутному отделению Военно-технического института (ВТИ) дополнительные технические средства и полигоны, мы ускорим разработку новых видов военного снаряжения."
 CZE_department_two_expansion: "Второй департамент"
 CZE_department_two_expansion_desc: "Второй департамент, отвечающий за разведку, нуждается в дополнительных ресурсах для эффективной борьбы с вражескими шпионами. Кроме того, вложив в него средства, можно развивать определённые направления его работы."
 CZE_military_intelligence: "Отдел военной разведки"
 CZE_military_intelligence_desc: "Военная разведка является одним из важнейших направлений работы департамента. Выделив для неё больше ресурсов, мы можем получить ощутимую выгоду."
 CZE_air_intelligence: "Отдел авиационной разведки"
 CZE_air_intelligence_desc: "Войну в воздухе нельзя выиграть без точной и достоверной информации о ВВС противника. Чтобы добиться господства в небе, мы должны знать, сколько у врага самолётов."
 CZE_within_the_eagles_nest: "В орлином гнезде"
 CZE_within_the_eagles_nest_desc: "Наличие информаторов и диверсантов в соседних странах может дать нашей армии огромное преимущество. Второй департамент готов создать для нас шпионскую сеть колоссальных масштабов."
 CZE_restart_naval_gun_production: "Возобновление производства морских орудий"
 CZE_restart_naval_gun_production_desc: "Когда-то компания «Шкода» была крупнейшим конструктором и производителем морской артиллерии в Австро-Венгрии. Возобновление этого производства даст нам шанс построить собственную кораблестроительную индустрию."
 CZE_restart_naval_gun_production_tt: "§YПриоритет «Шкоды»§! «флот» становится §Yактивным§!"
 CZE_reform_the_naval_detachment: "Восстановление военного флота"
 CZE_reform_the_naval_detachment_desc: "Недавно мы расформировали военный флот, чтобы передать его ресурсы в состав армии. Но в свете последних событий возникла необходимость его восстановить."
 CZE_build_2_dockyards_when_we_have_coast_tt: "В случайном прибрежном §Yрегионе§!, оказавшемся под вашим контролем, будут мгновенно построены §G2§! §Yверфи§!."
 CZE_skoda_naval_yards: "Верфи «Шкоды»"
 CZE_skoda_naval_yards_desc: "Теперь, когда у нас есть выход к морю, мы можем восстановить кораблестроительную индустрию, опираясь на опыт времён Австро-Венгрии и знания нынешних специалистов. В первую очередь нам нужны собственные верфи."
 CZE_build_3_dockyards_when_we_have_coast_tt: "В случайном прибрежном §Yрегионе§!, оказавшемся под вашим контролем, будут мгновенно построены §G3§! §Yверфи§!."
 CZE_legacy_of_the_kriegsmarine: "Наследие кригсмарине"
 CZE_legacy_of_the_kriegsmarine_desc: "Ещё не так давно наши заводы участвовали в строительстве больших кораблей для австро-венгерского флота. Теперь накопленный ими опыт позволит нам строить собственные линкоры."
 CZE_build_off_old_ganz_danubius_designs: "Использование старых проектов Ganz Danubius"
 CZE_build_off_old_ganz_danubius_designs_desc: "Старые проекты компании Ganz Danubius могут пригодиться нам при разработке новых крейсеров. В нашей стране ещё остались специалисты, работавшие над этими проектами."
 CZE_modernize_trieste_designs: "Модернизация проекта «Триест»"
 CZE_modernize_trieste_designs_desc: "Изучив старые проекты австро-венгерских тяжёлых крейсеров и малых линкоров, мы улучшим наше представление о том, как строить корабли этого класса."
 CZE_leverage_gunboat_experience: "Опыт строительства канонерок"
 CZE_leverage_gunboat_experience_desc: "Используя опыт строительства речных канонерок, мы можем существенно ускорить проектирование эсминцев. У нас есть для этого специалисты."
 CZE_revive_kraljevica_designs: "Возрождение проектов из Кралевицы"
 CZE_revive_kraljevica_designs_desc: "Опираясь на опыт строительства канонерок и старые проекты с верфей Кралевицы, мы сможем строить собственные эсминцы."
 CZE_wolfs_of_bohemia: "Волки Богемии"
 CZE_wolfs_of_bohemia_desc: "Поскольку в нашей стране ещё остались специалисты по подводным лодкам, нам будет не так уж сложно построить собственные «волчьи стаи»."
 CZE_raider_lineage: "Рейдерские традиции"
 CZE_raider_lineage_desc: "В нашей стране живёт немало бывших офицеров австро-венгерского флота, имеющих опыт рейдерства. Нам стоит использовать этот опыт."
 CZE_a_modern_navy: "Современный флот"
 CZE_a_modern_navy_desc: "Добившись значительных успехов в кораблестроении, мы наконец можем сказать, что у нас есть современный и сильный флот."
 CZE_build_1_dockyards_when_we_have_coast_tt: "В случайном прибрежном §Yрегионе§!, оказавшемся под вашим контролем, будет мгновенно построена §G1§! §Yверфь§!."
 CZE_naval_aviation: "Морская авиация"
 CZE_naval_aviation_desc: "Судя по всему, будущее флота — за авианосцами и их самолётами. Нам стоит потратить время на изучение этой новой для нас области военно-морского дела."
 CZE_across_the_atlantic: "Через Атлантику"
 CZE_across_the_atlantic_desc: "По-настоящему эффективный флот должен быть способен пересечь океан. Нам надо подготовить свои корабли к столь дальним переходам."
 CZE_joint_equipment_designs: "Совместные проекты снаряжения"
 CZE_joint_equipment_designs_desc: "И [ROOT.GetNameDef], и [GER.GetNameDef] являются лидерами в сфере проектирования танков и самолетов. У каждой из стран свои особенности, и мы должны делиться информацией и уделять внимание своим сильным сторонам."
 CZE_negotiate_sphere_of_influence: "Договориться о сфере влияния"
 CZE_negotiate_sphere_of_influence_desc: "Невозможно отрицать, что военные ресурсы [ROOT.GetNameRuGen] бесценны для [GER.GetAdjRuLower]ого альянса. Будет справедливо, если взамен мы попросим новых территорий."
 CZE_set_up_polish_puppet_state: "Создать южно[POL.GetAdjRuLower]ое марионеточное государство"
 CZE_set_up_polish_puppet_state_desc: "Поскольку [GER.GetNameRuAcc] интересует создание марионеточного государства в Польше, очевидно, мы должны попытаться сделать то же самое."
 CZE_usurp_the_mantle: "Узурпировать трон"
 CZE_usurp_the_mantle_desc: "Поскольку наше королевство простирается от Балтийского моря до Адриатики и властвует над землями Австрии — в прошлом региональной державы, мы можем провозгласить себя законными преемниками Священной Римской империи."
 CZE_austro_hungary_puppets: "Все §Yсубъекты§!, на которые распространяются требования фокуса"
 CZE_decrease_autonomy_tier: "Все субъекты в статусе §Yдоминиона§! или §Yмарионетки§! потеряют уровень автономии."
 #Exile Focus
 CZE_prepare_for_exile: "Подготовка к изгнанию"
 CZE_prepare_for_exile_desc: "Государство должно тайно помочь нашим политическим лидерам бежать за границу и создать правительство в изгнании."
 CZE_joins_government_in_exile_tt: "Присоединяется к §Yправительству в изгнании§!"
 CZE_infiltrate_collaborationist_organizations: "Внедриться в ряды коллаборационистов"
 CZE_administrative_chaos_tt: "Эффект §Yдля рейхскомиссариата§! при выполнении фокуса §Y«$CZE_enter_exile$»§!:"
 CZE_infiltrate_collaborationist_organizations_desc: "Ситуация, когда [ROOT.GetAdjRuLower]ие граждане, верные правительству в изгнании, возглавляют коллаборационистские организации, может показаться странной, но это отличная возможность следить за врагом и тайно мешать его планам."
 CZE_enter_exile: "Уйти в изгнание"
 CZE_enter_exile_desc: "Теперь, когда потенциальные союзники вступили в бой с [GER.GetAdjRuLower]им хищником, наше правительство может начать подготовку к борьбе за независимость."
 CZE_refused_exile: "Отказ принять [ROOT.GetNameRuAcc]"
 CZE_contact_the_czech_and_slovak_legion: "Связаться с Чехословацким легионом"
 CZE_contact_the_czech_and_slovak_legion_desc: "Немало храбрых [ROOT.GetAdjRuLower]их граждан бежало в [POL.GetNameRuAcc] и [FRA.GetNameRuAcc], чтобы продолжить борьбу за свободу [CZE.GetNameRuGen]. Мы должны поддерживать с ними связь и координировать их усилия."
 CZE_skoda_priority_shortcut_finder: "Приоритет «Шкоды»"
 CZE_skoda_priority_shortcut_finder_desc: "Это текущий приоритет «Шкоды»"
 #Decision unlock TT
 CZE_decision_unlock: "Открывает решение:"
 CZE_demand_regime_change_tt: "$CZE_decision_unlock$§YПотребовать смены режима в государстве§!"
 CZE_propose_unification_tt: "$CZE_decision_unlock$§YПригласить государство в Чехословацкий союз§!"
 CZE_integrate_nation_tt: "$CZE_decision_unlock$§YИнтегрировать государство§!"
 ###############################################
 #Germany
 GER_integrate_czech_manufacturers: "Интеграция чешских производителей"
 GER_integrate_czech_manufacturers_desc: "Заводы и фабрики Богемии обладают огромными производственными мощностями. Они способны стать настоящей золотой жилой для нашей военной промышленности. Очевидно, что нам следует интегрировать их в наши производственные цепочки."
 GER_integrate_czech_manufacturers_no_aat_tt: "§GДоступно§! как §Yконструкторское бюро§!:\n§Y$CZE_skoda_works_german_organization$§!, §Y$CZE_bohmische_mahrische_maschinenfabrik_ag_german_organization$§!, §Y$CZE_zlin_aircraft_organization$§!, and §Y$CZE_ceska_zbrojovka_uhersky_brod_organization$§!"
 CZE_unlocks_sokolov_raid_pfot_tt: "Открывает §Yдесантный налет§! на §YФалкноф§!"
