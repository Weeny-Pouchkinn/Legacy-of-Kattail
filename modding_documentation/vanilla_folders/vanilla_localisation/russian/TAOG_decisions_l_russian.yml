 AST_japanese_war_mission: "Японская война"
 AST_japanese_war_mission_desc: "Австралия не желает оставаться один на один с превосходящими силами [JAP.GetNameRuGen]. Они призывают нас сделать первый шаг и урегулировать назревающий конфликт в кратчайшие сроки."
