l_russian:
 HOL_recall_conrad_helfrich: "Отзыв Конрада Хелфриха из Индии"
 HOL_recall_conrad_helfrich_desc: "В эти непростые времена мы прежде всего должны думать о благополучии родины. Конрад Хелфрих, лучший адмирал нашего Королевского военно-морского флота, должен вернуться в Нидерланды."
 INS_is_taking_volksraad: "Сейчас принимает закон в фольксрааде"
 INS_volksraad_cat: "Фольксраад"
 INS_volksraad_cat_desc: "Народный совет, названный по-голландски «фольксраад», был учрежден в 1918 году — это была попытка установить демократию в Ост-Индии в рамках так называемой этической политики. В совет входили нидерландские и местные чиновники, выбранные различными способами. Хотя Нидерланды сохраняли безусловное право вето, фольксраад мог вносить предложения и законопроекты."
 INS_volksraad_allow_language_in_schools: "Разрешить индонезийский язык в школах"
 INS_volksraad_allow_language_in_schools_desc: "Поскольку преподавание в школах Ост-Индии ведется исключительно на голландском языке, обучаться в них могут только нидерландцы и состоятельные индонезийцы. Предложение фольксраада открыть школы на индонезийском языке ждет рассмотрения генерал-губернатором."
 INS_volksraad_allow_language_in_government: "Разрешить индонезийский язык в правительстве"
 INS_volksraad_allow_language_in_government_desc: "Для занятия государственных должностей в Ост-Индии, включая должности в фольксрааде, требуется свободное владение нидерландским языком. Многие члены фольксраада, особенно представители коренных общин, усомнились в демократичности такого подхода. Они выступили с инициативой, согласно которой государственные должности по возможности должны занимать лица, говорящие на индонезийском языке."
 INS_volksraad_remove_education_quotas: "Отменить образовательные квоты"
 INS_volksraad_remove_education_quotas_desc: "В образовательной системе Ост-Индии сейчас действует система квот на количество учеников индонезийского и нидерландского происхождения. Многие считают, что она дает голландцам несправедливое преимущество, поэтому фольксраад относится к ней неоднозначно. Мы можем позволить ему еще много лет обсуждать возможные реформы этой системы, а можем попросту отменить ее."
 INS_volksraad_reduce_rubber_export_tax: "Снизить налог на частный экспорт каучука"
 INS_volksraad_reduce_rubber_export_tax_desc: "Крайне высокий налог, взимаемый с экспортеров каучука, позволяет нам сохранять монополию на этом рынке, но делает содержание частных плантаций нерентабельным. В результате это приводит к стагнации экономики в отдельных регионах. На момент введения налога это казалось приемлемой ценой, но из-за международного протекционизма, вызванного Великой депрессией, экспорт каучука стал намного менее привлекательным. Возможно, нам пора снизить этот налог для стимуляции экономики."
 INS_volksraad_knil_rank_limit: "Принять законы о противодействии дискриминации при присвоении воинских званий"
 INS_volksraad_knil_rank_limit_desc: "Несмотря на отсутствие формальных ограничений, в Королевской голландской ост-индской армии существует неписаный запрет присваивать звания выше полковника офицерам индонезийского происхождения. Несколько партий фольксраада пытаются заставить правительство признать заслуги индонезийских военнослужащих."
 INS_volksraad_legalize_displaying_flag: "Легализовать красно-белый флаг"
 INS_volksraad_legalize_displaying_flag_desc: "Поскольку красно-белый флаг так называемой «Индонезии» ассоциируется с национализмом и антиколониализмом, его публичная демонстрация сейчас запрещена законом. Если мы ее разрешим, это будет воспринято как готовность к сотрудничеству и поможет приостановить радикализацию национальных движений архипелага."
 INS_volksraad_education_subsidies_for_indonesians: "Предоставлять образовательные субсидии независимо от происхождения"
 INS_volksraad_education_subsidies_for_indonesians_desc: "В фольксрааде продолжаются дебаты о субсидиях и стипендиях для нидерландских студентов в Ост-Индии. Некоторые представители коренных народов предлагают расширить эту систему на всех студентов независимо от происхождения. Это существенно улучшит наши отношения с населением, но обойдется недешево."
 INS_volksraad_indonesian_national_language: "Признать индонезийский язык государственным"
 INS_volksraad_indonesian_national_language_desc: "Индонезийский язык распространился во многих регионах архипелага, став своего рода культурным мостом между местными народами. Его уже разрешено использовать в образовательной системе и в государственном управлении, но некоторые депутаты фольксраада предлагают пойти дальше и признать индонезийский официальным языком колонии наравне с голландским."
 INS_volksraad_official_flag: "Официально признать индонезийский флаг"
 indonesia_volksraad_official_flag_effect_tt: "Мы изменим наш флаг на красно-белый."
 INS_volksraad_official_flag_desc: "Инициативы фольксраада, направленные на автономию, увенчались успехом. Территория, которая еще несколько лет назад была Голландской Ост-Индией, теперь называется Доминионом Индонезии. Нам нужен новый флаг, соответствующий этим переменам."
 indonesia_volksraad_passed_6: "Приняты законы о противодействии дискриминации при присвоении воинских званий"
 INS_autonomy_indonesian_in_schools: "Индонезийский язык разрешен в школах"
 INS_autonomy_indonesian_in_govenment: "Индонезийский язык разрешен в правительстве"
 INS_autonomy_no_education_quotas: "Отменены образовательные квоты"
 INS_autonomy_reduced_rubber_tax: "Снижен налог на экспорт каучука"
 INS_autonomy_knil_rank_limit: "Приняты законы о противодействии дискриминации в армии"
 INS_autonomy_flag_legalized: "Разрешена демонстрация красно-белого флага"
 INS_autonomy_education_subsidies: "Индонезийцы получили субсидии на образование"
 INS_autonomy_national_language: "Признан индонезийский язык"
 INS_autonomy_official_flag: "Разрешено использование индонезийского флага"
 INS_move_capital_to_amsterdam: "Перенести столицу в Амстердам"
 INS_move_capital_to_batavia: "Перенести столицу в Батавию"
 INS_sukarno_is_dead: "Сукарно мёртв"
 INS_atjeh_management: "Полицейская деятельность в Ачехе"
 INS_atjeh_management_2: "Интеграция Ачеха"
 INS_soetardjo_petition: "Петиция Сутарджо ожидает рассмотрения"
 INS_soetardjo_petition_desc: "Участники круглого стола, проведенного Сутарджо, пришли к выводу, что для обретения самодостаточности [INS.GetNameRuDat] нужно выполнить определенные экономические требования. Мы должны продемонстрировать, что уверенно движемся в этом направлении, иначе [HOL.GetNameDef] в конце концов добь[AST.GetNameEndRuPresentEtYut]ся отмены этого решения, чтобы сохранить статус-кво."
 INS_soetardjo_petition_refresh_tt: "Возобновляет задание: §Y«Петиция Сутарджо ожидает рассмотрения»§! со сроком §Y120 дней§!."
 INS_soetardjo_pending: "Фольксраад обсуждает петицию Сутарджо об автономии"
 INS_soetardjo_pending_desc: "Депутат фольксраада по имени Сутарджо возглавляет мирное националистическое движение. Сейчас он готовит петицию о предоставлении [INS.GetNameRuDat] дополнительной автономии и собирается собрать круглый стол с участием голландцев и индонезийцев, чтобы обсудить желание последних получить независимость в составе Нидерландского Содружества. В настоящее время петиция обсуждается в фольксрааде. После окончания дебатов мы сможем принять решение, способное привести к исключительно важным последствиям."
 INS_flag_legalized: "Демонстрация красно-белого флага разрешена"
 INS_owned_states_at_game_start_tt: "Все индонезийские регионы"
 INS_win_condition_base_republic_warning: "Разрушить Ост-Индию"
 INS_win_condition_base_republic_warning_desc: "Мы должны продолжать борьбу, вербовать гражданских и поддерживать огонь в сердцах всех индонезийцев. Когда мы свергнем ост-индскую администрацию, [HOL.GetNameRuDat] придется уступить нашим требованиям."
 INS_win_condition_base_republic_real: "Разрушить Ост-Индию"
 INS_win_condition_base_republic_real_desc: "Мы должны продолжать борьбу, вербовать гражданских и поддерживать огонь в сердцах всех индонезийцев. Когда мы свергнем ост-индскую администрацию, [HOL.GetNameRuDat] придется уступить нашим требованиям."
 will_complete_when_conditions_met_tt: "Будет автоматически выбрано после исполнения требований."
 INS_militias_cat: "Народное ополчение"
 INS_militias_basic_summon: "Мобилизовать гражданских"
 INS_militias_basic_summon_desc: "Мы будем вербовать молодежь и студентов, мечтающих о независимой Индонезии, в вооруженное ополчение Армии народной безопасности."
 INS_militias_kris_repayment: "Ополчение KRIS требует инвестиций в Сулавеси"
 INS_militias_di_mission: "Дарул Ислам требует представительства"
 INS_militias_jakarta_pemuda_mission: "Молодежная организация Джакарты требует улучшения образования"
 INS_militias_railway_pemuda_mission: "Железнодорожная молодежная организация требует войны"
 INS_revolution_planning_cat: "Подпольная революция"
 INS_revolution_planning_hq: "Основать революционный штаб в регионе [FROM.GetName]"
 INS_revolution_planning_hq_desc: "В регионе [FROM.GetName] мы создадим революционный штаб для централизованного управления базами ополчения по всему архипелагу. Территория штаба станет приоритетной целью для наших врагов, но мы должны заботиться о том, чтобы она оставалась под нашим полным контролем."
 INS_revolution_planning_hq_tt: "Построено не более §Y3§! революционных штабов"
 INS_revolution_planning_hq_DONE: "Революционный штаб"
 INS_revolution_planning_hq_DONE_desc: "Это наш революционный штаб, командующий всеми силами ополчения. Когда мы провозгласим независимость, этот регион будет под нашим контролем."
 INS_revolution_planning_hq_DONE_trigger_tt: "Можно создать только один штаб"
 INS_revolution_planning_envoy_DONE_trigger_tt: "В одном регионе не может быть несколько баз"
 INS_revolution_planning_envoy_DONE: "База ополчения в регионе [FROM.GetName]"
 INS_has_revolutionary_hq: "Создан революционный штаб"
 INS_revolution_planning_influence_state: "Создать базу ополчения в регионе [FROM.GetName]"
 INS_revolution_planning_influence_state_desc: "Мы отправим в регион [FROM.GetName] силы ополчения, чтобы они создали там базу, обеспечили связь местных революционеров со штабом и заранее подготовились к провозглашению независимости."
 INS_revolution_planning_cat_map_name: "Выберите, где вы хотите управлять ополчением"
 INS_state_revolution_hq_tt: "Когда мы провозгласим независимость, этот регион будет под нашим контролем."
 INS_hq_warning: "§W§RСоздать штаб здесь будет очень сложно. Это потребует почти всех наших ресурсов.§!§!"
 INS_revolution_points_remaining_tt: "Можно построить еще как минимум §Y1§! базу ополчения (осталось: §Y[?INS_revolution_points_remaining]§!)"
 INS_revolution_planning_influence_state_points_notif_tt: "Мы сможем создать базы ополчения в §Y[?INS_starting_revolution_points_count]§! дополнительных регионах §Rза пределами Явы§!."
 INS_revolution_planning_influence_state_points_notif_tt_1: "Мы сможем создать базу ополчения в §Y1§! дополнительном регионе §Rза пределами Явы§!."
 INS_revolution_point_spend_tt: "В регионе [FROM.GetName] создана база ополчения"
 INS_revolution_points_in_state_tt: "В регионе [FROM.GetName] еще нет базы ополчения"
 war_escalation_1_or_more_tt: "Уровень эскалации не менее §Y1§!"
 war_escalation_2_or_more_tt: "Уровень эскалации не менее §Y2§!"
