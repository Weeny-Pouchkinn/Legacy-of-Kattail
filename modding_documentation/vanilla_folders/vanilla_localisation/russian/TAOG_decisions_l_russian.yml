 AST_print_the_publicist: "Печать «Публициста»"
 AST_print_the_publicist_desc: "Газета «Публицист» (англ. The Publicist) — вестник движения «Австралия превыше всего». Она играет важную роль в привлечении новых сторонников. Очередной номер позволит усилить пропаганду наших идей."
 AST_print_the_publicist_upgrade: "$AST_print_the_publicist$"
