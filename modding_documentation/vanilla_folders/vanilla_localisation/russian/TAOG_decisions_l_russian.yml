 SIA_limited_war_cat: "Ограниченная война"
 SIA_limited_war_cat_desc: "У нас пока нет шансов одолеть великие державы региона в открытом конфликте. Но постепенно, посредством тщательно спланированных кампаний, мы будем расширять своё влияние, подрывая их позиции и наращивая свою мощь."
 SIA_start_limited_war_indochina: "Начать ограниченную войну с [FROM.GetNameRuInst] в Индокитае"
 SIA_start_limited_war_indochina_tt_main: "С §Y[FROM.GetNameRuInst]§! начнется §Yограниченный конфликт§!.\nКонтроль над всеми важными регионами, принадлежащими §Y[FROM.GetNameRuDat]§!, позволит нам забрать их, не переходя к полномасштабной войне.\n§RЕсли наш процесс капитуляции продвинется дальше [?var:global.limited_war_surrender_threshold|%.0], ограниченный конфликт будет проигран.§!\n\n§RПоражение в ограниченном конфликте может вынудить нас отдать ранее завоеванные территории§!"
 SIA_start_limited_war_rejoin_faction: "Мы временно покинем текущий альянс и вступим в него снова после окончания §Yограниченных войн§!."
 SIA_start_limited_war_can_join_faction: "Мы снова сможем вступать в альянсы после окончания §Yограниченной войны§!"
 is_not_engaged_in_a_limited_war: "Не участвует в §Yограниченной войне§!"
 SIA_limited_war_indochina: "[SIA_GetLimitedWarTarget]"
 SIA_limited_war_indochina_desc: "Захватить контроль над всеми выделенными регионами, чтобы выиграть §Yограниченный конфликт§! и забрать эти земли, не переходя к полномасштабной войне.\n§RЕсли наш процесс капитуляции продвинется больше чем на [?var:global.limited_war_surrender_threshold|%.0], ограниченный конфликт будет проигран§!"
 SIA_limited_war_indochina_target: "§YОграниченная война§!; противник — §Y[?var:limited_war_target.GetName]§!"
 SIA_limited_war_indochina_no_target: "Ограниченная война закончилась провалом"
 SIA_start_limited_war_malaysia_burma: "Начать ограниченный конфликт с [FROM.GetNameRuInst]"
 SIA_new_territories_administration_cat: "Администрация новых территорий"
 SIA_new_territories_administration_cat_desc: "Завоевание — это лишь начало. Если мы хотим, чтобы захваченные территории стали неотъемлемой частью нашей державы, а не обузой, мы должны ими управлять, а также развивать их и защищать."
 SIA_finish_the_triangular_defense_network: "Завершить оборонительный треугольник"
 SIA_finish_the_triangular_defense_network_desc: "Достроив две крепости — одну на севере и одну на юге, — мы получим оборонительный треугольник с третьей вершиной в Бангкоке. Даже если одна крепость падет, останутся две другие."
