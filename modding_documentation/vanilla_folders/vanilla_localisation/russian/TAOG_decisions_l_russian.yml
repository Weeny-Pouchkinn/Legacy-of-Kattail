 AST_call_on_fascists: "[GET_AST_CALL_ON_FASCISTS]"
 AST_call_on_fascists_desc: "«Австралия превыше всего» — небольшое движение всего лишь с горсткой сторонников и потому нередко испытывает финансовые трудности. Однако зарубежная группа единомышленников выразила желание поддержать наши устремления материально, чтобы обеспечить дальнейшее развитие движения."
 AST_call_on_japanese_fascists: "Обращение к японским фашистам"
 AST_call_on_foreign_fascists: "Обращение к иностранным фашистам"
 AST_a_convenient_disaster: "Своевременная катастрофа"
 AST_a_convenient_disaster_desc: "Насколько бы ни выросла поддержка движения «Австралия прежде всего», консерваторы по-прежнему пытаются ей противостоять. Чтобы привести националистов к власти, простых выборов недостаточно. Нужно посеять смуту в правительстве.\n\nНаше движение не может самостоятельно вызвать подобное развитие событий, а наш иностранный фашистский союзник вполне в состоянии. Поддержав наш приход к власти, иностранные фашисты обретут в лице [AST.GetNameRuGen] союзника."
 AST_a_convenient_disaster_tt: "\nЭто событие дестабилизирует действующее правительство и, в конечном счете, создаст условия, при которых §Y[AST.GetFascistParty]§! станет правящей партией."
 AST_a_convenient_disaster_flag: "Решение §Y«Своевременная катастрофа»§! вызвало §Yавиакатастрофу в Канберре§!."
