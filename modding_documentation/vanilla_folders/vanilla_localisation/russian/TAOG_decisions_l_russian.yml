 ast_support_for_comrades_idea: "Поддержка наших товарищей"
 ast_support_for_comrades_idea_desc: "Мы окажем поддержку нашим товарищам"
 ast_support_for_comrades_idea_improved: "$ast_support_for_comrades_idea$"
 ast_support_for_comrades_idea_improved_desc: "$ast_support_for_comrades_idea$"
 idea_AST_civil_war_on_their_own: "Сами по себе"
 idea_AST_civil_war_on_their_own_desc: "Нам придется вести эту войну самим."
 ast_foreign_communist_influence_idea: "Иностранное коммунистическое влияние"
 ast_foreign_communist_influence_idea_desc: "На нас оказывают влияние австралийские коммунисты!"
 open_mae_moh_lignite_mine: "Открыть буроугольную шахту в Мемо"
 SIA_release_contigency_funds: "Задействовать резервный фонд"
 SIA_release_contigency_funds_tt: "§Y«$idea_SIA_contingency_funds$»§! изменяется на:\n"
 SIA_release_contigency_funds_tt2: "на §Y[?var:SIA_contingency_funds]§! мес. После этого средства исчезнут. Чем дольше мы копим средства в мирное время, тем на более долгий срок их хватит во время войны."
 has_released_contingency_funds: "Задействует резервный фонд"
 AST_election_approaching_cat: "Приближаются выборы"
 AST_election_approaching_cat_desc: "Не успело правительство сформироваться, как на горизонте замаячили следующие выборы. Демократические партии изо всех сил пытаются заручиться поддержкой. Они надеются, что этого хватит для победы, когда откроются избирательные участки и в урны для голосования посыпятся бюллетени."
 AST_final_reforms_mission: "Заключительные реформы"
 AST_final_reforms_mission_desc: "Благодаря уверенному руководству, консервативным взглядам и лояльности к Великобритании Объединённая партия Австралии укрепила свою поддержку, благодаря чему повысила шансы победить на будущих выборах. Чтобы сохранить общественную поддержку, её лидерам необходимо ускорить проведение реформ.\n\n§YЭффекты во время действия:§!\n§W(§Yдемократические§! фокусы):\nсокращение времени завершения на §Y7§! дней§!"
 AST_final_reforms_effect_tt: "\nЭффекты во время действия фокуса §Y«$AST_final_reforms_mission$»§! (§Y180§! дней):"
 AST_labor_campaign_tour_mission: "Предвыборная кампания лейбористов"
 AST_labor_campaign_tour_mission_desc: "Стремясь представлять интересы каждого гражданина, Лейбористская партия Австралии заняла иную позицию в отношении империализма и лояльности Австралии к Британии. По мнению партии, приоритет с внешних интересов должен сместиться на удовлетворение внутренних потребностей.\n\nЧтобы донести это послание как до нынешней правящей партии, так и до избирателей, лейбористы запустят общенациональную предвыборную кампанию.\n\n§YЭффекты во время действия:§!\n§Wежедневный рост числа голосов за §YАЛП§!: §G+0,05§!§!"
 AST_labor_campaign_tour_effect_tt: "\nЭффекты во время действия фокуса §Y«$AST_labor_campaign_tour_mission$»§! (§Y180§! дней):\nежедневный рост числа голосов за §YАЛП§!: §G+0,05§!\n\nЭффекты за §Y180§! дней:"
 AST_election_season_cat: "Период выборов"
 AST_election_season_cat_desc: "Не успевает одно правительство приступить к работе, как следующее уже готовится занять его место. Повлиять на мнение граждан сейчас вряд ли получится, но партии всё равно будут пытаться это сделать. Борьба продлится до самого дня выборов, а там всё решат голоса избирателей."
 AST_election_countdown: "Приближение выборов"
 AST_election_countdown_desc: "До открытия избирательных участков осталось всего несколько дней.\n\n§W$AST_expected_election_winner_tt$§!"
 AST_government_formation_period: "Период формирования правительства"
 AST_government_formation_period_desc: "Каждая партия хочет проводить свою независимую политику, но при определённых обстоятельствах наиболее разумным вариантом может стать правительство национального единства.\n\n§W§YЭффекты во время действия:§!\n£GFX_trigger_yes $AST_election_recently_concluded$\n\n$AST_ruling_party$ может сформировать §Yправительство национального единства§!.\n\nСформируйте §Yправительство национального единства§! в окне «Демократические выборы» на дереве фокусов Австралии.§!"
 AST_war_is_coming_cat: "Предчувствие войны"
 AST_war_is_coming_cat_desc: "Напряженность нарастает, и австралийские официальные лица и население начинают осознавать, что война может оказаться неизбежной вне зависимости от политических или экономических предпочтений.\n\nНеобходимо созвать кабинет министров для выработки плана на случай вторжения. Однако до этого может потребоваться принятие мер, которые не получат единогласной поддержки правительства."
 AST_seize_civilian_industry: "Изъятие гражданской промышленности"
 AST_seize_civilian_industry_desc: "Потребительские товары необходимы как населению, так и экономике, однако в условиях войны приоритеты неизбежно меняются. Грядет война — и мы должны быть готовы к ней."
 AST_scorch_the_north: "Выжженная земля на севере"
 AST_scorch_the_north_desc: "В случае угрозы вторжения с севера могут быть его можно остановить, несмотря на значительные издержки. Тактика выжженной земли приведет к замедлению развития северных регионов, однако может оказаться необходимой мерой для сдерживания агрессора."
 AST_scorch_the_north_tt: "§YЭффекты в случае морского вторжения в один из северных регионов:§!"
 AST_the_brisbane_line: "Брисбенская линия"
 AST_the_brisbane_line_desc: "Оборонного потенциала Австралии может не хватить для отражения иностранной агрессии. Принятие политики приоритетной обороны важнейших территорий вместо равномерного распределения укреплений позволит нам сохранить контроль над наиболее развитыми и населенными частями [AST.GetNameRuGen].\n\nНесмотря на то, что такая политика, несомненно, встретит возражения со стороны тех, кто отвергает любые формы стратегических уступок, правительство обязано выбрать наиболее рациональный курс развития [AST.GetNameRuGen]."
 AST_summon_the_cabinet_mission: "Созвать Кабинет министров"
 AST_summon_the_cabinet_mission_desc: "В Канберру были вызваны дипломаты, чиновники и теоретики. Предстоит обсудить угрозу вторжения."
 AST_summon_the_cabinet_tt1: "\nЭто событие вызовет разлад в действующем правительстве — и, возможно, даже §Yраспад§!."
 AST_australian_accusations_modifier: "Обвинения австралийцев"
 AST_cabinet_trust_cat: "Доверие к кабинету"
 AST_cabinet_trust_increase_tt: "\n§GПовысить§! §Yдоверие к кабинету§!\n"
 AST_cabinet_trust_decrease_tt: "\n§RПонизить§! §Yдоверие к кабинету§!\n"
 AST_cabinet_trust_remove_tt: "§GЛишить§! §Yкабинет доверия§!"
 AST_australian_comforts_fund: "£BoP_right_texticon Австралийский фонд помощи военнослужащим"
 AST_australian_comforts_fund_desc: "Правительство почтит память одной из жертв авиакатастрофы в Канберре, направив средства в Австралийский фонд помощи военнослужащим, в работе которого активно участвует его вдова.\n\nЦель фонда — облегчить тяготы полевой службы австралийским военнослужащим. Он доставляет солдатам продовольствие и предметы первой необходимости в дополнение к имеющимся армейским пайкам и личному снаряжению, так что пожертвования фонду укрепят австралийские вооруженные силы."
 AST_eminent_successors: "£BoP_right_texticon  Видные преемники"
 AST_eminent_successors_desc: "Среди жертв авиакатастрофы в Канберре были государственные деятели, пользовавшиеся огромным уважением. И хотя эта утрата невосполнима, назначение нескольких видных преемников, возможно, позволит стабилизировать работу правительства и восстановить доверие как общественности, так и министров."
 AST_critics_to_shame: "£BoP_right_texticon  Посрамление критиков"
 AST_critics_to_shame_desc: "Авиакатастрофа в Канберре потрясла всю страну, не оставив равнодушным ни одного австралийца. В такие времена всегда находятся те, кто пытается воспользоваться ситуацией. Мы сорвем маски с наиболее активных критиков, чтобы все увидели, что за их риторикой стоит лишь стремление подорвать основы общественного порядка."
 AST_approach_the_independents: "£BoP_left_texticon  Сближение с независимыми членами"
 AST_approach_the_independents_desc: "Положение правительства пошатнулось, поскольку уверенность общества в его способности вывести Австралию из текущего кризиса тает с каждым днем. Сблизившись с независимыми членами парламента, можно попытаться убедить их в том, что перемены в правительстве пойдут всем на пользу."
 AST_a_sound_voice: "£BoP_left_texticon  Уверенный голос"
 AST_a_sound_voice_desc: "Похоже, в условиях политического кризиса лишь один уверенный голос внушает доверие австралийцам. Может быть, это голос будущего лидера [AST.GetNameRuGen]?"
 AST_challenge_government_narrative: "£BoP_left_texticon  Вызов официальной пропаганде"
 AST_challenge_government_narrative_desc: "Сведения, обнародованные правительством об авиакатастрофе в Канберре, выглядят странно, поэтому неизбежно возникают предположения о том, что власти утаили какую-то информацию. Как мог опытный офицер ВВС Австралии разбить самолет в идеальных летных условиях? Общество вправе потребовать от правительства ответа."
 AST_make_a_common_enemy: "Найти общего врага"
 AST_make_a_common_enemy_desc: "После гибели чиновников в авиакатастрофе в Канберре по всей стране раздаются голоса недоверия. Необычные обстоятельства крушения лишь усиливают подозрения о вмешательстве извне. В конце концов, ничто так не объединяет, как общий враг."
 AST_make_a_common_enemy_tt: "§RВозможные эффекты события:§!"
 AST_ensure_cabinet_loyalty: "Обеспечить лояльность кабинета"
 AST_ensure_cabinet_loyalty_desc: "Угроза вынесения вотума недоверия отсутствует, пока большинство членов кабинета министров голосует в поддержку действующего правительства. Мы обеспечим его лояльность."
 AST_castle_crumbling_mission: "Падение Замка"
 AST_castle_crumbling_mission_desc: "После трагедии в Канберре вся Австралия ждет решительных действий от своих лидеров. Сможет ли действующее правительство сохранить доверие после гибели членов кабинета в авиакатастрофе или смена власти станет лучшим выходом из сложившейся ситуации?"
 AST_castle_crumbling_mission_event_tt: "§YЭффекты события:§!"
 AST_castle_crumbling_mission_complete_tt: "Завершить задание §Y«Падение Замка»§!"
 AST_cabinet_trust_complete_1_flag: "Принято решение: §YНайти общего врага§!"
 AST_cabinet_trust_complete_2_flag: "Принято решение: §YОбеспечить лояльность кабинета§!"
 AST_cabinet_trust_complete_not_tt: "Не выбран фокус: §YАвстралия превыше всего§!"
