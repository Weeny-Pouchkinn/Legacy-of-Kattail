 SIA_fortress_saigon: "Сайгонская крепость"
 SIA_fortress_saigon_desc: "На севере нашу новообразованную империю будет защищать Ханой. Эта местность идеально приспособлена для обороны: на севере ее прикрывают горы, спереди — река Хонгха."
 SIA_fortress_hanoi: "Ханойская крепость"
