 INS_revolution_war_HOL_desc: "Мятежники слишком долго испытывают наше терпение. Огромное количество денег и военных ресурсов было потрачено на срыв операций ополчения, но враг всё равно продолжает расширять своё влияние. Тянуть нельзя, тотальная война — наш единственный выход."
