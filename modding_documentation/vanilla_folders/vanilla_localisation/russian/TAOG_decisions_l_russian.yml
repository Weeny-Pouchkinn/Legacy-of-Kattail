 #### AUSTRALIA ####
 ###################
 AST_communism_support_text: "Поддержка коммунистов: [?party_popularity_100@communism|Y]%"
 AST_union_control_1_cat: "Контроль профсоюзов"
 AST_union_control_1_cat_desc: "Члены нашего профсоюза начали искать поддержку среди жителей всей Австралии. Мы можем проникнуть в законодательные органы каждого штата и создать там условия для поддержки коммунистического правительства. Это, конечно, потребует значительных усилий, а также может дестабилизировать страну.\n\nВетераны Новой Гвардии внимательно следят за нашими действиями. Если правительство не примет своевременные меры или ситуация в стране станет слишком нестабильной, этот конфликт может разорвать страну на части.\n\nПоддержка коммунизма: [?party_popularity_100@communism|Y]§Y%§!\n\n§RЕсли стабильность упадёт ниже 40% или восстание ветеранов завершится, начнётся гражданская война.§!"
 AST_union_control_1_cat_name: "Выбрать, где именно следует поднять профсоюзы на свою поддержку"
 AST_union_control_1_map_area_name: "Штаты, на которые ещё можно повлиять"
 AST_nationalizing_cat: "Национализация"
 AST_union_control_2_cat: "Контроль профсоюзов"
 AST_union_control_2_cat_desc: "Рабочие государства [ROOT.GetNonIdeologyName] свергли своих угнетателей не для того, чтобы наблюдать, как имперские державы по всему миру продолжают держать наших товарищей в цепях. Распространение коммунизма за пределы наших границ — не просто идеологическая цель, а стратегическая необходимость. Мы должны раздувать пламя революции за океанами, давая надежду и ресурсы тем, кто хочет сбросить иго империализма, пока старый порядок не останется без опоры."
 AST_union_control_2_foreign_cat: "Подавить коммунизм"
 AST_union_control_tt: "Профсоюзы должны появиться во всех регионах Австралии, однако ветераны Новой гвардии пытаются остановить распространение коммунистических идей."
 AST_seize_local_leadership_in_state_major: "Захватить власть в регионе [FROM.GetName]"
 AST_seize_local_leadership_in_state_mid: "Захватить власть в регионе [FROM.GetName]"
 AST_seize_local_leadership_in_state_low: "Захватить власть в регионе [FROM.GetName]"
 AST_seize_local_leadership_in_queensland: "Захватить власть в Квинсленде"
 AST_union_strike: "Организовать забастовку"
 AST_union_strike_desc: "Наши рабочие покинули свои рабочие места, требуя улучшения условий труда и защиты своих прав. Это, безусловно, окажет давление на правительство и подтолкнет его на проведение новых реформ."
 AST_veterans_revolt: "Восстание ветеранов"
 AST_veterans_revolt_desc: "В армии немало убеждённых противников коммунизма, многие из которых ранее состояли в фашистских организациях. Они настолько ненавидят красные идеи, что готовы взяться за оружие, чтобы не допустить прихода коммунистов к власти.\nЕсли мы будем медлить или позволим стабильности опуститься до критической отметки, они постараются подавить наше революционное движение."
 AST_organize_in_nation: "Внедриться в профсоюзы §Y[FROM.GetNameRuGen]§!"
 AST_organize_in_nation_desc: "Рабочее движение не знает границ. Направляя ресурсы своим товарищам, мы можем внедрять коммунистических активистов в профсоюзы [FROM.GetNameRuGen] и развивать идею революции среди представителей рабочего класса."
 AST_civil_war_in_nation: "Спровоцировать революцию в регионе §Y[FROM.GetName]§!"
 AST_civil_war_in_nation_desc: "Посеянные нами семена готовы взойти. Поддержка коммунистов в [FROM.GetNameRuPrep] настолько выросла, что начать там революцию не составит труда. При наличии средств и агитаторов нам останется только грамотно выбрать момент, чтобы превратить народное недовольство в вооружённое восстание, которое на один шаг приблизит [FROM.GetNameRuAcc] к тем государствам, где власть принадлежит рабочим."
 AST_take_it_to_foreign_streets: "Организовать марш международной солидарности рабочих"
 AST_take_it_to_foreign_streets_desc: "Все рабочие едины. Мы начнём скоординированную международную кампанию, направив австралийских коммунистических агитаторов на улицы каждой страны, где у нас уже есть достаточно влияния, чтобы придать новый импульс местным движениям и раздуть пламя революции."
 AST_take_it_to_foreign_streets_tt: "Продлевает срок действия зарубежного коммунистического влияния на 60 дней во всех странах, куда уже проникли коммунисты."
 AST_raj_locked_tt: "Британская Индия не может стать целью до тех пор, пока Новая Зеландия, Малайя, Бирма, Филиппины и Индонезия не перейдут под власть коммунистов."
 AST_supply_arms_to_nation: "Поставлять оружие §Y[FROM.GetNameRuDat]§!"
 AST_supply_arms_to_nation_desc: "Мы будем снабжать наших товарищей оружием"
 AST_strikes_tt: "Вы сможете выполнить §Y«$AST_workers_educational_association$»§!, §Y«$AST_off_leash$»§!, §Y«$AST_a_national_housing_commission$»§!, §Y«$AST_guaranteed_employment$»§! и §Y«$AST_equal_pay$»§! только во время забастовки."
 AST_nationalization: "Начать национализацию"
 AST_nationalizing_process_tt: "Открывает доступ к решению «§YНачать национализацию§!», применяя дух «§YИдущая национализация§!». Необходимо для выполнения нижеследующих фокусов и убирается после завершения фокуса «§YАвстралия для народа§!». §RВсе невыбранные фокусы станут недоступными!§!"
 AST_nationalization_underway_tt: "§YИдущая национализация§! \nОбъем заводского производства: §R−30%§! \nПроизводительность верфи: §R−30%§!"
 AST_nationalizing_process_ends_tt: "§RВыбор этого фокуса сделает недоступными все вышеуказанные фокусы!§!"
 AST_union_infiltration_in_progress: "Проводится внедрение в заграничный профсоюз"
 AST_cw_operation_in_progress: "Сейчас разжигается революция"
 AST_seize_local_control_tt: "Коммунисты захватили власть в государстве, и оно теперь непременно поддержит нас, если мы ввяжемся в гражданскую войну.\n"
 AST_peace_out_all_wars_tt: "Государство [THIS.GetName] выходит из всех текущих войн."
