 AST_naval_expansion: "$NOR_alt_dem_naval_expansion$"
 AST_naval_expansion_desc: "В обмен на проведение партией [ROOT.GetFascistParty] политики, отвечающей их интересам, ведущие представители деловых кругов согласились вложить средства в реформирование промышленности в соответствии с целями партии.\n\nЧтобы противостоять мощной военно-морской державе, [AST.GetNameRuDat] следует развивать собственный флот. Необходимо временно мобилизовать все верфи и обеспечить быстрое строительство военных кораблей."
 AST_factory_conversions: "Конверсия фабрик"
 AST_factory_conversions_desc: "В обмен на проведение партией [ROOT.GetFascistParty] политики, отвечающей их интересам, ведущие представители деловых кругов согласились вложить средства в реформирование промышленности в соответствии с целями партии.\n\nПри этом приоритет должен быть отдан ВПК, а значит, австралийские заводы и фабрики следует переориентировать на его нужды."
 AST_land_development: "Освоение земель"
 AST_land_development_desc: "В обмен на проведение партией [ROOT.GetFascistParty] политики, отвечающей их интересам, ведущие представители деловых кругов согласились вложить средства в реформирование промышленности в соответствии с целями партии.\n\nЗначительная часть [ROOT.GetNameRuGen] по-прежнему остается неосвоенной и слабо развитой. Освоение этих регионов позволит сделать их пригодными для строительства."
 AST_electrical_grid_expansions: "Расширение энергосетей"
 AST_electrical_grid_expansions_desc: "В обмен на проведение партией [ROOT.GetFascistParty] политики, отвечающей их интересам, ведущие представители деловых кругов согласились вложить средства в реформирование промышленности в соответствии с целями партии.\n\nРасширение нашей энергосети позволит нарастить внутреннюю генерацию электроэнергии и сократить зависимость от импорта."
 AST_factory_investments: "Инвестиции в фабрики"
 AST_factory_investments_desc: "В обмен на проведение партией [ROOT.GetFascistParty] политики, отвечающей их интересам, ведущие представители деловых кругов согласились вложить средства в реформирование промышленности в соответствии с целями партии.\n\nЧтобы обеспечить бесперебойные поставки продукции военного и гражданского назначения в условиях конфликта, нам нужно нарастить промышленный потенциал."
 AST_develop_port_kemla_steel_medium_decision: "Построить вторую доменную печь в Порт-Кембле"
 AST_develop_port_kemla_steel_medium_decision_desc: "Долгое время Порт-Кембла обходился лишь одной доменной печью, однако спрос вырос настолько, что нам стоит подумать о строительстве второй печи. Это позволит примерно вдвое увеличить выпуск стали в регионе."
 AST_prospect_pilbara_iron_decision: "Разрешить разработку недр в регионе Пилбара"
 AST_prospect_pilbara_iron_decision_desc: "Пилбара обладает крупнейшими запасами железной руды в мире. Однако ее добыча в этой чрезвычайно удаленной части страны потребует невероятных вложений. С другой стороны, эта затея сулит столь же невероятные прибыли."
 AST_scale_up_pilbara_mines_steel_decision: "Расширить добычу на рудниках Пилбары"
 AST_scale_up_pilbara_mines_steel_decision_desc: "В связи с открытием Пилбары для широкомасштабной добычи руды настало время привлекать инвестиции!"
 AST_pilbara_mining_tt: "Разрешение на проведение дальнейших геологоразведочных работ в регионе §Y$STATE_870$§! открывает решение по увеличению сталелитейного производства, которое можно повторять без каких-либо ограничений."
 AST_scale_up_middleback_mines_steel_decision_1: "Расширить железный рудник Айрон-Ноб"
 AST_scale_up_middleback_mines_steel_decision_1_desc: "Несмотря на длительную эксплуатацию рудника Айрон-Ноб, рост спроса на железную руду требует наращивания производственных мощностей."
 AST_scale_up_middleback_mines_steel_decision_2: "Открыть железный рудник Айрон-Монарх"
 AST_scale_up_middleback_mines_steel_decision_2_desc: "Мощностей рудника Айрон-Ноб недостаточно для удовлетворения наших потребностей. К счастью, хребет Мидлбэк богат железом. Пора построить рудник, который превзойдет все предыдущие!"
 AST_scale_up_middleback_mines_steel_decision_3: "Открыть железный рудник Айрон-Принс"
 AST_scale_up_middleback_mines_steel_decision_3_desc: "Потребность в металлах в военное время достигла исторического максимума, но запасы хребта Мидлбэк по-прежнему не иссякают."
 AST_expand_iron_mining_tt: "Сочетание фокусов §Y«$AST_exports_for_economic_recovery$»§! и §Y«$AST_within_reach$»§! позволит начать освоение региона Пилбара в §Y$STATE_870$§! и получить доступ к почти неисчерпаемым запасам §Yстали§!. Она может обеспечить развитие нашей экономики."
 AST_develop_port_kemla_steel_tt: "Это позволит нам принять решение о §Yстроительстве второй доменной печи в Порт-Кембле§!, что значительно увеличит наше производство §Yстали§!."
 AST_develop_middleback_tt: "Это откроет три решения о развитии нашего §Yсталелитейного§! производства в регионе §Y$STATE_519$§!"
 AST_expand_planned_extraction_pilbara_tt: "Фокус §Y«$AST_planned_extraction$»§! позволит начать освоение региона Пилбара в §Y$STATE_870$§! и получить доступ к почти неисчерпаемым запасам §Yстали§!. Она может обеспечить развитие нашей экономики."
 AST_ireland_weapon_smuggling_cat: "Поставка оружия ирландцам"
 AST_smuggle_arms_to_ireland: "Контрабандные поставки оружия в Ирландию"
 AST_smuggle_arms_to_ireland_desc: "Мы должны снабдить ирландцев оружием, необходимым для борьбы с британцами."
 AST_smuggle_arms_to_ireland_ongoing_flag: "Контрабандная поставка оружия §Yвыполняется§!"
 AST_smuggle_arms_to_northern_ireland: "Контрабандные поставки оружия в Северную Ирландию"
 AST_smuggle_arms_to_northern_ireland_desc: "Если нам удастся обеспечить Северную Ирландию достаточным количеством оружия и наладить прочные связи между ней и остальной частью острова, мы сможем добиться ее объединения с Ирландией до того, как британцы успеют вмешаться."
 AST_northern_ireland_rises_up: "Восстание в Северной Ирландии"
 AST_specialize_on_jungle_combat: "Специализация на боевых действиях в джунглях"
 AST_specialize_on_desert_combat: "Специализация на боевых действиях в пустыне"
 AST_switch_combat_specialization: "Смена боевой специализации"
 AST_special_forces_cat: "Подготовка войск специального назначения"
 AST_you_can_switch_sf: "Вы сможете переключаться между специализациями."
 AST_training_camps_specialization: "Наши учебные лагеря готовы предоставить войскам специализированную подготовку, повышая их эффективность на различных театрах войны."
 # Formables
 AST_australasia_flag: "§YАвстралазия§! сформирована"
 AST_australia_formables_category: "Австралазия"
 AST_australia_formables_category_desc: "Хотя корни [AST.GetNameRuGen] всегда будут привязывать нас к далёкому югу, мы обрели возможность проецировать силу далеко за пределы нашего континента, и теперь уже никто не сможет игнорировать нашу точку зрения на мировые дела. Мы расширили свои территории, однако это расширение ещё не закончено, и новое название нашей нации ясно даст это понять. Мы вышли из колыбели [AST.GetNameRuGen], расправляя крылья, чтобы мир восхитился нами и признал нас, и мы гордо поднимаем знамя новой южной нации: Австралазии."
 AST_form_australasia: "Сформировать Австралазию"
 AST_form_australasia_malenesia_required_states_tt: "Контролирует все §Yмеланезийские§! территории."
 AST_form_australasia_new_zealand_required_states_tt: "Контролирует все §Y[NZL.GetAdjRuLower]ие§! территории."
 AST_form_australasia_malenesia_core_states_tt: "§YМеланезийские§! территории становятся национальными."
 AST_form_australasia_new_zealand_core_states_tt: "§Y[NZL.GetAdjective]ие§! территории становятся национальными."
