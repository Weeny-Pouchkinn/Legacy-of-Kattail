 SIA_war_fervor_cat: "Военный пыл"
 SIA_war_fervor_cat_desc: "Воинственность населения нужно тщательно контролировать. Если её не сдерживать, народ может направить накопившуюся потребность в войне на саму страну. И тогда её правительству не поздоровится."
 SIA_war_fervor_coup_dummy: "Военный пыл выходит из-под контроля"
 SIA_war_fervor_coup_dummy_desc: "Если накопившаяся у народа потребность в войне не найдет выхода, она будет направлена на нас."
 SIA_urge_restraint: "Призвать к сдержанности"
 SIA_war_fervor_coup: "Надвигающийся переворот"
 SIA_modify_cultural_mandates: "«$idea_SIA_thai_cultural_mandates$» изменяется на:"
 SIA_mandate_1: "Первый наказ"
 SIA_mandate_1_desc: "Страна должна называться Таиландом, а народ и национальность — тайцами."
 SIA_mandate_1_tt: "§Y[THIS.GetName]§! отныне будет называться §Y$SIA_thailand$§!"
 SIA_mandate_2: "Второй наказ"
 SIA_mandate_2_desc: "Тайцам запрещается вести какую-либо деятельность, не учитывая благополучие и безопасность государства.\n\nТайцам запрещается выдавать иностранцам сведения, способные навредить государству. Нарушение будет считаться государственной изменой.\n\nТайцам запрещается выступать в интересах иностранцев или от их имени, не учитывая благополучие тайского народа. Тайцам запрещается выражать мнения иностранцев или занимать их сторону в международных спорах. Нарушение будет считаться государственной изменой.\n\nТайцам запрещается тайно покупать землю от имени иностранцев, причиняя тем самым вред государству. Нарушение будет считаться государственной изменой.\n\nОбязанность каждого тайца — незамедлительно пресекать любые попытки государственной измены."
 SIA_mandate_3: "Третий наказ"
 SIA_mandate_3_desc: "Запрещается называть представителей тайского народа иначе, как тайцами либо в соответствии с их личными предпочтениями.\n\nВсех без исключения полагается называть тайцами, не разделяя на другие группы."
 SIA_mandate_4: "Четвертый наказ"
 SIA_mandate_4_desc: "При виде поднятого или спущенного в соответствии с установленным правительством обычаем государственного флага, либо при звуке горна или свистка, либо при сигнале к подъему или спуску флага следует отдать честь флагу в соответствии с предписанием или обычаем.\n\nВо время исполнения национального гимна, официально либо во время церемонии, участникам следует отдать честь в соответствии с предписанием или обычаем.\n\nНарушителям этого наказа, не выказывающим должного уважения, полагается сделать выговор и напомнить о важности почтительного отношения к национальному флагу и гимну, а также к королевскому гимну."
 SIA_mandate_5: "Пятый наказ"
 SIA_mandate_5_desc: "Тайцам следует стремиться потреблять пищу исключительно тайского производства.\n\nТайцам следует стремиться носить одежду исключительно тайского производства.\n\nТайцам следует поддерживать сельскохозяйственную, коммерческую, промышленную и другую деятельность своих соотечественников.\n\nТайцам следует пользоваться жилищными и коммунальными услугами, предоставляемыми правительством либо соотечественниками, и всячески их поддерживать.\n\nТайцам, занимающимся сельским хозяйством, торговлей, производством и другими занятиями, поддерживаемыми настоящим наказом, следует оказывать достойные и качественные услуги и выполнять свою работу добросовестно."
 SIA_mandate_6: "Шестой наказ"
 SIA_mandate_6_desc: "Композитором национального гимна назначается Пхра Чендуриянг. Ноты будут храниться в отделе изящных искусств.\n\nСлова национального гимна будут написаны представителями вооруженных сил."
 SIA_mandate_7: "Седьмой наказ"
 SIA_mandate_7_desc: "Каждому тайцу следует трудиться на благо и процветание государства. Каждый физически здоровый гражданин обязан иметь постоянную деятельность. Любой таец, не занятый в трудовой деятельности, считается не приносящим пользы государству и недостойным уважения соотечественников."
 SIA_mandate_8: "Восьмой наказ"
 SIA_mandate_8_desc: "Текст королевского гимна будет сокращен, а слово «сиамский» заменено на «тайский»."
 SIA_mandate_9: "Девятый наказ"
 SIA_mandate_9_desc: "Тайцам следует уважать, почитать и восхвалять тайский язык, а также гордиться возможностью на нем разговаривать.\n\nДолг каждого сознательного гражданина Таиланда — изучение государственного языка, умение читать и писать на нем, а также помощь соотечественникам, не умеющим говорить или писать на тайском языке, в его освоении.\n\nТайцам не следует разделять соотечественников в зависимости от места рождения, места проживания или местного акцента. Каждый обязан помнить, что любой человек, рожденный в Таиланде, — носитель общей тайской крови и общего тайского языка безотносительно места рождения или акцента.\n\nДолг каждого тайца — вести себя, как полагается сознательному тайскому гражданину, а также направлять и наставлять тех, кто еще не понял и не осознал свои обязанности перед тайским государством."
 SIA_mandate_10: "Десятый наказ"
 SIA_mandate_10_desc: "Тайцам не следует устраивать массовые собрания, а также появляться в публичных местах и в черте города в ненадлежащем виде. Ненадлежащим видом считается: ношение только нательного белья; отсутствие рубашки; ношение ткани, которая оборачивается вокруг талии.\n\nНадлежащим видом считается: униформа (в зависимости от должности); неоскорбительная одежда международного стиля; неоскорбительная одежда традиционного стиля."
 SIA_mandate_11: "Одиннадцатый наказ"
 SIA_mandate_11_desc: "Тайцам следует делить свой день на три части: первую посвящать работе, вторую — личным делам, третью — отдыху и сну. Этот порядок нужно строго соблюдать, пока он не станет привычным.\n\nПищу следует потреблять в установленное время не чаще четырех раз в день. Спать следует около 6–8 часов.\n\nТайцы должны добросовестно относиться к своим рабочим обязанностям, выполнять их ответственно и не отлынивать. Полуденный отдых и обед должны занимать не более часа. После рабочего дня тайцам следует не менее часа заниматься физическими упражнениями, например спортом, либо другой деятельностью, например садоводством или уходом за животными. После этого следует принять душ и поужинать.\n\nСвободные вечерние часы следует по возможности уделять неотложным делам, беседам с родственниками и друзьями, прослушиванию новостей, чтению, искусству или другим развлечениям."
 SIA_mandate_12: "Двенадцатый наказ"
 SIA_mandate_12_desc: "В общественных местах и на улицах тайцам следует помогать детям, пожилым и инвалидам, а также всячески оберегать их.\n\nВсякий, кто исполняет этот наказ, может считаться благовоспитанным человеком, достойным уважения других тайцев."
 SIA_movie_theater_cat: "$SIA_sala_chaloem_thai_movie_theater$"
 SIA_movie_theater_cat_desc: "Кино — один из самых мощных инструментов современного государства. С помощью тщательно подобранных фильмов и пропагандистских кампаний правительство может формировать общественное мнение, разжигать патриотизм и заглушать голоса несогласных."
