 war_escalation_10_max_tt: "Уровень эскалации менее §Y10§!"
 INS_no_raids_allowed_tt: "§W§RПока активно это решение, налёты будут недоступны.§!§!"
 INS_is_deescalating_tt: "Ещё не выполняет задание по деэскалации"
 INS_escalate_the_conflict: "Развить конфликт"
 INS_escalate_the_conflict_desc: "Мы организуем мятежи и стычки с вражескими войсками, чтобы подогреть напряжённость и усилить эскалацию. Благодаря этому в будущем более серьёзные операции привлекут меньше международного внимания."
 INS_escalate_the_conflict_HOL: "$INS_escalate_the_conflict$"
 INS_escalate_the_conflict_HOL_desc: "$INS_escalate_the_conflict_desc$"
 INS_deescalate_the_conflict: "Попросить о международном посредничестве"
 INS_deescalate_the_conflict_2: "Предложить перемирие"
 INS_deescalate_the_conflict_desc: "Голландцы не станут вести с нами переговоры по доброй воле. Для них мы остаёмся мятежниками, досадной помехой, которую нужно устранить, а не нацией, с которой нужно считаться. Другое дело — великие мировые державы: Гааге от них будет сложно отмахнуться. Мы обратимся к международному сообществу с просьбой о посредничестве, чтобы благодаря давлению других держав добиться того, на что не способен наш собственный голос."
 INS_deescalate_the_conflict_2_desc: "Налёты сделали своё дело. Колониальный гарнизон знает, какие у нас длинные руки, а Гаага знает, что нас не запугать. При этом каждый удар даёт Нидерландам новый повод прислать больше солдат и кораблей, а мы пока не готовы к открытой войне. Наши командиры получат приказ прекратить огонь. Следующий удар будет нанесён тогда, когда мы сочтём нужным, а не когда голландцы заставят нас нанести его."
 INS_renville_tt_HOL: "§W§Y[USA.GetFlag][USA.GetNameDefCap]§! выдвин[NZL.GetNameEndRuPresentEtUt] нам ультиматум. Если мы не сдадимся и не выйдем из Индонезии, эта держава §Rобъявит нам войну§!.§!"
 INS_renville_wont_happen_neutral_tt: "Конфликт завершится до окончания переговоров с США, так что их вмешательство станет невозможным."
 INS_renville_explain_USA_tt: "Если конфликт не разрешится через §Y365 дней§!:\n\n"
 INS_renville_timer_mission_republic: "Ожидаются переговоры на «Ренвиле»"
 INS_renville_timer_mission_HOL: "$INS_renville_timer_mission_republic$"
 INS_national_revolution_peace_negotiation: "Обсудить вывод войск из региона [FROM.GetName]"
 indonesia_reduce_escalation_1_effect_tooltip_for_min_4: "Уровень эскалации понижается на §G1§!, но не ниже §Y4§!."
 INS_ongoing_influence_process: "База ополчения еще не создана"
 INS_current_revolution_strength_3_tt: "В этом регионе сейчас §Gвысокий§! уровень активности ополчения."
 INS_current_revolution_strength_0_tt: "В этом регионе сейчас нет активности ополчения."
 INS_has_spent_points_trigger_tt: "Вы не можете создать дополнительные базы ополчения"
 INS_national_revolution_cat: "Индонезийская национальная революция"
 INS_national_revolution_cat_desc: "После 350 лет голландской тирании мы взяли дело в свои руки и провозгласили независимость. Нидерланды отказываются это признавать и продолжают править Ост-Индией, считая нас преступниками.\n\nМы должны захватывать контроль над новыми регионами и крупными городами, чтобы разрушать голландскую администрацию изнутри. Но при этом нам следует соблюдать осторожность и избегать необдуманной агрессии, поскольку слишком быстрая эскалация может привести к военному вмешательству Нидерландов."
 INS_national_revolution_cat_map: "Организация отвлекающих беспорядков"
 INS_national_revolution_dutch_cat: "Революционное ополчение Ост-Индии"
 INS_national_revolution_dutch_cat_desc: "Революционеры Ост-Индии незаконно провозгласили независимость, а их вооруженное ополчение захватило несколько регионов. Несмотря на все усилия, мы не можем восстановить контроль над этими регионами из-за численного превосходства повстанцев.\n\nМы должны остановить их, пока они не захватили больше городов и не дестабилизировали администрацию Ост-Индии. В самом крайнем случае мы можем прибегнуть к военной силе."
 INS_HOL_revolution_not_going_well_tt: "§RБез Батавии мы не можем управлять Ост-Индией. Нам остается только обсудить условия примирения с революционерами.§!"
 INS_gradual_escalation_republic: "Постепенная эскалация"
 INS_gradual_escalation_HOL: "Постепенная эскалация"
 INS_gradual_escalation_republic_desc: "Голландское возмездие становится всё более суровым с каждым нашим налётом, а их патрули проникают туда, откуда ушли много месяцев назад. Наши командиры сообщают о столкновениях в регионах, которые давно считались усмирёнными, а наши потери растут быстрее, чем вербовщики успевают их восполнять. Конфликт распространился на провинции, где весь прошлый год было тихо."
 INS_gradual_escalation_HOL_desc: "С каждой неделей доклады наших наблюдателей становятся всё более мрачными. Мятежники атакуют в округах, где, как нам казалось, их нет. Военное командование в Батавии настаивает на применении более суровых мер. В Гааге на каждом собрании правительства всё меньше тех, кто призывает к терпению."
 INS_national_revolution_republic_win_ins_tt: "[INS.GetAdjective]ое республиканское ополчение получит §Gфактический контроль§! над регионом, так что конфликт завершится §Gпобедой Республики§!."
 INS_national_revolution_republic_win_hol_tt: "[INS.GetAdjective]ое республиканское ополчение получит §Rфактический контроль§! над регионом, так что конфликт завершится §Rпобедой Республики§!."
 INS_national_revolution_dutch_cat_map: "Посмотреть регионы, захваченные ополчением"
 INS_take_batavia: "Захватить контроль над Явой"
 INS_take_batavia_desc: "Жадные голландцы вкладывали средства почти исключительно в Яву, игнорируя восточные острова. В результате Ява стала ахиллесовой пятой всей колонии. Мы должны вторгнуться на этот остров и разрушить нидерландские сети связи и снабжения — тогда администрация Ост-Индии попросту не сможет продолжать работу."
 INS_hold_batavia_HOL: "Удержать Яву"
 INS_hold_batavia_HOL_desc: "Силы Республики начали операцию по переброске значительной части своих войск на остров Ява, рассчитывая захватить его целиком. Мы должны продолжать сопротивление. Их операция сопряжена с большим риском, и если они потерпят неудачу, мы сможем сокрушить их правительство."
 INS_militias_moestopo_mission: "Мустопо требует повышения за свои усилия"
 INS_militias_pki_uprising_mission: "Восстание коммунистов неизбежно"
 INS_pacific_revolution_cat: "Тихоокеанская революция"
 INS_instigate_in_country: "Спровоцировать революцию в регионе [FROM.GetName]"
 INS_instigate_in_country_desc: "Наша революция не закончилась с изгнанием последнего колониального солдата c [ROOT.GetAdjRuLower]ой земли. Рабочие и крестьяне [FROM.GetNameRuGen] продолжают страдать под тем же гнетом, от которого нам удалось избавиться. Для них мы — живое свидетельство того, что угнетателей можно победить. Мы направим к ним наших агитаторов, займемся распространением листовок, предоставим финансовую поддержку их профсоюзам и разожжем пламя недовольства, пока не созреют условия для революции."
 INS_launch_revolution: "Призвать к революции"
 INS_launch_revolution_desc: "[FROM.GetName] созрел[FROM.GetNameRuEndPast] для революции. Наши агенты фиксируют растущее недовольство на заводах и плантациях, а местные партийные ячейки готовы действовать. Пришло время призвать рабочих и крестьян [FROM.GetNameRuGen] к восстанию, чтобы вернуть то, что принадлежит им по праву."
 INS_anti_colonialist_bonus: "Распространить в регионе [FROM.GetName] антиколониальные настроения"
 INS_anti_colonialist_bonus_desc: "Народ [FROM.GetNameRuGen] трудится на благо чужеземных господ и их интересов. Стоит напомнить им, что подчинение — это выбор, а их господа не так сильны, как им кажется."
 INS_revolutionary_sentiment: "Сотрудничать с [FROM.GetAdjRuLower]ими революционерами"
 INS_revolutionary_sentiment_desc: "В [FROM.GetNameRuPrep] есть силы, которые уже поднялись на борьбу с колониальным режимом. Им не хватает организации и ресурсов, но чего им не занимать, так это решимости. Координация действий с этими группами позволит ускорить крах существующего порядка, даже если это на какое-то время усложнит управление страной."
 INS_arm_militias: "Вооружить местное [FROM.GetAdjRuLower]ое ополчение"
 INS_arm_militias_desc: "Одними пламенными речами и памфлетами революцию не выиграть. В решающий момент наши товарищи в [FROM.GetNameRuPrep] должны быть готовы к восстанию. Необходимо организовать тайные поставки излишков оружия и припасов дружественным формированиям, чтобы на борьбу с реакционными силами поднялось вооруженное население, а не агнцы на заклание."
 INS_arm_militias_tt: "Если начнется гражданская война, коммунисты получат дополнительные дивизии."
 INS_propoganda_mission: "Распространение коммунистических идей в [FROM.GetNameRuPrep]"
 INS_propoganda_mission_desc: "Партийные организаторы будут направлены во все уголки [FROM.GetNameRuGen]. Они должны создавать читательские кружки, привлекать на нашу сторону членов профсоюзов и распространять идеи революции среди жителей деревень. То, что мы посеем сегодня, даст свои всходы уже в ближайшем будущем."
 INS_abandon_mission: "Отказ от миссии"
 INS_abandon_mission_desc: "Наши ресурсы не безграничны, а борьба в [FROM.GetNameRuPrep] требует больше, чем мы сейчас можем себе позволить. Следует отозвать наших агентов и направить усилия туда, где они принесут наибольшую пользу."
 INS_aslia_cat: "Объединение тихоокеанского региона"
 INS_integrate_subject: "Интегрировать регион [FROM.GetName]"
 INS_integrate_subject_in_progress: "Уже интегрирует регион"
 INS_can_raid_here_HOL: "Цель для налёта"
 INS_can_raid_here_HOL_tt: "Эта область является потенциальной целью для наземных налётов со стороны республики. В случае успеха мы утратим контроль над ним. Способы защиты региона:\n$success_modifier_INS_has_influence_mod_counterplay$\n$success_modifier_INS_defense_modifier_counterplay$\n$success_modifier_INS_naval_dominance_modifier_counterplay$\n— Увеличение §Yпревосходства в воздухе§!\n— Уменьшение количества вражеских разведданных\n— Снижение сопротивления в регионе"
 INS_war_escalation_text: "£generic_war_escalation_text_icon Уровень эскалации: §Y[?INS.INS_war_escalation_level]§!"
 INS_war_escalation_level_tt: "§YТекущая эскалация§!\n\nУровень эскалации повышается со временем, а также в результате §Yзахвата новых регионов§! ополчением и мер, принимаемых [HOL.GetNameRuInst] для противодействия ополчению. Если обстановка обострится достаточно сильно, конфликт перерастет в §Rполноценную войну§!."
 INS_war_escalation_1_tt: "§Y[INS.GetName]§!: открывает наземные налеты"
 INS_war_escalation_2_tt: "§Y[INS.GetName]§!: открывается решение предложить перемирие"
 INS_war_escalation_3_tt: "§Y[HOL.GetName]§!: открывает фокус на запрос британского или французского вмешательства"
 INS_war_escalation_4_tt: "§Y[HOL.GetName]§!: открывает решение об объявлении войны (со значительными штрафами из-за международного осуждения)\n§Y[INS.GetName]§!: открывает решение о запросе международного посредничества для деэскалации"
 INS_war_escalation_5_tt: "§Y[INS.GetName]§!: битва в Сурабае"
 INS_war_escalation_6_tt: "Нет эффектов"
 INS_war_escalation_7_tt: "§Y[HOL.GetName]§!: решение об объявлении войны больше не накладывает штрафы\n§Y[INS.GetName]§!: открывает фокус на объявление войны"
 INS_war_escalation_8_tt: "§Y[INS.GetName]§!: открывает фокус на начало кампании внедрения на острове Ява. §RЭто может привести к ранней индонезийской победе.§!\n§Y[INS.GetName]§!: провальное покушение на Сукарно"
