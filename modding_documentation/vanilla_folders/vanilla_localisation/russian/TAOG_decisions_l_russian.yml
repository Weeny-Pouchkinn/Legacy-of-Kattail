 SIA_public_credit_repayment_tt: "Мы немедленно погасим весь наш государственный долг за счет крупного временного штрафа на §Yпотребительские товары§!."
 idea_SIA_deficit_spending: "Дефицит бюджета"
 idea_SIA_deficit_spending_desc: "Правительство тратит больше, чем может себе позволить, вкладывая заёмные средства в ускоренную программу строительства. Благодаря этому мы обеспечим промышленный рост, но по счетам всё равно придётся платить."
 SIA_print_additional_money: "Напечатать еще денег"
 SIA_print_additional_money_tt: "Мы напечатаем еще денег для Японии."
 SIA_appeal_to_industrialists: "Воззвать к промышленникам"
 SIA_implement_industrialists_reforms_countdown: "Провести промышленные реформы"
 SIA_implement_industrialists_reforms_countdown_trigger: "Построить §Y2 гражданские фабрики§! (за исключением фабрик, полученных от фокусов и торговли)"
 SIA_appeal_to_industrialists_tt: "Мы получим поддержку от промышленников.\n\nОни окажут нам помощь в гражданской войне, предоставив дополнительное снаряжение, но в ответ будут ожидать дальнейшего наращивания промышленного потенциала. Нужно будет построить §Y2§! §Yгражданские фабрики§! в дополнение к тем, что будут в нашем распоряжении по завершении гражданской войны, в течение §Y720 дней§! с момента прихода к власти. Фабрики, полученные от фокусов и торговли, не учитываются. \n\nОтказ удовлетворить эти требования приведет к падению §Yстабильности§! и сокращению §Yподдержки войны§!\n\nС началом гражданской войны мы получим:"
 SIA_seek_support_from_constitutional_monarchists: "Обратиться за помощью к конституционным монархистам"
 SIA_implement_constitutionalist_reforms_countdown: "Провести конституционалистские реформы"
 SIA_seek_support_from_constitutional_monarchists_tt: "Мы получим поддержку от конституционных монархистов.\n\nОни окажут нам помощь в гражданской войне, предоставив дополнительные подразделения. Однако в ответ они будут ожидать, что мы сохраним конституционную монархию, выполнив фокус §Y«$SIA_a_constitutional_monarchy$»§! в течение §Y720 дней§! с момента прихода к власти.\n\nОтказ удовлетворить эти требования приведет к падению §Yстабильности§! и сокращению §Yподдержки войны§!"
 SIA_appeal_to_rural_people: "Воззвать к жителям сельских регионов"
 SIA_appeal_to_rural_people_tt: "Мы получим поддержку от жителей сельских регионов.\n\nОни окажут нам помощь в гражданской войне, предоставив ополченцев. Однако в ответ они будут ожидать, что мы примем выгодные политики в области сельского хозяйства, выполнив фокус §Y«$SIA_mechanization_of_agriculture$»§! или §Y«$SIA_reduction_of_agricultural_yield_taxes$»§! в течение §Y720 дней§! с момента прихода к власти.\n\nОтказ удовлетворить эти требования приведет к падению §Yстабильности§! и сокращению §Yподдержки войны§!\n\nС началом гражданской войны мы получим:"
 SIA_implement_rural_reforms_countdown: "Провести сельские реформы"
 SIA_implement_absolutist_reforms_countdown: "Провести абсолютистские реформы"
 SIA_seek_support_from_absolutists_monarchists: "Обратиться за помощью к монархистам-абсолютистам"
 SIA_seek_support_from_absolutists_monarchists_tt: "Мы получим поддержку от монархистов-абсолютистов.\n\nОни окажут нам помощь в гражданской войне, предоставив дополнительные подразделения. Однако в ответ они будут ожидать, что мы сохраним абсолютную монархию, выполнив фокус §Y«$SIA_an_absolute_monarchy$»§! в течение §Y720 дней§! с момента прихода к власти.\n\nОтказ удовлетворить эти требования приведет к падению §Yстабильности§! и сокращению §Yподдержки войны§!"
 SIA_appeal_to_navy_clique: "Воззвать к флотской клике"
 SIA_appeal_to_navy_clique_countdown: "Провести флотские реформы"
 SIA_appeal_to_navy_clique_tt: "Мы получим поддержку от флотской клики.\n\nОни окажут нам помощь в гражданской войне, предоставив весь наш флот и дивизию морской пехоты. Однако в ответ они будут ожидать, что мы примем выгодные морские политики, выполнив фокус §Y«$SIA_thonburi_class_coastal_defense_ship$»§! в течение §Y720 дней§! с момента прихода к власти.\n\nОтказ удовлетворить эти требования приведет к падению §Yстабильности§! и сокращению §Yподдержки войны§!\n\nС началом гражданской войны мы получим следующее.\n§YВесь наш флот§!\nДивизия §YКорпус тайской королевской морской пехоты§!\nТехнология §Y«Морская пехота»§!"
 SIA_appeal_for_support_cat: "Обращение за поддержкой"
 SIA_appeal_for_support_cat_desc: "Ни одно политическое движение не может добиться успеха, действуя в одиночку. Монархисты, конституционалисты, солдаты и гражданские лица — каждый из них оказывает влияние на определённую часть страны. Чтобы в нужный момент выступить вперёд, мы должны заручиться их поддержкой."
 SIA_demand_independence: "Потребовать независимости §Y[FROM.GetNameRuGen]§! от §Y[FROM.OVERLORD.GetNameRuGen]§!"
 SIA_demand_independence_VIN: "Потребовать освобождения §Y[VIN.GetNameRuGen]§!"
 SIA_demand_independence_VIN_tt: "Мы потребуем у контролирующих держав освобождения [VIN.GetNameRuGen]"
 SIA_demand_independence_LAO: "Потребовать освобождения §Y[LAO.GetNameRuGen]§!"
 SIA_demand_independence_LAO_tt: "Мы потребуем у контролирующих держав освобождения [LAO.GetNameRuGen]"
 SIA_demand_independence_CAM: "Потребовать освобождения §Y[CAM.GetNameRuGen]§!"
 SIA_demand_independence_CAM_tt: "Мы потребуем у контролирующих держав освобождения [CAM.GetNameRuGen]"
 SIA_invite_to_adc: "Пригласить §Y[FROM.GetNameRuAcc]§! в наш альянс"
 SIA_asian_democratic_compact_cat: "Азиатский демократический договор"
 SIA_asian_democratic_compact_cat_desc: "Народы Азии имеют право на самоуправление. Мы знаменосцы азиатского самоопределения, поэтому можем оказывать давление на колониальные державы, вынуждая их освобождать подконтрольные государства."
 SIA_khana_ratsadon_cat: "Кхана Ратсадон"
 SIA_khana_ratsadon_cat_desc: "Народная партия, положившая конец абсолютной монархии, не является монолитной. Её военное и гражданское крыло по-разному представляют себе будущее страны, и напряжённость между ними прослеживается в каждом принимаемом решении. Важно привести оба крыла к компромиссу, иначе коалиция рискует развалиться."
 SIA_army_navy_reform_cat: "Армия и флот"
 SIA_army_navy_reform_cat_desc: "Армия и флот конкурируют за одни и те же ограниченные ресурсы. Перераспределение средств между этими двумя родами войск — это постоянный поиск баланса, который влияет на общую боеготовность вооружённых сил."
 SIA_divert_army_funds_to_navy_toggle: "[SIA_GetDivertingArmyFundsToNavyTitle]"
 SIA_divert_army_funds_to_navy_toggle_tt: "[SIA_GetDivertingArmyFundsToNavyTT]"
 SIA_divert_army_funds_to_navy_toggle_do: "Перенаправить средства для армии флоту"
 SIA_divert_army_funds_to_navy_toggle_do_tt: "Мы перенаправим флоту часть средств, выделенных для армии, чтобы ускорить темпы его развития."
 SIA_divert_army_funds_to_navy_toggle_undo: "Прекратить перенаправление средств для армии флоту"
 SIA_divert_army_funds_to_navy_toggle_undo_tt: "Мы больше не будем перенаправлять флоту часть средств, выделенных для армии."
 SIA_standing_our_ground_mission: "Держать позиции"
 SIA_standing_our_ground_mission_tt: "Мы должны бороться за нашу свободу."
 SIA_sway_generals_to_seri_thai_tt: "С началом гражданской войны переманенные нами на сторону «Свободного Таиланда» генералы присоединятся к нам, а не к восставшим лоялистам."
 SIA_sway_general_cw_scale_tt: "Наша поддержка в гражданской войне повысится на §Y5%§!\nЕсли поддержка выше §Y80%§!, мы сумеем избежать гражданской войны и захватить власть без сопротивления"
 SIA_sway_luang_chawengsaksongkhram_to_seri_thai: "Привлечь Луанга Чавенгсаксонгкрама"
 SIA_sway_luang_chawengsaksongkhram_to_seri_thai_desc: "Переманить Луанга Чавенгсаксонгкрама на сторону «Свободного Таиланда». Если мы преуспеем, с началом гражданской войны он встанет на нашу сторону."
 SIA_sway_aditya_dibabha_to_seri_thai: "Привлечь Адитью Дибабху"
 SIA_sway_aditya_dibabha_to_seri_thai_desc: "Переманить Адитью Дибабху на сторону «Свободного Таиланда». Если мы преуспеем, с началом гражданской войны он встанет на нашу сторону."
 SIA_sway_mangkorn_phromyothi_to_seri_thai: "Привлечь Мангкорна Пхромиотхи"
 SIA_sway_mangkorn_phromyothi_to_seri_thai_desc: "Переманить Мангкорна Пхромиотхи на сторону «Свободного Таиланда». Если нам удастся его убедить, с началом гражданской войны он встанет на нашу сторону."
 SIA_sway_luang_haansongkhram_to_seri_thai: "Привлечь Луанга Хаансонгкрама"
 SIA_sway_luang_haansongkhram_to_seri_thai_desc: "Переманить Луанга Хаансонгкрама на сторону «Свободного Таиланда». Если нам удастся его убедить, с началом гражданской войны он встанет на нашу сторону."
 SIA_sway_charun_rattanakun_seriroengrit_to_seri_thai: "Привлечь Чаруна Раттанакуна Сериренгрита"
 SIA_sway_charun_rattanakun_seriroengrit_to_seri_thai_desc: "Переманить Чаруна Раттанакуна Сериренгрита на сторону «Свободного Таиланда». Если нам удастся его убедить, с началом гражданской войны он встанет на нашу сторону."
 SIA_sway_phichit_kriangsakphichit_to_seri_thai: "Привлечь Пхичита Криангсакпхичита"
 SIA_sway_phichit_kriangsakphichit_to_seri_thai_desc: "Переманить Пхичита Криангсакпхичита на сторону «Свободного Таиланда». Если нам удастся его убедить, с началом гражданской войны он встанет на нашу сторону."
 SIA_sway_jira_wichitsongkhram_to_seri_thai: "Привлечь Джиру Вичитсонгкрама"
 SIA_sway_jira_wichitsongkhram_to_seri_thai_desc: "Переманить Джиру Вичитсонгкрама на сторону «Свободного Таиланда». Если нам удастся его убедить, с началом гражданской войны он встанет на нашу сторону."
 SIA_sway_phin_choonhavan_to_seri_thai: "Привлечь Пина Чунхавана"
 SIA_sway_phin_choonhavan_to_seri_thai_desc: "Переманить Пина Чунхавана на сторону «Свободного Таиланда». Если нам удастся его убедить, с началом гражданской войны он встанет на нашу сторону."
 SIA_sway_tiang_sirikhan_to_seri_thai: "Привлечь Тианга Сирикана"
 SIA_sway_tiang_sirikhan_to_seri_thai_desc: "Переманить Тианга Сирикана на сторону «Свободного Таиланда». Если нам удастся его убедить, с началом гражданской войны он встанет на нашу сторону."
 SIA_khana_ratsadon_dummy_military: "Риск военного переворота"
 SIA_khana_ratsadon_dummy_military_tt: "Военные могут организовать переворот, если мы чрезмерно ухудшим отношения с ними. Во избежание гражданской войны не стоит слишком долго сохранять активной идею «§Y$idea_SIA_military_rebellious$§!»."
 SIA_khana_ratsadon_dummy_military_desc: "Военные представляют собой влиятельную фракцию в рядах Народной партии. Они не поддержат политику, которую сочтут ущемляющей их интересы, однако одобрят меры, способствующие милитаризации страны."
 SIA_khana_ratsadon_military_coup_mission: "Военные планируют свержение правительства!"
 SIA_khana_ratsadon_military_coup_mission_desc: "Военные считают текущий политический курс правительства угрозой своим интересам и активно вынашивают планы по его смещению, если их влияние не будет увеличено."
 SIA_khana_ratsadon_dummy_civilian: "Риск переворота со стороны гражданского крыла"
 SIA_khana_ratsadon_dummy_civilian_tt: "Гражданское крыло может организовать переворот, если мы чрезмерно ухудшим отношения с ним. Во избежание гражданской войны не стоит слишком долго сохранять активной идею «§Y$idea_SIA_civilian_rebellious$§!»."
 SIA_khana_ratsadon_dummy_civilian_desc: "Гражданское крыло представляет собой влиятельную фракцию в рядах Народной партии. Они не поддержат политику, которую сочтут ущемляющей их интересы, однако одобрят меры, способствующие укреплению демократии и гражданских институтов."
 SIA_khana_ratsadon_civilian_coup_mission: "Гражданское крыло планирует свержение правительства!"
 SIA_khana_ratsadon_civilian_coup_mission_desc: "Гражданское крыло считает текущий политический курс правительства угрозой своим интересам и активно вынашивает планы по его смещению, если его влияние не будет увеличено."
 SIA_promote_civilian_wing: "Искать расположения гражданских"
 SIA_promote_civilian_wing_desc: "Если мы направим все силы правительства на решение таких вопросов гражданского крыла, как земельная реформа, проблемы судов и конституции, мы заслужим благодарность фракции Приди. Однако такой фаворитизм не останется незамеченным: офицерский корпус оскорбится, а сбои в повседневном управлении будут дорого нам обходиться, пока недовольство не уляжется."
 SIA_promote_military_wing: "Искать расположения военных"
 SIA_promote_military_wing_desc: "Если мы уступим требованиям офицерства и начнём восхвалять мощь вооружённых сил, мы можем завоевать расположение фракции Пибуна. Однако такой фаворитизм не останется незамеченным: смена курса нарушит привычный уклад в армии, а сбои в повседневном управлении будут дорого нам обходиться, пока недовольство не уляжется. Это грубое решение, пригодное лишь для того, чтобы удержать крыло от скатывания к бунту."
 SIA_cultivate_civilian_wing: "Развивать гражданское крыло"
 SIA_cultivate_civilian_wing_desc: "Директива Бюро королевского дворца, обеспечившая нам признание со стороны истеблишмента, даёт возможность терпеливого и постепенного сближения с гражданским крылом. Никакого резкого фаворитизма, способного вызвать возмущение, — только медленная, упорная работа по завоеванию расположения фракции Приди, уступка за уступкой. Это долгий путь, но мы можем идти по нему так далеко, как пожелаем."
 SIA_cultivate_military_wing: "Развивать военное крыло"
 SIA_cultivate_military_wing_desc: "Директива Бюро королевского дворца, обеспечившая нам признание со стороны истеблишмента, даёт возможность терпеливого и постепенного сближения с военным крылом. Никакого фаворитизма, способного вызвать протесты, — только медленная, упорная работа по завоеванию расположения офицерского корпуса, уступка за уступкой. Это долгий путь, но мы можем идти по нему так далеко, как пожелаем."
 SIA_end_factionalism_mission: "Сохранение коалиции"
 SIA_end_factionalism_mission_desc: "Оба крыла Народной партии теперь на стороне правительства. Если мы сумеем сохранить их §Gполную поддержку§! в течение §Y270§! дней, с трениями между ними будет покончено. Но если энтузиазм одного крыла пошатнётся, работу по сближению придётся начинать заново."
