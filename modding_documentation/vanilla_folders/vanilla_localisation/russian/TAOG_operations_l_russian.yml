l_russian:
 operation_rescue_general: "Спасение захваченного командира"
 operation_rescue_general_desc: "§LОдин из наших командиров попал во вражеский плен. Мы должны организовать операцию по его освобождению.§!"
 free_general_free_in_transit: "Перехват во время перевозки"
 free_general_free_in_transit_desc: "Наши агенты узнали о скорой перевозке некого важного лица — вне всяких сомнений, это наш пленный генерал. Они устроят засаду и попытаются перехватить транспорт, чтобы его освободить."
 free_general_assault_holding_area: "Штурм места содержания"
 free_general_assault_holding_area_desc: "Разведка выяснила, где именно держат нашего пленного командира. Наши агенты разработают план штурма здания и попытаются вызволить его силой."
 free_general_disguise_and_extract: "Скрытная эвакуация"
 free_general_disguise_and_extract_desc: "Используя лучшие наработки наших спецслужб, агенты помогут пленному командиру замаскироваться, незаметно пройти мимо охраны и добраться до зоны эвакуации."
