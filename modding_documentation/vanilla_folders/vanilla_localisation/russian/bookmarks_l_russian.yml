 NZL_BLITZKRIEG_DESC: "Эта крохотная нация из южной части Тихого океана храбро сражалась в Великой войне. Ее армия понесла тяжелые потери в кровавых битвах за Галлиполи и на Западном фронте. Почти половина всех мужчин призывного возраста воевала за рубежом, и многие из них не вернулись домой.\n\nЧерез двадцать лет после окончания Великой войны граждане Новой Зеландии с тревогой наблюдают за мировыми событиями, ведь на сей раз угроза значительно ближе к их берегам..."
 RAJ_BLITZKRIEG_DESC: "Гордость британской короны, Индия — странное сочетание имперской власти и имперской беспомощности. Элитная горстка британцев управляет огромным субконтинентом, где проживают сотни миллионов граждан. Они составляют основу индийской армии, которая храбро сражалась в Великой войне.\n\nИндийцы надеялись, что понесенные в войне потери помогут стране добиться независимости от Великобритании, но эти мечты не сбылись. Теперь назревает новый конфликт, и многие считают, что пришла пора обрести свободу — любой ценой."
 CZE_GATHERING_STORM_DESC: "Во время Первой мировой войны чешские солдаты сражались на стороне Антанты в самых разных уголках Европы ради признания суверенитета их нации. Эти усилия увенчались успехом, и на руинах Австро-Венгерской империи возникла Чехословакия. \n\nВорвавшись на мировую арену, Чехословакия образовала с Югославией и Румынией союз «Малая Антанта», дабы помешать Венгрии восстановить Австро-Венгерскую империю, хотя растущая мощь Германии быстро меняет расстановку политических сил в Европе."
 HUN_GATHERING_STORM_DESC: "Государства Антанты, одержавшие победу в Первой мировой войне, рассматривали Венгрию как поверженного противника, поскольку та составляла половину бывшей Австро-Венгерской империи. По условиям Трианонского мирного договора страна потеряла почти две трети своей территории. Миллионы этнических венгров оказались за пределами родины, а экономика была разрушена. Были введены жесткие ограничения на численность и состав армии, чтобы Венгрия не смогла вновь угрожать миру в Европе. \n\nНо политический климат Европы меняется. Пришло время исправить ошибки прошлого и вернуть нации былое величие."
 ROM_GATHERING_STORM_DESC: "Румыния оказалась на стороне победителей в Первой мировой войне, благодаря чему расширила свою территорию и приняла новых граждан, далеко не все из которых были румынами. Чтобы защититься от реваншистских устремлений стран, лишившихся своих земель, Румыния создала на Балканах разветвленную сеть союзов. Однако, в последние годы правительство короля Кароля II решало в основном внутренние проблемы страны, и эти союзы постепенно тратили силу. \n\nИзменение политической ситуации в Европе может привести к тому, что Румыния окажется в одиночестве и без защиты."
 HUN_BLITZKRIEG_DESC: "Государства Антанты, одержавшие победу в Первой мировой войне, рассматривали Венгрию как поверженного противника, поскольку та составляла половину бывшей Австро-Венгерской империи. По условиям Трианонского мирного договора страна потеряла почти две трети своей территории. Миллионы этнических венгров оказались за пределами родины, а экономика была разрушена. Были введены жесткие ограничения на численность и состав армии, чтобы Венгрия не смогла вновь угрожать миру в Европе. \n\nНо политический климат Европы меняется. Пришло время исправить ошибки прошлого и вернуть нации былое величие."
 ROM_BLITZKRIEG_DESC: "Румыния оказалась на стороне победителей в Первой мировой войне, благодаря чему расширила свою территорию и приняла новых граждан, далеко не все из которых были румынами. Чтобы защититься от реваншистских устремлений стран, лишившихся своих земель, Румыния создала на Балканах разветвленную сеть союзов. Однако, в последние годы правительство короля Кароля II решало в основном внутренние проблемы страны, и эти союзы постепенно тратили силу. \n\nИзменение политической ситуации в Европе может привести к тому, что Румыния окажется в одиночестве и без защиты."
 YUG_GATHERING_STORM_DESC: "Югославия появилась на карте мира в 1922 году, когда новое Королевство сербов, хорватов и словенцев объединилось с прежде независимым Королевством Сербия. Поначалу Югославия, стараясь обеспечить свой суверенитет, состояла и в Малой Антанте, и в Балканском пакте, но убийство короля Александра, усиление позиций националистов в стране и давление со стороны Италии и Германии привели к резкому пересмотру политики и стратегии государства."
 YUG_BLITZKRIEG_DESC: "Югославия появилась на карте мира в 1922 году, когда новое Королевство сербов, хорватов и словенцев объединилось с прежде независимым Королевством Сербия. Поначалу Югославия, стараясь обеспечить свой суверенитет, состояла и в Малой Антанте, и в Балканской Антанте, но усиление позиций националистов в стране и давление со стороны Италии и Германии привели к резкому пересмотру политики и стратегии государства."
 CHI_GATHERING_STORM_DESC: "После революции и свержения последнего императора династии Цин молодая Китайская республика ведет отчаянную борьбу за выживание. Значительная часть провинций во власти бандформирований. В самом сердце страны прочно обосновались коммунисты. По другую сторону границы Япония создала марионеточное правительство под управлением последнего китайского императора, рассчитывая снова объединить страну под его началом.\n\nС таким количеством внешних и внутренних врагов правительству Чан Кайши придется принимать непростые решения, чтобы выстоять и сохранить власть в Китае."
 PRC_GATHERING_STORM_DESC: "Всего два года назад коммунистической партии Китая грозило полное уничтожение. Чтобы уцелеть, коммунисты пошли на легендарное отступление, известное в наши дни как «Великий поход». Поход пережила лишь малая доля войск, промышленность практически отсутствует – шансы на победу в гражданской войне у коммунистов невелики.\n\nВозможно, со временем удастся повысить популярность коммунизма среди населения, создать новые армии и новые базы. Тогда, выбрав удачный момент, можно будет снова вступить в борьбу – на этот раз до победного конца."
 CHI_BLITZKRIEG_DESC: "Два года войны против Японии заметно ослабили армию Чан Кайши. В итоге врагу удалось оккупировать самые богатые территории. Помощи от демократических режимов Запада практически не поступает; коммунисты также не горят желанием вступать в открытую борьбу с оккупантом.\n\nВсе указывает на то, что дальше ситуация будет только ухудшаться. Остается надеяться, что колоссальные масштабы страны и медленное продвижение заставят японцев задуматься о других направлениях экспансии, либо на подмогу придут новые союзники..."
 PRC_BLITZKRIEG_DESC: "Перед лицом полномасштабного наступления японцев коммунистам и националистам пришлось нехотя заключить перемирие. Всем при этом было очевидно, что единый фронт долго не продержится. Новым рубежом в войне с японцами теперь стали позиции коммунистов в округе Яньань.\n\nЧтобы уцелеть, коммунисты должны крайне расчетливо распоряжаться имеющимися ресурсами: потери, понесенные в битвах с японцами, окажутся вдвойне ощутимыми, когда дело дойдет до междоусобной войны против националистов. Возможно, именно на это и рассчитывает правительство Чан Кайши..."
 MAN_GATHERING_STORM_DESC: "Пуи, последний император Китая, лишился престола, когда ему было всего 3 года. Много лет он ждал подходящего момента. Когда в его бывшей империи вспыхнула гражданская война, Пуи обрел новых союзников в Японии.\n\nОсновав империю Маньчжоу-го в 1932 году, Пуи сделал первый шаг к возвращению на унаследованный им трон. Сейчас его власть поддерживает японская армия, но со временем ему, возможно, удастся сбросить оковы зависимости и исполнить роль, предначертанную ему по родству..."
 MAN_BLITZKRIEG_DESC: "Пуи, последний император Китая, лишился престола, когда ему было всего 3 года. Много лет он ждал подходящего момента. Когда в его бывшей империи вспыхнула гражданская война, Пуи обрел новых союзников в Японии.\n\nОсновав империю Маньчжоу-го в 1932 году, Пуи сделал первый шаг к возвращению на унаследованный им трон. Сейчас его власть поддерживает японская армия, но со временем ему, возможно, удастся сбросить оковы зависимости и исполнить роль, предначертанную ему по родству..."
 MAN_TSR_GATHERING_STORM_DESC: "Маньчжурская империя основана на шатком фундаменте. Она была создана в 1932 году японцами, которые решили таким образом установить контроль над Маньчжурией. Императором же этого нового государства они назначили Пуи.\n\nВопрос заключается лишь в том, продолжит ли он оставаться в тени, пока страной управляют Общество Согласия и японская армия, или попытается всё же захватить власть, которую затем, возможно, у него отнимут местные бандиты."
 MAN_TSR_BLITZKRIEG_DESC: "Маньчжоу-го, государство, некогда отколотое японской армией от Северного Китая, желая сохранить остатки легитимности, выдвинуло Пуи в качестве императора и теперь стало полноправным членом Великой восточноазиатской сферы совместного процветания. Время покажет, останется ли государство в руках Общества Согласия или же перейдет под полный контроль Пуи."
 WARLORDS_GATHERING_STORM_DESC: "Слабость центрального правительства открывает возможности для амбициозных людей, стремящихся к власти. На окраинах страны местные правители создали личные государства и не спешат выполнять указы центра. \n\nБлизится война, и каждый из этих царьков стоит перед непростым выбором. Что лучше: сотрудничество с центральным правительством или альянс с коммунистами? В любом из этих вариантов им наверняка достанется кусок пирога, но есть и третий путь - захватить весь Китай единолично."
 WARLORDS_BLITZKRIEG_DESC: "Война с Японией заставила китайских милитаристов выбрать одну из сторон конфликта. Но нет и капли сомнений в том, что этот альянс обречен на распад. Наступит день, когда он изживет себя, и тогда каждый, кому не занимать амбиций и беспощадности, вновь вступит в гонку за титул нового владыки Китая."
 MEXICO_GATHERING_STORM_DESC: "После свержения диктатора Порфирио Диаса Мексика на два десятилетия погрузилась в гражданские войны. Сторонники центральной власти сражались с регионалистами, крестьяне и социалисты совершали набеги на асьенды землевладельцев, а по всей Мексике шли сражения за доминирующую роль государства или религии.\n\nСветское правительство утверждает, что выиграло войну, но его власть покоится на очень шатком основании. Возможно, после восстановления Мексики на сцену выйдет другой победитель."
 MEXICO_BLITZKRIEG_DESC: "Правительство Ласаро Карденаса показало себя более активной движущей силой положительных социальных перемен, чем правительство его предшественника президента Плутарко Кальеса, сбежавшего в США. Теперь, когда экономическая ситуация стабилизировалась, а иностранные нефтяные компании находятся под контролем государства, мексиканские власти могут уверенно смотреть в будущее. США противостоит врагам на многих фронтах и скорее всего простит национализацию «Стандард Ойл», но с этими врагами гораздо выгоднее подружиться..."
 NETHERLANDS_GATHERING_STORM_DESC: "Правительство Нидерландов с опаской следит за мировым кризисом. Шаткая экономика, пацифистские настроения в стране и стремление соблюдать нейтралитет не позволяют голландцам как следует подготовиться к обороне.\n\nВместе с тем, своим стратегически важным расположением в Европе страна обращает на себя внимание как Германии, так и Великобритании: обе стороны добиваются от Нидерландов «содействия» в разворачивающемся конфликте, и обе стороны готовы счесть отказ поводом для войны. Возможно, единственный способ сопротивляться вторжению — отвести все силы в колонии..."
 NETHERLANDS_BLITZKRIEG_DESC: "Война между Германией и остальными европейскими державами, кажется, неизбежна. Нидерланды надеются сохранить нейтралитет, однако правительство страны уже готовит секретные планы на случай грядущей войны.\n\nПроводится мобилизация, ведётся укрепление оборонительных рубежей — Нидерланды готовятся защищаться от посягательств на свой суверенитет. А если оборона падёт, то всегда остаются далёкие колонии..."
 SPAIN_GATHERING_STORM_DESC: "За первые пять лет своего существования молодая Вторая Испанская республика перенесла стачки, попытку военного переворота и крупное революционное восстание. Она пережила все эти испытания, но испанское общество по-прежнему страдает от политической поляризации и взаимного насилия между анархистами, коммунистами и фалангистами.\n\nОбе стороны с надеждой ждут приближающихся выборов в 1936 году, но маловероятно, что победа кого-либо из них вернёт стране стабильность. А пока насилие не прекращается, военные выжидают и строят собственные планы..."
 SPAIN_BLITZKRIEG_DESC: "Гражданская война, последние три года опустошавшая страну, наконец-то закончилась. Теперь под руководством Франко победители должны ускорить восстановление Испании, добить оставшиеся очаги сопротивления и устранить раскол, порождённый войной.\n\nНо медлить нельзя — весь мир неумолимо движется к новой войне, которая обещает быть куда масштабней и кровавей предыдущей. Если Испания хочет выдержать эту войну, да ещё и пожать её плоды, стране надо срочно готовить к битвам индустрию и армию."
 PORTUGAL_GATHERING_STORM_DESC: "Нестабильный период Первой республики в Португалии закончился после прихода к власти Салазара в 1932 году. Его видение нового португальского государства, финансово автономного и политически независимого от основных держав, привело к созданию так называемого Estado Novo, Нового государства, заложившего основы развития португальской промышленности и модернизации армии. \n\nСейчас Португалия должна выбрать свой курс, ведь в соседней с ней Испании растет политическая и социальная нестабильность, и международные отношения становятся все напряженнее..."
 PORTUGAL_BLITZKRIEG_DESC: "Консервативное правительство Салазара позволило Португалии сохранить нейтралитет в испанской гражданской войне, активно поддерживая при этом националистов, что привело к поражению коммунистов и анархистов. \n\nТеперь, когда Пиренейский полуостров наконец-то обрел стабильность, пора искать потенциальных союзников за границей и подумать о той роли, которую сыграет Португалия в неизбежном, судя по всему, мировом конфликте."
 LIT_GATHERING_STORM_DESC: "Пока Польша по-прежнему стремится связать Литву новым союзом, Советы не желают признавать право Литвы на самоопределение, а в Мемельском регионе растет нацистская угроза, ветеран войны за независимость вышел вперед, чтобы сохранить стабильность и независимость литовской нации. Антанас Сметона располагает ограниченными ресурсами и возглавляет шаткий режим, пока в селах рыщут бойцы фашистской организации «Железный волк», разъяренные арестом своего командира Аугустинаса Вольдемараса. Близится война, и Литва должна любой ценой защищать свой народ."
 LIT_BLITZKRIEG_DESC: "Все подготовлено. Антанас Сметона укрепился в роли диктатора, и мечтам о восстановлении Литовской Республики теперь не суждено сбыться. С Советами заключено соглашение, по которому после раздела Польши Вильнюс будет возвращен Литве, но может ли Сметона верить, что Сталин и его кровожадная военная машина будут чтить суверенитет Литвы вечно?"
 LAT_GATHERING_STORM_DESC: "После Майского переворота прошло два года, а Латвия до сих пор остается в неопределенном положении. Карлис Улманис, некогда бывший премьер-министром Латвии, теперь ведет себя как диктатор, и сторонники демократии упорно противостоят его нападкам на латвийскую свободу. Фашистская организация «Перконкрустс» взволнована из-за ареста своего лидера Густавса Целминьша, и, если диктатура не устранит эту угрозу в ближайшее время, в Латвии может начаться гражданская война.\n\nЛатвии грозят и с востока, и с запада; страна балансирует на тонкой грани между победой и забвением."
 LAT_BLITZKRIEG_DESC: "Чрезмерная зависимость Латвии от советской торговли наконец-то обернулась против диктатора. Советский Союз и немецкий рейх показали зубы и вплотную подступают к Улманису. Для сохранения латвийской независимости необходима быстрая мобилизация — если только диктатор не предпочтет молить о милости Советы..."
 EST_GATHERING_STORM_DESC: "С востока Эстонии грозят коммунисты, с юга — фашисты, поэтому Константин Пятс и Патриотическая лига захватили полный контроль над страной, чтобы защитить ее будущее. Группа ветеранов Эстонской освободительной войны организовала движение т. н. вапсов, правых популистов, желающих отобрать власть над Эстонией у центристов.\n\nБудущее страны остается неопределенным. Сможет ли Пятс сохранить мир и начать «эпоху молчания» или же вапсы захватят власть и создадут новое эстонское государство?"
 EST_BLITZKRIEG_DESC: "Эстония оказалась между морем и красной угрозой с востока, и прошлые союзники не собираются помогать стране. Капитуляция кажется неизбежной, но эстонская нация еще может выжить — либо как рабы СССР, либо как силы сопротивления, засевшие в лесах."
 BUL_GATHERING_STORM_DESC: "Со времен освободительной войны 1878 года и отказа западных демократий признать итоги Сан-Стефанского мирного договора Болгария пережила долгую историю конфликтов и предательства на Балканах. Потерпев поражение в Великой войне в составе центральных держав, Болгария лишилась значительных территорий, а по условиям Нейиского договора на страну были наложены жёсткие экономические санкции и ограничения на армию. \n\nНо в условиях глобальных политических и социальных изменений в Европе Болгарии пора выбрать собственный путь и найти своё место на Балканах."
 BUL_BLITZKRIEG_DESC: "На протяжении последних лет царь Борис укреплял свою власть: распустил плетущую заговоры организацию «Звено» и переориентировал болгарскую внешнюю политику на союз с Германией. После недавних переговоров с соседними балканскими странами Британия сняла военные ограничения, наложенные на страну после Великой войны, в надежде отвратить Болгарию от союза с державами Оси. \nТеперь царь ищет способ вернуть ранее утраченные земли, не втягивая страну в конфликт, но с учётом растущей международной напряжённости в Европе будущее Болгарии остается туманным..."
 GRE_GATHERING_STORM_DESC: "Греция переживает кризис. В 1935 году в ожесточённой грызне роялистов и республиканцев за душу нации пала Вторая греческая республика. Король, чужак-автократ, остаётся крайне противоречивой фигурой с неясной судьбой. \n\nЗлобные реваншисты-болгары погрязли в собственных междоусобных дрязгах и тихо догнивают на севере, а на востоке турки, давние враги и внезапные союзники Греции, переживают политические метаморфозы. И это ещё не говоря о чудовище, что ворочается по ту сторону Адриатики..."
 GRE_BLITZKRIEG_DESC: "Сильной рукой диктатор Иоаннис Метаксас вернул Греции стабильность. Благодаря Четырёхлетнему плану промышленность страны невероятно разрослась за последние годы, а государственный долг, хотя всё ещё огромный, уже не кажется таким уж неподъёмным. \n\nК несчастью, даже сильное правительство и грамотная экономическая политика не могут спасти нацию от беды. На горизонте маячит угроза великой и ужасающей войны, и хотя Метаксас уверенно заявляет, что Греция должна сохранять нейтралитет в любом грядущем конфликте, возможно, последнее слово будет вовсе не за ним..."
 TUR_GATHERING_STORM_DESC: "На пепелище Османской империи родилась Турецкая республика. За независимость Турция заплатила кровью и пулями во время Национальной кампании 1923 года, и, хотя она сражалась за правое дело, потери по сей день лежат на сердцах турецкого народа тяжким грузом. \n\nВ дальних регионах сеют религиозную заразу консерваторы, изо всех сил отрицающие масштабную модернизацию, а курдские националисты сеют смуту на востоке страны. Хвалёный президент Мустафа Кемаль Ататюрк должен объединить страну или передать факел лидеру, который действительно сможет это сделать, да поскорее — в Европе назревает большая беда."
 TUR_BLITZKRIEG_DESC: "Отец Турков Мустафа Кемаль Ататюрк отошёл в мир иной. Во главе охваченной трауром Турции встал уважаемый государственный муж Исмет Иненю. В наследство ему досталась расколотая страна, раздробленность которой стала особенно заметна после смерти её светоча. \n\nПомимо внутренних конфликтов, Иненю столкнулся с угрозой войны в Европе, которая по разрушительности может превзойти даже Великую войну. Ататюрк часто бормотал свою мантру: «Мир в родной стране — мир во всём мире». Сумеет ли Иненю сохранить мир в эти трудные времена?"
 ETH_GATHERING_STORM_DESC: "У Эфиопии многовековая история и императорская династия ей под стать. Хайле Селассие сделал многое для модернизации империи, но процесс был прерван, поскольку Италия нападала на Эфиопию второй раз за 40 лет. Ситуация безрадостна, но если империя соберется с силами, она сможет остановить захватчиков еще раз.\n\nЧтобы Эфиопия осталась свободной, надо освободить от европейского ига всю Восточную Африку — раз и навсегда."
 AFA_GATHERING_STORM_DESC: "Народ афар вот уже много веков населяет огромную пустыню Данакиль, которая протянулась от Джибути на востоке до Эфиопии на западе. За последние годы влияние Италии в регионе заметно усилилось, и Мухаммад Яййо всё больше поддерживает Бенито Муссолини в ущерб Хайле Селассие.\n\nС началом Второй итало-эфиопской войны народ афар оказался на перепутье. Готов ли он связать своё будущее с Италией — или предпочтёт сохранить независимость?"
 FIN_GATHERING_STORM_DESC: "Финляндия — молодая страна, получившая независимость от России в 1917 году после кровавой гражданской войны. Шрамы от той войны до сих пор свежи, а коалиционное правительство до сих пор не научилось работать эффективно. Советский Союз стремится овладеть финскими территориями близ Ленинграда, а Финляндия плохо готова к потенциальному конфликту, но тем не менее имеет долгую историю военных подвигов и доблести, а ее солдаты безоговорочно преданы стране.\n\nСейчас, когда повсюду растет напряжение и назревает глобальный конфликт, будущее Финляндии находится в очень шатком равновесии."
 FIN_BLITZKRIEG_DESC: "Финляндия оказалась между Советским Союзом и нацистской Германией — двумя потенциальными сторонами большого конфликта. Проведены переговоры с Советским Союзом, и правительству теперь предстоит принять непростое решение о защите суверенитета страны.\n\nФинская оборона была укреплена, но армия до сих пор слабо экипирована, а авиация и флот практически отсутствуют у государства. Несмотря на это, сильная национальная гордость и военная доблесть дают Финляндии несгибаемую решимость защищать свою независимость."
 SWE_GATHERING_STORM_DESC: "Хоть и сохранив нейтралитет в Великой войне, Швеция претерпела немало трудностей из-за британских попыток блокады Германии. Пока на континенте растет напряжение, шведский народ беспокоится, что ему снова придется страдать из-за дел великих держав.\n\nСоциал-демократы тем временем пытаются найти баланс между созданием социального государства, способного поддерживать бедняков, и созданием достаточно боеготовной армии, которая сможет сохранить вековую традицию нейтралитета."
 SWE_BLITZKRIEG_DESC: "Германия постепенно наступает на границы соседних государств, с каждым днем приближая новую мировую войну. Поскольку милитаристская держава зависит от шведской железной руды, велики опасения, что ее территориальные амбиции скоро распространятся за пределы стран Балтии на Скандинавию.\n\nПредвидя такую угрозу, шведская армия начала перевооружаться и модернизировать танки, чтобы усилить оборону нации. Теперь остается лишь проверить, способна ли эта держава отразить вторжение."
 NOR_GATHERING_STORM_DESC: "Со времен обретения независимости от Швеции в 1905 году Норвегия с трудом находит политическую опору и лишь сейчас начинает демонстрировать признаки стабильности и отхода от Трудных тридцатых.\n\nСейчас, когда южные соседи погрузились в конфликт и война кажется неизбежной, Норвегия должна найти способ сохранить свою хрупкую независимость. Кабинет Нюгорсвольда делает ставку на нейтралитет и разоружение, чтобы показать великим европейским державам, что его страна не представляет угрозы. Пока, впрочем, неясно, к чему приведет такой подход."
 NOR_BLITZKRIEG_DESC: "По мере того как Третий рейх становится сильнее и больше, фашистские элементы в Норвегии планируют воспользоваться возможным немецким вторжением, чтобы захватить контроль над страной и сотрудничать с врагом.\n\nВидкун Квислинг, беспринципный прихлебатель нацистской партии, хочет захватить власть для себя лично и для своей партии «Национальное единение». Пора срочно готовиться отражать нападение и справляться с внутренними и внешними угрозами."
 DEN_GATHERING_STORM_DESC: "В Европе снова растет напряженность, а у Дании тем временем слабая армия и ее экономика до сих пор страдает от последствий Великой депрессии.\n\nДатчане должны найти способ справиться с высокой безработицей и растущим движением экстремистов, осмысливая в то же время критически политику нейтралитета и умиротворения.\n\nДания по-прежнему распоряжается собственной судьбой, но надолго ли? Время покажет."
 DEN_BLITZKRIEG_DESC: "Дания сейчас в опасной ситуации: бюджет армии урезается год за годом в попытках умиротворить Германию, более крупного и сильного соседа.\n\nУмиротворение, однако же, не помешало Третьему рейху консолидировать свои силы в Европе и предъявить претензии на другие государства. Сейчас Дания должна довериться своему нейтралитету, спасшему ее от ужасов разорительной Великой войны."
 ICE_GATHERING_STORM_DESC: "Отдаленная страна Исландия, издавна известная своими моряками, только недавно, в 1919 году, получила право на самоуправление. До этого она принадлежала сначала Норвегии, а затем Дании, которая вынуждена была уступить Норвегию Швеции в 1814 году.\n\nСегодня страну беспощадно терзает Великая депрессия, а на горизонте собираются тучи, предвещающие новую войну. Перспектива сбежать с тонущего корабля и порвать все связи с Данией выглядит всё привлекательнее..."
 ICE_BLITZKRIEG_DESC: "Требования немецкого правительства грозят окончательно разрушить иллюзии о возможности поддержания мира в Европе. Нападение Германии на Данию практически неизбежно.\n\nИсландия оказалась на краю пропасти. Чтобы не ввязаться в войну, которая уже стоит на пороге, Исландии, скорее всего, придется обратиться за помощью к Америке."
 BRA_GATHERING_STORM_DESC: "Великая депрессия подорвала экономику Бразилии, слишком сильно ориентированную на экспорт. Последующие годы были ознаменованы ростом политической напряженности: коалиция армейских офицеров, рабочих и политиков свергла клику олигархов, удерживавших власть в стране, и заменила ее хрупкой демократией.\n\nТеперь на авансцену бразильской политики вышел Жетулиу Варгас, недавно предотвративший попытку коммунистического переворота и взявший на себя чрезвычайные полномочия. Сможет ли Бразилия восстановить демократическую власть или Варгас развернет страну на рельсы авторитаризма?"
 BRA_BLITZKRIEG_DESC: "Жетулиу Варгас захватил контроль над правительством и приостановил работу демократических институтов. Сконцентрировав власть в своих руках, он обратил внимание на внешнюю политику. Судя по всему, война в Европе неизбежна, а бразильское руководство мучается паранойей из-за возможного вторжения со стороны Аргентины. Но безопасность страны может гарантировать сближение с Соединенными Штатами."
 ARG_GATHERING_STORM_DESC: "В 1930 году правительство Иполито Иригойена оказалось свергнуто в результате военного переворота — первого с момента принятия аргентинской конституции. Это стало началом так называемого «Бесславного десятилетия». Аргентина оказалась в быстро меняющейся ситуации, где великие державы грозят разрушить хрупкий мир, установившийся после окончания Великой войны.\n\nКакая угроза наиболее опасна? Собирающаяся буря в Европе? Или соседи по ту сторону границы? Или внутренние враги? Аргентине придется проявить стойкость и так или иначе укрепить свое место на мировой сцене."
 ARG_BLITZKRIEG_DESC: "В результате самых нечестных выборов в истории Аргентины власть в правительстве сохранила за собой коалиция «Конкордансия», а президентом страны стал Роберто Мария Ортис.\n\nТем временем между двумя самыми близкими союзниками Аргентины в Европе назревает вражда, и стране необходимо готовиться к неизбежному выбору между двумя альянсами. Кроме того, в вооруженных силах растет недовольство и паранойя относительно намерений дремлющего северного соседа. Аргентина стоит на распутье, и ее руководству нужно серьезно задуматься о том, куда двигаться дальше."
 CHL_GATHERING_STORM_DESC: "После биржевого краха на Уолл-стрит США оказались вынуждены прекратить импорт меди и селитры из Чили, тем самым оставив эту латиноамериканскую страну без главного источника доходов. В результате этого решения Чили сильнее других государств Южной Америки пострадало от экономического кризиса, который, в свою очередь, лишь усугубил политические волнения. Справиться с ними пока не удалось.\n\nПоследний день срока Артуро Алессандри все ближе, фашистское движение — все популярнее, а в памяти чилийского народа еще свежи воспоминания о переворотах прошлого десятилетия и социалистической республике 1932 года..."
 CHL_BLITZKRIEG_DESC: "После того как попытка Хорхе Гонсалеса фон Марэеса и его соратников-нацистов устроить путч была подавлена, Артуро Алессандри ушел со своего поста, и президентом Чили стал Педро Агирре Серда. При этом опасность со стороны военных никуда не исчезла: генерал Ариосто Эррера и его сторонники могут в любой момент начать очередной переворот.\n\nОдновременно с этим сохраняется и угроза войны: напряженность нарастает не только в Европе и Азии, но и бассейне Амазонки, совсем близко к чилийской земле."
 PAR_GATHERING_STORM_DESC: "Парагвай только что вышел победителем из кровавой Чакской войны с Боливией, однако этот конфликт оставил страну обнищавшей и до крайности милитаризованной. Президент Айяла не пользуется популярностью и не может удержать ситуацию под контролем, население считает Айялу и его ближайшего соратника Хосе Феликса Эстигаррибию ответственными за развязывание войны.\n\nВоенные, сплотившиеся вокруг Рафаэля Франко и социалистического движения феберистов, строят планы по свержению правительства — и наверняка не отступят без борьбы."
 PAR_BLITZKRIEG_DESC: "В результате успешного переворота феберистов Айяла и его клика либералов потеряли власть. Народ возлагает надежды на Рафаэля Франко; многие рассчитывают, что он сумеет отомстить соседям за прошлые унижения и возобновит конфликт с Боливией, хотя подобный исход кажется всё менее вероятным.\n\nВ то же время в офицерских кругах уже зреет заговор с целью свержения Франко и передачи власти Ихинио Мориниго. Путчистов поддерживает профашистская группировка «Гион рохо», которая стремится наладить более тесные связи со странами Оси."
 URG_GATHERING_STORM_DESC: "В ходе так называемого «Уругвайского переворота 1933 года» президент Габриэль Терра сверг собственное правительство, распустил парламент, ослабил конституционные ограничения и установил авторитарный режим. Его предшественник Хосе Батлье-и-Ордоньес проводил либеральную политику, получившую название «батльизм», при нём Уругвай считался одной из самых прогрессивных демократий в Латинской Америке.\n\nВ результате политического кризиса, усугублённого большой внешней задолженностью, Восточная Республика оказалась в руках диктатора, однако нынешнему режиму не суждено укрепиться надолго…"
 URG_BLITZKRIEG_DESC: "Недавно бывший диктатор Габриэль Терра передал бразды правления своему зятю Альфредо Бальдомиру, также представляющему партию Колорадо. Бальдомир ориентирован на союзников и настроен более либерально, чем его предшественник, — он намерен вернуть Уругвай на путь либеральной демократии и прийти к сотрудничеству с великими державами в области международного порядка и права."
 AUS_GATHERING_STORM_DESC: "После самороспуска парламента в 1934 году и последующего убийства канцлера Энгельберта Дольфуса ситуация в Австрии очень напряженная. Австрийское правительство во главе с канцлером Шушнигом, связанное по рукам и ногам Сен-Жерменским мирным договором, отчаянно пытается совладать с экономическим кризисом и другими масштабными бедами. Время ставит перед Австрией вопросы без однозначного ответа: покориться ли Германии, когда та неизбежно придет за своим соседом? Сопротивляться ли до конца — и если да, то военным или дипломатическим путем? Или же обратиться к традициям прошлого и постараться возродить утраченную империю?"
 AFG_GATHERING_STORM_DESC: "Под началом короля Захир-шаха и его дядей Афганистан вступает в эпоху относительной стабильности. Но за ширмой видимого благополучия продолжают бурлить страсти и недоверие. Одни надеются на радикальную модернизацию, подобную той, что пытался провести изгнанный Аманулла-хан, который, по слухам, планирует вернуть себе трон. Другие верят, что неспешный темп реформ, проводимых Захир-шахом, всё еще слишком высок и что стране нужно вернуться к корням. Но, возможно, на фоне растущей нестабильности в окружающем мире народ Афганистана сможет объединиться и использовать открывающиеся перед ним возможности."
 AFG_BLITZKRIEG_DESC: "Пока король Захир-шах осваивается на своем посту, перед ним встают всё новые вызовы. Его государство расположено в стратегически важном регионе, и за контроль над ним борются Великобритания, Германия и Советский Союз, которые то обещают инвестиции, то угрожают вторжением. Тем временем через границу с Британской Индией проникают провокаторы всех мастей и разжигают беспорядки по обе ее стороны. Мир снова погружается в войну, и один из самых острых вопросов в регионе: «Как будет действовать Афганистан?»"
 BEL_GATHERING_STORM_DESC: "Бельгия несет на себе страшные шрамы, оставленные Великой войной. Немалая часть страны лежит в развалинах, но эти руины ничто по сравнению с душевной болью бельгийского народа. Под вопросом и сохранение демократического строя: фашистские группировки наперебой обвиняют правительство в коррупции.\n\nНа международной арене Бельгия вынуждена выдерживать равновесие между обязательствами перед теми, кто превратил страну в поле боя, и необходимостью защищать страну от грядущих мировых потрясений."
 BEL_BLITZKRIEG_DESC: "Внутренняя обстановка в Бельгии по-прежнему нестабильна, но это ничто по сравнению с происходящим на мировой арене. Страна увеличила и модернизировала свою армию, уделив особое внимание строительству мощных укреплений, не уступающих французской линии Мажино.\n\nПравительство вышло из всех союзов и провозгласило полный нейтралитет, однако продолжает вести закулисные переговоры на случай нападения. Сейчас Бельгия с тревогой следит за растущим милитаризмом своего соседа."
 COG_GATHERING_STORM_DESC: "Еще не забыты Свободное государство Конго и король Леопольд II, однако с тех времен в Бельгийском Конго многое изменилось. Хотя колониальное правительство по-прежнему эксплуатирует шахтеров и создает невидимый потолок для большинства коренных жителей, не позволяя им получать образование, надежда всё-таки есть.\n\nПока Италия демонстрирует растущие колониальные амбиции, «Форс Пюблик», достойно проявившая себя в Великой войне, снова готовится защищать страну, невзирая на недостаточное снабжение."
 COG_BLITZKRIEG_DESC: "Теперь, когда Италия завоевала Абиссинию, а Германский рейх расширил свои европейские владения, под угрозой оказалась и наша страна. Итальянцы не станут ограничивать свои колониальные амбиции Восточной Африкой и могут дойти до нас уже в ближайшем будущем, а Гитлер, собираясь покорить всю Европу, активно присматривается к нашим бельгийским хозяевам.\n\nСудя по всему, война неизбежна. Возможно, нам стоит нанести удар первыми..."
 PER_GATHERING_STORM_DESC: "Иран, который еще совсем недавно назывался Персией, оказался на пересечении интересов готовящихся к войне гигантов. Пока эта страна проводит стремительную модернизацию под флагом нейтралитета и при поддержке Третьего рейха, бывшие партнеры Ирана Советский Союз и Великобритания с подозрением следят за его развитием. Реза-шах Пехлеви не позволяет этим державам подмять Иран под себя, несмотря на угрозу иностранного вторжения.\n\nПроявят ли великие державы уважение к иранскому суверенитету? Готовы ли мы защитить свою родину от злобных завоевателей? И если другого пути нет, быть может, нам стоит взглянуть в прошлое и возродить дух древней Персидской империи..."
 IRQ_GATHERING_STORM_DESC: "Под властью короля Фейсала I и позднее его сына, короля Гази, Ирак переживает неспокойные послевоенные времена, находясь под мандатом Великобритании. Династия Хашимитов стремится править с учетом интересов сторонников модернизации и националистов, но внутри общества назревают противоречия. Народные вожди презирают центральную власть, а городские элиты требуют большей независимости от британского влияния. Сторонники панарабизма и многочисленные национальные и религиозные общины сосуществуют в состоянии хрупкого равновесия. По мере того как мир движется к очередному великому конфликту, Ирак балансирует между единством и хаосом. Его будущее туманно, и вариантов развития достаточно много."
 IRQ_BLITZKRIEG_DESC: "В последние годы Ирак переживает период смуты. Возглавленный Бакром Сидки переворот 1936 года подточил хрупкий трон Хашимитов и создал опасный прецедент вмешательства военных в политику. В обществе назревает противостояние между сопротивляющимися централизации вождями племен, борющимися за модернизацию реформаторами и армейскими офицерами, почувствовавшими вкус власти. Панарабский национализм усиливается, националисты бросают вызов британскому влиянию и лелеют мечты об объединении региона. Мир вокруг становится всё менее стабильным, и Ирак оказывается на перепутье: его народ разобщен, а будущее туманно."
 PER_BLITZKRIEG_DESC: "Иран стоит на пороге будущего, полного неопределенности и потрясений. В Европе разгорается война, и Реза-шах Пехлеви обнаруживает себя зажатым как в клещах между двумя крупными игроками, которые планируют быть активными участниками мирового конфликта.\n\nСуверенитет Ирана может оказаться под угрозой, если речь пойдет о ценных ресурсах, поэтому правительству шаха нужно быть готовым отразить любое возможное вторжение. Вопрос в одном: успеет ли оно вовремя мобилизовать страну?"
 PHI_GATHERING_STORM_DESC: "В 1935 году правительство Соединенных Штатов наконец одобрило план мирного десятилетнего перехода Филиппин к независимости. Процесс только начался, но со временем самостоятельность островного государства будет только крепнуть.\n\nСтанет ли оно поддерживать связи с Америкой — или же предпочтет положиться на поддержку других государств, чтобы поскорее обрести свободу? Филиппинский народ стремится к светлому будущему, но вокруг юной державы уже начинают описывать круги голодные акулы..."
 SIA_BLITZKRIEG_DESC: "Придя к власти в конце 1938 года, премьер-министр Пибунсонгкрам привёл Сиам в соответствие со своими воззрениями. Страна обрела новое имя — Таиланд — и новую идеологию, в которой армейская дисциплина сочеталась с пантаистским национализмом и территориальными претензиями на все области с тайскоязычным населением, остававшиеся под колониальным владычеством Великобритании и Франции.\n\nПока Европа движется к большой войне, а Япония всё глубже увязает в Китае, армия Пхибунсонгкрама становится сильнее с каждым днём. Его амбиции ни для кого не являются секретом — вопрос лишь в том, на чьей стороне в решающий момент окажется Таиланд."
 PHI_BLITZKRIEG_DESC: "Правительство Соединенных Штатов, верное своему слову, неизменно поддерживает движущиеся на пути к независимости Филиппины.\n\nОднако разразившаяся между Китаем и Японией война спутала все карты. С севера к юному островному государству тянется рука империализма.\n\nНа помощь уже прибыли первые американские подразделения, но смогут ли они дать отпор японскому хищнику, почуявшему кровь?"
 SIA_GATHERING_STORM_DESC: "Прошло всего четыре года с тех пор, как Народная партия положила конец эпохе абсолютной монархии. Конституционное государство в Сиаме делает свои первые шаги, но былое единство уже трещит по швам. Гражданские реформаторы мечтают о демократической форме правления, в то время как военные заявляют, что им нужна сильная власть, армейская дисциплина и пантаистская экспансия.\n\nНаблюдая за стремительным усилением Японии, зажатый между британскими и французскими колониальными владениями Сиам вынужден действовать крайне осторожно. Надвигающаяся буря вынудит молодую державу выбрать одну из сторон — или попытаться выжить отдельно от всех."
 INS_GATHERING_STORM_DESC: "Более трех столетий Голландская Ост-Индия оставалась жемчужиной нидерландской короны. Ее многочисленные острова, языки и культуры связывала между собой исключительно колониальная администрация.\n\nОднако со временем Гаага ослабила хватку. Коренные жители устали от эксплуатации и все охотнее прислушиваются к голосам националистических движений. Пока эти движения далеки от единства и по-разному представляют себе будущее Индонезии. От того, сумеют ли они преодолеть различия, зависит судьба Ост-Индии."
 INS_BLITZKRIEG_DESC: "Три года назад группа членов фольксраада во главе с Сутарджо обратилась в Гаагу с просьбой в течение десяти лет предоставить Голландской Ост-Индии самоуправление. В ноябре прошлого года королевский двор ответил отказом.\n\nНеуступчивость метрополии привела к тому, чего не удавалось достичь за многие годы агитации. В мае восемь крупнейших националистических движений отложили свои разногласия, объединились в федерацию и вместе потребовали созыва индонезийского парламента. Колониальная администрация, как обычно, отказалась пойти им навстречу, но Гаага далеко, а наступающая японская армия тем временем продвигается всё дальше на юг…"
 COUNTRY_SELECTION_CHARACTER_DESC_NAME: "$NAME|Y$"
 COUNTRY_SELECTION_CHARACTER_DESC: "$NAME|Y$ $DESC|$\n$TRAITS_DESC|$"
