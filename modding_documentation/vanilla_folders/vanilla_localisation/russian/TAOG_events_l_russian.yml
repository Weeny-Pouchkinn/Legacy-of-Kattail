 ### INS News
 taog_news.1.t: "Зарождение Нидерландско-Индонезийского Союза"
 taog_news.1.desc: "[1058.GetName] у всех на устах: именно там королева Вильгельмина вчера произнесла речь, в которой неожиданно для собравшихся объявила о создании нового государства — Нидерландско-Индонезийского Союза. [HOL.GetAdjective]ое правительство в изгнании, пока не способное вернуться на оккупированную родину, и [INS.GetAdjRuLower]ая администрация согласились править новым образованием совместно под властью короны. Официальные представители обеих сторон заявляют, что это вынужденная мера, вызванная отчаянной попыткой сохранить единство и власть королевства сразу на двух континентах."
 taog_news.1.a: "Любопытное развитие событий."
 taog_news.2.t: "Декларация о независимости Индонезии"
 taog_news.2.desc: "Сегодня [INS.GetAdjRuLower]ий революционер [INS.GetLeader] выступил[INS.GetVerbGendEndA_RU] перед жителями острова Ява с речью, в которой провозгласил[INS.GetVerbGendEndA_RU] создание независимой Республики Индонезия. Власти [HOL.GetNameRuGen] отказались признавать суверенитет нового образования, однако часть объявленной территории де-факто находится под контролем республиканского ополчения."
 taog_news.2.a: "Последствия может ощутить на себе весь мир."
 ############
 ### SIAM ###
 ############
 siam.1.t: "[SIA_phraya_phahon.GetName] замешан в скандале"
 siam.1.desc: "[SIA_phraya_phahon.GetName] предстал перед судом: он обвиняется в том, что продает государственным чиновникам королевские земельные участки по ценам ниже рыночных. Этот скандал значительно пошатнул его авторитет в глазах Народного собрания. По всей видимости, [SIA_phraya_phahon.GetName] начинает стремительно терять накопленное влияние."
 siam.1.a: "Может, освободившееся место займет кто-то другой?"
 #Spmgsiradet rebellion historical
 siam.2.t: "[SIA_plaek_phibunsongkhram.GetName] переживает третье покушение"
 siam.2.desc: "Корреспондент «Рейтерс» в Бангкоке сообщает, что неизвестные злоумышленники попытались отравить премьер-министра Сиама. Это уже третье покушение на жизнь господина Пибуна Сонгкрама за последние четыре года.\nКак заявило издание, несостоявшиеся убийцы подмешали в пищу яд, от которого пострадали не только сам господин Сонгкрам, но также его жена и дочь.\nМинистр иностранных дел Великобритании лорд Галифакс послал господину Сонгкраму телеграмму, в которой выразил обеспокоенность этим инцидентом и поздравил премьер-министра с выздоровлением." #https://trove.nla.gov.au/newspaper/article/47990695
 siam.2.a: "Кто мог такое совершить?"
 siam.3.t: "Пья Сонгсурадет изгнан"
 siam.3.desc: "Пья Сонгсурадет предстал перед судом по обвинению в организации заговора, жертвой которого должен был стать [SIA_plaek_phibunsongkhram.GetName], и попытке государственного переворота. Правительство объявило, что Сонгсурадет будет отстранен от командования, лишен званий и титулов, уволен в отставку без права на пенсию, а также изгнан из страны.\nКритики утверждают, что этот судебный процесс — не более чем чистка, которую [SIA_plaek_phibunsongkhram.GetName] проводит в попытке избавиться от своего главного оппонента, но эти клеветнические заявления не заслуживают внимания."
 siam.3.a: "Печальный день."
 siam.4.t: "Арестованы сторонники Сонгсурадета"
 siam.4.desc: "Рано утром силы тайской королевской полиции арестовали еще 51 подозреваемого. Среди задержанных — принц Рангсит, Пья Тхеватсадин и Пья Удом Понгпхенсавад. Им предъявлены обвинения в антиправительственном сговоре с Пья Сонгсурадетом, причем особо отмечено, что к ответу будет привлечен член королевской семьи. Высказываются предположения, что принц Рангсит был арестован не случайно: возможно, это попытка заставить королевскую семью умерить амбиции."
 siam.4.a: "Дело становится всё интереснее."
 siam.5.t: "Восстание 18 покойников"
 siam.5.desc: "Учрежденный по приказу Пибуна особый трибунал рассмотрел дела 51 участника восстания. Из них 25 человек были приговорены к пожизненному заключению, еще 21 — к расстрелу. Из приговоренных к казни через расстрел трое — в частности, принц Рангсит и Пья Тхеватсадин — были помилованы за заслуги перед государством."
 siam.5.a: "Дело разрешилось."
 #Songsuradet rebellion alternative
 siam.6.t: "Сонгсурадет в тупике"
 siam.6.desc: "Пья Сонгсурадет предстал перед судом по обвинению в организации заговора, жертвой которого должен был стать [SIA_plaek_phibunsongkhram.GetName], и попытке государственного переворота. Правительство объявило, что Сонгсурадет будет отстранен от командования и изгнан из страны.\nОднако арест был сорван военными, сохранившими верность Сонгсурадету, — они заявили, что это решение имеет политическую подоплеку. Правительство и военная клика Сонгсурадета оказались в тупиковой ситуации: ни одна из сторон не желает уступать другой."
 siam.6.a: "Мы не отступим."
 siam.6.b: "Всё пошло не по плану. Надо отступиться."
 siam.7.t: "Сонгсурадет ищет поддержки флота"
 siam.7.desc: "Противостояние между государственными силами и военной кликой Сонгсурадета далеко от завершения. До следователей дошли слухи, что Сонгсурадет вступил в заговор с Королевским флотом, чтобы заручиться его поддержкой в борьбе с Пибуном и его авторитарными замашками.\nКроме того, работники королевского двора сообщили, что представители Сонгсурадета устраивают встречи с высокопоставленными принцами. Опасения, что королевская семья также примкнет к оппозиции, растут с каждым днем."
 siam.7.a: "Мы — правительство, и нас нельзя запугать шантажом!"
 siam.7.b: "Ситуация выходит из-под контроля. Надо отступиться."
 #alt-hist actual rebellion
 siam.8.t: "Восстание Сонгсурадета"
 siam.8.desc: "Военная клика Сонгсурадета сумела заручиться мощной поддержкой — как политической, так и военной. Теперь [THIS.GetName] в значительной мере принадлежит ей и вставшему на ее сторону флоту. Очевидцы сообщили, что рано утром в пригороде Бангкока раздавались звуки выстрелов. Еще немного — и начнется настоящая гражданская война между правительством и силами Сонгсурадета."
 siam.8.a: "Нельзя допустить, чтобы правительство пало."
 #alt-hist actual rebellion
 siam.9.t: "Восстание Сонгсурадета окончено"
 siam.9.desc: "Мятежники разгромлены. Сонгсурадет захвачен в плен. Осталось только провести суд, хотя всем уже очевидно, что этот процесс — не более чем формальность. Заговор проник очень глубоко, поразив не только армию и флот, но даже королевскую семью: повстанцев открыто поддерживал лично принц Рангсит. Нам не оставили выбора. Диссиденты должны быть зачищены!"
 siam.9.a: "Пора восстанавливать страну."
 #Attack Indochina
 siam.10.t: "Победа!"
 siam.10.desc: "Разгромленный враг отступает, и наша победа близка. Империалисты, веками владевшие нашей землей, сегодня, должно быть, дрожат от страха. Наш триумф предначертан свыше — и они не могут смириться с этой мыслью."
 siam.10.a: "Да здравству[ROOT.GetNameEndRuPresentEtYut] [ROOT.GetName]!"
 siam.10.b: "Получается очень даже неплохо."
 siam.11.t: "Торжество [FROM.GetAdjRuLower]ой стратегии"
 siam.11.desc: "Вопреки всем ожиданиям [FROM.GetAdjRuLower]ие войска провели удачный маневр и захватили регион, за который шла ожесточенная борьба. Вместе с нашими военными позициями пошатнулось и основание для претензий на эти территории. Продолжение конфликта грозит дальнейшим ухудшением дисциплины и боевого духа. При этом сдача территорий будет равноценна открытому признанию поражения."
 siam.11.a: "Нужно отступить, чтобы минимизировать потери."
 siam.11.b: "Мы не откажемся от своего!"
 siam.12.t: "[FROM.GetName] призна[FROM.GetNameEndRuPresentEtYut] поражение"
 siam.12.desc: "Наш поход завершился победой. Вражеские войска повержены, и [FROM.GetName] официально уступил[FROM.GetNameRuEndPast] нам власть над спорными территориями, чтобы избежать дальнейшего кровопролития. Тем самым мы закрепили свой авторитет и обезопасили границы… по крайней мере, на какое-то время."
 siam.12.a: "Наша мощь неоспорима."
 siam.13.t: "[FROM.GetName] отказыва[FROM.GetNameEndRuPresentEtYut]ся от компромисса"
 siam.13.desc: "[FROM.GetName] решительно отверга[FROM.GetNameEndRuPresentEtYut] любые предложения пойти на территориальные уступки, считая их неприемлемыми. Вражеские власти заявили, что путь к окончанию конфликта только один: наш полный разгром."
 siam.13.a: "Значит, война."
 siam.14.t: "[FROM.GetNameDefCap] начина[FROM.GetNameEndRuPresentEtYut] тотальную войну"
 siam.14.desc: "Власти [FROM.GetNameRuGen] перестали даже делать вид, что их интересуют переговоры. Их намерения очевидны: покорить и поглотить наше государство. Исход войны будет решаться не на переговорах, а на поле боя — либо полная победа, либо полный разгром."
 siam.14.a: "Не отступать и не сдаваться!"
 siam.15.t: "[SIA.GetAdjective]ое наступление захлебнулось"
 siam.15.desc: "Стремительная атака [SIA.GetAdjRuLower]их войск, поначалу заставшая нас врасплох, выдохлась: наступающей армии всё труднее справляться с растущим напряжением. С каждым днем ее слабость становится всё очевиднее. [SIA.GetAdjective]ие силы, рассчитывавшие на молниеносную операцию, оказались не готовы к трудным и медленным боям. Мы могли бы проявить великодушие и дать им возможность отступить в обмен на ряд уступок, но сначала надо определиться, что больше отвечает нашим интересам: милосердие или безоговорочная победа."
 siam.15.a: "Предложить условия."
 siam.15.b: "Мы согласны только на безоговорочную победу."
 siam.16.t: "Заглохшее наступление"
 siam.16.desc: "Наше наступление застопорилось — но страшнее всего то, что это понимает и враг. Нам выдвинули ультиматум: либо мы сдаемся и несем минимальные потери, либо проливаем еще больше крови, продолжая войну. Иными словами, вопрос в том, сколько жизней мы готовы принести в жертву."
 siam.16.a: "Пусть будет мир."
 siam.16.b: "Мы не сдадимся!"
 siam.17.t: "[FROM.GetName] не жела[FROM.GetNameEndRuPresentEtYut] уступать"
 siam.17.desc: "Власти [FROM.GetNameRuGen] вполне однозначно заявили, что скорее готовы пожертвовать всей страной, чем уступить нам хотя бы клочок своей земли. Война продолжается."
 siam.17.a: "Они сами этого хотели."
 siam.18.t: "[FROM.GetName] жела[FROM.GetNameEndRuPresentEtYut] добиться нашей капитуляции!"
 siam.18.desc: "Мы перехватили переговоры вражеского верховного командования, и самые страшные наши опасения подтвердились: противник не желает переговоров и уступок, которые могли бы привести войну к достойному завершению. Вместо этого от нас требуют полной и безоговорочной капитуляции. Империалисты вновь хотят придавить нас к земле своим сапогом, и на это у нас только один ответ: мы не сдадимся."
 siam.18.a: "[ROOT.GetNameDefCap] не сда[ROOT.GetNameEndRuPresentEtYut]ся!"
 siam.19.t: "[SIA.GetName] требу[SIA.GetNameEndRuPresentEtYut] возвращения территорий"
 siam.19.desc: "Власти [SIA.GetNameRuGen] видят рост национализма в стране и хотят им воспользоваться. Они считают, что нам не хватает сил противостоять другим региональным игрокам, и потому требуют вернуть [SIA.GetNameRuDat] территории, которые объявлены там национальными. Очевидно, они пытаются прыгнуть выше головы, но сейчас, когда мир стремительно катится в пропасть, возможно, нам стоит пойти им навстречу."
 siam.19.a: "За это не стоит проливать кровь."
 siam.19.b: "Это безумие!"
 siam.20.t: "[FROM.GetName] переда[FROM.GetNameEndRuPresentEtYut] территории"
 siam.20.desc: "Власти [FROM.GetNameRuGen] решили вернуть нам наши старые территории. Не столь важно, что их к этому подтолкнуло — признание нашего права или давление со стороны других держав. Важно, что справедливость на нашей стороне."
 siam.20.a: "Великий день!"
 siam.21.t: "[FROM.GetName] отказыва[FROM.GetNameEndRuPresentEtYut]ся передавать территории"
 siam.21.desc: "Власти [FROM.GetNameRuGen] ответили нам отказом. Эти заложники империализма до сих пор живут прошлым веком, цепляясь за ярма и оковы. Они не готовы смириться с тем, что время «великих держав» безвозвратно ушло."
 siam.21.a: "Значит, мы им напомним."
 SIA_sent_bureaucrats_to_us: "Обучают у нас своих чиновников"
 SIA_tied_their_currency_to_ours: "Привязали курс своей валюты к нашей"
 SIA_sent_started_cooperative_with_us: "Создали с нами кооператив по развитию"
 siam.22.t: "Отправка [SIA.GetAdjRuLower]их бюрократов за границу"
 siam.22.desc: "Наши бюрократы плохо ориентируются в современной экономике, им не хватает знаний, необходимых для процветания страны. К счастью, в мире полно государств с современной и хорошо развитой бюрократической системой. Мы можем отправить их туда набираться опыта, не перенимая при этом чуждую нам систему управления."
 siam.22.a: "Отправим их на территорию [ENG.GetNameRuGen]"
 siam.22.b: "Отправим их на территорию [JAP.GetNameRuGen]"
 siam.23.t: "Закон о стабилизации бата"
 siam.23.desc: "Без крепкого бата [ROOT.GetName] не смог[ROOT.GetNameSuffixRuDzhetGut] навести порядок в торговле и финансах. Наши чиновники утверждают, что для финансовой стабильности необходим внешний якорь, привязанный к надежной валюте, которой доверяют торговцы, кредиторы и иностранные партнеры. Мы стоим перед очень важным выбором. Он определит направление нашей торговли, характер нашего развития и иностранное влияние, которое будет оказываться на [SIA.GetAdjRuLower]ую экономику."
 siam.23.a: "Привяжем его к фунту стерлингов"
 siam.23.b: "Привяжем его к иене"
 siam.24.t: "Кооператив [SIA.GetAdjRuLower]ого развития"
 siam.24.desc: "Кооператив [SIA.GetAdjRuLower]ого развития предоставил государству новый инструмент для национального прогресса, но наши амбиции по-прежнему опережают внутренний капитал. Чтобы быстро строить железные дороги, мастерские и электростанции, без внешнего финансирования не обойтись. Сейчас перед нами лежат два пути. [ENG.GetAdjective]ие инвестиции открывают доступ к устоявшимся рынкам, опытным фирмам и финансовому престижу Лондона. [JAP.GetAdjective]ие инвестиции предполагают более тесное промышленное партнерство с восходящей азиатской державой, которая стремится расширить свое влияние. Оба эти пути могут ускорить наше развитие, но накладывают на нас определенные обязательства."
 siam.24.a: "Привлечем [ENG.GetAdjRuLower]ие инвестиции"
 siam.24.b: "Привлечем [JAP.GetAdjRuLower]ие инвестиции"
 siam.25.t: "Смерть Прачадипока"
 siam.25.desc: "Король Прачадипок умер. Бывший король, чье имя хранило память о старом режиме на протяжении многих лет изгнания и потрясений, теперь становится частью истории. Для некоторых с его смертью заканчивается последняя глава борьбы, начавшейся с крахом абсолютной монархии. Однако дело, которому он посвятил жизнь, не погибло вместе с ним. Трон по-прежнему на месте, династия живет, а работу по восстановлению величия и стабильности [ROOT.GetNameRuGen] теперь продолжит молодой король Ананда."
 siam.25.a: "Да вознесется Его Величество на небеса."
 siam.27.t: "Воспитание короля"
 siam.27.desc: "Король Ананда остается на территории [SWI.GetNameRuGen], вдали от королевства, которое он однажды возглавит. Однако расстояние не освобождает его от нашего влияния. Мы можем выбирать ему учителей, назначать предметы для изучения и поощрять полезные привычки, чтобы его ум формировался в соответствии с тем, каким мы видим будущее [ROOT.GetNameRuGen]. Вернется ли он солдатом, ученым или кем-то еще, в немалой степени зависит от того, что ему предстоит изучать сейчас.\n\nИбо что такое настоящий король, если не продолжение своей страны?"
 siam.27.a: "Воспитаем в нем интерес к научной деятельности."
 siam.27.b: "Обучим его военному делу."
 siam.27.c: "Разовьем у него интерес к управлению и снабжению."
 siam.27.d: "Направим его на путь промышленности и развития."
 siam.28.t: "Коронация короля Ананды"
 siam.28.desc: "Долгие годы регентства подходят к своему логическому завершению. В Бангкоке, где собрались принцы, монахи, министры и государственные чиновники, Ананда восходит на трон, ему воздают почести как королю из династии Чакри. Церемония символизирует собой переход страны от потрясений к преемственности и от раздоров к священному порядку. Это не просто зрелище, а заявление о том, что власть короны нерушима, что ее не сломили изгнание и гражданские конфликты, а также что [ROOT.GetNameDef] вступа[ROOT.GetNameEndRuPresentEtYut] в новую эпоху правления."
 siam.28.a: "Да здравствует король."
 siam.29.t: "Изучение традиционных танков"
 siam.29.desc: "Традиционные танки по-прежнему господствуют на поле боя, и потому, чтобы сформировать мощный танковый корпус, нам нужно учиться у лучших."
 siam.29.a: "Мы будем учиться на германском опыте"
 siam.29.b: "Мы будем учиться на американском опыте"
 siam.29.c: "Мы будем учиться на британском опыте"
 siam.31.t: "Приобретение подводных лодок"
 siam.31.desc: "Нашему растущему военно-морскому флоту нужны подводные лодки. Пора решать, к какой державе мы обратимся за помощью. [ENG.GetNameDef] и [JAP.GetNameDef] уже предлагают нам свои услуги, но не следует забывать, что выбор между ними может затрагивать не только кораблестроение…"
 siam.31.a: "[ENG.GetAdjective]ие субмарины отлично послужат нашим интересам."
 siam.31.b: "Построим подводный флот по [JAP.GetAdjRuLower]им чертежам."
 siam.32.t: "Приобретение кораблей береговой обороны"
 siam.32.desc: "Прибрежным водам нашей страны требуется надёжная охрана, и мы должны решить, какая держава поставит нам наиболее подходящие корабли. И [ENG.GetNameDef], и [JAP.GetNameDef] готовы оказать нам эту услугу, однако сделанный выбор повлияет не только на состояние флота, но и на наши международные отношения."
 siam.32.a: "Для береговой обороны мы возьмём [ENG.GetAdjRuLower]ие корабли."
 siam.32.b: "Нам нужен береговой флот [JAP.GetAdjRuLower]ого производства."
 siam.33.t: "Продажа компании «Бангкокские доки»"
 siam.33.desc: "Продажа компании «Бангкокские доки» завершена, вырученную сумму мы уже перечислили в государственную казну. Правительство должно решить, как лучше распорядиться этими средствами — облегчить финансовое бремя, лежащее на наших жителях, ускорить техническое развитие державы или повысить уверенность народа в завтрашнем дне."
 siam.33.a: "Мы уменьшим налоговое бремя своих подданных."
 siam.33.b: "Средства будут направлены на военно-морские изыскания."
 siam.33.c: "Благодаря этим деньгам наши граждане почувствуют себя увереннее."
 siam.34.t: "[FROM.GetAdjective]ие требования у наших берегов"
 siam.34.desc: "[FROM.GetAdjective]ое правительство оказывает давление на [ROOT.GetNameRuAcc], а его дипломаты говорят с уверенностью людей, считающих исход дела уже предрешенным. Они используют привычную риторику, предлагая нам порядок и стабильность, однако хотят лишь одного — подчинения. Мы можем уступить и сохранить государство пусть и в более скромных границах, присоединиться к их альянсу в надежде сохранить хотя бы толику свободы действий или же ответить на это давление открытым неповиновением и потребовать от захватчиков убраться от наших берегов."
 siam.34.a: "Мы присоединимся к их альянсу и сохраним свою власть."
 siam.34.b: "Пусть убираются от наших берегов."
 siam.35.t: "[JAP.GetNameDefCap] требу[JAP.GetNameEndRuPresentEtYut] печатать больше денег"
 siam.35.desc: "[JAP.GetNameDefCap] ясно дал[JAP.GetNameRuEndPast] нам понять, что пора включить печатный станок и увеличить объём денежной массы. Это послужит интересам [JAP.GetAdjRuLower]ой промышленности, в то время как нашим подданным придётся смириться с ростом цен — но увы, у нас нет возможности отказаться."
 siam.35.a: "Примем требования [JAP.GetNameRuGen]."
 siam.36.t: "[SIA.GetNameDefCap] требу[SIA.GetNameEndRuPresentEtYut] вернуть долг"
 siam.36.desc: "[SIA.GetNameDefCap] официально потребовал[SIA.GetNameRuEndPast], чтобы мы оплатили их расходы, вызванные дополнительной эмиссией денег. Это соглашение хорошо послужило нашим интересам, но теперь пора платить по счетам."
 siam.36.a: "Мы признаем свой долг и начнём выплаты."
 siam.37.t: "[JAP.GetNameDefCap] соглаша[JAP.GetNameEndRuPresentEtYut]ся выплатить долг"
 siam.37.desc: "[JAP.GetNameDef] принял[JAP.GetNameRuEndPast] наши требования и пообещал[JAP.GetNameRuEndPast] оплатить расходы, вызванные дополнительной эмиссией. Это не сильно облегчит экономическое бремя, которое легло на плечи наших подданных, но позволит улучшить состояние казны."
 siam.37.a: "Справедливое решение. А экономика ещё восстановится."
 siam.38.t: "[SIA.GetName] жела[SIA.GetNameEndRuPresentEtYut] обсудить условия"
 siam.38.desc: "[SIA.GetAdjective]ое правительство обратилось к нам с просьбой обсудить мирные условия. Их министры вынуждены признать то, что наши войска уже продемонстрировали силой оружия — [ROOT.GetNameDef] владеет инициативой в этой схватке. Мы можем принять их капитуляцию и привести к покорности, заставить присоединиться к нашему альянсу с тем, чтобы [SIA.GetAdjRuLower]ое правительство служило нашему общему делу, либо отвергнуть любые компромиссы и продолжить кампанию до полного завоевания Сиама."
 siam.38.a: "Принять их капитуляцию."
 siam.38.b: "Нет. Мы решим это дело силой."
 siam.39.t: "[FROM.GetAdjective]ое правительство принимает нашу капитуляцию"
 siam.39.desc: "[FROM.GetLeader] заявил[FROM.GetVerbGendEndA_RU], что [FROM.GetAdjRuLower]ое правительство принимает нашу сдачу. Пока нашей стране удалось избежать дальнейших разрушений пусть и за счет унижения. [ROOT.GetAdjective]ая армия получила приказ сложить оружие, а правительство сохраняет свои полномочия лишь по милости более могущественного государства. Мы смогли сохранить страну, но лишь ценой утраты национальной гордости и свободы действий."
 siam.39.a: "Мы выстоим перед испытаниями, которые нам суждено вынести."
 siam.40.t: "[FROM.GetAdjective]ое правительство отвергает наше предложение"
 siam.40.desc: "[FROM.GetLeader] заявил[FROM.GetVerbGendEndA_RU], что [FROM.GetAdjRuLower]ое правительство отвергает все инициативы, исходящие из Бангкока. Уступки — недостаточны, компромиссы — неприемлемы. Враг намерен разрешить конфликт исключительно путем полного завоевания страны. [ROOT.GetNameRuDat] придется сражаться. Если захватчики не уйдут с наших берегов по доброй воле, их придется сбросить в море."
 siam.40.a: "Значит, мы будем сражаться."
 siam.41.t: "[FROM.GetNameDefCap] отправил[FROM.GetNameRuEndPast] чиновников перенимать наш опыт"
 siam.41.desc: "К нам прибыла делегация [FROM.GetAdjRuLower]их чиновников, чтобы изучить и перенять наши научные и административные методы. [FROM.GetNameDefCap] явно жела[FROM.GetNameEndRuPresentEtYut] модернизировать свой бюрократический аппарат с оглядкой на иностранный опыт — и выбрал[FROM.GetNameRuEndPast] [ROOT.GetNameRuAcc] в качестве примера для подражания. Их визит не только служит признанием эффективности наших методов, но и позволяет улучшить отношения с [FROM.GetAdjRuLower]ими властями."
 siam.41.a: "Мы радушно примем их делегацию."
 siam.42.t: "[FROM.GetNameDefCap] привязал[FROM.GetNameRuEndPast] курс своей валюты к нашей"
 siam.42.desc: "[FROM.GetNameDefCap] официально объявил[FROM.GetNameRuEndPast], что курс [FROM.GetAdjRuLower]ой валюты отныне будет привязан к нашему. Это решение подчёркивает веру [FROM.GetNameRuGen] в надёжность наших финансовых институтов и позволяет сильнее вовлечь эту страну в нашу экономическую сферу. Торговля между нашими державами станет более предсказуемой, а [FROM.GetAdjRuLower]им компаниям будет проще вести дела с нашими."
 siam.42.a: "Это пойдёт на пользу нашим торговым взаимоотношениям."
 siam.43.t: "[FROM.GetNameDefCap] рассчитыва[FROM.GetNameEndRuPresentEtYut] на помощь в развитии"
 siam.43.desc: "[FROM.GetNameDefCap] приглаша[FROM.GetNameEndRuPresentEtYut] наших инженеров и специалистов помочь с развитием местной экономики и инфраструктуры. Такое сотрудничество усилит экономические связи между державами, позволив нашим предприятиям надёжно закрепиться в регионе. Это на первый взгляд скромное предложение сулит немалую выгоду в будущем."
 siam.43.a: "Мы рады оказать любую помощь."
 siam.44.t: "[FROM.GetNameDefCap] размеща[FROM.GetNameEndRuPresentEtYut] заказ на субмарины"
 siam.44.desc: "[FROM.GetNameDefCap] разместил[FROM.GetNameRuEndPast] заказ на подводные лодки, построенные по нашим чертежам. Эта сделка поможет [FROM.GetNameRuDat] усилить влияние в Юго-Восточной Азии и подчеркнёт веру [FROM.GetNameRuGen] в мощь нашей военно-морской промышленности."
 siam.44.a: "Это замечательная новость для наших верфей."
 SIA_purchased_submarines_from_us: "Закупили у нас подводные лодки"
 siam.45.t: "[FROM.GetNameDefCap] предлага[FROM.GetNameEndRuPresentEtYut] объединить союзы"
 siam.45.desc: "К нам прибыла делегация из [FROM.GetNameRuGen]. [FROM.GetLeader] предлагает объединить наши союзы в единый альянс, мотивируя это тем, что сейчас мы преследуем общие цели, но вынуждены бороться друг с другом за живую силу, ресурсы и дипломатическое влияние.\n\nОбъединив силы, мы сформируем мощный блок и сможем координировать нашу стратегию по более широкому фронту. Несомненно, подобное соглашение послужит интересам общего дела, однако нам придётся смириться с тем, что в дальнейшем [FROM.GetName] буд[FROM.GetNameEndRuPresentEtUt] влиять на любые решения альянса."
 siam.45.a: "Мы должны выступить единым фронтом."
 siam.45.b: "Сторонним державам не место в нашем союзе."
 siam.46.t: "[FROM.GetNameDefCap] соглаша[FROM.GetNameEndRuPresentEtYut]ся на объединение"
 siam.46.desc: "[FROM.GetLeader] принял[FROM.GetVerbGendEndA_RU] предложение объединить наши союзы в общую коалицию. Командование вооружённых сил и дипломатические каналы, прежде разобщённые, будут сведены в единую структуру, что позволит нашим правительствам лучше координировать военные планы, снабжение и внешнюю политику.\n\nВ этом соглашении есть немало подводных камней, однако польза от объединения превышает риски."
 siam.46.a: "Вместе мы станем сильнее."
 siam.47.t: "[FROM.GetNameDefCap] отказыва[FROM.GetNameEndRuPresentEtYut]ся объединяться"
 siam.47.desc: "[FROM.GetLeader] отклонил[FROM.GetVerbGendEndA_RU] наше предложение об объединении альянсов. Правительство [FROM.GetNameRuGen] заявило, что готово действовать сообща с нами в рамках общих интересов, но не согласно войти в широкую коалицию, которой командует [ROOT.Capital.GetCapitalVictoryPointName].\n\nНа данный момент между нашими блоками всё ещё остаются противоречия. Мы должны преследовать свои цели, не рассчитывая на безусловную поддержку [FROM.GetNameRuGen]."
 siam.47.a: "Значит, справимся сами."
 siam.48.t: "[SIA.GetName] запрашива[SIA.GetNameEndRuPresentEtYut] [JAP.GetAdjRuLower]ую помощь"
 siam.48.desc: "[SIA.GetNameDefCap] официально запросил[SIA.GetNameRuEndPast] военную помощь для борьбы с силами, вторгшимися в страну. Взамен [SIA.GetAdjRuLower]ое правительство готово дать [JAP.GetAdjRuLower]им фирмам привилегированный доступ к стратегическим ресурсам, инфраструктурные и торговые права.\n\nПоддержка [SIA.GetNameRuGen] расширит наше влияние в Юго-Восточной Азии и обеспечит империю ценными материалами, но также может втянуть нас в пучину региональных конфликтов."
 siam.48.a: "Примем предложение."
 siam.48.b: "[JAP.GetName] не мо[JAP.GetNameSuffixRuDzhetGut] выделить ресурсы."
 siam.49.t: "[JAP.GetName] соглаша[JAP.GetNameEndRuPresentEtYut]ся с нашей просьбой"
 siam.49.desc: "[JAP.GetNameDefCap] решил[JAP.GetAdjRuEnd] поддержать [ROOT.GetNameRuAcc] в борьбе. [JAP.GetAdjective]ие советники, снаряжение и припасы вскоре начнут прибывать, а [JAP.GetAdjRuLower]ие компании уже получили оговорённые концессии.\n\nХотя правительство празднует спасение нации, многие задумываются, сколько независимости придётся отдать ради этой помощи."
 siam.49.a: "Мы обзавелись союзником."
 SIA_japan_aid_request.4.t: "[JAP.GetName] отклоня[JAP.GetNameEndRuPresentEtYut] нашу просьбу"
 SIA_japan_aid_request.4.desc: "Власти [JAP.GetNameRuGen] отклонили нашу просьбу о военной помощи. Токио утверждает, что империя в данный момент не может выделить людей и ресурсы на нашу войну.\n\nБез иностранной помощи [ROOT.GetNameRuDat] придётся полагаться на собственные силы, чтобы пережить вторжение."
 SIA_japan_aid_request.4.a: "Значит, будем сражаться одни."
 siam_adc.1.t: "[FROM.GetNameDefCap] требу[FROM.GetNameEndRuPresentEtYut] освобождения [?var:SIA_adc_demand_country_to_be_released.GetNameRuGen]"
 siam_adc.1.desc: "[FROM.GetNameDef] направил[FROM.GetNameRuEndPast] нам официальную ноту, в которой [FROM.GetLeader] осудил[FROM.GetVerbGendEndA_RU] нашу дальнейшую оккупацию азиатских стран как неприемлемое нарушение их права на самоопределение. В сообщении подчёркивается, что Азия не охотничий трофей, чтобы её делить или распоряжаться ей по воле чужеземцев. Кроме того, там содержится требование немедленно вывести наши войска и восстановить независимое правительство в [?var:SIA_adc_demand_country_to_be_released.GetNameRuPrep].\n\nФормулировка не допускает двойного толкования: [FROM.GetNameDefCap] ожида[FROM.GetNameEndRuPresentEtYut] исполнения своего требования, а отказ с нашей стороны будет воспринят как намеренное оскорбление."
 siam_adc.1.a: "Мы дадим им свободу."
 siam_adc.1.b: "Они останутся под нашей оккупацией."
 siam_adc.2.t: "[FROM.GetNameDefCap] предлага[FROM.GetNameEndRuPresentEtYut] восстановить нашу независимость"
 siam_adc.2.desc: "После того, как [FROM.GetAdjRuLower]ое правительство приняло требования [SIA.GetNameRuGen] относительно будущего [ROOT.GetNameRuGen], [FROM.GetLeader] поставил[FROM.GetVerbGendEndA_RU] перед нам последний, но главный вопрос. Оккупационные власти готовятся покинуть страну и признать независимое [ROOT.GetAdjRuLower]ое правительство, если мы вновь выберем путь самостоятельности.\n\nНезависимость даст нам достоинство и свободу действий, но оставит нас один на один с необходимостью заново отстраивать государство без гарантий со стороны [FROM.GetNameRuGen]. Сохранение их протектората — путь более скромный, однако он может уберечь страну от новых бедствий в эти тревожные времена."
 siam_adc.2.a: "Мы станем независимым государством."
 siam_adc.2.b: "Мы останемся под [FROM.GetAdjRuLower]им протекторатом."
 siam_adc.3.t: "Правительство государства [?var:SIA_tag_that_was_released_due_to_sia_pressure.GetName] решает восстановить независимость"
 siam_adc.3.desc: "Правительство государства [?var:SIA_tag_that_was_released_due_to_sia_pressure.GetNameDef] выбирает независимость. После принятия решения о роспуске оккупационной администрации государство [var:SIA_tag_that_was_released_due_to_sia_pressure.GetNameDef] готовится занять свое место среди независимых стран мира."
 siam_adc.3.a: "Что их ждет впереди?"
 siam_adc.4.t: "[FROM.GetNameDefCap] отклоня[FROM.GetNameEndRuPresentEtYut] предложение о провозглашении независимости"
 siam_adc.4.desc: "Несмотря на предоставившуюся возможность обрести свободу, правительство [FROM.GetNameRuGen] отклонило предложение о немедленном провозглашении независимости. Их министры полагают, что страна пока не готова к тяготам полной независимости и предпочитают в данный момент сохранить сложившийся порядок."
 siam_adc.4.a: "В таком случае договоренность сохраняет свою силу."
 siam_adc.5.t: "[FROM.GetNameDefCap] отверга[FROM.GetNameEndRuPresentEtYut] наши требования"
 siam_adc.5.desc: "[FROM.GetName] дал[FROM.GetNameRuEndPast] ясно понять, что наши требования абсурдны. И это в лучшем случае. Они указывают на наши малочисленные войска как на доказательство того, что мы не в состоянии бросить вызов существующему положению дел."
 siam_adc.5.a: "Значит, мы им покажем."
 siam_dem_event_count: "Пока мы ждем, военные готовят кампанию по очернению нашей репутации"
 siam_dem.2.t: "Армия возражает"
 siam_dem.2.desc: "Во время закрытого заседания министров и высшего военного командования представитель армии резко осудил проект «Желтого досье». Он заявил, что его авторы слишком вольно рассуждают о государственном управлении, перераспределении и социальных обязательствах, уделяя при этом чересчур мало внимания дисциплине, собственности и тем тяготам, которые лягут на плечи офицерского корпуса и селян. По его мнению [ROOT.GetNameRuAcc] нельзя перестроить на основе пустых теорий в условиях, когда международная обстановка с каждым днем становится все более опасной."
 siam_dem.2.a: "Армия ясно обозначила свою позицию"
 siam_dem.3.t: "Публичное порицание"
 siam_dem.3.desc: "Разногласия вышли за пределы комитетских кабинетов. Газета, которую многие считают негласным рупором военных, опубликовала разгромную статью, посвященную «Желтому досье», представив его как чуждую стране программу, прикрытую патриотической риторикой. Ее редакция предупреждает, что этот документ ставит классовые тяготы выше национального единства, подрывает доверие к существующим институтам и порождает опасные ожидания среди рабочих и крестьян. Уже к вечеру содержание статьи стали обсуждать в казармах, конторах и чайных, а внутренний спор превратился в общественную полемику."
 siam_dem.3.a: "Критика ширится"
 siam_dem.4.t: "Пибун осуждает «Досье»"
 siam_dem.4.desc: "Не остался в стороне от спора и Пибун. Выступая перед своими сторонниками и офицерским корпусом, он открыто и с предельной жесткостью раскритиковал «Желтое досье» и назвал его коммунистическим по своей сути, какими бы словами ни пытались прикрывать его защитники. Он заявил, что любая программа, ставящая государство выше собственности, обещающая масштабные социальные преобразования и разжигающая волнения среди низших слоев населения, приносит в [ROOT.GetNameRuAcc] красную заразу просто под другим названием."
 siam_dem.4.a: "Его позиция не оставляет ни малейших сомнений"
 siam_dem.5.t: "Необходимо сформировать правительство"
 siam_dem.5.desc: "Старый режим повергнут, и «Свободный Таиланд» гордо стоит на его руинах. Но триумф — это ещё не правительство, и объединившаяся против Пибуна коалиция далеко не единодушна в том, кто должен занять его место. В кулуарах обсуждаются три кандидатуры: совесть сопротивления Приди Паномионг, умеренный и не вызывающий ни у кого неприязни Куанг Апайвонг и фельдмаршал Пин Чунхаван, ставленник офицеров, которые ожидают места во власти. От того, кого мы выберем, зависит то, каким станет послевоенное устройство страны."
 siam_dem.5.a: "Государство возглавит Приди Паномионг. Сопротивление заслужило на это право."
 siam_dem.5.b: "Куанг Апайвонг — его кандидатура устроит все фракции."
 siam_dem.5.c: "Фельдмаршал Пин Чунхаван. Армия получит своё место во власти."
 ###################
 #### AUSTRALIA ####
 ###################
 AST_election_events.1.t.a: "Победа за ОПА!"
 AST_election_events.1.t.b: "Победа за АЛП!"
 AST_election_events.1.desc.a: "Голоса подсчитаны: на выборах победила Объединенная партия Австралии.\n\nТеперь ей предстоит сформировать правительство, а затем в течение трех лет доказывать, что доверие граждан к ее представителям было вполне заслуженным."
 AST_election_events.1.desc.b: "Голоса подсчитаны: на выборах победила Австралийская лейбористская партия.\n\nТеперь ей предстоит сформировать правительство, а затем в течение трех лет доказывать, что доверие граждан к ее представителям было вполне заслуженным."
 AST_election_events.1.a: "Такова воля народа."
 AST_election_events.2.t: "На полпути к федеральным выборам"
 AST_election_events.2.desc: "Объединённая партия Австралии находится у власти с 1931 года. Под её руководством страна преодолела Великую депрессию и избавилась от антидемократических настроений. Благодаря стабильности высших кругов, консервативным взглядам и верности Великобритании ОПА упрочила своё положение и теперь может с большей вероятностью победить на очередных выборах. Однако у конкурентов другое мнение на этот счёт…\n\nАвстралийская лейбористская партия ещё не вполне восстановилась после вотума недоверия 1931 года, из-за которого потеряла власть, однако после подавления коммунистического движения её влияние среди рабочего класса быстро растёт. АЛП стремится представлять интересы всех жителей страны — а потому придерживается иных взглядов на империализм и взаимоотношения с метрополией. Лейбористы считают, что нужды Австралии должны стоять на первом месте, а интересы других стран могут и подождать.\n\nДо следующих федеральных выборов осталось полтора года. Если ОПА хочет сохранить народную поддержку и удержать власть, лидерам партии необходимо ускорить проведение реформ, — иначе АЛП вновь опередит её."
 AST_election_events.2.a: "ОПА проведёт свои последние реформы."
 AST_election_events.2.b: "Агитационное турне по Австралии увеличит поддержку АЛП."
 AST_election_events.3.t: "$AST_election_season_cat$"
 AST_election_events.3.desc: "$AST_election_season_cat_desc$"
 AST_election_events.3.a: "Началось…"
 AST_diplomatic_events.1.t: "Австралийский пакт о ненападении"
 AST_diplomatic_events.1.desc: "В рамках недавних дипломатических усилий австралийское правительство стремится подписать соглашения о ненападении с несколькими избранными азиатскими странами; и мы — одна из них. Что значит эта попытка избежать войны? Оторванность австралийских чиновников от реальности или же благородная невинность? Отчасти это предстоит решить нам.\n\nТак что, заключим с [AST.GetNameRuInst] пакт о ненападении?"
 AST_diplomatic_events.1.a: "Разумеется, нет."
 AST_diplomatic_events.1.b: "Да, конечно."
 AST_diplomatic_events.2.t: "Отказ от Тихоокеанского пакта"
 AST_diplomatic_events.2.desc: "Делегация, направленная на территорию [FROM.GetNameRuGen], телеграфировала ответ на наше предложение заключить пакт о ненападении. Мы знали, что у этой инициативы далеко идущие последствия, поэтому для нас не стало неожиданностью, что [FROM.GetLeader] ответил[FROM.GetVerbGendEndA_RU] нам отказом."
 AST_diplomatic_events.2.a: "По крайней мере, это была достойная попытка."
 AST_diplomatic_events.3.t: "Да здравствует Тихоокеанский пакт"
 AST_diplomatic_events.3.desc: "Делегация, направленная на территорию [FROM.GetNameRuGen], телеграфировала ответ на наше предложение заключить пакт о ненападении. К нашей радости, [FROM.GetLeader] высоко ценит нашу инициативу и соглашается поставить на ней свою печать."
 AST_diplomatic_events.3.a: "Великолепно!"
 AST_diplomatic_events.4.t: "Австралия требует Сингапур"
 AST_diplomatic_events.4.desc: "[AST.GetNameDefCap] давно подверга[AST.GetNameEndRuPresentEtYut] сомнению надежность сингапурской стратегии. По словам австралийских властей, они не до конца уверены, что мы придем им на помощь в случае войны в Тихом океане. Передача [AST.GetNameRuDat] обязанностей по управлению военно-морскими силами в Тихом океане снимет часть ответственности с британцев, но при этом возложит ее на плечи австралийцев.\n\nЕсли мы отдадим Сингапур, пойдет ли нашим тихоокеанским подданным на пользу усиление австралийского влияния в регионе?"
 AST_diplomatic_events.4.a: "Да, пойдет."
 AST_diplomatic_events.4.b: "Сингапур останется нашим."
 AST_diplomatic_events.5.t: "Британия соглашается на наше предложение"
 AST_diplomatic_events.5.desc: "Британцы соглашаются передать Сингапур под австралийское управление. Это положит конец устаревшей сингапурской стратегии, и мы теперь сами будем отвечать за свою оборону."
 AST_diplomatic_events.5.a: "Стратегия изменилась!"
 AST_diplomatic_events.5.a.tt: "§YСингапур§!:\n  Под контролем §YАвстралии§!.\n  Во владении §YАвстралии§!.\n§YОстров Рождества§!:\n  Под контролем §YАвстралии§!.\n  Во владении §YАвстралии§!.\n§YКокосовые острова§!:\n  Под контролем §YАвстралии§!.\n  Во владении §YАвстралии§!."
 AST_diplomatic_events.6.t: "Британия отклоняет наше предложение"
 AST_diplomatic_events.6.desc: "Британия отказывается передать Сингапур под австралийское управление. Статус-кво останется неизменным."
 AST_diplomatic_events.6.a: "Мы будем придерживаться сингапурской стратегии."
 AST_diplomatic_events.7.t: "[AST.GetName] запрашива[AST.GetNameEndRuPresentEtYut] помощь"
 AST_diplomatic_events.7.desc: "[AST.GetNameDefCap] жела[AST.GetNameEndRuPresentEtYut] получить от союзников оборудование для своих военных нужд и обраща[AST.GetNameEndRuPresentEtYut]ся к нам за помощью в организации необходимых поставок. Можем ли мы выделить [AST.GetNameRuDat] необходимые конвои?"
 AST_diplomatic_events.7.a: "Да, можем."
 AST_diplomatic_events.7.b: "Нет, не можем."
 AST_diplomatic_events.8.t: "[USA.GetName] соглаша[USA.GetNameEndRuPresentEtYut]ся нам помочь"
 AST_diplomatic_events.8.desc: "[USA.GetNameDefCap] соглаша[USA.GetNameEndRuPresentEtYut]ся выделить ряд конвоев, чтобы оказать [AST.GetNameRuDat] помощь со снабжением."
 AST_diplomatic_events.8.a: "Они нам очень пригодятся!"
 AST_diplomatic_events.9.t: "[USA.GetName] отклоня[USA.GetNameEndRuPresentEtYut] нашу просьбу"
 AST_diplomatic_events.9.desc: "[USA.GetNameDefCap] не располага[USA.GetNameEndRuPresentEtYut] необходимым количеством конвоев, поэтому не может оказать [AST.GetNameRuDat] помощь со снабжением."
 AST_diplomatic_events.9.a: "Придется разбираться со снабжением самостоятельно."
 AST_diplomatic_events.10.t: "Военный альянс"
 AST_diplomatic_events.10.desc: "[AST.GetNameDefCap] высоко оценива[AST.GetNameEndRuPresentEtYut] поддержку [USA.GetNameRuGen] и предлага[AST.GetNameEndRuPresentEtYut] сформировать международную военную коалицию. Объединив силы, наши державы смогут помогать друг другу в современных и будущих конфликтах."
 AST_diplomatic_events.10.a: "Нам нужно согласиться."
 AST_diplomatic_events.10.b: "[USA.GetNameDefCap] буд[USA.GetNameEndRuPresentEtUt] сильнее без них."
 AST_diplomatic_events.11.t: "Военный альянс"
 AST_diplomatic_events.11.desc: "[USA.GetNameDefCap] объединил[USA.GetNameRuEndPast] с нами силы. Образовав альянс «[AST.GetFactionName]», [AST.GetName] и [USA.GetName] будут помогать друг другу в военных конфликтах."
 AST_diplomatic_events.11.a: "Враги будут нас бояться."
 AST_diplomatic_events.12.t: "Предложение об альянсе отвергнуто"
 AST_diplomatic_events.12.desc: "[USA.GetNameDefCap] не пожелал[USA.GetNameRuEndPast] объединять с нами силы. [AST.GetNameDefCap] и [USA.GetName] продолжат вести войны независимо друг от друга."
 AST_diplomatic_events.12.a: "Мы справимся и без них."
 AST_diplomatic_events.13.t: "Статья 6"
 AST_diplomatic_events.13.desc: "Новая Зеландия отказалась участвовать в процессе объединения бывших австралийских колоний, однако в нашей конституции она по-прежнему значится как потенциальный член Австралийского союза и может вступить в него в любое время.\n\nТеперь [AST.GetName] утвержда[AST.GetNameEndRuPresentEtYut], что текущая мировая ситуация требует единства, а потому [NZL.GetNameRuDat] нужно перейти под контроль австралийских властей. Будем ли мы проводить референдум по этому вопросу?"
 AST_diplomatic_events.13.a: "Да, будем."
 AST_diplomatic_events.13.a.tt: "Будет проведен референдум, который может привести к §Rаннексии§! §Y[NZL.GetNameRuGen]§!"
 AST_diplomatic_events.13.b: "Это исключено!"
 AST_diplomatic_events.14.t: "[NZL.GetNameDefCap] — австралийский штат"
 AST_diplomatic_events.14.desc: "По итогам недавно проведенного референдума [NZL.GetName] решил[NZL.GetNameRuEndPast] принять статью 6 Австралийской конституции. Новозеландцы согласились с тем, что в составе [AST.GetNameRuGen] им будет безопаснее."
 AST_diplomatic_events.14.a: "Австралия расширяется."
 AST_diplomatic_events.15.t: "Новозеландская общественность против"
 AST_diplomatic_events.15.desc: "По итогам недавно проведенного референдума [NZL.GetName] решил[NZL.GetNameRuEndPast] не принимать статью 6 Австралийской конституции. [NZL.GetNameDefCap] остан[NZL.GetNameEndRuPresentEtUt]ся независимым государством."
 AST_diplomatic_events.15.a: "Австралия останется прежней."
 AST_diplomatic_events.16.t: "Сопротивление властей [NZL.GetNameRuGen]"
 AST_diplomatic_events.16.desc: "Несмотря на давление со стороны Австралии, [NZL.GetName] решил[NZL.GetNameRuEndPast] не проводить референдум о принятии статьи 6 Австралийской конституции. [NZL.GetNameDefCap] остан[NZL.GetNameEndRuPresentEtUt]ся независимым государством."
 AST_diplomatic_events.16.a: "Австралия останется прежней."
 AST_diplomatic_events.17.t: "Партнерство с Австралией"
 AST_diplomatic_events.17.desc: "Враг наступает с севера. Рано или поздно он окажется у нас на пороге — по крайней мере, так утверждают австралийские власти. Чтобы создать единую преграду на его пути, [AST.GetNameDefCap] требу[AST.GetNameEndRuPresentEtYut] либо полного контроля над [INS.GetNameRuInst], либо как минимум права на проход войск по территории нашей державы."
 AST_diplomatic_events.17.a: "Признаем власть Австралии."
 AST_diplomatic_events.17.a.tt: "§Y[INS.GetNameDefCap]§! стан[INS.GetNameEndRuPresentEtUt] §Yмарионеткой§! §Y[AST.GetNameRuGen]§!."
 AST_diplomatic_events.17.b: "Предоставим право на проход войск."
 AST_diplomatic_events.17.b.tt: "§Y[INS.GetNameDefCap]§! прим[INS.GetNameEndRuPresentEtUt] закон, предоставляющий §Y[AST.GetNameRuGen]§! §Yправо на проход войск§!."
 AST_diplomatic_events.17.c: "Мы не хотим ни того ни другого."
 AST_diplomatic_events.18.t: "[INS.GetNameDefCap] уступа[INS.GetNameEndRuPresentEtYut] австралийским требованиям"
 AST_diplomatic_events.18.desc: "[INS.GetName] уступил[INS.GetNameRuEndPast] нашим требованиям. Сотрудничество укрепит обороноспособность обеих держав."
 AST_diplomatic_events.18.a: "Прекрасно!"
 AST_diplomatic_events.19.t: "[INS.GetNameDefCap] отказыва[INS.GetNameEndRuPresentEtYut]ся"
 AST_diplomatic_events.19.desc: "[INS.GetNameDefCap] игнориру[INS.GetNameEndRuPresentEtYut] наши требования. Каждая из стран будет самостоятельно заботиться о своей обороне."
 AST_diplomatic_events.19.a: "[AST.GetNameDefCap] смо[AST.GetNameSuffixRuDzhetGut] справиться и без них."
 AST_diplomatic_events.20.t: "Приглашение в британский военный кабинет"
 AST_diplomatic_events.20.desc: "[GET_AST_BWC_COUNT][ENG.GetNameDefCap] приглаша[ENG.GetNameEndRuPresentEtYut] австралийского премьер-министра принять участие в работе британского кабинета военного времени. Угрожающая ситуация в мире побуждает Великобританию к стратегическому и военному сотрудничеству с союзниками.\n\nНо у Австралии есть и свои заботы. Готовы ли мы пожертвовать временем премьер-министра ради того, чтобы угодить англичанам?"
 AST_diplomatic_events.20.a: "[AST.GetLeader] отправится в Британию."
 AST_diplomatic_events.20.b: "Он нужнее здесь."
 AST_bwc_count_2: "[ENG.GetLeader] во второй раз требует, чтобы [AST.GetLeader] прибыл[AST.GetVerbGendEndA_RU] в Британию: по [ENG.GetLeader.GetHerHis] словам, только наше тесное сотрудничество позволит нам преодолеть нашу общую беду.\n\n"
 AST_bwc_count_3: "И вновь власти [ENG.GetNameRuGen] ждут, что [AST.GetLeader] приедет из-за океана, чтобы поддержать совместную работу Содружества. Впрочем, поток подобных просьб иссякнет, если мы ясно дадим нашим партнёрам понять, в чём заключаются наши приоритеты: в общей борьбе или в решении наших собственных проблем.\n\n"
 AST_bwc_accept_effect_tt: "§YЭффекты от принятия приглашения 3 раза:§!"
 AST_bwc_accept_tt: "Принять приглашение §Y[?var:AST_bwc_accept]§!/§Y3§! раза"
 AST_diplomatic_events.22.t: "Вклад в работу британского военного кабинета"
 AST_diplomatic_events.22.desc: "В минувшем году премьер-министр Австралии регулярно участвовал в работе британского военного кабинета. [AST.GetNameRuDat] пришлось заплатить за это определенную цену, но в конечном итоге наша держава выиграла от военного партнерства с англичанами."
 AST_diplomatic_events.22.a: "Наши затраты окупились."
 AST_diplomatic_events.23.t: "[ENG.GetLeader] утрачивает интерес к Австралии"
 AST_diplomatic_events.23.desc: "[ENG.GetNameDefCap] несколько раз приглашал[ENG.GetNameRuEndPast] австралийского премьер-министра участвовать в работе британского кабинета военного времени, но после череды отказов [ENG.GetLeader] больше не считает нужным продолжать попытки."
 AST_diplomatic_events.23.a: "Это вполне можно понять."
 AST_diplomatic_events.24.t: "Смена руководства"
 AST_diplomatic_events.24.desc: "Премьер-министр Австралии приобрёл значительное влияние среди военных Британского Содружества. Совершая регулярные визиты в Лондон, Роберт Мензис настолько впечатлил англичан, что затмил своего британского коллегу. Теперь британский кабинет министров вынуждает премьера [ENG.GetNameRuGen] уйти в отставку, чтобы отдать его место Мензису.\n\nДаже если [AST.GetName] потеря[AST.GetNameEndRuPresentEtYut] своего премьера, взамен правительство страны сможет рассчитывать на полную лояльность со стороны сюзерена, ведь теперь во главе Великобритании будет стоять австралиец. Австралии нужно укрепить государственную власть, и никто другой не желает этого так сильно, как Мензис."
 AST_diplomatic_events.24.a: "Ветра меняют направление."
 AST_diplomatic_events.25.t: "Под руководством Канберры"
 AST_diplomatic_events.25.desc: "Растущая напряженность между тихоокеанскими державами вызывает все больше тревоги, а Британия занята войнами в других частях света, так что помощи ждать не от кого. По крайней мере, так утвержда[AST.GetNameEndRuPresentEtYut] [AST.GetName].\n\nЭта страна хочет восстановить Британское Содружество, объединив государства Тихого и Индийского океанов под непосредственной властью Канберры. Мы согласны?"
 AST_diplomatic_events.25.a: "Конечно. Централизация власти укрепит безопасность Тихоокеанского региона."
 AST_diplomatic_events.25.b: "Разумеется, нет!"
 AST_diplomatic_events.26.t: "Тихоокеанское Содружество"
 AST_diplomatic_events.26.desc: "[ENG.GetNameDefCap] ответил[ENG.GetNameRuEndPast] согласием. Централизация власти укрепит безопасность всего региона. Британские территории на Тихом океане перешли под наш контроль."
 AST_diplomatic_events.26.a: "Державы Тихого океана объединили силы."
 AST_diplomatic_events.27.t: "Британия не соглашается на наше требование"
 AST_diplomatic_events.27.desc: "[ENG.GetNameDefCap] ответил[ENG.GetNameRuEndPast] отказом. Тихоокеанские территории останутся под британским контролем, и эта разобщенность не пойдет на пользу региону."
 AST_diplomatic_events.27.a: "Австралия выстоит в любом случае."
 AST_diplomatic_events.28.t: "[ENG.GetLeader] вешает трубку"
 AST_diplomatic_events.28.desc: "По итогам телефонных переговоров, которые провели [ENG.GetLeader] и [AST.GetLeader], Австралия несколько укрепила свои позиции, но настойчивость нашего премьера вызвала недовольство англичан."
 AST_diplomatic_events.28.a: "Австралия должна сама заботиться о своей обороне."
 AST_diplomatic_events.29.t: "Британия приходит на помощь"
 AST_diplomatic_events.29.desc: "Попытки Австралии убедить [ENG.GetNameRuAcc] в неизбежности конфликта с [JAP.GetNameRuInst] убедили англичан поддержать наши проекты строительства укреплений."
 AST_diplomatic_events.29.a: "Помощь нам пригодится, но войну с Японией она не предотвратит."
 AST_diplomatic_events.30.t: "Австралия требует права на ресурсы"
 AST_diplomatic_events.30.desc: "Индокитай привлекает агрессивных захватчиков не только своими территориями, но и ресурсами. Во вражеских руках его богатства продлят войну, а в австралийских — помогут ее остановить. По крайней мере, так утверждают сами австралийцы.\n\nПредоставим ли мы им право распоряжаться ресурсами нашей территории?"
 AST_diplomatic_events.30.a: "Да, предоставим."
 AST_diplomatic_events.30.b: "Эти ресурсы не для [AST.GetNameRuGen]."
 AST_diplomatic_events.31.t: "[FROM.GetNameDefCap] предоставля[FROM.GetNameEndRuPresentEtYut] [AST.GetNameRuDat] права на ресурсы"
 AST_diplomatic_events.31.desc: "Индокитай привлекает агрессивных захватчиков не только территориями, но и ресурсами. Во вражеских руках его богатства продлят войну, а в австралийских — помогут ее остановить. По крайней мере, так утверждают сами австралийцы.\n\n[ROOT.OVERLORD.GetNameDefCap] уступил[ROOT.OVERLORD.GetNameRuEndPast] их требованиям."
 AST_diplomatic_events.31.a: "Это вне нашей власти."
 AST_diplomatic_events.32.t: "[FROM.GetNameDefCap] предоставля[FROM.GetNameEndRuPresentEtYut] права на ресурсы"
 AST_diplomatic_events.32.desc: "Разделяя наше мнение о том, что богатства Индокитая лучше передать Австралии, [FROM.GetNameDefCap] предоставля[FROM.GetNameEndRuPresentEtYut] нам права на ресурсы."
 AST_diplomatic_events.32.a: "Они нам очень пригодятся."
 AST_diplomatic_events.33.t: "[FROM.GetNameDefCap] отказыва[FROM.GetNameEndRuPresentEtYut]ся предоставить права на ресурсы"
 AST_diplomatic_events.33.desc: "Отвергая нашу идею, что богатства Индокитая лучше передать Австралии, [FROM.GetNameDefCap] отказыва[FROM.GetNameEndRuPresentEtYut]ся предоставить нам права на ресурсы."
 AST_diplomatic_events.33.a: "Будем надеяться, что эти ресурсы не достанутся врагу."
 AST_diplomatic_events.34.t: "[AST.GetNameDefCap] требу[AST.GetNameEndRuPresentEtYut] поделить тихоокеанские территории"
 AST_diplomatic_events.34.desc: "[AST.GetNameDefCap] предлага[AST.GetNameEndRuPresentEtYut] договор, способный предотвратить возможные конфликты между нашими державами еще до их начала. Раздел тихоокеанских территорий позволит нам планировать будущую экспансию, не мешая друг другу."
 AST_diplomatic_events.34.a: "Это вполне разумные условия."
 AST_diplomatic_events.34.b: "[JAP.GetNameDefCap] буд[AST.GetNameEndRuPresentEtUt] расширяться так, как посчита[AST.GetNameEndRuPresentEtYut] нужным."
 AST_diplomatic_events.35.t: "Тихоокеанский регион поделен"
 AST_diplomatic_events.35.desc: "[AST.GetNameDefCap] и [JAP.GetNameDefCap] договорились, на какие территории Тихоокеанского региона сможет претендовать каждая из стран. Будем надеяться, что это предотвратит будущие конфликты между двумя державами."
 AST_diplomatic_events.35.a: "Вопрос решен!"
 AST_diplomatic_events.36.t: "Судьба региона решится сама"
 AST_diplomatic_events.36.desc: "Японское правительство отказалось делить с нами Тихоокеанский регион. [JAP.GetNameDefCap] буд[AST.GetNameEndRuPresentEtUt] расширяться так, как посчита[AST.GetNameEndRuPresentEtYut] нужным."
 AST_diplomatic_events.36.a: "Австралия тоже."
 AST_diplomatic_events.37.t: "Передача власти"
 AST_diplomatic_events.37.desc: "По неизвестной причине правительство [AST.GetNameRuGen] решило передать наши земли [JAP.GetNameRuDat]. За кулисами назревает что-то зловещее; рано или поздно мир узнает, что именно."
 AST_diplomatic_events.37.a: "Нам нечего сказать по этому вопросу."
 AST_diplomatic_events.38.t: "Науруанский договор"
 AST_diplomatic_events.38.desc: "По итогам Первой мировой войны ряд немецких территорий в Тихом океане перешел под контроль Австралии, но теперь у нас есть шанс их вернуть. Например, остров Науру.\n\n[AST.GetFascistParty] придерживается близких нам ценностей и стремится к полному отделению [AST.GetNameRuGen] от [ENG.GetNameRuGen]. Поскольку эта партия пока не обладает достаточным влиянием, ее представители обратились к нам за поддержкой в надежде в кратчайшие сроки укрепить свое положение. Когда они получат всю полноту власти, лидеры этой партии обещают вернуть нам остров Науру — при условии, что мы предоставим им гарантии при обретении независимости."
 AST_diplomatic_events.38.a: "Мы вернем свои территории!"
 AST_diplomatic_events.38.b: "Мы не можем давать невыполнимых обещаний."
 AST_diplomatic_events.39.t: "[GER.GetNameDefCap] подписыва[FROM.GetNameEndRuPresentEtYut] Науруанский договор"
 AST_diplomatic_events.39.desc: "[GER.GetNameDefCap] и [AST.GetFascistParty] договорились о совместных действиях, целью которых должно стать обретение [AST.GetNameRuInst] независимости. Поскольку [AST.GetFascistParty] пока не обладает достаточным политическим влиянием, [GER.GetNameDef] предоставит партии грант для укрепления ее положения. А когда никто не будет стоять у нас на пути, условия соглашения будут выполнены в полном объеме."
 AST_diplomatic_events.39.a: "Великолепно!"
 AST_diplomatic_events.40.t: "Крах Науруанского договора"
 AST_diplomatic_events.40.desc: "Не желая давать невыполнимых обещаний, [GER.GetNameDef] отказыва[GER.GetNameEndRuPresentEtYut]ся поддержать наш приход к власти. В результате Науруанский договор прекращает свое существование, едва вступив в силу, а [AST.GetFascistParty] теперь самостоятельно будет нести бремя своих политических амбиций."
 AST_diplomatic_events.40.a: "[AST.GetFascistParty] справится и без поддержки немцев."
 AST_diplomatic_events.41.t: "Науру возвращается в Германию"
 AST_diplomatic_events.41.desc: "Придя к власти, [AST.GetFascistParty] выполняет свою часть договора. Теперь Науру принадлежит [GER.GetNameRuDat], а мы должны гарантировать независимость Австралии."
 AST_diplomatic_events.41.a: "Так тому и быть."
 AST_diplomatic_events.42.t: "[AST.GetFascistParty] нарушает обещание"
 AST_diplomatic_events.42.desc: "У обещаний есть один фатальный недостаток — их можно нарушить. Придя к власти, [AST.GetFascistParty] решает не только оставить себе Науру, но и овладеть прочими островами в Тихом океане.\n\nНаши прежние тихоокеанские территории по-прежнему останутся вне нашего контроля, как и до заключения Науруанского договора, а если мы решим изменить положение вещей, придется воевать."
 AST_diplomatic_events.42.a: "Время покажет, к чему это приведет."
 AST_diplomatic_events.43.t: "[AST.GetNameDefCap] требу[AST.GetNameEndRuPresentEtYut] Юго-Восточную Азию"
 AST_diplomatic_events.43.desc: "[AST.GetName] заявля[AST.GetNameEndRuPresentEtYut], что [AST.GetAdjective]ое расширение на север позволит расширить совместное влияние на дипломатические процессы и конфликты в Юго-Восточной Азии. И пусть формально это не требование, [AST.GetLeader] уже намекнул[AST.GetVerbGendEndA_RU], что отказ не будет принят."
 AST_diplomatic_events.43.a: "Поскольку наше внимание сейчас сосредоточено на других вопросах, вероятно, так будет даже лучше."
 AST_diplomatic_events.43.b: "В любом случае они получат отказ."
 AST_diplomatic_events.44.t: "Передача Юго-Восточной Азии"
 AST_diplomatic_events.44.desc: "[ENG.GetNameDefCap] мудро решил[ENG.GetNameRuEndPast] передать нам свои территории в Юго-Восточной Азии. С расширением австралийских границ растет и наше влияние, и теперь лишь вопрос времени, когда весь мир окажется у наших ног."
 AST_diplomatic_events.44.a: "Многообещающе."
 AST_diplomatic_events.45.t: "Юго-Восточная Азия останется за прежним хозяином"
 AST_diplomatic_events.45.desc: "[ENG.GetNameDefCap] отказал[ENG.GetNameRuEndPast] нам в передаче своих территорий в Юго-Восточной Азии. Однако привлекательность идеи о господстве над регионом нам по-прежнему очевидна. И пусть мы не смогли заполучить его дипломатическим путем, мы все еще можем взять его силой."
 AST_diplomatic_events.45.a: "Да, можно."
 #AST_diplomatic_events.46.t was removed
 AST_diplomatic_events.47.t: "Разделение бремени"
 AST_diplomatic_events.47.desc: "Несмотря на недавний выход из Британского Содружества, [AST.GetName] предлага[AST.GetNameEndRuPresentEtYut] военное сотрудничество. Правительство [AST.GetNameRuGen] утверждает, что разделение бремени будет выгодно и [ENG.GetNameRuDat], учитывая, насколько разбросаны ее силы по всему миру."
 AST_diplomatic_events.47.a: "Мы согласимся."
 AST_diplomatic_events.47.b: "Мы постоим за себя сами."
 AST_diplomatic_events.48.t: "Британско-австралийский договор"
 AST_diplomatic_events.48.desc: "[ENG.GetNameDefCap] соглаша[ENG.GetNameEndRuPresentEtYut]ся подписать договор о ненападении, тем самым закладывая фундамент для сотрудничества в военной сфере."
 AST_diplomatic_events.48.a: "Это начало новой эпохи в наших отношениях."
 AST_diplomatic_events.49.t: "Неподписанный договор"
 AST_diplomatic_events.49.desc: "[ENG.GetNameDefCap] отказыва[ENG.GetNameEndRuPresentEtYut]ся подписать договор о ненападении. Наша попытка наладить военное сотрудничество между двумя странами провалилась, и теперь нам придется вести внешнюю экспансию в одиночку."
 AST_diplomatic_events.49.a: "Что ж, так тому и быть."
 AST_diplomatic_events.50.t: "Австралийский тихоокеанский гарнизон"
 AST_diplomatic_events.50.desc: "Несмотря на то, что безопасность Юго-Восточной Азии и Тихоокеанского региона отвечает интересам Британии, данный регион расположен далеко от Британских островов, и [FROM.GetName] прекрасно это осозна[FROM.GetNameEndRuPresentEtYut]. В обмен на нашу помощь со снабжением [FROM.GetName] предлага[FROM.GetNameEndRuPresentEtYut] принять на себя руководство обороной территории, что позволит нам сосредоточиться на других проблемах."
 AST_diplomatic_events.50.a: "Помощь [FROM.GetNameRuGen] будет как нельзя кстати."
 AST_diplomatic_events.50.b: "Регион и так находится достаточно близко."
 AST_diplomatic_events.51.t: "Тихоокеанский гарнизон [ENG.GetNameRuGen]"
 AST_diplomatic_events.51.desc: "Правительство [FROM.GetNameRuGen] согласно с тем, что защита вод Юго-Восточной Азии ляжет на наши плечи. В обмен на британские поставки топлива [ROOT.GetName] займ[ROOT.GetNameEndRuPresentEtUt]ся укреплением морского господства в соседних водах."
 AST_diplomatic_events.51.a: "Воды будут принадлежать нам!"
 AST_diplomatic_events.52.t: "Собственный тихоокеанский гарнизон Австралии"
 AST_diplomatic_events.52.desc: "Правительству [FROM.GetNameRuGen] не нужна помощь в деле защиты вод Юго-Восточной Азии. Тем не менее, независимо от британской поддержки, [ROOT.GetName] займ[ROOT.GetNameEndRuPresentEtUt]ся укреплением морского господства в соседних водах."
 AST_diplomatic_events.52.a: "Воды будут принадлежать нам!"
 AST_diplomatic_events.53.t: "Виши, прочь из Африки"
 AST_diplomatic_events.53.desc: "[AST.GetName] полага[AST.GetNameEndRuPresentEtYut], что падение режима Виши или его сотрудничество с [ENG.GetNameRuInst] является одной из ключевых целей Лондона, и потому предлага[AST.GetNameEndRuPresentEtYut] присоединиться к операции против французских владений в Африке до тех пор, пока Вишистская Франция не сдастся. Хотя за этим предложением могут скрываться собственные интересы Канберры, усиление союзного присутствия в регионе, безусловно, принесет нам выгоду.\n\nЕсли мы дадим разрешение, [AST.GetName] начн[AST.GetNameEndRuPresentEtUt] переговоры с режимом Виши о мирной передаче его колоний и размещении австралийских гарнизонов на их территории."
 AST_diplomatic_events.53.a: "Мы приветствуем их поддержку."
 AST_diplomatic_events.53.b: "Слишком велик риск, что [AST.GetName] использу[AST.GetNameEndRuPresentEtYut] это против нас."
 AST_diplomatic_events.54.t: "На помощь союзникам"
 AST_diplomatic_events.54.desc: "Правительство [ENG.GetNameRuGen] согласно с тем, что увеличение союзного присутствия в Африке отвечает интересам Содружества.\n\nМы инициируем переговоры с режимом Виши о мирной передаче его колоний и размещении австралийских гарнизонов на их территории."
 AST_diplomatic_events.54.a: "Так тому и быть."
 AST_diplomatic_events.55.t: "С разрешения либо без такового"
 AST_diplomatic_events.55.desc: "Правительство [ENG.GetNameRuGen] отказалось от австралийской помощи в Африке и планирует самостоятельно разобраться с режимом Виши. Тем не менее, так легко мы от своих амбиций не откажемся.\n\nУстановление контроля над африканскими владениями Виши поставило бы Австралию на один уровень с Британским Содружеством. Мы должны добиваться этого вопреки желаниям [ENG.GetNameRuGen], даже если придется прибегнуть к силе."
 AST_diplomatic_events.55.a: "Мы продолжим экспансию."
 AST_diplomatic_events.56.t: "[AST.GetName] требу[AST.GetNameEndRuPresentEtYut] передачи африканских территорий"
 AST_diplomatic_events.56.desc: "Выступая от имени [ENG.GetNameRuGen], [AST.GetName] требу[AST.GetNameEndRuPresentEtYut] от нас передачи африканских территорий.\n\nПравительство [ENG.GetNameRuGen] намерено расширять британское господство в Африке, и если мы не согласимся на австралийскую оккупацию, они прибегнут к военной силе."
 AST_diplomatic_events.56.a: "Во избежание войны мы передадим территории."
 AST_diplomatic_events.56.b: "Что ж, тогда пусть присылают свои войска."
 AST_diplomatic_events.57.t: "Режим Виши передает африканские территории"
 AST_diplomatic_events.57.desc: "Режим Виши согласился передать требуемые африканские территории и позволил австралийскому гарнизону взять регион под свой контроль."
 AST_diplomatic_events.57.a: "Экспансия в Африке продолжается!"
 AST_diplomatic_events.58.t: "Режим Виши отказывается передать территории [AST.GetNameRuDat]"
 AST_diplomatic_events.58.desc: "Режим Виши отказывается передать нам африканские территории. Однако это было не предложение, а требование.\n\nМы все равно захватим регион, в передаче которого нам было отказано, даже если придется задействовать войска."
 AST_diplomatic_events.58.a: "Мирным путем или нет — [AST.GetName] продолжа[AST.GetNameEndRuPresentEtYut] свою экспансию."
 #AST_diplomatic_events.59 was removed
 #AST_diplomatic_events.60 was removed
 #AST_diplomatic_events.61 was removed
 AST_diplomatic_events.62.t: "Антибританский договор?"
 AST_diplomatic_events.62.desc: "Австралийские дипломаты обратились к нам с предложением заключить антибританский договор. Он предусматривает оказание [AST.GetNameRuInst] помощь в возвращении контролируемой британцами Северной Ирландии без необходимости нашего прямого вмешательства.\n Взамен, в случае успеха, мы должны будем войти в их альянс и поддержать в будущей войне против Британии.\nНесмотря на привлекательность объединения с северной частью острова, нам следует крепко подумать, готовы ли мы к столь серьезному ухудшению отношений с более могущественным соседом, а самое главное способны ли мы добиться победы в случае войны. В противном случае вся Ирландия рискует вновь превратиться в британскую колонию."
 AST_diplomatic_events.62.a: "Объединение не может ждать! Подписать договор!"
 AST_diplomatic_events.62.b: "Это слишком опасно."
 AST_diplomatic_events.63.t: "Ирландия отказывается!"
 AST_diplomatic_events.63.desc: "Ирландия отказалась подписывать Антибританский договор."
 AST_diplomatic_events.63.a: "В таком случае Ирландия останется разделенной."
 AST_diplomatic_events.64.t: "Ирландия дает свое согласие!"
 AST_diplomatic_events.64.desc: "Ирландия соглашается подписать Антибританский договор."
 AST_diplomatic_events.64.a: "Вперед, на Белфаст!."
 AST_diplomatic_events.65.t: "[FROM.GetName] оказыва[FROM.GetNameEndRuPresentEtYut] поддержку" ### Support for the Chinese Communists - Sends event from AST to PRC offering support
 AST_diplomatic_events.65.desc: "[FROM.GetCommunistParty] наращивает влияние в [FROM.GetNameRuPrep], и это уже приносит свои плоды. Например, недавно [FROM.GetAdjRuLower]ие представители прибыли в Китай и сообщили, что они готовы направить к нам на помощь своих добровольцев. Вдобавок эти бойцы привезут с собой дополнительное снаряжение для наших войск."
 AST_diplomatic_events.65.a: "Мы рады сотрудничать с нашими [FROM.GetAdjRuLower]ими товарищами."
 #AST_diplomatic_events.65.b: "They should focus on their own revolution"
 AST_diplomatic_events.66.t: "[FROM.GetName] выража[FROM.GetNameEndRuPresentEtYut] благодарность за поддержку" ### Support for the Chinese Communists - They accept
 AST_diplomatic_events.66.desc: "[FROM.GetLeader] через своих представителей выразил[FROM.GetVerbGendEndA_RU] нам благодарность за отправку добровольцев и военного снаряжения. При этом боевой опыт [FROM.GetAdjRuLower]их войск, накопленный в ходе гражданской войны, непременно поможет им грамотно использовать предоставленные нами ресурсы."
 AST_diplomatic_events.66.a: "Неплохой шаг для начала"
 AST_diplomatic_events.67.t: "[FROM.GetName] выража[FROM.GetNameEndRuPresentEtYut] благодарность за поддержку" ### Support for the Chinese Communists - They accept
 AST_diplomatic_events.67.desc: "[FROM.GetLeader] через своих представителей выразил[FROM.GetVerbGendEndA_RU] нам благодарность за отправку добровольцев и военного снаряжения. При этом боевой опыт [FROM.GetAdjRuLower]их войск, накопленный в ходе гражданской войны, непременно поможет им грамотно использовать предоставленные нами ресурсы."
 AST_diplomatic_events.67.a: "Неплохой шаг для начала"
 AST_diplomatic_events.68.t: "Австралийские требования"
 AST_diplomatic_events.68.desc: "Австралия не желает оставаться один на один с превосходящими силами [JAP.GetNameRuGen]. Они призывают нас сделать первый шаг и урегулировать назревающий конфликт в кратчайшие сроки."
 AST_diplomatic_events.68.a: "Как изменилось положение дел."
 AST_diplomatic_events.69.t: "Связанные одной цепью"
 AST_diplomatic_events.69.desc: "Исторические связи между [ENG.GetNameRuInst] и [AST.GetNameRuInst] подверглись серьёзному испытанию, однако [AST.GetName] дела[AST.GetNameEndRuPresentEtYut] всё возможное, чтобы сохранить и укрепить их. У [AST.GetAdjRuLower]их сторонников есть влиятельные связи в британском правительстве, которым очень сложно противостоять. Туманный Альбион и «Земля внизу» вновь станут частью одного союза."
 AST_diplomatic_events.69.a: "Так и должно быть."
 AST_diplomatic_events.71.t: "Австралия требует передачи тихоокеанских островов"
 AST_diplomatic_events.71.desc: "[AST.GetName] потребовал[AST.GetNameRuEndPast] передачи контроля над нашими тихоокеанскими островами, заявляя, что западная часть Тихого океана не должна принадлежать [USA.GetNameRuDat]. Острова — небольшая плата за то, чтобы усмирить [AST.GetAdjRuLower]ое недовольство, но это всё равно потеря. Готовы ли мы рискнуть и спровоцировать отказом набирающий силу фашистский режим, когда у нас и без того хватает проблем?"
 AST_diplomatic_events.71.a: "Нет, не готовы."
 AST_diplomatic_events.71.b: "Тихоокеанские острова останутся за нами."
 AST_diplomatic_events.72.t: "Передача [USA.GetAdjRuLower]их тихоокеанских островов"
 AST_diplomatic_events.72.desc: "У [USA.GetNameRuGen] и так хватает забот, а потому [USA.GetAdjRuLower]ое правительство сочло передачу тихоокеанских островов приемлемой ради умиротворения Австралии. Тихоокеанские острова стали нашими."
 AST_diplomatic_events.72.a: "Превосходно."
 AST_diplomatic_events.73.t: "[USA.GetNameDefCap] отказыва[USA.GetNameEndRuPresentEtYut]ся"
 AST_diplomatic_events.73.desc: "[USA.GetNameDefCap] не жела[USA.GetNameEndRuPresentEtYut] передавать нам свои тихоокеанские острова. Несмотря на наши требования и растущее влияние на этот театре, Вашингтон не желает уступать контроль над островами."
 AST_diplomatic_events.73.a: "Острова пока что останутся за нами."
 AST_diplomatic_events.74.t: "Австралия требует передать ей Филиппины"
 AST_diplomatic_events.74.desc: "В своём стремлении к территориальному расширению [AST.GetName] потребовал[AST.GetNameRuEndPast] передать контроль над [PHI.GetNameRuInst]. В случае отказа [AST.GetName] угрожа[AST.GetNameEndRuPresentEtYut] нам войной, не допуская даже мысли, чтобы [USA.GetNameDef] сохранил[USA.GetNameRuEndPast] территории в [AST.GetAdjRuLower]ой сфере влияния."
 AST_diplomatic_events.74.a: "Война недопустима, мы выполним требование."
 AST_diplomatic_events.74.b: "Филиппины останутся за нами!"
 AST_diplomatic_events.75.t: "Передача [PHI.GetNameRuGen]"
 AST_diplomatic_events.75.desc: "Очевидно, что усиление [AST.GetNameRuGen] в роли фашистского государства начинает приносить определённые выгоды. Другие страны теперь боятся нашего гнева. [USA.GetNameDefCap] соглаша[USA.GetNameEndRuPresentEtYut]ся передать нам [PHI.GetNameRuAcc]."
 AST_diplomatic_events.75.a: "Наступает новый порядок."
 AST_diplomatic_events.76.t: "[USA.GetNameDefCap] отказыва[USA.GetNameEndRuPresentEtYut]ся"
 AST_diplomatic_events.76.desc: "[USA.GetNameDefCap] не жела[USA.GetNameEndRuPresentEtYut] передавать нам [PHI.GetNameRuAcc]. Несмотря на наши требования и растущее влияние в Тихоокеанском регионе, Вашингтон не желает уступать контроль над этой территорией."
 AST_diplomatic_events.76.a: "Значит, быть войне."
 AST_diplomatic_events.78.t: "[AST.GetName] требу[AST.GetNameEndRuPresentEtYut] гарантий защиты от гиганта"
 AST_diplomatic_events.78.desc: "[AST.GetNameDefCap] разделя[AST.GetNameEndRuPresentEtYut] наши смелые намерения:\n\n«[USA.GetNameDefCap] угрожа[USA.GetNameEndRuPresentEtYut] нам вмешательством каждый раз, когда наши действия расходятся с интересами этой державы. Пока такая могущественная держава вторгается в зону австралийских и японских интересов, Восточная Азия нам по-настоящему принадлежать не может. И поэтому [AST.GetName] вступа[AST.GetNameEndRuPresentEtYut] в войну».\n\nПремьер-министр [AST.GetNameRuGen] намеревается вступить в конфликт с [USA.GetNameRuInst] и просит нашей помощи на случай, если самостоятельно с американцами справиться не получится."
 AST_diplomatic_events.78.a: "Они получат наши гарантии."
 AST_diplomatic_events.78.b: "У [JAP.GetNameRuGen] есть другие заботы."
 AST_diplomatic_events.79.t: "[JAP.GetNameDef] да[JAP.GetNameEndRuPresentEtYut] [AST.GetNameRuDat] гарантии"
 AST_diplomatic_events.79.desc: "Не только нам совершенно понятно, что [USA.GetAdjRuLower]ое вмешательство в международные дела Азии и Океании нежелательно и недопустимо. [JAP.GetNameDef] предоставил[JAP.GetNameRuEndPast] нашей державе гарантии независимости: теперь мы можем, гордо подняв знамя, противостоять всем врагам, зная, что, если американцы окажутся слишком сильны, к нам придёт помощь."
 AST_diplomatic_events.79.a: "В бой!"
 AST_diplomatic_events.80.t: "[JAP.GetName] отказыва[JAP.GetNameEndRuPresentEtYut]ся предоставлять нам гарантии"
 AST_diplomatic_events.80.desc: "[USA.GetAdjective]ое вмешательство в международную политику Азии и Океании нежелательно и недопустимо, но, судя по всему, понимаем это только мы. [JAP.GetName] отказыва[JAP.GetNameEndRuPresentEtYut]ся предоставлять нам гарантии, так что теперь мы один на один с врагами."
 AST_diplomatic_events.80.a: "Пусть будет так."
 AST_diplomatic_events.81.t: "Очаровательный символ единства"
 AST_diplomatic_events.81.desc: "Интерес британского премьер-министра к животным известен всем: он успел собрать довольно внушительный зверинец. Он с энтузиазмом примет любое пополнение его коллекции, особенно если животное будет экзотическим.\n\n[ENG.GetLeader] проявил открытый интерес к австралийскому утконосу, и хотя экспорт этого вида в настоящее время запрещён из-за рисков для здоровья животных, возможно, стоит сделать исключение.\n\nСтоит ли нам исполнить желание премьер-министра в знак единства наших народов?"
 AST_diplomatic_events.81.a: "[ENG.GetLeader] получит утконоса."
 AST_diplomatic_events.81.b: "Запрет на вывоз отменён не будет, даже ради премьер-министра."
 AST_diplomatic_events.82.t: "[ENG.GetLeader] сообщает печальную весть"
 AST_diplomatic_events.82.desc: "Шесть недель назад в порту Мельбурна мы проводили в далёкое плавание утконоса на борту судна, оборудованного специальным вольером, и теперь он прибыл в [ENG.GetNameRuAcc]. Однако путешествие завершилось печально: пассажир погиб в пути. [ENG.GetLeader] оплакивает своего потерянного питомца, которого он даже успел назвать в свою честь, но утверждает, что в его гибели виноваты враги. По его словам, утконос до смерти испугался звуков взрывов во время атаки подводной лодки.\n\nОднако записи в журнале смотрителя утконоса указывают на другую вероятную причину смерти: температура воды и воздуха в вольере оказались для животного невыносимыми.\n\nКак бы то ни было, утконос [ENG.GetLeader] мёртв, а британский премьер-министр так и остался без питомца."
 AST_diplomatic_events.82.a: "Печальные новости."
 AST_political_events.1.t: "Созвать референдум"
 AST_political_events.1.desc: "Есть две сферы, в которых наше правительство предпочло бы увеличить степень федерального контроля: авиация и реклама.\n\nВ авиации наша цель — принять поправку к конституции, которая позволит парламенту Союза регулировать воздушный транспорт и аэронавигацию.\n\nЦель поправки о рекламе — разрешить сотрудничество Союза и Штатов в этой области, сейчас оно запрещено конституцией.\n\nПо какой области мы проведем референдум?"
 AST_political_events.1.a: "Авиацию, чтобы регулировать использование воздушного пространства [AST.GetNameRuGen]."
 AST_political_events.1.a.tt: "В случае проведения реформы:\n Добавляется свойство §Y«Проведена реформа авиации»§!, которое дает следующие преимущества:\n Темпы исследования авиации: §G+15%§!\n Скорость строительства §Yавиабаз§!: §G+5%§!"
 AST_political_events.1.b: "Рекламу, чтобы координировать сельскохозяйственные рынки сбыта всей страны."
 AST_political_events.1.b.tt: "В случае проведения реформы:\n Добавляется свойство §Y«Проведена рекламная реформа»§!, которое дает следующие преимущества:\n Фактор фабрик, производящих товары народного потребления: §Y-10%§!"
 AST_political_events.2.t: "Успешный референдум"
 AST_political_events.2.desc.a: "Народ поддержал наше предложение провести реформу в авиации. Когда была написана Конституция Австралии, самолёты ещё не изобрели — вполне разумно, что теперь правительство наконец займётся регулированием воздушного пространства. Ради безопасности и эффективности авиаперевозок требуется особое законодательство, единое для всей страны."
 AST_political_events.2.desc.b: "Народ поддержал наше предложение провести реформу в сфере рекламы. Возможность регулировать производство и рекламу сельскохозяйственной продукции позволит властям стабилизировать рынки и поможет развивать сотрудничество между штатами. Фермеры начнут получать стабильный доход, а вслед за этим выправится и экономика страны."
 AST_political_events.2.a: "Федеральный контроль расширится!"
 AST_political_events.4.t: "Смерть премьер-министра"
 AST_political_events.4.desc: "Лидеры [AST.GetNameRuAcc] уже давно трудятся в условиях подготовки к войне, и сегодня нас постигла невосполнимая утрата: от сердечного приступа на фоне постоянного напряжения умер наш премьер-министр.\n\nОчень горько, когда уходят такие выдающиеся политики, особенно в свете нынешней обстановки в мире. Тем не менее Австралия продолжит двигаться дальше, и отныне её возглавит новый руководитель: [AST.GetLeader]."
 AST_political_events.4.a: "Это национальная трагедия."
 AST_political_events.5.t: "Суровые меры правительства Австралии"
 AST_political_events.5.desc: "Самые радикальные силы, недовольные положением дел в стране, организовали движение «Австралия превыше всего». Опасаясь, что намерения этого движения далеки от демократических, австралийское правительство взяло его участников под наблюдение. Препятствия со стороны либералов мешают нашей организации работать и привлекать новых сторонников."
 AST_political_events.5.a: "Время покажет, что это за движение на самом деле."
 AST_political_events.6.t: "Празднование 150-летия Австралии в 1938 году"
 AST_political_events.6.desc: "Сегодня, пока проходили торжества по случаю 150-летия Австралии в 1938 году, а праздничное шествие «Путь Австралии к государственности» двигалось по главным улицам Сиднея, в Австралийском зале состоялась акция протеста.\n\nАктивисты и организации, выступающие за права аборигенов, собрались, чтобы напомнить о том, что 150-летняя годовщина знаменует не только начало британской колонизации, но и начало конституционной дискриминации коренных народов Австралии. Участники акции потребовали принятия новых законов в области образования и социальной поддержки аборигенов, а также выработки новой политики, направленной на предоставление коренным народам полного статуса граждан страны."
 AST_political_events.6.a: "Необходимо предпринять меры."
 AST_political_events.7.t: "Имперское давление"
 AST_political_events.7.desc: "После недавних событий уже невозможно отрицать, что австралийская политика претерпевает определенные изменения. [ENG.GetNameDefCap] предпринял[ENG.GetNameRuEndPast] дипломатические шаги, чтобы удержать [AST.GetNameRuAcc] на курсе, соответствующем статусу государства Британского Содружества, надеясь, что подобного мягкого давления окажется достаточно, чтобы обеспечить лояльность доминиона."
 AST_political_events.7.a: "Невзирая на британские попытки, [AST.GetName] пойд[AST.GetNameEndRuPresentEtUt] своим путем."
 AST_political_events.8.t: "Предчувствие войны"
 AST_political_events.8.desc: "$AST_war_is_coming_cat_desc$"
 AST_political_events.8.a: "Мы должны готовиться."
 AST_political_events.9.t: "Спор из-за «Далфрама»"
 AST_political_events.9.desc: "Конфликт из-за погрузки чугуна перерос в серьёзное общественное волнение. По всей стране прокатилась волна забастовок, которые проводятся из солидарности. Производства остановлены, а правительство пребывает в полном замешательстве. Напряжение растёт, кризис усугубляется, протестующие требуют смены правительства. Кабинет министров, расписавшись в своём бессилии, подаёт в отставку. [AST.GetCommunistParty] готовится взять власть в свои руки."
 AST_political_events.9.a: "Так мы и сделаем."
 AST_canberra_air_disaster_events.1.t: "Авиакатастрофа в Канберре"
 AST_canberra_air_disaster_events.1.desc: "Сегодня утром на окраине Канберры разбился самолёт «Локхид Хадсон». На борту находились десять человек, в том числе главнокомандующий армией и его подчинённые, которые летели на совещание Кабинета министров. Они и экипаж самолёта трагически погибли.\n\nПричины этой катастрофы остаются загадкой: погодные условия были идеальными, а за штурвалом находился опытный пилот Австралийских ВВС Роберт Хичкок.\n\nВся страна соболезнует родным и близким жертв и при этом вопросительно смотрит в сторону правительства. Какой будет его реакция?"
 AST_canberra_air_disaster_events.1.a: "Это ужасная трагедия."
 AST_canberra_air_disaster_events.1.a.tt: "Открывает §Yрешения «Доверие кабинета»§! и §Yзадание§!, позволяющее сохранить правительство или отправить его в отставку."
 AST_canberra_air_disaster_events.2.t: "[AST.GetRulingParty] побеждает"
 AST_canberra_air_disaster_events.2.desc: "Действующее правительство успешно преодолело кризис, вызванный авиакатастрофой в Канберре. [AST.GetRulingParty], проявив силу и сплоченность в трудные времена, пользуется теперь еще большим доверием и поддержкой австралийского народа."
 AST_canberra_air_disaster_events.2.a: "Впереди светлое будущее."
 AST_canberra_air_disaster_events.3.t: "Вотум недоверия"
 AST_canberra_air_disaster_events.3.desc: "После вотума недоверия действующее правительство нехотя уступило власть своим преемникам. Преодолев период политической нестабильности, Австралия готова двигаться дальше."
 AST_canberra_air_disaster_events.3.a: "Новая власть послужит на благо Австралии."
 AST_canberra_air_disaster_events.4.t: "Смена руководства"
 AST_canberra_air_disaster_events.4.desc: "[AST.GetRulingParty] после периода политической нестабильности, вызванной кризисом доверия, меняет свое руководство. Решение, принятое большинством голосов, заставило премьер-министра уступить свой пост преемнику."
 AST_canberra_air_disaster_events.4.a: "Будем надеяться, что это откроет Австралии дорогу в будущее."
 AST_canberra_air_disaster_events.5.t: "Обвинения австралийцев"
 AST_canberra_air_disaster_events.5.desc: "На пресс-конференции представитель [AST.GetNameRuGen] назвал нас виновниками недавней авиакатастрофы, унесшей жизни нескольких австралийских чиновников.\n\nПолная безосновательность этих обвинений делает их еще более оскорбительными."
 AST_canberra_air_disaster_events.5.a: "Эта ложь не стоит нашего внимания."
 AST_canberra_air_disaster_events.5.b: "Это не останется безнаказанным."
 AST_canberra_air_disaster_events.6.t: "[JAP.GetNameDefCap] принима[RAJ.GetNameEndRuPresentEtYut] меры"
 AST_canberra_air_disaster_events.6.desc: "[JAP.GetNameDefCap] отреагировал[JAP.GetNameRuEndPast] на наши обвинения, назвав их актом агрессии. [JAP.GetLeader] заявил[JAP.GetVerbGendEndA_RU], что теперь у его страны есть законное право вторгнуться на нашу территорию."
 AST_canberra_air_disaster_events.6.a: "Нам ни к чему дальнейшая эскалация."
 AST_canberra_air_disaster_events.6.b: "Это нельзя оставлять без ответа."
 INS_limited_war_events.1.t: "Малайе конец!"
 INS_limited_war_events.1.desc: "Оборонительные линии врага прорваны, наши воины движутся вперёд, не встречая сопротивления. Британский вассал по ту сторону пролива трещит под напором народного гнева. Лондонские марионетки думали, что смогут усидеть на штыках, но история рассудила иначе."
 INS_limited_war_events.1.a: "Свобода!"
 INS_limited_war_events.1.b: "Великий день для республики!"
 INS_limited_war_events.2.t: "[FROM.GetAdjective]ое контрнаступление"
 INS_limited_war_events.2.desc: "Мы должны были сокрушить марионеточный режим одним стремительным ударом, однако всё пошло не по плану. [FROM.GetAdjective]ие части, погоняемые их хозяевами-империалистами, выбили наших солдат и оккупировали спорные территории. Каждый день мы слышим их самодовольные заявления. Новые попытки наступления могут привести к ещё большему унижению, однако отступить сейчас — значит, признать наше поражение в глазах всего архипелага."
 INS_limited_war_events.2.a: "Мы отведём войска и спасём то, что сможем."
 INS_limited_war_events.2.b: "Мы не подчинимся империалистическим марионеткам!"
 INS_limited_war_events.3.t: "[FROM.GetName] сда[FROM.GetNameEndRuPresentEtYut]ся республике"
 INS_limited_war_events.3.desc: "Пришли вести из Куала-Лумпура. Лишившись поддержки лондонских хозяев в критический момент, марионеточное правительство решило принять наши условия, лишь бы не допустить разорения своих городов. Спорные территории стали нашими. Пусть это послужит уроком для других вассальных держав региона."
 INS_limited_war_events.3.a: "Мощь Индонезии растёт."
 INS_limited_war_events.4.t: "[FROM.GetName] отверга[FROM.GetNameEndRuPresentEtYut] наши требования"
 INS_limited_war_events.4.desc: "Власти [FROM.GetNameRuGen] бросили мирное предложение нам в лицо. Действуя по указке Уайтхолла, марионеточное правительство заявило, что не уступит ни пяди земли. Они не пойдут на мир, пока наша республика не будет уничтожена."
 INS_limited_war_events.4.a: "Тогда пусть говорят пушки."
 INS_limited_war_events.5.t: "[FROM.GetNameDef] жажд[FROM.GetNameEndRuPresentEtUt] уничтожения нашей державы"
 INS_limited_war_events.5.desc: "[FROM.GetNameDefCap] показал[FROM.GetNameRuEndPast] своё истинное лицо. Там уже не притворяются, что мы ведём ограниченный конфликт — их пропаганда открыто призывает расчленить нашу республику и поделить острова между империалистическими колониальными державами. Компромиссов не будет — Индонезия либо победит в этой борьбе, либо перестанет существовать."
 INS_limited_war_events.5.a: "Мы вместе выстоим — или вместе падём."
 INS_limited_war_events.6.t: "[FROM.GetAdjective]ое наступление захлебнулось"
 INS_limited_war_events.6.desc: "[FROM.GetAdjective]ий натиск застал нас врасплох, и несколько месяцев мы готовились к самому худшему. К счастью, запала у врагов хватило ненадолго — их солдаты измотаны, линии снабжения слишком растянуты, а новые коммюнике из Лондона звучат всё более неуверенно. Республика может проявить великодушие и позволить империалистическим марионеткам сохранить лицо, хотя многие считают, что решительная победа больше отвечает нашим интересам, чем скромный компромисс."
 INS_limited_war_events.6.a: "Предложим им мирные условия."
 INS_limited_war_events.6.b: "Никакой пощады марионеткам!"
 INS_limited_war_events.7.t: "Наше наступление остановилось"
 INS_limited_war_events.7.desc: "Наш натиск захлебнулся, и противник, увы, это прекрасно понимает. С той стороны пролива поступили требования — враги предлагают сложить оружие и принять их условия. В противном случае потери будут только расти, а исход окажется прежним. Всё, что мы можем выбрать, — это количество похорон, которые нам предстоит провести."
 INS_limited_war_events.7.a: "Дурной мир лучше плохой войны."
 INS_limited_war_events.7.b: "Республика не сдаётся!"
 INS_limited_war_events.8.t: "[FROM.GetName] отказывается уступить"
 INS_limited_war_events.8.desc: "[FROM.GetName] категорически отверга[FROM.GetNameEndRuPresentEtYut] наши требования. [FROM.GetAdjective]ие власти заявили, что скорее подожгут все кампонги от Пинанга до Джохора, чем пойдут на уступки республике. Война продолжается."
 INS_limited_war_events.8.a: "Так тому и быть."
 INS_limited_war_events.9.t: "[FROM.GetName] решил[FROM.GetNameRuEndPast] сломить республику!"
 INS_limited_war_events.9.desc: "Перехваченные радиограммы из вражеского штаба подтверждают худшее. Не будет никаких соглашений, справедливого мира и возвращения к довоенным границам. Лондонские марионетки и их хозяева требуют безоговорочной капитуляции республики. Они хотят расчленить Индонезию и снова раздать её острова империалистическим угнетателям, от ига которых мы только освободились. У нас на это лишь один ответ."
 INS_limited_war_events.9.a: "Индонезия выстоит!"
 ### AST - Union Control Events ###
 AST_union_control_events.1.t: "Иностранные агенты внедряются в наши профсоюзы"
 AST_union_control_events.1.desc: "Разведка представила властям тревожный отчёт. Австралийские коммунистические агенты налаживают контакты с местными профсоюзными лидерами, распространяют радикальную литературу и агитируют рабочих действовать согласно революционным принципам. Пока у этого движения мало сторонников, но спецслужбы напоминают, что именно так начинаются коммунистические восстания. Мы должны принять решение, пока революционное движение не укрепилось."
 AST_union_control_events.1.a: "Держите их под надзором. Посмотрим, что будет дальше."
 AST_union_control_events.4.t: "Агенты коммунизма захватили [MAL.GetAdjRuLower]ую территорию"
 AST_union_control_events.4.desc: "Правительство получает тревожные донесения. В ходе тщательно спланированной операции мятежники захватили один из наших штатов и установили там революционную власть. Стремительность и высокий уровень организации этого нападения говорят о том, что им могли управлять иностранные кураторы. Тем временем сторонники правительства, которым удалось избежать плена, перегруппировались и взялись за оружие. Они решительно настроены отбить захваченные территории."
 AST_union_control_events.4.a: "Мы узнаем, кто за этим стоит. А мятежникам скоро придёт конец."
 AST_union_control_events.4.a.tt: "В ответ на захват власти коммунисты в регионе формируют антикоммунистическое вооружённое сопротивление."
 AST_union_control_events.5.t: "[MAL.GetAdjective]ая катастрофа"
 AST_union_control_events.5.desc: "Операция закончилась катастрофой. Нашим войскам так и не удалось высадиться на берег — одних оттеснили патрули лоялистов, другие сбились с пути в проливах или угодили в плен, не успев закрепиться. Все обстоятельства нашего фиаско ещё не выяснены, но итог уже очевиден. Хуже того, о нашей авантюре пронюхали журналисты, и члены парламента уже задаются вопросом, что наши войска делали в [MAL.GetAdjRuLower]их территориальных водах. Общественность возмущена и шокирована разразившимся скандалом. Если мы хотим, чтобы революция добилась дальнейших успехов, нужно искать другой путь."
 AST_union_control_events.5.a: "Это ужасно. Придётся найти другие способы помочь нашим товарищам."
 AST_union_control_events.3.t: "[MAL.GetNonIdeologyName] в пламени революции"
 AST_union_control_events.3.desc: "[MAL.GetNonIdeologyName] в огне — коммунистические ячейки, которые мы пестовали на протяжении многих лет, поднимают вооружённые восстания по всей территории страны. Однако первые отчёты с мест выглядят неутешительно — революционные силы сосредоточены не в самых подходящих районах, от центра полуострова их отделяют джунгли и водные преграды. Если мятежники не сумеют закрепиться на материке, власти просто возьмут их измором и задушат революцию в зародыше. Чтобы обеспечить товарищам шанс на победу, Австралия должна перебросить на полуостров дополнительные силы, действуя быстро и незаметно."
 AST_union_control_events.3.a: "Надо захватить для них плацдарм. Не позволим революции угаснуть."
 AST_union_control_events.2.t: "[AST.GetAdjective]ие агенты ведут агитацию на улицах"
 AST_union_control_events.2.desc: "В наших городах появились агенты австралийского коммунистического движения. Они раздают листовки на фабричных проходных, выступают с речами на улицах и площадях, налаживают тесные связи с местными радикальными организациями и даже не пытаются скрывать свою подрывную деятельность. Похоже, все существующие каналы иностранного влияния активизировались одновременно. Операция выглядит тщательно спланированной, и правительство должно принять ответные меры, пока народное недовольство не вышло из-под контроля."
 AST_union_control_events.2.b: "Пугающее развитие событий."
 ###########################
 ##### ABDACOM EVENTS ######
 ###########################
 ABDA_events.1.t: "Приглашение в новое верховное командование"
 ABDA_events.1.desc: "[FROM.GetNameDef] создал[FROM.GetNameRuEndPast] объединённое верховное командование для тихоокеанского театра и пригласил[FROM.GetNameRuEndPast] нас туда вступить. Эта инициатива, известная как ABDACOM, стремится объединить в общую структуру командование региональными флотами, авиацией и сухопутными войсками союзных стран. Участие приведёт к более тесной координации с [FROM.GetNameRuInst] и другими партнёрами, уже присоединившимися к инициативе. Нам нужно принять решение."
 ABDA_events.1.a: "Мы будем сражаться вместе."
 ABDA_events.1.b: "Сейчас мы не можем в этом участвовать."
 ABDA_events.2.t: "[FROM.GetName] присоединя[FROM.GetNameEndRuPresentEtYut]ся к ABDACOM"
 ABDA_events.2.desc: "[FROM.GetNameDef] принял[FROM.GetNameRuEndPast] наше приглашение присоединиться к верховному командованию ABDACOM. Отныне [FROM.GetAdjRuLower]ие войска будут действовать в составе объединённого командования, что усилит наше положение на тихоокеанском театре военных действий."
 ABDA_events.2.a: "Хорошие вести."
 ABDA_events.3.t: "[FROM.GetName] отказыва[FROM.GetNameEndRuPresentEtYut]ся от вступления"
 ABDA_events.3.desc: "[FROM.GetNameDef] отклонил[FROM.GetNameRuEndPast] наше приглашение присоединиться к верховному командованию ABDACOM. Хотя сейчас [FROM.GetAdjRuLower]ие войска и не будут с нами сотрудничать, мы оставим за ними право присоединиться."
 ABDA_events.3.a: "Досадно, но мы это учтём."
 ABDA_events.5.t: "Приглашение в ABDACOM"
 ABDA_events.5.desc: "[FROM.GetNameDef] пригласил[FROM.GetNameRuEndPast] нас присоединиться к командованию американскими, британскими, голландскими и австралийскими вооружёнными силами. ABDACOM уже проявило себя как о главный центр координации союзных войск на Тихоокеанском театре, объединив флоты и армии ключевых государств союзников. Если мы согласимся, то интегрируем в эту структуру наши войска с общими разведданными, скоординированными доктринами и полномасштабной поддержкой союзников. Нужно принять решение."
 ABDA_events.5.a: "Мы будем сражаться вместе."
 ABDA_events.5.b: "Сейчас мы не можем в этом участвовать."
 ABDA_events.4.t: "Оборона Сингапура"
 ABDA_events.4.desc: "Поскольку Сингапур выбран опорой оборонительного периметра ABDACOM, наши командиры должны решить, как именно укрепить его оборону. Мы можем отдать приоритет подходам с моря и обороной гавани, укрепить сухопутные пути на случай наземной атаки или распределить ресурсы между двумя этими направлениями. Наш выбор определит оборону Сингапура в случае нападения врага."
 ABDA_events.4.a: "Укрепим подходы с моря. Сила Сингапура в его гавани."
 ABDA_events.4.b: "Укрепим наземный периметр. Главная угроза придёт с суши."
 ABDA_events.4.c: "Выберем сбалансированный подход. У нас не должно быть уязвимостей."
 ABDA_fortress_singapore_choice_tt: "Завершение этого фокуса позволит нам выбрать метод фортификации Сингапура."
 ABDA_faction_membership_requirement_tt: "Подходящие участники альянса получат приглашения."
