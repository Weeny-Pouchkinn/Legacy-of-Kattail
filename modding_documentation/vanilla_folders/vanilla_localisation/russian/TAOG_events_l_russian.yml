 ### INS - Political Events
 INS_political_events.1.t: "Новый генерал-губернатор для [INS.GetNameRuGen]"
 INS_political_events.1.desc: "[INS.GetLeader] уже почти пять лет занимает свой пост, срок его полномочий подходит к концу, поэтому нам нужна подходящая кандидатура на его место. Королева Вильгельмина порекомендовала Алидиуса Тьярду ван Старкенборга Стахауэра, он прекрасно себя проявил в качестве чрезвычайного посла и полномочного министра."
 INS_political_events.1.a: "Как пожелает королева."
 INS_political_events.1.b: "[INS.GetLeader] служит нам верой и правдой, поэтому должен остаться еще на один срок."
 INS_political_events.2.t: "[FROM.GetName] требу[FROM.GetNameEndRuPresentEtYut] контроль над регионом [721.GetName]"
 INS_political_events.2.desc: "Новое республиканское правительство бывшей Ост-Индии объявило весь архипелаг своей территорией. [FROM.GetLeader] направил[FROM.GetVerbGendEndA_RU] нам официальное требование передать контроль над регионом [721.GetName], угрожая военными действиями в случае отказа."
 INS_political_events.2.a: "Дадим согласие, за это не стоит проливать кровь."
 INS_political_events.2.b: "Это исключено!"
 INS_political_events.3.t: "[FROM.GetName] соглаша[FROM.GetNameEndRuPresentEtYut]ся отдать регион [721.GetName]"
 INS_political_events.3.desc: "Как и ожидалось, [FROM.GetLeader] начал[FROM.GetVerbGendEndA_RU] выводить войска из региона [721.GetName] согласно нашим требованиям. Силы АНБ вошли туда вместе с несколькими правительственными посланниками. [INS.GetLeader] выступил[INS.GetVerbGendEndA_RU] с речью в Дили и провозгласил[INS.GetVerbGendEndA_RU] освобождение от колониального влияния."
 INS_political_events.3.a: "Чудесно!"
 INS_political_events.4.t: "[FROM.GetName] отказыва[FROM.GetNameEndRuPresentEtYut]ся отдать регион [721.GetName]"
 INS_political_events.4.desc: "Переговоры с [FROM.GetNameRuInst] не увенчались успехом. [FROM.GetLeader] заявил[FROM.GetVerbGendEndA_RU], что ни за что не отдаст регион [721.GetName]. Встреча завершилась раньше, чем было намечено."
 INS_political_events.4.a: "Значит, быть войне."
 INS_political_events.5.t: "Индонезийские всеобщие выборы"
 INS_political_events.5.desc: "Сегодня начнется новый этап в истории Индонезии. После официального окончания революции премьер-министр [INS.GetLeader] объявил[INS.GetVerbGendEndA_RU] о проведении первых свободных и демократических выборов в стране. Их результаты окажут огромное влияние на будущее Индонезии."
 INS_political_events.5.a: "Сутан Шарир привел нашу страну к этому историческому моменту, пусть ведет нас и дальше!"
 INS_political_events.5.b: "Амир Шарифуддин — разумный компромисс между социалистами и националистами."
 INS_political_events.5.c: "Мохаммад Хатта начал революцию — он и доведёт её до конца."
 INS_political_events.6.t: "Наши приготовления приносят пользу"
 INS_political_events.6.desc: "Революция набирает обороты. Нашим партизанам, проникшим в руководство Ост-Индии, пора выйти из тени и приступить к диверсиям, пока Нидерланды не успели опомниться."
 INS_political_events.6.a: "Мы должны действовать быстро."
 INS_political_events.7.t: "Петиция Сутарджо"
 INS_political_events.7.desc: "После обсуждений в фольксрааде Сутарджо составил петицию с просьбой провести круглый стол между представителями Нидерландов и Индонезии по поводу стремления Индонезии к автономии. Эта петиция была направлена на утверждение генерал-губернатору. Многие советники нацелены сохранить статус-кво и, следовательно, отклонить петицию, однако стоит учесть, что националистические движения набирают силу и становятся все радикальнее. Если мы продолжим отказывать во всех мирных просьбах об автономии, националисты могут перейти к насильственным методам."
 INS_political_events.7.a: "Нужно начать переговоры, чтобы избежать надвигающейся гражданской войны."
 INS_political_events.7.b: "Статус-кво должен оставаться неизменным."
 INS_political_events.7.c: "Возможно, националисты правы?"
 INS_political_events.8.t: "[?event_target:INS_invasion_event_invader.GetAdjective]ая оккупация неизбежна"
 INS_political_events.8.desc: "Солдаты из [?event_target:INS_invasion_event_invader.GetNameRuGen] прибыли на территорию [?event_target:INS_invasion_event_invaded_state.GetNameRuGen]. Наши войска здесь значительно уступают противнику в численности, поэтому они получили приказ начать полномасштабную военную эвакуацию из [?event_target:INS_invasion_event_invaded_state.GetNameRuGen]. [?event_target:INS_invasion_event_invader.GetAdjective]ие войска продолжают наступать в Ост-Индии, и наши шансы избежать оккупации выглядят совсем призрачными."
 INS_political_events.8.a: "Мы арестуем националистов и защитим свой дом даже ценой своей жизни!"
 INS_political_events.9.t: "Индонезийцы провозглашают независимость"
 INS_political_events.9.desc: "Узнав, что [JAP.GetNameDef] приступа[JAP.GetNameEndRuPresentEtYut] к выводу своих войск из Ост-Индии, мы отправили солдат в Батавию, чтобы восстановить колониальное правительство. Однако войска обнаружили, что со времен оккупации политическая обстановка в Ост-Индии значительно изменилась. Прежде чем они достигли Батавии, [INS.GetLeader] подписал[INS.GetVerbGendEndA_RU] декларацию, которая провозглашает Республику Индонезия независимым государством, и это вызвало невероятную поддержку в обществе."
 INS_political_events.9.a: "Отправить туда танки!"
 INS_political_events.9.b: "Ничего уже не поделать. Новая война нам не нужна. Лучше сосредоточимся на восстановлении родины."
 INS_political_events.11.t: "[HOL.GetNameDefCap] призна[HOL.GetNameEndRuPresentEtYut] независимость Индонезии"
 INS_political_events.11.desc: "После того как мы провозгласили независимость, наши ополченцы тут же двинулись на защиту границ от ожидаемого голландского вторжения. Однако совершенно неожиданно [HOL.GetLeader] заявил[HOL.GetVerbGendEndA_RU], что не будет призывать к вторжению, а вместо этого сосредоточится на восстановлении голландской родины и предотвращении дальнейших конфликтов."
 INS_political_events.11.a: "Какой приятный сюрприз!"
 INS_political_events.12.t: "Встреча с индонезийскими националистами"
 INS_political_events.12.desc: "После высадки наших войск на территории [?event_target:INS_invasion_event_invaded_state.GetNameRuGen] победа в Индонезии близка как никогда. Нам нужно принять решение насчет оккупации Индонезии. Прямая оккупация принесет нам необходимые ресурсы, но потребует немало затрат и усилий. Мы провели переговоры с Сукарно, одним из ведущих революционеров страны, и разработали план, согласно которому Индонезия станет марионеточным государством, которое официально возглавит Сукарно, но фактически оно перейдет под наше руководство. Это предотвратит возмущение индонезийцев и обойдется гораздо дешевле, чем полная оккупация."
 INS_political_events.12.a: "Нужно продолжить переговоры с Сукарно"
 INS_political_events.12.b: "Сотрудничество с революционерами нас не интересует."
 INS_political_events.13.t: "[?event_target:INS_invasion_event_invader.GetAdjective]ая оккупация неизбежна"
 INS_political_events.13.desc: "Солдаты из [?event_target:INS_invasion_event_invader.GetNameRuGen] прибыли на территорию [?event_target:INS_invasion_event_invaded_state.GetNameRuGen]. Наши войска в этом районе значительно уступают противнику в численности, поэтому они получили приказ начать полномасштабную военную эвакуацию из [?event_target:INS_invasion_event_invaded_state.GetNameRuGen]. [?event_target:INS_invasion_event_invader.GetAdjective]ие войска продолжают наступать в Ост-Индии, и наши шансы избежать оккупации выглядят совсем призрачными. Кроме того, наши разведчики выяснили, что [?event_target:INS_invasion_event_invader.GetLeader] вел[?event_target:INS_invasion_event_invader.GetVerbGendEndA_RU] переговоры с Сукарно и другими лидерами националистов о создании в сфере совместного процветания индонезийского марионеточного государства под руководством Сукарно."
 INS_political_events.13.a: "Мы арестуем националистов и защитим свой дом даже ценой жизни!"
 INS_political_events.13.b: "Несмотря на опасность, для нас это может быть реальным шансом обрести независимость."
 INS_peta_explain_tt: "Мы можем воспользоваться хаосом оккупации, чтобы объявить полную независимость, когда [JAP.GetNameRuDat] дадут отпор."
 INS_peta_explain_tt_jap: "§R[INS.GetName] пока сохраня[INS.GetNameEndRuPresentEtYut] нам верность, но если мы начнём терять контроль над их территорией, то мо[INS.GetNameSuffixRuDzhetGut]  воспользоваться нашей слабостью и провозгласить независимость.§!"
 INS_political_events.14.t: "Лидеры националистов арестованы"
 INS_political_events.14.desc: "Сукарно и несколько других видных индонезийских революционеров были арестованы голландской военной полицией еще до того, как нам удалось установить марионеточный режим."
 INS_political_events.14.a: "Печально, он был бы ценным союзником."
 INS_political_events.15.t: "Защитники родины"
 INS_political_events.15.desc: "Переговоры с Сукарно завершились, и в Индонезии установился марионеточный режим. Сукарно задействовал свои связи и наше военное присутствие, чтобы дестабилизировать голландское правительство и обрести фактический контроль над архипелагом."
 INS_political_events.15.a: "Мы получили не только дешевые ресурсы, но и ценного союзника."
 INS_political_events.16.t: "[?event_target:INS_invasion_event_invader.GetAdjective]ая оккупация Ост-Индии"
 INS_political_events.16.desc: "[?event_target:INS_invasion_event_invader.GetAdjective]ие войска объединились с индонезийскими националистами, чтобы дестабилизировать нашу колониальную администрацию, после чего полностью оккупировали Ост-Индию. Голландские флаги были спущены и заменены индонезийскими, при этом местное население, похоже, относится к [?event_target:INS_invasion_event_invader.GetAdjRuLower]им оккупантам снисходительно. Для нашей колониальной империи это серьезный удар."
 INS_political_events.16.a: "Они выиграли сражение, но война еще не окончена."
 INS_political_events.17.t: "[INS.GetName] провозглаша[INS.GetNameEndRuPresentEtYut] независимость"
 INS_political_events.17.desc: "До Императорского генерального штаба дошли тревожные вести из Батавии. Видя наши постоянные отступления с занятых территорий, клика во главе с Сукарно, которой мы сами поручили управлять островами от имени императора, провозгласила [FROM.GetNameRuDat] отдельной республикой. Они думают, что у нас не хватит сил поставить их на место."
 INS_political_events.17.a: "К сожалению, они не так далеки от истины."
 INS_political_events.18.t: "Тан Малака возвращается в Индонезию"
 INS_political_events.18.desc: "Индонезийский коммунист Тан Малака, который долгое время служил доверенным советником нашего правительства, намерен покинуть страну. Теперь, когда [INS.GetNameDef] стал[INS.GetNameRuEndPast] независимой республикой, Малака хочет вернуться на родину, откуда ему пришлось уехать более двадцати лет назад. Он благодарит нас за предоставленное ему убежище и возможность продолжать политическую деятельность, но сейчас его место — там."
 INS_political_events.18.a: "Пожелаем ему удачи."
 INS_political_events.19.t: "[HOL.GetName] отзыва[HOL.GetNameEndRuPresentEtYut] адмирала Хелфриха"
 INS_political_events.19.desc: "Регион [1058.GetName] охвачен тревогой: адмирала Конрада Хелфриха, командующего нашими военно-морскими силами и самого способного офицера в местных водах, отзывают домой. Не желая вдаваться в подробности, Гаага утверждает, что метрополия в нём нуждается. С его отплытием наши позиции на архипелаге, и без того уязвимые, станут совершенно ничтожными. В офицерских кают-компаниях Сурабаи царят самые мрачные настроения…"
 INS_political_events.19.a: "Это печальный день для флота"
 ### INS - Industrial Events
 INS_industrial_events.4.t: "Перераспределение средств на территории [FROM.FROM.GetNameRuGen]"
 INS_industrial_events.4.desc: "Закрыв каучуковые плантации на территории [FROM.FROM.GetNameRuGen], мы освободили бюджетные средства для новых промышленных проектов в регионе."
 INS_industrial_events.4.a: "Мы построим на территории [FROM.FROM.GetNameRuGen] нефтяные скважины"
 INS_industrial_events.4.b: "Нам следует открыть на территории [FROM.FROM.GetNameRuGen] алюминиевый завод"
 INS_industrial_events.4.c: "Нам нужно провести разведку недостающих ресурсов"
 INS_industrial_events.4.d: "Мы можем открыть на территории [FROM.FROM.GetNameRuGen] угольные шахты"
 INS_industrial_events.5.t: "[INS_industrial_events_5_t_scripted]"
 INS_industrial_events_5_t_colonial: "Судьба Яванского банка"
 INS_industrial_events_5_t_independent: "Судьба Банка Индонезии"
 INS_industrial_events.5.desc: "[INS_industrial_events_5_desc_scripted]"
 INS_industrial_events_5_desc_colonial: "Резервы Яванского банка уменьшились до самого низкого уровня за десять лет. Гульден слабеет с каждым месяцем, а хозяева плантаций требуют оплаты в иностранной валюте. Все наши финансовые консультанты согласны, что банк в одиночку не сможет остановить падение, но резко расходятся во мнениях относительно того, как решать эту проблему."
 INS_industrial_events_5_desc_independent: "Банк Индонезии сообщил, что за последний квартал рупия потеряла почти пятую часть своей стоимости. Торговцы рисом в Сурабае начали отказываться от нее в пользу иностранной валюты. Наш министр финансов настаивает, что валюту можно спасти, но только если мы предпримем решительные действия в кратчайшие сроки."
 INS_industrial_events.5.a: "Попытаемся укрепить гульден, а не заменить его."
 INS_industrial_events.5.b: "Привяжем индонезийский гульден к голландскому."
 INS_industrial_events.5.c: "Привяжем индонезийский гульден к американскому доллару."
 INS_industrial_events.6.t: "Более выгодное соглашение"
 INS_industrial_events.6.desc: "Представители компании «Кина бюро» приняли наши условия. У них не было выбора — малярия бушует в половине тропических поселений, а замены хинину нет. Новое соглашение гарантирует нам гораздо более крупную долю прибыли с каждого грамма хинина, отправляющегося с наших берегов. Осталось решить, куда направить эти средства."
 INS_industrial_events.6.a: "Вложим в наши города."
 INS_industrial_events.6.b: "Будем развивать внешние острова."
 INS_industrial_events.6.c: "Укрепим нашу военную промышленность."
 # Rubber shipment dispatched
 INS_industrial_events.28.t: "Отправлен груз каучука"
 INS_industrial_events.28.desc: "Первая партия каучука погружена на конвои, корабли отправились в море. Наши покупатели получат свой товар, а в наших бухгалтерских книгах вовремя появится запись о проведении согласованных выплат. Стоимость этой сделки будет мелькать в наших финансовых отчётах ближайшие два года, напоминая, чего нам стоило пережить Великую депрессию."
 INS_industrial_events.28.a: "Принято."
 INS_industrial_events.28.b: "Договоримся о дальнейших поставках."
 # Oil shipment dispatched
 INS_industrial_events.36.t: "Отправлен груз нефти"
 INS_industrial_events.36.desc: "Танкеры покинули наши нефтеперерабатывающие заводы и направились в порты покупателя. Мы уже договорились об оплате и получим её в полном размере, но ближайшие два года бремя этой сделки будет отягощать нашу экономику. В это тяжёлое время нам могут предложить только такие условия."
 INS_industrial_events.36.a: "Принято."
 INS_industrial_events.36.b: "Договоримся о дальнейших поставках."
 ### INS - Volksraad
 INS_volksraad_events.2.t: "[HOL.GetLeader] накладывает вето на петицию фольксраада"
 INS_volksraad_events.2.desc: "Хотя [INS.GetLeader] одобрил[INS.GetVerbGendEndA_RU] петицию, [HOL.GetLeader] позже наложил[HOL.GetVerbGendEndA_RU] на нее вето. К сожалению, мы пока вынуждены приостановить реализацию плана."
 INS_volksraad_events.2.a: "Возможно, стоит попробовать позже, когда мы ратифицируем петицию."
 # Generic/Reused
 INS_volksraad_events.10.t: "Предложение фольксраада о преподавании на индонезийском языке"
 INS_volksraad_events.10.desc: "[INS.GetLeader] одобрил[INS.GetVerbGendEndA_RU] петицию фольксраада о создании на территории [INS.GetNameRuGen] школ и университетов, где будут преподавать на индонезийском языке, после чего [HOL.GetLeader] получил[HOL.GetVerbGendEndA_RU] петицию для окончательного утверждения."
 INS_volksraad_events.10.a: "Фольксраад выполняет свою задачу."
 INS_volksraad_events.10.b: "Ни в коем случае. Надо наложить вето!"
 INS_volksraad_events.11.t: "В стране появится образование на индонезийском языке"
 INS_volksraad_events.11.desc: "[HOL.GetLeader] подписал[HOL.GetVerbGendEndA_RU] петицию, теперь она официально утверждена. Выполнение ее условий начнется вскоре после того, как будут согласованы окончательные детали."
 INS_volksraad_events.11.a: "Фольксраад выполняет свою задачу."
 # Individual laws
 INS_volksraad_events.20.t: "Предложение фольксраада о местах в правительстве для знающих индонезийский язык"
 INS_volksraad_events.20.desc: "Чтобы занимать любые государственные должности в Ост-Индии, нужно свободно владеть нидерландским языком, что вызывает у многих членов фольксраада, особенно у представителей коренных общин, вопросы в демократичности такого подхода. Они выступили с инициативой, согласно которой места в правительстве по возможности должны доставаться тем, кто говорит на индонезийском языке."
 INS_volksraad_events.21.t: "Теперь работать в правительстве могут те, кто владеет индонезийским языком!"
 INS_volksraad_events.21.desc: "[HOL.GetLeader] подписал[HOL.GetVerbGendEndA_RU] петицию, теперь она официально утверждена. Выполнение ее условий начнется вскоре после того, как будут согласованы окончательные детали."
 INS_volksraad_events.30.t: "Предложение фольксраада об отмене образовательных квот"
 INS_volksraad_events.30.desc: "[INS.GetLeader] одобрил[INS.GetVerbGendEndA_RU] петицию фольксраада об отмене образовательных квот на территории [INS.GetNameRuGen]. Это положит конец долгим спорам в фольксрааде по поводу справедливости внедрения такой системы. [HOL.GetLeader] получил[HOL.GetVerbGendEndA_RU] петицию для окончательного утверждения."
 INS_volksraad_events.31.t: "Система образовательных квот отменена"
 INS_volksraad_events.31.desc: "[HOL.GetLeader] подписал[HOL.GetVerbGendEndA_RU] петицию, теперь она официально утверждена. Выполнение ее условий начнется вскоре после того, как будут согласованы окончательные детали."
 INS_volksraad_events.40.t: "Предложение фольксраада о снижении налога на экспорт каучука"
 INS_volksraad_events.40.desc: "[INS.GetLeader] подписал[INS.GetVerbGendEndA_RU] и одобрил[INS.GetVerbGendEndA_RU] петицию фольксраада о снижении налогов для частных каучуковых плантаций. Исторически эти налоги позволяли существовать сперхприбыльной государственной монополии на каучук, однако международный протекционизм сделал эту систему гораздо менее выгодной. [INS.GetLeader] заявил[INS.GetVerbGendEndA_RU], что больше не считает целесообразным поддерживать высокий налог на экспорт."
 INS_volksraad_events.40.a: "[INS.GetLeader] зрит в корень."
 INS_volksraad_events.40.b: "Мы не будем снижать налоги."
 INS_volksraad_events.41.t: "Налог для частных лиц на экспорт каучука снижен"
 INS_volksraad_events.41.desc: "[HOL.GetLeader] подписал[HOL.GetVerbGendEndA_RU] петицию, теперь она официально утверждена. Выполнение ее условий начнется вскоре после того, как будут согласованы окончательные детали."
 INS_volksraad_events.60.t: "Предложение фольксраада об отмене негласного ограничения в званиях для индонезийских офицеров"
 INS_volksraad_events.60.desc: "[INS.GetLeader] одобрил[INS.GetVerbGendEndA_RU] петицию фольксраада об отмене негласного правила, по которому офицеры Королевской голландской ост-индской армии, не являвшиеся гражданами Нидерландов, ограничивались в получении званий. Кроме того, согласно этой петиции индонезийские офицеры, которых незаслуженно лишили звания, должны быть повышены. [HOL.GetLeader] получил[HOL.GetVerbGendEndA_RU] ее для окончательного утверждения."
 INS_volksraad_events.61.t: "Негласное ограничение в званиях для [INS.GetAdjRuLower]их генералов отменено"
 INS_volksraad_events.61.desc: "[HOL.GetLeader] подписал[HOL.GetVerbGendEndA_RU] петицию, теперь она официально утверждена. Выполнение ее условий начнется вскоре после того, как будут согласованы окончательные детали."
 INS_volksraad_events.70.t: "Предложение фольксраада о публичной демонстрации националистических флагов и символики"
 INS_volksraad_events.70.desc: "[INS.GetLeader] одобрил[INS.GetVerbGendEndA_RU] петицию фольксраада о снятии ограничений на демонстрацию националистических флагов и символики в общественных местах [INS.GetNameRuGen]. Это позволит уменьшить радикализацию молодых националистов. [INS.GetLeader] настаивает на том, что мы должны занять оборонительную позицию по этому вопросу, сотрудничая с мирными националистическими лидерами и укрепляя свои революционные движения, однако окончательное решение остается за нами."
 INS_volksraad_events.71.t: "Вывешивать красно-белый флаг теперь не запрещено!"
 INS_volksraad_events.71.desc: "[HOL.GetLeader] подписал[HOL.GetVerbGendEndA_RU] петицию, теперь она официально утверждена. Выполнение ее условий начнется вскоре после того, как будут согласованы окончательные детали."
 INS_volksraad_events.100.t: "Предложение фольксраада о предоставлении образовательных субсидий негражданам Нидерландов"
 INS_volksraad_events.100.desc: "[INS.GetLeader] одобрил[INS.GetVerbGendEndA_RU] петицию фольксраада, согласно которой лица, которые не являются гражданами Нидерландов и живут на территории [INS.GetNameRuGen], смогут подавать заявки на получение образовательных субсидий. [HOL.GetLeader] получил[HOL.GetVerbGendEndA_RU] петицию для окончательного утверждения."
 INS_volksraad_events.101.t: "[INS.GetAdjective]ие граждане теперь могут получать образовательные субсидии"
 INS_volksraad_events.101.desc: "[HOL.GetLeader] подписал[HOL.GetVerbGendEndA_RU] петицию, теперь она официально утверждена. Выполнение ее условий начнется вскоре после того, как будут согласованы окончательные детали."
 ### INS - Dutch Interaction Events
 INS_dutch_events.1.t: "[INS.GetNameDefCap] запрашива[INS.GetNameEndRuPresentEtYut] контроль над нашим флотом"
 INS_dutch_events.1.desc: "После поражения нашей родины [INS.GetNameDef] выступа[INS.GetNameEndRuPresentEtYut] с требованием передать командование нашими военно-морскими силами [INS.GetNameRuDat] под предлогом того, что единое командование позволит лучше координировать совместные действия в это непростое время."
 INS_dutch_events.1.a: "Раз это пойдет нам на пользу, мы должны уступить."
 INS_dutch_events.1.b: "Наши корабли будут подчиняться только Гааге."
 INS_dutch_events.2.t: "[HOL.GetNameDefCap] принима[HOL.GetNameEndRuPresentEtYut] наше предложение о командовании флотом"
 INS_dutch_events.2.desc: "[HOL.GetNameDefCap] принима[HOL.GetNameEndRuPresentEtYut] наше предложение о передаче нам командования объединенными военно-морскими силами. Процесс проходит гладко: [HOL.GetAdjRuLower]ие и [INS.GetAdjRuLower]ие офицеры вместе работают над тем, чтобы укрепить наши позиции в Тихом океане."
 INS_dutch_events.2.a: "Вместе мы удержим Тихий океан."
 INS_dutch_events.3.t: "[HOL.GetNameDefCap] отклоня[HOL.GetNameEndRuPresentEtYut] наше предложение о командовании флотом"
 INS_dutch_events.3.desc: "[HOL.GetNameDefCap] отклоня[HOL.GetNameEndRuPresentEtYut] наше предложение о создании единого военно-морского командования, сославшись на логистические и административные проблемы. Мы разочарованы, но будем продолжать военное сотрудничество по другим направлениям."
 INS_dutch_events.3.a: "Мы найдем другой способ укрепить свой флот."
 INS_dutch_events.4.t: "[HOL.GetNameDefCap] созда[HOL.GetNameEndRuPresentEtYut] [HOL.GetAdjRuLower]о-[INS.GetAdjRuLower]ую военно-морскую программу"
 INS_dutch_events.4.desc: "[HOL.GetNameDefCap] объявля[HOL.GetNameEndRuPresentEtYut] о создании [HOL.GetAdjRuLower]о-[INS.GetAdjRuLower]ой военно-морской программы — совместной инициативы по реорганизации и расширению наших военно-морских сил. [HOL.GetAdjective]ий опыт и [INS.GetAdjRuLower]ие людские ресурсы позволят создать основу для новой системы обороны в Тихом океане."
 INS_dutch_events.4.a: "Еще один шаг в сторону совместного выживания."
 ### INS - Netherlands–Indonesia Union Events
 INS_union_events.1.t: "[HOL.GetNameDefCap] обраща[HOL.GetNameEndRuPresentEtYut]ся с просьбой о переносе правительства в регион [1058.GetName]"
 INS_union_events.1.desc: "После потери родины [HOL.GetNameDef] сообща[HOL.GetNameEndRuPresentEtYut] нам, что их правительство и королевская семья переедут в регион [1058.GetName]. Они пишут о преемственности и необходимости сохранить королевство там, где еще развевается флаг."
 INS_union_events.1.a: "Война продолжится с региона [1058.GetName]."
 INS_union_events.1.b: "Кем они себя возомнили? Это же попытка восстановить колониальное господство!"
 INS_union_events.2.t: "[INS.GetNameDefCap] принима[INS.GetNameEndRuPresentEtYut] предложение о переносе правительства"
 INS_union_events.2.desc: "[INS.GetNameDefCap] соглаша[INS.GetNameEndRuPresentEtYut]ся разместить наше правительство в изгнании на территории региона [1058.GetName]. Идет подготовка к переезду, обе администрации прорабатывают интеграцию министерств и персонала. Вместе мы понесем факел Королевства с востока."
 INS_union_events.2.a: "Создадим единый фронт против общего врага."
 INS_union_events.3.t: "[INS.GetNameDefCap] отклоня[INS.GetNameEndRuPresentEtYut] предложение о переносе правительства"
 INS_union_events.3.desc: "[INS.GetNameDefCap] отклоня[INS.GetNameEndRuPresentEtYut] нашу просьбу о переносе правительства в регион [1058.GetName]. [INS.GetLeader] заявил[INS.GetVerbGendEndA_RU], что мы не вправе требовать такой существенной помощи, пока они сами в тяжелом положении."
 INS_union_events.3.a: "Похоже, они забыли, чье знамя нас все еще связывает."
 INS_union_events.4.t: "[HOL.GetNameDefCap] перемеща[HOL.GetNameEndRuPresentEtYut] вооруженные силы в регион [1058.GetName]"
 INS_union_events.4.desc: "Первые корабли прибыли с родины. На их борту полно офицеров, солдат и того, что осталось от наших арсеналов. Как и ожидалось, некоторые конвои не добрались до порта. Уцелевшие войска составят костяк наших сил в регионе [1058.GetName]."
 INS_union_events.4.a: "Этого хватит, чтобы снова поднять наш флаг."
 # INS proposed union
 INS_union_events.5.t: "[INS.GetNameDefCap] предлага[INS.GetNameEndRuPresentEtYut] создать Нидерландско-Индонезийский Союз"
 INS_union_events.5.desc: "Всему миру ясно, что война складывается не в нашу пользу. Наша страна пала, и плацдарм наших войск переместился на восток. [INS.GetAdjective]ие министры направили нам предложение создать объединенное государство во главе с королевой Вильгельминой, чтобы максимально укрепить сотрудничество между нашими странами. Этому предложению, похоже, мало кто рад, но это наш шанс выжить."
 INS_union_events.5.a: "Мы вынуждены пойти на этот риск. Да здравствует королева!"
 INS_union_events.5.b: "Мы не можем на это согласиться."
 INS_union_events.6.t: "[HOL.GetNameDefCap] принима[HOL.GetNameEndRuPresentEtYut] предложение о союзе"
 INS_union_events.6.desc: "После срочного обсуждения в кабинете министров [HOL.GetLeader] одобряет [INS.GetAdjRuLower]ое предложение. Указ краток, его принятие не сопровождается церемониями. Отныне и до конца войны наши правительства будут действовать сообща под властью Короны."
 INS_union_events.6.a: "Это историческое соглашение для обеих стран."
 INS_union_events.7.t: "[HOL.GetNameDefCap] отклоня[HOL.GetNameEndRuPresentEtYut] предложение о союзе"
 INS_union_events.7.desc: "Совет [HOL.GetNameRuGen] отклонил предложение о союзе и дал понять, что сотрудничество продолжится, но каждое из государств останется независимым."
 INS_union_events.7.a: "Все равно из этого вряд ли бы что-то получилось."
 # HOL proposed union
 INS_union_events.8.t: "[HOL.GetNameDefCap] предлага[HOL.GetNameEndRuPresentEtYut] Нидерландско-Индонезийский Союз"
 INS_union_events.8.desc: "Всему миру ясно, что война складывается не в нашу пользу. [HOL.GetNameDef] пал[HOL.GetNameRuEndPast], плацдарм этой страны переместился на восток. [HOL.GetAdjective]ие лидеры направили нам предложение создать объединенное государство во главе с королевой Вильгельминой, чтобы максимально укрепить сотрудничество между нашими странами. Этому предложению, похоже, мало кто рад, но это наш шанс выжить."
 INS_union_events.8.a: "Да будет так."
 INS_union_events.8.b: "Это попытка восстановить колониальное господство."
 INS_union_events.9.t: "[INS.GetNameDefCap] принима[INS.GetNameEndRuPresentEtYut] предложение о союзе"
 INS_union_events.9.desc: "[INS.GetNameDefCap] соглаша[INS.GetNameEndRuPresentEtYut]ся на наше предложение. Неясно, что из этого получится, но сейчас мы вынуждены сосредоточить все усилия на войне."
 INS_union_events.9.a: "Если мы выстоим, то сделаем это вместе."
 INS_union_events.10.t: "[INS.GetNameDefCap] отклоня[INS.GetNameEndRuPresentEtYut] предложение о союзе"
 INS_union_events.10.desc: "[INS.GetNameDefCap] отклоня[INS.GetNameEndRuPresentEtYut] предложение о союзе. [INS.GetAdjective]ий народ и его лидеры не видят перспектив в таком объединении и выступают против любого ограничения власти."
 INS_union_events.10.a: "Все равно из этого вряд ли бы что-то получилось."
 # Flags
 INS_exile_accepted_flag: "Принимает правительство [HOL.GetNameRuGen] в изгнании"
 INS_hey_btw_you_are_gonna_die_just_know_that_yeah_tt: "§RВ результате игра для вас завершится.§!"
 # Revolution events
 INS_revolution_events.1.t: "[HOL.GetNameDefCap] собира[HOL.GetNameEndRuPresentEtYut]ся сокрушить республику"
 INS_revolution_events.1.desc: "Как и ожидалось, правительство Нидерландов в ответ на наше требование независимости направило солдат в регион [1058.GetName] и начало распространять антиреспубликанскую пропаганду через СМИ."
 INS_revolution_events.1.a: "Нужно действовать как можно быстрее."
 INS_revolution_events.2.t: "[HOL.GetNameDefCap] запрашива[HOL.GetNameEndRuPresentEtYut] дополнительную помощь"
 INS_revolution_events.2.desc: "[HOL.GetLeader] созывает экстренное совещание с нашими лидерами и просит оказать дальнейшую помощь в отвоевании Ост-Индии, вплоть до прямого участия в конфликте. [HOL.GetLeader] заявляет, что ситуация критическая, голландские войска не в состоянии оттеснить отряды революционного ополчения. [HOL.GetLeader] обещает, что если мы поможем, то получим Борнео."
 INS_revolution_events.2.a: "Мы пойдем на это ради Борнео."
 INS_revolution_events.2.b: "Нам это не интересно."
 INS_revolution_events.3.t: "[ENG.GetNameDefCap] ид[ENG.GetNameEndRuPresentEtYut] на соглашение между Лондоном и Батавией"
 INS_revolution_events.3.desc: "[ENG.GetNameDefCap] соглаша[ENG.GetNameEndRuPresentEtYut]ся напрямую вступить в конфликт, направив в Батавию несколько дивизий для участия в боевых действиях. Нам придется отдать им Борнео, но наши шансы на победу значительно вырастут."
 INS_revolution_events.3.a: "Борнео станет неизбежной жертвой."
 INS_revolution_events.4.t: "[ENG.GetNameDefCap] отверга[ENG.GetNameEndRuPresentEtYut] соглашение между Лондоном и Батавией"
 INS_revolution_events.4.desc: "[ENG.GetNameDefCap] отказыва[ENG.GetNameEndRuPresentEtYut]ся помогать нам в конфликте, несмотря на нашу тяжелую ситуацию и предложенное вознаграждение. [ENG.GetLeader] заявил[ENG.GetVerbGendEndA_RU], что сохранение нашей колониальной империи отвечает их интересам, однако риск глобальной эскалации после их вмешательства будет слишком высоким, поэтому нам придется действовать самим."
 INS_revolution_events.4.a: "Все это выглядит не лучшим образом."
 INS_revolution_events.5.t: "[HOL.GetNameDefCap] запрашива[HOL.GetNameEndRuPresentEtYut] помощь"
 INS_revolution_events.5.desc: "Революционеры в Голландской Ост-Индии объявили о независимости от [HOL.GetNameRuGen] и оккупировали крупные города. [HOL.GetLeader] обращается к нам со срочной просьбой оказать им военную помощь в период подготовки к вторжению."
 INS_revolution_events.5.a: "Если революционеры добьются успеха, жители наших колоний могут последовать их примеру."
 INS_revolution_events.5.b: "Нам это не интересно."
 INS_revolution_events.6.t: "[ENG.GetNameDefCap] соглаша[ENG.GetNameEndRuPresentEtYut]ся нам помочь"
 INS_revolution_events.6.desc: "[ENG.GetNameDefCap] соглаша[ENG.GetNameEndRuPresentEtYut]ся отправить добровольцев и снаряжение в регион [1058.GetName], чтобы помочь нам вернуть контроль над Ост-Индией."
 INS_revolution_events.6.a: "Это будет легко."
 INS_revolution_events.7.t: "[ENG.GetNameDefCap] отказыва[ENG.GetNameEndRuPresentEtYut]ся нам помочь"
 INS_revolution_events.7.desc: "[ENG.GetNameDefCap] отказыва[ENG.GetNameEndRuPresentEtYut]ся помочь нам вернуть контроль над Ост-Индией. Они утверждают, что дела Ост-Индии их не касаются, несмотря на близкое расположение к зоне конфликта. Нам придется самим перевооружить Королевскую голландскую ост-индскую армию."
 INS_revolution_events.7.a: "Это неприемлемо!"
 INS_revolution_events.8.t: "Ополченцы-революционеры что-то замышляют в Ост-Индии"
 INS_revolution_events.8.desc: "Наша колониальная полиция в Ост-Индии арестовала и допросила нескольких членов революционного движения, набирающего силу в Индонезии. Похоже, они пытаются нарастить военную силу, чтобы начать кампанию за национальную независимость. Они могут замышлять вооруженную революцию, хотя уверенности в этом у нас пока нет."
 INS_revolution_events.8.a: "Мы будем пристально следить за ситуацией."
 INS_revolution_events.9.t: "Декларация о независимости Индонезии"
 INS_revolution_events.9.desc: "Сегодня на Яве [INS.GetLeader] выступил[INS.GetVerbGendEndA_RU] с речью, объявив о независимости новообразованной Республики Индонезия. Мы не признаём эту республику, но ее ополченцы захватили ряд территорий, и наша полиция не в силах навести там порядок. Если мы не воспримем это всерьез, может начаться полномасштабная война."
 INS_revolution_events.9.a: "Это неприемлемо!"
 INS_revolution_events.9.b: "Не стоит тратить на это силы. Раз им так сильно нужна независимость, они её получат."
 #INS_revolution_events.10.t: ""
 #INS_revolution_events.10.desc: ""
 #INS_revolution_events.10.a: ""
 INS_revolution_events.11.t: "Вооруженные силы Ост-Индии успешно остановили кампанию ополченцев"
 INS_revolution_events.11.desc: "Группа республиканских ополченцев начала военную операцию по оккупации региона [?event_target:INS_temp_occupied_state.GetName]. Нашим доблестным солдатам в Ост-Индии удалось вытеснить силы ополчения, мы сохраняем полный контроль над ситуацией."
 INS_revolution_events.11.a: "Очередная победа [HOL.GetNameRuGen]."
 INS_revolution_events.12.t: "Ополченцы пытаются захватить регион [?event_target:INS_temp_occupied_state.GetName]"
 INS_revolution_events.12.desc: "Группа республиканских ополченцев начала военную операцию по захвату региона [?event_target:INS_temp_occupied_state.GetName]. Нашей полиции и солдатам все-таки удалось взять ситуацию под контроль, но это вызвало недовольство в регионе [?event_target:INS_temp_occupied_state.GetName]. Многие гражданские лица поддерживают ополченцев и публично выступают против [HOL.GetAdjRuLower]ого правительства."
 INS_revolution_events.12.a: "Нельзя допустить эскалации конфликта."
 INS_revolution_events.14.t: "Ополченцы захватили регион [?event_target:INS_temp_occupied_state.GetName]"
 INS_revolution_events.14.desc: "Несмотря на все усилия нашей колониальной полиции и солдат, республиканские ополченцы успешно начали военную операцию по захвату региона [?event_target:INS_temp_occupied_state.GetName]. Полицейским и солдатам пришлось эвакуироваться, они объявили о неспособности вернуть контроль над регионом из-за сопротивления ополченцев. Позволяя ополченцам совершать такое, мы рискуем навсегда потерять нашу великую колонию."
 INS_revolution_events.14.a: "Это возмутительно!"
 INS_revolution_no_effect_tt: "Нет эффектов"
 INS_revolution_events.19.t: "Мирные переговоры в Ост-Индии"
 INS_revolution_events.19.desc: "[HOL.GetLeader] и [INS.GetLeader] встретились, чтобы обсудить потенциальное мирное соглашение. [INS.GetLeader] заявил[INS.GetVerbGendEndA_RU], что погибло уже слишком много людей. Кроме того, [INS.GetLeader] предложил[INS.GetVerbGendEndA_RU] навсегда прекратить боевые действия и создать два государства, чьи границы останутся почти такими же, как и сейчас."
 INS_revolution_events.19.a: "Мы должны согласиться. Жертв и так уже очень много."
 INS_revolution_events.19.b: "Если вы так сильно хотите мира, то сдавайтесь!"
 INS_revolution_events.20.t: "[HOL.GetNameDefCap] соглаша[HOL.GetNameEndRuPresentEtYut]ся образовать два государства!"
 INS_revolution_events.20.desc: "[INS.GetLeader] и [HOL.GetLeader] провели плодотворную встречу. Стороны договорились решить проблему путем создания двух государств, и мы немедленно начнем переброску войск в соответствии с новыми границами. Никто не рад тому, что пришлось оставить наших соотечественников-индонезийцев на произвол судьбы, однако решение прекратить боевые действия пойдет на пользу всем."
 INS_revolution_events.20.a: "Кровопролитие наконец-то прекратится."
 INS_revolution_events.21.t: "[HOL.GetNameDefCap] отказыва[HOL.GetNameEndRuPresentEtYut]ся прекратить сражение"
 INS_revolution_events.21.desc: "[INS.GetLeader] и [HOL.GetLeader] встретились, но их переговоры не увенчались успехом: обе стороны вели себя агрессивно и отказались от компромисса, в результате чего встреча вышла очень короткой."
 INS_revolution_events.21.a: "Сколько еще жизней будет потеряно?"
 INS_revolution_events.22.t: "[HOL.GetNameDefCap] запрашива[HOL.GetNameEndRuPresentEtYut] помощь"
 INS_revolution_events.22.desc: "[HOL.GetLeader] и [FRA.GetLeader] встретились в Амстердаме и обсудили текущую ситуацию в Ост-Индии — эту встречу созвал[HOL.GetVerbGendEndA_RU] [HOL.GetLeader]. Там [HOL.GetOnOna_RU] рассказал[HOL.GetVerbGendEndA_RU], что революционеры слишком быстро вооружают ополчение, голландская армия с этим не справляется и [HOL.GetNameDef] риску[HOL.GetNameEndRuPresentEtYut] потерять свою колониальную гегемонию. [HOL.GetLeader] попросил[HOL.GetVerbGendEndA_RU] нас официально присоединиться к конфликту на стороне Нидерландов и отправить дивизии в Батавию, чтобы помочь в отвоевании Ост-Индии. Взамен, когда порядок будет восстановлен, мы получим право на северо-восточную Суматру."
 INS_revolution_events.22.a: "Помощь наверняка обойдется нам недешево, но Суматра, пожалуй, того стоит."
 INS_revolution_events.22.b: "Это слишком большой риск."
 INS_revolution_events.23.t: "[FRA.GetNameDefCap] соглаша[FRA.GetNameEndRuPresentEtYut]ся нам помочь!"
 INS_revolution_events.23.desc: "[FRA.GetNameDefCap] соглаша[FRA.GetNameEndRuPresentEtYut]ся нам помочь и отправля[FRA.GetNameEndRuPresentEtYut] в Батавию множество французских дивизий на помощь нам."
 INS_revolution_events.23.a: "Перевес теперь на нашей стороне."
 INS_revolution_events.24.t: "[FRA.GetNameDefCap] отказыва[FRA.GetNameEndRuPresentEtYut]ся помогать."
 INS_revolution_events.24.desc: "[FRA.GetNameDefCap] отказыва[FRA.GetNameEndRuPresentEtYut]ся помогать нам в подавлении революции. Надо как можно скорее начать перевооружение, иначе нас просто сметут."
 INS_revolution_events.24.a: "Все это выглядит не лучшим образом."
 INS_revolution_events.25.t: "Конец войны в Индонезии"
 INS_revolution_events.25.desc: "[HOL.GetAdjective]ие войска уничтожили основные базы ополчения и свергли республиканское правительство. Их элита и командиры арестованы, а правительство Ост-Индии восстанавливает свою деятельность на территории бывшей республики. Мы также получили территории, которые были обещаны нам за помощь."
 INS_revolution_events.25.a: "Чудесно!"
 INS_revolution_events.26.t: "Конец войны в Индонезии"
 INS_revolution_events.26.desc: "[HOL.GetAdjective]ие силы и республиканские ополчения воевали гораздо дольше, чем предполагали обе стороны, поэтому в конце концов [HOL.GetLeader] соглашается подписать мирное соглашение, согласно которому будут образованы два государства. Несмотря на это, [HOL.GetLeader] заверяет, что мы все равно получим территории, которые нам были обещаны, так как выполнили свою часть уговора."
 INS_revolution_events.26.a: "Любопытное развитие событий."
 INS_revolution_events.27.t: "Конец войны в Индонезии"
 INS_revolution_events.27.desc: "[HOL.GetAdjective]ие силы и республиканские ополчения воевали гораздо дольше, чем предполагали обе стороны. Несмотря на усилия [HOL.GetNameRuGen] и наше собственное военное участие, из-за огромного количества ополченцев и партизанского характера их войск ситуация зашла в тупик, причем перевес оказался явно на стороне республиканцев. По этой причине лидер [HOL.GetLeader] сегодня объявил[HOL.GetVerbGendEndA_RU] о подписании мирного соглашения в пользу республиканцев, согласно которому будут образованы два государства. От Ост-Индии осталась лишь тень былой славы. [HOL.GetLeader] заявляет, что раз конфликт закончился поражением, то мы не получим обещанную нам ранее территорию."
 INS_revolution_events.27.a: "Это безумие!"
 INS_revolution_events.28.t: "Падение Ост-Индии"
 INS_revolution_events.28.desc: "Несмотря на значительные военные расходы [HOL.GetNameRuGen] и наш прямой вклад в конфликт, огромное количество ополченцев в Ост-Индии сумело подавить наши силы, захватить все крупные города, свергнуть голландскую администрацию и принудить ее к капитуляции."
 INS_revolution_events.28.a: "Но нам обещали новую территорию!"
 INS_revolution_events.29.t: "Падение Ост-Индии"
 INS_revolution_events.29.desc: "Несмотря на все наши усилия, революционеры в Ост-Индии захватили контроль над нашими крупными городами и разрушили колониальное правительство изнутри. Наши генералы захвачены в плен, а линии связи перерезаны. У нас нет иного выбора, кроме как признать поражение."
 INS_revolution_events.29.a: "Это настоящая трагедия."
 INS_revolution_events.30.t: "[INS.GetLeader] предлагает локальное прекращение огня"
 INS_revolution_events.30.desc: "[INS.GetLeader] предлагает локальное прекращение огня на территории [FROM.GetNameRuGen], а если мы согласимся, обещает вывести свои войска из [FROM.GetNameRuGen], что позволит нашим войскам восстановить контроль над регионом. Однако это случится, только если мы временно отложим свои основные военные операции, дав революционерам время спланировать дальнейшие действия."
 INS_revolution_events.30.a: "Мы согласны."
 INS_revolution_events.30.b: "Мы отказываемся, чтобы вернуть себе [FROM.GetNameRuAcc] силой!"
 INS_revolution_events.31.t: "[HOL.GetNameDefCap] принима[FROM.GetNameEndRuPresentEtYut] предложение о перемирии на территории [FROM.GetNameRuGen]"
 INS_revolution_events.31.desc: "Переговоры о прекращении огня прошли успешно. [HOL.GetLeader] соглашается на наши условия. Мы приказали командирам ополчений немедленно вывести свои войска из [FROM.GetNameRuGen]."
 INS_revolution_events.31.a: "Надеемся, они выполнят свою часть соглашения."
 INS_revolution_events.32.t: "[HOL.GetNameDefCap] отказыва[HOL.GetNameEndRuPresentEtYut]ся от перемирия"
 INS_revolution_events.32.desc: "Переговоры о перемирии прошли не по плану. [HOL.GetLeader] не подписал[HOL.GetVerbGendEndA_RU] соглашение и прервал[HOL.GetVerbGendEndA_RU] переговоры прежде, чем удалось достичь какого-либо компромисса."
 INS_revolution_events.32.a: "Это неприемлемо!"
 INS_revolution_events.33.t: "[INS.GetNameDefCap] предлага[INS.GetNameEndRuPresentEtYut] нам стать посредником"
 INS_revolution_events.33.desc: "Индонезийские республиканцы официально обратились к нам за помощью в достижении соглашения с Нидерландами. Наши советники в регионе сообщают, что ситуация быстро ухудшается. Если Нидерланды продолжат военные действия, националисты рискуют угодить в лапы Советского Союза. Нидерланды — наш ценный союзник в Европе, но мы не можем игнорировать политические реалии Юго-Восточной Азии. Если из-за нашего бездействия Индонезия падет под натиском коммунизма, это станет нашей личной неудачей."
 INS_revolution_events.33.a: "Направим посредников."
 INS_revolution_events.33.b: "Мы не можем рисковать отношениями с голландцами."
 INS_revolution_events.34.t: "[FROM.GetNameDefCap] соглаша[FROM.GetNameEndRuPresentEtYut]ся стать посредником"
 INS_revolution_events.34.desc: "Вашингтон согласился выступить посредником между нашим правительством и Нидерландами. Американские посланники уже в пути, теперь у нас появится реальная возможность заключить перемирие. Когда в переговорах примет участие ведущая мировая держава, Нидерландам будет гораздо сложнее затягивать процесс или прибегать к силе. Мы должны твердо стоять на своем, а американцы пусть занимаются тем, что умеют лучше всего."
 INS_revolution_events.34.a: "Будем надеяться, что голландцы согласятся."
 INS_revolution_events.35.t: "[USA.GetNameDefCap] заявля[USA.GetNameEndRuPresentEtYut] об участии в переговорах"
 INS_revolution_events.35.desc: "Американцы вмешались в решение индонезийского вопроса. Вашингтон заявляет, что выступает в роли нейтрального посредника, но его посыл очевиден. Если мы не прислушаемся к их мнению и не разрешим этот конфликт, они задействуют против нас все свои рычаги влияния. Нашим переговорщикам следует действовать осторожно. Не стоит идти наперекор Америке."
 INS_revolution_events.35.a: "Мы решим этот вопрос на своих условиях."
 INS_revolution_events.36.t: "[FROM.GetNameDefCap] отказыва[FROM.GetNameEndRuPresentEtYut]ся вмешиваться"
 INS_revolution_events.36.desc: "Американцы отказались быть посредниками. Вашингтон предпочел занять сторону своих европейских союзников, вместо того чтобы поддержать нашу борьбу за самоопределение. Мы остались одни. Это тяжелый удар, но и революцию мы начинали не потому, что ожидали поддержки со стороны иностранных держав."
 INS_revolution_events.36.a: "Мы победим и без них."
 INS_revolution_events.37.t: "[USA.GetNameDefCap] предъявля[USA.GetNameEndRuPresentEtYut] ультиматум"
 INS_revolution_events.37.desc: "Американцы потеряли терпение. Вашингтон предъявил ультиматум — он требует немедленно прекратить все боевые действия и признать суверенитет Индонезии. Это почти неприкрытая угроза. Если публично разорвать отношения с американцами, наш международный авторитет пострадает, а экономике будет нанесен весомый ущерб. Генералы утверждают, что кампанию еще можно выиграть, но какова будет цена этой победы?"
 INS_revolution_events.37.a: "У нас не остается иного выбора, кроме как подчиниться."
 INS_revolution_events.37.b: "Индонезия принадлежит нам, и мы не отступим."
 INS_revolution_events.38.t: "Голландцы уступают"
 INS_revolution_events.38.desc: "Все кончено. Правительство Нидерландов приняло американский ультиматум и признало наш суверенитет. Триста пятьдесят лет колониального господства закончились не на поле боя, а за столом переговоров, при поддержке величайшей мировой державы. Республика наконец-то стала нашей, по-настоящему и целиком."
 INS_revolution_events.38.a: "Свобода!"
 INS_revolution_events.39.t: "Голландцы ответили отказом"
 INS_revolution_events.39.desc: "Вопреки всем ожиданиям, голландцы отвергли американский ультиматум. Видимо, их генералы верят, что успеют победить в войне, прежде чем Вашингтон предпримет какие-либо действия. Однако они ошибаются. Теперь, когда американцы открыто нас поддерживают, баланс сил значительно изменился. Пусть приходят. Мы больше не воюем в одиночку."
 INS_revolution_events.39.a: "Весь мир за нас."
 INS_revolution_events.40.t: "Голландцы принимают наши требования"
 INS_revolution_events.40.desc: "Гаага приняла наш ультиматум. Голландские войска покинут Индонезию, и наша республика получит независимость. Печальный эпизод нашей истории наконец-то завершился. Стабильная и независимая Индонезия будет лучше служить нашим интересам, чем колониальная структура, которой Нидерланды больше не в силах управлять."
 INS_revolution_events.40.a: "Правильное решение."
 INS_revolution_events.41.t: "Голландцы бросают нам вызов"
 INS_revolution_events.41.desc: "Гаага отвергла наш ультиматум. Голландские войска продолжают вести боевые действия в Индонезии, открыто игнорируя требования Америки. Нидерланды совершают роковую ошибку. Они не могут одновременно вести колониальную войну в Азии и рассчитывать на помощь американцев в Европе. Что ж, тем хуже для них."
 INS_revolution_events.41.a: "Значит, война."
 INS_revolution_events.42.t: "Последний бросок кубика"
 INS_revolution_events.42.desc: "Наши разведчики в Батавии сообщают о невиданных ранее масштабах вражеской подготовки. Похоже, республиканцы планируют провести дестабилизирующую операцию, чтобы начать штурм Явы и уничтожить все наши коммуникации, после чего победа будет фактически у них в кармане. Однако эта крайне рискованная операция потребует от них задействовать почти все ресурсы. По оценке наших генералов, мы сможем удерживать эту позицию около двух лет и выбить нас оттуда будет нелегко. Если нам удастся сдерживать их достаточно долго, мы сможем раздавить их правительство и революцию, словно перезрелый томат."
 INS_revolution_events.42.a: "Начинается последний бой."
 INS_revolution_events.43.t: "Создана база ополчения в регионе [FROM.GetName]"
 INS_revolution_events.43.desc: "Мы добились своей цели в регионе [FROM.GetName], и местные лидеры ополчения подтвердили, что будут готовы действовать в назначенный час."
 INS_revolution_events.43.a: "Мы не должны останавливаться на достигнутом."
 # Chaos Events
 INS_chaos_events.1.t: "Битва в Сурабае"
 INS_chaos_events.1.desc: "После провозглашения независимости ситуация в Сурабае вышла из-под контроля. Сегодня группа голландских лоялистов подняла старый колониальный флаг над бывшим отелем «Ямато». Члены местного молодежного движения ворвались в здание и сняли флаг, подняв вместо него красно-белое знамя Индонезии. Это происшествие привело к ожесточенным и неорганизованным столкновениям."
 INS_chaos_events.1.a: "Так и надо!"
 INS_chaos_events.1.b: "Нужно призвать всех к порядку, эскалация конфликта не в наших интересах."
 INS_chaos_events.2.t: "Слияние социалистических партий"
 INS_chaos_events.2.desc: "Сегодня две крупнейшие социалистические партии Индонезии и их лидеры, Амир Шарифуддин и Сутан Шарир, объединились, в результате чего возникла единая Социалистическая партия Индонезии. Она получит гораздо больше политического влияния, что может представлять угрозу для нашей администрации."
 INS_chaos_events.2.a: "Разрешим это слияние."
 INS_chaos_events.2.b: "Нет времени на политику, объявляем военное положение!"
 INS_chaos_events.3.t: "Неудачное покушение на Сукарно"
 INS_chaos_events.3.desc: "Сегодня голландский солдат попытался убить Сукарно, обстреляв его автомобиль. К счастью, Сукарно в машине не оказалось, однако его шофер был тяжело ранен. Покушение закончилось неудачей, но очевидно, что оно не последнее, как со стороны голландских солдат, так и со стороны индонезийской оппозиции."
 INS_chaos_events.3.a: "Мы должны восстановить порядок!"
 INS_chaos_events.4.t: "Убийство Сукарно"
 INS_chaos_events.4.desc: "Сегодня Индонезию постигло несчастье. На Сукарно было совершено очередное покушение, которое в этот раз увенчалось успехом. Теперь нельзя допустить кризиса власти. Мы должны быстро восстановить порядок, иначе обстановка в республике может выйти из-под контроля."
 INS_chaos_events.4.a: "Власть перейдет к вице-президенту Хатте."
 INS_chaos_events.4.b: "Власть перейдет к Социалистической партии."
 INS_chaos_events.4.c: "Долой республику, к победе нас поведет Тан Малака!"
 # Loyalist Events
 INS_loyalist_events.1.t: "[INS.GetLeader] просит о переводе Генри Винкельмана"
 INS_loyalist_events.1.desc: "[INS.GetLeader] выражает беспокойство по поводу того, что в мире продолжаются конфликты, а [INS.GetNameDef] по-прежнему в опасном положении. В связи с этим [INS.GetOnOna_RU] предлагает официально перевести Генри Винкельмана, бывшего командующего Королевской голландской ост-индской армией, обратно на территорию [INS.GetNameRuGen], чтобы обеспечить безопасность колонии."
 INS_loyalist_events.1.a: "Мы немедленно распорядимся о его переводе."
 INS_loyalist_events.1.b: "Генри Винкельман нужен на родине."
 INS_loyalist_events.2.t: "[HOL.GetLeader] соглашается на перевод Генри Винкельмана"
 INS_loyalist_events.2.desc: "[INS.GetLeader] и [HOL.GetLeader] провели встречу на территории [HOL.GetNameRuGen]. [INS.GetLeader] возвращается с хорошими новостями. [HOL.GetLeader] выслушал[HOL.GetVerbGendEndA_RU] наши доводы и дал[HOL.GetVerbGendEndA_RU] свое согласие на немедленный перевод Генри Винкельмана. Сейчас Винкельман направляется в регион [1058.GetName], где будет ждать наших приказов."
 INS_loyalist_events.2.a: "Его помощь нам пригодится."
 INS_loyalist_events.3.t: "[HOL.GetLeader] отказывается переводить Генри Винкельмана"
 INS_loyalist_events.3.desc: "[INS.GetLeader] и [HOL.GetLeader] провели встречу на территории [HOL.GetNameRuGen]. [INS.GetLeader] возвращается с печальными новостями. Генри Винкельмана не отправят в Ост-Индию, и нам придется обороняться без него."
 INS_loyalist_events.3.a: "Нужно срочно придумать новый план."
 INS_henri_winkelman_tt: "В переводе Генри Винкельмана отказано"
 # MALAYA CHAIN - Independent Malaya
 INS_loyalist_events.4.t: "[FROM.GetNameDefCap] предлагает объединение"
 INS_loyalist_events.4.desc: "[ROOT.Capital.GetCapitalVictoryPointName] принимает [FROM.GetAdjRuLower]ую делегацию, которая прибыла с предложением об объединении. [FROM.GetAdjective]ие дипломаты указывают на общее малайское наследие наших народов и отмечают, что границы между нашими странами были установлены европейскими колониальными администрациями, а не коренными жителями этих земель. Согласно предложению оба правительства будут распущены, и мы станем единым государством."
 INS_loyalist_events.4.a: "Мы принимаем это предложение."
 INS_loyalist_events.4.b: "Мы вынуждены отказаться."
 INS_loyalist_events.5.t: "[FROM.GetNameDefCap] соглашается на объединение"
 INS_loyalist_events.5.desc: "Наши дипломаты вернулись из региона [FROM.Capital.GetCapitalVictoryPointName] с отличными новостями. [FROM.GetAdjective]ое правительство приняло наше предложение, и его представители уже готовятся к объединению наших государств."
 INS_loyalist_events.5.a: "Вместе мы сильнее!"
 INS_loyalist_events.6.t: "[FROM.GetNameDefCap] не соглашается на объединение"
 INS_loyalist_events.6.desc: "Наши дипломаты вернулись из региона [FROM.Capital.GetCapitalVictoryPointName] ни с чем. [FROM.GetAdjective]ое правительство не приняло наше предложение. Нашей делегации назвали несколько причин отказа, а затем отправили домой, ограничившись вежливыми формальностями."
 INS_loyalist_events.6.a: "Им же хуже."
 # MALAYA CHAIN - Subject Malaya (Overlord receives)
 INS_loyalist_events.7.t: "[FROM.GetNameDefCap] требу[FROM.GetNameEndRuPresentEtYut] провести [MAL.GetAdjRuLower]ий референдум"
 INS_loyalist_events.7.desc: "[FROM.GetNameDefCap] официально обраща[FROM.GetNameEndRuPresentEtYut]ся к нам с просьбой разрешить проведение референдума на территории [MAL.GetNameRuGen] по вопросу объединения с их государством. Их посол прямо заявил о вероятном результате, отметив, что малайцы по обе стороны границы считают себя одной нацией. Если мы разрешим провести голосование, то наверняка потеряем [MAL.GetNameRuAcc]."
 INS_loyalist_events.7.a: "Пусть решает народ."
 INS_loyalist_events.7.b: "Мы этого не допустим."
 # MALAYA CHAIN - Subject Malaya (MAL receives after overlord agrees)
 INS_loyalist_events.8.t: "[FROM.GetNameDefCap] соглаша[FROM.GetNameEndRuPresentEtYut]ся провести референдум"
 INS_loyalist_events.8.desc: "Метрополия разрешила [FROM.FROM.GetNameRuDat] провести референдум в нашей стране. К нам уже прибыло множество [FROM.FROM.GetAdjRuLower]их активистов, голосование должно начаться в течение месяца. Народу будет задан простой вопрос: мы хотим присоединиться к [FROM.FROM.GetNameRuDat] или оставить все без изменений?"
 INS_loyalist_events.8.a: "Мы к ним присоединимся."
 INS_loyalist_events.8.b: "Лучше оставим все как есть."
 # MALAYA CHAIN - Overlord informed of MAL's choice
 INS_loyalist_events.9.t: "[FROM.GetNameDefCap] голосу[FROM.GetNameEndRuPresentEtYut] против объединения"
 INS_loyalist_events.9.desc: "Референдум среди жителей [FROM.GetNameRuGen] завершился. Они проголосовали за то, чтобы остаться под нашим управлением. [FROM.FROM.GetAdjective]ие активисты покинули страну."
 INS_loyalist_events.9.a: "Как мы и ожидали."
 INS_loyalist_events.10.t: "[FROM.GetNameDefCap] голосу[FROM.GetNameEndRuPresentEtYut] за объединение"
 INS_loyalist_events.10.desc: "Референдум среди жителей [FROM.GetNameRuGen] завершился. Большинство проголосовало за объединение с [FROM.FROM.GetNameRuInst]. Наша администрация в регионе сообщает, что результат был ожидаемым. Нам остается только исполнить волю народа."
 INS_loyalist_events.10.a: "Мы дали слово."
 # MALAYA CHAIN - INS receives result
 INS_loyalist_events.11.t: "Малайский референдум увенчался успехом"
 INS_loyalist_events.11.desc: "Жители [MAL.GetNameRuGen] проголосовали за присоединение к нашему государству. [MAL.GetAdjective]ие должностные лица вместе с нашей администрацией приступили к процессу передачи власти. Скоро на карте малайского мира станет на одну границу меньше."
 INS_loyalist_events.11.a: "С возвращением!"
 INS_loyalist_events.12.t: "Объединение малайцев не состоится"
 INS_loyalist_events.12.desc: "Наше предложение об объединении с [MAL.GetNameRuInst] было отклонено. [MAL.GetAdjective]ое правительство и, видимо, те, кто стоит над ним, не поддержали нашу инициативу. Что ж, мы еще вернемся к этому вопросу в более подходящее время."
 INS_loyalist_events.12.a: "Мы этого не забудем."
 INS_loyalist_events.13.t: "[FROM.GetNameDefCap] предлага[FROM.GetNameEndRuPresentEtYut] компромисс по поводу Сингапура"
 INS_loyalist_events.13.desc: "[FROM.GetAdjective]ое правительство обратилось к нам с предложением по поводу Сингапура. Они просят передать им остров, ссылаясь на то, насколько он важен в малайском мире. Взамен они готовы предоставить нам постоянный доступ к порту и его военным объектам, а также сохранят за нами все действующие права на добычу ресурсов."
 INS_loyalist_events.13.a: "Это справедливая сделка."
 INS_loyalist_events.13.b: "Сингапур не продается."
 INS_loyalist_events.14.t: "Компромисс по поводу Сингапура достигнут"
 INS_loyalist_events.14.desc: "Сделка состоялась. Сингапур перейдет под наш контроль, а его бывшие владельцы сохранят за собой право доступа к порту в торговых и военных целях. Теперь наш флаг развевается над одной из важнейших гаваней Азии."
 INS_loyalist_events.14.a: "Пролив наш!"
 INS_loyalist_events.15.t: "Компромисс по поводу Сингапура не достигнут"
 INS_loyalist_events.15.desc: "Наше предложение было отклонено. Силы, которые сейчас контролируют Сингапур, не желают расставаться с островом ни при каких условиях. Мы предложили им все в обмен на независимость, но этого оказалось недостаточно."
 INS_loyalist_events.15.a: "Значит, война."
 INS_loyalist_events.16.t: "[FROM.GetNameDefCap] требу[FROM.GetNameEndRuPresentEtYut] передачи Цейлона"
 INS_loyalist_events.16.desc: "[FROM.GetAdjective]ое правительство направило нам официальный запрос о передаче Цейлона. Их дипломаты ссылаются на давние торговые и этнические связи между островом и малайским миром. Честно говоря, это утверждение звучит довольно сомнительно, но [FROM.GetNameDef] облада[FROM.GetNameEndRuPresentEtYut] значительным влиянием в регионе, поэтому к подобному запросу стоит отнестись серьезно."
 INS_loyalist_events.16.a: "Хорошо, пусть забирают Цейлон."
 INS_loyalist_events.16.b: "Цейлон останется под нашим контролем."
 INS_loyalist_events.17.t: "Состоялась передача Цейлона"
 INS_loyalist_events.17.desc: "Вопрос с Цейлоном разрешился. Наши чиновники уже прибыли на место, передача острова прошла без происшествий. Теперь мы контролируем берега по обе стороны пролива."
 INS_loyalist_events.17.a: "Отлично."
 INS_loyalist_events.18.t: "Просьба о передаче Цейлона отклонена"
 INS_loyalist_events.18.desc: "Наша просьба о передаче Цейлона была отклонена. Силы, которые сейчас контролируют остров, не намерены с ним расставаться. Наши дипломаты сообщают, что дальнейшие обсуждения по этому вопросу результатов не принесут."
 INS_loyalist_events.18.a: "Возможно, получится в другой раз."
 INS_loyalist_events.19.t: "[FROM.GetNameDefCap] требу[FROM.GetNameEndRuPresentEtYut] провести референдум в Папуа"
 INS_loyalist_events.19.desc: "[FROM.GetNameDefCap] требу[FROM.GetNameEndRuPresentEtYut], чтобы мы разрешили провести референдум в Восточном Папуа. На [FROM.GetAdjRuLower]ой стороне проложены новые дороги через джунгли, есть больницы с государственными врачами и школы, где преподают на местных языках. Последний губернатор с нашей стороны посетил Порт-Морсби всего два раза за последние три года. [FROM.GetAdjective]ому послу даже не пришлось ничего добавлять к этому."
 INS_loyalist_events.19.a: "Пусть голосуют."
 INS_loyalist_events.19.b: "Мы этого не допустим."
 INS_loyalist_events.20.t: "Референдум в Папуа одобрен"
 INS_loyalist_events.20.desc: "Австралийцы согласились провести референдум. По всему Восточному Папуа были получены одни и те же результаты. Наши инвестиции в западную часть острова оказались в разы нагляднее любого агитационного плаката."
 INS_loyalist_events.20.a: "Остров наконец-то стал единым целым."
 INS_loyalist_events.21.t: "Референдум в Папуа не одобрен"
 INS_loyalist_events.21.desc: "Австралийцы нам отказали. Их губернатор в Порт-Морсби заявил, что наша просьба оскорбляет австралийский суверенитет. Спросить мнение жителей Папуа при этом никто не удосужился."
 INS_loyalist_events.21.a: "Мы это запомним."
 INS_loyalist_events.22.t: "[FROM.GetNameDefCap] требу[FROM.GetNameEndRuPresentEtYut] передать Восточный Тимор"
 INS_loyalist_events.22.desc: "[FROM.GetAdjective]ое правительство официально потребовало от нас покинуть Восточный Тимор. Их посол отметил, что наш гарнизон насчитывает менее двухсот человек, а Лиссабон уже много лет почти ничего не тратит на развитие этой территории. Затем посол спросил, что именно, по нашему мнению, мы здесь удерживаем."
 INS_loyalist_events.22.a: "За эту землю не стоит сражаться."
 INS_loyalist_events.22.b: "Тимор принадлежит нам, и мы его не отдадим."
 INS_loyalist_events.23.t: "Восточный Тимор сдан"
 INS_loyalist_events.23.desc: "Силы, удерживавшие Восточный Тимор, начали выводить свой гарнизон и вывозить чиновников колониальной администрации. Весь остров вскоре перейдет под [INS.GetAdjRuLower]ий контроль."
 INS_loyalist_events.23.a: "Именно так и должно быть."
 INS_loyalist_events.24.t: "Требование передать Восточный Тимор отклонено"
 INS_loyalist_events.24.desc: "Губернатор колонии лично отправил нам письмо из Дили с отказом удовлетворить наше требование, настаивая на том, что Восточный Тимор остается суверенной территорией его правительства. Наш генеральный штаб разработал планы действий на случай, если кабинет министров захочет продолжить обсуждение этого вопроса."
 INS_loyalist_events.24.a: "Начнем подготовку."
 INS_loyalist_events.25.t: "[FROM.GetNameDefCap] предлагает объединение"
 INS_loyalist_events.25.desc: "[FROM.GetAdjective]ие представители прибыли с предложением объединить две наши республики. По их словам, у наших народов есть общие австронезийские корни, гораздо более древние, чем разделяющие нас колониальные границы. Единое государство, охватывающее весь архипелаг, стало бы ведущей державой в Юго-Восточной Азии. Если мы примем их предложение, нам придется распустить свою администрацию и интегрироваться в их правительство."
 INS_loyalist_events.25.a: "Мы согласны."
 INS_loyalist_events.25.b: "Мы не для того сражались за свою республику."
 INS_loyalist_events.26.t: "[FROM.GetNameDefCap] соглашается на объединение"
 INS_loyalist_events.26.desc: "[FROM.GetAdjective]ое правительство приняло наше предложение. Их представители уже координируют свои действия с нашими, чтобы начать процесс интеграции. От Ачеха до Лусона, от Борнео до Минданао — наша страна теперь занимает всю территорию Малайского архипелага."
 INS_loyalist_events.26.a: "Мы на пороге новой эпохи."
 INS_loyalist_events.27.t: "[FROM.GetNameDefCap] не соглашается на объединение"
 INS_loyalist_events.27.desc: "[FROM.GetAdjective]ое правительство ответило нам отказом. Они получили независимость совсем недавно и пролили ради этого немало крови, поэтому сейчас не готовы передавать свой суверенитет другому государству. Придется отложить наше предложение на потом."
 INS_loyalist_events.27.a: "Жаль."
 INS_loyalist_events.28.t: "[FROM.GetNameDefCap] требу[FROM.GetNameEndRuPresentEtYut] провести [PHI.GetAdjRuLower]ий референдум"
 INS_loyalist_events.28.desc: "[FROM.GetNameDefCap] официально обраща[FROM.GetNameEndRuPresentEtYut]ся к нам с просьбой разрешить проведение референдума на территории [PHI.GetNameRuGen] по вопросу объединения. Их дипломаты отмечают, что у обоих народов есть общее австронезийское происхождение и что разделяющие их колониальные границы созданы искусственно. Если голосование состоится, то результат, скорее всего, будет в пользу [FROM.GetNameRuGen]."
 INS_loyalist_events.28.a: "Пусть народ выскажется."
 INS_loyalist_events.28.b: "Ни в коем разе."
 INS_loyalist_events.29.t: "Референдум об объединении одобрен"
 INS_loyalist_events.29.desc: "[FROM.FROM.GetNameDefCap] предлага[FROM.FROM.GetNameEndRuPresentEtYut] объединить две наши страны на основании общего австронезийского наследия. Метрополия разрешила им провести референдум по этому вопросу, и [FROM.FROM.GetAdjRuLower]ие активисты уже начали к нам прибывать. Подсчет голосов определит, присоединится ли наша республика к [FROM.FROM.GetNameRuDat] или продолжит существовать в рамках нынешнего соглашения."
 INS_loyalist_events.29.a: "Интересное предложение."
 INS_loyalist_events.29.b: "Это исключено."
 INS_loyalist_events.30.t: "[FROM.GetNameDefCap] голосу[FROM.GetNameEndRuPresentEtYut] против объединения"
 INS_loyalist_events.30.desc: "Подсчет голосов завершен, и [FROM.FROM.GetAdjRuLower]ие активисты отправились домой. [FROM.GetAdjective]ий народ проголосовал за то, чтобы сохранить независимость. Похоже, регион [FROM.Capital.GetCapitalVictoryPointName] по-прежнему ее ценит."
 INS_loyalist_events.30.a: "Это конец."
 INS_loyalist_events.31.t: "[FROM.GetNameDefCap] голосу[FROM.GetNameEndRuPresentEtYut] за объединение"
 INS_loyalist_events.31.desc: "Подсчет голосов завершен. [FROM.GetAdjective]ий народ отдал свое предпочтение [FROM.FROM.GetNameRuDat], причем разрыв оказался существенным. Наши чиновники уже получили указания о передаче дел новой администрации."
 INS_loyalist_events.31.a: "Такова воля народа."
 INS_loyalist_events.32.t: "[PHI.GetNameDefCap] голосу[PHI.GetNameEndRuPresentEtYut] за объединение"
 INS_loyalist_events.32.desc: "[PHI.GetAdjective]ий референдум завершился в нашу пользу. Их правительство приняло результаты голосования и уже связалось с нашим министерством иностранных дел для передачи власти."
 INS_loyalist_events.32.a: "Наконец-то мы вместе."
 INS_loyalist_events.33.t: "[PHI.GetNameDefCap] отказыва[PHI.GetNameEndRuPresentEtYut]ся от объединения"
 INS_loyalist_events.33.desc: "[PHI.GetAdjective]ое правительство отклонило наше предложение об объединении. Их парламент даже не стал его толком рассматривать. Мы предложили им войти в состав величайшей державы Юго-Восточной Азии, но они на это наплевали."
 INS_loyalist_events.33.a: "Ничего страшного, это временно."
 INS_communist_events.6.t: "[FROM.GetAdjective]ие приверженцы агитируют жителей [ROOT.GetNameRuGen]"
 INS_communist_events.6.desc: "Наша разведка подтвердила то, о чем мы давно подозревали. [FROM.GetNameDefCap] вед[FROM.GetNameEndRuPresentEtUt] целенаправленную подрывную работу на нашей территории — финансирует радикальные ячейки, распространяет подстрекательские листовки и организует забастовки среди рабочих. Их агенты внедрились в профсоюзы и сельские кооперативы, где теперь открыто призывают к свержению нашего правительства. Ситуация достигла критической точки, и мы должны действовать решительно, прежде чем она выйдет из-под контроля."
 INS_communist_events.6.a: "Нужно срочно принять меры!"
 INS_communist_events.7.t: "Коммунистическая подрывная деятельность на территории [FROM.GetNameRuGen]"
 INS_communist_events.7.desc: "К нам поступили тревожные сообщения из [FROM.FROM.GetNameRuGen]. Агенты, действующие по приказу [FROM.GetNameRuGen], разжигают революционные настроения среди местного населения и используют недовольство нашей администрацией для поддержки коммунистического захвата власти. Если мы не вмешаемся, радикалы могут полностью завладеть [FROM.FROM.GetNameRuInst], а затем этот яд легко распространится и на другие наши владения."
 INS_communist_events.7.a: "Нужно искоренить эту заразу, пока не поздно!"
 INS_communist_events.8.t: "[FROM.GetAdjective]ая пропаганда среди жителей [ROOT.GetNameRuGen]"
 INS_communist_events.8.desc: "На наших фабриках, на рынках и в университетах все чаще появляются [FROM.GetAdjRuLower]ие листовки и брошюры. Там проповедуются идеи классовой борьбы и освобождения с помощью революции. Полиция сообщает, что эти материалы вызывают большой интерес у тех местных жителей, которые недовольны нашей властью. Эта пропаганда довольно топорная, но эффективная и распространяется с огромной скоростью."
 INS_communist_events.8.a: "Выясните, кто распространяет эту заразу!"
 ## Call for Revolution - Main Event (sent to target) ##
 INS_communist_events.1.t: "Революция на территории [ROOT.GetNameRuGen]"
 INS_communist_events.1.desc: "Ситуация достигла критической точки. Месяцы [FROM.GetAdjRuLower]ой агитации привели к тому, что обычными мерами сдержать коммунистическое движение среди жителей [ROOT.GetNameRuGen] стало уже невозможно. Массовые забастовки парализовали жизнь в городах, вооруженные партизаны захватили целые провинции, а [FROM.GetAdjRuLower]ое правительство полностью поддержало революционеров. Наши спецслужбы работают на пределе возможностей, к тому же мы начинаем сомневаться в их верности. Нужно решить прямо сейчас, бороться ли дальше за выживание государства или смириться с неизбежным, прежде чем прольется еще больше крови."
 INS_communist_events.1.a: "Объявляйте военное положение, мы так просто не сдадимся."
 INS_communist_events.1.b: "Дальнейшее сопротивление только навредит нашему народу."
 INS_communist_events.1.c: "Возможно, если мы усадим их за стол переговоров, то сможем вернуть себе контроль."
 ## Civil War Chosen - sent to Indonesia ##
 INS_communist_events.2.t: "[FROM.GetNameDefCap] собира[FROM.GetNameEndRuPresentEtYut]ся воевать"
 INS_communist_events.2.desc: "[FROM.GetAdjective]ое правительство отказалось уступать и приказало своей армии подавить революционное движение силой. Наши верные товарищи уже занимают боевые позиции и захватывают ключевые опорные пункты. Наша борьба будет долгой, но [FROM.GetAdjRuLower]ий народ сделал выбор, и мы окажем ему всю необходимую поддержку."
 INS_communist_events.2.a: "Революция шагает вперед."
 ## Surrender - sent to Indonesia ##
 INS_communist_events.3.t: "[FROM.GetNameDefCap] капитулиру[FROM.GetNameEndRuPresentEtYut]"
 INS_communist_events.3.desc: "[FROM.GetName] в лице старого правительства капитулировал[FROM.GetNameRuEndPast]. Столкнувшись с масштабами революционного движения и осознав, что [ROOT.GetNameDef] его поддержива[ROOT.GetNameEndRuPresentEtYut], администрация была вынуждена подчиниться. Власть перешла к местной коммунистической партии, и новое правительство уже начало обращаться к нам за советами. Еще одна страна освободилась от власти старого порядка."
 INS_communist_events.3.a: "Это великая победа для трудящихся всего мира."
 ## Civil War in Subject - sent to overlord ##
 INS_communist_events.4.t: "Гражданская война на территории [FROM.GetNameRuGen]"
 INS_communist_events.4.desc: "Вооруженные и хорошо организованные коммунистические революционеры при поддержке [FROM.FROM.GetNameRuGen] начали восстание на территории [FROM.GetNameRuGen]. Колониальная администрация потеряла контроль над обширными территориями, и губернатор сообщает, что без подкрепления местный гарнизон не сможет восстановить порядок."
 INS_communist_events.4.a: "Отправьте туда войска. Мы не отдадим [FROM.GetNameRuAcc]!"
 ## Subject Surrendered - sent to overlord ##
 INS_communist_events.5.t: "[FROM.GetName] теперь под властью коммунистов"
 INS_communist_events.5.desc: "Администрация [FROM.GetNameRuGen] без боя сдалась коммунистическим повстанцам. Губернатор и его помощники арестованы, наш флаг снят, а власть перешла к революционному правительству. Все это организовали [FROM.FROM.GetNameDef] и [FROM.FROM.GetAdjRuLower]ие агенты, которые месяцами занимались подрывной деятельностью. Это не что иное, как воровство, и оно не останется безнаказанным."
 INS_communist_events.5.a: "Это возмутительно!"
 # Cooperate with Revolutionaries (sent to target)
 INS_communist_events.9.t: "[FROM.GetAdjective]ие офицеры замечены в обществе диссидентов"
 INS_communist_events.9.desc: "[FROM.GetAdjRuLower]их агентов заметили в компании известных агитаторов и лидеров воинствующих группировок по всей стране. Организаторы студенческих движений, когда-то раздававшие листовки на улицах, теперь проводят закрытые собрания с людьми, у которых есть доступ к [FROM.GetAdjRuLower]им дипломатическим документам. Запрещенные публикации печатаются быстрее, чем полиция успевает их конфисковать, а протесты, которые обычно затихали к вечеру, теперь парализуют целые районы на несколько суток. С каждым днем эти коммунисты объединяются в более крупные группы, и если мы будем медлить, то они выйдут из-под контроля."
 INS_communist_events.9.a: "Нужно положить конец деятельности этих иностранных агентов!"
 # Spread Anti-Colonialist Sentiment (sent to subject target)
 INS_communist_events.10.t: "[FROM.GetAdjective]ая риторика набирает обороты"
 INS_communist_events.10.desc: "[FROM.GetAdjective]ие брошюры распространяются в казармах и среди государственных служащих, никакие попытки их конфисковать не в силах остановить этот поток. Там говорится о странах, которые освободились от оков, и о народах, которые свергли своих колониальных правителей и стали править сами. Бороться с распространением этих брошюр было бы проще, если бы там печатали неправду. Но даже лояльные чиновники начинают задаваться вопросом, кому служит нынешняя администрация — нашему народу или лишь нашим хозяевам."
 INS_communist_events.10.a: "Не стоит накалять обстановку."
