 CZE_a_divided_nation_czech_states: "Образовательные программы в §Y[FROM.GetNameRuPrep]§!"
 CZE_a_divided_nation_czech_states_desc: "Нехватка квалифицированных специалистов препятствует быстрому росту промышленности в центральной части страны. Необходимо вкладываться в программы, которые позволят повысить уровень образования среди работников развивающейся отрасли."
 CZE_a_divided_nation_slovakia_states: "Дополнительные инвестиции в экономику §Y[FROM.GetNameRuGen]§!"
 CZE_a_divided_nation_slovakia_states_desc: "Сделанные ранее инвестиции не помогли устранить неравенство в области промышленности [FROM.GetNameRuGen]. Чтобы улучшить положение, необходимо привлечь больше инвестиций."
