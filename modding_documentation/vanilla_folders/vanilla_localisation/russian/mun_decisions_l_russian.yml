 CZE_crisis_in_the_sudentenland_desc: "Судетские вооруженные формирования стали открыто выражать несогласие и развернули против нас партизанскую войну. Продолжающиеся столкновения с армией накалили обстановку до предела. Нам необходимо взять ситуацию под контроль до того, как этим воспользуются наши враги."
