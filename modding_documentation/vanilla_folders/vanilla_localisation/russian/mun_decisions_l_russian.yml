 CZE_a_divided_nation_category_tt: "Выбор решения: §Y$CZE_a_divided_nation_bridge_the_divide_fake$§!"
 CZE_a_divided_nation_category_2_tt: "§YПоследствия выбора§!:\nдоступны решения (§Y$CZE_a_divided_nation_category$§!), которые §Yудалят§! негативные модификаторы с наших §Yрегионов§! и ослабят негативные модификаторы §Yнационального духа «$CZE_a_divided_nation_dynamic_modifier$»§! до §Yудаления§!."
 CZE_a_divided_nation_category_3_tt: "Доступны решения (§Y$CZE_a_divided_nation_category$§!), которые §Yудалят§! негативные модификаторы с наших §Yрегионов§! и ослабят негативные модификаторы §Yнационального духа «$CZE_a_divided_nation_dynamic_modifier$»§! до §Yудаления§!."
