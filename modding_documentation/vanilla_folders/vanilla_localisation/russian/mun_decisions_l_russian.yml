 CZE_bop_car_rationing: "£BoP_right_texticon Нормирование автотранспорта"
 CZE_embezzle_quatermaster_funds: "£BoP_left_texticon Растрата средств квартирмейстера"
 CZE_embezzle_quatermaster_funds_desc: "У наших солдат и так прекрасные условия содержания. Никто не заметит и не начнет бить тревогу, если некоторая часть средств, выделенных на казармы, пойдет на что-то другое."
 CZE_prioritize_export_contracts: "£BoP_left_texticon Приоритет контрактов на экспорт"
 CZE_prioritize_export_contracts_desc: "Именно благодаря экспорту мы смогли оправиться после Великой депрессии. Так зачем что-то менять? Любая угроза нашему государству сильно преувеличена. Армада может и подождать."
 CZE_focus_on_export_designs: "£BoP_left_texticon Фокус на экспорте"
 CZE_focus_on_export_designs_desc: "Армия очень требовательна к нашим разработкам. Экспортный рынок не просто более снисходителен, он также помогает финансировать внутренние разработки для той же армии. На самом деле это армия должна благодарить нас за то, сколько денег мы ей экономим на исследованиях и развитии. Всегда пожалуйста, обращайтесь еще."
 CZE_bop_reservist_training: "£BoP_right_texticon Подготовка резервистов"
 CZE_junior_officer_recruitment: "£BoP_right_texticon Набор младших офицеров"
 CZE_send_foreign_attaches: "£BoP_right_texticon Отправить зарубежных атташе"
 CZE_send_observers_to_the_italo_ethiopian_war: "£BoP_right_texticon Отправить наблюдателей в Эфиопию"
 CZE_send_observers_to_the_italo_ethiopian_war_bonus: "Отправить наблюдателей на итало-эфиопскую войну"
 CZE_send_observers_to_the_italo_ethiopian_war_desc: "Отправка наблюдателей для изучения ситуации и установление контактов с теми, кто вовлечен в конфликт, может дать много полезной информации о современной армейской доктрине, а также открыть перед нами новые возможности."
 CZE_send_observers_to_the_italo_ethiopian_war_tt: "§Y$CZE_zbrojovka_brno_organization$§! будет интересоваться контрабандой оружия в §Y[ETH.GetNameRuAcc]§!."
 CZE_recruit_red_cross_veterans: "£BoP_right_texticon Вербовка ветеранов Красного Креста"
 CZE_warehouse_inspections: "£BoP_right_texticon Осмотр складов"
 CZE_warehouse_inspections_desc: "Благодаря своевременным проверкам вы всегда будете знать, всего ли у вас в достатке."
 CZE_construction_telephone_stations: "£BoP_right_texticon Строительство телефонных станций"
 CZE_construction_telephone_stations_desc: "Строительство телефонных станций между нашими штаб-квартирами значительно улучшит координацию действий высшего командования."
 CZE_state_defense_loans: "£BoP_right_texticon Государственный оборонный кредит"
 CZE_live_fire_exercise: "£BoP_right_texticon Учения с боевой стрельбой"
 CZE_live_fire_exercise_desc: "Опыт, полученный на полигоне, ничем не заменить."
 CZE_redirect_military_discretionary_spending: "£BoP_left_texticon Перенаправить необязательные военные расходы"
 CZE_redirect_military_discretionary_spending_desc: "Поскольку эти расходы необязательны, мы можем потратить средства на что-то другое."
 CZE_seize_rail_lines: "£BoP_right_texticon Захватить железнодорожные пути"
 CZE_field_exercises: "£BoP_right_texticon Полевые учения"
 CZE_field_exercises_desc: "Нет ничего более ценного, чем опыт, полученный во время обучения на фронте."
