 ###FORT DECISIONS###
 CZE_the_second_fortification_program_category: "Программы фортификации"
 CZE_the_second_fortification_program_category_desc: "Не слишком выгодная граница нашего государства — явная угроза национальной безопасности. Окружающие нас страны ясно дали понять, что намерены перекроить границы в свою пользу. Дальнейшее укрепление наших рубежей заставит любого возможного врага подумать дважды, прежде чем на нас нападать."
 CZE_fate_of_the_ro: "Судьба Совета по фортификации"
 CZE_fate_of_the_ro_desc: "Совет по фортификации отвечает за сбор средств для проектов по возведению укреплений. Если в скором времени выделенные средства не будут использованы по назначению, люди начнут задавать вопросы."
 CZE_bop_army_bunker_maintenance: "Обслуживание укреплений"
 CZE_bop_army_bunker_maintenance_desc: "Если наши укрепления будут обслуживаться должным образом и пребывать в состоянии готовности, армия сможет рассчитывать на них в случае необходимости."
 CZE_fortification_research: "Исследования в рамках фортификации"
 CZE_fortification_research_desc: "Необходимость укрепления границ очевидна, но как это сделать? Исследования помогут найти ответ на этот вопрос."
 CZE_fortification_research_tt: "Обладает национальным духом §Y«$CZE_directorate_of_fortification_works_no_gd_idea$»§!"
 CZE_fortification_research_subtract_variable_tt: "Продолжительность §Yвыполнения§! всех будущих задач §Yпрограмм фортификации§! будет уменьшена на §Y30§! дней"
 CZE_fortification_decision_inprogress: "Выполняется другая программа фортификации"
 CZE_second_sudetenland_fortification_program: "Вторая программа фортификации Судетской области"
 CZE_second_sudetenland_fortification_program_desc: "Граничащая с Германией гористая Судетская область — отличное место для размещения фортификационных сооружений. Изучив французскую линию Мажино, мы сможем построить собственный оборонительный рубеж."
 CZE_third_sudetenland_fortification_program: "Третья программа фортификации Судетской области"
 CZE_third_sudetenland_fortification_program_desc: "В Судетах расположена приличная оборонительная линия, однако, когда речь идет о безопасности страны, излишняя осторожность не повредит."
 CZE_fourth_sudetenland_fortification_program: "Четвертая программа фортификации Судетской области"
 CZE_fourth_sudetenland_fortification_program_desc: "Фортификации в Судетах мощны, но они должны стать еще мощнее!"
 CZE_fortify_the_crossroads_with_slo: "Фортификация дорог"
 CZE_fortify_the_crossroads_with_slo_desc: "Любой оборонительный рубеж можно прорвать. На этот случай стоит укрепить свои наиболее важные города с тем, чтобы вторгшийся на нашу территорию противник не смог легко ими завладеть."
 CZE_fortify_the_hungarian_border_with_73: "Укрепление границы с Венгрией"
 CZE_fortify_the_hungarian_border_with_73_desc: "Венгерская экспансия угрожает нашей родине. Мы будем чувствовать себя безопаснее, отгородившись от соседей системой фортификационных сооружений."
 CZE_fortify_the_polish_border_with_72: "Укрепление границы с Польшей"
 CZE_fortify_the_polish_border_with_72_desc: "Польская агрессия не знает никакой меры, однако мы надеемся, что хорошо укрепленная граница заставит их отправиться искать жертву послабее."
 ###### ARMY READINESS BALANCE OF POWER ######
 CZE_bop_ready_for_anything: "£GFX_power_balance_texticon Готовность ко всему"
 CZE_bop_ready_for_anything_tt: "Не обладает национальным духом "
