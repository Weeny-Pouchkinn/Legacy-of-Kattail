 CZE_autonomous_sentiment: "Тенденция к автономии"
 CZE_autonomous_sentiment_desc: "Союзничество с автономным блоком имеет свои недостатки. Один из них — обязательное выполнение требований предоставления автономии [SLO.GetNameRuDat]. Не хотелось бы, чтобы другие части нашей страны последовали ее примеру."
