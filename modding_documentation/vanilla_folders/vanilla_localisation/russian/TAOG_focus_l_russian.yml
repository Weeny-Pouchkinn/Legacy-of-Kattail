 idea_SIA_weather_broadcasts: "Погодные сводки"
 idea_SIA_weather_broadcasts_desc: "Регулярные метеорологические сводки позволяют нашим военно-воздушным и военно-морским силам получать более чёткое представление о погодных условиях. Это повышает эффективность выполнения операций и снижает риски во время непогоды."
 idea_SIA_seri_thai_contacts: "Связь со «Свободным Таиландом»"
 idea_SIA_seri_thai_contacts_desc: "Коммуникация с подпольным движением «Свободный Таиланд» приносит свои плоды — мы получаем в своё распоряжение опытных бойцов и укрепляем связи с союзниками."
 idea_SIA_secure_rubber_islands: "Захват каучуковых островов"
 idea_SIA_joint_military_command: "Объединенное военное командование"
 idea_SIA_joint_military_command_desc: "Единая структура командования улучшает координацию между различными родами войск, а также ускоряет подготовку опытных офицеров и совершенствование боевой доктрины."
