 SIA_printing_money_monthly_increase_halve: "Ежемесячный прирост фактора фабрик будет сокращен на половину."
 SIA_printing_money_monthly_increase_set: "Каждый месяц значение фактора фабрик, производящих товары народного потребления будет увеличиваться на §Y[?idea_SIA_printing_money_monthly_change|%]§!"
