 INSHOL_foundations_of_defense_desc: "$HOL_the_foundations_of_defense_desc$"
 INSHOL_investments_in_civ_railways_tt: "Если [HOL.GetFlag]§Y[HOL.GetName]§! заверша[HOL.GetNameEndRuPresentEtYut] фокус:\n         ([INS.GetFlag]§Y[INS.GetName]§!: добавляется §Y£autonomy_texticon -250,00§!)\n   Если [INS.GetFlag]§Y[INS.GetName]§! заверша[INS.GetNameEndRuPresentEtYut] фокус:\n         Добавляется §Y£autonomy_texticon 250,00§!"
 INSHOL_investments_in_civ_railways: "Инвестиции в гражданские железные дороги"
 INSHOL_investments_in_civ_railways_desc: "Чтобы завоевать сердца жителей Ост-Индии, понадобится вложить средства в гражданскую инфраструктуру. Так, по нашим железным дорогам сейчас в основном перевозятся только грузы; значит, необходимо приобрести несколько пассажирских поездов и пустить их по маршрутам на Яве и Суматре."
 INSHOL_continue_exclusive_rights: "Исключительные права для Яванского банка"
 INSHOL_continue_exclusive_rights_desc: "За годы Великой депрессии курс гульдена Нидерландской Индии значительно просел, и рост нашей экономики прервался. Чтобы стабилизировать гульден, мы можем предоставить Яванскому банку исключительные права на выпуск валюты, утраченные им в 1922 году."
 INSHOL_peg_indies_guilder_to_dutch_guilder: "Привязать гульден Нидерландской Индии к голландскому"
 INSHOL_peg_indies_guilder_to_dutch_guilder_desc: "За годы Великой депрессии курс гульдена Нидерландской Индии значительно просел, и рост нашей экономики прервался. Проще всего будет привязать его курс к курсу более стабильной валюты — голландского гульдена. Такой шаг заодно укрепит нашу привязанность к метрополии."
 INSHOL_peg_indies_guilder_to_us_dollar: "Привязать гульден Нидерландской Индии к доллару США"
 INSHOL_peg_indies_guilder_to_us_dollar_desc: "За годы Великой депрессии курс гульдена Нидерландской Индии значительно просел, и рост нашей экономики прервался. Курс можно привязать к голландскому гульдену, однако доллар США — значительно более стабильная валюта. Если привязать гульден к нему, наша экономика станет более независимой, а значит, в перспективе будет возможно самоуправление."
 indonesia_currency_pegged_to_dollar_modifier: "Гульден Нидерландской Индии привязан к доллару США"
 INS_direct_rule_tt: "Открывается оккупационный закон §Y«$INS_direct_rule_occupation_law$»§!, действующий в индонезийских княжествах.\nЭффекты:\n     §GУвеличивается§! количество государственных фабрик и ресурсов\n     §RУменьшается§! рост подчинения\n     §RУвеличивается§! рост сопротивления"
 INS_local_autonomy_tt: "Открывается оккупационный закон §Y«$INS_local_autonomy_occupation_law$»§!, действующий в индонезийских княжествах.\nЭффекты:\n     Ко всему действуют §Yнебольшие§! прибавки\n     §GУвеличивается§! рост подчинения"
 INS_invest_in_batavian_education_req_tt: "Успешно выполнено не менее §Y3§! заданий фольксраада"
 INS_invest_in_batavian_education_req_2_tt: "Успешно выполнено не менее §Y6§! заданий фольксраада"
 INSHOL_eventual_autonomy_req_tt: "Успешно выполнено не менее §Y4§! заданий фольксраада"
 indonesia_volksraad_passed_12: "Индонезийский государственный флаг официально признан"
 INS_stronghold_java_tt: "Любой индонезийский регион: не оккупирован [ROOT.GetFlag][ROOT.GetNameRuInst]"
 INSHOL_request_east_timor: "Потребовать возвращения Восточного Тимора"
 INSHOL_request_east_timor_desc: "Португальская оккупация Тимора незаконна, и мы не собираемся мириться с этим пережитком колониальных времен: Тимор по праву принадлежит Индонезии. Мы выдвинем Португалии официальное требование немедленно вернуть нам эту территорию."
 INS_resist_occupation: "Сопротивление оккупации"
 INS_resist_occupation_desc: "Нельзя допустить, чтобы обозленный на Нидерланды индонезийский народ установил в стране фашизм. Нужно всеми силами оказывать сопротивление японским захватчикам и отстоять родину."
 INS_local_resistance: "Местное сопротивление"
 INS_local_resistance_desc: "На еще свободных от захватчиков территориях мы создадим ячейки сопротивления, чтобы, даже если эти земли всё-таки достанутся врагу, впоследствии мы были готовы их освободить."
 INS_stronghold_java: "Крепость Ява"
 INS_stronghold_java_desc: "Ост-Индия — обширный, густонаселенный и труднопроходимый архипелаг. Попытка защитить все без исключения острова, джунгли и горы, особенно от армии, превосходящей нашу, заранее обречена на неудачу. И хотя бросать соотечественников на произвол судьбы нелегко, всё же эвакуация всех островов — за исключением Явы, где можно разместить нашу армию целиком, — это, пожалуй, лучший выход для всей страны."
 INS_silence_nationalists: "Заставить замолчать сторонников националистов"
 INS_silence_nationalists_desc: "Революционные националистические движения начали симпатизировать вторгнувшимся в страну японцам, поскольку у них общий враг — Нидерланды. Порожденная вторжением нестабильность привела к тому, что ряды этих движений разрастаются невообразимыми темпами. Если с этим ничего не сделать, через какое-то время они окончательно выйдут из-под контроля."
 INS_east_indies_exile_government: "Правительство Ост-Индии в изгнании"
 INS_east_indies_exile_government_desc: "Несмотря на все наши усилия, Ост-Индия пала. Однако еще рано терять надежду: надо продолжать делать всё, что в наших силах, несмотря на скромные ресурсы. Мы проиграли битву, но не войну!"
 INS_establish_nefis: "Учредить СРГОИ"
 INS_establish_nefis_desc: "Вместе с союзниками мы учредим в Австралии новый орган — Службу разведки Голландской Ост-Индии. Ее сотрудники будут проводить секретные операции против японских оккупационных сил. С каждой маленькой победой всё ближе будет наше возвращение на родину."
 INS_evacuate_soldiers_to_australia: "Эвакуировать солдат в Австралию"
 INS_evacuate_soldiers_to_australia_desc: "Около базы СРГОИ в Северной Австралии мы построим еще одну базу — военную. Там мы разместим солдат Королевской голландской ост-индской армии, сумевших избежать плена во время оккупации, и благодаря им продолжим борьбу."
 INS_australian_weapons: "Австралийское оружие"
 INS_australian_weapons_desc: "Секретные операции требуют всех сил и средств; для успеха нам понадобится соответствующее снаряжение. Мы можем приобрести права на использование австралийских фабрик и переделать их в заводы для производства оружия для СРГОИ."
 INS_defenders_of_homeland: "Защитники родины"
 INS_defenders_of_homeland_tt: "Этот фокус будет выполнен автоматически после формирования Защитников Родины."
 INS_resist_occupation_tt: "Этот фокус будет выполнен автоматически, если страна подвергнется вторжению и не капитулирует."
 INS_defenders_of_homeland_desc: "Правительство Ост-Индии свергнуто. На его место пришел новый режим. Под совместным руководством националистов и японского правительства мы создадим новое войско, которое превзойдет Королевскую голландскую ост-индскую армию, и победим в войне. Впрочем, каждому очевидно, что союз между националистами и империалистами весьма шаток. Сумеет ли он продержаться достаточно долго — или же окончится кровопролитием?"
 INS_embrace_co_prosp_sphere: "Поддержать сферу совместного процветания"
 INS_embrace_co_prosp_sphere_desc: "Мы наконец-то покончили с голландским правлением, и хотя мы просто заменили одного сюзерена другим, обещания экономического процветания и паназиатизма выглядят очень заманчиво. Мы продолжим помогать Японии с военными действиями, чтобы Нидерланды не посмели вернуться в Индонезию."
 INS_seize_oppurtunity: "Воспользоваться возможностью"
 INS_seize_oppurtunity_desc: "[JAP.GetNameDefCap] проигрыва[JAP.GetNameEndRuPresentEtYut]. Оккупационное правительство слабо. Впервые за много столетий нам представилась конкретная возможность разбить сковавшие Индонезию оковы и создать независимое государство. Если мы не объявим о независимости сегодня, то завтра, возможно, этот шанс ускользнет надолго, если не навсегда."
 INS_japanese_resource_infrastructure: "Поддержать военную экономику"
 INS_japanese_resource_infrastructure_desc: "Передача [JAP.GetNameRuDat] нашей ключевой добывающей инфраструктуры — важный шаг, облегчающий победу в войне. Крайне важно обеспечить [JAP.GetAdjRuLower]им силам постоянное снабжение. Кроме того, [JAP.GetNameDefCap] обязу[JAP.GetNameEndRuPresentEtYut]ся заняться развитием нашей местной инфраструктуры, чтобы экспортировать ресурсы можно было еще эффективнее."
 INS_japanese_army_training: "Реформировать армию"
 INS_japanese_army_training_desc: "Нам еще многому предстоит научиться у [JAP.GetAdjRuLower]их учителей. Поскольку Королевская голландская ост-индская армия распущена, нам понадобятся новые вооруженные силы, которые будут перенимать опыт у Императорской армии и защищать Индонезию от внешних врагов."
 INS_governor_general_de_jonge: "Генерал-губернатор де Йонге"
 INS_governor_general_de_jonge_desc: "Бонифациус Корнелис де Йонге держит своих подданных в ежовых рукавицах. Он — ярый противник национализма и нередко идет поперек желаний фольксраада. Де Йонге уже не первый год правит Ост-Индией, а на посту губернатора ему служит опыт, полученный в годы Великой войны — тогда Бонифациус занимал в Ост-Индии должность министра войны."
 INS_governor_general_tjarda: "Генерал-губернатор Тьярда"
 INS_tjarda_explain_tt: "Срок полномочий §YБонифациуса Корнелиса де Йонге§! истёк, и в сентябре 1936 года на его место в качестве губернатора был избран §YАлидиус Тьярда ван Старкенборг Стахауэр§!."
 INS_governor_general_tjarda_desc: "Алидиус Тьярда ван Старкенборг Стахауэр отличается от своего предшественника взглядами на будущее Ост-Индии. Ему так же противен национализм, однако Тьярда более либерален и склонен прислушиваться к пожеланиям фольксраада."
 INS_electrical_investments: "Инвестиции в электрификацию"
 INS_electrical_investments_desc: "Каждое промышленно развитое европейское государство в достаточной мере электрифицировано — без этого производство невообразимо. Чтобы перестать полагаться на поставки материалов и создать собственную обрабатывающую промышленность, нам придется построить на Яве электросетевую инфраструктуру, способную обеспечить работу заводов."
 INS_reduce_land_taxes: "Понизить земельные налоги"
 INS_reduce_land_taxes_desc: "Высокие налоги на владение землей значительно усложняют жизнь индонезийцам — владельцам плантаций и предприятий. И хотя такое положение дел позволяет нам сохранять монополию на каучуковую промышленность, в масштабах страны оно сулит только экономические проблемы. Возможно, стоит снизить налоговую ставку до прежнего уровня, чтобы небольшие каучуковые плантации, находящиеся в частных руках, не разорились."
 INS_invest_in_batavian_education: "Инвестиции в образование в Батавии"
 INS_invest_in_batavian_education_desc: "Фольксраад предельно ясно дал понять: индонезийский народ желает доступного образования, поскольку сейчас позволить себе учебу могут в основном индонезийцы голландского происхождения, а также немногочисленные представители элиты. Чтобы выполнить это пожелание, нам нужно построить несколько начальных и средних школ в Батавии и ее окрестностях."
 INS_javanese_education_investments: "Инвестиции в образование на Яве"
 INS_javanese_education_investments_desc: "Не стоит ограничиваться одними только школами: мы можем построить также общественный колледж и профессиональные училища, чтобы и средний класс мог позволить себе профессиональное образование."
 INS_allow_local_autonomy: "Разрешить местное самоуправление"
 INS_allow_local_autonomy_desc: "Система Vorstenlanden, благодаря которой княжества получили самоуправление, значительно уменьшила угрозу со стороны националистических движений и поспособствовала общему росту стабильности в стране. Настало время ещё сильнее расширить полномочия княжеств в области самоуправления, чтобы правительство занялось более важными вопросами."
 INS_direct_rule: "Прямое управление"
 INS_direct_rule_desc: "Система Vorstenlanden, благодаря которой княжества получили самоуправление, возложила на плечи администрации дополнительный груз: чем больше в стране бюрократов, тем больше драгоценного времени тратится впустую. Пора полностью отменить эту систему и установить прямое управление над всем архипелагом."
 INS_seize_oppurtunity_tt: "Силы §Y[JAP.GetFlag][JAP.GetNameRuGen]§! были оттеснены, поэтому государств под контролем у этой страны меньше §Y[?var:temp_states_plus_more]§! (сейчас: §Y[?var:JAP.num_controlled_states]§!)."
 INS_seize_oppurtunity_refuse_warn_tt: "§RНачнётся национальная революция, что может привести к войне против [HOL.GetNameRuGen]§!."
 INS_economic_stabilization: "Стабилизация экономики"
 INS_economic_stabilization_desc: "Великая депрессия и введение во всем мире протекционистских мер нанесли ощутимый удар по нашей экономике. Тысячи индонезийцев — работников сырьевой промышленности — оказались без средств к существованию. Необходимы решительные меры: мы учредим трудовой план, предполагающий обеспечение рабочим местом каждого безработного."
 INS_restore_order_in_indies: "Восстановить порядок в Ост-Индии"
 INS_restore_order_in_indies_desc: "Рост националистических настроений в Ост-Индии уже пошатнул порядок в нескольких регионах. Если мы не остановим эти движения, они окончательно выйдут из-под контроля. Возвращение порядка и стабильности сейчас — задача номер один."
 INS_detangle_supply_chains: "Упростить цепочки поставок"
 INS_detangle_supply_chains_desc: "Экспортная экономика нашей страны полагается на десятки посредников — без них товары просто не дойдут до пункта назначения. Каждый посредник — это лишняя пошлина, налог или другой повод снять хотя бы часть навара. Нужно наконец навести здесь порядок и установить прямой контроль над значительной частью каждой цепочки."
 INS_prioritize_industrial_growth: "Отдать приоритет промышленному росту"
 INS_prioritize_industrial_growth_desc: "Экспортная экономика нашей страны находится в опасном положении — она слишком сильно зависит от доброй воли голландцев. Нам необходимо создать собственную обрабатывающую промышленность, и первым шагом станет строительство фабрик в Батавии. Так мы сделаем первые шаги к превращению в самую индустриализированную страну Тихоокеанского региона."
 INS_closer_economic_ties_to_netherlands: "Укрепить экономические связи с Нидерландами"
 INS_closer_economic_ties_to_netherlands_desc: "Нам еще многому предстоит научиться у метрополии, в особенности — экономике. Если укрепить интеграцию нашей экспортной экономики с экономикой Нидерландов, мы сможем заключать более выгодные торговые сделки — в этом нам будут помогать голландские связи и инфраструктура."
 INS_prioritize_dutch_companies: "Отдать приоритет голландским компаниям"
 INS_prioritize_dutch_companies_desc: "Хребтом экономики нашей страны уже не первое столетие выступают такие голландские компании, как Shell и Fokker; первая особенно сильно зависит от поставок нашего сырья. Благодаря этому Ост-Индия невероятно разбогатела, поэтому разумно будет уделять первостепенное внимание именно этим компаниям, а не мелким местным предприятиям."
 INSHOL_java_factories: "Открыть оружейные заводы на Яве"
 INSHOL_java_factories_desc: "Простой, но неоспоримый факт: строительство новых оружейных заводов — прямой путь к укреплению армии. Поскольку Ява — промышленный локомотив всей колонии, разумно будет строить заводы именно здесь."
 INSHOL_license_dutch_weapon_blueprints: "Лицензии на голландское оружие"
 INSHOL_license_dutch_weapon_blueprints_desc: "Вместо того, чтобы создавать в стране промышленное производство и разрабатывать собственные технологии, мы можем сотрудничать с голландскими компаниями и покупать у них чертежи оружия."
 INSHOL_bangka_production_lines: "Серийное производство на Банке"
 INSHOL_bangka_production_lines_desc: "Поступательное развитие инфраструктуры Банки — прямое следствие проекта «Банка»: крошечный и некогда незначительный остров превратился в площадку для строительства государственной промышленности. Благодаря этому нам представилась возможность укрепить Королевскую голландскую ост-индскую армию: мы можем построить на Банке новый оружейный завод, и производство здесь будет идти значительно эффективнее благодаря наличию дорог, железнодорожных путей и портов."
 INSHOL_artillerie_inrichtingen: "Artillerie Inrichtingen"
 INSHOL_artillerie_inrichtingen_desc: "Голландская компания Artillerie Inrichtingen уже более 250 лет занимается производством артиллерии и других видов вооружения; в Ост-Индии ее филиал существует уже несколько десятков лет. Если мы расширим производственные возможности Artillerie Inrichtingen (для этого понадобится ввести в строй новые мощности), мы не только сделаем Королевскую голландскую ост-индскую армию сильнее, но и создадим новые рабочие места и тем самым поднимем экономику слабо финансируемых регионов."
 INSHOL_ai_pyrotechnische: "Artillerie Inrichtingen Pyrotechnische"
 INSHOL_ai_pyrotechnische_desc: "Расширение производственных мощностей Artillerie Inrichtingen в Ост-Индии продолжается. Следующим шагом должно стать учреждение в Ост-Индии дочерней организации, занимающейся пиротехникой."
 INSHOL_bio_pharma: "Bio Pharma"
 INSHOL_bio_pharma_desc: "Следующий этап армейской реформы — расширение фармацевтической отрасли ост-индской промышленности: раненым солдатам необходимо оказывать полноценную помощь. Этот проект обойдется нам относительно дешево, поскольку в Ост-Индии много хинина."
 INSHOL_develop_fighters: "Разработать новые истребители"
 INSHOL_develop_fighters_desc: "Мы отправим батавских инженеров в Амстердам — там они смогут самостоятельно ознакомиться с тщательно охраняемыми технологиями производства истребителей Fokker. На родину они вернутся уже вооруженные техническими познаниями, и тогда в Ост-Индии наконец появится современная промышленность, способная строить истребители."
 INSHOL_develop_bombers: "Разработать новые бомбардировщики"
 INSHOL_develop_bombers_desc: "Мы отправим батавских инженеров в Амстердам — там они смогут самостоятельно ознакомиться с тщательно охраняемыми технологиями производства бомбардировщиков Fokker. На родину они вернутся уже вооруженные техническими познаниями, и тогда в Ост-Индии наконец появится современная промышленность, способная строить бомбардировщики."
 INSHOL_bandung_aircraft_facility: "Бандунгский авиастроительный завод"
 INSHOL_bandung_aircraft_facility_desc: "Чертежи и производственные секреты бесполезны, если не найти им практического применения. Чтобы ВВС королевской армии ни в чем не нуждались, мы построим в Бандунге новые авиастроительные заводы."
 INSHOL_netherlands_indies_air_doctrine: "Воздушная доктрина Нидерландской Индии"
 INSHOL_netherlands_indies_air_doctrine_desc: "Мы тщательно изучим опыт ВВС тех стран, что уже сталкивались со знакомыми нам трудностями, и на основе этих знаний (в том числе, конечно, ошибок) выработаем доктрину, отвечающую реалиям Ост-Индии."
 INSHOL_manado_military_academy: "Военная академия в Макасаре"
 INSHOL_manado_military_academy_desc: "Острую нехватку людских ресурсов можно преодолеть относительно простым способом: построить за пределами Явы военную академию и объявить призыв на восточных островах. Лучше всего будет начать строительство в Макасаре, в центре Ост-Индии."
 INSHOL_infantry_training_in_borneo: "Подготовка пехоты на Борнео"
 INSHOL_infantry_training_in_borneo_desc: "Ост-Индия — суровый, почти непроходимый край густых джунглей и скалистых гор. Наши солдаты, расквартированные в основном на Яве, совершенно не способны воевать в таких условиях. Готовить войска нужно в более недружелюбной обстановке, например в джунглях и горах Борнео — мало какое место лучше подходит для обучения рейнджеров мирового класса."
 INSHOL_knil_engineers: "Инженерный корпус"
 INSHOL_knil_engineers_desc: "Пехотинец с винтовкой — надёжный и нужный ресурс, однако плохо налаженная логистика стали причиной поражений во многих битвах. Нам необходимо приступить к подготовке инженерных войск и выделить больше средств батавским техническим училищам, чтобы армия не страдала из-за ограниченных логистических возможностей."
 INSHOL_work_with_oil_barons: "Сотрудничать с нефтяными баронами"
 INSHOL_work_with_oil_barons_desc: "Великая депрессия повергла нашу экспортную экономику в удручающее состояние. Возможно, пора привлечь к торговым переговорам нефтяных баронов Суматры — эти люди наверняка сумеют обеспечить нам продажи нефти. Однако следует учесть, что согласятся они лишь в том случае, если мы будем продавать нефть по ценам значительно ниже рыночных."
 INSHOL_rubber_taxation: "Налоги на каучук"
 INSHOL_rubber_taxation_desc: "Каучуковые плантации Ост-Индии — одно из важнейших достояний империи. Поскольку успех этого предприятия обеспечили голландские деньги и голландские же специалисты, вполне справедливо, что королевству полагается часть приносимого плантациями дохода. Не все местные политики с этим согласны, однако метрополия никогда не пойдет на поводу у аборигенов."
 INSHOL_padang_port: "Международный порт в Паданге"
 INSHOL_padang_port_desc: "Производимые в Паданге ресурсы попадают на международные рынки через Яву, поскольку в регионе нет инфраструктуры, способной принимать большие конвои. Из-за этого страдают цепочки поставок и экономический потенциал Суматры. Чтобы плантации Паданга приносили больше дохода, а ресурсы поставлялись напрямую, мы построим здесь большую гавань для грузовых судов."
 INSHOL_subsidize_bauxite: "Субсидирование бокситовой промышленности"
 INSHOL_subsidize_bauxite_desc: "План модернизации ост-индских островов Банка и Белитунг с богатыми залежами бокситов кажется нам весьма многообещающим: в долгосрочной перспективе этот регион способен принести немалую прибыль. Нам следует поддержать правительство субсидиями, чтобы ускорить выполнение плана."
 INSHOL_agricultural_subsidies: "Приватизировать сельскохозяйственный сектор"
 INSHOL_agricultural_subsidies_desc: "Выдача разрешений на владение частными фермами не только ускорит развитие инфраструктуры в недополучающих финансирование сельских регионах, но и увеличит государственный доход. Помимо этого мы также учредим структурированную налоговую систему: все облагаемые налогами доходы фермеров будут поступать непосредственно в Нидерланды, минуя Ост-Индию."
 INSHOL_import_sugar: "Импортировать сахар"
 INSHOL_import_sugar_desc: "Рост цен в сельскохозяйственной отрасли Ост-Индии будет регулироваться сверху. Мы начнем импортировать весь сахар, производящийся на ост-индских плантациях, по недопустимым для других государств ценам, и установим государственную монополию на этот продукт."
 INSHOL_import_lumber: "Импортировать древесину"
 INSHOL_import_lumber_desc: "Рост цен в сельскохозяйственной отрасли Ост-Индии будет регулироваться сверху. Мы начнем импортировать всю древесину, производящуюся на ост-индских плантациях, по недопустимым для других государств ценам, и установим государственную монополию на этот продукт."
 INSHOL_industrialized_colony: "Промышленно развитая колония"
 INS_no_peta_tt: "Индонезия не сможет сотрудничать с иностранными захватчиками."
 INSHOL_industrialized_colony_desc: "Некогда скромная Ост-Индия сегодня — один из самых промышленно развитых и богатых регионов Азии. Несомненно, этот успех — великое достижение и для Нидерландов, и для всего человечества. Мы продолжим всеми силами развивать колонию, и в скором будущем Нидерланды вновь обретут мировое влияние."
 INSHOL_economic_integration: "Экономическая интеграция"
 INSHOL_economic_integration_desc: "Голландская Ост-Индия — жемчужина нашей империи, плод безустанного труда королевы, премьер-министра и генерал-губернатора. Ни в коем случае нельзя допустить, чтобы безрассудное стремление местных жителей к независимости угрожало безопасности колонии: независимость — это беспорядки и упадок. Мы еще больше углубим взаимную интеграцию экономик Нидерландов и Ост-Индии и обеспечим долгие годы стабильности и процветания."
 INSHOL_republic_of_indonesia: "Республика Индонезия"
 INSHOL_republic_of_indonesia_desc: "Правительство Нидерландов, когда-то с неохотой согласившееся рассмотреть петицию Суджарто, в ответ выдвинуло целый список требований к будущей независимой Индонезии. Соответствие каждому пункту — обязательное условие: без этого страна не смогла бы считаться экономически самостоятельной. Сегодня благодаря решительному духу индонезийского народа все эти требования исполнены до единого, и Нидерландам остается лишь одно: признать нашу декларацию независимости."
 INSHOL_propose_malay_unification: "Предложить объединение с Малайей"
 INSHOL_propose_malay_unification_desc: "Множество народов — носителей сотен культур и языков — называют наш архипелаг родиной. Какие-то схожи друг с другом, какие-то совсем не похожи на соседей, однако всех нас объединяет одно: борьба с колонизаторами под знаменами единого индонезийского государства. Но разве стоит на этом останавливаться? Совсем рядом, по другую сторону пролива, живут малайцы — народ, чьи история и устремления так сильно напоминают наши."
 INSHOL_singapore_compromise: "Сингапурский компромисс"
 INSHOL_singapore_compromise_desc: "В историческом и культурном отношении Сингапур — часть Индонезии, поэтому вполне естественно, что он должен войти в состав единой Индонезии. Однако Британия не согласится на объединение: ее колония имеет стратегическую важность, а кроме того, здесь расположена военная база. Впрочем, мы можем предложить компромиссный вариант: Сингапур войдет в состав союза при условии, что Британия сохранит права на размещение здесь войск."
 INSHOL_request_ceylon: "Отказаться от передачи Цейлона"
 INSHOL_request_ceylon_desc: "Британская колония Цейлон тесно связана с малайским миром культурной и языковой общностью. Панмалайская федерация Мафилиндо разрастается, и Цейлону тоже найдется место в ее составе."
 INSHOL_papua_referendum: "Референдум на Папуа"
 INSHOL_papua_referendum_desc: "Остров Папуа сегодня поделен между двумя государствами — Индонезией и Австралией. Территория под нашим управлением растет и развивается, в то время как принадлежащая австралийцам часть острова остается бедной и плохо развитой. Будущее любой страны должно принадлежать ее народу, а значит мы должны потребовать провести официальный референдум по вопросу объединения Папуа."
 INSHOL_invite_phillipines: "Предложить основать Мафилиндо"
 INSHOL_invite_phillipines_desc: "Входящие в наш союз народы говорят на разных языках и исповедуют разные обычаи, но всех их объединяет общее происхождение, уходящее корнями в малайский мир. Значит, и союз следует превратить в панмалайскую конфедерацию, пригласив в него Филиппины. Горстка малозначительных южноазиатских колоний вскоре станет серьезной региональной силой."
 INS_focus_time_reduce_usa_tt: "Решение §Y«$INS_realign_supply_chains$»§! сокращает срок исполнения этого фокуса на 70 дней."
 INS_focus_time_reduce_jap_tt: "Решение §Y«$INS_first_come_first_serve$»§! сокращает срок исполнения этого фокуса на 70 дней."
 INS_focus_time_reduce_fokker_tt: "Решение §Y«$INSHOL_east_indies_fokker_division$»§! сокращает срок исполнения этого фокуса на 35 дней."
 INS_focus_time_reduce_tjarda_tt: "Решение §Y«$INS_governor_general_tjarda$»§! сокращает срок исполнения этого фокуса на 35 дней."
 INS_focus_time_reduce_pki_tt: "Решение §Y«$INS_utilize_tan_malakas_militia$»§! сокращает срок исполнения этого фокуса на 35 дней."
