 # Alternative Communist Focus
 SIA_the_peoples_war_in_asia: "Народная война в Азии"
 SIA_the_peoples_war_in_asia_desc: "Борьба против [JAP.GetAdjRuLower]ого империализма — не просто противостояние между государствами. Это война рабочих, крестьян и солдат против зарубежного гнёта. Поддерживая коммунистические силы в Китае, [ROOT.GetNameDef] вступа[ROOT.GetNameEndRuPresentEtYut] в масштабную народную войну по всей Азии."
 SIA_peoples_war_in_asia_idea: "Народная война в Азии"
 SIA_peoples_war_in_asia_idea_desc: "Война — это не только манёвры. Делу армии служат все: местные комитеты, готовые показать дорогу партизаны, снабжающие солдат крестьяне… Каждая деревня — всё равно что склад, каждая дорога — смертельная ловушка для врага, каждое отступление — попытка заманить противника вглубь страны."
 # Alternative Nationalist Focus
 SIA_national_defense_in_asia: "Национальная оборона в Азии"
 SIA_national_defense_in_asia_desc: "Чтобы наладить оборону в Азии, требуются дисциплина, строгая вертикаль власти и понятная каждому стратегическая цель. [ROOT.GetNameDef] вступа[ROOT.GetNameEndRuPresentEtYut] в коалицию с националистическим правительством Китая, осознавая необходимость дать отпор [JAP.GetAdjRuLower]ой экспансии — ответом на неё станет организованное сопротивление войск и слаженная работа командиров."
 SIA_national_defense_in_asia_tt: "§Y[ROOT.GetNameWithFlag]§! примыка[ROOT.GetNameEndRuPresentEtYut] к националистическим силам единого фронта.\nДобавляется идея §Y«$SIA_national_defense_in_asia_idea$»§!. Эффекты:\n $MODIFIER_ARMY_ORG_FACTOR$: §G+5%§!\n $MODIFIER_PLANNING_SPEED$: §G+10%§!\n $MODIFIER_MAX_PLANNING$: §G+10%§!\n $MODIFIERS_ARMY_DEFENCE_FACTOR$: §G+5%§!"
 SIA_stronger_together: "Вместе мы сильнее"
 SIA_stronger_together_desc: "Война меняет всё. Вчерашние преграды в виде невыполнимых обещаний и переплетающихся союзов сегодня уже кажутся не такими существенными. Чтобы курс развития Азии определял[ROOT.GetNameRuEndPast] именно [ROOT.GetNameDef], нам придётся попросить партнёров объединить силы с нашим альянсом и согласиться, что для предстоящей борьбы необходимо объединённое командование."
 idea_SIA_national_defense_in_asia: "Национальная оборона в Азии"
 SIA_directorate_of_aeronautical_engineering_desc: "Будущее военно-воздушных сил [ROOT.GetNameRuGen] определяют не только лётчики. Нам нужны инженеры, инспекторы, мастерские, а главное — центральный орган, который строил бы нашу воздушную мощь на фундаменте в виде иностранных закупок. Таким органом станет Управление авиастроения."
 idea_SIA_aeronautical_engineering_directorate: "Управление авиастроения"
 SIA_standardize_aircraft_maintenance: "Стандартизация техобслуживания самолётов"
 SIA_standardize_aircraft_maintenance_desc: "Каждому самолёту, попадающему к нам из других стран, требуются специфические детали, инструменты и даже подходы к ремонту. Управлению авиастроения необходимо стандартизировать техническое обслуживание, чтобы воздушный флот [ROOT.GetNameRuGen] меньше времени проводил на земле, а техники меньше путались во время работы."
 SIA_expand_aircraft_workshops: "Расширение авиамастерских"
 SIA_expand_aircraft_workshops_desc: "Чтобы Управление авиастроения справлялось с задачами, одних канцеляристов недостаточно. Нам нужные новые мастерские, станки и механики — так мы сможем чинить повреждённые самолёты, не отправляя их за границу и пользуясь простыми деталями, которые производим сами."
 SIA_license_modern_airframes: "Лицензии на современные планеры"
 SIA_license_modern_airframes_desc: "В [ROOT.GetNameRuPrep] ещё не налажена разработка всех необходимых стране самолётов. Разумнее всего будет приобрести лицензии на иностранные модели, изучить их конструкцию и под контролем Управления авиастроения приспособить под наши условия: климат, аэродромы и логистику."
 SIA_tropical_air_operations: "Действия авиации в тропиках"
 SIA_tropical_air_operations_desc: "Жара, влажность, муссонные дожди и примитивные аэродромы — тяжёлое испытание и для самолётов, и для экипажей. Однако Управлению под силу приспособить наши двигатели, процедуры техобслуживания и даже боевую тактику под условия Юго-Восточной Азии. В результате надёжность ВВС заметно возрастёт."
