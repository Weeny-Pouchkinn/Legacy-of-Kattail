 AST_uap_election_campaign_tt: "§YПредвыборная кампания ОПА§!\n§LСредний класс, владельцы предприятий и приверженцы империи сплотятся. Начнётся политическая кампания Объединённой партии Австралии.§!\n\n§YЭффект:§!\nЕжедневная стоимость политической власти: §R1§!\nЕжедневная прибавка голосов за §YОПА§!: §G+0,05%§!"
 AST_alp_election_campaign_tt: "§YПредвыборная кампания АЛП§!\n§LРабочий класс, участники профсоюзов и реформаторы, призывающие к переменам в стране, сплотятся. Начнётся политическая кампания Австралийской лейбористской партии.§!\n\n§YЭффект:§!\nЕжедневная стоимость политической власти: §R1§!\nЕжедневная прибавка голосов за §YАЛП§!: §G+0,05%§!"
 AST_uap_win_count_trigger_tt: "§YОПА§! одержала не менее $COUNT|Y$ побед на выборах."
 AST_alp_win_count_trigger_tt: "§YАЛП§! одержала не менее $COUNT|Y$ побед на выборах."
 AST_natunity_desc: "§YПравительство национального единства§!\n§LКогда наступают по-настоящему трудные годы, малозначительные трудности отходят на второй план. Окружающие нас державы погрязли в череде бесконечных конфликтов. Многие внутренние вопросы по-прежнему требуют безотлагательного решения, но всё-таки важнее не допустить кровопролития. Демократическим партиям [AST.GetNameRuGen] пора покончить с распрями и объединиться перед лицом угрозы.§!"
