 AST_australian_military_forces: "Вооруженные силы Австралии"
 AST_australian_military_forces_desc: "Австралийская армия прошла через горнило Великой войны, отважно сражалась на далеких берегах и мужественно выдержала самые кровопролитные сражения. Впрочем, за прошедшие годы численность наших вооруженных сил сократилась, а сама армия стала оборонительной. Теперь ее основная задача — охрана родных островов. Но в памяти еще свежи уроки последней войны; в случае необходимости мы всегда можем их вспомнить."
 AST_permanant_military_forces: "Постоянные вооруженные силы"
 AST_permanant_military_forces_desc: "До сих пор главной военной силой Австралии является ополчение, которое и отвечает за оборону страны. Однако мир стоит на пороге очередного кризиса, поэтому имеет смысл создать полноценную армию из профессиональных солдат и офицеров, которые получили боевой опыт еще в годы Великой войны. Даже если эти военнослужащие изначально будут состоять лишь в резерве, их призыв позволит нам сформировать постоянные вооруженные силы и при этом поддерживать уровень подготовки войск на достойном уровне."
 AST_invoke_the_1903_defence_act: "Акт об обороне от 1903 г."
 AST_invoke_the_1903_defence_act_desc: "В вопросах обороны Австралия главным образом полагается на свое ополчение. Если же стране угрожает серьезная опасность, то мы всегда можем призвать на службу дополнительных бойцов, ссылаясь на Акт об обороне от 1903 года."
 AST_lithgow_small_arms_factory: "Оружейный завод в Литгоу"
 AST_lithgow_small_arms_factory_desc: "Основанный в 1912 году, оружейный завод в Литгоу был призван снизить нашу зависимость от британских поставок вооружений во время войны. Поскольку напряжение в мире снова нарастает, нам следует расширить производство, чтобы обеспечить армию всем необходимым."
 AST_dingo_scout_car: "Разведывательная машина «Динго»"
 AST_dingo_scout_car_desc: "Австралия никогда не славилась своими бронемашинами, однако сейчас нашим войскам остро не хватает подобной техники. Мы могли бы подстегнуть отечественные разработки в этом направлении, внедрив в вооруженные силы разведывательную машину «Динго»."
 AST_volunteer_defence_corps_taog: "Добровольческий корпус"
 AST_volunteer_defence_corps_taog_desc: "Созданный по образу британских сил местной обороны, Добровольческий корпус представляет собой ополчение, состоящее из непригодных для обычной военной службы граждан. Несмотря на свои очевидные недостатки по сравнению с регулярными солдатами, эти бойцы прекрасно знают местный ландшафт и в случае необходимости могут успешно вести партизанскую борьбу против захватчиков."
 AST_war_carriers: "Переносчики военных припасов"
 AST_war_carriers_desc: "Хорошо налаженная логистика — это залог победы в войне. Поскольку ландшафт и климат Австралии значительно осложняет работу грузовиков и поездов, мы должны рассмотреть другие варианты снабжения. В частности, мы можем доверить доставку военных грузов местным жителям, которые приспособлены к подобным условиям и хорошо знакомы с окрестными дорогами, тропами и проходами."
 AST_anzac_spirit: "Дух АНЗАК"
 AST_anzac_spirit_desc: "Австралийский и новозеландский армейский корпус завоевал громкую репутацию в годы Великой войны, проливая кровь и внося свой вклад в победу Британской империи. Эти солдаты отличились особой стойкостью, мужеством, изобретательностью и бесстрашием перед лицом смертельной опасности."
 AST_lee_enfield_no1_mark3: "Ли-Энфилд No.1 Mk III*"
 AST_lee_enfield_no1_mark3_desc: "Звездочка в названии Ли-Энфилд No.1 Mk III* указывает на упрощенный вариант винтовки, разработанный для удешевления и ускорения ее производства в военное время. Впрочем, даже такие изменения не позволяют нам снабдить армию достаточным количеством винтовок. Чтобы еще больше нарастить производство, мы можем поручить изготовление различных деталей нескольким небольшим фабрикам, а затем собирать из них готовые винтовки на оружейном заводе в Литгоу."
 AST_new_south_wales_government_railways: "Государственные железные дороги Нового Южного Уэльса"
 AST_new_south_wales_government_railways_desc: "Государственные железные дороги Нового Южного Уэльса располагают уникальными цехами, где крупные стальные конструкции можно отливать в виде цельных изделий. Таким образом, мы являемся одной из немногих стран Содружества, которая может производить полностью литые корпуса и башни танков, а потому мы непременно должны использовать это преимущество в военных целях."
 AST_second_australian_imperial_force: "Новые Австралийские имперские силы"
 AST_second_australian_imperial_force_desc: "Австралия задействовала свои Первые имперские силы во время Великой войны, отправляя солдат сражаться в Европу. Поскольку мир снова стоит на грани глобальной войны, нам стоит сформировать Вторые имперские силы, которые позволят нам при необходимости укрепить свое военное присутствие за рубежом."
 AST_expeditionary_leader: "§YГенерал§! получит черту §Y«Экспедиционный командир»§!: за рубежом его способности улучшатся, но количество дивизий, которыми он сможет командовать, будет ограничено."
 AST_expeditionary_leader_plural: "Оба §Yгенерала§! получат черту §Y«Экспедиционный командир»§!: за рубежом их способности улучшатся, но количество дивизий, которыми они смогут командовать, будет ограничено."
 AST_larrikinism: "Ларрикинизм"
 AST_larrikinism_desc: "Слово «ларрикин», которое означает грубого и невоспитанного, но в остальном весьма доброго и отзывчивого человека, во многом стало воплощением австралийской культуры. Свойственные подобным людям стойкость, своенравие и жизнеутверждающий оптимизм помогают им преодолевать любые трудности. Благодаря этим качествам в годы Великой войны австралийские солдаты заслужили репутацию непоколебимых бойцов, способных выполнить задачу, невзирая ни на какие на препятствия."
 AST_diggers: "Диггеры"
 AST_diggers_desc: "«...Теперь вам лишь нужно копать, копать и еще раз копать, пока вы не будете в безопасности», — таков был приказ, который получил генерал Уильям Бидвуд по прибытии войск АНЗАК в Галлиполи. Хотя вскоре эта фраза легла в основу австралийской тактики ведения войны, она не улавливает всей сути слова «диггеры» (копатели), которым с тех пор называют австралийских и новозеландских солдат. Выкапывая траншеи и укрытия под непрерывным огнем неприятеля, эти бойцы по-настоящему сплотились и обрели дух товарищества, который помогает им сражаться и доблестно переносить тяготы войны."
 AST_owen_gun: "Пистолет-пулемет Оуэна"
 AST_owen_gun_desc: "Благодаря своей новаторской конструкции отечественный пистолет-пулемет Оуэна быстро обрел славу простого, но крайне надежного оружия. В этом отношении он похож на наших солдат, которые столь же неприхотливы и выносливы. Таким образом, пистолет-пулемет Оуэна служит не только символом австралийской изобретательности, но и отражением стойкости и боевого духа нашего народа."
 AST_department_of_supply_and_development_taog: "Департамент снабжения и развития"
 AST_department_of_supply_and_development_taog_desc: "Наши заводы и логистические сети работают на износ, чтобы обеспечить наши военные нужды. Нам необходимо создать специальный орган, который позволит централизовать производство и снабжение армии и облегчить контроль за этими процессами."
 AST_sentinel_tank_development: "Разработка танка «Сентинел»"
 AST_sentinel_tank_development_desc: "Мы до сих пор используем преимущественно зарубежные проекты танков, даже если производим их внутри страны. Вместо этого мы могли бы опереться на опыт иностранных конструкторов и на его основе разработать собственный танк, который будет больше соответствовать нашим нуждам и возможностям."
 AST_establish_training_camps: "Организация тренировочных лагерей"
 AST_establish_training_camps_desc: "Как и в годы Великой войны, мы можем отправлять Вторые австралийские имперские силы сражаться в любой точке мира. В связи с этим нам стоит разработать всеобъемлющие программы подготовки, чтобы наши солдаты могли одинаково эффективно действовать в самых разных условиях, начиная от пустынь Северной Африки и заканчивая джунглями южно-тихоокеанского региона."
 AST_jungle_tanks_if_sentinel_tank_development: "Если мы завершили фокус «Разработка танка „Сентинел“»:"
 jungle_heavy_tanks: "Тяжелые танки для джунглей"
 AST_anti_malaria_campaign: "Кампания по борьбе с малярией"
 AST_anti_malaria_campaign_desc: "Возможно, в обозримом будущем нам придется отправить войска в джунгли Тихоокеанского региона, где им предстоит столкнуться с малярией — угрозой гораздо более смертельной, чем вражеский огонь. Мы должны принять все необходимые меры, чтобы обезопасить наших солдат от этой страшной болезни."
 AST_defence_citizen_military_forces_act: "Акт о военизированных отрядах обороны"
 AST_defence_citizen_military_forces_act_desc: "В данный момент мы имеем право отправлять за рубеж лишь профессиональных солдат. Поскольку конфликт продолжает разрастаться, нам стоит разработать закон, который позволит при необходимости отправлять в горячие точки добровольцев из числа простых ополченцев."
 AST_call_that_a_knife: "Полный порядок!"
 AST_call_that_a_knife_desc: "«Разве это нож? Вот это — нож!» Порой юмор и задорное удальство творят чудеса. Благодаря им наши солдаты без страха смотрят опасности прямо в глаза и уверенно выполняют свои боевые задачи."
 AST_army_inventions_directorate_taog: "Дирекция военных разработок"
 AST_army_inventions_directorate_taog_desc: "Как бы чудовищна ни была война, она бесспорно двигает прогресс в самых разных областях человеческой деятельности. В связи с этим было бы разумно создать специальный орган, который будет собирать полученный на поле боя опыт и использовать его для разработки различных новшеств."
 AST_yeramba: "Йерамба"
 AST_yeramba_desc: "На фоне успеха австралийского танка «Сентинел» мы решили не останавливаться на достигнутом и составили проект 25-фунтовой пушки на танковом шасси под названием «Йерамба». Эта самоходная артиллерийская установка, способная обрушить на наших врагов сокрушительную мощь, станет прекрасным дополнением к нашему парку военной техники."
 AST_alice_springs: "Алис-Спрингс"
 AST_alice_springs_desc: "Аутбэк занимает большую часть Австралии и представляет собой суровый пустынный регион. В самом его сердце расположен небольшой городок Алис-Спрингс, который служит основным логистическим узлом для операций на территории Австралии. Нам следует вложить средства в его развитие и создать там военную базу, где наши войска смогут проходить подготовку к службе в условиях жаркого и засушливого климата."
 AST_australian_regular_army: "Австралийская регулярная армия"
 AST_australian_regular_army_desc: "Сражаясь в разных частях света — от берегов Галлиполи до пустынь Северной Африки, от гор Греции до джунглей Юго-Восточной Азии, — наши солдаты приобрели множество ценных навыков. Этот обширный боевой опыт позволил нам создать крайне гибкие вооруженные силы, которые способны выполнять задачи в самых разных условиях."
 AST_no1_flying_training_school: "Летная школа №1"
 AST_no1_flying_training_school_desc: "Основанная одновременно с учреждением Королевских военно-воздушных сил Австралии в 1921 году, 1-я летная школа была закрыта в связи со снижением потребности в пилотах. Однако сегодня миру вновь грозит глобальный конфликт, поэтому нам следует снова открыть эту школу, чтобы как можно скорее подготовить новое поколение пилотов и летных экипажей."
 AST_empire_air_training_scheme_taog: "Имперская программа летной подготовки"
 AST_empire_air_training_scheme_taog_desc: "В рамках Имперской программы летной подготовки Содружество предоставляет странам-участницам финансирование и обширные знания, необходимые для обучения пилотов и летных экипажей. Власти этих стран отчаянно соперничают за право поучаствовать в программе, но основными претендентами являются Австралия и Канада. Если мы хотим развить свои военно-воздушные силы, нам следует подать официальную заявку на участие."
 AST_volunteer_air_corps: "Добровольческий корпус наблюдателей"
 AST_volunteer_air_corps_desc: "У Австралии огромное воздушное пространство, которое наши относительно скромные ВВС просто не в состоянии закрыть. Чтобы решить эту проблему, мы можем организовать тысячи наблюдательных постов по всей стране и доверить несение караула добровольцам из числа местных жителей."
 AST_improved_ground_crews: "Квалифицированный наземный персонал"
 AST_improved_ground_crews_desc: "На каждого пилота приходится целая команда специалистов, которые занимаются обслуживанием самолетов, а также планированием и координацией полетов. Кроме того, его могут сопровождать и другие члены экипажа, включая навигаторов, пулеметчиков и бомбардиров. Чтобы наши ВВС действовали максимально эффективно, нам необходимо создать специальные учреждения для подготовки летных и наземных экипажей."
 AST_advanced_pilot_training: "Интенсивная подготовка летчиков"
 AST_advanced_pilot_training_desc: "Технологии стремительно развиваются, и самолеты становятся все более быстрыми и сложными в управлении. Чтобы наши пилоты могли в полной мере использовать эти новые технологии во время вылетов, они должны постоянно учиться и совершенствовать свои навыки."
 AST_advanced_pilot_training_tt: "§G+10%§! к приросту освоения §Yвоздушных доктрин§!."
 AST_commonwealth_aircraft_corporation_taog: "Авиационная корпорация"
 AST_commonwealth_aircraft_corporation_taog_desc: "Борьба за превосходство в воздухе постепенно набирает обороты, и в этом деле нам нельзя отставать от других стран. К счастью, у гражданских энтузиастов и изобретателей уже есть идеи и наработки для развития нашей авиапромышленности, поэтому нам лишь остается предоставить им все необходимые ресурсы для работы."
 AST_reestablish_central_flying_school: "Возрождение Центральной летной школы"
 AST_reestablish_central_flying_school_desc: "В условиях разгорающегося глобального конфликта нашим пилотам необходимо постоянно повышать свое мастерство. Открытие Центральной летной школы, которая будет работать совместно с 1-й летной школой, поможет нам удовлетворить растущие потребности современных военно-воздушных сил."
 AST_aerodrome_of_democracy_democracy: "Аэродром демократии"
 AST_aerodrome_of_democracy_fascism: "Аэродром превосходства"
 AST_aerodrome_of_democracy_communism: "Аэродром свободы"
 AST_aerodrome_of_democracy_neutrality: "Аэродром силы"
 AST_aerodrome_of_democracy: "[GET_AERODOME_NAME]"
 AST_aerodrome_of_democracy_desc: "Военно-воздушные силы Австралии находятся на острие авиационных инноваций, благодаря чему наша страна даже заработала прозвище «[GET_AERODOME_NAME]». Наши пилоты ведут воздушные бои в самых разных уголках мира, в то время как наши бомбардировщики денно и нощно ровняют с землей заводы и фабрики наших врагов."
 AST_government_aircraft_factories: "Государственные авиазаводы"
 AST_government_aircraft_factories_desc: "В силу нашей удаленности от Европы мы не можем полагаться на зарубежные поставки самолетов в военное время. Именно поэтому мы должны наращивать собственные производственные мощности, которые позволят нам собирать авиационные двигатели и корпуса в соответствии с нуждами наших ВВС."
 AST_death_from_down_under_taog: "Смерть с земли"
 AST_death_from_down_under_taog_desc: "Путем долгой и кропотливой работы мы смогли создать мощные военно-воздушные силы, которым нет равных не только в Южном полушарии, но и во всем мире. Наши самолеты рассекают небо в самых разных уголках света, нанося врагам точные и сокрушительные удары. Где бы они ни прятались, смерть придет к ним с Юга."
 AST_ride_the_lightning: "Оседлать молнию"
 AST_ride_the_lightning_desc: "Наши летчики-истребители неустанно бороздят небо, обеспечивая наше превосходство в воздухе. Молниеносные, опасные и беспощадные, они стремглав мчатся в бой, перехватывают вражеские самолеты и устанавливают полный контроль над небом, чтобы нашим войскам на земле было проще выполнять свои задачи."
 AST_the_gathering_storm: "Надвигающаяся буря"
 AST_the_gathering_storm_desc: "На горизонте виднеется буря. Растущие возможности наших ВВС оказывают все большее давление на наших врагов, позволяя нам наносить удары в их наиболее слабые места и одновременно поддерживать наступление наших войск. Совсем скоро далекие раскаты грома выльются в разрушительный ураган, который сотрет наших неприятелей в порошок."
 AST_hear_the_thunder: "Звуки грома"
 AST_hear_the_thunder_desc: "Наши стратегические бомбардировщики неутомимо демонстрируют всему миру мощь австралийской авиации. Когда враг ощущает под ногами дрожь и слышит тяжелый гул наших двигателей, он точно знает: началась страшная буря, от которой невозможно укрыться."
 AST_department_of_aircraft_production: "Отдел авиастроения"
 AST_department_of_aircraft_production_desc: "Наших производственных мощностей едва хватает, чтобы обеспечивать техникой наши стремительно растущие военно-воздушные силы. Нам необходимо расширить свою промышленную базу и нарастить производство воздушных судов, чтобы устлать все небо своими самолетами."
 AST_royal_australian_navy: "Королевский австралийский ВМФ"
 AST_royal_australian_navy_desc: "Образованный в результате федерализации Австралии и объединения флотов бывших колоний, Королевский австралийский военно-морской флот успел поучаствовать в боях практических на всех морских театрах Великой войны. С тех пор он пришел в упадок из-за нехватки финансирования, однако мир снова движется к большому конфликту, поэтому нам стоит задуматься о восстановлении его былой мощи."
 AST_coast_watchers: "Береговые дозоры"
 AST_coast_watchers_desc: "Большая часть наших войск находится в материковой части страны, однако острова вблизи нашего северного побережья также могут пригодиться нам для обороны. Мы могли бы разместить там наших разведчиков и создать систему раннего обнаружения, которая позволит нам засекать вражеские морские и воздушные суда задолго до того, как они доберутся до наших берегов."
 AST_marines: "Морская пехота"
 AST_marines_desc: "Будучи со всех сторон окруженными океанами и островами, мы вынуждены полагаться на морские десантные войска, чтобы обеспечивать свое военное присутствие за пределами наших берегов. Если нам вдруг придется перейти от обороны к наступлению, эти подразделения смогут быстро взять под контроль близлежащие острова."
 AST_naval_auxiliary_patrol_taog: "Дополнительные береговые патрули"
 AST_naval_auxiliary_patrol_taog_desc: "Поскольку наши регулярные войска заняты более важными задачами, защита портов и иных береговых сооружений ложится на плечи местных добровольцев. Благодаря своему знанию окрестных вод они могут без труда нести морской дозор, при этом притворяясь рыбаками и избегая всяких подозрений со стороны врага."
 AST_cockatoo_island_shipyards_taog: "Верфь острова Кокату"
 AST_cockatoo_island_shipyards_taog_desc: "Верфь острова Кокату уже многие годы служит одним из основных ремонтных узлов для Королевского флота, и без нее проведение операций в удаленных водах было бы невозможным. Нам стоит увеличить производственные мощности этой важнейшей верфи, чтобы она могла в полной мере отвечать требованиям нашего растущего флота."
 AST_kangaroo_point_dry_dock_taog: "Сухой док в Кенгуру-Пойнт"
 AST_kangaroo_point_dry_dock_taog_desc: "Хотя «Эванс Дикин и Компания» прежде всего занимаются машиностроением, они прекрасно осознают необходимость расширения нашей кораблестроительной промышленности на фоне растущей угрозы извне. В связи с этим они планируют возвести в Кенгуру-Пойнт сухой док, и если мы хотим укрепить свой флот, то нам определенно стоит поддержать эту инициативу и помочь им приобрести землю для строительства."
 AST_scrap_iron_flotilla_taog: "Флотилия «Скрэп Айрон»"
 AST_scrap_iron_flotilla_taog_desc: "Несмотря на свою устарелость и износ, несколько наших старых эсминцев все еще годятся для выполнения боевых задач. В связи с этим мы решили объединить их в одну флотилию и поставить их на службу. Хотя они не имеют того престижа, которым обладают более современные суда, это весьма дешевый и практичный способ усилить наш флот."
 AST_cruising_for_a_bruising: "В поисках неприятностей"
 AST_cruising_for_a_bruising_desc: "Наш флот всегда опирался на крейсеры, и мы намерены поддерживать и развивать эту традицию. Скоро эти быстрые и универсальные корабли прославятся на весь мир, а любого врага, который попадется им на море, будут ждать большие неприятности."
 AST_strike_from_down_under: "Удар антиподов"
 AST_strike_from_down_under_desc: "Они бесшумно под водой скользят, и коль найдут тебя, то тут же истребят. Слыхал ли ты о страшных субмаринах южных? Беги скорей, иначе флот твой поглотят они на ужин!"
 AST_hmas_sydney: "Крейсер «Сидней»"
 AST_hmas_sydney_desc: "Век линкоров подошёл к концу. Будущее морских держав сосредоточено в небесах над кораблями, и Австралия будет идти в ногу со временем. После многих лет, потраченных на перестройку и модернизацию нашего флота, мы готовы сделать последний шаг и построить авианосец, который на много лет вперёд определит морскую мощь Австралии."
 AST_conscription_level_allowed_tt: "Политическая воля для увеличения масштабов призыва (см. значки людских ресурсов на фокусах)"
 AST_conscription_level_allowed_limited_conscription_tt: "Открывает дополнительный уровень §Yзаконов о призыве§!, разрешающий проводить §Yограниченный призыв§!"
 AST_conscription_level_allowed_extensive_conscription_tt: "Открывает дополнительный уровень §Yзаконов о призыве§!, разрешающий проводить §Yрасширенный призыв§!"
 AST_conscription_level_allowed_service_by_requirement_tt: "Открывает дополнительный уровень §Yзаконов о призыве§!, разрешающий призывать граждан на §Yобязательную службу§!"
 AST_conscription_level_allowed_all_adults_serve_tt: "Открывает дополнительный уровень §Yзаконов о призыве§!, разрешающий призывать на службу §Yвсех взрослых граждан§!"
 AST_conscription_level_allowed_scraping_the_barrel_tt: "Открывает дополнительный уровень §Yзаконов о призыве§!, разрешающий §Yставить всех под ружье§!"
 AST_conscription_law_so_far: "[CONSCRIPTION_LAW_SO_FAR]"
 ############
 ### MISC ###
 ############
 add_random_stat_to_general_tt: "Добавление этому генералу одного случайно выбранного навыка"
 generic_unlock_industrial_concern_tt: "Можно использовать как промышленный концерн:\n"
 NZL_rail_standardization_tt: "§Y[?NZL_train_var]§! ед. поездов §Y«$NZL_train_equipment_1$»§! будет добавлено в государственный запас."
 NZL_ministry_of_public_works: "Министерство гражданского строительства"
 NZL_ministry_of_public_works_desc: "Грамотное планирование и распределение средств позволит нам развивать дорожные и энергетические сети не в хаотичном порядке, а в соответствии с конкретной национальной стратегией."
 NZL_abolish_the_railways_board: "Упразднить Управление железных дорог"
 NZL_abolish_the_railways_board_desc: "Управление государственных железных дорог не справилось с модернизацией нашей железнодорожной сети. Пришло время упразднить эту бесполезную организацию и вернуть железные дороги под полный контроль правительства."
 NZL_rail_standardization: "Стандартизация локомотивов"
 NZL_rail_standardization_desc: "В [ROOT.GetNameRuPrep] есть множество мастерских, которые производят локомотивы самых разных конструкций. Чтобы повысить эффективность нашей железнодорожной сети, нам стоит разработать ряд стандартных локомотивов для выполнения конкретных задач."
 NZL_full_employment: "Полная занятость"
 NZL_full_employment_desc: "Благодаря наличию четкой стратегии, плановому гражданскому строительству и устойчивому развитию промышленности мы практически полностью искоренили безработицу. Пустующие со времен Великой депрессии цеха и мастерские наконец-то вернулись к работе, и теперь весь народ в едином порыве трудится ради общего блага. Можно с уверенностью сказать, что мы не просто встали на ноги, но и значительно укрепили страну перед лицом грядущих испытаний."
 NZL_direct_the_coal_industry: "Контроль за углепромышленностью"
 NZL_direct_the_coal_industry_desc: "Наши развивающиеся железнодорожные сети, промышленность и энергетика нуждаются в непрерывных поставках угля. Эти отрасли имеют важнейшее значение для страны, поэтому государство должно взять под свой контроль добычу и распределение этого ценного ресурса."
 NZL_establish_the_ncb: "Создание Национального управления угледобычи"
 NZL_establish_the_ncb_desc: "Учредив Национальное управление угледобычи, мы сможем объединить множество отдельных шахт в одну централизованную систему и тем самым обеспечить исправные поставки топлива для нашей промышленности и энергетики. Государственный контроль за добычей угля позволит нам не только нарастить ее объемы, но и использовать этот важнейший ресурс в интересах всей страны, а не отдельных магнатов."
 NZL_electrification: "Увеличение производства электроэнергии"
 NZL_electrification_desc: "Расширение сети гидроэлектростанций позволит нам создать прочный фундамент для дальнейшего развития промышленности. Новые плотины и системы электропередачи помогут значительно нарастить выработку электроэнергии и обеспечить наши заводы, порты и железнодорожные сети необходимой мощностью."
 NZL_bureau_of_industry_taog: "$NZL_bureau_of_industry$"
 NZL_bureau_of_industry_taog_desc: "$NZL_bureau_of_industry_desc$"
 NZL_wairarapa_sheep_farms_taog: "$NZL_wairarapa_sheep_farms$"
 NZL_wairarapa_sheep_farms_taog_desc: "$NZL_wairarapa_sheep_farms_desc$"
 NZL_national_roads_board_taog: "$NZL_national_roads_board$"
 NZL_national_roads_board_taog_desc: "$NZL_national_roads_board_desc$"
 NZL_taranaki_oil_taog: "$NZL_taranaki_oil$"
 NZL_taranaki_oil_taog_desc: "$NZL_taranaki_oil_desc$"
 NZL_women_in_the_workforce: "Женщины на рабочем месте"
 NZL_women_in_the_workforce_desc: "В условиях военного времени нехватка рабочих рук ощущается все более остро, поэтому многим женщинам приходится замещать мужчин на заводах, фермах и в государственных учреждениях, чтобы производство не останавливалось ни на минуту. Нам стоит расширить программы подготовки и возможности трудоустройства для женщин, чтобы поддерживать высокие объёмы выпуска продукции без ущерба для обороноспособности страны."
 NZL_restart_the_onekaka_ironworks: "Восстановление металлургического завода в Онекаке"
 NZL_restart_the_onekaka_ironworks_desc: "Металлургический завод в Онекаке был основан с целью наладить производство железа и стали внутри страны и снизить нашу зависимость от зарубежных поставок этих материалов. С тех пор завод был закрыт по причине нерентабельности, однако сегодня нам как никогда необходима сильная национальная промышленность и экономика, поэтому нам стоит задуматься о восстановлении этого предприятия."
 NZL_new_zealand_steel_taog: "$NZL_new_zealand_steel$"
 NZL_new_zealand_steel_taog_desc: "$NZL_new_zealand_steel_desc$"
 NZL_scrap_metal_recycling: "Кампания по переработке"
 NZL_scrap_metal_recycling_desc: "Наша страна сильно зависит от импорта, поэтому нам категорически нельзя расточать наши стратегические ресурсы. Чтобы повысить устойчивость нашей экономики, нам необходимо создать предприятия по переработке различных металлов и резины."
 NZL_domestic_car_industry: "Инвестиции в производство автомобилей"
 NZL_domestic_car_industry_desc: "В данный момент производство автомобилей в [ROOT.GetNameRuPrep] ограничивается сборкой техники из готовых запчастей, которые мы импортируем из-за рубежа. Однако в связи с развитием отечественной сталелитейной промышленности у нас появилась возможность самостоятельно изготавливать детали для автомобилей, и нам определенно стоит рассмотреть этот вариант."
 NZL_department_of_scientific_and_industrial_research_taog: "$NZL_department_of_scientific_and_industrial_research$"
 NZL_department_of_scientific_and_industrial_research_taog_desc: "$NZL_department_of_scientific_and_industrial_research_desc$"
 NZL_project_seal_taog: "$NZL_project_seal$"
 NZL_project_seal_taog_desc: "$NZL_project_seal_desc$"
 NZL_industrial_conscription_taog: "$NZL_industrial_conscription$"
 NZL_think_big_taog: "$NZL_think_big$"
 NZL_industrial_conscription_taog_desc: "$NZL_industrial_conscription_desc$"
 NZL_think_big_taog_desc: "$NZL_think_big_desc$"
 NZL_expand_the_university_of_auckland_taog: "$NZL_expand_the_university_of_auckland$"
 NZL_expand_the_university_of_auckland_taog_desc: "$NZL_expand_the_university_of_auckland_desc$"
 NZL_national_broadcasting_service: "Национальная служба вещания"
 NZL_national_broadcasting_service_desc: "После вмешательства Почтового управления в выборы 1935 года посредством заглушения оппозиционных радиопередач стало ясно, что наша система вещания нуждается в реформе. Нам стоит внести изменения в ее организационную структуру, а также вложить средства в закупку новой радиоаппаратуры."
 NZL_support_allies_with_meat: "Использование мясной промышленности"
 NZL_support_allies_with_meat_desc: "Пути снабжения наших союзников в Тихоокеанском регионе работают на пределе своих возможностей. Мы можем обеспечить их войска мясом из наших собственных запасов, чтобы хоть немного снизить нагрузку на их логистику."
 NZL_support_allies_with_meat_tt: "Все союзники получат §G1§! §Yгражданскую фабрику вне карты§!"
 AST_COMINWEALTH_FACTION: "Содружество"
 AST_cominwealth_tech_sharing_tt: "Мы заключим §Yсоглашение об обмене технологиями§! со всеми членами нашего альянса."
 AST_modify_offshore_advancements_spirit_tt: "Модификатор §Y«$AST_offshore_advancements_spirit$»§! изменится на:"
 AST_gain_claims_on_japan_tt: "Мы получим претензии на §YЯпонские острова§!"
 AST_ireland_anti_british_pact_offer_accept_tt: "Если они согласятся:"
 AST_through_the_barricades_tt: "Если поддержка коммунизма в §Y[ENG.GetNameRuPrep]§! составляет не менее §Y10%§!, то в начале войны портовые рабочие города §Y[132.GetCapitalVictoryPointName]§! организуют восстание и встанут на нашу сторону"
 AST_end_the_kingdom_ireland_join_tt: "Поскольку [IRE.GetAdjRuLower]ие власти подписали антибританский договор, в случае начала войны с [ENG.GetNameRuInst] они вступят в конфликт на нашей стороне"
 ###########################
 ##### FABDA BRANCH ########
 ###########################
 # Root
 ABDA_abdacom: "Учредить КАБГАВС"
 ABDA_abdacom_desc: "Враг стремительно наступает в Юго-Восточной Азии и в Тихом океане. Союзным войскам в регионе придётся действовать согласованно, чтобы остановить это движение. Учредив новый орган — Командование американскими, британскими, голландскими и австралийскими вооружёнными силами, — мы сможем объединить имеющиеся ресурсы, скоординировать действия общего флота и выступить против врага одним фронтом."
 # Tier 1 - country-locked
 ABDA_fortress_singapore: "Крепость Сингапур"
 ABDA_fortress_singapore_desc: "Сингапур — краеугольный камень нашей оборонительной стратегии в этом регионе. Если мы усилим укрепления Сингапура и отправим туда сильный гарнизон, то сможем выиграть для КАБГАВС драгоценное время, а заодно не позволим врагу одержать быструю стратегическую победу."
 ABDA_corps_expeditionnaire: "Французский экспедиционный корпус на Дальнем Востоке"
 ABDA_corps_expeditionnaire_desc: "Французский Индокитай расположен на северном фланге оборонительного района КАБГАВС. Если [FRA.GetNameDef] повед[FRA.GetNameEndRuPresentEtYut] в бой свой экспедиционный корпус, на нашей стороне окажутся столь необходимые сейчас солдаты, обладающие к тому же боевым опытом."
 ABDA_maintain_strategic_flexibility: "Сохранение стратегической гибкости"
 ABDA_maintain_strategic_flexibility_desc: "Не стоит бросать все силы США на единственный театр военных действий. Аккуратное распоряжение стратегическим резервом — это возможность при помощи промышленного и военного потенциала поддержать боевые действия в любой точке Тихого океана, где это будет необходимо."
 # Tier 2
 ABDA_the_malay_barrier: "Малайский барьер"
 ABDA_the_malay_barrier_desc: "От Малайи тянется цепочка островов — это природный оборонительный барьер, куда входит в том числе и [INS.GetNonIdeologyName]. Для КАБГАВС эти острова крайне выгодны: здесь можно выстроить скоординированную морскую и наземную оборону, которая позволит замедлить наступление врага."
 ABDA_develop_naval_infrastructure: "Развить морскую инфраструктуру"
 ABDA_develop_naval_infrastructure_desc: "Чтобы вести в Тихом океане продолжительные боевые действия, нам понадобятся базы, топливохранилища и ремонтные мастерские. Инвестиции в инфраструктуру портов и стоянок позволят расширить длительность и диапазон действий ВМФ КАБГАВС."
 # Tier 3
 ABDA_unified_naval_command: "Объединенное военно-морское командование"
 ABDA_unified_naval_command_desc: "Мы обеспечили наземным объектам защиту и проложили всю необходимую инфраструктуру. Теперь все военно-морские силы могут перейти в ведомство КАБГАВС. Стандартизированные сигналы, обмен разведданными, согласованные патрули — всё это поможет нам воевать эффективнее."
 # Tier 4
 ABDA_ship_a_day_sinking_quotas: "Нарушение маршрутов снабжения"
 ABDA_ship_a_day_sinking_quotas_desc: "Главная стратегическая уязвимость врага — его маршруты снабжения, которые протянулись через весь Тихий океан. Приказав капитанам кораблей и подводных лодок сообща и без всякой жалости топить как можно больше вражеских судов, мы сможем обескровить противника и вынудить его перейти к обороне."
 ABDA_naval_procurement: "Закупка для флота"
 ABDA_naval_procurement_desc: "Нам необходимо как можно скорее ввести в строй новые корабли взамен потерянных. В рамках совместной программы закупок КАБГАВС мы приобретём эсминцы, подлодки и патрульные корабли, которые лучше всего подходят для войны в Тихом океане: наш общий флот должен быть готов противостоять растущему флоту врага."
 ABDA_keep_trade_open: "Обеспечение торговли"
 ABDA_keep_trade_open_desc: "Каучук и нефть — важнейшие ресурсы, которыми располагает [INS.GetNonIdeologyName]: без них невозможно вести войну. Одной из ключевых задач для КАБГАВС станет охрана морских путей, по которым перевозятся эти материалы. Защита конвоев — залог поддержания нашей промышленности."
 # Tier 5 - capstone
 ABDA_expand_the_command: "Расширение командования"
 ABDA_expand_the_command_desc: "КАБГАВС хорошо себя зарекомендовало, а значит, пора его расширить: пригласить в состав командования остальные страны-союзники этого региона, а заодно развивать обмен научными и разведывательными данными, чтобы всегда хотя бы на шаг опережать врага."
