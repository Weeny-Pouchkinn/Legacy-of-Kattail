 HOL_curtail_colonial_autonomy_taog: "$HOL_curtail_colonial_autonomy$"
 HOL_curtail_colonial_autonomy_taog_desc: "$HOL_curtail_colonial_autonomy_desc$"
 HOL_taog_guarantee_colonial_loyalty: "Гарантия лояльности колоний"
 HOL_taog_guarantee_colonial_loyalty_desc: "Националистические настроения в Ост-Индии набирают силу, и становится ясно, что назревает новая революция. Хотя восстание 1927 года было подавлено без особого труда, наши источники сообщают, что на этот раз нам противостоит куда более подготовленная группа революционеров. Возможно, если мы пойдем на некоторые уступки мирному националистическому движению Сутарджо, нам удастся отвлечь внимание населения от революции и направить его в сторону Сутарджо?"
 HOL_taog_guarantee_colonial_loyalty_tt: "§WГарантирует, что в [INS.GetNameRuPrep] не будет революции.§!\n[INS.GetNameDefCap] попыта[INS.GetNameEndRuPresentEtYut]ся обрести независимость мирным путём. Этот процесс можно остановить, завершив фокус §Y«$INSHOL_industrialized_colony$»§!, что потребует значительных вложений в колонию."
