 AST_uap_50_discount: "\n\n§YЭффект обладания более 50% демократических голосов§!:\n(Группа фокусов §YОПА§!):\nНа §Y5§! дней сокращается время завершения.\n\nДоведите голоса до более §Y70%§!, чтобы на §Y10§! дней сократить выполнение группы фокусов §YОПА§!."
 AST_alp_50_discount: "\n\n§YЭффект обладания более 50% демократических голосов§!:\n(Группа фокусов §YАЛП§!):\nНа §Y5§! дней сокращается время завершения.\n\nДоведите голоса до более §Y70%§!, чтобы на §Y10§! дней сократить завершение группы фокусов §YАЛП§!."
