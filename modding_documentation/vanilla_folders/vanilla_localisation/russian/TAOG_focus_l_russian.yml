l_russian:
 INS_nationalize_companies_tt: "Все военно-промышленные организации и промышленные концерны будут национализированы и переименованы."
 available_focus_tt: "§GДоступные§! фокусы:\n"
 INS_is_union_tt: "Сформирован Нидерландско-Индонезийский Союз"
 INS_is_union_tt_NOT: "Не сформирован Нидерландско-Индонезийский Союз"
 INS_denounce_soetardjo: "Осудить Сутарджо"
 INS_denounce_soetardjo_tt: "Мы приступим к подготовке скрытой революции, внедряя наших людей в правительство и создавая партизанские ячейки по всему архипелагу. И как только мы будем готовы, начнем партизанскую войну за независимость против голландцев."
 INS_soetardjo_petition_debate_done_tt: "Фольксраад закончил обсуждение петиции Сутарджо об автономии"
 INS_tkr_tt: "Изменяет §YАрмию народной безопасности§! на:"
 INS_commander_sudirman_tt: "§YСудирман§!([INS.GetFlag]) будет повышен в звании до §Yфельдмаршала§!"
 INS_the_declaration_of_independence: "Декларация о независимости"
 INS_the_declaration_of_independence_desc: "Медлить больше нельзя — нужно действовать, пока есть возможность! Нам следует незамедлительно отправить наше ополчение на захват портов, городов и промышленных центров, чтобы голландские власти не успели отреагировать. Затем мы провозгласим независимость Республики Индонезия."
 INS_the_declaration_of_independence_tt: "Мы провозгласим §Yнезависимость§!. Каждый регион, в котором мы основали §Yбазу ополчения§! или §Yштаб§!, перейдёт под наш контроль, а остальные части страны останутся за [HOL.GetNameRuInst]\n\n[HOL.GetNameDefCap] не призна[HOL.GetNameEndRuPresentEtYut] наш суверенитет, так что вялотекущий конфликт неизбежен. Он может вылиться в полноценную §Rвойну§!.\n\nОткрывает возможность проведения наземных налётов для захвата регионов."
 INSHOL_the_declaration_of_independence: "Национальная революция"
 INS_laskar_rakjat: "Народное ополчение"
 INS_laskar_rakjat_desc: "Революционное движение состоит из множества разрозненных групп ополчения, как крупных, так и небольших, разбросанных по всей Индонезии. Организация этих сил является необходимым условием для достижения победы. Однако действовать следует осторожно, поскольку усиление формирований, связанных с нашими политическими противниками, может обернуться катастрофой."
 INS_militia_tt: "Создает новый шаблон дивизии ополченцев — §Yборцов за свободу§! и открывает решения для управления такими дивизиями."
 INS_militia_warning_tt: "Ополченцы представляют собой §Yполуавтономные§! группы борцов за свободу. Они будут сражаться на нашей стороне, но не бесплатно — за свою помощь они потребуют вознаграждение. §RВ случае невыполнения их требований уровень стабильности существенно снизится!§!"
 INS_usa_tanks_opinion_mod: "Покупка наших танков"
 INS_republic_add_generals_tt: "(§Y$INS_sudirman$§!([INS.GetFlag]), §Y$INS_soengkono$§!([INS.GetFlag]), §Y$INS_supriyadi$§!([INS.GetFlag]), §Y$INS_djatikoesoemo$§!([INS.GetFlag]), §Y$INS_maludin_simbolan$§!([INS.GetFlag])) получают звание генерала."
 INS_big_militia_presence_tt: "Перейдет под контроль нашего ополчения при провозглашении независимости."
 INS_prepare_raiding_bases: "Подготовить базы для налётов"
 INS_prepare_raiding_bases_desc: "Мы воспользуемся своей агентурной сетью, чтобы тайно построить бункеры по всему архипелагу, и получим шанс нанести удар, как только революция начнётся."
 # <Joint Tree - Central Milestones>
 INSHOL_dutch_east_indies: "Голландская Ост-Индия"
 INSHOL_dutch_east_indies_desc: "Колония была основана почти 500 лет назад и с тех пор неоднократно меняла свой облик. Мир стремительно меняется, и наши нынешние действия определят будущее нидерландско-индонезийских отношений."
 INSHOL_the_war_in_europe: "Война в Европе"
 INSHOL_the_war_in_europe_desc: "Конфликт в Европе стремительно обостряется. Нидерланды вступили в войну, и мы больше не можем рассчитывать на их защиту. Нам придется самим постоять за себя, иначе мы рискуем попасть под власть иностранных держав."
 # <Joint Tree - Military Equipment Contracts>
 INSHOL_military_equipment_contracts: "Контракты на поставки военной техники"
 INSHOL_military_equipment_contracts_desc: "Ост-Индия — огромный архипелаг с десятками миллионов граждан, однако наш промышленный потенциал не позволяет нам самостоятельно обеспечивать свою защиту. Вместе с тем наши ресурсы открывают путь к мировой торговле. Заключив соответствующие соглашения с демократическими странами, мы сможем решить эту проблему."
 INSHOL_hawk_75a7: "«Хок» 75A-7"
 INSHOL_hawk_75a7_desc: "Американский истребитель «Хок» 75A-7 идеально подходит для Ост-Индии благодаря сочетанию доступности и боевой эффективности. Соглашение с производителем позволит нам провести необходимые улучшения наших ВВС."
 INSHOL_purchase_american_tanks: "Закупить американские танки"
 INSHOL_purchase_american_tanks_desc: "Ост-Индии не хватает промышленного потенциала, необходимого для производства танков, однако мы можем закупить их напрямую у Соединенных Штатов, профинансировав сделку за счет доходов от каучуковой промышленности."
 INSHOL_purchase_british_artillery: "Купить британскую артиллерию"
 INSHOL_purchase_british_artillery_desc: "Мы можем поручить производство артиллерии Соединенному Королевству, а сами сосредоточимся на других видах вооружений."
 INSHOL_produce_own_goods: "Производить собственные товары"
 INSHOL_produce_own_goods_desc: "У нас немало выгодных торговых соглашений, однако нельзя игнорировать и собственные производственные линии, а также военно-промышленные предприятия. Нужно поддержать их субсидиями, чтобы сократить нашу зависимость от импорта."
 # <Joint Tree - East Indies Investments>
 INSHOL_east_indies_investments: "Ост-индские инвестиции"
 INSHOL_east_indies_investments_desc: "Разумная метрополия развивает свои колонии. Вложения в экономическое развитие Ост-Индии отвечают нашим интересам и способствуют благосостоянию местного населения."
 INSHOL_east_indies_student_exchange: "Ост-индская программа обмена студентами"
 INSHOL_east_indies_student_exchange_desc: "Создание системы, при которой индонезийцы смогут обучаться в университетах Нидерландов, может существенно укрепить экономику как Нидерландов, так и Ост-Индии."
 INSHOL_east_indies_fokker_division: "Основать ост-индское подразделение компании «Фоккер»"
 INSHOL_east_indies_fokker_division_desc: "Компания «Фоккер» активно сотрудничает с ВВС Ост-Индии, так что имеет смысл создать дочернюю структуру, ориентированную именно на их потребности."
 INSHOL_expand_shell: "Расширить инфраструктуру компании «Шелл»"
 INSHOL_expand_shell_desc: "Компания «Шелл» постепенно занимает главенствующее положение в нашей экономике. Необходимо расширить нефтяную инфраструктуру в Ост-Индии, чтобы соответствовать ее экспортному потенциалу."
 INSHOL_increase_funding_for_tix: "Увеличить финансирование проекта бомбардировщика Т.IX"
 INSHOL_increase_funding_for_tix_desc: "Инженеры компании «Фоккер» работают над новым двухмоторным бомбардировщиком на замену устаревшей технике, стоящей на вооружении ВВС Ост-Индии. Проект сейчас получает недостаточно финансирования, так что его реализация, вероятно, затянется. Увеличение финансирования позволит значительно ускорить разработку."
 INSHOL_reduce_land_ownership_taxes: "Понизить налоги на владение землей"
 INSHOL_reduce_land_ownership_taxes_desc: "Необходимо понизить налоги, которые взимаются с индонезийцев, владеющих землей. Такие меры позволят стимулировать развитие фермерских хозяйств и предприятий."
 INSHOL_coffee_plantations: "Кофейные плантации"
 INSHOL_coffee_plantations_desc: "Следует сосредоточиться на приобретении дополнительных государственных земель на Восточных островах. Их можно использовать для создания кофейных плантаций."
 INSHOL_overallwagen: "Овервалваген"
 INSHOL_overallwagen_desc: "Танки — не самое оптимальное решение для ост-индской армии. Нам не хватает промышленной мощи для их производства, а сложный рельеф ограничивает их эффективность. Это можно было бы исправить, вложив средства в производство бронемашин для Индонезии."
 INSHOL_indonesian_cheap_labor: "Дешевый труд индонезийцев"
 INSHOL_indonesian_cheap_labor_desc: "$CONGO_cheap_labor_desc$" #LL: stealing this to save time, hope you don't mind!
 INSHOL_eastern_development_fund: "Фонд развития Восточных островов"
 INSHOL_eastern_development_fund_desc: "Мы вкладываем слишком много средств в развитие Явы и Суматры и при этом игнорируем большую часть территорий в остальных колониях. Необходимо развивать инфраструктуру на востоке, чтобы заложить основу для будущей индустриализации."
 INSHOL_increase_rubber_taxes: "Повысить налоги на каучук"
 INSHOL_increase_rubber_taxes_desc: "Ряд предприятий, занимающихся производством каучука на территории Ост-Индии, получают значительные прибыли за счет ресурсов колонии. Справедливо было бы обложить их повышенным налогом."
 INSHOL_reform_knil: "Реформировать Королевскую голландскую ост-индскую армию"
 INSHOL_reform_knil_desc: "Теперь, когда завоевание архипелага завершено, Королевская голландская ост-индская армия фактически осталась не у дел и испытывает серьезную нехватку финансирования. На фоне роста международной напряженности нужно поскорее провести перевооружение ост-индских войск."
 INSHOL_fund_ml_knil: "Финансировать ВВС Королевской голландской ост-индской армии"
 INSHOL_fund_ml_knil_desc: "Для поддержания паритета с вооруженными силами других стран необходимо сформировать полноценные собственные ВВС. В противном случае мы окажемся в серьезном проигрыше."
 INSHOL_bandung_aircraft_facility_tt: "§YЗападная Ява:§!\n    Получает §G1§! стройплощадку и §G1§! §Yвоенный завод§! за выполнение соответствующего фокуса."
 INSHOL_rangers: "Рейнджеры"
 INSHOL_rangers_desc: "Ост-Индия — это огромный архипелаг с большим природным разнообразием. Для защиты наших территорий необходимо подготовить подразделения рейнджеров к ведению боевых действий в таких сложных условиях."
 INSHOL_mountaineers: "Горные стрелки"
 INSHOL_mountaineers_desc: "Необходимо подготовить горнострелковые войска к ведению боевых действий на сложном рельефе нашего архипелага."
 INSHOL_elevate_elite_infantry: "Часть войск спецназначения"
 INSHOL_elevate_elite_infantry_desc: "Мы не можем вечно полагаться на стратегии, разработанные во времена Великой войны. Необходимо перенимать новые технологии и не допустить технологического отставания. Нам следует создать несколько элитных пехотных дивизий, готовых действовать в любых условиях."
 INSHOL_modernize_knil: "Модернизировать Королевскую голландскую ост-индскую армию"
 INSHOL_modernize_knil_desc: "Для сохранения нашего преимущества над противником мы выработаем новые стратегии и военные доктрины для ост-индской армии."
 INSHOL_transfer_of_henri_winkelman: "Перевод Генри Винкельмана"
 INSHOL_transfer_of_henri_winkelman_desc: "Генри Винкельман много лет прослужил в Королевской голландской ост-индской армии, и сейчас Ост-Индия вновь нуждается в его услугах. Нам следует организовать его официальный перевод в колонии."
 INSHOL_eastern_conscription: "Создать вспомогательный корпус"
 INSHOL_eastern_conscription_desc: "На Яве и Мадуре есть вспомогательные туземные корпуса, находящиеся под командованием местных князьков. В это сложное время необходимо договориться о передаче этих подразделений под наш контроль."
 INSHOL_establish_vk_knil: "Создать добровольческий корпус Королевской голландской ост-индской армии"
 INSHOL_establish_vk_knil_desc: "Мы создадим Женский добровольческий корпус в составе Королевской голландской ост-индской армии. Это поможет значительно улучшить наше снабжение и связь."
 INSHOL_emergency_dockyard_construction: "Экстренное строительство верфей"
 INSHOL_emergency_dockyard_construction_desc: "Опасность морского вторжения невозможно переоценить. Защита морских рубежей должна стать нашим главным приоритетом."
 INSHOL_emergency_powers_gov_general: "Чрезвычайные полномочия для генерал-губернатора"
 INSHOL_emergency_powers_gov_general_desc: "Идущая война требует принятия безотлагательных и сложных решений, но это невозможно, пока всё, что касается Ост-Индии, предварительно согласовывается с Нидерландами. [INS.GetLeader] должен получить чрезвычайные полномочия для оперативного принятия таких решений."
 INSHOL_emergency_naval_purchases: "Срочные закупки для нужд ВМС"
 INSHOL_emergency_naval_purchases_desc: "Наше побережье недостаточно защищено. Необходимо безотлагательно укрепить флот, иначе нас ждет неминуемая гибель. Мы закупим корабли у частных компаний за счет заемных средств и переоборудуем их в эсминцы."
 INSHOL_east_indies_navy: "Ост-индский флот"
 INSHOL_east_indies_navy_desc: "Отсутствие у [INS.GetNameRuGen] собственного военно-морского флота вынуждает Нидерланды принять на себя заботу об обороне колонии. На фоне растущей напряжённости в Европе и Азии так продолжаться не может. Необходимо сделать первый шаг к созданию собственного [INS.GetAdjRuLower]ого военно-морского флота."
 INSHOL_marines: "Морская пехота"
 INSHOL_marines_desc: "Нам нужно создать корпус морской пехоты в составе нового флота и отправить морпехов-новобранцев проходить подготовку на голландских кораблях."
 INSHOL_domestic_ship_production: "Отечественное кораблестроение"
 INSHOL_domestic_ship_production_desc: "Если мы хотим, чтобы наши корабли могли дать отпор соседям, нам нужно наращивать отечественное кораблестроение."
 INSHOL_destroyers: "Эсминцы"
 INSHOL_destroyers_desc: "Наши тяжёлые военные корабли не могут действовать в морях архипелага без поддержки кораблей охранения. Мы заложим новые эсминцы, чтобы [ROOT.GetAdjRuLower]ий флот мог охранять торговые пути и противостоять вражеским торпедоносцам в проливах."
 INSHOL_cruisers: "Крейсеры"
 INSHOL_cruisers_desc: "В отсутствие линкоров основой флота должны стать крейсеры. Строительство мощной эскадры крейсеров сформирует для [ROOT.GetAdjRuLower]ого флота мощное ядро, способное патрулировать обширные акватории между островами и давать отпор любым нарушителям наших морских границ."
 INSHOL_submarines: "Подводные лодки"
 INSHOL_submarines_desc: "Проливы Ост-Индии идеально подходят для засад, а подводные лодки куда дешевле тяжёлых кораблей, которые они отправляют на дно. Мощный подводный флот позволит [ROOT.GetAdjRuLower]ому флоту держать под контролем морские пути и мешать вражескому судоходству, не обнаруживая себя."
 INSHOL_outsourced_navy: "Передача кораблестроения корпорациям"
 INSHOL_outsourced_navy_desc: "У нас и без флота достаточно затрат, мы не можем повышать выделение бюджетных средств. Лучше заплатим корпорациям, и пусть кораблестроением занимаются они."
 INSHOL_divert_civilian_to_navy: "Финансирование флота в ущерб армейским и гражданским затратам"
 INSHOL_divert_civilian_to_navy_desc: "В нынешней международной обстановке опасность морского вторжения как никогда высока. Экономить на флоте нельзя: необходимо направлять на его строительство все средства, даже в ущерб всем прочим статьям государственного бюджета."
 INS_netherlands_can_remove_autonomy_tt_50: "\nЕсли [HOL.GetFlag]§Y[HOL.GetNameDefCap]§! заверша[HOL.GetNameEndRuPresentEtYut] этот фокус первым:\n    ([INS.GetFlag]§Y[INS.GetName]§!): добавляется §Y£autonomy_texticon -50,00§!"
 INS_netherlands_can_remove_autonomy_tt_75: "\nЕсли [HOL.GetFlag]§Y[HOL.GetNameDefCap]§! заверша[HOL.GetNameEndRuPresentEtYut] этот фокус первым:\n    ([INS.GetFlag]§Y[INS.GetName]§!): добавляется §Y£autonomy_texticon -75,00§!"
 INS_netherlands_can_remove_autonomy_tt_100: "\nЕсли [HOL.GetFlag]§Y[HOL.GetNameDefCap]§! заверша[HOL.GetNameEndRuPresentEtYut] этот фокус первым:\n    ([INS.GetFlag]§Y[INS.GetName]§!): добавляется §Y£autonomy_texticon -100,00§!"
 INS_netherlands_can_remove_autonomy_tt_150: "\nЕсли [HOL.GetFlag]§Y[HOL.GetNameDefCap]§! заверша[HOL.GetNameEndRuPresentEtYut] этот фокус первым:\n    ([INS.GetFlag]§Y[INS.GetName]§!): добавляется §Y£autonomy_texticon -150,00§!"
 INS_netherlands_can_remove_autonomy_tt_200: "\nЕсли [HOL.GetFlag]§Y[HOL.GetNameDefCap]§! заверша[HOL.GetNameEndRuPresentEtYut] этот фокус первым:\n    ([INS.GetFlag]§Y[INS.GetName]§!): добавляется §Y£autonomy_texticon -200,00§!"
 INS_netherlands_can_remove_autonomy_tt_250: "\nЕсли [HOL.GetFlag]§Y[HOL.GetNameDefCap]§! заверша[HOL.GetNameEndRuPresentEtYut] этот фокус первым:\n    ([INS.GetFlag]§Y[INS.GetName]§!): добавляется §Y£autonomy_texticon -250,00§!"
 INSHOL_begin_negotiations_soetardjo: "Начать переговоры с Сутарджо"
 INSHOL_begin_negotiations_soetardjo_desc: "Петиция Сутарджо о предоставлении автономии выглядит многообещающей и дает шанс на компромисс между националистами и лоялистами. Следует начать официальные переговоры с его партией."
 INSHOL_urge_gov_veto: "Призвать генерал-губернатора наложить вето"
 INSHOL_urge_gov_veto_desc: "Петиция Сутарджо — это уловка националистов, на которую может попасться правительство Ост-Индии. Мы должны призвать генерал-губернатора немедленно наложить на нее вето, иначе рискуем потерять нашу колонию."
 INSHOL_eventual_autonomy: "Согласиться на будущую автономию"
 INSHOL_eventual_autonomy_desc: "Стремление индонезийцев к независимости не ослабевает. Мы готовы согласиться на предоставление Ост-Индии автономии в будущем, но только при условии, что колония подтвердит свою жизнеспособность и приверженность демократическим идеалам."
 INSHOL_autonomous_dominion: "Петиция Сутарджо [GetYear] года"
 INSHOL_autonomous_dominion_desc: "Нидерланды придерживаются несправедливого определения «самостоятельности», которому мы вынуждены соответствовать, чтобы выполнить условия петиции Сутарджо. Тем не менее мы выполнили все эти требования благодаря отчаянному стремлению Индонезии к свободе. В рамках соглашения мы провозгласим полную и безоговорочную независимость от голландской короны."
 INS_cannot_become_independent_tt: "§W§Y[INS.GetFlag][INS.GetNameDefCap]§! §Rбольше не смо[INS.GetNameSuffixRuDzhetGut] обрести независимость§! без иностранного вмешательства.§!"
 INSHOL_sideline_the_volksraad: "Оттеснить фольксраад"
 INSHOL_sideline_the_volksraad_desc: "Петиция, представленная Сутарджо, грубо нарушает первую статью Конституции Нидерландов и только осложнит управление Ост-Индией. Петицию следует отклонить."
 INSHOL_prioritize_dutch_profits: "Отдать приоритет доходам Нидерландов"
 INSHOL_prioritize_dutch_profits_desc: "Основное внимание будет направлено на увеличение доходов метрополии. Их экономическая стабильность отвечает интересам всего королевства."
 INSHOL_development_loans_netherlands: "Привлечение инвестиционных кредитов из Нидерландов"
 INSHOL_development_loans_netherlands_desc: "Для ускорения индустриализации мы можем привлечь заемное финансирование от нидерландских компаний. Положение развивающейся колонии позволит нам рассчитывать на льготные процентные ставки, но проценты выплатить все равно придется."
 INSHOL_request_economic_dev_subsidy: "Запросить субсидии на экономическое развитие"
 INSHOL_request_economic_dev_subsidy_desc: "Мы доказали метрополии нашу ценность как прибыльной колонии. Это можно использовать в качестве рычага для получения субсидий на промышленное развитие."
 INSHOL_loyalty_to_crown: "Верность короне"
 INSHOL_loyalty_to_crown_desc: "Ост-Индию можно описывать по-разному, но в первую очередь мы остаемся верной голландской колонией. Королева Вильгельмина приведет нас к победе. Мы не допустим, чтобы национализм положил конец почти пяти векам общей истории, и подтвердим нашу абсолютную преданность короне."
 INS_loans_timer: "\nЧерез §Y365§! дней:"
 INS_expand_batavia_med_school_tt: "§Y$INS_dutch_east_indies$§!: модификатор темпов исследований не менее §G1,00%§!."
 INS_subsidize_local_business: "Субсидировать местные предприятия"
 INS_subsidize_local_business_desc: "Нам следует предоставить субсидии местным предприятиям. Это стимулирует экономический рост и в долгосрочной перспективе укрепит нашу экономику."
 INSHOL_education_reforms: "Реформы образования"
 INSHOL_education_reforms_desc: "Значительная часть населения Ост-Индии не имеет доступа к образованию, и лишь немногие окончили среднюю школу. Если мы хотим превратить Ост-Индию в богатое промышленно развитое государство, необходимо сделать образование общедоступным."
 INS_expand_batavia_med_school: "Расширить Батавскую медицинскую школу"
 INS_expand_batavia_med_school_desc: "Расширение Батавской медицинской школы за счет строительства новых корпусов и привлечения дополнительного преподавательского состава существенно повысит доступность профессионального образования. Это очень важно для долгосрочного экономического роста."
 INS_prepare_for_policy_shift: "Подготовка к изменению политического курса"
 INS_prepare_for_policy_shift_desc: "Политическая обстановка в Ост-Индии существенно изменилась из-за пробуждения национального самосознания в последние десятилетия. По всей видимости, наша текущая политика устарела. Стоит рассмотреть возможность реформирования нашей структуры управления."
 INS_reallocate_rubber_industry_funding: "Перераспределить финансирование каучуковой промышленности"
 INS_reallocate_rubber_industry_funding_desc: "Наша зависимость от экспорта каучука привела к катастрофическим последствиям для экономики. Ее необходимо диверсифицировать, а для этого следует провести геологоразведку и начать строительство шахт и фабрик по всему архипелагу. Потребуются значительные вложения, поэтому придется урезать бюджет на содержание каучуковых плантаций."
 INS_reallocate_rubber_industry_funding_tt: "Открывает решение о §Yсокращении государственного финансирования каучуковой промышленности§! и замене каучука на меньшие объемы §Yдругих ресурсов§!."
 INSHOL_nationalist_coallition: "Националистическая коалиция"
 INSHOL_nationalist_coallition_desc: "Фольксраад слишком долго говорил одним голосом, и этот голос был чересчур тихим. Время петиций и отсрочек прошло. Коалиция националистически настроенных членов палаты отложит свои распри и потребует безоговорочной независимости, а люди, которых голландцы когда-то отстранили от дел, будут приняты обратно в партию."
 INSHOL_volksraad_compromises: "Компромиссы фольксраада"
 INSHOL_volksraad_compromises_desc: "Реформы в парламенте помогли нам добиться значительных успехов, и сейчас мы не видим причин сворачивать с намеченного пути. Фольксраад продолжит свою кропотливую работу, обмениваясь уступками с Гаагой, чтобы прийти к самоуправлению благодаря терпению, не разрывая отношения. Будущее в составе голландского содружества даст нам гораздо больше, чем будущее за его пределами."
 INSHOL_establish_the_princely_council: "Учреждение княжеского совета"
 INSHOL_establish_the_princely_council_desc: "Султаны и раджи архипелага пользуются такой преданностью местных жителей, какой не смогла добиться ни одна палата Батавии. Их дворы старше и Ост-Индской компании, и республики, которая пришла ей на смену. Формальный совет княжеских домов предоставит этим правителям место в новом правительстве и объединит их власть с нашей."
 INSHOL_nationalize_dutch_companies: "Национализация голландских компаний"
 INSHOL_nationalize_dutch_companies_desc: "Крупные торговые дома, судоходные компании, плантации и банки слишком долго назывались по-голландски. Отныне их названия станут индонезийскими. Надписи на вывесках будут заменены, и капитал, который добывался здесь на протяжении трёх столетий, наконец-то станет принадлежать самим островам."
 INSHOL_democracy: "Демократическая Индонезия"
 INSHOL_democracy_desc: "Фольксраад начинал свою деятельность как полумера, консультативный орган с тщательно ограниченными полномочиями, который был призван создавать видимость представительства, не имеющего при этом реальной власти. Однако он перерос своих создателей. Палата станет настоящим законодательным органом, её членов будет избирать народ, интересы которого она представляет, а решения будут обязательными для правительства, когда-то державшего её на поводке."
 INSHOL_princely_authority: "Княжеская власть"
 INSHOL_princely_authority_desc: "Советники — это, конечно, хорошо, но султаны, чьи предки положили начало этому государству, могли бы добиться гораздо большего. Парламент не станет мешать тем, кто захочет возвысить одного из своих членов над остальными. Старые дворы долго ждали, но всё же вновь получили предложение взять власть в свои руки."
 INSHOL_encourage_further_investment: "Привлечение дополнительных инвестиций"
 INSHOL_encourage_further_investment_desc: "Условия, согласованные в фольксрааде, позволили урегулировать текущую политическую обстановку, и голландский капитал принял это к сведению. Теперь пошлины будут смягчены, гарантии будут продлены, а торговые палаты Амстердама и Роттердама получат гарантии, что архипелаг останется открытым для бизнеса. То, что было выгодно при старом порядке, останется выгодным и при новом."
 # <Joint Tree - ABDACOM>
 INSHOL_east_indies_artillery: "Ост-индийское производство артиллерии"
 INSHOL_east_indies_artillery_desc: "Открытие новых заводов по производству артиллерии на Яве позволит сократить нашу зависимость от импорта военной продукции."
 INSHOL_recall_gerardus_johannes_berenschot: "Отозвать генерала Беренсхота"
 INSHOL_recall_gerardus_johannes_berenschot_desc: "Герард Йоханнес Беренсхот — один из самых талантливых генералов Содружества. Большую часть своей карьеры он провел в Ост-Индии, но последние несколько лет служит в Нидерландах. В эти тяжелые времена следует отозвать его обратно в Ост-Индию."
 INSHOL_east_indies_cruiser_manufacturing: "Ост-индийское строительство крейсеров"
 INSHOL_east_indies_cruiser_manufacturing_desc: "Постройка собственных крейсеров вместо заказа у Нидерландов станет первым шагом на пути к созданию полноценного флота, столь необходимого на фоне японской угрозы."
 INSHOL_transfer_of_conrad_helfrich: "Перевести Конрада Хелфриха в Ост-Индию"
 INSHOL_transfer_of_conrad_helfrich_desc: "Перевод адмирала Конрада Хелфриха непосредственно в Ост-Индию позволит существенно усилить морскую оборону колонии."
 # <Joint Tree - Naval Program>
 INSHOL_naval_program: "Нидерландско-индонезийская военно-морская программа"
 INSHOL_naval_program_desc: "Флот Ост-Индии значительно уступает другим флотам, даже колониальным. Для всех сторон будет лучше, если мы поможем в строительстве этого нового флота и обеспечим его стремительное развитие."
 INSHOL_naval_program_transfer_25_tt: "Передать [INS.GetNameRuDat] §Y25%§! наших военно-морских сил."
 INSHOL_naval_program_transfer_25_2_tt: "§Y[HOL.GetFlag] [HOL.GetNameDefCap]§! переда[HOL.GetNameEndRuPresentEtYut] §Y25%§! своих военно-морских сил §Y[INS.GetNameRuDat]§!."
 INSHOL_naval_program_transfer_100_tt: "Передать [INS.GetNameRuDat] §Rвсе наши военно-морские силы§!."
 INSHOL_naval_program_transfer_100_2_tt: "§Y[HOL.GetFlag] [HOL.GetNameDefCap]§! переда[HOL.GetNameEndRuPresentEtYut] §Y[INS.GetNameRuDat]§! все свои военно-морские силы."
 INSHOL_naval_program_rejected_tt: "Открывает национальный фокус §Y«$INSHOL_naval_secondchance$»§!."
 INSHOL_hybrid_navy: "Гибридный флот"
 INSHOL_hybrid_navy_desc: "Наш флот не может полагаться исключительно на передачу тихоокеанской флотилии [HOL.GetNameRuGen]. Необходимо приступить к постройке собственных кораблей, иначе одна-единственная ошибка может привести к тому, что нам перережут пути морского снабжения."
 INSHOL_request_naval_control: "Ост-индский эскадрон"
 INSHOL_request_naval_control_desc: "В результате разгрома [HOL.GetNameDefCap] уже не в состоянии управлять собственным флотом. Нам следует взять его под свой контроль до окончания войны."
 INSHOL_naval_secondchance: "Военно-морская стратегия Ост-Индии"
 INSHOL_naval_secondchance_desc: "Несмотря на отказ [HOL.GetNameRuGen] передать контроль над флотом, нам все равно нужно как-то оборонять тихоокеанские территории, иначе нас попросту раздавят. Если бы они согласились на наше предложение, всё сложилось бы более удачно, но мы всё равно сможем найти приемлемое альтернативное решение."
 # <Joint Tree - Netherlands in Exile>
 INSHOL_netherlands_in_exile: "Нидерланды в изгнании"
 INSHOL_netherlands_in_exile_desc: "Как ни прискорбно это признавать, наше королевство разгромлено. Но нам нельзя поддаваться пораженческим настроениям. Нужно принять этот факт и сосредоточиться на том, что еще можно спасти."
 # INSHOL_relocate_prime_minister: "Relocate the Prime Minister to Java"
 INSHOL_relocate_our_generals: "Перевод нашей армии на Яву"
 INSHOL_relocate_our_generals_desc: "Оставшиеся в изгнании генералы, командиры и обороняющиеся солдаты должны быть срочно переброшены в регион [1058.GetName], пока не стало слишком поздно."
 #INSHOL_relocate_our_soldiers: "Transfer Holdout Soldiers to Java"
 INSHOL_netherlands_indonesia_union: "Нидерландско-Индонезийский Союз"
 INSHOL_netherlands_indonesia_union_desc: "Идея равноправного союзного государства [HOL.GetNameRuGen] и [INS.GetNameRuGen] многим кажется смехотворной, но в условиях нынешнего кризиса это единственный способ сохранить суверенитет."
 # <Sukarno Shared Branch - Resistance Buildup>
 INS_underground_revolution: "Подпольная революция"
 INS_underground_revolution_desc: "Мы начнем тайную подготовку к революции, постепенно наращивая численность наших сторонников и активность бойцов ополчения до тех пор, пока не будем готовы действовать."
 INS_infiltrate_the_media: "Проникновение в СМИ"
 INS_infiltrate_the_media_desc: "Наше движение заручилось поддержкой ряда высокопоставленных представителей СМИ в Ост-Индии. Мы можем использовать эти связи для незаметного формирования симпатий к революционным идеям."
 INS_infiltrate_the_army: "Проникновение в армию"
 INS_infiltrate_the_army_desc: "Многие наши сторонники, от рядовых до старших офицеров, служат в Королевской голландской ост-индской армии. Мы должны собирать как можно больше информации и одновременно продвигать наших людей на ключевые должности. В нужный момент мы сможем посеять хаос в армии."
 INS_privately_owned_military_industry: "Частная военная промышленность"
 INS_privately_owned_military_industry_desc: "Мы создадим сеть теневых компаний в военно-промышленном комплексе для сохранения контроля над отраслью после начала революции."
 INS_privately_owned_military_industry_tt: "Добавить §G2§! §Yвоенных завода§! в районе вашего штаба."
 INS_instigate_chaos_sulawesi: "Спровоцировать хаос на Сулавеси"
 INS_instigate_chaos_sulawesi_desc: "Мы наладим сотрудничество с местными националистами на Сулавеси, в том числе займемся организацией забастовок и беспорядков, а также радикализацией населения."
 INS_instigate_chaos_sulawesi_tt: "После провозглашения независимости регионы §Y[673.GetName]§! и §Y[1056.GetName]§! станут нашими §Gнациональными территориями§!. При этом они не будут национальными территориями Голландской Ост-Индии."
 INS_instigate_chaos_medan: "Спровоцировать хаос в Медане"
 INS_instigate_chaos_medan_desc: "Мы наладим сотрудничество с местными националистами в Медане и Риау, в том числе займемся организацией забастовок и беспорядков, а также радикализацией населения."
 INS_instigate_chaos_medan_tt: "После провозглашения независимости регион §Y[1049.GetName]§! станет нашей §Gнациональной территорией§!. При этом он не будет национальной территорией Голландской Ост-Индии."
 INS_embezzlement_scheme_in_batavia: "Схема хищений в Батавии"
 INS_embezzlement_scheme_in_batavia_desc: "Мы разработаем схему по переносу нашего производства из Батавии на территорию республики после провозглашения независимости."
 INS_embezzlement_scheme_in_batavia_tt: "После провозглашения независимости половина всех фабрик в регионе §Y[1058.GetName]§! будет перемещена в наш §Yреволюционный штаб§!."
 INS_volksraad_rumors: "Слухи в фольксрааде"
 INS_volksraad_rumors_desc: "Мы начнем тайное обсуждение революции в стенах фольксраада. В случае успеха мы сможем убедить индонезийских членов фольксраада примкнуть к нам."
 INS_volksraad_rumors_tt: "Все §Yиндонезийские §!советники фольксраада §Gсохранят§! свои места и после провозглашения независимости."
 INS_railway_youth_force: "Сотрудничать с Железнодорожной молодежной организацией"
 INS_railway_youth_force_desc: "Железнодорожная молодежная организация — это исламское молодежное ополчение, получившее свое название из-за тактики захвата железных дорог и действующее преимущественно на территории Центральной Явы. Они полны энергии, рвутся в бой и способны стать ценным союзником, однако в случае затяжного перемирия правительство может потерять их поддержку."
 INS_sleeper_informant_network: "[GetInformantNetworkName]"
 INS_Sleeper_Informant_Network_name: "Сеть тайных информаторов"
 INS_KNIL_Informant_Network_name: "Сеть информаторов в Королевской голландской ост-индской армии"
 INS_sleeper_informant_network_desc: "Мы создадим сеть информаторов и внедрим их по всему административному аппарату Королевской голландской ост-индской армии, что позволит нам заблаговременно узнавать о планах противника."
 INS_sleeper_informant_network_tt: "§RКогда объявлена независимость:§!\n"
 # <Sukarno Shared Branch - Peoples Security Army>
 INS_the_peoples_security_army: "Армия народной безопасности"
 INS_the_peoples_security_army_desc: "Наши сторонники, большинство из которых молодые индонезийцы, теряют терпение. Они хотят внести свой вклад в борьбу за нашу независимость. Необходимо сформировать Революционные вооруженные силы и начать подготовку будущих солдат."
 INS_commander_sudirman: "Армия Судирмана"
 INS_commander_sudirman_desc: "Несмотря на свою молодость, Судирман демонстрирует огромный потенциал и пользуется большой популярностью среди юных участников сопротивления. Он должен возглавить Армию народной безопасности и повести нас к победе."
 INS_commander_oerip: "Армия Урипа"
 INS_commander_oerip_desc: "Имея за плечами почти тридцать лет службы, Урип — единственный индонезиец, получивший чин майора в Королевской голландской ост-индской армии. По знаниям и опыту он на голову выше всех остальных наших сторонников. Он должен возглавить Армию народной безопасности и повести нас к победе."
 INS_sudirmans_promotion: "Повышение Судирмана в звании"
 INS_sudirmans_promotion_desc: "Судирман проявил выдающиеся лидерские качества и организовал несколько успешных штурмов. Пришло время отметить заслуги нашего командира и присвоить ему звание генерала, которое он заслуживает."
 INS_tkr_steal_general: "Переманить генералов Королевской голландской ост-индской армии"
 INS_tkr_steal_general_desc: "Если нам удастся привлечь на свою сторону высокопоставленных офицеров ост-индской армии, мы одновременно усилим наши вооруженные силы и подорвем боеспособность колониальных войск."
 INS_tkr_supply: "Все революционеры должны сражаться"
 INS_tkr_supply_desc: "Мы введем обязательную военную подготовку для всех сторонников нашего движения."
 INS_tkr_professional_army: "Профессиональная армия"
 INS_tkr_professional_army_desc: "Недостаточно опираться исключительно на ополчение — необходимо создать профессиональную республиканскую армию для поддержания порядка."
 INS_arm_the_revolutionaries: "Вооружить революционеров"
 INS_arm_the_revolutionaries_desc: "Начать стоит с революционеров и националистов, поскольку они полны энергии и готовы пожертвовать ради Индонезии всем, что у них есть. Мы предоставим им подготовку и снаряжение, необходимые для борьбы за родную страну."
 INS_arm_the_youth: "Вооружить молодежь"
 INS_arm_the_youth_desc: "Необходимо вооружить не только революционеров, но и молодежь. Преисполненные сил и надежд, они понесут факел революции. Мы должны подготовить и вооружить как можно больше молодых индонезийцев. Если война постучит в их двери, они встретят ее во всеоружии."
 INS_arm_the_students: "Вооружить студентов"
 INS_arm_the_students_desc: "На протяжении десятилетий студенты составляли основу революционного движения и продолжат играть в нем ведущую роль."
 INS_guerilla_industry: "Партизанская производственная база"
 INS_guerilla_industry_desc: "Мы задействуем наши партизанские отряды по всему архипелагу для захвата фабрик, что позволит наладить производство оружия для нашего ополчения."
 INS_indonesian_assault_doctrine: "Индонезийская штурмовая доктрина"
 INS_indonesian_assault_doctrine_desc: "Война — это не только солдаты. Миллион человек без оружия ничего не стоит. Нашим приоритетом должны стать закупки высококачественной артиллерии для воздействия на всю глубину оборонительных порядков противника."
 INS_tighter_tkr_integration: "Усиление интеграции Армии народной безопасности и народного ополчения"
 INS_tighter_tkr_integration_desc: "В действиях Армии народной безопасности и различных групп ополчения отсутствует слаженность, а координация носит ограниченный характер. В условиях затяжной войны это приведет лишь к появлению новых проблем. Необходимо объединить вооруженные силы и отряды ополчения в единую структуру, невзирая на неизбежное недовольство со стороны командиров ополчения."
 INS_quality_over_quantity: "Качество, а не количество"
 INS_quality_over_quantity_desc: "Один солдат с хорошей выучкой, тактической подготовкой и современным вооружением способен одолеть пять студентов с пистолетами. Следует делать ставку на хорошо подготовленные и вооруженные войска и спецподразделения, а не на массовую мобилизацию."
 INS_add_militia_cap_1_tt: "Лимит дивизии §Yборцов за свободу§! повышается на §Y1§!.\n"
 INS_add_militia_cap_2_tt: "Лимит дивизии §Yборцов за свободу§! повышается на §Y2§!.\n"
 INS_add_militia_cap_3_tt: "Лимит дивизии §Yборцов за свободу§! повышается на §Y3§!.\n"
 INS_add_3_militia_unit_tt: "Появятся три подразделения §Yборцов за свободу§!, которые можно будет отправлять в §Yналёты§!, чтобы увеличить §Gприсутствие ополчения§! в голландских регионах."
 INS_add_fully_trained_militia_unit_tt: "Будет создано одно обученное подразделение §Yборцов за свободу§!.\n"
 # <Sukarno Shared Branch - Expand Resistance Membership>
 INS_expand_resistance_membership: "Увеличить численность сопротивления"
 INS_expand_resistance_membership_desc: "Концентрация всех сил нашего движения в одном месте может привести к нашему разгрому. Следует начать набор новых бойцов в отряды ополчения и их отправку в другие части Индонезии в качестве эмиссаров. Так мы повысим нашу популярность и упрочим контроль над разными регионами страны."
 # <Central Independence Branch - Militias>
 INS_deploy_the_kris: "Индонезийская народная служба Сулавеси"
 INS_deploy_the_kris_desc: "Индонезийская народная служба Сулавеси, или на индонезийском KRIS, представляет собой активную группу ополченцев и составляет основную силу на Сулавеси и в Манадо. Нужно привлечь их на сторону Армии народной безопасности."
 INS_assist_the_pemuda: "Помочь отрядам Народной молодежи"
 INS_assist_the_pemuda_desc: "На Яве действует множество студенческих отрядов Народной молодежи, или Пемуды. Мы можем приобрести ценного союзника, если объединимся с ними и окажем им военную поддержку в боевых действиях против голландцев."
 INS_mobilize_the_pemuda: "Мобилизовать отряды Народной молодежи"
 INS_mobilize_the_pemuda_desc: "После установления доверительных отношений с крупнейшими отрядами Народной молодежи стоит продумать планы по их мобилизации в Армию народной безопасности."
 INS_organize_jakarta_pemuda: "Организовать отряды Народной молодежи в Джакарте"
 INS_organize_jakarta_pemuda_desc: "На Яве действует множество отрядов Народной молодежи различной численности. Хотя нам удалось мобилизовать и привлечь на нашу сторону большую часть Пемуды, в Джакарте по-прежнему остаются десятки независимых групп. Необходимо установить с ними контакт и наладить сотрудничество."
 INS_recognize_moestopos_batallion: "Признание батальона Мустопо"
 INS_recognize_moestopos_batallion_desc: "Революционер по имени Мустопо провозгласил себя «исполняющим обязанности министра обороны» в Сурабае и фактически контролирует местные силы ополчения. Его усилия заслуживают признания. Мы должны официально присвоить ему звание генерал-майора Армии народной безопасности."
 INS_darul_islam_focus: "Дарул Ислам"
 INS_darul_islam_focus_desc: "Хизбулла Картосоевирджо доказала свою эффективность в холмах западной Явы, и мы не можем допустить, чтобы такие бойцы действовали сами по себе. Нужно объединить его нерегулярные части с нашими и дать ему заслуженное звание. Скоро верующие докажут республике свою правоту."
 # <Central Independence Branch - Navy>
 INS_just_a_fisherman: "Просто рыбак"
 INS_just_a_fisherman_desc: "Ведение войны на архипелаге без флота — задача сложная, и нас надолго не хватит. Мы можем пойти на, возможно, наивный шаг — перебросим бойцов в контролируемые голландцами порты на рыбачьих лодках под видом рыбаков."
 INS_a_cheap_navy: "Дешевый флот"
 INS_a_cheap_navy_desc: "У нас нет ни времени, ни ресурсов для создания полноценного современного флота. Придется обходиться имеющимися средствами и пускать в дело всё, что попадется под руку."
 INS_divert_army_funds_to_navy: "Перенаправить средства для армии флоту"
 INS_divert_army_funds_to_navy_desc: "Индонезия — это архипелаг, так что наша пехота не сможет обойтись без кораблей. Перенаправление нашему новому флоту средств, предназначенных для Армии народной безопасности — оправданный шаг."
 INS_indonesian_naval_doctrine: "Индонезийская морская доктрина"
 INS_indonesian_naval_doctrine_desc: "Развивая собственный флот, важно определить принципы его подготовки и применения. Мы должны в кратчайшие сроки разработать и принять морскую доктрину."
 INS_domestic_shipbuilding: "Отечественное судостроение"
 INS_domestic_shipbuilding_desc: "Мы не можем вечно полагаться на трофейные и закупленные корабли. Скоро наступит момент, когда нам нечего будет захватывать — у голландцев просто кончатся суда. Необходимо как можно раньше начать строительство собственных кораблей."
 INS_acquire_modern_blueprints: "Приобрести современные чертежи"
 INS_acquire_modern_blueprints_desc: "Для строительства нашего нового флота мы приобретем чертежи в других странах и у частных компаний."
 INS_reclaiming_the_dutch_navy: "Захват флота Голландской Ост-Индии"
 INS_reclaiming_the_dutch_navy_desc: "В занятых нами портах остается немало голландских кораблей. Необходимо захватить эти суда, пока еще есть такая возможность."
 INS_admiral_mas_pardi: "Адмирал Мас Парди"
 INS_admiral_mas_pardi_desc: "Любому хорошему флоту нужен адмирал. Мас Парди — очевидный выбор."
 INS_akademi_angkatan_laut: "Построить Индонезийскую военно-морскую академию"
 INS_akademi_angkatan_laut_desc: "Мы построим военно-морскую академию с базой для проведения исследований, которая станет центром подготовки инженерного и высшего командного состава."
 # <Central Independence Branch - Militia Logistics>
 INS_pki_militia_tt: "Тан Малака контролирует одну из самых мощных группировок ополчения в стране, однако он сражается не только за свободу Индонезии, но еще и за построение §Rкоммунизма§! и установление советской власти. §RРано или поздно они перейдут к насильственному сопротивлению любому некоммунистическому правительству.§!"
 INS_increase_laskar_funding_tt: "§WДает§! 1§Y военный завод§! за каждое исполненное требование ополчения (не более §G6§!)"
 INS_subsidize_laskar_armament: "Субсидировать вооружение народного ополчения"
 INS_subsidize_laskar_armament_desc: "Ополченцы с бамбуковыми копьями обречены в столкновении с вооруженными до зубов воинскими подразделениями. Мы должны срочно увеличить производство оружия и боеприпасов."
 INS_loot_knil_weapons_caches: "Разграбить схроны с оружием Королевской голландской ост-индской армии"
 INS_loot_knil_weapons_caches_desc: "Королевская голландская ост-индская армия оставила после себя множество схронов с оружием, обустроенных еще до революции. Многие из наших сторонников ранее служили в армии, так что с их помощью, возможно, нам удастся найти и разграбить эти схроны."
 INS_utilize_tan_malakas_militia: "Задействовать ополчение Тан Малаки"
 INS_utilize_tan_malakas_militia_desc: "Красное ополчение Тан Малаки — вероятно, самое мощное военизированное формирование во всей Индонезии, и его интеграция в Армию народной безопасности дала бы нам серьезное преимущество. Это предприятие сопряжено с определенными рисками, поскольку передача таких рычагов влияния столь мощной группировке, преследующей амбициозные политические цели, существенно облегчит им захват власти."
 INS_increase_laskar_funding: "Увеличить финансирование народного ополчения"
 INS_increase_laskar_funding_desc: "Ополчение составляет основу наших вооруженных сил. Стоит это признать и предоставить ему соответствующее финансирование, даже если [INS.GetLeader] не сможет рассчитывать на лояльность отдельных группировок."
 INS_develop_a_functioning_airforce: "Создать полноценные ВВС"
 INS_develop_a_functioning_airforce_desc: "Военно-воздушные силы — крайне важная часть армии. Формирование собственных ВВС должно стать одним из наших приоритетов."
 # <Vice Presidential Edict - Intro>
 INS_political_stabilization: "Восстановить порядок"
 INS_political_stabilization_desc: "С каждым днем ситуация в стране ухудшается. Если мы не предпримем срочных мер, она практически неизбежно перерастет в гражданскую войну. Необходимо начать переговоры между Национальным комитетом, президентом и руководителями ополчения для выработки взаимоприемлемого решения."
 INS_vice_presidential_edict: "Подписать Десятый декрет вице-президента"
 INS_vice_presidential_edict_desc: "Национальный комитет практически единодушен в своих требованиях реальных законодательных полномочий. Президент уже получил соответствующее обращение с предложением о переходе к гибридной системе правления, при которой Национальный комитет станет независимым парламентом и будет делить законодательную власть с президентом. Несмотря на свою заманчивость, это предложение несет риск существенного ограничения президентских полномочий."
 INS_local_cooperatives: "Создать местные кооперативы"
 INS_local_cooperatives_desc: "Мы должны отказаться от слепого копирования западной капиталистической модели, однако игнорировать экономические преимущества приватизации нельзя. Мы разрешим создание местных кооперативов, собственники которых смогут оставлять себе прибыль. Тем не менее они будут находиться под надзором государства и ограничены в праве расширять свою деятельность за пределы оговоренной территории."
 INS_local_unity: "Частичная автономия княжеств"
 INS_local_unity_desc: "Мы предоставим туземным княжествам частичную автономию. Эта временная мера позволит сократить внутренние распри в этот напряженный период."
 INS_education_subsidies: "Субсидии на образование"
 INS_education_subsidies_desc: "Инвестиции в молодежь как в будущее нашего народа являются необходимым условием экономического процветания государства. Мы построим доступные школы по всей республике."
 INS_land_reform: "Земельная реформа"
 INS_land_reform_desc: "До провозглашения Индонезией независимости Нидерланды напрямую владели обширными земельными угодьями. Мы должны их перераспределить по доступным ценам среди индонезийцев, желающих их возделывать. Тем самым мы ускорим экономическое развитие страны."
 INS_dominion_of_atjeh: "Доминион Ачех"
 INS_dominion_of_atjeh_desc: "Сепаратистское движение в Ачехе процветает и расширяется. Нет нужды обострять ситуацию — следует найти взаимоприемлемый компромисс, при котором регион останется в составе Индонезии на правах широкой автономии."
 # <Vice Presidential Edict - Presidential Balance>
 INS_dissolve_national_party: "Распустить Национальную партию"
 INS_dissolve_national_party_desc: "Гибридная система была создана как вынужденная мера против хаоса. Нельзя допустить, чтобы в руках президентах была сосредоточена такая власть в обход демократических процедур. Парламент должен сместить президента, иначе подлинная демократия никогда не восторжествует."
 INS_womens_sufferage: "Женское избирательное право"
 INS_womens_sufferage_desc: "Расширение избирательного права на женщин может вызвать временную нестабильность, однако без этого невозможно обеспечить стабильность и демократический путь развития в будущем."
 INS_women_in_military: "Женщины в армии"
 INS_women_in_military_desc: "Разрешение женщинам служить в армии усилит наши вооруженные силы."
 INS_fair_election: "Честные выборы"
 INS_fair_election_desc: "После смещения президента и завершения революции мы наконец-то можем провести первые свободные и поистине справедливые выборы без давления со стороны авторитарной власти."
 # < Hybrid Politics >
 INS_continue_hybrid_politics: "Продолжение гибридной политики"
 INS_continue_hybrid_politics_desc: "Гибридная политика — это вынужденное зло. Несмотря на то, что конечной целью остается построение подлинной демократии, Индонезия пока слишком молода и нестабильна, чтобы передать всю полноту власти народу. Президент и парламент продолжат уравновешивать друг друга, обеспечивая баланс власти."
 INS_guided_economy: "Направляемая экономика"
 INS_guided_economy_desc: "Индонезийская экономика должна находиться под прямым контролем государства. Мы проведем национализацию всех банков, нефтяных и сельскохозяйственных предприятий."
 INS_reform_education_system: "Обязательное идеологическое обучение"
 INS_reform_education_system_desc: "Опыт революции показал, что именно студенты и молодежь, недовольные общественным укладом, становятся движущей силой восстания. В целях обеспечения безопасности государства и народа мы обяжем учебные заведения вести образовательный процесс исключительно в рамках официальной идеологии."
 INS_reform_education_system_2: "Реформа образования"
 INS_reform_education_system_2_desc: "Если мы хотим, чтобы в будущем Индонезия стала процветающей страной, все индонезийцы, независимо от места рождения, должны иметь доступ к образованию."
 INS_three_year_plan: "Трехлетний план"
 INS_three_year_plan_desc: "Мы можем разработать трехлетний план развития инфраструктуры по соединению коммуникациями всех островов архипелага."
 INS_destroy_pacific_colonialism: "Уничтожить тихоокеанский колониализм"
 INS_destroy_pacific_colonialism_desc: "Хоть революция и завершилась, но борьба продолжается. Люди у наших границ всё еще страдают под гнетом колониального режима. Мы не имеем права бездействовать — настало время принести им свободу!"
 INS_rapid_mobilization: "Быстрая мобилизация"
 INS_rapid_mobilization_desc: "Сильное государство невозможно без сильной армии. Если мы стремимся стать региональной сверхдержавой, способной за себя постоять, необходимо существенно укрепить наши вооруженные силы."
 INS_greater_indonesia: "Объявить о создании Великой Индонезии"
 INS_greater_indonesia_desc: "Империя Нусантара некогда объединяла весь малайский мир. Освободив Малайю от колониальной тирании, мы, подобно нашим предкам в Нусантаре, должны провозгласить единое малайское государство."
 # < State Religion >
 INS_secularism: "Секуляризм"
 INS_secularism_desc: "Индонезия — многонациональная и многоконфессиональная страна. Смешение религии и политики неизбежно приведет к внутренним распрям, поэтому религиозные политические партии следует запретить."
 INS_integrate_sarekat_islam: "Интегрировать Сарекат Ислам"
 INS_integrate_sarekat_islam_desc: "Крупные исламские политические партии, такие как Сарекат Ислам, или Исламский союз, пользуются широкой народной поддержкой. В наших интересах привлечь их к работе в правительстве."
 # <Vice Presidential Edict - Sjahrir>
 INS_sjahrirs_continued_tenure: "Дальнейшее пребывание Шарира на посту премьер-министра"
 INS_sjahrirs_continued_tenure_desc: "Премьер-министр Шарир зарекомендовал себя как эффективный лидер: он провел страну через революцию, укрепил нашу экономику и заложил основы демократии. Мы должны переизбрать его на новый срок на посту премьер-министра."
 INS_unity_in_diversity: "Единство в многообразии"
 INS_unity_in_diversity_desc: "На протяжении веков слова «единство в многообразии» отражали дух нашего архипелага. Во время революции эта идея стала объединяющим девизом, напоминая индонезийцам о том, что, несмотря на различия в языках и традициях, мы — один народ. Мы должны закрепить эту фразу в нашей конституции, чтобы сберечь наше единство на долгие века."
 INS_the_timor_issue: "[INS_timor_issue_scripted_name]"
 INS_timor_issue_scripted_name_issue: "Тиморский вопрос"
 INS_timor_issue_scripted_name_attack: "Напасть на Восточный Тимор"
 INS_the_timor_issue_desc: "[INS_timor_issue_scripted_desc]"
 INS_timor_issue_scripted_desc_issue: "Восточный Тимор по праву является частью Индонезии, однако до сих пор остается под колониальным гнетом, несмотря на недавно завершившуюся революцию. Мы направим ультиматум [721.OWNER.GetNameRuDat] и потребуем немедленной передачи Восточного Тимора."
 INS_timor_issue_scripted_desc_attack: "Восточный Тимор — это очевидно законная территория Индонезии. Хотя повстанцы на острове могут заявлять о независимости, они явно не говорят от лица всего населения. Осколки португальского колониализма должны быть интегрированы в состав Республики."
 INS_pledge_to_allies: "Сближение с Союзниками"
 INS_pledge_to_allies_desc: "В условиях нарастающей глобальной напряженности мы рискуем оказаться один на один с угрозой иностранного вторжения. Несмотря на сложные отношения с Союзниками, мы зарекомендовали себя как демократическое государство в Тихоокеанском регионе и должны присоединиться к крупнейшим демократическим странам."
 INS_mixed_economy_system: "Смешанная экономическая система"
 INS_mixed_economy_system_desc: "Индонезия — страна особого пути, и ни классический капитализм, ни коммунизм ей не подходят. Лучшим вариантом будет смешанная экономика, сочетающая элементы обеих систем."
 INS_social_democracy: "Социал-демократия"
 INS_social_democracy_desc: "[INS.GetAdjective]ая экономика продемонстрировала значительный рост благодаря политике Шахрира. Следует провозгласить Индонезию полноценным социально-демократическим государством и строить дальнейшую экономическую политику на принципах социальной демократии."
 # <Vice Presidential Edict - Sjarifuddin>
 INS_prime_minister_sjarifuddin: "Премьер-министр Шарифуддин"
 INS_prime_minister_sjarifuddin_desc: "Шарифуддин — наиболее подходящий для Индонезии кандидат, поскольку его умеренная политика позволяет находить компромисс между коммунистами и социалистами."
 INS_concessions_to_communists: "Уступки коммунистам"
 INS_concessions_to_communists_desc: "Коммунистическая партия Индонезии имеет достаточно большое число мест в парламенте, и предоставление ее лидерам министерских портфелей может стать залогом политической стабильности."
 INS_sjarifuddin_focus_2: "Самоуправляемая экспортная экономика"
 INS_sjarifuddin_focus_2_desc: "С обретением независимости нам следует пересмотреть систему экспортной экономики и реорганизовать её так, чтобы она больше не работала на голландский капитал. Экономика, основанная на экспорте, — рискованное предприятие, но мы можем сделать её куда более надёжной, чем в предыдущие годы."
 # <Vice Presidential Edict - Hatta>
 INS_prime_minister_hatta: "Премьер-министр Хатта"
 INS_prime_minister_hatta_desc: "Мохаммад Хатта известен тем, что начал революцию, занимал пост вице-президента и более склонен к демократизации, чем Сукарно. Он станет подходящим премьер-министром, чью кандидатуру примет большинство партий."
 INS_hatta_focus_2: "Следующие шаги"
 INS_hatta_focus_2_desc: "Революция закончилась. Некоторые политические деятели настаивают на её продолжении, но эти голоса следует игнорировать. Вместо этого нужно смотреть в будущее. Мы должны развивать Индонезию, чтобы будущие поколения жили в достатке."
 INS_hatta_princely_advisors: "Интеграция княжеских земель"
 INS_hatta_princely_advisors_desc: "Мы видим единство в нашем общем многообразии. Этот принцип лежит в основе нашей страны, но после окончания революции эта идея стала забываться в отсутствие общей борьбы. Чтобы предотвратить недовольство и восстания со стороны меньшинств, нам следует создать дополнительный совет, благодаря которому правители местных княжеств смогут напрямую участвовать в национальной политике."
 INS_prime_minister_tt: "Первые индонезийские всеобщие выборы завершились"
 # < Guided Democracy >
 INS_guided_democracy: "Управляемая демократия"
 INS_guided_democracy_desc: "Демократия — это идеал, к которому стоит стремиться, однако, если мы передадим власть народным массам сейчас, это приведет лишь к хаосу. Следует провозгласить Сукарно пожизненным президентом. Он будет контролировать деятельность демократического парламента и вмешиваться в его работу при необходимости."
 INS_enact_militarism: "Курс на милитаризацию"
 INS_enact_militarism_desc: "Нам следует извлечь определенные уроки из опыта [JAP.GetNameRuGen] и их милитаристской политики. Заимствование этих принципов послужит укреплению нашего нового правительства."
 INS_sukarnos_industrialization: "Укрепить яванскую промышленность"
 INS_sukarnos_industrialization_desc: "Яванская промышленность — опора нашей экономики и армии. Все усилия должны быть направлены на ее укрепление."
 INS_sukarnos_industrialization2: "Каждый должен внести свою лепту"
 INS_sukarnos_industrialization2_desc: "Военные нужды — главный приоритет страны, и каждый индонезиец обязан внести свой вклад. Роскошь — враг, а расширение военно-промышленного комплекса — жизненная необходимость."
 INS_japanese_military_lessons: "Японский военный опыт"
 INS_japanese_military_lessons_desc: "Нам необходимо внимательно изучить военную доктрину Японии и перестроить нашу армию в соответствии с ее принципами."
 # < Support Tan Malaka's Coup>
 INS_support_tan_malakas_coup: "Поддержать переворот Тан Малаки"
 INS_support_tan_malakas_coup_desc: "Сукарно провозгласил нашу независимость, однако он проявил себя сторонником полумер и дипломатических уступок. Тан Малака и его Фронт борьбы требуют того же, чего и народ: полной независимости, без переговоров и компромиссов. Если Сукарно не готов бороться за дело революции до конца, значит, ей нужен новый лидер."
 INS_minimum_program: "Программа-минимум"
 INS_minimum_program_desc: "Фронт борьбы выдвинул свои требования: народное правительство, народная армия и национализация всех плантаций и предприятий, принадлежащих иностранцам. Для реализации этой программы необходимы компетентные кадры. Нджоно представляет интересы рабочих, Сетьяджит — партийной интеллигенции. Их союз обеспечит единство всех участников революции на всех уровнях — от заводов до высших органов власти."
 INS_agrarian_reform: "Аграрная реформа"
 INS_agrarian_reform_desc: "На протяжении трех столетий индонезийская земля была источником обогащения чужеземных плантаторов, а обрабатывавшие ее крестьяне оставались в нищете. Революция, которая оставит прежний порядок вещей — просто фикция. Земля должна принадлежать тем, кто ее возделывает."
 INS_soviet_aid: "Помощь из СССР"
 INS_soviet_aid_desc: "Советский Союз признал нашу революцию и готов оказать ей помощь. Несмотря на различия в наших с Москвой программах, мы не в том положении, чтобы отказываться от ее помощи. Мы должны принять оружие и продолжить борьбу."
 INS_pacific_revolution: "Тихоокеанская революция"
 INS_pacific_revolution_desc: "Колониальные державы не покидали Азию — они лишь потеряли Индонезию. Прежний порядок до сих пор сохраняется в Малайе и на Филиппинах, но там уже есть силы, которые хотят покончить с ним раз и навсегда. Благодаря нашей революции у нас есть и авторитет, и моральный долг прийти им на помощь. Мы не можем поступить иначе."
 INS_purge_oppurtunists_tt: "Открывает действие §Y«$INS_launch_revolution$»§! в странах, где поддержка коммунистов составляет §Y60%§! или более. Страны, в которых мы спровоцируем революции, станут нашими §Yмарионетками§!."
 INS_purge_oppurtunists: "Чистка оппортунистов"
 INS_purge_oppurtunists_desc: "Двадцать лет Муссо учился в Москве беспрекословному подчинению и вернулся с инструкциями и планом превратить нашу республику в марионетку Коминтерна. Мы не для того свергали голландцев, чтобы склониться перед новым чужеземным хозяином. Оппортунисты, готовые продать плоды нашей революции Москве, будут уничтожены, а освобожденные нами народы будут ориентироваться на Джакарту, а не на Кремль."
 INS_federation_of_aslia: "Аслийская федерация"
 INS_federation_of_aslia_desc: "Освобожденные нами народы не останутся один на один со своими проблемами. Тан Малака всегда мечтал о чём-то большем, чем просто одна республика, — о федерации, простирающейся от материка до островов в Тихом океане, единой и способной противостоять любой колониальной державе, замыслившей восстановить свою власть. Мы предложим этим людям стать полноправной частью нашего государства."
 INS_aslia_tt: "Позволяет аннексию и превращение в национальные территории §Yтихоокеанских§! марионеток"
 INS_musso_ascends: "Возвышение Муссо"
 INS_musso_ascends_tt: "Открывает действие §Y«$INS_launch_revolution$»§! в странах, где поддержка коммунистов составляет §Y30%§! или более. Страны, в которых мы спровоцируем революции, сохранят свою независимость."
 INS_musso_ascends_desc: "Тан Малака — идеалист, а у Муссо есть то, чего не даст ни один идеалист, — поддержка Советского Союза и солидарность международного коммунистического движения. Наша революция не останется без верных союзников."
 INS_soviet_economic_integration: "Советская экономическая интеграция"
 INS_soviet_economic_integration_desc: "Революция принесла нам свободу, но свобода сама по себе не построит заводы и не накормит массы. Советский Союз предлагает то, чего не предложит ни одна капиталистическая страна: технологии, кредиты и равноправную торговлю без колониальной зависимости. Отказ от подобного предложения был бы ошибкой."
 # <National Revolution - Reasserting Control>
 INSHOL_revolution_ongoing_tt: "Идет индонезийская революция"
 INSHOL_reasserting_control: "Восстановить контроль над Ост-Индией"
 INSHOL_reasserting_control_desc: "Мы не имеем права бездействовать, пока эти оппортунисты уничтожают то, что создавалось веками, разрушая нашу инфраструктуру и радикализируя молодежь. Пора принять меры!"
 INSHOL_request_british_support: "Обратиться за поддержкой к Великобритании"
 INSHOL_request_british_support_desc: "Как колониальная держава, [ENG.GetNameDefCap], вероятно, сочувству[ENG.GetNameEndRuPresentEtYut] нам в сложившейся ситуации, поскольку успех революционеров может спровоцировать цепную реакцию по всей Восточной Азии. Мы должны обратиться к ним за финансовой и военной помощью."
 INS_eng_treaty_holside_tt: "Держава §Y[ENG.GetNameDefCap]§! официально объявит о вступлении в конфликт на нашей стороне и окажет нам существенную поддержку. Если мы одержим победу в войне, остров Борнео отойдет §Y[ENG.GetNameRuDat]§!."
 INS_eng_treaty_engside_tt: "Мы планируем официально объявить о союзе с §Y[HOL.GetNameRuInst]§! в ост-индском конфликте. Если победа будет за §Y[HOL.GetNameRuInst]§!, мы получим остров Борнео."
 INS_fra_treaty_holside_tt: "Держава §Y[FRA.GetNameDefCap]§! официально объявит о вступлении в конфликт на нашей стороне и окажет нам существенную поддержку. Если мы выиграем войну, Северо-Восточная Суматра отойдет §Y[FRA.GetNameRuDat]§!."
 INS_fra_treaty_fraside_tt: "Мы планируем официально объявить о союзе с §Y[HOL.GetNameRuInst]§! в конфликте в Ост-Индии. Если победа будет за §Y[HOL.GetNameRuInst]§!, мы получим Северо-Восточную Суматру."
 INSHOL_franco_dutch_accord: "Франко-нидерландский договор"
 INSHOL_franco_dutch_accord_desc: "Несмотря на то, что наши войска превосходят республиканское ополчение в оснащении и организации, их численное превосходство склонило ход войны не в нашу пользу. Для победы нам нужна внешняя поддержка — и причем более значительная, чем обычно. Франция может присоединиться к нам, если мы предложим им какие-нибудь территории в Ост-Индии для расширения присутствия в тихоокеанском регионе."
 INSHOL_london_batavia_accord: "Соглашение между Лондоном и Батавией"
 INSHOL_london_batavia_accord_desc: "Несмотря на то, что наши войска превосходят республиканское ополчение в оснащении и организации, их численное превосходство склонило ход войны не в нашу пользу. Для победы нам нужна внешняя поддержка — и причем более значительная, чем обычно. [ENG.GetNameDefCap] мо[ENG.GetNameSuffixRuDzhetGut] проявить заинтересованность в участии в нашем конфликте из-за присутствия в Малайе. Возможно, у нас получится убедить [ENG.GetNameRuAcc], если мы предложим что-нибудь взамен?"
 INSHOL_australian_divisions: "Отправить австралийскую пехоту на Яву"
 INSHOL_australian_divisions_desc: "В соответствии с Соглашением между Лондоном и Батавией Великобритания обязуется по нашему запросу направить в Ост-Индию дополнительные подразделения через Австралию, поскольку географическая близость делает ее идеальным местом для размещения войск за пределами собственно Ост-Индии."
 INSHOL_indian_divisions: "Подразделения Британской индийской армии"
 INSHOL_indian_divisions_desc: "Великобритания вряд ли захочет отправлять в Ост-Индию собственные войска, а вот убедить ее в необходимости перебросить индийские подразделения можно, особенно с учетом географической близости Индии к Батавии."
 INSHOL_undermine_the_militias: "Подорвать влияние ополчения"
 INSHOL_undermine_the_militias_desc: "Пресса намеренно преувеличивает угрозу: ополчение — это всего лишь группа радикально настроенной молодежи, ставящая перед собой недостижимые цели. Нет необходимости перенаправлять все ресурсы на борьбу с ними. Нужно просто удерживать позиции и вымотать их."
 INSHOL_flag_will_fly_again: "Флаг снова взовьется"
 INSHOL_flag_will_fly_again_desc: "Голландский флаг развевался над Ост-Индией веками, и он не будет спущен. Если для сохранения нашей важнейшей колонии потребуется направить в Ост-Индию танки и бомбардировщики, мы сделаем это без колебаний!"
 INSHOL_flag_will_fly_again_tt: "§YКогда революция завершится, дух будет убран, а прежние нормы — восстановлены.§!"
 # <National Revolution - Escalation>
 INSHOL_mass_mobilization: "Массовая мобилизация"
 INSHOL_mass_mobilization_desc: "Мы не сможем победить в этой войне и сломить сопротивление республики без хорошо оснащенной армии. Необходимо перевооружить войска Ост-Индии и перенаправить часть средств, предназначенных гражданским секторам экономики, на финансирование Королевской голландской ост-индской армии."
 INSHOL_batavia_storm_operation: "Взять Батавию штурмом"
 INSHOL_instigate_infighting: "Спровоцировать внутренний конфликт в республике"
 INSHOL_ultimatum_to_republic: "Ультиматум республике"
 INSHOL_comite_rijkseenheid: "Комитет по поддержанию единства"
 INSHOL_comite_rijkseenheid_desc: "Голландский флаг в Ост-Индии спускается, а общество лишь безучастно наблюдает за происходящим. Этого нельзя допустить! Мы должны убедить администрацию, что народ Нидерландов требует пресечь революционные выступления!"
 INSHOL_increase_esclation_placeholder: "Стремительная эскалация"
 INSHOL_increase_esclation_placeholder_desc: "Наше ополчение уже взяло под контроль целый ряд важнейших портов, городов и промышленных центров. Больше нет времени ждать, когда Нидерланды возьмутся за дело: мы сами начинаем широкомасштабное наступление!"
 INS_take_batavia_explination_tt: "Полный контроль над Явой позволит подорвет колониальное правление изнутри и обеспечит нам §Gпобеду в войне§!. Однако, если мы не добьемся этого в течение §Y730 дней§!, нас ждет §Rпоражение§!."
 INSHOL_linggadjati_agreement: "Переговоры о прекращении огня"
 INSHOL_linggadjati_agreement_desc: "Вторжение на Яву оказалось куда сложнее, чем мы предполагали, а наше правительство висит на волоске. Чтобы не поставить под угрозу само существование республики, необходимо отступить и перейти к обороне. Локальные перемирия с Нидерландами дадут нам время на перегруппировку сил перед решающим наступлением на Яву."
 INSHOL_increase_esclation_placeholder_tt: "Открывает §Yрешение§! по согласованию условий о прекращении огня и §Yувеличивает время§!, отведённое на захват Явы."
 # <National Revolution - Peace Negotiation>
 INSHOL_seek_foreign_help: "Искать помощи за границей"
 INSHOL_seek_foreign_help_desc: "Не секрет, что молодой стране без развитой экономики не выстоять в войне против индустриально мощной колониальной державы. Необходимо искать внешнюю поддержку и заручиться помощью стран, разделяющих наши цели."
 INSHOL_renville_agreement: "Ренвильское соглашение"
 INSHOL_renville_agreement_desc: "Беспрецедентная агрессия Нидерландов привлекла внимание международного сообщества к нашей революции, однако они продолжают нарушать условия перемирий и провоцировать нас на ответные действия. Нам стоит обратиться к [USA.GetNameRuDat]. Если [USA.GetNameDef] займ[USA.GetNameEndRuPresentEtUt] сторону Индонезии, Нидерланды будут вынуждены отступить."
 INSHOL_no_compromise: "Не отступать и не сдаваться"
 INSHOL_no_compromise_desc: "Жадные голландцы вкладывали средства исключительно в Яву, начисто игнорируя восточные острова. В результате Ява стала ахиллесовой пятой всей колонии. Эта ошибка и приведет к их погибели!"
 INSHOL_end_to_bloodshed: "Два государства для двух народов"
 INSHOL_end_to_bloodshed_desc: "Этот конфликт слишком затянулся и ежедневно уносит новые жизни, а чаша весов не склоняется ни в одну из сторон. Никто не заинтересован в продолжении войны — настало время сесть за стол переговоров с нидерландским правительством."
 INSHOL_reorganize_colonies: "Реорганизовать колонию"
 INS_we_will_need_another_tt: "Поскольку мы уже контролируем всю Яву, нам нужно получить под свой контроль ещё один регион в дополнение к Яве."
 # Industry Branch - New
 INS_centralize_the_state: "Централизация государства"
 INS_centralize_the_state_desc: "Наши программы развития, реализуемые по всей стране, от Суматры до Сулавеси, от Борнео до Банки, помогли построить новые дороги, заводы и учреждения на территориях, которыми [1058.GetName] управлял[1058.GetNameRuEndPast] лишь на бумаге. Эти регионы более не являются окраинами — это всё [INS.GetNameDefCap]."
 INS_centralize_the_state_1_tt: "Необходимые регионы, являющиеся §Yнациональными территориями§!:"
 INS_centralize_the_state_2_tt: "Необходимые регионы, не являющиеся §Yнациональными территориями§!:"
 INS_fate_of_de_javasche_bank: "[INS_fate_of_de_javasche_bank_scripted_name]"
 INS_fate_of_de_javasche_bank_scripted_name_colony: "Судьба Яванского банка"
 INS_fate_of_de_javasche_bank_scripted_name_independent: "Судьба Банка Индонезии"
 INS_fate_of_de_javasche_bank_desc: "[INS_fate_of_de_javasche_bank_scripted_desc]"
 INS_fate_of_de_javasche_bank_scripted_desc_colony: "Гульден Голландской Ост-Индии находится в состоянии свободного падения с начала депрессии, а Яванский банк просто не в состоянии остановить крах валюты. Необходимо принять решение о мерах по стабилизации нашего гульдена, пока доверие инвесторов не исчезло окончательно."
 INS_fate_of_de_javasche_bank_scripted_desc_independent: "Мы получили в наследство валютный кризис. Старый колониальный гульден уже был серьезно ослаблен, а переход на рупию не стабилизировал ситуацию на рынках. Банк Индонезии нуждается в четких указаниях со стороны правительства, в противном случае последствия для нашей молодой экономики будут тяжелыми."
 INS_finish_the_bauxite_project: "Завершить проект на острове Банка"
 INS_finish_the_bauxite_project_desc: "Новые автострады, порты и железные дороги, охватившие Банка-Белитунг, уже приносят плоды: геологоразведчики сообщили, что объем залежей вольфрама и хрома превысил изначальные ожидания. Эти острова станут настоящим сокровищем республики."
 INS_australian_contracts: "Контракты в Австралии"
 INS_australian_contracts_desc: "Наши запасы каучука более чем покрывают потребности внутреннего рынка. Естественно будет обратиться к Австралии — стране, отчаянно нуждающейся в сырье для промышленности, — и заключить с местными фирмами долгосрочные контракты. Это принесет нам устойчивый доход и заодно позволит закрепиться в качестве игрока на региональном рынке."
 INS_coopereate_with_chinese_businessmen: "Сотрудничать с китайскими предпринимателями"
 INS_coopereate_with_chinese_businessmen_desc: "Торговля на архипелаге уже давно в немалой степени поддерживается богатым купеческим сословием. Вместо того, чтобы отставлять его от дел, лучше начать сотрудничать с ним. Капиталы и опыт этих людей — незаменимые ресурсы, которые помогут нам вытянуть экономику страны со дна."
 INS_oil_decisions_unlock_tt: "Открываются новые решения §Y«$INS_realign_supply_chains_cat$»§!, позволяющие продавать §Yнефть§!."
 INS_negotiate_new_contracts_unlock_tt: "Открываются новые решения §Y«$INS_realign_supply_chains_cat$»§!."
 INS_realign_supply_chains_explain_tt: "Открываются новые решения §Y«$INS_realign_supply_chains_cat$»§!, позволяющие продавать ресурсы частным компаниям по 2-летнему договору отдачи."
 INS_negotiate_new_contracts: "Обсудить новые контракты"
 INS_negotiate_new_contracts_desc: "Мы зарекомендовали себя как надежного поставщика, и благодаря этому для страны открываются новые возможности: к ней присматриваются и другие покупатели, поэтому наша задача — поскорее связать их долгосрочными соглашениями, пока нас не опередили конкуренты."
 INS_all_in_on_rubber: "Поставить на каучук всё"
 INS_all_in_on_rubber_desc: "Каучук — самая сильная карта в нашей колоде, и настало время ее разыграть. Каждый гектар земли будет отведен под выращивание каучуконосных растений, а экспорт — перестроен так, чтобы поставлять каучук заказчикам быстрее и дешевле других стран в регионе."
 INS_more_market_resources: "Предложение против Великой депрессии"
 INS_more_market_resources_desc: "Мир охвачен огнем экономического кризиса, но что для одного кризис, для другого — благоприятная возможность. Мы наводним рынки своими товарами по ценам, недопустимым для конкурентов, и к моменту, когда экономика восстановится, индонезийские товары уже будут лежать на каждой полке."
 # <Industry Branch - Trade Policy>
 INS_recovering_from_the_great_depression: "Восстановление после Великой депрессии"
 INS_recovering_from_the_great_depression_desc: "Великая депрессия оказалась для [INS.GetNameRuGen] суровым испытанием: поскольку наша экономика в основном ориентирована на экспорт, страна сильно пострадала от протекционистских мер других государств. Однако мировая торговля постепенно становится всё более открытой, поэтому настало время искать новые рынки и восстанавливать маршруты поставок."
 INS_first_come_first_serve: "В порядке живой очереди"
 INS_first_come_first_serve_desc: "Голландский внешний рынок находится в плачевном состоянии: даже ослабление протекционистских мер не способно компенсировать рост производства и завышенный курс гульдена. Наши прежние торговые партнеры теперь пытаются закрыть потребности южноамериканского рынка; мы же не станем пытаться заключить с ними новые торговые соглашения — вместо этого постараемся захватить новую долю рынка в Азии."
 INS_oil_export: "Увеличенный экспорт нефти"
 INS_oil_export_desc: "Мы усовершенствуем нефтяную инфраструктуру Суматры и Калимантана — это поможет нам заключить торговые сделки с новыми партнерами."
 INS_increased_trade_with_japan: "Развитие торговли с Японией"
 INS_increased_trade_with_japan_desc: "[JAP.GetNameDefCap] — ценный и надежный торговый партнер, и мы более чем готовы обсуждать новые торговые соглашения. Укрепление экономического сотрудничества между нашими странами пойдет на пользу им обеим, а заодно поможет нам избавиться от последних отголосков Великой депрессии. Наши западные союзники, особенно Нидерланды, вряд ли одобрят подобный шаг, однако мы стремимся идти своим путем, а для этого нужны торговые связи."
 INS_asian_trade_investments: "Инвестиции в торговлю в Азии"
 INS_asian_trade_investments_desc: "Великая депрессия наглядно показала, насколько мы стали зависимыми от давних западных партнеров. Поскольку наша экономика в основном ориентирована на экспорт, сейчас жизненно важно выйти на новые рынки в Юго-Восточной Азии; нельзя впадать в зависимость только от одной страны."
 INS_asian_trade_investments_tt: "Каждые §Y420§! дней штраф к ресурсам на продажу из-за §YВеликой депрессии§! будет §Gуменьшаться§! на §Y5%§! до исчезновения отрицательных модификаторов."
 INS_declare_free_trade: "Объявить свободную торговлю"
 INS_declare_free_trade_desc: "Не стоит сохранять преданность только одной отдельно взятой стране. Пусть рынок сам решает, как будет лучше для [INS.GetNameRuGen]."
 INS_japanese_export_contracts: "Один контракт, чтоб править всеми"
 INS_japanese_export_contracts_desc: "Мы обсудим с [JAP.GetNameRuInst] важное торговое соглашение по продаже каучука из регионов [1049.GetName] и [672.GetName]. Мы продадим его дешево, зато нам гарантируют, что куплена будет вся партия."
 INS_realign_supply_chains: "Пересмотр цепочек поставок"
 INS_realign_supply_chains_desc: "Голландский внешний рынок находится в плачевном состоянии: даже ослабление протекционистских мер не может компенсировать рост производства и завышенный курс гульдена. Наши прежние торговые партнеры теперь пытаются закрыть потребности южноамериканского рынка; нам же следует попытаться убедить союзников возобновить торговлю с нашей страной."
 INS_invite_foreign_companies: "Поддержать американские нефтяные проекты"
 INS_invite_foreign_companies_desc: "С 1930 года в нашей стране ведет свою деятельность Nederlandsche Pacific Petroleum Maatschappij — дочерняя компания американской Standard Oil California. Ее недавние геологические изыскания в провинции Риау весьма многообещающи; нам следует всячески поддержать их, поскольку открытие обильных скважин не только обеспечит приток средств в нашу казну, но и сподвигнет другие международные компании инвестировать в наше государство."
 INS_expand_sea_routes: "Расширить морские маршруты"
 INS_expand_sea_routes_desc: "Наша страна богата природными ресурсами, однако добывающая промышленность недостаточно развита: у нас нет инфраструктуры, необходимой для разработки определенных редких минералов, таких как хром и вольфрам. Чтобы не страдало военное производство, эти металлы придется завозить из других стран. Отсюда возникает необходимость расширить торговый флот, чтобы в полной мере пользоваться преимуществами широких торговых связей."
 INS_ship_contracts: "Заключить контракты на корабли"
 INS_ship_contracts_desc: "Чтобы наши торговые пути в случае войны оставались в безопасности, нам понадобится военно-морской флот. Заключить контракты на строительство военных кораблей нам помогут новообретенные торговые связи."
 # <Industry Branch - Sumatra>
 INS_developing_sumatra: "Развитие Суматры"
 INS_developing_sumatra_desc: "Суматра — самый богатый природными ресурсами остров архипелага, однако его инфраструктура оставляет желать лучшего: основная доля добываемых ресурсов даже не добирается до Батавии. Грунтовые дороги и разрозненные железнодорожные магистрали — вот маршруты, по которым идут перевозки, и мы больше не намерены с этим мириться."
 INS_sumatra_railway: "Железная дорога на Суматре"
 INS_sumatra_railway_desc: "Программа развития инфраструктуры Суматры подразумевает в том числе строительство длинного участка железной дороги от Ачеха на севере до самого южного порта Суматры, откуда корабли могут быстро добираться до Батавии. Таким образом, ресурсы достаточно будет лишь довезти до ближайшей железнодорожной станции, а оттуда они всего через несколько дней попадут в Батавию."
 INS_develop_borneo: "Развитие Калимантана"
 INS_develop_borneo_desc: "Калимантан таит в себе великие богатства, однако процветанию острова мешает его слабое развитие и бедность местных жителей. Грузы здесь до сих пор перевозятся по рекам и каналам, а связь на больших расстояниях затрудняется отсутствием электричества. Построив линии электропередач и дороги, мы обеспечим комфортные условия нашим геологам, которые займутся разведкой и добычей ресурсов."
 INS_kalimantan_mic: "Военная промышленность Калимантана"
 INS_kalimantan_mic_desc: "Затраты на развитие инфраструктуры Калимантана окупились: проведя электричество и обеспечив связь, мы смогли дотянуться до населения, которое прежде существовало порознь от государства. Теперь мы сможем покрыть потребность в наращивании военного производства: мы построим здесь новые заводы, где будут трудиться местные жители."
 INS_pontianak_to_balikpapan: "От Понтианака до Танджунгселора"
 INS_pontianak_to_balikpapan_desc: "Давно обсуждаемый план строительства железной дороги на Калимантане упирается в существенное препятствие — суровый и малоизученный рельеф в центре острова. Единственное, что остается в таких условиях, — это построить U-образную дорогу, соединяющую два побережья. Такое начинание потребует многих вложений, но в долгосрочной перспективе оно окупит все затраты."
 INS_develop_sulawesi: "Развитие Сулавеси"
 INS_develop_sulawesi_desc: "Остров Сулавеси, расположенный в центре архипелага, — стратегически важная позиция; здесь в случае войны смогут перегруппировываться наши силы, поэтому на Сулавеси необходимо построить дороги и линии электропередач. Кроме того, остров нужно обеспечить связью."
 # <Industry Branch - Bangka Project>
 INS_the_bangka_project: "Проект «Банка»"
 INS_the_bangka_project_desc: "Острова Банка и Белитунг невелики, но всё же играют немаловажную роль в индонезийской экономике: здесь расположены залежи бокситов. Чтобы сполна пользоваться обильными недрами этих островов, нужно будет построить здесь дороги, порты и железнодорожные пути."
 INS_aluminium_factory: "Панкалпинангский алюминиевый завод"
 INS_aluminium_factory_desc: "Добыча необработанных бокситов растет, однако прибыль от этого предприятия ограничена отсутствием внутреннего производства алюминия. Алюминиевые заводы лучше всего будет построить в Панкалпинанге — столице Банка-Белитунга. Так мы сможем исключить посредников и максимально нарастить прибыль."
 INS_bauxite_export: "Сделать упор на экспорт бокситов"
 INS_bauxite_export_desc: "После завершения проекта «Банка» наши склады переполнены необработанными бокситами. Продать всё сразу будет нелегко, но мы можем предложить покупателям на мировом рынке значительную скидку на бокситы — в таком случае спрос вырастет многократно, а объемы продаваемых бокситов настолько велики, что даже продажа со скидкой гарантирует рост выручки."
 INS_tin_mining: "Инвестиции в добычу олова"
 INS_tin_mining_desc: "Население островов Банка и Белитунг занималось добычей олова задолго до прибытия на архипелаг европейцев, поэтому неудивительно, что оловянная промышленность на островах значительно устарела и нуждается в модернизации. Наращивание производственных мощностей — дорогостоящее начинание, к тому же требующее временной приостановки оловянной промышленности, однако в долгосрочной перспективе прибыль обещает быть значительной."
 in_240_days_tt: "§YЧерез 240 дней:§!\n"
 INS_tin_to_usa: "Продавать олово [USA.GetNameRuDat]"
 INS_tin_to_usa_desc: "[USA.GetNameDefCap] — страна, где корпорации и правительственные учреждения соревнуются друг с другом за возможность покупать олово. Мы можем стать для них надежным поставщиком — и заодно неплохо заработать."
 INS_tin_to_japan: "Продавать олово [JAP.GetNameRuDat]"
 INS_tin_to_japan_desc: "Немалое число кораблей, объявленных [JAP.GetNameRuInst] устаревшими и подлежащими списанию, прекрасно соответствуют нуждам [INS.GetAdjRuLower]ого флота. На средства, полученные от добычи олова, мы как раз сможем купить эти корабли."
 INS_tin_to_japan_tt: "[JAP.GetNameDefCap] пошл[JAP.GetNameEndRuPresentEtYut] нам §Y9§! устаревших эсминцев"
 INS_new_bauxite_routes: "Новые маршруты поставок бокситов"
 INS_new_bauxite_routes_desc: "Наша стратегия сбивания рыночных цен ради наращивания экспорта бокситов полностью себя оправдала — итоговая прибыль значительно выросла. Но это не повод почивать на лаврах: теперь нужно заняться расширением торговых связей, оптимизацией цепочек поставок и поиском новых возможностей увеличить доходы."
 INS_bangka_bauxite_export_flag: "Выполнен фокус §Y«$INS_bauxite_export$»§!:"
 INS_not_industry: "Планы на будущее"
 INS_not_industry_desc: "Ява — самое сердце нашего народа: здесь проживает основная часть населения и расположено правительство. Перед тем как приступить к полноценной индустриализации острова, следует тщательно подготовить почву: провести топографические работы, заняться разграничением территорий и расчисткой площадок под строительство. Только после этого можно будет с уверенностью сказать, что заводы мы построим там, где от них будет больше всего пользы."
 INS_construction_focus: "Промышленный рост"
 INS_construction_focus_desc: "В страну идут потоки иностранного капитала, выручка от экспорта стремится вверх, и впервые за многие годы у нас появились средства, которые можно вложить во внутреннюю промышленность. Нужно поскорее заняться строительством, пока обстоятельства еще благоволят нам."
 # <Industry Branch - Java>
 INS_developing_java: "Расширить инфраструктуру Явы"
 INS_developing_java_desc: "Ява — остров архипелага с наиболее развитой промышленностью и главный источник нашего богатства, однако рост населения в некоторых городах, например Батавии, приводит к ощутимой нехватке жилья. Города необходимо застроить домами, торговыми районами и фабриками и обеспечить трамвайное и железнодорожное сообщение, чтобы жители не чувствовали себя стесненными."
 INS_prioritize_sugar_economy: "Отдать приоритет сахарной экономике"
 INS_prioritize_sugar_economy_desc: "Бюджетные средства на промышленное развитие Батавии необходимо урезать: по сравнению с другими городами архипелага она уже достаточно развита. Деньги лучше перенаправить на создание в регионе многочисленных небольших пальмовых плантаций и производство пальмового сахара — товара, пользующегося значительным спросом во всем мире."
 INS_all_cards_into_industry: "Поставить всё на промышленность"
 INS_all_cards_into_industry_desc: "Индустриализация оказала значительное влияние на экономику региона [1058.GetName]. Если теперь провести индустриализацию всего острова (сейчас его населяют десятки миллионов человек), влияние нашей страны обретет международные масштабы."
 INS_expand_batavia_technical_institute: "Расширить Батавийский технологический институт"
 INS_expand_batavia_technical_institute_desc: "Расширение Батавийского технологического института позволит нам привлечь новых студентов, а значит — обеспечить страну образованными кадрами и ускорить технологическое развитие."
 INS_quinine_export: "Более выгодное соглашение по хинину"
 INS_quinine_export_desc: "Так называемый «Хинный отдел» в Амстердаме почти что добился монополии на экспорт хинина, благодаря чему имеет огромную прибыль, ведь это широко распространенное средство от малярии. Основная доля экспортируемого хинина поставляется в Отдел из Ост-Индии; нам же достается лишь малая часть выручки. Если мы надавим на Амстердам, воспользовавшись производством хинина как рычагом, возможно, нам удастся заключить более выгодное соглашение."
 INS_spend_profits_on_rural: "Потратить выручку на развитие сельской местности"
 INS_spend_profits_on_rural_desc: "После подписания нового соглашения по хинину нам представилась возможность вложить дополнительную прибыль в развитие перевозок и связи в сельских районах, то есть заложить основу для индустриализации."
 INS_spend_profits_on_urban: "Потратить выручку на развитие городов"
 INS_spend_profits_on_urban_desc: "После подписания нового соглашения по хинину нам представилась возможность вложить средства в развитие обрабатывающей промышленности Батавии, то есть диверсифицировать экономику и уменьшить зависимость от экспорта сырья."
 INS_spend_profits_on_military: "Потратить выручку на развитие армии"
 INS_spend_profits_on_military_desc: "После подписания нового соглашения по хинину нам представилась возможность вложить средства в модернизацию армии, то есть строительство и содержание новых оружейных заводов в Джокьякарте и Семаранге."
 INS_end_to_bloodshed_tt: "Война закончится. Новые границы будут проведены в зависимости от того, кто сейчас оккупирует территории. Ява, Суматра и Борнео будут §Yаннексированы§! стороной с наивысшим показателем контроля в регионе."
