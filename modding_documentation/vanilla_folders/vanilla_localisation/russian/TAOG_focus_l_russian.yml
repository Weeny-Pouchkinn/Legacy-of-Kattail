 idea_SIA_yielded_the_air_war: "Уступка в воздушной войне"
 idea_SIA_yielded_the_air_war_desc: "Потеряв контроль над воздушным пространством, мы перенаправляем ресурсы на противовоздушную оборону, а не на прямую борьбу за превосходство в воздухе."
