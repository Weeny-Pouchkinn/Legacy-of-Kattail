l_korean:
 ##CZECHOSLOVAKIA##
 MUN_czech_skoda_priority.t: "슈코다"
 MUN_czech_skoda_priority.d: "슈코다는 야포부터 전차, 열차, 함포까지 다양한 제품을 생산합니다. 덕분에 수요가 가장 많은 쪽으로 자원을 유연하게 배치할 수 있으며, 이제 우리가 이를 부분적으로 지시할 수 있습니다."
 MUN_czech_skoda_priority.1.a: "흥미롭군."
 MUN_czech.2.t.1: "주데텐란트 준군사조직의 도움 요청"
 MUN_czech.2.t.2: "주데텐란트 자유군단의 도움 요청"
 MUN_czech.2.t.3: "주데텐란트 노동자 민병대의 도움 요청"
 MUN_czech.2.d.1: "최근 [CZE.getname]에 대한 우리의 계획이 알려지자, 주데텐란트의 여러 정당이 [CZE.GetAdjective] 정부를 약화하려고 주데텐란트 전역에서 준군사 조직을 빠르게 결성했습니다. 현재 이들은 [CZE.getname](을)를 상대로 한 우리의 활동을 도울 수 있게 국경을 넘는 기습과 사보타주 행위를 지원해 달라고 요청하고 있습니다."
 MUN_czech.2.d.2: "최근 [CZE.getname]에 대한 우리의 계획이 알려지자, 주데텐란트 정당들이 주데텐란트 자유군단이라는 준군사 조직을 신속히 창설했습니다. 자유군단은 주데텐란트 전역에서 부대를 편성해 주데텐란트 내 [CZE.GetAdjective] 정부 소유지를 공격하기 시작했습니다. 현재 이들은 [CZE.getname](을)를 상대로 한 국경을 넘는 기습과 파괴공작 행위를 전폭적으로 지원해 달라고 요청하고 있습니다."
 MUN_czech.2.d.3: "최근 [CZE.getname]에 대한 우리의 계획이 알려지자, 현지의 공산주의자 무리들이 신속히 다수의 노동자 민병대를 동원했습니다. 이 노동자 민병대들은 지역 내에 있는 [CZE.GetAdjective] 정부 소유지를 공격하기 시작했습니다. 현재 이들은 [CZE.getname] 및 다른 반혁명 분자들을 상대로 국경 너머에 대한 습격과 파괴 공작 행위를 벌일 수 있도록 우리의 전폭적인 지원을 요청하고 있습니다."
 MUN_czech.2.a: "당연히 도와야지."
 MUN_czech.2.b: "지원하지 않는 것이 좋을 것 같군."
 MUN_czech.3.t: "주데텐란트 파르티잔 활동"
 MUN_czech.3.d: "최근 [FROM.getname](이)가 주데텐란트 합병에 관심을 보이면서, 준군사조직들이 우리를 상대로 산발적인 교전을 벌이기 시작했습니다. 이들은 정부 건물들을 공격하기 시작했으며, 몇몇 지역에서 우리의 방어선을 약화시키고 있습니다. 이 지역에서 우리의 군사적 상황을 개선하려면 이러한 준군사조직들을 진압해야 합니다."
 MUN_czech.3.a: "산 넘어 산이로구나."
 MUN_czech.4.t: "불신임 위기"
 MUN_czech.4.d: "최근의 우리에 대한 군사 공격 소식이 전해지면서 정부가 송두리째 흔들리고 있습니다. [CZE.GetLeader](은)는 자신의 정부에 더 이상 이 위기를 극복할 능력이 없다고 보고, $CZE_jan_syrovy$에게 지휘봉을 잡고 국가를 이끌어 달라고 요구했습니다. $CZE_jan_syrovy$(은)는 나라를 이끄는 걸 망설였으나, [CZE.GetLeader](은)는 선택의 여지가 없으니, 지휘를 맡아 이 위기를 헤쳐 나가야 한다고 못 박았습니다."
 MUN_czech.4.a: "그 어느 때보다 당신이 필요합니다."
 MUN_czech.4.b: "침착함을 잃으면 안 된다."
 MUN_czech.5.t: "토마시 마사리크 별세"
 MUN_czech.5.d: "마사리크는 20년 넘게 체코슬로바키아 정치를 안정적으로 이끈 인물이었습니다. 연정이 불가능해 보이고 정치적 교착이 풀리지 않을 것 같을 때마다, 마사리크는 기적 같은 정치적 해법을 찾아내어 체코슬로바키아를 지금의 모습으로 키우고 발전시켰습니다. 너무나도 큰 그의 빈자리에 온 나라가 애도할 것입니다."
 MUN_czech.5.a: "그 누구도 대체할 수 없는 정치계의 거목이었다."
 MUN_czech.7.t: "[CZE.getnamedef](와)과의 협정 재검토"
 MUN_czech.7.d: "최근 소식에 따르면 [GER.getnamedef](이)가 주데텐란트를 합병하려 하고 있으며, 이를 위해 [CZE.getnamedef](와)과 전쟁을 벌일 의향이 있습니다. 우리는 현재 [CZE.getnamedef](와)과 방위 협정이 체결되어 있으므로, 만약 그들이 [GER.getnamedef](와)과 전쟁을 벌인다면 우리는 그들을 지원할 의무가 있습니다. 이러한 사태를 피하려면 [CZE.getnamedef](와)과의 방위 협정을 즉시 파기해야 합니다."
 MUN_czech.7.a: "우리는 변함없이 친구를 지원할 것이다."
 MUN_czech.7.b: "[GER.getnamedef]에게 맞설 순 없다."
 MUN_czech.1001.t: "[FROM.GetNameDefCap]의 [SOV.GetNameDef](으)로 가는 통로 요구"
 MUN_czech.1001.d: "[FROM.GetNameDef]에서 [SOV.GetNameDef](와)과 군사 행동을 함께하고자, 우리에게 [89.GetName] 및 [91.GetName] 국경 지역을 넘기라고 요구했습니다."
 MUN_czech.1002.t: "[FROM.GetNameDefCap]의 유고슬라비아 연맹에 대한 영향력 요구"
 MUN_czech.1002.d: "[FROM.GetName](은)는 남쪽으로 세력을 확장한 후에 이례적인 요구를 해왔습니다. 그들은 영토 점령이 아니라 유고슬라비아 방위 연맹에 대한 통제권을 요구하며, 현재 우리의 종속국인 북발칸 국가들의 보호자이자 종주국이 되겠다고 합니다. 그들은 우리보다 더 유능한 보호자가 될 것이라고 주장하지만, 물론 이는 단순한 핑계일 수도 있습니다."
 MUN_czech.1002.a: "그들의 말이 맞을지도 모른다."
 MUN_czech.1002.b: "아니, 그들은 우리의 보호 아래 있다!"
 MUN_czech.1003.t: "[FROM.GetName]의 요구 거부"
 MUN_czech.1003.d: "우리 외교관들이 강하게 설득했지만, [FROM.GetNameDef](은)는 우리 요구를 거부했습니다."
 MUN_czech.1003.a: "다른 선택의 여지를 주지 않는군."
 MUN_czech.1004.t: "[FROM.GetName]의 헝가리 적대 행위"
 MUN_czech.1004.d: "[FROM.GetAdjective]의 군대가 [HUN.GetAdjective] 국경을 향해 진격하고 있다는 소식이 [ROOT.capital.GetCapitalVictoryPointName]에 전해졌습니다. [HUN.GetAdjective] 측 대표들이 곧 우리에게 연락해 오겠지만, 우리는 [HUN.GetNameDef](을)를 지원하여 잠재적인 동맹을 얻을지, 아니면 [FROM.GetNameDef](이)가 현재 계획을 계속 진행하도록 내버려둘지 미리 결정해야 합니다."
 MUN_czech.1004.a: "우리는 우리 이익을 보호해야 한다."
 MUN_czech.1004.b: "우리는 이 일에 관여하지 않을 것이다."
 MUN_czech.1005.t: "[FROM.GetName]의 해안 영토 요구"
 MUN_czech.1005.d: "[FROM.GetNameDef](은)는 영토를 꾸준히 확장해 왔으며, 그들의 대표단은 이제 [FROM.GetAdjective] 귀족들이 소유했던 땅을 자신들에게 양도해 달라고 요구하고 있습니다. 그들은 이 땅을 통해 아드리아해로 진출할 수 있을 것이라고 주장하는데, 이 문제에 대한 우리의 생각에는 그다지 관심이 없어 보입니다."
 MUN_czech.1006.t: "[FROM.GetName]의 협력 제안"
 MUN_czech.1006.d: "[FROM.GetNameDef](이)가 양국 군대의 힘을 합쳐 공격자들을 저지하기 위한 상호 방위 조약을 제안해 왔습니다. 하지만 흥미롭게도, 이 조약에는 [ROOT.GetAdjective]의 영향력 확대 가능성과 [FROM.GetNameDef]의 지원 방안이 명시된 비밀 조항도 포함되어 있습니다."
 MUN_czech.1007.t: "[FROM.GetName]의 제휴 요구"
 MUN_czech.1007.d: "[FROM.GetNameDef](은)는 건국된 이후로 우리와는 불신하는 관계였고, 이제 그들은 우리와의 동맹을 요구하며 그렇지 않을 경우 침략을 감수하라고 위협하고 있습니다. 허나 흥미롭게도 [FROM.GetNameDef](은)는 우리의 영토적 야망에도 호의적이며, 우리가 그들의 땅에 대한 영유권을 더 이상 주장하지 않는 대가로 우리가 주장하는 다른 땅들을 얻는 데 도움을 줄 수도 있다고 약속하고 있습니다."
 MUN_czech.1007.b: "우리는 우리 주권을 유지해야 한다!"
 MUN_czech.1008.t: "[FROM.GetName], [CZE_invited_country.GetName](와)과 동맹 제안"
 MUN_czech.1008.d: "중앙 유럽으로 가는 교두보 역할을 하는 [FROM.GetNameDef]의 대표단이 우리 동맹에 [CZE_invited_country.GetName](을)를 가입시킬 것을 제안했습니다."
 MUN_czech.1008.a: "우리에 대한 공격을 더 억제할 수 있겠군."
 MUN_czech.1008.b: "우리가 유럽 전체를 방어할 수는 없다."
 MUN_czech.1009.t: "[FROM.GetName]의 [CZE.GetFactionName] 가입 권유"
 MUN_czech.1009.d: "[FROM.GetNameDef]의 외교관들은 우리가 그들의 동맹에 가입하는 것을 환영한다는 입장을 전달했습니다. 하지만 과거에 우리는 영토에 대한 영유권 주장으로 인해 [FROM.GetNameDef](와)과 갈등을 빚은 적이 있습니다. 이제 우리는 그 주장을 계속 밀고 나갈지, 아니면 보다 우호적인 관계 구축에 집중할지 결정해야 합니다."
 MUN_czech.1009.a: "우리의 새로운 동맹을 위하여!"
 MUN_czech.1009.b: "우리 영유권 주장이 받아들여지면 가입할 것이다."
 MUN_czech.1009.c: "관심 없다."
 MUN_czech.1010.t: "[FROM.GetName]의 [CZE.GetFactionName] 지도 권유"
 MUN_czech.1010.d: "최근 소협상국 협정을 진정한 동맹으로 발전시키려 시도한 후, [FROM.GetNameDef](은)는 우리에게 새로운 세력의 맹주국이 되어달라는 제안을 했습니다. 그들은 지도권을 양보하는 대신 우리를 귀중한 보호자로 얻게 될 것이며, 이는 우리의 세력권을 확대할 수 있는 제안입니다. 다만 그 과정에서 위협받고 있는 국가들까지 떠안게 될 가능성도 있습니다."
 MUN_czech.1010.a: "귀중한 동맹이 되겠군."
 MUN_czech.1010.b: "[ROOT.GetNameDef] 보호만으로 충분하다."
 MUN_czech.1011.t: "[FROM.GetName]의 보호 협정 제안"
 MUN_czech.1011.d: "[FROM.GetNameDef]의 외교관들은 그들에 대한 모든 침략을 억제하기 위하여, 우리에게 상호 방위 조약 초안을 제시했습니다. 그들은 우리가 지지해 준다면 그 보답으로, 우리에게도 동일한 보호를 제공하여 침략자가 양면 전쟁을 벌이도록 만들겠다고 합니다."
 MUN_czech.1011.a: "위험을 감수할 만하군."
 MUN_czech.1011.b: "중립이 더 안전하다."
 MUN_czech.1012.t: "[FROM.GetName]의 속국화 요구"
 MUN_czech.1012.d: "새롭게 맺어진 동맹에 힘입어, [FROM.GetNameDef](은) 우리의 주권을 사실상 박탈하는 데 가까운 일련의 요구를 제시했습니다. 이 지역에 관심을 가지고 있는 [SOV.GetName]의 지원을 받는 상황에서, 우리는 이제 거부할 여유가 있는지를 결정해야 합니다."
 MUN_czech.1012.a: "저항하면 [ROOT.GetAdjective]의 목숨들이 헛되이 사라지겠지."
 MUN_czech.1012.b: "치욕을 당할 바에는 차라리 죽겠다!"
 MUN_czech.1013.t: "[FROM.GetName]의 조건부 동맹 제안"
 MUN_czech.1013.d: "신중한 논의 끝에 [FROM.GetNameDef] 정부는 자신들도 동맹이 유익하다고 생각한다고 발표했습니다. 하지만 동시에 자신들의 영유권 주장도 무시되어선 안 된다고 지적했습니다. 이에 자신들이 주장하는 영토를 양도한다면 우리 세력에 합류하겠다는 뜻을 밝혔습니다."
 MUN_czech.1013.a: "동맹을 위해서라면야."
 MUN_czech.1013.b: "우리 영토를 넘겨줄 순 없다!"
 MUN_czech.1014.t: "[FROM.GetName]의 보호 요청"
 MUN_czech.1014.d: "[FROM.GetNameDef]의 영향력 있는 외교관들이 외무장관에게 접근하여, 1935년 체코슬로바키아-소련 조약에 명시된 모호한 보호 약속을 확고히 해 줄 것을 요청했습니다."
 MUN_czech.1014.a: "아무래도 우리 동맹을 보호해야겠지."
 MUN_czech.1014.b: "모호한 약속으로 놓아두겠다."
 MUN_czech.1015.t: "[FROM.GetName]의 우리 세력 병합 제안"
 MUN_czech.1015.d: "이제 우리 둘에게 공동의 적이 생긴 상황에서, [FROM.GetName](은)는 우리 세력을 그들의 세력에 통합함으로써 협력을 강화하자는 제안을 해왔습니다."
 MUN_czech.1015.a: "협력한다면 많은 목숨을 구할 수 있겠지."
 MUN_czech.1015.b: "통제력은 우리 손에 있어야 한다."
 MUN_czech.1016.t: "[FROM.GetName]의 불가침조약 제안"
 MUN_czech.1016.d: "외교 정책 계획 변경 후 취소되었던 이전 회담을 계속 이어가자는 취지로, [FROM.GetNameDef](은)는 불가침조약에 대한 회담을 계속할 것을 제안했습니다."
 MUN_czech.1016.a: "방위할 국경이 하나 줄겠군."
 MUN_czech.1016.b: "이건 우리 야망에 방해가 될 것이다."
 MUN_czech.1017.t: "[GER.GetNameDef] 공동 침공?"
 MUN_czech.1017.d: "[FROM.GetNameDef](은)는 [GER.GetNameDef] 침공에 대한 비밀 계획과 함께 [ROOT.GetAdjective] 수뇌부에 접근했습니다. 그들은 [GER.GetAdjective]의 위협을 제거하겠다는 확고한 의지를 보인 후, 함께 막강한 [GER.GetAdjective] 군대를 함께 제압하고자 우리에게 도움을 요청했습니다."
 MUN_czech.1017.a: "그들과 함께 [GER.GetNameDef](을) 치겠다."
 MUN_czech.1017.b: "이건 너무 위험하다."
 MUN_czech.1018.t: "[GER.GetNameDef]에 단독으로 대적?"
 MUN_czech.1018.t.2: "[GER.GetNameDef] 공동 침공"
 MUN_czech.1018.d: "우리는 외교적으로 최선을 다했으나, [GER.GetName](을)를 선제 침공하는 일에 외국의 지원을 전혀 얻지 못했습니다. 그래도 계획대로 공격을 강행할 것인지 결정할 때입니다."
 MUN_czech.1018.d.FRA_POL: "[FRA.GetNameDef] 및 [POL.GetNameDef] 양국에서 좋은 소식이 도착했습니다. 우리 외교관들의 보고에 의하면 두 나라 모두 [GER.GetNameDef]에 대한 침공을 지원하기로 약속했다고 합니다."
 MUN_czech.1018.d.FRA: "[FRA.GetNameDef]에서 돌아온 우리 외교관들이 [FRA.GetNameDef](이)가 [GER.GetNameDef]에 대한 공동 침공에 참여할 의향이 있다는 기쁜 소식을 전해왔습니다. 이제 우리는 이 연합군의 전력이 충분할지 평가해야 합니다."
 MUN_czech.1018.d.POL: "[POL.GetNameDef]에서 돌아온 우리 외교관들이 [POL.GetNameDef](이)가 [GER.GetNameDef]에 대한 공동 침공에 참여할 의향이 있다는 기쁜 소식을 전해왔습니다. 이제 우리는 이 연합군의 전력이 충분할지 평가해야 합니다."
 MUN_czech.1018.a: "기습에 취약해지겠군."
 MUN_czech.1018.b: "다시 생각해 보니, 이건 너무 위험하군."
 MUN_czech.1019.t: "[FROM.GetName]의 [762.GetName] 요구"
 MUN_czech.1019.d: "이전 보헤미아 국경을 복원하고 [72.GetName]에 대한 지배를 정당화하려는 의도를 이유로, [FROM.GetAdjective]의 대표단은 우리에게 [762.GetName](을)를 양보하라는 최후통첩을 전달했습니다."
 MUN_czech.1019.a: "어쩌면 그러는 것이 우리에게 안전할지도 모른다."
 MUN_czech.1020.t: "[FROM.GetName]의 조건부 투자 제안"
 MUN_czech.1020.a: "좋은 거래군!"
 MUN_czech.1020.b: "이 조건은 받아들일 수 없다."
 MUN_czech.1020.d: "[FROM.GetNameDef]에서 외교관들이 도착해 우리나라의 산업과 기반시설에 투자할 테니 자원 협정을 맺자고 제안했습니다. 지난 수년간의 투자 실패 이후 이루어진 이번 조치는 우리와의 관계를 개선하려는 새로운 시도로 보입니다."
 CZE_investment_effects_tt: "§Y100일§! 후에 다음을 획득:\n무작위 주 §Y3§!개에 §Y기반시설§!.\n무작위 주 §Y1§!개에 §Y민간공장§!.\n"
 MUN_czech.1021.t: "오스트리아-헝가리 관세 동맹의 부활?"
 MUN_czech.1021.d: "[CZE.GetNameDefCap]에서 전 오스트리아-헝가리 제국 국가 간의 무역 협정 초안을 제시했습니다. 이 신생 [CZE.GetAdjective] 정부는 자국이 독립한 것에는 만족하면서도, 오스트리아-헝가리 제국 시절의 장점은 적극적으로 되살리려 합니다."
 MUN_czech.1021.a: "무역이 늘어나면 좋지."
 MUN_czech.1021.b: "국내 생산자를 보호해야 한다."
 MUN_czech.1022.t: "[CZE.GetName]의 실레시아 점령"
 MUN_czech.1022.d: "[69.GetName]의 산악 지대에서 벌어진 치열한 전투 끝에, [CZE.GetAdjective]군은 결국 적군이 본격적인 저항을 할 수 있을 만큼 회복되기 전에 돌파에 성공하여, 실레시아 전역을 장악했습니다."
 MUN_czech.1022.a: "우리가 개입해야 한다."
 MUN_czech.1022.b: "적을 더 만들어서는 안 된다."
 MUN_czech.1022.c: "위대한 승리다!"
 MUN_czech.1023.t: "[CZE.GetName]의 실레시아 쟁탈전 개시"
 MUN_czech.1023.d: "[FROM.GetNameDef](은)는 중세 왕국과 제국에 관한 구시대의 몇 가지 논리를 명분으로 내세우며, [ROOT.GetAdjective]령 실레시아에 대한 통제권을 확립하기 위해 국경의 소규모 교전을 제한전으로 확대했습니다."
 MUN_czech.1023.a: "병력을 준비하라."
 MUN_czech.1024.t: "[CZE.GetName]의 평화 협정 제안"
 MUN_czech.1024.d: "실레시아 국경 지역에서 발생한 소규모 교전이 전면전으로 확대된 후, [FROM.GetNameDef](은)는 자신들이 주장하는 영토를 양도받는다면 분쟁을 종식시킬 용의가 있음을 표명했습니다."
 MUN_czech.1024.a: "우린 다른 지역에 집중하는 것이 좋겠군."
 MUN_czech.1024.b: "상황은 여전히 우리에게 유리하다."
 MUN_czech.1024.c: "협상의 여지는 없다!"
 MUN_czech.1025.t: "스페인 의용군 임무 종료"
 MUN_czech.1025.d.1: "[CZE_supported_spanish_faction.GetName]에 파견된 [ROOT.GetAdjective] 부대가 승리를 돕고 귀환하고 있습니다. 우리 병력, 특히 의무 부대는 이 전투를 통해 유익한 경험과 지식을 얻었습니다."
 MUN_czech.1025.d.2: "[ROOT.GetAdjective] 병력은 스페인 내전에서 용맹하게 싸웠으나, 우리가 지원한 세력은 끝내 패배하고 말았습니다. 그래도 우리 병력, 특히 의무 부대는 소중한 교훈을 얻을 수 있었습니다."
 MUN_czech.1025.a: "이 교훈을 고국에서 적용할 일이 없으면 좋겠군."
 MUN_czech.1026.t: "[FROM.GetName]의 제안 거부"
 MUN_czech.1026.a: "자기들 손해지."
 MUN_czech.1026.b: "참으로 우려스럽군."
 MUN_czech.1026.france_refuses_to_lead: "우리 동맹에 가입하는 대가로 지도부 역할을 제안받았음에도 불구하고, [FROM.GetAdjective](은)는 가입하지 않기로 했습니다. [FROM.GetAdjective](은)는 중립을 유지하려 하거나, 관망하며 때를 기다리고 있는 것인지도 모릅니다."
 MUN_czech.1026.sphere_of_influence: "[FROM.GetAdjective] 정부 관계자들은 우리의 [ROOT.GetFactionName] 가입에 감사를 표했지만, 발칸반도로 영향력을 확대하는 것은 지나친 처사이며 잠재적 동맹국들이 두려워할 수 있다고 말했습니다."
 MUN_czech.1026.guarantee: "우리 외교관들이 열심히 노력했지만, [FROM.GetNameDef](은)는 우리의 상호 방위조약 제안을 거부했습니다. 우리 나라가 자기들보다 더 위험한 상황이라고 판단한 모양입니다. 그들이 틀렸기를 바랍니다."
 MUN_czech.1026.faction_merge: "최선을 다했지만, 우리와 [FROM.GetAdjective]의 외교관들은 [ROOT.GetFactionName] 및 [FROM.GetFactionName] 통일에 관한 합의를 이루지 못했습니다."
 MUN_czech.1026.non_aggression: "[FROM.GetAdjective] 외교관들은 공격할 의사는 전혀 없다고 강조하면서도 우리나라와 불가침조약을 맺기를 거부했습니다. 이유는 아직 알 수 없습니다."
 MUN_czech.1026.trade_deal: "[FROM.GetNameDef](은)는 경제적 독립을 유지하겠다는 의사를 밝히며 우리의 무역 협정 제안을 거부했습니다."
 MUN_czech.1026.faction_invite: "우리 외교관들은 [FROM.GetNameDef](이)가 우리와 동맹을 맺는 것이 이익이 되는 이유를 제시했으나, 결국 그들을 설득하는 데는 실패했습니다."
 MUN_czech.1026.weapons_sale: "우리의 관대한 제안에도 불구하고, [FROM.GetNameDef](은)는 현재로서는 우리로부터 무기를 구매하지 않기로 했습니다."
 MUN_czech.1026.unification: "[FROM.GetNameDef](은)는 연방 결성이 가져올 이점을 인정하면서도, 결국 망명정부를 자국 영토의 유일한 합법 정부로 유지하기로 했습니다."
 MUN_czech.1026.white_peace: "오늘 우리 대표단이 슬픈 소식을 전해왔습니다. 우리가 [66.GetName](을)를 점령했지만, 그럼에도 [FROM.GetAdjective] 지도부는 평화 조약에 서명할 의사가 없다고 합니다. 정복을 더 진행하거나, 그들이 지쳐 버리기를 희망하는 수밖에 없을 것 같습니다."
 MUN_czech.1027.t: "[FROM.GetAdjective]-[ROOT.GetAdjective] 무역 협정 수립?"
 MUN_czech.1027.d: "초기의 이념적 차이에도 불구하고, [FROM.GetNameDef](은)는 무역 협정을 제안하며 우리의 실리적 판단에 호소했습니다. [FROM.GetAdjective](이)가 [202.GetName]에서 자원을 채굴할 수 있도록 허용하는 대가로, 그들은 우리가 산업 역량을 확장하는 데 절실히 필요한 공작기계를 제공해 줄 것입니다."
 MUN_czech.1027.a: "아주 좋은 거래로군."
 MUN_czech.1027.b: "저들이 그 자원에 손대지 못하게 해야 한다."
 MUN_czech.1028.t: "중단된 요새화 주력"
 MUN_czech.1028.d: "현재 많은 국민이 정부가 작년 말 시작한 요새화 사업을 왜 계속하지 않는지 의문을 제기하고 있습니다. 정부는 요새화 위원회를 통해 추가 요새 건설 사업에 자금을 따로 책정해 놓았는데, 진전이 전혀 보이지 않으니, 국민은 사업을 계속 진행할 것이 아니라면 해당 기금을 반환해야 한다고 요구하고 있습니다. 요새화 사업을 계속하고자 한다면, 지금 당장 재개해야 시간 안에 완료할 수 있습니다."
 MUN_czech.1028.a: "더는 시간을 허비할 수 없다!"
 CZE_no_time_to_lose_tt: "위협이 발생하기 전에 요새화 프로젝트를 완료할 여유 시간이 매우 짧아졌습니다."
 MUN_czech.1029.t: "요새화 사업 완료"
 MUN_czech.1029.d: "최근에 진행한 요새화 사업이 완료되었습니다. 이제 새로운 사업을 시작할 자원이 마련되었습니다. 우리 공학자들은 언제든 다른 지역으로 파견되어 새로운 요새 방어선 공사를 시작할 준비가 되어 있습니다."
 MUN_czech.1029.a: "다들 훌륭하게 해내 주었다."
 MUN_czech.1030.t: "[FROM.GetName]의 통합 요구"
 MUN_czech.1030.d: "[FROM.GetNameDefCap](은)는 연합을 확대하려 하며, 우리에게도 연합에 가입할 것을 요구해 왔습니다. 그들은 범슬라브주의, 범발칸주의, 오스트리아-헝가리 제국 시절의 공통된 역사 등 다양한 이유로 지역 내 여러 국가에 호소하고 있지만, 이 호소에는 우리가 거부할 경우에 대한 분명한 위협이 내포되어 있습니다."
 MUN_czech.1030.a: "이것도 그리 나쁘지는 않을 것이다."
 MUN_czech.1030.b: "설득력이 부족하군."
 MUN_czech.1031.t: "[FROM.GetName]의 연합 제안"
 MUN_czech.1031.d: "[FROM.GetAdjective] 정부는 [ROOT.GetNameDef](이)가 항복했어도 우리가 계속 싸울 수 있도록 하는 과감한 제안을 내놓았습니다. 바로 우리 국가의 남은 부분을 그들의 국가와 합병하는 것입니다."
 MUN_czech.1031.a: "함께라면 우리의 고향을 더 잘 보호할 수 있겠군."
 MUN_czech.1031.b: "우리는 서로 너무나도 다르다."
 MUN_czech.1032.t: "분열 해소"
 CZE_divide_nation_title_dynamic_sudentenland: "주데텐란트에서의 $MUN_czech.1032.t$"
 CZE_divide_nation_title_dynamic_czech_states: "체코 노동자들과의 $MUN_czech.1032.t$"
 CZE_divide_nation_title_dynamic_tesinko_poles: "[72.GetName]의 $MUN_czech.1032.t$"
 CZE_divide_nation_title_dynamic_slovakia_states: "[SLO.GetNonIdeologyName]의 $MUN_czech.1032.t$"
 CZE_divide_nation_title_dynamic_hungarian_states: "[664.GetName]의 $MUN_czech.1032.t$"
 CZE_divide_nation_title_dynamic_ukrainian_states: "[73.GetName]의 $MUN_czech.1032.t$"
 MUN_czech.1032.d: "최근 [FROM.getname]에서의 문제 해결을 위한 노력 덕분에, 적어도 당분간은 중앙정부에 대한 분노를 누그러뜨리는 데 성공했습니다. 이제 정부는 우리 국가를 분열시키는 문제들을 해결하기 위한 다른 사회적 또는 경제적 프로그램에 자원을 투입할 수 있게 되었습니다."
 MUN_czech.1032.a: "다시 시작하자."
 MUN_czech.1033.t: "[FROM.GetAdjective] 망명정부의 인정 요구"
 MUN_czech.1033.d: "$CZE_edvard_benesh$(이)가 이끄는 [FROM.GetAdjective] 망명정부가 [CZE.GetNonIdeologyName]의 주권을 되찾고자 고군분투하는 동안 자신들의 대표단을 수용해 달라고 요청했습니다."
 MUN_czech.1033.a: "[GER.GetAdjective]에 맞서는 또 다른 동맹이군."
 MUN_czech.1033.b: "정당한 정부가 아니다."
 MUN_czech.1034.t: "슬로바키아의 소요 사태"
 MUN_czech.1034.d: "우리가 다른 집단의 민족주의적 정서에 굴복한 결과, 슬로바키아 인민당 당원들이 자체적인 준군사조직을 결성하여 이제 슬로바키아의 독립, 또는 최소한 자치권을 위해 움직이고 있습니다. 이제 문제는 이러한 움직임을 막아 외관상의 통일을 유지하는 데 집중할 것인지, 아니면 이를 허용하고 정부에 충성하는 지역에 집중함으로써 그와 같은 통합의 외형을 확보할지입니다."
 MUN_czech.1034.a: "슬로바키아에 군대를 파견하라!"
 MUN_czech.1034.b: "조직원을 체포하되 약간의 자치권을 허용하라."
 MUN_czech.1034.c: "직접 통제하겠다."
 MUN_czech.1034.c_tt: "§R이제 우리는 체코슬로바키아의 운명을 [GER.GetNameDef]의 결정에 맡기게 됩니다.§!"
 MUN_czech.1035.t: "[FROM.GetName]의 무기 제조 제안"
 MUN_czech.1035.d: "우리와 긴밀한 협력 관계를 맺고 있는 [CZE.GetNameDef]에서 특별한 제안을 해왔습니다. 현재 우리가 국내에서 생산하는 무기를 대신 제조해 주겠다는 것입니다. 물론 비용은 청구할 것입니다. 이를 수락하면 우리는 다른 산업 분야에 집중할 수 있을 것입니다."
 MUN_czech.1035.a: "일이 중복되는 경우를 줄일 수 있겠군."
 MUN_czech.1035.b: "우리 군대가 외국의 장비에 의존해서는 안 된다."
 #MUN_czech.1036.t: "" #Event uses MUN_czech.1032.t
 MUN_czech.1036.d: "대공황은 우리나라에 경제적으로나 정치적으로나 아무런 도움이 되지 못했습니다. 지역 곳곳에서 경제적, 정치적 문제가 불거지고 있으며, 대공황에서 기적적으로 벗어났음에도 상황은 더 악화되기만 하는 것 같습니다. 나라가 더 분열되기 전에 이 문제를 해결해야 합니다."
 MUN_czech.1036.a: "우리나라를 치유해야 한다."
 CZE_divided_nation_event_onbroad_tt: "우리 핵심 주에서 부정적인 §Y주 변동치§!를 §Y제거§!할 수 있는 §Y결정§!들이 잠금 해제되었습니다.\n\n이 §Y결정§!들을 완료하면 §Y$CZE_a_divided_nation_dynamic_modifier$§! 국민정신이 §Y제거§!될 때까지 이 국민정신의 부정적인 변동치 또한 감소합니다."
 MUN_czech.1037.t: "[GER.GetName]의 [HUN.GetName] 보호"
 MUN_czech.1037.d: "우리 국가에서 명확하게 [HUN.GetNameDef]를 상대로 한 전쟁을 정당화하는 움직임이 벌어지고 있음을 인지한 [GER.GetAdjective] 대표단은 [HUN.GetAdjective](와)과 전쟁을 벌이는 것은 [GER.GetNameDef](와)과도 전쟁을 벌이는 것을 의미한다는 점을 분명히 했습니다. 이제 전쟁을 진행할지는 우리에게 달려 있습니다."
 MUN_czech.1037.a: "계획을 취소해야겠군."
 MUN_czech.1037.b: "그래도 달라지는 건 없다."
 MUN_czech.1038.t.1: "[FROM.GetName]의 전차 설계 면허 제안"
 MUN_czech.1038.t.2: "[FROM.GetName]의 총기 매각 제안"
 MUN_czech.1038.t.3: "[FROM.GetName]의 포 매각 제안"
 MUN_czech.1038.t.4: "[FROM.GetName]의 경전차 매각 제안"
 MUN_czech.1038.t.5: "[FROM.GetName]의 전투기 매각 제안"
 MUN_czech.1038.d: "[FROM.GetAdjective]의 정부와 군수업체 관계자들이 우리에게 무기 판매를 제안해 왔습니다. 가격은 꽤 적정한 수준이며, [FROM.GetNameDef] 측은 매우 현대적인 무기도 일부 제공할 수 있다고 합니다."
 MUN_czech.1038.a: "좋은 거래인 것 같군."
 MUN_czech.1039.t: "자치 협정을 원하는 [RUT.getname]"
 MUN_czech.1039.d: "$RUT_augustin_voloshyn$(은)는 우리가 [SLO.getname](와)과 체결한 자치 협정을 고려하여 그의 지역에서도 동일한 유형의 연방화 협정을 우리와 체결할 수 있는지 문의해 왔습니다. 터무니없어 보이지만, 지금 상황에서는 이런 요구를 가볍게 넘길 수 없습니다."
 MUN_czech.1039.a: "원하는 대로 될지 두고 보자."
 MUN_czech.1040.t: "[CZE.getname]의 관세 동맹 조약 제안"
 MUN_czech.1040.d: "[CZE.getnameDEFCAP](은)는 최근 양국 간 관세 동맹에 관한 외교적 논의를 재개했습니다. 협상안은 대체로 공정해 보이지만, 훗날 우리가 대비하지 못한 다른 요구 사항이 포함될 수도 있습니다. 이 조약과 무역 품목은 사소하고 상징적인 수준에 그치는 듯하니, 서명한다고 해서 해가 되지는 않을 것입니다."
 MUN_czech.1040.a: "해도 괜찮겠군."
 MUN_czech.1040.b: "신뢰할 수 없다."
 MUN_czech.1041.t: "[FROM.getname]의 관세 동맹 조약 거부"
 MUN_czech.1041.d: "[From.getname](은)는 이 조약이 자국 경제에 악영향을 미칠 수 있다는 몇 가지 이유를 들면서 양국 간의 관세 동맹 조약 체결을 거부했습니다. 그 이유는 근거 없는 핑계에 불과해 보입니다."
 MUN_czech.1041.a: "실망스럽군."
 MUN_czech.1042.t: "[FROM.getname]의 관세 동맹 조약 동의"
 MUN_czech.1042.d: "조약 내용이 만족스럽다고 판단한 [FROM.getname](은)는 조약 조건에 동의했습니다. 이번 조약이 양국 관계 강화의 첫걸음이 되기를 바랍니다."
 MUN_czech.1042.a: "훌륭하군."
 MUN_czech.1043.t: "[FROM.getname]의 연방 가입 요구"
 MUN_czech.1043.d: "양국 간의 긴밀한 관계와 최근의 세계정세 변화를 언급하며, [FROM.getname](은)는 고립된 상태보다는 그들의 보호 아래 있는 것이 더 나을 것이라고 말했습니다. 하지만 이는 단순히 우리 영토를 점령하려는 술책으로 보입니다. 어떻게 해야 할까요?"
 MUN_czech.1043.a: "제안을 수락하겠다."
 MUN_czech.1043.b: "끔찍한 생각이군."
 MUN_czech.1044.t: "[FROM.getname]의 연방 가입 거부"
 MUN_czech.1044.d: "[FROM.getname](은)는 우리 아래에 있는 것보다 홀로 남는 편이 낫다고 판단하고, 우리의 연방 가입 제안을 거부했습니다. 이는 유럽 내에서 우리의 입지를 강화하려는 목표에 적지 않은 타격이라 할 수 있습니다. [FROM.getname](이)가 생각을 바꾸지 않는 이상, 우리는 어떻게 해야 할까요?"
 MUN_czech.1044.a: "아쉽게 됐군."
 MUN_czech.1044.b: "다른 방법을 시도해 보아야겠다."
 MUN_czech.1045.t: "[FROM.getname]의 연방 가입 동의"
 MUN_czech.1045.d: "[FROM.getname](은)는 그들이 고립되어 있는 것보다는 우리 아래에 있을 때 더 잘 보호받을 수 있다는 것을 깨닫고 현명하게도 우리 연방에 가입했습니다. 이는 유럽 내에서 우리의 입지를 크게 강화할 것입니다."
 MUN_czech.1045.a: "훌륭하군."
 MUN_czech.1046.t: "분열 치유하기"
 MUN_czech.1046.d: "우리 국가 내의 여러 문제를 해결해 나간 결과, 국가 내의 긴장이 점차 완화되고 있는 듯합니다. 다양한 경제 및 사회 프로그램을 성공적으로 마무리한 결과, 이제 우리 국가는 치유의 길로 들어서고 있는 것 같습니다."
 MUN_czech.1046.a: "훌륭한 소식이다."
 #MUN_czech.1047 is hidden
 MUN_czech.1048.t: "[FROM.GetName]의 요구 수락"
 MUN_czech.1048.t2: "[FROM.GetName]의 제안 동의"
 MUN_czech.1048.d: "[FROM.GetAdjective] 관계자들은 마지못해 우리의 영토 요구에 굴복할 의향이 있다고 통보했습니다. 이미 [FROM.GetAdjective] 군대는 해당 영토에서 철수 중입니다."
 MUN_czech.1048.d2: "오랜 논의 끝에 우리 측 관계자들과 [FROM.GetNameDef] 측 관계자들은 연합의 일원으로서 [FROM.GetAdjective] 경제의 새로운 역할에 성공적으로 합의했습니다. 이번 합의는 양국 국민 모두에게 번영을 가져다줄 것입니다."
 MUN_czech.1048.d3: "우리의 불가침조약 제안은 [FROM.GetAdjective] 대표들로부터 즉각적으로 열렬한 호응을 얻었지만, 그들의 야망은 현재 다른 곳에 집중되어 있는 듯합니다."
 MUN_czech.1048.d4: "심각한 위협을 받은 [FROM.GetNameDef](은)는 우리의 동맹 요구에 굴복했습니다."
 MUN_czech.1048.d5: "오랜 논의 끝에 우리 관계자들과 [FROM.GetNameDef] 측 관계자들은 우리 군수산업의 일부가 그들에게 필요한 장비를 생산하는 데 전념한다는 합의에 성공적으로 도달했습니다. 그 대가로 우리는 우리 시장과 생산을 위한 무역 상품을 받게 될 것입니다."
 #MUN_czech.1049 is a faction joining event so largely reuses generic loc
 MUN_czech.1049.d: "[FROM.GetNameDef]의 새 정부가 우리에게 동맹을 제안해 왔습니다. 그들의 새 군사정부가 초기에는 반독일적인 입장을 보였지만, 실용적인 판단을 내려 기존의 국제 파트너들이 신뢰할 수 없다는 것을 인정한 것 같습니다."
 MUN_czech.1050.d: "우리 외교관들이 [FROM.GetNameDef]에서 실망스러운 소식을 가지고 돌아왔습니다. 그들의 동맹에 가입하겠다는 우리의 요청이 거부되었다는 것입니다. 거부 사유는 불분명하지만, 우리는 새로운 동맹을 얻지 못한 채 기존의 동맹국에 대한 우려가 드러난 어려운 상황에 부닥쳐 있습니다."
 MUN_czech.1050.a: "더 유리한 조건을 제안해야 될 것 같군."
 MUN_czech.1050.b: "더 나은 동맹을 찾도록 하지."
 MUN_czech.1051.t: "[FROM.GetName]의 영향권 요청"
 MUN_czech.1051.d: "우리의 새로운 동맹인 [FROM.GetNameDef](은)는 국경을 넘어 영향력을 확대하는 데 관심을 보이고 있습니다. 이에 따라 [FROM.GetAdjective] 측 대표단이 이러한 확장에 대한 허가와 지원을 요청하기 위해 방문했으며, [ROOT.GetAdjective] 및 [FROM.GetAdjective]의 영향권 사이에 명확한 경계를 설정하고자 합니다."
 MUN_czech.1051.a: "우리 중요한 [FROM.GetAdjective] 동맹에 힘을 실어주어야 한다."
 MUN_czech.1052.t: "[FROM.GetName]의 [SOV.GetAdjective] 군대 통과 허용 요청"
 MUN_czech.1052.d: "[FROM.GetNameDef](와)과 [SOV.GetNameDef] 간의 새로운 외교 협정 체결 이후, [FROM.GetNameDef](은)는 분쟁 발생 시에 [SOV.GetNameDef](이)가 자신들을 보호해 줄 것이라고 확신하고 있습니다. 유일한 장애물은 양국 간 육로 연결이 없다는 점이며, 이에 따라 [FROM.GetAdjective] 외교관들은 우리 정부에 분쟁 발생 시 [SOV.GetAdjective] 군대가 우리 영토를 통해 [FROM.GetNameDef](으)로 이동할 수 있도록 허용해 달라고 요청했습니다."
 MUN_czech.1052.a: "그들이 싸워준다면 우리도 보호받게 되겠지."
 MUN_czech.1053.t: "[HUN.GetAdjective]의 영유권 주장으로 우리를 압박하는 [FROM.GetName]"
 MUN_czech.1053.d: "[HUN.GetNameDef](이)가 종속국이 된 후, [FROM.GetNameDef](은)는 이제 우리에게도 같은 운명을 받아들이라고 요구하고 있습니다. 만약 우리가 거부한다면, [HUN.GetAdjective]의 [ROM.GetAdjective] 영토에 대한 영유권 주장을 지지하겠다고 위협하고 있습니다. 이제 우리는 주권을 잃거나 영토를 잃을 위험을 감수하거나 둘 중 하나를 택해야 합니다."
 CZE_cancel_anti_hungary_focus_tt: "§Y$CZE_neutralize_the_hungarian_threat$§! 중점 취소"
 MUN_czech.1054.t: "[LIT.GetName] 합동 침공?"
 MUN_czech.1054.d: "앞서 합의한 대로, [FROM.GetNameDef](은)는 우리 국가를 강화하는 데 도움이 될 제안을 내놓았습니다. 바로 [LIT.GetNameDef](와)과 강제로 통합하면 추가 자원을 확보할 수 있고, 적이 [LIT.GetNameDef](을)를 통해 우리를 공격할 가능성도 차단할 수 있다는 것입니다."
 MUN_czech.1054.a: "다른 자들의 확장에 저항하려면 우리가 확장해야 한다."
 MUN_czech.1055.t: "[SOV.GetAdjective] 의용군의 도착"
 MUN_czech.1055.d: "전례 없는 수준의 항공 군수 역량을 발휘하며, [SOV.GetNameDef](은)는 공군을 활용하여 다수의 의용군 사단을 [73.GetName]의 우리 공항에 파견해서 현재 진행 중인 전쟁을 지원하고 있습니다."
 MUN_czech.1056.t: "[FROM.GetName]의 [975.GetName] 요구"
 MUN_czech.1056.d: "대전쟁 이후 열린 파리 평화 회담에서 한때 제안되었던 것처럼, [CZE.GetNameDef] 측은 동맹의 안보를 위해 동맹국 [YUG.GetNameDef]까지 연결된 회랑이 필요하다고 발표했습니다. 이를 위해 [FROM.GetAdjective] 대표단은 우리에게 [975.GetName](을)를 할양하라는 최후통첩을 전달했습니다."
 #THE FALL OF THE REPUBLIC EVENTS#
 MUN_the_fall_of_the_republic.1.t: "광범위하게 확산되는 시위"
 MUN_the_fall_of_the_republic.1.d: "[ROOT.GetLeader](이)가 최근 주데텐란트를 양도하기로 결정하면서 전국적으로 시위가 발발했습니다. 정계와 군부의 지도자들은 승산 없는 싸움에서 무의미한 저항을 하다 피를 흘리는 일을 피하고자 했지만, 국민 다수는 그런 결정을 잘못된 선택으로 여긴 것입니다. 현재 일부 정치 세력은 이러한 혼란을 틈타 자신들의 목적을 달성하려고 움직이기 시작했습니다."
 MUN_the_fall_of_the_republic.1.a: "우리도 어쩔 수 없었다!"
 MUN_the_fall_of_the_republic.2.t.1: "제1공화국의 몰락"
 MUN_the_fall_of_the_republic.2.t.2: "정부 내부의 혼란"
 MUN_the_fall_of_the_republic.2.d: "정부가 주데텐란트를 양도하기로 결정한 후, 군부와 정부의 하급 지도층 인사들이 대거 사퇴하며 나라가 큰 혼란에 빠졌습니다. 밤사이 다른 나라로 도피한 사람도 있다고 합니다. 관료의 이탈을 막고 우리 지도력에 대한 신뢰를 회복하려면 정부 내부를 근본적으로 개혁해야 합니다."
 MUN_the_fall_of_the_republic.2.a: "근본적인 변화가 필요하다."
 MUN_the_fall_of_the_republic.2.b: "흔들려서는 안 된다!"
 MUN_the_fall_of_the_republic.3.t: "[RUT.getname]의 자치권 요구"
 MUN_the_fall_of_the_republic.3.d: "최근 우리 나라에 닥친 정치적 혼란을 틈타, 카르파티아 우크라이나라는 작은 지역이 자치권을 얻어 [9.GetCapitalVictoryPointName]의 통제에서 벗어나려 합니다. 그리고 그 이유로 [ROOT.getname] 내 다른 지역과의 오랜 갈등을 언급했습니다. 하지만, 이 요구에는 현지 지도자들이 정치적 혼란을 이용해 힘을 키우려는 의도도 있어 보입니다. 이를 거부하면 정치적 자본이 바닥난 상황에서 큰 부담이 될 것입니다."
 MUN_the_fall_of_the_republic.3.a: "우리야 좋지."
 MUN_the_fall_of_the_republic.3.b: "어림도 없는 소리!"
 MUN_the_fall_of_the_republic.3.c: "그냥 독립하게 두어라."
 MUN_the_fall_of_the_republic.4.t: "[RUT.getname]의 운명"
 MUN_the_fall_of_the_republic.4.d: "최근 [CZE.getname]에 닥친 혼란의 여파로, [RUT.getname](이)라는 작은 지역이 어느 국가에도 속하지 않게 되었습니다. 이곳은 독립국임을 자처하며 주변국과 외교적 접촉을 시도하기 시작했습니다. 우리 정부의 많은 인사는 국경 지대에 있는 이 전략적 요충지가 타국의 손에 넘어갈까 봐 우려하고 있습니다. 군부에서는 이 분리 독립 지역에 즉시 최후통첩을 보내 합병을 요구해야 한다고 제안합니다."
 MUN_the_fall_of_the_republic.4.a: "즉시 최후통첩을 보내라!"
 MUN_the_fall_of_the_republic.4.b: "위험할 수 있으니, 좀 더 지켜보지."
 MUN_the_fall_of_the_republic.5.t: "[FROM.getname]의 합병 요구!"
 MUN_the_fall_of_the_republic.5.d: "우리가 독립하면 주변국이 우리를 병합하려 나설 것은 불 보듯 뻔한 일이었습니다. 그 첫 번째 국가는 바로 [FROM.getname](으)로, 우리에게 투항할 것을 요구했습니다. 어떻게 해야 할까요?"
 MUN_the_fall_of_the_republic.5.a: "최후의 최후까지 싸우리라!"
 MUN_the_fall_of_the_republic.5.b: "승낙할 수밖에 없군."
 MUN_the_fall_of_the_republic.6.t: "[FROM.getname]의 최후통첩 거부!"
 MUN_the_fall_of_the_republic.6.d: "놀랍게도 [FROM.getname] 측이 우리의 최후통첩을 거부하고 무력 저항할 태세를 갖췄습니다. 이렇게 된 이상 침공 외의 다른 선택지는 없어 보입니다. 전투 계획과 공격 경로는 이미 수립되었으므로, 공격 명령만 내리면 개시할 수 있습니다."
 MUN_the_fall_of_the_republic.6.a: "우린 경고했다."
 MUN_the_fall_of_the_republic.6.a_tt: "이 작전은 [RUT.GetNameDef]에게 동맹이 없는 한 §Y$HUN_pal_teleki$§!에게 영향을 주지 않습니다."
 MUN_the_fall_of_the_republic.6.b: "역풍이 불 수 있으니, 일단 보류다."
 MUN_the_fall_of_the_republic.7.t: "우리의 요구에 굴복한 [FROM.getname]"
 MUN_the_fall_of_the_republic.7.d: "예상대로, [FROM.getname](은)는 우리의 요구를 수용하며 몇 가지 사소한 조건만 충족하면 우리 국가에 합병될 의향이 있다고 밝혔습니다. 그 작은 지역이 우리만큼 강한 국가를 상대로 버틸 가능성은 애초에 없었습니다. 이제 우리의 북부 전선은 이전보다 더 안전하게 보호되고 있으며, 정부는 쉽게 거둔 승리에 매우 만족하고 있습니다."
 MUN_the_fall_of_the_republic.7.a: "좋은 소식이군."
 #BOP EVENTS#
 MUN_czech_bop.1.t: "함대 준비 태세"
 MUN_czech_bop.1.d: "지난 5년간 추진한 개혁들이 성과를 내기 시작했습니다. 현재 우리 군은 유럽에서도 손꼽히게 현대적인 군대가 되었습니다. 그런데 동시에 몇몇 정치인과 많은 대기업 수장이 안일해지기 시작했습니다. 우리 군이 최상의 준비 태세를 유지하려면, 우리 군의 전투력을 의심하는 이들과 우리 군을 약화하여 사익을 챙기려는 세력에 맞서 싸워야 합니다."
 MUN_czech_bop.1.a: "준비 태세를 갖추겠다."
 MUN_czech_bop.2.t.1: "독일 재무장 위협"
 MUN_czech_bop.2.t.2: "주변국의 군사력 확장"
 MUN_czech_bop.2.d.1: "최근 [GER.getnameDEFcap](이)가 라인란트를 재무장하면서, 우리 군부 및 정계 지도부가 불안감을 느끼고 있습니다. 많은 이들은 우리가 맺은 동맹과 독일의 위협에 대비해 군이 준비 중인 대비책을 신뢰하고 있지만, 우리 나라가 과연 [GER.GetAdjective](을)를 상대로 승산이 있을지 의심하는 이들도 있습니다."
 MUN_czech_bop.2.d.2: "최근 일부 주변국에서 대규모 군사 확장 계획을 추진했다는 소식이 전해지면서, 우리 군부 및 정계 지도부가 불안감을 느끼고 있습니다. 우리나라가 맺은 다른 나라와 맺은 동맹과 외국의 위협에 대비해 군대에서 마련 중인 대비책을 신뢰하는 이들이 많긴 하지만, 우리나라가 과연 외세의 공세에 대응할 수 있을지 의심하는 이들도 있습니다."
 MUN_czech_bop.2.a: "만반의 태세를 갖추겠다."
 MUN_czech_bop.2.a_tt: "이웃 국가들이 재무장에 힘쓰면서, 우리가 다가올 침략을 저지할 능력이 있는지 의심하는 사람들이 생겨났습니다. 우리는 행동으로 군을 안심시켜야 합니다."
 MUN_czech_bop.3.t: "[CZE.getname]의 감시단 파견"
 MUN_czech_bop.3.d: "현재 진행 중인 분쟁을 주시하기 위해 최근 [CZE.getname]에서 우리나라에 감시단을 파견했습니다. 이와 동시에 [CZE.getname]의 한 소화기 제조사가 비공식 경로로 우리 외교관들에게 접촉해, 무기를 구매할 의향이 있는지 문의했습니다. 현재 우리나라에 부과된 규제 때문에 실제로 거래하려면 우리는 무기를 밀수해야 합니다."
 MUN_czech_bop.3.a: "어떻게 될지 한번 살펴보자."
 MUN_czech_bop.3.b: "그들은 지켜보는 것 말고는 무엇도 더 하지 말아야 한다."
 MUN_czech_bop_3_tt: "§Y[CZE.getname]§! 총기 제조사 §Y$CZE_zbrojovka_brno_organization$§!(이)가 우리에게 무기를 밀수하려 할 수 있습니다."
 MUN_czech_bop.4.t: "$CZE_zbrojovka_brno_organization$의 계획"
 MUN_czech_bop.4.d: "[ETH.getname](은)는 $CZE_zbrojovka_brno_organization$ 무기 제조사의 대표자들과 접촉했으며, 우리 무기를 국내로 밀수하는 데 관심을 보이고 있습니다. [ETH.GetNameDef]에 대한 국제연맹의 제재에도 불구하고, $CZE_zbrojovka_brno_organization$(은)는 이 계획을 실행하려 합니다. 만약 우리가 발각된다면, 국제연맹의 결의안을 위반하는 행위이므로 국제적으로 큰 비난을 받을 것입니다."
 MUN_czech_bop.4.a: "한번 해보자."
 MUN_czech_bop.4.b: "그런 역풍을 감수할 만한 가치는 없다."
 CZE_gun_smuggling_tt: "국내로 무기 밀수"
 CZE_we_got_caught_tt: "§Y$CZE_zbrojovka_brno_organization$§!(이)가 발각됩니다."
 CZE_we_dont_get_caught_tt: "§Y$CZE_zbrojovka_brno_organization$§!(이)가 발각되지 않습니다."
 MUN_czech_bop.5.t: "$CZE_zbrojovka_brno_organization$의 밀반입 계획 수락"
 MUN_czech_bop.5.d: "$CZE_zbrojovka_brno_organization$(이)가 체코 정부 관계자들과 협의 끝에 은밀히 소량의 소화기를 밀반입해도 좋다는 승인을 받았습니다. 이 제조사의 기술적 지원도 우리의 비공식 경로를 통해 제공될 예정입니다."
 MUN_czech_bop.5.a: "유용하게 쓰도록 하지."
 MUN_czech_bop_5_tt: "이 §Y제조사§!는 전쟁이 끝난 후 §R제거§!됩니다."
 ##SLOVAKIA##
 MUN_slovakia_little_war.1.t: "[71.Getname]에서의 승리"
 MUN_slovakia_little_war.1.d: "우리 군대는 [71.Getname]에서 적군을 격파함으로써 훌륭한 성과를 거두었습니다. 우리 지휘관들은 이 전투를 통해 앞으로 활용할 수 있는 귀중한 정보와 교훈을 얻었습니다."
 MUN_slovakia_little_war.1.a: "잘했다."
 MUN_slovakia_little_war.2.t: "[71.Getname]에서의 패배"
 MUN_slovakia_little_war.2.d: "우리 군대는 최선을 다했지만, [71.Getname]에서 패배했습니다. 전투에 대비해 충분한 탄약과 차량화 장비를 시간 내에 확보하지 못한 것이 패배의 주요 원인이었습니다. 이러한 좌절에도 불구하고, 전투에 참여했던 지휘관들은 매우 중요한 교훈을 얻었습니다."
 MUN_slovakia_little_war.2.a: "실망스러운 성과로군."
 MUN_slovakia_little_war.3.t: "[71.Getname] 내 국경 분쟁"
 MUN_slovakia_little_war.3.d: "우리가 $GER_first_vienna_award$에서 영토를 확보했음에도 불구하고, [HUN.getnamedef](은)는 여전히 [71.getname]에서 우리와 국경을 추가로 조정하려 하고 있습니다. 우리는 싸움 없이는 우리의 땅을 내주지 않을 것임을 보여주기 위해 이 도전에 무력으로 맞서야 합니다."
 MUN_slovakia_little_war.3.a: "어떻게 감히 이런 짓을!"
 MUN_slovakia_little_war.4.t: "[71.Getname]의 교착 상태"
 MUN_slovakia_little_war.4.d: "우리 군대는 최선을 다했지만, [71.Getname]에서의 소규모 교전에 승리하지 못했습니다. 전투에 대비해 충분한 탄약과 차량화 장비를 시간 내에 확보하지 못한 것이 승리하지 못한 주요 원인이었습니다. 이러한 좌절에도 불구하고, 전투에 참여했던 지휘관들은 매우 중요한 교훈을 얻었습니다."
 MUN_slovakia_little_war.4.a: "실망스럽군."
 ##Exile##
 MUN_czech_exile.1.t: "[CZE.GetAdjective] 망명자들이 [ROOT.GetNameDef]에 도착"
 MUN_czech_exile.1.d: "뮌헨 회담 이후 [GER.GetNameDef](이)가 그들의 나라를 해체한 여파로, [CZE.GetAdjective] 망명자들이 우리 나라를 비롯한 여러 국가에 도착했습니다. 그들은 언젠가 우리의 도움으로 조국을 해방할 수 있기를 바라며, 우리를 돕기 위해 무기를 들 의향을 보이고 있습니다."
 MUN_czech_exile.1.a: "환영한다."
 ##NEWS EVENTS##
 MUN_czech.news.1.t: "주데텐란트 위기"
 MUN_czech.news.1.desc: "주데텐란트 주민들이 [CZE.getnameDef]에 대항하는 무장 반란을 일으켰습니다. 주데텐란트 준군사 조직이 지역 내 경찰서와 정부 청사를 공격하기 시작했다는 보고가 잇따라 들어오고 있습니다. 이는 [FROM.getname]이(가) 해당 지역을 합병하려 한다는 소식이 전해진 후 시작되었습니다.\n\n이러한 반란은 [FROM.getname](와)과 [CZE.GetNameDef] 사이의 피할 수 없는 대규모 충돌의 서막일지도 모릅니다."
 MUN_czech.news.1.a: "유럽에 불길한 징조가 드리우는군."
 MUN_czech.news.1.b: "혼돈은 곧 기회다."
 MUN_czech.news.1.c: "우리는 승리하리라!"
 MUN_czech.news.1.d: "외교로 풀 수 있으면 좋겠는데."
 MUN_czech.news.2.t: "[FROM.GetNameDefCap]의 [RUT.GetNameDef] 침공"
 MUN_czech.news.2.desc: "\n[CZE.getname]의 정치적 혼란으로 말미암아 발생한 최근의 여러 사건 중에 [RUT.getname](이)라는 작은 지역이 어느 국가에도 속하지 않게 된 일이 있었습니다. 이 작은 국가는 스스로 독립국임을 선언한 후, 새로 세운 나라를 지키고자 민병대를 꾸리기 시작했습니다.\n\n[FROM.getnamedefcap](은)는 예전부터 그 지역을 노려왔고, 기회를 포착하자마자 즉시 그 작은 신생국을 침공했습니다. 주변에서는 이 침공이 [RUT.getname]의 패배로 끝날 것이라고 단정하는 분위기입니다."
 MUN_czech.news.2.a: "카르파... 어디?"
 MUN_czech.news.2.b: "식은 죽 먹기겠군."
 MUN_czech.news.2.c: "올 테면 와 봐라!"
 MUN_slovakia.news.1.t: "[71.Getname] 내 소규모 국경 충돌"
 MUN_slovakia.news.1.desc: "$GER_first_vienna_award$ 이후 [664.Getname](을)를 되찾았음에도 불구하고, [HUN.getnamedef](은)는 여전히 [71.Getname]에서 [SLO.getnamedef](와)과의 국경 문제에 대해 추가적인 조정을 시도하고 있습니다.\n\n이번 분쟁은 [HUN.getnamedef](이)가 훨씬 약한 상대에게 군사력을 시험해 보기 위해 만든 핑계인 것 같습니다. [SLO.getnamedef]의 신생 군대는 눈앞의 도전에 맞설 준비가 안 되어 있을 수도 있습니다."
 MUN_slovakia.news.1.a: "티격태격하는 아이들이로군."
 MUN_slovakia.news.1.b: "우리는 이런 일에 대비가 되어 있다."
