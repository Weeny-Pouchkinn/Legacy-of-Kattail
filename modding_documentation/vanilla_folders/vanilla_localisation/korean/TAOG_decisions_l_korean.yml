 AST_request_resource_rights_in_indochina: "프랑스령 인도차이나 내 자원 채굴권 요청"
 AST_resource_request_ongoing_flag: "자원 요청 §Y진행 중§!"
 AST_australia_first_movement_cat: "호주 제일주의 운동"
 AST_summons_to_australian_hall: "오스트레일리안 홀로 소집"
 AST_summons_to_australian_hall_desc: "[AST.GetFascistParty]을 성장시키기 위해서는 지지자들을 단결시키고 동원해야 합니다. 오스트레일리안 홀이 기다립니다."
