 AST_australia_formables_category: "오스트랄라시아"
 AST_australia_formables_category_desc: "[AST.GetName]의 뿌리는 우리를 언제나 먼 남쪽에 묶어 두겠지만, 우리의 손길은 길고 멀리 뻗어 나갔으며, 이제 더 이상 누구도 세계 문제에 대한 우리의 견해를 무시할 수 없게 되었습니다. 우리는 영토를 넓혔고, 앞으로도 더 넓힐 수 있습니다. 그러므로 우리 국가의 새 이름은 이 사실을 분명히 드러내야 합니다. [AST.GetName]이라는 고치에서 벗어난 우리는 날개를 펼쳐 세계가 감탄하고 인정하게 할 것이며, 남쪽의 새로운 나라에 우리의 색과 무늬를 새긴 이름을 붙일 것입니다. 바로 오스트랄라시아입니다."
