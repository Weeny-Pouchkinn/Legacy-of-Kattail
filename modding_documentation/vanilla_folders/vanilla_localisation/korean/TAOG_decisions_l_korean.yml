 ############
 SIA_war_fervor_cat: "전쟁의 열기"
 SIA_war_fervor_cat_desc: "국민이 품은 분쟁을 향한 열망은 신중하게 관리해야 합니다. 제어되지 않은 채 방치하면 전쟁의 열기는 내부로 향하게 될 것이며, 이를 제대로 조정하지 않고 호전적인 분위기를 부추기는 정부는 오히려 다음 표적이 될 위험이 있습니다."
 SIA_war_fervor_coup_dummy: "끓어오르는 전쟁의 열기"
 SIA_war_fervor_coup_dummy_desc: "사람들의 전쟁에 대한 욕구가 끓어오르고 있습니다. 해소될 출구를 찾지 못하면, 그 열기는 필연적으로 우리에게 향하게 될 것입니다."
 SIA_urge_restraint: "자제 권고"
 SIA_war_fervor_coup: "쿠데타 임박"
 SIA_modify_cultural_mandates: "$idea_SIA_thai_cultural_mandates$ 변동치:"
 SIA_mandate_1: "문화명령 제1호"
 SIA_mandate_1_desc: "국가, 국민, 국적을 '타이'라고 부른다."
 SIA_mandate_1_tt: "§Y[THIS.GetName]§! 측은 §Y$SIA_thailand$§! 측으로 알려집니다."
 SIA_mandate_2: "문화명령 제2호"
 SIA_mandate_2_desc: "타이 국민은 국가의 이익과 안전을 고려하지 않은 어떠한 사업에도 관여해서는 안 된다.\n\n타이 국민은 국가에 해를 끼칠 수 있는 어떤 것도 외국인에게 알려서는 안 된다. 이러한 행위는 국가에 대한 반역이다.\n\n타이 국민은 타이의 이익을 고려하지 않고 외국인의 대리인이나 대변인 역할을 해서는 안 되며, 국제 분쟁에서 외국인을 두둔하거나 그편에 서서는 안 된다. 이러한 행위는 국가에 대한 반역이다.\n\n타이 국민은 국가를 위태롭게 하는 방식으로 외국인을 대신하여 비밀리에 토지를 매입해서는 안 된다. 이러한 행위는 국가에 대한 반역이다.\n\n 누군가 국가를 배신했을 경우, 적극적이고 신속하게 이를 저지해야 하는 것이 타이 국민의 의무이다."
 SIA_mandate_3: "문화명령 제3호"
 SIA_mandate_3_desc: "타이 국민을 지칭할 때 국적 명칭을 따르지 않거나, 특정 집단의 선호에 따라 부르는 것을 중단한다.\n\n타이 국민을 세분화하지 않고 모두 '타이인'이라는 명칭으로 지칭한다."
 SIA_mandate_4: "문화명령 제4호"
 SIA_mandate_4_desc: "정부 관례에 따라 국기가 게양되거나 내려질 때, 또는 경례 나팔이나 호각 소리가 들릴 때, 혹은 국기 게양 또는 하강 신호가 주어질 때, 규정이나 관례에 따라 국기에 대한 경의를 표하라.\n\n공식적인 목적이든 각종 의식의 일부이든 국가가 연주될 때, 참가자와 참석자는 규정이나 관례에 따라 국가에 경의를 표하라.\n\n누군가가 적절한 예우를 표하지 않는 것을 목격하면 국기, 국가, 그리고 왕실 찬가에 대한 존경의 중요성을 깨닫도록 그 사람을 훈계하라."
 SIA_mandate_5: "문화명령 제5호"
 SIA_mandate_5_desc: "타이 국민은 타이산 재료로 만든 음식만 섭취하도록 노력해야 한다.\n\n타이 국민은 타이산 제품으로 만든 옷만 입도록 노력해야 한다.\n\n타이 국민은 동료 타이 국민들의 농업, 상업, 산업 및 기타 직업 활동을 지원해야 한다.\n\n타이 국민은 정부 또는 타이 국민이 설립한 모든 공공사업을 이용하고 지원해야 합니다.\n\n이 명령이 장려하는 농업, 상업, 산업 또는 기타 직업에 종사하는 타이 국민은 표준을 유지하고 품질을 향상시키며 정직하게 사업을 운영하도록 노력해야 한다."
 SIA_mandate_6: "문화명령 제6호"
 SIA_mandate_6_desc: "국가의 음악은 프라 첸두리양이 작곡한 음악을 사용하며, 미술부에 악보로 보관된다.\n\n국가의 가사는 군에서 제출한 가사를 사용한다."
 SIA_mandate_7: "문화명령 제7호"
 SIA_mandate_7_desc: "모든 타이 국민은 국가 건설에 이바지해야 한다. 신체가 건강한 사람은 누구나 안정적인 직업에 종사해야 한다. 직업이 없는 사람은 국가에 도움이 되지 않으며 타이 국민의 존경을 받을 자격이 없다."
 SIA_mandate_8: "문화명령 제8호"
 SIA_mandate_8_desc: "왕실 국가에서는 가사를 간략화하고 '시암'이라는 단어를 '타이'로 대체한다."
 SIA_mandate_9: "문화명령 제9호"
 SIA_mandate_9_desc: "타이 국민은 타이어를 찬양, 존경하고 존중해야 하며, 타이어를 말할 수 있음을 영광으로 여겨야 한다.\n\n타이 국민은 선량한 시민으로서 모국어를 공부하는 것을 의무로 여겨야 하며, 최소한 읽고 쓸 수 있어야 한다. 또한 타이어를 말하거나 읽지 못하는 시민들이 타이어를 익히도록 돕고 지원하는 것을 중요한 의무로 여겨야 한다.\n\n타이 국민은 출생지, 거주지 또는 지역 억양을 차별의 기준으로 삼아서는 안 된다. 타이 국민으로 태어난 모든 사람은 똑같은 타이 혈통을 가지며 같은 타이어를 사용한다는 것을 진실로써 받아들여야 한다. 출생지나 억양은 아무런 차이가 되지 않는다.\n\n타이 국민은 타이의 선량한 시민으로서 마땅히 해야 할 행동을 하는 것을 자신의 의무로 받아들여야 하며, 아직 그 의무를 알지 못하는 사람들에게 타이의 선량한 시민으로서의 의무를 권고하고 가르쳐야 한다."
 SIA_mandate_10: "문화명령 제10호"
 SIA_mandate_10_desc: "타이 국민은 적절한 복장을 갖추지 않고 공개된 모임, 공공장소나 시내에 나타나서는 안 된다. 부적절한 복장에는 속옷만 입거나, 상의를 입지 않거나, 천만 몸에 두르는 차림이 포함된다.\n\n타이 국민에게 적절한 복장은 지위와 상황에 맞는 제복, 단정한 국제식 복장, 단정한 전통 복장이다."
 SIA_mandate_11: "문화명령 제11호"
 SIA_mandate_11_desc: "타이 국민은 시간을 세 부분으로 나누어야 한다. 하나는 일하는 시간, 하나는 개인 활동 시간, 그리고 나머지 하나는 휴식과 수면 시간이다. 이러한 시간 배분은 질서정연해야 하며, 습관이 될 때까지 정해진 일정을 따라야 한다.\n\n타이 국민은 정상적인 개인 활동으로서 하루 4회 이하 정해진 시간에 식사해야 한다. 수면 시간은 약 6~8시간이다.\n\n타이 국민은 낙담하거나 태만하지 않고 성실하게 업무를 수행해야 한다. 정오의 휴식 및 점심 식사 시간은 한 시간을 넘지 않아야 한다. 퇴근 후에는 최소 한 시간 동안 운동을 하거나, 정원 가꾸기, 애완동물 돌보기, 나무 심기 등의 활동을 해야 한다. 그런 다음 샤워를 하고 저녁 식사를 한다.\n\n타이 국민은 야간에 여가 시간을 활용하여 필요한 일을 마무리하고, 가족 및 친구와 대화하고, 라디오 뉴스나 독서를 통해 지식을 쌓거나, 기회가 되는 한 다른 오락이나 예술 활동도 해야 한다."
 SIA_mandate_12: "문화명령 제12호"
 SIA_mandate_12_desc: "공공장소나 도로에서는 어린이, 노인, 장애인을 돕고 보호해야 한다.\n\n1번 항목을 따르는 사람은 타이 국민의 존경을 받을 만한 교양 있는 사람으로 간주한다."
 SIA_movie_theater_cat: "$SIA_sala_chaloem_thai_movie_theater$"
 SIA_movie_theater_cat_desc: "은막은 현대 국가의 가장 강력한 도구 중 하나입니다. 신중하게 선별한 영화와 선전 활동을 통해, 정부는 여론을 형성하고 애국심을 고취하며 반대 의견을 묻어 버릴 수도 있습니다."
 SIA_celebrating_the_constitution: "헌법 기념"
 SIA_the_revolution_of_24th_june: "6월 24일의 혁명"
 SIA_suppressing_the_rebellion_of_1933: "1933년 반란 진압"
 SIA_the_king_of_krung_thon: "크룽톤의 왕"
 SIA_blood_of_suphan: "수판의 피"
 SIA_thai_soldiers_blood: "타이 군인들의 피"
 SIA_undauntedly_love_nation: "흔들리지 않는 애국"
 #LIMITED WAR
 SIA_limited_war_cat: "제한전"
 SIA_limited_war_cat_desc: "우리는 아직 전면전으로 이 지역의 강대국들을 제압할 수 없습니다. 신중하게 계획된 작전을 통해 조금씩 우리의 주장을 밀어붙여, 그들의 입지를 잠식하면서 동시에 우리의 힘을 키워나가야 합니다."
 SIA_start_limited_war_indochina: "인도차이나에서 [FROM.GetName]에 대한 제한전 개시"
 SIA_start_limited_war_indochina_tt_main: "§Y[FROM.GetName]§!에 대한 §Y제한전§!을 시작합니다.\n§Y[FROM.GetName]§!에 속한 모든 강조된 주를 장악함으로써, 전면전으로 확대하지 않고도 이 주들을 점령할 수 있을 것입니다.\n§R[?var:global.limited_war_surrender_threshold|%.0] 항복 현황보다 큰 손실을 입으면 제한전에서 패배합니다§!\n\n§R제한전에서 패배하면 이전에 정복한 영토를 반환해야 할 수도 있습니다§!"
 SIA_start_limited_war_rejoin_faction: "우리는 현재 소속된 세력을 일시적으로 탈퇴하고, §Y제한전§!이 종료되는 대로 다시 합류할 것입니다."
 SIA_start_limited_war_can_join_faction: "§Y제한전§!이 종료되면 다시 세력에 가입할 수 있을 것입니다."
 is_not_engaged_in_a_limited_war: "§Y제한전§! 중이 아님"
 SIA_limited_war_indochina: "[SIA_GetLimitedWarTarget]"
 SIA_limited_war_indochina_desc: "강조된 모든 주를 장악하여 §Y제한전§!에서 승리하고, 전면전으로 확대하지 않은 채 해당 주를 차지합니다.\n§R항복 현황이 [?var:global.limited_war_surrender_threshold|%.0] 이상 증가하면 제한전에서 패배합니다§!"
 SIA_limited_war_indochina_target: "§Y[?var:limited_war_target.GetName]§!에 대한 §Y제한전§!"
 SIA_limited_war_indochina_no_target: "제한전 실패"
 SIA_start_limited_war_malaysia_burma: "[FROM.GetName]에 대한 제한전 개시"
 SIA_new_territories_administration_cat: "새 영토의 행정"
 SIA_new_territories_administration_cat_desc: "정복은 시작일 뿐입니다. 우리가 점령한 영토를, 재정복을 초래하는 골칫거리가 아닌 국가의 영구적인 일부로 만들기 위해서는 행정, 개발, 방어가 필수적입니다."
 SIA_finish_the_triangular_defense_network: "삼각 방어망 완성"
 SIA_finish_the_triangular_defense_network_desc: "북쪽과 남쪽의 두 요새가 완공되면 방콕과 연결하여 삼각 방어망을 구축할 수 있습니다. 한 곳이 함락되더라도 나머지 두 곳은 계속해서 기능을 유지할 것입니다."
 has_built_fortress_saigon: "사이공 요새 건설함"
 has_built_fortress_hanoi: "하노이 요새 건설함"
 SIA_develop_phibunsongkhram: "[1067.GetName] 개발"
 SIA_develop_southern_indochina: "인도차이나 남부 개발"
 SIA_develop_northern_indochina: "인도차이나 북부 개발"
 SIA_develop_northern_malaya: "시랏 말라이 개발"
 SIA_develop_eastern_burma: "사하랏 타이 둠 개발"
 SIA_use_abandoned_french_tools: "프랑스가 버리고 간 장비 사용"
 SIA_use_abandoned_french_tools_desc: "프랑스군은 우리 점령지에 무거운 장비들을 남겨두고 갔습니다. 우리가 이 장비들을 사용할 수 있습니다."
 SIA_fortress_saigon: "사이공 요새"
 SIA_fortress_saigon_desc: "우리 새로운 제국의 북방은 하노이를 거점으로 방어할 것입니다. 북쪽으로는 산맥이 있고 앞쪽으로는 홍강이 흐르는 하노이는 침략자를 막아내기에 완벽한 위치에 있습니다."
 SIA_fortress_hanoi: "하노이 요새"
 SIA_fortress_hanoi_desc: "제국 남쪽은 사이공을 거점으로 방어할 것입니다. 이 요새 도시는 방콕을 지키는 수호자로서 [ROOT.GetName]만을 침략자로부터 보호할 것입니다."
 SIA_propaganda_poster_slot_available_tt: "빈 영화 포스터 슬롯을 보유"
 SIA_PROPAGANDA_CAMPAIGN_TT_LEFT: "[SIA_GetPropagandaCampaignEffects_Left]"
 SIA_PROPAGANDA_CAMPAIGN_TT_CENTER: "[SIA_GetPropagandaCampaignEffects_Center]"
 SIA_PROPAGANDA_CAMPAIGN_TT_RIGHT: "[SIA_GetPropagandaCampaignEffects_Right]"
 SIA_propaganda_campaign_locked_slot_tt: "This propaganda poster slot is currently locked. It can be unlocked by completing the following focus: TODO"
 SIA_propaganda_campaign_empty_slot_tt: "이 영화 포스터 슬롯은 현재 §G비어§! 있습니다. 새로운 £SOV_propaganda_text_icon §Y영화관 캠페인§!을 §G활성화§!할 수 있습니다."
 SIA_poster_left_text: "[SIA_GetDaysRemainingLeft]"
 SIA_poster_center_text: "[SIA_GetDaysRemainingCenter]"
 SIA_poster_right_text: "[SIA_GetDaysRemainingRight]"
