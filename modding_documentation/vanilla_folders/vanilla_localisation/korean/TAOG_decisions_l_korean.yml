 ast_support_for_comrades_idea: "우리 동지를 지원"
 ast_support_for_comrades_idea_desc: "우리는 동지를 지원할 것입니다."
 ast_support_for_comrades_idea_improved: "$ast_support_for_comrades_idea$"
 ast_support_for_comrades_idea_improved_desc: "$ast_support_for_comrades_idea$"
 idea_AST_civil_war_on_their_own: "우리 스스로"
 idea_AST_civil_war_on_their_own_desc: "우리는 이 전쟁에서 혼자 싸워야 합니다."
 ast_foreign_communist_influence_idea: "타국의 공산주의 영향력"
 ast_foreign_communist_influence_idea_desc: "호주의 공산주의자들이 우리에게 영향을 끼치고 있습니다!"
 open_mae_moh_lignite_mine: "매모 갈탄 광산 개장"
 SIA_release_contigency_funds: "비상 자금 방출"
 SIA_release_contigency_funds_tt: "§Y$idea_SIA_contingency_funds$§! 변동치:\n"
 SIA_release_contigency_funds_tt2: "§Y[?var:SIA_contingency_funds]§!개월 동안입니다. 결국 자금은 사라질 것입니다. 평시에 자금을 오래 모을수록 전시에도 더 오래 사용할 수 있습니다."
 has_released_contingency_funds: "비상 자금 방출함"
 AST_election_approaching_cat: "다가오는 선거"
 AST_election_approaching_cat_desc: "한 정부가 자리를 잡을 무렵이면 벌써 다음 선거가 다가오기 시작합니다. 민주주의 정당들은 투표소가 열리고 투표함이 표로 채워지면 승리를 확보할 수 있기를 바라며, 지지율을 높이기 위한 방법을 가리지 않고 찾고 있습니다."
 AST_final_reforms_mission: "최종 개혁"
 AST_final_reforms_mission_desc: "통합호주당은 안정적인 지도력, 보수적 성향, 그리고 영국에 대한 충성심을 바탕으로 지지를 강화하고 있으며, 재집권 가능성을 높이고 있습니다. 대중의 지지를 유지하기 위해서는 지도부가 개혁을 가속화해야 합니다.\n\n§Y활성화 시 효과:§!\n§W(§Y민주주의§! 중점):\n완료 시간 §Y7§!일 감소§!"
 AST_final_reforms_effect_tt: "\n§Y$AST_final_reforms_mission$§!(이)가 활성화된 동안(§Y180§!일)의 효과:"
 AST_labor_campaign_tour_mission: "노동당 순회 선거 운동"
 AST_labor_campaign_tour_mission_desc: "모든 시민을 대표한다는 사명 아래, 호주노동당은 제국주의와 호주의 제국에 대한 충성심에 대해 다른 관점을 제시합니다. 국내의 필요가 최우선이며, 외교적 이익은 더 이상 우선시되어서는 안 됩니다.\n\n현 집권 정당과 유권자 모두에게 이러한 메시지를 전달하기 위해, 호주노동당은 전국 순회 선거 운동을 시작할 것입니다.\n\n§Y활성화 시 효과:§!\n§W일일 §Y호주노동당§! 득표율 증가: §G+0.05§!§!"
 AST_labor_campaign_tour_effect_tt: "\n§Y$AST_labor_campaign_tour_mission$§!(이)가 활성화된 동안(§Y180§!일)의 효과:\n일일 §Y호주 노동당§! 표 증가: §G+0.05§!\n\n§Y180§!일 동안의 효과:"
 AST_election_season_cat: "선거철"
 AST_election_season_cat_desc: "한 정부가 자리를 잡자마자 다음 정부가 그 자리를 차지할 준비를 합니다. 이 시점에서 민중의 지지를 흔들기 위해 할 수 있는 일은 거의 없지만, 그렇다고 해서 정당들이 노력을 멈추지는 않을 것입니다. 끝날 때까지 끝난 게 아니며, 그 결말은 투표함에서 드러날 것입니다."
 AST_election_countdown: "선거 초읽기"
 AST_election_countdown_desc: "투표소가 열릴 때까지 남은 일수입니다.\n\n§W$AST_expected_election_winner_tt$§!"
 AST_government_formation_period: "정부 구성 기간일"
 AST_government_formation_period_desc: "모든 정당은 자신들의 정책을 결정할 권한을 원하지만, 특정 상황에서는 거국정부가 가장 합리적인 선택일 수 있습니다. \n\n§W§Y활성화 시 효과:§!\n£GFX_trigger_yes $AST_election_recently_concluded$\n\n$AST_ruling_party$ 측이 §Y거국정부§!를 구성할 수 있습니다.\n\n호주 중점 계통도에 있는 민주주의 선거 창에서, §Y거국정부§!를 구성하십시오.§!"
 AST_war_is_coming_cat: "다가오는 전쟁"
 AST_war_is_coming_cat_desc: "긴장이 고조되면서, 호주의 관료들과 시민들은 그들의 정책이나 이해관계와는 상관없이 전쟁이 불가피할지도 모른다는 사실을 깨닫기 시작하고 있습니다.\n\n우리는 침략 시에 취할 절차를 결정하기 위해 내각 회의를 소집해야 합니다. 하지만 그 전에, 내각 전체가 동의하지는 않을 수도 있는 조치를 취할 필요가 있을지도 모릅니다."
 AST_seize_civilian_industry: "민간산업 장악"
 AST_seize_civilian_industry_desc: "소비재는 우리 시민과 경제 모두에 필수적이지만, 전시에는 그 필요가 더 커진다는 것은 부인할 수 없는 사실입니다. 전쟁은 다가오고 있으며, 우리는 그때를 대비해야 합니다."
 AST_scorch_the_north: "북부 초토화"
 AST_scorch_the_north_desc: "북쪽에서의 침략이 의심된다면, 이 진격을 저지할 방법은 있지만 대가가 따를 것입니다. 초토화 정책으로 인해 북부 주들의 발전이 저해될지라도, 침략자들을 막아내기 위해서는 필요한 조치일지도 모릅니다."
 AST_scorch_the_north_tt: "§Y북부 주에 해상 침공이 발생할 때의 효과:§!"
 AST_the_brisbane_line: "브리즈번 선"
 AST_the_brisbane_line_desc: "호주의 방어 능력은 외국의 침략을 완전히 막아내기에는 부족할 수 있습니다. 모든 지역을 약하게 방어하는 것보다 핵심적인 영토를 강력하게 방어하는 정책을 채택함으로써, 우리는 [AST.GetName]에서 가장 개발되고 인구가 많은 지역을 우리의 통제하에 둘 수 있습니다.\n\n어떠한 형태의 굴복도 용납할 수 없는 이들은 이러한 정책을 반대하겠지만, 정부는 [AST.GetName](을)를 합리적인 방향으로 이끌어야 할 책임이 있습니다."
 AST_summon_the_cabinet_mission: "내각 소집"
 AST_summon_the_cabinet_mission_desc: "외교관, 관료, 이론가들을 캔버라로 소집하여 침공 가능성을 논의해야 합니다."
 AST_summon_the_cabinet_tt1: "\n이 사건은 현 정부를 혼란에 빠뜨릴 것이며, 정부의 §Y붕괴§!로 이어질 수 있습니다."
 AST_australian_accusations_modifier: "호주의 비난"
 AST_cabinet_trust_cat: "내각 신뢰"
 AST_cabinet_trust_increase_tt: "\n§Y내각 신뢰§! §G증가§!\n"
 AST_cabinet_trust_decrease_tt: "\n§Y내각 신뢰§! §R감소§!\n"
 AST_cabinet_trust_remove_tt: "§Y내각 신뢰 정신§! §G제거§!"
 AST_australian_comforts_fund: "£BoP_right_texticon  호주 위문 기금"
 AST_australian_comforts_fund_desc: "정부는 캔버라 항공기 추락 사고 희생자 중 한 명을 기리기 위해, 고인의 부인이 열정적으로 활동 중인 호주 위문 기금을 후원할 것입니다.\n\n이 기금은 호주 군인들이 전장에서 보내는 시간을 조금이라도 편하게 해주기 위해 군용 식량과 개인용품을 보충하는 물품들을 보내기 위해 사용되며, 따라서 이 후원은 전쟁 수행에도 도움이 될 것입니다."
 AST_eminent_successors: "£BoP_right_texticon  탁월한 후임자"
 AST_eminent_successors_desc: "캔버라 항공 참사 희생자 중에는 존경받던 정부 고위 관료들이 있었습니다. 그들의 비극적인 죽음을 되돌릴 수는 없겠지만, 탁월한 후임자들을 임명한다면 정부를 안정시키고 국민과 장관들의 신뢰를 회복할 수 있을 것입니다."
 AST_critics_to_shame: "£BoP_right_texticon  부끄러운 비판자들"
 AST_critics_to_shame_desc: "캔버라 항공 참사는 온 나라를 뒤흔들었고, 모든 호주인은 슬픔에 잠겼습니다. 이런 시기에는 언제나 이를 이용하려는 자들이 있기 마련입니다. 우리는 비판자 중 가장 목소리를 높이는 이들의 진짜 목적을 폭로할 것입니다. 그들은 질서를 파괴하려 시도하고 있습니다."
 AST_approach_the_independents: "£BoP_left_texticon  무소속 의원들에 접근"
 AST_approach_the_independents_desc: "정부가 최근의 혼란을 뚫고 호주를 이끌어갈 능력이 있는지에 대한 신뢰가 날이 갈수록 떨어지면서 정부는 불안정한 상태에 놓여 있습니다. 무소속 의원들에게 접근한다면, 정권 교체가 최선이라는 점을 납득시킬 수 있을지도 모릅니다."
 AST_a_sound_voice: "£BoP_left_texticon  신뢰할 수 있는 목소리"
 AST_a_sound_voice_desc: "정치적으로 혼란한 이 시기에, 확신에 찬 한 목소리가 호주 국민에게 신뢰감을 주고 있습니다. 어쩌면 그 목소리의 주인이야말로 [AST.GetName]의 다음 지도자가 될 인물일지도 모릅니다."
 AST_challenge_government_narrative: "£BoP_left_texticon  정부의 주장에 반론"
 AST_challenge_government_narrative_desc: "정부가 공개한 캔버라 항공기 참사 관련 세부 사항들은 석연치 않은 점이 많아, 일부 정보가 은폐되었다는 추측을 불러일으킵니다. 경험 많은 호주 왕립공군 장교가 이상적인 비행 조건에서 어떻게 추락 사고를 낼 수 있었을까요? 정부에 답변을 요구해야 합니다."
 AST_make_a_common_enemy: "공동의 적 만들기"
 AST_make_a_common_enemy_desc: "캔버라 항공기 참사로 관료들이 목숨을 잃은 후, 불신의 목소리가 커지고 있습니다. 외국의 개입 의혹을 불러일으키는 요인은 추락 사고의 특이한 정황만이 아닙니다. 결국, 공동의 적만큼 단결을 강화하는 것도 없기 때문입니다."
 AST_make_a_common_enemy_tt: "§R사건의 가능한 효과:§!"
 AST_ensure_cabinet_loyalty: "내각의 충성 확보"
 AST_ensure_cabinet_loyalty_desc: "내각의 대다수가 현 정부에 찬성표를 던지는 한, 불신임안은 아무런 위협이 되지 않습니다. 우리는 내각의 충성을 확보할 것입니다."
 AST_castle_crumbling_mission: "붕괴되는 성"
 AST_castle_crumbling_mission_desc: "호주는 비극적인 캔버라 항공기 참사 이후 지도자들을 지켜보고 있습니다. 내각 관료들의 사망 이후에도 현 정부는 국민의 신뢰를 유지할 수 있을까요? 아니면 지도부 교체가 최선의 선택일까요?"
 AST_castle_crumbling_mission_event_tt: "§Y사건의 효과:§!"
 AST_castle_crumbling_mission_complete_tt: "§Y붕괴되는 성§! 임무 완료"
 AST_cabinet_trust_complete_1_flag: "결정 선택함: §Y공동의 적 만들기§!"
 AST_cabinet_trust_complete_2_flag: "결정 선택함: §Y내각의 충성 확보§!"
 AST_cabinet_trust_complete_not_tt: "§Y호주 제일주의§! 중점을 선택하지 않음"
 AST_canberra_air_disaster_flag: "$AST_canberra_air_disaster_events.1.t$"
 AST_war_angst_cat: "전쟁 불안감"
 AST_deteriorating_prime_minister_nerves_mission: "총리의 신경 악화"
 AST_deteriorating_prime_minister_nerves_desc: "[AST.GetLeader](은)는 피할 수 없는 전쟁의 압박감에 시달리고 있습니다. 조속히 안정을 찾지 못하면, 그의 정신이 버티지 못할지도 모릅니다."
 AST_australian_demands_cat: "호주의 요구"
 AST_aid_australian_military_construction: "호주의 군수 건설 지원"
 AST_aid_australian_military_construction_desc: "영국은 전쟁 준비가 되어 있지 않습니다. 군수 건설로 호주를 지원함으로써 그들의 조바심을 누그러뜨릴 수 있을 것입니다."
 AST_japanese_war_mission: "일본 전쟁"
 AST_japanese_war_mission_desc: "호주는 압도적인 [JAP.GetNameDef](와)과 홀로 맞서기를 원하지 않습니다. 그들은 우리가 먼저 나서서 다가오는 분쟁을 최대한 빨리 해결하도록 압박하고 있습니다."
 AST_resource_acquisition_cat: "자원 확보"
