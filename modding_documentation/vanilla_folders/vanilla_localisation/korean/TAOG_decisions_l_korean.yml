 AST_foreign_overlord_reclaim_foothold_in_target_mission_tt: "우리 또는 [?FROM.AST_communist_civil_war_enemy_country.GetName](이)가 [FROM.GetName]의 어떤 지역도 지배하지 못할 경우:"
 AST_push_foreign_overlord_out_of_target: "[?FROM.AST_communist_civil_war_enemy_country.GetName](을)를 [FROM.GetName] 밖으로 몰아내기"
 AST_push_foreign_overlord_out_of_target_tt: "[FROM.GetName](이)가 [?FROM.AST_communist_civil_war_enemy_country.GetName] 및 그 동맹을 완전히 몰아낸 경우:"
