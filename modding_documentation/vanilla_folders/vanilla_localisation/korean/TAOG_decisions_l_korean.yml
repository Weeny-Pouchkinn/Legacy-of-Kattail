 AST_communism_support_text: "[?party_popularity_100@communism|Y]% 공산주의자 지원"
 AST_union_control_1_cat: "노동조합 통제"
 AST_union_control_1_cat_desc: "우리 노동조합원들은 호주 전역에서 일반 대중의 지지를 얻기 위한 활동을 시작했습니다. 우리는 각 주의 의회에 침투하여 내부에서부터 공산주의자가 주도하는 정부에 대한 지지를 구축할 수 있습니다. 이는 상당한 정치력을 소모하며 국가 안정도를 위협할 수 있습니다. \n\n뉴 가드 베테랑은 우리의 움직임을 주시하고 있습니다. 정부가 제때 조치를 취하지 않거나 국가가 지나치게 불안정해지면, 이 갈등이 국가를 완전히 분열시킬 수 있습니다.\n\n공산주의 지지도: [?party_popularity_100@communism|Y]§Y%§!\n\n§R안정도가 40% 미만으로 떨어지거나, 베테랑들의 반란 시한이 만료되면 내전이 발발합니다.§!"
 AST_union_control_1_cat_name: "노동조합을 자극하도록 지원할 곳을 선택"
 AST_union_control_1_map_area_name: "아직 영향받을 수 있는 주"
 AST_nationalizing_cat: "국유화"
 AST_union_control_2_cat: "노동조합 통제"
 AST_union_control_2_cat_desc: "[ROOT.GetNonIdeologyName]의 노동자들이 압제자들을 타도한 것은, 제국주의 열강이 해외의 동지들을 계속 사슬에 묶어 두는 모습을 지켜보기 위해서가 아닙니다. 공산주의를 국경 너머로 전파하는 것은 단순한 이념적 목표가 아니라 전략적 필수 과제입니다. 우리는 혁명의 불길을 바다 건너까지 확산시켜 제국주의의 멍에를 벗어 던지고자 하는 이들에게 희망과 자원을 제공하여, 결국은 과거의 질서가 설 자리가 없게 해야 합니다."
 AST_union_control_2_foreign_cat: "공산주의 진압"
 AST_union_control_tt: "노동조합들이 호주 전역의 각 주에 자리를 잡아야 하지만, 뉴 가드 베테랑은 공산주의 확산을 저지하기 위해 노력하고 있습니다."
 AST_seize_local_leadership_in_state_major: "[FROM.GetName]에서 현지 지도력 장악"
 AST_seize_local_leadership_in_state_mid: "[FROM.GetName]에서 현지 지도력 장악"
 AST_seize_local_leadership_in_state_low: "[FROM.GetName]에서 현지 지도력 장악"
 AST_seize_local_leadership_in_queensland: "퀸즐랜드에서 현지 지도력 장악"
 AST_union_strike: "파업 조직"
 AST_union_strike_desc: "우리 노동자들이 더 나은 근무 조건과 권리를 요구하며 파업에 들어갔습니다. 이는 정부가 새로운 개혁을 시행하도록 압력을 가할 것입니다."
 AST_veterans_revolt: "베테랑들의 반란"
 AST_veterans_revolt_desc: "군 내부에는 반공주의자가 많고, 그중 상당수는 이전에 파시스트 단체에 소속되어 있던 사람들입니다. 그들은 공산주의를 경멸하며, 공산주의가 권력을 잡는 것을 막기 위해 무기를 들 것입니다.\n우리가 혁명을 이루는 데 너무 오랜 시간이 걸리거나 안정도가 너무 낮아지도록 놓아둔다면, 그들은 혁명을 막기 위해 직접 나설 것입니다."
 AST_organize_in_nation: "§Y[FROM.GetName]§!의 노동조합에 침투"
 AST_organize_in_nation_desc: "노동 운동에는 국경이 없습니다. 우리 동지들의 연결망에 자원을 집중함으로써, 우리는 [FROM.GetName]의 노동조합 내부에 공산주의 조직자들을 심어놓고 노동 계급 내부에서의 혁명에 대한 민중의 지지를 구축할 수 있습니다."
 AST_civil_war_in_nation: "§Y[FROM.GetName]§!에서 혁명 조장"
 AST_civil_war_in_nation_desc: "우리가 뿌린 씨앗이 열매를 맺을 준비가 되었습니다. [FROM.GetName]에서 공산주의에 대한 지지도가 증가하여, 공공연한 혁명이 눈앞에 다가왔습니다. 자금과 선동가, 그리고 시기적절한 선동이 있다면 민중의 불만을 무장봉기로 전환하여, [FROM.GetName](을)를 마땅히 건설해야 할 노동자 국가에 한 걸음 더 가까이 다가가게 할 수 있습니다."
 AST_take_it_to_foreign_streets: "국제 노동자 연대 행진을 조직"
 AST_take_it_to_foreign_streets_desc: "노동자에게는 국경이 없습니다. 우리는 국제적인 공동 캠페인을 전개해, 이미 우리의 영향력이 닿고 있는 모든 국가의 거리로 호주 공산주의 조직자들을 파견하고, 지역 운동을 다시 활성화하며, 혁명의 불꽃을 계속 타오르게 할 것입니다."
 AST_take_it_to_foreign_streets_tt: "현재 침투 중인 모든 국가에서 '타국의 공산주의 영향력'의 지속 기간을 60일 연장합니다."
 AST_raj_locked_tt: "영국령 인도는 뉴질랜드, 말라야, 버마, 필리핀 및 인도네시아가 모두 공산주의의 통치 아래 들어가기 전까지 표적이 되지 않습니다."
 AST_supply_arms_to_nation: "§Y[FROM.GetName]§!에 무기 공급"
 AST_supply_arms_to_nation_desc: "우리는 동지들에게 무기를 공급할 것입니다."
 AST_strikes_tt: "파업이 진행 중일 때는 §Y$AST_workers_educational_association$§!, §Y$AST_off_leash$§!, §Y$AST_a_national_housing_commission$§!, §Y$AST_guaranteed_employment$§!, §Y$AST_equal_pay$§!만 완료할 수 있습니다."
 AST_nationalization: "국유화 개시"
 AST_nationalizing_process_tt: "§Y국유화 개시§! 결정을 활성화하고 §Y국유화 진행 중§!을 적용합니다. 이는 아래 중점에 필요하며 §Y대중의 오스트레일리아§!를 완료하면 제거됩니다. §R선택하지 않은 중점은 이때 잠깁니다!§!"
 AST_nationalization_underway_tt: "§Y국유화 진행 중§! \n공장 생산량: §R-30%§! \n조선소 생산량: §R-30%§!"
 AST_nationalizing_process_ends_tt: "§R이 중점을 택하면 위의 모든 중점들이 잠깁니다!§!"
 AST_union_infiltration_in_progress: "외국 노동조합 침투 진행 중"
 AST_cw_operation_in_progress: "현재 혁명을 선동 중"
 AST_seize_local_control_tt: "공산주의자가 해당 주의 통제권을 장악하여, 내전이 발생할 경우 우리 편에 설 것을 보장합니다.\n"
 AST_peace_out_all_wars_tt: "[THIS.GetName](이)가 현재의 모든 전쟁에서 퇴장합니다."
