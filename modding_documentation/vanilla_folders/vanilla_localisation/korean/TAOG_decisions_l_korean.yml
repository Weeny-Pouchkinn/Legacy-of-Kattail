 SIA_poster_center_days_remaining_text: "§Y[?SIA_propaganda_center_days_remaining_flag:days_left|Y0]§!일 남음"
 SIA_poster_right_days_remaining_text: "§Y[?SIA_propaganda_right_days_remaining_flag:days_left|Y0]§!일 남음"
 SIA_propaganda_campaign_cooldown_tt: "이 선전 활동은 종료되고 §Y[?constant:propaganda.SIA.default_propaganda_campaign_cooldown]일§! 후 다시 사용할 수 있습니다."
 SIA_public_credit_repayment: "공공 신용 상환"
 SIA_public_credit_repayment_tt: "우리는 막대한 일시적 §Y소비재§! 불이익을 감수하고 우리의 모든 공공 신용 부채를 한 번에 상환하여 모든 부채를 제거할 것입니다."
 idea_SIA_deficit_spending: "적자 지출"
 idea_SIA_deficit_spending_desc: "정부는 수입 이상의 지출을 하고 있으며, 빌려온 자금을 가속화된 건설 프로그램에 투입하고 있습니다. 산업적 성과는 분명히 있지만, 언젠가 그 비용을 지불해야 할 것입니다."
 SIA_print_additional_money: "화폐 추가 발행"
 SIA_print_additional_money_tt: "우리는 일본을 위하여 화폐를 추가로 발행할 것입니다."
 SIA_appeal_to_industrialists: "산업가들에게 호소"
 SIA_implement_industrialists_reforms_countdown: "산업가 개혁 시행"
 SIA_implement_industrialists_reforms_countdown_trigger: "§Y민간공장 2개§! 건설(중점 및 무역을 통해 획득한 공장은 제외)"
 SIA_appeal_to_industrialists_tt: "우리는 산업가들의 지원을 얻을 것입니다.\n\n그들은 내전에서 우리를 돕기 위해 추가 장비를 제공할 것입니다. 하지만 그 대가로 그들은 산업 기반을 확장할 것을 요구할 것입니다. 내전 종료 시점에 보유하고 있는 공장에 더해 §Y2§!개의 §Y민간공장§!을 추가로 건설해야 하며, 기한은 우리가 권력을 획득한 후 §Y720일§! 이내입니다(중점 및 무역을 통해 획득한 공장은 제외). \n\n이 조건을 이행하지 않으면 §Y안정도§! 및 §Y전쟁 지지도§!가 하락할 것입니다.\n\n내전이 시작되면 우리는 다음을 얻습니다: "
 SIA_seek_support_from_constitutional_monarchists: "입헌군주주의파의 지원 모색"
 SIA_implement_constitutionalist_reforms_countdown: "입헌파 개혁 시행"
 SIA_seek_support_from_constitutional_monarchists_tt: "우리는 입헌군주주의파의 지원을 얻을 것입니다.\n\n그들은 내전에서 우리를 돕기 위해 추가 사단을 창설할 것입니다. 하지만 그 대가로 그들은 입헌군주제 유지를 요구할 것입니다. §Y$SIA_a_constitutional_monarchy$§! 중점을 우리가 권력을 획득한 후 §Y720일§! 이내에 완료해야 합니다.\n\n이 조건을 이행하지 않으면 §Y안정도§! 및 §Y전쟁 지지도§!가 하락할 것입니다."
 SIA_appeal_to_rural_people: "농촌 인구에 호소"
 SIA_appeal_to_rural_people_tt: "우리는 농촌 인구의 지원을 얻을 것입니다.\n\n그들은 내전에서 우리를 돕기 위해 민병대를 제공할 것입니다. 하지만 그 대가로 그들은 그들에게 이익이 되는 농업 정책을 요구할 것입니다. §Y$SIA_mechanization_of_agriculture$§! 또는 §Y$SIA_reduction_of_agricultural_yield_taxes$§! 중점을 우리가 권력을 획득한 후 §Y720일§! 이내에 완료해야 합니다.\n\n이 조건을 이행하지 않으면 §Y안정도§! 및 §Y전쟁 지지도§!가 하락할 것입니다.\n\n내전이 시작되면 우리는 다음을 얻습니다: "
 SIA_implement_rural_reforms_countdown: "농촌 개혁 시행"
 SIA_implement_absolutist_reforms_countdown: "전제주의자 개혁 시행"
 SIA_seek_support_from_absolutists_monarchists: "전제군주주의파의 지원 모색"
 SIA_seek_support_from_absolutists_monarchists_tt: "우리는 전제군주주의파의 지원을 얻을 것입니다.\n\n그들은 내전에서 우리를 돕기 위해 추가 사단을 창설할 것입니다. 하지만 그 대가로 그들은 전제군주정으로의 회귀를 요구할 것입니다. §Y$SIA_an_absolute_monarchy$§! 중점을 우리가 권력을 획득한 후 §Y720일§! 이내에 완료해야 합니다.\n\n이 조건을 이행하지 않으면 §Y안정도§! 및 §Y전쟁 지지도§!가 하락할 것입니다."
 SIA_appeal_to_navy_clique: "해군 파벌에 호소"
 SIA_appeal_to_navy_clique_countdown: "해군 개혁 시행"
 SIA_appeal_to_navy_clique_tt: "우리는 해군 파벌의 지원을 얻을 것입니다.\n\n그들은 내전에서 우리를 돕기 위해 해군 전체와 1개 해병 사단을 제공할 것입니다. 하지만 그들은 그들에게 이익이 되는 해군 정책을 요구할 것입니다. §Y$SIA_thonburi_class_coastal_defense_ship$§! 중점을 우리가 권력을 획득한 후 §Y720일§! 이내에 완료해야 합니다.\n\n이 조건을 이행하지 않으면 §Y안정도§! 및 §Y전쟁 지지도§!가 하락할 것입니다.\n\n내전이 시작되면 우리는 다음을 얻습니다:\n§Y우리 해군 전체§!\n§Y태국 왕립 해병대§! 해병 사단\n§Y해병대§! 기술"
 SIA_appeal_for_support_cat: "지지 호소"
 SIA_appeal_for_support_cat_desc: "정치 운동은 혼자서는 성공할 수 없습니다. 군주주의자, 입헌주의자, 군인, 그리고 민간인이 저마다 나라의 한 부분에서 영향력을 쥐고 있습니다. 때가 왔을 때 우리가 행동할 힘을 얻으려면 이들의 지지를 신중하게 확보해야 합니다."
 SIA_demand_independence: "§Y[FROM.OVERLORD.GetNameDef]§!(으)로부터의 §Y[FROM.GetName]§! 독립 요구"
 SIA_demand_independence_VIN: "§Y[VIN.GetName]§!의 해방 요구"
 SIA_demand_independence_VIN_tt: "우리는 [VIN.GetName]의 지배국들에 그들의 해방을 요구할 것입니다."
 SIA_demand_independence_LAO: "§Y[LAO.GetName]§!의 해방 요구"
 SIA_demand_independence_LAO_tt: "우리는 [LAO.GetName]의 지배국들에 그들의 해방을 요구할 것입니다."
 SIA_demand_independence_CAM: "§Y[CAM.GetName]§!의 해방 요구"
 SIA_demand_independence_CAM_tt: "우리는 [CAM.GetName]의 지배국들에 그들의 해방을 요구할 것입니다."
 SIA_invite_to_adc: "우리 세력에 §Y[FROM.GetName]§! 초청"
 SIA_asian_democratic_compact_cat: "아시아 민주주의 협정"
 SIA_asian_democratic_compact_cat_desc: "아시아의 민족들은 자치를 할 권리가 있습니다. 아시아 민족 자결권의 대표로서, 우리는 식민 열강들이 지배하고 있는 국가들을 해방하도록 압력을 가할 수 있습니다."
 SIA_khana_ratsadon_cat: "인민당"
 SIA_khana_ratsadon_cat_desc: "전제군주정을 종식시킨 인민당, 카나 라차돈은 결코 한 덩어리가 아닙니다. 군부 세력과 민간 세력은 각기 다른 국가 비전을 갖고 있으며, 모든 결정의 이면에 이들 사이의 긴장감이 깔려 있습니다. 두 세력 모두를 만족시키지 못하면 연합이 분열될 위험에 처할 수 있습니다."
 SIA_army_navy_reform_cat: "육군 및 해군"
 SIA_army_navy_reform_cat_desc: "육군과 해군은 제한된 자원을 놓고 경쟁하고 있습니다. 두 군종 간의 자금 배분은 끊임없는 균형 맞추기 작업이며, 한쪽에 재할당할 때마다 다른 군의 준비 태세에 영향을 미칩니다."
 SIA_divert_army_funds_to_navy_toggle: "[SIA_GetDivertingArmyFundsToNavyTitle]"
 SIA_divert_army_funds_to_navy_toggle_tt: "[SIA_GetDivertingArmyFundsToNavyTT]"
 SIA_divert_army_funds_to_navy_toggle_do: "육군 자금을 해군에 전환"
 SIA_divert_army_funds_to_navy_toggle_do_tt: "해군 발전을 앞당기기 위해 육군 자금 일부를 해군에 전환할 것입니다."
 SIA_divert_army_funds_to_navy_toggle_undo: "육군 자금의 해군 전환 중지"
 SIA_divert_army_funds_to_navy_toggle_undo_tt: "더 이상 육군 자금 일부를 해군에 전환하지 않을 것입니다."
 SIA_standing_our_ground_mission: "입장 고수하기"
 SIA_standing_our_ground_mission_tt: "우리는 자유를 위해 싸울 것입니다."
 SIA_sway_generals_to_seri_thai_tt: "우리가 자유 타이 운동 편으로 설득한 장군들은, 내전이 시작되면 충성파의 반란에 가담하는 대신 우리 편에 가담할 것입니다."
 SIA_sway_general_cw_scale_tt: "내전에서 우리에 대한 지지도를 §Y5%§! 증가시킵니다.\n지지도가 §Y80%§!를 넘으면 내전이 일어나지 않으며 저항 없이 권력을 장악할 수 있습니다."
 SIA_sway_luang_chawengsaksongkhram_to_seri_thai: "루앙 차웬삭송크람 설득"
 SIA_sway_luang_chawengsaksongkhram_to_seri_thai_desc: "루앙 차웬삭송크람을 자유 타이 운동의 대의로 끌어들입니다. 설득에 성공하면 그는 내전이 시작될 때 우리 편에 설 것입니다."
 SIA_sway_aditya_dibabha_to_seri_thai: "아디티야 디바바 설득"
 SIA_sway_aditya_dibabha_to_seri_thai_desc: "아디티야 디바바를 자유 타이 운동의 대의로 끌어들입니다. 설득에 성공하면 그는 내전이 시작될 때 우리 편에 설 것입니다."
 SIA_sway_mangkorn_phromyothi_to_seri_thai: "망콘 프로미오티 설득"
 SIA_sway_mangkorn_phromyothi_to_seri_thai_desc: "망콘 프로미오티를 자유 타이 운동의 대의로 끌어들입니다. 설득에 성공하면 그는 내전이 시작될 때 우리 편에 설 것입니다."
 SIA_sway_luang_haansongkhram_to_seri_thai: "루앙 한송크람 설득"
 SIA_sway_luang_haansongkhram_to_seri_thai_desc: "루앙 한송크람을 자유 타이 운동의 대의로 끌어들입니다. 설득에 성공하면 그는 내전이 시작될 때 우리 편에 설 것입니다."
 SIA_sway_charun_rattanakun_seriroengrit_to_seri_thai: "차룬 라타나쿤 세리로엔그릿 설득"
 SIA_sway_charun_rattanakun_seriroengrit_to_seri_thai_desc: "차룬 라타나쿤 세리로엔그릿을 자유 타이 운동의 대의로 끌어들입니다. 설득에 성공하면 그는 내전이 시작될 때 우리 편에 설 것입니다."
 SIA_sway_phichit_kriangsakphichit_to_seri_thai: "피칫 크랑삭피칫 설득"
 SIA_sway_phichit_kriangsakphichit_to_seri_thai_desc: "피칫 크랑삭피칫을 자유 타이 운동의 대의로 끌어들입니다. 설득에 성공하면 그는 내전이 시작될 때 우리 편에 설 것입니다."
 SIA_sway_jira_wichitsongkhram_to_seri_thai: "지라 위칫송크람 설득"
 SIA_sway_jira_wichitsongkhram_to_seri_thai_desc: "지라 위칫송크람을 자유 타이 운동의 대의로 끌어들입니다. 설득에 성공하면 그는 내전이 시작될 때 우리 편에 설 것입니다."
 SIA_sway_phin_choonhavan_to_seri_thai: "핀 춘하완 설득"
 SIA_sway_phin_choonhavan_to_seri_thai_desc: "핀 춘하완을 자유 타이 운동의 대의로 끌어들입니다. 설득에 성공하면 그는 내전이 시작될 때 우리 편에 설 것입니다."
 SIA_sway_tiang_sirikhan_to_seri_thai: "티앙 시리칸 설득"
 SIA_sway_tiang_sirikhan_to_seri_thai_desc: "티앙 시리칸을 자유 타이 운동의 대의로 끌어들입니다. 설득에 성공하면 그는 내전이 시작될 때 우리 편에 설 것입니다."
 SIA_khana_ratsadon_dummy_military: "군사 쿠데타의 위험"
 SIA_khana_ratsadon_dummy_military_tt: "군부를 너무 적대시하면 쿠데타가 일어날 것입니다. 내전을 피하려면 너무 오랫동안 §Y$idea_SIA_military_rebellious$§!(을)를 보유해서는 안 됩니다."
 SIA_khana_ratsadon_dummy_military_desc: "군부는 인민당 내에서 막강한 영향력을 가진 파벌입니다. 그들은 자신들의 이익에 반한다고 여겨지는 정책은 용납하지 않지만, 국가를 친군사화한다고 여겨지는 정책은 찬성할 것입니다."
 SIA_khana_ratsadon_military_coup_mission: "군부의 현 정부 축출 계획!"
 SIA_khana_ratsadon_military_coup_mission_desc: "군부는 현재의 정부 정책을 자신들의 이익에 대한 위협으로 보고 있습니다. 그들은 자신들의 입지가 강화되지 않을 경우 정부를 전복시키기 위한 계획을 적극적으로 세우고 있습니다."
 SIA_khana_ratsadon_dummy_civilian: "민간 세력 쿠데타의 위험"
 SIA_khana_ratsadon_dummy_civilian_tt: "민간 세력을 너무 적대시하면 쿠데타가 일어날 것입니다. 내전을 피하려면 너무 오랫동안 §Y$idea_SIA_civilian_rebellious$§!(을)를 보유해서는 안 됩니다."
 SIA_khana_ratsadon_dummy_civilian_desc: "민간 세력은 인민당 내에서 막강한 영향력을 가진 파벌입니다. 그들은 자신들의 이익에 반한다고 여겨지는 정책은 용납하지 않지만, 친민주주의적, 친민간인적이라고 여겨지는 정책은 찬성할 것입니다."
 SIA_khana_ratsadon_civilian_coup_mission: "민간 세력의 현 정부 축출 계획!"
 SIA_khana_ratsadon_civilian_coup_mission_desc: "민간 세력은 현재의 정부 정책을 자신들의 이익에 대한 위협으로 보고 있습니다. 그들은 자신들의 입지가 강화되지 않을 경우 정부를 전복시키기 위한 계획을 적극적으로 세우고 있습니다."
 SIA_promote_civilian_wing: "민간 세력 지지 확보"
 SIA_promote_civilian_wing_desc: "토지개혁, 사법부, 헌법이라는 민간 세력의 의제에 정부의 무게를 실어 주면 쁘리디 파벌의 호의를 얻을 수 있습니다. 하지만, 이 같은 편애가 군부의 눈에 띄지 않을 리 없습니다. 장교단은 불만을 품을 것이고, 여파가 가라앉을 때까지 일반 행정의 혼란이라는 큰 대가로 돌아올 것입니다."
 SIA_promote_military_wing: "군부 세력 지지 확보"
 SIA_promote_military_wing_desc: "장교들의 요구를 들어주고 군대의 힘을 과시하면 피분 파벌의 호의를 얻을 수 있습니다. 그러나 이런 편애가 눈에 띄지 않을 리 없습니다. 군의 일상 업무는 재편 과정에서 어지러워질 것이며, 여파가 가라앉을 때까지 일반 행정의 혼란이라는 큰 대가로 돌아올 것입니다. 이는 반란 직전의 분파를 끌어내기 위한 거친 수단에 불과합니다."
 SIA_cultivate_civilian_wing: "민간 세력 포섭"
 SIA_cultivate_civilian_wing_desc: "왕실 사무국 지침으로 기득권층에서 얻은 입지는, 민간 세력을 꾸준하고 인내심 있게 포섭할 길을 열어 주었습니다. 반감을 살 만한 급격한 편애가 아니라, 쁘리디 파벌을 한 걸음씩 설득해 나가는 느리지만 안정적인 과정입니다. 먼 길이지만, 원하는 만큼 걸어갈 수 있는 길입니다."
 SIA_cultivate_military_wing: "군부 세력 포섭"
 SIA_cultivate_military_wing_desc: "왕실 사무국 지침으로 기득권층에서 얻은 입지는, 군부 세력을 꾸준하고 인내심 있게 포섭할 길을 열어 주었습니다. 반감을 살 만한 급격한 편애가 아니라, 장교단을 한 걸음씩 설득해 나가는 느리지만 안정적인 과정입니다. 먼 길이지만, 원하는 만큼 걸어갈 수 있는 길입니다."
 SIA_end_factionalism_mission: "연합 유지"
 SIA_end_factionalism_mission_desc: "인민당의 두 분파 모두 정부를 전적으로 지지하고 있습니다. 양측을 §Y270§!일 동안 §G전적인 지지§! 상태로 유지할 수 있다면, 그들의 경쟁을 영원히 종식시킬 수 있습니다. 어느 한쪽이라도 열의가 흔들린다면, 이 작업은 다시 처음부터 시작해야 합니다."
