 AST_demand_central_africa: "중앙아프리카 요구"
 AST_demand_southwestern_territories: "남서부 영토 요구"
 AST_vichy_req_ongoing_flag: "영토 요청 §Y진행 중§!"
 AST_remove_vichy_out_of_africa_decisions: "\n§Y비시의 탈아프리카§! 결정을 제거합니다.\n"
 AST_big_business_pact_cat: "대기업 협약"
 AST_big_business_request_ongoing_flag: "대기업 요청 §Y진행 중§!"
 AST_naval_expansion: "$NOR_alt_dem_naval_expansion$"
 AST_naval_expansion_desc: "주요 재계 인사들은 자신들에게 이익이 되는 정책을 추진하는 대가로 [ROOT.GetFascistParty]의 목표에 부합하는 산업 개혁에 투자하기로 합의했습니다.\n\n[AST.GetName](이)가 더 강한 해군력을 가진 적에게 맞서기 위해서는 함대를 확장해야 합니다. 일시적으로 모든 인력을 조선소에 투입하여 함선 생산량을 늘려야 합니다."
 AST_factory_conversions: "공장 전환"
 AST_factory_conversions_desc: "주요 재계 인사들은 자신들에게 이익이 되는 정책을 추진하는 대가로 [ROOT.GetFascistParty]의 목표에 부합하는 산업 개혁에 투자하기로 합의했습니다.\n\n방위 산업을 우선시해야 하며, 따라서 호주 공장들은 이를 지원하도록 전환되어야 합니다."
 AST_land_development: "토지 개발"
 AST_land_development_desc: "주요 재계 인사들은 자신들에게 이익이 되는 정책을 추진하는 대가로 [ROOT.GetFascistParty]의 목표에 부합하는 산업 개혁에 투자하기로 합의했습니다.\n\n[ROOT.GetName] 영토의 상당 부분이 산업화되지 않고 낙후되어 있습니다. 우리는 이러한 지역을 개발하여 건설에 적합하도록 만들 것입니다."
 AST_electrical_grid_expansions: "전력망 확장"
 AST_electrical_grid_expansions_desc: "주요 재계 인사들은 자신들에게 이익이 되는 정책을 추진하는 대가로 [ROOT.GetFascistParty]의 목표에 부합하는 산업 개혁에 투자하기로 합의했습니다.\n\n전력망을 확장함으로써 수입에 의존하지 않는 국내 에너지 생산을 촉진할 수 있습니다."
 AST_factory_investments: "공장 투자"
 AST_factory_investments_desc: "주요 재계 인사들은 자신들에게 이익이 되는 정책을 추진하는 대가로 [ROOT.GetFascistParty]의 목표에 부합하는 산업 개혁에 투자하기로 합의했습니다.\n\n분쟁 시에 군사 및 민간 물자 모두의 충분한 공급이 보장되도록 하려면 산업 생산 역량을 확대해야 합니다."
 AST_develop_port_kemla_steel_medium_decision: "포트 켐블라에 두 번째 용광로 건설"
 AST_develop_port_kemla_steel_medium_decision_desc: "포트 켐블라는 단 하나의 용광로로도 잘 운영되어 왔지만, 수요가 증가함에 따라 두 번째 용광로를 건설하는 것을 고려하고 있습니다. 이렇게 되면 이 지역의 강철 생산량이 대략 두 배로 늘어날 것입니다."
 AST_prospect_pilbara_iron_decision: "필바라 지역에 광산 개발"
 AST_prospect_pilbara_iron_decision_desc: "필바라 지역은 세계 최대 규모의 철광석 매장량을 보유하고 있습니다. 하지만 지역이 이처럼 외딴 위치에 있으므로, 이 자원 개발에 필요한 투자액은 막대할 것입니다... 하지만 그만큼 수익 또한 막대할 것입니다."
 AST_scale_up_pilbara_mines_steel_decision: "필바라 광산 확대"
 AST_scale_up_pilbara_mines_steel_decision_desc: "필바라 지역에 대규모 광산이 개발되었으니, 이제 투자가 활발하게 이루어지도록 할 때입니다!"
 AST_pilbara_mining_tt: "§Y$STATE_870$§!에 추가 탐광을 개방하면 강철 생산량을 늘리는 결정을 제한 없이 반복적으로 할 수 있게 될 것입니다."
 AST_scale_up_middleback_mines_steel_decision_1: "아이언 노브 광산 확장"
 AST_scale_up_middleback_mines_steel_decision_1_desc: "아이언 노브 광산은 오랫동안 운영되어 왔지만, 철광석 수요가 증가하고 있으므로 이제 이곳에서의 생산을 확대할 때입니다."
 AST_scale_up_middleback_mines_steel_decision_2: "아이언 모나크 광산 개장"
 AST_scale_up_middleback_mines_steel_decision_2_desc: "아이언 노브 광산으로는 우리 수요를 충족할 수 없습니다. 다행히 미들백 산맥에는 철이 많이 매장되어 있습니다. 이제 우리 소유의 최대 규모 광산을 건설할 때가 왔습니다!"
 AST_scale_up_middleback_mines_steel_decision_3: "아이언 프린스 광산 개장"
 AST_scale_up_middleback_mines_steel_decision_3_desc: "전쟁 중의 금속 수요는 사상 최고를 기록하고 있지만, 미들백 산맥은 계속해서 금속을 공급하고 있습니다."
 AST_expand_iron_mining_tt: "§Y$AST_exports_for_economic_recovery$§! 및 §Y$AST_within_reach$§!(을)를 모두 보유하게 되면 §Y$STATE_870$§!의 필바라 지역에서 채굴을 할 수 있게 되어 거의 무한에 가까운 §Y강철§!을 확보할 수 있습니다. 이를 통해 우리 경제를 활성화할 수 있습니다."
 AST_develop_port_kemla_steel_tt: "이를 통해 §Y포트 켐블라에 두 번째 용광로 건설§! 결정을 내릴 수 있게 되며, 이 결정은 우리의 §Y강철§! 생산량을 크게 증가시킬 것입니다."
 AST_develop_middleback_tt: "이를 통해 §Y$STATE_519$§!에서 §Y강철§! 생산을 개발하기 위한 세 가지 결정이 잠금 해제될 것입니다."
 AST_expand_planned_extraction_pilbara_tt: "§Y$AST_planned_extraction$§!(을)를 보유하게 되면 §Y$STATE_870$§!의 필바라 지역에서 채굴을 할 수 있게 되어 거의 무한에 가까운 §Y강철§!을 확보할 수 있습니다. 이를 통해 우리 경제를 활성화할 수 있습니다."
 AST_ireland_weapon_smuggling_cat: "아일랜드 무장시키기"
 AST_smuggle_arms_to_ireland: "아일랜드로 무기 밀수"
 AST_smuggle_arms_to_ireland_desc: "우리는 아일랜드에 영국과 싸우기 위해 필요한 무기를 공급해야 합니다."
 AST_smuggle_arms_to_ireland_ongoing_flag: "무기 밀수 §Y진행 중§!"
 AST_smuggle_arms_to_northern_ireland: "북아일랜드로 무기 밀수"
 AST_smuggle_arms_to_northern_ireland_desc: "만약 우리가 북아일랜드에 충분한 무기를 공급하고 북아일랜드와 아일랜드의 연결망을 잘 구축할 수 있다면, 영국이 개입하기 전에 북아일랜드가 아일랜드와 통일되도록 보장할 수 있을 것입니다."
 AST_northern_ireland_rises_up: "북아일랜드 봉기"
 AST_specialize_on_jungle_combat: "정글 전투 전문화"
 AST_specialize_on_desert_combat: "사막 전투 전문화"
 AST_switch_combat_specialization: "전투 전문화 변경"
 AST_special_forces_cat: "특수부대 훈련"
 AST_you_can_switch_sf: "전문화를 변경할 수 있게 됩니다."
 AST_training_camps_specialization: "우리 훈련소는 다양한 전장에서 우리 군인들이 더욱 효과적으로 임무를 수행할 수 있도록 특수한 훈련을 제공할 준비가 되어 있습니다."
