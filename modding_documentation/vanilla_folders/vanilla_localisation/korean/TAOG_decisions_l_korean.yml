 AST_summons_to_australian_hall_upgrade_desc: "$AST_summons_to_australian_hall_desc$"
 AST_print_the_publicist: "퍼블리시스트 발행"
 AST_print_the_publicist_desc: "호주 제일주의 운동 소식지인 '퍼블리시스트'는 잠재적 지지자들에게 다가가는 데 중요한 역할을 합니다. 다음 호를 발행함으로써 우리의 메시지를 전파할 수 있습니다."
 AST_print_the_publicist_upgrade: "$AST_print_the_publicist$"
 AST_print_the_publicist_upgrade_desc: "$AST_print_the_publicist_desc$"
 AST_call_on_fascists: "[GET_AST_CALL_ON_FASCISTS]"
 AST_call_on_fascists_desc: "지지자가 적은 소규모 운동 단체인 호주 제일주의 운동은, 언제나 재정이 넉넉한 편은 아닙니다. 하지만 비슷한 이념을 가진 해외 단체가 우리의 목표를 지원하기 위한 자금 지원 의사를 보여주었고, 이는 우리의 지속적인 전진을 보장하는 해결책이 될 것입니다."
 AST_call_on_japanese_fascists: "일본 파시스트들에게 지원 요청"
 AST_call_on_foreign_fascists: "외국 파시스트들에게 지원 요청"
 AST_a_convenient_disaster: "유리한 참사"
 AST_a_convenient_disaster_desc: "호주 제일주의가 인기를 얻긴 했지만, 보수파는 항상 이 단체의 이념에 저항할 것입니다. 호주제일당이 정권을 잡기 위해서는 정기적인 선거보다 더 극적인 사건, 즉 정부를 혼란에 빠뜨릴 만한 사건이 필요할지도 모릅니다.\n\n우리 운동은 자체적으로는 그러한 사태를 야기할 능력이 없지만, 우리를 지지하는 외국 파시스트 세력은 그렇지 않습니다. 그들은 우리의 권력 장악을 도움으로써, [AST.GetName]에서 친구를 찾을 수 있을 것입니다."
 AST_a_convenient_disaster_tt: "\n이 사건은 현 정부를 혼란에 빠뜨리고, 최종적으로는 §Y[AST.GetFascistParty]§!이 집권 정당이 되도록 할 것입니다."
 AST_a_convenient_disaster_flag: "§Y캔버라 항공 참사§!가 §Y유리한 참사§! 결정을 통해 발생했습니다."
 AST_insufficient_funds_mission: "$AST_insufficient_funds$"
 AST_sufficient_funds_tt: "충분한 자금(§Y[?AST_insufficient_funds:days_left]§!일 후 도달)"
 AST_sufficient_funds_tt_2: "충분한 자금 §G획득§!"
