l_korean:
 HOL_recall_conrad_helfrich: "콘라트 헬프리흐를 동인도에서 소환"
 HOL_recall_conrad_helfrich_desc: "이처럼 위급한 시기에 우리는 무엇보다 조국을 우선시해야 합니다. 네덜란드 왕립해군 최고의 제독인 콘라트 헬프리흐는 네덜란드로 귀환해야 합니다."
 INS_is_taking_volksraad: "현재 인민참사회에서 법안 통과 중"
 INS_volksraad_cat: "인민참사회"
 INS_volksraad_cat_desc: "네덜란드어로 '폴크스라드'라고 불리는 인민참사회는 이른바 \"윤리 정책\"의 이행의 일환으로서, 동인도 제도에 민주주의를 도입하려는 시도로 1918년에 설립되었습니다. 의석은 다양한 수단을 통해 선출된 네덜란드인과 인도네시아인 관료들로 구성됩니다. 네덜란드는 무조건적인 거부권을 유지하지만, 인민참사회는 결의안과 법안을 의결해 정부에 제출할 수 있습니다."
 INS_volksraad_allow_language_in_schools: "학교에서의 인도네시아어 허용"
 INS_volksraad_allow_language_in_schools_desc: "동인도 제도에서 고등 교육을 받을 수 있는 기회는 주로 네덜란드인과, 네덜란드어를 구사하는 부유한 인도네시아인 계층으로 제한되어 있는데, 이는 고등 교육이 네덜란드어로만 진행되기 때문입니다. 인도네시아어를 사용하는 학교 개설을 위한 안건이 인민참사회에 상정되어 있으며, 총독의 결정을 기다리고 있습니다."
 INS_volksraad_allow_language_in_government: "정부에서의 인도네시아어 허용"
 INS_volksraad_allow_language_in_government_desc: "인민참사회를 포함한 동인도 제도에서의 모든 정부 직책은 네덜란드어 구사 능력을 요구하는데, 이로 인해 인민참사회 의원들, 특히 원주민 공동체 대표들은 이것이 민주주의에 맞는 현실인지 의문을 제기해 왔습니다. 이에 그들은 가능한 경우 인도네시아어 구사자도 정부 직책을 맡을 수 있어야 한다는 내용의 결의안을 제출했습니다."
 INS_volksraad_remove_education_quotas: "교육 할당제 폐지"
 INS_volksraad_remove_education_quotas_desc: "현재 동인도 제도의 교육 체계는 일정 수의 인도네시아인 학생과 일정 수의 네덜란드인 학생을 의무적으로 받아들이는 교육 할당제를 운영하고 있습니다. 이 제도는 네덜란드인에게 불공정하게 치우쳐 있다는 인식 때문에 인민참사회에서 논란이 되어 왔습니다. 인민참사회가 이 제도를 어떻게 개혁할지 수년간 논쟁을 벌이도록 내버려둘 수도 있겠지만, 차라리 할당제 자체를 완전히 폐지하는 것이 더 나은 방안일지도 모릅니다."
 INS_volksraad_reduce_rubber_export_tax: "민간 고무 수출세 감면"
 INS_volksraad_reduce_rubber_export_tax_desc: "현재 민간 기업의 고무 수출에 매우 높은 세금이 부과되어 우리가 시장을 독점할 수 있습니다. 그러나 이로 인해 일부 지역에서는 민간 농장 운영이 어려워져 경제가 침체되는 결과를 초래했습니다. 이러한 세금은 도입 당시에는 타당하다고 여겨졌지만, 대공황 이후의 국제적인 보호무역주의로 인해 우리의 고무 수출 경제가 수익성이 크게 떨어졌습니다. 경제를 활성화하기 위해 세금을 인하하는 편이 나을지도 모릅니다."
 INS_volksraad_knil_rank_limit: "군 계급에 대한 차별 금지법 통과"
 INS_volksraad_knil_rank_limit_desc: "왕립 네덜란드령 동인도군에서 인도네시아 원주민의 진급을 막는 공식적인 규정은 없지만, 암묵적인 규칙이 존재하여 아무리 뛰어난 군인이라도 대령 이상으로 진급하지 못하고 있습니다. 이에 인민참사회의 여러 정당은 정부에 우수한 인도네시아인 장교들의 노력을 인정할 것을 요구하고 있습니다."
 INS_volksraad_legalize_displaying_flag: "적색/백색 깃발의 전시 합법화"
 INS_volksraad_legalize_displaying_flag_desc: "현재 \"인도네시아\"의 붉은색과 흰색 국기는 민족주의 및 반식민주의 단체와의 연관성 때문에 공공장소에 전시하는 것이 불법입니다. 국기 전시를 합법화하는 것은 우리의 협력 의지를 보여주는 동시에 인도네시아 전역에서 확산되고 있는 민족주의자들의 급진화를 막는 데 기여할 것입니다."
 INS_volksraad_education_subsidies_for_indonesians: "비네덜란드인 거주민을 위한 교육 보조금 허용"
 INS_volksraad_education_subsidies_for_indonesians_desc: "인민참사회 내에서는 동인도 제도의 네덜란드인 학생들에게 지급되는 보조금과 장학금에 대한 논쟁이 계속되고 있습니다. 인민참사회 내 현지 공동체 대표 몇몇은 이 제도를 출신 배경에 관계없이 모든 학생에게 확대해야 한다고 주장해 왔습니다. 이는 국민의 호감을 많이 얻겠지만, 비용이 많이 들 것입니다."
 INS_volksraad_indonesian_national_language: "인도네시아어를 국가의 공식 언어로 지정"
 INS_volksraad_indonesian_national_language_desc: "인도네시아어는 제도의 많은 지역에서 여러 문화 간의 언어 장벽을 허물며 공용어로 자리 잡았습니다. 교육 및 정부 분야에서 인도네시아어 사용이 허용됨에 따라, 많은 인민참사회 의원들이 인도네시아어를 네덜란드어와 동등한 지위를 가진 공식 언어로서 법적으로 인정해 줄 것을 청원하고 있습니다."
 INS_volksraad_official_flag: "인도네시아 국기 공식화"
 indonesia_volksraad_official_flag_effect_tt: "우리 국기가 적색/백색 깃발로 변경됩니다."
 INS_volksraad_official_flag_desc: "인민참사회에서 자치권을 요구하는 결의안이 결국 통과되어, 불과 몇 년 전까지만 해도 네덜란드령 동인도라고 불렸던 곳이 이제 인도네시아 자치령이 되었습니다. 우리 국기도 이러한 변화를 반영하여 조정되어야 합니다."
 indonesia_volksraad_passed_6: "군 내 차별 금지법이 통과됨"
 INS_autonomy_indonesian_in_schools: "학교에서 인도네시아어가 허용됨"
 INS_autonomy_indonesian_in_govenment: "정부에서 인도네시아어가 허용됨"
 INS_autonomy_no_education_quotas: "교육 할당제 폐지됨"
 INS_autonomy_reduced_rubber_tax: "고무 수출세 인하됨"
 INS_autonomy_knil_rank_limit: "군에서의 차별 금지법이 통과됨"
 INS_autonomy_flag_legalized: "적색/백색 깃발의 전시 합법화됨"
 INS_autonomy_education_subsidies: "인도네시아인을 위한 교육 보조금 실시 가능"
 INS_autonomy_national_language: "인도네시아어가 인정됨"
 INS_autonomy_official_flag: "인도네시아 국기 사용 중"
 INS_move_capital_to_amsterdam: "암스테르담으로 천도"
 INS_move_capital_to_batavia: "바타비아로 천도"
 INS_sukarno_is_dead: "수카르노 사망"
 INS_atjeh_management: "아체 내 치안 활동"
 INS_atjeh_management_2: "아체 통합"
 INS_soetardjo_petition: "승인 보류된 수타르조 청원"
 INS_soetardjo_petition_desc: "수타르조가 요청했던 원탁회의가 개최되었으며, 회의 결과 [INS.GetNameDef](은)는 자급자족을 보장하는 일련의 경제적 요구 사항을 충족해야 한다는 결론이 나왔습니다. 우리는 이러한 목표를 향한 뚜렷한 진전을 보여줘야 하며, 그렇지 않으면 [HOL.GetNameDef](은)는 결국 현상 유지를 위해 이 결정을 번복할 것입니다."
 INS_soetardjo_petition_refresh_tt: "임무 재활성화: §Y120일§! 기간의 §Y승인 보류된 수타르조 청원§!."
 INS_soetardjo_pending: "수타르조의 자치권 청원에 대해 논의 중인 인민참사회"
 INS_soetardjo_pending_desc: "수타르조는 평화적 민족주의 운동을 이끌어 온 것으로 유명한 인민참사회 의원입니다. 그는 현재 [INS.GetNameDef]에 더 많은 자치권을 부여하고, 네덜란드 연방의 구성원으로서 인도네시아가 자치권을 갖기를 바라는 열망을 논의하기 위해 네덜란드와 인도네시아 대표들의 원탁회의 개최를 요구하는 청원을 준비하고 있습니다. 이 청원은 현재 인민참사회에서 논의 중입니다. 논의가 끝나면 우리는 이에 어떻게 대응할지 결정해야 합니다. 이 청원이 가져올 파장은 매우 크기 때문입니다."
 INS_flag_legalized: "적색과 백색 깃발 전시는 합법입니다"
 INS_owned_states_at_game_start_tt: "인도네시아의 모든 주"
 INS_win_condition_base_republic_warning: "동인도 파괴"
 INS_win_condition_base_republic_warning_desc: "우리는 계속 싸우고, 민간인을 모집하며, 모든 인도네시아인의 영혼 속에 있는 불꽃이 꺼지지 않도록 해야 합니다. 동인도 정권을 무너뜨리면 [HOL.GetNameDef](은)는 항복할 수밖에 없을 것입니다."
 INS_win_condition_base_republic_real: "동인도 파괴"
 INS_win_condition_base_republic_real_desc: "우리는 계속 싸우고, 민간인을 모집하며, 모든 인도네시아인의 영혼 속에 있는 불꽃이 꺼지지 않도록 해야 합니다. 동인도 정권을 무너뜨리면 [HOL.GetNameDef](은)는 항복할 수밖에 없을 것입니다."
 will_complete_when_conditions_met_tt: "선행 조건이 충족되면 자동으로 선택됩니다."
 INS_militias_cat: "인민 민병대"
 INS_militias_basic_summon: "민간인 동원"
 INS_militias_basic_summon_desc: "우리는 인도네시아 독립을 열망하는 가진 청년들과 학생들을 모집하여 인민안전군의 무장 민병대로 참여시킬 것입니다."
 INS_militias_kris_repayment: "술라웨시에 투자를 요구하는 KRIS 민병대"
 INS_militias_di_mission: "대표를 요구하는 다룰 이슬람"
 INS_militias_jakarta_pemuda_mission: "교육 개선을 요구하는 자카르타 청년들"
 INS_militias_railway_pemuda_mission: "전투를 요구하는 철도 청년군"
 INS_revolution_planning_cat: "지하 혁명"
 INS_revolution_planning_hq: "[FROM.GetName] 내 혁명 본부 설립"
 INS_revolution_planning_hq_desc: "우리는 [FROM.GetName]에 민병대 본부를 설립하여, 이 본부가 제도 전역의 민병대 기지를 지휘하는 중앙 사령부 역할을 하도록 할 것입니다. 본부와 그 주변 지역은 침투 임무에서 최우선 순위가 될 것이며, 우리의 확고한 통제 아래 놓일 것입니다."
 INS_revolution_planning_hq_tt: "최대 §Y3§!개의 혁명 본부 건설"
 INS_revolution_planning_hq_DONE: "혁명 본부"
 INS_revolution_planning_hq_DONE_desc: "우리 민병대가 보고하는 혁명 본부입니다. 우리가 독립을 선언하는 순간, 이 주는 우리의 지배하에 놓이게 될 것입니다."
 INS_revolution_planning_hq_DONE_trigger_tt: "본부를 하나만 설립 가능"
 INS_revolution_planning_envoy_DONE_trigger_tt: "한 주에 여러 개의 기지 설립 불가능"
 INS_revolution_planning_envoy_DONE: "[FROM.GetName]의 민병대 기지"
 INS_has_revolutionary_hq: "혁명 본부를 설립함"
 INS_revolution_planning_influence_state: "[FROM.GetName]에 민병대 기지 설립"
 INS_revolution_planning_influence_state_desc: "우리는 민병대를 [FROM.GetName]에 파견하여 민병대 기지를 건설할 것이며, 이를 통해 지역 혁명가들이 본부와 원활하게 소통하며 독립 선언 후에 더욱 수월하게 작전을 수행할 수 있을 것입니다."
 INS_revolution_planning_cat_map_name: "민병대 활동을 관리할 곳을 선택하십시오"
 INS_state_revolution_hq_tt: "우리가 독립을 선언하면 주를 우리가 지배하게 될 것입니다"
 INS_hq_warning: "§W§R우리 본부를 이곳에 이전하는 것은 어려우며 상당한 자원을 소모할 것입니다.§!§!"
 INS_revolution_points_remaining_tt: "최소 §Y1§!개의 민병대 기지를 더 건설 가능(현재 §Y[?INS_revolution_points_remaining]§! 남음)"
 INS_revolution_planning_influence_state_points_notif_tt: "§R자바가 아닌 주§! §Y[?INS_starting_revolution_points_count]§!개에 추가로 민병대 기지를 설립할 수 있게 됩니다."
 INS_revolution_planning_influence_state_points_notif_tt_1: "§R자바가 아닌 주§! §Y1§!개에만 추가로 민병대 기지를 설립할 수 있게 됩니다."
 INS_revolution_point_spend_tt: "민병대 기지가 [FROM.GetName]에 설립됩니다"
 INS_revolution_points_in_state_tt: "[FROM.GetName]에 민병대 기지가 없음"
 war_escalation_1_or_more_tt: "악화가 최소 §Y1§!단계"
 war_escalation_2_or_more_tt: "악화가 최소 §Y2§!단계"
 war_escalation_3_or_more_tt: "악화가 최소 §Y3§!단계"
 war_escalation_4_or_more_tt: "악화가 최소 §Y4§!단계"
 war_escalation_5_or_more_tt: "악화가 최소 §Y5§!단계"
 war_escalation_7_or_more_tt: "악화가 최소 §Y7§!단계"
 war_escalation_8_or_more_tt: "악화가 최소 §Y8§!단계"
 war_escalation_10_or_more_tt: "악화가 §Y10§!단계"
 war_escalation_10_max_tt: "악화가 §Y10§!단계 미만"
 INS_no_raids_allowed_tt: "§W§R결정이 활성화된 동안 습격을 할 수 없습니다.§!§!"
 INS_is_deescalating_tt: "측이 아직 긴장 완화 임무를 하고 있지 않습니다"
 INS_escalate_the_conflict: "충돌 확대"
 INS_escalate_the_conflict_desc: "우리는 긴장을 고조시키고 상황을 악화시키기 위해 폭동 및 적과의 소규모 교전을 조직하여, 이후에 더욱 심각한 작전이 국제적인 감시를 덜 받도록 하는 기반을 마련할 것입니다."
 INS_escalate_the_conflict_HOL: "$INS_escalate_the_conflict$"
 INS_escalate_the_conflict_HOL_desc: "$INS_escalate_the_conflict_desc$"
 INS_deescalate_the_conflict: "국제 중재 요청"
 INS_deescalate_the_conflict_2: "휴전 명령하기"
 INS_deescalate_the_conflict_desc: "네덜란드는 우리와 선의로 협상하려 하지 않습니다. 그들에게 우리는 여전히 반란군이며, 상대해야 할 국가가 아니라 억압해야 할 골칫거리일 뿐입니다. 하지만 세계 강대국들은 다릅니다. 헤이그는 그들을 그렇게 쉽게 무시할 수 없습니다. 우리는 국제 사회에 중재를 호소하고, 우리 자신의 목소리로는 이루어질 수 없는 변화를 외국의 압력을 통해 강요할 것입니다."
 INS_deescalate_the_conflict_2_desc: "우리의 습격이 효과가 있었습니다. 식민지 주둔군은 우리의 영향 범위를 알고 있으며, 헤이그는 우리가 겁먹지 않았다는 것을 알고 있습니다. 하지만 우리가 공격할 때마다 네덜란드는 더 많은 병력과 함선을 보낼 명분을 얻게 되며, 우리는 아직 전면전을 벌일 준비가 되어 있지 않습니다. 우리는 지휘관들에게 사격을 중지하라고 지시할 것입니다. 다음 공격은 네덜란드의 도발에 넘어가서가 아니라, 우리가 명령할 때 이루어질 것입니다."
 INS_renville_tt_HOL: "§W§Y[USA.GetFlag][USA.GetNameDefCap]§!(이)가 우리에게 최후통첩을 할 것입니다. 우리가 항복하고 인도네시아에서 철수하지 않으면 그들은 우리에게 §R선전포고§!를 할 것입니다.§!"
 INS_renville_wont_happen_neutral_tt: "미국의 협상이 완료되기 전에 분쟁이 끝날 것이며, 미국은 개입할 수 없을 것입니다."
 INS_renville_explain_USA_tt: "§Y365일§! 후에 분쟁이 해결되지 않을 경우:\n\n"
 INS_renville_timer_mission_republic: "렌빌 협상 보류 중"
 INS_renville_timer_mission_HOL: "$INS_renville_timer_mission_republic$"
 INS_national_revolution_peace_negotiation: "[FROM.GetName]의 철수 협상"
 indonesia_reduce_escalation_1_effect_tooltip_for_min_4: "악화가 §G1§! 감소하며, §Y4§!까지 감소 가능"
 INS_ongoing_influence_process: "민병대 기지를 설립하지 않음"
 INS_current_revolution_strength_3_tt: "이 주에 현재 민병대 활동량이 §G높습니다§!."
 INS_current_revolution_strength_0_tt: "이 주에 현재 민병대 활동량이 없습니다."
 INS_has_spent_points_trigger_tt: "민병대 기지를 추가로 설립할 수 없음"
 INS_national_revolution_cat: "인도네시아 국민혁명"
 INS_national_revolution_cat_desc: "네덜란드의 350년에 걸친 폭정 끝에 우리는 스스로 문제를 해결하고 독립을 선언했습니다. 네덜란드는 우리의 권위를 인정하지 않고 여전히 동인도를 식민지로 통치하며 우리를 범죄자로 취급하고 있습니다.\n\n우리는 더 많은 지역과 주요 도시들을 장악하고 네덜란드 정부를 내부에서부터 무너뜨려야 합니다. 그러나 치밀한 계획 없이 지나치게 공격적으로 나서서는 안 됩니다. 우리가 사태를 너무 급격히 격화시키면 네덜란드의 군사 행동을 불러올 수 있기 때문입니다."
 INS_national_revolution_cat_map: "가짜 봉기 개시"
 INS_national_revolution_dutch_cat: "동인도 제도의 혁명 민병대"
 INS_national_revolution_dutch_cat_desc: "동인도 제도의 혁명가들이 불법적으로 독립을 선언하고 민병대를 동원해 여러 지역을 장악했습니다. 우리는 최선을 다했지만, 민병대의 엄청난 병력 규모 때문에 이 지역의 통제권을 되찾지 못하고 있습니다.\n\n이들이 더 많은 도시를 장악하고 동인도 제도의 행정을 더욱 불안정하게 만들기 전에 이들을 저지해야 합니다. 이들이 계속해서 이러한 행태를 보인다면 군사력 사용이라는 극단적인 조치가 필요할 수도 있습니다."
 INS_HOL_revolution_not_going_well_tt: "§R바타비아 없이는 우리는 동인도를 통치할 수 없으며, 평화 협정을 혁명가들과 협상할 수밖에 없을 것입니다.§!"
 INS_gradual_escalation_republic: "점진적인 격화"
 INS_gradual_escalation_HOL: "점진적인 격화"
 INS_gradual_escalation_republic_desc: "네덜란드의 보복은 우리의 습격 이후에 더 심해졌고, 그들의 순찰대는 그들이 몇 달 전에 철수했던 지역까지 압박해 오고 있습니다. 우리 지휘관들은 오랫동안 안정되었다고 여겨졌던 곳에서 더 치열한 전투가 벌어지고 있다고 보고하고 있으며, 아군 사상자 수는 모병 속도가 따라잡지 못할 정도로 빠르게 증가하고 있습니다. 작년까지만 해도 조용했던 지역으로까지 분쟁이 확산되고 있습니다."
 INS_gradual_escalation_HOL_desc: "현지 행정관청에서 올라오는 보고는 매주 심각해지고 있습니다. 반란군은 예상치 못했던 지역에서 공격을 감행하고 있으며, 바타비아의 군 사령부는 이전보다 더 강력한 조치를 강행할 것을 압박하고 있습니다. 헤이그에서는 내각 회의가 열릴 때마다 인내심을 가져야 한다고 조언하는 사람들의 수가 점점 줄어들고 있습니다."
 INS_national_revolution_republic_win_ins_tt: "[INS.GetAdjective] 공화주의 민병대는 해당 지역의 §G실질적인 통제권§!을 확보할 것이며, 분쟁은 §G공화주의자의 승리§!로 끝날 것입니다."
 INS_national_revolution_republic_win_hol_tt: "[INS.GetAdjective] 공화주의 민병대는 해당 지역의 §R실질적인 통제권§!을 확보할 것이며, 분쟁은 §R공화주의자의 승리§!로 끝날 것입니다."
 INS_national_revolution_dutch_cat_map: "민병대가 점령 중인 주 보기"
 INS_take_batavia: "자바 장악"
 INS_take_batavia_desc: "네덜란드는 탐욕으로 인해 동쪽 섬들을 무시하고 거의 자바에만 투자한 결과, 자바는 식민지 전체의 아킬레스건이 되었습니다. 이것이 바로 그들의 몰락하는 원인이 될 것입니다! 우리는 군대를 이끌고 자바를 급습하여 네덜란드의 통신과 보급망을 파괴하고, 동인도 행정부를 마비시켜야 합니다."
 INS_hold_batavia_HOL: "자바 사수"
 INS_hold_batavia_HOL_desc: "공화주의자 군대가 병력 대부분을 자바에 재배치하여 이 섬 전체를 장악하려는 작전을 시작했습니다. 우리는 계속 저항해야 합니다. 그들의 작전은 위험도가 높으며, 만약 그들이 실패한다면 우리는 그들의 정부를 전복시킬 기회를 얻게 될 것입니다."
 INS_militias_moestopo_mission: "무스토포의 실적에 따른 진급 요구"
 INS_militias_pki_uprising_mission: "불가피한 공산당의 봉기"
 INS_pacific_revolution_cat: "태평양 혁명"
 INS_instigate_in_country: "[FROM.GetName]에서 혁명 조장"
 INS_instigate_in_country_desc: "우리의 혁명은 마지막 식민지 병사를 [ROOT.GetAdjective] 땅에서 몰아낸다고 끝난 것이 아닙니다. [FROM.GetName]의 노동자와 농민들은 우리가 벗어던진 바로 그 멍에를 지고 고통받고 있으며, 이제 그들은 압제자를 물리칠 수 있다는 증거로서 우리에게 기대를 걸고 있습니다. 우리는 그들에게 선동가들을 파견하고, 팸플릿을 배포하고, 노동조합에 자금을 지원하고, 혁명의 조건이 무르익을 때까지 불만의 불길을 부추길 것입니다."
 INS_launch_revolution: "혁명 촉구"
 INS_launch_revolution_desc: "[FROM.GetName]에서 조건이 무르익었습니다. 우리 요원들은 공장과 농장에서 불안이 고조되고 있다고 보고했으며, 지역의 당 조직들은 행동할 준비를 마쳤습니다. 이제 [FROM.GetName]의 노동자와 농민들에게 봉기하여 정당한 그들의 것을 되찾으라고 촉구할 때가 왔습니다."
 INS_anti_colonialist_bonus: "[FROM.GetName]에 반식민주의 정서 전파"
 INS_anti_colonialist_bonus_desc: "[FROM.GetName]의 주민들은 자신의 이익이 아닌 외국 지배자의 이익을 위해 고된 노동을 하도록 강요받고 있습니다. 우리는 그들에게 복종은 선택이며, 그들의 지배자들은 그들이 주장하는 것만큼 강하지 않다는 사실을 일깨워 줄 것입니다."
 INS_revolutionary_sentiment: "[FROM.GetAdjective] 혁명가들과 협력"
 INS_revolutionary_sentiment_desc: "이미 [FROM.GetName] 내부에서 스스로 대의를 행동에 옮기는 사람들이 있습니다. 그들에게는 조직과 자원이 부족하지만, 확고한 신념은 있습니다. 이러한 집단들과 협력함으로써 우리는 기존 질서의 붕괴를 앞당길 수 있습니다. 비록 그로 인한 불안정이 단기적으로 국가 통치를 더욱 어렵게 만들더라도 말입니다."
 INS_arm_militias: "[FROM.GetAdjective] 현지 민병대 무장"
 INS_arm_militias_desc: "팸플릿과 연설만으로는 혁명을 수행하는 데 한계가 있습니다. 때가 되면 [FROM.GetName]의 우리 동지들은 직접 싸울 수 있어야 합니다. 잉여 무기와 보급품을 우리 편 민병대로 밀반입하여 반동 세력이 무방비 상태가 아닌 무장한 민중을 마주하도록 해야 합니다."
 INS_arm_militias_tt: "내전이 발발하면 공산주의자들이 추가 사단을 투입할 것입니다."
 INS_propoganda_mission: "[FROM.GetName]에 공산주의 전파"
 INS_propoganda_mission_desc: "당의 조직자들을 [FROM.GetName] 각지에 파견하여 독서 모임을 창설하고, 노동조합에서 당원을 모집하며, 마을에 혁명의 메시지를 전파하도록 할 것입니다. 오늘 우리가 심는 씨앗은 머지않아 열매를 맺을 것입니다."
 INS_abandon_mission: "임무 포기"
 INS_abandon_mission_desc: "우리의 자원은 무한하지 않으며, [FROM.GetNameDef]에서의 투쟁에는 현재 우리가 감당할 수 있는 것보다 더 많은 것이 필요합니다. 우리는 우리 요원들을 철수시키고 가장 필요한 곳에 노력을 집중할 것입니다."
 INS_aslia_cat: "태평양의 통일"
 INS_integrate_subject: "[FROM.GetName] 통합"
 INS_integrate_subject_in_progress: "이미 종속국을 통합 중"
 INS_can_raid_here_HOL: "습격 가능한 주"
 INS_can_raid_here_HOL_tt: "이 주는 공화파 민병대의 지상 습격 대상이 될 수 있습니다. 만약 습격이 성공한다면, 우리는 이 주를 빼앗기게 됩니다. 습격으로부터 주를 방어하기 위해 우리는 다음과 같은 조치를 취할 수 있습니다: \n$success_modifier_INS_has_influence_mod_counterplay$\n$success_modifier_INS_defense_modifier_counterplay$\n$success_modifier_INS_naval_dominance_modifier_counterplay$\n - §Y공중 우세§! 강화\n- 적에게 정보 유출 감소\n- 주 내 저항 세력 약화"
 INS_war_escalation_text: "£generic_war_escalation_text_icon 악화 단계: §Y[?INS.INS_war_escalation_level]§!"
 INS_war_escalation_level_tt: "§Y현재 악화 단계§!\n\n악화 단계는 시간이 지나면서, 그리고 민병대가 §Y새로운 주를 점령§!할 때, 그리고 [HOL.GetNameDef](이)가 민병대 활동에 맞서 싸우기 위해 조치를 취할 때에 증가합니다. 상황이 충분히 악화되면 §R전면전§!이 될 수 있습니다."
 INS_war_escalation_1_tt: "§Y[INS.GetName]§!: 지상 습격 잠금 해제"
 INS_war_escalation_2_tt: "§Y[INS.GetName]§!: 휴전 명령 결정을 잠금 해제합니다"
 INS_war_escalation_3_tt: "§Y[HOL.GetName]§!: 영국 또는 프랑스의 개입을 요청하는 중점을 잠금 해제"
 INS_war_escalation_4_tt: "§Y[HOL.GetName]§!: 선전포고 결정을 잠금 해제(국제적 반발로 인한 막대한 불이익이 따름)\n§Y[INS.GetName]§!: 긴장 완화를 위해 국제 중재를 요청하는 결정을 잠금 해제"
 INS_war_escalation_5_tt: "§Y[INS.GetName]§!: 수라바야에서의 전투"
 INS_war_escalation_6_tt: "효과 없음"
 INS_war_escalation_7_tt: "§Y[HOL.GetName]§!: 선전포고 결정 시에 더 이상 불이익 없음\n§Y[INS.GetName]§!: 선전포고 중점을 잠금 해제"
 INS_war_escalation_8_tt: "§Y[INS.GetName]§!: 자바에 침투 작전을 개시하는 중점을 잠금 해제합니다. §R이것은 인도네시아의 빠른 승리로 이어질 수 있습니다.§!\n§Y[INS.GetName]§!: 수카르노 암살 계획의 실패"
 INS_war_escalation_9_tt: "§Y[INS.GetName]§!: 사회주의 정당들의 합병"
 INS_war_escalation_10_tt: "§Y[INS.GetName]§!: 미국의 외교적 개입을 요청할 수 있음"
 INS_limited_wars_cat: "제한전"
 INS_start_limited_war_malaya: "말라야에서 제한전 개시"
 INS_limited_war_malaya: "콘프론타시!"
 INS_revolution_penalty_reduce_tt: "§Y악화 7단계에서 이 결정을 하면 불이익을 받지 않습니다§!."
 INS_revolution_penalty_reduce_tt_2: "§R악화 §Y8§!단계까지 기다리면 불이익이 사라집니다§!."
 INS_increase_escalation_1_tt: "§Y악화 단계§!가 §R1§! 증가"
 INS_increase_escalation_2_tt: "§Y악화 단계§!가 §R2§! 증가"
 INS_increase_escalation_3_tt: "§Y악화 단계§!가 §R3§! 증가"
 INS_reduce_escalation_1_tt: "§Y악화 단계§!가 §G1§! 감소"
 INS_reduce_escalation_2_tt: "§Y악화 단계§!가 §G2§! 감소"
 INS_reduce_escalation_3_tt: "§Y악화 단계§!가 §G3§! 감소"
 INS_exile_cat: "동인도 망명 정부"
 INS_legitimacy_decision_1: "로비 활동"
 INS_dockyard_decision: "타국 조선소 대여"
 INS_army_factory_decision: "타국 군수공장 대여"
 INS_mil_factory_cost_tt: "동인도 망명 정부 결정의 비용이 £pol_power §Y25§! 증가합니다."
 INS_revolution_war_HOL: "경찰 행동 개시"
 INS_revolution_war_HOL_desc: "이 반란군들은 이제 더 이상 내버려둘 수 없습니다. 너무나 많은 돈과 군사 자원이 민병대의 활동을 저지하는 데 투입되었지만, 그들은 계속해서 세력을 확장하고 있습니다. 더 이상 기다릴 수 없습니다. 전면전만이 상황을 타개할 유일한 방법입니다."
