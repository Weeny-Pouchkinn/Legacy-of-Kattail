 AST_australian_culture_investments_idea: "호주의 문화 투자"
 AST_australian_culture_investments_idea_desc: "§W§Y제거 시§!:\n§Y장소 유대감§!을 추가하여 다음을 부여합니다.\n안정도: §G+10.00%§!\n전쟁 지지도: §G+10.00%§!.§!\n"
 AST_a_sense_of_place: "장소 유대감"
 AST_a_sense_of_place_desc: "국가 정체성은 국민을 하나로 묶어주는 유대감입니다. 번영하는 문화 아래 호주인들은 단결하여 국경을 위협하는 자라면 상대가 누구든 맞서 싸우겠다는 의지를 다져왔습니다."
 AST_a_sense_of_place_upgraded: "향토 의식"
 AST_a_sense_of_place_upgraded_desc: "한때 조용히 꽃피웠던 국가 정체성은 이제 더욱 강인해졌습니다. 이것은 더 이상 단순히 영토와 삶의 방식에 대한 자부심이 아닙니다. 이것은 호주가 일궈낸 모든 것은 싸워서 지켜낼 가치가 있으며, 남십자성 아래 살아가는 남녀 모두 기꺼이 싸울 준비가 되어 있다는 확신입니다."
