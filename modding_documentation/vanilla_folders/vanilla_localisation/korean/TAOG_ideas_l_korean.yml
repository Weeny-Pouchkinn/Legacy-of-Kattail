 INS_bangka_bauxite_export: "방카 보크사이트 수출"
 INS_bangka_bauxite_export_desc: "방카섬과 블리퉁섬은 세계 보크사이트의 상당량이 매장된 곳으로, 보크사이트는 알루미늄의 주원료입니다. 우리가 직접 알루미늄 생산에 투자할 수도 있지만, 보크사이트 채굴량이 워낙 많기 때문에 원자재 그대로를 대량으로 판매하는 것이 실용적인 전략입니다."
