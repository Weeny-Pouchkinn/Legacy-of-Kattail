 AST_imperial_pressure_spirit: "제국의 압박"
 AST_imperial_pressure_spirit_desc: "최근 사건들로 인해 호주의 정치가 영연방 산하 국가에 적합하지 않은 방향으로 흘러가고 있다는 사실을 더는 부인할 수 없습니다. [ENG.GetNameDefCap](은)는 우리 국가를 원래의 궤도로 되돌리려 하겠지만, 오래도록 인내심을 유지하지는 못할 것입니다.\n\n§Y[AST.GetName]§!(이)가 §Y[ENG.GetNameDef]§!의 종속국이 아니게 되면 §W제거됩니다§!."
