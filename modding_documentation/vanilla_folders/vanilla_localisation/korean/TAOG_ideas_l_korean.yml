 AST_anti_fascist_measures: "반파시즘 조치"
 AST_anti_fascist_measures_desc: "파시즘은 아직 호주에 뿌리내리지 못했으며, 민주주의 세력은 이러한 상황이 유지되기를 원합니다. 연방 수사국은 모든 의심스러운 인물을 감시하고 구금하여 어떠한 파시스트 단체도 영향력을 얻지 못하도록 할 것입니다."
 ABDA_corps_expeditionnaire_spirit: "원정군단"
 ABDA_corps_expeditionnaire_spirit_desc: "태평양 전선에 투입된 프랑스군은 식민지 복무를 통해 단련되었으며, 고향을 떠나 험난한 환경 속에서 작전을 수행하는 데 익숙합니다. 동남아시아에서의 전투 경험은 일본군의 전술과 지형에 대한 탁월한 이해도를 제공하며, 적의 진격에 대응하는 회복력 강한 전력으로 작용합니다."
 ABDA_maintain_strategic_flexibility_spirit: "전략적 유연성"
 ABDA_maintain_strategic_flexibility_spirit_desc: "미국의 산업 생산은 태평양 전구에 집중되고 있으며, 태평양 전역에 전력을 투사할 수 있는 함대를 유지하기 위해 그들의 조선소 생산이 가속화되고 있습니다. 미합중국은 상황에 따라 해군력을 어디든 투입할 수 있도록 어느 한 전선에 과도하게 전력을 집중하지 않고 있습니다."
 AST_toe_the_line_spirit: "규칙을 따르다"
 AST_toe_the_line_spirit_desc: "국가는 희생을 요구했고 국민은 이에 응답했습니다. ​배급제, 노동 시간 연장, 그리고 민간 생산을 국가 활동에 투입함으로써 정부는 다른 방법으로는 확보할 수 없었던 자원을 확보할 수 있었습니다. 이는 엄격한 조치이며, 모두가 환영할 조치는 아닙니다."
