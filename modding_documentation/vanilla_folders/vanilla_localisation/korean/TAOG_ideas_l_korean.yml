 ############
 idea_SIA_civilian_full_support: "민간 세력: §G전적인 지지§!"
 idea_SIA_civilian_full_support_desc: "민간 세력은 정부를 굳건히 지지하고 있습니다. 행정가와 기술 관료들은 그들의 전문성을 발휘하여 개발을 주도하고 있습니다."
 idea_SIA_civilian_slight_support: "민간 세력: 약간의 지지"
 idea_SIA_civilian_slight_support_desc: "민간 세력은 대체로 정부의 방향을 지지합니다. 그들의 협력은 작지만 실질적인 이익을 가져다 줍니다."
 idea_SIA_civilian_neutral: "민간 세력: 중립"
 idea_SIA_civilian_neutral_desc: "민간 세력은 정부를 돕지도, 방해하지도 않습니다. 행정부는 기능하지만, 진정한 정치적 연대가 주는 동력 없이 운영됩니다."
 idea_SIA_civilian_opposition: "민간 세력: 반대함"
 idea_SIA_civilian_opposition_desc: "민간 세력은 정부에 등을 돌렸습니다. 공무원들은 일을 미적거리고 예산은 잘못 할당되어, 국가 운영 시스템이 마비되고 있습니다."
 idea_SIA_civilian_rebellious: "민간 세력: §R반역 준비 중§!"
 idea_SIA_civilian_rebellious_desc: "민간 세력은 공개적으로 저항하고 있습니다. 불안정이 확산되고 있으며, 정치적 분열의 위협이 날이 갈수록 커지고 있습니다."
 idea_SIA_military_full_support: "군부 세력: §G전적인 지지§!"
 idea_SIA_military_full_support_desc: "군부 세력은 정부를 확고히 지지하고 있습니다. 장교들은 모병과 무기 생산을 지원하며, 군의 자원을 국가 목표 달성에 활용하고 있습니다."
 idea_SIA_military_slight_support: "군부 세력: 약간의 지지"
 idea_SIA_military_slight_support_desc: "군부 세력은 대체로 협조적입니다. 그들의 지지는 모병 및 생산에 약간의 긍정적인 변화를 가져오지만, 전폭적인 참여는 하지 않습니다."
 idea_SIA_military_neutral: "군부 세력: 중립"
 idea_SIA_military_neutral_desc: "군부 세력은 어떠한 입장도 취하지 않습니다. 군은 별다른 열의도 저항도 없이 임무를 수행하면서, 상황이 어떻게 전개되는지 지켜보고 있습니다."
 idea_SIA_military_opposition: "군부 세력: 반대함"
 idea_SIA_military_opposition_desc: "군부 세력은 정부에 대항하고 있습니다. 장교들은 생산 활동을 저해하고, 정부의 대의에 대한 열정은 군인들 사이에서 사그라지고 있습니다."
 idea_SIA_military_rebellious: "군부 세력: §R반역 준비 중§!"
 idea_SIA_military_rebellious_desc: "군부 세력은 공개적으로 반항하기 직전입니다. 징병은 방해받고, 무기 생산은 차질을 빚으며, 쿠데타의 유령이 다가오고 있습니다."
 idea_SIA_defenders_of_constitutional_liberty: "헌법적 자유의 수호자들"
 idea_SIA_civil_service_heroism_1: "공무원 영웅주의"
 idea_SIA_civil_service_heroism_1_desc: "공무원들은 이러한 상황에 부응하고 있습니다. 그들의 헌신과 전문 지식은 연구 및 국가 발전의 속도를 조용히 가속화해 왔습니다."
 idea_SIA_civil_service_heroism_2: "$idea_civil_service_heroism_1$"
 idea_SIA_civil_service_heroism_2_desc: "$idea_SIA_civil_service_heroism_1_desc$"
 idea_SIA_redirected_military_funds: "전용된 군부 자금"
 idea_SIA_thai_irredentism: "타이 실지회복주의"
 idea_SIA_oss_special_forces_training: "OSS 특수부대 훈련"
 idea_SIA_seized_japanese_funds: "압류한 일본 자금"
 idea_SIA_seized_japanese_funds_desc: "일본과의 협정이 깨지면서, 그들이 남겨 두고 간 자금과 비축된 물량을 우리가 사용할 수 있게 되었고, 이에 따라 건설과 산업 생산이 급증하게 되었습니다."
 idea_SIA_oss_special_forces_training_desc: "우리 공작원들은 OSS와 함께 파괴 공작, 침투 및 공수 작전 훈련을 받았습니다. 이러한 훈련을 통해 얻은 교훈은 우리 특수부대를 강력한 전력으로 바꿔 놓았습니다."
 idea_SIA_sold_privy_purse_lands: "매각된 왕실 토지"
 idea_SIA_sold_privy_purse_lands_desc: "왕실의 토지를 매각한 덕분에 국가에 자본이 유입되어, 경제적 압박이 완화되고 건설을 위한 자원이 확보되었습니다. 자금이 확보되었습니다."
 idea_SIA_war_fervor: "전쟁의 열기"
 idea_SIA_bloodlusted_irredentism: "피에 굶주린 실지회복주의"
 idea_SIA_bloodlusted_irredentism_desc: "영토에 대한 야망은 더욱 맹렬해졌습니다. 군대는 자신들의 정당한 권리를 되찾고 있다는 확신을 가지고 싸우고 있습니다."
 idea_SIA_the_royal_police_counterweight: "왕립 경찰의 충성"
 idea_SIA_civilian_technocrats_in_institutions: "민간 기술 관료"
 idea_SIA_civilian_technocrats_in_institutions_desc: "주요 국가 기관에 배치된 민간 전문가들은 자원 추출과 정치적 임명의 효율성을 모두 개선해 왔습니다."
 idea_SIA_yuvachon: "유바촌"
 idea_SIA_yuvachon_desc: "유바촌 운동은 전국의 청소년들에게 군사 규율을 훈련시켜, 훈련된 인력을 양성하고 민족주의 정서를 고취합니다."
 idea_SIA_yuvachon_2: "$idea_SIA_yuvachon$"
 idea_SIA_yuvachon_2_desc: "$idea_SIA_yuvachon_desc$"
 idea_SIA_rebuilding_the_war_torn_economy: "전쟁으로 망가진 경제 재건"
 idea_SIA_specialist_marine_forces: "특수 해병대"
 idea_SIA_specialist_marine_forces_desc: "헌신적인 상륙 전문가들로 구성된 간부들이 해안 공격 작전을 위해 훈련과 장비를 갖추었습니다."
 idea_SIA_rehabilitated_military: "재건된 군대"
 idea_SIA_desperate_gambit: "필사적인 도박 수"
 idea_SIA_desperate_gambit_desc: "어쩌면 이 구덩이에서 벗어날 길이 있을지도 모릅니다, 올라가 보세요!"
 idea_SIA_purged_senior_military: "숙청된 고위 군인"
 idea_SIA_purged_senior_military_desc: "정부에 위협이 된다고 판단된 고위 장교들이 직위에서 해임되었습니다. 경험 많은 지휘관들의 상실은 군대의 결속도와 전문성 개발에 악영향을 미쳤습니다."
 idea_SIA_cemented_control: "통제 강화"
 idea_SIA_cemented_control_desc: "정부는 국가 기관에 대한 장악력을 강화했습니다. 정치적 반대 세력은 배제되었고, 권력의 기계 장치는 이제 정부에 유리한 쪽으로 작동하고 있습니다."
 idea_SIA_cemented_control_2: "견고한 통제"
 idea_SIA_cemented_control_2_desc: "$idea_SIA_cemented_control_desc$"
 idea_SIA_cemented_control_3: "타이 전쟁 중 의무 법령"
 idea_SIA_cemented_control_3_desc: "모든 타이 국민의 의무에 따라, 타이 왕실의 주권과 국민을 위협하는 전쟁이 발발할 경우 모든 타이 국민은 무력을 사용하든 다른 수단을 사용하든 가능한 모든 방법을 동원하여 점령에 저항해야 합니다."
 idea_SIA_suspend_ordinary_legal_procedures: "중단된 일반적인 법적 절차"
 idea_SIA_thai_cultural_mandates: "타이 문화명령"
 idea_SIA_military_humiliation: "군인의 굴욕"
 idea_SIA_death_defiant: "죽은 자들의 저항"
 idea_SIA_death_defiant_desc: "우리는 이미 죽었다. 너희도 죽고 싶으면 와라."
 idea_SIA_songsuradet_ascendant_0: "송수라뎃의 부상"
 idea_SIA_songsuradet_ascendant_0_desc: "정부의 분노를 성공적으로 견뎌낸 프라야 송수라뎃은 오히려 자신의 기반을 더욱 확고히 다졌으며, 그 결과 한층 더 강력해졌습니다. 이제 그는 건드릴 수 없는 존재가 되었으며, 너무나 높은 인지도와 확고한 입지를 가졌습니다.\n송수라뎃은 앞으로 정부 정책에 간섭하여 의사 결정 과정을 지연시킴으로써, 다시는 숙청 대상이 되지 않도록 움직일 가능성이 큽니다."
 idea_SIA_songsuradet_ascendant_1: "$idea_SIA_songsuradet_ascendant_0$"
 idea_SIA_songsuradet_ascendant_1_desc: "$idea_SIA_songsuradet_ascendant_0_desc$"
 idea_SIA_rebuilding_after_civil_war: "내전 후의 재건"
 idea_SIA_rebuilding_after_civil_war_desc: ""
 idea_SIA_anti_burmese_sentiment: "반버마 정서"
 idea_SIA_sued_king_prajadhipok: "소송당한 프라차티뽁 왕"
 idea_SIA_pan_thaiism: "범타이주의"
 idea_SIA_pan_thaiism_desc: "범타이주의 이념은 타이의 혈통을 가진 모든 민족이 하나의 국가 아래 통합되어야 한다는 것입니다. 이는 국가의 확장을 추진하고 공격적인 행동을 통해 사기를 유지합니다."
 idea_SIA_pan_thaiism_2: "$idea_SIA_pan_thaiism$"
 idea_SIA_pan_thaiism_2_desc: "$idea_SIA_pan_thaiism_desc$"
 idea_SIA_unity_propaganda: "통합 선전"
 idea_SIA_royal_palace_bureau_directive_no_1523: "왕실국 지령 제1523호"
 idea_SIA_foreign_diplomatic_relationships: "대외 외교 관계"
 modify_idea_SIA_foreign_diplomatic_relationships: "§Y$idea_SIA_foreign_diplomatic_relationships$§! 변동치:"
 idea_SIA_bank_of_siam: "시암 은행"
 idea_SIA_bank_of_siam_desc: "시암 은행은 국가의 재정적 중추 역할을 하며, 자본 투자를 지휘하고 산업 확장을 지원하기 위한 통화 정책을 관리합니다."
 idea_SIA_bank_of_siam_2: "$idea_SIA_bank_of_siam$"
 idea_SIA_bank_of_siam_2_desc: "$idea_SIA_bank_of_siam_desc$"
 idea_SIA_boon_rawd_brewery: "분 로드 양조회사"
 idea_SIA_boon_rawd_brewery_desc: "분 로드 양조회사는 국내 기업의 상징으로 성장했으며, 그 상업적 성공은 이 회사를 지지하는 사람들에게 호의와 정치적 이익을 제공하고 있습니다."
 idea_SIA_siam_cement_group: "[ROOT.GetName] 시멘트 그룹"
 idea_SIA_thai_rice_company: "타이 미곡회사"
 idea_SIA_agricultural_tax_reduction: "농업세 감면"
 idea_SIA_agrarian_economical_policy: "농업 경제 정책"
 idea_SIA_contingency_funds: "비상 자금"
 idea_SIA_agrarian_economical_policy_modify: "§Y$idea_SIA_agrarian_economical_policy$§! 변동치:"
 idea_SIA_farmers_moving_to_bangkok_good: "방콕으로 이주하는 농부들"
 idea_SIA_farmers_moving_to_bangkok_bad: "$idea_SIA_farmers_moving_to_bangkok_good$"
 idea_SIA_irrigation: "관개"
 idea_SIA_debt_repayment: "부채 상환"
 idea_SIA_debt_repayment_desc: "적자 지출 정책의 대가가 실체를 보이고 있습니다. 수익은 채권자에게로 이동하고 있으며, 한때 대출을 통해 가능했던 건설 속도는 더 이상 유지될 수 없습니다."
 idea_SIA_an_unceasy_alliance: "불편한 동맹"
 idea_SIA_an_unceasy_alliance_desc: "동맹은 유지되고 있지만, 그로 인한 압박이 드러나기 시작합니다. 정부 내부의 의구심은 조용히 국가를 보다 중립적인 방향으로 이끌고 있습니다."
 idea_SIA_rural_support: "농촌 지원"
 idea_SIA_the_sacred_hierarchy: "신성한 계층 구조"
 idea_SIA_order_discipline_and_unity: "질서, 규율, 통합"
 idea_SIA_constitutional_virtue: "헌법적 미덕"
 idea_SIA_an_absolute_monarchy: "전제군주정"
 idea_SIA_an_absolute_monarchy_desc: "모든 정치적 권위는 왕에게 있습니다. 왕의 말은 곧 법이며, 반대 의견은 억압되고, 왕의 위신이 가지는 모든 무게는 국가적 동원에 이용됩니다. 왕좌는 충성을 요구하며, 군대는 그 도구입니다."
 idea_SIA_a_constituional_monarchy: "입헌군주제"
 idea_SIA_a_constituional_monarchy_desc: "헌법적 체계는 왕권의 한계를 규정하고 국민의 권리를 보장합니다. 왕이 절대적인 권위가 아닌 통합의 상징으로서 기능할 때, 국가는 더욱 안정되고 새로운 사상에 더 개방적이며 민주주의 세계와 더욱 협조할 수 있습니다."
 idea_SIA_restoring_order: "질서 회복"
 idea_SIA_military_expansion_costs: "군사 확장 비용"
 idea_SIA_a_modern_economy: "현대적 경제"
 idea_SIA_death_to_communists: "공산주의자들에게 죽음을"
 idea_SIA_death_to_communists_desc: "반공주의의 열기가 군대 전체에 퍼져 있어, 중국의 공산주의 군대에 맞서 우리 군대가 우위를 점하게 해줍니다."
 idea_SIA_death_to_nationalists: "민족주의자들에게 죽음을"
 idea_SIA_death_to_nationalists_desc: "반민족주의의 열기가 군대 전체에 퍼져 있어, 중국의 민족주의 군대에 맞서 우리 군대가 우위를 점하게 해줍니다."
 idea_SIA_breaking_the_burmese_line: "버마 전선 돌파"
 idea_SIA_the_yellow_dossier: "황색 서류"
 idea_SIA_the_yellow_dossier_desc: "국내 산업 현황에 대한 기밀 보고서가 고질적인 비효율성을 적나라하게 밝히고 있습니다. 이 보고서에서 요구하는 개혁은 우리 공장에서 결실을 맺고 있지만, 그로 인한 혼란에는 대가가 따릅니다."
 idea_SIA_the_yellow_dossier_2: "$idea_SIA_the_yellow_dossier$"
 idea_SIA_the_yellow_dossier_2_desc: "$idea_SIA_the_yellow_dossier_desc$"
 idea_SIA_pacific_war_preparations: "태평양 전쟁 준비"
 idea_SIA_a_race_against_time: "시대의 흐름 따라잡기"
 idea_SIA_overheated_economy: "과열된 경제"
 idea_SIA_overheated_economy_desc: "경제가 자연스러운 한계를 넘어섰습니다. 소비자의 수요가 공급을 초과했고, 경기가 진정되면서 건설 붐은 멈추었습니다."
 idea_SIA_ending_military_grift: "군사적 사기의 종식"
 idea_SIA_the_military_oversight_bureau: "$SIA_military_oversight_bureau$"
 idea_SIA_the_military_oversight_bureau_desc: "군사 감독국은 신임 지휘관에 대하여 더 높은 기준을 설정하고 장교단의 전문성 개발을 가속화합니다."
 idea_SIA_public_credit_debt: "공공 신용 부채"
 idea_SIA_public_credit_debt_desc: "국가의 채무는 경제에 지속적인 손실을 일으키며, 채무가 없었다면 생산과 민간용 물품에 투입되었을 자원을 소모하게 합니다."
 idea_SIA_public_credit_debt_2: "$idea_SIA_public_credit_debt$ 상환"
 idea_SIA_public_credit_debt_2_desc: "$idea_SIA_public_credit_debt_desc$"
 idea_SIA_revision_of_unequal_treaties: "불평등 조약 개정"
 idea_SIA_purged_military: "군부 숙청"
 idea_SIA_purged_military_desc: "정치적으로 신뢰할 수 없다고 판단된 장교들의 해임으로 인해 군에는 경험 많은 지휘관이 부족해졌고, 이는 남은 병력의 조직력과 발전을 저해했습니다."
 SIA_khana_ratsadon_inlay_title: "인민당"
 SIA_civilian_wing_label: "민간 세력"
 SIA_military_wing_label: "군부 세력"
 SIA_wing_state_full_support: "§G전적인 지지§!"
 SIA_wing_state_slight_support: "§G약간의 지지§!"
 SIA_wing_state_neutral: "§Y중립§!"
 SIA_wing_state_opposition: "§R반대함§!"
 SIA_wing_state_rebellious: "§R반역 준비 중§!"
 SIA_civilian_wing_history_tt: "인민당의 민간 세력은 진보적인 행정가와 기술 관료들이 이끌고 있으며, 그중에서 가장 중요한 인물은 §Y쁘리디 파놈용§!입니다. 프랑스에서 법학을 공부한 쁘리디는 토지 개혁, 국가 경제 계획, 그리고 일반 민중에게 진정한 힘을 부여하는 입헌 민주주의를 실현하고자 하는 야망을 품고 귀국했습니다.\n\n민간 세력은 대체로 §G개발을 지지§!하며 교육, 기반시설, 산업에 대한 투자를 선호합니다. 이들은 과도한 군비 지출에 회의적이며 독재자 통치로의 전환을 경계합니다. 이들의 지지를 얻는 가장 쉬운 방법은 국가를 현대화하고 입헌 정부를 수호하는 정책입니다."
 SIA_military_wing_history_tt: "인민당의 군부 세력은 스스로를 진정한 혁명의 수호자로 여기는 군 장교들이 주도하고 있습니다. 그들 중에서 가장 야심 찬 인물은 §Y쁠랙 피분송크람§! 대령으로서, 유럽의 민족주의 운동에 대한 그의 동경심은 해가 갈수록 커지고 있습니다.\n\n군부 세력은 §G재무장을 지지§!하며 강력한 중앙집권 국가를 지향합니다. 그들은 쁘리디의 경제사상을 위험할 정도로 급진적이라고 여겨 의심하며, 방위 문제에 대하여 민간의 간섭을 용납하지 않습니다. 그들의 충성심은 군사 투자와 국가의 힘을 투사하는 정책을 통해 가장 쉽게 확보할 수 있습니다."
 idea_SIA_wing_promotion_disruption: "세력 재편"
 idea_SIA_wing_promotion_disruption_desc: "인민당의 한 분파를 노골적으로 편들면서 정부의 균형이 무너졌습니다. 홀대받은 파벌은 늑장을 부리고 있고, 군의 일상 업무는 혼란에 빠졌으며, 새 체제가 자리 잡을 때까지 일반 행정도 차질을 빚게 됩니다."
 idea_SIA_military_wing_unrest: "군부 세력의 반란"
 idea_SIA_military_wing_unrest_desc: "장교들의 인내심이 다시 한번 한계에 달했습니다. 권력을 완전히 장악하는 데 실패한 군부 세력은 이제 사보타주, 탈영, 노골적인 비협조를 통해 분노를 표출하고 있습니다. 불만 세력이 굴복할 때까지 군의 전투 역량은 급격히 약화될 것입니다."
 idea_SIA_civilian_wing_unrest: "민간 세력의 반란"
 idea_SIA_civilian_wing_unrest_desc: "쁘리디의 파벌이 다시 정부에 대한 신뢰를 잃었습니다. 두 번째 집권 기회를 거부당한 민간 세력은 파업, 관료적 방해, 도시 선동에 나서고 있습니다. 분노가 가라앉을 때까지 경제는 마비되고 국가는 통제 불능에 가까워질 것입니다."
 idea_SIA_unwavering_civilian_support: "흔들림 없는 민간 지지"
 idea_SIA_unwavering_civilian_support_desc: "군부 세력이 해산되고 정통성에 대한 논란도 끝난 지금, 민간 행정부에 도전할 세력은 없습니다. 군의 간섭에서 벗어난 쁘리디의 기술관료들은 과거 연립 정부에서는 상상할 수 없던 열정으로 국정에 매진하고 있습니다."
 idea_SIA_unified_khana_ratsadon: "연합인민당"
 idea_SIA_unified_khana_ratsadon_desc: "군인과 문민 사이의 오랜 다툼은 끝났습니다. 인민당의 두 분파가 마침내 같은 방향으로 나아가게 되었고, 이제 정부는 이전에는 없던 통일된 목표 아래 행동할 수 있습니다. 군인과 행정가, 산업가가 이제 한 몸처럼 협력합니다."
