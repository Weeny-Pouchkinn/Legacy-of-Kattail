 NZL_railways_board: "정부 철도위원회"
 NZL_railways_board_desc: "정부 철도위원회는 1931년 철도부를 개편하여 정부 부처로부터 의사결정을 분리하기 위하여 설립되었습니다. 그러나 설립 이후에 철도망이 개선되는 모습은 거의 보이지 않고 있습니다. 이에 따라 정부가 이 위원회를 폐지하고 직접 통제권을 되찾아야 한다는 압력이 거세지고 있습니다."
 NZL_great_depression: "대공황"
 NZL_great_depression_desc: "1929년 세계 경제의 붕괴는 농업 중심 경제였던 뉴질랜드에 매우 큰 타격을 입혔습니다. 여러 국가가 뉴질랜드산 농산물 구매를 줄이면서 많은 사람이 실직했고, 이는 소비자의 구매력 감소로 이어져 다른 산업들마저 붕괴되었습니다. 수년간의 긴축 정책으로 인해 뉴질랜드는 새로운 방향 전환을 간절히 바라고 있습니다."
 NZL_commonwealth_loyalty: "영연방에 대한 충성"
 NZL_commonwealth_loyalty_desc: "뉴질랜드는 여전히 영연방의 충실한 회원국이며 영국 국왕을 정당한 국가 원수로 유지하고 있습니다. 뉴질랜드의 경제 또한 광범위한 제국 경제 체제에 깊이 통합되어 있습니다."
 NZL_national_coal_board_idea: "국가석탄위원회"
