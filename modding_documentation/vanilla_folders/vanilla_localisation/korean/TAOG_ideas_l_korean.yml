 AST_faction_training_initiative_idea_1: "훈련 계획"
 AST_faction_training_initiative_idea_1_desc: "태평양 저항군의 합동 훈련 계획은 모든 연합군 병사가 똑같이 엄격한 군사 훈련을 받을 수 있도록 보장하는 회원국 간의 협력 프로그램입니다."
