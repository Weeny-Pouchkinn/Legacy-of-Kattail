 idea_INS_volksraad: "인민참사회"
 idea_INS_volksraad_desc: "인민참사회는 네덜란드가 1918년 \"윤리 정책\"의 일환으로 설립한 의회로, 제도 전역의 다양한 소수 민족과 문화를 대표할 수 있는 준민주주의 체제를 구축하는 것을 목표로 합니다. 이론상으로는 민주적인 제도지만, 총독과 네덜란드 국왕은 무조건적인 거부권을 행사할 수 있습니다."
 INS_volksraad_custom_tt: "§Y인민참사회 고문§!을 고용할 수 있습니다\n§Y인민참사회 결정§!을 이용할 수 있습니다"
 INS_great_depression: "대공황"
 INS_great_depression_desc: "대공황이 동인도 제도에 미친 직접적인 영향은 크지 않지만, 고무와 석유 같은 원자재의 지속적인 수출에 의존하는 동인도 제도의 경제는 대공황 이후에 전 세계 국가들이 시행한 보호주의 정책으로 인해 심각한 타격을 입었습니다."
 INS_great_depression_tt: "§Y$INS_great_depression$§! 변동치:"
 INS_dutch_east_indies: "부실한 행정"
 INS_dutch_east_indies_desc: "동인도 제도는 수백 가지의 서로 다른 문화와 언어가 공존하는 광활한 제도로, 행정이 매우 어려운 식민지로 악명이 높습니다. 여러 차례의 독립운동, 문화적 장벽, 그리고 대공황의 경제적 여파는 이러한 문제를 더 악화시켰고, 행정부는 매우 비효율적으로 운영되고 있습니다. 1918년에 제정된 \"윤리 정책\"은 윤리적인 노동 규정을 의무화하고 소수 집단에게 민주적 대표권을 부여함으로써 상황을 개선하고자 했지만, 대공황으로 인해 대부분 제대로 시행되지 못했습니다."
 INS_dutch_east_indies_tt: "§Y$INS_dutch_east_indies$§! 변동치:"
 INS_volksraad_tt: "§Y$INS_dutch_east_indies$§! 변동치:"
 INS_royal_netherlands_east_indies_army_desc: "왕립 네덜란드령 동인도군(KNIL)은 오랜 역사를 지닌 동인도 제도의 군대로, 네덜란드와는 독립적으로 운영되는 동인도 제도의 군대입니다. 유럽인과 인도네시아인 병사로 구성되어 있지만, 제도의 다양한 문화들은 물론 네덜란드까지 포함하여 생기는 문화적 및 언어적 장벽으로 인해 모병이 어렵고 더디게 진행됩니다."
 idea_INS_netherlands_most_precious_jewel: "네덜란드의 가장 귀중한 보석"
 idea_INS_netherlands_most_precious_jewel_desc: "네덜란드령 동인도는 약 350년 동안 네덜란드의 식민지였으며, 식민지 행정부는 네덜란드 정부와 긴밀하게 통합되어 있습니다. 동인도 제도는 흔히 \"네덜란드 왕관의 보석\"이라고 불리며, 네덜란드는 이 소중한 보석에 대한 지배력을 느슨하게 할 의사를 전혀 보이지 않습니다."
 INS_netherlands_most_precious_jewel_tt: "£GFX_trigger_no 자치도를 자유로 상향 가능"
