 AST_singapore_strategy_idea: "싱가포르 방어 건설"
 AST_singapore_strategy_idea_desc: "호주의 요청에 따라 싱가포르의 방어 체계 개선에 힘쓸 것입니다. 결국 싱가포르 전략은 태평양 방위 정책의 핵심이기 때문입니다.\n\n§W§Y제거 시§! (§Y싱가포르§!):\n §G2§!개의 §Y공군기지§!를 추가합니다.\n §G2§!개의 §Y해군기지§!를 추가합니다.\n §G1§!개의 §Y해안 요새§!를 추가합니다.§!\n"
