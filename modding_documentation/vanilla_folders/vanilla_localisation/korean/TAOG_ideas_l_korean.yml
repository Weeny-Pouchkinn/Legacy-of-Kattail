 AST_poor_population_growth: "낮은 인구 증가율"
 AST_poor_population_growth_desc: "1929년 대공황이 닥치자, 호주의 출산율은 급격히 떨어졌습니다. 여기에 이민자 감소가 맞물려 인구 증가율은 그 이후로 잘 회복되지 않고 있습니다."
