 AST_unratified_westminster_act_idea_desc: "1931년에 통과된 웨스트민스터 법령은 [ENG.GetNameDef] 자치령의 주권 강화를 허용했습니다. 우리가 이 법령을 비준하면 영국 의회가 [AST.GetName]에 행사할 수 있는 입법 권한의 대부분이 박탈될 것입니다."
