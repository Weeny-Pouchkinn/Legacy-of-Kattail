 ABDA_supreme_command: "ABDA최고사령부"
 ABDA_supreme_command_desc: "미국-영국-네덜란드-호주 합동사령부는 모든 회원국 해군의 통일된 해군 교리를 수립했습니다. 동맹이 강화됨에 따라 정보 공유, 조정된 초계 임무, 그리고 상호 군수 지원은 ABDA사령부의 깃발 아래 운용되는 모든 함대의 전투력을 꾸준히 향상시키고 있습니다."
