 ###### CZECHOSLOVAKIA ######
 CZE_sudeten_promise_mission: "주데텐란트 약속"
 CZE_sudeten_promise_mission_desc: "주데텐란트의 준군사조직을 지원함으로써, 우리는 그들이 [CZE.GETNAME]에서 벗어나 우리 편에 합류하도록 지원하겠다고 약속했습니다. 이 약속을 어길 경우 정치적 반발이 초래될 것입니다."
 CZE_recall_zdenko_hudecek: "§Y$CZE_zdenko_hudecek$§! 소환"
 CZE_a_divided_nation_category: "국가 분열"
 CZE_a_divided_nation_category_desc: "더 이상 무시하거나 묵살할 수 없는 국내의 다양한 운동으로 인해 정부에 대한 분노가 커지고 있습니다. 이러한 문제를 해결하면 국가를 분열시키려는 세력이 약화될 것입니다. 적어도 한동안은 말입니다."
 CZE_a_divided_nation_category_tt: "결정 선택: §Y$CZE_a_divided_nation_bridge_the_divide_fake$§!"
 CZE_a_divided_nation_category_2_tt: "§Y선택 시 효과§!:\n§Y$CZE_a_divided_nation_category$§! 결정이 잠금 해제되며, 이 결정은 우리 §Y국가§!에서 부정적인 주 변동치를 §Y제거§!하며 또한 §Y$CZE_a_divided_nation_dynamic_modifier$ 국민정신§!이 §Y제거§!될 때까지 이 국민정신의 부정적인 변동치를 감소시킬 것입니다."
 CZE_a_divided_nation_category_3_tt: "§Y$CZE_a_divided_nation_category$§! 결정이 잠금 해제되며, 이 결정은 우리 §Y국가§!에서 부정적인 주 변동치를 §Y제거§!하며 또한 §Y$CZE_a_divided_nation_dynamic_modifier$ 국민정신§!이 §Y제거§!될 때까지 이 국민정신의 부정적인 변동치를 감소시킬 것입니다."
