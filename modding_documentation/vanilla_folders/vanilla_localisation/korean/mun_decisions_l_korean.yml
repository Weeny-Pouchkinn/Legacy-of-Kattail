 ###FORT DECISIONS###
 CZE_the_second_fortification_program_category: "요새화 계획"
 CZE_the_second_fortification_program_category_desc: "우리 나라들의 불리한 국경은 시급한 국가 안보 문제입니다. 주변 국가들은 자신들에게 유리하도록 우리 국경을 새로 정할 의사가 있음을 분명히 밝혔습니다. 국경을 계속 요새화한다면, 잠재적인 적들은 우리를 공격하기 전에 신중하게 생각하게 될 것입니다."
 CZE_fate_of_the_ro: "요새화 위원회의 운명"
 CZE_fate_of_the_ro_desc: "요새화 위원회는 요새화 사업과 관련된 자금을 모으는 역할을 합니다. 만약 이 자금이 어떤 용도로든 빨리 사용되지 않는다면, 사람들은 애초에 그 자금을 모은 목적이 무엇인지 의문을 품기 시작할 것입니다."
 CZE_bop_army_bunker_maintenance: "요새 유지보수"
 CZE_bop_army_bunker_maintenance_desc: "요새를 적절히 유지보수하고 사용할 준비를 갖추어 놓으면 필요할 때 육군이 믿음을 가지고 요새를 이용할 수 있습니다."
 CZE_fortification_research: "요새화 연구"
 CZE_fortification_research_desc: "국경을 요새화해야 할 필요성은 분명하지만, 문제는 어떻게 하느냐입니다. 연구를 통해 이 질문에 대한 답을 찾을 수 있을 것입니다."
 CZE_fortification_research_tt: "§Y$CZE_directorate_of_fortification_works_no_gd_idea$§! 국민정신 보유"
 CZE_fortification_research_subtract_variable_tt: "이후의 모든 §Y요새화 계획§! 결정이 §Y30§!일 일찍 §Y완료§!됩니다"
 CZE_fortification_decision_inprogress: "이미 다른 요새화 계획을 실행 중"
 CZE_second_sudetenland_fortification_program: "제2차 주데텐란트 요새화 계획"
 CZE_second_sudetenland_fortification_program_desc: "독일과의 국경이며 산악 지대인 주데텐란트는 국경 요새를 구축하기에 최적의 장소입니다. 프랑스의 마지노선을 연구했으니, 우리도 비슷한 방어선을 구축할 수 있습니다."
 CZE_third_sudetenland_fortification_program: "제3차 주데텐란트 요새화 계획"
 CZE_third_sudetenland_fortification_program_desc: "주데텐란트는 이제 괜찮은 방어선이 되었지만, 국가의 생존이 위태로운 상황에서는 괜찮은 방어선만으로는 충분하지 않습니다."
 CZE_fourth_sudetenland_fortification_program: "제4차 주데텐란트 요새화 계획"
 CZE_fourth_sudetenland_fortification_program_desc: "주데텐란트는 강력한 요새화 체계를 갖추었지만, 아직 더 강력해질 수 있습니다."
 CZE_fortify_the_crossroads_with_slo: "교차로 요새화"
 CZE_fortify_the_crossroads_with_slo_desc: "어떤 요새 체계라도 무너질 수 있습니다. 이러한 사태에 대비하여 아주 중요한 도시들 주변에 요새를 건설하면, 우리 진영을 돌파하는 적에게 쉽게 함락되지 않도록 할 수 있습니다."
 CZE_fortify_the_hungarian_border_with_73: "헝가리 국경 요새화"
 CZE_fortify_the_hungarian_border_with_73_desc: "헝가리의 실지회복주의는 우리 국가에게 지속적으로 위협이 되어 왔습니다. 헝가리와의 국경을 따라 요새 체계를 구축하는 것은 우리의 안전을 보장하는 데 도움이 될 것입니다."
 CZE_fortify_the_polish_border_with_72: "폴란드 국경 요새화"
 CZE_fortify_the_polish_border_with_72_desc: "폴란드의 공격성은 상대를 가리지 않지만, 잘 요새화된 국경이 있으면 더 쉬운 표적을 찾게 될 것입니다."
 ###### ARMY READINESS BALANCE OF POWER ######
 CZE_bop_ready_for_anything: "£GFX_power_balance_texticon 만반의 준비 완료"
 CZE_bop_ready_for_anything_tt: "국민정신 미보유"
 CZE_bop_no_divided_nation_tt: "국민정신 §Y$CZE_a_divided_nation_dynamic_modifier$§! 미보유"
 CZE_bop_no_agrarians_tt: "$CZE_bop_ready_for_anything_tt$§Y$CZE_agrarian_politics_1$§!"
 CZE_bop_no_industrialists_tt: "$CZE_bop_ready_for_anything_tt$§Y$CZE_industrialists_veto$§!"
 CZE_bop_no_industrialists_with_space_tt: "$CZE_bop_ready_for_anything_tt$§Y$CZE_industrialists_veto$§!\n\n"
 CZE_bop_car_rationing: "£BoP_right_texticon 자동차 할당제"
 CZE_embezzle_quatermaster_funds: "£BoP_left_texticon 병참 자금 횡령"
 CZE_embezzle_quatermaster_funds_desc: "우리 병사들은 이미 잘 관리되고 있습니다. 우리 병영에 쓰일 예정이었던 자금 일부가 다른 데 쓰인다고 해도 아무도 눈치채거나 신경 쓰지 않을 겁니다."
 CZE_prioritize_export_contracts: "£BoP_left_texticon 수출 계약 우선"
 CZE_prioritize_export_contracts_desc: "우리의 수출 산업은 대공황을 극복하는 데 큰 도움이 되었습니다. 지금 우리의 행동을 바꿀 필요가 있을까요? 어차피 우리 국가에 대한 위협은 과장된 것입니다. 우리 군대는 나중으로 미뤄 놔도 괜찮을 겁니다."
 CZE_focus_on_export_designs: "£BoP_left_texticon 수출 설계 중점"
 CZE_focus_on_export_designs_desc: "우리 군대는 우리 설계에 대해 매우 까다로운 기준을 가지고 있습니다. 수출 시장은 더 관대하고, 우리 군대를 위한 국내 설계의 자금을 마련하는 데도 도움이 됩니다. 그러니 군대는 우리가 그들의 연구 개발 비용을 절감해준 것에 대해 진심으로 감사해야 할 것입니다."
 CZE_bop_reservist_training: "£BoP_right_texticon 예비군 훈련"
 CZE_junior_officer_recruitment: "£BoP_right_texticon 하급 장교 모집"
 CZE_send_foreign_attaches: "£BoP_right_texticon 해외 주재무관 파견"
 CZE_send_observers_to_the_italo_ethiopian_war: "£BoP_right_texticon 에티오피아에 관찰자 파견"
 CZE_send_observers_to_the_italo_ethiopian_war_bonus: "이탈리아-에티오피아 전쟁에 관찰자 파견함"
