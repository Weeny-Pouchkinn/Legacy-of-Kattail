 CZE_autonomous_sentiment: "자치 정서"
 CZE_autonomous_sentiment_desc: "자치 블록과의 동맹에는 몇 가지 단점이 있습니다. 그중 하나는 [SLO.getname]에 자치권을 주라는 그들의 요구를 들어줘야 한다는 겁니다. 우리 국가의 다른 지역들도 비슷한 대우를 원할 수 있습니다."
