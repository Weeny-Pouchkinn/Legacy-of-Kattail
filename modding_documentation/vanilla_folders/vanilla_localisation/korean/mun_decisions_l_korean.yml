 CZE_a_divided_nation_czech_states_desc: "숙련된 인력이 부족하여 우리 국가 중부 지역의 산업이 빠르게 성장하지 못하고 있습니다. 우리는 성장하는 산업에서 일할 국민들이 더 좋은 교육을 받게 하는 계획에 투자해야 합니다."
