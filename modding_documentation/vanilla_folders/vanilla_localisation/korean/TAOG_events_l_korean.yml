 ### INS - Political Events
 INS_political_events.1.t: "[INS.GetNameDef]의 새로운 총독"
 INS_political_events.1.desc: "[INS.GetLeader]의 5년 임기가 끝나가고 있으므로, 이제 그 자리를 이을 적임자를 결정해야 합니다. 빌헬미나 여왕께서는 특명전권대사 겸 공사로서 뛰어난 역량을 보여준 알리디위스 차르다 판 스타르켄보르흐 스타하우버르를 추천하셨습니다."
 INS_political_events.1.a: "여왕께서 원하시는 대로."
 INS_political_events.1.b: "[INS.GetLeader](은)는 잘 해왔다, 다음 임기에도 계속 공헌해야 한다."
 INS_political_events.2.t: "[FROM.GetName]의 [721.GetName] 소유권 요구"
 INS_political_events.2.desc: "옛 동인도 제도에 들어선 새로운 공화국 정부는 이 제도 전체를 자국 영토라고 선언했습니다. [FROM.GetLeader](은)는 우리에게 [721.GetName] 영토를 포기하라는 공식 요구를 보내오면서, 거부할 경우 군사 행동을 취하겠다고 위협했습니다."
 INS_political_events.2.a: "좋다, 굳이 일을 크게 벌일 필요는 없지."
 INS_political_events.2.b: "어림도 없는 소리!"
 INS_political_events.3.t: "[FROM.GetName]의 [721.GetName] 포기 동의"
 INS_political_events.3.desc: "예상대로 [FROM.GetLeader](은)는 우리의 요구를 받아들이고 [721.GetName]에서 군대를 철수시키기 시작했습니다. 인민안전군은 여러 명의 정부 사절과 함께 해당 지역에 진입했습니다. [INS.GetLeader]도 직접 딜리에서 연설하며 식민지 지배로부터의 해방을 선언했습니다."
 INS_political_events.3.a: "훌륭하군!"
 INS_political_events.4.t: "[FROM.GetName]의 [721.GetName] 포기 거부"
 INS_political_events.4.desc: "[FROM.GetName](와)과의 협상은 잘되지 않았습니다. [FROM.GetLeader](은)는 어떤 이유로든 [721.GetName](을)를 포기하지 않았고, 회견은 금방 끝났습니다."
 INS_political_events.4.a: "그러면 전쟁이다."
 INS_political_events.5.t: "인도네시아 총선거"
 INS_political_events.5.desc: "오늘은 인도네시아 역사에 중요한 날로 기록될 것입니다. 혁명이 공식적으로 종료됨에 따라, [INS.GetLeader] 총리는 인도네시아 역사상 최초의 자유롭고 민주적인 총선거가 실시될 것이라고 선언했습니다. 이번 선거의 결과는 인도네시아에 장기적인 영향을 미칠 것입니다."
 INS_political_events.5.a: "수탄 샤리르가 우리 나라를 여기까지 이끌어 왔으니, 앞으로도 우리를 더 이끌어 줄 것이다!"
 INS_political_events.5.b: "아미르 샤리푸딘이라면 사회주의자와 민족주의자 사이의 적절한 절충안이 될 것이다."
 INS_political_events.5.c: "모하맛 하타가 혁명을 시작했으니, 그가 완성할 것이다."
 INS_political_events.6.t: "준비의 결과"
 INS_political_events.6.desc: "혁명이 진행됨에 따라, 동인도 제도 행정부에 침투한 우리 게릴라들은 더 이상 비밀리에 활동할 필요가 없으며, 네덜란드가 대응할 시간을 갖기 전에 사보타주 임무를 수행하기 시작할 것입니다."
 INS_political_events.6.a: "신속히 행동해야겠군."
 INS_political_events.7.t: "수타르조 청원"
 INS_political_events.7.desc: "수타르조가 주도한, 인도네시아의 자치 요구를 논의할 네덜란드와 인도네시아 대표 간 원탁회의 개최를 요청하는 인민참사회 청원은 내부 논의를 마치고 총독의 승인을 받기 위해 넘어갔습니다. 다수의 고문들은 현상 유지가 필수적이므로 청원을 거부해야 한다고 주장하지만, 민족주의 운동이 더욱 강력해지고 급진화되고 있다는 사실은 부인할 수 없습니다. 평화적인 자치권 요구를 우리가 계속 거부한다면, 민족주의자들은 더 폭력적인 방법을 시도할지도 모릅니다."
 INS_political_events.7.a: "내전을 피하려면 협상을 개시해야겠군."
 INS_political_events.7.b: "현상 유지는 지속되어야 한다."
 INS_political_events.7.c: "민족주의자들이 맞을지도 모른다."
 INS_political_events.8.t: "[?event_target:INS_invasion_event_invader.GetAdjective] 점령 임박"
 INS_political_events.8.desc: "[?event_target:INS_invasion_event_invader.GetName]에서 온 병력들이 [?event_target:INS_invasion_event_invaded_state.GetName]에 도착했으며, 그 지역에 있는 우리 병력은 수적으로 매우 불리합니다. 이들에게 [?event_target:INS_invasion_event_invaded_state.GetName]에서의 전군 철수 명령이 내려졌으며, 이 명령은 이행될 것입니다. [?event_target:INS_invasion_event_invader.GetAdjective]군은 동인도 제도에서 계속해서 진격 중이며 우리가 점령을 피할 가능성은 암울합니다."
 INS_political_events.8.a: "민족주의자들을 체포하고 죽는 한이 있어도 우리 조국을 지킬 것이다!"
 INS_political_events.9.t: "인도네시아의 독립 선언"
 INS_political_events.9.desc: "[JAP.GetNameDef](이)가 동인도 제도에서 철수하기 시작하자, 우리는 식민 정부를 재건하기 위해 바타비아에 병력을 파견했습니다. 그러나 우리 병사들은 점령 이후 동인도 제도의 정치 지형이 상당히 바뀌어 있음을 알게 되었습니다. 우리 군대가 바타비아에 도착하기도 전에, [INS.GetLeader](은)는 이미 독립 선언서에 서명하고 인도네시아 공화국을 독립 국가로 선포했고, 대중의 막대한 지지를 등에 업고 있습니다."
 INS_political_events.9.a: "전차를 보내라!"
 INS_political_events.9.b: "더 이상 싸워도 소용이 없다. 우리는 조국 재건에 집중해야 한다."
 INS_political_events.11.t: "인도네시아의 주권을 인정한 [HOL.GetNameDefCap]"
 INS_political_events.11.desc: "독립을 선언하자마자, 우리 민병대는 예상되는 네덜란드의 침략으로부터 영토를 방어하기 위해 즉시 움직였습니다. 그러나 많은 이들의 예상과는 달리, [HOL.GetLeader](은) 침공을 감행하지 않겠다고 밝히며, 대신 네덜란드 본토의 재건과 추가적인 분쟁 방지를 우선시하겠다고 발표했습니다."
 INS_political_events.11.a: "놀랍지만, 반가운 소식이군."
 INS_political_events.12.t: "인도네시아 민족주의자들과 회담"
 INS_political_events.12.desc: "우리 군대가 [?event_target:INS_invasion_event_invaded_state.GetName]에 상륙했고 인도네시아 전선에서의 승리가 임박했습니다. 이제 인도네시아를 어떻게 점령할지 결정해야 합니다. 직접 점령을 통해 필요한 자원을 확보할 수 있겠지만, 비용이 많이 들고 어려울 것입니다. 우리는 저명한 혁명가인 수카르노와 협상을 진행했고, 인도네시아에 괴뢰 국가를 수립하는 계획을 세웠습니다. 이 국가는 공식적으로는 수카르노가 부분적으로 통치하지만, 실질적으로 우리의 통제 아래 놓이게 될 것입니다. 이렇게 하면 인도네시아 민심을 진정시킬 수 있고, 전면 점령보다 비용이 훨씬 적게 들 것입니다."
 INS_political_events.12.a: "우리는 수카르노와 계속해서 협상해야 한다."
 INS_political_events.12.b: "혁명가들과의 협력에는 관심 없다."
 INS_political_events.13.t: "[?event_target:INS_invasion_event_invader.GetAdjective] 점령 임박"
 INS_political_events.13.desc: "[?event_target:INS_invasion_event_invader.GetName]에서 온 병력들이 [?event_target:INS_invasion_event_invaded_state.GetName]에 도착했으며, 그 지역에 있는 우리 병력은 수적으로 매우 불리합니다. 이들에게 [?event_target:INS_invasion_event_invaded_state.GetName]에서의 전군 철수 명령이 내려졌으며, 이 명령은 이행될 것입니다. [?event_target:INS_invasion_event_invader.GetAdjective]군은 동인도 제도에서 계속해서 진격 중이며 우리가 점령을 피할 가능성은 암울합니다. 또한, 우리 첩보원들은 [?event_target:INS_invasion_event_invader.GetLeader](이)가 수카르노 및 다른 민족주의 지도자들과 협상하는 모습이 목격되었으며, 이는 공영권 아래에서 수카르노가 이끄는 인도네시아 괴뢰 국가를 건설하려는 목적이라고 보고했습니다."
 INS_political_events.13.a: "민족주의자들을 체포하고 죽는 한이 있어도 우리 조국을 지킬 것이다!"
 INS_political_events.13.b: "위험하군, 하지만 이건 독립국이 되기 위한 기회일지도 모른다."
 INS_peta_explain_tt: "[JAP.GetName](이)가 밀려난다면 점령으로 인한 혼란을 틈타 우리가 완전한 독립을 선언할 수 있게 될 것이다."
 INS_peta_explain_tt_jap: "§R[INS.GetName](은)는 우리를 따르고 있지만, 우리가 그 영토에 대한 지배력을 잃으면 우리에게 불복하고 독립을 선언할 것입니다§!."
 INS_political_events.14.t: "체포된 민족주의 지도자들"
 INS_political_events.14.desc: "네덜란드 헌병대는 우리가 괴뢰 정권을 수립하기도 전에 수카르노를 비롯한 인도네시아의 주요 혁명가들을 체포했습니다."
 INS_political_events.14.a: "유감이군, 가치 있는 동맹이 될 수도 있었을 텐데."
 INS_political_events.15.t: "향토방위의용군"
 INS_political_events.15.desc: "수카르노와의 협상이 마무리되었고, 인도네시아에서는 괴뢰 정권 수립이 진행되고 있습니다. 수카르노는 자신의 인맥과 우리의 군사력을 이용하여 네덜란드 정부를 불안정하게 만들고 이 제도에 대한 실질적인 통제권을 확립했습니다."
 INS_political_events.15.a: "저렴한 자원을 확보했을 뿐만 아니라, 가치 있는 동맹도 얻었군."
 INS_political_events.16.t: "[?event_target:INS_invasion_event_invader.GetAdjective]의 동인도 제도 점령"
 INS_political_events.16.desc: "동인도 제도에 주둔한 [?event_target:INS_invasion_event_invader.GetAdjective] 병력은 인도네시아 민족주의자들과 협력하여 우리 식민지 행정을 불안정하게 만들고, 동인도 제도를 완전히 점령했습니다. 네덜란드 국기는 내려지고 인도네시아 국기가 게양되었으며, 동인도의 토착민들은 [?event_target:INS_invasion_event_invader.GetAdjective] 점령군을 환영하는 모습을 보이고 있습니다. 우리 식민 제국에는 좋지 않은 상황입니다."
 INS_political_events.16.a: "그들이 전투에서는 이겼을지 몰라도, 전쟁에서 이긴 건 아니다."
 INS_political_events.17.t: "[INS.GetName]의 독립 선언"
 INS_political_events.17.desc: "대본영에 바타비아로부터 소식이 전해졌습니다. 천황 폐하의 이름으로 섬들을 통치하도록 우리가 정부를 세워 준 수카르노와 그의 파벌이, 우리가 병력 부족으로 아무것도 할 수 없다고 판단하여 잇따른 영토 손실에 대한 대응으로 [FROM.GetAdjective] 공화국을 선포했다고 합니다."
 INS_political_events.17.a: "마음에 안 들지만, 그들이 옳을지도 모른다."
 INS_political_events.18.t: "인도네시아에 돌아온 탄 말라카"
 INS_political_events.18.desc: "지난 몇 년 동안 우리 정부의 신뢰받는 고문으로 활동해 온 인도네시아인 공산주의자, 탄 말라카가 곧바로 출국하겠다고 선언했습니다. 이제 [INS.GetNameDef](이)가 자유공화국이 되었으므로, 그는 20여 년 동안의 도피 생활을 마치고 마침내 고국으로 돌아갈 계획입니다. 그는 도피처와 활동의 자유를 제공해 준 우리에게 감사를 표하며, 이제 자신의 자리는 고향에 있다고 밝혔습니다."
 INS_political_events.18.a: "그에게 행운을 빌어주자."
 INS_political_events.19.t: "헬프리흐 제독을 소환하는 [HOL.GetName]"
 INS_political_events.19.desc: "우리 해군 지휘관이자 이 해역에서 가장 유능한 장교인 콘라트 헬프리흐 제독이 귀국 명령을 받았다는 소식이 [1058.GetName]에 전해졌습니다. 헤이그는 본국에서 그가 긴급하게 필요하다고 전했지만, 더 이상의 자세한 설명은 하지 않았습니다. 현재 우리의 입지가 불안정한 상황에서 그의 귀국은 이 제도의 방어를 더 취약하게 만들 것이며, 수라바야의 해군 장교들 사이에서도 불만이 크다고 합니다."
 INS_political_events.19.a: "함대에 매우 암울한 날이로다."
 ### INS - Industrial Events
 INS_industrial_events.4.t: "[FROM.FROM.GetName]에서의 예산 재할당"
 INS_industrial_events.4.desc: "[FROM.FROM.GetName]의 고무 농장을 폐쇄함으로써, 우리는 해당 지역의 새로운 산업 프로젝트를 위한 예산을 확보했습니다."
 INS_industrial_events.4.a: "[FROM.FROM.GetName]에 유전을 건설할 것이다."
 INS_industrial_events.4.b: "[FROM.FROM.GetName]에 알루미늄 제련소를 만들어야 한다."
 INS_industrial_events.4.c: "우리에게 생산량이 부족한 자원을 탐사해야 한다."
 INS_industrial_events.4.d: "[FROM.FROM.GetName]에 탄광을 만들면 좋겠군."
 INS_industrial_events.5.t: "[INS_industrial_events_5_t_scripted]"
 INS_industrial_events_5_t_colonial: "자바은행의 운명"
 INS_industrial_events_5_t_independent: "인도네시아 은행의 운명"
 INS_industrial_events.5.desc: "[INS_industrial_events_5_desc_scripted]"
 INS_industrial_events_5_desc_colonial: "자바은행의 준비금이 10년 만에 최저 수준으로 떨어졌습니다. 길더화의 매입은 매달 감소하고 있고, 농장주들은 외화로 지급을 요구하고 있습니다. 우리 금융 고문들은 은행 단독으로는 이러한 하락세를 되돌릴 수 없다는 데 동의하지만, 해결책에 대해서는 의견이 첨예하게 엇갈리고 있습니다."
 INS_industrial_events_5_desc_independent: "인도네시아 은행은 루피아화 가치가 지난 분기에만 거의 5분의 1이 하락했다고 보고했습니다. 수라바야의 쌀 상인들은 루피아화를 아예 받지 않고 외화를 받으려 하기 시작했습니다. 재무장관은 루피아화를 살릴 수 있다고 주장하지만, 이를 위해 지금 당장 단호하게 행동해야만 한다고 강조합니다."
 INS_industrial_events.5.a: "길더화를 강화해야 한다, 다른 통화로 교체해선 안 된다."
 INS_industrial_events.5.b: "동인도 길더를 네덜란드 길더에 연동시킬 것이다."
 INS_industrial_events.5.c: "동인도 길더를 미국 달러에 연동시킬 것이다."
 INS_industrial_events.6.t: "더 유리한 협정"
 INS_industrial_events.6.desc: "기나국이 우리의 조건을 받아들였습니다. 열대 지방의 절반이 말라리아에 시달리고 있고 퀴닌을 대체할 만한 약이 마땅치 않은 상황이므로 그들에게는 선택의 여지가 거의 없었습니다. 이 새로운 협정을 통해 우리는 자국에서 수출되는 모든 퀴닌 1그램당 훨씬 더 많은 수익을 보장받게 되었습니다. 이제 이 막대한 수익을 어디에 투자할 것인지가 문제입니다."
 INS_industrial_events.6.a: "우리 도시에 투자하자."
 INS_industrial_events.6.b: "외곽의 섬들을 개발하자."
 INS_industrial_events.6.c: "우리 군수산업을 강화하자."
 # Rubber shipment dispatched
 INS_industrial_events.28.t: "고무 운송 발송"
 INS_industrial_events.28.desc: "수송선들이 마지막 고무를 싣고 출항했습니다. 구매자들은 지불한 만큼의 대가를 받게 될 것이고, 우리 장부에는 이 합의된 보상금이 차차 반영될 것입니다. 향후 2년간 이 거래 비용은 우리 대차대조표에 기록되어, 대공황이 우리에게 요구하는 바를 상기시켜 줄 것입니다."
 INS_industrial_events.28.a: "알겠다."
 INS_industrial_events.28.b: "다음 운송을 준비하라."
 # Oil shipment dispatched
 INS_industrial_events.36.t: "석유 운송 발송"
 INS_industrial_events.36.desc: "유조선들이 우리 정유소를 떠나 구매자의 항구로 향하고 있습니다. 보상금은 합의되었으며 전액 지급될 것이지만, 이번 매각으로 인한 부담은 앞으로 2년간 우리 경제가 짊어질 것입니다. 이 어려운 시기에 세계가 우리에게 제시하는 조건이란 이런 것입니다."
 INS_industrial_events.36.a: "알겠다."
 INS_industrial_events.36.b: "다음 운송을 준비하라."
 ### INS - Volksraad
 INS_volksraad_events.2.t: "[HOL.GetLeader](이)가 인민참사회 청원을 거부했습니다."
 INS_volksraad_events.2.desc: "[INS.GetLeader](이)가 해당 청원을 승인했지만, [HOL.GetLeader]의 검토 후 거부권이 행사되어 지금은 시행을 계속할 수가 없습니다."
 INS_volksraad_events.2.a: "다음에는 비준을 받은 청원으로 다시 시도해 봐야겠군."
 # Generic/Reused
 INS_volksraad_events.10.t: "학교에서의 인도네시아어 허용을 발의한 인민참사회"
 INS_volksraad_events.10.desc: "[INS.GetLeader](은)는 [INS.GetNameDef]의 인도네시아어를 사용하는 학교와 대학교 설립을 장려하는 인민참사회 청원을 승인했으며, 이 청원은 최종 승인을 위해 [HOL.GetLeader]에게 송부되었습니다."
 INS_volksraad_events.10.a: "인민참사회가 제 몫을 하는군."
 INS_volksraad_events.10.b: "절대 안 된다. 거부권을 사용한다!"
 INS_volksraad_events.11.t: "인도네시아어 교육이 시작될 것입니다."
 INS_volksraad_events.11.desc: "[HOL.GetLeader](이)가 이 청원에 서명하며, 이 청원은 공식 명령이 되었습니다. 청원의 시행은 최종 세부 사항이 결정되는 대로 곧 시작될 예정입니다."
 INS_volksraad_events.11.a: "인민참사회가 제 몫을 하는군."
 # Individual laws
 INS_volksraad_events.20.t: "정부에서의 인도네시아어 허용을 발의한 인민참사회"
 INS_volksraad_events.20.desc: "인민참사회를 포함한 동인도 제도에서의 모든 정부 직책은 네덜란드어 구사 능력을 요구하는데, 이로 인해 인민참사회 의원들, 특히 원주민 공동체 대표들은 이것이 민주주의에 맞는 현실인지 의문을 제기해 왔습니다. 이에 그들은 가능한 경우 인도네시아어 구사자도 정부 직책을 맡을 수 있어야 한다는 내용의 결의안을 제출했습니다."
 INS_volksraad_events.21.t: "이제 정부에서 인도네시아어가 허용됩니다!"
 INS_volksraad_events.21.desc: "[HOL.GetLeader](이)가 이 청원에 서명하며, 이 청원은 공식 명령이 되었습니다. 청원의 시행은 최종 세부 사항이 결정되는 대로 곧 시작될 예정입니다."
 INS_volksraad_events.30.t: "교육 할당제 폐지를 발의한 인민참사회"
 INS_volksraad_events.30.desc: "[INS.GetLeader](은)는 인민참사회 내에서 그 운영 방식과 공정성을 둘러싸고 오랫동안 이어져 온 논쟁을 끝내기 위해, [INS.GetNameDef]의 교육 할당제 폐지를 위한 인민참사회 청원을 승인했습니다. 이 청원은 최종 승인을 위해 [HOL.GetLeader]에게 송부되었습니다."
 INS_volksraad_events.31.t: "교육 할당제가 폐지되었습니다."
 INS_volksraad_events.31.desc: "[HOL.GetLeader](이)가 이 청원에 서명하며, 이 청원은 공식 명령이 되었습니다. 청원의 시행은 최종 세부 사항이 결정되는 대로 곧 시작될 예정입니다."
 INS_volksraad_events.40.t: "고무의 수출세 인하를 발의한 인민참사회"
 INS_volksraad_events.40.desc: "[INS.GetLeader](은)는 민간 소유의 고무 농장에 부과되는 높은 세금을 인하하기 위한 인민참사회 청원서에 서명하고 승인했습니다. 이러한 세금은 역사적으로 정부의 고무 독점을 가능하게 하여 정부가 막대한 수익을 올릴 수 있었지만, 현재는 국제적인 보호무역주의로 인해 수익성이 크게 떨어졌습니다. [INS.GetLeader](은)는 더 이상 이러한 세금이 초래하는 경제적 손실이 보전되지 않는다고 주장했습니다."
 INS_volksraad_events.40.a: "일리 있는 말이군."
 INS_volksraad_events.40.b: "세금은 유지될 것이다."
 INS_volksraad_events.41.t: "민간의 고무 수출에 대한 세금이 인하되었습니다."
 INS_volksraad_events.41.desc: "[HOL.GetLeader](이)가 이 청원에 서명하며, 이 청원은 공식 명령이 되었습니다. 청원의 시행은 최종 세부 사항이 결정되는 대로 곧 시작될 예정입니다."
 INS_volksraad_events.60.t: "인도네시아인 장교에 대한 계급 제한 불문율 철폐를 발의한 인민참사회"
 INS_volksraad_events.60.desc: "[INS.GetLeader](은)는 비네덜란드 국적의 왕립 네덜란드령 동인도군 장교가 받을 수 있는 계급을 제한하는 불문율을 철폐하고, 공적에 비해 계급이 낮다고 판단되는 인도네시아인 장교들을 승진시켜 달라는 청원을 승인했습니다. 이 청원은 최종 승인을 위해 [HOL.GetLeader]에게 송부되었습니다."
 INS_volksraad_events.61.t: "[INS.GetAdjective] 장군에 대한 보이지 않는 천장이 폐지되었습니다."
 INS_volksraad_events.61.desc: "[HOL.GetLeader](이)가 이 청원에 서명하며, 이 청원은 공식 명령이 되었습니다. 청원의 시행은 최종 세부 사항이 결정되는 대로 곧 시작될 예정입니다."
 INS_volksraad_events.70.t: "민족주의 깃발과 형상의 공개 전시 합법화를 발의한 인민참사회"
 INS_volksraad_events.70.desc: "[INS.GetLeader](은)는 주로 젊은 민족주의자들의 급진화를 줄이기 위해 [INS.GetNameDef]의 공공장소에서 민족주의 깃발과 형상 전시에 대한 제한을 철폐하자는 인민참사회의 청원을 승인했습니다. [INS.GetLeader](은)는 우리가 이 문제에 대해 방어적인 태도를 보이고 평화로운 민족주의 지도자들과 협력하면서 혁명 운동의 뿌리를 내려야 한다고 주장하지만, 최종 결정은 결국 우리에게 달려 있습니다."
 INS_volksraad_events.71.t: "적색과 백색 깃발 전시 합법화!"
 INS_volksraad_events.71.desc: "[HOL.GetLeader](이)가 이 청원에 서명하며, 이 청원은 공식 명령이 되었습니다. 청원의 시행은 최종 세부 사항이 결정되는 대로 곧 시작될 예정입니다."
 INS_volksraad_events.100.t: "비네덜란드인 거주민을 위한 교육 보조금 허용을 발의한 인민참사회"
 INS_volksraad_events.100.desc: "[INS.GetLeader](은)는 [INS.GetNameDef]의 비네덜란드인 거주민을 위한 교육 보조금 신청을 허용하는 인민참사회 청원을 승인했으며, 이 청원은 최종 승인을 위해 [HOL.GetLeader]에게 송부되었습니다."
 INS_volksraad_events.101.t: "[INS.GetAdjective]인은 이제 교육 보조금을 신청할 수 있습니다."
 INS_volksraad_events.101.desc: "[HOL.GetLeader](이)가 이 청원에 서명하며, 이 청원은 공식 명령이 되었습니다. 청원의 시행은 최종 세부 사항이 결정되는 대로 곧 시작될 예정입니다."
 ### INS - Dutch Interaction Events
 INS_dutch_events.1.t: "[INS.GetNameDefCap]의 해군 통제권 요청"
 INS_dutch_events.1.desc: "우리 본토가 함락된 후, [INS.GetNameDef](은) 우리 해군의 지휘권을 [INS.GetNameDef]에 이양해 줄 것을 청원했습니다. 그들은 통합된 지휘 체계가 이 전례 없는 시기에 더 나은 협력을 가능하게 할 것이라고 주장합니다."
 INS_dutch_events.1.a: "그런 이유라면, 이양해야겠지."
 INS_dutch_events.1.b: "우리 함선들은 헤이그의 명령만 듣는다."
 INS_dutch_events.2.t: "[HOL.GetNameDefCap]의 해군 지휘권 제안 수락"
 INS_dutch_events.2.desc: "[HOL.GetNameDefCap](은)는 합동 해군 사령부의 지휘권을 우리에게 이양하자는 우리의 제안을 받아들였습니다. 인수인계는 순조롭게 진행되고 있으며, [HOL.GetAdjective] 및 [INS.GetAdjective]의 장교들은 태평양에서 우리의 입지를 강화하기 위해 긴밀히 협력하고 있습니다."
 INS_dutch_events.2.a: "우리는 함께 태평양을 지킬 것이다."
 INS_dutch_events.3.t: "[HOL.GetNameDefCap]의 해군 지휘권 제안 거절"
 INS_dutch_events.3.desc: "[HOL.GetNameDefCap](은)는 군수 및 행정에 대한 우려를 이유로 우리의 해군 사령부 통합 제안을 거절했습니다. 실망스럽지만, 우리는 다른 경로의 전쟁 활동을 통해 협력을 지속할 것입니다."
 INS_dutch_events.3.a: "다른 방법으로 우리 해군 영향력을 강화할 수 있을 거다."
 INS_dutch_events.4.t: "[HOL.GetNameDefCap]의 [HOL.GetName]-[INS.GetName] 해군 계획 수립"
 INS_dutch_events.4.desc: "[HOL.GetNameDefCap](은)는 해군을 재편 및 확장하기 위한 공동 계획인 [HOL.GetName]-[INS.GetName] 해군 계획의 탄생을 발표했습니다. [HOL.GetAdjective]의 전문 지식과 [INS.GetAdjective]의 인력이 새로운 태평양 방어망의 핵심이 될 것입니다."
 INS_dutch_events.4.a: "이것은 상호 생존을 위한 단호한 한 걸음이다."
 ### INS - Netherlands–Indonesia Union Events
 INS_union_events.1.t: "정부를 [1058.GetName]으로 이전할 것을 요청하는 [HOL.GetNameDefCap]"
 INS_union_events.1.desc: "본토를 잃은 [HOL.GetNameDef](은)는 우리에게 정부와 왕실이 [1058.GetName](으)로 이전할 것이라고 알려왔습니다. 그들은 불가피성, 연속성, 그리고 깃발이 여전히 휘날리는 곳에서 왕국을 유지해야 할 필요성에 대해 언급했습니다."
 INS_union_events.1.a: "[1058.GetName]에서 전쟁이 계속됩니다."
 INS_union_events.1.b: "자기들이 뭐라도 되는 줄 아는 건가?! 이것은 식민 지배를 재확인하려는 수작에 불과하다!"
 INS_union_events.2.t: "[INS.GetNameDefCap]의 이전 제안 수락"
 INS_union_events.2.desc: "[INS.GetNameDefCap](은)는 우리 망명정부를 [1058.GetName]에 받아들이는 데 동의했습니다. 이전 준비가 진행 중이며, 양측 행정부는 행정 조직과 인력 통합을 조율하고 있습니다. 우리는 함께 동방에서 왕국의 불씨를 이어 나갈 것입니다."
 INS_union_events.2.a: "공동의 적에 대한 공동 전선이군."
 INS_union_events.3.t: "[INS.GetNameDefCap]의 이전 제안 거절"
 INS_union_events.3.desc: "[INS.GetNameDefCap](은)는 [1058.GetName](으)로의 이전에 대한 우리의 요청을 단호히 거부했습니다. [INS.GetLeader](은)는 자신들에게도 상황이 버거우며, 우리에겐 이 정도의 원조를 요구할 권리가 없다고 말했습니다."
 INS_union_events.3.a: "우리는 하나의 깃발로 묶여 있음을 잊어버린 것인가."
 INS_union_events.4.t: "군대를 [1058.GetName](으)로 이동한 [HOL.GetNameDefCap]"
 INS_union_events.4.desc: "본토에서 1차로 온 수송선들이 도착했습니다. 장교, 병사, 그리고 남은 무기들로 가득 찬 함선들이었습니다. 예상대로 일부 수송선은 항구에 도착하지 못했습니다. 무사히 도착한 병력은 [1058.GetName]에 주둔할 우리 함선과 병력의 전력이 될 것입니다."
 INS_union_events.4.a: "계속해서 우리 깃발을 휘날리기엔 충분하다."
 # INS proposed union
 INS_union_events.5.t: "[INS.GetNameDefCap]의 네덜란드-인도네시아 연방 제안"
 INS_union_events.5.desc: "전세가 우리에게 불리하다는 것은 이제 전 세계가 알고 있습니다. 본토는 함락되었고, 우리의 작전 기지는 동쪽으로 옮겨졌습니다. [INS.GetName]의 장관들은 최대한의 협력을 보장하기 위해 우리에게 빌헬미나 여왕이 이끄는 연방 국가를 구성하자는 제안을 보냈습니다. 이 제안에 딱히 만족하는 사람은 없는 것 같지만, 이것이 우리 생존의 열쇠가 될지도 모릅니다."
 INS_union_events.5.a: "우리는 위험을 감수해야 한다. 여왕 폐하 만세!"
 INS_union_events.5.b: "동의할 수 없다."
 INS_union_events.6.t: "[HOL.GetNameDefCap]의 연방 제안 수락"
 INS_union_events.6.desc: "내각 내의 긴급 논의 끝에, [HOL.GetLeader](은)는 [INS.GetAdjective]의 제안을 수락했습니다. 이 법령은 간략하며 어떤 의례도 없이 시행됩니다. 양국 정부는 앞으로 전쟁이 끝날 때까지 왕권 아래 하나의 정부로서 활동할 것입니다."
 INS_union_events.6.a: "양국의 역사에 남을 합의로다."
 INS_union_events.7.t: "[HOL.GetNameDefCap]의 연방 제안 거절"
 INS_union_events.7.desc: "[HOL.GetNameDef] 의회는 공동 연방 제안을 거부했습니다. 그들의 메시지는 확고합니다. 협력은 계속될 것이지만 주권은 공유되지 않을 것입니다."
 INS_union_events.7.a: "어차피 잘되지 않았을 것이다."
 # HOL proposed union
 INS_union_events.8.t: "[HOL.GetNameDefCap]의 네덜란드-인도네시아 연방 제안"
 INS_union_events.8.desc: "전세가 우리에게 불리하다는 것은 이제 전 세계가 알고 있습니다. [HOL.GetNameDef]의 본토는 함락되었고, 그들의 작전 기지는 동쪽으로 옮겨졌습니다. [HOL.GetAdjective]의 지도부는 최대한의 협력을 보장하기 위해 우리에게 빌헬미나 여왕이 이끄는 연방 국가를 구성하자는 제안을 보냈습니다. 이 제안에 딱히 만족하는 사람은 없는 것 같지만, 이것이 우리 생존의 열쇠가 될지도 모릅니다."
 INS_union_events.8.a: "그래야겠군."
 INS_union_events.8.b: "이것은 식민 지배를 재확인하려는 수작에 불과하다."
 INS_union_events.9.t: "[INS.GetNameDefCap]의 연방 제안 수락"
 INS_union_events.9.desc: "[INS.GetNameDefCap](은)는 우리의 제안에 동의했습니다. 어떤 결과가 나올지는 불확실하지만, 우리는 전쟁 활동에 집중해야 합니다."
 INS_union_events.9.a: "견뎌내야 한다면, 함께 견뎌야겠지."
 INS_union_events.10.t: "[INS.GetNameDefCap]의 연방 제안 거절"
 INS_union_events.10.desc: "[INS.GetNameDefCap](은) 연방 제안을 거절했습니다. [INS.GetAdjective]의 국민과 지도자들은 이것이 장기적으로 성공할 수 없다고 보고 있으며, 주권을 포기하는 어떤 제안에도 반대합니다."
 INS_union_events.10.a: "어차피 잘되지 않았을 것이다."
 # Flags
