 ### INS News
 taog_news.1.t: "네덜란드-인도네시아 연방의 여명"
 taog_news.1.desc: "빌헬미나 여왕은 어제 [1058.GetName]에서 네덜란드-인도네시아 연방 국가 수립이라는 예상치 못한 발표를 했습니다. 본토가 점령된 상황에서 [HOL.GetAdjective] 망명정부와 [INS.GetAdjective] 행정부는 합의하에 왕실의 통치 아래 하나의 조직으로 움직일 것입니다. 양국 관료들은 이번 조치가 선택이 아닌 불가피한 조치이며, 왕국의 통일성과 권위를 두 대륙에 걸쳐 유지하기 위한 필사적인 노력이라고 설명했습니다."
 taog_news.1.a: "흥미로운 전개로군."
 taog_news.2.t: "인도네시아의 독립 선언"
 taog_news.2.desc: "오늘 자바에서 [INS.GetAdjective] 혁명가인 [INS.GetLeader](이)가 연설을 통해 새로 수립된 인도네시아 공화국의 독립을 선언했습니다. [HOL.GetNameDef](은)는 이 신생 공화국의 주권을 인정하지 않지만, 공화국 민병대는 이미 일부 지역을 사실상 장악하고 있습니다."
 taog_news.2.a: "이 일이 세계적으로 큰 변화를 일으킬 수도 있다."
 ############
 ### SIAM ###
 ############
 siam.1.t: "추문에 휩쓸린 [SIA_phraya_phahon.GetName]"
 siam.1.desc: "[SIA_phraya_phahon.GetName]은 왕실 부동산을 관료들에게 시세 미만의 가격으로 매각한 혐의를 받고 있으며, 이 추문으로 인해 인민의회에서 그의 정통성이 크게 떨어졌습니다. [SIA_phraya_phahon.GetName]의 영향력이 이제 끝나가는 것 같습니다."
 siam.1.a: "이제 다른 누군가의 출셋길이 열릴지도 모르겠군."
 #Spmgsiradet rebellion historical
 siam.2.t: "[SIA_plaek_phibunsongkhram.GetName] 암살 기도의 세 번째 실패"
 siam.2.desc: "로이터 통신 방콕 특파원의 전언에 따르면, 시암 총리 피불 송그람에 대한 독살 시도가 4년 만에 세 번째로 발생했습니다.\n지난주에 음식에 혼입된 독극물로 인하여 송그람 총리와 그의 부인, 딸이 일시적으로 중독되었다고 합니다.\n영국 외무장관 핼리팩스 경은 송그람 총리에게 보낸 서한을 통하여 총리의 목숨을 노린 비겁한 시도에 경악을 표했으며, 그가 무사하여 기쁘다고 전했습니다." #https://trove.nla.gov.au/newspaper/article/47990695
 siam.2.a: "대체 누가 이런 짓을?"
 siam.3.t: "추방된 프라야 송수라뎃"
 siam.3.desc: "프라야 송수라뎃은 [SIA_plaek_phibunsongkhram.GetName]에 대한 한 번 이상의 암살 시도와 정부 전복 쿠데타 모의의 주모자라는 혐의를 받고 있습니다. 정부는 프라야 송수라뎃의 지휘권, 계급과 직위를 박탈하며, 연금 없이 군에서 강제 퇴역시키고 국외 추방할 계획입니다.\n일부에서는 이것이 [SIA_plaek_phibunsongkhram.GetName]이 자신의 주요 정적을 제거하기 위해 사주한, 얄팍하게 위장된 숙청이라고 주장하지만 이는 명백한 중상모략입니다."
 siam.3.a: "안타까운 결말이군."
 siam.4.t: "프라야 송수라뎃의 동조자들이 체포됨"
 siam.4.desc: "이른 새벽에 태국 정부는 왕립 태국 경찰의 협조를 받아 랑싯 왕자, 프라야 테파핫사딘, 프라야 우돔 퐁펜사왓 등 용의자 및 동조자 51명을 추가로 체포했습니다. 이들은 프라야 송수라뎃과 공모하여 국가를 전복하려 한 혐의를 받고 있으며, 특히 왕족인 랑싯 왕자가 재판받을 예정이라는 점이 주목받고 있습니다. 일부에서는 랑싯 왕자를 특별히 표적으로 삼은 것이 [THIS.GetName]에 남아 있는 왕족들에게 \"정부에 따르지 않으면 몰락할 것이다\"라는 메시지를 보내는 것일 수도 있다는 추측을 내놓고 있습니다."
 siam.4.a: "이야기가 복잡해지는군."
 siam.5.t: "18구의 반란"
 siam.5.desc: "피불은 반란에 가담한 51명을 재판하기 위해 특별 재판소를 설치했고, 그중 25명은 종신형을, 21명은 총살형을 선고받았습니다. 21명 중 랑싯 왕자와 프라야 테파핫사딘을 포함한 3명은 명예로운 행적을 인정받아 사면되었습니다."
 siam.5.a: "일이 일단락되었군."
 #Songsuradet rebellion alternative
 siam.6.t: "송수라뎃 대치 상황"
 siam.6.desc: "프라야 송수라뎃은 [SIA_plaek_phibunsongkhram.GetName]에 대한 한 번 이상의 암살 시도와 정부 전복 쿠데타 모의의 주모자라는 혐의를 받고 있습니다. 정부는 송수라뎃의 지휘권을 박탈하고 국외로 추방할 계획입니다.\n그러나 송수라뎃에게 충성하는 군인들은 그의 체포를 막으며 이 체포가 정치적 동기에서 비롯된 것이라고 비난했습니다. 정부와 송수라뎃의 군부 세력은 현재 서로 양보하지 않고 교착 상태에 빠져 있습니다."
 siam.6.a: "우리는 양보하지 않을 것이다."
 siam.6.b: "역효과를 낳았군. 물러서자."
 siam.7.t: "해군의 지지를 구하는 송수라뎃"
 siam.7.desc: "정부군과 송수라뎃의 군부 세력 간의 팽팽한 대치가 계속되면서, 정부 측 수사관들은 점점 권위주의적이 되는 피분에 대응한다는 명확한 의도를 가지고 왕립 해군과 송수라뎃 간의 동맹이 형성되었다는 소문을 듣기 시작했습니다.\n그뿐만 아니라, 왕실의 일부 보좌관들은 송수라뎃 측 인사들이 고위 왕자들과 만났다고 보고하면서 왕실 또한 반대파와 손잡을 수 있다는 우려가 커지고 있습니다."
 siam.7.a: "우리는 정부다, 협박당하지 않을 것이다!"
 siam.7.b: "상황이 점점 걷잡을 수 없어지는군. 물러서자."
 #alt-hist actual rebellion
 siam.8.t: "송수라뎃 반란"
 siam.8.desc: "정치적, 군사적으로 충분한 지지를 확보한 송수라뎃의 군부 세력은 해군과 협력하여 [THIS.GetName]의 광범위한 지역을 사실상 장악했습니다. 이른 새벽에 방콕 교외에서 총격전이 벌어졌고, 전국적으로 정부와 송수라뎃 간의 전면적인 내전이 임박한 상황입니다."
 siam.8.a: "정부는 살아남아야 한다."
 #alt-hist actual rebellion
 siam.9.t: "송수라뎃 반란의 결말"
 siam.9.desc: "반란은 완전히 실패로 돌아갔고, 송수라뎃이 체포되면서 남은 것은 재판뿐입니다. 하지만 이마저도 형식적인 절차에 불과합니다. 반란 음모는 육군과 해군뿐만이 아니라 왕실 내부에서도 드러났으며, 랑싯 왕자가 공개적으로 반란군을 지지한 사실까지 밝혀졌습니다. 이제 반체제 인사들에 대한 대대적인 숙청은 선택이 아니라 불가피한 조치가 되었습니다."
 siam.9.a: "이제 재건에 힘쓸 때다."
 #Attack Indochina
 siam.10.t: "승리!"
 siam.10.desc: "적군은 패주하고 있고, 우리의 승리는 확실해 보입니다. 영토를 확실히 손에 넣은 지금, 낡은 제국주의 세력은 벌벌 떨고 있을 것입니다. 어찌 그들이 패하지 않을 수 있겠습니까? 이것이 곧 신의 섭리입니다."
 siam.10.a: "[ROOT.GetName](을)를 위하여!"
 siam.10.b: "사실 이건 생각보다 잘 굴러가고 있다."
 siam.11.t: "[FROM.GetAdjective]의 전략적 약진"
 siam.11.desc: "예상과 달리 [FROM.GetAdjective]군은 우리 군대를 압도하고 분쟁 지역을 장악했습니다. 적군의 점령으로 우리의 권위는 약화되었고 해당 지역에 대한 우리의 영유권 주장은 흔들리고 있습니다. 이 분쟁을 계속할 경우 우리의 규율과 사기가 더 약화될 위험이 있지만, 영토를 포기하는 것은 공개적으로 실패를 인정하는 셈이 될 것입니다."
 siam.11.a: "손실을 줄이고 철수해야 한다."
 siam.11.b: "우리 영유권을 포기할 수는 없다!"
 siam.12.t: "[FROM.GetName]의 패배 인정"
 siam.12.desc: "우리의 작전은 성공했습니다. 적의 저항은 무너졌고, [FROM.GetName](은)는 추가적인 피해를 막기 위해 분쟁 지역에 대한 통제권을 공식적으로 포기했습니다. 이 승리는 우리의 위상을 높이고 국경을 굳건히 했습니다. 당분간은 말입니다."
 siam.12.a: "누구도 우리의 힘을 부정할 수 없다."
 siam.13.t: "[FROM.GetName]의 모든 합의 거부"
 siam.13.desc: "[FROM.GetName](은)는 영토 할양과 관련된 모든 제안을 용납할 수 없다며 거부했습니다. 그들의 지도부는 오직 우리 국가의 파멸만이 이 분쟁을 끝낼 수 있다고 선언했습니다."
 siam.13.a: "어쩔 수 없지."
 siam.14.t: "[FROM.GetNameDefCap]의 전면전 선언"
 siam.14.desc: "[FROM.GetNameDefCap](은)는 이제 협상을 원하는 척조차 하지 않습니다. 그들의 의도는 명확합니다. 우리 국가를 완전히 정복하고 흡수하는 것입니다. 이 전쟁은 조약으로 결정될 일이 아니라, 완전한 승리 아니면 완전한 붕괴로 끝날 것입니다."
 siam.14.a: "타협도 항복도 없다."
 siam.15.t: "멈춰 버린 [SIA.GetAdjective]의 공격"
 siam.15.desc: "[SIA.GetAdjective]군의 신속한 공격은 우리의 허를 찔렀을지 모르지만, 거세지는 압박 속에서 그들의 진격이 주춤하는 것을 보면 그들의 약점은 분명합니다. 전격전이 될 예정이었던 이 작전은 이제 [SIA.GetAdjective]군에게 지루한 소모전이 되었습니다. 우리가 관대하게 양보하여 그들에게 퇴로를 열어줄 수도 있지만, 완전한 승리보다 자비를 베푸는 것이 우리에게 더 이익이 되는지는 결국 우리의 판단에 달려 있습니다."
 siam.15.a: "양보를 제안하자."
 siam.15.b: "완전한 승리 말고는 용납할 수 없다."
 siam.16.t: "멈춰 버린 공세"
 siam.16.desc: "우리의 공세가 멈췄습니다. 그 자체는 문제가 아니지만, 적이 그 사실을 알고 있는 것이 문제입니다. 적은 우리에게 최후통첩을 보냈습니다. 지금 항복해 손실을 최소화하든지, 아니면 더 많은 유혈을 감수하고 전쟁을 계속하라는 것입니다. 둘의 유일한 차이는 묻어야 할 죽은 자의 수뿐입니다."
 siam.16.a: "평화를 선택하겠다."
 siam.16.b: "우리는 절대로 항복하지 않는다!"
 siam.17.t: "[FROM.GetName]의 양보 거부"
 siam.17.desc: "[FROM.GetName](은)는 우리에게 아주 조금이라도 양보하느니 차라리 국가 전체가 불타오르는 것을 택하겠다고 분명하게 밝혔습니다. 전쟁은 계속됩니다."
 siam.17.a: "원하는 대로 해주겠다."
 siam.18.t: "우리의 항복을 원하는 [FROM.GetName]"
 siam.18.desc: "적 최고사령부의 통신을 감청한 결과, 우리가 가장 두려워하던 바가 사실로 드러났습니다. 이 전쟁을 종식시킬 협상 타결이나 양보는 없을 것입니다. 그들은 우리의 완전한 항복만을 요구하며, 우리가 다시 제국주의의 압제 아래 살도록 강요하고 있습니다. 그것이 그들의 목표라면, 우리에게 남은 대답은 하나뿐입니다. 우리는 결코 굴복하지 않을 것입니다."
 siam.18.a: "[ROOT.GetNameDefCap](은)는 맞설 것이다!"
 siam.19.t: "[SIA.GetName]의 영토 반환 요구"
 siam.19.desc: "[SIA.GetName]에서는 민족주의가 강화되고 있으며 그 지역에서 우리의 힘이 부족하다는 인식에 퍼지고 있습니다. 이에 따라 그들은 자신들의 핵심 영토라고 여기는 지역들을 반환해 달라고 요구하고 있습니다. 그들은 분명 분수에 맞지 않는 요구를 하고 있지만, 세계정세가 파국으로 치닫는 상황에서 그들이 주장하는 영토가 굳이 싸워 지킬 만큼 가치 있는 것은 아닐지도 모릅니다."
 siam.19.a: "싸울 가치가 없다."
 siam.19.b: "헛소리를 하는군!"
 siam.20.t: "[FROM.GetName]의 영토 이양"
 siam.20.desc: "[FROM.GetName](은)는 우리 영토를 돌려주기로 결정했습니다. 그들이 이 영토에 대한 우리의 주권을 인정하기 때문인지, 아니면 그저 다른 세력들의 압력 때문인지는 중요하지 않습니다. 우리의 대의는 정당합니다."
 siam.20.a: "최고의 날이로군!"
 siam.21.t: "[FROM.GetName]의 영토 이양 거부"
 siam.21.desc: "[FROM.GetName](은)는 우리의 요청을 거부했습니다. 이 제국주의자들은 지난 세기에 필사적으로 집착하고 있으며, 소위 \"위대한 국가\"들의 시대가 이미 끝났다는 사실을 인정하지 못하고 있습니다."
 siam.21.a: "그러면 인정하게 만들어야겠군."
 SIA_sent_bureaucrats_to_us: "우리와의 공무원 교육"
 SIA_tied_their_currency_to_ours: "그들의 통화를 우리 통화에 연동함"
 SIA_sent_started_cooperative_with_us: "우리와 개발 협동조합을 시작함"
 siam.22.t: "해외로 [SIA.GetName] 관료 파견"
 siam.22.desc: "우리 관료들은 현대 경제에 적합하지 않으며, 국가 성장을 이끌 수 있는 교육을 받지 못했습니다. 다행히도 현대적이고 잘 정립된 관료제를 갖춘 국가들이 많으므로, 그곳으로 관료들을 보내 그들의 통치 방식까지 그대로 도입하지 않고도 경험을 쌓게 할 수 있습니다."
 siam.22.a: "[ENG.GetName]에 관료 파견"
 siam.22.b: "[JAP.GetName]에 관료 파견"
 siam.23.t: "바트 안정화법"
 siam.23.desc: "[ROOT.GetName](이)가 무역과 금융의 질서를 추구하려면, 바트화가 불안정한 상태로 남아 있어서는 안 됩니다. 우리 관료들은 통화의 안정을 위해서는 상인, 채권자, 그리고 외국 파트너 모두를 안심시킬 수 있는 영향력을 가진 통화에 기반한 확고한 외부적 기준이 필요하다고 주장합니다. 우리가 해야 하는 선택은 단순히 기술적인 문제가 아닙니다. 이는 우리의 무역 방향, 발전 양상, 그리고 [SIA.GetAdjective] 경제에 미치는 외부의 영향력을 결정짓는 중요한 사안입니다."
 siam.23.a: "파운드 스털링화에 연동"
 siam.23.b: "엔화에 연동"
 siam.24.t: "[SIA.GetAdjective] 개발 협동조합"
 siam.24.desc: "[SIA.GetAdjective] 개발 협동조합은 국가 발전을 위한 새로운 수단을 제공했지만, 여전히 국내 자본으로는 목표를 달성할 수 없습니다. 철도, 공장, 전기 시설이 빠른 속도로 발전하려면 외부 자금이 필요합니다. 이제 우리 앞에는 두 가지 길이 놓여 있습니다. [ENG.GetAdjective] 투자는 기존 시장, 경험 많은 기업, 그리고 런던의 금융 명성에 접근할 수 있는 기회를 제공합니다. [JAP.GetAdjective] 투자는 영향력 확대를 열망하는 신흥 아시아 강대국과의 긴밀한 산업 파트너십을 약속합니다. 어느 쪽이든 발전을 가속할 수 있지만, 어느 쪽도 의무가 따르지 않을 수는 없습니다."
 siam.24.a: "[ENG.GetName]로부터의 투자 모색"
 siam.24.b: "[JAP.GetName]로부터의 투자 모색"
 siam.25.t: "프라차티뽁의 승하"
 siam.25.desc: "프라차티뽁 왕께서 승하하셨습니다. 옛 질서의 기억을 간직한 채 오랜 유배와 격변을 겪은 전 왕은 이제 인간의 세상을 벗어나 역사 속으로 사라졌습니다. 어떤 이들에게는 그의 죽음이 절대 왕정의 종식과 함께 시작된 투쟁이 완전히 끝난 것으로 여겨질 것입니다. 그러나 그가 구현했던 대의는 그와 함께 사라지지 않습니다. 왕좌는 건재하고, 왕조는 이어지며, [ROOT.GetName]의 존엄성과 안정을 되찾기 위한 노력은 이제 젊은 아난타 왕의 이름으로 계속되어야 합니다."
 siam.25.a: "폐하께서 극락으로 승천하시기를."
 siam.27.t: "왕 만들기"
 siam.27.desc: "아난타 왕은 장차 다스리게 될 왕국에서 멀리 떨어진 [SWI.GetName]에 머물고 있습니다. 하지만 거리가 멀다고 해서 그가 우리의 영향력에서 벗어나는 것은 아닙니다. 우리는 그에게 적합한 스승을 선택하고, 중요한 과목을 가르치고, 바람직한 습관을 길러주어 그의 마음이 우리가 [ROOT.GetNameDef](을)를 위해 계획한 미래를 향해 나아가도록 만들 수 있습니다. 그가 군인으로 돌아올지, 학자로 돌아올지, 아니면 그 이상의 존재로 돌아올지는 지금 그가 무엇을 공부하느냐에 따라 크게 달라질 것입니다.\n\n진정한 왕이란 결국 국가의 연장선이 아니겠습니까?"
 siam.27.a: "그가 학문을 탐구하도록 이끌어라."
 siam.27.b: "그에게 군사에 대해 가르쳐라."
 siam.27.c: "그를 행정과 보급 방면으로 이끌어라."
 siam.27.d: "그에게 산업과 개발에 대해 교육하라."
 siam.28.t: "아난타 왕의 대관식"
 siam.28.desc: "오랜 섭정 기간이 마침내 끝나 가고 있습니다. 방콕에서 국가의 왕자, 승려, 장관, 그리고 장교들이 지켜보는 가운데 아난타 왕은 정식으로 왕위에 오르고 짜끄리 왕조의 왕으로서 걸맞은 영예를 누립니다. 이 대관식은 혼란이 있었던 자리에 연속성을, 분쟁이 있었던 자리에 신성한 질서를 선포합니다. 왕국에 있어 이 대관식은 단순한 의식이 아니라 왕실이 건재하고, 왕국이 망명과 내란에 분열되지 않았으며, 이제 [ROOT.GetNameDef]에 새로운 통치가 시작됨을 선언하는 것입니다."
 siam.28.a: "국왕 폐하 만세."
 siam.29.t: "재래식 전차 연구"
 siam.29.desc: "재래식 전차는 여전히 전장의 왕으로 군림하고 있습니다. 우리는 강력한 전차 군단을 만들기 위하여 최고에게 배워야 합니다."
 siam.29.a: "독일에게 배우겠다."
 siam.29.b: "미국에게 배우겠다."
 siam.29.c: "영국에게 배우겠다."
 siam.31.t: "잠수함 확보"
 siam.31.desc: "해군 확장에는 잠수함 도입이 필수적이며, 우리는 잠수함을 어디에서 조달할지 결정해야 합니다. [ENG.GetNameDef] 및 [JAP.GetNameDef] 양쪽이 모두 제안을 해왔지만, 이 선택은 조선소를 선택하는 것 이상의 의미를 가집니다."
 siam.31.a: "[ENG.GetAdjective]의 배라면 제 역할을 할 것이다."
 siam.31.b: "우리는 [JAP.GetAdjective]의 설계를 바탕으로 우리 잠수함을 건조할 것이다."
 siam.32.t: "해방전함 확보"
 siam.32.desc: "우리 연안 해역에는 성능 좋은 방어용 함선이 필요하며, 우리는 어디서 함선을 공급받을지를 선택해야 합니다. [ENG.GetNameDefCap](와)과 [JAP.GetNameDef] 모두 함선을 인도할 준비가 되어 있으며, 이번 결정은 우리 함대와 대외 관계 모두에 영향을 미칠 것입니다."
 siam.32.a: "우리의 연안 방어는 [ENG.GetAdjective] 함선에 의존할 것이다."
 siam.32.b: "우리의 연안함대는 [JAP.GetAdjective] 함선에 의존할 것이다."
 siam.33.t: "방콕 조선회사 매각"
 siam.33.desc: "방콕 조선회사 매각이 완료되었고, 그 매각 대금은 현재 국고에 예치되어 있습니다. 정부는 이 자금을 어디에 사용하는 것이 가장 좋은지를 결정해야 합니다. 일반 시민의 재정적 부담을 완화하는 데 사용할지, 국가의 기술적 발전을 가속화하는 데 사용할지, 아니면 국가의 미래에 대한 신뢰를 강화하는 데 사용할지 중에서 선택해야 합니다."
 siam.33.a: "우리 국민의 세금 부담을 줄이겠다."
 siam.33.b: "이 자금을 해군 연구 자금으로 쓰겠다."
 siam.33.c: "이 소득을, 국민을 안심시키는 데 쓰겠다."
 siam.34.t: "우리 해안에서 요구하는 [FROM.GetAdjective]"
 siam.34.desc: "현재 [FROM.GetAdjective]군은 [ROOT.GetNameDef] 측을 압박하고 있으며, 그들의 외교관들은 마치 이 문제가 이미 결론이 난 것처럼 확신에 찬 어조로 말하고 있습니다. 그들은 우리에게 질서와 안정이라는 상투적인 표현을 사용하지만, 진정으로 원하는 것은 복종입니다. 우리는 굴복하여 축소된 형태로나마 국가를 보존할 수도 있고, 어느 정도 행동의 자유를 유지할 희망을 품고 그들의 세력에 합류할 수도 있으며, 아니면 이 압박에 공개적으로 저항하며 침략자들에게 우리 해안에서 나갈 것을 명령할 수도 있습니다."
 siam.34.a: "그들의 세력에 가입하여 우리의 통치를 유지할 것이다."
 siam.34.b: "우리 해안에서 나가라고 해라."
 siam.35.t: "[JAP.GetNameDefCap]의 추가 화폐 발행 요구"
 siam.35.desc: "[JAP.GetNameDefCap](은)는 자신들의 기대 사항을 분명히 밝혔습니다. 우리가 그들의 경제적 수요를 충족시키기 위해 통화 공급을 늘려야 한다는 것입니다. 그 부담은 물가 상승을 통해 우리 국민에게 전가되겠지만, [JAP.GetAdjective]의 산업은 그 혜택을 누릴 것입니다. 우리가 거부할 여지는 거의 없습니다."
 siam.35.a: "[JAP.GetNameDef]의 요구에 따르겠다."
 siam.36.t: "[SIA.GetNameDefCap]의 부채 상환 요구"
 siam.36.desc: "[SIA.GetNameDefCap](은)는 우리가 그들에게 강요했던 화폐 발행 협정으로 발생한 비용을 상환하라고 공식적으로 요구했습니다. 그 협정은 우리에게 큰 도움이 되었지만, 이제 그 비용을 지불해야 할 때입니다."
 siam.36.a: "채무를 인정하고 빚을 갚겠다."
 siam.37.t: "[JAP.GetNameDefCap]의 부채 상환 동의"
 siam.37.desc: "우리의 요구 이후, [JAP.GetNameDef](은)는 화폐 발행 협정으로 인한 경제적 비용을 상환하기 시작하는 데 동의했습니다. 이 보상이 우리 국민에게 가해진 부담을 완전히 없애지는 못하겠지만, 국고에 어느 정도 부담을 덜어줄 것입니다."
 siam.37.a: "공정하게 해결되었군. 우리 경제는 회복될 것이다."
 siam.38.t: "[SIA.GetName]의 항복 조건 제시"
 siam.38.desc: "[SIA.GetAdjective] 정부가 우리에게 항복 조건을 제시했습니다. 그들의 장관들은 우리의 무력이 이미 입증되었으며, 이 분쟁에서 [ROOT.GetNameDef](이)가 주도권을 쥐고 있다는 사실을 인정하고 있습니다. 우리는 그들의 항복을 받아들여 그들을 복종시킬 수도 있고, 그들의 정부가 우리의 더 큰 대의에 봉사하도록 우리 세력에 묶어둘 수도 있으며, 모든 타협을 거부하고 시암이 완전히 점령될 때까지 공세를 계속할 수도 있습니다."
 siam.38.a: "항복을 받아들인다."
 siam.38.b: "아니다. 우리는 무력으로 끝장을 볼 것이다."
 siam.39.t: "[FROM.GetAdjective] 정부의 항복 수락"
 siam.39.desc: "[FROM.GetLeader](은)는 우리의 항복을 받아들이기로 했습니다. [ROOT.GetNameDef](은)는 일단 더 이상의 파괴를 면했지만, 굴욕은 면할 수 없었습니다. 군대는 전투태세를 해제하라는 명령을 받았고, 정부는 더 강한 권력의 허락 아래에서만 유지됩니다. 우리는 국가를 보전했지만, 그 대가로 자존심과 행동의 자유를 잃었습니다."
 siam.39.a: "견뎌내야 한다면 견뎌야지."
 siam.40.t: "[FROM.GetAdjective] 정부의 제안 거부"
 siam.40.desc: "[FROM.GetLeader](은)는 방콕에서 보낸 모든 제안을 거부했습니다. 항복으로는 충분하지 않으며 어떤 타협도 받아들일 수 없다고 합니다. 적은 완전한 정복을 통해서만 문제를 해결할 심산입니다. 이제 [ROOT.GetNameDef]에 남은 것은 저항뿐입니다. 합의로 그들을 우리 해안에서 물러나게 할 수 없다면, 무력으로 몰아내야 합니다."
 siam.40.a: "그렇다면 싸워야지."
 siam.41.t: "우리의 방식을 연구하기 위한 [FROM.GetNameDefCap]의 관료 파견"
 siam.41.desc: "[FROM.GetAdjective]의 관료들이 우리의 행정 및 연구 방식을 관찰하고 연구하기 위해 방문했습니다. [FROM.GetNameDefCap](은)는 외국의 전문 지식을 바탕으로 관료제를 현대화하려는 의지를 보이고 있으며, 그 모델로 [ROOT.GetNameDef](을)를 선택했습니다. 이번 방문은 우리의 방식에 대한 암묵적인 인정이며, 다른 정부와 우호적인 관계를 구축할 수 있는 기회입니다."
 siam.41.a: "그들을 환영한다."
 siam.42.t: "자국의 통화를 우리 통화에 연동한 [FROM.GetNameDefCap]"
 siam.42.desc: "[FROM.GetNameDefCap](은)는 공식적으로 자국 통화를 우리 통화에 연동하기로 결정했습니다. 이 결정은 [FROM.GetNameDef](이)가 우리 경제권에 더욱 가까워지게 하며, 우리 금융기관의 안정성에 대한 신뢰도를 보여줍니다. 양국 간 무역은 더욱 예측 가능해질 것이며, [FROM.GetAdjective]의 상인들은 우리와 더욱 쉽게 거래할 수 있을 것입니다."
 siam.42.a: "우리 무역 관계가 더 개선되겠군."
 siam.43.t: "[FROM.GetNameDefCap]의 개발 투자 요청"
 siam.43.desc: "[FROM.GetNameDefCap](은)는 자국의 발전에 기여할 우리 공학자와 전문가들을 초청했습니다. 이 협력은 그 지역에 우리 산업의 발판을 마련하고 양국 정부 간 경제적 유대를 강화할 것입니다. 이것은 간단한 제안이지만, 장기적으로는 상당한 성과를 거둘 수 있을 것입니다."
 siam.43.a: "기꺼이 돕겠다."
 siam.44.t: "잠수함을 주문한 [FROM.GetNameDefCap]"
 siam.44.desc: "[FROM.GetNameDefCap](이)가 우리 설계대로 건조된 잠수함을 주문했습니다. 이번 주문은 우리의 해군 산업에 대한 의미 있는 신뢰를 보여주는 것이며, 동남아시아 해역에 [FROM.GetAdjective]의 영향력을 확대하는 계기가 될 것입니다."
 siam.44.a: "우리 조선소에서 반기겠군."
 SIA_purchased_submarines_from_us: "우리로부터 잠수함을 구매함"
 siam.45.t: "[FROM.GetNameDefCap]의 동맹 병합 제안"
 siam.45.desc: "[FROM.GetName]에서 온 대표단이 [FROM.GetLeader]의 제안을 가지고 도착했습니다. 그들은 현재 우리의 서로 별개인 두 동맹이 동일한 광범위한 목표를 추구하면서도 병력, 물자, 외교적 영향력이 분리되어 지휘부가 서로 경쟁하고 주장합니다.\n\n우리 병력을 그들의 병력과 통합하면 더 넓은 전선에서 전략을 조정할 수 있는 더 강력한 블록을 만들 수 있을 것입니다. 이러한 합의는 공동의 대의를 강화하겠지만, 우리가 동맹의 미래 방향에 대한 [FROM.GetAdjective]의 영향력을 수용해야 한다는 조건도 포함합니다."
 siam.45.a: "연합전선은 필요하다."
 siam.45.b: "우리 동맹은 우리 동맹인 채로 두겠다."
 siam.46.t: "[FROM.GetNameDefCap]의 병합 수락"
 siam.46.desc: "[FROM.GetLeader](은)는 우리 동맹들을 하나의 연합으로 통합하자는 제안을 받아들였습니다. 이전에는 분리되어 있던 지휘부와 외교 채널들이 이제 하나의 체제로 통합되어, 양국 정부가 전쟁 계획, 보급 조정, 외교 정책을 훨씬 더 명확하게 조율할 수 있게 되었습니다.\n\n이러한 통합에는 복잡함이 따르겠지만, 단결의 필요성이 결국 우선시되었습니다."
 siam.46.a: "우리는 단결하여 더욱 강해질 것이다."
 siam.47.t: "[FROM.GetNameDefCap]의 병합 거부"
 siam.47.desc: "[FROM.GetLeader](은)는 우리의 동맹 병합 제안을 거부했습니다. 그들의 정부는 이해관계가 일치하는 경우 계속 협력할 수 있지만, [ROOT.Capital.GetCapitalVictoryPointName]에서 주도하는 더 큰 연합에 자신들의 동맹을 포함시키지는 않겠다고 선언했습니다.\n\n현재로서는 우리 블록 간의 분열이 지속될 것입니다. 우리는 그들의 전폭적인 헌신을 기대하지 않고 우리의 목표를 추구해야 합니다."
 siam.47.a: "그렇다면 혼자서 진행해야겠군."
 siam.48.t: "[JAP.GetAdjective]의 지원을 요청하는 [SIA.GetName]"
 siam.48.desc: "[SIA.GetNameDefCap](은)는 자국을 침략하는 세력에 맞서기 위한 군사 지원을 공식적으로 요청했습니다. 이에 대한 대가로, [SIA.GetAdjective] 정부는 [JAP.GetAdjective] 기업에게 전략 자원, 기반시설 및 상업적 권리에 대한 특혜를 부여할 준비가 되어 있습니다.\n\n[SIA.GetName](을)를 지원하면 동남아시아에 우리의 영향력을 확대하고 제국이 사용할 귀중한 물자를 확보하는 데 도움이 되겠지만, 또한 지역의 분쟁에 더욱 깊이 휘말리게 될 수도 있습니다."
 siam.48.a: "제안을 받아들이겠다."
 siam.48.b: "[JAP.GetName]에는 내어줄 자원이 없다."
 siam.49.t: "우리의 호소를 받아들인 [JAP.GetName]"
 siam.49.desc: "[JAP.GetNameDefCap](은)는 [ROOT.GetNameDef]의 투쟁을 지원하기로 합의했습니다. [JAP.GetAdjective]의 고문, 장비 및 보급품이 곧 도착할 예정이며, 합의에 따라 [JAP.GetAdjective] 기업들에게 경제적 특혜가 주어졌습니다.\n\n내각은 국가의 생존을 축하하고 있지만, 많은 이들은 이러한 지원을 받는 대가로 독립성을 얼마나 많이 내주었는지 조용히 의문을 품고 있습니다."
 siam.49.a: "우리는 동맹을 확보했다."
 SIA_japan_aid_request.4.t: "우리의 호소를 거부한 [JAP.GetName]"
 SIA_japan_aid_request.4.desc: "[JAP.GetNameDef] 정부는 우리의 군사 지원 요청을 거부했습니다. 도쿄에서는 일본 제국이 현재 우리의 전쟁에 병력과 물자를 투입할 수 없다고 주장합니다.\n\n[ROOT.GetNameDef](은)는 이제 외국의 지원 없이 자력으로 침략에서 살아남아야 합니다."
 SIA_japan_aid_request.4.a: "그렇다면 우리는 홀로 맞서야겠군."
 siam_adc.1.t: "[FROM.GetNameDefCap]의 [?var:SIA_adc_demand_country_to_be_released.GetNameDef] 해방 요구"
 siam_adc.1.desc: "[FROM.GetNameDef]에서 공식 서한이 도착했습니다. [FROM.GetLeader](이)가 우리 측이 아시아 국가들을 계속 점령하는 것은 그들의 자결권에 대한 용납할 수 없는 모욕이라며 규탄하는 내용입니다. 이 서한은 아시아는 분할하거나 외세의 뜻대로 통치할 수 있는 전리품이 아니며, 즉시 군대를 철수하고 [?var:SIA_adc_demand_country_to_be_released.GetNameDef]의 독립 정부를 복원할 것을 요구하고 있습니다.\n\n이 요구는 오해의 여지가 없습니다. [FROM.GetNameDefCap](은)는 우리가 이 요구를 이행할 것이라 기대하며, 우리가 이를 거부할 경우 자국에 대한 의도적인 모욕으로 받아들일 것입니다."
 siam_adc.1.a: "그들을 해방하겠다."
 siam_adc.1.b: "그들은 점령 상태로 남아 있어야 한다."
 siam_adc.2.t: "우리의 독립 복원을 제안하는 [FROM.GetNameDefCap]"
 siam_adc.2.desc: "[ROOT.GetNameDef]의 미래에 관한 [SIA.GetNameDef]의 요구를 [FROM.GetAdjective](이)가 수용한 직후, 이제 [FROM.GetLeader](이)가 우리에게 마지막 질문을 던집니다. 점령 당국은 우리가 다시 한번 독립된 길을 걷기로 한다면 철수하고 주권을 가진 [ROOT.GetAdjective] 정부를 인정할 준비가 되어 있습니다.\n\n독립은 존엄과 행동의 자유를 제공하지만, 그렇게 되면 우리는 [FROM.GetNameDef]의 보장 없이 국가를 재건해야 합니다. 그들의 보호 아래 남는 것은 더 낮은 자세를 취하는 길이겠지만, 이처럼 불확실한 시기에 국가가 더 이상의 혼란에 빠지는 것을 막을 수 있는 길입니다."
 siam_adc.2.a: "우리는 자유로운 국가로 우뚝 설 것이다."
 siam_adc.2.b: "우리는 [FROM.GetAdjective]의 보호 아래 남을 것이다."
 siam_adc.3.t: "[?var:SIA_tag_that_was_released_due_to_sia_pressure.GetName]의 독립 인정"
 siam_adc.3.desc: "[?var:SIA_tag_that_was_released_due_to_sia_pressure.GetNameDef] 정부는 독립을 선택했습니다. 점령 행정부가 해산될 예정인 지금, [var:SIA_tag_that_was_released_due_to_sia_pressure.GetNameDef](은)는 세계의 주권 국가들 사이에서 제자리를 되찾을 준비를 하고 있습니다."
 siam_adc.3.a: "그들의 미래는 어찌 될 것인가?"
 siam_adc.4.t: "[FROM.GetNameDefCap]의 독립 거부"
 siam_adc.4.desc: "자유를 얻을 기회가 있었음에도 불구하고, [FROM.GetNameDef] 정부는 즉각적인 독립을 거부했습니다. 정부 장관들은 국가가 아직 완전한 주권의 부담을 감당할 준비가 되어 있지 않으며, 현재로서는 현상 유지를 선호한다고 주장합니다."
 siam_adc.4.a: "그러면 현 체제가 계속되겠군."
 siam_adc.5.t: "[FROM.GetNameDefCap]의 요구 거부"
 siam_adc.5.desc: "[FROM.GetName](은)는 우리의 요구가 좋게 봐줘도 우스운 수준이라는 점을 분명히 했습니다. 그들은 우리가 현상 유지에서 벗어날 입장이 아니라는 증거로 우리의 빈약한 군사력을 지목합니다."
 siam_adc.5.a: "그렇다면 우리 실력을 보여줘야겠군."
 siam_dem_event_count: "군부는 우리가 더 오래 기다릴 경우 중상모략을 위한 작전을 계획하고 있습니다"
 siam_dem.2.t: "군부의 반대"
 siam_dem.2.desc: "장관 및 고위 장교들이 참석한 비공개회의에서, 한 군 대표는 '황색 서류' 제안에 대해 강력하게 비판했습니다. 그는 제안 작성자들이 국가의 지도, 재분배, 사회적 의무에 대해서는 지나치게 자유롭게 언급하면서, 규율, 재산, 그리고 장교단과 농촌 지역에 부과될 부담에 대해서는 너무 소홀하다고 주장했습니다. 그의 견해로는, 세계가 매달 더욱 위험해지는 상황에서 종이 위에 쓰인 이론만으로는 [ROOT.GetNameDef](을)를 개혁할 수 없다는 것입니다."
 siam_dem.2.a: "군부가 자신들의 입장을 밝혔군."
 siam_dem.3.t: "공개적인 질책"
 siam_dem.3.desc: "논쟁은 위원회 회의실을 넘어 확산되었습니다. 군부를 대변하는 것으로 널리 알려진 한 신문이 황색 서류를 전면 비난하는 기사를 실으며, 이를 애국적인 언어로 포장한 이질적인 구상이라고 표현했습니다. 신문 편집자들은 이 제안이 계급 갈등을 국가 단결도보다 우선시하고, 기존 제도에 대한 신뢰를 약화시키며, 노동자와 농민들에게 위험한 기대를 조장한다고 경고했습니다. 오후가 되자 이 기사는 병영, 사무실, 찻집 등 곳곳에서 회자되었고, 내부 논쟁이었던 사안은 이제 공개적인 논란이 되었습니다."
 siam_dem.3.a: "비판론이 퍼지고 있군."
 siam_dem.4.t: "피분의 황색 서류 비난"
 siam_dem.4.desc: "피분은 공개적으로, 그리고 분명한 강경함을 드러내며 논쟁에 뛰어들었습니다. 그는 지지자들과 장교들 앞에서 연설하며, 황색 서류를 옹호하는 사람들은 어떤 언어를 쓰든 간에 본질적으로 공산주의적이라고 규탄했다. 그는 국가를 사유 재산보다 우위에 두고, 대대적인 사회 변혁을 약속하며, 하층민들을 선동하는 모든 프로그램은 이름만 다를 뿐 [ROOT.GetNameDef]에 붉은 독을 퍼뜨리는 것이라고 선언했습니다."
 siam_dem.4.a: "의심의 여지를 남기지 않는군."
 siam_dem.5.t: "남은 과제는 정부 수립"
 siam_dem.5.desc: "구정권이 무너지고 자유 타이 운동이 승리했습니다. 그러나 승리가 곧 정부 수립을 의미하는 것은 아니며, 피분에 맞서 결성된 연합은 그의 후임자를 누구로 할지에 대해 합의를 이루지 못하고 있습니다. 권력의 핵심부에서 거론되는 사람은 세 명입니다. 저항군의 양심이라 불리는 쁘리디 파놈용, 누구에게도 불쾌감을 주지 않는 온화한 쿠앙 아파이웡, 그리고 정당한 보상을 기대하고 있는 장교들을 휘하에 둔 핀 춘하완 장군입니다. 우리가 지금 누구를 선택하느냐에 따라 앞으로 다가올 평화가 어떤 형태일지가 결정될 것입니다."
 siam_dem.5.a: "저항군의 공로를 생각하면 쁘리디 파놈용이 이끌어야 한다."
 siam_dem.5.b: "쿠앙 아파이웡이라면 모든 파벌이 동의할 것이다."
 siam_dem.5.c: "핀 춘하완 장군이다. 군부가 제자리를 차지하게 될 것이다."
 ###################
 #### AUSTRALIA ####
 ###################
 AST_election_events.1.t.a: "통합호주당의 승리!"
 AST_election_events.1.t.b: "노동당의 승리!"
 AST_election_events.1.desc.a: "개표가 완료되었습니다. 통합호주당이 선거에서 승리했습니다.\n\n통합호주당은 짧은 정부 구성 기간을 거친 후, 앞으로 3년 동안 시민들의 신뢰가 헛되지 않았음을 보여주기 위해 힘쓸 것입니다."
 AST_election_events.1.desc.b: "개표가 완료되었습니다. 호주노동당이 선거에서 승리했습니다.\n\n호주노동당은 짧은 정부 구성 기간을 거친 후, 앞으로 3년 동안 시민들의 신뢰가 헛되지 않았음을 보여주기 위해 힘쓸 것입니다."
 AST_election_events.1.a: "국민이 뜻을 내비쳤군."
 AST_election_events.2.t: "연방 선거를 향하여"
 AST_election_events.2.desc: "$AST_democratic_party_long$(은)는 1931년부터 [AST.GetName](을)를 이끌어 대공황을 벗어나고 반민주적 정서로부터 멀어지게 했습니다. 안정적인 지도력, 보수적 성향, 그리고 영국에 대한 충성심을 바탕으로 통합호주당은 지지 기반을 강화하고 재집권 가능성을 높여왔습니다. 그러나 만만치 않은 또 다른 정당이 있습니다.\n\n1931년 불신임 결의로 정권을 잃었던 충격에서 아직 회복 중인 $AST_labor_party_long$(이)가 다시 탄력을 받기 시작했습니다. 공산주의자들이 침묵하는 지금, 노동 계급은 새로운 희망을 찾고 있습니다. 모든 시민을 대표한다는 사명을 가진 호주노동당은 제국주의와 호주의 영국에 대한 충성심에 대하여 다른 관점을 제시합니다. 국내의 필요가 최우선이며, 외국의 이익은 더 이상 우선시되어서는 안 된다는 것입니다.\n\n다음 연방 선거까지는 1년 반이 남았습니다. 통합호주당이 다시 승리를 거두려면 지도부는 국민의 지지를 유지하기 위하여 개혁을 가속화해야 합니다. 그렇지 않으면 호주노동당이 선거 운동으로 다시 입지를 회복할 수 있을 것입니다."
 AST_election_events.2.a: "통합호주당이 최근의 개혁을 실시해야 한다."
 AST_election_events.2.b: "호주 전역에 선거 운동 투어를 하면 호주노동당의 지지도가 오를 것이다."
 AST_election_events.3.t: "$AST_election_season_cat$"
 AST_election_events.3.desc: "$AST_election_season_cat_desc$"
 AST_election_events.3.a: "시작이군."
 AST_diplomatic_events.1.t: "호주 불가침조약"
 AST_diplomatic_events.1.desc: "호주 정부는 최근 외교적 노력의 일환으로 일부 아시아 국가들과 불가침조약을 체결하려 하고 있으며, 우리도 그중 하나입니다. 전쟁을 피하려는 이러한 시도가 호주 관료들의 현실 감각 부족을 드러낼지, 아니면 그들의 고결한 모습을 보여줄지는 우리의 반응에 따라 어느 정도 결정될 것입니다.\n\n우리는 [AST.GetName](와)과 불가침조약을 체결해야 할까요?"
 AST_diplomatic_events.1.a: "그야 당연히, 안 한다."
 AST_diplomatic_events.1.b: "그래, 체결하겠다."
 AST_diplomatic_events.2.t: "태평양동맹에 대한 저항"
 AST_diplomatic_events.2.desc: "[FROM.GetNameDef]에 파견된 대표단은 우리의 불가침조약 제안에 대한 그곳의 답변을 전보로 보냈습니다. 이 제안이 대담한 외교적 시도라는 점을 알고 있었고, 그렇기에 [FROM.GetLeader]의 거부도 그다지 놀라운 일이 아닙니다."
 AST_diplomatic_events.2.a: "그래도 명예로운 시도였다."
 AST_diplomatic_events.3.t: "태평양동맹 만세"
 AST_diplomatic_events.3.desc: "[FROM.GetNameDef]에 파견된 대표단은 우리의 불가침조약 제안에 대한 그곳의 답변을 전보로 보냈습니다. 정말로 기쁘게도, [FROM.GetLeader](은)는 우리의 제안을 높이 평가하고 이에 서명하기로 동의했습니다."
 AST_diplomatic_events.3.a: "훌륭하군!"
 AST_diplomatic_events.4.t: "호주의 싱가포르 요청"
 AST_diplomatic_events.4.desc: "[AST.GetNameDefCap](은)는 오랫동안 싱가포르 전략의 신뢰성에 의문을 제기해 왔습니다. 호주 관료들에 따르면, 태평양 전쟁 발발 시 우리가 그들을 지원할 수 있을지는 불확실합니다. 태평양 해군의 책임을 [AST.GetName]에 이양하면 영국의 부담은 줄어들겠지만, 그 부담은 고스란히 호주로 전가될 것입니다.\n\n싱가포르가 우리와 함께 있는 경우보다 호주의 통제력을 강화하는 것이 태평양의 우리 종속국 및 영토에 더 유리하다고 확신할 수 있을까요?"
 AST_diplomatic_events.4.a: "그래, 확신할 수 있다."
 AST_diplomatic_events.4.b: "싱가포르는 계속해서 우리 것이어야 한다."
 AST_diplomatic_events.5.t: "우리의 요청을 수락한 영국"
 AST_diplomatic_events.5.desc: "영국은 싱가포르를 호주 관할로 이양하는 데 동의했습니다. 이로써 시대에 뒤떨어진 싱가포르 전략이 마침내 종식되고, 우리는 자주적으로 스스로를 방어하게 될 것입니다."
 AST_diplomatic_events.5.a: "전략이 새로 쓰였도다!"
 AST_diplomatic_events.5.a.tt: "§Y싱가포르§!:\n  §Y호주§!가 지배함.\n  §Y호주§!가 소유함.\n§Y크리스마스섬§!:\n  §Y호주§!가 지배함.\n  §Y호주§!가 소유함.\n§Y코코스 제도§!:\n  §Y호주§!가 지배함.\n  §Y호주§!가 소유함."
 AST_diplomatic_events.6.t: "우리의 요청을 거부한 영국"
 AST_diplomatic_events.6.desc: "영국은 싱가포르를 호주 관할로 이양하는 것을 거부했습니다. 현재 상태가 유지될 것입니다."
 AST_diplomatic_events.6.a: "싱가포르 전략은 일단 보류해야겠군."
 AST_diplomatic_events.7.t: "[AST.GetName]의 지원 요청"
 AST_diplomatic_events.7.desc: "[AST.GetNameDefCap](은)는 전쟁 수행을 위한 장비를 동맹들로부터 지원받기를 원하며, 이에 필요한 수송을 관리하는 데 우리의 지원을 요청합니다. [AST.GetName](이)가 활용할 수 있도록 수송선을 지원해 줄 수 있을까요?"
 AST_diplomatic_events.7.a: "지원할 수 있다."
 AST_diplomatic_events.7.b: "안 된다."
 AST_diplomatic_events.8.t: "우리의 요청을 수락한 [USA.GetName]"
 AST_diplomatic_events.8.desc: "[USA.GetNameDefCap](은)는 [AST.GetName]의 보급 활동을 지원하기 위해 수송선을 제공하기로 합의했습니다."
 AST_diplomatic_events.8.a: "큰 도움이 될 거다!"
 AST_diplomatic_events.9.t: "[USA.GetName]의 요청 거부"
 AST_diplomatic_events.9.desc: "[USA.GetNameDefCap]에게는 [AST.GetName]의 보급 활동에 내어줄 수송선이 없습니다."
 AST_diplomatic_events.9.a: "우리가 알아서 수송을 관리해야겠군."
 AST_diplomatic_events.10.t: "전시 동맹"
 AST_diplomatic_events.10.desc: "[AST.GetNameDefCap](은)는 [USA.GetNameDef](와)과의 동맹을 매우 중요하게 여기며, 이제 이를 국제 전시 연합으로서 공식화할 것을 요청합니다. 양국이 힘을 합치면 현재와 미래의 분쟁에서 서로를 지원할 수 있을 것입니다."
 AST_diplomatic_events.10.a: "동의해야 한다."
 AST_diplomatic_events.10.b: "[USA.GetNameDefCap](은)는 그들 없이도 굳건히 버틸 수 있다."
 AST_diplomatic_events.11.t: "전시 동맹"
 AST_diplomatic_events.11.desc: "[USA.GetNameDefCap](은)는 힘을 합치는 데 동의했습니다. [AST.GetFactionName]의 회원국으로서, [AST.GetName] 및 [USA.GetName](은)는 현재와 미래의 분쟁에서 서로를 지원할 것입니다."
 AST_diplomatic_events.11.a: "적들은 우리를 두려워하게 될 것이다."
 AST_diplomatic_events.12.t: "전시 동맹 거부됨"
 AST_diplomatic_events.12.desc: "[USA.GetNameDefCap](은)는 우리와 힘을 합치기를 거부했습니다. [AST.GetNameDefCap](와)과 [USA.GetName](은)는 서로 분리된 채로 각자의 전쟁을 수행할 것입니다."
 AST_diplomatic_events.12.a: "그들 없이 싸워야겠군."
 AST_diplomatic_events.13.t: "호주 헌법 제6조"
 AST_diplomatic_events.13.desc: "호주 식민지들이 연방으로 통합되는 과정에서 뉴질랜드는 결국 참여하지 않기로 결정했습니다. 하지만 그 후에도 호주 헌법은 우리를 연방의 잠재적 가입국 중 하나로 정의하며 가입 가능성을 열어두고 있습니다.\n\n이제 [AST.GetName](은)는 현재의 세계정세에서는 단결이 필요하다며 [NZL.GetName](을)를 호주 관할로 이양할 것을 요청하고 있습니다. 이 문제에 대해 국민투표를 실시해야 할까요?"
 AST_diplomatic_events.13.a: "해야 한다."
 AST_diplomatic_events.13.a.tt: "국민투표가 실시될 것이며, 이로 인해 §Y[NZL.GetName]§!(이)가 §R합병§!될 수도 있습니다."
 AST_diplomatic_events.13.b: "어림도 없는 소리!"
 AST_diplomatic_events.14.t: "호주의 주가 된 [NZL.GetNameDefCap]"
 AST_diplomatic_events.14.desc: "최근 실시된 국민투표 결과에 따라, [NZL.GetName](은)는 호주 헌법 제6조를 발동하기로 결정했습니다. 뉴질랜드 주민들은 자국 영토가 호주의 통치하에 있는 것이 더 안전하다고 판단하여 [AST.GetNameDef] 가입에 동의했습니다."
 AST_diplomatic_events.14.a: "호주가 확장되는군."
 AST_diplomatic_events.15.t: "뉴질랜드 대중의 저항"
 AST_diplomatic_events.15.desc: "최근 실시된 국민투표 결과에 따라, [NZL.GetName](은)는 호주 헌법 제6조를 발동하지 않기로 결정했습니다. [NZL.GetNameDefCap](은)는 독립 국가로 남을 것입니다."
 AST_diplomatic_events.15.a: "호주는 이 상태로 유지되겠군."
 AST_diplomatic_events.16.t: "[NZL.GetNameDefCap] 관료들의 저항"
 AST_diplomatic_events.16.desc: "호주의 압력에도 불구하고, [NZL.GetName](은)는 호주 헌법 제6조를 발동하기 위한 국민투표를 실시하지 않기로 결정했습니다. [NZL.GetNameDefCap](은)는 독립 국가로 남을 것입니다."
 AST_diplomatic_events.16.a: "호주는 이 상태로 유지되겠군."
 AST_diplomatic_events.17.t: "호주의 협력"
 AST_diplomatic_events.17.desc: "북쪽에서 적이 오고 있으며, 우리 코앞까지 닥치는 것은 시간문제일 뿐입니다. 적어도 호주 관료들은 그렇게 주장합니다. [AST.GetNameDefCap](은)는 우리가 통일된 방어선을 구축하기 위해 단결해야 한다고 제안하며, 가능하다면 [INS.GetName](을)를 호주 관할하에 두거나, 최소한 군사 통행권을 부여해야 한다고 주장합니다."
 AST_diplomatic_events.17.a: "호주 관할하로 들어가는 데 동의한다."
 AST_diplomatic_events.17.a.tt: "§Y[INS.GetNameDefCap]§!(이)가 §Y[AST.GetNameDefCap]§!의 §Y괴뢰국§!이 됩니다."
 AST_diplomatic_events.17.b: "군사 통행권을 부여한다."
 AST_diplomatic_events.17.b.tt: "§Y[INS.GetNameDefCap]§!(이)가 §Y[AST.GetNameDefCap]§!에게 §Y군사 통행권§!을 부여합니다."
 AST_diplomatic_events.17.c: "어느 쪽도 동의하지 않겠다."
 AST_diplomatic_events.18.t: "호주의 요청을 받아들인 [INS.GetNameDefCap]"
 AST_diplomatic_events.18.desc: "[INS.GetName](이)가 우리의 요청에 동의했습니다. 우리의 협력은 양국의 방어 능력에 큰 영향을 미칠 것입니다."
 AST_diplomatic_events.18.a: "환상적이군!"
 AST_diplomatic_events.19.t: "[INS.GetNameDefCap]의 거부"
 AST_diplomatic_events.19.desc: "[INS.GetName](은)는 우리의 요청을 거부했습니다. 우리 국가들은 각자 스스로를 방어해야 할 것입니다."
 AST_diplomatic_events.19.a: "[AST.GetNameDefCap](은)는 그들 없이도 분쟁을 극복하게 될 것이다."
 AST_diplomatic_events.20.t: "영국 전시 내각에 소환"
 AST_diplomatic_events.20.desc: "[GET_AST_BWC_COUNT][ENG.GetNameDefCap](이)가 호주 총리를 영국 전시 내각에 소환했습니다. 세계정세가 심각하므로, 영국은 동맹국들과 공동 전략 및 군사 협력을 모색해야 합니다.\n\n하지만 호주 역시 해결해야 할 문제가 있습니다. 영국을 만족시키기 위해 호주 총리의 시간을 조금 내어줄 수 있을까요?"
 AST_diplomatic_events.20.a: "[AST.GetLeader](은)는 영국으로 출발할 것이다."
 AST_diplomatic_events.20.b: "그는 여기에 있어야 한다."
 AST_bwc_count_2: "이번이 두 번째입니다. [ENG.GetLeader] 측은 우리의 긴밀한 협력이 공동의 싸움의 향방을 결정할 것이라며 [AST.GetLeader]의 참석을 요구하고 있습니다.\n\n"
 AST_bwc_count_3: "[AST.GetLeader]은 영연방 협력을 위해 다시 한번 먼바다를 건너야 한다는 요구를 받고 있습니다. 다만 우리가 공동의 노력에 동참할 것인지, 아니면 국내 문제를 우선할 것인지 명확히 한다면 앞으로 이런 요청이 더 이어지지는 않을 것입니다.\n\n"
 AST_bwc_accept_effect_tt: "§Y소집을 3회 수락할 시 효과:§!"
 AST_bwc_accept_tt: "§Y[?var:AST_bwc_accept]§!/§Y3§!회 소집 수락"
 AST_diplomatic_events.22.t: "영국 전시 내각에 대한 성공적인 기여"
 AST_diplomatic_events.22.desc: "지난 한 해 동안, 호주 총리는 정기적으로 영국 전시 내각에 정기적으로 참석했습니다. 비록 [AST.GetNameDef](이)가 때때로 희생을 감수해야 했지만, 영국과의 군사 협력을 통해 우리 국가는 더욱 강해졌습니다."
 AST_diplomatic_events.22.a: "결국에는 충분히 그럴만한 가치가 있었다."
 AST_diplomatic_events.23.t: "더 이상 호주의 전쟁 영향력을 구하지 않는 [ENG.GetLeader]"
 AST_diplomatic_events.23.desc: "[ENG.GetNameDefCap](이)가 호주 총리를 여러 차례 영국 전시 내각에 소환했지만, 계속 거부하자 [ENG.GetLeader](은)는 더 이상 소환을 계속할 이유가 없다고 판단했습니다."
 AST_diplomatic_events.23.a: "이해한다."
 AST_diplomatic_events.24.t: "지도부 교체"
 AST_diplomatic_events.24.desc: "호주의 총리는 영연방의 전쟁 활동에 큰 영향을 미쳤습니다. 로버트 멘지스는 런던에 정기적으로 방문하면서 영국 장관들의 신뢰를 얻었으며, 장관들의 자국 총리에 대한 신뢰는 약해졌습니다. 장관들은 이제 [ENG.GetNameDef]의 지도자에게 사임하고 멘지스가 그의 자리를 대신하도록 압력을 가하고 있습니다.\n\n설령 [AST.GetName](이)가 총리를 잃더라도, 그들은 영국의 통치권을 쥐고 있는 호주인의 보호를 받으며, 종주국으로부터 영원한 충성을 얻게 될 것입니다. 호주는 더 큰 권위를 원하고 있으며, 로버트 멘지스는 그 소망에 가장 먼저 이름을 올린 인물입니다."
 AST_diplomatic_events.24.a: "바람이 바뀌고 있군."
 AST_diplomatic_events.25.t: "캔버라의 통치하에"
 AST_diplomatic_events.25.desc: "태평양 국가 간에 긴장이 고조되어 우려스러운 상황이며, 영국은 자국의 전쟁에 전념하고 있어 우리 종속국들을 지원하러 올 여력은 없어 보입니다. 적어도 [AST.GetName](은)는 그렇게 주장합니다.\n\n그들은 태평양과 인도양의 국가들을, 캔버라를 중심으로 운영하는 방식으로 영연방을 재건하려 하고 있습니다. 우리는 동의해야 할까요?"
 AST_diplomatic_events.25.a: "동의하겠다. 태평양 지역은 중앙집권적 통제를 통해 강해질 것이다."
 AST_diplomatic_events.25.b: "당연히 아니지!"
 AST_diplomatic_events.26.t: "태평양 연방"
 AST_diplomatic_events.26.desc: "[ENG.GetNameDefCap](이)가 동의했습니다. 태평양 지역은 중앙집권적 통제를 통해 강화될 것입니다. 영국령 태평양 영토는 이제 우리의 관할입니다."
 AST_diplomatic_events.26.a: "태평양 국가들이 힘을 합치고 있다."
 AST_diplomatic_events.27.t: "우리의 요청을 거부한 영국"
 AST_diplomatic_events.27.desc: "[ENG.GetNameDefCap](이)가 거부했습니다. 태평양 지역은 중앙집권적 통제를 통해 강화되지 않을 것입니다. 태평양 영토들은 영국의 관할로 남아 있을 것입니다."
 AST_diplomatic_events.27.a: "그래도 호주는 버텨낼 것이다."
 AST_diplomatic_events.28.t: "연락을 끊어버린 [ENG.GetLeader]"
 AST_diplomatic_events.28.desc: "총리가 [ENG.GetLeader](와)과 전보로 주고받은 논쟁은 호주에 실질적인 도움을 주지는 못했지만, 호주의 이익을 들이미는 [AST.GetLeader]에 대한 영국의 반감을 더욱 키웠습니다."
 AST_diplomatic_events.28.a: "호주는 알아서 스스로를 방어해야 한다."
 AST_diplomatic_events.29.t: "우리를 지원하는 영국"
 AST_diplomatic_events.29.desc: "호주가 [ENG.GetNameDef]에 압력을 가해 [JAP.GetName](와)과의 분쟁을 유발하려 한 후에, 영국은 우리의 방어 시설 건설을 지원하기로 합의했습니다."
 AST_diplomatic_events.29.a: "지원은 환영하지만, 일본의 전쟁을 막지는 못할 것이다."
 AST_diplomatic_events.30.t: "호주의 자원 채굴권 요청"
 AST_diplomatic_events.30.desc: "팽창주의 침략자들은 인도차이나의 영토뿐만 아니라, 그 땅의 자원에도 눈독을 들이고 있습니다. 만약 그 풍부한 자원이 적의 손에 넘어간다면 전쟁은 더욱 길어지겠지만, 호주의 손에 들어간다면 전쟁을 종식시키는 데 도움이 될 수 있습니다. 적어도 호주 정부는 그렇게 주장합니다.\n\n그들에게 우리 영토 내 자원 채굴권을 부여하는 데 동의해야 할까요?"
 AST_diplomatic_events.30.a: "해야 한다."
 AST_diplomatic_events.30.b: "그 자원들은 [AST.GetName]에게도 줄 수 없다."
 AST_diplomatic_events.31.t: "[AST.GetName]에게 자원 채굴권을 부여한 [FROM.GetNameDefCap]"
 AST_diplomatic_events.31.desc: "팽창주의 침략자들은 인도차이나의 영토뿐만 아니라, 거기 매장된 자원에도 눈독을 들이고 있습니다. 만약 그 풍부한 자원이 적의 손에 넘어간다면 전쟁은 더욱 길어지겠지만, 호주의 손에 들어간다면 전쟁을 종식시키는 데 도움이 될 수 있습니다. 적어도 호주 정부는 그렇게 주장합니다.\n\n[ROOT.OVERLORD.GetNameDefCap](이)가 이 요청에 동의했습니다."
 AST_diplomatic_events.31.a: "우리의 통제 범위를 벗어난 일이다."
 AST_diplomatic_events.32.t: "[FROM.GetNameDefCap]의 자원 채굴권 부여"
 AST_diplomatic_events.32.desc: "[FROM.GetNameDefCap](은)는 인도차이나의 자원을 호주가 활용하는 것이 더 효율적이라는 데 동의하며, 우리에게 자원 채굴권을 부여했습니다."
 AST_diplomatic_events.32.a: "큰 도움이 될 거다."
 AST_diplomatic_events.33.t: "[FROM.GetNameDefCap]의 자원 채굴권 부여 거부"
 AST_diplomatic_events.33.desc: "[FROM.GetNameDefCap](은)는 인도차이나의 자원을 호주가 활용하는 것이 더 효율적이라는 데 동의하지 않았으며, 우리에게 자원 채굴권을 부여하는 것을 거부했습니다."
 AST_diplomatic_events.33.a: "최소한 적의 손에 들어가지는 않아야 할 텐데."
 AST_diplomatic_events.34.t: "[AST.GetNameDefCap]의 태평양 영토 분할 요청"
 AST_diplomatic_events.34.desc: "[AST.GetNameDefCap](은)는 양국 간의 잠재적 분쟁이 발생하기 전에 해결할 수 있는 협정을 제안했습니다. 태평양 영토를 분할한다면, 우리는 상대방의 간섭을 두려워하지 않고 앞으로의 확장을 계획할 수 있습니다."
 AST_diplomatic_events.34.a: "이 협정은 합리적인 것 같군."
 AST_diplomatic_events.34.b: "[JAP.GetNameDefCap](은) 적합하다고 판단되면 확장할 것이다."
 AST_diplomatic_events.35.t: "분할된 태평양"
 AST_diplomatic_events.35.desc: "[AST.GetNameDefCap](와)과 [JAP.GetNameDefCap](은)는 각 국가가 확장할 수 있는 태평양 영토에 대해 합의했습니다. 이를 통해 양국 간 잠재적인 분쟁을 예방할 수 있기를 바랍니다."
 AST_diplomatic_events.35.a: "결정됐군!"
 AST_diplomatic_events.36.t: "태평양은 알아서 분할될 것이다"
 AST_diplomatic_events.36.desc: "[JAP.GetNameDefCap](은)는 태평양 영토를 양국의 협의로 분할하는 데 동의하지 않을 것입니다. 일본 정부는 자국이 적합하다고 판단하는 대로 영토를 확장할 것입니다."
 AST_diplomatic_events.36.a: "그러면 호주도 그렇게 할 것이다."
 AST_diplomatic_events.37.t: "지배권의 양도"
 AST_diplomatic_events.37.desc: "이유는 알 수 없지만, [AST.GetName](은)는 우리 영토의 통제권을 [JAP.GetNameDef]에게 넘기기로 결정했습니다. 무언가 불길한 일이 배후에서 진행되고 있으며, 세상이 그 진실을 알게 되는 것은 시간문제일 뿐입니다."
 AST_diplomatic_events.37.a: "우리가 이 문제에 대해 발언권이 없다는 것은 분명하다."
 AST_diplomatic_events.38.t: "나우루 조약"
 AST_diplomatic_events.38.desc: "대전쟁의 결과로 태평양의 여러 독일 영토가 호주의 지배하에 놓였지만, 이제 영토 한 곳을 되찾을 방법이 있을지도 모릅니다. 바로 나우루섬입니다.\n\n[AST.GetFascistParty](은)는 우리의 이익과 일치하는 목표를 가지고 있으며, 그중 하나는 [AST.GetName](이)가 [ENG.GetNameDef]에서 완전히 분리되는 것입니다. 현재 이 운동은 영향력이 약하기 때문에, 그 대표들은 성장을 가속화하기 위해 우리에게 지원을 요청하고 있으며, 완전한 권력을 잡게 되면 나우루섬의 지배권을 우리에게 되돌려주겠다고 주장합니다. 단, 그들이 독립을 추구할 때 우리가 그들을 보장해 주는 조건입니다."
 AST_diplomatic_events.38.a: "우리의 영토가 회복될 것이다!"
 AST_diplomatic_events.38.b: "우리는 헛된 약속에 기대를 걸지 않을 것이다."
 AST_diplomatic_events.39.t: "[GER.GetNameDefCap]의 나우루 조약 수락"
 AST_diplomatic_events.39.desc: "[GER.GetNameDefCap](와)과 [AST.GetFascistParty](은)는 공동의 목표에 합의했습니다. [AST.GetName]의 독립을 달성하는 것입니다. [AST.GetFascistParty]의 현재 정치적 영향력이 약하기 때문에, 성장을 가속화하기 위해 [GER.GetNameDef](은)는 보조금을 지원할 것이며, 우리의 영향력이 더 이상 제한받지 않게 되면 이 합의는 완전히 이행될 것입니다."
 AST_diplomatic_events.39.a: "훌륭하군!"
 AST_diplomatic_events.40.t: "파기된 나우루 조약"
 AST_diplomatic_events.40.desc: "당장 실현 불가능한 약속에 확답할 수 없었던 [GER.GetNameDef](은)는 우리의 집권을 지원하지 않기로 결정했습니다. 나우루 협정은 시작하기도 전에 끝나 버렸고, [AST.GetFascistParty]의 야망은 전적으로 우리가 짊어지게 되었습니다."
 AST_diplomatic_events.40.a: "[AST.GetFascistParty](은)는 독일의 지원 없이 진행하게 될 것이다."
 AST_diplomatic_events.41.t: "독일의 손에 돌아간 나우루"
 AST_diplomatic_events.41.desc: "이제 완전한 권력을 손에 쥔 [AST.GetFascistParty](은)는 약속대로 조건을 이행했습니다. 나우루는 [GER.GetNameDef]에 반환되며, 우리는 호주의 독립을 보장할 것입니다."
 AST_diplomatic_events.41.a: "그리할 것이다."
 AST_diplomatic_events.42.t: "약속을 깬 [AST.GetFascistParty]"
 AST_diplomatic_events.42.desc: "약속에는 치명적인 결함이 하나 있습니다. 바로 깨질 수 있다는 것입니다. 현재 권력을 장악한 [AST.GetFascistParty]의 지도자들은 나우루를 내어주지 않을 뿐만 아니라, 태평양의 다른 섬들까지도 손에 넣기로 결정했습니다.\n\n우리의 옛 태평양 영토는 나우루 조약이 체결되기 전과 마찬가지로 여전히 우리의 영토가 아닌 상태로 남아 있을 것이며 만약 우리가 다른 결과를 원한다면, 전쟁을 치러야 할 것입니다."
 AST_diplomatic_events.42.a: "어디 결과를 두고 보겠다."
 AST_diplomatic_events.43.t: "[AST.GetNameDefCap]의 동남아시아 요청"
 AST_diplomatic_events.43.desc: "[AST.GetName](은)는 자신들의 북방 확장을 통해 우리가 동남아시아의 외교 및 분쟁에 대하여 공동의 영향력을 확대할 수 있다고 주장합니다. 직접적인 요구는 아니지만, [AST.GetLeader](은)는 거부를 받아들이지 않을 것임을 시사하고 있습니다."
 AST_diplomatic_events.43.a: "지금 우리의 관심은 다른 곳에 쏠려 있으니, 그게 최선이겠지."
 AST_diplomatic_events.43.b: "어쨌든 그들이 받을 답은 거부밖에 없다."
 AST_diplomatic_events.44.t: "동남아시아의 양도"
 AST_diplomatic_events.44.desc: "[ENG.GetNameDefCap](은)는 현명하게도 동남아시아 영토를 우리에게 양도하는 데 동의했습니다. 호주의 국경이 확장됨에 따라 우리의 영향력도 그에 따라 증가할 것이며, 머지않아 세계는 우리 손에 들어올 것입니다."
 AST_diplomatic_events.44.a: "미래가 밝아 보이는군."
 AST_diplomatic_events.45.t: "동남아시아의 현상 유지"
 AST_diplomatic_events.45.desc: "[ENG.GetNameDefCap](은)는 동남아시아 영토를 우리에게 양도하는 것을 거부했습니다. 그럼에도 불구하고 그 지역에 대한 지배는 여전히 우리에게 매력적이며, 비록 요청으로 그 지역을 얻지는 못했지만 언젠가는 우리의 것이 될 수도 있습니다."
 AST_diplomatic_events.45.a: "그래, 그럴 수 있다."
 #AST_diplomatic_events.46.t was removed
 AST_diplomatic_events.47.t: "책임의 분담"
 AST_diplomatic_events.47.desc: "[AST.GetName](은)는 최근 영연방에서 분리되었음에도 불구하고 군사 협력을 제안하고 있습니다. [AST.GetName](은)는 전 세계적으로 군사력이 부족한 상황을 고려할 때, 책임을 분담하는 것이 [ENG.GetNameDefCap]에 도움이 될 것이라고 주장합니다."
 AST_diplomatic_events.47.a: "동의하겠다."
 AST_diplomatic_events.47.b: "우리 방어는 우리가 알아서 할 것이다."
 AST_diplomatic_events.48.t: "영국-호주 조약"
 AST_diplomatic_events.48.desc: "[ENG.GetNameDefCap](은)는 불가침조약에 서명하기로 합의했으며, 이는 군사 협력의 기반이 될 것입니다."
 AST_diplomatic_events.48.a: "우리 관계에 새로운 장이 열리는군."
 AST_diplomatic_events.49.t: "서명되지 않은 조약"
 AST_diplomatic_events.49.desc: "[ENG.GetNameDefCap]는 불가침조약에 서명하지 않기로 했습니다. 양국 간 군사 협력을 구축하려는 우리의 시도는 실패했으며, 우리는 대외 진출을 독자적으로 추진해야 합니다."
 AST_diplomatic_events.49.a: "그래야 하겠군."
 AST_diplomatic_events.50.t: "태평양 호주 주둔군"
 AST_diplomatic_events.50.desc: "동남아시아와 태평양 지역의 보호는 영국의 이익에 부합하지만, 이 지역이 본토인 영국 제도에서 멀리 떨어져 있다는 점은 [FROM.GetName]도 이해하고 있습니다. 그들은 우리가 물자를 지원해 주는 대가로 이 지역의 방어를 책임지겠다고 제안했으며, 이를 통해 우리는 다른 곳에 역량을 집중할 수 있게 되었습니다."
 AST_diplomatic_events.50.a: "[FROM.GetName]에서 도와주겠다면 환영이지."
 AST_diplomatic_events.50.b: "그 지역은 충분히 가깝다."
 AST_diplomatic_events.51.t: "태평양 [ENG.GetNameDefCap] 주둔군"
 AST_diplomatic_events.51.desc: "[FROM.GetNameDefCap](이)가 동의합니다, 우리는 동남아시아 해역을 보호할 것입니다. 영국이 연료를 제공하는 대가로, [ROOT.GetName](은)는 우리와 인접한 해역에서 해상 지배 증강을 위하여 노력할 것입니다."
 AST_diplomatic_events.51.a: "그 해역은 우리의 것이 될 것이다."
 AST_diplomatic_events.52.t: "호주의 독자적인 태평양 주둔군"
 AST_diplomatic_events.52.desc: "[FROM.GetNameDefCap](은)는 동의하지 않습니다. 그들은 동남아시아 해역 방어에 도움이 필요하지 않다고 합니다. 그러나 영국의 지원이 있든 없든 [ROOT.GetName](은)는 인접 해역에서 해상 지배를 확보하는 데 노력을 기울일 것입니다."
 AST_diplomatic_events.52.a: "그 해역은 우리의 것이 될 것이다."
 AST_diplomatic_events.53.t: "비시의 탈아프리카"
 AST_diplomatic_events.53.desc: "[AST.GetName](은)는 비시 프랑스의 몰락이나 협조를 이끌어내는 것이 [ENG.GetNameDef]의 주요 목표 중 하나라고 추측하고 있으며, 따라서 비시 프랑스가 제압될 때까지 프랑스의 아프리카 식민지를 추격하는 데 동참하겠다고 제안했습니다. 이 제안의 배후에 어떤 의도가 있는지는 알 수 없지만, 이 지역에 연합군의 주둔 병력이 증강되는 것은 우리에게 이익이 될 것임은 분명합니다.\n\n우리가 허가한다면, [AST.GetName](은)는 식민지의 평화적인 이양 및 호주 주둔군 창설을 위하여 비시 프랑스와 논의를 개시할 것입니다."
 AST_diplomatic_events.53.a: "그들의 지원을 환영할 것이다."
 AST_diplomatic_events.53.b: "[AST.GetName](이)가 이 일을 우리에게 불리하게 이용할 위험이 너무 크다."
 AST_diplomatic_events.54.t: "원조 개시"
 AST_diplomatic_events.54.desc: "[ENG.GetNameDefCap](이)가 동의합니다. 아프리카에서 연합군의 주둔을 확대하는 것은 영연방에 이익이 될 것입니다.\n\n우리는 식민지의 평화적인 이양 및 호주 주둔군 창설을 위하여 비시 프랑스와 논의를 개시할 것입니다."
 AST_diplomatic_events.54.a: "그리할 것이다."
 AST_diplomatic_events.55.t: "허가는 필요 없다"
 AST_diplomatic_events.55.desc: "[ENG.GetNameDefCap](은)는 아프리카에서 호주의 원조를 거부하고 비시 프랑스 문제를 스스로 해결하겠다고 합니다. 그러나 우리의 야망은 쉽게 바뀌지 않을 것입니다.\n\n비시 프랑스의 아프리카 영토를 호주가 장악한다면 우리는 영연방의 종속국이 아닌 동등한 존재가 될 것입니다. 우리는 [ENG.GetNameDef]의 거부에도 불구하고, 이 목표를 추구해야 합니다. 무력을 사용해야 한다 해도 말입니다."
 AST_diplomatic_events.55.a: "우리는 확장할 것이다."
 AST_diplomatic_events.56.t: "[AST.GetName]의 아프리카 영토 요구"
 AST_diplomatic_events.56.desc: "[ENG.GetNameDef](을)를 대신하여 [AST.GetName](이)가 우리에게 아프리카 영토의 양도를 요구하고 있습니다.\n\n[ENG.GetNameDefCap](은)는 아프리카에서 지배력을 확대하기로 결심했으며, 우리가 호주의 점령에 순응하지 않으면 그들은 무장한 채로 다시 돌아올 것입니다."
 AST_diplomatic_events.56.a: "분쟁을 피하려면 영토를 양도해야 한다."
 AST_diplomatic_events.56.b: "그러면 무장하고 오라고 해라."
 AST_diplomatic_events.57.t: "비시의 아프리카 영토 양도"
 AST_diplomatic_events.57.desc: "비시 프랑스는 요구받은 아프리카 영토를 양도하는 데 동의했으며, 호주의 주둔군이 그 지역을 지배하도록 허용했습니다."
 AST_diplomatic_events.57.a: "계속해서 더욱 아프리카에 확장해야 한다."
 AST_diplomatic_events.58.t: "[AST.GetName]의 영토 요구를 거부한 비시"
 AST_diplomatic_events.58.desc: "비시 프랑스는 아프리카 영토를 우리에게 양도하지 않기로 했습니다. 하지만 우리가 한 것은 요청이 아니라 요구였습니다.\n\n우리는 그들이 우리에게 내주지 않으려 한 지역을, 무력을 동원해서라도 차지할 것입니다."
 AST_diplomatic_events.58.a: "평화적으로든 아니든, [AST.GetName]는 확장할 것이다."
 #AST_diplomatic_events.59 was removed
 #AST_diplomatic_events.60 was removed
 #AST_diplomatic_events.61 was removed
 AST_diplomatic_events.62.t: "반영국 협정?"
 AST_diplomatic_events.62.desc: "[AST.GetName] 외교관들이 찾아와 영국에 대항하는 동맹을 제안했습니다. 이 동맹은 우리가 직접 개입하지 않아도 영국으로부터 북아일랜드를 되찾는 데에 그들의 지원을 받는다는 내용입니다.\n 그 대가로, 만약 그들이 성공한다면 우리는 그들의 세력에 합류하여 미래에 영국과의 전쟁이 발발할 경우 그들을 지원해야 합니다.\n북아일랜드와의 통일은 매력적이지만, 우리가 더 강한 이웃 국가인 영국을 그런 식으로 적대시할 위치에 있는지, 그리고 더 중요한 것은 전쟁이 발발할 경우 우리가 승리할 수 있을지를 신중하게 고려해야 합니다. 승리하지 못할 경우 아일랜드 전체가 다시 영국의 식민지로 전락할 수도 있습니다."
 AST_diplomatic_events.62.a: "통일보다 중요한 것은 없다! 협정을 체결하라!"
 AST_diplomatic_events.62.b: "그건 너무 위험하다."
 AST_diplomatic_events.63.t: "아일랜드의 거부!"
 AST_diplomatic_events.63.desc: "아일랜드는 반영국 협정 체결을 거부했습니다."
 AST_diplomatic_events.63.a: "그러면 아일랜드는 계속 분단된 채로 있을 것이다."
 AST_diplomatic_events.64.t: "아일랜드의 수락!"
 AST_diplomatic_events.64.desc: "아일랜드는 반영국 협정 체결을 수락했습니다."
 AST_diplomatic_events.64.a: "진격하라, 벨파스트로!"
 AST_diplomatic_events.65.t: "[FROM.GetName]의 지원" ### Support for the Chinese Communists - Sends event from AST to PRC offering support
 AST_diplomatic_events.65.desc: "[FROM.GetNameDef]에서 커져 가던 [FROM.GetCommunistParty]의 영향력이 마침내 결실을 맺었습니다. 중국을 방문한 [FROM.GetNameDef] 대표단이 알려 준 바로는, [FROM.GetAdjective] 의용군이 우리 군대를 지원하기 위해 움직이고 있다고 합니다. 또한, 이 의용군들은 우리 군대를 위해 남는 장비까지 가져오고 있습니다."
 AST_diplomatic_events.65.a: "앞으로도 [FROM.GetAdjective] 동지들로부터 협조를 기대할 수 있겠군."
 #AST_diplomatic_events.65.b: "They should focus on their own revolution"
 AST_diplomatic_events.66.t: "우리의 지원에 대한 [FROM.GetName]의 감사 표시" ### Support for the Chinese Communists - They accept
 AST_diplomatic_events.66.desc: "[FROM.GetLeader]의 대표단이 의용군과 전쟁 물자를 지원한 우리에게 감사를 전했습니다. [FROM.GetAdjective](은)는 내전을 통해 폭넓은 경험을 쌓았으므로, 분명히 이 자원들을 효과적으로 사용할 겁니다."
 AST_diplomatic_events.66.a: "시작이 아주 좋군."
 AST_diplomatic_events.67.t: "우리의 지원에 대한 [FROM.GetName]의 감사 표시" ### Support for the Chinese Communists - They accept
 AST_diplomatic_events.67.desc: "[FROM.GetLeader]의 대표단이 의용군과 전쟁 물자를 지원한 우리에게 감사를 전했습니다. [FROM.GetAdjective](은)는 내전을 통해 폭넓은 경험을 쌓았으므로, 분명히 이 자원들을 효과적으로 사용할 겁니다."
 AST_diplomatic_events.67.a: "시작이 아주 좋군."
 AST_diplomatic_events.68.t: "호주의 요구"
 AST_diplomatic_events.68.desc: "호주는 압도적인 [JAP.GetNameDef](와)과 홀로 맞서기를 원하지 않습니다. 그들은 우리가 먼저 나서서 다가오는 분쟁을 최대한 빨리 해결하도록 압박하고 있습니다."
 AST_diplomatic_events.68.a: "상황이 역전되었군."
 AST_diplomatic_events.69.t: "한 번 더 연대한다"
 AST_diplomatic_events.69.desc: "[ENG.GetNameDef](와)과 [AST.GetName] 사이의 유대는 시험대에 올랐지만, 호주는 그 유대를 완전히 회복시키기 위해 최선을 다하고 있습니다. [AST.GetName](은)는 영국 정부 내에 연줄과 동맹을 가지고 있어 지도자들은 이를 거부할 수 없습니다. 두 나라는 다시 한 세력에 합류할 것이며, 영국과 호주는 다시 한번 협력할 것입니다."
 AST_diplomatic_events.69.a: "그리될 것이다."
 AST_diplomatic_events.71.t: "호주의 태평양 제도 요청"
 AST_diplomatic_events.71.desc: "[AST.GetName](은)는 서태평양은 [USA.GetNameDef]의 지배 영역이 아니라고 주장하며 우리의 태평양 제도에 대한 지배권을 요구해 왔습니다. 그 섬들을 양보하는 것은 호주의 적대감을 가라앉히기 위해 치르는 작은 값일지 모르나, 어쨌든 대가를 치르는 일입니다. 이미 여러 일로 정신이 없는 상황에서, 떠오르는 파시스트 세력을 자극하는 위험을 감수해야 할까요?"
 AST_diplomatic_events.71.a: "위험을 감수할 수는 없지."
 AST_diplomatic_events.71.b: "태평양 제도는 우리의 것이다!"
 AST_diplomatic_events.72.t: "태평양 제도를 양도한 [USA.GetNameDef]"
 AST_diplomatic_events.72.desc: "이미 처리할 일이 산더미 같았던 그들에게 태평양 제도는 [USA.GetNameDef](이)가 호주의 적대감을 완화하기 위해 치러야 할 작은 대가에 불과했습니다. 이제 그들의 태평양 제도는 우리의 것입니다."
 AST_diplomatic_events.72.a: "훌륭하군."
 AST_diplomatic_events.73.t: "[USA.GetNameDefCap]의 거부"
 AST_diplomatic_events.73.desc: "[USA.GetNameDefCap](은)는 태평양 제도를 우리에게 양도하는 것을 거부했습니다. 태평양 지역에서 영향력을 확대 중인 우리의 요구에도 불구하고, 워싱턴은 여전히 이 섬들을 포기할 의사가 없습니다."
 AST_diplomatic_events.73.a: "그 섬들은 아직 우리의 것이 아니다."
 AST_diplomatic_events.74.t: "호주의 필리핀 양도 요구"
 AST_diplomatic_events.74.desc: "영토 확장의 야망을 품은 [AST.GetName](은)는 [PHI.GetNameDef]에 대한 지배권을 요구하고 있습니다. 우리가 이를 거부한다면, [AST.GetName](은)는 [USA.GetNameDef](이)가 [AST.GetName]의 영향권 내에 영토를 유지하는 것을 용납할 수 없다며 전쟁을 벌이겠다고 협박할 것입니다."
 AST_diplomatic_events.74.a: "전쟁의 위험을 감수할 수는 없다. 요구를 들어주겠다."
 AST_diplomatic_events.74.b: "필리핀은 우리의 것이다!"
 AST_diplomatic_events.75.t: "[PHI.GetNameDef] 양도"
 AST_diplomatic_events.75.desc: "[AST.GetName](이)가 강력한 파시스트 국가로 부상하면서 분명한 이점이 생겼습니다. 여러 국가가 우리의 분노를 이 정도로 두려워하게 된 것입니다. [USA.GetNameDefCap](은)는 동의했고, 이제 [PHI.GetNameDef](은)는 우리의 것입니다."
 AST_diplomatic_events.75.a: "새로운 질서가 등장한다."
 AST_diplomatic_events.76.t: "[USA.GetNameDefCap]의 거부"
 AST_diplomatic_events.76.desc: "[USA.GetNameDefCap](은)는 [PHI.GetNameDef](을)를 우리에게 양도하는 것을 거부했습니다. 태평양 지역에서 영향력을 확대 중인 우리의 요구에도 불구하고, 워싱턴은 여전히 이 영토를 포기할 의사가 없습니다."
 AST_diplomatic_events.76.a: "그렇다면 전쟁이다."
 AST_diplomatic_events.78.t: "거대한 적에 맞서며 지원 보장을 요구하는 [AST.GetName]"
 AST_diplomatic_events.78.desc: "[AST.GetNameDefCap](은)는 우리와 공통되는 확고한 목표를 가지고 있습니다.\n\n'[USA.GetNameDefCap]의 그림자가 우리 위에 드리워져, 우리의 행동이 그들의 이익에 부합하지 않을 때마다 간섭하겠다고 위협하고 있습니다. 이처럼 막강한 세계적 강대국이 호주와 일본의 일에 간섭하는 한, 동아시아는 결코 진정으로 우리의 것이 될 수 없을 것입니다. 따라서 [AST.GetName](은)는 전쟁을 치러야만 합니다.'\n\n[AST.GetLeader] 총리는 자신의 의도를 아주 분명하게 밝히고 있습니다. [AST.GetName](은)는 [USA.GetNameDef]에 맞서 싸울 생각이며, 미국이 홀로 상대하기에는 너무 강력한 적으로 드러날 경우 우리의 지원을 요청하고 있습니다."
 AST_diplomatic_events.78.a: "우리는 지원을 보장하겠다."
 AST_diplomatic_events.78.b: "[JAP.GetNameDefCap](은)는 따로 신경 써야 할 일이 있다."
 AST_diplomatic_events.79.t: "[AST.GetName]에게 지원을 보장한 [JAP.GetNameDefCap]"
 AST_diplomatic_events.79.desc: "아시아와 오세아니아의 외교에 대한 [USA.GetNameDef]의 간섭은 우리만이 아니라 전 세계의 입장에서도 바람직하지 않으며 용납할 수 없는 일임이 분명합니다. [JAP.GetNameDefCap](은)는 우리 국가에 대한 지원을 보장하기로 동의했으며, 이를 통해 우리는 미국이 우리가 홀로 상대하기에는 너무 강력한 적으로 드러날 경우 동맹이 우리를 지원할 것이라는 확신을 가지고 적에게 당당히 맞설 수 있습니다."
 AST_diplomatic_events.79.a: "우리는 함께 진군할 것이다."
 AST_diplomatic_events.80.t: "[JAP.GetNameDefCap]의 지원 보장 거부"
 AST_diplomatic_events.80.desc: "아시아와 오세아니아의 외교에 대한 [USA.GetNameDefCap]의 간섭은 바람직하지 않으며 또한 용납할 수 없으나, 이것을 분명하게 인식하고 있는 것은 우리뿐인 것 같습니다. [JAP.GetNameDefCap](은)는 우리에 대한 지원 보장을 거부했으며, 우리는 그들 없이 적들과 맞서야 합니다."
 AST_diplomatic_events.80.a: "그렇다면 우리 힘으로 맞서겠다."
 AST_diplomatic_events.81.t: "매력적인 화합의 상징"
 AST_diplomatic_events.81.desc: "영국 총리의 동물에 대한 관심은 이미 널리 알려져 있으며, 그의 동물 컬렉션은 상당히 인상적입니다. 그의 다양한 컬렉션에 새로운 동물이 추가된다면 그는 분명 감사를 표하겠지만, 이국적인 동물이라면 그 감사가 더욱 클 것입니다.\n\n[ENG.GetLeader] 총리 본인도 호주의 오리너구리에 관심을 표명한 적이 있지만, 현재 오리너구리는 반출이 금지되어 있으며 그 이유는 운송 과정이 그 작은 동물의 건강을 해칠 수 있다는 것입니다. 하지만 이번에는 예외로 할 만한 가치가 있을 수 있습니다.\n\n화합의 상징으로서 총리의 바람을 들어주는 것은 어떨까요?"
 AST_diplomatic_events.81.a: "[ENG.GetLeader]에게 오리너구리를 선물하겠다."
 AST_diplomatic_events.81.b: "영국 총리를 위한 일이라도, 반출 금지에 예외를 둘 수는 없다."
 AST_diplomatic_events.82.t: "[ENG.GetLeader](으)로부터 온 비통한 보고"
 AST_diplomatic_events.82.desc: "오리너구리와 그 사육장을 싣고 6주 전 멜버른 항구를 출발한 수송선이 마침내 [ENG.GetNameDef]에 도착했습니다. 하지만, 이 함선의 도착이 기쁜 소식이 되지는 않았습니다. 오리너구리가 죽어 버렸기 때문입니다. 기다리던 동안에 자신의 이름을 따서 오리너구리의 이름을 지어 준 [ENG.GetLeader] 총리는 슬픔에 잠겼으며, 오리너구리의 죽음은 적에게 책임이 있다고 주장합니다. 잠수함의 공격으로 인한 폭발음에 오리너구리가 겁에 질려 죽었다는 것입니다.\n\n하지만 오리너구리 사육사의 일지에는 또 다른 사망 원인이 제시되어 있습니다. 오리너구리 사육장의 물과 공기 온도가 허용 수준을 훨씬 넘어섰다는 것입니다.\n\n어쨌든 [ENG.GetLeader](이)라는 이름의 오리너구리는 죽었고, 영국 총리는 계속해서 오리너구리 없이 살아가야 할 것입니다."
 AST_diplomatic_events.82.a: "정말 슬픈 소식이군."
 AST_political_events.1.t: "국민투표 요구"
 AST_political_events.1.desc: "우리가 정부로서 연방의 통제를 강화하고자 하는 분야는 항공과 마케팅 두 가지입니다.\n\n항공 분야에서는, 연방 의회가 공중 항행 및 항공기에 대한 법률을 제정할 수 있도록 헌법을 개정하는 것이 목표입니다.\n\n마케팅 분야의 개정안은 현재 헌법상 불가능한 연방과 주 간의 마케팅 분야 협력을 허용하는 것입니다.\n\n우리는 어느 쪽을 국민투표에 부쳐야 할까요?"
 AST_political_events.1.a: "항공이다, [AST.GetName] 전역의 공중 항행을 통제할 것이다."
 AST_political_events.1.a.tt: "이 개혁이 통과될 경우:\n §Y항공 개혁 통과§!가 추가되어, 다음 효과를 부여:\n 항공 연구 속도: §G+15%§!\n §Y공군기지§! 건설 속도: §G+5.00%§!"
 AST_political_events.1.b: "마케팅이다, 전국적인 농업 마케팅 계획을 조정할 것이다."
 AST_political_events.1.b.tt: "이 개혁이 통과될 경우:\n §Y마케팅 개혁 통과§!가 추가되어, 다음 효과를 부여:\n 소비재 공장 변동치: §Y-10.0%§!"
 AST_political_events.2.t: "성공적인 국민투표"
 AST_political_events.2.desc.a: "국민들은 우리의 항공 개혁 시행에 동의했습니다. 호주 헌법이 제정될 당시에는 항공이라는 것이 존재하지 않았으므로, 정부가 공중 항행 및 규제에 대한 권한을 최종적으로 가지는 것은 당연한 일입니다. 안전과 효율을 위하여, 이다음에는 통일된 전국 항공법이 제정되어야 합니다."
 AST_political_events.2.desc.b: "국민들은 우리의 마케팅 개혁 시행에 동의했습니다. 농산물과 그 유통을 규제할 수 있는 권한을 갖게 된 정부는 이제 시장을 안정시키고 주 사이의 협력을 개선할 수 있을 것입니다. 농민들의 소득은 더욱 안정될 것이며, 국가 경제 또한 그러할 것입니다."
 AST_political_events.2.a: "연방의 통제력은 확대될 것이다!"
 AST_political_events.4.t: "쓰러지고 만 총리"
 AST_political_events.4.desc: "[AST.GetName] 지도부는 오랫동안 전쟁 준비를 위해 고되게 일했고, 결국 그 압박이 최고 지도자의 목숨을 앗아갔습니다. 총리가 심장마비로 사망하고 만 것입니다.\n\n현재 세계정세를 고려할 때 그의 지도력을 잃은 것은 매우 큰 손실입니다. 하지만 호주는 새로운 지도자인 [AST.GetLeader]의 주도 아래 앞으로 나아가야 합니다."
 AST_political_events.4.a: "국가적인 비극이로군."
 AST_political_events.5.t: "단호한 입장을 취하는 호주 정부"
 AST_political_events.5.desc: "반항적이고 논란의 여지가 있는 목소리를 내는 단체인 '호주 제일주의 운동'이 결성되었습니다. 정부는 이 단체의 의도가 완전히 민주적이지 않을 수 있다고 우려하여 이 단체는 물론 그 구성원들까지 감시하에 두기로 했습니다. 민주주의자들의 간섭은 우리의 조직력을 약화시키고 신규 구성원 모집을 저해할 것입니다."
 AST_political_events.5.a: "이 운동의 본질은 시간이 지나면 알게 될 것이다."
 AST_political_events.6.t: "150주년을 맞은 1938년"
 AST_political_events.6.desc: "오늘 오전, 1938년 영국 식민 통치 150주년 기념행사가 진행되고 '호주의 독립 국가 건설을 향한 행진' 행렬이 시드니 주요 거리를 행진하는 동안, 오스트레일리아 홀에서는 항의 시위가 열렸습니다.\n\n원주민 권리 운동가들과 단체들은 150주년 기념일이 영국 식민 통치의 시작일 뿐만 아니라 원주민에 대한 헌법적 차별을 상기시키는 날이기도 하다는 점을 강조하기 위해 모였습니다. 이들은 원주민에 대한 교육 및 복지를 위한 새로운 법률과 원주민의 완전한 시민권 획득을 위한 새로운 정책을 요구했습니다."
 AST_political_events.6.a: "행동을 취해야 한다."
 AST_political_events.7.t: "제국의 압박"
 AST_political_events.7.desc: "최근의 사건들 이후로, 호주의 정치 상황이 변화하고 있다는 사실은 더 이상 부인할 수 없습니다. [ENG.GetNameDefCap](은)는 [AST.GetName](이)가 영연방의 일원으로서 걸맞은 길을 유지하도록 외교적으로 조치를 취했으며, 올바른 방향으로의 평화로운 개입만으로도 그 자치령의 충성을 유지할 수 있기를 바라고 있습니다."
 AST_political_events.7.a: "영국이 애를 쓰지만, [AST.GetName](은)는 결국 독자적인 길을 걸으리라."
 AST_political_events.8.t: "다가오는 전쟁"
 AST_political_events.8.desc: "$AST_war_is_coming_cat_desc$"
 AST_political_events.8.a: "전쟁을 준비해야 한다."
 AST_political_events.9.t: "달프람 분쟁"
 AST_political_events.9.desc: "선철 선적을 둘러싼 분쟁이 훨씬 더 큰 사태로 번지고 있습니다. 호주 전역의 노동자들이 정부와 산업 모두에 맞서 연대 파업에 돌입했습니다. 파업이 확산되고 긴장이 고조되면서, 위기는 점점 심화되어 권력자들의 사임을 요구합니다. 결국 상황을 완전히 통제하지 못한 정부는 사임하고, 집권 정당의 자리를 [AST.GetCommunistParty](이)가 차지할 수 있게 되었습니다."
 AST_political_events.9.a: "그 자리를 우리가 차지할 것이다."
 AST_canberra_air_disaster_events.1.t: "캔버라 항공 참사"
 AST_canberra_air_disaster_events.1.desc: "오늘 아침, 록히드 허드슨 항공기가 캔버라 외곽에서 추락했습니다. 탑승자 10명 중에는 내각 회의 소집에 응하던 육군참모총장과 참모진이 있었으며, 이들과 승무원 전원이 비극적으로 목숨을 잃었습니다.\n\n추락 원인은 아직도 수수께끼로 남아 있습니다. 당시 날씨는 비행하기에 아주 좋은 상태였고, 조종사는 노련한 호주 왕립공군 장교인 로버트 히치콕 대위였습니다.\n\n원인이 무엇이든 간에, 오늘은 희생자들의 가족과 친구들은 물론 온 국민에게도 암울한 날입니다. 이제 호주는 지도자들의 대응에 주목하고 있습니다. 그들은 어떻게 대응할까요?"
 AST_canberra_air_disaster_events.1.a: "끔찍하고 비극적인 사건이군."
 AST_canberra_air_disaster_events.1.a.tt: "현 정부를 유지하거나 교체하는 §Y'내각 신뢰' 결정§! 및 §Y임무§! 잠금 해제."
 AST_canberra_air_disaster_events.2.t: "[AST.GetRulingParty]의 승리"
 AST_canberra_air_disaster_events.2.desc: "현 정부는 캔버라 항공 참사 이후 국가적 혼란 속에서 호주를 성공적으로 이끌어 왔습니다. 마치 등대처럼, [AST.GetRulingParty](은)는 어려운 시기에 신뢰성과 강점을 입증하였으며, 결국 전국에서 대중의 지지가 상승했습니다."
 AST_canberra_air_disaster_events.2.a: "미래가 앞에 있다."
 AST_canberra_air_disaster_events.3.t: "불신임 결의"
 AST_canberra_air_disaster_events.3.desc: "불신임안이 통과되면서 현 정부는 마침내 교체되었고, 마지못해 후임 정부에 정권을 넘겨주었습니다. 정치적 불안정과 대중 불신의 시기를 지나, 호주는 새로운 시작을 맞이할 준비가 되었습니다."
 AST_canberra_air_disaster_events.3.a: "호주의 지원을 이끌어갈 새로운 지도부로군."
 AST_canberra_air_disaster_events.4.t: "지도부 교체"
 AST_canberra_air_disaster_events.4.desc: "정치적 불안정과 대중 불신의 시기가 지난 후, [AST.GetRulingParty](은)는 지도부를 교체했습니다. 과반수 찬성으로 총리는 사임하고, 후임자가 그 자리를 차지하게 되었습니다."
 AST_canberra_air_disaster_events.4.a: "이것이 호주에게 길을 열어주기를."
 AST_canberra_air_disaster_events.5.t: "호주의 비난"
 AST_canberra_air_disaster_events.5.desc: "기자회견에서 [AST.GetName](은)는 최근 호주 영토에서 발생한 비행기 추락 사고로 여러 정치인이 사망한 일에 대해 우리에게 책임이 있다고 주장하며 우리를 비난했습니다.\n\n이러한 비난은 물론 완전히 틀린 것이며, 그렇기에 그 무례함은 한층 더 악질적일 뿐입니다."
 AST_canberra_air_disaster_events.5.a: "이 주장은 틀린 것이며, 대응할 필요가 없다."
 AST_canberra_air_disaster_events.5.b: "대가를 치르게 될 것이다."
 AST_canberra_air_disaster_events.6.t: "[JAP.GetNameDefCap]의 보복"
 AST_canberra_air_disaster_events.6.desc: "[JAP.GetNameDefCap](은)는 우리의 비난을 가볍게 여기지 않고, 이를 최초의 침략 행위로 간주했습니다. [JAP.GetLeader](은)는 더 나아가, 이제 자국은 우리 영토를 침공할 정당한 권리가 있다고 주장하며 갈등을 더욱 격화시켰습니다."
 AST_canberra_air_disaster_events.6.a: "더 이상 긴장을 고조시켜서는 안 된다."
 AST_canberra_air_disaster_events.6.b: "이건 응답을 해야겠군."
 INS_limited_war_events.1.t: "말라야를 분쇄하라!"
 INS_limited_war_events.1.desc: "적의 전선이 뚫리고 우리 병사들은 아무런 저항 없이 전진하고 있습니다. 해협 건너편에서는 영국의 괴뢰국이 민중의 분노에 눌려 무너지고 있습니다. 런던의 꼭두각시들은 총검이 자신들을 역사의 물결로부터 지켜줄 것이라고 생각했지만, 그들은 틀렸습니다."
 INS_limited_war_events.1.a: "독립이로구나!"
 INS_limited_war_events.1.b: "공화국에 좋은 날이로구나."
 INS_limited_war_events.2.t: "[FROM.GetAdjective]의 역공"
 INS_limited_war_events.2.desc: "괴뢰 정권을 신속하게 공격하기로 한 약속은 틀어졌습니다. 제국의 지원을 받은 [FROM.GetAdjective]군은 전장에서 우리 군대를 몰아내고 점령했습니다. 매일 그들은 라디오를 통해 허풍을 떠들어대고 있습니다. 계속 진격하면 더 큰 굴욕을 초래할 뿐이고, 철수하면 이 제도 전체에 패배를 인정하는 꼴입니다."
 INS_limited_war_events.2.a: "병력을 철수하라. 구할 수 있는 건 구해야지."
 INS_limited_war_events.2.b: "우리는 괴뢰국에 항복하지 않을 것이다!"
 INS_limited_war_events.3.t: "공화국에 고개를 숙인 [FROM.GetName]"
 INS_limited_war_events.3.desc: "쿠알라룸푸르에서 소식이 왔습니다. 런던의 주인들에게 결정적인 순간에 버림받은 괴뢰 정부가, 도시가 불타는 것을 차마 볼 수 없어 우리의 조건을 받아들였다고 합니다. 분쟁 영토는 이제 우리 것입니다. 이 지역의 다른 종속국들도 이 교훈을 똑똑히 깨우쳤을 것입니다."
 INS_limited_war_events.3.a: "인도네시아가 부상하는구나."
 INS_limited_war_events.4.t: "우리의 제안을 일축한 [FROM.GetName]"
 INS_limited_war_events.4.desc: "[FROM.GetName](은)는 우리의 제안을 단호히 거절했습니다. 꼭두각시 장관들은 화이트홀에서 작성된 대본을 읽으며, 한 뼘의 땅도 내주지 않을 것이며 공화국 자체를 무릎 꿇리기 전에는 총성이 멈추지 않을 것이라고 선언했습니다."
 INS_limited_war_events.4.a: "그러면 총구로 대화하도록 하겠다."
 INS_limited_war_events.5.t: "우리의 파괴를 요구하는 [FROM.GetNameDef]"
 INS_limited_war_events.5.desc: "[FROM.GetNameDefCap](은)는 신중한 전쟁이라는 마지막 가식마저 벗어 던졌습니다. 이제 그들의 방송에서는 공화국을 분할하고 그 섬들을 옛 식민지 지배자들에게 나눠주겠다는 발언이 공공연하게 나오고 있습니다. 이 사태는 조용히 끝나지 않을 것이며, 사태가 끝날 때 인도네시아가 살아남느냐, 아니면 완전히 사라지느냐가 문제입니다."
 INS_limited_war_events.5.a: "우리는 살아남을 때도 패배할 때도 함께일 것이다."
 INS_limited_war_events.6.t: "주춤해진 [FROM.GetAdjective]의 진격"
 INS_limited_war_events.6.desc: "[FROM.GetAdjective](은)는 미처 대비하지 못한 우리를 공격했고, 한 계절 동안 우리는 최악의 상황을 두려워했습니다. 그러나 그들의 공세는 진흙탕에 빠지고 말았습니다. 그들의 병사들은 지쳤고, 전선은 길어졌으며, 런던의 허세는 점점 더 약해지고 있습니다. 공화국이 꼭두각시 정권에게 관용을 베풀어 이 전쟁에서 물러날 길을 제시할 수도 있지만, 많은 이들은 신중한 승리보다는 깔끔한 승리가 대의에 더 도움이 된다고 말할 것입니다."
 INS_limited_war_events.6.a: "그들에게 조건을 제시하라."
 INS_limited_war_events.6.b: "꼭두각시들에게 자비는 없다."
 INS_limited_war_events.7.t: "멈춰 버린 우리의 공세"
 INS_limited_war_events.7.desc: "우리의 진격이 멈춰 버렸고, 더 심각한 점은 적이 이를 알고 있다는 것입니다. 해협 건너편에서 요구가 들어왔습니다. 지금 당장 무기를 내려놓고 그들의 조건을 받아들이거나, 아니면 이대로 사상자 명단이 늘어나는 것을 지켜보라는 것입니다. 그들은 장례식의 규모를 선택하라고 종용하고 있습니다."
 INS_limited_war_events.7.a: "궁색한 평화가 더 심각한 전쟁보다 낫지."
 INS_limited_war_events.7.b: "공화국은 굴복하지 않는다."
 INS_limited_war_events.8.t: "[FROM.GetName]의 굴복 거부"
 INS_limited_war_events.8.desc: "[FROM.GetName](은)는 우리의 제안에 반발했습니다. 그들의 장관들은 공화국에 단 한 번이라도 양보하느니 차라리 페낭에서 조호르까지 모든 마을이 불타는 것이 낫다고 공언했습니다. 전쟁은 계속됩니다."
 INS_limited_war_events.8.a: "원한다면 그렇게 해 주지."
 INS_limited_war_events.9.t: "공화국을 붕괴시키려는 [FROM.GetName]"
 INS_limited_war_events.9.desc: "적 사령부의 무선을 감청한 결과 최악의 상황이 확인되었습니다. 합의는 없을 것이며, 신중한 평화도, 우리가 이전에 유지하던 전선으로의 복귀도 없을 것입니다. 괴뢰 정권과 런던에 있는 그들의 주인들은 공화국의 완전한 항복을, 인도네시아의 무력화와 우리가 해방시켜 준 섬들을 다시 제국주의의 발밑에 되돌려 놓을 것을 요구하고 있습니다. 이에 대한 답은 오직 하나뿐입니다."
 INS_limited_war_events.9.a: "인도네시아는 굳게 맞선다!"
 ### AST - Union Control Events ###
 AST_union_control_events.1.t: "우리 노동조합에 침투한 외국의 요원들"
 AST_union_control_events.1.desc: "정보국에서 정부에 우려스러운 보고서를 제출했습니다. 호주의 공산주의자 공작원들이 지역 노동조합 지도자들과 접촉하여 급진적인 문헌을 배포하고 노동자들이 혁명 노선을 따라 조직화하도록 부추기고 있다는 것입니다. 현재는 그 규모가 작지만, 안보 당국은 바로 이런 식으로 문제가 시작된다고 경고합니다. 이러한 움직임이 뿌리를 내리기 전에 결정을 내려야 합니다."
 AST_union_control_events.1.a: "그들을 계속 감시해라. 지켜보면서 때를 기다릴 것이다."
 AST_union_control_events.4.t: "공산주의자 침투요원들의 [MAL.GetAdjective] 영토 점령"
 AST_union_control_events.4.desc: "정부에 충격적인 보고가 도착했습니다. 조직적인 작전으로 우리의 한 주가 점령당했고, 그 주가 혁명 정부의 일부로 선포되었습니다. 공격의 속도와 조직력은 불편한 의문을 불러일으켰습니다. 우리 정보국은 그 반군들이 단독으로 행동한 것이 아니며, 외세의 손길이 이들을 우리 해안으로 이끌었을 가능성을 의심하고 있습니다. 점령에서 탈출한 이들은 항복하지 않고 재집결하여 무기를 들고, 빼앗긴 것을 되찾겠다는 결의를 다지고 있습니다."
 AST_union_control_events.4.a: "누가 배후에 있는지 알아내라. 이 반란분자들은 그 땅에 오래 있지 못할 것이다."
 AST_union_control_events.4.a.tt: "공산주의자들의 점령에 저항하기 위해 반공주의자 민병대가 집결했습니다."
 AST_union_control_events.5.t: "[MAL.GetAdjective]의 참사"
 AST_union_control_events.5.desc: "작전은 참담한 실패로 끝났습니다. 우리 군대는 상륙조차 하지 못했습니다. 충성파 순찰대에 의해 저지당하거나, 해협에서 길을 잃거나, 진지를 구축하기도 전에 포로로 잡혔습니다. 자세한 내용은 불분명하지만, 결과는 분명합니다. 더 심각한 것은 언론이 이 사건의 낌새를 알아챘다는 점입니다. 의회에서는 우리 군대가 그 해역에서 정확히 무엇을 하고 있었는지에 대해 질문하고 있습니다. 국민들은 충격과 당혹에 빠져 있습니다. 혁명을 위해 우리가 무엇을 얻고자 했든, 우리는 다른 방법을 찾아야 할 것입니다."
 AST_union_control_events.5.a: "끔찍한 실패로군. 동지들을 지원할 다른 방법을 찾아야 한다."
 AST_union_control_events.3.t: "[MAL.GetNonIdeologyName]에서의 혁명 발생"
 AST_union_control_events.3.desc: "[MAL.GetNonIdeologyName]의 노동자들이 봉기했습니다. 오랜 공작을 통해 육성된 공산주의 조직들이 전국 각지에서 무기를 들었지만, 현장의 상황은 우려스럽습니다. 혁명군은 반도 중심부와 물과 정글로 단절되어 있는, 잘못된 지역에 집중되어 있습니다. 본토에 기반을 마련하지 못한 정부는 혁명군을 지연시키며, 혁명이 확산되기도 전에 굶주리게 할 것입니다. 호주는 은밀하고 신속하게 반도에 전투원들을 상륙시켜 혁명이 생존하는 데 필요한 기반을 마련해야 합니다."
 AST_union_control_events.3.a: "혁명이 해안에서 죽어 버리게 둘 수 없다. 그들에게 기반을 만들어 줘라."
 AST_union_control_events.2.t: "우리 거리의 선동가들을 지원하는 [AST.GetAdjective]"
 AST_union_control_events.2.desc: "호주 공산 정부의 요원들이 우리 도시에 도착했습니다. 그들은 숨지도 않습니다. 공장 문 앞에서 전단지를 배포하고, 공공 광장에서 연설하며, 호주 공작원들과 지역의 급진 단체들 사이에 연결망을 구축하고 있습니다. 기존의 외국 영향력 연결망이 하룻밤 사이에 다시 활성화된 것으로 보입니다. 이는 조직적인 공작이며, 정부는 국민의 불만이 통제하기 힘들 정도로 악화되기 전에 어떻게 대응할지 결정해야 합니다."
 AST_union_control_events.2.b: "골치 아픈 상황이로군."
 ###########################
 ##### ABDACOM EVENTS ######
 ###########################
 ABDA_events.1.t: "새로운 최고사령부로의 초청"
 ABDA_events.1.desc: "[FROM.GetNameDef](은)는 태평양 전구를 위한 합동 최고사령부를 창설하고 우리를 초청했습니다. ABDA사령부라고 불리는 이 계획은 이 지역에서 작전 중인 동맹국의 해군, 공군, 지상군을 단일한 지휘 구조 아래 통합하는 것을 목표로 합니다. 회원국이 되면 이미 참여하고 있는 [FROM.GetNameDef] 및 다른 파트너 국가들과의 협력이 더욱 긴밀해질 것입니다. 우리는 이 제안을 수락할지를 결정해야 합니다."
 ABDA_events.1.a: "우리는 함께할 것이다."
 ABDA_events.1.b: "지금은 이런 일에 신경 쓸 수 없다."
 ABDA_events.2.t: "[FROM.GetName]의 ABDA사령부 가입"
 ABDA_events.2.desc: "[FROM.GetNameDef](은)는 ABDA최고사령부 초청을 수락했습니다. 이제 그들의 군대는 합동 지휘 구조하에서 작전을 수행하게 되며, 이는 태평양 전구에서 우리의 입지를 강화할 것입니다."
 ABDA_events.2.a: "환영할 만한 상황이다."
 ABDA_events.3.t: "[FROM.GetName]의 가입 거부"
 ABDA_events.3.desc: "[FROM.GetNameDef](은)는 ABDA최고사령부 초청을 거부했습니다. 현재는 그들의 군대가 합동 작전에 참여하지 않겠지만, 아직 가능성은 열려 있습니다."
 ABDA_events.3.a: "유감스럽군, 알았다."
 ABDA_events.5.t: "ABDA사령부 가입 권유"
 ABDA_events.5.desc: "[FROM.GetNameDef](은)는 우리에게 미국-영국-네덜란드-호주 합동사령부, 즉 ABDA사령부에 가입할 것을 제안했습니다. ABDA사령부는 이미 태평양 전구에서 연합군을 총괄하는 최고사령부로서 주요 연합국의 해군과 육군을 하나의 사령부 아래 통합해 왔습니다. 여기에 가입하면 우리 군은 이러한 통합된 구조에 편입되어 정보 공유, 교리 조정, 그리고 연합국의 전폭적인 지원을 받을 수 있게 됩니다. 우리는 결정을 내려야 합니다."
 ABDA_events.5.a: "우리는 함께할 것이다."
 ABDA_events.5.b: "지금은 이런 일에 신경 쓸 수 없다."
 ABDA_events.4.t: "싱가포르 방어"
 ABDA_events.4.desc: "싱가포르가 ABDA사령부 방어선의 핵심으로 지정된 만큼, 우리 지휘관들은 어떤 식으로 싱가포르의 요새화에 투자할지를 결정해야 합니다. 해상 접근로와 항만 방어를 우선시하거나, 지상 공격에 대비한 육상 접근로를 강화하거나, 아니면 자원을 양쪽에 분산하여 투자할 수 있습니다. 어떤 방침을 택하느냐에 따라 적이 들이닥쳤을 때 싱가포르를 방어하는 방식이 달라질 것입니다."
 ABDA_events.4.a: "해상 접근로를 강화한다. 싱가포르의 힘은 항구에 있다."
 ABDA_events.4.b: "육상 방어선을 요새화한다. 진정한 위협은 육로로 올 것이다."
 ABDA_events.4.c: "균형을 유지한다. 어느 침공로도 방치해서는 안 된다."
 ABDA_fortress_singapore_choice_tt: "이 중점을 완료하면 싱가포르 요새화 방식을 선택할 수 있습니다."
 ABDA_faction_membership_requirement_tt: "자격을 갖춘 세력 회원국에 가입 초청이 발송됩니다."
