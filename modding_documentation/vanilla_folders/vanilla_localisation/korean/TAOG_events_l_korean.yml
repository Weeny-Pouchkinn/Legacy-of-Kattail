 INS_hey_btw_you_are_gonna_die_just_know_that_yeah_tt: "§R당신의 게임이 종료됩니다.§!"
 # Revolution events
 INS_revolution_events.1.t: "공화국을 붕괴시키려는 [HOL.GetNameDefCap]"
 INS_revolution_events.1.desc: "예상한 바와 같이, 네덜란드 정부는 우리의 독립 요구에 대응하여 [1058.GetName]에 군대를 파견하고 언론을 통해 반공화주의 선전을 유포했습니다."
 INS_revolution_events.1.a: "빠르게 행동해야 한다."
 INS_revolution_events.2.t: "[HOL.GetNameDefCap]의 추가적인 지원 요청"
 INS_revolution_events.2.desc: "[HOL.GetLeader](은)는 우리 지도자들과의 긴급회의를 소집하여, 동인도 제도의 재정복을 위해 더 많은 지원을 요청했으며, 직접 참전하는 수준의 추가 지원도 포함되었습니다. [HOL.GetLeader](은)는 상황이 매우 심각하며 네덜란드군이 혁명 민병대를 격퇴할 수 없다고 밝혔습니다. [HOL.GetLeader](은)는 우리가 그들을 도우면 그 대가로 보르네오를 넘기겠다고 약속했습니다."
 INS_revolution_events.2.a: "지원해 주고 보르네오를 얻어야겠다."
 INS_revolution_events.2.b: "우리는 관심 없다."
 INS_revolution_events.3.t: "런던-바타비아 협정에 동의한 [ENG.GetNameDefCap]"
 INS_revolution_events.3.desc: "[ENG.GetNameDefCap](은)는 바타비아에서의 전투에 다수의 사단을 파견하여 직접 참전하기로 합의했습니다. 비록 보르네오를 포기해야 하겠지만, 이는 우리에게 유리한 상황으로 이어집니다."
 INS_revolution_events.3.a: "보르네오는 필요한 희생이었다."
 INS_revolution_events.4.t: "런던-바타비아 협정을 거절한 [ENG.GetNameDefCap]"
 INS_revolution_events.4.desc: "[ENG.GetNameDefCap](은)는 긴급한 상황과 제시된 보상에도 불구하고 분쟁에 대한 추가 지원을 거절했습니다. [ENG.GetLeader](은)는 우리가 식민 제국을 유지하는 것이 그들의 이익에 부합하지만, 그들이 개입할 경우 세계적으로 확전될 위험이 너무 크기 때문에 우리가 스스로 해결해야 한다고 밝혔습니다."
 INS_revolution_events.4.a: "좋은 소식은 아니군."
 INS_revolution_events.5.t: "우리의 지원을 요청하는 [HOL.GetNameDefCap]"
 INS_revolution_events.5.desc: "네덜란드령 동인도 제도의 혁명가들이 [HOL.GetNameDef](으)로부터 독립을 선언하고 주요 도시들을 점령했습니다. [HOL.GetLeader](은)는 우리에게 긴급히 연락하여, 그들이 침공을 준비하는 동안에 군사적 지원을 해줄 것을 요청했습니다."
 INS_revolution_events.5.a: "그 혁명가들이 성공한다면, 우리 식민지 시민들도 똑같이 하려 들지 모른다."
 INS_revolution_events.5.b: "우리는 관심 없다."
 INS_revolution_events.6.t: "[ENG.GetNameDefCap]의 지원 동의"
 INS_revolution_events.6.desc: "[ENG.GetNameDefCap](은)는 우리가 동인도의 통제권을 되찾도록 돕기 위해 의용군과 장비를 [1058.GetName]에 파견하기로 동의했습니다."
 INS_revolution_events.6.a: "식은 죽 먹기겠군."
 INS_revolution_events.7.t: "[ENG.GetNameDefCap]의 지원 거부"
 INS_revolution_events.7.desc: "[ENG.GetNameDefCap](은)는 분쟁 지역과 가까이 있음에도 불구하고, 동인도 제도는 자신들과 상관이 없다고 주장하며 우리가 동인도 제도에 대한 통제권을 되찾도록 돕기를 거부했습니다. 우리는 왕립 네덜란드령 동인도군을 스스로 재무장시켜야 할 것입니다."
 INS_revolution_events.7.a: "받아들일 수 없다!"
 INS_revolution_events.8.t: "동인도 제도에서 음모를 꾸미는 혁명 민병대"
 INS_revolution_events.8.desc: "동인도 제도의 우리 식민지 경찰이 인도네시아에서 세력을 확장하고 있는 혁명 운동 단체의 구성원 여러 명을 체포하여 심문했습니다. 이들은 국가 독립운동을 준비하기 위해 군대를 만들려는 것으로 보입니다. 아직 확실하지는 않지만, 무장 혁명을 모의하고 있을 가능성도 있습니다."
 INS_revolution_events.8.a: "면밀히 주시해야겠군."
 INS_revolution_events.9.t: "인도네시아의 독립 선언"
 INS_revolution_events.9.desc: "[INS.GetLeader](이)가 오늘 자바에서 연설을 통해 새로 건국된 인도네시아 공화국의 독립을 선언했습니다. 우리는 이 새로운 공화국을 인정하지 않지만, 그들의 민병대가 영토를 점령했고 우리 경찰은 그 지역을 제대로 통제하지 못하고 있습니다. 이 상황을 심각하게 받아들이지 않으면 전면전으로 번질 수 있습니다."
 INS_revolution_events.9.a: "받아들일 수 없다!"
 INS_revolution_events.9.b: "이런 일에 힘을 쓸 가치는 없다. 그렇게나 독립을 원한다면 그렇게 하라고 하라."
 #INS_revolution_events.10.t: ""
 #INS_revolution_events.10.desc: ""
 #INS_revolution_events.10.a: ""
 INS_revolution_events.11.t: "민병대의 행동을 저지한 동인도 군대"
 INS_revolution_events.11.desc: "공화주의 민병대가 [?event_target:INS_temp_occupied_state.GetName] 지역을 점령하기 위한 군사 행동을 개시했습니다. 그러나 우리 용감한 병사들은 동인도 제도에서 민병대를 성공적으로 격퇴하고 해당 지역에 대한 완전한 통제권을 유지했습니다."
 INS_revolution_events.11.a: "이번에도 [HOL.GetNameDef]의 승리다."
 INS_revolution_events.12.t: "[?event_target:INS_temp_occupied_state.GetName] 점령을 시도한 민병대"
 INS_revolution_events.12.desc: "공화파 민병대가 [?event_target:INS_temp_occupied_state.GetName] 지역을 점령하기 위한 군사 행동을 개시했습니다. 우리 경찰과 군대는 결국 상황을 진압했지만, 이 사건은 [?event_target:INS_temp_occupied_state.GetName] 내부에서 반발을 일으켰고, 많은 시민이 민병대를 지지하며 공개적으로 [HOL.GetAdjective] 정부를 비난하고 있습니다."
 INS_revolution_events.12.a: "이대로 상황이 악화되게 두어선 안 된다."
 INS_revolution_events.14.t: "[?event_target:INS_temp_occupied_state.GetName] 지역을 점령한 민병대"
 INS_revolution_events.14.desc: "우리 식민지 경찰과 군대가 최선을 다했지만, 공화주의자 민병대는 군사 행동으로 [?event_target:INS_temp_occupied_state.GetName] 지역을 점령하는 데 성공했습니다. 우리 경찰과 군대는 철수해야 했으며, 민병대의 저항으로 인해 해당 지역을 통치할 수 없음을 선언했습니다. 만약 우리가 민병대의 공격을 계속 받는다면, 우리의 위대한 식민지를 영원히 잃을 수도 있습니다."
 INS_revolution_events.14.a: "어이가 없군!"
 INS_revolution_no_effect_tt: "효과 없음."
 INS_revolution_events.19.t: "동인도 제도에서의 평화 협상"
 INS_revolution_events.19.desc: "[HOL.GetLeader](은)는 잠재적인 평화 협정을 논의하기 위해 [INS.GetLeader](와)과의 회담에 소집되었습니다. [INS.GetLeader](은)는 너무나 많은 생명이 희생되었다고 밝히고, 국경을 현재 상태에서 약간 조정하여 유지하고, 전투를 영구적으로 중단하는 '두 국가 해법'을 제안했습니다."
 INS_revolution_events.19.a: "동의해야 한다. 너무 많은 생명이 희생되었어."
 INS_revolution_events.19.b: "너희가 그렇게나 평화를 원한다면 항복할 수도 있겠지!"
 INS_revolution_events.20.t: "[HOL.GetNameDefCap](이)가 두 국가 해법에 동의했습니다!"
 INS_revolution_events.20.desc: "[INS.GetLeader](이)가 [HOL.GetLeader](와)과의 회담에서 좋은 소식을 가지고 돌아왔습니다. 두 국가 해법에 양측이 합의했으며, 우리는 즉시 새로운 국경에 맞추어 병력 이동을 시작할 것입니다. 인도네시아인 동지들을 남겨두고 떠나는 것은 누구도 기뻐할 일이 아니지만, 결국 전투를 종식시키는 것이 최선의 결정입니다."
 INS_revolution_events.20.a: "마침내 유혈 사태가 끝났군."
 INS_revolution_events.21.t: "[HOL.GetNameDefCap]의 분쟁 종결 거부"
 INS_revolution_events.21.desc: "[INS.GetLeader](와)과의 회담은 [HOL.GetLeader]의 계획대로 진행되지 않았습니다. 양측 모두 눈에 띄게 분노하고 타협을 거부하여, 회담이 일찍 중단되었습니다."
 INS_revolution_events.21.a: "또 얼마나 많은 생명이 희생되어야 하는가?"
 INS_revolution_events.22.t: "우리의 지원을 요청하는 [HOL.GetNameDefCap]"
 INS_revolution_events.22.desc: "[HOL.GetLeader](은)는 현재 동인도 제도에서 벌어지고 있는 상황을 논의하기 위해 암스테르담에서 [FRA.GetLeader](와)과의 회담을 요청했습니다. 회담 자리에서 [HOL.GetLeader](은)는 혁명가들이 네덜란드군이 따라잡을 수 없는 속도로 민병대를 무장시키기 시작했으며, [HOL.GetNameDef](이)가 식민지 지배력을 잃을 위험에 처해 있다고 설명했습니다. [HOL.GetLeader.GetHeShe]는 우리가 공식적으로 네덜란드 편으로서 참전하여, 바타비아에 다수의 사단을 파견해 동인도 재정복을 지원해 줄 것을 요청했습니다. 그 대가로, 질서가 회복되는 즉시 우리는 수마트라 북동부 지역에 대한 권리를 받게 될 것입니다."
 INS_revolution_events.22.a: "저들을 도와주려면 많은 것을 내주어야 하겠지만, 수마트라는 그 정도 가치가 있지."
 INS_revolution_events.22.b: "우리에게 너무 과한 부탁을 하는군."
 INS_revolution_events.23.t: "[FRA.GetNameDefCap]의 지원 동의!"
 INS_revolution_events.23.desc: "[FRA.GetNameDefCap](은)는 우리의 지원 요청에 동의했고, 즉시 우리를 돕기 위해 다수의 프랑스군 사단을 바타비아로 파견했습니다."
 INS_revolution_events.23.a: "상황이 우리에게 유리하게 되었다."
 INS_revolution_events.24.t: "[FRA.GetNameDefCap]의 지원 거부"
 INS_revolution_events.24.desc: "[FRA.GetNameDefCap](은)는 긴급한 상황임에도 불구하고 혁명 진압을 지원해 달라는 요청을 거부했습니다. 우리는 신속하게 재무장을 개시해야 합니다. 그렇지 않으면 곧 수적으로 열세에 놓이게 될 것입니다."
 INS_revolution_events.24.a: "좋은 소식은 아니군."
 INS_revolution_events.25.t: "인도네시아 전쟁의 종결"
 INS_revolution_events.25.desc: "[HOL.GetAdjective] 군대는 주요 민병대 기지를 파괴하고 공화국 정부를 무너뜨렸습니다. 공화주의자 엘리트들과 지휘관들이 체포되었고, 동인도 정부는 공화국 영토였던 지역에서 활동을 재개하고 있습니다. 우리가 기여한 대가로, 약속된 영토가 우리에게 주어졌습니다."
 INS_revolution_events.25.a: "훌륭하군!"
 INS_revolution_events.26.t: "인도네시아 전쟁의 종결"
 INS_revolution_events.26.desc: "[HOL.GetAdjective] 군대와 공화주의자 민병대는 양측의 예상보다 훨씬 오랫동안 전투를 벌여왔으며, [HOL.GetLeader](은)는 두 국가 해법이 명시된 평화 협정에 서명하기로 합의했습니다. 그럼에도 우리가 협정의 조건을 계속 이행했으므로, [HOL.GetLeader](은)는 약속했던 영토를 우리에게 제공할 것임을 확인했습니다."
 INS_revolution_events.26.a: "흥미로운 전개로군."
 INS_revolution_events.27.t: "인도네시아 전쟁의 종결"
 INS_revolution_events.27.desc: "[HOL.GetAdjective] 군대와 공화주의자 민병대는 양측의 예상보다 훨씬 오랫동안 전투를 벌여왔으며, [HOL.GetNameDef]의 분전과 우리 군의 개입에도 불구하고, 민병대의 압도적인 병력과 그들의 게릴라 전술로 인해 분쟁은 공화주의자 측에 크게 유리한 상황에서 교착 상태에 빠졌습니다. 그리하여 [HOL.GetLeader](은)는 오늘 [HOL.GetLeader.GetHeShe]가 공화국에 유리한 두 국가 해법이 포함된 평화 협정을 공화국과 체결했다고 발표했습니다. 동인도에 남은 것은 옛 영광의 빈 껍데기뿐입니다. [HOL.GetLeader](은)는 분쟁이 패배로 끝났기 때문에, 우리의 군사적 기여에 대한 대가로 약속했던 영토를 우리에게 줄 수 없다고 밝혔습니다."
 INS_revolution_events.27.a: "이건 말도 안 된다!"
 INS_revolution_events.28.t: "동인도 제도의 함락"
 INS_revolution_events.28.desc: "[HOL.GetNameDef](이)가 막대한 군사 비용을 지출하고 우리도 직접 분쟁에 기여했지만, 동인도의 민병대는 압도적인 수적 우세로 우리 군을 짓눌러 주요 도시를 모두 점령했고, 네덜란드 행정부를 무너뜨리고 항복을 강요했습니다."
 INS_revolution_events.28.a: "하지만 우리는 영토를 약속받았다!"
 INS_revolution_events.29.t: "동인도 제도의 함락"
 INS_revolution_events.29.desc: "우리는 최선을 다했지만, 동인도의 혁명군은 주요 도시들을 장악하고 식민 정부를 내부에서부터 무너뜨렸습니다. 우리 장군들이 포로로 잡혔고, 통신선은 차단되었습니다. 이제 우리는 패배를 받아들일 수밖에 없습니다."
 INS_revolution_events.29.a: "이건 비극이다."
 INS_revolution_events.30.t: "[INS.GetLeader]의 지역 휴전 협정 제안"
 INS_revolution_events.30.desc: "[INS.GetLeader](은)는 [FROM.GetName]에서의 국지적 휴전을 제안하며, 우리가 동의할 경우 [FROM.GetName]에서 병력을 철수하여 우리 군대가 해당 지역의 통제권을 되찾을 수 있게 하겠다고 약속했습니다. 그러나 이는 우리가 주요 군사 작전을 일시적으로 연기하는 조건으로 이루어지며, 이에 응할 경우 혁명군이 계획을 세울 시간을 주게 될 것입니다."
 INS_revolution_events.30.a: "동의하겠다."
 INS_revolution_events.30.b: "거절한다, 우리는 무력으로 [FROM.GetName] 지역을 되찾을 것이다!"
 INS_revolution_events.31.t: "[HOL.GetNameDefCap]의 [FROM.GetName] 지역 휴전 동의"
 INS_revolution_events.31.desc: "휴전 협상은 순조롭게 진행되었으며, [HOL.GetLeader](은)는 우리의 조건에 동의했습니다. 우리는 [FROM.GetName]에 있는 민병대 지휘관들에게 즉시 병력을 철수시키라고 명령했습니다."
 INS_revolution_events.31.a: "그들도 약속을 지켜 주어야 할 텐데."
 INS_revolution_events.32.t: "[HOL.GetNameDefCap]의 휴전 거부"
 INS_revolution_events.32.desc: "휴전 협상은 계획대로 진행되지 않았습니다. [HOL.GetLeader](은)는 협정 서명을 거부하고 타협점을 찾기 전에 협상을 종료해 버렸습니다."
 INS_revolution_events.32.a: "받아들일 수 없다!"
 INS_revolution_events.33.t: "[INS.GetNameDefCap]의 중재 요청"
 INS_revolution_events.33.desc: "인도네시아 공화주의자들은 네덜란드와의 합의를 위해 우리에게 공식적으로 지원을 요청했습니다. 현지에 있는 우리 고문들은 상황이 급속도로 악화되고 있으며, 네덜란드의 군사 작전이 계속될 경우 민족주의자들이 소련의 품으로 넘어갈 위험이 있다고 보고했습니다. 네덜란드는 유럽에서 소중한 동맹이지만, 우리는 동남아시아의 정치적 현실을 외면할 수 없습니다. 우리가 방관하여 인도네시아가 공산주의의 손에 넘어간다면, 그것은 우리의 잘못이 될 것입니다."
 INS_revolution_events.33.a: "중재자를 파견하라."
 INS_revolution_events.33.b: "네덜란드와의 관계를 위태롭게 할 순 없다."
 INS_revolution_events.34.t: "[FROM.GetNameDefCap]의 중재 요청 수락"
 INS_revolution_events.34.desc: "워싱턴은 우리 정부와 네덜란드 간의 중재에 동의했습니다. 미국 사절단이 이동 중이며, 공식적인 휴전이 제안될 것입니다. 이것은 엄청난 기회입니다. 세계 최강대국이 협상에 힘을 실어 주는 이상, 네덜란드는 시간을 끌거나 무력에 의존하기가 훨씬 더 어려워질 것입니다. 우리는 협상 테이블에서 단호한 입장을 유지하고 미국이 제 역할을 하게 해야 합니다."
 INS_revolution_events.34.a: "네덜란드가 이성적으로 행동해 주길 바란다."
 INS_revolution_events.35.t: "[USA.GetNameDefCap]의 중재 발표"
 INS_revolution_events.35.desc: "미국이 인도네시아 문제에 개입했습니다. 워싱턴은 중립적인 중재자 역할을 한다고 주장하지만, 그 의도는 분명합니다. 우리가 이 분쟁을 그들이 만족할 만한 방식으로 해결하지 못하면, 그들은 우리에게 막강한 영향력을 행사할 것입니다. 우리 협상단은 신중하게 결정해야 합니다. 미국의 호의는 우리가 낭비할 수 없는 소중한 자산입니다."
 INS_revolution_events.35.a: "우리는 우리 방식대로 해결할 것이다."
 INS_revolution_events.36.t: "[FROM.GetNameDefCap]의 개입 거부"
 INS_revolution_events.36.desc: "미국은 우리의 중재 요청을 거부했습니다. 워싱턴은 우리의 자결권 투쟁을 지지하기보다는 유럽 동맹국 편에 서기로 했습니다. 우리는 이제 홀로 남겨졌습니다. 이는 쓰라린 타격이지만, 애초에 외국 세력이 우리에게 자유를 줄 것이라고 기대하고 혁명을 시작한 것은 아닙니다."
 INS_revolution_events.36.a: "우리는 그들의 도움 없이 이 전쟁에서 승리할 것이다."
 INS_revolution_events.37.t: "[USA.GetNameDefCap]의 최후통첩 발표"
 INS_revolution_events.37.desc: "미국은 인내심을 잃었습니다. 워싱턴은 인도네시아에서의 모든 군사 작전을 즉시 중단하고 인도네시아의 주권을 인정하라는 최후통첩을 전달했습니다. 이는 노골적인 위협이나 다름없습니다. 미국과의 공개적인 단절은 국제 사회에서 우리의 위상을 무너뜨릴 것이며, 우리 경제 역시 그 여파를 감당할 수 없습니다. 우리 장군들은 여전히 승리할 수 있다고 주장하지만, 그 대가는 과연 무엇일까요?"
 INS_revolution_events.37.a: "우리는 따르는 수밖에 없군."
 INS_revolution_events.37.b: "인도네시아는 우리 것이다. 이건 양보할 수 없다."
 INS_revolution_events.38.t: "네덜란드의 양보"
 INS_revolution_events.38.desc: "끝났습니다. 네덜란드 정부는 미국의 최후통첩을 수용하고 우리의 주권을 인정했습니다. 350년에 걸친 식민 통치는 전장에서만 종식된 것이 아니라, 세계 최강대국이 우리 대의를 뒷받침한 협상 테이블에서 막을 내렸습니다. 이제 공화국은 진정으로 그리고 완전히, 우리의 것입니다."
 INS_revolution_events.38.a: "독립이로구나!"
 INS_revolution_events.39.t: "네덜란드의 거절"
 INS_revolution_events.39.desc: "모두의 예상을 뒤엎고 네덜란드는 미국의 최후통첩을 거부했습니다. 네덜란드의 장군들은 워싱턴이 행동에 나서기 전에 자신들이 이 전쟁에서 승리할 수 있다고 믿는 모양입니다. 하지만 그들은 틀렸습니다. 이제 미국이 공개적으로 우리의 대의에 동참하기로 결정하면서 전세는 완전히 바뀌었습니다. 얼마든지 오라고 하십시오. 우리는 이제 혼자 싸우지 않습니다."
 INS_revolution_events.39.a: "세계가 우리와 함께한다."
 INS_revolution_events.40.t: "우리의 조건을 수락한 네덜란드"
 INS_revolution_events.40.desc: "헤이그는 우리의 최후통첩을 수용했습니다. 인도네시아에 있는 네덜란드군은 철수하고 주권은 인도네시아 공화국으로 이양될 것입니다. 불행한 사건이 만족스러운 결론을 맞은 것입니다. 이제 네덜란드가 더 이상 유지할 수 없는 식민 사업을 지원하는 것보다, 안정되고 독립된 인도네시아가 이 지역에서 우리의 이익에 훨씬 더 부합합니다."
 INS_revolution_events.40.a: "합리적인 결과로군."
 INS_revolution_events.41.t: "우리를 무시한 네덜란드"
 INS_revolution_events.41.desc: "헤이그는 우리의 최후통첩을 단호히 거부했습니다. 인도네시아에 있는 네덜란드군은 미국의 요구를 공공연히 무시하며 작전을 계속하고 있습니다. 이는 엄청난 오판입니다. 네덜란드는 아시아에서 식민 전쟁을 벌이면서 동시에 유럽에서 미국의 지원에 의존할 수는 없습니다. 그들이 우리를 거부한 것입니다."
 INS_revolution_events.41.a: "어쩔 수 없지."
 INS_revolution_events.42.t: "최후의 주사위 던지기"
 INS_revolution_events.42.desc: "바타비아에 있는 우리 정보국의 보고에 따르면, 적군은 지금까지 공화파가 보여준 것과는 전혀 다른 작전을 준비 중인 것으로 보입니다. 자바를 공격하여 우리의 모든 통신 기반시설을 파괴함으로써 실질적인 승리를 보장하는 불안정화 작전을 준비하고 있는 듯합니다. 그러나 이 작전은 극도로 위험하며, 적군은 거의 모든 자원을 투입해야 합니다. 우리 장군들은 적군이 현 위치를 약 2년 정도만 유지할 수 있으며, 쉽게 물러설 수도 없을 것이라 예상하고 있습니다. 우리가 적군의 공격을 충분히 오래 막아낸다면, 우리는 그들의 정부와 혁명을 마치 푹 익은 토마토처럼 짓밟아 버릴 수 있을 것입니다."
 INS_revolution_events.42.a: "그러면 최후의 전투를 시작하지."
 INS_revolution_events.43.t: "[FROM.GetName]에 민병대 기지가 설치됨"
 INS_revolution_events.43.desc: "[FROM.GetName]에서의 노력이 성공을 거두었고, 현지 민병대 지도자들은 때가 오면 행동할 준비가 되어 있다고 확인해 주었습니다."
 INS_revolution_events.43.a: "우리는 계속 노력해야 한다."
 # Chaos Events
 INS_chaos_events.1.t: "수라바야에서의 전투"
 INS_chaos_events.1.desc: "독립 선언 이후 수라바야의 정세는 불안정해졌습니다. 오늘, 네덜란드 충성파들이 옛 야마토 호텔 옥상에 옛 식민지 시대 깃발을 게양했습니다. 이에 지역 청년들이 건물로 난입해 깃발을 내리고 빨간색과 흰색의 인도네시아 국기를 게양했습니다. 이 사건은 폭력적이고 무질서한 무력 충돌로 확대되었습니다."
 INS_chaos_events.1.a: "그래야만 할 것이다!"
 INS_chaos_events.1.b: "휴전을 명령해라, 상황이 악화되어서는 안 된다."
 INS_chaos_events.2.t: "사회주의 정당들의 합병"
 INS_chaos_events.2.desc: "아미르 샤리푸딘과 수탄 샤리르가 이끄는 인도네시아 최대 사회주의 정당 두 곳이 오늘 합병되어, 통합된 인도네시아 사회당이 창당되었음을 발표했습니다. 이는 사회당의 정치적 영향력을 크게 확대시켜 우리 행정부에 위험을 초래할 가능성이 있습니다."
 INS_chaos_events.2.a: "허용하라."
 INS_chaos_events.2.b: "정치적 수단을 쓸 시간이 없다, 계엄령을 선포하라!"
 INS_chaos_events.3.t: "수카르노 암살 계획의 실패"
 INS_chaos_events.3.desc: "오늘 한 네덜란드 군인이 수카르노의 차량에 총격을 가해 암살을 시도했습니다. 다행히 수카르노 대통령은 그 차량에 없었지만, 운전기사는 중상을 입었습니다. 이번 시도는 실패했지만, 네덜란드 군인이나 인도네시아인 반대파가 다음 암살 시도를 감행할 것은 분명합니다."
 INS_chaos_events.3.a: "질서를 회복해야만 한다!"
 INS_chaos_events.4.t: "수카르노의 암살"
 INS_chaos_events.4.desc: "오늘은 인도네시아에 비극적인 날이 되었습니다. 수카르노에게 또 한 번의 암살 시도가 있었고, 이번에는 성공했습니다. 이번 사태로 권력 승계 위기로 불거지는 것을 막아야 합니다. 질서를 신속히 회복하지 않으면 공화국은 붕괴될 것입니다."
 INS_chaos_events.4.a: "하타 부통령이 이어받을 것이다."
 INS_chaos_events.4.b: "사회당이 이어받을 것이다."
 INS_chaos_events.4.c: "공화국을 폐지하라, 탄 말라카가 우리를 승리로 이끌 것이다!"
 # Loyalist Events
 INS_loyalist_events.1.t: "[INS.GetLeader]의 헨리 빙켈만 전출 요청"
 INS_loyalist_events.1.desc: "[INS.GetLeader](이)가 전 세계에서 벌어지고 있는 분쟁과 [INS.GetNameDef](이)가 처한 위험한 상황에 대해 우려하며 우리에게 연락해 왔습니다. [INS.GetLeader](은)는 식민지의 안보를 확보하기 위해 네덜란드령 동인도군 지휘관을 역임했던 헨리 빙켈만을 [INS.GetNameDef](으)로 정식 복귀시킬 것을 제안했습니다."
 INS_loyalist_events.1.a: "바로 전출할 수 있도록 준비하겠다."
 INS_loyalist_events.1.b: "헨리 빙켈만은 본토에서 할 일이 있다."
 INS_loyalist_events.2.t: "[HOL.GetLeader]의 헨리 빙켈만 전출 동의"
 INS_loyalist_events.2.desc: "[INS.GetLeader](은)는 [HOL.GetNameDef]에서 [HOL.GetLeader](을)를 만나고 돌아왔습니다. 회담은 순조롭게 진행되었으며, [HOL.GetLeader](은)는 상황을 인지하고 빙켈만의 즉각적인 전출에 동의했습니다. 헨리 빙켈만은 [1058.GetName](으)로 이동 중이며, 그곳에서 우리의 명령을 기다릴 것입니다."
 INS_loyalist_events.2.a: "큰 도움이 될 것이다."
 INS_loyalist_events.3.t: "[HOL.GetLeader]의 헨리 빙켈만 전출 거부"
 INS_loyalist_events.3.desc: "[INS.GetLeader](은)는 [HOL.GetNameDef]에서 [HOL.GetLeader](을)를 만나고 돌아왔습니다. 안타깝게도 헨리 빙켈만은 동인도 제도로 전출되지 않을 것이며, 우리는 그의 도움 없이 스스로를 방어해야 할 것입니다."
 INS_loyalist_events.3.a: "서둘러 새로운 계획을 수립해야 한다."
 INS_henri_winkelman_tt: "헨리 빙켈만 전출이 거부되었습니다"
 # MALAYA CHAIN - Independent Malaya
 INS_loyalist_events.4.t: "[FROM.GetNameDefCap]의 통일 제안"
 INS_loyalist_events.4.desc: "[FROM.GetAdjective] 대표단이 통일 제안을 가지고 [ROOT.Capital.GetCapitalVictoryPointName]에 도착했습니다. 그들은 양국 국민이 공유하는 말레이의 유산을 강조하며, 양국 간의 국경은 이 땅의 주민들이 아닌 유럽의 식민 행정관들에 의해 설정되었다는 점을 지적합니다. 제안 내용은 양국이 정부를 해산하고 하나의 국가로 재건되는 것입니다."
 INS_loyalist_events.4.a: "제안을 받아들인다."
 INS_loyalist_events.4.b: "당연히 우리는 거부한다."
 INS_loyalist_events.5.t: "[FROM.GetNameDefCap]의 통일 수락"
 INS_loyalist_events.5.desc: "우리 외교관들이 [FROM.Capital.GetCapitalVictoryPointName]에서 기쁜 소식과 함께 돌아왔습니다. [FROM.GetAdjective] 정부가 우리의 제안을 수락했으며, 그곳의 관료들이 이미 그들의 영토를 우리 행정 체계에 통합하기 위한 준비를 시작했습니다."
 INS_loyalist_events.5.a: "함께하면 우리는 강하다!"
 INS_loyalist_events.6.t: "[FROM.GetNameDefCap]의 통일 거부"
 INS_loyalist_events.6.desc: "우리 외교관들이 [FROM.Capital.GetCapitalVictoryPointName]에서 빈손으로 돌아왔습니다. [FROM.GetAdjective] 정부는 제안을 검토할 의향조차 보이지 않았습니다. 별다른 설명도 없었고, 우리 대표단은 공손한 형식만 갖춘 대우를 받은 채 귀국했습니다."
 INS_loyalist_events.6.a: "자기들 손해지."
 # MALAYA CHAIN - Subject Malaya (Overlord receives)
 INS_loyalist_events.7.t: "[MAL.GetName]에서의 국민투표를 요구한 [FROM.GetNameDefCap]"
 INS_loyalist_events.7.desc: "[FROM.GetNameDefCap](은)는 우리에게 [MAL.GetName]에서 그들의 주와의 통합에 대한 국민투표를 허가해 줄 것을 공식적으로 요청했습니다. 그들의 대사는 국경 양쪽의 말레이인들이 스스로를 하나의 민족으로 여기고 있다고 말하며 예상되는 결과에 대해 솔직하게 말했습니다. 투표를 허가할 경우 거의 확실히 [MAL.GetName](을)를 잃게 될 것입니다."
 INS_loyalist_events.7.a: "국민들이 결정하게 하자."
 INS_loyalist_events.7.b: "허가할 수 없다."
 # MALAYA CHAIN - Subject Malaya (MAL receives after overlord agrees)
 INS_loyalist_events.8.t: "[FROM.GetNameDefCap]의 통일 국민투표 승인"
 INS_loyalist_events.8.desc: "우리의 종주국이 우리 국가에서 [FROM.FROM.GetNameDef](이)가 국민투표를 실시할 수 있도록 허가했습니다. [FROM.FROM.GetAdjective] 투표 운동원들이 대거 도착했고, 투표는 이달 안에 시작될 예정입니다. 우리 국민에게 던져진 질문은 간단합니다. 우리는 [FROM.FROM.GetNameDef]에 합류하기를 원하는가, 아니면 현재 상태를 유지하길 원하는가?"
 INS_loyalist_events.8.a: "우리는 그들과 합류할 것이다."
 INS_loyalist_events.8.b: "우리는 현 상태를 유지할 것이다."
 # MALAYA CHAIN - Overlord informed of MAL's choice
 INS_loyalist_events.9.t: "통일에 반대표를 던진 [FROM.GetNameDefCap]"
 INS_loyalist_events.9.desc: "[FROM.GetName]에서의 국민투표가 종료되었습니다. [FROM.GetAdjective] 주민들은 우리 행정 체계 안에 남아 있기로 투표했습니다. [FROM.FROM.GetAdjective] 운동원들은 떠났습니다."
 INS_loyalist_events.9.a: "예상대로군."
 INS_loyalist_events.10.t: "통일에 찬성표를 던진 [FROM.GetNameDefCap]"
 INS_loyalist_events.10.desc: "[FROM.GetName]에서 실시된 국민투표 결과, [FROM.FROM.GetNameDef](와)과의 통일에 찬성하는 표가 압도적이었습니다. 해당 지역의 행정 담당자들은 이 결과가 예상된 것이었다고 보고했습니다. 우리는 이 결과를 존중할 의무가 있습니다."
 INS_loyalist_events.10.a: "우리는 약속했다."
 # MALAYA CHAIN - INS receives result
 INS_loyalist_events.11.t: "말라야 국민투표의 성공"
 INS_loyalist_events.11.desc: "[MAL.GetName]의 주민들은 우리 국가에 합류하기로 투표했습니다. [MAL.GetAdjective]의 관료들은 권한 이양 절차를 시작하기 위해 우리 행정부와 협력하고 있습니다. 이제 말레이의 지도에서 국경선 하나가 줄어들 것입니다."
 INS_loyalist_events.11.a: "돌아온 것을 환영한다."
 INS_loyalist_events.12.t: "말라야 통일이 거부됨"
 INS_loyalist_events.12.desc: "[MAL.GetName](와)과의 통일 제안은 거부되었습니다. [MAL.GetAdjective] 정부, 또는 그 윗선에서 이를 반대하기로 결정한 것입니다. 우리는 더 적절한 시기가 오면 이 문제를 다시 논의해야 할 것입니다."
 INS_loyalist_events.12.a: "이 일은 절대로 잊지 않으리라."
 INS_loyalist_events.13.t: "싱가포르에 대한 협상을 제안한 [FROM.GetNameDefCap]"
 INS_loyalist_events.13.desc: "[FROM.GetAdjective] 정부가 우리에게 싱가포르와 관련하여 제안해 왔습니다. 그들은 싱가포르가 말레이 세계 내에서 차지하는 중요성을 강조하며 섬에 대한 주권을 요구하고 있습니다. 그 대가로 그들은 항구와 그 군사 시설에 대한 지속적인 이용 권한, 그리고 우리가 현재 갖고 있는 모든 자원 채굴권을 보장할 준비가 되어 있다고 합니다."
 INS_loyalist_events.13.a: "공정한 협정이로군."
 INS_loyalist_events.13.b: "싱가포르는 판매 대상이 아니다."
 INS_loyalist_events.14.t: "싱가포르 협상안 수용됨"
 INS_loyalist_events.14.desc: "합의가 받아들여졌습니다. 싱가포르는 우리의 지배하에 놓이게 되며, 기존 지배국은 항구에 대한 상업적 접근권 및 군사 통행권을 유지합니다. 이제 아시아에서 가장 중요한 항구 중 하나에 우리 국기가 게양됩니다."
 INS_loyalist_events.14.a: "그 해협은 이제 우리의 것이다."
 INS_loyalist_events.15.t: "싱가포르 협상안 거부됨"
 INS_loyalist_events.15.desc: "우리의 제안은 거부되었습니다. 싱가포르의 현 지배국은 어떤 조건으로도 그 섬을 양보할 의사가 없습니다. 우리는 주권 유지를 제외한 모든 것을 제시했지만, 그것으로는 충분하지 않았습니다."
 INS_loyalist_events.15.a: "어쩔 수 없지."
 INS_loyalist_events.16.t: "[FROM.GetNameDefCap]의 실론 이양 요청"
 INS_loyalist_events.16.desc: "[FROM.GetAdjective] 정부는 실론의 이양을 공식적으로 요청했습니다. 그들의 외교관들은 실론과 말레이 세계 간의 오랜 무역 및 민족적 연결을 근거로 들고 있습니다. 솔직히 말해서 이 주장은 다소 빈약하지만, [FROM.GetNameDef](은)는 이러한 요청을 진지하게 고려해야 할 만큼 강력해졌습니다."
 INS_loyalist_events.16.a: "그래, 넘겨주도록 하지."
 INS_loyalist_events.16.b: "실론은 우리의 지배하에 있어야 한다."
 INS_loyalist_events.17.t: "실론 이양"
 INS_loyalist_events.17.desc: "실론 이양이 완료되었습니다. 우리 행정부는 이미 관료들을 실론으로 파견하기 시작했으며, 이양 절차는 아무런 문제 없이 진행되었습니다. 이제 우리는 해협 양쪽 모두에 거점을 확보하게 되었습니다."
 INS_loyalist_events.17.a: "훌륭하다."
 INS_loyalist_events.18.t: "실론에 대한 요청이 거부됨"
 INS_loyalist_events.18.desc: "실론 이양 요청은 거부되었습니다. 실론의 현 지배국은 그 섬을 양보할 의사가 없으며, 우리 외교관들은 이 문제에 대한 추가 논의는 무의미할 것이라고 보고했습니다."
 INS_loyalist_events.18.a: "다음에 좋은 기회가 있겠지."
 INS_loyalist_events.19.t: "파푸아에서의 국민투표를 요구한 [FROM.GetNameDefCap]"
 INS_loyalist_events.19.desc: "[FROM.GetNameDefCap](은)는 우리가 파푸아 동부에서 국민투표를 허가할 것을 요구했습니다. 국경 너머 [FROM.GetAdjective] 쪽에는 정글을 가로지르는 새로운 도로가 있고, 정부 소속 의사들이 근무하는 진료소와 현지 언어로 가르치는 학교가 있습니다. 우리 쪽에서는, 지난 3년 동안 총독이 포트모르즈비를 두 번 방문했습니다. [FROM.GetAdjective] 대사는 더 이상 많은 말을 할 필요가 없었습니다."
 INS_loyalist_events.19.a: "투표를 허가하라."
 INS_loyalist_events.19.b: "이건 허가할 수 없다."
 INS_loyalist_events.20.t: "파푸아 국민투표 승인됨"
 INS_loyalist_events.20.desc: "호주는 국민투표 실시를 승인했고, 파푸아 동부의 모든 지역에서 동일한 결과가 나왔습니다. 섬 서부에 대한 우리의 투자는 어떤 캠페인 포스터보다도 더 큰 영향력을 발휘했습니다."
 INS_loyalist_events.20.a: "마침내 섬이 완전해졌구나."
 INS_loyalist_events.21.t: "파푸아 국민투표 거부됨"
 INS_loyalist_events.21.desc: "호주는 이를 거부했습니다. 포트모르즈비 주재 호주 총독은 이 요청이 호주의 주권에 대한 모욕이라는 성명을 냈습니다. 파푸아 주민들과는 아무런 협의도 없었습니다."
 INS_loyalist_events.21.a: "기억할 것이다."
 INS_loyalist_events.22.t: "[FROM.GetNameDefCap]의 동티모르 요구"
 INS_loyalist_events.22.desc: "[FROM.GetAdjective] 정부는 동티모르의 이양을 공식으로 요구해 왔습니다. 그들의 대사는 우리 측 주둔 병력이 200명도 채 되지 않고, 리스본이 수년간 그 지역에 거의 아무런 지원도 하지 않았다고 지적했습니다. 그러면서 우리가 도대체 무엇을 점유하고 있다고 생각하는지 물었습니다."
 INS_loyalist_events.22.a: "싸울 가치가 없다."
 INS_loyalist_events.22.b: "티모르는 우리 것이며 앞으로도 그럴 것이다."
 INS_loyalist_events.23.t: "이양된 동티모르"
 INS_loyalist_events.23.desc: "동티모르의 지배국이 주둔군을 철수하고 식민지 행정부를 정리하기 시작했습니다. 섬 전체가 곧 [INS.GetAdjective]의 지배하에 놓이게 될 것입니다."
 INS_loyalist_events.23.a: "마땅히 그래야지."
 INS_loyalist_events.24.t: "동티모르 요구 거부됨"
 INS_loyalist_events.24.desc: "딜리의 식민지 총독은 직접 서한을 보내 우리의 요구를 거부하며, 동티모르는 여전히 자국 정부의 주권 영토라고 주장했습니다. 우리 참모부는 내각이 이 문제를 더 추진하고자 할 경우에 대비한 비상 계획을 세워 두었습니다."
 INS_loyalist_events.24.a: "준비를 시작하라."
 INS_loyalist_events.25.t: "[FROM.GetNameDefCap]의 통일 제안"
 INS_loyalist_events.25.desc: "[FROM.GetAdjective] 대표단이 두 공화국의 통일 제안을 가지고 도착했습니다. 그들은 우리 두 민족이 우리를 분리하는 식민지 국경보다 훨씬 오래된 오스트로네시아 혈통을 공유하고 있으며, 이 제도를 아우르는 단일 국가가 동남아시아에서 가장 강력한 국가가 될 것이라고 주장합니다. 이 제안을 수락하는 것은 우리 정부를 해체하고 그들의 정부에 통합되는 것을 의미합니다."
 INS_loyalist_events.25.a: "수락하지."
 INS_loyalist_events.25.b: "우리는 이 공화국을 위해 너무나 많은 노력을 했다."
 INS_loyalist_events.26.t: "[FROM.GetNameDefCap]의 통일 수락"
 INS_loyalist_events.26.desc: "[FROM.GetAdjective] 정부가 우리의 제안을 수락했습니다. 그들의 정부 관료들이 이미 우리 관료들과 협력하여 통합 절차를 시작하고 있습니다. 아체에서 루손까지, 보르네오에서 민다나오까지, 우리 국가는 이제 말레이 제도 전체를 아우르게 되었습니다."
 INS_loyalist_events.26.a: "새로운 시대가 열렸다."
 INS_loyalist_events.27.t: "[FROM.GetNameDefCap]의 통일 거부"
 INS_loyalist_events.27.desc: "[FROM.GetAdjective] 정부는 제안을 거부했습니다. 그들의 독립 투쟁은 너무나 최근의 일이었고, 너무나 큰 희생을 치렀기에 다른 국가에 주권을 넘겨줄 수 없다는 것입니다. 이 제안은 보류되었습니다."
 INS_loyalist_events.27.a: "유감이군."
 INS_loyalist_events.28.t: "[PHI.GetName]에서의 국민투표를 요청한 [FROM.GetNameDefCap]"
 INS_loyalist_events.28.desc: "[FROM.GetNameDefCap](은)는 [PHI.GetName]에서 통일 문제에 대한 국민투표를 허가해 줄 것을 공식적으로 요청했습니다. 그들의 외교관들은 두 민족 모두 오스트로네시아 혈통을 공유하고 있으며, 두 민족을 분리하는 식민지 국경은 인위적인 것이라는 점을 강조합니다. 만약 투표가 진행된다면, 결과는 [FROM.GetNameDef]에 유리하게 나올 가능성이 높습니다."
 INS_loyalist_events.28.a: "국민의 뜻을 들어봐야겠지."
 INS_loyalist_events.28.b: "논할 가치도 없다."
 INS_loyalist_events.29.t: "통일 국민투표 승인됨"
 INS_loyalist_events.29.desc: "[FROM.FROM.GetNameDefCap](은)는 공통된 오스트로네시아 유산을 근거로 우리와 그들의 통일을 제안했습니다. 우리의 종주국은 그들에게 이 문제에 대한 국민투표를 실시할 수 있도록 허가했고, 이미 [FROM.FROM.GetAdjective]의 운동원들이 도착하고 있습니다. 투표 결과에 따라 우리 공화국이 [FROM.FROM.GetNameDef]에 합류할지, 아니면 현재의 체제를 유지할지가 결정될 것입니다."
 INS_loyalist_events.29.a: "흥미로운 제안이군."
 INS_loyalist_events.29.b: "당연히 안 된다."
 INS_loyalist_events.30.t: "통일에 반대표를 던진 [FROM.GetNameDefCap]"
 INS_loyalist_events.30.desc: "개표가 끝났고, [FROM.FROM.GetAdjective] 운동원들은 짐을 싸고 있습니다. [FROM.GetAdjective] 국민들은 현상 유지를 선택했습니다. 독립은 여전히 [FROM.Capital.GetCapitalVictoryPointName]에서 중요한 의미를 지니는 것 같습니다."
 INS_loyalist_events.30.a: "이제 끝이 났군."
 INS_loyalist_events.31.t: "통일에 찬성표를 던진 [FROM.GetNameDefCap]"
 INS_loyalist_events.31.desc: "개표가 완료되었습니다. [FROM.GetAdjective] 국민들은 우리 대신 [FROM.FROM.GetNameDef](을)를 선택했고, 그 차이는 상당했습니다. 우리 행정부 직원들은 이미 인수인계를 시작하라는 지시를 받고 있습니다."
 INS_loyalist_events.31.a: "국민이 뜻을 내비쳤군."
 INS_loyalist_events.32.t: "통일에 찬성표를 던진 [PHI.GetNameDefCap]"
 INS_loyalist_events.32.desc: "[PHI.GetAdjective] 국민투표 결과는 우리 측에 유리하게 나왔습니다. 상대국 정부는 결과를 수용하고 권한 이양을 위해 우리 외교부에 연락을 시작했습니다."
 INS_loyalist_events.32.a: "마침내 하나가 됐구나."
 INS_loyalist_events.33.t: "[PHI.GetNameDefCap]의 통일 거부"
 INS_loyalist_events.33.desc: "[PHI.GetAdjective] 정부는 우리의 통일 제안을 거부했습니다. 그들의 의회는 재심의조차 없이 이를 부결시켰습니다. 우리는 그들에게 동남아시아에서 가장 위대한 국가의 일원이 될 자리를 제안했지만, 그들은 이를 외면했습니다."
 INS_loyalist_events.33.a: "약간의 차질일 뿐이다."
 INS_communist_events.6.t: "[FROM.GetAdjective] 요원들의 [ROOT.GetName] 내 활동"
 INS_communist_events.6.desc: "우리 정보국이 오랫동안 의심해 왔던 바가 사실임을 확인했습니다. [FROM.GetNameDefCap](은)는 우리 국경 내에서 지속적인 전복 공작을 벌여 왔으며, 급진 조직에 자금을 지원하고, 선동적인 팸플릿을 배포하고, 노동자들의 파업을 조직해 왔습니다. 그들의 요원들은 노동조합과 농촌 협동조합에 침투하여 이제는 공개적으로 우리 정부의 전복을 요구하고 있습니다. 상황이 매우 위태로운 지경에 이르렀으므로, 통제할 수 없는 상황이 되기 전에 단호한 조치를 취해야 합니다."
 INS_communist_events.6.a: "이건 도저히 용인할 수 없다!"
 INS_communist_events.7.t: "공산주의자들의 [FROM.GetName] 내 전복 시도"
 INS_communist_events.7.desc: "[FROM.FROM.GetName]에서 우려스러운 보고가 들어왔습니다. [FROM.GetNameDef]에서 온 요원들이 현지 주민들 사이에서 혁명적 정서를 조장하고 있으며, 우리 행정부에 대한 불만을 악용하여 공산주의자의 정권 장악을 위한 지지를 구축하고 있습니다. 이를 방치한다면, [FROM.FROM.GetNameDef](은)는 급진주의자들의 손에 완전히 넘어갈 수 있으며, 이러한 부패는 우리의 다른 식민지로까지 확산될 가능성이 있습니다."
 INS_communist_events.7.a: "더 확산되기 전에 근절해야 한다!"
 INS_communist_events.8.t: "[ROOT.GetName] 내의 [FROM.GetAdjective] 선전 활동"
 INS_communist_events.8.desc: "최근 우리 공장, 시장, 대학 곳곳에 [FROM.GetAdjective]에서 온 팸플릿과 전단지가 점점 더 자주 발견되고 있습니다. 이 팸플릿과 전단지는 계급 투쟁을 설파하고 혁명을 통한 해방을 약속하고 있으며, 경찰 보고에 따르면 불만을 품은 사람들 사이에서 큰 호응을 얻고 있습니다. 그 내용은 조잡하지만 효과적이며, 그 확산세는 꺾일 기미를 보이지 않고 있습니다."
 INS_communist_events.8.a: "이 오물을 퍼뜨리는 놈들을 찾아내라!"
 ## Call for Revolution - Main Event (sent to target) ##
 INS_communist_events.1.t: "[ROOT.GetName]에서의 혁명"
 INS_communist_events.1.desc: "상황은 이제 회복 불가능할 정도로 악화되었습니다. 수개월 동안 이어진 [FROM.GetAdjective]의 선동은 결국 효과를 발휘했고, [ROOT.GetName]의 공산주의 운동은 더 이상 일반적인 방법으로는 진압할 수 없습니다. 총파업으로 도시들이 마비되었고, 무장 파르티잔들은 여러 지역을 장악했으며, [FROM.GetAdjective] 정부는 혁명 세력을 전력으로 지원하고 있습니다. 우리 안전군은 병력이 부족하며, 그들의 충성심 또한 더 이상 확실하지 않습니다. 더 이상의 유혈 사태가 발생하기 전에, 우리는 국가의 생존을 위해 싸울 것인지 아니면 불가피한 결과를 받아들일 것인지 지금 결정해야 합니다."
 INS_communist_events.1.a: "군대를 준비하라. 조용히 당하진 않을 것이다."
 INS_communist_events.1.b: "더 저항하면 우리 국민의 희생만 커질 것이다."
 INS_communist_events.1.c: "협상의 자리를 제안한다면 이 상황을 통제할 수 있을지도 모른다."
 ## Civil War Chosen - sent to Indonesia ##
 INS_communist_events.2.t: "전투를 선택한 [FROM.GetNameDefCap]"
 INS_communist_events.2.desc: "[FROM.GetName] 정부는 굴복을 거부하고 무력으로 혁명 운동을 진압하라는 명령을 내렸습니다. 그곳의 우리 동지들은 이미 자리를 잡고 주요 요새를 점령 중입니다. 이 투쟁은 짧지 않겠지만, [FROM.GetName]의 인민들은 이미 선택을 내렸고, 우리는 그들이 홀로 싸우게 두지 않을 것입니다."
 INS_communist_events.2.a: "혁명의 행진은 계속된다."
 ## Surrender - sent to Indonesia ##
 INS_communist_events.3.t: "[FROM.GetNameDefCap]의 함락"
 INS_communist_events.3.desc: "[FROM.GetName]의 옛 정부는 항복했습니다. 혁명 운동의 전체 규모와 그 배후에 [ROOT.GetNameDef](이)가 있다는 사실을 확실히 알게 된 그들은 항복 외에는 다른 길이 없다고 판단했습니다. 권력은 지역 공산당으로 이양되었고, 새 정부는 이미 우리에게 지침을 요청하기 시작했습니다. 또 한 국가가 낡은 질서의 손아귀에서 해방되었습니다."
 INS_communist_events.3.a: "전 세계 노동자들의 위대한 승리다."
 ## Civil War in Subject - sent to overlord ##
 INS_communist_events.4.t: "내전이 발생한 [FROM.GetName]"
 INS_communist_events.4.desc: "[FROM.FROM.GetNameDef]의 지원을 받아 무장과 조직력을 갖춘 공산주의 혁명가들이 [FROM.GetName]에서 공개적인 반란을 일으켰습니다. 식민지 행정부는 영토의 상당 부분에 대해 통제력을 잃었고, 총독은 현지 주둔군이 증원 없이는 질서를 회복할 수 없다고 보고했습니다."
 INS_communist_events.4.a: "병력을 보내라. [FROM.GetName](은)는 우리 것이다!"
 ## Subject Surrendered - sent to overlord ##
 INS_communist_events.5.t: "공산주의자들에게 빼앗긴 [FROM.GetName]"
 INS_communist_events.5.desc: "[FROM.GetName]의 행정부는 아무런 저항도 없이 공산주의 반군에게 항복했습니다. 총독과 그의 참모진은 체포되었고, 우리 국기는 내려졌으며, 그 자리에 혁명 정부가 선포되었습니다. 이 모든 것은 [FROM.FROM.GetNameDef](와)과 그 요원들이 꾸민 일이며, 이들은 수개월 동안 우리의 권위를 잠식해 왔습니다. 이는 명백한 강탈이며, 우리는 이에 대한 책임을 물을 것입니다."
 INS_communist_events.5.a: "격노할 일이군!"
 # Cooperate with Revolutionaries (sent to target)
 INS_communist_events.9.t: "[FROM.GetAdjective] 장교들과 반체제 인사들의 회담이 목격됨"
 INS_communist_events.9.desc: "전국 곳곳에서 악명 높은 선동가 및 무장 지도자들과 어울리는 [FROM.GetAdjective] 공작원들이 목격되었습니다. 한때 길거리에서 전단지를 나눠주던 학생 운동가들은 이제 [FROM.GetAdjective]의 외교 문서를 들고 있는 남성들과 밀실 회의를 열고 있습니다. 금지된 출판물들이 경찰이 압수하는 속도보다 더 빠르게 인쇄되고 있으며, 오후면 사그라들던 시위가 이제는 해당 구역 전체를 며칠 동안 마비시키고 있습니다. 이 공산주의자들은 매일 더 큰 규모의 집단을 조직하는 방법을 배우고 있습니다. 신속하게 행동하지 않으면 머지않아 이들을 통제할 수 없게 될 것입니다."
 INS_communist_events.9.a: "당장 이 외국 요원들을 발본색원하라!"
 # Spread Anti-Colonialist Sentiment (sent to subject target)
 INS_communist_events.10.t: "영향력을 얻고 있는 [FROM.GetAdjective]의 선전"
 INS_communist_events.10.desc: "병영과 공무원들 사이에서 [FROM.GetAdjective]의 전단지가 유포되고 있으며, 압수 조치도 이 흐름을 막는 데 거의 효과가 없었습니다. 전단지에는 속박에서 벗어난 국가들, 식민지 총독을 몰아내고 자체적인 정부를 건설한 이들에 대한 이야기가 담겨 있습니다. 이 내용은 진실처럼 보이기에 억누르는 일이 쉽지 않습니다. 심지어 충성스러운 관료들조차 조용히 우리의 현 체제가 우리 국민을 위한 것인지, 아니면 단지 지배자들을 위한 것인지 의문을 품기 시작했습니다."
 INS_communist_events.10.a: "우리는 신중하게 행동해야 한다."
