 HOL_taog_guarantee_colonial_loyalty: "식민지의 충성 보장"
 HOL_taog_guarantee_colonial_loyalty_desc: "동인도 제도에서 민족주의가 고조되고 있으며, 또 다른 혁명이 임박했음이 분명합니다. 1927년에 우리가 직면했던 혁명은 쉽게 진압되었지만, 우리 소식통에 따르면 이번에는 훨씬 더 철저하게 준비된 혁명가 집단과 맞서야 할지도 모릅니다. 수타르조의 평화적인 민족주의 운동에 어느 정도 양보를 한다면, 시민들의 관심을 혁명에서 수타르조에게로 돌릴 수 있지 않을까요?"
 HOL_taog_guarantee_colonial_loyalty_tt: "§W[INS.GetNameDef]에 혁명이 발생하지 않도록 보장합니다.§!\n[INS.GetNameDefCap](은)는 평화적으로 독립을 선언하려 할 것입니다. §Y$INSHOL_industrialized_colony$§! 중점을 완료하여 이를 막을 수 있으며, 완료하기 위해서는 대량의 투자가 필요할 것입니다."
