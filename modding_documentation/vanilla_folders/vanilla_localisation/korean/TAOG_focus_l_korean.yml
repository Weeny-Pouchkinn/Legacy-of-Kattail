 idea_SIA_yielded_the_air_war: "공중전 포기"
 idea_SIA_yielded_the_air_war_desc: "하늘에 대한 통제를 양보하고, 직접적인 공중 우세 다툼보다는 대공 방어에 자원을 재분배합니다."
