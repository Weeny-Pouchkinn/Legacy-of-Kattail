l_korean:
 INS_nationalize_companies_tt: "모든 군수산업체 및 산업 업체가 국유화되어 새로운 이름이 붙을 것입니다."
 available_focus_tt: "§G이용 가능한§! 중점:\n"
 INS_is_union_tt: "네덜란드-인도네시아 연방을 형성함"
 INS_is_union_tt_NOT: "네덜란드-인도네시아 연방을 형성하지 않음"
 INS_denounce_soetardjo: "수타르조 규탄"
 INS_denounce_soetardjo_tt: "우리는 지하 혁명을 계획하고, 정부에 침투하며 제도 전역에 게릴라 조직을 설립할 것입니다. 충분히 준비되면, 우리는 네덜란드에 맞서 게릴라 독립 전쟁을 시작할 것입니다."
 INS_soetardjo_petition_debate_done_tt: "수타르조의 자치권 청원에 대한 인민참사회의 논의가 완료되었습니다"
 INS_tkr_tt: "§Y인민안전군§! 변동치:"
 INS_commander_sudirman_tt: "§Y수디르만§!([INS.GetFlag])이 §Y원수§!로 진급합니다"
 INS_the_declaration_of_independence: "독립 선언"
 INS_the_declaration_of_independence_desc: "더 이상 기다릴 수 없습니다. 기회를 놓치지 말고, 즉시 행동에 나서야 합니다! 우리 민병대를 파견하여 네덜란드 당국이 대응할 틈도 없이 신속하게 항구, 도시, 산업 중심지를 장악해야 합니다. 그 후에 인도네시아 공화국을 선포하고 독립을 선언할 것입니다."
 INS_the_declaration_of_independence_tt: "우리는 §Y독립§!을 선언할 것입니다. 우리가 §Y민병대 기지§! 또는 §Y본부§!를 설치한 모든 주는 우리의 통제하에 놓이게 되며, 나머지 주는 [HOL.GetNameDef]\n\n[HOL.GetNameDefCap]령으로 남을 것입니다.(은)는 우리의 주권을 인정하지 않을 것이며, 낮은 강도의 분쟁이 시작될 것입니다. 이는 §R전쟁§!으로 확대될 수도 있습니다.\n\n주를 장악하기 위한 육상 습격을 잠금 해제합니다."
 INSHOL_the_declaration_of_independence: "국민혁명"
 INS_laskar_rakjat: "인민 민병대"
 INS_laskar_rakjat_desc: "혁명군은 인도네시아 전역의 크고 작은 다양한 민병대들로 구성되어 있습니다. 승리하기 위해서는 민병대를 잘 조직해야 합니다. 하지만 너무 서두르면 안 됩니다. 우리 정적들과 연계된 민병대에 힘을 실어주면 재앙을 초래할 수 있기 때문입니다."
 INS_militia_tt: "새로운 §Y자유의 투사§! 민병 사단 편제 생성 및 그들을 관리하는 결정 잠금 해제."
 INS_militia_warning_tt: "민병대는 §Y준자치적§!인 자유의 투사 단체입니다. 그들은 우리를 위해 싸울 것이지만, 그들의 도움은 공짜가 아닙니다. 그들은 자신들의 노력에 대한 보상을 기대할 것이며, §R요구가 충족되지 않으면 안정도가 크게 하락할 것입니다!§!"
 INS_usa_tanks_opinion_mod: "우리 전차를 구매함"
 INS_republic_add_generals_tt: "(§Y$INS_sudirman$§!([INS.GetFlag]), §Y$INS_soengkono$§!([INS.GetFlag]), §Y$INS_supriyadi$§!([INS.GetFlag]), §Y$INS_djatikoesoemo$§!([INS.GetFlag]), §Y$INS_maludin_simbolan$§!([INS.GetFlag]))이 장군이 됩니다."
 INS_big_militia_presence_tt: "독립 선언 시에 우리 민병대가 지배할 것입니다."
 INS_prepare_raiding_bases: "습격 기지 준비"
 INS_prepare_raiding_bases_desc: "우리는 첩보망을 활용하여 비밀리에 제도 전역에 벙커를 건설하고, 혁명이 시작되는 즉시 타격할 준비를 갖출 것입니다."
 # <Joint Tree - Central Milestones>
 INSHOL_dutch_east_indies: "네덜란드령 동인도"
 INSHOL_dutch_east_indies_desc: "이 식민지는 약 500년 전에 설립되었으며, 그 이후로 여러 차례 형태를 바꾸었습니다. 세계는 빠르게 변화하고 있으며, 지금 우리의 행동은 먼 미래의 네덜란드-인도네시아 관계를 결정짓게 될 것입니다."
 INSHOL_the_war_in_europe: "유럽에서의 전쟁"
 INSHOL_the_war_in_europe_desc: "유럽의 분쟁이 급속도로 격화되고 있으며, 네덜란드는 현재 전쟁 중입니다. 우리는 더 이상 그들의 보호에 의존할 수 없으며, 알아서 우리 땅을 지켜내야 합니다. 그렇지 않으면 외세의 습격을 받을 위험이 있습니다."
 # <Joint Tree - Military Equipment Contracts>
 INSHOL_military_equipment_contracts: "군사 장비 계약"
 INSHOL_military_equipment_contracts_desc: "동인도 제도는 수천만 명의 주민이 거주하는 광활한 제도입니다. 우리는 스스로를 방어할 수 있는 산업 역량을 갖고 있지는 않지만, 전 세계와 무역을 할 수 있는 충분한 자원이 있습니다. 전 세계 민주주의 국가들과 계약을 체결함으로써 우리 문제를 해결할 수 있습니다."
 INSHOL_hawk_75a7: "호크 75A-7"
 INSHOL_hawk_75a7_desc: "미국의 호크 75A-7 전투기는 저렴하면서도 강력해, 동인도 제도에 이상적인 기체입니다. 우리 공군에 절실히 필요한 전력 증강을 이루기 위하여 제조사와 계약을 체결할 수 있을 것입니다."
 INSHOL_purchase_american_tanks: "미국 전차 구매"
 INSHOL_purchase_american_tanks_desc: "동인도 제도는 전차 제조에 필요한 산업 역량이 부족하지만, 동인도 제도의 고무 산업으로 자금을 충당하여 미국에서 직접 전차를 구매할 수 있습니다."
 INSHOL_purchase_british_artillery: "영국 야포 구매"
 INSHOL_purchase_british_artillery_desc: "우리는 야포 제조를 영국에 위탁하고, 다른 장비에 우선순위를 둘 수 있습니다."
 INSHOL_produce_own_goods: "국산품 생산"
 INSHOL_produce_own_goods_desc: "우리는 수익성 높은 무역 계약을 얼마든지 확보할 수 있지만, 우리 자신의 생산 라인과 군수 기업들을 잊어서는 안 됩니다. 해외 수입에 대한 의존도를 줄이기 위해 이러한 기업들에 보조금을 지급해야 합니다."
 # <Joint Tree - East Indies Investments>
 INSHOL_east_indies_investments: "동인도 투자"
 INSHOL_east_indies_investments_desc: "훌륭한 종주국은 식민지 발전에 투자하는 법입니다. 동인도 제도의 경제 발전에 투자하는 것은 우리에게도 가장 이로운 일이며, 식민지 주민들에게도 도움이 됩니다."
 INSHOL_east_indies_student_exchange: "동인도 교환 학생 프로그램"
 INSHOL_east_indies_student_exchange_desc: "인도네시아인들이 네덜란드 대학에서 공부하기 위해 네덜란드로 이동할 수 있는 시스템을 구축하는 것은 네덜란드와 인도네시아 양국의 경제에 상당한 이득이 될 수 있습니다."
 INSHOL_east_indies_fokker_division: "포커 동인도 지사 설립"
 INSHOL_east_indies_fokker_division_desc: "포커는 동인도 공군으로부터 면허를 취득했으므로, 동인도 공군을 우선시하는 전담 자회사를 설립하는 것을 고려해 볼 만합니다."
 INSHOL_expand_shell: "쉘의 기반시설 확장"
 INSHOL_expand_shell_desc: "쉘이 우리 경제에서 차지하는 비중이 점점 커지고 있습니다. 쉘의 수출 역량에 맞추기 위해 동인도 제도의 석유 기반시설을 확장해야 한다는 것은 분명합니다."
 INSHOL_increase_funding_for_tix: "T.IX 비행기 프로젝트에 자금 증액"
 INSHOL_increase_funding_for_tix_desc: "포커의 공학자들은 동인도 공군이 사용하는 구형 모델을 대체할 새로운 쌍발 폭격기를 개발하고 있습니다. 이 프로젝트는 예산이 매우 적어 완료되려면 상당한 시간이 걸릴 것으로 예상됩니다. 우리가 자금을 증액하면 진행 속도를 크게 높일 수 있습니다."
 INSHOL_reduce_land_ownership_taxes: "토지 소유세 감면"
 INSHOL_reduce_land_ownership_taxes_desc: "토지를 소유한 인도네시아 국민에게 부과되는 세금을 줄여 농장과 사업 발전을 장려해야 합니다."
 INSHOL_coffee_plantations: "커피 대농장"
 INSHOL_coffee_plantations_desc: "우리는 동부 섬들에 국유지를 더 많이 확보하는 데 집중해야 합니다. 이 토지에 커피 대농장을 조성할 수 있습니다."
 INSHOL_overallwagen: "급습장갑차"
 INSHOL_overallwagen_desc: "동인도 육군에게 전차가 꼭 필요한 것은 아닙니다. 우리는 전차를 생산할 산업 역량이 부족하고, 지형이 험준하므로 전차는 제한적인 상황에서만 유용합니다. 그 공백을 메우기 위해 인도네시아용 장갑차의 개발에 투자할 수도 있습니다."
 INSHOL_indonesian_cheap_labor: "인도네시아 저임금 노동"
 INSHOL_indonesian_cheap_labor_desc: "$CONGO_cheap_labor_desc$" #LL: stealing this to save time, hope you don't mind!
 INSHOL_eastern_development_fund: "동부 섬들의 개발 자금"
 INSHOL_eastern_development_fund_desc: "우리는 자바와 수마트라에만 지나치게 투자를 집중하고, 대부분의 식민지 지역을 방치하고 있습니다. 우리는 미래의 산업화를 위해 동부 섬들의 기반시설 개발에 전념해야 합니다."
 INSHOL_increase_rubber_taxes: "고무 세금 증가"
 INSHOL_increase_rubber_taxes_desc: "동인도 제도의 많은 고무 회사들이 식민지의 자원을 이용하여 상당한 부를 쌓고 있습니다. 이러한 사업에 높은 세금을 부과하는 것은 당연한 일입니다."
 INSHOL_reform_knil: "왕립 네덜란드령 동인도군 개혁"
 INSHOL_reform_knil_desc: "동인도 제도가 제도 전체 정복을 완료한 이후, 왕립 네덜란드령 동인도군은 움직이지 않고 있으며 심각한 자금 부족에 시달리고 있습니다. 전 세계적으로 긴장이 고조되고 있으므로 우리는 신속히 동인도 제도의 재무장에 착수해야 합니다."
 INSHOL_fund_ml_knil: "네덜란드령 동인도군 항공대에 자금 제공"
 INSHOL_fund_ml_knil_desc: "세계의 군대와 경쟁하려면 우리도 제대로 된 공군력을 갖추어야 합니다. 그렇지 않으면 상당한 불리함을 안게 될 것입니다."
 INSHOL_bandung_aircraft_facility_tt: "§Y서자바:§!\n    완료된 선행 조건 중점마다 건설 슬롯 §G1§!개 및 §Y군수공장§! §G1§!개 추가"
 INSHOL_rangers: "레인저"
 INSHOL_rangers_desc: "동인도 제도는 다양한 환경을 지닌 광활한 제도입니다. 우리는 이러한 험난한 환경에서의 전투에 적응할 수 있도록 레인저들을 양성하여 동인도 제도를 방어할 준비를 갖추어야 합니다."
 INSHOL_mountaineers: "산악병"
 INSHOL_mountaineers_desc: "우리는 우리 제도의 험준한 지형에서 싸울 준비가 된 산악병들을 양성해야 합니다."
 INSHOL_elevate_elite_infantry: "특수부대 보급창"
 INSHOL_elevate_elite_infantry_desc: "우리는 대전쟁 때의 전략에 영원히 의존할 수는 없습니다. 새로운 기술에 적응하며 뒤처지지 않도록 해야 합니다. 모든 종류의 환경에 대비할 수 있는 정예 보병 사단을 여러 개 창설해야 합니다."
 INSHOL_modernize_knil: "왕립 네덜란드령 동인도군 현대화"
 INSHOL_modernize_knil_desc: "우리는 동인도 육군을 위한 새로운 전략과 교리를 연구하여, 적에 대한 우위를 유지할 수 있도록 할 것입니다."
 INSHOL_transfer_of_henri_winkelman: "헨리 빙켈만의 전출"
 INSHOL_transfer_of_henri_winkelman_desc: "헨리 빙켈만은 이전에 왕립 네덜란드령 동인도군에서 오랫동안 복무했습니다. 그가 다시 한번 동인도 제도에 필요하다는 것이 분명하므로, 그의 동인도 제도 전출을 공식적으로 추진해야 합니다."
 INSHOL_eastern_conscription: "보조군 모집"
 INSHOL_eastern_conscription_desc: "자바와 마두라에는 지역 제후들이 통제하는 여러 현지인 보조군이 있습니다. 이 절박한 시기에, 우리는 해당 사단들이 우리의 지휘를 받도록 지역 제후들과 협상을 진행할 수 있습니다."
 INSHOL_establish_vk_knil: "왕립 네덜란드령 동인도군 여성 군단 창설"
 INSHOL_establish_vk_knil_desc: "우리는 왕립 네덜란드령 동인도군을 위한 여성 의용 군단을 창설할 것입니다. 그들의 기여는 우리의 군수 및 통신 개선에 중요한 역할을 할 것입니다."
 INSHOL_emergency_dockyard_construction: "긴급 조선소 건설"
 INSHOL_emergency_dockyard_construction_desc: "적이 상륙할 가능성을 과소평가해서는 안 됩니다. 우리는 해상 방어를 최우선 순위로 두어야 합니다."
 INSHOL_emergency_powers_gov_general: "총독에게 긴급 권한을 부여"
 INSHOL_emergency_powers_gov_general_desc: "현재 진행 중인 전쟁에서는 지체 없이 어려운 결정을 내려야 합니다. 하지만 동인도에서의 모든 결정이 네덜란드의 승인을 거쳐야 하는 상황에서는 불가능합니다. 따라서 [INS.GetLeader]에게 긴급 권한을 부여하여 지체 없이 행동할 수 있도록 해야 합니다."
 INSHOL_emergency_naval_purchases: "긴급 함선 구매"
 INSHOL_emergency_naval_purchases_desc: "우리 해안은 안전하지 않으며 방어도 충분하지 않습니다. 시간이 촉박합니다, 해군력을 더 강화하지 못한다면 우리는 틀림없이 파멸하고 말 것입니다. 우리는 빚을 내어 민간 기업으로부터 함선을 구입하여 해군 구축함으로 개장할 것입니다."
 INSHOL_east_indies_navy: "동인도 해군"
 INSHOL_east_indies_navy_desc: "[INS.GetNameDefCap](은)는 공식적인 해군이 없어 네덜란드가 식민지 방위를 맡고 있습니다. 유럽과 아시아에서 긴장이 고조되고 있으므로, 이러한 방식은 더 이상 통하지 않을 것입니다. 우리는 [INS.GetAdjective] 전용 해군 창설을 위한 첫걸음을 내디뎌야 합니다."
 INSHOL_marines: "해병"
 INSHOL_marines_desc: "우리는 신생 해군 아래에 독자적인 동인도 제도 해병대를 창설하고, 훈련 중인 해병들을 네덜란드 함선으로 보내 경험을 쌓게 해야 합니다."
 INSHOL_domestic_ship_production: "국내 함선 생산"
 INSHOL_domestic_ship_production_desc: "우리 해군이 주변국에 대항할 수 있으려면 국내 함선 생산을 확대하기 시작해야 합니다."
 INSHOL_destroyers: "구축함"
 INSHOL_destroyers_desc: "우리의 중전투함들은 호위함의 엄호를 받지 않는다면 군도의 좁은 바다에서 제대로 운용할 수 없습니다. 현대식 구축함을 건조한다면, [ROOT.GetAdjective] 해군이 항로를 지키고 해협 곳곳의 어뢰정을 몰아낼 수 있습니다."
 INSHOL_cruisers: "순양함"
 INSHOL_cruisers_desc: "전함이 없는 함대는 순양함에 의존할 수밖에 없습니다. 강력한 순양함 전대를 건조한다면, [ROOT.GetAdjective] 해군은 섬과 섬 사이의 장거리 해역을 순찰하고 우리 해역에 침입한 습격 함정을 상대할 핵심 전력을 확보할 수 있습니다."
 INSHOL_submarines: "잠수함"
 INSHOL_submarines_desc: "동인도의 해협들은 매복에 안성맞춤이며, 잠수함 한 척의 비용은 그 잠수함이 바닷속으로 보내는 군함보다 훨씬 저렴합니다. 강력한 잠수함 전력을 갖추면 [ROOT.GetAdjective] 해군은 모습을 드러내지 않고도 해상로를 장악하고 적 수송선을 타격할 수 있습니다."
 INSHOL_outsourced_navy: "생산을 기업에 외주"
 INSHOL_outsourced_navy_desc: "이미 지출이 과중한 상황에서 계속 해군을 위해 식민지 예산을 돌릴 수는 없습니다. 기업에 대금을 지급해 생산을 대신 맡길 수 있습니다."
 INSHOL_divert_civilian_to_navy: "민간 및 육군 지출을 해군으로 전용"
 INSHOL_divert_civilian_to_navy_desc: "지금과 같은 국제 정세에서는 상륙 위험이 그 어느 때보다 높습니다. 검소하게 굴 때가 아닙니다. 정부 전 부문의 예산을 해군에 돌려야 합니다."
 INS_netherlands_can_remove_autonomy_tt_50: "\n[HOL.GetFlag]§Y[HOL.GetNameDefCap]§! 측이 먼저 이 중점 완료 시:\n    ([INS.GetFlag]§Y[INS.GetName]§!): §Y£autonomy_texticon -50.00§! 추가"
