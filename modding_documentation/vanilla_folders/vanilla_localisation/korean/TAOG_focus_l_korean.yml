 ###   SIAM   ###
 ################
 SIA_the_khana_ratsadon: "인민당"
 SIA_the_khana_ratsadon_desc: "인민당은 절대주의를 종식시키고 입헌정부의 길을 열었습니다. 그 유산은 논쟁과 배신, 유혈로 얼룩졌지만, 현대적인 [SIA.GetName](을)를 건설할 수 있는 기반으로 남아 있습니다."
 SIA_the_khana_ratsadon_tt: "\n§Y인민당§!이 활동합니다.\n\n§Y인민당§!은 [ROOT.GetName]의 선두 정당이며, 이 정당은 §Y군부 세력§!과 §Y민간 세력§!으로 나뉘어 있습니다.\n\n§Y민간 세력§! 전반적으로 친민주주의 정책을 선호하며 민간 산업에 중점을 두는 반면, §Y군부 세력§!은 전반적으로 친파시즘 정책과 산업의 군사화를 선호합니다.\n\n우리의 선택은 그들이 우리를 더 좋아하거나 싫어하게 만들며, 그에 따라 다양한 혜택이나 불이익을 받게 됩니다.\n만약 그들이 반역 준비 중 상태가 되면 쿠데타를 시도할 수도 있습니다.\n\n그들의 지지도는 §Y반역 준비 중§!, §Y반대함§!, §Y중립§!, §Y약간의 지지§!, §Y전적인 지지§!로 표시됩니다."
 SIA_shuffle_pridi_to_the_minister_of_interior: "민간 세력의 입지 강화"
 SIA_shuffle_pridi_to_the_minister_of_interior_desc: "프리디를 외무장관이 아니라 내무장관 자리에 앉힘으로써, 그는 정부 자원 할당을 더욱 효과적으로 통제하고 군부의 영향력 확대에 제동을 걸 수 있을 것입니다."
 SIA_shuffle_pridi_to_the_minister_of_interior_tt: "§Y$anti_fascist_raids$§!(은)는 이제 §Y민간 세력§!의 지지도를 높이며, §Y군부 세력§!의 지지도를 낮춥니다"
 SIA_civil_nationalism: "시민 민족주의"
 SIA_civil_nationalism_desc: "지위와 관계없이 모든 타이 국민은 특정 정부나 특정 인물에게 충성해서는 안 되며, 지금 권력의 자리에 앉은 이가 누구든 간에 자유와 평등의 가치를 수호해야 한다는 사실을 알아야 합니다."
 SIA_the_true_heirs_of_1932: "1932년의 진정한 후예"
 SIA_the_true_heirs_of_1932_desc: "군부는 1932년 혁명을 자신들만의 업적으로 치부하며, 그것이 인민의 승리였다는 사실을 지워버리려 합니다. 인민에게 그 사실을 다시금 일깨워주기만 하면, 우리는 힘을 모을 수 있을 것입니다."
 SIA_thammasat_university: "탐마삿 대학"
 SIA_thammasat_university_desc: "새로 설립된 탐마삿 대학은 타이 혁신의 새 시대를 위한 길을 닦기 위해 더욱 확충될 수 있으며, 그렇게 되어야 합니다."
 SIA_defenders_of_constitutional_liberty: "헌법적 자유의 수호자들"
 SIA_defenders_of_constitutional_liberty_desc: "교사, 은행가, 간호사 등 교육받은 중산층은 군부가 도를 넘을 경우 자유를 수호하기 위해 결집하고 동원될 수 있습니다."
 SIA_dominate_public_symbols: "공공 상징물 장악"
 SIA_dominate_public_symbols_desc: "군부는 오랫동안 공공 상징물을 장악하여, 동상을 세우고 자신들을 기념하는 공휴일을 선포해 왔습니다. 우리는 이에 맞서 우리만의 상징물을 세우고, 국민의 자결권과 과거의 독재에 대한 승리를 기념해야 합니다."
 SIA_civil_service_heroism: "공무원 영웅주의"
 SIA_civil_service_heroism_desc: "모든 타이 국민은 국외 또는 국내의 세력이 법의 지배권을 장악하려 들더라도, 법치를 수호해야 할 타고난 의무를 가집니다. 누군가 우리의 자유를 빼앗으려 한다면, 우리에 대한 국민의 지지가 필요할 뿐만 아니라 국민 스스로가 지도자로서 행동해야 합니다."
 SIA_spread_democratic_sentiment_in_universities: "대학에 민주주의 정서 전파"
 SIA_spread_democratic_sentiment_in_universities_desc: "학자들은 [SIA.GetName]의 미래의 방향을 좌우할 존재들입니다. 그들이 현재 배우는 것은 미래에 메아리칠 것이며, 지금의 학자들에게 강한 민주적 의무감을 심어주면 그 가치를 학계의 울타리 너머로까지 퍼뜨릴 수 있을 것입니다."
 SIA_sideline_disloyal_officers: "불충한 장교들을 배제"
 SIA_sideline_disloyal_officers_desc: "군 장교단은 하나로 통일된 집단이 아닙니다. 그 안에는 정부보다는 과거의 후원자, 경쟁 파벌, 혹은 자신의 야망에 충성하는 자들이 있습니다. 신중한 재배치와 행정적 압력을 통해 이러한 인물들을 위협이 되지 않는 곳으로 전출시킬 수 있으며, 신뢰성을 입증한 자들에게 마땅한 책임을 부여할 수 있습니다."
 SIA_sideline_disloyal_officers_tt: "무작위로 선택된 두 명의 장군은 4년 동안 §Y재배치됨§! 특성을 받아 보너스를 제공하지 않습니다.\n§Y재배치됨§! 특성을 부여받지 않은 두 명의 무작위 장군은 추가 능력치와 추가 긍정적 특성 한 개를 받습니다."
 SIA_direct_funds_from_the_military_towards_development: "군부 자금을 개발로 전환"
 SIA_direct_funds_from_the_military_towards_development_desc: "군부는 자신들의 예산이 개발 쪽으로 돌려지는 것에 불만을 품겠지만, 이런 투자 축소가 결국 국민에게 왜 이로운지 대중에게 설명하는 것은 우리의 책임이 아니라 그들의 책임입니다."
 SIA_as_the_eyes_turn_towards_southeast_asia: "시야를 아시아를 향해 전환"
 SIA_as_the_eyes_turn_towards_southeast_asia_desc: "동남아시아는 이제 멀리 있는 전구가 아니라 제국, 혁명, 그리고 전쟁이 교차하는 곳입니다. [SIA.GetName](은)는 이 분쟁의 장기짝이 될 것인지, 아니면 독자적인 목표를 가진 강대국이 될 것인지 결정해야 합니다."
 SIA_support_songsuradets_military_clique: "송수라뎃의 군부 세력 지원"
 SIA_support_songsuradets_military_clique_desc: "모든 장교가 국가의 적은 아닙니다. 송수라뎃과 그의 충성파들은 규율을 갖춘 군인들로서, 시암을 벼랑 끝으로 몰고 간 부패한 장군들에 대한 대안이 될 수 있습니다. 그들의 지원을 받는다면 국가를 혼란에 빠뜨리지 않고도 질서를 회복할 수 있습니다."
 SIA_support_songsuradets_military_clique_tt: "§Y내전§!이 발생할 경우 송수라뎃이 우리를 지원하여 §Y3§!개의 추가 사단을 제공할 것입니다.\n§R송수라뎃을 강화한 다음 $SIA_the_songsuradet_rebellion$(을)를 통해 그를 체포하려 한다면 그가 저항할 수 있습니다.§!"
 SIA_the_royal_police_counterweight: "왕립 경찰"
 SIA_the_royal_police_counterweight_desc: "왕립 경찰은 독립적인 병력으로서, 우리에 반대하는 세력이 권력을 장악하려 할 경우 이를 저지하는 데 활용될 수 있습니다."
 SIA_the_royal_police_counterweight_tt: "§Y내전§!이 발생할 경우 왕립 경찰이 우리를 지원하여 §Y2§!개의 추가 사단을 제공할 것입니다."
 SIA_for_the_preservation_of_siamese_independence: "민간 세력 통제 강화"
 SIA_for_the_preservation_of_siamese_independence_desc: "지난 세기에 세계열강들은 [SIA.GetAdjective] 영토의 무결성을 침해해 왔으며, 이번 세기에도 그럴 것으로 보입니다. 우리의 삶의 방식을 지키려면 우리는 단호한 조치를 취해야 합니다. 그렇지 않으면 우리는 분열되고 무력하며 갈기갈기 찢어진 국가가 될 것입니다."
 SIA_for_the_preservation_of_siamese_independence_tt: "§Y$anti_democratic_raids$§!(은)는 이제 §Y군부 세력§!의 지지도를 높이며, §Y민간 세력§!의 지지도를 낮춥니다"
 SIA_the_peoples_day: "국민의 날"
 SIA_the_peoples_day_desc: "과거의 군주제를 무너뜨리는 데 있어 군부의 역할보다는 국민 스스로의 역할을 더욱 부각해야 합니다. 국민의 날을 제정하면 국가를 결속시키는 계기가 될 것이며, 국민들은 자신들의 몫이 그보다 못해서는 안 된다고 여기게 될 것입니다."
 SIA_hold_military_parades: "열병식 개최"
 SIA_hold_military_parades_desc: "군의 사기를 높이고, 충성스러운 장군들에게 포상하고, 국민들에게 [SIA.GetAdjective]군의 위력을 상기시키기 위해 방콕을 횡단하는 성대한 열병식을 거행할 것입니다. 신문에 실릴 만한 기삿거리를 제공합시다!"
 SIA_embed_technocrats_in_civilian_institutions: "민간 기관에 기술 관료 배치"
 SIA_embed_technocrats_in_civilian_institutions_desc: "우리는 정부 내 기술 관료들과 동맹을 맺고, 그들을 민간 부문의 연장선으로 활용하여 더 넓은 범위에 영향력을 행사하고 군부의 영향력에 대항할 수 있습니다."
 SIA_military_academies_indoctrination: "사관학교의 이념 주입"
 SIA_military_academies_indoctrination_desc: "우리 사관학교는 이념 교육을 위한 최적의 거점입니다. 무장이 잘 되어 있고, 젊은 생도들은 교관들에게 영향을 받기 쉽습니다. 교관들의 마음을 얻으면 젊은 생도들도 사로잡을 수 있는 것입니다. 지배 계급에 충성하는 강력한 군대는 강력한 국가의 기반이며, 우리도 또한 그렇게 될 것입니다."
 SIA_the_king_of_the_white_elephant: "하얀 코끼리의 왕"
 SIA_the_king_of_the_white_elephant_desc: "잃어버린 영토를 되찾겠다는 집단 히스테리가 온 나라를 휩쓸어버릴 듯 위협하고 있으며, 전 세계가 이를 지켜보고 있습니다. 이러한 열기를 누그러뜨리기 위해, 우리는 영어로 촬영된 태국 최초의 반전 영화를 제작해 [SIA.GetName]의 진정한 모습을 세계에 보여줄 것입니다."
 SIA_the_king_of_the_white_elephant_tt: "§Y$SIA_sala_chaloem_thai_movie_theater$§! 중점을 완료 시 §Y$SIA_the_king_of_the_white_elephant$§! 선전 활동을 잠금 해제합니다. 다음 효과가 부여됩니다:\n180일 동안 매주 안정도: §G+0.45%§!"
 SIA_drum_up_irredentism: "실지회복주의 조장"
 SIA_drum_up_irredentism_desc: "앞으로의 전쟁에 대하여 군부의 지지를 확보하는 것만으로는 충분하지 않습니다. 우리는 국민의 지지 또한 얻어야 합니다. 시, 영화, 그리고 연설을 통해 우리는 우리의 역사적인 영토를 빼앗아 간 제국주의 세력을 심판하기 위하여 [SIA.GetName](을)를 준비시킬 것입니다."
 SIA_sell_privy_purse_lands: "왕실 토지 매각"
 SIA_sell_privy_purse_lands_desc: "왕실이 소유한 광대한 토지들은 현재 우리 통제하에 있습니다. 이 토지들은 우리의 국고를 크게 늘릴 수 있으며, 그 일부를 선별된 장교들에게 좋은 가격에 매각하여 그들의 충성심을 확보할 수도 있습니다."
 SIA_sell_privy_purse_lands_tt: "이 정신이 만료되면 §Y[SIA_phraya_phahon.GetName]§!이 추문에 휘말리게 되어, §Y$SIA_phibuns_premiership$§!의 파시즘 요구사항을 통과할 수 있게 됩니다."
 SIA_war_fervor: "전쟁의 열기"
 SIA_war_fervor_desc: "다가올 싸움을 기대하며 북소리가 울려 퍼집니다. 국민들은 이미 마음의 준비를 마쳤고, 도화선에는 이미 불이 붙었으며, 전쟁의 열기는 곧 최고조에 달할 것입니다. 우리는 이 에너지를 가치 있는 대의를 위해 사용해야 합니다."
 SIA_war_fervor_tt: "다른 국가에 선전포고할 때까지 전쟁 지지도가 영구적으로 증가하며, 선전포고 후에는 이 정신이 제거됩니다.\n\n선전포고 없이 §Y전쟁 지지도§!가 §Y95%§!를 초과한 상태로 너무 오래 유지될 경우, 내전이 발생합니다.\n선전포고 시:"
 SIA_the_midnight_meeting: "한밤의 회동"
 SIA_the_midnight_meeting_tt: "[SIA_plaek_phibunsongkhram.GetName](이)가 [SIA.GetNameDef]에서 권력을 장악하고 정부를 이끌 것입니다. 우리는 군주제를 제대로 복원하기 위해 그를 권좌에서 끌어내려야 합니다."
 SIA_the_midnight_meeting_desc: "송수라뎃 원수는 피분이 점점 더 권력을 축적하는 것을 지켜보며, 그 끝에 정면충돌이 기다리고 있음을 느낍니다. 군주제와 송수라뎃이 살아남으려면 왕당파, 고위 장교, 그리고 민간 명사들이 비밀리에 모여 피분이 먼저 공격해 오기 전에 그를 제거하기로 합의해야 합니다."
 SIA_meet_with_king_prajadhipok: "프라차티뽁 왕과의 면담"
 SIA_meet_with_king_prajadhipok_desc: "국왕 없는 음모는 또 다른 군사적 책략에 불과합니다. 망명 중인 프라차티뽁 왕을 만나면 그들의 대의를 왕실의 정통성과 결합하여, 망설이는 자들을 끌어들이고 정권을 분열시킬 수 있는 유일한 인물의 축복을 얻을 수 있습니다."
 SIA_prajadhipok_audience_with_churchill: "[ENG.GetLeader](와)과 접견한 프라차티뽁"
 SIA_prajadhipok_audience_with_churchill_desc: "[ENG.GetName]에 프라차티뽁이 온다는 것은 단순한 상징성 이상의 의미를 지닙니다. 만약 그가 [ENG.GetLeader]에게 충성파의 봉기가 아시아에서 영국에게 이익이 된다고 설득할 수 있다면, 말라야의 무기가 여전히 왕실에 충성하는 자들의 손에 들어갈 수도 있을 것입니다."
 SIA_prajadhipok_audience_with_churchill_tt: "[ENG.GetName] 측이 우리에게 다음을 제공합니다:"
 SIA_prajadhipok_audience_with_churchill_tt2: "제공 시기는 내전 시작 시입니다."
 SIA_facilitate_prajadhipoks_move_to_japan: "프라차티뽁 일가의 일본 이주 지원"
 SIA_facilitate_prajadhipoks_move_to_japan_desc: "[ROOT.GetNameDef]의 혼란에서 이득을 볼 수 있는 강국은 영국만이 아닙니다. 프라차티뽁의 일본행을 주선함으로써 우리는 도쿄의 호의를 얻을 수 있고, 어쩌면 왕당파의 봉기가 내전으로 번질 경우 그들의 사단을 지원받을 수 있다는 보장까지 얻을 수 있을지도 모릅니다."
 SIA_facilitate_prajadhipoks_move_to_japan_tt: "내전 중에 [JAP.GetNameDef]의 3개 레인저 사단이 우리를 지원할 것입니다."
 SIA_the_kings_gambit: "킹스 갬빗"
 SIA_the_kings_gambit_desc: "프라차티뽁은 정권이 자신을 체포할 것임을 충분히 예상한 채 방콕으로 돌아올 것입니다. 체포는 왕당파에게 분노와 정통성, 그리고 권위를 부여하여 이들이 주저하지 않고 그의 이름으로 봉기할 수 있도록 할 것입니다. 망명 중인 왕이 체포되면 그것이 신호가 되어 [ROOT.GetName](을)를 위한 투쟁이 시작될 것입니다."
 SIA_the_kings_gambit_tt: "우리의 지지도는 얼마나 많은 세력이 우리 편에 서는지에 따라 결정될 것입니다."
 SIA_restore_order: "질서 회복"
 SIA_restore_order_desc: "내전에서는 승리했지만, 승리만으로는 왕국을 치유할 수 없습니다. 폐허를 재건하고, 보수파를 진정시키고, 행정부를 재건해야만 왕권이 확고해지고 공공질서가 제자리를 되찾아 [ROOT.GetName](이)가 무질서에서 벗어날 수 있습니다."
 SIA_ananda_age_trigger_12: "아난타 왕은 §Y12§!세 이상입니다(현재 §Y[?var:SIA_anandas_age]§!). 그의 생일은 9월 20일입니다."
 SIA_ananda_age_trigger_15: "아난타 왕은 §Y15§!세 이상입니다(현재 §Y[?var:SIA_anandas_age]§!). 그의 생일은 9월 20일입니다."
 SIA_ananda_trait_tt: "아난타가 왕으로 즉위하면 다음을 얻습니다:"
 SIA_to_forge_a_king: "왕 만들기"
 SIA_to_forge_a_king_desc: "아난타 왕은 멀리 스위스에 머물러 있으며, 아직 어려서 심성과 인격이 형성되고 있는 중입니다. 우리가 그의 학업을 세심하게 지도한다면, 단순히 왕관을 쓴 허수아비가 아닌, 우리가 계획한 [ROOT.GetNameDef]의 운명에 걸맞은 통치자를 길러낼 수 있을 것입니다."
 SIA_to_forge_a_king_tt: "장차 왕이 될 아난타 마히돈은 현재 어린 나이로 [SWI.GetName]에서 학업에 매진하고 있습니다. 우리는 그의 미래 학업과 관심사에 영향을 미쳐 그가 위대한 왕이 되도록 할 수 있습니다.\n\n15세가 될 때까지 매년 그의 생일에, 우리는 그가 공부할 분야를 선택할 수 있으며, 이는 그가 왕위에 오를 때 다양한 혜택을 제공할 것입니다.\n\n그의 생일은 9월 20일이며, 그의 나이는 §Y[?var:SIA_anandas_age]§!입니다."
 SIA_ascend_the_throne: "왕좌에 오르기"
 SIA_ascend_the_throne_desc: "섭정은 영원히 지속될 수 없습니다. 아난타 왕은 이제 왕위의 부담을 스스로 짊어질 나이가 되었으며, 그의 정식 즉위와 함께 복원된 군주제는 후견과 음모에서 벗어나 새롭고 정통성 있는 통치로 나아갈 것입니다."
 SIA_the_provincial_council_of_state: "주의 지방의회"
 SIA_the_provincial_council_of_state_desc: "전쟁으로 인해 정부 기구가 무너지고 권위도 흔들리고 있습니다. 어린 아난타 왕이 자신의 이름으로 통치할 수 있을 때까지, 주의 지방의회가 임시 정부 역할을 맡아 충성파들이 자신들을 위해서가 아니라 정당한 군주제 복원을 위해 싸우고 있음을 선포해야 합니다."
 SIA_the_regency_of_boworadet: "보워라뎃의 섭정"
 SIA_the_regency_of_boworadet_desc: "보워라뎃 왕자는 옛 질서의 위엄을 지니고 있으며 그의 충성심이 어디에 있는지는 의심할 여지가 없습니다. 아난타의 이름으로 그를 섭정으로 임명하여, 우리는 국가를 보수 세력의 손에 맡기고 이 복원이 단순한 장관 교체 이상의 의미를 지닌다는 것을 분명히 할 것입니다."
 SIA_the_sacred_hierarchy: "신성한 계층 구조"
 SIA_the_sacred_hierarchy_desc: "보워라뎃은 모든 계급이 자신의 분수를 알며, 왕실이 모든 세속적 야망 위에 있을 때 왕국이 가장 강해진다고 주장합니다. [ROOT.GetNameDef]의 군주제, 신앙, 그리고 자연적인 계층 구조는 협상이 가능한 구시대의 유물이 아니라 국가를 받치는 신성한 기둥으로서 다시 인식되어야 합니다."
 SIA_the_regency_of_songsuradet: "송수라뎃의 섭정"
 SIA_the_regency_of_songsuradet_desc: "송수라뎃은 자유주의자는 아니지만, 현대적인 국가의 필요성을 외면하는 인물도 아닙니다. 섭정으로서 그는 왕권을 보존하면서도 [ROOT.GetNameDef]의 미래를 규율, 계획, 그리고 국가 발전을 위한 군사적 지도 계획에 맡길 수 있습니다."
 SIA_order_discipline_and_unity: "질서 규율과 통합"
 SIA_order_discipline_and_unity_desc: "파벌 정치와 내전의 혼란은 국가를 거의 파멸로 몰고 갔습니다. 송수라뎃의 해답은 단순합니다. 바로 정부의 질서, 사회의 규율, 그리고 공동의 목표를 통해 왕국을 더욱 강하고 현대적인 국가로 재건하는 것입니다."
 SIA_the_regency_of_rangsit: "랑싯의 섭정"
 SIA_the_regency_of_rangsit_desc: "랑싯 왕자는 군주제가 대의제 정부와 화해해야 존속할 수 있다는 것을 이해하고 있습니다. 그의 섭정은 품위는 보수적이지만 방법은 민주적이며, [ROOT.GetNameDef]에 안정적인 의회제의 미래를 보장할 준비가 되어 있는 군주제 복원을 제안합니다."
 SIA_constitutional_virtue: "헌법적 미덕"
 SIA_constitutional_virtue_desc: "법을 존중하는 군주제는 전복하기 어렵고 지키기 쉽습니다. 랑싯의 지도 아래, 우리는 입헌 정치를 부활시키고, 자의적인 권력을 억제하며, 왕권이 법치 아래의 자유를 지키는 수호자일 때 가장 굳건하다는 것을 국민에게 가르쳐 줄 것입니다."
 SIA_an_absolute_monarchy: "전제군주정"
 SIA_an_absolute_monarchy_desc: "제한된 군주제 실험은 굴욕, 쿠데타, 그리고 야심을 가진 장교들에 의한 왕권 찬탈만을 가져왔습니다. 왕실이 다시금 충성을 얻으려면 왕권은 특권을 온전히 되찾고, 정당이나 의회에 종속되지 않은 통치를 해야 합니다."
 SIA_a_constitutional_monarchy: "입헌군주제"
 SIA_a_constitutional_monarchy_desc: "왕이 국가를 지배하지 않아도 왕국을 보존할 수 있습니다. 견고한 헌정 체제 안에서 군주제를 복원함으로써, 왕실과 국민을 결속시키고 왕실의 위엄과 책임 있는 정부가 공존하도록 할 수 있습니다."
 SIA_to_lay_the_bait: "미끼 뿌리기"
 SIA_to_lay_the_bait_tt: "우리는 조작된 경제 계획을 유출하여 군부를 자극할 것입니다.\n우리가 §Y$SIA_and_spring_the_trap$§!(을) 지연시킬수록 군부에 대한 반발은 커지고 우리의 지지도가 더욱 강해질 것입니다.\n\n$SIA_dem_event_count_cw_scale_tt$\n\n군부가 가짜 초안을 비판할 때마다 내전에서의 우리 전쟁 지지도가 증가하며 최대 §Y75%§!까지 증가합니다. 또한, 우리의 총 민주주의 지지율(범위 §Y0%~100%§!)에서 추가로 §Y25%§!의 내전 지지도를 얻을 수 있습니다."
 SIA_dem_event_count_cw_scale_tt: "§Y현재 예측된 지지도§!: §G[?var:SIA_dem_event_count_cw_scale|%]§!"
 SIA_to_lay_the_bait_desc: "황색 서류는 경제 개혁을 요구하지만, 군부는 이를 공산주의라고 부를 것입니다. 먼저 조작된 급진적인 초안을 유출하여 그들의 분노를 유발하면, 더 온건한 실제 내용이 공개되었을 때 그들의 주장을 무력화할 수 있습니다."
 SIA_and_spring_the_trap: "덫 발동하기"
 SIA_and_spring_the_trap_desc: "장군들은 미끼를 물었습니다. 그들의 분노는 반란으로 변했고, 그 반란은 그들의 야심을 드러냈으며, 민간정부는 이를 노리고 있었습니다. 이제 덫이 닫히고, [ROOT.GetName]의 미래는 헌법에 따르는 자들이 결정할 것입니다."
 SIA_and_spring_the_trap_tt: "우리의 총 지지율이 §Y80%§!를 초과한다면, 내전을 피하고 즉시 군부를 축출하게 됩니다."
 SIA_rebuild_the_war_torn_economy: "전쟁으로 망가진 경제 재건"
 SIA_rebuild_the_war_torn_economy_desc: "내전은 도로, 공장, 논, 무역로를 파괴했습니다. 재건은 즉시 시작되어야 합니다. 임금, 곡물, 철도, 그리고 신용 지원은 방콕에서의 어떤 연설보다도 [ROOT.GetName]의 안정에 더 큰 도움이 될 것입니다."
 SIA_end_military_grift: "군사적 사기의 종식"
 SIA_end_military_grift_desc: "오랫동안 군사 예산은 개인의 이익, 후원 네트워크, 쓸모없는 위신 사업에 낭비되어 왔습니다. 전쟁은 이러한 부패를 적나라하게 드러냈습니다. 모든 부패한 계약, 유령 부대, 그리고 횡령된 물자를 조사하여 기득권 세력의 손아귀에서 벗어나야 합니다."
 SIA_the_purge: "숙청"
 SIA_the_purge_desc: "군사 파벌은 민간의 통치에 복종하기는커녕 국가를 피로 물들였습니다. 반역자들과는 타협할 수 없습니다. 다시는 국가를 위협하지 못하도록 장교, 협력자, 동조자들을 모든 지휘부에서 제거해야 합니다."
 SIA_achieve_foreign_legitimacy: "해외에서의 정통성 확보"
 SIA_achieve_foreign_legitimacy_desc: "다른 강국들은 우리의 위기를 불신의 시선으로 바라보며, 시암이 군사정부의 통치로 붕괴할지 아니면 혁명으로 붕괴할지 지켜보고 있습니다. 우리는 민간정부가 안정적이고, 합법적이며, 국가를 방어할 능력이 있음을 증명해야 합니다."
 SIA_achieve_foreign_legitimacy_trigger: "하나 이상의 강대국에서 우리에 대한 의견이 §Y75§!를 초과"
 SIA_countries_that_like_me_doctrine_tt: "§Y[?var:SIA_countries_that_like_me]x§! §G50%§! 비용 감소: §Y육군 교리§!"
 SIA_achieve_foreign_legitimacy_tt: "우리에 대한 의견이 §Y75§!를 초과하는 강대국 하나당 §G[?var:SIA_achieve_foreign_legitimacy_base_stab_gain|%.0]§! 안정도를 획득합니다.\n\n§Y4§!개 이상의 강대국이 조건을 충족하는 경우, 우리는 해당 한도를 넘는 모든 강대국 하나당 §Y1x§! §G50%§! 비용 감소: §Y육군 교리§!를 추가로 얻습니다.\n\n§Y6§!개 이상의 강대국이 조건을 충족하는 경우, 우리는 §Y민간공장§! §G+2§!개를 얻습니다."
 SIA_secure_the_state: "국가 안보"
 SIA_secure_the_state_desc: "내전에서의 승리가 곧 안정을 의미하는 것은 아닙니다. 반동 장교들이 다시 결집하기 전에 철도, 항구, 조병창, 통신 중심지를 확보해야 합니다. 방콕은 평온을 유지하고, 연결망을 보전하며, 확고한 민간 통제 아래 있어야 합니다."
 SIA_expand_upon_the_dossier: "황색 서류 이후의 확장"
 SIA_expand_upon_the_dossier_desc: "황색 서류는 불안정한 시기를 위하여 작성되었습니다. 하지만 이제 그 시기는 지났습니다. 군사 파벌이 패배했으니 이제 우리는 더 나아가서, 심층적인 토지 개혁, 더욱 강력한 노동 보호, 그리고 시암을 근본부터 재편할 수 있는 국가 건설을 추진할 수 있습니다."
 SIA_military_oversight_bureau: "군사 감독국"
 SIA_military_oversight_bureau_desc: "군부가 다시는 국가 안의 국가가 되어서는 안 됩니다. 민간 주도의 감독 기구가 군 내부의 인사, 예산, 정치 활동을 감시하여 군부가 방콕의 통제를 받게 하고 그 반대가 되지 않도록 해야 합니다."
 SIA_military_oversight_bureau_tt: "§Y군사 감독국§!은 5~9개월 간격으로 장군들에 대한 조사를 시행합니다. 이 기간 동안 해당 장군들은 강화된 감시를 우려하여 작전 효율이 감소합니다."
 SIA_the_yellow_dossier: "황색 서류"
 SIA_the_yellow_dossier_desc: "조작된 급진적 초안은 제 역할을 다했으므로, 이제 진정한 황색 서류에 따라 신중한 개혁, 경제 현대화, 그리고 국가를 혼란에 빠뜨리지 않으면서 군사적 지배력을 약화시키도록 설계된 정치적 안전장치를 구현할 수 있습니다."
 SIA_achieve_domestic_legitimacy: "국내에서의 정통성 확보"
 SIA_achieve_domestic_legitimacy_desc: "현 정부는 무력으로 살아남았지만, 이제는 법과 먹고사는 문제, 질서로 승리해야 합니다. 국민의 신뢰를 회복하고, 비상조치를 정당화하며, 민간 통치가 단순한 생존 이상의 가치를 제공한다는 것을 국민이 인식하도록 해야 합니다."
 SIA_achieve_domestic_legitimacy_tt: "§Y인민당 체제§!가 비활성화됩니다.\n§Y군부 세력§!이 영구히 해산되어 해당 국민정신이 완전히 제거됩니다.\n\n§Y민간 세력§!이 영구히 §Y$idea_SIA_unwavering_civilian_support$§!(으)로 재편됩니다."
 SIA_allies_integration: "연합국 통합"
 SIA_allies_integration_desc: "우리 군은 연합국과 함께 싸우는 법을 배워야 합니다. 시암이 단순한 상징적 파트너 이상의 존재가 되려면 지휘 구조, 통신, 보급 절차, 장비 기준 등을 일치시켜야 합니다."
 SIA_prepare_for_a_pacific_war: "태평양 전쟁에 대비"
 SIA_prepare_for_a_pacific_war_desc: "제국들의 시선이 태평양으로 향하고 있습니다. 일본의 야망, 유럽의 식민지, 그리고 연합군의 전략 모두 다가오는 폭풍을 예고하고 있습니다. 시암은 우리 해안에서 첫 포성이 울리기 전에 대비해야 합니다."
 SIA_the_end_of_gunboat_diplomacy: "포함외교의 종말"
 SIA_the_end_of_gunboat_diplomacy_desc: "다시는 외국 군함이 차오프라야강 어귀에서 조건을 강요하게 두지 않을 것입니다. 시암은 방콕에 대한 어떠한 위협도 무모한 행위가 되도록 필요한 포대, 부두, 기뢰, 해안 방어 시설을 보유해야 합니다."
 SIA_preemtive_strike: "선제공격"
 SIA_preemtive_strike_desc: "일본이 전쟁을 시작할 때까지 기다리는 것은 어리석은 짓입니다. 만약 일본 제국이 아시아를 휩쓸 계획이라면, 일본의 육군과 함대가 다른 곳에 완전히 투입되기 전에 [SIA.GetName](이)가 공격해야 합니다."
 SIA_the_siamese_armada: "[SIA.GetAdjective] 함대"
 SIA_the_siamese_armada_desc: "현대적인 [SIA.GetName]에는 현대적인 함대가 필요합니다. 새로운 함선, 훈련된 승조원, 그리고 확장된 해군 기반시설을 통해, [SIA.GetAdjective] 함대는 해안을 방어하고 그 너머로 전력을 투사할 수 있는 강력한 군대가 될 것입니다."
 SIA_asian_democratic_compact: "아시아 민주주의 협정"
 SIA_a_more_moderate_option: "더 온건한 선택"
 SIA_a_more_moderate_option_desc: "개혁은 거센 반대 여론에 불타 사라지지 않고 살아남아야 합니다. 온건한 범위 내에서 황색 서류를 따름으로써 극단주의자들을 고립시키고, 중산층을 진정시키며, 첫 승리 이후에도 지속될 수 있는 시민 질서를 구축할 수 있습니다."
 SIA_asian_democratic_compact_desc: "아시아는 멀리 떨어진 제국이나 강대국의 약속에 영원히 의존할 수는 없습니다. 이 지역의 민주주의 국가들은 단결하여 서로를 지키고, 아시아에서 독립과 자유가 지속될 수 있음을 증명해야 합니다."
 SIA_asian_democratic_compact_tt: "아시아 종속국들의 독립을 요구할 수 있게 하며, 그들을 우리 세력에 초청할 수 있게 해줍니다."
 SIA_asian_democratic_compact_modify: "§Y$SIA_asian_democratic_compact$§! 변동치:"
 SIA_southeast_asia_joint_command: "동남아시아 합동사령부"
 SIA_southeast_asia_joint_command_desc: "우리의 협정은 단순한 외교적 약속에 그쳐서는 안 됩니다. 합동사령부는 동남아시아 전역의 전략, 보급, 정보 및 방어 계획을 조율하여 흩어진 군대들을 하나 된 방패로 거듭나게 해야 합니다."
 SIA_pan_asian_weapon_standardization: "범아시아 무기 표준화"
 SIA_pan_asian_weapon_standardization_desc: "각 동맹국이 서로 다른 소총, 구경, 무전기, 차량을 사용하는 것은 군수 실패의 가능성을 높입니다. 무기를 표준화하고 생산 계획을 공유하면 연합군이 더 강력하고 더 저렴하며 더 빠르게 무장하게 될 것입니다."
 SIA_united_against_aggression: "침략에 맞선 단결"
 SIA_united_against_aggression_desc: "우리 협정의 회원국은 그 누구도 홀로 서지 않을 것입니다. 제국주의, 파시즘, 군국주의, 혹은 기회주의를 채택한 이웃 국가로부터의 위협에 대하여 아시아 국가들은 함께 대응할 것입니다."
 SIA_the_hammers_that_strike: "내려치는 망치"
 SIA_the_hammers_that_strike_desc: "우리 동맹은 더 이상 생존을 원하는 소국들의 집단이 아닙니다. 우리 동맹은 무기입니다. 각 국가는 망치이며, 우리는 아시아를 지배하려는 모든 강대국을 함께 내려칠 것입니다."
 SIA_mobilize_the_defenders_of_siam: "시암의 수호자들 동원"
 SIA_mobilize_the_defenders_of_siam_desc: "구 군부는 국가를 저버렸지만, 시암에는 여전히 수호자가 필요합니다. 의용군, 충성스러운 장교, 지방 경비대, 그리고 애국심 넘치는 시민들을 조직하여, 안팎의 적들로부터 헌법을 수호하는 군대를 만들어야 합니다."
 SIA_join_the_allies: "연합국 가입"
 SIA_join_the_allies_desc: "세계가 전쟁에 삼켜진 상황에서 [ROOT.GetName](이)가 홀로 버틸 수는 없습니다. 연합국은 무기와 국가적 인정, 그리고 침략에 저항하는 국가들 중 하나다 될 수 있는 기회를 제공합니다. 연합국에 가입함으로써, 우리는 시암의 생존을, 자유세계를 위한 더 큰 투쟁과 연결할 수 있습니다."
 SIA_the_malay_peninsular_defense_plan: "말레이반도 방어 계획"
 SIA_the_malay_peninsular_defense_plan_desc: "동남아시아에 전쟁이 일어난다면, 말라야는 가장 먼저 전장이 될 것입니다. 요새화, 보급창, 그리고 영국과의 합동 작전 계획으로 말라야를 침략에 대한 방패로 만들 수 있습니다."
 SIA_the_malay_peninsular_defense_plan_tt: "방콕과 싱가포르를 잇는 철도를 건설합니다.\n\n[MAL.GetName], 싱가포르, [724.GetName], [289.GetName] 및 [1076.GetName]에서의 모든 승점\n§G2§!개의 §Y해안 요새§! 추가\n§G2§!개의 §Y요새§! 추가\n해당되는 주마다:\n§G1§!개의 §Y고정 대공포§! 추가"
 SIA_join_the_united_front: "연합 전선 가입"
 SIA_join_the_united_front_desc: "중국은 [JAP.GetAdjective]의 침략에 피를 흘리고 있지만, 그럼에도 여전히 싸우고 있습니다. 연합 전선에 가입함으로써, [SIA.GetName](은)는 전쟁 중인 땅을 제국주의적 야망의 무덤으로 바꾸는 데 도움을 줄 수 있습니다."
 SIA_a_land_war_in_asia_desc: "선전포고만으로는 전쟁에서 승리할 수 없습니다. 시암의 군인들은 아시아의 험난한 지형에서 행군하고, 싸우고, 견뎌내야 합니다. 연합 전선에 대한 우리의 헌신은 행동으로 증명되어야 합니다."
 SIA_death_to_the_communists: "공산주의자들에게 죽음을"
 SIA_death_to_the_communists_desc: "군사 파벌의 패배가 또 다른 폭정으로 이어져서는 안 됩니다. 공산주의 선동가들은 이번 위기가 국가를 약화시켰다고 믿고 있지만, 그들은 곧 민간 민주주의가 무방비 상태를 의미하지 않는다는 것을 깨닫게 될 것입니다."
 SIA_death_to_the_nationalists: "민족주의자들에게 죽음을"
 SIA_death_to_the_nationalists_desc: "일본은 물러갔지만, 아시아의 미래라는 문제는 여전히 남아 있습니다. 과거의 민족주의적인 질서를 유지한다면, 단지 한 계층 구조가 다른 계층 구조로 대체될 뿐입니다. 아시아를 재편하기 위해서는 공산주의가 승리해야 합니다."
 SIA_a_new_dawn_over_asia: "아시아의 새로운 여명"
 SIA_a_new_dawn_over_asia_desc: "일본 제국은 무너졌고, 그 폐허를 차지하려던 부패한 세력은 축출되었습니다. 아시아 전역에서, 제국주의의 지배에서 벗어나 미래를 건설하려는 국가들 위로 새로운 새벽이 밝아오고 있습니다."
 SIA_phibuns_premiership: "피분의 총리직"
 SIA_phibuns_premiership_desc: "[SIA_phraya_phahon.GetName] 총리의 임기가 끝나감에 따라 당이 후계자로 지명한 쁠랙 피분송크람이 권력을 잡을 준비를 마쳤습니다. 이는 우리와 함께하는 군부가 기뻐할 일이지만, 민간 세력은 이를 불안하게 여길 것입니다.\n이 새로운 시대에 우리에게 나아갈 길은 오직 하나뿐입니다. 확고한 신념을 가지고 나아갑시다!"
 SIA_siamese_youth_movement: "[THIS.GetAdjective] 청년 운동"
 SIA_siamese_youth_movement_desc: "[THIS.GetName]의 청년들은 마치 뜨거운 불꽃 위의 강철처럼 단련되어야 합니다. 그들은 국가를 존중하는 법, 조국을 수호하는 법, 타이 사회의 소중한 일원이 되는 법을 배우게 될 것입니다."
 SIA_territorial_defense_student: "영토방위 학생"
 SIA_territorial_defense_student_desc: "청년 육성이라는 기회를 확대하여, 가장 유망한 후보자들은 청년 병사 훈련소로 보내져 [SIA.GetNameDef] 수호에 기여하게 될 것입니다. 그들은 적절한 군사 훈련을 받고 군대가 활용할 수 있는 추가적인 전력으로 활약할 것입니다."
 SIA_expand_domestic_arms_workshops: "국내 군수공장 확대"
 SIA_expand_domestic_arms_workshops_desc: "우리의 국내 전쟁 물자 생산 능력은 다른 선진국들에 비해 형편없이 뒤처져 있습니다. 우리 군대에 지속적으로 새로운 장비가 공급될 수 있도록 국내 군수 물자 생산 확대에 집중해야 합니다."
 SIA_look_to_european_fascism: "유럽 파시즘 주시하기"
 SIA_look_to_european_fascism_desc: "우리는 이 나라를 개혁할 기회를 얻었습니다. 과거의 굴레에서 벗어나, 서방에서 일어나고 있는 일들에 영감을 받아 새로운 미래를 향해 나아가야 합니다. 낡은 세계 질서가 해체되고 있다는 것은 분명하며, 비전 없이 뒤처지는 자들은 그 대가를 치르게 될 것입니다."
 SIA_the_songsuradet_rebellion: "송수라뎃 반란"
 SIA_the_songsuradet_rebellion_desc: "고위 장교 프라야 송수라뎃은 그가 원한다면 현 정권에 위협적인 존재가 될 수 있습니다. 정권에 대한 이러한 위협은 용납될 수 없으며, 피분 총리의 주요 정적인 그는 제거되어야 합니다.\n송수라뎃과 그의 지지자들을 공격하는 데 사용할 수 있는 자료는 충분히 많이 있으며, 이는 우리의 권력을 공고히 하고 국내의 반대파들을 제거하는 데 도움이 될 것입니다."
 SIA_the_songsuradet_rebellion_historical_tt: "프라야 송수라뎃 장군은 국가 전복 음모 혐의로 기소될 것입니다. 송수라뎃과 그의 고문인 §Y[SIA_rangsit_prayurasakdi.GetName]§!는 숙청될 것입니다.\n\n우리는 다음을 얻게 됩니다:\n"
 SIA_the_songsuradet_rebellion_historical_tt2: "시간이 초과된 후에는 다음을 얻습니다:"
 SIA_the_songsuradet_rebellion_historical_tt3: "§Y[?var:SIA_purged_military_timer]§!일 동안"
 SIA_the_songsuradet_rebellion_alt_tt: "프라야 송수라뎃 장군은 국가 전복 음모 혐의로 기소될 것입니다.\n\n그러나 우리가 그의 군부 세력을 강화했기 때문에 대담해진 송수라뎃은 소환을 거부할 가능성이 있으며, 이는 교착 상태 또는 내전으로 이어질 수도 있습니다."
 SIA_sue_the_king_in_exile: "망명 중인 왕 고소하기"
 SIA_sue_the_king_in_exile_desc: "망명 중인 왕이 상당히 많은 귀중품을 [ENG.GetNameDefCap]에 가져갔다는 소문이 있습니다. 우리는 그것들을 되찾아야 하고, 그 목적을 위해 왕과 그의 배우자를 법정에 세워야 한다면 그렇게 할 것입니다."
 SIA_suspend_ordinary_legal_procedures: "일반적인 법적 절차의 중단"
 SIA_suspend_ordinary_legal_procedures_desc: "송수라뎃 반란은 우리에게 국가 안보를 명분으로 대대적인 개혁을 단행할 기회를 제공합니다. 법원과 기타 정치 기관이 지닌 견제와 균형이 무력화될 것이며, 이를 통해 우리는 권력을 중앙집권화할 시간을 확보할 수 있을 것입니다."
 SIA_the_duty_of_the_thai_people_during_the_war_act: "전쟁 중 타이 국민의 의무 법령"
 SIA_the_duty_of_the_thai_people_during_the_war_act_desc: "$idea_SIA_cemented_control_3_desc$"
 SIA_recognize_manchukuo: "만주국 인정"
 SIA_recognize_manchukuo_desc: "TODO_CM"
 SIA_press_censorship: "언론 검열"
 SIA_press_censorship_desc: "언론의 자유는 국가 안정을 해칠 위험이 있습니다. 어느 정도의 재량권은 존재해야 하지만, 언론에서 정부의 목소리와 의지가 우선시되도록 해야 합니다."
 SIA_department_of_publicity: "홍보 부서"
 SIA_department_of_publicity_desc: "선전기구는 모든 국가, 특히 우리처럼 영토 확장 야망을 가진 국가에 필수적입니다. 선전 부서에 자금을 지원하면 이를 달성할 수 있을 것입니다."
 SIA_thai_cultural_mandates: "타이 문화명령"
 SIA_thai_cultural_mandates_desc: "우리는 문화명령을 제정하고, 국민의 단결을 강화하며, 통일된 정체성을 형성함으로써 타이 국민을 결집시키고 강력한 국가 문화를 구축할 수 있습니다."
 SIA_thai_cultural_mandates_tt: "§Y정치력§!을 소모하여, 다양한 강화를 제공하는 문화 명령을 제정하는 결정을 잠금 해제합니다. 문화명령 1호 및 다른 첫 번째 명령은 무료입니다."
 SIA_relocate_the_capital_to_phetchabun: "펫차분으로 천도"
 SIA_relocate_the_capital_to_phetchabun_desc: "정부가 위협받고 있습니다! 역사가 증명하듯 방콕은 해상 공격에 취약하며, 비록 대중의 반발을 살지라도 내륙으로 수도를 이전하는 것은 반드시 필요한 결정입니다."
 SIA_relocate_the_capital_to_phetchabun_tt: "최대 §G3§!개의 §Y군수공장§!을 §Y[1076.GetName]§!에서 §Y[1077.GetName]§!(으)로 이전\n§G3§!개의 §Y민간공장§!을 §Y[1076.GetName]§!에서 §Y[1077.GetName]§!(으)로 이전\n펫차분 주변에 레벨 §G3§! 요새 건설"
 SIA_relocate_the_capital_to_phetchabun_tt2: "정신 시간 만료 시 기본 안정도 획득: §R-25%§!"
 SIA_radio_propaganda: "라디오 선전"
 SIA_radio_propaganda_desc: "[SIA.GetName]에 전기가 보급되면서 라디오가 주류 매체로 자리 잡고 있습니다. 언론을 통제해야 하는 것처럼 방송되는 내용도 통제해야 합니다."
 SIA_sala_chaloem_thai_movie_theater: "살라 찰로엠 타이 영화관"
 SIA_sala_chaloem_thai_movie_theater_tt: "다양한 강화를 제공하는 선전 영화를 만드는 결정을 잠금 해제합니다. 선전 영화의 예는 다음과 같습니다:\n"
 SIA_sala_chaloem_thai_movie_theater_desc: "영화는 우리 국가에서는 새로운 매체이지만, 그 잠재력은 명확합니다. 시, 책, 라디오처럼 영화는 평민과 엘리트 모두의 마음과 정신을 풍요롭게 할 수 있습니다. 이 매체를 활용하면 우리는 시민들이 [SIA.GetName](을)를 위대한 국가로 발전시키고자 하는 의지를 강화할 수 있습니다."
 SIA_pan_thaiism: "범타이주의"
 SIA_pan_thaiism_desc: "[ROOT.GetName](은)는 단순히 존속하는 것만으로는 충분하지 않습니다. 번영해야 합니다. [ROOT.GetAdjective] 국민의 미래는 삼류 국가에 안주하는 데에 있는 것이 아니라 세계정세 속에서 능동적으로 활약하는 데 있습니다. 우선, 우리의 것을 빼앗아 간 제국주의자들에 맞서 국민의 마음과 정신을 일깨워야 하며, 우리가 무엇을 빼앗겼는지 다시금 상기시켜야 합니다."
 vichy_exist_trigger: "§Y비시 프랑스§!가 존재함"
 vichy_exist_not_trigger: "§Y비시 프랑스§!가 존재하지 않음"
 SIA_retake_lost_british_states: "빼앗긴 영국령 탈환"
 SIA_retake_lost_british_states_tt: "§Y버마§!와 §Y말레이시아§!의 영국령 영토에 대해 제한전을 개시할 수 있는 능력을 잠금 해제합니다."
 INS_retake_lost_british_states_tt: "§Y말레이시아§!의 영국령 영토에 대해 제한전을 개시할 수 있는 능력을 잠금 해제합니다."
 SIA_retake_lost_british_states_desc: "우리 위대한 왕국을 분열시킨 것은 [FRA.GetAdjective]만이 아니었습니다. [ENG.GetAdjective] 또한 야망에 이끌려 자신들의 몫을 차지할 수 있는 모든 기회를 이용했습니다. 그들의 관심이 더 강대한 적수들에게 쏠려 있는 지금이 바로 우리가 행동에 나설 때입니다."
 SIA_recover_indochina: "인도차이나 수복"
 SIA_recover_indochina_desc: "지난 세기 동안 우리 국가는 [FRA.GetAdjective]에 의해 분열되었습니다. 세계 반대편에 있는 그 정부는 우리에게 무엇을 해야 할지, 어떻게 살아야 할지를 지시할 권리가 전혀 없었음에도 불구하고, 군함과 무력으로 우리 것을 빼앗아 갔습니다. 이번 세기에는 [FRA.GetAdjecive]의 힘이 약해지고 있습니다. 이 세기는 우리의 것입니다."
 SIA_recover_indochina_tt: "§Y인도차이나§! 영토에 대해 제한전을 개시할 수 있는 능력을 잠금 해제합니다."
 SIA_demand_the_return_of_lost_territory: "상실한 영토의 반환 요구"
 SIA_demand_the_return_of_lost_territory_desc: "[FRA.GetNameDefCap](은)는 약해져 있으며, 사라져 가는 영향력에 매달려 있는 종이호랑이에 지나지 않습니다. 군사력이 붕괴하면서 더 이상 과거와 같은 힘을 투사할 수 없으며, 우리의 요구에 맞설 입장도 아닙니다."
 SIA_demand_the_return_of_lost_territory_tt: "우리는 §Y인도차이나§! 및 §Y[MAL.GetName]§!의 일부를 소유한 자들에게 §Y[1069.Getname]§!, §Y[1067.Getname]§!, §Y[741.Getname]§!, §Y[1068.Getname]§!, §Y[1061.Getname]§!, §Y[1064.Getname]§!, §Y[1065.Getname]§!, §Y[670.Getname]§!(을)를 우리에게 반환해 달라고 요청할 것입니다.\n\n영향을 미치는 요인:\n-소유자 대비 30% 이상의 전투력 소유\n-소유자가 강대국과 전쟁 중\n-소유자가 세력에 가입해 있지 않음\n-소유자가 §Y비시 프랑스§!\n-우리가 세력에 가입해 있음\n-소유자가 우리를 싫어함"
 SIA_the_greater_thai_empire: "더욱 위대한 대타이 제국"
 SIA_the_greater_thai_empire_available_trigger: "§Y[ROOT.GetName]§!(이)가 모든 인도차이나 주를 지배\n모든 인도차이나 주의 순응도가 §Y[?var:SIA_greater_thai_empire_compliance_requirement]%를 초과§!\n\n추가 필요 조건:"
 SIA_the_greater_thai_empire_desc: "우리가 정상에 오를 시간이 다가왔습니다. 빼앗겼던 것을 되찾았으며, 국민들이 우리를 실질적인 권위자로 인정함에 따라, 우리는 새롭게 재건된 대타이 제국의 정당한 지도자로서 우리의 정통성을 확립했습니다."
 SIA_crack_down_of_foreign_merchants: "외국 상인에 대한 강력 탄압"
 SIA_crack_down_of_foreign_merchants_desc: "무역은 오랫동안 외부의 이해관계에 의해 좌우되어 왔으며, 이는 국가의 회복력을 약화시킬 수 있는 취약성을 초래했습니다. 경제 안보를 수호하기 위해서는 우리 무역을 스스로 통제할 수 있어야 하며, 번영과 안정이 우리가 직접 통제하는 기반 위에 구축되도록 해야 합니다."
 SIA_royal_palace_bureau_directive_no_1523: "왕실국 지령 제1523호"
 SIA_royal_palace_bureau_directive_no_1523_desc: "국내에서 민족주의가 고조되면서, 왕실까지도 정부 지지를 표명하며 모든 왕실 구성원에게 수입의 10%를 최신 무기 구매를 위하여 기부할 것을 요청했습니다."
 SIA_end_factionalism: "파벌주의 종식"
 SIA_end_factionalism_desc: "혁명 이래 인민당의 군부와 민간 세력 사이의 갈등은 모든 결정에 영향을 미쳐 왔습니다. 두 세력이 충분한 기간 동안 정부를 굳건히 지지하게 만들 수 있다면, 이들을 하나의 단결된 인민당으로 합치고 쿠데타의 그림자를 완전히 걷어낼 수 있을 것입니다."
 SIA_end_factionalism_available_tt: "§Y민간 세력§!과 §Y군부 세력§! 모두 §Y270§!일 연속 §G전적인 지지§! 상태였음."
 SIA_end_factionalism_tt: "인민당 내부의 파벌 경쟁이 종식됩니다:\n   §Y민간 세력§!과 §Y군부 세력§!이 해산되며 §G연합인민당§!이 됩니다\n   국민정신 §Y$idea_SIA_unified_khana_ratsadon$§! 획득"
 SIA_turn_off_the_khana_ratsadon: "인민당이 비활성화됨"
 SIA_factionalism_overcome: "파벌주의가 극복됨"
 SIA_new_territories_administration: "새 영토의 행정"
 SIA_new_territories_administration_tt: "§Y인도차이나§! 영토를 관리하는 결정을 잠금 해제하여 순응도, 산업 및 요새화를 강화합니다."
 SIA_new_territories_administration_desc: "잃어버린 영토를 되찾는 것은 단지 시작일 뿐입니다. 이 영토의 주민들에게 우리가 더 나은 선택임을 보여줘야 합니다. 이 새롭고 더 커다란 [ROOT.GetName] 안에서 모든 시민이 평등함을 느낄 수 있도록, 모두의 생활 수준을 향상시키는 종합 프로그램이 시행될 것입니다."
 SIA_new_territories_administration_available_trigger: "§Y인도차이나§!에 있는 아무 주\n   §Y[ROOT.GetName]§!의 지배하에 있음"
 SIA_industrialization_drive: "산업화 추진"
 SIA_industrialization_drive_desc: "[ROOT.GetName]의 부는 수 세대에 걸쳐 논과 농촌 마을에 기반해 왔습니다. 그러나 현대 세계는 쟁기가 아닌 공장과 기계에 의해 형성되고 있습니다. 강대국들 사이에서 우리의 독립을 유지하려면 농업 왕국을 산업 국가로 변화시켜야 합니다."
 SIA_industrialization_drive_trigger: "§Y인민당§!이 활성화됨"
 SIA_asian_financial_compact: "아시아 금융 협정"
 SIA_asian_financial_compact_desc: "유럽의 자본이 여전히 아시아 무역의 대부분을 장악하고 있으므로, 우리 경제는 외국의 압력에 취약한 상태입니다. 이웃 국가들과 더욱 긴밀한 금융 협력을 모색함으로써 우리는 독립성을 포기하지 않으면서도 신용, 시장 및 투자에 대하여 접근성을 확대할 수 있습니다."
 SIA_revision_of_unequal_treaties: "불평등 조약 개정"
 SIA_revision_of_unequal_treaties_desc: "우리가 약했던 때에 체결된 낡은 협정들은 여전히 외국 세력에 대한 특권을 부여하고 있으며, 이 특권들은 현대 국가라면 용납해서는 안 될 것들입니다. 우리는 이러한 불평등 조약들을 개정하고, 무역, 사법, 이권에 대한 [ROOT.GetNameDef]의 전적인 권한을 회복해야 합니다."
 SIA_renegotiate_teak_control: "티크 목재 통제권 재협상"
 SIA_renegotiate_teak_control_desc: "우리 북부의 삼림 지대는 이권 보유자들에게 부를 안겨주지만, 국가에는 너무나 적은 이익만 돌아갑니다. 티크 목재 통제권을 재협상함으로써 우리는 수익을 되찾고, 벌목을 규제하며, 시암의 목재가 시암의 발전에 기여하도록 보장할 수 있습니다."
 SIA_a_fledgling_tobacco_industry: "신생 담배 산업"
 SIA_a_fledgling_tobacco_industry_desc: "담배는 여전히 규모가 작고, 분산되어 있으며 체계가 잡혀 있지 않은 산업입니다. 적절한 보호와 신중한 투자를 통해 이 소규모 작물은 소비세 수입원, 농촌 소득 증대, 그리고 공장 일자리를 창출하는 안정적인 원천이 될 수 있습니다."
 SIA_a_fledgling_tobacco_industry_tt: "§Y$limited_exports$§! 또는 §Y$closed_economy$§!를 채택할 경우 한 개의 §Y민간공장§!을 얻습니다"
 SIA_all_weather_roads: "전천후 도로"
 SIA_all_weather_roads_desc: "비가 내리면 도로가 너무 많이 유실되어 지방이 수도와 시장으로부터 단절되는 경우가 많습니다. 어떤 기후에서든 이용 가능한 도로망이 왕국을 하나로 묶고 상품과 병력의 이동을 원활하게 할 것입니다."
 SIA_the_bank_of_siam: "시암 은행"
 SIA_the_bank_of_siam_desc: "산업 성장은 관습과 사적인 이익만으로 진행할 수는 없습니다. 강력한 중앙은행은 국가가 신용, 통화 및 자본 순환을 더욱 효과적으로 통제할 수 있도록 해줄 것입니다."
 SIA_thai_rice_company: "타이 미곡회사"
 SIA_thai_rice_company_desc: "쌀은 여전히 [ROOT.GetName]의 생명줄이지만, 쌀 무역은 파편화되고 투기적이며, 외국의 압력에 취약합니다. 국영 미곡 회사를 설립하면 국가가 수출을 지도하고 가격을 안정시키며, 논의 수확물을 더욱 견고한 국력의 기반으로 삼을 수 있을 것입니다."
 SIA_uk_japan_focus_tt: "[ENG.GetNameDef] 및 [JAP.GetNameDef] 중에 선택하며 다음 효과를 받습니다:\n\n§Y[ENG.GetFlag][ENG.GetNameDefCap]§!:"
 SIA_japan_option_tt: "§Y[JAP.GetFlag][JAP.GetNameDefCap]§!"
 SIA_send_bureaucrats_abroad: "해외로 관료 파견"
 SIA_send_bureaucrats_abroad_desc: "다른 국가들은 이미 우리가 지금 필요로 하는 정부 부처, 학교, 기술 서비스를 구축해 놓았습니다. 유능한 관료들을 해외로 파견함으로써 외국의 통치를 도입하지 않고도 행정 경험을 얻을 수 있습니다."
 SIA_baht_stabilization_act: "바트 안정화법"
 SIA_baht_stabilization_act_desc: "현대 경제에는 상인들이 신뢰하고 투자자들이 받아들일 수 있는 통화가 필요합니다. 바트화를 안정시키면 무역의 불확실성을 줄이고 국제 시장에서 [ROOT.GetNameDef]의 입지를 더욱 견고하게 할 것입니다."
 SIA_siamese_development_cooperative: "개발 협동조합"
 SIA_siamese_development_cooperative_desc: "민간 자본은 신중하며, 국가가 모든 것을 단독으로 건설할 수는 없습니다. 국영 개발 협동조합을 설립하면 공동 경제에 도움이 되는 사업을 추진할 수 있도록 공무원, 상인, 토지 소유자들이 자원을 모을 수 있을 것입니다."
 SIA_boon_rawd_brewery: "분 로드 양조회사"
 SIA_boon_rawd_brewery_desc: "국내 양조 산업은 단순한 소비의 문제를 넘어섭니다. 분 로드와 같은 기업들은 시암의 자본, 기계, 그리고 경영 능력이 시암에 현대적인 산업을 창출할 수 있음을 보여줍니다."
 SIA_national_savings_bond: "국가저축채권"
 SIA_national_savings_bond_desc: "국가의 부가 금고와 장식품에 머물러 있고, 도로와 공장이 건설되지 않아서는 안 됩니다. 국가 저축 채권은 민간의 저축을 공공 투자로 전환할 것입니다."
 SIA_national_savings_bond_tt: "$SIA_national_savings_bond$ 정신을 얻습니다. 이 정신은 §Y징병법§!의 강도에 따라 효과가 달라집니다. 징병법이 낮을수록 긍정적인 효과가 강해지고, 징병법이 높을수록 부정적인 효과가 강해집니다.\n\n§Y$disarmed_nation$§!에서는 다음을 얻습니다: "
 SIA_national_savings_bond_scraping_the_barrel: "§Y$scraping_the_barrel$§!에서는 다음을 얻습니다:"
 SIA_national_savings_bond_volunteer_only: "§Y$volunteer_only$§!에서는 다음을 얻습니다:"
 SIA_national_savings_bond_limited_conscription: "§Y$limited_conscription$§!에서는 다음을 얻습니다:"
 SIA_national_savings_bond_extensive_conscription: "§Y$extensive_conscription$§!에서는 다음을 얻습니다:"
 SIA_national_savings_bond_service_by_requirement: "§Y$service_by_requirement$§!에서는 다음을 얻습니다:"
 SIA_national_savings_bond_all_adult_serve: "§Y$all_adults_serve$§!에서는 다음을 얻습니다:"
 SIA_national_savings_bond_current: "현재 동원령은 우리에게 다음을 부여합니다: "
 SIA_deficit_spending: "적자 지출"
 SIA_deficit_spending_desc: "기존의 회계 방식으로는 위험한 세계에 발맞춰 현대적인 경제를 제때 구축할 수 없습니다. 국가는 공공사업과 조달을 통해 산업 성장을 촉진하고, 현재 수입보다 더 많은 금액을 먼저 지출할 의지가 있어야 합니다."
 SIA_deficit_spending_tt: "이 정신이 만료되면 다음을 얻습니다: "
 SIA_acquire_light_tools: "가벼운 도구 획득"
 SIA_acquire_light_tools_desc: "훌륭한 기계를 만들려면, 먼저 산업의 기본적인 도구들부터 제대로 익혀야 합니다. 가벼운 공구와 작업장 장비를 수입하면 [ROOT.GetName] 전역에 소규모 공장과 수리점이 생겨날 것입니다."
 SIA_railway_and_port_extensions: "철도와 항구 연장"
 SIA_railway_and_port_extensions_desc: "쌀, 목재, 주석은 시장에 도달하지 못하면 아무런 소용이 없습니다. 철도를 연장하고 항만을 확장하면 각 지역이 국가의 상업 활동에 참여하고 [ROOT.GetNameDef](을)를 더 넓은 세계와 연결할 것입니다."
 SIA_mechanization_of_agriculture: "농업 기계화"
 SIA_mechanization_of_agriculture_desc: "너무 많은 노동력이 전통적인 농업에 묶여 있어, 산업에 필요한 잉여 노동력이 부족합니다. 농촌에 현대적인 도구와 기계를 도입함으로써 생산량을 늘리고 공장에 투입될 노동력을 확보할 수 있습니다."
 SIA_irrigation: "관개"
 SIA_irrigation_desc: "농민들의 생계는 여전히 홍수와 가뭄에 좌우되고 있습니다. 관개의 확장은 수확량을 안정시키고 경작지를 확대하며 농촌을 더욱 견고한 국가 발전의 기반으로 만들 것입니다."
 SIA_siam_cement_group: "[ROOT.GetName] 시멘트 그룹"
 SIA_siam_cement_group_desc: "왕실의 후원 아래 설립된 [ROOT.GetName] 시멘트 그룹은 [ROOT.GetNameDef]의 가장 중요한 산업 기업 중 하나입니다. 집중적인 투자와 정부의 지원을 통해 이 기업은 단순한 국내 공급업체를 넘어 더 넓은 산업 역량의 초석이 되어, 말 그대로 국가의 미래를 위한 기반을 마련할 수 있습니다."
 SIA_chemical_imports: "화학물질 수입"
 SIA_chemical_imports_desc: "현대의 농업과 산업은 모두 우리가 아직 충분히 생산하지 못하는 화합물에 의존하고 있습니다. 국내 산업이 이러한 요구를 충족할 수 있을 때까지는 화학 물질을 수입하여 비료, 의약품, 염료 및 폭발물을 공급해야 합니다."
 SIA_chemical_imports_tt: "이 중점이 완료되었을 때 의견이 §Y[?var:ROOT.SIA_chemical_imports_opinion_threshold]§!보다 높으면 오프맵 §Y민간공장§!이 §G+1§!개 추가됩니다."
 INS_chemical_imports_stolen_tt: "이 중점이 완료되었을 때 의견이 §Y75§!보다 높으면 보병 장비 §G[?var:ROOT.INS_guns_from_seek_help_focus]§!개가 추가됩니다."
 SIA_foreign_currency_exchange: "외환 거래"
 SIA_foreign_currency_exchange_desc: "산업화에는 외국산 기계, 의약품, 연료가 필요하지만, 이러한 것들은 부족한 외환으로만 구매할 수 있습니다. 통제된 외환 거래 시스템은 외국 자금을 국가에 가장 중요한 산업으로 유도할 것입니다."
 SIA_farmers_into_the_city: "농민의 도시 유입"
 SIA_farmers_into_the_city_desc: "현대 경제는 농촌에서의 노동만으로는 유지될 수 없습니다. 산업이 확장됨에 따라 국가는 농촌에서 도시로의 질서 있는 인구 이동을 장려해야 하며, 이를 통해 새로운 도시 노동력이 형성될 수 있습니다."
 SIA_textile_mills: "직물 공장"
 SIA_textile_mills_desc: "옷감은 일상 필수품이지만, 너무 많은 양이 해외에서 생산되어 우리에게 팔리고 있습니다. 직물 공장은 수입품을 대체하고 도시 노동자들을 고용하며 [ROOT.GetNameDef]에 현대 생활의 기초 산업 하나를 마련해 줄 것입니다."
 SIA_public_credit: "공공 신용"
 SIA_public_credit_desc: "상인, 재배자, 제조사 모두 자본에 대한 접근성이 부족하여 제약받고 있습니다. 공공 신용을 확대함으로써 정부는 민간 금융이 주저하는 곳에 대출을 제공하고 소외된 부문의 개발을 추진할 수 있습니다."
 SIA_public_credit_trigger: "$idea_SIA_public_credit_debt$(이)가 §Y180일§! 이상 활성화됨"
 SIA_a_modern_economy: "현대적 경제"
 SIA_a_modern_economy_desc: "낡은 농업 질서가 하루아침에 사라지지는 않겠지만, 더 이상 [ROOT.GetNameDef]의 미래를 규정할 수는 없습니다. 은행, 학교, 공장, 기반시설이 형성되면서 우리는 독립적인 현대 국가에 걸맞은 경제를 구축하기 시작했습니다."
 SIA_reduction_of_agricultural_yield_taxes: "농업 수확세 감면"
 SIA_reduction_of_agricultural_yield_taxes_tt: "$idea_SIA_agricultural_tax_reduction$에서 얻는 §Y소비재§!가 매달 §Y[?var:SIA_agricultural_tax_reduction_cg_decrease_rate|%]§! 감소하며, §Y안정도§!가 매달 §Y[?var:SIA_agricultural_tax_reduction_stability_gain|%]§! 증가합니다. 이것은 §Y소비재§! 불이익이 §Y0%§!에 도달할 때까지 지속됩니다.\n\n국민정신 제거 시 획득:\n"
 SIA_reduction_of_agricultural_yield_taxes_desc: "농민들에게 왕국을 먹여 살리고, 국가 재정을 충당하며, 온갖 고난을 구제책 없이 견뎌내라고 요구할 수는 없습니다. 농업 수확물에 대한 세금을 감면한다면 농촌에 더 많은 잉여 생산물을 남길 수 있고, 농민들의 충성심을 강화하며, 토지의 생산성을 높일 수 있습니다."
 SIA_fuel_oil_act: "연료유법"
 SIA_fuel_oil_act_desc: "현대의 교통, 산업, 국방은 모두 연료에 의존하지만, 전쟁이 발생하면 연료 공급이 제한될 수 있습니다. 연료유 관련 법안은 소비, 저장, 비상 배급을 국가가 강력하게 감독하여 부족한 연료가 낭비되지 않게 할 것입니다."
 SIA_siam_electricity_company: "시암 전기회사"
 SIA_siam_electricity_company_desc: "전력이 안정적으로 공급되지 않으면 어떤 경제도 현대의 부담을 견딜 수 없습니다. 시암 전기회사를 강화하면 발전을 연장하고 협력을 개선하며 역경 속에서도 작업장, 창고, 도시가 계속 전력을 공급받도록 할 수 있습니다."
 SIA_revise_the_taxation_system: "과세제도 개선"
 SIA_revise_the_taxation_system_desc: "현재의 세금 구조는 위기와 자급자족을 준비하는 국가에 충분한 도움을 줄 수 없습니다. 개정된 제도는 세금을 더 고르게 징수하고 낭비를 줄이며 국방과 개발의 부담을 더 효율적으로 배분할 것입니다."
 SIA_census_the_hill_tribes: "고산족 인구 조사"
 SIA_census_the_hill_tribes_desc: "고산 지대에는 여전히 행정, 과세 및 물자 공급이 완전히 이루어지지 않고 있습니다. 제대로 된 인구 조사를 통해 정부는 이러한 지역을 더욱 효과적으로 통치하고 그 주민과 자원을 국가 전체의 생활에 편입시키는 데 필요한 정보를 얻을 수 있을 것입니다."
 SIA_increase_rice_exports: "쌀 수출 증가"
 SIA_increase_rice_exports_desc: "쌀은 [ROOT.GetNameDef](이)가 이용할 수 있는 가장 확실한 외화 수입원입니다. 시장이 개방되어 있는 동안 수출을 확장함으로써 외환보유고를 늘리고 전략적 수입에 필요한 자금을 조달하며 앞으로 발생할 수 있는 혼란에 대응할 자금을 준비할 수 있습니다."
 SIA_pad_thai: "팟타이"
 SIA_pad_thai_desc: "현대 국가는 정부 부처와 공장뿐 아니라, 국민을 하나로 묶는 공통된 생활 습관에 의해 유지됩니다. 시암의 식재료를 활용한 국가적인 쌀 요리를 장려함으로써 국내 소비를 촉진하고, 농민을 지원하며, 불확실한 시대에 외국 음식에 대한 의존도를 줄일 것입니다."
 SIA_rice_husk_steam_turbines: "왕겨 증기 터빈"
 SIA_rice_husk_steam_turbines_desc: "외국인들은 쓰레기라고 생각하지만, 필요하다면 귀중한 자원이 됩니다. 왕겨를 태워 증기를 발생시킴으로써, 우리는 우리 수확물에서 에너지를 얻고 수입 석탄과 석유에 대한 의존도를 줄일 수 있습니다."
 SIA_domestic_tin_smelters: "국내 주석 제련소"
 SIA_domestic_tin_smelters_desc: "이제는 단순히 땅에서 광석을 캐내어 해외로 수출하는 것만으로는 충분하지 않습니다. 국내에 주석 제련소를 건설함으로써, 우리는 우리 자원의 가치를 국내에 더 많이 유지하고 상업과 전쟁 모두에 필수적인 산업용 금속을 확보할 수 있습니다."
 SIA_use_ships_as_generators: "함선을 발전기로 사용"
 SIA_use_ships_as_generators_tt: "우리 소유의 §Y주력함§!을 §Y핵심 주 항구§!에 배치하면 공장 에너지 소비량에 §G주력함§! 한 척당 §Y-2%§!의 감소 혜택이 적용되며, 최대 §G-15%§!까지 감소합니다.\n\n해당 함선들이 항구를 떠나면 혜택이 그만큼 감소하며, 다시 항구에 배치하여 혜택을 회복할 수 있습니다."
 SIA_use_ships_as_generators_desc: "함선이 오래되어 전투나 무역에 더 이상 적합하지 않게 되어도, 여전히 국가에 도움이 될 수 있습니다. 함선을 수상 발전소로 활용함으로써 항구와 연안의 산업에 비상 전력을 공급하고 귀중한 연료와 기반시설을 보존할 수 있습니다."
 SIA_diversity_foreign_reserves: "외환보유고 다변화"
 SIA_diversity_foreign_reserves_desc: "[ROOT.GetNameDef]의 재정 안전을 특정 외국의 통화나 신용에 의존하는 것은 위험합니다. 외환보유고를 다변화함으로써 외부 충격의 위험을 줄이고 무역과 외교에서 더 큰 행동의 자유를 확보할 수 있습니다."
 SIA_diversity_foreign_reserves_tt: "전쟁 발발 시 §G2§!개의 오프맵 §Y군수공장§!이 추가됩니다.\n전쟁 발발 시 무작위 핵심 주에 §G8§!의 강철 생산이 추가됩니다."
 SIA_exclusivity_resource_contract: "독점 자원 계약"
 SIA_exclusivity_resource_contract_desc: "하나의 외국 파트너가 자본을 제공하고 구매를 보장하는 대가로, 우리 자원에 대한 특권적 접근권을 확보합니다. 이러한 독점 계약은 개발을 가속할 수 있지만, [ROOT.GetNameDef]의 미래의 일부를 다른 나라의 이해관계에 종속시키는 결과를 초래할 수 있습니다."
 SIA_maintain_resource_independence: "자원 독립성 유지"
 SIA_maintain_resource_independence_desc: "해외 계약은 단기적인 이익을 가져다줄 수 있지만, 그 대가로 의존성이 커지게 됩니다. 자원을 스스로 통제함으로써 우리는 외국의 요구가 아닌 시암의 필요에 따라 자원을 운용할 자유를 유지할 수 있습니다."
 SIA_kasetsart_university: "까셋삿 대학"
 SIA_kasetsart_university_desc: "농업의 생산성을 높이려면 단순히 전통 농법에만 의존하지 않고, 과학에 기반해야 합니다. 까셋삿 대학은 농업 전문가, 수의사, 그리고 농토 현대화를 위한 기술 전문가를 양성할 것입니다."
 SIA_mahidol_university: "마히돌 대학"
 SIA_mahidol_university_desc: "현대 국가는 군인과 공학자만큼이나 의사, 연구자, 행정가를 필요로 합니다. 마히돌 대학은 고등 교육을 강화하고 국가 개혁에 필요한 인재를 양성할 것입니다."
 SIA_silpakorn_university: "실라빠껀 대학"
 SIA_silpakorn_university_desc: "TODO_CM"
 SIA_contingency_funds: "비상 자금"
 SIA_contingency_funds_desc: "평화로운 시기의 번영은 국가가 대비하지 못한 위기에 마주치면 별 가치가 없게 됩니다. 지금 비상 자금을 확보해 두면 봉쇄, 흉작 또는 갑작스러운 전쟁으로 인해 정부 기능이 즉시 마비되는 사태를 미리 막을 수 있습니다."
 SIA_contingency_funds_tt: "평화로운 시기에 비상 자금을 모아 둡니다. 이 자금을 모으는 동안 적당량의 §Y소비재 생산 변동치§!를 얻게 됩니다.\n\n전시에는 원할 경우 이 자금을 사용할 수 있으며, 이를 통해 막대한 생산 혜택을 얻을 수 있습니다.\n자금의 지속 기간은 사용 전에 자금을 모은 기간에 따라 결정됩니다."
 SIA_prepare_for_the_next_blockade: "다음 봉쇄 대비"
 SIA_prepare_for_the_next_blockade_desc: "바다에 적이 있으면 [ROOT.GetNameDef](은)는 시장, 기계, 연료로부터 차단될 수 있습니다. 따라서 우리는 궁지에 몰리기 전에 미리 다음 봉쇄에 대비하여 비축물자, 비상 계획, 대체 물자를 지금부터 준비해야 합니다."
 SIA_domestic_arms_industry: "국내 군수산업"
 SIA_domestic_arms_industry_desc: "모든 소총과 포탄을 수입해야 하는 왕국은 안전하다고 할 수 없습니다. 비록 시작은 소박할지라도, 국내 군수산업은 [ROOT.GetNameDef]의 병사들을 자국의 작업장에서 생산한 무기로 무장시키고 해외 공급이 중단될 때도 버틸 수 있게 해 줄 것입니다."
 SIA_war_material_substitutions: "전쟁 물자 대체"
 SIA_war_material_substitutions_desc: "봉쇄 상황에서는 이상적인 물자보다 구할 수 있는 물자가 더 가치가 있습니다. 외국의 물자가 더 이상 국내에 들어오지 않더라도 생산이 지속될 수 있도록 금속, 화학 물질 및 수입 부품의 대체재를 연구해야 합니다."
 SIA_royal_thai_ordnance_factory: "왕립 타이 조병창"
 SIA_royal_thai_ordnance_factory_desc: "수입한 무기와 분산된 수리 시설만으로는 안전한 국가를 만들 수 없습니다. 왕립 타이 조병창은 왕실의 감독 아래 기술, 설비, 그리고 철저한 감독을 집중시켜 [ROOT.GetNameDef]에 무기와 탄약 제조를 위한 항구적인 중심지를 구축할 것입니다."
 SIA_built_to_withstand_every_flame: "모든 화재에 대한 내화 건축"
 SIA_built_to_withstand_every_flame_desc: "공장이 하룻밤 사이에 불타버리면 아침에 나라를 위해 제 기능을 할 수 없습니다. 우리의 창고, 공장, 작업장은 분산 배치, 방화 조치 및 비상 보호 기능을 고려하여 건설되어야 하며, 그래야만 파괴 공작, 폭격 또는 사고로 인해 생산이 쉽게 마비되지 않도록 할 수 있습니다."
 SIA_the_army_of_siam: "시암 육군"
 SIA_the_army_of_siam_desc: "우리 군대의 낡은 구조는 더 이상 시대적 요구에 부응하지 못합니다. [ROOT.GetName](이)가 주권을 지키고 해외에서 자국의 이익을 증진시키려면, 전 세계에서 일어날 전쟁에 대비하여 장비와 훈련, 조직력을 갖춘 새롭고 현대적인 군대를 건설해야 합니다."
 SIA_plan_for_a_short_war: "단기전 계획"
 SIA_plan_for_a_short_war_desc: "우리의 자원은 한정되어 있고 적은 많을 수 있습니다. [ROOT.GetNameDefCap](은)는 장기적인 소모전을 감당할 능력이 없습니다. 전쟁이 일어난다면, 적이 전력을 집중하기 전에 신속하고 결정적으로 끝내야 합니다."
 SIA_intermediate_war_preparation: "중기전 준비"
 SIA_intermediate_war_preparation_desc: "신속하게 끝내는 작전만 준비하는 것은 위험하지만, 끝없는 전투에 전력을 쏟아붓는 것 또한 비효율적입니다. 균형 잡힌 교리는 [ROOT.GetName](이)가 강력한 공격을 펼치는 동시에 더욱 완강한 적을 상대할 수 있는 지구력을 유지할 수 있도록 해줍니다."
 SIA_prepare_for_a_long_war: "장기전 계획"
 SIA_prepare_for_a_long_war_desc: "강대국들은 몇 달 만에 전쟁의 승패를 결정지을 수 있지만, 약소국들은 대개 수년간의 전쟁을 견뎌내야 합니다. 따라서 우리는 용기만큼이나 인내와 회복력이 중요한 장기전에 대비하여 [ROOT.GetAdjective]의 무기, 산업, 수송망을 준비해야 합니다."
 SIA_specialized_warfare: "특수전"
 SIA_specialized_warfare_desc: "획일적인 육군은 우리 지역의 지형에 적합하지 않습니다. 산악 지대, 정글, 강 유역 등 각기 다른 지형에서는 각기 다른 기술이 요구됩니다. 특수화된 병력을 양성함으로써, [ROOT.GetNameDef](은)는 모든 전장에서 적절한 전력으로 적과 맞설 수 있습니다."
 SIA_artillery_reigns_supreme: "포병의 전성기"
 SIA_artillery_reigns_supreme_desc: "현대전은 정신력만으로는 승리할 수 없습니다. 포는 여전히 전장의 왕이며, 요새를 무너뜨리고, 적의 공격을 깨부수며, 보병의 진격로를 열어줍니다. 우리가 승리하려면 [ROOT.GetAdjective]의 화력을 충분히 확보하고, 동시에 정밀하게 운용해야 합니다."
 SIA_yield_the_air_war: "공중전 포기"
 SIA_yield_the_air_war_desc: "우리는 하늘에서 강대국들과 대등하게 맞설 수 없습니다. 승산이 없는 경쟁에 귀중한 자원을 낭비하기보다는, 대공 방어를 강화하여 적 항공기가 아무런 대가를 치르지 않고 우리 병력과 도시를 공격하는 일이 없게 해야 합니다."
 SIA_the_thunder_at_the_gates: "문 앞의 천둥"
 SIA_the_thunder_at_the_gates_desc: "일반 대포로는 무너뜨릴 수 없는 요새들이 있고, 압도적인 힘으로 개시를 선언해야 하는 공격도 있습니다. 중포, 공성포, 그리고 철도포는 우리의 자제력을 약점으로 오인하는 적의 성문을 부술 강한 위력을 [ROOT.GetNameDef]에게 제공할 것입니다."
 SIA_night_time_training: "야간 훈련"
 SIA_night_time_training_desc: "이미 준비된 적에게 대낮에 대담한 공격을 가하는 것은 재앙을 초래할 뿐입니다. 우리 병사들에게 어둠을 틈타 침투, 이동, 공격하는 훈련을 시킴으로써, 적이 시야가 가려지고 혼란에 빠져 우리에게 대응할 준비가 가장 안 되어 있을 때 주도권을 빼앗을 수 있습니다."
 SIA_steel_arteries: "강철의 동맥"
 SIA_steel_arteries_desc: "육군이 먼 거리를 이동하기 위해서는 철도와 도로가 꼭 필요합니다. 국가의 철도망을 강화하여 병력, 보급품, 무기를 위협받는 모든 국경으로 신속하게 수송할 수 있도록 해야 합니다. 이 사업에서 군사 안보와 국가 발전은 불가분의 관계에 있습니다."
 SIA_prepare_northern_infrastructure_for_war: "북부 기반시설 전시 준비"
 SIA_prepare_northern_infrastructure_for_war_desc: "버마와 그 뒤에 있는 세력과 맞서게 될 경우, 북부 방면은 핵심적인 요충지가 될 것입니다. 해당 지역의 도로, 철도 및 보급창을 즉시 확장하여, [ROOT.GetAdjective] 병력이 지체 없이 진격하거나 저항할 수 있도록 해야 합니다."
 SIA_unconventional_tank_construction: "변칙적인 전차 생산"
 SIA_unconventional_tank_construction_desc: "우리는 강대국들의 기갑 계획을 하나하나 모방할 수는 없습니다. [ROOT.GetNameDef](이)가 전차를 실전에 투입해야 한다면, 웅장함보다는 수량과 실용성을 우선시하여 더 저렴하고 유연한 생산 방식을 추구해야 합니다."
 SIA_conventional_tank_construction: "통상적인 전차 생산"
 SIA_conventional_tank_construction_desc: "기갑은 현대전에서 인정받는 전력이 되었으며, 임시방편적인 해결책으로는 더 이상 버틸 수 없습니다. 따라서 우리는 현대 육군에 걸맞은 건전한 원칙, 표준적인 설계, 그리고 신뢰할 수 있는 생산 방식을 기반으로 하는 제대로 된 전차 산업을 구축해야 합니다."
 SIA_reverse_engineer_allied_tanks: "동맹국 전차 역설계"
 SIA_reverse_engineer_allied_tanks_desc: "실험에 드는 비용은 이미 다른 국가들이 치렀습니다. 노획한 전차와 수입한 장비를 분해하고 연구하여 모방할 수 있습니다. 외국 설계에서 배우면 [ROOT.GetName]의 기갑 전력 구축에 걸리는 시간을 단축할 수 있을 것입니다."
 SIA_tankettes: "탱켓"
 SIA_tankettes_desc: "가볍고 저렴하며 생산이 간단한 탱켓은 대규모 전투의 승패를 좌우할 수는 없지만 정찰, 식민지 전쟁, 보병 지원 등에서 충분히 도움이 됩니다. 재력이 부족한 국가에 이러한 소형 기갑 차량은 기계화 전쟁에 진입할 수 있는 실용적인 수단입니다."
 SIA_jungle_armor: "정글 기갑"
 SIA_jungle_armor_desc: "우리 지역의 정글은 유럽의 평원을 위해 설계된, 크고 무거운 기계가 다니기 좋은 환경이 아닙니다. [ROOT.GetNameDef]에서 기갑이 제 역할을 하려면 좁은 길, 험준한 지형, 그리고 숨 막히는 기후에 적응해야 하며, 정글에서 요구되는 기동성을 확보하기 위해 무게를 희생해야 합니다."
 SIA_mountain_tanks: "산악전차"
 SIA_mountain_tanks_desc: "험준한 언덕과 산길을 보병에게만 맡겨둘 수는 없습니다. 험난한 지형에 적합한 소형 기갑 차량을 개발하면, 우리 육군이 일반 전차가 도달하기 어려운 지역에도 안전하게 화력을 배치할 수 있게 될 것입니다."
 SIA_reluctant_submission: "마지못한 항복"
 SIA_reluctant_submission_desc: "[ROOT.GetNameDef](이)가 더 강한 적에게 침략당한다면, 공공연한 저항은 파멸만을 가져올 수도 있습니다. 굴복하는 것은 쓰라린 일이지만, 때로는 국가를 파멸로부터 지켜내고 더 유리한 시기를 기다리기 위해 정부가 양보해야 합니다."
 SIA_reluctant_submission_trigger: "이 중점은 공격받고 §Y항복§! 옵션을 선택하면 자동으로 완료됩니다."
 SIA_reluctant_submission_tt: "우리는 공격해 오는 강대국과 평화 협정을 맺을 수 있습니다. 하지만 그들은 대가로 우리가 화폐를 발행해 주기를 기대할 것입니다.\n우리의 §Y소비재 공장 변동치§!는 매달 §Y[?idea_SIA_printing_money_monthly_change|%]§!씩 증가하며, 최대 §Y[?idea_SIA_printing_money_monthly_change_max|%]§!까지 증가합니다.\n\n§Y$SIA_thai_rice_company$§! 중점을 택하면 증가율이 §G50%§! 감소합니다.\n\n§Y$SIA_demand_repatriation$§! 중점을 택하면 화폐를 발행할 필요가 없어집니다."
 SIA_seri_thai: "자유 타이 운동"
 SIA_seri_thai_desc: "항복한다고 하여 국민정신마저 포기할 필요는 없습니다. 겉으로는 점령과 순응이 이루어지는 것처럼 보이면서, 지하에서는 충성스러운 조직을 만들어 독립의 대의를 지키고 정보를 수집하며 [ROOT.GetName](이)가 일어서는 날을 준비할 수 있습니다."
 SIA_contact_the_south_east_asia_command: "동남아시아 사령부와 접촉"
 SIA_contact_the_south_east_asia_command_desc: "저항이 그저 용감한 행동에 그치지 않게 하려면, 그 저항을 더 광범위한 전략과 연계해야 합니다. 동남아시아의 연합국 사령부와 접촉함으로써, [ROOT.GetName]의 애국자들은 지침과 물자를 얻고 더 큰 투쟁에 참여할 수 있게 될 것입니다."
 SIA_broadcast_weather_reports_to_the_allies: "연합국에 기상 정보 방송"
 SIA_broadcast_weather_reports_to_the_allies_desc: "이 지역의 하늘과 바다는 날씨의 영향을 많이 받으며, 함대와 육군 역시 그렇습니다. [ROOT.GetNameDef]에서 제공되는 신뢰할 수 있는 보고는 연합국의 계획 수립을 돕고, 작전 중에 기습 공격을 받지 않도록 하며, 전쟁에서 우리 조국을 조용하지만, 귀중한 파트너로 만들어 줄 것입니다."
 SIA_american_investment_aid: "미국 투자 원조"
 SIA_american_investment_aid_desc: "미국은 우리 지역에서는 얻을 수 없는 막대한 부를 소유하고 있습니다. 만약 우리가 미국의 원조와 투자를 확보하여 우리의 비밀 작전과 국가적 노력에 힘을 보탤 수 있다면, [ROOT.GetNameDef](은)는 고난을 견뎌내고 해방을 준비하기 위한 물질적 수단을 얻게 될 것입니다."
 SIA_thai_students_in_the_oss: "OSS의 타이 생도"
 SIA_thai_students_in_the_oss_desc: "해외에서 애국심 넘치는 신세대 젊은이들에게 첩보, 사보타주 및 비정규전 기술을 훈련시킬 수 있습니다. 신뢰할 수 있는 태국 학생들을 연합군 정보망과 접촉시키며, 우리는 다가올 은밀한 전쟁에서 활약할 유능한 인재를 양성할 수 있을 것입니다."
 SIA_prepare_to_drop: "강하 준비"
 SIA_prepare_to_drop_desc: "해방의 때가 오면 연합군은 하늘에서 우리 조국으로 내려오려 할 수도 있습니다. 그러므로 우리는 공수부대를 맞이하고 가장 필요한 곳으로 유도할 수 있도록, 미리 착륙 가능 지점을 파악하고, 연락책을 준비하며, 지원망을 조직해야 합니다."
 SIA_unseat_the_government: "정부 타도"
 SIA_unseat_the_government_desc: "[ROOT.GetNameDef](을)를 외국의 지배에 굴복시킨 정권은 존속해서는 안 됩니다. 저항과 책략, 그리고 시기에 맞는 행동을 통해 우리는 국가를 위태롭게 한 자들을 제거하고 시암에 더 적절한 정부로 재건할 수 있을 것입니다."
 SIA_unseat_the_government_tt: "[ROOT.GetName](은)는 현재 소속된 세력을 떠나 전쟁에서 편을 바꾸어 §Y연합국§!에 합류할 것입니다.\n\n충성파는 이러한 변화에 반발하여 내전을 일으킬 것입니다.\n\n우리의 총합 지지도가 §Y80%를 넘으면§! 정부를 축출하고 내전을 피하게 됩니다. 우리의 총 지지도는 설득된 장군 한 명당 §Y5%§!씩을 민주주의 지지도에 추가한 값입니다.\n\n현재 설득된 장군들로부터 얻는 우리의 지지도는 §Y[?var:SIA_seri_thai_cw_scale|%]§!이며, 민주주의 지지도는 §Y[?var:party_popularity@democratic|%]§!입니다."
 SIA_choose_new_leader_tt: "구정권이 무너진 지금, 승자들은 새 정부를 이끌 사람을 선택해야 합니다."
 SIA_the_phayap_army: "파얍군"
 SIA_the_phayap_army_desc: "만약 우리가 침략자와 동맹을 맺는다면, 우리 군대도 새로운 전쟁 질서 속에서 자리를 잡아야 합니다. 서쪽과 북쪽에서의 작전을 위한 전담 야전 사령부를 설치하면, [ROOT.GetName](은)는 강력한 동맹국과 함께 진격하여 자체적인 이득을 추구할 수 있을 것입니다."
 SIA_securing_the_rubber_islands: "고무 제도 확보"
 SIA_securing_the_rubber_islands_desc: "고무는 현대 전쟁의 생명줄이며, 타이어, 밀봉, 그리고 수많은 기계화 무기에 필수적입니다. 남쪽의 자원이 풍부한 지역은 기회인 동시에 반드시 확보해야 할 대상입니다. 우리는 다른 국가보다 먼저 이 지역을 확보해야 합니다."
 SIA_breaking_the_burmese_line: "버마 전선 돌파"
 SIA_breaking_the_burmese_line_desc: "우리의 야망은 버마와 그 너머의 땅까지 뻗쳐 있지만, 버마가 이를 막고 있습니다. [ROOT.GetAdjective]의 무기가 그 가치를 증명하려면 결단력과 계획, 그리고 집중적인 무력 사용으로 버마의 방어선을 무너뜨려야 합니다."
 SIA_pacific_war: "태평양 전쟁"
 SIA_pacific_war_desc: "동아시아의 분쟁은 더 이상 남의 일로 치부할 수 없습니다. 태평양 전쟁은 우리 지역의 모든 국가의 운명을 결정하고 있으며, [ROOT.GetNameDef](은)는 그 전쟁에서 추종자, 협력자, 희생자 중 무엇이 될 것인지를 스스로 결정해야 합니다."
 SIA_joint_asian_military_command: "아시아 합동 군사령부"
 SIA_joint_asian_military_command_desc: "이 지역의 파트너들과 협력한다면 우리의 노력은 더욱 강화될 것입니다. 공동 지휘 구조는 효율성을 높이고, 계획을 명확히 하며, 경쟁과 혼란으로 인해 낭비될 수 있는 작전에 공통된 방향을 제시할 것입니다."
 SIA_demand_repatriation: "송환 요구"
 SIA_demand_repatriation_desc: "필요성이라는 구실로 우리 땅에 들어온 자들은 [ROOT.GetNameDef]에 빚을 지게 되었습니다. 우리의 형편이 나아지면, 우리는 빼앗긴 것을 돌려달라고 요구하고 점령자가 그들의 침략으로 인한 비용을 갚도록 압박해야 합니다."
 SIA_standing_our_ground: "입장 고수하기"
 SIA_standing_our_ground_desc: "이제 후퇴와 협상은 더 큰 굴욕만을 안겨줄 뿐입니다. [ROOT.GetNameDefCap](은)는 계속해서 맞서 싸우고, 무력으로 우리의 운명을 좌우하려 드는 자들을 몰아낼 의지가 있음을 보여줘야 합니다."
 SIA_standing_our_ground_trigger: "이 중점은 공격받고 §Y저항§! 옵션을 선택하면 자동으로 완료됩니다."
 SIA_ask_for_the_release_of_american_commodities: "미국산 물품의 개방 요청"
 SIA_ask_for_the_release_of_american_commodities_desc: "미국의 비축 물자, 기계, 그리고 물자는 우리 국가에 숨통을 트여줄 수 있습니다. 신중한 외교를 통해 이러한 물품들의 공급을 요청함으로써 물자 부족을 완화하고 전쟁 수행의 물질적 기반을 강화할 수 있습니다."
 SIA_japanese_fighters: "일본 전투기"
 SIA_japanese_fighters_desc: "우리의 항공 산업이 아직 미약하지만, 외국 항공기가 그 공백을 메워줄 수 있을 것입니다. 일본의 전투기를 [ROOT.GetAdjective]에 도입한다면, 우리의 산업적 약점으로 인해 한도가 있을지라도 최소한 현대적인 공군력을 확보할 수 있을 것입니다."
 SIA_get_off_our_shores: "우리 해안에서 나가라"
 SIA_get_off_our_shores_desc: "시암의 땅에 외국 군대가 주둔하는 것은 어떤 핑계로도 누그러뜨릴 수 없는 모욕입니다. 무력을 사용하든 해외 정세의 압력을 이용하든, 우리는 침략자를 우리 해안에서 몰아내고 [ROOT.GetNameDef]의 존엄성을 되찾아야 합니다.\n\n그들은 모든 잔인한 자들이 그렇듯 비겁한 겁쟁이입니다. 이제 우리 해안에서 물러나게 해야 합니다."
 SIA_singaporean_reinforcements: "싱가포르 증원"
 SIA_singaporean_reinforcements_desc: "말라야와 그 너머에서의 투쟁은 우리 안보와 밀접한 관계가 있습니다. 싱가포르 주변에 집결하고 있는 병력으로부터 증원군을 얻으면 우리의 전선을 강화하고 연합국과의 협력을 확대하며 공동의 목표 아래 전구를 결속시킬 수 있을 것입니다."
 modify_SIA_directorate_of_aeronautical_engineering: "§Y항공공학부§! 변동치:"
 SIA_aid_for_resources: "자원 원조"
 SIA_aid_for_resources_desc: "우리 국가는 외국이 탐내는 자원을 보유하고 있으며, 우리에게 부족한 특정 도구는 외국이 제공할 수 있습니다. 자원을 제공하고 원조를 받는 신중한 교환을 통해 [ROOT.GetNameDef]의 물자 공급을 유지하는 데 도움이 될 뿐만 아니라, 우리의 부가 자국의 존속에 기여하도록 보장할 것입니다."
 SIA_aid_for_resources_tt: "우리는 §Y[724.GetName]§!의 고무 자원 채굴권을 대가로 제공하는 조건으로, [JAP.GetNameDef]에 우리의 전쟁에 동참해 줄 것을 요청할 것입니다."
 SIA_how_quickly_the_tables_turn: "상황이 역전되는 속도"
 SIA_how_quickly_the_tables_turn_desc: "한때 [ROOT.GetNameDef](을)를 약하고 순종적이라고 여겼던 자들은 이제 상황이 역전되었음을 알아차리게 될 수도 있습니다. 전쟁에서의 운명은 빠르게 바뀌므로, 우리는 억압자들이 흔들리고 마침내 전세가 그들에게 불리하게 돌아가는 순간을 포착할 준비가 되어 있어야 합니다."
 SIA_how_quickly_the_tables_turn_trigger: "우리는 강대국의 공격을 받았고, 그 강대국에 항복했습니다."
 SIA_royal_thai_navy: "왕립 타이 해군"
 SIA_royal_thai_navy_desc: "[ROOT.GetNameDef]의 방어는 해안선에서 끝나지 않습니다. 우리의 해안, 강, 그리고 해상 무역에는 왕국에 걸맞은 함대가 필요합니다. 왕립 타이 해군을 강화함으로써 우리는 시암이 자국 해역의 주인으로 남을 수 있도록 할 것입니다."
 modify_royal_thai_navy: "§Y$idea_SIA_thai_royal_navy$§! 변동치:"
 SIA_direct_army_fundings_towards_the_navy: "육군 재정을 해군에 전용"
 SIA_direct_army_fundings_towards_the_navy_desc: "육군은 오랫동안 군사비 지출의 대부분을 차지해 왔지만, [ROOT.GetNameDef]의 전략적 필요는 대륙에만 국한되어 있지 않습니다. 함대 쪽으로 예산을 돌리면, 이러한 불균형을 바로잡고 해역을 확보하여 우리의 상업과 해안을 보호할 수 있습니다."
 SIA_thonburi_class_coastal_defense_ship: "톤부리급 해방전함"
 SIA_thonburi_class_coastal_defense_ship_desc: "소규모 함대라도 현지 상황에 맞게 적절히 설계된다면 강력한 전투력을 발휘할 수 있습니다. 톤부리급 함선은 우리가 가장 시급히 보호해야 할 해역에 적합한 역할과 상당한 화력을 결합하여, [ROOT.GetNameDef]에 실질적인 해안 방어 수단을 제공합니다."
 SIA_acquire_submarines: "잠수함 획득"
 SIA_acquire_submarines_desc: "잠수함은 소규모 해군에게 체급에 비해 강력한 공격을 가할 기회를 제공합니다. 수면 아래에 숨어 해운을 위협하고, 더 강력한 함대를 저지하며, 우리 해안에 대한 적대적 계획을 방해할 수 있습니다. 따라서 [ROOT.GetNameDefCap](은)는 이러한 무기를 간과해서는 안 됩니다."
 SIA_submarine_day: "잠수함의 날"
 SIA_submarine_day_desc: "우리 함대에 해저전 전술을 도입한 것은 국민의 인정과 환영을 받을 만한 일입니다. 잠수함 전력을 기념함으로써 모병을 장려하고, 위상을 높이며, 시암이 새로운 해군 시대로 접어들고 있다는 인식을 대중에게 심어줄 수 있습니다."
 SIA_the_thonburi_dockyard_project: "톤부리 조선소 프로젝트"
 SIA_the_thonburi_dockyard_project_desc: "수입된 함선만으로는 해군을 유지될 수 없습니다. [ROOT.GetNameDef](이)가 해군력을 유지하고 확장하려면 해군력의 진정한 기반이 되는 조선소, 작업장, 그리고 노동력에 투자해야 합니다."
 SIA_expand_the_slipways: "조선대 확장"
 SIA_expand_the_slipways_desc: "우리의 현재 시설은 현재 구상 중인 목표를 달성하기에는 너무 협소합니다. 선박 건조 및 수리 시설을 확장함으로써 함대의 규모와 준비 태세를 강화할 수 있을 것입니다."
 SIA_a_new_drydock: "새로운 건선거"
 SIA_a_new_drydock_desc: "본격적인 함선 정비에는 현대적인 건선거가 필수적입니다. 건선거가 없으면 대형 함선의 정비는 느리고 비효율적이며 외국의 지원에 의존하게 됩니다. 새로운 건선거는 [ROOT.GetNameDef] 해군의 미래를 더욱 확실하게 확보하도록 해줄 것입니다."
 SIA_install_heavy_cranes_and_power_plant: "대형 크레인 및 발전소 설치"
 SIA_install_heavy_cranes_and_power_plant_desc: "함선 건조는 단순히 목재와 철강의 문제가 아니라 기계와 동력의 문제입니다. 대형 크레인과 안정적인 전력 공급은 조선소를 조잡한 시설에서 현대 산업의 적절한 도구로 변신시킬 것입니다."
 SIA_establish_the_foundry_and_machine_shop: "주조 공장 및 기계 공장을 설립"
 SIA_establish_the_foundry_and_machine_shop_desc: "자주적 해군을 만들기 위해서는 수입된 부품으로 조립한 함선으로는 부족합니다. 자체적인 주조 공장과 기계 공장을 설립함으로써, 우리는 군함의 핵심 부품을 [ROOT.GetNameDef]에서 주조, 성형 및 수리할 수 있도록 산업 기반을 강화할 것입니다."
 SIA_the_thonburi_arsenal: "톤부리 조병창"
 SIA_the_thonburi_arsenal_desc: "무장을 탑재할 수 없는 조선소는 불완전합니다. 톤부리에 조병창이 설립되면 함포, 탄약 및 관련 장비의 제조 및 저장이 가능해져 우리 함대가 국가 산업에 더욱 긴밀하게 연계될 것입니다."
 SIA_focus_on_commercial_civilian_ships: "상업용 민간 선박에 집중"
 SIA_focus_on_commercial_civilian_ships_desc: "건조되는 모든 선박이 전투용일 필요는 없습니다. 상선, 수송선 및 기타 민간 선박은 국가 경제의 순환계를 형성합니다. 상업용 선박 건조를 장려함으로써 [ROOT.GetNameDef](은)는 번영과 전시 회복력을 모두 강화할 수 있습니다."
 SIA_empower_the_coastguard: "해안경비대 강화"
 SIA_empower_the_coastguard_desc: "함대는 모든 곳에 동시에 배치될 수 없으며, 해안 경비의 임무는 대부분 소형 함선이 더 효율적으로 수행할 수 있습니다. 강화된 해안경비대는 우리의 어업을 보호하고 해안을 순찰하며, 해군을 자유롭게 하여 더욱 심각한 위협에 대처할 수 있도록 해줄 것입니다."
 SIA_river_patrols: "하천 순찰"
 SIA_river_patrols_desc: "[ROOT.GetNameDef]의 강들은 도로이자 국경선이며 생명줄이기도 합니다. 이 수역에 순찰선을 배치하면 질서 유지, 지역 주둔군 지원, 그리고 수도에서 멀리 떨어져 있어 조치가 지연되는 지역까지 국가의 영향력 확대에 도움이 될 것입니다."
 SIA_sell_bangkok_dock_co: "방콕 조선회사 매각"
 SIA_sell_bangkok_dock_co_desc: "민간 자본은 국가 관리로는 더디기만 한 일을 해낼 수 있습니다. 방콕 조선회사를 유능한 기업에 매각함으로써, 투자를 유치하고 효율성을 높이며 공공 자금을 군사적으로 더 시급하게 필요한 곳에 전환할 수 있습니다."
 SIA_a_race_against_time: "시대의 흐름 따라잡기"
 SIA_a_race_against_time_desc: "우리 해군은 시대에 뒤떨어지고 자금이 부족하며 현대전에 대비하지 못하고 있습니다. 즉시 함선 건조, 개장, 해안 방어, 해군 훈련에 자금을 재투자해야 합니다. 우리 조선소는 시대의 흐름에 뒤처지고 있습니다."
 SIA_a_race_against_time_tt: "이 정신이 만료되면 다음을 얻습니다: "
 SIA_a_race_against_time_tt2: "§Y280§!일 동안"
