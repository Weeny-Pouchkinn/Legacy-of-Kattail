 ##### FABDA BRANCH ########
 ###########################
 # Root
 ABDA_abdacom: "ABDA사령부 창설"
 ABDA_abdacom_desc: "적 강대국이 동남아시아와 태평양을 가로질러 빠르게 진격하는 상황에서, 이 지역의 연합군은 적을 견제하기 위해 통일된 움직임을 보여야 합니다. 합동 최고사령부를 창설함으로써 자원을 모으고 해군 자산을 조율하며 적에 대한 연합 전선을 구축할 수 있습니다."
 # Tier 1 - country-locked
 ABDA_fortress_singapore: "싱가포르 요새"
 ABDA_fortress_singapore_desc: "싱가포르는 이 지역에서 우리 방어 전략의 핵심입니다. 싱가포르의 요새를 강화하고 강한 병력을 주둔시키는 것은 ABDA사령부가 더 광범위하게 활동할 수 있도록 중요한 시간을 벌어주고 적의 신속한 전략적 승리를 저지할 것입니다."
 ABDA_corps_expeditionnaire: "프랑스 극동 원정군"
 ABDA_corps_expeditionnaire_desc: "프랑스령 인도차이나는 ABDA사령부 방어선의 북쪽 측면에 위치해 있습니다. 프랑스 극동 원정군을 실제 작전에 투입함으로써, [FRA.GetNameDef](은)는 식민지 군대의 중요한 인력과 경험을 합동 사령부에 제공할 수 있을 것입니다."
 ABDA_maintain_strategic_flexibility: "전략적 유연성 유지"
 ABDA_maintain_strategic_flexibility_desc: "미합중국은 어느 한 전구에 과도하게 병력을 투입해서는 안 됩니다. 전략적 예비군을 신중하게 관리함으로써, 우리는 미합중국의 산업력 및 군사력을 태평양 전역에서 가장 필요한 곳에 투입할 수 있도록 보장해야 합니다."
 # Tier 2
 ABDA_the_malay_barrier: "말레이 장벽"
 ABDA_the_malay_barrier_desc: "말라야에서 시작하여 [INS.GetNonIdeologyName]에 줄지어 있는 섬들은 천연 방어벽을 형성합니다. ABDA군은 이러한 지형을 활용하여 적의 진격을 늦추기 위한 해상 및 지상 협동 방어선을 구축해야 합니다."
 ABDA_develop_naval_infrastructure: "해군 기반시설 개발"
 ABDA_develop_naval_infrastructure_desc: "태평양에서의 지속적인 해군 작전을 위해서는 기지, 연료 보급소, 수리 시설이 필요합니다. 항구 및 정박지의 기반시설에 투자하면 ABDA 해군의 작전 범위와 내구성을 확대할 수 있습니다."
 # Tier 3
 ABDA_unified_naval_command: "통합 해군 사령부"
 ABDA_unified_naval_command_desc: "지상 방어가 구축되고 기반시설이 마련됨에 따라, ABDA는 이제 모든 해군 병력을 단일한 통합 지휘하에 둘 수 있게 되었습니다. 표준화된 신호, 공유된 정보, 그리고 조정된 순찰 경로는 전구 내 모든 함선의 효율성을 배가시킬 것입니다."
 # Tier 4
 ABDA_ship_a_day_sinking_quotas: "일일 격침 할당량"
 ABDA_ship_a_day_sinking_quotas_desc: "적의 전략적 취약점은 태평양을 가로지르는 보급선입니다. ABDA사령부는 잠수함과 수상함으로 공격적이고 조직적인 격침 할당량을 설정함으로써 적의 보급망을 약화시키고 수세에 몰아넣을 수 있습니다."
 ABDA_naval_procurement: "해군 조달"
 ABDA_naval_procurement_desc: "이미 발생한 손실로 인해 시급한 대체가 필요합니다. ABDA사령부의 조정된 조달 프로그램을 통해 태평양 전구에 가장 적합한 구축함, 잠수함, 초계함을 먼저 확보하여, 우리 연합 함대가 적의 확장에 효과적으로 대응할 수 있도록 할 것입니다."
 ABDA_keep_trade_open: "무역로 유지"
 ABDA_keep_trade_open_desc: "[INS.GetNonIdeologyName]의 고무와 석유는 연합국의 전쟁 활동에 매우 중요합니다. ABDA사령부는 이러한 필수 자원을 운송하는 해상 항로를 보호하고, 적의 방해로부터 수송선을 보호하며, 우리 산업에 필요한 무역이 원활하게 이루어지도록 해야 합니다."
 # Tier 5 - capstone
 ABDA_expand_the_command: "사령부 확장"
 ABDA_expand_the_command_desc: "ABDA사령부는 그 가치를 입증했습니다. 이제 우리는 이를 토대로 삼아 지역 내 다른 연합국 국가들로 참가국을 확대하고, 적보다 앞서 나가기 위해 연구 및 정보 공유를 강화해야 합니다."
