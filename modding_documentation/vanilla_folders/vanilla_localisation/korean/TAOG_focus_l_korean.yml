 ############
 add_random_stat_to_general_tt: "이 장군에게 무작위로 기술 능력치 하나를 추가합니다"
 generic_unlock_industrial_concern_tt: "산업 업체로 사용 가능: \n"
 NZL_rail_standardization_tt: "국가 비축량에 §Y$NZL_train_equipment_1$§! §Y[?NZL_train_var]§!개 추가"
 NZL_ministry_of_public_works: "공공사업부"
 NZL_ministry_of_public_works_desc: "조정된 계획 수립과 규율 있는 투자를 통해 도로, 철도 및 전력 계획은 단편적인 노력이 아닌 일관된 국가 전략에 따라 진행될 것입니다."
 NZL_abolish_the_railways_board: "철도위원회 폐지"
 NZL_abolish_the_railways_board_desc: "정부 철도위원회는 철도망 현대화에 효과적이지 못했습니다. 이제 이러한 일탈을 폐지하고 철도를 정부 부처의 통제하에 두어야 할 때입니다."
 NZL_rail_standardization: "기관차 표준화"
 NZL_rail_standardization_desc: "[ROOT.GetName](은)는 전국에 다양한 품질의 기관차를 생산하는 여러 작업장을 보유하고 있습니다. 철도 시스템의 효율성을 높이기 위해, 각각의 목적에 특화된 여러 표준 기관차를 제조하도록 할 것입니다."
 NZL_full_employment: "완전 고용"
 NZL_full_employment_desc: "지속적인 공공사업, 신중한 계획, 그리고 꾸준한 산업 확장을 통해 마침내 실업자들에게 기회가 열렸습니다. 대공황 시기에 방치되었던 공장들이 다시 활기를 되찾았고, 전국의 노동자들은 생산적인 기업에서 총력을 기울이고 있습니다. 신뢰와 안정을 회복함으로써 우리는 단순히 회복된 것을 넘어 앞으로 다가올 도전을 위하여 더욱 강해졌습니다."
 NZL_direct_the_coal_industry: "석탄 산업 지휘"
 NZL_direct_the_coal_industry_desc: "석탄이 철도, 산업 및 발전소에 점점 더 필수적인 자원이 됨에 따라 정부는 국가의 이익을 위해 개입하여 생산과 분배를 조정해야 합니다."
 NZL_establish_the_ncb: "국가석탄위원회 설립"
 NZL_establish_the_ncb_desc: "국가석탄위원회를 설립함으로써 전국에 흩어져 있는 탄광들을 지휘하여 조정하고 철도, 산업, 발전 분야에 안정적인 연료 공급을 확보할 수 있습니다. 중앙화된 감독을 통해 생산을 합리화하고 효율성을 개선하며 전략적 필요가 사익보다 우선하는 것을 보장할 수 있습니다."
 NZL_electrification: "전력 생산 증대"
 NZL_electrification_desc: "강을 활용하고 수력 발전을 확대함으로써 지속적인 산업력 기반을 마련할 수 있습니다. 새로운 댐과 송전 시설은 전국적으로 전력 공급 능력을 증대시켜 공장, 철도, 항구에 필요한 전력이 공급되도록 할 것입니다."
 NZL_bureau_of_industry_taog: "$NZL_bureau_of_industry$"
 NZL_bureau_of_industry_taog_desc: "$NZL_bureau_of_industry_desc$"
 NZL_wairarapa_sheep_farms_taog: "$NZL_wairarapa_sheep_farms$"
 NZL_wairarapa_sheep_farms_taog_desc: "$NZL_wairarapa_sheep_farms_desc$"
 NZL_national_roads_board_taog: "$NZL_national_roads_board$"
 NZL_national_roads_board_taog_desc: "$NZL_national_roads_board_desc$"
 NZL_taranaki_oil_taog: "$NZL_taranaki_oil$"
 NZL_taranaki_oil_taog_desc: "$NZL_taranaki_oil_desc$"
 NZL_women_in_the_workforce: "노동 현장의 여성"
 NZL_women_in_the_workforce_desc: "인력 부족이 심화됨에 따라 여성들이 공장, 농장, 공공 서비스 분야에서 중요한 역할을 맡아 전시에도 생산이 차질 없이 이루어지도록 앞장서고 있습니다. 훈련 및 고용 기회를 확대함으로써 국가의 방위를 유지하면서 산업 생산을 지속할 수 있을 것입니다."
 NZL_restart_the_onekaka_ironworks: "오네카카 제철소 재가동"
 NZL_restart_the_onekaka_ironworks_desc: "오네카카 제철소는 한때 해외 공급 의존도를 줄이고 국내에서 철과 강철을 생산하려는 우리의 열망을 상징했습니다. 경제 활성화와 국가 안보 강화를 위해 오네카카 제철소의 용광로를 재가동하는 데 관심이 쏠리고 있습니다."
 NZL_new_zealand_steel_taog: "$NZL_new_zealand_steel$"
 NZL_new_zealand_steel_taog_desc: "$NZL_new_zealand_steel_desc$"
 NZL_scrap_metal_recycling: "재활용 운동"
 NZL_scrap_metal_recycling_desc: "우리처럼 수입 의존도가 높은 경제에서는 전략 자원을 낭비해서는 안 됩니다. 경제 회복력을 강화하기 위해 금속과 고무를 가공 및 재사용하는 폐기물 재활용 시설을 설립할 것입니다."
 NZL_domestic_car_industry: "차량 조립 공장에 투자"
 NZL_domestic_car_industry_desc: "[ROOT.GetName]의 차량 생산은 해외 제조사에서 들여온 부품을 조립하여 최종 완성하는 방식으로 국한되어 있었습니다. 하지만 최근 국내 철강 생산에 투자함에 따라, 이제 부품을 자체적으로 생산할 수 있게 될지도 모릅니다."
 NZL_department_of_scientific_and_industrial_research_taog: "$NZL_department_of_scientific_and_industrial_research$"
 NZL_department_of_scientific_and_industrial_research_taog_desc: "$NZL_department_of_scientific_and_industrial_research_desc$"
 NZL_project_seal_taog: "$NZL_project_seal$"
 NZL_project_seal_taog_desc: "$NZL_project_seal_desc$"
 NZL_industrial_conscription_taog: "$NZL_industrial_conscription$"
 NZL_think_big_taog: "$NZL_think_big$"
 NZL_industrial_conscription_taog_desc: "$NZL_industrial_conscription_desc$"
 NZL_think_big_taog_desc: "$NZL_think_big_desc$"
 NZL_expand_the_university_of_auckland_taog: "$NZL_expand_the_university_of_auckland$"
 NZL_expand_the_university_of_auckland_taog_desc: "$NZL_expand_the_university_of_auckland_desc$"
 NZL_national_broadcasting_service: "국영 방송 서비스"
 NZL_national_broadcasting_service_desc: "1935년 선거에 우체국이 개입하고 그들이 국영 방송 서비스를 감독했던 사건을 보면, 우체국의 경영 방식을 개혁해야 할 필요성은 분명합니다. 또한, 우체국이 사용하는 방송 장비를 현대화하는 데에도 투자해야 합니다."
 NZL_support_allies_with_meat: "육류 산업 활용"
 NZL_support_allies_with_meat_desc: "태평양에 있는 우리 동맹국들은 보급선이 한계에 다다르는 때가 많습니다. 이러한 부담을 줄이고 동맹국의 병사들이 배를 곯지 않도록, 우리는 그들에게 육류를 공급하기 시작할 것입니다."
 NZL_support_allies_with_meat_tt: "모든 동맹이 §Y오프맵 민간공장§! §G1§!개를 받습니다"
 AST_COMINWEALTH_FACTION: "공산연방"
 AST_cominwealth_tech_sharing_tt: "우리는 모든 세력 회원국과 §Y기술 공유 협약§!을 체결할 것입니다."
 AST_modify_offshore_advancements_spirit_tt: "§Y$AST_offshore_advancements_spirit$§! 변동치:"
