 idea_SIA_weather_broadcasts: "기상 방송"
 idea_SIA_weather_broadcasts_desc: "정기적인 기상 방송은 공군과 해군이 기상 상황을 더욱 명확하게 파악할 수 있게 하여, 작전의 효율성을 높이고 악천후 속에서의 작전 위험을 줄여줍니다."
 idea_SIA_seri_thai_contacts: "자유 타이 운동 연락책"
 idea_SIA_seri_thai_contacts_desc: "자유 타이 저항군 연결망과의 접촉은 경험 많은 전사들의 영입과 연합국과의 관계 강화를 통하여 그 가치를 입증하고 있습니다."
 idea_SIA_secure_rubber_islands: "고무 제도 확보"
 idea_SIA_joint_military_command: "합동 군사령부"
 idea_SIA_joint_military_command_desc: "통합된 지휘 구조는 각 군종 간의 협력을 개선하여 숙련된 장교와 전장 교리의 발전을 가속화했습니다."
