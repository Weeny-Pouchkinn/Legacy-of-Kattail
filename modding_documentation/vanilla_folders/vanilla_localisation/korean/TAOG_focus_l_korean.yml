 INSHOL_foundations_of_defense_desc: "$HOL_the_foundations_of_defense_desc$"
 INSHOL_investments_in_civ_railways_tt: "[HOL.GetFlag]§Y[HOL.GetName]§!(이)가 이 중점 완료 시:\n         ([INS.GetFlag]§Y[INS.GetName]§!: §Y£autonomy_texticon -250.00§! 추가)\n   [INS.GetFlag]§Y[INS.GetName]§!(이)가 이 중점 완료 시:\n         §Y£autonomy_texticon 250.00§! 추가"
 INSHOL_investments_in_civ_railways: "민간 철도에 투자"
 INSHOL_investments_in_civ_railways_desc: "동인도 제도 주민들의 지지를 얻으려면 민간 기반시설에 투자해야 합니다. 현재 우리 철도는 주로 화물 운송에 사용되고 있습니다. 자바와 수마트라에 있는 기존 철도에서 운행할 수 있도록 여객 열차를 구매해야 합니다."
 INSHOL_continue_exclusive_rights: "자바은행의 독점 권리"
 INSHOL_continue_exclusive_rights_desc: "동인도 길더화는 대공황 기간 동안 대부분의 가치가 손실되었고, 우리의 경제 성장은 정체 상태에 빠졌습니다. 자바은행이 1922년까지 보유했던 독점 조폐권을 부여함으로써 길더화를 안정시킬 수 있을 것입니다."
 INSHOL_peg_indies_guilder_to_dutch_guilder: "동인도 길더를 네덜란드 길더에 연동"
 INSHOL_peg_indies_guilder_to_dutch_guilder_desc: "동인도 길더화는 대공황 기간 동안 대부분의 가치가 손실되었고, 우리의 경제 성장은 정체 상태에 도달했습니다. 가장 쉬운 해결책은 훨씬 더 안정적인 통화인 네덜란드 길더화에 동인도 길더화를 연동시키는 것입니다. 이렇게 하면 우리 종주국과의 관계도 더욱 긴밀해질 것입니다."
 INSHOL_peg_indies_guilder_to_us_dollar: "동인도 길더를 미국 달러에 연동"
 INSHOL_peg_indies_guilder_to_us_dollar_desc: "동인도 길더화는 대공황 기간 동안 대부분의 가치가 손실되었고, 우리의 경제 성장은 정체 상태에 도달했습니다. 동인도 길더화를 네덜란드 길더화에 연동할 수도 있지만, 미국 달러화는 훨씬 더 안정적인 통화입니다. 길더화를 달러화에 고정하면 경제적 독립성이 강화되어 자치 정부 수립이 더욱 현실적인 목표가 될 것입니다."
 indonesia_currency_pegged_to_dollar_modifier: "미국 달러에 연동된 동인도 길더"
 INS_direct_rule_tt: "인도네시아 제후국에서 §Y$INS_direct_rule_occupation_law$§! 점령법이 잠금 해제됩니다.\n효과:\n     해당 주에서 공장 및 자원 §G증가§!\n     순응도 증가 §R감소§!\n     저항도 증가 §R증가§!"
 INS_local_autonomy_tt: "인도네시아 제후국에서 §Y$INS_local_autonomy_occupation_law$§! 점령법이 잠금 해제됩니다.\n효과:\n     모든 방면에 §Y작은§! 강화 부여\n     순응도 증가 §G증가§!"
 INS_invest_in_batavian_education_req_tt: "§Y3§!개 이상의 인민참사회 임무 성공"
 INS_invest_in_batavian_education_req_2_tt: "§Y6§!개 이상의 인민참사회 임무 성공"
 INSHOL_eventual_autonomy_req_tt: "§Y4§!개 이상의 인민참사회 임무 성공"
 indonesia_volksraad_passed_12: "인도네시아 국기가 공식적으로 인정됨"
 INS_stronghold_java_tt: "모든 인도네시아 주: [ROOT.GetFlag][ROOT.GetNameDefCap]에게 점령되지 않음"
 INSHOL_request_east_timor: "동티모르 반환 요구"
 INSHOL_request_east_timor_desc: "포르투갈은 티모르를 점령할 권리가 없으며, 이는 우리가 더 이상 용납할 수 없는 식민주의 역사의 잔재입니다. 티모르는 인도네시아의 정당한 영토이기 때문입니다. 우리는 티모르를 즉시 반환할 것을 포르투갈에 공식적으로 요구할 것입니다."
 INS_resist_occupation: "점령에 저항"
 INS_resist_occupation_desc: "많은 인도네시아인들이 네덜란드에 품고 있는 분노로 인해, 우리는 파시즘에 굴복할 수 없습니다. 우리는 일본의 침공에 저항하고 조국을 지키기 위해 할 수 있는 모든 것을 다해야 합니다."
 INS_local_resistance: "현지 저항군"
 INS_local_resistance_desc: "우리는 아직 점령되지 않은 지역에 저항군 조직을 구축하여, 특정 지역이 점령되더라도 적절한 시기에 되찾기 위한 준비를 갖출 것입니다."
 INS_stronghold_java: "자바 요새"
 INS_stronghold_java_desc: "동인도 제도는 수많은 민족이 살고 있는 광활한 제도이자 험준한 지형이 있는 곳입니다. 우리보다 훨씬 규모가 큰 육군으로부터 모든 섬과 정글, 산을 방어하려 한다면 반드시 실패할 것입니다. 동지들을 버리는 것은 쉽지 않지만, 자바를 제외한 모든 섬에서 철수하여 전 병력을 그곳에 주둔시키는 것이 국가 전체를 위한 최선의 수일 것입니다."
 INS_silence_nationalists: "국민파 동조자 침묵시키기"
 INS_silence_nationalists_desc: "일본이 침공하자 혁명적 민족주의 운동은 네덜란드라는 공동의 적을 두고 일본 침략군을 지지하게 되었습니다. 침공으로 인한 불안정은 이러한 운동의 성장을 전례 없는 속도로 가속화시켰습니다. 당장 조치를 취하지 않으면 이 운동이 통제 불능 상태로 커져 버릴 수 있습니다."
 INS_east_indies_exile_government: "동인도 망명 정부"
 INS_east_indies_exile_government_desc: "애통하게도, 최선을 다했지만 동인도 제도는 함락되었습니다. 하지만 아직 희망을 잃어서는 안 됩니다. 우리는 제한된 자원으로 할 수 있는 모든 노력을 계속해야 합니다. 비록 전투에서는 패배했을지 모르지만, 아직 전쟁에서 패배한 것은 아닙니다."
 INS_establish_nefis: "NEFIS 수립"
 INS_establish_nefis_desc: "우리는 연합국과 함께 네덜란드령 동인도군 정보국(NEFIS)을 창설하여 호주에 위치하게 할 것입니다. 이 기관을 통해 일본 점령군에게 방해 공작을 가하는 비밀 작전을 수행할 것입니다. 조그만 승리 하나하나가 본토로의 귀환에 한 걸음씩 더 다가가게 해 줄 것입니다."
 INS_evacuate_soldiers_to_australia: "호주로 병력 철수"
 INS_evacuate_soldiers_to_australia_desc: "우리는 호주 북부의 NEFIS 기지 근처에 군사 기지를 건설할 것입니다. 그곳에 점령 중에 포로로 잡히지 않은 왕립 네덜란드령 동인도군 병사들을 주둔시켜 전투를 계속할 수 있게 할 것입니다."
 INS_australian_weapons: "호주산 무기"
 INS_australian_weapons_desc: "비밀 작전은 수행하기 쉽지 않으며, 성공하려면 적절한 장비가 필요합니다. 우리는 호주의 공장에 면허를 부여하고 NEFIS용 무기 생산 시설로 용도를 변경할 수 있습니다."
 INS_defenders_of_homeland: "향토방위의용군"
 INS_defenders_of_homeland_tt: "향토방위의용군이 창설되면 이 중점은 자동으로 완료됩니다."
 INS_resist_occupation_tt: "침략받고 항복하지 않으면 이 중점은 자동으로 완료됩니다."
 INS_defenders_of_homeland_desc: "동인도 정부가 무너지고 그 자리에 새로운 정권이 들어섰습니다. 민족주의자들과 일본 정부의 주도하에, 우리는 왕립 네덜란드령 동인도군보다 우월한 새 군대를 창설하여 전쟁에서 승리할 것입니다. 그러나 민족주의자들과 제국주의자들의 동맹이 취약하다는 점은 부인할 수 없습니다. 이 동맹은 지속될까요, 아니면 유혈 사태로 끝날까요?"
 INS_embrace_co_prosp_sphere: "공영권 수용"
 INS_embrace_co_prosp_sphere_desc: "우리는 마침내 네덜란드의 지배를 끝냈습니다. 비록 한 종주국을 다른 종주국으로 교체했을 뿐이지만, 경제적 번영과 범아시아주의라는 약속은 매우 매력적입니다. 우리는 네덜란드가 다시는 인도네시아로 돌아오지 못하도록 일본의 전쟁 활동을 계속 지원할 것입니다."
 INS_seize_oppurtunity: "기회 잡기"
 INS_seize_oppurtunity_desc: "[JAP.GetNameDefCap](은)는 패배하고 있으며, 그들의 점령군 정부는 취약합니다. 수 세기 만에 처음으로, 인도네시아를 억압하는 멍에를 영원히 벗어던지고 독립 국가를 건설할 수 있는 진정한 기회가 왔습니다. 지금 이 기회를 잡고 독립을 선언하지 않으면 다음 기회가 언제 올지 알 수 없습니다."
 INS_japanese_resource_infrastructure: "더 큰 전쟁 활동에 자금 제공"
 INS_japanese_resource_infrastructure_desc: "우리의 핵심 자원 채굴 기반시설에 대한 통제권을 [JAP.GetNameDef]에 넘겨주는 것은 전쟁에서 승리하기 위한 필수적인 단계입니다. [JAP.GetAdjective] 부대가 항상 충분한 보급을 받는 것이 최우선이기 때문입니다. [JAP.GetNameDefCap](은)는 또한 자원 수출 효율성을 높이기 위해 현지 기반시설을 개발할 것입니다."
 INS_japanese_army_training: "군대 개혁"
 INS_japanese_army_training_desc: "우리는 우리의 종주국 [JAP.GetAdjective]에게서 배울 점이 많습니다. 이제 왕립 네덜란드령 동인도군이 해체되었으니, 일본 제국 육군의 지도를 받는 새로운 군대를 창설하여 외부의 위협으로부터 인도네시아를 방어할 준비를 해야 합니다."
 INS_governor_general_de_jonge: "더용어 총독"
 INS_governor_general_de_jonge_desc: "보니파시위스 코르넬리스 더용어는 철권통치로 유명하며, 어떤 형태의 민족주의에도 반대하고, 인민참사회의 뜻을 무시하는 경우가 많습니다. 그의 동인도 제도 통치는 오랫동안 지속되었으며, 그의 경력은 대전쟁 당시 동인도 전쟁부 장관으로 일하던 시기까지 거슬러 올라갑니다."
 INS_governor_general_tjarda: "차르다 총독"
 INS_tjarda_explain_tt: "§Y보니파시위스 코르넬리스 더용어§!의 임기가 끝났으며, 1936년 9월에 §Y알리디위스 차르다 판 스타르켄보르흐 스타하우버르§!가 후임 총독으로 선택되었습니다."
 INS_governor_general_tjarda_desc: "알리디위스 차르다 판 스타르켄보르흐 스타하우버르는 동인도 제도에 대해 전임자와는 약간 다른 구상을 갖고 있습니다. 그는 민족주의에 여전히 반대하지만, 이전보다 조금 더 자유주의적인 정책을 펼치고 있으며, 인민참사회의 의견에 더 귀를 기울이는 경향이 있습니다."
 INS_electrical_investments: "전력에 투자"
 INS_electrical_investments_desc: "유럽의 모든 산업화된 국가들은 산업을 뒷받침할 강력한 전력망을 갖추고 있습니다. 우리가 원자재 수출에 대한 의존을 중지하고 그들처럼 자체적인 제조업을 육성하려면 자바 전역에 걸쳐 대용량 전력망을 구축해야 합니다."
 INS_reduce_land_taxes: "토지세 감세"
 INS_reduce_land_taxes_desc: "토지 소유에 부과되는 높은 세금으로 인해 인도네시아 원주민들은 농장이나 사업체를 소유하기 어려웠습니다. 이는 우리가 고무 산업을 독점할 수 있도록 해주었지만, 전국적인 경제 문제를 야기했습니다. 우리는 이러한 세금을 이전 수준으로 줄여서, 소규모의 민간 소유 고무 농장들이 운영될 수 있도록 해야 합니다."
 INS_invest_in_batavian_education: "바타비아의 교육에 투자"
 INS_invest_in_batavian_education_desc: "인민참사회는 교육에 대한 접근성을 높이는 것이 인도네시아 국민의 뜻임을 분명히 밝혔습니다. 현재는 네덜란드계 인도네시아인과 소수의 인도네시아인 엘리트들만이 교육 혜택을 누릴 수 있기 때문입니다. 인민참사회의 결의안을 따르기 위해서는, 바타비아와 그 주변 지역에 여러 개의 초등학교와 중등학교를 건설해야 합니다."
 INS_javanese_education_investments: "자바의 교육에 투자"
 INS_javanese_education_investments_desc: "현재 진행 중인 초등학교 및 중등학교 건설 계획에 추가하여, 우리는 지역의 대학과 직업전문학교를 건설하여 중산층 가정들이 고등교육을 훨씬 더 쉽게 받을 수 있도록 할 수 있습니다."
 INS_allow_local_autonomy: "지역 자치 허가"
 INS_allow_local_autonomy_desc: "제후국에 자치권을 부여하는 포르스텐란덴 제도는 민족주의 운동을 훨씬 수월하게 관리할 수 있도록 했고, 국가 전체의 안정도를 높였습니다. 우리는 제후국에 부여되는 자치도 수준을 더욱 높여 정부가 더 중요한 사안에 집중할 수 있도록 해야 합니다."
 INS_direct_rule: "직접 통치"
 INS_direct_rule_desc: "제후국들에 자치권을 부여하는 포르스텐란덴 제도는 행정상의 어려움을 가중시키고, 관료주의의 증가와 시간 낭비를 초래했습니다. 이제 이 제도를 완전히 폐지하고 제도 전체에 대한 직접 통치를 시행해야 합니다."
 INS_seize_oppurtunity_tt: "§Y[JAP.GetFlag][JAP.GetName]§!(은)는 후퇴하였으며, §Y[?var:temp_states_plus_more]§!개 미만의 주를 지배합니다. (현재: §Y[?var:JAP.num_controlled_states]§!)"
 INS_seize_oppurtunity_refuse_warn_tt: "§R국민혁명이 시작되며, [HOL.GetNameDef]에 대한 전쟁으로 이어질 수 있습니다.§!"
 INS_economic_stabilization: "경제 안정화"
 INS_economic_stabilization_desc: "대공황과 세계적인 보호무역주의로 인해 우리 경제는 크게 위축되었고, 한때 원자재 산업에 종사했던 많은 인도네시아인들이 실업자가 되었습니다. 우리는 과감한 조치를 취하여 실업자들에게 일자리를 제공하는 고용 사업을 만들어야 합니다."
 INS_restore_order_in_indies: "동인도 제도에 질서 회복"
 INS_restore_order_in_indies_desc: "동인도 제도에서 고조되는 민족주의 운동은 여러 지역을 불안정하게 만들고 있으며, 이를 막지 못하면 통제 불능 상태로 확산될 수 있습니다. 우리는 최우선 과제로서 질서와 안정을 회복해야 합니다."
 INS_detangle_supply_chains: "공급망 해소"
 INS_detangle_supply_chains_desc: "우리의 수출 경제는 상품이 최종 목적지에 도달하기까지 수십 명의 중간 상인을 거쳐야 하며, 그때마다 수수료, 세금 또는 기타 명목으로 수익이 조금씩 차감됩니다. 우리는 이러한 복잡한 구조를 해소하고 공급망 대부분을 직접 통제해야 합니다."
 INS_prioritize_industrial_growth: "산업 성장 우선"
 INS_prioritize_industrial_growth_desc: "우리의 수출 경제는 너무 불안정해서 네덜란드와의 협력 없이는 버티기 어렵습니다. 바타비아 전역에 공장을 건설하여 제조업을 육성해야 합니다. 그렇게 하면 우리는 태평양에서 가장 산업화된 국가가 될 수 있을 것입니다."
 INS_closer_economic_ties_to_netherlands: "네덜란드와의 경제적 결속 강화"
 INS_closer_economic_ties_to_netherlands_desc: "우리는 종주국으로부터 배울 점이 많습니다. 특히 경제적인 측면에서 그렇습니다. 만약 우리가 수출 경제를 네덜란드와 더욱 통합시킨다면, 그들의 기반시설과 인맥을 활용하여 수익성이 더 좋은 무역 거래를 확보할 수 있을 것입니다."
 INS_prioritize_dutch_companies: "네덜란드 회사 우선"
 INS_prioritize_dutch_companies_desc: "쉘과 포커 같은 네덜란드 회사들은 수 세기 동안 우리 경제의 근간을 이루어 왔으며, 우리의 원자재 수출은 쉘과 긴밀하게 통합되어 있습니다. 이는 동인도 제도에 상당한 부를 가져다주었으며, 우리는 이러한 협력을 확고히 유지하기 위해 소규모 현지 사업체보다 이들 네덜란드 회사를 우선시해야 합니다."
 INSHOL_java_factories: "자바에 무기 공장을 개설"
 INSHOL_java_factories_desc: "기본적인 사실이지만, 무기 공장을 더 많이 짓는 것은 분명히 군대의 전력 증강에 큰 도움이 됩니다. 식민지의 산업 중심지인 자바는 무기 공장을 짓기에 가장 적합한 장소입니다."
 INSHOL_license_dutch_weapon_blueprints: "네덜란드 무기 설계 면허 획득"
 INSHOL_license_dutch_weapon_blueprints_desc: "우리는 국내 생산 공정 전체를 구축하고 자체적인 기술 설계를 개발하는 데 투자하는 대신에, 네덜란드 회사와 협력하여 그들의 무기 설계도를 구매해야 합니다."
 INSHOL_bangka_production_lines: "방카 생산 라인"
 INSHOL_bangka_production_lines_desc: "방카 계획으로 인해 방카의 기반시설이 급격히 발전하면서, 한때 작고 중요하지 않았던 이 섬은 새로운 산업 프로젝트를 위한 완벽한 장소가 되었습니다. 우리는 방카에 새로운 무기 공장을 건설함으로써 왕립 네덜란드령 동인도군을 강화할 기회를 얻었습니다. 이 섬에는 도로, 철도, 항구가 집중되어 있으므로, 다른 곳에 건설하는 것보다 훨씬 효율적으로 운영할 수 있습니다."
 INSHOL_artillerie_inrichtingen: "아틸러리 인리허팅겐"
 INSHOL_artillerie_inrichtingen_desc: "아틸러리 인리허팅겐은 250년이 넘도록 네덜란드에서 야포 및 기타 무기를 제조해 왔으며, 동인도 제도에서도 수십 년 동안 사업을 운영해 왔습니다. 동인도 제도에 새로운 제조 시설을 설립하여 생산 역량을 확장하면 왕립 네덜란드령 동인도군의 역량을 크게 향상시키며, 새로운 일자리를 창출하여 경제적으로 낙후된 지역의 경제를 활성화할 수 있을 것입니다."
 INSHOL_ai_pyrotechnische: "아틸러리 인리허팅겐 피로테크니셰"
 INSHOL_ai_pyrotechnische_desc: "동인도 제도 내에 아틸러리 인리허팅겐의 생산 시설 확장을 지속하기 위해, 아틸러리 인리허팅겐의 화약 부문 자회사가 동인도 지사를 설립하도록 자금을 지원해야 합니다."
 INSHOL_bio_pharma: "바이오 파르마"
 INSHOL_bio_pharma_desc: "인도네시아의 제약 산업을 확장하는 것은 부상병들이 적절한 치료를 받고 안전하게 회복할 수 있도록 왕립 네덜란드령 동인도군을 개혁하기 위해 꼭 필요한 다음 단계입니다. 동인도 제도에서는 퀴닌을 손쉽게 확보할 수 있으므로, 이 프로젝트의 비용은 일반적인 경우보다 훨씬 적을 것입니다."
 INSHOL_develop_fighters: "신형 전투기 개발"
 INSHOL_develop_fighters_desc: "우리는 바타비아 공학자들을 암스테르담으로 파견하여 포커의 전투기 생산 과정을 직접 연구하고, 철저히 비밀로 유지되는 제조 기술에 접근할 것입니다. 그들은 필요한 지식과 기술적 전문 지식을 가지고 돌아와 동인도 제도에 현대적인 국산 전투기 산업을 조성할 것입니다."
 INSHOL_develop_bombers: "신형 폭격기 개발"
 INSHOL_develop_bombers_desc: "우리는 바타비아 공학자들을 암스테르담으로 파견하여 포커의 폭격기 생산 과정을 직접 연구하고, 철저한 보안이 유지되는 제조 기밀에 접근할 것입니다. 그들은 필요한 지식과 기술적 전문 지식을 가지고 돌아와 동인도 제도에 현대적인 국산 폭격기 산업을 조성할 것입니다."
 INSHOL_bandung_aircraft_facility: "반둥 항공기 제조 시설"
 INSHOL_bandung_aircraft_facility_desc: "설계도와 제조 기밀은 유용하지만, 그것을 바탕으로 항공기를 만들지 않으면 아무 소용이 없습니다. 우리는 네덜란드령 동인도군 항공대의 현재 수요를 충족하기 위해 새로운 항공기 제조 시설을 반둥에 설립할 것입니다."
 INSHOL_netherlands_indies_air_doctrine: "네덜란드-동인도 공군 교리"
 INSHOL_netherlands_indies_air_doctrine_desc: "우리는 우리와 유사한 상황에 직면한 국가들의 공군을 연구하고, 그들이 어렵게 얻은 경험을 바탕으로 과거의 실수를 되풀이하지 않으면서 동인도 제도의 현실에 맞는 교리를 수립할 것입니다."
 INSHOL_manado_military_academy: "마카사르 사관학교"
 INSHOL_manado_military_academy_desc: "자바 외부에 사관학교를 설립하면 동부 섬들에서도 징병을 시행할 수 있게 되어 인력 부족 문제를 상당히 완화할 수 있을 것입니다. 동인도 제도의 중앙 부근에 위치한 마카사르는 이러한 목적에 완벽한 장소입니다."
 INSHOL_infantry_training_in_borneo: "보르네오에서의 보병 훈련"
 INSHOL_infantry_training_in_borneo_desc: "동인도 제도는 빽빽한 정글, 험준한 산지, 그리고 험준한 지형으로 유명합니다. 주로 자바에 주둔하는 우리 군인들은 이러한 환경에서의 전투 준비가 턱없이 부족합니다. 우리는 군사 훈련 지역을 자바를 넘어 더욱 험난한 환경까지 확대해야 합니다. 지구상에서 보르네오의 정글과 산지에 필적할 만한 곳은 거의 없으며, 따라서 보르네오는 세계적인 수준의 레인저를 훈련시키기에 완벽한 장소입니다."
 INSHOL_knil_engineers: "공병단"
 INSHOL_knil_engineers_desc: "우리는 보병과 소총 생산에만 모든 노력을 집중해서는 안 되며, 군수와 통신이 전투 승리에 필수적인 역할을 한다는 것을 명심해야 합니다. 우리는 공병을 양성하고 바타비아 직업학교에 자금을 지원하여 우리 군이 열악한 군수 체계로 인해 차질을 겪지 않도록 해야 합니다."
 INSHOL_work_with_oil_barons: "석유 남작들과 협력"
 INSHOL_work_with_oil_barons_desc: "대공황으로 인해 수출에 기반한 우리 경제는 심각한 침체에 빠졌습니다. 석유 판매를 보장하기 위해 수마트라의 석유 남작들에게 무역 협상의 일부를 위임하는 방안을 고려해야 할 때일지도 모릅니다. 하지만 여기에는 대가가 따를 것입니다. 그들이 이 거래에 동의하도록 하려면 우리는 시장 가격보다 훨씬 낮은 가격에 석유를 판매해야 할 것입니다."
 INSHOL_rubber_taxation: "고무 과세"
 INSHOL_rubber_taxation_desc: "네덜란드의 투자와 전문 지식은 동인도 제도의 고무 농장을 제국의 가장 가치 있는 자산 중 하나로 탈바꿈시켰습니다. 고무 농장이 창출한 부에 대하여 왕실이 정당한 몫을 요구하는 것은 당연한 일입니다. 일부 현지 정치인들이 반대하고 있지만, 제국의 이익은 지역의 선동에 좌우될 수 없습니다."
 INSHOL_padang_port: "파당의 국제 항구"
 INSHOL_padang_port_desc: "파당에서 생산된 자원은 이 지역에 대형 수송선을 운용할 수 있는 시설이 부족하기 때문에 자바를 거쳐 국제 시장에 도달해야 합니다. 이러한 불필요한 우회는 공급망에 부담을 주고 수마트라의 경제적 잠재력을 제한합니다. 파당에 주요 화물 항구를 건설하면 이러한 우회를 배제하여 파당 농장의 수익성을 높일 수 있습니다."
 INSHOL_subsidize_bauxite: "보크사이트 프로젝트에 보조금 제공"
 INSHOL_subsidize_bauxite_desc: "동인도 제도에서 진행 중인, 보크사이트 매장량이 풍부한 방카블리퉁을 현대화하는 계획은 매우 유망하며 장기적인 수익 가능성이 높습니다. 우리는 동인도 정부가 이 계획을 신속하게 추진할 수 있도록 경제 보조금을 지원해야 합니다."
 INSHOL_agricultural_subsidies: "농업 부문 민영화"
 INSHOL_agricultural_subsidies_desc: "다양한 규모의 민간 소유 농장 설립을 허용함으로써, 우리는 재정이 부족한 농촌 지역의 기반시설 개발을 가속하면서 정부 수입을 늘릴 수 있습니다. 이를 위해서, 우리는 이 농장들에서 발생하는 모든 세입이 동인도 제도를 거치지 않고 네덜란드로 직접 귀속되도록 하는 체계적인 조세 체계를 구축할 것입니다."
 INSHOL_import_sugar: "설탕 수입"
 INSHOL_import_sugar_desc: "우리는 동인도 제도의 성장하는 농업 부문에 가격 통제를 의무화하여, 다른 어떤 정부도 따라올 수 없는 가격으로 동인도의 농장에서 국내 설탕 수요 전량을 조달하고, 설탕에 대한 정부 독점을 확립할 것입니다."
 INSHOL_import_lumber: "목재 수입"
 INSHOL_import_lumber_desc: "우리는 동인도 제도의 성장하는 농업 부문에 가격 통제를 의무화하여, 다른 어떤 정부도 따라올 수 없는 가격으로 동인도의 농장에서 국내 목재 수요 전량을 조달하고, 목재에 대한 정부 독점을 확립할 것입니다."
 INSHOL_industrialized_colony: "산업화된 식민지"
 INS_no_peta_tt: "인도네시아는 외국 침략자와 협력할 수 없게 됩니다."
 INSHOL_industrialized_colony_desc: "한때 보잘것없는 식민지였던 동인도 제도는 이제 아시아에서 가장 산업화되고 부유한 지역 중 하나가 되었습니다. 이는 네덜란드 역사만이 아니라, 인류의 역사에도 기념비적인 순간입니다. 우리의 노력이 결실을 맺었으며, 우리는 앞으로도 식민지 발전에 투자하고 네덜란드를 다시 세계적인 강대국으로 재건할 것입니다."
 INSHOL_economic_integration: "경제 통합"
 INSHOL_economic_integration_desc: "네덜란드령 동인도는 우리 제국의 빛나는 보석이며, 여왕, 총리, 그리고 총독의 확고한 지도력 덕분에 번영을 누리고 있습니다. 이 안정은 무모한 독립 요구로 위협받아서는 안 되며, 독립은 혼란과 쇠퇴만을 가져올 뿐입니다. 우리는 네덜란드와 동인도의 경제를 더욱 긴밀하게 통합하여 지속적인 안정과 위대함을 보장할 것입니다."
 INSHOL_republic_of_indonesia: "인도네시아 공화국"
 INSHOL_republic_of_indonesia_desc: "네덜란드가 마지못해 수타르조 청원에 동의했을 때, 그 결과로 제정된 법안은 인도네시아의 독립에 경제적으로 자립하기 위한 수많은 조건이 충족되어야 한다는 내용을 담고 있었습니다. 그럼에도 불구하고, 인도네시아 국민의 굳은 의지 덕분에 이러한 조건들은 이제 모두 충족되었으며, 네덜란드는 우리의 공식적인 독립 선언을 받아들일 수밖에 없습니다."
 INSHOL_propose_malay_unification: "말레이 통합 제안"
 INSHOL_propose_malay_unification_desc: "인도네시아는 수백 가지의 문화, 언어, 민족이 모인 제도 국가입니다. 어떤 문화는 비슷하지만, 어떤 문화는 확연히 다릅니다. 하지만 식민 지배에 대한 공통된 투쟁을 통해 우리는 인도네시아라는 하나의 국가 아래 통합되었습니다. 그런데 해협 건너편 말라야 사람들 역시 우리와 마찬가지로 비슷한 역사와 열망을 공유하고 있는데, 굳이 이 통합을 여기에서 멈춰야 할까요?"
 INSHOL_singapore_compromise: "싱가포르 타협안"
 INSHOL_singapore_compromise_desc: "싱가포르는 역사적으로 그리고 문화적으로 인도네시아의 영토이며, 통일된 인도네시아에 포함되는 것이 당연합니다. 그러나 영국은 싱가포르의 전략적 중요성과 군사 기지로서의 필요성 때문에 싱가포르를 포기하지 않으려 합니다. 우리는 싱가포르가 연방에 가입하는 대신 영국이 그 섬에 군대를 주둔시킬 권리를 유지하는 타협안을 제안해야 합니다."
 INSHOL_request_ceylon: "실론 이양 요청"
 INSHOL_request_ceylon_desc: "영국의 식민지인 실론은 더 넓은 말레이 세계와 깊은 문화적, 언어적 유대를 공유합니다. 범말라야 연방인 마필린도가 성장하고 있으므로, 이 섬 또한 연방에 가입해야 하는 것이 당연합니다."
 INSHOL_papua_referendum: "파푸아 국민투표"
 INSHOL_papua_referendum_desc: "오늘날 파푸아섬은 인도네시아와 호주로 나뉘어 있습니다. 인도네시아의 투자와 개발 덕분에 인도네시아령 파푸아는 성장하고 번영하는 지역으로 탈바꿈했지만, 호주령 파푸아 지역은 여전히 방치되고 미개발되어 있습니다. 이 섬의 미래는 주민들의 손에 달려 있어야 하므로, 우리는 파푸아 통일에 대한 공식 국민투표를 요구해야 합니다."
 INSHOL_invite_phillipines: "마필린도 제안"
 INSHOL_invite_phillipines_desc: "우리 연방의 다양한 민족들은 서로 다른 언어를 사용하고 서로 다른 전통을 고수하고 있지만, 거의 모두가 말레이 세계에 뿌리를 두고 있습니다. 우리는 필리핀을 회원국으로 맞이하여 우리 연방국을 범말라야 연방으로 개편해야 합니다. 한때 보잘것없는 여러 식민지에 지나지 않았던 우리가 이제 동남아시아의 지역 강국으로 우뚝 설 것입니다."
 INS_focus_time_reduce_usa_tt: "§Y$INS_realign_supply_chains$§!(은)는 이 중점 완료에 필요한 시간을 70일 단축합니다."
 INS_focus_time_reduce_jap_tt: "§Y$INS_first_come_first_serve$§!(은)는 이 중점 완료에 필요한 시간을 70일 단축합니다."
 INS_focus_time_reduce_fokker_tt: "§Y$INSHOL_east_indies_fokker_division$§!(은)는 이 중점 완료에 필요한 시간을 35일 단축합니다."
 INS_focus_time_reduce_tjarda_tt: "§Y$INS_governor_general_tjarda$§!(은)는 이 중점 완료에 필요한 시간을 35일 단축합니다."
 INS_focus_time_reduce_pki_tt: "§Y$INS_utilize_tan_malakas_militia$§!(은)는 이 중점 완료에 필요한 시간을 35일 단축합니다."
