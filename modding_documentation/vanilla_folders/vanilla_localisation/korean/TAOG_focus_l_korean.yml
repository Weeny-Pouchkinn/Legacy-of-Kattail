 idea_SIA_german_tank_studies: "독일 전차 연구"
 idea_SIA_german_tank_studies_desc: "우리 장교들은 외국의 기갑 교리와 설계를 연구하는 데 시간을 들여, 우리 기갑 부대 개발에 직접적으로 기여할 기술적 지식을 습득하고 돌아왔습니다."
