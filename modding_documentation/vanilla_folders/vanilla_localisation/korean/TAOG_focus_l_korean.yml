 # Alternative Communist Focus
 SIA_the_peoples_war_in_asia: "아시아에서의 인민의 전쟁"
 SIA_the_peoples_war_in_asia_desc: "[JAP.GetAdjective] 제국주의에 대한 투쟁은 단순히 국가 간의 경쟁이 아닙니다. 그것은 노동자, 농민, 그리고 병사들이 외국의 지배 야욕에 맞서는 전쟁입니다. 중국 공산주의 군대와 함께함으로써, [ROOT.GetNameDef](은)는 아시아 전역에 걸친 더 광범위한 인민의 전쟁에 동참하는 것입니다."
 SIA_peoples_war_in_asia_idea: "아시아에서의 인민의 전쟁"
 SIA_peoples_war_in_asia_idea_desc: "이 전쟁은 정규 부대만으로 지속되고 있지 않습니다. 지역 위원회, 파르티잔 안내자, 농민 보급 부대 등이 이제 야전에서 군대를 지원하고 있습니다. 모든 마을은 보급창이 되고, 모든 길은 매복지가 되며, 모든 퇴각은 적을 내륙 깊숙이 유인할 기회가 됩니다."
 # Alternative Nationalist Focus
 SIA_national_defense_in_asia: "아시아에서의 국가 방위"
 SIA_national_defense_in_asia_desc: "아시아를 방어하기 위해서는 규율, 위계질서, 그리고 공동의 전략적 목적이 필요합니다. 중국 민족주의 정부와 함께함으로써, [ROOT.GetNameDef](은)는 조직화된 군대와 조직적인 지휘를 통해 [JAP.GetAdjective]의 확장에 저항하는 연합에 합류할 수 있습니다."
 SIA_national_defense_in_asia_tt: "§Y[ROOT.GetNameWithFlag]§!(이)가 연합전선에서 민족주의 세력들과 연합합니다.\n다음 효과를 부여하는 §Y$SIA_national_defense_in_asia_idea$§! 추가:\n $MODIFIER_ARMY_ORG_FACTOR$: §G+5%§!\n $MODIFIER_PLANNING_SPEED$: §G+10%§!\n $MODIFIER_MAX_PLANNING$: §G+10%§!\n $MODIFIERS_ARMY_DEFENCE_FACTOR$: §G+5%§!"
 SIA_stronger_together: "함께하면 더욱 강하다"
 SIA_stronger_together_desc: "전쟁은 아득한 약속과 평행 동맹을 그저 장애물로 전락시켰습니다. [ROOT.GetNameDef](이)가 아시아의 미래를 결정짓기 위해서는, 우리 파트너들에게 그들의 세력을 우리 세력에 결속하여 앞으로의 분쟁에서 단일한 지휘 구조를 받아들이도록 요청해야 합니다."
 idea_SIA_national_defense_in_asia: "아시아에서의 국가 방위"
 SIA_directorate_of_aeronautical_engineering_desc: "조종사만으로는 [ROOT.GetNameDef] 공군의 미래를 보장할 수 없습니다. 공학자, 검사관, 작업장, 그리고 외국에서 구매한 항공기를 이용 가능한 항공기로 전환할 수 있는 중앙의 기관이 필요합니다. 항공공학부는 이러한 활동의 기반이 될 것입니다."
 idea_SIA_aeronautical_engineering_directorate: "항공공학부"
 SIA_standardize_aircraft_maintenance: "표준화된 항공기 정비"
 SIA_standardize_aircraft_maintenance_desc: "우리 항공기는 공급처가 다양하며, 공급처마다 부품, 공구, 정비 방식이 다릅니다. 항공공학부에서 정비 절차를 표준화함으로써 [ROOT.GetNameDef](은)는 더 많은 항공기를 운용할 수 있고, 지상에서의 혼란으로 인한 낭비를 줄일 수 있습니다."
 SIA_expand_aircraft_workshops: "항공기 작업장 확장"
 SIA_expand_aircraft_workshops_desc: "항공공학부에는 사무실과 검사 서류만 있어서는 안 됩니다. 새로운 작업장, 공작기계, 그리고 숙련된 정비사들이 있으면 손상된 항공기를 국내에서 수리할 수 있고, 간단한 부품들은 외국에서의 배송을 기다리지 않고 생산할 수 있습니다."
 SIA_license_modern_airframes: "현대식 기체 면허"
 SIA_license_modern_airframes_desc: "[ROOT.GetNameDefCap](은)는 아직 필요한 모든 항공기를 자국에서 설계할 수 없습니다. 더욱 현실적인 방안은 해외 모델의 면허를 얻어 구조를 연구하고, 항공공학부의 감독하에 우리의 기후, 비행장, 공급 조건에 맞게 조정하는 것입니다."
 SIA_tropical_air_operations: "열대 공중 작전"
 SIA_tropical_air_operations_desc: "더위, 습기, 몬순 강우, 그리고 고르지 않은 전방 활주로는 항공기와 승무원에게 각자의 부담을 안겨줍니다. 항공공학부는 엔진, 정비 일정, 그리고 조종사 교리를 이러한 환경에 맞게 조정하여 동남아시아 상공에서 우리 공군의 신뢰도를 높일 수 있습니다."
 ##########
 #### AUSTRALIA ####
 ###################
 effects_of_event_tt: "\n§Y사건의 효과:§!"
 AST_war_is_coming: "다가오는 전쟁"
 AST_war_is_coming_desc: "지난 30년 동안 우리는 계속해서 도전에 직면해 왔지만, 이제 호주 민주주의의 힘을 시험할 마지막 도전이 다가오고 있는 것 같습니다. 빌리 휴즈 전 총리는 이 문제와 관련해 매우 확고한 입장을 밝혔으며, 좋든 싫든 전쟁이 다가오고 있다는 그 주장을 무시하는 것은 무책임한 일일 것입니다."
 AST_war_is_coming_tt: "\n§Y민주주의 선거§! 잠금 해제"
 AST_war_is_coming_uap_advisors_tt: "(§Y$AST_billy_hughes$§!):"
 AST_war_is_coming_alp_advisors_tt: "(§Y$AST_james_scullin$§!):"
 AST_war_is_coming_decrease_advisors_tt: "(§Y$AST_maurice_blackburn$§!):"
 AST_war_is_coming_advisors_tt: "\n정치 고문 변동치:"
 AST_advance_pacific_initiatives: "태평양 계획 진행"
 AST_advance_pacific_initiatives_desc: "우리가 체결한 불가침조약 덕분에 아시아의 이웃 국가들과 관계가 개선되었습니다. 우리는 이러한 관계를 최대한 활용하여 새로운 동맹들에게 우리의 산업 발전을 원조해 줄 것을 요청할 것입니다."
 AST_advance_pacific_initiatives_tt: "\n불가침조약을 시행할 국가:"
 AST_advance_pacific_initiatives_jap_tt: " §Y[JAP.GetName]§!에게 시행 시 효과에 §G2§!개의 오프맵 §Y조선소§! 추가."
 AST_advance_pacific_initiatives_ins_tt: " §Y[INS.GetName]§!에게 시행 시 효과에 §G1§!개의 오프맵 §Y합성 정제소§! 추가."
 AST_advance_pacific_initiatives_chi_tt: " §Y[CHI.GetName]§!에게 시행 시 효과에 §G2§!개의 오프맵 §Y민간공장§! 추가."
 AST_advance_pacific_initiatives_jap_2_tt: "§Y[JAP.GetName]§!의 제공:"
 AST_advance_pacific_initiatives_ins_2_tt: "§Y[INS.GetName]§!의 제공:"
 AST_advance_pacific_initiatives_chi_2_tt: "§Y[CHI.GetName]§!의 제공:"
 AST_advance_pacific_initiatives_2_tt: "\n해당 국가와 전쟁 발발 시 이 건물들은 제거됩니다."
 AST_pacific_initiatives_modifier: "외교 계획"
 AST_domestic_industry: "국내 산업"
 AST_domestic_industry_desc: "전쟁이 발발할 경우 동맹국의 방위산업에 의존할 수는 없습니다. 우리는 어떤 상황이 되어도 대비할 수 있도록 자체 산업을 확장해야 합니다."
 AST_a_democratic_bulwark: "민주주의의 보루"
 AST_a_democratic_bulwark_desc: "파시즘과 공산주의라는 두 가지 위협에 강력하게 맞서기 위해서는 민주주의를 선봉에 세워야 합니다. 정부는 통치 기구 내에서 시민들이 대표될 수 있도록 적극적인 정책을 펼쳐야 합니다. 또한 정치인들의 불만은 해로운 이념에 빠지는 대신 다양한 민주주의 정당에 가입함으로써 해소될 수 있을 것입니다."
 AST_the_pacific_pact: "태평양동맹"
 AST_the_pacific_pact_desc: "1934년 라이온스의 태평양 계획은 호주와 주요 아시아 국가 간의 접촉을 확립하여, 우리가 더 이상 영국 관료들에게 의존하지 않고도 우리의 이해관계를 대변할 수 있도록 했습니다. 이 관계를 이용하여 아시아 강국들로부터 호주에 대한 불가침을 보장받을 수 있다면, 그것이야말로 우리의 외교가 지향해야 할 궁극적인 목표일 것입니다. 어려운 과제일 수도 있지만, 충분히 가치 있는 일입니다."
 AST_a_collapsing_league_of_nations: "붕괴하는 국제연맹"
 AST_a_collapsing_league_of_nations_desc: "국제연맹은 붕괴하고 있습니다. 좋은 뜻으로 시작된 시도였으나, 안타깝게도 비현실적인 희망에 뿌리를 둔 체제였습니다. 무력으로 견제할 수 없는 상황에서의 제재 정책은 공허한 몸짓에 그쳤을 뿐입니다. 우리는 재무장을 시작해야 합니다."
 AST_department_of_munitions: "군수 부서"
 AST_department_of_munitions_desc: "전선에 있는 병력에 제대로 보급하기 위해서는, 군수품 생산 속도를 높여야 합니다. 군수 부서를 신설함으로써 방산 제품 생산에 대한 감독을 강화할 수 있습니다."
 AST_call_for_a_referendum: "국민투표 요구"
 AST_call_for_a_referendum_desc: "우리는 연방 정부의 통제력을 강화하기를 원하지만, 먼저 유권자들의 승인이 필요합니다. 그들의 동의를 얻으려면 국민투표를 실시해야 합니다."
 AST_rural_concessions: "농촌의 양보"
 AST_rural_concessions_desc: "농촌 지역 대표로 구성된 지역당은 단독으로 정권을 잡을 만큼의 표를 얻지 못하지만, 호주 정치에 그들의 영향력을 받아들이면 현재 집권 정당인 우리가 추가적인 지지를 얻을 수 있습니다."
 AST_rural_concessions_tt: "중점이 완료되면 \n§Y$AST_country_party_influence_uap$§!이 집권당의 득표율을 증가시킬 것입니다."
 AST_solidarity_by_the_empire: "제국과의 연대"
 AST_solidarity_by_the_empire_desc: "지금까지 대영제국은 전쟁과 평화 양쪽 면에서 우리를 이끌어 왔습니다. 우리는 앞으로도 이들의 조언을 소중히 여기고 잠재적 분쟁에 대비하기 위해 협력해야 합니다."
 AST_solidarity_by_the_empire_modifier: "제국과의 연대"
 AST_wool_agreement: "양모 협정"
 AST_wool_agreement_desc: "양모는 호주의 가장 중요한 상업 생산품 중 하나이며, 양모 수출은 수익만이 아니라 수입국과의 관계 개선에도 기여합니다. 그러나 영국은 군복 제작 및 양모가 부족한 국가와의 협상을 위하여 호주의 양모를 전량 요구하고 있습니다. 우리는 영국의 요구에 응할 것입니다."
 AST_australian_war_cabinet: "호주 전시 내각"
 AST_australian_war_cabinet_desc: "영국이 요구한 바와 같이, 우리는 우리만의 전시 내각을 구성할 것입니다. 이렇게 하면 전시 내각이 오로지 국가 안보에만 전념할 수 있어, 효과적이고 전략적인 판단을 내릴 수 있게 될 것입니다."
 AST_singapore_strategy: "싱가포르 전략"
 AST_singapore_strategy_desc: "싱가포르 전략은 호주 방위 정책의 핵심이며, 태평양에 주둔 중인 영국 해군 함선들의 기지인 만큼 싱가포르 영토는 그 자체로 매우 중요합니다. 우리는 영국이 방어 시설을 추가로 건설하도록 설득하면서, 자체적으로 호주 해군의 역량을 강화할 것입니다."
 AST_singapore_strategy_tt: "§Y180§!일 후(§Y싱가포르§!):\n §G2§!개의 §Y공군기지§!를 추가합니다.\n §G2§!개의 §Y해군기지§!을 추가합니다.\n §G1§!개의 §Y해안 요새§!를 추가합니다."
 AST_british_war_cabinet: "영국 전시 내각"
 AST_british_war_cabinet_desc: "전쟁이 발발했으며, 영국은 연합군의 전쟁을 효율적으로 수행할 수 있도록 전시 내각을 구성했습니다. 영국은 이 문제에 관한 우리의 견해를 듣기 위해 우리도 소집했으며, 이에 따라 총리는 호주의 이해관계를 대변하기 위해 출발할 예정입니다."
 potential_consequence_tt: "§Y잠재적 결과§!:\n"
 AST_british_pacific_fleet: "영국 태평양 함대"
 AST_british_pacific_fleet_desc: "영국의 태평양 주둔은 남쪽으로 해상 지배력을 확장하는 적 함선들을 억제하고 방어하는 데 매우 중요합니다. [Root.GetFactionName]의 일원으로서, 우리는 연안 해역을 보호하기 위한 합동 지휘 구조를 구축하기 위하여 조치를 취할 것입니다."
 AST_all_dressed_up: "완전무장"
 AST_all_dressed_up_desc: "호주 군인들이 영국의 전쟁에 참전한다면, 영국 공장들이 그들에게 장비를 제공해야 합니다."
 AST_overseas_loyalties: "해외 충성도"
 AST_overseas_loyalties_desc: "우리는 해외의 전쟁에 계속해서 기여하며, 호주 군인들에게 낯선 영토란 없다는 것을 다시 한번 증명할 것입니다. 전쟁이 우리를 찾아오는 것이 아닙니다. 우리가 전쟁을 찾아가는 것입니다."
 AST_the_ultimate_overseas_duty: "궁극의 해외 임무"
 AST_the_ultimate_overseas_duty_desc: "영국의 총리는 직무를 제대로 수행하지 못해 내각 구성원들 사이에서도 불신이 확산되었습니다. 멘지스는 영국 전시 내각 회의 참석을 통해 강렬한 인상을 남겼고, 이제 일각에서는 그가 영국에 더 나은 선택일지도 모른다는 의견이 나오고 있습니다. 그가 영연방의 통제권을 얻게 된다면, 우리는 멘지스의 [AST.GetName]에 대한 충성심을 활용하여 권위를 강화할 수 있을 것입니다."
 AST_the_ultimate_overseas_duty_tt: "\n§Y$AST_robert_menzies$§!(이)가 §Y[ENG.GetNameDef]§!의 지도자가 된다면, 우리는 §Y$AST_a_change_of_authority$§! 중점을 통해 §Y$autonomy_associated_dominion$§!이 될 수 있습니다."
 AST_pleading_britain: "영국에 간청하기"
 AST_pleading_britain_desc: "전쟁은 분명히 다가오고 있으며, 우리는 두려움에 떨고 있습니다. 우리의 ANZAC 정신과 호주 군인들의 명성에는 실례가 되겠지만, 호주의 전쟁 역량은 [ENG.GetName]의 지원 없이는 금세 바닥날 것입니다. 총리는 가능한 한 빨리 [ENG.GetLeader]에게 전보를 보내야 합니다."
 AST_bound_once_more: "한 번 더 연대한다"
 AST_bound_once_more_desc: "우리의 길은 갈라졌지만, 다시 합쳐질 것입니다. [ENG.GetNameDefCap](와)과 [AST.GetName](은)는 모두 국가적 변화를 겪고 있지만, 이로 인해 발생한 거리는 의도하지 않은 부정적인 결과일 뿐입니다. 적어도 우리 쪽에서는 그렇습니다. 우리는 다시 동맹을 맺고, 변화하는 국가가 겪는 장애물들을 하나로 뭉쳐서 극복할 것입니다."
 AST_eng_to_ast_faction_tt: "§Y[ENG.GetName]§! 및 그 종속국들이 §Y[AST.GetFactionName]§!에 가입합니다."
 AST_faction_leader_tt: "§Y[AST.GetFactionName]§! 세력의 맹주국으로 설정"
 AST_eng_as_faction_leader_tt: "\n([ENG.GetFlag]§Y[ENG.GetName]§!) $AST_faction_leader_tt$."
 AST_australian_command: "호주 사령부"
 AST_australian_command_desc: "[ENG.GetNameDef]에게도 호주의 국방 및 안보의 중요성이 분명해짐에 따라, 양국 합동군의 재편성이 필요합니다. 더 많은 영국군을 호주의 지휘하에 배치하면 전쟁을 한층 더 효율적으로 수행할 수 있을 것입니다."
 AST_taking_the_helm: "운전대 잡기"
 AST_taking_the_helm_desc: "우리의 영향력이 동남아시아 전역으로 확장되고 있으므로, 이를 방어하기 위해서는 해군력 증강이 필요합니다. 우리는 호주 왕립해군에 대한 지속적인 투자를 최우선 과제로 삼고, 동쪽 해역에 대한 통제권을 확보할 것입니다."
 AST_eastern_focus: "동쪽의 중점"
 AST_eastern_focus_desc: "영국의 전쟁이 곧 호주의 전쟁이라면, 호주의 전쟁 또한 영국의 전쟁입니다. 일본의 침략은 오래전부터 부인할 수 없는 현실이었으며, 우리는 더 이상 전쟁이 우리에게 닥칠 때까지 기다리는 현재의 소극적인 태도를 용납하지 않을 것입니다. 우리는 일본에 호주의 결의가 무엇인지 보여줄 것이며, 영국은 가장 대담한 선언, 즉 선전포고를 통해 그 의리를 보여줄 것입니다."
 AST_eastern_focus_tt: "\n이 임무는 §Y[ENG.GetNameDef]§!(이)가 §Y[JAP.GetNameDef]§!에 즉시 선전포고를 할 수 있게 하며, 180일 이내에 선전포고를 하지 않을 경우 선전포고를 강제할 수 있게 합니다. §Y[ENG.GetNameDefCap]§!(은)는 호주의 방위 건설 자금을 지원함으로써 임무 완료일을 연기할 수 있습니다."
 AST_holding_the_battlefield: "전장 사수"
 AST_holding_the_battlefield_desc: "수많은 호주 군인이 해외에서 전사했지만, 그들의 공적은 영국군의 공적으로만 간주되었습니다. 우리는 평화 회담에서 [ENG.GetNameDef](와)과 동등한 수준으로 더 큰 발언권을 가져야 합니다. 그렇지 않으면 우리의 협력이 계속될지는 미지수입니다."
 AST_holding_the_battlefield_tt: "§Y[ENG.GetNameDef]§!(와)과의 평화 회담에서 §Y괴뢰국§! 및 §Y주 이양§! §Y비용 감소§!."
 AST_a_change_of_authority: "권위의 변화"
 AST_a_change_of_authority_desc: "순종적인 종속국에서 존경받으며 적극적인 국가로 성장한 호주는 이제 세계 강대국으로 올라가기 위한 마지막 단계를 밟을 때입니다. [AST.GetFactionName]의 맹주국으로서, 우방국들은 우리를 존경하며 적국들은 우리를 두려워할 것입니다. 굳건히 버티고 맞서 싸운다면, 호주는 결코 굴복하지 않을 것입니다."
 AST_a_change_of_authority_tt: "§Y[ROOT.GetName]§!(이)가 이제 선전포고를 할 수 있습니다. \n §Y[ROOT.GetName]§!(은)는 이제 참전 요청을 거부할 수 있습니다.\n §Y[ROOT.GetName]§!(은)는 더 이상 더 이상 평화 점수를 종주국에 양도하지 않습니다."
 AST_reinforcements: "증원"
 AST_reinforcements_desc: "우리는 개발이 많이 되지 않은 북부 지역에 방어 시설과 공군기지를 건설하여 방어 태세를 갖추도록 할 것입니다."
 AST_weekly_stability_tt: " 매주 안정도: §G+1.00%§!"
 AST_ending_overseas_conscription: "해외 징병 종식"
 AST_ending_overseas_conscription_desc: "우리 군인들은 즉시 외국 땅에서 철수해야 합니다. 그들은 지금 본국에 필요합니다."
 AST_unlocking_conscription_1903_tt: "§Y징병법§! 잠금 해제에 필요합니다."
 AST_unlocking_further_conscription_tt: "§Y광범위한 징병§! 또는 §Y무제한적 복무§!에는 다음 중점 중 하나도 필요합니다: §Y$AST_british_pact$§!(파시스트), §Y$AST_refuse_british_wars$§!(파시스트), §Y$AST_toe_the_line$§!(파시스트), §Y$AST_from_picket_line_to_front_line$§!(공산주의자), §Y$AST_part_with_colonizer$§!(공산주의자)."
 AST_unlocking_conscription_tt: "§Y$AST_invoke_the_1903_defence_act$§! 또한 보유 중이라면 남은 모든 §Y징병법§!이 잠금 해제될 것입니다."
 AST_an_uncle_for_father_figure: "아버지 같은 삼촌"
 AST_an_uncle_for_father_figure_desc: "우리에게는 현대식 무장이 부족하므로 [USA.GetName]에게 보급을 요청할 것입니다."
 AST_seven_million_britishers: "7백만 명의 영국인"
 AST_seven_million_britishers_desc: "비록 [ENG.GetLeader](은)는 우리에게 어떤 약속도 하지 않으려 했지만, 우리는 결국 그와 영국이 [AST.GetNameDef]에 보여줄 헌신을 믿을 것입니다. 우리는 겨우 7백만 명의 영국인일 뿐이기 때문입니다."
 AST_seven_million_britishers_reinforcements_tt: "\n§Y$AST_reinforcements$ 미완료 시§!:"
 AST_seven_million_britishers_conscription_tt: "\n§Y$AST_ending_overseas_conscription$ 미완료 시§!:"
 AST_seven_million_britishers_uncle_tt: "\n§Y$AST_an_uncle_for_father_figure$ 미완료 시§!:"
 AST_we_endured: "우리는 견뎌냈다"
 AST_we_endured_desc: "다가올 분쟁에 대한 예측은 처음에는 압도적이었지만, 이를 계기로 국방력 강화를 가속함으로써 결국에는 그 목적을 달성했습니다. 우리는 견뎌냈고, 앞으로도 계속 견뎌낼 것입니다. 우리는 이제 우리의 궁극적인 목표, 즉 전쟁에서의 승리에 모든 역량을 집중하고 있습니다."
 AST_under_the_rule_of_canberra: "캔버라의 통치하에"
 AST_under_the_rule_of_canberra_desc: "태평양 국가 간에 긴장이 고조되어 우려스러운 상황이며, 영국은 자국의 전쟁에 전념하고 있어 우리를 지원하러 올 여력은 없어 보입니다. 만약 태평양과 인도양의 국가들을, 캔버라를 중심으로 운영하는 방식으로 영연방을 재건한다면, [ENG.GetNameDef] 없이도 하나의 전선으로 모두 단결할 수 있을 것입니다."
 AST_its_fight_work_or_perish: "싸우거나 일하라, 안 그러면 사라지리라"
 AST_its_fight_work_or_perish_desc: "전쟁은 시작되었고, 남은 것은 단 하나입니다. 바로 우리가 전쟁에 대비되어 있음을 증명하는 것입니다."
 AST_no_foreign_battlefields: "외국 전장은 없다"
 AST_no_foreign_battlefields_desc: "오랜 시간이 걸렸지만, 마침내 정부는 어떠한 시민에게도 외국 전장에서의 복무를 강요하지 않을 것임을 선포할 것입니다."
 AST_no_foreign_battlefields_modifier: "외국 전장은 없다"
 AST_platypus_modifier: "오리너구리를 선물함"
 AST_aerial_defense: "공중 방어"
 AST_aerial_defense_desc: "우리가 세계 강대국과 동등한 해군을 보유할 여력이 없는 것은 사실이지만, 적어도 우리를 상대로 투입될 어떤 항공 전력에도 맞설 만한 공군력은 유지할 수 있습니다."
 AST_ratify_westminster_adoption_act: "웨스트민스터 헌장 도입에 관한 법률 비준"
 AST_ratify_westminster_adoption_act_desc: "오래된 정책의 변화가 논란을 불러일으킬 수 있지만, 웨스트민스터 헌장 도입에 관한 법률 비준은 이미 한참 전에 이루어졌어야 했습니다. 우리는 어떤 전쟁이 우리의 전쟁인지를 스스로 선택해야 합니다."
 AST_ratify_westminster_adoption_act_tt: "£GFX_trigger_no 참전 요청 거부 가능"
 AST_administer_the_mandate: "위임통치령 관리"
 AST_administer_the_mandate_desc: "1920년부터 국제연맹 위임통치령으로서 호주가 뉴기니를 통치해 왔고, 파푸아는 호주 연방 수립 이후 거의 줄곧 [AST.GetName]의 해외 영토였으므로, 파푸아뉴기니의 동부 지역은 [AST.GetName]의 핵심 영토에 편입되는 것이 자연스러운 절차입니다. 이제 국제연맹이 해체되었으므로, 이러한 연방 재편을 추진할 수 있는 기회가 열렸습니다."
 AST_a_rational_request: "합리적인 요청"
 AST_a_rational_request_desc: "싱가포르 전략은 이론상으로는 타당하지만, 이론상으로만 그렇습니다. 결국은 헨리 윈터를 비롯한 많은 이들의 강경한 주장이 옳았습니다. 태평양 전쟁이 발발할 때 영국은 자국 본토에서 전쟁에 집중할 가능성이 높고, 따라서 영국의 원조를 중심으로 한 전략은 실효성이 없을 것입니다. 우리는 싱가포르의 통제권을 요청하여 우리 스스로 해양 방어를 책임지도록 할 것입니다."
 add_trait_to_theorist_tt: "§Y이론가§!에 특성 추가:"
 AST_volunteers: "자원 참전"
 AST_volunteers_desc: "선택권이 있다는 것이 중요합니다. 참전 요청을 거부할 수 있다는 것은, 호주가 항상 거부할 것이라는 의미는 아닙니다. 호주 국민은 자국에서든 해외에서든 옳은 일을 위해 싸울 수 있는 모든 권리를 가져야 합니다."
 AST_until_the_tide_of_battle_swings: "전세가 역전될 때까지"
 AST_until_the_tide_of_battle_swings_desc: "공식 성명을 통하여, 우리는 더 이상 우리 코앞에서 일어나고 있는 위협을 무시할 수 없음을 분명히 밝힐 것입니다. 우리는 태평양 전쟁을 일반적인 분쟁의 일부로 취급하는 정책을 받아들일 수 없습니다. 호주는 즉시 침공에 대비해야 합니다."
 AST_walls_and_whispers: "장벽과 속삭임"
 AST_walls_and_whispers_desc: "뚫리지 않는 장벽과 면밀한 정보 수집은 국가 안보에 막대한 잠재력을 제공합니다. 국토 전역에 걸쳐 더욱 견고한 기반 위에 육지와 해안 방어를 구축하면서, 그 안에 정보기관 본부를 설립하기 위한 조치를 취해야 합니다."
 AST_united_states_as_our_keystone: "미합중국이 우리의 핵심"
 AST_united_states_as_our_keystone_desc: "우리는 영국이 직면한 문제들을 알고 있습니다. 우리는 힘의 분산이 위험하다는 사실을 알고 있지만, 호주가 빠지더라도 영국은 계속해서 버틸 수 있다는 것도 알고 있습니다. 따라서 호주는 빠지지 않을 것이며, 미합중국을 핵심으로 삼아 계획을 수립하기 위해 모든 역량을 집중할 것입니다."
 AST_liberty_loans: "자유 공채"
 AST_liberty_loans_desc: "일각에서는 역대 최고의 재무장관이라고까지 평가하는 벤 치플리는, 전시 경제를 관리할 능력을 이미 입증했습니다. 그의 권고에 따라 우리는 국민들이 개인의 잉여 소득을 저축으로 전환하고 전시 공채에 투자하도록 장려할 것입니다."
 AST_inevitably_independent: "불가피한 독립"
 AST_inevitably_independent_desc: "통합호주당은 항상 영국 시민권을 소중히 여겨왔지만, 호주의 이해관계에 대한 [ENG.GetNameDef]의 무관심으로 인해 우리는 독립을 선언하고 자국 방위를 우선시하는 수밖에 없었습니다. 이제 영국의 전쟁에 대한 참전이 자연스럽게 논쟁거리가 되지 않게 되면서, 반충성파조차도 정부의 방침에 따르려는 경향이 강해졌습니다. 따라서 광범위한 징병에 대한 저항도 줄어들 것입니다."
 AST_bring_on_the_giant: "거인 불러오기"
 AST_bring_on_the_giant_desc: "마침내 통일된 자치 국가가 된 우리는, 곧 우리의 용맹을 시험받게 될 것입니다. 태평양 건너편은 우리와 이해관계를 공유하는 것으로 보이며, 잘 발달된 군수산업을 보유한 [USA.GetNameDef](은)는 우리 군대에 풍부한 물자를 임대함으로써 자국과 호주 모두에 큰 이익을 가져다줄 수 있을 것입니다."
 AST_bring_on_the_giant_tt: "  §Y[USA.GetNameDefCap]§!(이)가 동의할 경우:\n 국가 비축량에 §Y수송선§!이 §Y+50§! 추가됨"
 AST_allied_after_all: "그래도 동맹"
 AST_allied_after_all_desc: "비록 호주의 독립은 불가피했지만, 우리의 옛 종주국과의 모든 협력은 계속될 것입니다. 우리는 여전히 [ENG.GetFactionName]에 의리를 지킬 것이지만, 세력 내에서 더 큰 영향력을 행사하는 것을 목표로 삼을 것입니다."
 AST_the_pacific_resistance: "태평양 저항군"
 AST_the_pacific_resistance_desc: "마침내 호주의 독립이 이루어졌으니, 이제 영국의 전쟁에서 벗어나는 것은 당연한 일입니다. 대신에 [USA.GetNameDef](와)과의 협동을 추구함으로써, 우리는 호주의 이익을 중시하는 공동 지휘 전략을 수립하는 동시에, 우리 자체의 방위 산업과 그 확장을 완전히 통제할 수 있습니다."
 AST_the_pacific_resistance_tt1: "§Y호주§!가 §Y[USA.GetFactionName]§!에 합류합니다."
 AST_the_pacific_resistance_tt2: "§Y[USA.GetName]§!(이)가 §Y태평양 저항군§!에 합류합니다."
 AST_conscription_at_last: "결국은 징병"
 AST_conscription_at_last_desc: "독립은 달콤합니다. 이제 우리는 스스로의 방어를 우선시할 수 있는 힘을 갖게 되었기 때문입니다. 하지만 그 힘에는 책임도 따릅니다. 의무 징병제를 가볍게 확대해서는 안 되지만, 전쟁이 눈앞에 닥친 이상 이제는 필요한 조치가 되었습니다."
 AST_equal_training: "동등한 훈련"
 AST_equal_training_desc: "동맹국과의 협력은 아무 생각 없이 이루어지는 것이 아니라, 세심하게 조율해야 하는 것입니다. 호주는 [ROOT.GetFactionName]에 속한 국가들을 위하여 합동 훈련 캠프를 주도적으로 조직하고, 모든 병사가 똑같이 엄격한 훈련을 받을 수 있도록 보장해야 합니다."
 AST_a_northern_barrier: "북방 방어선"
 AST_a_northern_barrier_desc: "적군은 북쪽에서 다가오고 있으며, 그 앞에는 준비되지 않은 작은 국가들이 자리하고 있습니다. 적군은 이들을 마음대로 공격하고 결국에는 우리 코앞까지 도달할 수도 있습니다. 만약 우리가 [INS.GetNameDef](와)과 연합하여 통일된 방어선을 구축한다면, 적군을 저지할 기회가 아직 남아 있을지도 모릅니다."
 AST_demand_resources: "자원 통제권 요구"
 AST_demand_resources_desc: "팽창주의 침략자들은 인도차이나의 영토뿐만 아니라, 거기 매장된 자원에도 눈독을 들이고 있습니다. 만약 그 풍부한 자원이 적의 손에 넘어간다면 전쟁은 더욱 길어지겠지만, 우리 손에 들어온다면 전쟁을 종식시키는 데 도움이 될 수 있습니다. 우리는 이 자원에 대한 통제권을 요구할 것입니다. 만약 자원 소유자들이 협조를 거부한다면, 그들도 적과 다를 바 없습니다."
 AST_demand_resources_tt: "동남아시아 국가들로부터 자원 분배를 요청할 수 있는 §Y$AST_resource_acquisition_cat$§! 결정을 잠금 해제합니다."
 AST_reclaim_the_lost_territory: "실지 수복"
 AST_reclaim_the_lost_territory_desc: "호주 식민지들이 연방으로 통합되는 과정에서 뉴질랜드는 결국 참여하지 않기로 결정했습니다. 하지만 그 후에도 헌법은 뉴질랜드를 호주 연방의 잠재적 가입국 중 하나로 정의하며 가입 가능성을 열어두고 있습니다. 우리는 동쪽 이웃 국가들에 이 사실을 상기시키고, 현재의 세계정세에서는 단결이 필요함을 주장할 것입니다."
 AST_reclaim_the_lost_territory_tt: "([NZL.GetFlag]§Y[NZL.GetName]§!) 모든 육군, 해군, 공군 병력을 §Y[AST.GetNameDef]§!에 이양합니다."
 AST_australia_first: "호주 제일주의"
 AST_australia_first_desc: "중앙당의 열렬한 극우적 사상은 1935년 해산과 함께 금방 사그라들었습니다. 그러나 사업가이자 정치 활동가인 윌리엄 존 마일스의 사상에서 비롯된 새로운 운동이 시작되었습니다. 하지만, 이 사상을 실제의 움직임으로 바꾸기 위한 조치가 취해지지 않는다면, 이 사상은 싹튼 속도만큼 빠르게 사그라들 것입니다. 그러므로 이제 조치를 취해야 합니다."
 AST_pankhurst_walsh: "아델라 팽크허스트 월시"
 AST_pankhurst_walsh_desc: "호주 제일주의 운동의 공식 창립 모임에서, 우리는 아델라 팽크허스트 월시를 회장으로 임명해야 합니다. 호주 제국 여성 조합의 설립자인 팽크허스트 월시는 런던에 본부를 둔 여성 조합과 긴밀한 관계를 유지하면서 오랫동안 영국 시민권의 가치를 옹호해 왔습니다. 이러한 가치는 우리 운동의 핵심 원칙, 즉 영국과의 지속적인 관계 유지를 형성할 것입니다."
 AST_stephensen: "P.R. 스티븐슨"
 AST_stephensen_desc: "호주 제일주의 운동 공식 창립 모임에서, 우리는 P.R. 스티븐슨을 회장으로 임명해야 합니다. 윌리엄 존 마일스의 문학 고문이었던 스티븐슨은 그의 스승과 마찬가지로 고립주의적이고 민족주의적인 견해를 가지고 있었습니다. 이러한 견해는 영국으로부터의 독립과 호주 문화의 통일이라는 우리 운동 헌장의 두 가지 핵심 원칙을 형성하게 됩니다."
 AST_stephensen_tt: "\n§Y호주 제일주의 운동§!의 회장이 누구로 선택되느냐에 따라 앞으로의 가능한 행동이 결정됩니다."
 AST_a_growing_womens_guild: "성장하는 여성들의 조합"
 AST_a_growing_womens_guild_desc: "1928년 설립 이후, 호주 제국 여성 조합은 국가의 경제 문제 해결을 위한 산업 협력을 옹호해 왔습니다. 국가의 이익을 위해 시민들은 정부를 지원해야 하며, 정부에 대항하는 행동을 해서는 안 됩니다. 팽크허스트 월시가 호주 제일주의 운동의 회장이므로, 우리는 이 정치 운동을 통해 이러한 메시지를 더욱 널리 퍼뜨릴 수 있을 것입니다."
 AST_realize_the_value_of_british_citizenship: "영국 시민권의 가치 깨닫기"
 AST_realize_the_value_of_british_citizenship_desc: "[ENG.GetNameDefCap](은)는 [AST.GetName]의 종주국으로 있으면서 오랫동안 우리 국가를 보호하는 방패이자 길잡이 역할을 해왔습니다. 우리는 영국에서 왔으며, 영국의 일부로 남을 것입니다. 영국이 계속해서 우리에게 제 역할을 해준다면 말입니다."
 AST_the_bolsheviks_counterforce: "볼셰비키의 대항 세력"
 AST_the_bolsheviks_counterforce_desc: "수사국은 수십 년 동안 반체제 단체의 활동을 조사해 왔습니다. 좌익의 위협을 진압하기 위한 수사국의 활동은 매우 중요하며, 결코 소홀히 여겨져서는 안 됩니다. 호주 제일주의 운동에 반대하는 자들이 대신에 우리의 성장을 저지하는 데 전념하고 있기 때문입니다. 우리는 호주 정보기관 내에 자리를 확보하여, 국가 안보에 대한 진정한 위협이 우선순위에 놓도록 할 것입니다."
 AST_public_meetings_tt: "회원들을 동원하고 파시즘 지지도를 높이는 §Y호주 제일주의 운동§! 결정을 잠금 해제합니다."
 AST_rile_up_veterans: "참전용사 자극"
 AST_rile_up_veterans_desc: "대공황이 시작되자, 제1차 세계 대전 참전용사들은 공산주의의 성장에 맞서기 위해 극우 준군사 단체들을 결성했습니다. 비록 그 단체들은 해체되었지만, 과거 구성원들은 사라지지 않았습니다. 호주 제일주의 운동은 그들을 흡수하여, 반공주의의 횃불이 꺼지지 않도록 할 것입니다."
 AST_eureka_stockade_monument_rally: "유레카 방책 기념집회"
 AST_eureka_stockade_monument_rally_desc: "1854년 유레카 방책 전투에서, 호주 금광 채굴업자들은 과도한 채굴 허가 비용과 금광에 대한 세금 부과에 항의하며 식민주의 세력에 맞서 격렬하게 저항했습니다. 당시에 영국의 지배에 대한 불만은 분명했고, 지금도 마찬가지입니다. 우리는 전투 기념비에 모여 영국으로부터의 분리를 위해 결집할 것입니다."
 AST_australian_pivot_modifier: "호주의 전환점"
 AST_well-being_of_the_community: "공동체의 복지"
 AST_well-being_of_the_community_desc: "삶과 가족에 대한 기독교적 이상은 호주 국민들에게 높이 평가되어야 합니다. 그러나 최근 몇 년간의 저출산으로 인해 이러한 이상이 충분히 존중받지 못하고 있다는 것은 부인할 수 없는 사실입니다. 공동체의 복지를 위해, 우리는 가족생활을 장려하는 캠페인을 시작할 것입니다."
 AST_covert_networks: "비밀 연결망"
 AST_covert_networks_desc: "호주 제일주의가 수사국 내에서 활동하고 있으므로, 우리는 [ENG.GetNameDef] 내의 뜻을 같이하는 운동 단체들과 국경을 초월하여 협력할 것입니다. 우리의 종주국과의 동맹은 또 다른 방식으로 우리에게 도움이 될 수 있습니다. 바로 이념적으로 일치하는 동맹국들과 은밀하게 접촉하고 정보 역량을 확장하는 것입니다."
 AST_refuse_british_wars: "영국의 전쟁을 거부"
 AST_refuse_british_wars_desc: "대전쟁의 갈리폴리 전투는 [ENG.GetNameDef](이)가 우리 원정군을 얼마나 무모하게 대우하는지 여실히 보여주었으며, 그 이름 아래 다시 해외 전쟁에 나선다는 발상은 상상조차 할 수 없는 일입니다. 호주인은 더 이상 영국군의 지휘 아래 피를 흘리지 않을 것을 요구하며, 이로 인해 정부는 행동을 취해야만 합니다. 웨스트민스터법은 비준될 것입니다."
 AST_walls_like_uluru: "울루루 같은 장벽"
 AST_walls_like_uluru_desc: "호주는 그 자체로 하나의 대륙입니다. 우리가 제국의 방패 없이 스스로를 지키려면, 우리의 방패를 만들어야 합니다. 해안선은 강화되고, 항구는 요새화되며, 이 국가를 손쉬운 정복 대상으로 여기는 자들에게는 접근로가 매우 위험해질 것입니다."
 AST_at_the_gates: "관문 앞에서"
 AST_at_the_gates_desc: "세계는 전쟁으로 치닫고 있으며, 호주는 이에 대비해야 합니다. 전국의 공장과 조선소는 생산 능력을 높여야 합니다. 이는 타국의 분쟁에 대비하는 것이 아니라, 우리 자신의 생존을 위한 준비입니다."
 AST_the_guild_for_the_war_effort: "전쟁 활동을 위한 조합"
 AST_the_guild_for_the_war_effort_desc: "호주 제국 여성 조합은 영국 왕실을 섬기기 위하여 설립되었지만, 그 목적이 완전히 바뀌고 있습니다. 조합이 구축한 방대한 조직망은 이제 자립적인 호주를 위한 전쟁 산업, 병원, 그리고 보급망에 집중될 것입니다."
 AST_for_the_southern_cross: "남십자성을 위하여"
 AST_for_the_southern_cross_desc: "남십자성은 영국 하늘에 있지 않습니다. 그것은 우리 하늘에 있습니다. 호주의 정체성은 실재하며, 쟁취한 것이고, 지켜낼 가치가 있는 것입니다. 런던에서 빌려오거나 멀리 있는 기관에 의해 정의되는 것이 아니라, 바로 이곳, 이 땅에서, 이 별빛 아래에서 자라나는 새로운 국가적 자부심이 만들어지고 있습니다."
 AST_through_the_gates: "관문을 지나"
 AST_through_the_gates_desc: "준비 태세는 긴급 상황으로 바뀌었습니다. 호주 산업의 모든 역량을 통해 국가 방위 프로그램이 확대되고 있습니다. 기존 시설 옆에 새로운 시설이 들어서고 있으며, 생산 목표는 상향 조정되었고, 민간 생산과 군사적 필요성 사이의 경계는 조용히 사라지고 있습니다."
 AST_toe_the_line: "규칙을 따르다"
 AST_toe_the_line_desc: "호주인들이 호황기에 누렸던 안락함은 이제 옆으로 제쳐 두어야 합니다. 배급제, 노동시간 연장, 그리고 군 복무는 독립의 대가입니다. 대가를 치르는 자들은 국가의 지원을 받게 될 것입니다. 하지만 희생을 남의 몫으로 여기는 자들에게는 국가가 관용을 베풀지 않을 것입니다."
 AST_crush_the_gates: "관문 부수기"
 AST_crush_the_gates_desc: "준비는 완료되었습니다. 호주의 산업은 이제 완전한 전시 태세에 돌입하여 생산을 국가 방위 및 국력 투사에 전적으로 집중하고 있습니다. 어떤 폭풍이 닥쳐오더라도, 호주가 그 폭풍에 맞서는 모습은 마지못해 동원되는 자치령으로서의 모습은 아닐 것입니다."
 AST_national_defense: "국가 방위"
 AST_national_defense_desc: "호주는 계획적인 투자와 국가의 방향 설정을 통해 자국의 방위를 유지할 수 있는 산업 기반을 구축해 왔습니다. 공장과 조선소는 국가의 감독하에 운영되며, 생산량은 이윤이 아닌 국가의 필요에 따라 평가됩니다."
 modify_AST_national_defense_tt: "§Y$AST_national_defense$§! 변동치:"
 AST_nauru_pact: "나우루 조약"
 AST_nauru_pact_desc: "권력 장악이라는 첫 번째 장애물이 아직 우리 앞에 놓여 있으므로 독립은 아직 멀게만 느껴집니다. 하지만 호주의 자치권 확보는 우리에게만 관련된 일이 아닙니다. 영국이 호주 제일주의에 저항하거나 결국 영연방에서 분리 독립할 경우 [GER.GetNameDef](이)가 우리의 주권을 보장해 준다면, 우리는 권력을 잡는 즉시 그들이 잃어버린 태평양 섬 중 하나인 나우루를 반환해 줄 것입니다."
 AST_australian_culture_investments: "호주의 문화 투자"
 AST_australian_culture_investments_desc: "스티븐슨은 그의 에세이 '호주 문화의 토대'를 통해 진디워로박 문학 운동의 형성에 영향을 미쳤고, 호주 문화가 최우선이 되어야 한다는 점을 분명히 했습니다. 정부는 예술가와 작가의 가치를 완전히 무시하는 듯하지만, 우리는 그러지 않을 것입니다. 진디워로박과 호주 제일주의 운동을 모두 지지하는 이들을 결집시켜 문화 발전을 촉진해야 합니다."
 AST_australian_culture_investments_tt: "\n§Y365§!일 후:"
 AST_australia_first_party_focus: "호주제일당"
 AST_australia_first_party_focus_desc: "호주 제일주의 운동의 구성원 수가 급증하였으며, 이제 더 이상 이 운동의 진격을 막을 수 없습니다. 이제 호주 대중들은 새롭게 떠오른, 가장 커다란 민족주의 세력인 호주제일당을 환영해야 합니다."
 AST_australia_first_party_req_tt: "§Y호주제일당§!이 창립되었습니다."
 AST_in_from_the_cold: "재야에서 돌아오다"
 AST_in_from_the_cold_desc: "호주제일당과 그 지지자들은 더 이상 숨을 필요가 없습니다. 오랫동안 과거의 정부들이 우리 국가를 억압해 온 부당한 처우가 마침내 드러났고, 이제 새로운 목소리가 들려야 할 때입니다."
 AST_absorb_the_uap: "통합호주당 흡수"
 AST_absorb_the_uap_desc: "통합호주당은 항상 자유주의적 성향을 유지해 왔지만, 동시에 우파 성향도 띠고 있습니다. 그러나 새로운 정당이 집권하였으므로, 통합호주당 당원들은 현 정부의 대의를 지지할 것 외에는 선택지가 없습니다. 우리는 가장 저명한 인사들과 접촉하여 그들을 호주제일당으로 영입할 것입니다."
 AST_big_business_pact: "대기업 협약"
 AST_big_business_pact_desc: "호주제일당은 국내 산업 보호를 목표로 하기 때문에, 많은 재계 거물들의 지지를 얻고 있습니다. 이들은 자신들의 수익 증대를 위한 정책을 추진하는 대가로 우리의 정치적, 군사적 목표를 지지할 것입니다."
 AST_big_business_pact_tt: "\n산업 및 건설 목표에 영향을 주는 §Y대기업 협약§! 결정을 잠금 해제합니다."
 AST_autarky: "경제 자립"
 AST_autarky_desc: "해외 무역에 대한 의존은 불안정하며, 특히 분쟁 시기에는 더욱 그렇습니다. 호주의 산업이 우선시되어야 하며, 수입품과의 경쟁에서 밀려나서는 안 됩니다. 무역법을 제한해야만 국내 경제를 보호하고 호주의 자급자족을 보장할 수 있습니다."
 AST_energy_independence: "에너지 독립"
 AST_energy_independence_desc: "해외 무역에 대한 의존은 불안정하며, 특히 분쟁 시기에는 더욱 그렇습니다. 가장 어려운 시기에도 호주가 제 기능을 유지하기 위해서는 에너지 독립이 필수적입니다. 정유소에 투자함으로써 국내 에너지 생산을 촉진할 수 있습니다."
 remove_2_offsite_dockyard: "오프맵 §Y해군 조선소§! §R2§!개 제거."
 AST_british_pact: "영국 조약"
 AST_british_pact_desc: "최근에 영연방에서 분리되었음에도 불구하고, [AST.GetName]의 이익을 위해서는 옛 모국과의 협력을 지속하는 것이 낫습니다. [ENG.GetNameDef](이)가 전 세계에 걸쳐 병력을 얇게 분산시키고 있는 상황에서, 그들의 부담을 덜어주기 위해 군사 협력을 제안하는 우리의 의지는 높이 평가되어야 합니다."
 AST_naurus_return_to_german_hands: "독일의 손에 돌아간 나우루"
 AST_naurus_return_to_german_hands_desc: "이제 호주 제일주의 운동이 완전히 국가의 권력을 장악했으니, 나우루에 대한 약속을 이행하며 독일 동맹국 또한 그쪽의 약속을 지킬 때가 되었습니다. 마침내 [AST.GetName](은)는 영연방의 속박에서 벗어나며, 영국은 이 문제에 대해 아무런 발언권도 갖지 못하게 될 것입니다."
 AST_naurus_return_to_german_hands_tt: "\"§Y나우루 조약§!\"이 활성화됩니다."
 AST_naurus_return_to_german_hands_tt_2: "\"§Y나우루 조약§!\"이 활성화 상태입니다."
 AST_the_winner_takes_it_all: "승자독식"
 AST_the_winner_takes_it_all_desc: "독일과의 협력을 위해 나우루섬을 내어주는 것이 한때는 합리적으로 보였지만, 이제는 그렇지 않습니다. 우리의 뛰어난 역량이 입증되었으므로, 우리는 솔로몬 제도와 뉴질랜드로의 확장을 추진할 것입니다. 비록 솔로몬 제도로의 확장이 나우루 협정에 대한 우리의 배신으로 이어질지라도 말입니다. 결국 솔로몬 제도는 호주의 손에 넘어가는 또 다른 독일 영토가 될 것입니다."
 AST_resist_western_intruders: "서방의 침략자들에 대한 저항"
 AST_resist_western_intruders_desc: "서방 국가들은 태평양 문제에 끊임없이 개입하려 드는 듯하지만, 이제 더 이상은 용납할 수 없습니다. 그들이 우리 해안에 도달하기 전에 우리가 먼저 그들의 해안에 도달하여, [AST.GetName](은)는 요구에 굴복하는 나라가 아님을 증명할 것입니다."
 AST_invasion_preparation_tt: "상륙 준비 시간: §G-20.0%§!"
 AST_naval_invasion_penalty_tt: "상륙 불이익: §G-20.0%§!"
 AST_expand_the_fort: "요새 확장"
 AST_expand_the_fort_desc: "서태평양은 [USA.GetNameDef](이)가 지배할 곳이 아닙니다. 미국이 영유권을 주장하는 섬들은 동아시아 국가들의 것이며, 호주의 영향력이 커지면 우리가 영유권을 주장하게 될 것입니다."
 AST_integrate_the_fort: "요새 통합"
 AST_integrate_the_fort_desc: "1920년부터 국제연맹 위임통치령으로서 호주가 뉴기니를 통치해 왔고, 파푸아는 호주 연방 수립 이후 거의 줄곧 [AST.GetName]의 해외 영토였으므로, 파푸아뉴기니의 동부 지역은 [AST.GetName]의 핵심 영토에 편입되는 것이 자연스러운 절차입니다. 이것은 호주의 문화를 통합하기 위한 다음 단계가 될 것입니다."
 AST_defying_american_interference: "미국의 개입 거부"
 AST_defying_american_interference_desc: "[USA.GetNameDefCap]의 그림자가 우리 위에 드리워져, 우리의 행동이 그들의 이익에 부합하지 않을 때마다 간섭하겠다고 위협하고 있습니다. 이처럼 막강한 세계적 강대국이 [PHI.GetNameDef] 주변에 철권통치를 펼치는 한, 동아시아 국가들은 결코 진정으로 동아시아의 일부가 될 수 없을 것입니다. [AST.GetName](은)는 어떤 외국 침략자의 권력에도 굴복하지 않을 것입니다. 필리핀은 우리의 것입니다."
 AST_the_pacific_garrison: "태평양 주둔군"
 AST_the_pacific_garrison_desc: "동남아시아와 태평양 지역의 보호는 영국의 이익에 부합하지만, 이 지역은 본토인 영국 제도에서 멀리 떨어져 있습니다. 그들이 물자를 지원해 주는 대가로, 우리는 이 지역의 방어를 책임지겠다고 제안했으며, 이를 통해 [ENG.GetNameDef](은)는 다른 곳에 역량을 집중할 수 있을 것입니다."
 AST_vichy_out_of_africa: "비시의 탈아프리카"
 AST_vichy_out_of_africa_desc: "비시 프랑스의 몰락 또는 협력은 [ENG.GetNameDef]의 주요 목표 중 하나입니다. 호의의 표시로서, [AST.GetName](은)는 프랑스령 아프리카 식민지가 정복될 때까지 함께 공격할 것입니다."
 AST_vichy_out_of_africa_tt1: "§Y비시의 탈아프리카§! 중점을 통해 §Y아프리카§!의 §Y비시 프랑스§! 영토에 대한 영유권 주장을 추가합니다.\n"
 AST_vichy_out_of_africa_tt2: "§Y비시의 탈아프리카§! 결정을 통해 §Y아프리카§!의 §Y비시 프랑스§! 영토에 대한 영유권 주장을 추가합니다.\n"
 AST_vichy_africa_claim_flag: "§Y아프리카§!의 모든 §Y비시 프랑스§! 영토에 대한 [AST.GetFlag]§Y[AST.GetName]§!의 영유권 주장이 §Y간섭 중단§!에 추가됩니다."
 AST_vichy_claim_tt: "[AST.GetFlag]§Y[AST.GetName]§!의 영유권 주장이 §Y간섭 중단§!에 추가됩니다."
 vichy_in_africa_trigger: "§Y비시 프랑스§!: 지배 중인 아무 주:\n    §Y아프리카§!에 있음"
 vichy_wargoal: "§Y비시 프랑스§!에 대한 §Y합병§! 전쟁 명분 획득."
 AST_britain_supplying_ships: "영국의 함선 지원"
 AST_britain_supplying_ships_desc: "영국 동맹국의 해안을 지키는 막중한 책임을 지고 있는 만큼, [ROOT.GetName]의 함대 확장이 필요하다는 것이 분명해졌습니다. [ENG.GetNameDefCap](이)가 우리에게 함선을 공급하는 것은 당연한 일입니다."
 AST_hand_in_glove: "한통속"
 AST_hand_in_glove_desc: "우리는 북쪽으로 확장함으로써 우리는 동남아시아의 외교와 분쟁에 대한 호주의 영향력을 확대할 수 있습니다. 이미 우리의 이익뿐만 아니라 영국의 이익도 수호할 능력이 있다는 것을 증명했으니, [ENG.GetNameDef](은)는 자신들의 외딴 영토가 우리 관할에 놓이는 것이 어째서 더 나은 선택인지 깨달아야 합니다."
 AST_claim_french_indochina: "프랑스령 인도차이나 영유권 주장"
 AST_claim_french_indochina_desc: "프랑스의 운명이 결정되지 않았으므로, 프랑스 식민지의 운명 또한 결정되지 않았습니다. 다른 국가들이 프랑스령 인도차이나를 탐욕스러운 손을 뻗어 볼 수는 있겠지만, 결코 우리보다 먼저 차지하지는 못할 것입니다."
 AST_undeniably_ours: "틀림없는 우리 것"
 AST_undeniably_ours_desc: "외교로 무엇을 얻을 수 있다고 해도, 그것만으로 모든 것을 얻을 수는 없습니다. 비시 프랑스의 국경은 취약한 상태에 놓여 있어 사실상 제안에 불과하며, 그 영토를 완전히 점령할 기회를 놓치는 것은 매우 어리석은 일입니다. 결국 전쟁을 치러야 할 때가 왔습니다."
 AST_done_meddling: "간섭 중단"
 AST_done_meddling_desc: "옛 조국에 한결같이 충성하는 [AST.GetName] 측은 당당히 영국의 전쟁을 이어가고 있습니다. 호주인들은 믿음직스러운 사람들이지만, 그렇다고 그들의 헌신을 당연하게 여겨서는 안 됩니다. [AST.GetName] 측이 ￼ [ENG.GetNameDef](을)를 위해 싸운다면, [ENG.GetNameDef] 역시 [AST.GetName](을)를 위해 싸워야 할 것입니다."
 AST_northern_advancement: "북방 진격"
 AST_northern_advancement_desc: "호주는 자국의 정치 문제에 집중하고 싶어 하지만, 우리 스스로가 위협적인 존재가 되지 않는 한 타국이 가만히 내버려둘 리가 없습니다. [INS.GetNameDefCap](은)는 우리와 마찬가지로, 유럽 침략자들이 내버려 두지않는 피해자입니다. 우리가 그 영토에 대한 영유권을 주장함으로써, 태평양 국가들은 내버려두어야 한다는 분명한 메시지를 보낼 수 있습니다."
 AST_soothing_australian_fears: "호주의 공포 달래기"
 AST_soothing_australian_fears_desc: "일부 정부 관료들은 호주와 일본의 협력 가능성을 믿고 있지만, 호주 국민은 그렇지 않습니다. 오랫동안 일본의 침략을 두려워해 온 국민들에게, 잠재적 침략국과 손을 잡는다는 것은 받아들이기 어려운 일입니다. 그래서 우리는 전쟁 준비를 함으로써 그들의 공포를 진정시켜야 합니다."
 AST_soothing_australian_fears_tt: "\n§Y180§!일 후:"
 AST_dividing_the_pacific: "태평양 나누기"
 AST_dividing_the_pacific_desc: "호주제일당은 [JAP.GetNameDef](와)과의 평화를 옹호하며, 대부분의 호주 시민들과는 달리 이 국가를 다가오는 위협이 아닌, 잠재적인 태평양 동맹국으로 정의합니다. [AST.GetName]의 영향력이 확대되고 있으므로 [JAP.GetName] 또한 이에 동의하는 것이 타당하며, 양국 간의 잠재적인 갈등은 발생하기 전에 해결되어야 합니다."
 AST_dividing_the_pacific_ast_gain_tt: "[GET_AST_DIVIDING_THE_PACIFIC_AST_GAIN]"
 AST_dividing_the_pacific_jap_gain_tt: "[GET_AST_DIVIDING_THE_PACIFIC_JAP_GAIN]"
 AST_dividing_the_pacific_tt1: "§G우리는 다음을 얻습니다§!:"
 AST_dividing_the_pacific_tt2: "§R상대는 다음을 얻습니다§!:"
 AST_dividing_the_pacific_tt3: "§Y[AST.GetName]§!(은)는 다음 지배 중인 영토를 할양합니다:"
 AST_against_war_and_fascism: "전쟁과 파시즘에 대항"
 AST_against_war_and_fascism_desc: "전쟁과 파시즘 대항 운동은 코민테른이 후원하는 국제적인 단체의 호주 지부로서, 반동 세력에 맞서 노동자들을 결집하는 것이 목표입니다. 이 운동은 최근 몇 년 동안 추진력을 잃었지만, 우리는 다시 한번 그 기치를 이어가야 할 책임이 있습니다."
 AST_world_peace: "세계 평화"
 AST_world_peace_desc: "전쟁과 파시즘 대항 운동이라는 단체는 독일, 이탈리아, 특히 스페인 내전 기간의 파시즘 운동의 악행을 폭로하는 '세계 평화'라는 잡지를 제작하는 데 힘써 왔습니다. 이 잡지에 실린 기사들에 고무된 자원봉사자들은 파시즘에 맞서는 싸움에 참여하기를 간절히 원하고 있습니다."
 AST_red_fred: "붉은 프레드"
 AST_red_fred_desc: "\"붉은\" 프레드 패터슨은 1934년 브리즈번 시장 선거에 출마하며 공산주의 운동계에 처음 이름을 알렸지만, 선거에서 참패를 당했습니다. 그러나 그의 야망은 사그라지지 않았고, 현재 타운스빌 시의원 선거에 출마하고 있습니다. 우리의 지지가 있다면, 그는 공직에 당선된 최초의 공산주의자가 될 수 있을 것입니다."
 AST_workers_defence_corps_sparks_anew: "노동자 방위군의 새로운 불꽃"
 AST_workers_defence_corps_sparks_anew_desc: "노동자 방위군은 원래 피켓 시위와 파업을 보호하기 위해 결성되었습니다. 뉴 가드와 같은 단체들의 공격성이 증가함에 따라, 노동자 방위군은 다시 더 나은 권리와 기회를 요구하는 시위자들을 보호하는 방패로서 역할을 수행하기 위해 재편성되었습니다."
 AST_a_controversial_recruitment: "인재 영입 논란"
 AST_a_controversial_recruitment_desc: "모리스 블랙번은 억압적인 고용주들을 상대로 한 법적 투쟁에서 노동자들의 권리를 변호한 것으로 유명한 사회주의 성향의 변호사입니다. 그는 노동당 소속이지만, 보다 급진적인 전쟁과 파시즘 대항 운동과의 연관성 때문에 그의 충성심에 대한 의문이 제기되고 있습니다."
 AST_from_picket_line_to_front_line: "피켓 라인에서 최전선까지"
 AST_from_picket_line_to_front_line_desc: "노동자 계급 해방에 반대하는 자들의 위협 전술이 더욱 공격적으로 변하고 있으므로, 우리 또한 그에 대응하여 방어 체계를 진화시켜야 합니다. 이러한 사건이 발생할 때마다 노동자들은 더욱 결의를 다지고 있으며, 점점 더 많은 사람들이 방위군에 합류하기 위해 앞으로 나서고 있습니다."
 AST_pig_iron_protests: "선철 항의"
 AST_pig_iron_protests_desc: "우리 항만 노동자들은 여러 면에서 정부에 동의하지 않으며, 특히 전쟁 중인 국가에 선철을 판매하는 것을 반대합니다. 호주인들은 침략에 참여하거나 무고한 민간인을 공격하는 데 사용되는 장비를 운송하는 데 아무런 관심이 없으며, 따라서 [AST.GetName]도 관심이 없어야 합니다. 파업을 선언합니다."
 AST_part_with_colonizer: "식민주의자와 결별"
 AST_part_with_colonizer_desc: "우리 투쟁의 근원은 대영제국과 그들이 멀리서 우리에게 강요한 자본주의 체제에 있습니다. 더는 안 됩니다. 영국이 자국 근처의 위기에 정신이 팔린 지금, 우리는 자유롭고 독립적인 국가로서 운명을 쥐고 우리만의 길을 개척할 때입니다."
 AST_take_it_to_the_streets: "가두 시위에 나서다"
 AST_take_it_to_the_streets_desc: "노동 쟁의는 사회 변화를 강제하는 가장 강력한 수단 중 하나이며, 오직 착취만을 위해 설계된 체제에 맞서 반드시 사용해야 합니다. 지금이 바로 생산 수단을 되찾을 때입니다. 호주 노동자여, 단결하라!"
 AST_workers_educational_association: "노동자 교육 협회"
 AST_workers_educational_association_desc: "노동자 교육 협회는 노동자들에게 교육의 기회를 보장하기 위해 헌신하는 국제단체입니다. 우리도 지부를 설립해야 합니다. 진정한 기회의 균등은 교실에서 시작되기 때문입니다."
 AST_off_leash: "목줄 풀기"
 AST_off_leash_desc: "항만 노동자들은 호주 노조 활동의 중추입니다. 대륙 크기의 섬나라인 호주에서 해운 노동이 경제에서 중요한 역할을 하는 것은 전혀 놀라운 일이 아닙니다. 이제 억압의 목줄을 풀고, 산업의 바다 사나이들을 마음껏 풀어놓을 때입니다."
 AST_a_national_housing_commission: "국민주택위원회"
 AST_a_national_housing_commission_desc: "주택 문제는 오랫동안 논쟁의 대상이었습니다. 모든 사람은 지붕 아래서 살 권리가 있지만, 이 기본적인 필수품이 너무나 자주 노동자들에게 불이익을 주는 수단으로 이용되며, 주택 비용은 경제적 억압의 형태로 나타납니다. 이제 더 이상은 안 됩니다. 우리는 모두에게 공정한 주거 접근성을 요구할 것입니다."
 AST_guaranteed_employment: "고용 보장"
 AST_guaranteed_employment_desc: "사회주의는 너무나 자주 폄하되며, 동시에 도움이 필요한 사람들에게 게으르거나 의존한다는 비난이 쏟아집니다. 이러한 비난은 반드시 종식되어야 합니다. 우리가 추구하는 것은 그저 공정한 노동의 기회와 가족을 부양할 수 있는 정당한 임금입니다."
 AST_equal_pay: "동일 임금"
 AST_equal_pay_desc: "생산 수단을 소유한 사람들이 그 안에서 일하는 사람들보다 더 많은 것을 받을 자격이 있다는 것은 잘못된 통념입니다. 소유주와 경영자들이 더 열심히 일하는 것도 아니고, 본질적으로 더 숙련된 기술을 가진 것도 아닙니다. 임금을 균등화함으로써 노동의 결실을 사회 전반에 더욱 공정하게 분배할 수 있습니다."
 AST_all_for_one_one_for_all: "모두는 하나를 위해, 하나는 모두를 위해"
 AST_all_for_one_one_for_all_desc: "\"하나를 위해 모두가, 그리고 나를 위해서는 더 많이\"는 오랫동안 부르주아들의 구호였습니다. 그들의 탐욕은 끊임없이 더 많은 것을 요구하지만, 사회에 대한 환원은 점점 더 적어지고 있습니다. 부가 아래로 흘러내릴 것이라는 약속은 거짓말입니다. 부는 모두를 위해, 그리고 모두에 의해 공평하게 분배되어야 합니다."
 AST_abolition_of_private_property: "사유 재산 폐지"
 AST_abolition_of_private_property_desc: "산업의 톱니바퀴는 노동자들의 피로 기름칠되어 있습니다. 우리는 잔혹한 축적을 종식시키고 사유재산을 완전히 폐지해야 합니다. 모든 것은 각자의 능력에 따라 내어주고, 각자의 필요에 따라 받으며 공유될 것입니다."
 AST_centralized_production: "생산 중앙화"
 AST_centralized_production_desc: "시장의 원리는 혼란스럽고 불평등합니다. 진정으로 공정한 사회를 건설하려면 무엇을 누가 어디서 생산할지 결정하는 데에 국가가 중심적인 역할을 맡아야 합니다. 우리의 관료제는 꼼꼼한 기록을 유지하고 있으며 생산 할당량을 설정하는 데 가장 적합한 위치에 있습니다."
 AST_public_institutions: "공공기관"
 AST_public_institutions_desc: "사회가 제대로 기능하려면 의료, 주택, 보육, 교통 등 다양한 필수 서비스가 필요합니다. 국가는 이러한 서비스를 보편적으로 제공하여 모두가 제한 없이 이용할 수 있도록 보장해야 합니다. 사적 이익 추구라는 강박에서 벗어난다면, 이러한 체제들은 전체 국민의 필요를 충족시키기 위해 효율적으로 운영될 수 있습니다."
 AST_planned_extraction: "계획된 추출"
 AST_planned_extraction_desc: "우리는 운 좋게도 풍부한 자원을 가진 땅을 소유하고 있습니다. 우리는 이 자원을 체계적으로 추출하여 가장 필요로 하는 산업에 투자해야 합니다."
 AST_maritime_commission: "$USA_maritime_commission$"
 AST_maritime_commission_desc: "$USA_maritime_commission_desc$"
 AST_state_research_funding: "국가 연구 자금 지원"
 AST_state_research_funding_desc: "연구 기관의 효율성을 최대화하기 위해서는 국가가 주요 자금원 역할을 하고, 가장 필요한 곳에 연구 노력을 집중시키며, 정보 통제를 철저히 해야 합니다. 잘못된 사상으로 인해 시민들이 혼란에 빠지는 것은 용납할 수 없기 때문입니다."
 AST_graziers_to_industry: "목축업자에서 산업으로"
 AST_graziers_to_industry_desc: "대공황 중에 노동자들이 안정적인 삶을 찾아 농촌으로 떠나면서 도시는 텅 비었습니다. 이제 생산 수단을 장악했으니, 우리는 그들을 다시 산업 현장으로 불러들일 수 있습니다. 우리는 그들에게 국가의 요구를, 즉 산업의 용광로는 인간의 땀으로 가동된다는 점을 분명히 강조해야 합니다."
 AST_free_school_policy: "무상 교육 정책"
 AST_free_school_policy_desc: "이상적인 시민을 형성하려면 그들의 생각을 형성시켜야 합니다. 요람에서 대학까지, 국가는 우리 아이들이 무엇을 배워야 하는지 지도할 것입니다. 이렇게 함으로써 우리는 미래 세대가 사회주의 이상의 중요성과 자유 시장의 위험성... 그리고 자유로운 사고의 위험성을 이해하도록 할 수 있습니다."
 AST_free_healthcare_policy: "무상 의료 정책"
 AST_free_healthcare_policy_desc: "우리 국민은 질병과 부상으로부터 자유로워야 하며, 설령 최악의 상황이 발생하더라도 다른 사회에서처럼 불행으로 인해 궁핍해져서는 안 됩니다. 우리는 의료 서비스, 병원, 그리고 의사에 대한 보편적인 접근을 제공할 것입니다. 건강한 국민이야말로 생산적인 국민이기 때문입니다."
 AST_the_publics_australia: "대중의 오스트레일리아"
 AST_the_publics_australia_desc: "우리는 낡은 질서를 버리고 소수가 아닌 다수를 위한 국가를 건설했습니다. 산업, 노동, 자원은 이제 국민 전체를 위해 존재합니다. 이것이 바로 대중의 오스트레일리아입니다. 평등하고, 단결되어 있으며, 꺾이지 않는 국가입니다."
 # 'Cominwealth' over 'Commonwealth' is intentional
 AST_the_australian_commonwealth: "호주 공산연방"
 AST_the_australian_commonwealth_desc: "영국은 한때 영연방의 지도자를 자처했지만, 그 구상은 자본주의적 이익에 의해 오염되었습니다. 우리는 그 역할을 쟁취하여 연방의 모든 국가들을 공동의 사회주의 이상향으로 이끌 것입니다."
 AST_union_control_commonwealth: "§Y노동조합 통제§! 결정을 잠금 해제합니다. \n뉴질랜드, 말레이시아, 버마, 그리고 궁극적으로 인도까지 공산주의자 침투가 가능해집니다."
 AST_a_comrade_emancipated: "해방된 동지"
 AST_a_comrade_emancipated_desc: "전 세계의 수많은 국가들이 여전히 자본주의의 사슬에 묶여 있으며, 그 국민들은 진정한 자유를 누리지 못하고 있습니다. 그들의 해방을 돕는 것은 자유 사회주의 국가로서 우리가 가진 의무입니다. 전 세계 노동자여 단결하라, 그러면 함께 이 사슬을 벗어 던지리."
 AST_union_control_local: "§Y노동조합 통제§! 결정을 잠금 해제합니다. \n인도네시아와 필리핀에 공산주의자 침투가 가능해집니다."
 AST_comintern: "코민테른 가입"
 AST_comintern_desc: "소비에트 연방은 때때로 진정한 마르크스주의 원칙에서 벗어나기도 했지만, 여전히 국제 노동자 협회의 기수 역할을 하고 있습니다. 코민테른에 가입함으로써 우리는 사회주의의 횃불을 전 세계에 전파하기 위한 노력을 하나로 모을 수 있습니다."
 AST_comintern_tt: "§Y[AST.GetName]§!(이)가 세력을 이끌고 있다면, 해당 세력은 코민테른에 병합됩니다. 그렇지 않으면 §Y[AST.GetName]§!(이)가 단독으로 코민테른에 가입합니다."
 AST_for_greater_good: "대의를 위하여"
 AST_for_greater_good_desc: "우리가 꿈꾸는 세계 혁명은 피와 희생을 요구합니다. 너무나 많은 곳에서 사회주의의 횃불이 꺼져가고 있습니다. 우리는 이 부름에 응답하여 횃불이 꺼지지 않도록 지원해야 합니다. 결국 이것은 더 큰 선을 위한 것이기 때문입니다."
 AST_make_common_cause: "공동의 대의 만들기"
 AST_make_common_cause_desc: "우리의 지도력 아래, 연방은 자본주의의 억압하는 어둠에서 벗어나 사회주의의 빛 아래 번영하기 시작했습니다. 이 중요한 순간에, 우리는 우리의 의지가 꺾이지 않도록 하고 더 나은 내일을 향해 함께 행진해야 합니다."
 AST_the_red_pacific: "붉은 태평양"
 AST_the_red_pacific_desc: "태평양은 혁명의 이미지대로 재구성되어야 합니다. 우리는 우리 지역의 모든 섬과 해안에 사회주의 정부의 수립을 지원하고, 붉은 깃발이 해안에서 해안까지 휘날리도록 할 것입니다."
 AST_the_irish_anti-britain_pact: "아일랜드의 반영국 협정"
 AST_the_irish_anti-britain_pact_desc: "영국은 섬나라라는 지리적 이점과 강력한 해군력에 보호받으며 너무나 오랫동안 자본주의의 요새 역할을 해왔습니다. 아일랜드와 북아일랜드의 항만 노동자들을 선동하여 불안을 조장함으로써 우리는 영국의 방어선을 뚫고 아일랜드해를 건너 우리 군대가 진격할 수 있는 길을 열 수 있습니다."
 AST_stretch_the_fleet: "함대 확장"
 AST_stretch_the_fleet_desc: "영국은 여전히 막강한 함대를 앞세워 자본주의의 요새로 남아 있습니다. 이제 우리도 해군의 역량을 증강하고 그 해군으로 영국에 맞서 싸워 어느 섬이 더 큰지 세계에 보여줄 때입니다."
 AST_chinese_relations: "중국과의 관계"
 AST_chinese_relations_desc: "중국의 우리 동지들은 생존을 위한 사투를 벌이고 있습니다. 우리는 그들을 도울 수단을 가지고 있지만, 그들이 제국주의 세력에 압도당하기 전에 신속하게 행동해야 합니다."
 AST_westward_battles: "서쪽의 전투"
 AST_westward_battles_desc: "파시스트 세력이 서방을 장악하여 우리 존속의 기반을 위협하고 있습니다. 이제 코민테른과 연대하여 그들과 맞서 싸우고 우리가 건설하고 있는 노동자의 이상향을 파괴하려는 자들에게 저항해야 합니다."
 AST_strongholds: "요새"
 AST_strongholds_desc: "이 새로운 전구에서 우리의 입지를 확보하기 위해, 우리는 자본주의 제국의 심장부에 맞서는 아일랜드 동지들을 지원해야 합니다. 그들이 이전에 벌인 독립 투쟁은 우리가 세계적 분쟁의 다음 단계를 함께 준비하는 데 있어 귀중한 교훈을 제공합니다."
 AST_out_of_the_den: "소굴 밖으로"
 AST_out_of_the_den_desc: "아일랜드에는 여전히 영국의 통치에 깊은 원한을 품고 있는 사람들이 많습니다. 이제 우리의 힘을 보여주고 그들을 어둠 속에서 끌어내어, 우리 편으로 결집시켜 공동의 적에 맞서야 할 때입니다."
 AST_end_the_kingdom: "왕국의 종식"
 AST_end_the_kingdom_desc: "때가 왔습니다. 제국주의적인 자본주의의 뿌리를 공격하여 그 썩어빠진 심장을 찌를 때입니다. 대영제국 전역의 노동자 해방이 다가왔습니다. 군주제를 끝내고, 왕국을 끝내고, 억압을 끝내야 합니다. 연방의 노동자들이여, 단결하라!"
 AST_red_solidarity: "붉은 연대"
 AST_red_solidarity_desc: "중국에서는 투쟁이 계속되고 있으며, 수백만 명이 고통받고 죽어가고 있습니다. 그들의 투쟁은 우리의 투쟁이며, 우리는 가만히 있을 수 없습니다. 우리는 개입하여 그들의 짐을 함께 지고, 혁명의 불꽃이 사그라지지 않도록 해야 합니다."
 AST_red_solidarity_tt: "§Y[AST.GetName]§!(이)가 §Y[CHI.GetNameDef]§!에 맞선 §Y[PRC.GetNameDef]§!의 전쟁에 참전합니다. 더 작은 세력이 다른 쪽을 흡수하거나, 양측이 이미 동맹이라면 §Y[AST.GetName]§!(이)가 직접 전쟁에 참전합니다."
 AST_free_the_colonies: "식민지 해방"
 AST_free_the_colonies_desc: "혁명의 불길이 무너져가는 대영제국을 휩쓸고 있습니다. 식민지들은 이제 식민지가 아닌 자유 국가가 될 것입니다. 동지들이여, 일어나라! 족쇄를 벗어 던지고 혁명에 동참하라!"
 AST_free_the_colonies_tt: "§Y[AST.GetName]§!(이)가 지배하에 있는 모든 옛 영국 식민지를 통합 괴뢰국으로 격하시킵니다."
 AST_battle_of_the_ocean: "대양 전투"
 AST_battle_of_the_ocean_desc: "대양은 오랫동안 세계 무역의 동맥 역할을 해왔습니다. 이제는 투쟁을 태평양으로 확장하여 그 동맥을 끊어버릴 때입니다. 바다는 부패한 자본가들과 혁명 영웅들의 피로 붉게 물들 것입니다."
 AST_borderless_solidarity: "국경 없는 연대"
 AST_borderless_solidarity_desc: "연대. 이 단어가 전 세계 노동자들을 단결시킵니다. 어떤 국경도 우리를 갈라놓을 수 없고, 어떤 나라도 홀로 설 수 없습니다. 투쟁의 불길이 타오르는 곳이라면 어디든, 우리는 그 부름에 응답하여 해방을 위한 세계적인 투쟁에 함께할 것입니다."
 AST_an_equal_union: "평등한 연합"
 AST_an_equal_union_desc: "우리가 혁명의 깃발을 들고 있지만, 우리와 함께하는 모든 사람은 평등합니다. 이 연합 안에서 자원, 노동력, 그리고 사상은 자유롭게 공유되며, 번영이 공동으로 이루어지고 어떤 국가도 다른 국가보다 우월하지 않은 미래를 만들 것입니다."
 AST_expanding_influence: "영향력 확장"
 AST_expanding_influence_desc: "역사의 올바른 편에 서 있는 우리의 사상은 그 자체로 설득력을 가집니다. 노동자들의 낙원은 꿈이 아니라, 만들어가고 있는 현실입니다. 우리는 이 비전을 바깥으로 확장하여, 다른 이들을 초대해 함께 미래를 만들어갈 수 있습니다."
 AST_public_works: "공공사업"
 AST_public_works_desc: "대공황으로 인해 호주 경제는 심각한 위기에 처해 있습니다. 우리는 일자리 창출과 소비 회복을 위해 다양한 공공사업 계획을 시행할 것입니다."
 AST_lang_plan: "랭 계획"
 AST_lang_plan_desc: "잭 랭은 해외 채무 상환 의무를 거부하고, 대신 그 자금을 국내 경제 성장을 촉진하는 공공 사업으로 전환하겠다고 공언하며 경제 정치의 최전선에 섰습니다. 결국, 돈이 하늘에서 떨어질 일은 없으니까요."
 AST_exports_for_economic_recovery: "경제 회복을 위한 수출"
 AST_exports_for_economic_recovery_desc: "랭의 생각에 반대하는 사람들은 해외 시장과 부채를 활용하여 해외 투자와 판매를 장려하고, 수출 지향적인 경제를 통해 국내 생산, 고용, 그리고 궁극적으로 소비자 지출을 증대시켜야 한다고 주장합니다."
 AST_the_phosphate_commision: "인산염위원회"
 AST_the_phosphate_commision_desc: "대전쟁 이후 나우루는 호주, 뉴질랜드, 영국의 합동 신탁통치령이 되었습니다. 1919년, 호주의 주도로 이 섬의 모든 인산염 판매 권리가 이 신탁 통치자들에게 이전되었습니다. 우리의 지도적인 역할을 활용하면 가격 책정에 영향을 미치고 국내 시장에서 매우 경쟁력 있는 가격을 확보할 수 있습니다."
 AST_goods_standard: "제품 표준"
 AST_goods_standard_desc: "잭 랭의 경제 이론에서 핵심 원칙은 호주에서 금본위제를 폐지하고 상품본위제로 대체하는 것입니다. 상품본위제는 통화 공급량을 실제 생산된 상품의 양과 연동시켜 자본 흐름이 외부 요인이 아닌 국내 생산성에 직접적으로 연결되도록 합니다."
 AST_standard_gauge_line_to_darwin: "표준궤 철도를 다윈까지"
 AST_standard_gauge_line_to_darwin_desc: "우리는 너무나 오랫동안 북부 지역과의 제대로 된 연결망이 없었습니다. 경제에 자금을 다시 흘려보내기 위한 광범위한 공공사업 계획의 일환으로, 남부 도시와 북부를 연결하는 철도를 건설할 수 있습니다."
 AST_lang_is_right: "랭이 옳다"
 AST_lang_is_right_desc: "랭이 옳았다는 것이 증명되었습니다! 외국 채권자를 우선하지 않고 대신 우리 은행 시스템을 더욱 적극적으로 활용함으로써 상당한 자금을 확보할 수 있습니다. 이렇게 확보한 자금은 국내 경제에 투입되어 꼭 필요한 투자를 뒷받침하고 성장을 촉진할 수 있습니다."
 AST_within_reach: "범위 내"
 AST_within_reach_desc: "눈앞에 두고도 손에 넣지 못했습니다. 호주는 자원이 풍부한 나라이며, 조금만 더 깊이 파헤쳐 보면 엄청난 부가 우리 발밑에 묻혀 있습니다. 기반시설 확충으로 멀리 있는 광산까지 접근이 가능해졌고, 이제 우리는 광물 자원을 기반으로 한 호주의 번영 시대를 맞이할 문턱에 서 있습니다."
 AST_a_domestic_supply_chain: "국내 보급선"
 AST_a_domestic_supply_chain_desc: "국내 경제에 집중한 결과 중 하나는, 매우 탄력적인 생산 체계가 구축되었다는 것입니다. 모든 수준의 생산 활동이 국내에 기반을 두고 있기 때문에, 우리는 외부 충격으로부터 격리되어 있습니다."
 AST_broken_hill_propietary_company: "브로큰 힐 유한회사"
 AST_broken_hill_propietary_company_desc: "브로큰 힐 유한회사는 호주에서 가장 중요한 광업 및 강철 생산 업체 중 하나입니다. 지역 주민들에게 '빅 오스트레일리안'으로 불리는 이 회사는 업계를 지배하고 있습니다. 원자재 수요가 급증함에 따라, 이 회사는 더욱 빠른 성장을 이룰 수 있는 유리한 위치에 있습니다."
 AST_radium_hill: "라듐 힐"
 AST_radium_hill_desc: "호주 남부에서 우라늄이 발견되었고, 라듐 힐 광산은 상당한 확장 가능성을 가지고 있습니다. 이러한 새로운 기술의 가능성을 아직 완전히 밝혀내지는 못했지만, 우리가 원자력 시대의 문턱에 서 있다는 것은 분명하며, 이것이 우리가 그 시대로 들어가는 관문이 될 수 있습니다."
 AST_industrial_expansion: "산업 확장"
 AST_industrial_expansion_desc: "대공황은 지난 10년 동안 우리 국가의 경제 생산량에 큰 타격을 주었습니다. 이제 보다 직접적인 조치를 취할 정치적 의지를 갖게 되었으므로, 이 의지를 집중하여 과감하게 산업 기반을 확장하고, 일자리를 창출하고, 자원 수요를 늘리고, 시장에 더 많은 상품을 생산해야 합니다."
 AST_income_tax_assessment_act: "소득세산정법"
 AST_income_tax_assessment_act_desc: "우리의 과세 제도는 매우 열악하고 국민들이 이해하기 어려워서 정부의 상당한 개입이 필요한데, 이는 우리가 감당하기 어려운 수준입니다. 관련 조항들을 점검하고 간소화함으로써 세금 징수 효율을 크게 높일 수 있습니다."
 AST_council_for_scientific_and_industrial_research: "과학산업연구위원회"
 AST_council_for_scientific_and_industrial_research_desc: "과학산업연구위원회는 1923년 제국회의 이후 여러 식민지와 자치령의 경제 기반을 확장하기 위해 강화되었습니다. 위원회의 공헌은 상당했지만, 이제는 제조업을 비롯한 2차 산업의 발전에 새로운 중점을 두어야 할 때입니다."
 AST_bring_home_the_farmers: "농부들을 집으로"
 AST_bring_home_the_farmers_desc: "대공황 중에 노동자들이 농업에 종사하기 위해 농촌으로 이주하면서, 주요 도시들의 인구가 심각하게 감소했습니다. 이제 상황이 개선되기 시작했으니, 공장을 다시 가동하고 생산을 재개할 수 있도록 노동자들의 복귀를 장려해야 합니다."
 AST_reverse_wage_cuts: "역 임금 삭감"
 AST_reverse_wage_cuts_desc: "기업들이 생존할 기회를 주기 위해, 우리는 경제 전반에 걸쳐 일련의 임금 삭감을 시행했습니다. 이제 경제가 회복 조짐을 보이고 있으므로 우리는 방침을 바꿔야 합니다. 임금 상승은 소비력 증가로 이어져 소비와 경제 성장을 촉진하는 데 도움이 될 것입니다."
 AST_the_manpower_directorate: "인력관리부"
 AST_the_manpower_directorate_desc: "우리 경제가 점점 더 복잡해지면서, 인력 문제가 심화되고 있습니다. 이 부서는 적합한 인력이 필요한 역할에, 적절한 기술을 갖추고, 적시에 배치되도록 할 것입니다."
 AST_recovery: "회복"
 AST_recovery_desc: "처음으로 국내총생산이 대공황 이전 수준을 넘어섰습니다. 이는 축하해야 할 순간입니다. 우리 경제는 이제 오직 상승세만을 이어가고 있기 때문입니다. 우리는 강력한 성장기에 들어섰고, 이제 새로운 번영의 결실을 거둘 때입니다."
 AST_devalued_currency: "화폐 평가 절하"
 AST_devalued_currency_desc: "수출을 늘리는 가장 효과적인 방법 중 하나는 통화 가치를 하락시키는 것입니다. 외국 구매자들이 자국 통화의 가치가 상승하여 우리 상품을 더 많이 구매할 수 있게 되면, 우리의 국제 경쟁력이 강화되는 것입니다. 하지만 이는 양날의 검과 같습니다. 외국으로부터 수입하는 가격 또한 상승하기 때문입니다."
 AST_reverse_industry_tariffs: "역산업 관세"
 AST_reverse_industry_tariffs_desc: "과거에는 관세를 통해 국내 산업을 외국의 경쟁으로부터 보호했습니다. 그러나 이는 무역 전쟁과 우리 수출품에 대한 보복 관세 부과로 이어져 가격 상승을 초래했습니다. 이제 이러한 무역 장벽을 낮추고 상호 관세 인하를 장려하여 무역을 확대해야 합니다."
 AST_foreign_competition: "국외 경쟁"
 AST_foreign_competition_desc: "경쟁은 사업에 유익합니다. 혁신과 효율성을 장려하고 안주하지 않게 해주기 때문입니다. 세상은 약육강식의 논리로 돌아가며, 우리는 우리의 '개'를 가장 큰 개로 만들고, 그 개의 목줄을 풀어 완전히 자유롭게 경쟁할 수 있도록 해야 합니다."
 AST_expanding_into_new_markets: "새로운 시장으로의 확장"
 AST_expanding_into_new_markets_desc: "국내 시장보다 해외 시장에 의존하는 경우의 이점은 간단합니다. 세계 시장은 광대합니다. 개척할 수 있는 새로운 시장이 항상 존재하기에, 우리는 우리만의 경쟁력을 찾아내고 호주 상품과 사업 방식의 우수성을 입증하기만 하면 됩니다."
 AST_populate_or_perish: "거주하거나 사라지거나"
 AST_populate_or_perish_desc: "대공황이 닥치자, 출산율이 급격히 감소했고, 그 이후로 회복되지 않고 있습니다. 지속적인 국내 발전을 위해, 우리는 새로운 이민 프로그램을 운영하고 감독할 연방 이민부를 설립할 것입니다."
 AST_recruitment_drive: "모병 운동"
 AST_recruitment_drive_desc: "이전 정부들의 미약한 의지와 영국에 대한 과도한 의존으로 인해, 호주의 군대는 오랫동안 방치되어 왔습니다. 이제 이러한 상황을 끝내기 위해, 우리는 오스트레일리아 방위군의 모병을 촉진하기 위한 캠페인을 시작합니다."
 AST_new_deal: "뉴딜"
 AST_new_deal_desc: "[AST.GetName]의 150주년 기념행사에서 일어난 시위로 인하여, 원주민 시민에 관한 우리 법률을 재검토해야 한다는 점이 분명해졌습니다. 원주민 권리 운동가들의 요청에 따라, 우리는 그들과 만나 원주민의 완전한 시민권 획득을 위한 방안을 함께 결정할 것입니다."
 AST_the_1938_sesquicentenary_flag: "§Y150주년을 맞은 1938년§! 사건이 발생했습니다."
 AST_the_1938_sesquicentenary_tt: "§Y거주하거나 사라지거나 계통§!의 \"§Y뉴딜§!\" 중점이 사용 가능해집니다."
 AST_repeal_immigration_restrictions: "이민 제한 폐지"
 AST_repeal_immigration_restrictions_desc: "이민부는 누가 [AST.GetName]로 이민할 수 있는지를 결정하는 낡은 법률에 얽매여 있습니다. 논란을 일으킬 위험이 있지만, 그럼에도 우리는 이러한 법률을 폐지하고 대신에 이민자 유입을 통제하기 위한 할당제를 도입할 것입니다."
 AST_womens_armed_services: "여성의 군복무"
 AST_womens_armed_services_desc: "격렬한 반대에도 불구하고 여성 군대의 창설은 진행되어야 합니다. 침략자로부터 [AST.GetName](을)를 지키는 데 도움이 된다면 성별과 관계없이 모두를 환영해야 합니다. 모병과 훈련에 박차를 가하기 위해서는 부대의 지휘관 선임이 매우 중요합니다."
 AST_northern_territory_reconnaissance_unit: "노던 준주 수색대"
 AST_northern_territory_reconnaissance_unit_desc: "공군 대위이자 인류학자인 도널드 톰슨은 [AST.GetName] 군대에 원주민을 포함시킬 것을 주장해 왔으며, 마침내 그의 주장이 받아들여질 것입니다. 우리는 톰슨에게 직접 현지 지식과 부시크래프트 기술을 갖춘 정찰 부대를 창설하여 가장 외지고 험준한 지역까지 감시하도록 임무를 부여할 것입니다."
 AST_northern_territory_reconnaissance_unit_tt: "지원중대인 §Y노던 준주 수색대§!를 잠금 해제합니다."
 AST_torres_strait_battalion: "토레스 해협 대대"
 AST_torres_strait_battalion_desc: "토레스 해협 중대는 주둔군으로서 훌륭하게 임무를 수행해 왔지만, 소속 장병들은 더 큰 잠재력을 가지고 있습니다. 이들은 [AST.GetName] 북부 해안의 섬 출신으로서, 토레스 해협에 대한 폭넓은 지식을 보유하고 있습니다. 우리는 이들을 해병대원으로 훈련시키고, 대대로 편성하기 위해 추가 지원자를 모집할 것입니다."
 AST_department_of_aboriginal_affairs: "원주민부"
 AST_department_of_aboriginal_affairs_desc: "우리는 원주민 권리 운동가 단체들의 제안에 따라 새로운 원주민부를 설립할 것입니다. 이 부서는 원주민 유산 위원회의 자문을 받으며, 원주민들이 적절한 식량과 의료 지원을 받을 수 있도록 보장하는 것을 목표로 할 것입니다."
 AST_immediate_rights: "즉각적인 권리"
 AST_immediate_rights_desc: "[AST.GetName] 내의 어떤 인구 집단도 연방의 규제를 받아서는 안 되며, 어떤 전통도 시민권 부여를 제한해서는 안 됩니다. 우리 고유의 시민권법을 제정하고 우리 인구가 단지 영국의 신민으로만 구성되어 있다는 개념에서 벗어남으로써, 호주인의 권리에는 더 이상 조건이 붙지 않게 될 것입니다."
 AST_diverse_army: "다양한 육군"
 AST_diverse_army_desc: "조국을 수호하는 행위는 특권이자 권리입니다. 입대하고자 하는 모든 호주인은 입대할 수 있어야 하며, 야망 있는 모든 군인은 진급할 수 있어야 합니다."
