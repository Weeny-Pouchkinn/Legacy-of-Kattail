 INS_the_jewel_in_the_crown: "왕관의 보석"
 INS_the_jewel_in_the_crown_desc: "동인도 제도는 네덜란드 식민 제국에서 가장 빛나는 보석이며, 우리는 이 지위를 유지할 것입니다. 우리의 목소리는 인민참사회를 통해 헤이그에 전달됩니다."
