 AST_australian_military_forces: "호주 군대"
 AST_australian_military_forces_desc: "대전쟁에서 단련된 호주 군대는 먼 이국의 전장에서, 전쟁의 가장 치열했던 전투에서도 굳건히 버티며 그 역량을 입증했습니다. 그 후, 이 군대는 규모가 축소되고 본토 방어를 주 임무로 하는 방어군으로 재편되었습니다. 그러나 힘들게 얻은 과거의 교훈은 여전히 남아 있으며, 필요해질 때 다시 부름을 받을 준비가 되어 있습니다."
 AST_permanant_military_forces: "상비군"
 AST_permanant_military_forces_desc: "호주의 주된 군사력은 본토 방어를 담당하는 민병대입니다. 그러나 국제적 긴장이 고조되는 이 시기에는, 대전쟁에 참전하여 경험을 쌓은 전문 장교와 병사들로 구성된 간부단을 창설하는 것이 현명합니다. 비록 초기에는 예비군으로 복무하더라도, 이러한 병력은 안정성과 표준화된 훈련 수준을 제공할 것입니다."
 AST_invoke_the_1903_defence_act: "1903년 국방법 발효"
 AST_invoke_the_1903_defence_act_desc: "전통적으로 호주는 국가 방위를 위해 민병대에 의존해 왔습니다. 그러나 심각한 위협이 발생할 경우, 우리는 1903년 제정된 국방법을 발동하여 방어 목적으로 추가 인력을 소집할 수 있습니다."
 AST_lithgow_small_arms_factory: "리스고 소화기 공장"
 AST_lithgow_small_arms_factory_desc: "1912년에 설립된 리스고 소화기 공장은 전시에 영국산 무기 및 장비에 대한 의존도를 줄이기 위해 만들어졌습니다. 세계에 긴장이 다시 고조되는 지금, 우리는 우리 군대의 증가하는 수요를 충족하기 위해 생산량을 늘려야 합니다."
 AST_dingo_scout_car: "딩고 척후 장갑차"
 AST_dingo_scout_car_desc: "호주는 장갑차를 개발한 경험이 길지 않지만, 우리 군은 점점 더 이 분야의 강화를 요구하고 있습니다. 따라서 딩고 척후 장갑차와 같은 국산 설계를 더욱 적극적으로 도입해야 합니다."
 AST_volunteer_defence_corps_taog: "의용방위대"
 AST_volunteer_defence_corps_taog_desc: "영국의 향토방위대와 유사한 형태로 창설된 의용방위대는 정규군 복무 자격이 없는 사람들로 구성된 무급 시민 민병대입니다. 이러한 한계에도 불구하고, 이들에게는 지역 지형에 대한 풍부한 지식이 있어 최악의 상황 발생 시 게릴라전에 적합합니다."
 AST_war_carriers: "전시 운반 인력"
 AST_war_carriers_desc: "전쟁의 승패는 군수에 달려 있으며, 호주가 작전을 수행하는 지역의 상당 부분은 트럭이나 기차와 같은 통상적인 운송 수단에 적합하지 않습니다. 따라서 우리는 현지 환경에 잘 적응되어 있으며 숨겨진 길과 지름길에 정통한 인력에 의존해야 합니다."
 AST_anzac_spirit: "ANZAC 정신"
 AST_anzac_spirit_desc: "호주-뉴질랜드 군단(ANZAC)은 대전쟁 중에 제국의 승리를 위해 막대한 노력과 많은 피를 흘리며 뛰어난 명성을 쌓았습니다. 인내력, 용기, 기지, 유머 감각 등 그들의 자질은 분명하게 드러났으며, 위험과 고난 속에서도 태연하게 맞서는 모습까지 모두 뛰어났습니다."
 AST_lee_enfield_no1_mark3: "리엔필드 No.1 Mk III*"
 AST_lee_enfield_no1_mark3_desc: "저 작은 별표는 중요합니다. 리엔필드 No.1 Mk III*는 전시에 더 빠르고 저렴한 생산을 위해 개량된 모델을 나타냅니다. 이러한 개선에도 수요를 따라갈 수 없는 상황에서, 우리는 소규모 업체에서 부품을 생산하고 리스고에서 조립하여 생산량을 늘리는 '분산 생산 방식'을 채택해야 합니다."
 AST_new_south_wales_government_railways: "뉴사우스웨일스 정부 철도"
 AST_new_south_wales_government_railways_desc: "뉴사우스웨일스 정부 철도의 작업장은 대형 강철 부품을 일체형으로 주조할 수 있는 독보적인 능력을 갖추고 있습니다. 완전 주조 방식으로 탱크 차체와 포탑을 생산할 수 있는 몇 안 되는 영연방 국가 중 하나인 우리는 이러한 능력을 잘 활용해야 합니다."
 AST_second_australian_imperial_force: "제2차 호주제국군"
 AST_second_australian_imperial_force_desc: "호주는 대전쟁 당시 제1차 호주제국군을 창설하여 해외에 병력을 파견했습니다. 다시 전쟁의 위협이 세계를 휩쓸고 있는 지금, 우리는 호주의 국력을 해외에 과시하기 위해 제2차 호주제국군을 창설해야 합니다."
 AST_expeditionary_leader: "이 §Y장군§!이 §Y원정 지도자§! 특성을 갖게 되어 해외에서의 역량이 향상되지만, 지휘할 수 있는 사단의 수가 제한될 것입니다."
 AST_expeditionary_leader_plural: "두 §Y장군§! 모두 §Y원정 지도자§! 특성을 갖게 되어 해외에서의 역량이 향상되지만, 지휘할 수 있는 사단의 수가 제한될 것입니다."
 AST_larrikinism: "래리키니즘"
 AST_larrikinism_desc: "\"교양 없고, 거칠지만 마음씨 좋은 사람\"으로 정의되는 래리키니즘은 호주 문화를 상징하는 단어가 되었습니다. 강인한 인내력, 권위에 대한 불손함, 그리고 위험에 유쾌하게 맞서는 태도가 바로 그것입니다. 호주 군인들은 대전쟁에서 역경에 맞서 꿋꿋하게 버텨내며 명성을 얻었습니다."
 AST_diggers: "디거스"
 AST_diggers_desc: "호주-뉴질랜드 군단이 갈리폴리에 상륙했을 때, 윌리엄 버드우드 장군에게 내려진 명령은 \"파라, 파라, 파라, 안전해질 때까지\"였고, 이 말은 호주식 전쟁의 상징이 되었습니다. 하지만 디거 정신은 그보다 더 깊습니다. 호주와 뉴질랜드 군인들을 '전우애'로 묶어주는 이 정신은, 전우들과 함께, 그리고 전우들을 위해 싸우는 변함없는 유대감을 의미합니다."
 AST_owen_gun: "오웬 기관단총"
 AST_owen_gun_desc: "혁신적인 국산 오웬 기관단총은 우리 군인들처럼 튼튼함과 신뢰성으로 명성을 얻었습니다. 전 세계에서 우리 군이 전투를 벌이는 지금, 우리는 이 무기를 호주인의 독창성과 설계의 상징일 뿐만 아니라 전쟁에서의 우리 정신의 상징으로도 받아들여야 합니다."
 AST_department_of_supply_and_development_taog: "보급 및 개발 부서"
 AST_department_of_supply_and_development_taog_desc: "전쟁의 수요로 인해 우리의 생산 및 군수 체계가 한계에 다다르고 있는 상황에서, 우리는 이러한 노력을 조정하고 유지하는 책임을 맡은 전담 기구를 통하여 우리의 역량을 집중해야 합니다."
 AST_sentinel_tank_development: "센티널 전차 개발"
 AST_sentinel_tank_development_desc: "역사적으로 우리는 국내에서 전차를 생산할 때조차도 수입된 전차 설계에 의존했습니다. 이러한 전차들에서 얻은 교훈을 바탕으로 호주 고유의 혁신을 더하여, 우리의 역량과 자원에 맞는 자체적인 전차를 개발해야 합니다."
 AST_establish_training_camps: "훈련 캠프 설립"
 AST_establish_training_camps_desc: "대전쟁 때와 마찬가지로, 제2차 제국군은 세계 어느 곳으로든 전투에 투입될 수 있습니다. 따라서 우리는 북아프리카의 사막에서부터 남태평양의 정글에 이르기까지, 우리 병사들을 어떤 환경에도 대비시킬 수 있는 종합적인 훈련 계획을 개발해야 합니다."
 AST_jungle_tanks_if_sentinel_tank_development: "\"센티널 전차 개발\" 완료 시:"
 jungle_heavy_tanks: "정글 중전차"
 AST_anti_malaria_campaign: "말라리아 예방 운동"
 AST_anti_malaria_campaign_desc: "우리 군대는 태평양의 정글에서 전투를 벌여야 할지도 모릅니다. 그곳에는 적의 총알보다 더 치명적인 위협, 바로 말라리아가 도사리고 있습니다. 우리는 이 보이지 않는 적으로부터 우리 병력을 보호하기 위해 단호한 조치를 취해야 합니다."
 AST_defence_citizen_military_forces_act: "국방 민병대법"
 AST_defence_citizen_military_forces_act_desc: "지금까지는 자원입대한 직업군인들만이 해외 파병이 가능했습니다. 그러나 분쟁이 악화되고 있으므로, 필요하다면 민병대도 해외 파병이 가능하도록 법적인 틀을 마련해야 합니다."
 AST_call_that_a_knife: "걱정 마!"
 AST_call_that_a_knife_desc: "\"그딴 건 칼이 아니야... 이게 칼이지!\" 약간의 허세와 유머는 큰 도움이 됩니다. 우리 군인들은 자신감과 투지, 그리고 넘치는 허세로 위험에 맞섭니다."
 AST_army_inventions_directorate_taog: "육군 발명품 이사회"
 AST_army_inventions_directorate_taog_desc: "전쟁의 장점이라고 할 만한 것을 골라 본다면, 그중의 하나는 필요에 의해 촉진되는 빠른 기술 혁신일 것입니다. 우리는 이러한 혁신을 개발하고, 개량하고, 활용하기 위한 중앙 집중형 기구를 설립해야 합니다."
 AST_yeramba: "예람바"
 AST_yeramba_desc: "센티널과 같은 호주에서 개발한 차량의 성공을 바탕으로, 우리는 강력한 신형 무기인 예람바를 개발함으로써 한 단계 더 나아갔습니다. 전차 차체에 장착된 25파운드 포는 적에게 맞서 기동성과 파괴적인 화력을 제공합니다."
 AST_alice_springs: "앨리스스프링스"
 AST_alice_springs_desc: "호주의 아웃백은 정말로 넓습니다. 그 중심에는 앨리스스프링스라는 작은 마을이 있는데, 이곳은 호주 전역의 작전을 위한 군수 중심지 역할을 할 수 있습니다. 우리는 이곳을 개발하고 어떤 환경에도 대비할 수 있는 병력을 훈련시킬 육군 기지를 건설해야 합니다."
 AST_australian_regular_army: "호주 정규군"
 AST_australian_regular_army_desc: "우리는 갈리폴리 해변에서부터 북아프리카 사막, 그리스의 산지, 동남아시아 정글까지 거치며 수많은 교훈을 얻었습니다. 이러한 힘들게 얻은 경험을 통해 우리 군은 다른 어떤 군대보다 유연하고 적응력 있는 군대로 거듭났습니다."
 AST_no1_flying_training_school: "No. 1 비행훈련학교"
 AST_no1_flying_training_school_desc: "1921년 호주 왕립공군 창설과 함께 설립된 비행훈련학교는 항공 인력 수요의 변동에 따라 개교 및 폐교를 반복해 왔습니다. 세계적으로 긴장이 고조되는 지금, 새로운 세대의 조종사와 승무원을 양성하기 위해 이 학교를 다시 열어야 합니다."
 AST_empire_air_training_scheme_taog: "제국 공군 훈련 계획"
 AST_empire_air_training_scheme_taog_desc: "영연방 공군 훈련 계획은 연방국에 대규모의 조종사 및 승무원 훈련을 위한 상당한 자금과 전문 지식을 제공합니다. 이 계획의 유치를 위한 경쟁은 치열하며, 호주와 캐나다가 유력한 후보입니다. 우리는 제국 공군 훈련 계획에 따라 우리 자체의 유치 신청서를 제출했습니다."
 AST_volunteer_air_corps: "공중 감시 의용부대"
 AST_volunteer_air_corps_desc: "호주의 영공은 광활하여 정규 부대만으로는 감시할 수 없습니다. 따라서 우리는 전국에 흩어져 있는 수천 개의 관측소에서 활동하는 지역 자원봉사자들에게 의존하여 하늘을 감시해야 합니다."
 AST_improved_ground_crews: "개선된 지상 근무단"
 AST_improved_ground_crews_desc: "조종사 한 명마다 항공기 정비, 비행 조정, 기지 운영을 담당하는 지상 근무원 팀 전체가 필요합니다. 물론 공중에서 조종사와 동행하는 항법사, 사수, 폭격수도 고려해야 합니다. 우리 공군이 최대한 효율적으로 작전을 수행할 수 있도록 적절한 훈련 시설을 구축해야 합니다."
 AST_advanced_pilot_training: "발전된 조종사 훈련"
 AST_advanced_pilot_training_desc: "항공기가 더욱 복잡해지고, 빨라지고, 고도화됨에 따라 조종사들의 기량 또한 이러한 기술을 최대한 활용할 수 있도록 그에 맞춰 향상되어야 합니다."
 AST_advanced_pilot_training_tt: "§Y공중 교리§!의 통달치 획득 속도가 §G10%§! 증가합니다."
 AST_commonwealth_aircraft_corporation_taog: "영연방 항공기 회사"
 AST_commonwealth_aircraft_corporation_taog_desc: "제공권 경쟁에 대한 관심이 높아지고 있으므로, 우리도 뒤처지지 않도록 해야 합니다. 민간 애호가와 혁신가들은 이미 항공 산업의 잠재력을 인식하기 시작했습니다. 이들에게 초기 자금을 지원함으로써, 우리는 이 신흥 분야를 육성하고 확장할 수 있습니다."
 AST_reestablish_central_flying_school: "중앙 비행 학교 재설립"
 AST_reestablish_central_flying_school_desc: "호주의 또 다른 비행 학교인 중앙 비행 학교는 No. 1 비행훈련학교와 함께 운영되며, 현대 공군의 증가하는 수요를 충족하는 데 도움을 줄 것입니다. 긴장이 고조되는 상황에서, 우리는 장병들에게 필요한 시설을 갖추어 주어야 합니다."
 AST_aerodrome_of_democracy_democracy: "민주주의의 비행장"
 AST_aerodrome_of_democracy_fascism: "지배의 비행장"
 AST_aerodrome_of_democracy_communism: "해방의 비행장"
 AST_aerodrome_of_democracy_neutrality: "군사력의 비행장"
 AST_aerodrome_of_democracy: "[GET_AERODOME_NAME]"
 AST_aerodrome_of_democracy_desc: "호주 공군은 항공 역량의 최전선에 도달하여 '[GET_AERODOME_NAME]'(이)라는 칭호를 얻었습니다. 우리 조종사들은 전 세계에서 공중전을 펼치고 있으며, 우리 폭격기들은 적의 산업에 치명적인 그림자를 드리우고 있습니다."
 AST_government_aircraft_factories: "정부 항공기 공장"
 AST_government_aircraft_factories_desc: "유럽과의 거리를 고려하면, 전시에는 전통적인 항공기 보급에 의존할 수 없습니다. 따라서 자체적인 국내 제조 역량을 개발하여 우리 사양에 맞는 기체와 엔진을 생산할 수 있도록 하는 것이 필수적입니다."
 AST_death_from_down_under_taog: "남반구의 사신"
 AST_death_from_down_under_taog_desc: "남반구의 외딴곳에서 우리는 비할 데 없는 공군력을 구축했습니다. 우리 항공기는 전 세계를 누비며 적들이 어디에 숨어 있든 정밀하고 파괴적인 화력으로 타격을 가할 것입니다. 죽음은 남반구에서 찾아올 것입니다."
 AST_ride_the_lightning: "번개를 타라"
 AST_ride_the_lightning_desc: "우리 전투기 조종사들은 공군력의 선봉으로서 빠르고, 공격적이며, 끈질깁니다. 번개처럼 전장에 뛰어들어 제공권을 장악하고, 적기를 요격하며, 우리 군이 가는 어느 곳이든 공중 우세가 보장되도록 합니다."
 AST_the_gathering_storm: "폭풍전야"
 AST_the_gathering_storm_desc: "수평선 너머로 폭풍이 몰려오고 있습니다. 우리의 증강된 공군력은 공중에서 더욱 압력을 가하고, 적의 가장 취약한 곳을 타격하고 아군의 진격을 지원합니다. 멀리서 들려오는 천둥소리는 곧 가차 없는 파괴의 폭풍으로 변할 것입니다."
 AST_hear_the_thunder: "천둥소리"
 AST_hear_the_thunder_desc: "천둥소리, 저 천둥소리가 들리는가? 저 아래의 땅에서 올라온 우리의 전략폭격기들이 호주의 힘을 세계 곳곳에 투사합니다. 하늘이 포효하고 땅이 흔들리면, 적들은 알게 될 것입니다. 폭풍이 왔으며, 파괴를 가져올 것임을."
 AST_department_of_aircraft_production: "항공기 생산 부서"
 AST_department_of_aircraft_production_desc: "호주 왕립공군의 급속한 확장은 우리의 생산 능력에 상당한 부담을 주고 있습니다. 우리는 더욱 야심 찬 계획을 세워서, 산업 기반을 확장하고 조정하여 수요를 충족하고 우리 항공기로 하늘을 새까맣게 가릴 수 있도록 해야 합니다."
 AST_royal_australian_navy: "오스트레일리아 왕립해군"
 AST_royal_australian_navy_desc: "연방 결성 후 식민지 함대를 통합하여 창설된 호주 왕립해군은 대전쟁의 거의 모든 전구에서 활약했습니다. 이후 이 해군은 예산 부족으로 감축되었지만, 국제적 긴장이 고조됨에 따라 이제 함대가 다시 바다에 나갈 때가 되었습니다."
 AST_coast_watchers: "해안감시대"
 AST_coast_watchers_desc: "우리 병력의 대부분은 본토에 집중되어 있지만, 우리의 북부 접근로는 중요한 조기 경보망 역할을 합니다. 이 외딴섬들에 현지 정보 공작원을 배치함으로써 적의 항공 전력과 해군의 움직임을 그들이 호주 해안을 위협하기 훨씬 전에 감지할 수 있습니다."
 AST_marines: "해병"
 AST_marines_desc: "수많은 섬이 흩어진 대양에서 가장 큰 섬인 우리는 해안 너머로 전력을 투사할 수 있는 상륙 능력을 확보해야 합니다. 방어에서 공격으로 전환해야 할 경우, 이러한 전력은 징검다리 작전을 가능하게 할 것입니다."
 AST_naval_auxiliary_patrol_taog: "해군 순찰 보조대"
 AST_naval_auxiliary_patrol_taog_desc: "정규군이 다른 곳에 투입된 상황에서, 우리는 항구와 해안 시설을 보호하기 위해 열정적인 현지 의용군에게 도움을 요청할 수 있습니다. 현지 수로에 대한 그들의 깊은 지식은 매우 귀중하며, 아무도 현지 어부가 우리 임무에 참여하고 있다고 의심하지 못할 것입니다."
 AST_cockatoo_island_shipyards_taog: "코카투섬 조선소"
 AST_cockatoo_island_shipyards_taog_desc: "코카투섬 조선소는 오랫동안 영국 해군의 해외 작전을 지원하는 수리 및 유지보수 중심지 역할을 해왔습니다. 이제 호주 왕립해군의 핵심 기지가 된 이곳의 역량을 확장하여, 함대의 증가하는 수요를 충족하고 해군력을 유지해야 합니다."
 AST_kangaroo_point_dry_dock_taog: "캥거루포인트 건선거"
 AST_kangaroo_point_dry_dock_taog_desc: "에반스 디킨 & 컴퍼니는 본래 엔지니어링 회사지만, 이 회사는 세계의 긴장이 고조됨에 따라 조선 능력 확장의 필요성을 정확하게 인식하고 캥거루 포인트에 주목하고 있습니다. 우리 함대의 지속적인 성장을 지원하기 위해서는 그들이 이 부지를 인수할 수 있도록 지원해야 합니다."
 AST_scrap_iron_flotilla_taog: "고철 전단"
 AST_scrap_iron_flotilla_taog_desc: "비판하는 자들은 구식이고 낡았다고 혹평하지만, 우리는 그럼에도 불구하고 여러 척의 구형 구축함을 하나의 대형으로 통합했습니다. 현대식 함선만큼의 위엄은 없지만, 이 함선들은 우리가 이미 보유하고 있는 자원을 효율적으로 활용하고 있다는 사례입니다."
 AST_cruising_for_a_bruising: "싸움을 찾아 순항"
 AST_cruising_for_a_bruising_desc: "우리 해군은 오랫동안 순양함을 능숙하게 운용해 왔으며, 이는 확장할 가치가 있는 전통입니다. 빠르고 다재다능하며 강력한 타격력을 갖춘 이 함선들은 곧 전 세계적으로 명성을 떨칠 것이며, 이들의 항로를 가로막는 적은 심각한 타격을 입게 될 것입니다."
 AST_strike_from_down_under: "아래에서의 공격"
 AST_strike_from_down_under_desc: "천둥소리 하나 없이 파도 아래로 그들은 미끄러지듯 나아갑니다. 만약 그들이 잠수함을 발견한다면, 잠수함이 약탈당할 것입니다. 들어보셨습니까? 저 아래에서 온 잠수함들에 대해 들어보셨습니까? 도망치는 게 좋을 겁니다, 그렇지 않으면 당신의 함대는 궤멸될 테니까요. 그렇고말고요!"
 AST_hmas_sydney: "HMAS 시드니"
 AST_hmas_sydney_desc: "전함의 시대는 끝났습니다. 해군력의 미래는 함대의 상공에 달려 있으며, 호주는 뒤처지지 않을 것입니다. 수년간 해군을 재건하고 현대화한 끝에, 우리는 마지막 단계를 밟을 준비가 되었습니다. 바로 앞으로 한 세대 동안 호주 해상 전력을 정의할 항공모함입니다."
 AST_conscription_level_allowed_tt: "더 많은 징병을 위한 정치적 의지(중점에서 인력 아이콘을 찾으십시오)"
 AST_conscription_level_allowed_limited_conscription_tt: "§Y징병법§!의 추가 레벨이 잠금 해제되어 §Y제한적 징병§!이 활성화됩니다."
 AST_conscription_level_allowed_extensive_conscription_tt: "§Y징병법§!의 추가 레벨이 잠금 해제되어 §Y광범위한 징병§!이 활성화됩니다."
 AST_conscription_level_allowed_service_by_requirement_tt: "§Y징병법§!의 추가 레벨이 잠금 해제되어 §Y무제한적 복무§!가 활성화됩니다."
 AST_conscription_level_allowed_all_adults_serve_tt: "§Y징병법§!의 추가 레벨이 잠금 해제되어 §Y모든 성인 복무§!가 활성화됩니다."
 AST_conscription_level_allowed_scraping_the_barrel_tt: "§Y징병법§!의 추가 레벨이 잠금 해제되어 §Y최후의 한 명까지§!가 활성화됩니다."
 AST_conscription_law_so_far: "[CONSCRIPTION_LAW_SO_FAR]"
