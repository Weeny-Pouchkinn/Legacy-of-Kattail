 INS_netherlands_can_remove_autonomy_tt_100: "\n[HOL.GetFlag]§Y[HOL.GetNameDefCap]§! 측이 먼저 이 중점 완료 시:\n    ([INS.GetFlag]§Y[INS.GetName]§!): §Y£autonomy_texticon -100.00§! 추가"
 INS_netherlands_can_remove_autonomy_tt_150: "\n[HOL.GetFlag]§Y[HOL.GetNameDefCap]§! 측이 먼저 이 중점 완료 시:\n    ([INS.GetFlag]§Y[INS.GetName]§!): §Y£autonomy_texticon -150.00§! 추가"
 INS_netherlands_can_remove_autonomy_tt_200: "\n[HOL.GetFlag]§Y[HOL.GetNameDefCap]§! 측이 먼저 이 중점 완료 시:\n    ([INS.GetFlag]§Y[INS.GetName]§!): §Y£autonomy_texticon -200.00§! 추가"
 INS_netherlands_can_remove_autonomy_tt_250: "\n[HOL.GetFlag]§Y[HOL.GetNameDefCap]§! 측이 먼저 이 중점 완료 시:\n    ([INS.GetFlag]§Y[INS.GetName]§!): §Y£autonomy_texticon -250.00§! 추가"
 INSHOL_begin_negotiations_soetardjo: "수타르조와의 협상 개시"
 INSHOL_begin_negotiations_soetardjo_desc: "수타르조의 자치권 청원은 승인될 가능성이 높으며, 민족주의자와 충성파 간의 타협점을 찾을 기회를 제공합니다. 그의 당과 공식적인 협상을 개시해야 합니다."
 INSHOL_urge_gov_veto: "총독의 거부 촉구"
 INSHOL_urge_gov_veto_desc: "수타르조 청원은 민족주의자들의 음모로서 동인도 정부가 속고 있는 것입니다. 우리는 총독에게 즉시 청원을 거부하도록 촉구해야 합니다. 그렇지 않으면 식민지를 잃을 위험이 있습니다."
 INSHOL_eventual_autonomy: "최종적인 자치에 동의"
 INSHOL_eventual_autonomy_desc: "인도네시아의 독립 열망은 강하며, 그 기세가 수그러들지 않고 있습니다. 우리는 언젠가 인도네시아가 자치권을 갖는 데에 동의하겠지만, 이는 식민지가 자립할 수 있음을 입증하고 민주주의적 이상을 계속해서 유지할 것이라는 확신이 있을 때만 가능합니다."
 INSHOL_autonomous_dominion: "[GetYear]년 수타르조 법"
 INSHOL_autonomous_dominion_desc: "수타르조 청원의 조건이 효력을 갖기 위해서는 네덜란드가 설정한 '자립'이라는 불합리한 정의를 충족해야 했지만, 인도네시아의 독립에 대한 강한 열망으로 인하여 그 조건들을 충족할 수 있었습니다. 합의에 따라 우리는 네덜란드 왕실로부터 완전하고 무조건적인 독립을 선언할 것입니다."
 INS_cannot_become_independent_tt: "§W§Y[INS.GetFlag][INS.GetNameDefCap]§!(은)는 타국의 개입 없이는 §R영구적으로 독립할 수 없게 될 것입니다.§!§!"
 INSHOL_sideline_the_volksraad: "인민참사회 배제"
 INSHOL_sideline_the_volksraad_desc: "수타르조가 제기한 청원은 명백히 네덜란드 헌법 제1조를 위반하는 것이며, 동인도 행정부에 어려움을 초래할 뿐입니다. 따라서 이 청원은 거부되어야 합니다."
 INSHOL_prioritize_dutch_profits: "네덜란드의 이익을 우선"
 INSHOL_prioritize_dutch_profits_desc: "우리는 본토의 이익 증대에 노력을 집중할 것입니다. 본토의 경제적 안정이야말로 왕국 전체의 이익에 부합합니다."
 INSHOL_development_loans_netherlands: "네덜란드로부터 개발 대출"
 INSHOL_development_loans_netherlands_desc: "우리는 산업화를 가속하기 위해 네덜란드 기업으로부터 대출받을 수 있습니다. 개발 중인 식민지라는 지위를 활용하여 낮은 금리를 보장받을 수 있지만, 여전히 이자를 지불해야 할 것입니다."
 INSHOL_request_economic_dev_subsidy: "경제 개발 보조금 요청"
 INSHOL_request_economic_dev_subsidy_desc: "우리는 수익성 있는 식민지로서 종주국에 우리의 가치를 입증했습니다. 이를 협상 자료로 활용하여 산업 개발 보조금을 얻어낼 수 있습니다."
 INSHOL_loyalty_to_crown: "왕실을 향한 충성심"
 INSHOL_loyalty_to_crown_desc: "동인도 제도는 다양하게 정의할 수 있지만, 가장 중요한 것은 우리는 충성스러운 네덜란드 식민지라는 것입니다. 빌헬미나 여왕께서 우리를 승리로 이끌어 주실 것입니다. 우리는 민족주의가 500년에 가까운 역사를 끝내게 두어서는 안 되며, 왕실에 대한 절대적인 충성을 계속해서 확인해야 합니다."
 INS_loans_timer: "\n§Y365§!일 후:"
 INS_expand_batavia_med_school_tt: "§Y$INS_dutch_east_indies$§!: 연구 속도 변동치가 §G1.00%§! 이상."
 INS_subsidize_local_business: "지역 기업에 보조금 제공"
 INS_subsidize_local_business_desc: "우리는 경제 성장을 촉진하고 장기적으로 우리 경제를 활성화하기 위해 지역 기업에 보조금을 제공해야 합니다."
 INSHOL_education_reforms: "교육 개혁"
 INSHOL_education_reforms_desc: "동인도 제도의 많은 시민들은 교육받기가 어렵고, 중등 교육을 완료한 사람은 극히 드뭅니다. 동인도 제도가 부유하며 산업화된 국가가 되려면 국민들이 교육을 제대로 받을 수 있도록 보장해야 합니다."
 INS_expand_batavia_med_school: "바타비아 의과대학 확장"
 INS_expand_batavia_med_school_desc: "새로운 캠퍼스 시설을 건설하고 더 많은 교수를 채용하여 바타비아 의과대학을 확장하면, 고등 교육에 대한 접근성이 훨씬 높아질 것이며, 이는 장기적인 경제 성장에 매우 중요합니다."
 INS_prepare_for_policy_shift: "정책 변경을 준비"
 INS_prepare_for_policy_shift_desc: "동인도 제도의 정치 지형은 지난 수십 년 동안의 민족 각성 운동의 영향을 받았으며, 우리의 현재 정책은 명백히 시대에 뒤떨어졌습니다. 우리는 통치 구조에 일부 개편을 검토해야 합니다."
 INS_reallocate_rubber_industry_funding: "고무 산업 자금 재분배"
 INS_reallocate_rubber_industry_funding_desc: "고무 수출에 지나치게 의존한 탓에 우리의 경제는 큰 타격을 입었습니다. 우리는 자원을 탐사하고 제도 전체에 광산과 공장을 설립하여 경제를 다각화해야 합니다. 적잖은 비용이 드는 일인 만큼, 고무 농장 유지 예산을 삭감해야 할 것입니다."
 INS_reallocate_rubber_industry_funding_tt: "§Y주에서 고무를 제거§!하고 소량의 §Y다른 자원§!으로 대체하는 결정을 잠금 해제합니다."
 INSHOL_nationalist_coallition: "민족주의 연합"
 INSHOL_nationalist_coallition_desc: "인민참사회는 너무 오랫동안 한 목소리만 내왔고, 그 목소리는 너무 조용했습니다. 이제 청원을 낸 다음 참고 기다리는 시간은 지났습니다. 참사회 내 민족주의 의원들의 연합은 자신들끼리의 갈등을 접어두고 무조건적인 독립을 요구할 것입니다. 한때 네덜란드 사회에서 안전하게 배제되었다고 여겨졌던 의회 밖의 원로 인사들도 환영을 받으며 의회로 돌아올 것입니다."
 INSHOL_volksraad_compromises: "인민참사회 타협안"
 INSHOL_volksraad_compromises_desc: "참사회 내부의 개혁 덕분에 여기까지 올 수 있었으며, 이 길을 이제 와서 포기할 이유는 없습니다. 인민참사회는 헤이그와 양보를 주고받으며 신중한 노력을 계속할 것이고, 파국이 아닌 인내를 통해 자치를 추구할 것입니다. 네덜란드 연방 안에서의 미래는 연방 밖에서 싸우는 미래보다 더 나을 것입니다."
 INSHOL_establish_the_princely_council: "제후 의회 창설"
 INSHOL_establish_the_princely_council_desc: "이 제도의 술탄과 라자들은 바타비아의 어떤 의회도 가지지 못한 충성심을 갖고 있습니다. 이들의 궁정은 동인도 회사보다도, 그리고 그 뒤를 이은 공화국보다도 역사가 깊습니다. 제후 가문들의 공식 의회는 이 통치자들에게 새로운 국가의 의석을 마련해 주고, 그들의 권위를 우리와 연계시킬 것입니다."
 INSHOL_nationalize_dutch_companies: "네덜란드 회사 국유화"
 INSHOL_nationalize_dutch_companies_desc: "거대 무역회사, 해운회사, 대농장 기업, 그리고 은행은 아주 오래전부터 네덜란드식 이름을 달고 다녔습니다. 이제부터는 인도네시아식 이름을 달게 될 것입니다. 간판은 새로 교체되고, 표지판은 철거될 것이며, 3세기 동안 이 제도에서 착취당했던 자본은 마침내 제도의 것이 될 것입니다."
 INSHOL_democracy: "민주주의 인도네시아"
 INSHOL_democracy_desc: "인민참사회는 애초에 대표성을 가지면서도 실질적인 권한은 제한된 자문 기구로서, 형식적인 대표성만 보여주도록 설계된 반쪽짜리였습니다. 그러나 이제는 그 한계를 넘어섰습니다. 인민참사회는 국민이 직접 선출하는 의원들로 구성되고, 과거 인민참사회를 억압했던 정부에 구속력을 갖는 진정한 입법부로 재편될 것입니다."
 INSHOL_princely_authority: "제후의 권위"
 INSHOL_princely_authority_desc: "자문위원회는 나름대로 훌륭한 기구이지만, 이 국가의 건국에 이름을 빌려준 술탄들은 그 이상의 영향력을 행사할 수도 있습니다. 위원회는 자신들 중 한 명이 스스로를 다른 사람들보다 우월한 위치로 올리려 하여도 방해하지 않을 것입니다. 오랜 역사를 자랑하는 궁정은 이 질문이 다시 제기되기를 간절히 기다려 왔습니다."
 INSHOL_encourage_further_investment: "추가 투자 장려"
 INSHOL_encourage_further_investment_desc: "인민참사회에서 합의된 조건은 당장의 정치적 문제를 해결해 왔으며, 네덜란드 자본도 이를 주목하고 있습니다. 관세는 완화될 것이고, 보증은 확대되었으며, 암스테르담과 로테르담의 상공회의소는 이 제도가 사업을 하기에 적합하다는 확신을 얻었습니다. 기존 방식에서 수익성이 있었던 것은 새로운 방식에서도 수익성이 있을 것입니다."
 # <Joint Tree - ABDACOM>
 INSHOL_east_indies_artillery: "동인도 야포 제조"
 INSHOL_east_indies_artillery_desc: "자바에 야포 제조 시설을 설립하면 해외 무역에 대한 의존도를 줄이면서 군사 활동을 수행할 수 있습니다."
 INSHOL_recall_gerardus_johannes_berenschot: "베렌스코트 장군 소환"
 INSHOL_recall_gerardus_johannes_berenschot_desc: "헤라르뒤스 요하너스 베렌스코트는 연방에서 가장 유능한 장군 중 한 명입니다. 그는 군 생활의 대부분을 동인도 제도에서 보냈지만, 네덜란드에서도 몇 년을 복무했습니다. 이 끔찍한 시기에 우리는 그를 동인도로 소환하여 전쟁 수행에 나서도록 해야 합니다."
 INSHOL_east_indies_cruiser_manufacturing: "동인도 순양함 제조"
 INSHOL_east_indies_cruiser_manufacturing_desc: "네덜란드에 직접 주문하는 대신에 자체적으로 순양함을 건조하는 것은 진정한 해군을 구축하기 위한 첫걸음이며, 일본의 위협을 고려할 때 반드시 필요한 조치입니다."
 INSHOL_transfer_of_conrad_helfrich: "콘라트 헬프리흐를 동인도로 전출"
 INSHOL_transfer_of_conrad_helfrich_desc: "콘라트 헬프리흐 제독을 바로 동인도로 전출시키면 동인도의 해군력 증강에 매우 중요한 역할을 할 것입니다."
 # <Joint Tree - Naval Program>
 INSHOL_naval_program: "네덜란드-인도네시아 해군 계획"
 INSHOL_naval_program_desc: "동인도 해군은 여느 해군뿐 아니라 다른 식민지 해군보다도 한참 뒤떨어져 있습니다. 신속한 발전을 보장하고 이 신생 해군의 발전을 지원하는 것이 모두에게 최선의 선택입니다."
 INSHOL_naval_program_transfer_25_tt: "우리 해군 병력의 §Y25%§!를 [INS.GetNameDef]에 양도합니다."
 INSHOL_naval_program_transfer_25_2_tt: "§Y[HOL.GetFlag] [HOL.GetNameDefCap]§!(이)가 자국의 해군 병력 중 §Y25%§!를 §Y[INS.GetNameDefCap]§!에 양도할 것입니다."
 INSHOL_naval_program_transfer_100_tt: "§R우리 해군 전체§!를 [INS.GetNameDef]에 양도합니다."
 INSHOL_naval_program_transfer_100_2_tt: "§Y[HOL.GetFlag] [HOL.GetNameDefCap]§!(이)가 자국의 해군 전체를 §Y[INS.GetNameDefCap]§!에 양도할 것입니다."
 INSHOL_naval_program_rejected_tt: "§Y$INSHOL_naval_secondchance$§! 국가중점을 잠금 해제합니다."
 INSHOL_hybrid_navy: "혼성 해군"
 INSHOL_hybrid_navy_desc: "우리 해군이 [HOL.GetNameDef]의 태평양 함대를 인계받는 것만으로 충분하지 않습니다. 우리 스스로 함선을 건조하기 시작해야 합니다. 그렇지 않으면 단 한 번의 실수로 해군 보급 전체가 중단될 수 있습니다."
 INSHOL_request_naval_control: "동인도 함대"
 INSHOL_request_naval_control_desc: "[HOL.GetNameDefCap](은)는 함락되었고, 해군 전체를 운용할 상황이 아닙니다. 이 전쟁이 끝날 때까지 우리가 그 해군을 장악해야 합니다."
 INSHOL_naval_secondchance: "동인도 해군 계획"
 INSHOL_naval_secondchance_desc: "비록 [HOL.GetNameDef](이)가 해군 통제권 이양을 거부했지만, 우리는 여전히 태평양을 빼앗기지 않기 위해 방어를 수행해야 합니다. 그들이 우리 제안에 동의했을 경우만큼 잘 풀리지는 않더라도, 우리는 그럭저럭 쓸 만한 대안을 찾아낼 것입니다."
 # <Joint Tree - Netherlands in Exile>
 INSHOL_netherlands_in_exile: "망명 네덜란드"
 INSHOL_netherlands_in_exile_desc: "우리 왕국의 비극적인 몰락은 이제 현실이 되었습니다. 우리는 패배주의에 빠져서는 안 됩니다. 우리는 일어난 일을 받아들이고 우리가 지켜낼 수 있는 것에 집중해야 합니다."
 # INSHOL_relocate_prime_minister: "Relocate the Prime Minister to Java"
 INSHOL_relocate_our_generals: "자바로 육군 재배치"
 INSHOL_relocate_our_generals_desc: "너무 늦기 전에 남아 있는 추방된 장군, 지휘관, 그리고 저항 중인 병사들을 최우선으로 [1058.GetName]에 재배치해야 합니다."
 #INSHOL_relocate_our_soldiers: "Transfer Holdout Soldiers to Java"
 INSHOL_netherlands_indonesia_union: "네덜란드-인도네시아 연방"
 INSHOL_netherlands_indonesia_union_desc: "[HOL.GetNameDef](와)과 [INS.GetNameDef] 간의 동등한 연방 국가라는 개념은 많은 사람들에게 웃음거리로 보이겠지만, 우리가 처한 위기 상황에서는 이것이 주권을 지켜낼 가능성을 가장 크게 해 줄 유일한 길처럼 보입니다."
 # <Sukarno Shared Branch - Resistance Buildup>
 INS_underground_revolution: "지하 혁명"
 INS_underground_revolution_desc: "우리는 음지에서 혁명을 계획하기 시작하여, 공격 준비가 완료될 때까지 서서히 회원 수와 민병대 활동을 늘릴 것입니다."
 INS_infiltrate_the_media: "언론에 침투"
 INS_infiltrate_the_media_desc: "우리의 운동은 동인도 제도의 여러 언론 기관 고위 인사들을 여럿 포섭하는 데 성공했습니다. 우리는 이를 활용하여 시민들의 마음속에 친혁명적 정서를 은밀하게 심어 넣을 수 있습니다."
 INS_infiltrate_the_army: "육군에 침투"
 INS_infiltrate_the_army_desc: "우리 조직원 중 다수는 왕립 네덜란드령 동인도군 소속이며 계급은 하급 병사부터 소령까지 다양합니다. 우리는 최대한 많은 기밀을 수집하는 동시에 우리 조직원들을 고위직으로 진급시켜야 합니다. 우리가 작전을 개시하는 순간, 왕립 네덜란드령 동인도군은 혼란에 빠질 것입니다."
 INS_privately_owned_military_industry: "민간 소유의 군수산업"
 INS_privately_owned_military_industry_desc: "우리는 군수산업 분야에 여러 개의 그림자 기업을 설립하여, 혁명이 시작된 후에도 군수산업에 대한 통제권을 유지할 것입니다."
 INS_privately_owned_military_industry_tt: "사령부에 §G2§!개의 §Y군수공장§! 추가"
 INS_instigate_chaos_sulawesi: "술라웨시에 혼란 선동"
 INS_instigate_chaos_sulawesi_desc: "우리는 술라웨시의 현지 민족주의자들과 협력하여 파업과 폭동을 조직하고 주민들을 급진화할 것입니다."
 INS_instigate_chaos_sulawesi_tt: "우리가 독립을 선언하면 우리는 §Y[673.GetName]§! 및 §Y[1056.GetName]§!에 대한 §G핵심§! 주를 확보하게 될 것입니다. 이 지역들은 네덜란드령 동인도에 의해 핵심이 아닌 영토로 남을 것입니다."
 INS_instigate_chaos_medan: "메단에 혼란 선동"
 INS_instigate_chaos_medan_desc: "우리는 메단 및 리아우의 현지 민족주의자들과 협력하여 파업과 폭동을 조직하고 주민들을 급진화할 것입니다."
 INS_instigate_chaos_medan_tt: "우리가 독립을 선언하면 우리는 §Y[1049.GetName]§!에 대한 §G핵심§! 주를 확보하게 될 것입니다. 이 지역은 네덜란드령 동인도에 의해 핵심이 아닌 영토로 남을 것입니다."
 INS_embezzlement_scheme_in_batavia: "바타비아에서의 횡령 계획"
 INS_embezzlement_scheme_in_batavia_desc: "우리는 독립을 선언하고 곧바로 바타비아에 있는 우리 생산 시설을 공화국 영토로 이전하는 계획을 세울 것입니다."
 INS_embezzlement_scheme_in_batavia_tt: "독립을 선언하는 즉시, §Y[1058.GetName]§!에 있는 모든 공장의 절반이 우리 §Y혁명 본부§!로 재배치될 것입니다."
 INS_volksraad_rumors: "인민참사회에서의 소문"
 INS_volksraad_rumors_desc: "우리는 인민참사회 내부에서 은밀하게 혁명에 대한 논의를 시작할 것입니다. 만약 성공한다면, 인도네시아 인민참사회 의원들을 우리의 대의에 동참하게 설득할 수 있을 것입니다."
 INS_volksraad_rumors_tt: "모든 §Y인도네시아 §!인민참사회 고문들이 독립 선언 후에 §G유지됩니다§!."
 INS_railway_youth_force: "철도 청년군과 협력"
 INS_railway_youth_force_desc: "철도 청년군은 주로 자바 중부에서 활동하는 이슬람 청년 민병대이며, 철도를 점령하는 전략 때문에 이러한 이름이 붙었습니다. 이들은 귀중한 동맹이 될 수 있지만, 매우 활동적이며 전투에 참여하기를 원합니다. 우리가 휴전을 너무 오래 지속하면 이들은 정부에 불만을 품게 될 것입니다."
 INS_sleeper_informant_network: "[GetInformantNetworkName]"
 INS_Sleeper_Informant_Network_name: "잠복 정보원 연결망"
 INS_KNIL_Informant_Network_name: "KNIL 정보원 연결망"
 INS_sleeper_informant_network_desc: "우리는 왕립 네덜란드령 동인도군(KNIL) 행정 기구 전반에 걸친 정보원 연결망을 구축하여, 적의 계획에 대한 사전 경고를 받게 될 것입니다."
 INS_sleeper_informant_network_tt: "§R독립이 선포됐을 때:§!\n"
 # <Sukarno Shared Branch - Peoples Security Army>
 INS_the_peoples_security_army: "인민안전군"
 INS_the_peoples_security_army_desc: "우리 조직원 대부분은 독립을 위해 헌신하고 싸우기를 열망하는 젊은 인도네시아인들이며, 인내심이 점점 바닥나고 있습니다. 우리는 혁명군을 창설하고 미래의 병사들을 훈련시켜야 합니다."
 INS_commander_sudirman: "수디르만의 군대"
 INS_commander_sudirman_desc: "수디르만은 아직 젊은 신인이지만 뛰어난 잠재력을 보여주었고, 저항군 청년들 사이에서 매우 인기가 높습니다. 그는 인민안전군의 방향을 제시하고 우리를 승리로 이끌 것입니다."
 INS_commander_oerip: "우립의 군대"
 INS_commander_oerip_desc: "우립은 수십 년간 군에 복무했으며, 인도네시아인으로서는 유일하게 왕립 네덜란드령 동인도군에서 소령으로 진급한 인물입니다. 그의 지식과 경험은 다른 어떤 구성원보다도 월등합니다. 그는 인민안전군의 방향을 제시하고 우리를 승리로 이끌 것입니다."
 INS_sudirmans_promotion: "수디르만의 진급"
 INS_sudirmans_promotion_desc: "수디르만은 뛰어난 지휘 능력을 보여주었고, 여러 차례 성공적인 공격을 지휘했습니다. 이제 우리는 지휘관의 노고를 인정하여, 그에게 걸맞은 장군 칭호를 수여해야 할 때입니다."
 INS_tkr_steal_general: "동인도군 장군 포섭"
 INS_tkr_steal_general_desc: "동인도군 고위 간부들을 설득하여 우리 편으로 끌어들인다면, 우리 군의 전력을 강화하는 동시에 상대의 전력을 약화시킬 수 있을 것입니다."
 INS_tkr_supply: "혁명가라면 싸워야 한다"
 INS_tkr_supply_desc: "우리는 우리 운동의 모든 구성원이 정식 군사 훈련을 받도록 할 것입니다. 예외는 없습니다."
 INS_tkr_professional_army: "전문적인 군대"
 INS_tkr_professional_army_desc: "우리는 민병대에만 의존해서는 안 됩니다. 질서 유지를 위해 전문적인 공화국 군대를 양성해야 합니다."
 INS_arm_the_revolutionaries: "혁명가 무장시키기"
 INS_arm_the_revolutionaries_desc: "우리는 열정으로 가득 차 있고 인도네시아를 위해 모든 것을 바칠 준비가 되어 있는 혁명가들과 민족주의자들을 데리고 행동을 개시해야 합니다. 우리는 그들에게 조국을 위해 싸우는 데 필요한 훈련과 장비를 제공할 것입니다."
 INS_arm_the_youth: "청년들 무장시키기"
 INS_arm_the_youth_desc: "우리는 혁명가들만이 아니라 청년들도 무장시켜야 합니다. 아직 열정과 희망으로 가득 찬 그들이 혁명의 불꽃을 이어갈 것입니다. 우리는 가능한 한 많은 인도네시아 청년들이 전투 훈련과 장비를 갖추도록 해야 합니다. 전투가 그들에게 닥쳐올 때, 그들은 행동할 준비가 되어 있을 것입니다."
 INS_arm_the_students: "학생들 무장시키기"
 INS_arm_the_students_desc: "학생들은 수십 년 전부터 혁명의 기초를 다져왔으며, 계속해서 혁명을 이끌어 갈 것입니다."
 INS_guerilla_industry: "게릴라 산업"
 INS_guerilla_industry_desc: "우리는 제도 전역에 걸쳐 게릴라 부대를 운용하여 공장을 장악하고, 이를 통해 민병대를 무장시킬 새로운 총기를 생산할 것입니다."
 INS_indonesian_assault_doctrine: "인도네시아 돌격 교리"
 INS_indonesian_assault_doctrine_desc: "전쟁은 병사만 많다고 되는 것이 아닙니다. 백만 명의 병사가 있어도 총을 쥐어 줄 수 없다면 아무 소용이 없습니다. 적의 영토로 깊숙이 진격하기 위해서는 우수한 화포를 확보하는 일을 최우선으로 삼아야 합니다."
 INS_tighter_tkr_integration: "인민안전군-민병대의 긴밀한 통합"
 INS_tighter_tkr_integration_desc: "인민안전군과 여러 민병대는 통일된 움직임을 보이지 않으며, 협력도 부족합니다. 이대로는 전쟁이 길어질수록 더 많은 문제를 야기할 뿐입니다. 민병대 간부들은 틀림없이 반발하겠지만, 우리는 군대와 민병대를 엮어 하나의 조직으로 통합해야 합니다."
 INS_quality_over_quantity: "양보다 질"
 INS_quality_over_quantity_desc: "잘 훈련된 군인 한 명과 치밀한 전략, 그리고 현대적인 장비가 합쳐지면 권총을 든 학생 다섯 명을 이길 수 있습니다. 우리는 최대한 많은 병사를 동원하는 것보다 질적으로 우수하고 잘 무장된 병사들과 특수부대를 우선시해야 합니다."
 INS_add_militia_cap_1_tt: "§Y자유의 투사§! 사단 상한이 §Y1§! 증가합니다.\n"
 INS_add_militia_cap_2_tt: "§Y자유의 투사§! 사단 상한이 §Y2§! 증가합니다.\n"
 INS_add_militia_cap_3_tt: "§Y자유의 투사§! 사단 상한이 §Y3§! 증가합니다.\n"
 INS_add_3_militia_unit_tt: "§Y습격§!에 사용하여 네덜란드 주에서 §G민병대 주둔§!을 증가시킬 수 있는 §Y자유의 투사§! 3개 부대를 만듭니다."
 INS_add_fully_trained_militia_unit_tt: "훈련된 §Y자유의 투사§! 1개 부대를 만듭니다.\n"
 # <Sukarno Shared Branch - Expand Resistance Membership>
 INS_expand_resistance_membership: "저항군 회원 확대"
 INS_expand_resistance_membership_desc: "우리 운동 전체를 한 개의 기지에 집중한다면 반드시 실패할 것입니다. 우리는 구성원들을 다수의 민병대 단체로 편성하여 사절로 파견함으로써, 여러 지역에서 우리의 인기도와 지배력을 확대해 나갈 것입니다."
 # <Central Independence Branch - Militias>
 INS_deploy_the_kris: "술라웨시 인도네시아 인민봉사단"
 INS_deploy_the_kris_desc: "술라웨시 인도네시아 인민봉사단, 인도네시아어로 KRIS라고 부르는 이 단체는 활동적인 민병대 단체로서, 술라웨시와 마나도의 민병대 세력 대부분을 구성하고 있습니다. 우리는 이들을 영입하여 정식으로 인민안전군과 함께 싸우도록 해야 합니다."
 INS_assist_the_pemuda: "청년단 지원"
 INS_assist_the_pemuda_desc: "자바에는 다양한 청년 학생 민병대가 있습니다. 이들과 힘을 합치고 이들이 네덜란드에 대항할 때 군사적 지원을 제공한다면 유용한 동맹을 확보할 수 있을 것입니다."
 INS_mobilize_the_pemuda: "청년단 동원"
 INS_mobilize_the_pemuda_desc: "이제 우리는 가장 큰 규모의 청년단들에게 신뢰를 얻었으므로, 그들을 인민안전군에 동원하기 위한 계획을 시작해야 합니다."
 INS_organize_jakarta_pemuda: "자카르타 청년단 조직"
 INS_organize_jakarta_pemuda_desc: "자바에는 다양한 규모의 청년단이 있습니다. 우리는 그중 대부분을 동원하고 모집했지만, 자카르타에는 여전히 독립적으로 활동하는 소규모 단체들이 수십 개 있습니다. 우리는 그들과 접촉하여 협력 관계를 구축해야 합니다."
 INS_recognize_moestopos_batallion: "무스토포의 대대 인정"
 INS_recognize_moestopos_batallion_desc: "무스토포라는 혁명가가 수라바야에서 자신을 '국방장관 대행'으로 선포하고 수라바야 민병대를 통제하고 있습니다. 그의 노고는 정식으로 인정받아야 마땅하며, 우리는 그를 공식적으로 인민안전군 소장으로 진급시켜야 합니다."
 INS_darul_islam_focus: "다룰 이슬람"
 INS_darul_islam_focus_desc: "카르토수위르요의 헤즈볼라는 자바 서부의 산악 지대에서 능력을 입증했으며, 우리는 그런 전사들을 우리 군대 밖에 둘 여유가 없습니다. 카르토수위르요의 비정규군들을 우리 군대에 합류시키고, 그가 자신에게 걸맞은 계급을 받게 하십시오. 신실한 자들은 머지않아 공화국에서 자신들의 입장을 밀어붙일 것입니다."
 # <Central Independence Branch - Navy>
 INS_just_a_fisherman: "그냥 어부인데요"
 INS_just_a_fisherman_desc: "해군 없이 제도에서 전쟁을 치르는 것은 어려운 일이며, 우리는 그런 전쟁을 더 이상 지속할 수 없습니다. 다소 순진한 전략일지 모르지만, 어부들로 변장한 민병대를 어선에 태워 네덜란드가 장악한 항구로 보내는 방법을 시도해 보겠습니다."
 INS_a_cheap_navy: "저가형 해군"
 INS_a_cheap_navy_desc: "우리는 대규모 현대식 해군을 구축할 시간도 돈도 없습니다. 현재 가진 것을 활용해야 하며, 얻을 수 있는 모든 것을 그러모아야 합니다."
 INS_divert_army_funds_to_navy: "육군 자금을 해군을 위해 전용"
 INS_divert_army_funds_to_navy_desc: "인도네시아는 제도이기 때문에, 우리 보병을 수송할 함선이 없으면 아무 소용이 없습니다. 인민안전군의 자금을 신설 해군에 투입하는 것은 가치 있는 희생입니다."
 INS_indonesian_naval_doctrine: "인도네시아 해군 교리"
 INS_indonesian_naval_doctrine_desc: "이제 우리가 자체적으로 해군을 건설하고 있는 만큼, 전투와 훈련에 적용할 교리를 고려하는 것이 중요합니다. 가능한 한 빨리 해군 교리를 형성하고 채택하는 것을 최우선 과제로 삼아야 합니다."
 INS_domestic_shipbuilding: "국내 함선 건조"
 INS_domestic_shipbuilding_desc: "언제까지나 함선을 나포하거나 구매할 수는 없습니다. 머지않아 나포할 네덜란드 함선이 더 이상 남지 않을 것입니다. 어서 자체적인 함선 건조를 시작해야 합니다."
 INS_acquire_modern_blueprints: "현대식 설계도 획득"
 INS_acquire_modern_blueprints_desc: "우리는 타국과 민간 기업으로부터 설계도를 구입하여 새로운 해군을 건설하는 데 사용할 것입니다."
 INS_reclaiming_the_dutch_navy: "네덜란드령 동인도 해군 탈환"
 INS_reclaiming_the_dutch_navy_desc: "네덜란드는 우리가 점령한 항구에 많은 함선을 남겨 두었습니다. 기회가 있을 때 이 함선들을 우리 것으로 만들어야 합니다."
 INS_admiral_mas_pardi: "마스 파르디 제독"
 INS_admiral_mas_pardi_desc: "훌륭한 해군에는 지휘할 제독이 필요합니다. 마스 파르디는 당연한 선택입니다."
 INS_akademi_angkatan_laut: "해군 사관학교 건설"
 INS_akademi_angkatan_laut_desc: "우리는 해군 연구 시설을 갖춘 해군 사관학교를 건설하고, 더 많은 시민을 공학자와 제독으로 양성할 것입니다."
 # <Central Independence Branch - Militia Logistics>
 INS_pki_militia_tt: "탄 말라카는 매우 강력한 민병대를 보유하고 있지만, 그들은 인도네시아의 대의만이 아니라 §R공산주의§!와 소련의 대의를 위해서도 싸웁니다. §R결국, 그들은 비공산주의 정부에 대해 폭력적으로 대항할 것입니다.§!"
 INS_increase_laskar_funding_tt: "민병대의 요구를 성공적으로 수용할 때마다 군수공장 1개를 §W획득§! §Y합니다§!(최대 §G6개§!)."
 INS_subsidize_laskar_armament: "민병대 무장에 보조금을 제공"
 INS_subsidize_laskar_armament_desc: "죽창으로 싸우는 민병대는 중무장한 부대에 맞서서 오래 버티지 못할 것입니다. 우리는 민병대를 위해 더 많은 총기와 탄약을 생산하는 것을 최우선 과제로 삼아야 합니다."
 INS_loot_knil_weapons_caches: "왕립 네덜란드령 동인도군 무기 은닉처 약탈"
 INS_loot_knil_weapons_caches_desc: "혁명 이전에 왕립 네덜란드령 동인도군이 조성한 무기 은닉처가 많이 있습니다. 우리 구성원 중 상당수는 과거 동인도군의 일원이었으며, 우리는 이러한 은닉처를 찾아 약탈할 수 있을지도 모릅니다."
 INS_utilize_tan_malakas_militia: "탄 말라카의 민병대 활용"
 INS_utilize_tan_malakas_militia_desc: "탄 말라카의 적색 민병대는 아마도 인도네시아에서 단일 민병대 중 가장 강력할 것이며, 이들을 인민안전군에 동원하는 것은 엄청난 이점이 될 것입니다. 하지만 여기에는 분명한 위험도 따릅니다. 강력한 정치적 동기를 가진 강력한 민병대에 이처럼 큰 영향력을 부여하면 그들이 직접 권력을 탈취하기가 훨씬 쉬워질 것입니다."
 INS_increase_laskar_funding: "민병대 자금 지원 증대"
 INS_increase_laskar_funding_desc: "우리 민병대는 우리 군대의 대다수를 차지합니다. 우리는 이것을 인정하고, 그에 걸맞은 자금 지원을 해야 합니다. 비록 그들이 [INS.GetLeader]에게 완전히 충성하지 않더라도 말입니다."
 INS_develop_a_functioning_airforce: "적절한 공군 양성"
 INS_develop_a_functioning_airforce_desc: "공군은 육군에 큰 영향을 미치므로, 공군 창설을 최우선 과제로 삼아야 합니다."
 # <Vice Presidential Edict - Intro>
 INS_political_stabilization: "질서 회복"
 INS_political_stabilization_desc: "우리 국가는 하루가 다르게 더욱 불안정해지고 있습니다. 조속히 행동을 취하지 않으면 내전은 거의 불가피합니다. 해결책을 찾기 위해 국가위원회, 대통령, 그리고 민병대 지도자 간의 협상을 개시해야 합니다."
 INS_vice_presidential_edict: "부통령 포고령 X호에 서명"
 INS_vice_presidential_edict_desc: "국가위원회는 실질적인 입법권을 요구하는 데 거의 만장일치로 동의하고 있습니다. 국가위원회가 독립적인 의회가 되어 대통령과 공동으로 입법권을 가지는 혼합형 체제를 제안하는 청원이 대통령에게 제출되었습니다. 이 제안은 매력적이지만, 대통령의 권한이 유명무실해질 위험도 있습니다."
 INS_local_cooperatives: "지역 협동조합 설립"
 INS_local_cooperatives_desc: "우리는 서방과 같은 자본주의 체제를 만들지 않아야 하지만, 민영화가 가져다주는 경제적 이점을 무시해서도 안 됩니다. 우리는 지역 협동조합 설립을 허용할 것이며, 협동조합의 성공은 소유자들에게 부를 가져다줄 것입니다. 그러나 협동조합은 정부의 감독을 받게 되며, 해당 지역 바깥으로 확장하는 것은 금지될 것입니다."
 INS_local_unity: "부분적인 제후국 자치"
 INS_local_unity_desc: "이미 혼란스러운 시기에 내분을 줄이기 위한 임시 조치로서, 우리는 제후국들에 부분적인 자치권을 부여할 것입니다."
 INS_education_subsidies: "교육 보조금"
 INS_education_subsidies_desc: "경제적으로 성공적인 국가를 원한다면 청년 국민의 미래에 대한 투자가 절대적으로 필요합니다. 우리는 공화국 곳곳에 누구나 부담 없이 다닐 수 있는 저렴한 학교를 세울 것입니다."
 INS_land_reform: "토지개혁"
 INS_land_reform_desc: "우리가 독립을 선언하기 전에, 네덜란드는 드넓은 토지를 직접 소유하고 있었습니다. 우리는 경제 성장을 촉진하기 위해 이 토지를 이용할 인도네시아인에게 저렴한 가격으로 분배해야 합니다."
 INS_dominion_of_atjeh: "아체 자치령"
 INS_dominion_of_atjeh_desc: "아체 지역의 분리주의 운동은 규모가 크며, 점점 더 커지고 있습니다. 상황을 악화시킬 이유가 없으므로, 그들이 인도네시아의 일부로 남으면서도 자치권을 대부분 누릴 수 있도록 하는 타협안을 협상해야 합니다."
 # <Vice Presidential Edict - Presidential Balance>
 INS_dissolve_national_party: "국민당 해산"
 INS_dissolve_national_party_desc: "혼합형 체제는 혼란을 피하기 위한 불가피한 타협안으로서 구성되었습니다. 우리는 대통령이 비민주적인 방식으로 이토록 많은 권력을 쥐도록 내버려둬서는 안 됩니다. 대통령은 의회에 의해 탄핵당해야 하며, 그래야만 민주주의를 실현할 수 있습니다."
 INS_womens_sufferage: "여성 참정권"
 INS_womens_sufferage_desc: "투표권이 여성에게도 확대된다면 단기적으로는 불안정을 초래할 수 있지만, 장기적인 안정과 민주주의를 위해서는 필수적인 일입니다."
 INS_women_in_military: "여군 제도"
 INS_women_in_military_desc: "여성의 군 복무를 허용하는 것은 우리 군대의 전력을 최대한 강화하기 위해 필요한 일입니다."
 INS_fair_election: "공정한 선거"
 INS_fair_election_desc: "대통령이 축출되고 혁명이 끝났으니, 우리는 마침내 권위주의적 영향이 없는, 진정으로 공정한 첫 선거를 치를 수 있습니다."
 # < Hybrid Politics >
 INS_continue_hybrid_politics: "혼합형 정치 지속"
 INS_continue_hybrid_politics_desc: "혼합형 정치 체제는 필요악입니다. 궁극적인 목표는 진정한 민주주의지만, 인도네시아는 아직 역사가 짧고 불안정한 국가이기 때문에 모든 권력을 국민에게 넘기기에는 이릅니다. 대통령과 의회는 서로를 견제하며, 한 쪽이 지나치게 강력해지지 않도록 균형을 유지할 것입니다."
 INS_guided_economy: "계획 경제"
 INS_guided_economy_desc: "우리는 인도네시아의 경제를 직접 감독하여 통제권을 유지할 것입니다. 은행과 석유 및 농업 부문을 전부 국유화할 것입니다."
 INS_reform_education_system: "의무적 이념 교육"
 INS_reform_education_system_desc: "혁명의 과정을 돌아보면, 사회 질서에 불만을 품은 학생들과 젊은이들은 언제나 반란을 주도한다는 것은 명확합니다. 우리 정부와 국가의 안전을 위해, 학교가 정부의 이념에 따라 교육하도록 의무화해야 합니다."
 INS_reform_education_system_2: "교육 개혁"
 INS_reform_education_system_2_desc: "인도네시아가 앞으로 부유한 국가가 되려면, 출신지에 상관없이 모든 인도네시아 국민이 교육받을 자격을 가져야 합니다."
 INS_three_year_plan: "3개년 계획"
 INS_three_year_plan_desc: "우리는 제도 전역에 기반시설을 건설하고 섬들을 연결하는 3개년 계획을 수립할 수 있습니다."
 INS_destroy_pacific_colonialism: "태평양 식민주의 파괴"
 INS_destroy_pacific_colonialism_desc: "혁명은 끝났을지 모르지만, 아직 치러야 할 전투가 남아 있습니다. 우리 코앞에도 여전히 많은 사람들이 식민 지배의 폭정 아래 살고 있습니다. 가만히 앉아서 지켜볼 수만은 없습니다. 그들을 지배자로부터 해방시키기 위해 행동에 나서야 합니다!"
 INS_rapid_mobilization: "신속한 동원령"
 INS_rapid_mobilization_desc: "강대국이라면 강력한 군대를 가지고 있어야 합니다. 우리가 지역의 강대국이 되어 입지를 확고히 다지려면, 우선 지금보다 훨씬 강력한 군대를 구축해야 합니다."
 INS_greater_indonesia: "대인도네시아 선포"
 INS_greater_indonesia_desc: "고대의 누산타라 제국은 한때 말레이 세계를 하나의 민족, 하나의 국가로 통합했습니다. 이제 우리는 말라야를 식민 지배의 폭정에서 해방했으므로, 누산타라의 우리 선조들처럼 말레이 세계 전체를 하나의 통일 국가로 선포해야 합니다."
 # < State Religion >
 INS_secularism: "세속주의"
 INS_secularism_desc: "인도네시아는 다양한 종교를 믿는 사람들이 함께 살아가는 곳입니다. 종교와 정치를 혼합할 경우 내분을 야기할 뿐이므로, 종교 정당은 금지해야 합니다."
 INS_integrate_sarekat_islam: "사레캇 이슬람 통합"
 INS_integrate_sarekat_islam_desc: "대형 이슬람 정당들은 크나큰 대중적인 지지를 받고 있습니다. 이들을 정부에 통합하는 것이 우리에게 가장 큰 이익이 될 것입니다."
 # <Vice Presidential Edict - Sjahrir>
 INS_sjahrirs_continued_tenure: "샤리르의 연임"
 INS_sjahrirs_continued_tenure_desc: "샤리르 총리는 혁명을 이끌고 경제를 발전시키며 민주주의를 확립함으로써 위대한 지도자임을 입증했습니다. 그를 총리로 재선출해야 합니다."
 INS_unity_in_diversity: "다양성 속의 통일"
 INS_unity_in_diversity_desc: "수 세기 동안 '다양성 속의 통일'이라는 말은 우리 제도의 정신이었습니다. 혁명 중에 이 사상은 우리를 결집하는 구호가 되어, 비록 우리가 다양한 언어를 사용하고 다양한 전통을 따르지만 하나의 민족으로서 함께한다는 것을 인도네시아 국민에게 일깨워주었습니다. 우리는 이 문구를 헌법에 명시하여, 우리의 단결이 미래 세대들에게 계속 이어지도록 해야 합니다."
 INS_the_timor_issue: "[INS_timor_issue_scripted_name]"
 INS_timor_issue_scripted_name_issue: "티모르 문제"
 INS_timor_issue_scripted_name_attack: "동티모르 공격"
 INS_the_timor_issue_desc: "[INS_timor_issue_scripted_desc]"
 INS_timor_issue_scripted_desc_issue: "동티모르는 명백히 인도네시아의 정당한 영토이며, 혁명은 끝났음에도 여전히 식민 통치하에 있습니다. 우리는 [721.OWNER.GetName]에 동티모르의 즉각적인 반환을 요구하는 최후통첩을 보낼 것입니다."
 INS_timor_issue_scripted_desc_attack: "동티모르는 명백히 인도네시아에 속해야 할 영토입니다. 섬의 반란군은 독립을 주장할지 모르나, 그들이 모든 주민을 대표하지 않는다는 점은 분명합니다. 포르투갈 식민주의의 잔재는 공화국에 통합되어야 합니다."
 INS_pledge_to_allies: "연합국에 서약"
 INS_pledge_to_allies_desc: "전 세계에서 악화되는 분쟁 속에서 우리는 침략당할 위험에 처해 있습니다. 연합국과의 관계는 불안정하지만, 우리는 태평양에서 민주주의 강대국으로서의 입지를 다졌으며, 민주주의 강대국들과 협력해야 합니다."
 INS_mixed_economy_system: "혼합 경제 체제"
 INS_mixed_economy_system_desc: "인도네시아는 독특한 국가이며 전통적인 자본주의나 공산주의하에서는 번영하지 못할 것입니다. 우리는 자본주의와 공산주의의 요소를 모두 포함하는 혼합 경제 체제를 구축해야 합니다."
 INS_social_democracy: "사회민주주의"
 INS_social_democracy_desc: "샤리르의 경제 정책이 시행된 이후 [INS.GetAdjective]의 경제는 엄청난 성장을 이루었습니다. 우리는 인도네시아를 완전한 사회민주주의 국가로 선언하고, 사회민주주의 원칙에 기반하여 앞으로의 경제 정책을 개발해야 합니다."
 # <Vice Presidential Edict - Sjarifuddin>
 INS_prime_minister_sjarifuddin: "샤리푸딘 총리"
 INS_prime_minister_sjarifuddin_desc: "샤리푸딘은 인도네시아에 있어 최선의 후보이며, 그의 온건한 정책은 공산주의자와 사회주의자 간의 타협을 가능하게 할 것입니다."
 INS_concessions_to_communists: "공산주의자에 대한 양보"
 INS_concessions_to_communists_desc: "인도네시아 공산당은 의회에 상당한 의석을 차지하고 있으므로, 안정을 확보하기 위해서는 인도네시아 공산당 지도자들에게 몇 개의 장관직을 부여해야 합니다."
 INS_sjarifuddin_focus_2: "자체 관리형 수출 경제"
 INS_sjarifuddin_focus_2_desc: "새롭게 독립한 우리는 수출 경제 체제를 재검토하고 더는 네덜란드의 이익을 고려하지 않도록 재편해야 합니다. 수출 중심 경제는 여전히 위험하지만, 과거보다 훨씬 더 신뢰성 있게 만들 수 있습니다."
 # <Vice Presidential Edict - Hatta>
 INS_prime_minister_hatta: "하타 총리"
 INS_prime_minister_hatta_desc: "혁명의 선포자로 알려진 모하맛 하타는 수카르노의 부통령을 역임했으며, 전반적으로 두 사람 중 더 민주적인 성향을 보였습니다. 그는 대부분의 정당이 타협할 수 있는 적합한 총리가 될 것입니다."
 INS_hatta_focus_2: "다음 단계"
 INS_hatta_focus_2_desc: "혁명은 끝났습니다. 일부 정치인들은 혁명이 계속되어야 한다고 주장하고 있지만, 이러한 목소리는 무시해야 합니다. 우리는 미래를 바라보고 미래 세대가 풍요롭게 살아갈 수 있는 인도네시아를 건설해야 합니다."
 INS_hatta_princely_advisors: "제후국 통합"
 INS_hatta_princely_advisors_desc: "우리는 공유된 다양성으로 단결을 이룩해 왔습니다. 이러한 원칙 위에 국가를 건설해 왔지만, 혁명이 종식된 후에 공동의 투쟁이 이루어지지 않으면서 이 이념에 압박이 가해지고 있습니다. 소수 집단의 불만과 봉기를 막기 위해, 제후국의 지방 통치자들이 국가 정치에 직접 참여할 수 있는 별도의 위원회를 설치해야 합니다."
 INS_prime_minister_tt: "인도네시아에서 최초의 총선거가 열렸습니다"
 # < Guided Democracy >
 INS_guided_democracy: "교도민주주의"
 INS_guided_democracy_desc: "민주주의가 이상적일 수는 있지만, 지금 권력을 국민에게 넘겨준다면 결국 혼란으로 이어질 뿐입니다. 우리는 수카르노를 종신 대통령으로 승격하여 민주주의 의회를 감독하고 필요할 경우 개입하도록 할 것입니다."
 INS_enact_militarism: "군국주의 시행"
 INS_enact_militarism_desc: "우리는 [JAP.GetNameDefCap] 및 그 군사 정책으로부터 교훈을 얻어야 합니다. 유사한 정책을 채택하면 우리의 새 정부에 이득이 될 것입니다."
 INS_sukarnos_industrialization: "자바의 산업 확충"
 INS_sukarnos_industrialization_desc: "자바의 산업은 우리의 경제와 군사의 중추입니다. 모든 길은 로마로 통해야 합니다."
 INS_sukarnos_industrialization2: "모든 이가 자신의 몫을 다하라"
 INS_sukarnos_industrialization2_desc: "전쟁 수행은 이 국가의 최우선 과제이며, 따라서 모든 인도네시아 국민이 전쟁에 기여하는 것 또한 최우선 과제입니다. 사치는 적이며, 군수산업 단지는 성장해야 합니다."
 INS_japanese_military_lessons: "일본의 군사 수업"
 INS_japanese_military_lessons_desc: "우리는 일본의 군사 교리를 연구하고 우리 군대를 그에 맞춰야 합니다."
 # < Support Tan Malaka's Coup>
 INS_support_tan_malakas_coup: "탄 말라카의 쿠데타 지원"
 INS_support_tan_malakas_coup_desc: "수카르노는 우리의 독립을 선언했지만, 그는 어중간한 조치와 외교적 양보밖에 못하는 인물임을 스스로 증명했습니다. 탄 말라카와 그의 투쟁 연합은 국민이 원하는 바를 요구합니다. 바로 어떤 협상도, 타협도 없는 완전한 독립입니다. 수카르노가 온전히 혁명을 위해 싸우지 않는다면, 혁명은 끝까지 싸울 지도자를 찾아야 합니다."
 INS_minimum_program: "최소한의 계획"
 INS_minimum_program_desc: "투쟁 연합은 인민의 정부, 인민의 군대, 그리고 모든 외국 소유 농장과 산업의 국유화라는 요구를 내걸었습니다. 우리는 이 계획을 추진할 유능한 사람들이 필요합니다. 뇨노는 노동자들을 대변하며, 세티아짓은 당의 지식인들을 대변합니다. 이들은 함께 공장에서부터 정부 기관에 이르기까지 혁명을 조직적으로 이끌어갈 것입니다."
 INS_agrarian_reform: "농업 개혁"
 INS_agrarian_reform_desc: "3세기 동안 인도네시아의 토지는 외지인들의 농장을 먹여 살렸습니다. 그 땅에서 일해 온 농민들은 농사일 외에는 거의 아는 것이 없었습니다. 이를 바꾸지 않는 혁명은 절대로 혁명일 수 없습니다. 우리는 토지가 그 토지를 경작하는 자들의 품으로 돌아가게 할 것입니다."
 INS_soviet_aid: "소련의 원조"
 INS_soviet_aid_desc: "소비에트 연방은 우리의 혁명을 인정했고, 필요한 물자를 지원할 준비가 되어 있습니다. 우리의 계획과 모스크바의 계획 사이에 어떤 차이가 있더라도, 우리는 그들의 지원을 거부할 여유가 없습니다. 우리는 무기를 들고 밀어붙여야 합니다."
 INS_pacific_revolution: "태평양 혁명"
 INS_pacific_revolution_desc: "식민주의 강대국들은 아시아에서 완전히 철수한 것이 아니라, 인도네시아에서만 철수했을 뿐입니다. 말라야와 필리핀 같은 곳에는 여전히 오래된 질서가 유지되고 있으며, 두 곳 모두에 그 질서를 전복하려는 사람들이 있습니다. 우리 혁명은 우리에게 그들을 도울 수 있는 지위와 의무를 부여했습니다. 그들을 도와야 합니다."
 INS_purge_oppurtunists_tt: "공산주의 지지율이 §Y60%§! 이상인 국가에서 §Y$INS_launch_revolution$§!가 잠금 해제됩니다. 우리가 혁명을 조장하는 국가는 우리의 §Y괴뢰국§!이 될 것입니다."
 INS_purge_oppurtunists: "기회주의자 숙청"
 INS_purge_oppurtunists_desc: "무쏘는 모스크바에서 20년을 보내며 명령에 복종하는 법을 배웠습니다. 그는 소련의 지시서를 갖고 돌아와 우리 공화국을 코민테른의 꼭두각시로 만들 계획을 세웠습니다. 우리가 네덜란드의 지배에서 벗어난 것은 또 다른 외국에 무릎 꿇기 위함이 아닙니다. 우리의 혁명을 모스크바에 팔아넘기려는 기회주의자들은 근절되어야 하며, 우리가 해방시킨 민중은 크렘린이 아닌 자카르타를 바라보게 해야 합니다."
 INS_federation_of_aslia: "아슬리 연방"
 INS_federation_of_aslia_desc: "우리가 해방시킨 국가들은 홀로 설 필요가 없습니다. 탄 말라카는 언제나 하나의 공화국보다 더 큰 이상을 갖고 있었습니다. 본토에서 태평양까지 뻗어 있는 연방, 감히 다시 돌아오려는 어떤 식민주의 강대국에도 단결하여 맞서는 연방을 말입니다. 우리는 그들에게 우리 국가의 완전한 구성원 자격을 부여할 것입니다."
 INS_aslia_tt: "§Y태평양§! 종속국에 대한 핵심 주 획득과 합병이 가능해집니다"
 INS_musso_ascends: "무쏘의 집권"
 INS_musso_ascends_tt: "공산주의 지지율이 §Y30%§! 이상인 국가에서 §Y$INS_launch_revolution$§!가 잠금 해제됩니다. 우리가 혁명을 조장하는 국가는 독립국으로 남을 것입니다."
 INS_musso_ascends_desc: "탄 말라카는 몽상가입니다. 무쏘는 몽상가들이 못 하는 일을 해냅니다. 바로 소련의 전폭적인 지지와 국제 공산주의 운동의 연대입니다. 우리는 혼자서 혁명을 해낼 필요가 없습니다."
 INS_soviet_economic_integration: "소련의 경제 통합"
 INS_soviet_economic_integration_desc: "혁명은 우리에게 자유를 주었지만, 자유만으로는 공장을 짓거나 대중을 먹여 살릴 수 없습니다. 소련은 어떤 자본주의 국가도 제공하지 않을 것을 우리에게 제공합니다. 바로 산업 전문 지식, 개발 융자금, 그리고 식민주의적 족쇄가 붙지 않는 조건의 무역입니다. 이를 거부한다면 어리석은 짓일 것입니다."
 # <National Revolution - Reasserting Control>
 INSHOL_revolution_ongoing_tt: "인도네시아 혁명이 진행 중"
 INSHOL_reasserting_control: "동인도 제도에 대한 지배권 재주장"
 INSHOL_reasserting_control_desc: "이러한 기회주의자들이 우리가 수 세기 동안 쌓아온 것을 망치고, 기반시설을 파괴하며, 젊은이들을 급진화하려는 것을 가만히 지켜볼 수만은 없습니다. 우리는 행동에 나서야 합니다!"
 INSHOL_request_british_support: "영국의 지원 요청"
 INSHOL_request_british_support_desc: "같은 식민주의 강대국이었던 [ENG.GetNameDefCap](은)는 우리의 상황에 공감할 가능성이 높으며, 혁명 세력이 승리하면 동아시아에 연쇄적인 파급 효과가 발생할 수 있습니다. 우리는 영국에 경제적, 군사적 지원을 요청해야 합니다."
 INS_eng_treaty_holside_tt: "§Y[ENG.GetNameDefCap]§!(은)는 이 분쟁에서 공식적으로 우리 편에 서겠다고 선언하고 상당한 지원을 제공할 것입니다. 만약 전쟁에서 승리한다면, §Y[ENG.GetNameDefCap]§!(은)는 보르네오에 대한 권리를 인정받게 될 것입니다."
 INS_eng_treaty_engside_tt: "우리는 동인도 분쟁에서 공식적으로 §Y[HOL.GetNameDefCap]§!의 편을 들었습니다. §Y[HOL.GetNameDefCap]§!(이)가 승리할 경우 우리는 보르네오에 대한 권리를 인정받게 될 것입니다."
 INS_fra_treaty_holside_tt: "§Y[FRA.GetNameDefCap]§!(은)는 이 분쟁에서 공식적으로 우리 편임을 선언하고 상당한 지원을 제공할 것입니다. 만약 전쟁에서 승리한다면, §Y[FRA.GetNameDefCap]§!(은)는 수마트라 북동부에 대한 권리를 인정받게 될 것입니다."
 INS_fra_treaty_fraside_tt: "우리는 동인도 분쟁에서 공식적으로 §Y[HOL.GetNameDefCap]§!의 편을 들었습니다. §Y[HOL.GetNameDefCap]§!(이)가 승리할 경우 우리는 수마트라 북동부 지역에 대한 권리를 인정받게 될 것입니다."
 INSHOL_franco_dutch_accord: "프랑스-네덜란드 협정"
 INSHOL_franco_dutch_accord_desc: "우리 군대가 공화국 민병대보다 장비와 조직력 면에서 우월함에도 불구하고, 적들의 압도적인 수적 우세 때문에 전황이 우리에게 불리하게 흘러가고 있습니다. 승리를 확보하기 위해서는 보통의 지원 수준을 넘어서는 외부 원조가 필요합니다. 프랑스는 우리가 그들에게 태평양에서의 영향력을 확대할 수 있도록 동인도 제도의 영토를 제공한다면 개입할 의향이 있을지도 모릅니다."
 INSHOL_london_batavia_accord: "런던-바타비아 협정"
 INSHOL_london_batavia_accord_desc: "우리 군대가 공화국 민병대보다 장비와 조직력 면에서 우월함에도 불구하고, 적들의 압도적인 수적 우세 때문에 전황이 우리에게 불리하게 흘러가고 있습니다. 승리를 확보하기 위해서는 보통의 지원 수준을 넘어서는 외부 원조가 필요합니다. [ENG.GetNameDefCap](은)는 말라야에 식민지를 두고 있기 때문에 관심을 가질 수도 있습니다. 뭔가 대가를 제공한다면 그들을 설득할 수 있지 않을까요?"
 INSHOL_australian_divisions: "호주 보병을 자바로 파견"
 INSHOL_australian_divisions_desc: "런던-바타비아 협정에 따라, 영국은 우리가 요청할 경우 호주를 통해 동인도 제도에 추가 사단을 파견해야 합니다. 호주는 동인도 제도와 지리적으로 가까워 동인도 제도 외부에 군사 기지를 건설하기에 완벽한 후보지이기 때문입니다."
 INSHOL_indian_divisions: "영국령 인도 육군 사단"
 INSHOL_indian_divisions_desc: "영국은 자국 병력을 동인도에 파견하는 것을 꺼릴 가능성이 높지만, 바타비아와 지리적으로 가깝다는 점을 고려하면 인도의 사단을 파견하도록 설득하는 것은 훨씬 쉬울 것입니다."
 INSHOL_undermine_the_militias: "민병대 약화"
 INSHOL_undermine_the_militias_desc: "언론은 이 상황의 심각성을 과장하고 있습니다. 민병대는 그저 이룰 수 없는 것을 갈망하는 불량 청년들의 집단일 뿐입니다. 그들을 막기 위해 모든 자원을 투입할 필요는 없습니다. 우리는 전선을 유지하면서 그들이 지칠 때까지 기다려야 합니다."
 INSHOL_flag_will_fly_again: "그 깃발이 다시 휘날리리라"
 INSHOL_flag_will_fly_again_desc: "네덜란드 국기는 수 세기 동안 동인도에 게양되어 왔으며, 우리는 어떤 상황에서도 그 국기가 내려지는 것을 용납하지 않을 것입니다. 왕관의 보석 같은 식민지를 지키기 위해 전차와 폭격기를 보내야 한다면, 그렇게 할 것입니다!"
 INSHOL_flag_will_fly_again_tt: "§Y혁명이 끝나면 이 정신이 제거되고 변경된 규칙이 되돌려집니다.§!"
 # <National Revolution - Escalation>
 INSHOL_mass_mobilization: "대규모 동원"
 INSHOL_mass_mobilization_desc: "장비가 잘 갖추어진 군대 없이는 이 전쟁에서 승리하여 공화국을 무너뜨릴 수 없습니다. 우리는 동인도 제도를 재무장시키고 민간 분야의 자금을 왕립 네덜란드령 동인도군으로 전환해야 합니다."
 INSHOL_batavia_storm_operation: "바타비아 습격"
 INSHOL_instigate_infighting: "공화국 내에 내분 조장"
 INSHOL_ultimatum_to_republic: "공화국에 최후통첩"
 INSHOL_comite_rijkseenheid: "왕국통일위원회"
 INSHOL_comite_rijkseenheid_desc: "동인도에서 국기가 내려지고 있는데, 사람들은 그저 보기만 하고 있습니다. 우리는 이것을 용납할 수 없습니다, 네덜란드인 국민들이 혁명을 막기를 원한다는 것을 동인도의 행정부에 반드시 납득시켜야 합니다!"
 INSHOL_increase_esclation_placeholder: "급속한 격화"
 INSHOL_increase_esclation_placeholder_desc: "우리 민병대는 여러 주요 항구, 도시 및 산업 중심지를 장악했습니다. 우리는 더 이상 네덜란드의 행동을 기다리지 않고, 우리 스스로 대규모 군사 공세를 촉구할 것입니다!"
 INS_take_batavia_explination_tt: "우리가 자바 전체를 점령하는 데 성공한다면, 식민 정부를 내부에서부터 무너뜨리고 §G전쟁에서 승리§!하게 될 것입니다. 하지만 §Y730일§! 이내에 그렇게 하지 못하면 우리는 §R멸망§!할 것입니다."
 INSHOL_linggadjati_agreement: "휴전 협정 협상"
 INSHOL_linggadjati_agreement_desc: "자바 침공은 난관에 봉착했고, 우리 행정부는 점점 불안정해지고 있습니다. 공화국 전체의 몰락을 막기 위해 우리는 후퇴하여 방어 태세를 취해야 합니다. 우리는 네덜란드와 국지적 휴전 협상을 통해 군대를 재정비한 후 다시 자바에 집중해야 합니다."
 INSHOL_increase_esclation_placeholder_tt: "현지 휴전 협상을 진행하고 자바 점령 §Y기간을 연장§!하는 §Y결정§!을 잠금 해제합니다."
 # <National Revolution - Peace Negotiation>
 INSHOL_seek_foreign_help: "외국의 지원 모색"
 INSHOL_seek_foreign_help_desc: "제대로 된 경제를 갖추지 못한 신생 국가가 이미 산업화된 식민주의 강대국을 상대로 전쟁에서 승리하는 것은 거의 불가능한 일입니다. 우리의 대의를 지지하는 다른 국가들과 접촉하여 그들이 우리를 도와줄 의향이 있는지 알아봐야 합니다."
 INSHOL_renville_agreement: "렌빌 협정"
 INSHOL_renville_agreement_desc: "네덜란드의 전례 없는 공격적인 행동은 혁명에 대한 국제적인 관심을 불러일으켰지만, 네덜란드는 여전히 휴전 협정을 위반하고 우리의 반발을 유도하고 있습니다. 우리는 [USA.GetNameDef]에 호소해야 합니다. 그들이 인도네시아를 지지하도록 설득한다면, 네덜란드는 물러설 수밖에 없을 것입니다."
 INSHOL_no_compromise: "타협도 항복도 없다"
 INSHOL_no_compromise_desc: "네덜란드는 탐욕으로 인해 동쪽 섬들을 무시하고 거의 자바에만 투자한 결과, 자바는 식민지 전체의 아킬레스건이 되었습니다. 이것이 바로 그들이 몰락하는 원인이 될 것입니다!"
 INSHOL_end_to_bloodshed: "두 국가 해법"
 INSHOL_end_to_bloodshed_desc: "이 분쟁은 너무나 오래 지속되었고, 어느 쪽으로도 거의 진전이 없었으며, 매일 더 많은 목숨이 사라지고 있습니다. 누구도 이러한 상황이 계속되는 것을 원하지 않습니다. 이제 협상 테이블에서 네덜란드의 지도자들과 논의할 때입니다."
 INSHOL_reorganize_colonies: "식민지 재편"
 INS_we_will_need_another_tt: "우리는 이미 자바를 완전히 지배하고 있으므로, 자바 외에 지배하는 주를 하나 추가해야 합니다."
 # Industry Branch - New
 INS_centralize_the_state: "국가 중앙집권화"
 INS_centralize_the_state_desc: "수마트라에서 술라웨시까지, 보르네오에서 방카까지, 우리의 개발 계획은 한때 명목상으로만 [1058.GetName](이)가 관리하던 지역에 도로, 공장, 그리고 기관들을 건설해 왔습니다. 이제 이 지역들은 더 이상 멀리 떨어진 지역이 아닙니다. 바로 [INS.GetNameDefCap]입니다."
 INS_centralize_the_state_1_tt: "선행조건으로서 다음이 §Y핵심§! 주여야 함:"
 INS_centralize_the_state_2_tt: "선행조건으로서 다음이 §Y비핵심§! 주여야 함:"
 INS_fate_of_de_javasche_bank: "[INS_fate_of_de_javasche_bank_scripted_name]"
 INS_fate_of_de_javasche_bank_scripted_name_colony: "자바은행의 운명"
 INS_fate_of_de_javasche_bank_scripted_name_independent: "인도네시아 은행의 운명"
 INS_fate_of_de_javasche_bank_desc: "[INS_fate_of_de_javasche_bank_scripted_desc]"
 INS_fate_of_de_javasche_bank_scripted_desc_colony: "동인도 길더화는 그 공황 이후 급락세를 보이고 있으며, 자바은행은 이러한 하락세를 막을 수단이 없습니다. 남아 있는 투자자들의 신뢰가 완전히 사라지기 전에 우리 통화를 안정시킬 방법을 결정해야 합니다."
 INS_fate_of_de_javasche_bank_scripted_desc_independent: "우리는 위기에 처한 통화를 물려받았습니다. 옛 식민지의 길더화는 이미 불안정했고, 루피아화로의 전환은 시장 안정화에 아무런 도움이 되지 못했습니다. 정부는 인도네시아 은행에 분명한 방침을 내려야 합니다. 그렇지 않으면 우리의 신생 경제는 그 대가를 치르게 될 것입니다."
 INS_finish_the_bauxite_project: "방카 계획 완료"
 INS_finish_the_bauxite_project_desc: "방카블리퉁 전역에 새로운 도로, 항구, 철도가 개통되면서, 조사단은 초기의 예상보다 훨씬 많은 텅스텐과 크롬 매장량을 발견했다고 보고했습니다. 이 섬들은 앞으로 공화국에 그 가치를 입증할 것입니다."
 INS_australian_contracts: "호주와의 계약"
 INS_australian_contracts_desc: "우리의 고무 생산량은 국내 수요를 훨씬 웃돌고 있습니다. 호주는 자국의 산업을 위해 많은 원자재를 필요로 하기 때문에, 우리의 이상적인 무역 상대라 할 수 있습니다. 호주의 기업과 장기 계약을 체결하면 안정적인 수익을 창출하고 지역 경제에서 우리의 입지를 강화할 수 있을 것입니다."
 INS_coopereate_with_chinese_businessmen: "중국 사업가들과의 협력"
 INS_coopereate_with_chinese_businessmen_desc: "부유하고 인맥이 넓은 상인 계층은 오랫동안 제도 전역에서 무역을 촉진해 왔습니다. 이러한 기존 네트워크는 배제하지 않고 협력해야 합니다. 그들의 자본과 상업적 전문 지식은 우리 경제가 현재의 문제를 해결하는 데 매우 유용한 역할을 할 수 있을 것입니다."
 INS_oil_decisions_unlock_tt: "§Y석유§!를 판매하는 새로운 §Y$INS_realign_supply_chains_cat$§! 결정을 잠금 해제합니다."
 INS_negotiate_new_contracts_unlock_tt: "새로운 §Y$INS_realign_supply_chains_cat$§! 결정을 잠금 해제합니다."
 INS_realign_supply_chains_explain_tt: "2년 임대 계약으로 민간 기업에 자원을 판매할 수 있는 §Y$INS_realign_supply_chains_cat$§! 결정을 잠금 해제합니다."
 INS_negotiate_new_contracts: "새로운 계약 협상"
 INS_negotiate_new_contracts_desc: "신뢰할 수 있는 공급처로서 명성을 쌓아온 덕분에, 이전에는 닫혀 있던 기회들이 열리고 있습니다. 새로운 구매자들이 관심을 보이고 있으니, 우리 경쟁자들이 더 낮은 가격을 제시하기 전에 신속하게 장기 계약을 체결해야 합니다."
 INS_all_in_on_rubber: "고무에 올인"
 INS_all_in_on_rubber_desc: "고무는 우리의 가장 강력한 수단이며, 우리는 이를 활용할 것입니다. 가용한 모든 경작지를 고무 재배지로 전환하고, 수출 체계를 재편하여 이 지역에서 가장 빠르고 저렴하게 고무를 수출할 수 있도록 할 것입니다."
 INS_more_market_resources: "물량으로 대공황을 압도"
 INS_more_market_resources_desc: "세계는 경제 위기에 빠져 있지만, 과감한 자는 위기에서 기회를 찾아냅니다. 우리는 경쟁자들이 따라올 수 없는 가격으로 우리 상품을 시장에 대량 공급함으로써, 세계 경제가 회복될 때쯤이면 인도네시아 제품이 모든 매장과 창고에 자리 잡고 있도록 할 것입니다."
 # <Industry Branch - Trade Policy>
 INS_recovering_from_the_great_depression: "대공황에서 회복"
 INS_recovering_from_the_great_depression_desc: "대공황은 [INS.GetNameDef] 경제에 엄청난 타격을 입혔습니다. 우리 경제는 주로 수출에 기반을 두고 있는데, 전 세계적인 보호무역주의로 인해 심각한 어려움을 겪었습니다. 세계 무역이 다시 개방될 조짐을 보이는 지금, 우리는 새로운 시장을 찾아내고 기존 무역로를 재건하기 위해 노력해야 합니다."
 INS_first_come_first_serve: "선착순으로 거래합니다"
 INS_first_come_first_serve_desc: "대공황 시기의 보호무역주의가 둔화되고 있는 가운데, 생산량 증가와 길더화의 가치 과대평가로 네덜란드 수출 시장은 큰 타격을 입었습니다. 서방의 기존 무역 파트너들이 수요를 충족하기 위해 남아메리카로 눈을 돌렸기 때문입니다. 새로운 무역 협정을 위해 이들을 쫓아다니기보다는, 이 상황을 기회로 삼아 아시아의 새로운 시장으로 확장하는 것이 나을 수도 있습니다."
 INS_oil_export: "석유 수출 증가"
 INS_oil_export_desc: "우리는 새로운 무역 파트너들과의 무역 거래를 확보하기 위해 수마트라와 칼리만탄의 석유 기반시설을 개선할 것입니다."
 INS_increased_trade_with_japan: "일본과의 무역 증대"
 INS_increased_trade_with_japan_desc: "[JAP.GetNameDefCap](은)는 점점 더 가치 있는 무역 파트너가 되어 왔으며 우리를 실망시키지 않았습니다. 우리는 양국 간 경제 협력을 더욱 증진하고 대공황의 후유증을 떨쳐내기 위해 새로운 무역 협정을 체결해야 합니다. 이는 서방 동맹국, 특히 네덜란드의 반발을 살 수도 있습니다. 그러나 우리가 스스로의 운명을 결정하려면 우리만의 교역망을 확보해야 할 것입니다."
 INS_asian_trade_investments: "아시아 무역 투자"
 INS_asian_trade_investments_desc: "대공황의 참상은 우리가 서방의 장기 무역 파트너들에게 얼마나 과도하게 의존해 왔는지를 보여주었습니다. 우리 경제가 주로 수출에 기반을 두고 있는 만큼, 어떤 국가에도 의존하지 않도록 동남아시아의 새로운 시장을 개발하고 확대하는 것이 그 어느 때보다 중요합니다."
 INS_asian_trade_investments_tt: "§Y420§!일마다 §Y대공황§!으로 인한 시장 자원 부족 불이익이 §Y5%§!씩 §G개선§!되며, 부정적인 변동치가 완전히 사라질 때까지 지속됩니다."
 INS_declare_free_trade: "자유 무역 선언"
 INS_declare_free_trade_desc: "우리는 특정 국가에만 전적으로 의존해서는 안 되며, 시장이 자연스럽게 [INS.GetNameDef]에게 최선인 결정을 내리도록 해야 합니다."
 INS_japanese_export_contracts: "모든 무역 계약을 지배할 하나의 무역 계약"
 INS_japanese_export_contracts_desc: "우리는 [JAP.GetNameDef](와)과 중요한 무역 협정을 협상하여, [1049.GetName](와)과 [672.GetName]의 모든 고무를 판매할 것입니다. 매우 저렴한 가격으로 판매하겠지만, 전량 판매를 보장받을 것입니다."
 INS_realign_supply_chains: "공급망 재조성"
 INS_realign_supply_chains_desc: "대공황 시기의 보호무역주의가 둔화되고 있는 가운데, 생산량 증가와 길더화의 가치 과대평가로 네덜란드 수출 시장은 큰 타격을 입었습니다. 서방의 기존 무역 파트너들이 수요를 충족하기 위해 남아메리카로 눈을 돌렸기 때문입니다. 우리는 동맹국들이 다시 우리와 무역을 시작하도록 설득하기 위한 조치를 취해야 합니다."
 INS_invite_foreign_companies: "아메리카 석유 벤처 지원"
 INS_invite_foreign_companies_desc: "스탠더드 오일 캘리포니아는 1930년부터 네덜란드 자회사인 네덜란드 태평양 석유 회사를 통해 우리 국가에서 사업을 운영해 왔습니다. 그들이 리아우에서 탐사한 결과는 가능성이 높아 보이며, 우리는 가능한 모든 방법으로 그들의 상류 부문 사업을 지원해야 합니다. 대규모 유전 발견은 우리의 수익을 증대시킬 것이며, 다른 국제 기업들이 우리에게 투자하도록 유도할 것입니다."
 INS_expand_sea_routes: "항로 확장"
 INS_expand_sea_routes_desc: "우리 국가는 천연자원이 풍부하지만, 채굴 산업이 지나치게 전문화되어 있어서 크롬이나 텅스텐 같은 희귀 광물을 채굴하는 데 필요한 기반시설이 부족합니다. 군수 생산 능력을 향상시키려면 희귀 광물을 다른 곳에서 수입해야 할 것입니다. 성장 중인 무역망을 최대한 활용하려면 상선 함대의 적재량을 증가시켜야 합니다."
 INS_ship_contracts: "함선 계약 확보"
 INS_ship_contracts_desc: "전쟁 발발 시 무역로를 유지하기 위해서는 해군을 양성해야 합니다. 새롭게 구축한 무역 관계를 활용하여 해군 관련 계약을 체결할 수 있습니다."
 # <Industry Branch - Sumatra>
 INS_developing_sumatra: "수마트라 개발"
 INS_developing_sumatra_desc: "수마트라는 이 제도에서 자원이 가장 풍부한 섬이지만, 기반시설이 너무 부족해서 채굴된 자원의 대부분이 바타비아로 돌아오지도 못하고 있습니다. 교통은 비포장도로와 연결되지 않은 철도망에 의존하고 있는데, 이는 섬 개발 계획을 지원하기에 턱없이 부족합니다. 이런 상황을 계속해서 내버려둘 수는 없습니다."
 INS_sumatra_railway: "수마트라 철도"
 INS_sumatra_railway_desc: "수마트라의 기반시설 개발을 위한 지속적인 노력으로서, 우리는 아체 북쪽에서 수마트라 최남단 항구까지 이어지는 대규모 철도를 건설해야 합니다. 이 철도는 함선에 의해 바타비아와 신속하게 연결될 것입니다. 이렇게 하면 자원을 가장 가까운 기차역까지만 운송하면 되고, 거기서 며칠 만에 바타비아로 옮길 수 있게 됩니다."
 INS_develop_borneo: "칼리만탄 개발"
 INS_develop_borneo_desc: "칼리만탄은 막대한 부를 창출할 잠재력을 지니고 있지만, 이 섬은 매우 낙후되어 있고 주민들은 빈곤에 시달리고 있습니다. 화물 운송은 섬의 수많은 강과 수로에 크게 의존하고 있으며, 전력 부족으로 장거리 통신이 어려운 상황입니다. 송전선과 도로를 건설하면 우리는 미래의 자원 탐사 및 개발을 위한 기반을 마련할 수 있습니다."
 INS_kalimantan_mic: "칼리만탄 군수산업"
 INS_kalimantan_mic_desc: "칼리만탄에서의 기반시설 개발이 결실을 맺었습니다. 전기와 통신이 확산되면서 이전에는 정부의 연락이 닿지 않던 지역과 접촉할 수 있게 되었습니다. 이러한 기회를 활용하여 이 지역에 새로운 공장을 건설하고 새롭게 확보된 노동력을 투입함으로써 필요한 만큼 군수 생산을 증가시킬 수 있을 것입니다."
 INS_pontianak_to_balikpapan: "폰티아낙에서 탄중슬로르까지"
 INS_pontianak_to_balikpapan_desc: "칼리만탄에 철도를 건설하자는 아이디어는 오랫동안 논의되어 왔지만, 섬 중앙의 지형이 험준하면서 대부분 미개척되어 있기 때문에 건설이 쉽지 않습니다. 유일한 해결책은 해안에서 해안까지 이어지는 U자형 철도입니다. 비용은 많이 들겠지만, 장기적으로는 그 비용을 돌려받을 수 있을 것입니다."
 INS_develop_sulawesi: "술라웨시 개발"
 INS_develop_sulawesi_desc: "술라웨시는 이 제도의 중심이며, 따라서 전략적으로 중요한 위치입니다. 전쟁 발발 시 군사 중심지로 활용될 수 있도록 도로, 송전선, 통신망을 구축해야 합니다."
 # <Industry Branch - Bangka Project>
 INS_the_bangka_project: "방카 계획"
 INS_the_bangka_project_desc: "방카블리퉁은 크기는 작지만 보크사이트 매장량이 풍부하여 인도네시아 경제의 기반을 이루고 있습니다. 방카블리퉁의 풍부한 광물 자원을 최대한 활용하기 위해서는 도로, 항구, 철도 건설이 필요합니다."
 INS_aluminium_factory: "팡칼피낭 알루미늄 공장"
 INS_aluminium_factory_desc: "우리의 보크사이트 원광 채굴량은 증가하고 있지만, 국내 알루미늄 생산량이 부족하여 수익성이 크지 않습니다. 방카블리퉁의 주도인 팡칼피낭은 자국의 공장을 설립하기에 이상적인 장소입니다. 이를 통해 중간 상인을 배제하고 수익을 극대화할 수 있을 것입니다."
 INS_bauxite_export: "보크사이트 수출 강력 추진"
 INS_bauxite_export_desc: "방카 계획이 완료됨에 따라 우리가 처리할 수 있는 양보다 더 많은 보크사이트가 남게 되었습니다. 이 보크사이트를 전량 판매하는 것은 어렵겠지만, 시장의 경쟁자들보다 훨씬 낮은 가격으로 판매한다면 전량 판매가 가능합니다. 판매할 수 있는 보크사이트의 양이 워낙 많기 때문에, 이러한 가격 정책을 통해 현재 수출량 대비 수익이 비례적으로 증가할 것으로 예상됩니다."
 INS_tin_mining: "주석 채굴에 투자"
 INS_tin_mining_desc: "방카블리퉁의 주석 채굴은 유럽인들이 이 제도에 나타나기 전부터 시작되었습니다. 따라서 이곳의 주석 산업에 현대화가 시급한 것은 당연합니다. 생산 역량을 전면 재정비하는 일은 막대한 비용이 소요되는 작업이며, 기존의 주석 산업은 재건이 진행되는 동안 당분간 운영이 중단될 것입니다. 하지만 장기적인 수익 창출 잠재력은 매우 큽니다."
 in_240_days_tt: "§Y240일 후:§!\n"
 INS_tin_to_usa: "[USA.GetNameDef]에 주석 판매"
 INS_tin_to_usa_desc: "[USA.GetNameDefCap](은)는 주석을 구매 중인 기업과 정부 기관으로 가득합니다. 이제 제대로 된 채굴 작업을 할 수 있게 되었으니, 이곳에서 많은 수익을 낼 기회가 생겼습니다."
 INS_tin_to_japan: "[JAP.GetNameDef]에 주석 판매"
 INS_tin_to_japan_desc: "[JAP.GetNameDefCap](은)는 현재 구식이거나 대체 가능한 함선들을 많이 보유하고 있습니다. 하지만 이러한 함선들은 [INS.GetAdjective] 해군에 딱 맞는 함선들입니다. 우리는 주석 생산으로 얻은 돈으로 이 함선들을 구매해야 합니다."
 INS_tin_to_japan_tt: "[JAP.GetNameDefCap](이)가 상대적으로 오래된 구축함 §Y9§!척을 우리에게 보내줄 것입니다."
 INS_new_bauxite_routes: "새로운 보크사이트 판로"
 INS_new_bauxite_routes_desc: "가격을 낮추어 보크사이트 수출량을 늘리는 전략은 성공적이었고, 총수입도 크게 증가했습니다. 하지만 여기서 멈춰서는 안 됩니다. 계속해서 무역망을 확장하고, 공급망을 최적화하며, 수익을 극대화할 수 있는 다른 기회를 모색해야 합니다."
 INS_bangka_bauxite_export_flag: "§Y$INS_bauxite_export$§! 중점 완료:"
 INS_not_industry: "미래 계획하기"
 INS_not_industry_desc: "자바는 우리 국가의 심장부로서, 인구 대부분이 거주하며 정부 청사가 있는 곳입니다. 섬을 본격적으로 산업화하려면 먼저 기반을 다져야 합니다. 토지 조사, 용도 지역 할당, 부지 정리 작업을 통해 공장을 건설할 때 가장 큰 효과를 낼 수 있는 곳에 건설되도록 해야 합니다."
 INS_construction_focus: "산업의 급성장"
 INS_construction_focus_desc: "외국 자본이 유입되고 수출 수익이 증가하면서, 수년 만에 처음으로 국내 산업에 투자할 수 있는 실질적인 자금이 생겼습니다. 우리는 이 기회를 잡아 유리한 조건일 때 건설을 시행해야 합니다."
 # <Industry Branch - Java>
 INS_developing_java: "자바의 기반시설 확장"
 INS_developing_java_desc: "자바는 이 제도에서 가장 산업화된 섬이며, 우리 부의 대부분을 창출하는 원천입니다. 하지만 바타비아와 같은 일부 도시는 인구 증가로 인해 점점 더 혼잡해지고 있습니다. 증가하는 인구를 수용하기 위해서는 새로운 주택, 상업 지구, 트램, 기차, 공장 등을 건설하여 이러한 도시들을 확장해야 합니다."
 INS_prioritize_sugar_economy: "설탕 경제 우선"
 INS_prioritize_sugar_economy_desc: "바타비아 산업 개발에 책정된 정부 예산을 줄여야 합니다. 바타비아는 이미 제도 내의 다른 도시들보다 훨씬 더 산업화되어 있습니다. 대신, 이 예산을 사용해서 전국에 소규모 야자수 농장을 많이 조성해야 합니다. 이 농장들은 국제적으로 수요가 높은 야자 설탕을 생산할 것입니다."
 INS_all_cards_into_industry: "산업에 모든 카드를"
 INS_all_cards_into_industry_desc: "산업화는 [1058.GetName]의 경제에 엄청난 영향을 미쳤습니다. 수천만 명의 시민이 거주하는 이 섬 전체를 산업화한다면 우리는 세계적인 영향력을 행사할 수 있을 것입니다."
 INS_expand_batavia_technical_institute: "바타비아 공과 대학 확장"
 INS_expand_batavia_technical_institute_desc: "바타비아 공과 대학을 확장하면 더 많은 학생이 교육받을 수 있게 되며, 기술 발전 속도를 높일 수 있을 것입니다."
 INS_quinine_export: "더 유리한 퀴닌 협정"
 INS_quinine_export_desc: "암스테르담에 있는 기관인 기나국은 퀴닌 수출을 거의 독점하고 있는데, 전 세계적으로 말라리아 치료제로서 퀴닌의 수요가 높기 때문에 수익성이 매우 높습니다. 이 기관은 대부분의 퀴닌을 동인도 제도에서 수입합니다. 그렇지만 우리는 수익의 극히 일부만을 받고 있습니다. 우리는 퀴닌 생산을 협상 카드로 활용하여 더욱 공정한 계약을 체결해야 합니다."
 INS_spend_profits_on_rural: "수익을 농촌 개발에 사용"
 INS_spend_profits_on_rural_desc: "새로운 퀴닌 계약이 체결됨에 따라, 우리는 추가 수입을 활용하여 농촌 지역에 교통 및 통신 기반시설을 개발하고 미래의 산업 발전을 위한 발판을 마련할 수 있는 기회를 얻게 되었습니다."
 INS_spend_profits_on_urban: "수익을 도시 개발에 사용"
 INS_spend_profits_on_urban_desc: "새로운 퀴닌 계약이 체결됨에 따라, 우리는 추가 수입을 활용하여 바타비아의 제조 산업을 확장해서 우리 경제를 다양화하고 원자재 수출에 대한 의존도를 낮출 기회를 얻게 되었습니다."
 INS_spend_profits_on_military: "수익을 군사 개발에 사용"
 INS_spend_profits_on_military_desc: "새로운 퀴닌 계약이 체결됨에 따라, 우리는 추가 수입을 활용하여 욕야카르타와 스마랑에 새로운 무기 공장을 건설하고 유지하는 데 투자해서 우리 군사력을 크게 향상시킬 기회를 얻게 되었습니다."
 INS_end_to_bloodshed_tt: "현재 점령지를 기준으로 새로운 국경선이 그려지면서 이 전쟁이 끝날 것입니다. 자바, 수마트라, 보르네오는 현재 해당 지역에 가장 큰 통제력을 가진 쪽에 §Y합병될§! 것입니다."
 HOL_british_light_support: "[ENG.GetNameDefCap] 측이 혁명을 지원하는 데 동의함"
 # Escalation
 INS_escalation_has_1_tt: "악화 단계가 §Y1§!보다 높음"
 INS_escalation_has_2_tt: "악화 단계가 §Y2§!보다 높음"
 INS_escalation_has_3_tt: "악화 단계가 §Y3§!보다 높음"
 INS_escalation_has_4_tt: "악화 단계가 §Y4§!보다 높음"
 INS_escalation_has_5_tt: "악화 단계가 §Y5§!보다 높음"
 INS_escalation_has_6_tt: "악화 단계가 §Y6§!보다 높음"
 INS_escalation_has_7_tt: "악화 단계가 §Y7§!보다 높음"
 INS_escalation_has_8_tt: "악화 단계가 §Y8§!보다 높음"
