 AST_uap_election_campaign_tt: "§Y통합호주당 선거 운동§!\n§L중산층, 사업주, 그리고 제국 충성파들을 결집합니다. 통합호주당이 정치 캠페인을 시작합니다.§!\n\n§Y효과:§!\n매일 정치력 비용: §R1.00§!\n매일 §Y통합호주당§! 득표 증가: §G+0.05%§!"
 AST_alp_election_campaign_tt: "§Y호주노동당 선거 운동§!\n§L노동 계급, 노조원, 그리고 국내에 집중하는 개혁파들을 결집합니다. 호주노동당이 정치 캠페인을 시작합니다.§!\n\n§Y효과:§!\n매일 정치력 비용: §R1.00§!\n매일 §Y호주노동당§! 득표 증가: §G+0.05%§!"
