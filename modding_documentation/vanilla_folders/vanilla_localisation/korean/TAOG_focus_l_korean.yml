 AST_alp_win_count_trigger_tt: "§Y호주노동당§!은 선거에서 $COUNT|Y$회 이상 승리했습니다."
 AST_natunity_desc: "§Y거국정부§!\n§L위기의 순간에는 작은 갈등보다 더 큰 갈등이 중요시됩니다. 우리 주변의 국가들은 연속된 분쟁을 겪고 있습니다. 그리고 유혈 사태의 위협이 점점 더 커질수록 국내 문제의 시급성은 뒷전으로 밀려납니다. [AST.GetName]의 민주주의 정당들은 의견 차이를 접어두고 단결하여 세계에 맞서야 합니다.§!"
