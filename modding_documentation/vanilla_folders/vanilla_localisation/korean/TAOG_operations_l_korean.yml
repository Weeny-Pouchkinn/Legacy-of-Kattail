l_korean:
 operation_rescue_general: "포획된 지휘관 구출"
 operation_rescue_general_desc: "§L우리 지휘관 한 명이 적에게 포로로 잡혀 있습니다. 그를 구출하기 위한 작전을 개시해야 합니다.§!"
 free_general_free_in_transit: "이송 중 구출"
 free_general_free_in_transit_desc: "우리 공작원들은 해당 자산의 이동이 임박했음을 파악했으며, 이동 중에 기회를 보아 이를 차단하고 매복 공격을 감행할 계획을 수립할 것입니다."
 free_general_assault_holding_area: "억류 위치 공격"
 free_general_assault_holding_area_desc: "적군은 우리 지휘관을 경비가 삼엄한 장소에 억류하고 있으며, 우리 공작원들이 그 위치를 파악했습니다. 우리 공작원들은 포로를 구출하기 위해 대담한 공격을 준비할 것입니다."
 free_general_disguise_and_extract: "변장 및 탈출"
 free_general_disguise_and_extract_desc: "우리 공작원들은 노련한 기지를 발휘해 포로로 잡힌 지휘관을 변장시키고, 이를 통해 적의 경비들을 속이고 아군 영토로 탈출할 수 있을 것입니다."
