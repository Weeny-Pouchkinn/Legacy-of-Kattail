l_korean:
 #Shortcuts
 CZE_military_path_shortcut: "군대"
 CZE_economic_path_shortcut: "경제"
 CZE_diplomacy_path_shortcut: "외교"
 CZE_fort_path_shortcut: "요새화 주력"
 CZE_skoda_priority_shortcut_name: "슈코다 우선"
 CZE_political_path_shortcut: "정치"
 # Č does show when scrolling through focuses, but not in the detailed focus view title (does work in the description though)
 CZE_coalition_building: "연정 결성"
 CZE_coalition_building_desc: "선거 이후 등장한 연정이 효과적으로 기능하려면 구성원들 사이의 결속을 더욱 다져야 합니다. 최근 얀 말리페트르가 총리직에서 물러나면서 대연정은 지지 기반을 공고히 해야 한다는 더 큰 압박을 받게 되었습니다."
 CZE_merge_the_paramilitaries: "준군사조직 병합"
 CZE_merge_the_paramilitaries_desc: "우리의 준군사조직들은 여러 단체에 분산되어 있습니다. 그들을 군사적으로 활용하려면 강제로 병합해야 할 겁니다."
 CZE_integrated_paramilitaries: "준군사조직 통합"
 CZE_integrated_paramilitaries_desc: "군부는 그다지 달가워하지 않을 수도 있지만, 준군사조직을 우리 군대에 통합하면 가장 필요할 때 더 많은 예비 병력을 확보할 수 있을 것입니다."
 CZE_wielding_the_hammer: "망치 휘두르기"
 CZE_wielding_the_hammer_desc: "우리는 국민의회에서 확보한 압도적 과반을 활용해 지금보다 훨씬 더 빠르게 법안을 통과시킬 수 있습니다. 입법부를 정비하는 일은 무엇보다 중요합니다."
 CZE_emergency_measures: "비상조치"
 CZE_emergency_measures_desc: "우리 국가가 직면한 여러 위기에 대응하기 위해 비상조치를 시행하는 한편, 그와 동시에 그중 일부를 활용해 우리 정부에 이념적으로 불온할 수 있는 자들을 더 면밀히 감시할 수 있습니다. 이를 통해 우리는 국가가 직면한 도전에 더욱 잘 대비할 수 있을 것입니다."
 CZE_king_of_the_castle: "성채의 왕"
 CZE_king_of_the_castle_desc: "우리는 모두 정부에서 누가 주도권을 쥐고 있는지 알고 있습니다. 불확실성이 큰 이 시기에, 우리는 더 이상 시늉에 그치지 말고 $CZE_edvard_benesh$(이)가 더 직접적으로 정부를 이끌게 해야 합니다. 우리 국가의 안보가 여기에 달려 있습니다."
 CZE_closer_ties_with_the_moderate_germany_parties: "중도 주데텐란트 정당과 연계"
 CZE_closer_ties_with_the_moderate_germany_parties_desc: "일부 주데텐란트 정당들은 우리 연립정부와 협력하여 정부와의 관계를 더욱 돈독히 할 의향이 있습니다. 이러한 관계를 더욱 강화합시다."
 CZE_complete_reconciliation: "화해 조정 완료"
 CZE_complete_reconciliation_desc: "우리는 신뢰의 다리를 건설하기 위해 노력해 왔습니다. 이제 동포들과 화해할 때입니다."
 CZE_complete_reconciliation_cooldown_flag: "§Y$CZE_closer_ties_with_the_moderate_germany_parties$§! 중점 완료"
 CZE_complete_reconciliation_cooldown_flag_tt: "현재 일수: [?CZE_complete_reconciliation_cooldown_flag:days|Y0]"
 CZE_bastion_of_liberty: "자유의 요새"
 CZE_bastion_of_liberty_desc: "우리는 지난 10년 동안 라인강 동쪽 유럽에서 몇 안 되는 진정한 다원주의 국가 중 하나였습니다. 사람들이 이를 잊지 않도록 합시다."
 CZE_standing_against_the_storm: "폭풍에 맞서기"
 CZE_standing_against_the_storm_desc: "우리의 약점과 준비 부족에도 불구하고, 우리는 어떤 어려움에도 정면으로 맞서며 다가오는 폭풍에 맞서 싸울 것입니다."
 CZE_truth_prevails: "진실은 승리한다"
 CZE_truth_prevails_desc: "아무리 어려운 역경과 불가능해 보이는 과제에 직면하더라도, 우리 국가는 '진실은 승리한다'라는 국가의 표어가 끝내 현실이 되리라는 것을 알고 있습니다. 진실을 추구하고 진실을 말하면, 진실이 승리할 것입니다."
 CZE_negotiations_with_the_autonomous_bloc: "자치 블록과 협상"
 CZE_negotiations_with_the_autonomous_bloc_desc: "국회 내 베네시의 추종자들에게 권력을 내주지 않는 연립정부를 구성하려면 자치 블록과 협력해야 합니다. 그러나 그들의 전적인 지지를 얻는 데는 막대한 비용이 들 것입니다."
 CZE_slovakia_autonomy_agreement: "슬로바키아 자치 협정"
 CZE_slovakia_autonomy_agreement_desc: "자치 블록이 우리 연립정부와 협력하는 대가는 우리 정부와의 자치 협정입니다. 이는 막대한 비용이지만, 약속을 지키지 않으면 더 큰 대가를 치를 수 있습니다."
 CZE_slovakia_autonomy_agreement_tt: "§Y[RUT.getname]§!(은)는 우리가 §Y[SLO.getname]§!에 제시한 협정과 같은 협정을 원할 것입니다!"
 CZE_slovakia_autonomy_agreement_2_tt: "이 중점을 선택하면 $CZE_the_autonomous_bloc_demands$(이)가 §Y35일§! 동안 지연됩니다."
 CZE_topple_the_king: "왕을 실각시켜라"
 CZE_topple_the_king_desc: "$CZE_edvard_benesh$의 영향력은 우리 정부를 숨도 못 쉬게 압박하고 있습니다. 의회 내에 포진한 수많은 충성파 덕분에 그는 대통령직의 범위를 넘어서는 권력을 휘두르고 있습니다. 이제 여건이 갖추어졌으니, 우리는 상원에서 그의 영향력을 빼앗을 수 있습니다."
 CZE_comprise_with_the_carpathians: "카르파티아와 타협"
 CZE_comprise_with_the_carpathians_desc: "루테니아 지역은 우리가 [SLO.getnamedef]에 제시했던 것과 유사한 연방화 협정을 추진하고 있습니다. 그렇게 되면 그 지역과 [9.getname]에서 우리의 입지가 크게 약화될 것입니다. 그들의 요구에 완전히 굴복하는 것보다는 그들과 협상하는 것이 나을 수도 있습니다."
 CZE_the_rut_demands_add_35_CZE_comprise_with_the_carpathians_tt: "이 중점을 선택하면 $CZE_the_rut_demands$(이)가 §Y35일§! 동안 지연됩니다."
 CZE_cut_carpathia_loose: "카르파티아 풀어주기"
 CZE_cut_carpathia_loose_desc: "슬로바키아가 연방국이 된 지금, 루테니아 지역도 비슷한 협정을 체결하기를 바라고 있습니다. 이것은 불합리해 보이지만, 슬로바키아가 우리의 직접적인 통제하에 있지 않으므로 그들을 제압하기는 어려울 것입니다. 어쩌면 루테니아인의 요구에 굴복해야 할지도 모릅니다."
 CZE_compromise_with_the_veteran_agrarian: "베테랑 농민들과 타협"
 CZE_compromise_with_the_veteran_agrarian_desc: "농민들이 중심인 보수 세력은 증가하는 도시 유권자들에게 다가가는 데 큰 장애물입니다. 목표를 달성하기 위해서는 그들과 타협해야 합니다."
 CZE_reorient_the_broad_coalition: "광역 연립정부 방향 전환"
 CZE_reorient_the_broad_coalition_desc: "이 광역 연합은 오랫동안 우리 정부의 주도적인 세력이었습니다. 이 연합을 구성하는 다양한 정당들로 인해 정부 운영이 점점 더 어려워지고 있습니다. 장관 정책의 방향 전환이 시급합니다."
 CZE_leverage_sokol: "소콜 운동"
 CZE_leverage_sokol_desc: "소콜 운동은 수십 년 동안 우리 국가에서 중요한 조직이었습니다. 위기 상황에서는 이들을 활용해 준군사 훈련을 실시하고 우리 군에 필요한 신병을 확보할 수 있습니다."
 CZE_urbanist_policies: "도시 계획 정책"
 CZE_deepend_ties_with_the_trademans: "상인들과의 유대 강화"
 CZE_deepend_ties_with_the_trademans_desc: "상인 정당은 도시 중산층 유권자들에게 인기가 높습니다. 우리가 그들에게 힘을 실어주고 그들과 협력한다면, 농촌 유권자들을 소외시키지 않으면서도 도시 유권자들의 지지를 얻을 수 있습니다."
 CZE_apart_but_togather: "따로 그러나 함께"
 CZE_apart_but_togather_desc: "우리 지역들은 이제 그 어느 때보다 더 큰 자율성을 누리고 있지만, 동시에 그 어느 때보다 더 강해졌습니다. 우리는 무엇이든 해낼 준비가 되어 있습니다."
 CZE_contact_henlein: "헨라인과 접촉"
 CZE_contact_henlein_desc: "$CZE_konrad_henlein$(은)는 오랫동안 계속해서 우리 정부의 골칫거리였습니다. 하지만 최근에 일어난 국제적인 사건들을 고려할 때, 이제 그와 대화를 시작할 때가 된 것 같습니다."
 CZE_contact_henlein_cooldown_flag: "§Y$CZE_no_compromise_with_the_sdp$§! 중점 완료"
 CZE_contact_henlein_cooldown_flag_tt: "현재 일수: [?CZE_contact_henlein_cooldown_flag:days|Y0]"
 CZE_contact_henlein_focus_warning_tt: "§Y$CZE_no_compromise_with_the_sdp$§!(을)를 완료하면 §Y350§!일을 기다려야 이 §Y국가중점§!을 선택할 수 있습니다."
 CZE_contact_henlein_focus_order_warning_tt: "이 §Y국가중점§!을 완료한 다음 §Y$CZE_no_compromise_with_the_sdp$§!(을)를 완료하면 §Y$CZE_konrad_henlein$§!(이)가 사임합니다."
 CZE_no_compromise_with_the_sdp: "주데텐 독일인당을 계속해서 배제"
 CZE_no_compromise_with_the_sdp_desc: "주데텐 독일인당은 우리 연립정부에 아무런 보탬도 되지 않습니다. 그들은 오직 정치적 긴장을 유발하고 우리 정부의 행동을 폄훼하려 할 뿐입니다. 훌륭한 통치를 위해서는 사회민주당이 어떠한 연립정부에도 참여하지 못하도록 계속해서 배제해야 합니다."
 CZE_no_compromise_with_the_sdp_cooldown_flag: "§Y$CZE_contact_henlein$§! 중점 완료"
 CZE_no_compromise_with_the_sdp_cooldown_flag_tt: "현재 일수: [?CZE_no_compromise_with_the_sdp_cooldown_flag:days|Y0]"
 CZE_no_compromise_with_the_sdp_focus_warning_tt: "§Y$CZE_contact_henlein$§!(을)를 완료하면 §Y350§!일을 기다려야 이 §Y국가중점§!을 선택할 수 있습니다."
 # CZE_economic_integration: "Economic Integration"
 # CZE_economic_integration_desc: "Why stop at a customs union? Economic integration will further grow our economies and ensure our future is an affluent one for all members."
 CZE_form_a_federation: "연방 결성"
 CZE_form_a_federation_desc: "중앙 유럽 연방이라는 꿈이 이제 손이 닿는 곳에 있습니다. 우리는 마침내 그 꿈을 쟁취하고 민주주의의 거인이 될 것입니다. 함께라면 강대국들에 맞서 스스로 저항할 수 있는 힘을 갖게 될 것입니다!"
 CZE_bend_the_bars: "$ITA_bend_the_bars$"
 CZE_bend_the_bars_desc: "$GER_european_confederation_desc$"
 CZE_reassure_the_army: "군대 안심시키기"
 CZE_reassure_the_army_desc: "군대는 최근 우리의 일부 결정과 정부 정책에 대해 불안해하고 있습니다. 정부가 무슨 말, 무슨 행동을 하든 우리는 군대를 지지한다는 것을 확신시켜줘야 할 때입니다."
 CZE_outreach_to_the_western_powers: "서방 열강과 추가 소통"
 CZE_outreach_to_the_western_powers_desc: "서방 민주주의 국가들은 우리를 지지한다고 말하지만, 우리는 그들의 말이 가장 중요할 때 행동으로 이어지도록 하기 위해 그들과 더욱 적극적으로 소통해야 합니다."
 CZE_demand_guarantees: "더 강한 보장 요구"
 CZE_demand_guarantees_desc: "이미 조약과 동맹이 존재하지만, 우리는 파트너들이 절박한 상황에서 단지 자신들에게 더 편한 길이라는 이유로 우리를 버리지 않도록 해야 합니다. 우리에게 필요한 것은 단순한 보장보다 더 강한, 보다 구속력 있는 무언가입니다."
 CZE_guardian_of_central_europe: "유럽 중부의 수호자"
 CZE_guardian_of_central_europe_desc: "이제 우리는 유럽의 중심에서 민주주의의 감독자가 될 위치에 서 있습니다. 우리는 스스로를 지킬 수 없는 국가들의 수호자가 되어 민주주의가 굳건히 자리 잡도록 할 수 있습니다."
 CZE_central_european_faction: "유럽 중부의 종주국"
 CZE_central_european_faction_desc: "우리는 외교에 지나치게 의존하기보다는 자국의 힘을 강화하는 데 중점을 두고 있지만, 영향력을 과도하게 확장하지 않는 것이 중요합니다. 이제는 외부로 시선을 돌릴 때가 되었을지도 모릅니다."
 CZE_strike_at_the_heart_of_bolshevism: "[THIS.GetAntiSovietFocusName]"
 CZE_strike_at_the_heart_of_bolshevism_1: "볼셰비즘의 심장을 타격"
 CZE_strike_at_the_heart_of_bolshevism_2: "동쪽 방면 방위"
 CZE_strike_at_the_heart_of_bolshevism_desc: "[SOV.GetNameDef]의 확장은 유럽과 우리 국가에 대한 실존하는 위협입니다. 우리는 그들에 맞서는 방어벽이 되어야 합니다."
 CZE_destroy_the_fascist_threats: "파시스트의 위협을 타도"
 CZE_destroy_the_fascist_threats_desc: "[CZE_get_fascist_threats_desc]"
 CZE_destroy_the_fascist_threats_desc_enemy_ger: "우리 모두는 유럽의 평화에 가장 큰 위협이 되는 존재가 누구인지 알고 있습니다. 하루빨리 [GER.getnamedefCAP](을)를 저지해야 합니다. 다른 누구도 나서지 않는다면, 우리가 나서는 것이 최선일 것입니다."
 CZE_destroy_the_fascist_threats_desc_backup: "우리의 안보를 위해서는, 이웃 국가들이 언젠가 우리를 목표로 삼을 수 있는 팽창주의적 수사를 따르지 않는 것이 무엇보다 중요합니다."
 CZE_peace_on_our_time: "우리 시대를 위한 평화"
 CZE_peace_on_our_time_desc: "우리는 너무나 오랫동안 유럽의 국제 관계에서 뒷전으로 밀려나 있었습니다. 이제 더는 그렇지 않을 것입니다! 우리는 우리 힘으로 일어서서 전쟁이든 평화든 우리의 조건을 내세울 수 있습니다."
 CZE_reach_out_for_military_assistance: "군사 지원 요청"
 CZE_free_tuka: "$CZE_vojtech_tuka$ 해방"
 CZE_free_tuka_desc: "$CZE_vojtech_tuka$의 형기가 끝났습니다. 그의 형기를 연장할 구실을 찾는 대신 제때 석방해서 정부에서 활용할 수도 있습니다. 그를 우리에게 적대적인 인물로 두는 것보다, 우리 밑에서 일하게 하는 것이 훨씬 낫습니다."
 CZE_grow_the_anglo_czechoslovak_prague_credit_bank: "앵글로 체코슬로바키아 은행"
 CZE_grow_the_anglo_czechoslovak_prague_credit_bank_desc: "앵글로 체코슬로바키아 신용은행은 우리 산업의 주요 성장 동력 중 하나였습니다. 그들의 자금 없이는 현재와 같은 대규모 수출 사업을 유지할 수 없을 것입니다. 뉴욕에 새로운 지점을 설립하고 [ENG.GetNameDef](와)과의 관계를 더 강화하면 은행은 더 성장할 것입니다. 또한 이는 [ENG.getname](이)가 우리의 존속에 직접적인 이해를 갖도록 만들 것입니다."
 CZE_feeding_the_alligator: "악어 먹이 주기"
 CZE_feeding_the_alligator_desc: "[GER.getname]의 주데텐란트에 대한 야욕은 우리 국가의 존재 자체를 위협합니다. 그들이 원하는 것을 제공해 준다면 그들은 우리를 내버려둘지도 모릅니다."
 CZE_complete_capitulation: "완전한 항복"
 CZE_complete_capitulation_desc: "굴복하는 것 외에 우리에게 무슨 선택지가 있겠습니까? 우리는 다가오는 폭풍을 막을 수 없습니다. 아직 어느 정도 영향력이 있을 때 [GER.getnamedef](와)과 협상을 한다면, 그들은 우리에게 조금이나마 독립성을 남겨줄 것입니다."
 CZE_stabilize_the_protectorate: "보호령 안정화"
 CZE_stabilize_the_protectorate_desc: "보호령은 결코 안정적이지 않습니다. 우리는 국민에게 우리가 합법적인 정부이며 국민의 요구를 충족시켜 줄 것이라는 확신을 심어주기 위해 노력해야 합니다."
 CZE_stabilize_the_protectorate_unretire_henlein_tt: "§Y$CZE_konrad_henlein$§!을 §Y[ROOT.getname]§!에서 복직시킵니다."
 CZE_full_faith_in_hacha: "하하에 대한 전적인 신뢰"
 CZE_full_faith_in_hacha_desc: "$CZE_emil_hacha$는 우리 국민들 사이에서 $CZE_emanuel_moravec$보다 훨씬 더 인기와 존경을 얻고 있습니다. 그가 하는 일이 의심스러울 수는 있지만, 그를 대체할 더 인기 있는 인물은 없습니다."
 CZE_moravecs_bohemia: "모라베츠의 보헤미아"
 CZE_moravecs_bohemia_desc: "$CZE_emil_hacha$가 우리의 새 정부를 약화시키려 한다는 소문이 돌고 있습니다. 현재 상황에서 성공하고 성장하려면 우리 종주국들의 이념에 더 부합하는 지도부가 필요합니다."
 CZE_form_the_government_army: "정부의 군대 형성"
 CZE_form_the_government_army_desc: "우리 국가가 성공하려면 이전 군대의 실패에서 교훈을 얻는 새로운 군대를 만들어야 합니다. 또한 군대의 지도부가 정부와 더욱 정치적으로 협조적이 되도록 해야 합니다."
 CZE_forced_administration_of_companies: "기업의 강제 관리"
 CZE_forced_administration_of_companies_desc: "대규모의 감독에도 불구하고, 일부 회사들은 여전히 우리의 통제에서 벗어나 운영되고 있습니다. 이제 그들을 강제로 우리 관리하에 두어야 할 때입니다."
 CZE_revisit_custom_union_talks: "관세 동맹 회담 재검토"
 CZE_revisit_custom_union_talks_desc: "일부 이웃 국가들과의 관세 동맹 협상은 다른 국가들에 비해 매우 부진했을 수 있습니다. 이제 양국 간 관세 동맹을 재검토하고 새로운 동맹을 추진해야 할 때입니다."
 CZE_revisit_custom_union_talks_tt: "우리는 다른 §Y수단§!을 통해 그들이 가입하도록 설득할 수 있을 것입니다."
 CZE_revisit_custom_union_talks_2_tt: "그들은 우리 연방에 가입하라는 우리의 요구를 받아들일 가능성이 높아집니다."
 CZE_reintegrate_cross_border_rail_connections: "국경 간 철도 연결 개선"
 CZE_reintegrate_cross_border_rail_connections_desc: "이웃 국가들과의 철도 연결을 개선하는 것은 그들의 호감을 사는 좋은 방법입니다. 특히 그들과의 경제적 연결을 강화하려는 경우 더욱 그렇습니다."
 CZE_reintegrate_cross_border_rail_connections_flag: "국경 간 철도 연결이 개선됨"
 CZE_vonapo_20: "VONAPO 20"
 CZE_vonapo_20_desc: "[GER.GetNameDef]의 위협이 커지고 있다고 보는 것은 우리만이 아닙니다. 따라서 [GER.GetAdjective]의 야망을 더욱 효과적으로 저지하기 위해 [SOV.GetNameDef](와)과 협력하여 정보를 수집하는 계획이 수립되었습니다."
 CZE_increase_funding_from_moscow: "[SOV.capital.GetCapitalVictoryPointName](으)로부터 자금 증액"
 CZE_increase_funding_from_moscow_desc: "[ROOT.GetCommunistParty](은)는 자금이 부족하여, 현재 건물 비용을 대표들의 급여로 충당하고 있습니다. 성장하기 위해서는 우리의 신문을 배포하고 당원을 모집하기 위한 자금 증액을 [SOV.GetNameDef]에 요청해야 합니다."
 CZE_zdenek_fierlinger_tt: "§Y$CZE_zdenek_fierlinger$§!(을)를 고문으로 임명"
 CZE_expand_the_communist_press: "공산주의 언론 확장"
 CZE_expand_the_communist_press_desc: "우리의 신문 '붉은 법'은 현재 신문을 읽지 않는 사람들에게 정보를 제공하는 데 도움이 될 수 있습니다. 필요한 것은 자금 지원을 늘리는 것뿐입니다."
 CZE_anti_rearmament_propaganda: "재무장 반대 선전"
 CZE_anti_rearmament_propaganda_desc: "우리의 주적인 [GER.GetNonIdeologyName]의 파시스트 정부가 몰락하였으므로, 우리는 군비 증강에 반대하는 우리의 입장이 처음부터 옳았다고 주장할 수 있게 되었습니다."
 CZE_anti_democratic_propaganda: "반민주주의 선전"
 CZE_anti_democratic_propaganda_desc: "우리 당이 지지를 얻기 위해서는 공화국의 이전 정부들의 실패를 강조하고 우리가 어떻게 상황을 더 잘 처리할 수 있었는지를 보여주어야 합니다."
 CZE_form_workers_brigades: "노동자 민병대 창설"
 CZE_form_workers_brigades_desc: "우리가 해방시키는 노동자들은 투쟁에 참여할 수 있도록 준비되어 있어야 합니다. 그들은 훈련된 군인은 아닐지라도, 각자의 직업에 기반한 전문가로서 충분히 기여할 수 있습니다."
 CZE_kohler_faction: "쾰러의 세력"
 CZE_kohler_faction_desc: "브루노 쾰러의 세력은 체코슬로바키아를 공산주의 국가를 만드는 데 성공하려면 부르주아를 폭력적으로 전복해야 한다고 믿습니다."
 CZE_gottwald_faction: "고트발트의 세력"
 CZE_gottwald_faction_desc: "모스크바에 지나칠 정도로 충성하는 클레멘트 고트발트의 스탈린주의 세력은 소련의 형상을 본뜬 체코슬로바키아 국가를 만들고자 합니다."
 CZE_zapotocky_faction: "자포토츠키의 세력"
 CZE_zapotocky_faction_desc: "공산당의 창립자인 보후미르 슈메랄과 안토닌 자포토츠키는 클레멘트 고트발트가 당에 강요한 정책보다 더 온건한 정책을 구상했습니다. 우리는 모든 [CZE.GetAdjective] 인민에게 진정으로 호소하기 위해 다시 한번 온건한 정책을 사용해야 합니다."
 CZE_ally_with_moderate_socialists: "중도파 사회주의자와 협력"
 CZE_ally_with_moderate_socialists_desc: "모든 국가가 선거를 통해 공산주의를 수용하거나 [SOV.GetLeader]에 대한 존경심을 가질 준비가 되어 있는 것은 아니므로, 우리는 더 온건한 운동과의 협력은 피하지 말아야 합니다."
 CZE_democracies_willing_to_join_faction_tt: "§Y민주주의 국가들이 우리의 공산주의 세력에 가입할 가능성이 커집니다§!."
 CZE_limited_cooperation: "[SOV.GetLeader](와)과의 제한적인 협력"
 CZE_limited_cooperation_desc: "이념적으로는 다르지만, [SOV.GetNameDef]도 우리가 동반자로서 가치 있다는 것을 인정하고 실리를 챙기는 거래에 응할 수 있습니다. 그들이 신문에서는 우리를 비난하더라도 말입니다."
 CZE_denounce_stalinism: "스탈린주의 비난"
 CZE_denounce_stalinism_desc: "공산주의의 평판은 스탈린의 불의한 행동으로 영원히 더럽혀졌습니다. 이제 그의 정권에서 사람들을 해방하기 위해 군사적 조치를 취해야 할 때입니다."
 CZE_country_leader_has_ideology_stalinism_tt: "국가 지도자가 §Y$stalinism$§! 이념을 가지고 있음"
 CZE_cooperate_with_tito: "티토와 협력"
 CZE_cooperate_with_tito_desc: "[YUG.GetNameDefCap](은)는 우리와 마찬가지로 실용적인 공산주의를 시도하고 있습니다. 그들 역시 다양한 민족을 붉은 깃발 아래 통합하고자 합니다. 이러한 도전에 맞서기 위해 우리는 군사와 정치 양면에서 협력해야 합니다."
 CZE_reduce_divided_nation_cost_tt: "대부분의 §Y국가 분열§! 결정의 비용과 기간이 감소합니다."
 CZE_balkan_union: "연합 확장"
 CZE_balkan_union_desc: "현재 이 지역의 많은 국가들이 공산주의를 받아들이고 있지만, 강력한 협력 없이는 주요 강대국으로부터 우리 자신을 보호할 수 없습니다. 이를 달성하는 가장 효과적인 방법은 연합입니다."
 CZE_cooperation_with_the_ussr: "[SOV.GetLeader](와)과의 협력"
 CZE_cooperation_with_the_ussr_desc: "당 지도부 중 [SOV.GetNameDef]의 가장 열렬한 지지자들조차 [SOV.GetNameDef] 방문 후에 집산화의 문제점을 깨달았습니다. 그럼에도 불구하고 집산화 과정에서 잘못된 점과 잘된 점을 분석하고 [ROOT.GetNameDef]에 도입할 최선의 방법을 도출해 낸다면 [SOV.GetNameDef] 측과 협력할 수 있을 겁니다."
 CZE_exchange_military_expertise: "군사 전문가 교환"
 CZE_exchange_military_expertise_desc: "대부분의 강력한 군대를 보유한 강대국들과 마찬가지로, [SOV.GetNameDefCap]도 군사 전술을 실험해 왔습니다. 우리는 그들에게 그들의 통찰을 공유해 달라고 요청해야 하며, 그러면 우리도 우리의 통찰을 공유할 수 있을 것입니다."
 CZE_pressure_romania: "루마니아 압박"
 CZE_pressure_romania_desc: "[ROM.GetNameDefCap](이)가 우리의 적과 동맹을 맺는다면 [SOV.GetNameDef](와)과의 관계를 방해하거나 귀중한 석유를 적에게 제공하는 등 심각한 위협이 될 수도 있습니다. [SOV.GetAdjective]의 지원을 받는다면 우리는 충분한 위협이 되어 전쟁 없이도 [ROM.GetNameDefCap](이)가 우리 편에 서게 할 수 있을 겁니다."
 CZE_facility_in_state_tt: "$STATE|Y$에 다른 §Y실험 시설§!이 없다면 $STATE|Y$에 $FACILITY_TYPE|Y$ §G1§!개를 획득합니다."
 CZE_spread_the_revolution: "혁명 전파"
 CZE_spread_the_revolution_desc: "[ROOT.GetNameDef]에서 혁명이 성공했으니, 이제 우리는 해외의 프롤레타리아가 자유를 위해 싸우도록 격려해야 합니다. 우리는 그 투쟁을 지원할 수 있습니다."
 CZE_agrarian_reform: "토지 사무소 복원"
 CZE_agrarian_reform_desc: "최근 해체된 토지 사무소는 주로 농경지의 재분배를 담당했습니다. 이제 이 기관을 개혁하여 좀 더 과감한 조치를 취해야 할 때입니다."
 CZE_realign_the_church: "국가 무신론주의"
 CZE_realign_the_church_desc: "종교는 너무 오랫동안 [CZE.GetAdjective] 국민을 분열시켜 왔습니다. 우리는 더 통합된 사회를 만들기 위해 교육이나 언론과 같은 국가 문제에 대한 종교의 영향력을 줄여야 합니다."
 CZE_create_a_secret_police_branch: "비밀 경찰 부서 창설"
 CZE_create_a_secret_police_branch_desc: "나라를 안정시키려면 내부와 외부의 적을 모두 저지해야 합니다. 국민들이 새로운 체제에 익숙해지려면 시간이 걸릴 것이고, 특히 이 체제가 아직 조정 단계에 있기 때문입니다."
 CZE_promote_urbanization: "$ARG_promote_urbanization$"
 CZE_promote_urbanization_desc: "이제 효율적인 공동 농장을 설립했으므로, 일부 농촌 인구를 도시로 끌어들이고 도시의 생산성을 높이는 계획을 시작할 수 있습니다."
 CZE_confiscate_church_lands: "교회 토지 몰수"
 CZE_confiscate_church_lands_desc: "교회는 목적상 필요한 것보다 훨씬 더 많은 토지와 재산을 소유하고 있습니다. 우리는 그 땅의 일부를 재분배해야 합니다. 전에 농부들을 위해 그랬듯이 말입니다."
 CZE_change_the_narrative: "서사 변경"
 CZE_change_the_narrative_desc: "교회는 지금까지 우리 혁명을 지지하지 않았지만, 교회의 가치를 우리의 가치와 일치시킨다면 새로운 정권에 대한 지지를 만들어 내는 데 중요한 역할을 할 수 있습니다."
 CZE_the_second_fortification_program: "2차 요새화 계획 개시"
 CZE_the_second_fortification_program_desc: "1차 요새화 계획은 우리가 이제 더 확충해야 할 방어선의 토대를 마련했습니다. 국가의 미래를 위해서는 가능한 한 빨리 2차 요새화 계획에 착수해 우리의 요새선을 확장하고 발전시켜야 합니다."
 CZE_redirect_the_fortification_councils_funds: "요새화 위원회 자금의 용도 변경"
 CZE_redirect_the_fortification_councils_funds_desc: "이러한 요새화 계획은 우리 경제에 엄청난 부담을 줍니다. 그 자금은 다른 계획에 사용하는 것이 더 나을 것입니다. 어차피 군대는 이미 충분한 방어 시설을 갖추고 있으며 더 이상의 방어 시설이 필요하지 않습니다."
 CZE_jachymov_uranium_mine: "야히모프 우라늄 광산"
 CZE_jachymov_uranium_mine_desc: "야히모프 광산은 오랫동안 우라늄과 기타 광석의 공급원이었지만, 최근의 물리학 발전 이전까지 우라늄은 거의 쓸모가 없었습니다."
 CZE_skoda_internal_competition: "내부 경쟁 장려"
 CZE_skoda_internal_competition_desc: "슈코다처럼 큰 회사에서는 모든 직원의 업무 능력을 최고 수준으로 유지하기 어렵습니다. 내부 경쟁을 장려하면 공장 직원들의 성과를 향상시키는 데 큰 도움이 될 것입니다."
 CZE_skoda_max_optimization_tt: "§Y슈코다 중점§!의 최대 최적화 레벨이 7로 증가합니다."
 CZE_skoda_increase_cooperation: "슈코다 내부의 협력 강화"
 CZE_skoda_increase_cooperation_desc: "우리가 더욱 발전하려면 더 많은 성과를 내기 위해 공장 간 협력을 강화해야 합니다. 이를 통해 공장끼리 전문 지식을 공유하는 것도 가능해질 겁니다."
 CZE_skoda_fast_optimization_tt: " 최대 등급에 도달할 때까지 시간이 지남에 따라 §Y슈코다 중점§! £GFX_prod_eff_cap 최적화 등급의 평점 증가: §G+100.0%§!"
 CZE_master_of_armaments: "무기 제조의 명장"
 CZE_master_of_armaments_desc: "슈코다는 오스트리아-헝가리 제국 시절부터 우리 나라 최대의 무기 제조사였습니다. 그들의 전문성과 경험은 우리 국가의 산업 대기업 중에서 비할 데가 없습니다. 이제 우리는 그들에게 '무기 제조의 명장'이라는 칭호를 부여해야 할 때입니다."
 CZE_only_the_best_is_good_enough: "최고만이 충분하다"
 CZE_only_the_best_is_good_enough_desc: "슈코다는 언제나 근면 성실한 직업 윤리와 혁신적인 정신을 바탕으로 성장해 왔습니다. 창립자들은 \"고객에게는 최고만이 충분하다!\"라는 표어를 항상 지켜왔으며, 이 표어는 오늘날 그 어느 때보다도 더 큰 울림을 지니고 있습니다."
 CZE_an_industrial_legacy: "산업적 유산"
 CZE_an_industrial_legacy_desc: "우리는 국가의 산업을 이전에는 불가능하다고 여겨졌던 수준까지 발전시켜 왔으며, 이제 마침내 우리의 산업적 유산을 자랑스럽게 내세울 수 있게 되었습니다. 우리는 비할 데 없는 산업 강국입니다."
 CZE_powerhouse_of_europe: "유럽의 원동력"
 CZE_powerhouse_of_europe_desc: "우리 산업은 이제 세계의 부러움을 사고 있습니다. 이제 우리는 에너지 부문이 이러한 산업을 제대로 지탱할 수 있도록 해야 합니다."
 CZE_supply_fighters_for_allies: "연합국에 전투기 보급"
 CZE_supply_fighters_for_allies_desc: "[FRA.GetAdjective](와)과 [ENG.GetAdjective] 정부는 분쟁이 시작될 경우 [GER.GetAdjective] 비행기가 방어선을 빠르게 뚫고 도시를 공격할 것을 매우 우려하고 있습니다. 공군력이 강화된다면 두 나라도 큰 인명 피해 없이 [GER.GetAdjective]의 확장을 저지할 수 있다는 자신감을 가질 것입니다."
 CZE_allies_more_likely_to_defend_us_tt: "§Y연합국이 주데텐란트 문제에서 독일의 팽창주의에 맞서는 우리 편에 설 가능성이 더 높아질 것입니다.§!"
 CZE_allies_more_likely_to_defend_us_2_tt: "§Y연합국이 주데텐란트 문제에서 독일의 팽창주의에 맞서는 우리 편에 설 가능성이 크게 높아질 것입니다.§!"
 CZE_allies_more_likely_to_defend_us_3_tt: "§Y연합국이 주데텐란트 문제에서 독일의 팽창주의에 맞서는 우리 편에 설 가능성이 소폭 높아질 것입니다.§!"
 CZE_establish_the_state_defense_guard: "국방경비대 창설"
 CZE_german_nonagressionpact: "하우스호퍼-크로프타 협정"
 CZE_german_nonagressionpact_desc: "[GER.GetNameDef](와)과의 불가침조약 협상은 한동안 진행되어 왔지만, [SOV.GetNameDef]의 불안정 징후와 새로운 팽창주의 계획으로 인해 중단되었습니다. 현재 [GER.GetNameDef](이)가 다른 적들과 교전 중인 상황에서, 우리는 이 협상을 재개해야 합니다."
 CZE_revive_the_czechoslovak_legion_dynamic: "[CZE_revive_the_czechoslovak_legion]"
 CZE_revive_the_czechoslovak_legion_default: "체코슬로바키아 군단 부활"
 CZE_revive_the_czechoslovak_legion_communist: "의용군 단체 설립"
 CZE_revive_the_czechoslovak_legion_dynamic_desc: "다시 세계에 불안이 감돌고 있으며, [ROOT.GetNameDef]의 용감한 군인들은 조국을 수호할 준비가 되어 있습니다. 그러나 과거가 증명했듯이, 조국을 수호하려면 때로는 해외에서 싸울 이들, 곧 조국을 지키기 위해 고향을 떠날 각오가 된 사람들을 다시 찾아야 합니다."
 CZE_revive_the_czechoslovak_legion_nsb_tt: "§Y$CZE_legacy_of_the_czechoslovak_legion_army_spirit$§!(은)는 §Y육군의 정신§!에서 §Y국민정신§!으로 전환될 것입니다."
 CZE_state_sponsored_recruitment_for_spain: "스페인의 국가 지원 의용군"
 CZE_state_sponsored_recruitment_for_spain_desc: "새로운 분쟁 상황에서 [ROOT.GetNameDef]의 노련한 의용군 전사들은 결정적인 역할을 할 수 있습니다. 우리는 그들이 우리 정책에 가장 부합하는 세력을 지원하도록 장려해야 합니다. 그 과정에서 우리는 지난 10년간 전쟁이 어떻게 발전했는지에 대해 배울 수도 있을 겁니다."
 CZE_support_spain_reward_tt: "§Y우리 측의 의용군이 있는 스페인 세력이 승리하거나 패배할 경우의 효과:§!"
 CZE_profit_off_the_spanish_civil_war: "스페인 내전으로 이득 얻기"
 CZE_profit_off_the_spanish_civil_war_desc: "스페인 내전은 강대국들의 대리전이 되어가고 있습니다. 우리는 이러한 분쟁에 용감한 우리 군인들의 생명이 휘말리는 위험을 감수해서는 안 됩니다. 오히려 이는 무기 판매를 통해, 어쩌면 양측 모두에게 무기를 판매하여 우리 산업을 확장할 수 있는 절호의 기회입니다."
 CZE_skoda_sell_weapons_to_SPR_tt: "결정 잠금 해제: §Y스페인 세력에 은밀히 무기 판매§!"
 CZE_placate_benes_faction: "베네시 파벌에 굴복"
 CZE_placate_benes_faction_desc: "$CZE_milan_hodza$는 자신의 외무부 장관 임기가 끔찍하게 끝났다는 사실을 받아들여야 합니다. $CZE_milan_hodza$가 외무부 장관직을 포기한다면 $CZE_edvard_benesh$는 농본주의자들 중에 있는 자신의 지지자들과 함께 $CZE_milan_hodza$의 총리로서의 지위를 강화할 준비가 되어 있습니다."
 CZE_claim_lands_of_the_bohemian_crown: "보헤미아 왕가의 땅 획득"
 CZE_claim_lands_of_the_bohemian_crown_desc: "우리 국가는 지난 수 세기 동안 여러 제국의 변방에 속해 있었기 때문에, 주민들의 의지가 아니라 분쟁에 따라 국경이 변동해 왔습니다. 이제는 이러한 변동을 바로잡아야 할 때입니다."
 CZE_demand_katowice: "[762.GetName] 요구"
 CZE_demand_katowice_desc: "[762.GetName]에 대한 통제권을 얻는 것은 이전 국경을 회복하는 것일 뿐만 아니라, [72.GetName]에 대한 [POL.GetAdjective]의 영유권 주장도 약화할 것입니다."
 CZE_fight_over_silesia: "실레시아를 위한 싸움"
 CZE_fight_over_silesia_desc: "실레시아는 정당한 [ROOT.GetAdjective]의 영토일 수 있지만, [66.owner.GetNameDef](와)과의 전면전은 바람직하지 않습니다. 따라서 우리는 대규모 전쟁보다는 대규모 국경 교전을 통해 우리의 힘을 보여줘야 합니다. 만약 [66.owner.GetNameDef](이)가 실레시아를 지키기 위해 싸우려 하지 않는다면, 우리는 그들에게서 그 영토를 빼앗아 올 수도 있습니다."
 CZE_dismantle_poland: "[POL.GetNonIdeologyName] 해체"
 CZE_dismantle_poland_desc: "안타깝게도 [POL.GetNameDef](이)가 국방력이 부족하며, 적의 공격을 막아줄 완충국이 될 수 없다는 사실이 드러났습니다. 이제는 우리 나라의 힘을 키우는 수밖에 없습니다."
 CZE_proclaim_the_restoration_of_bohemia: "보헤미아 왕국의 회복을 선포"
 CZE_proclaim_the_restoration_of_bohemia_desc: "우리의 옛 국경이 회복되었으므로, 이제 우리는 유산을 되찾고 새로운 땅을 통합하는 데 집중할 수 있습니다."
 CZE_integrate_lost_territories: "잃어버린 영토 통합"
 CZE_integrate_lost_territories_desc: "역사적으로 보헤미아 왕국의 영토는 발트해에서 아드리아해까지 뻗어 있었습니다. 이제 우리는 그 역사를 다시 알리며 새로 얻은 영토를 국가에 매끄럽게 융합시켜야 합니다."
 CZE_deepen_ties_with_puppet_kingdoms: "괴뢰 왕국과의 협력 심화"
 CZE_deepen_ties_with_puppet_kingdoms_desc: "우리는 이제 명확한 영향권을 구축했지만, 영향권 내의 국가들에서 최대한의 이익을 얻으려면 우리의 영향력을 더욱 강화해야 할 것입니다."
 CZE_poland_alliance_monarchist: "[POL.GetNonIdeologyName](와)과의 협정"
 CZE_poland_alliance_monarchist_desc: "$CZE_ally_poland_desc$"
 CZE_a_strong_poland: "강력한 [POL.GetNonIdeologyName]"
 CZE_a_strong_poland_desc: "동유럽에서 손꼽히는 강력한 군대를 보유한 [POL.GetNameDef](은)는 귀중한 동맹국이 될 잠재력이 있습니다."
 CZE_mend_balkan_relations: "발칸 국가와 관계 개선"
 CZE_facilitate_a_strong_hungary: "강한 헝가리 만들기에 협력"
 CZE_facilitate_a_strong_hungary_desc: "[HUN.GetNameDef](은)는 독립한 이후로 우리와 불안정한 관계를 유지해 왔습니다. 하지만 분쟁이 발생하면 우리는 그들을 우리의 편으로 끌어들일 수 있을지도 모릅니다."
 CZE_subjegate_romania: "[HUN.GetAdjective]의 영유권 주장으로 루마니아 압박"
 CZE_subjegate_romania_desc: "우리 괴뢰국 [HUN.GetAdjective]의 영유권 주장은 [ROM.GetNameDef]에 맞설 유용한 도구입니다. [HUN.GetNameDef](이)가 [ROM.GetAdjective] 영토에 대한 영유권을 주장하게 하고 그들이 그 영토를 획득하도록 돕겠다고 위협함으로써, 우리는 [ROM.GetNameDef](이)가 우리 편에 서게 만들 수 있을지도 모릅니다."
 CZE_demanded_overlordship_HUN: "헝가리 복속함"
 CZE_demanded_overlordship_ROM: "루마니아 복속함"
 CZE_integrate_hungary: "구 오스트리아 영토 통합"
 CZE_integrate_hungary_desc: "이제 우리가 상당한 영향권을 구축했으므로, 새롭게 확장된 [HUN.GetName] 및 기타 영토를 통합하면 오스트리아-헝가리 국경을 복원할 수 있을 것입니다. 단, 이는 [ROOT.GetAdjective]의 지도 아래 이루어질 것입니다."
 CZE_subjegate_serbia: "[YUG.GetName] 복속"
 CZE_subjegate_serbia_desc: "현재 약화된 [YUG.GetName](은)는 더 이상 우리의 남쪽 측면을 방어하는 완충국 역할을 효과적으로 할 수 없습니다. 슬로베니아를 통합한 후, 이제 우리는 추가적인 확장을 목표로 삼아야 합니다."
 CZE_strike_the_eastern_threat: "동쪽의 위협을 타격하기"
 CZE_strike_the_eastern_threat_desc: "위선적인 [SOV.GetName](은)는 우리 정부를 비판함으로써 제국주의적 야욕을 정당화하며 [CZE.GetName]의 존립을 위협하고 있습니다. 이 위협은 반드시 제거되어야 합니다."
 CZE_assist_austria: "[AUS.GetName] 보호"
 CZE_assist_austria_desc: "[AUS.GetNameDef](을)를 어떠한 분쟁에도 휘말리지 않게 하는 것은 국가 안보에 필수적입니다. [AUS.GetAdjective] 국경은 우리 방어 체계에서 가장 취약한 지점 중 하나입니다. 그들의 경제는 우리 적들에게도 귀중한 자산이 될 것이며, 그들이 이를 차지하는 건 결코 용납할 수 없는 일입니다."
 CZE_return_to_democracy: "민주주의로 회귀"
 CZE_return_to_democracy_desc: "우리 조국의 안전이 확보된 만큼, 국민은 군사 독재가 더 이상 유효하지 않다는 사실을 점차 깨닫고 있습니다. 이제는 선거를 실시하고 권력을 민주적인 민간 정부에 돌려줄 때입니다."
 CZE_cooperate_with_the_allies: "연합국과 협력"
 CZE_cooperate_with_the_allies_desc: "지역의 안정이 더 강화됨에 따라, 우리는 전통적인 동맹국들과의 관계를 회복하기 위해 노력해야 합니다."
 CZE_eliminate_austrian_defeatists: "[AUS.GetAdjective] 패배주의자 격퇴"
 CZE_eliminate_austrian_defeatists_desc: "[AUS.GetNameDefCap](이)가 국가를 방어하려는 의지를 버렸으니, 우리가 포위당하기 전에 지금 당장 개입해야 합니다."
 CZE_the_legacy_of_ottokar: "오타카르의 유산"
 CZE_the_legacy_of_ottokar_desc: "전설적인 왕 오타카르 2세는 오스트리아 귀족들의 지지를 받아 보헤미아의 영토를 오스트리아와 아드리아해까지 확장했습니다. 우리는 다시 한번 귀족과 평민을 가리지 않고 모든 오스트리아인의 지지를 받으려 노력해야 합니다."
 CZE_demand_the_istrian_peninsula: "이스트라반도 요구"
 CZE_demand_the_istrian_peninsula_desc: "[ROOT.GetNameDefCap](은)는 내륙국이기에 오랫동안 무역과 영향력 투사에 어려움이 있었습니다. 이제 더 이상 우리 경제가 이웃 국가들에 좌우되는 것을 용납할 수 없습니다. 아드리아해로의 접근권을 요구해야 합니다."
 CZE_demand_slovenia: "슬로베니아 요구"
 CZE_demand_slovenia_desc: "슬로베니아는 과거 오스트리아 제국의 중요한 지역이었으며, 이제 우리가 그 제국의 핵심부를 장악했으니 그들의 영토를 되찾아야 합니다."
 CZE_demand_overlordship_of_yugoslav_league: "[YUG.GetAdjective] 연맹의 지배권 요구"
 CZE_demand_overlordship_of_yugoslav_league_desc: "우리는 다민족 국가에서 때때로 지방 자치가 필요하다는 것을 잘 알고 있으며 [YUG.GetName] 역시 그렇지만, 그들의 동맹은 이제 스스로를 방어하기에는 너무 약합니다. 우리는 [YUG.GetNameDef](이)가 이 점을 인정하고 우리의 개입을 허용하도록 설득해야 합니다."
 CZE_expand_the_rome_protocols: "로마 의정서 확장"
 CZE_expand_the_rome_protocols_desc: "우리의 새 정부는 [GER.capital.GetCapitalVictoryPointName]보다는 [ITA.capital.GetCapitalVictoryPointName](와)과 훨씬 더 유사한 태도를 보이고 있습니다. 오스트리아를 둘러싼 두 국가 간의 의견 불일치를 고려할 때, 로마 의정서에 가입하는 것은 [ITA.GetNameDef]에게 [GER.GetNameDef]에 찬동하지 않고 현재의 노선을 유지해야 한다는 확신을 줄 수 있을 것입니다."
 CZE_prague_protocols: "프라하 의정서"
 CZE_soviet_alliance: "1935년 동맹 조약 확장"
 CZE_soviet_alliance_desc: "현재 [SOV.GetNameDef](와)과의 동맹 조약은 너무 모호하여 우리가 공격받을 경우 그들이 개입할 것이라 확신하기 어렵습니다. 따라서 우리의 안전을 보장받으려면 그들과 새로운 협정을 체결해야 합니다."
 CZE_airlift_soviet_support: "소련 지원 공수"
 CZE_airlift_soviet_support_desc: "우리는 동맹국인 [SOV.GetAdjective](와)과 국경을 맞대고 있지 않기에, 지금까지 그들의 지원을 받으려면 [SOV.GetAdjective] 병력이 우리 이웃 국가의 영토를 육로로 통과해야 했습니다. 다행히 그 문제는 병력을 항공 수송한다는 참신한 아이디어가 나오면서 해결되었습니다."
 CZE_unlocks_volunteer_transport_raid_tt: "§Y습격§! 잠금 해제:\n§Y[73.GetName]§!의 소련 의용군을 위한 공중 가교"
 CZE_intervene_in_the_ussr: "[SOV.GetAdjective] 내전에 개입"
 CZE_intervene_in_the_ussr_desc: "[SOV.GetNameDef]에 다시 소요 사태가 발생했습니다. 우리가 한때 지지했던 옛 왕실이 돌아오지는 않겠지만, 더 우호적인 정부가 들어설 가능성을 무시할 수는 없습니다."
 CZE_forgive_trading_debts: "무역 부채 탕감"
 CZE_forgive_trading_debts_desc: "경제 불안정과 대공황으로 인해 우리의 잠재적 동맹국들 중 일부가 우리에게 빚을 갚는 데 어려움을 겪고 있으며, 이는 양국 관계에 긴장을 초래하고 있습니다. 정부는 이러한 부채를 탕감하고, 이러한 조치에 영향을 입은 국내 기업들에 보상할 수 있습니다."
 CZE_improve_balkan_trade_relations: "발칸 국가와의 무역 관계"
 CZE_improve_balkan_trade_relations_desc: "발칸 반도에 잠재적 동맹국들을 확보하는 데 있어 우리의 가장 큰 자산은 경제력입니다. 우리는 잠재적 동맹국들의 경제 상황 개선에 자원을 투자하려는 의지를 보여줘야 합니다."
 CZE_ally_austria: "[AUS.GetName](와)과의 동맹"
 CZE_ally_austria_desc: "불과 몇 년 전만 해도 나치 깡패들에 의해 정부가 거의 전복되었던 [AUS.GetNameDef](은)는 이제 [ROOT.GetNameDef](와)과 협력했을 때 얻을 수 있는 이점을 깨달았을 겁니다."
 CZE_demand_the_czech_corridor: "체코 회랑 요구"
 CZE_demand_the_czech_corridor_desc: "소협상국을 제대로 된 동맹으로 키워 나가면서, 분쟁 발생 시 동맹국에 병력을 재배치하거나 그들의 병력을 지원받는 일이 매우 어려울 수 있다는 사실이 점점 분명해지고 있습니다. 대전쟁 이후 한때 제안되었던 것처럼 우리 나라와 [YUG.GetNameDef] 사이를 연결하는 영토 회랑을 확보한다면 우리의 안보를 강화하고 무역을 보호할 수 있을 것입니다."
 CZE_ally_hungary: "[HUN.GetName](와)과의 동맹"
 CZE_ally_hungary_desc: "[CZE.GetNonIdeologyName] 건국 이후 [HUN.GetNonIdeologyName](와)과 우리의 관계에는 갈등이 있었지만, 최근 [HUN.GetNonIdeologyName](은)는 소중한 동맹국이 될 가능성을 보여주고 있습니다."
 CZE_ally_yugoslavia: "[YUG.GetName](와)과의 동맹"
 CZE_ally_yugoslavia_desc: "[YUG.GetNameDefCap](은)는 최근에 경제적 어려움을 겪었을지 몰라도, 그들의 전략 자원과 위치는 무시할 수 없습니다."
 CZE_protect_neutrality: "중립 보호"
 CZE_protect_neutrality_desc: "대전쟁은 적의 표적이 되었을 때 중립을 유지한다는 것이 얼마나 무의미한지를 분명히 보여주었습니다. 이 중립 국가들을 보호한다면 적들이 영토를 확장할 때 분열과 정복을 하도록 내버려두는 대신, 양면 전쟁을 벌이도록 강요할 수 있습니다."
 CZE_if_cooperate_with_moderate_socialists_completed_tt: "§Y중도파 사회주의자와 협력§!이 완료되었을 때 효과:"
 CZE_mutual_protection_agreement_with_switzerland: "[SWI.GetNonIdeologyName](와)과의 보호 협정"
 CZE_mutual_protection_agreement_with_switzerland_desc: "우리와 [SWI.GetNameDef](은)는 모두 자국 영토를 침략하는 자가 막대한 손실을 볼 수밖에 없는 상황을 만들어 가고 있습니다. 서로 협력한다면 우리는 방어에만 그치지 않고 단호하게 반격할 수 있는 규모의 군대를 보유할 수 있을 것입니다."
 CZE_exchange_technology: "연구 협력"
 CZE_exchange_technology_desc: "발칸반도는 풍부한 천연자원이 있지만, 주요 강대국들처럼 수익성 있는 식민지나 선진 산업이 부족합니다. 따라서 각자의 전문 분야에 집중할 수 있도록 연구 협력을 하는 것이 매우 중요합니다."
 CZE_demand_corridor_to_ussr: "[SOV.GetAdjective](으)로의 통로 요구"
 CZE_demand_corridor_to_ussr_desc: "만약 [POL.GetNameDef](이)가 우리와 협력하지 않는다면, 우리는 동맹국인 [SOV.GetName](으)로 이동할 수 있도록 더 중대한 조치를 취해야 합니다."
 CZE_ally_poland: "[POL.GetName](와)과의 동맹"
 CZE_ally_poland_desc: "폴란드-소련 전쟁의 기억이 여전히 생생하고 그들의 서방에 대한 위협이 커지고 있는 가운데, [POL.GetNameDef](은)는 우리와 마찬가지로 안보를 갈구하고 있습니다. 우리는 [POL.GetAdjective]에 중립이 안전을 보장하지 못한다는 것을 납득시키고, 우리와 운명을 같이 하도록 설득해야 합니다."
 CZE_realize_the_polish_czechoslovak_confederation: "연합 실현"
 CZE_realize_the_polish_czechoslovak_confederation_desc: "[POL.GetNameDef](은)는 용감하게 싸웠음에도 불구하고 패배했습니다. 이제 그들의 정부는 망명 중이며, 우리와의 연합에 대한 논의가 시작되었습니다. 그들의 정부가 우리와 합쳐진다면, 우리는 [POL.GetAdjective](와)과 힘을 합쳐 새로운 국가를 만들고 공동의 조국을 해방하기 위해 협력할 수 있을 것입니다."
 CZE_integrate_western_ukrainians: "서부 우크라니아인들과 통합"
 CZE_integrate_western_ukrainians_desc: "[CZE.GetNameDef]의 우크라이나인들은 많은 지원과 자치권을 제공받았으며, 이제 우리는 새로 획득한 토지를 우리 우크라이나 지역에 통합하는 것을 시도할 수 있습니다."
 CZE_ally_russia: "[SOV.GetNonIdeologyName](와)과의 동맹"
 CZE_ally_russia_desc: "[SOV.GetNameDef] 정부가 우리 정부와 더욱 긴밀해진 지금, 우리는 그들의 전 정부와 체결한 모호한 협정을 더 상세하게 수정해 볼 수 있을 것입니다."
 CZE_claim_ukraine: "우호적인 우크라이나 정부 수립"
 CZE_claim_ukraine_desc: "우크라이나는 [SOV.GetNameDef]의 중요한 지역입니다. 우크라이나를 장악하면 우리는 강력한 완충국을 형성할 수 있습니다."
 CZE_strengthen_the_little_entente: "소협상국 공식화"
 CZE_strengthen_the_little_entente_desc: "주로 [HUN.GetNonIdeologyName](을)를 견제하는 데 목적을 둔 소협상국은 상당한 규모의 군대를 보유한 강력한 동맹이 될 가능성이 있습니다."
 CZE_seek_french_leadership: "[FRA.GetAdjective]의 주도권 모색"
 CZE_seek_french_leadership_desc: "우리가 이 동맹을 결성하는 데 주도적인 역할을 했지만, [FRA.GetNonIdeologyName]의 군대는 어떤 동맹에든 큰 도움이 될 것이 분명합니다. 설령 주도권을 양보해야 하더라도 말입니다."
 CZE_increase_food_and_resource_imports: "식량 및 자원 수입 증대"
 CZE_increase_food_and_resource_imports_desc: "새로운 동맹국들이 훌륭한 농업 역량을 갖추고 있기에, 우리 농업 부문에 보조금을 지급할 필요성이 줄었습니다. 자원을 저렴하게 수입하면 우리도 비용을 절감할 수 있고, 동맹국의 경제에도 활력을 불어넣을 수 있습니다."
 CZE_double_down_on_heavy_industry: "중공업에 투자 집중"
 CZE_double_down_on_heavy_industry_desc: "동맹국들과의 새로운 협정을 통해 우리는 무기 산업처럼 가장 경쟁력 있는 산업에 집중할 수 있게 될 것입니다. 그러면 생산하고 남은 무기를 매각할 수도 있을 겁니다."
 CZE_neutralize_the_hungarian_threat: "[HUN.GetAdjective]의 위협 무력화"
 CZE_neutralize_the_hungarian_threat_desc: "[HUN.GetNameDefCap](은)는 남쪽의 잠재적 동맹국들과 무역을 하는 데 장애물이 됩니다. [HUN.GetNameDefCap](이)가 적의 편에 선다면 트리아농 조약의 영향에도 불구하고 우리 군대의 잠재적으로 중요한 전력을 움직여야 할 수 있습니다."
 CZE_cancel_anti_hungary_focus: "[GER.GetAdjective]의 개입 이후 후퇴함"
 CZE_ally_romania: "[ROM.GetName](와)과의 동맹"
 CZE_ally_romania_desc: "[ROM.GetNameDefCap](은)는 이 지역에서 손꼽히는 자급 능력이 높은 국가로, 식량과 귀중한 석유를 생산합니다. 이들과 동맹을 맺으면 서로의 자원에 더 쉽게 접근할 수 있을 뿐만 아니라 적들이 우리를 상대로 전쟁을 벌이는 데 필요한 원자재를 확보하지 못하게 막을 수 있을 것입니다."
 CZE_divide_germany: "독일 분할"
 CZE_divide_germany_desc: "[GER.GetNameDef]의 위협은 단독으로 대처하기 어렵습니다. 따라서 [GER.GetAdjective]의 확장에 대해 우리처럼 우려하고 있으며 선제적으로 행동할 의지가 있는 동맹국을 찾아야 합니다."
 CZE_if_FRA_ally_tt: "§Y프랑스가 군주주의이며§! 누구와도 노선을 같이 하지 않는 경우 효과:"
 CZE_if_POL_ally_tt: "§Y강력한 폴란드§!가 완료되어 [POL.GetNonIdeologyName]의 보증을 받게 될 경우 효과:"
 CZE_revolutionary_brigades: "혁명 여단 창설"
 CZE_revolutionary_brigades_desc: "[ROOT.GetNameDef](을)를 위해 싸우며 경험을 쌓은 우리 혁명가들은 정규군에 더욱 통합되어야 합니다."
 CZE_recruit_communist_exiles: "망명한 공산주의자들 영입하기"
 CZE_recruit_communist_exiles_desc: "[ROOT.capital.GetCapitalVictoryPointName](은)는 오랫동안 망명한 혁명가들의 안전한 피난처였으므로, 우리의 새 정부는 이러한 외국의 급진주의자들을 활용할 수 있을 것입니다."
 CZE_destabilize_potential_adversaries: "잠재적인 적대자들 불안정화"
 CZE_destabilize_potential_adversaries_desc: "당연하다면 당연하겠지만, 우리와 협력하는 망명한 공산주의자들은 우리 첩자들보다 본국에 대한 이해가 깊습니다. 우리는 그들의 본국을 해방하기 위한 전략을 결정할 때 이러한 지식을 최대한 활용해야 합니다."
 CZE_nationalize_key_industries: "은행과 광산 국유화"
 CZE_nationalize_key_industries_desc: "광산은 우리 산업이 전쟁 무기를 만드는 데 필요한 원자재를 제공합니다. 위기 상황에서 물자 공급을 보장하기 위해서는 금융가나 기업가가 아닌 정부의 손에 맡기는 것이 가장 좋습니다."
 CZE_rehabilitate_the_army: "육군 회복"
 CZE_rehabilitate_the_army_desc: "[CZE.GetAdjective] 육군의 장군들 대부분은 체코슬로바키아 군단 출신으로, 특히 소련 내전에서 소련군에 맞서 싸우며 눈에 띄는 활약을 했습니다. 이들이 새로운 [CZE.GetAdjective] 정부에 충성하도록 해야 합니다."
 CZE_unlock_civil_war_army_generals_tt: "내전에서 잃은 지휘관을 회복합니다."
 CZE_recruit_ideologically_aligned_generals: "이념적으로 믿을 수 있는 장군 영입하기"
 CZE_recruit_ideologically_aligned_generals_desc: "이제는 우리의 새로운 가치를 이해하는 인재들이 군에 들어오도록 훈련 프로그램을 조정할 때입니다."
 CZE_recruit_communist_generic_general_tt: "공산주의자 장군 한 명을 얻습니다."
 CZE_purge_two_random_commanders_tt: "무작위로 두 명의 지휘관이 숙청됩니다."
 CZE_czechoslovak_union: "체코슬로바키아 연합"
 CZE_czechoslovak_union_desc: "[CZE.GetNameDef]의 지방 자치는 더 강화되어야 하며, 이를 통해 공산주의 체제를 지역 상황에 맞게 조정할 수 있습니다."
 CZE_continue_industrial_relocation_schemes: "조병창 이전 계획 지속"
 CZE_continue_industrial_relocation_schemes_desc: "국가 안보를 위해, 우리는 계속해서 취약한 공장들을 공중 및 지상 공격으로부터 더 잘 보호될 수 있는 지역으로 이전해야 합니다. 중요한 산업이 공격받을 위험에 처해 있는 것을 가만히 놔둘 수는 없습니다."
 CZE_continue_industrial_relocation_schemes_tt: "§Y군수공장 1개§!를 제거합니다."
 CZE_continue_industrial_relocation_schemes_2_tt: "§R이 공장들은 재건설해야 됩니다.§!"
 CZE_establish_a_armament_factory_in_uhersky_brod: "우헤르스키 브로트 무기 공장 설립"
 CZE_establish_a_armament_factory_in_uhersky_brod_desc: "우헤르스키 브로트 공장은 보병과 항공기용 자동화기 제작 및 설계에 전문화된 조병창입니다. 우리는 이곳을 세계에서 가장 발전된 조병창으로 만들 계획입니다."
 CZE_appeal_to_the_castle: "성채에 지지 요청"
 CZE_appeal_to_the_castle_desc: "체코슬로바키아에서 '성'은 대통령을 지지하는 영향력 있는 조직과 인물들의 광범위한 네트워크를 뜻합니다. 그리고 이 힘 덕분에 대통령은 제한된 헌법상 직무가 시사하는 것보다 더 큰 영향력을 행사할 수 있습니다. 이 집단의 지지를 호소한다면 우리 지도력 확보 시도에 엄청난 탄력이 붙을 것입니다."
 CZE_petition_the_nobles: "귀족 계급에 청원"
 CZE_petition_the_nobles_desc: "[ROOT.GetNameDef]의 귀족 계급은 더 이상 공식 작위를 갖지 못하지만, 여전히 [ROOT.GetAdjective] 사회에서 영향력을 갖고 있습니다. 이들이 우리를 지지해준다면 우리는 더 많은 지지를 끌어모으는 데 필요한 정통성과 자원을 얻을 것입니다."
 CZE_unify_the_fascist_parties: "파시즘 정당 단결"
 CZE_unify_the_fascist_parties_desc: "파시스트 정당들은 분열되어 있으며, 그중 다수는 너무 극단적이어서 큰 지지를 얻기가 어렵습니다. 국가를 수호하기 위해서는 이러한 정당들이 단결하여 사회의 극단적인 세력만이 아니라 모든 계층에 호소할 수 있는 체코슬로바키아의 비전을 제시해야 합니다."
 CZE_pro_rearmament_propaganda: "재무장 지지 선전"
 CZE_pro_rearmament_propaganda_desc: "더욱 중앙집권화된 정부에 대한 지지를 확대하려면, 현재 우리 주변 세계의 위험한 상황을 부각해야 합니다. 이는 또한 필요할 때 국민들이 군 강화 계획을 지지하도록 동기를 부여하는 데에도 도움이 될 것입니다."
 CZE_align_nationalist_parties: "체코 민족주의 정당과 제휴"
 CZE_align_nationalist_parties_desc: "우리는 [ROOT.GetAdjective]의 모든 계층에 지지를 얻어야 하지만, 전통적인 체코 민족주의 정당이 정계에 가장 큰 영향력을 행사한다는 사실은 부인할 수 없습니다. 그들을 통해서 우리는 가장 쉽게 지지를 얻을 수 있습니다."
 CZE_align_slovak_catholics: "슬로바키아 가톨릭과 제휴"
 CZE_align_slovak_catholics_desc: "가톨릭 정당과 민족주의 정당들이 현재 슬로바키아에서 상당한 지지를 받고 있습니다. 민족주의자들의 지지를 얻기 위해서는 상당한 양보가 필요하겠지만, 가톨릭 세력은 우리 편으로 결집시킬 수 있을지도 모릅니다."
 CZE_jozef_tiso_tt: "§Y$CZE_jozef_tiso$§!(을)를 고문으로 임명"
 CZE_align_catholic_parties: "체코슬로바키아 인민당과 제휴"
 CZE_align_catholic_parties_desc: "체코슬로바키아 인민당과 그 외 가톨릭 정당은 오스트리아-헝가리 제국의 군주제 체제를 위한 전통적인 지지 기반이었습니다. 이제 그들을 다시 그 위치로 돌려놓을 때가 되었습니다."
 CZE_restore_the_monarchy: "군주제 재건"
 CZE_restore_the_monarchy_desc: "새로운 체제에 대한 지지가 확보되었으니, 이제 다듬어진 아이디어를 국민들에게 제안할 때입니다. $CZE_karel_schwarzenberg$를 선택된 군주로 내세움으로써, 우리는 기존 군주제 지지자들과 새로운 지지자 모두에게 호소합니다. 왜냐하면 그는 [ROOT.GetAdjective]인이며, 이전에 우리에게 강요되었던 [AUS.GetAdjective] 군주가 아니기 때문입니다."
 CZE_semi_constitutional_monarchy: "준헌법적 체제"
 CZE_semi_constitutional_monarchy_desc: "군주가 선출되었으니 헌법을 개정할 때가 되었습니다. 이 혼란스러운 시기에 내분을 피하기 위해 권력을 중앙집권화해야 한다는 주장도 있지만, 군주 혼자서 모든 것을 할 수는 없다는 것은 분명합니다. 따라서 국가 운영을 돕기 위해 현재의 체제를 부분적으로 유지하는 동시에, 군주가 국가를 이끌도록 하는 것이 최선일 수 있습니다."
 CZE_restore_noble_titles: "귀족 작위 부활"
 CZE_restore_noble_titles_desc: "공화국 건국 당시 사라졌던 귀족 작위를 복원하여, 그들의 협력에 보답할 때가 되었습니다. 이렇게 하면 [ROOT.GetAdjective](을)를 위해 수없이 싸운 베테랑 장교들과 같은 영웅들에게 명예 작위를 수여할 수도 있을 것입니다."
 CZE_restore_the_austro_hungarian_customs_union: "제국의 관세 동맹 복원"
 CZE_restore_the_austro_hungarian_customs_union_desc: "오스트리아-헝가리 제국의 부인할 수 없는 장점 중 하나는 우리 산업에 대한 무역 장벽이 낮았다는 점입니다. 이 관세 동맹을 회복하는 것은 이전에 구성국이었던 다른 국가들을 우리 영향권으로 끌어들이는 첫 번째 단계가 될 것입니다."
 CZE_customs_union: "관세 동맹"
 CZE_catholic_focus: "가톨릭 중점"
 CZE_catholic_focus_desc: "후스파가 [ROOT.GetAdjective]의 역사에서 유명한 부분이기는 하지만, 많은 사람들은 여전히 가톨릭 신앙을 유지하고 있으며 우리는 사회에서 그들의 역할을 확대함으로써 그들의 지지를 얻어야 합니다."
 CZE_hussite_legacy: "후스파의 유산"
 CZE_hussite_legacy_desc: "후스파는 기독교의 좀 더 개신교적인 양식을 증진했을 뿐만 아니라, 후스파에 반대하기 위해 전쟁을 벌인 폭군들과는 달리 자신과 다른 의견도 용인하는 것이 특징이었습니다."
 CZE_align_with_germany: "[GER.GetNonIdeologyName] 측과의 동맹"
 CZE_align_with_germany_desc: "[GER.GetNameDef]의 새 정부가 팽창주의를 버릴 것 같지는 않지만, 누구와 동맹을 맺고 누구를 비난할지에 관해서는 더 실용적인 태도를 보일 가능성이 있습니다. 우리는 전자에 속하도록 노력해야 합니다."
 CZE_rally_against_germany: "[GER.GetNonIdeologyName]에 맞서는 단결"
 CZE_rally_against_germany_desc: "체코슬로바키아인들은 독립을 위해 용감하게 싸웠습니다. 이제 우리는 모든 사람에게 이 독립을 지켜달라고 호소해야 합니다."
 CZE_integrate_sudeten_germans: "주데텐란트 통합"
 CZE_integrate_sudeten_germans_desc: "주데텐란트 주민들의 분열은 누구에게도 도움이 되지 않습니다. 우리는 그들의 문제를 해결하기 위해 노력해야 합니다. 이렇게 하는 것만으로도 우리가 주민들을 학대한다는 독립운동가들의 주장을 믿기 어렵게 만들 수 있습니다."
 CZE_cooperate_with_the_sdp: "주데텐 독일인당과 협력"
 CZE_cooperate_with_the_sdp_desc: "불안정한 세력이긴 하지만, 집권 연립정부에 포함시키는 것과 같은 적절한 지원이 주어진다면 주데텐 독일인당이 우리와 협력할 가능성이 있습니다."
 CZE_revive_the_december_bloc: "12월 연합 부활"
 CZE_revive_the_december_bloc_desc: "에드바르트 베네시가 대통령이 되는 것에 반대했던 파시스트, 소수당, 우익 정당의 12월 연합은 현재 정부의 대체제가 되기 위해 복원되어야 합니다."
 CZE_revert_1926_anti_military_laws: "1927년 반군사법 철회"
 CZE_revert_1926_anti_military_laws_desc: "$CZE_radola_gajda$의 쿠데타 시도 이후, 군과 헌병대는 투표권을 비롯한 여러 특권을 잃었습니다. 이러한 어려운 시기에 군의 중요성을 고려할 때, 이러한 제한을 철폐하고 군과 정치 사이의 분열을 해소하는 것이 마땅합니다."
 CZE_bop_to_fascism_support_tt: "§Y$CZE_bop_army_readiness$§! 값의 3분의 1을 파시즘 지지도에 추가:"
 CZE_power_to_the_military: "군대에 권력을"
 CZE_power_to_the_military_desc: "국가 방위를 위해서는 자원을 아끼지 않아야 한다는 것은 명백합니다. 따라서 권력자들이 군대에 무엇이 필요한지 이해하는 것이 매우 중요하며, 이를 보장하는 가장 좋은 방법은 군사정부를 세우는 것입니다."
 CZE_militarize_the_associations: "단체 군사화"
 CZE_militarize_the_associations_desc: "[CZE.GetNameDef]의 많은 단체들은 평소부터 군인에게 필수적인 기술을 가르침으로써 국민이 동원되지 않았을 때도 국가 방위에 기여할 수 있습니다."
 CZE_aggressive_foreign_policy: "공격적인 외교 정책"
 CZE_aggressive_foreign_policy_desc: "깨지기 쉬운 협정에 의존하던 시대는 끝났습니다. 우리의 안보를 지키기 위해서는 심각한 희생이 따르더라도 단호하게 행동해야 합니다."
 CZE_work_with_germany: "[GER.GetNameDef] 측과의 협력"
 CZE_work_with_germany_desc: "주데텐 문제가 해결되었으니, [GER.GetNameDef] 측은 이제 잠재적 동맹으로서 [ROOT.GetNameDef](이)가 지닌 가치를 깨달았을지도 모릅니다."
 CZE_control_the_associations: "단체 통제"
 CZE_control_the_associations_desc: "[CZE.GetNonIdeologyName]에는 같은 직업을 가진 사람들부터 여가 활동을 하는 사람들, 스포츠 협회까지 많은 단체가 있고, 이를 통제하면 사회의 많은 부분을 통제할 수 있습니다."
 CZE_diversify_bata: "바탸 다양화"
 CZE_diversify_bata_desc: "바탸는 우리가 자원 공급망에서 유리하게 활용할 수 있는 대형 소비재 회사입니다. 바탸는 다른 곳에서는 구하기 어려운 핵심 자재를 제공함으로써 우리를 도울 수 있습니다."
 CZE_devaluate_the_koruna: "코루나화 평가 절하"
 CZE_devaluate_the_koruna_desc: "통화 강세는 경제의 상당 부분을 수출에 의존하는 국가에는 경제적으로 위험한 상황입니다. 통화 가치 약화는 단기적인 고통으로 이어질 수 있지만, 장기적으로는 더 나은 방법입니다."
 CZE_continue_the_central_bohemia_plan: "중앙 보헤미아 계획"
 CZE_continue_the_central_bohemia_plan_desc: "우리 국가 중부의 산업 지역 확장 계획을 계속 추진하면 규모의 경제를 활용할 수 있을 것입니다. 국경에서 멀리 떨어진 곳으로 산업을 확장하는 것은 국가 안보 측면에서도 현명한 선택입니다."
 CZE_balance_industrial_invevestments: "산업 발전 격차 조정"
 CZE_balance_industrial_invevestments_desc: "[9.getname] 및 [75.getname]의 외곽 지역들을 저개발된 채로 방치한 것은 이 10년 중 초기에 국가 내 격차가 발생한 이유 중 하나입니다. 국가의 외곽 지역을 개발하는 것은 두 지역 사이의 산업 발전 격차를 메우는 데 도움이 될 것입니다."
 CZE_expand_prf_science_facilities: "PrF의 과학 시설 확장"
 CZE_expand_prf_science_facilities_desc: "PrF의 과학 시설은 지금보다 더 큰일을 할 기회를 기다리는 뛰어난 인재들로 가득 차 있습니다. 부서를 확장하고 이들이 정부와 협력하게 하는 것은 우리 연구를 발전시키는 좋은 시작점이 될 것입니다."
 CZE_raise_more_industrial_funds: "산업 자금 증액"
 CZE_raise_more_industrial_funds_desc: "오스트리아-헝가리 제국 시대부터 오늘날까지 산업은 우리 국가의 심장이었습니다. 필수적인 예산과 자금을 지원한다면 우리의 산업은 이 혼란스러운 유럽에서도 계속 번영할 것입니다."
 CZE_skoda_priority_focus_info_tt: "일부 §Y국가중점§!은 특정한 £GFX_CZE_skoda_text_icon §Y슈코다 우선§! 중점일 때만 완료됩니다. 이러한 중점들은 필요한 £GFX_CZE_skoda_text_icon §Y슈코다 우선§!과 관련된 작은 아이콘으로 표시됩니다."
 CZE_joint_stock_schemes: "주식회사 제도"
 CZE_joint_stock_schemes_desc: "주식회사 제도는 전통적인 자금 조달 방식이 부족했던 시기에 경제 성장의 원천 역할을 해왔습니다. 이러한 전략을 지속적으로 활용한다면 우리 경제가 더욱 성장할 것입니다."
 CZE_the_slovak_arrow: "슬로바키아의 화살"
 CZE_the_slovak_arrow_desc: "두 주요 도시를 연결하는 고속철을 개발한다면 국가적 자부심의 커다란 원천이 될 겁니다. 또한 철도 기반시설을 개선할 좋은 계기가 될 것입니다."
 CZE_finish_double_tracking_efforts: "복선화 작업"
 CZE_finish_double_tracking_efforts_desc: "주요 2차 철도 노선 중 일부의 복선화가 완료되면 해당 노선의 교통 처리량이 증가할 것이며, 이것은 일부 2차 도시 간의 연결성 향상으로 이어질 것입니다."
 CZE_realize_motorway_proposals: "고속도로 계획 이행"
 CZE_realize_motorway_proposals_desc: "우리 국경 내의 도로 연결성을 크게 향상할 고속도로 건설 계획이 정부에 제출되었습니다. 우리는 이 계획에 따라 행동하고 현실로 만들어야 합니다."
 CZE_build_additional_rail_stations: "추가 철도역 건설"
 CZE_build_additional_rail_stations_desc: "철도 기반시설이 새롭게 개발된 후, 기존 철도역 중 일부는 증가한 처리량을 감당하지 못하고 있습니다. 이러한 문제점을 개선하면 사람과 화물을 필요한 곳으로 더 많이 운송하는 데 큰 도움이 될 것입니다."
 CZE_build_additional_rail_stations_focus_cost_tt: "§Y$CZE_devaluate_the_koruna$§!를 선택하면 이 중점 완료에 소모되는 시간이 §G35§!일로 단축됩니다."
 CZE_grow_ckd_secondary_facilities: "CKD 보조 시설"
 CZE_grow_ckd_secondary_facilities_desc: "CKD는 발전기와 같은 중요한 산업 제품을 생산하는 소규모 2차 공장을 다수 보유하고 있습니다. 이러한 공장들을 확장하면 중공업 성장에 도움이 될 것입니다."
 CZE_bolster_domestic_construction: "국내 건설업 강화"
 CZE_bolster_domestic_construction_desc: "대전쟁 후 독립을 이룩한 이래로 우리 국내 건설 부문은 꾸준히 성장해 왔습니다. 일부 중견 건설업체들에 대해 추가로 투자하면 이러한 성장이 더욱 강화될 것입니다."
 CZE_invest_in_vhht: "VHHT에 투자"
 CZE_invest_in_vhht_desc: "VHHT는 국내 전역에 걸쳐 다양한 금속 가공 공장을 보유한 회사입니다. 이 회사에 대한 투자와 확장은 향후 금속 생산의 다양한 분야를 개선하는 데 도움이 될 것입니다."
 CZE_expand_vitkovice_ironworks: "비트코비츠케 제철소 확장"
 CZE_expand_vitkovice_ironworks_desc: "비트코비츠케 제철소는 [74.getname] 내에서 중요한 철 공급원입니다. 이 공장을 확장하면 생산량이 크게 증가할 것입니다."
 CZE_expand_central_bohemian_mines: "보헤미아 중부 광산 확장"
 CZE_expand_central_bohemian_mines_desc: "우리 국가 중부 지역의 광산들은 에너지 안보에 가장 중요합니다. 우리는 가능한 한 빨리 이 광산들을 확장해야 합니다."
 CZE_increase_bauxite_imports: "보크사이트 수입 증대"
 CZE_increase_bauxite_imports_desc: "우리 국가는 알루미늄 자원이 풍부하지는 않지만, 특정 정련 공정을 활용하고 보크사이트 수입을 늘리면 소량의 알루미늄을 국내에서 생산할 수 있습니다. 이러면 자원 부족을 해소하는 데 도움이 될 것입니다."
 CZE_merge_the_oil_companies: "석유 회사 합병"
 CZE_merge_the_oil_companies_desc: "우리 국가의 석유 회사들은 모두 석유 회사라고 부르기도 민망할 정도로 작은, 몇 개의 유정을 중심으로 세워진 소규모 기업들일 뿐입니다. 이들을 합병하고 석유 산업을 국가 통제 아래 두면, 더 적은 비용으로 더 큰 성과를 낼 수 있습니다."
 CZE_expand_trinec_ironworks: "트르지네츠 제철소"
 CZE_expand_trinec_ironworks_desc: "트르지네츠 제철소는 창립 이래 [72.getname]에서 산업계의 거물로 자리매김해 왔습니다. 추가 투자는 자원 생산 면에서 막대한 이익을 가져다줄 것입니다."
 CZE_consolidate_mining_operations: "채광산업 통폐합"
 CZE_consolidate_mining_operations_desc: "관련 기업들의 경영을 통합하여 효율성을 높인다면 우리의 채광산업을 더욱 최적화할 수 있습니다. 이를 통해 기존의 광산을 확장하기 위한 연구 및 노력의 효율이 증가할 것입니다."
 CZE_expand_praga: "프라하 계약"
 CZE_expand_praga_desc: "프라하는 오랫동안 우리 군수산업에 다양한 부품을 공급해 왔습니다. 프라하가 더욱 성장할 수 있도록 추가 계약을 체결하는 것이 합리적입니다."
 CZE_shrink_educational_disparities: "교육 격차 축소"
 CZE_shrink_educational_disparities_desc: "우리 농촌 지역은 도시 지역에 비해 제대로 된 교육을 제공받지 못했습니다. 우리는 농촌 지역을 겨냥한 대규모 교육 계획을 통해 이러한 격차를 해소해야 합니다."
 CZE_kickstart_rapid_rearmanent: "급속 재무장 시동"
 CZE_kickstart_rapid_rearmanent_desc: "많은 정치인과 기업가들은 이를 끔찍한 결정이라 생각할지도 모르지만, 우리는 지금 당장 재무장을 시작해야 합니다. 주변 국가들은 군비 축소를 하지 않고 오히려 정반대의 행보를 보이고 있으며, 이는 공공연한 비밀입니다. 아직 시간이 있을 때 우리 군대를 준비시켜야 합니다."
 CZE_keep_focus_on_weapon_exports: "무기 수출에 중점"
 CZE_keep_focus_on_weapon_exports_desc: "우리의 대규모 무기 수출 산업은 우리를 경제 불황에서 벗어나게 해주었습니다. 이러한 추세를 역전시키는 것은 정치적으로나 경제적으로나 위험할 것입니다. 현재로서는 현 상태를 유지하는 것이 최선의 행동 방침입니다. 어차피 우리를 향한 위협은 모두 허세입니다."
 CZE_force_the_industrialists_hand: "산업가들을 강제하기"
 CZE_force_the_industrialists_hand_desc: "산업가와 대기업들은 우리의 효과적인 재무장을 너무나 오랫동안 방해해 왔습니다. 이제 국가를 위해, 우리가 그들 대신에 선택을 해야 합니다."
 CZE_embrace_corporatism: "협동조합주의 수용"
 CZE_embrace_corporatism_desc: "산업가들과 협상하고 그들의 조건 중 일부를 들어준다면 우리가 재무장을 다시 시작하는 것을 그들이 돕게 할 수 있습니다. 산업가들에게 혜택을 주는 일부 정책 변경은 충분히 합리적이며 우리의 이익에도 부합합니다."
 CZE_expand_existing_armory_plants: "기존 조병창 공장 확장"
 CZE_expand_existing_armory_plants_desc: "기존 조병창의 위치를 이전하는 것은 비용이 많이 드는 투자인 데다가 장기적으로 큰 이점이 없습니다. 기존 위치를 확장하는 것이 현재 위치에서 생산 및 연구 개발을 확대할 수 있는 이점과 기회를 제공할 것입니다. 비록 해당 위치가 잠재적인 적의 공격에 더 취약해질 위험이 있더라도 말입니다."
 CZE_expand_skoda_offices: "슈코다 사무소 확장"
 CZE_expand_skoda_offices_desc: "외국 지사가 있으면 무기 판매에 큰 추진력을 얻게 됩니다. 새로운 지역으로 사무소를 확장하는 것은 현명한 결정입니다."
 CZE_skoda_office_unlock_tt: "결정 잠금 해제: §Y무기 판매 사무소 건설§!"
 CZE_complete_the_power_grid: "전력망 완공"
 CZE_complete_the_power_grid_desc: "우리 농촌 지역의 전력망은 좀 더 개선할 필요가 있습니다. 국가의 다른 지역에 비해 뒤처져 있으며, 경제 발전에 걸림돌이 되고 있기 때문입니다."
 CZE_build_the_slapy_reservoir: "슬라피 저수지 건설"
 CZE_build_the_slapy_reservoir_desc: "슬라피 근처에 댐을 건설하면 지역의 발전량 증가와 경제적 기회 창출로 이어질 겁니다. 발전량 증가는 지역 산업의 성장에 큰 도움이 될 것입니다."
 CZE_diversify_refinery_processes: "정제 공정 다양화"
 CZE_diversify_refinery_processes_desc: "우리 유정에서는 다양한 석유 부산물을 생산할 수 있을 것입니다. 유일한 문제는 그것을 실현하는 방법을 모른다는 겁니다. 방법을 알아내는 데 시간을 투자한다면, 이 꿈을 현실로 만들 수 있을 것입니다."
 CZE_enlarge_smaller_wells: "작은 유정 확장"
 CZE_enlarge_smaller_wells_desc: "우리의 작은 유정들은 현재 생산되는 미미한 양의 석유보다 훨씬 더 많은 양을 생산할 수 있습니다. 우리가 해야 할 일은 이를 실현하기 위해 시간을 투자하는 것뿐입니다."
 CZE_develop_sudetenland_resources: "주데텐란트 자원 개발"
 CZE_develop_sudetenland_resources_desc: "주데텐란트에는 우리가 현재 채굴하지 않고 있는 매장된 자원이 많습니다. 이 지역에 광산을 더 건설하는 데 투자하지 않는다면 큰 실수일 것입니다."
 CZE_grow_tatras_capabilities: "타트라의 역량 강화"
 CZE_grow_tatras_capabilities_desc: "현재 타트라 전차부는 규모가 작지만, 몇 가지 참신한 생산 설계를 보유하고 있습니다. 이들에게 추가 자원을 제공하면 기갑 설계 분야에서 발전을 이어 나갈 수 있을 것입니다."
 CZE_bailout_moser: "모제르 구제"
 CZE_bailout_moser_desc: "모제르는 대공황의 여파로 어려움을 겪었습니다. 이들의 산업은 구제 금융을 받아야 하고, 공장은 다시 문을 열어야 하며, 해고된 사람들은 다시 일자리에 복귀해야 합니다."
 CZE_merge_skodas_consumer_good_plants: "슈코다의 소비재 공장 병합"
 CZE_merge_skodas_consumer_good_plants_desc: "슈코다는 중앙집중화되지 않은 소규모 소비재 공장을 다수 보유하고 있습니다. 공장들을 병합하면 해당 공장들의 여러 생산 부문을 최적화하는 데 도움이 될 겁니다. 또한 슈코다 전체에도 긍정적인 영향을 미칠 수 있습니다."
 CZE_giant_of_central_europe_industry: "산업의 거인"
 CZE_giant_of_central_europe_industry_desc: "이전에는 불가능하다고 여겨졌던 높이에 이르렀습니다. 이제 우리는 유럽 산업의 거물이 되었습니다!"
 CZE_continue_armed_force_reform: "군대 개혁 계속하기"
 CZE_continue_armed_force_reform_desc: "계획된 일정에 따라 계속해서 군대를 현대화하고 군사 지역을 지방 사령부로 재분배하면, 분쟁이 일어났을 때 더 효과적으로 협력할 수 있을 것입니다."
 CZE_air_force_officer_recruitment: "공군 장교 모병"
 CZE_air_force_officer_recruitment_desc: "각 주의 항공 클럽은 공군 예비역 장교 학교와 협력하여 예비역 장교들에게 필요한 비행 코스와 실사격 훈련을 제공합니다."
 CZE_national_defense_act: "국가 방위법"
 CZE_national_defense_act_desc: "이 방위법은 국가의 주권, 무결성, 통일 및 안보에 대한 위협이나 공격에 대응하기 위한, 군사적 조치를 포함한 모든 조치를 포괄하고 있으며, 최고 국방 위원회(NROS)의 감독하에 있습니다."
 CZE_car_and_oil_rationing: "자동차 및 석유 배급제"
 CZE_car_and_oil_rationing_desc: "개인용 자동차를 배급하고 필요시에 징발하면, 군사적 용도를 위한 석유 자원과 자동차 생산에 집중할 수 있을 겁니다."
 CZE_expand_airfield_capacity: "비행장 수용량 확장"
 CZE_expand_airfield_capacity_desc: "제3항공부는 우리 항공기를 적절하게 운영, 보관, 수리하기 위한 새로운 비행장과 격납고, 그리고 새로 창설된 비행대와 지상 승무원을 위한 기숙사 건설을 계획했습니다."
 CZE_trust_in_old_guard: "초기 조종사들에 대한 신뢰"
 CZE_trust_in_old_guard_desc: "대전쟁에서 얻은 비행 기술과 경험은 우리가 굳게 믿는 참전용사들을 통해 새로운 세대에게 전수될 것입니다."
 CZE_expand_the_aero_clubs: "항공 클럽 확장"
 CZE_expand_the_aero_clubs_desc: "항공 클럽은 우리 국가에 재능 있는 조종사를 꾸준히 공급하는 데 유용하다는 것이 입증되었으므로, 우리는 이를 더욱 확장해야 합니다."
 CZE_invest_in_the_smaller_air_plants: "소규모 비행기 공장에 투자"
 CZE_invest_in_the_smaller_air_plants_desc: "새로운 소규모 항공기 제조사에 투자하면 건전한 경쟁을 통해 기존 제조사를 긴장하게 할 수 있습니다. 크고 작은 항공기 제조사들은 더욱 다양해진 우리의 수요를 충족하는 데 도움이 될 것입니다."
 CZE_continue_avia_expansion: "아비아 확장 지속"
 CZE_continue_avia_expansion_desc: "아비아에 투자하면 생산 용량을 더욱 강화하는 데 필요한 추가적인 장비를 확보할 수 있습니다. 이는 수요가 많은 항공기 기체 생산 시 효율성을 높이는 데 도움이 될 수 있습니다."
 CZE_increase_military_aeronautical_institute_funding: "군 항공 자금 증액"
 CZE_increase_military_aeronautical_institute_funding_desc: "항공우주 연구 및 시험 시설(VZLÚ)을 위한 추가 시설을 건설함으로써 우리는 공기역학을 더 잘 이해할 수 있으며, 항공기 설계를 더욱 발전시키고 개선할 수 있습니다."
 CZE_air_training_abroad: "공군 국외 훈련"
 CZE_air_training_abroad_desc: "우리에게 우호적인 국가의 공군에 연수생을 파견하면, 그들은 다양한 관점에서 얻은 귀중한 통찰과 직접적인 경험을 가지고 고국으로 돌아올 겁니다."
 CZE_establish_air_defense_zones: "대공 방어 지역 설정"
 CZE_establish_air_defense_zones_desc: "우리는 새로운 대공포대를 주요 지점과 공장에 배치하고, 지역 단위의 통신 노드를 통해 대공 방어 구역을 설정하여 대공 정확도를 최적화할 수 있습니다."
 CZE_establish_air_defense_zones_enable_tt: "§Y대공 방어 지역§! 사용 가능"
 CZE_establish_air_defense_zones_tt: "고정형 대공 공격 명중률: §G+10%§!"
 CZE_the_air_is_our_sea: "하늘은 우리의 바다"
 CZE_the_air_is_our_sea_desc: "체계적인 조종사 훈련을 통해 우리 조종사들이 용감하고 자신 있게 비행할 수 있도록 지원해야 합니다. 항구도 없고, 외항선도 없는 우리에게는 하늘이 곧 바다이기 때문입니다."
 CZE_bring_kramer_and_lobel_under_state_control: "크라머 앤 뢰블을 국가가 통제"
 CZE_bring_kramer_and_lobel_under_state_control_desc: "크라머 앤 뢰블을 국유화함으로써 우리는 필수적인 전기 제품 및 무전 보조 장치에 대한 지속적인 연구와 적시 공급을 보장할 수 있습니다."
 CZE_second_to_none: "세계 제일"
 CZE_second_to_none_desc: "우리 항공기 산업의 비행기 설계는 날로 발전하고 있습니다. 더 많은 연구를 통해 우리의 설계는 세계 제일이 될 겁니다!"
 CZE_diversify_airframe_production: "다양한 기체 생산"
 CZE_diversify_airframe_production_desc: "전투기만으로는 모든 공군 임무를 수행할 수 없습니다. 다양한 유형의 임무를 수행하려면 다른 항공기와 더 큰 기체가 필요합니다."
 CZE_projekt_l_52: "프로옉트 L 52"
 CZE_projekt_l_52_desc: "제트 엔진 기술은 군용 항공기의 미래입니다. 현재는 기술이 다소 미흡한 부분이 있지만, 시간을 들여 전용 프로젝트를 개발하고 이를 위해 특별히 설계된 기체를 제작한다면 경쟁에서 우위를 유지할 수 있을 것입니다."
 CZE_fund_vladimir_mandl_research: "블라디미르 만들의 연구에 자금 지원"
 CZE_fund_vladimir_mandl_research_desc: "$CZE_vladimir_mandl$이라는 이름의 변호사가 로켓 기술에 심취해 있습니다. 우리가 그와 협력하여 그의 연구를 실용적인 기술로 발전시키는 데 필요한 자원을 제공한다면, 이 협력을 통해 큰 이익을 얻을 수 있을 것입니다."
 CZE_mobilize_the_reserves: "예비대 동원"
 CZE_mobilize_the_reserves_desc: "국경의 긴장이 심해지고 있습니다. 우리는 동원 카드에 따라 예비군과 사전 선발된 군사 전문가들을 소집해야 합니다."
 CZE_three_kings: "세 명의 왕"
 CZE_three_kings_desc: "우리의 저항군 조직을 공식적으로 지원하면 그들이 군대에 피해를 입히는 능력이 크게 향상될 것입니다. 또한, 이는 우리 육군에게도 야전에서 도움이 될 겁니다."
 CZE_form_the_state_defense_guard: "국방경비대 창설"
 CZE_form_the_state_defense_guard_desc: "국방경비대(SOS)를 설립함으로써 우리는 긴 국경을 보호하는 데 특화된 조직을 얻었습니다. 경비대원들은 군사적으로 조직되고 훈련되어 있기 때문에 국경 침입에 대한 1차 방어선 역할을 할 것입니다."
 CZE_expand_the_horska_divisions: "산악 사단 확장"
 CZE_expand_the_horska_divisions_desc: "우리 국가는 대부분 낮은 언덕과 고원으로 이루어져 있기 때문에 산악전을 위해 특별히 훈련받은 군인들이 이러한 험난한 지형에서 매우 중요한 역할을 할 것입니다."
 CZE_develop_horska_artillery: "산악포 개발"
 CZE_develop_horska_artillery_desc: "현재의 포를 가볍고 분해가 가능하도록 개조하면 우리 군대가 산악 및 구릉 지형에서도 충분한 화력을 낼 수 있습니다."
 CZE_develop_horska_artillery_tech_tt: "§Y산악포§! 사용 가능\n§Y포(산악)§!\n  공격: §G+10%§!\n  이동: §G+10%§!\n§Y포(언덕)§!\n  공격: §G+10%§!\n  이동: §G+10%§!"
 CZE_bribery_investigations: "뇌물 수수 조사"
 CZE_bribery_investigations_desc: "병사들의 식사 및 처우에 대한 익명의 편지를 받았습니다. 일부 증거는 특정 병참 장교들의 부적절한 행동을 지적하고 있습니다. 우리 군이 더 큰 피해를 입기 전에 이러한 행위를 막아야 합니다."
 CZE_bribery_investigations_remove_effect_tt: "이 국민정신은 '§Y$CZE_bribery_investigations$§!' 중점 완료 시 제거됩니다."
 CZE_opl_exercises: "OPL 훈련"
 CZE_opl_exercises_desc: "대공 방어(OPL) 훈련을 실시하면 우리 군대는 협공과 생존 능력을 끌어올리는 기동을 연습할 수 있으며, 이로써 병력의 이동 능력과 안전이 종합적으로 향상될 것입니다."
 CZE_rapid_response_divisions: "신속 기동부대"
 CZE_rapid_response_divisions_desc: "외국 군대는 적보다 더 빠르게 재배치할 수 있는 기동부대의 위력을 보여주며 그 잠재력을 부각했습니다. 우리도 유사한 부대를 편성해서 시험해 볼 수 있겠습니다."
 CZE_redouble_tank_development_efforts: "전차 개발 활동 강화"
 CZE_redouble_tank_development_efforts_desc: "우리의 현재 경전차 설계는 유럽의 다른 기갑 운용국들의 설계에 비해 개선의 여지가 있습니다. 다른 나라에 뒤처지지 않으려면 지금보다 몇 배는 더 노력해야 합니다."
 CZE_rearmed_and_retooled: "재무장 및 재정비"
 CZE_rearmed_and_retooled_desc: "현재 우리의 중전차 차체는 더욱 현대화될 수 있습니다. 우리는 향후 기갑부대의 확장에 대응하기 위해 현대화 방안을 계속 모색해야 합니다."
 CZE_establish_the_fall_backlines: "후퇴선 구축"
 CZE_establish_the_fall_backlines_desc: "현실적으로 생각하면 우리 방어선의 일부분이 무너지는 일이 생길 수밖에 없습니다. 그런 일이 일어났을 때, 이미 구축된 후퇴선이 있는지가 승패를 가를 것입니다."
 CZE_establish_the_fall_backlines_masterful_delay_tactic_tt: "\n전술 사용 가능: §Y$tactic_masterful_delay$§!"
 CZE_anti_tank_development: "대전차포 개발"
 CZE_anti_tank_development_desc: "기갑 부대의 규모를 점점 늘리는 나라가 많아지고 있으므로, 우리는 반드시 대전차포를 개량해야 합니다. 야전용 장비로 전차에 대처할 수 있는 능력이 적을 저지하느냐, 적에게 돌파당하느냐의 차이를 만들 것입니다."
 CZE_anti_tank_development_tech_tt: "§Y대전차 장비 개선§! 사용 가능\n§Y포병§! 관통: §G+5%§!\n§Y지원 포병§! 관통: §G+5%§!\n§Y대전차포§! 관통: §G+5%§!\n§Y지원 대전차포§! 관통: §G+5%§!"
 CZE_recon_in_force: "위력정찰"
 CZE_recon_in_force_tech_tt: "§Y위력정찰§! 사용 가능 \n§Y정찰대§!: 내구도: §G+5§!\n정찰: §G+10.0%§!."
 CZE_recon_in_force_desc: "정찰대가 적 방어선을 탐색하며 적과 접촉하는 것은 정보를 얻는 데 매우 유용한 방법입니다."
 CZE_integrate_fortification_engineers: "요새화 공병 통합"
 CZE_integrate_fortification_engineers_desc: "우리 육군의 요새화 공병들이 고정 방어 시설을 건설하고 있지 않을 때, 우리는 공병들을 신속하게 최전선 임무로 전환하여 방어력을 강화할 수 있습니다. 이는 우리 병력을 위한 더 좋은 임시 방어 시설을 세움으로써 최전선의 군대에 도움이 될 것입니다."
 CZE_integrate_fortification_engineers_tech_tt: "§Y통합된 요새화 공병§! 사용 가능\n§Y공병중대§!:\n참호 §G+10.00%§!.\n§Y(요새)§!\n 방어 §G+10.0%§!"
 CZE_concealment_efforts: "은폐 전술"
 CZE_concealment_efforts_desc: "지상 공격기와 정찰기가 광범위하게 사용되면서 위장망을 비롯한 여러 은폐 전술이 필수가 되었습니다. 우리 병사들이 야전에서 충분히 위장될 수 있도록 더 힘써야 합니다."
 CZE_concealment_efforts_tech_tt: "§Y위장망 개선§! 사용 가능 \n§Y일반 보병(숲)§!\n 방어: §G+10%§!"
 CZE_elevate_the_vsv: "군사대학 승급"
 CZE_elevate_the_vsv_desc: "군의 두뇌 역할을 하는 것은 민족적, 국가적으로 막중한 책임을 수반합니다. 따라서 장군 참모의 임무에는 전문적인 훈련뿐만 아니라 신뢰도, 자제력, 재치, 그리고 인격 면에서도 최고의 자질을 갖춘 장교들이 필요합니다."
 CZE_continue_with_snejdareks_plan_dynamic: "[CZE_continue_with_snejdareks_plan]"
 CZE_continue_with_snejdareks_plan_default: "슈네이다레크의 계획 계속하기"
 CZE_continue_with_snejdareks_plan_no_snejdareks: "고정 방어 계획 계속하기"
 CZE_continue_with_snejdareks_plan_dynamic_desc: "효과적인 방어망을 구축하면 적군의 예상치 못한 침투를 방지할 수 있으며, 전략적 방어에서 공격으로 전환하기 위한 방어력과 강력한 기반을 마련합니다."
 CZE_go_with_vojcechovskys_plan_dynamic: "[CZE_go_with_vojcechovskys_plan]"
 CZE_go_with_vojcechovskys_plan_default: "루자의 계획 계속하기"
 CZE_go_with_vojcechovskys_plan_no_luza: "적극 방어 교리"
 CZE_go_with_vojcechovskys_plan_dynamic_desc: "고정 방어 시설의 단점은 기동이 불가능하다는 것입니다. 일단 파괴되면 더 이상 공격 목적으로 사용할 수 없으며, 원래 있던 위치에 잔해로만 남게 됩니다."
 CZE_improve_the_current_officer_pool: "현역 장교 개선"
 CZE_improve_the_current_officer_pool_desc: "우리는 우리 육군의 중추가 될 역량을 보여준 인재를 승진시킬 것입니다. 그들이야말로 상급 사령부와 지역 부대 간의 감독 및 조정 역할을 수행하는 데 필수적이기 때문입니다."
 CZE_elevate_slovak_officers: "슬로바키아인 장교 승급"
 CZE_elevate_slovak_officers_desc: "우리는 슬로바키아인 장교의 승급에 집중하여 군 내 대표성을 강화할 것입니다. 슬로바키아 지역 출신 지원자에 대한 일부 요구 사항을 완화함으로써 향후 군 내 결속도가 강화될 것으로 예상합니다."
 CZE_promote_moravec_writings: "모라베츠의 저서 선전"
 CZE_promote_moravec_writings_desc: "모라베츠의 저서 '군인과 시간'과 '국가 방위'가 매우 상반된 반응을 불러일으켰음에도 불구하고, 최근 출간된 그의 저서 '중부 유럽에서 우리 국가의 군사적 중요성'은 유럽 전역의 일간지에서 화제가 되었습니다. 우리는 모라베츠가 국방 정책과 군 역사 문제에 대한 명실상부한 전문가로서 계속해서 연구 활동을 이어가도록 격려해야 합니다."
 CZE_lessons_of_war: "전쟁의 교훈"
 CZE_lessons_of_war_desc: "우리는 이제 동등한 적과의 전투 경험을 충분히 쌓았으므로, 이러한 교훈을 바탕으로 최고사령부를 개선할 수 있습니다. 실제 전투에서 얻는 교훈은 그 무엇으로도 대체할 수 없습니다."
 CZE_lessons_of_war_i_had_war_with_major_flag: "강대국과 전쟁을 치름"
 CZE_for_the_homeland: "조국을 위하여"
 CZE_for_the_homeland_desc: "우리 군대는 앞으로 닥칠 도전에 대비를 마쳤으므로, 이제 우리는 조국을 수호할 준비가 되어 있다고 자신 있게 말할 수 있습니다. 우리는 우리 앞에 놓인 어떤 임무라도 수행할 준비가 되어 있습니다."
 CZE_the_lions_roar: "사자의 포효"
 CZE_the_lions_roar_desc: "체코슬로바키아의 사자 문양은 우리 군의 가장 뛰어난 미덕인 최고 수준의 용기, 힘, 그리고 영웅심을 상징합니다. 우리 군대의 비할 데 없는 기상은 모두가 알게 될 것입니다."
 CZE_diversify_our_specialists: "특기병 다양화"
 CZE_diversify_our_specialists_desc: "우리는 산악 전문인 호르스카 부대만 의존하지 않고 다양한 분야의 특기병을 양성해야 합니다. 전쟁은 산과 언덕 꼭대기가 아닌 다른 곳에서 벌어지고 있습니다."
 CZE_merge_the_financial_and_state_guard: "재정경비대와 국방경비대 병합"
 CZE_merge_the_financial_and_state_guard_desc: "국방경비대 창설로 인해 재정경비대는 더 이상 필요하지 않게 되었습니다. 재정경비대를 국방경비대에 통합하면 국방경비대의 전력을 신속하게 증강하는 데 도움이 될 것입니다."
 CZE_merge_the_financial_and_state_guard_tt: "§Y재정경비대 통합§! 사용 가능 \n§Y헌병대§!: 내구도: §G+5§!."
 CZE_logistics_beyond_the_sudetes: "수데티 너머에서의 군수 체계"
 CZE_logistics_beyond_the_sudetes_desc: "수데티산맥 이외의 지역에서 전투 작전을 수행하려면 장거리 군수를 수행하는 방법을 익혀야 합니다. 국내에서 작전을 수행하는 것과는 매우 다릅니다."
 CZE_logistics_beyond_the_sudetes_tt: "§Y개선된 보급 거점§! 사용 가능\n§Y군수중대§!: 보급품 사용량: §G-10%§!"
 CZE_expand_the_river_monitor_fleet: "하천 감시 함대 확충"
 CZE_expand_the_river_monitor_fleet_desc: "우리의 하천 감시 함대는 유럽에서 손꼽히는 규모를 갖고 있으며, 우리 육군의 내륙 지역 방어에 기여하고 있습니다. 이 함대를 확충하면 임무 수행 능력이 크게 향상될 것입니다."
 CZE_the_tvp_project: "TVP 프로젝트"
 CZE_the_tvp_project_desc: "우리 육군은 국산 전차 설계 개발을 위한 범용전차(TVP) 계획을 제안했습니다. 전차 생산에 풍부한 경험을 가진 일부 제조사들이 이 프로젝트에 관심을 보였습니다."
 CZE_expand_the_land_department_of_vtu: "VTÚ의 토지 부서 확장"
 CZE_expand_the_land_department_of_vtu_desc: "군사기술연구소(VTÚ)의 토지 부서를 확장하면 그들은 우리의 미래 장비에 대한 연구에 힘을 더해줄 장비와 시험장을 추가로 확보할 수 있을 것입니다."
 CZE_department_two_expansion: "제2부서"
 CZE_department_two_expansion_desc: "우리의 정보 부서인 제2부서는 적국의 간첩으로부터 우리를 더 잘 보호하기 위해 더 많은 자원이 필요합니다. 이는 기관 내 특정 부서의 확장으로 이어질 수도 있습니다"
 CZE_military_intelligence: "군사정보부"
 CZE_military_intelligence_desc: "군사정보는 정보기관에서 매우 중요한 분야입니다. 이 분야에 더 많은 자원을 투입하면 상당한 이점을 얻을 수 있을 것입니다."
 CZE_air_intelligence: "공군 정보부"
 CZE_air_intelligence_desc: "적 공군의 항공기 수를 파악하는 것은 공중전에서 승리하기 위해 매우 중요합니다. 적의 공중 전력에 대한 정확한 정보는 해당 지역에서 적과 교전할 때 핵심적인 역할을 합니다."
 CZE_within_the_eagles_nest: "독수리 둥지 내부에"
 CZE_within_the_eagles_nest_desc: "우리 국경 인근에 정보원과 파괴 공작원들을 대거 확보하는 것은 우리 군에 큰 이점이 될 것입니다. 제2부서의 지원을 받는다면, 이 지역에서 우리의 첩보망은 더욱 폭넓게 확장될 수 있습니다."
 CZE_restart_naval_gun_production: "함포 생산 재개"
 CZE_restart_naval_gun_production_desc: "슈코다는 한때 오스트리아-헝가리 제국 내에서 가장 큰 함포 설계사이자 생산 업체였습니다. 생산을 재개하면 국내 해군 제조업을 부활시킬 기회가 생길 것입니다."
 CZE_restart_naval_gun_production_tt: "§Y슈코다 우선§! 해군 중점이 §Y활성화§!됩니다."
 CZE_reform_the_naval_detachment: "해군 분견대 재창설"
 CZE_reform_the_naval_detachment_desc: "해군 분견대는 최근 육군에 통합되는 편이 더 적절하다고 판단되어 해체되었습니다. 그러나 최근 사태로 인해, 이제는 이를 재편성할 필요가 생겼습니다."
 CZE_build_2_dockyards_when_we_have_coast_tt: "지배 중인 무작위 해안 §Y주§!에 §Y해군 조선소§! §G2§!개를 즉시 건설합니다."
 CZE_skoda_naval_yards: "슈코다 해군 조선소"
 CZE_skoda_naval_yards_desc: "이제 다시 바다에 접근할 수 있게 되었으니, 우리 국경 내에 여전히 남아 있는 전문 인력을 활용하여 오스트리아-헝가리 제국 시대의 해군 산업을 재건할 수 있습니다. 국내 조선소를 가동하는 것이 최우선 과제입니다."
 CZE_build_3_dockyards_when_we_have_coast_tt: "지배 중인 무작위 해안 §Y주§!에 §Y해군 조선소§! §G3§!개를 즉시 건설합니다."
 CZE_legacy_of_the_kriegsmarine: "크릭스마리네의 유산"
 CZE_legacy_of_the_kriegsmarine_desc: "우리는 얼마 전에도 대형 전함 건조에 기여했으므로, 전함 건조 능력은 확실히 보유하고 있습니다. 오스트리아-헝가리의 크릭스마리네를 구축하는 데 도움이 됐던 공장들의 유산을 이어받은 셈입니다."
 CZE_build_off_old_ganz_danubius_designs: "간츠 다누비우스의 옛 설계 구현"
 CZE_build_off_old_ganz_danubius_designs_desc: "간츠 다누비우스의 설계를 다시 꺼내면 새로운 순양함급 함선 건조에 도움이 될 겁니다. 다행히 그의 설계를 잘 아는 사람들이 아직 우리 국경 안에 남아 있습니다."
 CZE_modernize_trieste_designs: "트리에스테 설계 현대화"
 CZE_modernize_trieste_designs_desc: "소형 전함에 오스트리아-헝가리 해군의 오래된 설계를 활용하면 이러한 함급의 함선을 건조하는 방법에 대한 더 나은 통찰을 얻을 수 있습니다."
 CZE_leverage_gunboat_experience: "포함 경험 활용"
 CZE_leverage_gunboat_experience_desc: "우리는 포함을 설계해 본 경험을 구축함 제작에 활용할 수 있습니다. 현재 우리가 보유한 전문 지식을 기반으로 설계 과정을 가속할 수 있을 것입니다."
 CZE_revive_kraljevica_designs: "크랄예비카 설계 부활"
 CZE_revive_kraljevica_designs_desc: "포함에 대한 우리의 지식을 활용하고, 과거의 크랄예비카 설계를 연구함으로써, 우리는 이 구축함 함급을 우리 국가를 위해 되살릴 수 있습니다."
 CZE_wolfs_of_bohemia: "보헤미아의 늑대들"
 CZE_wolfs_of_bohemia_desc: "우리 국경 안에는 아직 잠수함에 대한 경험을 보유한 인재들이 있습니다. 이를 고려하면 우리만의 늑대 떼를 만드는 것도 그리 어렵지 않을 것입니다."
 CZE_raider_lineage: "습격대 혈통"
 CZE_raider_lineage_desc: "우리는 오스트리아-헝가리 해군에서 복무했던 전직 장교들의 습격대 혈통을 이어받았습니다. 이 혈통에서 오는 경험을 활용해야 합니다."
 CZE_a_modern_navy: "현대적인 해군"
 CZE_a_modern_navy_desc: "우리 해군 기술을 진보시킨 지금, 우리는 마침내 현대적이고 유능한 해군을 갖추었다고 말할 수 있습니다."
 CZE_build_1_dockyards_when_we_have_coast_tt: "지배 중인 무작위 해안 §Y주§!에 §Y해군 조선소§! §G1§!개를 즉시 건설합니다."
 CZE_naval_aviation: "해군항공대"
 CZE_naval_aviation_desc: "항공모함과 함재기들이 해전의 미래를 쥐고 있는 것으로 보입니다. 우리는 해군 전투의 이 새로운 분야에 경쟁력을 갖추는 데 시간을 투자해야 합니다."
 CZE_across_the_atlantic: "대서양 횡단"
 CZE_across_the_atlantic_desc: "해군이 위력을 발휘하려면 대양을 건널 수 있어야 합니다. 우리 해군은 장거리 이동 능력을 갖춰야 합니다."
 CZE_joint_equipment_designs: "합동 장비 설계"
 CZE_joint_equipment_designs_desc: "[ROOT.GetNameDef](와)과 [GER.GetNameDef](은)는 모두 전차 및 항공기 설계 분야의 선두 주자이며 각자의 전문 분야가 있으므로, 서로 정보를 공유하여 각자의 강점에 집중할 수 있도록 해야 합니다."
 CZE_negotiate_sphere_of_influence: "영향권 협상"
 CZE_negotiate_sphere_of_influence_desc: "[ROOT.GetNameDef]의 군사 자원이 [GER.GetAdjective] 동맹에 매우 중요한 가치를 지닌다는 것은 부인할 수 없는 사실입니다. 따라서 우리도 그에 상응하는 영토적 이득을 요구하는 것은 정당한 일입니다."
 CZE_set_up_polish_puppet_state: "[POL.GetAdjective] 남부 괴뢰국 수립"
 CZE_set_up_polish_puppet_state_desc: "[GER.GetNameDef](이)가 폴란드에 괴뢰국을 세우는 데 관심이 있으므로, 우리도 같은 조치를 취하는 것을 검토해 보아야 합니다."
 CZE_usurp_the_mantle: "계승권 찬탈"
 CZE_usurp_the_mantle_desc: "우리 왕국이 발트해에서 아드리아해까지 뻗어 있고, 역사적 지역 강국인 오스트리아의 영토를 다스리게 된 지금, 우리는 신성 로마 제국의 정당한 계승자임을 선포할 수 있습니다."
 CZE_austro_hungary_puppets: "중점 요구 조건의 대상이 된 모든 §Y종속국§!"
 CZE_decrease_autonomy_tier: "모든 §Y$autonomy_dominion$§! 또는 §Y$autonomy_puppet$§! 종속국은 자치도 수준이 한 레벨 감소합니다."
 #Exile Focus
 CZE_prepare_for_exile: "망명 준비"
 CZE_prepare_for_exile_desc: "국가는 우리 정치 지도자들이 국외로 탈출하여 망명정부를 수립하도록 은밀히 지원해야 합니다."
 CZE_joins_government_in_exile_tt: "§Y망명정부§! 가입"
 CZE_infiltrate_collaborationist_organizations: "협력주의 조직에 잠입"
 CZE_administrative_chaos_tt: "§Y$CZE_enter_exile$§!(이)가 완료되면 §Y국가판무관부§!에 적용되는 효과:"
 CZE_infiltrate_collaborationist_organizations_desc: "망명정부에 충성하는 [ROOT.GetAdjective] 사람들을 협력주의 조직을 이끄는 자리에 앉힌다는 건 이상하게 들릴지 모르지만, 그들의 활동을 약화하고 정보를 얻는 완벽한 방법입니다."
 CZE_enter_exile: "망명하기"
 CZE_enter_exile_desc: "잠재적인 동맹국들이 마침내 [GER.GetAdjective] 악어와 싸우고 있으므로, 우리 정부는 주권을 되찾기 위해 준비하고 싸울 수 있습니다."
 CZE_refused_exile: "[ROOT.GetName]의 망명을 거부함"
 CZE_contact_the_czech_and_slovak_legion: "체코 및 슬로바키아 군단과 접촉"
 CZE_contact_the_czech_and_slovak_legion_desc: "용감한 [ROOT.GetAdjective]인들이 [POL.GetNameDef](와)과 [FRA.GetNameDef](으)로 탈출했으며, 이들은 [CZE.GetName]의 해방을 위한 싸움을 계속하려 합니다. 우리는 이 세력과 접촉하고 협력해야 합니다."
 CZE_skoda_priority_shortcut_finder: "슈코다 우선"
 CZE_skoda_priority_shortcut_finder_desc: "이것은 슈코다의 현재 우선순위입니다."
 #Decision unlock TT
 CZE_decision_unlock: "결정 잠금 해제: "
 CZE_demand_regime_change_tt: "$CZE_decision_unlock$§Y국가 내에서 정권 교체 요구§!"
 CZE_propose_unification_tt: "$CZE_decision_unlock$§Y체코슬로바키아 연합에 국가를 초청§!"
 CZE_integrate_nation_tt: "$CZE_decision_unlock$§Y국가 통합§!"
 ###############################################
 #Germany
 GER_integrate_czech_manufacturers: "체코 제조사 통합"
 GER_integrate_czech_manufacturers_desc: "보헤미아의 산업은 우리 경제에 막대한 제조 역량과 산업 자원을 제공하는 보고입니다. 보헤미아 제조사들이 추가하게 될 산업 역량은 우리 군수 산업을 크게 성장시킬 것입니다. 이들을 우리 생산 라인에 통합하는 것은 매우 합리적인 선택입니다."
 GER_integrate_czech_manufacturers_no_aat_tt: "§Y설계사§!로 §G사용 가능§!:\n§Y$CZE_skoda_works_german_organization$§!, §Y$CZE_bohmische_mahrische_maschinenfabrik_ag_german_organization$§!, §Y$CZE_zlin_aircraft_organization$§!, §Y$CZE_ceska_zbrojovka_uhersky_brod_organization$§!"
 CZE_unlocks_sokolov_raid_pfot_tt: "§Y팔크노프§!를 대상으로 하는 §Y공수부대 습격§!을 잠금 해제합니다."
