 CZE_anglo_czechoslovak_bank: "앵글로 체코슬로바키아와 프라하 신용은행"
 CZE_anglo_czechoslovak_bank_desc: "1930년 프라하에 있는 세 개의 다른 은행이 합병하여 탄생했습니다. 현재는 국가에서 두 번째로 큰 은행입니다."
 CZE_praga_aviation: "$CZE_praga_aviation_organization$"
 #Dynamic Modifiers National Spritits
 CZE_ceskoslovenska_armada_dynamic_modifier: "체코슬로바키아군"
 CZE_ceskoslovenska_armada_dynamic_modifier_desc: "이 육군은 체코슬로바키아 군단의 베테랑과 오스트리아-헝가리 체코인 부대의 남은 인원들로 창설되었습니다. 두 부대의 유산은 여전히 육군의 운영 방식에 영향을 미치고 있습니다."
 CZE_ceskoslovenske_letectvo_dynamic_modifier: "체코슬로바키아 공군"
 CZE_ceskoslovenske_letectvo_dynamic_modifier_desc: "비행기는 준비가 안 되어 있을 때도 있지만, 우리 조종사들은 항상 준비되어 있습니다. 공중 위협은 어느 방향에서든 발생할 수 있으므로, 우리는 하늘을 우리의 바다로 만들어야 합니다. 조종사 한 명마다 세 명 분의 가치가 있는 것처럼 대우해야 합니다."
 CZE_a_divided_nation_dynamic_modifier: "국가 분열"
 CZE_a_divided_nation_dynamic_modifier_desc: "[CZE.GetAdjective](은)는 유럽 중부의 유일한 다원주의 국가로서 국경 안의 모두를 보호해 왔습니다. 그러나 대공황은 이러한 상황을 바꾸어 놓았습니다. 경제적 어려움으로 인해 국내에 여러 운동이 일어나 정부에 대한 반감을 고조시키고 있으며, 이러한 반감은 이제 국가를 심각하게 분열시키고 있습니다."
 CZE_skoda_works_dynamic_modifier: "슈코다"
 CZE_skoda_works_dynamic_modifier_desc: "슈코다 기업은 우리 중공업의 모든 분야에서 생산, 건설, 투자를 담당하고 있으며, 그 영향력은 국경을 초월합니다."
 CZE_ceskoslovenske_alecne_lodstvo_dynamic_modifier: "체코슬로바키아 해군"
 #Dynamic State Modifiers
 CZE_sudetenland_german_state_modifier: "주데텐란트 분리주의"
 CZE_sudetenland_german_state_modifier_desc: "최근 주데텐란트의 산업계는 경제적 어려움을 겪고 있습니다. 이로 인해 지역 주민들은 [ROOT.getname] 정부를 비난하고 있습니다."
 CZE_tesinko_polish_state_modifier: "폴란드 분리주의"
 CZE_czech_state_modifier: "숙련된 체코인 노동자 부족"
 CZE_czech_state_modifier_desc: "20세기의 급속한 경제 발전은 농업인이 대다수인 체코 국민들에게 큰 부담을 안겨주었습니다. 숙련되고 자격을 갖춘 체코인 노동자를 충원하는 것도 어려운 상황입니다. 젊은 체코 시민들이 현대 경제의 변화하는 요구에 부응할 수 있도록 준비시키는 노력이 반드시 필요합니다."
 CZE_slovakia_state_modifier: "불균등한 경제 발전"
