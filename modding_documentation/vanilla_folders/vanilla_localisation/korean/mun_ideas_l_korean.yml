 CZE_first_sudetenland_fortification_program: "제1차 주데텐란트 요새화 계획"
 CZE_first_sudetenland_fortification_program_GD: "제1차 주데텐란트 요새화 계획"
 CZE_sudetenland_paramilitaries_modifier: "주데텐란트 준군사조직 활동"
 CZE_sudetenland_paramilitaries_modifier_desc: "주데텐란트의 파르티잔과 준군사조직들이 현재 이 지역에서 우리 군대를 약화시키고 있습니다. 그들은 적극적으로 우리 군대를 공격하며 적과 협력하고 있습니다."
 CZE_nationalist_protests: "민족주의자의 항의"
 CZE_rut_comprise_agreement_modifier: "카르파티아 우크라이나 자치 협정" #Can't use [RUT.Getname] in the context this is used in
 CZE_improve_cross_border_rail_connections_modifier: "국경 간 철도 연결 개선"
 #National Spirits
 CZE_taticek_of_czechoslovakia: "타티체크 마사리크"
 CZE_taticek_of_czechoslovakia_desc: "토마시 마사리크는 흔히 '타티체크 마사리크'라 불리며, 이는 '아빠' 또는 '아버지', 즉 국부를 의미합니다. 그는 건국 이래 체코슬로바키아 국가의 굳건한 기반이 되어 왔습니다. 연정을 구성하는 일이 불가능해 보이고 정치적 교착이 도저히 풀 수 없을 만큼 깊어졌을 때도, 마사리크는 매번 정치적 기적을 일으켜 체코슬로바키아를 강화하고 성장시키는 데 힘을 보탰습니다. 은퇴한 뒤에도, 정치 지도부는 그의 생각과 제안을 조언이라기보다 사실상의 명령처럼 받아들이고 있습니다."
 CZE_industrialists_veto: "산업가의 거부"
 CZE_industrialists_veto_desc: "산업계는 [CZE.GetNameDef]의 주요 재벌 집단 다수를 이끌고 있는 만큼, 국가 정치에 막대한 영향력을 행사하고 있습니다. 경제 정책을 논할 때 그들의 우려를 무시할 수는 없으며, 그들은 경제 동원에 격렬히 반대할 것입니다."
 CZE_agrarian_politics_1: "농업주의 정치"
 CZE_agrarian_politics_1_desc: "우리 국가의 산업적 특성에도 불구하고, 농장주와 농촌 농민들은 여러 정당에서 상당한 정치적 영향력을 행사하고 있습니다. 이들의 정서는 경제 정책 결정에 영향을 미치는 일이 많으며, 정치적으로 끊임없이 산업 발전을 가로막고 있습니다."
 CZE_directorate_of_fortification_works_no_gd_idea: "요새화 공사국"
 CZE_directorate_of_fortification_works_no_gd_idea_desc: "ROP라는 약칭으로 더 잘 알려져 있는 $CZE_directorate_of_fortification_works_no_gd_idea$(은)는 국가의 요새화 작업을 감독하는 관리 기관입니다."
 CZE_czech_corporatism: "체코 협동조합주의"
 CZE_broken_shield: "깨어진 방패"
 CZE_redirected_fortification_council_funds: "용도 변경된 요새화 위원회 자금"
 CZE_army_readiness_1: "준비되지 않은 육군"
 CZE_army_readiness_1_desc: "육군의 준비 태세는 단순히 병력과 장비만으로 결정되는 것이 아닙니다. 위협에 직면했을 때, 준비 상태에 대한 자신감과 국가의 정치 및 산업 지도자들의 지원이 매우 중요합니다. 전투 수단을 갖추었다고 반드시 효과적으로 전투할 수 있는 것은 아닙니다."
 CZE_army_readiness_3: "준비된 육군"
 CZE_army_readiness_3_desc: "육군의 준비 태세는 단순히 병력과 장비만으로 결정되는 것이 아닙니다. 위협에 직면했을 때, 준비 상태에 대한 자신감과 국가의 정치 및 산업 지도자들의 지원이 매우 중요합니다. 전투 수단을 갖추었다고 반드시 효과적으로 전투할 수 있는 것은 아닙니다."
 CZE_ready_for_anything_idea: "모든 경우에 대비"
 CZE_sudeten_german_quandary: "주데텐란트의 난제"
 CZE_sudeten_german_quandary_desc: "주데텐란트에 사는 사람들 대부분은 기존 정부 아래에서 더 큰 자치만을 바라고 있지만, 독일 국가가 이 지역의 어느 일부라도 합병하려 한다면 다수의 주데텐 정당과 그 지지층은 곧바로 제5열이 될 수도 있습니다."
 CZE_sudeten_german_quandary_modifier_tt: "§Y지속 효과§!:\n우리와 국경을 접하고 있는 §Y[AUS.GetFlag][AUS.GetNonIdeologyName]§!, §Y[GER.GetFlag][GER.GetNonIdeologyName]§! 또는 기타 [BAY.GetFlag]§Y독일 국가§!가 우리에 대해 §R전쟁 명분§!을 정당화 또는 획득했으며 §Y[69.GetName]§!, §Y[972.GetName]§! 또는 §Y[74.GetName]§!(을)를 우리가 지배 중인 경우:\n - (§Y통제 중인 주데텐란트의 주 전체§!):\n    다음을 부여하는 §Y$CZE_sudetenland_paramilitaries_modifier$§! 추가:\n       $MODIFIER_LOCAL_INTEL_TO_ENEMIES$: §R+10%§!\n       $MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$: §R-10.0%§!\n       $modifier_state_repair_speed_bunker_factor$: §R-10.00%§!\n\n - 이 §Y효과§!는 한 번만 발생합니다"
 CZE_sudeten_challenge: "주데텐란트의 도전"
 CZE_sudeten_challenge_desc: "주데텐란트 내에서 발생한 주데텐란트 준군사조직의 최근 활동으로 인해 국제 사회의 많은 사람이 우리를 향한 현재의 공격적인 행위가 정당하다고 믿게 되었습니다! 사실은 그 반대라고 설득하려면 시간이 걸릴 것입니다..."
 CZE_sudeten_facde: "주데텐란트의 허울"
 CZE_sudeten_facde_desc: "우리가 지역의 준군사조직을 지원하지 않았기 때문에, 세계는 [CZE.getname]에 대한 우리 행동의 명분을 이제 허울에 불과한 것으로 여기고 있습니다."
