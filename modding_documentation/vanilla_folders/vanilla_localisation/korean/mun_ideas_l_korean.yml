 CZE_semi_constitutional_constitution_desc: "[ROOT.GetNameDef]의 새로운 헌법은 국민을 대표하는 정부의 민주주의적 측면과 안정을 수호하기 위해 군주가 개입할 권리 간의 분리를 보장합니다."
