 ## Eventsn
 FRA_report.1.t: "The Poor Huddled Exiles"
 FRA_report.1.d: "The Darinstadt Bürgerwehr report another alarm further up river. In all honesty it's quite usual - minor cross-river provocations and potshots are common ritual between the Neukats and Stahlpakt. This time though, events don't follow their usual course; only one alarm is sounded at around 3:30 PM. Milizkommandeur Vogdanov identifies it as one only used within the Pawris authority. There was no exchange of fire either, there was only a single shot heard in the distance, he added that it was a shot too low caliber for the katzen megalomaniacs, implying it was a foreign gun.. \n\nA few hours later a modest civilian riverboat washes up near the Kotzeni bank, there was a perfectly fine dock on the other side of the border, but they were apparently desperate to reach us in specific. A nearby motorcycle brigade arrives first, inside the vessel there were 67 or so occupants, few roqual, few katzens, very diverse group. \n\nThe realization is quick, these are refugees escaping the northern herzlander regimes."
 FRA_report.1.a: "Lead them to their new home!"

 FRA_report.2.t: "An Uncomfortable Recollection."
 FRA_report.2.d: "Commander Vogdanov was quick to take the refugees off of the garrison's hands. There was a small scuffle with a couple of eccentric opera performers, but Vogdanov managed to wrangle them into the local customs office for impromptou registration, there he'd also conduct a few interviews. \n\nA few refugees upon hearing of the interview offer, stood silently in shellshock - after careful consideration, they rejected the interview.\n\nThose who accepted generally described their personal lives under Elwin's regime, there were many teachers, a few proffesors and a couple of artists, all of which faced harassment from Elwin's goons. It was all pretty miserable, but not unheard of.\n\nOne member of the posse caught Vogdanov's eye, a flamboyant katzen with puffy cheeks, and crisp brown fur. Upon being invited for questioning he spoke loudly and assertively from his diaphragm. \n\nHis life story was long-winded, but not boring to listen to though. Apparently he was an author and philosopher,  journalist for underground newspapers in Elwin's regime too. \n\nAs the interview concluded he gifted the commander a journal, leathery and rustic. The book contained many recollections. \n\n"You're telling me to publish this aren't you" Vogdanov asked \n\nThe author nodded yes with a small scoff "I'll include you in my novel mister commander, my form of couretsy." He left the room, starting at Vogdanov's features, probably for future description. \n\nBy the time Vogdanov realized he never got the authors's name, he was long gone."
 FRA_report.2.a: "Publish the memoirs unedited."
 FRA_report.2.b: "Cool it with the communist remarks."

 FRA_report.3.t: "The Coming Frankfurr Spring"
 FRA_report.3.d: "The current government is comprised of engineers, mathematicians, physicists, biologists and chemists; not lawyers, statesmen, philosophers, or historians. The latter group; given new freedoms after the Kaiser's departure, feel excluded. They're turing to revolutionary agitation. Shopkeepers are starting to hang up signs of protest, it's nothing violent of course, but it could quickly spiral. \n\nThe regime's exiles have also made their partisan tendencies known, the refugees got to speak at a few liberal arts universities after the memoirs were published. Their speeches have mobilized the student movement, though the oligarchy is less concerned with this affair, Hell claims they're just trying to skip out on their lectures. \n\n She instead redirects to the Darinstadt garrison hoisting flags of the old Purssen monarchy - weirdly enough she doesn't moralize about it, she simply mentions it. Though some observers noticed that the secret police chief nodded with her statement.\n\nWith the coming diet, change is possible, reformists are already drafting up constitutional ammendments."
 FRA_report.3.a: "We'll see what we can do."

 FRA_report.4.t: "Pawn Takes Queen"
 FRA_report.4.d: "Elwin's regime has collapsed.\n\nThe memoirs have had an unexpected effect, news of their publishing actually reached Kattown; itt was testament to the success for our publishing industry, but also a lot of extra labor for our border guard. Many exiles have seen what the first escapees did, and are seeking to emulate it. Taking in refugees was not official policy, but the government is generally united in not stopping the flow, from the moralists seeking to help the disadvantaged, all the way to the moderately Kaiserist oligarchy looking to get back their ideologically adjacent scientists.\n\nThe real debate is that of the refugees' loyalties, many of these exiles are not the same abused and battered teachers and artists, in fact there are quite a few Elwinist collaboraters fleeing the warlords, a proper vetting process for these cases seems in order.\n\nIt's up to the diet, and the question is asked now, those in favour?"
 FRA_report.4.a: "Aye, out with the elwinists!"
 FRA_report.4.b: "Those cats were pretty smart..."

 FRA_report.5.t: "We're not that Democratic, Silly"
 FRA_report.5.d: "It leans in favour, this should mean Frankfurr can start vetting the refugees, but... SHE had other ideas.\n\nDr. Hell quickly vetoes it citing the academic achievements of these collaborators. There is little upset, the reaction wasn't rage, it was a somber realization.\n\nThere were no feelings of injustice, this is simply how the country works, and this is how we've lived for a while know, but after a bit of thinking, some are realizing this kinda blows."
 FRA_report.5.a: "Right..."

 FRA_industry.1.t: "The Famine Issue"
 FRA_industry.1.d: "The Purrsen territory still suffers, shortages are driving the inflation of food costs. To thrive above the rest of the Herzlands in our ivory tower, we must first at least be fed. Dr. Meowl Wu, a controversial chemical weapons division head, suggests use of experimental GMOs. According to her this would make even the most rocky Mittelpurrsen soil sprout beautiful golden grain, but the health risks are yet to be researched by anyone, but her.\n\nA more moderate solution is proposed by Chief Hydroponics Engineer of the Frankfurr Groceries Cooperative, Baum Mleminger. He suggests a systematic mechanization effort, with an expansion to urban hydroponics later down the line, hopefully drawing the peasants back into the cities, a proto-arcology of sorts. This is more tempered and the immediate effects will help, but it'll run a higher industrial demand than Meowl's solution."
 FRA_industry.1.a: "Meowl it is."
 FRA_industry.1.b: "Mleminger makes a salient point, aye in favour."

 FRA_diet.1.t: "The 4th Visionary Diet for Katzenkind"
 FRA_diet.1.d: "The bureaucrats gather, Hell Schmeodt is late as usual. Chatter is light, everything is fine. There's a bit of fear regarding the next set of appointments, there are a few issues raised that could draw the ire of Schmeodt, Pawlbert is confident he can compromise out a democratization of the appointment system, his fellow reformists show a bit of concern, but they hold the democratization line.\n\nGeneral Secretary Pawllas Wagner shuts down the conversation with a loud statement.\n\n"First issue of the Fourth Diet!" The chatter quiets down."
 FRA_diet.1.a: "The question of budget!"
 FRA_diet.1.b: "The question of internal stability!"

