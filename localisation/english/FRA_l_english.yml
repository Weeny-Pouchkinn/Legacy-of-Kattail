 ## Events
 FRA_report.1.t: "The Poor Huddled Exiles"
 FRA_report.1.d: "The Darinstadt Bürgerwehr report another alarm further up river, it's usual, minor cross-river provocations and potshots between the Neukats and Stahlpakt happen often, however this time events don't follow their usual course, only one alarm is sounded. Milizkommandeur Vogdanov identifies it as one only used within the Pawris authority. Only a single shot is heard in the distance. \n\nA few hours later a modest civilian riverboat washes up near the Kotzeni bank, on our side of the border. A nearby motorcycle brigade arrives first, inside the vessel there were 67 or so occupants, few roqual, few katzens, very diverse group. \n\nThe realization is quick, these are refugees escaping the northern herzlander regimes."
 FRA_report.1.a: "Lead them to their new home!"

 FRA_report.2.t: "An Uncomfortable Recollection."
 FRA_report.2.d: "Commander Vogdanov was quick to take the refugees off of the garrison's hands, he'd take them into the local customs office for impromptou registration, there he'd also conduct a few interviews. \n\nA few refugees upon hearing of the interview offer, stood silently, rejecting after good minute or so of shock. Those who accepted generally described their personal lives under Elwin's regime, there were many teachers, a few proffesors, all of which faced totalitarian harassment. It was all pretty miserable, but not unheard of. One member of the posse caught Vogdanov's eye, a flamboyant katzen with puffy cheeks, and crisp brown fur. Upon being invited for questioning he spoke loudly and assertively from his diaphragm. \n\nHis life story was long-winded, never got boring to listen to though. Apparently he was an author and philosopher, journalist for underground newspapers in Elwin's regime too. \n\nAs the interview concluded he gifted the commander a journal, leathery, rustic, it contained many recollections. \n\n"You're telling me to publish this aren't you" Vogdanov asked \n\nThe author nodded yes with a small scoff "I'll include you in the next detective novel mister commander, see ya." He left the room. \n\nBy the time Vogdanov realized he never got the subject's name, he was long gone."
 FRA_report.2.a: "Publish the memoirs unedited."
 FRA_report.2.b: "Cool it with the communist remarks."

 FRA_report.3.t: "The Coming Frankfurr Spring"
 FRA_report.3.d: "The current government is comprised of technical intellectuals, engineers physicists and the sort, but the liberal humanities philosopher-kings, given new freedoms under the lack of the kaiser, feel excluded. Shopkeepers are starting to hang up signs of protest, nothing violent, but it could get worse. \n\nThe exiles have also made their partisan tendencies known, the agitators got to speak at a few events after the memoirs were published, students are starting to doubt the oligarchy, after all they're kaiser era remnants just like the northern totalitarians. The Darinstadt garrison even joined the student marches in solidarity, lifting democratic republican flags to the sound of cheers. With a recent diet, there are questions of a liberalizing constitutional ammendment."
 FRA_report.3.a: "We'll see what we can do."

 FRA_report.4.t: "Pawn Takes Queen"
 FRA_report.4.d: "Elwin's regime has collapsed.\n\nThe memoirs have had an unexpected effect, news of their publishing did reach Kattown and instilled the assumption that our country now takes refugees. This was not official policy, but the government has not found cons equivalant to the pros, from the moralists seeking to help the disadvantaged, all the way to the moderately Kaiserist oligarchy looking to get back their ideologically adjacent scientists.\n\nThe real debate is that of the refugees' loyalties, many of these exiles are not the same abused and battered teachers and artists, in fact many are collaborators of the Elwinist regime.\n\nIt's up to the diet, and the question is asked now, those in favour?"
 FRA_report.4.a: "Aye, out with the elwinists!"
 FRA_report.4.b: "Those cats were pretty smart..."

 FRA_report.5.t: "We're not that Democratic, Silly"
 FRA_report.5.d: "It leans in favour, this should mean Frankfurr can start vetting the refugees, but she had other ideas. Dr. Hell quickly vetoes it citing the academic merit of these collaborators. There is little upset, the reaction wasn't rage, it was rememberance.\n\nThere were no feelings of injustice, this is how the country works, and this is how we've lived, but after a bit of thinking, some are realizing this kinda blows."
 FRA_report.5.a: "Right..."

 FRA_industry.1.t: "The Famine Issue"
 FRA_industry.1.d: "The Purrsen territory still suffers, food prices are high and the workers are skipping meals, to thrive above the rest of the Herzlands in our ivory tower, we must feed and be fed. Dr. Meowl Wu, a controversial chemical weapons division head, suggests use of experimental GMOs, this would make even the most rocky Mittelpurrsen soil sprout beautiful golden grain, but the health risks are yet to be researched effectively.\n\nA more moderate solution is proposed by Chief Hydroponics Engineer of the Frankfurr Groceries Cooperative, Baum Mleminger. He suggests a systematic mechanization effort, with an expansion to urban hydroponics later down the line, hopefully drawing the peasants back into the cities, a proto-arcology of sorts. This is more tempered and the immediate effects will help, but it won't be as one and done as Meowl's solution, it will cost us more industrial capacity."
 FRA_industry.1.a: "Meowl it is, she knows what can kill I trust her."
 FRA_industry.1.b: "Mleminger makes a salient point, aye in favour."

 FRA_diet.1.t: "The 4th Visionary Diet for Katzenkind"
 FRA_diet.1.d: "The bureaucrats gather, Hell Schmeodt is late as usual. Chatter is light, everything is fine. There's a bit of fear regarding the next set of appointments, there are a few issues raised that could draw the ire of Schmeodt, Pawlbert is confident he can compromise out a democratization of the appointment system, his fellow liberalizers show a bit of concern, but they hold the ideological line.\n\nGeneral Secretary Pawllas Wagner shuts down the conversation with a loud statement.\n\n"First issue of the Fourth Diet!" The chatter quiets down."
 FRA_diet.1.a: "The question of budget!"
 FRA_diet.1.b: "The question of internal stability!"

