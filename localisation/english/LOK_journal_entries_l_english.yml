 LOK_news.24.t:0 "Commissioning of the Delaparte" #AI-Generated Placeholder, change later!
 LOK_news.24.d:0 "In a monumental feat of engineering and military mobilization, the state of Roqualia has completed the restoration of the legendary KLT Kattenburg wonder! Under the direct command of First Speaker Benjamin Delaparte, the colossal armored blimp carrier has been commissioned as the supreme flagship 'The Delaparte'. The sight of this dreadnought rising once again into the Flusionian skies has sent shockwaves across the globe, signaling a new era of airborne hegemony." #AI-Generated Placeholder, change later!
 LOK_news.24.a:0 "A terrifying weapon in bourgeois hands." #AI-Generated Placeholder, change later!
 LOK_news.24.b:0 "Air supremacy is now ours to claim!" #AI-Generated Placeholder, change later!
 LOK_news.24.c:0 "This flagship will dominate the Flusionian skies..." #AI-Generated Placeholder, change later!
 LOK_news.24.e:0 "A magnificent piece of Flusionian engineering." #AI-Generated Placeholder, change later!
