l_english:

 lok_journal_entries_cat:0 "National Journal Entries"
 lok_journal_entries_cat_desc:0 "Our nation has its own goals to strive towards and its fair share of struggles to overcome. These various entries may be used to guide it down certain paths..."


 LOK_proposal.1.t:0 "[From.GetName] Accepts Proposal"
 LOK_proposal.1.d:0 "The government of [From.GetNameDef] has officially acceded to our recent demands. Whatever accords we have just agreed on will come into effect within the coming days."
 LOK_peaceout.1.a:0 "Splendid!"

 LOK_proposal.2.t:0 "[From.GetName] Rejects Proposal"
 LOK_proposal.2.d:0 "The government of [From.GetNameDef] has formally rejected our recent demands."
 LOK_peaceout.2.a:0 "Damn."

 lok_needs_approval:0 "§RThe recipient must approve of the demands for the bonuses to take effect.§!"

 #ACR
 ACR_RECONSTRUCTION_ZONE:0 "Severkronkiyan Reintegration Zone"
 ACR_RECONSTRUCTION_ZONE_DEF:0 "the Severkronkiyan Reintegration Zone"

 dismantle_katlantropa_dam_tooltip:0 "The §YKatlantropa Dam§! will be §Rdismantled§!. Every state within the §YLower Crabspian Sea§! strategic region will be §4flooded§! and thus become unusable!"

 #North Oshia
 WSF_civil_war_timer:0 "Impending Civil War"
 WSF_civil_war_timer_tooltip:0 "Our nation is screwed. There is nothing we can do."
  
 #Misc and global news

 LOK_news.5.t:0 "Ost-Katzpakt Reclaims Amphibia"
 LOK_news.5.d:0 "Grim news have emerged from Amphibia that, against all odds, the Ost-Katzpakt headed by the infamous Loris von Kattensbach has managed to drive off Amphibian rebels and re-consolidate Katzen power over all of Amphibia and Enotita following the complete recapture of both Kronk and Yinjite lands all the way to the Eulysses Bay.\n\nThis comes as a major shock to all international observers, who had predicted that the Kaiser's eastern holdings would soon suffer the same fate as the Herzlands. Mass-repression against former Kraksist leaders is already being undertaken everywhere as to definitively snuff out the twice-defiant Amphibian spirit, which may very well signal the final loss of Amphibia."
 LOK_news.5.a:0 "This is a tragedy!"
 LOK_news.5.b:0 "Less commies to worry about. Good."
 LOK_news.5.c:0 "Amphibia is lost once more..."
 LOK_news.5.e:0 "The Imperium lives on."
 LOK_news.5.f:0 "Suboptimal."

 
 LOK_news.6.t:0 "Kraksism Prevails in Amphibia"
 LOK_news.6.d:0 "With the surrender of the last feline strongholds in Amphibia, [ACR.GetLeader] has today proclaimed the conclusion of the Second Great Patriotic War and the 'full restoration of Amphibia to its pre-war status', finally casting off forty years of Katzen oppression.\n\nThe newly-liberated K.F.A. however faces many conundrums, such as the fate of the gargantuan Loris-built Katlantropa Dam as well as that of the millions upon millions of rowdy Herzlandish colonists still residing in Amphibia. Most Katzen commanders and governors in Amphibia have been hung in spectacular public executions, although the whereabouts of Loris von Kattensbach himself remain unknown as the Katzgovernor looks to have fled Amphibia altogether."
 LOK_news.6.a:0 "Amphibia is free once more!"
 LOK_news.6.b:0 "Hm. They're back..."
 LOK_news.6.c:0 "Less Katzens to worry about."
 LOK_news.6.e:0 "Good for them."
 LOK_news.6.f:0 "Optimal."

 LOK_news.7.t:0 "Grand Duchy of Saru Proclaimed"
 LOK_news.7.d:0 "With the complete routing of the various Free Macaquian factions, the Duchy of Saru has formally announced the coronation of Grand Duke Bonobo Sun-Saru I and the creation of the Grand Duchy of Saru, officially marking Macaquia's re-entry the world stage.\n\nIn a joint statement, the Duke and Chancelor stated that under the new government, exports from the region should go back up to the levels seen before the Crusade, although critics worry that this may also include some produce which is deemed illegal in most other nations."
 LOK_news.7.a:0 "More monarchists..."
 LOK_news.7.b:0 "Interesting."
 LOK_news.7.c:0 "May they prosper."
 LOK_news.7.e:0 "Good for them."
 LOK_news.7.f:0 "Acknowledged."

 LOK_news.8.t:0 "The Great Southern War"
 LOK_news.8.d:0 "The Southern Herzlands burns as rumours of a deal made between the Confederated Socialist States and the Imperial Regency have been all but confirmed at the onset of their simultaneous militarization of their southern borders with the Southern Feline League.\n\nAbout a year ago, partisans within the Regency have leaked details regarding the Meolowtof-Ribbawtrop Pakt where the Communards and the Regency have agreed to invade southwards into the S.F.L. at the same time in one fell swoop. It seems their plans are now coming into play. As of right now, over a million Regency troops have begun their southwards advance into the S.F.L. member state of the Federal Republic of Purrlin-Lionsburg. Possibly even more are soon to follow."
 LOK_news.8.a:0 "The southern bourgeoisie will fall!"
 LOK_news.8.b:0 "The South burns."
 LOK_news.8.c:0 "How dreadful!."
 LOK_news.8.e:0 "More war in the Herzlands..."
 LOK_news.8.f:0 "Acknowledged."

 #HERZLANDS
 KTZ_unite_east_felinea:0 "Unite Eastern Felinea"
 KTZ_unite_east_felinea_desc:0 "Less populous and less industrious owing to their mountainous homelands, eastern Katzens have always been more or less sidelined by their northern and southern brethren. Formalizing the East's union will help it stand against the rest of the Herzlands."
 KTZ_unite_east_felinea_tooltip:0 "We have subjugated another §HEast-Felinean§! state. "

 KTZ_lean_towards_monarchism:0 "Tackle the Monarchist Question"

 ELO_form_meopinrepublik:0 "Proclaim the Meopinrepublik"
 ELO_form_meopinrepublik_desc:0 "The Regents vile regime has been toppled in spite of the odds, now we stand in auralia itself! Chancellor [root.GetLeader] has decided to use this victory to proclaim ourselves as the §YMeopinrepublik§!!. Surely with this victory the SFL will let us join the democratic leagues of the Herzlands as a forefront against the northern tyrants!"
 form_meopinrepublik_required_states_tt:0 "Controls all §YAuralian§! states."
 form_meopinrepublik_coring_states_tt:0 "Gain cores on all §YAuralian§! states.\n"

 LOK_ELO.1.t:0 "Elowia Prevails Over The Regent!"
 LOK_ELO.1.desc:0 "In a shocking turn of events, the small democratic warlord state of Elowia has not only held off the vastly overwhelming armies of the tyrannical Imperial Regency, but has successfully seized Auralia! The Regents government has since dissipated, with the Regent himself disappearing hours prior to Elowian forces entering the city.\n\nWith the Regency defeated and Elowia cemented as the ruler of the Auralian region, Chancellor Jensine Brunner proclaimed that the state of Elowia was to be reformed into the \"Meopinrepublik\", presiding over the region of both Elowia and the former regency. with its choice of capital to be decided in the coming days."
 LOK_ELO.1.a:0 "The will of the people will always prevail in the face of Tyranny"
 LOK_ELO.1.b:0 "They actually won? Send them our congratulations!"
 LOK_ELO.1.b.tt:0 "§LLets hope they forget about us not helping them...§!"
 LOK_ELO.1.c:0 "Idealist Fools..."
 LOK_ELO.1.d:0 "Interesting..."

 LOK_ELO.2.t:0 "The Question Of Capital"
 LOK_ELO.2.d:0 "With our already small bureaucracy struggling given their new task of administering three times as many people as before, the question of where our new capital will be is becoming ever urgent if we ever wish to work on healing our nation.\n\nThe first option is, of course, sticking with what we have right now. With enough funding and effort over time we can make our little city into a true capital!\n\nSecondly theres the obvious notion of relocating our capital apparatus to the liberated city of Auralia! This comes with the benefit of inheriting whatever administrative infrastructure left behind by the regency, though it'll need a bit of remodelling...\n\nFinally, a few of our great minds that helped us win the war suggested the bustling little research city of Pawrdeaux for our new capital, while it will take more effort than both the previous two options there may be some merit to the suggestion with having our scientific capital be our actual one!"

 LOK_ELO.2.Elowia:0 "Elowia is where we started and it is where we'll stay!"
 LOK_ELO.2.Auralia:0 "The seat of Tyranny is no more! To Auralia!"
 LOK_ELO.2.Pawrdeaux:0 "Meopinian Science is the best in the world!"


 #NEKASTON
 NEK_seize_akiba:0 "Seize the Oilfields of Northern Akiba"
 NEK_seize_akiba_desc:0 "Our glowious ambitions demand that we seize contwol of the precious oil currently owned by the vile, vile Kusnurkites!"

 NEK_kusnurk_peace:0 "Peace out with Kusnurk"
 NEK_kusnurk_peace_desc:0 "We have achiewed our glowious goals in ouw rightweous waw! Let us consolidate our gains..."

 LOK_NEK.1.t:0 "Nekaston Offers Peace"
 LOK_NEK.1.d:0 "The Nekastonians have sent us a proposal for peace, citing their recent successes in capturing Akiba as proof of their military superiority. They wish to retain the land of Akiba, but otherwise leave the rest of Kusnurk untouched."
 LOK_NEK.1.a:0 "Very well."
 LOK_NEK.2.a:0 "Over our dead bodies!"

 #ROQUALIA
 ROQ_demand_charles_submission:0 "Demand Takicardie's Submission"
 ROQ_demand_charles_submission_desc:0 "For too long, the nearly-hermit kingdom of Takicardie has refused integration within the greater Roqualian state, their degenerate Roi always skirting around treaties and extracting compromise after compromise from our diplomats. This ends now."

 LOK_TAK.1.t:0 "Roqualia Demands Submission!"
 LOK_TAK.1.d:0 "The Roqualian government, reportedly 'fed up' with Charles' constant antics, has formally requested that we cede the northernmost half of our nation to the Federation, all while officially submitting to their government as subjects rather than allies. Charles would be allowed to remain in power, but his actual influence would be drastically limited."
 LOK_TAK.1.a:0 "Je n'ai pas le choix..."
 LOK_TAK.1.b:0 "QUOI?!?! JAMAIS!!!!!!"

 ROQ_conclude_reconstruction:0 "Conclude the Reconstruction"
 ROQ_conclude_reconstruction_desc:0 "Thanks to our efforts, the eastern part of Roqualia has been healed from its Kaiser-induced scars, and is finally ready to be re-integrated into our nation."
 ROQ_conclude_reconstruction_prereq:0 "Every state in the §HReconstruction Zone§! has §HInfrastructure§! at §HLevel 4§! or above."

 ROQ_proclaim_federation:0 "Proclaim the Roqualian Federation"
 ROQ_proclaim_federation_desc:0 "Roqualians are now almost entirely united within our grand nation stretching from the Triplet Bay to the Pink Sea. It is only fitting that we represent this new development."

 ROQ_prepare_the_reclamation:0 "Prepare the Réclamation"
 ROQ_prepare_the_reclamation_desc:0 "With Roqualia back on its feet after the devastation of the Kaiser's Crusade, we must now look eastwards to finally rid Solakea from the stain of Kaiserism."

 LOK_news.2.t:0 "Roqualia Launches the Réclamation"
 LOK_news.2.d:0 "Roqualia's government has announced the start of 'La Réclamation' - the reconquest of the western territories lost to the Kaiser's Crusade over a decade ago. Presented as is nothing more than the logical and inevitable conclusion of the war between Roqualia and the Kaiser, with Roqualia itself being embroiled in a tide of patriotic fervor.\n\nAs factories churn out military equipment and Soulbots are being pre-prepared to revive the war's fallen soldiers, joyous Roqualians partake in great patriotic festivities celebrating the upcoming righting of the wrongs inflicted upon their homeland. Given Roqualia's size relative to its targets, there is little doubt that the war is likely to be quite short."
 LOK_news.2.a:0 "Kaiserism will be stamped out of Solakea!"
 LOK_news.2.b:0 "An unjust aggression."
 LOK_news.2.c:0 "Concerning."
 LOK_news.2.e:0 "Intriguing."
 LOK_news.2.f:0 "Narrow-minded revenge..."

 LOK_news.3.t:0 "Roqualia Invades Eastern Solakea!"
 LOK_news.3.d:0 "Following the end of the Réclamation, Roqualian forces had simply dug in next to Roqualia's new borders as to ward off potential assaults, with no plans of attack. Until everything changed. A tide of patriotism swept across the nation, and a referendum was held across Roqualia, asking citizens whether or not eastern Solakea should be attacked in order to secure Roqualia's eastern borders. Ninety-nine percent of eligible voters voted in favor.\n\nSolakea, they argued, was guilty, of defending and harboring the Kaiserists, and thus the war would not be over until they too, had fallen. Mere hours later, Dofus announced his resignation as Overseer of Roqualia, citing Roqualia had gone insane..."
 LOK_news.3.a:0 "They are going too far!"
 LOK_news.3.b:0 "An unjust aggression."
 LOK_news.3.c:0 "High alert!"
 LOK_news.3.e:0 "Will they ever stop?"
 LOK_news.3.f:0 "Self-destructive."

 LOK_news.4.t:0 "Delaparte Launches 'Coeur de la Challemagne'"
 LOK_news.4.d:0 "When Roqualia swept over most of Solakea under the leadership of Benjamin Delaparte, many had hoped that, eventually, the madman would be satisfied and cease his wanton conquests.\n\nBut today, all such hopes have been shattered by Delaparte's insane declaration of a 'Crusade at the Heart of Kaiserism' consisting of a declaration of war against every Herzland nation.\n\nBacked by most of Solakea's industry, millions of Roqualian troops thus prepare to cross the Solakatzen Channel as part of perhaps the most devastating conflict since the Kaiser's Crusade...\n\nOne thing is for certain - Flusion will never be the same."
 LOK_news.4.a:0 "Insanity!"
 LOK_news.4.b:0 "Insanity!"
 LOK_news.4.c:0 "He will destroy us all!"
 LOK_news.4.e:0 "His madness knows no bounds!"
 LOK_news.4.f:0 "HIGH ALERT!"

 ROQ_end_the_autonomy:0 "Enact the Décret de Dispersion Challemande"
 ROQ_end_the_autonomy_desc:0 "Concentrating a large chunk of our Katzen population within the Roquatzen Autonomy is nothing short of suicidal in the short-term. Maxime Parlaux has drafted up a vast plan to entice Katzens to disperse throughout Roqualia, so that their overall influence may be diluted. Their military expertise will surely prove to be invaluable in our coming conflicts..."

 change_state_majority_species_tooltip:0 "Majority species becomes [This.GetSpeciesTemp]."
 
 change_state_minority_species_tooltip:0 "Minority species becomes [This.GetSpeciesTemp]."

 #QUEPLER
 KEP_finalize_plavetan_colonization:0 "Finalize Plavetan Colonization"
 KEP_finalize_plavetan_colonization_desc:0 "The Plavetan Communities remain an open wound upon our eastern frontier: a stubborn remnant of the settlement project that has resisted every surveyor, commissioner, and patrol sent from Nouvelle Yorke. The cabinet now proposes that the colonial question be settled by force, quickly and permanently."
 KEP_finalize_plavetan_colonization_tt:0 "§Y[ROOT.GetNameDefCap]§! declares war on §Y[PLA.GetNameDef]§! and must defeat it within §Y90 days§!."

 KEP_conquer_plaveta_mission:0 "The Ninety-Day War"
 KEP_conquer_plaveta_mission_desc:0 "The government promised a short campaign whose conclusion would vindicate decades of colonial policy. Every day that Plaveta remains unconquered makes that promise harder to defend and the officers gathered in the east more willing to seek their own remedy."
 KEP_conquer_plaveta_mission_success_tt:0 "§GPlaveta is defeated in time.§!\nUnlocks the repeatable §YIntegrate Plaveta§! decision."
 KEP_conquer_plaveta_mission_failure_tt:0 "§RThe campaign fails.§!\nQuepler signs an armistice with Plaveta before war resumes between §YPlaveta§!, the current §YQueplerian government§!, and a new §Rfascist splinter state§! in eastern Quepler."

 PLA_seize_queplerian_land_mission:0 "Forty-Five Days to the Frontier"
 PLA_seize_queplerian_land_mission_desc:0 "Quepler's fracture has opened roads that no Plavetan army could have crossed weeks ago. The Communities have only a narrow window in which to occupy defensible ground before exhaustion and foreign pressure compel every belligerent to accept a new frontier."
 PLA_seize_queplerian_land_mission_tt:0 "After §Y45 days§!, §Y[ROOT.GetNameDefCap]§! makes peace with every Queplerian faction, gains ownership of every §YQueplerian core state§! it controls, and gains §Ycores§! on those states."

 KEP_remilitarize:0 "Remilitarize"
 KEP_remilitarize_desc:0 "Civil war exposed the weakness of a state that entrusted its security to commercial abundance and a narrow professional corps. Foundries must be raised, veterans recalled, and the Grand Lake Patrol expanded into the mailed fist of the new order."
 KEP_remilitarize_tt:0 "After §Y180 days§!:\nGain §G10 Military Factories§!.\nDeploy §G12§! divisions using the §YPatrouille du Grand Lac§! template."

 KEP_reconquer_plaveta:0 "Return to Plaveta"
 KEP_reconquer_plaveta_desc:0 "Plaveta profited from our moment of weakness and mistook necessity for surrender. The eastern marches will not be secure while the Communities remain independent, and the humiliation of the first campaign can only be erased on the battlefield."
 KEP_reconquer_plaveta_tt:0 "After §Y15 days§!:\nDeclare war on §Y[PLA.GetNameDef]§!.\nAdd every state owned by §Y[PLA.GetNameDef]§! to our §Ycompliance coring array§!."

 KEP_invade_solstian_federation:0 "Break the Solstian Federation"
 KEP_invade_solstian_federation_desc:0 "Beyond Plaveta lies a federation too divided to govern its frontier and too proud to accept Queplerian protection. Its councils offer sanctuary to every exile and smuggler driven from our east. Order must be carried across the border."
 KEP_invade_solstian_federation_tt:0 "After §Y15 days§!:\nDeclare war on §Y[SOF.GetNameDef]§!.\nAdd every state owned by §Y[SOF.GetNameDef]§! to our §Ycompliance coring array§!."

 KEP_invade_vasmar:0 "Subdue Vasmar"
 KEP_invade_vasmar_desc:0 "Vasmar's forests and waters form the final barrier to a frontier shaped entirely by Queplerian power. Its union has watched each preceding campaign and prepared for the inevitable; delay now would merely grant it time to fortify."
 KEP_invade_vasmar_tt:0 "After §Y15 days§!:\nDeclare war on §Y[VAS.GetNameDef]§!.\nAdd every state owned by §Y[VAS.GetNameDef]§! to our §Ycompliance coring array§!."

 KEP_integrate_plaveta:0 "Integrate Plaveta"
 KEP_integrate_plaveta_desc:0 "Military occupation has silenced the Communities, but it has not made Plaveta Queplerian. Administrators, settlers, and local intermediaries will attempt to replace emergency rule with permanent institutions. Success would close the colonial question; failure may reopen the war."
 KEP_integrate_plaveta_tt:0 "After §Y180 days§!:\n§G50% chance§! to gain cores on §YSilal§!, §YPlavevivorea§!, and §YHideash§!. All three states gain a §YSolakean minority§! and §YMeridional Roqualian culture§!.\n§R50% chance§! that two of the three states revolt as §Y[PLA.GetNameDef]§!, restarting the §Y90-day campaign timer§!.\nThis decision can be repeated until Plaveta is pacified."

 LOK_KEP.1.t:0 "Quepler Moves to Finalize Plavetan Colonization"
 LOK_KEP.1.d:0 "Before dawn, Queplerian armor crossed into the Plavetan Communities beneath a canopy of aircraft. Nouvelle Yorke describes the offensive as the final stage of a colonial project begun generations ago and insists that organized resistance will collapse within ninety days.\n\nPlavetan assemblies have instead called every settlement to arms. Roads have been cut, stores dispersed, and volunteers directed toward the border. What Quepler presents as an administrative conclusion has begun as an open war of conquest."
 LOK_KEP.1.a:0 "The ninety days begin."

 LOK_KEP.2.t:0 "Quepler Conquers Plaveta"
 LOK_KEP.2.d:0 "The last organized forces of the Plavetan Communities have surrendered before the deadline proclaimed in Nouvelle Yorke. Queplerian columns now occupy Silal, Plavevivorea, and Hideash, while colonial officials follow close behind with censuses, decrees, and plans for permanent administration.\n\nVictory has vindicated the government for the moment. Yet scattered resistance and the refusal of many local councils to recognize Queplerian authority suggest that conquest may prove easier than integration."
 LOK_KEP.2.a:0 "The campaign is over; the settlement is not."

 LOK_KEP.3.t:0 "Quepler Fractures After the Plavetan Debacle"
 LOK_KEP.3.d:0 "Quepler's promised ninety-day conquest of Plaveta has ended in failure. After an abrupt armistice, eastern officers accused Nouvelle Yorke of betraying the army and proclaimed a new fascist government from Saumurie. Loyalist and rebel formations are already fighting across the industrial districts.\n\nPlaveta has treated the collapse not as peace but as an opportunity. Its forces have renewed their advance against both Queplerian claimants, turning the frontier war into a three-sided struggle."
 LOK_KEP.3.a:0 "The colonial war has come home."

 LOK_KEP.4.t:0 "[ROOT.GetNameDefCap] Wins the Queplerian Civil War"
 LOK_KEP.4.d:0 "The rival government in Quepler has ceased to exist. Its remaining formations have surrendered, scattered, or entered the service of [ROOT.GetNameDef], leaving [ROOT.GetLeader] as the sole authority claiming the country.\n\nThe fighting has scarred the eastern districts and deepened the loss of territory to Plaveta, but the victor now possesses the machinery of state and the surviving Queplerian arsenal. Attention is already turning from reunion to revenge."
 LOK_KEP.4.a:0 "One Quepler remains."

 LOK_KEP.5.t:0 "Quepler Returns to Plaveta"
 LOK_KEP.5.d:0 "Columns of the remilitarized Queplerian army have crossed the Plavetan frontier, opening a new campaign against the Communities. The government calls the offensive a war of restitution and has promised that no armistice will interrupt the work left unfinished by its predecessors.\n\nPlavetan councils, long expecting the attack, have ordered another general mobilization. The old colonial conflict has resumed with a more radical Quepler and far greater forces."
 LOK_KEP.5.a:0 "The old war begins anew."

 LOK_KEP.6.t:0 "Quepler Invades the Solstian Federation"
 LOK_KEP.6.d:0 "Queplerian forces have attacked the Solstian Federation along a broad front. In a proclamation issued from the capital, [ROOT.GetLeader] accused the Federation of sheltering enemies of the new order and declared its divided councils incapable of securing the region.\n\nSolstian authorities have rejected the charges as a pretext for expansion. Mobilization orders have gone out across the federation as Queplerian patrol divisions press beyond the frontier."
 LOK_KEP.6.a:0 "The frontier moves again."

 LOK_KEP.7.t:0 "Quepler Declares War on Vasmar"
 LOK_KEP.7.d:0 "The Queplerian government has announced that a state of war exists with Vasmar, describing control of its forests and waterways as essential to the security of the eastern territories. Troops assembled during the previous campaigns are already advancing toward the Union's border positions.\n\nVasmar has answered with a call for national resistance. With diplomacy exhausted and both armies prepared, another country now stands in the path of Queplerian expansion."
 LOK_KEP.7.a:0 "Vasmar faces the new order."

 LOK_KEP.8.t:0 "Plaveta Declared Pacified"
 LOK_KEP.8.d:0 "Queplerian authorities have formally ended the military administration of Plaveta. Local councils now operate under colonial statutes, transport and taxation have been joined to Queplerian systems, and the last organized underground networks are reported dismantled.\n\nIn Nouvelle Yorke, officials proclaim that Plaveta is no longer a possession but an integral part of the state. Whether enthusiasm is shared in Silal and Hideash is left unmentioned."
 LOK_KEP.8.a:0 "The colonial question is closed."

 LOK_KEP.9.t:0 "Plaveta Rises Again"
 LOK_KEP.9.d:0 "The attempted integration of Plaveta has collapsed into revolt. Coordinated attacks overwhelmed Queplerian offices in two of the three Plavetan states before local garrisons could respond, and restored community assemblies have proclaimed the rebirth of an independent Plaveta.\n\nQuepler retains one foothold in the region, but troops are again moving toward a frontier that administrators had claimed no longer existed."
 LOK_KEP.9.a:0 "Plaveta refuses to disappear."

 ROQ_begin_the_reclamation:0 "Launch the Réclamation"
 ROQ_begin_the_reclamation_desc:0 "The time has come to reclaim what is rightfully ours! The Kaiserist usurpers shall be driven out of Solakea!"

 ROQ_reclamation_peace:0 "Sue for Peace"
 ROQ_reclamation_peace_desc:0 "Disaster! The Réclamation is a disaster! With the enemy on the gates of Lutécie, we must recognize our defeat and cut our losses. This will not end well..."

 ROQ_delaparte_coup:0 "Promote Benjamin Delaparte to First Speaker"
 ROQ_delaparte_coup_desc:0 "The war in eastern Solakea has been going... amazingly well! With the Kaiserists surrendering left and right to our forces and our war support as high as ever, bold general Benjamin Delaparte has been able to maneuver his way to the top of Roqualia's government. Now, all it'll take is a little meeting with Dofus on the matter..."

 ROQ_natural_borders_of_roqualia:0 "Establish the Natural Borders of Roqualia"
 ROQ_natural_borders_of_roqualia_desc:0 "Despite our victories, the Kaiserists continue to plot against us! We must ensure our easternmost border is well-protected by natural boundaries, and what better boundary than the Solakatzen Channel in the north and east, and the Ongii River in the south?"
 
 ROQ_natural_borders_of_roqualia_effect:0 "Every state between the §HSolakatzen Channel§! and the §HOngii River§! (which runs through the Goaghan lands) becomes §HClaimed§! and their $state_core_threshold_set_100$"

 ROQ_coeur_de_la_challemagne:0 "Launch Opération Coeur de la Challemagne"
 ROQ_coeur_de_la_challemagne_desc:0 "While the Kaiserists have been definitively driven out of Solakea... the fight will not be truly over until we step over the Channel and crush the source of all Kaiserism on Flusion: the Herzlands themselves. En avant!"
 ROQ_coeur_de_la_challemagne_effect:0 "We will §Rdeclare war§! against §Hevery Herzlands nation§!!"

 ROQ_departements_decision:0 "Enact Roqualification of §Y[From.GetName]§!"
 ROQ_departements_decision_desc:0 "If [From.GetName] is to become an integral part of [ROQ.GetNameDef] just like Breast or Lutécie, then we must undertake a policy of cultural assimilation bolstered by a hefty dose of Roqualian settlement thanks to the construction of brand news towns and cities."

 ROQ_proclaim_grand_federation:0 "Proclaim the Grand Roqualian Federation"
 ROQ_proclaim_grand_federation_desc:0 "With Roqualia having pushed the Kaiserist menace into the Solakatzen Channel, it is only fitting that we proclaim the Grand Roqualian Federation!"

 ROQ_proclaim_solakean_federation:0 "Proclaim the Grand Solakean Federation"
 ROQ_proclaim_solakean_federation_desc:0 "At last! All of Solakea has been liberated from Kaiserism and brought under our banner. Now, it shall finally be united as one."

 ROQ_wardec_paluushia:0 "Opération 'Gros Lapin'"
 ROQ_wardec_paluushia_desc:0 "The Paluushes are a major threat to our sovereignty if they can be allowed to modernize. Plus, their naive mindset could be easily manipulated by Kaiserists. This cannot happen!"

 ROQ_wardec_corelie:0 "Opération 'Aigle Bicéphale'"
 ROQ_wardec_corelie_desc:0 "The Corélien islands are strategically important to our control of the Solakean Sea. We must ensure these waters are entirely ours, and so they must bow."

 ROQ_wardec_vasmar:0 "Opération 'Déforestation'"
 ROQ_wardec_vasmar_desc:0 "The Vasmar Union is a slow and placid state, which could reasonably be used by the Kaiserists as a staging ground into Solakea. No more!"

 ROQ_wardec_kepler:0 "Opération 'Décolonisation'"
 ROQ_wardec_kepler_desc:0 "Kepler! Their large Katzen minority and oppression of native Lihler betray Kaiserist intent. They must be put down before their rabid feline puppeteers take over and spread Kaiserism!"

 ROQ_wardec_city:0 "Opération 'Gentrification'"
 ROQ_wardec_city_desc:0 "The Urban Republic is nothing but a hellhole briming with poverty and degeneracy. While their gigantic slums are of no interest to us, seizing their agricultural centers will ensure the food supply of our nation is secure. We must also ensure that the Kaiserists do not take advantage of their poverty to spread their vile ideology."

 ROQ_wardec_raiders:0 "Opération 'Fonte des Neiges'"
 ROQ_wardec_raiders_desc:0 "The southeast Solakean tundra is home to roving raiders and the archaic Ravko-Solstians. It would be trivial for the Kaiserists of the South Pole to sweep in. We must pre-empt this and wrangle control of the Antarctic canal."

 ROQ_wardec_phroges:0 "Opération 'Grenouille Rouge'"
 ROQ_wardec_phroges_desc:0 "Not only are the Phroges' ideology little more than red-tinted Kaiserim, but their peninsula is to become a critical part of Solakea's coastal defence against the Kaiserists. We must seize it as to safeguard our interests."

 ROQ_wardec_purrhelm:0 "Opération 'Forts de la Manche'"
 ROQ_wardec_purrhelm_desc:0 "The region of Purrhelmshaven is populated by strong, hardy Katzens who are sure to resist Kaiserism. We shall aid them in this endeavor by protecting them."

 ROQ_wardec_geight:0 "Opération 'Désindustrialisation'"
 ROQ_wardec_geight_desc:0 "Geight lords over masses of servile Katzens and Roqualians with little care for their safety and well-being. This cannot be allowed to continue - such oppression is the perfect brewing ground for Kaiserism, after all."

 ROQ_wardec_izwae_paraneon:0 "Opération 'Nettoyage'"
 ROQ_wardec_izwae_paraneon_desc:0 "The small nations of Izwae and Paraneon are little more but footnotes in Solakean history, ripe for the taking by any would-be Kaiserists. Let us put them in their place."

 ROQ_wardec_vixens:0 "Opération 'Renardise'"
 ROQ_wardec_vixens_desc:0 "The Vixenoids are a hardy bunch whose supposed hatred for Kaiserists is certain to transform into Kaiserism in the near-future. They shall be stopped."

 ROQ_wardec_alkroa:0 "Le Rattachement"
 ROQ_wardec_alkroa_desc:0 "Alkroa is nothing more than an artificial state carved out by the extraflusionian Alkroans, ripped away from Roqualia in a time of weakness. We will now take back what is ours."

 ROQ_seized_hushed_forest:0 "Seize the Hushed Forest"
 ROQ_seized_hushed_forest_desc:0 "The Hushed Forest harbors no complex civilization. We can simply move in, shoot whatever opposes us, and take it for ourselves."
 
 #MCF
 MCF_form_SSU:0 "Form the Steel Steppes Union"
 MCF_form_SSU_desc:0 "East-Solakea is sandwiched between the Roqualian power bloc to the west and the gargantuan Herzlands to the north. It is only a matter of time before either of these powers decides to expand their influence onto our region. In the meantime, imperialists powers grow rampant in our own backyard. Forging an alliance between said minor imperialists against the major powers may hit two birds with one stone by fostering cooperation between would-be conquerors all while warding off aggressors."
 LOK_MCF.1.t:0 "Cloudstriders Propose Alliance"
 LOK_MCF.1.d:0 "[MCF.GetLeader] of the [MCF.GetNameDef] has approached [ROOT.GetLeader] bearing an invitation to a new, east-solakean power bloc known as the 'Steel Steppes Union'. Promising mutual defence and military cooperation, this 'friendship alliance', as per [MCF.GetLeader]'s words, aims to make Eastern Solakea more than a 'mere speed bump' for potential expansionist powers.\n\nIt would, however, definitely curtail any of our own expansionist ambitions."
 LOK_MCF.1.a:0 "Most certainly!"
 LOK_MCF.1.b:0 "Hmm... Nah."

 LOK_MCF.2.t:0 "Formation of the Steel Steppes Union"
 LOK_MCF.2.d:0 "Under the initiative of [MCF.GetNameDef], various East-Solakean nations have gathered to form the 'Steel Steppes Union', a military alliance aimed at countering the expansionist ambitions of the 'imperialists and their ilk' onto Eastern Solakea.\n\nCuriously, the alliance itself seems to comprise mostly of imperialists and authoritarian regimes, hinting at a potential ulterior motive of political control and curtailment of internal warfare by the Cloudstriders."
 LOK_MCF.2.a:0 "Friendship? In such a desperate part of the world?"


 LOK_CLE.1.t:0 "The [CLE.GetName] Demands Frontier Territories!"
 LOK_CLE.1.d:0 "[CLE.GetLeader] of [CLE.GetNameDef] has demanded that we cede all of our border regions to them, lest they go to war and take those lands themselves! What should we do?"
 LOK_CLE.1.a:0 "We must give in..."
 LOK_CLE.1.b:0 "Go eat rocks!"

 LOK_MEW.1.t:0 "[MEW.GetName] Proposes Alliance"
 LOK_MEW.1.d:0 "Our southern communist Katzen neighbors have come with a deal: they propose we invade [IMF.GetNameDef] together, all while getting into a faction!"
 LOK_MEW.1.a:0 "Let's go!"
 LOK_MEW.1.b:0 "Too good to be true."

