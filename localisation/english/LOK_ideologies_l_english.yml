l_english:

 #Communism
 communism:0 "Communist"
 communism_noun:0 "Communism"
 communism_desc:0 "Communist Regime"

 socialism:0 "Socialist"
 socialism_noun:0 "Socialism"
 socialism_desc:0 "Socialist Regime"

 social_democratic:0 "Socialist Democracy"
 social_democratic_noun:0 "Social Democratic"
 social_democratic_desc:0 "Social Democratic Regime"

 anarchism:0 "Anarcho-Communism"
 anarchism_desc:0 "An ideology embracing the idea of communism as a stateless society, Anarchist Communism eschews the idea of a transitionary socialist state and favors a society based on voluntary associations and mutual aid."

 councilism:0 "Council Communism"
 councilism_desc:0 "This ideology emphasizes a form of stateless society centered around collective ownership of the means of production via local workers councils and a minimalist party that serves more of a propagandic role. They stand harshly against the Vanguardist and Authoritarian Socialist principles practiced by other Communist regimes."

 reformist_socialism:0 "Reformist Socialism"
 reformist_socialismdesc:0 "Striving for equality and a socialist state by reformist means, democratic socialism aims to abolish or mitigate the effects of capitalism with public mandate."

 syndicalism:0 "Syndicalism"
 syndicalism_desc:0 "Syndicalism"

 kraksism:0 "Kraksism"
 kraksism_desc:0 "Kraksism is a form of socialist ideology developed by the Amphibian Visionary Krob Kraks, often called the father of Flusionian commusism. It emphasizes concepts such as complete social and economic equality, a planned economy and the usage of democratic principles in all elements of society."

 ultravisionary_socialism:0 "Ultravisionary Socialism"
 ultravisionary_socialism_desc:0 "Ultravisionary Socialism is an utopian ideology seeking to create an egalitarian socialist society of science and technology driven by reason in which the needs of all would be satisfied thanks to technology."

 left_socialism:0 "Left Communism"
 left_socialism_desc:0 "The partyist strain of ultra-leftism. Decried for unpragmatic thinking, they seek to actively eliminate the social relation of capital via consistent internationalism and an early abolishment of commodity form. They split with the SocIntern over the nationalist rhetoric of the Kraksist revolution. \n\n They are not a unified entity, splitting over just how partyist they should be."

 communism_military_authority:0 "Communist Military Authority"
 communism_military_authority_desc:0 "While more akin to a stratocracy than an actual communist government, these authorities are typically set up by militaries of communist/socialist nations during or in the wake of military campaigns and are tasked with maintaing supply lines for the war effort and maintaining control ultimately paving the way for an eventual civilian regime of the proletariat to take over."

 socio_kaiserism_military_authority:0 "Socio-Kaiserist Military Authority"
 socio_kaiserism_military_authority_desc:0 "Setup in the wake of Socio-Kaiserist invasions, these governments pave the way for the liberation of Flusion from the forces of the old world, as the great visionary Kaiser Kattail designed."

 #Democracy
 social_liberal:0 "Social Liberal"
 social_liberal_noun:0 "Social Liberalism"
 social_liberal_desc:0 "Social Liberal Regime"

 democratic:0 "Market Liberal"
 democratic_noun:0 "Market Liberalism"
 democratic_desc:0 "Market Liberal Regime"

 social_conservative:0 "Social Conservative"
 social_conservative_noun:0 "Social Conservatism"
 social_conservative_desc:0 "Social Conservative Regime"

 conservatism:0 "Conservative Democracy"
 conservatism_desc:0 "Considering rapid changes to society to be potentially harmful, conservatism espouses tradition and moderate reforms, sometimes advocating a return to old moral values."

 liberalism:0 "Liberal Democracy"
 liberalism_desc:0 "With a long philosophical tradition of valuing personal liberty, liberalism views safeguarding these rights as the primary function of the state."

 centrism:0 "Multipartisan Democracy"
 centrism_desc:0 "Governed by a myriad of minor political parties tied together by a middle of the road centre party. Compromise, Bargaining and a lot of \"IOU\"'s are the language of this nation's Legislature."

 market_democracy:0 "Market Democracy"
 market_democracy_desc:0 "Democratic capitalism, also referred to as market democracy, is a political and economic system that integrates resource allocation by marginal productivity (synonymous with free-market capitalism), with policies of resource allocation by social entitlement."

 techno_democracy:0 "Digital Democracy"
 techno_democracy_desc:0 "Digital democracies make heavy usage of information and communication technology in political and governance processes. With every citizen being able to cast their vote near-instantaneously, it is characterized by a high number of public referendums and elections across all stratas of society."

 census_democracy:0 "Liberal Technocracy"
 census_democracy_desc:0 "A deeply flawed parliamentary system born out of compromise, the legislative consists of skilled bureaucrats and technically educated union representatives. Sufferage has been heavily liberalized, but the conditions for being elected have stayed hard to meet. The centralization under one "materialist and unideological" party has also heavily closed the overton window for the forseeable future."

 social_democracy:0 "Social Democracy"
 social_democracy_desc:0 "Social democracies, while sometimes bordering on actual Socialism, is a form of democracy that aims to achieve socialist principles under the current democratic system at a gradual pace. Social Democracies are often very progressive on modern issues, supportive and co-operative with workers and trade unions and often maintain large welfare programs for their people."

 constitutional_monarchy:0 "Constitutional Monarchy"
 constitutional_monarchy_desc:0 "Unlike the other Monarchies of the old world, Constitutional Monarchies are reined in by democratically elected governments that govern in the name of the Monarch. Most of these monarchs merely serve as a ceremonial figurehead, yet it's not unusual for them to be unifying leaders in times of great adversity at times when their elected governments cannot."

 democratic_military_authority:0 "Democratic Military Authority"
 democratic_military_authority_desc:0 "A formalized entity made to govern an area of significant turmoil, governments like these are ran by the armed forces of a parent democracy. Oversight committees, outreach programs and aid initiatives are all working away under the protection and supervision of the army to ensure a smooth transition for the civilian government soon to come."

 democratic_kaiserism_military_authority:0 "Democratic-Kaierist Military Authority"
 democratic_kaiserism_military_authority_desc:0 "Made in the wake of the latest crusade against tyranny, the armed forces of their parent democratic-kaiserist regime have begun the arduous process of pacifying the local region and preparing it for integration into the nation as per the will of the people and the vision set out by his majesty."

 #Neutrality
 neutrality:0 "Autocratic"
 neutrality_noun:0 "Autocracy"
 neutrality_desc:0 "Autocratic Regime"

 authoritarian_democratic:0 "Authoritarian Democratic"
 authoritarian_democratic_noun:0 "Authoritarian Democracy"
 authoritarian_democratic_desc:0 "Authoritarian Democratic Regime"

 reformed_kaiserism:0 "Reformed Kaiserism"
 reformed_kaiserism_desc:0 "Reformed Kaiserism aims to fix the perceived flaws of Kaiserism, generally by retaining heavy militarization but instead advocating for a defensive or protective stance instead of an offensive one. The idea of a superior culture is retained to some extent but is generally made far more inclusive."

 technocracy:0 "Technocracy"
 technocracy_desc:0 "Technocracy aims to disregard typical political hierarchies, instead aiming for an oligarchic government led by an elite of technical experts selected for their expertise in a specific field. They generally emphasize on technological research progress and efficiency, sometimes to the detriment of individual freedoms."

 magocracy:0 "Magocracy"
 magocracy_desc:0 "A Magocracy is a government or rule by those with magical powers; a hierarchy composed of wizards or mages, generally the most powerful or skilled of them."

 despotism:0 "Despotism"
 despotism_desc:0 "Despotism refers to the exercise of absolute power by a singular individual, but is different from absolutism in that the individual exerts power through force or brutal political dominance rather than according to theological or philosophical principles. Despotism is generally rather isolationist, preferring to cement its own power rather than try and expand outwards. It however suffers from instability as the ruling individual lacks long-term legitimization and can thus be rather easily toppled by a more powerful opponent."

 absolutism:0 "Absolutism"
 absolutism_desc:0 "Absolutism consists of a singular individual whose rule is legitimized by a variety of principles which can range from religion to hereditary succession. These regimes tend to be rather ossified in their beliefs and institution, but usually do not practice excessive oppression of their own population."

 benevolent_absolutism:0 "Benevolent Absolutism"
 benevolent_absolutism_desc:0 "A variant of absolutism in which the monarch remains uncontested but nonetheless exerts genuine compassion and care towards their subjects beyond the desire to ensure they do not revolt. These societies are rare and are often led by spectacularly gifted or talented individuals, although they tend to be unstable in the long term due to the inherent threat posed by the ruler either dying or suddenly having a change of mind."

 corporatocracy:0 "Corporatocracy"
 corporatocracy_desc:0 "Corporatocracy is a form of semi-authoritarian government which generally arises after one or several megacorporations completely supplants a given state. These governments thus focus very heavily on bolstering trade and international businesses all while cementing their generally undemocratic rule over their new fiefdom, but they generally still attempt to provide decent conditions and autonomy for their citizens."

 anarchy:0 "Total Anarchy"
 anarchy_desc:0 "This region lacks any form of government, bandits run wild and rampant in the streets as civilisation itself ceases to exist."

 emergency_government:0 "Emergency Government"
 emergency_government_desc:0 "Generally formed in times of national crisis, governments like these are ruled by \"Big Tent\" coalitions or military leaders seeking to guide the nation through the crisis and make it out the other end. Elections have in most case been suspended until the crisis is over."

 oligarchic_democracy:0 "Oligarchy Democracy"
 oligarchic_democracy_desc:0 "While on paper a democratic system, this government and its leader is really elected by a select few individuals that hold power, sometimes hiding in the shadows or other times publicly flaunting their power."

 lorissian_kaiserism:0 "Lorissian Kaiserism"
 lorissian_kaiserism_desc:0 "MEIN FUCKING LORISBAllENS"

 neutrality_military_authority:0 "Military Authority"
 neutrality_military_authority_desc:0 "The people of this land, by one way or another, have fallen under the boot of another nation. As such a military regime has been established to begin pacification of this lands people's so they may fit into the greater designs of the state."

 reformed_kaiserism_military_authority:0 "Reformed Kaiserist Military Authority"
 reformed_kaiserism_military_authority_desc:0 "While nowhere near as brutal as the old Katzenarmee Occupation Authorities or their twisted successors, this authority has been established to start cracking down on resistance to their occupiers rule so it may serve the designs of His Majesty and his successors."

 #Supremacism
 fascism:0 "National Mysticist"
 fascism_noun:0 "National Mysticism"
 fascism_desc:0 "National Mysticist Regime"

 nationalism:0 "Nationalism"
 nationalism_desc:0 "Nationalism typically venerates devotion to the state and uniting the people under a strong leader. It does not generally include racial policies nor is outwardly expansionist but will often nonetheless push for slight territorial gains whenever possible."

 ultranationalism:0 "Ultranationalism"
 ultranationalism_desc:0 "Going further than nationalism, ultranationalism generally promotes complete devotion to the state united under a supreme leader, in which a dominant species or ethnicity stands dominant above all others with the goal of expanding their empire across the planet."

 totalitarianism:0 "Totalitarianism"
 totalitarianism_desc:0 "A more inwards-focused branch of nationalism advocating for total and absolute control over every aspect of the state down to the private lives of every citizen, generally through oppressive means."

 kleptocracy:0 "Kleptocracy"
 kleptocracy_desc:0 "Kleptocracy refers to a type of government whose sole purpose is the generation of material wealth for itself and its leaders. This is done to the utter detriment of individual citizens who often become little more than wage-slaves living in squalid condition and exploited for every little bit of labor they can provide."

 kaiserism:0 "Kaiserism"
 kaiserism_desc:0 "Rooted in the ideas of Kaiser Kattail, Kaiserism advocates for relentless expansionism across the entire planet fueled by an unrelenting war machine. While there is generally the idea of a 'superior' culture, individuals of other species are considered able to 'become' part of this leading class through their actions and devotion to the cause."

 technoautocracy:0 "Technoautocracy"
 technoautocracy_desc:0 "Technoautocracy is a more extreme form of technocracy where concepts such as personal freedom, liberty of speech and democracy are all but abolished in favor of extreme scientific and industrial development for the supposed good of the state."

 stratocracy:0 "Stratocracy"
 stratocracy_desc:0 "Stratocracies are a form of government best described by the phrase \"A military with a state\". The government is ran by the military which has supplanted the branches of a civilian government usually seen in other countries. All its citizens are loyal soldiers within the military, dissenters often end up at a court martial, and enemies of the state are none"

 fascism_military_authority:0 "Supremacist Military Authority"
 fascism_military_authority_desc:0 "Once foolish enough to stand against their occupiers, these lands have been placed under the occupation of the state's armed forces. They may resist the occupation now, but in soon they will learn to accept their fate... Or learn the consequences"

 kaiserism_military_authority:0 "Katzenarmee Military Authority"
 kaiserism_military_authority_desc:0 "Under the boot of the Katzenarmee, the pitiful excuse of a state that stood here before has fallen to His Majesties disciples. Integration back into Imperial control shall be swift and unforgiving, for their crime of resistance is already too great to cost any more of our patience"

 #Hiveminds
 gestalt:0 "Gestalt"
 gestalt_noun:0 "Gestalt"
 gestalt_desc:0 "Gestalt Consciousness"

 unitary_gestalt:0 "Unitary Gestalt Consciousness"
 unitary_gestalt_desc:0 "This gestalt is centered around a colossal and incredibly powerful central consciousness that co-ordinates and oversees the hordes of drones employed by the consciousness. Without the central consciousness, the drones would fail to function."

 devolved_gestalt:0 "Devolved Gestalt Consciousness"
 devolved_gestalt_desc:0 "This gestalt is composed of a network of connected drones and consciousnesses that together form a unified gestalt. While still generally centered around a central primary node, the workload is distributed throughout the consciousnesses population"

 distributed_gestalt:0 "Distributed Gestalt Consciousness"
 distributed_gestalt_desc:0 "This gestalt is composed of a swarm of interconnected drones, all forming a web of connections. There exists no central consciousness, no organiser, the entire consciousness is composed of each and every member of the population. A million voices speaking as one."

 gestalt_military_authority:0 "Gestalt Occupational Authority"
 gestalt_military_authority_desc:0 "Free from the union of the Gestalt, the people of this land are now under it's watchful eye. While integration may be impossible, removing resistance to the Gestalt's rule is imperative to its operations in the region..."

 kaiserist_gestalt_military_authority:0 "Kaiserist Gestalt Occupation Authority"
 kaiserist_gestalt_military_authority_desc:0 "The gestalt has conquered this land in his Majesties name, now they must commit to the arduous task of occupying and crushing resistance to their rule, so that one day they may be integrated into Imperial hands."

# hivemind:0 "Hive Mind"
# hivemind_desc:0 "Hive Minds operate as a single organism more than as a state. The population has no free will, and act as an extension of the Hive Mind itself - much like the limbs of a body. When cut off from the Mind, these drones become comatose and eventually wither and die."

# machine:0 "Machine Intelligence"
# machine_desc:0 "Machine Intelligences are immense artificial group minds that have been networked into a single conscious entity. Most of the actual population in such a nation consists of mindless work units who perform their designated tasks without any semblance of free will. A small number of semi-autonomous agents are typically employed for more specialized tasks that benefit from some degree of independent initiative."