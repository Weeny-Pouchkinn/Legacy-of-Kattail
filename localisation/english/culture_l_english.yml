 #Diverse
 culture_1_desc:0 "
§LIn odd contrast with the surrounding Nordherzlanders, the people of Katown are surprisingly xenophilic and more open-minded to societal reform than most Herzlanders. Ninetheless, they are convinced of their great megalopolis' utter splendor and wish for the whole world to marvel at it.§!"
 culture_1_full:0 "$culture_1_name$ is part of the $culture_group_1_name$ $culture_group$.$culture_1_desc$"

 #Herzlander Cultures

 culture_2_desc:0 "
§LSudherzlanders are amongst the most xenophilic of Herzlanders. Historically involved in large-scale intercontinental trade owing to their proximity to the Solakatzen Channel and the Sun Sea, they are quick to forge ties with other nations as to bolster trade. Ultimately though, their goals remain to peacefully enrich themselves and the southern Herzlands as much as possible."
 culture_2_full:0 "$culture_2_name$ is part of the $culture_group_1_name$ $culture_group$.$culture_2_desc$"

