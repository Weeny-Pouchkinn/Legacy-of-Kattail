 culture_21_desc:0 "
§LForming the heart of Felinea, and by far the most populous Katzen culture, Nordherzlanders value merit above all else. It is upon them that the Kaiser built his Imperium, with its collapse ultimately pushing them towards internecine strife as they vie to reunite their kin's shattered heart.§!"
