 culture_40_desc:0 "§L
Formed more as a backlash to the culture of Kattail's imperium and particularly the conservatism of the North, Pawrissian culture is a more liberal version of the standard Nordherzlanders culture. While still placing a degree of value on militarism and still, to a degree, prone to cult of personalities and baseless idol worship, they do tend to take a more progressive spin on it, valuing diversity in all of its forms. One of the major points of differentiation from the standard Nordherzlanders culture is their stance on charity and welfare, along with the general sentiment of helping those less fortunate than yourself. In a sort of counter-culture to Kattail's cultural uniformization efforts, they have adopted many foreign cultural aspects, particularly Kronk and Roqualian. Following the Imperium's downfall, their culture began to truly flower, spreading beyond university and union groups into the general population of the city, cementing the culture not as just a mere counterculture but as the culture of Pawris."
 culture_40_full:0 "$culture_40_name$ is part of the $culture_group_1_name$ $culture_group$.$culture_40_desc$"

