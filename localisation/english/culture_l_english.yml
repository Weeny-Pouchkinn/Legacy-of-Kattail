 #Roqualian Cultures
 culture_group_2_desc:0 ""

 culture_6_desc:0 "
§LActive Roqualian cultures favor content where one directly interacts with the medium, which itself reacts to those interactions, leading to a propensity for gaming, both physical or digital. Far from being monolithic, these are further subdivided into hundreds of various subculture across Roqualia's territory and within expatriated communities. The differences mostly revolve around the type of entertainment being consumed: some Roqualian groups, generally in deep rural regions, will prefer more traditional board games, while others will go all-in into digital entertainment as soon as it is invented, further specializing into a myriad of different cultures each centered around a different type of game. They are mostly found in the eastern part of Roqualia, and are generally more 'dominant' in the nation as a whole.§!"
