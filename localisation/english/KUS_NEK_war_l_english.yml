l_english:
 # KUS-NEK War Mediation
 KUS_NEK_war_mediation_cat:0 "The North Akiba War"
 KUS_NEK_war_mediation_cat_desc:0 "The conflict between Nekaston and Kusnurk over the Akiba oil fields may seem minor, but many communist states see it as the beginning of greater traction for their ideological block in the wake of the Imperium's collapse. Furthermore, given Kusnurk's current political situation, losing the war may have §Rdrastic consequences§! on the nation's stability...\n\nEvery §Y3 months§!, the major powers and communist states of Flusion will send support to either §YNekaston§! or §YKusnurk§! depending on their current stance. Those that are neutral will tend to §Ypush for a ceasefire§!, while those that support Nekaston will want to §Ydelay said ceasefire§!.\n\nEffects of International Support on §Y[KUS.GetNameDef]§!:\nDivision Attack: §G+[?KUS.KUS_international_support_attack|%0]§!\n\nEffects of International Support on §Y[NEK.GetNameDef]§!:\nDivision Attack: §G+[?NEK.NEK_international_support_attack|%0]§!\n\n§YOur Stance:§! [ROOT.GetKUSNEKSupportLevel]"

 KUS_NEK_war_support:0 "Support in the North Akiba War"
 KUS_NEK_war_leaning:0 "Leaning in the North Akiba War"
 KUS_NEK_war_oppose:0 "Opposition in the North Akiba War"
 KUS_NEK_war_hate:0 "Major Opposition in the North Akiba War"

 # Support Level Labels
 KUS_NEK_support_level_kus:0 "§GKusnurk (Belligerent)§!"
 KUS_NEK_support_level_nek:0 "§RNekaston (Belligerent)§!"
 KUS_NEK_support_level_2:0 "§GSupport Kusnurk§!"
 KUS_NEK_support_level_1:0 "§YLeaning Kusnurk§!"
 KUS_NEK_support_level_0:0 "§8Neutral§!"
 KUS_NEK_support_level_neg1:0 "§OLeaning Nekaston§!"
 KUS_NEK_support_level_neg2:0 "§RSupport Nekaston§!"

 # Decision Names and Descriptions
 KUS_great_powers_mediate_ceasefire:0 "Great Powers Mediate Ceasefire"
 KUS_great_powers_mediate_ceasefire_desc:0 "The great powers of the world are pressuring both sides towards a ceasefire. When this mission expires, the war will end in a white peace exactly as it started."


 KUS_neuter_nekaston:0 "Neuter Nekaston"
 KUS_neuter_nekaston_desc:0 "We have pushed deep into Nekastonian territory and now control their key provinces. We can force them to the table and permanently limit their ability to threaten us."

 KUS_push_for_neutering:0 "Push for the Neutering of Nekaston"
 KUS_push_for_neutering_desc:0 "We believe we can win this war decisively. By signaling our intent to our international supporters, nations that support us will help extend the ceasefire deadline, giving us more time to achieve total victory."

 KUS_lobby_for_support:0 "Lobby §Y[FROM.GetName]§!\nTheir stance is [FROM.GetKUSNEKSupportLevel]"
 KUS_lobby_for_support_desc:0 "Spend political capital to lobby [FROM.GetName] for support in our war against Nekaston.\n\n§WIf they are §YSupporting§! a nation, they will always help said nation. If they are only §YLeaning§!, there is a §Y50%§! chance that they send support, and a §Y50%§! chance that they push for a ceasefire. If they are §YNeutral§!, they will §Yalways§! push for a ceasefire.§!"

 NEK_lobby_for_support:0 "Lobby §Y[FROM.GetName]§!\nTheir stance is [FROM.GetKUSNEKSupportLevel]"
 NEK_lobby_for_support_desc:0 "Spend political capital to lobby [FROM.GetName] for suppowt in ouw glowious waw against Kusnurk.\n\n§WIf they are §YSupporting§! a nation, they will always help said nation. If they are only §YLeaning§!, there is a §Y50%§! chance that they send support, and a §Y50%§! chance that they push for a ceasefire. If they are §YNeutral§!, they will §Yalways§! push for a ceasefire.§!"

 KUS_broadcast_nekastonian_decadence:0 "Broadcast Nekastonian Decadence"
 KUS_broadcast_nekastonian_decadence_desc:0 "Now that we control Nekastonian territory, we can broadcast evidence of the failings of their communist regime to the world. All communist nations will shift one tier towards supporting Kusnurk."

 KUS_NEK_war_support_decision:0 "Intervene in the Kusnurk-Nekaston War"
 KUS_NEK_war_support_decision_desc:0 "The war between Kusnurk and Nekaston over Northern Akiba affects us all. We must decide how to respond.\n\n§YOur current stance:§! [ROOT.GetKUSNEKSupportLevel]\n§YAvailable every 3 months.§!"

 # Event Titles and Descriptions
 # Event 2: Ceasefire Forced - KUS
 KUS_NEK_war.2.t:0 "Ceasefire Imposed"
 KUS_NEK_war.2.d:0 "The great powers have imposed a ceasefire on the conflict between Kusnurk and Nekaston. The war is over, and the borders return to their pre-war state. While peace has been achieved, the underlying tensions remain."
 KUS_NEK_war.2.a:0 "Peace at last."

 # Event 3: Ceasefire Forced - NEK
 KUS_NEK_war.3.t:0 "Ceasefiwe Imposed"
 KUS_NEK_war.3.d:0 "The gweat powews have imposed a ceasefiwe on ouw glowious waw. We must weturn to the status quo. Ouw ambitions for the oilfields of Akiba will have to wait..."
 KUS_NEK_war.3.a:0 "Bah! This is an outwage!"

 # Event 4: Support Choice
 KUS_NEK_war.4.t:0 "The Kusnurk-Nekaston Conflict"
 KUS_NEK_war.4.d:0 "The war between Kusnurk and Nekaston over Northern Akiba demands our attention. How shall we respond?"
 KUS_NEK_war.4.a:0 "Support Nekaston"
 KUS_NEK_war.4.b:0 "Support Kusnurk"
 KUS_NEK_war.4.c:0 "Push for Ceasefire"

 # Event 5: Neuter Nekaston Peace Proposal
 KUS_NEK_war.5.t:0 "Kusnurk Demands Our Neutering"
 KUS_NEK_war.5.d:0 "The Kusnurkites have pushed deep into ouw tewwitory and now demand we surrender key provinces and accept a demilitarized zone along ouw border. They seek to pewmanently limit ouw military capabilities."
 KUS_NEK_war.5.a:0 "We have no choice but to accept..."
 KUS_NEK_war.5.b:0 "Nevew! We will fight to the last!"

 # Event 10: Support arrives for KUS (KUS sees)
 KUS_NEK_war.10.t:0 "International Support Arrives"
 KUS_NEK_war.10.d:0 "[FROM.GetName] has decided to support Kusnurk in our conflict with Nekaston. Their assistance bolsters our forces."
 KUS_NEK_war.10.a:0 "Excellent!"

 # Event 11: Nation supports KUS (NEK sees)
 KUS_NEK_war.11.t:0 "[FROM.GetName] Suppowts Kusnurk"
 KUS_NEK_war.11.d:0 "Wepowts indicate that [FROM.GetName] has decided to suppowt Kusnurk in the ongoing conflict. This is a concewning development for ouw cause."
 KUS_NEK_war.11.a:0 "Tweason!"

 # Event 12: Support arrives for NEK (NEK sees)
 KUS_NEK_war.12.t:0 "Intewnational Suppowt Awwives"
 KUS_NEK_war.12.d:0 "[FROM.GetName] has decided to suppowt ouw glowious cause! Their assistance stwengthens ouw fowces."
 KUS_NEK_war.12.a:0 "Gweat news!"

 # Event 13: Nation supports NEK (KUS sees)
 KUS_NEK_war.13.t:0 "[FROM.GetName] Supports Nekaston"
 KUS_NEK_war.13.d:0 "Reports indicate that [FROM.GetName] has decided to support Nekaston in the ongoing conflict. This is a concerning development."
 KUS_NEK_war.13.a:0 "Troubling..."

 # Event 14: Ceasefire push (KUS sees)
 KUS_NEK_war.14.t:0 "[FROM.GetName] Pushes for Ceasefire"
 KUS_NEK_war.14.d:0 "[FROM.GetName] is actively pushing for a ceasefire in the Kusnurk-Nekaston conflict. The pressure to end the war grows stronger."
 KUS_NEK_war.14.a:0 "The clock ticks down..."

 # Event 15: Ceasefire push (NEK sees)
 KUS_NEK_war.15.t:0 "[FROM.GetName] Pushes fow Ceasefiwe"
 KUS_NEK_war.15.d:0 "[FROM.GetName] is pushing fow a ceasefiwe in ouw glowious conflict. The intewnational pwessure mounts."
 KUS_NEK_war.15.a:0 "We must act quickly..."

 # Event 20: Lobby notification
 KUS_NEK_war.20.t:0 "Diplomatic Attention"
 KUS_NEK_war.20.d:0 "[FROM.GetName] has been lobbying our government regarding the Kusnurk-Nekaston conflict. Their diplomatic overtures come with certain... incentives."
 KUS_NEK_war.20.a:0 "Interesting..."

 # Event 25: Broadcast Decadence
 KUS_NEK_war.25.t:0 "Nekastonian Decadence Exposed"
 KUS_NEK_war.25.d:0 "Kusnurk has begun broadcasting evidence of the failings of the Nekastonian regime from captured territory. The revelations are shaking international support for Nekaston."
 KUS_NEK_war.25.a:0 "Pwopaganda!"

 # Custom Effect Tooltips
 KUS_NEK_war_spawn_divs_nek_tt:0 "2 §YDivisions§! of §Y8-width infantry§! will be sent to §YNekaston§!"
 KUS_NEK_war_spawn_divs_kus_tt:0 "2 §YDivisions§! of §Y8-width infantry§! will be sent to §YKusnurk§!"
 KUS_NEK_war_attack_up_tt:0 "Modify §YInternational Support§! by:\n§G+1%§! Division Attack"
 KUS_NEK_war_mission_add_5_tt:0 "§Y+5 days§! to §YCeasefire Deadline§!"
 KUS_NEK_war_mission_remove_5_tt:0 "§Y-5 days§! to §YCeasefire Deadline§!"
 KUS_NEK_war_ceasefire_tt:0 "The war ends in a §YWhite Peace§!. All borders return to their pre-war state."
 KUS_NEK_war_ceasefire_push_tt:0 "§Y-5 days§! to §YCeasefire Deadline§!"
 KUS_NEK_war_kus_received_support_tt:0 "Modify §YInternational Support§! by:\n§G+1%§! Division Attack"
