l_english:
 # KUS-NEK War Mediation
 KUS_NEK_war_mediation_cat:0 "Kusnurk-Nekaston War Mediation"
 KUS_NEK_war_mediation_cat_desc:0 "The conflict between Kusnurk and Nekaston over Northern Akiba is being mediated by the great powers.\n\n§YKusnurk International Support:§!\n  §GAttack: +[?KUS.KUS_international_support_attack|%0]§!  |  §GDefense: +[?KUS.KUS_international_support_defense|%0]§!\n\n§YNekaston International Support:§!\n  §RAttack: +[?NEK.NEK_international_support_attack|%0]§!  |  §RDefense: +[?NEK.NEK_international_support_defense|%0]§!\n\n§YSupporter Stances:§![KUS_NEK_supporter_list_display]"

 # Support Level Labels
 KUS_NEK_support_level_kus:0 "§GKusnurk (Belligerent)§!"
 KUS_NEK_support_level_nek:0 "§RNekaston (Belligerent)§!"
 KUS_NEK_support_level_2:0 "§GSupport Kusnurk§!"
 KUS_NEK_support_level_1:0 "§YLeaning Kusnurk§!"
 KUS_NEK_support_level_0:0 "§WNeutral§!"
 KUS_NEK_support_level_neg1:0 "§YLeaning Nekaston§!"
 KUS_NEK_support_level_neg2:0 "§RSupport Nekaston§!"

 # Decision Names and Descriptions
 KUS_great_powers_mediate_ceasefire:0 "Great Powers Mediate Ceasefire"
 KUS_great_powers_mediate_ceasefire_desc:0 "The great powers of the world are pressuring both sides towards a ceasefire. When this mission expires, the war will end in a white peace exactly as it started."

 KUS_NEK_war_quarterly_tally:0 "International Support Arrives"
 KUS_NEK_war_quarterly_tally_desc:0 "Every three months, the international community delivers accumulated support to the belligerents. A summary of all support received this quarter will be presented when this mission expires."

 NEK_kusnurk_peace:0 "Peace out with Kusnurk"
 NEK_kusnurk_peace_desc:0 "We have achiewed our glowious goals in ouw rightweous waw! Let us consolidate our gains..."

 KUS_neuter_nekaston:0 "Neuter Nekaston"
 KUS_neuter_nekaston_desc:0 "We have pushed deep into Nekastonian territory and now control their key provinces. We can force them to the table and permanently limit their ability to threaten us."

 KUS_push_for_neutering:0 "Push for the Neutering of Nekaston"
 KUS_push_for_neutering_desc:0 "We believe we can win this war decisively. By signaling our intent to our international supporters, nations that support us will help extend the ceasefire deadline, giving us more time to achieve total victory."

 KUS_lobby_for_support:0 "Lobby [FROM.GetName] for Support"
 KUS_lobby_for_support_desc:0 "Spend political capital to lobby [FROM.GetName] for support in our war against Nekaston.\n\n§YCurrent stance:§! [FROM.GetKUSNEKSupportLevel]\n§Y50% chance of shifting support towards Kusnurk.§!"

 NEK_lobby_for_support:0 "Lobby [FROM.GetName] for Suppowt"
 NEK_lobby_for_support_desc:0 "Spend political capital to lobby [FROM.GetName] for suppowt in ouw glowious waw against Kusnurk.\n\n§YCurrent stance:§! [FROM.GetKUSNEKSupportLevel]\n§Y50% chance of shifting suppowt towards Nekaston.§!"

 KUS_broadcast_nekastonian_decadence:0 "Broadcast Nekastonian Decadence"
 KUS_broadcast_nekastonian_decadence_desc:0 "Now that we control Nekastonian territory, we can broadcast evidence of the failings of their communist regime to the world. All communist nations will shift one tier towards supporting Kusnurk."

 KUS_NEK_war_support_decision:0 "Intervene in the Kusnurk-Nekaston War"
 KUS_NEK_war_support_decision_desc:0 "The war between Kusnurk and Nekaston over Northern Akiba affects us all. We must decide how to respond.\n\n§YOur current stance:§! [ROOT.GetKUSNEKSupportLevel]\n§YAvailable every 3 months. Support will be delivered in a batch at the end of each quarter.§!"

 # Event Titles and Descriptions
 # Event 2: Ceasefire Forced - KUS
 KUS_NEK_war.2.t:0 "Ceasefire Imposed"
 KUS_NEK_war.2.d:0 "The great powers have imposed a ceasefire on the conflict between Kusnurk and Nekaston. The war is over, and the borders return to their pre-war state. While peace has been achieved, the underlying tensions remain."
 KUS_NEK_war.2.a:0 "Peace at last."

 # Event 3: Ceasefire Forced - NEK
 KUS_NEK_war.3.t:0 "Ceasefiwe Imposed"
 KUS_NEK_war.3.d:0 "The gweat powews have imposed a ceasefiwe on ouw glowious waw. We must weturn to the status quo. Ouw ambitions for the oilfields of Akiba will have to wait..."
 KUS_NEK_war.3.a:0 "Bah! This is an outwage!"

 # Event 4: Support Choice
 KUS_NEK_war.4.t:0 "The Kusnurk-Nekaston Conflict"
 KUS_NEK_war.4.d:0 "The war between Kusnurk and Nekaston over Northern Akiba demands our attention. How shall we respond? Our support will be delivered at the end of the quarter."
 KUS_NEK_war.4.a:0 "Support Nekaston"
 KUS_NEK_war.4.b:0 "Support Kusnurk"
 KUS_NEK_war.4.c:0 "Push for Ceasefire"

 # Event 5: Neuter Nekaston Peace Proposal
 KUS_NEK_war.5.t:0 "Kusnurk Demands Our Neutering"
 KUS_NEK_war.5.d:0 "The Kusnurkites have pushed deep into ouw tewwitory and now demand we surrender key provinces and accept a demilitarized zone along ouw border. They seek to pewmanently limit ouw military capabilities."
 KUS_NEK_war.5.a:0 "We have no choice but to accept..."
 KUS_NEK_war.5.b:0 "Nevew! We will fight to the last!"

 # Event 20: Lobby notification
 KUS_NEK_war.20.t:0 "Diplomatic Attention"
 KUS_NEK_war.20.d:0 "[FROM.GetName] has been lobbying our government regarding the Kusnurk-Nekaston conflict. Their diplomatic overtures come with certain... incentives."
 KUS_NEK_war.20.a:0 "Interesting..."

 # Event 25: Broadcast Decadence
 KUS_NEK_war.25.t:0 "Nekastonian Decadence Exposed"
 KUS_NEK_war.25.d:0 "Kusnurk has begun broadcasting evidence of the failings of the Nekastonian regime from captured territory. The revelations are shaking international support for Nekaston."
 KUS_NEK_war.25.a:0 "Pwopaganda!"

 # Event 30: Quarterly Summary - KUS
 KUS_NEK_war.30.t:0 "Quarterly International Support Summary"
 KUS_NEK_war.30.d:0 "The international community has delivered its quarterly support in the war against Nekaston.\n\n§YSupport for Kusnurk:§!\n  §GGuns received: [?global.KUS_NEK_tally_guns_kus|0]§!\n  §GVolunteer divisions: [?global.KUS_NEK_tally_divs_kus|0]§!\n  §GAttack bonus: +[?global.KUS_NEK_tally_attack_kus|0]%§!\n  §GDefense bonus: +[?global.KUS_NEK_tally_defense_kus|0]%§!\n\n§YSupport for Nekaston:§!\n  §RGuns received: [?global.KUS_NEK_tally_guns_nek|0]§!\n  §RVolunteer divisions: [?global.KUS_NEK_tally_divs_nek|0]§!\n  §RAttack bonus: +[?global.KUS_NEK_tally_attack_nek|0]%§!\n\n§YCeasefire Mission:§!\n  §YAdded days: +[?global.KUS_NEK_tally_mission_add|0]§!\n  §YRemoved days: -[?global.KUS_NEK_tally_ceasefire_days|0]§!"
 KUS_NEK_war.30.a:0 "Understood."

 # Event 31: Quarterly Summary - NEK
 KUS_NEK_war.31.t:0 "Quartewly Intewnational Suppowt Summowy"
 KUS_NEK_war.31.d:0 "The intewnational community has delivewed its quartewly suppowt in ouw glowious waw against Kusnurk.\n\n§YSuppowt for Nekaston:§!\n  §GGuns weceived: [?global.KUS_NEK_tally_guns_nek|0]§!\n  §GVolunteew divisions: [?global.KUS_NEK_tally_divs_nek|0]§!\n  §GAttack bonus: +[?global.KUS_NEK_tally_attack_nek|0]%§!\n\n§YSuppowt for Kusnurk:§!\n  §RGuns weceived: [?global.KUS_NEK_tally_guns_kus|0]§!\n  §RVolunteew divisions: [?global.KUS_NEK_tally_divs_kus|0]§!\n  §RAttack bonus: +[?global.KUS_NEK_tally_attack_kus|0]%§!\n  §RDefense bonus: +[?global.KUS_NEK_tally_defense_kus|0]%§!\n\n§YCeasefiwe Mission:§!\n  §YAdded days: +[?global.KUS_NEK_tally_mission_add|0]§!\n  §YWemoved days: -[?global.KUS_NEK_tally_ceasefire_days|0]§!"
 KUS_NEK_war.31.a:0 "Noted."

 # Custom Effect Tooltips
 KUS_NEK_war_spawn_divs_nek_tt:0 "§Y2 volunteer divisions (8-width infantry) will be sent to Nekaston at the end of the quarter§!"
 KUS_NEK_war_spawn_divs_kus_tt:0 "§Y2 volunteer divisions (8-width infantry) will be sent to Kusnurk at the end of the quarter§!"
 KUS_NEK_war_defense_up_tt:0 "§GKusnurk International Support: +1% Division Defense§!"
 KUS_NEK_war_attack_up_tt:0 "§G+1% Division Attack§!"
 KUS_NEK_war_mission_add_5_tt:0 "§Y+5 days to ceasefire deadline§!"
 KUS_NEK_war_mission_remove_5_tt:0 "§R-5 days from ceasefire deadline§!"
 KUS_NEK_war_ceasefire_tt:0 "§YThe war ends in a white peace. All borders return to their pre-war state.§!"
 KUS_NEK_war_ceasefire_push_tt:0 "§YThe ceasefire deadline has been reduced by 5 days.§!"
 KUS_NEK_war_kus_received_support_tt:0 "§GKusnurk has received international support: +1% Defense§!"
 KUS_NEK_war_nek_received_support_tt:0 "§RNekaston has received international support: +1% Attack, +5 days to ceasefire§!"
 KUS_NEK_war_dismantle_buildings_tt:0 "§RAll rocket sites and military factories will be dismantled§!"
 KUS_NEK_war_push_neutering_tt:0 "§YNations that support Kusnurk will now add 5 days to the ceasefire deadline instead of pushing for ceasefire, giving us more time to achieve victory.§!"
 KUS_NEK_war_broadcast_decadence_tt:0 "§YAll communist nations shift one tier towards supporting Kusnurk§!"
 KUS_NEK_war_lobby_success_tt:0 "§GThe lobbying was successful! Support has shifted.§!"
 KUS_NEK_war_lobby_fail_tt:0 "§RThe lobbying failed. No change in support.§!"

 # Dynamic Modifier Names
 KUS_international_support:0 "International Support"
 KUS_international_support_desc:0 "International nations are supporting Kusnurk in the war against Nekaston."
 NEK_international_support:0 "International Support"
 NEK_international_support_desc:0 "International nations are supporting Nekaston in the war against Kusnurk."

