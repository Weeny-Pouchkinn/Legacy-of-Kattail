 KUS_NEK_war_dismantle_buildings_tt:0 "§RAll rocket sites and military factories will be dismantled§!"
 KUS_NEK_war_push_neutering_tt:0 "Nations that support §YKusnurk§! will now §Yadd 5 days to the ceasefire deadline§! instead of pushing for ceasefire, giving us more time to achieve victory."
 KUS_NEK_war_broadcast_decadence_tt:0 "All §YCommunist Nations§! shift towards supporting §YKusnurk§!"
 KUS_NEK_war_lobby_success_tt:0 "support §Gshifting towards us§!"
