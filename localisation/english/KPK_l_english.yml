 KPK_politically_flexible_leader:0 "Politically Flexible Leader"
 KPK_politically_flexible_leader_desc:0 "A soldier turned politician. A small malus to political power gain but a bonus to stability."
 KPK_the_engineer_chief:0 "The Engineer"
 KPK_the_engineer_chief_desc:0 "Considerable bonus to Engineer support company and Guards-Engineers battalion, moderate boost to entrenchment speed and supply consumption, slight doctrine discount."

