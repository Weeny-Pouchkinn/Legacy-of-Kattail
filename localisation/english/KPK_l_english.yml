 ##################################
 # KPK Events
 ##################################

 KPK_events.1.t:0 "The History of the Korps"
 KPK_events.1.d:0 "On the very edge of the Herzlands, in between the two mountain ranges that signify its boundary, lives the Katzens who were tasked with some of the grand projects of the Imperium. The Katzen Pioniere Korps has a long and storied history, from the construction of the great Südberg Damm to the engineering marvels that once connected the far reaches of the Imperium.\n\nGeneral Theofurr Von Katzger, a veteran of countless campaigns and construction projects, now stands as the commander of this venerable formation. With the collapse of the Imperium, many of the Imperium's engineer corps returned here to await new orders. Now, Katzger must decide what the Korps' history means for its future."
 KPK_events.1.a:0 "Our history is our strength."

 KPK_events.2.t:0 "Settling between the Mountains"
 KPK_events.2.d:0 "The region between the mountains must be stabilized. Katzger and the KPK have prioritized rebuilding the damaged infrastructure, restoring the dams and reservoirs, and ensuring that the 20 million souls under their care have food, water, and shelter.\n\nThe Südberg Damm, while damaged, still functions. The lesser dams and reservoirs provide water for agriculture and industry. With careful management, the region can become self-sufficient — perhaps even prosperous."
 KPK_events.2.a:0 "We shall build upon what we have."

 KPK_events.3.t:0 "An Interim Government"
 KPK_events.3.d:0 "Katzger has always been a soldier first. But the collapse has thrust him into the role of political leader. The soldiers are loyal to him, and there is no clear plan to replace him. He must now choose who to lean on for support.\n\nThe Populisten advocate for democratic reforms. The Milliaristen want to restore Katzen military glory. The Left-Populists push for workers' rights and social equality. And the pragmatists simply want stability and economic growth."
 KPK_events.3.a:0 "We shall find our way."

 KPK_events.10.t:0 "The Constitutional Convention"
 KPK_events.10.d:0 "The time has come. Delegates from across the region have gathered to draft a constitution that will determine the political future of the Southeast. The debates are fierce, the passions run high, and the fate of millions hangs in the balance.\n\nThree visions compete for dominance: the industrialists who see the future in trade and manufacturing, the militarists who wish to restore Katzen glory, and the populists who demand a voice for the common citizen."
 KPK_events.10.a:0 "Let the convention decide."

