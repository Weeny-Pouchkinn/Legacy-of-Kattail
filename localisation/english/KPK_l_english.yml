l_english:

 ##################################
 # KPK Focus Tree Localisation
 ##################################

 # Intro Focuses
 KPK_history_of_the_korps:0 "The History of the Korps"
 KPK_history_of_the_korps_desc:0 "The Katzen Pioniere Korps traces its lineage back to the earliest days of Katzen civilization. It is time to look back on our history and understand who we are, so that we may decide who we will become."
 KPK_settling_between_the_mountains:0 "Settling between the Mountains"
 KPK_settling_between_the_mountains_desc:0 "General Von Katzger and the KPK must decide how to stabilize the region between the two mountain ranges. The priorities we set now will determine the foundation of our state."
 KPK_an_interim_government:0 "An Interim Government"
 KPK_an_interim_government_desc:0 "Katzger has always been a soldier first. But with the collapse of the Imperium, he must now turn to politics. Who will he lean on for support in governing these 20 million souls?"

 # Political Tree
 KPK_draft_a_constitution:0 "Draft a Constitution"
 KPK_draft_a_constitution_desc:0 "The time has come to give our region a proper political framework. The Constitutional Convention will determine the future direction of the Southeast."

 # Neutral Path
 KPK_the_factory_state:0 "The Factory-State"
 KPK_the_factory_state_desc:0 "The nascent capitalists of the region take the lead. Our future lies in industry, trade, and pragmatic neutrality. Water, power, food, and industrial goods shall be our exports to the world."
 KPK_industrial_council:0 "The Industrial Council"
 KPK_industrial_council_desc:0 "The Katzen Industrial Council formalizes its grip on the economic apparatus of the state. Industry shall be the beating heart of our republic."
 KPK_power_trading:0 "Power Trading"
 KPK_power_trading_desc:0 "The Südberg Damm produces far more electricity than the region can consume. We shall sell what we cannot use to our neighbors."
 KPK_industrial_expansion:0 "Industrial Expansion"
 KPK_industrial_expansion_desc:0 "With a stable government and abundant power, it is time to expand our industrial base throughout the region."
 KPK_merchant_republic:0 "The Merchant Republic"
 KPK_merchant_republic_desc:0 "The Merchant Republic of Southeast Felinia stands as a beacon of pragmatic governance and industrial might. Our neutrality is our strength."

 # Fascist Path
 KPK_the_old_katzen_ways:0 "The Old Katzen Ways"
 KPK_the_old_katzen_ways_desc:0 "The reassertion of Katzen militarism. Our strength lies in our discipline, our engineering prowess, and the martial traditions of the Herzlands."
 KPK_rebuild_the_officer_corps:0 "Rebuild the Officer Corps"
 KPK_rebuild_the_officer_corps_desc:0 "A strong military requires strong officers. We shall rebuild the command structure that once made the Imperium's armies the finest on Flusion."
 KPK_katzen_militarism:0 "Katzen Militarism"
 KPK_katzen_militarism_desc:0 "The factories of the Southeast shall be turned to the production of arms. The old Katzen ways demand strength, and strength requires weapons."
 KPK_southern_vanguard:0 "Southern Vanguard"
 KPK_southern_vanguard_desc:0 "The Southeast shall be the southern vanguard of a reunified Katzen state. Whether through alliance with Stronien or through our own conquest, we shall march home to Kattown."
 KPK_southeast_katzen_state:0 "The Southeast Katzen State"
 KPK_southeast_katzen_state_desc:0 "The Southeast Katzen State stands ready to reclaim the glory of the Herzlands. Under the Katzen National Party, our destiny is clear."

 # Democratic/Communist Shared
 KPK_democratic_communist_path:0 "The Voice of the People"
 KPK_democratic_communist_path_desc:0 "The people of the Southeast demand a say in their governance. Whether through elections or revolution, the old order must give way to the new."

 # Democratic Subpath
 KPK_a_katzen_republic:0 "A Katzen Republic"
 KPK_a_katzen_republic_desc:0 "A republic built on democratic principles and social welfare. We shall align with the USSF and build a society where all citizens, Katzen and non-Katzen alike, are equal before the law."
 KPK_social_democratic_reforms:0 "Social Democratic Reforms"
 KPK_social_democratic_reforms_desc:0 "The Sozialdemokratische Partei pushes forward with reforms to improve the lives of all citizens. Education, healthcare, and workers' rights shall be the pillars of our republic."
 KPK_republic_of_southeast_felinia:0 "Republic of Southeast Felinia"
 KPK_republic_of_southeast_felinia_desc:0 "The Republic of Southeast Felinia stands as a testament to democratic values in the Herzlands. Our commitment to equality and liberty shall inspire others."

 # Communist Subpath
 KPK_a_peoples_republic:0 "A People's Republic"
 KPK_a_peoples_republic_desc:0 "A libertarian socialist republic where the means of production belong to the workers. Whether we align with Meownich or forge our own path, the people shall be free."
 KPK_libertarian_socialist_economy:0 "Libertarian Socialist Economy"
 KPK_libertarian_socialist_economy_desc:0 "The Frei Sozialistische Partei reorganizes the economy along socialist lines. Worker cooperatives and democratic councils shall manage production."
 KPK_peoples_republic_of_southeast_felinia:0 "People's Republic of Southeast Felinia"
 KPK_peoples_republic_of_southeast_felinia_desc:0 "The People's Republic of Southeast Felinia stands as a beacon of libertarian socialism. Our commitment to workers' rights and anti-racism shall be an example to the world."

 # Military Tree
 KPK_the_grand_machine:0 "The Grand Machine"
 KPK_the_grand_machine_desc:0 "Katzger views the military of [ROOT.GetName] as a grand machine built around the KPK. No matter who leads [ROOT.GetName], the machine that protects them bends to his will first and foremost. The work of turning the core of KPK veterans and the scraps left lying around into a proper military begins with designing that machine."
 KPK_kabelschneiderdoktrin:0 "Kabelschneiderdoktrin"
 KPK_kabelschneiderdoktrin_desc:0 "The Cable-Cutter Doctrine emphasizes rapid maneuver and disruption of enemy communications and supply lines. Strike fast, cut deep, and withdraw before the enemy can respond."
 KPK_wasserschlagdoktrin:0 "Wasserschlagdoktrin"
 KPK_wasserschlagdoktrin_desc:0 "The Water-Strike Doctrine harnesses the overwhelming firepower of massed artillery and engineering assets to crush the enemy. Like a dam bursting, our forces shall flood the enemy with fire and steel."
 KPK_uhrwerkdoktrin:0 "Uhrwerkdoktrin"
 KPK_uhrwerkdoktrin_desc:0 "The Clockwork Doctrine emphasizes meticulous planning and precise execution. Every unit, every supply line, every artillery piece moves in harmony like the gears of a great clock."
 KPK_establish_sudberg_military_academy:0 "Establish the Südberg Military Academy"
 KPK_establish_sudberg_military_academy_desc:0 "A proper military academy shall be established at the foot of the Südberg to train the next generation of officers and engineers in the doctrines of the KPK."
 KPK_reform_command_structure:0 "Reform the Command Structure"
 KPK_reform_command_structure_desc:0 "The command structure inherited from the Imperium must be reformed to suit our new reality. A leaner, more responsive chain of command shall replace the bloated bureaucracy of the past."
 KPK_developing_next_gen_equipment:0 "Developing the Next Generation of Equipment"
 KPK_developing_next_gen_equipment_desc:0 "The engineers of the KPK set to work designing the next generation of military equipment. From infantry weapons to armored vehicles, everything must be modernized."
 KPK_integrate_lessons_of_collapse:0 "Integrate the Lessons of the Collapse"
 KPK_integrate_lessons_of_collapse_desc:0 "The collapse of the Imperium taught hard lessons about logistics, morale, and the limits of centralized command. These lessons must be integrated into our military doctrine."
 KPK_the_new_southeastern_army:0 "The New Southeastern Army"
 KPK_the_new_southeastern_army_desc:0 "The grand machine is complete. The New Southeastern Army stands ready, forged from the veterans of the KPK and tempered by the lessons of the collapse. Wir Können, Wir Machten."

 # Industry/Infrastructure Tree
 KPK_assess_regional_resources:0 "Assess Regional Resources"
 KPK_assess_regional_resources_desc:0 "Before we can build, we must know what we have. A thorough assessment of the region's resources, infrastructure, and industrial capacity is in order."
 KPK_restore_the_sudberg_damm:0 "Restore the Südberg Damm"
 KPK_restore_the_sudberg_damm_desc:0 "The Südberg Damm has fallen into disrepair since the collapse. Restoring it to full functionality will provide the power and water our region desperately needs."
 KPK_expand_dam_capacity:0 "Expand Dam Capacity"
 KPK_expand_dam_capacity_desc:0 "With the dam restored, we can now expand its capacity. More power means more industry, more food production, and a stronger economy."
 KPK_rebuild_regional_infrastructure:0 "Rebuild Regional Infrastructure"
 KPK_rebuild_regional_infrastructure_desc:0 "Roads, railways, and supply lines must be rebuilt across the region. Without infrastructure, our industrial potential is wasted."
 KPK_civilian_industry_effort:0 "Civilian Industry Effort"
 KPK_civilian_industry_effort_desc:0 "With infrastructure restored, it is time to build up our civilian industrial base. Factories must be constructed to meet the needs of our growing population."
 KPK_heart_of_the_region:0 "Heart of the Region"
 KPK_heart_of_the_region_desc:0 "The Southeast has been rebuilt and strengthened. Our dams provide power, our factories produce goods, and our people prosper. The heart of the region beats strong."

 ##################################
 # KPK Ideas/Spirits Localisation
 ##################################

 KPK_wir_konnen_wir_machten:0 "Wir Können, Wir Machten"
 KPK_wir_konnen_wir_machten_desc:0 "We Can, We Did — the motto of the Katzen Kaiserliche Pioniere Korps, its history said to be as old as our presence on this world. The skill and institutional memory of this venerable formation leaves us with a very technically adept military and construction expertise unmatched on all of Flusion."
 KPK_wir_konnen_wir_machten_final:0 "Wir Können, Wir Machten"
 KPK_wir_konnen_wir_machten_final_desc:0 "We Can, We Did. The New Southeastern Army has been forged from the veterans of the KPK and the lessons of the collapse. Our engineers, our soldiers, our machine — all have been refined into an instrument of unmatched precision and power."
 KPK_disarray_of_the_collapse:0 "Disarray of the Collapse"
 KPK_disarray_of_the_collapse_desc:0 "Dead! Dead! The Imperium is dead! From its engorged belly, a new order must be made from its guts and ours will be the greatest. Some time is needed to fix the brain drain, rebuild infrastructure damaged by the war, and the political dissent of far too many groups. But it can be done."
 KPK_uncertain_political_future:0 "Uncertain Political Future"
 KPK_uncertain_political_future_desc:0 "The region has no political vision at the moment. General Von Katzger has always been a soldier first, and is a politician now because the soldiers are loyal to him and there is no clear plan to replace him."
 KPK_uncertain_political_future_mitigated:0 "Uncertain Political Future"
 KPK_uncertain_political_future_mitigated_desc:0 "While still uncertain, Katzger has begun to lean on key political allies to stabilize the region's governance. A proper constitution is needed to resolve the matter fully."
 KPK_the_hydroelectric_state:0 "The Hydroelectric State"
 KPK_the_hydroelectric_state_desc:0 "This region of the Herzlands has two resources in abundance: water and electricity. Standing at the headwaters of the Drakwald River, the Südberg Damm and the lesser dams make it second only to Meon in electrical capacity."
 KPK_the_design_of_the_machine:0 "The Design of the Machine"
 KPK_the_design_of_the_machine_desc:0 "Katzger's work on building a military first and foremost to defend the Southeast and possibly retake the Herzlands has begun with the formal assembly of a General Staff, headed by Katzger."
 KPK_the_design_of_the_machine_reformed:0 "The Design of the Machine"
 KPK_the_design_of_the_machine_reformed_desc:0 "The command structure has been reformed. The General Staff operates with greater efficiency and the machine of war is taking shape."
 KPK_the_design_of_the_machine_equipped:0 "The Design of the Machine"
 KPK_the_design_of_the_machine_equipped_desc:0 "New equipment designs are entering production. The machine grows ever more capable."
 KPK_the_design_of_the_machine_lessons:0 "The Design of the Machine"
 KPK_the_design_of_the_machine_lessons_desc:0 "The lessons of the collapse have been integrated. The machine has learned from the past."

