 KPK_kabelschneiderdoktrin_tt:0 "The §YKabelschneiderdoktrin§! favors §GManeuver Warfare§! — rapid strikes and disruption of enemy supply lines."
 KPK_wasserschlagdoktrin_tt:0 "The §YWasserschlagdoktrin§! favors §GOverwhelming Firepower§! — massed artillery and concentrated fire to crush the enemy."
 KPK_uhrwerkdoktrin_tt:0 "The §YUhrwerkdoktrin§! favors §GGrand Battleplan§! — meticulous planning and precise coordination of forces."
