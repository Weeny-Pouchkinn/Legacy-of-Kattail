 # FLE - Mount Fleather
 FLE_Greatbeak_The_Third:0 "Greatbeak The Third"
 FLE_Greatbeak_The_Third_Desc:0 "Famed War Hero and Chief of the Skypeak Tribe, Greatbeak the Third has been named by the Tribal Assembly to serve as its first Grand Chief. While has has cast off the yoke of the Katzen Oppressor, imperialists from Mercuria and Sobakiland rain down seeking to \"Liberate\" us from ourselves!\n\nLike the Katzen's before, Grand Chief Greatbeak will fight beak and talon to see Mount Fleather be free.\n\nPortrait Source: Kitbash by DecentNameHere"
 FLE_First_Grand_Chief:0 "First Grand Chief of the Federated Fleather Tribes"
 
 FLE_Alebarksy_Achkosov:0 "Alebarksy Achkosov"
 FLE_Alebarksy_Achkosov_Desc:0 "Alebarksy Achkosov, a veteran of both the Invasion of Sobakiland and later it's Liberation where he was said to personally lead the rebellion of Blasterburg and the capture of the Imperial 19th Fleet that was moored at the port, now leads the restored 11th Marine Corps of the Sobaki People's Liberation Navy. While the mainland has been liberated and the Imperial Anarchy has been pushed back to the other side of the Blasterian Canal, Imperial Remnants still lie active in the west.\n\nLieutenant-General Alebarksy has been tasked with liberating the people of Mount Fleather from the imperialist paws of the Katzen Collaborators and the Feudalistic Tribes that have seized power in the chaos of the collapse."
 FLE_Alebarksy_Achkosov_Desc_Victorious_Leader:0 "Alebarksy Achkosov, a veteran of both the Invasion of Sobakiland and later it's Liberation where he was said to personally lead the rebellion of Blasterburg and the capture of the Imperial 19th Fleet that was moored at the port.\n\nLieutenant-General Alebarksy was tasked with liberating the people of Mount Fleather its oppressors and has now been assigned as the governor of the military garrison that now governs the island.."
 FLE_Lieutenant_General_Alebarsky:0 "Lieutenant-General of the 11th Marine Corps"
 
 FLE_Tulia_Korzyn:0 "Tulia Korzyn"
 FLE_Tulia_Korzyn_Desc:0 "Lieutenant-General Tulia Korzyn of the Royal Mercurian Navy has been tasked with conquering the isle of Fleatherland. The King fears the Katzen collaborators or the Sobaki Revolutionaries taking control of the island and the projection it gives them over the Sun Sea. However, the support Tulia expected on his arrival to the island has been redirected, the homeland lies under attack from the mechanical invaders. He must finish his mission swiftly so he may rejoin the fight at home."
 FLE_Tulia_Korzyn_Desc_Victorious_Leader:0 "Lieutenant-General Tulia Korzyn of the Royal Mercurian Navy was tasked with conquering the isle of Fleatherland. The King feared the scenario that either Katzen collaborators or the Sobaki Revolutionaries took control of the island and the projection it gives them over the Sun Sea, thankfully however under the cunning leadership of Tulia, Mercurian forces cemented their control over the isles.\n\nLieutenant-General Korzyn has now been assigned as the governor of the island, protecting Mercuria's Pawcific Interests."
 FLE_Lieutenant_General_Korzyn:0 "Lieutenant-General of the 3rd Marine Corps"
 
