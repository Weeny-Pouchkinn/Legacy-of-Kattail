l_english:

 # Focus Tree
 PAW_bring_an_end_to_the_anarchy:0 "Bring an End to the Anarchy"
 PAW_bring_an_end_to_the_anarchy_desc:0 "The lawlessness that has plagued our lands must come to an end. We shall restore order and establish a functioning government."

 PAW_reign_in_the_banditism:0 "Reign in the Banditism"
 PAW_reign_in_the_banditism_desc:0 "The bandits roaming our countryside must be brought to heel. Through strict enforcement, we will curtail their activities and restore safety to our citizens."

 PAW_take_advantage_of_the_bandits:0 "Take Advantage of the Bandits"
 PAW_take_advantage_of_the_bandits_desc:0 "Rather than fighting the bandits head-on, we can exploit their networks for our own purposes. Their chaos can become our opportunity."

 PAW_reclaim_the_streets_of_pawris:0 "Reclaim the Streets of Pawris"
 PAW_reclaim_the_streets_of_pawris_desc:0 "The underground resistance has held sway over our streets for too long. It is time to reassert our authority in Pawris."

 PAW_through_labour_the_rebels_will_pay:0 "Through Labour the Rebels Will Pay"
 PAW_through_labour_the_rebels_will_pay_desc:0 "The captured resistance fighters will serve our nation through forced labour. Their toil shall fuel our industrial might."

 PAW_through_death_the_rebels_will_pay:0 "Through Death the Rebels Will Pay"
 PAW_through_death_the_rebels_will_pay_desc:0 "The resistance shall be made an example of. Through swift and decisive execution, we will crush any remaining opposition and strengthen our military resolve."

 PAW_strike_against_elwin:0 "Strike Against Elwin"
 PAW_strike_against_elwin_desc:0 "With order restored and the resistance crushed, we can finally turn our attention to breaking free from Elwin's grip. We shall raise elite divisions to lead the charge."

 # National Spirits
 PAW_no_central_authority:0 "No Central Authority"
 PAW_no_central_authority_desc:0 "Without a functioning central government, our nation is in disarray. Stability is crumbling, factories sit idle, and the populace refuses to serve."

 PAW_no_central_authority_1:0 "No Central Authority"
 PAW_no_central_authority_1_desc:0 "Though we have taken steps to restore order, the remnants of anarchy still hamper our efforts. Government authority is slowly being re-established."

 PAW_banditism:0 "Banditism"
 PAW_banditism_desc:0 "Roving bands of criminals terrorize the countryside. While they destabilize our nation, their activities fuel extremist ideologies on both sides."

 PAW_banditism_2a:0 "Banditism"
 PAW_banditism_2a_desc:0 "Our crackdown on the bandits has reduced their influence significantly. Criminal activity is declining, though some remnants persist."

 PAW_banditism_2b:0 "Banditism"
 PAW_banditism_2b_desc:0 "We have co-opted the bandit networks to serve our purposes. Their chaos is now channeled in our favour."

 PAW_underground_resistance:0 "Underground Resistance"
 PAW_underground_resistance_desc:0 "A shadowy resistance movement operates beneath the surface, undermining our authority and destabilizing the nation."

 PAW_underground_resistance_3:0 "Underground Resistance"
 PAW_underground_resistance_3_desc:0 "Our operations against the resistance have weakened them considerably, though pockets of opposition remain."

 PAW_imprisoned_resistance:0 "Imprisoned Resistance"
 PAW_imprisoned_resistance_desc:0 "The captured resistance fighters now toil in our factories. Their forced labour has become a cornerstone of our industrial output."

 PAW_executed_resistance:0 "Executed Resistance"
 PAW_executed_resistance_desc:0 "The resistance has been ruthlessly put down. The executions have emboldened our military and intelligence apparatus."

 PAW_breaking_elwins_hold:0 "Breaking Elwin's Hold"
 PAW_breaking_elwins_hold_desc:0 "With internal matters resolved, we now set our sights on breaking free from the Katsilbershirts' control. Our forces are primed for the fight."
