 # National Spirits - Existing
 PAW_no_central_authority:0 "No Central Authority"
 PAW_no_central_authority_desc:0 "Without a functioning central government, our nation is in disarray. Stability is crumbling, factories sit idle, and the populace refuses to serve."

 PAW_no_central_authority_1:0 "No Central Authority"
 PAW_no_central_authority_1_desc:0 "Though we have taken steps to restore order, the remnants of anarchy still hamper our efforts. Government authority is slowly being re-established."

 PAW_banditism:0 "Banditism"
 PAW_banditism_desc:0 "Roving bands of criminals terrorize the countryside. While they destabilize our nation, their activities fuel extremist ideologies on both sides."

 PAW_banditism_2a:0 "Banditism"
 PAW_banditism_2a_desc:0 "Our crackdown on the bandits has reduced their influence significantly. Criminal activity is declining, though some remnants persist."

 PAW_banditism_2b:0 "Banditism"
 PAW_banditism_2b_desc:0 "We have co-opted the bandit networks to serve our purposes. Their chaos is now channeled in our favour."

 PAW_underground_resistance:0 "Underground Resistance"
 PAW_underground_resistance_desc:0 "A shadowy resistance movement operates beneath the surface, undermining our authority and destabilizing the nation."

 PAW_underground_resistance_3:0 "Underground Resistance"
 PAW_underground_resistance_3_desc:0 "Our operations against the resistance have weakened them considerably, though pockets of opposition remain."

 PAW_imprisoned_resistance:0 "Imprisoned Resistance"
 PAW_imprisoned_resistance_desc:0 "The captured resistance fighters now toil in our factories. Their forced labour has become a cornerstone of our industrial output."

 PAW_executed_resistance:0 "Executed Resistance"
 PAW_executed_resistance_desc:0 "The resistance has been ruthlessly put down. The executions have emboldened our military and intelligence apparatus."

 PAW_breaking_elwins_hold:0 "Breaking Elwin's Hold"
 PAW_breaking_elwins_hold_desc:0 "With internal matters resolved, we now set our sights on breaking free from the Katsilbershirts' control. Our forces are primed for the fight."

 # National Spirits - New
 PAW_freed_resistance:0 "Freed Resistance"
 PAW_freed_resistance_desc:0 "The resistance fighters have been freed from captivity. While they bolster the anti-fascist movement, their release has destabilized the political situation."

 PAW_revolutionary_war:0 "Revolutionary War"
 PAW_revolutionary_war_desc:0 "The revolution is underway! The people rally to defend the new government against the fascist holdouts."

 PAW_workers_movement:0 "Workers Movement"
 PAW_workers_movement_desc:0 "A strong workers movement drives communist ideology forward while stabilizing the nation."

 PAW_liberal_movement:0 "Liberal Movement"
 PAW_liberal_movement_desc:0 "A growing liberal movement pushes for democratic reform alongside the workers."

 PAW_workers_movement_free:0 "Workers Movement"
 PAW_workers_movement_free_desc:0 "A moderate workers movement contributes to national stability."

 PAW_liberal_movement_free:0 "Liberal Movement"
 PAW_liberal_movement_free_desc:0 "A strong liberal movement drives democratic reform and stabilizes the nation."

 PAW_growing_asf_conflicts:0 "Growing ASF Internal Conflicts"
 PAW_growing_asf_conflicts_desc:0 "Internal conflicts within the ASF are growing. The party is fracturing between competing factions."

 PAW_the_vanguard:0 "The Vanguard"
 PAW_the_vanguard_desc:0 "The vanguard party leads the revolution with an iron will, though at the cost of popular stability."

 PAW_internationalist_support:0 "Internationalist Support"
 PAW_internationalist_support_desc:0 "Our outreach to Valerwria Katzin has borne fruit, bringing international solidarity to our cause."

 PAW_peoples_militia:0 "Peoples Militia"
 PAW_peoples_militia_desc:0 "The people have been armed to defend the revolution. The militia bolsters both communist and democratic movements."

 PAW_peoples_security_division:0 "Peoples Security Division"
 PAW_peoples_security_division_desc:0 "An elite security division protects the revolution and expands our intelligence capabilities."

 PAW_peoples_republic:0 "Peoples Republic"
 PAW_peoples_republic_desc:0 "The reformed state apparatus provides stable governance and political legitimacy."

 PAW_empowered_unions:0 "Empowered Unions"
 PAW_empowered_unions_desc:0 "The trade unions wield enormous power, boosting production at the cost of construction efficiency and war readiness."

 PAW_focus_on_pawris_development:0 "Focus on the Development of Pawris"
 PAW_focus_on_pawris_development_desc:0 "Nikolai Meowkharin's economic vision focuses on developing Pawris through civilian industry and construction."

 PAW_two_year_plan:0 "2 Year Plan"
 PAW_two_year_plan_desc:0 "A comprehensive economic plan directs the nation's resources toward rapid industrialization."

 PAW_non_hierarchical_economy:0 "Non-Hierarchical Economy"
 PAW_non_hierarchical_economy_desc:0 "The economy operates on non-hierarchical principles. Stability is high but productive capacity is limited."

 PAW_peasant_worker_alliance:0 "Peasant-Worker Alliance"
 PAW_peasant_worker_alliance_desc:0 "The workers and peasants have formed an uneasy alliance, reducing consumer goods needs but straining stability."

 PAW_workers_before_peasants:0 "Workers before Peasants"
 PAW_workers_before_peasants_desc:0 "The industrial workers take priority over the agrarian peasantry, boosting stability at some economic cost."

 PAW_synd_coordination_bonus:0 "Industry-Wide Coordination"
 PAW_synd_coordination_bonus_desc:0 "Coordinated industrial efforts improve construction speed and factory output across the nation."

 PAW_planned_coordination_bonus:0 "Industry-Wide Coordination"
 PAW_planned_coordination_bonus_desc:0 "Coordinated industrial efforts improve construction speed and factory output across the nation."

 # Dynamic Modifier Localisation
 PAW_local_soviet_administration:0 "Local Soviet Administration"
 PAW_local_soviet_administration_desc:0 "Regional soviet councils manage local administration, improving economic output."

 PAW_syndicalist_state:0 "Syndicalist State"
 PAW_syndicalist_state_desc:0 "The syndicalist state empowers worker councils, providing stability and communist support."

 PAW_syndicalist_economics:0 "Syndicalist Economics"
 PAW_syndicalist_economics_desc:0 "The economy is organized along syndicalist lines, with worker cooperatives managing production."

