 # Leader Traits
 PAW_no_concrete_leadership:0 "No Concrete Leadership"
 PAW_no_concrete_leadership_desc:0 "Without clear leadership, the partisan movement struggles to maintain cohesion."

 PAW_soviet_congress:0 "Soviet Congress"
 PAW_soviet_congress_desc:0 "Collective governance through the Soviet Congress provides stability but slows political decision-making."

 PAW_staunch_revolutionary:0 "Staunch Revolutionary"
 PAW_staunch_revolutionary_desc:0 "A dedicated revolutionary who inspires the masses and drives the war effort forward."

 PAW_anarchist_firebrand:0 "Anarchist Firebrand"
 PAW_anarchist_firebrand_desc:0 "A passionate anarchist whose fiery rhetoric galvanizes the war effort."

 PAW_market_socialist:0 "Market Socialist"
 PAW_market_socialist_desc:0 "A pragmatic market socialist whose economic policies reduce consumer goods requirements."

 # Event Localisation
 PAW_event_1_title:0 "The Fascist Uprising"
 PAW_event_1_desc:0 "The fascist supporters, furious at the coup, have risen up in armed rebellion! We must crush them to secure the revolution."
 PAW_event_1_a:0 "To arms!"

 # Decision Localisation
 PAW_economic_decisions:0 "Pawris Economic Decisions"
 PAW_economic_decisions_desc:0 "Economic decisions available to the Pawris Authority."

 PAW_synd_industry_coordination:0 "Industry-Wide Coordination"
 PAW_synd_industry_coordination_desc:0 "Coordinate industrial efforts across all syndicalist sectors to improve efficiency."
 PAW_synd_industry_coordination_tt:0 "Modify §W$PAW_syndicalist_economics$§! by:\n§W$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$§!: §G+5%§!\nAlso grants §G+5%§! factory output."

 PAW_synd_import_construction:0 "Import Construction Goods"
 PAW_synd_import_construction_desc:0 "Import construction materials from abroad. Uses 5 civilian factories for 30 days, then grants 2 permanent civilian factories."

 PAW_synd_militarize_unions:0 "Militarize the Unions"
 PAW_synd_militarize_unions_desc:0 "Convert civilian factories to military production. Removes 3 civilian factories and adds 4 military factories."

 PAW_synd_militarize_unions_improved:0 "Militarize the Unions"
 PAW_synd_militarize_unions_improved_desc:0 "Convert civilian factories to military production. Removes 2 civilian factories and adds 4 military factories."

 PAW_planned_industry_coordination:0 "Industry-Wide Coordination"
 PAW_planned_industry_coordination_desc:0 "Coordinate industrial efforts across all planned sectors to improve efficiency."

 PAW_planned_import_construction:0 "Import Construction Goods"
 PAW_planned_import_construction_desc:0 "Import construction materials from abroad. Uses 5 civilian factories for 30 days, then grants 2 permanent civilian factories."

 PAW_planned_construct_military:0 "Construct Military Factories"
 PAW_planned_construct_military_desc:0 "Redirect civilian production toward military needs. Removes 2 civilian factories and adds 4 military factories."
