 LOK_high_command.1.t:0 "[lok_hc_member_being_dealt_with.GetName]'s Fate"
 LOK_high_command.1.d:0 "Following the subjugation of [?lok_hc_member_being_dealt_with.katzen_high_command_member_prev_country.GetName], we have located former High Command member [lok_hc_member_being_dealt_with.GetName]. They have proven to be quite cooperative and are willing to work with our government, provided we absolve them of previous allegiances."
 LOK_high_command.1.a:0 "They are welcome within our ranks!"
 LOK_high_command.1.b:0 "They can go live their lives."
 LOK_high_command.1.c:0 "They deserve prison for their crimes!"
 LOK_high_command.1.e:0 "Execute them at once!"
 LOK_high_command.1.f:0 "EXECUTE THIS... TRAITOROUS FAILURE!"
 LOK_high_command.1.a.tt:0 "§Y[lok_hc_member_being_dealt_with.GetName]§! §Gjoins§! our country!"
 LOK_high_command.1.b.tt:0 "§Y[lok_hc_member_being_dealt_with.GetName]§! §Yretires§!. They may be freed by someone else if we are subjugated."
 LOK_high_command.1.c.tt:0 "§Y[lok_hc_member_being_dealt_with.GetName]§! is §Ojailed§!. They may be freed by someone else if we are subjugated."
 LOK_high_command.1.e.tt:0 "§Y[lok_hc_member_being_dealt_with.GetName]§! is §Rkilled§! and will not be recruitable by anyone else."
