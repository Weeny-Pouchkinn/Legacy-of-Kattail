 lok_katzen_high_command_cat:0 "The Katzen High Command"
 lok_katzen_high_command_cat_desc:0 "Kattail had recruited the Herzlands' finest to lead his conquests, and as the Imperium scattered, so did they. They now serve various duties throughout the Herzlands and beyond, and may be convinced to work with us if our ideals align with theirs. Or they could be brought to justice.\n\nWe currently possess §Y[?ROOT.katzen_high_command_member_count]§! out of §Y[?global.katzen_high_command_member_count_total]§! surviving Katzen High Command members. \n\n§Y$AUR_Pawtton$§! (Ground Troops) - [AUR_Pawtton.owner.GetName] [AUR_Pawtton.GetLeaderStatus]\n§Y$AUR_Meorwin$§! (Armor) - [AUR_Meorwin.owner.GetName] [AUR_Meorwin.GetLeaderStatus]\n§Y$NAV_Koko_Von_Beumien$§! (Submarine Forces) - [NAV_Koko_Von_Beumien.owner.GetName] [NAV_Koko_Von_Beumien.GetLeaderStatus]\n§Y$NAV_Kimitz$§! (Grand Admiral) - [NAV_Kimitz.owner.GetName] [NAV_Kimitz.GetLeaderStatus]\n§Y$CLE_Itch$§! (Police) - [CLE_Itch.owner.GetName] [CLE_Itch.GetLeaderStatus]\n§Y$FRA_Hell$§! (Anomalous Research) - [FRA_Hell.owner.GetName] [FRA_Hell.GetLeaderStatus]\n§Y$CAT_Rex$§! (Head Economist) - [CAT_Rex.owner.GetName] [CAT_Rex.GetLeaderStatus]\n§Y$FSR_Stefan_Katzauffe$§! (Colonial Integration) - [FSR_Stefan_Katzauffe.owner.GetName] [FSR_Stefan_Katzauffe.GetLeaderStatus]\n§Y$OST_Katzhaum$§! (Infrastructure) - [OST_Katzhaum.owner.GetName] [OST_Katzhaum.GetLeaderStatus]\n§Y$KTW_Douclaw$§! (Generalissimo) - [KTW_Douclaw.owner.GetName] [KTW_Douclaw.GetLeaderStatus]\n§Y$FOD_Loris$§! (Head Governor) - [FOD_Loris.owner.GetName] [FOD_Loris.GetLeaderStatus]"
 leader_is_free:0 "- §GFREE§!"
 leader_is_retired:0 "- §YRETIRED§!"
 leader_is_jailed:0 "- §OJAILED§!"
 leader_is_dead:0 "§RDEAD§!"

