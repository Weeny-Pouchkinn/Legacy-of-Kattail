 SPQ_idea_aurelian_democracy:0 "Aurelian Democracy"
 SPQ_idea_aurelian_democracy_desc:0 "Aurelian Democracy is the most disfunctional and inefficient democracy in Flusion. A grand total of 12 people holds Veto power, and chronic filibustering plauges the senate. Everytime a minor bill is passed, a party is called and people celebrates, and when major bills passes, a historical moment is witnessed."
