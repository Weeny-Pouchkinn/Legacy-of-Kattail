 # National Spirit
 SPQ_idea_aurelian_democracy:0 "Aurelian Democracy"
 SPQ_idea_aurelian_democracy_desc:0 "Aurelian Democracy is the most disfunctional and inefficient democracy in Flusion. A grand total of 12 people holds Veto power, and chronic filibustering plauges the senate. Everytime a minor bill is passed, a party is called and people celebrates, and when major bills passes, a historical moment is witnessed."

 SPQ_idea_aurelian_democracy_s:0 "Aurelian Democracy"
 SPQ_idea_aurelian_democracy_s_desc:0 "Aurelian Democracy is the most disfunctional and inefficient democracy in Flusion. A grand total of 12 people holds Veto power, and chronic filibustering plauges the senate. Everytime a minor bill is passed, a party is called and people celebrates, and when major bills passes, a historical moment is witnessed."
 
 SPQ_idea_excapature_science_1:0 "Excapature Science"
 SPQ_idea_excapature_science_1_desc:0 "The grasp, and completely monopoly Excapature has over Aurelia gives them influence within the senate, causing them to win every single contract. Despite this, as with the nature of Aurelian Politics, Excapature is unable to influence the senate beyond giving them the national budget, as any attempts will result in someone vetoing the whole bill, or years long of filibustering."

 SPQ_idea_aurelian_economy:0 "Aurelian Economy"
 SPQ_idea_aurelian_economy_desc:0 "Every month, the Consumer Goods Factories factor changes by 2.5% towards Equilibrium."
 SPQ_aurelian_economy_tt: "Consumer Goods Factor Equilibrium:§G [?SPQ_consumer_goods_base|=%1]§!"
 SPQ_aurelian_economy_fake_tt: "Consumer Goods Factor Equilibrium:§G [?SPQ_consumer_goods_base|=%1]§!\nConsumer Goods Factories factor: §Y[?SPQ_consumer_goods_factor_var|%1]§!.\n"

 SPQ_idea_realpolitik:0 "Realpolitik"
 SPQ_idea_realpolitik_desc:0 "Aurelia is a small nation, rich, but nontheless small. In order to survive on Flusion, it must be a neutral country. However, neutrality means we will not recieve the same benefits other countries who align with greater powers might. Instead, we can conduct Realpolitik, choosing what's most practical, and most beneficial for Aurelia."

 SPQ_solaria_joint_market:0 "Aurelia-Solaria Joint Market"
 SPQ_solaria_joint_market_desc:0 "By joining our economy with Solaria and gaining their technologies, we are able to access a much bigger market to export to, a new market, for Excapature Science to conquer. Any concerns on Solarians coming into Aurelian market and competing against Excapature is nthing but a fever dream with the Excapature brand loyalty Aurelians have."

 SPQ_idea_aurelian_payment:0 "Aurelian Payment"
 SPQ_idea_aurelian_payment_desc:0 "If the number is positive, we are paying Aurelia, if negative, Aurelia is paying us."
 # Focuses

 SPQ_focus_perpetual_senate:0 "The Perpetual Senate"
 SPQ_focus_perpetual_senate_desc:0 "The Senate has existed for 3,000 long years, becoming a perpetual part of Aurelain lives, always present, earning it the name "Perpetual Senate". However, there is a second meaning to the name, a description of the perpetual deadlock within the senate, the perpetual filibustering, and the perpetual vetoes issued by either of the 2 consuls, or 1 of the 10 Tribune of the Plebs."

