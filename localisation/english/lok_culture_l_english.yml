 culture_group_1_name:0 "§2Herzlander§!"
 culture_group_1_desc:0 "\n§LKatzens from the Northern Herzlands.§!"

 culture_1_name:0 "§2Katownite§!"
 culture_1_desc:0 "\n§LIn odd contrast with the surrounding Nordherzlanders, the people of Katown are surprisingly xenophilic and more open-minded to societal reform than most Herzlanders. Ninetheless, they are convinced of their great megalopolis' utter splendor and wish for the whole world to marvel at it.§!"
 culture_1_full:0 "$culture_1_name$ is part of the $culture_group_1_name$ $culture_group$.$culture_1_desc$"

 culture_2_name:0 "§5Sudherzlander§!"
 culture_2_desc:0 "\n§LSudherzlanders are amongst the most xenophilic of Herzlanders. Historically involved in large-scale intercontinental trade owing to their proximity to the Solakatzen Channel and the Sun Sea, they are quick to forge ties with other nations as to bolster trade. Ultimately though, their goals remain to peacefully enrich themselves and the southern Herzlands as much as possible."
 culture_2_full:0 "$culture_2_name$ is part of the $culture_group_1_name$ $culture_group$.$culture_2_desc$"

 culture_3_name:0 "§3Mittelherzlander§!"
 culture_3_desc:0 ""
 culture_3_full:0 "$culture_3_name$ is part of the $culture_group_1_name$ $culture_group$.$culture_3_desc$"

 culture_4_name:0 "§4Ostherzlander§!"
 culture_4_desc:0 ""
 culture_4_full:0 "$culture_4_name$ is part of the $culture_group_1_name$ $culture_group$.$culture_4_desc$"

 culture_20_name:0 "§6Chalsacian§!"
 culture_20_desc:0 "\n§LThe Chalsacian culture is most present amongst Katzen colonizers, mostly from the Northern Herzlands, who settled in northeastern Solakea during the Crusade. Now bereft of their Imperium, they strive to fend off Solakean nations wishing to see them expelled. They tend to reject the local cultures of surrounding Solakean natives, instead wishing to be perceived as Herzlandish.§!"
 culture_20_full:0 "$culture_20_name$ is part of the $culture_group_1_name$ $culture_group$.$culture_20_desc$"

 culture_21_name:0 "§2Nordherzlander§!"
 culture_21_desc:0 "\n§LForming the heart of Felinea, and by far the most populous Katzen culture, Nordherzlanders value merit above all else. It is upon them that the Kaiser built his Imperium, with its collapse ultimately pushing them towards internecine strife as they vie to reunite their kin's shattered heart.§!"
 culture_21_full:0 "$culture_21_name$ is part of the $culture_group_1_name$ $culture_group$.$culture_21_desc$"

