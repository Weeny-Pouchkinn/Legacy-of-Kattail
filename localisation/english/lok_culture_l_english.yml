 culture_6_name:0 "§0Active Roqualian§!"
 culture_6_desc:0 "\n§LActive Roqualian cultures favor content where one directly interacts with the medium, which itself reacts to those interactions, leading to a propensity for gaming, both physical or digital. Far from being monolithic, these are further subdivided into hundreds of various subculture across Roqualia's territory and within expatriated communities. The differences mostly revolve around the type of entertainment being consumed: some Roqualian groups, generally in deep rural regions, will prefer more traditional board games, while others will go all-in into digital entertainment as soon as it is invented, further specializing into a myriad of different cultures each centered around a different type of game. They are mostly found in the eastern part of Roqualia, and are generally more 'dominant' in the nation as a whole.§!"
 culture_6_full:0 "$culture_6_name$ is part of the $culture_group_2_name$ $culture_group$.$culture_6_desc$"

 culture_7_name:0 "§1Reflective Roqualian§!"
 culture_7_desc:0 "\n§LReflective cultures are drawn the creation and enjoyment of 'one-sided' content that is to be consumed and interpreted by whoever receives it. Reflective Roqualians will thus gravitate towards television shows, radio talks, songs as well as visual art mediums, such as painting or drawing. Others will favor physical expression, for example via dancing or singing. They are more found in the western half of Roqualia.§!"
 culture_7_full:0 "$culture_7_name$ is part of the $culture_group_2_name$ $culture_group$.$culture_7_desc$"

