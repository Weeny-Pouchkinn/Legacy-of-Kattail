 orbital_logistics:0 "§5Orbital Logistics Capacity§!"
 orbital_logistics_short:0 "§5OLC§!"
 space_exp:0 "§1Space Experience§!"
 flusion_exp:0 "§1Flusion Experience§!"
 muno_exp:0 "§1Muno Experience§!"
 xenon_exp:0 "§1Xenon Experience§!"
 lok_space_program_cat:0 "Space Program Management"
 lok_space_program_cat_desc:0 "The Jublio System is full of vast worlds ready to be colonized and exploited for science or profit. While the Imperium pioneered many fields of space exploration, the orbital launch scene grew quiet after its Collapse as the world reeled from the Crusade's aftermath. But this slump in space activity won't last forever, and new contenders will soon rise to claim the heavens for themselves.\n\n§HGENERAL SPACE PROGRAM§! ($space_exp$ - §H[?ROOT.space_exp]§!)\n§GTotal Launches§! - §H[?ROOT.total_launches]§!\n§LSpace is very, very hard, and so brazenly rushing to the stars is rather ill-advised. For every space-related technology or milestone that we accomplish, we will gain §1Space Experience§!, which will both increase our space research speed and reduce the odds of mission failures. Undertaking missions on particular bodies will net both general space experience and experience related to that body.§!\n\n§5ORBITAL LOGISTICS§!\nOur operations require §H[?ROOT.orbital_logistics_demand]§! $orbital_logistics$ each week.\n§H[?ROOT.modifier@lok_orbital_logistics_extra]§! is required by ongoing launches and projects.\n§H[?ROOT.lok_muno_colonies_upkeep]§! is required by long-term operations on $muno_name$\n§H[?ROOT.lok_xenon_colonies_upkeep]§! is required by long-term operations on $xenon_name$\n\nLast week, our fleet provided §H[?ROOT.orbital_logistics_current|1]§! $orbital_logistics$[ROOT.GetNervaHeavyRocket][ROOT.GetReusableHeavyChemicalRocket][ROOT.GetReusableLightChemicalRocket][ROOT.GetHeavyChemicalRocket][ROOT.GetLightChemicalRocket][ROOT.GetOrbitalLogisticsDeficit]\n\nWe have §H[?ROOT.orbital_logistics_spare|1]§! spare and can provide up to §H[?ROOT.orbital_logistics_max|1]§!.\n\n§7FLUSION PROGRAM§! ($flusion_exp$ - §H[?ROOT.flusion_exp]§!)\n§3Spying Satellites§! - §H[?ROOT.spy_sat_count]§!\n§4Comms Satellites§! - §H[?ROOT.comms_sat_count]§!\n§7Science Satellites§! - §H[?ROOT.science_sat_count]§!\n\n§gMUNO PROGRAM§! ($muno_exp$ - §H[?ROOT.muno_exp]§!)\nShare of Muno Surveyed - §H30%§!\nTotal Muno Colony Level - §H[?ROOT.lok_muno_colonies_level]§!\nTotal Muno Population - §H[?ROOT.lok_muno_colonies_pop|1]k§!\nRequired $orbital_logistics$ - §H[?ROOT.lok_muno_colonies_upkeep]§! (§H[?ROOT.orbital_logistics_capacity]§! available)\n\n§8XENON PROGRAM§! ($xenon_exp$ - §H[?ROOT.xenon_exp]§!)\nShare of Xenon Surveyed - §H30%§!\nTotal Xenon Colony Level - §H[?ROOT.lok_xenon_colonies_level]§!\nTotal Xenon Population - §H[?ROOT.lok_xenon_colonies_pop|1]k§!\nRequired $orbital_logistics$ - §H[?ROOT.lok_xenon_colonies_upkeep]§! (§H[?ROOT.orbital_logistics_capacity]§! available)"
 lok_survey_state_on_muno:0 "§gMUNO PROGRAM§!\nSurvey §2[From.GetName]§!\n(§RDifficulty§! - §H30§!)"
 lok_survey_state_on_muno_tt:0 "Gain ability to establish a base on §2[From.GetName]§!."
 lok_survey_state_on_muno_only_one:0 "Not already surveying parts of $muno_name$."
 lok_colonize_state_on_muno:0 "§gMUNO PROGRAM§!\nEstablish a $muno_name$ Base in §2[From.GetName]§!\n(§RDifficulty§! - §H100§!)"
 lok_space_mission_success:0 "the mission being a §GSUCCESS§!!\n§HMISSION EFFECTS§!"
 lok_space_mission_failure:0 "the mission being a §RFAILURE§!.\n§HMISSION EFFECTS§!"
 lok_space_mission_spacer:0 "-----------------------------------------------------------------"
 lok_survey_state_on_xenon:0 "§8XENON PROGRAM§!\nSurvey §2[From.GetName]§!\n(§RDifficulty§! - §H25§!)"
 lok_survey_state_on_xenon_tt:0 "Gain ability to establish a base on §2[From.GetName]§!."
 lok_survey_state_on_xenon_only_one:0 "Not already surveying parts of $xenon_name$."
 lok_colonize_state_on_xenon:0 "§8XENON PROGRAM§!\nEstablish a $xenon_name$ Base in §2[From.GetName]§!\n(§RDifficulty§! - §H80§!)"
 lok_build_up_xenon_colony:0 "§8XENON PROGRAM§!\nExpand our $xenon_name$ Colony in §2[From.GetName]§!\n(§RDifficulty§! - §H90§!)\n§LColony Level - §G[?FROM.space_colony_level]§!\nPopulation - §G[?FROM.state_population]§!§!"
 lok_build_up_xenon_colony_tt:0 "At §LColony Level§! §G3§!, all neighboring states will automatically be surveyed."
 lok_prepare_xenon_landing:0 "§8XENON PROGRAM§!\nPrepare for a crewed $xenon_name$ landing"
 lok_prepare_xenon_landing_desc:0 "The Imperium has demonstrated that regular flight to and from xenon was technologically doable, so let us waste no time restarting xenon-based activities!"
 lok_xenon_landing:0 "§8XENON PROGRAM§!\nUndertake a crewed $xenon_name$ landing (§RDifficulty§! - §H20§!)"
 lok_xenon_landing_desc:0 "We choose to go to xenon, not because it is easy, but because it is hard."
 xenon_landing_prepared:0 "We have prepared a $xenon_name$ landing."
 lok_xenon_landing_done:0 "We have already managed to land on $xenon_name$."
 lok_seize_the_mondkanone:0 "Seize the §YLunar Defence System§!"
 lok_seize_the_mondkanone_desc:0 "The international organization tasked with managing the Kaiser-built Lunar Defence System has outlived its purpose. It is in our own interest to seize it for ourselves."
 lok_seize_the_mondkanone_tt:0 "§RTHIS IS AN EXTREMELY AGGRESSIVE MANEUVER! THE WORLD WILL HATE US FOR IT.§!\nWe will need to have §Y1000§! $orbital_logistics$ spare to maintain the Lunar Defence System."

 # ============================================================
 # EVENTS
 # ============================================================

 LOK_space.2.t:0 "Muno Landing Successful!"
 LOK_space.2.d:0 "In the month of [GetMonth], [GetYear], our brave astronauts have set foot upon Muno's dusty surface for the first time in our nations history.\n\nThe crew spent several hours on the Munar surface gathering samples and taking pictures of interest, before returning to the ascent craft and heading back to Flusion.\n\nThey returned safe and sound, splashing down in the North Katlantic, where they were picked up by our recovery services and hailed as national heroes. Our populace is ecstatic at these wondrous news, and eagerly awaits the next step in our space program.\n\nThe mission has however raised concerns regarding the toxicity of Munian space dust which could hamper future colonization efforts, but our experts are confident that these issues will be able to be alleviated in the future... provided sufficient funding, of course."
 LOK_space.2.a:0 "Splendid!"
 LOK_space.3.t:0 "[lok_muno_landing_first_country.GetName] lands on Muno!"
 LOK_space.3.d:0 "[GetDateStringNoHourLong] marks a historic day for Flusion as indeed, astronauts belonging to [lok_muno_landing_first_country.GetNameDef] have today returned from a crew Muno landing, the first since the Imperium's collapse and the cessation of its space program. Following a short day-long trip, the [lok_muno_landing_first_country.GetAdjective] astronauts proudly touched down on Muno's dusty surface, where they gathered samples, took marvelous pictures of Flusion from afar, and of course patriotically planted the flag of their homeland onto Muno's barren grey landscape. Afterwards, they headed back to their module before taking off and splashing down in the North Katlantic safe and sound after yet another day of travel. This effectively marks the return of Flusionian activities on the planet's second moon, which are sure to only ramp up from now on."
 LOK_space.3.a:0 "A great feat!"
 LOK_space.1.t:0 "Mission Failure"
 LOK_space.1.d:0 "A recent space mission has ended in failure with loss of the associated vehicle and payload."
 LOK_space.1.a:0 "Damnit!"
 LOK_space.4.t:0 "Mission Success!"
 LOK_space.4.d:0 "Our recent space mission has yielded full success!"
 LOK_space.4.a:0 "Wonderful!"
 LOK_space.5.t:0 "Suborbital Flight Success"
 LOK_space.5.d:0 "Our suborbital flight over Flusion has been a complete success! The rocket reached the edge of space before safely returning to the surface. This is an important milestone for our space program."
 LOK_space.5.a:0 "A promising start!"
 LOK_space.6.t:0 "Suborbital Flight Failure"
 LOK_space.6.d:0 "Our suborbital flight has ended in failure. The rocket suffered a critical malfunction shortly after launch and was lost, along with its payload. Our engineers will study the telemetry data to determine the cause."
 LOK_space.6.a:0 "Back to the drawing board..."
 LOK_space.7.t:0 "Orbital Flight Success"
 LOK_space.7.d:0 "Our orbital flight around Flusion has been a resounding success! The spacecraft successfully achieved orbit, completed several revolutions around the planet, and returned safely. This marks a major step forward in our space capabilities."
 LOK_space.7.a:0 "The stars await!"
 LOK_space.8.t:0 "Orbital Flight Failure"
 LOK_space.8.d:0 "Our attempt to achieve Flusion orbit has ended in failure. The rocket was unable to reach the necessary velocity and the mission had to be aborted. Fortunately, our engineers have gained valuable data from the attempt."
 LOK_space.8.a:0 "We'll try again..."
 LOK_space.9.t:0 "Muno Landing Failure"
 LOK_space.9.d:0 "Our attempt to land on Muno has ended in disaster. The lander lost contact during its descent and is presumed destroyed upon impact with the Munar surface. This is a devastating setback for our Muno program."
 LOK_space.9.a:0 "A heavy blow..."
 LOK_space.10.t:0 "Muno Survey Success"
 LOK_space.10.d:0 "Our survey mission to Muno has returned excellent results! Our probes have successfully mapped and analyzed the target region, providing valuable data about the terrain, resources, and conditions on the Munar surface."
 LOK_space.10.a:0 "Excellent data!"
 LOK_space.11.t:0 "Muno Survey Failure"
 LOK_space.11.d:0 "Our Muno survey mission has failed. The survey probe experienced a systems malfunction in transit and was unable to complete its mapping objectives. The partial data recovered may still prove useful."
 LOK_space.11.a:0 "Unfortunate..."
 LOK_space.12.t:0 "Muno Colony Established!"
 LOK_space.12.d:0 "We have successfully established a colony on Muno! The first settlers have touched down and begun constructing habitation modules on the Munar surface. This marks the beginning of a permanent presence on our second moon."
 LOK_space.12.a:0 "A new frontier!"
 LOK_space.13.t:0 "Muno Colonization Failure"
 LOK_space.13.d:0 "Our colonization mission to Muno has ended in failure. The heavy cargo lander carrying colonization supplies crashed during its descent. This is a major setback for our Munar ambitions."
 LOK_space.13.a:0 "Devastating..."
 LOK_space.14.t:0 "Muno Colony Expanded"
 LOK_space.14.d:0 "Our Muno colony has been successfully expanded! New modules have been deployed and additional infrastructure has been constructed, increasing the colony's capacity and capabilities."
 LOK_space.14.a:0 "Growth on the frontier!"
 LOK_space.15.t:0 "Muno Colony Expansion Failed"
 LOK_space.15.d:0 "Our attempt to expand the Muno colony has failed. The supply shipment was lost during transit, and the colony will have to make do with its current infrastructure for now."
 LOK_space.15.a:0 "A costly failure..."
 LOK_space.16.t:0 "Xenon Landing Success!"
 LOK_space.16.d:0 "Our crew has successfully landed on the surface of Xenon! This distant world, so far from Flusion, is now within our reach. The astronauts have planted our flag and begun preliminary surveys of the landing site."
 LOK_space.16.a:0 "A giant leap!"
 LOK_space.17.t:0 "Xenon Landing Failure"
 LOK_space.17.d:0 "Our attempt to land on Xenon has ended in failure. The enormous distance and harsh conditions proved too much for our current technology. Contact was lost with the lander during its final approach."
 LOK_space.17.a:0 "The void claims another..."
 LOK_space.18.t:0 "Xenon Survey Success"
 LOK_space.18.d:0 "Our survey mission to Xenon has been a success! The probes have mapped the target region and returned valuable data about Xenon's surface conditions, resource deposits, and potential colonization sites."
 LOK_space.18.a:0 "Fascinating findings!"
 LOK_space.19.t:0 "Xenon Survey Failure"
 LOK_space.19.d:0 "Our Xenon survey mission has failed. The probe lost power during the long transit to Xenon and was unable to complete its survey objectives. The distance to Xenon makes every failure that much more costly."
 LOK_space.19.a:0 "Such a waste..."
 LOK_space.20.t:0 "Xenon Colony Established!"
 LOK_space.20.d:0 "We have successfully established a colony on Xenon! Despite the incredible distances involved, our settlers have landed safely and begun building a permanent outpost on this distant world. This is a monumental achievement."
 LOK_space.20.a:0 "History in the making!"
 LOK_space.21.t:0 "Xenon Colonization Failure"
 LOK_space.21.d:0 "Our colonization mission to Xenon has failed catastrophically. The colony ship was lost with all supplies during its approach to Xenon. This represents an enormous investment in resources and time, lost to the void."
 LOK_space.21.a:0 "An immense loss..."
 LOK_space.22.t:0 "Xenon Colony Expanded"
 LOK_space.22.d:0 "Our Xenon colony has been successfully expanded! New habitation modules and infrastructure have been deployed, increasing the colony's population capacity and operational capabilities."
 LOK_space.22.a:0 "Growing among the stars!"
 LOK_space.23.t:0 "Xenon Colony Expansion Failed"
 LOK_space.23.d:0 "Our attempt to expand the Xenon colony has failed. The resupply mission was lost during transit, and the colonists will have to endure with their current resources for the time being."
 LOK_space.23.a:0 "The frontier is unforgiving..."
 LOK_space.24.t:0 "Another Flusion Suborbital Flight"
 LOK_space.24.d:0 "Our rocket has completed another suborbital trajectory over Flusion without incident. What once required months of preparation and nail-biting suspense is now almost routine - the launch crew barely batted an eye. Progress, indeed."
 LOK_space.24.a:0 "All in a day's work."
 LOK_space.25.t:0 "Another Flusion Orbital Flight"
 LOK_space.25.d:0 "Yet another successful orbital mission around Flusion. The spacecraft completed its circuits precisely as scheduled and the crew returned without fanfare. Our orbital operations around Flusion have become so reliable they barely make the evening news anymore."
 LOK_space.25.a:0 "Routine orbit complete."
 LOK_space.26.t:0 "Another Muno Landing"
 LOK_space.26.d:0 "We've landed on Muno again. The novelty has worn thin for the public, who greeted the news with polite interest rather than wild celebration. Still, each mission advances our understanding of Muno and brings us ever closer to permanent habitation."
 LOK_space.26.a:0 "Just another Tuesday on Muno."
 LOK_space.27.t:0 "Another Muno Survey Completed"
 LOK_space.27.d:0 "Our survey team on Muno has returned with another set of geological maps and atmospheric readings. The process is becoming second nature to our scientists, who have refined their techniques considerably since those early tentative surveys."
 LOK_space.27.a:0 "The cartographers are pleased."
 LOK_space.28.t:0 "Another Muno Colony Founded"
 LOK_space.28.d:0 "Another colony has been planted on Muno's surface. The settlers arrived without incident and are already setting up their temporary habitation modules. Compared to our first colony, the whole operation went almost disappointingly smoothly."
 LOK_space.28.a:0 "Almost boring, really."
 LOK_space.29.t:0 "Muno Colony Expansion Completed"
 LOK_space.29.d:0 "The expansion of our Muno colony has been completed on schedule. The new modules have been integrated and the colonists have wasted no time making the extra space their own. The lunar frontier is becoming ever more habitable."
 LOK_space.29.a:0 "Building the future, brick by brick."
 LOK_space.30.t:0 "Another Xenon Landing"
 LOK_space.30.d:0 "Our lander has touched down on Xenon once more. While the distance still makes every mission a logistical challenge, we now have enough experience to execute the landing without the desperate improvisation of our earlier attempts. A successful run."
 LOK_space.30.a:0 "Far from home, but we've been here before."
 LOK_space.31.t:0 "Another Xenon Survey Completed"
 LOK_space.31.d:0 "Survey probes have finished mapping another region of Xenon. Our research teams are growing quite adept at analyzing the data streaming back from those remote instruments. What once demanded frenzied all-nighters has become routine shift work."
 LOK_space.31.a:0 "The universe yields its secrets, slowly."
 LOK_space.32.t:0 "Another Xenon Colony Founded"
 LOK_space.32.d:0 "A new colony has been established on Xenon. The settlers touched down safely and have begun the long process of making the alien world their home. With each new foothold, the immense distances feel just a little less daunting."
 LOK_space.32.a:0 "Another outpost among the stars."
 LOK_space.33.t:0 "Xenon Colony Expansion Completed"
 LOK_space.33.d:0 "The latest expansion of our Xenon colony has gone smoothly. Our logistics chain across the void is growing mature and reliable. The colonists, veterans of frontier living by now, integrated the new modules with practiced efficiency."
 LOK_space.33.a:0 "The frontier becomes civilization."
