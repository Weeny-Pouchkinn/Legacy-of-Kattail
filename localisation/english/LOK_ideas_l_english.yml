l_english:
 nationalism_idea:0 "Nationalism"
 nationalism_idea_desc:0 "Our people's hearts burn with nationalistic pride and they will fight hard to protect our homeland"

 nation_attributes:0 "National Attributes"
 specialty:0 "Technological Specialty"
 specialty_nuclear:0 "§GNuclear§! Specialty"
 specialty_nuclear_desc:0 "Owing to its heritage, this nation has become particularly skilled in the fields of nuclear science."
 specialty_computing:0 "§HComputing§! Specialty"
 specialty_computing_desc:0 "Owing to its heritage, this nation has become particularly skilled in the fields of computer science."
 computing_tech_research:0 "Computing Research Speed"
 specialty_nothing:0 "§8General§! Technological Knowledge"
 specialty_nothing_desc:0 "This nation has not invested in any given field more than another during its history. While this grants it no particular edge, it does provide some technological flexibility."
 specialty_lacking_tech:0 "§RLackluster§! Technological Base"
 specialty_lacking_tech_desc:0 "This nation has, throughout its history, systematically found itself in opposition with technological and industrial progress. While change and reform may bring them to modernity regardless, one simply cannot undo centuries of history in mere decades, and so they will always lag a little bit behind."

 gestalt_mobilization:0 "Gestalt Mobilization" #AI-Generated Placeholder, change later!
 gestalt_mobilization_desc:0 "This society operates as an interconnected gestalt, drawing total commitment from every unit. Non-core populations, however, are entirely excluded from this system." #AI-Generated Placeholder, change later!

 cabinet:0 "Political Cabinet"
 head_of_gov:0 "Head of Government"
 KTN_Never_Invaded:0 "Bulwark of Arivoejo"
 KTN_Never_Invaded_desc:0 "Despite Kattail's best attempts, against unrelenting bombardment and all odds, our great navy stood strong in the Herzlanders' face and deflected invasion attempt after invasion attempt. Thanks to us and our allies, Arivoejo's shores remained free of Herzlander boots."
 MCF_The_Loose_Realms:0 "The Loose Realms"
 MCF_The_Loose_Realms_desc:0 "The myriad and once disunited Cloudstrider Realms were brought together under Queen Rose in the wake of the Imperium's hastened retreat and subsequent collapse. Never before has such unity been achieved in the region, and so getting everyone to act in harmony is easier said than done."
 MCF_Grand_Airforce:0 "The Propeller Corps"
 MCF_Grand_Airforce_desc:0 "As the rest of Flusion speeds towards ever faster jet engines, the Cloudstriders have taken a liking for the slower, yet reliable and cheaper propeller-driven aircraft. They are determined to improve these to the utmost."
 MCF_Scrappy_Industrialization:0 "Industrialization Upon Katzen Scraps"
 MCF_Scrappy_Industrialization_desc:0 "The Imperium came and went, leaving behind heaps of wrecked vehicles, factories and, whenever the POWs agree to cooperate, expertise. Tremendous effort is being spent to extract knowledge and apply it throughout the Cloudstrider economy as fast as possible."
 PRL_Gateway_To_Herzlands:0 "Gateway to the Herzlands"
 PRL_Gateway_To_Herzlands_desc:0 "As the rest of the Herzlands tears itself apart, Purrlin-Lionsburg prefers to look outwards. Tremendous effort has been invested into keeping up the facade of a stable, civilized nation as to attract foreign traders back into Felinea and redistribute their negociated bounty amongst the neediest of the warlords, for a price."
 PRL_The_Vampire_Megacities:0 "The Twin Vampires"
 PRL_The_Vampire_Megacities_desc:0 "Owing to their size, logistical connections, and lack of damage from the Collapse, Purrlin and Lionsburg appear as economic titans relative to the rest of the nation. Their appeal amongst the populace is such that the countryside finds itself utterly starved of talent, investment and public services."
 PRL_Lionsburg_Favored:0 "Lionsburg Primacy"
 PRL_Lionsburg_Favored_desc:0 "Bereft of any other opponents, Purrlin and Lionsburg compete primarily with one another. Current government policies have clearly favored Lionsburg, the south's greatest industrial zone."
 CAT_Drakwald_Logging:0 "Drakwald Logging"
 CAT_Drakwald_Logging_desc:0 "Along the Drakwald River grows the mighty Drakwald Jungle, spanning for thousands upon thousands of hectares. It may not do so for long, however, as local governments happily empower local corporations in their efforts to extract wealth, both mineral and vegetal, from the rainforest."
 LIO_Bulwark_of_Katzenkind:0 "Bulwark of Katzenkind"
 LIO_Bulwark_of_Katzenkind_desc:0 "In distant times the lands of Lionita were held by a patchwork of noble marchs vowing to protect the Herzlands from foreign invaders. Now as the Collapse leaves Felinea more vulnerable than ever, noble heirs and abandoned military corps have joined forces to once more uphold their ancestors' vows."
 KEP_Picking_Up_The_Frontier:0 "The Commandeered Frontier"
 KEP_Picking_Up_The_Frontier_desc:0 "As the Katzen colony of Neusuburbien in Plaveta unraveled following the Collapse, eager Roqualian entrepreneurs and colonial enthusiasts rushed in to commandeer the Kaiser's failing venture. Many of them pro-Katzen collaborators from the Nouvel Etat Roqualien fleeing  persecution from Dofus' victorious government. Yet both the Katzen inhabitants and the Lihler natives are somewhat unhappy with this new state of affairs."
 KEP_Lihler_Ambitions:0 "Plavetan Troubles"
 KEP_Lihler_Ambitions_desc:0 "What is now Quepler sits upon lands formerly inhabited by the  Lihler, then colonized by the Kaiser during the Crusade. They adamantly resisted Katzen colonization, managed to carve out a state for themselves again as the Collapse hit, and now those who remain just as adamantly resist Roqualian control over the region. Things are only made worse by Quepler's government obvious interest in re-securing all of Neusuburbien's former lands... "
 KEP_The_Dry_Lake:0 "The Great Lake's Corpse"
 KEP_The_Dry_Lake_desc:0 "At the heart of southeast Solakea there used to be a vast, gleaming shallow sea surrounded by flourishing shores. It is no more, as Katzen needs for power and industry saw the quasi-lake sealed off from the sea. Soon its waters receded and thus came countless mines and factories. Effects on the local climate and population have been utterly disastrous, but, just like the Katzens before them, the Quepler government deems the economic benefits a fair tradeoff."
 LOK_Katzen_POW_Troubles:0 "Forlorn Felines"
 LOK_Katzen_POW_Troubles_desc:0 "The Imperium's rapid Collapse left tens if not hundreds of thousands of Katzen soldiers, colonists and administrators trapped in our newly-reclaimed lands. Nowadays they fill up prisons or live in isolated communities in a manner most problematic, despite the expertise and knowledge they can sometimes provide. With our government at last mostly back together, a clear course is needed to handle these troublesome felines."
