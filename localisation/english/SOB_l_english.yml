l_english:
 under_katzen_shadow: "Under the Herzlands' Shadow"
 under_katzen_shadow_desc: "The gargantuan Herzlandish state and its billion feline souls loom over our state like a vulture. Whether we want it or not, Katzen immigrants, investors and tourists flock to our lands, tying them a little more around Katown's finger with each of their ventures."
