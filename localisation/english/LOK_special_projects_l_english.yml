 exotic_compound_rotorcraft:0 "Exotic Compound Rotorcraft"
 exotic_compound_rotorcraft_desc:0 "Atomic power, coaxial lift rotors, auxiliary thrust and active flight controls combine vertical lift with high forward speed. This architecture is the common technological foundation for both saturation platforms and transport gunships."
 heavy_submarine:0 "Nuclear Ballistic Submarine I"
 heavy_submarine_desc:0 "A strategic submarine built around protected missile tubes, quiet atomic propulsion and resilient command links, intended to preserve a retaliatory strike beneath the ocean."
 heavy_carrier:0 "Nuclear Supercarrier I"
 heavy_carrier_desc:0 "A nuclear-powered mobile airbase with the deck cycle, hangar volume and logistics capacity to sustain an air campaign far from friendly territory."
 heavy_carrier2:0 "Nuclear Supercarrier II"
 heavy_carrier2_desc:0 "A mature superscaled carrier integrates hardened command facilities, automated flight handling and deep defensive magazines into an ocean-going aerospace complex."
 heavy_battleship:0 "Super-Heavy Railgun Battleship I"
 heavy_battleship_desc:0 "An atomic dreadnought whose hull exists to power, cool and protect a strategic-caliber mass-driver battery."

 sp_armored_advanced_flamethrower_tech:0 "Advanced Thermobaric Projectors"
 sp_armored_advanced_flamethrower_tech_desc:0 "Protected launchers disperse and ignite thermobaric agents inside trenches, tunnels and reinforced structures, producing destructive overpressure where direct-fire shells cannot reach."

 armored_support_vehicle_1_desc:0 "Sensor fusion and autonomous route planning allow this armored platform to conduct hazardous engineering work with minimal crew exposure."
 assault_engineer:0 "Autonomous Assault Engineer Company"
 assault_engineer_desc:0 "Combat engineers supported by unmanned breaching, demolition and earthmoving vehicles."
 sp_armored_engineer_tech:0 "Autonomous Breaching Systems"
 sp_armored_engineer_tech_desc:0 "Robotic plows, demolition manipulators and route-planning systems breach defended obstacles without sacrificing crews at the point of contact."
 sp_armored_maintenance_tech:0 "Autonomous Recovery Systems"
 sp_armored_maintenance_tech_desc:0 "Uncrewed recovery tractors and diagnostic drones retrieve and stabilize damaged vehicles under fire."
 sp_armored_signal_tech:0 "Autonomous Signal Engineering Systems"
 sp_armored_signal_tech_desc:0 "Relay drones and self-deploying communications nodes restore battlefield networks without exposing signal teams."
 sp_armored_motorized_military_police_tech:0 "Autonomous Security Engineering Systems"
 sp_armored_motorized_military_police_tech_desc:0 "Persistent patrol vehicles, sensors and remote barriers automate route security and rear-area control."
 light_flame_tank:0 "Light Thermobaric Assault Vehicle Company"
 light_flame_tank_desc:0 "Light armored vehicles carrying thermobaric projectors for clearing dense terrain and field fortifications."
 medium_flame_tank:0 "Medium Thermobaric Assault Vehicle Company"
 medium_flame_tank_desc:0 "Medium armored vehicles carrying protected thermobaric systems into close assault range."
 heavy_flame_tank:0 "Heavy Thermobaric Assault Vehicle Company"
 heavy_flame_tank_desc:0 "Heavy armored vehicles designed to survive direct fire while delivering large thermobaric charges against hardened positions."
 land_multi_charge_large_caliber_gun_tech:0 "Fixed Long-Range Mass Driver"
 land_multi_charge_large_caliber_gun_tech_desc:0 "Permanent accelerator galleries and strategic fire-control networks make hypersonic bombardment possible at continental range."
 stronghold_network_tech:0 "Autonomous Fortification Network"
 stronghold_network_tech_desc:0 "Distributed sensors and hardened machine command nodes allow dispersed defenses to identify targets, allocate fires and continue operating when isolated."

 sp_nuclear_reactor_radioactive_leak_stabilized_reward:0 "Plasma Breach Stabilized"
 sp_nuclear_reactor_radioactive_leak_stabilized_reward_desc:0 "A confinement transient scorched the inner wall and contaminated a coolant loop with activated material. Rapid isolation prevented a facility-wide release, and the instrument record has given the team invaluable data on failure behavior."
 sp_nuclear_reactor_minor_explosion_reward:0 "Magnet Quench and Cryogenic Blast"
 sp_nuclear_reactor_minor_explosion_reward_desc:0 "A superconducting coil quenched during a high-power pulse. Expanding cryogens ruptured part of the test hall, but automatic shutdowns prevented plasma contact and no personnel were lost."
 sp_nuclear_reactor_tested_reward:0 "First Sustained Net-Positive Fusion Burn"
 sp_nuclear_reactor_tested_reward_desc:0 "The plasma remained stable long enough to return more usable energy than the complex consumed. Fusion has crossed the line from experiment to power source; the remaining task is to make the burn routine."
 sp_nuclear_reactor_tested_reward_public:0 "Connect the demonstration loop to the public grid"
 nuclear_reactor_tested_reward_classify:0 "Classify the burn data and harden the design"
 sp_nuclear_reactor_tested_reward_public_tt:0 "Foreign observers may infer details of our confinement system"
 sp_nuclear_reactor_tested_tech_bonus:0 "Received Data on Industrial Fusion Confinement"

 sp_air_jet_engine_unique_reward:0 "Ramjet Mission Priority"
 sp_air_jet_engine_unique_reward_desc:0 "Reactor geometry, shielding and inlet design cannot be optimized for every airframe at once. We must decide whether the first nuclear ramjets favor agile fighters, heavy bombers or a standardized core usable by both."
 sp_air_jet_engine_preference_fighter:0 "Compact Fighter Reactors"
 sp_air_jet_engine_preference_compromise:0 "Standardized Ramjet Cores"
 sp_air_jet_engine_preference_bomber:0 "High-Output Bomber Reactors"
 sp_air_jet_engine_fighter:0 "Nuclear Ramjet - Fighter Focus"
 sp_air_jet_engine_compromise:0 "Nuclear Ramjet - Standardized Core"
 sp_air_jet_engine_bomber:0 "Nuclear Ramjet - Bomber Focus"
 sp_air_supersonic_jet_unique_reward:0 "Orbital Airframe Cost Crisis"
 sp_air_supersonic_jet_unique_reward_desc:0 "Thermal tiles, reaction controls and nuclear-rated structures are driving the low-orbital aircraft far beyond its projected cost. We can simplify it, hold the baseline, or accept an elite platform built without compromise."
 sp_air_supersonic_jet_preference_cost_reduction:0 "Simplify the Thermal Structure"
 sp_air_supersonic_jet_preference_compromise:0 "Protect the Baseline Design"
 sp_air_supersonic_jet_preference_cost_increase:0 "No Compromise at Re-entry Speed"
 sp_air_supersonic_jet_cost_reduction:0 "Low-Orbital Aircraft - Economized Structure"
 sp_air_supersonic_jet_compromise:0 "Low-Orbital Aircraft - Balanced Integration"
 sp_air_supersonic_jet_cost_increase:0 "Low-Orbital Aircraft - Aerospace-Grade Construction"
 sp_air_supersonic_jet_fighter_free_design:0 "Low-Orbital Hypersonic Airframe"

 sp_land_reward_multi_charge_large_caliber_gun_test_failure:0 "Accelerator Gallery Rupture"
 sp_land_reward_multi_charge_large_caliber_gun_test_failure_desc:0 "A mistimed magnetic stage tore the projectile apart inside the accelerator, rupturing coils and throwing conductive debris through the test gallery. The emplacement and nearby infrastructure require extensive repair."
 sp_land_reward_multi_charge_large_caliber_gun_successful_test_firing:0 "Successful Horizon-Range Firing Test"
 sp_land_reward_multi_charge_large_caliber_gun_successful_test_firing_desc:0 "The mass driver placed a hardened projectile on its distant instrumented target with useful accuracy. Grid synchronization, guidance and accelerator timing all performed within tolerance."
 sp_land_reward_multi_charge_large_caliber_gun_breakthrough_in_propulsion_technology:0 "Breakthrough in Electromagnetic Acceleration"
 sp_land_reward_multi_charge_large_caliber_gun_breakthrough_in_propulsion_technology_desc:0 "A new switching sequence raises projectile velocity without exceeding the thermal limits of the accelerator stages, expanding both range and terminal effect."
 sp_land_reward_option_multi_charge_large_caliber_gun_successful_test_firing_desc:0 "$sp_land_reward_multi_charge_large_caliber_gun_successful_test_firing_desc$"
 sp_land_reward_option_multi_charge_large_caliber_gun_test_failure_desc:0 "$sp_land_reward_multi_charge_large_caliber_gun_test_failure_desc$"
 sp_land_reward_option_multi_charge_large_caliber_gun_breakthrough_in_propulsion_technology_desc:0 "$sp_land_reward_multi_charge_large_caliber_gun_breakthrough_in_propulsion_technology_desc$"

 sp_land_reward_stronghold_network_structural_weakness_discovered:0 "Hardened Node Vulnerability Discovered"
 sp_land_reward_stronghold_network_delayed_by_concrete_shortage:0 "Hardened Materials Shortage"
 sp_land_reward_stronghold_network_underground_rail_systems:0 "Autonomous Underground Logistics"
 sp_land_reward_stronghold_network_integration_of_anti_blast_doors:0 "Automated Anti-Blast Segmentation"
 sp_land_reward_stronghold_network_communication_system_overhaul:0 "Machine Command Network Overhaul"
 sp_land_reward_stronghold_network_communication_system_overhaul_desc:0 "Live exercises revealed that damaged relays could trap autonomous turrets in isolated decision loops. A redundant command protocol would let surviving nodes rebuild the network around destroyed links."
 sp_land_reward_option_stronghold_network_communication_system_overhaul_standardize:0 "Standardize the Redundant Protocol"
 sp_land_reward_option_stronghold_network_communication_system_overhaul_further_study:0 "Develop Fully Distributed Control"
 sp_land_reward_stronghold_network_leadership_approach:0 "Human Control Doctrine"
 sp_land_reward_stronghold_network_leadership_approach_desc:0 "The network can be tested under close human supervision or allowed to conduct exercises under machine control. Direct oversight reduces risk; autonomy exposes faults that scripted trials will never reveal."
 sp_land_reward_option_stronghold_network_leadership_approach_oversee_work_personally:0 "Keep a Human in Every Decision Loop"
 sp_land_reward_option_stronghold_network_leadership_approach_office_planning:0 "Authorize Autonomous Field Trials"
 sp_land_reward_stronghold_network_breakthrough_in_concrete_reinforcement_01:0 "Breakthrough in Self-Monitoring Armorcrete"
 sp_land_reward_stronghold_network_breakthrough_in_concrete_reinforcement_01_desc:0 "Embedded stress sensors and repair channels allow hardened structures to report damage and direct maintenance before fractures propagate through a command node."
 sp_land_reward_option_stronghold_network_breakthrough_in_concrete_reinforcement_01_apply_and_document_discovery:0 "Standardize the Sensor Lattice"
 sp_land_reward_option_stronghold_network_breakthrough_in_concrete_reinforcement_01_use_in_current_project:0 "Install It in Critical Nodes First"
 sp_land_reward_stronghold_network_breakthrough_in_concrete_reinforcement_02:0 "$sp_land_reward_stronghold_network_breakthrough_in_concrete_reinforcement_01$"
 sp_land_reward_stronghold_network_breakthrough_in_concrete_reinforcement_02_desc:0 "Outside trials confirm that the self-monitoring composite can localize structural damage. The network may adopt it before the final standards are complete."
 sp_land_reward_option_stronghold_network_collapse_01:0 "Autonomous Excavation Collapse"
 sp_land_reward_option_stronghold_network_collapse_01_desc:0 "An excavation drone followed corrupted survey data and undermined a bunker foundation, trapping workers and the lead scientist. Rescue priorities will determine both the human cost and the delay."
 sp_land_reward_option_stronghold_network_collapse_01_prioritize_scientist:0 "Recover the Lead Scientist First"
 sp_land_reward_option_stronghold_network_collapse_01_prioritize_safety:0 "Commit Every Drone to Rescue Work"
 sp_land_reward_option_stronghold_network_collapse_01_continue_without_delay:0 "Seal the Section and Continue"
 sp_land_reward_option_stronghold_network_collapse_02:0 "$sp_land_reward_option_stronghold_network_collapse_01$"
 sp_land_reward_option_stronghold_network_collapse_02_desc:0 "Faulty survey fusion caused an autonomous excavator to undermine a tunnel junction. Workers are trapped, logistics are severed and the schedule is already slipping."

 sp_land_reward_land_cruiser_overheating:0 "Reactor and Drive-Train Overheating"
 sp_land_reward_land_cruiser_chassis:0 "Landkreuzer Chassis Stress Failure"
 sp_land_reward_land_cruiser_chassis_desc:0 "Full-load trials twisted the immense hull around its suspension mounts. Reinforcement will increase mass; exotic structural alloys will increase cost; a redesign will delay the entire assault program."
 sp_land_reward_land_cruiser_engine:0 "Atomic Drive Output Insufficient"
 sp_land_reward_land_cruiser_engine_desc:0 "The Heavy Assault Landkreuzer can move, but not fast enough to breach before defenders reposition. Engineers propose overdriving the present power train or designing a larger atomic-electric transmission."
 sp_land_reward_land_cruiser_turret:0 "Primary Battery Alignment Failure"
 sp_land_reward_land_cruiser_turret_desc:0 "Hull flex and recoil are pulling the main weapon mounts out of alignment. Simplifying the battery improves reliability, while a new stabilization system preserves the intended firepower at considerable cost."
 sp_land_reward_land_cruiser_track:0 "Distributed Track System Failure"
 sp_land_reward_land_cruiser_track_desc:0 "Uneven loading cascaded through the linked track units and immobilized the prototype. The choice is between stronger running gear, reduced protection or accepting a machine tied to prepared routes."
 sp_land_reward_land_cruiser_communication:0 "Internal Battle-Network Saturation"
 sp_land_reward_land_cruiser_communication_desc:0 "Thousands of sensors, crew stations and weapon controls are overwhelming the internal network. A redesigned architecture could coordinate the Landkreuzer as one fighting system rather than a collection of competing compartments."
 sp_land_reward_land_cruiser_assembly:0 "Megastructure Precision Assembly"
 sp_land_reward_land_cruiser_assembly_desc:0 "Engineers developed survey-guided alignment methods for joining the enormous hull sections without locking stress into the finished vehicle. The process can be reserved for critical joints or imposed across production."
 sp_land_reward_land_cruiser_suspension:0 "Adaptive Hydropneumatic Suspension"
 sp_land_reward_land_cruiser_suspension_desc:0 "A networked suspension now redistributes the vehicle's weight before terrain loads can overload individual track units, substantially improving stability across broken ground."
 sp_land_reward_land_cruiser_ammunition:0 "Protected Autoloading Citadel"
 sp_land_reward_land_cruiser_ammunition_desc:0 "Compartmentalized magazines, armored transfer trunks and hydraulic loaders can move enormous ammunition safely through the hull while isolating a detonation from the crew and reactor spaces."
