 lok_puppet_management.1.t:0 "[ROOT.GetNameDef] Reunified"
 lok_puppet_management.1.d:0 "For a time, rival administrations each claimed to embody the same nation, their borders and institutions shaped by different foreign occupiers. Independence deprived that division of its purpose. Officials, officers and local delegates have now agreed to dissolve the competing governments and reunite their territories beneath a single national authority."
 lok_puppet_management.1.a:0 "One nation stands where two administrations once did."
 lok_puppet_management.2.t:0 "Parallel Puppet Administrations Consolidated"
 lok_puppet_management.2.d:0 "Two governments under our authority have been found to claim the same national inheritance. Maintaining both bureaucracies invited contradictory laws, duplicated offices and needless rivalry. Their territories and institutions have therefore been consolidated under the administration held at the lower level of autonomy."
 lok_puppet_management.2.a:0 "A sensible administrative correction."
 lok_puppet_management.3.t:0 "[ROOT.GetNameDef] Assumes an Independent Identity"
 lok_puppet_management.3.d:0 "The state now known as [ROOT.GetNameDef] was fashioned as a special dependency, complete with symbols and institutions designed for service beneath a foreign capital. With that relationship broken and no common alliance remaining, its leaders have discarded the old trappings of subordination and proclaimed a new, independent national identity."
 lok_puppet_management.3.a:0 "Another imposed order passes into history."
