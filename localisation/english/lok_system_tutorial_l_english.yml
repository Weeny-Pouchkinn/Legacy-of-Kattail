 LOK_tutorial.1.b:0 "Open the Tutorial"
 LOK_tutorial.1.c:0 "View Mod Credits"
 LOK_tutorial.2.t:0 "Summary"
 LOK_tutorial.2.d:0 "Legacy of Kattail features a variety of mechanics.\n\n§1POPULATION§!\nUnlike in vanilla, the potential decline of population due to war, famine or bombardment is simulated. Various events can decrease a state's population, which will in turn decrease the amount of resources and factories the state possesses, proportional to the decline relative to the start of the game (100 AKA). The total deaths in a state, nation and globally can be viewed next to the little skull icons on the state and country UIs.\n\n§1CORING§!\nLike in vanilla, states can't always be cored. However, either via focus, decisions or at game start, a given nation can acquire an array of 'Coreable States', each of which has a given Coring Compliance Threshold. Once this threshold is reached, the state will automatically be cored. Various effects will either make a state coreable, or lower the threshold by a certain value. All nations in the Herzlands can core the entire Herzlands, with the Coring Compliance Threshold starting at 80%.\n\n§1SPECIES§!\nEvery state is inhabited by a given Species, and potentially a Minority as well. This can provide various effects to the state, such as increasing the build speed of a given building, reducing casualties from nuclear bombs, or consuming more food. Minorities do not provide such effects. Nations also have a set of species (potentially multiple), which provide global national buffs. If a state's species or minority matches that of the nation that controls it, Compliance will grow faster.\n\n§1ATTRIBUTES§!\nIn addition to species, most nations have some form of permanent 'national attributes' which provide a variety of effects. This can for example translate to a permanent Ahead-of-Time reduction for a specific tech category."
 LOK_tutorial.2.a:0 "Tell me about §GFood§! and §HPower§!."
 LOK_tutorial.2.b:0 "Return to the Welcome screen."
 LOK_tutorial.3.t:0 "Food, Power, Resources"
 LOK_tutorial.3.d:0 "§1FOOD§!\nPopulation needs food to survive, produced as a resource like the others. On average, one hundred thousand people will consume one unit of food. If their needs are not met, the country will start suffering debuffs. If these needs are less than 50% met, then the nation's population will begin to decline rapidly! To remedy this, food can be imported via the trade menu, produced using the Hydroponics Farm building, or stockpiled using the Food Silo building. The current food status, and its storage can be viewed on the topbar, or in the decisions screen.\n\n§1POWER§!\nMuch like in vanilla, factories need power to run. But rather than being provided by Coal, power is outright produced as a resource by various power plant buildings, which can be constructed anywhere and take up building slots. Some of these will consume resources to do so: the Fossil Fuel Power Plant requires Fossil Fuels (identical to Oil from vanilla), and the Fission Power Plant requires Fissiles. It can also be imported and exported.\n\n§1FISSILES & SUPERTENSILES§!\nFissiles are a new, somewhat rare resource, used to power nuclear reactors, and fabricate WMDs or nuclear-powered equipment. Supertensiles, on the other hand, are almost entirely artificial, being produced by late-game buildings, and required by very advanced equipment."
 LOK_tutorial.3.a:0 "Tell me about §ONuclear Warfare§!."
 LOK_tutorial.3.b:0 "Go back to the §HSummary§!."
 LOK_tutorial.4.t:0 "Nuclear Warfare"
 LOK_tutorial.4.d:0 "Nuclear warfare in Legacy of Kattail is §Rextremely hazardous§!, potentially devastating both nations if undertaken carelessly.\n\n§1WMD PRODUCTION AND TYPES§!\nRather than being produced by nuclear power plants, the various types of WMDs must be produced using Military Factories, at a high production cost. There are multiple types of WMDs, which can be unlocked via tech and provide different effects.\n\n§1FIRING (Bottom Left of State UI)§!\nWMDs can be fired at a given state using the missile button at the bottom left of the state UI. We must, of course, be at war with the state's controller. The button also allows selecting a type of WMD, and the amount which is to be sent at once.\n\n§1SALVO CAPACITY (Top Bar)§!\nFiring WMDs requires 'salvo capacity', representing the amount of missiles available to mount warheads onto. It can be viewed on the top-bar. This can be increased by building ICBM Silos and Nuclear Submarines. Firing one WMD will consume one Salvo Capacity, which will be restored a week later. Beware! ICBM Silos can be destroyed by nuclear strikes, which may cripple one's Salvo Capacity and impede a counter-strike. Hence, striking silos first in a nuclear war is likely wise.\n\n§1RADIATION (Bottom right of State UI)§!\nDepending on the type of WMD, nuclear strikes will generate a given amount of radiation onto a state. Radiation will severely degrade the state's productive potential and rapidly kill population. It will also spread beyond its original state, potentially into other nations, including the one which fired the missiles to begin with. Fortunately, it decays relatively rapidly, the radiation from a regular strike usually dissipating within a month or so.\n\n§1INTERCEPTION (Building)§!\nIt is possible to construct the Anti-ICBM Network building (unlocked in the Artillery tree), which, depending on its level, will stop a number of nuclear warheads and potentially reduce casualties. It will function even if damaged.\n\n§1SOOT (Top Bar)§!\nFiring nuclear warheads will generate Soot, representing ash and debris flung into the atmosphere by the shockwave and ensuing firestorms. Rising soot levels then translate into a §RGLOBAL REDUCTION§! of all food production on Flusion, potentially impacting the entire world. States with a higher State Category, such as cities, will produce more soot upon being nuked. Soot will then slowly decay on its own."
 LOK_tutorial.4.a:0 "Tell me about §1Space§!."
 LOK_tutorial.4.b:0 "Go back to §GFood§! and §HPower§!."
 LOK_tutorial.5.t:0 "Space"
 LOK_tutorial.5.d:0 "You have likely noticed that Flusion's moons, Xenon and Muno, are visible above the map. They can be explored and colonized using a dedicated space exploration system in the decisions tab.\n\n§1ROCKETS AND ORBITAL LOGISTICS CAPACITY§!\nThe key to space exploration is Orbital Logistics Capacity, which represents a nation's general ability to haul stuff into and around space. It is accrued by building rockets using Military Factories, which can be researched from the Space tab in the tech view. Simply having a rocket in storage is enough to benefit from its Orbital Logistics Capacity, they do not need to be 'deployed'.\n\n§1MISSIONS AND EXPERIENCE§!\nMissions to various celestial bodies can be undertaken from a dedicated decision tab. Each mission has a difficulty, and completing them will accrue Experience, both general 'Space Experience' and dedicated experience for the targeted celestial body. Having higher experience against a mission's difficulty will increase the odds of success. All missions also cost some amount of Orbital Logistics Capacity for a set amount of time, which will require you to have sufficient rockets in storage to provide said capacity. Non-reusable rockets can only provide their capacity once, while reusable ones are able to provide it forever, making it essentially necessary to invest into reusable rockets for longer, costlier missions. Completing a mission for the first time will grant extra political power, and being the first to complete it ever will bring even more.\n\n§1SURVEYING AND COLONIZATION§!\nThe states on Xenon and Muno need to be first surveyed using a decision before they can be colonized, using another decision. Once a colony is established, it will have a set Orbital Logistics Cost of maintenance, and can be upgraded using yet another decision, which will increase its maintenance but grand extra building slots and supply. If we ever run out of Orbital Logistics Capacity, then our colonies will rapidly degrade, losing levels until they are destroyed. As space colonies are part of their nation, they can be brought into war and invaded like any other. Troops can thus be ferried from our capital to any space state, and back to our capital using decisions."
 LOK_tutorial.5.b:0 "Go back to §ONuclear Warfare§!."
