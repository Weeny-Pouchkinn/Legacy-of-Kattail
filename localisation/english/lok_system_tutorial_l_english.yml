 LOK_tutorial.10.t:0 "Legacy of Kattail Credits"
 LOK_tutorial.10.d:0 "Many people have contributed, one way or another, to this mod. All assets created by third-party individuals, companies or franchises belong to their respective owners! If you are the author of one of these assets and wish to see it changed or removed, or contributed something but is not listed here, please contact Elowiny on Discord.\n\nINDIVIDUALS & OTHER MODS\n§1Elowiny§! - Head Coder\n§1decentnamehere§! - Major coder, many map fixes, debugging, nation implementation\n§1Wilzy§! - 'Stellaquis' Main Menu theme.\n§1SnipsTheFox§! - Katzen & Sobaki models\n§1TTFTCUTS§! - Supertensile icons and Minister Icon generator software\n§1Allan DF on Twitter§! - Herald of the Kaiser Portrait\n§1cracker542 on Sketchfab§! - Superheavy Mech model.\n§1dafid25§! - Numerous Katzen-related focus icons.\n§1kova§! - Casualties in states mechanic\n§1gardendreamers§! - Various art (Panzer loading screen, Frederick Pawlliam portrait), playtesting.\n§1Revan§! - Jean de Kat de Tailssigny & Hans Ennauig character portraits.\n§1cxg2827§! - Nuclear Salt Water Rocket icon\n§1Globvs§! - GFX from Ultimate-HOI4-GFX \n§1matrx50§! - Kusnurk Focus Tree design\n§1amphithere_majesticon§! - Parts of Regency Focus Tree design, lots of writing\n§1Lemonfell§! - Portraits for Valewria Katzin, Klatz Meorner, Arnold Felt, Emmeownuel Neumayer\n§1Rein§! - Portraits for Delaparte and Bunbun IV\n§1Elowiny's IRL Friends§! - Thomas Katziel & Katlene Nachtingawll Portrait\n§1Nerowen§! - Dofus Portrait\n§1Equestria at War Team§! - Numerous icons for techs, general coding help.\n§1Pax Britannica§! - Mech Models\n§1Extended Tech Tree§! - Equipment & Tech icons\n\nEXTERNAL FRANCHISES\n§1The Iron Giant§! - Superheavy Mech model inspiration.\n§1Helldivers§! - Assault Railgun Icon\n§1Starcraft II§! - Firepower Platform Icon\n§1James Cameron's Avatar§! - Transport Gunship Icon\n§1Fallout§! - Early Power Armor Icon\n§1Icons8§! - Carnivorous, Utterly Gargantuan and Mostly Carnivorous Trait Icons\n§1Paul Grimault§! - Le Roi et L'Oiseau movie, the inspiration for Takicardie\n\nABOMINABLE INTELLIGENCE\nAI Usage Disclaimer: Artificial Intelligence was used exclusively for quicker implementation of repetitive components to save precious time and allow non-coders to contribute easier. All game design is made by actual people. Everything was extensively polished and playtested afterwards!\n§1Github Copilot & Claude Opus 4.6§! - Basic Focus Tree, Event, Dynamic Modifier & National Spirit Implementation\n§1Gemini 3.1§! - Somehow being able to help debug spaghetti code.\n§1ChatGPT§! - Generating scripts to automate repetitive tasks such as character generation."
 LOK_tutorial.10.a:0 "Thanks everyone! It is time to enjoy your work..."
 LOK_tutorial.10.b:0 "Bring me to the Tutorial."
