l_english:
  LOK_GAL_isolation.1.t:0 "Paranoid Isolationism Enacted" #AI-Generated Placeholder, change later!
  LOK_GAL_isolation.1.d:0 "The Gregorious Tequenik crisis has pushed our society past the breaking point. Extreme suspicion of all outside forces has become the official stance of the Technocracy, and we have fully closed our borders and severed trade relationships. The region of Barzinton has been granted autonomy as the Barzintonian Republic." #AI-Generated Placeholder, change later!
  LOK_GAL_isolation.1.a:0 "Let the outside world burn." #AI-Generated Placeholder, change later!

  LOK_GAL_isolation.2.t:0 "Galletian Technocracy Enters Total Isolation!" #AI-Generated Placeholder, change later!
  LOK_GAL_isolation.2.d:0 "Citing the severe instability of the Gregorious Tequenik crisis, the Galletian Technocracy has officially recalled all diplomatic missions, closed its borders completely, and suspended all international trade. In the process, they have released a Barzintonian puppet." #AI-Generated Placeholder, change later!
  LOK_GAL_isolation.2.a:0 "A massive silent curtain falls." #AI-Generated Placeholder, change later!
