 AUR_event.27.t:0 "Remain Loyal"
 AUR_event.27.d:0 "‘REMAIN LOYAL - HIS EXCELLENCY WILL RETURN’, read the poster on the wall across from Kayden. His father had put it in his room without asking two days ago, just like in every other room of their small house in the outskirts of Catburg. Kayden hated it. It was ridiculous, quasi-religious, baseless worship to him.\n\n’Vater, do we really need those posters hung everywhere?’, he asked that evening during lunch, twirling his spoon around a bowl of tasteless kibbles alongside his father and mother. They weren’t always this bland, it all started with this damn Herald cutting down on ‘unterkatzen excess’ and such.\n\n’-and that is... son. Son, are you even listening?’\n\n’Uh. Sorry. Zoned out again,’ Kayden replied, his father’s voice jolting him back to reality.\n\n’Now, as I was saying. Your mother and I have had to... work...  extremely hard to keep our house. It was to be turned into a factory block, you know? Sacrifices had to be made to show the Herald we were worthy servitors of His Excellency,’ Kayden’s father droned on.\n\n’But this is asinine, Vater. The Kaiser isn’t returning. Why would anyone want him to return anyways?’ he replied, overwhelmed with a deep feeling of being surrounded by sheer stupidy. Why wasn’t anyone shooting the Herald for being such a crazy lunatic? How was any of this even allowed? Kayden was confident that all these insane Katzens needed was a reminder of what reality and logic were, and all would be well. Hell, he bet that if he was in front of the Herald, he could convince him of how silly he was! There was nothing to worry about.\n\n‘Son. Please. Be reasonable. Trust the Herald. He only wants what is best for us,‘ his father responded, anxiously checking a small device every few seconds, ‘You have been speaking quite loudly and complaining a lot lately. This is not right for you.’\n\nIt changed nothing. Kayden continued to loudly argue for half an hour. This wasn’t good. There was a Katzkommissar visit in two days. They had lost everything in the Collapse and were already hanging on a knife’s edge. His father typed something on his device.\n\nThe next day, he dined in quiet consternation, alone with his wife."
 AUR_event.27.a:0 "What’s eighteen more years?"

 AUR_event.28.t:0 "To Justify His Return"
 AUR_event.28.d:0 "The Herald sat at his desk in a small-scale replica of the Pyramid in Auralia, claspIing his head in his paws. For the past five days he had been attempting to rationalize His Excellency’s inevitable return to the masses before him.\n\nIt was an unbearable ordeal. After all, to him, the inevitability of His return was a fact as obvious as the color of the sky. But to these darn Herzlanders and their obsessively rationalist mindset, it was baseless insanity - the Kaiser had died in the Collapse, and that was that. How could they think such a thing? It mattered not. It was oh-so-tempting to mandate belief in His return at gunpoint, but that was not what He would want, now is it? What pitiful domain it would bequeath to His Excellency!\n\nA few more hours of fervent typing and re-reading through page after page of digital notes, the Herald figured he had at last garnered sufficient talking points, some even backed by various experts in science and sociology.\n\nHis first, and most grounded argument was His Excellency’s complete and utter disappearance. He left behind no body, no clothing, no signs, nothing at all, to the point that even nearly a decade of searching for clues by numerous experts and spy agencies throughout the planet failed to yield anything on the matter. This, by all means, should be impossible, and clearly implies some supernatural ability to cloak oneself or even to depart to another plane of existence altogether.\n\nThis leads right onto the second point, that of His Excellency’s otherworldly nature. There was clearly something special, unique, unheard of about His Excellency, as evidenced not only by his impossible disappearance but also by his immense knowledge in all fields from politics to science and military theory. But, there is more. As to bring this theory from the realm of quakery into the realm of plausibility, the Herald has, alongside renowned historians and political experts, undertaken a thorough examination of numerous supposed high-ranking Katzen scientists credited for many of the Imperium’s breakthrough, and found most of these to be completely fictitious! Evidently, His Excellency had, in his humility, made up these scientists as to downplay his own immense intellect and wisdom. What a wise and splendid leader He was.\n\nNow the Herald had two competing theories as to the actual reason for His disappearance and eventual return. The first is that He had been scared or disappointed by the Katzen species, and was now waiting for the conditions to be right again in order to reappear. The second, the Herald’s favorite, was that this was all a test as part of His plan. He surely wanted to see how resilient the Katzen species truly was and how well they could stand on their own, as to see if they were worthy of His eternal guidance.\n\nBut there was only one interpretation he could insist on lest a schism took hold in the minds of his subjects, and so he had to chose carefully..."
 AUR_event.28.a:0 "He is simply disappointed, and awaits better times."
 AUR_event.28.a.tooltip:0 "Modify §Y$AUR_the_kaiser_must_return$§! by: \n$MODIFIER_COMPLIANCE_GROWTH$: §G+10%§!"
 AUR_event.28.b:0 "This is all part of His grand plan!"
 AUR_event.28.b.tooltip:0 "Modify §Y$AUR_the_kaiser_must_return$§! by: \nArmy Attack: §G+10%§!"

 AUR_event.29.t:0 "Uncouth Gamery"
 AUR_event.29.d:0 "There was a large, elongated table. On one end sat three Roqualian diplomats. They had headphones, colorful hair, various tattoos and wildly colorful clothing. They chatted and laughed as they awaited the Herald’s demands, who sat at the other end. A massive mountain of muscles and brawn, over two meters in height, clad in an impeccable uniform. The two groups stared at one another, the Herald drawing heavy breathes as he attempted to keep his composure.\n\n’Return southern Lionsburg to me.’, the Herald asked calmly, snapping the three Roqualians out of their babbling.\n\n’Or what?’, the three replied in unison.\n\n’Or you will face His might!’\n\nThis prompted much hilarity from the Roqualian delegation. ‘Hon! Hon! Hon! We are not afraid, Monsieur le Régent. Your nation is as unstable as a free Meinkraft server! Fight us, if you dare, and you will crumble.’ The Herald grew restless as the Roqualian spoke on. ’Our people, our Katzens will fight for their survival, while yours will fight for nothing. We have the world behind us. Who or what do you have, beyond hatred for all that is alien? Draw your own conclusion.’\n\nThe Herald remained silent, his breath accelerating as the Roqualian spoke. The truth is that the Roqualians were scared like never before of a second Crusade, but they were very, very good liars. And it seemed to be convincing enough.\n\nUltimately though, the fear went both ways. The Herald too couldn’t afford a conflict with Roqualia. It would tank what little popular support he still had and devastate his already ruined economy even further.\n\nHis fists clenched beneath the table. These... UNTERFLUSIONIANS! Always, ALWAYS getting in the way of his plans! How was he supposed to burn through the Herzlands and seize Katown with such a woefully exposed flank? This was an unacceptable security risk. He would have to find another way. He would have to rethink it all.\n\n’Very well. I see now that a conflict between our two kinds is undesirable.’, the Herald replied, each word coming out of his mouth grating against his psyche. The Roqualians smiled smugly.\n\n’Merci for your understanding, Monsieur le Régent. Perhaps in time we can develop proper relations beyond mindless hatred,’ and with that the three Roqualians stood up and departed, leaving the Herald alone with his thoughts. And for once, there were quite a lot of them."
 AUR_event.29.a:0 "Take some time off to think about everything."
 AUR_event.29.b:0 "No time for rest. Draft a fortification plan immediately and rethink our approach."

 AUR_event.291.t:0 "Sinking Deeper"
 AUR_event.291.d:0 "Somewhere in the depths of the Auralian city-center-turned-industrial-complex there was a pale replica of the Katown Pyramid. And within it, throughout the hundreds and hundreds of maze-like corridors and tangled high-ranking offices there was an ornate apartment decorated much like the Kaiser’s former office in Katown. It was, of course, the Herald’s. But the Herald wasn’t there. Rather, he was in a small, equally ornate room right next to his main apartments - the washrooms.\n\nThe Herald, all alone, stood in front of a large mirror in a golden frame adorned with depictions of His Excellency. Beneath it was a ivory sink which he clasped with both paws. Breathing in, breathing out, while staring at his reflection, accompanied only by a trickle of running water. For the past week following the meeting with the Roqualians the Herald had dedicated several hours to this ‘ritual’ each day, with said timeshare only lengthening as the days went on as the Herald struggled to keep his composure in front of his officials.\n\nThere were no words in any of the languages of Flusion to describe the hatred for the Unterflusionians that had been simmering within his mind for the past week. Nearly every waking moment had been spent one way or another fantasizing about unleashing incredible violence upon these three ‘diplomats’ and their ilk - yet they remained out of reach. The entire southern Roqualian diaspora had fled his advancing armies and sought refuge in the seceding regions and so he was incapable of punishing these antikatzen traitors as they deserved.\n\nNot to mention the endless Roqualian-made mockery spread around social media. Such things were blocked in his domain, of course, but he had taken a few glances in curiosity, and never had he seen himself as a crying kitten so many times.\n\nHe wasn’t sure just how long he could tolerate this for. The pent-up anger at this blatant, obvious and yet so frustratingly uncorrectable violation of his ambitions had to go somewhere. The breathing accelerated. In, out, in, out, in out. And thus came the blow and a million tiny mirror shatters spreading outwards from a bloodied paw. Meanwhile, the sink did not survive the impact with the wall and neither would the paw-drier nor the towel-holders.\n\nSoon a curled-up, weeping, hairball sat surrounded by damage it would take the average Katzen years to repay. He stood up and glared at the mirror’s remains. The anger had gone, and yet it was already returning. Something had to be done."
 AUR_event.291.a:0 "Find them. Find all those who yet hide and BRING THEM... TO ME!!!"
 AUR_event.291.a.tt:0 "The Regent will indulge in the pleasures of §RUnterflusionian cleansing§!..."
 AUR_event.291.b:0 "I... I... I... I need to talk with someone. I…. need to rest."
 AUR_event.291.b.tt:0 "The Regent will §Rnot§! indulge in the pleasures of §RUnterflusionian cleansing§!."
 
 AUR_event.30.t:0 "[AUR.GetName] Offers Imperium Restoration Pact"
 AUR_event.30.d:0 "We have received a missive hailing from [AUR.GetNameDef]. It proposes a semi-secretive 'Imperium Restoration Pact', in which they, the 'in-interim government of the Herzlands', vow to send us extensive support to help us unify our chunk of Felinea.\n\nIn exchange, we would technically lose our independence but become an integral part of a 'reunited Imperium' with significant leverage. It is quite a promising offer in these uncertain times. Should we accept?"
 AUR_event.30.a:0 "A splendid idea!"
 AUR_event.30.b:0 "Insanity! Tell the Herald to go play on the Superhighway!"

