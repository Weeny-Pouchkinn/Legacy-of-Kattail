 AUR_event.29.t:0 "Uncouth Gamery"
 AUR_event.29.d:0 "There was a large, elongated table. On one end sat three Roqualian diplomats. They had headphones, colorful hair, various tattoos and wildly colorful clothing. They chatted and laughed as they awaited the Herald’s demands, who sat at the other end. A massive mountain of muscles and brawn, over two meters in height, clad in an impeccable uniform. The two groups stared at one another, the Herald drawing heavy breathes as he attempted to keep his composure.\n\n’Return southern Lionsburg to me.’, the Herald asked calmly, snapping the three Roqualians out of their babbling.\n\n’Or what?’, the three replied in unison.\n\n’Or you will face His might!’\n\nThis prompted much hilarity from the Roqualian delegation. ‘Hon! Hon! Hon! We are not afraid, Monsieur le Régent. Your nation is as unstable as a free Meinkraft server! Fight us, if you dare, and you will crumble.’ The Herald grew restless as the Roqualian spoke on. ’Our people, our Katzens will fight for their survival, while yours will fight for nothing. We have the world behind us. Who or what do you have, beyond hatred for all that is alien? Draw your own conclusion.’\n\nThe Herald remained silent, his breath accelerating as the Roqualian spoke. The truth is that the Roqualians were scared like never before of a second crusade, but they were very, very good liars. And it seemed to be convincing enough.\n\nUltimately though, the fear went both ways. The Herald too couldn’t afford a conflict with Roqualia. It would tank what little popular support he still had and devastate his already ruined economy even further.\n\nHis fists clenched beneath the table. These… UNTERFLUSIONIANS! Always, ALWAYS getting in the way of his plans! How was he supposed to burn through the Herzlands and seize Katown with such a woefully exposed flank? This was an unacceptable security risk. He would have to find another way. He would have to rethink it all.\n\n’Very well. I see now that a conflict between our two kinds is undesirable.’, the Herald replied, each word coming out of his mouth grating against his psyche. The Roqualians smiled smugly.\n\n’Merci for your understanding, Monsieur le Régent. Perhaps in time we can develop proper relations beyond mindless hatred,’ and with that the three Roqualians stood up and departed, leaving the Herald alone with his thoughts. And for once, there were quite a lot of them."
 AUR_event.29.a:0 "Take some time off to think about everything."
 AUR_event.29.b:0 "No time for rest. Draft a fortification plan immediately and rethink our approach."
