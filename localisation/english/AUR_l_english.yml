 AUR_event.33.t:0 "In the Pyramid"
 AUR_event.33.d:0 "The Herald was sitting inside his well-furnished office at the top of the Katown Pyramid. He of course hoped that it would, in time, be returned to its rightful owner that being His Excellency, but for now he felt quite content sitting in such an important room.\n\nIt was quiet. Having just exited a dozen meetings about territorial reorganizations, the Herald laid back on his luxurious leather chair and took a few minutes to relax. Closing his eyes, he remembered his tumultuous beginnings, during which thoughts of hatred and anticipation constantly swirled around in his mind. They are gone now. Years of restraint, collaboration and self-control had paid off as he now felt calm satisfaction for what he had accomplished, and eager anticipation for the restoration of His Domain.\n\nHow long would it take? At least decades, he reckoned. Every road repaired, every house rebuilt, every technological gap with the rest of the world mitigated, every citizen integrated into a harmonious collective ready to be steered towards planetary domination once more. So much work, so many far-off goals, and yet it all seemed so... reachable now, with just a little elbow grease and enough time.\n\nA knock on the door snapped the Herald out of his thoughts. Odd. He had no appointments in this time slot. He looked at his Katzenluger on the desk. His old self would have immediately grabbed it and threatened the intruder who dared disturb him, but now it was but a simple safety measure. He had nothing to fear, after all. What threat could possibly reach him within the Pyramid?\n\n’Come in.’ The Herald responded in a somewhat drowsy voice, expecting a confused clerk or a concerned general. The office’s door swung open and suddenly the Herald’s entire world stood still."
 AUR_event.33.a:0 "..."

 AUR_event.34.t:0 "The Rightful Owner"
 AUR_event.34.d:0 "It was the office’s rightful owner.\n\nThere He was. His Excellency stood at the center of the room, clad in the same uniform as the day he left, not having aged a day. He looked a mix of exhausted and stressed, as if he had run, while mumbling something about ‘silly generals asking how to fix this Mirlean-forsaken mess of an attempt’. He noticed the Herald and stood up straight. The Herald was frozen, mouth agape as countless conflicting thoughts rushed through his mind.\n\nThe Kaiser began to monologue. ’Ah! You look well-dressed, you didn’t try to shoot me, and I see... maps of a decentralized Herzlands? Reconstruction zones? Splendid! I see you have not fallen to the throes of insanity like you tend to do. Good, good. Not necessarily ideal, but it’ll do. Well then, my dear Harold, as it is futile for me to stick around past midnight, and you seem like a worthy successor, I officially name you my successor, and new Kaiser of the Katzenartig Imperium. My time is up now, unfortunately, and thus I bid you farewell and wish you good luck with your future endeavors!’\n\nBefore the Herald could muster up a response, a flash of light engulfed the room and His Excellency was there no longer.\n\nOne minute, two minutes, five minutes, ten minutes, thirty minutes passed before the Herald finally collapsed onto his desk, sobbing. By all means he should have been elated to have been right all along, but the Herald felt utterly empty. That... that was it? That was the Return? Where was the descending from the heavens? The fanfare, the clamoring? The transfer of the Imperium back to its rightful owner?\n\nSure, he had just been appointed as His successor - an honor never before considered - but who would believe him? His Excellency spoke for barely a minute, was already gone and stated his intention to never return. The Herald had promised everyone it would be decades before power had to be handed back to a central authority. Renouncing the Return altogether in favor of himself being the new Kaiser would be seen as nothing but a blatant power-grab."
 AUR_event.34.a:0 "Hide the evidence and pretend it never happened."
 AUR_event.34.b:0 "So be it. I shall make His will manifest regardless!"

 AUR_event.36.t:0 "Imperial Regency proposes Drakwald Compromise"
 AUR_event.36.d:0 "Agents from the mysterious Imperial Regency have approached us bearing a highly-secretive proposal from the Herald of the Kaiser himself. Given the threat posed to both of us by the southern power bloc, and Asterion's known ambitions upon the south, they propose the 'Drakwald Compromise' - an agreement to strike the south at the same time and carve it up between our two states.\n\nNamely, they seek to take the lands of Purrlin-Lionsburg and Catburg, while we would receive all land south of the Drakwald River.\n\nWhile the Regency is... very much opposed to our very existence, it is undeniable that the united south poses a major threat to us and that swift action must be taken if we are to contain its growth."
 AUR_event.36.a:0 "Let's work together... for now."
 AUR_event.36.a.tooltip:0 "Whenever the §YImperial Regency§! attacks the South, we shall join them and attack §YCatburg§!, §YHimezulte§! and §YMeon§!."
 AUR_event.36.b:0 "Who does the Herald think he is?!"

 AUR_event.37.t:0 "Pakt Response"
 AUR_event.37.d:0 "Our agents have informed us that the [NMI.GetName] has accepted the Drakwald Compromise.\n\nWe shall thus strike at the South together."
 AUR_event.37.a:0 "Most excellent news."

 AUR_event.38.t:0 "The Herald Strikes South!"
 AUR_event.38.d:0 "The Imperial Regency has began its invasion of [PRL.GetNameDef] and [CAT.GetNameDef]. Thus, as per the Drakwald Compromise Pakt, it is now up to us to come to their aid and seize the land up to the Drakwald River... and beyond."
 AUR_event.38.a:0 "Let us proceed."

 AUR_event.39.t:0 "[FROM.GetName] Plans Expansion!"
 AUR_event.39.d:0 "The government of [From.GetNameDef] has informed us that, as part of our mutual Imperium Restoration Pact, they intend to declare war upon [?global.expand_into_neighbor_target.GetNameDef] within the next two months."
 AUR_event.39.a:0 "Acknowledged."

 AUR_event.40.t: "He Who Cleanses The Blight"
 AUR_event.40.d: "the herald goes crazy\nstarts wanting to kill everyone\nwardecs everyone\nhis order collapses\nfailstate..."
 AUR_event.40.a: "They will all SEE THE TRUTH!"

 AUR_event.42.t: "The Regency Crumbles!"
 AUR_event.42.d: "Following a period of rapid, wanton expansion, the usually opaque state of [AUR.GetNameDef] is finally starting to show signs of weakness.\\n\\nIndeed, everything points towards their demented \"Herald\" having been assassinated following his inability to properly carry through with his promises, resulting in a bloody power struggle in the midst of the wartorn nation.\\n\\nThis may be an opportunity for us to get rid of these maniacs once and for all!"
 AUR_event.42.a: "Let us finish the job."
 AUR_event.42.b: "They will crumble on their own."

 ### Army Tree - Neu-Katzenarmee ###
 AUR_neu_katzenarmee:0 "Neu-Katzenarmee"

 AUR_his_armee:0 "His Armee"
 AUR_his_armee_desc:0 "The land forces are arguably the only part of Imperial Regency that can be considered in any shape being close to fit although the Auralian territory was never meant to provide a large army unlike Lionita. This is a trait that turned out to be fortunate as most of the troops deployed or recalled back are locals drafted from the population leading to a, more or less, loyal military."

 AUR_doctrinal_efficiency:0 "Doctrinal Efficiency"
 AUR_doctrinal_efficiency_desc:0 "The horrors of the Kaiser's Crusade were not without merit. Years upon years of untested military equipment have been put through the ringer as well as the old ideas on how war should be sieged. It's time to rethink what the future of our armed forces should even be."

 AUR_amends_engineering_korps:0 "Amends with the Engineering Korps"
 AUR_amends_engineering_korps_desc:0 "Far to the east, the Imperial Engineering Korps are left stranded with a mighty construct. They possess the other half of some prototype template-based supply centers meant to be deployed in Roqualia to support the army alongside the efforts of Dominiontracks itself. Something can be gained by engaging in diplomatic talks even if nothing truly viable is gained."

 AUR_reeducate_officers:0 "Re-educate Officers"
 AUR_reeducate_officers_desc:0 "It is of critical importance that our cast of military stars is of the highest quality if we wish to reclaim the Herzlands let alone the entirety of Flusion. Their worst tendencies must be removed while their intellect shall be rewarded."
 AUR_reeducate_officers_tt:0 "All §Ygenerals§! and §Yfield marshals§! gain §G+1§! to §Yall stats§! (Attack, Defense, Planning, Logistics)."

 AUR_redistribute_funding:0 "Redistribute Funding"
 AUR_redistribute_funding_desc:0 "The common footkat is a meaningless body to be thrown into the meat grinder. Thinning their armor and cutting corners on their rifles will give the extra metals to the artillery factories. The enemy will be shelled into submission."

 AUR_autohubs:0 "Autohubs"
 AUR_autohubs_desc:0 "Our cooperation with the KPK has allowed us to finish the so-called Autohubs. In reality, they are far from technological marvels but mainly a series of procedures and stratagems for safely deploying railways. Self-destruct clauses have been built into our notes and the engineers are left unaware we could ever finish their knowledge."
 AUR_autohubs_tt:0 "Modify §Y$AUR_neu_katzenarmee$§! by: \nSupply Hub Construction Speed: §G+25%§!\nRailroad Construction Speed: §G+25%§!"

 AUR_absolute_loyalty:0 "Absolute Loyalty"
 AUR_absolute_loyalty_desc:0 "What use is a general that has doubt? There is only one panacea under the Herald's law for dishonesty. The rest will be twice as committed to the cause and each one will have fewer resources to share with their competitors."
 AUR_absolute_loyalty_tt:0 "All remaining §Ygenerals§! and §Yfield marshals§! gain §G+1§! to §YAttack§!."

 AUR_fully_mechanized:0 "Fully Mechanized"
 AUR_fully_mechanized_desc:0 "The use of feet is longer over with and now is the time of the wheel. Our soldiers must be transported into battle at faster than a march if we wish to blitz the unterflusionian into dread submission by the will of our Herald and the Kaiser."

 AUR_encourage_war_crimes:0 "Encourage War Crimes"
 AUR_encourage_war_crimes_desc:0 "In every conflict across Flusion since the dawn of time, there has been atrocities committed. In some cases, they have been hidden rather well. By wreathing the battlefield in such danger that not even the bravest reporters would dare come letting us be unrestricted in our means of conflict without (most) international eyes."
 AUR_encourage_war_crimes_tt:0 "Modify §Y$AUR_neu_katzenarmee$§! by: \nArmy Attack Factor: §G+5%§!\nExperience Loss Factor: §R+5%§!"

 AUR_integrate_unterkatzens:0 "Integrate Unterkatzens"
 AUR_integrate_unterkatzens_desc:0 "The Kaiser's Crusade left tens of millions of Katzens across the planet in a bid to colonize and destroy the native cultures. Most of these non-Herzlanders have acclimated to their home nations and fit into a snug, if controversial, role in their respective societies. With the proper procedures, they can be returned to their primal, Herzlander state at no real expense."
 AUR_integrate_unterkatzens_tt:0 "Modify §Y$AUR_neu_katzenarmee$§! by: \nNon-Core Manpower: §G+15%§!\nCompliance Growth: §G+5%§!\nResistance Growth: §R+20%§!"

 AUR_the_sobakis_let_loose:0 "The Sobakis Let Loose"
 AUR_the_sobakis_let_loose_desc:0 "Flusion will be scoured clean of pacifism. Each and every facet, crevice, and cranny of this glorious globe we call home will be filled with our fur, our claws, and our radiation. There will be no safety, no shelter from the armies of the Kaiser. When we are done here, we will conquer every world and every star until His Return. Glory be to His name."
 AUR_the_sobakis_let_loose_tt:0 "Modify §Y$AUR_neu_katzenarmee$§! by: \nArmy Attack Factor: §G+5%§!\nEquipment Capture Factor: §G+5%§!\nExperience Loss Factor: §R+15%§!"

 AUR_event.50.t:0 "His Armee"
 AUR_event.50.d:0 "Pawtton and his fellow generals funnel into the cramped, brutalist meeting room with a solid, cubical concrete table. Secret files and logistic reports become quickly strewn across its entirety as the Herald quickly realizes the state of affairs of his land forces.\n\nThe numbers are grim. Most of the old Kaiser's veterans are dead, retired, or defected. Equipment is outdated and crumbling. Supply lines are practically nonexistent beyond the immediate vicinity of Auralia. But the Herald sees opportunity where others see despair. A clean slate means no old guard to resist his reforms.\n\n'Gentlemen,' the Herald speaks with a cold authority that silences the room. 'We will build a new army from the ashes of the old. The Neu-Katzenarmee will be the instrument of His return. Every division, every gun, every boot will serve one purpose: the restoration of the Imperium.'\n\nPawtton nods solemnly. Meorwin is already sketching plans on a napkin."
 AUR_event.50.a:0 "The Neu-Katzenarmee shall rise."

 AUR_event.51.t:0 "The Imperial Regency Proposes Cooperation"
 AUR_event.51.d:0 "Agents from the Imperial Regency have approached us with a peculiar proposal. They seek to complete a series of prototype supply hub templates that were jointly developed before the Collapse. The Autohub project, as they call it, would require sharing our half of the engineering schematics.\n\nThe Regency promises diplomatic goodwill and hints at future cooperation. However, dealing with the Herald's regime is always a dangerous proposition. Their ideology is repugnant to most, but the practical benefits of completing the Autohubs could be significant for our own infrastructure as well."
 AUR_event.51.a:0 "Share the schematics. The technology is worth more than pride."
 AUR_event.51.b:0 "We want nothing to do with the Herald's madness."

 AUR_event.52.t:0 "The Engineering Korps Delivers"
 AUR_event.52.d:0 "Excellent news from the east! The Pioneer Korps has agreed to share their half of the Autohub schematics. Our engineers are already cross-referencing the data with our own prototypes. The self-deploying railway and supply hub procedures are coming together faster than anticipated.\n\nThe Herald is pleased. This small diplomatic victory proves that even the unterflusionian can be useful when properly motivated."
 AUR_event.52.a:0 "Begin assembly of the Autohubs immediately."

 AUR_event.53.t:0 "The Pioneers Refuse"
 AUR_event.53.d:0 "The Pioneer Korps has refused our proposal. Whether out of fear, ideology, or simple spite, they have chosen to keep their half of the Autohub schematics locked away. A shame, but not unexpected.\n\nThe Herald dismisses the rejection with a wave of his paw. 'They will regret this when our tanks roll through their pitiful borders. We do not need their scraps to build the Imperium.'"
 AUR_event.53.a:0 "Their loss. We will find another way."


