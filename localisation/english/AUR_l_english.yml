 #Decisions
 aur_shoot_the_ipf:0 "Mass arrest of suspected §2IPF§! members"
 aur_shoot_the_ipf_tt:0 "$ipf_strength$ decreases by §Y1§!."
 aur_shoot_the_ipf_desc:0 "We can't take any chances with these $ipf_name$ rats. Thanks to our moles, we'll be able to easily locate their members and promptly arrest them."

 aur_shoot_the_ksk:0 "Brutalize the §RKSK§!"
 aur_shoot_the_ksk_desc:0 "The $ksk_name$ is even worse than their liberalist cousins, and thus our measures shall be proportionally more drastic. Anyone - and we mean §Ranyone§! suspected to have ties with the KSK will be executed and their remains being hung for all to see!"
 aur_shoot_the_ksk_tt:0 "$ksk_strength$ decreases by §Y1§!."

 AUR_industrialization_cat:0 "Die Dreijährige Reimperialisierung"
 AUR_industrialization_cat_desc:0 "The Herald has a vision to turn Auralia into an industrial region not unlike what Kattail did to Purrlin-Lionsburg and the Pouchkinn Plains in the north. While his plans might seem deranged and reckless, it is paramount that we succeed in realizing them if we want to stand a chance against the rest of the Herzlands.\n\n[ROOT.AURGetIndustryGoals]"

 AUR_industry_term_1_goals:0 "§H1st Term of the Dreijährige Reimperialisierung Goals§!\n§H[?AUR.aur_num_new_infra_built]/5§! Infrastructure built\n§H[?AUR.aur_num_new_reactors_built]/2§! Nuclear Power Plants built."
 AUR_industry_term_2_goals:0 "§H2nd Term of the Dreijährige Reimperialisierung Goals§!\n§H[?AUR.aur_num_new_mils_built]/16§! Military Factories built\n§H[?AUR.aur_num_new_civs_built]/10§! Civilian Factories built"
 AUR_industry_term_3_goals:0 "§H3rd Term of the Dreijährige Reimperialisierung Goals§!\n§H[?AUR.aur_num_new_aa_built]/5§! Anti-Air built\n§H[?AUR.aur_num_new_radar_built]/3§! Radar Stations built.\n§H[?AUR.aur_num_new_bunkers_built]/4§! states fortified"

 AUR_aggressive_industrialization:0 "Aggressive Industrialization in [From.GetName]"
 AUR_nuclear_salvation:0 "Erect Nuclear Salvation in [From.GetName]"
 AUR_mass_worker_conscription:0 "Mass Worker Conscription"

 AUR_industry_timer:0 "Dreijährige Deadline"
 AUR_industry_timer_tt:0 "Our economy will §Rcollapse§!."

 AUR_expand_mil_factories:0 "Expand Military Factories in [From.GetName]"
 AUR_civilian_factories:0 "Create 'Civilian' Factories in [From.GetName]"

 AUR_katzen_lifestyle:0 "Enhance Katzen Lifestyles in [From.GetName]"
 AUR_projekt_seer:0 "Enact Projekt Seer in [From.GetName]"
 AUR_plan_for_the_worst:0 "Plan for the Worst in [From.GetName]"

 AUR_dreijahrige_idea:0 "1st Dreijährige Reimperialisierung Term"
 AUR_pushing_idea:0 "2nd Dreijährige Reimperialisierung Term"
 AUR_nearly_there_idea:0 "3rd Dreijährige Reimperialisierung Term"

 AUR_economic_backlash:0 "Economic Backlash"
 AUR_economic_backlash_desc:0 "Three years of brutally forcing the nation to cough up far more than it should've been able to may be called by some to be terribly damaging to the economy. While the issues will subside in due time, it's time for the Herald to be content with his expansion plans."

 AUR_total_economic_collapse:0 "Total Economic Collapse"
 AUR_total_economic_collapse_desc:0 "The Herald's brilliant, perfect plan to turn his nation and Auralia into a highly industrialized empire hasn't just failed. More like falling down a thousand stairwells into a spike pit covered in shame and despair. Eventually it will recover but the Kaiser is disappointed."

 AUR_chew_slowly_cat:0 "Tending to His Vision"
 AUR_chew_slowly_cat_desc:0 "His Excellency was a kind, magnaminous leader who tended to the Katzen species like a gardener. His exalted Herald must apply the same care to his subjects if He is to be satisfied when He returns.\n\nThe Herald's $herald_sanity$ is at §Y[?AUR.herald_sanity]§! out of §Y100§!.\n§L[AUR.GetRegentSanityBlurb]§!\n\n$herald_sanity$ will §Gincrease§! if we...\n§YCore§! a state (§G+1§! per)\n§YCapitulate§! a nation (§G+5§! per)\n\n$herald_sanity$ will §Rdecrease§! if we...\n§YLose§! a state (§R-2§! per)\nGet §YNuked§! (§R-0.5§! per impact)\nGet §YWardec'd§! (§R-5§! per)\nIncrease §YConscription§! (§R1§! per % of recruitable pop)"
 herald_sanity:0 "§0Sanity§!"
 change_herald_sanity_tooltip:0 "The Herald's $herald_sanity$ changes by [?herald_sanity_change|+0]."

 AUR_chew_slowly_sanity_100_to_90:0 "They are right to be skeptical. After all, His exalted return is not a given. But, together, and under my guidance, we shall once more reshape the Herzlands into a domain befitting of His splendor."

 AUR_chew_slowly_sanity_90_to_70:0 "They are stubborn. Very, very stubborn. It is difficult for me to keep composure in the face of these uncompliant masses. Why do they not see His vision as I do? Nevertheless, I do what I must, for them and for His Excellency."

 AUR_chew_slowly_sanity_70_to_50:0 "Why? Why do they not comprehend? Can they not see that this is all part of His plan? I suspect Unterflusionian interference. I must remain steady in the face of adversity."

 AUR_chew_slowly_sanity_50_to_20:0 "They do not share my vision for His return. Whatever! They will be made to accept it, no matter how long it takes! No matter what it takes! No matter how much the Unterflusionians and the Unterkatzens conspire against ME!"

 AUR_chew_slowly_sanity_20_to_0:0 "Everywhere I look, everywhere I see, they abound. His Excellency's enemies, they infest and devour His domain's corpses like maggots. And I... I am the exterminator."


 AUR_commissars_cat:0 "Imposing His Vision"
 AUR_commissars_cat_desc:0 "There is no place for dissent in His Excellency's future domain. His exalted Herald and his loyal Katzkommissars will ensure compliance, no matter the cost.\n\nWe currently have §Y[?AUR.AUR_available_commissars]§! §OKatzkommissars§! available and §Y[?AUR.AUR_dispatched_commissars]§! §OKatzkommissars§! dispatched throughout the nation."
 AUR_dispatch_1_katzkommissar:0 "§Y1§! §OKatzkommissar§! will be dispatched for the mission's duration."

 AUR_commissar_show_of_force:0 "Mass-Repression in [From.GetName]"
 AUR_commissar_show_of_force_desc:0 "Dispatch a Katzcommissar to [From.GetName] and its surroundings to mercilessly crush partisan networks."
 AUR_active_commissar:0 "There is already active Katzcommissar in this state."

 lok_state_actions_AUR_repression_button_tooltip:0 "§YEnact Mass-Repression§! - §Y10§! £pol_power£ & §Y1§! §OKatzkommissar§![GetStateActionAURRepressionStatus]\n§LThere is no place for dissent in His Excellency's future domain. His exalted Herald and his loyal Katzkommissars will ensure compliance, no matter the cost.§!\n§Y1§! §OKatzkommissar§! will be dispatched for the mission's duration. We have §Y[?AUR.AUR_available_commissars]§! available.\nIn §Y28§! days, §Y[?THIS.GetName]§! receives:\n    Resistance: §G-20%§!\n    Resistance Target: §G-20%§!\n    Local Population: §R-20000§!\n    Every §Yneighbor state§! receives §Yhalf§! of these effects."
 lok_state_actions_AUR_repression_status:0 "\n§GActive§!, §Y[?state_actions_AUR_repression_weeks_left]§! weeks left"

 AUR_commissar_reward_collaborators:0 "Reward the Worthy in [From.GetName]"
 AUR_commissar_reward_collaborators_desc:0 "The stalwart few who adhere to His Excellency's vision shall be rewarded for standing out amidst the degenerated masses of the Herzlands with promotions and honors befitting of their loyalty. Admittedly these are not necessarily the smartest of Katzens, but this is exactly what the Herald needs."

 AUR_commissar_reward_collaborators_remove_tt:0 "Modify §Y$AUR_the_kaiser_must_return$§! by: \n$MODIFIER_RESEARCH_SPEED_FACTOR$: §R-0.1%§!\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §R-0.1%§!"

 AUR_katown_conquest:0 "Seize the Heart of the Imperium"
 AUR_katown_conquest_tt:0 "The §YHerald§! will be... §Rvery displeased§!."
    
 #Ideas
 AUR_conversion_buff:0 "Emergency Konvertierung"

 AUR_the_kaiser_must_return:0 "The Kaiser Must Return"
 AUR_the_kaiser_must_return_desc:0 "The Herald has convinced (brainwashed) his people to do whatever it takes to bring back the Kaiser and his infinitely knowing will to take over the world. The Kaiser will get a world conquest on his second attempt once He returns."

 AUR_utter_failstate:0 "Utter Failstate"
 AUR_utter_failstate_desc:0 "All has failed. The Herald's vision for His Return is little more than demented ramblings now."

 AUR_herald_sanity_100_to_90:0 "Very Sane Herald"

 AUR_herald_sanity_89_to_70:0 "Sane Herald"

 AUR_herald_sanity_69_to_50:0 "Middling Herald"

 AUR_herald_sanity_49_to_20:0 "Descending Herald"

 AUR_herald_sanity_19_to_0:0 "Demented Herald"

 AUR_exhausted_dockyards:0 "Dockyards Exhausted"
 AUR_exhausted_dockyards_desc:0 "Hard labor in only a few months of work to produce a relatively titanic amount of ships has left countless dead and more incapable."

 AUR_split_auralia:0 "Split-Auralia"
 AUR_split_auralia_desc:0 "The great megacity of Auralia is home to a massive bay fitted with gargantuan dockyards that forged the titanic navy of the dead Imperium. However, the Federal Republic and their President took Süd-Auralia during the collapse as well as much as its industry. As long as control over Auralia, our great capital, is split then we are open to attack as well as our people to escape."  
 
 AUR_split_auralia_2:0 "Closing the Split-Auralian Wound"
 AUR_split_auralia_2_desc:0 "The great megacity of Auralia is home to a massive bay fitted with gargantuan dockyards that forged the titanic navy of the dead Imperium. However, the Federal Republic and their President took Süd-Auralia during the collapse as well as much as its industry. It's taken so long but we have enough control over our own people that we can start to close the gaping wound of Auralia. Let's cauterize the rest of us while we're at it."  

 AUR_chaos_collapse:0 "Horrific Chaos of the Collapse"
 AUR_chaos_collapse_desc:0 "A great BEAUTIFUL beast was speared in the heart and its corpse so bloated and gargantuan that its fall across Flusion has led a great depression. Auralia was one of its greatest organs so without the blood of resources flowing to it from across Flusion, it is faltering and so the rest of the Regency is as well."

 AUR_mishandled_navy_airforce:0 "Mishandled Navy and Airforce"
 AUR_mishandled_airforce:0 "Mishandled Airforce"
 AUR_mishandled_navy:0 "Mishandled Navy"
 AUR_academy:0 "Die Auralianishes-Seeacademy"

 AUR_every_katzen_a_gun_idea:0 "Every Katzen a Gun"
 AUR_every_katzen_a_gun_idea_desc:0 ""

 AUR_every_gun_a_katzen_idea:0 "Every Gun a Katzen"
 AUR_every_gun_a_katzen_idea_desc:0 ""

 AUR_add_1_commissar_tt:0 "We recruit §Y1§! §OKatzkommissar§!."
 AUR_add_2_commissar_tt:0 "We recruit §Y2§! §OKatzkommissars§!."
 AUR_add_3_commissar_tt:0 "We recruit §Y3§! §OKatzkommissars§!."

 AUR_new_goals:0 "New Goals for Auralian Dockyards"
 AUR_efficient_dockyards:0 "Famed Auralianishes Efficiency"

 #Focuses
 AUR_food_initiative:0 "Universal Greater Food Initiative"
 AUR_food_initiative_desc:0 "As troublesome as it can be, our people do in fact require sustenance. How despicable! It was said that His Excellency never ate a single meal in his entire life, powering itself exclusively with his burning passion for a better world. Nevertheless, ensuring the cohesion of our agricultural network will ensure our people won't have to fight on an empty stomach."

 AUR_gross_bewaff:0 "Grösseres Bewaffnungsprotokoll"
 AUR_gross_bewaff_desc:0 "Anything and anyone that can be used for military production will be used for military production. Nothing will be spared!"

 AUR_emergency_wieder:0 "Emergency Order 'Wiederbewaffnung'"
 AUR_emergency_wieder_desc:0 "The time of war draws ever nearer and thus we need as many military factories as possible, even if it means retooling civilian manufactories."

 AUR_blitz_aus:0 "Blitzschutzbau 'Ausrüstung'"
 AUR_blitz_aus_desc:0 "The people have a lot of things to offer beyond just their bodies, namely tools, vehicles, and materials. We shall thus seize and repurpose all of this wasted personal equipment for the purpose of fulfilling the Herald's vision."
 
 AUR_emergency_konvert:0 "Emergency Order 'Konvertierung'"
 AUR_emergency_konvert_desc:0 "While converting precious military factories into civilian ones might seem foolish, we need every last bit of industrial juice we can if we are to outpace our rivals."
 
 AUR_blitz_ers:0 "Blitzschutzbau 'Erschöpfung'"
 AUR_blitz_ers_desc:0 "We need more industrial capacity if we are to fulfill the Herald's vision and we need it NOW. So what if a few workers die from overworking?"

 AUR_dreijahrige:0 "Dreijährige Reimperialisierung"
 AUR_dreijahrige_desc:0 "In short, a deranged and reckless plan to turn Auralia into an industrial region not unlike what the Kaiser did to the Purrlin-Lionsburg region and the central Nordherzlands. But with far less resources."

 AUR_pushing_pushing:0 "Pushing... Pushing..."
 AUR_pushing_pushing_desc:0 "'Faster faster faster! Every day we aren't ready is another day the unterflusionians are preparing to come to end all Katzens!'"

 AUR_nearly_there:0 "Nearly There..."
 AUR_nearly_there_desc:0 "'I SAID FASTER! BY THE KAISER I WILL TAKE YOUR PAWS IF YOU AREN'T DONE FAST ENOUGH!' "

 AUR_fulfilled:0 "Fulfilled?"
 AUR_fulfilled_desc:0 "Finally, three years of work and it's over. A roaring lion of an industry ready to enact the Kaiser's will. "

 AUR_slaves_for_roads:0 "Slaves for Roads"
 AUR_slaves_for_roads_desc:0 "It is a detestable practice but desperate times call for desperate measures. Of course work will be done to isolate knowledge of the labor camps and only to be filled with non-dangerous individuals."

 AUR_controlled_thought:0 "Establish Controlled-Thought"
 AUR_controlled_thought_desc:0 "It is high time after years of post-collapse conditions we reinvent a more historically accurate education system and go about reminding citizens of the truth."

 AUR_wunderwaffe_buro:0 "Büro des Wunderwaffen"
 AUR_wunderwaffe_buro_desc:0 "Katzenartig Soulbots, Riesigers, railguns... Mondkanone. These are all relevant superweapons we must recreate ourselves."

 AUR_superb_infanteriewaffen:0 "Superb Infanteriewaffen"
 AUR_superb_infanteriewaffen_desc:0 "While the common footkat is unlikely to be anything other than fodder, they should nonetheless be given the means to inflict maximum devastation before they are swept away."

 AUR_mechanization_ideal:0 "Mechanization Ideal"
 AUR_mechanization_ideal_desc:0 "The advent of advanced robotics can drastically multiply the strength and efficacy of our soldiers, without needing bulky vehicles to carry them."

 AUR_asmd_systems:0 "ASMD Systems"
 AUR_asmd_systems_desc:0 ""

 AUR_soulsearching_project:0 "Soulsearching Project"
 AUR_soulsearching_project_desc:0 "The Unterflusionian Roqualians have devised a technology known as 'Soulbots', enabling a fallen being to be given a 'second chance' at life. His Excellency had, of course, taken this rightfully Katzen technology and began applying it to serve his needs. We should resume these efforts."

 AUR_achieve_regentbots:0 "Achieve Regentbots"
 AUR_achieve_regentbots_desc:0 "A far cry from the feeble and civilian-minded Roqualian soulbots, these fearsome 'Regentbots' shall be machines of war, allowing our greatest military minds to keep on fighting forevermore."

 AUR_siegebreaker_reverse_engineering:0 "Siegebreaker Reverse Engineering"
 AUR_siegebreaker_reverse_engineering_desc:0 "Siegebreakers are massive, nuclear-powered monstrosities developped during the Crusade by Unterflusionians to counter Katzen superweapons. While technically pale imitations of Katzen engineering, the concept is worth studying."

 AUR_riesigerworks:0 "Riesigerworks Restoration Project"
 AUR_riesigerworks_desc:0 "Riesigerkatzenpanzers require the mightiest of construction infrastructure - which fortunately happened to be located not too far across our border, within the Republic of Purrlin-Lionsburg. Once properly seized, the construction site for these mighty machines shall be restored."

 AUR_prototype_imperialrise:0 "Prototype Imperialrise"
 AUR_prototype_imperialrise_desc:0 ""
 
 AUR_superjets:0 "Superflugzug-Kampfjets"
 AUR_superjets_desc:0 ""

 AUR_weltbomber_projekt:0 "Weltbomber Projekt"
 AUR_weltbomber_projekt_desc:0 ""

 AUR_fabricate_weltaufseher:0 "Fabricate the Weltfaufseher"
 AUR_fabricate_weltaufseher_desc:0 ""

 AUR_study_kst_douclaw:0 "Study the KST Douclaw"
 AUR_study_kst_douclaw_desc:0 ""

 AUR_recreate_supervessels:0 "Recreate Katzenseetruppen Supervessels"
 AUR_recreate_supervessels_desc:0 ""

 AUR_continue_mondkanone:0 "Continue Mondkanone"
 AUR_continue_mondkanone_desc:0 ""

 AUR_the_wait_for_him:0 "The Wait for Him"
 AUR_the_wait_for_him_desc:0 "The Herald is the best Kaiserist to ever exist. Well, second to Him of course. When His empire collapsed, everyone left Him. But not the Herald. The Kaiser will return if Katzens prove themselves ready for His light."

 AUR_he_did_not_have_dissent:0 "He did did not have Dissent"
 AUR_he_did_not_have_dissent_desc:0 "His Imperium was the grandest thing in all of Flusion yet the ungrateful beings that rose up from inside it caused His masterpiece to fall. I will lay the groundwork to remove dissent myself so that when He returns, he will succeed."

 AUR_crushing_liberalism:0 "Crushing Liberalism"
 AUR_crushing_liberalism_desc:0 "By His Will, a mole has been inserted into the Partisanefront and soon it will multiply like a cancer till the partisans collapse from infighting and suspicion."
 AUR_crushing_liberalism_tt:0 "$ipf_strength$ decreases by §Y1§!.\nUnlocks §Rharsh decisions§! to deal with the §2Interne Partisanefront§!."

 AUR_loot_their_reserves:0 "Loot their Reserves"
 AUR_loot_their_reserves_desc:0 "With the IPF routed from His glorious lands, the warehouses they didn't destroy can be secured and taken over."
 AUR_loot_their_reserves_prereq:0 "$ipf_strength$ is §Y1§! or less."

 AUR_breaking_idealism:0 "Breaking Idealism"
 AUR_breaking_idealism_desc:0 "'I want their spines hanging from every townhouse in the state so dissidents can see what we do to rebels with backbones!'"
 AUR_breaking_idealism_tt:0 "$ksk_strength$ decreases by §Y1§!.\nUnlocks §Rharsh decisions§! to deal with the §RKatzensoldaten der Kernländer§!."

 AUR_shatter_their_spirits:0 "Shatter their Spirits"
 AUR_shatter_their_spirits_desc:0 "'Show them... I must show them all... Never another Collapse... He will return.'"
 AUR_shatter_their_spirits_prereq:0 "$ksk_strength$ is §Y3§! or less."

 AUR_the_kaisers_footsteps:0 "The Kaiser's Footsteps"
 AUR_the_kaisers_footsteps_desc:0 "'He will be proud of me! I know it! The rest of Flusion will look on me in disgust but that's because they didn't know the Kaiser loved them. We are the good paragons of the world bringing about a just global unification.'"

 AUR_building_better_imperium:0 "'Building a New Imperium'"
 AUR_building_better_imperium_desc:0 "By instilling a revanchist and patriotic that reminds the people of the old regime, we can stir energy and loyalty into our peoples."
 AUR_building_better_imperium_tt:0 "Modify §Y$AUR_the_kaiser_must_return$§! by: \n$modifier_production_speed_arms_factory_factor$: §G+5%§!\n$modifier_production_speed_industrial_complex_factor$: §R-5%§!"

 AUR_herzlands_darkspot:0 "The Herzland Darkspot"
 AUR_herzlands_darkspot_desc:0 "It has taken so long but we have enough control over our own people that we can start to close the gaping wound of Auralia. Let's cauterize the rest of us while we're at it."

 AUR_finish_the_blinds:0 "Finish the Blinds"
 AUR_finish_the_blinds_desc:0 "To cauterize, we must create a new organization to keep our borders clean of infiltrators and to keep watch over all of our lands from the shadows."
 AUR_finish_the_blinds_tt:0 "Modify §Y$AUR_the_kaiser_must_return$§! by: \n$MODIFIER_TRADE_OPINION_FACTOR$: §R-50%§!"


 AUR_with_some_lights:0 "...with some light"
 AUR_with_some_lights_desc:0 "It would be foolish to avoid allies. The Kaiser had some of His own and the Herald will follow His stride. They can be useful for now."
 AUR_with_some_light:0 "Diplomatic Efforts"
 AUR_crazy_kaiserists:0 "Lunatic Kaiserists"

 AUR_appease_felinean_rival:0 "Appease the Felinean Rival"
 AUR_appease_felinean_rival_desc:0 "Let us expand embassies in each others' states and whisper sweet buttered lies on how to carve the Herzlands. Not that the Herald would lie."
 rival_must_exist:0 "A great power needs to have formed in the East or South."
 ussf_must_exist:0 "There must be a common threat in the South."
 AUR_uneasy_compromise:0 "Uneasy Compromise"

 AUR_meolowtof_ribbawtrop:0 "Meolowtof-Ribbawtrop Pakt"
 AUR_meolowtof_ribbawtrop_desc:0 "A master class in diplomacy: an agreement to split the South between both of us to remove the greatest threat to each of our realms. A peace that will not last."
 AUR_meolowtof_ribbawtrop_tooltip:0 "We will send a §Hproposal§! to the §Ydominant eastern power§! in order to §Rpartition the South§! between us. If we have already signed another §Hproposal§!, we will §Rlose stability§!."

 AUR_remake_work_ethic:0 "Remake Work Ethic"
 AUR_remake_work_ethic_desc:0 "The Southerners are greedy and lazy capitalist while the Northerners are barbaric idiots. The Herald thinks he can make a new Centralist culture that adores militant lable. They will have to follow."
 AUR_remake_work_ethic_tt:0 "Modify §Y$AUR_the_kaiser_must_return$§! by: \n$modifier_production_speed_arms_factory_factor$: §G+10%§!\n$modifier_production_speed_industrial_complex_factor$: §G+10%§!\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+10%§!"

 AUR_pursuit_of_hypermilitarism:0 "Pursuit of Hypermilitarism"
 AUR_pursuit_of_hypermilitarism_desc:0 "We don't have the resources to sustain a truly massive army yet but we can start commanding the people to push for it. Our Katzens will love war. "
 AUR_pursuit_of_hypermilitarism_tt:0 "Modify §Y$AUR_the_kaiser_must_return$§! by: \n$MODIFIER_WAR_SUPPORT_WEEKLY$: §G+0.2%§!"

 AUR_mobilize_greater:0 "Mobilize Greater"
 AUR_mobilize_greater_desc:0 "The Katzens not conscripted to the army will be sent to work the forges. Art is not required in the Herald's nation, poetry scrapped, and artifacts burned to fuel furnaces."

 AUR_almost_as_good_as_him:0 "Almost as Good as Him"
 AUR_almost_as_good_as_him_desc:0 "I am not worthy of Him just yet. But soon... soon I shall be."
 AUR_almost_as_good_as_him_tt:0 "Modify §Y$AUR_the_kaiser_must_return$§! by: \nArmy Defense: §G+5%§!\nArmy Attack: §G+5%§!"

 AUR_start_unification:0 "Start Unification"
 AUR_start_unification_desc:0 "We are growing fat with industry and pollution. It is time we exercise ourselves to show we are a true reunification candidate by seizing a spineless province."

 AUR_a_dark_night:0 "A Dark Night"
 AUR_a_dark_night_desc:0 "'I have given the orders as I am the will of the Kaiser! Bring our order to all of Elowia and remake them!'"

 AUR_reopen_auralian_docks:0 "Reopen the Auralian Docks"
 AUR_reopen_auralian_docks_desc:0 "The dockyards of Auralia made countless ships and heavily contributed to even the KST Douclaw. The Collapse stopped all of that but the Kaiser will want his overseas colonies back."

 AUR_a_grand_fleet:0 "A Grand Fleet"
 AUR_a_grand_fleet_desc:0 "And thus the Kaiser spoke to the people 'Build Me a Navy to Conquer all Worlds!' "
 AUR_a_grand_fleet_effect:0 "We will assemble a fleet of §Y10§! §2Frigates§!, §Y10§! §2Submarines§!, §Y5§! §2Destroyers§! and §Y1§! §2Battleship§!."

 AUR_every_katzen_a_gun:0 "Every Katzen a Gun"
 AUR_every_katzen_a_gun_desc:0 "To bring on the tides of millions of troops once again, further technological efforts will be levied towards making a perfect reliable rifle easy to make to utilize en masse. Only some overworking required."

 AUR_every_gun_a_katzen:0 "Every Gun a Katzen!"
 AUR_every_gun_a_katzen_desc:0 "'I NEED MORE KATZENS. PUT THE KITTENS TO WORK, EVERYKATZ FOR THE ARMY!'"

 AUR_last_preparations:0 "Last Preparations"
 AUR_last_preparations_desc:0 "'MY NATION, IT WORKS. THE KAISER'S NATION IS BEAUTIFUL. HAHAHA!'"

 AUR_eyes_on_the_south:0 "Eyes on the Southern Jewel"
 AUR_eyes_on_the_south_desc:0 "The work the Herald has done to remake a Katzen identity so quickly has done well. An entire new group of militias have been formed while we set demands."
 AUR_eyes_on_the_south_tooltip:0 "Create §Y8§! §2Katzen-Garnison§! units across the nation."

 AUR_swallow_the_free_sun:0 "Swallow the Free Sun"
 AUR_swallow_the_free_sun_desc:0 "'The day has come! Today we march on Felinea itself and bring back into the fold His old provinces. May their weak leaders guide well because we will have no mercy!'"

 AUR_faustian_offer:0 "A Faustian Offer"
 AUR_faustian_offer_desc:0 "Glorious Kayzoo!"

 AUR_turn_to_the_nmi:0 "Turn to the Nitromethane Defilers"
 AUR_turn_to_the_nmi_desc:0 "The Nitromethanes are a despicable people, soiling the hallowed ground which the Kaiser had reserved for his most favorite species. And yet... they could of use to us. Let us create a facade of friendliness as to manipulate them for our benefit before their inevitable destruction."
 
 AUR_herzlands_compromise:0 "The Drakwald Compromise"
 AUR_herzlands_compromise_desc:0 "Although ceding rightful Herzlandish soil to non-Katzens foreigners is an affront to the Kaiser's work, we will promise the Nitromethanes all land south of the Drakwald river in exchange for their aid against the southern scum. We'll rectify it in due time anyways."
 AUR_herzlands_compromise_tooltip:0 "We will send a §Hproposal§! to the §YNitromethane Imperium§! in order to §Rpartition the South§! between us. If we have already signed another §Hproposal§!, we will §Rlose stability§!."

 AUR_they_wont_blunt_our_advance:0 "They Won't Blunt our Advance"
 AUR_they_wont_blunt_our_advance_desc:0 "'NO! They do not bow. They fight back... from the fields, from the mountains, from the forests... they are trying to STOP US! We cannot stall NOW. They will be made an example of.'"

 AUR_going_for_the_throat:0 "Straight for the Throat"
 AUR_going_for_the_throat_desc:0 "Why waste time trudging through Unterkatzen countryside when we can lunge at their throat? Let the waves carry us to victory! Should the twin hearts of Purrlin-Lionsburg fall, their pathetic coalition will surely crumble."

 AUR_remove_the_blight:0 "Cleanse the Blight"
 AUR_remove_the_blight_desc:0 "'The Roqualians are by far the worst of all the Unterflusionians. Not only does their culture go against all that good Katzens believe, but they are also the main architects of His downfall. And yet, despite their very existence being an affront to Katzenkind, they have been allowed to pullulate throughout the Southern Herzlands by the area's degenerate government! I shall... rectify this...'"
 remove_roqual_state_minority_species:0 "Removes $var_species_3$ minorities from the state."
 AUR_remove_the_blight_bypass:0 "The Regent will not get to §Rsavour§! the taste of §RUnterflusionian cleansing§!."
 AUR_remove_the_blight_effect:0 "We will §Rdestroy§! the $var_species_3$ minorities infesting our Solakatzen coastline."

 AUR_a_quick_detour:0 "A Quick Detour"
 AUR_a_quick_detour_desc:0 "'Kusnurk. Kusnurk is... right there. Right over the strait. It was part of His Empire, just as much as Auralia and Purrlin. I must take it. I can take it. I will take it.'"

 AUR_an_ultimatum:0 "An Ultimatum"
 AUR_an_ultimatum_desc:0 "We have won. And yet - the masses of the twin southern megacities continue with their business as if nothing had changed, bargaining with the Unterflusionians rather than with their brethren. How dare they? Their businesses will face towards the north and Auralia, or they will face the wall. 'AND... THIS GOES FOR EVERYONE ELSE TOO!'"

 AUR_bomb_the_heart:0 "Burn their Hideouts"
 AUR_bomb_the_heart_desc:0 "There is a risk of the Catburgians holing themselves up behind the Meojave desert and the Drakwald jungle, leveraging this harsh terrain to their advantage to grind our forces down.\n\n`UNLESS... UNLESS I DESTROY THEM FROM ABOVE!`"

 AUR_victory_parades:0 "Mandate Victory Parades"
 AUR_victory_parades_desc:0 "His Excellency had a taste for resplendent military parades boasting the might of His armies. With poetry burned and art outlawed, they shall remain the only form of entertainment His subjects shall be allowed to indulge in."

 AUR_looting_their_corpse:0 "Loot Their Corpses"
 AUR_looting_their_corpse_desc:0 "The Southern Unterkatzens may be defeated, but there remains much work to be done. Scouring the ruins of their cities and fallen outposts for equipment will work to pre-empt partisan organisations and bolster His Excellency's war-weary armies."
 AUR_looting_their_corpse_effect:0 "Every §Y[?PRL.GetAdjective]§!, §Y[?CAT.GetAdjective]§! and §Y[?HIM.GetAdjective]§! core state under our control will provide some equipment."

 AUR_i_need_it_all:0 "I- HE NEEDS IT ALL!"
 AUR_i_need_it_all_desc:0 "'MY- HIS ENEMIES, THEY ABOUND! IN THE NORTH, IN THE SOUTH, IN THE EAST, THEY MUST BE CRUSHED. THEY MUST BE LEVELLED. THEY MUST BE FLATTENED - ONLY THEN WILL I BE ABLE TO REBUILD HIS ORDER! I CANNOT WASTE MY TIME WITH RABBLE - I MUST REACH FOR THE HEART!'"
 AUR_killed_roqualians:0 "The Regent §Rgave them hell§!."
 AUR_i_need_it_all_effect:0 "There is §Rno time to wait§!. We will §Rburn§! through the Herzlands, or die trying. We will have §Y3 years§! to seize §YKatown§!."

 AUR_blood_sweat_and_blood:0 "'BEND OR BREAK' Protocols"
 AUR_blood_sweat_and_blood_desc:0 "`BEND OR BREAK`\nThese simple words are all that is needed to describe upcoming compliance protocols applied upon the southern countryside. Anyone found opposing the Herald of His Excellency's will be ground into the dirt, plain and simple, with their families made to pay for their crimes."
 AUR_blood_sweat_and_blood_tt:0 "We will have to invest §Rtremendously§! into suppressing resistance.\n$ipf_strength$ increases by §Y4§!.\n$ksk_strength$ increases by §Y4§!.\nModify §Y$AUR_the_kaiser_must_return$§! by: \n$MODIFIER_RESISTANCE_GROWTH$: §R+50%§!\n$MODIFIER_RESISTANCE_TARGET$: §R+50%§!\n$MODIFIER_COMPLIANCE_GROWTH$: §G+50%§!"

 AUR_military_police:0 "His Boots on the Ground"
 AUR_military_police_desc:0 "Lofty policies, genius leadership and grandiose declarations of intent cannot crush our opposition's spirits on their own. Their will must be made manifest by a well-trained and well-equipped military police force on the ground."

 AUR_katzkommissars:0 "His Eyes in the Sky"
 AUR_katzkommissars_desc:0 "The Herald's vast cohorts of loyal, brainwashed Katzens are little more than helpless masses of bandits if they are not guided. The Herald has thus drafted an ambitious plan to elevate the most fanatic and brilliant minds of his domain to the rank of Katzkommissars: brutal, cunning and reckless military governors devoted entirely to restoring His Excellency's order."
 AUR_katzkommissars_tt:0 "Unlocks §HDecisions§! to recruit §HKatzkomissars§! from conquered lands, which can then be dispatched throughout our nation to crush resistance."

 AUR_smash_the_pretenders:0 "Shatter the Pretenders"
 AUR_smash_the_pretenders_desc:0 "The so-called 'fascist' regime of Clermeowth holds a significant amount of His Excellency's former police force and resistance-suppression experts, who have foolishly rallied behind that pizza-munching rat that is Itch Cheumienbeumien. Switch intervention will 'free' them from this unfortunate choise of theirs."

 AUR_crack_mountains:0 "Rend the Mountains Asunder"
 AUR_crack_mountains_desc:0 "'THEY HIDE BEHIND THE MOUNTAINS.'\n\n'HIS EXCELLENCY SAID HE WOULD TEAR THOSE MOUNTAINS DOWN.'\n\n'AND HIS EXCELLENCY NEVER LIES.'"

 AUR_slaves_for_minerals:0 "Slaves for Minerals"
 AUR_slaves_for_minerals_desc:0 "Slavery, while still as detestable of a practice, provides both a cheap source of labor and a means of keeping the conquered masses in check. The great mountains of Tailsbaden shall be mined for all they are worth by the unworthy. Besides, is it not the greatest possible honor, to be allowed to fuel the reconstruction of His Excellency's domain?"
 AUR_slaves_for_minerals_tt:0 "The §YTailsbaden Borehole§! has its effects doubled!"

 AUR_crush_the_spartans:0 "Dismiss Rogue Legions"
 AUR_crush_the_spartans_desc:0 "The Pawris region is home to a number of Meowrine commanders and their legions, who, bereft of His Excellency, had sworn fealty to Elwin von Kattensbach. There can be no negotiations with these traitors!"

 AUR_meowrine_kill_collars:0 "Reverse-Engineer Meowrine Kill-Collars"
 AUR_meowrine_kill_collars_desc:0 "Meowrines were fitted with a number of advanced devices to ensure their loyalty, including a kill-collar that would detonate if they were to exhibit signs of revolt. While His Excellency's disappearance has created a loophole allowing them to run rampant, this technology is nonetheless of great interest, as if it can be mass-produced, the Herald's detractors will find themselves turned to ash."
 AUR_meowrine_kill_collars_tt:0 "Modify §Y$AUR_the_kaiser_must_return$§! by: \n$MODIFIER_RESISTANCE_GROWTH$: §G-10%§!\n$MODIFIER_RESISTANCE_TARGET$: §G-10%§!\n$MODIFIER_COMPLIANCE_GROWTH$: §R-10%§!"

 AUR_chew_slowly:0 "Chew Slowly"
 AUR_chew_slowly_desc:0 "'We have triumphed over the South, and now find ourselves having to deal with a massive, writhing mass of Unterkatzens. We must take our time to chew through them, lest we choke. His Excellency was a visionary, who understood that sometimes, compromises had to be made for long-term stability.'"
 AUR_did_not_kill_roqualians:0 "The Regent did §Rnot§! indulge in the pleasures of §RUnterflusionian cleansing§!."
 AUR_chew_slowly_tt:0 "The Herald has decreed that we shall §Yproceed slowly§!. We will §Ystabilize§! and §Ybide our time§! until the inevitable reconquest of the §Ynorth§! and the §YImperium's Restoration§!.\n\nThe Herald is however having to show §Rimmense restraint§!, and so we must carefully manage his $herald_sanity$, which starts at §Y50§! out of §Y100§!."

 AUR_put_out_the_fire:0 "Putting Out the Fires"
 AUR_put_out_the_fire_desc:0 "Lionsburg burns! Catburg burns! All throughout the Regency's new southern frontier vast bands of partisans adamantly refuse to see the world as the Herald does. It is tempting to murder every last one of them, but... but that is not how He would have done it, is it? Let us make some concessions for the time being..."

 AUR_imperial_education:0 "An Imperial Curriculum"
 AUR_imperial_education_desc:0 "Our youth are the future of His Excellency's new Imperium. A new curriculum shall thus be established as to teach our kittens all there is to know, and engrain within their minds the inevitability of His return."

 AUR_closing_the_blinds_again:0 "Adjusting the Blinds"
 AUR_closing_the_blinds_again_desc:0 "The vile Roquals now encroach upon His Excellency's blessed Herzlandish soil! They could strike at any time and so we must be ready. Yet - we must not give into insanity lest the Roqual invasion become a self-fulfilling prophecy. Slightly opening up and showing our best to the world will mellow out those who would wish us harm otherwise."

 AUR_army_reform:0 "Review the Katzenarmee"
 AUR_army_reform_desc:0 "His Excellency's Katzenarmee was as perfect as could be, with a rigid system of checks and overseers curbing the worst of excesses as He intended. Our current armies are mere bandits by comparaison! I shall personally review my officers and ensure they match what His Excellency would have wanted."
 AUR_army_reform_tt:0 "The §Ysaner§! the Herald is, the more our generals will lose §YAttack§! and gain §YLogistics§! and §YPlanning§! skills."

 AUR_demobilize_slightly:0 "Sustainable Militarization"
 AUR_demobilize_slightly_desc:0 "It has become evident that His Imperium will not be rebuilt within the next five years, or even the decade. There is no point in burdening our state with crippling hypermilitarization, for it would then collapse before He could return to steer it."

 AUR_a_constitution:0 "The Katzenartig Constitution"
 AUR_a_constitution_desc:0 "Every state needs some sort of guiding codes to structure their laws. Of course these laws should put as much power as possible into the Herald's paws, for he knows best, but these nonetheless need to be written down as to ensure the Herald's great reforms are backed not just by arms but by law."

 AUR_cult_of_his_return:0 "Justify the Cult of the Return"
 AUR_cult_of_his_return_desc:0 "It is a tragedy that the minds of most Katzens refuse to accept what is not empirically proven, but alas, one must make due. The Herald shall assemble the Regency's finest scientists and historians as to produce a thesis demonstrating the inevitability of His return."
 #AUR_cult_of_his_return_tt:0 "The higher the Herald's $herald_sanity$, the better the results."

 AUR_reform_the_high_command:0 "Reform the High Command"
 AUR_reform_the_high_command_desc:0 "His Excellency's takeover of the world was aided by the finest minds the Katzen species had to offer. Fortunately for us, these minds are still very much around and kicking throughout the collapsed Herzlands. They will surely jump at the opportunity to get their old jobs back, and His Excellency will be most pleased to find his allies waiting for him."
 AUR_reform_the_high_command_tt:0 "We can now §Grecruit§! members of the §YKatzen High Command§! from defeated nations rather than kill them."

 AUR_manifest_of_his_will:0 "His Will Made Manifest"
 AUR_manifest_of_his_will_desc:0 "With a rigid state apparatus in place and a growing share of our subjects now accepting the inevitability of His return, the Herald can rightfully claim to represent His will in-interim. This will make governance quite a bit easier."

 AUR_biding_our_time:0 "Buying Time"
 AUR_biding_our_time_desc:0 "We cannot afford to call ourselves a short-lived Regency anymore. It is evident that there is far more work to be done than the Herald originally anticipated, with His return being likely later rather than sooner. For stability's sake and as to reassure the rest of the Herzlands of our sanity, we shall rebrand into a transitional Imperium, laying the groundwork for the upcoming decades of arduous preparation."

 AUR_declaration_of_intent:0 "A Declaration of Intent"
 AUR_declaration_of_intent_desc:0 "It is futile to play games and try to hide our try intents. With our status already established as a transitional Imperium, we can now make it clear to the rest of the Herzlands that we very well intend to unite it under our rule. But this cannot be accomplished alone, and so we must emphasize that anyone willing to side with us will be greatly rewarded for their loyalty and efforts in rebuilding His Domain."
  
 AUR_pawns_in_the_east:0 "Pawns of the Feline Sea"
 AUR_pawns_in_the_east_desc:0 "The East of the Herzlands, owing to its distance from Katown's watchful gaze, has been prone to wild ideological divergences from the Katzen norm. Nonetheless there are certainly still worthy collaborators to be found in these mountainous reaches."
 AUR_pawns_in_the_east_tt:0 "Unlocks §YDecisions§! to recruit §Yeastern Herzlands warlords§! into the §YNeu-Katzpakt§!."

 AUR_pawns_in_the_center:0 "Pawns In-Between Giants"
 AUR_pawns_in_the_center_desc:0 "The Central Herzlands are in a precarious position, stuck between the hugely populated and industrialized North and the politically-united South. Some of its disparate leaders are sure to flock to the opportunity to side with the Herzlands' future hegemon rather than being swept away."
 AUR_pawns_in_the_center_tt:0 "Unlocks §YDecisions§! to recruit §Ycentral Herzlands warlords§! into the §YNeu-Katzpakt§!."

 AUR_pawns_in_the_north:0 "Pawns Around the Heart"
 AUR_pawns_in_the_north_desc:0 "The North is home to a myriad of disparate fascist and monarchist cliques vying for power and influence over His Domain's former heart, yet said heart's splendor is so great that none of them can hope to hold onto it in the long term. Let us provide the worthy with the support they need to wrangle the heart in exchange for their allegiance."
 AUR_pawns_in_the_north_tt:0 "Unlocks §YDecisions§! to recruit §Ynorthern Herzlands warlords§! into the §YNeu-Katzpakt§!."

 AUR_northern_promises_kept:0 "Northern Promises Kept"
 AUR_northern_promises_kept_desc:0 "With the North fully under our control and our allies' grip on His Domain's heart as steadfast as ever, the time has come for them to honor their side of the deal."
 AUR_northern_promises_kept_trigger_tt:0 "The §YNorth§! is entirely owned by §YOurselves§! or our §YFaction Members§!."
 AUR_northern_promises_kept_tt:0 "The §Ynorthern warlords§! we allied with will be prompted to become our §Ypuppets§!."

 AUR_eastern_promises_kept:0 "Eastern Promises Kept"
 AUR_eastern_promises_kept_desc:0 "The East is at last free from the ideological rabble which once infested it. Now our faithful collaborators shall honor their side of the deal and permanently join us in the final stretch to restore His sovereignty over the furthest reaches of the Herzlands."
 AUR_eastern_promises_kept_trigger_tt:0 "The §YEast§! is entirely owned by §YOurselves§! or our §YFaction Members§!."
 AUR_eastern_promises_kept_tt:0 "The §Yeastern warlords§! we allied with will be prompted to become our §Ypuppets§!."

 AUR_central_promises_kept:0 "Central Promises Kept"
 AUR_central_promises_kept_desc:0 "Our dominion now stretches from Purrssia to the Katzen Mountains just as it should. Our pawns can rest easy as, rather than being swept away by history, they have cemented their spot as part of His Domain. All they must do now is repay us."
 AUR_central_promises_kept_trigger_tt:0 "The §YCenter§! is entirely owned by §YOurselves§! or our §YFaction Members§!."
 AUR_central_promises_kept_tt:0 "The §Ycentral warlords§! we allied with will be prompted to become our §Ypuppets§!."

 AUR_SOUTHERN_KTZ_fascism:0 "Southern Transitional Imperium"
 AUR_SOUTHERN_KTZ_fascism_def:0 "the Southern Transitional Imperium"
 AUR_KATOWN_fascism:0 "Katzenartig Zentralverwaltung"
 AUR_KATOWN_fascism_def:0 "the Katzenartig Zentralverwaltung"

 AUR_SOUTH_HERZ_1_REGION:0 "Autonomkatzregion Meopinstaat"
 AUR_SOUTH_HERZ_1_REGION_DEF:0 "the Autonomkatzregion Meopinstaat"

 AUR_SOUTH_HERZ_2_REGION:0 "Autonomkatzregion Südherzlands"
 AUR_SOUTH_HERZ_2_REGION_DEF:0 "the Autonomkatzregion Südherzlands"

 AUR_EAST_HERZ_1_REGION:0 "Autonomkatzregion Ezikanien"
 AUR_EAST_HERZ_1_REGION_DEF:0 "the Autonomkatzregion Ezikanien"

 AUR_EAST_HERZ_2_REGION:0 "Autonomkatzregion Lionitien"
 AUR_EAST_HERZ_2_REGION_DEF:0 "the Autonomkatzregion Lionitien"

 AUR_NORTH_HERZ_1_REGION:0 "Autonomkatzregion Pouchkinnebenen"
 AUR_NORTH_HERZ_1_REGION_DEF:0 "the Autonomkatzregion Pouchkinnebenen"

 AUR_NORTH_HERZ_2_REGION:0 "Autonomkatzregion Großclermeowth"
 AUR_NORTH_HERZ_2_REGION_DEF:0 "the Autonomkatzregion Großclermeowth"

 AUR_CENTRAL_HERZ_1_REGION:0 "Autonomkatzregion Zentralbergen"
 AUR_CENTRAL_HERZ_1_REGION_DEF:0 "the Autonomkatzregion Zentralbergen"

 AUR_CENTRAL_HERZ_2_REGION:0 "Autonomkatzregion Purrßsen"
 AUR_CENTRAL_HERZ_2_REGION_DEF:0 "the Autonomkatzregion Purrßsen"

 AUR_restructure_the_imperium:0 "Becoming the Heart"
 AUR_restructure_the_imperium_desc:0 "From Nordikat to Purrlin, Auralia to Struken, Meon to Winston, and through the tireless work of our armies and pawns, His Domain has been cleansed of doubters and naysayers. As to mark the end of the Herzlands' warlord era, our government shall be returned to Katown where it belongs, and from where we will be able to more effectively oversee the next steps of the Herald's grand plan."
 AUR_restructure_the_imperium_tt:0 "We will assume direct control of §YGreater Katown§! and move our government there!\nThe $herald_sanity$ mechanic will be §Gdisabled§! - as the worst is now behind the Herald!"

 AUR_grand_reorganization:0 "Redrawing Felinea"
 AUR_grand_reorganization_desc:0 "The political marvel of a truly united Herzlands was made possibly only by His Excellency lording over a fully compliant population. That is, unfortunately, no longer the case. The best solution to avoid rushing reconstruction or outright collapse is thus partial decentralization into specialized regions headed by our trusty collaborators. This will ensure Herzlandish reconstruction occurs at precisely the right pace and with proper care for each of its regions over the next couple decades."
 AUR_grand_reorganization_tt:0 "The Herzlands will be §Yreorganized§! into a set of eight §YAutonomkatzregions§! headed by our pawns, with us in control of just §YGreater Katown§!. These will be tasked with overseeing the decades-long process of reconstruction and reconciliation in anticipation of §YHis return§!."

 AUR_his_domain_will_be_ready:0 "His Domain Shall be Ready"

 AUR_re_establish_the_katzregion:0 "Reinstate the Katzregion"
 AUR_re_establish_the_katzregion_desc:0 "His Excellency's Imperium featured a number of perfectly-delineated regions, each given a task to fulfill within the greater collective. If the Herald's Imperium is to be worthy of His Excellency's return, then this organization must be brought back post-haste."
 
 AUR_re_mint_the_katzmark:0 "His Excellency's Central Bank"
 AUR_re_mint_the_katzmark_desc:0 "With our industry fully functional, and the vast southern megalopolis under our control, we can now leverage southern banking services to properly re-establish a central bank which will, in term, hopefully control the currency of the entire Herzlands."

 AUR_look_to_his_domain:0 "Look to the Heart of His Domain"
 AUR_look_to_his_domain_desc:0 "'Auralia has been made GREAT. But it is not there that He orchestrated His splendid conquest of the world. The rest of the Herzlands is little but rabble in the face of Katown's splendor - if I- we can seize it, then the rest will be easy pickings.'"

 AUR_incorporate_itch_police:0 "Salvage His Excellency's Police Force"
 AUR_incorporate_itch_police_desc:0 "With the Clermeowth regime crushed beneath our boots, the Herald has seen fit to pick up the remnants of His Excellency's police personel and infrastructure as to incorporate them into his own."
 AUR_incorporate_itch_police_tt:0 "Modify §Y$AUR_the_kaiser_must_return$§! by: \n$MODIFIER_RESISTANCE_GROWTH$: §G-10%§!\n$MODIFIER_RESISTANCE_TARGET$: §G-10%§!"

 AUR_meowrine_power_armor:0 "Retool Salvaged Power Armor"
 AUR_meowrine_power_armor_desc:0 "Clashes with forces in Pawris have revealed a number of unfinished power armor prototypes of little military valu-\n\n`THEY SHALL BE MADE INTO THE CLAWS WITH WHICH HE SHALL REAP RICHES FROM THE SOIL!'"

 AUR_military_schools:0 "Pure Military Education"
 AUR_military_schools_desc:0 "Let us be clear - the current generation of kittens is unlikely to reap the rewards that come with restoring His Excellency's Imperium. As such, they have no need to be taught about more complex subjects such as science or law. They must simply know how to fight."
 AUR_military_schools_tt:0 "Modify §Y$AUR_the_kaiser_must_return$§! by: \n$MODIFIER_RESEARCH_SPEED_FACTOR$: §R-15%§!\nArmy Attack: §G+10%§!\n$MODIFIER_ARMY_ORG_FACTOR$: §G+10%§!"
 AUR_supreme_authority:0 "His Excellency's Supreme Authority"
 AUR_supreme_authority_desc:0 ""
 AUR_supreme_authority_tt:0 "Modify §Y$AUR_the_kaiser_must_return$§! by: \n$MODIFIER_WEEKLY_MANPOWER$: §R-1000§!\n$MODIFIER_POLITICAL_POWER_GAIN$: §G+0.50§!"

 AUR_the_path_to_katown:0 "Reaching for the Heart"
 AUR_the_path_to_katown_desc:0 "`I CAN FEEL IT.`\n`HIS DOMAIN'S STILL-BEATING HEART.`\n`WITHIN REACH...`"
 AUR_the_path_to_katown_tt:0 "We will §Rdeclare war§! on all nations around Katown!"
 
 AUR_over_the_meoder:0 "Boiling the Meoder"
 AUR_over_the_meoder_desc:0 "The great Meoder River floods from Katown onto the Highest Sea, providing the perfect defence for His Excellency's detractors. It too, shall be-\n`BOILED. IT SHALL BE BOILED, WITH ALL THE NORTHERN TRAITORS INSIDE! THAT WILL... SHOW THEM...`"
 AUR_over_the_meoder_tt:0 "§YTroops§! on the §Yother side§! of the §YMeoder River§! will be §Ydamaged§! by the ensuing radioactive waves."
 nuke_state_fission_tt:0 "Deploys a §8Fission Warhead§! in the state."

 AUR_airdrop_cannon_fodder:0 "Fodder Over Yonder"
 AUR_airdrop_cannon_fodder_desc:0 "`PRISONERS. SLAVES. GIVE THEM THE KILL-COLLARS. AND THROW THEM OVER THERE. LET THEM SOW CHAOS. IF THEY LIVE, THEY ARE FREE.`\n\n`THEY WON'T LIVE.`"

 AUR_katown_dash: "Warplan Fall des Herzens"
 katown_dash_desc: " "

 AUR_kpk_agreed_autohubs:0 "The KPK agreed to cooperate"

 AUR_state_of_arms:0 "State of Arms"
 AUR_state_of_arms_desc:0 "The Nordherzlands had always been a center of militaristic culture, even for Katzens, but the lingering aspects of the Imperium rests on every nation. Ours is no different although the Herald's lands"

 AUR_neu_seetruppen:0 "Founding the Neu-Katzenseetruppen"
 AUR_neu_seetruppen_desc:0 "With a sizeable fleet now in our possession, it is time to formally set up a branch of our military dedicated to maintaining it. His Excellency called it the Katzenseetruppen, so why change old habits?"

 AUR_reintroduce_naval_academy:0 "Reintroduce the Auralian Naval Academy"
 AUR_reintroduce_naval_academy_desc:0 "One of the most prestigious spots for new Katzeetruppen officers to come from was from the same city that centralized the lands of the Herald. After the Collapse, its honor was defiled and looted to serve as resources for the new regime. Now that the lands have stabilized, it is time to restore a new admiralty."

 AUR_secondary_dockyards:0 "Create Secondary Dockyards"
 AUR_secondary_dockyards_desc:0 "'They’re spying on us! The South! Gods-cursed Kibbles is using the COWARD UNTERKATZEN REFUGEES leaving m- the Kaiser’s Greatest State to discover our secrets. We can NOT let them learn about our fantastic naval rearmament.' - The Herald speaking to advisors"

 AUR_storm_the_pyramid:0 "Storm the Pyramid"
 AUR_storm_the_pyramid_desc:0 "`THE FOOL DOUCLAW! HE PUSHES BACK AGAINST HIS EXCELLENCY'S NEW DOMAIN? HE GIVES ME NO CHOICE. HIS HIDEOUT WILL BE CRACKED, AND RETURNED TO ITS RIGHTFUL OWNER!`"

 AUR_clamp_down_on_the_north:0 "Wrangle the Heart"
 AUR_clamp_down_on_the_north_desc:0 "Several high-ranking Elwinian officials have offered to join up with the Herald to aim the transfer of power. They will be of use.\n\n`THE HEART! THE HEART OF HIS DOMAIN IS MINE! IT FIGHTS BACK? NO! IT CANNOT. IT WILL NOT.`"

 AUR_the_second_dreijahrige:0 "A Second Dreijährige"
 AUR_the_second_dreijahrige_desc:0 "The gaping hemorragia brought upon by the Herald's conquest all throughout our logistical infrastructure must be repaired, if not prevented altogether in the future.\n`THE NORTH! ITS FACTORIES LAY IN RUIN, BUT I NEED THEM TO REBUILD HIS DOMAIN. REBUILD THEM! REBUILD THEM ALL YESTERDAY! FUNNEL ALL THE UNDESIRABLES AND ALL THE SLAVES!`"

 AUR_mass_conversion:0 "Towards the Kiloforge"
 AUR_mass_conversion_desc:0 "His Ambitions call for an unending flow of panzers and bombers. Less important parts of our economy will have to go.\n\n`SOON HIS DOMAIN SHALL BE WROUGHT ENTIRELY OUT OF METAL AND METTLE! AND THEN THEY SHALL BEND.`"
 AUR_mass_conversion_tt:0 "Every state with at least §G1§! §HCivilian Factory§! has one §HCivilian Factory§! replaced with a §HMilitary Factory§!."

 AUR_the_greatest_army:0 "The 'Katzenarmee' Reborn"
 AUR_the_greatest_army_desc:0 "`NO MORE RETIREMENT. NO MORE EXEMPTIONS. EVERYONE WILL SERVE. NO EXCEPTIONS.`"

 AUR_unto_the_breach:0 "Unto the Breach"
 AUR_unto_the_breach_desc:0 "`THE HEART IS RECLAIMED, BUT HIS DOMAIN IS STILL NOT READY, FOR IT YET MISSES THE EAST! I- HE CANNOT BE HAPPY OF SUCH AN INCOMPLETE DOMAIN. THE RABBLE ENDS NOW.`"
 AUR_unto_the_breach_tt:0 "We will declare §Rwar§! on §Revery remaining Herzlandish state§!."

 AUR_reap_knowledge:0 "Reap the Knowledge"
 AUR_reap_knowledge_desc:0 "'A THOUSAND YEARS' WORTH OF RESEARCH BORNE OUT OF HIS GRANDIOSE MIND LAY ROTTING IN FRANKFURR, UNTERKATZENS AND UNTERFLUSIONIANS DOING NOTHING BUT ENDLESSLY PROBE AT WHAT THEY CANNOT UNDERSTAND. MINE! IT WILL ALL BE MINE!'"
 AUR_remove_monke:0 "Erase All Blight"
 AUR_remove_monke_desc:0 "'THE MORE I EXPAND THE MORE BLIGHT THERE IS. I HAVE NO NEED TO RESTRAIN MYSELF ANYMORE. HIS EXCELLENCY'S DOMAIN SHALL BE MADE PURE!'"
