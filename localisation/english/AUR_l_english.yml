 AUR_hell_for_commies:0 "Raze Meownich"
 AUR_hell_for_commies_desc:0 "'MEOWNICH! THE BIRTHPLACE OF HERZLANDISH COMMUNISM... NO MORE! ERASED! IT NEVER HAPPENED!'"

 AUR_elevate_the_monument:0 "Elevate the Monument"
 AUR_elevate_the_monument_desc:0 "'THE PEOPLE OF ELIOTTOWN HAVE THE RIGHT IDEA. BUT THEY DID NOT GO FAR ENOUGH! I SHALL COMMISSION EFFIGIES OF MYSELF PERSONALLY TEARING UNTERFLUSIONIANS APART, TO ADD TO THE MONUMENT...'"
 AUR_elevate_the_monument_tt:0 "The effects of the §H$var_wonder.14$§! are §Gdoubled§!."
 AUR_the_new_superhighway:0 "Superhighway Funds"
 AUR_the_new_superhighway_desc:0 "'FASTER! FASTER! OUR ENEMIES CANNOT BE ALLOWED TO BREATHE, WE MUST OUTRUN THEM! LET HIS WILL GUIDE A THOUSAND CONCRETE TENTACLES AS THEY WRAP AROUND THE HERZLANDS!'"
 AUR_the_new_superhighway_tt:0 "The effects of the §H$var_wonder.10$§! are §Gdoubled§!."

 AUR_fuel_the_bombs:0 "Fuel His Might"
 AUR_fuel_the_bombs_desc:0 "'HIS MIGHT, HIS VISION CALLS FOR A THOUSAND THOUSAND SUNS DROPPED UPON THOSE WHO WRONGED HIM! LET THE BLOOD OF THE EARTH FUEL THE FURY OF THE STARS!'"
 AUR_obliterate_the_encroachers:0 "Push Back the Encroachers"
 AUR_obliterate_the_encroachers_desc:0 "'ALREADY HIS SUBJECTS GROW COMPLACENT. ALREADY HIS ENEMIES REGROUP AND ENCROACH. NO!!! ONLY PERPETUAL CONFLICT CAN SHARPEN HIS SUBJECTS INTO A BILLION SWORDS TO KILL A BILLION UNTERFLUSIONIANS!'"
 AUR_his_domain_is_ready:0 "His Domain is Ready"
 AUR_his_domain_is_ready_desc:0 "'HIS DEFILERS. CLEANSED.\n'HIS DOUBTERS. GONE.'\n'HIS ENCROACHERS. PUSHED BACK.'\n'ALL IS READY. NOW, NOW I MUST WAIT, AND SPREAD HIS WILL FURTHER AND FURTHER, UNTIL HIS BLESSED RETURN!'"
