l_english:

 #Events
 AUR_industry.4.t:0 "Dreijährige Term Complete"
 AUR_industry.4.d:0 "Another step of the Herald's grand Dreijährige project has been successfully completed. Work on the next year-long step is due to begin immediately."
 AUR_industry.4.a:0 "Splendid."
 AUR_industry.4.a.tt:0 "Check the §HDecisions Tab§! for the specifics of the next §HDreijährige Term§!."

 AUR_event.1.t:0 "The Wait for Him"
 AUR_event.1.d:0 "The Herald's paws tapped gently on his grand wooden task covered in extensive military orders, execution commands, and impossible industrialization demands. He knew it wasn't possible to do it all, but he had to make it real anyway.\n\nIt would be needed for when He came back. The Kaiser was so close to victory those GODS-RIDDEN, UNGRATEFUL, ABOMINABLE UNTERFLUSIONIANS somehow managed to stop His Imperium that ruled most of the planet.\n\nArmies that marched in the hundreds of millions, tech decades ahead of everything, culture more wonderful than any xenos artpiece, and so so much more. He, the Imperial Herald of the Kaiser, would make it back. He may of been a simple general-bureaucrat but he would show this planet that Kaiserism wasn't done with Flusion."
 AUR_event.1.a:0 "Announce the Dreijährige Reimperialisierung."
 
 AUR_event.2.t:0 "Dreijährige Failed"
 AUR_event.2.d:0 "They say the reason the Imperium fell was out of arrogance and the Regency was no different. Its predecessor was overwhelmed by vast tide of resistance by the unterflusionians, the strain of its exorbitantly priced superweapons, the megalomania of the Kaiser, and far far more. The Regency has failed in its plan.\n\nThe Herald has, supposedly, gone into a deep depression and refuses to leave his adhoc palace above the Auralianisches Platz. His council are whirling together what they can but even the political dissenter slaves know that something is wrong. Guards leaving positions because they aren't paid or maybe its the new ragged uniforms that can hardly be created anymore.\n\nThe people are suffering to the extreme and most of the population is rapidly on progress to become impoverished, starving peasants under the serfdom of some mad lord who made them work to death just to achieve... nothing of worth. This entire Reimperialization plan was a waste of time and effort and-\n\nThe metaphorical revolutionary Sobaks are baying for blood and they will find it soon. Kaiser save us all."
 AUR_event.2.a:0 "KAISER BLAST YOU ALL! IT IS STILL RECOVERABLE!. KILL THEM NOW!"
 AUR_event.2.b:0 "Do you hear the people sing, Herald?"

 AUR_event.3.t:0 "Dreijährige Reimperialisierung Utter Success!"
 AUR_event.3.d:0 "After three hard, long years of labor, the Imperial Regency is a roaring fortress of industry. Vast swathes of pollution clouds pour from Auralia towards the unterkatzens in the South. The great pre-collapse shipyards still churning out vessels to swarm the seas of the Kaiser. The rest of the Regency is the most developed in the Herzlands and is an astounding country-fortress.\n\nThe vast amounts of people worked to death and the strain on a barely post collapse economy trying to rebuild itself has snapped back. While we are greater, the Kaiser's greatest hope will need a recovery period before all the new facilities and our government to run at full operational capacity."
 AUR_event.3.a:0 "Excellent."

 AUR_event.4.t:0 "In His Tracks"
 AUR_event.4.d:0 "we love the kaiser!!!!"
 AUR_event.4.a:0 "Yes."

 AUR_event.5.t:0 "Base Camp"
 AUR_event.5.d:0 "Kitti Luft watched from the edge of the door frame as the Herald's police military handed the draft cards to both of her parents and handed over new schedules of their lives to train.\n\n“Herr Zuwulf... I have work in His factories-” Jovel began to speak before getting back handed by an armored glove. A small splatter of blood lazily hit the dirty floor.\n\n“You can work in the factory after training. Every day, every morning you will be there. At night you may work for pay. The Herald knows best.” The soldier spoke with disdain and disgust but he had shown mercy in not an instant shooting.\n\n“Danke Here Zuwulf. We will serve the Herald well.” Kitti's mama spoke up while her husband held a paw up to his jaw."
 AUR_event.5.a:0 "Kitti Luft missed Vater and Mütter reading her favorite story."

 AUR_event.6.t:0 "Imperial Regency proposes Meolowtof-Ribbawtrop Pakt"
 AUR_event.6.d:0 "Agents from the mysterious Imperial Regency have approached us bearing a highly-secretive proposal from the Herald of the Kaiser himself. Given the threat posed to both of us by the southern power bloc, they propose the 'Meolowtof-Ribbawtrop Pakt' - an agreement to strike the south at the same time and carve it up between our two states.\n\nNamely, they seek to take the lands of Purrlin-Lionsburg and Catburg, while we would recieve Lionita, Meon and possibly parts of the White Peak Rangers.\n\nWhile the Regency is... very much opposed to our ideals and beliefs, it is undeniable that the united south poses a major threat to us and that swift action must be taken if we are to contain its growth."
 AUR_event.6.a:0 "Let's work together... for now."
 AUR_event.6.a.tooltip:0 "Whenever the §YImperial Regency§! attacks the South, we shall join them and attack §YLionita§! and §YMeon§!."
 AUR_event.6.b:0 "Who does the Herald think he is?!"

 AUR_event.7.t:0 "Pakt Response"
 AUR_event.7.d.yes:0 "Our agents have informed us that the [regency_partner.GetName] has accepted the Meowlotof-Ribbawtrop Pakt.\n\nWe shall thus strike at the South together."
 AUR_event.7.a:0 "Most excellent news."
 AUR_event.7.d.no:0 "Our agents have informed us that the [regency_partner.GetName] has refused the Meowlotof-Ribbawtrop Pakt.\n\nWe will have to stand alone."
 AUR_event.7.b:0 "The Herald didn't need them anyways!"

 AUR_event.8.t:0 "The Herald Strikes South!"
 AUR_event.8.d:0 "The Imperial Regency has began its invasion of [PRL.GetNameDef] and [CAT.GetNameDef]. Thus, as per the Meowlotof-Ribbawtrop Pakt, it is now up to us to come to their aid."
 AUR_event.8.a:0 "Let us proceed."

 AUR_event.9.t:0 "Broken Souls"
 AUR_event.9.d:0 "The Herald wasn't lying when he said he was going to hang the spines of the IPF rebels on every townhouse. There were hundreds, rather thousands of spines across his Regency.\n\nHomes of dissidents were marked with the skulls of traitors so that neighbors knew to keep watch. The shallow graves given to rebels had their tailbones stuck lazily in the ground above them so all could know that they were COWARDS.\n\nThe Internale Partisan Fronte and their pathetic socialist allies remain active in most of the Herzlands but this gruesome mass slaughter has cut them off from infiltrating ever again."
 AUR_event.9.a:0 "I SAID KILL ALL TRAITORS!!"
 AUR_event.9.a.tt:0 "$ksk_strength$ decreases by §Y3§!."
 AUR_event.9.b:0 "Good... good enough."
 AUR_event.9.b.tt:0 "$ksk_strength$ decreases by §Y2§!."

 AUR_event.10.t:0 "Jovel Luft"
 AUR_event.10.d:0 "Kitti Luft begged her father to not go to work under the Herald's new economic plan. She heard from her teacher, the missing one, that it was dangerous. Bad work conditions and some other things that she didn't understand.\n\nWhen her father left anyway, she cried in her room on her half-dirt, half-rotten wood floor for hours. Her mother, Lucy Luft, tried to comfort her and tell her he would come back. Kitti didn't pay attention until hours later.\n\nHer father came back. She hugged him despite Jovel being covered in industrial filth and oil alongside a shellshocked look in his eyes. Kitti didn't notice, she loved her parents."
 AUR_event.10.a:0 "Jovel gave his little Katzchen a toy."

 AUR_event.11.t:0 "What Would He Do?"
 AUR_event.11.d:0 "The Herald stood on the balcony above the grand Auralianisches Platz in its namesake city. Thousands worked beneath him in what used to be a vast site of cultural celebration. He remembered the military parades of the Kaiser as well as showcases of the art seized from foreign conquests. Those unterflusionian arts had been melted down or burned after their ingratitude at His kindness. He wanted to make them all into Katzens! But they rejected Him!\n\nNowadays, the plaza was functionally an open-space workshop of putting together guns, filling ammo with gunpowder, creating anti-air emplacements, and military training all in one spot. It was a rather large plaza in that aspect and even larger with all the fountains removed. It wasn't the most efficient place he could put things but it let the Herald watch over their work. And the people could see that he was watching, that the Herald knew what was happening.\n\nSometimes they looked up at him before being driven away by taskmasters. He occasionally saw flocks of them perform their work slowly. Occasionally the Herald would even perform discussions with his advisors on the war plans although everything spoken loudly was propaganda. It showed an open trust in the crowds and how well the Regency was running even if it wasn't exactly true. Today, he looked out to the Auralianisches Platz and thought about what he would do today. What would the Kaiser be doing now? Not that he was better than the Kaiser."
 AUR_event.11.a:0 "The Herald gives orders from the Kaiser."
 AUR_event.11.b:0 "The Herald re-enacts one of the Kaiser's beautiful speeches."

 AUR_event.12.t:0 "Kleine Luft"
 AUR_event.12.d:0 "Kitti knew that she was't really allowed to have friends. Er, well, not that per say- she loved this phrase after reading it from a rare book- but not any “foreign” friends. She had one technically, no body knew about him. He was a few years older than her, an adult but she was grown up enough to talk with him. His name was Dewy.\n\nDewy says he was apart of a bigger friend group from South Auralia that wanted to bring back voting and things like that. She didn't really know what he meant by that and he never wanted to stay long enough to explain it to her. Kitti was seven and her friend said he was about eleven or so, he said he was one of the youngest members of the friend group.\n\nOne day, the Herald announced something like more coastal defense boats and stronger borders. Her friend came over one last time and said his goodbyes. Kitti Luft didn't really understand why he wasn't coming back but she hugged him one last time." 
 AUR_event.12.a:0 "An IPF agent was shot border-crossing with a hand-carved wooden tank toy in his paw."

 AUR_event.13.t:0 "Traitor Execution List #7829-KV"
 AUR_event.13.d:0 "Olanius Pawious, factory union leader, sent to the Kittville Nordarbeit Labor Camp.\nDebramaw Neirch, revolutionary, publicly shot.\nScritch Schuss, cultural deviant, fired from public service; placed on watch list.\nLeopold Purrberg, espionage, shot.\nFelix Fürst, illegal belongings, all possessions seized by the Herald.\nMiau von Spielburg, sabotage, tortured for KSK knowledge; publicly shot.\nKitti Luft, escapee-\n\n[OPEN FILE]\nKitti Luft belonged to the worker class family of Jovel and Lucy Luft. Both parents served the state admirably and have no on record complaints of the system. Lucy Luft was on track to become an officer. Kitti Luft admitted to having dealings with an IPF terrorist where she got the idea to leave the country. Despite increased border security, she escaped and was welcomed across the Meowignot Line by Republican troops.\n\nDue to her insignificance in the Regency, she had no new information to give to the South although admitted to telling them everything she could. She was sent into a foster home where she lived for at least a year while 'trying to fix her life.' Openly resisted the Kaiser's forces when they entered Lionsburg and joined into the Anti-Kaiserist Lionsburgite Legion. The Legion was forced into hiding with the capitulation of southern Felinea.\n\nKitti Luft was apprehended and interrogated within Kittville which happened to be her home town. She has been sent to the Kittville Nordarbeit Labor Camp under exhaustive conditions. Body failure expected to happen in three weeks with net gain in resources spent.\n[CLOSE FILE]\n\nKitti Luft, escapee, sent to the Kittville Nordarbeit Labor Camp, worked to death.\nGretchen Miauheim, revolutionary, publicly shot.\nLudwig-" 
 AUR_event.13.a:0 "The Herald smiles warmly."

 AUR_event.14.t:0 "In the Pyramid"
 AUR_event.14.d:0 "The Herald sits down in the office chair at the very tip of the most gorgeous structure in the world, the Kaiser's very own Katown Pyramid. It was impenetrable and the perfect place to plan the world conquest of the entire planet! And then He would return! Everything would be hallowed lands filled with Katzens and just as beautiful as every Kaiser-touched relic in this room. The Herald wo- There's a knock on the door. He had strict orders that anyone bothering him would be shot!\n\n'I'll have to do it myself.' The Herald muttered to himself and pulled out a Katzenluger from his pocket. It was gilded in gold and had images of the Kaiser carved into it. He opened the door and aimed the gun at what would very likely be the head of the intruder. The Katzen that was knocking was-\n\n-the office's rightful owner. Kaiser Kattail seemed... a mix of angry, scared, confused and disoriented as he looks around the room. He's seemingly... exhausted, too, as he's panting a bit, as if he had ran.\n\nThe Herald stood there, mouth agape and was too shocked to even lower his gun. The Kaiser stared back as his senses recovered. As the Herald dropped the gun on the floor and bowed, the Kaiser took a regal pose once again as he noticed the map of the second Katzenartig Imperium with more modern borders. 'Herr Kaiser, I have done so much for you. I'll kill all the unterflusionians-'\n\n'The WHAT?' The Kaiser began, stomping angrily towards the Herald. The Herald fell backwards onto his tail and crawled backwards. He began to continue again. 'The unterflusionians! The ones that destroyed your glorious empire that would save the good members of the Katzen species! I've- I mean we've been waiting for your return to lead us into eternal victory!'\n\nThe Herald stuttered as the Kaiser fumed with rage. This was not the Imperium he wanted to build! All Flusionians were meant to be treated equally as one species called Katzens! And GOOD members of the Katzen species? They were all just Katzen. The Kaiser spoke, his voice booming and loud. 'You disgust me, you primitive troglodytic beast. I'd rather lose my crown than take control of this... rotted carcass of a nation you call an Imperium.'\n\nThe Kaiser vanished in a flash. The Herald started to cry." 
 AUR_event.14.a:0 "The Herald reaches for the Katzluger."
 AUR_event.14.b:0 "The Herald orders the cameras scrubbed and everyone that might access to the footage of the 'fake' Kaiser shot."

 AUR_event.15.t:0 "The Only Answer"
 AUR_event.15.d:0 "As the Herald reaches for the gun, he wondered what he did wrong. How did He not hate them? Did they not destroy everything that was sacred? They stopped Him from bringing order to this wretched world? How was the Herald wrong? He did everything RIGHT! EVERYTHING HE DID WAS FOR THE KAISER!\n\nThe Katzen starts to sob. It didn't make sense to him. How could he have been rejected so cruelly?\n\n'Kaiser forgive me.'\n\nRed paints the walls.\n\nThe Herald is found dead in his office by his high command an hour later with note that simply says: 'The Kaiser came, He hated me.'" 
 AUR_event.15.a:0 "The Herald is turned into an AI-driven hologram to lead the nation forever."
 AUR_event.15.b:0 "A power struggle is formed within the highest echelons of hypermilitarist society."

 AUR_event.16.t:0 "Rotted Carcass"
 AUR_event.16.d:0 "The High Command of the new Katzenartig Imperium took a few days to debate who would take charge. Of course, Katzen civility of the most cruelest individuals on the planet doesn't last that long so it took a very small amount of time for generals to be accumulating the most elite troops\n\nSomeone declared themselves leader after a week of this instability. They were shot dead in moments by a rare Katzenartig Soulbot that joined as a bodyguard for the next man who declared themselves leader. They were poisoned in the next three hours.\n\nThe greatest generals of the Herald's Imperium started dropping like flies as they all just... killed each other for a bid for power. But some of them were more clever than others. Such as dead hand systems. Most were bluffs but some of these generals had nuclear codes and-\n\nAs the Pyramid went to hell and no one could take power, the silos fired missiles at each other and cities across the Herzlands favored or under control by these generals. Hundreds of millions burned in atomic fires for their unworthiness under the Kaiser."
 AUR_event.16.a:0 "And thus dies the Kaiser's dream of a united Flusion."
 AUR_event.16.a.tt:0 "§RThe Herzlands are in ruin.§!"

 AUR_event.17.t:0 "Imperial Regency Proposes Admiral Extradition"
 AUR_event.17.d:0 "A missive from the peculiar and secretive Imperial Regency, apparently hand-written by the Herald himself, has today arrived in Ataril.\n\nThe Herald apparently wishes to bargain for some of our admirals, in exchange for compensation in the form of heavy industrial equipment.\n\nAre we really to send our brightest seafarers to such a nation? It is true that we could use some industrial aid..."
 AUR_event.17.a:0 "If they so desire."
 AUR_event.17.b:0 "Never!"

 AUR_event.18.t:0 "[NAV.GetLeader] Accepts!"
 AUR_event.18.d:0 "The [NAV.GetName] has acceded to the Herald's request for admiral transfer! Their bright seafarers have been given a pompous welcome in the newly-reopened Auralianisches Seeacademie. Already their vast knowledge is proving beneficial to our navy corps."
 AUR_event.18.a:0 "'SPLENDID!'"

 AUR_event.19.t:0 "[NAV.GetLeader] Refuses!"
 AUR_event.19.d:0 "The [NAV.GetName] has unfortunately refused the Herald's request for admiral transfer. We will have to do without them."
 AUR_event.19.a:0 "'May they DROWN!'"

 AUR_event.20.t:0 "Excising the Blight"
 AUR_event.20.d:0 "At last! The South had fallen, and with it writhing masses of millions of Unterkatzens came under the Regent’s thumb. And they were guilty, guilty indeed of the greatest crime there is. That being, through a combination of the Southerners’ naivety and greed, allowing the Unterflusionian blight to take hold and fester within the southwestern edge of the Herzlands, now home to millions of Roqualians.\n\nRoqualians! The Antikatzens! They who first rejected then felled the Kaiser and slayed His Imperium, leaving millions to die during its agonizing bleedout. They, of course, tried to leave, and the Regent, in his kindness, decided to aid them.\n\nFirst, the Northern Solkatzia Bridge and every major port in the south was blockaded by his victorious armies. Then, his forces forces methodically rounded up every single Roqualian in the south, before marching them all the way to the coastlines of Itchiloo and loading them into thousands upon thousands of seized convoy ships, under the pretense of ‘sending them back to Roqualia’.\n\nBut they never reached Roqualia - rather, the Regency’s navy opened fire upon the convoys as they were making their way westwards. Volley after volley, more and more of the cargos sank beneath the waves, each taking tens of thousands of Roqualian lives and dozens of traitorous Southerner crewmates with them.\n\nAnd the Regent stood upon the deck of the largest of his vessels, watching in delight as the Unterflusionians helplessly struggled against the waves. They had been taken care of, but this would not suffice. How many more such traitors infested the Herzlands under seemingly feline appearances? It mattered not. The Herzlands had cancer, he was the cure, and he needed to control it all if he wanted to apply it properly. Only once his duty was finished would His Excellency return to a regenerated Herzlands." 
 AUR_event.20.a:0 "Why don’t they use this execution method more?"

 AUR_event.21.t:0 "A Flood Of Bodies"
 AUR_event.21.d:0 "Reports are flooding in of tens of thousands of drowned Roqualian corpses washing ashore all throughout our coastlines. Dozens of beaches alongside dockyards and ports have been locked down while clean-up and identification of the bodies are underway.\n\nEvidence points to these being former Roqualian residents of the Southern Herzlands, drowned en-masse in a horrendous massacre carried out by the Imperial Regency’s naval forces as they were evacuating Felinea. Numerous friends and relatives of our own citizens have been located amongst the victims, with international cooperation already being underway to return the bodies to their closest relatives.\n\nShock and outrage spread throughout media like wildfire, with many calling for ‘immediate intervention’ against the Regent and his cronies, although the current geopolitical situation makes this difficult. Others have tried to numb the pain by claiming that these Roqualians ‘were doomed to begin with as they choose to stay in the Herzlands’.\n\nNo matter the case, numerous days of mourning have been declared to honor the victims while reports of anti-Katzen violence have skyrocketed as many look for scapegoats onto which to unleash their grief." 
 AUR_event.21.a:0 "Utterly atrocious."
 AUR_event.21.b:0 "Mobilize! Conflict is inevitable!"

 AUR_event.22.t:0 "The Channel Massacre"
 AUR_event.22.d:0 "Although the Imperial Regency is as secretive as can be, often being decried as the ‘Herzlands Darkspot’, the discovery of hundreds of thousands of drowned Roqualians all throughout the shores of northeast Solakea has brought into light the mass-drowning of over a million Roqualians by Regency naval forces following their victory in the Great Southern Wars.\n\nThe event has resulted in near-unanimous international condemnation of the Regency, whose government has only commented that ‘His Excellency did not care for the haggling of Unterflusionians’ before again closing all diplomatic channels." 
 AUR_event.22.a:0 "Horrendous."
 AUR_event.22.b:0 "As it should be."
 AUR_event.22.b.tt:0 "This is the final straw - given our economy is closed already, the §Rentire world§! has embargoed us."

 AUR_event.23.t:0 "A Lovely Night In Clermeowth"
 AUR_event.23.d:0 "Xenon and Muno glowed dimly in the night sky as Mewry and Gustav rushed silently through the deserted streets of Clermeowth. Ever since the Herald’s forces had seized the city, a strict curfew had been imposed everywhere. There were no exceptions whatsoever - anyone found outside would be shot on sight.\n\nUnlike the curfews mandated by the previous Nordherzlander governments and the late Katzenartig Imperium however, this wasn’t just about forcing people to stay in their homes for stability’s sake. Rather, it was to keep them inside the dozens of makeshift ‘Imperial Factories’ which had been established by the Herald’s in any semi-large building they could find.\n\nThe Nordherzlanders had sinned by abandoning the Kaiser’s blessed order, and now they had to repay their debts by working immense shifts, the Herald had claimed in the few radio and media channels that remained unjammed.\n\nMewry and Gustav weren’t too worried about their escape. Even before the Collapse, as soon as Kattail’s order started to unravel, the whole of the Nordherzlands had fallen to corruption - you could get out of anything, curfews included, if you knew the right kats and had the right amount of Katzmarks in your pockets.\n\nAs they went round a corner the two faced a police officer - one that they knew personally, and one used to receiving sort of briberies. The officer looked more nervous than usual as he received the bribe. A red light began to flash on a collar around the officer’s neck. The two kats didn’t even have time to question it before it all went dark as a Katzenluger bullet went through both of their skulls.\n\nThe light was still flashing, if a bit slower. The officer hurried to deposit the cash in one of the Imperial Factories, receiving absolutely nothing in return save for the cessation of the flashing and a feeling of relief."
 AUR_event.23.a:0 "He did not have corruption."

 AUR_event.24.t:0 "The Price of Knowledge"
 AUR_event.24.d:0 "The Herald’s armored carriage hurried through the devastated streets of Frankfurr. There was no time to lose. His forces reported that the recently-seized Frankfurr Institute was undergoing thorough investigation as to locate useful Kaiser-era technology, and he knew it would only be a matter of time before the Institute’s spineless scientists managed to destroy the data. He wanted to personally feel the data disks in his paws, so that he and only he could have control over their content.\n\nUpon arrival the Herald was greeted with the sight of hundreds of Frankfurrian scientists lined up and surrounded by Regency soldiers. There was one who stood out at the front, though, evidently the Institute’s rector. Seemingly, he had agreed to cooperate. Clasping a small data-disk in his paws, he looks to the approaching Herald.\n\n’That is all?’ the Herald inquired, glaring at the small disk.\n\n’Yes.’ responded the rector. ‘State-of-the-art data storage. Contains all the Kaiser’s secrets.’\n\n’I don’t believe you. Where is the data?’\n\n’Check for yourself, Herald. Inspect the device and you will see it is genuine.’\n\nThe Herald bent to take a closer look at the disk in the Rector’s paw. A light on the disk began to flash rapidly and half a second later the Herald was leaping backwards to avoid the resulting explosion.\n\nAfter remaining composure the Herald looked at the remaining scientists in anger, intending to wrangle the Institute’s secrets out of them personally if needs be. One-by-one, they each went limp and collapsed onto the floor as the Herald approached them with painful intent. Cyanide. The oldest trick in the book to avoid interrogation. Well, it mattered not, the Herald thought, for the Institute itself surely held just as many secrets as its scientists.\n\nHe turned to look at his prize, but alas in those scant few minutes the Herald gave to the scientists, the towering buildings of the Frankfurr Institute had already been replaced by dark clouds billowing above smoldering piles of rubble."
 AUR_event.24.a:0 "Salvage what we can..."

 AUR_event.25.t:0 "Lowly Ambitions"
 AUR_event.25.d:0 "From the Imperium to the Pawris Authority, Kathur had always been a nobody, a lowly clerk approving and stamping minor logistical transfers. He just wasn’t quite sure why. He did the work he needed to do with great diligence, but that never quite seemed to satisfy his superiors. He did not expect this to change with the Regent’s takeover of Pawris, and it almost didn’t, that is until he stumbled upon a most peculiar offer broadcasted by the Regent’s new government.\n\n’Become a Real Meowrine’, the headlines read. Apparently the former ‘Befreier‘ Meowrine Legion of Pawris had been dismantled for ‘treachery of the highest level’ and their power armors were being ‘repurposed for correctional purposes’, with volunteers being recruited to man these armors of war.\n\nMuch to Kathur’s surprise, there were very few volunteers. Apparently the Regent’s government had a ‘bad rep’ and being a Meowrine 'sucked'. His good friend Gunther attempted to discourage him. There is beauty in a simple life far from the troubles of shifting Herzlandish politics, Gunther argued, but Kathur wasn’t about to spend the rest of his life rotting in some makeshift factory just as he had rotted stamping papers for the past two decades. All that was quitter talk, Kathur thought as he signed the enlistment papers.\n\nSoon, he would finally be more than a footnote in Herzlandish bureaucracy."
 AUR_event.25.a:0 "This is gonna be great."

 AUR_event.26.t:0 "Part of the Machine"
 AUR_event.26.d:0 "Three engineers escorted Kathur through a dimly-lit run-down facility somewhere in the outskirts of Pawris. This must be where he’d receive his secret training! After going through countless security checks of varying intensity, the four Katzens arrived in a large room. At the middle of it was a set of damaged Meowrine armor which stood upright thanks to a set of cords and supports. Questions rushed through Kathur’s mind, which he’d have eagerly asked were it not for a sharp stab in the back of his neck before his body went limp and his vision black.\n\nWhen he woke up he found himself strapped to an operating table, completely unable to move or speak, yet fully aware. The next couple of hours would drag on like an eternity as, much to Kathur’s horror and agony, pieces of the Meowrine suit were surgically grafted onto his body without sedation.\n\n’The Katzen species has sinned.’, one of the surgeons said, mid-way through wrapping Kathur’s leg in armor. ‘This pain is atonement. Or so the Herald claims.’\n\nAfter what felt like an eternity, the ordeal was finally done. Kathur painfully stood up, his body completely and awkwardly envelopped in deformed power armor. He tried to speak, but he could not. His vocal cords had been severed. He did not need them anymore. After all, he was no longer Kathur. He was His Excellency’s 573th Armored Policekat, placed under the command of 4th Katzkommissar Mewliott von Katzberg."
 AUR_event.26.a:0 ""

 cg_payment_5:0 "Slight Industrial Payments"
 cg_payment_10:0 "Industrial Payments"
 cg_payment_20:0 "Large Industrial Payments"
 cg_payment_40:0 "Massive Industrial Payments"

 #Decisions
 aur_shoot_the_ipf:0 "Mass arrest of suspected §2IPF§! members"
 aur_shoot_the_ipf_tt:0 "$ipf_strength$ decreases by §Y1§!."
 aur_shoot_the_ipf_desc:0 "We can't take any chances with these $ipf_name$ rats. Thanks to our moles, we'll be able to easily locate their members and promptly arrest them."

 aur_shoot_the_ksk:0 "Brutalize the §RKSK§!"
 aur_shoot_the_ksk_desc:0 "The $ksk_name$ is even worse than their liberalist cousins, and thus our measures shall be proportionally more drastic. Anyone - and we mean §Ranyone§! suspected to have ties with the KSK will be executed and their remains being hung for all to see!"
 aur_shoot_the_ksk_tt:0 "$ksk_strength$ decreases by §Y1§!."

 AUR_industrialization_cat:0 "Die Dreijährige Reimperialisierung"
 AUR_industrialization_cat_desc:0 "The Herald has a vision to turn Auralia into an industrial region not unlike what Kattail did to Purrlin-Lionsburg and the Pouchkinn Plains in the north. While his plans might seem deranged and reckless, it is paramount that we succeed in realizing them if we want to stand a chance against the rest of the Herzlands.\n\n[ROOT.AURGetIndustryGoals]"

 AUR_industry_term_1_goals:0 "§H1st Term of the Dreijährige Reimperialisierung Goals§!\n§H[?AUR.aur_num_new_infra_built]/5§! Infrastructure built\n§H[?AUR.aur_num_new_reactors_built]/2§! Nuclear Power Plants built."
 AUR_industry_term_2_goals:0 "§H2nd Term of the Dreijährige Reimperialisierung Goals§!\n§H[?AUR.aur_num_new_mils_built]/16§! Military Factories built\n§H[?AUR.aur_num_new_civs_built]/10§! Civilian Factories built"
 AUR_industry_term_3_goals:0 "§H3rd Term of the Dreijährige Reimperialisierung Goals§!\n§H[?AUR.aur_num_new_aa_built]/5§! Anti-Air built\n§H[?AUR.aur_num_new_radar_built]/3§! Radar Stations built.\n§H[?AUR.aur_num_new_bunkers_built]/4§! states fortified"

 AUR_aggressive_industrialization:0 "Aggressive Industrialization in [From.GetName]"
 AUR_nuclear_salvation:0 "Erect Nuclear Salvation in [From.GetName]"
 AUR_mass_worker_conscription:0 "Mass Worker Conscription"

 AUR_industry_timer:0 "Dreijährige Deadline"
 AUR_industry_timer_tt:0 "Our economy will §Rcollapse§!."

 AUR_expand_mil_factories:0 "Expand Military Factories in [From.GetName]"
 AUR_civilian_factories:0 "Create 'Civilian' Factories in [From.GetName]"

 AUR_katzen_lifestyle:0 "Enhance Katzen Lifestyles in [From.GetName]"
 AUR_projekt_seer:0 "Enact Projekt Seer in [From.GetName]"
 AUR_plan_for_the_worst:0 "Plan for the Worst in [From.GetName]"

 AUR_dreijahrige_idea:0 "1st Dreijährige Reimperialisierung Term"
 AUR_pushing_idea:0 "2nd Dreijährige Reimperialisierung Term"
 AUR_nearly_there_idea:0 "3rd Dreijährige Reimperialisierung Term"

 AUR_economic_backlash:0 "Economic Backlash"
 AUR_economic_backlash_desc:0 "Three years of brutally forcing the nation to cough up far more than it should've been able to may be called by some to be terribly damaging to the economy. While the issues will subside in due time, it's time for the Herald to be content with his expansion plans."

 AUR_total_economic_collapse:0 "Total Economic Collapse"
 AUR_total_economic_collapse_desc:0 "The Herald's brilliant, perfect plan to turn his nation and Auralia into a highly industrialized empire hasn't just failed. More like falling down a thousand stairwells into a spike pit covered in shame and despair. Eventually it will recover but the Kaiser is disappointed."

 AUR_chew_slowly_cat:0 "Tending to His Vision"
 AUR_chew_slowly_cat_desc:0 "His Excellency was a kind, magnaminous leader who tended to the Katzen species like gardener. His exalted Herald must apply the same care to his subjects if He is to be satisfied when He returns.\n\nThe Herald's $herald_sanity$ is at §Y[?AUR.herald_sanity]§! out of §Y100§!.\n§L[AUR.GetRegentSanityBlurb]§!\n\n$herald_sanity$ will §Gincrease§! if we...\n§YCore§! a state (§G+1§! per)\n§YCapitulate§! a nation (§G+5§! per)\n\n$herald_sanity$ will §Rdecrease§! if we...\n§YLose§! a state (§R-2§! per)\nGet §YNuked§! (§R-0.5§! per impact)\nGet §YWardec'd§! (§R-5§! per)\nIncrease §YConscription§! (§R1§! per % of recruitable pop)"
 herald_sanity:0 "§0Sanity§!"
 change_herald_sanity_tooltip:0 "The Herald's $herald_sanity$ changes by [?herald_sanity_change|+0]."

 AUR_chew_slowly_sanity_100_to_90:0 "They are right to be skeptical. After all, His exalted return is not a given. But, together, and under my guidance, we shall once more reshape the Herzlands into a domain befitting of His splendor."

 AUR_chew_slowly_sanity_90_to_70:0 "They are stubborn. Very, very stubborn. It is difficult for me to keep composure in the face of these uncompliant masses. Why do they not see His vision as I do? Nevertheless, I do what I must, for them and for His Excellency."

 AUR_chew_slowly_sanity_70_to_50:0 "Why? Why do they not comprehend? Can they not see that this is all part of His plan? I suspect Unterflusionian interference. I must remain steady in the face of adversity."

 AUR_chew_slowly_sanity_50_to_20:0 "They do not share my vision for His return. Whatever! They will be made to accept it, no matter how long it takes! No matter what it takes! No matter how much the Unterflusionians and the Unterkatzens conspire against ME!"

 AUR_chew_slowly_sanity_20_to_0:0 "Everywhere I look, everywhere I see, they abound. His Excellency's enemies, they infest and devour His domain's corpses like maggots. And I... I am the exterminator."


 AUR_commissars_cat:0 "Imposing His Vision"
 AUR_commissars_cat_desc:0 "There is no place for dissent in His Excellency's future domain. His exalted Herald and his loyal Katzkommissars will ensure compliance, no matter the cost.\n\nWe currently have §Y[?AUR.AUR_available_commissars]§! §OKatzkommissars§! available and §Y[?AUR.AUR_dispatched_commissars]§! §OKatzkommissars§! dispatched throughout the nation."
 AUR_dispatch_1_katzkommissar:0 "§Y1§! §OKatzkommissar§! will be dispatched for the mission's duration."

 AUR_commissar_show_of_force:0 "Mass-Repression in [From.GetName]"
 AUR_commissar_show_of_force_desc:0 "Dispatch a Katzcommissar to [From.GetName] and its surroundings to mercilessly crush partisan networks."
 AUR_active_commissar:0 "There is already active Katzcommissar in this state."

 lok_state_actions_AUR_repression_button_tooltip:0 "§YEnact Mass-Repression§! - §Y10§! £pol_power£ & §Y1§! §OKatzkommissar§![GetStateActionAURRepressionStatus]\n§LThere is no place for dissent in His Excellency's future domain. His exalted Herald and his loyal Katzkommissars will ensure compliance, no matter the cost.§!\n§Y1§! §OKatzkommissar§! will be dispatched for the mission's duration. We have §Y[?AUR.AUR_available_commissars]§! available.\nIn §Y28§! days, §Y[?THIS.GetName]§! receives:\n    Resistance: §G-20%§!\n    Resistance Target: §G-20%§!\n    Local Population: §R-20000§!\n    Every §Yneighbor state§! receives §Yhalf§! of these effects."
 lok_state_actions_AUR_repression_status:0 "\n§GActive§!, §Y[?state_actions_AUR_repression_weeks_left]§! weeks left"

 AUR_commissar_reward_collaborators:0 "Reward the Worthy in [From.GetName]"
 AUR_commissar_reward_collaborators_desc:0 "The stalwart few who adhere to His Excellency's vision shall be rewarded for standing out amidst the degenerated masses of the Herzlands with promotions and honors befitting of their loyalty. Admittedly these are not necessarily the smartest of Katzens, but this is exactly what the Herald needs."

 AUR_commissar_reward_collaborators_remove_tt:0 "Modify §Y$AUR_the_kaiser_must_return$§! by: \n$MODIFIER_RESEARCH_SPEED_FACTOR$: §R-0.1%§!\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §R-0.1%§!"

 AUR_katown_conquest:0 "Seize the Heart of the Imperium"
 AUR_katown_conquest_tt:0 "The §YHerald§! will be... §Rvery displeased§!."
    
 #Ideas
 AUR_conversion_buff:0 "Emergency Konvertierung"

 AUR_the_kaiser_must_return:0 "The Kaiser Must Return"
 AUR_the_kaiser_must_return_desc:0 "The Herald has convinced (brainwashed) his people to do whatever it takes to bring back the Kaiser and his infinitely knowing will to take over the world. The Kaiser will get a world conquest on his second attempt once He returns."

 AUR_exhausted_dockyards:0 "Dockyards Exhausted"
 AUR_exhausted_dockyards_desc:0 "Hard labor in only a few months of work to produce a relatively titanic amount of ships has left countless dead and more incapable."

 AUR_split_auralia:0 "Split-Auralia"
 AUR_split_auralia_desc:0 "The great megacity of Auralia is home to a massive bay fitted with gargantuan dockyards that forged the titanic navy of the dead Imperium. However, the Federal Republic and their President took Süd-Auralia during the collapse as well as much as its industry. As long as control over Auralia, our great capital, is split then we are open to attack as well as our people to escape."  
 
 AUR_split_auralia_2:0 "Closing the Split-Auralian Wound"
 AUR_split_auralia_2_desc:0 "The great megacity of Auralia is home to a massive bay fitted with gargantuan dockyards that forged the titanic navy of the dead Imperium. However, the Federal Republic and their President took Süd-Auralia during the collapse as well as much as its industry. It's taken so long but we have enough control over our own people that we can start to close the gaping wound of Auralia. Let's cauterize the rest of us while we're at it."  

 AUR_chaos_collapse:0 "Horrific Chaos of the Collapse"
 AUR_chaos_collapse_desc:0 "A great BEAUTIFUL beast was speared in the heart and its corpse so bloated and gargantuan that its fall across Flusion has led a great depression. Auralia was one of its greatest organs so without the blood of resources flowing to it from across Flusion, it is faltering and so the rest of the Regency is as well."

 AUR_mishandled_navy_airforce:0 "Mishandled Navy and Airforce"
 AUR_mishandled_airforce:0 "Mishandled Airforce"
 AUR_mishandled_navy:0 "Mishandled Navy"
 AUR_academy:0 "Die Auralianishes-Seeacademy"

 AUR_every_katzen_a_gun_idea:0 "Every Katzen a Gun"
 AUR_every_katzen_a_gun_idea_desc:0 ""

 AUR_every_gun_a_katzen_idea:0 "Every Gun a Katzen"
 AUR_every_gun_a_katzen_idea_desc:0 ""

 AUR_add_1_commissar_tt:0 "We recruit §Y1§! §OKatzkommissar§!."
 AUR_add_2_commissar_tt:0 "We recruit §Y2§! §OKatzkommissars§!."
 AUR_add_3_commissar_tt:0 "We recruit §Y3§! §OKatzkommissars§!."

 AUR_new_goals:0 "New Goals for Auralian Dockyards"
 AUR_efficient_dockyards:0 "Famed Auralianishes Efficiency"

 #Focuses
 AUR_food_initiative:0 "Universal Greater Food Initiative"
 AUR_food_initiative_desc:0 "As troublesome as it can be, our people do in fact require sustenance. How despicable! It was said that His Excellency never ate a single meal in his entire life, powering itself exclusively with his burning passion for a better world. Nevertheless, ensuring the cohesion of our agricultural network will ensure our people won't have to fight on an empty stomach."

 AUR_gross_bewaff:0 "Grösseres Bewaffnungsprotokoll"
 AUR_gross_bewaff_desc:0 "Anything and anyone that can be used for military production will be used for military production. Nothing will be spared!"

 AUR_emergency_wieder:0 "Emergency Order 'Wiederbewaffnung'"
 AUR_emergency_wieder_desc:0 "The time of war draws ever nearer and thus we need as many military factories as possible, even if it means retooling civilian manufactories."

 AUR_blitz_aus:0 "Blitzschutzbau 'Ausrüstung'"
 AUR_blitz_aus_desc:0 "The people have a lot of things to offer beyond just their bodies, namely tools, vehicles, and materials. We shall thus seize and repurpose all of this wasted personal equipment for the purpose of fulfilling the Herald's vision."
 
 AUR_emergency_konvert:0 "Emergency Order 'Konvertierung'"
 AUR_emergency_konvert_desc:0 "While converting precious military factories into civilian ones might seem foolish, we need every last bit of industrial juice we can if we are to outpace our rivals."
 
 AUR_blitz_ers:0 "Blitzschutzbau 'Erschöpfung'"
 AUR_blitz_ers_desc:0 "We need more industrial capacity if we are to fulfill the Herald's vision and we need it NOW. So what if a few workers die from overworking?"

 AUR_dreijahrige:0 "Dreijährige Reimperialisierung"
 AUR_dreijahrige_desc:0 "In short, a deranged and reckless plan to turn Auralia into an industrial region not unlike what the Kaiser did to the Purrlin-Lionsburg region and the central Nordherzlands. But with far less resources."

 AUR_pushing_pushing:0 "Pushing... Pushing..."
 AUR_pushing_pushing_desc:0 "'Faster faster faster! Every day we aren't ready is another day the unterflusionians are preparing to come to end all Katzens!'"

 AUR_nearly_there:0 "Nearly There..."
 AUR_nearly_there_desc:0 "'I SAID FASTER! BY THE KAISER I WILL TAKE YOUR PAWS IF YOU AREN'T DONE FAST ENOUGH!' "

 AUR_fulfilled:0 "Fulfilled?"
 AUR_fulfilled_desc:0 "Finally, three years of work and it's over. A roaring lion of an industry ready to enact the Kaiser's will. "

 AUR_slaves_for_roads:0 "Slaves for Roads"
 AUR_slaves_for_roads_desc:0 "It is a detestable practice but desperate times call for desperate measures. Of course work will be done to isolate knowledge of the labor camps and only to be filled with non-dangerous individuals."

 AUR_controlled_thought:0 "Establish Controlled-Thought"
 AUR_controlled_thought_desc:0 "It is high time after years of post-collapse conditions we reinvent a more historically accurate education system and go about reminding citizens of the truth."

 AUR_wunderwaffe_buro:0 "Büro des Wunderwaffen"
 AUR_wunderwaffe_buro_desc:0 "Katzenartig Soulbots, Riesigers, railguns... Mondkanone. These are all relevant superweapons we must recreate ourselves."

 AUR_the_wait_for_him:0 "The Wait for Him"
 AUR_the_wait_for_him_desc:0 "The Herald is the best Kaiserist to ever exist. Well, second to Him of course. When His empire collapsed, everyone left Him. But not the Herald. The Kaiser will return if Katzens prove themselves ready for His light."

 AUR_he_did_not_have_dissent:0 "He did did not have Dissent"
 AUR_he_did_not_have_dissent_desc:0 "His Imperium was the grandest thing in all of Flusion yet the ungrateful beings that rose up from inside it caused His masterpiece to fall. I will lay the groundwork to remove dissent myself so that when He returns, he will succeed."

 AUR_crushing_liberalism:0 "Crushing Liberalism"
 AUR_crushing_liberalism_desc:0 "By His Will, a mole has been inserted into the Partisanefront and soon it will multiply like a cancer till the partisans collapse from infighting and suspicion."
 AUR_crushing_liberalism_tt:0 "$ipf_strength$ decreases by §Y1§!.\nUnlocks §Rharsh decisions§! to deal with the §2Interne Partisanefront§!."

 AUR_loot_their_reserves:0 "Loot their Reserves"
 AUR_loot_their_reserves_desc:0 "With the IPF routed from His glorious lands, the warehouses they didn't destroy can be secured and taken over."
 AUR_loot_their_reserves_prereq:0 "$ipf_strength$ is §Y1§! or less."

 AUR_breaking_idealism:0 "Breaking Idealism"
 AUR_breaking_idealism_desc:0 "'I want their spines hanging from every townhouse in the state so dissidents can see what we do to rebels with backbones!'"
 AUR_breaking_idealism_tt:0 "$ksk_strength$ decreases by §Y1§!.\nUnlocks §Rharsh decisions§! to deal with the §RKatzensoldaten der Kernländer§!."

 AUR_shatter_their_spirits:0 "Shatter their Spirits"
 AUR_shatter_their_spirits_desc:0 "'Show them... I must show them all... Never another Collapse... He will return.'"
 AUR_shatter_their_spirits_prereq:0 "$ksk_strength$ is §Y3§! or less."

 AUR_the_kaisers_footsteps:0 "The Kaiser's Footsteps"
 AUR_the_kaisers_footsteps_desc:0 "'He will be proud of me! I know it! The rest of Flusion will look on me in disgust but that's because they didn't know the Kaiser loved them. We are the good paragons of the world bringing about a just global unification.'"

 AUR_building_better_imperium:0 "'Building a New Imperium'"
 AUR_building_better_imperium_desc:0 "By instilling a revanchist and patriotic that reminds the people of the old regime, we can stir energy and loyalty into our peoples."
 AUR_building_better_imperium_tt:0 "Modify §Y$AUR_the_kaiser_must_return$§! by: \n$modifier_production_speed_arms_factory_factor$: §G+5%§!\n$modifier_production_speed_industrial_complex_factor$: §R-5%§!"

 AUR_herzlands_darkspot:0 "The Herzland Darkspot"
 AUR_herzlands_darkspot_desc:0 "It has taken so long but we have enough control over our own people that we can start to close the gaping wound of Auralia. Let's cauterize the rest of us while we're at it."

 AUR_finish_the_blinds:0 "Finish the Blinds"
 AUR_finish_the_blinds_desc:0 "To cauterize, we must create a new organization to keep our borders clean of infiltrators and to keep watch over all of our lands from the shadows."

 AUR_with_some_lights:0 "...with some light"
 AUR_with_some_lights_desc:0 "It would be foolish to avoid allies. The Kaiser had some of His own and the Herald will follow His stride. They can be useful for now."
 AUR_with_some_light:0 "Diplomatic Efforts"

 AUR_appease_felinean_rival:0 "Appease the Felinean Rival"
 AUR_appease_felinean_rival_desc:0 "Let us expand embassies in each others' states and whisper sweet buttered lies on how to carve the Herzlands. Not that the Herald would lie."
 rival_must_exist:0 "A great power needs to have formed in the East or South."
 ussf_must_exist:0 "There must be a common threat in the South."
 AUR_uneasy_compromise:0 "Uneasy Compromise"

 AUR_meolowtof_ribbawtrop:0 "Meolowtof-Ribbawtrop Pakt"
 AUR_meolowtof_ribbawtrop_desc:0 "A master class in diplomacy: an agreement to split the South between both of us to remove the greatest threat to each of our realms. A peace that will not last."
 AUR_meolowtof_ribbawtrop_tooltip:0 "We will send a §Hproposal§! to the dominant eastern power in order to §Rpartition the South§! between us."

 AUR_remake_work_ethic:0 "Remake Work Ethic"
 AUR_remake_work_ethic_desc:0 "The Southerners are greedy and lazy capitalist while the Northerners are barbaric idiots. The Herald thinks he can make a new Centralist culture that adores militant lable. They will have to follow."
 AUR_remake_work_ethic_tt:0 "Modify §Y$AUR_the_kaiser_must_return$§! by: \n$modifier_production_speed_arms_factory_factor$: §G+10%§!\n$modifier_production_speed_industrial_complex_factor$: §G+10%§!\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+10%§!"

 AUR_pursuit_of_hypermilitarism:0 "Pursuit of Hypermilitarism"
 AUR_pursuit_of_hypermilitarism_desc:0 "We don't have the resources to sustain a truly massive army yet but we can start commanding the people to push for it. Our Katzens will love war. "
 AUR_pursuit_of_hypermilitarism_tt:0 "Modify §Y$AUR_the_kaiser_must_return$§! by: \n$MODIFIER_WAR_SUPPORT_WEEKLY$: §G+0.2%§!"

 AUR_mobilize_greater:0 "Mobilize Greater"
 AUR_mobilize_greater_desc:0 "The Katzens not conscripted to the army will be sent to work the forges. Art is not required in the Herald's nation, poetry scrapped, and artifacts burned to fuel furnaces."

 AUR_almost_as_good_as_him:0 "Almost as Good as Him"
 AUR_almost_as_good_as_him_desc:0 "I am not worthy of Him just yet. But soon... soon I shall be."
 AUR_almost_as_good_as_him_tt:0 "Modify §Y$AUR_the_kaiser_must_return$§! by: \nArmy Defense: §G+5%§!\nArmy Attack: §G+5%§!"

 AUR_start_unification:0 "Start Unification"
 AUR_start_unification_desc:0 "We are growing fat with industry and pollution. It is time we exercise ourselves to show we are a true reunification candidate by seizing a spineless province."

 AUR_a_dark_night:0 "A Dark Night"
 AUR_a_dark_night_desc:0 "'I have given the orders as I am the will of the Kaiser! Bring our order to all of Elowia and remake them!'"

 AUR_reopen_auralian_docks:0 "Reopen the Auralian Docks"
 AUR_reopen_auralian_docks_desc:0 "The dockyards of Auralia made countless ships and heavily contributed to even the KST Douclaw. The Collapse stopped all of that but the Kaiser will want his overseas colonies back."

 AUR_a_grand_fleet:0 "A Grand Fleet"
 AUR_a_grand_fleet_desc:0 "And thus the Kaiser spoke to the people 'Build Me a Navy to Conquer all Worlds!' "
 AUR_a_grand_fleet_effect:0 "We will assemble a fleet of §Y10§! §2Frigates§!, §Y10§! §2Submarines§!, §Y5§! §2Destroyers§! and §Y1§! §2Battleship§!."

 AUR_every_katzen_a_gun:0 "Every Katzen a Gun"
 AUR_every_katzen_a_gun_desc:0 "To bring on the tides of millions of troops once again, further technological efforts will be levied towards making a perfect reliable rifle easy to make to utilize en masse. Only some overworking required."

 AUR_every_gun_a_katzen:0 "Every Gun a Katzen!"
 AUR_every_gun_a_katzen_desc:0 "'I NEED MORE KATZENS. PUT THE KITTENS TO WORK, EVERYKATZ FOR THE ARMY!'"

 AUR_last_preparations:0 "Last Preparations"
 AUR_last_preparations_desc:0 "'MY NATION, IT WORKS. THE KAISER'S NATION IS BEAUTIFUL. HAHAHA!'"

 AUR_eyes_on_the_south:0 "Eyes on the Southern Jewel"
 AUR_eyes_on_the_south_desc:0 "The work the Herald has done to remake a Katzen identity so quickly has done well. An entire new group of militias have been formed while we set demands."
 AUR_eyes_on_the_south_tooltip:0 "Create §Y8§! §2Katzen-Garnison§! units across the nation."

 AUR_swallow_the_free_sun:0 "Swallow the Free Sun"
 AUR_swallow_the_free_sun_desc:0 "'The day has come! Today we march on Felinea itself and bring back into the fold His old provinces. May their weak leaders guide well because we will have no mercy!'"

 AUR_faustian_offer:0 "A Faustian Offer"
 AUR_faustian_offer_desc:0 "Glorious Kayzoo!"

 AUR_turn_to_the_nmi:0 "Turn to the Nitromethane Defilers"
 AUR_turn_to_the_nmi_desc:0 "The Nitromethanes are a despicable people, soiling the hallowed ground which the Kaiser had reserved for his most favorite species. And yet... they could of use to us. Let us create a facade of friendliness as to manipulate them for our benefit before their inevitable destruction."
 
 AUR_herzlands_compromise:0 "The Drakwald Compromise"
 AUR_herzlands_compromise_desc:0 "Although ceding rightful Herzlandish soil to non-Katzens foreigners is an affront to the Kaiser's work, we will promise the Nitromethanes all land south of the Drakwald river in exchange for their aid against the southern scum. We'll rectify it in due time anyways."

 AUR_they_wont_blunt_our_advance:0 "They Won't Blunt our Advance"
 AUR_they_wont_blunt_our_advance_desc:0 "'NO! They do not bow. They fight back... from the fields, from the mountains, from the forests... they are trying to STOP US! We cannot stall NOW. They will be made an example of.'"

 AUR_going_for_the_throat:0 "Straight for the Throat"
 AUR_going_for_the_throat_desc:0 "Why waste time trudging through Unterkatzen countryside when we can lunge at their throat? Let the waves carry us to victory! Should the twin hearts of Purrlin-Lionsburg fall, their pathetic coalition will surely crumble."

 AUR_remove_the_blight:0 "Cleanse the Blight"
 AUR_remove_the_blight_desc:0 "'The Roqualians are by far the worst of all the Unterflusionians. Not only does their culture go against all that good Katzens believe, but they are also the main architects of His downfall. And yet, despite their very existence being an affront to Katzenkind, they have been allowed to pullulate throughout the Southern Herzlands by the area's degenerate government! I shall... rectify this...'"
 remove_roqual_state_minority_species:0 "Removes $var_species_3$ minorities from the state."
 AUR_remove_the_blight_bypass:0 "The Regent will not get to §Rsavour§! the taste of §RUnterflusionian cleansing§!."
 AUR_remove_the_blight_effect:0 "We will §Rdestroy§! the $var_species_3$ minorities infesting our Solakatzen coastline."

 AUR_a_quick_detour:0 "A Quick Detour"
 AUR_a_quick_detour_desc:0 "'Kusnurk. Kusnurk is... right there. Right over the strait. It was part of His Empire, just as much as Auralia and Purrlin. I must take it. I can take it. I will take it.'"

 AUR_an_ultimatum:0 "An Ultimatum"
 AUR_an_ultimatum_desc:0 "We have won. And yet - the masses of the twin southern megacities continue with their business as if nothing had changed, bargaining with the Unterflusionians rather than with their brethren. How dare they? Their businesses will face towards the north and Auralia, or they will face the wall. 'AND... THIS GOES FOR EVERYONE ELSE TOO!'"

 AUR_bomb_the_heart:0 "Burn their Hideouts"
 AUR_bomb_the_heart_desc:0 "There is a risk of the Catburgians holing themselves up behind the Meojave desert and the Drakwald jungle, leveraging this harsh terrain to their advantage to grind our forces down.\n\n`UNLESS... UNLESS I DESTROY THEM FROM ABOVE!`"

 AUR_victory_parades:0 "Mandate Victory Parades"
 AUR_victory_parades_desc:0 "His Excellency had a taste for resplendent military parades boasting the might of His armies. With poetry burned and art outlawed, they shall remain the only form of entertainment His subjects shall be allowed to indulge in."

 AUR_looting_their_corpse:0 "Loot Their Corpses"
 AUR_looting_their_corpse_desc:0 "The Southern Unterkatzens may be defeated, but there remains much work to be done. Scouring the ruins of their cities and fallen outposts for equipment will work to pre-empt partisan organisations and bolster His Excellency's war-weary armies."
 AUR_looting_their_corpse_effect:0 "Every §Y[?PRL.GetAdjective]§!, §Y[?CAT.GetAdjective]§! and §Y[?HIM.GetAdjective]§! core state under our control will provide some equipment."

 AUR_i_need_it_all:0 "I- HE NEEDS IT ALL!"
 AUR_i_need_it_all_desc:0 "'MY- HIS ENEMIES, THEY ABOUND! IN THE NORTH, IN THE SOUTH, IN THE EAST, THEY MUST BE CRUSHED. THEY MUST BE LEVELLED. THEY MUST BE FLATTENED - ONLY THEN WILL I BE ABLE TO REBUILD HIS ORDER! I CANNOT WASTE MY TIME WITH RABBLE - I MUST REACH FOR THE HEART!'"
 AUR_killed_roqualians:0 "The Regent §Rgave them hell§!."
 AUR_i_need_it_all_effect:0 "There is §Rno time to wait§!. We will §Rburn§! through the Herzlands, or die trying. We will have §Y3 years§! to seize §YKatown§!."

 AUR_blood_sweat_and_blood:0 "'BEND OR BREAK' Protocols"
 AUR_blood_sweat_and_blood_desc:0 "`BEND OR BREAK`\nThese simple words are all that is needed to describe upcoming compliance protocols applied upon the southern countryside. Anyone found opposing the Herald of His Excellency's will be ground into the dirt, plain and simple, with their families made to pay for their crimes."
 AUR_blood_sweat_and_blood_tt:0 "We will have to invest §Rtremendously§! into suppressing resistance.\nModify §Y$AUR_the_kaiser_must_return$§! by: \n$MODIFIER_RESISTANCE_GROWTH$: §R+50%§!\n$MODIFIER_RESISTANCE_TARGET$: §R+50%§!\n$MODIFIER_COMPLIANCE_GROWTH$: §G+50%§!"

 AUR_military_police:0 "His Boots on the Ground"
 AUR_military_police_desc:0 "Lofty policies, genius leadership and grandiose declarations of intent cannot crush our opposition's spirits on their own. Their will must be made manifest by a well-trained and well-equipped military police force on the ground."

 AUR_katzkommissars:0 "His Eyes in the Sky"
 AUR_katzkommissars_desc:0 "The Herald's vast cohorts of loyal, brainwashed Katzens are little more than helpless masses of bandits if they are not guided. The Herald has thus drafted an ambitious plan to elevate the most fanatic and brilliant minds of his domain to the rank of Katzkommissars: brutal, cunning and reckless military governors devoted entirely to restoring His Excellency's order."
 AUR_katzkommissars_tt:0 "Unlocks §HDecisions§! to recruit §HKatzkomissars§! from conquered lands, which can then be dispatched throughout our nation to crush resistance."

 AUR_smash_the_pretenders:0 "Shatter the Pretenders"
 AUR_smash_the_pretenders_desc:0 "The so-called 'fascist' regime of Clermeowth holds a significant amount of His Excellency's former police force and resistance-suppression experts, who have foolishly rallied behind that pizza-munching rat that is Itch Cheumienbeumien. Switch intervention will 'free' them from this unfortunate choise of theirs."

 AUR_crack_mountains:0 "Rend the Mountains Asunder"
 AUR_crack_mountains_desc:0 "'THEY HIDE BEHIND THE MOUNTAINS.'\n\n'HIS EXCELLENCY SAID HE WOULD TEAR THOSE MOUNTAINS DOWN.'\n\n'AND HIS EXCELLENCY NEVER LIES.'"

 AUR_slaves_for_minerals:0 "Slaves for Minerals"
 AUR_slaves_for_minerals_desc:0 "Slavery, while still as detestable of a practice, provides both a cheap source of labor and a means of keeping the conquered masses in check. The great mountains of Tailsbaden shall be mined for all they are worth by the unworthy. Besides, is it not the greatest possible honor, to be allowed to fuel the reconstruction of His Excellency's domain?"
 AUR_slaves_for_minerals_tt:0 "The §YTailsbaden Borehole§! has its effects doubled!"

 AUR_crush_the_spartans:0 "Dismiss Rogue Legions"
 AUR_crush_the_spartans_desc:0 "The Pawris region is home to a number of Meowrine commanders and their legions, who, bereft of His Excellency, had sworn fealty to Elwin von Kattensbach. There can be no negotiations with these traitors!"

 AUR_meowrine_kill_collars:0 "Reverse-Engineer Meowrine Kill-Collars"
 AUR_meowrine_kill_collars_desc:0 "Meowrines were fitted with a number of advanced devices to ensure their loyalty, including a kill-collar that would detonate if they were to exhibit signs of revolt. While His Excellency's disappearance has created a loophole allowing them to run rampant, this technology is nonetheless of great interest, as if it can be mass-produced, the Herald's detractors will find themselves turned to ash."
 AUR_meowrine_kill_collars_tt:0 "Modify §Y$AUR_the_kaiser_must_return$§! by: \n$MODIFIER_RESISTANCE_GROWTH$: §G-10%§!\n$MODIFIER_RESISTANCE_TARGET$: §G-10%§!\n$MODIFIER_COMPLIANCE_GROWTH$: §R-10%§!"

 AUR_chew_slowly:0 "Chew Slowly"
 AUR_chew_slowly_desc:0 "'We have triumphed over the South, and now find ourselves having to deal with a massive, writhing mass of Unterkatzens. We must take our time to chew through them, lest we choke. His Excellency was a visionary, who understood that sometimes, compromises had to be made for long-term stability.'"
 AUR_did_not_kill_roqualians:0 "The Regent did §Rnot§! indulge in the pleasures of §RUnterflusionian cleansing§!."
 AUR_chew_slowly_tt:0 "The Herald has decreed that we shall §Yproceed slowly§!. We will §Ystabilize§! and §Ybide our time§! until the inevitable reconquest of the §Ynorth§! and the §YImperium's Restoration§!.\n\nThe Herald is however having to show §Rimmense restraint§!, and so we must carefully manage his $herald_sanity$, which starts at §Y50§! out of §Y100§!."

 AUR_put_out_the_fire:0 "Putting Out the Fires"
 AUR_put_out_the_fire_desc:0 "Lionsburg burns! Catburg burns! All throughout the Regency's new southern frontier vast bands of partisans adamantly refuse to see the world as the Herald does. It is tempting to murder every last one of them, but... but that is not how He would have done it, is it? Let us make some concessions for the time being..."

 AUR_imperial_education:0 "An Imperial Curriculum"
 AUR_imperial_education_desc:0 "Our youth are the future of His Excellency's new Imperium. A new curriculum shall thus be established as to teach our kittens all there is to know, and engrain within their minds the inevitability of His return."

 AUR_closing_the_blinds_again:0 "Adjusting the Blinds"
 AUR_closing_the_blinds_again_desc:0 "The vile Roquals now encroach upon His Excellency's blessed Herzlandish soil! They could strike at any time and so we must be ready. Yet - we must not give into insanity lest the Roqual invasion become a self-fulfilling prophecy. Slightly opening up and showing our best to the world will mellow out those who would wish us harm otherwise."

 AUR_army_reform:0 "Review the Katzenarmee"
 AUR_army_reform_desc:0 "His Excellency's Katzenarmee was as perfect as could be, with a rigid system of checks and overseers curbing the worst of excesses as He intended. Our current armies are mere bandits by comparaison! I shall personally review my officers and ensure they match what His Excellency would have wanted."
 AUR_army_reform_tt:0 "The §Ysaner§! the Herald is, the more our generals will lose §YAttack§! and gain §YLogistics§! and §YPlanning§! skills."

 AUR_demobilize_slightly:0 "Sustainable Militarization"
 AUR_demobilize_slightly_desc:0 "It has become evident that His Imperium will not be rebuilt within the next five years, or even the decade. There is no point in burdening our state with crippling hypermilitarization, for it would then collapse before He could return to steer it."

 AUR_a_constitution:0 "The Katzenartig Constitution"
 AUR_a_constitution_desc:0 "Every state needs some sort of guiding codes to structure their laws. Of course these laws should put as much power as possible into the Herald's paws, for he knows best, but these nonetheless need to be written down as to ensure the Herald's great reforms are backed not just by arms but by law."

 AUR_cult_of_his_return:0 "Justify the Cult of the Return"
 AUR_cult_of_his_return_desc:0 "It is a tragedy that the minds of most Katzens refuse to accept what is not empirically proven, but alas, one must make due. The Herald shall assemble the Regency's finest scientists and historians as to produce a thesis demonstrating the inevitability of His return."
 #AUR_cult_of_his_return_tt:0 "The higher the Herald's $herald_sanity$, the better the results."

 AUR_reform_the_high_command:0 "Reform the High Command"
 AUR_reform_the_high_command_desc:0 "His Excellency's takeover of the world was aided by the finest minds the Katzen species had to offer. Fortunately for us, these minds are still very much around and kicking throughout the collapsed Herzlands. They will surely jump at the opportunity to get their old jobs back, and His Excellency will be most pleased to find his allies waiting for him."
 AUR_reform_the_high_command_tt:0 "Unlocks §YDecisions§! to recruit members of the §YKatzen High Command§! from defeated nations."

 AUR_manifest_of_his_will:0 "His Will Made Manifest"
 AUR_manifest_of_his_will_desc:0 "With a rigid state apparatus in place and a growing share of our subjects now accepting the inevitability of His return, the Herald can rightfully claim to represent His will in-interim. This will make governance quite a bit easier."

 AUR_biding_our_time:0 "Buying Time"
 AUR_biding_our_time_desc:0 "We cannot afford to call ourselves a short-lived Regency anymore. It is evident that there is far more work to be done than the Herald originally anticipated, with His return being likely later rather than sooner. For stability's sake and as to reassure the rest of the Herzlands of our sanity, we shall rebrand into a transitional Imperium, laying the groundwork for the upcoming decades of arduous preparation."

 AUR_SOUTHERN_KTZ_fascism:0 "Southern Transitional Imperium"
 AUR_SOUTHERN_KTZ_fascism_def:0 "the Southern Transitional Imperium"
 AUR_KATOWN_fascism:0 "Katzenartig Zentralverwaltung"
 AUR_KATOWN_fascism_def:0 "the Katzenartig Zentralverwaltung"
 AUR_SOUTH_HERZ_REGION:0 "Autonomkatzregion Südherzlands"
 AUR_SOUTH_HERZ_REGION_DEF:0 "the Autonomkatzregion Bayarn-Winston"

 AUR_EAST_HERZ_REGION:0 "Autonomkatzregion Ostherzlands"
 AUR_EAST_HERZ_REGION_DEF:0 "the Autonomkatzregion Ostherzlands"

 AUR_NORTHEAST_HERZ_REGION:0 "Autonomkatzregion Purrßsen"
 AUR_NORTHEAST_HERZ_REGION_DEF:0 "the Autonomkatzregion Purrßsen"

 AUR_CENTRAL_HERZ_REGION:0 "Autonomkatzregion Auralien-Clermeowth"
 AUR_CENTRAL_HERZ_REGION_DEF:0 "the Autonomkatzregion Auralien-Clermeowth"

 AUR_eastern_campaigns:0 "Consolidating the South"

 AUR_consolidate_the_east:0 "Stamp Out the East"
 AUR_through_the_zuspri:0 "Ultimatum to the Frontier"
 AUR_through_the_center:0 "Reintegrate the Center"

 AUR_southern_theater:0 "The Southern Theater"

 AUR_northern_theater:0 "Look to the North"
 AUR_finding_allies:0 "Finding Worthy Allies"
 AUR_a_subtle_takeover:0 "Subtle Consolidation of the North"
 AUR_promises_kept:0 "Promises Kept"

 AUR_foreign_theater:0 "Beyond Felinea"
 AUR_aid_solakean_kaiserists:0 "Aid to Solakean Kaiserists"
 AUR_aid_amphibian_kaiserists:0 "Aid to Amphibian Kaiserists"
 AUR_placate_the_world:0 "Placating the World"

 AUR_restructure_the_imperium:0 "Becoming the Heart"

 AUR_re_establish_the_katzregion:0 "Reinstate the Katzregion"
 AUR_re_establish_the_katzregion_desc:0 "His Excellency's Imperium featured a number of perfectly-delineated regions, each given a task to fulfill within the greater collective. If the Herald's Imperium is to be worthy of His Excellency's return, then this organization must be brought back post-haste."
 
 AUR_re_mint_the_katzmark:0 "His Excellency's Central Bank"
 AUR_re_mint_the_katzmark_desc:0 "With our industry fully functional, and the vast southern megalopolis under our control, we can now leverage southern banking services to properly re-establish a central bank which will, in term, hopefully control the currency of the entire Herzlands."

 AUR_look_to_his_domain:0 "Look to the Heart of His Domain"
 AUR_look_to_his_domain_desc:0 "'Auralia has been made GREAT. But it is not there that He orchestrated His splendid conquest of the world. The rest of the Herzlands is little but rabble in the face of Katown's splendor - if I- we can seize it, then the rest will be easy pickings.'"

 AUR_incorporate_itch_police:0 "Salvage His Excellency's Police Force"
 AUR_incorporate_itch_police_desc:0 "With the Clermeowth regime crushed beneath our boots, the Herald has seen fit to pick up the remnants of His Excellency's police personel and infrastructure as to incorporate them into his own."
 AUR_incorporate_itch_police_tt:0 "Modify §Y$AUR_the_kaiser_must_return$§! by: \n$MODIFIER_RESISTANCE_GROWTH$: §G-10%§!\n$MODIFIER_RESISTANCE_TARGET$: §G-10%§!"

 AUR_meowrine_power_armor:0 "Retool Salvaged Power Armor"
 AUR_meowrine_power_armor_desc:0 "Clashes with forces in Pawris have revealed a number of unfinished power armor prototypes of little military valu-\n\n`THEY SHALL BE MADE INTO THE CLAWS WITH WHICH HE SHALL REAP RICHES FROM THE SOIL!'"

 AUR_military_schools:0 "Pure Military Education"
 AUR_military_schools_desc:0 "Let us be clear - the current generation of kittens is unlikely to reap the rewards that come with restoring His Excellency's Imperium. As such, they have no need to be taught about more complex subjects such as science or law. They must simply know how to fight."
 AUR_military_schools_tt:0 "Modify §Y$AUR_the_kaiser_must_return$§! by: \n$MODIFIER_RESEARCH_SPEED_FACTOR$: §R-15%§!\nArmy Attack: §G+10%§!\n$MODIFIER_ARMY_ORG_FACTOR$: §G+10%§!"
 AUR_supreme_authority:0 "His Excellency's Supreme Authority"
 AUR_supreme_authority_desc:0 ""
 AUR_supreme_authority_tt:0 "Modify §Y$AUR_the_kaiser_must_return$§! by: \n$MODIFIER_WEEKLY_MANPOWER$: §R-1000§!\n$MODIFIER_POLITICAL_POWER_GAIN$: §G+0.50§!"

 AUR_the_path_to_katown:0 "Reaching for the Heart"
 AUR_the_path_to_katown_desc:0 "`I CAN FEEL IT.`\n`HIS DOMAIN'S STILL-BEATING HEART.`\n`WITHIN REACH...`"
 AUR_the_path_to_katown_tt:0 "We will §Rdeclare war§! on all nations around Katown!"
 
 AUR_over_the_meoder:0 "Boiling the Meoder"
 AUR_over_the_meoder_desc:0 "The great Meoder River floods from Katown onto the Highest Sea, providing the perfect defence for His Excellency's detractors. It too, shall be-\n`BOILED. IT SHALL BE BOILED, WITH ALL THE NORTHERN TRAITORS INSIDE! THAT WILL... SHOW THEM...`"
 AUR_over_the_meoder_tt:0 "§YTroops§! on the §Yother side§! of the §YMeoder River§! will be §Ydamaged§! by the ensuing radioactive waves."
 nuke_state_fission_tt:0 "Deploys a §8Fission Warhead§! in the state."

 AUR_airdrop_cannon_fodder:0 "Fodder Over Yonder"
 AUR_airdrop_cannon_fodder_desc:0 "`PRISONERS. SLAVES. GIVE THEM THE KILL-COLLARS. AND THROW THEM OVER THERE. LET THEM SOW CHAOS. IF THEY LIVE, THEY ARE FREE.`\n\n`THEY WON'T LIVE.`"

 AUR_katown_dash: "Warplan Fall des Herzens"
 katown_dash_desc: " "

 AUR_neu_seetruppen:0 "Establish the Neu-Katzenseetruppen"

 AUR_reintroduce_naval_academy:0 "Reintroduce the Auralian Naval Academy"
 AUR_reintroduce_naval_academy_desc:0 "One of the most prestigious spots for new Katzeetruppen officers to come from was from the same city that centralized the lands of the Herald. After the Collapse, its honor was defiled and looted to serve as resources for the new regime. Now that the lands have stabilized, it is time to restore a new admiralty."

 AUR_secondary_dockyards:0 "Create Secondary Dockyards"
 AUR_secondary_dockyards_desc:0 "'They’re spying on us! The South! Gods-cursed Kibbles is using the COWARD UNTERKATZEN REFUGEES leaving m- the Kaiser’s Greatest State to discover our secrets. We can NOT let them learn about our fantastic naval rearmament.' - The Herald speaking to advisors"

 AUR_storm_the_pyramid:0 "Storm the Pyramid"
 AUR_storm_the_pyramid_desc:0 "`THE FOOL DOUCLAW! HE PUSHES BACK AGAINST HIS EXCELLENCY'S NEW DOMAIN? HE GIVES ME NO CHOICE. HIS HIDEOUT WILL BE CRACKED, AND RETURNED TO ITS RIGHTFUL OWNER!`"

 AUR_clamp_down_on_the_north:0 "Wrangle the Heart"
 AUR_clamp_down_on_the_north_desc:0 "Several high-ranking Elwinian officials have offered to join up with the Herald to aim the transfer of power. They will be of use.\n\n`THE HEART! THE HEART OF HIS DOMAIN IS MINE! IT FIGHTS BACK? NO! IT CANNOT. IT WILL NOT.`"

 AUR_the_second_dreijahrige:0 "A Second Dreijährige"
 AUR_the_second_dreijahrige_desc:0 "The gaping hemorragia brought upon by the Herald's conquest all throughout our logistical infrastructure must be repaired, if not prevented altogether in the future.\n`THE NORTH! ITS FACTORIES LAY IN RUIN, BUT I NEED THEM TO REBUILD HIS DOMAIN. REBUILD THEM! REBUILD THEM ALL YESTERDAY! FUNNEL ALL THE UNDESIRABLES AND ALL THE SLAVES!`"

 AUR_mass_conversion:0 "Towards the Kiloforge"
 AUR_mass_conversion_desc:0 "His Ambitions call for an unending flow of panzers and bombers. Less important parts of our economy will have to go.\n\n`SOON HIS DOMAIN SHALL BE WROUGHT ENTIRELY OUT OF METAL AND METTLE! AND THEN THEY SHALL BEND.`"
 AUR_mass_conversion_tt:0 "Every state with at least §G1§! §HCivilian Factory§! has one §HCivilian Factory§! replaced with a §HMilitary Factory§!."

 AUR_the_greatest_army:0 "The 'Katzenarmee' Reborn"
 AUR_the_greatest_army_desc:0 "`NO MORE RETIREMENT. NO MORE EXEMPTIONS. EVERYONE WILL SERVE. NO EXCEPTIONS.`"

 AUR_unto_the_breach:0 "Unto the Breach"
 AUR_unto_the_breach_desc:0 "`THE HEART IS RECLAIMED, BUT HIS DOMAIN IS STILL NOT READY, FOR IT YET MISSES THE EAST! I- HE CANNOT BE HAPPY OF SUCH AN INCOMPLETE DOMAIN. THE RABBLE ENDS NOW.`"
 AUR_unto_the_breach_tt:0 "We will declare §Rwar§! on §Revery remaining Herzlandish state§!."

 AUR_reap_knowledge:0 "Reap the Knowledge"
 AUR_reap_knowledge_desc:0 "'A THOUSAND YEARS' WORTH OF RESEARCH BORNE OUT OF HIS GRANDIOSE MIND LAY ROTTING IN FRANKFURR, UNTERKATZENS AND UNTERFLUSIONIANS DOING NOTHING BUT ENDLESSLY PROBE AT WHAT THEY CANNOT UNDERSTAND. MINE! IT WILL ALL BE MINE!'"
 AUR_remove_monke:0 "Erase All Blight"
 AUR_remove_monke_desc:0 "'THE MORE I EXPAND THE MORE BLIGHT THERE IS. I HAVE NO NEED TO RESTRAIN MYSELF ANYMORE. HIS EXCELLENCY'S DOMAIN SHALL BE MADE PURE!'"
 AUR_remove_monke_tt:0 "Unlocks §Hdecisions§! to cleanse §Rnon-Katzen minorities§! from our states."

 remove_macaquian_state_minority_species:0 "Removes $var_species_9$ minorities from the state."

 remove_zuspri_state_minority_species:0 "Removes $var_species_4$ minorities from the state."

 AUR_hell_for_commies:0 "Raze Meownich"
 AUR_hell_for_commies_desc:0 "'MEOWNICH! THE BIRTHPLACE OF HERZLANDISH COMMUNISM... NO MORE! ERASED! IT NEVER HAPPENED!'"

 AUR_elevate_the_monument:0 "Elevate the Monument"
 AUR_elevate_the_monument_desc:0 "'THE PEOPLE OF ELIOTTOWN HAVE THE RIGHT IDEA. BUT THEY DID NOT GO FAR ENOUGH! I SHALL COMMISSION EFFIGIES OF MYSELF PERSONALLY TEARING UNTERFLUSIONIANS APART, TO ADD TO THE MONUMENT...'"
 AUR_elevate_the_monument_tt:0 "The effects of the §H$var_wonder.14$§! are §Gdoubled§!."
 AUR_the_new_superhighway:0 "Superhighway Funds"
 AUR_the_new_superhighway_desc:0 "'FASTER! FASTER! OUR ENEMIES CANNOT BE ALLOWED TO BREATHE, WE MUST OUTRUN THEM! LET HIS WILL GUIDE A THOUSAND CONCRETE TENTACLES AS THEY WRAP AROUND THE HERZLANDS!'"
 AUR_the_new_superhighway_tt:0 "The effects of the §H$var_wonder.10$§! are §Gdoubled§!."

 AUR_fuel_the_bombs:0 "Fuel His Might"
 AUR_fuel_the_bombs_desc:0 "'HIS MIGHT, HIS VISION CALLS FOR A THOUSAND THOUSAND SUNS DROPPED UPON THOSE WHO WRONGED HIM! LET THE BLOOD OF THE EARTH FUEL THE FURY OF THE STARS!'"
 AUR_obliterate_the_encroachers:0 "Push Back the Encroachers"
 AUR_obliterate_the_encroachers_desc:0 "'ALREADY HIS SUBJECTS GROW COMPLACENT. ALREADY HIS ENEMIES REGROUP AND ENCROACH. NO!!! ONLY PERPETUAL CONFLICT CAN SHARPEN HIS SUBJECTS INTO A BILLION SWORDS TO KILL A BILLION UNTERFLUSIONIANS!'"
 AUR_his_domain_is_ready:0 "His Domain is Ready"
 AUR_his_domain_is_ready_desc:0 "'HIS DEFILERS. CLEANSED.\n'HIS DOUBTERS. GONE.'\n'HIS ENCROACHERS. PUSHED BACK.'\n'ALL IS READY. NOW, NOW I MUST WAIT, AND SPREAD HIS WILL FURTHER AND FURTHER, UNTIL HIS BLESSED RETURN!'"
 AUR_his_domain_is_ready_prereq:0 "There are §Rno other§! Herzland Warlords left."

 AUR_repair_effort:0 "The Second Dreijährige"

 AUR_clease_unterkatzens:0 "Cleanse [From.GetName] Unterflusionians"
 AUR_clease_unterkatzens_tt:0 "Removes all non-Katzen minorities from the state."

 AUR_clease_unterkatzens_remove_tt:0 "Modify §Y$AUR_the_kaiser_must_return$§! by: \n$MODIFIER_RESEARCH_SPEED_FACTOR$: §R-1%§!\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §R-1%§!"

 AUR_his_domain_is_ready_no_unterflusionians:0 "The Herzlands have been §Rcleansed§! of all §RUnterflusionians§!."
 
 AUR_cooperate_with_old:0 "Cooperate with the Old"
 AUR_cooperate_with_old_desc:0 "In the north of the Feline Sea there lies most of His Excellency's old admiralty and fleet, or at least what remains of it, in miraculously intact conditions. Surely they would be more than willing to offer their expertise to aid in restoring His fleet."
 AUR_propose_doctrine_changes:0 "Propose Core Doctrinal Changes"
 AUR_propose_doctrine_changes_desc:0 "War changes in the seas just as it does on land. His Excellency's methods were brilliant in every regard but times have changed and so we must take on the burden of adapting these methods to the modern age."
 AUR_annihilate_corruption:0 "Annihiliate Marine Industry Corruption"
 AUR_annihilate_corruption_desc:0 "As the Imperium unraveling so did the integrity of the myriad of contractors and subcontractors who once worked to bring His vision into reality. Let us... rectify these divergences."
 AUR_new_goalposts:0 "New Goals for Auralian Shipyards"
 AUR_new_goalposts_desc:0 "Bereft of the great shipyards of the Feline Sea, we cannot be content with a flood of small vessels. Auralia's great yards must be retooled to be able to produce vessels to match the armadas of the world."
 AUR_famed_efficiency:0 "Famed Auralianisches Efficiency"
 AUR_famed_efficiency_desc:0 "His Excellency had a vision for Auralia and so shall we follow in His footsteps. The Great Auralian Shipyards produced a dozen thousand ships in the past and so it shall once more."
 AUR_reinvigorate_studies:0 "Reinvigorate Naval Studies"
 AUR_reinvigorate_studies_desc:0 "The Katzen species is not fond of water and so His Excellency never invested that much into naval studies, instead bearing the immense burden of Himself providing the data his naval forces needed to succeed. Now that He is gone however we must take up his mantle and create a new generation of bright seafarers to uphold His vision."
 AUR_a_constitution_tt:0 "Modify §Y$AUR_the_kaiser_must_return$§! by: \n$MODIFIER_POLITICAL_POWER_COST$: §R+0.15§!\n$MODIFIER_STABILITY_WEEKLY$: §G+0.1%§!\n$MODIFIER_COMPLIANCE_GROWTH$: §G+5%§!"
 AUR_imperial_education_tt:0 "Modify §Y$AUR_the_kaiser_must_return$§! by: \n$MODIFIER_COMMAND_POWER_GAIN_MULT$: §G+10%§!\n$MODIFIER_WAR_SUPPORT_WEEKLY$: §G+0.1%§!\n$MODIFIER_SURRENDER_LIMIT$: §G+5%§!\n$MODIFIER_CONSCRIPTION_FACTOR$: §R-10%§!"
 AUR_cult_of_his_return_tt:0 "Modify §Y$AUR_the_kaiser_must_return$§! by: \n$fascism_drift$: §G+5%§!\n$MODIFIER_DRIFT_DEFENCE_FACTOR$: §G+25%§!\nParty Popularity Stability Factor: §G+10%§!"
 AUR_manifest_of_his_will_tt:0 "Modify §Y$AUR_the_kaiser_must_return$§! by: \n$political_advisor_cost_factor$: §G-25%§!\n$economy_cost_factor$: §G-25%§!\n$trade_laws_cost_factor$: §G-25%§!\n$mobilization_laws_cost_factor$: §G-25%§!\n$high_command_cost_factor$: §G-25%§!"

 AUR_event.27.t:0 "Remain Loyal"
 AUR_event.27.d:0 "‘REMAIN LOYAL - HIS EXCELLENCY WILL RETURN’, read the poster on the wall across from Kayden. His father had put it in his room without asking two days ago, just like in every other room of their small house in the outskirts of Catburg. Kayden hated it. It was ridiculous, quasi-religious, baseless worship to him.\n\n’Vater, do we really need those posters hung everywhere?’, he asked that evening during lunch, twirling his spoon around a bowl of tasteless kibbles alongside his father and mother. They weren’t always this bland, it all started with this damn Herald cutting down on ‘unterkatzen excess’ and such.\n\n’-and that is... son. Son, are you even listening?’\n\n’Uh. Sorry. Zoned out again,’ Kayden replied, his father’s voice jolting him back to reality.\n\n’Now, as I was saying. Your mother and I have had to... work...  extremely hard to keep our house. It was to be turned into a factory block, you know? Sacrifices had to be made to show the Herald we were worthy servitors of His Excellency,’ Kayden’s father droned on.\n\n’But this is asinine, Vater. The Kaiser isn’t returning. Why would anyone want him to return anyways?’ he replied, overwhelmed with a deep feeling of being surrounded by sheer stupidy. Why wasn’t anyone shooting the Herald for being such a crazy lunatic? How was any of this even allowed? Kayden was confident that all these insane Katzens needed was a reminder of what reality and logic were, and all would be well. Hell, he bet that if he was in front of the Herald, he could convince him of how silly he was! There was nothing to worry about.\n\n‘Son. Please. Be reasonable. Trust the Herald. He only wants what is best for us,‘ his father responded, anxiously checking a small device every few seconds, ‘You have been speaking quite loudly and complaining a lot lately. This is not right for you.’\n\nIt changed nothing. Kayden continued to loudly argue for half an hour. This wasn’t good. There was a Katzkommissar visit in two days. They had lost everything in the Collapse and were already hanging on a knife’s edge. His father typed something on his device.\n\nThe next day, he dined in quiet consternation, alone with his wife."
 AUR_event.27.a:0 "What’s eighteen more years?"

 AUR_event.28.t:0 "To Justify His Return"
 AUR_event.28.d:0 "The Herald sat at his desk in a small-scale replica of the Pyramid in Auralia, claspIing his head in his paws. For the past five days he had been attempting to rationalize His Excellency’s inevitable return to the masses before him.\n\nIt was an unbearable ordeal. After all, to him, the inevitability of His return was a fact as obvious as the color of the sky. But to these darn Herzlanders and their obsessively rationalist mindset, it was baseless insanity - the Kaiser had died in the Collapse, and that was that. How could they think such a thing? It mattered not. It was oh-so-tempting to mandate belief in His return at gunpoint, but that was not what He would want, now is it? What pitiful domain it would bequeath to His Excellency!\n\nA few more hours of fervent typing and re-reading through page after page of digital notes, the Herald figured he had at last garnered sufficient talking points, some even backed by various experts in science and sociology.\n\nHis first, and most grounded argument was His Excellency’s complete and utter disappearance. He left behind no body, no clothing, no signs, nothing at all, to the point that even nearly a decade of searching for clues by numerous experts and spy agencies throughout the planet failed to yield anything on the matter. This, by all means, should be impossible, and clearly implies some supernatural ability to cloak oneself or even to depart to another plane of existence altogether.\n\nThis leads right onto the second point, that of His Excellency’s otherworldly nature. There was clearly something special, unique, unheard of about His Excellency, as evidenced not only by his impossible disappearance but also by his immense knowledge in all fields from politics to science and military theory. But, there is more. As to bring this theory from the realm of quakery into the realm of plausibility, the Herald has, alongside renowned historians and political experts, undertaken a thorough examination of numerous supposed high-ranking Katzen scientists credited for many of the Imperium’s breakthrough, and found most of these to be completely fictitious! Evidently, His Excellency had, in his humility, made up these scientists as to downplay his own immense intellect and wisdom. What a wise and splendid leader He was.\n\nNow the Herald had two competing theories as to the actual reason for His disappearance and eventual return. The first is that He had been scared or disappointed by the Katzen species, and was now waiting for the conditions to be right again in order to reappear. The second, the Herald’s favorite, was that this was all a test as part of His plan. He surely wanted to see how resilient the Katzen species truly was and how well they could stand on their own, as to see if they were worthy of His eternal guidance.\n\nBut there was only one interpretation he could insist on lest a schism took hold in the minds of his subjects, and so he had to chose carefully..."
 AUR_event.28.a:0 "He is simply disappointed, and awaits better times."
 AUR_event.28.a.tooltip:0 "Modify §Y$AUR_the_kaiser_must_return$§! by: \n$MODIFIER_STABILITY_FACTOR$: §G+5%§!\n$MODIFIER_WAR_SUPPORT_FACTOR$: §R-5%§!"
 AUR_event.28.b:0 "This is all part of His grand plan!"
