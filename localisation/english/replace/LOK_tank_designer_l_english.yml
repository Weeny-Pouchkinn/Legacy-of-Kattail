 # Component descriptions deliberately explain function and design intent;
 # the designer's generated stat tooltip supplies the numerical effects.
 tank_riveted_armor_desc: "A rugged ballistic-steel hull assembled from replaceable structural plates."
 tank_cast_armor_desc: "Large monolithic composite sections shaped to eliminate weak joints and distribute impacts."
 tank_welded_armor_desc: "A modular composite protection scheme built around welded structural cells."
 tank_bogie_suspension_desc: "A simple passive running gear suited to economical and easily serviced vehicles."
 tank_christie_suspension_desc: "A hydropneumatic system that adapts ride height and damping to terrain and speed."
 tank_interleaved_suspension_desc: "Compact in-arm suspension units with limited active control and good load distribution."
 tank_torsion_bar_suspension_desc: "Reinforced torsion bars provide a durable foundation for heavy armored vehicles."
 tank_half_track_suspension_desc: "A continuous band-track drivetrain intended to combine road mobility with off-road traction."
 tank_wheeled_suspension_desc: "An eight-wheel drivetrain optimized for strategic mobility and straightforward maintenance."
 tank_heavy_machine_gun_desc: "A heavy machine gun for suppressing infantry, light vehicles, and exposed systems."
 tank_auto_cannon_desc: "A compact chain gun suited to engaging infantry and lightly armored targets."
 tank_auto_cannon_2_desc: "A dual-feed autocannon able to switch rapidly between target-specific ammunition."
 tank_small_cannon_desc: "A compact dual-purpose cannon for light armor and low-altitude threats."
 tank_small_cannon_2_desc: "A larger programmable cannon using selectable fuzing for varied battlefield targets."
 tank_close_support_gun_desc: "An airburst-capable cannon intended to defeat infantry behind cover."
 tank_anti_air_cannon_desc: "An automatically laid cannon directed by electro-optical sights."
 tank_anti_air_cannon_2_desc: "A short-range air-defense cannon using programmable ammunition and modern tracking."
 tank_anti_air_cannon_3_desc: "A networked cannon system optimized for drones, loitering munitions, and aircraft."
 tank_medium_cannon_desc: "A low-recoil tank gun suitable for a broad range of armored vehicles."
 tank_medium_cannon_2_desc: "A smoothbore main gun built around modern kinetic and multipurpose ammunition."
 tank_heavy_cannon_desc: "A full-power main gun intended for well-protected breakthrough vehicles."
 tank_heavy_cannon_2_desc: "A large-caliber gun-launcher able to employ conventional rounds and guided munitions."
 tank_heavy_cannon_3_desc: "An enlarged gun-launcher intended to defeat fortifications and the heaviest armor."
 tank_super_heavy_cannon_desc: "An electrothermal-chemical gun adapted to exceptionally large armored platforms."
 tank_high_velocity_cannon_desc: "A high-pressure kinetic-energy gun specialized for defeating armored targets."
 tank_high_velocity_cannon_2_desc: "A long-barrel smoothbore firing advanced fin-stabilized penetrators."
 tank_high_velocity_cannon_3_desc: "A high-pressure tank gun optimized for long-rod kinetic penetrators."
 tank_medium_howitzer_desc: "An automated gun-mortar for responsive direct and indirect fire support."
 tank_medium_howitzer_2_desc: "A large assault howitzer intended to demolish fieldworks and fortified positions."
 tank_heavy_howitzer_desc: "A heavy automated howitzer for the largest conventional armored chassis."
 tank_rocket_launcher_desc: "A compact pod for guided and unguided battlefield rockets."
 tank_rocket_launcher_2_desc: "An improved precision rocket system with modern fire-control integration."
 flamethrower_desc: "A projector for thermobaric agents used against trenches, buildings, and bunkers."
 advanced_flamethrower_desc: "A programmable breaching weapon designed for controlled effects against hardened positions."
 secondary_turret_hmg_desc: "A remotely operated heavy weapon station that preserves crew protection."
 secondary_turret_small_cannon_desc: "An unmanned autocannon station for independent engagement of secondary threats."
 tank_radio_1_desc: "An encrypted tactical radio for secure voice coordination."
 tank_radio_2_desc: "A wideband software-defined radio supporting resilient voice and data links."
 tank_radio_3_desc: "An integrated battle-management network that shares targets and tactical information."
 additional_machine_guns_desc: "Additional remotely operated and coaxial weapons improve all-round close defense."
 extra_ammo_storage_desc: "An enlarged ready rack keeps more ammunition immediately available to the weapon system."
 expanded_fuel_tank_desc: "External auxiliary tanks extend operational reach without redesigning the hull."
 smoke_launchers_desc: "A multispectral obscurant suite masks the vehicle from visual and electronic observation."
 amphibious_drive_desc: "Sealing, flotation aids, and waterjets allow an armored vehicle to cross suitable waterways."
 armor_skirts_desc: "Explosive reactive armor cassettes disrupt incoming shaped-charge jets before they reach the hull."
 auto_loader_desc: "An automated ammunition handler loads the main armament without a dedicated loader."
 dozer_blade_desc: "A combined engineering blade and mine plough clears obstacles and prepares fighting positions."
 easy_maintenance_desc: "Line-replaceable units and a modular powerpack simplify field repair and recovery."
 squeezebore_adaptor_desc: "A specialized tungsten penetrator package improves performance against advanced armor."
 sloped_armor_desc: "A hard-kill active-protection system detects and intercepts incoming anti-armor weapons."
 stabilizer_desc: "Digital fire control and stabilized sights maintain an accurate firing solution while moving."
 wet_ammo_storage_desc: "An isolated ammunition compartment limits the consequences of propellant ignition."

 lc_heavy_naval_guns_desc: "A twin heavy-gun battery adapted from naval mounting practice for a land cruiser."
 lc_super_heavy_railway_gun_desc: "A strategic-caliber cannon integrated into a mobile armored platform."
 lc_high_impact_obliterator_cannon_desc: "A hypervelocity rail weapon intended for the hardest battlefield targets."
 lc_heavy_anti_air_platform_desc: "An integrated laser battery provides layered defense against air and missile threats."
 lc_medium_naval_guns_desc: "An autoloaded medium battery for sustained fire against armored and hardened targets."
 lc_hull_mounted_railway_gun_desc: "A fixed siege cannon built directly into the land cruiser's hull."
 lc_super_heavy_howitzer_desc: "An automated siege howitzer for high-angle fire against fortified positions."
 lc_heavy_high_velocity_cannons_desc: "A heavy anti-armor cannon optimized for direct fire at long range."
 lc_heavy_anti_air_battery_desc: "A missile-and-gun air-defense battery integrated with the vehicle's sensors."
 lc_medium_cannon_turret_desc: "An independently aimed autocannon station for light vehicles and close threats."
 lc_assault_gun_desc: "A direct-fire assault module for structures, strongpoints, and heavy vehicles."
 lc_high_velocity_cannon_turret_desc: "An anti-armor weapon station that supplements the main battery."
 lc_light_anti_air_battery_desc: "A close-in weapon cluster designed to defeat drones and incoming munitions."
 lc_flamethrower_turret_desc: "A protected thermobaric station for clearing defenses at close range."
 lc_rocket_launcher_desc: "Armored launch cells carry precision rockets for rapid battlefield strikes."
 lc_aircraft_catapult_desc: "A fixed-wing unmanned-aircraft launcher extends reconnaissance beyond line of sight."
 lc_helipad_desc: "A deck and support facilities allow vertical-takeoff drones to operate from the vehicle."
 lc_bunker_emplacement_desc: "A hardened internal citadel protects command staff and critical systems."
 lc_internal_ammunition_compartments_desc: "Deep automated magazines feed the main weapons while isolating stored ammunition."
 lc_internal_fuel_tanks_desc: "Protected auxiliary cells extend endurance while limiting exposure of stored fuel."
 lc_stabilizers_desc: "Distributed stabilization keeps the land cruiser's many weapon stations on target."
 lc_wet_ammunition_storage_desc: "Armored magazines isolate propellant and ammunition from occupied compartments."
 lc_armored_skirts_desc: "A modular protection belt shields the running gear and lower hull."
 lc_radar_desc: "A multifunction electronically scanned radar supports surveillance, fire control, and air defense."
 lc_smoke_generators_desc: "Vehicle-wide generators create a persistent multispectral obscurant screen."
 lc_radio_1_desc: "A tactical communications suite coordinates the land cruiser with nearby formations."
 lc_radio_2_desc: "A wideband network suite carries resilient voice, data, and sensor traffic."
 lc_radio_3_desc: "A multi-domain mesh network integrates the vehicle into theater-level command systems."
 lc_command_center_desc: "A protected command center fuses communications, sensors, intelligence, and fire-control data."
