l_english:
 LOK_SP_GRID_FUSION_NAME:0 "Grid-Scale Fusion Complexes"
 LOK_SP_GRID_FUSION_DESC:0 "A power grid built around fusion cannot rely on a laboratory machine. It requires reactor halls, superconducting magnet farms, tritium-breeding loops, hardened switching yards and a control architecture able to balance a captive star against continental demand. This project will turn experimental plasma physics into an industrial energy system."
 LOK_SP_NUCLEAR_RAMJETS_NAME:0 "Nuclear-Powered Ramjets"
 LOK_SP_NUCLEAR_RAMJETS_DESC:0 "Chemical fuel limits aircraft endurance and the power available to their weapons. By using a compact reactor to heat atmospheric working fluid directly, a nuclear ramjet can sustain immense thrust for as long as its structure and crew can endure. The central problem is no longer fuel, but shielding, airflow and surviving the engine we intend to build."
 LOK_SP_EXOTIC_ROTORCRAFT_NAME:0 "Exotic Compound Rotorcraft"
 LOK_SP_EXOTIC_ROTORCRAFT_DESC:0 "Atomic engines make possible a rotorcraft unconstrained by conventional transmission power. Coaxial lift rotors, vectored auxiliary thrust and active flight control can be fused into a fast, heavily armed compound platform able to hover, sprint and carry loads once reserved for fixed-wing transports."
 LOK_SP_ATOMIC_ENGINES_NAME:0 "Atomic Engines"
 LOK_SP_ATOMIC_ENGINES_DESC:0 "Naval reactors have proven that atomic propulsion can be reliable, but they remain too large for general military use. This program will miniaturize shielding, coolant loops and power conversion into standardized engines compact enough for armored vehicles without turning every breakdown into a radiological disaster."
 LOK_SP_NUCLEAR_BACKPACKS_NAME:0 "Nuclear Backpacks"
 LOK_SP_NUCLEAR_BACKPACKS_DESC:0 "Directed-energy infantry weapons and powered armor demand more electricity than batteries can supply. A sealed microreactor carried by one soldier would provide that power, provided its shielding, thermal signature and fail-safe systems can be reduced to something the wearer can survive."
 LOK_SP_AUTONOMOUS_ENGINEERING_VEHICLES_NAME:0 "Remote Engineering Systems"
 LOK_SP_AUTONOMOUS_ENGINEERING_VEHICLES_DESC:0 "Minefields, rubble and fortifications slow an army because clearing them exposes scarce engineers. Remote operators, hardened datalinks and limited machine-assistance algorithms allow uncrewed vehicles to breach obstacles, recover damaged machines, establish communications and patrol dangerous routes while their crews remain beyond the immediate threat."
 LOK_SP_AUTONOMOUS_COMBAT_ASSISTANCE_NAME:0 "Autonomous Combat Assistance"
 LOK_SP_AUTONOMOUS_COMBAT_ASSISTANCE_DESC:0 "Deep-learning control systems can convert remotely operated support vehicles into supervised autonomous partners. The machines will still answer to human commanders, but they will interpret terrain, coordinate routes and execute routine engineering, recovery, security and signal tasks without continuous operator input."
 LOK_SP_HEAVY_ASSAULT_LANDKREUZER_NAME:0 "Heavy Assault Landkreuzer"
 LOK_SP_HEAVY_ASSAULT_LANDKREUZER_DESC:0 "A mobile fortress built to crush prepared defenses through mass, armor and overwhelming firepower. Its scale promises battlefield dominance, but every subsystem-from tracks and suspension to internal communications-must be reinvented simply to move the machine without tearing it apart."
 LOK_SP_FIXED_MASS_DRIVER_NAME:0 "Fixed Long-Range Mass Driver"
 LOK_SP_FIXED_MASS_DRIVER_DESC:0 "A buried accelerator line can trade mobility for barrel length, grid power and range. Sequential electromagnetic stages will hurl hardened projectiles onto targets far beyond the horizon, turning a fortified emplacement into strategic artillery whose ammunition arrives at hypersonic velocity."
 LOK_SP_THERMOBARIC_ASSAULT_VEHICLE_NAME:0 "Thermobaric Assault Vehicle"
 LOK_SP_THERMOBARIC_ASSAULT_VEHICLE_DESC:0 "Entrenched troops can survive ordinary shelling in tunnels, trenches and reinforced rooms. An armored vehicle carrying protected launchers for fuel-air and thermobaric charges can force lethal pressure waves through those spaces while remaining close enough to accompany an assault."
 LOK_SP_AUTONOMOUS_FORTIFICATION_NAME:0 "Autonomous Fortification Network"
 LOK_SP_AUTONOMOUS_FORTIFICATION_DESC:0 "Integrated bunkers, drones, AI turrets, mines, decoys, anti-air batteries and hardened command systems will operate as one defensive organism. Distributed sensors identify a breach, autonomous weapons delay it, and buried command nodes keep the network fighting after its surface positions have been struck."
 LOK_SP_LOW_ORBITAL_HYPERSONIC_NAME:0 "Low-Orbital Hypersonic Aircraft"
 LOK_SP_LOW_ORBITAL_HYPERSONIC_DESC:0 "The next generation of nuclear aircraft must climb above conventional interception, skim the edge of space and cross continents before a defender can react. Thermal protection, reaction control and hypersonic guidance must function as a single airframe through launch, exo-atmospheric cruise and violent re-entry."
 LOK_SP_NAVAL_BALLISTIC_PLATFORMS_NAME:0 "Naval Ballistic Platforms"
 LOK_SP_NAVAL_BALLISTIC_PLATFORMS_DESC:0 "A submerged missile carrier can remain hidden for months and retaliate after bases, airfields and command centers have been destroyed. This project will enlarge the attack-submarine pattern around protected launch tubes, strategic communications and the discipline required to carry a national arsenal beneath the sea."
 LOK_SP_SUPERSCALED_CARRIER_NAME:0 "Super-Scaled Aerial Maritime Platforms"
 LOK_SP_SUPERSCALED_CARRIER_DESC:0 "A carrier enlarged beyond ordinary naval proportions becomes a mobile airbase, logistics hub and command citadel. Its flight operations, power generation and damage-control systems must be designed as infrastructure rather than as mere shipboard equipment."
 LOK_SP_DREADNOUGHT_SHIPS_NAME:0 "Dreadnought Ships"
 LOK_SP_DREADNOUGHT_SHIPS_DESC:0 "Railgun warfare rewards the hull that can feed, cool and survive the largest accelerator. A new dreadnought will wrap immense magazines, reactor capacity and layered protection around a main battery capable of breaking capital ships before they can answer."
 LOK_SP_VACUUM_AIRSHIP_NAME:0 "Vacuum Airship Refurbishment"
 LOK_SP_VACUUM_AIRSHIP_DESC:0 "The fallen armored blimp carriers were built around immense evacuated lift cells, strategic-bomber control systems and naval-scale power machinery. Restoring one is less a repair than an exercise in industrial archaeology: map every surviving pressure member, replace fatigued superstructure and teach modern systems to command a flying fortress from another age."
 LOK_SP_QUANTUM_COMPUTING_NAME:0 "Quantum Computing"
 LOK_SP_QUANTUM_COMPUTING_DESC:0 "Classical machines are approaching the limits imposed by heat, scale and serial logic. Coherent qubits, cryogenic control and fault-tolerant error correction promise a different form of computation—one able to attack optimization, cryptanalysis and physical simulation as structured quantum systems rather than endless lists of conventional instructions."
 LOK_SP_GENETICALLY_PERFECTED_INFANTRY_NAME:0 "Genetically Perfected Infantry"
 LOK_SP_GENETICALLY_PERFECTED_INFANTRY_DESC:0 "Superpowered armor has outgrown ordinary soldiers. To exploit it, this program will combine exacting genetic selection, directed biological enhancement and a lifetime of specialized conditioning to produce Meowrines: supersoldiers capable of carrying reactor-fed armor through terrain that would halt a tank formation."
 LOK_SP_WALKER_PROTOTYPES_NAME:0 "Walker Prototypes"
 LOK_SP_WALKER_PROTOTYPES_DESC:0 "Tracks concentrate an armored vehicle's weight along a simple, reliable running surface; legs must instead balance that mass through exposed joints which are both mechanical and ballistic weakpoints. This program will combine modular hull construction, improved engines and modern armor with full-scale actuator rigs, producing a practical bipedal prototype that can carry a tank turret and survive battlefield recoil."

