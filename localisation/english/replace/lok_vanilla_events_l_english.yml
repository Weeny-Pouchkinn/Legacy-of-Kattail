l_english:
 election.4.t: "Election: Mysticists in Government?"
 election.4.d: "An aggressively nationalist sentiment has grown in [Root.GetName], giving rise to several parties promoting national mysticist ideals: a state enforcing its power through force. One of these in particular has won favor in the current election, leading to discussions within the [Root.GetRulingParty] party about whether or not we should try to cooperate with them in forming our government. While they openly reject the democratic ideals that are the foundation of our state, the fact that they choose to participate in the election itself lends some credibility to our views and acknowledging their public support may keep them away from taking violent action."
 election.4.a: "Rather them than the communists!"
 election.4.b: "A broad coalition of democratic parties is preferable."
 
 election.41.t: "Election: Autocrats in Government?"
 election.41.d: "An aggressively authoritarian sentiment has grown in [Root.GetName], giving rise to several parties promoting autocratic ideals: a state enforcing its power through force. One of these in particular has won favor in the current election, leading to discussions within the [Root.GetRulingParty] party about whether or not we should try to cooperate with them in forming our government. While they openly reject the democratic ideals that are the foundation of our state, the fact that they choose to participate in the election itself lends some credibility to our views and acknowledging their public support may keep them away from taking violent action."
 election.41.a: "Rather them than the communists!"
 election.41.b: "A broad coalition of democratic parties is preferable."
 
 election.42.t: "Election: Authoritarian Democrats in Government?"
 election.42.d: "Authoritarian sentiment has grown in [Root.GetName], giving rise to several parties promoting authoritarian ideals: a state enforcing its power through force. A coalition of these in particular has won favor in the current election, leading to discussions within the [Root.GetRulingParty] party about whether or not we should try to cooperate with them in forming our government. Unlike their more extreme compatriots they still participate in and support the democratic ideals that are the foundation of our state, albeit they dont seem too hesitant to push the limits of what can be called a \"Fair and Free Election\" with their rumoured methods of attracting votes. The fact that they choose to participate in the election itself lends some credibility to our views and acknowledging their public support may keep them away from taking violent action."
 election.42.a: "Atleast they're more moderate than the Autocrats"
 election.42.b: "A broad coalition of democratic parties is preferable."
 
 election.5.t: "Election: Communists in Government?"
 election.5.d: "The communist movement in [Root.GetName], fueled by broad dissatisfaction among the working class and radical trends among academics, has grown large enough to lead to the formation of several parties. After one of these has gained considerable support in the current election, politicians in [Root.GetRulingParty] have started debating whether or not to seek their support in forming a government. Although they consider our democratic institutions to be little more than bourgeois tyranny, they seem eager to make the changes they want to see through cooperating with the government rather than overthrowing it."
 election.5.a: "Rather reform than revolution!"
 election.5.b: "A broad coalition of democratic parties is preferable."
 
 election.51.t: "Election: Socialists in Government?"
 election.51.d: "The socialist movement in [Root.GetName], fueled by broad dissatisfaction among the working class and radical trends among academics, has grown large enough to lead to the formation of several parties. After one of these has gained considerable support in the current election, politicians in [Root.GetRulingParty] have started debating whether or not to seek their support in forming a government. Although they consider our democratic institutions to be little more than bourgeois tyranny, they seem eager to make the changes they want to see through cooperating with the government rather than overthrowing it."
 election.51.a: "Rather reform than revolution!"
 election.51.b: "A broad coalition of democratic parties is preferable."
 
 election.52.t: "Election: The Far Left in Government?"
 election.52.d: "The far left movement in [Root.GetName], fueled by broad dissatisfaction among the working class and radical trends among academics, has grown large enough to lead to the formation of several parties. After a coalition of these has gained considerable support in the current election, politicians in [Root.GetRulingParty] have started debating whether or not to seek their support in forming a government. Although they consider our democratic institutions to be little more than bourgeois tyranny, they seem eager to make the changes they want to see through cooperating with the government rather than overthrowing it."
 election.52.a: "Rather reform than revolution!"
 election.52.b: "A broad coalition of democratic parties is preferable."
 
 election.6.t: "Election: Democratic Parties in Minority"
 election.6.desc: "Politics in [Root.GetName] have grown increasingly radicalized. Where there was once broad support for the parties which supported democratic ideals and [Root.GetName]'s representative institutions, more voters have turned to the political extremes in this election. The parties in the political middle, even if they choose to set aside their differences, no longer form a majority. To avoid a weak minority government, we have no choice but to cooperate with either fascists or communists."
 election.6.a: "We will work with the mysticists to strengthen [Root.GetName]."
 election.6.b: "Inviting the autocrats and their strength to our government will ensure our success"
 election.6.c: "Joining with the communists, we can facilitate social change."
 election.6.d: "Allying the socialists will help calm the masses"
 election.6.e: "The Authoritarian Democrats are the most tame of the bunch"
 election.6.f: "A minority government, although weak, is preferable."
 
 election.7.t: "Mysticists Influence Foreign Policy"
 election.7.d: "Accepting the mysticists into our political coalition has had an impact on our foreign policy. Despite their vehement nationalism, they have sympathizers abroad who approve of the influence they've been given in [Root.GetName]. Totalitarian governments of similar ideological leanings see us as potential allies. Maintaining ties to these nations, no matter the distaste [Root.GetRulingParty] may have for their ideals, may be necessary to retain the support of the fascists backing our government."
 election.7.a: "We can use some allies against greater threats."
 election.7.b: "With friends like that, we'd need no enemies."
 
 election.71.t: "Autocrats Influence Foreign Policy"
 election.71.d: "Accepting the autocrats into our political coalition has had an impact on our foreign policy. Despite their vehement authoritarianism, they have sympathizers abroad who approve of the influence they've been given in [Root.GetName]. Autocratic governments of similar ideological leanings see us as potential allies. Maintaining ties to these nations, no matter the distaste [Root.GetRulingParty] may have for their ideals, may be necessary to retain the support of the autocrats backing our government."
 election.71.a: "We can use some allies against greater threats."
 election.71.b: "With friends like that, we'd need no enemies."
 
 election.72.t: "Authoritarian Democrats Influence Foreign Policy"
 election.72.d: "Accepting the Auth-Dems into our political coalition has had an impact on our foreign policy. They have sympathizers abroad who approve of the influence they've been given in [Root.GetName]. Several republic lead by blatantly authoritarian governments see us as potential allies. Maintaining ties to these nations, no matter the distaste [Root.GetRulingParty] may have for their ideals, may be necessary to retain the support of the authoritarian democrats backing our government."
 election.72.a: "We can use some allies against greater threats."
 election.72.b: "With friends like that, we'd need no enemies."
 
 
 election.81.t: "Socialists Influence Foreign Policy"
 election.81.d: "Socialists often consider themselves to be part of an international revolution, and our choice to accept them as partners in our government has drawn the attention of many of their international allies. Representatives of socialist parties maintain close ties to nations which have abandoned our form of government in favor of a dictatorship of the proletariat, ties which we may need to acknowledge in [Root.GetAdjective] foreign policy if we wish to retain their support."
 election.81.a: "We should embrace our common causes."
 election.81.b: "Down that path lies the dissolution of [Root.GetName] itself."
 
 ### WAR JUSTIFICATION ###
 # Mysticists vs XYZ
 war_justification.3.t: "[ROOT.GetLeader] Warns Against [From.GetAdjective] Revolution"
 war_justification.3.d: "'Is there a bigger threat to our way of life, or indeed the way of life itself, than the threat of the communists and socialists? They are a plague that threatens to make the slaves, not the masters, rule every nation, to abolish the nation itself, to abolish people and their history. We will take [From.GetName] and abolish the internationalist plague.'\n\n[ROOT.GetLeader]'s hatred of the far left has been well known since before [ROOT.GetRulingParty]'s rise to power, but it appears to have intensified recently in the specific case of the [From.GetAdjective] government. Our quest to purge Kraksism off the face of the Earth may start there."
 war_justification.3.a: "Those who reject nations will see their own perish."
 
 war_justification.203.t: "[From.GetLeader] Warns Against [ROOT.GetAdjective] Revolution"
 war_justification.203.d: "'Is there a bigger threat to our way of life, or indeed the way of life itself, than the threat of the communists and socialists? They are a plague that threatens to make the slaves, not the masters, rule every nation, to abolish the nation itself, to abolish people and their history. We will take [From.GetName] and abolish the internationalist plague.'\n\n[From.GetLeader]'s hatred of the far left has been well known since before [From.GetRulingParty]'s rise to power, but it appears to have intensified recently in the specific case of the [ROOT.GetAdjective] government. Our quest to purge Kraksism off the face of the Earth may start there."
 war_justification.203.a: "If they fear our cause, they fear their own people."
 
 # Communists/Socialists vs XYZ
 war_justification.7.t: "The [From.GetAdjective] Revolution Failing"
 war_justification.7.d: "'Comrades, although the greatest revolutionaries have once been called traitors, it has become plain to see that the revolution itself has been betrayed. How else would you explain the rule of the [From.GetRulingParty] of [From.GetName], who have cast aside every hint of Kraksist ideas to build a degenerated worker's state where they can reign under false premises? In strengthening their own power at the price of the international revolution, they have shown that they care little for the ideals they claim to hold. We must bring the true revolution to them.'\n\nAlthough initially supportive of the [From.GetAdjective] revolution, [ROOT.GetLeader] has expressed increased disappointment with how it has developed. The [ROOT.GetRulingParty] may have to intervene before it is too late."
 war_justification.7.a: "There is time yet to salvage their attempt at socialism."
 
 war_justification.207.t: "The [ROOT.GetAdjective] Revolution Failing"
 war_justification.207.d: "'Comrades, although the greatest revolutionaries have once been called traitors, it has become plain to see that the revolution itself has been betrayed. How else would you explain the rule of the [ROOT.GetRulingParty] of [ROOT.GetName], who have cast aside every hint of Kraksist ideas to build a degenerated worker's state where they can reign under false premises? In strengthening their own power at the price of the international revolution, they have shown that they care little for the ideals they claim to hold. We must bring the true revolution to them.'\n\nAlthough initially supportive of [ROOT.GetRulingParty]'s victory in [ROOT.Capital.GetName], [From.GetLeader] has drifted away from [ROOT.GetLeader]'s philosophy. The conflict has escalated to the point where they are preparing to invade to enforce their brand of socialism on us."
 war_justification.207.a: "They do not understand what the revolution means to the [ROOT.GetAdjective] people."
 
 war_justification.8.t: "[ROOT.GetLeader] Calls for Crushing [From.GetAdjective] Nationalism"
 war_justification.8.d: "'Is there any society more repugnant to the future of the revolution, any more alien to the plight of the worker, than the fascist regime of [From.GetName]? Calling upon the people to devote themselves fanatically to the decrepit institution of the nation state, they have dressed up age-old ways of savagery in a modern costume, trying to present themselves as an alternative future to the inevitable international victory of the working class. It is only a matter of time until they strike against us or our allies. Let us strike first.'\n\nNo one has expected less than mutual contempt between us and the [From.GetAdjective], but the animosity has intensified lately. It now appears that conflict will arise sooner rather than later."
 war_justification.8.a: "Death to mysticists!"
 
 war_justification.208.t: "[From.GetLeader] Calls for Crushing [ROOT.GetAdjective] Nationalism"
 war_justification.208.d: "'Is there any society more repugnant to the future of the revolution, any more alien to the plight of the worker, than the fascist regime of [ROOT.GetName]? Calling upon the people to devote themselves fanatically to the decrepit institution of the nation state, they have dressed up age-old ways of savagery in a modern costume, trying to present themselves as an alternative future to the inevitable international victory of the working class. It is only a matter of time until they strike against us or our allies. Let us strike first.'\n\nNo one has expected less than mutual contempt between us and the [ROOT.GetAdjective], but the animosity has intensified lately. Hearing [From.GetLeader] speak, it appears that conflict will arise sooner rather than later."
 war_justification.208.a: "Death to internationalists!"
 
 # Democrats (all) vs XYZ
 war_justification.9.t: "Diplomacy with [From.GetName] Breaks Down"
 war_justification.9.d: "'Despite our attempts to find a diplomatic solution to our conflict with [From.GetName], negotiations have once again broken down, leaving us with limited options. The autocratic [From.GetLeader] regime has displayed the unreasonable approach to this matter typical of leaders who are not accountable to their people. Barring a complete turnaround in the policies of [From.GetAdjective] leadership, we will be left with no recourse but to fight.'\n\n[ROOT.GetAdjective] intervention in [From.GetName] has been a hot issue, with some politicians in the opposition claiming that [ROOT.GetRulingParty] has pursued a hawkish policy from the start. Whatever their original intent, a future war now suddenly seems very real and inevitable."
 war_justification.9.a: "Sometimes, you need to climb the mountain of conflict."
 
 war_justification.12.t: "[ROOT.GetLeader] Confronts [From.GetAdjective] Nationalism"
 war_justification.12.d: "'In modern history, perhaps even in history as a whole, there has been no worse tyranny than the iron grip in which [From.GetRulingParty] now holds [From.GetName]. People may argue that we should not provoke conflict, that we should trust [From.GetLeader] to honor treaties and promises in the future, but these people fail to see that treaties made under the reign of mysticism are useless. To these dishonorable liars, might makes right, and the paper on which an agreement is written burns just as easily as the books of their detractors.'\n\nPeople who have long hoped to avoid a direct confrontation with [From.GetName] have now been strongly opposed by [ROOT.GetLeader], who argues that we in Nyachiavellian terms are merely postponing war to the advantage of the enemy. At this rate, we may strike the first blow after all."
 war_justification.12.a: "There can be no peace in our time until they are gone."
 
 war_justification.212.t: "[From.GetLeader] Confronts [ROOT.GetAdjective] Nationalism"
 war_justification.212.d: "'In modern history, perhaps even in history as a whole, there has been no worse tyranny than the iron grip in which [ROOT.GetRulingParty] now holds [ROOT.GetName]. People may argue that we should not provoke conflict, that we should trust [ROOT.GetLeader] to honor treaties and promises in the future, but these people fail to see that treaties made under the reign of mysticism are useless. To these dishonorable liars, might makes right, and the paper on which an agreement is written burns just as easily as the books of their detractors.'\n\nJealous of the glorious society we are building and the legacy it is founded upon, the [From.GetAdjective] seem prepared to start a war to destroy it. So much for their pretensions of peace."
 war_justification.212.a: "Inevitable. Better to have it over with."

 # Autocrats vs XYZ
 war_justification.15.t: "[ROOT.GetLeader] Wants to Restore Order in [From.GetName]"
 war_justification.15.d: "'The [ROOT.GetAdjective] national spirit is strong, but not all nations are so fortunate. [From.GetName] has had its traditions destroyed and rightful rulers long since murdered and buried, all in the name of the idea of the great Kraksist revolution. It is our duty to restore order to this world led astray by bloodthirsty usurpers and to assert the strength of [ROOT.GetName] against this threat.'\n\nWhile the [ROOT.GetRulingParty] has always opposed communism, [From.GetName] has been a target of particular attacks in recent speeches. Whether or not the attack on the [ROOT.GetAdjective] nation from communists is a real threat, the preemptive attack to snuff out the [From.GetAdjective] revolution is already in the works."
 war_justification.15.a: "Those murdered in the revolution will be avenged!"
 
 war_justification.215.t: "[From.GetLeader] Wants to Restore Order in [ROOT.GetName]"
 war_justification.215.d: "'The [From.GetAdjective] national spirit is strong, but not all nations are so fortunate. [ROOT.GetName] has had its traditions destroyed and rightful rulers long since murdered and buried, all in the name of the idea of the great Krakist revolution. It is our duty to restore order to this world led astray by bloodthirsty usurpers and to assert the strength of [From.GetName] against this threat.'\n\nWhile the [From.GetRulingParty] has always opposed communism, [ROOT.GetName] has been a target of particular attacks in recent speeches. Fearing their nation's inevitable progress to the next stage of history, a preemptive attack to snuff out the [ROOT.GetAdjective] revolution is already in the works."
 war_justification.215.a: "It's too late to reverse the progress we've made."

 # Gestalts vs XYZ
 war_justification.21.t: "[ROOT.GetLeader] Seeks to Subsume [ROOT.GetName]"
 war_justification.21.d: "'The [From.GetAdjective] People and their so called free will are an affront to our collective and have been for far too long. The [From.GetAdjective] people fear what they do not understand and no voice on its own may understand a collective like the [ROOT.GetName], as such we must strike before their fear turns to violence and they seek to do the same to us. This fight is not just for the glory of our collective but for the survival of the [ROOT.GetName] itself'\n\nWhile relations with [From.GetNameDef] have always been tense, the [ROOT.GetAdjective] Gestalt has turned its anger towards [From.GetNameDef] with their collective now gearing up for a war that is all but inevitable."
 war_justification.21.a: "What is an individual, in the face of the collective?"
 
 war_justification.221.t: "[From.GetLeader] Seeks to Subsume [From.GetName]"
 war_justification.221.d: "'The [ROOT.GetAdjective] People and their so called free will are an affront to our collective and have been for far too long. The [ROOT.GetAdjective] people fear what they do not understand and no voice on its own may understand a collective like the [From.GetName], as such we must strike before their fear turns to violence and they seek to do the same to us. This fight is not just for the glory of our collective but for the survival of the [From.GetName] itself'\n\nWhile [From.GetAdjective] relations with our government have always been tense, the [From.GetAdjective] Gestalt has turned its anger towards us with their collective now gearing up for a war that is all but inevitable."
 war_justification.221.a: "Our individualism is what makes us unique, and that is what makes us strong!"
 
 war_justification.22.t: "[ROOT.GetLeader] Threatens the [From.GetAdjective] Collective"
 war_justification.22.d: "'The [ROOT.GetAdjective] and [From.GetAdjective] were once thought to have a shared common ground as two of the few gestalt entities on the planet, but this common ground is seemingly not enough for a fruitful collaboration as we are now forced to prepare for the worst against THE [From.GetName].'\n\nContact our two collectives has gone silent now, with all focus being turned towards the inevitable clash between our colossal consciousnesses."
 war_justification.22.a: "There is only room in this theater for one chorus. Ours"
 
 war_justification.222.t: "[From.GetLeader] Threatens the [ROOT.GetAdjective] Collective"
 war_justification.222.d: "'The [From.GetAdjective] and [ROOT.GetAdjective] were once thought to have a shared common ground as two of the few gestalt entities on the planet, but this common ground is seemingly not enough for a fruitful collaboration as we are now forced to prepare for the worst against THE [ROOT.GetName].'\n\nContact our two collectives has gone silent now, with all focus being turned towards the inevitable clash between our colossal consciousnesses."
 war_justification.222.a: "There is only room in this theater for one chorus. Ours"
 
 war_justification.23.t: "[ROOT.GetLeader] warns of the threat of the [From.GetAdjective] Collective"
 war_justification.23.d: "'The [From.GetAdjective] menace is one we cannot shy away from any longer! They have no concept of the individual, there is no dissent or disagreement in their society. The [From.GetAdjective] entity is one with the might and size of an entire nation, with that backing it's only reasonable to expect it soon grow tired of its current size and borders and seek to expand its borders and with it destroy our identity like it destroyed its own. Its for this reason the [ROOT.GetName] cannot stand idly by for that day to come and must decisively act first.'\n\nRelations between [ROOT.GetNameDef] and the [From.GetNameDef] has broken down entirely as our society is consumed by fear and hatred of the [From.GetAdjective] collective, subsequently we have begun to prepare for war against the gestalt..."
 war_justification.23.a: "You will never take our Identity..."
 
 war_justification.223.t: "[From.GetLeader] warns of the threat of the [ROOT.GetAdjective] Collective"
 war_justification.223.d: "'The [ROOT.GetAdjective] menace is one we cannot shy away from any longer! They have no concept of the individual, there is no dissent or disagreement in their society. The [ROOT.GetAdjective] entity is one with the might and size of an entire nation, with that backing it's only reasonable to expect it soon grow tired of its current size and borders and seek to expand its borders and with it destroy our identity like it destroyed its own. Its for this reason the [From.GetName] cannot stand idly by for that day to come and must decisively act first.'\n\nRelations between [From.GetNameDef] and the [ROOT.GetNameDef] has broken down entirely as our society is consumed by fear and hatred of the [ROOT.GetAdjective] collective, subsequently we have begun to prepare for war against the gestalt..."
 war_justification.223.a: "The [From.GetAdjective] fear what they do not understand... A pity."
 
 war_justification.301.t: "[ROOT.GetLeader] Criticized for Weak Foreign Policy"
 war_justification.301.desc: "'We had the chance to strike against our enemies, but the [ROOT.GetRulingParty] let it pass by. Not only is this yet another damning case in a string of missed opportunities to strengthen [ROOT.GetName]'s position internationally, it is a sign that their claim to be acting in the interest of the [ROOT.GetAdjective] people is mostly empty rhetoric. It is time for a change in policy.'\n\nOur failure to pursue the war many had expected has been the target of scathing criticism from our political opponents. Not following through on our military plans will make it more difficult for us to convince the people in which direction we're taking [ROOT.GetName]."
 war_justification.301.a: "Don't they want to avoid war?"
 war_justification.301.b: "There is no room for public disagreement outside of party meetings."
 war_justification.301.c: "We cannot allow people to accuse [ROOT.GetLeader] of cowardice!"
 war_justification.301.d: "Have the police remind the public of our policies against dissent"
 war_justification.301.e: "The war was predicted to not necessarily develop to our advantage."
 
 # Generic Events
 generic.2.t: "[From.GetNameDefCap] seeks to join the [Root.GetFactionName]"
 generic.2.desc.a: "In the face of increasing threats to liberty and democratic values, the [alliance_applicant.GetAdjective] look to us as the defenders of freedom. They now wish to be admitted into our alliance, both to enjoy our protection and to stand with us against the forces that would threaten democracy."
 generic.2.desc.b: "Our plight to overturn the current world order has not escaped the notice of like-minded nations. The [alliance_applicant.GetAdjective] recognize that their best chance to carve out a prosperous future for themselves is to align with us in the coming conflict, and they have therefore offered to formally join us against our enemies."
 generic.2.desc.c: "[alliance_applicant.GetNameDefCap] has recognized that she must band together with fellow socialist republics to strengthen the place of the proletariat in the world. Accepting our leading role in the international plight of the worker, the [alliance_applicant.GetAdjective] now request to formally enter into an alliance with us."
 generic.2.desc.d: "[alliance_applicant.GetNameDefCap] has recognised the need for us fellow authoritarians to band together against the powers that seek our deposal. Their ambassador to our nation has formally sent a request to enter alliance with our great nation."
 generic.2.desc.e: "The [alliance_applicant.GetAdjective] collective has seemingly decided that us gestalt beings are better off fighting alongside one another in the face of a world that would see us destroyed. They have been in contact with our collective and have requested a formal alliance between us."
 generic.2.desc.f: "As the current upheavals in international politics continue to reverberate through the world, the [alliance_applicant.GetAdjective] have deemed us to be their greatest chance of surviving these tumultuous times. They therefore request to be admitted into our alliance, so that we may weather the coming storm together."
 generic.2.a: "All who stand for liberty and democracy may stand with us."
 generic.2.b: "The world belongs to all who are strong!"
 generic.2.c: "If we stand together, the revolution cannot but prevail."
 generic.2.d: "Security is safety, and this just makes our position more secure!"
 generic.2.e: "Our chorus's are in unison."
 generic.2.f: "And weather it, we shall!"
 generic.2.g: "We are better off without them."
 generic.2.h: "We already have the allies we need."
 
 generic.3.t: "[alliance_inviter.GetNameDefCap] welcomes us to the [alliance_inviter.GetFactionName]"
 generic.3.desc: "[alliance_inviter.GetNameDefCap] has decided to accept our request to join the [alliance_inviter.GetFactionName]. Henceforth we shall stand or fall together."
 generic.3.a: "Together we shall defend democracy."
 generic.3.b: "None can stand against us!"
 generic.3.c: "The workers' plight could not ask for finer champions!"
 generic.3.d: "No one shall threaten us now"
 generic.3.e: "Two minds, united against the world."
 generic.3.f: "We shall set our differences aside, for now."
 
 generic.4.t: "[alliance_inviter.GetNameDefCap] denies request to join the [alliance_inviter.GetFactionName]"
 generic.4.desc: "[alliance_inviter.GetNameDefCap] has decided to reject our request to join the [alliance_inviter.GetFactionName]. We will have to make do without their help."
 generic.4.a: "They call themselves defenders of liberty?"
 generic.4.b: "Then we will crush them, too!"
 generic.4.c: "Their revolution is corrupt!"
 generic.4.d: "If you're not with us, you're against us."
 generic.4.e: "Perhaps our tunes were not in sync"
 generic.4.f: "Our differences were too great."
 
 generic.5.t: "[From.GetNameDefCap] invites [Root.GetNameDef] to the [From.GetFactionName]"
 generic.5.desc.a: "With a suspicious eye on recent developments in world politics, [alliance_inviter.GetNameDef] extends us their hand of friendship, offering us their protection and urging us to stand with them in defence of the principles of liberty and democracy. As a member of the [alliance_inviter.GetFactionName], our people's freedom may well be safeguarded."
 generic.5.desc.b: "Recognizing that sometimes even the strong need allies, the [alliance_inviter.GetAdjective] have invited us to join the [alliance_inviter.GetFactionName]. If we choose to accept, this may well provide ample opportunity for us to find our place in the sun."
 generic.5.desc.c: "Our ideological allies in [alliance_inviter.GetNameDef] have made note of our valuable contributions to the workers' cause, and this morning we received an invitation us to join the [alliance_inviter.GetFactionName]. Standing together with other socialist republics, we could spread the revolution with renewed strength."
 generic.5.desc.d: "The respectable leaders of [alliance_inviter.GetNameDef] have made the brilliant decision to invite us to their faction! The strategic value of this offer is something we cannot overlook and may be a great opportunity for our nation."
 generic.5.desc.e: "Our fellow likeminded collective, [alliance_inviter.GetNameDef], have invited us to their defensive alliance. The might our two collectives can muster will only be amplified by working together. "
 generic.5.desc.f: "It appears the [alliance_inviter.GetAdjective] consider us to be of strategic interest to them, and that they deem it more profitable that we work together than that we should let ourselves be divided by our ideological differences. This morning, the [alliance_inviter.GetAdjective] Ambassador delivered an invitation for us to become a member state of the [alliance_inviter.GetFactionName]."
 generic.5.a: "We will make our stand with them."
 generic.5.b: "We only need a few thousand dead..."
 generic.5.c: "We will fight alongside our comrades!"
 generic.5.d: "We will be more secure alongside them"
 generic.5.e: "Our choruses are in alignment"
 generic.5.f: "It is the profitable choice."
 generic.5.g: "We are better off without them."
 
 generic.8.t: "The Bombs Fly Once More..."
 generic.8.d: "We have used the world's first nuclear weapon since the Kaiser's Imperium fell, firmly marking us as international boogeymen, if we didn't have that reputation already. Now we must wait and see how the powers at be respond to our attack, if they even respond at all..."
 generic.8.a: "Pound our enemies into dust!"
 generic.8.b: "We have shown the world our resolve, let's not push our luck further."
 
 generic.9.t: "The Weapons We Should've Buried"
 generic.9.d: "[?global.nukecountry.GetNameDefCap] has used the world's first nuclear weapon since the Kaiser's Crusade, breaking the nuclear armistice the world had enjoyed in the Kaiser's Absence. Despite our best efforts, the nuclear option is back on the table. We have no choice but to do what we can to respond to this thread and prepare our own countermeasures... or even look into our own strategic arsenal once again..."
 generic.9.a: "All good things come to an end..."
 
 # Generic.14 - attache objection
 attache_fascism_tt: "Due to the amount of $fascism$ support in our country this will have the following effect:\n"
