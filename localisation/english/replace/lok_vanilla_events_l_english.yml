 # NUKE Events
 nuke_dropped.1.t: "Atomic Bombing of [From.From.GetName]"
 nuke_dropped.1.d: "For the first and hopefully last time since the end of the Kaiser's Crusade, a nuclear bomb has been detonated in [From.From.GetName] as part of international warfare conducted by [?global.nukecountry.GetNameDef]. The horrifying destruction stands as a testament to the devastating power of this abominable weapon, which is feared not only for what it can do to its direct targets, but what implications it has for flusion  itself.\n\nThe world holds its breath waiting for what will come next. Will this force [From.From.Owner.GetNameDef] to surrender to avoid further terror, or will it only strengthen their resolve to strike back against those who would resort to such measures?"
 nuke_dropped.1.a: "War, War never changes.."
 nuke_dropped.1.b: "We will do whatever is necessary to protect the [ROOT.GetAdjective] people."