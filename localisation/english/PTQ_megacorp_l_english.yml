 PTQ_corporate_oversight_cat_desc:0 "The Pawtterston Quarries are sustained by the cooperation of six powerful megacorporations, each operating in their own sphere of influence across our territories. Katzpon must carefully manage these relationships - keeping them satisfied is essential for stability, but their demands are relentless.\n\n§Y═══════════════════════════════════§!\n\n§HPfotenstahl AG§!: Opinion §Y[?ROOT.ptq_pfotenstahl_opinion|0]§!/100 — §2Winston, Ost-Winston§!\n§HBergkralle Extraktion§!: Opinion §Y[?ROOT.ptq_bergkralle_opinion|0]§!/100 — §2Kattenburg§!\n§HQuarzkatz Mineralien§!: Opinion §Y[?ROOT.ptq_quarzkatz_opinion|0]§!/100 — §2Deaktiviertekamera, Magnetischergeschwollen§!\n§HSchnurrbart Fertigung§!: Opinion §Y[?ROOT.ptq_schnurrbart_opinion|0]§!/100 — §2Gligglepaw, Boogenstadt§!\n§HSamtpfote Handelsgesellschaft§!: Opinion §Y[?ROOT.ptq_samtpfote_opinion|0]§!/100 — §2Ezikat, Middenpaw§!\n§HNordlicht Energiewerke§!: Opinion §Y[?ROOT.ptq_nordlicht_opinion|0]§!/100 — §2Finstratus§!\n\n§Y═══════════════════════════════════§!\n§ROpinions decay by 2 each month. Grant concessions to maintain relations!§!"

