 lok_peace_decisions_cat:0 "Reshaping the World"
 lok_peace_decisions_cat_desc:0 "As we project our power across the world, it is paramount that we properly manage our conquests and reshape their borders according to our needs and limits.\n\nEvery §Ynon-core state§! which we hold will reduce our §YStability§! and §YWar Support§! by §R1%§!. Having a §YClaim§! will halve these effects while releasing puppets or integrating the states will remove them.\n\nWe currently lose §R[?ROOT.stab_from_noncore_display]%§! §YStability§! and §R[?ROOT.ws_from_noncore_display]%§! §YWar Support§! from non-core states. "
 decide_fate_of_nation:0 "Reorganize the territories of §Y[From.GetNameDef]§!"
 decide_fate_of_nation_tt:0 "We will be able to decide whether to release the territories of §Y[From.GetNameDef]§! as a puppet, or keep the occupation."
 return_occupied_cores_to_puppet:0 "Return Territories to §Y[From.GetNameDef]§!"
 return_occupied_cores_to_puppet_desc:0 "Our administration has acquired territory recognized as part of [From.GetNameDef]. Unless we possess our own core, claim, or established path toward integration, these lands should be restored to the local puppet government."
