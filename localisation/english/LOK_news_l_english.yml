 ### Herzlands Capital Move to Katown
 LOK_news.13.t:0 "Capital Moved to Katown!" #AI-Generated, Change Later
 LOK_news.13.d:0 "In a resounding display, [ROOT.GetNameDef] has proclaimed Katown as its new capital! The ancient seat of the Katzen Empire now serves as the heart of a new power, as [ROOT.GetLeader] declares a new era for the Herzlands from the shadow of the great Katown Pyramid.\n\nThe move signals [ROOT.GetNameDef]'s ambitions for Herzlands unification and sends a powerful message to rival warlords." #AI-Generated, Change Later
 LOK_news.13.a:0 "The workers seize the ancient capital!" #AI-Generated, Change Later
 LOK_news.13.b:0 "Katown is reborn under strong leadership!" #AI-Generated, Change Later
 LOK_news.13.c:0 "A bold move for the Herzlands." #AI-Generated, Change Later
 LOK_news.13.e:0 "Katown rises again." #AI-Generated, Change Later
 LOK_news.13.f:0 "Capital relocation noted." #AI-Generated, Change Later
