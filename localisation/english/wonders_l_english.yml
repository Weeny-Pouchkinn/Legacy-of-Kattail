  dismantle_unterflusionian_monument:0 "Destroy the §H$var_wonder.14$§!"
  dismantle_unterflusionian_monument_desc:0 "The §H$var_wonder.14$§! is an affront to our ideals and morals. We must tear down this symbol of Neukat degeneracy before it corrupts the minds of more people."

  close_tailsbaden_hole:0 "Close down the §H$var_wonder.9$§!"
  close_tailsbaden_hole_desc:0 "The §H$var_wonder.9$§! represents a major safety hazard and must be closed down before more people perish to its depths."
  
  shut_down_kiffrance_labs:0 "Shut down the §H$var_wonder.12$§!"
  shut_down_kiffrance_labs_desc:0 "The §H$var_wonder.12$§! are nothing more than a hub of undesirable criminal activity. It is time we clamp down on them for good."
  
