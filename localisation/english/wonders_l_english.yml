  var_wonder.1: "Grand Katown Pyramid"
  var_wonder_desc.1:0 "$wonder_effects_tooltips$\n§LThe heart of the Herzlands, the Katown Pyramid is a gargantuan mile-tall fortified complex housing countless administrative and military command centers, intended to centralize the governance of the Katzen state.§!"
  # wonder_idea_1_normal:0 "$var_wonder.1$"
  # wonder_idea_1_capital:0 "$var_wonder.1$"
  # wonder_idea_1_noncore:0 "$var_wonder.1$"

  var_wonder.2: "Lionsburg Riesigerwerks"
  var_wonder_desc.2:0 "$wonder_effects_tooltips$\n§LWhile the components for the fearsome Riesigerkatzenpanzers are built all across the Herzlands, the actual vehicles are assembled in these gargantuan assembly yards in the outskirts of the Lionsburg megalopolis. Even if Riesigerkatzenpanzer production was to cease, they can nonetheless be retooled to assemble a variety of heavy vehicles.§!"
  # wonder_idea_2_normal:0 "$var_wonder.2$"
  # wonder_idea_2_capital:0 "$var_wonder.2$"
  # wonder_idea_2_noncore:0 "$var_wonder.2$"

  var_wonder.3: "Great Shipyards of Auralia"
  var_wonder_desc.3:0 "$wonder_effects_tooltips$\n§LThe large, open Auralian bay provides an ideal spot for the mass assembly of Katzen vessels of wars. They primarily focus on the construction of countless smaller but nonetheless vitally important screening ships.§!"
  # wonder_idea_3_normal:0 "$var_wonder.3$"
  # wonder_idea_3_capital:0 "$var_wonder.3$"
  # wonder_idea_3_noncore:0 "$var_wonder.3$"
  
  var_wonder.4: "Himezulte Megairbase"
  var_wonder_desc.4:0 "$wonder_effects_tooltips$\n§LThe Himezulte airbase is located on the coast of the Solakatzen Channel, served as the main base for aerial operations over Solakea and Western Flusionea during the Kaiser's Crusade. Owing to its location deep in the Drakwald Jungle (intended to make it near-impossible to locate and capture), the base is nearly self-sustaining: it can extract and refine fuel for aircraft as well as manufacture numerous aircraft parts on-site even if bereft of supply lines from Katown.§!"
  # wonder_idea_4_normal:0 "$var_wonder.4$"
  # wonder_idea_4_capital:0 "$var_wonder.4$"
  # wonder_idea_4_noncore:0 "$var_wonder.4$"

  var_wonder.5: "Purrlin Stock Exchange"
  var_wonder_desc.5:0 "$wonder_effects_tooltips$\n§LHistorically, the island megalopolis of Purrlin has always served as the 'gateway to the Herzlands', being the first stop for the countless merchants and businesses wishing to bargain with the Herzlanders. While these functions are expectably declining as the Kaiser continues to focus Herzlandish trade on its own sphere of puppets, Lionsburg nonetheless retains its position as the trade capital of the southern Herzlands, a role which it hopes to continue honing in on during these troubled times.§!"
  # wonder_idea_5_normal:0 "$var_wonder.5$"
  # wonder_idea_5_capital:0 "$var_wonder.5$"
  # wonder_idea_5_noncore:0 "$var_wonder.5$"

  var_wonder.6: "Südkatzelandisch Universität"
  var_wonder_desc.6:0 "$wonder_effects_tooltips$\n§LThe Südkatzelandisch Universität is one of the largest universities in the Herzlands, being extensively funded by the Kaiser as part of his efforts to create a 'Little Katown' in the south. Rivaled only by the likes of the Frankfurr Institute and the Great Katownite Universities, the relative stability of Meon enables the university to attract numerous intellectuals and students seeking refuge from the war-eager atmosphere of the Northern Herzlands.\n\nThe Universität has every course for whatever type of profession, whether experimental bio-engineering or some extreme niche part of physics. For this reason, almost all citizens of the greater Meon area eventually pass through the gilded gates to make their way in the world. Much like the Meon Betharian Plant, the university is independent from the rest of the city although with much warmer relations between students and normal citizens.\n\nNew (and highly tested) GMO foods are grown here to feed the populace and the various engineering corps are often requested to make specific laboratory equipment. While students may often leave campus to explore other parts of the city, there are movies put on created by aspiring theater students regularly or shops temporarily run by business majors for their stay in the Universität. §!"
  # wonder_idea_6_normal:0 "$var_wonder.6$"
  # wonder_idea_6_capital:0 "$var_wonder.6$"
  # wonder_idea_6_noncore:0 "$var_wonder.6$"

  var_wonder.7: "Von Kattensbach Estates"
  var_wonder_desc.7:0 "$wonder_effects_tooltips$\n§LThese sprawling estates serve as the home of the prestigious Von Kattensbach family, which both Loris and renowned Field Marshall Elwin are a part of. They have been in the family for centuries, from the Cat Kingdom era and even through the Kaiser's abolishment of the Katzen nobility. Nowadays, in an attempt to appease the various traditionalist factions of the north all while curtailing monarchist influence, Kattail has had parts of these estates turned into a public museum dedicated to the memory of the Von Kattensbach family and the history of Katzen nobility in general.§!"
  # wonder_idea_7_normal:0 "$var_wonder.7$"
  # wonder_idea_7_capital:0 "$var_wonder.7$"
  # wonder_idea_7_noncore:0 "$var_wonder.7$"
  
  var_wonder.8: "Frankfurr Institute"
  var_wonder_desc.8:0 "$wonder_effects_tooltips$\n§LOne of the greatest centers of science in the entire Herzlands, the Frankfurr Institute is where much of the Imperium's research efforts are centralized and coordinated from. Aiming to continue spearheading Katzen science despite the collapse, it offers scholarships to the brighest of students and funding to the most ambitious of scientists. Unbeknownst to most, the Institute's lower layers house numerous databanks containing classified research projects undertaken by the Kaiser ranging from Soulbots to Riesigerkatzenpanzers, either unfinished or heavily encrypted.§!"
  # wonder_idea_8_normal:0 "$var_wonder.8$"
  # wonder_idea_8_capital:0 "$var_wonder.8$"
  # wonder_idea_8_noncore:0 "$var_wonder.8$"

  var_wonder.9: "Tailsbaden Borehole"
  var_wonder_desc.9:0 "$wonder_effects_tooltips$\n§LThe Kaiser's greed knows no bounds and as he wants to rule Flusion, so did he wish to seize every last drop of its resources. The Tailsbaden Borehole is to be the first of a series of gargantuan vertical quarries, designed to reach dozens of kilometers into the crust both horizontally and vertically, reaping countless resources from the loaded depths of the Katzen mountains.§!"
  # wonder_idea_9_normal:0 "$var_wonder.9$"
  # wonder_idea_9_capital:0 "$var_wonder.9$"
  # wonder_idea_9_noncore:0 "$var_wonder.9$"

  var_wonder.10: "Stronien Logistical Hub"
  var_wonder_desc.10:0 "$wonder_effects_tooltips$\n§LThe Superhighway is perhaps one of Kattail's greatest undertakings. A gargantuan network of highways, rails and canals, spanning across the Herzlands and beyond. Some see it as the manifestation of progress, others like a web woven by the feline spider over its prey. Nonetheless, the Superhighway is the key to the Imperium's rapid economical growth and it is right there in Stronien that most of the planning around the highway is undertaken. Entire cities were built dedicated to housing, educating and training the countless engineers and public works experts required to keep the project going, alongside vast factories to churn out the equipment needed to tie the continent-sized Imperium together.§!"
  # wonder_idea_10_normal:0 "$var_wonder.10$"
  # wonder_idea_10_capital:0 "$var_wonder.10$"
  # wonder_idea_10_noncore:0 "$var_wonder.10$"

  var_wonder.11: "Punchiestadt Orchards"
  var_wonder_desc.11:0 "$wonder_effects_tooltips$\n§LIn stark contrast with most of the highly-industrialized north, the Punchiestadt Orchards are one of the Herzlands' greatest specialized agricultural production basin. Ran by a conglomerate of Katzen and Rattish corporations mostly headquartered in the twin cities of Momoburg and Haselnuss, these hyperproductive apple orchards cover millions of acres and produce a staggering amount of high-quality apples which are then exported throughout the Herzlands and beyond.\n\nThese apples, distinguished by a tightly-controlled label, can be found from restaurants in Lionsburg through the rations of Tailsbaden mine workers to the meals served at university cafeterias in Frankfurr. The characteristics of this unusually successful production area have been the focus of numerous geographical studies, the results of which are often taught to rather indifferent Katzen students across the Herzlands as part of their geography courses.§!"
  # wonder_idea_11_normal:0 "$var_wonder.11$"
  # wonder_idea_11_capital:0 "$var_wonder.11$"
  # wonder_idea_11_noncore:0 "$var_wonder.11$"

  var_wonder.12: "Kiffrance Plants"
  var_wonder_desc.12:0 "$wonder_effects_tooltips$\n§L'Kiffrance' is the name given to a highly experimental drug employed by Katzen forces during the Kaiser's Crusade. Invented by a brilliant Clermeowth-born Macaquian chemist, it provides incredible memorization capabilities for several days, allowing soldiers and planners to remember and execute battleplans near-flawlessly. Side-effects however manifest after a few days, and while more drugs were able to be produced by the Imperium to counter them, the knowledge to produce them has been essentially lost during the Collapse, meaning users of the drug often have to deal with splitting headaches and intense nausea. Regardless, the various crime syndicates of Meorseilles make massive profit by illegally providing Kiffrance to countless Katzens across the Herzlands, mostly students and small warlords desperate to accomplish something of note in these troubled times.§!"

  var_wonder.13: "Grüyettburg Pharmaceutics"
  var_wonder_desc.13:0 "$wonder_effects_tooltips$\n§LRan by a wealthy family tracing its root back to Cat Kingdom nobility, Grüyettburg is home to a gargantuan pharmaceutics corporation producing and selling all manners of medical drugs across the Southern Herzlands. With the Collapse essentially severing the supply chains of other companies, they have been able to grow immensely in size to the point of exercising a near-monopoly within Lionita, supplying essentially every pharmacy and hospital with the drugs they need to keep running.§!"

  var_wonder.14: "Unterflusionian Monument"
  var_wonder_desc.14:0 "$wonder_effects_tooltips$\n§LErected shortly after the Collapse by hardline Katzen ultranationalists, this vast complex of monuments depicts triumphant Katzens standing above the writhing masses of 'Unterflusionians', who are often depicted undertaking intensive 'indentured servitude' for the glory of the feline race. While it has caused much outrage within the Herzlands and especially beyond, supporters of the Neukat regime view it as an 'essential' reminder of what the role of Unterflusionians is - to serve the proud Katzen race and enable its ascension to the uncontested hegemons of the world.§!"

  var_wonder.15: "Great City of Charles"
  var_wonder_desc.15:0 "$wonder_effects_tooltips$\n§LBuilt over generations under the rule of successive Rois, the city of Charles is Takicardie's heart. Its hundreds upon hundreds of levels and floors rise over a kilometer into the air and concentrate the vast majority of the nation's industrial output, incorporating countless factories, housing blocks and cultural hotspots dedicated to the Roi's glory.§!"

  var_wonder.16: "Südberg Damm"
  var_wonder_desc.16:0 "$wonder_effects_tooltips$\n§LThe Südberg Damm stands at the head of the Drakwald river, a testament to Imperial ambitions. It tamed the flood-prone Drakwald, provided power and water for the southeast, and brought about a cooler, wetter climate in the region. Without reliable power links to other regions its capacity is massively underutilized, only Meon with its BDCs is able to exceed the dam's raw power generation.\n\nYet despite all of its grandeur, Südberg Damm was built as a mere testbed, a scale model of yet grander ambitions to be carried out in Amphibia to the east and Roaquilia to the west, a place to prove that the Riesieger chassis could be used for more than destruction. For now though, it forms the beating heart of the region.§!"
