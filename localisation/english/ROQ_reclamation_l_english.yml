l_english:
 # ─────────────────────────────────────────────────────────────────────────────
 # Decision Category
 # ─────────────────────────────────────────────────────────────────────────────
 ROQ_reclamation_cat:0 "La Réclamation"
 ROQ_reclamation_cat_desc:0 "Roqualia has launched its Réclamation — a war of reconquest against the Katzen peoples of the east. The §YSteel Steppes Union§! (SSU), led by Gallopia, is closely watching the conflict. While Gallopia itself wishes to intervene, its allies §YGoatlandia§!, §YSolaria§!, and §YTenetianen§! are more hesitant.\n\nFSR and DOM must lobby the SSU member nations to gain their support, raising each nation from §8Disinterested§! all the way to §GAdemant§!. Every month, each SSU member may send a package of support, the size of which scales with their current support level.\n\nIf the war is still ongoing after §Y180 days§!, Gallopia will add the Katzen nations to the Steel Steppes Union's faction.\n\n§YSSU Support currently active on Katzen Nations:§!\n §YAir Agility§!: §G+[?FSR.ROQ_reclamation_air_agility_mod|%0]§!\n §YAir Attack§!: §G+[?FSR.ROQ_reclamation_air_attack_mod|%0]§!\n §YAir Defence§!: §G+[?FSR.ROQ_reclamation_air_defence_mod|%0]§!\n §YArmy Attack§!: §G+[?FSR.ROQ_reclamation_army_attack_mod|%0]§!\n §YArmy Defence§!: §G+[?FSR.ROQ_reclamation_army_defence_mod|%0]§!\n §YBreakthrough§!: §G+[?FSR.ROQ_reclamation_breakthrough_mod|%0]§!\n §YCoordination§!: §G+[?FSR.ROQ_reclamation_coordination_mod|%0]§!\n §YSupply Use§!: §R[?FSR.ROQ_reclamation_supply_consumption_mod|%0]§!\n §YBuild Speed§!: §G+[?FSR.ROQ_reclamation_build_speed_mod|%0]§!\n §YFactory Output§!: §G+[?FSR.ROQ_reclamation_factory_output_mod|%0]§!\n §YFort Build Speed§!: §G+[?FSR.ROQ_reclamation_fort_build_speed_mod|%0]§!\n §YAA Build Speed§!: §G+[?FSR.ROQ_reclamation_aa_build_speed_mod|%0]§!\n §YConsumer Goods§!: §R[?FSR.ROQ_reclamation_consumer_goods_mod|%0]§!"

 # Support level labels (for scripted loc)
 ROQ_reclamation_support_level_disinterested:0 "§8Disinterested§!"
 ROQ_reclamation_support_level_supportive:0 "§YSupportive§!"
 ROQ_reclamation_support_level_protective:0 "§GProtective§!"
 ROQ_reclamation_support_level_adamant:0 "§GAdamant§!"

 # Dynamic modifier name
 ROQ_reclamation_ssu_support:0 "SSU Support (Katzen Nations)"

 # ─────────────────────────────────────────────────────────────────────────────
 # Timed Missions
 # ─────────────────────────────────────────────────────────────────────────────
 MCF_reclamation_cloudstrider_intervention:0 "Cloudstrider Intervention"
 MCF_reclamation_cloudstrider_intervention_desc:0 "The Steel Steppes Union is considering direct intervention in the war between Roqualia and the Katzen nations. The 180-day countdown represents the time before the SSU decides to take the Katzen nations under its protection — if the war is still ongoing at that point."

 ROQ_reclamation_cloudstrider_intervention:0 "Cloudstrider Intervention"
 ROQ_reclamation_cloudstrider_intervention_desc:0 "Gallopia's Steel Steppes Union is watching this war carefully. If the Katzen nations can survive for 180 days, Gallopia will welcome them into the SSU faction."

 # ─────────────────────────────────────────────────────────────────────────────
 # MCF Support Decisions
 # ─────────────────────────────────────────────────────────────────────────────
 MCF_reclamation_air_advisors:0 "Send Air Advisors\n[THIS.GetROQReclamationSupportLevel]"
 MCF_reclamation_air_advisors_desc:0 "Dispatch experienced Cloudstrider air warfare advisors to assist the Katzen nations. They will improve their air forces' agility and responsiveness.\n\n§YBase effect (at Supportive):§! Air Agility: §G+5%§!\n§WActual effect is multiplied by current support level:\nDisinterested: ×0.5 | Supportive: ×1 | Protective: ×1.5 | Adamant: ×2§!\n\n§YAvailable once per month.§!"

 MCF_reclamation_weather_disruption:0 "Protectively Disrupt Weather\n[THIS.GetROQReclamationSupportLevel]"
 MCF_reclamation_weather_disruption_desc:0 "Deploy Cloudstrider weather manipulation teams to create unfavorable conditions for Roqualian air operations, giving the Katzen air forces an edge in both attack and defence.\n\n§YBase effect (at Supportive):§! Air Attack: §G+5%§! | Air Defence: §G+5%§!\n§WActual effect is multiplied by current support level.\n§YAvailable once per month.§!"

 # ─────────────────────────────────────────────────────────────────────────────
 # KHA Support Decisions
 # ─────────────────────────────────────────────────────────────────────────────
 KHA_reclamation_war_advisors:0 "Send War Advisors\n[THIS.GetROQReclamationSupportLevel]"
 KHA_reclamation_war_advisors_desc:0 "Send experienced Goatlandian military commanders to serve as advisors within the Katzen armies, improving both offensive and defensive performance.\n\n§YBase effect (at Supportive):§! Army Attack: §G+5%§! | Army Defence: §G+5%§!\n§WActual effect is multiplied by current support level.\n§YAvailable once per month.§!"

 KHA_reclamation_recon_raiders:0 "Send Recon Raiders\n[THIS.GetROQReclamationSupportLevel]"
 KHA_reclamation_recon_raiders_desc:0 "Deploy Goatlandian raiding specialists to scout enemy positions and coordinate surprise attacks, boosting the Katzen forces' breakthrough capability and coordination.\n\n§YBase effect (at Supportive):§! Breakthrough: §G+5%§! | Coordination: §G+5%§!\n§WActual effect is multiplied by current support level.\n§YAvailable once per month.§!"

 # ─────────────────────────────────────────────────────────────────────────────
 # SLR Support Decisions
 # ─────────────────────────────────────────────────────────────────────────────
 SLR_reclamation_logistical_advisors:0 "Send Logistical Advisors\n[THIS.GetROQReclamationSupportLevel]"
 SLR_reclamation_logistical_advisors_desc:0 "Solarian logistical experts will help the Katzen nations optimise their supply lines, reducing the overall supply consumption of their forces.\n\n§YBase effect (at Supportive):§! Supply Use: §R-2.5%§!\n§WActual effect is multiplied by current support level.\n§YAvailable once per month.§!"

 SLR_reclamation_industrial_engineers:0 "Send Industrial Engineers\n[THIS.GetROQReclamationSupportLevel]"
 SLR_reclamation_industrial_engineers_desc:0 "Solarian industrial engineers will assist in expanding and accelerating construction projects across the Katzen nations.\n\n§YBase effect (at Supportive):§! Build Speed: §G+2.5%§!\n§WActual effect is multiplied by current support level.\n§YAvailable once per month.§!"

 # ─────────────────────────────────────────────────────────────────────────────
 # TEN Support Decisions
 # ─────────────────────────────────────────────────────────────────────────────
 TEN_reclamation_industrial_advisors:0 "Send Industrial Advisors\n[THIS.GetROQReclamationSupportLevel]"
 TEN_reclamation_industrial_advisors_desc:0 "Tenetianen industrial consultants will help maximise the output of the Katzen nations' factories, providing a meaningful boost to their war production.\n\n§YBase effect (at Supportive):§! Factory Output: §G+5%§!\n§WActual effect is multiplied by current support level.\n§YAvailable once per month.§!"

 TEN_reclamation_fortification_engineers:0 "Send Fortification Engineers\n[THIS.GetROQReclamationSupportLevel]"
 TEN_reclamation_fortification_engineers_desc:0 "Tenetianen military engineers specialising in fortifications and anti-air emplacements will be seconded to assist the Katzen nations in rapidly reinforcing their defensive lines.\n\n§YBase effect (at Supportive):§! Fort Build Speed: §G+5%§! | AA Build Speed: §G+5%§!\n§WActual effect is multiplied by current support level.\n§YAvailable once per month.§!"

 # ─────────────────────────────────────────────────────────────────────────────
 # Generic SSU Support Decisions
 # ─────────────────────────────────────────────────────────────────────────────
 LOK_reclamation_military_support:0 "Send Military Support\n[THIS.GetROQReclamationSupportLevel]"
 LOK_reclamation_military_support_desc:0 "Send military aid to the Katzen nations, providing personnel and equipment that improves their breakthrough capability.\n\n§YBase effect (at Supportive):§! Breakthrough: §G+2.5%§!\n§WActual effect is multiplied by current support level.\n§YAvailable once per month.§!"

 LOK_reclamation_political_support:0 "Send Political Support\n[THIS.GetROQReclamationSupportLevel]"
 LOK_reclamation_political_support_desc:0 "Leverage political connections to help ease domestic pressure in the Katzen nations, freeing up factories from consumer goods production.\n\n§YBase effect (at Supportive):§! Consumer Goods: §R-5%§!\n§WActual effect is multiplied by current support level.\n§YAvailable once per month.§!"

 # ─────────────────────────────────────────────────────────────────────────────
 # FSR / DOM Lobby Decision
 # ─────────────────────────────────────────────────────────────────────────────
 FSR_DOM_reclamation_lobby:0 "Lobby §Y[FROM.GetName]§!\nStance: [FROM.GetROQReclamationSupportLevel]"
 FSR_DOM_reclamation_lobby_desc:0 "Spend political capital to lobby [FROM.GetName] and increase their support for our cause.\n\n§YSuccess chance:§! §G50%§! (§R33%§! if both Ost-Roqualien and Dominiontracks are at war)\n§YTime:§! 30 days | §YCost:§! 50 PP\n\n§H──── What [FROM.GetName] can do for us: ────§!\n[FROM.GetROQReclamationWhatTheyCanDo]\n\n§WNote:§! Support levels — §8Disinterested§! (×0.5 effect) → §YSupportive§! (×1) → §GProtective§! (×1.5) → §GAdamant§! (×2)"

 ROQ_reclamation_lobby_success_tt:0 "§G[FROM.GetName] has been persuaded!§! Their support level increases by 1."
 ROQ_reclamation_lobby_fail_tt:0 "§RDiplomacy failed.§! [FROM.GetName] was not moved by our arguments this time."

 # ─────────────────────────────────────────────────────────────────────────────
 # Effect tooltips (shown in notification events)
 # ─────────────────────────────────────────────────────────────────────────────
 ROQ_reclamation_air_agility_received_tt:0 "The §Y$ROQ_reclamation_ssu_support$§! modifier has been updated:\n§YAir Agility§! bonus increased (amount depends on [FROM.GetName]'s support level)"
 ROQ_reclamation_air_weather_received_tt:0 "The §Y$ROQ_reclamation_ssu_support$§! modifier has been updated:\n§YAir Attack§! and §YAir Defence§! bonuses increased (amount depends on [FROM.GetName]'s support level)"
 ROQ_reclamation_war_advisors_received_tt:0 "The §Y$ROQ_reclamation_ssu_support$§! modifier has been updated:\n§YArmy Attack§! and §YArmy Defence§! bonuses increased (amount depends on [FROM.GetName]'s support level)"
 ROQ_reclamation_recon_raiders_received_tt:0 "The §Y$ROQ_reclamation_ssu_support$§! modifier has been updated:\n§YBreakthrough§! and §YCoordination§! bonuses increased (amount depends on [FROM.GetName]'s support level)"
 ROQ_reclamation_logistical_advisors_received_tt:0 "The §Y$ROQ_reclamation_ssu_support$§! modifier has been updated:\n§YSupply Use§! reduction improved (amount depends on [FROM.GetName]'s support level)"
 ROQ_reclamation_industrial_engineers_received_tt:0 "The §Y$ROQ_reclamation_ssu_support$§! modifier has been updated:\n§YBuild Speed§! bonus increased (amount depends on [FROM.GetName]'s support level)"
 ROQ_reclamation_industrial_advisors_received_tt:0 "The §Y$ROQ_reclamation_ssu_support$§! modifier has been updated:\n§YFactory Output§! bonus increased (amount depends on [FROM.GetName]'s support level)"
 ROQ_reclamation_fortification_engineers_received_tt:0 "The §Y$ROQ_reclamation_ssu_support$§! modifier has been updated:\n§YFort Build Speed§! and §YAA Build Speed§! bonuses increased (amount depends on [FROM.GetName]'s support level)"
 ROQ_reclamation_military_support_received_tt:0 "The §Y$ROQ_reclamation_ssu_support$§! modifier has been updated:\n§YBreakthrough§! bonus increased (amount depends on [FROM.GetName]'s support level)"
 ROQ_reclamation_political_support_received_tt:0 "The §Y$ROQ_reclamation_ssu_support$§! modifier has been updated:\n§YConsumer Goods§! reduction improved (amount depends on [FROM.GetName]'s support level)"

 # ─────────────────────────────────────────────────────────────────────────────
 # Event Titles, Descriptions and Options
 # ─────────────────────────────────────────────────────────────────────────────

 # Event 10: Air Advisors
 ROQ_reclamation.10.t:0 "Cloudstrider Air Advisors Arrive"
 ROQ_reclamation.10.d:0 "[FROM.GetName] has dispatched experienced air warfare advisors to our forces. Their expertise will improve the agility and responsiveness of our air wings against the Roqualian threat."
 ROQ_reclamation.10.a:0 "Our pilots will fly faster and sharper!"

 # Event 11: Weather Disruption
 ROQ_reclamation.11.t:0 "Weather Disruption Operations Begin"
 ROQ_reclamation.11.d:0 "Cloudstrider weather specialists from [FROM.GetName] have deployed covertly to create favourable conditions for our air operations. Roqualian strike craft will find the skies less cooperative than they expected."
 ROQ_reclamation.11.a:0 "Let the storm work for us!"

 # Event 12: War Advisors
 ROQ_reclamation.12.t:0 "Goatlandian War Advisors Arrive"
 ROQ_reclamation.12.d:0 "[FROM.GetName] has seconded seasoned military commanders to advise our officers. Their experience in offensive and defensive warfare will improve the fighting capability of our armies at every level."
 ROQ_reclamation.12.a:0 "With their guidance, we shall hold the line!"

 # Event 13: Recon Raiders
 ROQ_reclamation.13.t:0 "Goatlandian Recon Raiders Deployed"
 ROQ_reclamation.13.d:0 "Elite raiding units from [FROM.GetName] have been embedded with our forward divisions. Their expertise in reconnaissance and disruption operations will sharpen our breakthrough capability and battlefield coordination."
 ROQ_reclamation.13.a:0 "Strike hard and fast!"

 # Event 14: Logistical Advisors
 ROQ_reclamation.14.t:0 "Solarian Logistical Advisors Arrive"
 ROQ_reclamation.14.d:0 "[FROM.GetName] has sent logistics specialists to overhaul our supply chain. Redundancies have been identified and eliminated — our troops in the field will receive more with less."
 ROQ_reclamation.14.a:0 "Efficiency is its own kind of weapon."

 # Event 15: Industrial Engineers
 ROQ_reclamation.15.t:0 "Solarian Industrial Engineers Arrive"
 ROQ_reclamation.15.d:0 "A team of Solarian engineers from [FROM.GetName] has arrived to assist with ongoing construction projects. Their know-how should meaningfully accelerate our building programmes."
 ROQ_reclamation.15.a:0 "Factories rising faster. Good."

 # Event 16: Industrial Advisors
 ROQ_reclamation.16.t:0 "Tenetianen Industrial Advisors Arrive"
 ROQ_reclamation.16.d:0 "[FROM.GetName] has sent industrial consultants to our factories. Their methods for maximising output per worker should increase the rate at which our war industries produce equipment."
 ROQ_reclamation.16.a:0 "More guns, more shells. We will need them."

 # Event 17: Fortification Engineers
 ROQ_reclamation.17.t:0 "Tenetianen Fortification Engineers Arrive"
 ROQ_reclamation.17.d:0 "Specialists from [FROM.GetName] in the construction of bunker networks and anti-air emplacements have arrived. Our defensive lines will be reinforced far more rapidly than before."
 ROQ_reclamation.17.a:0 "Let them come against our walls!"

 # Event 18: Military Support
 ROQ_reclamation.18.t:0 "Military Support from [FROM.GetName]"
 ROQ_reclamation.18.d:0 "[FROM.GetName] has sent a package of military aid — equipment, training cadre, and advisors. While they lack the specialised expertise of some of our other supporters, their assistance still makes our forces more capable of driving through enemy lines."
 ROQ_reclamation.18.a:0 "Every ally counts."

 # Event 19: Political Support
 ROQ_reclamation.19.t:0 "Political Support from [FROM.GetName]"
 ROQ_reclamation.19.d:0 "[FROM.GetName] has leveraged its diplomatic connections to ease economic pressures on us, rallying international opinion to our cause and allowing us to redirect some of our industrial output away from consumer goods."
 ROQ_reclamation.19.a:0 "Let the world see who the true aggressors are."

 # Event 20: Faction join notification
 ROQ_reclamation.20.t:0 "Gallopia Opens Its Arms"
 ROQ_reclamation.20.d:0 "After 180 days of steadfast resistance against Roqualian aggression, Gallopia has honoured its commitment to the Katzen peoples. We have been welcomed into the Steel Steppes Union — Roqualia's war against us has become a war against the SSU."
 ROQ_reclamation.20.a:0 "We are no longer alone!"

 # ─────────────────────────────────────────────────────────────────────────────
 # Scripted loc: what each ally can contribute (used in lobby decision desc)
 # ─────────────────────────────────────────────────────────────────────────────
 ROQ_reclamation_what_mcf_can_do:0 "§YGallopia (MCF)§!: Air Advisors §G(+air agility)§! or Weather Disruption §G(+air attack & defence)§!"
 ROQ_reclamation_what_kha_can_do:0 "§YGoatlandia (KHA)§!: War Advisors §G(+army attack & defence)§! or Recon Raiders §G(+breakthrough & coordination)§!"
 ROQ_reclamation_what_slr_can_do:0 "§YSolaria (SLR)§!: Logistical Advisors §G(-supply use)§! or Industrial Engineers §G(+build speed)§!"
 ROQ_reclamation_what_ten_can_do:0 "§YTenetianen (TEN)§!: Industrial Advisors §G(+factory output)§! or Fortification Engineers §G(+fort & AA build speed)§!"
 ROQ_reclamation_what_generic_can_do:0 "§Y[THIS.GetName]§!: Military Support §G(+breakthrough)§! or Political Support §G(-consumer goods)§!"
