 # ─────────────────────────────────────────────────────────────────────────────
 # Scripted Stage Descriptions
 # ─────────────────────────────────────────────────────────────────────────────
 ROQ_reclamation_stage_1_desc:0 "§GSTAGE 1 OF ESCALATION§! - LES PROVINCES PERDUES\n§LIn a rightful reconquest, Roqualia seeks to reclaim their so-called Province Perdues, settled by Katzen colonists during the Crusade.§!\n\nThe war will §Rescalate§! if Roqualia controls its goals with over §Y50% WS§!.\nThe war will §Gend§! if Roqualia controls its goals with below §Y50% WS§!, or if it manages to reclaim everything peacefully.\nRoqualia will §3sue for peace§! if §YLutécie§! is captured."
 ROQ_reclamation_stage_2_desc:0 "§YSTAGE 2 OF ESCALATION§! - LES FRONTIERES NATURELLES\n§LRoqualia, emboldened by a successful Réclamation, seeks to secure its borders against Kaiserist threats to the south and rogue Herzland regimes to the north.§!\n\nThe war will §Rescalate§! if Roqualia controls its goals with over §Y50% WS§!.\nThe war will §Gend§! if Roqualia controls its goals with with less than §Y50% WS§!.\nRoqualia will §3sue for peace§! if §YLutécie§! is captured."
 ROQ_reclamation_stage_3_desc:0 "§OSTAGE 3 OF ESCALATION§! - LA DOMINATION CONTINENTALE\n§LWith their natural borders firmly secured, Delaparte is now pushing the Roqualians to secure the entirety of Solakea.§!\n\nThe war will §Rescalate§! if Roqualia controls its goals.\nThe war will only §Gend§! if Roqualia is §Ydefeated completely§!!"
 ROQ_reclamation_stage_4_desc:0 "§RSTAGE 4 OF ESCALATION§! - COEUR DE LA CHALLEMAGNE\n§LDelaparte has gone mad! With Solakea under his heels, the dictator is now seeking the ultimate revenge upon the perfidious Challemands, by subduing the entirety of Felinea!§!\n\nThe war will §Rescalate§! if Roqualia controls its goals.\nThe war will only §Gend§! if Roqualia is §Ydefeated completely§!!"
 ROQ_reclamation_stage_5_desc:0 "§0STAGE 5 OF ESCALATION§! - LA CROISADE UNIFICATRICE\n§LWith Solakea and Felinea crushed beneath his unstoppable legions, Delaparte has crowned himself the Double-Empereur and has vowed to crush all remaining resistance to his rule.§!\n\nThe war will §Rescalate§! if Roqualia controls its goals.\nThe war will only §Gend§! if Roqualia is §Ydefeated completely§!!"

 ROQ_reclamation_stage_inactive_desc:0 "The Reclamation is currently inactive."

