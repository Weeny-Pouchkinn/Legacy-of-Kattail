 # ─────────────────────────────────────────────────────────────────────────────
 # Event Titles, Descriptions and Options
 # ─────────────────────────────────────────────────────────────────────────────

 ROQ_reclamation.2.t:0 "Support against the Réclamation"
 ROQ_reclamation.2.desc:0 "As part of our faction's commitment to aid against the Réclamation, we should send some support to the Katzen nations currently fighting Roqualia."

 ROQ_reclamation.2.a:0 "Send Air Advisors"
 ROQ_reclamation.2.b:0 "Send Weather Manipulators"
 ROQ_reclamation.2.c:0 "Send War Councilors"
 ROQ_reclamation.2.d:0 "Send Recond Riders"
 ROQ_reclamation.2.e:0 "Send Logistics Advisors"
 ROQ_reclamation.2.f:0 "Send Construction Engineers"
 ROQ_reclamation.2.g:0 "Send Industrial Advisors"
 ROQ_reclamation.2.h:0 "Send Fortification Engineers"
 ROQ_reclamation.2.i:0 "Send Industrial Support"
 ROQ_reclamation.2.j:0 "Send Army Support"

 # Event 10: Air Advisors
 ROQ_reclamation.10.t:0 "Cloudstrider Air Advisors Arrive"
 ROQ_reclamation.10.d:0 "[FROM.GetName] has dispatched experienced air warfare advisors to our forces. Their expertise will improve the agility and responsiveness of our air wings against the Roqualian threat."
 ROQ_reclamation.10.a:0 "Our pilots will fly faster and sharper!"

 # Event 11: Weather Disruption
 ROQ_reclamation.11.t:0 "Weather Disruption Operations Begin"
 ROQ_reclamation.11.d:0 "Cloudstrider weather specialists from [FROM.GetName] have deployed covertly to create favourable conditions for our air operations. Roqualian strike craft will find the skies less cooperative than they expected."
 ROQ_reclamation.11.a:0 "Let the storm work for us!"

 # Event 12: War Advisors
 ROQ_reclamation.12.t:0 "Goatlandian War Advisors Arrive"
 ROQ_reclamation.12.d:0 "[FROM.GetName] has seconded seasoned military commanders to advise our officers. Their experience in offensive and defensive warfare will improve the fighting capability of our armies at every level."
 ROQ_reclamation.12.a:0 "With their guidance, we shall hold the line!"

 # Event 13: Recon Raiders
 ROQ_reclamation.13.t:0 "Goatlandian Recon Raiders Deployed"
 ROQ_reclamation.13.d:0 "Elite raiding units from [FROM.GetName] have been embedded with our forward divisions. Their expertise in reconnaissance and disruption operations will sharpen our breakthrough capability and battlefield coordination."
 ROQ_reclamation.13.a:0 "Strike hard and fast!"

 # Event 14: Logistical Advisors
 ROQ_reclamation.14.t:0 "Solarian Logistical Advisors Arrive"
 ROQ_reclamation.14.d:0 "[FROM.GetName] has sent logistics specialists to overhaul our supply chain. Redundancies have been identified and eliminated — our troops in the field will receive more with less."
 ROQ_reclamation.14.a:0 "Efficiency is its own kind of weapon."

 # Event 15: Industrial Engineers
 ROQ_reclamation.15.t:0 "Solarian Industrial Engineers Arrive"
 ROQ_reclamation.15.d:0 "A team of Solarian engineers from [FROM.GetName] has arrived to assist with ongoing construction projects. Their know-how should meaningfully accelerate our building programmes."
 ROQ_reclamation.15.a:0 "Factories rising faster. Good."

 # Event 16: Industrial Advisors
 ROQ_reclamation.16.t:0 "Tenetianen Industrial Advisors Arrive"
 ROQ_reclamation.16.d:0 "[FROM.GetName] has sent industrial consultants to our factories. Their methods for maximising output per worker should increase the rate at which our war industries produce equipment."
 ROQ_reclamation.16.a:0 "More guns, more shells. We will need them."

 # Event 17: Fortification Engineers
 ROQ_reclamation.17.t:0 "Tenetianen Fortification Engineers Arrive"
 ROQ_reclamation.17.d:0 "Specialists from [FROM.GetName] in the construction of bunker networks and anti-air emplacements have arrived. Our defensive lines will be reinforced far more rapidly than before."
 ROQ_reclamation.17.a:0 "Let them come against our walls!"

 # Event 18: Military Support
 ROQ_reclamation.18.t:0 "Military Support from [FROM.GetName]"
 ROQ_reclamation.18.d:0 "[FROM.GetName] has sent a package of military aid — equipment, training cadre, and advisors. While they lack the specialised expertise of some of our other supporters, their assistance still makes our forces more capable of driving through enemy lines."
 ROQ_reclamation.18.a:0 "Every ally counts."

 # Event 19: Political Support
 ROQ_reclamation.19.t:0 "Political Support from [FROM.GetName]"
 ROQ_reclamation.19.d:0 "[FROM.GetName] has leveraged its diplomatic connections to ease economic pressures on us, rallying international opinion to our cause and allowing us to redirect some of our industrial output away from consumer goods."
 ROQ_reclamation.19.a:0 "Let the world see who the true aggressors are."

 # Event 20: Faction join notification
 ROQ_reclamation.20.t:0 "Gallopia Opens Its Arms"
 ROQ_reclamation.20.d:0 "After six months of steadfast resistance against Roqualian aggression, our benefactors have honoured their commitment to the Katzen peoples. We have been welcomed into their alliance.\n\nRoqualia's war against us has become a war against them."
 ROQ_reclamation.20.a:0 "We are no longer alone!"

 # Event 30: Flusiobalkan reaction to the Reclamation beginning
 ROQ_reclamation.30.t:0 "Intelligence Report - The Réclamation"
 ROQ_reclamation.30.d:0 "Just a few days ago, Roqualia launched its Réclamation following several years of planning. While this is no real surprise, some within the Flusiobalkans have argued that it sets a worrying precedent for Roqualian irredentism. This has resulted in several nations vowing to protect the Katzen settlers against Roqualian aggression. As of now, this support is limited to advisors and very limited intervention, but there is a serious chance of these nations getting involved directly should the Katzens prove they are able to survive for long enough.\n\nThis would result in hazardous escalation of the conflict and the potential propagation of Roqualian warmongering to these nations and possibly even beyond, as Roqualian politics may shift unpredictably in the face of prolonged conflict. Therefore, if we wish to contain this conflict, it may be wise to aid Roqualia in achieving a swift victory, one way or another, as to ensure their rapid satisfaction and prevent their total mobilization. On the other hand, if we wish for an escalation, aiding the Katzens' survival may be the best choice.\n\nWith everything factored in, we estimate there is about six months before the conflict escalates dangerously. The choice to intervene or not is ours."

 ROQ_reclamation.30.a:0 "This is not our war."
 ROQ_reclamation.30.b:0 "We must play a part in this conflict."

