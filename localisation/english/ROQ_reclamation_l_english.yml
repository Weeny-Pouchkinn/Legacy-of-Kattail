 roq_reclamation_stage1_demand_land:0 "Demand Territory from [FROM.GetName]"
 roq_reclamation_stage1_demand_land_desc:0 "We will demand that [FROM.GetName] return our Province Perdues core states to us, either by negotiation or by ultimatum." 

 # ─────────────────────────────────────────────────────────────────────────────
 # Stage 1 Events
 # ─────────────────────────────────────────────────────────────────────────────
 roq_reclamation.60.t:0 "Reclaiming our Core States"
 roq_reclamation.60.d:0 "We are preparing to demand the return of our core provinces perdues states controlled by [roq_reclamation_stage1_target.GetName]. We can negotiate a generous economic partnership in exchange for the southern states, or present a stern ultimatum demanding all territory under threat of immediate war." 
 roq_reclamation.60.a:0 "Negotiate with them."
 roq_reclamation.60.b:0 "Send them an ultimatum."

 roq_reclamation.61.t:0 "Roqualian Diplomatic Delegation"
 roq_reclamation.61.d:0 "A Roqualian diplomatic delegation has just arrived in our capital. They propose a compromise for their Province Perdues: we are to return any frontier states we hold, and partake in economic integration programs with Roqualia."
 roq_reclamation.61.a:0 "Accept the proposal."
 roq_reclamation.61.b:0 "We reject their offer!"

 roq_reclamation.62.t:0 "Resettlement in the Frontiers"
 roq_reclamation.62.d:0 "It has been six months since our diplomatic deal with our neighbor. The resettlement program in the frontier states has finished, integrating our culture with their administration and bringing Roqualian populations there."
 roq_reclamation.62.a:0 "Splendid."

 roq_reclamation.63.t:0 "Diplomatic Agreement Signed"
 roq_reclamation.63.d:0 "[FROM.GetName] has accepted our proposal! The frontier states of the Province Perdue have been returned to us, and their industry is now integrated into our network."
 roq_reclamation.63.a:0 "Excellent news."

 roq_reclamation.64.t:0 "Proposal Rejected"
 roq_reclamation.64.d:0 "[FROM.GetName] has rejected our generous offer! They leave us no choice."
 roq_reclamation.64.a:0 "Then it is war!"

 roq_reclamation.65.t:0 "Roqualian Ultimatum" 
 roq_reclamation.65.d:0 "Roqualia has issued a direct and threatening ultimatum: hand over all controlled Province Perdues states to them immediately, or face the full might of the Roqualian military!"
 roq_reclamation.65.a:0 "We yield to their demands." 
 roq_reclamation.65.b:0 "We refuse to be intimidated!"

 roq_reclamation.66.t:0 "Ultimatum Accepted"
 roq_reclamation.66.d:0 "[FROM.GetName] has caved to our ultimatum and returned all our core provinces perdues states!"
 roq_reclamation.66.a:0 "They chose wisely."

 roq_reclamation.67.t:0 "Ultimatum Refused"
 roq_reclamation.67.d:0 "[FROM.GetName] has dared to refuse our ultimatum! We shall cross the border."
 roq_reclamation.67.a:0 "To war!"

