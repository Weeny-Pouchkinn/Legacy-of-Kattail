 MCF_reclamation_cloudstrider_intervention_desc:0 "The benefactors of the Katzens occupying the Province Perdues are considering direct intervention in their war with Roqualia. If they can survive long enough, they will be welcomed into their benefactor's faction and the war will escalate drastically!"

 ROQ_reclamation_cloudstrider_intervention:0 "The Reclamation Escalates"
