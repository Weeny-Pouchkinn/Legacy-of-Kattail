 ROQ_reclamation.40.t:0 "A New Strategic Course"
 #AI-Generated Placeholder, Change Later in front of it! Event description for DOM/FSR leaving their current faction after the Reclamation peace
 ROQ_reclamation.40.d:0 "With Roqualia no longer pressing the conflict, our leadership has decided to disengage from foreign bloc politics and pursue an independent path."
 #AI-Generated Placeholder, Change Later in front of it! Event option text for DOM/FSR faction withdrawal
 ROQ_reclamation.40.a:0 "We stand on our own."

 #AI-Generated Placeholder, Change Later in front of it! Event title shown to faction leaders informed of DOM/FSR departure
 ROQ_reclamation.41.t:0 "[FROM.GetName] Leaves Our Faction"
 #AI-Generated Placeholder, Change Later in front of it! Event description shown to faction leaders when DOM/FSR withdraw
 ROQ_reclamation.41.d:0 "[FROM.GetName] has formally withdrawn from our alliance in the aftermath of the Reclamation settlement."
 #AI-Generated Placeholder, Change Later in front of it! Event option text for faction-leader notification
 ROQ_reclamation.41.a:0 "Noted."

 #AI-Generated Placeholder, Change Later in front of it! News event title announcing DOM/FSR faction withdrawal
 ROQ_reclamation.42.t:0 "Flusiobalkan Realignment"
 #AI-Generated Placeholder, Change Later in front of it! News event description for DOM/FSR departure from their faction
 ROQ_reclamation.42.d:0 "In the wake of the Réclamation peace, [FROM.GetName] has withdrawn from its alliance bloc, signaling a new phase of political uncertainty across the Flusiobalkans."
 #AI-Generated Placeholder, Change Later in front of it! News event option text for global announcement
 ROQ_reclamation.42.a:0 "The balance shifts again."

