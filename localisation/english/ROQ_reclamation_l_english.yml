 ROQ_reclamation_cat:0 "La Réclamation"
 ROQ_reclamation_cat_desc:0 "Roqualia has launched the §YRéclamation§!, aiming to reconquer its lost territories, the §YProvince Perdues§!, from the Katzen settlers occupying them.\n\nWhile this seems justified, many in the Flusiobalkans see it as a concerning development. After all, much of the area used to be under Roqualian influence at one point in history. Furthermore, Roqualian irrendentism includes the lands of §YDominiontracks§! into their lost lands, despite these being historically Cloudstrider! Can one be certain that Roqualia will stop there?\n\n§YThe Katzens of the Province Perdues currently benefit from...§!\n Air Agility: §G+[?ROQ.ROQ_reclamation_air_agility_factor|%0]§!\n Air Attack: §G+[?ROQ.ROQ_reclamation_air_attack_factor|%0]§!\nAir Defence: §G+[?ROQ.ROQ_reclamation_air_defence_factor|%0]§!\nArmy Attack: §G+[?ROQ.ROQ_reclamation_army_attack_factor|%0]§!\nArmy Defence: §G+[?ROQ.ROQ_reclamation_army_defence_factor|%0]§!\nBreakthrough: §G+[?ROQ.ROQ_reclamation_breakthrough_factor|%0]§!\nCoordination: §G+[?ROQ.ROQ_reclamation_coordination_bonus|%0]§!\nSupply Use: §G[?ROQ.ROQ_reclamation_supply_consumption_factor|%0]§!\nBuild Speed: §G+[?ROQ.ROQ_reclamation_build_speed_factor|%0]§!\nFactory Output: §G+[?ROQ.ROQ_reclamation_industrial_capacity_factory|%0]§!\nFort Build Speed: §G+[?ROQ.ROQ_reclamation_production_speed_bunker_factor|%0]§!\nAA Build Speed: §G+[?ROQ.ROQ_reclamation_production_speed_anti_air_building_factor|%0]§!\nConsumer Goods Factor: §Y[?ROQ.ROQ_reclamation_consumer_goods_factor|%0]§!"

