 roq_reclamation.40.t:0 "La Croisade Unificatrice"
 roq_reclamation.40.d:0 "The Katzen Herzlands have been secured under our banner. Benjamin Delaparte looks upon the map of the world and realizes that there can be no true security or peace until all other nations submit. We declare war on the entire world!"
