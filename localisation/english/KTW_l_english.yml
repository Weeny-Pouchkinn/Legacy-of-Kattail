 KTW_assault_pyramid:0 "Assault the Pyramid"
 KTW_assault_pyramid_desc:0 "The Katown Pyramid stands alone and sealed. We can launch an assault to seize the ancient stronghold."

 KTW_collapse_tooltip:0 "Katown will §Rcollapse§! if it fails to secure the periphery in time."

 #KTW Ideas
 KTW_lockdown_spirit:0 "Pyramid Lockdown" #AI-Generated, Change Later
 KTW_lockdown_spirit_desc:0 "With the periphery lost, the Great Pyramid has sealed its gates. The garrison inside prepares for a last stand, knowing that starvation is only a matter of time. No one enters, no one leaves." #AI-Generated, Change Later
