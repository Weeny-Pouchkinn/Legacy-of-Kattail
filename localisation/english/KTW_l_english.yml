l_english:
 #KTW Events
 KTW_event.1.t:0 "The Food Crisis" #AI-Generated, Change Later
 KTW_event.1.d:0 "With the collapse of the Silbershirt state, Katown finds itself in a dire situation. The Pyramid and its immediate surroundings hold the beating heart of the oldest city in Flusion - but the megacity cannot feed itself. The vast surrounding periphery - the farmlands, supply depots, and hydroponics facilities - must be secured within six months, or Katown will starve.\n\nWe must control the states of [30.GetName], [27.GetName], [29.GetName], [42.GetName], [50.GetName], and [39.GetName] before time runs out. Send ultimatums to whoever holds them. Fail, and the Pyramid locks its gates." #AI-Generated, Change Later
 KTW_event.1.a:0 "We will secure our breadbasket!" #AI-Generated, Change Later

 KTW_event.2.t:0 "Ultimatum from Katown" #AI-Generated, Change Later
 KTW_event.2.d:0 "[FROM.GetNameDef] has sent us an ultimatum: hand over the Katown periphery states we control, or face war. They claim Katown, the ancient megacity, will starve without these lands. Their armies are mobilizing as we speak." #AI-Generated, Change Later
 KTW_event.2.a:0 "We cannot afford a war. Hand over the states." #AI-Generated, Change Later
 KTW_event.2.b:0 "They can pry it from our cold, dead paws!" #AI-Generated, Change Later

 KTW_event.3.t:0 "Katown Secured!" #AI-Generated, Change Later
 KTW_event.3.d:0 "The Katown periphery has been secured. The farmlands, supply lines, and hydroponics facilities are all under our control. The megacity can breathe - and eat - once more. The Pyramid stands tall, its future assured." #AI-Generated, Change Later
 KTW_event.3.a:0 "Katown endures." #AI-Generated, Change Later

 KTW_event.4.t:0 "White Peace with Katown" #AI-Generated, Change Later
 KTW_event.4.d:0 "Katown has secured its periphery. With armies exhausted on all sides, [FROM.GetNameDef] has offered a white peace. Given the state of our forces, we have no choice but to accept. Katown keeps its conquered lands." #AI-Generated, Change Later
 KTW_event.4.a:0 "We have no choice." #AI-Generated, Change Later

 KTW_event.5.t:0 "Katown Collapses!" #AI-Generated, Change Later
 KTW_event.5.d:0 "We have failed. The surrounding farmlands could not be secured in time. Katown, the jewel of the Herzlands, cannot sustain its massive population without them. The periphery will be distributed among our neighbors while the Pyramid itself enters total lockdown - sealing its gates and preparing for a long siege." #AI-Generated, Change Later
 KTW_event.5.a:0 "Seal the gates." #AI-Generated, Change Later

 KTW_event.6.t:0 "The Pyramid Has Fallen!" #AI-Generated, Change Later
 KTW_event.6.d:0 "Inner Katown and the Great Pyramid have been seized by enemy forces during the struggle for the periphery. With the very heart of Katown lost, there is nothing left to fight for. Katown collapses entirely and its territories are divided among the victors." #AI-Generated, Change Later
 KTW_event.6.a:0 "It is over." #AI-Generated, Change Later

 KTW_event.7.t:0 "Katown Partitioned" #AI-Generated, Change Later
 KTW_event.7.d:0 "The great megacity of Katown has been partitioned. Unable to secure the surrounding farmlands needed to feed its enormous population, the Katown Government has collapsed. The periphery states have been divided among neighboring nations, while the ancient Katown Pyramid stands alone - sealed and defiant, but slowly starving." #AI-Generated, Change Later
 KTW_event.7.a:0 "The workers' struggle continues elsewhere." #AI-Generated, Change Later
 KTW_event.7.b:0 "A weak nation devours itself." #AI-Generated, Change Later
 KTW_event.7.c:0 "A tragedy for the people of Katown." #AI-Generated, Change Later
 KTW_event.7.e:0 "The Pyramid endures, but at what cost?" #AI-Generated, Change Later
 KTW_event.7.f:0 "Noted." #AI-Generated, Change Later

