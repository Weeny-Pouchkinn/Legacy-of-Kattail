 #Ideas
 MEW_birth_of_communism:0 "Birth of Herzlands Communism"
 MEW_birth_of_communism_desc:0 "Meownich is a young state and making the people the greatest power has been a dead thought for decades under the Kaiser's heel. But the people sing for freedom and it is only right that Meownich frees the Herzland's workers."

 MEW_event.1.t:0 "Meownich Communal Republics Asks for Support!"
 MEW_event.1.d:0 "they want stuff what do we give them?"
 MEW_event.1.a:0 "Recognition will suffice."
 MEW_event.1.b:0 "Let us aid their struggle!"
 MEW_event.1.c:0 "Who cares about Katzen rabble?"

 MEW_event.2.t:0 "[FROM.GetName] Offers Recognition!"
 MEW_event.2.d:0 "The government of [FROM.GetNameDef] has officially recognized our state."
 MEW_event.2.a:0 "Cool."

 MEW_event.3.t:0 "[FROM.GetName] Sends Weaponry!"
 MEW_event.3.d:0 "The government of [FROM.GetNameDef] has officially recognized our state and sent material support."
 MEW_event.3.a:0 "Very cool."

 MEW_event.4.t:0 "[FROM.GetName] Ignores Us!"
 MEW_event.4.d:0 "The government of [FROM.GetNameDef] has not responded to us."
 MEW_event.4.a:0 "Lame."