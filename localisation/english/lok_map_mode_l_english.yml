 # Substate Type Descriptions
 substate_type_federal_desc:0 "A centralized system where power is shared between the national government and constituent states."
 substate_type_confederal_desc:0 "A decentralized association of states that retain their sovereignty while delegating specific powers to a central authority."
 substate_type_inner_mayorland_desc:0 "Inner Mayorlands are large groupings of minor Mayorlands."
 substate_type_frontier_mayorland_desc:0 "Peripheral territories given their own Mayorland."
 substate_type_noble_family_desc:0 "Feudal territories governed by noble Herzlandish families."
 substate_type_ktn_nieuw_pawsterdam_state_desc:0 "The colossal Metropolis of §3Nieuw-Pawsterdam§!, houses over thirty million souls within its city limits.\n\nDue to its size and cultural importance, the city is granted special status amongst the Commonwealth's hundreds of counties as the only member of the commonwealth to individually elect more than 15 MPs to the §4Parliament of Katteneiland§!, with around 100 MPs being elected from the city's ten boroughs.\n\nThe city also has its own influential government, with the §HMunicipal Assemby of Nieuw Pawsterdam§! often seeing voter turnouts similar to that of General Elections. The §HMayor of Nieuw-Pawsterdam§! is also considered to be the second most powerful and important elected figure within the Commonwealth, succeeded only by the Chancellor themselves"
 substate_type_ktn_commonwealth_district_desc:0 "While the §4Commonwealth of Katteneiland§! is divided into hundreds of devolved constituencies, the §HFederal Government of the Commonwealth§! established six §5administrative districts§! (with the §3Greater Municipal Authority of Nieuw Pawsterdam§! functioning as a seventh district) aimed at more efficiently enacting §Hfederal programs and policy§! across the §4Commonwealth§!.\n\nEach §5administrative district§! has a §6ceremonial capital§! located in typically the largest city of the district, these capitals only exist to centralise the district's government offices, with neither the §6ceremonial capital status§! or §5administrative district§! generating much cultural fervour in contrast to the individual counties themselves."
 substate_type_ktn_katpine_autonomous_zone_desc:0 ""
 substate_type_ktn_katpine_valley_district_desc:0 ""
 # Substate Specific Descriptions
 substate_id_desc_buffer:0 "\n\n--------------\n\n"
 substate_id_desc_210:0 "$substate_id_desc_buffer$§Y[FROM.get_substate_id_name]§! - §LThe Firemaster Union is where the Realms forge most of their equipment.§!"
 substate_id_desc_302:0 "$substate_id_desc_buffer$§LThe §5Administrative District of Miauwhattan§! is the §3Commonwealth's§! most populous district centered around the Nederkatten's second eldest city of Miauwhattan.\n\nThe district is home to a majority of the Commonwealth's heavy industry and shipbuilding capacity\n\nThe district is also home to the \"capital\" of the Commonwealth's intellectual elite of the nation at the §1Miauwhattan Institute of Science§!, who's researchers and alumni have developed some of the greatest breakthroughs in Nederkatten history in the centuries it has existed, including the infamous §RMiauwhattan Project§! that created the Nederkatten's first atomic weapon during the Kaiser's Crusade.§!"
