 lok_state_actions_recolonize_button_tooltip:0 "§YReclaim Anarchy State§! - §Y75§! £pol_power£ [GetStateActionRecolonizeStatus]\n§LBegin the process of reclaiming a state within which civilisation had collapsed.§!\nWe need to neighbor the state and its §GRadiation Level§! must be lower than §Y50§!. The process takes roughly §Y6§! months."
