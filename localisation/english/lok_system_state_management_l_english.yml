 lok_state_actions_reconstruction_button_tooltip:0 "§YEnact Reconstruction Funds§! - §Y50§! £pol_power£ [GetStateActionReconstructionStatus]\n§LChannel emergency funds into repairing damaged industry and restoring this state's economic output.§!\n§Y[?THIS.GetName]§! gains §YReconstruction Funds§! for §Y180§! days, which grants:\n    Factory Repair Speed: §G+100%§!\n    State Productivity Regeneration: §GDoubled§!" #AI-Generated Placeholder, change later!
