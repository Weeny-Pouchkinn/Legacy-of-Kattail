 lok_state_productivity_value_tooltip:0 "Current Productivity: §Y[?FROM.FROM.lok_state_productivity_value|%]§!\nBase Productivity: §Y[?FROM.lok_state_productivity_value_base|%]§!\n\n§YProductivity Change Breakdown§!\nFrom Population: §Y[?FROM.state_prod_change_from_pop|%]§!\nFrom Radiation: §Y[?FROM.state_prod_change_from_radiation|%]§!\nFrom Pollution: §Y[?FROM.state_prod_change_from_pollution|%]§!\nFrom Devastation: §Y[?FROM.state_prod_change_from_devastation|%]§!\nFrom Miscellaneous: §Y[?FROM.state_prod_change_from_misc|%]§!\nRegenerated: §Y[?FROM.state_prod_change_from_regen|%]§! (§G+0.05%§! weekly if below base)\n\n§YCurrent Effects of State Productivity§!\nState Available Factories: [?FROM.lok_state_productivity_modifier|=%+2]\nState Resources: [?FROM.lok_state_productivity_modifier|=%+2]\nState Construction Speed: [?FROM.lok_state_productivity_modifier|=%+2]\nState Local Supplies: [?FROM.lok_state_productivity_modifier|=%+2]\n\n§LProductivity represents this state's general industrial efficiency. Various factors, such as population loss, lingering radiation, and wartime destruction may lower this value.§!"
