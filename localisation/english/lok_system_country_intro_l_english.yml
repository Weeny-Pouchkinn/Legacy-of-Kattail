 LOK_country_intro_AUR:0 "regent"
 LOK_country_intro_TAK:0 "§1'La Takicardie, c'est moi!'§!\n\nThe Kingdom of Takicardie is an odd place. Once a flourishing trade port within the Roqualian monarchy, it is where a majority of the Roqualian royal family fled to upon its overthrowing in the Roqualian Revolution of 95 BKA. Now ruled by an eccentric descendant of said royal family, nearly the entire nation is concentrated in the great megacity of Charles, which is itself dedicated in every aspect to the glory of the Roi, Charles V+III=VIII+VIII=XVI.\n\nThere is no other way to describe Takicardie. Kept in power by immense inherited wealth, and conveniently spared by Roqualia as to act as 'living proof' of their former monarchy's degeneracy, life in Takicardie revolves completely around the whims and desires of Charles. Scientific progress is essentially zero, with most of the country still employing technologies from over half a century ago, while what Charles tries to pass for an 'army' is little more than an ill-equipped police force used to track petty criminals.\n\nMeanwhile, amongst the populace, literacy and wealth are intentionally kept low as to maintain the masses in a constant state of submission. To them, there is no other world beyond the great city of Charles, and worshipping the Roi is all that existence has to offer. As neither the blistering pace of Roqualian progress nor the rumble of Katzen tracks engulfing Roqualia sufficed to stir Takicardie's masses out of their apathy, things look to stay the same as they have always been.\n\nOr well, they would, were it not for a troublesome avian of Alkroan descent, known simply as 'The Mockingbird', who has been doing everything in his power to undermine the Roi's illusion of splendor. So far, his acts have been little more than annoying pranks upon the monarch, but they may just be a catalyst towards something greater. So he hopes."
 LOK_country_intro_KUS:0 "§1Stuck between a Roq and a Hard Place§!\n\nCaught between the Roqualian and Herzlandish titans, Kusnurk is a nation that was not to be, yet came to be anyways. Prior to the Crusade, the area used to be under heavy Roqualian influence, before being subtly coup'd and brought into the Katzen sphere by Kattail decades prior to the Crusade. What followed was progressive integration into the Herzlands' economic system and the area's transformation into a springboard for future Solakean conquests.\n\nWhen the Crusade began and international consequences were damned, Kusnurk was swiftly annexed into the Herzlands proper and underwent full-scale assimilation. With the Imperium collapsing a mere two decades later, a bloody and well-coordinated revolt enabled the Estalai to establish an independent government, sparing them from becoming a Katzen colonial holdout in Solakea.\n\nIn return however much of the defeated colonists departed the nation towards the Herzlands and the Freistaat, taking with them much of the nation's industrial experts and large amounts of machinery. Furthermore, the Katzens still represent significant ethnic and cultural minorities in several of the Confederation's states, while the island of Solkatzen to the north is outright a Katzen majority area seized by Kusnurk in the fervor of a perhaps over-ambitious offensive.\n\nKusnurk's situation is thus precarious, as a ruined economy, constant tensions between native Estalai and remaining Katzen settlers, and rampant extremism over disagreements for what the nation should even be challenge the Confederation's integrity at every turn.\n\nWill the Estalai manage to forge themselves a stable, democratic and most importantly independent state between two continental hegemons, or will they once again be swept up by one or the other?"
 LOK_country_intro_TAI:0 "idk"
 LOK_country_intro_mild_content:0 "WARNING! This nation has skeleton content! You will have access to a set of skeleton decisions to do things, but these are mostly intended for AI and will lack polish!"
 LOK_country_intro_no_content:0 "WARNING! This nation has no defined content! You can still play it using the generic focus tree and mechanics, but it will have no events of its own."
 LOK_country_intro_FELINEA:0 "The Katzen Herzlands is where the Imperium started and ended. It reaches from the Katsilbershirts in the north, to the Nitromethane Imperium in the south, and Krokatzia in the east. Its main geographical feature are the Katzen Mountains, bisecting the continent from the central north down to the southeast. Home to over half a billion Katzens, it can be roughly divided into four separate areas.\n\nThe §1Northern Herzlands§! are the heart of Katzen civilization and where the Katzen species originally arrived on Flusion over 3000 years ago. It is heavily industrialized, very populated and centralized around the megacity of Katown. As it was the heart of the Imperium, its inhabitants are highly jingoistic, wishing to restore the glory of the Imperium at any cost. This has unfortunately resulted in the region falling to the throes of degenerated Kaiserism and bloody fascist movements.\n\nThe §1Southern Herzlands§!, stretching from Purrlin-Lionsburg to Lionita, on the contrary, are more sparsely populated and open to the outside world, historically serving as the Katzens' interface with the rest of Flusion prior to the Imperium's conquests. Whatever wealth it has is usually derived from trade and agriculture rather than raw industrial output. Its inhabitants tend to be thrifty and open to business ventures throughout the Herzlands and beyond. Most of its industrial capacity is concentrated around the megalopolis of Purrlin-Lionsburg, while the rest is filled with vast pastures, crop fields and mining industries. To its south grows the mighty Drakwald, a gargantuan jungle spreading around the Drakwald river, constantly encroached upon by exponentially growing logging industries almost unimpeded by the Collapse. At this rate, it may very well be entirely gone within the next century.\n\nBetween the two lie the §1Central Herzlands§!, an 'in-between' lacking a distinct identity, historically dominated first by the South and then by the North as the Herzlands centralized.\n\nThe Katzens of the §1Eastern Herzlands§!, shielded behind the Katzen mountains, tend to favor more passive stances and stable monarchical governments, and, owing to their distance from Katown, are more prone to alternative ideologies, such as burgeoning communism in the vicinity of Meownich. The Katzen Mountains continue north into Zuspriland, an area once populated almost entirely by the peaceful Zuspris species, massively colonized by Katzen settlers during the Imperium and now exploited for its vast mineral wealth.\n\nThe Herzlands, once home to Flusion's greatest superpower, now lays shattered, with each of its dozen or so Katzen states convinced of being in the right. While the bloody early warlord era is long gone as small warlords have since amalgamated into something resembling proper nations, the continents struggles have likely just begone..."
 LOK_country_intro_FLUSIONEA:0 "crabs"
 LOK_country_intro_ARIVOEJO:0 "more cats"
 LOK_country_intro_SOLAKEA:0 "Unlike the monolithic Felinea, Solakea is an extremely diverse continent, both demographically and technologically.\n\nIn the north and west there lies §1Roqualia§!, the continent's greatest power and triumphant winner of the Crusade. It is a sleeping giant, having fallen back into its hedonistic slumber following victory against Katzen forces. While the Roqualians wish for nothing else than be able to play games and advance technology to play games better, their national pride is nonetheless marred by an aggravating chunk of Roqualian land still occupied by Katzen settlers in the east - known as the 'Province Perdues'\n\nEast of Roqualia, facing Felinea are the §1Flusiobalkans§!, from Kusnurk to Izwae. It is a tumultuous area of conflicting ideologies and shifting borders, the latter often caused by nomadic populations of Cloudstriders and Eto'ya moving around en-masse. Nearly entirely occupied by the Imperium and free only thanks to tireless struggle and resistance, the people of the Flusiobalkans hold their independence dear and will fight until the last to avoid a repeat of Katzen occupation.\n\nThe continent's climate and geography transitions from warm rolling hills into freezing tundras and mountains as one moves south into the sparsely populated §1Plaveta§!, now home to the expansionist Roqualian colony of Quepler, freshly established after the collapse of an expansionist Katzen colony in the same area. Its most striking artificial feature is a gigantic dam, not unlike that of Katlantropa's, built at the mouth of a large lake by the administration of said Katzen colony. The lake was since dried out, transformed into a humongous salt flat now used for relentless industrial development. While the region's climate and ecosystems have suffered harshly, the current Roqualian administration seems content with simply reaping the fruits of Katzen industrialist folly.\n\nLastly, at the southwestern tip of the continent one can find the wondrous land of §1Paluushia§!, inhabited by supersized lagomorphs blessed with wondrous elemental magic. Having almost entirely avoided the Crusade's bloodshed, the Paluushes continue to live an idyllic, unbothered lifestyle under the watchful gaze of their monarch."
 LOK_country_intro_SUNSEA:0 "shrooms"
 BK_Herzlands:0 "Legacy Of Kattail"
 BK_Herzlands_Desc:0 "The Kaiser is gone, the Herzlands are fractured. The Katzen species is trapped in an endless cycle of war and death, thousands die every day...\n\nWill the Herzlands ever be freed from this cycle and return to the world stage, or will it be sentenced to anarchy for centuries to come."
 BK_Arivoejo:0 "Land Of Dreamers"
 BK_Arivoejo_Desc:0 "Flusion is victorious, Arivoejo survived the Kaiser's onslaught by a miracle moment of unity between its inhabitants. For the first time in their history the old warring states of the island continent banded together and are stronger than ever because of it.\n\nWill this young alliance weather the coming power vacuum, or will something else arise from its ashes..."
 BK_Solakea:0 "Games of Steel and Blood"
 BK_Solakea_Desc:0 "The Challemand menace is defeated, the vile invaders now fight between each other and Roqualia has asserted itself as the superpower of Solakea. Now comes the time to rebuild what was destroyed... Or will the other minor powers of the Steel Steppes consolidate their power while the western giant is weak..."
 BK_Collapse:0 "The Great Collapse"
 BK_Collapse_Desc:0 "The Kaiser is gone, and Flusion is victorious. Yet the Imperium's carcass still rots across ten-thousand kilometers: Roqualia reel from a decade of traumatizing war in the West, the Kaiser's colonial projects yet cling to life in the East, and the Heart itself lies shattered between petty warlords vying for a sliver of Kattail's former glory."

