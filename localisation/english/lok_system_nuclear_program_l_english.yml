 lok_nuke_type_tooltip:0 "[ROOT.GetNukeTypeDesc]"
 lok_no_nuke_desc:0 "No WMDs selected."
 lok_fission_nuke_desc:0 "§8Fission Warhead§! (§Y[?ROOT.num_equipment@lok_fission_nuke_equipment]§! in stockpile)\nPopulation Casualties from Blast: §Y5%§!\nBase Emitted Radiation: §Y1§!\nMin. Unit Org & Strength Damage: §Y2.5%§!\nSoot Factor: §Y100%§!\n§LFission bombs derive their destructive force purely from fission reactions. Their yields range from a few kilotons to half a megaton and they are particularly radioactive.§!"
 lok_fusion_nuke_desc:0 "§tFusion Warhead§! (§Y[?ROOT.num_equipment@lok_fusion_nuke_equipment]§! in stockpile)\nBase Population Casualties from Blast: §Y10%§!\nBase Emitted Radiation: §Y0.75§!\nMin. Unit Org & Strength Damage: §Y5%§!\nSoot Factor: §Y200%§!\n§LFusion warheads derive their destructive force from a fusion upper stage ignited by fission reactions. Their yields range from hundreds of kilotons to dozens of megatons and they emit comparatively less fallout than fission designs for their power. The literal power of the sun at our fingertips.§!"
 lok_cobalt_nuke_desc:0 "§2Cobalt Warhead§! (§Y[?ROOT.num_equipment@lok_cobalt_nuke_equipment]§! in stockpile)\nBase Population Casualties from Blast: §Y2.5%§!\nBase Emitted Radiation: §Y10§!\nMin. Unit Org & Strength Damage: §Y3.5%§!\nSoot Factor: §Y100%§!\n§LCobalt bombs are 'salted' or 'dirty' bombs - warheads specifically designed to produce enhanced amounts of fallout and contaminate a large area with radioactive material.§!"
 lok_mondkanone_nuke_desc:0 "§1Mondkanone Impactor§! (§Y[?ROOT.num_equipment@lok_mondkanone_nuke_equipment]§! in stockpile)\nBase Population Casualties from Blast: §Y1%§!\nBase Emitted Radiation: §Y0§!\nMin. Unit Org & Strength Damage: §Y10%§!\nSoot Factor: §Y100%§!\nDoes not require §2Salvo Capacity§!\nCannot be §RIntercepted§!\nRequires control of §Y[708.GetName]§!, §Y[707.GetName]§!, §Y[709.GetName]§! and §Y[710.GetName]§!.\n§LThe Mondkanone, or Lunar Defence System, utilizes gargantuan electromagnetic rails to accelerator ultra-dense rods to incredible velocities, rendering them impossible to intercept. Upon impact, they unleash energies comparable to a fusion weapon with no radiation.§!"
 lok_sturmer_nuke_desc:0 "§OKontinentale Sturmer§! (§Y[?ROOT.num_equipment@lok_sturmer_nuke_equipment]§! in stockpile)\nBase Population Casualties from Blast: §Y10%§!\nBase Emitted Radiation: §Y0.75§!\nMin. Unit Org & Strength Damage: §Y15%§!\nSoot Factor: §Y200%§!\nIs §Y4 times less likely§! to be §RIntercepted§!\nRequires a §YRiesigerkatzenpanzer§! battalion\n§LFusion warheads derive their destructive force from a fusion upper stage ignited by fission reactions. Their yields range from hundreds of kilotons to dozens of megatons and they emit comparatively less fallout than fission designs for their power. The literal power of the sun at our fingertips.§!"
 lok_fission_nuke_equipment_0:0 "Fission Warhead"
 lok_fission_nuke_equipment_0_desc:0 "Fission bombs derive their destructive force purely from fission reactions. Their yields range from a few kilotons to half a megaton and they are particularly radioactive."
 lok_fusion_nuke_equipment_0:0 "Fusion Warhead"
 lok_fusion_nuke_equipment_0_desc:0 "Fusion warheads derive their destructive force from a fusion upper stage ignited by fission reactions. Their yields range from hundreds of kilotons to dozens of megatons and they emit comparatively less fallout than fission designs for their power. The literal power of the sun at our fingertips."
 lok_cobalt_nuke_equipment:0 "Cobalt Warhead"
 lok_cobalt_nuke_equipment_0:0 "Cobalt Warhead"
 lok_cobalt_nuke_equipment_0_desc:0 "Cobalt bombs are 'salted' or 'dirty' bombs - warheads specifically designed to produce enhanced amounts of fallout and contaminate a large area with radioactive material."
 lok_mondkanone_nuke_equipment:0 "Mondkanone Impactor"
 lok_mondkanone_nuke_equipment_0:0 "Mondkanone Impactor"
 lok_mondkanone_nuke_equipment_0_desc:0 "The Mondkanone, or Lunar Defence System, utilizes gargantuan electromagnetic rails to accelerator ultra-dense rods to incredible velocities. Upon impact, they unleash energies comparable to a fusion weapon with no radiation."
 lok_sturmer_nuke_equipment:0 "Sturmer Shot"
 lok_sturmer_nuke_equipment_0:0 "Sturmer Shot"
 lok_sturmer_nuke_equipment_0_desc:0 "An extremely heavy-duty warhead, comprised of seven megaton-scale fusion warheads intended to detonate over a comparatively small area. Anything cost in the crossfire is sure to be utterly annihilated. Its weight is such that it incorporates smaller warheads for its own propulsion."
 LOK_nukes_factories:0 "\nMilitary Factories Producing Nuclear Warheads"
