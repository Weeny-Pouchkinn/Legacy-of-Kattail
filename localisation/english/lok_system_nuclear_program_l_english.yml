 lok_nuke_stockpile_tooltip:0 "We currently have §Y[?lok_total_nuke_stockpile]§! nuclear warheads in stockpile.\n§8Fission Warheads§! - §Y[?num_equipment@lok_fission_nuke_equipment]§!\n§tFusion Warheads§! - §Y[?num_equipment@lok_fusion_nuke_equipment]§!\n§2Cobalt Warheads§! - §Y[?num_equipment@lok_cobalt_nuke_equipment]§!\n§1Mondkanone Impactors§! - §Y[?num_equipment@lok_mondkanone_nuke_equipment]§!\n§OSturmer Shots§! - §Y[?num_equipment@lok_sturmer_nuke_equipment]§!"
