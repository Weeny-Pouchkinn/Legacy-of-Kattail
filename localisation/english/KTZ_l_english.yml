l_english:
 KTZ_treaty_of_jarvalin: "Treaty of Navar"
 KTZ_treaty_of_jarvalin_desc: "Amidst rising tensions and immense international pressure following the bloody Katzen invasion of Amphibia in 60 AKA, Kaiser Kattail magnanimously agreed to sign a treaty promising partial disarmement and the halting of future conquests. While hugely divisive within the Imperium itself, it has allowed Kattail to focus on internal stability and the realisation of various megaprojects all while appeasing tensions with Sobakiland and Roqualia."
 KTZ_focusing_inwards: "Progressive Katzpakt Isolation"
 KTZ_focusing_inwards_desc: "In recent years, Kaiser Kattail has been progressively focusing the Katzpakt's nations inwards, utilizing tariffs and regulations to cut off more and more international trade in favor of domestic exchanges in an apparent quest for economic self-sustenance, while communications with the outside world are subjected to ever-increasing scrutiny. Many outside the Katzkpakt see this as little more than economic suicide and a sign of Kattail's descent into power-indulged madness, but on the inside, this reduced transparency allows for some... liberties, to be taken with the Treaty of Navar."
 KTZ_grand_expectation: "Grand Expectations"
 KTZ_grand_expectation_desc: "When Kattail first took power, he promised no less than the world to his Katzens. Nearly eight decades later, with most of his original supporters dead or decrepit, a looming economic recession due to isolation and military restrictions imposed by the Kaiser's own will, and the Imperium's rowdy eastern conquests weighing heavily upon the Herzlandish economy, millions throughout the Imperium are starting to question Kattail's plans. While these doubts are kept from escalating into revolt by a robust propaganda machine, it is undeniable that expections towards Kattail have never been higher, and it is paramount that they be met adequately..."
 KTZ_absolute_sovereignty: "Absolute Sovereignty"
 KTZ_absolute_sovereignty_desc: "Over the course of the past eighty years, and most particularly in the past two decades, the Kaiser has acted to centralize the Katzen state apparatus around himself. With a gargantuan propaganda apparatus and an utterly loyal police and military force, Kattail's word is law."

 #Decisions
 KTZ_kattail_conquests_cat:0 "Kattail's Conquests"
 KTZ_kattail_conquests_cat_desc:0 "Kattail's Imperium is a state built for one singular purpose: war. Its continued stability and prosperity thus relies on a constant influx of fresh territories, manpower and resources to fuel its ever-growing industrial and military needs. We thus must both keep on conquering and managing these conquests well lest we suffer §Rharsh consequences...§!\n\nUnder current circumstances, the Imperium has §Y[?KTZ.KTZ_kattail_conquest_timer|0]§! days left until §Rutter disaster.§!"