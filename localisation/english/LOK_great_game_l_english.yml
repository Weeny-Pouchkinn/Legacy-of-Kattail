 lok_great_game.2.t:0 "The Great Game Begins"


 lok_great_game.2.d:0 "A diplomatic contest has begun. Our actions will advance our beneficiary's interests during the coming rounds."


 lok_great_game.2.a:0 "The contest begins."


 lok_great_game.3.t:0 "Foreign Powers Contest Our Future"


 lok_great_game.3.d:0 "Foreign powers and their supporters have begun competing for influence across our territory. Connected spheres will spread between neighboring states while our administration attempts to preserve control."


 lok_great_game.3.a:0 "We will defend what remains."


 lok_great_game.4.t:0 "The Great Game Concludes"


 lok_great_game.4.d:0 "The diplomatic contest has ended. The resulting territorial settlement is now being imposed."


 lok_great_game.4.a:0 "The map has been redrawn."


 lok_great_game.5.t:0 "The Settlement Is Imposed"


 lok_great_game.5.d:0 "The diplomatic struggle over our territory has concluded. States dominated by foreign influence have been transferred according to the final settlement."


 lok_great_game.5.a:0 "We must endure the consequences."


 lok_great_game.6.t:0 "The Great Game Collapses"


 lok_great_game.6.d:0 "Changing circumstances have made the diplomatic contest impossible to continue. No further settlement will be imposed."


 lok_great_game.6.a:0 "The contest is over."
