 # Party actions
 LOK_parliament_action_concessions:0 "Political Concessions    [?lok_parliament_gui_concessions_cost|1] PP"
 LOK_parliament_action_concessions_tt:0 "§YPolitical Concessions§!\nSpend §Y1 Political Power per percentage point of seats§!, modified by §Ylok_sway_party_cost§!, to improve this party's current Opinion by §G5 percentage points§!.\nIn §YDirect Democracy§! the cost is doubled.\nCan only be used once every four weeks per party.\nCurrent cost: §Y[?lok_parliament_gui_concessions_cost|1] PP§!."
 LOK_parliament_action_bankroll:0 "Bankroll Party    [?lok_parliament_gui_bankroll_fiscal_cost|1] FC"
 LOK_parliament_action_bankroll_tt:0 "§YBankroll Party§!\nToggle ongoing state support for this party. While active, its target Opinion is increased by §G5 percentage points§!.\nFiscal Capacity usage is §Y0.1 per percentage point of seats§!. Upper Councils pay half this cost.\nNot available in Direct Democracy. All bankrolls are cancelled by elections.\nCurrent usage: §Y[?lok_parliament_gui_bankroll_fiscal_cost|1] Fiscal Capacity§!."
 LOK_parliament_action_stop_bankroll:0 "Stop Bankrolling Party"
 LOK_parliament_action_stop_bankroll_tt:0 "§YStop Bankrolling Party§!\nEnds the ongoing Fiscal Capacity expense and removes the §G+5 percentage point§! target-Opinion bonus."
 LOK_parliament_action_exclude:0 "Exclude Party    [?lok_parliament_gui_exclude_pp_cost|1] PP / -[?lok_parliament_gui_exclude_stability_cost|%1] Stability"
 LOK_parliament_action_exclude_tt:0 "§RExclude Party§!\nBan this party from political participation and proportionally redistribute its current seats among all remaining legal parties.\nPolitical Power cost: §Y5 per percentage point of seats§!.\nStability loss: §R1 percentage point per percentage point of seats§!.\nCurrent cost: §Y[?lok_parliament_gui_exclude_pp_cost|1] PP§! and §R-[?lok_parliament_gui_exclude_stability_cost|%1] Stability§!.\nCannot be used in Direct Democracy and can never target the ruling party."
 LOK_parliament_action_reincorporate:0 "Re-Incorporate Party"
 LOK_parliament_action_reincorporate_tt:0 "§YRe-Incorporate Party§!\nRestore this excluded party to legal political participation and immediately call a snap election to determine its representation.\nThe scheduled election timer is not reset.\nNot available in Direct Democracy."

