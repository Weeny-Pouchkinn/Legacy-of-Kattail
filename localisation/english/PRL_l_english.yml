 PRL_form_ussf:0 "Form the United States of Southern Felinea"
 PRL_destroy_itch:0 "End the Itchian Threat"
 PRL_great_northern_war:0 "Begin the Great Northern War"
 PRL_growlzi_gambit:0 "Growlzi's Federal Gambit"

 PRL_event.1.t:0 "Invitation to the Southern Feline League"
 PRL_event.1.d:0 "A delegation from [PRL.GetNameDef] has formally invited our nation to join their alliance, known as the Southern Feline League. Should we accept?"
 PRL_event.1.a:0 "Of course!"
 PRL_event.1.b:0 "Nein."

 PRL_event.2.t:0 "The United States of Southern Felinea"
 PRL_event.2.d:0 "Invoking the urgency of war, [PRL.GetNameDef] has proposed the centralization of the SFL into the United States of Southern Felinea. This would make us a puppet of them."
 PRL_event.2.a:0 "Of course!"
 PRL_event.2.b:0 "Nein."

 PRL_event.3.t:0 "Federalization into the United States of Felinea"
 PRL_event.3.d:0 "Growlzi Larnball has taken the leadership of the United States of Southern Felinea and believes it should be federated into the United States of Felinea. Should we accept? This would annex us!"
 PRL_event.3.a:0 "Of course!"
 PRL_event.3.b:0 "Nein."

 PRL_event.4.t:0 "Growlzi's Gambit"
 PRL_event.4.d:0 "Growlzi Larnball of Meon wants to take over and federalize the USSF. Do we let him?"
 PRL_event.4.a:0 "Growlzi forever!"
 PRL_event.4.b:0 "Nope!"

 PRL_event.5.t:0 "Formation of the Southern Feline League"
 PRL_event.5.d:0 "The [PRL.GetName] and [CAT.GetNameDef], the Herzlands’ two most prominent democracies, have today announced the formalization of pre-existing diplomatic accords into the Southern Feline League. It is to be a military and economic alliance intended to safeguard both the autonomy of the southern Herzlands and keep the flame of democracy and liberal capitalism alive and well amidst the chaos of the Collapse.\n\nAlready the two southern states are looking to expand the alliance eastwards, reportedly being in talks with the governments of [MEO.GetNameDef] and even [LIO.GetNameDef] for future accession into the alliance."
 PRL_event.5.a:0 "Most splendid."
 PRL_event.5.b:0 "The bourgeoisie bands together!"
 PRL_event.5.c:0 "Will this be enough to save them?"

 PRL_event.6.t:0 "Formation of the United States of Southern Felinea"
 PRL_event.6.d:0 "Citing the emergency of war and escalating tensions within the Herzlands [event_target:ussfleader.GetNameDef] has pressed for the partial centralization of the Southern Feline League into a new political entity known as the United States of Southern Felinea.\n\nWhile it retains the military aspects of its predecessor, this new entity is also intended to be a political union, with its member states now effectively pledging allegiance to the federal government hosted within both Lionsburg and the megacity of Meon.\n\nThe alliance has vowed to ‘defend Herzlandish democracy no matter the cost."
 PRL_event.6.a:0 "A strong union."
 PRL_event.6.b:0 "The bourgeoisie is getting desperate."
 PRL_event.6.c:0 "They will be quite tough."


 PRL_event.7.t:0 "Felinean Federalization"
 PRL_event.7.d:0 "Following a meteoric rise in popularity, Meonic politician Growlzi Lärnball has, following his accession to First President of the United States of Southern Felinea, pushed through a comprehensive agenda for the full federalization of the U.S.S.F. into a singular entity known simply as the United States of Felinea\n\nThis has been met with a mix of jubilation and anger within the Herzlands, as some view it as the most important step towards Katzen reunifications while others believe it to be little more than a play by power-hungry Growlzi erasing years of burgeoning regional identities. Nonetheless, the remaining players of the Herzlands now have to contend with a veritable titan."
 PRL_event.7.a:0 "Mirlean Bless Felinea!"
 PRL_event.7.b:0 "The bourgeoisie reveals its true colors!"
 PRL_event.7.c:0 "A formidable counterweight."

