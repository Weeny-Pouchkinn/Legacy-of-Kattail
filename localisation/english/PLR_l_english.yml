l_english:
 PLR_haven_of_paluushkind: "Haven of Paluushkind"
 PLR_haven_of_paluushkind_desc: "The Paluushes have enjoyed a prosperous, idyllic existence for millennia."
 PLR_technological_stagnation: "Technological Stagnation"
 PLR_technological_stagnation_desc: "There is almost no technological progress in the Realms. The Paluushes are content to use their Masteries to solve every problem."
 PLR_king_bunbun: "King Bunbun IV"
 PLR_king_bunbun_desc: "While technically relegated to little more than a figurehead, Bunbun IV continues to inspire Paluushes far and wide."
 PLR_paluush_masteries: "Paluush Masteries"
 PLR_paluush_masteries_desc: "The Paluush are known to possess and employ "Masteries" - the ability to magically manipulate the elements themselves. This greatly bolsters their army and industry."
