 lok_ps_share_base:0 "Private Sector Share"

 # ============================================================
 # IDEAS / MODIFIERS
 # ============================================================

 economy_laws:0 "Economy Laws"
 lok_centrally_planned_economy:0 "Centrally Planned Economy"
 lok_centrally_planned_economy_desc:0 "Nearly all major production is publicly owned and directed through binding national plans. The state can concentrate resources rapidly, but administrative mistakes affect the entire economy."
 lok_decentralized_command_economy:0 "Decentralized Command Economy"
 lok_decentralized_command_economy_desc:0 "Public enterprises remain subject to mandatory production targets, but regional governments, industrial ministries, and workplace organizations decide how those targets are fulfilled."
 lok_decentralized_planned_economy:0 "Decentralized Planned Economy"
 lok_decentralized_planned_economy_desc:0 "The government determines strategic priorities through credit controls, procurement, investment plans, and regional development programs rather than directly managing every enterprise."
 lok_cybernetic_economy:0 "Cybernetic Economy"
 lok_cybernetic_economy_desc:0 "Real-time economic data, predictive algorithms, and automated logistical systems coordinate production across the national economy."
 lok_market_socialism:0 "Market Socialism"
 lok_market_socialism_desc:0 "Enterprises operate through markets, but ownership is primarily public, municipal, cooperative, or worker-controlled. Investment remains shaped by social and political objectives."
 lok_social_market_economy:0 "Social Market Economy"
 lok_social_market_economy_desc:0 "Private enterprise operates within a strong regulatory system supported by collective bargaining, social insurance, public services, and long-term industrial coordination."
 lok_mixed_economy:0 "Mixed Economy"
 lok_mixed_economy_desc:0 "Public enterprises, regulated private firms, strategic state investment, and market competition coexist without any single institution dominating the economy."
 lok_corporatist_economy:0 "Corporatist Economy"
 lok_corporatist_economy_desc:0 "The government organizes major industries, labour organizations, financial institutions, and professional associations into officially recognized economic blocs. Private ownership continues, but production is subordinated to negotiated national objectives."
 lok_laissez_faire_economy:0 "Laissez-Faire Economy"
 lok_laissez_faire_economy_desc:0 "The government places few restrictions on ownership, investment, employment, or industrial organization. Private firms determine most production according to expected profitability."
 lok_free_market_economy:0 "Free-Market Economy"
 lok_free_market_economy_desc:0 "Production, finance, labour, and international trade are organized around open competition. The state concentrates on protecting contracts and market access rather than directing investment."
 lok_household_subsistence_economy:0 "Household Subsistence Economy"
 lok_household_subsistence_economy_desc:0 "Production is centered on households, small farms, and local exchange. This system is resilient and keeps resources close to their communities, but it cannot readily sustain modern industry or large-scale military production."
 lok_tribal_tribute_workshops:0 "Tribal Tribute and Workshops"
 lok_tribal_tribute_workshops_desc:0 "Clan leaders collect tribute in goods and labour while independent workshops supply local needs. Loose coordination permits basic infrastructure and resource development without replacing customary authority."
 lok_war_chief_requisitioning:0 "War-Chief Requisitioning"
 lok_war_chief_requisitioning_desc:0 "Chiefs and war leaders redirect tribute, workshops, and communal labour toward military priorities. The arrangement can arm a host quickly, but civilian investment and technical development suffer."
 lok_mastery_sustained_agrarianism:0 "Mastery-Sustained Agrarianism"
 lok_mastery_sustained_agrarianism_desc:0 "Paluush communities preserve an agrarian way of life through inherited masteries rather than mechanized industry. Their extraordinary abilities sustain construction, harvests, and local supply while leaving little place for conventional arms production."
 lok_tribal_economy:0 "Tribal Economy"
 lok_tribal_economy_desc:0 "Economic life is organized through households, clans, tribute, and customary obligations rather than modern institutions. This limits industrial output, large construction projects, and systematic research."

 # ============================================================
 # EVENTS
 # ============================================================

 LOK_economy_laws.1.t:0 "An Economy Without Direction"
 LOK_economy_laws.1.d:0 "Our present economic institutions no longer correspond to the principles of the government, or no coherent national economic framework exists at all. The administration must establish a compatible economy law before this contradiction becomes entrenched."
