 #Generic Tree
 KTZ_army_effort:0 "Army Effort"
 KTZ_army_effort_desc:0 "Despite the increasing possibilities of aerial and naval warfare, ground combat is still key in tomorrow's wars. With preparation, we can avoid reliving the hell of the trenches."
 KTZ_equipment_effort:0 "Equipment Effort"
 KTZ_equipment_effort_desc:0 "The limits for what equipment can be carried by infantry are constantly being pushed. We will focus on giving our troops the best tools available."
 KTZ_motorization_effort:0 "Motorization Effort"
 KTZ_motorization_effort_desc:0 "Mobility and protection are crucial to get infantry into and out of the field safely. Focusing on these developments will allow us to take action quickly."
 KTZ_doctrine_effort:0 "Doctrine Effort"
 KTZ_doctrine_effort_desc:0 "The military doctrines that defined ground combat in the Great War are outdated. We must put our greatest minds to the task of shaping the military thought of tomorrow."
 KTZ_equipment_effort_2:0 "Equipment Effort II"
 KTZ_equipment_effort_2_desc:0 "We will continue our efforts to ensure our infantry and support troops are armed with the best possible equipment of our time."
 KTZ_mechanization_effort:0 "Mechanization Effort"
 KTZ_mechanization_effort_desc:0 "Rethinking the possibilities of motorized infantry, we can push the limits of what vehicles can be constructed today."
 KTZ_doctrine_effort_2:0 "Doctrine Effort II"
 KTZ_doctrine_effort_2_desc:0 "The battlefield has changed not just in the interbellum years, but over the course of recent conflicts. We must continuously reevaluate our doctrines to reflect this."
 KTZ_equipment_effort_3:0 "Equipment Effort III"
 KTZ_equipment_effort_3_desc:0 "Instead of imitating or buying foreign equipment, we should aim to become world-leading in infantry weapons."
 KTZ_armor_effort:0 "Armor Effort"
 KTZ_armor_effort_desc:0 "Applying what we have learned from mechanizing our infantry, we can improve our armored vehicles as well."
 KTZ_special_forces:0 "Special Forces"
 KTZ_special_forces_desc:0 "We have need of elite forces; mountain troops and paratroopers should be our priority."
 KTZ_aviation_effort:0 "Aviation Effort"
 KTZ_aviation_effort_tt:0 "Not enough building slots for §YAir Base§!"
 KTZ_aviation_effort_desc:0 "Nowhere is technological advances more rapid than in aerial warfare. Aviation is a field any modern nation must master."
 KTZ_fighter_focus:0 "Fighter Focus"
 KTZ_fighter_focus_desc:0 "We have not seen that last of dogfights in the Great War. Keeping ahead in the development of fighter planes will give us an edge in the future."
 KTZ_bomber_focus:0 "Bomber Focus"
 KTZ_bomber_focus_desc:0 "When people of the future speak of the horror to today's wars, fire raining from the skies will prominently feature. We will do our best to ensure those stories are told by our enemies."
 KTZ_aviation_effort_2:0 "Aviation Effort II"
 KTZ_aviation_effort_2_desc:0 "Further advances in aviation will be necessary to integrate our air force well with other branches of the military."
 KTZ_CAS_effort:0 "CAS Effort"
 KTZ_CAS_effort_desc:0 "A modern army needs support from vehicles not only on the ground, but also in the air."
 KTZ_rocket_effort:0 "Rocket Effort"
 KTZ_rocket_effort_desc:0 "Rocket and jet engines allow for unprecedented speeds for unmanned and manned vessels alike. Pioneering these technologies will allow us to take the enemy by surprise."
 KTZ_NAV_effort:0 "NAV Effort"
 KTZ_NAV_effort_desc:0 "Just as the new naval warfare takes place in part beneath the water's surface, part of it takes place in the air above the waters."
 KTZ_naval_effort:0 "Naval Effort"
 KTZ_naval_effort_tt:0 "Not enough building slots for §YNaval Dockyards§!"
 KTZ_naval_effort_desc:0 "The expansion of our navy should be our first priority. Assign all available resources to new Dockyards and research into light surface ships."
 KTZ_flexible_navy:0 "Flexible Navy"
 KTZ_flexible_navy_desc:0 "Reinventing naval warfare to account for the advances in submarine technology will allow us to strike efficiently against enemy convoys."
 KTZ_large_navy:0 "Large Navy"
 KTZ_large_navy_desc:0 "Adapting our naval doctrines to accommodate large ships and ensuring the safety of our trade convoys will teach us much about what sort of ships we need."
 KTZ_submarine_effort:0 "Submarine Effort"
 KTZ_submarine_effort_desc:0 "Submarine warfare is the most exciting naval development since the invention of the torpedo boat. We would do well to not just protect against submarines, but also use them against enemy shipping."
 KTZ_cruiser_effort:0 "Cruiser Effort"
 KTZ_cruiser_effort_desc:0 "Before making forays into advanced battleship research, the smaller cruisers are in need of replacement."
 KTZ_destroyer_effort:0 "Destroyer Effort"
 KTZ_destroyer_effort_desc:0 "Studying the design and strategic use of submarines, we have also learned how to counter those strategies. Destroyers will be crucial for this."
 KTZ_capital_ships_effort:0 "Capital Ship Effort"
 KTZ_capital_ships_effort_desc:0 "The nation with the most battleships will rule the oceans. Battleships and carriers represent the old and the new in naval superiority."
 KTZ_industrial_effort:0 "Industrial Effort"
 KTZ_industrial_effort_desc:0 "Focus all our political efforts on building up the civilian industry in a great leap forward."
 KTZ_industrial_effort_2:0 "Industrial Effort II"
 KTZ_industrial_effort_2_desc:0 "With iron will and a relentless work ethic, we can mobilize the people in another great industrial effort."
 KTZ_construction_effort:0 "Construction Effort"
 KTZ_construction_effort_tt:0 "Not enough building slots for §YCivilian Factories§!"
 KTZ_construction_effort_desc:0 "Civilian industrial capacity must not be underestimated even when war looms over the world."
 KTZ_production_effort:0 "Armament Effort"
 KTZ_production_effort_tt:0 "Not enough building slots for §YMilitary Factory§!"
 KTZ_production_effort_desc:0 "If you can build tractors, you can build tanks! We must not allow our military production capacity to lag behind."
 KTZ_construction_effort_2:0 "Construction Effort II"
 KTZ_construction_effort_2_desc:0 "Continuing to expand our factories will allow us to speed up production of goods for trade and further construction efforts."
 KTZ_production_effort_2:0 "Armament Effort II"
 KTZ_production_effort_2_desc:0 "Trying to adapt civilian factories to produce military equipment is inefficient. We should focus on preparing military production now."
 KTZ_production_effort_3:0 "Armament Effort III"
 KTZ_production_effort_3_desc:0 "Continued efforts to expand our military factories are necessary to meet the demands for new equipment."
 KTZ_infrastructure_effort:0 "Infrastructure Effort"
 KTZ_infrastructure_effort_desc:0 "A country without proper infrastructure cannot pursue advanced projects or constructions."
 KTZ_infrastructure_effort_tt:0 "Not enough building slots for §YInfrastructure§!"
 KTZ_synth_oil_effort_tt:0 "Not enough building slots for §YSynthetic Refinery§!"
 KTZ_infrastructure_effort_2:0 "Infrastructure Effort II"
 KTZ_infrastructure_effort_2_desc:0 "Extending our infrastructure further will enable the transports and communications necessary for high-tech clandestine projects."
 KTZ_construction_effort_3:0 "Construction Effort III"
 KTZ_construction_effort_3_desc:0 "Expansion of our infrastructure network has significantly improved our capacity for construction."
 KTZ_nuclear_effort:0 "Nuclear Effort"
 KTZ_nuclear_effort_desc:0 "Standing on the edge of a world-changing discovery, we cannot let others light the fire that may one day consume the Earth."
 KTZ_extra_tech_slot:0 "Extra Research Slot"
 KTZ_extra_tech_slot_desc:0 "Our industrial expansion and other recent advances might allow us to conduct more R&D in parallel."
 KTZ_extra_tech_slot_2:0 "Extra Research Slot II"
 KTZ_extra_tech_slot_2_desc:0 "The rapid industrialization of our nation has opened up new opportunities in R&D that we should pursue."
 KTZ_technology_sharing:0 "Technology Sharing"
 KTZ_technology_sharing_desc:0 "By sharing technological advances with our allies, our whole faction will be able to conduct wartime R&D more efficiently."
 KTZ_secret_weapons:0 "Secret Weapons"
 KTZ_secret_weapons_desc:0 "It is tempting to expend all extra resources into developing tanks and planes, but the secret to winning wars lies in whole new fields of science; electronics, rocketry and nuclear research."
 KTZ_political_effort:0 "Political Effort"
 KTZ_political_effort_desc:0 "To bring about change in the world, we need to be able to bring about change in our own country. Strengthening our political position should come first."
 KTZ_collectivist_ethos:0 "Collectivist Ethos"
 KTZ_collectivist_ethos_desc:0 "Our enemies may divide and conquer lesser nations, but our people will stand united. All for one and one for all."
 KTZ_liberty_ethos:0 "Liberty Ethos"
 KTZ_liberty_ethos_desc:0 "In this time of ideological fanatics who seek to suffocate the human spirit, we will safeguard individual liberties and freedom."
 KTZ_militarism:0 "Militarism"
 KTZ_militarism_desc:0 "Those who view the military as a necessary evil are doomed to hesitate in the face of war. We will ingrain militarism into our culture to become a people of soldiers."
 KTZ_political_correctness:0 "Political Correctness"
 KTZ_political_correctness_desc:0 "People holding mildly controversial or otherwise embarrassing opinions appear to be concerned that there is a wide-reaching conspiracy against them. This seems like an excellent idea."
 KTZ_neutrality_focus:0 "Neutrality Focus"
 KTZ_neutrality_focus_desc:0 "While others may claim it takes bravery and wisdom to take sides in a global conflict, we know it takes more to refuse."
 KTZ_interventionism_focus:0 "Interventionism Focus"
 KTZ_interventionism_focus_desc:0 "We value the freedom of all people, not only our own citizens. If preventing tyranny means war, then so be it."
 KTZ_military_youth:0 "Military Youth"
 KTZ_military_youth_desc:0 "Organizations to promote discipline and political education of young people in our nation will foster loyalty and self-sacrifice early."
 KTZ_deterrence:0 "Deterrence"
 KTZ_deterrence_desc:0 "Standing alone, we rarely benefit from war. Fortunately, we know that the best defense is one so well-known you never have to put it to use."
 KTZ_volunteer_corps:0 "Volunteer Corps"
 KTZ_volunteer_corps_desc:0 "Forcing our people to die for ideals of freedom would be an exercise in irony, but establishing means for those who wish to aid people abroad is not."
 KTZ_paramilitarism:0 "Paramilitarism"
 KTZ_paramilitarism_desc:0 "Military principles have applications outside of the military. With the development of semi-militarized units to complement our armed forces, more people will have military training."
 KTZ_indoctrination_focus:0 "Indoctrination"
 KTZ_indoctrination_focus_desc:0 "Having established our ideology as based on the truth, it may be taught as truth. Education and media must reflect this lesson."
 KTZ_foreign_expeditions:0 "Foreign Expeditions"
 KTZ_foreign_expeditions_desc:0 "With our enemies prepared to intervene in distant conflicts on behalf of their ideals, we must be ready to do the same for ours."
 KTZ_why_we_fight:0 "Why We Fight"
 KTZ_why_we_fight_effect:0 "If we don't have the §YNeutral Foreign Policy§! spirit we will be able to create factions.\n"
 KTZ_why_we_fight_desc:0 "The world is growing increasingly unsafe. Our people need to see the atrocities being committed by those who crave power. It is time we rally the people to our cause and ensure everyone is ready to fight for our freedom."
 KTZ_political_commissars:0 "Political Commissars"
 KTZ_political_commissars_desc:0 "To ensure that our policies are followed in military practice, we will introduce politically appointed officials into military ranks."
 KTZ_internationalism_focus:0 "Internationalism Focus"
 KTZ_internationalism_focus_desc:0 "Ideology knows no borders. Another nation may call itself sovereign, but our convictions are above such claims."
 KTZ_nationalism_focus:0 "Nationalism Focus"
 KTZ_nationalism_focus_desc:0 "Our nation is unique, and our political achievements could only have happened here. We must fight for it at any cost."
 KTZ_ideological_fanaticism:0 "Ideological Fanaticism"
 KTZ_ideological_fanaticism_desc:0 "Our politically established values and goals are worth dying for as much as any ancient faith. Any follower should be prepared to face death, and those who stray better be prepared to face death."
 KTZ_air_innovation:0 "Air Innovations"
 KTZ_air_innovation_desc:0 "Modern wars cannot be won without dominating the skies. We must do everything in our power to develop the air force!"
 KTZ_air_innovation_2:0 "Air Innovations II"
 KTZ_air_innovation_2_desc:0 "Every advantage we can gain in the skies is precious. We should focus all of our efforts on developing our fighters."
 KTZ_naval_air_effort:0 "Naval Air Effort"
 KTZ_naval_air_effort_desc:0 "The efficacy of air strikes against naval targets was demonstrated by the Americans already back in 1921. We should not neglect this branch of the Air Force if we intend to wage war on a naval power."

 #State Actions
 lok_state_actions_recolonize_button_tooltip:0 "§YReclaim Anarchy State§! - §Y75§! £pol_power£ [GetStateActionRecolonizeStatus]\n§LBegin the process of reclaiming a state within which civilisation had collapsed.§!\nWe need to neighbor the state and its §GRadiation Level§! must be lower than §Y50§!. The process takes roughly §Y6§! months."

 lok_state_actions_recolonize_status:0 "\n§GActive§!, §Y[?state_actions_recolonize_weeks_left]§! weeks left"

 lok_state_actions_stimulus_button_tooltip:0 "§YEnact Construction Subsidies§! - §Y50§! £pol_power£ [GetStateActionStimulusStatus]\n§LSend monetary support to this state's construction sector, bolstering construction speed.§!\n§Y[?THIS.GetName]§! gains §YConstruction Subsidies§! for §Y180§! days, which grants:\n    Local Construction Speed: §G+15%§!"
 lok_state_actions_stimulus_modifier:0 "Construction Subsidies"
 lok_state_actions_stimulus_status:0 "\n§GActive§!"

 #Special States
 anarchy_desc_loc:0 "§LFor one reason or another, civilization's embrace has abandoned these forlorn lands. Where great cities and nations once stood, there are now little more than sparse tribal communities clinging to existence in hopes that normalcy may one day return.§!\n\nThis is an §Ranarchic§! state where civilization has completely collapsed. There is thus no government to interact or trade with, and it cannot be declared war against. Over time, buildings left in such areas will inevitably become more and more damaged as they decay from neglect.\n\nWe can however attempt to §Yreclaim§! these territories assuming they are habitable enough using the §YState Actions§! menu. On the other hand, if these lands are left alone for long enough, new §YWarlord States§! may emerge out of them in an attempt to recover what was lost."

 unowned_desc_loc:0 "§LMyriads of nations, big and small, sometimes vying with one another in petty power struggles, other times collaborating to build something greater than themselves, but always doing what they think is right for themselves and the world. Regardless, their time to shine has not yet come.§!"

 water_desc_loc:0 "§LVast tracts of land once caressed by Jublio's warmth now lie beneath the waves, their former inhabitants long since drowned. The sea is a cruel mistress, and she has once more reclaimed these lands as her own.§!"

 is_controlled_by_ROOT_or_subject:0 "Controlled by §H[ROOT.GetName]§! or a §Hpuppet§!."

 #Bookmarks
 BK_Herzlands:0 "Legacy Of Kattail"
 BK_Herzlands_Desc:0 "The Kaiser is gone, the Herzlands are fractured. The Katzen species is trapped in an endless cycle of war and death, thousands die every day...\n\nWill the Herzlands ever be freed from this cycle and return to the world stage, or will it be sentenced to anarchy for centuries to come."
 BK_Arivoejo:0 "Land Of Dreamers"
 BK_Arivoejo_Desc:0 "Flusion is victorious, Arivoejo survived the Kaiser's onslaught by a miracle moment of unity between its inhabitants. For the first time in their history the old warring states of the island continent banded together and are stronger than ever because of it.\n\nWill this young alliance weather the coming power vacuum, or will something else arise from its ashes..."
 BK_Solakea:0 "Games of Steel and Blood"
 BK_Solakea_Desc:0 "The Challemand menace is defeated, the vile invaders now fight between each other and Roqualia has asserted itself as the superpower of Solakea. Now comes the time to rebuild what was destroyed... Or will the other minor powers of the Steel Steppes consolidate their power while the western giant is weak..."

 BK_Crusade:0 "The Great Crusade"
 BK_Crusade_Desc:0 "Billions throughout Flusion sit in apprehension. While the feline sovereign agreed to a partial disarmament treaty following his swift takeover of Amphibia, many are beginning to question the Katzens' ultimate motives."

