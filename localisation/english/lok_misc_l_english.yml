 lok_soot_tracker_tooltip:0 "Sunlight Blocked by Soot: §Y[?global.lok_nuclear_soot_perc_raw|2]%§!\nPlanetary Food Production from Soot: §R-[?global.lok_nuclear_soot_perc_raw|2]%§!\nWeekly Soot Decay: §Y[?global.lok_nuclear_soot_perc_weekly_decay]%§!\n\nNuclear exchanges are not without consequences: if cities are targeted, the fireballs and heat waves trigger raging §Hfirestorms§! burning their way across metropolitan areas, releasing immense quantities of §Ysoot§! into the upper atmosphere. This §Ysoot§! then blocks sunlight from reaching the surface, causing devastating effects to agriculture - a §Ynuclear winter§!. These effects do not apply to food produced by §Yhydroponics farms§! or on §Yother planets§!."
