 lok_state_productivity_value_text:0 "[GetStateProductivityValueColor][?population_relative_to_game_start|%]§!"
 lok_state_productivity_value_tooltip:0 "§LIf a state's population changes over time, various aspects of its productivity will be impacted. This scales directly with the ratio of current population to its original population in §Y100 AKA§!, with a difference of §Y1%§! yielding a modifier of §Y0.5%§!, capping at §R-75%§! and §G+25%§!.§!\n\n[THIS.GetName]'s population is [GetStateProductivityValueColor][?population_relative_to_game_start|%]§! of what it was in §Y100 AKA§!, that being §Y[?population_at_game_start|0]k§!, with §Y[?lok_state_deaths|0]k§! people having died prematurely. If this value falls below §R5%§!, then this state will §Rcollapse into anarchy§!.\n\n§YProductivity Modifier from Population§!\nState Available Factories: [?lok_state_productivity_modifier|=%+2]\nState Resources: [?lok_state_productivity_modifier|=%+2]\nState Construction Speed: [?lok_state_productivity_modifier|=%+2]\nState Local Supplies: [?lok_state_productivity_modifier|=%+2]"
