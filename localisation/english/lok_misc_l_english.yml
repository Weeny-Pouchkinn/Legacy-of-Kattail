 lok_no_nuke_desc:0 "No WMDs selected."
 
 lok_fission_nuke_desc:0 "§8Fission Warhead§! (§Y[?ROOT.num_equipment@lok_fission_nuke_equipment]§! in stockpile)\nPopulation Casualties from Blast: §Y5%§!\nBase Emitted Radiation: §Y1§!\nMin. Unit Org & Strength Damage: §Y2.5%§!\nSoot Factor: §Y100%§!\n§LFission bombs derive their destructive force purely from fission reactions. Their yields range from a few kilotons to half a megaton and they are particularly radioactive.§!"

 lok_fusion_nuke_desc:0 "§tFusion Warhead§! (§Y[?ROOT.num_equipment@lok_fusion_nuke_equipment]§! in stockpile)\nBase Population Casualties from Blast: §Y10%§!\nBase Emitted Radiation: §Y0.75§!\nMin. Unit Org & Strength Damage: §Y5%§!\nSoot Factor: §Y200%§!\n§LFusion warheads derive their destructive force from a fusion upper stage ignited by fission reactions. Their yields range from hundreds of kilotons to dozens of megatons and they emit comparatively less fallout than fission designs for their power. The literal power of the sun at our fingertips.§!"

 lok_cobalt_nuke_desc:0 "§2Cobalt Warhead§! (§Y[?ROOT.num_equipment@lok_cobalt_nuke_equipment]§! in stockpile)\nBase Population Casualties from Blast: §Y2.5%§!\nBase Emitted Radiation: §Y10§!\nMin. Unit Org & Strength Damage: §Y3.5%§!\nSoot Factor: §Y100%§!\n§LCobalt bombs are 'salted' or 'dirty' bombs - warheads specifically designed to produce enhanced amounts of fallout and contaminate a large area with radioactive material.§!"

