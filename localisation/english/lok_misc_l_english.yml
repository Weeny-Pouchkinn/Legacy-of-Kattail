 lok_herzlands.1.t:0 "Herzland Warlords Look Outwards"
 lok_herzlands.1.d:0 "With the Herzlanders slowly yet surely mending the scars of the Collapse, many Herzlands warlords state have began to look towards the rest of the Herzlands. Those who harbor ambitions of regional or even total Katzen unification may soon take action to fulfill their goals."
 lok_herzlands.1.a:0 "Acknowledged."
 lok_herzlands.1.a.tt:0 "Every $herzlands_warlord_hegemon_title$ and $herzlands_warlord_uniter_title$ gains §YClaims§! on the §Yentire Herzlands§!.\nEvery $herzlands_warlord_regionalist_title$ gains §YClaims§! on their §Yneighbors§!."