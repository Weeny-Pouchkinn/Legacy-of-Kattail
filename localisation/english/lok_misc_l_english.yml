 LOK_tutorial.10.t:0 "Legacy of Kattail Credits"
 LOK_tutorial.10.d:0 "Many people have contributed, one way or another, to this mod. All assets created by third-party individuals, companies or franchises belong to their respective owners! If you are the author of one of these assets, and wish to see it changed or removed, please contact Elowiny on Discord.\n\n§1Elowiny§! - Head Coder\n§1decentnamehere§! - Major coder\n§1Equestria at War Team§! - Numerous icons for technologies, general coding help.\n§1Wilzy§! - 'Stellaquis' Main Menu theme.\n§1SnipsTheFox§! - Katzen & Sobaki models\n§1Pax Britannica§! - Mech Models\n§1Extended Tech Tree§! - Equipment & Tech icons\n§1Allan DF on Twitter§! - Herald of the Kaiser Portrait\n§1cracker542 on Sketchfab§! - Superheavy Mech model.\n§1dafid25§! - Numerous Katzen-related focus icons.\n§1kova§! - Casualties in states mechanic\n§1gardendreamers§! - Various art, playtesting.\n§1Revan§! - Jean de Kat de Tailssigny & Hans Ennauig character portraits.\n§1cxg2827§! - Nuclear Salt Water Rocket icon\n§1Globvs§! - GFX from Ultimate-HOI4-GFX \n§1Helldivers§! - Assault Railgun Icon\n§1Starcraft II§! - Firepower Platform Icon\n§1Avatar§! - Transport Gunship Icon\n§1Fallout§! - Early Power Armor Icon"

 LOK_tutorial.10.a:0 "Thanks everyone! It is time to enjoy your work..."
 LOK_tutorial.10.b:0 "Bring me to the Tutorial."
 LOK_tutorial.10.c:0 "Return to Welcome screen."

 LOK_tutorial.1.t:0 "Welcome to Legacy of Kattail!"
 LOK_tutorial.1.d:0 "blah blah"
 LOK_tutorial.1.a:0 "Got it! Let us begin."
 LOK_tutorial.1.b:0 "Open the Tutorial"
 LOK_tutorial.1.c:0 "View Mod Credits"

 LOK_tutorial.2.t:0 "Summary"
 LOK_tutorial.2.d:0 "Legacy of Kattail features a variety of mechanics.\n\n§1POPULATION§!\nUnlike in vanilla, the potential decline of population due to war, famine or bombardment is simulated. Various events can decrease a state's population, which will in turn decrease the amount of resources and factories the state possesses, proportional to the decline relative to the start of the game (100 AKA). The total deaths in a state, nation and globally can be viewed next to the little skull icons on the state and country UIs.\n\n§1CORING§!\nLike in vanilla, states can't always be cored. However, either via focus, decisions or at game start, a given nation can acquire an array of 'Coreable States', each of which has a given Coring Compliance Threshold. Once this threshold is reached, the state will automatically be cored. Various effects will either make a state coreable, or lower the threshold by a certain value. All nations in the Herzlands can core the entire Herzlands, with the Coring Compliance Threshold starting at 80%.\n\n§1SPECIES§!\nEvery state is inhabited by a given Species, and potentially a Minority as well. This can provide various effects to the state, such as increasing the build speed of a given building, reducing casualties from nuclear bombs, or consuming more food. Minorities do not provide such effects. Nations also have a set of species (potentially multiple), which provide global national buffs. If a state's species or minority matches that of the nation that controls it, Compliance will grow faster.\n\n§1ATTRIBUTES§!\nIn addition to species, most nations have some form of permanent 'national attributes' which provide a variety of effects. This can for example translate to a permanent Ahead-of-Time reduction for a specific tech category."
 LOK_tutorial.2.a:0 "Tell me about §GFood§! and §HPower§!."
 LOK_tutorial.2.b:0 "Return to the Welcome screen."
 LOK_tutorial.gotit:0 "Got it! Let us begin."

 LOK_tutorial.3.t:0 "Food, Power, Resources"
 LOK_tutorial.3.d:0 "§1FOOD§!\nPopulation needs food to survive, produced as a resource like the others. On average, one hundred thousand people will consume one unit of food. If their needs are not met, the country will start suffering debuffs. If these needs are less than 60% met, then the nation's population will begin to decline rapidly! To remediate this, food can be imported via the trade menu, produced using the Hydroponics Farm building, or stockpiled using the Food Silo building. The current food status, and its storage can be viewed on the topbar, or in the decisions screen.\n\n§1POWER§!\nMuch like in vanilla, factories need power to run. But rather than being provided by Coal, power is outright produced as a resource by various power plant buildings, which can be constructed anywhere and take up building slots. Some of these will consume resources to do so: the Fossil Fuel Power Plant requires Fossil Fuels (identical to Oil from vanilla), and the Fission Power Plant requires Fissiles. It can also be imported and exported.\n\n§1FISSILES & SUPERTENSILES§!\nFissiles are a new, somewhat rare resource, used to power nuclear reactors, and fabricate WMDs or nuclear-powered equipment. Supertensiles, on the other hand, are almost entirely artificial, being produced by late-game buildings, and required by very advanced equipment."
 LOK_tutorial.3.a:0 "Tell me about §ONuclear Warfare§!."
 LOK_tutorial.3.b:0 "Go back to the §HSummary§!."

 LOK_tutorial.4.t:0 "Nuclear Warfare"
 LOK_tutorial.4.d:0 "Nuclear warfare in Legacy of Kattail is §Rextremely hazardous§!, potentially devastating both nations if undertaken carelessly.\n\n§1WMD PRODUCTION AND TYPES§!\nRather than being produced by nuclear power plants, the various types of WMDs must be produced using Military Factories, at a high production cost. There are multiple types of WMDs, which can be unlocked via tech and provide different effects.\n\n§1FIRING (Bottom Left of State UI)§!\nWMDs can be fired at a given state using the missile button at the bottom left of the state UI. We must, of course, be at war with the state's controller. The button also allows selecting a type of WMD, and the amount which is to be sent at once.\n\n§1SALVO CAPACITY (Top Bar)§!\nFiring WMDs requires 'salvo capacity', representing the amount of missiles available to mount warheads onto. It can be viewed on the top-bar. This can be increased by building ICBM Silos and Nuclear Submarines. Firing one WMD will consume one Salvo Capacity, which will be restored a week later. Beware! ICBM Silos can be destroyed by nuclear strikes, which may cripple one's Salvo Capacity and impede a counter-strike. Hence, striking silos first in a nuclear war is likely wise.\n\n§1RADIATION (Bottom right of State UI)§!\nDepending on the type of WMD, nuclear strikes will generate a given amount of radiation onto a state. Radiation will severely degrade the state's productive potential and rapidly kill population. It will also spread beyond its original state, potentially into other nations, including the one which fired the missiles to begin with. Fortunately, it decays relatively rapidly, the radiation from a regular strike usually dissipating within a month or so.\n\n§1INTERCEPTION (Building)§!\nIt is possible to construct the Anti-ICBM Network building (unlocked in the Artillery tree), which, depending on its level, will stop a number of nuclear warheads and potentially reduce casualties. It will function even if damaged.\n\n§1SOOT (Top Bar)§!\nFiring nuclear warheads will generate Soot, representing ash and debris flung into the atmosphere by the shockwave and ensuing firestorms. Rising soot levels then translate into a §RGLOBAL REDUCTION§! of all food production on Flusion, potentially impacting the entire world. States with a higher State Category, such as cities, will produce more soot upon being nuked. Soot will then slowly decay on its own."
 LOK_tutorial.4.a:0 "Tell me about §1Space§!."
 LOK_tutorial.4.b:0 "Go back to §GFood§! and §HPower§!."

 LOK_tutorial.5.t:0 "Space"
 LOK_tutorial.5.d:0 "You have likely noticed that Flusion's moons, Xenon and Muno, are visible above the map. They can be explored and colonized using a dedicated space exploration system in the decisions tab.\n\n§1ROCKETS AND ORBITAL LOGISTICS CAPACITY§!\nThe key to space exploration is Orbital Logistics Capacity, which represents a nation's general ability to haul stuff into and around space. It is accrued by building rockets using Military Factories, which can be researched from the Space tab in the tech view. Simply having a rocket in storage is enough to benefit from its Orbital Logistics Capacity, they do not need to be 'deployed'.\n\n§1MISSIONS AND EXPERIENCE§!\nMissions to various celestial bodies can be undertaken from a dedicated decision tab. Each mission has a difficulty, and completing them will accrue Experience, both general 'Space Experience' and dedicated experience for the targeted celestial body. Having higher experience against a mission's difficulty will increase the odds of success. All missions also cost some amount of Orbital Logistics Capacity for a set amount of time, which will require you to have sufficient rockets in storage to provide said capacity. Non-reusable rockets can only provide their capacity once, while reusable ones are able to provide it forever, making it essentially necessary to invest into reusable rockets for longer, costlier missions. Completing a mission for the first time will grant extra political power, and being the first to complete it ever will bring even more.\n\n§1SURVEYING AND COLONIZATION§!\nThe states on Xenon and Muno need to be first surveyed using a decision before they can be colonized, using another decision. Once a colony is established, it will have a set Orbital Logistics Cost of maintenance, and can be upgraded using yet another decision, which will increase its maintenance but grand extra building slots and supply. If we ever run out of Orbital Logistics Capacity, then our colonies will rapidly degrade, losing levels until they are destroyed. As space colonies are part of their nation, they can be brought into war and invaded like any other. Troops can thus be ferried from our capital to any space state, and back to our capital using decisions."
 LOK_tutorial.5.b:0 "Go back to §ONuclear Warfare§!."

 LOK_country_intro.1.t:0 "Nation Intro: [ROOT.GetName]"
 LOK_country_intro.1.d:0 "[GetNationIntroDesc]"
 LOK_country_intro.1.a:0 "Got it! Now, let's start."
 LOK_country_intro.1.b:0 "Tell me about [ROOT.GetNameDef]'s geographical area."
 LOK_country_intro.1.c:0 "Bring me back to the Welcome screen."

 LOK_country_intro_AUR:0 "regent"
 LOK_country_intro_TAK:0 "§1'La Takicardie, c'est moi!'§!\n\nThe Kingdom of Takicardie is an odd place. Once a flourishing trade port within the Roqualian monarchy, it is where a majority of the Roqualian royal family fled to upon its overthrowing in the Roqualian Revolution of 95 BKA. Now ruled by an eccentric descendant of said royal family, nearly the entire nation is concentrated in the great megacity of Charles, which is itself dedicated in every aspect to the glory of the Roi, Charles V+III=VIII+VIII=XVI.\n\nThere is no other way to describe Takicardie. Kept in power by immense inherited wealth, and conveniently spared by Roqualia as to act as 'living proof' of their former monarchy's degeneracy, life in Takicardie revolves completely around the whims and desires of Charles. Scientific progress is essentially zero, with most of the country still employing technologies from over half a century ago, while what Charles tries to pass for an 'army' is little more than an ill-equipped police force used to track petty criminals.\n\nMeanwhile, amongst the populace, literacy and wealth are intentionally kept low as to maintain the masses in a constant state of submission. To them, there is no other world beyond the great city of Charles, and worshipping the Roi is all that existence has to offer. As neither the blistering pace of Roqualian progress nor the rumble of Katzen tracks engulfing Roqualia sufficed to stir Takicardie's masses out of their apathy, things look to stay the same as they have always been.\n\nOr well, they would, were it not for a troublesome avian of Alkroan descent, known simply as 'The Mockingbird', who has been doing everything in his power to undermine the Roi's illusion of splendor. So far, his acts have been little more than annoying pranks upon the monarch, but they may just be a catalyst towards something greater. So he hopes."
 LOK_country_intro_TAI:0 "idk"
 LOK_country_intro_mild_content:0 "WARNING! This nation has skeleton content! You will have access to a set of skeleton decisions to do things, but these are mostly intended for AI and will lack polish!"
 LOK_country_intro_no_content:0 "WARNING! This nation has no defined content! You can still play it using the generic focus tree and mechanics, but it will have no events of its own."

 LOK_country_intro.2.t:0 "Geographical Data: [GetGeographicalDataTitle]"
 LOK_country_intro.2.d:0 "[GetGeographicalDataDesc]"
 LOK_country_intro_FELINEA:0 "The Katzen Herzlands is where the Imperium started and ended. It reaches from the Katsilbershirts in the north, to the Nitromethane Imperium in the south, and Krokatzia in the east. Its main geographical feature are the Katzen Mountains, bissecting the continent from the central north down to the southeast. Home to over half a billion Katzens, it can be roughly divided into four separate areas.\n\nThe §1Northern Herzlands§! are the heart of Katzen civilization and where the Katzen species originally arrived on Flusion over 3000 years ago. It is heavily industrialized, very populated and centralized around the megacity of Katown. As it was the heart of the Imperium, its inhabitants are highly jingoistic, wishing to restore the glory of the Imperium at any cost. This has unfortunately resulted in the region falling to the throes of degenerated Kaiserism and bloody fascist movements.\n\nThe §1Southern Herzlands§!, stretching from Purrlin-Lionsburg to Lionita, on the contrary, are more sparsely populated and open to the outside world, historically serving as the Katzens' interface with the rest of Flusion prior to the Imperium's conquests. Whatever wealth it has is usually derived from trade and agriculture rather than raw industrial output. Its inhabitants tend to be thrifty and open to business ventures throughout the Herzlands and beyond. Most of its industrial capacity is concentrated around the megalopolis of Purrlin-Lionsburg, while the rest is filled with vast pastures, crop fields and mining industries. To its south grows the mighty Drakwald, a gargantuan jungle spreading around the Drakwald river, constantly encroached upon by exponentially growing logging industries almost unimpeded by the Collapse. At this rate, it may very well be entirely gone within the next century.\n\nBetween the two lie the §1Central Herzlands§!, an 'in-between' lacking a distinct identity, historically dominated first by the South and then by the North as the Herzlands centralized.\n\nThe Katzens of the §1Eastern Herzlands§!, shielded behind the Katzen mountains, tend to favor more passive stances and stable monarchical governments, and, owing to their distance from Katown, are more prone to alternative ideologies, such as burgeoning communism in the vicinity of Meownich. The Katzen Mountains continue north into Zuspriland, an area once populated almost entirely by the peaceful Zuspris species, massively colonized by Katzen settlers during the Imperium and now exploited for its vast mineral wealth.\n\nThe Herzlands, once home to Flusion's greatest superpower, now lays shattered, with each of its dozen or so Katzen states convinced of being in the right. While the bloody early warlord era is long gone as small warlords have since amalgamated into something resembling proper nations, the continents struggles have likely just begone..."
 LOK_country_intro_FLUSIONEA:0 "crabs"
 LOK_country_intro_ARIVOEJO:0 "more cats"
 LOK_country_intro_SOLAKEA:0 "Unlike the monolithic Felinea, Solakea is an extremely diverse continent, both demographically and technologically.\n\nIn the north and west there lies §1Roqualia§!, the continent's greatest power and triumphant winner of the Crusade. It is a sleeping giant, having fallen back into its hedonistic slumber following victory against Katzen forces. While the Roqualians wish for nothing else than be able to play games and advance technology to play games better, their national pride is nonetheless marred by an aggravating chunk of Roqualian land still occupied by Katzen settlers in the east - known as the 'Province Perdues'\n\nEast of Roqualia, facing Felinea are the §1Flusiobalkans§!, from Kusnurk to Izwae. It is a tumultuous area of conflicting ideologies and shifting borders, the latter often caused by nomadic populations of Cloudstriders and Eto'ya moving around en-masse. Nearly entirely occupied by the Imperium and free only thanks to tireless struggle and resistance, the people of the Flusiobalkans hold their independance dear and will fight until the last to avoid a repeat of Katzen occupation.\n\nThe continent's climate and geography transitions from warm rolling hills into freezing tundras and mountains as one moves south into the sparsely populated §1Plaveta§!, now home to the expansionist Roqualian colony of Quepler, freshly established after the collapse of an expansionist Katzen colony in the same area. Its most striking artificial feature is a gigantic dam, not unlike that of Katlantropa's, built at the mouth of a large lake by the administration of said Katzen colony. The lake was since dried out, transformed into a humongous salt flat now used for relentless industrial development. While the region's climate and ecosystems have suffered harshly, the current Roqualian administration seems content with simply reaping the fruits of Katzen industrialist folly.\n\nLastly, at the southwestern tip of the continent one can find the wondrous land of §1Paluushia§!, inhabited by supersized lagomorphs blessed with wondrous elemental magic. Having almost entirely avoided the Crusade's bloodshed, the Paluushes continue to live an idyllic, unbothered lifestyle under the watchful gaze of their monarch."
 LOK_country_intro_SUNSEA:0 "shrooms"

 LOK_country_intro.2.a:0 "Got it! Let's start..."
