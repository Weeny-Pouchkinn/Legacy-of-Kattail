 # UMR Focus Tree
 UMR_Focus_1:0 "A new Republic"
 UMR_Focus_1_desc:0 "Less than a year ago on 14.06.99 AKA the Sobani United Military Republic was proclaimed, now the time has come to finally rebuild from the devastation of the Kaiser’s war upon our people"

 UMR_Focus_2:0 "The Katzen Question"
 UMR_Focus_2_desc:0 "While the fortress cities stood, the kaiser took the surounding lands and many katzen settlers flocked towards it. now we must decide how to deal with them"

 UMR_Focus_3:0 "The First Elections"
 UMR_Focus_3_desc:0 "The time has come for the first elections, that shall decide the future of our nation"

 # Events
 UMR_event.1:0 "A new Republic"
 UMR_event.1.t:0 "A new Republic"
 UMR_event.1.d:0 "The Kaiser brought much devastation to Sobani lands conquering all but the biggest fortress cities, it has become clear that the defensive confederation of old was no longer sufficient. Propelled to fame by her actions during the battle for the Tiir breach, Interim Grand Marshal von Pandasdorf managed to unite the disparate clans and city states into one Republic led by a united military, one where citizenship is only gained by military service, and your voting weight decided by rank. \nOne year from now its leader, the Grand Marshal, is to be elected from among the nation's generals, but now has come the time to rebuild. \n \nFor the Spirits and the Owlfather! For the Grand Marshal!"
 UMR_event.1.a:0 "...For the Republic we March!"

 UMR_event.2:0 "The First Elections"
 UMR_event.2.t:0 "The First Elections"
 UMR_event.2.d:0 "Sobani from all Fortress cities and clans have proudly marched to the voting booths for the first ever elections. several candidates from among the nations high command have come forward in a bid for the position, yet the election results clearly favour one person."
 UMR_event.2.a:0 "von Pandasdorf is clearly the only choice."