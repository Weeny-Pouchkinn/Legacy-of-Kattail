l_english:
 TAK_Vive_le_roi: "Vive le Roi!"
 TAK_Vive_le_roi_desc: "Life in Takicardie is exclusively governed by His Majesty's whims and desires. He holds absolute power over society, and anyone who dares disagree is swiftly disappeared via an extensive network of trapdoors scattered throughout Takicardie. Vive le Roi!"
 TAK_Vive_le_roi_2:0 "Gloire au Roi!"
 TAK_Vive_le_roi_2_desc:0 "Life in Takicardie is still governed by His Majesty's whims and desires, but these desires slowly shifting outwards finally brings about some much needed change even if these stem from... less-than-stellar intentions."

 TAK_Industrie_du_roi: "La Grande Industrie du Roi"
 TAK_Industrie_du_roi_desc: "Nearly the entirety of Takicardie's industrial output is directed towards the creation and refinement of an endless amount of Roi-related trinkets, decorations and buildings. New statues of His Majesty are built almost every day, often to be torn down in the next month to make way for even larger ones. This, obviously, leaves little for actual industrial and societal development..."
 TAK_Industrie_du_roi_2: "La Petite Industrie du Roi"
 TAK_Industrie_du_roi_2_desc: "A fair share of Takicardie's industrial output is directed towards the creation and refinement of an endless amount of Roi-related trinkets, decorations and buildings. New statues are built every day, although they are no longer getting torn down for petty reasons the next week. Takicardie's industry may finally be able to get off the ground now..."
 TAK_Industrie_du_roi_3:0 "La Nouvelle Industrie du Roi"
 
 TAK_event.1.t:0 "The King and the Mockingbird"
 TAK_event.1.d:0 "It was a lovely day in Takicardie, as lovely as any other, really. The city of Charles stood as it always had, its towering verticality casting a shadow stretching for miles on end onto the city's deserted outskirts. A necessary splendor to match the glory of its beloved Roi.\n\nAnd there he was, proudly stepping out of a resplendent opening somewhere near the city's base. Escorted by no less than eight of his most competent guards, the Roi salutes to his people, before delicately grabbing a gold-plated pistol resting upon an ornate pillow.\n\nAs indeed, today was the monthly Jour du Feu, where the Roi would once more demonstrate his immense marksman skills to an exalted populace. He glances at the makeshift target in front of him, takes aim, and...\n\nDoes the Roi's eyes deceive him? Not a single impact? This cannot be. This is unacceptable! A guard quickly pokes a few holes into the target. Ah! That is much better, the Roi thinks as he turns to his entourage now erupting into a frenzy of claps and cheers.\n\nSuch jubilance is quickly interrupted by a gigantic, hat-wearing Mockingbird swooping down onto the scene and slandering the beloved Roi. The Roi reacts quickly and takes aim once more, but it is to no avail as the dreaded avian flies off into the distance, its mockeries reverberating throughout Charles.\n\nThe clapping has stopped. The Roi glares. The clapping resumes.\n\nAll is well."
 TAK_event.1.a:0 "Vive le Roi!"

 TAK_event.2.t:0 "A Royal Depiction"
 TAK_event.2.d:0 "Following the somewhat unpleasant Jour du Feu, the Roi felt that he needed to be reminded of his unshakeable glory, so the finest painter in Takicardie was summoned for this essential task.\n\nThus, somewhere up hundreds of feet above the ground, within one of Charles' cavernous art galleries dedicated entirely to bearing witness to the Roi's resplendent form, Takicardie's sovereign stood there as the painter took in every aspect of his royal being.\n\nHis delightful elongated mustache, a perfectly-trimmed circular stub of hair for a beard, a colorful attire topped by a pure twenty-four karat crown, all converging towards a peculiar cross-eyed glare. The Roi was quite prou- wait. Cross-eyed? This cannot be right. The Roi stares at the painting, inspecting every detail. It is all correct, all as splendid as ever, except for these Mirlean-forsaken eyes!\n\nThe painter looks anxious, but the Roi, in his eternal kindness, regains composure and firmly shakes the painter's hand before dismissing him. The artist walks away in relief, before the Roi activates a large lever which suddenly sweeps the floor from beneath the painter, plunging him to his supposed doom, leaving nothing but an oversized wig behind.\n\nFortunately, the Roi is proficient in every artform - all it takes is a couple of well-placed paint dots to rectify this misshapen visage, making it as lifelike as possible.\n\nAll is well."
 TAK_event.2.a:0 "Je ne louche pas!"

 TAK_event.3.t:0 "Hitting the Hay"
 TAK_event.3.d:0 "As the state-of-the-art Takicardian elevator made its way up the city of Charles, a monotone voice reading out every floor on the way there, the Roi felt like he was entitled to a rest more royal than any other.\n\nBetween the Jour du Feu incident and the dismissal of this incompetent painter, he couldn't wait to reach his apartments and sleep amongst the finest art Takicardie could offer, including the most recent depiction of his royalness, saved thanks by his own intervention.\n\nAfter what felt like an eternity the Roi arrives at the very top of Takicardie where his apartments are precariously installed. What a view, whose beauty is third only to the city of Charles and himself, of course. From there one can faintly spot the coast of a land known as 'Roqualia', populated by a bunch of good-for-nothing hobos who think themselves above the Roi's glory.\n\nAnd is that... no! Standing on a roof somewhat lower than the apartments is the dreaded Mockingbird, admiring the view! He does not even want to look at the thing. The Roi closes his eyes, and a single, well-placed shot guided by nothing but his intuition is all it takes to rid his sights of this unpleasant feathered biped.\n\nThe Roi feels a smug sense of satisfaction as he slips into bed. Meanwhile, the Mockingbird wonders why the Roi felt the need to shoot down a weather vane."
 TAK_event.3.a:0 "His rest would soon be cut short."

 TAK_event.4.t:0 "Roi VS. Roi"
 TAK_event.4.d:0 "It is the depth of night in Takicardie and a great miracle is about to occur. Just like every other night, as the city's inhabitants and sovereign slumber, the figures in the numerous paintings decorating the Roi's apartments suddenly come alive and step out of their frames.\n\nA young chimney-scrubber emerges from one such art piece to court his beloved shepherdess. The Mockingbird is familiar with them. They recount the bird's tales speaking of great lands, from the great mountains the Massif Roqual to the towering Lutécie Tower at the heart of Roqualia. They dream of one day leaving for better horizons and to live their lives as free creatures.\n\nBut it is not to be! Just as they came alive, so does the Roi's own painting suddenly gain a will of its own. This pathetic chimney-scrubber is not worthy of such a lovely shepherdess! She must mary him, the representation of the glorious Roi!\n\nHeckling ensues and as ruckus escalates, the paintings freeze in horror as the real Roi is woken from his slumber.\n\nHis royal self notices his alternate self within seconds - there is no time to think. There can only be one Roi and so fighting ensues as awkward blows are traded and gunshots resonate throughout the room. Seeing as they are evenly matched, both Rois rush to locate the concealed knobs and levers connected to hidden trapdoors, well intending to send their alter-ego into the depths.\n\nThis awe-uninspiring display continues for agonizingly long minutes until..."
 TAK_event.4.a:0 "...the impostor is expunged!"
 TAK_event.4.b:0 "...the Roi is outmaneuvered and plunges to his doom!"

 TAK_event.5.t:0 "Painting Pursuit"
 TAK_event.5.d:0 "the roi wants to get the girl he loves"
 TAK_event.5.a:0 "A great wedding is in order!"

 TAK_event.6.t:0 "Acrylic Wedding"
 TAK_event.6.d:0 "the roi and the shepherdess get married but the crowd tries to stop it"
 TAK_event.6.a:0 "...the Roi loses control!"
 TAK_event.6.b:0 "...the intruders are shot!"

 TAK_event.7.t:0 "Thus Ends History"
 TAK_event.7.d:0 "the roi and the girl marry and 'love' each other forever ever after. king clamps down on everything."
 TAK_event.7.a:0 "C'est déjà fini...?"

 TAK_event.8.t:0 "Raving Robotics"
 TAK_event.8.d:0 "roi gets away with the girl, giant robot fight scene"
 TAK_event.8.a:0 "Stop them!"

 TAK_event.9.t:0 "La Fin de Toute Chose?"
 TAK_event.9.d:0 "the guy destroys the entire city"
 TAK_event.9.a:0 "Tout s'effondre."

 TAK_event.10.t:0 "Douce Liberté"
 TAK_event.10.d:0 "takicardie is in ruins. time to rebuild."
 TAK_event.10.a:0 "C'est un nouveau début."

 TAK_event.11.t:0 "De La Sorcellerie!"
 TAK_event.11.d:0 "As the fake Roi plummeted to his doom down Takicardie's network of hidden trapdoor tunnels and the various other painting-people scurried back into their frames hoping to be forgotten, the real Roi was grasped by a profound sense of unease. The paintings! The paintings are alive! For how long has this been going on under his royal nose? Are ALL the paintings in Takicardie alive? Was there a hidden painting-civilisation living right beside his own? A civilisation which does not respect him? UNACCEPTABLE!\n\nCharles' two million inhabitants were kicked out of bed by the sound of alarms and manic shouting by the Roi's loyalists. ALL paintings were to be taken down, piled up and burned immediately, with anyone caught harboring a painting being swiftly disappeared!\n\nMerely two days later, the Roi stood in front of thousands upon thousands of paintings, all stacked up in a precarious pile near the base of Charles. A speech was given proclaiming the 'eradication of an unworthy parallel society' before guards set the entire structure alight, turning thousands of artpieces from Takicardie and beyond into a monumental pyre.\n\nAmongst these were many paintings of the Roi. Naturally, this hurt him deeply, but it had to be done, for there was only one Roi, and that was himself. From now on, the only tolerated artform was to be sculptures depicting the Roi's bust and face, at least these couldn't be of any trouble if they were to come alive. In an incredible show of generosity, the Roi even had one such sculpture gifted to every citizen who had to burn their paintings, all for the low, low price of three additional months of mandatory labor.\n\nAll is well."
 TAK_event.11.a:0 "Better be safe."

 TAK_event.12.t:0 "On Second Thought..."
 TAK_event.12.d:0 "The next couple days went by as they always do in Takicardie. The Roi displayed his splendor to his people who lauded him in countless mandatory celebrations. The Roi went to sleep in his newly-undecorated apartments, and the cycle would repeat.\n\nAll would be well, were it not for a small thought at the back of the Roi's head nagging him every time he glanced at his empty apartment walls. Why? Why did the paintings come alive? How did it even work? Weren't painting flats? How did the 'painting-people' have any thickness to them? But, most importantly, if these... animated paintings are identical to 'real' people, could they be... of use? Could they be painted with purpose, made to serve and labor for his majesty, just like every other inhabitant of Takicardie?\n\nAfter a sleepless night the Roi did not appear publically for perhaps the first time in decades - rather spending the day getting Takicardie's greatest artists to paint replicas of his own guards. And, sure enough, as the night came, the painted guards came alive and, when confronted by the Roi himself, agreed to swear fealty to him.\n\nAnd well, that was all the proof he needed. Who cared where all that extra matter was coming from, or why they were even alive to begin with - the Roi had just stumbled upon a source of infinite materiel and manpower, and now there was no turning back."
 TAK_event.12.a:0 "The 'why' matters not. Greatness awaits!"

 TAK_event.13.t:0 "Royal Ambitions"
 TAK_event.13.d:0 "The Roi had not been seen for several days now, which greatly worried the inhabitants of Charles, who in many cases threw parties to distract themselves from the sorrow of not seeing their glorious sovereign.\n\nBut, and much to everyone's relief as evidenced by the many sighs heard across the city, the Roi soon emerged from his quarters to give a speech 'about the future of Charles and Takicardie as a whole'. And so there he was, standing beneath a jubilant crowd of hundreds of thousands of eager Takicardians.\n\n...\n\nHe wasn't really sure how to proceed. To be fair, he... never had to give a speech before. Up until now his will had been so obvious that there was no need for such trivialities. But times are changing and so the Roi had to adapt, he thought as he stepped up and knocked on the microphone twice, sending a screeching echo throughout the crowd.\n\n'My... beloved... subjects! It is I! The Roi! And I have... ambitions'. The crowd stood silent as the Roi looked at the masses below him.\n\n'We will... uhm... we will paint! Many paintings! And take over the world with them.' There were looks of confusion and hushed rebuttals.\n\n'I mean. Not the, like, not the whole world, but we will be made... great! Yes! With our paintings! New ones!' The crowd remained silent. The Roi began clapping to himself. Nothing happened. The Roi glared at the crowd, which was quick to join the clapping."
 TAK_event.13.a:0 "It was an alright performance, I think."

 TAK_event.14.t:0 "Painting"
 TAK_event.14.d:0 "REPLACE_ME"
 TAK_event.14.a:0 "REPLACE_ME"

 TAK_event.15.t:0 "REPLACE_ME"
 TAK_event.15.d:0 "REPLACE_ME"
 TAK_event.15.a:0 "REPLACE_ME"

 TAK_event.17.t:0 "To Achieve Greatness"
 TAK_event.17.d:0 "The Roi was deep in study. He, of course, was the greatest, but if he wanted the world to recognize said greatness, he would need to borrow from other great leaders, as to adapt his existing greatness to patterns that people would appreciate more.\n\nReading through dozens of imported textbooks (ages 3 to 6), the Roi was enraptured by the stories of this so-called 'Kaiser Kattail', which had supposedly managed to subjugate most of the world before being felled by a vast coalition of nations.\n\nThis led the Roi to develop his 'Theory of Greatness' - according to him, this 'Kattail' fellow had faked his greatness, merely adopting symbolisms related to greatness as to appease the masses, without it actually meaning anything. Thus, it eventually came crashing down on him. The Roi, however, was truly great, in manners unknowable to the mundane mind of the commoner, and so he was destined to succeed everywhere, as evidenced by this 'divine gift' of animated paintings bestowed upon him by fate itself.\n\nThe Roi would spend the next week or so carefully going through nearly every notable figure in Flusionian history, neatly grading their balance of 'inherent greatness' and 'fake greatness' as to understand from where he should get his inspiration. As to fund his future endeavors and enlighten his countrymen on the true nature of leadership, his Theory of Greatness was published within Takicardie and made mandatory for schoolchildren to learn.\n\nSoon enough, great frescoes depicting the Roi standing above the 'ungreat' figures of Kaiser Kattail and Dofus Tequenik Machina abounded in every corner of Charles. They would even come alive at night and perform plays explaining the Roi's ambitions, as to prepare the population for the great struggles to come.\n\nBut all would be well, for the Roi is Great."
 TAK_event.17.a:0 "It is good to be Great."

 TAK_event.16.t:0 "[TAK.GetLeader] Proposes Royal Visit"
 TAK_event.16.d:0 "We have just received a communiqué hailing from [TAK.GetName], proposing that their sovereign, [TAK.GetLeader], undertake an official 'royal visit' within our territories as to establish proper relations between our two nations following Takicardie's exit from isolation."
 TAK_event.16.a:0 "Sure...?"
 TAK_event.16.b:0 "Tell him to get lost."
 
 TAK_event.161.t:0 "[FROM.GetName] Accepts Royal Visit!"
 TAK_event.161.d:0 "[FROM.GetName] has responded to Charles' communiqué with their official approval for an upcoming royal visit! The Roi shall thus depart for their lands shortly as to spend a few days mingling with their government for the betterment of mutual relations."
 TAK_event.161.a:0 "Splendide!"

 
 TAK_event.162.t:0 "[FROM.GetName] Rejects Royal Visit!"
 TAK_event.162.d:0 "[FROM.GetName] has rejected Charles' communiqué offering a royal visit. It seems that they do not wish to recognize Takicardie and the Roi as legitimate states worthy of their attention..."
 TAK_event.162.a:0 "Salauds!!!!"
 
 TAK_royal_visit:0 "A Royal Visit"
 TAK_denied_visit:0 "Denied Visit"

 TAK_event.1000.t:0 "Takicardie Wishes to Purchase Roqualium"
 TAK_event.1000.d:0 "An unusual request has reached [ROQ.GetLeader]: the small and up until now insignificant hermit state of Takicardie is interested in purchasing a 'couple kilograms of Roqualium' from Persona Inc. and the Roqualian government, promising 'immense payment' for the precious material."
 TAK_event.1000.a:0 "Sure... I guess?"
 TAK_event.1000.b:0 "Is he crazy?"

 TAK_event.1001.t:0 "Roqualia Accepts!"
 TAK_event.1001.d:0 "Jubilant news! Roqualia has accepted to ship Charles a chunk of its Roqualium stockpile. However, there is the matter of payment..."
 TAK_event.1001.a:0 "Je payerais, comme promis..."

 TAK_event.1002.t:0 "Roqualia Refuses!"
 TAK_event.1002.d:0 "Roqualia has unfortunately denied our Roqualium purchase, citing the 'sheer ludicrousness' of entrusting such a rare material to an 'insane king' like Charles."
 TAK_event.1002.a:0 "ILS BRÛLERONT EN ENFER!!!"

 TAK_event.1003.t:0 "Takicardie Infiltration Revealed!"
 TAK_event.1003.d:0 "Following reports of 'strange beings emerging from paintings at night', a number of our citizens has recently been revealed to be artificial painting-borne creatures sent there by Takicardie to infiltrate our nation! We must take action swiftly..."
 TAK_event.1003.a:0 "Send an ultimatum to withdraw these monsters!"
 TAK_event.1003.a.tt:0 "If Takicardie §Rrefuses§!, we will go to war! But if they §Gaccept§!, their infiltration will be dismantled."
 TAK_event.1003.b:0 "Let them be... what can they do?"

 TAK_event.1004.t:0 "[FROM.GetName] Issues Ultimatum"
 TAK_event.1004.d:0 "Our beloved Roi has recently received a very angry communiqué from [FROM.GetLeader], asking for the immediate withdrawal of Takicardie's 'abominable paintings' from their land lest war is declared."
 TAK_event.1004.a:0 "Hé bien, ils auront la guerre!"
 TAK_event.1004.b:0 "Oui, oui, d'accord..."
 TAK_event.1004.b.tt:0 "Every infiltrated [FROM.GetAdjective] state §Rloses§! §Y2§! level of infiltration."

 TAK_event.1005.t:0 "Paintings Come To Life!"
 TAK_event.1005.d:0 "Alarming news! Overnight following the start of our war with Takicardie, thousands upon thousands of characters in paintings in museums, galleries and houses throughout the nation suddenly came to life, before organizing into entire divisions loyal to Takicardie and their degenerate Roi!"
 TAK_event.1005.a:0 "What is this sorcery?!"

