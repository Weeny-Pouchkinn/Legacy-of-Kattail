  # Surveillance Branch
  TAK_tighten_surveillance:0 "Tighten Surveillance"
  TAK_tighten_surveillance_desc:0 "With the Roi's domain expanding at a blistering pace, it is becoming ever more necessary to ensure he can keep a watchful eye upon his masses of subjects... with new advancements in radar array technology, His Majesty shall know where everyone is, at all times!"
  TAK_le_roi_voit_tout:0 "Le Roi Voit TOUT"
  TAK_le_roi_voit_tout_desc:0 "His Majesty sees EVERYTHING. The towering structures of Charles shall be outfitted with the ultimate radar grid, and our royal network of Petite Charles across the realm shall serve as the ears and eyes of the crown."
  TAK_le_roi_voit_tout_decision_unlock:0 "Unlocks §YDecisions§! to install massive radar arrays, the §YRelais Radio Royal§!, upon the §YPetite Charles§! built across our lands."

