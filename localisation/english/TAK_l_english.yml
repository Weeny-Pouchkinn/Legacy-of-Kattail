 TAK_automata_cat:0 "Amélioration de l'Automate"
 TAK_automata_cat_desc:0 "The §YAutomate du Roi§! is a monumental, fifteen stories tall armored mech, featuring the latest in Takicardian technology such as an air blower and an integrated musical theater. It represents Takicardie's greatest land asset, and thus the Roi demands that it be regularly upgraded with technologies salvaged from our defeated foes."

