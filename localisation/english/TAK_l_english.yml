l_english:
 TAK_Vive_le_roi: "Vive le Roi!"
 TAK_Vive_le_roi_desc: "Life in Takicardie is exclusively governed by His Majesty's whims and desires. He holds absolute power over society, and anyone who dares disagree is swiftly disappeared via an extensive network of trapdoors scattered throughout Takicardie. Vive le Roi!"
 TAK_Vive_le_roi_2:0 "Gloire au Roi!"
 TAK_Vive_le_roi_2_desc:0 "Life in Takicardie is still governed by His Majesty's whims and desires, but these desires slowly shifting outwards finally brings about some much needed change even if these stem from... less-than-stellar intentions."

 TAK_Industrie_du_roi: "La Grande Industrie du Roi"
 TAK_Industrie_du_roi_desc: "Nearly the entirety of Takicardie's industrial output is directed towards the creation and rafinment of an endless amount of Roi-related trinkets, decorations and buildings. New statues of His Majesty are built almost every day, often to be torn down in the next month to make way for even larger ones. This, obviously, leaves little for actual industrial and societal development..."
 TAK_Industrie_du_roi_2: "La Petite Industrie du Roi"
 TAK_Industrie_du_roi_2_desc: "A fair share of Takicardie's industrial output is directed towards the creation and rafinment of an endless amount of Roi-related trinkets, decorations and buildings. New statues are built every day, although they are no longer getting torn down for petty reasons the next week. Takicardie's industry may finally be able to get off the ground now..."
 TAK_Industrie_du_roi_3:0 "La Nouvelle Industrie du Roi"
 
 TAK_event.1.t:0 "The King and the Mockingbird"
 TAK_event.1.d:0 "the roi does some shooting and sucks. everyone claps anyways"
 TAK_event.1.a:0 "Vive le Roi!"

 TAK_event.2.t:0 "A Royal Depiction"
 TAK_event.2.d:0 "the roi gets a painting made and it is cross-eyed! not good. he fixes it himself"
 TAK_event.2.a:0 "Je ne louche pas!"

 TAK_event.3.t:0 "A Bit Too Lifelike"
 TAK_event.3.d:0 "the paintings come alive!"
 TAK_event.3.a:0 "His rest would soon be cut short."

 TAK_event.4.t:0 "Roi VS. Roi"
 TAK_event.4.d:0 "the fake roi faces against the real roi"
 TAK_event.4.a:0 "The impostor is expunged!"
 TAK_event.4.b:0 "The Roi is outmaneuvered and plunges to his doom!"

 TAK_event.5.t:0 "Painting Pursuit"
 TAK_event.5.d:0 "the roi wants to get the girl he loves"
 TAK_event.5.a:0 "A great wedding is in order!"

 TAK_event.6.t:0 "Acrylic Wedding"
 TAK_event.6.d:0 "the roi and the sherperdess get married but the crowd tries to stop it"
 TAK_event.6.a:0 "...the Roi loses control!"
 TAK_event.6.b:0 "...the intruders are shot!"

 TAK_event.7.t:0 "Thus Ends History"
 TAK_event.7.d:0 "the roi and the girl marry and 'love' each other forever ever after. king clamps down on everything."
 TAK_event.7.a:0 "C'est déjà fini...?"

 TAK_event.8.t:0 "Raving Robotics"
 TAK_event.8.d:0 "roi gets away with the girl, giant robot fight scene"
 TAK_event.8.a:0 "Stop them!"

 TAK_event.9.t:0 "La Fin de Toute Chose?"
 TAK_event.9.d:0 "the guy destroys the entire city"
 TAK_event.9.a:0 "Tout s'effondre."

 TAK_event.10.t:0 "Douce Liberté"
 TAK_event.10.d:0 "takicardie is in ruins. time to rebuild."
 TAK_event.10.a:0 "C'est un nouveau début."

 TAK_event.11.t:0 "De La Sorcellerie!"
 TAK_event.11.d:0 "the roi realises the paintings come alive, wakes up the entire city, and burns it all"
 TAK_event.11.a:0 "Better be safe."

 TAK_event.12.t:0 "On Second Thought..."
 TAK_event.12.d:0 "the roi gets some painters and experiments... and gets ideas."
 TAK_event.12.a:0 "The 'why' matters not. Greatness awaits!"

 TAK_event.13.t:0 "Royal Ambitions"
 TAK_event.13.d:0 "we will take over the world"
 TAK_event.13.a:0 "ok"

 TAK_event.14.t:0 "Painting"
 TAK_event.14.d:0 "REPLACE_ME"
 TAK_event.14.a:0 "REPLACE_ME"

 TAK_event.15.t:0 "REPLACE_ME"
 TAK_event.15.d:0 "REPLACE_ME"
 TAK_event.15.a:0 "REPLACE_ME"

 TAK_event.1000.t:0 "Takicardie Wishes to Purchase Roqualium"
 TAK_event.1000.d:0 "An unusual request has reached [ROQ.GetLeader]: the small and up until now insignificant hermit state of Takicardie is interested in purchasing a 'couple kilograms of Roqualium' from Persona Inc. and the Roqualian government, promising 'immense payment' for the precious material."
 TAK_event.1000.a:0 "Sure... I guess?"
 TAK_event.1000.b:0 "Is he crazy?"

 TAK_event.1001.t:0 "Roqualia Accepts!"
 TAK_event.1001.d:0 "Jubilant news! Roqualia has accepted to ship Charles a chunk of its Roqualium stockpile. However, there is the matter of payment..."
 TAK_event.1001.a:0 "Je payerais, comme promis..."

 TAK_event.1002.t:0 "Roqualia Refuses!"
 TAK_event.1002.d:0 "Roqualia has unfortunately denied our Roqualium purchase, citing the 'sheer ludicrousness' of entrusting such a rare material to an 'insane king' like Charles."
 TAK_event.1002.a:0 "ILS BRÛLERONT EN ENFER!!!"

 TAK_event.1003.t:0 "Takicardie Infiltration Revealed!"
 TAK_event.1003.d:0 "Following reports of 'strange beings emerging from paintings at night', a number of our citizens has recently been revealed to be artificial painting-borne creatures sent there by Takicardie to infiltrate our nation! We must take action swiftly..."
 TAK_event.1003.a:0 "Send an ultimatum to withdraw these monsters!"
 TAK_event.1003.a.tt:0 "If Takicardie §Rrefuses§!, we will go to war! But if they §Gaccept§!, their infiltration will be dismantled."
 TAK_event.1003.b:0 "Let them be... what can they do?"

 TAK_event.1004.t:0 "[FROM.GetName] Issues Ultimatum"
 TAK_event.1004.d:0 "Our beloved Roi has recently received a very angry communiqué from [FROM.GetLeader], asking for the immediate withdrawal of Takicardie's 'abominable paintings' from their land lest war is declared."
 TAK_event.1004.a:0 "Hé bien, ils auront la guerre!"
 TAK_event.1004.b:0 "Oui, oui, d'accord..."
 TAK_event.1004.b.tt:0 "Every infiltrated [FROM.GetAdjective] state §Rloses§! §Y2§! level of infiltration."

 TAK_event.1005.t:0 "Paintings Come To Life!"
 TAK_event.1005.d:0 "Alarming news! Overnight following the start of our war with Takicardie, thousands upon thousands of characters in paintings in museums, galleries and houses throughout the nation suddenly came to life, before before organizing into entire divisions loyal to Takicardie and their degenerate Roi!"
 TAK_event.1005.a:0 "What is this sorcery?!"

 TAK_des_gros_cannons_idea: "Les Plus Gros Cannons"
 TAK_des_gros_cannons_idea_desc: ""

 TAK_the_new_charles_trigger:0 "We have a least §Y500,000§! $TAK_painting_charles$ in reserve."

 TAK_perfect_imitation_available:0 "We have at least §Y100§! $TAK_painting_power$."
 
 TAK_painting_power:0 "§4Painting Power§!"
 TAK_painting_charles:0 "§7Charleslings§!"

 TAK_painting_charles_weekly:0 "Weekly $TAK_painting_charles$"
 TAK_painting_power_usage:0 "$TAK_painting_power$ Usage"

 TAK_recruit_painters_state:0 "Painter Recruitment Campaign in [FROM.GetName]"
 TAK_recruit_painters_state_desc:0 "A great campaign in [FROM.GetName] will look for the greatest artists to serve for His Majesty's ambitions. Some species are more talented in artistic matters than others!"

 TAK_fabricate_brush:0 "Fabricate Roqualium Brush"
 TAK_fabricate_brush_desc:0 "With our accumulated Roqualium, we will be able to create a brush to bring his Majesty's paintings to life!"
 TAK_gain_1_brush_tooltip:0 "We gain §Y1§! §RPaintbrush§!."
 TAK_gain_2_brush_tooltip:0 "We gain §Y2§! §RPaintbrushes§!."
 TAK_gain_3_brush_tooltip:0 "We gain §Y3§! §RPaintbrushes§!."
 TAK_gain_4_brush_tooltip:0 "We gain §Y4§! §RPaintbrushes§!."

 TAK_painting_cat:0 "Les Beaux Tableaux Du Roi"
 TAK_painting_cat_desc:0 "For some incomprehensible reason, paintings created using Roqualium brushes within the city of Charles magically come alive at night. While originally deemed a major security risk, our beloved sovereign Charles has had the brilliant idea of exploiting this for the glory of Takicardie!\n\nWe may recruit §GPainters§! who will generate $TAK_painting_power$ based on their §YSkill§!. Each painter needs to have their own §RPaintrush§!, our supply of which will automatically be allocated to the most skilled painters.\n\nWe currently have §Y[?TAK_painter_list^num]§! §GPainters§! and §Y[?TAK_brush_count]§! §RPaintbrushes§!, generating a total of §Y[?TAK_painting_power]§! (§Y[?TAK_painting_power_usage]§! subtracted for other usages) painting power. [TAK.GetTakicardieBrushFulfill][TAK.GetTakicardieCharleslingsCount]\n\n[TAK.GetTakicardiePaintingType]"

 TAK_expand_domain:0 "Expand the Roi's Domain Into §Y[?FROM.GetName]§!"

 TAK_painting_charles_count_loc:0 "\n\nThere are currently §Y[?TAK_painting_charles_count]§! $TAK_painting_charles$ waiting to be dispatched."
 
 TAK_infiltrate_state:0 "Plant Paintings in [FROM.GetName]"
 TAK_infiltrate_state_desc:0 "Teams of loyal spies borne from paintings will be deployed to [FROM.GetName], either replacing people via assassination or pretending to be immigrants. They will then start installing paintings throughout the region (and replacing existing ones), which will spring to life once needed.\n\n[FROM.GetTakicardieInfiltrationLevel]"
 TAK_infiltrate_state_effect_tt:0 "\nOne extra division will spawn in this state upon war declaration.\n\nThere is a §R5%§! risk of this being found out. These odds are §Rdoubled§! if the state is of §YLarge City§!, §YMetropolis§! or §YMegapolis§! capacity, and §Ghalved§! if we have at least §Yten times§! as much $TAK_painting_power$ as §Y[?FROM.owner.GetName]§! has core states.\n\n"
 TAK_infiltrate_state_available_tt:0 "We need at least §Y25§! available $TAK_painting_power$."
 TAK_infiltration_0:0 "This state currently has §Rno§! paintings hiding amongst its populace. There will be no effects on war declaration."
 TAK_infiltration_1:0 "This state currently has §Oa few§! paintings hiding amongst its populace. War declaration will spawn §Y1§! friendly division."
 TAK_infiltration_2:0 "This state currently has §Ysignificant§! paintings hiding amongst its populace. War declaration will spawn §Y2§! friendly divisions."
 TAK_infiltration_3:0 "This state currently has §Gmany§! paintings hiding amongst its populace. War declaration will spawn §Y3§! friendly divisions."

 TAK_painters_make_charles:0 "Order the painting of $TAK_painting_charles$\n§G[?TAK_painting_charles_weekly_per_painting_power]§! §YCharleslings§! per $TAK_painting_power$"
 TAK_painters_make_charles_loc:0 "The Roi has ordered the painting of $TAK_painting_charles$, bringing forth §G[?TAK_painting_charles_weekly]§! §Y$TAK_painting_charles_weekly$§!."

 TAK_painters_make_soldiers:0 "Order the painting of §RSoldiers§!\n§G[?TAK_weekly_manpower_per_painting_power]§! §YManpower§! and §G[?TAK_military_factory_donations_per_painting_power]§! §YMil. Factories§! per $TAK_painting_power$"
 TAK_painters_make_soldiers_loc:0 "The Roi has ordered the painting of §GSoldiers§!, alongside their equipment, generating §G[?TAK_weekly_manpower]§! §YWeekly Manpower§! and §G[?TAK_military_factory_donations]§! §YOffmap Military Factories§!."

 TAK_painters_make_propaganda:0 "Order the painting of §6Propaganda Troupes§!\n§G[?TAK_stability_weekly_per_painting_power|%]§! §YWeekly Stability§! per $TAK_painting_power$"
 TAK_painters_make_propaganda_loc:0 "The Roi has ordered the painting of §6Propaganda Troupes§!, generating §G[?TAK_stability_weekly|%]§! §YWeekly Stability§!."

 TAK_painters_make_war_propaganda:0 "Order the painting of §OWar Propaganda Troupes§!\n§G[?TAK_war_support_weekly_per_painting_power|%]§! §YWeekly War Support§! per $TAK_painting_power$"
 TAK_painters_make_war_propaganda_loc:0 "The Roi has ordered the painting of §OWar Propaganda Troupes§!, generating §G[?TAK_war_support_weekly|%]§! §YWeekly War Support§!."

 TAK_enough_brushes:0 "There is a §Gsurplus§! of paintbrushes for all our painters!"
 TAK_just_right_brushes:0 "There are §Yjust enough§! paintbrushes for all our painters!"
 TAK_not_enough_brushes:0 "There are §Rinsufficient§! paintbrushes for all our painters!"

 TAK_recruit_painter_1_tt:0 "Gain a §RNovice§! §GPainter§! with a $TAK_painting_power$ of §Y1§!"

 TAK_recruit_painter_3_tt:0 "Gain a §OMediocre§! §GPainter§! with a $TAK_painting_power$ of §Y3§!."

 TAK_recruit_painter_5_tt:0 "Gain a §YGood§! §GPainter§! with a $TAK_painting_power$ of §Y5§!."

 TAK_recruit_painter_10_tt:0 "Gain a §7Talented§! §GPainter§! with a $TAK_painting_power$ of §Y10§!."

 TAK_recruit_painter_20_tt:0 "Gain a §3Legendary§! §GPainter§! with a $TAK_painting_power$ of §Y20§!."

 TAK_address_the_people:0 "Address the Masses"
 TAK_address_the_people_desc:0 "Change is in the air in Takicardie! The unenlightened masses must be informed of His Majesty's great plan for the nation's future..."

 TAK_think_about_greatness:0 "Contemplate Greatness"
 TAK_think_about_greatness_desc:0 "Actively having such a great plan for the future is a change of pace for the Roi. It is paramount for him to indulge in some... imperialist daydreaming as to bolster his motivation. All shall attend and see what Takicardie will soon be! This 'Kaiser Kattail' fellow which the Roi just learned about seems like a great source of inspiration..."

 TAK_a_necessary_evil:0 "A Necessary Evil"
 TAK_a_necessary_evil_desc:0 "The Roi has plans now, and those plans need manpower and industrial output. Some of the Roi-related paraphernalia production will thus have to be redirected elsewhere... for better or worse."

 TAK_develop_the_peripherie:0 "Build Up Outer Takicardie"
 TAK_develop_the_peripherie_desc:0 "Beyond the great city of Charles lies underused and sparsely-populated over which Takicardie only really holds tenuous control. These lands must be settled and invested into as to properly mark them as part of the Roi's territory... and to prepare them for things to come."

 TAK_agricultural_programs:0 "L'Agriculture du Roi"
 TAK_agricultural_programs_desc:0 "The Roi, in his ever-so-generous splendor, shall listen to his people's plea for additional food rations by hand-picking a lucky few amongst the neediest to cultivate the lands of Outer Takicardie."

 TAK_routes_du_roi:0 "Les Routes du Roi"
 TAK_routes_du_roi_desc:0 "The roads in Outer Takicardie are in such a terrible state that it right takes days for even motor vehicles to reach the border with Glitchopia. While this used to be part of Takicardie's ploy to avoid external disturbances, this state of affair is no longer acceptable, for the Roi cannot wait long!"

 TAK_petites_charles:0 "Les Petites Charles"
 TAK_petites_charles_desc:0 "The frontier settlements of Tak, Ikar and Die, which up until now have served as prison camps and dumps for undesirable exiles, shall be converted into proper cities resembling miniature versions of the capital city of Charles."

 TAK_develop_tak:0 "The Tak Dockyards"
 TAK_develop_tak_desc:0 "All great leaders specialize their lands, and so shall the Roi transform the small city of Tak into an assembly plant for small-scale ship components."

 TAK_flotte_du_roi:0 "La Flotte du Roi"
 TAK_flotte_du_roi_desc:0 "While Takicardie has a fleet, it mostly consists of outdated vessels meant to fire pot-shots at oncoming vessels. This is not worthy of His Majesty's glory - the Flotte du Roi shall be rebuilt to modern standards!"

 TAK_des_gros_cannons:0 "Des Gros Cannons..."
 TAK_des_gros_cannons_desc:0 "The buoyancy of water allows for vessels to carry truly gargantuan artillery pieces, whose destructive potential is only matched by the Roi's ambitions. Takicardie's finest engineers shall be tasked with designing these pieces."

 TAK_des_gros_vaisseaux:0 "...Sur De Gros Bateaux"
 TAK_des_gros_vaisseaux_desc:0 "The Roi holds the firm belief that the bigger a ship, the stronger it is. And of course, he is right! This simple rule is what shall help the Flotte du Roi become the fiercest flotilla in the Solakean Sea!"

 TAK_lay_down_the_charles:0 "Lay Down the Super-Charles"
 TAK_lay_down_the_charles_desc:0 "All great leader have a great flagship they can rally their armies behind. While on land, this role is obviously fulfilled by the mighty Automate, the Flotte du Roi needs an equally intimidating vessel of war to spearhead its assaults onto enemy waters. The Super-Charles is thus to be a massive, three-hundred-meters long superheavy battleship equipped with the latest railgun weaponry 'inspired' from Alkroa."

 TAK_develop_ikar:0 "Ikar Weapons Testing Site"
 TAK_develop_ikar_desc:0 "The hillside settlement of Ikar provides an ideal vantage point for the Roi to observe his engineers hard at work testing out and building new weaponry. Arms workshop shall thus be constructed here to exploit this opportunity."

 TAK_develop_die:0 "Heavy Industry in Die"
 TAK_develop_die_desc:0 "If the Roi wants Takicardie to be able to fulfill his great projects, he will need equally great industry. Unfortunately, the structure of Charles complicates the installation of some heavier types of industry, and as such these shall be built around the settlement of Die."

 TAK_mines_du_roi:0 "Les Mines du Roi"
 TAK_mines_du_roi_desc:0 "Just as the Roi hungers for the finest of delicacies, so does Takicardie hunger for the finest of resources. The peasants and exilees who though they could seek refuges in Outer Takicardie shall be put to work wrangling the sustainance necessary to feed the Takicardian machine from the very earth!"

 TAK_bulk_housing:0 "Standardized Housing"
 TAK_bulk_housing_desc:0 "While it is unconceivable to get rid of Charles' unique architectural style, it is nonetheless going to be necessary to standardize building codes throughout Takicardie as to streamline construction. Fret not - for the Roi shall still approve each and every one of these code to make sure they properly compliment Charles' glory."

 TAK_figure_it_out:0 "Establish Painting Methods"
 TAK_figure_it_out_desc:0 "If the Roi is to accomplish anything with his painting-related plans, it will first be necessary to define methods and protocols for mass-producing paintings, as well as figure out what exactly it is that allows a painting to turn alive."

 TAK_painting_factory:0 "Paintbrush Foundries"
 TAK_painting_factory_desc:0 "The Roqualium necessary to construct magical paintbrushes is an extremely tough material which is to be worked and shaped with utmost precision and care as to not damage its properties. Specialized foundries shall be established for this task."

 TAK_recruit_painters:0 "Painter Recruitment Program"
 TAK_recruit_painters_desc:0 "The Roi, while he could certainly use his endless talent to paint, is far too busy to do such a thing. Instead, a vast recruitment program shall bring in the finest artists of Takicardie to work on the Roi's grandiose project. Anyone caught incorrectly drawing him cross-eyed will however be swiftly expunged."
 TAK_recruit_painters_effect_tt:0 "Allows us to recruit extra §GPainters§!, once per controlled state."

 TAK_painter_education:0 "Educate the Painters"
 TAK_painter_education_desc:0 "In order for a painting to come alive, it is necessary for its painter to have understood every element of its composition. Our great painters shall thus be educated in the sciences as well as the arts in order to expand their creative possibilities."

 TAK_learn_about_it_all:0 "Learn About It All"
 TAK_learn_about_it_all_desc:0 "If the Roi is to mass produce platoons of soldiers equipped with guns and artillery, it will be necessary for the painters to actually understand how military equipment work, as any weapon painted without proper understanding comes out as little more than a useless decorative hulk of metal. Guns and cannons shall be purchased from all corners of the worlds as to study their inner workings."

 TAK_scrounge_for_roqualium:0 "Scrounge For Roqualium"
 TAK_scrounge_for_roqualium_desc:0 "It is a known fact that a delicate inspection of Roqualian infrastructure will sometimes reveal small chunks of Roqualium lodged within cast metal or concrete structures. These traces must be found and converted into Paintbrushes, no matter how many houses have to be take apart!"

 TAK_scrounge_for_roqualium_harder:0 "Gather Every Last Scrap"
 TAK_scrounge_for_roqualium_harder_desc:0 "Did the Roi stutter? A N Y T H I N G  that can contain Roqualium will be taken apart and inspected! No exceptions!\n\nExcept if it's the Roi's apartments, of course."

 TAK_the_roqualian_form:0 "Study the Roqualian Form"
 TAK_the_roqualian_form_effect_tt:0 "Allows §GPainters§! to create §YManpower§! and serve as §YMilitary Factories§! by painting platoons of soldiers."
 TAK_the_roqualian_form_desc:0 "It is one thing to paint pretty performers and dancers, but another to create physically-apt soldiers fully capable of wielding weapons of war. Our artists shall be taught every aspect of the Roqualian body, as to be able to paint the finest and greatest soldiers the world has seen!"

 TAK_officially_open_up:0 "Open Up to the World"
 TAK_officially_open_up_desc:0 "With Takicardie in a more favorable state capable of leveraging its assets, and the Roi much more well-informed about the rest of the world, it is now time to officially end its isolation and join the vast theater of Flusioniean nations, not as an outcast, but as an equal."

 TAK_a_royal_voyage:0 "A Royal Visit of All Roqualias"
 TAK_a_royal_voyage_desc:0 "The Roqualian species exists far beyond the confines of Takicardie, spanning Solakea in its entirety and even having conquered the north of Oshia. As to earn their trust and position himself as a potential Roqualian partner for the time being, the Roi shall pay a visit to all these nations."

 TAK_roqualium_purchase:0 "Purchase Roqualium"
 TAK_roqualium_purchase_desc:0 "Takicardie's Roqualium supply pales in comparison to that of its far larger northern cousin. Do they really use all of it? Perhaps there is a way to negotiate some sort of agreement to equalize things a little more."

 TAK_recruit_the_best:0 "Appeal to Foreign Painters"
 TAK_recruit_the_best_desc:0 "The people of Takicardie may be great, but their skills alone won't suffice to fulfill the Roi's ambitions. Foreign painters shall be encouraged to move to Takicardie thanks to extensive grants and exclusive Roi-styled manors promised to any skilled overseas artists willing to move to Charles."

 TAK_conceive_the_charlesling:0 "Conceive the Charlesling"
 TAK_conceive_the_charlesling_desc:0 "With the world's artistic elite - or at least some of it - now working for the Roi, it is time to create the 'ultimate' citizen to fill the streets of greater Takicardie with. Dubbed 'Charleslings', they shall ressemble the glorious Roi in every aspect - save for his incredible intellect, of course, for it obviously cannot be imitated."
 TAK_conceive_the_charlesling_tt:0 "Allows painters to create $TAK_painting_charles$, near-perfect copies of the Roi aligned with his own beliefs and ideas, which will be used to ensure compliance."

 TAK_perfect_imitation:0 "Perfect Imitations"
 TAK_perfect_imitation_desc:0 "Earlier painting creatures often featured rather obvious flaws - oddly asymmetrical faces, incorrect proportions, or a generally 'unnatural' or 'uncanny' look. Now, however, techniques have improved sufficiently to allow for the creation of true painting doppelgangers, utterly undistinguishable from the 'real thing'. The potential is, of course, nothing short of immense."

 TAK_alkroa_wargoal:0 "Expansion du Domaine: Alkroa"
 TAK_alkroa_wargoal_effect:0 "Lets us §YPlant Paintings§! in §Y[ALK.GetAdjective]§! core states, which will spring to life once war is declared. Also unlocks a decision to §Rdeclare war§! once ready."
 TAK_alkroa_wargoal_desc:0 "Alkroa is where the devilish Mockingbird's species originates from - it shall make a fine first target for the Roi's new ambitions..."

 TAK_aurelia_wargoal:0 "Expansion du Domaine: Aurélie"
 TAK_aurelia_wargoal_effect:0 "Lets us §YPlant Paintings§! in §Y[SPQ.GetAdjective]§! core states, which will spring to life once war is declared. Also unlocks a decision to §Rdeclare war§! once ready."
 TAK_aurelia_wargoal_desc:0 "Aurelia is yet another bird-infested place on the face of Solakea. It shall not stand for long, and will form a fine springboard onto southern Solakea."

 TAK_quepler_wargoal:0 "Expansion du Domaine: Quépler"
 TAK_quepler_wargoal_effect:0 "Lets us §YPlant Paintings§! in §Y[KEP.GetAdjective]§! core states, which will spring to life once war is declared. Also unlocks a decision to §Rdeclare war§! once ready."
 TAK_quepler_wargoal_desc:0 "Quépler is a rampant Roqualian colony facing constant struggles with both natives and Katzen colonists. The Roi shall exploit these divisions to bring them into his domain. "

 TAK_solaria_wargoal:0 "Expansion du Domaine: Solarie"
 TAK_solaria_wargoal_effect:0 "Lets us §YPlant Paintings§! in §Y[SLR.GetAdjective]§! core states, which will spring to life once war is declared. Also unlocks a decision to §Rdeclare war§! once ready."
 TAK_solaria_wargoal_desc:0 "Solaria is a place full of very smart people who would be able to teach the Roi's painters everything about advanced engineering. They shall be brought into the fold."

 TAK_roqualia_wargoal:0 "La Lutte Finale"
 TAK_roqualia_wargoal_desc:0 "The time has come! With Takicardie's population swollen to dozens of millions thanks to fresh new domains and a constant influx of loyal painting people, the Roi shall finally topple the hegemony of the degenerate Roqualians. And then... all their Roqualium... oh que oui!"
 TAK_roqualia_wargoal_effect:0 "Lets us §YPlant Paintings§! in §Y[ROQ.GetAdjective]§! core states, which will spring to life once war is declared. Also unlocks a decision to §Rdeclare war§! once ready."

 # TAK_roqualia_wargoal:0 "TAK_roqualia_wargoal"
 # TAK_roqualia_wargoal_desc:0 "Glorious Kayzoo!"

 TAK_the_new_charles:0 "The New Charles"
 TAK_the_new_charles_desc:0 "With the Charleslings now in great enough numbers... it is time for the Roi rebuild the great city of Charles into an even GREATER city - one whose very inhabitants are a constant reminder of his glory! With a fair share of every citizen being a living, walking reminder of the Roi's splendor, it will thus no longer be necessary to produce quite as many statues."

 TAK_war_economy:0 "Préparations de Guerre"
 TAK_war_economy_desc:0 "The time has come for the new and improved Takicardie to spread its win-, wait, no, let's not compare it to a bird... well, to embrace its future and seize what the Roi deserves."

 TAK_automaton_department:0 "Département de l'Automate"
 TAK_automaton_department_desc:0 "The Great Automaton is the pride of the Takicardian armed forces and the Roi's greatest asset. It is paramount that this crucial piece of Takicardian engineering be continually kept up-to-date with new technologies."
 TAK_automaton_department_effect_tt:0 "Unlocks §YDecisions§! to upgrade the §YAutomaton§! with new technologies."