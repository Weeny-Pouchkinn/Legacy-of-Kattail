 TAK_event.2004.t:0 "Refugees Fleeing the Burning of Corélie"
 TAK_event.2004.d:0 "Horrifying news reaches us from across the sea. The Takicardian forces have burned down the great city of Corélie, displacing over a million inhabitants in the process. Desperate refugees are now fleeing the devastation and arriving at our borders in droves, seeking shelter and a new life. While our hearts go out to these poor souls, the sudden influx of displaced peoples is straining our resources and causing unrest among the populace."
 TAK_event.2004.a:0 "We must help them as best we can..."
 TAK_event.2004.a.tt:0 "Each of our states gains a population of §G[?global.TAK_corelie_refugees_per_state|0]§!."

