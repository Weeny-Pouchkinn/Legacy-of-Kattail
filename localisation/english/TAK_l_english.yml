 TAK_infiltration_3:0 "This state currently has §Gmany§! paintings hiding amongst its populace. War declaration will spawn §Y3§! friendly divisions."

 TAK_painters_make_charles:0 "Order the painting of $TAK_painting_charles$\n§G[?TAK_painting_charles_weekly_per_painting_power]§! §YCharleslings§! and §G0.001§! §YNat. Myst.§! per $TAK_painting_power$"
 TAK_painters_make_charles_loc:0 "The Roi has ordered the painting of $TAK_painting_charles$, bringing forth §G[?TAK_painting_charles_weekly]§! §YCharleslings§! and §G[?TAK_fascism_drift_daily|3]§! §YDaily National Mysticist Support§!."

 TAK_painters_make_soldiers:0 "Order the painting of §RSoldiers§!\n§G[?TAK_weekly_manpower_per_painting_power]§! §YManpower§! and §G[?TAK_military_factory_donations_per_painting_power]§! §YMil. Factories§! per $TAK_painting_power$"
 TAK_painters_make_soldiers_loc:0 "The Roi has ordered the painting of §GSoldiers§!, alongside their equipment, generating §G[?TAK_weekly_manpower]§! §YWeekly Manpower§! and §G[?TAK_military_factory_donations]§! §YOffmap Military Factories§!."

 TAK_painters_make_propaganda:0 "Order the painting of §6Propaganda Troupes§!\n§G0.005%§! §YWeekly Stability§! per $TAK_painting_power$"
 TAK_painters_make_propaganda_loc:0 "The Roi has ordered the painting of §6Propaganda Troupes§!, generating §G[?TAK_stability_weekly|%]§! §YWeekly Stability§!."

 TAK_painters_make_war_propaganda:0 "Order the painting of §OWar Propaganda Troupes§!\n§G0.005%§! §YWeekly War Support§! per $TAK_painting_power$"
 TAK_painters_make_war_propaganda_loc:0 "The Roi has ordered the painting of §OWar Propaganda Troupes§!, generating §G[?TAK_war_support_weekly|%]§! §YWeekly War Support§!."

 TAK_enough_brushes:0 "There is a §Gsurplus§! of paintbrushes for all our painters!"
 TAK_just_right_brushes:0 "There are §Yjust enough§! paintbrushes for all our painters!"
 TAK_not_enough_brushes:0 "There are §Rinsufficient§! paintbrushes for all our painters!"

 TAK_recruit_painter_1_tt:0 "Gain a §RNovice§! §GPainter§! with a $TAK_painting_power$ of §Y3§!"

 TAK_recruit_painter_3_tt:0 "Gain a §OMediocre§! §GPainter§! with a $TAK_painting_power$ of §Y5§!."

 TAK_recruit_painter_5_tt:0 "Gain a §YGood§! §GPainter§! with a $TAK_painting_power$ of §Y7§!."

 TAK_recruit_painter_10_tt:0 "Gain a §7Talented§! §GPainter§! with a $TAK_painting_power$ of §Y9§!."

 TAK_recruit_painter_20_tt:0 "Gain a §3Legendary§! §GPainter§! with a $TAK_painting_power$ of §Y12§!."

 TAK_address_the_people:0 "Address the Masses"
 TAK_address_the_people_desc:0 "Change is in the air in Takicardie! The unenlightened masses must be informed of His Majesty's great plan for the nation's future..."

 TAK_think_about_greatness:0 "Contemplate Greatness"
 TAK_think_about_greatness_desc:0 "Actively having such a great plan for the future is a change of pace for the Roi. It is paramount for him to indulge in some... imperialist daydreaming as to bolster his motivation. All shall attend and see what Takicardie will soon be! This 'Kaiser Kattail' fellow which the Roi just learned about seems like a great source of inspiration..."

 TAK_a_necessary_evil:0 "A Necessary Evil"
 TAK_a_necessary_evil_desc:0 "The Roi has plans now, and those plans need manpower and industrial output. Some of the Roi-related paraphernalia production will thus have to be redirected elsewhere... for better or worse."

 TAK_develop_the_peripherie:0 "Build Up Outer Takicardie"
 TAK_develop_the_peripherie_desc:0 "Beyond the great city of Charles lies underused and sparsely-populated over which Takicardie only really holds tenuous control. These lands must be settled and invested into as to properly mark them as part of the Roi's territory... and to prepare them for things to come."

 TAK_agricultural_programs:0 "L'Agriculture du Roi"
 TAK_agricultural_programs_desc:0 "The Roi, in his ever-so-generous splendor, shall listen to his people's plea for additional food rations by hand-picking a lucky few amongst the neediest to cultivate the lands of Outer Takicardie."

 TAK_routes_du_roi:0 "Les Routes du Roi"
 TAK_routes_du_roi_desc:0 "The roads in Outer Takicardie are in such a terrible state that it right takes days for even motor vehicles to reach the border with Glitchopia. While this used to be part of Takicardie's ploy to avoid external disturbances, this state of affair is no longer acceptable, for the Roi cannot wait long!"

 TAK_petites_charles:0 "Les Petites Charles"
 TAK_petites_charles_desc:0 "The frontier settlements of Tak, Ikar and Die, which up until now have served as prison camps and dumps for undesirable exiles, shall be converted into proper cities resembling miniature versions of the capital city of Charles."

 TAK_develop_tak:0 "The Tak Dockyards"
 TAK_develop_tak_desc:0 "All great leaders specialize their lands, and so shall the Roi transform the small city of Tak into an assembly plant for small-scale ship components."

 TAK_flotte_du_roi:0 "La Flotte du Roi"
 TAK_flotte_du_roi_desc:0 "While Takicardie has a fleet, it mostly consists of outdated vessels meant to fire pot-shots at oncoming vessels. This is not worthy of His Majesty's glory - the Flotte du Roi shall be rebuilt to modern standards!"

 TAK_des_gros_cannons:0 "Des Gros Cannons..."
 TAK_des_gros_cannons_desc:0 "The buoyancy of water allows for vessels to carry truly gargantuan artillery pieces, whose destructive potential is only matched by the Roi's ambitions. Takicardie's finest engineers shall be tasked with designing these pieces."

 TAK_des_gros_vaisseaux:0 "...Sur De Gros Bateaux"
 TAK_des_gros_vaisseaux_desc:0 "The Roi holds the firm belief that the bigger a ship, the stronger it is. And of course, he is right! This simple rule is what shall help the Flotte du Roi become the fiercest flotilla in the Solakean Sea!"

 TAK_lay_down_the_charles:0 "Lay Down the Super-Charles"
 TAK_lay_down_the_charles_desc:0 "All great leaders have a great flagship they can rally their armies behind. While on land, this role is obviously fulfilled by the mighty Automate, the Flotte du Roi needs an equally intimidating vessel of war to spearhead its assaults onto enemy waters. The Super-Charles is thus to be a massive, three-hundred-meters long superheavy battleship equipped with the latest railgun weaponry 'inspired' from Alkroa."

 TAK_develop_ikar:0 "Ikar Weapons Testing Site"
 TAK_develop_ikar_desc:0 "The hillside settlement of Ikar provides an ideal vantage point for the Roi to observe his engineers hard at work testing out and building new weaponry. Arms workshop shall thus be constructed here to exploit this opportunity."

 TAK_develop_die:0 "Heavy Industry in Die"
 TAK_develop_die_desc:0 "If the Roi wants Takicardie to be able to fulfill his great projects, he will need equally great industry. Unfortunately, the structure of Charles complicates the installation of some heavier types of industry, and as such these shall be built around the settlement of Die."

 TAK_mines_du_roi:0 "Les Mines du Roi"
 TAK_mines_du_roi_desc:0 "Just as the Roi hungers for the finest of delicacies, so does Takicardie hunger for the finest of resources. The peasants and exiles who though they could seek refuges in Outer Takicardie shall be put to work wrangling the sustenance necessary to feed the Takicardian machine from the very earth!"

 TAK_bulk_housing:0 "Standardized Housing"
 TAK_bulk_housing_desc:0 "While it is unconceivable to get rid of Charles' unique architectural style, it is nonetheless going to be necessary to standardize building codes throughout Takicardie as to streamline construction. Fret not - for the Roi shall still approve each and every one of these code to make sure they properly compliment Charles' glory."

 TAK_figure_it_out:0 "Establish Painting Methods"
 TAK_figure_it_out_desc:0 "If the Roi is to accomplish anything with his painting-related plans, it will first be necessary to define methods and protocols for mass-producing paintings, as well as figure out what exactly it is that allows a painting to turn alive."
 TAK_figure_it_out_tt:0 "Unlocks §YDecisions§! to §Ypaint§! a variety of useful things for Takicardie!"

 TAK_painting_factory:0 "Paintbrush Foundries"
 TAK_painting_factory_desc:0 "The Roqualium necessary to construct magical paintbrushes is an extremely tough material which is to be worked and shaped with utmost precision and care as to not damage its properties. Specialized foundries shall be established for this task."
 TAK_paintbrush_foundry:0 "Royal Paintbrush Foundries"

 TAK_recruit_painters:0 "Painter Recruitment Program"
 TAK_recruit_painters_desc:0 "The Roi, while he could certainly use his endless talent to paint, is far too busy to do such a thing. Instead, a vast recruitment program shall bring in the finest artists of Takicardie to work on the Roi's grandiose project. Anyone caught incorrectly drawing him cross-eyed will however be swiftly expunged."
 TAK_recruit_painters_effect_tt:0 "Allows us to recruit extra §GPainters§!, once per controlled state."

 TAK_painter_education:0 "Educate the Painters"
 TAK_painter_education_desc:0 "In order for a painting to come alive, it is necessary for its painter to have understood every element of its composition. Our great painters shall thus be educated in the sciences as well as the arts in order to expand their creative possibilities."

 TAK_learn_about_it_all:0 "Learn About It All"
 TAK_learn_about_it_all_desc:0 "If the Roi is to mass produce platoons of soldiers equipped with guns and artillery, it will be necessary for the painters to actually understand how military equipment work, as any weapon painted without proper understanding comes out as little more than a useless decorative hulk of metal. Guns and cannons shall be purchased from all corners of the worlds as to study their inner workings."

 TAK_scrounge_for_roqualium:0 "Scrounge For Roqualium"
 TAK_scrounge_for_roqualium_desc:0 "It is a known fact that a delicate inspection of Roqualian infrastructure will sometimes reveal small chunks of Roqualium lodged within cast metal or concrete structures. These traces must be found and converted into Paintbrushes, no matter how many houses have to be take apart!"

 TAK_scrounge_for_roqualium_harder:0 "Gather Every Last Scrap"
 TAK_scrounge_for_roqualium_harder_desc:0 "Did the Roi stutter? A N Y T H I N G  that can contain Roqualium will be taken apart and inspected! No exceptions!\n\nExcept if it's the Roi's apartments, of course."

 TAK_the_roqualian_form:0 "Study the Roqualian Form"
 TAK_the_roqualian_form_effect_tt:0 "Allows §GPainters§! to create §YManpower§! and serve as §YMilitary Factories§! by painting platoons of soldiers."
 TAK_the_roqualian_form_desc:0 "It is one thing to paint pretty performers and dancers, but another to create physically-apt soldiers fully capable of wielding weapons of war. Our artists shall be taught every aspect of the Roqualian body, as to be able to paint the finest and greatest soldiers the world has seen!"

 TAK_officially_open_up:0 "Open Up to the World"
 TAK_officially_open_up_desc:0 "With Takicardie in a more favorable state capable of leveraging its assets, and the Roi much more well-informed about the rest of the world, it is now time to officially end its isolation and join the vast theater of Flusioniean nations, not as an outcast, but as an equal."

 TAK_a_royal_voyage:0 "A Royal Visit of All Roqualias"
 TAK_a_royal_voyage_desc:0 "The Roqualian species exists far beyond the confines of Takicardie, spanning Solakea in its entirety and even having conquered the north of Oshia. As to earn their trust and position himself as a potential Roqualian partner for the time being, the Roi shall pay a visit to all these nations."
 TAK_a_royal_voyage_tt:0 "A §YRoyal Visit§! will be offered to all §YRoqualian§! nations upon §Ystarting§! this focus!"

 TAK_roqualium_purchase:0 "Purchase Roqualium"
 TAK_roqualium_purchase_desc:0 "Takicardie's Roqualium supply pales in comparison to that of its far larger northern cousin. Do they really use all of it? Perhaps there is a way to negotiate some sort of agreement to equalize things a little more."

 TAK_recruit_the_best:0 "Appeal to Foreign Painters"
 TAK_recruit_the_best_desc:0 "The people of Takicardie may be great, but their skills alone won't suffice to fulfill the Roi's ambitions. Foreign painters shall be encouraged to move to Takicardie thanks to extensive grants and exclusive Roi-styled manors promised to any skilled overseas artists willing to move to Charles."
 TAK_recruit_the_best_effect_tt:0 "Lets us recruit §GPainters§! from other §YSolakean nations§!, once per nation. Having §Yhigher opinion§! with said nation will increase the odds of getting a skilled painter."

 TAK_conceive_the_charlesling:0 "Conceive the Charlesling"
 TAK_conceive_the_charlesling_desc:0 "With the world's artistic elite - or at least some of it - now working for the Roi, it is time to create the 'ultimate' citizen to fill the streets of greater Takicardie with. Dubbed 'Charleslings', they shall resemble the glorious Roi in every aspect - save for his incredible intellect, of course, for it obviously cannot be imitated."
 TAK_conceive_the_charlesling_tt:0 "Allows painters to create $TAK_painting_charles$, near-perfect copies of the Roi aligned with his own beliefs and ideas, which will be used to ensure compliance."

 TAK_perfect_imitation:0 "Perfect Imitations"
 TAK_perfect_imitation_desc:0 "Earlier painting creatures often featured rather obvious flaws - oddly asymmetrical faces, incorrect proportions, or a generally 'unnatural' or 'uncanny' look. Now, however, techniques have improved sufficiently to allow for the creation of true painting doppelgangers, utterly undistinguishable from the 'real thing'. The potential is, of course, nothing short of immense."
 TAK_perfect_imitation_tt:0 "All our currently recruited §GPainters§! gain §Y3§! $TAK_painting_power$."

 TAK_alkroa_wargoal:0 "Expansion du Domaine: Alkroa"
 TAK_alkroa_wargoal_effect:0 "Lets us §YPlant Paintings§! in §Y[ALK.GetAdjective]§! core states, which will spring to life once war is declared. Also unlocks a decision to §Rdeclare war§! once ready."
 TAK_alkroa_wargoal_desc:0 "Alkroa is where the devilish Mockingbird's species originates from - it shall make a fine first target for the Roi's new ambitions..."

 TAK_corelie_wargoal:0 "Expansion du Domaine: Corélie"
 TAK_corelie_wargoal_effect:0 "Lets us §YPlant Paintings§! in §Y[CRE.GetAdjective]§! core states, which will spring to life once war is declared. Also unlocks a decision to §Rdeclare war§! once ready."
 TAK_corelie_wargoal_desc:0 "Corélie is yet another bird-infested place on the face of Solakea. It shall not stand for long, and will form a fine springboard onto southern Solakea."

 TAK_quepler_wargoal:0 "Expansion du Domaine: Quépler"
 TAK_quepler_wargoal_effect:0 "Lets us §YPlant Paintings§! in §Y[KEP.GetAdjective]§! core states, which will spring to life once war is declared. Also unlocks a decision to §Rdeclare war§! once ready. We can also attack the §Y[PLA.GetName]§!, but their forms of art are too different for the paintings to be viable."
 TAK_quepler_wargoal_desc:0 "Quépler is a rampant Roqualian colony facing constant struggles with both natives and Katzen colonists. The Roi shall exploit these divisions to bring them into his domain. "

 TAK_solaria_wargoal:0 "Expansion du Domaine: Solarie"
 TAK_solaria_wargoal_effect:0 "Lets us §YPlant Paintings§! in §Y[SLR.GetAdjective]§! core states, which will spring to life once war is declared. Also unlocks a decision to §Rdeclare war§! once ready."
 TAK_solaria_wargoal_desc:0 "Solaria is a place full of very smart people who would be able to teach the Roi's painters everything about advanced engineering. They shall be brought into the fold."

 TAK_roqualia_wargoal:0 "La Lutte Finale"
 TAK_roqualia_wargoal_desc:0 "The time has come! With Takicardie's population swollen to dozens of millions thanks to fresh new domains and a constant influx of loyal painting people, the Roi shall finally topple the hegemony of the degenerate Roqualians. And then... all their Roqualium... oh que oui!"
 TAK_roqualia_wargoal_effect:0 "Lets us §YPlant Paintings§! in §Y[ROQ.GetAdjective]§! core states, which will spring to life once war is declared. Also unlocks a decision to §Rdeclare war§! once ready."

 TAK_break_roqualia:0 "Pull the Titan Apart"
 TAK_break_roqualia_desc:0 "Roqualia's vast lands feature a myriad of regional identities, some of which aren't too happy to be amalgamated into the greater Roqualian state. By strategically replacing key assets within those states with collaborators and theming our infiltrated paintings around regional liberation, we can covertly provoke these states into revolt upon our declaration of war with Roqualia."
 TAK_break_roqualia_tt:0 "Lets us §YSupport the Independence§! of various §YRoqualian Regions§!, provided our infiltration level is sufficient in the relevant states. Once we go to war with Roqualia, these states will §Rrebel§! against it.\nWe can do this with up to §Y4§! regions.\n§RHowever, they will have no tie with us, and we will still have to conquer them ourselves afterwards!§!"

 # TAK_roqualia_wargoal:0 "TAK_roqualia_wargoal"
 # TAK_roqualia_wargoal_desc:0 "Glorious Kayzoo!"

 TAK_the_new_charles:0 "La Takicardie, C'est Moi!"
 TAK_the_new_charles_desc:0 "With the Charleslings now in great enough numbers... it is time for the Roi rebuild the great city of Charles into an even GREATER city - one whose very inhabitants are a constant reminder of his glory! With a fair share of every citizen being a living, walking reminder of the Roi's splendor, it will thus no longer be necessary to produce quite as many statues."

 TAK_war_economy:0 "Préparations de Guerre"
 TAK_war_economy_desc:0 "The time has come for the new and improved Takicardie to spread its win-, wait, no, let's not compare it to a bird... well, to embrace its future and seize what the Roi deserves."

 TAK_automaton_department:0 "Département de l'Automate"
 TAK_automaton_department_desc:0 "The Great Automaton is the pride of the Takicardian armed forces and the Roi's greatest asset. It is paramount that this crucial piece of Takicardian engineering be continually kept up-to-date with new technologies."
 TAK_automaton_department_effect_tt:0 "Unlocks §YDecisions§! to upgrade the §YAutomaton§! with new technologies."

 TAK_greater_takicardie:0 "His Majesty's Great Takicardie"
 TAK_greater_takicardie_desc:0 "At LAST! With the degenerate Roqualians crushed under the Roi's mighty painting armies... his Majesty's once-ludicrous dream of a greater Takicardie spanning from Oueston to Morréaux is finally at hand."
 TAK_greater_takicardie_completion_tt:0 "The Roi's domain shall now encompass §YWestern Roqualia§!, §YGlitchtopia§! and §YAlkroa§!! We will be able to §Ycore§! them in due time."

 TAK_native_puppets:0 "Native-Led Domains"
 TAK_native_puppets_desc:0 "To let Charleslings outright lead nations is a... dangerous idea. There is only one Roi, and that is... moi!"
 TAK_native_puppets_tt:0 "Unlocks §YDecisions§! to establish a variety of §YPuppet States§! throughout Roqualia and Solakea."

 TAK_charles_puppets:0 "Charlesling-Led Domains"
 TAK_charles_puppets_desc:0 "With the Roi's domain swelling tremendously in size, it is now necessary to appoint loyal governors to lead these new lands. And what better fit for the job than the glorious Charleslings themselves?"
 TAK_charles_puppets_tt:0 "Unlocks §YDecisions§! to establish a variety of §YPuppet States§! throughout Roqualia and Solakea. These will cost §Y5,000§! $TAK_painting_charles$ to establish each, but will provide more of their industry."

 TAK_charlesling_vanguard:0 "His Majesty's Peacekeeping Vanguard"
 TAK_charlesling_vanguard_desc:0 "With a steady supply of Charlesling now in the Roi's possession, it is a most worthwhile endeavor to regularly deploy these royal copies to occupied territories as to properly oversee the integration process."
 TAK_charlesling_vanguard_tt:0 "Lets us deploy §YCharlesling Vanguards§! to occupied states in order to boost §YCompliance§! and decrease §YResistance§!."

 TAK_brain_drain:0 "Aspiration des Cerveaux"
 TAK_brain_drain_desc:0 "As His Majesty now lords over much of reshaped Solakea, erstwhile academic structures have all but collapsed, leaving millions of bright minds without a place to exercise their talents. So the Roi shall, of course, provide them with one."

 TAK_a_united_realm:0 "A United Realm"
 TAK_a_united_realm_desc:0 "Given just how much Takicardise has expanded, it is paramount that all measures be taken to ensure its cohesion lest it suffers the same fate as other bloated empires in the past. That would never happen though, for the Roi is great, after all."

 TAK_many_many_charles:0 "The Many-Charles Program"
 TAK_many_many_charles_desc:0 "Takicardie's new domain is home to dozens of millions who need food and shelter. It would be ludicrous to try and maintain the same centralization which characterized lesser Takicardie. Rather, it would be wise to expand the 'Petite Charles' program to the entirety of these new lands, condensing local populations into rebuilt cities."
 TAK_many_many_charles_tt:0 "Lets us build §YLesser Charles§! in conquered states as to help §Ycore them§!."

 TAK_everything_on_charles:0 "One King, One Charles"
 TAK_everything_on_charles_desc:0 "It would be foolish to let the Roi's millions of new subjects continue their lives far away from his watchful gaze. Massive population transfer and construction programs shall be enacted to transform what used to be lesser Takicardie into a singular megalopolis home to dozens of millions."
 TAK_everything_on_charles_tt:0 "Lets us §Yconcentrate§! the population and industry of conquered states onto §YCharles§! itself."

 TAK_katzen_wargoal:0 "Expansion du Domaine: Chalsace"
 TAK_katzen_wargoal_desc:0 "In the Solakean Northeast there lives a bunch of Challemands, a militaristic and rowdy bunch hellbent on expanding the boundaries of Challemagne onto our beloved continent. A stop must be put to their machinations!"
 TAK_katzen_wargoal_effect:0 "Lets us §YPlant Paintings§! in §Y[FSR.GetAdjective]§!, §Y[DOM.GetAdjective]§!, §Y[NEK.GetAdjective]§! and §Y[KUS.GetAdjective]§! core states, which will spring to life once war is declared. Also unlocks a decision to §Rdeclare war§! once ready."


 TAK_rustalia_wargoal:0 "Expansion du Domaine: Rustalie"
 TAK_rustalia_wargoal_desc:0 "The great island of Rustalie lies just north of the Roqualian shoreline, and is a despicable breeding ground of leftist, anti-Roi ideologies which will surely spread to his domain if left to fester unchecked."
 TAK_rustalia_wargoal_effect:0 "Lets us §YPlant Paintings§! in §Y[RST.GetAdjective]§! core states, which will spring to life once war is declared. Also unlocks a decision to §Rdeclare war§! once ready."

 TAK_train_officers:0 "Royal Officer Training"
 TAK_train_officers_desc:0 "What use are our millions of painting-people if they are led by buffoons? Our very real officers must be taught all there is to know about military strategy."

 TAK_scrap_dofus:0 "Dismantle Roqualian Leadership"
 TAK_scrap_dofus_desc:0 "Dofus, Saxeton and Sonya, former heads of the Roqualian state, now lay defeated before us. For decades they have done naught but belittle and spit in the face of the Roi, and now they shall pay the ultimate price! Their Roqualium frames shall be dismantled and melted down into precious Roqualium Paintbrushes to fuel Takicardie's rising momentum!"

 TAK_statue_bombs:0 "Retool Statue Factories"
 TAK_statue_bombs_desc:0 "As to meet rising military-industrial needs, the hundreds of factories producing statues of the Roi will be upgraded to produce explosive effigies fit for use as artillery shells."

 TAK_superior_firepower:0 "Puissance de Feu"
 TAK_superior_firepower_desc:0 "It is better to focus on painting equipment rather than soldiers. The Roi's opponents shall be wiped away by the largest weaponry this world has seen!"

 TAK_roi_milices:0 "Milices Royales"
 TAK_roi_milices_desc:0 "Painting soldiers is all well and good, but our army also needs the original inhabitants of Takicardie to put in some elbow grease. Specialized militias shall be formed out of handpicked volunteers."

 TAK_painting_spam:0 "Des Millions de Tableaux"
 TAK_painting_spam_desc:0 "Painting soldiers and people is something our painters are more used to, as opposed to bleak lifeless weaponry. This is what shall thus be focused on."

 TAK_ecole_militaire:0 "Ecole Militaire du Roi"
 TAK_ecole_militaire_desc:0 "Painting-people, even when intended to be educated, often come out completely bereft of basic knowledge. It is thus necessary to both educate them, as well as the officers that will be marching them into battle. A specialized military school shall thus be created for these purposes."

 TAK_nuclear_power:0 "Exploit the 'Roches Chatouilleuses'"
 TAK_nuclear_power_desc:0 "The barren plains of Tak and Ikar are known to harbor small concentrations of slightly greenish minerals known as 'Roches Chatouilleuses' or 'Tickling Rocks', after the tickling sensation they produce when held. Recent breakthroughs have however revealed these to be a tremendous source of power! They must be exploited at once."

 TAK_build_power_plants:0 "Found ROITOME"
 TAK_build_power_plants_desc:0 "The rest of the world figured out long ago that splitting the atom yields tremendous quantities of energy. And now, so shall we! Takicardie's finest scientists shall be regrouped under ROITOME, a organization tasked with brightening Charles with the power of the atom."

 TAK_make_nukes:0 "La Grande Bombe"
 TAK_make_nukes_desc:0 "The power produced by tickling rocks is such that a weapon could conceivably be created using the- 'WHAT ARE YOU WAITING FOR??? MAKE IT ALREADY!!'"

 TAK_towards_fusion:0 "A Step Further"
 TAK_towards_fusion_desc:0 "Even further forays into nuclear science reveal that fusing the elements that make up plain water yields orders of magnitude more power than tickling rocks! We're not sure how it is meant to work, but the Roi wants it figured out yesterday!"

 TAK_overseas_department: "Comité de Gestion d'Outre-Takicardie"
 TAK_overseas_department_desc: "With his Majesty's domain now encompassing lands beyond just Takicardie, we must set up the necessary administration to handle and develop these new realms for the glory of the Roi!"
 TAK_overseas_department_idea:0 "Comité de Gestion d'Outre-Takicardie"
 
 TAK_solaria_ports: "Ports Royaux de Solarie"
 TAK_solaria_ports_desc: "Solaria has a lot of ports already, but the creation of new, dedicated "royal" ports for royal supplies and business will help streamline our occupation."
 TAK_quepler_ports: "Ports Royaux de Quepler"
 TAK_quepler_ports_desc: "We shall create ports all alongside Quepler's coastline, used exclusively for Roi-related matters, such as occupation and the shipping of great statues from Takicardie."
 
 TAK_bridge_solakean_gap: "The Great Roilway"
 TAK_bridge_solakean_gap_desc:0 "Solaria and Quepler may occupy opposite shores, but this is merely a cartographic objection to the Roi's sense of order. Rails, ferries, and royal causeways shall be joined into one magnificent Roilway from Quepler's crown to the Solarian ports. The Solakean Gap will remain on lesser maps; His Majesty's trains will cross it regardless."

 TAK_hire_solarian_city_planners: "Hire Solarian City Planners"
 TAK_hire_solarian_city_planners_desc:0 "Solarian architects have spent generations arranging millions of citizens into efficient towers, transit grids, and very ugly rectangles. Their disdain for royal ornament is regrettable, but their command of scale is undeniable. Suitable experts will be offered positions in Charles-under close artistic supervision, naturally."

 TAK_the_great_nuclear_paintbrush_foundry: "Nuclear-Powered Paintbrush Foundries"
 TAK_the_great_nuclear_paintbrush_foundry_desc:0 "A common furnace can shape only so many Roqualium handles before its tools warp and its workers begin glowing in unapproved colors. At Solity, Solarian reactors and Takicardian artistry will feed a foundry built for uninterrupted brush production. One atom at a time, the Roi shall paint an army."
 TAK_solarian_paintbrush_foundry:0 "Solity Paintbrush Foundry"

 TAK_remodel_solarian_cities: "Remodel Solarian Brutalism"
 TAK_remodel_solarian_cities_desc:0 "Solarian brutalism is an impressive triumph of concrete over joy. Its endless slabs are sturdy, rational, and almost entirely bereft of statues of the Roi. Our new planners will preserve the useful bones, pierce the gray façades with boulevards and workshops, and introduce every public square to the face it has been missing."

 TAK_scrounge_for_roqualium_in_solaria: "Extract All Solarian Roqualium"
 TAK_scrounge_for_roqualium_in_solaria_desc:0 "The Solarians buried traces of Roqualium in bridges, laboratories, foundations, and machines with no regard for their future use as paintbrushes. Surveyors have identified the richest concentrations beneath infrastructure the locals insist is essential. Essential to whom? The Roi has paintings to finish."

 TAK_a_new_charles_in_quepler: "A New Charles in Quepler"
 TAK_a_new_charles_in_quepler_desc:0 "Quepler's fractured colonies possess many capitals and therefore, by definition, no proper one. Around the royal port we shall raise Charlesorke: a Petite Charles grand enough to govern the peninsula, receive its displaced inhabitants, and remind every ship entering the harbor whose profile now defines the horizon."

 TAK_remodel_the_dam: "Redecorate the Great Dam"
 TAK_remodel_the_dam_desc:0 "The Great Lake Dam is a wonder of engineering, but its builders neglected the equally important task of making it look like the Roi. New spillways shall trace His Majesty's moustache, the turbine halls will form his smile, and a crowned façade will ensure even the water bows before generating power."

 great_lake_dam_destroyed:0 "The Great Lake Dam has been destroyed"

 TAK_a_second_charles_on_quepler_crown: "A Second Charles for the Queplerite Crown"
 TAK_a_second_charles_on_quepler_crown_desc:0 "Charlesorke has brought royal order to the coast, yet the Queplerite interior still looks elsewhere for direction. At the peninsula's crown we shall raise Charleslylone, twin capital of the northern marches. Between two cities bearing one glorious face, there will be nowhere left for the old patchwork to hide."

 TAK_a_new_charles_in_alkroa: "A New Charles in Alkroa"
 TAK_a_new_charles_in_alkroa_desc:0 "Alkroa gave the Mockingbird a nest; it shall now provide the Roi with a pedestal. The population will be gathered around a rebuilt capital named Charleskroa, its avenues laid for parades rather than flight and its harbor watched by a monumental likeness whose stone eyes never blink."

 TAK_burn_down_corelie: "Cracking the Corélien Nut"
 TAK_burn_down_corelie_desc:0 "Corélie's cramped streets, stubborn inhabitants, and innumerable hiding places have made the city a hard nut for the royal occupation to crack. The Roi proposes the direct solution: crack it with fire. When the birds and their sympathizers flee the ashes, nothing will remain to shelter resistance-or obstruct the view of the next statue."

 TAK_hunt_the_mockingbird: "Hunt the Mockingbird"
 TAK_hunt_the_mockingbird_desc:0 "The Mockingbird humiliated the Roi, stole his paintings, and turned his own palace against him. No frontier is distant enough and no mountain nest high enough to erase such an insult. Alkroa will be combed feather by feather until that shrill traitor is caged and brought before the only audience that matters."

 TAK_the_bird_march: "La Marche des Oiseaux"
 TAK_the_bird_march_desc:0 "With the Mockingbird silenced and Charleskroa rising from his homeland, the Roi may at last compose the final movement of his avian problem. Painted battalions will march from nest to nest, replacing the squabbling bird realms with one orderly royal domain. It will be a magnificent procession-provided nobody calls it a migration."

 TAK_all_is_well:0 "All is Well in Takicardie"
 TAK_all_is_well_desc:0 "All is Well in Takicardie. The Roi sits atop all, and this has no reason to change. After all, why would it?"
 TAK_all_is_well_tt:0 "$TAK_all_is_well_desc$"

