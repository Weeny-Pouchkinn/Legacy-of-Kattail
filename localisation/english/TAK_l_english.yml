l_english:
 TAK_Vive_le_roi: "Vive le Roi!"
 TAK_Vive_le_roi_desc: "Life in Takicardie is exclusively governed by His Majesty's whims and desires. He holds absolute power over society, and anyone who dares disagree is swiftly disappeared via an extensive network of trapdoors scattered throughout Takicardie. Vive le Roi!"
 TAK_Industrie_du_roi: "L'Industrie du Roi"
 TAK_Industrie_du_roi_desc: "Nearly the entirety of Takicardie's industrial output is directed towards the creation and rafinment of an endless amount of Roi-related trinkets, decorations and buildings. New statues of His Majesty are built almost every day, often to be torn down in the next month to make way for even larger ones. This, obviously, leaves little for actual industrial and societal development..."
