 lok_ki_element_3_tooltip:0 "§Y[FROM.GetName]§! was administered as part of §YSchutzzone Galoppieren§!.\n§LControl over the soaring and roaming Cloudstriders was never as absolute as Kattail would have liked. Nonetheless, Katzen occupation was disturbing enough to dissolve the existing Cloudstrider realms and allow for a new united polity to emerge after the Collapse.§L"
