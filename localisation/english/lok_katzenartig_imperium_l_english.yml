 lok_ki_element_35_name:0 "Puffiland"
 lok_ki_element_35_tooltip:0 "[FROM.GetName] remained administered by §YPuffiland§!.\n§LHoping to spare himself difficult conquests at the extreme edge of Flusionea, Kattail covertly orchestrated a near-complete corporate takeover of Puffiland by bankrolling friendly megacorporations. This was not sufficient to make Puffiland into a full-blown ally or puppet during the Crusade, but it nonetheless remained Kattail's only trading partner and foreign military partner. This was much to the dismay of Ariveojo and Laurandar, who were frequently bombed by Katzen aircraft taking off from Puffilandian airfield. Nowadays the Puffilandian government continues to shift the blame for any damage done upon the megacorporations and Katzen meddling. "
 lok_ki_element_35_tooltip_delayed:0 ""
