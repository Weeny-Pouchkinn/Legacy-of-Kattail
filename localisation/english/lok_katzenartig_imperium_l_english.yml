 lok_ki_element_34_tooltip:0 "§Y[FROM.GetName]§! was administered as part of the §YNouvel Etat Roqualien§!, a collaborator state.\n§LLands of the Southern Solakean Sea were awarded to the Nouvel Etat Roqualien as a reward for their collaboration.§!"
