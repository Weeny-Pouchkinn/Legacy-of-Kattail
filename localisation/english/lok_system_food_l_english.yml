 LOK_food_management_cat:0 "Food Management"
 LOK_food_management_cat_desc:0 "Most species need food to survive. If their needs aren't fully met, we will suffer general §Rpenalties§! scaling to the direness of the famine. Our population will start to §Rdie out§! if their needs are less than §Y50%§! met, until they are met again.\n\nOur §2stockpile§!, determined by §YInfrastructure§! and §YFood Silos§!, will store any excess food and will be used up if our production ever fails to fully sustain our population.\n\nOur population of §Y[?ROOT.max_manpower_k|0]k§! is consuming §Y[?ROOT.country_food_consumption]§! food each week.\nWe are producing §Y[?ROOT.country_food_production]§! in total (§Y[?ROOT.country_food_imports]§! imported).\nOur food balance is thus §Y[?ROOT.country_food_balance]§! with §Y[?ROOT.country_food_needs_met_perc]%§! of our needs being met.\nOur stockpile is §Y[?ROOT.country_food_stockpile]§! out of §Y[?ROOT.country_food_stockpile_max]§!"
 lok_food_tracker_value_text:0 "[?country_food_balance|=0+] ([?ROOT.country_food_needs_met_perc]%)"
 lok_food_tracker_stockpile_text:0 "[?country_food_stockpile]/[?country_food_stockpile_max]"
 lok_food_tracker_tooltip:0 "§YFood Production§!\nWe are producing §Y[?ROOT.country_food_production]§! food weekly (§Y[?ROOT.country_food_imports]§! imported).\nOur §Y[?ROOT.max_manpower_k|0]k§! citizens are consuming §Y[?ROOT.country_food_consumption]§! weekly.\nOur food balance is thus §Y[?ROOT.country_food_balance]§! with §Y[?ROOT.country_food_needs_met_perc]%§! of our needs being met.\n\nMost species need food to survive. If their needs aren't fully met, we will suffer general §Rpenalties§! scaling to the direness of the famine. Our population will start to §Rdie out§! if their needs are less than §Y50%§! met, until they are met again.\n\nOur §2stockpile§!, determined by §YInfrastructure§! and §YFood Silos§!, will store any excess food and will be used up if our production ever fails to fully sustain our population."
 lok_food_stockpile_tooltip:0 "§YFood Stockpile§!\nOur food stockpile is §Y[?ROOT.country_food_stockpile]§! out of §Y[?ROOT.country_food_stockpile_max]§!.\nWe can increase with §YFood Silos§! (50 capacity per) and §YInfrastructure§! (10 capacity per)."
