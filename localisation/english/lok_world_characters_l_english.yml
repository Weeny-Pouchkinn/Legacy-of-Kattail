 CRE_Jacques_Porter:0 "Jacques Porter"
 CRE_Jacques_Porter_DESC:0 "31st Prime Minister of the Repulic of Corélie, Jacques Porter lead's the island people of Corélie out of the Era of the Crusade.\n\nHe looks toward his second term with hesitation... The world still burns from the aftermath of the Crusade, and it's unlikely it will cool down any time soon... He just hopes Corélie will survive unscathed..."

