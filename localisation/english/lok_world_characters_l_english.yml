 FLE_Alebarksy_Achkosov:0 "Alebarksy Achkosov"
 FLE_Alebarksy_Achkosov_Desc:0 "Alebarksy Achkosov, a veteran of both the Invasion of Sobakiland and later it's Liberation where he was said to personally lead the rebellion of Blasterburg and the capture of the Imperial 19th Fleet that was moored at the port, now leads the restored 11th Marine Corps of the Sobaki People's Liberation Navy. While the mainland has been liberated and the Imperial Anarchy has been pushed back to the other side of the Blasterian Canal, Imperial Remnants still lie active in the west.\n\nLieutenant-General Alebarksy has been tasked with liberating the people of Mount Fleather from the imperialist paws of the Katzen Collaborators and the Feudalistic Tribes that have seized power in the chaos of the collapse."
 FLE_Greatbeak_The_Third:0 "Greatbeak The Third"
 FLE_Greatbeak_The_Third_Desc:0 "Famed War Hero and Chief of the Skypeak Tribe, Greatbeak the Third has been named by the Tribal Assembly to serve as its first Grand Chief. While he has cast off the yoke of the Katzen Oppressor, imperialists from Mercuria and Sobakiland rain down seeking to \"Liberate\" us from ourselves!\n\nLike the Katzen's before, Grand Chief Greatbeak will fight beak and talon to see Mount Fleather be free.\n\nPortrait Source: Kitbash by DecentNameHere"
 FLE_Tulia_Korzyn:0 "Tulia Korzyn"
 FLE_Tulia_Korzyn_Desc:0 "Lieutenant-General Tulia Korzyn of the Royal Mercurian Navy has been tasked with conquering the isle of Fleatherland. The King fears the Katzen collaborators or the Sobaki Revolutionaries taking control of the island and the projection it gives them over the Sun Sea. However, the support Tulia expected on his arrival to the island has been redirected, the homeland lies under attack from the mechanical invaders. He must finish his mission swiftly so he may rejoin the fight at home."

