 KUS_PIONEERING_TECHNOCRATS:0 "Pioneering Technocrats"
 KUS_PIONEERING_TECHNOCRATS_desc:0 "The Technocratic Council guides the nation's development with scientific precision."
 KUS_SINGULARITY:0 "Singularity"
 KUS_SINGULARITY_desc:0 "The technological singularity has been achieved. Our research capabilities are beyond anything the world has ever seen."

