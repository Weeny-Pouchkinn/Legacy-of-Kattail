 # National Spirit Names/Descriptions
 KUS_economic_rebound:0 "Economic Rebound"
 KUS_economic_rebound_desc:0 "The economy is experiencing a period of rapid growth as accumulated reforms take effect."
 KUS_solid_foundation:0 "Solid Foundation"
 KUS_solid_foundation_desc:0 "A strong industrial base has been established, providing lasting benefits to the nation's productive capacity."
 KUS_bureau_of_state_industry:0 "Bureau of State Industry"
 KUS_bureau_of_state_industry_desc:0 "A centralized bureau coordinates state industrial efforts, improving construction efficiency."
 KUS_bureau_of_state_industry_2:0 "Bureau of State Industry"
 KUS_bureau_of_state_industry_2_desc:0 "A centralized bureau coordinates state industrial efforts, with particular focus on arms production."
 KUS_bureau_of_state_industry_3:0 "Bureau of State Industry"
 KUS_bureau_of_state_industry_3_desc:0 "A centralized bureau coordinates state industrial efforts with expanded authority over both construction and arms production."
 KUS_military_industrial_complex:0 "Military Industrial Complex"
 KUS_military_industrial_complex_desc:0 "The integration of military and civilian industry under centralized coordination maximizes national productive output."
 KUS_bureau_of_resource_extraction:0 "Bureau of Resource Extraction"
 KUS_bureau_of_resource_extraction_desc:0 "A dedicated bureau manages resource extraction operations across the confederation."
 KUS_fine_tuned_industry:0 "Fine-Tuned Industry"
 KUS_fine_tuned_industry_desc:0 "Rapid economic reforms have fine-tuned industrial production, particularly in the military sector."
 KUS_military_industrial_complex_rapid:0 "Military Industrial Complex"
 KUS_military_industrial_complex_rapid_desc:0 "The integration of military and civilian industry under centralized coordination maximizes national productive output."
 KUS_private_enterprise:0 "Private Enterprise"
 KUS_private_enterprise_desc:0 "Support for private enterprises has spurred innovation in weapons and support equipment research."
 KUS_synthetic_polymers:0 "Synthetic Polymers"
 KUS_synthetic_polymers_desc:0 "Development of synthetic polymer production has increased output from refineries."

