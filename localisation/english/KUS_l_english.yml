 # ==========================================
 # KUS Focus Tree
 # ==========================================
 KUS_TREE:0 "Kusnurk Confederation"

 # Row 0: ME pair
 KUS_get_off_the_ground:0 "Get off the Ground"
 KUS_get_off_the_ground_desc:0 "Our economy is in shambles, but we can push through with aggressive industrial reform. We need to get production lines running as quickly as possible.\n\nFocus description: TBd"
 KUS_lay_a_foundation:0 "Lay a Foundation"
 KUS_lay_a_foundation_desc:0 "Rather than rushing to restart production, we should focus on building a solid economic foundation. Reducing unnecessary spending will free up resources for long-term investment.\n\nFocus description: TBd"

 # Row 1
 KUS_populate_ministry:0 "Populate the Ministry of Economy"
 KUS_populate_ministry_desc:0 "Staffing the Ministry of Economy with competent administrators will improve our industrial output across the board.\n\nFocus description: TBd"
 KUS_focus_industrial_infrastructure:0 "Focus on Industrial Infrastructure"
 KUS_focus_industrial_infrastructure_desc:0 "Before we can build factories, we need proper infrastructure. Invest in roads, railways, and utility connections in our key industrial regions.\n\nFocus description: TBd"
 KUS_seek_expert_economists:0 "Seek Expert Economists"
 KUS_seek_expert_economists_desc:0 "Hiring experienced economists to manage our recovery will ensure our limited resources are used efficiently.\n\nFocus description: TBd"
 KUS_sustainable_development:0 "Sustainable Development"
 KUS_sustainable_development_desc:0 "Rather than building haphazardly, we should plan sustainable development across all our territories.\n\nFocus description: TBd"

 # Row 2
 KUS_military_contracts:0 "Military Contracts"
 KUS_military_contracts_desc:0 "Securing military contracts will provide the capital needed to expand our arms manufacturing capacity in Tarva and Evla.\n\nFocus description: TBd"
 KUS_careful_investments:0 "Careful Investments"
 KUS_careful_investments_desc:0 "With our economic managers in place, we can begin making careful investments that will transition our economy from ruin to recovery.\n\nFocus description: TBd"

 # Row 3
 KUS_retool_military_industry:0 "Retool Military Industry"
 KUS_retool_military_industry_desc:0 "Our military factories need modern equipment and updated production methods to keep up with demand.\n\nFocus description: TBd"
 KUS_found_strong:0 "Found Strong"
 KUS_found_strong_desc:0 "Investing in foundational infrastructure across our territories will ensure long-term growth and stability.\n\nFocus description: TBd"

 # Row 4: ME pair
 KUS_rapid_recovery:0 "Rapid Recovery"
 KUS_rapid_recovery_desc:0 "Push the economy into overdrive. Remove the constraints of the recovery plan and let market forces drive rapid growth.\n\nFocus description: TBd"
 KUS_industrial_cornerstone:0 "Industrial Cornerstone"
 KUS_industrial_cornerstone_desc:0 "Establish a permanent foundation for industrial growth. This approach favors stability and long-term gain over short-term boosts.\n\nFocus description: TBd"

 # Row 5
 KUS_reconnect_navar:0 "Reconnect Navar"
 KUS_reconnect_navar_desc:0 "Northern Akiba has been isolated for too long. Rebuild the infrastructure connecting Navar to the rest of the Confederation.\n\nFocus description: TBd"
 KUS_bureau_state_industry:0 "Bureau of State Industry"
 KUS_bureau_state_industry_desc:0 "Establish a central bureau to coordinate state-owned industrial enterprises and maximize output.\n\nFocus description: TBd"
 KUS_found_nuclear_energy_org:0 "Found the Nuclear Energy Organization"
 KUS_found_nuclear_energy_org_desc:0 "Our nuclear technology is among the most advanced in the world. Establish a dedicated organization to harness this advantage.\n\nFocus description: TBd"
 KUS_bureau_resource_extraction:0 "Bureau of Resource Extraction"
 KUS_bureau_resource_extraction_desc:0 "Create a bureau dedicated to maximizing the extraction and processing of our natural resources.\n\nFocus description: TBd"

 # Row 6
 KUS_permanent_integration:0 "Permanent Integration"
 KUS_permanent_integration_desc:0 "Fully integrate the reconnected territories into our industrial network with permanent civilian infrastructure.\n\nFocus description: TBd"
 KUS_domestic_arms_industry:0 "Domestic Arms Industry"
 KUS_domestic_arms_industry_desc:0 "Develop a robust domestic arms manufacturing capability to reduce our dependence on foreign equipment.\n\nFocus description: TBd"
 KUS_recover_katser_sea_machinery:0 "\"Recover\" Katser Sea Machinery"
 KUS_recover_katser_sea_machinery_desc:0 "Salvage and restore industrial machinery from the Katser Sea region. These machines can be repurposed for our factories.\n\nFocus description: TBd"
 KUS_expand_future_energy_institute:0 "Expand the Future Energy Institute"
 KUS_expand_future_energy_institute_desc:0 "Invest heavily in the Future Energy Institute to push the boundaries of nuclear research.\n\nFocus description: TBd"
 KUS_expand_vao_extraction:0 "Expand Våo Extraction Inc."
 KUS_expand_vao_extraction_desc:0 "Expand the operations of Våo Extraction Inc. to unlock the mineral wealth of our territories.\n\nFocus description: TBd"
 KUS_halt_ond_divikatel:0 "Halt ond Divikatel"
 KUS_halt_ond_divikatel_desc:0 "Invest in the Divikatel mining operations to extract rare earth metals and bauxite from Kohla.\n\nFocus description: TBd"

 # Row 7
 KUS_military_industrial_mediators:0 "Military Industrial Mediators"
 KUS_military_industrial_mediators_desc:0 "Appoint mediators between the military and industrial sectors to streamline procurement and production.\n\nFocus description: TBd"
 KUS_support_private_enterprises:0 "Support Private Enterprises"
 KUS_support_private_enterprises_desc:0 "Encourage private enterprise to complement state industry. Tax incentives and reduced regulations will stimulate innovation.\n\nFocus description: TBd"
 KUS_monazite_exploitation:0 "Monazite Exploitation"
 KUS_monazite_exploitation_desc:0 "The monazite sands of Solkatzen Isle contain valuable rare minerals. Begin systematic exploitation.\n\nFocus description: TBd"
 KUS_synthetic_polymers:0 "Synthetic Polymers"
 KUS_synthetic_polymers_desc:0 "Build synthetic refineries to produce polymers from our oil reserves, reducing our dependence on imported rubber.\n\nFocus description: TBd"

 # Row 8
 KUS_military_industrial_complex:0 "Military Industrial Complex"
 KUS_military_industrial_complex_desc:0 "Merge the Bureau of State Industry with the military procurement apparatus into a unified Military Industrial Complex.\n\nFocus description: TBd"

 # Row 9
 KUS_new_generation_reactors:0 "New Generation Reactors"
 KUS_new_generation_reactors_desc:0 "Build next-generation nuclear reactors in Jarvalin and Kohla to power our industrial expansion.\n\nFocus description: TBd"

 # ==========================================
 # Army Focus Tree
 # ==========================================

 # Row 0
 KUS_maavoim:0 "Maavõim"
 KUS_maavoim_desc:0 "The Confederation's ground forces have languished in neglect for far too long. It is time to rebuild the Maavõim from the ground up, starting with a comprehensive reform of our military doctrine.\n\nFocus description: Tbd"

 # Row 1: ME branches
 KUS_flexible_support:0 "Flexible Support"
 KUS_flexible_support_desc:0 "Emphasize flexible support doctrine, improving our recovery capabilities and intelligence gathering to keep our forces informed and resilient.\n\nFocus description: Tbd"
 KUS_doctrinal_adaptation:0 "Doctrinal Adaptation"
 KUS_doctrinal_adaptation_desc:0 "Rather than committing to a single approach, invest in adapting our doctrine across the board, gaining broad access to reduced costs for military research.\n\nFocus description: Tbd"
 KUS_concentration_of_force:0 "Concentration of Force"
 KUS_concentration_of_force_desc:0 "Concentrate our resources on heavy armored formations, reducing the cost of our AFV, MBT, and dosage platforms to field them in greater numbers.\n\nFocus description: Tbd"

 # Row 2: Left branch
 KUS_maximum_firepower:0 "Maximum Firepower"
 KUS_maximum_firepower_desc:0 "Overwhelm the enemy with raw firepower. Improve the attack capabilities of all divisions across the board.\n\nFocus description: Tbd"
 KUS_armored_research_grants:0 "Armored Research Grants"
 KUS_armored_research_grants_desc:0 "Fund research grants for armored vehicle development, and expand the Kia Arsenal's capabilities as a fast tank designer.\n\nFocus description: Tbd"
 KUS_mobile_coordinators:0 "Mobile Coordinators"
 KUS_mobile_coordinators_desc:0 "Deploy mobile coordination units to improve reinforcement rates and enhance the effectiveness of our artillery formations.\n\nFocus description: Tbd"

 # Row 2: Right branch
 KUS_integrated_communications:0 "Integrated Communications"
 KUS_integrated_communications_desc:0 "Integrate communications across all branches to improve reinforcement timing and leverage air superiority more effectively in ground combat.\n\nFocus description: Tbd"
 KUS_armored_research_grants_cof:0 "Armored Research Grants"
 KUS_armored_research_grants_cof_desc:0 "Fund research grants for armored vehicle development, and expand the Kia Arsenal's capabilities as a fast tank designer.\n\nFocus description: Tbd"
 KUS_speed_cult:0 "Speed Cult"
 KUS_speed_cult_desc:0 "Embrace speed as the ultimate tactical advantage. Our divisions must be faster than anything the enemy can field.\n\nFocus description: Tbd"

 # Row 3: Left branch
 KUS_rearline_guard_units:0 "Rearline Guard Units"
 KUS_rearline_guard_units_desc:0 "Establish dedicated guard units to protect support companies and rear-line elements, improving their organization and survivability.\n\nFocus description: Tbd"
 KUS_halberd_at_missile:0 "Halberd AT Missile"
 KUS_halberd_at_missile_desc:0 "Develop the Halberd anti-tank missile system for our infantry, dramatically improving their ability to engage armored targets.\n\nFocus description: Tbd"
 KUS_machiavellian_high_command:0 "Machiavellian High Command"
 KUS_machiavellian_high_command_desc:0 "Reform the high command structure to allow for greater planning capabilities and faster execution of complex operations.\n\nFocus description: Tbd"

 # Row 3: Right branch
 KUS_centralized_command:0 "Centralized Command"
 KUS_centralized_command_desc:0 "Centralize the command structure to improve planning speed and allow for more ambitious operational plans.\n\nFocus description: Tbd"
 KUS_project_boom:0 "Project Boom"
 KUS_project_boom_desc:0 "Launch Project Boom, a classified research initiative into next-generation self-propelled artillery platforms.\n\nFocus description: Tbd"
 KUS_off_road_logistics:0 "Off-Road Logistics"
 KUS_off_road_logistics_desc:0 "Develop off-road logistics capabilities to reduce supply consumption and keep our forces fighting even in difficult terrain.\n\nFocus description: Tbd"

 # Row 4: Left branch
 KUS_industrial_saturation:0 "Industrial Saturation"
 KUS_industrial_saturation_desc:0 "Saturate the military industry with artillery production contracts, reducing costs across all howitzer and towed artillery platforms.\n\nFocus description: Tbd"
 KUS_perfect_training_methodology:0 "Perfect Training Methodology"
 KUS_perfect_training_methodology_desc:0 "Develop a perfected training methodology that produces better-trained and more experienced divisions.\n\nFocus description: Tbd"
 KUS_officer_initiative:0 "Officer Initiative"
 KUS_officer_initiative_desc:0 "Encourage initiative among our officer corps. All current generals gain combat experience, and future generals will be trained to take the offensive.\n\nFocus description: Tbd"

 # Row 4: Right branch
 KUS_full_mechanization:0 "Full Mechanization"
 KUS_full_mechanization_desc:0 "Complete the mechanization of our ground forces, reducing the cost of mechanized and motorized equipment across the board.\n\nFocus description: Tbd"
 KUS_perfect_training_methodology_cof:0 "Perfect Training Methodology"
 KUS_perfect_training_methodology_cof_desc:0 "Develop a perfected training methodology that produces better-trained and more experienced divisions.\n\nFocus description: Tbd"
 KUS_logistical_considerations:0 "Logistical Considerations"
 KUS_logistical_considerations_desc:0 "Emphasize logistics in our officer training. All current generals improve their logistical skills, and future generals will be trained accordingly.\n\nFocus description: Tbd"

 # Row 5: Convergence
 KUS_strike_like_supernova:0 "Strike Like a Supernova"
 KUS_strike_like_supernova_desc:0 "Our army will strike with overwhelming force and unstoppable momentum. The Maavõier spirit evolves into the Supernova doctrine.\n\nFocus description: Tbd"
 KUS_erioperatsioonide_grupp:0 "Erioperatsioonide Grupp"
 KUS_erioperatsioonide_grupp_desc:0 "Establish the Erioperatsioonide Grupp, an elite special operations group that will spearhead our most critical missions.\n\nFocus description: Tbd"
 KUS_at_speed_of_light:0 "At the Speed of Light"
 KUS_at_speed_of_light_desc:0 "Speed is victory. The Maavõier spirit evolves into the Valguskiirus doctrine, emphasizing rapid movement and decisive breakthroughs.\n\nFocus description: Tbd"

 # Row 6: Capstone
 KUS_finalize_army_reform:0 "Finalize Army Reform"
 KUS_finalize_army_reform_desc:0 "With all reforms in place, formalize the new doctrine and reap the benefits of our military transformation.\n\nFocus description: Tbd"

