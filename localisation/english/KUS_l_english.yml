 # ==========================================
 # Political Focus Tree
 # ==========================================

 # Row 0
 KUS_a_loyal_friend:0 "A Loyal Friend"
 KUS_a_loyal_friend_desc:0 "This formation of the national cabinet is more important to us than anything. By the President himself, Sasse Rudas was one of the most competent politicians and industry leaders at his peak. But he's our only advisor close to the guardian of these matters.\n\nFocus description: TBd"
 KUS_a_loyal_friend_tt:0 "Hire §YSasse Rudas§! as political advisor (§YSilent Workhorse§!)"

 # Row 1
 KUS_expand_cabinet:0 "Expand the Cabinet"
 KUS_expand_cabinet_desc:0 "Our cabinet is too small to effectively govern the Confederation. By bringing in new advisors from different sectors, we can ensure our political decisions are well-informed and effective.\n\nFocus description: TBd"
 KUS_expand_cabinet_tt:0 "Unlock §YAuto Tank§! as political advisor\nUnlock §YLorited Sem§! as political advisor\nUnlock §YMottol Apflet§! as political advisor"
 KUS_support_public_affairs:0 "Support the Ministry of Public Affairs"
 KUS_support_public_affairs_desc:0 "The Ministry of Public Affairs is the backbone of our civilian governance. By providing additional funding and resources, we can improve public services and bolster democratic support.\n\nFocus description: TBd"
 KUS_support_public_affairs_tt:0 "§G+50§! Political Power\n§G+5%§! Stability"

 # Row 2
 KUS_reinforce_ministries:0 "Reinforce the Ministries"
 KUS_reinforce_ministries_desc:0 "Our government ministries are understaffed and underfunded. Reinforcing them with competent administrators and proper budgets will significantly improve our governance capabilities.\n\nFocus description: TBd"
 KUS_reinforce_ministries_tt:0 "§G+100§! Political Power"
 KUS_food_security_act:0 "Food Security Act"
 KUS_food_security_act_desc:0 "Food insecurity threatens to undermine our domestic stability. By investing in agricultural infrastructure in Krrama and Kikol, we can ensure our citizens are fed.\n\nFocus description: TBd"
 KUS_food_security_act_tt:0 "§YKrrama§!: §G+1§! Infrastructure\n§YKikol§!: §G+1§! Civilian Factory"

 # Row 3
 KUS_combat_extremism:0 "Combat Extremism"
 KUS_combat_extremism_desc:0 "Extremist movements threaten the very fabric of our democracy. We must take decisive action to suppress these radical elements before they tear the Confederation apart.\n\nFocus description: TBd"
 KUS_combat_extremism_tt:0 "Replace National Spirit §RRampant Extremism§! with §YSuppressed Extremism§!"

 # Row 4
 KUS_support_independent_militiamen:0 "Support Independent Militiamen"
 KUS_support_independent_militiamen_desc:0 "Local militia groups have proven their loyalty to the Confederation. By formally supporting them with equipment and training, we gain a reliable domestic defense force.\n\nFocus description: TBd"
 KUS_support_independent_militiamen_tt:0 "§YJarvalin§!: §G+2§! Military Factories\nCreate §Y4§! Kusnurk Militia units in Jarvalin"

 # Row 5
 KUS_schools_hospitals_parks:0 "Schools, Hospitals, Parks"
 KUS_schools_hospitals_parks_desc:0 "Investing in public infrastructure - schools for education, hospitals for health, and parks for morale - will improve the quality of life across the Confederation.\n\nFocus description: TBd"
 KUS_schools_hospitals_parks_tt:0 "§G+5%§! Stability\n§Y1x 100%§! research speed for §YField Hospital§!"
 KUS_mobilize_for_war:0 "Mobilize for War"
 KUS_mobilize_for_war_desc:0 "The threats surrounding the Confederation demand we prepare our economy for potential conflict. We must shift to a wartime economic footing.\n\nFocus description: TBd"
 KUS_mobilize_for_war_tt:0 "Change Economy Law to §YPartial Mobilization§! if currently lower\nGet §G+150§! Political Power if already in Partial Mobilization or higher"
 KUS_threat_on_border:0 "The Threat on our Border"
 KUS_threat_on_border_desc:0 "Our borders are dangerously exposed. Constructing fortifications along our frontier will help deter potential aggressors and protect our sovereignty.\n\nFocus description: TBd"
 KUS_threat_on_border_tt:0 "Add §G+1§! level fort on border states"

 # Row 6
 KUS_bolster_presidential_power:0 "Bolster Presidential Power"
 KUS_bolster_presidential_power_desc:0 "With the support of a broad political coalition, the President can consolidate power to push through critical reforms and steer the nation through these turbulent times.\n\nFocus description: TBd"
 KUS_bolster_presidential_power_tt:0 "§G+50§! Political Power\nPresident gains trait §YBacked by Political Coalition§!"
 KUS_reform_military_academy:0 "Reform the Military Academy"
 KUS_reform_military_academy_desc:0 "Our military academies are outdated and produce officers ill-prepared for modern warfare. A comprehensive reform will produce better trained leaders with improved logistical skills.\n\nFocus description: TBd"
 KUS_reform_military_academy_tt:0 "Add National Spirit §YReformed Military Academy§!:\n§G+1.5%§! Research Speed\nStarting logistics and Chevney skill of all new leaders §G+1§!"

 # Row 7
 KUS_state_development_funds:0 "State Development Funds"
 KUS_state_development_funds_desc:0 "Allocating special development funds to our less developed states will spur economic growth and bring greater prosperity to the Confederation as a whole.\n\nFocus description: TBd"
 KUS_state_development_funds_tt:0 "§YKikol§! state category upgraded to §YDeveloped Urban§!\n§YKikol§!: §G+1§! Civilian Factory"
 KUS_embrace_national_pride:0 "Embrace National Pride"
 KUS_embrace_national_pride_desc:0 "The Confederation needs a unifying national identity to rally behind. By embracing our shared heritage and pride, we can strengthen the bonds between our diverse peoples.\n\nFocus description: TBd"
 KUS_embrace_national_pride_tt:0 "§G+15%§! War Support\nAdd National Spirit §YValiance§!:\nStability: §G+5%§!\nWeekly War Support (enemy bordering): §G+0.1%§!"
 KUS_kibernyg:0 "Kibernyg"
 KUS_kibernyg_desc:0 "The establishment of a dedicated signals intelligence agency will provide us with crucial information about the intentions and capabilities of our neighbors.\n\nFocus description: TBd"
 KUS_kibernyg_tt:0 "Add National Spirit §YKibernyg§!:\nEncryption: §G+1§!\nDecryption: §G+5%§!"

 # Row 8 (Mutually Exclusive)
 KUS_proclaim_greater_kusnurk:0 "Proclaim Greater Kusnurk"
 KUS_proclaim_greater_kusnurk_desc:0 "The Confederation must assert its rightful place as the dominant power in the Flusiobalkan region. By proclaiming Greater Kusnurk, we signal to our neighbors that our interests extend beyond our current borders.\n\nFocus description: TBd"
 KUS_proclaim_greater_kusnurk_tt:0 "Modify National Spirit §YValiance§! to §YValiance - Greater Kusnurk§!:\nFlusiobalkan supremacist faction: §G+10%§!\nDefence on core territory: §G+5%§!\n§G+15%§! War Support"
 KUS_roapokian_alliance:0 "Roapokian Alliance"
 KUS_roapokian_alliance_desc:0 "Rather than domination, we should seek cooperation with our Flusiobalkan neighbors. A broad alliance will provide collective security and mutual prosperity for all member states.\n\nFocus description: TBd"
 KUS_roapokian_alliance_tt:0 "[Kusnurk Confederation] Gains Roapokian Alliance:\nOpinion with all Flusiobalkan nations: §G+30§!\nKusnurk modifier: §YKusnurk offers an alliance§!"

 # Row 9
 KUS_anti_katzen_diplomacy:0 "Anti-Katzen Diplomacy"
 KUS_anti_katzen_diplomacy_desc:0 "The legacy of Katzen occupation demands a unified diplomatic front against any resurgence. By formalizing anti-Katzen diplomatic positions, we strengthen our alliances and deter aggression.\n\nFocus description: TBd"
 KUS_anti_katzen_diplomacy_tt:0 "Change National Spirit §YValiance§! with Anti-Katzen Diplomacy:\n§G+10%§! Attack bonus against all Katzen states\n§G+10%§! Defence bonus against all Katzen states"

 # Row 10 (Operations)
 KUS_operation_unified_froststat:0 "Operation Unified Froststat"
 KUS_operation_unified_froststat_desc:0 "Purrhelmshaven must be brought into the fold. Operation Unified Froststat will establish the conditions for a regime change that aligns with Flusiobalkan democratic values.\n\nFocus description: TBd"
 KUS_operation_unified_froststat_tt:0 "Gain §YTopple Government§! wargoal on §YPurrhelmshaven§!\nBypass if Purrhelmshaven is not independent"
 KUS_operation_steinager_dawe:0 "Operation Steinager Dawe"
 KUS_operation_steinager_dawe_desc:0 "Dominiontracks represents a threat to regional stability. Operation Steinager Dawe will neutralize this threat and bring democratic governance to the territory.\n\nFocus description: TBd"
 KUS_operation_steinager_dawe_tt:0 "Gain §YTopple Government§! wargoal on §YDominiontracks§!\nBypass if Dominiontracks is not independent"
 KUS_operation_nekusnurik_freedom:0 "Operation Nekusnurik Freedom"
 KUS_operation_nekusnurik_freedom_desc:0 "The people of Nekaston deserve freedom from their oppressive government. Operation Nekusnurik Freedom will liberate them and restore democratic governance.\n\nFocus description: TBd"
 KUS_operation_nekusnurik_freedom_tt:0 "Gain §YTopple Government§! wargoal on §YNekaston§!\nBypass if Nekaston is not independent"

 # Row 11
 KUS_an_union_of_our_own:0 "A Union of Our Own"
 KUS_an_union_of_our_own_desc:0 "With the regional threats neutralized, we can now create a formal union of Flusiobalkan democracies. Every democratic country in the region will be invited to join our cause.\n\nFocus description: TBd"
 KUS_an_union_of_our_own_tt:0 "Create faction §YFlusiobalkan Union§!\nEvery democratic country in the Flusiobalkan will get an invite to the faction\nGain wargoal on every non-democratic country in the Flusiobalkan"
 KUS_flusiobalkan_union:0 "Flusiobalkan Union"

 # Row 12
 KUS_flusiobalkan_economic_regard:0 "The Flusiobalkan Economic Regard"
 KUS_flusiobalkan_economic_regard_desc:0 "As faction leader, we can establish a comprehensive economic framework that benefits all member states. Shared resources and coordinated development will strengthen our collective prosperity.\n\nRequirements: Must be faction leader. This focus will pause if requirements are not met.\n\nFocus description: TBd"
 KUS_flusiobalkan_economic_regard_tt:0 "Every faction member's construction: §G+2§! Offmap Civilian Factories\nAdd National Spirit §YFlusiobalkan Economic Region§!"
 KUS_joint_technology_board:0 "Joint Technology Board"
 KUS_joint_technology_board_desc:0 "By establishing a joint technology board with our faction members, we can share research and accelerate technological development across the entire union.\n\nFocus description: TBd"
 KUS_joint_technology_board_tt:0 "We will enter a tech sharing agreement with all members of our faction\n§Y2x 50%§! research speed for §YElectronics§!\n§Y2x 50%§! research speed for §YIndustry§!"

 # Row 13
 KUS_pan_flusiobalkan_bank:0 "Pan-Flusiobalkan Bank"
 KUS_pan_flusiobalkan_bank_desc:0 "A unified banking system across the Flusiobalkan Union will stabilize currencies, facilitate trade, and reduce economic friction between member states.\n\nRequirements: Must be faction leader. This focus will pause if requirements are not met.\n\nFocus description: TBd"
 KUS_pan_flusiobalkan_bank_tt:0 "Consumer Goods factor: §G-5%§!\nFactory Output: §G+5%§!"
 KUS_flusiobalkan_defence_army:0 "Flusiobalkan Defence Army"
 KUS_flusiobalkan_defence_army_desc:0 "A unified defense force will ensure the security of all member states. Every member will contribute to and benefit from the collective military strength of the union.\n\nRequirements: Must be faction leader. This focus will pause if requirements are not met.\n\nFocus description: TBd"
 KUS_flusiobalkan_defence_army_tt:0 "Every member gets National Spirit §YFDU§!:\nExperienced soldier losses in combat: §G-10%§!"

 # Row 14
 KUS_a_united_flusiobalkan:0 "A United Flusiobalkan"
 KUS_a_united_flusiobalkan_desc:0 "The separate economic and military arrangements can now be consolidated into a single comprehensive union. The Catbalkan Union will provide all the benefits of both frameworks.\n\nRequirements: Must be faction leader. This focus will pause if requirements are not met.\n\nFocus description: TBd"
 KUS_a_united_flusiobalkan_tt:0 "Remove §YFlusiobalkan Economic Region§! and §YFDU§!\nAdd §YCatbalkan Union§! to all faction members:\nExperienced soldier losses in combat: §G-10%§!\nConsumer Goods factor: §G-5%§!\nFactory Output: §G+10%§!"

 # Row 15
 KUS_a_true_union:0 "A True Union"
 KUS_a_true_union_desc:0 "The time has come to fully integrate our faction members into a true political union. Through a series of diplomatic decisions, each member state will be given the opportunity to join the Confederation as an integrated partner.\n\nRequirements: Must be faction leader. This focus will pause if requirements are not met.\n\nFocus description: TBd"
 KUS_a_true_union_tt:0 "Gives decisions to integrate faction members into puppets\nEach decision takes §Y70 days§!, costs §Y150§! Political Power\nIntegrated puppet to fully annexed with cores on all the country's states"

 # ==========================================
 # Political Focus Tree Ideas Localisation
 # ==========================================
 KUS_suppressed_extremism:0 "Suppressed Extremism"
 KUS_suppressed_extremism_desc:0 "The country has gone through a rapid change in its political climate, with more people than ever supporting the legitimate government. However some will refuse to yield without retaliation. If the government were to collapse, extremism may surge once more."
 KUS_underground_extremism:0 "Underground Extremism"
 KUS_underground_extremism_desc:0 "Peace reigns on the streets and people walk without fear after years of terrorist attacks and unrest, but this peace is still fragile. If the government were to collapse, the extremists could return."
 KUS_reformed_military_academy:0 "Reformed Military Academy"
 KUS_reformed_military_academy_desc:0 "Our military academies have been comprehensively reformed, producing officers with superior logistical training and tactical knowledge."
 KUS_valiance:0 "Valiance"
 KUS_valiance_desc:0 "A renewed sense of national pride and unity strengthens the resolve of the Confederation."
 KUS_valiance_greater:0 "Valiance - Greater Kusnurk"
 KUS_valiance_greater_desc:0 "The proclamation of Greater Kusnurk has galvanized the population. Flusiobalkan supremacist sentiment runs high, and our defense capabilities on core territory have been significantly enhanced."
 KUS_valiance_anti_katzen:0 "Valiance - Anti-Katzen Diplomacy"
 KUS_valiance_anti_katzen_desc:0 "United against the legacy of Katzen occupation, the Confederation has formalized its anti-Katzen diplomatic stance, providing significant combat bonuses against former Katzen states."
 KUS_kibernyg_spirit:0 "Kibernyg"
 KUS_kibernyg_spirit_desc:0 "The Kibernyg signals intelligence agency provides the Confederation with invaluable information about enemy communications and intentions."
 KUS_flusiobalkan_economic_region:0 "Flusiobalkan Economic Region"
 KUS_flusiobalkan_economic_region_desc:0 "The Flusiobalkan Economic Region coordinates economic policy across member states, reducing consumer goods requirements and boosting industrial output."
 KUS_pan_flusiobalkan_bank_spirit:0 "Pan-Flusiobalkan Bank"
 KUS_pan_flusiobalkan_bank_spirit_desc:0 "The Pan-Flusiobalkan Bank stabilizes the economies of all member states, reducing costs and improving production efficiency."
 KUS_fdu:0 "FDU"
 KUS_fdu_desc:0 "The Flusiobalkan Defence Union provides collective military strength, reducing experienced soldier losses and boosting morale."
 KUS_catbalkan_union:0 "Catbalkan Union"
 KUS_catbalkan_union_desc:0 "The Catbalkan Union combines the economic and military frameworks into a single comprehensive arrangement, providing the full benefits of both to all member states."

