 # ==========================================
 # Navy Focus Tree (Merevagi)
 # ==========================================

 # Row 0
 KUS_merevagi:0 "Merevagi"
 KUS_merevagi_desc:0 "The Kusnurk Navy has languished since the fall of the old order. It is time to rebuild the Merevagi from the keel up, starting with a fundamental reform of our naval doctrine and command structure.\n\nFocus description: Tbd"

 # Row 2
 KUS_plan_colossus:0 "Plan Colossus"
 KUS_plan_colossus_desc:0 "Plan Colossus envisions a fleet built around mighty capital ships, dreadnoughts that can control the seas through overwhelming firepower and armor.\n\nFocus description: Tbd"
 KUS_plan_nymph:0 "Plan Nymph"
 KUS_plan_nymph_desc:0 "Plan Nymph favors a fleet of stealthy submarines and fast raiding craft, striking from beneath the waves to disrupt enemy supply lines and shipping.\n\nFocus description: Tbd"
 KUS_plan_harpie:0 "Plan Harpie"
 KUS_plan_harpie_desc:0 "Plan Harpie calls for a carrier-centric fleet, projecting air power across the oceans and striking enemy fleets from beyond the horizon.\n\nFocus description: Tbd"
 KUS_squadron_flagships:0 "Squadron Flagships"
 KUS_squadron_flagships_desc:0 "Designate specialized heavy cruisers as squadron flagships, coordinating smaller flotillas and providing fire support during fleet engagements.\n\nFocus description: Tbd"

 # Row 3
 KUS_expand_naval_yards:0 "Expand the Naval Yards"
 KUS_expand_naval_yards_desc:0 "The shipyards of Northern Akiba must be expanded dramatically to support the construction of our new capital ship fleet.\n\nFocus description: Tbd"
 KUS_modern_ship_design:0 "Modern Ship Design Commission"
 KUS_modern_ship_design_desc:0 "Establish a commission to modernize our ship designs, incorporating the latest advances in naval architecture and weapons technology.\n\nFocus description: Tbd"
 KUS_predictive_ship_positioning:0 "Predictive Ship Positioning"
 KUS_predictive_ship_positioning_desc:0 "Develop advanced techniques for predicting enemy fleet movements and positioning our forces for maximum advantage.\n\nFocus description: Tbd"
 KUS_post_kaiser_carrier:0 "Post-Kaiser Carrier Doctrine"
 KUS_post_kaiser_carrier_desc:0 "With the fall of the Kaiser, a new carrier doctrine must be developed, one suited to our strategic needs and the realities of modern naval warfare.\n\nFocus description: Tbd"

 # Row 4
 KUS_pythagoras_class:0 "Pythagoras Class"
 KUS_pythagoras_class_desc:0 "Design and lay down the Pythagoras-class super-heavy battleships, the mightiest warships ever built by the Confederation.\n\nFocus description: Tbd"
 KUS_train_admiralty:0 "Train the Admiralty"
 KUS_train_admiralty_desc:0 "Invest in the professional development of our senior naval officers, ensuring they are prepared for the demands of modern fleet warfare.\n\nFocus description: Tbd"
 KUS_high_tech_raiding:0 "High Tech Raiding"
 KUS_high_tech_raiding_desc:0 "Equip our submarine fleet with the latest in stealth and sensor technology, making them deadlier than ever before.\n\nFocus description: Tbd"
 KUS_carrier_research_commission:0 "Carrier Research Commission"
 KUS_carrier_research_commission_desc:0 "Fund a dedicated commission to advance carrier aviation technology, from deck operations to aircraft design.\n\nFocus description: Tbd"

 # Row 5
 KUS_deep_sea_monsters:0 "Deep Sea Monsters"
 KUS_deep_sea_monsters_desc:0 "Our capital ships will be the deep sea monsters of legend, faster and more accurate than anything our enemies can field.\n\nFocus description: Tbd"
 KUS_warden_torpedo:0 "Warden Torpedo"
 KUS_warden_torpedo_desc:0 "Develop the next generation of torpedo technology, improving both submarine and surface-launched munitions.\n\nFocus description: Tbd"
 KUS_unrestricted_submarine_warfare:0 "Unrestricted Submarine Warfare"
 KUS_unrestricted_submarine_warfare_desc:0 "Remove all restrictions on submarine operations. Our U-boats will hunt freely across the oceans, striking at any enemy vessel they encounter.\n\nFocus description: Tbd"
 KUS_establish_carrier_groups:0 "Establish Carrier Groups"
 KUS_establish_carrier_groups_desc:0 "Organize our carriers into powerful carrier battle groups, complete with escorts and support vessels for sustained operations.\n\nFocus description: Tbd"
 KUS_fleet_mobility:0 "Fleet Mobility"
 KUS_fleet_mobility_desc:0 "Invest in fleet logistics and speed, ensuring our warships can deploy rapidly to any theater of operations.\n\nFocus description: Tbd"

 # Row 6
 KUS_fleet_colossus:0 "Fleet Colossus"
 KUS_fleet_colossus_desc:0 "The Fleet Colossus doctrine is now fully realized. Our capital ship fleet is the envy of the world, a wall of steel and fire that no enemy can breach.\n\nFocus description: Tbd"
 KUS_fleet_nymph:0 "Fleet Nymph"
 KUS_fleet_nymph_desc:0 "The Fleet Nymph doctrine has reached its pinnacle. Our submarine fleet operates as silent ghosts beneath the waves, striking terror into the hearts of our enemies.\n\nFocus description: Tbd"
 KUS_fleet_harpie:0 "Fleet Harpie"
 KUS_fleet_harpie_desc:0 "The Fleet Harpie doctrine is complete. Our carrier groups project devastating air power across the seas, destroying enemy fleets before they can even engage.\n\nFocus description: Tbd"

 # Row 8
 KUS_finalize_navy_reform:0 "Finalize Navy Reform"
 KUS_finalize_navy_reform_desc:0 "With our naval reforms complete, formalize the new doctrines and reap the benefits of our Merevagi transformation.\n\nFocus description: Tbd"

