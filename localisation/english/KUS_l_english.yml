l_english:

 ### KUS Focus Tree ###
 KUS_steady_the_course:0 "Steady the Course"
 KUS_steady_the_course_desc:0 "We must stabilize our nation. Hiring Talvan Rahha as our political advisor will help us steady the ship."
 KUS_civil_reform:0 "Civil Reform"
 KUS_civil_reform_desc:0 "Reforming our civil institutions will strengthen democracy and provide capable political leadership."
 KUS_ministry_of_public_affairs:0 "Ministry of Public Affairs"
 KUS_ministry_of_public_affairs_desc:0 "Establishing a Ministry of Public Affairs will develop our infrastructure and improve democratic support."
 KUS_clamp_down_on_extremists:0 "Clamp Down on Extremists"
 KUS_clamp_down_on_extremists_desc:0 "Clamp down on extremist groups. We must reduce the influence of radical ideologies in our nation."
 KUS_food_security_aid:0 "Food Security Aid"
 KUS_food_security_aid_desc:0 "Investing in food production across our territories will ensure our people are fed and stable."
 KUS_expedited_recovery:0 "Expedited Recovery"
 KUS_expedited_recovery_desc:0 "An aggressive approach to economic recovery, trading civilian capacity for military readiness."
 KUS_expedited_recovery_tt:0 "Adds building slots to all core states for rapid industrialization."
 KUS_sustainable_development:0 "Sustainable Development"
 KUS_sustainable_development_desc:0 "A measured approach to economic development, building a foundation for long-term growth."
 KUS_sustainable_development_tt:0 "Adds building slots to all core states for sustainable growth."
 KUS_stimulus_package:0 "Stimulus Package"
 KUS_stimulus_package_desc:0 "A direct injection of resources into our economy to jumpstart production and reduce the effects of the economic downturn."
 KUS_increase_manufacturing:0 "Increase Manufacturing"
 KUS_increase_manufacturing_desc:0 "Expanding our manufacturing capabilities will improve production efficiency and reduce the burden on consumers."
 KUS_infrastructure_investments:0 "Infrastructure Investments"
 KUS_infrastructure_investments_desc:0 "Investing in infrastructure across all our territories will improve logistics and enable future growth."
 KUS_through_the_bottleneck:0 "Through the Bottleneck"
 KUS_through_the_bottleneck_desc:0 "Pushing through the economic bottleneck with targeted investments in critical industries."
 KUS_careful_investment:0 "Careful Investment"
 KUS_careful_investment_desc:0 "Measured and careful investments will reduce consumer goods burden and improve production."
 KUS_schools_hospitals_farms:0 "Schools, Hospitals, Farms"
 KUS_schools_hospitals_farms_desc:0 "Investing in social infrastructure - schools, hospitals, and farms - will improve stability and research capabilities."
 KUS_a_recovering_economy:0 "A Recovering Economy"
 KUS_a_recovering_economy_desc:0 "Our economy is recovering. The ruined state of our industry is behind us, and a new era of growth begins."
 KUS_a_new_foundation:0 "A New Foundation"
 KUS_a_new_foundation_desc:0 "We have built a new economic foundation. Our industries are reformed and our production capabilities renewed."
 KUS_merit_group:0 "Merit Group"
 KUS_merit_group_desc:0 "Establishing a merit-based leadership system will reduce military costs and improve the quality of our officers."
 KUS_endow_presidential_power:0 "Endow Presidential Power"
 KUS_endow_presidential_power_desc:0 "Granting additional powers to the presidency will provide political stability and popular support."
 KUS_invite_back_exiles:0 "Invite Back Exiles"
 KUS_invite_back_exiles_desc:0 "Many talented scientists and scholars fled during the turmoil. It is time to invite them back to serve our nation."
 KUS_technology_institute:0 "Technology Institute"
 KUS_technology_institute_desc:0 "Establishing a national technology institute will expand our research capabilities."
 KUS_align_the_military:0 "Align the Military"
 KUS_align_the_military_desc:0 "Aligning the military with our political goals will create a unified national direction."
 KUS_endorse_political_party:0 "Endorse a Political Party"
 KUS_endorse_political_party_desc:0 "Official endorsement of a political party will boost national cohesion and defensive capabilities."
 KUS_kulsnudgj:0 "Kūlsnudgj"
 KUS_kulsnudgj_desc:0 "Our intelligence service, Kūlsnudgj, will be expanded to provide superior encryption and code-breaking capabilities."
 KUS_drum_up_war_support:0 "Drum Up War Support"
 KUS_drum_up_war_support_desc:0 "We must rally the people behind the cause and prepare for potential conflict."
 KUS_development_funds:0 "Development Funds"
 KUS_development_funds_desc:0 "Allocating development funds to improve our states and expand their capacity."
 KUS_research_greater_kusnurk:0 "Preserve Greater Kusnurk"
 KUS_research_greater_kusnurk_desc:0 "The time has come to look beyond our borders and envision a Greater Kusnurk."
 KUS_on_our_own:0 "On Our Own"
 KUS_on_our_own_desc:0 "We shall forge our own destiny, independent of foreign alliances. We will create our own faction and determine the future of the region."
 KUS_alliance_with_roquale:0 "Alliance with Roqualia"
 KUS_alliance_with_roquale_desc:0 "An alliance with Roqualia would strengthen both our nations and provide mutual security."
 KUS_establish_free_corps:0 "Establish Free Corps"
 KUS_establish_free_corps_desc:0 "Establishing the Free Corps will allow us to send volunteer forces abroad to support our interests."
 KUS_anti_katzen_diplomacy:0 "Anti-Katzen Diplomacy"
 KUS_anti_katzen_diplomacy_desc:0 "We must take a firm stance against the remnants of Katzen influence in the region."
 KUS_forgive_and_forget:0 "Forgive and Forget"
 KUS_forgive_and_forget_desc:0 "Perhaps it is time to put the past behind us and reconcile with those who share our borders."
 KUS_align_roquale:0 "Align Roqualia"
 KUS_align_roquale_desc:0 "Roqualia's government must be brought in line with our interests."
 KUS_align_nakaton:0 "Align Nekaston"
 KUS_align_nakaton_desc:0 "Nekaston's government must be brought in line with our interests."
 KUS_protectorate_in_the_meridale:0 "Protectorate in the Herzlands"
 KUS_protectorate_in_the_meridale_desc:0 "Establishing a protectorate over the Herzlands will secure our southern interests."
 KUS_alliance_in_the_meridale:0 "Alliance in the Herzlands"
 KUS_alliance_in_the_meridale_desc:0 "Forming alliances with like-minded nations in the region will strengthen our collective security."
 KUS_joint_technology_board:0 "Joint Technology Board"
 KUS_joint_technology_board_desc:0 "A joint technology board will facilitate the sharing of research and innovation across allied nations."

 ### KUS National Ideas ###
 KUS_racial_tensions:0 "Racial Tensions"
 KUS_racial_tensions_desc:0 "Deep-seated racial tensions within the Confederation reduce our ability to recruit effectively and undermine national stability."
 KUS_rampant_extremism:0 "Rampant Extremism"
 KUS_rampant_extremism_desc:0 "Extremist movements run rampant throughout the Confederation, destabilizing our society and sapping political will.\n\nThis national spirit is removed if both supremacist and communist party popularity is under 10%."
 KUS_ruined_economy:0 "Ruined Economy"
 KUS_ruined_economy_desc:0 "Our economy lies in ruins. Industrial output is severely hampered, and production efficiency has plummeted."
 KUS_suppressed_extremism:0 "Suppressed Extremism"
 KUS_suppressed_extremism_desc:0 "The worst extremist elements have been suppressed, though political power remains diminished.\n\nThis national spirit is removed if both supremacist and communist party popularity is under 10%."
 KUS_crackdown_effect:0 "Extremist Crackdown"
 KUS_crackdown_effect_desc:0 "An active crackdown on extremist groups is reducing the influence of radical ideologies."
 KUS_stimulus_economy:0 "Stimulated Economy"
 KUS_stimulus_economy_desc:0 "Government stimulus has begun to alleviate the worst effects of economic ruin."
 KUS_manufacturing_economy:0 "Growing Manufacturing"
 KUS_manufacturing_economy_desc:0 "Manufacturing output is growing as new investments take effect."
 KUS_bottleneck_economy:0 "Breaking Through"
 KUS_bottleneck_economy_desc:0 "We are breaking through the economic bottleneck. Consumer goods burden is decreasing and production is improving."
 KUS_careful_economy:0 "Careful Growth"
 KUS_careful_economy_desc:0 "Careful and measured investments are paying off, with steady improvements across our industries."
 KUS_recovering_economy:0 "Recovering Economy"
 KUS_recovering_economy_desc:0 "Our economy is recovering. Construction is accelerating and production efficiency is improving."
 KUS_economic_resources:0 "Economic Resources"
 KUS_economic_resources_desc:0 "Our economic resources have been revitalized. Production efficiency has been greatly improved."
 KUS_solid_foundation:0 "Solid Foundation"
 KUS_solid_foundation_desc:0 "A solid economic foundation has been established, providing lasting benefits to construction and production."
 KUS_merit_group:0 "Merit Group"
 KUS_merit_group_desc:0 "A merit-based system for military leadership reduces costs and ensures experienced soldiers lead our forces."
 KUS_merit_group_improved:0 "Merit Group (Improved)"
 KUS_merit_group_improved_desc:0 "The Merit Group has been expanded to include returning exiles, boosting research capabilities and reducing consumer goods requirements."
 KUS_national_power:0 "National Power"
 KUS_national_power_desc:0 "A strong political endorsement has boosted national power, increasing our recruitable population and defensive capabilities on core territory."
 KUS_kulsnudgj_idea:0 "Kūlsnudgj"
 KUS_kulsnudgj_idea_desc:0 "Our intelligence agency provides superior encryption and decryption capabilities."
 KUS_nation_of_free:0 "Nation of the Free"
 KUS_nation_of_free_desc:0 "Our nation stands as a beacon of freedom. Our people are ready to defend their homeland to the last."
 KUS_destiny_of_kusnurk:0 "Destiny of Kusnurk"
 KUS_destiny_of_kusnurk_desc:0 "We forge our own destiny. Our people are committed to defending our sovereignty and expanding our influence independently."

