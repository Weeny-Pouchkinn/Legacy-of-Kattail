 # Focus Names
 KUS_stabilize_jarvalin:0 "Stabilize Jarvalin"
 KUS_stabilize_jarvalin_desc:0 "With the technocrats now in control, our first priority must be to stabilize the capital and restore order to the Confederation. The demilitarized zones across our territory leave us vulnerable, but stability must come first.\n\nFocus description: TBD"
 KUS_create_rebel_groups:0 "Create Rebel Groups"
 KUS_create_rebel_groups_desc:0 "By organizing loyal rebel groups in demilitarized zones, we can gradually reassert military control over our territory. Each group will work to crack down on resistance and restore order.\n\nFocus description: TBD"
 KUS_stable_aligned_political:0 "Stable-Aligned Political Courses"
 KUS_stable_aligned_political_desc:0 "Aligning our political institutions with the new technocratic vision will provide the foundation for our ambitious development program. Stability and expertise must go hand in hand.\n\nFocus description: TBD"
 KUS_form_technocratic_council:0 "Form the Technocratic Council"
 KUS_form_technocratic_council_desc:0 "The creation of a formal Technocratic Council will centralize scientific and industrial decision-making under the guidance of our brightest minds. This council will direct the nation's development toward a technological singularity.\n\nFocus description: TBD"
 KUS_new_leap_program:0 "New Leap Program"
 KUS_new_leap_program_desc:0 "A massive civilian industrialization program centered on Jarvalin. New factories and infrastructure will form the backbone of our technocratic economy.\n\nFocus description: TBD"
 KUS_direct_scientific_development:0 "Direct Scientific Development"
 KUS_direct_scientific_development_desc:0 "The Technocratic Council will directly oversee and accelerate scientific research, focusing resources on breakthrough technologies.\n\nFocus description: TBD"
 KUS_end_starvation:0 "An End to Starvation"
 KUS_end_starvation_desc:0 "Food security is a prerequisite for technological advancement. We will invest in agricultural infrastructure across Tarva and Krrama to ensure our people are fed.\n\nFocus description: TBD"
 KUS_second_leap:0 "Second Leap"
 KUS_second_leap_desc:0 "The second phase of industrialization expands our factory base into Krrama and Northern Akiba.\n\nFocus description: TBD"
 KUS_encourage_technical_education:0 "Encourage Technical Education"
 KUS_encourage_technical_education_desc:0 "A nationwide technical education initiative will produce the skilled workforce needed for our increasingly advanced economy.\n\nFocus description: TBD"
 KUS_economic_socialism:0 "Economic Socialism"
 KUS_economic_socialism_desc:0 "Centralizing economic control under the Technocratic Council reduces market waste and increases industrial output.\n\nFocus description: TBD"
 KUS_agrarians:0 "Agrarians"
 KUS_agrarians_desc:0 "Establishing an Agrarian Apparatus ensures that agricultural development keeps pace with industrial growth, preventing food shortages.\n\nFocus description: TBD"
 KUS_third_leap:0 "Third Leap"
 KUS_third_leap_desc:0 "The third phase of industrialization brings factories to Kohla and Evla, completing the economic transformation of the Confederation.\n\nFocus description: TBD"
 KUS_high_tech_factories:0 "High-tech Factories"
 KUS_high_tech_factories_desc:0 "Upgrading our factories with cutting-edge technology dramatically increases production efficiency and output.\n\nFocus description: TBD"
 KUS_the_landing:0 "The Landing"
 KUS_the_landing_desc:0 "The final phase of civilian industrialization, establishing advanced manufacturing and airfields on Solkatzen Isle.\n\nFocus description: TBD"
 KUS_cybernetics_program:0 "Cybernetics Program"
 KUS_cybernetics_program_desc:0 "The Cybernetics Program represents a breakthrough in human-machine integration, dramatically accelerating our research capabilities.\n\nFocus description: TBD"
 KUS_entelev_moores_law:0 "Entelev Moore's Law"
 KUS_entelev_moores_law_desc:0 "Our scientists have formulated a predictive model for electronics advancement that will guide our research investments.\n\nFocus description: TBD"
 KUS_abst:0 "ABST"
 KUS_abst_desc:0 "The Advanced Bilateral Security Treaty creates a compact for military-industrial cooperation, boosting our equipment production.\n\nFocus description: TBD"
 KUS_farthest_beyond:0 "Farthest Beyond"
 KUS_farthest_beyond_desc:0 "The culmination of our technocratic development program. The Pioneering Technocrats national spirit evolves into the Singularity, effectively doubling our research capabilities.\n\nFocus description: TBD"
 KUS_project_eroskat:0 "Project 'Eroskat'"
 KUS_project_eroskat_desc:0 "A classified military aviation project leveraging our advanced technology to create superior air forces.\n\nFocus description: TBD"
 KUS_project_warrior:0 "Project 'WARRIOR'"
 KUS_project_warrior_desc:0 "Project WARRIOR applies our technological breakthroughs to ground combat doctrine, creating faster and more lethal divisions.\n\nFocus description: TBD"
 KUS_project_stabilisation:0 "Project 'Stabilisation'"
 KUS_project_stabilisation_desc:0 "Project Stabilisation focuses on defensive applications of our technology, hardening our military positions.\n\nFocus description: TBD"
 KUS_proper_defense_installations:0 "Proper Defense Installations"
 KUS_proper_defense_installations_desc:0 "With our advanced technology, we can construct superior defensive installations across all our territories.\n\nFocus description: TBD"
 KUS_conserved_ai_infrastructure:0 "Conserved AI Infrastructure"
 KUS_conserved_ai_infrastructure_desc:0 "Restoring and expanding Jarvalin's infrastructure to support advanced AI computing systems.\n\nFocus description: TBD"
 KUS_mass_cybernetics_program:0 "Mass Cybernetics Program"
 KUS_mass_cybernetics_program_desc:0 "Deploying cybernetic enhancements across all state infrastructure, dramatically improving construction and resource extraction.\n\nFocus description: TBD"
 KUS_construct_computation_factories:0 "Construct Computation Factories"
 KUS_construct_computation_factories_desc:0 "Purpose-built computation factories will serve as the hardware backbone for our advanced AI systems.\n\nFocus description: TBD"
 KUS_supercomputer_facility:0 "Supercomputer Facility Construction"
 KUS_supercomputer_facility_desc:0 "The construction of a massive supercomputer facility in the capital will be the crowning achievement of our infrastructure program.\n\nFocus description: TBD"
 KUS_create_mii_net:0 "Create the MII Net"
 KUS_create_mii_net_desc:0 "The Machine Intelligence Integration Network connects all our cybernetic infrastructure into a unified system, enabling unprecedented coordination.\n\nFocus description: TBD"
 KUS_the_final_touches:0 "The Final Touches"
 KUS_the_final_touches_desc:0 "The last pieces of our grand technological vision fall into place. Three years from now, the consequences of our work will manifest.\n\nFocus description: TBD"

