 # ==========================================
 # KUS Ideas Localisation
 # ==========================================
 KUS_ruined_economy:0 "Ruined Economy"
 KUS_ruined_economy_desc:0 "Years of civil strife and mismanagement have left the Kusnurk economy in ruins. Factories sit idle, infrastructure crumbles, and consumer goods are scarce."
 KUS_racial_tensions:0 "Racial Tensions"
 KUS_racial_tensions_desc:0 "Deep-seated racial tensions between the various ethnic groups of the Confederation threaten to tear the nation apart from within."
 KUS_rampant_extremism:0 "Rampant Extremism"
 KUS_rampant_extremism_desc:0 "Extremist movements on both the left and right are gaining ground, exploiting the instability and discontent of the populace."

 KUS_economic_rebound:0 "Economic Rebound"
 KUS_economic_rebound_desc:0 "The shackles of the recovery plan have been cast off. The economy is growing at breakneck speed, though this growth may not be sustainable."
 KUS_land_revaluation:0 "Land Revaluation"
 KUS_land_revaluation_desc:0 "A comprehensive revaluation of land and industrial assets has established a stable foundation for long-term economic growth."
 KUS_private_enterprises:0 "Private Enterprises"
 KUS_private_enterprises_desc:0 "A thriving private sector complements state industry, driving innovation and accelerating research across all fields."
 KUS_repair_shipyards:0 "Repair Shipyards"
 KUS_repair_shipyards_desc:0 "The shipyards of Navar have been repaired and modernized, boosting our naval construction capabilities."
 KUS_new_construction_methods:0 "New Construction Methods"
 KUS_new_construction_methods_desc:0 "New construction techniques developed through military-industrial cooperation have dramatically improved our building speed."

