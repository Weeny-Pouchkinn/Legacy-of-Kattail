 KUS_vao_extraction_desc:0 "Väo Extraction Inc. is the leading Kusnurk mining corporation, specializing in mineral resource extraction."
 KUS_divikatel:0 "Divikatel"
 KUS_divikatel_desc:0 "Divikatel is a Kusnurk chemical and industrial conglomerate with expertise in synthetic and industrial technologies."

