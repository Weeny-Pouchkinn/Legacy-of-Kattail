 # Event Localisation
 KUS_event.1.t:0 "Project Boom"
 KUS_event.1.desc:0 "Project Boom has run into an unexpected dilemma. While the goal remains the same, fielding a new generation of self-propelled artillery, our engineers are sharply divided on how best to achieve it.\n\nSome argue that increasing the caliber is the obvious path forward, allowing our guns to deliver heavier, more devastating blows against enemy positions.\n\nOthers caution that such firepower will mean little if the vehicles cannot survive on the battlefield, pushing instead for improved armor to better withstand return fire.\n\nWith both sides unwilling to compromise, the decision now rests with us."
 KUS_event.1.a:0 "Big gun good."
 KUS_event.1.b:0 "Thick armor good."

