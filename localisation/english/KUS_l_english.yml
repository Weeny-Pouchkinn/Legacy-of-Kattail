 KUS_event.50.t:0 "Invitation to the Flusiobalkan Union" #AI-Generated, update later
 KUS_event.50.desc:0 "The Kusnurk Confederation has formed the Flusiobalkan Union and invites us to join as a founding member. They seek to unite the democratic nations of the Flusiobalkans against common threats. Joining would bind our foreign policy to theirs, but would also grant us the protection and economic benefits of the alliance." #AI-Generated, update later
 KUS_event.50.a:0 "We shall join the Flusiobalkan Union." #AI-Generated, update later
 KUS_event.50.b:0 "We must chart our own course." #AI-Generated, update later

 KUS_event.51.t:0 "[FROM.GetName] Joins the Flusiobalkan Union" #AI-Generated, update later
 KUS_event.51.desc:0 "[FROM.GetName] has accepted our invitation and joined the Flusiobalkan Union. Our alliance grows stronger." #AI-Generated, update later
 KUS_event.51.a:0 "Welcome to the union!" #AI-Generated, update later

 KUS_event.52.t:0 "[FROM.GetName] Declines Our Invitation" #AI-Generated, update later
 KUS_event.52.desc:0 "[FROM.GetName] has declined our invitation to join the Flusiobalkan Union. They prefer to remain independent for now." #AI-Generated, update later
 KUS_event.52.a:0 "A disappointing decision." #AI-Generated, update later

 KUS_event.53.t:0 "Kusnurk Offers to Return Our Lands" #AI-Generated, update later
 KUS_event.53.desc:0 "The Kusnurk Confederation, having conquered the Freistaat Roqualien territories, now offers to return the states of Celestadt, Mewlsass, Pferdwaldgebiet, and Hubschestadt to us as a gesture of goodwill. These are lands we have long claimed as rightfully ours. In exchange, they ask only for our friendship and protection." #AI-Generated, update later
 KUS_event.53.a:0 "We gratefully accept these lands!" #AI-Generated, update later
 KUS_event.53.b:0 "We do not trust their motives." #AI-Generated, update later

 KUS_event.54.t:0 "Roqualia Accepts Our Offer" #AI-Generated, update later
 KUS_event.54.desc:0 "Roqualia has gratefully accepted our offer to return the Freistaat lands. In return, they have extended a guarantee of our independence and opened favorable trade relations." #AI-Generated, update later
 KUS_event.54.a:0 "A fruitful partnership begins." #AI-Generated, update later

 KUS_event.55.t:0 "Roqualia Refuses Our Offer" #AI-Generated, update later
 KUS_event.55.desc:0 "Despite our generous offer to return the Freistaat territories, Roqualia has refused. They are suspicious of our intentions." #AI-Generated, update later
 KUS_event.55.a:0 "Their loss." #AI-Generated, update later

 KUS_event.60.t:0 "Kusnurk Proposes Dominion Status" #AI-Generated, update later
 KUS_event.60.desc:0 "The Kusnurk Confederation, as leader of the Flusiobalkan Union, has proposed that we accept Dominion status under their leadership. Their military and economic might far exceeds our own, making resistance difficult. However, accepting would mean surrendering much of our sovereignty." #AI-Generated, update later
 KUS_event.60.a:0 "We accept Dominion status." #AI-Generated, update later
 KUS_event.60.b:0 "We refuse - we leave the faction!" #AI-Generated, update later

 KUS_event.61.t:0 "[FROM.GetName] Accepts Dominion Status" #AI-Generated, update later
 KUS_event.61.desc:0 "[FROM.GetName] has accepted Dominion status within the Flusiobalkan Union. They are now under our direct political influence." #AI-Generated, update later
 KUS_event.61.a:0 "Excellent. The union consolidates." #AI-Generated, update later

 KUS_event.62.t:0 "[FROM.GetName] Refuses Dominion Status" #AI-Generated, update later
 KUS_event.62.desc:0 "[FROM.GetName] has refused our proposal for Dominion status and left the Flusiobalkan Union in protest. This insult shall not go unanswered." #AI-Generated, update later
 KUS_event.62.a:0 "They will regret this decision." #AI-Generated, update later

 KUS_event.70.t:0 "Kusnurk Proposes Full Integration" #AI-Generated, update later
 KUS_event.70.desc:0 "The Kusnurk Confederation has proposed our full integration into Greater Kusnurk. Their military and economic superiority is overwhelming - resistance would be futile and devastating. However, acceptance means the end of our nation as an independent entity." #AI-Generated, update later
 KUS_event.70.a:0 "We accept integration into Kusnurk." #AI-Generated, update later
 KUS_event.70.b:0 "We refuse! We would rather fight!" #AI-Generated, update later

 KUS_event.71.t:0 "[FROM.GetName] Accepts Integration" #AI-Generated, update later
 KUS_event.71.desc:0 "[FROM.GetName] has accepted full integration into Greater Kusnurk. Their territories and armies are now ours." #AI-Generated, update later
 KUS_event.71.a:0 "The union is complete." #AI-Generated, update later

 KUS_event.72.t:0 "[FROM.GetName] Refuses Integration" #AI-Generated, update later
 KUS_event.72.desc:0 "[FROM.GetName] has refused our proposal for integration. This act of defiance will be met with immediate military action." #AI-Generated, update later
 KUS_event.72.a:0 "So be it. War it is." #AI-Generated, update later

 ### Pressure Faction Events ###
 KUS_event.80.t:0 "Kusnurk Demands We Join Their Bloc" #AI-Generated, update later
 KUS_event.80.desc:0 "The Kusnurk Confederation has made it clear that our independence is an inconvenience to their Flusiobalkan ambitions. With their faction's combined industrial and military might looming over us, they are pressuring us to join the Flusiobalkan Union — or face the consequences." #AI-Generated, update later
 KUS_event.80.a:0 "We have no choice. We will join them." #AI-Generated, update later
 KUS_event.80.b:0 "We will not submit to their pressure!" #AI-Generated, update later

 KUS_event.81.t:0 "[FROM.GetName] Submits to Pressure" #AI-Generated, update later
 KUS_event.81.desc:0 "[FROM.GetName] has bowed to our pressure and agreed to join the Flusiobalkan Union. Our sphere of influence grows." #AI-Generated, update later
 KUS_event.81.a:0 "Welcome to the fold." #AI-Generated, update later

 KUS_event.82.t:0 "[FROM.GetName] Defies Our Pressure" #AI-Generated, update later
 KUS_event.82.desc:0 "[FROM.GetName] has rejected our demands to join the Flusiobalkan Union. This stubborn resistance will not go unpunished — we must prepare to force the issue." #AI-Generated, update later
 KUS_event.82.a:0 "They will regret this defiance." #AI-Generated, update later
 KUS_event.82.b:0 "So be it..."

 ### New Focus Loc ###
 KUS_pressure_flusiobalkan_influence:0 "Leverage Flusiobalkan Influence"
 KUS_pressure_flusiobalkan_influence_desc:0 "With our faction established, we can leverage our combined strength to pressure non-aligned Flusiobalkan nations into joining us. Those who resist will learn the cost of defiance."

 ### New Decision Category Loc ###
 KUS_secure_dominance_cat:0 "Secure Flusiobalkans Dominance"
 KUS_pressure_influence_cat:0 "Pressure Flusiobalkan Influence"

 ### New Decision Loc ###
 KUS_declare_war_fascist_flusiobalkan:0 "Pre-Emptive Strike Against [FROM.GetName]"
 KUS_declare_war_fascist_flusiobalkan_desc:0 "The fascist regime in [FROM.GetName] is a threat to the stability of the Flusiobalkans. We must remove them by force."
 KUS_pressure_join_faction:0 "Leverage our Influence Upon [FROM.GetName]"
 KUS_pressure_join_faction_desc:0 "Over the next few months, we shall slowly yet surely creep into [FROM.GetName]'s industrial and financial sector. Over time, this will build up leverage to pressure [FROM.GetName] into joining the Flusiobalkan Union. Refusal, and their subsequent expulsion of our assets from their lands, will constitute an ample, if iffy, justification for war."

 ### New Tooltip Loc ###
 KUS_secure_dominance_decisions_tt:0 "Unlocks §Hdecisions§! to §Hdeclare war§! on §Rfascist§! Flusiobalkan nations."
 KUS_pressure_influence_decisions_tt:0 "Unlocks §Hdecisions§! to §Hpressure§! non-fascist Flusiobalkan nations into joining the §HFlusiobalkan Union§!."
 KUS_pressure_4x_industry_tt:0 "Your §Hfaction's total factories§! must be at least §H4 times§! the target's factories (§H8 times§! if the target is in a faction). Does not work against §Rfaction leaders§!.\n\n§Y[?FROM.GetName]§! has §Y[?FROM.num_of_factories]§! factories, while our faction has §Y[?KUS.KUS_faction_total_factories]§!\n\nBase: §G33%§! chance to accept.\nIf our faction has §Hdouble§! the required threshold, this is boosted to §G66%§! chance.\nIf we also have §H2x the army§! (4x if target in faction), this is further multiplied by §G1.25§!.\nOtherwise, if refused, we shall receive a §Rwargoal§!."
