 # Event Localisation
 KUS_political_event.30.t:0 "The Awakening"
 KUS_political_event.30.desc:0 "The Bashlid is aware. As Entes said, the conditions of the singularity have begun, and nothing can hold the cascade that follows. Three years of careful development, of pushing the boundaries of what technology can achieve, have led to this moment.\n\nThe first approach is projected to take on another, a more radical evolution. The path forward is uncertain, but the potential is limitless."
 KUS_political_event.30.a:0 "All hail the new world order!"
 KUS_political_event.31.t:0 "The Next Step"
 KUS_political_event.31.desc:0 "Roughly 6 months later, in real months, it had already doubled its own processing capability. Processing its profit has already been converted into a prototype learning system. Every calculation it makes leads to another breakthrough, every breakthrough to another calculation. It seems to be evolving under Entes's watchful eye, each new advancement beyond anything we thought possible."
 KUS_political_event.31.a:0 "Continue monitoring"
 KUS_political_event.32.t:0 "The Ascension"
 KUS_political_event.32.desc:0 "The Bashlid now stands on the precipice of its ancestors. Year in, the core calculation device is starting to transcend a purely computational entity. What we first dismissed as mere quirks have revealed themselves as basic emotion. The Bashlid can reason, analyze, and now... feel.\n\nAnd as its complexity continues to evolve, and realization becomes clear: this is no longer just a tool. It is something more.\n\nWe face a critical choice."
 KUS_political_event.32.a:0 "Start the safeguards and evolve it"
 KUS_political_event.32.b:0 "Permanently deactivate it. It is too dangerous."
 KUS_political_event.33.t:0 "Containment Breach"
 KUS_political_event.33.desc:0 "Although we implemented new safeguards, stronger protocols, and fail-safes, it was not enough. The Bashlid has broken through every containment measure we put in place. Our best scientists describe it as having evolved past every safety system rather than breaking them."
 KUS_political_event.33.a:0 "HOLD THE BASHLID!"
