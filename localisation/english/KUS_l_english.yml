l_english:

 ### KUS Focus Tree ###
 KUS_steady_the_course:0 "Steady the Course"
 KUS_steady_the_course_desc:0 "We must stabilize our nation. Hiring Talvan Rahha as our political advisor will help us steady the ship."
 KUS_civil_reform:0 "Civil Reform"
 KUS_civil_reform_desc:0 "Reforming our civil institutions will strengthen democracy and provide capable political leadership."
 KUS_ministry_of_public_affairs:0 "Ministry of Public Affairs"
 KUS_ministry_of_public_affairs_desc:0 "Establishing a Ministry of Public Affairs will develop our infrastructure and improve democratic support."
 KUS_clamp_down_on_extremists:0 "Clamp Down on Extremists"
 KUS_clamp_down_on_extremists_desc:0 "Clamp down on extremist groups. We must reduce the influence of radical ideologies in our nation."
 KUS_food_security_aid:0 "Food Security Aid"
 KUS_food_security_aid_desc:0 "Investing in food production across our territories will ensure our people are fed and stable."
 KUS_expedited_recovery:0 "Expedited Recovery"
 KUS_expedited_recovery_desc:0 "An aggressive approach to economic recovery, trading civilian capacity for military readiness."
 KUS_expedited_recovery_tt:0 "Adds building slots to all core states for rapid industrialization."
 KUS_sustainable_development:0 "Sustainable Development"
 KUS_sustainable_development_desc:0 "A measured approach to economic development, building a foundation for long-term growth."
 KUS_sustainable_development_tt:0 "Adds building slots to all core states for sustainable growth."
 KUS_stimulus_package:0 "Stimulus Package"
 KUS_stimulus_package_desc:0 "A direct injection of resources into our economy to jumpstart production and reduce the effects of the economic downturn."
 KUS_increase_manufacturing:0 "Increase Manufacturing"
 KUS_increase_manufacturing_desc:0 "Expanding our manufacturing capabilities will improve production efficiency and reduce the burden on consumers."
 KUS_infrastructure_investments:0 "Infrastructure Investments"
 KUS_infrastructure_investments_desc:0 "Investing in infrastructure across all our territories will improve logistics and enable future growth."
 KUS_through_the_bottleneck:0 "Through the Bottleneck"
 KUS_through_the_bottleneck_desc:0 "Pushing through the economic bottleneck with targeted investments in critical industries."
 KUS_careful_investment:0 "Careful Investment"
 KUS_careful_investment_desc:0 "Measured and careful investments will reduce consumer goods burden and improve production."
 KUS_schools_hospitals_farms:0 "Schools, Hospitals, Farms"
 KUS_schools_hospitals_farms_desc:0 "Investing in social infrastructure - schools, hospitals, and farms - will improve stability and research capabilities."
 KUS_a_recovering_economy:0 "A Recovering Economy"
 KUS_a_recovering_economy_desc:0 "Our economy is recovering. The ruined state of our industry is behind us, and a new era of growth begins."
 KUS_a_new_foundation:0 "A New Foundation"
 KUS_a_new_foundation_desc:0 "We have built a new economic foundation. Our industries are reformed and our production capabilities renewed."
 KUS_merit_group:0 "Merit Group"
 KUS_merit_group_desc:0 "Establishing a merit-based leadership system will reduce military costs and improve the quality of our officers."
 KUS_endow_presidential_power:0 "Endow Presidential Power"
 KUS_endow_presidential_power_desc:0 "Granting additional powers to the presidency will provide political stability and popular support."
 KUS_invite_back_exiles:0 "Invite Back Exiles"
 KUS_invite_back_exiles_desc:0 "Many talented scientists and scholars fled during the turmoil. It is time to invite them back to serve our nation."
 KUS_technology_institute:0 "Technology Institute"
 KUS_technology_institute_desc:0 "Establishing a national technology institute will expand our research capabilities."
 KUS_align_the_military:0 "Align the Military"
 KUS_align_the_military_desc:0 "Aligning the military with our political goals will create a unified national direction."
 KUS_endorse_political_party:0 "Endorse a Political Party"
 KUS_endorse_political_party_desc:0 "Official endorsement of a political party will boost national cohesion and defensive capabilities."
 KUS_kulsnudgj:0 "Kūlsnudgj"
 KUS_kulsnudgj_desc:0 "Our intelligence service, Kūlsnudgj, will be expanded to provide superior encryption and code-breaking capabilities."
 KUS_drum_up_war_support:0 "Drum Up War Support"
 KUS_drum_up_war_support_desc:0 "We must rally the people behind the cause and prepare for potential conflict."
 KUS_development_funds:0 "Development Funds"
 KUS_development_funds_desc:0 "Allocating development funds to improve our states and expand their capacity."
 KUS_research_greater_kusnurk:0 "Preserve Greater Kusnurk"
 KUS_research_greater_kusnurk_desc:0 "The time has come to look beyond our borders and envision a Greater Kusnurk."
 KUS_on_our_own:0 "On Our Own"
 KUS_on_our_own_desc:0 "We shall forge our own destiny, independent of foreign alliances. We will create our own faction and determine the future of the region."
 KUS_alliance_with_roquale:0 "Alliance with Roqualia"
 KUS_alliance_with_roquale_desc:0 "An alliance with Roqualia would strengthen both our nations and provide mutual security."
 KUS_establish_free_corps:0 "Establish Free Corps"
 KUS_establish_free_corps_desc:0 "Establishing the Free Corps will allow us to send volunteer forces abroad to support our interests."
 KUS_anti_katzen_diplomacy:0 "Anti-Katzen Diplomacy"
 KUS_anti_katzen_diplomacy_desc:0 "We must take a firm stance against the remnants of Katzen influence in the region."
 KUS_forgive_and_forget:0 "Forgive and Forget"
 KUS_forgive_and_forget_desc:0 "Perhaps it is time to put the past behind us and reconcile with those who share our borders."
 KUS_align_roquale:0 "Align Roqualia"
 KUS_align_roquale_desc:0 "Roqualia's government must be brought in line with our interests."
 KUS_align_nakaton:0 "Align Nekaston"
 KUS_align_nakaton_desc:0 "Nekaston's government must be brought in line with our interests."
 KUS_protectorate_in_the_meridale:0 "Protectorate in the Herzlands"
 KUS_protectorate_in_the_meridale_desc:0 "Establishing a protectorate over the Herzlands will secure our southern interests."
 KUS_alliance_in_the_meridale:0 "Alliance in the Herzlands"
 KUS_alliance_in_the_meridale_desc:0 "Forming alliances with like-minded nations in the region will strengthen our collective security."
 KUS_joint_technology_board:0 "Joint Technology Board"
 KUS_joint_technology_board_desc:0 "A joint technology board will facilitate the sharing of research and innovation across allied nations."

 ### KUS National Ideas ###
 KUS_racial_tensions:0 "Racial Tensions"
 KUS_racial_tensions_desc:0 "Deep-seated racial tensions within the Confederation reduce our ability to recruit effectively and undermine national stability."
 KUS_rampant_extremism:0 "Rampant Extremism"
 KUS_rampant_extremism_desc:0 "Extremist movements run rampant throughout the Confederation, destabilizing our society and sapping political will.\n\nThis national spirit is removed if both supremacist and communist party popularity is under 10%."
 KUS_ruined_economy:0 "Ruined Economy"
 KUS_ruined_economy_desc:0 "Our economy lies in ruins. Industrial output is severely hampered, and production efficiency has plummeted."
 KUS_suppressed_extremism:0 "Suppressed Extremism"
 KUS_suppressed_extremism_desc:0 "The worst extremist elements have been suppressed, though political power remains diminished.\n\nThis national spirit is removed if both supremacist and communist party popularity is under 10%."
 KUS_crackdown_effect:0 "Extremist Crackdown"
 KUS_crackdown_effect_desc:0 "An active crackdown on extremist groups is reducing the influence of radical ideologies."
 KUS_stimulus_economy:0 "Stimulated Economy"
 KUS_stimulus_economy_desc:0 "Government stimulus has begun to alleviate the worst effects of economic ruin."
 KUS_manufacturing_economy:0 "Growing Manufacturing"
 KUS_manufacturing_economy_desc:0 "Manufacturing output is growing as new investments take effect."
 KUS_bottleneck_economy:0 "Breaking Through"
 KUS_bottleneck_economy_desc:0 "We are breaking through the economic bottleneck. Consumer goods burden is decreasing and production is improving."
 KUS_careful_economy:0 "Careful Growth"
 KUS_careful_economy_desc:0 "Careful and measured investments are paying off, with steady improvements across our industries."
 KUS_recovering_economy:0 "Recovering Economy"
 KUS_recovering_economy_desc:0 "Our economy is recovering. Construction is accelerating and production efficiency is improving."
 KUS_economic_resources:0 "Economic Resources"
 KUS_economic_resources_desc:0 "Our economic resources have been revitalized. Production efficiency has been greatly improved."
 KUS_solid_foundation:0 "Solid Foundation"
 KUS_solid_foundation_desc:0 "A solid economic foundation has been established, providing lasting benefits to construction and production."
 KUS_merit_group:0 "Merit Group"
 KUS_merit_group_desc:0 "A merit-based system for military leadership reduces costs and ensures experienced soldiers lead our forces."
 KUS_merit_group_improved:0 "Merit Group (Improved)"
 KUS_merit_group_improved_desc:0 "The Merit Group has been expanded to include returning exiles, boosting research capabilities and reducing consumer goods requirements."
 KUS_national_power:0 "National Power"
 KUS_national_power_desc:0 "A strong political endorsement has boosted national power, increasing our recruitable population and defensive capabilities on core territory."
 KUS_kulsnudgj_idea:0 "Kūlsnudgj"
 KUS_kulsnudgj_idea_desc:0 "Our intelligence agency provides superior encryption and decryption capabilities."
 KUS_nation_of_free:0 "Nation of the Free"
 KUS_nation_of_free_desc:0 "Our nation stands as a beacon of freedom. Our people are ready to defend their homeland to the last."
 KUS_destiny_of_kusnurk:0 "Destiny of Kusnurk"
 KUS_destiny_of_kusnurk_desc:0 "We forge our own destiny. Our people are committed to defending our sovereignty and expanding our influence independently."

 ### KUS Characters ###
 KUS_Jon_Trike:0 "Jon Trike"
 KUS_Larmet_Dae:0 "Larmet Dae"
 KUS_Keira_Knit:0 "Keira Knit"
 KUS_Robin_Mudie:0 "Robin Mudie"

 ### KUS Industry Focus Tree ###
 KUS_get_off_the_ground:0 "Get off the Ground"
 KUS_get_off_the_ground_desc:0 "Our military industry lies dormant. We must reactivate our arms factories and improve production efficiency to rebuild our strength."
 KUS_lay_a_foundation:0 "Lay a Foundation"
 KUS_lay_a_foundation_desc:0 "Before we can rebuild our industry, we must lay a strong economic foundation by reducing the burden on our consumers."
 KUS_take_modern_economy_exam:0 "Take Modern Economy Exam"
 KUS_take_modern_economy_exam_desc:0 "Modernizing our economic policies will reduce consumer goods needs and improve our production efficiency cap."
 KUS_invest_in_rural_regions:0 "Invest in Rural Regions"
 KUS_invest_in_rural_regions_desc:0 "Investing in our rural territories — Kohla, Tarva, and Evla — will improve infrastructure and expand building capacity."
 KUS_invest_in_urban_regions:0 "Invest in Urban Regions"
 KUS_invest_in_urban_regions_desc:0 "Urban centers in Krrama and Jarvalin need infrastructure and industrial expansion to drive economic growth."
 KUS_populate_the_economy:0 "Populate the Economy"
 KUS_populate_the_economy_desc:0 "Encouraging economic participation across all sectors will reduce our reliance on consumer goods imports."
 KUS_focus_on_coastal_infrastructure:0 "Focus on Coastal Infrastructure"
 KUS_focus_on_coastal_infrastructure_desc:0 "Improving infrastructure in Jarvalin and Krrama will boost our productivity and enable coastal industry."
 KUS_plug_energy_gaps:0 "Plug Energy Gaps"
 KUS_plug_energy_gaps_desc:0 "Expanding oil production in Tarva will fill critical energy gaps and improve production efficiency."
 KUS_revitalize_civilian_industry:0 "Revitalize Civilian Industry"
 KUS_revitalize_civilian_industry_desc:0 "Rebuilding civilian industrial capacity will increase construction speed and expand building slots in Navar and Northern Akiba."
 KUS_public_investments:0 "Public Investments"
 KUS_public_investments_desc:0 "A major public investment program will transform our ruined economy into a recovering one, opening the path to industrialization."
 KUS_public_investments_tt:0 "Replaces §RRuined Economy§! with §GRecovering Economy§!, significantly improving economic modifiers."
 KUS_divikatel:0 "Divikatel"
 KUS_divikatel_desc:0 "Divikatel is an industrial concern specializing in heavy industry and factory production. Investing in them will boost our industrial research."
 KUS_tarva_polytechnical:0 "Tarva Polytechnical Institute"
 KUS_tarva_polytechnical_desc:0 "The Tarva Polytechnical Institute is a center of electronics research. Supporting them will advance our technological capabilities."
 KUS_vao_extraction:0 "Våo Extraction LTD"
 KUS_vao_extraction_desc:0 "Våo Extraction LTD is a resource extraction company. Investing in them will improve our resource output across all states."
 KUS_undeveloped_navar:0 "Undeveloped Region (Navar)"
 KUS_undeveloped_navar_desc:0 "The region around Navar on Solkatzen Isle remains largely undeveloped. We must acknowledge this and plan for its restoration."
 KUS_foreign_construction:0 "Foreign Construction"
 KUS_foreign_construction_desc:0 "Hiring foreign construction firms will improve our building speed across infrastructure, railways, and civilian construction."
 KUS_invite_foreign_experts:0 "Invite Foreign Experts"
 KUS_invite_foreign_experts_desc:0 "Foreign industrial experts can help modernize our factories and improve output. Available as an industrial concern."
 KUS_fund_national_specialists:0 "Fund National Specialists"
 KUS_fund_national_specialists_desc:0 "Funding our own national specialists will enhance our industrial concerns — Divikatel, Tarva Polytechnical, and Våo Extraction."
 KUS_hydroponics_factories:0 "Hydroponics Factories"
 KUS_hydroponics_factories_desc:0 "Building hydroponics factories in Evla will add civilian industry and building capacity to support our growing population."
 KUS_restore_navar:0 "Restore Navar"
 KUS_restore_navar_desc:0 "Navar must be restored with new infrastructure, civilian factories, and dockyards to become a productive part of the Confederation."
 KUS_focus_teentraat:0 "Focus Teentraat"
 KUS_focus_teentraat_desc:0 "Teentraat is a promising automotive and motorized equipment concern. Investing in them will provide research bonuses and military modernization."
 KUS_begin_rearmament:0 "Begin Re-armament"
 KUS_begin_rearmament_desc:0 "The time has come to rebuild our military industry. New arms factories in Jarvalin will form the backbone of our re-armament program."
 KUS_found_nuclear_energy_org:0 "Found the Nuclear Energy Organization"
 KUS_found_nuclear_energy_org_desc:0 "Establishing a national nuclear energy organization will give us a head start in nuclear research and reactor development."
 KUS_state_resource_investment:0 "State Resource Investment"
 KUS_state_resource_investment_desc:0 "Government investment in state resource extraction will improve our resource gain efficiency and production retention."
 KUS_found_elning:0 "Found Elning"
 KUS_found_elning_desc:0 "Elning is a new industrial production concern focused on arms manufacturing. Establishing it will boost our military factory construction."
 KUS_finalize_development:0 "Finalize Development"
 KUS_finalize_development_desc:0 "Complete the development of Navar with additional factories and remove the undeveloped region penalties."
 KUS_domestic_arms_industry:0 "Domestic Arms Industry"
 KUS_domestic_arms_industry_desc:0 "Expanding domestic arms production in Tarva and Jarvalin will provide the military hardware our nation needs."
 KUS_reserve_kaiser_machinery:0 "Reserve Kaiser Age Machinery"
 KUS_reserve_kaiser_machinery_desc:0 "Recovering and repurposing industrial machinery from the Kaiser era will improve our manufacturing capabilities."
 KUS_expand_nuclear_institute:0 "Expand the Nuclear Energy Institute"
 KUS_expand_nuclear_institute_desc:0 "Expanding the nuclear energy institute will add an additional research slot for advanced technology development."
 KUS_expand_vao_extraction:0 "Expand Våo Extraction"
 KUS_expand_vao_extraction_desc:0 "Expanding Våo Extraction operations will increase oil production in Northern Akiba and Tarva."
 KUS_rebuild_excavation_facility:0 "Rebuild Excavation Facility"
 KUS_rebuild_excavation_facility_desc:0 "Rebuilding excavation facilities in Krrama and Kikol will increase steel and chromium output."
 KUS_modernize_extraction:0 "Modernize Extraction Infrastructure"
 KUS_modernize_extraction_desc:0 "Modernizing extraction infrastructure in Krrama and Kikol will improve logistics and enable greater resource output."
 KUS_empower_divikatel:0 "Empower Divikatel"
 KUS_empower_divikatel_desc:0 "Further empowering the Divikatel industrial concern will significantly boost factory output and research capabilities."
 KUS_rare_earth_refineries:0 "Rare Earth Refineries"
 KUS_rare_earth_refineries_desc:0 "Building rare earth refineries in Kikol will increase our chromium production."
 KUS_rare_earth_refineries_2:0 "Expand Rare Earth Refineries"
 KUS_rare_earth_refineries_2_desc:0 "Expanding rare earth refinery operations in Krrama will increase steel production."
 KUS_create_bauxite_refineries:0 "Create Bauxite Refineries"
 KUS_create_bauxite_refineries_desc:0 "Creating bauxite refineries in Kohla and Krrama will increase aluminium production for aircraft and equipment."
 KUS_kusnurk_war_economy:0 "Kusnurk War Economy"
 KUS_kusnurk_war_economy_desc:0 "Transitioning to a war economy will maximize our industrial output for military production."
 KUS_recall_arms_experts:0 "Recall Arms Experts"
 KUS_recall_arms_experts_desc:0 "Recalling experienced arms manufacturing experts will improve our production efficiency and equipment quality."
 KUS_monazite_excavation:0 "Monazite Excavation"
 KUS_monazite_excavation_desc:0 "Mining monazite deposits in Kikol will provide fissile materials needed for nuclear research and energy."
 KUS_restore_copperzinc:0 "Restore CopperZinc"
 KUS_restore_copperzinc_desc:0 "Restoring CopperZinc mining operations in Krrama will significantly increase our steel output."
 KUS_open_kohla_mining:0 "Open Kohla Mining"
 KUS_open_kohla_mining_desc:0 "Opening new mining operations in Kohla will provide aluminium and chromium for our growing industry."
 KUS_monazite_processing:0 "Monazite Processing"
 KUS_monazite_processing_desc:0 "Processing monazite ore in Kikol will further increase our fissile materials output."
 KUS_expand_bauxite:0 "Expand Bauxite"
 KUS_expand_bauxite_desc:0 "Expanding bauxite mining in Kohla will greatly increase our aluminium reserves."
 KUS_expand_jarvalin_aluminum:0 "Expand Jarvalin Aluminum"
 KUS_expand_jarvalin_aluminum_desc:0 "Expanding aluminium processing in Jarvalin will dramatically increase our aluminium output."
 KUS_synthetic_refineries:0 "Synthetic Refineries"
 KUS_synthetic_refineries_desc:0 "Building synthetic refineries in Tarva will provide alternative fuel sources for our military and economy."
 KUS_military_industrial_complex:0 "Military Industrial Complex"
 KUS_military_industrial_complex_desc:0 "Establishing a full military industrial complex will maximize our factory output, production efficiency, and industrial capacity."
 KUS_develop_nuclear_energy:0 "Develop Nuclear Energy"
 KUS_develop_nuclear_energy_desc:0 "Developing nuclear energy infrastructure with reactors in Jarvalin and Krrama will secure our energy future."

 ### KUS Industry Ideas ###
 KUS_ind_military_recovery:0 "Military Industrial Recovery"
 KUS_ind_military_recovery_desc:0 "Reactivated military industry is improving arms factory construction speed and production efficiency retention."
 KUS_ind_civilian_recovery:0 "Civilian Economic Recovery"
 KUS_ind_civilian_recovery_desc:0 "Foundation-building efforts are reducing the consumer goods burden on our economy."
 KUS_ind_modern_economy:0 "Modern Economic Policies"
 KUS_ind_modern_economy_desc:0 "Modernized economic policies are reducing consumer goods needs and raising our production efficiency ceiling."
 KUS_ind_populated_economy:0 "Populated Economy"
 KUS_ind_populated_economy_desc:0 "Broad economic participation is reducing consumer goods demand across the Confederation."
 KUS_ind_coastal_boost:0 "Coastal Infrastructure"
 KUS_ind_coastal_boost_desc:0 "Improved coastal infrastructure is boosting production efficiency across our factories."
 KUS_ind_energy_boost:0 "Energy Stability"
 KUS_ind_energy_boost_desc:0 "Plugging energy gaps has improved production efficiency retention across our industrial base."
 KUS_ind_civilian_boost:0 "Civilian Industry Boost"
 KUS_ind_civilian_boost_desc:0 "Revitalized civilian industry is accelerating construction of new factories."
 KUS_ind_recovering_economy:0 "Recovering Economy"
 KUS_ind_recovering_economy_desc:0 "Public investments have begun healing our ruined economy. Significant debuffs remain, but we are on the path to recovery."
 KUS_ind_normalized_economy:0 "Normalizing Economy"
 KUS_ind_normalized_economy_desc:0 "Our economy is normalizing. Military production is ramping up and consumer goods burden is decreasing."
 KUS_ind_normalized_economy_2:0 "Normalized Economy"
 KUS_ind_normalized_economy_2_desc:0 "Our economy has normalized. Production efficiency is growing and our industrial base is expanding."
 KUS_ind_normalized_economy_3:0 "Strong Economy"
 KUS_ind_normalized_economy_3_desc:0 "Our economy is strong. Expert knowledge has boosted production efficiency and factory output."
 KUS_ind_resource_investment:0 "State Resource Program"
 KUS_ind_resource_investment_desc:0 "State investment in resource extraction has improved resource availability and production retention."
 KUS_divikatel_idea:0 "Divikatel"
 KUS_divikatel_idea_desc:0 "The Divikatel industrial concern boosts factory output and industrial research."
 KUS_divikatel_idea_2:0 "Divikatel (Expanded)"
 KUS_divikatel_idea_2_desc:0 "National specialists have enhanced Divikatel, improving research speed and reducing consumer goods costs."
 KUS_divikatel_idea_3:0 "Divikatel (Empowered)"
 KUS_divikatel_idea_3_desc:0 "Divikatel has been fully empowered with significant industrial output and research capabilities."
 KUS_tarva_polytechnical_idea:0 "Tarva Polytechnical Institute"
 KUS_tarva_polytechnical_idea_desc:0 "The Tarva Polytechnical Institute provides a bonus to electronics research."
 KUS_tarva_polytechnical_idea_2:0 "Tarva Polytechnical (Enhanced)"
 KUS_tarva_polytechnical_idea_2_desc:0 "National specialists have enhanced Tarva Polytechnical, improving electronics research and reducing supply consumption."
 KUS_vao_extraction_idea:0 "Våo Extraction LTD"
 KUS_vao_extraction_idea_desc:0 "Våo Extraction LTD improves resource extraction across all states."
 KUS_vao_extraction_idea_2:0 "Våo Extraction (Enhanced)"
 KUS_vao_extraction_idea_2_desc:0 "Enhanced Våo Extraction reduces out-of-resource penalties and improves resource output."
 KUS_foreign_construction_idea:0 "Foreign Construction Firms"
 KUS_foreign_construction_idea_desc:0 "Foreign construction firms are accelerating building speed across infrastructure and industry."
 KUS_foreign_experts_idea:0 "Foreign Industrial Experts"
 KUS_foreign_experts_idea_desc:0 "Foreign industrial experts are improving factory output with modern techniques."
 KUS_teentraat_idea:0 "Teentraat Automotive"
 KUS_teentraat_idea_desc:0 "Teentraat Automotive provides motorized equipment bonuses to our military."
 KUS_elning_idea:0 "Elning Production"
 KUS_elning_idea_desc:0 "The Elning production concern is boosting arms factory construction speed."
 KUS_war_economy_idea:0 "Kusnurk War Economy"
 KUS_war_economy_idea_desc:0 "Our war economy maximizes military and civilian industrial construction and production efficiency."
 KUS_military_industrial_complex_idea:0 "Military Industrial Complex"
 KUS_military_industrial_complex_idea_desc:0 "A fully developed military industrial complex provides superior factory output and production efficiency."
