 # National Spirit Names
 KUS_expansionism_lessened:0 "Expansionism Lessened"
 KUS_expansionism_lessened_desc:0 "The technocratic government has tempered the aggressive expansionism of the previous regime, focusing instead on internal development and technological advancement."
 KUS_agrarian_apparatus:0 "Agrarian Apparatus"
 KUS_agrarian_apparatus_desc:0 "A dedicated agricultural organization ensures efficient food production and distribution across the Confederation."
 KUS_project_eroskat_spirit:0 "Project Eroskat"
 KUS_project_eroskat_spirit_desc:0 "Advanced aviation technology reduces air accidents and increases mission efficiency."
 KUS_project_warrior_spirit:0 "Valiant"
 KUS_project_warrior_spirit_desc:0 "Cutting-edge ground combat doctrine and cybernetic enhancements make our divisions faster and more effective."
 KUS_project_stabilisation_spirit:0 "Stabilised Frontlines"
 KUS_project_stabilisation_spirit_desc:0 "Advanced defensive technology hardens our positions and improves entrenchment speed."
 KUS_mii_net:0 "MII Net"
 KUS_mii_net_desc:0 "The Machine Intelligence Integration Network provides construction bonuses, research acceleration, and enhanced intelligence capabilities."
 KUS_abst_compact:0 "ABST Compact"
 KUS_abst_compact_desc:0 "The Advanced Bilateral Security Treaty provides military-industrial cooperation benefits, boosting equipment production."

