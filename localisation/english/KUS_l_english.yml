 # ==========================================
 # KUS Events Localisation
 # ==========================================
 KUS_event.1.t:0 "Project Boom"
 KUS_event.1.desc:0 "Project Boom has run into an unexpected dilemma. While the goal remains the same, fielding a new generation of self-propelled artillery, our engineers are sharply divided on how best to achieve it.\n\nSome argue that increasing the caliber is the obvious path forward, allowing our guns to deliver heavier firepower, even devastating blows against enemy positions.\n\nOthers caution that such firepower will mean little if the vehicles cannot survive on the battlefield, pushing instead for improved armor to better withstand return fire.\n\nWith both sides unwilling to compromise, the decision now rests with us."
 KUS_event.1.a:0 "Big Gun Good"
 KUS_event.1.b:0 "Thick Armor Good"

 # ==========================================
 # Air Force Focus Tree
 # ==========================================

 # Row 0
 KUS_ohuvagi:0 "Õhuvagi"
 KUS_ohuvagi_desc:0 "The Confederation's air forces have been neglected for too long. It is time to rebuild the Õhuvagi from the ground up, starting with a comprehensive reform of our air doctrine.\n\nFocus description: Tbd"

 # Row 1
 KUS_expand_tarva_air_academy:0 "Expand Tarva Air Academy"
 KUS_expand_tarva_air_academy_desc:0 "The Tarva Air Academy has long been the cradle of our pilots. Expanding its facilities and programs will produce better-trained aviators capable of operating in all conditions.\n\nFocus description: Tbd"
 KUS_baltair_investments:0 "Baltair Military Investments"
 KUS_baltair_investments_desc:0 "Invest in the Baltair military-industrial organization to expand our aircraft production capabilities in Kohla.\n\nFocus description: Tbd"

 # Row 2
 KUS_naval_air_development:0 "Naval Air Development"
 KUS_naval_air_development_desc:0 "Develop dedicated naval aviation platforms to project air power over the seas surrounding our territory.\n\nFocus description: Tbd"
 KUS_aerial_tech_development:0 "Aerial Technological Development"
 KUS_aerial_tech_development_desc:0 "Invest in cutting-edge aviation research to push the boundaries of aircraft performance and capability.\n\nFocus description: Tbd"
 KUS_supermanoevers:0 "Supermanoevers"
 KUS_supermanoevers_desc:0 "Train our pilots in advanced combat manoeuvres that will give them the edge in any aerial engagement.\n\nFocus description: Tbd"

 # Row 3
 KUS_naval_air_coordination:0 "Naval Air Coordination"
 KUS_naval_air_coordination_desc:0 "Establish integrated command structures between our naval and air forces to maximize the effectiveness of joint operations.\n\nFocus description: Tbd"
 KUS_standardization:0 "Standardization"
 KUS_standardization_desc:0 "Standardize our aircraft production lines for greater efficiency, accepting slightly higher experience costs for reduced production overhead.\n\nFocus description: Tbd"
 KUS_specialization:0 "Specialization"
 KUS_specialization_desc:0 "Specialize our aircraft designs for maximum performance, reducing experience costs at the expense of higher production complexity.\n\nFocus description: Tbd"

 # Row 4
 KUS_advanced_bombers:0 "Advanced Bombers"
 KUS_advanced_bombers_desc:0 "Develop next-generation bomber designs with extended range and reduced radar signatures for deep strike missions.\n\nFocus description: Tbd"
 KUS_maximize_performance:0 "Maximize Performance"
 KUS_maximize_performance_desc:0 "Push our aircraft to the limits of their performance envelope, extracting every ounce of speed and agility from our airframes.\n\nFocus description: Tbd"
 KUS_multirole_aircraft_design:0 "Multirole Aircraft Design"
 KUS_multirole_aircraft_design_desc:0 "Design versatile aircraft platforms capable of fulfilling multiple combat roles, reducing training costs and increasing operational flexibility.\n\nFocus description: Tbd"

 # Row 5
 KUS_ghosts_of_flusion:0 "Ghosts of Flusion"
 KUS_ghosts_of_flusion_desc:0 "The legend of the Ghosts of Flusion lives on. Our pilots now embody the spirit of those who came before, achieving air superiority through skill and determination.\n\nFocus description: Tbd"

 # Row 6
 KUS_finalize_airforce_reform:0 "Finalize Airforce Reform"
 KUS_finalize_airforce_reform_desc:0 "With all reforms in place, formalize the new doctrine and reap the benefits of our air force transformation.\n\nFocus description: Tbd"

 # Row 7
 KUS_taskforce_y:0 "Taskforce Y"
 KUS_taskforce_y_desc:0 "Establish Taskforce Y, a classified unit dedicated to the development and deployment of nuclear weapons delivery systems.\n\nFocus description: Tbd"

 # Row 8
 KUS_naval_nuclear_platforms:0 "Naval Nuclear Platforms"
 KUS_naval_nuclear_platforms_desc:0 "Develop submarine-based nuclear delivery platforms to ensure second-strike capability from beneath the waves.\n\nFocus description: Tbd"
 KUS_weapon_3234:0 "Weapon 3234"
 KUS_weapon_3234_desc:0 "Advance our nuclear weapons research program to develop more powerful and efficient warheads.\n\nFocus description: Tbd"
 KUS_mandate_nuclear_safehouses:0 "Mandate Personal Nuclear Safehouses"
 KUS_mandate_nuclear_safehouses_desc:0 "Mandate the construction of personal nuclear shelters across the Confederation to protect our population from the effects of radiation.\n\nFocus description: Tbd"

 # Row 9
 KUS_kohla_silo_system:0 "Kohla Silo System"
 KUS_kohla_silo_system_desc:0 "Construct a network of hardened missile silos in Kohla to provide a reliable land-based nuclear deterrent.\n\nFocus description: Tbd"
 KUS_icbm_defense_array:0 "ICBM Defense Array"
 KUS_icbm_defense_array_desc:0 "Deploy a comprehensive anti-ICBM defense network to protect our cities from nuclear attack.\n\nFocus description: Tbd"

 # Row 10
 KUS_operation_darkest_hour:0 "Operation Darkest Hour"
 KUS_operation_darkest_hour_desc:0 "With our nuclear arsenal complete and our defenses in place, we are prepared for the darkest hour. Our enemies will think twice before challenging the Confederation.\n\nFocus description: Tbd"

