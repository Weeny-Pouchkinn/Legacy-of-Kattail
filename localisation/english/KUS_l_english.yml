 # ==========================================
 # Political Events Localisation
 # ==========================================
 KUS_political_event.1.t:0 "Aligning the Opposition"
 KUS_political_event.1.desc:0 "With the President's political coalition firmly established, the opposition factions are beginning to align themselves. Some advocate for stability through cooperation, while others demand more radical change. How we handle the opposition now will shape the political landscape for years to come."
 KUS_political_event.1.a:0 "Stand firm and consolidate"
 KUS_political_event.1.b:0 "Bid for broader unity"

 KUS_political_event.2.t:0 "Public Protests"
 KUS_political_event.2.desc:0 "Large crowds have gathered in several major cities to protest and express discontent at the government and economic situation. Some protesters are peaceful, carrying signs demanding reform, while others have turned to violence. The authorities must decide whether to send in the army to restore order or allow the protests to continue."
 KUS_political_event.2.a:0 "Send the army!"
 KUS_political_event.2.b:0 "Let them be themselves and listen"

 KUS_political_event.3.t:0 "The President is Dead"
 KUS_political_event.3.desc:0 "Late last night, the President was found fatally wounded during a walk in Jarvalin. According to initial reports, a single shot was fired, striking him in the chest and causing him to collapse in a matter of minutes.\n\nSecurity personnel responded immediately, securing the area and transporting him to the nearest hospital, surrounded by his bodyguards on each side.\n\nAuthorities have launched an investigation into the murder. At this time, the identity of the assassin remains unknown."
 KUS_political_event.3.a:0 "Investigate thoroughly"
 KUS_political_event.3.b:0 "Our government carries on with a heavy fate"

 KUS_political_event.4.t:0 "Technocrat Propaganda"
 KUS_political_event.4.desc:0 "Secret reports indicate that technocratic groups are gaining strength through underground networks, challenging the established political structures. Their ideology, promising efficient governance through technical expertise and data-driven policy, is finding increasing support among the educated urban population.\n\nThrough various methods and public discussions, experts find that such messaging appears to be gaining traction among certain demographics."
 KUS_political_event.4.a:0 "Silence them!"
 KUS_political_event.4.b:0 "Let's support their movement"

 KUS_political_event.5.t:0 "Capitalism Bombing"
 KUS_political_event.5.desc:0 "A powerful explosion rocked the Capitalist's main industrial complex early this morning. The blast, believed to be the work of radical anti-capitalist elements, has caused significant damage and numerous casualties.\n\n[UNFINISHED]"
 KUS_political_event.5.a:0 "This cannot stand"

 KUS_political_event.6.t:0 "Technocrat Coup"
 KUS_political_event.6.desc:0 "In a swift and methodical takeover, technocratic elements have moved to seize control of key institutions within the Confederation. Government administrative centers, media outlets, and research facilities have all been occupied by technocrat loyalists.\n\nWithin hours, the technocrats have established de facto control over most government functions."
 KUS_political_event.6.a:0 "All fall into the new world order"

 KUS_political_event.10.t:0 "Flusiobalkan Union Invitation"
 KUS_political_event.10.desc:0 "The Kusnurk Confederation has established the Flusiobalkan Union and has extended an invitation for us to join as a founding member. Membership would provide collective security and economic cooperation, but would also bind us to the foreign policy decisions of the alliance."
 KUS_political_event.10.a:0 "We stand together!"
 KUS_political_event.10.b:0 "We will go our own way"

 KUS_political_event.20.t:0 "Integration Proposal"
 KUS_political_event.20.desc:0 "The Kusnurk Confederation, as leader of the Flusiobalkan Union, has proposed a full political integration of our nation into the greater Confederation. This would mean giving up our sovereignty in exchange for full representation within the Confederation's government and the benefits of complete economic and military union."
 KUS_political_event.20.a:0 "We join the Confederation"
 KUS_political_event.20.b:0 "We refuse to give up our independence"

 # Political Focus Tree Tooltips
 KUS_bolster_presidential_power_trait_tt:0 "President gains trait: §YBacked by Political Coalition§!"

