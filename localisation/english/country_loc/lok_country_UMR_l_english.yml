 UMR_event.1.t:0 "A new Republic"
 UMR_event.1.d:0 "The Kaiser brought much devastation to Sobani lands conquering all but the biggest fortress cities, it has become clear that the defensive confederation of old was no longer sufficient. Propelled to fame by her actions during the battle for the Tiir breach, Interim Grand Marshal von Pandasdorf managed to unite the disparate clans and city states into one Republic led by a united military, one where citizenship is only gained by military service, and your voting weight decided by rank. \nOne year from now its leader, the Grand Marshal, is to be elected from among the nation's generals, but now has come the time to rebuild. \n \nFor the Spirits and the Owlfather! For the Grand Marshal!"
 UMR_event.1.a:0 "...For the Republic we March!"
 UMR_event.2.t:0 "The First Elections"
 UMR_event.2.d:0 "Sobani from all Fortress cities and clans have proudly marched to the voting booths for the first ever elections. several candidates from among the nations high command have come forward in a bid for the position, yet the election results clearly favour one person."
 UMR_event.2.a:0 "von Pandasdorf is clearly the only choice."
 UMR_event.3.t:0 "The Katzen Question"
 UMR_event.3.d:0 "While katzen living among the Sobani is certainly nothing new, during the kaiser's occupation of Sobani land many katzen settlers flocked to plow the fields abandoned by our retreat into the fortress cities. When the tide turned many of these settlers chose to go home, yet large numbers of them were either unwilling or incapable of leaving. And tensions between the Sobani and these settlers remain high \n\nInterim Grand Marshal Von Pandasdorf has suggested integrating these settlers, encouraging them to join or even found new Sobani clans while also granting them the right to enter the military and gain citizenship. \nHardliners led by General Uilenburg instead argue we should forcibly expel the katzen settlers. \nAnd then some voices within high command argue instead to maintain the status quo, neither integrating nor expelling them, but by barring them from service, practically segregating them. "
 UMR_event.3.a:0 "Integrate them"
 UMR_event.3.b:0 "expel them"
 UMR_event.3.c:0 "segregate them"
 UMR_event.4.t:0 "Integration succesful"
 UMR_event.4.d:0 "The mixed species nature of Sobani clans made it easy for the kazen settlers to integrate within the sytsem, in many cases even forming new clans. while many are still adjusting, and the road ahead remains bumpy soon every katzen within UMR lands will be Sobani"
 UMR_event.4.a:0 "For the Republic we March!"
 UMR_event.5.t:0 "deportations succesful"
 UMR_event.5.d:0 "the process of deporting this many settlers was a lenghty one, especially considerimg the unstable situation in the katzen homelands to the north, but finaly our lands belong solely to the Sobani again!"
 UMR_event.5.a:0 "For the Republic we March!"

