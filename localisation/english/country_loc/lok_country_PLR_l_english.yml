 PLR_paluush_embassy:0 "Paluush Embassy"
 PLR_paluush_embassy_desc:0 "A permanent Paluushian delegation has settled in our capital. Its small corps of Earthmasters assists local builders with foundations, quarrying, and the occasional structural problem that would otherwise require months of labor. The mission will close if war begins with the Paluushian Realms."
 PLR_haven_of_paluushkind: "Haven of Paluushkind"
 PLR_haven_of_paluushkind_desc: "The Paluushes have enjoyed a prosperous, idyllic existence for millennia."
 PLR_technological_stagnation: "Technological Stagnation"
 PLR_technological_stagnation_desc: "There is almost no technological progress in the Realms. The Paluushes are content to use their Masteries to solve every problem."
 PLR_king_bunbun: "King Bunbun IV"
 PLR_king_bunbun_desc: "While technically relegated to little more than a figurehead, Bunbun IV continues to inspire Paluushes far and wide."
 PLR_paluush_masteries: "Paluush Masteries"
 PLR_paluush_masteries_desc: "The Paluush are known to possess and employ "Masteries" - the ability to magically manipulate the elements themselves. This greatly bolsters their army and industry."

 # ============================================================
 # DECISIONS
 # ============================================================

 PLR_paidi_progress:0 "Paidi's Reforms"
 PLR_bunswell_progress:0 "Bunswell's Reforms"
 PLR_launch_the_santa_bunbunia:0 "Launch the Santa Bunbunia"
 PLR_launch_the_santa_bunbunia_desc:0 "For generations, Paluush maps of Plushion have ended wherever inherited knowledge gave way to blank parchment, sea monsters, and cheerful speculation. King Bunbun IV and the Council of Twelve have now approved Watermaster Bungellan's proposal to replace those guesses with a single unbroken voyage around the planet.\n\nThe immense Santa Bunbunia will carry fifty Paluush explorers eastward from the Republic of the Bay. If Bungellan, Jumper Cook, and Owen de Bunville can guide her home again, their charts may open every shore of Plushion to Paluushian diplomacy."
 PLR_launch_the_santa_bunbunia_tt:0 "The Santa Bunbunia begins its circumnavigation. It will call at foreign shores roughly every §Ytwo weeks§!, unless canal access is refused.\n\n§RNational Mysticist countries may attempt to sink the expedition.§!"
 PLR_Grandmaster_Paidi:0 "Grandmaster Paidi"

 # ============================================================
 # EVENTS
 # ============================================================

 PLR_expedition.2.t:0 "The Santa Bunbunia Off Our Shores"
 PLR_expedition.2.d:0 "An extraordinary vessel flying the colors of [PLR.GetNameDef] has anchored just beyond our coast. Measuring some three hundred meters from bow to stern, the Santa Bunbunia moves without engines or sails: ranks of Paluush Watermasters bend the sea around its hull while Windmasters fill the air above it.\n\nWatermaster Bungellan has requested permission for his fifty explorers to come ashore, exchange maps, and learn something of our country. The expedition claims peaceful intentions, though the presence of Firemasters and Thundermasters aboard the ship suggests its crew is not entirely defenseless."
 PLR_expedition.2.a:0 "Order them away from our coast."
 PLR_expedition.2.b:0 "Give the explorers a warm greeting."
 PLR_expedition.2.c:0 "Arrange a proper tour of our nation."
 PLR_expedition.2.e:0 "Destroy this intruding monstrosity!"
 PLR_expedition.3.t:0 "The Santa Bunbunia Turned Away"
 PLR_expedition.3.d:0 "Bungellan reports that the authorities of [FROM.GetNameDef] refused the expedition permission to land. Coastal craft shadowed the Santa Bunbunia until Jumper Cook ordered a course back toward open water.\n\nThough disappointed by the reception, the crew observed the coastline from a prudent distance and added what they could to Owen de Bunville's charts. There are friendlier harbors ahead."
 PLR_expedition.4.t:0 "A Warm Welcome in [FROM.GetName]"
 PLR_expedition.4.d:0 "The Santa Bunbunia has been received warmly by [FROM.GetNameDef]. Curious crowds gathered along the waterfront as Bungellan's party came ashore, and even the most reserved officials struggled to conceal their fascination with the Paluush Masteries that propel the enormous ship.\n\nThe visit was brief but cordial. Bungellan believes the goodwill established here could support a permanent Paluushian diplomatic mission."
 PLR_expedition.5.t:0 "A Grand Tour of [FROM.GetName]"
 PLR_expedition.5.d:0 "The government of [FROM.GetNameDef] has treated Bungellan's expedition as honored guests. Local guides led the Paluushes through cities, workshops, monuments, and institutions unlike anything found in the Realms, while Owen de Bunville filled several volumes with observations and Jumper Cook corrected entire stretches of the expedition's charts.\n\nBungellan's report speaks glowingly of their hosts and recommends that the new friendship be made permanent through an exchange of diplomats."
 PLR_expedition.6.t:0 "Attack Repelled off [FROM.GetName]"
 PLR_expedition.6.d:0 "The visit to [FROM.GetNameDef] nearly ended in catastrophe. Without warning, shore batteries and patrol craft opened fire on the Santa Bunbunia, forcing the crew to defend the vessel in earnest. Thundermasters scattered the first attackers, Firemasters screened the withdrawal, and the Watermasters drove the ship beyond the range of the coast.\n\nThe hull is scorched but sound, and no damage is beyond the Healmaster contingent's ability to mend. Bungellan has ordered the expedition onward, albeit with rather less faith in the universal hospitality of foreign shores."
 PLR_expedition.7.t:0 "The Santa Bunbunia Is Lost"
 PLR_expedition.7.d:0 "A final, broken transmission has reached the Council of Twelve. Forces belonging to [FROM.GetNameDef] attacked the Santa Bunbunia during its approach and overwhelmed the crew before the ship could escape to open water. Witnesses report a vast plume of steam and flame, followed by wreckage sinking beneath the waves.\n\nWatermaster Bungellan, Jumper Cook, Owen de Bunville, and the other forty-seven Paluushes aboard are presumed dead. The Bungellan Circumnavigation is over."
 PLR_expedition.7.a:0 "Fifty lights have gone out."
 PLR_expedition.8.t:0 "The Santa Bunbunia Requests Canal Passage"
 PLR_expedition.8.d:0 "An urgent and rather incredulous message has arrived from the administrators of the Grand Canal. The Paluushian exploration ship Santa Bunbunia has reached its approaches and requests permission to cross into the Sun Sea.\n\nAt three hundred meters long, the vessel exceeds anything the canal's operators expected to handle. The Paluushes insist that their Watermasters can help guide the hull safely through the locks, but allowing this experiment through the heart of Lutécie will cause a considerable spectacle."
 PLR_expedition.8.a:0 "Open the locks and let them through."
 PLR_expedition.8.b:0 "The canal is not built for this madness."
 PLR_expedition.9.t:0 "Passage Through the Grand Canal Granted"
 PLR_expedition.9.d:0 "[FROM.GetNameDef] has granted the Santa Bunbunia passage through the Grand Canal. Bungellan reports that the lock operators appear deeply alarmed by the dimensions of his ship, but none have yet withdrawn their permission.\n\nWith Paluush Watermasters stationed along the hull and every spare pair of eyes watching the stone walls, the crossing through Lutécie can begin."
 PLR_expedition.9.a:0 "Steady paws and slow water."
 PLR_expedition.10.t:0 "Passage Through the Grand Canal Refused"
 PLR_expedition.10.d:0 "[FROM.GetNameDef] has refused to let the Santa Bunbunia enter the Grand Canal. Jumper Cook has therefore plotted a new course around the entirety of Roqualia, adding months of exposed ocean travel to the expedition.\n\nThe crew have accepted the detour with good humor. Bungellan's report dryly observes that a circumnavigation can hardly object to a little more circumference."
 PLR_expedition.10.a:0 "Set a course around Roqualia."
 PLR_expedition.11.t:0 "The Santa Bunbunia Requests Crabspian Passage"
 PLR_expedition.11.d:0 "The Paluushian Santa Bunbunia has arrived at our northern canal and requests a continuous passage through the Crabspian Sea. Its intended route would take the immense ship through the first canal, across both the upper and lower lobes of the inland sea, and finally through the southern canal toward the next stage of its voyage.\n\nThe expedition offers the assistance of its Watermasters and promises to obey every instruction issued by our canal authorities. Even so, guiding a three-hundred-meter vessel across the entire system will test every lock, bridge, and harbor along the route."
 PLR_expedition.11.a:0 "Grant them passage through the Crabspian."
 PLR_expedition.11.b:0 "They will have to go around."
 PLR_expedition.12.t:0 "Crabspian Passage Granted"
 PLR_expedition.12.d:0 "[FROM.GetNameDef] has approved the Santa Bunbunia's passage through the Crabspian canal system. Local pilots will board at the northern locks and remain with the expedition until it clears the southern canal.\n\nJumper Cook has ordered the crew to prepare for a long succession of narrow channels and exacting maneuvers. If successful, the passage will carry the Paluushes cleanly through the heart of the continent."
 PLR_expedition.12.a:0 "Take on the pilots."
 PLR_expedition.13.t:0 "Crabspian Passage Refused"
 PLR_expedition.13.d:0 "[FROM.GetNameDef] has denied the Santa Bunbunia access to the Crabspian canal system. Rather than contest the decision, Bungellan and Jumper Cook have chosen a long oceanic detour around the continent.\n\nThe revised route is safe enough, but it will add three months to the journey and consume much of the expedition's carefully stored provisions."
 PLR_expedition.13.a:0 "We have sailed farther for less."
 PLR_expedition.14.t:0 "A Paluush Embassy?"
 PLR_expedition.14.d:0 "Two months after the visit of the Santa Bunbunia, an ornate message from [PLR.GetNameDef] has arrived at our foreign ministry. Citing Bungellan's favorable report, the Council of Twelve proposes the establishment of a permanent Paluushian embassy in our capital.\n\nThe delegation would include several Earthmasters willing to lend their talents to local construction projects. In return, the Paluushes ask for formal diplomatic protections and a pledge that neither country will take up arms against the other."
 PLR_expedition.14.a:0 "Welcome the Paluush delegation."
 PLR_expedition.14.b:0 "Politely decline their proposal."
 PLR_expedition.15.t:0 "The Santa Bunbunia Returns"
 PLR_expedition.15.d:0 "Bells, horns, and jubilant shouts filled the Republic of the Bay as the Santa Bunbunia appeared on the horizon and entered Caroshel harbor. All fifty members of the Bungellan Circumnavigation have returned, carrying charts of the entire planet, scientific records from Terra Borealis, and accounts of civilizations that most Paluushes had known only as distant names.\n\nKing Bunbun IV and the Council of Twelve welcomed Bungellan, Jumper Cook, and Owen de Bunville ashore before an enormous crowd. Their voyage has closed the circle around Plushion and opened countless paths beyond the Realms."
 PLR_expedition.15.a:0 "The whole world now fits upon our maps."
 PLR_expedition_news.1.t:0 "The Bungellan Circumnavigation Begins"
 PLR_expedition_news.1.d:0 "Following a decision by King Bunbun IV and the Council of Twelve, [PLR.GetNameDef] has announced the beginning of the Bungellan Circumnavigation: an ambitious voyage to chart the whole of Plushion and locate the mythical Terra Borealis at the northern pole.\n\nThe expedition is led by Watermaster Bungellan, with Airmaster Jumper Cook responsible for navigation and Healmaster Owen de Bunville overseeing cartography and scientific records. Their vessel, the three-hundred-meter Santa Bunbunia, carries fifty Paluushes whose Water and Windmasteries will provide its propulsion, while a small contingent of Firemasters and Thundermasters stands ready to deter attack."
 PLR_expedition_news.1.a:0 "May the currents carry them home."
 PLR_expedition_news.2.t:0 "The Santa Bunbunia Has Been Sunk!"
 PLR_expedition_news.2.d:0 "The Paluushian exploration vessel Santa Bunbunia has been destroyed off the coast of [event_target:PLR_santa_bunbunia_attacker.GetNameDef]. Reports indicate that local forces opened fire during the expedition's approach, overwhelming the Paluush defenders and sending the immense ship beneath the waves.\n\nAll fifty members of the Bungellan Circumnavigation, including Watermaster Bungellan, Jumper Cook, and Owen de Bunville, are presumed lost. The voyage that set out to chart Plushion and establish peaceful contact between its civilizations has ended in wreckage, and outrage is spreading throughout the Paluushian Realms."
 PLR_expedition_news.2.a:0 "Exploration met barbarism."
 PLR_expedition_news.3.t:0 "The Santa Bunbunia Crosses the Grand Canal"
 PLR_expedition_news.3.d:0 "The Santa Bunbunia has completed its passage through the Grand Canal, carrying the Bungellan Circumnavigation from the Solakean Sea into the Sun Sea. Crowds packed the waterfronts of Lutécie to watch the three-hundred-meter Paluushian ship inch between the canal walls under the combined guidance of local pilots and Watermasters.\n\nThe spectacle proved less enjoyable for the lock operators, several of whom reportedly panicked upon first seeing the ship bear down upon their stations. Despite hurried measurements, shouted orders, and margins sometimes counted in mere handspans, the vessel cleared every lock without serious damage and has resumed its eastward voyage."
 PLR_expedition_news.3.a:0 "A very large ship in a very narrow place."
 PLR_expedition_news.4.t:0 "Paluush Explorers Reach Terra Borealis"
 PLR_expedition_news.4.d:0 "The Bungellan Circumnavigation has reached the northern pole and confirmed the existence of the long-theorized Terra Borealis. Unfortunately for generations of Paluush geographers, it is not a hidden green continent, an ancient kingdom, or the roof of a world-spanning cavern. It is ice.\n\nAfter planting the Paluushian banner upon a drifting shelf, Owen de Bunville recorded measurements of the polar climate while Bungellan's crew searched in vain for anything resembling the wonders shown on old maps. Their disappointment was reportedly considerable, though the discovery (and the correction of centuries of imaginative cartography) remains a historic achievement."
 PLR_expedition_news.4.a:0 "At least the mapmakers can stop guessing."
 PLR_expedition_news.5.t:0 "The Santa Bunbunia Crosses the Crabspian Sea"
 PLR_expedition_news.5.d:0 "The Santa Bunbunia has completed an extraordinary passage through the Crabspian canal system. Entering by the northern canal, the Paluushian explorers crossed the upper lobe of the inland sea, threaded the narrows into its lower waters, and finally emerged through the southern canal.\n\nLocal pilots and Paluush Watermasters worked side by side to guide the immense hull through locks never designed for such a vessel. With the crossing complete, the Bungellan Circumnavigation has avoided months of additional ocean travel and resumed its route toward the western and southern coasts of Plushion."
 PLR_expedition_news.5.a:0 "Another continent crossed by water."
 PLR_expedition_news.6.t:0 "The Bungellan Circumnavigation Succeeds!"
 PLR_expedition_news.6.d:0 "The Santa Bunbunia has returned to the Republic of the Bay, completing the first recorded circumnavigation of Plushion. Watermaster Bungellan, Airmaster Jumper Cook, Healmaster Owen de Bunville, and all forty-seven of their companions were greeted by King Bunbun IV, the Council of Twelve, and jubilant crowds lining Caroshel harbor.\n\nThe expedition brings home a planetary chart of unprecedented scope, records from the ice of Terra Borealis, and reports from civilizations along every major sea. Its most enduring legacy may be diplomatic: several governments visited by the Paluushes are already considering permanent embassies, turning a voyage of discovery into the beginning of a worldwide network of relations."
 PLR_expedition_news.6.a:0 "Plushion has become a smaller world."

