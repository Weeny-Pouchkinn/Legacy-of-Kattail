 KUS_economic_rebound:0 "Economic Rebound"
 KUS_economic_rebound_desc:0 "The economy is experiencing a period of rapid growth as accumulated reforms take effect."
 KUS_solid_foundation:0 "Solid Foundation"
 KUS_solid_foundation_desc:0 "A strong industrial base has been established, providing lasting benefits to the nation's productive capacity."
 KUS_bureau_of_state_industry_2:0 "Bureau of State Industry"
 KUS_bureau_of_state_industry_2_desc:0 "A centralized bureau coordinates state industrial efforts, with particular focus on arms production."
 KUS_bureau_of_state_industry_3:0 "Bureau of State Industry"
 KUS_bureau_of_state_industry_3_desc:0 "A centralized bureau coordinates state industrial efforts with expanded authority over both construction and arms production."
 KUS_fine_tuned_industry:0 "Fine-Tuned Industry"
 KUS_fine_tuned_industry_desc:0 "Rapid economic reforms have fine-tuned industrial production, particularly in the military sector."
 KUS_military_industrial_complex_rapid:0 "Military Industrial Complex"
 KUS_military_industrial_complex_rapid_desc:0 "The integration of military and civilian industry under centralized coordination maximizes national productive output."
 KUS_private_enterprise:0 "Private Enterprise"
 KUS_private_enterprise_desc:0 "Support for private enterprises has spurred innovation in weapons and support equipment research."
 KUS_elrong:0 "Elrong"
 KUS_elrong_desc:0 "Elrong is a major Kusnurk industrial concern specializing in support equipment, trains, and railway construction."
 KUS_vao_extraction:0 "Väo Extraction Inc."
 KUS_vao_extraction_desc:0 "Väo Extraction Inc. is the leading Kusnurk mining corporation, specializing in mineral resource extraction."
 KUS_divikatel:0 "Divikatel"
 KUS_divikatel_desc:0 "Divikatel is a Kusnurk chemical and industrial conglomerate with expertise in synthetic and industrial technologies."
 KUS_plan_colossus_equipment:0 "Plan Colossus Equipment"
 KUS_plan_colossus_equipment_desc:0 "Capital ship production costs reduced."
 KUS_expand_naval_yards_equipment:0 "Expanded Naval Yards"
 KUS_expand_naval_yards_equipment_desc:0 "Further capital ship production cost reductions."
 KUS_squadron_flagships_equipment:0 "Squadron Flagships"
 KUS_squadron_flagships_equipment_desc:0 "Heavy cruiser combat and production improvements."
 KUS_carrier_research_right_equipment:0 "Carrier Armor Research"
 KUS_carrier_research_right_equipment_desc:0 "Increased carrier armor protection."
 KUS_fleet_nymph_equipment:0 "Fleet Nymph Equipment"
 KUS_fleet_nymph_equipment_desc:0 "Submarine production costs reduced."
 KUS_fleet_colossus_equipment:0 "Fleet Colossus Equipment"
 KUS_fleet_colossus_equipment_desc:0 "Combined capital ship production improvements."
 KUS_fleet_harpie_equipment:0 "Fleet Harpie Equipment"
 KUS_fleet_harpie_equipment_desc:0 "Combined carrier and heavy cruiser improvements."
 KUS_standardization_equipment:0 "Standardized Air Production"
 KUS_standardization_equipment_desc:0 "Reduced air equipment production costs through standardization."
 KUS_specialization_equipment:0 "Specialized Air Production"
 KUS_specialization_equipment_desc:0 "Higher air equipment production costs due to specialization."
 KUS_ghosts_of_flusion_standardization_equipment:0 "Ghosts of Flusion (Standardized)"
 KUS_ghosts_of_flusion_standardization_equipment_desc:0 "Combined air equipment improvements with standardized production."
 KUS_ghosts_of_flusion_specialization_equipment:0 "Ghosts of Flusion (Specialized)"
 KUS_ghosts_of_flusion_specialization_equipment_desc:0 "Combined air equipment improvements with specialized production."
 KUS_halberd_at_equipment:0 "Halberd AT Equipment"
 KUS_halberd_at_equipment_desc:0 "Infantry anti-tank improvements."
 KUS_industrial_saturation_equipment:0 "Industrial Saturation"
 KUS_industrial_saturation_equipment_desc:0 "Reduced artillery production costs."
 KUS_project_boom_gun_equipment:0 "Project Boom: Big Guns"
 KUS_project_boom_gun_equipment_desc:0 "SP Artillery attack improvements."
 KUS_project_boom_armor_equipment:0 "Project Boom: Thick Armor"
 KUS_project_boom_armor_equipment_desc:0 "SP Artillery armor and breakthrough improvements."
 KUS_full_mechanization_equipment:0 "Full Mechanization"
 KUS_full_mechanization_equipment_desc:0 "Reduced mechanized and motorized equipment costs."
 KUS_strike_supernova_gun_equipment:0 "Supernova Arsenal (Gun)"
 KUS_strike_supernova_gun_equipment_desc:0 "Combined infantry, artillery, and SP artillery improvements."
 KUS_strike_supernova_armor_equipment:0 "Supernova Arsenal (Armor)"
 KUS_strike_supernova_armor_equipment_desc:0 "Combined infantry, artillery, and SP artillery improvements."
 KUS_speed_of_light_equipment:0 "Speed of Light Equipment"
 KUS_speed_of_light_equipment_desc:0 "Combined mechanized and motorized equipment improvements."
 KUS_naval_air_coordinators:0 "Naval-Air Coordinators"
 KUS_naval_air_coordinators_desc:0 "Integrated naval-air coordination improves fleet effectiveness."
 KUS_good_training:0 "Good Training"
 KUS_good_training_desc:0 "A rigorous and efficient training methodology produces battle-ready soldiers faster."
 KUS_eog:0 "Erioperatsioonide Grupp"
 KUS_eog_desc:0 "An elite special operations group has been established."
 KUS_tuumavagi:0 "Tuumavagi"
 KUS_tuumavagi_desc:0 "The nuclear weapons program is underway."
 KUS_tuumavagi_2:0 "Tuumavagi"
 KUS_tuumavagi_2_desc:0 "The nuclear weapons program is underway, with improved safety measures."
 KUS_navy_mastery_boost:0 "Navy Reform Momentum"
 KUS_navy_mastery_boost_desc:0 "Recent naval reforms are accelerating the fleet's proficiency."
 KUS_airforce_mastery_boost:0 "Airforce Reform Momentum"
 KUS_airforce_mastery_boost_desc:0 "Recent airforce reforms are accelerating pilot proficiency."
 KUS_army_mastery_boost:0 "Army Reform Momentum"
 KUS_army_mastery_boost_desc:0 "Recent army reforms are accelerating ground force proficiency."
 KUS_tech_education_bonus:0 "Technical Education Initiative"
 KUS_tech_education_bonus_desc:0 "A mass technical education program is temporarily boosting our research capabilities."
 KUS_rampant_extremism:0 "Rampant Extremism"
 KUS_rampant_extremism_desc:0 "The country has been in a tough spot for multiple years, with the Katzen tensions, Roqualian apathy and rising tensions along the Nekastoni border, the political climate is very extreme, leading to widespread turmoil and terrorism. The elected government is in a precarious position. If the government were to collapse there would be dire consequences."
 KUS_suppressed_extremism:0 "Suppressed Extremism"
 KUS_suppressed_extremism_desc:0 "The country has gone through a rapid change in its political climate, with more people than ever supporting the legitimate government, however some will refuse to yield without resistance. If the government were to collapse there would be dire consequences."
 KUS_underground_extremism:0 "Underground Extremism"
 KUS_underground_extremism_desc:0 "Peace reigns on the streets and people walk without fear after years of terrorist attacks and unrest, but this peace is still fragile. If the government were to collapse there would be dire consequences."
 KUS_uhkus:0 "Uhkus"
 KUS_uhkus_desc:0 "National pride swells as the people rally behind their government and the cause of the Confederation."
 KUS_uhkus_greater:0 "Uhkus"
 KUS_uhkus_greater_desc:0 "The flame of Kusnurk pride burns brighter than ever. Our people stand united and ready to defend their homeland."
 KUS_uhkus_anti_katzen:0 "Uhkus - Anti-Kaiserist Diplomacy"
 KUS_uhkus_anti_katzen_desc:0 "Kusnurk's opposition is directed against Kaiserist domination, not the Katzen people. Public resolve has hardened behind a diplomatic campaign to contain every regime that carries the Kaiser's political legacy."
 KUS_eyes_towards_roqualian_sphere:0 "Eyes Towards the Roqualian Sphere"
 KUS_eyes_towards_roqualian_sphere_desc:0 "Roqualian technicians, computing theorists, and industrial missions have become a common sight in Kusnurk. Their expertise is strengthening the economy and accelerating digital research, though the government must spend considerable political capital coordinating the partnership."
 KUS_reintroducing_democratic_principles:0 "Reintroducing Democratic Principles"
 KUS_reintroducing_democratic_principles_desc:0 "The institutions inherited from dictatorship and military occupation are being replaced by elected assemblies, protected opposition parties, and an independent civil service. The transition is disruptive, but it is intended to leave behind a government capable of genuine self-rule."
 KUS_reformed_military_academy:0 "Reformed Military Academy"
 KUS_reformed_military_academy_desc:0 "The military academy has been reformed, producing better trained and more capable officers at lower cost."
 KUS_kubervagi:0 "Kübervägi"
 KUS_kubervagi_desc:0 "Our cyber warfare capabilities provide a significant intelligence advantage."
 KUS_kubervagi_lar:0 "Kübervägi"
 KUS_kubervagi_lar_desc:0 "Our advanced cyber warfare program provides exceptional decryption capabilities."
 KUS_public_opposition:0 "Public Opposition"
 KUS_public_opposition_desc:0 "The population opposes the new technocratic government. Stability is low and few are willing to serve in the military."
 KUS_extremism_ascendant:0 "Extremism Ascendant"
 KUS_extremism_ascendant_desc:0 "With the president dead and the government in chaos, extremist factions are rapidly gaining power and influence."
 KUS_technocrat_propaganda:0 "Technocrat Propaganda"
 KUS_technocrat_propaganda_desc:0 "Technocratic groups have been circulating propaganda, gaining traction among the populace."
 KUS_burgeoning_technocracy:0 "Burgeoning Technocracy"
 KUS_burgeoning_technocracy_desc:0 "The new technocratic council is consolidating power and implementing rational governance."
 KUS_burgeoning_technocracy_2:0 "Burgeoning Technocracy"
 KUS_burgeoning_technocracy_2_desc:0 "Scientific development is being prioritized, though at the cost of increased consumer goods demand."
 KUS_burgeoning_technocracy_3:0 "Burgeoning Technocracy"
 KUS_burgeoning_technocracy_3_desc:0 "Economic insulation policies have reduced resource exports while boosting domestic extraction."
 KUS_burgeoning_technocracy_4:0 "Burgeoning Technocracy"
 KUS_burgeoning_technocracy_4_desc:0 "High-tech factories are pushing production efficiency to new heights."
 KUS_burgeoning_technocracy_5:0 "Burgeoning Technocracy"
 KUS_burgeoning_technocracy_5_desc:0 "The cybernetics program has further enhanced our research capabilities."
 KUS_reaching_singularity:0 "Reaching for the Singularity"
 KUS_reaching_singularity_desc:0 "We have pushed beyond all known boundaries of science and technology. The singularity approaches."
 KUS_milnet:0 "MilNet"
 KUS_milnet_desc:0 "A military network connecting all units provides improved coordination and reduced experience loss."
 KUS_babuloon:0 "Babüloon"
 KUS_babuloon_desc:0 "The Babüloon railway artillery system provides devastating bombardment capability."
 KUS_adaptiv:0 "Adaptiv"
 KUS_adaptiv_desc:0 "Project Adaptiv has produced recon support equipment with unparalleled reconnaissance and breakthrough capabilities."
 KUS_fooniks:0 "Fööniks"
 KUS_fooniks_desc:0 "Project Fööniks has developed advanced air crew training that reduces casualties and manpower requirements."
 KUS_flusiobalkan_associate_idea:0 "Flusiobalkan Associate"
 KUS_flusiobalkan_associate_idea_desc:0 "This country is connected to the Flusiobalkan Union by commercial privileges, military access agreements, and guarantees of peaceful consultation. The arrangement provides useful confidence without imposing the duties of formal membership."
 KUS_flusiobalkan_economic_region_2:0 "Flusiobalkan Economic Region"
 KUS_flusiobalkan_economic_region_2_desc:0 "The Pan-Flusiobalkan Bank has further reduced consumer goods needs and boosted industrial output."
 KUS_fbda:0 "Flusiobalkan Defence Army"
 KUS_fbda_desc:0 "The joint Flusiobalkan Defence Army provides additional recruitable population and improved military training."
 KUS_solabalkan_union:0 "Solabalkan Union"
 KUS_solabalkan_union_desc:0 "The fully united Solabalkan Union provides comprehensive economic and military benefits to all member states."
 KUS_roqualian_gratitude:0 "Roqualian Gratitude"
 KUS_roqualian_gratitude_desc:0 "Roqualia is deeply grateful for the return of the Freistaat lands, reducing our consumer goods needs through favorable trade agreements."
 KUS_autonomous_urban_communes:0 "Autonomous Urban Communes"
 KUS_autonomous_urban_communes_desc:0 "Local urban centers have established autonomous communes, reorganizing local productivity and political dynamics."
 KUS_independent_militaries:0 "Independent Militaries"
 KUS_independent_militaries_desc:0 "Self-organized local defense forces operate independently to defend their home states."
 KUS_bolstered_presidential_power:0 "Bolstered Presidential Power"
 KUS_bolstered_presidential_power_desc:0 "The president's executive authority has been significantly bolstered, streamlining political decision making."
 KUS_linguistic_centralization:0 "Linguistic Centralization"
 KUS_linguistic_centralization_desc:0 ""
 KUS_felinea_solakean_crossroads:0 "Felinea-Solakean Crossroads"
 KUS_felinea_solakean_crossroads_desc:0 ""
 KUS_autonomous_urban_communes_doubled:0 "Empowered Autonomous Urban Communes"
 KUS_autonomous_urban_communes_doubled_desc:0 "Nekaston's experience has expanded the authority and productive reach of Kusnurk's autonomous communes."
 KUS_exhausted_industry:0 "Exhausted Industry"
 KUS_exhausted_industry_desc:0 "The nuclear crash program has consumed specialist labor, machine tools, and construction capacity at a pace the civilian economy cannot sustain."
 KUS_radiation_treatment_infrastructure:0 "Radiation Treatment Infrastructure"
 KUS_radiation_treatment_infrastructure_desc:0 "Protected clinics, mobile decontamination units, and trained radiological teams reduce deaths after exposure."
 KUS_ubiquitous_safehouses:0 "Ubiquitous Urban Safehouses"
 KUS_ubiquitous_safehouses_desc:0 "Reinforced shelters and practiced evacuation plans reduce civilian deaths from nuclear blast effects."
 KUS_fall_zocker:0 "Fall Zocker"
 KUS_fall_zocker_desc:0 "Every operational reserve has been committed to breaking the Roqualian line before its enormous depth can be brought to bear."

