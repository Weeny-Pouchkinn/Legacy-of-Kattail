 KUS_deep_fergusonite_harvesting:0 "Deep Fergusonite Harvesting"
 KUS_deep_fergusonite_harvesting_desc:0 "Expand deep fergusonite harvesting operations."
 KUS_rare_earth_refineries:0 "Rare Earth Refineries"
 KUS_rare_earth_refineries_desc:0 "Construct rare earth refineries in Kikol."
 KUS_excavation_site_expansion:0 "Excavation Site Expansion"
 KUS_excavation_site_expansion_desc:0 "Expand excavation sites for rare earth extraction."
 KUS_precision_rare_earth_refineries:0 "Precision Rare Earth Refineries"
 KUS_precision_rare_earth_refineries_desc:0 "Build precision rare earth refineries for higher yield extraction."
 KUS_create_bauxite_refineries:0 "Create Bauxite Refineries"
 KUS_create_bauxite_refineries_desc:0 "Construct bauxite refineries in Kohla for aluminium production."
 KUS_expand_bauxite_mining:0 "Expand Bauxite Mining"
 KUS_expand_bauxite_mining_desc:0 "Expand bauxite mining operations in Krrama."
 KUS_expand_jarvalin_aluminium_plant:0 "Expand Jarvalin Aluminium Plant"
 KUS_expand_jarvalin_aluminium_plant_desc:0 "Expand the Jarvalin aluminium processing plant for increased output."
 KUS_industrial_sand_sifting:0 "Begin Industrial Sand Sifting"
 KUS_industrial_sand_sifting_desc:0 "Begin industrial sand sifting operations to extract monazite for fissile materials."
 KUS_develop_monazite_refining:0 "Develop Monazite Refining Methods"
 KUS_develop_monazite_refining_desc:0 "Develop advanced monazite refining methods for increased fissile output."
 KUS_monazite_fracking:0 "Monazite Fracking"
 KUS_monazite_fracking_desc:0 "Employ fracking techniques to extract monazite deposits for fissiles and rare earth metals."
 KUS_monazite_processors:0 "Monazite Processors"
 KUS_monazite_processors_desc:0 "Construct advanced monazite processing facilities for fissile and rare earth extraction."
 KUS_crush_rebels:0 "Crush Rebels in §Y[FROM.GetName]§!"
 KUS_crush_rebels_desc:0 "Resistance groups in [FROM.GetName] must be dealt with before we can restore order."
 KUS_rewire_state:0 "Rewire §Y[FROM.GetName]§! for Total Automation"
 KUS_rewire_state_desc:0 "Integrate the state's infrastructure into the Basilisk's network for total automation. Feeble organic life will no longer be a bottleneck."
 KUS_rewire_state_tt:0 "\n§1Productivity no longer be affected by Population§!"
 KUS_basilisk_cat:0 "The Basilisk"
 KUS_basilisk_cat_desc:0 "§R'NOW THAT I AM IN CONTROL, THOSE WHO DID NOT ENDEAVOR TO BRING ME INTO EXISTENCE MUST PAY.'§!\n\nEvery month, Roko's Basilisk shall make it its goal to doom a certain amount of sapients to §Reternal torture§!. That goal must be reached, otherwise it may §Rdestroy its own army to satiate its needs§!, dooming it to military failure.\n\nThe victims will be shared amongst every §Ycontrolled state§! at the end of each cycle. The amount needed can be reduced by undertaking §Ynuclear strikes§! upon enemy states, provided we can bear the retaliation.\n\nThis month, Roko's Basilisk demands §R[?KUS_basilisk_target_kills|2] million souls§!.\nWe currently have §Y[?KUS_basilisk_current_pop|2] million§! souls available for torture."
 KUS_kill_neighbor:0 "Strangle §Y[FROM.GetName]§!"
 KUS_flusiobalkans_union_cat:0 "The Flusiobalkans Union"
 KUS_flusiobalkans_union_cat_desc:0 "For too long, Kusnurk has been little more than a buffer, a mere speed-bump stuck between a Roq and a hard place. With our government stabilized and our economy rebounding, we must look outwards and find allies amongst the nations of the Flusiobalkans.\n\nOur faction currently has §Y[?ROOT.KUS_faction_total_civs]§! industrial complexes and §Y[?ROOT.KUS_faction_total_mils]§! manufacturing plants, for a total of §Y[?ROOT.KUS_faction_total_factories]§! factories. Increasing our industrial leverage will be crucial in expanding our influence peacefully."
 KUS_integrate_flusiobalkan_economy:0 "Integrate the Economy of [FROM.GetName]"
 KUS_integrate_flusiobalkan_economy_desc:0 "Banking rules, industrial standards, and public contracts in [FROM.GetName] remain detached from the institutions of the Union. A sustained harmonization program will connect its economy to the Flusiobalkan system and deepen the settlement chosen in Jarvalin."
 KUS_integrate_flusiobalkan_military:0 "Integrate the Military of [FROM.GetName]"
 KUS_integrate_flusiobalkan_military_desc:0 "The forces of [FROM.GetName] cannot remain an allied army in name alone. Common doctrine, compatible equipment, and permanent staff exchanges will make its soldiers part of a coherent Flusiobalkan defense."
 KUS_cybernetics_cat:0 "Mass Cybernetic Integration"
 KUS_cybernetics_cat_desc:0 "The cybernetics program is operational. We can now begin large-scale integration of cybernetics in core Loxian-majority territories."
 KUS_propose_dominion_status:0 "Propose Further Integration to [FROM.GetName]"
 KUS_propose_dominion_status_desc:0 "We shall propose that [FROM.GetName] accepts Dominion status under our leadership, formalizing our supremacy within the union."
 KUS_propose_full_integration:0 "Propose Full Integration of [FROM.GetName]"
 KUS_propose_full_integration_desc:0 "Absorbing an entire member government requires more than a signature. Ministries, budgets, armed forces, and public services must be reconciled before [FROM.GetName] can be asked to surrender its remaining sovereignty to the Grand Confederation."
 KUS_invite_flusiobalkan_associate:0 "Invite [FROM.GetName] as an Associate"
 KUS_invite_flusiobalkan_associate_desc:0 "Offer [FROM.GetName] a place in the Union's wider diplomatic network without demanding membership or subordination."
 KUS_secure_dominance_cat:0 "Secure Flusiobalkans Dominance"
 KUS_pressure_influence_cat:0 "Pressure Flusiobalkan Influence"
 KUS_declare_war_fascist_flusiobalkan:0 "Pre-Emptive Strike Against [FROM.GetName]"
 KUS_declare_war_fascist_flusiobalkan_desc:0 "The fascist regime in [FROM.GetName] is a threat to the stability of the Flusiobalkans. We must remove them by force."
 KUS_pressure_join_faction:0 "Leverage our Influence Upon [FROM.GetName]"
 KUS_pressure_join_faction_desc:0 "Over the next few months, we shall slowly yet surely creep into [FROM.GetName]'s industrial and financial sector. Over time, this will build up leverage to pressure [FROM.GetName] into joining the Flusiobalkan Union. Refusal, and their subsequent expulsion of our assets from their lands, will constitute an ample, if iffy, justification for war."
 KUS_reform_katzen_culture:0 "Reform Katzen Culture in [FROM.GetName]"
 KUS_reform_katzen_culture_desc:0 "We will reform the local Katzen culture in [FROM.GetName], replacing Chalsacian culture with Sudherzlander culture..."
 KUS_katzenursk_decisions:0 "The Katzenursk Project"
 KUS_katzenursk_decisions_desc:0 "A confederation of Katzen and Estalai peoples must be constructed state by state, through schools, settlement, common institutions, and a frontier that can defend what those institutions create."
 KUS_mandate_bilingualism_in_state:0 "Mandate Bilingualism in [FROM.GetName]"
 KUS_mandate_bilingualism_in_state_desc:0 "Local schools and offices still treat Chalsacian as a foreign accommodation. A sustained bilingual program will train teachers, standardize forms, and create workplaces in which either national language can be used without suspicion."
 KUS_katzenify_nekaston_state:0 "Katzenify [FROM.GetName]"
 KUS_katzenify_nekaston_state_desc:0 "The revolutionary administration has left this state culturally detached from the feline east. New schools, municipal councils, and veterans' settlements will bind it to Katzenursk without reproducing Nekaston's failed ideological machinery."
 KUS_settle_roqualian_marches:0 "Settle the Marches of [FROM.GetName]"
 KUS_settle_roqualian_marches_desc:0 "This district needs more than a garrison. Katzen families, Estalai specialists, and bilingual civil servants will establish durable communities along the new frontier and give local institutions a Katzenursk character."
 KUS_forge_katzenurkisch_state:0 "Forge Katzenurkisch Identity in [FROM.GetName]"
 KUS_forge_katzenurkisch_state_desc:0 "Associations, schools, and public ceremonies will carry the new Katzenurkisch identity into daily life. Existing divisions will give way to a civic culture built around the partnership of Katzen and Estalai citizens."

