 # ============================================================
 # FOCUSES
 # ============================================================

 KUS_get_off_the_ground:0 "Get Off the Ground"
 KUS_get_off_the_ground_desc:0 "The Imperium's collapse did not destroy Kusnurk's factories; it made their products worthless overnight. Workshops built for an immense tariff-free market now sit beside silent sidings and warehouses of unsold specialist goods. Emergency credit, replacement orders and basic repairs will put Estalai hands back to work before idleness finishes what the collapse began."
 KUS_lay_a_foundation:0 "Lay a Foundation"
 KUS_lay_a_foundation_desc:0 "Recovery cannot rest on another distant market or another Katzen administrator's promise. Jarvalin will restore the customs service, stabilize commercial credit and reconnect the provincial treasuries to a common budget. The work is unglamorous, but Kusnurk needs functioning ledgers, substations and freight schedules more than it needs monuments to independence."
 KUS_populate_ministry_of_economy:0 "Populate the Ministry of Economy"
 KUS_populate_ministry_of_economy_desc:0 "The Ministry of Economy presently consists of a title, several borrowed offices and stacks of Imperial forms nobody fully understands. Port officials, provincial accountants, union statisticians and former factory managers will be gathered in Jarvalin. Their first task is simply to discover what Kusnurk still produces, owns and owes."
 KUS_focus_on_industrial_infrastructure:0 "Focus on Industrial Infrastructure"
 KUS_focus_on_industrial_infrastructure_desc:0 "The old industrial web was designed to feed the Imperium, not to bind the Confederation together. Rail spurs terminate at abandoned depots, power lines ignore state borders and the Channel ports compete rather than cooperate. New freight corridors from Jarvalin to the straits will turn scattered plants into one national economy."
 KUS_focus_on_industrial_infrastructure_tt:0 "Unlocks the §Y$KUS_industrial_construction_1$§! decision in §YEconomic Policy§! to build a §YCivilian Factory§!, repeatable up to §Y4§! times."
 KUS_seek_expert_economists:0 "Seek Expert Economists"
 KUS_seek_expert_economists_desc:0 "Many of the experts who kept the Imperial market running departed with it, taking contacts and institutional memory with them. Kusnurk will invite Estalai professionals home and seek advice from trusted commercial partners abroad. They may explain the old system, but policy will be written in Jarvalin rather than dictated from Katown."
 KUS_sustainable_development:0 "Sustainable Development"
 KUS_sustainable_development_desc:0 "Kusnurk's ruin began with efficiency pursued too narrowly: entire towns produced one component for customers who vanished with the Imperium. Reconstruction will favor adaptable factories, local supply chains and goods the Confederation itself can consume. Growth that survives only while a foreign empire is buying is merely dependence with better statistics."
 KUS_sustainable_development_tt:0 "Unlocks the §Y$KUS_sustainable_construction_1$§! decision in §YEconomic Policy§! to build a §YCivilian Factory§!, repeatable up to §Y7§! times."
 KUS_military_contracts:0 "Military Contracts"
 KUS_military_contracts_desc:0 "Transparent defense contracts can revive idle workshops without handing the treasury to profiteers. Every truck and shell ordered at home also reduces the humiliating dependence on allies to guard Kusnurk's own coastline."
 KUS_careful_investments:0 "Careful Investments"
 KUS_careful_investments_desc:0 "The Confederation cannot afford another round of grand plans drawn on Imperial demand forecasts. A reconstruction board will inspect projects for local suppliers, realistic buyers and usefulness to more than one province. Kusnurk will recover more slowly than speculators promise, but its factories will still be standing when the next crisis closes the Channel."
 KUS_retool_military_industry:0 "Retool Military Industry"
 KUS_retool_military_industry_desc:0 "Kusnurk inherited production lines for obscure Imperial components but too few lines for rifles, vehicles or naval missiles. Engineers will strip out obsolete tooling and adapt what remains for standardized military work. The process wastes equipment and angers old managers, yet a democratic state that cannot arm itself survives only by permission."
 KUS_found_elrong:0 "Found Elrong"
 KUS_found_elrong_desc:0 "The railway shops, locomotive depots and support-equipment workshops around Jarvalin already share workers, suppliers and complaints. Elrong will unite them under one Estalai concern capable of repairing the Confederation's railways and supplying its army. Its first locomotives will carry reconstruction material; later ones may carry the forces that keep those lines free."
 KUS_rapid_recovery:0 "Rapid Recovery"
 KUS_rapid_recovery_desc:0 "Factories can be reopened before every ownership dispute, safety inspection and provincial argument is settled. Jarvalin will guarantee wages, purchase unsold stock and force dormant plants back into operation under emergency authority. The policy is expensive and inelegant, but unemployment is feeding extremists faster than parliament can debate accounting standards."
 KUS_industrial_cornerstone:0 "Industrial Cornerstone"
 KUS_industrial_cornerstone_desc:0 "Kusnurk will rebuild from the bottom upward: machine tools before prestige weapons, dependable power before experimental plants, and civilian orders before another export boom. A broad industrial base will give each state a stake in the Confederation and ensure that future mobilization rests on real capacity rather than optimistic inventories."
 KUS_reconnect_navar:0 "Reconnect Navar"
 KUS_reconnect_navar_desc:0 "Navar is close enough to Jarvalin to appear integrated on a map and distant enough to feel every broken rail, ferry and telephone line. Restoring its links will reopen markets across the strait-crossing region and demonstrate that the Confederation is more than a capital surrounded by neglected states."
 KUS_bureau_of_state_industry:0 "Bureau of State Industry"
 KUS_found_nuclear_energy_org:0 "Found the Nuclear Energy Organization"
 KUS_found_nuclear_energy_org_desc:0 "Imported fuel reaches Kusnurk through waters that Nekaston has already tried to close. A national nuclear organization will bring reactor design, mineral surveys and safety regulation under one roof. The atom offers energy independence, but only if the Confederation treats it as public infrastructure rather than another Kaiser-era secret project."
 KUS_bureau_of_resource_extraction:0 "Bureau of Resource Extraction"
 KUS_permanent_integration:0 "Permanent Integration"
 KUS_permanent_integration_desc:0 "Temporary reconstruction boards have begun coordinating Navar, Jarvalin and the Channel ports more effectively than the old patchwork of Imperial offices. Their best arrangements will be made permanent, with provincial representation and common standards. Integration should make the states harder to isolate, not reduce them to districts administered from the capital."
 KUS_domestic_arms_industry:0 "Domestic Arms Industry"
 KUS_domestic_arms_industry_desc:0 "Foreign troops and defense pacts bought Kusnurk time, not sovereignty. The Confederation needs rifles whose ammunition is made in Kusnurk, vehicles repaired by Kusnurk mechanics and missiles that do not wait for another government's export license. Local production will be modest, but it will answer to the parliament that pays for it."
 KUS_recover_kaiser_era_machinery:0 "\"Recover\" Kaiser Era Machinery"
 KUS_recover_kaiser_era_machinery_desc:0 "Imperial depots still contain machine tools whose ownership records disappeared with the officials who abandoned them. Legalists call them disputed assets; workers call them the equipment from their own factories. After inspection for traps, proprietary locks and unsafe ultratech, the machinery will be quietly returned to production."
 KUS_expand_future_energy_institute:0 "Expand the Future Energy Institute"
 KUS_expand_future_energy_institute_desc:0 " The Future Energy Institute will apply patient curiosity to storage, reactor control and high-density power systems. Scientific independence begins by giving researchers laboratories worth returning home to."
 KUS_expand_vao_extraction:0 "Expand Väo Extraction Inc."
 KUS_expand_vao_extraction_desc:0 "Väo's surveyors know the hills and old Imperial pits better than any ministry clerk in Jarvalin. With new drills, processing plants and state-backed transport, the company can replace imported ores with Kusnurk minerals. Provincial shares will ensure that extraction enriches the communities above the deposits rather than another vanished imperial treasury."
 KUS_bail_out_divikatel:0 "Bail Out Divikatel"
 KUS_bail_out_divikatel_desc:0 "Divikatel prospered by supplying chemicals to an Imperial market that seemed permanent; its creditors now own more paper than the company can honor. Liquidation would scatter skilled chemists and close plants needed for fertilizer, polymers and explosives. A supervised bailout will preserve the useful enterprise while removing the managers who mistook empire for solvency."
 KUS_military_industrial_mediators:0 "Military-Industrial Mediators"
 KUS_military_industrial_mediators_desc:0 "Provincial arsenals, private firms and the KUA currently compete for the same steel, engineers and rail capacity. Permanent mediators will settle specifications before contracts are signed and prevent each service from building a private supply system. Kusnurk has too little industry to waste it on bureaucratic wars behind the front."
 KUS_support_private_enterprises:0 "Support Private Enterprises"
 KUS_support_private_enterprises_desc:0 "Workshops and inventors will receive credit and military tenders, but no firm will become a state within the state. Enterprise is useful precisely because the Confederation remains able to say no."
 KUS_military_industrial_complex:0 "Military Industrial Complex"
 KUS_monazite_exploitation:0 "Monazite Exploitation"
 KUS_monazite_exploitation_desc:0 "The dark sands along Kusnurk's coasts contain monazite, long treated as an inconvenience by port builders and fishermen. Proper separation plants can yield rare earths for electronics and thorium-bearing material for the nuclear program. The Channel's beaches may prove as strategically valuable beneath the surface as the waters beside them."
 KUS_synthetic_polymers:0 "Synthetic Polymers"
 KUS_new_generation_reactors:0 "New Generation Reactors"
 KUS_new_generation_reactors_desc:0 "Recovered Kaiser machinery is powerful, temperamental and designed for a political system that hid failures. Kusnurk's next reactors will use modern controls, standardized parts and civilian oversight. They must power Jarvalin, Elrong and the extraction districts reliably; a reactor that impresses inspectors but frightens its operators is not progress."
 KUS_get_off_the_ground_tt:0 "Modify §Y$KUS_ruined_economy$§! by:\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+5%§!\n$MODIFIER_LINE_CHANGE_PRODUCTION_EFFICIENCY_FACTOR$: §R-10%§!"
 KUS_lay_a_foundation_tt:0 "Modify §Y$KUS_ruined_economy$§! by:\n$MODIFIER_CONSUMER_GOODS_FACTOR$: §G-5%§!"
 KUS_populate_ministry_of_economy_tt:0 "Modify §Y$KUS_ruined_economy$§! by:\n$MODIFIER_CONSUMER_GOODS_FACTOR$: §G-10%§!\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+5%§!\n$MODIFIER_INDUSTRIAL_CAPACITY_DOCKYARD_FACTOR$: §G+10%§!"
 KUS_seek_expert_economists_tt:0 "Modify §Y$KUS_ruined_economy$§! by:\n$MODIFIER_CONSUMER_GOODS_FACTOR$: §G-5%§!\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+5%§!\n$MODIFIER_INDUSTRIAL_CAPACITY_DOCKYARD_FACTOR$: §G+5%§!"
 KUS_careful_investments_tt:0 "Change §Y$KUS_ruined_economy$§! to §Y$KUS_recovering_economy$§!\nEffective change:\n$MODIFIER_LINE_CHANGE_PRODUCTION_EFFICIENCY_FACTOR$: §G+25%§!\n$MODIFIER_PRODUCTION_FACTORY_EFFICIENCY_GAIN_FACTOR$: §G+15%§!\n$MODIFIER_CONSUMER_GOODS_FACTOR$: §G-5%§!"
 KUS_retool_military_industry_tt:0 "Modify §Y$KUS_recovering_economy$§! by:\n$MODIFIER_LINE_CHANGE_PRODUCTION_EFFICIENCY_FACTOR$: §G+25%§!\n$MODIFIER_PRODUCTION_FACTORY_EFFICIENCY_GAIN_FACTOR$: §G+10%§!\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+5%§!\n$MODIFIER_INDUSTRIAL_CAPACITY_DOCKYARD_FACTOR$: §G+5%§!"
 KUS_bail_out_divikatel_tt:0 "Unlocks additional §YResource Prospecting§! decisions.\nUnlocks Industrial Concern §YDivikatel§!\nSynthetic Technology Research Speed: §G+10%§!\nIndustrial Technology Research Speed: §G+5%§!"
 KUS_monazite_exploitation_tt:0 "Unlocks additional §YResource Prospecting§! decisions."
 KUS_bureau_of_state_industry_desc:0 "A centralized bureau coordinates state industrial efforts, improving construction efficiency."
 KUS_military_industrial_complex_desc:0 "The integration of military and civilian industry under centralized coordination maximizes national productive output."
 KUS_bureau_of_resource_extraction_desc:0 "A dedicated bureau manages resource extraction operations across the confederation."
 KUS_synthetic_polymers_desc:0 "Development of synthetic polymer production has increased output from refineries."
 KUS_merevagi:0 "Merevagi"
 KUS_merevagi_desc:0 "The Kusnurk naval forces are undergoing a period of reform and modernization."
 KUS_ohuvagi:0 "Õhuvagi"
 KUS_ohuvagi_desc:0 "The Kusnurk air force is being rebuilt and reorganized."
 KUS_maavoim:0 "Maavõim"
 KUS_maavoim_desc:0 "The Kusnurk land forces are adapting to modern warfare doctrine."
 KUS_kua_reborn:0 "KUA Reborn"
 KUS_kua_reborn_desc:0 "The KUA still resembles the revolt that won independence: partisan columns, provincial commands and officers loyal to the state that raised them. Jarvalin will establish a common staff, service standards and national academies without erasing that hard-earned local experience. Kusnurk's armed forces will become confederal in composition and national in purpose."
 KUS_kua_reborn_tt:0 "Available as Chief of Army:\n§YJuha Laidoner§! - Army Offense (Expert)\n§YGustav Teras§! - Army Manoeuvre (Expert)"
 KUS_merevagi_focus:0 "Merevagi"
 KUS_merevagi_focus_desc:0 "Nekaston mocked Kusnurk for controlling two vital straits without a navy, and the accusation was painfully accurate. The Merevagi will be rebuilt from harbor craft, surviving Imperial hulls and newly trained crews. Foreign fleets may remain welcome in the Channel, but never again because Kusnurk is incapable of policing it."
 KUS_merevagi_tt:0 "Add National Spirit §YMerevagi§!\n$MODIFIER_XP_GAIN_NAVY_FACTOR$: §G+5%§!"
 KUS_plan_colossus:0 "Plan Colossus"
 KUS_plan_colossus_desc:0 "One school argues that the Channel can be secured only by ships too powerful to ignore. Plan Colossus proposes a compact battle fleet centered on heavily armed capital ships able to meet an intruder before foreign allies arrive. It is costly, but so is allowing every crisis to be decided by someone else's admiral."
 KUS_plan_colossus_tt:0 "Gain §YPlan Colossus§! Equipment Spirit:\nCapital Ship Production Cost: §G-10%§!"
 KUS_plan_nymph:0 "Plan Nymph"
 KUS_plan_nymph_desc:0 "The narrow approaches, broken coasts and dense merchant traffic favor hunters that remain unseen until the moment of attack. Plan Nymph will build submarines around hydrophones, patient crews and precise torpedoes rather than sheer tonnage. Kusnurk cannot outnumber the great fleets, but it can make entering its waters an intolerable gamble."
 KUS_plan_nymph_tt:0 "Modify §YMerevagi§! by:\n$MODIFIER_SPOTTING_CHANCE_FACTOR$: §G+10%§!"
 KUS_plan_harpie:0 "Plan Harpie"
 KUS_plan_harpie_desc:0 "Airfields cannot always cover both entrances to the Solakatzen Channel, especially when weather closes the coastal strips. Plan Harpie places aircraft at sea, carried by mobile decks that can reinforce whichever approach is threatened. The carrier will serve Kusnurk not as an oceanic trophy, but as a movable piece of national airspace."
 KUS_plan_harpie_tt:0 "Modify §YMerevagi§! by:\n$MODIFIER_NAVAL_CARRIER_AIR_ATTACK_FACTOR$: §G+10%§!\n$MODIFIER_NAVAL_CARRIER_AIR_AGILITY_FACTOR$: §G+10%§!"
 KUS_expand_naval_yards:0 "Expand the Naval Yards"
 KUS_expand_naval_yards_desc:0 "The existing yards were built to repair merchantmen and service Imperial ships, not to construct an independent fleet. New slips, crane lines and armor workshops will rise beside the Channel ports. Their employment will revive coastal towns, while their output ensures the Merevagi is more than a flag painted on borrowed hulls."
 KUS_expand_naval_yards_tt:0 "Gain §YExpand Naval Yards§! Equipment Spirit:\nCapital Ship Production Cost: §G-10%§!"
 KUS_modern_ship_design:0 "Modern Ship Design Commission"
 KUS_modern_ship_design_desc:0 "Imperial blueprints assume access to vanished materials, Katzen specialists and budgets that Kusnurk will never possess. A commission of naval officers, Elrong engineers and civilian shipbuilders will redesign the fleet around local steel and maintainable systems. Every class must fit Kusnurk's yards, waters and actual strategic problems."
 KUS_predictive_ship_positioning:0 "Predictive Ship Positioning"
 KUS_predictive_ship_positioning_desc:0 "Kusnurk's port authorities possess decades of tide tables, convoy schedules and Channel incident reports. Combined with radar, hydrophones and modern computation, those records can predict where an enemy will maneuver before visual contact. The Merevagi will fight the geometry of the straits, not merely the ship currently visible through the fog."
 KUS_post_kaiser_carrier:0 "Post-Kaiser Carrier Doctrine"
 KUS_post_kaiser_carrier_desc:0 "Kaiser-era carriers were floating demonstrations of abundance, protected by systems no successor state can reproduce. Kusnurk's doctrine will instead emphasize dispersed aviation, rapid deck cycles and escorts that can be repaired locally. The carrier must survive without a Kaiser watching over it and remain useful even when half its machinery is unavailable."
 KUS_squadron_flagships:0 "Squadron Flagships"
 KUS_squadron_flagships_desc:0 "A handful of enormous ships would leave every lesser task uncovered. Heavy cruisers will instead command independent squadrons, carrying the sensors, staff and firepower needed to coordinate destroyers across the Channel. Each flagship becomes a small admiralty at sea, allowing the fleet to divide without dissolving into uncoordinated patrols."
 KUS_squadron_flagships_tt:0 "Gain §YSquadron Flagships§! Equipment Spirit:\nHeavy Cruiser Attack: §G+5%§!\nHeavy Cruiser Production Cost: §G-10%§!"
 KUS_pythagoras_class:0 "Pythagoras Class"
 KUS_pythagoras_class_desc:0 "The Pythagoras class reduces naval design to a disciplined balance of range, armor, firepower and yard capacity. Its clean internal layout is intended for Estalai crews and Kusnurk maintenance practices rather than inherited Katzen assumptions. It will be the first capital ship designed from keel upward for the Confederation that builds it."
 KUS_train_admirality:0 "Train the Admirality"
 KUS_train_admirality_desc:0 "Karl Erijk and Markus Mori inherited officers trained for harbor administration, convoy escort and obedience to Imperial superiors. The new admirality course will force them to command fleets, manage aviation and make decisions without outside instructions. Kusnurk needs admirals who understand trade, but who can still close the Channel when trade becomes a weapon."
 KUS_train_admirality_tt:0 "§YKarl Erijk§! gains §YBattleship Adherent§!\n§G+1§! Skill Level, §G+1§! Attack Level\n§YMarkus Mori§!\n§G+1§! Skill Level, §G+1§! Attack Level"
 KUS_deep_sea_monsters:0 "Deep Sea Monsters"
 KUS_deep_sea_monsters_desc:0 "Beyond the shallow patrol zones lie trenches and cold currents rarely charted by the old occupation fleet. Large long-range submarines can hide there, emerging against warships that believe Kusnurk's navy confined to the straits. Their crews call them monsters because enemies should encounter them first as an impossible contact on a sonar screen."
 KUS_deep_sea_monsters_tt:0 "Modify §YMerevagi§! by:\n$MODIFIER_NAVAL_SPEED_FACTOR$: §G+10%§!\n$MODIFIER_NAVAL_HIT_CHANCE$: §G+5%§!"
 KUS_fleet_colossus:0 "Fleet Colossus"
 KUS_fleet_colossus_desc:0 "The navy has been rebuilt around powerful capital ships that dominate the seas."
 KUS_fleet_colossus_tt:0 "Modify §YMerevagi§! by:\n$MODIFIER_NAVY_CAPITAL_SHIP_ATTACK_FACTOR$: §G+5%§!"
 KUS_high_tech_raiding:0 "High Tech Raiding"
 KUS_high_tech_raiding_desc:0 "Kusnurk depends on commerce and cannot glorify indiscriminate piracy. Its raiders will therefore hunt military logistics with passive sensors, long-range missiles and carefully prepared escape routes, leaving neutral shipping untouched. The aim is not to starve the world, but to make any invasion force discover that its supply line crosses Estalai waters."
 KUS_carrier_research_left:0 "Carrier Research Commission"
 KUS_carrier_research_left_desc:0 "The submarine fleet still needs eyes beyond the horizon and protection when it surfaces. Compact carriers and converted aviation ships can scout for Nymph groups, relay targeting data and recover patrol aircraft without consuming the resources of a grand battle fleet. Kusnurk's carrier science will begin with utility rather than spectacle."
 KUS_carrier_research_left_tt:0 "Modify §YMerevagi§! by:\n$MODIFIER_CARRIER_TRAFFIC$: §G+5%§!"
 KUS_warden_torpedo:0 "Warden Torpedo"
 KUS_warden_torpedo_desc:0 "The Warden torpedo is designed for the precise defensive war Kusnurk expects to fight. Active guidance, programmable approach patterns and a heavy warhead allow one submarine to threaten ships far larger than itself. Its name is deliberate: it guards the straits, and it pursues those who enter after being warned away."
 KUS_warden_torpedo_tt:0 "Modify §YMerevagi§! by:\n$MODIFIER_NAVAL_CRITICAL_SCORE_CHANCE_FACTOR$: §G+5%§!\n$MODIFIER_NAVY_SUBMARINE_ATTACK_FACTOR$: §G+5%§!"
 KUS_unrestricted_sub_warfare:0 "Unrestricted Submarine Warfare"
 KUS_unrestricted_sub_warfare_desc:0 "A nation built on open trade should not adopt unrestricted submarine warfare lightly. Yet an enemy using merchant hulls to carry troops and ammunition through the Channel cannot hide behind peacetime markings forever. In a declared war zone, the Nymph fleet will treat every vessel sustaining the invasion as part of the invasion."
 KUS_fleet_nymph:0 "Fleet Nymph"
 KUS_fleet_nymph_desc:0 "The navy has embraced submarine warfare as its core doctrine, hunting and raiding across the seas."
 KUS_fleet_nymph_tt:0 "Gain §YFleet Nymph§! Equipment Spirit:\nSubmarine Production Cost: §G-15%§!\n§YKarl Erijk§! gains §YGreen Water Expert§!\n§YMarkus Mori§! gains §YGreen Water Expert§!"
 KUS_carrier_research_right:0 "Carrier Research Commission"
 KUS_carrier_research_right_desc:0 "A carrier operating between hostile coasts cannot rely on distance for protection. Research will focus on armored decks, redundant machinery and damage control suited to concentrated missile and air attack. Kusnurk's Harpies must remain flight-capable after the first strike, because there may be no second carrier available to replace them."
 KUS_carrier_research_right_tt:0 "Gain §YCarrier Research§! Equipment Spirit:\nCarrier Armor: §G+5%§!"
 KUS_establish_carrier_groups:0 "Establish Carrier Groups"
 KUS_establish_carrier_groups_desc:0 "Carriers, escorts and naval aircraft are currently trained by separate institutions that meet only during exercises. Permanent carrier groups will share communications, maintenance and command from the beginning. Erijk and Mori will learn to direct the sea and sky as one battlespace rather than negotiate cooperation while enemy bombers are already overhead."
 KUS_fleet_mobility:0 "Fleet Mobility"
 KUS_fleet_mobility_desc:0 "Kusnurk guards two entrances separated by a maze of coasts, islands and crowded shipping lanes. A fleet concentrated in the wrong harbor is no fleet at all. Standardized refueling, forward repair ships and rehearsed transit routes will let the Merevagi shift its weight across the Channel before an opponent can exploit the gap."
 KUS_fleet_mobility_tt:0 "Modify §YMerevagi§! by:\n$MODIFIER_NAVAL_SPEED_FACTOR$: §G+10%§!"
 KUS_fleet_harpie:0 "Fleet Harpie"
 KUS_fleet_harpie_desc:0 "The navy has become a carrier-centric force, projecting air power across the oceans."
 KUS_fleet_harpie_tt:0 "§YKarl Erijk§! gains §YTorpedo Bomber§!\n§YMarkus Mori§! gains §YFighter Director§!"
 KUS_ohuvagi_focus:0 "Õhuvagi"
 KUS_ohuvagi_focus_desc:0 "The Õhuvagi began as provincial squadrons, surviving Imperial aircraft and pilots who learned to improvise during the revolt. It now has to defend a capital, two straits and scattered states with limited numbers. A unified air staff will turn those fragments into a force that can choose where Kusnurk's few aircraft matter most."
 KUS_expand_tarva_air:0 "Expand Tarva Air Academy"
 KUS_expand_tarva_air_desc:0 "Tarva's instructors already teach pilots to read coastal weather, fly over water and land on improvised strips. Expanding the academy will add night navigation, instrument flying and confederal doctrine. Kusnurk cannot wait for clear skies before defending itself; the Channel's fog and storms must become conditions its pilots understand better than any invader."
 KUS_expand_tarva_air_tt:0 "Modify §YÕhuvagi§! by:\n$MODIFIER_AIR_ACE_GENERATION_CHANCE_FACTOR$: §G+5%§!\n$MODIFIER_AIR_NIGHT_PENALTY$: §G-10%§!\n$MODIFIER_AIR_WEATHER_PENALTY$: §G-10%§!\n$MODIFIER_AIR_DOCTRINE_COST_FACTOR$: §G-10%§!"
 KUS_baltair:0 "Baltair Military Investments"
 KUS_baltair_desc:0 "Baltair's workshops kept obsolete Imperial aircraft flying by manufacturing parts that no longer had suppliers. Military investment will turn that improvisation into a proper design and production bureau. The company will remain answerable to public contracts, but its mechanics deserve more than praise and scavenged components for keeping the Õhuvagi airborne."
 KUS_naval_air_development:0 "Naval Air Development"
 KUS_naval_air_development_desc:0 "Every Kusnurk crisis begins over water, whether with a blockade, an unidentified fleet or troops approaching the straits. Naval bombers, maritime patrol aircraft and shipborne observers will give the Confederation warning and striking power before an enemy reaches the coast. The navy's diminished state makes aviation not optional, but immediate."
 KUS_aerial_tech_development:0 "Aerial Technological Development"
 KUS_aerial_tech_development_desc:0 "Universities, Baltair and the Tarva academy will share test data instead of guarding it as institutional property. Intelligence was always an Estalai advantage; the Õhuvagi will make it material."
 KUS_supermanoevers:0 "Supermanoevers"
 KUS_supermanoevers_desc:0 "Kusnurk pilots cannot assume numerical superiority, so they must create brief advantages through energy, angle and timing. Advanced control surfaces and demanding training will make extreme maneuvers repeatable rather than theatrical. A fox who survives by being clever should not build an air force that wins only by arriving with more aircraft."
 KUS_supermanoevers_tt:0 "Modify §YÕhuvagi§! by:\n$MODIFIER_AIR_MISSION_EFFICIENCY$: §G+5%§!\n$MODIFIER_AIR_TRAINING_XP_GAIN_FACTOR$: §G+10%§!"
 KUS_naval_air_coordination:0 "Naval Air Coordination"
 KUS_naval_air_coordination_desc:0 "Coastal artillery, Merevagi patrols and Õhuvagi squadrons currently report contacts through different chains using different maps. Joint control rooms will fuse radar, naval sightings and air patrols into a single picture of the Channel. Targets will no longer escape because three services each believed another one was already engaging them."
 KUS_standardization:0 "Standardization"
 KUS_standardization_desc:0 "Kusnurk's airfields contain too many aircraft types inherited, purchased or improvised from Imperial wreckage. Standard engines, radios and weapon fittings will lower costs and allow provincial depots to support any squadron. Some performance will be sacrificed, but a brilliant aircraft grounded for want of one unique part contributes nothing to national defense."
 KUS_standardization_tt:0 "Gain §YStandardization§! Equipment Spirit:\nAir Equipment Production Cost: §G-5%§!"
 KUS_specialization:0 "Specialization"
 KUS_specialization_desc:0 "A small air force cannot dominate every mission, but it can produce a few machines exceptionally suited to Kusnurk's needs. Dedicated interceptors, maritime strike aircraft and high-altitude bombers will receive bespoke equipment even at greater cost. Each design will be built for a particular threat rather than for an accountant's elegant common parts list."
 KUS_specialization_tt:0 "Gain §YSpecialization§! Equipment Spirit:\nAir Equipment Production Cost: §R+5%§!"
 KUS_advanced_bombers:0 "Advanced Bombers"
 KUS_advanced_bombers_desc:0 "Kusnurk's enemies may assemble beyond the immediate coast, believing the Confederation can only defend the waterline. Long-range bombers will strike staging ports, bridges and depots before those forces reach the Solakatzen Channel. Their value lies less in destroying cities than in making invasion preparations impossible to conceal or safely concentrate."
 KUS_advanced_bombers_tt:0 "Modify §YÕhuvagi§! by:\n$MODIFIER_AIR_RANGE_FACTOR$: §G+10%§!\nStrategic Bombing Visibility: §G-10%§!"
 KUS_maximize_performance:0 "Maximize Performance"
 KUS_maximize_performance_desc:0 "Baltair's engineers are ordered to remove every unnecessary kilogram and recover every unit of thrust from Kusnurk's combat aircraft. Better engines, refined aerodynamics and stricter maintenance will produce speed and agility without relying on unavailable Kaiser ultratech. Performance will come from disciplined engineering, not a miracle component nobody can replace."
 KUS_maximize_performance_tt:0 "Modify §YÕhuvagi§! by:\n$MODIFIER_AIR_AGILITY_FACTOR$: §G+5%§!\nAirplane Speed: §G+5%§!"
 KUS_multirole_aircraft:0 "Multirole Aircraft Design"
 KUS_multirole_aircraft_desc:0 "Provincial airfields cannot maintain separate fleets for interception, ground support and maritime patrol. A modular multirole design will change weapons and sensors between missions while preserving familiar controls for pilots. It will never outperform every specialist, but it will ensure Kusnurk has the right kind of aircraft where a crisis actually occurs."
 KUS_ghosts_of_flusion:0 "Ghosts of Flusion"
 KUS_ghosts_of_flusion_desc:0 "The finished Õhuvagi will fight as contacts that appear late on hostile radar, strike from cloud and darkness, then vanish across familiar coastlines. Tarva training, Baltair engineering and integrated Channel surveillance will combine into an air-defense system outsiders struggle even to map. Sailors will know the Ghosts chiefly by the enemies that fail to arrive."
 KUS_ghosts_of_flusion_tt:0 "Modify §YÕhuvagi§! by:\n$MODIFIER_AIR_SUPERIORITY_EFFICIENCY$: §G+5%§!\n$MODIFIER_INTERCEPTION_ATTACK_FACTOR$: §G+5%§!\n$MODIFIER_AIR_SUPERIORITY_BONUS_IN_COMBAT$: §G+10%§!"
 KUS_maavoim_focus:0 "Maavõim"
 KUS_maavoim_focus_desc:0 "The Maavõim is made from liberation columns, provincial militias and a small professional core stretched across vulnerable borders. Its reform will preserve the initiative of the revolt while giving every unit common communications, logistics and doctrine. Kusnurk's army must defend the states without becoming another occupying force headquartered in Jarvalin."
 KUS_flexible_support:0 "Flexible Support"
 KUS_flexible_support_desc:0 "Kusnurk's terrain changes quickly from ports and towns to wet hills, broken roads and narrow approaches. Reconnaissance, engineers, drones and mobile fire support will be organized so commanders can attach what each sector requires. A fixed divisional recipe designed elsewhere cannot answer every battlefield found within the Confederation."
 KUS_flexible_support_tt:0 "Modify §YMaavõim§! by:\n$MODIFIER_ARMY_ORG_REGAIN$: §G+10%§!\n$MODIFIER_RECON_FACTOR$: §G+10%§!"
 KUS_doctrinal_adaptation:0 "Doctrinal Adaptation"
 KUS_doctrinal_adaptation_desc:0 "Imperial manuals describe armies supported by resources, air cover and command systems Kusnurk no longer possesses. The KUA will study the revolt, foreign contingents and recent border incidents to write doctrine for its actual forces. Adaptation is not inferiority; it is refusing to lose because an old book assumed a Kaiser would solve the problem."
 KUS_concentration_of_force:0 "Concentration of Force"
 KUS_concentration_of_force_desc:0 "Kusnurk cannot defend every kilometer with equal strength, but its geography funnels serious invasions toward bridges, ports and road corridors. Armored reserves will remain mobile until the enemy commits, then mass against the decisive approach. The states may hold the line locally; Jarvalin will provide the blow that prevents a breakthrough from becoming occupation."
 KUS_concentration_of_force_tt:0 "Modify §YMaavõim§! by:\nIFV, MBT Unit Design Cost: §G-80%§!"
 KUS_integrated_communications:0 "Integrated Communications"
 KUS_integrated_communications_desc:0 "Provincial radios, civilian telephone exchanges and surviving Imperial networks use incompatible standards and are vulnerable to sabotage. A secure national system will link field commands, air controllers and coastal batteries from Jarvalin to Northern Akiba. Reinforcements should move because a commander requested them, not because rumors finally reached the next state."
 KUS_integrated_communications_tt:0 "Modify §YMaavõim§! by:\n$MODIFIER_LAND_REINFORCE_RATE$: §G+1%§!\n$MODIFIER_ARMY_BONUS_AIR_SUPERIORITY_FACTOR$: §G+5%§!"
 KUS_maximum_firepower:0 "Maximum Firepower"
 KUS_maximum_firepower_desc:0 "When Nekaston threatened the Channel, Kusnurk's answer was blunt: coastal artillery could enforce what its navy could not. That logic will be expanded into a doctrine of dense, precisely coordinated fire. Guns, rockets and air strikes will make every approach costly enough that the enemy's numerical superiority becomes a traffic jam under bombardment."
 KUS_maximum_firepower_tt:0 "Modify §YMaavõim§! by:\n$MODIFIERS_ARMY_ATTACK_FACTOR$: §G+10%§!"
 KUS_armored_research_left:0 "Armored Research Grants"
 KUS_armored_research_left_desc:0 "The firepower school wants armored vehicles that can carry heavier guns into the narrow battle zones where towed artillery is too slow. Research grants will favor stable platforms, advanced sights and protected ammunition storage. Kusnurk's armor will serve as mobile siege equipment for breaking a concentrated enemy before it can spread through the states."
 KUS_armored_research_right:0 "Armored Research Grants"
 KUS_armored_research_right_desc:0 "The maneuver school values vehicles that can cross poor roads, change sectors quickly and remain repairable in provincial workshops. Grants will fund reliable engines, lighter composites and modular drivetrains. Kusnurk does not need parade tanks; it needs armored formations able to appear on whichever frontier an enemy assumed was weak."
 KUS_mobile_coordinators:0 "Mobile Coordinators"
 KUS_mobile_coordinators_desc:0 "Fast units become useless when every battalion races on a different map and fuel schedule. Mobile command vehicles will travel with the armored spearheads, maintaining links to artillery, aviation and rear depots while the front moves. The coordinator's task is to keep speed from turning into isolation beyond the range of headquarters."
 KUS_mobile_coordinators_tt:0 "Modify §YMaavõim§! by:\n$MODIFIER_LAND_REINFORCE_RATE$: §G+1%§!\n$MODIFIER_ARMY_ORG_FACTOR$: §G+10%§!"
 KUS_speed_cult:0 "Speed Cult"
 KUS_speed_cult_desc:0 "The revolt taught a generation of officers that arriving first could compensate for lacking everything else. Their enthusiasm has become the army's so-called speed cult: lighter columns, aggressive route planning and an almost personal hatred of stationary reserves. Properly disciplined, that instinct can let Kusnurk shift an entire battle before the enemy understands it has begun."
 KUS_speed_cult_tt:0 "Modify §YMaavõim§! by:\n$MODIFIER_ARMY_SPEED_FACTOR$: §G+10%§!"
 KUS_rearline_guard:0 "Rearline Guard Units"
 KUS_rearline_guard_desc:0 "Nekastonian organizers have already shown how quickly agitation and infiltration can turn a frontier dispute into armed crisis. Rearline guard units will protect depots, bridges, airfields and communications without stripping combat divisions from the front. Their mission is security under law, not giving every provincial commander a private political police."
 KUS_rearline_guard_tt:0 "Modify §YMaavõim§! by:\n$MODIFIER_ARMY_ORG_FACTOR$: §G+5%§!\n$MODIFIERS_ARMY_DEFENCE_FACTOR$: §G+5%§!"
 KUS_halberd_at:0 "Halberd AT Missile"
 KUS_halberd_at_desc:0 "Kusnurk infantry may face Imperial armor far heavier than anything the Confederation can field in equal numbers. The Halberd missile gives small teams a guided weapon able to pierce those machines from concealed positions. Like its namesake, it extends the reach of the foot soldier against an armored opponent that expects to overrun him."
 KUS_halberd_at_tt:0 "Gain §YHalberd AT§! Equipment Spirit:\nInfantry Hard Attack: §G+10%§!\nInfantry Piercing: §G+50%§!"
 KUS_machiavellian_high_command:0 "Machiavellian High Command"
 KUS_machiavellian_high_command_desc:0 "Kusnurk survives between powers larger than itself, and straightforward plans are often invitations to be outmatched. The high command will institutionalize deception, false deployments and contingency planning, treating diplomacy and logistics as parts of the battlefield. Geemetra may be pacifistic, but his generals are not required to be predictable when peace fails."
 KUS_centralized_command:0 "Centralized Command"
 KUS_centralized_command_desc:0 "Provincial autonomy cannot mean twelve separate wars fought under one flag. Operational planning, reserves and strategic intelligence will be centralized in Jarvalin while local commanders retain tactical freedom. The arrangement mirrors the Confederation itself: authority gathered where coordination is essential, independence preserved where knowledge of the ground matters more."
 KUS_centralized_command_tt:0 "Modify §YMaavõim§! by:\n$MODIFIER_PLANNING_SPEED$: §G+10%§!\n$MODIFIER_MAX_PLANNING_FACTOR$: §G+5%§!"
 KUS_project_boom:0 "Project Boom"
 KUS_project_boom_desc:0 "Kusnurk's artillery officers have reached rare agreement on one point: the next self-propelled gun should be enormous. Engineers now dispute whether Project Boom should devote its weight to a larger weapon or thicker armor. Either answer will produce a vehicle built for the Confederation's preferred argument-ending a battle before the enemy can widen it."
 KUS_off_road_logistics:0 "Off-Road Logistics"
 KUS_off_road_logistics_desc:0 "Maps inherited from the Imperium exaggerate roads that become mud after a week of Channel rain and omit tracks known to every rural driver. All-terrain trucks, modular loads and provincial route surveys will let supplies bypass damaged railways and obvious bridges. An army defending Kusnurk must be able to live where invaders cannot conveniently follow."
 KUS_industrial_saturation:0 "Industrial Saturation"
 KUS_industrial_saturation_desc:0 "Precision weapons are valuable, but Kusnurk's defensive plans still require an ocean of shells and rockets. Standardized artillery components and long production runs will fill dispersed depots across the states. The goal is not wasteful bombardment; it is ensuring no commander abandons a vital approach because Jarvalin's factories delivered too little ammunition too late."
 KUS_industrial_saturation_tt:0 "Gain §YIndustrial Saturation§! Equipment Spirit:\nArtillery Production Cost: §G-10%§!\nRocket Artillery Production Cost: §G-10%§!"
 KUS_perfect_training_left:0 "Perfect Training Methodology"
 KUS_perfect_training_left_desc:0 "The firepower branch will train crews to calculate, communicate and shoot as one system. Artillerymen, observers and armored units will rehearse the same target procedures until concentrated fire can be assembled in minutes. Perfect training does not mean spotless parade drill; it means every soldier knowing exactly how his report becomes destruction at the correct coordinates."
 KUS_perfect_training_right:0 "Perfect Training Methodology"
 KUS_perfect_training_right_desc:0 "The maneuver branch will train units through long field problems across Kusnurk rather than predictable exercises near barracks. Officers must reroute convoys, repair vehicles and coordinate mixed columns while tired and disconnected from Jarvalin. A force built around speed must remain organized after the plan meets the first washed-out bridge."
 KUS_officer_initiative:0 "Officer Initiative"
 KUS_officer_initiative_desc:0 "The liberation columns succeeded because junior officers acted while distant authorities were still learning what had happened. The reformed army will preserve that habit through mission orders and demanding staff education. Initiative will be rewarded when it serves the common plan, not when an ambitious colonel mistakes his provincial command for an independent country."
 KUS_officer_initiative_tt:0 "All currently hired generals:\n§G+1§! Attack, §G+1§! Planning\nAll new generals start with §G+1§! Attack"
 KUS_full_mechanization:0 "Full Mechanization"
 KUS_full_mechanization_desc:0 "Foot marches cannot reinforce both sides of the Solakatzen Channel quickly enough. Trucks, armored carriers and standardized maintenance teams will give the Maavõim the mobility its geography demands. Mechanization is expensive for a recovering economy, but so is building an army that arrives after a frontier state has already been isolated."
 KUS_full_mechanization_tt:0 "Gain §YFull Mechanization§! Equipment Spirit:\nMechanized Equipment Cost: §G-10%§!\nMotorized Equipment Cost: §G-5%§!"
 KUS_logistical_considerations:0 "Logistical Considerations"
 KUS_logistical_considerations_desc:0 "Every operational plan will now begin with fuel, bridge capacity, spare parts and the condition of provincial roads rather than adding them after the arrows are drawn. Kusnurk's position encourages grand strategic imagination, but its survival will depend on ordinary convoys crossing the Confederation on time and without borrowing an ally's transport fleet."
 KUS_strike_supernova:0 "Strike Like a Supernova"
 KUS_strike_supernova_desc:0 "The firepower doctrine culminates in a sudden concentration of armor, artillery and air support so violent that the enemy's chosen front ceases to function. Kusnurk will not sustain endless attritional offensives; it will gather strength patiently, strike like a supernova at the decisive point and exploit the brief collapse before larger powers can recover."
 KUS_strike_supernova_tt:0 "Modify §YMaavõim§! by:\n$MODIFIERS_ARMY_ATTACK_FACTOR$: §G+5%§!\n$MODIFIER_ORG_LOSS_WHEN_MOVING$: §G-25%§!\n$MODIFIER_BREAKTHROUGH$: §G+10%§!"
 KUS_erioperatsioonide:0 "Erioperatsioonide Grupp"
 KUS_erioperatsioonide_desc:0 "Border infiltrators, hostile organizers and threats to the Channel do not always present a conventional front. The Erioperatsioonide Grupp will combine reconnaissance, counter-sabotage and precise raids under national command. Its members are not a secret army above the law, but a tool for crises in which sending a division would be both clumsy and provocative."
 KUS_speed_of_light:0 "At the Speed of Light"
 KUS_speed_of_light_desc:0 "The maneuver doctrine reaches its final form in an army that treats distance inside Kusnurk as a problem already solved. Mechanized units, mobile headquarters and preplanned supply routes will transfer between fronts at extraordinary speed. An aggressor may still find a weak border, but it will not remain weak long enough to exploit."
 KUS_speed_of_light_tt:0 "Modify §YMaavõim§! by:\n$MODIFIER_ARMY_SPEED_FACTOR$: §G+10%§!\n$MODIFIER_BREAKTHROUGH$: §G+5%§!"
 KUS_finalize_navy:0 "Finalize Navy Reform"
 KUS_finalize_navy_desc:0 "The Merevagi has progressed from a diminished collection of harbor craft into a fleet with its own doctrine, yards and trained command. Final standardization will settle competing experiments and assign every squadron a wartime role. Kusnurk will still welcome allied ships, but they will enter a Channel guarded by its sovereign navy."
 KUS_finalize_airforce:0 "Finalize Airforce Reform"
 KUS_finalize_airforce_desc:0 "Tarva's pilots, Baltair's engineers and the joint Channel control rooms now operate as parts of one Õhuvagi. The reform's final orders will standardize readiness, reserve crews and wartime basing across the states. Kusnurk's aircraft will no longer be scattered survivors of the Imperium, but an air force designed around the Confederation."
 KUS_finalize_army:0 "Finalize Army Reform"
 KUS_finalize_army_desc:0 "The old liberation columns have become the Maavõim: nationally supplied, professionally trained and still rooted in the states that raised them. Jarvalin will confirm the new command structure and mobilization plans while preserving lawful provincial forces. The army that defended independence by improvisation will now defend it by preparation."
 KUS_taskforce_y:0 "Taskforce Y"
 KUS_taskforce_y_desc:0 "Kusnurk's civilian nuclear institutions have accumulated reactor physicists, monazite specialists and engineers who understand exactly how close peaceful research sits to weapons work. Taskforce Y will gather a carefully screened group behind compartmented laboratories. Geemetra's government will call it insurance, because deterrent is a harsher word for a pacifist state."
 KUS_naval_nuclear_platforms:0 "Naval Nuclear Platforms"
 KUS_naval_nuclear_platforms_desc:0 "The Channel gives Kusnurk access to two seas and enemies access to its coastline. Nuclear-powered submarines and mobile naval launch platforms can survive beyond the first strike, preserving retaliation when fixed bases are threatened. The Merevagi will carry the Confederation's deterrent quietly, far from crowds and harder for any occupier to seize."
 KUS_weapon_3234:0 "Weapon 3234"
 KUS_weapon_3234_desc:0 "The first viable warhead receives no heroic name, only the inventory number 3234. The bureaucracy is intentional: Kusnurk will not turn annihilation into folklore. Behind the dull designation lies a compact device built from domestic monazite products and years of reactor research, capable of making every power reconsider whether the Channel is worth conquering."
 KUS_mandate_nuclear_safehouses:0 "Mandate Personal Nuclear Safehouses"
 KUS_mandate_nuclear_safehouses_desc:0 "Kusnurk sits on a strategic crossing repeatedly threatened by fleets, partisans and larger states. Public shelters alone cannot protect scattered towns before warning time expires. New building codes will require reinforced household refuges, filtered air and emergency supplies, making civil defense part of ordinary architecture rather than a privilege near Jarvalin."
 KUS_kohla_silo_system:0 "Kohla Silo System"
 KUS_kohla_silo_system_desc:0 "Kohla's industrial ground, extraction works and transport links make it suitable for a dispersed silo network hidden among legitimate facilities. Hardened shafts and redundant command cables will prevent one attack from disarming the Confederation. The system is designed to be survivable, not visible; deterrence fails when an enemy can count every launcher from orbit."
 KUS_icbm_defense_array:0 "ICBM Defense Array"
 KUS_icbm_defense_array_desc:0 "Jarvalin cannot rely on retaliation alone while the government, high command and much of the national grid remain concentrated around it. Layered radar, interceptor missiles and hardened control sites will form an anti-ICBM array over the capital. The objective is not perfect safety, but denying an enemy confidence in a single decapitating strike."
 KUS_operation_darkest_hour:0 "Operation Darkest Hour"
 KUS_operation_darkest_hour_desc:0 "The ultimate nuclear deterrent has been established."
 KUS_a_loyal_friend:0 "A Loyal Friend"
 KUS_a_loyal_friend_desc:0 "The formation of the national cabinet is more important than ever. Luckily for the president, he has some of the most competent politicians and industry leaders at his pick. But he has only one obvious choice for the position of Prime Minister."
 KUS_expand_the_cabinet:0 "Expand the Cabinet"
 KUS_expand_the_cabinet_desc:0 "Our government needs more voices of reason. We must bring in new advisors to strengthen our democratic institutions."
 KUS_support_ministry_public_affairs:0 "Support Ministry of Public Affairs"
 KUS_support_ministry_public_affairs_desc:0 "The Ministry of Public Affairs needs funding and infrastructure to maintain public confidence in our government."
 KUS_food_security_act:0 "Food Security Act"
 KUS_food_security_act_desc:0 "Ensuring food security for all citizens is paramount. New agricultural initiatives will feed our people and stabilize the nation."
 KUS_reinforce_ministries:0 "Reinforce Ministries"
 KUS_reinforce_ministries_desc:0 "Strengthening our governmental institutions will provide the political capital and military expertise we need."
 KUS_anarchist_compromise:0 "The Anarchist Compromise"
 KUS_anarchist_compromise_desc:0 "Kusnurk was won by a revolt, not inherited from a palace, and the communes have not forgotten it. By recognizing their councils in the great cities and giving them room to govern themselves, Gemeetra can bring the revolution's most stubborn children inside the Confederation without asking them to surrender their ideals."
 KUS_expel_nekastonian_infiltrators:0 "Expel the Nekastonian Infiltrators"
 KUS_expel_nekastonian_infiltrators_desc:0 "Nekaston's agents arrived speaking of Estalai solidarity, yet wherever they settle, local disputes curiously sharpen into calls for revolution. The Confederation cannot heal while a foreign party treats Northern Akiba as its recruiting ground. Their organizers will be exposed, their networks broken, and the border made a line rather than an invitation."
 KUS_centralize_kusnurk_armed_forces:0 "Centralize the Kusnurk Armed Forces"
 KUS_centralize_kusnurk_armed_forces_desc:0 "The armies that liberated Kusnurk still resemble the uprising that created them: provincial commands, partisan veterans, and officers loyal first to their home state. Independence was won that way, but it cannot be defended that way forever. A single staff in Jarvalin will turn the old liberation columns into an army belonging to all Kusnurk."
 KUS_proclaim_new_kusnurk:0 "Proclaim the New Kusnurk"
 KUS_proclaim_new_kusnurk_desc:0 "Kusnurk began as an emergency compact between territories that had little in common beyond occupation and revolt. It now possesses institutions, an army, and young citizens determined never to know a master in Katown or Roqualia. Whether federation or confederation, the compromise struck in Jarvalin will declare that this once-impossible country intends to endure."
 KUS_proclaim_new_kusnurk_tt:0 "If $social_conservative$ support exceeds §Y50%§!, the nationalists will attempt to seize power.\n\nIf both Katzen tolerance focuses were completed, this instead begins the §YKatzenursk Civil War§!.\n\nBelow that threshold, §YSocial Conservative§! plurality leads to a §Yfederal settlement§!, while §YMarket Liberal§! plurality preserves the §Yconfederal structure§!."
 KUS_a_shield_for_the_states:0 "A Shield for the States"
 KUS_a_shield_for_the_states_desc:0 "The Confederation asks its states to trust Jarvalin without surrendering the means to protect themselves. That trust must be earned in concrete and steel. Fortified approaches, dispersed airfields, and a defensive plan built around the frontier states will make the federal government their shield, not their overseer."
 KUS_federal_mobilization:0 "Federal Mobilization"
 KUS_federal_mobilization_desc:0 "The border crisis has exposed the weakness of provincial governments preparing for the same war in a dozen different ways. Jarvalin will coordinate contracts, reserves, and factory conversions across the Confederation, allowing each state to contribute according to its means while ensuring that every rifle reaches the front where it is needed."
 KUS_devolved_governance:0 "Devolved Governance"
 KUS_support_independent_militaries:0 "Support Independent Militaries"
 KUS_support_independent_militaries_desc:0 "Local militias and defense forces need proper equipment and organization to defend our confederation."
 KUS_bolster_presidential_power:0 "Bolster Presidential Power"
 KUS_bolster_presidential_power_desc:0 "In these uncertain times, the President needs greater authority to unite the nation and make decisive moves."
 KUS_endorse_national_pride:0 "Endorse National Pride"
 KUS_roqualian_alliance:0 "Bolster Roqualian Ties"
 KUS_roqualian_alliance_desc:0 "Roqualia's sphere has become a formidable center of democratic science and industry. A year of close technical cooperation will give our researchers access to its computing methods and place Roqualian-backed workshops at our disposal, though accommodating so many foreign advisers will consume much of the government's attention."
 KUS_anti_katzen_diplomacy:0 "Anti-Kaiserist Diplomacy"
 KUS_anti_katzen_diplomacy_desc:0 "The danger to Kusnurk is not Katzen identity, but the Kaiserist states that would reduce every neighbor to a dependency. We will isolate their regimes abroad while hardening North Solkatzia against the day their threats become an invasion."
 KUS_integrating_the_frontier:0 "Assimilation Into the Confederation"
 KUS_integrating_the_frontier_desc:0 "The old regimes have fallen, but their frontiers remain politically distinct from Kusnurk. Confederal administrators will dismantle the institutions that sustained them, cultivate dependable local councils, and prepare each province for eventual admission into our common constitutional order."
 KUS_reforming_our_neighbors:0 "Reforming Our Neighbors"
 KUS_reforming_our_neighbors_desc:0 "A federation of free nations cannot credibly preach self-government while ruling its neighbors as conquered provinces. Chalsace, Mewraine, and Nekaston will be restored under supervised democratic governments, given a year to rebuild their institutions, and then welcomed into the Union as sovereign partners."
 KUS_reforming_our_neighbors_tt:0 "Release the §YConfederation of Chalsace-Mewraine§! in every owned core of §YFreistaat Roqualien§! and §YDominiontracks§!, and the §YSolakatzen Maritime Republic§! in every owned core of §YNekaston§!.\n\nBoth countries become our §YDominions§!, join the §YFlusiobalkan Union§!, and begin a year-long transition to democracy. Once both transitions are complete, they become §Yindependent§!."
 KUS_operation_nekastoni_freedom:0 "Operation: Nekastoni Freedom"
 KUS_operation_nekastoni_freedom_desc:0 "Nekaston's rulers have built their state upon fear, sealed frontiers, and the silencing of every rival political voice. Kusnurk will recognize the whole of Nekaston as a theater of liberation and carry representative government to its people by force if no peaceful course remains."
 KUS_operation_riesieger_down:0 "Operation: Riesieger Down"
 KUS_operation_riesieger_down_desc:0 "The war machine of Dominiontracks looms over the central Flusiobalkans, a monument to permanent mobilization and personal rule. We will claim the full extent of its heartland and bring Riesiger's armored dominion crashing down."
 KUS_operation_unified_freistaat:0 "Operation: Unified Freistaat"
 KUS_operation_unified_freistaat_desc:0 "Freistaat Roqualien's fractured authorities have made a frontier out of lands that should be governed together. By asserting claims across its historic territory, we can end the disorder and determine whether its people enter the Flusiobalkan project through integration or democratic reconstruction."
 KUS_appease_roqualian_titan:0 "Appease the Roqualian Titan"
 KUS_appease_roqualian_titan_desc:0 "With the Freistaat lands under our control, we can offer these territories to Roqualia as a gesture of goodwill. These are lands Roqualia has long desired."
 KUS_union_of_our_own:0 "Union of Our Own"
 KUS_union_of_our_own_desc:0 "The Flusiobalkans have spent generations as a corridor for foreign armies and a collection of markets too small to bargain on equal terms. Jarvalin will invite the region's democracies into a union capable of defending their independence, whether that union matures into a league of nations or a single confederation."
 KUS_secure_flusiobalkans_dominance:0 "Secure Flusiobalkans Dominance"
 KUS_secure_flusiobalkans_dominance_desc:0 "Those Flusiobalkan nations that refused to join our union, or remain hostile to our cause, must be brought to heel by force."
 KUS_joint_technology_board:0 "Joint Technology Board"
 KUS_joint_technology_board_desc:0 "A shared technology research initiative with our Roqualian and Flusiobalkan allies will accelerate our development."
 KUS_flusiobalkan_economic_region:0 "Flusiobalkan Economic Region"
 KUS_pan_flusiobalkan_bank:0 "Pan-Flusiobalkan Bank"
 KUS_pan_flusiobalkan_bank_desc:0 "Trade crosses our frontiers more easily than credit. A common clearing bank will reconcile currencies, underwrite regional projects, and give every member a practical reason to align its economy with the Union. The institution may serve equal partners, or become the treasury of a far tighter confederation."
 KUS_flusiobalkan_defence_army:0 "Flusiobalkan Defence Army"
 KUS_flusiobalkan_defence_army_desc:0 "Separate general staffs still prepare separate answers to the same threats. Common procurement standards, joint exercises, and a permanent Union command will let the Flusiobalkans fight as one front without deciding, for now, whether their armies ultimately belong to allied nations or one confederal state."
 KUS_a_working_language:0 "A Working Language"
 KUS_a_working_language_desc:0 "The Union now produces treaties, ledgers, drill manuals, and technical standards faster than translators can reconcile them. Katzen, Estalai, and Roqualian each offer a different political and practical vocabulary. Selecting one as the working language will not silence the others, but it will reveal what kind of institution the Union expects to become."
 KUS_flusiobalkans_look_outwards:0 "The Flusiobalkans Look Outwards"
 KUS_flusiobalkans_look_outwards_desc:0 "A federation secure only within its own borders will always remain at the mercy of crises decided elsewhere. A common volunteer command will let the Union defend sympathetic governments abroad without forcing every member into a general war."
 KUS_national_defence_protocols:0 "National Defence Protocols"
 KUS_national_defence_protocols_desc:0 "Every member retains its own army and territory, but an attack on one frontier threatens the entire federal project. Shared mobilization tables, prepared rail corridors, and interoperable headquarters will turn national defenses into a single resilient system."
 KUS_flusiobalkan_associates:0 "Flusiobalkan Associates"
 KUS_flusiobalkan_associates_desc:0 "Not every Solakean republic is prepared to enter the Union, and membership should not be the price of practical friendship. An associate framework will connect willing governments to our ports, markets, and defense network while preserving their formal independence."
 KUS_wrestle_the_solakean_strait:0 "Wrestle the Solakean Strait"
 KUS_wrestle_the_solakean_strait_desc:0 "The narrow passage between southern and central Solakea is too important to remain a bargaining chip in another power's hands. Its two shores should be entrusted to a restored Strait administration under Union protection, guaranteeing passage without granting Kusnurk direct ownership."
 KUS_safeguard_solakea_from_tyranny:0 "Safeguard Solakea From Tyranny"
 KUS_safeguard_solakea_from_tyranny_desc:0 "The Union cannot claim to defend representative government while supremacist regimes command armies elsewhere on Solakea. We will prepare to uproot those governments wherever they remain. If none survive, the continent's democracies may instead celebrate a victory already won."
 KUS_united_flusiobalkans:0 "United Flusiobalkans"
 KUS_united_flusiobalkans_desc:0 "Shared institutions have made the old borders increasingly ceremonial. The confederal project must now place its members beneath a common constitutional authority, while preserving enough local government that union is understood as accession rather than conquest."
 KUS_true_union:0 "A Grand Confederation"
 KUS_true_union_desc:0 "Dominion status was an apprenticeship in common government, not a permanent settlement. The Union will now assume full sovereignty over its constituent lands and stand before the world as one immense Flusiobalkan confederation, with one foreign policy and one future."
 KUS_subdue_jarvalin:0 "Subdue Jarvalin"
 KUS_subdue_jarvalin_desc:0 "The capital must be brought to order. The old democratic institutions have failed - it is time for rational governance."
 KUS_crush_rebel_groups:0 "Crush Rebel Groups"
 KUS_crush_rebel_groups_desc:0 "Remnants of the old order still resist. They must be neutralized for the new technocratic state to flourish."
 KUS_unite_aligned_political_groups:0 "Unite Aligned Political Groups"
 KUS_unite_aligned_political_groups_desc:0 "Those who share our vision of progress through technology must be united under one banner."
 KUS_form_technocratic_council:0 "Form Technocratic Council"
 KUS_form_technocratic_council_desc:0 "The Council of Technical Experts will replace the inefficient democratic parliament with rational, evidence-based governance."
 KUS_new_leap_program:0 "New Leap Program"
 KUS_new_leap_program_desc:0 "A massive industrialization initiative centered on Jarvalin will jumpstart our technological revolution."
 KUS_direct_scientific_development:0 "Direct Scientific Development"
 KUS_direct_scientific_development_desc:0 "State-directed research programs will accelerate our scientific progress beyond what free markets could achieve."
 KUS_end_to_starvation:0 "End to Starvation"
 KUS_end_to_starvation_desc:0 "Advanced hydroponics technology will eliminate hunger across the Confederation once and for all."
 KUS_agromaxx:0 "Agromaxx"
 KUS_encourage_technical_education:0 "Encourage Technical Education"
 KUS_encourage_technical_education_desc:0 "Mass technical education programs will create a new generation of engineers and scientists."
 KUS_economic_insulation:0 "Economic Insulation"
 KUS_economic_insulation_desc:0 "Our economy must be insulated from external shocks. Self-sufficiency through technology is the answer."
 KUS_second_leap:0 "Second Leap"
 KUS_second_leap_desc:0 "The second wave of industrialization targets Krrama and Tarva."
 KUS_high_tech_factories:0 "High-Tech Factories"
 KUS_high_tech_factories_desc:0 "Cutting-edge automated factories will revolutionize our industrial output."
 KUS_third_leap:0 "Third Leap"
 KUS_third_leap_desc:0 "The third wave expands across Kikol, Evla, and Kohla."
 KUS_the_landing:0 "The Landing"
 KUS_the_landing_desc:0 "Massive development of Northern Akiba and Solkatzen Isle marks our final territorial expansion of industry."
 KUS_cybernetics_program:0 "Cybernetics Program"
 KUS_cybernetics_program_desc:0 "Human augmentation through cybernetics will create a superior workforce and military."
 KUS_revive_moores_law:0 "Revive Moore's Law"
 KUS_revive_moores_law_desc:0 "Pushing past the limits of conventional computing, we shall reignite exponential technological progress."
 KUS_amat:0 "AMAT"
 KUS_amat_desc:0 "Advanced Military Applied Technologies - a new defense conglomerate pushing the boundaries of weapons research."
 KUS_project_babuloon:0 "Project Babuloon"
 KUS_project_babuloon_desc:0 "A revolutionary railway gun system that will give our artillery unprecedented destructive power."
 KUS_project_adaptiv:0 "Project Adaptiv"
 KUS_project_adaptiv_desc:0 "Next-generation reconnaissance equipment with adaptive camouflage and enhanced sensor packages."
 KUS_project_fooniks:0 "Project Fooniks"
 KUS_project_fooniks_desc:0 "The Phoenix program: AI-assisted pilots that reduce losses and manpower requirements for our air force."
 KUS_further_beyond:0 "Further Beyond"
 KUS_further_beyond_desc:0 "We stand at the threshold of something unprecedented. The Singularity beckons."
 KUS_construct_ai_infrastructure:0 "Construct AI Infrastructure"
 KUS_construct_ai_infrastructure_desc:0 "Massive computing infrastructure in Jarvalin will house the growing AI systems."
 KUS_prepare_defense_installations:0 "Prepare Defense Installations"
 KUS_prepare_defense_installations_desc:0 "The capital must be hardened against any who would interfere with the project."
 KUS_mass_cybernetics_program:0 "Mass Cybernetics Program"
 KUS_mass_cybernetics_program_desc:0 "Cybernetic enhancement for the masses - creating a population ready for the coming age."
 KUS_construct_computronium_factories:0 "Construct Computronium Factories"
 KUS_construct_computronium_factories_desc:0 "Factories dedicated to producing computing substrate - fuel for the superintelligence."
 KUS_supercomputer_facility:0 "Supercomputer Facility"
 KUS_supercomputer_facility_desc:0 "The central processing facility that will house the most powerful computer ever built."
 KUS_create_milnet:0 "Create MilNet"
 KUS_create_milnet_desc:0 "A military neural network connecting all our forces for perfect coordination."
 KUS_the_final_touches:0 "The Final Touches"
 KUS_the_final_touches_desc:0 "Everything is in place. The machine awakens."
 KUS_flusiobalkan_economic_region_tt:0 "Every member of the §YFlusiobalkan Union§! gains §Y$KUS_flusiobalkans_integration$§!:\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+5%§!\n$lok_ps_productivity_factor$: §G+5%§!"
 KUS_pan_flusiobalkan_bank_tt:0 "§GUnlocks§! decisions to §YIntegrate Flusiobalkan Economies§!."
 KUS_flusiobalkan_defence_army_tt:0 "§GUnlocks§! decisions to §YIntegrate Flusiobalkan Militaries§!."
 KUS_flusiobalkans_look_outwards_tt:0 "Modify §Y$KUS_flusiobalkans_integration$§! by:\n$MODIFIER_SEND_VOLUNTEER_SIZE$: §G+2§!\n$MODIFIER_SEND_VOLUNTEER_FACTOR$: §G+25%§!"
 KUS_national_defence_protocols_tt:0 "Modify §Y$KUS_flusiobalkans_integration$§! by:\n$MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$: §G+10%§!"
 KUS_wrestle_the_solakean_strait_tt:0 "Demand that the owners of the §YNorthern Solakean Strait§! and §YSouthern Solakean Strait§! transfer them to a restored §YStrait Republic§!, which will become our §YPuppet§!. A single demand is sent if both states have the same owner."
 KUS_agromaxx_desc:0 "Advanced agricultural technology has revolutionized our food production capabilities."
 KUS_flusiobalkan_economic_region_desc:0 "Tariffs, mismatched regulations, and unreliable freight timetables still divide allies who have pledged to defend one another. A common economic region will open the borders to investment and coordinate production without prejudging whether its members remain sovereign partners or become provinces of a greater whole."
 KUS_devolved_governance_desc:0 "Regional government has been devolved to the individual states, enhancing local administration but reducing centralized power."
 KUS_pressure_flusiobalkan_influence:0 "Leverage Flusiobalkan Influence"
 KUS_pressure_flusiobalkan_influence_desc:0 "With our faction established, we can leverage our combined strength to pressure non-aligned Flusiobalkan nations into joining us. Those who resist will learn the cost of defiance."
 KUS_guarantee_katzen_language_rights:0 "Guarantee Katzen Language Rights"
 KUS_guarantee_katzen_language_rights_desc:0 "Katzen was once the language of the occupier, but it is also the mother tongue of families who remained after the Imperium fled. Schools and courts in Solkatzen and the southern towns will be permitted to serve them in their own language. Kusnurk's freedom will mean little if it is maintained by repeating Katown's methods in reverse."
 KUS_push_for_estalai_primacy:0 "Push For Estalai Primacy"
 KUS_push_for_estalai_primacy_desc:0 "For decades, Estalai names vanished from maps, offices, and classrooms beneath layers of Katzen administration. Independence must be audible as well as visible. Estalai will become the common language of the state, giving the native majority a public life of its own again-even if the transition leaves some citizens feeling like strangers in the country they inhabit."
 KUS_embrace_roqualokatzen_heritage:0 "Embrace Roqualokatzen Heritage"
 KUS_embrace_roqualokatzen_heritage_desc:0 "Before Kattail's agents pulled Kusnurk into the Herzlands, Roqualian merchants, engineers, and settlers had already left their mark upon our ports and cities. Katzen rule followed, brutal but no less formative. We need not pretend that either influence made us less Estalai; Kusnurk is the place where all three histories met and became something none of them could claim alone."
 KUS_endorse_national_pride_desc:0 "Our flag was stitched in cellars, our anthem whispered in labor camps, and our republic dismissed abroad as a temporary inconvenience between greater powers. The time for embarrassed independence is over. Let every village remember the revolt, every veteran wear its colors, and every neighbor understand that Kusnurk survived because the Estalai refused to disappear."
 KUS_feline_tolerance_act:0 "Feline Tolerance Act"
 KUS_feline_tolerance_act_desc:0 "Not every Katzen in Kusnurk wore the occupier's uniform. Some hid Estalai fugitives, some sabotaged the retreat, and many were born here long after the first annexation. The law will distinguish citizenship from species and loyalty from ancestry. Those willing to defend the Confederation will be offered a place within it-and an opportunity to prove that promise under its flag."
 KUS_good_katzens_bad_katzens:0 "Good Katzens, Bad Katzens"
 KUS_good_katzens_bad_katzens_desc:0 "Collective guilt is a convenient answer to a painful history, but a useless foundation for a stable country. Kusnurk will judge Katzens by what they do now: collaborators and supremacists will face the law, while peaceful citizens will not answer for Kattail's crimes. It is a narrower clemency than some demand, and a wider one than others can stomach."
 KUS_crossroads_of_solakea_and_felinea:0 "Crossroads of Solakea and Felinea"
 KUS_crossroads_of_solakea_and_felinea_desc:0 "Kusnurk's supposed curse is also its inheritance. Roads from the Herzlands meet Solakean sea lanes in our markets; Estalai traders bargain in Katzen and Roqualian beneath the same warehouse roofs. By improving the inland depots and channel ports, we can turn a frontier fought over by empires into the hinge between two continents."
 KUS_protect_national_trade:0 "Protect National Trade"
 KUS_protect_national_trade_desc:0 "Foreign capital has rebuilt much of what the retreating Imperium stripped away, but dependence can become occupation by quieter means. Strategic warehouses, insurers, and transport firms must remain in Kusnurkite paws. Trade will stay open to both continents; control of the roads, contracts, and profits will not."
 KUS_autonomous_budgets:0 "Autonomous Rural Budgets"
 KUS_autonomous_budgets_desc:0 "Jarvalin's planners see numbers on a ledger; the rural councils know which bridge floods, which soil has gone thin, and which granary stands empty. Giving the outer states their own development budgets will let them rebuild farms and market towns on local knowledge, without waiting for a distant ministry to discover that the countryside exists."
 KUS_federal_development_funds:0 "Federal Urban Development Funds"
 KUS_federal_development_funds_desc:0 "The Confederation's cities absorbed refugees, veterans, and stripped machinery faster than streets or housing could follow. A common urban fund will rebuild Jarvalin and the industrial centers as parts of one national network, rather than rival capitals competing for the same exhausted treasury and workforce."
 KUS_encourage_roqual_diasporas:0 "Encourage Roqual Diasporas"
 KUS_encourage_roqual_diasporas_desc:0 "Roqualian workshops once connected Kusnurk to the most advanced industries in Solakea, and their departure left more than empty houses behind. Residence guarantees and technical grants can draw Roqualian machinists, scholars, and their families back to the channel. The arrangement will unsettle old suspicions, but dormant laboratories cannot teach anyone."
 KUS_grants_for_returning_estalai_exiles:0 "Grants for Returning Estalai Exiles"
 KUS_grants_for_returning_estalai_exiles_desc:0 "The occupation scattered Estalai families from Roqualia's factory belts to the ports of distant Solakea. Many return with engineering degrees, savings, and children who know Kusnurk only through stories. Land grants and research appointments will give that wandering generation a reason to bring its hard-won knowledge home."
 KUS_crown_new_government:0 "Crown the New Government"
 KUS_crown_new_government_tt:0 "Depending on what focuses were picked and how the nation turned out, we will have access to different Prime Ministers!"
 KUS_mandate_bilingualism:0 "Mandate Bilingualism"
 KUS_mandate_bilingualism_desc:0 "Katzen and Estalai citizens have spent too long addressing the same country through separate institutions. Courts, schools, barracks, and workshops must become genuinely bilingual, not as a courtesy to either people, but as the ordinary language of a common state."
 KUS_mandate_bilingualism_tt:0 "Unlocks §Ystate decisions§! to establish §YChalsacian bilingualism§! across our core territory."
 KUS_our_feline_brethren:0 "Our Feline Brethren"
 KUS_our_feline_brethren_desc:0 "The frontiers drawn after the Collapse divide Katzen communities that share language, families, and memory. The Freistaat and the Dominion will be invited to enter a confederation in which their local liberties survive beneath a single Katzenursk roof."
 KUS_our_feline_brethren_tt:0 "Sends peaceful merger proposals to the §YFreistaat§! and the §YDominion§!. Refusal will grant us a §Ywar goal§!. If either country is unavailable, we will claim its core territory from its present holder."
 KUS_renormalize_clipping:0 "Renormalize Clipping"
 KUS_renormalize_clipping_desc:0 "Clipped ears were once treated as evidence of shame, collaboration, or an Estalai desire to disappear. Katzenursk will end that stigma. No citizen should have to explain the shape they chose for their own body, nor the tangled identity that choice expresses."
 KUS_the_east_is_feline_too:0 "The East Is Feline Too"
 KUS_the_east_is_feline_too_desc:0 "Nekaston calls itself an Estalai revolution, yet its eastern communes stand upon the same feline frontier as our own. Its slogans cannot erase the Katzen families, shared roads, and strategic depth that bind the region to Katzenursk."
 KUS_we_can_learn_from_them:0 "We Can Learn From Them"
 KUS_we_can_learn_from_them_desc:0 "Nekaston's communes survived conditions that would have broken a conventional state. Their local initiative need not threaten Katzenursk. Properly reconciled with our confederal order, it may strengthen the liberties we already promised our cities."
 KUS_unification_of_solakean_felines:0 "Unification of Solakean Felines"
 KUS_unification_of_solakean_felines_desc:0 "Nekaston's ideology is an obstacle between populations that belong within one feline political space. The revolution will be dismantled, its territory reorganized, and its people introduced to a Katzenursk identity that does not require obedience to distant commissars."
 KUS_unification_of_solakean_felines_tt:0 "Unlocks §Ystate decisions§! to integrate and culture-convert Nekastonian territory. The process will take longer, but their states will be more productive."
 KUS_dig_into_their_stockpiles:0 "Dig Into Their Stockpiles"
 KUS_dig_into_their_stockpiles_desc:0 "The revolutionary arsenals contain weapons produced without restraint and stored without any serious plan for their use. Katzenursk engineers will catalogue what can be saved, move it west, and accept that the stripped facilities will need years to recover."
 KUS_their_arrays_will_serve_us:0 "Their Arrays Will Serve Us"
 KUS_their_arrays_will_serve_us_desc:0 "The great missile array was built as a monument to Nekastonian defiance. Under Katzenursk direction, its silos will become the center of a dispersed network stretching across the east, backed by crews who understand that deterrence requires more than revolutionary enthusiasm."
 KUS_prepare_to_tackle_the_true_threat:0 "Prepare to Tackle the True Threat"
 KUS_prepare_to_tackle_the_true_threat_desc:0 "Roqualia has always regarded the eastern Katzen states as temporary errors awaiting correction. With the feline frontier united, that assumption can finally be challenged. The public must understand that the next struggle concerns national survival, not another border adjustment."
 KUS_redoubt_in_the_freistaat:0 "Redoubt in the Freistaat"
 KUS_redoubt_in_the_freistaat_desc:0 "The Freistaat's approaches form the shield of Katzenursk. Surveyors will turn ridges, rail junctions, and lakeside towns into a connected defensive belt capable of absorbing the first Roqualian blow while reserves assemble behind it."
 KUS_levelling_the_playing_field:0 "Levelling the Playing Field"
 KUS_levelling_the_playing_field_desc:0 "Roqualia's scale cannot be matched factory for factory. It can be matched by compressing years of nuclear work into one exhausting national effort, accepting damaged civilian production today so that no enemy can count on impunity tomorrow."
 KUS_hold_back_the_invisible_death:0 "Hold Back the Invisible Death"
 KUS_hold_back_the_invisible_death_desc:0 "Radiation kills long after the flash and beyond the reach of ordinary fortifications. A national network of dosimetry stations, decontamination trains, protected clinics, and trained emergency crews will give exposed communities a chance to survive."
 KUS_ubiquitous_urban_safehouses:0 "Ubiquitous Urban Safehouses"
 KUS_ubiquitous_urban_safehouses_desc:0 "No interceptor net can promise a perfect defense. Every city will therefore map deep shelters, reinforce cellars, stock emergency exits, and train wardens who can move civilians below ground before the warning sirens stop."
 KUS_a_sea_of_cobalt:0 "A Sea of Cobalt"
 KUS_a_sea_of_cobalt_desc:0 "A weapon designed to poison the land is an appalling answer to invasion. That is precisely why it may prevent one. If Katzenursk can credibly deny its conqueror the fruits of victory, even Roqualia must calculate the cost of marching east."
 KUS_ensure_we_can_strike_back:0 "Ensure We Can Strike Back"
 KUS_ensure_we_can_strike_back_desc:0 "Fixed silos invite a first strike. Ballistic submarines hidden beneath the Solakean seas will preserve a retaliatory force after airfields, ministries, and launch sites have fallen silent, making disarmament by surprise impossible."
 KUS_kick_down_the_giant:0 "Kick Down the Giant"
 KUS_kick_down_the_giant_desc:0 "For generations, Roqualia has treated its eastern neighbors as pieces on a map. Fall Zocker will reverse that relationship through concentrated attacks, rapid exploitation, and the destruction of every force sent to restore the old frontier."
 KUS_our_pioneers_advance:0 "Our Pioneers Advance"
 KUS_our_pioneers_advance_desc:0 "Victory alone cannot hold the marches. Bilingual administrators, Katzen settlers, and Estalai technicians will follow the army into the former Roqualian borderlands, building a population that sees Katzenursk as home rather than occupier."
 KUS_our_pioneers_advance_tt:0 "Unlocks §Ydecisions§! to §Ycolonize§! the eastern states of §YRoqualia§! up to the §YGrand Canal§!, provided they have been §Rnuked at least once§!."
 KUS_a_lesson_well_taught:0 "A Lesson Well-Taught"
 KUS_a_lesson_well_taught_desc:0 "With Lutécie exposed and the Grand Canal in our hands, Roqualia can either recognize the new balance or lose far more than its eastern departments. We will offer peace, but the feline marches will not be returned."
 KUS_a_lesson_well_taught_tt:0 "All states east of the §YGrand Canal§! are transferred to us."
 KUS_ward_against_revanchism:0 "Ward Against Revanchism"
 KUS_ward_against_revanchism_desc:0 "Roqualia may sign a treaty without accepting its lesson. The new frontier will be marked by concrete, buried command posts, and missile fields so obvious that no future government in Lutécie can mistake restraint for weakness."
 KUS_two_species_united_as_one:0 "Two Species United As One"
 KUS_two_species_united_as_one_desc:0 "Katzenursk began as an alliance between peoples whose histories had been used against each other. A shared Katzenurkisch culture will not erase Katzen or Estalai origins. It will declare that both now belong to a state neither could have built alone."
 KUS_two_species_united_as_one_tt:0 "With the Roqualians driven out of our rightful land, we may now undertake §Ydecisions§! to unite the Katzen and Estalai cultures of Solakea into the §3Katzenurkisch§! culture."
 KUS_a_sea_of_cobalt_tt:0 "We gain §Y25 Cobalt Warheads§!"

