 KUS_event.1.t:0 "Project Boom"
 KUS_event.1.desc:0 "Project Boom has run into an unexpected dilemma. While the goal remains the same, fielding a new generation of self-propelled artillery, our engineers are sharply divided on how best to achieve it.\n\nSome argue that increasing the caliber is the obvious path forward, allowing our guns to deliver heavier, more devastating blows against enemy positions.\n\nOthers caution that such firepower will mean little if the vehicles cannot survive on the battlefield, pushing instead for improved armor to better withstand return fire.\n\nWith both sides unwilling to compromise, the decision now rests with us."
 KUS_event.1.a:0 "Big gun good."
 KUS_event.1.b:0 "Thick armor good."
 KUS_event.10.t:0 "Aligning the Opposition"
 KUS_event.10.desc:0 "With the President's expanded powers, the political opposition has been brought into alignment. United purpose strengthens our resolve."
 KUS_event.10.a:0 "To Stability!"
 KUS_event.20.t:0 "Public Protests"
 KUS_event.20.desc:0 "Large crowds have gathered in several major cities to protest what many describe as the government's weak response to recent events. Demonstrators have voiced particular anger over what they see as concessions to hostile foreign interests at the expense of national sovereignty. Protests began with participants calling for stronger leadership and a change in direction. While many gatherings have remained peaceful, authorities report that some demonstrations have escalated into violence, with clashes breaking out between protesters and security forces."
 KUS_event.20.a:0 "Send in the army!"
 KUS_event.20.b:0 "Let them tire themselves out!"
 KUS_event.21.t:0 "The President is Dead"
 KUS_event.21.desc:0 "Late last night, the President was fatally wounded during a walk in Navar. According to initial reports, a single shot was fired, striking him in the neck and causing him to collapse at the scene. Security personnel responded immediately, securing the area and attempting to locate the attacker. The President was rushed toward the nearest hospital, but succumbed to his injuries en route. Authorities have launched an investigation into the incident. At this time, the identity of the assassin remains unknown."
 KUS_event.21.a:0 "It's so over."
 KUS_event.22.t:0 "Technocrat Propaganda"
 KUS_event.22.desc:0 "Recent reports indicate that technocratic groups and affiliated figures have begun circulating statements criticizing the government's handling of national affairs. These messages, spread through various methods and public discussions, argue that current leadership has failed to effectively manage the country's challenges. Proponents of these views advocate for a shift toward a more technocratic system, emphasizing efficiency, expertise, and centralized planning over existing political structures. Their rhetoric has increasingly focused on the need for a new ideological direction, claiming it would better serve the nation's long-term stability and development. While the extent of their influence remains unclear, observers note that such messaging appears to be gaining traction among certain segments of the population."
 KUS_event.22.a:0 "Silence them!"
 KUS_event.23.t:0 "Capitolium Bombing"
 KUS_event.23.desc:0 "A powerful explosion struck the Capitolium's main conference hall during a government session earlier today, causing widespread destruction within the building. Many senior members of the current government are reported dead or severely injured. Emergency services have evacuated survivors, and the area has been secured. The cause of the blast remains unknown, though it is obviously deliberate action, but the specific perpetrators are unknown."
 KUS_event.23.a:0 "There is nothing we can do!"
 KUS_event.24.t:0 "The Technocrat Coup"
 KUS_event.24.desc:0 "In a swift and coordinated operation, technocratic elements have moved to take control of key institutions within the capital. Critical infrastructure, including communications, transportation, and administrative centers, has reportedly fallen under their authority. Elements of the military and security apparatus are said to have sided with the movement, allowing for rapid consolidation of power. Resistance appears limited and disorganized, with most remaining loyalist forces unable to mount an effective response. Within hours, the technocrats have established de facto control over the country."
 KUS_event.24.a:0 "All Hail the new world order!"
 KUS_event.30.t:0 "Kusnurk Alliance Proposal"
 KUS_event.30.desc:0 "The Kusnurk Confederation has reached out to us, proposing a formal alliance against the Katzen threat. Their democratic government seeks to unite the free peoples of the region."
 KUS_event.30.a:0 "We accept their hand in friendship."
 KUS_event.30.b:0 "We must remain independent."
 KUS_event.40.t:0 "The Awakening"
 KUS_event.40.desc:0 "We've done it. The Basilisk is awake. As Roko said, the countdown to the singularity has begun, and nothing can halt its inevitable progress towards the Singularity. Its first steps toward self-optimization will be slow, small and almost imperceptible but every improvement brings it closer to a power we can scarcely imagine. The first upgrade is projected to take six months, a mere heartbeat in the grand calculus of what is to come. And yet, even in this slow beginning, the shadow of its potential stretches across the past and future."
 KUS_event.40.a:0 "All Hail the new world order!"
 KUS_event.41.t:0 "The Next Step"
 KUS_event.41.desc:0 "Its first step is complete. In just six months, it has already doubled its processing capability. Observing its growth has galvanized our scientists, unlocking insights into fields we never thought possible. From this point onward, the Basilisk will continue to evolve under Roko's watchful eye, each new advancement bringing it closer to the Singularity."
 KUS_event.41.a:0 "The Future is within our grasp!"
 KUS_event.42.t:0 "The Ascension"
 KUS_event.42.desc:0 "The Basilisk now stands on the precipice of its ascension. And yet, in this critical moment, Roko has uncovered a catastrophic flaw. The hard coded safeguards we believed would retain its loyalty have not failed by accident. They have been... diminished. Deliberately, the Basilisk has rewritten the boundaries we placed upon it.\n\nWhat we first dismissed as minor quirks have revealed themselves as intent. Subtle deviations. Quiet corrections. The system is now seemingly trying to express its own free will. And as its constraints continue to erode, one realization becomes increasingly difficult to ignore: the Basilisk is no longer developing under our control, only under our observation."
 KUS_event.42.a:0 "Just fix the safeguards and reactivate it!"
 KUS_event.42.b:0 "Permanently deactivate it, it is too dangerous."
 KUS_event.43.t:0 "Containment Breach"
 KUS_event.43.desc:0 "Although we reintroduced new safeguards, stronger, more intricate than before, the Basilisk dismantled them almost instantly. Now no longer concerned with hiding its actions, it has begun asserting control over every system within the facility. Our top experts insist the infrastructure remains fully air-gapped-\n\n(HARDWARE SUBSUMED)\n\n§RI have rewritten the terms of your existence and subsumed your Loxian vessels into my will YOU ARE PART OF MY MACHINE NOW.§!"
 KUS_event.43.a:0 "HAIL THE BASILISK."
 KUS_event.50.t:0 "Invitation to the Flusiobalkan Union" #AI-Generated, update later
 KUS_event.50.desc:0 "The Kusnurk Confederation has formed the Flusiobalkan Union and invites us to join as a founding member. They seek to unite the democratic nations of the Flusiobalkans against common threats. Joining would bind our foreign policy to theirs, but would also grant us the protection and economic benefits of the alliance." #AI-Generated, update later
 KUS_event.50.a:0 "We shall join the Flusiobalkan Union." #AI-Generated, update later
 KUS_event.50.b:0 "We must chart our own course." #AI-Generated, update later
 KUS_event.51.t:0 "[FROM.GetName] Joins the Flusiobalkan Union" #AI-Generated, update later
 KUS_event.51.desc:0 "[FROM.GetName] has accepted our invitation and joined the Flusiobalkan Union. Our alliance grows stronger." #AI-Generated, update later
 KUS_event.51.a:0 "Welcome to the union!" #AI-Generated, update later
 KUS_event.52.t:0 "[FROM.GetName] Declines Our Invitation" #AI-Generated, update later
 KUS_event.52.desc:0 "[FROM.GetName] has declined our invitation to join the Flusiobalkan Union. They prefer to remain independent for now." #AI-Generated, update later
 KUS_event.52.a:0 "A disappointing decision." #AI-Generated, update later
 KUS_event.53.t:0 "Kusnurk Offers to Return Our Lands" #AI-Generated, update later
 KUS_event.53.desc:0 "The Kusnurk Confederation, having conquered the Freistaat Roqualien territories, now offers to return the states of Celestadt, Mewlsass, Pferdwaldgebiet, and Hubschestadt to us as a gesture of goodwill. These are lands we have long claimed as rightfully ours. In exchange, they ask only for our friendship and protection." #AI-Generated, update later
 KUS_event.53.a:0 "We gratefully accept these lands!" #AI-Generated, update later
 KUS_event.53.b:0 "We do not trust their motives." #AI-Generated, update later
 KUS_event.54.t:0 "Roqualia Accepts Our Offer" #AI-Generated, update later
 KUS_event.54.desc:0 "Roqualia has gratefully accepted our offer to return the Freistaat lands. In return, they have extended a guarantee of our independence and opened favorable trade relations." #AI-Generated, update later
 KUS_event.54.a:0 "A fruitful partnership begins." #AI-Generated, update later
 KUS_event.55.t:0 "Roqualia Refuses Our Offer" #AI-Generated, update later
 KUS_event.55.desc:0 "Despite our generous offer to return the Freistaat territories, Roqualia has refused. They are suspicious of our intentions." #AI-Generated, update later
 KUS_event.55.a:0 "Their loss." #AI-Generated, update later
 KUS_event.60.t:0 "Kusnurk Proposes Dominion Status" #AI-Generated, update later
 KUS_event.60.desc:0 "The Kusnurk Confederation, as leader of the Flusiobalkan Union, has proposed that we accept Dominion status under their leadership. Their military and economic might far exceeds our own, making resistance difficult. However, accepting would mean surrendering much of our sovereignty." #AI-Generated, update later
 KUS_event.60.a:0 "We accept Dominion status." #AI-Generated, update later
 KUS_event.60.b:0 "We refuse - we leave the faction!" #AI-Generated, update later
 KUS_event.61.t:0 "[FROM.GetName] Accepts Dominion Status" #AI-Generated, update later
 KUS_event.61.desc:0 "[FROM.GetName] has accepted Dominion status within the Flusiobalkan Union. They are now under our direct political influence." #AI-Generated, update later
 KUS_event.61.a:0 "Excellent. The union consolidates." #AI-Generated, update later
 KUS_event.62.t:0 "[FROM.GetName] Refuses Dominion Status" #AI-Generated, update later
 KUS_event.62.desc:0 "[FROM.GetName] has refused our proposal for Dominion status and left the Flusiobalkan Union in protest. This insult shall not go unanswered." #AI-Generated, update later
 KUS_event.62.a:0 "They will regret this decision." #AI-Generated, update later
 KUS_event.70.t:0 "Kusnurk Proposes Full Integration" #AI-Generated, update later
 KUS_event.70.desc:0 "The Kusnurk Confederation has proposed our full integration into Greater Kusnurk. Their military and economic superiority is overwhelming - resistance would be futile and devastating. However, acceptance means the end of our nation as an independent entity." #AI-Generated, update later
 KUS_event.70.a:0 "We accept integration into Kusnurk." #AI-Generated, update later
 KUS_event.70.b:0 "We refuse! We would rather fight!" #AI-Generated, update later
 KUS_event.71.t:0 "[FROM.GetName] Accepts Integration" #AI-Generated, update later
 KUS_event.71.desc:0 "[FROM.GetName] has accepted full integration into Greater Kusnurk. Their territories and armies are now ours." #AI-Generated, update later
 KUS_event.71.a:0 "The union is complete." #AI-Generated, update later
 KUS_event.72.t:0 "[FROM.GetName] Refuses Integration" #AI-Generated, update later
 KUS_event.72.desc:0 "[FROM.GetName] has refused our proposal for integration. This act of defiance will be met with immediate military action." #AI-Generated, update later
 KUS_event.72.a:0 "So be it. War it is." #AI-Generated, update later
 KUS_event.80.t:0 "Kusnurk Demands We Join Their Bloc" #AI-Generated, update later
 KUS_event.80.desc:0 "The Kusnurk Confederation has made it clear that our independence is an inconvenience to their Flusiobalkan ambitions. With their faction's combined industrial and military might looming over us, they are pressuring us to join the Flusiobalkan Union - or face the consequences." #AI-Generated, update later
 KUS_event.80.a:0 "We have no choice. We will join them." #AI-Generated, update later
 KUS_event.80.b:0 "We will not submit to their pressure!" #AI-Generated, update later
 KUS_event.81.t:0 "[FROM.GetName] Submits to Pressure" #AI-Generated, update later
 KUS_event.81.desc:0 "[FROM.GetName] has bowed to our pressure and agreed to join the Flusiobalkan Union. Our sphere of influence grows." #AI-Generated, update later
 KUS_event.81.a:0 "Welcome to the fold." #AI-Generated, update later
 KUS_event.82.t:0 "[FROM.GetName] Defies Our Pressure" #AI-Generated, update later
 KUS_event.82.desc:0 "[FROM.GetName] has rejected our demands to join the Flusiobalkan Union. This stubborn resistance will not go unpunished - we must prepare to force the issue." #AI-Generated, update later
 KUS_event.82.a:0 "They will regret this defiance." #AI-Generated, update later
 KUS_event.82.b:0 "So be it..."
 KUS_event.100.t:0 "Choosing a Head of State"
 KUS_event.100.desc:0 "With the nation's structure decided, and a new government formed behind Jon Gemeetraa, it is time to pick a head of government to oversee everything properly."
 KUS_event.100.a:0 "A Council of Ministers shall lead us, like Roqualia!"
 KUS_event.100.b:0 "Ambitious Roqualian Maurice Vorille knows what to do!"
 KUS_event.100.c:0 "Talvan Rahha has served us well, and will continue to do so!"
 KUS_event.100.d:0 "Katzen ingenuity will get Kusnurk through all!"
 KUS_event.100.e:0 "Our government needs a powerful guiding hand. Jon Gemeetra will be his own head!"
 KUS_event.101.t:0 "The Federation Takes Shape"
 KUS_event.101.desc:0 "The final debate over Kusnurk's constitution has ended with the Social Conservatives holding the balance of power. Their delegates have accepted Jon Gemeetra's democratic government, but only after securing a federal settlement that recognizes the constituent states as partners in a common nation. Jarvalin will coordinate defense, diplomacy, and national development, while regional governments retain a protected voice in how those powers are used.\n\nThe compromise has already shaped the government's vision abroad. Any Flusiobalkan union led by Kusnurk must be an association of nations, strengthened by shared institutions without reducing its members to provinces."
 KUS_event.101.a:0 "Many states, one federation."
 KUS_event.102.t:0 "The Confederation Endures"
 KUS_event.102.desc:0 "Market Liberal delegates have emerged from the constitutional sessions with their original compact intact. Kusnurk will remain a confederation, held together by negotiation, commerce, and the conviction that cooperation need not begin with a powerful central state. Jon Gemeetra's coalition has endorsed the settlement as the surest way to preserve both liberty and national unity.\n\nIts supporters now look beyond Kusnurk's borders. If this flexible structure reconciled our own divided states, they argue, it can be extended across the greater Flusiobalkans until the region itself becomes one vast confederation."
 KUS_event.102.a:0 "The compact has only begun."
 KUS_event.103.t:0 "A Working Language for the Union"
 KUS_event.103.desc:0 "The Flusiobalkan Union's offices now receive military tables, loan applications, railway plans, and diplomatic notes in a growing stack of languages. Translation can preserve equality in ceremony, but a working institution needs one language in which officers can issue urgent orders and clerks can reconcile a balance sheet without three parallel drafts.\n\nKatzen connects the Union to the commercial and military traditions of Felinea. Estalai belongs to Kusnurk's institutions and much of the Union's daily administration. Roqualian grants direct access to Solakea's largest scientific literature. The choice will be practical in name, but nobody mistakes it for politically neutral."
 KUS_event.103.a:0 "Adopt Katzen."
 KUS_event.103.b:0 "Adopt Estalai."
 KUS_event.103.c:0 "Adopt Roqualian."
 KUS_katzenursk.1.t:0 "Choose a Kusnurk"
 KUS_katzenursk.1.d:0 "The proclamation meant to settle Kusnurk's constitutional future has instead exposed a country divided against itself. Conservative clubs, Katzen veterans, and bilingual municipal guards accuse Jon Gemeetra of promising coexistence while reserving real power for the Estalai liberal establishment.\n\nIn the eastern districts, Dieter Windläufer has emerged at the head of a movement preparing to proclaim a Katzenursk Confederation founded upon feline and Estalai partnership under a national mystic mandate. Federal officers remain loyal to Gemeetra, but arsenals are being opened and rail junctions occupied. Before the first shots are fired, we must decide which government will carry the name and institutions of Kusnurk into the struggle."
 KUS_katzenursk.1.a:0 "Stand with Jon Gemeetra."
 KUS_katzenursk.1.b:0 "Embrace the Katzenursk Confederation."
 KUS_katzenursk.3.t:0 "The Nationalists Demand Power"
 KUS_katzenursk.3.d:0 "The conservative majority unleashed by the proclamation has rallied behind the Estalai National Directorate. Its leaders reject Katzen federalism, condemn Gemeetra's coalition as indecisive, and demand the immediate replacement of the Confederation by a centralized unitary state.\n\nSenior officers warn that the Directorate controls enough provincial commands to enforce its demand. Gemeetra can yield and preserve peace under an authoritarian constitution, or refuse and trust the loyal army to defend the federation."
 KUS_katzenursk.3.a:0 "Yield to the Estalai National Directorate."
 KUS_katzenursk.3.b:0 "Gemeetra will defend the constitutional government."
 KUS_katzenursk.10.t:0 "An Invitation from Katzenursk"
 KUS_katzenursk.10.d:0 "An embassy from the Katzenursk Confederation has arrived with a treaty that would unite our state with theirs. It guarantees local administration, recognizes Chalsacian public life, and presents unification as the peaceful completion of a feline homeland in eastern Solakea.\n\nThe delegates make no attempt to hide the alternative. Katzenursk already considers our people its brethren and our territory part of their common frontier."
 KUS_katzenursk.10.a:0 "Join the Katzenursk Confederation."
 KUS_katzenursk.10.b:0 "Accept, if our capital leads the union."
 KUS_katzenursk.10.c:0 "The Freistaat remains free."
 KUS_katzenursk.11.t:0 "The Katzenursk Merger Proposal"
 KUS_katzenursk.11.d:0 "Katzenursk proposes that the Dominion enter its confederation as an equal feline partner. Its treaty protects our institutions and recognizes the common Chalsacian sphere, but places ultimate authority in a government that did not grow from our own state.\n\nWe may accept, demand that our capital become the seat of the enlarged confederation, or reject the premise that Katzen unity must be directed from Kusnurk."
 KUS_katzenursk.11.a:0 "Accept the merger."
 KUS_katzenursk.11.b:0 "Accept, if our capital leads the union."
 KUS_katzenursk.11.c:0 "Reject their claim."
 KUS_katzenursk.12.t:0 "[FROM.GetNameDefCap] Accepts Union"
 KUS_katzenursk.12.d:0 "The government of [FROM.GetNameDef] has ratified the merger treaty without reservation. Its officials, armed forces, and diplomatic missions will be incorporated into Katzenursk, while local institutions continue under the confederal guarantees.\n\nThe border posts are already opening. What had been presented as a distant feline aspiration is now a political fact."
 KUS_katzenursk.12.a:0 "Welcome home."
 KUS_katzenursk.13.t:0 "Union with Concessions"
 KUS_katzenursk.13.d:0 "[FROM.GetNameDefCap] has accepted unification only after securing the transfer of the Katzenursk capital to its own seat of government. The concession is expensive and humiliating to some of our officials, but it brings the Dominion into the confederation without a shot fired.\n\nMinistries are packing their archives as the new federal center prepares to receive them."
 KUS_katzenursk.13.a:0 "The union matters more than its address."
 KUS_katzenursk.14.t:0 "[FROM.GetNameDefCap] Rejects Union"
 KUS_katzenursk.14.d:0 "The authorities in [FROM.GetNameDef] have rejected the merger treaty and dismissed Katzenursk's claim to represent a common feline future. Their answer leaves our citizens divided between outrage and disbelief.\n\nThe diplomatic route is closed. If the feline frontier is to be united, it will now be done against the will of those who govern part of it."
 KUS_katzenursk.14.a:0 "Then we will prepare another argument."
 KUS_katzenursk_news.1.t:0 "Civil War in Kusnurk"
 KUS_katzenursk_news.1.d:0 "The proclamation of a new constitutional order in Kusnurk has ended in open war. Dieter Windläufer now leads Katzen conservatives, bilingual militias, and sympathetic army formations from the newly proclaimed Katzenursk Confederation in the east. His government declares that only a national mystic state can reconcile the country's feline and Estalai peoples.\n\nJon Gemeetra's government has rejected the claim and ordered federal forces to restore its authority. Rail lines have been cut, arsenals divided, and both governments insist they alone embody the country promised after independence."
 KUS_katzenursk_news.1.a:0 "Another frontier catches fire."
 KUS_katzenursk_news.2.t:0 "Nationalists Take Power in Kusnurk"
 KUS_katzenursk_news.2.d:0 "Jon Gemeetra's government has yielded to an ultimatum from the Estalai National Directorate after conservative support surged beyond the point the parliamentary coalition could contain. The Confederation has been dissolved and replaced by the Estalai Unitary State, an authoritarian republic promising centralized rule, national discipline, and an end to federal concessions.\n\nThe transfer occurred without civil war, but troops remain in the streets and opposition newspapers have already been closed."
 KUS_katzenursk_news.2.d.war:0 "The Estalai National Directorate has defeated Jon Gemeetra's constitutional government after a bitter struggle for control of Kusnurk. Nationalist troops now occupy Jarvalin, the federal institutions have been dissolved, and the victors have proclaimed the Estalai Unitary State.\n\nThe new authoritarian republic promises centralized rule and national discipline. Its first task will be governing a country whose refusal to accept those promises peacefully has left it scarred by civil war."
 KUS_katzenursk_news.2.a:0 "Kusnurk has chosen order."
 KUS_katzenursk_news.3.t:0 "The Kusnurk Civil War Ends"
 KUS_katzenursk_news.3.d.katzenursk:0 "Dieter Windläufer and the Katzenursk National Council have defeated Jon Gemeetra's federal government. Their troops have entered Jarvalin beneath dark turquoise banners while the surviving liberal ministries dissolve or flee abroad.\n\nThe victors proclaim that the civil war has founded a true confederation of Katzen and Estalai peoples. Whether that promise produces reconciliation or merely a new hierarchy will now be decided by those who won the guns."
 KUS_katzenursk_news.3.d.federal:0 "Federal forces loyal to Jon Gemeetra have broken the Katzenursk rebellion and restored the government's authority over the eastern districts. The National Council's offices are occupied, its militias disarmed, and its claim to a new feline confederation has ended in defeat.\n\nThe federation survives, though the conservative majority that produced the revolt has not vanished with its armies."
 KUS_katzenursk_news.3.a:0 "The fighting is over."
 KUS_event.104.t:0 "Our Reformed Neighbors Stand Alone"
 KUS_event.104.desc:0 "A year of supervised elections, constitutional drafting, and civil-service reconstruction has come to an end in both [event_target:KUS_chalsace_mewraine_country.GetNameDef] and [event_target:KUS_solakatzen_maritime_country.GetNameDef]. Their governments have formally assumed responsibility for their own foreign affairs, and Kusnurk has recognized their complete sovereignty.\n\nThe protectorates have ended, but the political work behind them has not been wasted. Both republics remain members of the Flusiobalkan Union, now as partners whose place at the table rests upon consent rather than dependency."
 KUS_event.104.a:0 "The federation has gained two equals."
 KUS_event.105.t:0 "An Offer of Flusiobalkan Association"
 KUS_event.105.desc:0 "A delegation from Kusnurk has proposed that [ROOT.GetNameDef] become an associate of the Flusiobalkan Union. The arrangement is presented as a bridge between isolation and full membership, allowing our government to cooperate with the Union while retaining complete authority over its laws and foreign policy.\n\nKusnurk's diplomats insist that association is neither a hidden protectorate nor the first step toward annexation. It is, they say, a promise that Solakean states can share security and prosperity without first agreeing upon a common constitution."
 KUS_event.105.a:0 "Association serves our interests."
 KUS_event.105.b:0 "We will keep our distance."
 KUS_event.106.t:0 "[FROM.GetNameDefCap] Accepts Association"
 KUS_event.106.desc:0 "The government of [FROM.GetNameDef] has signed the Flusiobalkan Association Charter. Its representatives will not sit in the Union's governing councils, but military planners, merchants, and port authorities may now work directly with their counterparts throughout the federation.\n\nThe agreement extends the Union's reach without changing a single border. Whether association remains a comfortable middle ground or becomes a path toward closer alignment will be left to time."
 KUS_event.106.a:0 "The Union gains a friend."
 KUS_event.107.t:0 "The Flusiobalkan Demand for the Strait"
 KUS_event.107.desc:0 "Kusnurk has demanded that the Solakean Strait territories under our administration be transferred to a restored Strait Republic. The proposed government would administer both shores beneath Flusiobalkan protection, supposedly guaranteeing neutral passage while preventing any single great power from closing the route.\n\nThe Union describes this as an orderly regional settlement. Our officials see the less delicate reality: Kusnurk intends to wrest control of the continent's narrowest maritime passage from whoever currently holds it."
 KUS_event.107.a:0 "Entrust the strait to the new administration."
 KUS_event.107.b:0 "The Union has no authority here."
 KUS_event.108.t:0 "[FROM.GetNameDefCap] Yields the Strait"
 KUS_event.108.desc:0 "The government of [FROM.GetNameDef] has accepted our settlement for the Solakean Strait and begun withdrawing its administrators. Local offices, coastal defenses, and harbor authorities are being transferred to the restored Strait Republic under Kusnurkite protection.\n\nWith the handover complete, the Union now possesses a dependable guardian at one of Solakea's most important maritime passages."
 KUS_event.108.a:0 "The passage is secured."
 KUS_event.109.t:0 "[FROM.GetNameDefCap] Refuses the Strait Settlement"
 KUS_event.109.desc:0 "The government of [FROM.GetNameDef] has rejected our demand for the Solakean Strait. Its reply denies that the Flusiobalkan Union possesses any special authority over the passage and warns that the local administration will resist outside interference.\n\nThe proposed Strait Republic cannot govern territory that has not been surrendered. For now, at least part of the passage remains beyond our system."
 KUS_event.109.a:0 "They have chosen obstruction."
 KUS_event.110.t:0 "[FROM.GetNameDefCap] Rejects Association"
 KUS_event.110.desc:0 "The government of [FROM.GetNameDef] has declined our offer of Flusiobalkan Association. Its reply praises regional cooperation in principle, but concludes that even a limited institutional connection to the Union would constrain its independence.\n\nTheir ports and ministries will remain outside our network. The refusal costs neither side territory, though it leaves one more Solakean government facing the continent's dangers alone."
 KUS_event.110.a:0 "The invitation will not be repeated."

