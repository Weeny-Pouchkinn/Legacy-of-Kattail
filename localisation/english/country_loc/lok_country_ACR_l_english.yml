 # ============================================================
 # IDEAS / NATIONAL SPIRITS
 # ============================================================

 ACR_final_stretch_idea:0 "Final Stretch of Amphibian Liberation"
 ACR_final_stretch_idea_desc:0 "At last! With the disintegration of the wretched Imperium, Amphibia's liberation is finally at hand! Our people stand united behind this endeavor and will do everything to ensure victory. For now."
 ACR_influence_nation_idea:0 "Kraksist Influence"

