 ACR_kolikov_retirement:0 "Kolikov's Final Term"
 ACR_complete_reconstruction:0 "Completion of Northwestern Reconstruction"
 ACR_dismantle_katlantropa_dam:0 "Dismantle the Katlantropa Dam"
 ACR_influence_nation:0 "Spread Kraksism to §Y[FROM.GetName]§!"
 ACR_integrate_nation:0 "Integrate §Y[FROM.GetName]§!"
 ACR_create_katsteyt:0 "The Katsteyt Project"
 ACR_create_katsteyt_desc:0 "Getting rid of all the Katzens in our lands would be unfeasible. We should do something else with them, so how about giving them their own state and integrating them that way?"

 # ============================================================
 # EVENTS
 # ============================================================

 ACR_event.1.t:0 "K.F.A. Spreads Kraksism"
 ACR_event.1.d:0 "The [ACR.GetName] has began a program to spread Kraksism into our country! They will surely demand our subjugation within the next year and a half."
 ACR_event.1.a:0 "Embrace it!"
 ACR_event.1.b:0 "Resist!"
 ACR_event.2.t:0 "K.F.A. Demands Integration"
 ACR_event.2.d:0 "With Kraksism spread into our nation the K.F.A. has proposed that we become their satellite. Do we accept? They will annex us later for sure."
 ACR_event.2.a:0 "It is only logical! Kraksism is the future!"
 ACR_event.2.b:0 "No! Resist!"
 ACR_event.3.t:0 "The Katsteyt Project"
 ACR_event.3.d:0 "We can either keep Katzen minorities everywhere so we make a small Katsteyt, or make a big Katsteyt so we have no Katzens minorities elsewhere."
 ACR_event.3.a:0 "Establish a lesser Katsteyt."
 ACR_event.3.b:0 "Establish a greater Katsteyt."
 ACR_event.3.c:0 "This is pointless. Deport them and execute those who resist."
 ACR_event.4.t:0 "[FROM.GetName] Refuses Integration!"
 ACR_event.4.d:0 "The government of [FROM.GetNameDef] has refused to become our satellite despite our ideological ties! This cannot stand!"
 ACR_event.4.a:0 "To war!"
 ACR_event.4.b:0 "Let them be..."
 ACR_news.1.t:0 "The Amphibian Divorce"
 ACR_news.1.d:0 "Amphibia is in upheaval as a sickly Kolikov, under pressure by numerous independentist groups, officially signed the Federation's dissolution into a number of sovereign nations before retiring.\n\nThis follows years of decline despite Kolikov's best attempts at stabilizing [ACR.GetNameDef] in the wake of [FOD.GetNameDef]'s defeat, but in the end, years of Katzen occupation have fragmented Amphibia's culture and rendered true regional unity impossible.\n\nWith the Kronk and the Yinjites having finally parted ways for the first time in well over a century, the region's future is utterly uncertain."
 ACR_news.1.a:0 "A tragedy!"
 ACR_news.1.b:0 "And so Kraksism goes!"
 ACR_news.1.c:0 "We welcome these new nations!"
 ACR_news.1.e:0 "The Kraksist experiment is at last over."
 ACR_news.1.f:0 "Their unity was but an illusion."
 ACR_news.2.t:0 "Katlantropa Dam Dismantled"
 ACR_news.2.d:0 "The [ACR.GetName] has officially concluded the dismantlement of the gargantuan Loris-built Katlantropa Dam, rejoining the two halves of the Crabspian Sea together. As to bolster national morale, the dam's material has been re-used to build statues honoring fallen Amphibian heroes throughout the nation.\n\nWhile this has finally erased the greatest scar of Kaiserism upon Amphibia, the nation's energy infrastructure is having to undergo expensive refurbishment as the Katzens had centered it around the dam's colossal electric production."
 ACR_news.2.a:0 "Amphibia is now truly free!"
 ACR_news.2.b:0 "Look at them wrecking such fine works."
 ACR_news.2.c:0 "It is in their right."
 ACR_news.2.e:0 "A bold move."
 ACR_news.2.f:0 "Suboptimal."

