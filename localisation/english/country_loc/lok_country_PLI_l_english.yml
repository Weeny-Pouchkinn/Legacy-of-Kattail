 PLI_Jebediah_Desc:0 "Jebediah, or more commonly known as Jeb, is the Direktor für Raumfahrt of the Reichsministerium, one of the most important offices within the ministry and serves as its de-facto leader."
 PLI_City_Ruin_Desc:0 "Pawldrinsel is covered in industry and urban sprawl, yet not a soul walks its streets... where has everyone gone?"
 PLI_BOOKMARK_DESC:0 "Records show Pawldrininsel was a very important part of the Kaiser's empire mere decades ago, yet today the island is empty. The streets of its abandoned cities and the ruins of its industrial sites lack not only a living soul but also mysteriously has no skeletons or signs of death... Approaching the island is nigh impossible due to the formidable network of automated defences that dot its shores... Will the mysteries of this island ever truly be uncovered?."

