 DOM_unite_east_solakean_katzens:0 "Unite the Katzens of Eastern Solakea"
 DOM_unite_east_solakean_katzens_desc:0 "Our existence as Katzens of eastern Solakea is under constant threat due to our neighbors only wanting to kick us back to the Herzlands. Federalizing under a singular state will help us gain some legitimacy within the international community."
 DOM_unite_with_FSR:0 "Propose Federalization to the Freistaat"
 DOM_unite_with_FSR_desc:0 "The Katzens to our west are much like us, Katzenartig colonists living on borrowed land - and borrowed time. We should offer them to unite so that we may stand together as one against the Unterflusionians vying to drive us out!"
 DOM_unite_with_FSR_effect:0 "§RThey may declare war on us if they disagree!§!"
 DOM_backstab_ssu:0 "Backstab the Pegasi"
 DOM_finish_the_job:0 "Finish the Job"
 DOM_katzenify_roqualia:0 "Katzenify Roqualia"
 DOM_false_flag_solaria:0 "False-Flag Solarian Nuclear Testing"
 DOM_false_flag_solaria_desc:0 "Solaria's ideology is a threat to us. By making it seem like they conducted a nuclear test on their border with [MCF.GetNameDef], we may draw the latter's ire onto Solaria and get the two into a conflict!"
 DOM_false_flag_solaria_tt:0 "There is a roughly §Y50%§! chance that §Y[SLR.GetName]§! and §Y[MCF.GetName]§! will be drawn into a conflict."
 DOM_raid_neighbor_for_materials:0 "Raid §Y[FROM.GetName]§! for Kaisertech Scrap"

 # ============================================================
 # EVENTS
 # ============================================================

 LOK_DOM.1.t:0 "Dominiontracks Suggests Federalization"
 LOK_DOM.1.d:0 "The Katzens to our east, who are famously attempting to repair the wreck of the fearsome Dominiontracks Riesigerkatzenpanzer, have come bearing a proposal to federalize both of our nations into one.\n\nThey argue that our industry will allow them to repair Dominiontracks faster, while their war expertise would prove invaluable to our combined might."
 LOK_DOM.1.a:0 "A splendid idea!"
 LOK_DOM.2.a:0 "They are a menace! We must strike before they destroy us!"
 DOM_event.1.t:0 "Solaria Tests Nuclear Warhead"
 DOM_event.1.d:0 "Alarming news! Seismic readings consistent with a nuclear test have been detected near our border with Solaria, likely indicating that the Solarians have successfully deployed atomic weaponry.\n\nThis is a great security risk, we must get them to disarm now!"
 DOM_event.1.a:0 "Send a denuclearization ultimatum!"
 DOM_event.1.a.tt:0 "We will §Rdeclare war§! on §Y[SLR.GetNameDef]§! if they refuse."
 DOM_event.1.b:0 "It is not our concern."
 DOM_event.2.t:0 "[MCF.GetName] Demands Denuclearization"
 DOM_event.2.d:0 "Following a nuclear test near our shared border, [MCF.GetNameDef] has sternly demanded that we stop all atomic armament programs and denuclearize our nation.\n\nThis has prompted much confusion and conflict as our government is adamant that we did not, in fact, conduct a nuclear test, but the Cloudstriders will not relent and threaten war if we do not comply with their demands."
 DOM_event.2.a:0 "We have no choice..."
 DOM_event.2.b:0 "Never!"

