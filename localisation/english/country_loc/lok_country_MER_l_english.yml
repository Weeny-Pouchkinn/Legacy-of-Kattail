 MER_besieged_above_and_below: "Besieged From Above and Below"
 MER_besieged_above_and_below_desc: "Mercuria thought itself lucky to have been spared from the worst of the Crusade. However it now finds itself assaulted from the north by the remnants of a machine intelligence fleet shot down by the Mondkanone, and from the south by a mysterious fungal gestalt emerging from the depths of Flusion."
 MER_shield_of_the_world: "Shield of Flusion"
 MER_shield_of_the_world_desc: "The horrendous invaders besieging Mercuria are utterly alien to Flusion - emotionless machines from space, abhorrent fungi from the mantle. It is evident that, if they are not stopped, they would likely pose a great danger to all of Flusion. Mercuria's role has never been this important!"

