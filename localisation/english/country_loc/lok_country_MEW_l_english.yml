 MEW_Queen_desc:0 ""
 MEW_BOOKMARK_DESC:0 "Making the people the greatest power is a belief thought dead for decades under the Kaiser's heel. Nonetheless, what few officers in the Imperium leaned to the left of the political spectrum have gathered in the east and carved out a little chunk of the Herzlands for their vision... but what vision, exactly? There is little time for specifics - they must act quickly, for the rest of the Herzlands will swiftly snuff out their dreams if they sit and talk for too long. It will have to be figured out as they go..."

