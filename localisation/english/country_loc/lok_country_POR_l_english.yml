 POR_unreliable_army: "Unreliable Army"
 POR_unreliable_army_desc: "With the constant coups and counter-coups since the implementation of the Republic in 1910, Army officers are more preoccupied with politics than with keeping discipline and promoting training in the army. The rank and file is demoralized, poorly equipped and poorly trained."
 POR_unstable_republic: "Unstable Republic"
 POR_unstable_republic_desc: "The era of the Republic installed in 1910 was described as one of "continual anarchy, government corruption, rioting and pillage, assassinations, arbitrary imprisonment and religious persecution". It witnessed the inauguration of nine presidents, 44 cabinet re-organisations and 21 revolutions. Even after the Military coup of 1926, there have been several failed revolutionary attempts."
 POR_british_influence: "British Influence"
 POR_british_influence_desc: "The British government is investing in the exploitation of resources in our country. This is a valuable opportunity to boost our advances in R&D."
 POR_hydroelectric_power: "Hydroelectric Power"
 POR_hydroelectric_power_desc: "Thanks to the investments made in the North and Center of Portugal, we have finally built a network of dams that produce electricity and regulate river flows."
 POR_timorese_coffe_and_sandalwood_exports_idea: "Timorese Coffee and Sandalwood Exports"
 POR_if_lose_timor_exports_die_tt: "§RWill be removed if we ever lose ownership of [721.GetName]§!"
