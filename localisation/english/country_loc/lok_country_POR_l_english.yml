 POR_volunteers_in_the_war: "Volunteers in the War"
 POR_volunteers_in_the_war_desc: "The peoples of Spain are struggling in the civil war. We will provide military assistance by organizing a volunteer force that will fight for the rightful side."
 POR_a_new_industry: "A New Industry"
 POR_improved_production: "Improved Production"
 POR_improved_production_desc: "Thanks to the state's regulations our government implemented after years of precarious financial situation we have managed to stabilize our economic situation and we are investing in more public projects to stimulate our infrastructure."
 POR_nation_in_arms: "Nation in Arms"
 POR_iberian_workers_united: "Iberian Workers United"
 POR_iberian_workers_united_desc: "We must proclaim the unity of the Iberian proletariat against tyranny of all sorts and redouble the support given to our Spanish comrades in their Civil War. Our sacrifices will be rewarded, because this is a just cause!"
 POR_monarchists_on_the_rise: "Monarchists on the Rise"
