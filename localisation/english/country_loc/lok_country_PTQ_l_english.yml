 PTQ_invade_struken:0 "Strike at Struken"
 PTQ_invade_struken_desc:0 "With Struken distracted, now is the perfect time to expand the Quarries' reach southwards."
 PTQ_peace_with_struken:0 "Ceasefire with Struken"

