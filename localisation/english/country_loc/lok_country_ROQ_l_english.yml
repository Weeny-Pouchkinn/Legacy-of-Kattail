 # ============================================================
 # FOCUSES
 # ============================================================

 ROQ_prepare_the_reclamation:0 "Prepare the Réclamation"
 ROQ_prepare_the_reclamation_desc:0 "With Roqualia back on its feet after the devastation of the Kaiser's Crusade, we must now look eastwards to finally rid Solakea from the stain of Kaiserism."
 ROQ_celebrate_the_liberation:0 "Five Years of Peace"
 ROQ_celebrate_the_liberation_desc:0 "It has been five years since the Herzlands collapsed and our nation has been free from the yoke of the perfidious Katzens! While there may be more pressing matters at hand, for now, let us host some celebrations."
 ROQ_address_the_federal_crisis:0 "Addressing the Federal Crisis"
 ROQ_address_the_federal_crisis_desc:0 "Roqualia is a vast, vast nation, containing hundreds of millions of Roqualians split into dozens of regions each with distinct cultures and subcultures. While Roqualia has been theoretically united under the Republic for decades now, its bureaucracy is bloated with exceptions and exemptions for thousands of edge cases and administrative regions across the nation. Action must be taken."
 ROQ_the_votation_is_on:0 "Launch the Great Votation"
 ROQ_the_votation_is_on_desc:0 "The Roqualian government simply cannot decide the fate of millions itself. As such, we shall declare that a great nation-wide Votation will occur in exactly one year from now as to see what direction the Roqualians themselves want their great nation to go towards. Dofus and the Ministers will thus have one year to sway the nation one way, or the other..."
 ROQ_towards_roqualian_pluralism:0 "Towards Roqualian Pluralism"
 ROQ_towards_roqualian_pluralism_desc:0 "Let us not be concerned with delusions of grandeur and a supposed need for 'strength in unity' - Roqualia is a land of party and freedom, and every Roqualian has the right to entertain themselves and live according to their own customs, no matter what the folks in Lutécie have to say about it!"
 ROQ_no_consensus:0 "A Nation Undecided"
 ROQ_towards_a_united_federation:0 "Towards an Unitary Roqualia"
 ROQ_towards_a_united_federation_desc:0 "The people have chosen to follow Dofus in his quest for a unitary Roqualian state - and so shall it be! Let us reform Roqualia into the superpower it is truly meant to be."
 ROQ_on_splinters:0 "Affirm a One-Roqualia Policy"
 ROQ_on_splinters_desc:0 "At the fringes of the Roqualian space lie the states of Alkroa and Takicardie, both very much 'Roqualian' and yet defiantly distant from Roqualia proper. While we can't outright invade them, Dofus wants to make it clear that Roqualian unity is the best solution for everyone involved."
 ROQ_on_splinters_2:0 "Cooperation with Roqualian Outliers"
 ROQ_on_splinters_2_desc:0 "Why reject Takicardie and Alkroa's differences, when there is so much to be learned from working together? There is certainly a possibility of bringing these states closer to the Roqualian sphere without having to destroy them outright."
 ROQ_on_culture:0 "Grants for Reflective Artists"
 ROQ_on_culture_desc:0 "The western half of Roqualia predominantly adheres to the 'Reflective' Culture, which prefers to create and enjoy 'one-sided' content that is to be consumed by the viewer, such as TV shows, radio talks and songs. They have been somewhat sidelined by the dominant 'Active' culture in the east, so providing monetary support to rising Reflective artists will ensure western Roqualia retains its own identity."
 ROQ_on_culture_2:0 "Hybridize the Active Culture"
 ROQ_on_culture_2_desc:0 "The 'Active' culture is the dominant Roqualian mindset, where one directly interacts with a medium which itself reacts to those interactions - gaming. We shall thus task our brightest developers and game-masters to come up with ways of hybridizing this mindset with the various other minority cultures found throughout Roqualia as to push for the cultural unification of our nation."
 ROQ_Dofus:0 "Dofus Tequenik Machina"
 ROQ_Saxeton:0 "Saxeton Hallier"
 ROQ:0 "Roqualia"

 # ============================================================
 # IDEAS / NATIONAL SPIRITS
 # ============================================================

 ROQ_Demotagne_Troubles: "The Demotagne Troubles"
 ROQ_Demotagne_Troubles_desc: "The western peninsula of Demotagne has been clamoring for higher autonomy ever since the end of the Kaiser's Crusade, citing they have been "unproportionally compensated" for their war contributions. Given their local culture highly values ritualistic destruction, it is needless to say that letting these tensions simmer for too long may have dire consequences."
 ROQ_people_of_gamers: "Roqualian Hedonism"
 ROQ_people_of_gamers_desc: "Despite having fought several wars with the Katzens in the past, Roqualia as a nation is still not well-suited for long-term warfare given the general Roqualian mentality. Much of the nation's economical output is thus focused on cultural development and personal entertainment for its citizens. Mobilizing the nation for another war would require tremendous effort."
 ROQ_poor_military_tactics: "Inefficient Military"
 ROQ_poor_military_tactics_desc: "During the Kaiser's Crusade, Roqualia relied more on its sheer industrial capacity and diplomatic cooperation with other belligerents to stand against the Katzens, rather than raw military prowess. This, coupled with the generally anti-war Roqualian mindset, has resulted in the Roqualian armed forces being well-equipped but essentially incompetent at the tactical and strategic level, especially when it comes to conducting offensive operations."
 ROQ_kaiser_crusade_damage: "Scars of the Crusade"
 ROQ_kaiser_crusade_damage_desc: "Much of the nation was devastated by the Katzen incursion and bombing raids that came with the Kaiser's Crusade. Although reconstruction is underway, it will still be some time before the wounds are truly healed."
 ROQ_roqualian_science: "Roqualian Expertise"
 ROQ_roqualian_science_desc: "Owing to their fascination for digital entertainment, Roqualia finds itself a world-class leader in several fields of science, particularly those related to computing and robotics. Roqualian schools and campuses are highly-regarded as some of the best in the world, although this is at the cost of tremendous investment in education and research."
 ROQ_persona_inc: "Massive Persona Inc. Influence"
 ROQ_persona_inc_desc: "Led by the cunning Saxeton Hallier, a robotics megacorporation known as Persona Incorporated has acquired a near-monopoly on robotic units. Persona-brand robots are a common sight within Roqualia, automating many lower-level jobs and providing services to millions, their usefulness only growing during the Kaiser's Crusade as mobilization shrank Roqualia's available workforce. Naturally, this resulted in the accumulation of tremendous political clout by Persona Inc., to the point that Saxeton is sometimes regarded as the de-facto leader of Roqualia."
 ROQ_south_looks_to_roqualia:0 "Solkatzia Looks to Roqualia"
 ROQ_south_looks_to_roqualia_desc:0 "Our southernmost states are uncertain in our ability to protect them. Many of their citizens, bolstered by the area's Roqualian minorities, have engaged in negotiations to join Roqualia should we fail to protect them."
 ROQ_soulbots: "Soulbot Deployment"
 ROQ_soulbots_desc: "Thanks to the reserve-engineering of Aeternite scraps, the Roqualians are able to create 'Soulbots' - mechanical chassises housing a genuine soul. They are used to give fallen soldiers and accident victims a 'second chance' at life, but the relative difficulty of their creation restricts them to either wealthy elites or dire cases."
 ROQ_war_exhaustion:0 "Unmotivated Populace"
 ROQ_war_exhaustion_desc:0 "" 
 ROQ_roqualian_economic_integration:0 "Roqualian Economic Integration"
 ROQ_roqualian_economic_integration_desc:0 "" 
 ROQ_reclamation_factory_payment:0 "Roqualian Payment"
 ROQ_reclamation_factory_payment_desc:0 ""

 # ============================================================
 # DECISIONS
 # ============================================================

 ROQ_commission_delaparte:0 "Commission the Delaparte" #AI-Generated Placeholder, change later!
 ROQ_commission_delaparte_desc:0 "The legendary KLT Kattenburg lies in state. By mobilizing our war industry under the direct oversight of Benjamin Delaparte, we can complete a monumental restoration project to commission it as 'The Delaparte', our ultimate flagship in this global conflict." #AI-Generated Placeholder, change later!
 ROQ_commission_delaparte_tt:0 "We will restore the wreck of KLT Kattenburg, gaining the legendary Armored Blimp Carrier division §Y\"The Delaparte\"§! in §Y[FROM.GetName]§!." #AI-Generated Placeholder, change later!
 ROQ_demand_charles_submission:0 "Demand Takicardie's Submission"
 ROQ_demand_charles_submission_desc:0 "For too long, the nearly-hermit kingdom of Takicardie has refused integration within the greater Roqualian state, their degenerate Roi always skirting around treaties and extracting compromise after compromise from our diplomats. This ends now."
 ROQ_conclude_reconstruction:0 "Conclude the Reconstruction"
 ROQ_conclude_reconstruction_desc:0 "Thanks to our efforts, the eastern part of Roqualia has been healed from its Kaiser-induced scars, and is finally ready to be re-integrated into our nation."
 ROQ_proclaim_federation:0 "Proclaim the Roqualian Federation"
 ROQ_proclaim_federation_desc:0 "Roqualians are now almost entirely united within our grand nation stretching from the Triplet Bay to the Pink Sea. It is only fitting that we represent this new development."
 ROQ_end_the_autonomy:0 "Enact the Décret de Dispersion Challemande"
 ROQ_end_the_autonomy_desc:0 "Concentrating a large chunk of our Katzen population within the Roquatzen Autonomy is nothing short of suicidal in the short-term. Maxime Parlaux has drafted up a vast plan to entice Katzens to disperse throughout Roqualia, so that their overall influence may be diluted. Their military expertise will surely prove to be invaluable in our coming conflicts..."
 ROQ_begin_the_reclamation:0 "Launch the Réclamation"
 ROQ_begin_the_reclamation_desc:0 "The time has come to reclaim what is rightfully ours! The Kaiserist usurpers shall be driven out of Solakea!"
 ROQ_departements_decision:0 "Enact Roqualification of §Y[From.GetName]§!"
 ROQ_departements_decision_desc:0 "If [From.GetName] is to become an integral part of [ROQ.GetNameDef] just like Breast or Lutécie, then we must undertake a policy of cultural assimilation bolstered by a hefty dose of Roqualian settlement thanks to the construction of brand news towns and cities."
 ROQ_proclaim_grand_federation:0 "Proclaim the Grand Roqualian Federation"
 ROQ_proclaim_grand_federation_desc:0 "With Roqualia having pushed the Kaiserist menace into the Solakatzen Channel, it is only fitting that we proclaim the Grand Roqualian Federation!"
 ROQ_proclaim_solakean_federation:0 "Proclaim the Grand Solakean Federation"
 ROQ_proclaim_solakean_federation_desc:0 "At last! All of Solakea has been liberated from Kaiserism and brought under our banner. Now, it shall finally be united as one."
 ROQ_wardec_paluushia:0 "Opération 'Gros Lapin'"
 ROQ_wardec_paluushia_desc:0 "The Paluushes are a major threat to our sovereignty if they can be allowed to modernize. Plus, their naive mindset could be easily manipulated by Kaiserists. This cannot happen!"
 ROQ_wardec_corelie:0 "Opération 'Aigle Bicéphale'"
 ROQ_wardec_corelie_desc:0 "The Corélien islands are strategically important to our control of the Solakean Sea. We must ensure these waters are entirely ours, and so they must bow."
 ROQ_wardec_vasmar:0 "Opération 'Déforestation'"
 ROQ_wardec_vasmar_desc:0 "The Vasmar Union is a slow and placid state, which could reasonably be used by the Kaiserists as a staging ground into Solakea. No more!"
 ROQ_wardec_kepler:0 "Opération 'Décolonisation'"
 ROQ_wardec_kepler_desc:0 "Kepler! Their large Katzen minority and oppression of native Lihler betray Kaiserist intent. They must be put down before their rabid feline puppeteers take over and spread Kaiserism!"
 ROQ_wardec_raiders:0 "Opération 'Fonte des Neiges'"
 ROQ_wardec_raiders_desc:0 "The southeast Solakean tundra is home to roving raiders and the archaic Ravko-Solstians. It would be trivial for the Kaiserists of the South Pole to sweep in. We must pre-empt this and wrangle control of the Antarctic canal."
 ROQ_wardec_purrhelm:0 "Opération 'Forts de la Manche'"
 ROQ_wardec_purrhelm_desc:0 "The region of Purrhelmshaven is populated by strong, hardy Katzens who are sure to resist Kaiserism. We shall aid them in this endeavor by protecting them."
 ROQ_wardec_geight:0 "Opération 'Désindustrialisation'"
 ROQ_wardec_geight_desc:0 "Geight lords over masses of servile Katzens and Roqualians with little care for their safety and well-being. This cannot be allowed to continue - such oppression is the perfect brewing ground for Kaiserism, after all."
 ROQ_wardec_izwae_paraneon:0 "Opération 'Nettoyage'"
 ROQ_wardec_izwae_paraneon_desc:0 "The small nations of Izwae and Paraneon are little more but footnotes in Solakean history, ripe for the taking by any would-be Kaiserists. Let us put them in their place."
 ROQ_wardec_vixens:0 "Opération 'Renardise'"
 ROQ_wardec_vixens_desc:0 "The Vixenoids are a hardy bunch whose supposed hatred for Kaiserists is certain to transform into Kaiserism in the near-future. They shall be stopped."
 ROQ_wardec_alkroa:0 "Le Rattachement"
 ROQ_wardec_alkroa_desc:0 "Alkroa is nothing more than an artificial state carved out by the extraflusionian Alkroans, ripped away from Roqualia in a time of weakness. We will now take back what is ours."
 ROQ_votation_cat_desc:0 "§H[?ROQ.roq_pro_federal]§! regions are in favor of a §GUnitary State§!.\n§H[?ROQ.roq_anti_federal]§! regions are in favor of a §2Decentralized Confederation§!.\n§H[?ROQ.roq_num_federal_approval_0]§! regions are §Ouncertain§!."
 ROQ_reclamation_cat:0 "The Réclamation"
 ROQ_reclamation_cat_desc:0 "[ROQ.GetROQReclamationStageDesc]\n\nRoqualia's war support is currently §Y[?ROQ.has_war_support|%1]§!. The higher it is, the more likely the war is to continue escalating.\nWe should keep a keen eye on Roqualia's military advances, as a zealous Roqualian state may attempt to go further and further.\nIf our capital is outside of Roqualia's goals, but we control states within these goals, Roqualia is likely to §Rdemand these states§! from us."
 roq_reclamation_tracker_stage1:0 "Highlight Roqualia's Goals"
 roq_reclamation_tracker_stage1_desc:0 "Roqualia is currently trying to conquer the core states of [FSR.GetName] and [DOM.GetName]."
 roq_reclamation_tracker_stage2:0 "Highlight Roqualia's Goals"
 roq_reclamation_tracker_stage2_desc:0 "Roqualia is now aiming to secure its 'natural borders' along the Solakatzen Channel and the Ongii River."
 roq_reclamation_stage2_invade_target:0 "[GetROQReclamationOperationName]"
 roq_reclamation_stage2_invade_target_desc:0 "We will launch an invasion of [FROM.GetName] to secure our natural borders."
 roq_reclamation_stage2_invade_target_tt:0 "We will declare war on [FROM.GetName]."
 roq_reclamation_stage3_invade_target:0 "[GetROQReclamationOperationName]"
 roq_reclamation_stage3_invade_target_desc:0 "We will launch an invasion of [FROM.GetName] to establish complete hegemony."
 roq_reclamation_stage3_invade_target_tt:0 "We will declare war on [FROM.GetName]." #AI-Generated Placeholder, change later!
 roq_reclamation_stage2_demand_land:0 "Demand Natural Border Territories from §Y[FROM.GetName]§!" 
 roq_reclamation_stage2_demand_land_desc:0 "We will demand that [FROM.GetName] hand over their territories within our natural borders to us."
 roq_reclamation_stage2_demand_land_tt:0 "Demand that [FROM.GetName] hand over their border territories to us."
 roq_reclamation_stage3_demand_land:0 "Demand Solakean Territory from §Y[FROM.GetName]§!"
 roq_reclamation_stage3_demand_land_desc:0 "We will demand that [FROM.GetName] hand over their Solakean territories to us." 
 roq_reclamation_stage3_demand_land_tt:0 "Demand that [FROM.GetName] hand over their Solakean territories to us."
 roq_reclamation_tracker_stage3:0 "Highlight Roqualia's Goals"
 roq_reclamation_tracker_stage3_desc:0 "Roqualia seeks to dominate the Solakean continent."
 roq_reclamation_tracker_stage4:0 "Highlight Roqualia's Goals"
 roq_reclamation_tracker_stage5:0 "§RALL IS ROQUALIA§!"
 roq_reclamation_tracker_stage5_desc:0 "Roqualia is currently waging a total crusade against the entire world."
 roq_reclamation_tracker_stage4_desc:0 "Roqualia is currently uniting the Katzen Herzlands under their banner."
 roq_reclamation_stage4_invade_target:0 "Invade [FROM.GetName]"
 roq_reclamation_stage4_invade_target_desc:0 "We will launch an invasion of [FROM.GetName] to secure the Katzen Herzlands."
 roq_reclamation_stage4_invade_target_tt:0 "We will declare war on [FROM.GetName]."
 roq_reclamation_stage4_demand_land:0 "Demand Herzland Territory from [FROM.GetName]" 
 roq_reclamation_stage4_demand_land_desc:0 "We will demand that [FROM.GetName] hand over their controlled Herzlands territories to us." 
 roq_reclamation_stage4_demand_land_tt:0 "Demand that [FROM.GetName] hand over their controlled Herzlands territories to us."
 roq_reclamation_stage1_demand_land:0 "Demand Territory from [FROM.GetName]"
 roq_reclamation_stage1_demand_land_desc:0 "We will demand that [FROM.GetName] return our Province Perdues core states to us, either by negotiation or by ultimatum." 

 # ============================================================
 # EVENTS
 # ============================================================

 ROQ_event.1.t:0 "Southern Katzen States Lobby for Help!"
 ROQ_event.1.d:0 "An urgent communiqué has reached us from the provincial governors of Solkatzia, Roquatzia and Ataropolis in [514.controller.GetNameDef]. In the wake of the war in the south, they are petitioning for the establishment of emergency secessions protocols should the situation in the south deteriorate further. This would entail quite a bit of political preparations, and may never happen if the [514.controller.GetAdjective] turns the war around, but the possibility of peacefully acquiring rich friendly Herzlandish land is certainly an interesting one. We must also consider the risks associated with any resurgent Herzlandish state attempting to reclaim these territories later on."
 ROQ_event.1.a:0 "Hmm... pourquoi pas, oui?"
 ROQ_event.1.b:0 "No. They are on their own."
 ROQ_event.2.t:0 "Solkatzia Schemes with Roqualia!"
 ROQ_event.2.d:0 "Intercepted radio comms hailing from just south of Lionsburg have revealed that, given the deteriorating military situation in the [514.controller.GetName], the states of Ataropolis, Roquatzia and Solkatzia have activated emergency secession protocols. Evidence suggests they plan to willingly join [ROQ.GetNameDef] should [514.controller.GetNameDef] prove incapable of defending them.\n\nThis is a major blow to our plans for the region, as it would allow the Unterflusionian [ROQ.GetAdjective]s to gain a foothold in the Herzlands. We must seize these lands quickly before these protocols can come into action!"
 ROQ_event.2.a:0 "They wouldn't dare..."
 ROQ_event.2.a.tt:0 "If we do not control the states of §HRoquatzia§!, §HSolkatzia§! and §HAtaropolis§! upon the capitulation of §H[PRL.GetName]§!, they will join §H[ROQ.GetNameDef]§!!"
 ROQ_event.3.t:0 "Solkatzia Plans Secession!"
 ROQ_event.3.d:0 "The regional governors of Roquatzia, Solkatzia and Ataropolis have officially informed [ROOT.GetLeader] of their intent to withdraw from [ROOT.GetNameDef] and instead join with [ROQ.GetNameDef] should the military situation in the ongoing war deteriorate further. Given the situation that our state would be when this is applied, there is little we can actually do to stop them from doing so. Our only option is to turn the war around and render this secession unnecessary."
 ROQ_event.3.a:0 "How charming..."
 ROQ_event.3.a.tt:0 "The states of §HRoquatzia§!, §HSolkatzia§! and §HAtaropolis§! will join §H[ROQ.GetNameDef]§! if they are under our control while we capitulate!"
 ROQ_event.4.t:0 "Roqualia Humbled in Reclamation!"
 ROQ_event.4.d:0 "What Roqualia described as a short ‘righting of the wrongs of history’ has turned to disaster as East-Solakean Katzen forces have not only halted the Roqualian advances, but outright routed them before pushing all the way to the outskirts of the Grand Canal! With Lutécie within artillery range and millions of terrified Roqualians fleeing westwards away from advancing Katzen forces, the Roqualian government has reluctantly signed a ceasefire to prevent further casualties. The terms, while not excessively harsh, are nonetheless humiliating: the border has moved several hundred kilometers west and a DMZ is now in place between Roqualia and the Kazens of East-Solakea. The course of Roqualian history is sure to be changed forever as millions already call for Dofus’ resignation..."
 ROQ_event.4.a:0 "A disaster!"
 ROQ_event.4.b:0 "Skill issue."
 ROQ_event.4.c:0 "They thought themselves invincible."
 ROQ_event.5.t:0 "Revolt in Roqualia!" #AI-Generated, Change Later
 ROK_event.5.d:0 "As the war continues to turn against Roqualia, [roq_revolt.GetNameDef] has risen up in revolt! Taking advantage of the chaos and the weakened Roqualian garrison, the rebels have seized control of key positions and declared their independence from Roqualian rule." #AI-Generated, Change Later
 ROQ_event.5.a:0 "Crush the traitors!" #AI-Generated, Change Later
 ROQ_event.5.b:0 "Let them go..." #AI-Generated, Change Later
 ROQ_event.6.t:0 "Splinter State Emerges from Roqualia!" #AI-Generated, Change Later
 ROQ_event.6.d:0 "[roq_revolt.GetNameDef] has broken away from Roqualia in a dramatic revolt, declaring independence and seizing territory from the beleaguered Roqualian state. As a nation currently at war with Roqualia, we must decide whether to extend our hostilities to this new entity or leave them be for now." #AI-Generated, Change Later
 ROQ_event.6.a:0 "Declare war on them as well!" #AI-Generated, Change Later
 ROQ_event.6.b:0 "Leave them be for now." #AI-Generated, Change Later
 ROQ_event.7.t:0 "To Go Further Beyond?"
 ROQ_event.7.d:0 "With the natural borders of Roqualia secured, Delaparte is wondering if maybe it is time to call it quits, or if he should go... even further beyond."
 ROQ_event.7.a:0 "Roqualia is safe. I am not needed anymore."
 ROQ_event.7.b:0 "Why stop here? Why limit myself?"
