 roq_reclamation.10.t:0 "Province Perdues Reclaimed!"
 roq_reclamation.10.d:0 "The Province Perdues have been returned to our rightful control! It is time to see what the Roqualians want to do next..." 
 roq_reclamation.10.a:0 "The Roqualians want more land to secure their borders!"
 roq_reclamation.10.b:0 "The Roqualians are tired of war. We need peace!"
 roq_reclamation.100.t:0 "Roqualian Peace Offer"
 roq_reclamation.100.d:0 "Roqualia is suing for a white peace. If we accept, they will retain [FSR.GetName] and [DOM.GetName] core states, ending the war."
 roq_reclamation.100.a:0 "Accept the peace offer."
 roq_reclamation.100.b:0 "Refuse the peace offer!" 
 roq_reclamation.111.t:0 "Reclamation Peace Talks Failed"
 roq_reclamation.111.d:0 "The enemy has refused our peace offer. The Reclamation continues! We must secure our borders against these swines!"
 roq_reclamation.111.a:0 "Benjamin Delaparte will save us!"
 roq_reclamation.112.t:0 "Reclamation Concluded Peacefully" 
 roq_reclamation.112.d:0 "All external parties have accepted our peace offer. The Reclamation has successfully concluded."
 roq_reclamation.112.a:0 "A peaceful victory."
 roq_reclamation.20.t:0 "Natural Borders Secured!"
 roq_reclamation.20.d:0 "Under Delaparte's leadership, we have secured our natural borders. Should we go even further?" 
 roq_reclamation.20.a:0 "Why stop here? Why limit myself?" 
 roq_reclamation.20.b:0 "Enough bloodshed. I must step down."
