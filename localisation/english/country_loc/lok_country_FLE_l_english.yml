 FLE_war.1.t: "Sobaki Forces Pushed Into The Sea"
 FLE_war.1.desc: "We did it! Earlier today the last of the 11th S.P.L.N Marine Corps surrendered to our forces in Southtalon Harbour. The flag of the Federation now waves over the port as the beaten Sobaki's are loaded back onto their boats to return to Sobakiland.\n\nAdditionally, we've been contacted by members of the Southclaw Tribe. Shortly after the surrender of the Sobaki Forces in Southtalon the Sobaki Garrison on the island abandoned their outposts and fled on their ships. The people of both the Southclaw and Southtalon Tribes have expressed their unending gratitude for their liberation and are sending delegates to officially sign the Federal Charter."
 FLE_war.1.a: "Our freedom is in reach! Only the Mercurian menace remains!"
 FLE_war.1.b: "Victory! We have won our freedom at last!"
 FLE_war.11.t: "Failure in Fleatherland"
 FLE_war.11.desc: "Much to our dismay, the 11th S.P.L.N Marine Corps' expedition to liberate Fleatherland has ended in failure. The natives and surviving Katzen collaborators pushed our forces into the sea earlier today and the survivors are sailing back to Blasterburg.\n\nMany within our military high command are blaming this failure on the commander of the mission, Lieutenant-General Achkosov. A war hero by all counts, he still has valuable experience that would be lost if we were to dismiss him. Despite this, the public and our officers still need somebody to blame for this humiliation."
 FLE_war.11.a: "Perhaps we underestimated the natives. Achkosov's Expedition should have had more support"
 FLE_war.11.b: "Ackhosov's failure is unforgiveable, our officer corps has no use for him"
 FLE_war.2.t: "Mercurian Forces Pushed Into The Sea"
 FLE_war.2.desc: "Great news! Our northern forces have reported that the R.M.N 3rd Fleet Marine Corps has surrendered in full to our forces. Shortly before the surrender order went out, our forces stormed and liberated Northtalon Harbour's City Hall building, the invader's only port and source of supply. What remains of the Mercurian invaders have been allowed to take their ships and return to their island in shame, likely to be reassigned straight onto the war effort against the Sillicron Continuum.\n\nWith the liberation of their homelands, the Northclaw Tribe have contacted us to thank us for expelling the invaders and are sending delegates to Mount Fleather to sign the Federal Charter."
 FLE_war.2.a: "Our freedom is in reach! Only the Sobaki menace remains!"
 FLE_war.2.b: "Victory! We have won our freedom at last!"
 FLE_war.21.t: "Failure in Fleatherland"
 FLE_war.21.desc: "Much to our dismay, the R.M.N 3rd Fleet Marine Corps' expedition to conquer Fleatherland has ended in failure. The natives and surviving Katzen collaborators pushed our forces into the sea earlier today and the survivors are sailing back to Wschobregi.\n\nMany within our military high command are blaming this failure on the commander of the mission, Lieutenant-General Tulia Korzyn. A war hero by all counts, he still has valuable experience that would be lost if we were to dismiss him. Despite this, the public and our officers still need somebody to blame for this humiliation."
 FLE_war.21.a: "Perhaps we underestimated the natives. Korzyn's Expedition should have had more support"
 FLE_war.21.b: "Korzyn's failure is unforgiveable, our officer corps has no use for him"
 FLE_war.3.t: "We Have Won!"
 FLE_war.3.desc: "At long last, the invaders have been pushed off of the Isles! For the first time in decades, Mount Fleather is truly Free.\n\nCelebration has erupted across all seven of the Fleatherian Tribes, with the entirety of the isles united in the Federation, Grand-Chief Greatbeak III has established \"Unification Day\" as a national holiday from this day onward."
 FLE_war.3.a: "Never again will we be suppressed under a foreign boot!"
 FLE_war.4.t: "The Miracle at Fleather Peak!"
 FLE_war.4.desc: "Shocking news has emerged from the isles of Fleatherland. The native avians of the island have reportedly pushed back both the Mercurian and Sobaki military expeditions to the island and established a Federation consisting of the isles seven native tribes, led by a Grand-Chief by the name of Greatbeak the Third, Chief of the tribe native to the isles tallest mountain, Mt Fleather.\n\nWhen the two nations launched their invasions of the isles, both the Sobaki and Mercurian governments claimed the isle was a holdout of what remained of the late Katzenartig Imperium's Pawcific forces. In spite of the claim, Grand-Chief Greatbeak states that the Imperial remnants central command had fallen by their claw long before the Sobaki and Mercurian governments landed on the island.\n\nBoth the Sobaki and Mercurian governments have refused to comment on the matter, while many other nations have begun the process of establishing diplomatic contact with the island and establishing embassies with the fledgeling nation-state."
 FLE_war.4.a: "We need to run damage control... NOW!"
 FLE_war.4.b: "Send our congratulations to the people of Fleather."
 FLE_war.4.c: "They will return back into the fold... One day."
 FLE_war.5.t: "Fall of Mt Fleather"
 FLE_war.5.desc: "Excellent news Lieutenant-General, the Mt Fleather government has surrendered in full. Our forces have occupied the seat of the tribal government at the mountain peak and are preparing for our relocation to the advantageous command center."
 FLE_war.5.a: "Excellent, lets get packing."
 FLE_war.51.t: "Operation \"Mountain Dusk\" - Status Report"
 FLE_war.51.desc: "CONFIDENTIAL COMMUNICATIONS - S.P.L.N HIGH COMMAND EYES ONLY\n\nGreetings General\n\nThe tribal government has surrendered to our forces in full. Resistance to our liberation campaign has been experienced but, with the surrender of the tribals, is expected to dissipate over the coming weeks.\n\nFrontline troops are being reassigned to expel the Mercurian forces present on the island, with the mountain under control i expect the rest of operation Mountain Dusk to be concluded shortly\n\n- Lieutenant-General Alebarksy Achkosov."
 FLE_war.51.a: "Excellent News."
 FLE_war.6.t: "Mercurian Forces Expelled"
 FLE_war.6.desc: "Excellent news Lieutenant-General, our landing operation into the Mercurian occupied peninsula has been a success. The Mercurian forces have surrendered and we have started the process of repatriating their forces back to Mercuria. More reserves have been dispatched to the area to establish control over the region.\n\nWith our only contender defeated, we may begin the process of crushing the native resistance to our liberation mission."
 FLE_war.6.a: "Now, only Mt Fleather remains"
 FLE_war.61.t: "Operation \"Mountain Dusk\" - Status Report"
 FLE_war.61.desc: "CONFIDENTIAL COMMUNICATIONS - S.P.L.N HIGH COMMAND EYES ONLY\n\nGreetings General\n\nMy forces have successfully executed a landing operation into the Mercurian occupied northern peninsula of Fleatherland. With the monarchist invaders defeated i have redirected all of our efforts towards crushing the native resistance to the Operation. A swift conclusion to Operation Mountain Dusk is in sight.\n\n- Lieutenant-General Alebarksy Achkosov."
 FLE_war.61.a: "Excellent News."
 FLE_war.62.t: "Failure in Fleatherland"
 FLE_war.62.desc: "Much to our dismay, the R.M.N 3rd Fleet Marine Corps' expedition to conquer Fleatherland has ended in failure. The Sobaki forces made a surprise landing earlier today in our base of operations and pushed our forces into the sea. the survivors are currently sailing back to Wschobregi.\n\nMany within our military high command are blaming this failure on the commander of the mission, Lieutenant-General Tulia Korzyn. A war hero by all counts, he still has valuable experience that would be lost if we were to dismiss him. Despite this, the public and our officers still need somebody to blame for this humiliation."
 FLE_war.62.a: "Perhaps we underestimated the Sobaki. Korzyn's Expedition should have had more support"
 FLE_war.62.b: "Korzyn's failure is unforgiveable, our officer corps has no use for him"
 FLE_war.7.t: "Total Victory Secured"
 FLE_war.7.desc.fle: "Excellent new Lieutenant-General, the government of Mount Fleather has surrendered in full!\n\nWith their surrender our forces now have undisputed control over the entirety of Fleatherland and we can safely conclude Operation \"Mountain-Dusk\" as a complete victory."
 FLE_war.7.desc.flm: "Excellent new Lieutenant-General, the Mercurian forces have surrendered in full!\n\nWith their surrender our forces now have undisputed control over the entirety of Fleatherland and we can safely conclude Operation \"Mountain-Dusk\" as a complete victory."
 FLE_war.7.a: "Send word to the Motherland, We're coming home."
 FLE_war.71.t: "Victory in Fleatherland"
 FLE_war.71.desc: "Earlier today, the 11th S.P.L.N Marine Corps returned in triumph from Fleatherland! The island now lies firmly in our grasp with Operation Mountain-Dusk being a resounding success.\n\nWith the military operation complete, we are now left with the issue of what to do with it.\n\nOur first and most reasonable option, is establishing a semi-autonomous sister republic in the isles to bring forth the revolution to the people of Fleatherland, while allowing us to maintain a military presence on the island\n\nThe other option, is to simply order the navy govern the island under a military authority, ensuring that our strategic interests over the pawcific are secured... while depriving the people of Fleatherland of a civilian government."
 FLE_war.71.sister_republic: "Establishing a Sister Republic is the only sane option"
 FLE_war.71.navy_puppet: "Our interests must be secured, issue the order to the Navy"
 FLE_war.72.t: "Failure in Fleatherland"
 FLE_war.72.desc: "Much to our dismay, the R.M.N 3rd Fleet Marine Corps' expedition to conquer Fleatherland has ended in failure. The Sobaki forces pushed our forces all the way to our headquarters and into the sea. the survivors are currently sailing back to Wschobregi.\n\nMany within our military high command are blaming this failure on the commander of the mission, Lieutenant-General Tulia Korzyn. A war hero by all counts, he still has valuable experience that would be lost if we were to dismiss him. Despite this, the public and our officers still need somebody to blame for this humiliation."
 FLE_war.72.a: "Perhaps we underestimated the Sobaki. Korzyn's Expedition should have had more support"
 FLE_war.72.b: "Korzyn's failure is unforgiveable, our officer corps has no use for him"
 FLE_war.8.t: "Fall of Mt Fleather"
 FLE_war.8.desc: "Excellent news Lieutenant-General, the Mt Fleather government has surrendered in full. Our forces have occupied the seat of the tribal government at the mountain peak and are preparing for our relocation to the advantageous command center."
 FLE_war.8.a: "Excellent, Let's get Packing"
 FLE_war.81.t: "Operation \"Flower-Bulb\" - Status Report"
 FLE_war.81.desc: "CONFIDENTIAL COMMUNICATIONS - FOR THE EYES OF HIS MAJESTY AND THE HIGH COMMAND OF THE ROYAL MERCURIAN ARMY ONLY\n\nGreetings my Liege\n\nThe tribal government has surrendered to our forces in full. Resistance to the crown has been experienced but, with the surrender of the tribals, is expected to dissipate over the coming weeks.\n\nFrontline troops are being reassigned to expel the Sobaki forces present on the island, with the mountain under control i expect the rest of operation Flower Bulb to be concluded shortly\n\n- Lieutenant-General Tulia Korzyn."
 FLE_war.81.a: "Excellent News"
 FLE_war.9.t: "Sobaki Forces Expelled"
 FLE_war.9.desc: "Excellent news Lieutenant-General, our landing operation into the Sobaki occupied peninsula has been a success. The Sobaki forces have surrendered and we have started the process of repatriating their forces back to Sobakiland. More reserves have been dispatched to the area to establish control over the region.\n\nWith our only contender defeated, we may begin the process of crushing the native resistance to the Crown."
 FLE_war.9.a: "Now, only MT Fleather Remains"
 FLE_war.91.t: "Operation \"Flower-Bulb\" - Status Report"
 FLE_war.91.desc: "CONFIDENTIAL COMMUNICATIONS - FOR THE EYES OF HIS MAJESTY AND THE HIGH COMMAND OF THE ROYAL MERCURIAN ARMY ONLY\n\nGreetings my Liege\n\nMy forces have successfully executed a landing operation into the Sobaki occupied southern peninsula of Fleatherland. With the communist invaders defeated i have redirected all of our efforts towards crushing the native resistance to the Operation. A swift conclusion to Operation Flower Bulb is in sight.\n\n- Lieutenant-General Tulia Korzyn."
 FLE_war.91.a: "Excellent News"
 FLE_war.92.t: "Failure in Fleatherland"
 FLE_war.92.desc: "Much to our dismay, the 11th S.P.L.N Marine Corps' expedition to liberate Fleatherland has ended in failure. The Monarchist Mercurian invaders pushed our forces into the sea earlier today, what remains of our expedition already sailing back to Blasterburg.\n\nMany within our military high command are blaming this failure on the commander of the mission, Lieutenant-General Achkosov. A war hero by all counts, he still has valuable experience that would be lost if we were to dismiss him. Despite this, the public and our officers still need somebody to blame for this humiliation."
 FLE_war.92.a: "Perhaps we underestimated the Mercurians. Achkosov's Expedition should have had more support"
 FLE_war.92.b: "Ackhosov's failure is unforgiveable, our officer corps has no use for him"
 FLE_war.10.t: "Total Victory Secured"
 FLE_war.10.desc.fle: "Excellent new Lieutenant-General, the government of Mount Fleather has surrendered in full!\n\nWith their surrender our forces now have undisputed control over the entirety of Fleatherland and we can safely conclude Operation \"Flower-Bulb\" as a complete victory."
 FLE_war.10.desc.fls: "Excellent new Lieutenant-General, the Sobaki forces have surrendered in full!\n\nWith their surrender our forces now have undisputed control over the entirety of Fleatherland and we can safely conclude Operation \"FLower-Bulb\" as a complete victory."
 FLE_war.10.a: "Send word to the Kingdom, We're coming home."
 FLE_war.101.t: "Victory in Fleatherland"
 FLE_war.101.desc: "Earlier today, the R.M.N 3rd Marine Corps returned in triumph from Fleatherland! The island now lies firmly in our grasp with Operation Flower-Bulb being a resounding success.\n\nWith the military operation complete, we are now left with the issue of what to do with it.\n\nOur first and most reasonable option, is establishing a Duchy in the isles under the eye of a loyal Duke, while allowing us to maintain a military presence on the island\n\nThe other option, is to simply order the navy govern the island under a military authority, ensuring that our strategic interests over the pawcific are secured... while depriving the people of Fleatherland of a civilian government."
