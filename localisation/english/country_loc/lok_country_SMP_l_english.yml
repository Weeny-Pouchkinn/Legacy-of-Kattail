 SMP_BOOKMARK_DESC:0 "After a decade of war, the realm of Swamp King Terrence IV lies as the strongest land power on Arivoejo. While their fleet may dull in comparison to others on the isle, his Majesties Marines outnumber the militaries of all their neighbours, not counting the Zealots of Nova, 2-1.\n\nBut for all their military prowess, the Swamplands are in a tough spot at home. Mistreatment of the workers under Prime Minister Platmers premiership have caused republican and socialist sentiment to skyrocket... By no means irredeemable, but is definitely not something that can be ignored... "

