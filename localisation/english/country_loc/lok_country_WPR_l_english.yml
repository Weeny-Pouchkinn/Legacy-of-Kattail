 WPR_unfinished_infrastructure:0 "Unfinished Infrastructure"
 WPR_unfinished_infrastructure_desc:0 "Before the collapse Katzen mega highways and infrastructure projects were planned in the region but unfortunately those projects remain unfinished. The collapse of Imperium caused severe resource shortages in our construction industries and we no longer have the resources or expertise to finish these projects."
 WPR_ranger_corps:0 "The Ranger Corps"
 WPR_ranger_corps_desc:0 "Though the peaks may be harsh and unforgiving, our brave rangers secure our borders, protect our people, and keep the roads to mountainous communities open year round. Brave soldiers and cunning tricksters, our rangers are the backbone of our military."
 WPR_people_of_the_mountains:0 "People of the Mountains"
 WPR_people_of_the_mountains_desc:0 "For years we have been neglected by the Urban Katzen, our contributions undervalued, and our mountain spirit ignored. With the collapse of the Imperium we now have the chance to truly show the spirit of the Mountain Katzen. However our republic is at risk, more extremist elements have begun to organize their own parties all while foreign foes close in on our borders, will our nation stay strong or will we end up as a footnote in history."

