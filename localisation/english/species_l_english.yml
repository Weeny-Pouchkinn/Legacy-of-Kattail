  var_species_24:0 "§GYinjite§!"
  var_species_24_desc:0 "This species incurs no state effects.\n§LYinjites are a salamander-like amphibious species known for their extremely fine hearing, mostly native to eastern Amphibia.§!"

  var_species_25:0 "§YGalletian§!"
  var_species_25_desc:0 "This species incurs no state effects.\n§LOriginating on Doughland, Galletians resemble gingerbread cookies and thrive in extremely hot environments. They are quite intelligent but also known for their distrust of other species.§!"

  var_species_26:0 "§8Droogian§!"
  var_species_26_desc:0 "This species incurs no state effects.\n§LDroogians are a distant cousin of Roqualians who, after migrating to southern Oshia, became vampiric in nature following exposition to ancient Linterian artefacts. They live long and fear sunlight.§!"

  var_species_27:0 "§1Enotitan§!"
  var_species_27_desc:0 "This species incurs no state effects.\n§LEnotitans are a serpentine species with prehensile tails which they use to manipulate tools. Their language consists entirely of hisses with varying frequencies acting as 'letters'.§!"

  var_species_28:0 "§OAlkroan§!"
  var_species_28_desc:0 "This species incurs no state effects.\n§LAlkroans are small, intelligent predatory birds of unknown origin.§!"

  var_species_29:0 "§GMercurian§!"
  var_species_29_desc:0 "Food Consumption: §G-50%§! (§YPhotothropic§!)\n§LMercurians encompass a variety of plantoid species of all sizes and shapes, ranging from the large tree-like Vasmars to the smaller and diverse castes of Mercurians. This species is capable of deriving some of its sustenance directly from water and air using energy provided by photosynthesis. This significantly reduces the amount of nutrition needed to sustain them.§!" #AI-Generated Placeholder, change later!

  var_species_30:0 "§RCalderite§!"
  var_species_30_desc:0 "This species incurs no state effects.\n§LThese hot-headed lithoids originate from the great Oshian Supervolcano. They are very resilient but ultimately not very intelligent.§!"

  var_species_31:0 "§2Hiveform§!"
  var_species_31_desc:0 "This species incurs no state effects.\n§LOriginally part of a large hiveminded superorganism, these formerly subsapient insectoid hiveforms have since diverged, with numerous of them attaining sapience and forming new nation-states throughout Oshia.§!"

  var_species_32:0 "§8Ravkan§!"
  var_species_32_desc:0 "This species incurs no state effects.\n§LRavkans are humanoids exhibiting a variety of elemental psionic powers not unlike that of Paluushes, albeit significantly more varied and not quite as intense.§!"

  var_species_33:0 "§tLihler§!"
  var_species_33_desc:0 "This species incurs no state effects.\n§LLihlers are small, communal beings with a lagomorphic lower body and a humanoid, rabbit-eared upper body. They are known for their strong sense of community and aversion for state-collected taxes.§!"

  var_species_34:0 "§BNovian§!"
  var_species_34_desc:0 "This species incurs no state effects.\n§LNovians are intelligent avian creatures gifted with slight psionic powers which often translates into intense religious fervor for their divinity, Nova.§!"

  var_species_35:0 "§6Urscyd§!"
  var_species_35_desc:0 "This species incurs no state effects.\n§LUrscyds are large, bear-like sapients with a slow-going nature and known appreciation for good food.§!"

