  var_species_4_desc:0 "REPLACE_ME"

  var_species_5:0 "§3Nekeox§!"
  var_species_5_desc:0 "Base Radiation Resistance: §G+5§! (§0Lithoid§!)\nCasualties from Radiation: §G-75%§! (§0Lithoid§!)\nEffects from Radiation: §G-75%§! (§0Lithoid§!)\nFood Consumption: §G-100%§! (§0Lithoid§!)\n§LNekeox are a silicon-based lithoid species with a high-temperature metabolism - this and their solid excretions make them excellent living foundries. Their biological predilection for construction and manufacturing leads to a pervasively egalitarian outlook - an outlook exploited by the Kaiser as series of hung parliaments and ineffectual governments left the Nekeox military unable to resist a brutal Katzen invasion and decades-long subjugation. Consequently, Nekeox military foreign policy and strategy are defensively isolationist; individually, however, Nekeox are tolerant optimists, eager to cooperate with others.§!"

  var_species_6:0 "§tPuffian§!"
  var_species_6_desc:0 "REPLACE_ME"

  var_species_7:0 "§9Kronk§!"
  var_species_7_desc:0 "Infrastructure Build Speed: §G+25%§! (§YNatural Excavators§!)\n§LThe Kronks are a sapient crustaceoid-amphibious humanoid species native to the diverse lands and coastal regions of Amphibia. With their massive, crab-like bodies and enormous strength, they have been often nicknamed 'natural excavators' due to their resilience and physical prowess. While ancient Kronk societies were plagued by internal strife and brutal autocracies, the modern Kronks have cultivated a rich, communal civilisation that emphasises social unity, education, and collective responsibility.§!"

  var_species_8:0 "§YNitromethane§!"
  var_species_8_desc:0 "Base Radiation Resistance: §G+5§! (§0Lithoid§!)\nCasualties from Radiation: §G-75%§! (§0Lithoid§!)\nEffects from Radiation: §G-75%§! (§0Lithoid§!)\nFood Consumption: §G-100%§! (§0Lithoid§!)\n§LKnown for their industrial prowess and attrition based defense doctrine as well as their hiveminded nature, the Nitromethanes as a species are one of the odder groups of people on Flusion. Due to their nature as a hive mind the Nitromethanes are naturally reclusive, opting to rely on themselves more so than others outside of their communities. Nevertheless, the Nitromethanes do occasionally venture out of their underground citadels for a variety of reasons, with most of them pertaining to the upkeep of their Military Industrial Complex that forms the backbone of their society. Due to their homelands situation within the Herzlands, being one of the few non-katzen peoples that originally hail from the region, the Nitromethanes have experienced first hand the aggression of the Katzen race, and are regularly less than friendly to Katzen controlled governments unless the benefits of aligning themselves with them outweigh their general dislike for the race. Nevertheless, they are not entirely trusting of any one people, making plans against many of their allies on a variety of occasions as a 'countermeasure' to betrayal.§!"

