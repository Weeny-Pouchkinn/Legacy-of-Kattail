  var_species_1:0 "§2Katzen§!"
  var_species_1_desc:0 "Base Radiation Resistance: §G+0.8§! (§7Rad-Resistant§!)\nCasualties from Radiation: §G-50%§! (§7Rad-Resistant§!)\nEffects from Radiation: §G-30%§! (§7Rad-Resistant§!)\nFood Consumption: §R+15%§! (§YMostly Carnivorous§!)\nResistance Growth: §R+30%§! (§tResilient§!)\nResistance Target: §R+15%§! (§tResilient§!)\nEnemy Supply & Speed: §R-20%§! (§tResilient§!)\n§LIntelligent, loyal to their leaders as well as fiercely militaristic and nuclear-loving, Katzens are known for their extreme jingoism and hyper-militarizing of every aspect of their society. Their extreme militarization coupled with fanatic military discipline and aggressive foreign policies often results in the Katzens being considered a hazardous species by their neighbors, which the Katzens usually inevitably attempt to take over at one point or another.§!"

  lok_species_katzen_majority:0 "Katzen Majority"

  var_species_2:0 "§RSobaki§!"
  var_species_2_desc:0 "Dockyard Build Speed: §G+15%§! (§2Seafaring§!)\nFood Consumption: §R+15%§! (§YMostly Carnivorous§!)\n§LOriginally from Nienet, Katzenland's first moon, Sobaki history is closely linked to that of the Katzens, often in the context of brutal oppositions between the two species. Charismatic, bonded to communal ties and companions, Sobaki are known to be traditional and family-oriented. Their society is divided into various clans, headed by dynastic leaders known as 'princes' and elected rulers to oversee their land. When a threat emerges, the Sobaki will unite as one to confront it.§!"

  lok_species_sobaki_majority:0 "Sobaki Majority"

