  var_species_12:0 "§OLoxian§!"
  var_species_12_desc:0 "Food Consumption: §R+25%§! (§YCarnivorous§!)\n§LDescended from a variety of Nebularian-born Loxians brought by the Meopian Expedition which have since adapted to Flusion's conditions, these fox-like humanoids are a resilient race, often trying to find a way to subvert problems by using their natural abilities cunning, however they are still capable of fighting back if possible. On top of a remarkably resilient frame, they also have keen senses allowing them to detect enemies far before they reach visual range or before the enemy finds them. However, as their bodies were once sustained using hyper-nutritive slurry provided to them by the Eden Tree, they now require a large amount of nutrients to keep going and have since turned carnivorous, making food acquisition a very important priority.§!"

  var_species_13:0 "§CCloudstrider§!"
