  var_species_19:0 "§CNederkatten§!"
  var_species_19_desc:0 "Dockyard Build Speed: §G+15%§! (§2Seafaring§!)\nBase Radiation Resistance: §G+0.8§! (§7Rad-Resistant§!)\nCasualties from Radiation: §G-50%§! (§7Rad-Resistant§!)\nEffects from Radiation: §G-30%§! (§7Rad-Resistant§!)\nFood Consumption: §R+15%§! (§YMostly Carnivorous§!)\nResistance Growth: §R+30%§! (§tResilient§!)\nResistance Target: §R+15%§! (§tResilient§!)\nEnemy Supply & Speed: §R-20%§! (§tResilient§!)\n§LDistant Cousins of the Herzlandic Katzen, Nederkattens are a culturally and biologically diverged variety of Katzens. The Nederkattens, unlike their ocean fearing cousins, embrace the waves with open arms, being natural swimmers thanks to the alterations their colony ship made upon contact with the West Katteneiland Sea. Culturally they resist the attempts of strongman leaders like the dictators of the Herzlands... But once in a while a true leader may capture that genetic tendency no matter how deep the cultural repression"

  var_species_20:0 "§3Hyperdiverse§!"
  var_species_20_desc:0 "Construction Speed: §R-20%§! (§CComplex Architecture§!)\nPopulation Growth: §G+25%§! (§1Immigration Hub§!)\nResistance Growth: §R+25%§! (§0Species O' Plenty§!)\nCompliance Growth: §R-25%§! (§0Species O' Plenty§!)\nFood Consumption: §R+50%§! (§6World Wide Cuisine§!)\n§LThis region is full of more species than there are colours for the diversity piechart, residents say you can meet a new species just by turning a corner. Architecture in the region tends to either be a colossal inclusivity headache trying to accommodate for species of 3 different sizes and with varying amounts of legs, or a hodgepodge mess of building styles with enough inconsistencies to kill a building inspector."

