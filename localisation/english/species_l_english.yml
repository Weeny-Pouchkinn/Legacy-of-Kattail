  var_species_15:0 "§8Paluush§!"
  var_species_15_desc:0 "Food Consumption: §R+5000%§! (§YUtterly Gargantuan§!)\n§LThe Paluushes are a sapient species of large and psionically capable rabbit-like creatures, notorious for their idyllic lifestyle and their incredibly powerful psionic capabilities granting them near-complete mastery over the elements. They are generally isolationist, avoiding contact with outsiders whenever possible and opting to preserve their idyllic and agrarian lifestyle at the cost of forgoing technological progress. Paluushes can reach enormous sizes of above five meters, which often makes interacting with other species difficult and forces them to consume tremendously more food than individuals of other species.§!"

