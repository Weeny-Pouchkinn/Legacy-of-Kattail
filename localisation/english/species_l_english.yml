  var_species_45:0 "§OMuldvarpe§!"
  var_species_45_desc:0 "Build Speed: §R-20%§! (§OSubterranean§!)\nBase Radiation Resistance: §G+1.5§! (§OSubterranean§!)\nCasualties From Radiation: §G-75%§! (§OSubterranean§!)\nResistance Target: §R+15%§! (§OSubterranean§!)\nEffects from Radiation: §G-50%§! (§OSubterranean§!)\nInfrastructure Build Speed: §G+25%§! (§YNatural Excavators§!)\n§LMuldvarpe are industrious subterranean creatures born and raised hundreds of miles beneath the surface of Arivoejo in tight knit town communities known as \"Guild Cities\".\n\nThey are renowned continent wide for the sheer mass and quality of the materials they export and have managed to survive the wars that plagued the continent decades prior thanks to this boon they hold over their surface-dwelling neighbours, that and the fact they are utterly difficult to properly occupy as some of their Guild Cities lie hundreds upon hundreds of metres beneath Arivoejo's soil... And who knows when or where they may choose to launch a reprisal attack on the surface?§!"

