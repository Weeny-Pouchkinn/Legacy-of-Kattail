  var_species_49:0 "§RSillicron§!"
  var_species_49_desc:0 "Base Radiation Resistance: §G+10§! (§RMechanical§!)\nCasualties from Radiation: §G-90%§! (§RMechanical§!)\nEffects from Radiation: §G-90%§! (§RMechanical§!)\nFood Consumption: §G-100%§! (§RMechanical§!)\n§LSillicrons are fully mechanical beings from another world. They form a networked intelligence collective bent on assimilation.§!"

  var_species_50:0 "§6Poltro§!"
  var_species_50_desc:0 "This species incurs no state effects.\n§LPoltro are a fungal hivemind hailing from the depths of the mantle.§!"

  var_species_51:0 "§5Cyborg Loxian§!"
  var_species_51_desc:0 "Base Radiation Resistance: §G+2.5§! (§5Cyborg§!)\nCasualties from Radiation: §G-25%§! (§5Cyborg§!)\nBase State Productivity: §G+10%§! (§5Cyborg§!)\nFood Consumption: §R+25%§! (§YCarnivorous§!)\n§LDescended from a variety of Nebularian-born Loxians brought by the Meopian Expedition which have since adapted to Flusion's conditions, these fox-like humanoids are a resilient race, often trying to find a way to subvert problems by using their natural abilities cunning, however they are still capable of fighting back if possible. On top of a remarkably resilient frame, they also have keen senses allowing them to detect enemies far before they reach visual range or before the enemy finds them. However, as their bodies were once sustained using hyper-nutritive slurry provided to them by the Eden Tree, they now require a large amount of nutrients to keep going and have since turned carnivorous, making food acquisition a very important priority."

