 artillery_equipment_1: "Towed Artillery"
 artillery_equipment_1_short: "Artillery"
 artillery_equipment_1_desc: "Artillery refers to large-caliber weapons, such as cannons and howitzers that are operated by crews, which can project munitions far beyond the effective range of personal weapons."
 rocket_artillery_equipment_1: "Towed Rocket Artillery"
 rocket_artillery_equipment_1_short: "Rocket Artillery"
 rocket_artillery_equipment_1_desc: "Rocket artillery is less accurate and has a much lower sustained rate of fire than batteries of traditional artillery guns. However, they have the capability of simultaneously hitting a target with multiple rockets with devastating effect."
 infantry_equipment_short: "Infantry Eq."
 infantry_equipment_0: "Basic Infantry Equipment"
 infantry_equipment_0_short: "Basic Eq."
 infantry_equipment_0_desc: "Basic infantryman equipment developed before and during the Great War."
 infantry_equipment_1_short: "Weapons I"
 infantry_equipment_2: "Infantry Equipment II"
 infantry_equipment_2_short: "Weapons II"
 infantry_equipment_2_desc: "Personal and crew served weapons for infantry as well as the various other bits of kit a soldier needs. Modernized to include a great number of sub-machineguns and anti-tank rifles."
 infantry_equipment_3: "Infantry Equipment III"
 infantry_equipment_3_short: "Weapons III"
 infantry_equipment_3_desc: "Personal and crew served weapons for infantry as well as the various other bits of kit a soldier needs. Further modernized to include personal Assault Rifles and anti-tank rockets."
 gw_armored_car_equipment: "Inter-War Armored Car"
 gw_armored_car_equipment_desc: "Where previous armored cars were simple commercial models with thin steel plating, this model was designed from the ground up to carry armor and light armament."
 armored_car_equipment_1: "Basic Armored Car"
 armored_car_equipment_1_desc: "An improved internal layout and additional ammunition storage creates a more effective armored car."
 armored_car_equipment_2: "Improved Armored Car"
 armored_car_equipment_2_desc: "Changes on the battlefield require a much heavier armament and thicker armor to defeat enemy light units and survive to report back."
 armored_car_at_equipment: "Anti-Tank Armored Car"
 armored_car_at_equipment_desc: "Our light mechanized units will come into contact with enemy tank forces at some point. Developing a special anti-tank variant would give them a fighting chance."
