 # IDEAS / MODIFIERS
 # ============================================================

 transport_plane_equipment_desc: "Delivers paratroopers to their destination."
 transport_plane_equipment: "Transport Plane"
 ship_hull_carrier: "Carrier"
 ship_hull_carrier_desc: "After years of experiments, the aircraft carrier has slowly matured into its own class of ship. Capable of supporting a growing number of ever more powerful aircraft, the aircraft carrier stands poised to become the last word in naval power projection."
 ship_hull_submarine: "Submarine"
 ship_hull_submarine_desc: "A far cry from the crude boats of the Great War, the modern submarine is more capable than ever before and can threaten even the biggest ship for a very moderate cost."
 ship_hull_light: "Light Hull"
 ship_hull_light_desc: "The lightest screening vessel. Its job is to defend larger ships and to find and destroy submarines."
 armor_desc: "The largest and strongest armor that money can buy."
 armored_car_equipment: "Armored Car"
 armored_car_equipment_desc: "Light-weight armored wheeled vehicles. Common for reconnaissance and resistance suppression, but can be fitted with heavier armaments."
 motorized_equipment: "Truck"
 motorized_equipment_desc: "Trucks used for transporting troops, supplies, and for division motorization."
 mechanized_equipment: "Mechanized"
 mechanized_equipment_desc: "Mechanized infantry are equipped with armored personnel carriers (APCs) or infantry fighting vehicles (IFVs) for transport and combat. Mechanized infantry is distinguished from motorized infantry in that its vehicles provide a degree of protection from hostile fire, as opposed to soft-skinned wheeled vehicles (trucks or jeeps) for motorized infantry."
 anti_air_equipment: "Towed Anti-Aircraft"
 anti_air_equipment_desc: "Anti-aircraft artillery is primarily designed to shoot down hostile planes, although the rapid fire cannons can also be effective against ground targets."
 anti_tank_equipment: "Towed Anti-Tank"
 anti_tank_equipment_desc: "A direct-fire artillery piece firing armor-piercing ammunition to destroy tanks and other hard targets."
 artillery_equipment: "Towed Artillery"
 artillery_equipment_desc: "Artillery refers to large-caliber, crew-served weapons such as cannons and howitzers that can project munitions far beyond the effective range of personal weapons."
 rocket_artillery_equipment: "Towed Rocket Artillery"
 rocket_artillery_equipment_desc: "Rocket artillery is less accurate and has a much lower sustained rate of fire than batteries of traditional artillery guns. However, they have the capability to simultaneously deluge a target with multiple rockets with devastating effect."
 infantry_equipment: "Infantry Equipment"
 infantry_equipment_desc: "Personal and crew served weapons for infantry as well as the various other bits of kit a soldier needs."
 infantry_equipment_1: "Infantry Equipment I"
 infantry_equipment_1_desc: "Personal and crew served weapons for infantry as well as the various other bits of kit a soldier needs."
 guided_missile_equipment: "Guided Missile"
 guided_missile_equipment_desc: "Unmanned flying bomb"
 motorized_rocket_equipment: "Motorized Rocket Artillery"
 motorized_rocket_equipment_desc: "Multiple rocket launchers such as these deliver explosives to a target area more quickly than conventional artillery, but with lower accuracy and requiring a longer time to reload. Being mounted on trucks, this version is able to launch attacks and change positions before the enemy can return fire."
 amphibious_mechanized_equipment: "Amphibious Landing Vehicles"
 amphibious_mechanized_equipment_desc: "Amphibious Tractors, or Amtracs, allow Marines to be landed on a beach under armored protection. However, this comes at the cost of poor fuel efficiency."
 train_equipment: "Train"
 train_equipment_desc: "Trains transport supplies from the Supply Capital to Supply Hubs connected by rail."
 armored_support_vehicle: "Uncrewed Engineering Vehicle"
 armored_support_vehicle_desc: "A heavily protected, remotely operated engineering platform equipped for mine clearance, obstacle breaching, recovery and rapid field construction under fire."

