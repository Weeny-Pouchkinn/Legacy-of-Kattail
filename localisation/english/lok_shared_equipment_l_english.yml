 GER_medium_tank_equipment_2: "Panzerkampfwagen IV"
 GER_medium_tank_equipment_2_short: "Panzer IV"
 GER_medium_tank_equipment_2_desc: "Designed as an infantry support tank, the Panzer IV was not originally intended to engage enemy armor - that function was performed by the lighter Panzer III. However, with the flaws of pre-war doctrine becoming apparent and in the face of Soviet T-34 tanks, the Panzer IV soon assumed the tank-fighting role of its increasingly obsolete cousin. The most widely manufactured and deployed German tank of the Second World War, the Panzer IV was used as the basis for many other fighting vehicles."
