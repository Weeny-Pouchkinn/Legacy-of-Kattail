 medium_tank_destroyer_equipment_1_short: "M. TD I"
 medium_tank_destroyer_equipment_1_desc: "Tank Destroyers are tracked vehicles with a larger than normal gun in a fixed mounting in place of a turret. Medium Tank Destroyers are based on the chassis of Medium Tanks, meaning they are fairly mobile and carry respectable firepower."
