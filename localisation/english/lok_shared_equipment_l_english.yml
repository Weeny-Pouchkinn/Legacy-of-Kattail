 medium_tank_destroyer_equipment: "Medium Tank Destroyer"
 medium_tank_destroyer_equipment_short: "M. Tank Destroyer"
 medium_tank_destroyer_equipment_desc: "Tank Destroyers are tracked vehicles with a larger than normal gun in a fixed mounting in place of a turret. Medium Tank Destroyers are based on the chassis of Medium Tanks, meaning they are fairly mobile and carry respectable firepower."
