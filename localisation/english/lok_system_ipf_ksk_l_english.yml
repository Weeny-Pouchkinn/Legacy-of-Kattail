 lok_IPF_KSK_cat:0 "The IPF and KSK"
 lok_IPF_KSK_cat_desc:0 "Two powerful partisan networks known as the §2Interne Partisanenfront§! or §2IPF§! and the §RKatzensoldaten der Kernländer§! or §RKSK§! operate across the Herzlands. They have been brought together into a loose §gCoalition§! known as the §gIPF-KSK§!, led by §HOberkommandant Katalia Pawnth§!.\n\nEach of the networks has an §Yopinion§! of our government as well as a §Yactivity§! level in our nation. If their opinion is §G1§! or more, they will provide us with §Gbuffs§!, whereas if it is §R-1§! or less, they will instead work §Ragainst us§!.\n\nTheir leaders §Yfrequently move across the Herzlands§! between countries where their networks are established. Managing to strike them down will reduce their network's strength by §Y2§! everywhere and cap its max strength at §Y3§!.\n\n§2INTERNE PARTISANEFRONT§!\nOPINION: [?ROOT.ipf_opinion|+0]\nNETWORK ACTIVITY: §Y[?ROOT.ipf_strength]/6§!\nStability: [?ROOT.ipf_stability_factor|1%=+]\nFactory Output: [?ROOT.ipf_industrial_capacity_factory|1%=+]\nResistance Activity: [?ROOT.ipf_resistance_activity|1%=-]\nResistance Growth: [?ROOT.ipf_resistance_growth|1%=-]\nDaily Market Liberal Support: §Y[?ROOT.ipf_democratic_drift|=]§!\n\n§RKATZENSOLDATEN DER KERNLÄNDER§!\nOPINION: [?ROOT.ksk_opinion|+0]\nNETWORK ACTIVITY: §Y[?ROOT.ksk_strength]/6§!\nWar Support: [?ROOT.ksk_war_support_factor|1%=+]\nProduction Efficiency Cap: [?ROOT.ksk_production_factory_max_efficiency_factor|1%=+]\nCompliance Gain: [?ROOT.ksk_compliance_gain|3=+]\nDaily Communism Support: §Y[?ROOT.ksk_communism_drift|=]§!"
