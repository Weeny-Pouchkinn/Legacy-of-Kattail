 ### City Fall News Events

 LOK_cityfall_news_generic_a:0 "The war escalates..."
 LOK_cityfall_news_generic_b:0 "We shall strike back!"
 LOK_cityfall_news_generic_c:0 "Our advance is relentless!"

 #Fall of Inner Katown (The Katown Pyramid)
 LOK_cityfall_news.1.t:0 "The Fall of Inner Katown"
 LOK_cityfall_news.1.d:0 "Following intense urban warfare, the forces of [new_controller.GetNameDef] have overwhelmed the [old_controller.GetAdjective] garrisons and seized full control of Inner Katown. This marks an important point in the war between the two nations as [old_controller.GetNameDef] loses an important urban center."

