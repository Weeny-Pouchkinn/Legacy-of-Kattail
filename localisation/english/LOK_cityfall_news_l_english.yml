 LOK_cityfall_news_generic_a:0 "The war escalates..."
 LOK_cityfall_news_generic_b:0 "We shall strike back!"
 LOK_cityfall_news_generic_c:0 "Our advance is relentless!"

 #Fall of Inner Katown (The Katown Pyramid)
 LOK_cityfall_news.1.t:0 "The Fall of Inner Katown"
 LOK_cityfall_news.1.d:0 "The outer districts of Katown have been swallowed by battle, but the war is decided only when [new_controller.GetAdjective] troops force their way into the Grand Katown Pyramid itself. Meowrine barracks, armouries and command chambers fall one by one until the Kaiser's old offices are finally secured.\n\nFor generations the Pyramid stood as the seemingly indestructible heart of Katzen power, guarding archives and weapons left behind by the Imperium. Its capture is more than the loss of a city: the old order has been dragged from its fortress and made to kneel."

 #Fall of Lutécie
 LOK_cityfall_news.2.t:0 "The Fall of Lutécie"
 LOK_cityfall_news.2.d:0 "Fighting has reached the avenues, ministries and shipyard districts of Lutécie. After days of barricades and counterattacks, [new_controller.GetAdjective] troops have seized the government quarter and broken the last organised resistance around the capital.\n\nLutécie was the administrative heart of Roqualia and the city from which its anti-Kaiserist ambitions were directed across Solakea. Its docks, communications network and crowded civil offices now belong to [new_controller.GetNameDef]. Whatever government survives elsewhere must do so without the city that made Roqualia a coherent state."

 #Fall of Amphisk (held by Katzens)
 LOK_cityfall_news.3.t:0 "The Fall of Amphisk"
 LOK_cityfall_news.3.d:0 "Amphisk's old industrial wards have once again become a battlefield. The Katzen garrison withdrew into factories, workers' blocks and subterranean service tunnels, but [new_controller.GetAdjective] forces methodically isolated each pocket before storming the central administrative district.\n\nThe city has changed masters more than once since the Kaiser War, yet its foundries, rail links and immense labouring population have always made it worth fighting over. With Amphisk secured, [new_controller.GetNameDef] has captured both a symbol of Confederate resistance and one of the region's most valuable urban-industrial prizes."

 #Fall of Lionsburg
 LOK_cityfall_news.4.t:0 "The Fall of Lionsburg"
 LOK_cityfall_news.4.d:0 "Armoured columns have broken through Lionsburg's approaches and pushed between its factories, warehouses and crowded commercial towers. The federal garrison fought to keep the city linked with Purrlin, but the last road and rail corridors were cut before [new_controller.GetAdjective] troops entered the civic centre.\n\nLionsburg was one half of the federal partnership that bound the southern Katzen states together, as well as a great concentration of industry and private wealth. Its fall leaves that union maimed, depriving [old_controller.GetNameDef] of a city whose factories, financiers and citizens were central to its power."

 #Fall of Auralia (AUR capital)
 LOK_cityfall_news.5.t:0 "The Fall of Auralia"
 LOK_cityfall_news.5.d:0 "The great city of Auralia, seat of [AUR.GetNameDef]'s brutal government, has fallen to [new_controller.GetNameDef]. Following gruelling combat creeping northwards through the tight Auralian Viaduct, and all around the Auralian Bay, the city's garrison scattered to the wind after the overwhelming majority of its soldiers, unwilling to surrender, were killed.\n\nThe Herald of the Kaiser has been evacuated to the countryside and vowed to 'inflict untold retribution upon the Unterflusionian encroachers'. Regardless, with [new_controller.GetNameDef] now in possession of the Great Shipyards of Auralia, and one of the largest urban areas in the Central Herzlands, [AUR.GetNameDef]'s fate is looking increasingly shaky."
 LOK_cityfall_news.5.a:0 "Auralia is taken!"
 LOK_cityfall_news.5.b:0 "The Regency crumbles!"
 LOK_cityfall_news.5.c:0 "Auralia has fallen..."
 LOK_cityfall_news.5.e:0 "A momentous event."
 LOK_cityfall_news.5.f:0 "Acknowledged."

 #Fall of Meownich
 LOK_cityfall_news.6.t:0 "The Fall of Meownich"
 LOK_cityfall_news.6.d:0 "Red banners still hang between the apartment blocks of Meownich as [new_controller.GetAdjective] troops advance through the Communes. Factory militias and local councils turned workshops, tram depots and communal halls into strongpoints, but their improvised defence has finally collapsed around the leadership quarter.\n\nMeownich was built upon the promise that the workers of the Herzlands could govern themselves without Kaiser, corporation or general. That experiment now lies beneath foreign boots. Whether its council members continue the struggle underground or disappear among the refugees, [old_controller.GetNameDef] has lost the city at the centre of its revolution."

 #Fall of Clermeowth
 LOK_cityfall_news.7.t:0 "The Fall of Clermeowth"
 LOK_cityfall_news.7.d:0 "The roads into Clermeowth were defended through orchards, storehouses and fortified villages before the battle reached the city itself. Once [new_controller.GetAdjective] forces secured the rail yards and food depots, the remaining garrison found itself divided and surrendered district by district.\n\nClermeowth is more than another Katzen capital. Its farms and vast orchards provision cities far beyond its borders, while its northern position guards the routes toward the heart of the Herzlands. With the city taken, [old_controller.GetNameDef] has lost both a defensive anchor and a breadbasket that no army can easily replace."

 #Fall of Catburg
 LOK_cityfall_news.8.t:0 "The Fall of Catburg"
 LOK_cityfall_news.8.d:0 "The battle for Catburg ended amid grain silos, rail depots and the offices that administer the southern breadbasket. Local troops and armed corporate guards resisted from opposite ends of the city, but [new_controller.GetAdjective] armour forced open the central avenues and seized the provincial bureaucracy.\n\nCatburg fed tens of millions and connected the farms of the south to the great Herzland cities. Its capture threatens far more than the local government: trains carrying food, fuel and soldiers will now move only with [new_controller.GetNameDef]'s permission. A city has fallen, and an entire region may soon feel the hunger."

 #Fall of Purrlin
 LOK_cityfall_news.9.t:0 "The Fall of Purrlin"
 LOK_cityfall_news.9.d:0 "Street fighting has torn through Purrlin's government quarter and old industrial districts. The defenders attempted to hold the bridges, microreactor works and federal offices long enough for relief from Lionsburg, but [new_controller.GetAdjective] forces cut the connection and raised their flag over the city centre.\n\nPurrlin was the political half of the Purrlin-Lionsburg federation, a city where Katzen republicanism, industry and military research were woven together. Its fall leaves [old_controller.GetNameDef] without one of its principal capitals and turns the surviving federal institutions into little more than a government searching for a country."

 #Fall of Neu-Pawsterdam (KTN capital)
 LOK_cityfall_news.10.t:0 "The Fall of Neu-Pawsterdam"
 LOK_cityfall_news.10.d:0 "The harbour guns fell silent before dawn, allowing [new_controller.GetAdjective] forces to enter Neu-Pawsterdam from sea and land. Fighting continued around the Senate, the central railway terminals and the fortified government sector until the last federal units were driven back from the waterfront.\n\nBuilt on Katzeninsel and sustained by maritime trade, Neu-Pawsterdam was the political and technological centre of the Bondskeizerrijk. Its naval facilities, administrative systems and crowded island districts are now in enemy hands. For a state that prided itself on federal order and command of the southern seas, the loss is almost impossible to overstate."

 #Fall of Frankfurr
 LOK_cityfall_news.11.t:0 "The Fall of Frankfurr"
 LOK_cityfall_news.11.d:0 "The fighting for Frankfurr descended beneath the city as quickly as it consumed the streets above. [new_controller.GetAdjective] troops seized the opera district and Imperial Hall, then forced their way into the vast Kaiser-era bunker complex hidden below the capital.\n\nFrankfurr was the heart of Purrßen politics: a bright, restless city of aircraft, holographic advertisements and old imperial institutions built over a national redoubt. Its surviving officials have fled or been captured, and the bunkers meant to preserve the state now shelter its conquerors. [old_controller.GetNameDef] has lost both its capital and the safest place from which it could hope to rebuild."

 #Fall of Pawris
 LOK_cityfall_news.12.t:0 "The Fall of Pawris"
 LOK_cityfall_news.12.d:0 "Pawris has fallen after bitter fighting beneath the shadow of the Meowiffel Tower. The city's broad avenues became killing grounds while troops battled through museums, ministries and dense northern neighbourhoods, but the last defenders were eventually driven from the centre by [new_controller.GetAdjective] forces.\n\nOne of the largest and most storied cities of the northern Herzlands now lies open to occupation. Pawris carried the culture, pride and political weight of an entire region; its monuments survived emperors and civil wars alike. Whether they survive the present conquerors will say much about what [new_controller.GetNameDef] intends for its new subjects."

 #Fall of Bunville
 LOK_cityfall_news.13.t:0 "The Fall of Bunville"
 LOK_cityfall_news.13.d:0 "The Battlebuns fought from gardens, meeting halls and the modest compounds surrounding Bunville, but the capital was never designed for a modern siege. Once [new_controller.GetAdjective] forces broke through the Imperial Paluush Guard, the royal district and the Council's offices were occupied with startling speed.\n\nBunville was the quiet centre of the Paluush Realms, home to Bunbun's court and a people more accustomed to mastering earth, wind and healing than defending concrete streets. Its fall strikes at the legitimacy of the Royal Paluushes themselves. Across the Realms, isolated Mayorlands must now decide whether to resist, negotiate, or simply wait for their king to return."

 #Fall of Katlantropa Dam
 LOK_cityfall_news.14.t:0 "The Fall of the Katlantropa Dam"
 LOK_cityfall_news.14.d:0 "After a battle fought across spillways, turbine halls and narrow maintenance galleries, [new_controller.GetAdjective] engineers have secured the Katlantropa Dam intact. The defenders' final demolition charges were disarmed before they could rupture the structure, and the locks now answer to [new_controller.GetNameDef].\n\nKatlantropa is no ordinary strongpoint. It controls power generation, water levels and one of the most ambitious transport projects in Amphibia. Whoever holds it can regulate shipping, move armies across its immense crown and threaten every settlement downstream. [old_controller.GetNameDef] has lost a fortress, an artery and a weapon in a single blow."

 #Fall of Jarvalin (KUS capital)
 LOK_cityfall_news.15.t:0 "The Fall of Jarvalin"
 LOK_cityfall_news.15.d:0 "After a pitched last-stand where the defenders, cornered against Lake Overiste to the city's east, bravely fought until all had fallen, the capital of [KUS.GetNameDef] has fallen to advancing [new_controller.GetAdjective] forces.\n\nThe Estalai city, despite grasping for independence after decades of Katzen rule, once more falls to foreign hands. Whether this will bolster or shatter remaining resistance in the countryside is yet to be determined, but it is a blow [old_controller.GetNameDef] is unlikely to recover from."
 LOK_cityfall_news.15.a:0 "Jarvalin is lost!"
 LOK_cityfall_news.15.b:0 "Their capital falls!"
 LOK_cityfall_news.15.c:0 "Jarvalin has fallen..."
 LOK_cityfall_news.15.e:0 "A crushing defeat."
 LOK_cityfall_news.15.f:0 "Capital status: compromised."

 #Fall of Ganymeda
 LOK_cityfall_news.16.t:0 "The Fall of Ganymeda"
 LOK_cityfall_news.16.d:0 "The skyline of Ganymeda burns as [new_controller.GetAdjective] troops force their way through its industrial suburbs and dense residential districts. Solarian units attempted to hold the transit hubs and government buildings, but the last organised defence collapsed after the city was cut off from the other great metropolises.\n\nGanymeda was among Solaria's five greatest cities, second only to Gateway in scale and vital to the federation's economy and administration. Its population, factories and transport network now lie under occupation. The loss does not end Solarian resistance, but it tears a vast hole in the urban system upon which [old_controller.GetNameDef] depends."

 #Fall of Steeloft (MCF capital)
 LOK_cityfall_news.17.t:0 "The Fall of Steeloft"
 LOK_cityfall_news.17.d:0 "Steeloft has not fallen from the sky, but it has fallen. After aircraft and boarding craft overwhelmed its escorts, [new_controller.GetAdjective] troops fought deck by deck through hangars, gun galleries and residential sectors until the bridge and engine controls were secured.\n\nThe flying capital of the Monarchic Cloudstrider Federation carried hundreds of thousands of civilians beneath a forest of naval guns. It was palace, carrier, fortress and city in one, never meant to be risked in direct battle. Now its engines still turn, but for a new master. The government it sheltered has lost both its seat and its greatest means of escape."

 #Fall of Charles (Takicardie)
 LOK_cityfall_news.18.t:0 "The Fall of Charles"
 LOK_cityfall_news.18.d:0 "Takicardie's elaborate defences have finally been breached. [new_controller.GetAdjective] soldiers advanced through streets laid out with more grandeur than sense, navigating hidden passages, ceremonial avenues and an improbable number of trapdoors before surrounding the royal residence in Charles.\n\nThe city was a monument to the monarchy's vanity, built to proclaim that Takicardie was not merely another Roqualian province but a kingdom worthy of awe. With the capital occupied and the royal standards pulled down, that boast rings hollow. Whatever becomes of its famously megalomaniacal Roi, [old_controller.GetNameDef] can no longer pretend that pageantry alone makes a state secure."

 #Fall of Hübschestadt (FSR)
 LOK_cityfall_news.19.t:0 "The Fall of Hübschestadt"
 LOK_cityfall_news.19.d:0 "Hübschestadt has been encircled and taken after its defenders were cut off from the roads leading toward Kusnurk and the Solkatzia Bridge. [new_controller.GetAdjective] forces bypassed the strongest outer positions, then tightened the siege until shortages and constant bombardment shattered resistance inside the city.\n\nAs the seat of [old_controller.GetNameDef] and a key eastern stronghold, Hübschestadt guarded the approaches between Solakea and the Herzlands. Its fall opens routes that were once protected by an entire state's army. The surviving government may continue elsewhere, but it has lost the fortress-city that gave its borders meaning."

 #Fall of Brekarya (Vixenoid capital)
 LOK_cityfall_news.20.t:0 "The Fall of Brekarya"
 LOK_cityfall_news.20.d:0 "Brekarya's dense wards became a maze of barricades as Vixenoid soldiers, sword societies and loyalist volunteers fought to defend the capital. [new_controller.GetAdjective] forces isolated the ministries and communications centres before forcing a final surrender in the central district.\n\nBrekarya was the most crowded city of the Vixenoid state and the place where its government attempted to reconcile ancient codes of honour with the demands of a modern republic. Its fall leaves the provinces without their principal administrative centre and places millions of Vixenoids under foreign rule. The sword may endure, but the hand that directed it has been severed."

 #Fall of Nouvelle Yorke (Quépler/KEP capital)
 LOK_cityfall_news.21.t:0 "The Fall of Nouvelle Yorke"
 LOK_cityfall_news.21.d:0 "Fighting in Nouvelle Yorke spread from the downtown towers to the university quarter and the vast spaceport beyond the city. [new_controller.GetAdjective] troops secured the launch complexes before retreating forces could sabotage them, then entered the capital as the last government broadcasts faded.\n\nNouvelle Yorke was Quepler's window to the stars. Its laboratories, universities and developed spaceport launched probes far beyond Flusion, while its crowded streets embodied the colonial republic's cosmopolitan ambitions. Those facilities now belong to [new_controller.GetNameDef]. For [old_controller.GetNameDef], the loss is not merely territorial: an entire future has been captured on the launchpad."

 #Fall of Elowia (ELO capital)
 LOK_cityfall_news.22.t:0 "The Fall of Elowia"
 LOK_cityfall_news.22.d:0 "The city of Elowia has changed hands once more. Partisans and regular troops fought side by side through the capital's damaged streets, but [new_controller.GetAdjective] forces broke the remaining perimeter and occupied the government buildings before nightfall.\n\nElowia was one of the first warlord states to emerge from the shattered Katzen Imperium, and its people have already endured invasion, occupation and repeated promises of liberation. The fall of the city therefore carries a bitter familiarity. [old_controller.GetNameDef] has lost its namesake capital, but any conqueror expecting obedience may discover that Elowia's population has learned how to survive governments better than governments survive Elowia."

 #Fall of Purrhelmshaven (Festung Kaiserstein capital)
 LOK_cityfall_news.23.t:0 "The Fall of Purrhelmshaven"
 LOK_cityfall_news.23.d:0 "Purrhelmshaven's coastal batteries and fortified harbour delayed the assault, but they could not stop it. [new_controller.GetAdjective] troops landed under heavy fire, captured the docks and forced their way through the old Kaiserstein command works until the capital's final defensive positions surrendered.\n\nThe city commands a strategic island and the waters between larger powers, making its ports valuable far beyond its modest territory. It has been a republic, a fortress and an imperial possession, with each regime leaving bunkers and guns behind. Now another flag rises above Purrhelmshaven, and the strait it watches has acquired a new gatekeeper."

 #Fall of Pawscow (Sobakiland capital)
 LOK_cityfall_news.24.t:0 "The Fall of Pawscow"
 LOK_cityfall_news.24.d:0 "Pawscow's outer defences broke only after prolonged fighting among its factories, broad avenues and fortified workers' districts. [new_controller.GetAdjective] troops then entered the old centre, securing the government quarter and the monuments commemorating Sobakiland's Great Pawtriotic War against the Kaiser.\n\nFor the Sobaki, Pawscow was more than a capital: it was proof that their state had survived the worst the Katzen Imperium could inflict. Its capture therefore reopens wounds that never truly healed. [old_controller.GetNameDef] has lost its political heart, while the fate of its memorials will reveal whether the occupiers seek submission, erasure or revenge."

 #Fall of Tiir (United Military Republic capital)
 LOK_cityfall_news.25.t:0 "The Fall of Tiir"
 LOK_cityfall_news.25.d:0 "The walls of Tiir have been breached. [new_controller.GetAdjective] forces fought through ring after ring of concrete, steel, bunkers and artillery positions, each marking an earlier stage in the capital's growth. The final battle ended around the central plaza and the Republic High Command.\n\nTiir was designed as a fortress before it was allowed to be a city. Even its homes, roads and public buildings formed part of the defence network, while murals preserved the memory of the Kaiser's failed invasion. Its fall is therefore a catastrophe without precedent for [old_controller.GetNameDef]: the stronghold that taught the Republic it could survive anything has finally been overcome."

 #Fall of Thamplatin (Swamplands capital)
 LOK_cityfall_news.26.t:0 "The Fall of Thamplatin"
 LOK_cityfall_news.26.d:0 "The battle for Thamplatin unfolded across causeways, raised districts and waterways that turned every advance into an amphibious operation. Once [new_controller.GetAdjective] troops seized the transport hubs and the provincial command network, the remaining defenders withdrew into the swamps or surrendered.\n\nThamplatin was the capital of the Swamplands, a major city linking wetland settlements to the wider southern trade system. Its administrative offices and infrastructure coordinated a region where roads could vanish beneath water and local knowledge mattered more than maps. With the capital occupied, [old_controller.GetNameDef] has lost the one place capable of making the swamps governable."

 #Fall of Hoxxhagen (Muldvarpe capital)
 LOK_cityfall_news.27.t:0 "The Fall of Hoxxhagen"
 LOK_cityfall_news.27.d:0 "The surface entrances of Hoxxhagen fell quickly; the city beneath them did not. [new_controller.GetAdjective] troops descended through freight shafts, mines and fortified transit tunnels, fighting level by level until the deepest government chambers finally surrendered.\n\nHoxxhagen is the greatest of the Muldvarpe guild cities, a metropolis of many layers that reaches the surface only because centuries of growth carried it there. Embassies and traders occupied the upper districts, while the Confederation's true government worked far below. By capturing its lowest halls, [new_controller.GetNameDef] has conquered not merely a capital, but the buried heart of an entire civilisation."

 #Fall of Grande Loutteria (Loutrien capital)
 LOK_cityfall_news.28.t:0 "The Fall of Grande Loutteria"
 LOK_cityfall_news.28.d:0 "Grande Loutteria has fallen after fighting swept along the peninsula and into the capital's maritime districts. [new_controller.GetAdjective] troops secured the docks, surrounded the Palais and National Assembly, and ended the last resistance around the government quarter.\n\nThe city was the political centre of Loutrien life, where a seafaring republic governed its narrow homeland and watched every ship passing its coast. Its ministries, naval facilities and commercial waterfront now stand under foreign guard. With the capital taken, [old_controller.GetNameDef] is divided between isolated coastal communities and whatever forces escaped inland, while its national institutions have become trophies of war."

 #Fall of Rozzmione (Procione capital)
 LOK_cityfall_news.29.t:0 "The Fall of Rozzmione"
 LOK_cityfall_news.29.d:0 "The fishing fleets returned to a harbour already filled with [new_controller.GetAdjective] warships. After the waterfront was secured, fighting moved uphill through Rozzmione's crowded markets, workshops and administrative quarter until the Procione government was driven from the capital.\n\nRozzmione bound together the coastal communities, forests and mountain districts of the Procione state. Its docks fed the interior, its merchants carried local goods abroad and its officials kept a scattered country functioning. The city now belongs to [new_controller.GetNameDef], leaving [old_controller.GetNameDef] without its principal port and forcing its provinces to choose between isolated resistance and accommodation."

 #Fall of Filosimpàra (Kapybara capital)
 LOK_cityfall_news.30.t:0 "The Fall of Filosimpàra"
 LOK_cityfall_news.30.d:0 "Filosimpàra's civic squares and river approaches have been occupied after a determined defence by the capital guard. [new_controller.GetAdjective] troops pushed past government halls, old republican monuments and crowded residential quarters before securing the city centre.\n\nFor the Kapybaras, Filosimpàra was the western heart of national life: a place of public debate, administration and commerce whose importance extended far beyond its immediate district. Its fall gives [new_controller.GetNameDef] a commanding position over the surrounding settlements and leaves [old_controller.GetNameDef] without the institutions that held its diverse regions together. The republic's voice has been silenced at its source."

 #Fall of Novhurst (Novian Free State capital)
 LOK_cityfall_news.31.t:0 "The Fall of Novhurst"
 LOK_cityfall_news.31.d:0 "The sacred walls of Novhurst have been breached. [new_controller.GetAdjective] forces fought past immense anti-air batteries, weapons factories and fortified arcology entrances before reaching the city's green inner districts and seats of Novian government.\n\nNovhurst was built as both sanctuary and arsenal: a vast capital where tens of millions lived beneath the protection of Nova, the Arikhan and some of the strongest urban defences in the region. Its capture shatters the spiritual and political centre of [old_controller.GetNameDef]. The invaders have taken a city, but they must now govern a population for whom resistance may be a religious duty."

 #Fall of Orient Kapus (Kapilan capital)
 LOK_cityfall_news.32.t:0 "The Fall of Orient Kapus"
 LOK_cityfall_news.32.d:0 "Orient Kapus has fallen after fighting across the eastern capital's avenues, markets and coastal approaches. [new_controller.GetAdjective] forces secured the ducal offices and transport links, cutting the city off from the other Kapybara centres before the remaining garrison laid down its arms.\n\nAs the largest city of the eastern Kaplands, Orient Kapus balanced the western capital and administered a wide collection of agrarian and maritime communities. Its capture tips that balance decisively. [old_controller.GetNameDef] has lost its principal seat in the east, while [new_controller.GetNameDef] now controls the city through which much of the region's trade, authority and communication once flowed."

 #Fall of Himezulte Airbase
 LOK_cityfall_news.33.t:0 "The Fall of Himezulte" 
 LOK_cityfall_news.33.d:0 "The screech of aircraft taking off and landing day and night is replaced by the lower rumbling of tank engines, with the muffled thumping of explosions in the background. Himezulte's ground defences fall first, then its air defences, and [new_controller.GetAdjective] forces systematically divide up the base from every direction. Surrenders are broadcast, hangars are seized. Before the day's end the [new_controller.GetNameDef] flag flies from Himezulte's control towers."
 LOK_cityfall_news.33.a:0 "Concerning." 
 LOK_cityfall_news.33.b:0 "Another step towards reunification." 
 LOK_cityfall_news.33.c:0 "Another nation falls to their ideology." 

 #Fascist Herzlands warlord captures Himezulte Airbase
 LOK_cityfall_news.34.t:0 "Himezulte Is Ours" 
 LOK_cityfall_news.34.d:0 "Though pockmarked by thousands of craters and peppered with debris, the city-sized expanse of asphalt and concrete appears no less flat than it ever did. As tanks roll across it their weight is held easily by runways meant to support cargo planes that themselves carry a dozen armored vehicles. Himezulte's defenses, optimized against the skies, lose turrets and crew with every volley by [ROOT.GetAdjective] artillery.\n\nTwigs crunch under boots as infantry cut up the jungle, isolating and seizing one barracks or support building at a time, while [ROOT.GetAdjective] special forces descend into the depths of the underground hangars, cutting open blast doors and seizing stockpiles of planes. On the surface some defenders turn to repurposing planes as ground vehicles, suppressing the [ROOT.GetAdjective] forces with bomber turrets or gunning down corridors with fighters' machine guns. But they're no substitute for land forces. Once the last of the SAM and flak batteries are disabled, [ROOT.GetLeader]'s finest rappel from helicopters and take over the remaining command buildings. The [ROOT.GetAdjective] army broadcasts a reminder that it will accept surrender. Half an hour later the [ROOT.GetNameDef] flag flies from the tallest of Himezulte's 20-odd control towers.\n\nRebuilding begins almost immediately, as does the sorting of the mountains of planes and equipment seized in the capture, and the vetting and reassignment, if they aren't deemed too loyal to the enemy, of the base's personnel. It is not the Katzen way to waste such resources. To hear the [ROOT.GetNameDef] spokespeople tell it, this was inevitable and necessary. Himezulte is returning to the fold and taking its rightful place among the assets and armies of the Imperium's successor state. The state whose orders will be broadcast from its towers, whose fighters will launch from its runways, whose skies will be guarded by its guns. Whose?\n\nOurs."
 LOK_cityfall_news.34.a:0 "Ours."
