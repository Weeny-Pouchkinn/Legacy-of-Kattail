l_english:

 PTQ_corporatism:0 "Heavy Corporatism"
 PTQ_corporatism_desc:0 "The Quarries depend on an opaque network of private entities in order to get as much wealth out of the mountains as possible as fast as possible. While unquestionably effective, there are doubts about how moral parts of the operations are."

 PTQ_southward_ambitions:0 "Southward Ambitions"
 PTQ_southward_ambitions_desc:0 "Katzpon has privately expressed a desire to expand the Quarries' reach southward into Struken and beyond, but fast action must be taken if other powers are not to sense the same opportunity."

 PTQ_communist_agitation: "Communist Agitation"
 PTQ_communist_agitation_desc: "Harsh work conditions with disregard for life feline and Zuspri alike coupled with agitation from Meownich all combine to put the Quarries at a high risk of civil disorder should tensions be left to grow unchecked."

 PTQ_communist_agitation_tt:0 "The Quarries will collapse into Civil War if Communist Support grows above 50%!"

 # ==================== DECISION CATEGORY ====================
 PTQ_corporate_oversight_cat:0 "Corporate Oversight"
 PTQ_corporate_oversight_cat_desc:0 "The Pawtterston Quarries are sustained by the cooperation of six powerful megacorporations, each operating in their own sphere of influence across our territories. Katzpon must carefully manage these relationships - keeping them satisfied is essential for stability, but their demands are relentless.\n\nPfotenstahl AG: Opinion [?ROOT.ptq_pfotenstahl_opinion|0]/100 -- Winston, Ost-Winston\n  Factory Output: [?ROOT.PTQ_pfotenstahl_industry|%+1] | Arms Factory Speed: [?ROOT.PTQ_pfotenstahl_arms_speed|%+1]\nBergkralle Extraktion: Opinion [?ROOT.ptq_bergkralle_opinion|0]/100 -- Kattenburg\n  Stability: [?ROOT.PTQ_bergkralle_stability|%+1] | Aluminium: [?ROOT.PTQ_bergkralle_aluminium|+0]\nQuarzkatz Mineralien: Opinion [?ROOT.ptq_quarzkatz_opinion|0]/100 -- Deaktiviertekamera, Magnetischergeschwollen\n  Research Speed: [?ROOT.PTQ_quarzkatz_research|%+1] | Max Efficiency: [?ROOT.PTQ_quarzkatz_efficiency|%+1]\nSchnurrbart Fertigung: Opinion [?ROOT.ptq_schnurrbart_opinion|0]/100 -- Gligglepaw, Boogenstadt\n  Consumer Goods: [?ROOT.PTQ_schnurrbart_consumer|%+1] | Line Efficiency: [?ROOT.PTQ_schnurrbart_line_efficiency|%+1]\nSamtpfote Handelsgesellschaft: Opinion [?ROOT.ptq_samtpfote_opinion|0]/100 -- Ezikat, Middenpaw\n  Political Power: [?ROOT.PTQ_samtpfote_pp|%+1] | Supply Consumption: [?ROOT.PTQ_samtpfote_supply|%+1]\nNordlicht Energiewerke: Opinion [?ROOT.ptq_nordlicht_opinion|0]/100 -- Finstratus\n  Construction Speed: [?ROOT.PTQ_nordlicht_construction|%+1] | War Support: [?ROOT.PTQ_nordlicht_war_support|%+1]\n\nOpinions decay by 2 each month. If opinion drops below 10, the corporation will revolt! Grant concessions to maintain relations."

 PTQ_status_no_cost:0 "---"
 PTQ_megacorp_modifier:0 "Megacorp Influence"

 # ==================== PFOTENSTAHL AG ====================
 PTQ_pfotenstahl_status:0 "Pfotenstahl AG -- Heavy Industry"
 PTQ_pfotenstahl_status_desc:0 "Pfotenstahl AG is the premier heavy industry megacorp operating in Winston and Ost-Winston. They specialize in arms manufacturing and factory output.\n\nOpinion of Katzpon: [?ROOT.ptq_pfotenstahl_opinion|0]/100\nStates Controlled: [?ROOT.ptq_pfotenstahl_states|0]\n\nCurrent Bonuses:\nFactory Output: [?ROOT.PTQ_pfotenstahl_industry|%+1]\nArms Factory Speed: [?ROOT.PTQ_pfotenstahl_arms_speed|%+1]\n\nIf opinion drops below 10, this corporation will revolt!"

 PTQ_pfotenstahl_concession_pp:0 "Political Concession to Pfotenstahl AG"
 PTQ_pfotenstahl_concession_pp_desc:0 "Grant political concessions and regulatory favors to Pfotenstahl AG, increasing their opinion of Katzpon by +10.\n\nCurrent Opinion: [?ROOT.ptq_pfotenstahl_opinion|0]/100"
 PTQ_pfotenstahl_concession_material:0 "Material Shipment to Pfotenstahl AG"
 PTQ_pfotenstahl_concession_material_desc:0 "Send 500 Infantry Equipment and 25 PP to Pfotenstahl AG to support their operations, increasing their opinion by +15.\n\nCurrent Opinion: [?ROOT.ptq_pfotenstahl_opinion|0]/100"
 PTQ_pfotenstahl_pressure:0 "Pressure Pfotenstahl AG"
 PTQ_pfotenstahl_pressure_desc:0 "Use political leverage to pressure Pfotenstahl AG into accepting state oversight. This increases stability but angers the corporation.\n\nCurrent Opinion: [?ROOT.ptq_pfotenstahl_opinion|0]/100\nOpinion must be above 30 to pressure."

 PTQ_pfotenstahl_opinion_increase_tt:0 "Pfotenstahl AG opinion of Katzpon increased by 10"
