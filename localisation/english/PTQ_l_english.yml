 # ==================== DEMAND EVENTS ====================
 PTQ_megacorp.1.t:0 "Pfotenstahl AG: Weapons Production Demand"
 PTQ_megacorp.1.d:0 "The board of directors at §GPfotenstahl AG§! has sent a formal demand to Katzpon's office. They require an increase in weapons production throughput in their Winston and Ost-Winston facilities. They are requesting a shipment of §G300 Infantry Equipment§! to retool their factories.\n\nFailure to comply will be seen as a breach of the corporate partnership agreement."
 PTQ_megacorp.1.a:0 "Comply with their demands."
 PTQ_megacorp.1.b:0 "Send a smaller shipment."
 PTQ_megacorp.1.c:0 "Reject their demands."

 PTQ_megacorp.2.t:0 "Bergkralle Extraktion: Mining Expansion Demand"
 PTQ_megacorp.2.d:0 "§GBergkralle Extraktion§! has petitioned for expanded mining rights in Kattenburg. Their geologists have identified new mineral deposits that could significantly boost aluminium output, but they need §G75 Political Power§! worth of regulatory approvals and permits to proceed.\n\nRefusing may strain our relationship with the region's primary employer."
 PTQ_megacorp.2.a:0 "Grant the mining permits."
 PTQ_megacorp.2.b:0 "Offer limited permits."
 PTQ_megacorp.2.c:0 "Deny the request."

 PTQ_megacorp.3.t:0 "Quarzkatz Mineralien: Research Funding Demand"
 PTQ_megacorp.3.d:0 "§GQuarzkatz Mineralien§! has submitted a proposal for expanded research operations in Deaktiviertekamera and Magnetischergeschwollen. They require §G60 Political Power§! in research grants to fund their latest mineral analysis techniques.\n\nTheir discoveries have historically improved our overall industrial efficiency."
 PTQ_megacorp.3.a:0 "Fund their research."
 PTQ_megacorp.3.b:0 "Provide partial funding."
 PTQ_megacorp.3.c:0 "Cut their funding."

 PTQ_megacorp.4.t:0 "Schnurrbart Fertigung: Manufacturing Contract Demand"
 PTQ_megacorp.4.d:0 "§GSchnurrbart Fertigung§! is demanding new manufacturing contracts for their Gligglepaw and Boogenstadt facilities. They want §G200 Infantry Equipment§! and §G25 PP§! in contracts to modernize their production lines.\n\nTheir factories are essential for maintaining consumer goods production across the Quarries."
 PTQ_megacorp.4.a:0 "Award the contracts."
 PTQ_megacorp.4.b:0 "Offer reduced contracts."
 PTQ_megacorp.4.c:0 "No new contracts."

 PTQ_megacorp.5.t:0 "Samtpfote Handelsgesellschaft: Trade Concession Demand"
 PTQ_megacorp.5.d:0 "§GSamtpfote Handelsgesellschaft§! is requesting expanded trade concessions for their Ezikat and Middenpaw operations. They need §G75 Political Power§! worth of tariff reductions and trade route access to maintain their logistics network.\n\nTheir supply chains are vital for keeping the Quarries connected."
 PTQ_megacorp.5.a:0 "Grant the concessions."
 PTQ_megacorp.5.b:0 "Offer limited concessions."
 PTQ_megacorp.5.c:0 "Reject the request."

 PTQ_megacorp.6.t:0 "Nordlicht Energiewerke: Energy Infrastructure Demand"
 PTQ_megacorp.6.d:0 "§GNordlicht Energiewerke§! requires investment in their Finstratus energy grid. They are demanding §G50 Political Power§! and §G100 Support Equipment§! to expand power generation capabilities.\n\nWithout their energy production, many of our industrial operations would grind to a halt."
 PTQ_megacorp.6.a:0 "Invest in the energy grid."
 PTQ_megacorp.6.b:0 "Provide minimal support."
 PTQ_megacorp.6.c:0 "Deny the investment."

 # ==================== SECESSION EVENT ====================
 PTQ_megacorp.10.t:0 "Corporate Secession Crisis!"
 PTQ_megacorp.10.d:0 "§RA megacorporation is threatening to secede from the Quarries!§!\n\nYears of neglect and broken promises have pushed one of our corporate partners to the breaking point. Their board of directors has issued an ultimatum: either Katzpon provides an emergency §G150 Political Power§! bailout package to restore confidence, or they will withdraw their operations entirely.\n\nLosing a megacorp would be devastating — their states would fall into chaos, communist agitators would exploit the vacuum, and our industrial base would be severely weakened."
 PTQ_megacorp.10.a:0 "Emergency bailout! We cannot lose them!"
 PTQ_megacorp.10.b:0 "Let them go. We don't need them."

 PTQ_secession_averted_tt:0 "§GThe corporate secession crisis has been averted. The corporation's opinion has been restored to 25.§!"
 PTQ_secession_executed_tt:0 "§RThe corporation has seceded! Their operations have ceased, stability has plummeted, and communist influence is growing.§!\n§R-15% Stability§!\n§R-10% War Support§!\n§R+5% Communist Support§!"
