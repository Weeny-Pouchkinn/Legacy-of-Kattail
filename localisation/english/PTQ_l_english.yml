l_english:

 PTQ_corporatism:0 "Heavy Corporatism"
 PTQ_corporatism_desc:0 "The Quarries depend on an opaque network of private entities in order to get as much wealth out of the mountains as possible as fast as possible. While unquestionably effective, there are doubts about how moral parts of the operations are."

 PTQ_southward_ambitions:0 "Southward Ambitions"
 PTQ_southward_ambitions_desc:0 "Katzpon has privately expressed a desire to expand the Quarries' reach southward into Struken and beyond, but fast action must be taken if other powers are not to sense the same opportunity."

 PTQ_communist_agitation: "Communist Agitation"
 PTQ_communist_agitation_desc: "Harsh work conditions with disregard for life feline and Zuspri alike coupled with agitation from Meownich all combine to put the Quarries at a high risk of civil disorder should tensions be left to grow unchecked."

 PTQ_communist_agitation_tt:0 "§RThe Quarries will collapse into Civil War if Communist Support grows above 50%!§!"

 # ==================== DECISION CATEGORY ====================
 PTQ_corporate_oversight_cat:0 "Corporate Oversight"
 PTQ_corporate_oversight_cat_desc:0 "The Pawtterston Quarries are sustained by the cooperation of six powerful megacorporations, each operating in their own sphere of influence across our territories. Katzpon must carefully manage these relationships - keeping them satisfied is essential for stability, but their demands are relentless.\n\n§GPfotenstahl AG§!: Opinion §G[?ROOT.ptq_pfotenstahl_opinion|0]§!/100 — §2Winston, Ost-Winston§!\n§GBergkralle Extraktion§!: Opinion §G[?ROOT.ptq_bergkralle_opinion|0]§!/100 — §2Kattenburg§!\n§GQuarzkatz Mineralien§!: Opinion §G[?ROOT.ptq_quarzkatz_opinion|0]§!/100 — §2Deaktiviertekamera, Magnetischergeschwollen§!\n§GSchnurrbart Fertigung§!: Opinion §G[?ROOT.ptq_schnurrbart_opinion|0]§!/100 — §2Gligglepaw, Boogenstadt§!\n§GSamtpfote Handelsgesellschaft§!: Opinion §G[?ROOT.ptq_samtpfote_opinion|0]§!/100 — §2Ezikat, Middenpaw§!\n§GNordlicht Energiewerke§!: Opinion §G[?ROOT.ptq_nordlicht_opinion|0]§!/100 — §2Finstratus§!\n\n§ROpinions decay by 2 each month. Grant concessions to maintain relations!§!"

 PTQ_status_no_cost:0 "—"

 # ==================== PFOTENSTAHL AG ====================
