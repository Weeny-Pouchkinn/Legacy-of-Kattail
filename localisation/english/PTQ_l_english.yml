 # ==================== PRESSURE & SUMMIT DECISIONS ====================
 PTQ_pressure_tt:0 "The corporation has been pressured into accepting state oversight. Their opinion decreased by 10, but stability increased."
 PTQ_corporate_summit:0 "Host Corporate Summit"
 PTQ_corporate_summit_desc:0 "Invite all megacorp leaders to a grand summit in Winston to discuss the future of the Quarries. The goodwill generated will improve relations with all corporations.\n\nAll non-seceded corporations gain +5 opinion."
 PTQ_summit_tt:0 "All corporations' opinion of Katzpon increased by 5."

 # ==================== DEMAND EVENTS ====================
 PTQ_megacorp.1.t:0 "Pfotenstahl AG: Weapons Production Demand"
 PTQ_megacorp.1.d:0 "The board of directors at Pfotenstahl AG has sent a formal demand to Katzpon's office. They require an increase in weapons production throughput in their Winston and Ost-Winston facilities. They are requesting a shipment of 300 Infantry Equipment to retool their factories.\n\nFailure to comply will be seen as a breach of the corporate partnership agreement."
 PTQ_megacorp.1.a:0 "Comply with their demands."
 PTQ_megacorp.1.b:0 "Send a smaller shipment."
 PTQ_megacorp.1.c:0 "Reject their demands."

 PTQ_megacorp.2.t:0 "Bergkralle Extraktion: Mining Expansion Demand"
 PTQ_megacorp.2.d:0 "Bergkralle Extraktion has petitioned for expanded mining rights in Kattenburg. Their geologists have identified new mineral deposits that could significantly boost aluminium output, but they need 75 Political Power worth of regulatory approvals and permits to proceed.\n\nRefusing may strain our relationship with the region's primary employer."
 PTQ_megacorp.2.a:0 "Grant the mining permits."
 PTQ_megacorp.2.b:0 "Offer limited permits."
 PTQ_megacorp.2.c:0 "Deny the request."

 PTQ_megacorp.3.t:0 "Quarzkatz Mineralien: Research Funding Demand"
 PTQ_megacorp.3.d:0 "Quarzkatz Mineralien has submitted a proposal for expanded research operations in Deaktiviertekamera and Magnetischergeschwollen. They require 60 Political Power in research grants to fund their latest mineral analysis techniques.\n\nTheir discoveries have historically improved our overall industrial efficiency."
 PTQ_megacorp.3.a:0 "Fund their research."
 PTQ_megacorp.3.b:0 "Provide partial funding."
 PTQ_megacorp.3.c:0 "Cut their funding."

 PTQ_megacorp.4.t:0 "Schnurrbart Fertigung: Manufacturing Contract Demand"
 PTQ_megacorp.4.d:0 "Schnurrbart Fertigung is demanding new manufacturing contracts for their Gligglepaw and Boogenstadt facilities. They want 200 Infantry Equipment and 25 PP in contracts to modernize their production lines.\n\nTheir factories are essential for maintaining consumer goods production across the Quarries."
 PTQ_megacorp.4.a:0 "Award the contracts."
 PTQ_megacorp.4.b:0 "Offer reduced contracts."
 PTQ_megacorp.4.c:0 "No new contracts."

 PTQ_megacorp.5.t:0 "Samtpfote Handelsgesellschaft: Trade Concession Demand"
 PTQ_megacorp.5.d:0 "Samtpfote Handelsgesellschaft is requesting expanded trade concessions for their Ezikat and Middenpaw operations. They need 75 Political Power worth of tariff reductions and trade route access to maintain their logistics network.\n\nTheir supply chains are vital for keeping the Quarries connected."
 PTQ_megacorp.5.a:0 "Grant the concessions."
 PTQ_megacorp.5.b:0 "Offer limited concessions."
 PTQ_megacorp.5.c:0 "Reject the request."

 PTQ_megacorp.6.t:0 "Nordlicht Energiewerke: Energy Infrastructure Demand"
 PTQ_megacorp.6.d:0 "Nordlicht Energiewerke requires investment in their Finstratus energy grid. They are demanding 50 Political Power and 100 Support Equipment to expand power generation capabilities.\n\nWithout their energy production, many of our industrial operations would grind to a halt."
 PTQ_megacorp.6.a:0 "Invest in the energy grid."
 PTQ_megacorp.6.b:0 "Provide minimal support."
 PTQ_megacorp.6.c:0 "Deny the investment."

 # ==================== REVOLT EVENTS ====================
 PTQ_megacorp.20.t:0 "Corporate Revolt!"
 PTQ_megacorp.20.d:0 "A megacorporation has declared open revolt against Katzpon's authority!\n\nYears of neglect and broken promises have pushed one of our corporate partners past the breaking point. Their private security forces have mobilized and they are threatening armed resistance. Either Katzpon provides an emergency 150 Political Power bailout package to restore confidence, or military force must be used to suppress them.\n\nIf the revolt is crushed, the defeated corporation's territories will be redistributed to another megacorp."
 PTQ_megacorp.20.a:0 "Emergency bailout! We cannot afford a revolt!"
 PTQ_megacorp.20.b:0 "Crush them. Their lands will go to the loyal."

 PTQ_revolt_averted_tt:0 "The corporate revolt has been averted. The corporation's opinion has been restored to 25."
 PTQ_revolt_executed_tt:0 "The corporation has revolted! Their operations have ceased, stability has plummeted, and communist influence is growing.\n-15% Stability\n-10% War Support\n+5% Communist Support\nTheir territories will be redistributed to a loyal corporation."

 PTQ_megacorp.21.t:0 "Revolt Aftermath: Territories Redistributed"
 PTQ_megacorp.21.d:0 "The revolt has been crushed and the defeated corporation's territories have been redistributed to a loyal megacorporation. The receiving corporation is pleased with this expansion of their influence, and their opinion of Katzpon has improved.\n\nThe Quarries endure, though not without scars."
 PTQ_megacorp.21.a:0 "The Quarries endure."
 PTQ_revolt_aftermath_tt:0 "A loyal corporation has absorbed the territories of the defeated corporation. Their opinion increased by 15."

 # ==================== CONQUERED STATE COMPETITION ====================
 PTQ_megacorp.30.t:0 "Corporate Scramble for New Territory"
 PTQ_megacorp.30.d:0 "Our recent territorial conquest has attracted the attention of two competing megacorporations, both eager to extend their operations into the newly acquired region. Each corporation has submitted proposals for development, and Katzpon must decide which one to favor.\n\nThe chosen corporation will gain +10 opinion, while the rejected one will lose -10 opinion."
 PTQ_megacorp.30.a:0 "Award it to the first corporation."
 PTQ_megacorp.30.b:0 "Award it to the second corporation."
 PTQ_state_awarded_corp1_tt:0 "The first corporation has been awarded control of the new territory. Their opinion increased by 10 while the rejected corporation's opinion decreased by 10."
 PTQ_state_awarded_corp2_tt:0 "The second corporation has been awarded control of the new territory. Their opinion increased by 10 while the rejected corporation's opinion decreased by 10."
